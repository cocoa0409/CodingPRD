scenario: |
  University Counseling Center Operations (campus counseling center): triage/intake screening & risk assessment, session limits & referral to community providers, group therapy & workshop scheduling, crisis walk-in coverage & after-hours line, no-show/cancellation policy, records confidentiality separate from academic record, insurance billing vs student-fee funded model, outcome measurement & capacity reporting

domain_name: university-counseling-center
api_prefix: /ucc

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: student_number
        type: string
        source: input
        description: Institution-issued student number. Unique per student.
        constraints: "Unique across all Students; immutable after creation"
      - name: full_name
        type: string
        source: input
        description: Legal full name of the student
      - name: enrollment_status
        type: enum
        source: input
        description: Academic enrollment standing used to gate counseling eligibility
        constraints: "One of {ENROLLED, LEAVE_OF_ABSENCE, WITHDRAWN, GRADUATED}"
      - name: funding_model
        type: enum
        source: input
        description: How the student's counseling is funded
        constraints: "One of {STUDENT_FEE, INSURANCE, SPLIT}"
      - name: academic_record_flags
        type: array
        source: input
        description: Non-clinical academic flags (e.g. PROBATION) visible to Registrar; MUST NOT contain any clinical content
      - name: no_show_strike_count
        type: integer
        source: computed
        description: Count of chargeable no-shows recorded against the student in the current policy window; recomputed by no_show_strike_total
        default: 0
      - name: strike_reset_anchor
        type: datetime
        source: system
        description: Timestamp of the latest ClinicalDirector strike reset; no_show_strike_total counts only NO_SHOW_CHARGED sessions mutated after this anchor
        constraints: "Defaults to the epoch (1970-01-01T00:00:00Z)"
      - name: booking_posture
        type: enum
        source: computed
        description: Derived gate on new session booking; recomputed after every strike change and every policy-window rollover
        constraints: "One of {CLEAR, RESTRICTED, SUSPENDED}"
        default: CLEAR

  - name: Counselor
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: Professional license identifier; unique
        constraints: "Unique across all Counselors"
      - name: full_name
        type: string
        source: input
        description: Display name
      - name: specialties
        type: array
        source: input
        description: List of specialty codes used for referral matching
      - name: weekly_individual_capacity
        type: integer
        source: input
        description: Maximum number of individual sessions this counselor may hold in SCHEDULED or HELD state at any instant
        constraints: "Integer >= 1"
      - name: max_caseload_risk_points
        type: integer
        source: input
        description: Maximum sum of current risk points across all OPEN episodes assigned to this counselor
        constraints: "Integer >= 1"
      - name: active
        type: boolean
        source: input
        description: Whether the counselor is currently schedulable
        default: true

  - name: IntakeAssessment
    parent: null
    common_fields: false
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student being screened"
      - name: screener_id
        type: string
        source: input
        description: "FK -> Counselor.id; the triage screener performing the intake"
      - name: phq9_score
        type: integer
        source: input
        description: PHQ-9 depression screen total
        constraints: "Integer 0..27"
      - name: gad7_score
        type: integer
        source: input
        description: GAD-7 anxiety screen total
        constraints: "Integer 0..21"
      - name: ideation_flag
        type: boolean
        source: input
        description: Whether the student endorsed suicidal ideation on the screener
      - name: recent_attempt_flag
        type: boolean
        source: input
        description: Whether the student reports an attempt within the trailing 90 days
      - name: risk_points
        type: integer
        source: computed
        description: Composite risk points produced by intake_risk_score; immutable once set
      - name: risk_band
        type: enum
        source: computed
        description: Band derived from risk_points by intake_risk_score
        constraints: "One of {LOW, MODERATE, HIGH, CRITICAL}"
      - name: disposition
        type: enum
        source: system
        description: Routing decision recorded at intake completion
        constraints: "One of {PENDING, SHORT_TERM_CARE, COMMUNITY_REFERRAL, CRISIS_PROTOCOL}"

  - name: CareEpisode
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; owner of the episode"
      - name: primary_counselor_id
        type: string
        source: input
        description: "FK -> Counselor.id; assigned primary counselor"
      - name: intake_assessment_id
        type: string
        source: input
        description: "FK -> IntakeAssessment.id; intake that opened this episode; null when the episode was created by a crisis RETURN_TO_CARE disposition"
        constraints: "Nullable"
      - name: academic_term
        type: string
        source: input
        description: Term code (e.g. 2026-FALL) the episode's session limit is scoped to
      - name: session_limit
        type: integer
        source: computed
        description: Maximum reimbursable individual sessions this episode may complete within its academic_term; derived by session_limit_for_episode from risk band and funding model
      - name: sessions_consumed
        type: integer
        source: computed
        description: Count of linked Sessions in state COMPLETED plus state NO_SHOW_CHARGED; maintained by session_consumption_ledger
        default: 0
      - name: status
        type: enum
        source: system
        description: Episode lifecycle
        constraints: "One of {OPEN, EXHAUSTED, REFERRED_OUT, CLOSED, REOPENED}"
      - name: prior_episode_id
        type: string
        source: input
        description: "FK -> CareEpisode.id; when this episode is a REOPENED continuation, points at the episode it continues; null otherwise"
      - name: exemption_granted
        type: boolean
        source: system
        description: Whether a ClinicalDirector has granted a session-limit exemption on this episode
        default: false

  - name: Session
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> CareEpisode.id; episode this session bills against"
      - name: counselor_id
        type: string
        source: input
        description: "FK -> Counselor.id; delivering counselor"
      - name: starts_at
        type: datetime
        source: input
        description: Session start (UTC); must be in the future at booking time
      - name: duration_minutes
        type: integer
        source: input
        description: Length of the session
        constraints: "One of {30, 45, 60}"
      - name: status
        type: enum
        source: system
        description: Session lifecycle
        constraints: "One of {SCHEDULED, HELD, COMPLETED, CANCELLED_TIMELY, CANCELLED_LATE, NO_SHOW_CHARGED, NO_SHOW_EXCUSED}"
      - name: cancellation_reason
        type: string
        source: input
        description: Free-text reason supplied on cancellation
      - name: billed_amount_cents
        type: integer
        source: computed
        description: Amount billed for this session per session_billing_amount; 0 for student-fee-funded sessions and excused no-shows
        default: 0

  - name: GroupProgram
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Program name
      - name: facilitator_id
        type: string
        source: input
        description: "FK -> Counselor.id; facilitating counselor"
      - name: capacity
        type: integer
        source: input
        description: Maximum number of enrolled students
        constraints: "Integer >= 1"
      - name: meeting_day
        type: string
        source: input
        description: Weekday code the program meets (e.g. TUE)
      - name: starts_at
        type: datetime
        source: input
        description: First meeting datetime (UTC)
      - name: weeks
        type: integer
        source: input
        description: Number of weekly meetings
        constraints: "Integer 1..16"
      - name: risk_band_ceiling
        type: enum
        source: input
        description: Highest risk band permitted to enroll (inclusive). CRITICAL students are never group-eligible.
        constraints: "One of {LOW, MODERATE, HIGH}"
      - name: status
        type: enum
        source: system
        description: Program lifecycle
        constraints: "One of {DRAFT, OPEN, RUNNING, COMPLETED, CANCELLED}"

  - name: GroupEnrollment
    parent: null
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> GroupProgram.id"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: status
        type: enum
        source: system
        description: Enrollment lifecycle; WAITLISTED entries promote in created_at order
        constraints: "One of {ENROLLED, WAITLISTED, DROPPED, REMOVED_RISK}"

  - name: CrisisShift
    parent: null
    common_fields: true
    fields:
      - name: coverage_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the shift covers
      - name: shift_kind
        type: enum
        source: input
        description: Walk-in daytime coverage vs after-hours phone line
        constraints: "One of {WALK_IN, AFTER_HOURS}"
      - name: starts_at
        type: datetime
        source: input
        description: Shift start (UTC)
      - name: ends_at
        type: datetime
        source: input
        description: Shift end (UTC); must be strictly after starts_at
      - name: claimed_by_id
        type: string
        source: system
        description: "FK -> Counselor.id; counselor who claimed the shift; null while UNCLAIMED"
      - name: status
        type: enum
        source: system
        description: Shift lifecycle
        constraints: "One of {UNCLAIMED, CLAIMED, RELEASED, COVERED}"

  - name: CrisisVisit
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student presenting in crisis"
      - name: shift_id
        type: string
        source: input
        description: "FK -> CrisisShift.id; shift covering this visit"
      - name: presenting_risk_band
        type: enum
        source: input
        description: Screener-assessed band at presentation
        constraints: "One of {LOW, MODERATE, HIGH, CRITICAL}"
      - name: status
        type: enum
        source: system
        description: Visit lifecycle; ESCALATED may loop back to STABILIZED and re-escalate
        constraints: "One of {QUEUED, IN_ROOM, STABILIZED, ESCALATED, DISPOSITIONED}"
      - name: disposition
        type: enum
        source: system
        description: Terminal routing of the visit
        constraints: "One of {NONE, RETURN_TO_CARE, COMMUNITY_REFERRAL, EMERGENCY_TRANSPORT}"
        default: NONE

  - name: CommunityReferral
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: episode_id
        type: string
        source: input
        description: "FK -> CareEpisode.id; episode whose exhaustion triggered the referral; null for intake-routed (HIGH-band) and crisis-routed referrals"
        constraints: "Nullable"
      - name: provider_name
        type: string
        source: input
        description: Community provider the student is referred to; null while PENDING
        constraints: "Nullable"
      - name: required_specialty
        type: string
        source: input
        description: Specialty code the provider must cover; defaults to 'GEN' when created by an intake/crisis cascade
        default: GEN
      - name: status
        type: enum
        source: system
        description: Referral lifecycle; DECLINED loops back to PENDING for re-matching
        constraints: "One of {PENDING, MATCHED, ACCEPTED, DECLINED, COMPLETED, LAPSED}"
      - name: rematch_count
        type: integer
        source: system
        description: Number of DECLINED->PENDING rematch loops consumed; incremented on each rematch; hard cap 3 (a 4th attempt fails with ERR_REFERRAL_LOOP_EXHAUSTED)
        default: 0

  - name: OutcomeMeasure
    parent: null
    common_fields: false
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> CareEpisode.id"
      - name: instrument
        type: enum
        source: input
        description: Outcome instrument administered
        constraints: "One of {PHQ9, GAD7, CCAPS}"
      - name: phase
        type: enum
        source: input
        description: Administration point in the episode
        constraints: "One of {BASELINE, MID, DISCHARGE}"
      - name: score
        type: integer
        source: input
        description: Instrument total score
        constraints: "Integer >= 0"

  - name: SemesterPolicy
    parent: null
    common_fields: true
    fields:
      - name: academic_term
        type: string
        source: input
        description: Term code this policy governs; unique
        constraints: "Unique across all SemesterPolicies"
      - name: base_session_limit
        type: integer
        source: input
        description: Base individual-session entitlement per episode for the term
        constraints: "Integer >= 0"
      - name: no_show_strike_limit
        type: integer
        source: input
        description: Chargeable no-show count at or above which booking_posture becomes SUSPENDED
        constraints: "Integer >= 1"
      - name: late_cancel_window_hours
        type: integer
        source: input
        description: Cancellation lead time under which a cancel is treated as late
        constraints: "Integer >= 0"
      - name: policy_status
        type: enum
        source: system
        description: DRAFT policies are editable; exactly one PUBLISHED policy per term; RETIRED policies are read-only
        constraints: "One of {DRAFT, PUBLISHED, RETIRED}"

  - name: ClinicalNote
    parent: null
    common_fields: false
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> Session.id; session this note documents"
      - name: author_id
        type: string
        source: input
        description: "FK -> Counselor.id; note author; only the author or a ClinicalDirector may read it"
      - name: body
        type: string
        source: input
        description: Clinical narrative. CONFIDENTIAL — part of the counseling record, never the academic record.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Student
    initial_state: CLEAR
    terminal_states: []
    note: "booking_posture state machine on the Student (field booking_posture)"
    transitions:
      - from: CLEAR
        to: RESTRICTED
        trigger: "system: no_show_strike_total recompute after a NO_SHOW_CHARGED transition"
        actor: system
        preconditions:
          - "recomputed no_show_strike_count == published_policy.no_show_strike_limit - 1"
        side_effects:
          - "Student.booking_posture := RESTRICTED; Student.updated_at refreshed; Student.version += 1"
      - from: CLEAR
        to: SUSPENDED
        trigger: "system: no_show_strike_total recompute after a NO_SHOW_CHARGED transition"
        actor: system
        preconditions:
          - "recomputed no_show_strike_count >= published_policy.no_show_strike_limit"
        side_effects:
          - "Student.booking_posture := SUSPENDED; Student.version += 1"
          - "Cancel every Session for this student in state SCHEDULED whose starts_at is strictly after now: each becomes CANCELLED_TIMELY with cancellation_reason 'POLICY_SUSPENSION', and each cancelled Session decrements its episode's sessions_consumed only if it had been counted (SCHEDULED sessions are not counted, so no decrement)"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system: no_show_strike_total recompute after a NO_SHOW_CHARGED transition"
        actor: system
        preconditions:
          - "recomputed no_show_strike_count >= published_policy.no_show_strike_limit"
        side_effects:
          - "Student.booking_posture := SUSPENDED; Student.version += 1"
          - "Same future-session cancellation cascade as CLEAR->SUSPENDED"
      - from: RESTRICTED
        to: CLEAR
        trigger: "system: no_show_strike_total recompute after a NO_SHOW_EXCUSED adjudication"
        actor: system
        preconditions:
          - "recomputed no_show_strike_count < published_policy.no_show_strike_limit - 1"
        side_effects:
          - "Student.booking_posture := CLEAR; Student.version += 1"
      - from: SUSPENDED
        to: CLEAR
        trigger: "POST /ucc/students/{id}/strikes/reset (ClinicalDirector resets strikes after review)"
        actor: ClinicalDirector
        preconditions:
          - "Student.booking_posture == SUSPENDED"
        side_effects:
          - "Student.strike_reset_anchor := current logical clock; no_show_strike_count recomputes to 0; Student.booking_posture := CLEAR; Student.version += 1"

  - entity: IntakeAssessment
    initial_state: PENDING
    terminal_states: [SHORT_TERM_CARE, COMMUNITY_REFERRAL, CRISIS_PROTOCOL]
    note: "disposition state machine; entity is immutable, disposition set exactly once via the complete endpoint"
    transitions:
      - from: PENDING
        to: SHORT_TERM_CARE
        trigger: "POST /ucc/intake-assessments/{id}/complete"
        actor: TriageScreener
        preconditions:
          - "computed risk_band IN {LOW, MODERATE}"
          - "Student.enrollment_status == ENROLLED"
          - "payload primary_counselor_id present and counselor active"
          - "intersession guard: if no PUBLISHED SemesterPolicy exists for the payload academic_term and risk_band == LOW, reject with ERR_RISK_BAND_VIOLATION (intersession reserves capacity for acute need)"
        side_effects:
          - "Create CareEpisode for this student with session_limit from session_limit_for_episode, status OPEN, intake_assessment_id = this assessment, academic_term from payload (defaulting to the term of the currently PUBLISHED policy)"
          - "CareEpisode creation recomputes counselor caseload risk points via counselor_caseload_load"
      - from: PENDING
        to: COMMUNITY_REFERRAL
        trigger: "POST /ucc/intake-assessments/{id}/complete"
        actor: TriageScreener
        preconditions:
          - "computed risk_band == HIGH"
        side_effects:
          - "Create CommunityReferral (status PENDING, provider_name null) linked to the student with episode_id null and required_specialty := 'GEN'; no CareEpisode is created"
      - from: PENDING
        to: CRISIS_PROTOCOL
        trigger: "POST /ucc/intake-assessments/{id}/complete"
        actor: TriageScreener
        preconditions:
          - "computed risk_band == CRITICAL"
          - "a WALK_IN CrisisShift in status CLAIMED exists whose [starts_at, ends_at) contains the current logical clock; otherwise the completion fails with ERR_NO_CRISIS_COVERAGE and disposition remains PENDING"
        side_effects:
          - "Create CrisisVisit (status QUEUED) for the student against that CLAIMED WALK_IN shift (if several qualify, the one with earliest starts_at; tie-break CrisisShift.created_at ASC)"

  - entity: CareEpisode
    initial_state: OPEN
    terminal_states: [CLOSED, REFERRED_OUT, REOPENED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system: session_consumption_ledger recompute after a Session enters COMPLETED or NO_SHOW_CHARGED"
        actor: system
        preconditions:
          - "recomputed sessions_consumed >= session_limit"
          - "exemption_granted == false"
        side_effects:
          - "CareEpisode.status := EXHAUSTED; version += 1"
          - "Create CommunityReferral (status PENDING) for the student linked to this episode (exhaustion referral)"
          - "Cancel this episode's remaining SCHEDULED sessions: each becomes CANCELLED_TIMELY with cancellation_reason 'EPISODE_EXHAUSTED'"
      - from: OPEN
        to: CLOSED
        trigger: "POST /ucc/episodes/{id}/close"
        actor: Counselor
        preconditions:
          - "acting counselor is episode.primary_counselor_id OR actor is ClinicalDirector"
          - "no linked Session in state SCHEDULED or HELD"
        side_effects:
          - "CareEpisode.status := CLOSED; version += 1"
          - "Recompute counselor_caseload_load for primary_counselor_id (risk points released)"
      - from: OPEN
        to: REFERRED_OUT
        trigger: "system: linked CommunityReferral transitions to ACCEPTED"
        actor: system
        preconditions:
          - "CareEpisode.status == OPEN"
        side_effects:
          - "CareEpisode.status := REFERRED_OUT; version += 1"
          - "Cancel remaining SCHEDULED sessions with cancellation_reason 'REFERRED_OUT'"
          - "Recompute counselor_caseload_load for primary_counselor_id"
      - from: EXHAUSTED
        to: REFERRED_OUT
        trigger: "system: linked CommunityReferral transitions to ACCEPTED"
        actor: system
        preconditions:
          - "CareEpisode.status == EXHAUSTED"
        side_effects:
          - "CareEpisode.status := REFERRED_OUT; version += 1"
          - "Recompute counselor_caseload_load for primary_counselor_id"
      - from: EXHAUSTED
        to: OPEN
        trigger: "POST /ucc/episodes/{id}/exemptions (ClinicalDirector grants exemption)"
        actor: ClinicalDirector
        preconditions:
          - "CareEpisode.status == EXHAUSTED"
        side_effects:
          - "CareEpisode.exemption_granted := true; CareEpisode.status := OPEN; version += 1"
          - "session_limit += EXEMPTION_BONUS_SESSIONS (constant 4); sessions_consumed is NOT modified"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /ucc/episodes/{id}/reopen"
        actor: Counselor
        preconditions:
          - "acting counselor is episode.primary_counselor_id OR actor is ClinicalDirector"
          - "payload intake_assessment_id references an IntakeAssessment for the same student that is still PENDING (never completed), whose created_at is after this episode's closure, and whose computed risk_band IN {LOW, MODERATE}"
        side_effects:
          - "The referenced IntakeAssessment is completed as part of this action: disposition := SHORT_TERM_CARE"
          - "THIS episode's status := REOPENED (it stays terminal: no further transitions out of REOPENED); version += 1"
          - "Create a NEW CareEpisode with status OPEN, prior_episode_id = this episode's id, intake_assessment_id = the referenced assessment, primary_counselor_id = the referenced assessment's screener_id, academic_term from payload, session_limit recomputed by session_limit_for_episode"
          - "The new episode inherits no sessions_consumed; ledger restarts at 0"

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_TIMELY, CANCELLED_LATE, NO_SHOW_CHARGED, NO_SHOW_EXCUSED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /ucc/sessions/{id}/hold (front desk places a brief hold pending payment confirmation)"
        actor: FrontDesk
        preconditions:
          - "Session.status == SCHEDULED"
        side_effects:
          - "Session.status := HELD; version += 1"
      - from: HELD
        to: SCHEDULED
        trigger: "POST /ucc/sessions/{id}/release-hold"
        actor: FrontDesk
        preconditions:
          - "Session.status == HELD"
        side_effects:
          - "Session.status := SCHEDULED; version += 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /ucc/sessions/{id}/complete"
        actor: Counselor
        preconditions:
          - "acting counselor is Session.counselor_id OR actor is ClinicalDirector"
          - "current logical clock >= Session.starts_at"
        side_effects:
          - "Session.status := COMPLETED; billed_amount_cents := session_billing_amount; version += 1"
          - "session_consumption_ledger: episode.sessions_consumed += 1; episode version += 1; if the recompute crosses session_limit, trigger CareEpisode OPEN->EXHAUSTED cascade"
      - from: HELD
        to: COMPLETED
        trigger: "POST /ucc/sessions/{id}/complete"
        actor: Counselor
        preconditions:
          - "acting counselor is Session.counselor_id OR actor is ClinicalDirector"
          - "current logical clock >= Session.starts_at"
        side_effects:
          - "Same as SCHEDULED->COMPLETED"
      - from: SCHEDULED
        to: CANCELLED_TIMELY
        trigger: "POST /ucc/sessions/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "hours until Session.starts_at >= published_policy.late_cancel_window_hours"
        side_effects:
          - "Session.status := CANCELLED_TIMELY; version += 1; no consumption, no billing"
      - from: SCHEDULED
        to: CANCELLED_LATE
        trigger: "POST /ucc/sessions/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "hours until Session.starts_at < published_policy.late_cancel_window_hours"
        side_effects:
          - "Session.status := CANCELLED_LATE; billed_amount_cents := late-cancel fee per session_billing_amount; version += 1"
      - from: SCHEDULED
        to: NO_SHOW_CHARGED
        trigger: "POST /ucc/sessions/{id}/mark-no-show (chargeable determination)"
        actor: Counselor
        preconditions:
          - "current logical clock > Session.starts_at"
          - "Session.status == SCHEDULED"
          - "payload chargeable == true"
        side_effects:
          - "Session.status := NO_SHOW_CHARGED; billed_amount_cents := no-show charge per session_billing_amount; version += 1"
          - "session_consumption_ledger: episode.sessions_consumed += 1; if crossing limit, episode EXHAUSTED cascade fires"
          - "no_show_strike_total: student.no_show_strike_count += 1; booking_posture recompute may fire CLEAR->RESTRICTED, CLEAR->SUSPENDED, or RESTRICTED->SUSPENDED including its future-session cancellation cascade"
      - from: SCHEDULED
        to: NO_SHOW_EXCUSED
        trigger: "POST /ucc/sessions/{id}/mark-no-show (excused determination)"
        actor: Counselor
        preconditions:
          - "current logical clock > Session.starts_at"
          - "Session.status == SCHEDULED"
          - "payload chargeable == false"
        side_effects:
          - "Session.status := NO_SHOW_EXCUSED; billed_amount_cents := 0; version += 1; no consumption, no strike"
      - from: NO_SHOW_CHARGED
        to: NO_SHOW_EXCUSED
        trigger: "POST /ucc/sessions/{id}/excuse (ClinicalDirector overturns the charge)"
        actor: ClinicalDirector
        preconditions:
          - "Session.status == NO_SHOW_CHARGED"
        side_effects:
          - "Session.status := NO_SHOW_EXCUSED; billed_amount_cents := 0; version += 1"
          - "Compensation: episode.sessions_consumed -= 1 (if episode had flipped EXHAUSTED as a direct result and no referral has been ACCEPTED, episode returns EXHAUSTED->OPEN via exemption path being unnecessary: status returns to OPEN only when sessions_consumed < session_limit)"
          - "no_show_strike_total: student.no_show_strike_count -= 1; posture recompute may fire RESTRICTED->CLEAR (SUSPENDED->CLEAR requires the explicit strikes/reset action)"

  - entity: GroupProgram
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /ucc/group-programs/{id}/publish"
        actor: Counselor
        preconditions:
          - "acting counselor is facilitator_id OR actor is ClinicalDirector"
          - "capacity >= 1"
        side_effects:
          - "GroupProgram.status := OPEN; version += 1"
      - from: OPEN
        to: RUNNING
        trigger: "system: logical clock reaches starts_at"
        actor: system
        preconditions:
          - "current logical clock >= GroupProgram.starts_at"
          - "count of GroupEnrollment with status ENROLLED >= 1"
        side_effects:
          - "GroupProgram.status := RUNNING; version += 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /ucc/group-programs/{id}/cancel"
        actor: Counselor
        preconditions:
          - "acting counselor is facilitator_id OR actor is ClinicalDirector"
        side_effects:
          - "GroupProgram.status := CANCELLED; every GroupEnrollment in {ENROLLED, WAITLISTED} becomes DROPPED; version += 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "system: logical clock passes starts_at + weeks * 7 days"
        actor: system
        preconditions:
          - "current logical clock >= starts_at + weeks * 7 days"
        side_effects:
          - "GroupProgram.status := COMPLETED; version += 1"

  - entity: GroupEnrollment
    initial_state: ENROLLED
    terminal_states: [DROPPED, REMOVED_RISK]
    note: "cyclic-ish: WAITLISTED can promote to ENROLLED; ENROLLED can drop; risk re-banding can force removal"
    transitions:
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /ucc/group-enrollments/{id}/drop"
        actor: Student
        preconditions:
          - "acting student is GroupEnrollment.student_id OR actor is FrontDesk"
          - "GroupProgram.status IN {OPEN, RUNNING}"
        side_effects:
          - "GroupEnrollment.status := DROPPED"
          - "waitlist promotion: the WAITLISTED enrollment for the same program with the earliest created_at becomes ENROLLED (capacity slot freed)"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system: a slot frees (drop, removal, or capacity increase)"
        actor: system
        preconditions:
          - "count of ENROLLED < GroupProgram.capacity"
          - "this enrollment has the earliest created_at among WAITLISTED for the program (tie-break: created_at ASC; never id)"
        side_effects:
          - "GroupEnrollment.status := ENROLLED"
      - from: ENROLLED
        to: REMOVED_RISK
        trigger: "system: a new IntakeAssessment for the student computes risk_band CRITICAL, or a CrisisVisit for the student is DISPOSITIONED with EMERGENCY_TRANSPORT"
        actor: system
        preconditions:
          - "student's latest computed risk band exceeds the program's risk_band_ceiling"
        side_effects:
          - "GroupEnrollment.status := REMOVED_RISK"
          - "waitlist promotion fires as in ENROLLED->DROPPED"

  - entity: CrisisShift
    initial_state: UNCLAIMED
    terminal_states: [COVERED]
    transitions:
      - from: UNCLAIMED
        to: CLAIMED
        trigger: "POST /ucc/crisis-shifts/{id}/claim (OCC on CrisisShift.version)"
        actor: Counselor
        preconditions:
          - "CrisisShift.status == UNCLAIMED"
          - "expected_crisis_shift_version == CrisisShift.version"
          - "claiming counselor.active == true"
          - "claiming counselor has no other CLAIMED CrisisShift whose [starts_at, ends_at) overlaps this shift"
        side_effects:
          - "CrisisShift.status := CLAIMED; claimed_by_id := acting counselor; version += 1"
      - from: CLAIMED
        to: RELEASED
        trigger: "POST /ucc/crisis-shifts/{id}/release"
        actor: Counselor
        preconditions:
          - "acting counselor is claimed_by_id OR actor is ClinicalDirector"
          - "no CrisisVisit linked to this shift in state IN_ROOM"
        side_effects:
          - "CrisisShift.status := RELEASED; claimed_by_id := null; version += 1"
      - from: RELEASED
        to: CLAIMED
        trigger: "POST /ucc/crisis-shifts/{id}/claim"
        actor: Counselor
        preconditions:
          - "same as UNCLAIMED->CLAIMED"
        side_effects:
          - "same as UNCLAIMED->CLAIMED"
      - from: CLAIMED
        to: COVERED
        trigger: "system: logical clock passes ends_at"
        actor: system
        preconditions:
          - "current logical clock >= CrisisShift.ends_at"
        side_effects:
          - "CrisisShift.status := COVERED; version += 1"

  - entity: CrisisVisit
    initial_state: QUEUED
    terminal_states: [DISPOSITIONED]
    transitions:
      - from: QUEUED
        to: IN_ROOM
        trigger: "POST /ucc/crisis-visits/{id}/room"
        actor: Counselor
        preconditions:
          - "acting counselor is the linked shift's claimed_by_id"
          - "no other CrisisVisit linked to the same shift is currently IN_ROOM (single-room serialization per shift)"
        side_effects:
          - "CrisisVisit.status := IN_ROOM; version += 1"
      - from: IN_ROOM
        to: STABILIZED
        trigger: "POST /ucc/crisis-visits/{id}/stabilize"
        actor: Counselor
        preconditions:
          - "acting counselor is the linked shift's claimed_by_id"
        side_effects:
          - "CrisisVisit.status := STABILIZED; version += 1"
      - from: STABILIZED
        to: ESCALATED
        trigger: "POST /ucc/crisis-visits/{id}/escalate"
        actor: Counselor
        preconditions:
          - "acting counselor is the linked shift's claimed_by_id OR actor is ClinicalDirector"
        side_effects:
          - "CrisisVisit.status := ESCALATED; version += 1"
      - from: ESCALATED
        to: STABILIZED
        trigger: "POST /ucc/crisis-visits/{id}/stabilize (de-escalation loop back)"
        actor: Counselor
        preconditions:
          - "acting counselor is the linked shift's claimed_by_id"
        side_effects:
          - "CrisisVisit.status := STABILIZED; version += 1"
      - from: STABILIZED
        to: DISPOSITIONED
        trigger: "POST /ucc/crisis-visits/{id}/disposition"
        actor: Counselor
        preconditions:
          - "acting counselor is the linked shift's claimed_by_id OR actor is ClinicalDirector"
          - "payload disposition IN {RETURN_TO_CARE, COMMUNITY_REFERRAL, EMERGENCY_TRANSPORT}"
        side_effects:
          - "CrisisVisit.status := DISPOSITIONED; disposition := payload value; version += 1"
          - "If disposition == COMMUNITY_REFERRAL: create CommunityReferral (PENDING, episode_id null, required_specialty 'GEN') for the student"
          - "If disposition == RETURN_TO_CARE and the student has no CareEpisode in {OPEN}: create CareEpisode (status OPEN, primary_counselor_id := the shift's claimed_by_id, intake_assessment_id := null, academic_term := term of the currently PUBLISHED policy if any else 'INTERSESSION', session_limit computed by session_limit_for_episode using the visit's presenting_risk_band in place of an intake band)"
          - "If disposition == EMERGENCY_TRANSPORT: every GroupEnrollment for the student in ENROLLED becomes REMOVED_RISK (waitlist promotion cascades)"

  - entity: CommunityReferral
    initial_state: PENDING
    terminal_states: [COMPLETED, LAPSED]
    transitions:
      - from: PENDING
        to: MATCHED
        trigger: "POST /ucc/referrals/{id}/match"
        actor: ReferralCoordinator
        preconditions:
          - "CommunityReferral.status == PENDING"
          - "payload provider_name is non-empty and payload provider_specialty == this referral's required_specialty"
        side_effects:
          - "CommunityReferral.status := MATCHED; provider_name := payload provider_name; version += 1"
      - from: MATCHED
        to: ACCEPTED
        trigger: "POST /ucc/referrals/{id}/accept"
        actor: ReferralCoordinator
        preconditions:
          - "CommunityReferral.status == MATCHED"
        side_effects:
          - "CommunityReferral.status := ACCEPTED; version += 1"
          - "Linked CareEpisode (episode_id; skipped when episode_id is null) transitions to REFERRED_OUT from OPEN or EXHAUSTED, with its session-cancellation and caseload-release cascades"
      - from: MATCHED
        to: DECLINED
        trigger: "POST /ucc/referrals/{id}/decline"
        actor: ReferralCoordinator
        preconditions:
          - "CommunityReferral.status == MATCHED"
        side_effects:
          - "CommunityReferral.status := DECLINED; version += 1"
      - from: DECLINED
        to: PENDING
        trigger: "POST /ucc/referrals/{id}/rematch"
        actor: ReferralCoordinator
        preconditions:
          - "CommunityReferral.status == DECLINED"
          - "CommunityReferral.rematch_count < 3 (a rematch attempt at rematch_count == 3 fails with ERR_REFERRAL_LOOP_EXHAUSTED)"
        side_effects:
          - "CommunityReferral.status := PENDING; provider_name := null; rematch_count += 1; version += 1"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /ucc/referrals/{id}/confirm-engagement"
        actor: ReferralCoordinator
        preconditions:
          - "CommunityReferral.status == ACCEPTED"
          - "logical clock >= referral's updated_at + ENGAGEMENT_CONFIRM_DAYS (constant 14 days); an earlier attempt fails with ERR_ENGAGEMENT_WINDOW"
        side_effects:
          - "CommunityReferral.status := COMPLETED; version += 1"
      - from: PENDING
        to: LAPSED
        trigger: "system: PENDING for REFERRAL_LAPSE_DAYS (constant 30 days) without a match"
        actor: system
        preconditions:
          - "current logical clock >= referral's updated_at + REFERRAL_LAPSE_DAYS (30 days)"
        side_effects:
          - "CommunityReferral.status := LAPSED; version += 1"

  - entity: SemesterPolicy
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /ucc/policies/{id}/publish"
        actor: ClinicalDirector
        preconditions:
          - "SemesterPolicy.policy_status == DRAFT"
          - "no other SemesterPolicy for the same academic_term is PUBLISHED"
        side_effects:
          - "SemesterPolicy.policy_status := PUBLISHED; version += 1"
          - "Recompute every Student.booking_posture under the new strike limit (posture sweep)"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /ucc/policies/{id}/retire"
        actor: ClinicalDirector
        preconditions:
          - "SemesterPolicy.policy_status == PUBLISHED"
          - "a replacement SemesterPolicy for the same academic_term exists in DRAFT"
        side_effects:
          - "SemesterPolicy.policy_status := RETIRED; version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: crisis-shift-claim-stale-version
    parent_entity: CrisisShift
    write_endpoint: "POST /ucc/crisis-shifts/{id}/claim"
    occ_field: "expected_crisis_shift_version"
    description: |
      Claiming a CrisisShift with an expected_crisis_shift_version that no longer
      equals the shift's current version is rejected. A second claimant acting
      after a successful claim observes status == CLAIMED and is already rejected
      by the state precondition; this OCC rule covers the client whose view of the
      shift (still UNCLAIMED at some version) is stale because another write
      (claim or release) advanced the version since the client read it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: session-book-stale-episode-version
    parent_entity: CareEpisode
    write_endpoint: "POST /ucc/episodes/{id}/sessions"
    occ_field: "expected_episode_version"
    description: |
      Booking a Session into a CareEpisode whose version has advanced since the
      client last read it is rejected. Between the client's read and its booking
      request, another Session completion may have incremented sessions_consumed
      (advancing version) so the client's view of remaining capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: intake_risk_score
    trigger: "POST /ucc/intake-assessments (risk_points and risk_band are computed at creation and immutable thereafter)"
    algorithm: weighted_scoring
    formula: |
      # Step 1: base points from screeners (sum, no rounding needed — all integer)
      base = phq9_score + gad7_score
      # Step 2: acute multipliers — nested conditional on flags
      if recent_attempt_flag:      base = base * ATTEMPT_MULTIPLIER
      elif ideation_flag:          base = base + IDEATION_BONUS
      # Step 3: cap and floor
      points = min(MAX_POINTS, max(0, base))
      # Step 4: band mapping — boundary is INCLUSIVE at the lower edge
      band = CRITICAL if points >= CRITICAL_MIN
             else HIGH if points >= HIGH_MIN
             else MODERATE if points >= MODERATE_MIN
             else LOW
      # Evaluation order is pinned: multipliers BEFORE banding; band thresholds
      # compare against the post-cap points.
    input_set: "the single IntakeAssessment being created"
    constants:
      ATTEMPT_MULTIPLIER: 3
      IDEATION_BONUS: 15
      MAX_POINTS: 100
      CRITICAL_MIN: 60
      HIGH_MIN: 35
      MODERATE_MIN: 15
    precision: "integer arithmetic; no rounding"
    variants:
      - name: screening_variant
        when: "used at intake (default)"
        difference: "multipliers as above; ideation bonus is additive AFTER attempt multiplier is skipped (elif)"
      - name: audit_variant
        when: "used by the capacity-report endpoint for historical re-banding under a hypothetical policy"
        difference: "applies ideation bonus BEFORE attempt multiplier (additive-then-multiplicative), producing strictly higher points when both flags set; used only for what-if reporting, never persisted"

  - name: session_limit_for_episode
    trigger: "CareEpisode creation (from intake completion, reopen, or crisis RETURN_TO_CARE)"
    algorithm: threshold
    formula: |
      # Tiered entitlement keyed on (risk_band, funding_model).
      # Evaluation order pinned: band tier first, then funding adjustment, then floor.
      tier_base = case risk_band:
                    LOW      -> policy.base_session_limit - 2
                    MODERATE -> policy.base_session_limit
                    HIGH     -> policy.base_session_limit + 4
                    CRITICAL -> policy.base_session_limit + 8
      funding_adjust = case student.funding_model:
                         STUDENT_FEE -> 0
                         INSURANCE   -> -1     # insurer-capped plans get one fewer center session
                         SPLIT       -> +1
      limit = max(MIN_LIMIT, tier_base + funding_adjust)
      # policy = the PUBLISHED SemesterPolicy for the episode's academic_term.
    input_set: "the new CareEpisode, its IntakeAssessment risk_band, the Student.funding_model, the PUBLISHED SemesterPolicy for the term"
    constants:
      MIN_LIMIT: 2
    precision: "integer arithmetic"
    variants:
      - name: standard_term
        when: "a PUBLISHED SemesterPolicy exists for the term"
        difference: "uses policy.base_session_limit as above"
      - name: intersession_default
        when: "no PUBLISHED SemesterPolicy exists for the episode's academic_term"
        difference: "uses DEFAULT_INTERSESSION_BASE in place of policy.base_session_limit and forbids episode creation for LOW band (community routing instead) — intersession capacity is reserved for acute need"
    constants_extra:
      DEFAULT_INTERSESSION_BASE: 6

  - name: session_billing_amount
    trigger: "Session transitions to COMPLETED, CANCELLED_LATE, or NO_SHOW_CHARGED"
    algorithm: tiered_pricing
    formula: |
      # Amounts in cents. Order pinned: determine event class, then funding split,
      # then round the insurance portion HALF_UP to whole cents.
      if funding_model == STUDENT_FEE:
        billed = 0                                   # fully covered by student fees
      else:
        gross = case event:
                  COMPLETED        -> RATE_PER_MINUTE * duration_minutes
                  CANCELLED_LATE   -> LATE_CANCEL_FEE_CENTS
                  NO_SHOW_CHARGED  -> NO_SHOW_FEE_CENTS
        if funding_model == INSURANCE:
          billed = round_half_up(gross * INSURANCE_CENTER_SHARE)   # center bills its share
        else: # SPLIT
          billed = round_half_up(gross * SPLIT_CENTER_SHARE)
      # rounding rule pinned: round the FINAL center share once; never round
      # per-component then sum.
    input_set: "the transitioning Session, its episode's Student.funding_model"
    constants:
      RATE_PER_MINUTE: 250
      LATE_CANCEL_FEE_CENTS: 5000
      NO_SHOW_FEE_CENTS: 7500
      INSURANCE_CENTER_SHARE: 0.80
      SPLIT_CENTER_SHARE: 0.50
    precision: "0 decimal places on the final cents value, round_half_up, applied exactly once"

  - name: session_consumption_ledger
    trigger: "Session -> COMPLETED, -> NO_SHOW_CHARGED, and the NO_SHOW_CHARGED -> NO_SHOW_EXCUSED compensation"
    algorithm: aggregation
    formula: |
      # sessions_consumed counts exactly the episode's linked Sessions whose
      # status is in {COMPLETED, NO_SHOW_CHARGED}. It is recomputed as a
      # full recount (not incremental drift) on every triggering transition.
      sessions_consumed = count(Session s where s.episode_id == episode.id
                                  and s.status IN {COMPLETED, NO_SHOW_CHARGED})
    input_set: "all Sessions of the episode in states {COMPLETED, NO_SHOW_CHARGED}; terminal-only, SCHEDULED/HELD/cancellations excluded"
    precision: "integer count"

  - name: no_show_strike_total
    trigger: "Session -> NO_SHOW_CHARGED (increment) and NO_SHOW_CHARGED -> NO_SHOW_EXCUSED (decrement), and ClinicalDirector strikes/reset"
    algorithm: aggregation
    formula: |
      no_show_strike_count = count(Session s join CareEpisode e on s.episode_id == e.id
                                   where e.student_id == student.id
                                     and s.status == NO_SHOW_CHARGED
                                     and e.academic_term == current_term(student)
                                     and s.updated_at > student.strike_reset_anchor)
      # current_term = the academic_term of the student's most recently created
      # non-terminal CareEpisode; if none exists, strikes count is 0 regardless
      # of history (strikes are scoped to the active care context).
      # strike_reset_anchor: Student field (ISO timestamp, default epoch 0) set to
      # the current logical clock by POST /students/{id}/strikes/reset — the reset
      # is therefore durable under recount: previously charged sessions still exist
      # but are excluded from the count because they predate the anchor.
    input_set: "NO_SHOW_CHARGED sessions across the student's episodes in the current term whose last mutation postdates the student's strike_reset_anchor"
    precision: "integer count"

  - name: counselor_caseload_load
    trigger: "CareEpisode creation, assignment, closure, REFERRED_OUT, and any new IntakeAssessment that re-bands a student with an OPEN episode"
    algorithm: aggregation
    formula: |
      # Sum of CURRENT risk points over the counselor's OPEN episodes.
      load = sum(latest IntakeAssessment.risk_points for each CareEpisode ep
                 where ep.primary_counselor_id == counselor.id
                   and ep.status IN {OPEN, EXHAUSTED})
      # EXHAUSTED episodes still occupy caseload until REFERRED_OUT or CLOSED.
    input_set: "CareEpisodes in {OPEN, EXHAUSTED} for the counselor; risk points from each episode's linked intake assessment"
    precision: "integer sum"

  - name: group_waitlist_order
    trigger: "slot frees on a GroupProgram"
    algorithm: chronological
    formula: |
      promote the WAITLISTED GroupEnrollment with earliest created_at;
      tie-break on identical created_at is forbidden from using id — instead the
      enrollment whose student has the LOWER current no_show_strike_count
      promotes first; a further tie resolves by Student.created_at ASC.
    input_set: "GroupEnrollments of the program in status WAITLISTED"
    precision: "ordering only"

  - name: capacity_utilization_report
    trigger: "GET /ucc/reports/capacity (per-term reporting)"
    algorithm: aggregation
    formula: |
      # Circular-looking dependency, evaluation order pinned:
      #   (1) delivered_minutes from terminal sessions,
      #   (2) bookable_minutes from counselor capacity,
      #   (3) utilization = delivered / bookable computed LAST.
      delivered_minutes = sum(Session.duration_minutes for Sessions of episodes
                              in the term with status == COMPLETED)
      bookable_minutes  = sum(c.weekly_individual_capacity * 60 * WEEKS_IN_TERM
                              for Counselor c where c.active)
      utilization_bps   = round_half_up(10000 * delivered_minutes / bookable_minutes)
                          when bookable_minutes > 0 else 0
      # utilization reported in basis points (10000 = 100.00%) to avoid floats.
      # Also emit outcomes_delta = mean(DISCHARGE score - BASELINE score per
      # instrument over episodes CLOSED in the term having both phases).
    input_set: "COMPLETED sessions in the term; active counselors; CLOSED episodes with BASELINE+DISCHARGE OutcomeMeasures"
    constants:
      WEEKS_IN_TERM: 15
    precision: "utilization_bps integer; outcomes_delta 2 decimals round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke the endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 2.5
    category: auth
    check: "Entity-ownership gate for entity_backed roles: a Counselor may only complete/mark-no-show sessions whose counselor_id == X-User-ID, close/reopen episodes whose primary_counselor_id == X-User-ID, room/stabilize visits on shifts they claim, and drop enrollments only when Student X-User-ID == enrollment.student_id. ClinicalDirector bypasses ownership. Violations are authorization failures, NOT state failures."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: ["POST /ucc/sessions/{id}/complete", "POST /ucc/sessions/{id}/mark-no-show", "POST /ucc/episodes/{id}/close", "POST /ucc/episodes/{id}/reopen", "POST /ucc/crisis-visits/{id}/room", "POST /ucc/crisis-visits/{id}/stabilize", "POST /ucc/group-enrollments/{id}/drop", "POST /ucc/group-programs/{id}/publish", "POST /ucc/group-programs/{id}/cancel", "POST /ucc/crisis-shifts/{id}/release"]
  - priority: 3
    category: existence
    check: "Every path-template id and FK in the payload resolves to an existing entity (validated left-to-right: path ids before body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Required request-body fields present and well-typed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition exists per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Clinical-safety gate: crisis dispositions, risk-band ceilings on group enrollment, EMERGENCY_TRANSPORT cascades, CRITICAL routing. For group enrollment the student's band is the risk_band of their latest-created IntakeAssessment; a student with NO intake assessment is treated as LOW (no clinical contraindication on file). CRITICAL students are never group-eligible regardless of the program ceiling."
    error_id: ERR_RISK_BAND_VIOLATION
    http_status: 422
    applies_to: ["POST /ucc/group-programs/{id}/enrollments", "POST /ucc/intake-assessments/{id}/complete", "POST /ucc/crisis-visits/{id}/disposition"]
  - priority: 7
    category: business_safety
    check: "Confidentiality gate: ClinicalNote readable only by its author or a ClinicalDirector; counseling-derived fields (risk band, session counts, episode status) MUST NOT be exposed on endpoints readable by Registrar; academic_record_flags MUST NOT be writable from any counseling endpoint"
    error_id: ERR_CONFIDENTIALITY_VIOLATION
    http_status: 403
    applies_to: ["GET /ucc/clinical-notes/{id}", "GET /ucc/students/{id}", "PATCH /ucc/students/{id}"]
  - priority: 8
    category: business_constraint
    check: "Uniqueness constraints (student_number, license_id, academic_term on SemesterPolicy)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: ["POST /ucc/students", "POST /ucc/counselors", "POST /ucc/policies"]
  - priority: 9
    category: business_constraint
    check: "Temporal overlap: a Counselor may not hold two Sessions in {SCHEDULED, HELD} whose [starts_at, starts_at+duration) intervals overlap; a Counselor may not CLAIM two CrisisShifts with overlapping [starts_at, ends_at); a Counselor's Sessions must lie strictly inside at most one claimed shift's complement (sessions and crisis shifts may coexist)"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: ["POST /ucc/episodes/{id}/sessions", "POST /ucc/crisis-shifts/{id}/claim"]
  - priority: 10
    category: business_constraint
    check: "Single-room serialization: at most one CrisisVisit per shift in IN_ROOM"
    error_id: ERR_ROOM_OCCUPIED
    http_status: 409
    applies_to: ["POST /ucc/crisis-visits/{id}/room"]
  - priority: 11
    category: business_fiscal
    check: "Booking gate: student.booking_posture must be CLEAR (RESTRICTED may book only with ClinicalDirector override flag; SUSPENDED never books)"
    error_id: ERR_BOOKING_SUSPENDED
    http_status: 422
    applies_to: ["POST /ucc/episodes/{id}/sessions"]
  - priority: 12
    category: business_fiscal
    check: "Session-limit gate: episode.status must be OPEN and (sessions_consumed < session_limit OR exemption_granted); enrollment eligibility for new sessions"
    error_id: ERR_SESSION_LIMIT_REACHED
    http_status: 422
    applies_to: ["POST /ucc/episodes/{id}/sessions"]
  - priority: 13
    category: business_fiscal
    check: "Counselor capacity gates: counselor's count of {SCHEDULED, HELD} sessions < weekly_individual_capacity AND counselor_caseload_load + new episode's risk points <= max_caseload_risk_points"
    error_id: ERR_COUNSELOR_OVER_CAPACITY
    http_status: 422
    applies_to: ["POST /ucc/episodes/{id}/sessions", "POST /ucc/intake-assessments/{id}/complete"]
  - priority: 14
    category: business_referential
    check: "Group capacity: program ENROLLED count < capacity else enrollment becomes WAITLISTED (not an error); enrollment rejected outright only when program.status not OPEN"
    error_id: ERR_PROGRAM_NOT_OPEN
    http_status: 409
    applies_to: ["POST /ucc/group-programs/{id}/enrollments"]
  - priority: 15
    category: business_temporal
    check: "Session starts_at must be strictly in the future relative to the logical clock; CrisisShift ends_at strictly after starts_at; cancellation timing classification uses the published policy window"
    error_id: ERR_TEMPORAL_INVALID
    http_status: 422
    applies_to: ["POST /ucc/episodes/{id}/sessions", "POST /ucc/crisis-shifts"]
  - priority: 16
    category: state
    check: "OCC stale version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /ucc/crisis-shifts/{id}/claim", "POST /ucc/episodes/{id}/sessions"]
  - priority: 17
    category: business_constraint
    check: "Policy lifecycle conflicts: publishing a SemesterPolicy when another is already PUBLISHED for the same academic_term; retiring a PUBLISHED policy with no DRAFT replacement for the term"
    error_id: ERR_POLICY_CONFLICT
    http_status: 409
    applies_to: ["POST /ucc/policies/{id}/publish", "POST /ucc/policies/{id}/retire"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/ucc/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and NEVER falls back to wall-clock; this endpoint moves the logical clock that all temporal rules consult."
    roles: [ClinicalDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Evaluate time-based auto-transitions: GroupProgram OPEN->RUNNING, RUNNING->COMPLETED, CrisisShift CLAIMED->COVERED, CommunityReferral PENDING->LAPSED"

  # --- students ---
  - method: POST
    path: "/ucc/students"
    description: "Register a student record"
    roles: [FrontDesk, Registrar]
    code: 201
    input: [student_number, full_name, enrollment_status, funding_model, "academic_record_flags?"]
    output: Student
    side_effects: ["booking_posture initialized CLEAR, no_show_strike_count 0"]
  - method: GET
    path: "/ucc/students/{id}"
    description: "Read a student. Registrar receives the academic view (no risk bands, no episode status, no strike counts); counseling roles receive the clinical view."
    roles: [FrontDesk, Registrar, Counselor, TriageScreener, ClinicalDirector, ReferralCoordinator]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/ucc/students"
    description: "List students (paginated, filterable)"
    roles: [FrontDesk, Registrar, Counselor, TriageScreener, ClinicalDirector]
    code: 200
    input: ["enrollment_status?", "booking_posture?", "limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: PATCH
    path: "/ucc/students/{id}"
    description: "Update non-clinical student fields. enrollment_status and academic_record_flags are Registrar-writable; funding_model is FrontDesk-writable; clinical computed fields are never writable."
    roles: [FrontDesk, Registrar]
    code: 200
    input: ["enrollment_status?", "funding_model?", "academic_record_flags?"]
    output: Student
    side_effects: ["version += 1"]
  - method: POST
    path: "/ucc/students/{id}/strikes/reset"
    description: "ClinicalDirector resets no-show strikes and clears SUSPENDED posture"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: Student
    side_effects: ["Student SUSPENDED->CLEAR transition; strike_reset_anchor := current logical clock; no_show_strike_count recomputes to 0; version += 1"]

  # --- counselors ---
  - method: POST
    path: "/ucc/counselors"
    description: "Onboard a counselor"
    roles: [ClinicalDirector]
    code: 201
    input: [license_id, full_name, specialties, weekly_individual_capacity, max_caseload_risk_points, "active?"]
    output: Counselor
    side_effects: []
  - method: GET
    path: "/ucc/counselors/{id}"
    description: "Read a counselor"
    roles: [FrontDesk, Counselor, TriageScreener, ClinicalDirector, ReferralCoordinator]
    code: 200
    input: []
    output: Counselor
    side_effects: []
  - method: GET
    path: "/ucc/counselors"
    description: "List counselors"
    roles: [FrontDesk, Counselor, TriageScreener, ClinicalDirector, ReferralCoordinator]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Counselor[]
    side_effects: []

  # --- intake ---
  - method: POST
    path: "/ucc/intake-assessments"
    description: "Create an intake assessment; risk_points and risk_band are computed at creation by intake_risk_score and immutable"
    roles: [TriageScreener]
    code: 201
    input: [student_id, screener_id, phq9_score, gad7_score, ideation_flag, recent_attempt_flag]
    output: IntakeAssessment
    side_effects: ["compute intake_risk_score; disposition := PENDING"]
  - method: GET
    path: "/ucc/intake-assessments/{id}"
    description: "Read an intake assessment (clinical view only)"
    roles: [TriageScreener, Counselor, ClinicalDirector]
    code: 200
    input: []
    output: IntakeAssessment
    side_effects: []
  - method: GET
    path: "/ucc/intake-assessments"
    description: "List intake assessments, filterable by student"
    roles: [TriageScreener, Counselor, ClinicalDirector]
    code: 200
    input: ["student_id?", "screener_id?", "risk_band?", "limit?", "offset?"]
    output: IntakeAssessment[]
    side_effects: []
  - method: POST
    path: "/ucc/intake-assessments/{id}/complete"
    description: "Complete the intake; disposition is derived from the computed risk_band and the transition's side effects fire (episode creation, referral creation, or crisis routing)"
    roles: [TriageScreener]
    code: 200
    input: ["primary_counselor_id?", "academic_term?"]
    output: IntakeAssessment
    side_effects:
      - "disposition transition per §1.2 IntakeAssessment"
      - "on SHORT_TERM_CARE: create CareEpisode with session_limit_for_episode; academic_term defaults to the term of the PUBLISHED SemesterPolicy, required when intersession"
      - "on COMMUNITY_REFERRAL: create CommunityReferral PENDING"
      - "on CRISIS_PROTOCOL: requires a currently CLAIMED WALK_IN shift, else ERR_NO_CRISIS_COVERAGE"

  # --- episodes ---
  - method: GET
    path: "/ucc/episodes/{id}"
    description: "Read a care episode"
    roles: [Counselor, TriageScreener, ClinicalDirector, FrontDesk, ReferralCoordinator]
    code: 200
    input: []
    output: CareEpisode
    side_effects: []
  - method: GET
    path: "/ucc/episodes"
    description: "List care episodes, filterable"
    roles: [Counselor, TriageScreener, ClinicalDirector, FrontDesk, ReferralCoordinator]
    code: 200
    input: ["student_id?", "primary_counselor_id?", "status?", "academic_term?", "prior_episode_id?", "intake_assessment_id?", "limit?", "offset?"]
    output: CareEpisode[]
    side_effects: []
  - method: POST
    path: "/ucc/episodes/{id}/sessions"
    description: "Book an individual session into the episode (OCC-guarded on episode version)"
    roles: [FrontDesk, Counselor]
    code: 201
    input: [counselor_id, starts_at, duration_minutes, expected_episode_version, "director_override?"]
    output: Session
    side_effects:
      - "increments CareEpisode.version by 1"
      - "validations: posture gate (p11), session-limit gate (p12), counselor capacity (p13), temporal (p15), counselor overlap (p9), OCC (p16)"
  - method: POST
    path: "/ucc/episodes/{id}/close"
    description: "Close an episode (primary counselor or director)"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: []
    output: CareEpisode
    side_effects: ["OPEN->CLOSED; caseload recompute"]
  - method: POST
    path: "/ucc/episodes/{id}/reopen"
    description: "Reopen a closed episode as a new REOPENED-linked episode"
    roles: [Counselor, ClinicalDirector]
    code: 201
    input: [intake_assessment_id, academic_term]
    output: CareEpisode
    side_effects: ["old CLOSED->REOPENED marker via new episode creation; new episode OPEN with prior_episode_id"]
  - method: POST
    path: "/ucc/episodes/{id}/exemptions"
    description: "Grant a session-limit exemption on an EXHAUSTED episode"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: CareEpisode
    side_effects: ["EXHAUSTED->OPEN; exemption_granted := true; session_limit += EXEMPTION_BONUS_SESSIONS (constant 4)"]

  # --- sessions ---
  - method: GET
    path: "/ucc/sessions/{id}"
    description: "Read a session"
    roles: [FrontDesk, Counselor, ClinicalDirector]
    code: 200
    input: []
    output: Session
    side_effects: []
  - method: GET
    path: "/ucc/sessions"
    description: "List sessions, filterable"
    roles: [FrontDesk, Counselor, ClinicalDirector]
    code: 200
    input: ["episode_id?", "counselor_id?", "status?", "limit?", "offset?"]
    output: Session[]
    side_effects: []
  - method: POST
    path: "/ucc/sessions/{id}/hold"
    description: "Place a SCHEDULED session on hold"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Session
    side_effects: ["SCHEDULED->HELD; version += 1"]
  - method: POST
    path: "/ucc/sessions/{id}/release-hold"
    description: "Release a hold"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Session
    side_effects: ["HELD->SCHEDULED; version += 1"]
  - method: POST
    path: "/ucc/sessions/{id}/complete"
    description: "Mark a session completed; bills and consumes against the episode"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: []
    output: Session
    side_effects: ["->COMPLETED; session_billing_amount; session_consumption_ledger; possible episode EXHAUSTED cascade"]
  - method: POST
    path: "/ucc/sessions/{id}/cancel"
    description: "Cancel a session; timely vs late classification is computed from the published policy window"
    roles: [FrontDesk]
    code: 200
    input: [cancellation_reason]
    output: Session
    side_effects: ["->CANCELLED_TIMELY or CANCELLED_LATE per policy window; late cancel bills per session_billing_amount"]
  - method: POST
    path: "/ucc/sessions/{id}/mark-no-show"
    description: "Record a no-show determination (chargeable or excused)"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: [chargeable]
    output: Session
    side_effects: ["->NO_SHOW_CHARGED or NO_SHOW_EXCUSED; on charged: billing, consumption, strike increment, posture recompute with possible SUSPENDED cascade"]
  - method: POST
    path: "/ucc/sessions/{id}/excuse"
    description: "Overturn a charged no-show (compensating action)"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: Session
    side_effects: ["NO_SHOW_CHARGED->NO_SHOW_EXCUSED; billing zeroed; consumption decremented; strike decremented; posture recompute"]

  # --- clinical notes ---
  - method: POST
    path: "/ucc/clinical-notes"
    description: "Author a confidential clinical note on a session"
    roles: [Counselor]
    code: 201
    input: [session_id, author_id, body]
    output: ClinicalNote
    side_effects: []
  - method: GET
    path: "/ucc/clinical-notes/{id}"
    description: "Read a clinical note — author or ClinicalDirector only (confidentiality wall)"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: []
    output: ClinicalNote
    side_effects: []
  - method: GET
    path: "/ucc/clinical-notes"
    description: "List clinical notes, filterable by session"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: ["session_id?", "author_id?", "limit?", "offset?"]
    output: ClinicalNote[]
    side_effects: []

  # --- groups ---
  - method: POST
    path: "/ucc/group-programs"
    description: "Create a group program in DRAFT"
    roles: [Counselor, ClinicalDirector]
    code: 201
    input: [title, facilitator_id, capacity, meeting_day, starts_at, weeks, risk_band_ceiling]
    output: GroupProgram
    side_effects: []
  - method: GET
    path: "/ucc/group-programs/{id}"
    description: "Read a group program"
    roles: [FrontDesk, Counselor, TriageScreener, ClinicalDirector, Student]
    code: 200
    input: []
    output: GroupProgram
    side_effects: []
  - method: GET
    path: "/ucc/group-programs"
    description: "List group programs"
    roles: [FrontDesk, Counselor, TriageScreener, ClinicalDirector, Student]
    code: 200
    input: ["status?", "facilitator_id?", "limit?", "offset?"]
    output: GroupProgram[]
    side_effects: []
  - method: POST
    path: "/ucc/group-programs/{id}/publish"
    description: "Publish a DRAFT program to OPEN"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: []
    output: GroupProgram
    side_effects: ["DRAFT->OPEN"]
  - method: POST
    path: "/ucc/group-programs/{id}/cancel"
    description: "Cancel an OPEN program; all enrollments drop"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: []
    output: GroupProgram
    side_effects: ["OPEN->CANCELLED; enrollments ENROLLED/WAITLISTED -> DROPPED"]
  - method: POST
    path: "/ucc/group-programs/{id}/enrollments"
    description: "Enroll a student; over-capacity enrollments become WAITLISTED; risk-band ceiling enforced"
    roles: [FrontDesk, Counselor]
    code: 201
    input: [student_id]
    output: GroupEnrollment
    side_effects: ["status ENROLLED if capacity available else WAITLISTED"]
  - method: GET
    path: "/ucc/group-enrollments/{id}"
    description: "Read a single enrollment"
    roles: [FrontDesk, Counselor, ClinicalDirector, Student]
    code: 200
    input: []
    output: GroupEnrollment
    side_effects: []
  - method: GET
    path: "/ucc/group-enrollments"
    description: "List enrollments, filterable"
    roles: [FrontDesk, Counselor, ClinicalDirector]
    code: 200
    input: ["program_id?", "student_id?", "status?", "limit?", "offset?"]
    output: GroupEnrollment[]
    side_effects: []
  - method: POST
    path: "/ucc/group-enrollments/{id}/drop"
    description: "Drop an enrollment; waitlist head promotes"
    roles: [Student, FrontDesk]
    code: 200
    input: []
    output: GroupEnrollment
    side_effects: ["ENROLLED->DROPPED; waitlist promotion per group_waitlist_order"]

  # --- crisis shifts ---
  - method: POST
    path: "/ucc/crisis-shifts"
    description: "Create a crisis coverage shift (UNCLAIMED)"
    roles: [ClinicalDirector]
    code: 201
    input: [coverage_date, shift_kind, starts_at, ends_at]
    output: CrisisShift
    side_effects: []
  - method: GET
    path: "/ucc/crisis-shifts/{id}"
    description: "Read a crisis shift"
    roles: [FrontDesk, Counselor, ClinicalDirector, TriageScreener]
    code: 200
    input: []
    output: CrisisShift
    side_effects: []
  - method: GET
    path: "/ucc/crisis-shifts"
    description: "List crisis shifts"
    roles: [FrontDesk, Counselor, ClinicalDirector, TriageScreener]
    code: 200
    input: ["status?", "shift_kind?", "coverage_date?", "claimed_by_id?", "limit?", "offset?"]
    output: CrisisShift[]
    side_effects: []
  - method: POST
    path: "/ucc/crisis-shifts/{id}/claim"
    description: "Claim a shift (OCC-guarded on shift version; overlap with claimant's other claimed shifts rejected)"
    roles: [Counselor]
    code: 200
    input: [expected_crisis_shift_version]
    output: CrisisShift
    side_effects: ["UNCLAIMED/RELEASED->CLAIMED; increments CrisisShift.version by 1"]
  - method: POST
    path: "/ucc/crisis-shifts/{id}/release"
    description: "Release a claimed shift"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: []
    output: CrisisShift
    side_effects: ["CLAIMED->RELEASED; claimed_by_id := null; version += 1"]

  # --- crisis visits ---
  - method: POST
    path: "/ucc/crisis-visits"
    description: "Check in a crisis visit against a claimed shift"
    roles: [FrontDesk, TriageScreener]
    code: 201
    input: [student_id, shift_id, presenting_risk_band]
    output: CrisisVisit
    side_effects: ["requires shift.status == CLAIMED else ERR_NO_CRISIS_COVERAGE"]
  - method: GET
    path: "/ucc/crisis-visits/{id}"
    description: "Read a crisis visit"
    roles: [Counselor, ClinicalDirector, TriageScreener, FrontDesk]
    code: 200
    input: []
    output: CrisisVisit
    side_effects: []
  - method: GET
    path: "/ucc/crisis-visits"
    description: "List crisis visits"
    roles: [Counselor, ClinicalDirector, TriageScreener, FrontDesk]
    code: 200
    input: ["student_id?", "shift_id?", "status?", "limit?", "offset?"]
    output: CrisisVisit[]
    side_effects: []
  - method: POST
    path: "/ucc/crisis-visits/{id}/room"
    description: "Move a queued visit into the room (one per shift)"
    roles: [Counselor]
    code: 200
    input: []
    output: CrisisVisit
    side_effects: ["QUEUED->IN_ROOM"]
  - method: POST
    path: "/ucc/crisis-visits/{id}/stabilize"
    description: "Stabilize an IN_ROOM visit, or de-escalate an ESCALATED visit back to STABILIZED"
    roles: [Counselor]
    code: 200
    input: []
    output: CrisisVisit
    side_effects: ["IN_ROOM->STABILIZED or ESCALATED->STABILIZED"]
  - method: POST
    path: "/ucc/crisis-visits/{id}/escalate"
    description: "Escalate a stabilized visit"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: []
    output: CrisisVisit
    side_effects: ["STABILIZED->ESCALATED"]
  - method: POST
    path: "/ucc/crisis-visits/{id}/disposition"
    description: "Disposition a stabilized visit; cascades per disposition code"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: [disposition]
    output: CrisisVisit
    side_effects: ["STABILIZED->DISPOSITIONED; disposition-specific cascades per §1.2"]

  # --- referrals ---
  - method: GET
    path: "/ucc/referrals/{id}"
    description: "Read a referral"
    roles: [ReferralCoordinator, Counselor, ClinicalDirector, TriageScreener]
    code: 200
    input: []
    output: CommunityReferral
    side_effects: []
  - method: GET
    path: "/ucc/referrals"
    description: "List referrals"
    roles: [ReferralCoordinator, Counselor, ClinicalDirector, TriageScreener]
    code: 200
    input: ["student_id?", "episode_id?", "status?", "limit?", "offset?"]
    output: CommunityReferral[]
    side_effects: []
  - method: POST
    path: "/ucc/referrals/{id}/match"
    description: "Match a PENDING referral to a provider"
    roles: [ReferralCoordinator]
    code: 200
    input: [provider_name, provider_specialty]
    output: CommunityReferral
    side_effects: ["PENDING->MATCHED"]
  - method: POST
    path: "/ucc/referrals/{id}/accept"
    description: "Provider accepts; linked episode is REFERRED_OUT with cascades"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: CommunityReferral
    side_effects: ["MATCHED->ACCEPTED; episode OPEN/EXHAUSTED -> REFERRED_OUT cascade"]
  - method: POST
    path: "/ucc/referrals/{id}/decline"
    description: "Provider declines"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: CommunityReferral
    side_effects: ["MATCHED->DECLINED"]
  - method: POST
    path: "/ucc/referrals/{id}/rematch"
    description: "Return a declined referral to PENDING for re-matching (max 3 loops)"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: CommunityReferral
    side_effects: ["DECLINED->PENDING"]
  - method: POST
    path: "/ucc/referrals/{id}/confirm-engagement"
    description: "Confirm the student engaged with the community provider"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: CommunityReferral
    side_effects: ["ACCEPTED->COMPLETED after ENGAGEMENT_CONFIRM_DAYS (constant 14)"]

  # --- policies ---
  - method: POST
    path: "/ucc/policies"
    description: "Create a semester policy in DRAFT"
    roles: [ClinicalDirector]
    code: 201
    input: [academic_term, base_session_limit, no_show_strike_limit, late_cancel_window_hours]
    output: SemesterPolicy
    side_effects: []
  - method: GET
    path: "/ucc/policies/{id}"
    description: "Read a policy"
    roles: [FrontDesk, Counselor, TriageScreener, ClinicalDirector, ReferralCoordinator, Registrar]
    code: 200
    input: []
    output: SemesterPolicy
    side_effects: []
  - method: GET
    path: "/ucc/policies"
    description: "List policies"
    roles: [FrontDesk, Counselor, TriageScreener, ClinicalDirector, ReferralCoordinator, Registrar]
    code: 200
    input: ["academic_term?", "policy_status?", "limit?", "offset?"]
    output: SemesterPolicy[]
    side_effects: []
  - method: POST
    path: "/ucc/policies/{id}/publish"
    description: "Publish a DRAFT policy; one PUBLISHED per term; posture sweep recomputes all students"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: SemesterPolicy
    side_effects: ["DRAFT->PUBLISHED; booking_posture sweep"]
  - method: POST
    path: "/ucc/policies/{id}/retire"
    description: "Retire a PUBLISHED policy when a DRAFT replacement exists"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: SemesterPolicy
    side_effects: ["PUBLISHED->RETIRED"]

  # --- outcome measures ---
  - method: POST
    path: "/ucc/outcome-measures"
    description: "Record an outcome measure administration"
    roles: [Counselor, ClinicalDirector]
    code: 201
    input: [episode_id, instrument, phase, score]
    output: OutcomeMeasure
    side_effects: []
  - method: GET
    path: "/ucc/outcome-measures/{id}"
    description: "Read a single outcome measure"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: []
    output: OutcomeMeasure
    side_effects: []
  - method: GET
    path: "/ucc/outcome-measures"
    description: "List outcome measures"
    roles: [Counselor, ClinicalDirector]
    code: 200
    input: ["episode_id?", "instrument?", "phase?", "limit?", "offset?"]
    output: OutcomeMeasure[]
    side_effects: []

  # --- reports ---
  - method: GET
    path: "/ucc/reports/capacity"
    description: "Term capacity/utilization and outcome-delta report per capacity_utilization_report"
    roles: [ClinicalDirector]
    code: 200
    input: [academic_term]
    output: { academic_term: string, delivered_minutes: integer, bookable_minutes: integer, utilization_bps: integer, outcomes_delta: number }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the endpoint per §1.5 roles"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or payload FK does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/ill-typed required field; enum out of range; score out of range (phq9 0..27, gad7 0..21)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state (incl. terminal-state lockdown and second identical trigger)"
  - id: ERR_RISK_BAND_VIOLATION
    http: 422
    condition: "Clinical-safety gate breached: CRITICAL student routed anywhere but crisis protocol; student band above program risk_band_ceiling enrolling; disposition payload not in allowed set"
  - id: ERR_CONFIDENTIALITY_VIOLATION
    http: 403
    condition: "Non-author/non-director reads a ClinicalNote; Registrar receives clinical fields; counseling endpoint attempts to write academic_record_flags"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violated: student_number, license_id, or (academic_term, PUBLISHED) on SemesterPolicy"
  - id: ERR_SCHEDULE_CONFLICT
    http: 409
    condition: "Counselor session-interval overlap or claimed-shift overlap"
  - id: ERR_ROOM_OCCUPIED
    http: 409
    condition: "Second CrisisVisit for the same shift attempts IN_ROOM while another is IN_ROOM"
  - id: ERR_BOOKING_SUSPENDED
    http: 422
    condition: "Student booking_posture SUSPENDED, or RESTRICTED without director_override"
  - id: ERR_SESSION_LIMIT_REACHED
    http: 422
    condition: "Episode not OPEN, or sessions_consumed >= session_limit without exemption"
  - id: ERR_COUNSELOR_OVER_CAPACITY
    http: 422
    condition: "Counselor weekly session count or caseload risk-point cap would be exceeded"
  - id: ERR_PROGRAM_NOT_OPEN
    http: 409
    condition: "Enrollment attempted on a program not in OPEN"
  - id: ERR_TEMPORAL_INVALID
    http: 422
    condition: "Session starts_at not in the future; shift ends_at <= starts_at; completion before starts_at"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match the parent's current version"
  - id: ERR_NO_CRISIS_COVERAGE
    http: 422
    condition: "Crisis check-in or CRISIS_PROTOCOL completion with no currently CLAIMED WALK_IN shift"
  - id: ERR_POLICY_CONFLICT
    http: 409
    condition: "Publishing a second PUBLISHED policy for a term; retiring without a DRAFT replacement"
  - id: ERR_REFERRAL_LOOP_EXHAUSTED
    http: 422
    condition: "Rematch attempted after 3 decline/rematch loops"
  - id: ERR_ENGAGEMENT_WINDOW
    http: 422
    condition: "confirm-engagement before ENGAGEMENT_CONFIRM_DAYS elapsed since acceptance"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "Enrolled student receiving care; sees own group enrollments and programs"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /ucc/group-enrollments/{id}/drop (own enrollment)"
    shared_operations:
      - "GET /ucc/group-programs, GET /ucc/group-programs/{id}"
  - name: FrontDesk
    description: "Administrative front-desk staff; books, cancels, checks in; never sees clinical note bodies"
    identity: "opaque"
    exclusive_operations:
      - "POST /ucc/sessions/{id}/hold"
      - "POST /ucc/sessions/{id}/release-hold"
      - "POST /ucc/sessions/{id}/cancel"
    shared_operations:
      - "POST /ucc/students"
      - "PATCH /ucc/students/{id} (funding_model only)"
      - "POST /ucc/episodes/{id}/sessions"
      - "POST /ucc/crisis-visits"
      - "GET endpoints per §1.5"
  - name: TriageScreener
    description: "Performs intake screening and risk assessment; routes dispositions"
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /ucc/intake-assessments"
      - "POST /ucc/intake-assessments/{id}/complete"
    shared_operations:
      - "POST /ucc/crisis-visits"
      - "GET endpoints per §1.5"
  - name: Counselor
    description: "Delivers sessions, authors notes, claims crisis shifts, runs groups"
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /ucc/sessions/{id}/complete (own sessions)"
      - "POST /ucc/sessions/{id}/mark-no-show"
      - "POST /ucc/clinical-notes"
      - "POST /ucc/crisis-shifts/{id}/claim"
      - "POST /ucc/crisis-visits/{id}/room, /stabilize (as claimed counselor)"
    shared_operations:
      - "POST /ucc/episodes/{id}/sessions"
      - "POST /ucc/episodes/{id}/close, /reopen (own episodes)"
      - "POST /ucc/group-programs, /publish, /cancel (as facilitator)"
      - "POST /ucc/outcome-measures"
      - "GET endpoints per §1.5"
  - name: ReferralCoordinator
    description: "Manages community provider matching and engagement confirmation"
    identity: "opaque"
    exclusive_operations:
      - "POST /ucc/referrals/{id}/match, /accept, /decline, /rematch, /confirm-engagement"
    shared_operations:
      - "GET endpoints per §1.5"
  - name: ClinicalDirector
    description: "Clinical authority: exemptions, strike resets, policy lifecycle, note access override, reports"
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /ucc/students/{id}/strikes/reset"
      - "POST /ucc/episodes/{id}/exemptions"
      - "POST /ucc/sessions/{id}/excuse"
      - "POST /ucc/policies, /publish, /retire"
      - "POST /ucc/counselors"
      - "POST /ucc/crisis-shifts"
      - "POST /ucc/_clock/set_current_utc"
      - "GET /ucc/reports/capacity"
    shared_operations:
      - "All Counselor shared operations (as supervising clinician)"
      - "GET /ucc/clinical-notes/{id} (any author)"
  - name: Registrar
    description: "Academic-side administrator. Sees ONLY the academic view of students; counseling record is a hard wall"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /ucc/students/{id} (enrollment_status, academic_record_flags)"
    shared_operations:
      - "POST /ucc/students"
      - "GET /ucc/students/{id} (academic view), GET /ucc/students"
      - "GET /ucc/policies, GET /ucc/policies/{id}"
