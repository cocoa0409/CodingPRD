              payload: { name: "HH Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${mid}", commodity_id: "${cid}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
