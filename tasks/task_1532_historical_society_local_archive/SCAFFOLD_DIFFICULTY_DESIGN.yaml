            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Ledger" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Ledger", condition_grade: "GOOD", appraised_value_cents: 15000, format: "BOUND_VOLUME" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Mills", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq: $.data.id } }
            - { call: "POST /research-requests/${rq}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq}/approve", as: ReadingRoomStaff }
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rq}", item_ids: ["${i}"], format: "SCAN_STANDARD", page_estimate: 60, license_class: "PERSONAL", rush: false }, as: Researcher, as_user_id: "${r}", captures: { o: $.data.id } }
