  - rule_id: non_linear_state_machine
    instances:
      - name: referral_info_request_cycle_auto_declines_on_third_request
        grounds:
          - state_machines.Referral.UNDER_TRIAGE_to_INFO_REQUESTED
          - state_machines.Referral.UNDER_TRIAGE_to_DECLINED
          - entities.Referral.fields.info_request_rounds
          - entities.Referral.fields.triage_decision_note
        distinguishing_aspect: |
          Non-linearity of the cyclic kind with a counter-selected branch: one and the same trigger
          (REQUEST_INFO) has two declared target states, and which one fires depends on
          info_request_rounds rather than on the action name. The third REQUEST_INFO does not error
          and does not increment the counter - it silently lands the referral in the terminal DECLINED
          state with the literal note AUTO_DECLINED_INFO_EXHAUSTED.
        test_recipe:
          setup:
            - "One plan and one patient"
            - "A referral with reason AVERAGE_RISK_SCREENING, asa_class_reported 2 and anticoagulant_reported false"
            - "Two full REQUEST_INFO / RESPOND_INFO revision rounds already applied, so info_request_rounds == 2 and status == UNDER_TRIAGE"
            - "The second RESPOND_INFO raised asa_class to 4, so risk_screen_result is OFFICE_VISIT_REQUIRED at the moment of the third request"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt_id}", referring_provider_npi: "3000000001", reason: "AVERAGE_RISK_SCREENING", asa_class_reported: 2, anticoagulant_reported: false }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id, rounds0: $.data.info_request_rounds, screen0: $.data.risk_screen_result }
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "BEGIN_TRIAGE" }
              as: ReferralCoordinator
              captures: { screen1: $.data.risk_screen_result }
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "REQUEST_INFO", note: "need anticoagulant list" }
              as: ReferralCoordinator
              captures: { rounds1: $.data.info_request_rounds }
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "RESPOND_INFO", updated_anticoagulant: false }
              as: ReferralCoordinator
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "REQUEST_INFO", note: "need ASA class confirmation" }
              as: ReferralCoordinator
              captures: { rounds2: $.data.info_request_rounds }
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "RESPOND_INFO", updated_asa_class: 4 }
              as: ReferralCoordinator
              captures: { status_before: $.data.status, screen2: $.data.risk_screen_result }
          trigger:
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "REQUEST_INFO", note: "third request - still incomplete" }
              as: ReferralCoordinator
            - call: "POST /referrals/${ref_id}/triage-actions"
              payload: { action: "ACCEPT_OFFICE_VISIT", note: "attempt to revive a terminal referral" }
              as: ReferralCoordinator
          assert:
            - "${rounds0} == 0 and ${rounds1} == 1 and ${rounds2} == 2"
            - "${screen0} == PENDING and ${screen1} == CLEARED_OPEN_ACCESS"
            - "${status_before} == UNDER_TRIAGE"
            - "${screen2} == OFFICE_VISIT_REQUIRED"
            - "the first trigger call returns 200 and Referral.${ref_id}.status == DECLINED"
            - "Referral.${ref_id}.info_request_rounds == 2 (unchanged - the auto-decline does not consume a round)"
            - "Referral.${ref_id}.triage_decision_note == AUTO_DECLINED_INFO_EXHAUSTED (the supplied note is ignored)"
            - "the second trigger call returns error_id ERR_INVALID_REFERRAL_STATE with HTTP 409"
            - "Referral.${ref_id}.status is still DECLINED"
      - name: episode_parallel_dimensions_advance_independently
        grounds:
          - state_machines.ScreeningEpisode.clinical_status
          - state_machines.ScreeningEpisode.navigation_status
          - state_machines.ScreeningEpisode.PREP_CONFIRMED_to_PREP_AT_RISK
          - entities.ScreeningEpisode.fields.prep_attestation
        distinguishing_aspect: |
          Non-linearity of the parallel kind on a different entity: a single abort call drives the two
          state dimensions of one ScreeningEpisode to two different targets - clinical_status
          regresses PROCEDURE_SCHEDULED to OPEN while navigation_status regresses PREP_CONFIRMED to
          PREP_AT_RISK - and a later outreach then advances only the navigation dimension, leaving
          clinical_status at OPEN. The pair, not either field alone, is the observable state.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and held there for the whole recipe"
            - "MAC block on 2026-09-15 with coverage, one 45-minute booking at 13:00Z"
            - "One acknowledged PHONE outreach (score 3.00, navigation OUTREACH_ACTIVE) then a completed prep attestation (score 5.50, navigation PREP_CONFIRMED)"
            - "Booking checked in and started, so clinical_status is PROCEDURE_SCHEDULED and booking.status is IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
