              payload: { facility_id: "${fac_id}", committed_fill_rate_pct: 90.0, deliveries_per_week: 5, lum_commitment: false, annual_commitment_cents: 100000000, start_date: "2026-01-01", end_date: "2027-08-31" }
              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /supply/inventory-programs"
              payload: { facility_id: "${fac_id}", program_type: "STOCKROOM_MANAGED", positions: [ { product_id: "${p1_id}", par_level: 50, reorder_point: 10, on_hand: 5 } ] }
              as: SupplyChainAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-10", lines: [ { product_id: "${p1_id}", ordered_qty: 100 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-11", lines: [ { product_id: "${p1_id}", ordered_qty: 50 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-12-10", lines: [ { product_id: "${p1_id}", ordered_qty: 50 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { o3_id: $.data.id }
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 60, backorder_cancelled: false } ] }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
            - call: "GET /supply/prime-vendor-agreements/${agr_id}"
              payload: {}
              as: SupplyChainAdmin
              captures: { roll_o1: $.data.rolling_fill_rate_pct, stat_o1: $.data.status }
            - call: "POST /supply/distribution-orders/${o2_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 50, backorder_cancelled: false } ] }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders/${o2_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
            - call: "GET /supply/prime-vendor-agreements/${agr_id}"
              payload: {}
              as: SupplyChainAdmin
              captures: { roll_mid: $.data.rolling_fill_rate_pct, stat_mid: $.data.status }
            - call: "GET /supply/inventory-programs/${prog_id}"
              payload: {}
              as: SupplyChainAdmin
              captures: { muted_mid: $.data.auto_replenish_enabled }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-06T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders/${o3_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 50, backorder_cancelled: false } ] }
