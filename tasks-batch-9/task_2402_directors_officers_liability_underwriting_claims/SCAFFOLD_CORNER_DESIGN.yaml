          CANCELLED is terminal on the coverage dimension, and priority 44 carries a per-operation
          permitted set rather than one global set: a second cancel, a run-off endorsement and a premium
          payment all bounce off it with the same code, and the payment probe uses a deliberately wrong
          amount to prove 44 is evaluated before priority 85's amount check. The already-computed return
          premium must not be recalculated by the failed calls.
