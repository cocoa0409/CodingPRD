scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: project_creation_returns_201_with_fields
        claim_type: Creation
        grounds:
          - "entities.ResearchProject"
          - "endpoints"
        distinguishing_aspect: "POST /genealogy/projects with all required fields returns 201, status DRAFT, version 1, and echoes client_id/package_type."
        test_recipe:
          setup:
            - "one client and one researcher provisioned"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E1 Client", email: "e1@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E1 R", email: "e1r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
          trigger:
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "New request", objective: "Trace maternal line", package_type: "HOURLY", package_price_cents: 0, budget_hours: 5 }
              as: ProjectManager
              captures: { project_id: $.data.id }
          assert:
            - "ResearchProject.${project_id}.status == DRAFT"
            - "ResearchProject.${project_id}.version == 1"
            - "ResearchProject.${project_id}.package_type == HOURLY"

      - name: person_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.Person"
          - "errors[ERR_PERSON_NOT_FOUND]"
        distinguishing_aspect: "GET /genealogy/persons/{unknown-uuid} returns ERR_PERSON_NOT_FOUND (404); no person exists at that id."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /genealogy/persons/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PERSON_NOT_FOUND"

      - name: project_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.ResearchProject.fields.package_type"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /genealogy/projects omitting the required package_type returns ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "one client and researcher provisioned"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E3 Client", email: "e3@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E3 R", email: "e3r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
          trigger:
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "No package", objective: "obj", package_price_cents: 1000, budget_hours: 5 }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: client_create_omitting_tier_applies_default_standard
        claim_type: Defaults
        grounds:
          - "entities.Client.fields.tier"
        distinguishing_aspect: "POST /genealogy/clients without tier defaults tier to STANDARD."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /genealogy/clients"
              payload: { name: "Default Tier", email: "dt@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
          assert:
            - "Client.${client_id}.tier == STANDARD"

      - name: person_system_fields_generated_on_create
        claim_type: System Fields
        grounds:
          - "entities.Person"
        distinguishing_aspect: "POST /genealogy/persons mints id, created_at and version (== 1); verification_status defaults to DRAFT."
        test_recipe:
          setup:
            - "one project provisioned"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E5 C", email: "e5@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E5 R", email: "e5r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "Ada Fresh" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { person_id: $.data.id }
          assert:
            - "Person.${person_id}.version == 1"
            - "Person.${person_id}.verification_status == DRAFT"

      - name: person_self_referential_parent_fk_reverse_lookup
        claim_type: Parent Relationships
        grounds:
          - "entities.Person.fields.father_id"
          - "endpoints"
        distinguishing_aspect: "A child Person created with father_id set is discoverable via GET /genealogy/persons?father_id={parent_id} (self-referential FK reverse-reachability)."
        test_recipe:
          setup:
            - "project with a parent Person and a child Person referencing father_id"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E6 C", email: "e6@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E6 R", email: "e6r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "Father Node" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { father_id: $.data.id }
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "Child Node", father_id: "${father_id}" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { child_id: $.data.id }
          trigger:
            - call: "GET /genealogy/persons?father_id=${father_id}"
              payload: {}
              as: ProjectManager
          assert:
            - "response.data is an array containing Person ${child_id}"
            - "response.data.total_count == 1"

      - name: person_create_with_unknown_project_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - "entities.Person.fields.project_id"
          - "errors[ERR_PROJECT_NOT_FOUND]"
        distinguishing_aspect: "POST /genealogy/persons with a project_id that does not exist returns ERR_PROJECT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "one researcher provisioned; no such project"
          setup_api_calls:
            - call: "POST /genealogy/researchers"
              payload: { name: "E7 R", email: "e7r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
          trigger:
            - call: "POST /genealogy/persons"
              payload: { project_id: "00000000-0000-4000-8000-000000000001", full_name: "Orphan" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PROJECT_NOT_FOUND"

  # =================================================================
  - section: state_machines
    instances:
      - name: verify_person_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Person.UNDER_REVIEW_to_VERIFIED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /genealogy/persons/{id}/verify while the person is DRAFT (not UNDER_REVIEW) returns ERR_INVALID_STATE; the state precondition fails before any citation/confidence check."
        test_recipe:
          setup:
            - "ACTIVE project with a DRAFT person"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E8 C", email: "e8@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E8 R", email: "e8r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "Still Draft" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { person_id: $.data.id }
          trigger:
            - call: "POST /genealogy/persons/${person_id}/verify"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: accept_already_accepted_deliverable_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Deliverable.SUBMITTED_to_ACCEPTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Re-accepting a Deliverable already in terminal ACCEPTED returns ERR_INVALID_STATE; no transition leaves ACCEPTED."
        test_recipe:
          setup:
            - "deliverable driven to ACCEPTED"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E9 C", email: "e9@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E9 R", email: "e9r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/deliverables"
              payload: { project_id: "${project_id}", deliverable_type: "RESEARCH_REPORT" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { d_id: $.data.id }
            - call: "POST /genealogy/deliverables/${d_id}/submit"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/deliverables/${d_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /genealogy/deliverables/${d_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: activate_already_active_project_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - "state_machines.ResearchProject.DRAFT_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Activating a project already ACTIVE returns ERR_INVALID_STATE (activate is not idempotent)."
        test_recipe:
          setup:
            - "project activated once"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E10 C", email: "e10@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E10 R", email: "e10r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: heirloom_advance_received_to_catalogued
        claim_type: Valid Transition
        grounds:
          - "state_machines.HeirloomItem.RECEIVED_to_CATALOGUED"
          - "entities.HeirloomItem.fields.archive_status"
        distinguishing_aspect: "POST /genealogy/heirlooms/{id}/advance (target_status CATALOGUED) moves archive_status RECEIVED->CATALOGUED."
        test_recipe:
          setup:
            - "project with an heirloom item in RECEIVED"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E11 C", email: "e11@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E11 R", email: "e11r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/heirlooms"
              payload: { project_id: "${project_id}", description: "Family bible", category: "DOCUMENT" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { heirloom_id: $.data.id }
          trigger:
            - call: "POST /genealogy/heirlooms/${heirloom_id}/advance"
              payload: { target_status: "CATALOGUED" }
              as: Researcher
              as_user_id: "${researcher_id}"
          assert:
            - "HeirloomItem.${heirloom_id}.archive_status == CATALOGUED"

      - name: side_effect_cascade_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.SourceCitation.UNVERIFIED_to_VERIFIED"
        excluded_because:
          difficulty_instance: transitive_cascade / citation_verify_cascades_to_research_complete_depth4
          rationale: "The full citation->person->project cascade side-effect chain is asserted by the named §1.8 instance."

  # =================================================================
  - section: calculations
    instances:
      - name: dna_predicted_relationship_cousin_lower_boundary
        claim_type: Correct Result
        grounds:
          - "calculations.dna_predicted_relationship"
          - "entities.DnaInterpretation.fields.predicted_relationship"
        distinguishing_aspect: "cm_shared exactly 200 maps to COUSIN (inclusive lower bound >=200); the interpretation also flips status to INTERPRETED. Requires the subject Person VERIFIED."
        test_recipe:
          setup:
            - "VERIFIED subject person (2 PRIMARY VERIFIED citations); ORDERED DNA interpretation"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E12 C", email: "e12@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E12 R", email: "e12r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10, target_person_count: 1 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "DNA Subject" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { person_id: $.data.id }
            - call: "POST /genealogy/persons/${person_id}/submit-review"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/record-searches"
              payload: { project_id: "${project_id}", repository_name: "Archive", search_terms: "subj", estimated_hours: 1 }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { search_id: $.data.id }
            - call: "POST /genealogy/record-searches/${search_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "Birth", source_type: "VITAL_RECORD", quality: "PRIMARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { cit1_id: $.data.id }
            - call: "POST /genealogy/citations/${cit1_id}/verify"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "Baptism", source_type: "CHURCH", quality: "PRIMARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { cit2_id: $.data.id }
            - call: "POST /genealogy/citations/${cit2_id}/verify"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/dna-interpretations"
              payload: { project_id: "${project_id}", subject_person_id: "${person_id}", test_provider: "23andMe" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { dna_id: $.data.id }
          trigger:
            - call: "POST /genealogy/dna-interpretations/${dna_id}/interpret"
              payload: { cm_shared: 200 }
              as: Researcher
              as_user_id: "${researcher_id}"
          assert:
            - "DnaInterpretation.${dna_id}.predicted_relationship == COUSIN"
            - "DnaInterpretation.${dna_id}.status == INTERPRETED"

      - name: person_confidence_variants_covered_by_difficulty
        claim_type: Variant Divergence
        grounds:
          - "calculations.person_confidence"
        excluded_because:
          difficulty_instance: dual_variant_calc / person_confidence_provisional_vs_verified_divergence
          rationale: "Provisional-vs-verified divergence is asserted numerically by the named §1.8 instance."

  # =================================================================
  - section: validations
    instances:
      - name: appointment_end_before_start_returns_invalid_interval_422
        claim_type: Violation to Error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_INVALID_INTERVAL]"
        distinguishing_aspect: "POST /genealogy/appointments with end_utc <= start_utc returns ERR_INVALID_INTERVAL (422)."
        test_recipe:
          setup:
            - "ACTIVE project, a repository and a researcher"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E13 C", email: "e13@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E13 R", email: "e13r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/repositories"
              payload: { name: "Repo", location: "NYC" }
              as: ProjectManager
              captures: { repo_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /genealogy/appointments"
              payload: { repository_id: "${repo_id}", project_id: "${project_id}", researcher_id: "${researcher_id}", start_utc: "2026-04-01T10:00:00Z", end_utc: "2026-04-01T09:00:00Z" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_INTERVAL"

      - name: citation_on_incomplete_search_returns_search_not_completed
        claim_type: Violation to Error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_SEARCH_NOT_COMPLETED]"
        distinguishing_aspect: "Citing a same-project record search still in PENDING (not COMPLETED) returns ERR_SEARCH_NOT_COMPLETED (409) — the constraint check in isolation, with no referential violation."
        test_recipe:
          setup:
            - "ACTIVE project; a PENDING record search and a person in the SAME project"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E14 C", email: "e14@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E14 R", email: "e14r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/record-searches"
              payload: { project_id: "${project_id}", repository_name: "Archive", search_terms: "x", estimated_hours: 1 }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { search_id: $.data.id }
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "Same Project Person" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { person_id: $.data.id }
          trigger:
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "x", source_type: "CENSUS", quality: "PRIMARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SEARCH_NOT_COMPLETED"

  # =================================================================
  - section: endpoints
    instances:
      - name: citations_reverse_lookup_by_person_filtered_list
        claim_type: Computed read
        grounds:
          - "entities.SourceCitation.fields.person_id"
          - "endpoints"
        distinguishing_aspect: "A created citation is discoverable via GET /genealogy/citations?person_id={id} (filtered-list FK reverse-reachability)."
        test_recipe:
          setup:
            - "ACTIVE project, COMPLETED search, person, one citation"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E15 C", email: "e15@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E15 R", email: "e15r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/persons"
              payload: { project_id: "${project_id}", full_name: "Cited Person" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { person_id: $.data.id }
            - call: "POST /genealogy/record-searches"
              payload: { project_id: "${project_id}", repository_name: "Archive", search_terms: "x", estimated_hours: 1 }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { search_id: $.data.id }
            - call: "POST /genealogy/record-searches/${search_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/citations"
              payload: { record_search_id: "${search_id}", person_id: "${person_id}", citation_text: "Birth", source_type: "VITAL_RECORD", quality: "PRIMARY" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { cit_id: $.data.id }
          trigger:
            - call: "GET /genealogy/citations?person_id=${person_id}"
              payload: {}
              as: ProjectManager
          assert:
            - "response.data is an array containing SourceCitation ${cit_id}"
            - "response.data.total_count == 1"

  # =================================================================
  - section: errors
    instances:
      - name: auth_missing_header_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no valid X-User-Role/X-User-ID header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "empty database; request sent with no authentication headers"
          setup_api_calls: []
          trigger:
            - call: "POST /genealogy/clients"
              payload: { name: "Ghost", email: "ghost@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: client_creating_researcher_returns_unauthorized
        claim_type: Violation to Error
        grounds:
          - "validations[priority=2]"
          - "roles"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "A Client calling POST /genealogy/researchers (a ProjectManager-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
            - "one client provisioned to act as"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E17 C", email: "e17@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /genealogy/researchers"
              payload: { name: "Sneaky", email: "sneaky@x.com", hourly_rate_cents: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: non_owner_client_accept_deliverable_returns_forbidden
        claim_type: Violation to Error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_FORBIDDEN_NOT_OWNER]"
        distinguishing_aspect: "A Client who is not the project's owner accepting a SUBMITTED deliverable returns ERR_FORBIDDEN_NOT_OWNER (403)."
        test_recipe:
          setup:
            - "project owned by clientA with a SUBMITTED deliverable; clientB is a different client"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "Owner A", email: "ownera@x.com" }
              as: ProjectManager
              captures: { client_a_id: $.data.id }
            - call: "POST /genealogy/clients"
              payload: { name: "Other B", email: "otherb@x.com" }
              as: ProjectManager
              captures: { client_b_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E18 R", email: "e18r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_a_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/deliverables"
              payload: { project_id: "${project_id}", deliverable_type: "RESEARCH_REPORT" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { d_id: $.data.id }
            - call: "POST /genealogy/deliverables/${d_id}/submit"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
          trigger:
            - call: "POST /genealogy/deliverables/${d_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_NOT_OWNER"

