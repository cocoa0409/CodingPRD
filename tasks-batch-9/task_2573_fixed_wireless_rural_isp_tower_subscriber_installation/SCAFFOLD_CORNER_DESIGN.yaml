      - name: body_validation_outranks_existence_and_missing_auth_outranks_everything
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=3]
          - validations[priority=5]
          - errors.ERR_VALIDATION
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          One request that violates three rules at once must report exactly one code, chosen by
          priority: a negative committed_mbps plus an unknown tower_id yields the priority-3
          ERR_VALIDATION (400), never the priority-5 ERR_TOWER_NOT_FOUND; strip the X-User-ID header
          from that same request and the answer becomes the priority-1 ERR_UNAUTHENTICATED (401), so
          neither the body nor the missing parent is ever consulted.
        test_recipe:
          setup:
            - "An empty system - not even a Tower is needed, which is the point: the unknown tower_id must never be the reported failure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkEngineer
          trigger:
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "twr_does_not_exist", carrier_name: "Ghost Carrier", circuit_ref: "GH-CIR-0001", committed_mbps: -5, monthly_cost_cents: 90000 }
              as: NetworkEngineer
              captures: { err_priority_body: $.data.error_id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "twr_does_not_exist", carrier_name: "Ghost Carrier", circuit_ref: "GH-CIR-0001", committed_mbps: -5, monthly_cost_cents: 90000 }
              as: none
              note: "sent with no X-User-ID and no X-Role header at all"
              captures: { err_priority_auth: $.data.error_id }
          assert:
            - "The first call returns HTTP 400 with ${err_priority_body} == \"ERR_VALIDATION\", not 404 ERR_TOWER_NOT_FOUND"
            - "The second call returns HTTP 401 with ${err_priority_auth} == \"ERR_UNAUTHENTICATED\""
            - "Both responses carry the standard error envelope with error_id and message and no data payload"
            - "No BackhaulCircuit row was created by either call"

      - name: priority_conflict_expired_qualification_before_capacity_posture
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=16]
        excluded_because:
          difficulty_instance: expired_qualification_outranks_sector_capacity_hold_posture
          rationale: |
            This is exactly the §1.8 priority-conflict instance: one request that is both past its
            qualification expiry and aimed at a HOLD-posture sector, asserting the priority-8 code wins.
            A corner repeat would need the identical two-fault fixture and the identical assertion.

      - name: priority_conflict_licence_ceiling_before_same_tower_referential_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: eirp_over_licence_ceiling_outranks_same_tower_coordination_referential_check
          rationale: |
            The §1.8 instance already sends one coordination request that violates both the priority-10
            EIRP ceiling and the priority-13 same-tower rule and pins the reported code; the corner file
            covers each rule separately in its own clean single-fault instance, which is the
            complementary half of the obligation.

      - name: conditional_serviceability_requires_at_least_one_active_sector
        claim_type: violation_to_error
        grounds:
          - calculations.sector_selection
          - entities.ServiceabilityRequest.fields.denial_reason
        excluded_because:
          difficulty_instance: serviceability_denied_when_active_sector_candidate_set_is_empty
          rationale: |
            The empty-candidate-set branch and its NO_ACTIVE_SECTOR denial (as opposed to the
            CAPACITY_DEFERRED branch, which the corner file reaches through the capacity instances) is
            fully pinned by the §1.8 instance on a tower whose only sector is still PLANNED.

      - name: temporal_guard_band_touching_edges_are_allowed
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=10]
          - errors.ERR_CHANNEL_OVERLAP_GUARD_BAND
        excluded_because:
          difficulty_instance: guard_band_inflated_channel_may_touch_but_not_overlap_neighbour
          rationale: |
            The §1.8 instance drives both sides of the strict-inequality boundary - a guard-band-inflated
            proposal whose upper edge exactly touches the neighbour's lower edge is accepted, and one
            0.5 MHz further in is refused - together with the MIN_AZIMUTH_SEPARATION_DEG precondition, so
            a corner instance would restate the same two calls.

  - section: endpoints
    instances:
      - name: tower_read_and_its_nested_child_lists_are_scoped_to_that_tower
        claim_type: standard_crud
        grounds:
          - endpoints[GET /towers/{id}]
          - endpoints[GET /towers/{id}/backhaul-circuits]
          - endpoints[GET /towers/{id}/outage-events]
        distinguishing_aspect: |
          The nested collections are scoped by the path id, not by a global filter: with two towers each
          owning one circuit and one outage, GET /towers/{A}/backhaul-circuits and
          GET /towers/{A}/outage-events must each return exactly one row - tower A's - and the same
          endpoints on tower B must return only B's. The cause filter on the outage list must compose with
          that scoping instead of replacing it.
        test_recipe:
          setup:
            - "Tower A RB-TWR-001 with circuit PF-CIR-8801 and one POWER outage; Tower B RB-TWR-002 with circuit MB-CIR-2201 and one WEATHER_WIND outage."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_a: $.data.id }
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-002", latitude: 41.4000, longitude: -104.5000, ground_elevation_m: 1320.0, antenna_agl_m: 38.0, lease_landowner_name: "Meadow Bluff LLC", lease_monthly_base_rent_cents: 39000, lease_escalator_pct: 0.0300, lease_start_date: "2024-02-01", lease_term_months: 48 }
              as: NetworkEngineer
              captures: { tower_b: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_a}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_a: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_b}", carrier_name: "Meadow Backhaul", circuit_ref: "MB-CIR-2201", committed_mbps: 300, monthly_cost_cents: 90000 }
              as: NetworkEngineer
              captures: { circuit_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: NetworkEngineer
            - call: "POST /outage-events"
              payload: { tower_id: "${tower_a}", cause: "POWER", started_at: "2026-08-05T00:00:00Z" }
              as: NetworkEngineer
              captures: { outage_a: $.data.id }
            - call: "POST /outage-events"
              payload: { tower_id: "${tower_b}", cause: "WEATHER_WIND", started_at: "2026-08-05T01:00:00Z" }
              as: NetworkEngineer
              captures: { outage_b: $.data.id }
          trigger:
            - call: "GET /towers/${tower_a}"
              as: NetworkEngineer
              captures: { read_site: $.data.site_code, read_backhaul: $.data.backhaul_accepted_mbps, read_status: $.data.status }
            - call: "GET /towers/${tower_a}/backhaul-circuits"
              as: NetworkEngineer
              captures: { first_circuit: "$.data[0].id" }
            - call: "GET /towers/${tower_a}/outage-events"
              as: BillingAdmin
              captures: { first_outage: "$.data[0].id" }
          assert:
            - "All three reads return HTTP 200"
            - "${read_site} == \"RB-TWR-001\", ${read_status} == \"PLANNED\" and ${read_backhaul} == 0 - no circuit is ACCEPTED yet"
            - "The circuit list has total_count 1 and ${first_circuit} == ${circuit_a}; ${circuit_b} does not appear"
            - "The outage list has total_count 1 and ${first_outage} == ${outage_a}; ${outage_b} does not appear"
            - "GET /towers/{tower_b}/backhaul-circuits returns exactly ${circuit_b}, proving the scoping is by path id and not by insertion order"
            - "GET /towers/{tower_a}/outage-events?cause=WEATHER_WIND returns total_count 0 - the filter narrows within the tower rather than searching globally"

      - name: capacity_policy_change_reprices_the_posture_without_touching_any_reservation
        claim_type: action
        grounds:
          - endpoints[POST /sectors/{id}/capacity-policy]
          - calculations.sector_capacity_posture
          - entities.Sector.fields.max_oversubscription_ratio
        distinguishing_aspect: |
          The action rewrites the denominator of every posture threshold: with committed_mbps pinned at
          100 the ratio stays 4.000, but lowering max_oversubscription_ratio from 8.0 to 5.0 moves
          r_hold from 6.0 to 3.75, so the sector flips WATCH -> HOLD and remaining_allowance_mbps drops
          from 100 to 25 without a single CapacityHold being created, released or resized. Only the
          Sector row's version may move.
