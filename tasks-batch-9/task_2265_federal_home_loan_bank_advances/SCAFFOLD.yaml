    note: "only allowed while the review is in FIELD_WORK"

  - method: POST
    path: /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/issue-findings
    roles: [CollateralReviewAuditor]
    input: []
    output: CollateralVerificationReview
    side_effects:
      - "drives FIELD_WORK -> FINDINGS_ISSUED"
      - "auto-advances FINDINGS_ISSUED -> REMEDIATION in the same request when an OPEN CRITICAL finding exists"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_REVIEW_NOT_FOUND, ERR_INVALID_STATE]

  - method: POST
    path: /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/retest
    roles: [CollateralReviewAuditor]
    input: []
    output: CollateralVerificationReview
    side_effects:
      - "drives REMEDIATION -> FIELD_WORK and increments retest_count by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_REVIEW_NOT_FOUND, ERR_INVALID_STATE, ERR_CRITICAL_FINDINGS_OPEN, ERR_RETEST_LIMIT_EXCEEDED]

  - method: POST
    path: /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/close
    roles: [CollateralReviewAuditor]
    input: []
    output: CollateralVerificationReview
    side_effects:
      - "runs the five-level cascade documented in state_machines.CollateralVerificationReview FINDINGS_ISSUED -> CLOSED (L1 review scoring and finding UNRESOLVED flip, L2 asset factor recomputation and suspension, L3 member lendable/capacity/posture, L4 shortfall opening plus advance credit and collateral status changes, L5 subsidy release and stock recomputation)"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_REVIEW_NOT_FOUND, ERR_INVALID_STATE, ERR_CRITICAL_FINDINGS_OPEN]

