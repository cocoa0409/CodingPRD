  - rule_id: compensating_invariant
    instances:
      - name: expense_approve_void_conserves_recoupment
        grounds:
          - state_machines.TourExpense.SUBMITTED_to_APPROVED
          - state_machines.TourExpense.APPROVED_to_VOIDED
          - entities.RecoupmentAccount.fields.total_unrecouped_cents
        distinguishing_aspect: |
          Conserved quantity: RecoupmentAccount.total_unrecouped_cents (a money
          balance). approve(12000) followed by void(12000) leaves
          tour_support_balance_cents and total_unrecouped_cents exactly at
          their pre-approve values — no drift.
        test_recipe:
          setup:
            - "Label defaults; contract advance 0 (all buckets 0); tour support requested 24000, approved 24000 (admin-1), advanced 12000 (fin-1); TRAVEL expense 12000 SUBMITTED (category cap floor(0.5 x 24000) == 12000 exactly)"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label I1" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist I1", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "CROSS_COLLATERALIZED", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/tour-supports", payload: { tour_name: "Tour I1", requested_amount_cents: 24000 }, as: AnRManager, captures: { ts_id: $.data.id } }
            - { call: "POST /api/tour-supports/${ts_id}/approve", payload: { approved_budget_cents: 24000 }, as: LabelAdmin, as_user_id: "admin-1" }
            - { call: "POST /api/tour-supports/${ts_id}/advance-funds", payload: { amount_cents: 12000 }, as: FinanceController, as_user_id: "fin-1" }
            - { call: "POST /api/tour-supports/${ts_id}/expenses", payload: { category: "TRAVEL", amount_cents: 12000, expense_date: "2026-09-15" }, as: ArtistPortal, as_user_id: "${artist_id}", captures: { exp_id: $.data.id } }
            - { call: "GET /api/contracts/${contract_id}/recoupment-accounts", payload: {}, as: FinanceController, captures: { base_tour: "$.data[0].tour_support_balance_cents", base_total: "$.data[0].total_unrecouped_cents" } }
          trigger:
            - { call: "POST /api/tour-expenses/${exp_id}/approve", payload: {}, as: FinanceController }
            - { call: "POST /api/tour-expenses/${exp_id}/void", payload: {}, as: FinanceController }
          assert:
            - "After approve: tour_support_balance_cents == 12000 and total_unrecouped_cents == 12000"
            - "After void: tour_support_balance_cents == 0 == base_tour and total_unrecouped_cents == 0 == base_total (conserved)"
            - "TourSupport.${ts_id}.approved_expense_total_cents == 0 after the void"
            - "TourExpense.${exp_id}.status == VOIDED"

