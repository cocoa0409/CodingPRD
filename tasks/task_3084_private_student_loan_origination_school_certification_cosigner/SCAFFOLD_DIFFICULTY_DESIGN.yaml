  - rule_id: compensating_invariant
    instances:

      - name: reversal_conserves_the_lifetime_qualifying_payment_count
        grounds:
          - state_machines.Payment.PAID_ON_TIME_to_REVERSED
          - entities.Borrower.fields.lifetime_on_time_payment_count
          - entities.Borrower.fields.on_time_payment_run_count
          - calculations.autodebit_waiver_benefit
        distinguishing_aspect: "Conserved quantity = the lifetime qualifying-payment count: reversing a cleared payment must strip it from the unbroken RUN (run drops 24 -> 23) while leaving lifetime_on_time_payment_count at 24, so the 25-basis-point rate reduction earned by the forward action survives its compensation."
