            - call: "POST /loan-applications/${loan1}/pricing-exceptions"
              payload: { requested_rate_bps: 600, concession_cents: 400000, reason_code: "COMPETITIVE_MATCH", justification_text: "Competitor concession quoted at exactly our policy cap for this locked amount." }
              as: Originator
