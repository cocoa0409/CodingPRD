# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Ride-Sharing Dynamic Surge Pricing
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: surge_multiplier_rush_vs_standard_window
        grounds:
          - calculations.surge_multiplier
          - entities.SurgeSnapshot.fields.multiplier
          - entities.Zone.fields.current_multiplier
        distinguishing_aspect: |
          On the SurgeSnapshot/Zone pricing domain, identical observed_demand=4 / observed_supply=2
          yields multiplier 2.00 in the standard window but 2.50 in the rush window (raw 2.00 + 0.50
          rush step), a strictly larger result for identical demand/supply inputs.
        test_recipe:
          setup:
            - "Two non-airport zones with base_fare_cents 1000 each, both at version 1."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Std-A1", grid_code: "A1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { zone_std_id: $.data.id, zone_std_v: $.data.version }
            - call: "POST /zones"
              payload: { name: "Rush-A2", grid_code: "A2", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { zone_rush_id: $.data.id, zone_rush_v: $.data.version }
          trigger:
            - call: "POST /zones/${zone_std_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${zone_std_v}" }
              as: Dispatcher
              captures: { snap_std_mult: $.data.multiplier }
            - call: "POST /zones/${zone_rush_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: true, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${zone_rush_v}" }
              as: Dispatcher
              captures: { snap_rush_mult: $.data.multiplier }
          assert:
            - "SurgeSnapshot.${zone_std_id}.multiplier == 2.00"
            - "SurgeSnapshot.${zone_rush_id}.multiplier == 2.50"
            - "Zone.${zone_std_id}.current_multiplier == 2.00 and Zone.${zone_rush_id}.current_multiplier == 2.50"

      - name: dispute_refund_bounded_by_remaining
        grounds:
          - calculations.dispute_refund
          - entities.Dispute.fields.refund_cents
          - entities.Trip.fields.refunded_cents
          - state_machines.Dispute.OPEN_to_UPHELD
        distinguishing_aspect: |
          On the Dispute/Trip ledger domain, a second upheld dispute on a trip whose fare (2150) is
          partially refunded (500 already) is bounded to the remaining 1650 even though it requested
          2000 — the refund is min(requested, final_fare - already_refunded), a different entity domain
          than surge pricing.
        test_recipe:
          setup:
            - "One zone base 1000, current_multiplier 2.00; a completed trip with final_fare_cents 2150; rider funded; one prior UPHELD dispute already refunded 500 (Trip.refunded_cents == 500)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "B1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T02:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
            - call: "POST /trips/${trip_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /disputes"
              payload: { trip_id: "${trip_id}", reason: "OVERCHARGED", requested_refund_cents: 500 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { disp1_id: $.data.id }
            - call: "POST /disputes/${disp1_id}/resolve"
              payload: { decision: "UPHELD" }
              as: Dispatcher
            - call: "POST /disputes"
              payload: { trip_id: "${trip_id}", reason: "ROUTE_ERROR", requested_refund_cents: 2000 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { disp2_id: $.data.id }
          trigger:
            - call: "POST /disputes/${disp2_id}/resolve"
              payload: { decision: "UPHELD" }
              as: Dispatcher
              captures: { disp2_refund: $.data.refund_cents }
          assert:
            - "Dispute.${disp2_id}.refund_cents == 1650"
            - "Trip.${trip_id}.refunded_cents == 2150"
            - "Rider.${rider_id}.wallet_balance_cents == 5000   # 5000 - 2150 charge + 500 refund1 + 1650 refund2"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: surge_multiplier_nonlinear_band_rush_cap
        grounds:
          - calculations.surge_multiplier
          - entities.SurgeSnapshot.fields.capped
          - entities.SurgeSnapshot.fields.multiplier
        distinguishing_aspect: |
          Mode (a): >=3 inputs (observed_demand, observed_supply, is_rush_hour) interact non-linearly via
          ratio banding -> additive rush step -> min() cap clamp; demand=9/supply=3/rush=true gives raw
          2.50+0.50=3.00 clamped to 2.50 with capped=true, not a linear scaling of any single input.
        test_recipe:
          setup:
            - "One non-airport zone base 1000 at version 1."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "C1", grid_code: "C1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
          trigger:
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 9, observed_supply: 3, is_rush_hour: true, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
              captures: { snap_ratio: $.data.ratio, snap_mult: $.data.multiplier, snap_capped: $.data.capped }
          assert:
            - "SurgeSnapshot.${z_id}.ratio == 3.00"
            - "SurgeSnapshot.${z_id}.multiplier == 2.50"
            - "SurgeSnapshot.${z_id}.capped == true"
            - "Zone.${z_id}.heat_level == BLAZING"

      - name: trip_final_fare_surge_then_fee_rounding_order
        grounds:
          - calculations.trip_final_fare
          - entities.Trip.fields.final_fare_cents
          - state_machines.Trip.ENROUTE_to_COMPLETED
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round(base*multiplier) to whole cents FIRST, THEN
          add the flat 150 booking fee. With base 1000 and quoted_multiplier 1.50: surged round(1500)=1500,
          final 1650; the alternative (add fee then multiply -> round(1150*1.5)=1725) is NOT used.
        test_recipe:
          setup:
            - "Zone base 1000 with current_multiplier 1.50; rider funded 5000; one trip taken to COMPLETED."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "F1", grid_code: "D1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 3, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id, q_mult: $.data.quoted_multiplier }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
            - call: "POST /trips/${trip_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { final_fare: $.data.final_fare_cents }
          assert:
            - "Trip.${trip_id}.quoted_multiplier == 1.50"
            - "Trip.${trip_id}.final_fare_cents == 1650"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: trip_branching_matched_vs_expired_divergent_side_effects
        grounds:
          - state_machines.Trip.REQUESTED_to_MATCHED
          - state_machines.Trip.REQUESTED_to_EXPIRED
          - entities.Trip.fields.driver_id
          - entities.Zone.fields.open_demand_count
        distinguishing_aspect: |
          Trip forks at REQUESTED into {MATCHED, EXPIRED} with divergent side-effect sets: MATCH sets
          driver_id and flips a driver to ON_TRIP (supply -1) while decrementing demand; EXPIRE only
          decrements demand and leaves driver_id null. Non-linear branching on the Trip entity.
        test_recipe:
          setup:
            - "Zone with two REQUESTED trips and one online driver; one trip will MATCH, the other will EXPIRE."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "E1", grid_code: "E1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 0 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_a_id: $.data.id }
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_b_id: $.data.id }
          trigger:
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
              captures: { matched_count: $.data.matched_count }
            - call: "POST /trips/${trip_b_id}/expire"
              payload: {}
              as: Dispatcher
          assert:
            - "Trip.${trip_a_id}.status == MATCHED and Trip.${trip_a_id}.driver_id == ${drv_id}"
            - "Trip.${trip_b_id}.status == EXPIRED and Trip.${trip_b_id}.driver_id == null"
            - "Zone.${z_id}.open_demand_count == 0"
            - "Driver.${drv_id}.status == ON_TRIP"

      - name: dispute_branching_upheld_vs_rejected_divergent_side_effects
        grounds:
          - state_machines.Dispute.OPEN_to_UPHELD
          - state_machines.Dispute.OPEN_to_REJECTED
          - entities.Dispute.fields.refund_cents
          - entities.Rider.fields.wallet_balance_cents
        distinguishing_aspect: |
          Dispute forks at OPEN into {UPHELD, REJECTED} on a different entity than Trip: UPHELD computes
          refund_cents and credits the rider wallet + Trip.refunded_cents; REJECTED leaves refund_cents 0
          and the wallet untouched. Divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Two completed trips for one funded rider, each disputed; resolve one UPHELD and one REJECTED."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "G1", grid_code: "F1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T03:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 10000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_u_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
            - call: "POST /trips/${trip_u_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_u_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_r_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
            - call: "POST /trips/${trip_r_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_r_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /disputes"
              payload: { trip_id: "${trip_u_id}", reason: "OVERCHARGED", requested_refund_cents: 500 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { disp_u_id: $.data.id }
            - call: "POST /disputes"
              payload: { trip_id: "${trip_r_id}", reason: "ROUTE_ERROR", requested_refund_cents: 500 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { disp_r_id: $.data.id }
          trigger:
            - call: "POST /disputes/${disp_u_id}/resolve"
              payload: { decision: "UPHELD" }
              as: Dispatcher
            - call: "POST /disputes/${disp_r_id}/resolve"
              payload: { decision: "REJECTED" }
              as: Dispatcher
          assert:
            - "Dispute.${disp_u_id}.status == UPHELD and Dispute.${disp_u_id}.refund_cents == 500"
            - "Dispute.${disp_r_id}.status == REJECTED and Dispute.${disp_r_id}.refund_cents == 0"
            - "Rider.${rider_id}.wallet_balance_cents == 6200   # 10000 - 2150 - 2150 charges + 500 upheld refund (reject adds 0)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: trip_complete_driver_relocate_supply_cascade_depth3
        grounds:
          - state_machines.Trip.ENROUTE_to_COMPLETED
          - state_machines.Driver.ON_TRIP_to_AVAILABLE
          - entities.Driver.fields.current_zone_id
          - entities.Zone.fields.available_supply_count
        distinguishing_aspect: |
          Depth-3 chain from trip complete: completing the Trip (A) flips the Driver ON_TRIP->AVAILABLE (B),
          which itself relocates the driver to the dropoff Zone and increments THAT Zone's
          available_supply_count (C). Each hop is caused by the prior, not by the original action.
        test_recipe:
          setup:
            - "Two zones (pickup Zp, dropoff Zd); one driver matched and ENROUTE on a trip from Zp to Zd."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Zp", grid_code: "P1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { zp_id: $.data.id, zp_v: $.data.version }
            - call: "POST /zones"
              payload: { name: "Zd", grid_code: "P2", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { zd_id: $.data.id }
            - call: "POST /zones/${zp_id}/surge-snapshots"
              payload: { observed_demand: 1, observed_supply: 4, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${zp_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${zp_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${zp_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${zp_id}", dropoff_zone_id: "${zd_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${zp_id}" }
              as: Dispatcher
            - call: "POST /trips/${trip_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "Trip.${trip_id}.status == COMPLETED"
            - "Driver.${drv_id}.status == AVAILABLE and Driver.${drv_id}.current_zone_id == ${zd_id}"
            - "Zone.${zd_id}.available_supply_count == 1"
            - "Zone.${zp_id}.available_supply_count == 0"

      - name: go_offline_queue_withdraw_resequence_depth2
        grounds:
          - state_machines.Driver.AVAILABLE_to_OFFLINE
          - state_machines.AirportQueueEntry.WAITING_to_WITHDRAWN
          - entities.AirportQueueEntry.fields.position
          - entities.AirportQueueEntry.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (go-offline, not trip complete): taking the driver
          OFFLINE (A) withdraws that driver's WAITING AirportQueueEntry to WITHDRAWN (B), which re-sequences
          the remaining WAITING entries' position values (C). The withdraw is caused by go-offline, the
          re-sequence by the withdraw.
        test_recipe:
          setup:
            - "Airport zone with two online drivers queued WAITING at positions 1 and 2."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "AirportZ", grid_code: "Z9", is_airport: true, base_fare_cents: 1500 }
              as: Dispatcher
              captures: { az_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${az_id}" }
              as: Dispatcher
              captures: { d1_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D2", home_zone_id: "${az_id}" }
              as: Dispatcher
              captures: { d2_id: $.data.id }
            - call: "POST /drivers/${d1_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${d1_id}"
            - call: "POST /drivers/${d2_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${d2_id}"
            - call: "POST /airport-queue"
              payload: { zone_id: "${az_id}", driver_id: "${d1_id}" }
              as: Driver
              as_user_id: "${d1_id}"
              captures: { q1_id: $.data.id }
            - call: "POST /airport-queue"
              payload: { zone_id: "${az_id}", driver_id: "${d2_id}" }
              as: Driver
              as_user_id: "${d2_id}"
              captures: { q2_id: $.data.id }
          trigger:
            - call: "POST /drivers/${d1_id}/go-offline"
              payload: {}
              as: Driver
              as_user_id: "${d1_id}"
          assert:
            - "AirportQueueEntry.${q1_id}.status == WITHDRAWN"
            - "AirportQueueEntry.${q2_id}.status == WAITING and AirportQueueEntry.${q2_id}.position == 1"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_insufficient_wallet_on_complete
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_WALLET]
        distinguishing_aspect: |
          state (priority 5) vs business_fiscal (priority 12): a MATCHED (not yet ENROUTE) trip whose
          rider also has an empty wallet, completed in one call, returns ERR_INVALID_STATE (409), not
          ERR_INSUFFICIENT_WALLET (402) — the state check wins.
        test_recipe:
          setup:
            - "A trip in MATCHED state (not started) whose rider has wallet_balance_cents 0."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "H1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 0 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_STATE"
            - "Trip.${trip_id}.status == MATCHED"

      - name: trip_not_completed_beats_invalid_refund_amount_on_dispute
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_TRIP_NOT_COMPLETED]
          - errors[ERR_INVALID_REFUND_AMOUNT]
        distinguishing_aspect: |
          business_referential (priority 10) vs business_constraint (priority 11): opening a dispute on a
          still-MATCHED (not COMPLETED) trip with requested_refund_cents 0 returns ERR_TRIP_NOT_COMPLETED
          (422), not ERR_INVALID_REFUND_AMOUNT — a different error-category pair than instance one.
        test_recipe:
          setup:
            - "A trip in MATCHED state (never completed)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "I1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /disputes"
              payload: { trip_id: "${trip_id}", reason: "OVERCHARGED", requested_refund_cents: 0 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_TRIP_NOT_COMPLETED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: surge_ratio_band_boundary_exactly_two
        grounds:
          - calculations.surge_multiplier
          - entities.SurgeSnapshot.fields.ratio
          - entities.SurgeSnapshot.fields.multiplier
        distinguishing_aspect: |
          Numeric threshold metric (ratio band): ratio exactly 2.00 (demand 4 / supply 2) lands in the
          [2.00, 3.00) band -> multiplier 2.00, whereas ratio 1.99 would band to 1.50; the >= boundary is
          inclusive at 2.00. Reached through POST /zones/{id}/surge-snapshots.
        test_recipe:
          setup:
            - "One non-airport zone base 1000 at version 1."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "BZ", grid_code: "J1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
          trigger:
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
              captures: { snap_ratio: $.data.ratio, snap_mult: $.data.multiplier }
          assert:
            - "SurgeSnapshot.${z_id}.ratio == 2.00"
            - "SurgeSnapshot.${z_id}.multiplier == 2.00"

      - name: wallet_exactly_equals_fare_completes
        grounds:
          - validations[priority=12]
          - calculations.trip_final_fare
          - entities.Rider.fields.wallet_balance_cents
          - state_machines.Trip.ENROUTE_to_COMPLETED
        distinguishing_aspect: |
          Empty-margin fiscal boundary on a different metric (wallet vs fare) and a different endpoint
          (POST /trips/{id}/complete): wallet exactly == final_fare_cents (2150 == 2150) passes the
          >= check and completes with wallet 0; wallet 2149 would fail ERR_INSUFFICIENT_WALLET.
        test_recipe:
          setup:
            - "Zone base 1000 current_multiplier 2.00; rider funded EXACTLY 2150; trip taken to ENROUTE."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "WZ", grid_code: "K1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 2150 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
            - call: "POST /trips/${trip_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "Trip.${trip_id}.status == COMPLETED and Trip.${trip_id}.final_fare_cents == 2150"
            - "Rider.${rider_id}.wallet_balance_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: trip_match_requires_driver_available
        grounds:
          - state_machines.Trip.REQUESTED_to_MATCHED
          - entities.Driver.fields.status
          - entities.Trip.fields.status
        distinguishing_aspect: |
          Trip->Driver pair: a REQUESTED trip only transitions to MATCHED when a candidate Driver is
          AVAILABLE in the pickup zone; with the only driver OFFLINE the dispatch tick leaves the trip
          REQUESTED (matched_count 0).
        test_recipe:
          setup:
            - "Zone with one REQUESTED trip and one driver who is OFFLINE (never went online)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DZ", grid_code: "L1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 0 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
              captures: { matched_count: $.data.matched_count }
          assert:
            - "data.matched_count == 0"
            - "Trip.${trip_id}.status == REQUESTED and Trip.${trip_id}.driver_id == null"

      - name: dispute_uphold_requires_trip_completed
        grounds:
          - state_machines.Dispute.OPEN_to_UPHELD
          - validations[priority=10]
          - entities.Trip.fields.status
        distinguishing_aspect: |
          Dispute->Trip pair (different entity pair than Trip->Driver): a Dispute can only be opened, and
          hence upheld, when the referenced Trip.status == COMPLETED; attempting to dispute a MATCHED trip
          is rejected with ERR_TRIP_NOT_COMPLETED before any Dispute exists.
        test_recipe:
          setup:
            - "A trip currently MATCHED (not completed) for a funded rider."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DZ2", grid_code: "M1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /disputes"
              payload: { trip_id: "${trip_id}", reason: "OVERCHARGED", requested_refund_cents: 500 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_TRIP_NOT_COMPLETED"
            - "Trip.${trip_id}.status == MATCHED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: surge_snapshot_window_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=65]
          - errors[ERR_SNAPSHOT_WINDOW_OVERLAP]
          - entities.SurgeSnapshot.fields.effective_from
          - entities.SurgeSnapshot.fields.effective_to
        distinguishing_aspect: |
          Half-open interval semantics on the Zone/SurgeSnapshot resource: a snapshot [01:00, 02:00)
          overlapping an existing [00:00, 01:30) for the same zone is rejected, but an adjacent
          [01:30, 02:30) touching at the boundary is ACCEPTED (adjacency allowed). Differs from the
          Quest rule's closed-interval, adjacency-forbidden arithmetic.
        test_recipe:
          setup:
            - "Zone with one published snapshot covering [00:00, 01:30)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "TZ", grid_code: "N1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v1: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 1, observed_supply: 4, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:30:00Z", expected_zone_version: "${z_v1}" }
              as: Dispatcher
            - call: "GET /zones/${z_id}"
              payload: {}
              as: Dispatcher
              captures: { z_v2: $.data.version }
          trigger:
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 1, observed_supply: 4, is_rush_hour: false, effective_from: "2026-06-01T01:00:00Z", effective_to: "2026-06-01T02:00:00Z", expected_zone_version: "${z_v2}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_SNAPSHOT_WINDOW_OVERLAP"

      - name: quest_window_overlap_closed_adjacency_forbidden
        grounds:
          - validations[priority=66]
          - errors[ERR_QUEST_WINDOW_OVERLAP]
          - entities.Quest.fields.window_start
          - entities.Quest.fields.window_end
        distinguishing_aspect: |
          Closed-interval, adjacency-forbidden semantics on the Driver/Quest resource: a second Quest for
          the same driver whose window_start (12:00) exactly equals the first Quest's window_end (12:00)
          is REJECTED — boundary contact conflicts — the opposite of the snapshot rule's accepted adjacency.
        test_recipe:
          setup:
            - "Driver with one ACTIVE Quest over [10:00, 12:00]."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "QZ", grid_code: "O1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /quests"
              payload: { driver_id: "${drv_id}", target_trips: 3, bonus_cents: 5000, window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: Dispatcher
              captures: { q1_id: $.data.id }
          trigger:
            - call: "POST /quests"
              payload: { driver_id: "${drv_id}", target_trips: 2, bonus_cents: 3000, window_start: "2026-06-01T12:00:00Z", window_end: "2026-06-01T14:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_QUEST_WINDOW_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: match_then_cancel_conserves_total_available_supply
        grounds:
          - state_machines.Trip.REQUESTED_to_MATCHED
          - state_machines.Trip.MATCHED_to_CANCELLED
          - state_machines.Driver.AVAILABLE_to_ON_TRIP
          - state_machines.Driver.ON_TRIP_to_AVAILABLE
          - entities.Zone.fields.available_supply_count
        distinguishing_aspect: |
          Conserved quantity = total available supply (a COUNT): matching a trip decrements the pickup
          Zone.available_supply_count by 1 (driver AVAILABLE->ON_TRIP); cancelling the matched trip
          restores it (driver ON_TRIP->AVAILABLE), leaving sum of available_supply_count over all zones
          equal to its pre-match value of 1.
        test_recipe:
          setup:
            - "Zone with one online (AVAILABLE) driver so available_supply_count == 1, and one REQUESTED trip."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "SZ", grid_code: "Q1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /trips/${trip_id}/cancel"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
          assert:
            - "Trip.${trip_id}.status == CANCELLED"
            - "Driver.${drv_id}.status == AVAILABLE"
            - "Zone.${z_id}.available_supply_count == 1"

      - name: complete_then_full_refund_conserves_rider_net_cash
        grounds:
          - state_machines.Trip.ENROUTE_to_COMPLETED
          - state_machines.Dispute.OPEN_to_UPHELD
          - calculations.dispute_refund
          - entities.Rider.fields.wallet_balance_cents
          - entities.Trip.fields.refunded_cents
        distinguishing_aspect: |
          Conserved quantity = rider net cash (MONEY, a different conserved quantity than the supply count):
          completing a trip debits the wallet by final_fare_cents (2150); a full upheld refund (requested
          2150) credits the wallet by exactly 2150 and sets Trip.refunded_cents == final_fare_cents, so
          wallet returns to its pre-trip 5000 and net paid (final_fare - refunded) == 0.
        test_recipe:
          setup:
            - "Zone base 1000 current_multiplier 2.00; rider funded 5000; one completed trip final_fare 2150."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "MZ", grid_code: "R1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T02:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
            - call: "POST /trips/${trip_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /disputes"
              payload: { trip_id: "${trip_id}", reason: "OVERCHARGED", requested_refund_cents: 2150 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /disputes/${disp_id}/resolve"
              payload: { decision: "UPHELD" }
              as: Dispatcher
          assert:
            - "Dispute.${disp_id}.refund_cents == 2150"
            - "Trip.${trip_id}.refunded_cents == 2150"
            - "Rider.${rider_id}.wallet_balance_cents == 5000"
