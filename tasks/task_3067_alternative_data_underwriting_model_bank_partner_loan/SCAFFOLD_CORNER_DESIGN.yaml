              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/applicants"
              payload: { full_name: "Channel Chen", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
            - call: "POST /platform/partners"
              payload: { legal_name: "Ref Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "PARTNER_REFERRAL", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { err1: $.data.error_id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", referral_partner_id: "${p_id}", requested_amount_cents: 5000000 }
              as: PlatformAdmin
