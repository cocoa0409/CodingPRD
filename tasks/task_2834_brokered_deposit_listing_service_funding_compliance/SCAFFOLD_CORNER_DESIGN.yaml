        distinguishing_aspect: "The coherence check must run before the 25% ratio is computed: total_customer_assets_cents == 0 would make the ratio a division by zero, and deposits exceeding total assets would make it exceed 10000 bps, so both must surface as ERR_EXCEPTION_INPUTS_INCOHERENT rather than as a computed qualification result."
