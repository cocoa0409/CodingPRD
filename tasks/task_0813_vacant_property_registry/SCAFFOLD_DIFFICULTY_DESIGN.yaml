scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fine_provisional_vs_finalized_accrual
        grounds:
          - calculations.fine_accrual
          - entities.Fine.fields.accrued_amount_cents
          - entities.Fine.fields.finalized_amount_cents
          - state_machines.Fine.ASSESSED_to_PAID
        distinguishing_aspect: |
          On the Fine domain, the provisional variant tracks the live clock (Fine B read at day 60
          == 60000, capped) while the finalized variant freezes accrual at the settlement instant
          (Fine A paid at day 40 == 45000); identical base_amount_cents 20000 and assessed_at,
          divergent results.
        test_recipe:
          setup:
            - "Standard SEC-01 and SEC-02 both base_fine_cents 20000, cure_period_days 10."
            - "OWNER registrant + VACANT property; one inspection fails both codes -> two OPEN violations."
            - "Clock 2026-03-11: both violations escalated then fined; two ASSESSED fines assessed_at 2026-03-11, base 20000."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "SEC-01", category: "SECURING", description: "Secure openings", severity_weight: 8, cure_period_days: 10, base_fine_cents: 20000 }
              as: ProgramAdmin
            - call: "POST /registry/maintenance-standards"
              payload: { code: "SEC-02", category: "SECURING", description: "Secure garage", severity_weight: 8, cure_period_days: 10, base_fine_cents: 20000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner A", party_type: "OWNER", email: "a@x.com", contact_phone: "555-0100", mailing_address: "1 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-DV1", street_address: "5 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B1", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["SEC-01", "SEC-02"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_a: "$.data[0].id", viol_b: "$.data[1].id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_a}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${viol_b}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${viol_a}/fines"
              payload: {}
              as: CodeOfficer
              captures: { fine_a: "$.data.id" }
            - call: "POST /registry/violations/${viol_b}/fines"
              payload: {}
              as: CodeOfficer
              captures: { fine_b: "$.data.id" }
          trigger:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/fines/${fine_a}/transition"
              payload: { action: "PAY" }
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /registry/fines/${fine_a}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /registry/fines/${fine_b}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Fine.${fine_a}.status == PAID"
            - "Fine.${fine_a}.finalized_amount_cents == 45000"
            - "Fine.${fine_a}.accrued_amount_cents == 45000"
            - "Fine.${fine_b}.status == ASSESSED"
            - "Fine.${fine_b}.accrued_amount_cents == 60000"

      - name: lien_accrued_vs_quoted_payoff
        grounds:
          - calculations.lien_payoff
          - entities.Lien.fields.payoff_amount_cents
          - entities.Lien.fields.payoff_quoted_cents
          - state_machines.Fine.ASSESSED_to_LIENED
        distinguishing_aspect: |
          On the Lien domain, the accrued variant rounds each day's interest before summing
          (payoff_amount_cents == 30800 at 100 days) while the quoted variant rounds once after
          summing (payoff_quoted_cents == 30822); same principal 30000 and rate, divergent results.
        test_recipe:
          setup:
            - "Standard STR-01 base_fine_cents 30000, cure_period_days 5, severity 9."
            - "OWNER/VACANT property; inspection fails STR-01 -> violation; escalate at 2026-03-06; assess fine base 30000."
            - "Record lien immediately (0 days overdue) -> Lien principal 30000, recorded_at 2026-03-06."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "STR-01", category: "STRUCTURAL", description: "Structural hazard", severity_weight: 9, cure_period_days: 5, base_fine_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner B", party_type: "OWNER", email: "b@x.com", contact_phone: "555-0101", mailing_address: "2 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-DV2", street_address: "6 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B2", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["STR-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${viol_id}/fines"
              payload: {}
              as: CodeOfficer
              captures: { fine_id: "$.data.id" }
            - call: "POST /registry/fines/${fine_id}/record-lien"
              payload: {}
              as: ProgramAdmin
            - call: "GET /registry/liens?source_fine_id=${fine_id}"
              payload: {}
              as: ProgramAdmin
              captures: { lien_id: "$.data[0].id" }
          trigger:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /registry/liens/${lien_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Lien.${lien_id}.principal_cents == 30000"
            - "Lien.${lien_id}.payoff_amount_cents == 30800"
            - "Lien.${lien_id}.payoff_quoted_cents == 30822"

  # =====================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: demolition_priority_weighted_nonlinear
        grounds:
          - calculations.demolition_priority_score
          - entities.DemolitionListing.fields.priority_score
          - entities.Property.fields.foreclosure_status
          - entities.Property.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — four capped components (severity min-40,
          vacancy min-20, balance min-25) plus a conditional branch keyed on foreclosure_status —
          combine to priority_score == 44 (24 + 6 + 7 + 7).
        test_recipe:
          setup:
            - "Five identical standards DEMO-1..DEMO-5 (severity 8, base 30000, cure 5)."
            - "OWNER/VACANT property registered at default clock 2026-03-01 (registration fee 10000)."
            - "One inspection fails all five codes -> five OPEN violations (cited 2026-03-01)."
            - "Clock 2026-03-06: two violations escalated+fined (2x FINE_ASSESSED +30000 -> balance 70000); three remain OPEN (severity 24)."
            - "Foreclosure advanced NONE->NOTICE_OF_DEFAULT->LIS_PENDENS. Clock set to 2026-06-09 (100 days vacant -> 3 months)."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "DEMO-1", category: "SANITATION", description: "d1", severity_weight: 8, cure_period_days: 5, base_fine_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /registry/maintenance-standards"
              payload: { code: "DEMO-2", category: "SANITATION", description: "d2", severity_weight: 8, cure_period_days: 5, base_fine_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /registry/maintenance-standards"
              payload: { code: "DEMO-3", category: "SANITATION", description: "d3", severity_weight: 8, cure_period_days: 5, base_fine_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /registry/maintenance-standards"
              payload: { code: "DEMO-4", category: "SANITATION", description: "d4", severity_weight: 8, cure_period_days: 5, base_fine_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /registry/maintenance-standards"
              payload: { code: "DEMO-5", category: "SANITATION", description: "d5", severity_weight: 8, cure_period_days: 5, base_fine_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner C", party_type: "OWNER", email: "c@x.com", contact_phone: "555-0102", mailing_address: "3 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-DEMO", street_address: "7 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B3", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["DEMO-1", "DEMO-2", "DEMO-3", "DEMO-4", "DEMO-5"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { v0: "$.data[0].id", v1: "$.data[1].id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${v0}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${v1}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${v0}/fines"
              payload: {}
              as: CodeOfficer
            - call: "POST /registry/violations/${v1}/fines"
              payload: {}
              as: CodeOfficer
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /registry/demolition-listings"
              payload: { property_id: "${prop_id}" }
              as: ProgramAdmin
              captures: { demo_id: "$.data.id" }
          assert:
            - "Property.${prop_id}.open_violation_count == 3"
            - "Property.${prop_id}.outstanding_balance_cents == 70000"
            - "Property.${prop_id}.foreclosure_status == LIS_PENDENS"
            - "DemolitionListing.${demo_id}.priority_score == 44"

      - name: lien_payoff_round_per_day_order
        grounds:
          - calculations.lien_payoff
          - entities.Lien.fields.payoff_amount_cents
          - entities.Lien.fields.payoff_quoted_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — rounding each day's interest to whole
          cents THEN summing (payoff_amount_cents == 30800) versus summing full-period interest
          THEN rounding once (payoff_quoted_cents == 30822); the scaffold pins round-per-day-then-sum.
        test_recipe:
          setup:
            - "Standard LIEN-01 base 30000, cure 5. OWNER/VACANT property; violation escalated 2026-03-06 and fined base 30000."
            - "Fine converted to a Lien immediately (principal 30000, interest 1000 bps, recorded_at 2026-03-06)."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "LIEN-01", category: "STRUCTURAL", description: "hazard", severity_weight: 7, cure_period_days: 5, base_fine_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner D", party_type: "OWNER", email: "d@x.com", contact_phone: "555-0103", mailing_address: "4 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-CMB", street_address: "8 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B4", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["LIEN-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${viol_id}/fines"
              payload: {}
              as: CodeOfficer
              captures: { fine_id: "$.data.id" }
            - call: "POST /registry/fines/${fine_id}/record-lien"
              payload: {}
              as: ProgramAdmin
            - call: "GET /registry/liens?source_fine_id=${fine_id}"
              payload: {}
              as: ProgramAdmin
              captures: { lien_id: "$.data[0].id" }
          trigger:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /registry/liens/${lien_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Lien.${lien_id}.payoff_amount_cents == 30800"
            - "Lien.${lien_id}.payoff_quoted_cents == 30822"

  # =====================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: property_parallel_registration_and_foreclosure_axes
        grounds:
          - state_machines.Property.ACTIVE_to_SUSPENDED
          - state_machines.Property.NONE_to_NOTICE_OF_DEFAULT
          - entities.Property.fields.registration_status
          - entities.Property.fields.foreclosure_status
        distinguishing_aspect: |
          The same Property row carries two independent state axes: registration_status reaches
          SUSPENDED (via balance) while foreclosure_status independently holds LIS_PENDENS —
          parallel dimensions that evolve without gating each other.
        test_recipe:
          setup:
            - "Standard PAR-01 base 95000, cure 5. OWNER/VACANT property (registration fee 10000, ACTIVE, foreclosure NONE)."
            - "Foreclosure advanced twice to LIS_PENDENS while registration stays ACTIVE."
            - "Clock 2026-03-06: violation escalated then fined -> FINE_ASSESSED +95000 -> balance 105000 -> auto-suspend."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "PAR-01", category: "STRUCTURAL", description: "hazard", severity_weight: 6, cure_period_days: 5, base_fine_cents: 95000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner E", party_type: "OWNER", email: "e@x.com", contact_phone: "555-0104", mailing_address: "5 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-PAR", street_address: "9 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B6", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["PAR-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${viol_id}/fines"
              payload: {}
              as: CodeOfficer
          trigger:
            - call: "GET /registry/properties/${prop_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Property.${prop_id}.registration_status == SUSPENDED"
            - "Property.${prop_id}.foreclosure_status == LIS_PENDENS"
            - "Property.${prop_id}.outstanding_balance_cents == 105000"

      - name: violation_cured_reopen_cycle
        grounds:
          - state_machines.Violation.OPEN_to_CURED
          - state_machines.Violation.CURED_to_OPEN
          - entities.Violation.fields.cured_at
        distinguishing_aspect: |
          The Violation machine is cyclic: a CURED violation of a standard is re-cited by a later
          failing inspection of the same code and returns to OPEN (cured_at cleared) — a linear
          pipeline could never re-enter OPEN.
        test_recipe:
          setup:
            - "Standard CYC-01 cure 10. OWNER/VACANT property. First inspection fails CYC-01 -> violation OPEN, cured via CURE."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "CYC-01", category: "LANDSCAPING", description: "overgrowth", severity_weight: 5, cure_period_days: 10, base_fine_cents: 10000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner F", party_type: "OWNER", email: "f@x.com", contact_phone: "555-0105", mailing_address: "6 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-CYC", street_address: "10 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B7", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp1_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp1_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["CYC-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp1_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "CURE" }
              as: CodeOfficer
          trigger:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B7", scheduled_start: "2026-03-15T09:00:00Z", scheduled_end: "2026-03-15T11:00:00Z" }
              as: CodeOfficer
              captures: { insp2_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp2_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["CYC-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations/${viol_id}"
              payload: {}
              as: CodeOfficer
          assert:
            - "Violation.${viol_id}.status == OPEN"
            - "Violation.${viol_id}.cured_at == null"

  # =====================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: assess_fine_ledger_balance_suspends_registration
        grounds:
          - state_machines.Violation.ESCALATED_to_FINED
          - state_machines.Property.ACTIVE_to_SUSPENDED
          - calculations.property_outstanding_balance
          - entities.Property.fields.registration_status
        distinguishing_aspect: |
          Depth-3 chain from the fine-assessment trigger: assess (Fine created) -> FINE_ASSESSED
          ledger insert -> outstanding_balance recompute to 105000 -> registration_status
          ACTIVE->SUSPENDED; each hop is caused by the prior hop, not by the original call.
        test_recipe:
          setup:
            - "Standard CAS-01 base 95000, cure 5. OWNER/VACANT property (fee 10000, ACTIVE). Violation escalated at 2026-03-06."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "CAS-01", category: "SANITATION", description: "debris", severity_weight: 6, cure_period_days: 5, base_fine_cents: 95000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
