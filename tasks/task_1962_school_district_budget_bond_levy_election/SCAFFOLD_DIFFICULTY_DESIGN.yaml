            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 20000000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 8500000, debt_service_levy: 1200000, other_revenue: 500000, cpi_rate: 0.034 }
              as: BusinessManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
