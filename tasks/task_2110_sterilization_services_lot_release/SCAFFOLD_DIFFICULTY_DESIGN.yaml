          assert:
            - "${start_err} == ERR_CHAMBER_UNAVAILABLE with HTTP 409"
            - "Cycle.${cyc_id}.status == READY (unchanged)"
            - "Lot.${lot1_id}.status == STAGED (never advanced to IN_PROCESS)"
            - "Chamber.${chg1_id}.status == MAINTENANCE"

      - name: load_position_depends_on_qualification_audit_window
        grounds:
          - state_machines.ProductQualification.QUALIFIED_to_AUDIT_DUE
          - validations[priority=60]
          - calculations.vdmax_audit_verdict
          - errors[ERR_QUALIFICATION_NOT_CURRENT]
        distinguishing_aspect: |
          Entity pair Lot/LoadPosition -> ProductQualification, structurally
          different from the Cycle -> Chamber pair: the load position is refused
          because a third entity, the qualification binding the lot's PRODUCT to
          the cycle's RECIPE, crossed its next_audit_due_at of 2026-11-03 and was
          lazily flipped QUALIFIED -> AUDIT_DUE by this very request.
        test_recipe:
          setup:
            - "A PASS VDmax audit performed on 2026-08-05T00:00:00Z left the qualification QUALIFIED with next_audit_due_at 2026-11-03T00:00:00Z."
            - "The logical clock has been advanced to exactly 2026-11-03T00:00:00Z, the inclusive due instant."
            - "A PLANNED GAMMA cycle and a RECEIVED, schedulable lot of the same product both exist."
