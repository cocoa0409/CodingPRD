scenario: |
  E-commerce live streaming schedule system: streamer management with streamer profile,
  qualification verification (real-name/health/professional), tier classification,
  content-category tagging, performance history, and blacklist handling; live studio
  resource pool with studio profile (location/equipment/capacity), studio-type
  classification (self-operated/partner), available time-slot configuration,
  equipment-maintenance window, and studio-status management; schedule application
  and approval with streamer-submitted application, time and studio selection,
  content-category and product-category declaration, multi-level review
  (operations/compliance), conflict-detection with existing schedules, and
  approval-record archiving; product association with on-shelf product list,
  product-streamer matching review, product-eligibility verification
  (qualification/category restrictions), product-stock pre-reservation, and
  during-broadcast product addition rules; slot fee calculation with
  slot-tier-based pricing, peak-period surcharge, package and combo pricing,
  slot-fee deposit, refund rules, and invoice issuance; commission settlement
  with sales-based commission rate, return-induced commission reversal,
  tier-based bonus, withholding for return-period, tax handling, and periodic
  payout; violation penalty with violation type classification (false
  advertising/wrong product/violating-content/data-fraud), evidence collection,
  multi-level penalty (warning/fine/suspension/blacklist), appeal workflow, and
  penalty-record archiving; event-driven synchronization with payment, IM,
  e-commerce, and content-moderation systems; audit logging for schedule changes
  and penalty records.

domain_name: live-stream-schedule
api_prefix: /live-schedule

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - version_pinning_on_approval
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Streamer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Real-name verification subject
      - name: id_card_number
        type: string
        source: input
        description: Government ID number for real-name check
        constraints: "Unique across active streamers"
      - name: real_name_verified
        type: boolean
        source: input
        description: Whether real-name verification passed
        default: false
      - name: health_cert_expires_at
        type: datetime
        source: input
        description: Health certificate expiry timestamp (ISO 8601 UTC)
      - name: professional_cert_categories
        type: array
        source: input
        description: List of category codes the streamer is professionally certified for (e.g., FOOD, COSMETICS, FINANCIAL)
      - name: tier
        type: enum
        source: computed
        description: Tier classification recomputed by performance_metric calculation
        constraints: "BRONZE | SILVER | GOLD | PLATINUM"
        default: BRONZE
      - name: content_category_tags
        type: array
        source: input
        description: Declared content categories (FOOD, FASHION, BEAUTY, ELECTRONICS, KIDS, etc.)
      - name: lifetime_gmv_cents
        type: integer
        source: computed
        description: Aggregate gross merchandise value across all settled applications, in cents
        default: 0
      - name: completed_broadcast_count
        type: integer
        source: computed
        description: Number of applications that reached COMPLETED state
        default: 0
      - name: violation_score
        type: integer
        source: computed
        description: Cumulative violation severity score (see commission and penalty calcs)
        default: 0
      - name: status
        type: enum
        source: computed
        description: Lifecycle of a streamer account
        constraints: "ACTIVE | SUSPENDED | BLACKLISTED"
        default: ACTIVE
      - name: suspension_until
        type: datetime
        source: computed
        description: When SUSPENDED state auto-clears; null while ACTIVE/BLACKLISTED
        default: null

  - name: Studio
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the studio
      - name: location
        type: string
        source: input
        description: Physical address / region code
      - name: equipment_inventory
        type: array
        source: input
        description: Equipment SKUs available (camera, lighting, audio, teleprompter)
      - name: capacity
        type: integer
        source: input
        description: Concurrent personnel capacity
        constraints: ">=1"
      - name: studio_type
        type: enum
        source: input
        description: Ownership model
        constraints: "SELF_OPERATED | PARTNER"
      - name: status
        type: enum
        source: computed
        description: Operational state
        constraints: "OPEN | RESTRICTED | UNDER_MAINTENANCE | CLOSED"
        default: OPEN
      - name: slot_tier
        type: enum
        source: input
        description: Pricing tier for this studio
        constraints: "S | A | B | C"
      - name: base_hour_price_cents
        type: integer
        source: input
        description: Base price per hour in cents, derived from slot_tier on create
        constraints: ">=0"

  - name: TimeSlotConfig
    parent: Studio
    common_fields: false
    fields:
      - name: studio_id
        type: string
        source: input
        description: Owning studio FK
      - name: kind
        type: enum
        source: input
        description: Window kind
        constraints: "AVAILABLE | MAINTENANCE"
      - name: starts_at
        type: datetime
        source: input
        description: Inclusive start (ISO 8601 UTC)
      - name: ends_at
        type: datetime
        source: input
        description: Exclusive end (ISO 8601 UTC)
      - name: weekday_mask
        type: integer
        source: input
        description: 7-bit recurrence mask Mon..Sun; 0 means single window (non-recurring)
        default: 0

  - name: ScheduleApplication
    parent: null
    common_fields: true
    fields:
      - name: streamer_id
        type: string
        source: input
        description: FK to Streamer
      - name: studio_id
        type: string
        source: input
        description: FK to Studio
      - name: starts_at
        type: datetime
        source: input
        description: Requested broadcast start (inclusive)
      - name: ends_at
        type: datetime
        source: input
        description: Requested broadcast end (exclusive)
      - name: declared_content_categories
        type: array
        source: input
        description: Content categories for this broadcast
      - name: declared_product_categories
        type: array
        source: input
        description: Product categories planned for this broadcast
      - name: package_code
        type: enum
        source: input
        description: Pricing package selected by streamer
        constraints: "STANDARD | COMBO_HALF_DAY | COMBO_FULL_DAY | PEAK_BUNDLE"
        default: STANDARD
      - name: review_status
        type: enum
        source: computed
        description: Workflow review status (parallel to operational status)
        constraints: "DRAFT | OPS_PENDING | COMPLIANCE_PENDING | APPROVED | REJECTED | WITHDRAWN"
        default: DRAFT
      - name: operational_status
        type: enum
        source: computed
        description: Operational lifecycle of the approved broadcast
        constraints: "NOT_SCHEDULED | SCHEDULED | LIVE | COMPLETED | CANCELLED"
        default: NOT_SCHEDULED
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: Provisional fee at submission (uses streamer's tier at submit-time)
      - name: final_fee_cents
        type: integer
        source: computed
        description: Final fee pinned at compliance approval (uses tier at approve-time)
      - name: deposit_cents
        type: integer
        source: computed
        description: Deposit required = 30% of final_fee_cents, pinned at approval
      - name: deposit_paid
        type: boolean
        source: computed
        description: True once an external payment event marks deposit settled
        default: false
      - name: pinned_streamer_tier
        type: enum
        source: computed
        description: Snapshot of Streamer.tier at compliance approval time
        constraints: "BRONZE | SILVER | GOLD | PLATINUM"
      - name: gmv_cents
        type: integer
        source: computed
        description: Realized GMV after broadcast completion, sourced from external e-commerce sync events
        default: 0
      - name: gross_commission_cents
        type: integer
        source: computed
        description: Commission computed before returns/withholding
        default: 0
      - name: net_payout_cents
        type: integer
        source: computed
        description: Final payout after returns, withholding, and tax
        default: 0

  - name: ApprovalRecord
    parent: ScheduleApplication
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to ScheduleApplication
      - name: level
        type: enum
        source: input
        description: Review level
        constraints: "OPS | COMPLIANCE"
      - name: decision
        type: enum
        source: input
        description: Decision outcome
        constraints: "APPROVE | REJECT"
      - name: reviewer_role
        type: enum
        source: system
        description: Role of acting reviewer
        constraints: "OperationsReviewer | ComplianceReviewer"
      - name: reviewer_id
        type: string
        source: system
        description: Opaque operator id (from X-User-ID)
      - name: reason
        type: string
        source: input
        description: Free-text rationale (required on REJECT)
      - name: snapshot_streamer_tier
        type: enum
        source: system
        description: Pinned Streamer.tier at time of decision
        constraints: "BRONZE | SILVER | GOLD | PLATINUM"
      - name: snapshot_provisional_fee_cents
        type: integer
        source: system
        description: Pinned provisional fee at time of decision

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Product display name
      - name: category
        type: enum
        source: input
        description: Product category code
        constraints: "FOOD | COSMETICS | ELECTRONICS | FASHION | KIDS | FINANCIAL"
      - name: requires_professional_cert
        type: boolean
        source: input
        description: If true, only streamers with this category in professional_cert_categories may sell
        default: false
      - name: unit_price_cents
        type: integer
        source: input
        description: Listed unit price in cents
        constraints: ">=0"
      - name: available_stock
        type: integer
        source: computed
        description: Free stock not yet pre-reserved
        constraints: ">=0"
      - name: reserved_stock
        type: integer
        source: computed
        description: Stock pre-reserved by approved applications
        default: 0
      - name: status
        type: enum
        source: computed
        description: Listing state
        constraints: "ON_SHELF | OFF_SHELF"
        default: ON_SHELF

  - name: ProductAssociation
    parent: ScheduleApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to ScheduleApplication
      - name: product_id
        type: string
        source: input
        description: FK to Product
      - name: reserved_quantity
        type: integer
        source: input
        description: Stock pre-reserved for the broadcast
        constraints: ">=1"
      - name: association_phase
        type: enum
        source: system
        description: Was association made before approval or during broadcast?
        constraints: "PRE_APPROVAL | DURING_BROADCAST"
      - name: status
        type: enum
        source: computed
        description: Association lifecycle
        constraints: "PENDING_MATCH | APPROVED | REJECTED | RELEASED"
        default: PENDING_MATCH
      - name: reject_reason
        type: string
        source: computed
        description: Pinned reject reason (e.g., CATEGORY_MISMATCH, MISSING_CERT, NOT_ON_SHELF)

  - name: SlotFeeInvoice
    parent: ScheduleApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to ScheduleApplication
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of per-line slot fee components before discount
      - name: peak_surcharge_cents
        type: integer
        source: computed
        description: Peak-period surcharge component
      - name: package_discount_cents
        type: integer
        source: computed
        description: Discount derived from package_code
      - name: total_cents
        type: integer
        source: computed
        description: Final invoice total (must equal final_fee_cents on the application)
      - name: deposit_due_cents
        type: integer
        source: computed
        description: 30% of total_cents, rounded once at the end
      - name: status
        type: enum
        source: computed
        description: Invoice lifecycle
        constraints: "ISSUED | DEPOSIT_PAID | SETTLED | REFUNDED_FULL | REFUNDED_PARTIAL | VOIDED"
        default: ISSUED
      - name: refund_cents
        type: integer
        source: computed
        description: Cumulative refund amount issued under refund rules
        default: 0

  - name: CommissionSettlement
    parent: ScheduleApplication
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to ScheduleApplication
      - name: gross_sales_cents
        type: integer
        source: computed
        description: Gross sales reported by e-commerce sync events
      - name: returned_sales_cents
        type: integer
        source: computed
        description: Returns reported during the return window
        default: 0
      - name: commission_rate_bp
        type: integer
        source: computed
        description: Commission rate in basis points pinned at COMPLETED transition
      - name: tier_bonus_cents
        type: integer
        source: computed
        description: Tier-based bonus added to commission
        default: 0
      - name: tax_withholding_cents
        type: integer
        source: computed
        description: Tax withheld at payout
      - name: return_window_ends_at
        type: datetime
        source: computed
        description: Settlement waits until this timestamp before payout
      - name: status
        type: enum
        source: computed
        description: Settlement lifecycle
        constraints: "PENDING | WINDOW_OPEN | READY_FOR_PAYOUT | PAID | REVERSED"
        default: PENDING
      - name: provisional_payout_cents
        type: integer
        source: computed
        description: Estimate computed at COMPLETED, before returns are applied
      - name: final_payout_cents
        type: integer
        source: computed
        description: Final payout after returns, tier bonus, and tax

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: streamer_id
        type: string
        source: input
        description: FK to subject Streamer
      - name: application_id
        type: string
        source: input
        description: FK to ScheduleApplication associated with violation (nullable)
        default: null
      - name: violation_type
        type: enum
        source: input
        description: Classification
        constraints: "FALSE_ADVERTISING | WRONG_PRODUCT | VIOLATING_CONTENT | DATA_FRAUD"
      - name: evidence_refs
        type: array
        source: input
        description: Opaque references to evidence artifacts (URIs, content-moderation event ids)
      - name: severity
        type: integer
        source: computed
        description: Severity score 1..4 derived from type and evidence count
      - name: penalty_action
        type: enum
        source: computed
        description: Multi-level penalty action
        constraints: "WARNING | FINE | SUSPENSION | BLACKLIST"
      - name: fine_cents
        type: integer
        source: computed
        description: Fine amount if penalty_action == FINE (else 0)
        default: 0
      - name: suspension_days
        type: integer
        source: computed
        description: Days of suspension if penalty_action == SUSPENSION
        default: 0
      - name: status
        type: enum
        source: computed
        description: Violation lifecycle
        constraints: "OPEN | APPEAL_PENDING | UPHELD | OVERTURNED | ENFORCED"
        default: OPEN
      - name: enforced_at
        type: datetime
        source: computed
        description: When penalty was applied to the Streamer

  - name: Appeal
    parent: Violation
    common_fields: true
    fields:
      - name: violation_id
        type: string
        source: input
        description: FK to Violation
      - name: streamer_id
        type: string
        source: system
        description: Mirrored from Violation for ownership checks
      - name: argument
        type: string
        source: input
        description: Streamer's appeal argument
      - name: decision
        type: enum
        source: computed
        description: Outcome
        constraints: "PENDING | UPHELD | OVERTURNED"
        default: PENDING
      - name: decided_at
        type: datetime
        source: computed
        description: When the appeal was decided

  - name: ExternalEvent
    parent: null
    common_fields: false
    fields:
      - name: source
        type: enum
        source: input
        description: External system that emitted the event
        constraints: "PAYMENT | IM | ECOMMERCE | CONTENT_MOD"
      - name: kind
        type: enum
        source: input
        description: Event kind
        constraints: "DEPOSIT_PAID | DEPOSIT_REFUNDED | BROADCAST_GMV | RETURN_REPORTED | CONTENT_FLAGGED | IM_CHANNEL_OPENED"
      - name: application_id
        type: string
        source: input
        description: Target application id (nullable for CONTENT_FLAGGED on streamer)
        default: null
      - name: streamer_id
        type: string
        source: input
        description: Target streamer id (nullable)
        default: null
      - name: amount_cents
        type: integer
        source: input
        description: Monetary amount for monetary events (cents)
        default: 0
      - name: occurred_at
        type: datetime
        source: input
        description: Event timestamp

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: subject_kind
        type: enum
        source: system
        description: Kind of subject
        constraints: "SCHEDULE_APPLICATION | VIOLATION | STREAMER | INVOICE"
      - name: subject_id
        type: string
        source: system
        description: Subject entity id
      - name: action
        type: string
        source: system
        description: Action label (SUBMIT, OPS_APPROVE, COMPLIANCE_APPROVE, REJECT, CANCEL, PENALTY_ENFORCED, APPEAL_DECIDED, REFUND_ISSUED)
      - name: actor_role
        type: string
        source: system
        description: Role of actor
      - name: actor_id
        type: string
        source: system
        description: Operator/streamer id
      - name: from_state
        type: string
        source: system
        description: Pre-state (nullable)
      - name: to_state
        type: string
        source: system
        description: Post-state (nullable)
      - name: payload_snapshot
        type: object
        source: system
        description: Snapshot of key fields after the action

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ScheduleApplication.review_status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: OPS_PENDING
        trigger: "POST /applications/{id}/submit"
        actor: Streamer
        preconditions:
          - "Acting Streamer is owner"
          - "Streamer.status == ACTIVE"
          - "Streamer.real_name_verified == true"
          - "Streamer.health_cert_expires_at > application.ends_at"
          - "Studio.status == OPEN"
          - "Requested interval is fully covered by AVAILABLE TimeSlotConfig and does not intersect any MAINTENANCE window (half-open intervals [starts_at, ends_at))"
          - "No overlap with any existing application of the same Studio whose review_status is APPROVED or operational_status in {SCHEDULED, LIVE} using half-open interval overlap"
        side_effects:
          - "Compute provisional_fee_cents using calc_slot_fee.variant.provisional (tier at submit-time)"
          - "Persist application; emit AuditLog SUBMIT"

      - from: OPS_PENDING
        to: COMPLIANCE_PENDING
        trigger: "POST /applications/{id}/ops-approve"
        actor: OperationsReviewer
        preconditions:
          - "All ProductAssociation rows for the application have status APPROVED"
          - "Each ProductAssociation passes calc_product_eligibility (cert + category match)"
        side_effects:
          - "Insert ApprovalRecord(level=OPS, decision=APPROVE)"
          - "Emit AuditLog OPS_APPROVE"

      - from: OPS_PENDING
        to: REJECTED
        trigger: "POST /applications/{id}/ops-approve with decision=REJECT or POST /applications/{id}/ops-reject"
        actor: OperationsReviewer
        preconditions:
          - "reason is non-empty"
        side_effects:
          - "Insert ApprovalRecord(level=OPS, decision=REJECT)"
          - "Release every ProductAssociation: status=RELEASED, Product.reserved_stock decreases by reserved_quantity, Product.available_stock increases by reserved_quantity"
          - "Set provisional_fee_cents to 0; no invoice issued"
          - "Emit AuditLog REJECT"

      - from: COMPLIANCE_PENDING
        to: APPROVED
        trigger: "POST /applications/{id}/compliance-approve"
        actor: ComplianceReviewer
        preconditions:
          - "No conflicting APPROVED application exists for the studio in the same interval (re-check, defends against races)"
          - "Streamer.status == ACTIVE"
          - "Streamer.violation_score < 100"
        side_effects:
          - "Pin pinned_streamer_tier = Streamer.tier at decision time"
          - "Compute final_fee_cents via calc_slot_fee.variant.final (uses pinned_streamer_tier)"
          - "Set deposit_cents = round_half_up(final_fee_cents * 0.30)"
          - "Issue SlotFeeInvoice with status=ISSUED"
          - "Set ScheduleApplication.operational_status = SCHEDULED"
          - "Insert ApprovalRecord(level=COMPLIANCE, decision=APPROVE)"
          - "Emit AuditLog COMPLIANCE_APPROVE"

      - from: COMPLIANCE_PENDING
        to: REJECTED
        trigger: "POST /applications/{id}/compliance-approve with decision=REJECT or POST /applications/{id}/compliance-reject"
        actor: ComplianceReviewer
        preconditions:
          - "reason is non-empty"
        side_effects:
          - "Insert ApprovalRecord(level=COMPLIANCE, decision=REJECT)"
          - "Release every ProductAssociation (same release rule as OPS reject)"
          - "Emit AuditLog REJECT"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Streamer
        preconditions:
          - "Acting Streamer is owner"
        side_effects:
          - "Release every ProductAssociation"
          - "Emit AuditLog WITHDRAW"

      - from: OPS_PENDING
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Streamer
        preconditions:
          - "Acting Streamer is owner"
        side_effects:
          - "Release every ProductAssociation"
          - "Emit AuditLog WITHDRAW"

  - entity: ScheduleApplication.operational_status
    initial_state: NOT_SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: NOT_SCHEDULED
        to: SCHEDULED
        trigger: "Auto on review_status transition to APPROVED"
        actor: system
        preconditions:
          - "review_status just transitioned to APPROVED"
        side_effects:
          - "No additional side effects beyond approval block"

      - from: SCHEDULED
        to: LIVE
        trigger: "POST /applications/{id}/start-live"
        actor: Streamer
        preconditions:
          - "Acting Streamer is owner"
          - "Now >= application.starts_at and Now < application.ends_at (use /_clock/now)"
          - "SlotFeeInvoice.status in {DEPOSIT_PAID, SETTLED} (i.e., deposit_paid == true)"
          - "Streamer.status == ACTIVE"
        side_effects:
          - "Emit AuditLog GO_LIVE"

      - from: LIVE
        to: COMPLETED
        trigger: "POST /applications/{id}/end-live"
        actor: Streamer
        preconditions:
          - "Acting Streamer is owner"
          - "Now >= application.starts_at"
        side_effects:
          - "Initialize CommissionSettlement: status=WINDOW_OPEN, return_window_ends_at = application.ends_at + 7 days"
          - "Pin commission_rate_bp via calc_commission.variant.provisional (uses pinned_streamer_tier and current gmv_cents)"
          - "Increment Streamer.completed_broadcast_count by 1"
          - "Recompute Streamer.tier via calc_performance_tier (cascade depth-3: completion → tier → suspension auto-clear if tier escalated past threshold)"
          - "Emit AuditLog COMPLETE"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /applications/{id}/cancel"
        actor: Streamer | OperationsReviewer
        preconditions:
          - "Now < application.starts_at"
        side_effects:
          - "Issue refund via calc_refund (cascade: refund_cents -> invoice.status -> Streamer.lifetime_gmv_cents recompute via /_sweep/run if needed)"
          - "Release every ProductAssociation"
          - "Emit AuditLog CANCEL"

      - from: LIVE
        to: CANCELLED
        trigger: "POST /applications/{id}/force-cancel"
        actor: OperationsReviewer
        preconditions:
          - "Compliance officer or operations may force-cancel mid-live"
        side_effects:
          - "Invoice.refund_cents = 0 (no refund mid-live)"
          - "Release every ProductAssociation"
          - "Emit AuditLog FORCE_CANCEL"

  - entity: Violation.status
    initial_state: OPEN
    terminal_states: [ENFORCED]
    transitions:
      - from: OPEN
        to: APPEAL_PENDING
        trigger: "POST /violations/{id}/appeal"
        actor: Streamer
        preconditions:
          - "Acting Streamer == Violation.streamer_id"
          - "Now <= Violation.created_at + 7 days"
        side_effects:
          - "Create Appeal(status=PENDING)"
          - "Emit AuditLog APPEAL_FILED"

      - from: APPEAL_PENDING
        to: OVERTURNED
        trigger: "POST /appeals/{id}/decide with decision=OVERTURN"
        actor: ComplianceReviewer
        preconditions:
          - "Appeal exists for the violation"
        side_effects:
          - "Set Appeal.decision=OVERTURNED, decided_at=now"
          - "If Streamer was SUSPENDED/BLACKLISTED due to this violation: revert Streamer.status to ACTIVE and suspension_until=null"
          - "Subtract Violation.severity from Streamer.violation_score (cascade depth-3: appeal decide → streamer score change → tier recompute via calc_performance_tier → suspension_until reconciliation)"
          - "Reverse any fine via /_events/emit-driven Payment refund (record on AuditLog)"
          - "Emit AuditLog APPEAL_OVERTURNED"

      - from: APPEAL_PENDING
        to: UPHELD
        trigger: "POST /appeals/{id}/decide with decision=UPHOLD"
        actor: ComplianceReviewer
        preconditions: []
        side_effects:
          - "Set Appeal.decision=UPHELD"
          - "Penalty stays as-is; Violation.status -> ENFORCED via auto-transition"
          - "Emit AuditLog APPEAL_UPHELD"

      - from: UPHELD
        to: ENFORCED
        trigger: "Auto on Appeal.decision=UPHELD"
        actor: system
        preconditions: []
        side_effects:
          - "No further mutation"

      - from: OPEN
        to: ENFORCED
        trigger: "Auto when no appeal filed within 7 days, via POST /_sweep/run"
        actor: system
        preconditions:
          - "Now > Violation.created_at + 7 days"
          - "No Appeal exists"
        side_effects:
          - "Apply penalty_action: WARNING (no effect), FINE (increment Streamer.violation_score by severity, charge fine via Payment event externally), SUSPENSION (Streamer.status=SUSPENDED, suspension_until=now+suspension_days), BLACKLIST (Streamer.status=BLACKLISTED, suspension_until=null)"
          - "Auto-cancel future SCHEDULED ScheduleApplications of the streamer if suspended/blacklisted (cascade depth-3: violation enforce → streamer.status → app.cancel → invoice refund)"
          - "Set Violation.enforced_at=now"
          - "Emit AuditLog PENALTY_ENFORCED"

  - entity: CommissionSettlement.status
    initial_state: PENDING
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: PENDING
        to: WINDOW_OPEN
        trigger: "Auto on ScheduleApplication.operational_status -> COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "Compute provisional_payout_cents = calc_commission.variant.provisional output"

      - from: WINDOW_OPEN
        to: READY_FOR_PAYOUT
        trigger: "POST /_sweep/run (sweeping any WINDOW_OPEN whose return_window_ends_at <= now())"
        actor: system
        preconditions:
          - "Now >= return_window_ends_at"
        side_effects:
          - "Compute final_payout_cents = calc_commission.variant.final (applies returns + tier bonus + tax)"
          - "If final_payout_cents < 0, transition to REVERSED instead and set Streamer.violation_score += 1"

      - from: WINDOW_OPEN
        to: REVERSED
        trigger: "Auto in /_sweep/run when final_payout_cents < 0"
        actor: system
        preconditions:
          - "final_payout_cents < 0"
        side_effects:
          - "Streamer.violation_score += 1"

      - from: READY_FOR_PAYOUT
        to: PAID
        trigger: "POST /settlements/{id}/payout"
        actor: PlatformAdmin
        preconditions:
          - "Settlement.status == READY_FOR_PAYOUT"
        side_effects:
          - "Update Streamer.lifetime_gmv_cents += gross_sales_cents - returned_sales_cents"
          - "Emit AuditLog PAID"

  - entity: SlotFeeInvoice.status
    initial_state: ISSUED
    terminal_states: [SETTLED, REFUNDED_FULL, VOIDED]
    transitions:
      - from: ISSUED
        to: DEPOSIT_PAID
        trigger: "POST /_events/emit with source=PAYMENT, kind=DEPOSIT_PAID"
        actor: system
        preconditions:
          - "amount_cents == deposit_due_cents"
        side_effects:
          - "Set ScheduleApplication.deposit_paid = true"
          - "Emit AuditLog DEPOSIT_PAID"

      - from: DEPOSIT_PAID
        to: SETTLED
        trigger: "Auto on ScheduleApplication.operational_status -> COMPLETED"
        actor: system
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: REFUNDED_FULL
        trigger: "Auto on ScheduleApplication.operational_status -> CANCELLED before deposit paid"
        actor: system
        preconditions:
          - "deposit_paid == false"
          - "Triggered from SCHEDULED→CANCELLED"
        side_effects:
          - "Set refund_cents = 0 (nothing was paid)"

      - from: DEPOSIT_PAID
        to: REFUNDED_PARTIAL
        trigger: "Auto on ScheduleApplication.operational_status -> CANCELLED with calc_refund result < total_cents"
        actor: system
        preconditions: []
        side_effects:
          - "Set refund_cents = calc_refund output"

      - from: DEPOSIT_PAID
        to: REFUNDED_FULL
        trigger: "Auto on ScheduleApplication.operational_status -> CANCELLED with calc_refund result == deposit_due_cents"
        actor: system
        preconditions: []
        side_effects:
          - "Set refund_cents = deposit_due_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two streamers submit overlapping applications for the same Studio simultaneously"
    guarantee: "At most one application can be APPROVED for any overlapping interval on a given studio"
    error_id: ERR_STUDIO_INTERVAL_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on (studio_id, [starts_at,ends_at)) using DB-level uniqueness on approved intervals"

  - scenario: "Two ProductAssociations race to reserve stock from the same Product"
    guarantee: "Sum of reserved_quantity across non-RELEASED associations cannot exceed Product.available_stock + Product.reserved_stock at submission time"
    error_id: ERR_STOCK_INSUFFICIENT
    http_status: 409
    serialization: "First-writer-wins on Product row using SELECT FOR UPDATE / atomic decrement"

  - scenario: "Compliance approve and streamer withdraw race on the same application"
    guarantee: "Exactly one wins; loser receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on application.review_status"

  - scenario: "Two ops reviewers approve the same application concurrently"
    guarantee: "Only one OPS_APPROVE recorded; OCC version check rejects the loser"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "ScheduleApplication.version increments per mutation; loser fails with stale version"

  - scenario: "Two appeal-decide actions race on the same Violation"
    guarantee: "Only the first decision is recorded"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Violation.status"

  - scenario: "Two settlement payout calls race on the same settlement"
    guarantee: "Only the first payout succeeds"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on CommissionSettlement.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_slot_fee
    trigger: "On application submit (provisional) and on compliance approve (final)"
    algorithm: tiered_pricing
    formula: |
      duration_hours = (ends_at - starts_at).total_seconds() / 3600.0
      base_cents = Studio.base_hour_price_cents * duration_hours      # may have fractions
      # Peak rule: any minute of [starts_at, ends_at) that falls inside 19:00–23:00 UTC counts as peak
      peak_hours = sum_of_minutes_in_peak_window / 60.0
      peak_surcharge_cents = peak_hours * Studio.base_hour_price_cents * PEAK_MULTIPLIER   # 0.50
      subtotal_cents_unrounded = base_cents + peak_surcharge_cents
      # Tier discount applies to subtotal
      tier_discount_pct = {BRONZE:0, SILVER:5, GOLD:10, PLATINUM:15}[tier]
      # Package discount applies to (subtotal - tier_discount) — order matters
      package_discount_pct = {STANDARD:0, COMBO_HALF_DAY:8, COMBO_FULL_DAY:12, PEAK_BUNDLE:5}[package_code]
      step1 = subtotal_cents_unrounded * (1 - tier_discount_pct/100)
      step2 = step1 * (1 - package_discount_pct/100)
      total_cents = round_half_up(step2)        # SINGLE rounding at the end, not per step
    input_set: "Studio fields, application interval, package_code, streamer tier (variant-dependent), peak-window constants"
    constants:
      PEAK_WINDOW_START_UTC: "19:00"
      PEAK_WINDOW_END_UTC: "23:00"
      PEAK_MULTIPLIER: 0.50
      TIER_DISCOUNT_PCT: { BRONZE: 0, SILVER: 5, GOLD: 10, PLATINUM: 15 }
      PACKAGE_DISCOUNT_PCT: { STANDARD: 0, COMBO_HALF_DAY: 8, COMBO_FULL_DAY: 12, PEAK_BUNDLE: 5 }
      DEPOSIT_FRACTION: 0.30
    precision: "Integer cents via round_half_up applied ONCE on final total"
    variants:
      - name: provisional
        when: "On application submit"
        difference: "Uses Streamer.tier as of submit-time; result stored in provisional_fee_cents"
      - name: final
        when: "On compliance approve"
        difference: "Uses ScheduleApplication.pinned_streamer_tier (snapshot at approve-time) — diverges from provisional whenever streamer's tier escalated between submit and approval, producing different integer cents"

  - name: calc_commission
    trigger: "On operational_status->COMPLETED (provisional) and on settlement window sweep (final)"
    algorithm: tiered_pricing
    formula: |
      # Provisional (computed at COMPLETED, before returns)
      rate_bp = {BRONZE:1200, SILVER:1500, GOLD:1800, PLATINUM:2200}[pinned_streamer_tier]
      gross_commission_cents = round_half_up(gross_sales_cents * rate_bp / 10000)
      tier_bonus_cents = 0
      if pinned_streamer_tier in {GOLD, PLATINUM} and gross_sales_cents >= 5_000_000: tier_bonus_cents = round_half_up(gross_sales_cents * 0.005)
      provisional_payout_cents = gross_commission_cents + tier_bonus_cents
      # Final (computed at sweep, after return window)
      effective_sales_cents = gross_sales_cents - returned_sales_cents
      reversed_commission_cents = round_half_up(returned_sales_cents * rate_bp / 10000)
      adjusted_gross_cents = gross_commission_cents - reversed_commission_cents
      adjusted_bonus_cents = 0
      if pinned_streamer_tier in {GOLD, PLATINUM} and effective_sales_cents >= 5_000_000:
          adjusted_bonus_cents = round_half_up(effective_sales_cents * 0.005)
      pre_tax = adjusted_gross_cents + adjusted_bonus_cents
      tax_withholding_cents = round_half_up(pre_tax * TAX_RATE) if pre_tax > 0 else 0
      final_payout_cents = pre_tax - tax_withholding_cents
    input_set: "Settlement fields, pinned_streamer_tier, gross_sales and returned_sales aggregated from ExternalEvent.kind in {BROADCAST_GMV, RETURN_REPORTED} with occurred_at <= return_window_ends_at"
    constants:
      RATE_BP: { BRONZE: 1200, SILVER: 1500, GOLD: 1800, PLATINUM: 2200 }
      TIER_BONUS_SALES_THRESHOLD_CENTS: 5000000
      TIER_BONUS_PCT: 0.005
      TAX_RATE: 0.10
      RETURN_WINDOW_DAYS: 7
    precision: "round_half_up to integer cents"
    variants:
      - name: provisional
        when: "On COMPLETED"
        difference: "Uses gross_sales_cents only; no return adjustment, no tax — yields provisional_payout_cents"
      - name: final
        when: "On sweep after return window"
        difference: "Subtracts reversed commission for returned_sales, recomputes tier bonus on EFFECTIVE sales (not gross), applies tax — divergence vs provisional whenever returned_sales_cents > 0 or bonus threshold crossing changes"

  - name: calc_performance_tier
    trigger: "On operational_status->COMPLETED and on appeal OVERTURNED that adjusts violation_score"
    algorithm: threshold
    formula: |
      gmv = Streamer.lifetime_gmv_cents
      vs  = Streamer.violation_score
      if vs >= 50 or Streamer.status == BLACKLISTED:    tier = BRONZE
      elif gmv >= 50_000_000 and vs <= 5:               tier = PLATINUM
      elif gmv >= 10_000_000 and vs <= 10:              tier = GOLD
      elif gmv >= 1_000_000  and vs <= 20:              tier = SILVER
      else:                                             tier = BRONZE
    input_set: "Streamer.lifetime_gmv_cents, Streamer.violation_score, Streamer.status"
    constants:
      PLATINUM_GMV_CENTS: 50000000
      GOLD_GMV_CENTS: 10000000
      SILVER_GMV_CENTS: 1000000
      DEMOTION_VIOLATION_SCORE: 50
    precision: "Discrete enum output"
    variants:
      - name: only
        when: "Single-mode threshold"
        difference: "n/a"

  - name: calc_refund
    trigger: "On operational_status SCHEDULED->CANCELLED"
    algorithm: threshold
    formula: |
      lead_hours = (application.starts_at - now()).total_seconds() / 3600.0
      if lead_hours >= 72:        refund_cents = invoice.deposit_due_cents          # 100% of deposit refunded
      elif lead_hours >= 24:      refund_cents = round_half_up(invoice.deposit_due_cents * 0.5)
      else:                       refund_cents = 0
    input_set: "application.starts_at, now(), invoice.deposit_due_cents"
    constants:
      FULL_REFUND_LEAD_HOURS: 72
      PARTIAL_REFUND_LEAD_HOURS: 24
      PARTIAL_REFUND_FRACTION: 0.50
    precision: "round_half_up to integer cents"
    variants:
      - name: only
        when: "Single-mode lead-time threshold"
        difference: "n/a"

  - name: calc_product_eligibility
    trigger: "On product association create and on ops-approve"
    algorithm: constraint_propagation
    formula: |
      reject_if Product.status == OFF_SHELF                                              -> NOT_ON_SHELF
      reject_if Product.category NOT IN application.declared_product_categories          -> CATEGORY_MISMATCH
      reject_if Product.requires_professional_cert AND Product.category NOT IN Streamer.professional_cert_categories  -> MISSING_CERT
      reject_if reserved_quantity > Product.available_stock                              -> STOCK_INSUFFICIENT
      else accept
    input_set: "Product fields, Streamer.professional_cert_categories, application.declared_product_categories, association.reserved_quantity"
    constants: {}
    precision: "Boolean accept/reject with explicit reject_reason"
    variants:
      - name: only
        when: "Single-mode evaluation"
        difference: "n/a"

  - name: calc_violation_penalty
    trigger: "On POST /violations (create)"
    algorithm: threshold
    formula: |
      severity_by_type = {FALSE_ADVERTISING:2, WRONG_PRODUCT:1, VIOLATING_CONTENT:3, DATA_FRAUD:4}
      evidence_bonus   = 1 if len(evidence_refs) >= 3 else 0
      severity         = severity_by_type[type] + evidence_bonus
      # Penalty action by severity AND existing violation history:
      existing = Streamer.violation_score                # BEFORE this violation
      score_after = existing + severity
      if score_after >= 100 or violation_type == DATA_FRAUD with severity >= 4:    penalty_action = BLACKLIST
      elif score_after >= 50 or severity >= 4:                                     penalty_action = SUSPENSION; suspension_days = 30
      elif severity >= 2:                                                          penalty_action = FINE; fine_cents = severity * 50000
      else:                                                                        penalty_action = WARNING
    input_set: "violation_type, evidence_refs.count, Streamer.violation_score"
    constants:
      SEVERITY_BY_TYPE: { FALSE_ADVERTISING: 2, WRONG_PRODUCT: 1, VIOLATING_CONTENT: 3, DATA_FRAUD: 4 }
      EVIDENCE_THRESHOLD: 3
      BLACKLIST_SCORE: 100
      SUSPENSION_SCORE: 50
      SUSPENSION_DEFAULT_DAYS: 30
      FINE_PER_SEVERITY_CENTS: 50000
    precision: "Discrete enum output"
    variants:
      - name: only
        when: "Single-mode policy"
        difference: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is allowed for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced ids resolve to live entities (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced ids (studio_id, streamer_id, product_id, application_id) resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /applications, POST /applications/{id}/products, POST /violations"

  - priority: 5
    category: auth
    check: "Streamer-acting role acts only on resources it owns (X-User-ID matches resource.streamer_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Streamer-callable endpoints"

  - priority: 6
    category: state
    check: "Resource is in a state that allows the requested transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Streamer.status == ACTIVE for any streamer-initiated mutation (submit, start-live, association create)"
    error_id: ERR_STREAMER_NOT_ACTIVE
    http_status: 403
    applies_to: "POST /applications, POST /applications/{id}/submit, POST /applications/{id}/start-live, POST /applications/{id}/products"

  - priority: 8
    category: business_safety
    check: "Real-name verified and health certificate not expired (relative to application.ends_at)"
    error_id: ERR_QUALIFICATION_MISSING
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 9
    category: business_safety
    check: "Product professional certification: if Product.requires_professional_cert, Streamer.professional_cert_categories must contain Product.category"
    error_id: ERR_PRODUCT_CERT_MISSING
    http_status: 422
    applies_to: "POST /applications/{id}/products, POST /applications/{id}/ops-approve"

  - priority: 10
    category: business_referential
    check: "Product.category must be in application.declared_product_categories"
    error_id: ERR_PRODUCT_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /applications/{id}/products"

  - priority: 11
    category: business_safety
    check: "Product.status == ON_SHELF at association create"
    error_id: ERR_PRODUCT_NOT_ON_SHELF
    http_status: 422
    applies_to: "POST /applications/{id}/products"

  - priority: 12
    category: business_temporal
    check: "Requested interval is fully covered by AVAILABLE TimeSlotConfig and disjoint from MAINTENANCE windows (half-open [s,e))"
    error_id: ERR_OUT_OF_AVAILABLE_WINDOW
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 13
    category: business_temporal
    check: "Requested interval does not overlap with any existing APPROVED/SCHEDULED/LIVE application on the same studio (half-open overlap)"
    error_id: ERR_STUDIO_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /applications/{id}/submit, POST /applications/{id}/compliance-approve"

  - priority: 14
    category: business_constraint
    check: "ends_at > starts_at and duration >= 30 minutes and <= 8 hours"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /applications"

  - priority: 15
    category: business_fiscal
    check: "ProductAssociation.reserved_quantity <= Product.available_stock"
    error_id: ERR_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /applications/{id}/products"

  - priority: 16
    category: business_constraint
    check: "During-broadcast association rule: when application.operational_status == LIVE, the new ProductAssociation must be of the same category as the application's declared_product_categories AND total associations remain <= 20"
    error_id: ERR_LIVE_ASSOCIATION_DENIED
    http_status: 422
    applies_to: "POST /applications/{id}/products"

  - priority: 17
    category: business_fiscal
    check: "OCC version match: when request body provides 'version', it must equal current entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /studios/{id}, PATCH /products/{id}, PATCH /applications/{id}, POST /applications/{id}/compliance-approve"

  - priority: 18
    category: business_constraint
    check: "Deposit must be paid before /start-live"
    error_id: ERR_DEPOSIT_UNPAID
    http_status: 422
    applies_to: "POST /applications/{id}/start-live"

  - priority: 19
    category: business_temporal
    check: "Cancel-before-start temporal gate: SCHEDULED->CANCELLED only when Now < starts_at"
    error_id: ERR_TOO_LATE_TO_CANCEL
    http_status: 409
    applies_to: "POST /applications/{id}/cancel"

  - priority: 20
    category: business_safety
    check: "Streamer.violation_score < 100 at compliance approve"
    error_id: ERR_STREAMER_BLOCKED
    http_status: 422
    applies_to: "POST /applications/{id}/compliance-approve"

  - priority: 21
    category: business_constraint
    check: "Appeal must be filed within 7 days of Violation.created_at; after that, sweep enforces"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /violations/{id}/appeal"

  - priority: 22
    category: business_referential
    check: "Reject/cancel reason required and non-empty"
    error_id: ERR_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /applications/{id}/ops-reject, POST /applications/{id}/compliance-reject, POST /applications/{id}/cancel"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /live-schedule/streamers
    description: Create a streamer profile (registration)
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, id_card_number, real_name_verified, health_cert_expires_at, professional_cert_categories, content_category_tags]
    output: Streamer
    side_effects: ["Initialize tier=BRONZE, violation_score=0, status=ACTIVE"]

  - method: GET
    path: /live-schedule/streamers/{id}
    description: Read streamer profile
    roles: [PlatformAdmin, OperationsReviewer, ComplianceReviewer, Streamer]
    code: 200
    input: []
    output: Streamer
    side_effects: []

  - method: GET
    path: /live-schedule/streamers
    description: List streamers (paginated, filterable by status/tier)
    roles: [PlatformAdmin, OperationsReviewer, ComplianceReviewer]
    code: 200
    input: ["limit?", "offset?", "status?", "tier?"]
    output: Streamer[]
    side_effects: []

  - method: POST
    path: /live-schedule/studios
    description: Create studio
    roles: [PlatformAdmin]
    code: 201
    input: [name, location, equipment_inventory, capacity, studio_type, slot_tier, base_hour_price_cents]
    output: Studio
    side_effects: ["status=OPEN"]

  - method: PATCH
    path: /live-schedule/studios/{id}
    description: Update studio status / capacity (OCC)
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "capacity?", version]
    output: Studio
    side_effects: []

  - method: POST
    path: /live-schedule/studios/{studio_id}/time-slots
    description: Add an AVAILABLE or MAINTENANCE time-slot configuration
    roles: [PlatformAdmin]
    code: 201
    input: [kind, starts_at, ends_at, weekday_mask]
    output: TimeSlotConfig
    side_effects: []

  - method: GET
    path: /live-schedule/studios/{studio_id}/time-slots
    description: List a studio's time-slot configs
    roles: [PlatformAdmin, OperationsReviewer, Streamer]
    code: 200
    input: ["limit?", "offset?"]
    output: TimeSlotConfig[]
    side_effects: []

  - method: POST
    path: /live-schedule/products
    description: Onboard a product
    roles: [PlatformAdmin]
    code: 201
    input: [name, category, requires_professional_cert, unit_price_cents, available_stock]
    output: Product
    side_effects: ["status=ON_SHELF, reserved_stock=0"]

  - method: PATCH
    path: /live-schedule/products/{id}
    description: Update product (status, stock); supports OCC version
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "available_stock?", version]
    output: Product
    side_effects: []

  - method: POST
    path: /live-schedule/applications
    description: Create a draft application
    roles: [Streamer]
    code: 201
    input: [streamer_id, studio_id, starts_at, ends_at, declared_content_categories, declared_product_categories, package_code]
    output: ScheduleApplication
    side_effects: ["review_status=DRAFT"]

  - method: GET
    path: /live-schedule/applications/{id}
    description: Read an application (with computed fees)
    roles: [PlatformAdmin, OperationsReviewer, ComplianceReviewer, Streamer]
    code: 200
    input: []
    output: ScheduleApplication
    side_effects: []

  - method: GET
    path: /live-schedule/applications
    description: List applications (paginated, filter by streamer_id/studio_id/review_status/operational_status)
    roles: [PlatformAdmin, OperationsReviewer, ComplianceReviewer, Streamer]
    code: 200
    input: ["limit?", "offset?", "streamer_id?", "studio_id?", "review_status?", "operational_status?"]
    output: ScheduleApplication[]
    side_effects: []

  - method: POST
    path: /live-schedule/applications/{id}/products
    description: Associate a product with an application (pre-approval and during-broadcast supported)
    roles: [Streamer]
    code: 201
    input: [product_id, reserved_quantity]
    output: ProductAssociation
    side_effects:
      - "Decrement Product.available_stock by reserved_quantity"
      - "Increment Product.reserved_stock by reserved_quantity"
      - "Set association_phase=PRE_APPROVAL if review_status in {DRAFT, OPS_PENDING, COMPLIANCE_PENDING}, else DURING_BROADCAST"
      - "Run calc_product_eligibility; status=APPROVED on pass, REJECTED on fail (and re-release stock on fail)"

  - method: POST
    path: /live-schedule/applications/{id}/submit
    description: Submit draft for ops review
    roles: [Streamer]
    code: 200
    input: []
    output: ScheduleApplication
    side_effects: ["Compute provisional_fee_cents via calc_slot_fee.provisional", "review_status: DRAFT -> OPS_PENDING"]

  - method: POST
    path: /live-schedule/applications/{id}/ops-approve
    description: Ops review decision
    roles: [OperationsReviewer]
    code: 200
    input: [decision, "reason?"]
    output: ScheduleApplication
    side_effects: ["Insert ApprovalRecord", "Transition per §1.2"]

  - method: POST
    path: /live-schedule/applications/{id}/compliance-approve
    description: Compliance review decision
    roles: [ComplianceReviewer]
    code: 200
    input: [decision, "reason?", "version?"]
    output: ScheduleApplication
    side_effects: ["Pin pinned_streamer_tier", "Compute final_fee_cents via calc_slot_fee.final", "Issue invoice", "operational_status -> SCHEDULED"]

  - method: POST
    path: /live-schedule/applications/{id}/withdraw
    description: Streamer withdraws own application (DRAFT/OPS_PENDING only)
    roles: [Streamer]
    code: 200
    input: []
    output: ScheduleApplication
    side_effects: ["Release product associations"]

  - method: POST
    path: /live-schedule/applications/{id}/start-live
    description: Begin broadcast
    roles: [Streamer]
    code: 200
    input: []
    output: ScheduleApplication
    side_effects: ["operational_status: SCHEDULED -> LIVE"]

  - method: POST
    path: /live-schedule/applications/{id}/end-live
    description: End broadcast
    roles: [Streamer]
    code: 200
    input: []
    output: ScheduleApplication
    side_effects:
      - "operational_status: LIVE -> COMPLETED"
      - "Initialize CommissionSettlement"
      - "Run calc_performance_tier; cascade depth-3 into Streamer.tier and suspension_until reconciliation"

  - method: POST
    path: /live-schedule/applications/{id}/cancel
    description: Cancel a SCHEDULED application before start
    roles: [Streamer, OperationsReviewer]
    code: 200
    input: [reason]
    output: ScheduleApplication
    side_effects: ["Run calc_refund", "Release product associations"]

  - method: POST
    path: /live-schedule/applications/{id}/force-cancel
    description: Force-cancel mid-LIVE
    roles: [OperationsReviewer]
    code: 200
    input: [reason]
    output: ScheduleApplication
    side_effects: ["operational_status: LIVE -> CANCELLED"]

  - method: GET
    path: /live-schedule/applications/{id}/approvals
    description: List approval records for an application
    roles: [PlatformAdmin, OperationsReviewer, ComplianceReviewer, Streamer]
    code: 200
    input: ["limit?", "offset?"]
    output: ApprovalRecord[]
    side_effects: []

  - method: GET
    path: /live-schedule/applications/{id}/invoice
    description: Read the slot-fee invoice for an application
    roles: [PlatformAdmin, OperationsReviewer, ComplianceReviewer, Streamer]
    code: 200
    input: []
    output: SlotFeeInvoice
    side_effects: []

  - method: GET
    path: /live-schedule/applications/{id}/settlement
    description: Read commission settlement
    roles: [PlatformAdmin, OperationsReviewer, ComplianceReviewer, Streamer]
    code: 200
    input: []
    output: CommissionSettlement
    side_effects: []

  - method: POST
    path: /live-schedule/settlements/{id}/payout
    description: Pay out a READY_FOR_PAYOUT settlement
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CommissionSettlement
    side_effects: ["Streamer.lifetime_gmv_cents += effective_sales", "Cascade depth-3: settlement paid -> tier recompute -> suspension reconciliation"]

  - method: POST
    path: /live-schedule/violations
    description: Create a violation record (by reviewers)
    roles: [OperationsReviewer, ComplianceReviewer]
    code: 201
    input: [streamer_id, "application_id?", violation_type, evidence_refs]
    output: Violation
    side_effects: ["Run calc_violation_penalty; status=OPEN", "Audit"]

  - method: POST
    path: /live-schedule/violations/{id}/appeal
    description: Streamer files appeal
    roles: [Streamer]
    code: 201
    input: [argument]
    output: Appeal
    side_effects: ["Violation.status OPEN -> APPEAL_PENDING"]

  - method: POST
    path: /live-schedule/appeals/{id}/decide
    description: Compliance decides an appeal
    roles: [ComplianceReviewer]
    code: 200
    input: [decision]
    output: Appeal
    side_effects: ["If OVERTURN: Streamer.status reverted, violation_score adjusted, tier recompute (cascade depth-3)"]

  - method: GET
    path: /live-schedule/violations
    description: List violations
    roles: [PlatformAdmin, OperationsReviewer, ComplianceReviewer, Streamer]
    code: 200
    input: ["limit?", "offset?", "streamer_id?", "status?"]
    output: Violation[]
    side_effects: []

  - method: GET
    path: /live-schedule/audit-logs
    description: Query audit log
    roles: [PlatformAdmin, ComplianceReviewer]
    code: 200
    input: ["limit?", "offset?", "subject_kind?", "subject_id?", "actor_role?"]
    output: AuditLog[]
    side_effects: []

  - method: POST
    path: /live-schedule/_clock/advance
    description: Test-only — advance the simulated clock to a given ISO 8601 timestamp
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: null
    side_effects: ["Updates server clock used by all temporal preconditions and calculations"]

  - method: GET
    path: /live-schedule/_clock/now
    description: Test-only — read current simulated clock
    roles: [PlatformAdmin, OperationsReviewer, ComplianceReviewer, Streamer]
    code: 200
    input: []
    output: null
    side_effects: []

  - method: POST
    path: /live-schedule/_sweep/run
    description: Run the periodic sweep — closes return windows, finalizes settlements, enforces violations whose appeal window expired, reconciles suspension_until expiry
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "For each WINDOW_OPEN settlement with return_window_ends_at <= now: run calc_commission.final and transition to READY_FOR_PAYOUT or REVERSED"
      - "For each OPEN Violation with created_at + 7d <= now: transition to ENFORCED and apply penalty (cascade depth-3: violation -> streamer.status -> scheduled apps cancellation -> invoice refund)"
      - "For each SUSPENDED Streamer with suspension_until <= now: revert status=ACTIVE"

  - method: POST
    path: /live-schedule/_events/emit
    description: Test-driving endpoint to inject external-system events (PAYMENT, IM, ECOMMERCE, CONTENT_MOD)
    roles: [PlatformAdmin]
    code: 201
    input: [source, kind, "application_id?", "streamer_id?", "amount_cents?", occurred_at]
    output: ExternalEvent
    side_effects:
      - "DEPOSIT_PAID -> SlotFeeInvoice ISSUED -> DEPOSIT_PAID, set application.deposit_paid=true"
      - "BROADCAST_GMV -> aggregate into Settlement.gross_sales_cents and Streamer GMV history (after final sweep)"
      - "RETURN_REPORTED -> aggregate into Settlement.returned_sales_cents (only if occurred_at <= return_window_ends_at)"
      - "CONTENT_FLAGGED -> auto-create Violation(type=VIOLATING_CONTENT, evidence_refs=event id)"
      - "IM_CHANNEL_OPENED -> AuditLog only, no state change"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing X-User-ID or X-User-Role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted, or Streamer acting on someone else's resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced entity does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state that allows the requested transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Provided version does not match current entity version"
  - id: ERR_STUDIO_INTERVAL_CONFLICT
    http: 409
    condition: "Requested interval overlaps another approved/scheduled/live application on the same studio (half-open overlap)"
  - id: ERR_STOCK_INSUFFICIENT
    http: 409
    condition: "Product.available_stock < requested reserved_quantity"
  - id: ERR_OUT_OF_AVAILABLE_WINDOW
    http: 409
    condition: "Requested interval not covered by AVAILABLE TimeSlotConfig, or overlaps a MAINTENANCE window"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "ends_at <= starts_at, or duration outside [30 min, 8 h]"
  - id: ERR_QUALIFICATION_MISSING
    http: 422
    condition: "Real-name not verified, or health certificate expires on/before application.ends_at"
  - id: ERR_PRODUCT_CERT_MISSING
    http: 422
    condition: "Product.requires_professional_cert and Streamer lacks the matching category cert"
  - id: ERR_PRODUCT_CATEGORY_MISMATCH
    http: 422
    condition: "Product.category not present in application.declared_product_categories"
  - id: ERR_PRODUCT_NOT_ON_SHELF
    http: 422
    condition: "Product.status != ON_SHELF at association time"
  - id: ERR_LIVE_ASSOCIATION_DENIED
    http: 422
    condition: "During-broadcast association violates category match or 20-product cap"
  - id: ERR_STREAMER_NOT_ACTIVE
    http: 403
    condition: "Streamer.status != ACTIVE at the time of a streamer-initiated mutation"
  - id: ERR_STREAMER_BLOCKED
    http: 422
    condition: "Streamer.violation_score >= 100 at compliance approve"
  - id: ERR_DEPOSIT_UNPAID
    http: 422
    condition: "/start-live attempted while deposit_paid == false"
  - id: ERR_TOO_LATE_TO_CANCEL
    http: 409
    condition: "Cancel attempted with Now >= application.starts_at"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "Appeal filed after 7-day window from Violation.created_at"
  - id: ERR_REASON_REQUIRED
    http: 422
    condition: "Reject/cancel reason missing or empty"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset outside allowed range"
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "Generic schema/shape failure (catch-all)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Streamer
    description: A streamer who applies for slots, manages products, runs broadcasts, and files appeals.
    identity: "entity_backed:Streamer"
    exclusive_operations:
      - "POST /live-schedule/applications"
      - "POST /live-schedule/applications/{id}/submit"
      - "POST /live-schedule/applications/{id}/withdraw"
      - "POST /live-schedule/applications/{id}/start-live"
      - "POST /live-schedule/applications/{id}/end-live"
      - "POST /live-schedule/applications/{id}/products"
      - "POST /live-schedule/violations/{id}/appeal"
    shared_operations:
      - "GET /live-schedule/applications (own only)"
      - "GET /live-schedule/applications/{id} (own only)"
      - "GET /live-schedule/applications/{id}/invoice (own only)"
      - "GET /live-schedule/applications/{id}/settlement (own only)"
      - "GET /live-schedule/applications/{id}/approvals (own only)"
      - "GET /live-schedule/violations (own only)"
      - "POST /live-schedule/applications/{id}/cancel (own only)"
      - "GET /live-schedule/streamers/{id} (own only)"

  - name: OperationsReviewer
    description: First-level reviewer for operational eligibility (product matching, qualifications) — opaque operator identity.
    identity: opaque
    exclusive_operations:
      - "POST /live-schedule/applications/{id}/ops-approve"
      - "POST /live-schedule/applications/{id}/force-cancel"
    shared_operations:
      - "POST /live-schedule/violations"
      - "POST /live-schedule/applications/{id}/cancel"
      - "GET endpoints on streamers/applications/violations"

  - name: ComplianceReviewer
    description: Second-level reviewer for legal/safety/compliance, and arbiter of appeals.
    identity: opaque
    exclusive_operations:
      - "POST /live-schedule/applications/{id}/compliance-approve"
      - "POST /live-schedule/appeals/{id}/decide"
    shared_operations:
      - "POST /live-schedule/violations"
      - "GET endpoints on applications/violations/audit-logs"

  - name: PlatformAdmin
    description: Platform operator; manages streamers, studios, products, runs sweeps and event injection, triggers payouts.
    identity: opaque
    exclusive_operations:
      - "POST /live-schedule/streamers"
      - "POST /live-schedule/studios"
      - "PATCH /live-schedule/studios/{id}"
      - "POST /live-schedule/studios/{studio_id}/time-slots"
      - "POST /live-schedule/products"
      - "PATCH /live-schedule/products/{id}"
      - "POST /live-schedule/settlements/{id}/payout"
      - "POST /live-schedule/_clock/advance"
      - "POST /live-schedule/_sweep/run"
      - "POST /live-schedule/_events/emit"
    shared_operations:
      - "GET endpoints on all entities"
