            - "Grant submission with amount_cents == 4999 returns 422 with error_id == ERR_BELOW_MINIMUM_GRANT"

      - name: grant_pay_zero_redemption_when_cash_covers_amount
        grounds:
          - calculations.grant_payout_redemption
          - state_machines.GrantRecommendation.SCHEDULED_to_PAID
          - entities.LedgerEntry.fields.entry_type
          - endpoints.POST /daf/grants/{grantId}/pay
        distinguishing_aspect: |
          Empty-set / zero-quantity boundary on a DIFFERENT endpoint (grant pay) and DIFFERENT
