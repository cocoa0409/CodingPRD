    input: ["archived?", "limit?", "offset?"]
    output: PriceTier[]
    side_effects: []
  - method: GET
    path: "/price-tiers/{id}"
    description: "Get a price tier"
    roles: [SalesRep, RoasterStaff]
    code: 200
    input: []
    output: PriceTier
    side_effects: []

