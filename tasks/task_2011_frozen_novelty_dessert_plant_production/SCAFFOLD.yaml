# =============================================================================
# Task 2011 — Frozen Novelty & Dessert Plant Production
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design
# (§1.9) live in sibling files.
# =============================================================================

scenario: |
  2011. Frozen Novelty & Dessert Plant Production (frozen novelty manufacturer): mix formulation & overrun target, flavor changeover & allergen cleaning, freezing/hardening tunnel scheduling, novelty vs bulk packaging lines, cold chain distribution & temperature abuse claim, seasonal demand surge & inventory build, co-pack for private label, shelf-life & heat-shock quality complaint

domain_name: frozen-novelty-plant
api_prefix: ""

# =============================================================================
# Complexity profile (§0.1–§0.4) — Expert band, pushed to maximum density
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # tunnel + freezer-zone scheduling
  secondary_archetype: quota_allocation        # mix litres, tunnel throughput, zone pallets, contract volumes
  complexity_layers:
    - dual_variant_calculation                 # standard-vs-metered mix costing; standard-vs-carrier claim payout
    - cascading_side_effects                   # complaint substantiation -> lot quarantine -> allocation release -> shipment regress
    - optimistic_concurrency                   # OCC on Product.version (reformulation) and CoPackContract.version (amend)
    - rate_threshold_triggers                  # abuse thresholds, heat-shock limits, shortfall tiers, lab-cycle cap
  entity_topology: flat                        # peer entities, FK references, no nested ownership URLs
  state_machine_shape: cyclic                  # changeover redo loop, claim appeal loop, complaint lab-retest loop, run hold loop, lot quarantine loop
  relationship_patterns:
    - one_to_many
    - many_to_many                             # Shipment <-> InventoryLot via ShipmentAllocation
    - self_referential                         # Product.predecessor_product_id / successor_product_id reformulation lineage
    - cross_aggregate                          # Changeover snapshots Line.last_product; Complaint cascades across run's lots
  role_model: segregation_of_duties            # pasteurizer != releaser; completer != verifier; quarantiner != releaser
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku_code, type: string, source: input, description: "Unique SKU code" }
      - { name: product_name, type: string, source: input, description: "Display name" }
      - { name: format, type: enum, source: input, description: "NOVELTY (bars/sandwiches) | BULK (pints/tubs); constrains which lines may run it" }
      - { name: flavor_family, type: enum, source: input, description: "VANILLA | CHOCOLATE | FRUIT | CARAMEL | NUT_BAKERY | COFFEE; drives changeover matrix" }
      - { name: allergens, type: array, source: input, description: "Subset of [MILK, EGG, SOY, WHEAT, PEANUT, TREE_NUT, SESAME]; declared allergen content" }
      - { name: fill_volume_ml_per_unit, type: number, source: input, description: "Finished unit fill volume in ml at the freezer (before aeration expansion); > 0" }
      - { name: target_overrun_pct, type: number, source: input, description: "Target overrun percent (air incorporation); 0 <= x <= 100" }
      - { name: units_per_pallet, type: integer, source: input, description: "Finished units per freezer pallet; > 0; drives pallet rounding" }
      - { name: shelf_life_days, type: integer, source: input, description: "Shelf life in days from production; > 0" }
      - { name: co_pack_only, type: boolean, source: input, default: false, description: "True => production runs require an ACTIVE co-pack contract covering this product" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED" }
      - { name: predecessor_product_id, type: string, source: system, default: null, description: "FK -> Product.id; set when this product was created via POST /products/{id}/reformulations" }
      - { name: successor_product_id, type: string, source: system, default: null, description: "FK -> Product.id; set when a reformulation of this product is created" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: customer_code, type: string, source: input, description: "Unique customer code" }
      - { name: display_name, type: string, source: input, description: "Customer name" }
      - { name: kind, type: enum, source: input, description: "PRIVATE_LABEL (co-pack) | DISTRIBUTOR" }

  - name: CoPackContract
    parent: null
    common_fields: true
    fields:
      - { name: contract_code, type: string, source: input, description: "Unique contract code" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; private-label customer" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must reference a co_pack_only=true product at approve time" }
      - { name: committed_units, type: integer, source: input, description: "Committed volume over the contract term; > 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit in cents; >= 0" }
      - { name: start_date, type: string, source: input, description: "ISO date; contract activates (APPROVED->ACTIVE) when logical clock reaches it" }
      - { name: end_date, type: string, source: input, description: "ISO date; informational term end; end_date > start_date" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | ACTIVE | FULFILLED | CANCELED" }
      - { name: pinned_product_version, type: integer, source: system, default: null, description: "Product.version captured at approve time; re-validation key for later spec edits" }
      - { name: delivered_units, type: integer, source: computed, default: 0, description: "Sum of allocation units on this contract's shipments that reached DELIVERED" }
      - { name: fulfillment_pct, type: number, source: computed, default: 0, description: "delivered_units / committed_units * 100, 2 decimal places round_half_up" }
      - { name: shortfall_penalty_cents, type: integer, source: computed, default: null, description: "Computed at cancel from APPROVED/ACTIVE when delivered < committed; tiered rate on fulfillment_pct" }

  - name: MixBatch
    parent: null
    common_fields: true
    fields:
      - { name: batch_code, type: string, source: input, description: "Unique mix batch code" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; which product's mix recipe was batched" }
      - { name: litres_produced, type: number, source: input, description: "Liquid mix litres produced; > 0" }
      - { name: produced_at, type: datetime, source: system, default: null, description: "Logical clock timestamp at pasteurize" }
      - { name: expires_at, type: datetime, source: system, default: null, description: "produced_at + MIX_SHELF_HOURS(72); mix is unusable strictly after... at or after this instant" }
      - { name: litres_consumed, type: number, source: computed, default: 0, description: "Sum of metered litres consumed by COMPLETED runs" }
      - { name: litres_wasted, type: number, source: computed, default: 0, description: "Litres written off at reject (litres_produced - litres_consumed)" }
      - { name: litres_remaining, type: number, source: computed, description: "litres_produced - litres_consumed - litres_wasted" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | PASTEURIZED | RELEASED | CONSUMED | REJECTED | EXPIRED" }
      - { name: pasteurized_by, type: string, source: system, default: null, description: "X-User-ID of the LineOperator who pasteurized; segregation-of-duties key" }
      - { name: released_by, type: string, source: system, default: null, description: "X-User-ID of the QAManager who released; MUST differ from pasteurized_by" }

  - name: Line
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line code" }
      - { name: format, type: enum, source: input, description: "NOVELTY | BULK; runs and changeovers must match this format" }
      - { name: rate_units_per_hour, type: integer, source: input, description: "Line rated throughput; > 0" }
      - { name: status, type: enum, source: system, default: IDLE, description: "IDLE | CLEANING | RUNNING" }
      - { name: last_product_id, type: string, source: system, default: null, description: "FK -> Product.id; product of the most recently COMPLETED run on this line; null if never run" }
      - { name: last_allergens, type: array, source: system, default: null, description: "Allergen snapshot of last_product at completion; changeover matrix input" }

  - name: Changeover
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> Line.id; line being changed over" }
      - { name: from_product_id, type: string, source: system, default: null, description: "FK -> Product.id; snapshot of line.last_product_id at creation; null when line never ran" }
      - { name: to_product_id, type: string, source: input, description: "FK -> Product.id; next product to run" }
      - { name: required_clean_level, type: enum, source: computed, description: "RINSE | WASH | ALLERGEN_CIP per changeover_matrix calculation" }
      - { name: duration_minutes, type: integer, source: computed, description: "30 | 90 | 240 per required_clean_level" }
      - { name: status, type: enum, source: system, default: REQUIRED, description: "REQUIRED | AWAITING_VERIFICATION | VERIFIED | CONSUMED" }
      - { name: completed_by, type: string, source: system, default: null, description: "X-User-ID of LineOperator who completed the clean" }
      - { name: verified_by, type: string, source: system, default: null, description: "X-User-ID of QAManager who verified; MUST differ from completed_by" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: run_code, type: string, source: input, description: "Unique run code" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: line_id, type: string, source: input, description: "FK -> Line.id; line.format must equal product.format" }
      - { name: planned_units, type: integer, source: input, description: "> 0" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start instant; mix expiry validated against it" }
      - { name: mix_batch_id, type: string, source: system, default: null, description: "FK -> MixBatch.id; set by assign-mix" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | MIX_ASSIGNED | IN_PRODUCTION | ON_HOLD | COMPLETED | CANCELED" }
      - { name: actual_units, type: integer, source: input, default: null, description: "Provided at complete; > 0" }
      - { name: mix_metered_litres, type: number, source: input, default: null, description: "Flow-meter litres at complete; > 0 and <= batch litres_remaining" }
      - { name: mix_litres_theoretical, type: number, source: computed, default: null, description: "Standard-cost usage at target overrun; 2dp round_half_up" }
      - { name: overrun_actual_pct, type: number, source: computed, default: null, description: "Overrun implied by metered litres; 2dp round_half_up" }
      - { name: mix_cost_variance_cents, type: integer, source: computed, default: null, description: "theoretical cost - metered cost at MIX_COST_CENTS_PER_LITRE; positive = used less mix than standard" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical clock at complete; lot produced_at" }

  - name: Tunnel
    parent: null
    common_fields: true
    fields:
      - { name: tunnel_code, type: string, source: input, description: "Unique hardening tunnel code" }
      - { name: max_units_per_hour, type: integer, source: input, description: "Tunnel throughput capacity; > 0" }

  - name: TunnelBooking
    parent: null
    common_fields: true
    fields:
      - { name: tunnel_id, type: string, source: input, description: "FK -> Tunnel.id" }
      - { name: run_id, type: string, source: input, description: "FK -> ProductionRun.id; run must be SCHEDULED or MIX_ASSIGNED" }
      - { name: start_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (exclusive); must be > start_at" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | COMPLETED | CANCELED | EXPIRED" }

  - name: FreezerZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique freezer zone code" }
      - { name: pallet_capacity, type: integer, source: input, description: "Max pallets stored; > 0" }
      - { name: occupied_pallets, type: integer, source: computed, default: 0, description: "Sum of per-lot pallets for lots with status AVAILABLE or QUARANTINED whose occupancy window covers the current logical day" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: system, description: "Server-minted lot code: LOT-<run_code>" }
      - { name: run_id, type: string, source: system, description: "FK -> ProductionRun.id; producing run" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; denormalized from run at completion" }
      - { name: zone_id, type: string, source: system, description: "FK -> FreezerZone.id; provided at run complete" }
      - { name: units_produced, type: integer, source: system, description: "= run.actual_units" }
      - { name: units_available, type: integer, source: computed, description: "Unreserved, unshipped, undestroyed units" }
      - { name: units_reserved, type: integer, source: computed, description: "Units under ACTIVE allocations" }
      - { name: units_shipped, type: integer, source: computed, description: "Units under FULFILLED allocations" }
      - { name: units_destroyed, type: integer, source: computed, default: 0, description: "Units destroyed at DESTROYED transition" }
      - { name: pallets, type: integer, source: computed, description: "ceil((units_available + units_reserved) / product.units_per_pallet); per-lot rounding feeds zone occupancy" }
      - { name: produced_at, type: datetime, source: system, description: "= run.completed_at" }
      - { name: best_before, type: datetime, source: system, description: "produced_at + product.shelf_life_days" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | QUARANTINED | DESTROYED | EXPIRED" }
      - { name: quarantined_by, type: string, source: system, default: null, description: "X-User-ID who quarantined; segregation-of-duties key for release" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: shipment_code, type: string, source: input, description: "Unique shipment code" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; consignee" }
      - { name: contract_id, type: string, source: input, default: null, description: "FK -> CoPackContract.id; optional; when present contract must be ACTIVE and allocation products must match contract.product_id" }
      - { name: carrier_liability, type: boolean, source: input, default: false, description: "True => temp-abuse claims pay out under the CARRIER variant" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | LOADED | IN_TRANSIT | DELIVERED | REJECTED" }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "Sum of units on ACTIVE allocations" }
      - { name: dispatched_at, type: datetime, source: system, default: null, description: "Logical clock at dispatch" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical clock at deliver or reject; temperature replay window ends here" }

  - name: ShipmentAllocation
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id" }
      - { name: units, type: integer, source: input, description: "> 0; must be <= lot.units_available at creation" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RELEASED | FULFILLED" }
      - { name: release_reason, type: enum, source: system, default: null, description: "MANUAL | COMPLAINT_CASCADE | SHIPMENT_REJECTED" }

  - name: TempReading
    parent: null
    common_fields: false
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; append-only temperature logger event" }
      - { name: recorded_at, type: datetime, source: input, description: "Logger timestamp" }
      - { name: temp_c, type: number, source: input, description: "Cargo temperature in Celsius" }

  - name: TempAbuseClaim
    parent: null
    common_fields: true
    fields:
      - { name: claim_code, type: string, source: input, description: "Unique claim code" }
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; shipment must be DELIVERED or REJECTED" }
      - { name: filed_by_customer_id, type: string, source: system, description: "FK -> Customer.id; = X-User-ID of filing CustomerRep; must equal shipment.customer_id" }
      - { name: declared_value_cents, type: integer, source: input, description: "Claimed cargo value; > 0" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | EVIDENCE_REVIEW | APPROVED | PAID | DENIED | APPEALED | WITHDRAWN" }
      - { name: abuse_minutes, type: integer, source: computed, default: null, description: "Replayed minutes with temp_c strictly > -18.0; computed at open-review" }
      - { name: peak_temp_c, type: number, source: computed, default: null, description: "Max temp_c over in-window readings" }
      - { name: heat_shock_events, type: integer, source: computed, default: null, description: "Count of upward crossings of -12.0 across consecutive in-window readings" }
      - { name: payout_standard_cents, type: integer, source: computed, default: null, description: "STANDARD variant payout; computed at open-review" }
      - { name: payout_carrier_cents, type: integer, source: computed, default: null, description: "CARRIER variant payout; computed at open-review" }
      - { name: payout_variant, type: enum, source: system, default: null, description: "STANDARD | CARRIER; selected at approve from shipment.carrier_liability" }
      - { name: payout_cents, type: integer, source: computed, default: null, description: "Final payout; set at approve to the selected variant value" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical clock at approve/deny; appeal window anchor" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical clock at pay" }

  - name: QualityComplaint
    parent: null
    common_fields: true
    fields:
      - { name: complaint_code, type: string, source: input, description: "Unique complaint code" }
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id; complained lot" }
      - { name: customer_id, type: string, source: system, default: null, description: "FK -> Customer.id; set from X-User-ID when filed by CustomerRep; null for QA-internal filings" }
      - { name: complaint_type, type: enum, source: input, description: "HEAT_SHOCK | TEXTURE | SHELF_LIFE_SHORTFALL | FOREIGN_MATERIAL" }
      - { name: status, type: enum, source: system, default: UNDER_REVIEW, description: "UNDER_REVIEW | LAB_TEST | DISPOSITIONED_SUBSTANTIATED | CLOSED_UNFOUNDED | WITHDRAWN" }
      - { name: measured_ice_crystal_um, type: number, source: system, default: null, description: "Lab result; recorded via record-lab-result" }
      - { name: lab_cycle_count, type: integer, source: system, default: 0, description: "Number of send-to-lab cycles; hard cap 3" }
      - { name: disposition_rationale, type: string, source: input, default: null, description: "Optional free text at disposition" }

  - name: SeasonalBuildPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Unique plan code" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: zone_id, type: string, source: input, description: "FK -> FreezerZone.id; build destination" }
      - { name: production_week_start, type: string, source: input, description: "ISO date of build week Monday" }
      - { name: sale_week_start, type: string, source: input, description: "ISO date of intended sale week Monday" }
      - { name: target_units, type: integer, source: input, description: "> 0" }
      - { name: required_pallets, type: integer, source: computed, description: "ceil(target_units / product.units_per_pallet)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | APPROVED | CANCELED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    field: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /products/{id}/discontinue"
        actor: PlantManager
        preconditions:
          - "product.status == ACTIVE"
        side_effects:
          - "increments Product.version by 1"
        note: "DISCONTINUED products cannot be referenced by new runs, plans, changeovers, or contract approvals."

  - entity: CoPackContract
    field: status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /co-pack-contracts/{id}/submit"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == contract.customer_id (ownership)"
        side_effects: ["increments CoPackContract.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /co-pack-contracts/{id}/approve"
        actor: PlantManager
        preconditions:
          - "product.status == ACTIVE"
          - "product.co_pack_only == true"
        side_effects:
          - "sets pinned_product_version = Product.version at approval instant"
          - "increments CoPackContract.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "system (logical clock advance: now >= contract.start_date)"
        actor: system
        preconditions:
          - "current logical UTC date >= contract.start_date"
        side_effects: ["increments CoPackContract.version by 1"]
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (delivery cascade: contract.delivered_units >= contract.committed_units after a shipment deliver)"
        actor: system
        preconditions:
          - "delivered_units >= committed_units (>= boundary: exact equality fulfills)"
        side_effects: ["increments CoPackContract.version by 1"]
      - from: [DRAFT, SUBMITTED]
        to: CANCELED
        trigger: "POST /co-pack-contracts/{id}/cancel"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "shortfall_penalty_cents stays null"
          - "increments CoPackContract.version by 1"
      - from: [APPROVED, ACTIVE]
        to: CANCELED
        trigger: "POST /co-pack-contracts/{id}/cancel"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "computes shortfall_penalty_cents via contract_shortfall_penalty when delivered_units < committed_units; 0 when delivered >= committed"
          - "increments CoPackContract.version by 1"

  - entity: MixBatch
    field: status
    initial_state: PLANNED
    terminal_states: [CONSUMED, REJECTED, EXPIRED]
    transitions:
      - from: PLANNED
        to: PASTEURIZED
        trigger: "POST /mix-batches/{id}/pasteurize"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "sets produced_at = current logical clock; expires_at = produced_at + 72h; pasteurized_by = X-User-ID"
          - "increments MixBatch.version by 1"
      - from: PASTEURIZED
        to: RELEASED
        trigger: "POST /mix-batches/{id}/release"
        actor: QAManager
        preconditions:
          - "X-User-ID != batch.pasteurized_by (segregation of duties)"
          - "current logical clock < batch.expires_at"
        side_effects:
          - "sets released_by = X-User-ID"
          - "increments MixBatch.version by 1"
      - from: [PASTEURIZED, RELEASED]
        to: REJECTED
        trigger: "POST /mix-batches/{id}/reject"
        actor: QAManager
        preconditions: []
        side_effects:
          - "litres_wasted = litres_produced - litres_consumed; litres_remaining becomes 0 (mix_litres_conservation)"
          - "increments MixBatch.version by 1"
      - from: RELEASED
        to: CONSUMED
        trigger: "system (at run complete: litres_remaining == 0 after consumption)"
        actor: system
        preconditions: ["litres_remaining == 0 exactly (2dp)"]
        side_effects: ["increments MixBatch.version by 1"]
      - from: RELEASED
        to: EXPIRED
        trigger: "system (logical clock advance: now >= expires_at)"
        actor: system
        preconditions: ["now >= expires_at"]
        side_effects:
          - "litres_wasted = litres_produced - litres_consumed; litres_remaining becomes 0"
          - "increments MixBatch.version by 1"

  - entity: Line
    field: status
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: CLEANING
        trigger: "POST /changeovers (creation on this line)"
        actor: system
        preconditions: []
        side_effects: ["increments Line.version by 1"]
      - from: CLEANING
        to: IDLE
        trigger: "POST /changeovers/{id}/verify with outcome PASS"
        actor: system
        preconditions: []
        side_effects: ["increments Line.version by 1"]
      - from: IDLE
        to: RUNNING
        trigger: "POST /production-runs/{id}/start on this line"
        actor: system
        preconditions: []
        side_effects: ["increments Line.version by 1"]
      - from: RUNNING
        to: IDLE
        trigger: "POST /production-runs/{id}/complete or /cancel (from ON_HOLD) on this line"
        actor: system
        preconditions: []
        side_effects:
          - "on complete only: last_product_id = run.product_id; last_allergens = product.allergens snapshot"
          - "increments Line.version by 1"

  - entity: Changeover
    field: status
    initial_state: REQUIRED
    terminal_states: [CONSUMED]
    transitions:
      - from: REQUIRED
        to: AWAITING_VERIFICATION
        trigger: "POST /changeovers/{id}/complete"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "sets completed_by = X-User-ID"
          - "increments Changeover.version by 1"
      - from: AWAITING_VERIFICATION
        to: VERIFIED
        trigger: "POST /changeovers/{id}/verify with outcome=PASS"
        actor: QAManager
        preconditions:
          - "X-User-ID != changeover.completed_by (segregation of duties)"
        side_effects:
          - "sets verified_by; line.status CLEANING -> IDLE"
          - "increments Changeover.version by 1"
      - from: AWAITING_VERIFICATION
        to: REQUIRED
        trigger: "POST /changeovers/{id}/verify with outcome=FAIL"
        actor: QAManager
        preconditions:
          - "X-User-ID != changeover.completed_by (segregation of duties)"
        side_effects:
          - "clears completed_by; line stays CLEANING (redo loop)"
          - "increments Changeover.version by 1"
        note: "REQUIRED -> AWAITING_VERIFICATION -> REQUIRED cycle allows unlimited cleaning retries."
      - from: VERIFIED
        to: CONSUMED
        trigger: "system (a production run starts against this changeover)"
        actor: system
        preconditions: []
        side_effects: ["increments Changeover.version by 1"]

  - entity: ProductionRun
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: SCHEDULED
        to: MIX_ASSIGNED
        trigger: "POST /production-runs/{id}/assign-mix"
        actor: ProductionPlanner
        preconditions:
          - "mix_batch.status == RELEASED"
          - "mix_batch.product_id == run.product_id"
          - "mix_batch.expires_at > run.scheduled_start (strictly)"
        side_effects: ["sets mix_batch_id", "increments ProductionRun.version by 1"]
      - from: MIX_ASSIGNED
        to: IN_PRODUCTION
        trigger: "POST /production-runs/{id}/start"
        actor: LineOperator
        preconditions:
          - "mix_batch.status == RELEASED and current logical clock < mix_batch.expires_at"
          - "exists a Changeover on run.line_id with to_product_id == run.product_id and status == VERIFIED"
          - "exists a TunnelBooking with run_id == run.id and status == BOOKED"
          - "line.status == IDLE"
        side_effects:
          - "that changeover VERIFIED -> CONSUMED"
          - "line.status IDLE -> RUNNING"
          - "increments ProductionRun.version by 1"
      - from: IN_PRODUCTION
        to: ON_HOLD
        trigger: "POST /production-runs/{id}/hold"
        actor: QAManager
        preconditions: []
        side_effects: ["increments ProductionRun.version by 1"]
      - from: ON_HOLD
        to: IN_PRODUCTION
        trigger: "POST /production-runs/{id}/resume"
        actor: QAManager
        preconditions: []
        side_effects: ["increments ProductionRun.version by 1"]
        note: "IN_PRODUCTION <-> ON_HOLD hold/rework loop; unlimited cycles."
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /production-runs/{id}/complete"
        actor: LineOperator
        preconditions:
          - "mix_metered_litres <= mix_batch.litres_remaining"
          - "zone day-aggregate capacity check passes for the new lot (freezer_zone_capacity)"
        side_effects:
          - "runs overrun_mix_usage calculation: sets mix_litres_theoretical, overrun_actual_pct, mix_cost_variance_cents, completed_at"
          - "creates InventoryLot (lot_code LOT-<run_code>, units_produced = actual_units, produced_at = completed_at, best_before = completed_at + product.shelf_life_days)"
          - "mix_batch.litres_consumed += mix_metered_litres; if litres_remaining == 0 then batch -> CONSUMED"
          - "this run's BOOKED TunnelBookings -> COMPLETED"
          - "line.status RUNNING -> IDLE; line.last_product_id = run.product_id; line.last_allergens snapshot"
          - "increments ProductionRun.version by 1"
      - from: [SCHEDULED, MIX_ASSIGNED, ON_HOLD]
        to: CANCELED
        trigger: "POST /production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "this run's BOOKED TunnelBookings -> CANCELED"
          - "from ON_HOLD only: line.status RUNNING -> IDLE (no last_product update; no lot created)"
          - "from MIX_ASSIGNED: mix_batch_id cleared to null (no litres consumed)"
          - "increments ProductionRun.version by 1"

  - entity: TunnelBooking
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELED, EXPIRED]
    transitions:
      - from: BOOKED
        to: CANCELED
        trigger: "POST /tunnel-bookings/{id}/cancel or system (owning run canceled)"
        actor: "ProductionPlanner or system"
        preconditions: []
        side_effects: ["increments TunnelBooking.version by 1"]
      - from: BOOKED
        to: COMPLETED
        trigger: "system (owning run completed)"
        actor: system
        preconditions: []
        side_effects: ["increments TunnelBooking.version by 1"]
      - from: BOOKED
        to: EXPIRED
        trigger: "system (logical clock advance: now > end_at while owning run not IN_PRODUCTION)"
        actor: system
        preconditions: ["now > end_at", "owning run.status not in {IN_PRODUCTION, ON_HOLD}"]
        side_effects: ["increments TunnelBooking.version by 1"]

  - entity: InventoryLot
    field: status
    initial_state: AVAILABLE
    terminal_states: [DESTROYED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /inventory-lots/{id}/quarantine or system (complaint substantiation cascade)"
        actor: "QAManager or system"
        preconditions: []
        side_effects:
          - "sets quarantined_by = X-User-ID (manual) or 'system' (cascade)"
          - "cascade link 1 of complaint_substantiation_cascade: each ACTIVE ShipmentAllocation on this lot -> RELEASED (release_reason COMPLAINT_CASCADE); units_reserved -> units_available"
          - "cascade link 2: each shipment losing an allocation recomputes allocated_units; a LOADED shipment with any allocation released regresses LOADED -> PLANNED"
          - "increments InventoryLot.version by 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /inventory-lots/{id}/release-quarantine"
        actor: QAManager
        preconditions:
          - "X-User-ID != lot.quarantined_by (segregation of duties)"
          - "no QualityComplaint on any lot with the same run_id in status UNDER_REVIEW or LAB_TEST"
        side_effects: ["increments InventoryLot.version by 1"]
      - from: QUARANTINED
        to: DESTROYED
        trigger: "POST /inventory-lots/{id}/destroy"
        actor: QAManager
        preconditions: []
        side_effects:
          - "units_destroyed += units_available; units_available = 0 (lot_units_conservation)"
          - "increments InventoryLot.version by 1"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (logical clock advance: now >= best_before)"
        actor: system
        preconditions: ["now >= best_before"]
        side_effects:
          - "system-releases any ACTIVE allocations (release_reason MANUAL semantics do not apply; release_reason stays null for system expiry)"
          - "increments InventoryLot.version by 1"

  - entity: Shipment
    field: status
    initial_state: PLANNED
    terminal_states: [DELIVERED, REJECTED]
    transitions:
      - from: PLANNED
        to: LOADED
        trigger: "POST /shipments/{id}/load"
        actor: WarehouseLead
        preconditions: ["shipment.allocated_units > 0"]
        side_effects: ["increments Shipment.version by 1"]
      - from: LOADED
        to: PLANNED
        trigger: "system (complaint cascade released an allocation on a LOADED shipment)"
        actor: system
        preconditions: []
        side_effects: ["increments Shipment.version by 1"]
      - from: LOADED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/dispatch"
        actor: WarehouseLead
        preconditions: []
        side_effects: ["sets dispatched_at = current logical clock", "increments Shipment.version by 1"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: WarehouseLead
        preconditions: []
        side_effects:
          - "sets closed_at = current logical clock"
          - "each ACTIVE allocation -> FULFILLED; for each: lot.units_reserved -= units; lot.units_shipped += units"
          - "if shipment.contract_id: contract.delivered_units += sum(allocation units); if delivered_units >= committed_units contract ACTIVE -> FULFILLED (contract_fulfillment)"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /shipments/{id}/reject"
        actor: WarehouseLead
        preconditions: []
        side_effects:
          - "sets closed_at = current logical clock"
          - "each ACTIVE allocation -> RELEASED (release_reason SHIPMENT_REJECTED); lot.units_reserved -> units_available"
          - "increments Shipment.version by 1"

  - entity: ShipmentAllocation
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED, FULFILLED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /shipment-allocations/{id}/release or system (complaint cascade / shipment reject / lot expiry)"
        actor: "WarehouseLead or system"
        preconditions:
          - "manual release only: shipment.status == PLANNED"
        side_effects:
          - "lot.units_reserved -= units; lot.units_available += units; shipment.allocated_units -= units"
          - "increments ShipmentAllocation.version by 1"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (shipment delivered)"
        actor: system
        preconditions: []
        side_effects: ["increments ShipmentAllocation.version by 1"]

  - entity: TempAbuseClaim
    field: status
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED, WITHDRAWN]
    transitions:
      - from: [SUBMITTED, APPEALED]
        to: EVIDENCE_REVIEW
        trigger: "POST /temp-abuse-claims/{id}/open-review"
        actor: ClaimsAdjuster
        preconditions:
          - "shipment has >= 2 TempReadings"
        side_effects:
          - "runs temperature_replay: sets abuse_minutes, peak_temp_c, heat_shock_events"
          - "runs claim_payout for BOTH variants: sets payout_standard_cents, payout_carrier_cents"
          - "increments TempAbuseClaim.version by 1"
      - from: EVIDENCE_REVIEW
        to: APPROVED
        trigger: "POST /temp-abuse-claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "payout_variant = CARRIER if shipment.carrier_liability else STANDARD; payout_cents = selected variant payout"
          - "sets decided_at = current logical clock"
          - "increments TempAbuseClaim.version by 1"
      - from: EVIDENCE_REVIEW
        to: DENIED
        trigger: "POST /temp-abuse-claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["sets decided_at", "increments TempAbuseClaim.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /temp-abuse-claims/{id}/pay"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["sets paid_at", "increments TempAbuseClaim.version by 1"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /temp-abuse-claims/{id}/appeal"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == claim.filed_by_customer_id (ownership)"
          - "current logical clock <= decided_at + 14 days (inclusive boundary)"
        side_effects: ["increments TempAbuseClaim.version by 1"]
        note: "DENIED -> APPEALED -> EVIDENCE_REVIEW cycle; unlimited appeals."
      - from: [SUBMITTED, EVIDENCE_REVIEW]
        to: WITHDRAWN
        trigger: "POST /temp-abuse-claims/{id}/withdraw"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == claim.filed_by_customer_id (ownership)"
        side_effects: ["increments TempAbuseClaim.version by 1"]

  - entity: QualityComplaint
    field: status
    initial_state: UNDER_REVIEW
    terminal_states: [DISPOSITIONED_SUBSTANTIATED, CLOSED_UNFOUNDED, WITHDRAWN]
    transitions:
      - from: UNDER_REVIEW
        to: LAB_TEST
        trigger: "POST /quality-complaints/{id}/send-to-lab"
        actor: QAManager
        preconditions:
          - "lab_cycle_count < 3 (cap; 4th send rejected)"
        side_effects:
          - "lab_cycle_count += 1"
          - "increments QualityComplaint.version by 1"
      - from: LAB_TEST
        to: UNDER_REVIEW
        trigger: "POST /quality-complaints/{id}/record-lab-result"
        actor: QAManager
        preconditions:
          - "measured_ice_crystal_um present in request when complaint_type == HEAT_SHOCK"
        side_effects:
          - "sets measured_ice_crystal_um (when provided)"
          - "increments QualityComplaint.version by 1"
        note: "UNDER_REVIEW <-> LAB_TEST retest cycle, bounded by lab_cycle_count <= 3."
      - from: UNDER_REVIEW
        to: DISPOSITIONED_SUBSTANTIATED
        trigger: "POST /quality-complaints/{id}/disposition with outcome=SUBSTANTIATED"
        actor: QAManager
        preconditions:
          - "when complaint_type == HEAT_SHOCK: measured_ice_crystal_um is not null (ERR_LAB_RESULT_REQUIRED)"
          - "when complaint_type == HEAT_SHOCK: measured_ice_crystal_um strictly > format threshold (NOVELTY 120, BULK 150) per heat_shock_index"
        side_effects:
          - "cascade: every InventoryLot with run_id == complaint.lot.run_id and status AVAILABLE -> QUARANTINED (quarantined_by = X-User-ID)"
          - "each quarantined lot's ACTIVE allocations -> RELEASED (COMPLAINT_CASCADE); affected LOADED shipments regress to PLANNED"
          - "increments QualityComplaint.version by 1"
      - from: UNDER_REVIEW
        to: CLOSED_UNFOUNDED
        trigger: "POST /quality-complaints/{id}/disposition with outcome=UNFOUNDED"
        actor: QAManager
        preconditions: []
        side_effects: ["increments QualityComplaint.version by 1"]
      - from: [UNDER_REVIEW, LAB_TEST]
        to: WITHDRAWN
        trigger: "POST /quality-complaints/{id}/withdraw"
        actor: "CustomerRep (only when customer_id == X-User-ID) or QAManager"
        preconditions: []
        side_effects: ["increments QualityComplaint.version by 1"]

  - entity: SeasonalBuildPlan
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /seasonal-build-plans/{id}/approve"
        actor: PlantManager
        preconditions:
          - "shelf_life_window: (sale_week_start - production_week_start).days + MIN_REMAINING_SHELF_DAYS(30) <= product.shelf_life_days (inclusive: equality passes)"
          - "zone week capacity: sum(required_pallets of APPROVED plans, same zone_id, same production_week_start) + this.required_pallets <= zone.pallet_capacity"
        side_effects: ["increments SeasonalBuildPlan.version by 1"]
      - from: [DRAFT, APPROVED]
        to: CANCELED
        trigger: "POST /seasonal-build-plans/{id}/cancel"
        actor: PlantManager
        preconditions: []
        side_effects: ["increments SeasonalBuildPlan.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; both pass the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: product-reformulation-stale-version
    parent_entity: Product
    write_endpoint: "POST /products/{id}/reformulations"
    occ_field: "expected_product_version"
    description: |
      Creating a reformulation of a Product whose version has advanced since the
      client last observed it is rejected. A prior reformulation (or any spec
      PATCH) legitimately changes the product's lineage/spec, so a stale writer
      is superseding out-of-date terms and must re-read before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-amend-stale-version
    parent_entity: CoPackContract
    write_endpoint: "POST /co-pack-contracts/{id}/amend"
    occ_field: "expected_contract_version"
    description: |
      Amending a CoPackContract whose version has advanced since the client last
      observed it is rejected. A prior amend legitimately supersedes the contract
      terms the client based its amendment on, so the stale writer must re-read
      before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: overrun_mix_usage
    trigger: "ProductionRun complete (POST /production-runs/{id}/complete)"
    algorithm: weighted_scoring
    formula: |
      # STANDARD (theoretical) variant — uses target overrun
      mix_litres_theoretical = actual_units * fill_volume_ml_per_unit / (1 + target_overrun_pct / 100) / 1000
      # ACTUAL (metered) variant — uses the flow meter reading supplied at complete
      mix_litres_actual = mix_metered_litres
      overrun_actual_pct = (actual_units * fill_volume_ml_per_unit / (mix_metered_litres * 1000) - 1) * 100
      theoretical_cost_cents = round_half_up(mix_litres_theoretical * MIX_COST_CENTS_PER_LITRE, 0)
      actual_cost_cents      = round_half_up(mix_litres_actual      * MIX_COST_CENTS_PER_LITRE, 0)
      mix_cost_variance_cents = theoretical_cost_cents - actual_cost_cents
    input_set: "The completing ProductionRun and its Product (any product status; the run is already in progress)."
    constants:
      MIX_COST_CENTS_PER_LITRE: 85
    precision: "mix_litres_theoretical and overrun_actual_pct: 2 decimal places, round_half_up; costs rounded to integer cents half-up AFTER the litre multiplication"
    variants:
      - name: standard_cost
        when: "Costing at target overrun (budget/standard cost view)"
        difference: "Uses product.target_overrun_pct; ignores the meter reading; yields mix_litres_theoretical"
      - name: actual_cost
        when: "Costing from the flow meter (actuals view)"
        difference: "Uses mix_metered_litres; yields a different litre figure and therefore a different cost whenever actual overrun != target overrun"

  - name: changeover_matrix
    trigger: "Changeover creation (POST /changeovers)"
    algorithm: constraint_propagation
    formula: |
      if from_product_id is null:
          level = RINSE                                  # line never ran: sanitary rinse only
      elif not set(from.allergens) <= set(to.allergens):
          level = ALLERGEN_CIP                           # residue allergen NOT declared by target product
      elif from.flavor_family != to.flavor_family:
          level = WASH                                   # allergen-safe but flavor carryover risk
      else:
          level = RINSE
      duration_minutes = {RINSE: 30, WASH: 90, ALLERGEN_CIP: 240}[level]
    input_set: "Changeover.from_product_id (line's last completed product, may be null) and to_product."
    constants:
      RINSE_MINUTES: 30
      WASH_MINUTES: 90
      ALLERGEN_CIP_MINUTES: 240
    precision: "set containment is exact; no rounding"
    variants: []

  - name: tunnel_window_conflict
    trigger: "TunnelBooking creation (POST /tunnel-bookings)"
    algorithm: interval_merge
    formula: |
      # Half-open occupancy with a TRAILING cleanup buffer:
      # each existing non-CANCELED booking on the same tunnel occupies [start_at, end_at + TUNNEL_BUFFER_MINUTES).
      # Conflict iff NOT (new.end_at <= existing.start_at OR new.start_at >= existing.end_at + buffer).
      # Exact adjacency at new.start_at == existing.end_at + buffer is ALLOWED (>= boundary).
      conflict = any over existing bookings b on same tunnel with b.status in {BOOKED, COMPLETED}:
                   new.start_at < b.end_at + buffer AND b.start_at < new.end_at
      # Throughput check (separate error):
      duration_hours = (new.end_at - new.start_at) / 3600s
      capacity_ok = run.planned_units <= tunnel.max_units_per_hour * duration_hours   # <= boundary: exact equality allowed
    input_set: "All TunnelBookings on the same tunnel with status BOOKED or COMPLETED (CANCELED/EXPIRED excluded)."
    constants:
      TUNNEL_BUFFER_MINUTES: 30
    precision: "timestamps compared exactly to the second"
    variants: []

  - name: freezer_zone_capacity
    trigger: "ProductionRun complete (lot creation) and SeasonalBuildPlan approve (projected)"
    algorithm: interval_merge
    formula: |
      # Day-granular AGGREGATE capacity (NOT adjacency): a lot occupies its zone on every day d with
      # produced_date <= d < best_before_date (half-open on days).
      # For each day d in the new lot's window:
      #   sum(pallets of existing lots in zone with status in {AVAILABLE, QUARANTINED} covering d) + new_lot.pallets <= zone.pallet_capacity
      # pallets per lot = ceil((units_available + units_reserved) / product.units_per_pallet)   # per-lot ceil FIRST
      # zone occupancy = SUM of per-lot pallets (sum AFTER per-lot rounding — never ceil of summed units)
      pass = forall d: occupied(d) + new.pallets <= capacity
    input_set: "Existing lots in the zone with status AVAILABLE or QUARANTINED (DESTROYED/EXPIRED excluded); days are logical-clock UTC days."
    constants: {}
    precision: "integer pallets; ceil per lot, then sum (rounding order pinned: per-lot-then-sum)"
    variants: []

  - name: temperature_replay
    trigger: "TempAbuseClaim open-review (POST /temp-abuse-claims/{id}/open-review)"
    algorithm: chronological
    formula: |
      readings = shipment's TempReadings with shipment.dispatched_at <= recorded_at <= shipment.closed_at,
                 sorted by recorded_at ASC, tie-break created_at ASC   # never id
      abuse_minutes = 0
      for each consecutive pair (r_i, r_{i+1}):
          if r_i.temp_c > ABUSE_THRESHOLD_C: abuse_minutes += minutes(r_{i+1}.recorded_at - r_i.recorded_at)
      # final interval closes at shipment.closed_at
      if last.recorded_at < closed_at and last.temp_c > ABUSE_THRESHOLD_C:
          abuse_minutes += minutes(closed_at - last.recorded_at)
      peak_temp_c = max(temp_c over in-window readings)
      heat_shock_events = count of i where r_i.temp_c <= HEAT_SHOCK_THRESHOLD_C and r_{i+1}.temp_c > HEAT_SHOCK_THRESHOLD_C
    input_set: "Readings inside the transit window ONLY: shipment.dispatched_at <= recorded_at <= shipment.closed_at (pre-dispatch logger warm-up and post-closure late uploads both excluded). Readings at exactly -18.0 contribute ZERO abuse minutes (strictly-greater threshold); exactly -12.0 does not start a heat-shock crossing."
    constants:
      ABUSE_THRESHOLD_C: -18.0
      HEAT_SHOCK_THRESHOLD_C: -12.0
    precision: "abuse_minutes integer minutes (timestamps are whole minutes in fixtures); peak_temp_c 1 decimal"
    variants: []

  - name: claim_payout
    trigger: "TempAbuseClaim open-review (both variants computed); approve selects one"
    algorithm: tiered_pricing
    formula: |
      # STANDARD variant (tiered on abuse_minutes; tiers are marginal):
      #   minutes <= 30            -> 0
      #   30 < minutes <= 120      -> (minutes - 30) * 200
      #   minutes > 120            -> 90 * 200 + (minutes - 120) * 350
      #   then capped at declared_value_cents
      # CARRIER variant (carrier_liability shipments):
      #   abuse_minutes == 0       -> 0
      #   else max(0, abuse_minutes * 150 - CARRIER_DEDUCTIBLE_CENTS), capped at 0.80 * declared_value_cents
      # approve: payout_cents = payout_carrier_cents if shipment.carrier_liability else payout_standard_cents
    input_set: "claim.abuse_minutes and claim.declared_value_cents; shipment.carrier_liability selects the variant at approve."
    constants:
      STANDARD_FREE_MINUTES: 30
      STANDARD_LOW_TIER_MAX_MINUTES: 120
      STANDARD_RATE_LOW_CENTS_PER_MIN: 200
      STANDARD_RATE_HIGH_CENTS_PER_MIN: 350
      CARRIER_RATE_CENTS_PER_MIN: 150
      CARRIER_DEDUCTIBLE_CENTS: 5000
      CARRIER_CAP_PCT: 0.80
    precision: "integer cents; cap applied after tier computation (evaluation order pinned: tiers -> deductible -> cap)"
    variants:
      - name: standard
        when: "shipment.carrier_liability == false"
        difference: "Tiered marginal rates with a 30-minute free allowance; cap = full declared value"
      - name: carrier
        when: "shipment.carrier_liability == true"
        difference: "Flat per-minute rate from minute 1 minus a fixed deductible; cap = 80% of declared value; same abuse_minutes yields a different payout than standard"

  - name: contract_fulfillment
    trigger: "Shipment deliver (delivered_units update) and CoPackContract cancel (penalty)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED (breaks the circular-looking dependency):
      #   1. delivered_units = sum(units of FULFILLED allocations on shipments with contract_id == this contract)
      #   2. fulfillment_pct = round_half_up(delivered_units / committed_units * 100, 2)
      #   3. tier rate r keyed on fulfillment_pct: pct >= 90 -> 0.10 ; 50 <= pct < 90 -> 0.20 ; pct < 50 -> 0.35
      #   4. shortfall_penalty_cents = (committed_units - delivered_units) * unit_price_cents * r
      #      (0 when delivered_units >= committed_units)
      # Auto-transition: at deliver, if delivered_units >= committed_units then contract ACTIVE -> FULFILLED.
    input_set: "Shipments with contract_id == contract.id and status DELIVERED (REJECTED/PLANNED/LOADED/IN_TRANSIT excluded — REJECTED shipments' allocations were RELEASED so they contribute 0)."
    constants:
      TIER_HIGH_MIN_PCT: 90
      TIER_MID_MIN_PCT: 50
      RATE_HIGH: 0.10
      RATE_MID: 0.20
      RATE_LOW: 0.35
    precision: "fulfillment_pct 2 decimal places round_half_up; penalty integer cents (unit arithmetic is exact)"
    variants: []

  - name: heat_shock_index
    trigger: "QualityComplaint disposition with outcome=SUBSTANTIATED (enforcement gate)"
    algorithm: threshold
    formula: |
      limit = HEAT_SHOCK_ICE_CRYSTAL_LIMIT_UM[complaint.lot.product.format]   # NOVELTY: 120, BULK: 150
      substantiable = measured_ice_crystal_um is not null AND measured_ice_crystal_um > limit
      # exactly == limit is NOT substantiable (strictly-greater boundary)
    input_set: "The complaint's measured_ice_crystal_um and the lot's product format."
    constants:
      HEAT_SHOCK_ICE_CRYSTAL_LIMIT_UM_NOVELTY: 120
      HEAT_SHOCK_ICE_CRYSTAL_LIMIT_UM_BULK: 150
    precision: "1 decimal micron comparison"
    variants: []

  - name: shelf_life_window
    trigger: "SeasonalBuildPlan approve"
    algorithm: threshold
    formula: |
      days_between = (sale_week_start - production_week_start) in whole days
      pass = days_between + MIN_REMAINING_SHELF_DAYS <= product.shelf_life_days   # inclusive: equality passes
    input_set: "The plan's week dates and the product's shelf_life_days."
    constants:
      MIN_REMAINING_SHELF_DAYS: 30
    precision: "whole days"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates multiple rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: existence
    check: "Body-supplied FK references (product_id, line_id, mix_batch_id, customer_id, contract_id, tunnel_id, run_id, lot_id, zone_id, shipment_id, to_product_id) resolve to existing resources"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body FK fields"
  - priority: 5
    category: business_constraint
    check: "Required fields present; types correct; enum values in declared sets; quantities > 0 where declared; end_at > start_at; end_date > start_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: state
    check: "Target resource is in a from-state that allows the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (state-machine transitions)"
  - priority: 7
    category: auth
    check: "Ownership: CustomerRep X-User-ID equals the acted resource's customer (contract submit; claim appeal/withdraw; complaint withdraw; claim filing against own shipments only)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /co-pack-contracts/{id}/submit, POST /temp-abuse-claims, POST /temp-abuse-claims/{id}/appeal, POST /temp-abuse-claims/{id}/withdraw, POST /quality-complaints/{id}/withdraw"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: mix releaser != pasteurizer; changeover verifier != completer; lot release-quarantine caller != quarantined_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mix-batches/{id}/release, POST /changeovers/{id}/verify, POST /inventory-lots/{id}/release-quarantine"
  - priority: 9
    category: business_safety
    check: "Allergen control: at run start, a VERIFIED changeover to the run's product must exist on the line"
    error_id: ERR_ALLERGEN_CLEAN_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /production-runs/{id}/start"
  - priority: 10
    category: business_safety
    check: "Mix batch status == RELEASED for assign/start"
    error_id: ERR_MIX_NOT_RELEASED
    http_status: 422
    applies_to: "POST /production-runs/{id}/assign-mix, POST /production-runs/{id}/start"
  - priority: 11
    category: business_safety
    check: "Mix product matches run product"
    error_id: ERR_MIX_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /production-runs/{id}/assign-mix"
  - priority: 12
    category: business_safety
    check: "Mix not expired: at assign, expires_at > run.scheduled_start (strict); at start, now < expires_at"
    error_id: ERR_MIX_EXPIRED
    http_status: 422
    applies_to: "POST /production-runs/{id}/assign-mix, POST /production-runs/{id}/start"
  - priority: 13
    category: business_constraint
    check: "line.format == product.format for runs; to_product.format == line.format for changeovers"
    error_id: ERR_LINE_FORMAT_MISMATCH
    http_status: 422
    applies_to: "POST /production-runs, POST /changeovers"
  - priority: 14
    category: business_constraint
    check: "Changeover creation requires line.status == IDLE (no run in flight, no other open changeover)"
    error_id: ERR_CHANGEOVER_SEQUENCE
    http_status: 422
    applies_to: "POST /changeovers (line not IDLE or re-sequenced)"
  - priority: 15
    category: business_temporal
    check: "Tunnel booking window does not conflict with existing BOOKED/COMPLETED bookings on same tunnel (trailing 30-minute buffer, half-open)"
    error_id: ERR_TUNNEL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /tunnel-bookings"
  - priority: 16
    category: business_temporal
    check: "Tunnel throughput: run.planned_units <= tunnel.max_units_per_hour * window hours"
    error_id: ERR_TUNNEL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /tunnel-bookings"
  - priority: 17
    category: business_referential
    check: "Booking references a run in status SCHEDULED or MIX_ASSIGNED"
    error_id: ERR_RUN_NOT_SCHEDULABLE
    http_status: 422
    applies_to: "POST /tunnel-bookings"
  - priority: 18
    category: business_temporal
    check: "Run already has a BOOKED booking (one active booking per run)"
    error_id: ERR_BOOKING_EXISTS
    http_status: 409
    applies_to: "POST /tunnel-bookings"
  - priority: 19
    category: business_temporal
    check: "Freezer zone day-aggregate pallet capacity (per-lot ceil then sum) for the lot's occupancy window"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /production-runs/{id}/complete, POST /seasonal-build-plans/{id}/approve"
  - priority: 20
    category: business_temporal
    check: "Build plan shelf-life window: (sale_week - production_week).days + 30 <= product.shelf_life_days"
    error_id: ERR_SHELF_LIFE_WINDOW
    http_status: 422
    applies_to: "POST /seasonal-build-plans/{id}/approve"
  - priority: 21
    category: business_temporal
    check: "Claim appeal within 14 days of decided_at (inclusive)"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /temp-abuse-claims/{id}/appeal"
  - priority: 22
    category: business_referential
    check: "Run start requires an existing BOOKED tunnel booking for the run"
    error_id: ERR_TUNNEL_BOOKING_REQUIRED
    http_status: 422
    applies_to: "POST /production-runs/{id}/start"
  - priority: 23
    category: business_referential
    check: "Allocation lot status == AVAILABLE and lot.best_before > now"
    error_id: ERR_LOT_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /shipments/{id}/allocations"
  - priority: 24
    category: business_referential
    check: "Allocation units <= lot.units_available"
    error_id: ERR_INSUFFICIENT_LOT_UNITS
    http_status: 422
    applies_to: "POST /shipments/{id}/allocations"
  - priority: 25
    category: business_referential
    check: "Shipment load requires allocated_units > 0"
    error_id: ERR_SHIPMENT_EMPTY
    http_status: 422
    applies_to: "POST /shipments/{id}/load"
  - priority: 26
    category: business_referential
    check: "Claim creation: shipment.status in {DELIVERED, REJECTED}"
    error_id: ERR_CLAIM_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /temp-abuse-claims"
  - priority: 27
    category: business_referential
    check: "No other claim for the same shipment in status SUBMITTED, EVIDENCE_REVIEW, APPEALED, or APPROVED"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /temp-abuse-claims"
  - priority: 28
    category: business_referential
    check: "Open-review requires >= 2 temperature readings on the shipment"
    error_id: ERR_INSUFFICIENT_READINGS
    http_status: 422
    applies_to: "POST /temp-abuse-claims/{id}/open-review"
  - priority: 29
    category: business_referential
    check: "Disposition of HEAT_SHOCK complaint requires a recorded measured_ice_crystal_um"
    error_id: ERR_LAB_RESULT_REQUIRED
    http_status: 422
    applies_to: "POST /quality-complaints/{id}/disposition"
  - priority: 30
    category: business_referential
    check: "SUBSTANTIATED disposition of HEAT_SHOCK requires measured_ice_crystal_um strictly > format limit (NOVELTY 120 / BULK 150)"
    error_id: ERR_HEAT_SHOCK_NOT_PROVEN
    http_status: 422
    applies_to: "POST /quality-complaints/{id}/disposition"
  - priority: 31
    category: business_referential
    check: "send-to-lab requires lab_cycle_count < 3"
    error_id: ERR_LAB_CYCLE_EXHAUSTED
    http_status: 409
    applies_to: "POST /quality-complaints/{id}/send-to-lab"
  - priority: 32
    category: business_referential
    check: "Lot release-quarantine blocked while any complaint on the same run is UNDER_REVIEW or LAB_TEST"
    error_id: ERR_COMPLAINT_STILL_OPEN
    http_status: 422
    applies_to: "POST /inventory-lots/{id}/release-quarantine"
  - priority: 33
    category: business_fiscal
    check: "Shipment with contract_id: contract.status == ACTIVE and contract.customer_id == shipment.customer_id"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /shipments, POST /shipments/{id}/allocations"
  - priority: 34
    category: business_fiscal
    check: "Allocation on a contract shipment: lot.product_id == contract.product_id"
    error_id: ERR_CONTRACT_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /shipments/{id}/allocations"
  - priority: 35
    category: business_fiscal
    check: "Run creation for a co_pack_only product requires an ACTIVE contract covering that product"
    error_id: ERR_COPACK_CONTRACT_REQUIRED
    http_status: 422
    applies_to: "POST /production-runs"
  - priority: 36
    category: business_fiscal
    check: "PATCH /products/{id} forbidden while any APPROVED or ACTIVE contract has pinned_product_version for this product"
    error_id: ERR_PRODUCT_VERSION_PINNED
    http_status: 409
    applies_to: "PATCH /products/{id}"
  - priority: 37
    category: business_fiscal
    check: "Run complete: mix_metered_litres <= mix_batch.litres_remaining"
    error_id: ERR_INSUFFICIENT_MIX
    http_status: 422
    applies_to: "POST /production-runs/{id}/complete"
  - priority: 38
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /products/{id}/reformulations, POST /co-pack-contracts/{id}/amend"
  - priority: 39
    category: business_referential
    check: "Referenced product must be ACTIVE for new runs, changeovers, and build plans"
    error_id: ERR_PRODUCT_DISCONTINUED
    http_status: 422
    applies_to: "POST /production-runs, POST /changeovers, POST /seasonal-build-plans"

# =============================================================================
# §1.5 API Endpoint Table
# (Roles shorthand note: GET list/detail endpoints are readable by every role.)
# =============================================================================
endpoints:
  # ---- Products ----
  - { method: POST, path: "/products", description: "Create a product (SKU master)", roles: [PlantManager], code: 201, input: [sku_code, product_name, format, flavor_family, allergens, fill_volume_ml_per_unit, target_overrun_pct, units_per_pallet, shelf_life_days, "co_pack_only?"], output: Product, side_effects: [] }
  - { method: GET, path: "/products", description: "List products with filters", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "format?", "status?", "flavor_family?", "predecessor_product_id?", "successor_product_id?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/products/{id}", description: "Get one product", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: Product, side_effects: [] }
  - { method: PATCH, path: "/products/{id}", description: "Edit product spec; forbidden while pinned by an APPROVED/ACTIVE contract", roles: [PlantManager], code: 200, input: ["product_name?", "flavor_family?", "allergens?", "fill_volume_ml_per_unit?", "target_overrun_pct?", "units_per_pallet?", "shelf_life_days?", "co_pack_only?"], output: Product, side_effects: ["increments Product.version by 1"] }
  - { method: POST, path: "/products/{id}/discontinue", description: "Discontinue a product", roles: [PlantManager], code: 200, input: [], output: Product, side_effects: ["Product ACTIVE -> DISCONTINUED", "increments Product.version by 1"] }
  - { method: POST, path: "/products/{id}/reformulations", description: "Create successor product (OCC-guarded); parent gains successor_product_id", roles: [PlantManager], code: 201, input: [expected_product_version, sku_code, product_name, format, flavor_family, allergens, fill_volume_ml_per_unit, target_overrun_pct, units_per_pallet, shelf_life_days, "co_pack_only?"], output: Product, side_effects: ["new Product predecessor_product_id = {id}", "parent Product.successor_product_id = new id", "increments Product.version by 1"] }

  # ---- Customers ----
  - { method: POST, path: "/customers", description: "Register a customer (private label or distributor)", roles: [PlantManager], code: 201, input: [customer_code, display_name, kind], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers", description: "List customers", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "kind?"], output: "Customer[]", side_effects: [] }

  # ---- Co-pack contracts ----
  - { method: POST, path: "/co-pack-contracts", description: "Create contract in DRAFT", roles: [PlantManager], code: 201, input: [contract_code, customer_id, product_id, committed_units, unit_price_cents, start_date, end_date], output: CoPackContract, side_effects: [] }
  - { method: GET, path: "/co-pack-contracts", description: "List contracts", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "customer_id?", "product_id?", "status?"], output: "CoPackContract[]", side_effects: [] }
  - { method: GET, path: "/co-pack-contracts/{id}", description: "Get one contract", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: CoPackContract, side_effects: [] }
  - { method: POST, path: "/co-pack-contracts/{id}/submit", description: "Customer submits DRAFT contract", roles: [CustomerRep], code: 200, input: [], output: CoPackContract, side_effects: ["DRAFT -> SUBMITTED", "increments CoPackContract.version by 1"] }
  - { method: POST, path: "/co-pack-contracts/{id}/approve", description: "Approve contract; pins product version", roles: [PlantManager], code: 200, input: [], output: CoPackContract, side_effects: ["SUBMITTED -> APPROVED", "sets pinned_product_version", "increments CoPackContract.version by 1"] }
  - { method: POST, path: "/co-pack-contracts/{id}/amend", description: "Amend APPROVED/ACTIVE contract terms (OCC-guarded)", roles: [PlantManager], code: 200, input: [expected_contract_version, "committed_units?", "unit_price_cents?", "end_date?"], output: CoPackContract, side_effects: ["applies supplied fields", "increments CoPackContract.version by 1"] }
  - { method: POST, path: "/co-pack-contracts/{id}/cancel", description: "Cancel contract; computes shortfall penalty from APPROVED/ACTIVE", roles: [PlantManager], code: 200, input: [], output: CoPackContract, side_effects: ["-> CANCELED", "computes shortfall_penalty_cents via contract_fulfillment when applicable", "increments CoPackContract.version by 1"] }

  # ---- Mix batches ----
  - { method: POST, path: "/mix-batches", description: "Create mix batch (PLANNED)", roles: [ProductionPlanner], code: 201, input: [batch_code, product_id, litres_produced], output: MixBatch, side_effects: [] }
  - { method: GET, path: "/mix-batches", description: "List mix batches", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "product_id?", "status?"], output: "MixBatch[]", side_effects: [] }
  - { method: GET, path: "/mix-batches/{id}", description: "Get one mix batch", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: MixBatch, side_effects: [] }
  - { method: POST, path: "/mix-batches/{id}/pasteurize", description: "Pasteurize batch; stamps produced_at/expires_at", roles: [LineOperator], code: 200, input: [], output: MixBatch, side_effects: ["PLANNED -> PASTEURIZED", "sets produced_at, expires_at, pasteurized_by", "increments MixBatch.version by 1"] }
  - { method: POST, path: "/mix-batches/{id}/release", description: "QA release (segregated from pasteurizer)", roles: [QAManager], code: 200, input: [], output: MixBatch, side_effects: ["PASTEURIZED -> RELEASED", "sets released_by", "increments MixBatch.version by 1"] }
  - { method: POST, path: "/mix-batches/{id}/reject", description: "QA reject; wastes remaining litres", roles: [QAManager], code: 200, input: [], output: MixBatch, side_effects: ["PASTEURIZED|RELEASED -> REJECTED", "litres_wasted per mix_litres_conservation", "increments MixBatch.version by 1"] }

  # ---- Lines ----
  - { method: POST, path: "/lines", description: "Register a production line", roles: [PlantManager], code: 201, input: [line_code, format, rate_units_per_hour], output: Line, side_effects: [] }
  - { method: GET, path: "/lines", description: "List lines", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "format?", "status?", "last_product_id?"], output: "Line[]", side_effects: [] }
  - { method: GET, path: "/lines/{id}", description: "Get one line", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: Line, side_effects: [] }

  # ---- Changeovers ----
  - { method: POST, path: "/changeovers", description: "Open a changeover on a line; computes required_clean_level via changeover_matrix; line IDLE -> CLEANING", roles: [ProductionPlanner], code: 201, input: [line_id, to_product_id], output: Changeover, side_effects: ["computes required_clean_level and duration_minutes", "line IDLE -> CLEANING", "snapshots from_product_id"] }
  - { method: GET, path: "/changeovers", description: "List changeovers", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "line_id?", "from_product_id?", "to_product_id?", "status?"], output: "Changeover[]", side_effects: [] }
  - { method: GET, path: "/changeovers/{id}", description: "Get one changeover", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: Changeover, side_effects: [] }
  - { method: POST, path: "/changeovers/{id}/complete", description: "Operator marks cleaning done", roles: [LineOperator], code: 200, input: [], output: Changeover, side_effects: ["REQUIRED -> AWAITING_VERIFICATION", "sets completed_by", "increments Changeover.version by 1"] }
  - { method: POST, path: "/changeovers/{id}/verify", description: "QA verifies (PASS -> VERIFIED, line IDLE; FAIL -> REQUIRED redo)", roles: [QAManager], code: 200, input: [outcome], output: Changeover, side_effects: ["AWAITING_VERIFICATION -> VERIFIED or REQUIRED", "on PASS: line CLEANING -> IDLE", "increments Changeover.version by 1"] }

  # ---- Production runs ----
  - { method: POST, path: "/production-runs", description: "Schedule a production run", roles: [ProductionPlanner], code: 201, input: [run_code, product_id, line_id, planned_units, scheduled_start], output: ProductionRun, side_effects: [] }
  - { method: GET, path: "/production-runs", description: "List production runs", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "product_id?", "line_id?", "mix_batch_id?", "status?"], output: "ProductionRun[]", side_effects: [] }
  - { method: GET, path: "/production-runs/{id}", description: "Get one production run", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: ProductionRun, side_effects: [] }
  - { method: POST, path: "/production-runs/{id}/assign-mix", description: "Assign a RELEASED mix batch to a SCHEDULED run", roles: [ProductionPlanner], code: 200, input: [mix_batch_id], output: ProductionRun, side_effects: ["SCHEDULED -> MIX_ASSIGNED", "sets mix_batch_id", "increments ProductionRun.version by 1"] }
  - { method: POST, path: "/production-runs/{id}/start", description: "Start the run (requires verified changeover + booked tunnel + live mix)", roles: [LineOperator], code: 200, input: [], output: ProductionRun, side_effects: ["MIX_ASSIGNED -> IN_PRODUCTION", "changeover VERIFIED -> CONSUMED", "line IDLE -> RUNNING", "increments ProductionRun.version by 1"] }
  - { method: POST, path: "/production-runs/{id}/hold", description: "QA hold (rework loop)", roles: [QAManager], code: 200, input: [], output: ProductionRun, side_effects: ["IN_PRODUCTION -> ON_HOLD", "increments ProductionRun.version by 1"] }
  - { method: POST, path: "/production-runs/{id}/resume", description: "QA resume from hold", roles: [QAManager], code: 200, input: [], output: ProductionRun, side_effects: ["ON_HOLD -> IN_PRODUCTION", "increments ProductionRun.version by 1"] }
  - { method: POST, path: "/production-runs/{id}/complete", description: "Complete run: dual-variant mix costing, creates InventoryLot, frees line and tunnel", roles: [LineOperator], code: 200, input: [actual_units, mix_metered_litres, zone_id], output: ProductionRun, side_effects: ["IN_PRODUCTION -> COMPLETED", "runs overrun_mix_usage", "creates InventoryLot", "updates MixBatch litres (CONSUMED at zero)", "BOOKED bookings -> COMPLETED", "line RUNNING -> IDLE with last_product snapshot", "checks freezer_zone_capacity", "increments ProductionRun.version by 1"] }
  - { method: POST, path: "/production-runs/{id}/cancel", description: "Cancel run from SCHEDULED/MIX_ASSIGNED/ON_HOLD", roles: [ProductionPlanner], code: 200, input: [], output: ProductionRun, side_effects: ["-> CANCELED", "BOOKED bookings -> CANCELED", "from ON_HOLD: line RUNNING -> IDLE", "from MIX_ASSIGNED: mix_batch_id cleared", "increments ProductionRun.version by 1"] }

  # ---- Tunnels & bookings ----
  - { method: POST, path: "/tunnels", description: "Register a hardening tunnel", roles: [PlantManager], code: 201, input: [tunnel_code, max_units_per_hour], output: Tunnel, side_effects: [] }
  - { method: GET, path: "/tunnels", description: "List tunnels", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?"], output: "Tunnel[]", side_effects: [] }
  - { method: POST, path: "/tunnel-bookings", description: "Book a hardening tunnel window (trailing-buffer overlap + throughput checks)", roles: [ProductionPlanner], code: 201, input: [tunnel_id, run_id, start_at, end_at], output: TunnelBooking, side_effects: [] }
  - { method: GET, path: "/tunnel-bookings", description: "List tunnel bookings", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "tunnel_id?", "run_id?", "status?"], output: "TunnelBooking[]", side_effects: [] }
  - { method: GET, path: "/tunnel-bookings/{id}", description: "Get one tunnel booking", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: TunnelBooking, side_effects: [] }
  - { method: POST, path: "/tunnel-bookings/{id}/cancel", description: "Cancel a BOOKED booking", roles: [ProductionPlanner], code: 200, input: [], output: TunnelBooking, side_effects: ["BOOKED -> CANCELED", "increments TunnelBooking.version by 1"] }

  # ---- Freezer zones & inventory lots ----
  - { method: POST, path: "/freezer-zones", description: "Register a freezer zone", roles: [PlantManager], code: 201, input: [zone_code, pallet_capacity], output: FreezerZone, side_effects: [] }
  - { method: GET, path: "/freezer-zones", description: "List freezer zones", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?"], output: "FreezerZone[]", side_effects: [] }
  - { method: GET, path: "/freezer-zones/{id}", description: "Get one zone (occupied_pallets)", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: FreezerZone, side_effects: [] }
  - { method: GET, path: "/inventory-lots", description: "List inventory lots", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "product_id?", "run_id?", "zone_id?", "status?"], output: "InventoryLot[]", side_effects: [] }
  - { method: GET, path: "/inventory-lots/{id}", description: "Get one lot", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: InventoryLot, side_effects: [] }
  - { method: POST, path: "/inventory-lots/{id}/quarantine", description: "QA quarantine; cascades release of ACTIVE allocations; LOADED shipments regress", roles: [QAManager], code: 200, input: [], output: InventoryLot, side_effects: ["AVAILABLE -> QUARANTINED", "sets quarantined_by", "ACTIVE allocations -> RELEASED (COMPLAINT_CASCADE)", "LOADED shipments with a released allocation -> PLANNED", "increments InventoryLot.version by 1"] }
  - { method: POST, path: "/inventory-lots/{id}/release-quarantine", description: "QA release from quarantine (segregated; blocked by open complaints on same run)", roles: [QAManager], code: 200, input: [], output: InventoryLot, side_effects: ["QUARANTINED -> AVAILABLE", "increments InventoryLot.version by 1"] }
  - { method: POST, path: "/inventory-lots/{id}/destroy", description: "Destroy quarantined lot; units move to units_destroyed", roles: [QAManager], code: 200, input: [], output: InventoryLot, side_effects: ["QUARANTINED -> DESTROYED", "units_destroyed += units_available; units_available = 0", "increments InventoryLot.version by 1"] }

  # ---- Shipments, allocations, temperature readings ----
  - { method: POST, path: "/shipments", description: "Create shipment (PLANNED); optional co-pack contract link", roles: [WarehouseLead], code: 201, input: [shipment_code, customer_id, "contract_id?", "carrier_liability?"], output: Shipment, side_effects: [] }
  - { method: GET, path: "/shipments", description: "List shipments", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "customer_id?", "contract_id?", "status?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/shipments/{id}", description: "Get one shipment", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/shipments/{id}/allocations", description: "Allocate lot units to a PLANNED shipment (reserves units)", roles: [WarehouseLead], code: 201, input: [lot_id, units], output: ShipmentAllocation, side_effects: ["creates ACTIVE allocation", "lot units_available -> units_reserved", "shipment.allocated_units += units"] }
  - { method: GET, path: "/shipment-allocations", description: "List allocations", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "shipment_id?", "lot_id?", "status?"], output: "ShipmentAllocation[]", side_effects: [] }
  - { method: GET, path: "/shipment-allocations/{id}", description: "Get one allocation", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: ShipmentAllocation, side_effects: [] }
  - { method: POST, path: "/shipment-allocations/{id}/release", description: "Manual release (shipment must be PLANNED)", roles: [WarehouseLead], code: 200, input: [], output: ShipmentAllocation, side_effects: ["ACTIVE -> RELEASED (MANUAL)", "lot reserved -> available", "shipment.allocated_units -= units", "increments ShipmentAllocation.version by 1"] }
  - { method: POST, path: "/shipments/{id}/load", description: "Load truck (requires allocated_units > 0)", roles: [WarehouseLead], code: 200, input: [], output: Shipment, side_effects: ["PLANNED -> LOADED", "increments Shipment.version by 1"] }
  - { method: POST, path: "/shipments/{id}/dispatch", description: "Depart; stamps dispatched_at", roles: [WarehouseLead], code: 200, input: [], output: Shipment, side_effects: ["LOADED -> IN_TRANSIT", "sets dispatched_at", "increments Shipment.version by 1"] }
  - { method: POST, path: "/shipments/{id}/deliver", description: "Deliver; fulfills allocations; credits contract delivered_units (may auto-FULFILL)", roles: [WarehouseLead], code: 200, input: [], output: Shipment, side_effects: ["IN_TRANSIT -> DELIVERED", "sets closed_at", "allocations -> FULFILLED", "lot reserved -> shipped", "contract delivered_units += units; maybe ACTIVE -> FULFILLED", "increments Shipment.version by 1"] }
  - { method: POST, path: "/shipments/{id}/reject", description: "Reject at delivery; releases allocations back to lots", roles: [WarehouseLead], code: 200, input: [], output: Shipment, side_effects: ["IN_TRANSIT -> REJECTED", "sets closed_at", "allocations -> RELEASED (SHIPMENT_REJECTED)", "lot reserved -> available", "increments Shipment.version by 1"] }
  - { method: POST, path: "/shipments/{id}/temperature-readings", description: "Append logger readings (bulk); shipment must be IN_TRANSIT", roles: [WarehouseLead], code: 201, input: [readings], output: "TempReading[]", side_effects: [] }
  - { method: GET, path: "/shipments/{id}/temperature-readings", description: "List a shipment's readings", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?"], output: "TempReading[]", side_effects: [] }

  # ---- Temperature abuse claims ----
  - { method: POST, path: "/temp-abuse-claims", description: "File a temperature-abuse claim against a DELIVERED/REJECTED shipment (filer must be the shipment's customer)", roles: [CustomerRep], code: 201, input: [claim_code, shipment_id, declared_value_cents], output: TempAbuseClaim, side_effects: ["sets filed_by_customer_id = X-User-ID"] }
  - { method: GET, path: "/temp-abuse-claims", description: "List claims", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "shipment_id?", "filed_by_customer_id?", "status?"], output: "TempAbuseClaim[]", side_effects: [] }
  - { method: GET, path: "/temp-abuse-claims/{id}", description: "Get one claim", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: TempAbuseClaim, side_effects: [] }
  - { method: POST, path: "/temp-abuse-claims/{id}/open-review", description: "Open evidence review; runs temperature_replay and BOTH claim_payout variants", roles: [ClaimsAdjuster], code: 200, input: [], output: TempAbuseClaim, side_effects: ["SUBMITTED|APPEALED -> EVIDENCE_REVIEW", "sets abuse_minutes, peak_temp_c, heat_shock_events, payout_standard_cents, payout_carrier_cents", "increments TempAbuseClaim.version by 1"] }
  - { method: POST, path: "/temp-abuse-claims/{id}/approve", description: "Approve; selects payout variant from shipment.carrier_liability", roles: [ClaimsAdjuster], code: 200, input: [], output: TempAbuseClaim, side_effects: ["EVIDENCE_REVIEW -> APPROVED", "sets payout_variant, payout_cents, decided_at", "increments TempAbuseClaim.version by 1"] }
  - { method: POST, path: "/temp-abuse-claims/{id}/deny", description: "Deny claim", roles: [ClaimsAdjuster], code: 200, input: [], output: TempAbuseClaim, side_effects: ["EVIDENCE_REVIEW -> DENIED", "sets decided_at", "increments TempAbuseClaim.version by 1"] }
  - { method: POST, path: "/temp-abuse-claims/{id}/pay", description: "Pay approved claim", roles: [ClaimsAdjuster], code: 200, input: [], output: TempAbuseClaim, side_effects: ["APPROVED -> PAID", "sets paid_at", "increments TempAbuseClaim.version by 1"] }
  - { method: POST, path: "/temp-abuse-claims/{id}/appeal", description: "Customer appeals a denial within 14 days", roles: [CustomerRep], code: 200, input: [], output: TempAbuseClaim, side_effects: ["DENIED -> APPEALED", "increments TempAbuseClaim.version by 1"] }
  - { method: POST, path: "/temp-abuse-claims/{id}/withdraw", description: "Customer withdraws an open claim", roles: [CustomerRep], code: 200, input: [], output: TempAbuseClaim, side_effects: ["SUBMITTED|EVIDENCE_REVIEW -> WITHDRAWN", "increments TempAbuseClaim.version by 1"] }

  # ---- Quality complaints ----
  - { method: POST, path: "/quality-complaints", description: "File a complaint against a lot (CustomerRep files as own customer; QAManager files internally)", roles: [QAManager, CustomerRep], code: 201, input: [complaint_code, lot_id, complaint_type], output: QualityComplaint, side_effects: ["sets customer_id = X-User-ID when filed by CustomerRep"] }
  - { method: GET, path: "/quality-complaints", description: "List complaints", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "lot_id?", "customer_id?", "status?", "complaint_type?"], output: "QualityComplaint[]", side_effects: [] }
  - { method: GET, path: "/quality-complaints/{id}", description: "Get one complaint", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: QualityComplaint, side_effects: [] }
  - { method: POST, path: "/quality-complaints/{id}/send-to-lab", description: "Send to lab (cycle cap 3)", roles: [QAManager], code: 200, input: [], output: QualityComplaint, side_effects: ["UNDER_REVIEW -> LAB_TEST", "lab_cycle_count += 1", "increments QualityComplaint.version by 1"] }
  - { method: POST, path: "/quality-complaints/{id}/record-lab-result", description: "Record lab measurement; returns to UNDER_REVIEW", roles: [QAManager], code: 200, input: ["measured_ice_crystal_um?"], output: QualityComplaint, side_effects: ["LAB_TEST -> UNDER_REVIEW", "sets measured_ice_crystal_um when provided", "increments QualityComplaint.version by 1"] }
  - { method: POST, path: "/quality-complaints/{id}/disposition", description: "Disposition: SUBSTANTIATED (gates on lab result + heat-shock limit; triggers quarantine cascade) or UNFOUNDED", roles: [QAManager], code: 200, input: [outcome, "disposition_rationale?"], output: QualityComplaint, side_effects: ["UNDER_REVIEW -> DISPOSITIONED_SUBSTANTIATED or CLOSED_UNFOUNDED", "SUBSTANTIATED cascade: same-run AVAILABLE lots -> QUARANTINED; their ACTIVE allocations -> RELEASED; affected LOADED shipments -> PLANNED", "increments QualityComplaint.version by 1"] }
  - { method: POST, path: "/quality-complaints/{id}/withdraw", description: "Withdraw complaint (filing customer or QA)", roles: [QAManager, CustomerRep], code: 200, input: [], output: QualityComplaint, side_effects: ["UNDER_REVIEW|LAB_TEST -> WITHDRAWN", "increments QualityComplaint.version by 1"] }

  # ---- Seasonal build plans ----
  - { method: POST, path: "/seasonal-build-plans", description: "Create a seasonal inventory build plan (DRAFT)", roles: [ProductionPlanner], code: 201, input: [plan_code, product_id, zone_id, production_week_start, sale_week_start, target_units], output: SeasonalBuildPlan, side_effects: ["computes required_pallets"] }
  - { method: GET, path: "/seasonal-build-plans", description: "List build plans", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: ["limit?", "offset?", "product_id?", "zone_id?", "status?"], output: "SeasonalBuildPlan[]", side_effects: [] }
  - { method: GET, path: "/seasonal-build-plans/{id}", description: "Get one build plan", roles: [PlantManager, ProductionPlanner, LineOperator, QAManager, WarehouseLead, CustomerRep, ClaimsAdjuster], code: 200, input: [], output: SeasonalBuildPlan, side_effects: [] }
  - { method: POST, path: "/seasonal-build-plans/{id}/approve", description: "Approve plan (shelf-life window + zone week capacity)", roles: [PlantManager], code: 200, input: [], output: SeasonalBuildPlan, side_effects: ["DRAFT -> APPROVED", "checks shelf_life_window and zone week capacity", "increments SeasonalBuildPlan.version by 1"] }
  - { method: POST, path: "/seasonal-build-plans/{id}/cancel", description: "Cancel plan", roles: [PlantManager], code: 200, input: [], output: SeasonalBuildPlan, side_effects: ["DRAFT|APPROVED -> CANCELED", "increments SeasonalBuildPlan.version by 1"] }

  # ---- Logical clock (test-driving endpoint) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock. Advancing the clock processes time-based transitions: MixBatch RELEASED -> EXPIRED at expires_at; InventoryLot AVAILABLE -> EXPIRED at best_before; TunnelBooking BOOKED -> EXPIRED past end_at when the owning run is not IN_PRODUCTION/ON_HOLD; CoPackContract APPROVED -> ACTIVE at start_date."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["processes time-based transitions listed in description"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the acted resource (customer mismatch)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, enum outside declared set, non-positive quantity, or end <= start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's state does not allow the requested transition (any machine)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempting both sides of a segregated step (pasteurize/release, complete/verify, quarantine/release)" }
  - { id: ERR_ALLERGEN_CLEAN_NOT_VERIFIED, http: 422, condition: "Run start without a VERIFIED changeover to the run's product on the line" }
  - { id: ERR_MIX_NOT_RELEASED, http: 422, condition: "Mix batch not in RELEASED status for assign/start" }
  - { id: ERR_MIX_PRODUCT_MISMATCH, http: 422, condition: "Mix batch product differs from run product" }
  - { id: ERR_MIX_EXPIRED, http: 422, condition: "Mix expiry at/before scheduled start (assign) or at/before now (start)" }
  - { id: ERR_LINE_FORMAT_MISMATCH, http: 422, condition: "Product format incompatible with line format" }
  - { id: ERR_CHANGEOVER_SEQUENCE, http: 422, condition: "Changeover opened while line not IDLE, or to_product not ACTIVE" }
  - { id: ERR_TUNNEL_WINDOW_CONFLICT, http: 409, condition: "Booking window collides with an existing BOOKED/COMPLETED window incl. trailing 30-minute buffer" }
  - { id: ERR_TUNNEL_CAPACITY_EXCEEDED, http: 422, condition: "run.planned_units > tunnel.max_units_per_hour * window hours" }
  - { id: ERR_RUN_NOT_SCHEDULABLE, http: 422, condition: "Booking references a run not in SCHEDULED or MIX_ASSIGNED" }
  - { id: ERR_BOOKING_EXISTS, http: 409, condition: "Run already has a BOOKED booking" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED, http: 422, condition: "Day-aggregate pallet capacity would be exceeded (lots) or week-bucket capacity exceeded (plans)" }
  - { id: ERR_SHELF_LIFE_WINDOW, http: 422, condition: "(sale_week - production_week).days + 30 > product.shelf_life_days at plan approval" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal attempted more than 14 days after decided_at" }
  - { id: ERR_TUNNEL_BOOKING_REQUIRED, http: 422, condition: "Run start without any BOOKED tunnel booking" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 422, condition: "Allocation against a lot not AVAILABLE or past best_before" }
  - { id: ERR_INSUFFICIENT_LOT_UNITS, http: 422, condition: "Allocation units > lot.units_available" }
  - { id: ERR_SHIPMENT_EMPTY, http: 422, condition: "Load with allocated_units == 0" }
  - { id: ERR_CLAIM_NOT_ALLOWED, http: 422, condition: "Claim against a shipment not DELIVERED or REJECTED" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "Another non-terminal claim exists for the shipment" }
  - { id: ERR_INSUFFICIENT_READINGS, http: 422, condition: "Open-review with fewer than 2 readings" }
  - { id: ERR_LAB_RESULT_REQUIRED, http: 422, condition: "HEAT_SHOCK disposition without recorded measured_ice_crystal_um" }
  - { id: ERR_HEAT_SHOCK_NOT_PROVEN, http: 422, condition: "SUBSTANTIATED HEAT_SHOCK with measured_ice_crystal_um <= format limit" }
  - { id: ERR_LAB_CYCLE_EXHAUSTED, http: 409, condition: "send-to-lab when lab_cycle_count >= 3" }
  - { id: ERR_COMPLAINT_STILL_OPEN, http: 422, condition: "Lot release-quarantine while a complaint on the same run is UNDER_REVIEW or LAB_TEST" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 422, condition: "Contract-referencing operation where contract is not ACTIVE (or customer mismatch)" }
  - { id: ERR_CONTRACT_PRODUCT_MISMATCH, http: 422, condition: "Allocation product differs from shipment contract's product" }
  - { id: ERR_COPACK_CONTRACT_REQUIRED, http: 422, condition: "Run for co_pack_only product without an ACTIVE covering contract" }
  - { id: ERR_PRODUCT_VERSION_PINNED, http: 409, condition: "Spec edit on a product pinned by an APPROVED/ACTIVE contract" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 422, condition: "Run/changeover/build-plan references a DISCONTINUED product" }
  - { id: ERR_INSUFFICIENT_MIX, http: 422, condition: "mix_metered_litres > batch litres_remaining at complete" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant administration: masters (products, customers, lines, tunnels, zones), contract approval/amendment, build-plan approval, logical clock"
    identity: opaque
    exclusive_operations: [POST /products, "PATCH /products/{id}", "POST /products/{id}/discontinue", "POST /products/{id}/reformulations", POST /customers, POST /co-pack-contracts, "POST /co-pack-contracts/{id}/approve", "POST /co-pack-contracts/{id}/amend", "POST /co-pack-contracts/{id}/cancel", POST /lines, POST /tunnels, POST /freezer-zones, "POST /seasonal-build-plans/{id}/approve", "POST /seasonal-build-plans/{id}/cancel", POST /_clock/set_current_utc]
    shared_operations: [all GET endpoints]
  - name: ProductionPlanner
    description: "Schedules mix batches, production runs, tunnel bookings, changeovers, and seasonal build plans"
    identity: opaque
    exclusive_operations: [POST /mix-batches, POST /production-runs, "POST /production-runs/{id}/assign-mix", "POST /production-runs/{id}/cancel", POST /tunnel-bookings, "POST /tunnel-bookings/{id}/cancel", POST /changeovers, POST /seasonal-build-plans]
    shared_operations: [all GET endpoints]
  - name: LineOperator
    description: "Executes pasteurization, run start/complete, and changeover cleaning"
    identity: opaque
    exclusive_operations: ["POST /mix-batches/{id}/pasteurize", "POST /production-runs/{id}/start", "POST /production-runs/{id}/complete", "POST /changeovers/{id}/complete"]
    shared_operations: [all GET endpoints]
  - name: QAManager
    description: "Quality authority: mix release/reject, changeover verification, run hold/resume, lot quarantine/disposition, complaint handling"
    identity: opaque
    exclusive_operations: ["POST /mix-batches/{id}/release", "POST /mix-batches/{id}/reject", "POST /changeovers/{id}/verify", "POST /production-runs/{id}/hold", "POST /production-runs/{id}/resume", "POST /inventory-lots/{id}/quarantine", "POST /inventory-lots/{id}/release-quarantine", "POST /inventory-lots/{id}/destroy", "POST /quality-complaints/{id}/send-to-lab", "POST /quality-complaints/{id}/record-lab-result", "POST /quality-complaints/{id}/disposition"]
    shared_operations: [all GET endpoints, POST /quality-complaints, "POST /quality-complaints/{id}/withdraw"]
  - name: WarehouseLead
    description: "Cold-chain logistics: shipments, allocations, loading, dispatch, delivery, temperature logger uploads"
    identity: opaque
    exclusive_operations: [POST /shipments, "POST /shipments/{id}/allocations", "POST /shipment-allocations/{id}/release", "POST /shipments/{id}/load", "POST /shipments/{id}/dispatch", "POST /shipments/{id}/deliver", "POST /shipments/{id}/reject", "POST /shipments/{id}/temperature-readings"]
    shared_operations: [all GET endpoints]
  - name: CustomerRep
    description: "External customer representative: submits own contracts, files/appeals/withdraws temperature-abuse claims, files/withdraws quality complaints"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /co-pack-contracts/{id}/submit", POST /temp-abuse-claims, "POST /temp-abuse-claims/{id}/appeal", "POST /temp-abuse-claims/{id}/withdraw"]
    shared_operations: [all GET endpoints, POST /quality-complaints, "POST /quality-complaints/{id}/withdraw"]
  - name: ClaimsAdjuster
    description: "Claims adjudication: evidence review with temperature replay, approve/deny/pay"
    identity: opaque
    exclusive_operations: ["POST /temp-abuse-claims/{id}/open-review", "POST /temp-abuse-claims/{id}/approve", "POST /temp-abuse-claims/{id}/deny", "POST /temp-abuse-claims/{id}/pay"]
    shared_operations: [all GET endpoints]
