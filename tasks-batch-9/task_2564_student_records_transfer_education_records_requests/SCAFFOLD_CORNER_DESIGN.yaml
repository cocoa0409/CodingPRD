            - "trigger call 5 returns HTTP 409 with data.error_id == \"ERR_WITHDRAWAL_ALREADY_COMPLETED\""
            - "trigger call 6 returns HTTP 409 with data.error_id == \"ERR_WITHDRAWAL_ALREADY_COMPLETED\""
            - "Withdrawal.${withdrawal_id}.hold_count == 0 and active_hold_types == []"

      - name: inspection_fee_and_terminal_state_codes
        claim_type: error_triggerable
        grounds:
          - validations.priority_54_inspection_request_state_permits_action
          - validations.priority_86_fee_settled_before_inspection_completion
          - calculations.inspection_copy_fee_cents
