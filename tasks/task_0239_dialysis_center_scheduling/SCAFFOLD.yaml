  - { id: ERR_CLINIC_NOT_FOUND, http: 404, condition: "clinicId does not exist" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "patientId does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "shiftId does not exist" }
  - { id: ERR_MACHINE_NOT_FOUND, http: 404, condition: "machineId does not exist" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "stationId does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "standing-slot slotId does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "sessionId does not exist" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "transport tripId does not exist" }
  - { id: ERR_LAB_NOT_FOUND, http: 404, condition: "lab-order labId does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "statementId does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Body field-level validation failed (missing required field, bad enum, out-of-range numeric, end_minute <= start_minute, miles < 0, coinsurance_pct outside [0,1])" }
  - { id: ERR_CROSS_CLINIC_REFERENCE, http: 422, condition: "A body FK references a missing entity or one that belongs to a different clinic" }
  - { id: ERR_CLINIC_SUSPENDED, http: 409, condition: "Clinic is not OPEN when creating a standing slot, session, or lab order" }
  - { id: ERR_CLINIC_HAS_ACTIVE_SESSIONS, http: 409, condition: "Cannot close clinic while BOOKED/CHECKED_IN sessions exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state transition (source state not permitted)" }
  - { id: ERR_ORDER_NOT_ACTIVE, http: 409, condition: "Authorizing order is not ACTIVE or does not govern the service_date" }
  - { id: ERR_ACTIVE_ORDER_EXISTS, http: 409, condition: "Patient already has an ACTIVE order when activating another" }
  - { id: ERR_SESSION_NOT_COMPLETED, http: 409, condition: "Operation requires session clinical_status == COMPLETED" }
  - { id: ERR_SESSION_NOT_VOIDABLE, http: 409, condition: "void-billing requires clinical_status in {CANCELLED, MISSED}" }
  - { id: ERR_SESSION_NOT_SCHEDULABLE, http: 409, condition: "transport confirm requires owning session in {BOOKED, CHECKED_IN}" }
  - { id: ERR_DATE_NOT_ON_PATTERN, http: 422, condition: "service_date weekday not on the chosen shift.day_pattern" }
  - { id: ERR_ISOLATION_STATION_REQUIRED, http: 422, condition: "Isolation patient assigned to a non-isolation-capable station" }
  - { id: ERR_MODALITY_NOT_SUPPORTED, http: 422, condition: "HEMODIAFILTRATION ordered but station machine supports_hdf is false" }
  - { id: ERR_DIALYZER_REUSE_EXCEEDED, http: 409, condition: "Completing the session would push machine.dialyzer_reuse_count to/over clinic.dialyzer_reuse_limit" }
  - { id: ERR_STATION_DOUBLE_BOOKED, http: 409, condition: "Another non-terminal session already occupies (station, shift, service_date)" }
  - { id: ERR_TURNOVER_BUFFER_VIOLATION, http: 409, condition: "Two sessions sharing the same machine on the same date violate the earlier shift's turnover/disinfection buffer gap" }
  - { id: ERR_MACHINE_IN_USE, http: 409, condition: "Machine maintenance/retire blocked by a CHECKED_IN/BOOKED session on a bound station" }
  - { id: ERR_MACHINE_UNAVAILABLE, http: 409, condition: "check-in requires the station's machine to be AVAILABLE" }
  - { id: ERR_STATION_OFFLINE, http: 409, condition: "check-in requires station ACTIVE" }
  - { id: ERR_STATION_OCCUPIED, http: 409, condition: "take-offline blocked by a BOOKED/CHECKED_IN session on the station" }
  - { id: ERR_PATIENT_SUSPENDED, http: 409, condition: "Ad-hoc/transient booking blocked: patient adherence_status SUSPENDED" }
  - { id: ERR_TRANSIENT_NO_STANDING_SLOT, http: 422, condition: "Standing slot requested for a non-RESIDENT patient" }
  - { id: ERR_STALE_PATIENT_VERSION, http: 412, condition: "expected_patient_version does not match current patient.version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Operates clinic, inventory (shifts/machines/stations), patient lifecycle and reactivation"
    identity: "opaque"
    exclusive_operations:
      - "POST /clinics and clinic suspend/resume/close"
      - "POST /shifts + retire shift"
      - "POST /machines + start/complete maintenance + retire"
      - "POST /stations + take-offline/bring-online"
      - "POST /patients/{id}/reactivate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /patients (create patient, shared with Scheduler)"
      - "all GET reads"

  - name: Scheduler
    description: "Owns standing slots, sessions, transport, labs"
    identity: "opaque"
    exclusive_operations:
      - "POST /standing-slots + release"
      - "POST /sessions + check-in/complete/mark-missed/cancel"
      - "POST /transport-trips + confirm/complete/cancel"
      - "POST /lab-orders/{id}/collect"
    shared_operations:
      - "POST /patients (create patient, shared with ClinicAdmin)"
      - "POST /lab-orders (shared with Nephrologist)"
      - "POST /lab-orders/{id}/cancel (shared with Nephrologist)"
      - "all GET reads"

  - name: Nephrologist
    description: "Owns nephrologist orders and lab scheduling"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders + activate/open-revision/commit-revision/revoke"
    shared_operations:
      - "POST /lab-orders (shared with Scheduler)"
      - "POST /lab-orders/{id}/cancel (shared with Scheduler)"
      - "all GET reads"

  - name: BillingClerk
    description: "Owns session billing and monthly statements"
    identity: "opaque"
    exclusive_operations:
      - "POST /sessions/{id}/bill, settle, void-billing"
      - "POST /statements + pay/cancel"
    shared_operations:
      - "all GET reads"
