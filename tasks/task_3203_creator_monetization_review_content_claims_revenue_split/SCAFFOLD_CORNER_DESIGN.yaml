        claim_type: Satisfaction → Pass
        grounds:
          - state_machines.Channel.MONETIZATION_REJECTED_to_MONETIZATION_PENDING
        distinguishing_aspect: "A channel in MONETIZATION_REJECTED that still meets the thresholds returns to MONETIZATION_PENDING on a fresh application with 200, proving the re-application loop is open."
