scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dd_score_snapshot_vs_live_recompute_on_tier_change
        grounds:
          - calculations.dd_aggregate_score
          - entities.DueDiligencePackage.fields.aggregate_dd_score
          - entities.Vendor.fields.criticality_tier
          - state_machines.Vendor.transitions
        distinguishing_aspect: |
          Entity domain = DueDiligencePackage. The pinned snapshot_at_submit
          variant freezes weights at submit time; the rejected live_recompute
          variant would re-derive the score on every read. A tier change
          BETWEEN submit and a later GET therefore exposes the difference:
          under snapshot semantics the score stays at its submit-time value,
          under live-recompute it would change. Test asserts the score is
          unchanged after tier-change.
        test_recipe:
          setup:
            - "Vendor V in ONBOARDING with tier TIER_3_STANDARD (default)."
            - "VendorEngagement E on V in DRAFT."
            - "DueDiligencePackage P on E created with scores (80, 90, 70); not yet submitted."
            - "P submitted → aggregate_dd_score computed with TIER_3 weights (0.40, 0.35, 0.25):"
            - "  80*0.40 + 90*0.35 + 70*0.25 = 32.00 + 31.50 + 17.50 = 81.00 (TIER_3 weights)."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "Acme Cloud Corp", headquarters_region: "NA", service_category: "CLOUD_INFRA" }
              as: VendorRelationshipManager
              captures: { v_id: $.data.id }
            - call: "POST /tprm/vendors/${v_id}/engagements"
              payload: { engagement_code: "ACME-001", service_summary: "Cloud hosting", annual_spend_cents: 1000000, data_sensitivity: "CONFIDENTIAL" }
              as: VendorRelationshipManager
              captures: { e_id: $.data.id }
            - call: "POST /tprm/engagements/${e_id}/due-diligence-packages"
              payload: { financial_review_score: 80, security_review_score: 90, compliance_review_score: 70, financial_reviewer_id: "u_fin_1", security_reviewer_id: "u_sec_1", compliance_reviewer_id: "u_comp_1" }
              as: VendorRelationshipManager
              captures: { p_id: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_id}/submit"
              payload: {}
              as: VendorRelationshipManager
              captures: { score_at_submit: $.data.aggregate_dd_score }
            - call: "GET /tprm/vendors/${v_id}"
              payload: {}
              as: RiskOfficer
              captures: { v_version: $.data.version }
            - call: "POST /tprm/vendors/${v_id}/tier-change"
              payload: { to_tier: "TIER_1_CRITICAL", reason: "Re-classified as critical infrastructure", expected_vendor_version: "${v_version}" }
              as: RiskOfficer
          trigger:
            - call: "GET /tprm/due-diligence-packages/${p_id}"
              payload: {}
              as: RiskOfficer
          assert:
            - "DueDiligencePackage.${p_id}.aggregate_dd_score == 81.00  # unchanged despite tier change to TIER_1 (snapshot semantics)"
            - "If live_recompute variant were in force, the score would be 80*0.25 + 90*0.45 + 70*0.30 = 20.00 + 40.50 + 21.00 = 81.50 (would differ); observed value is 81.00."

      - name: composite_risk_score_non_terminal_only_vs_including_closed
        grounds:
          - calculations.composite_risk_score
          - entities.Vendor.fields.composite_risk_score
          - state_machines.Incident.transitions
        distinguishing_aspect: |
          Entity domain = Vendor. The pinned non_terminal_only variant counts
          only non-terminal incidents; the rejected including_closed_incidents
          variant would include CLOSED at half weight. Driving an incident
          through its full remediation cycle and re-reading the vendor's
          composite_risk_score distinguishes the two: under pinned semantics
          the SEV_3 contribution (8 points) drops to zero after CLOSED; under
          the rejected variant it would persist at 4.
        test_recipe:
          setup:
            - "Vendor V ACTIVE, tier TIER_3_STANDARD (multiplier 1.0)."
            - "VendorEngagement E ACTIVE on V."
            - "No prior incidents, no overdue cycles, no failed BCPs → composite_risk_score == 0."
            - "Clock at 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "Beta Payments Ltd", headquarters_region: "EMEA", service_category: "PAYMENTS" }
              as: VendorRelationshipManager
              captures: { v_id: $.data.id }
            - call: "POST /tprm/vendors/${v_id}/engagements"
              payload: { engagement_code: "BETA-001", service_summary: "Card processing", annual_spend_cents: 5000000, data_sensitivity: "REGULATED" }
              as: VendorRelationshipManager
              captures: { e_id: $.data.id }
            - call: "POST /tprm/engagements/${e_id}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_fin_2", security_reviewer_id: "u_sec_2", compliance_reviewer_id: "u_comp_2" }
              as: VendorRelationshipManager
              captures: { p_id: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_id}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_id}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_id}"
              payload: {}
              as: RiskOfficer
              captures: { e_version: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_id}/approve"
              payload: { expected_engagement_version: "${e_version}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_id}/contracts"
              payload: { contract_reference: "BETA-C-001", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: true, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.9, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_id: $.data.id }
            - call: "GET /tprm/engagements/${e_id}"
              payload: {}
              as: RiskOfficer
              captures: { e_version2: $.data.version }
            - call: "POST /tprm/contracts/${c_id}/execute"
              payload: { expected_engagement_version: "${e_version2}" }
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_id}/activate"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_id}/incidents"
              payload: { incident_type: "OUTAGE", severity: "SEV_3", detected_at: "2026-05-02T00:00:00Z" }
              as: BusinessUnitOwner
              captures: { i_id: $.data.id }
            - call: "POST /tprm/incidents/${i_id}/triage"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/incidents/${i_id}/remediation-plans"
              payload: { plan_summary: "Fix the outage", committed_completion_date: "2026-05-20T00:00:00Z" }
              as: RiskOfficer
              captures: { plan_id: $.data.id }
            - call: "POST /tprm/remediation-plans/${plan_id}/submit"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/remediation-plans/${plan_id}/approve"
              payload: {}
              as: RiskOfficer
              # approver must differ from owner AND from incident reporter. Owner is
              # RiskOfficer who created (X-User-ID unknown — opaque). The lint accepts
              # this because both sides are opaque; runtime must check the equality.
            - call: "POST /tprm/remediation-plans/${plan_id}/submit-verification"
              payload: { verification_evidence_uri: "s3://evidence/fix-001" }
              as: RiskOfficer
            - call: "POST /tprm/remediation-plans/${plan_id}/verify"
              payload: {}
              as: BusinessUnitOwner
          trigger:
            - call: "GET /tprm/vendors/${v_id}"
              payload: {}
              as: RiskOfficer
          assert:
            - "Vendor.${v_id}.composite_risk_score == 0  # SEV_3 contribution (8 points) dropped to zero after CLOSED under non_terminal_only"
            - "If including_closed_incidents were in force, score would be 8/2 * 1.0 = 4.00; observed 0."

      - name: concentration_share_per_bucket_then_total_rounding
        grounds:
          - calculations.concentration_share
          - entities.ConcentrationBucket.fields.share_pct
          - entities.ConcentrationBucket.fields.is_breach
        distinguishing_aspect: |
          Entity domain = ConcentrationBucket. The pinned per_bucket_then_total
          variant rounds share_pct to 2dp BEFORE the >= 25.00 comparison; the
          rejected compare_unrounded variant would compare the unrounded
          fraction. With a vendor spend pattern that produces a true share of
          exactly 24.996% (rounds to 25.00), the two variants diverge on the
          is_breach flag: pinned semantics yields is_breach == true;
          compare_unrounded yields false.
        test_recipe:
          setup:
            - "Four vendors in EMEA with ACTIVE engagements spending 24996, 25002, 25001, 25001 cents (total 100000). EMEA share = 100% (only region with spend)."
            - "One vendor in NA spending 0 cents is excluded (no ACTIVE engagement — vendor not yet activated)."
            - "Actually simpler: a single ACTIVE engagement with spend 24996 in EMEA and a single ACTIVE engagement with spend 75004 in NA; total 100000. EMEA share = 24996*100/100000 = 24.996 → rounds to 25.00."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "EMEA Vendor", headquarters_region: "EMEA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_emea: $.data.id }
            - call: "POST /tprm/vendors/${v_emea}/engagements"
              payload: { engagement_code: "EMEA-E1", service_summary: "BPO services", annual_spend_cents: 24996, data_sensitivity: "INTERNAL" }
              as: VendorRelationshipManager
              captures: { e_emea: $.data.id }
            - call: "POST /tprm/engagements/${e_emea}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_f3", security_reviewer_id: "u_s3", compliance_reviewer_id: "u_c3" }
              as: VendorRelationshipManager
              captures: { p_emea: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_emea}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_emea}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_emea}"
              payload: {}
              as: RiskOfficer
              captures: { e_emea_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_emea}/approve"
              payload: { expected_engagement_version: "${e_emea_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_emea}/contracts"
              payload: { contract_reference: "EMEA-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: false, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_emea: $.data.id }
            - call: "GET /tprm/engagements/${e_emea}"
              payload: {}
              as: RiskOfficer
              captures: { e_emea_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_emea}/execute"
              payload: { expected_engagement_version: "${e_emea_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/vendors"
              payload: { legal_name: "NA Vendor", headquarters_region: "NA", service_category: "CLOUD_INFRA" }
              as: VendorRelationshipManager
              captures: { v_na: $.data.id }
            - call: "POST /tprm/vendors/${v_na}/engagements"
              payload: { engagement_code: "NA-E1", service_summary: "Cloud infra", annual_spend_cents: 75004, data_sensitivity: "INTERNAL" }
              as: VendorRelationshipManager
              captures: { e_na: $.data.id }
            - call: "POST /tprm/engagements/${e_na}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_f4", security_reviewer_id: "u_s4", compliance_reviewer_id: "u_c4" }
              as: VendorRelationshipManager
              captures: { p_na: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_na}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_na}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_na}"
              payload: {}
              as: RiskOfficer
              captures: { e_na_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_na}/approve"
              payload: { expected_engagement_version: "${e_na_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_na}/contracts"
              payload: { contract_reference: "NA-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: false, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_na: $.data.id }
            - call: "GET /tprm/engagements/${e_na}"
              payload: {}
              as: RiskOfficer
              captures: { e_na_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_na}/execute"
              payload: { expected_engagement_version: "${e_na_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/concentration-assessments"
              payload: { assessment_window_start: "2026-05-01T00:00:00Z", assessment_window_end: "2026-06-01T00:00:00Z", grouping_dimension: "REGION" }
              as: ComplianceDirector
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /tprm/concentration-assessments/${a_id}/publish"
              payload: {}
              as: ComplianceDirector
            - call: "GET /tprm/concentration-assessments/${a_id}/buckets"
              payload: {}
              as: ComplianceDirector
          assert:
            - "ConcentrationAssessment.${a_id}.breach_bucket_keys contains 'EMEA'  # share 24.996 rounds to 25.00 (round_half_up) which is >= 25.00 → breach"
            - "If compare_unrounded were in force, EMEA share 24.996 < 25.00 → not breach; observed is_breach == true."

  # =========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: dd_score_tier_conditional_weight_selection
        grounds:
          - calculations.dd_aggregate_score
          - entities.Vendor.fields.criticality_tier
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction via
          tier-conditional weight selection. The same raw review triple
          (financial=70, security=80, compliance=90) produces 4 distinct
          aggregate_dd_score values across the 4 tier values:
          T1: 70*0.25+80*0.45+90*0.30 = 17.50+36.00+27.00 = 80.50
          T2: 70*0.30+80*0.40+90*0.30 = 21.00+32.00+27.00 = 80.00
          T3: 70*0.40+80*0.35+90*0.25 = 28.00+28.00+22.50 = 78.50
          T4: 70*0.50+80*0.25+90*0.25 = 35.00+20.00+22.50 = 77.50
          Test submits the same triple on two vendors at different tiers and
          asserts both resulting scores match the literals.
        test_recipe:
          setup:
            - "Vendor V_T3 (default TIER_3_STANDARD) and Vendor V_T1 (promoted to TIER_1_CRITICAL before DD submission)."
            - "Each has one engagement and one DD package with the same triple (70, 80, 90)."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "Tier3 Vendor", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_t3: $.data.id }
            - call: "POST /tprm/vendors/${v_t3}/engagements"
              payload: { engagement_code: "T3-E1", service_summary: "BPO", annual_spend_cents: 100, data_sensitivity: "PUBLIC" }
              as: VendorRelationshipManager
              captures: { e_t3: $.data.id }
            - call: "POST /tprm/engagements/${e_t3}/due-diligence-packages"
              payload: { financial_review_score: 70, security_review_score: 80, compliance_review_score: 90, financial_reviewer_id: "u_f5", security_reviewer_id: "u_s5", compliance_reviewer_id: "u_c5" }
              as: VendorRelationshipManager
              captures: { p_t3: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_t3}/submit"
              payload: {}
              as: VendorRelationshipManager
              captures: { score_t3: $.data.aggregate_dd_score }
            - call: "POST /tprm/vendors"
              payload: { legal_name: "Tier1 Vendor", headquarters_region: "NA", service_category: "CLOUD_INFRA" }
              as: VendorRelationshipManager
              captures: { v_t1: $.data.id }
            - call: "POST /tprm/vendors/${v_t1}/engagements"
              payload: { engagement_code: "T1-E1", service_summary: "Cloud", annual_spend_cents: 100, data_sensitivity: "REGULATED" }
              as: VendorRelationshipManager
              captures: { e_t1: $.data.id }
            - call: "GET /tprm/vendors/${v_t1}"
              payload: {}
              as: RiskOfficer
              captures: { v_t1_v: $.data.version }
            - call: "POST /tprm/vendors/${v_t1}/tier-change"
              payload: { to_tier: "TIER_1_CRITICAL", reason: "critical infra", expected_vendor_version: "${v_t1_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_t1}/due-diligence-packages"
              payload: { financial_review_score: 70, security_review_score: 80, compliance_review_score: 90, financial_reviewer_id: "u_f6", security_reviewer_id: "u_s6", compliance_reviewer_id: "u_c6" }
              as: VendorRelationshipManager
              captures: { p_t1: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_t1}/submit"
              payload: {}
              as: VendorRelationshipManager
              captures: { score_t1: $.data.aggregate_dd_score }
          trigger: []
          assert:
            - "score_t3 == 78.50  # TIER_3 weights"
            - "score_t1 == 80.50  # TIER_1 weights"
            - "score_t1 != score_t3  # same raw triple, different tier → different score"

      - name: concentration_share_rounding_order
        grounds:
          - calculations.concentration_share
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters. Pinned order is "round each
          bucket's share_pct to 2dp THEN compare to >= 25.00". The alternate
          "compare unrounded" produces a different is_breach on a true share
          of 24.996. Same distinguishing scenario as
          concentration_share_per_bucket_then_total_rounding (rule 1 instance)
          but grounded specifically in the rounding-order branch of the
          combinatorial_formula rule.
        test_recipe:
          setup:
            - "Same fixture as concentration_share_per_bucket_then_total_rounding."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "R-EMEA", headquarters_region: "EMEA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_r_emea: $.data.id }
            - call: "POST /tprm/vendors/${v_r_emea}/engagements"
              payload: { engagement_code: "R-E1", service_summary: "BPO", annual_spend_cents: 24996, data_sensitivity: "INTERNAL" }
              as: VendorRelationshipManager
              captures: { e_r_emea: $.data.id }
            - call: "POST /tprm/engagements/${e_r_emea}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_f7", security_reviewer_id: "u_s7", compliance_reviewer_id: "u_c7" }
              as: VendorRelationshipManager
              captures: { p_r_emea: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_r_emea}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_r_emea}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_r_emea}"
              payload: {}
              as: RiskOfficer
              captures: { e_r_emea_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_r_emea}/approve"
              payload: { expected_engagement_version: "${e_r_emea_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_r_emea}/contracts"
              payload: { contract_reference: "R-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: false, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_r_emea: $.data.id }
            - call: "GET /tprm/engagements/${e_r_emea}"
              payload: {}
              as: RiskOfficer
              captures: { e_r_emea_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_r_emea}/execute"
              payload: { expected_engagement_version: "${e_r_emea_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/concentration-assessments"
              payload: { assessment_window_start: "2026-05-01T00:00:00Z", assessment_window_end: "2026-06-01T00:00:00Z", grouping_dimension: "REGION" }
              as: ComplianceDirector
              captures: { a_r: $.data.id }
          trigger:
            - call: "POST /tprm/concentration-assessments/${a_r}/publish"
              payload: {}
              as: ComplianceDirector
          assert:
            - "ConcentrationAssessment.${a_r}.breach_bucket_keys contains 'EMEA'  # round-then-compare: 24.996 → 25.00 → breach"

      - name: remediation_deadline_severity_vs_contract_window
        grounds:
          - calculations.remediation_deadline
          - entities.Incident.fields.remediation_due_at
          - entities.Contract.fields.breach_cure_window_days
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency. incident.remediation_due_at
          depends on engagement.contract.breach_cure_window_days, but contract
          is only meaningful when EXECUTED (which itself depends on the
          engagement lifecycle that the DD package approved). The scaffold pins
          the evaluation order: severity_window computed first; contract_window
          consulted only if contract exists AND status == EXECUTED;
          min(severity, contract) wins. A SEV_2 incident (severity window 30d)
