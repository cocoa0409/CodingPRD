            - call: "POST /lots"
              payload: { lot_code: "PA5", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z", target_season_id: "${fw2027k_id}" }
              as: Buyer
              captures: { lot_pa5_id: $.data.id }
            - call: "POST /lots/${lot_pa5_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_pa5_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /warehouses"
              payload: { warehouse_code: "WMT-DEN", pallet_capacity: 200, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_mt5_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_pa5_id}", warehouse_id: "${wh_mt5_id}", pallet_count: 2, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_hb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-29T00:00:00Z" }
              as: PlanningLead
          trigger:
            - call: "POST /packaway-holds/${hold_hb_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
              captures: { err89: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: PlanningLead
            - call: "POST /packaway-holds/${hold_hb_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
          assert:
            - "at 2026-11-29 (89 days) the review fails with 422 ERR_AGING_REVIEW_PREMATURE and age_bucket stays FRESH"
            - "at 2026-11-30 (exactly 90 days) the review succeeds (>= boundary) and PackawayHold.${hold_hb_id}.status == AGING_REVIEW with age_bucket == AGING"
            - "PackawayHold.${hold_hb_id}.accrued_holding_cost_cents == 30000 (3 full months * 2 pallets * 5000, 0 remainder days)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: allocation_execute_gated_by_season_open
        grounds:
          - state_machines.AllocationPlan.APPROVED_to_EXECUTED
          - validations[priority=13]
          - errors.ERR_SEASON_NOT_OPEN
        distinguishing_aspect: |
          Entity pair AllocationPlan -> MerchandiseSeason: plan execution is
          rejected while the plan's selling season is DRAFT even though the
          plan itself is APPROVED; opening the season unblocks the identical
          request with no change to the plan.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN, FW2027 DRAFT. Vendor V1 STANDARD zone MT."
            - "IMMEDIATE lot LA1 asking 1000000 (landed 1150000) ACCEPTED against SS2027; plan P1 APPROVED for LA1 targeting FW2027."
            - "Ticket for LA1's line in MT; one store ST1 in SUBURBAN_FAMILY covering the cluster weights."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - call: "POST /merchandise-seasons"
              payload: { season_code: "FW2027", start_date: "2027-08-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z", department_otb_budget_cents: 5000000, packaway_reserve_ratio: 0.20 }
              as: PlanningLead
              captures: { fw2027l_id: $.data.id }
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "LA1", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_la1_id: $.data.id, lot_la1_v: $.data.version }
            - call: "POST /lots/${lot_la1_id}/lot-lines"
              payload: { style_code: "LA1-S", department: "APPAREL", quantity: 100, unit_cost_cents: 11500, compare_at_claim_cents: 15000, target_retail_cents: 5000 }
              as: Buyer
              captures: { line_la1_id: $.data.id }
            - call: "POST /lots/${lot_la1_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_la1_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_la1_id}", zone_code: "MT" }
              as: PricingAnalyst
            - call: "POST /stores"
              payload: { store_code: "ST1", cluster_code: "SUBURBAN_FAMILY", zone_code: "MT", storage_capacity_units: 500 }
              as: AllocationManager
            - call: "GET /lots/${lot_la1_id}"
              payload: {}
              as: AllocationManager
              captures: { lot_la1_vnow: $.data.version }
            - call: "POST /allocation-plans"
              payload: { lot_id: "${lot_la1_id}", season_id: "${fw2027l_id}", total_units: 100, cluster_weights: { SUBURBAN_FAMILY: 1.0 }, expected_lot_version: "${lot_la1_vnow}" }
              as: AllocationManager
              captures: { plan_p1_id: $.data.id }
            - call: "POST /allocation-plans/${plan_p1_id}/approve"
              payload: {}
              as: AllocationManager
          trigger:
            - call: "POST /allocation-plans/${plan_p1_id}/execute"
              payload: {}
              as: AllocationManager
              captures: { err_exec: $.data.error_id }
          assert:
            - "the execute fails with 422 ERR_SEASON_NOT_OPEN because FW2027 is DRAFT"
            - "AllocationPlan.${plan_p1_id}.status remains APPROVED and no StoreSku rows are created"
            - "the identical request would succeed once FW2027 is OPEN (cross-entity gate is on the season, not the plan)"

      - name: packaway_release_gated_by_target_season_open
        grounds:
          - state_machines.PackawayHold.STORED_to_RELEASED
          - validations[priority=8]
          - errors.ERR_TARGET_SEASON_NOT_OPEN
        distinguishing_aspect: |
          Entity pair PackawayHold -> MerchandiseSeason (a different pair than
          AllocationPlan -> MerchandiseSeason): release inside the window still
          fails until the hold's TARGET season is OPEN — the hold's own state,
          window, and OCC version are all satisfied, and only the other
          entity's state blocks.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 created and closed without ever being opened (no OPEN singleton conflict); FW2027 created DRAFT then opened."
            - "PACKAWAY lot PA6 registered against the DRAFT SS2027 (registration needs no OPEN season), evaluated, and ACCEPTED; FW2027 then closed; hold HR entered 2026-09-01 with window [2027-07-01, 2027-08-31] targeting the now-CLOSED FW2027."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - call: "POST /merchandise-seasons"
              payload: { season_code: "FW2027", start_date: "2027-08-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z", department_otb_budget_cents: 5000000, packaway_reserve_ratio: 0.20 }
              as: PlanningLead
              captures: { fw2027m_id: $.data.id }
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "PA6", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z", target_season_id: "${fw2027m_id}" }
              as: Buyer
              captures: { lot_pa6_id: $.data.id }
            - call: "POST /lots/${lot_pa6_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_pa6_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /merchandise-seasons/${fw2027m_id}/open"
              payload: {}
              as: PlanningLead
            - call: "POST /merchandise-seasons/${fw2027m_id}/close"
              payload: {}
              as: PlanningLead
              note: "no lots, holds, or plans reference FW2027 yet, so close is admitted; FW2027 is now CLOSED"
            - call: "POST /warehouses"
              payload: { warehouse_code: "WMT-DEN", pallet_capacity: 200, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_mt6_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_pa6_id}", warehouse_id: "${wh_mt6_id}", pallet_count: 2, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_hr_id: $.data.id, hold_hr_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: PlanningLead
          trigger:
            - call: "POST /packaway-holds/${hold_hr_id}/release"
              payload: { expected_hold_version: "${hold_hr_v}" }
              as: InventoryPlanner
              captures: { err_rel2: $.data.error_id }
          assert:
            - "the release fails with 422 ERR_TARGET_SEASON_NOT_OPEN: today is inside the window and at/after target start_date, but FW2027 status is CLOSED (not OPEN)"
            - "PackawayHold.${hold_hr_id}.status remains STORED and release_date is null"
            - "the hold's own version matches — the rejection is purely the cross-entity season-state gate"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: packaway_hold_release_window_inclusive_boundary
        grounds:
          - state_machines.PackawayHold.STORED_to_RELEASED
          - validations[priority=8]
          - errors.ERR_HOLD_WINDOW_CLOSED
        distinguishing_aspect: |
          Closed-interval semantics on the PackawayHold release window: both
          endpoints are inclusive, so release at exactly release_window_start
          succeeds while one day before fails — interval-occupation arithmetic
          on the hold resource (with the target season OPEN to isolate the
          window check).
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Season FW2027 start 2027-07-01 (DRAFT, opened later after SS2027 is closed with all lots terminal and holds released)."
            - "PACKAWAY lot PA7 ACCEPTED; hold HW1 window [2027-07-01, 2027-08-31], target FW2027, 2 pallets."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - call: "POST /merchandise-seasons"
              payload: { season_code: "FW2027", start_date: "2027-07-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z", department_otb_budget_cents: 5000000, packaway_reserve_ratio: 0.20 }
              as: PlanningLead
              captures: { fw2027n_id: $.data.id }
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "PA7", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z", target_season_id: "${fw2027n_id}" }
              as: Buyer
              captures: { lot_pa7_id: $.data.id }
            - call: "POST /lots/${lot_pa7_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_pa7_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /warehouses"
              payload: { warehouse_code: "WMT-DEN", pallet_capacity: 200, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_mt7_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_pa7_id}", warehouse_id: "${wh_mt7_id}", pallet_count: 2, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_hw1_id: $.data.id, hold_hw1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-30T00:00:00Z" }
              as: PlanningLead
          trigger:
            - call: "POST /packaway-holds/${hold_hw1_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
            - call: "POST /packaway-holds/${hold_hw1_id}/aging-review"
              payload: { trigger_reason: "DECISION_RELEASE" }
              as: InventoryPlanner
              captures: { err_pre: $.data.error_id }
            - call: "POST /packaway-holds/${hold_hw1_id}/aging-review"
              payload: { trigger_reason: "DECISION_KEEP" }
              as: InventoryPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: PlanningLead
            - call: "POST /packaway-holds/${hold_hw1_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
            - call: "POST /packaway-holds/${hold_hw1_id}/aging-review"
              payload: { trigger_reason: "DECISION_RELEASE" }
              as: InventoryPlanner
          assert:
            - "the DECISION_RELEASE at 2027-06-30 (one day before window start) fails with 422 ERR_HOLD_WINDOW_CLOSED and the hold stays AGING_REVIEW"
            - "the DECISION_RELEASE at 2027-07-01 (exactly release_window_start) succeeds — the lower bound is inclusive"
            - "PackawayHold.${hold_hw1_id}.status == RELEASED, release_date == 2027-07-01, and review_count == 4"
            - "accrued_holding_cost_cents == 101000 (303 days: 10 full months * 2 * 5000 + floor(10000*3/30) = 100000 + 1000)"

      - name: single_open_season_interval_exclusion
        grounds:
          - state_machines.MerchandiseSeason.DRAFT_to_OPEN
          - validations[priority=21]
          - errors.ERR_SEASON_ALREADY_OPEN
        distinguishing_aspect: |
          Singleton-occupancy semantics on the season resource — a different
          interval model than the hold's inclusive window: at most one season
          may occupy the OPEN slot at any instant regardless of whether the
          seasons' [start_date, end_date] windows overlap, so opening FW2028
          while SS2027 is OPEN fails even with fully disjoint dates.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Season FW2028 DRAFT with start 2028-08-01 (fully disjoint from SS2027's window)."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - call: "POST /merchandise-seasons"
              payload: { season_code: "FW2028", start_date: "2028-08-01T00:00:00Z", end_date: "2028-12-31T00:00:00Z", department_otb_budget_cents: 5000000, packaway_reserve_ratio: 0.20 }
              as: PlanningLead
              captures: { fw2028_id: $.data.id }
          trigger:
            - call: "POST /merchandise-seasons/${fw2028_id}/open"
              payload: {}
              as: PlanningLead
              captures: { err_open: $.data.error_id }
          assert:
            - "the open fails with 422 ERR_SEASON_ALREADY_OPEN even though FW2028's selling window does not overlap SS2027's at all"
            - "MerchandiseSeason.${fw2028_id}.status remains DRAFT"
            - "MerchandiseSeason.${ss2027_id}.status remains OPEN (singleton occupancy unchanged)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: allocation_supersede_preserves_unit_conservation
        grounds:
          - state_machines.AllocationPlan.DRAFT_to_SUPERSEDED
          - state_machines.AllocationPlan.APPROVED_to_EXECUTED
          - calculations.cluster_allocation
        distinguishing_aspect: |
          Conserved quantity: total units placed across StoreSkus. Approving
          plan P2 supersedes DRAFT plan P1 of the same lot; executing P2 must
          place exactly total_units across stores — the supersede compensation
          guarantees no units are placed by P1 and none are lost by P2.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor V1 STANDARD zone MT."
            - "IMMEDIATE lot LI1 asking 1000000 (landed 1150000) ACCEPTED; ticket for its line in MT."
            - "Stores: S1 URBAN_PREMIUM MT cap 60; S2 SUBURBAN_FAMILY MT cap 60. Plan P1 DRAFT (100 units, weights {URBAN_PREMIUM: 1, SUBURBAN_FAMILY: 1}), plan P2 created after, P2 approved."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "LI1", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_li1_id: $.data.id, lot_li1_v: $.data.version }
            - call: "POST /lots/${lot_li1_id}/lot-lines"
              payload: { style_code: "LI1-S", department: "APPAREL", quantity: 100, unit_cost_cents: 11500, compare_at_claim_cents: 15000, target_retail_cents: 5000 }
              as: Buyer
              captures: { line_li1_id: $.data.id }
            - call: "POST /lots/${lot_li1_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_li1_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_li1_id}", zone_code: "MT" }
              as: PricingAnalyst
            - call: "POST /stores"
              payload: { store_code: "S1-UP", cluster_code: "URBAN_PREMIUM", zone_code: "MT", storage_capacity_units: 60 }
              as: AllocationManager
            - call: "POST /stores"
              payload: { store_code: "S2-SF", cluster_code: "SUBURBAN_FAMILY", zone_code: "MT", storage_capacity_units: 60 }
              as: AllocationManager
            - call: "GET /lots/${lot_li1_id}"
              payload: {}
              as: AllocationManager
              captures: { lot_li1_v1: $.data.version }
            - call: "POST /allocation-plans"
              payload: { lot_id: "${lot_li1_id}", season_id: "${ss2027_id}", total_units: 100, cluster_weights: { URBAN_PREMIUM: 1.0, SUBURBAN_FAMILY: 1.0 }, expected_lot_version: "${lot_li1_v1}" }
              as: AllocationManager
              captures: { plan_p1_id: $.data.id }
            - call: "GET /lots/${lot_li1_id}"
              payload: {}
              as: AllocationManager
              captures: { lot_li1_v2: $.data.version }
            - call: "POST /allocation-plans"
              payload: { lot_id: "${lot_li1_id}", season_id: "${ss2027_id}", total_units: 100, cluster_weights: { URBAN_PREMIUM: 1.0, SUBURBAN_FAMILY: 1.0 }, expected_lot_version: "${lot_li1_v2}" }
              as: AllocationManager
              captures: { plan_p2_id: $.data.id }
            - call: "POST /allocation-plans/${plan_p2_id}/approve"
              payload: {}
              as: AllocationManager
          trigger:
            - call: "POST /allocation-plans/${plan_p2_id}/execute"
              payload: {}
              as: AllocationManager
            - call: "GET /allocation-plans/${plan_p1_id}"
              payload: {}
              as: AllocationManager
            - call: "GET /allocation-plans/${plan_p2_id}/store-skus"
              payload: {}
              as: AllocationManager
          assert:
            - "AllocationPlan.${plan_p1_id}.status == SUPERSEDED with superseded_by_id == ${plan_p2_id}"
            - "sum of units_on_hand over StoreSkus of plan ${plan_p2_id} == 100 (unit conservation: no unit lost or duplicated by the supersede-and-execute pair)"
            - "URBAN_PREMIUM cluster receives 50 units and SUBURBAN_FAMILY 50 units (largest-remainder with equal weights)"
            - "no StoreSku carries allocation_plan_id == ${plan_p1_id} (the superseded plan placed nothing)"

      - name: markdown_step_and_force_clearance_preserve_price_floor
        grounds:
          - calculations.markdown_cadence_step
          - state_machines.StoreSku.MARKED_DOWN_to_CLEARANCE
          - state_machines.StoreSku.ON_FLOOR_to_MARKED_DOWN
        distinguishing_aspect: |
          Conserved quantity of a different type: the markdown cadence and the
          force-clearance compensation together preserve the invariant that
          current_price_cents never drops below the clearance floor
          (round(0.30 * base) with 9-ending) and every step is recorded by
          exactly one MarkdownEvent — event count equals markdown_step plus one
          clearance transition.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor V1 STANDARD zone MT (cadence 4, clearance 12)."
            - "IMMEDIATE lot LM1 ACCEPTED; ticket base 10000 -> ticket_retail 9999; store S3 SUBURBAN_FAMILY MT; StoreSku SS3 floor_date 2026-09-01."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "LM1", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_lm1_id: $.data.id }
            - call: "POST /lots/${lot_lm1_id}/lot-lines"
              payload: { style_code: "LM1-S", department: "APPAREL", quantity: 100, unit_cost_cents: 11500, compare_at_claim_cents: 15000, target_retail_cents: 10000 }
              as: Buyer
              captures: { line_lm1_id: $.data.id }
            - call: "POST /lots/${lot_lm1_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_lm1_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_lm1_id}", zone_code: "MT" }
              as: PricingAnalyst
              captures: { ticket_lm1_id: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "S3-SF", cluster_code: "SUBURBAN_FAMILY", zone_code: "MT", storage_capacity_units: 500 }
              as: AllocationManager
              captures: { store_s3_id: $.data.id }
            - call: "POST /store-skus"
              payload: { store_id: "${store_s3_id}", lot_line_id: "${line_lm1_id}", ticket_id: "${ticket_lm1_id}", season_id: "${ss2027_id}", units_on_hand: 50 }
              as: StoreOpsLead
              captures: { ss3_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T00:00:00Z" }
              as: PlanningLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-27T00:00:00Z" }
              as: PlanningLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-24T00:00:00Z" }
              as: PlanningLead
            - call: "GET /store-skus/${ss3_id}"
              payload: {}
              as: StoreOpsLead
            - call: "GET /store-skus/${ss3_id}/markdown-events"
              payload: {}
              as: StoreOpsLead
          assert:
            - "StoreSku.${ss3_id}.markdown_step == 2 after sweeps at week 4 and week 8 (one step per sweep per SKU)"
            - "StoreSku.${ss3_id}.current_price_cents == 6309 after two cadence steps (9999 -> 7909 at step 1 -> 6309 at step 2, 9-ending per step)"
            - "at week 12 the sweep fires FORCE_CLEARANCE: current_price_cents == 2909 (round(0.30 * 9999) = 3000 -> 9-ending 2909) and status == CLEARANCE"
            - "MarkdownEvents count == 3 with event_types [CADENCE, CADENCE, FORCE_CLEARANCE] — every price change is witnessed by exactly one event"
            - "current_price_cents never falls below 2909 (clearance floor conserved)"
