          A different metric (measured_households against HOUSEHOLD_NORM) on a
          different endpoint (POST /playback-slots/{slotId}/air): the reach
          component is clipped by min(1, ...), so 999 households scores 49.95,
          1000 scores exactly 50.00, and 1001 also scores 50.00 — the value must
