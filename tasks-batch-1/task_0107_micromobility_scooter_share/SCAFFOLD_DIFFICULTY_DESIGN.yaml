              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_vehicles/${veh_id}/set_battery"
              payload: { battery_pct: 10 }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T10:01:30Z" }
