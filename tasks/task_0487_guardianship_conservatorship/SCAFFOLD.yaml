# =============================================================================
# Task 0487 — Guardianship & Conservatorship Case Management (Expert)
# SCAFFOLD.yaml — §1.0–§1.7
# Flat topology: every entity is a top-level collection under /gc; parent links
# travel as body foreign keys. Reverse-reachability is served by filtered-list
# GETs that accept the FK field as an optional query input.
# =============================================================================

scenario: |
  487. Guardianship & Conservatorship Case: petition & capacity evaluation,
  ward/protected-person & fiduciary appointment, inventory & annual accounting,
  budget & expenditure approval, bond & restricted account, visitation/care plan,
  court review & status report, termination/restoration

domain_name: guardianship-conservatorship
api_prefix: /gc

# Selected structural DNA for this benchmark.
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency      # OCC on GuardianshipCase.version guards expenditure create + budget approve
    - cascading_side_effects      # qualify -> case ACTIVE; terminate -> revoke/close cascade
    - dual_variant_calculation    # budget-projected vs chronological-actual accounting; statutory vs public-agency fee
    - rate_threshold_triggers     # bond tier breakpoints; expenditure court-approval threshold (> vs >=)
    - derived_field_reconciliation# Case.protection_posture; RestrictedAccount.available_balance_cents

  entity_topology: flat
  # No nested URL paths. Each of the 14 entities is its own collection under /gc.
  # Parent/peer relationships are foreign keys carried in request bodies and
  # exposed through filtered-list GETs (e.g. GET /gc/petitions?case_id=...).

  state_machine_shape: branching
  # Petition forks at READY_FOR_HEARING -> {GRANTED, DISMISSED}; Expenditure
  # branches on the court-approval threshold (auto-APPROVED vs PENDING_COURT);
  # AccountingReport has a revision cycle (SUBMITTED <-> RETURNED_FOR_CORRECTION);
  # GuardianshipCase is compound/posture-driven (children bubble up to ACTIVE).

  relationship_patterns:
    - one_to_many        # Case -> Petition, Appointment, Expenditure, AccountingReport, ...
    - cross_aggregate    # Expenditure debits Budget category AND RestrictedAccount
    - polymorphic        # CourtReview.subject_ref_id targets an AccountingReport or a CarePlan

  role_model: segregation_of_duties
  # Petitioner files; CourtExaminer authors+files the evaluation (and may not be
  # the petitioner); Judge adjudicates/approves/terminates (and may not be the
  # petitioner); Fiduciary submits operational artifacts but cannot approve them;
  # CourtClerk handles administrative registration and the logical clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  # ProtectedPerson — the alleged-incapacitated subject (ward / protected person).
  # Flat reference entity reused across petitions; carries adjudicated capacity.
  # ---------------------------------------------------------------------------
  - name: ProtectedPerson
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the protected person" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: annual_income_cents, type: integer, source: input, description: "Documented gross annual income in cents; drives bond sizing", constraints: ">= 0" }
      - { name: liquid_estate_cents, type: integer, source: input, description: "Liquid personal property value in cents at intake; drives bond sizing", constraints: ">= 0" }
      - { name: capacity_status, type: enum, source: computed, description: "PRESUMED_COMPETENT | ADJUDICATED_INCAPACITATED | RESTORED — set by grant/restoration, never by input", constraints: "PRESUMED_COMPETENT|ADJUDICATED_INCAPACITATED|RESTORED" }
      - { name: active_case_id, type: string, source: computed, description: "Id of the GuardianshipCase currently protecting this person, or null; enforces one-active-case uniqueness" }

  # ---------------------------------------------------------------------------
  # Fiduciary — a candidate/appointed guardian or conservator. Identity-backed.
  # ---------------------------------------------------------------------------
  - name: Fiduciary
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Fiduciary legal name" }
      - { name: fiduciary_kind, type: enum, source: input, description: "FAMILY | PROFESSIONAL | PUBLIC_AGENCY — affects fee schedule selection", constraints: "FAMILY|PROFESSIONAL|PUBLIC_AGENCY" }
      - { name: is_disqualified, type: boolean, source: computed, description: "True once removed for cause; blocks future appointments", default: false }
      - { name: open_appointment_count, type: integer, source: computed, description: "Count of this fiduciary's Appointments currently in ACTIVE state across all cases", default: 0 }

  # ---------------------------------------------------------------------------
  # GuardianshipCase — aggregate root. Posture-driven derived state gates ops.
  # ---------------------------------------------------------------------------
  - name: GuardianshipCase
    parent: null
    common_fields: true
    fields:
      - { name: protected_person_id, type: string, source: input, description: "FK -> ProtectedPerson.id" }
      - { name: case_type, type: enum, source: input, description: "GUARDIANSHIP (person) | CONSERVATORSHIP (estate) | PLENARY (both)", constraints: "GUARDIANSHIP|CONSERVATORSHIP|PLENARY" }
      - { name: status, type: enum, source: computed, description: "DRAFT | PENDING_EVALUATION | AWAITING_APPOINTMENT | ACTIVE | UNDER_REVIEW | TERMINATED | RESTORED", constraints: "DRAFT|PENDING_EVALUATION|AWAITING_APPOINTMENT|ACTIVE|UNDER_REVIEW|TERMINATED|RESTORED" }
      - { name: protection_posture, type: enum, source: computed, description: "GREEN | AMBER | RED — derived gate over child operations; recomputed on any child change (see calc case_protection_posture)", constraints: "GREEN|AMBER|RED" }
      - { name: requires_bond, type: boolean, source: computed, description: "True when case_type is CONSERVATORSHIP or PLENARY (estate authority sought)" }
      - { name: next_accounting_due_iso, type: string, source: computed, description: "ISO datetime of the next annual accounting due date; set on qualify, advanced on accounting approval" }
      - { name: overdue_accounting_count, type: integer, source: computed, description: "Number of accounting periods past due and not yet APPROVED; feeds posture", default: 0 }

  # ---------------------------------------------------------------------------
  # Petition — request to open the case. Branching state machine.
  # ---------------------------------------------------------------------------
  - name: Petition
    parent: GuardianshipCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> GuardianshipCase.id" }
      - { name: petitioner_user_id, type: string, source: system, description: "X-User-ID of the Petitioner who filed (audit; drives segregation-of-duties)" }
      - { name: nominated_fiduciary_id, type: string, source: input, description: "FK -> Fiduciary.id; the fiduciary the petition nominates" }
      - { name: requested_authority, type: enum, source: input, description: "PERSON | ESTATE | BOTH — scope of authority requested", constraints: "PERSON|ESTATE|BOTH" }
      - { name: alleged_grounds, type: string, source: input, description: "Free-text statement of alleged incapacity grounds" }
      - { name: status, type: enum, source: computed, description: "FILED | PROBABLE_CAUSE | EVALUATION_ORDERED | READY_FOR_HEARING | GRANTED | DISMISSED", constraints: "FILED|PROBABLE_CAUSE|EVALUATION_ORDERED|READY_FOR_HEARING|GRANTED|DISMISSED" }

  # ---------------------------------------------------------------------------
  # CapacityEvaluation — court-examiner finding on the petition.
  # ---------------------------------------------------------------------------
  - name: CapacityEvaluation
    parent: Petition
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id" }
      - { name: examiner_user_id, type: string, source: system, description: "X-User-ID of the CourtExaminer who authored it (audit; segregation-of-duties)" }
      - { name: finding, type: enum, source: input, description: "INCAPACITATED | PARTIALLY_INCAPACITATED | COMPETENT — examiner conclusion", constraints: "INCAPACITATED|PARTIALLY_INCAPACITATED|COMPETENT" }
      - { name: recommended_scope, type: enum, source: input, description: "NONE | PERSON | ESTATE | BOTH — least-restrictive scope recommended", constraints: "NONE|PERSON|ESTATE|BOTH" }
      - { name: status, type: enum, source: computed, description: "DRAFT | FILED — FILED locks the evaluation and bubbles the petition forward", constraints: "DRAFT|FILED" }

  # ---------------------------------------------------------------------------
  # Appointment — links a Fiduciary to a Case with granted authority scope.
  # ---------------------------------------------------------------------------
  - name: Appointment
    parent: GuardianshipCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> GuardianshipCase.id" }
      - { name: fiduciary_id, type: string, source: input, description: "FK -> Fiduciary.id" }
      - { name: granted_authority, type: enum, source: system, description: "PERSON | ESTATE | BOTH — copied from the granted petition; cannot exceed evaluation recommended_scope", constraints: "PERSON|ESTATE|BOTH" }
      - { name: letters_issued_iso, type: string, source: system, description: "ISO datetime letters of appointment were issued (= server clock at qualify)" }
      - { name: status, type: enum, source: computed, description: "PENDING_QUALIFICATION | ACTIVE | SUSPENDED | REVOKED", constraints: "PENDING_QUALIFICATION|ACTIVE|SUSPENDED|REVOKED" }

  # ---------------------------------------------------------------------------
  # Bond — surety bond required before an estate-authority fiduciary qualifies.
  # ---------------------------------------------------------------------------
  - name: Bond
    parent: Appointment
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id" }
      - { name: required_amount_cents, type: integer, source: computed, description: "Court-required penal sum in cents (see calc bond_amount_required)" }
      - { name: posted_amount_cents, type: integer, source: input, description: "Penal sum the surety actually posts; must be >= required_amount_cents to qualify", default: 0, constraints: ">= 0" }
      - { name: surety_name, type: string, source: input, description: "Name of the surety company or personal surety" }
      - { name: status, type: enum, source: computed, description: "REQUIRED | POSTED | APPROVED | EXONERATED", constraints: "REQUIRED|POSTED|APPROVED|EXONERATED" }

  # ---------------------------------------------------------------------------
  # RestrictedAccount — court-blocked account holding the protected estate.
  # ---------------------------------------------------------------------------
  - name: RestrictedAccount
    parent: GuardianshipCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> GuardianshipCase.id" }
      - { name: institution_name, type: string, source: input, description: "Depository institution name" }
      - { name: principal_balance_cents, type: integer, source: computed, description: "Funds on deposit; credited by inventory funding and accounting income, debited by disbursements", default: 0 }
      - { name: encumbered_cents, type: integer, source: computed, description: "Sum of expenditure amounts in APPROVED-but-not-DISBURSED state (held against the account)", default: 0 }
      - { name: available_balance_cents, type: integer, source: computed, description: "= principal_balance_cents - encumbered_cents; the spendable figure (see calc restricted_account_available)", default: 0 }
      - { name: status, type: enum, source: computed, description: "OPEN | FROZEN | CLOSED — FROZEN blocks disbursement; CLOSED on case termination", constraints: "OPEN|FROZEN|CLOSED" }

  # ---------------------------------------------------------------------------
  # Inventory — initial sworn inventory of the estate.
  # ---------------------------------------------------------------------------
  - name: Inventory
    parent: GuardianshipCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> GuardianshipCase.id" }
      - { name: real_property_cents, type: integer, source: input, description: "Appraised real property value in cents", constraints: ">= 0" }
      - { name: liquid_assets_cents, type: integer, source: input, description: "Cash and liquid assets in cents funded into the restricted account on approval", constraints: ">= 0" }
      - { name: tangible_property_cents, type: integer, source: input, description: "Tangible personal property value in cents", constraints: ">= 0" }
      - { name: total_estate_cents, type: integer, source: computed, description: "= real_property_cents + liquid_assets_cents + tangible_property_cents" }
      - { name: status, type: enum, source: computed, description: "DRAFT | FILED | APPROVED — APPROVED funds liquid_assets into the restricted account", constraints: "DRAFT|FILED|APPROVED" }

  # ---------------------------------------------------------------------------
  # Budget — annual spending plan with per-category caps.
  # ---------------------------------------------------------------------------
  - name: Budget
    parent: GuardianshipCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> GuardianshipCase.id" }
      - { name: period_year, type: integer, source: input, description: "Calendar year this budget governs (e.g. 2026)" }
      - { name: care_cap_cents, type: integer, source: input, description: "Annual cap for CARE-category expenditures in cents", constraints: ">= 0" }
      - { name: medical_cap_cents, type: integer, source: input, description: "Annual cap for MEDICAL-category expenditures in cents", constraints: ">= 0" }
      - { name: admin_cap_cents, type: integer, source: input, description: "Annual cap for ADMIN-category (incl. fiduciary fee) expenditures in cents", constraints: ">= 0" }
      - { name: care_spent_cents, type: integer, source: computed, description: "Sum of DISBURSED expenditures in CARE charged to this budget", default: 0 }
      - { name: medical_spent_cents, type: integer, source: computed, description: "Sum of DISBURSED expenditures in MEDICAL charged to this budget", default: 0 }
      - { name: admin_spent_cents, type: integer, source: computed, description: "Sum of DISBURSED expenditures in ADMIN charged to this budget", default: 0 }
      - { name: status, type: enum, source: computed, description: "DRAFT | SUBMITTED | APPROVED | SUPERSEDED — only APPROVED budget governs spending", constraints: "DRAFT|SUBMITTED|APPROVED|SUPERSEDED" }

  # ---------------------------------------------------------------------------
  # Expenditure — a single spend request. Branches on court-approval threshold.
  # ---------------------------------------------------------------------------
  - name: Expenditure
    parent: GuardianshipCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> GuardianshipCase.id" }
      - { name: budget_id, type: string, source: input, description: "FK -> Budget.id; the approved budget this charges against" }
      - { name: category, type: enum, source: input, description: "CARE | MEDICAL | ADMIN — which budget cap and ledger this draws from", constraints: "CARE|MEDICAL|ADMIN" }
      - { name: amount_cents, type: integer, source: input, description: "Requested disbursement amount in cents", constraints: "> 0" }
      - { name: payee_name, type: string, source: input, description: "Name of the payee" }
      - { name: requires_court_approval, type: boolean, source: computed, description: "True when amount_cents > COURT_APPROVAL_THRESHOLD_CENTS or category == ADMIN (see calc expenditure_routing)" }
      - { name: disbursed_at, type: string, source: system, description: "ISO datetime the expenditure entered DISBURSED (= server clock); null until then; drives accounting period bucketing" }
      - { name: status, type: enum, source: computed, description: "REQUESTED | PENDING_COURT | APPROVED | DISBURSED | DENIED", constraints: "REQUESTED|PENDING_COURT|APPROVED|DISBURSED|DENIED" }

  # ---------------------------------------------------------------------------
  # AccountingReport — periodic accounting; dual-variant reconciliation lives here.
  # ---------------------------------------------------------------------------
  - name: AccountingReport
    parent: GuardianshipCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> GuardianshipCase.id" }
      - { name: period_year, type: integer, source: input, description: "Accounting period (calendar year)" }
      - { name: opening_balance_cents, type: integer, source: input, description: "Sworn opening principal at period start, in cents", constraints: ">= 0" }
      - { name: reported_income_cents, type: integer, source: input, description: "Income received during the period, in cents", constraints: ">= 0" }
      - { name: reported_disbursed_cents, type: integer, source: input, description: "Disbursements the fiduciary reports for the period, in cents", constraints: ">= 0" }
      - { name: ledger_disbursed_cents, type: integer, source: computed, description: "System-computed sum of DISBURSED expenditures in period (chronological variant); compared to reported", default: 0 }
      - { name: projected_disbursed_cents, type: integer, source: computed, description: "Budget-projected disbursement for the period (forward-looking variant)", default: 0 }
      - { name: variance_cents, type: integer, source: computed, description: "= reported_disbursed_cents - ledger_disbursed_cents; beyond tolerance blocks approval (see calc accounting_reconciliation)", default: 0 }
      - { name: fiduciary_fee_cents, type: integer, source: computed, description: "Fiduciary commission for the period (see calc fiduciary_fee)", default: 0 }
      - { name: status, type: enum, source: computed, description: "DRAFT | SUBMITTED | RETURNED_FOR_CORRECTION | APPROVED — revision cycle between SUBMITTED and RETURNED_FOR_CORRECTION", constraints: "DRAFT|SUBMITTED|RETURNED_FOR_CORRECTION|APPROVED" }

  # ---------------------------------------------------------------------------
  # CarePlan — visitation / care plan for a person-authority case.
  # ---------------------------------------------------------------------------
  - name: CarePlan
    parent: GuardianshipCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> GuardianshipCase.id" }
      - { name: residence_type, type: enum, source: input, description: "HOME | ASSISTED_LIVING | NURSING_FACILITY | HOSPITAL", constraints: "HOME|ASSISTED_LIVING|NURSING_FACILITY|HOSPITAL" }
      - { name: visitation_min_per_month, type: integer, source: input, description: "Minimum in-person visits the fiduciary commits to per month", constraints: ">= 0" }
      - { name: window_start_iso, type: string, source: input, description: "ISO datetime the plan's coverage window opens (inclusive lower bound)" }
      - { name: window_end_iso, type: string, source: input, description: "ISO datetime the plan's coverage window closes (exclusive upper bound)" }
      - { name: status, type: enum, source: computed, description: "DRAFT | ACTIVE | EXPIRED | REPLACED — ACTIVE plans must tile the timeline without overlap", constraints: "DRAFT|ACTIVE|EXPIRED|REPLACED" }

  # ---------------------------------------------------------------------------
  # CourtReview — periodic status report / review over a polymorphic subject.
  # ---------------------------------------------------------------------------
  - name: CourtReview
    parent: GuardianshipCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> GuardianshipCase.id" }
      - { name: subject_kind, type: enum, source: input, description: "ACCOUNTING | CARE_PLAN — which kind of subject this review targets", constraints: "ACCOUNTING|CARE_PLAN" }
      - { name: subject_ref_id, type: string, source: input, description: "Id of the AccountingReport or CarePlan under review (polymorphic; resolved per subject_kind, must belong to the same case)" }
      - { name: review_window_start_iso, type: string, source: input, description: "ISO datetime the review window opens (inclusive lower bound)" }
      - { name: review_window_end_iso, type: string, source: input, description: "ISO datetime the review window closes (exclusive upper bound)" }
      - { name: outcome, type: enum, source: computed, description: "PENDING | ACCEPTED | CONTINUED | SANCTIONED — set on disposition", constraints: "PENDING|ACCEPTED|CONTINUED|SANCTIONED" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | HELD | CLOSED — review lifecycle", constraints: "SCHEDULED|HELD|CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Petition: branching (probable-cause path; grant/dismiss fork) ----
  - entity: Petition
    initial_state: FILED
    terminal_states: [GRANTED, DISMISSED]
    transitions:
      - from: FILED
        to: PROBABLE_CAUSE
        trigger: "POST /gc/petitions/{id}/find-probable-cause"
        actor: Judge
        preconditions:
          - "Petition.status == FILED (else ERR_INVALID_STATE)"
        side_effects:
          - "GuardianshipCase.status: DRAFT -> PENDING_EVALUATION"
      - from: PROBABLE_CAUSE
        to: EVALUATION_ORDERED
        trigger: "POST /gc/petitions/{id}/order-evaluation"
        actor: Judge
        preconditions:
          - "Petition.status == PROBABLE_CAUSE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: EVALUATION_ORDERED
        to: READY_FOR_HEARING
        trigger: "system: the petition's CapacityEvaluation transitions DRAFT -> FILED"
        actor: system
        preconditions:
          - "Petition.status == EVALUATION_ORDERED"
          - "The CapacityEvaluation being filed belongs to this petition"
        side_effects:
          - "Petition advances automatically when its evaluation is FILED (bubble up)"
      - from: READY_FOR_HEARING
        to: GRANTED
        trigger: "POST /gc/petitions/{id}/grant"
        actor: Judge
        preconditions:
          - "Petition.status == READY_FOR_HEARING (else ERR_INVALID_STATE)"
          - "Judge's X-User-ID != petitioner_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "The petition's filed CapacityEvaluation.finding != COMPETENT (else ERR_EVALUATION_FINDS_COMPETENT)"
          - "requested_authority is covered by the evaluation recommended_scope (else ERR_SCOPE_EXCEEDS_RECOMMENDATION)"
        side_effects:
          - "GuardianshipCase.status: PENDING_EVALUATION -> AWAITING_APPOINTMENT"
          - "ProtectedPerson.capacity_status -> ADJUDICATED_INCAPACITATED"
      - from: READY_FOR_HEARING
        to: DISMISSED
        trigger: "POST /gc/petitions/{id}/dismiss"
        actor: Judge
        preconditions:
          - "Petition.status == READY_FOR_HEARING (else ERR_INVALID_STATE)"
          - "Judge's X-User-ID != petitioner_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "GuardianshipCase.status -> TERMINATED (no protection ordered)"
          - "ProtectedPerson.active_case_id -> null"
      - from: PROBABLE_CAUSE
        to: DISMISSED
        trigger: "POST /gc/petitions/{id}/dismiss"
        actor: Judge
        preconditions:
          - "Petition.status == PROBABLE_CAUSE (else ERR_INVALID_STATE)"
          - "Judge's X-User-ID != petitioner_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "GuardianshipCase.status -> TERMINATED (no protection ordered)"
          - "ProtectedPerson.active_case_id -> null"

  # ---- CapacityEvaluation: DRAFT -> FILED; FILED bubbles up to Petition ----
  - entity: CapacityEvaluation
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /gc/evaluations/{id}/file"
        actor: CourtExaminer
        preconditions:
          - "CapacityEvaluation.status == DRAFT (else ERR_INVALID_STATE)"
          - "Parent Petition.status == EVALUATION_ORDERED (else ERR_EVALUATION_NOT_ORDERED)"
          - "examiner_user_id (author) != parent Petition.petitioner_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Parent Petition: EVALUATION_ORDERED -> READY_FOR_HEARING (bubble up)"

  # ---- GuardianshipCase: compound / posture-driven lifecycle ----
  - entity: GuardianshipCase
    initial_state: DRAFT
    terminal_states: [TERMINATED, RESTORED]
    transitions:
      - from: AWAITING_APPOINTMENT
        to: ACTIVE
        trigger: "system: an Appointment on this case transitions PENDING_QUALIFICATION -> ACTIVE (via qualify)"
        actor: system
        preconditions:
          - "GuardianshipCase.status == AWAITING_APPOINTMENT"
        side_effects:
          - "next_accounting_due_iso = letters_issued_iso + ACCOUNTING_PERIOD_DAYS"
          - "protection_posture recomputed"
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /gc/cases/{id}/open-review"
        actor: Judge
        preconditions:
          - "GuardianshipCase.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "protection_posture recomputed"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /gc/cases/{id}/close-review"
        actor: Judge
        preconditions:
          - "GuardianshipCase.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "No CourtReview on this case in SCHEDULED or HELD status (else ERR_OPEN_REVIEW_PENDING)"
        side_effects:
          - "protection_posture recomputed"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /gc/cases/{id}/terminate"
        actor: Judge
        preconditions:
          - "GuardianshipCase.status == ACTIVE (else ERR_INVALID_STATE)"
          - "No Expenditure on the case in PENDING_COURT or APPROVED status (else ERR_PENDING_EXPENDITURES)"
          - "If any AccountingReport exists, the one with the greatest period_year is APPROVED (else ERR_ACCOUNTING_OUTSTANDING)"
        side_effects:
          - "Every ACTIVE or SUSPENDED Appointment on the case -> REVOKED"
          - "Each newly-REVOKED Appointment that was ACTIVE decrements its Fiduciary.open_appointment_count by 1"
          - "Each such Appointment's APPROVED Bond -> EXONERATED"
          - "Every OPEN/FROZEN RestrictedAccount on the case -> CLOSED"
          - "ProtectedPerson.active_case_id -> null"
          - "ProtectedPerson.capacity_status unchanged (remains ADJUDICATED_INCAPACITATED)"
      - from: UNDER_REVIEW
        to: TERMINATED
        trigger: "POST /gc/cases/{id}/terminate"
        actor: Judge
        preconditions:
          - "GuardianshipCase.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "No Expenditure on the case in PENDING_COURT or APPROVED status (else ERR_PENDING_EXPENDITURES)"
          - "If any AccountingReport exists, the one with the greatest period_year is APPROVED (else ERR_ACCOUNTING_OUTSTANDING)"
        side_effects:
          - "Same cascade as ACTIVE -> TERMINATED"
      - from: UNDER_REVIEW
        to: RESTORED
        trigger: "POST /gc/cases/{id}/restore"
        actor: Judge
        preconditions:
          - "GuardianshipCase.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "A CourtReview on this case has outcome == ACCEPTED and status == CLOSED (else ERR_RESTORATION_NOT_REVIEWED)"
          - "No Expenditure on the case in PENDING_COURT or APPROVED status (else ERR_PENDING_EXPENDITURES)"
        side_effects:
          - "Every ACTIVE or SUSPENDED Appointment on the case -> REVOKED"
          - "Each newly-REVOKED Appointment that was ACTIVE decrements its Fiduciary.open_appointment_count by 1"
          - "Each such Appointment's APPROVED Bond -> EXONERATED"
          - "Every OPEN/FROZEN RestrictedAccount on the case -> CLOSED"
          - "ProtectedPerson.capacity_status -> RESTORED"
          - "ProtectedPerson.active_case_id -> null"

  # ---- Appointment: qualification pipeline + suspend/reinstate/remove ----
  - entity: Appointment
    initial_state: PENDING_QUALIFICATION
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_QUALIFICATION
        to: ACTIVE
        trigger: "POST /gc/appointments/{id}/qualify"
        actor: Judge
        preconditions:
          - "Appointment.status == PENDING_QUALIFICATION (else ERR_INVALID_STATE)"
          - "GuardianshipCase.status == AWAITING_APPOINTMENT (else ERR_INVALID_STATE)"
          - "Fiduciary.is_disqualified == false (else ERR_FIDUCIARY_DISQUALIFIED)"
          - "If GuardianshipCase.requires_bond: the appointment's Bond.status == APPROVED (else ERR_BOND_NOT_APPROVED)"
        side_effects:
          - "letters_issued_iso = server clock now"
          - "Fiduciary.open_appointment_count += 1"
          - "GuardianshipCase: AWAITING_APPOINTMENT -> ACTIVE (bubble up)"
          - "GuardianshipCase.next_accounting_due_iso set (= letters_issued_iso + ACCOUNTING_PERIOD_DAYS)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /gc/appointments/{id}/suspend"
        actor: Judge
        preconditions:
          - "Appointment.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Every OPEN RestrictedAccount on the case -> FROZEN (disbursement blocked while suspended)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /gc/appointments/{id}/reinstate"
        actor: Judge
        preconditions:
          - "Appointment.status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "Every FROZEN RestrictedAccount on the case -> OPEN"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /gc/appointments/{id}/remove"
        actor: Judge
        preconditions:
          - "Appointment.status IN {ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects:
          - "If request for_cause == true: Fiduciary.is_disqualified -> true"
          - "Fiduciary.open_appointment_count -= 1 (was ACTIVE)"
          - "The appointment's Bond, if APPROVED, -> EXONERATED"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /gc/appointments/{id}/remove"
        actor: Judge
        preconditions:
          - "Appointment.status IN {ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects:
          - "If request for_cause == true: Fiduciary.is_disqualified -> true"
          - "Fiduciary.open_appointment_count -= 1 was already decremented at suspend? No: count tracks ACTIVE; SUSPENDED still counts as open, so decrement here too"
          - "The appointment's Bond, if APPROVED, -> EXONERATED"

  # ---- Bond: posting & approval pipeline ----
  - entity: Bond
    initial_state: REQUIRED
    terminal_states: [EXONERATED]
    transitions:
      - from: REQUIRED
        to: POSTED
        trigger: "POST /gc/bonds/{id}/post"
        actor: Fiduciary
        preconditions:
          - "Bond.status == REQUIRED (else ERR_INVALID_STATE)"
          - "posted_amount_cents >= required_amount_cents (else ERR_BOND_INSUFFICIENT)"
        side_effects: []
      - from: POSTED
        to: APPROVED
        trigger: "POST /gc/bonds/{id}/approve"
        actor: Judge
        preconditions:
          - "Bond.status == POSTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: POSTED
        to: REQUIRED
        trigger: "POST /gc/bonds/{id}/reject"
        actor: Judge
        preconditions:
          - "Bond.status == POSTED (else ERR_INVALID_STATE)"
        side_effects: ["posted_amount_cents reset to 0"]
      - from: APPROVED
        to: EXONERATED
        trigger: "system: parent Appointment -> REVOKED"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Inventory: filing pipeline; APPROVED funds restricted account ----
  - entity: Inventory
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /gc/inventories/{id}/file"
        actor: Fiduciary
        preconditions:
          - "Inventory.status == DRAFT (else ERR_INVALID_STATE)"
          - "GuardianshipCase.status == ACTIVE (else ERR_CASE_NOT_ACTIVE)"
        side_effects: []
      - from: FILED
        to: APPROVED
        trigger: "POST /gc/inventories/{id}/approve"
        actor: Judge
        preconditions:
          - "Inventory.status == FILED (else ERR_INVALID_STATE)"
          - "An OPEN RestrictedAccount exists on the case (else ERR_NO_RESTRICTED_ACCOUNT)"
        side_effects:
          - "RestrictedAccount.principal_balance_cents += Inventory.liquid_assets_cents"
          - "RestrictedAccount.available_balance_cents recomputed"

  # ---- Budget: submit/approve; approval supersedes prior same-year approved ----
  - entity: Budget
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /gc/budgets/{id}/submit"
        actor: Fiduciary
        preconditions:
          - "Budget.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /gc/budgets/{id}/approve"
        actor: Judge
        preconditions:
          - "Budget.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "GuardianshipCase.status == ACTIVE (else ERR_CASE_NOT_ACTIVE)"
          - "expected_case_version == GuardianshipCase.version (else ERR_STALE_CASE_VERSION)"
        side_effects:
          - "Any other APPROVED Budget on the case for the same period_year -> SUPERSEDED"
          - "increments GuardianshipCase.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a newer Budget for the same period_year is APPROVED"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Expenditure: branching on court-approval threshold + disbursement ----
  - entity: Expenditure
    initial_state: REQUESTED
    terminal_states: [DISBURSED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "system: on POST /gc/expenditures when requires_court_approval == false"
        actor: system
        preconditions:
          - "requires_court_approval == false"
          - "An APPROVED Budget (budget_id) governs and category cap not exceeded by disbursed+held+amount (else ERR_BUDGET_CAP_EXCEEDED)"
          - "RestrictedAccount.available_balance_cents >= amount_cents (else ERR_INSUFFICIENT_RESTRICTED_FUNDS)"
        side_effects:
          - "RestrictedAccount.encumbered_cents += amount_cents"
          - "RestrictedAccount.available_balance_cents recomputed"
      - from: REQUESTED
        to: PENDING_COURT
        trigger: "system: on POST /gc/expenditures when requires_court_approval == true"
        actor: system
        preconditions:
          - "requires_court_approval == true"
        side_effects: []
      - from: PENDING_COURT
        to: APPROVED
        trigger: "POST /gc/expenditures/{id}/approve"
        actor: Judge
        preconditions:
          - "Expenditure.status == PENDING_COURT (else ERR_INVALID_STATE)"
          - "An APPROVED Budget governs and category cap not exceeded by disbursed+held+amount (else ERR_BUDGET_CAP_EXCEEDED)"
          - "RestrictedAccount.available_balance_cents >= amount_cents (else ERR_INSUFFICIENT_RESTRICTED_FUNDS)"
        side_effects:
          - "RestrictedAccount.encumbered_cents += amount_cents"
          - "RestrictedAccount.available_balance_cents recomputed"
      - from: PENDING_COURT
        to: DENIED
        trigger: "POST /gc/expenditures/{id}/deny"
        actor: Judge
        preconditions:
          - "Expenditure.status == PENDING_COURT (else ERR_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /gc/expenditures/{id}/disburse"
        actor: Fiduciary
        preconditions:
          - "Expenditure.status == APPROVED (else ERR_INVALID_STATE)"
          - "RestrictedAccount.status == OPEN (else ERR_ACCOUNT_FROZEN)"
        side_effects:
          - "disbursed_at = server clock now"
          - "RestrictedAccount.encumbered_cents -= amount_cents"
          - "RestrictedAccount.principal_balance_cents -= amount_cents"
          - "RestrictedAccount.available_balance_cents recomputed (net change zero: encumbered and principal both fall by amount)"
          - "Budget.<category>_spent_cents += amount_cents"
      - from: APPROVED
        to: DENIED
        trigger: "POST /gc/expenditures/{id}/deny"
        actor: Judge
        preconditions:
          - "Expenditure.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "RestrictedAccount.encumbered_cents -= amount_cents (release the hold)"
          - "RestrictedAccount.available_balance_cents recomputed"

  # ---- AccountingReport: revision cycle (cyclic) ----
  - entity: AccountingReport
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /gc/accountings/{id}/submit"
        actor: Fiduciary
        preconditions:
          - "AccountingReport.status == DRAFT (else ERR_INVALID_STATE)"
          - "GuardianshipCase.status IN {ACTIVE, UNDER_REVIEW} (else ERR_CASE_NOT_ACTIVE)"
        side_effects:
          - "ledger_disbursed_cents recomputed (chronological variant; calc accounting_reconciliation)"
          - "projected_disbursed_cents recomputed (forward-looking variant; calc projected_disbursed_cents)"
          - "variance_cents = reported_disbursed_cents - ledger_disbursed_cents"
          - "fiduciary_fee_cents recomputed (calc fiduciary_fee)"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /gc/accountings/{id}/return"
        actor: Judge
        preconditions:
          - "AccountingReport.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /gc/accountings/{id}/resubmit"
        actor: Fiduciary
        preconditions:
          - "AccountingReport.status == RETURNED_FOR_CORRECTION (else ERR_INVALID_STATE)"
        side_effects:
          - "supplied corrected fields applied, then ledger/projection/variance/fee recomputed"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /gc/accountings/{id}/approve"
        actor: Judge
        preconditions:
          - "AccountingReport.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "abs(variance_cents) <= VARIANCE_TOLERANCE_CENTS (else ERR_ACCOUNTING_VARIANCE)"
        side_effects:
          - "GuardianshipCase.next_accounting_due_iso advanced by ACCOUNTING_PERIOD_DAYS"
          - "GuardianshipCase.overdue_accounting_count recomputed"
          - "RestrictedAccount.principal_balance_cents += reported_income_cents (period income credited once)"
          - "RestrictedAccount.available_balance_cents recomputed"
          - "GuardianshipCase.protection_posture recomputed"

  # ---- CarePlan: activation + temporal tiling; replace; expiry ----
  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [EXPIRED, REPLACED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /gc/care-plans/{id}/activate"
        actor: Fiduciary
        preconditions:
          - "CarePlan.status == DRAFT (else ERR_INVALID_STATE)"
          - "GuardianshipCase.status == ACTIVE (else ERR_CASE_NOT_ACTIVE)"
          - "window_start_iso < window_end_iso (else ERR_INVALID_WINDOW)"
          - "[window_start_iso, window_end_iso) does not overlap any ACTIVE CarePlan on the same case (else ERR_CARE_PLAN_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: REPLACED
        trigger: "POST /gc/care-plans/{id}/replace"
        actor: Fiduciary
        preconditions:
          - "CarePlan.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: server clock now >= window_end_iso (re-derived on read/operation)"
        actor: system
        preconditions:
          - "server clock now >= window_end_iso"
        side_effects: []

  # ---- CourtReview: scheduling + disposition pipeline ----
  - entity: CourtReview
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /gc/reviews/{id}/hold"
        actor: Judge
        preconditions:
          - "CourtReview.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "GuardianshipCase.status == UNDER_REVIEW (else ERR_CASE_NOT_UNDER_REVIEW)"
          - "server clock now >= review_window_start_iso (else ERR_REVIEW_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: HELD
        to: CLOSED
        trigger: "POST /gc/reviews/{id}/dispose"
        actor: Judge
        preconditions:
          - "CourtReview.status == HELD (else ERR_INVALID_STATE)"
          - "outcome in {ACCEPTED, CONTINUED, SANCTIONED} provided in request (else ERR_INVALID_REQUEST)"
        side_effects:
          - "outcome set from request"
          - "if outcome == SANCTIONED and subject_kind == ACCOUNTING and the subject AccountingReport.status == SUBMITTED: that report -> RETURNED_FOR_CORRECTION"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: expenditure-create-stale-case
    parent_entity: GuardianshipCase
    write_endpoint: "POST /gc/expenditures"
    occ_field: "expected_case_version"
    description: |
      Creating an Expenditure against a GuardianshipCase whose version has
      advanced since the client last observed it is rejected. A prior write
      (another expenditure reaching APPROVED and encumbering funds, an accounting
      approval crediting income, or an appointment suspension freezing the
      account) legitimately changes the case's spendable restricted balance, so
      the current writer's view is stale and the new charge must be re-derived
      against the advanced version.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: budget-approve-stale-case
    parent_entity: GuardianshipCase
    write_endpoint: "POST /gc/budgets/{id}/approve"
    occ_field: "expected_case_version"
    description: |
      Approving a Budget against a GuardianshipCase whose version has advanced
      since the client last observed it is rejected. Another budget for the same
      period may have just been approved (which would supersede this one), so the
      approver's view of the governing budget is stale and must be re-derived
      against the advanced case version.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- Dual-variant #1 — entity domain: AccountingReport / case ledger ----
  - name: accounting_reconciliation
    trigger: "AccountingReport DRAFT->SUBMITTED and RETURNED_FOR_CORRECTION->SUBMITTED"
    algorithm: chronological
    formula: |
      # Chronological (actual) variant — ledger_disbursed_cents:
      ledger_disbursed_cents = sum(e.amount_cents
        for e in Expenditures where e.case_id == this.case_id
          and e.status == DISBURSED
          and year_of(e.disbursed_at) == AccountingReport.period_year)
      # Build the running ledger in ascending (disbursed_at, created_at) order so
      # the trace is deterministic; created_at breaks ties, never id.
      variance_cents = AccountingReport.reported_disbursed_cents - ledger_disbursed_cents
    input_set: "Expenditures on this case with status == DISBURSED whose disbursed-year == period_year"
    constants:
      VARIANCE_TOLERANCE_CENTS: 500   # +/- $5.00 tolerance before approval is blocked
    precision: "integer cents, no rounding"
    variants:
      - name: chronological_actual
        when: "computed at every submit; this is the audited figure compared to reported_disbursed_cents"
        difference: "Sums what was actually DISBURSED in period order; the running ledger is ordered by (disbursed_at, created_at)."
      - name: forward_looking_projection
        when: "computed alongside as projected_disbursed_cents (see next calc)"
        difference: "Uses APPROVED budget caps rather than actual disbursements, so it diverges from chronological_actual whenever spend != plan."

  - name: projected_disbursed_cents
    trigger: "AccountingReport DRAFT->SUBMITTED and RETURNED_FOR_CORRECTION->SUBMITTED"
    algorithm: forward_looking
    formula: |
      # Forward-looking (budget) variant — independent of actual disbursements.
      gov = the single APPROVED Budget on the case whose period_year == AccountingReport.period_year
      if gov is null:
        projected_disbursed_cents = 0
      else:
        projected_disbursed_cents = gov.care_cap_cents + gov.medical_cap_cents + gov.admin_cap_cents
    input_set: "The one APPROVED Budget for the matching period_year (DRAFT/SUBMITTED/SUPERSEDED excluded)"
    constants: {}
    precision: "integer cents"

  # ---- Dual-variant #2 — entity domain: Fiduciary fee (DIFFERENT from #1) ----
  - name: fiduciary_fee
    trigger: "AccountingReport DRAFT->SUBMITTED and RETURNED_FOR_CORRECTION->SUBMITTED"
    algorithm: tiered_pricing
    formula: |
      # Managed base for the period:
      base = AccountingReport.opening_balance_cents + AccountingReport.reported_income_cents
      # Marginal tiers applied to the slice of base in each band. The band caps
      # are intentionally non-round (…,990) so that more than one band can carry a
      # fractional-cent residue at once, making the rounding ORDER observable:
      b1 = min(base, TIER1_CAP_CENTS)                                  # [0, 4,999,990]
      b2 = max(0, min(base, TIER2_CAP_CENTS) - TIER1_CAP_CENTS)        # (4,999,990, 19,999,990]
      b3 = max(0, base - TIER2_CAP_CENTS)                              # above 19,999,990
      # ROUND EACH BAND to whole cents (round_half_up) THEN sum — order pinned
      # (round-per-band-then-sum, NOT sum-then-round). The two orders DIVERGE:
      # e.g. base=20,000,007 -> per-band 850,001 vs sum-then-round 850,000.
      statutory_fee = round_half_up(b1*TIER1_RATE) + round_half_up(b2*TIER2_RATE) + round_half_up(b3*TIER3_RATE)
      # Variant selection by fiduciary kind:
      if Fiduciary.fiduciary_kind == PUBLIC_AGENCY:
        fiduciary_fee_cents = min(statutory_fee, PUBLIC_AGENCY_FEE_CAP_CENTS)
      else:
        fiduciary_fee_cents = statutory_fee
    input_set: "opening_balance_cents and reported_income_cents on this AccountingReport; the appointed Fiduciary.fiduciary_kind"
    constants:
      TIER1_CAP_CENTS: 4999990
      TIER2_CAP_CENTS: 19999990
      TIER1_RATE: 0.05
      TIER2_RATE: 0.04
      TIER3_RATE: 0.03
      PUBLIC_AGENCY_FEE_CAP_CENTS: 300000   # $3,000 cap for public-agency fiduciaries
    precision: "round_half_up per band to integer cents, then sum (order pinned; orders diverge)"
    variants:
      - name: statutory
        when: "appointed Fiduciary.fiduciary_kind in {FAMILY, PROFESSIONAL}"
        difference: "Tiered marginal schedule; recorded directly as fiduciary_fee_cents."
      - name: public_agency_capped
        when: "appointed Fiduciary.fiduciary_kind == PUBLIC_AGENCY"
        difference: "Same tiered figure but capped at PUBLIC_AGENCY_FEE_CAP_CENTS, so it diverges from statutory once the tiered figure exceeds $3,000."

  # ---- Bond sizing — combinatorial: 3 inputs, nested min/max, tiered ----
  - name: bond_amount_required
    trigger: "Bond created (on Appointment creation when case.requires_bond)"
    algorithm: threshold
    formula: |
      # Inputs: ProtectedPerson.liquid_estate_cents (L), ProtectedPerson.annual_income_cents (I),
      #         GuardianshipCase.case_type (T).
      L = ProtectedPerson.liquid_estate_cents
      I = ProtectedPerson.annual_income_cents
      exposure = L + I                                   # one year income + liquid estate at risk
      core   = min(exposure, BOND_CORE_CAP_CENTS)        # first 10,000,000 buffered 1.00x
      excess = max(0, exposure - BOND_CORE_CAP_CENTS)    # remainder buffered 1.10x
      raw = core * 1.00 + excess * 1.10
      if case_type == PLENARY: raw = raw + PLENARY_RESERVE_CENTS
      required_amount_cents = max(BOND_FLOOR_CENTS, round_half_up(raw))
    input_set: "The case's ProtectedPerson (liquid_estate_cents, annual_income_cents) and case_type"
    constants:
      BOND_CORE_CAP_CENTS: 10000000     # $100,000
      BOND_FLOOR_CENTS: 500000          # $5,000 minimum penal sum
      PLENARY_RESERVE_CENTS: 1000000    # $10,000 added for PLENARY cases
    precision: "round_half_up to integer cents after applying multipliers"

  # ---- Expenditure routing — threshold boundary (> vs >=) ----
  - name: expenditure_routing
    trigger: "Expenditure creation (POST /gc/expenditures)"
    algorithm: threshold
    formula: |
      requires_court_approval =
          (amount_cents > COURT_APPROVAL_THRESHOLD_CENTS)   # STRICT greater-than
          or (category == ADMIN)
      # Boundary: amount_cents EQUAL to the threshold does NOT require court
      # approval. 1,000,000 -> auto-route APPROVED path; 1,000,001 -> PENDING_COURT.
    input_set: "The Expenditure's amount_cents and category"
    constants:
      COURT_APPROVAL_THRESHOLD_CENTS: 1000000   # $10,000; strictly-greater triggers court
    precision: "exact integer comparison"

  # ---- Budget cap check — waterfall per category + boundary (>, not >=) ----
  - name: budget_cap_check
    trigger: "Expenditure REQUESTED->APPROVED (auto) and PENDING_COURT->APPROVED (judge)"
    algorithm: waterfall_allocation
    formula: |
      gov = the APPROVED Budget referenced by expenditure.budget_id
      cap     = gov.{category}_cap_cents
      already = gov.{category}_spent_cents          # DISBURSED only
      held    = sum(x.amount_cents for x in Expenditures
                    where x.case_id == this.case_id and x.budget_id == gov.id
                      and x.category == this.category and x.status == APPROVED)
      # Approval allowed only if disbursed-spend + outstanding-holds + this charge
      # still fits under the cap:
      if already + held + this.amount_cents > cap:     # STRICT greater-than rejects
        reject ERR_BUDGET_CAP_EXCEEDED
      # Boundary: already + held + amount_cents EXACTLY == cap is ALLOWED.
    input_set: "The governing APPROVED Budget's {category}_cap_cents and {category}_spent_cents, plus sibling APPROVED holds in the same category on the same case"
    constants: {}
    precision: "exact integer cents; tie at cap is allowed (>, not >=)"

  # ---- Restricted-account available balance — conserved-quantity invariant ----
  - name: restricted_account_available
    trigger: "Any expenditure APPROVED/DISBURSED/DENIED, inventory APPROVED, accounting APPROVED, appointment suspend/reinstate"
    algorithm: aggregation
    formula: |
      available_balance_cents = principal_balance_cents - encumbered_cents
      where:
        principal_balance_cents = credits - debits
          credits = Inventory.liquid_assets_cents (on each inventory APPROVE)
                    + sum(AccountingReport.reported_income_cents on each accounting APPROVE)
          debits  = sum(Expenditure.amount_cents for DISBURSED expenditures on the case)
        encumbered_cents = sum(Expenditure.amount_cents for APPROVED-not-yet-DISBURSED expenditures on the case)
      # INVARIANT: REQUESTED->APPROVED->DISBURSED leaves principal down by amount
      # and encumbered unchanged across the pair (+amount on APPROVE, -amount on
      # DISBURSE cancel on encumbered; principal falls once on DISBURSE), so
      # available_balance_cents nets down by exactly amount_cents and never drifts.
    input_set: "All credits/debits on this case's RestrictedAccount"
    constants: {}
    precision: "integer cents"

  # ---- Case protection posture — derived gate ----
  - name: case_protection_posture
    trigger: "Any change to appointments, expenditures, accountings, restricted account, or clock advance affecting due dates"
    algorithm: aggregation
    formula: |
      # overdue_accounting_count is recomputed first:
      overdue_accounting_count =
        ( 1 if (case.status in {ACTIVE, UNDER_REVIEW}
                and server clock now >= case.next_accounting_due_iso
                and no AccountingReport for the current period is SUBMITTED or APPROVED)
              else 0 )
      # Posture precedence RED > AMBER > GREEN:
      if (case.status == ACTIVE and there is NO Appointment in ACTIVE status)
         or overdue_accounting_count >= 2:
        protection_posture = RED
      else if overdue_accounting_count == 1
         or RestrictedAccount.available_balance_cents < 0
         or any Appointment on the case is SUSPENDED:
        protection_posture = AMBER
      else:
        protection_posture = GREEN
    input_set: "Appointments, AccountingReports, RestrictedAccount on the case; server clock vs next_accounting_due_iso"
    constants: {}
    precision: "enum selection; RED > AMBER > GREEN precedence"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id resolves (case, petition, evaluation, appointment, bond, account, inventory, budget, expenditure, accounting, care-plan, review)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body FKs resolve and (where scoped) belong to the right case: protected_person_id, nominated_fiduciary_id, case_id, petition_id, appointment_id, fiduciary_id, budget_id, subject_ref_id"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "create endpoints carrying body FKs"

  - priority: 5
    category: business_constraint
    check: "Required body fields present, types correct, enum values in allowed set, amounts within declared bounds (amount_cents > 0, caps >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_temporal
    check: "window_start_iso strictly before window_end_iso on care-plan create/activate"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "care-plan activate"

  - priority: 7
    category: state
    check: "OCC: expected_case_version equals current GuardianshipCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /gc/expenditures, POST /gc/budgets/{id}/approve"

  - priority: 8
    category: state
    check: "Segregation of duties: examiner filing != petition's petitioner; judge granting/dismissing != petition's petitioner"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "evaluation file, petition grant, petition dismiss"

  - priority: 9
    category: state
    check: "Target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 10
    category: business_constraint
    check: "Case uniqueness: a ProtectedPerson with active_case_id already set cannot open another case"
    error_id: ERR_PERSON_HAS_ACTIVE_CASE
    http_status: 409
    applies_to: "POST /gc/cases"

  - priority: 11
    category: business_safety
    check: "Evaluation ordered before filing: parent petition must be EVALUATION_ORDERED"
    error_id: ERR_EVALUATION_NOT_ORDERED
    http_status: 409
    applies_to: "evaluation file"

  - priority: 12
    category: business_safety
    check: "COMPETENT finding blocks a grant"
    error_id: ERR_EVALUATION_FINDS_COMPETENT
    http_status: 409
    applies_to: "petition grant"

  - priority: 13
    category: business_safety
    check: "Granted/qualified authority must not exceed the evaluation's recommended_scope (BOTH > {PERSON, ESTATE} > NONE)"
    error_id: ERR_SCOPE_EXCEEDS_RECOMMENDATION
    http_status: 409
    applies_to: "petition grant"

  - priority: 14
    category: business_safety
    check: "Fiduciary not disqualified when appointed or qualified"
    error_id: ERR_FIDUCIARY_DISQUALIFIED
    http_status: 409
    applies_to: "appointment create, appointment qualify"

  - priority: 15
    category: business_constraint
    check: "Bond posted_amount_cents >= required_amount_cents before POSTED; bond-requiring case cannot qualify until its bond is APPROVED"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 409
    applies_to: "bond post"

  - priority: 16
    category: business_temporal
    check: "Care-plan ACTIVE windows on a case must not overlap; review can only be held once its window has opened"
    error_id: ERR_CARE_PLAN_OVERLAP
    http_status: 409
    applies_to: "care-plan activate"

  - priority: 17
    category: business_fiscal
    check: "Expenditure approval must fit under the governing budget category cap (disbursed + outstanding-approved holds + this charge), strict greater-than rejects"
    error_id: ERR_BUDGET_CAP_EXCEEDED
    http_status: 409
    applies_to: "expenditure create (auto-approve path), expenditure approve"

  - priority: 18
    category: business_fiscal
    check: "Expenditure approval requires available_balance_cents >= amount_cents on the restricted account"
    error_id: ERR_INSUFFICIENT_RESTRICTED_FUNDS
    http_status: 409
    applies_to: "expenditure create (auto-approve path), expenditure approve"

  - priority: 19
    category: business_fiscal
    check: "Accounting cannot be APPROVED while abs(variance_cents) exceeds VARIANCE_TOLERANCE_CENTS"
    error_id: ERR_ACCOUNTING_VARIANCE
    http_status: 409
    applies_to: "accounting approve"

# =============================================================================
# §1.5 API Endpoint Table  (flat collections under /gc)
# =============================================================================
endpoints:

  # ---- Test-driving clock (logical clock; default 2026-01-01T00:00:00Z) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC instant for deterministic time-gated tests. Before any call the clock reads exactly 2026-01-01T00:00:00Z (startup default) and never falls back to wall-clock time."
    roles: [CourtClerk]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso: string }"
    side_effects:
      - "Logical clock set; CarePlan EXPIRED and overdue-accounting evaluations re-derive against the new now"

  # ---- ProtectedPerson ----
  - method: POST
    path: "/gc/protected-persons"
    description: "Create a protected person (alleged-incapacitated subject)"
    roles: [Petitioner, CourtClerk]
    code: 201
    input: [full_name, date_of_birth, annual_income_cents, liquid_estate_cents]
    output: ProtectedPerson
    side_effects: ["capacity_status = PRESUMED_COMPETENT", "active_case_id = null"]

  - method: GET
    path: "/gc/protected-persons/{id}"
    description: "Read a protected person"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: ProtectedPerson
    side_effects: []

  - method: GET
    path: "/gc/protected-persons"
    description: "List protected persons"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: ProtectedPerson[]
    side_effects: []

  # ---- Fiduciary ----
  - method: POST
    path: "/gc/fiduciaries"
    description: "Register a candidate fiduciary"
    roles: [CourtClerk, Petitioner]
    code: 201
    input: [full_name, fiduciary_kind]
    output: Fiduciary
    side_effects: ["is_disqualified = false", "open_appointment_count = 0"]

  - method: GET
    path: "/gc/fiduciaries/{id}"
    description: "Read a fiduciary"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: Fiduciary
    side_effects: []

  - method: GET
    path: "/gc/fiduciaries"
    description: "List fiduciaries"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Fiduciary[]
    side_effects: []

  # ---- GuardianshipCase ----
  - method: POST
    path: "/gc/cases"
    description: "Open a guardianship/conservatorship case for a protected person"
    roles: [Petitioner, CourtClerk]
    code: 201
    input: [protected_person_id, case_type]
    output: GuardianshipCase
    side_effects:
      - "status = DRAFT, protection_posture = GREEN"
      - "requires_bond = (case_type in {CONSERVATORSHIP, PLENARY})"
      - "ProtectedPerson.active_case_id set to this case id (one-active-case uniqueness)"

  - method: GET
    path: "/gc/cases/{id}"
    description: "Read a case (computed posture, due dates re-derived against the clock)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: GuardianshipCase
    side_effects: []

  - method: GET
    path: "/gc/cases"
    description: "List cases; filter by protected_person_id (reverse-reachability for GuardianshipCase.protected_person_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["protected_person_id?", "limit?", "offset?"]
    output: GuardianshipCase[]
    side_effects: []

  - method: POST
    path: "/gc/cases/{id}/open-review"
    description: "Open court review on an active case"
    roles: [Judge]
    code: 200
    input: []
    output: GuardianshipCase
    side_effects: ["status ACTIVE -> UNDER_REVIEW"]

  - method: POST
    path: "/gc/cases/{id}/close-review"
    description: "Close court review, return case to ACTIVE"
    roles: [Judge]
    code: 200
    input: []
    output: GuardianshipCase
    side_effects: ["status UNDER_REVIEW -> ACTIVE"]

  - method: POST
    path: "/gc/cases/{id}/terminate"
    description: "Terminate the case; cascade revoke/close"
    roles: [Judge]
    code: 200
    input: []
    output: GuardianshipCase
    side_effects: ["cascade: appointments REVOKED, bonds EXONERATED, account CLOSED, person.active_case_id null"]

  - method: POST
    path: "/gc/cases/{id}/restore"
    description: "Restore capacity to the protected person and end the case"
    roles: [Judge]
    code: 200
    input: []
    output: GuardianshipCase
    side_effects: ["cascade like terminate + ProtectedPerson.capacity_status -> RESTORED"]

  # ---- Petition ----
  - method: POST
    path: "/gc/petitions"
    description: "File the petition that opens proceedings"
    roles: [Petitioner]
    code: 201
    input: [case_id, nominated_fiduciary_id, requested_authority, alleged_grounds]
    output: Petition
    side_effects: ["status = FILED", "petitioner_user_id = X-User-ID"]

  - method: GET
    path: "/gc/petitions/{id}"
    description: "Read a petition"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: Petition
    side_effects: []

  - method: GET
    path: "/gc/petitions"
    description: "List petitions; filter by case_id or nominated_fiduciary_id (reverse-reachability for Petition.case_id and Petition.nominated_fiduciary_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["case_id?", "nominated_fiduciary_id?", "limit?", "offset?"]
    output: Petition[]
    side_effects: []

  - method: POST
    path: "/gc/petitions/{id}/find-probable-cause"
    description: "Judge finds probable cause to proceed"
    roles: [Judge]
    code: 200
    input: []
    output: Petition
    side_effects: ["Petition FILED -> PROBABLE_CAUSE", "Case DRAFT -> PENDING_EVALUATION"]

  - method: POST
    path: "/gc/petitions/{id}/order-evaluation"
    description: "Judge orders a capacity evaluation"
    roles: [Judge]
    code: 200
    input: []
    output: Petition
    side_effects: ["Petition PROBABLE_CAUSE -> EVALUATION_ORDERED"]

  - method: POST
    path: "/gc/petitions/{id}/grant"
    description: "Judge grants the petition after a non-competent evaluation"
    roles: [Judge]
    code: 200
    input: []
    output: Petition
    side_effects: ["Petition -> GRANTED", "Case -> AWAITING_APPOINTMENT", "Person.capacity_status -> ADJUDICATED_INCAPACITATED"]

  - method: POST
    path: "/gc/petitions/{id}/dismiss"
    description: "Judge dismisses the petition"
    roles: [Judge]
    code: 200
    input: []
    output: Petition
    side_effects: ["Petition -> DISMISSED", "Case -> TERMINATED", "Person.active_case_id -> null"]

  # ---- CapacityEvaluation ----
  - method: POST
    path: "/gc/evaluations"
    description: "CourtExaminer drafts a capacity evaluation on a petition"
    roles: [CourtExaminer]
    code: 201
    input: [petition_id, finding, recommended_scope]
    output: CapacityEvaluation
    side_effects: ["status = DRAFT", "examiner_user_id = X-User-ID"]

  - method: GET
    path: "/gc/evaluations/{id}"
    description: "Read an evaluation"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: CapacityEvaluation
    side_effects: []

  - method: GET
    path: "/gc/evaluations"
    description: "List evaluations; filter by petition_id (reverse-reachability for CapacityEvaluation.petition_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["petition_id?", "limit?", "offset?"]
    output: CapacityEvaluation[]
    side_effects: []

  - method: POST
    path: "/gc/evaluations/{id}/file"
    description: "CourtExaminer files (locks) the evaluation; bubbles the petition to READY_FOR_HEARING"
    roles: [CourtExaminer]
    code: 200
    input: []
    output: CapacityEvaluation
    side_effects: ["Evaluation DRAFT -> FILED", "Petition EVALUATION_ORDERED -> READY_FOR_HEARING"]

  # ---- Appointment ----
  - method: POST
    path: "/gc/appointments"
    description: "Create the appointment that will receive letters once qualified"
    roles: [Judge]
    code: 201
    input: [case_id, fiduciary_id]
    output: Appointment
    side_effects:
      - "status = PENDING_QUALIFICATION"
      - "granted_authority copied from the granted petition's requested_authority"
      - "Fiduciary.is_disqualified must be false (else ERR_FIDUCIARY_DISQUALIFIED)"
      - "if case.requires_bond: a Bond is created in REQUIRED with required_amount_cents = bond_amount_required"

  - method: GET
    path: "/gc/appointments/{id}"
    description: "Read an appointment"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/gc/appointments"
    description: "List appointments; filter by case_id or fiduciary_id (reverse-reachability for Appointment.case_id and Appointment.fiduciary_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["case_id?", "fiduciary_id?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: POST
    path: "/gc/appointments/{id}/qualify"
    description: "Judge qualifies the fiduciary; issues letters; activates the case"
    roles: [Judge]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Appointment -> ACTIVE", "Case AWAITING_APPOINTMENT -> ACTIVE", "Fiduciary.open_appointment_count += 1", "next_accounting_due_iso set"]

  - method: POST
    path: "/gc/appointments/{id}/suspend"
    description: "Judge suspends the fiduciary; freezes the restricted account"
    roles: [Judge]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Appointment ACTIVE -> SUSPENDED", "RestrictedAccount -> FROZEN"]

  - method: POST
    path: "/gc/appointments/{id}/reinstate"
    description: "Judge reinstates a suspended fiduciary; unfreezes the account"
    roles: [Judge]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Appointment SUSPENDED -> ACTIVE", "RestrictedAccount -> OPEN"]

  - method: POST
    path: "/gc/appointments/{id}/remove"
    description: "Judge removes the fiduciary; optionally disqualifies for cause"
    roles: [Judge]
    code: 200
    input: [for_cause]
    output: Appointment
    side_effects: ["Appointment -> REVOKED", "if for_cause: Fiduciary.is_disqualified -> true", "Fiduciary.open_appointment_count -= 1", "Bond -> EXONERATED"]

  # ---- Bond ----
  - method: GET
    path: "/gc/bonds/{id}"
    description: "Read a bond"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: Bond
    side_effects: []

  - method: GET
    path: "/gc/bonds"
    description: "List bonds; filter by appointment_id (reverse-reachability for Bond.appointment_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: Bond[]
    side_effects: []

  - method: POST
    path: "/gc/bonds/{id}/post"
    description: "Fiduciary posts the bond with a penal sum and surety"
    roles: [Fiduciary]
    code: 200
    input: [posted_amount_cents, surety_name]
    output: Bond
    side_effects: ["Bond REQUIRED -> POSTED"]

  - method: POST
    path: "/gc/bonds/{id}/approve"
    description: "Judge approves the posted bond"
    roles: [Judge]
    code: 200
    input: []
    output: Bond
    side_effects: ["Bond POSTED -> APPROVED"]

  - method: POST
    path: "/gc/bonds/{id}/reject"
    description: "Judge rejects the posted bond; returns it to REQUIRED"
    roles: [Judge]
    code: 200
    input: []
    output: Bond
    side_effects: ["Bond POSTED -> REQUIRED", "posted_amount_cents reset to 0"]

  # ---- RestrictedAccount ----
  - method: POST
    path: "/gc/restricted-accounts"
    description: "Open a court-restricted account for the case estate"
    roles: [Fiduciary, CourtClerk]
    code: 201
    input: [case_id, institution_name]
    output: RestrictedAccount
    side_effects: ["status = OPEN", "principal_balance_cents = 0, encumbered_cents = 0, available_balance_cents = 0"]

  - method: GET
    path: "/gc/restricted-accounts/{id}"
    description: "Read a restricted account"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: RestrictedAccount
    side_effects: []

  - method: GET
    path: "/gc/restricted-accounts"
    description: "List restricted accounts; filter by case_id (reverse-reachability for RestrictedAccount.case_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: RestrictedAccount[]
    side_effects: []

  # ---- Inventory ----
  - method: POST
    path: "/gc/inventories"
    description: "Create the sworn inventory of the estate"
    roles: [Fiduciary]
    code: 201
    input: [case_id, real_property_cents, liquid_assets_cents, tangible_property_cents]
    output: Inventory
    side_effects: ["status = DRAFT", "total_estate_cents computed"]

  - method: GET
    path: "/gc/inventories/{id}"
    description: "Read an inventory"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: Inventory
    side_effects: []

  - method: GET
    path: "/gc/inventories"
    description: "List inventories; filter by case_id (reverse-reachability for Inventory.case_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: Inventory[]
    side_effects: []

  - method: POST
    path: "/gc/inventories/{id}/file"
    description: "Fiduciary files the inventory with the court"
    roles: [Fiduciary]
    code: 200
    input: []
    output: Inventory
    side_effects: ["Inventory DRAFT -> FILED"]

  - method: POST
    path: "/gc/inventories/{id}/approve"
    description: "Judge approves the inventory; funds liquid assets into the restricted account"
    roles: [Judge]
    code: 200
    input: []
    output: Inventory
    side_effects: ["Inventory FILED -> APPROVED", "RestrictedAccount.principal_balance_cents += liquid_assets_cents"]

  # ---- Budget ----
  - method: POST
    path: "/gc/budgets"
    description: "Draft an annual budget with per-category caps"
    roles: [Fiduciary]
    code: 201
    input: [case_id, period_year, care_cap_cents, medical_cap_cents, admin_cap_cents]
    output: Budget
    side_effects: ["status = DRAFT", "spent counters = 0"]

  - method: GET
    path: "/gc/budgets/{id}"
    description: "Read a budget"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: Budget
    side_effects: []

  - method: GET
    path: "/gc/budgets"
    description: "List budgets; filter by case_id or period_year (reverse-reachability for Budget.case_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["case_id?", "period_year?", "limit?", "offset?"]
    output: Budget[]
    side_effects: []

  - method: POST
    path: "/gc/budgets/{id}/submit"
    description: "Fiduciary submits the budget for approval"
    roles: [Fiduciary]
    code: 200
    input: []
    output: Budget
    side_effects: ["Budget DRAFT -> SUBMITTED"]

  - method: POST
    path: "/gc/budgets/{id}/approve"
    description: "Judge approves the budget (OCC-guarded on the case version); supersedes prior same-year approved budget"
    roles: [Judge]
    code: 200
    input: [expected_case_version]
    output: Budget
    side_effects: ["Budget SUBMITTED -> APPROVED", "prior APPROVED same-year Budget -> SUPERSEDED", "increments GuardianshipCase.version by 1"]

  # ---- Expenditure ----
  - method: POST
    path: "/gc/expenditures"
    description: "Request a disbursement; auto-routes to APPROVED or PENDING_COURT by threshold (OCC-guarded on the case version)"
    roles: [Fiduciary]
    code: 201
    input: [case_id, budget_id, category, amount_cents, payee_name, expected_case_version]
    output: Expenditure
    side_effects:
      - "requires_court_approval computed (expenditure_routing)"
      - "REQUESTED -> APPROVED (auto, when not court) or PENDING_COURT (court) per routing"
      - "on auto-APPROVED: encumber amount on RestrictedAccount after budget_cap_check + funds check"
      - "increments GuardianshipCase.version by 1"

  - method: GET
    path: "/gc/expenditures/{id}"
    description: "Read an expenditure"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: Expenditure
    side_effects: []

  - method: GET
    path: "/gc/expenditures"
    description: "List expenditures; filter by case_id, budget_id, or status (reverse-reachability for Expenditure.case_id and Expenditure.budget_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["case_id?", "budget_id?", "status?", "limit?", "offset?"]
    output: Expenditure[]
    side_effects: []

  - method: POST
    path: "/gc/expenditures/{id}/approve"
    description: "Judge approves a court-required expenditure"
    roles: [Judge]
    code: 200
    input: []
    output: Expenditure
    side_effects: ["Expenditure PENDING_COURT -> APPROVED", "encumber amount on RestrictedAccount after budget_cap_check + funds check"]

  - method: POST
    path: "/gc/expenditures/{id}/deny"
    description: "Judge denies an expenditure; releases any hold"
    roles: [Judge]
    code: 200
    input: []
    output: Expenditure
    side_effects: ["Expenditure -> DENIED", "if was APPROVED: release encumbrance"]

  - method: POST
    path: "/gc/expenditures/{id}/disburse"
    description: "Fiduciary disburses an approved expenditure; debits account and budget"
    roles: [Fiduciary]
    code: 200
    input: []
    output: Expenditure
    side_effects: ["Expenditure APPROVED -> DISBURSED", "disbursed_at set", "principal_balance -= amount, encumbered -= amount", "Budget.<category>_spent_cents += amount"]

  # ---- AccountingReport ----
  - method: POST
    path: "/gc/accountings"
    description: "Draft an annual accounting report"
    roles: [Fiduciary]
    code: 201
    input: [case_id, period_year, opening_balance_cents, reported_income_cents, reported_disbursed_cents]
    output: AccountingReport
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/gc/accountings/{id}"
    description: "Read an accounting report"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: AccountingReport
    side_effects: []

  - method: GET
    path: "/gc/accountings"
    description: "List accounting reports; filter by case_id or period_year (reverse-reachability for AccountingReport.case_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["case_id?", "period_year?", "limit?", "offset?"]
    output: AccountingReport[]
    side_effects: []

  - method: POST
    path: "/gc/accountings/{id}/submit"
    description: "Fiduciary submits the accounting; recomputes ledger/projection/variance/fee"
    roles: [Fiduciary]
    code: 200
    input: []
    output: AccountingReport
    side_effects: ["status DRAFT -> SUBMITTED", "ledger_disbursed_cents, projected_disbursed_cents, variance_cents, fiduciary_fee_cents recomputed"]

  - method: POST
    path: "/gc/accountings/{id}/return"
    description: "Judge returns the accounting for correction"
    roles: [Judge]
    code: 200
    input: []
    output: AccountingReport
    side_effects: ["status SUBMITTED -> RETURNED_FOR_CORRECTION"]

  - method: POST
    path: "/gc/accountings/{id}/resubmit"
    description: "Fiduciary resubmits a corrected accounting; recomputes derived figures"
    roles: [Fiduciary]
    code: 200
    input: ["reported_disbursed_cents?", "reported_income_cents?", "opening_balance_cents?"]
    output: AccountingReport
    side_effects: ["status RETURNED_FOR_CORRECTION -> SUBMITTED", "supplied fields updated then recompute ledger/projection/variance/fee"]

  - method: POST
    path: "/gc/accountings/{id}/approve"
    description: "Judge approves the accounting when variance within tolerance; advances next-due, credits income"
    roles: [Judge]
    code: 200
    input: []
    output: AccountingReport
    side_effects: ["status SUBMITTED -> APPROVED", "next_accounting_due_iso advanced", "RestrictedAccount.principal_balance += reported_income_cents", "posture recomputed"]

  # ---- CarePlan ----
  - method: POST
    path: "/gc/care-plans"
    description: "Draft a visitation/care plan"
    roles: [Fiduciary]
    code: 201
    input: [case_id, residence_type, visitation_min_per_month, window_start_iso, window_end_iso]
    output: CarePlan
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/gc/care-plans/{id}"
    description: "Read a care plan"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: CarePlan
    side_effects: []

  - method: GET
    path: "/gc/care-plans"
    description: "List care plans; filter by case_id (reverse-reachability for CarePlan.case_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: CarePlan[]
    side_effects: []

  - method: POST
    path: "/gc/care-plans/{id}/activate"
    description: "Activate a care plan; rejects window overlap with another ACTIVE plan on the case"
    roles: [Fiduciary]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status DRAFT -> ACTIVE"]

  - method: POST
    path: "/gc/care-plans/{id}/replace"
    description: "Mark an active care plan REPLACED (freeing its window)"
    roles: [Fiduciary]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status ACTIVE -> REPLACED"]

  # ---- CourtReview ----
  - method: POST
    path: "/gc/reviews"
    description: "Schedule a court review over an accounting or care plan (polymorphic subject)"
    roles: [Judge, CourtClerk]
    code: 201
    input: [case_id, subject_kind, subject_ref_id, review_window_start_iso, review_window_end_iso]
    output: CourtReview
    side_effects: ["status = SCHEDULED, outcome = PENDING"]

  - method: GET
    path: "/gc/reviews/{id}"
    description: "Read a court review"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: []
    output: CourtReview
    side_effects: []

  - method: GET
    path: "/gc/reviews"
    description: "List court reviews; filter by case_id (reverse-reachability for CourtReview.case_id)"
    roles: [Petitioner, CourtExaminer, Judge, Fiduciary, CourtClerk]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: CourtReview[]
    side_effects: []

  - method: POST
    path: "/gc/reviews/{id}/hold"
    description: "Hold the scheduled review (window must be open and case UNDER_REVIEW)"
    roles: [Judge]
    code: 200
    input: []
    output: CourtReview
    side_effects: ["status SCHEDULED -> HELD"]

  - method: POST
    path: "/gc/reviews/{id}/dispose"
    description: "Dispose the held review with an outcome"
    roles: [Judge]
    code: 200
    input: [outcome]
    output: CourtReview
    side_effects: ["status HELD -> CLOSED", "outcome set", "if SANCTIONED on SUBMITTED accounting subject: subject -> RETURNED_FOR_CORRECTION"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "A body foreign key does not resolve or is out of the expected case scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required body field, bad type, enum outside allowed set, or amount/cap out of bounds" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "window_start_iso is not strictly before window_end_iso" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not equal current GuardianshipCase.version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempted two segregated roles (examiner==petitioner, or judge==petitioner)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_PERSON_HAS_ACTIVE_CASE, http: 409, condition: "ProtectedPerson already has an active (non-terminal) case" }
  - { id: ERR_EVALUATION_NOT_ORDERED, http: 409, condition: "Evaluation filed before the petition reached EVALUATION_ORDERED" }
  - { id: ERR_EVALUATION_FINDS_COMPETENT, http: 409, condition: "Grant attempted on a petition whose evaluation finding is COMPETENT" }
  - { id: ERR_SCOPE_EXCEEDS_RECOMMENDATION, http: 409, condition: "Requested/granted authority exceeds the evaluation's recommended_scope" }
  - { id: ERR_FIDUCIARY_DISQUALIFIED, http: 409, condition: "Fiduciary is disqualified and cannot be appointed/qualified" }
  - { id: ERR_BOND_INSUFFICIENT, http: 409, condition: "posted_amount_cents is below required_amount_cents" }
  - { id: ERR_BOND_NOT_APPROVED, http: 409, condition: "Qualification attempted on a bond-requiring case before its bond is APPROVED" }
  - { id: ERR_NO_RESTRICTED_ACCOUNT, http: 409, condition: "Inventory approval needs an OPEN restricted account that does not exist" }
  - { id: ERR_CASE_NOT_ACTIVE, http: 409, condition: "Operation requires the case to be ACTIVE (or ACTIVE/UNDER_REVIEW for accountings)" }
  - { id: ERR_CASE_NOT_UNDER_REVIEW, http: 409, condition: "Review hold requires the case to be UNDER_REVIEW" }
  - { id: ERR_BUDGET_CAP_EXCEEDED, http: 409, condition: "Expenditure would exceed the governing budget's category cap" }
  - { id: ERR_INSUFFICIENT_RESTRICTED_FUNDS, http: 409, condition: "available_balance_cents is below the expenditure amount" }
  - { id: ERR_ACCOUNT_FROZEN, http: 409, condition: "Disbursement attempted while the restricted account is FROZEN" }
  - { id: ERR_ACCOUNTING_VARIANCE, http: 409, condition: "Accounting variance exceeds the approval tolerance" }
  - { id: ERR_ACCOUNTING_OUTSTANDING, http: 409, condition: "Termination/restore attempted while the latest accounting is not APPROVED" }
  - { id: ERR_PENDING_EXPENDITURES, http: 409, condition: "Termination/restore attempted with PENDING_COURT or APPROVED expenditures outstanding" }
  - { id: ERR_CARE_PLAN_OVERLAP, http: 409, condition: "Care-plan window overlaps another ACTIVE care plan on the case" }
  - { id: ERR_REVIEW_WINDOW_NOT_OPEN, http: 409, condition: "Review hold attempted before the review window opened" }
  - { id: ERR_OPEN_REVIEW_PENDING, http: 409, condition: "close-review attempted while a SCHEDULED/HELD review remains" }
  - { id: ERR_RESTORATION_NOT_REVIEWED, http: 409, condition: "Restore attempted without an ACCEPTED, CLOSED restoration review" }

# =============================================================================
# §1.7 RBAC Matrix  (segregation_of_duties)
# =============================================================================
roles:
  - name: Petitioner
    description: "Files the petition that opens proceedings and registers the subject. Cannot evaluate capacity or rule on the petition."
    identity: opaque
    exclusive_operations:
      - "POST /gc/petitions — file the petition"
    shared_operations:
      - "POST /gc/protected-persons — register subject (shared with CourtClerk)"
      - "POST /gc/fiduciaries — register candidate fiduciary (shared with CourtClerk)"
      - "POST /gc/cases — open the case (shared with CourtClerk)"
      - "GET endpoints on all resources"

  - name: CourtExaminer
    description: "Independent examiner who authors and files the capacity evaluation. Cannot file the petition or rule on it (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /gc/evaluations — draft evaluation"
      - "POST /gc/evaluations/{id}/file — file evaluation"
    shared_operations:
      - "GET endpoints on all resources"

  - name: Judge
    description: "Adjudicates and approves: probable cause, order evaluation, grant/dismiss, appointment lifecycle, bond/inventory/budget/expenditure/accounting approvals, open/close review, terminate/restore, review hold/dispose. Cannot file a petition or author an evaluation."
    identity: opaque
    exclusive_operations:
      - "POST /gc/petitions/{id}/find-probable-cause, order-evaluation, grant, dismiss"
      - "POST /gc/appointments (create) and qualify/suspend/reinstate/remove"
      - "POST /gc/bonds/{id}/approve and reject"
      - "POST /gc/inventories/{id}/approve"
      - "POST /gc/budgets/{id}/approve"
      - "POST /gc/expenditures/{id}/approve and deny"
      - "POST /gc/accountings/{id}/return and approve"
      - "POST /gc/cases/{id}/open-review, close-review, terminate, restore"
      - "POST /gc/reviews/{id}/hold and dispose"
    shared_operations:
      - "POST /gc/reviews — schedule review (shared with CourtClerk)"
      - "GET endpoints on all resources"

  - name: Fiduciary
    description: "The appointed (or appointee) guardian/conservator. Submits operational artifacts (bond post, inventory, budget, expenditures, disbursements, accountings, care plans) but cannot approve them. X-User-ID equals the acting Fiduciary.id."
    identity: entity_backed:Fiduciary
    exclusive_operations:
      - "POST /gc/bonds/{id}/post"
      - "POST /gc/inventories and inventories/{id}/file"
      - "POST /gc/budgets and budgets/{id}/submit"
      - "POST /gc/expenditures and expenditures/{id}/disburse"
      - "POST /gc/accountings, accountings/{id}/submit, accountings/{id}/resubmit"
      - "POST /gc/care-plans and care-plans/{id}/activate and replace"
    shared_operations:
      - "POST /gc/restricted-accounts — open account (shared with CourtClerk)"
      - "GET endpoints on all resources"

  - name: CourtClerk
    description: "Administrative operator. Sets the logical clock, registers persons/fiduciaries, opens the case and restricted accounts, schedules reviews. No adjudicative power."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /gc/protected-persons, POST /gc/fiduciaries (shared with Petitioner)"
      - "POST /gc/cases — open the case (shared with Petitioner)"
      - "POST /gc/restricted-accounts (shared with Fiduciary)"
      - "POST /gc/reviews (shared with Judge)"
      - "GET endpoints on all resources"
