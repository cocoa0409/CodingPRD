  - section: complexity_layers
    instances:
      - name: corner_occ_application_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[application-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the version observed at creation succeeds and bumps version to 2; a second PATCH still carrying the stale version is rejected 412 ERR_STALE_VERSION even though DRAFT is still a patchable state."
        test_recipe:
          setup: ["Application in DRAFT; version captured at creation"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id", app_v: "$.data.version" } }
          trigger:
            - { call: "PATCH /wetland-permits/applications/${app_id}", payload: { expected_application_version: "${app_v}", project_purpose: "Stormwater facility, phase 1" }, as: Applicant, as_user_id: "${ap_id}", captures: { v2: "$.data.version" } }
            - { call: "PATCH /wetland-permits/applications/${app_id}", payload: { expected_application_version: "${app_v}", project_purpose: "Stormwater facility, revised again" }, as: Applicant, as_user_id: "${ap_id}", captures: { err: "$.data.error_id" } }
            - { call: "PATCH /wetland-permits/applications/${app_id}", payload: { expected_application_version: "${v2}", project_purpose: "Stormwater facility, revised again" }, as: Applicant, as_user_id: "${ap_id}", captures: { v3: "$.data.version" } }
          assert:
            - "v2 == 2 (fresh version accepted)"
            - "err == ERR_STALE_VERSION (412) for the replayed stale version — state preconditions alone would have allowed the call"
            - "v3 == 3 when the current version is supplied"

