scenario: |
  Generate task harder than expert level!

  2732. Airline Schedule Filing & Slot Compliance (airline network planning): schedule construction with fleet assignment, aircraft rotation feasibility and maintenance opportunity, slot holdings at coordinated airports with use-it-or-lose-it utilization tracking, slot exchanges, transfers and returns with deadline calendars, schedule filing to distribution systems with change windows and codeshare synchronization, seasonal schedule development with historic precedence protection, minimum connect times, gate constraints and curfew compliance at each station, government route authority and international traffic rights, schedule change notification obligations to booked passengers

domain_name: airline-schedule-filing-slot-compliance

# Flat topology: every resource is a top-level collection joined by explicit
# foreign keys (no nesting in URL paths). There is no shared route prefix.
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  difficulty_level: expert_plus
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Twelve peer entities linked only by explicit FK fields. No entity is nested
  # inside another entity's URL path; every collection is addressed at the root
  # (`/flight-legs`, `/slot-holdings`, ...) and every parent→child traversal is a
  # filtered list. ScheduleVersion is an aggregate *logical* root but is NOT a
  # URL parent — legs are created with `schedule_version_id` in the body.

  state_machine_shape: parallel
  # ScheduleVersion carries two independent state dimensions on one row:
  #   filing_status:    DRAFT -> VALIDATED -> FILED -> SUPERSEDED | WITHDRAWN
  #   compliance_state: CLEAN <-> WARNED <-> BLOCKED   (derived, recomputed on
  #                     every leg/slot mutation; evolves independently of
  #                     filing_status and gates it)
  # FlightLeg is cyclic (SLOT_BACKED -> FILED -> REFILE_REQUIRED -> SLOT_BACKED),
  # SlotTransaction is branching fork-join with divergent side-effect sets per
  # `kind` branch, FilingSubmission is cyclic (REJECTED -> QUEUED is reached by
  # creating the next submission after a rejection).

  relationship_patterns:
    - one_to_many          # ScheduleVersion -> FlightLeg, SlotHolding -> SlotUtilizationRecord
    - self_referential     # SlotHolding.historic_predecessor_holding_id,
                           # FlightLeg.connects_from_leg_id,
                           # ScheduleVersion.supersedes_version_id
    - cross_aggregate      # FlightLeg <-> SlotHolding (different aggregates, both
                           # mutated by one attach/detach action)
    - many_to_many         # FlightLeg.marketing_carrier_ids (codeshare designations)

  role_model: segregation_of_duties
  # The X-User-ID that validated a ScheduleVersion may not transmit its filing;
  # the X-User-ID that proposed a SlotTransaction may not approve it. Both
  # constraints are enforced against persisted `*_by_user_id` fields, so one
  # human holding two roles is rejected even though both roles are individually
  # authorized.

  consistency_model: immediate
  # Every derived field (utilization percentages, compliance counters, scores,
  # charge ledgers) is recomputed inside the same request that mutates its
  # source data, and the response body of that request already reflects it.

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: iata_code
        type: string
        source: input
        description: Two-character IATA airline designator.
        constraints: exactly 2 uppercase alphanumeric characters; globally unique
      - name: icao_code
        type: string
        source: input
        description: Three-letter ICAO airline designator.
        constraints: exactly 3 uppercase letters; globally unique
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of the carrier's operating licence.
        constraints: exactly 2 uppercase letters
      - name: is_home_carrier
        type: boolean
        source: input
        description: True for the carrier whose network this deployment plans.
        default: false
      - name: status
        type: enum
        source: system
        description: Lifecycle of the carrier record.
        default: ACTIVE
        constraints: "status IN {ACTIVE, SUSPENDED}; created as ACTIVE; SUSPENDED is set only by POST /carriers/{carrier_id}/suspend"
      - name: held_series_count
        type: integer
        source: computed
        description: |
          Number of SlotHolding rows where `carrier_id == this.id` AND
          `holding_status == HELD`. Recomputed on every SlotHolding creation,
          return, transfer execution and slot-audit loss.

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: iata_code
        type: string
        source: input
        description: Three-letter IATA station code.
        constraints: exactly 3 uppercase letters; globally unique
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country the station sits in.
        constraints: exactly 2 uppercase letters
      - name: coordination_level
        type: enum
        source: input
        description: IATA Worldwide Slot Guidelines coordination level of the airport.
        constraints: "coordination_level IN {LEVEL_1_NON_COORDINATED, LEVEL_2_FACILITATED, LEVEL_3_COORDINATED}"
      - name: utc_offset_minutes
        type: integer
        source: input
        description: Fixed offset from UTC in minutes used to derive local clock times.
        constraints: -720 <= utc_offset_minutes <= 840
      - name: gate_count
        type: integer
        source: input
        description: Number of contact gates available for concurrent occupancy.
        constraints: gate_count >= 1
      - name: curfew_start_local_minutes
        type: integer
        source: input
        description: |
          Local-time minute-of-day at which the night curfew opens (inclusive).
          Null means the station has no curfew. When present,
          curfew_end_local_minutes MUST also be present.
        default: null
        constraints: 0 <= curfew_start_local_minutes <= 1439
      - name: curfew_end_local_minutes
        type: integer
        source: input
        description: |
          Local-time minute-of-day at which the night curfew closes (exclusive).
          A value smaller than curfew_start_local_minutes means the curfew wraps
          past local midnight.
        default: null
        constraints: 0 <= curfew_end_local_minutes <= 1439
      - name: min_connect_domestic_minutes
        type: integer
        source: input
        description: Published minimum connect time when neither leg of the connection is international.
        default: 35
        constraints: min_connect_domestic_minutes >= 0
      - name: min_connect_international_minutes
        type: integer
        source: input
        description: Published minimum connect time when either leg of the connection is international.
        default: 60
        constraints: min_connect_international_minutes >= 0
      - name: min_turn_override_minutes
        type: integer
        source: input
        description: |
          Station-imposed floor on aircraft turn time, in minutes. Enters the
          `required_turn_minutes` max() in calculations.rotation_feasibility_evaluation.
        default: 0
        constraints: min_turn_override_minutes >= 0
      - name: maintenance_capable
        type: boolean
        source: input
        description: True when line maintenance can be performed on the ground here.
        default: false

  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: season_code
        type: string
        source: input
        description: IATA season designator such as "W26" or "S27".
        constraints: 2-4 characters; globally unique
      - name: start_date
        type: datetime
        source: input
        description: First instant of the season (ISO 8601 UTC).
      - name: end_date
        type: datetime
        source: input
        description: Last instant of the season (ISO 8601 UTC).
        constraints: end_date > start_date
      - name: slot_return_deadline_utc
        type: datetime
        source: input
        description: |
          Slot Return Deadline of the season's deadline calendar. Returning a
          SlotHolding at or before this instant is "in time"; after it the
          return is refused.
        constraints: slot_return_deadline_utc < start_date
      - name: filing_change_window_close_utc
        type: datetime
        source: input
        description: |
          Instant after which STANDARD-window filings are refused. EXPEDITED
          filings are accepted until `start_date`; EMERGENCY filings are always
          accepted.
        constraints: slot_return_deadline_utc <= filing_change_window_close_utc < start_date
      - name: status
        type: enum
        source: system
        description: Season lifecycle position.
        default: DRAFT
        constraints: "status IN {DRAFT, OPEN, CLOSED, ARCHIVED}"
      - name: slot_audit_completed_at_utc
        type: datetime
        source: system
        description: Logical-clock instant at which POST /seasons/{season_id}/slot-audit completed. Null until then.
        default: null
      - name: audit_reference
        type: string
        source: system
        description: Coordinator's audit reference recorded by the slot audit. Null until the audit runs.
        default: null
      - name: held_series_count
        type: integer
        source: computed
        description: Number of SlotHolding rows where `season_id == this.id` AND `holding_status == HELD`.

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier that operates this tail.
      - name: base_station_id
        type: string
        source: input
        description: FK -> Station.id; the maintenance base of this tail.
      - name: registration
        type: string
        source: input
        description: Tail registration such as "D-AHXA".
        constraints: 4-8 characters; globally unique
      - name: fleet_type_code
        type: string
        source: input
        description: Fleet/equipment code such as "B738". A FlightLeg may only be assigned to an Aircraft whose fleet_type_code equals the leg's fleet_type_code.
        constraints: 3-4 uppercase alphanumeric characters
      - name: seats
        type: integer
        source: input
        description: Total installed seats.
        constraints: seats >= 1
      - name: min_turn_minutes
        type: integer
        source: input
        description: Fleet-standard minimum ground time between two consecutive legs of this tail.
        constraints: min_turn_minutes >= 0
      - name: max_daily_block_minutes
        type: integer
        source: input
        description: Maximum summed block time this tail may fly within one UTC calendar date.
        constraints: max_daily_block_minutes >= 1
      - name: required_check_minutes
        type: integer
        source: input
        description: Ground minutes a maintenance opportunity must provide for the tail's next scheduled check.
        constraints: required_check_minutes >= 0
      - name: maintenance_check_required
        type: boolean
        source: input
        description: |
          When true, validations priority 46 refuses to validate a ScheduleVersion
          whose rotation for this tail offers less than `required_check_minutes`
          of contiguous maintenance opportunity. When false the opportunity is
          still computed and exposed but never gates validation.
        default: false
      - name: status
        type: enum
        source: input
        description: Airworthiness/availability state of the tail.
        default: IN_SERVICE
        constraints: "status IN {IN_SERVICE, MAINTENANCE_GROUNDED, RETIRED}"
      - name: assigned_leg_count
        type: integer
        source: computed
        description: Number of FlightLeg rows where `assigned_aircraft_id == this.id` AND `status != CANCELLED`.
      - name: maintenance_opportunity_minutes
        type: integer
        source: computed
        description: |
          Authoritative (contiguous_window variant) maintenance opportunity —
          see calculations.maintenance_opportunity_minutes. Longest single ground
          period this tail sits at a Station with `maintenance_capable == true`,
          measured across all its non-CANCELLED legs. 0 when the tail has fewer
          than two same-UTC-date legs.
      - name: cumulative_ground_minutes
        type: integer
        source: computed
        description: |
          Divergent (cumulative_ground variant) maintenance opportunity — sum of
          every ground period at a maintenance-capable Station. Reported for
          planners; never gates validation.
      - name: rotation_feasibility_status
        type: enum
        source: computed
        description: |
          Outcome of calculations.rotation_feasibility_evaluation over this tail's
          non-CANCELLED legs.
        default: UNCHECKED
        constraints: "rotation_feasibility_status IN {UNCHECKED, FEASIBLE, INFEASIBLE_CONTINUITY, INFEASIBLE_TURN, INFEASIBLE_BLOCK_CAP}; UNCHECKED only while assigned_leg_count == 0"

  - name: ScheduleVersion
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier whose schedule this version describes.
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season this version is built for.
      - name: supersedes_version_id
        type: string
        source: system
        description: FK -> ScheduleVersion.id; set on the version created by POST /schedule-versions/{schedule_version_id}/supersede. Null for a first version.
        default: null
      - name: version_label
        type: string
        source: input
        description: Planner-visible label such as "W26-R1".
        constraints: 1-40 characters; unique per (carrier_id, season_id)
      - name: filing_status
        type: enum
        source: system
        description: Filing lifecycle dimension (independent of compliance_state).
        default: DRAFT
        constraints: "filing_status IN {DRAFT, VALIDATED, FILED, SUPERSEDED, WITHDRAWN}"
      - name: compliance_state
        type: enum
        source: computed
        description: |
          Compliance dimension, recomputed from schedule_compliance_score and
          at_risk_slot_count on every mutation of this version or of any entity
          it references. Evolves independently of filing_status and gates it.
        default: CLEAN
        constraints: "compliance_state IN {CLEAN, WARNED, BLOCKED}"
      - name: validated_by_user_id
        type: string
        source: system
        description: X-User-ID that performed POST /schedule-versions/{schedule_version_id}/validate. Null until validated; retained through FILED for the segregation-of-duties check.
        default: null
      - name: filing_charge_budget_cents
        type: integer
        source: input
        description: Ceiling on cumulative filing charges this version may accrue.
        default: 100000
        constraints: filing_charge_budget_cents >= 0
      - name: filing_charge_accrued_cents
        type: integer
        source: computed
        description: |
          Conserved money ledger. Invariant: equals
          SUM(FilingSubmission.total_charge_cents) over FilingSubmission rows
          where `schedule_version_id == this.id` AND
          `status IN {TRANSMITTED, ACKNOWLEDGED}`.
        default: 0
      - name: leg_count
        type: integer
        source: computed
        description: |
          Number of FlightLeg rows where `schedule_version_id == this.id`,
          INCLUDING cancelled ones — a cancelled leg stays on the version's
          manifest, so this counter only ever rises. Every other counter on
          this entity excludes CANCELLED legs; this one deliberately does not.
      - name: unslotted_leg_count
        type: integer
        source: computed
        description: |
          Number of FlightLeg rows where `schedule_version_id == this.id` AND
          `status != CANCELLED` AND the leg is not fully slotted, i.e.
          `status == REFILE_REQUIRED` OR some member of
          `required_slot_set(leg)` (see state_machines.FlightLeg) has no
          holding attached. A leg whose origin and destination are both
          outside LEVEL_3_COORDINATED has an empty required_slot_set and never
          counts unless it is REFILE_REQUIRED.
      - name: curfew_violation_count
        type: integer
        source: computed
        description: Number of FlightLeg rows where `schedule_version_id == this.id` AND `status != CANCELLED` AND `curfew_waiver_reference != null`.
      - name: mct_violation_count
        type: integer
        source: computed
        description: Number of FlightLeg rows where `schedule_version_id == this.id` AND `status != CANCELLED` AND `connects_from_leg_id != null` AND `mct_shortfall_minutes > 0`.
      - name: gate_overflow_count
        type: integer
        source: computed
        description: Number of (station_id, UTC date) pairs whose peak gate occupancy exceeds Station.gate_count, computed over this version's non-CANCELLED legs by calculations.gate_occupancy_load.
      - name: at_risk_slot_count
        type: integer
        source: computed
        description: |
          Number of DISTINCT SlotHolding rows referenced by this version's
          non-CANCELLED legs (through departure_slot_holding_id or
          arrival_slot_holding_id) whose `at_risk_of_loss == true`.
      - name: schedule_compliance_score
        type: number
        source: computed
        description: Output of calculations.schedule_compliance_score; 2 decimal places.
        default: 100.00

  - name: FlightLeg
    parent: null
    common_fields: true
    fields:
      - name: schedule_version_id
        type: string
        source: input
        description: FK -> ScheduleVersion.id; the version this leg belongs to.
      - name: flight_number
        type: string
        source: input
        description: Marketing flight number such as "HX412".
        constraints: 3-8 characters
      - name: origin_station_id
        type: string
        source: input
        description: FK -> Station.id; departure station.
      - name: dest_station_id
        type: string
        source: input
        description: FK -> Station.id; arrival station.
        constraints: dest_station_id != origin_station_id
      - name: dep_utc
        type: datetime
        source: input
        description: Scheduled off-block instant, ISO 8601 UTC with three fractional digits.
        constraints: must fall within [Season.start_date, Season.end_date] of the version's season
      - name: arr_utc
        type: datetime
        source: input
        description: Scheduled on-block instant, ISO 8601 UTC with three fractional digits.
        constraints: arr_utc > dep_utc; arr_utc - dep_utc <= 1080 minutes
      - name: fleet_type_code
        type: string
        source: input
        description: Fleet code this leg is planned on; an Aircraft may only be assigned when its fleet_type_code matches.
        constraints: 3-4 uppercase alphanumeric characters
      - name: assigned_aircraft_id
        type: string
        source: system
        description: FK -> Aircraft.id; set by POST /flight-legs/{flight_leg_id}/assign-aircraft. Null until assigned.
        default: null
      - name: departure_slot_holding_id
        type: string
        source: system
        description: FK -> SlotHolding.id; DEPARTURE slot backing this leg's off-block. Set by attach-slot, nulled by detachment cascades.
        default: null
      - name: arrival_slot_holding_id
        type: string
        source: system
        description: FK -> SlotHolding.id; ARRIVAL slot backing this leg's on-block. Set by attach-slot, nulled by detachment cascades.
        default: null
      - name: connects_from_leg_id
        type: string
        source: input
        description: FK -> FlightLeg.id; inbound leg of a designated passenger connection. Null when this leg starts an itinerary.
        default: null
      - name: marketing_carrier_ids
        type: array
        source: input
        description: |
          Array of Carrier ids (NOT a single-valued foreign key) that place their
          own designator on this leg. Every listed carrier must acknowledge a
          filing before it may be transmitted.
        default: []
        constraints: each element must be an existing Carrier.id other than the version's carrier_id; no duplicates; max 4 elements
      - name: curfew_waiver_reference
        type: string
        source: input
        description: |
          Regulator waiver reference. When present the curfew check at priority 44
          is skipped, but the leg is counted in
          ScheduleVersion.curfew_violation_count for the whole time it is
          non-CANCELLED.
        default: null
        constraints: 4-32 characters when present
      - name: booked_first
        type: integer
        source: system
        description: Booked passengers in first cabin; written only by POST /flight-legs/{flight_leg_id}/booking-snapshot.
        default: 0
      - name: booked_business
        type: integer
        source: system
        description: Booked passengers in business cabin; written only by POST /flight-legs/{flight_leg_id}/booking-snapshot.
        default: 0
      - name: booked_economy
        type: integer
        source: system
        description: Booked passengers in economy cabin; written only by POST /flight-legs/{flight_leg_id}/booking-snapshot.
        default: 0
      - name: status
        type: enum
        source: system
        description: Leg lifecycle position; cyclic between SLOT_BACKED, FILED and REFILE_REQUIRED.
        default: DRAFT
        constraints: "status IN {DRAFT, ASSIGNED, SLOT_BACKED, FILED, REFILE_REQUIRED, CANCELLED}"
      - name: cancellation_reason
        type: string
        source: system
        description: Reason recorded by POST /flight-legs/{flight_leg_id}/cancel. Null until cancelled.
        default: null
      - name: block_minutes
        type: integer
        source: computed
        description: (arr_utc - dep_utc) expressed in whole minutes.
      - name: is_international
        type: boolean
        source: computed
        description: True when origin Station.country_code != dest Station.country_code.
      - name: mct_shortfall_minutes
        type: integer
        source: computed
        description: |
          Output of calculations.mct_shortfall_minutes for the designated
          connection. 0 when connects_from_leg_id is null or the connection meets
          the station's published minimum connect time.
        default: 0
      - name: connect_minutes
        type: integer
        source: computed
        description: (this.dep_utc - connects_from_leg.arr_utc) in whole minutes; null when connects_from_leg_id is null.
        default: null
      - name: open_obligation_count
        type: integer
        source: computed
        description: |
          Conserved obligation ledger. Equals the number of
          PassengerNotificationObligation rows where `flight_leg_id == this.id`
          AND `status == PENDING`.
        default: 0

  - name: SlotHolding
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK -> Station.id; the coordinated airport the series is held at.
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season the series applies to.
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the current holder of the series.
      - name: historic_predecessor_holding_id
        type: string
        source: input
        description: FK -> SlotHolding.id; the series this holding inherits historic precedence from (also set by the system on a TRANSFER successor). Null for a newly allocated series.
        default: null
      - name: pending_transaction_id
        type: string
        source: system
        description: FK -> SlotTransaction.id; the transaction currently encumbering this series. Null when unencumbered.
        default: null
      - name: movement_type
        type: enum
        source: input
        description: Whether the series is an arrival or a departure slot.
        constraints: "movement_type IN {ARRIVAL, DEPARTURE}"
      - name: slot_time_utc
        type: datetime
        source: input
        description: |
          Anchor instant of the series. Only its UTC time-of-day is compared to a
          FlightLeg's dep_utc/arr_utc time-of-day; its date is informational.
      - name: days_of_week
        type: string
        source: input
        description: ISO weekday mask of the series, e.g. "135" for Mon/Wed/Fri.
        constraints: 1-7 characters drawn from "1234567", strictly ascending, no duplicates
      - name: series_weeks
        type: integer
        source: input
        description: Number of consecutive weeks the series runs for.
        constraints: 1 <= series_weeks <= 26
      - name: historic_precedence
        type: boolean
        source: input
        description: True when the series carries grandfather rights from a prior season.
        default: false
      - name: holding_status
        type: enum
        source: system
        description: Series lifecycle position.
        default: HELD
        constraints: "holding_status IN {HELD, RETURNED, TRANSFERRED_OUT, LOST, EXPIRED}"
      - name: returned_reason
        type: string
        source: system
        description: Reason recorded by POST /slot-holdings/{slot_holding_id}/return. Null until returned.
        default: null
      - name: returned_before_deadline
        type: boolean
        source: system
        description: |
          True when the return was accepted at or before
          Season.slot_return_deadline_utc as read from the logical clock. Null
          until the series is returned.
        default: null
      - name: planned_operations
        type: integer
        source: computed
        description: series_weeks * length(days_of_week). The denominator of both utilization variants.
      - name: attached_operations
        type: integer
        source: computed
        description: |
          Number of FlightLeg rows where `status != CANCELLED` AND
          (`departure_slot_holding_id == this.id` OR
          `arrival_slot_holding_id == this.id`). Conserved by the
          attach/cancel invariant.
      - name: credited_operations
        type: integer
        source: computed
        description: |
          Number of SlotUtilizationRecord rows where `slot_holding_id == this.id`
          AND `outcome IN {OPERATED, CANCELLED_ATC, RETURNED_IN_TIME}`.
      - name: utilization_pct
        type: number
        source: computed
        description: as_operated variant of calculations.slot_utilization_credit; 2 decimal places. The variant the season slot audit rules on.
        default: 0.00
      - name: utilization_pct_as_filed
        type: number
        source: computed
        description: as_filed variant of calculations.slot_utilization_credit; 2 decimal places. The variant at_risk_of_loss and the compliance score react to.
        default: 0.00
      - name: at_risk_of_loss
        type: boolean
        source: computed
        description: |
          True when `holding_status == HELD` AND `attached_operations >= 1` AND
          `utilization_pct_as_filed < 80.00`. Drives
          ScheduleVersion.at_risk_slot_count and therefore the BLOCKED posture.
        default: false
      - name: retains_historic_precedence
        type: boolean
        source: system
        description: |
          Verdict written by POST /seasons/{season_id}/slot-audit: true when
          `utilization_pct >= 80.00` at audit time. Null until the audit runs.
        default: null

  - name: SlotUtilizationRecord
    parent: null
    common_fields: false
    fields:
      - name: slot_holding_id
        type: string
        source: input
        description: FK -> SlotHolding.id; the series this operation belongs to.
      - name: operation_date
        type: datetime
        source: input
        description: UTC date of the intended operation, ISO 8601.
        constraints: must fall within [Season.start_date, Season.end_date] of the holding's season
      - name: outcome
        type: enum
        source: input
        description: What actually happened to the intended operation.
        constraints: "outcome IN {OPERATED, CANCELLED_CARRIER, CANCELLED_ATC, NOT_OPERATED, RETURNED_IN_TIME}; RETURNED_IN_TIME is written only by the return cascade, never accepted from a client"
      - name: credited
        type: boolean
        source: computed
        description: True when `outcome IN {OPERATED, CANCELLED_ATC, RETURNED_IN_TIME}`.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the SlotCoordinator that filed the record, or the literal "system" for records synthesized by the return cascade.

  - name: SlotTransaction
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: Whether the two carriers swap series times (EXCHANGE) or hand a series over (TRANSFER).
        constraints: "kind IN {EXCHANGE, TRANSFER}"
      - name: initiating_carrier_id
        type: string
        source: system
        description: FK -> Carrier.id; copied from the offered holding's carrier_id at proposal time.
      - name: counterparty_carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier asked to respond.
        constraints: counterparty_carrier_id != initiating_carrier_id
      - name: offered_slot_holding_id
        type: string
        source: input
        description: FK -> SlotHolding.id; the series the initiator puts on the table.
      - name: counter_slot_holding_id
        type: string
        source: input
        description: FK -> SlotHolding.id; the counterparty's series offered back. Required when kind == EXCHANGE, forbidden when kind == TRANSFER.
        default: null
      - name: status
        type: enum
        source: system
        description: Branching negotiation position.
        default: PROPOSED
        constraints: "status IN {PROPOSED, COUNTERPARTY_ACCEPTED, COUNTERPARTY_REJECTED, COORDINATOR_DENIED, EXECUTED, WITHDRAWN}"
      - name: response_deadline_utc
        type: datetime
        source: input
        description: Deadline calendar entry — the counterparty must respond at or before this instant.
        constraints: must be at or before Season.slot_return_deadline_utc of the offered holding's season
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the NetworkPlanner that proposed the transaction; compared against the approver for segregation of duties.
      - name: responded_by_user_id
        type: string
        source: system
        description: X-User-ID of the PartnerCarrier that accepted or rejected. Null until a response is filed.
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the SlotCoordinator that approved or denied. Null until then.
        default: null
      - name: executed_at_utc
        type: datetime
        source: system
        description: Logical-clock instant at which the transaction executed. Null unless status == EXECUTED.
        default: null
      - name: successor_slot_holding_id
        type: string
        source: system
        description: FK -> SlotHolding.id; the HELD series minted for the counterparty by a TRANSFER execution. Null for EXCHANGE and for unexecuted transactions.
        default: null
      - name: decision_reason
        type: string
        source: system
        description: Free-text reason attached to a rejection, denial or withdrawal. Null otherwise.
        default: null

  - name: FilingSubmission
    parent: null
    common_fields: true
    fields:
      - name: schedule_version_id
        type: string
        source: input
        description: FK -> ScheduleVersion.id; the version being filed.
      - name: distribution_system
        type: enum
        source: input
        description: Downstream distribution system the SSIM message is addressed to.
        constraints: "distribution_system IN {IATA_SSIM, OAG, GDS_ATPCO}"
      - name: change_window
        type: enum
        source: input
        description: Filing urgency band; selects the charge multiplier and the deadline the submission must beat.
        constraints: "change_window IN {STANDARD, EXPEDITED, EMERGENCY}"
      - name: status
        type: enum
        source: system
        description: Submission lifecycle position.
        default: QUEUED
        constraints: "status IN {QUEUED, TRANSMITTED, ACKNOWLEDGED, REJECTED}"
      - name: changed_leg_count
        type: integer
        source: computed
        description: |
          Frozen at creation: number of FlightLeg rows where
          `schedule_version_id == this.schedule_version_id` AND
          `status IN {SLOT_BACKED, CANCELLED}` at the instant this submission was
          created. Never recomputed afterwards.
      - name: base_charge_subtotal_cents
        type: integer
        source: computed
        description: Step 2 of calculations.filing_change_charge_cents — sum of the per-leg charges, each already rounded to whole cents.
      - name: expedite_rate_pct
        type: number
        source: computed
        description: Step 3 of calculations.filing_change_charge_cents — tier rate selected on base_charge_subtotal_cents (never on total_charge_cents).
      - name: expedite_fee_cents
        type: integer
        source: computed
        description: Step 4 of calculations.filing_change_charge_cents.
      - name: total_charge_cents
        type: integer
        source: computed
        description: base_charge_subtotal_cents + expedite_fee_cents. Frozen once the submission leaves QUEUED.
      - name: codeshare_sync_status
        type: enum
        source: computed
        description: |
          NOT_REQUIRED when no counted leg carries a marketing carrier;
          SYNCHRONIZED when codeshare_ack_carrier_ids covers every marketing
          carrier on the counted legs; PENDING_ACK otherwise.
        default: NOT_REQUIRED
        constraints: "codeshare_sync_status IN {NOT_REQUIRED, PENDING_ACK, SYNCHRONIZED}"
      - name: codeshare_ack_carrier_ids
        type: array
        source: system
        description: Array of Carrier ids that have acknowledged this submission through POST /filing-submissions/{filing_submission_id}/codeshare-ack.
        default: []
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FilingAgent that created the submission.
      - name: transmitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FilingAgent that transmitted it; compared against ScheduleVersion.validated_by_user_id for segregation of duties. Null until transmitted.
        default: null
      - name: transmitted_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of transmission. Null until transmitted.
        default: null
      - name: acknowledged_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of acknowledgement or rejection. Null until then.
        default: null
      - name: resync_required
        type: boolean
        source: system
        description: |
          Set true by the cascade that fires when the linked ScheduleVersion's
          compliance_state moves to WARNED while this submission is ACKNOWLEDGED.
          The submission stays ACKNOWLEDGED; the flag tells the planner a fresh
          filing is owed.
        default: false
      - name: rejection_reason
        type: string
        source: system
        description: |
          Reason recorded on a REJECTED submission. The literal
          "SCHEDULE_BLOCKED" when the rejection was produced by the
          compliance_state -> BLOCKED cascade rather than by the distribution
          system.
        default: null

  - name: RouteAuthority
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier the traffic right is granted to.
      - name: origin_country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country the authority permits departures from.
        constraints: exactly 2 uppercase letters
      - name: dest_country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country the authority permits arrivals into.
        constraints: exactly 2 uppercase letters; dest_country_code != origin_country_code
      - name: freedom_type
        type: enum
        source: input
        description: Freedom of the air the authority conveys.
        constraints: "freedom_type IN {THIRD_FOURTH, FIFTH, SEVENTH}"
      - name: weekly_frequency_cap
        type: integer
        source: input
        description: Maximum non-CANCELLED legs a single ScheduleVersion may place on this country pair within one ISO week.
        constraints: weekly_frequency_cap >= 1
      - name: granted_from_utc
        type: datetime
        source: input
        description: First instant the authority covers.
      - name: granted_until_utc
        type: datetime
        source: input
        description: Last instant the authority covers.
        constraints: granted_until_utc > granted_from_utc
      - name: status
        type: enum
        source: system
        description: Authority lifecycle position.
        default: ACTIVE
        constraints: "status IN {ACTIVE, SUSPENDED, EXPIRED}; SUSPENDED is set by POST /route-authorities/{route_authority_id}/suspend; EXPIRED is set by the same endpoint when the logical clock is already past granted_until_utc"
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded when the authority leaves ACTIVE. Null while ACTIVE.
        default: null

  - name: PassengerNotificationObligation
    parent: null
    common_fields: true
    fields:
      - name: flight_leg_id
        type: string
        source: input
        description: FK -> FlightLeg.id; the leg whose change created the obligation.
      - name: trigger_kind
        type: enum
        source: input
        description: |
          Which schedule change produced the obligation. Supplied by the
          ComplianceOfficer on POST /notification-obligations; set by the system
          when the obligation is raised automatically by a retime, a cancellation
          or a slot-audit loss.
        constraints: "trigger_kind IN {RETIME, CANCELLATION, SLOT_LOSS}"
      - name: change_magnitude_minutes
        type: integer
        source: input
        description: |
          Size of the change the passenger is being told about, in whole minutes.
          When the system raises the obligation it computes this itself — for
          RETIME max(abs(new dep_utc - old dep_utc), abs(new arr_utc - old
          arr_utc)); for CANCELLATION and SLOT_LOSS the constant
          CANCELLATION_EQUIVALENT_MINUTES (240).
        constraints: "integer >= 0"
      - name: booked_first
        type: integer
        source: system
        description: Snapshot of FlightLeg.booked_first at obligation creation.
      - name: booked_business
        type: integer
        source: system
        description: Snapshot of FlightLeg.booked_business at obligation creation.
      - name: booked_economy
        type: integer
        source: system
        description: Snapshot of FlightLeg.booked_economy at obligation creation.
      - name: booked_total
        type: integer
        source: computed
        description: booked_first + booked_business + booked_economy.
      - name: obligation_tier
        type: enum
        source: computed
        description: |
          NONE when booked_total == 0 or change_magnitude_minutes < 30; ADVISORY
          when 30 <= change_magnitude_minutes < 120; MANDATORY_REACCOMMODATION
          when change_magnitude_minutes >= 120. No row is persisted when the tier
          would be NONE.
        constraints: "obligation_tier IN {ADVISORY, MANDATORY_REACCOMMODATION}"
      - name: compensation_cents
        type: integer
        source: computed
        description: Output of calculations.notification_compensation_cents (round per cabin, then sum).
      - name: notify_deadline_utc
        type: datetime
        source: computed
        description: |
          The instant by which the notice must reach the booked passengers:
          the logical clock at obligation creation plus
          calculations.notification_compensation_cents.NOTIFY_WINDOW_HOURS
          (72), frozen on the row and never recomputed afterwards.
      - name: status
        type: enum
        source: system
        description: Obligation lifecycle position; branching to two terminals.
        default: PENDING
        constraints: "status IN {PENDING, DISPATCHED, WAIVED}"
      - name: dispatched_channel
        type: enum
        source: system
        description: Channel the notice went out on. Null until dispatched.
        default: null
        constraints: "dispatched_channel IN {EMAIL, SMS, AGENCY_QUEUE} when present"
      - name: regulator_reference
        type: string
        source: system
        description: Late-dispatch justification reference recorded at dispatch. Null when the dispatch beat the deadline.
        default: null
      - name: late_dispatch
        type: boolean
        source: computed
        description: True when the dispatch happened strictly after notify_deadline_utc. False while PENDING.
        default: false
      - name: waiver_reason
        type: string
        source: system
        description: Reason recorded when the obligation is WAIVED by a reverting cascade. Null otherwise.
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Season
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    dimension: status
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /seasons/{season_id}/transition with to_status=OPEN"
        actor: SystemAdmin
        preconditions:
          - "season.status == DRAFT"
        side_effects:
          - "increments Season.version by 1"
        note: SlotHolding creation, ScheduleVersion creation and slot transactions all require status == OPEN.
      - from: OPEN
        to: CLOSED
        trigger: "POST /seasons/{season_id}/transition with to_status=CLOSED"
        actor: SystemAdmin
        preconditions:
          - "season.status == OPEN"
        side_effects:
          - "increments Season.version by 1"
        note: CLOSED is the only state in which the slot audit may run; it also freezes SlotHolding returns and slot transactions.
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /seasons/{season_id}/transition with to_status=ARCHIVED"
        actor: SystemAdmin
        preconditions:
          - "season.status == CLOSED"
          - "season.slot_audit_completed_at_utc != null (else ERR_SEASON_AUDIT_PENDING)"
        side_effects:
          - "every SlotHolding of this season with holding_status == HELD and retains_historic_precedence == true keeps holding_status HELD and has historic_precedence set to true (grandfather rights carried into the next season)"
          - "increments Season.version by 1"

  - entity: Carrier
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    dimension: status
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /carriers/{carrier_id}/suspend"
        actor: SystemAdmin
        preconditions:
          - "carrier.status == ACTIVE"
        side_effects:
          - "every ScheduleVersion of this carrier with filing_status IN {DRAFT, VALIDATED} moves filing_status to WITHDRAWN"
          - "increments Carrier.version by 1"
        note: A SUSPENDED carrier may not create new ScheduleVersions (validations priority 30).

  - entity: ScheduleVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    dimension: filing_status
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /schedule-versions/{schedule_version_id}/validate"
        actor: ComplianceOfficer
        preconditions:
          - "schedule_version.filing_status == DRAFT"
          - "schedule_version.leg_count >= 1"
          - "every FlightLeg of this version with status != CANCELLED has status == SLOT_BACKED (else ERR_SCHEDULE_VERSION_NOT_READY)"
          - "for every Aircraft referenced by this version's non-CANCELLED legs, aircraft.rotation_feasibility_status == FEASIBLE (else the matching ERR_ROTATION_* / ERR_TURN_TIME_VIOLATION / ERR_DAILY_BLOCK_CAP_EXCEEDED error)"
          - "for every such Aircraft with maintenance_check_required == true, aircraft.maintenance_opportunity_minutes >= aircraft.required_check_minutes (else ERR_MAINTENANCE_OPPORTUNITY_INSUFFICIENT)"
          - "schedule_version.compliance_state != BLOCKED (else ERR_SCHEDULE_BLOCKED)"
        side_effects:
          - "sets ScheduleVersion.validated_by_user_id to the acting X-User-ID"
          - "recomputes leg_count, unslotted_leg_count, curfew_violation_count, mct_violation_count, gate_overflow_count, at_risk_slot_count"
          - "recomputes schedule_compliance_score via calculations.schedule_compliance_score and re-derives compliance_state"
          - "increments ScheduleVersion.version by 1"
      - from: VALIDATED
        to: FILED
        trigger: "POST /filing-submissions/{filing_submission_id}/transmit (system side effect)"
        actor: system
        preconditions:
          - "the submission's schedule_version.filing_status == VALIDATED"
        side_effects:
          - "every FlightLeg of this version with status == SLOT_BACKED moves to FILED"
          - "ScheduleVersion.filing_charge_accrued_cents += FilingSubmission.total_charge_cents"
          - "increments ScheduleVersion.version by 1"
      - from: FILED
        to: VALIDATED
        trigger: "POST /filing-submissions/{filing_submission_id}/acknowledge with outcome=REJECTED, or the compliance_state -> BLOCKED cascade (system)"
        actor: system
        preconditions:
          - "the submission being rejected has status == TRANSMITTED or ACKNOWLEDGED"
        side_effects:
          - "every FlightLeg of this version with status == FILED moves back to SLOT_BACKED; legs already in REFILE_REQUIRED are left untouched (conditional cascade)"
          - "ScheduleVersion.filing_charge_accrued_cents -= FilingSubmission.total_charge_cents (compensation; the ledger returns to its pre-transmit value)"
          - "increments ScheduleVersion.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /schedule-versions/{schedule_version_id}/supersede"
        actor: NetworkPlanner
        preconditions:
          - "schedule_version.filing_status IN {DRAFT, VALIDATED, FILED}"
          - "request expected_schedule_version_version == schedule_version.version (else ERR_STALE_SCHEDULE_VERSION, 412)"
        side_effects:
          - "creates a new ScheduleVersion in filing_status DRAFT with supersedes_version_id set to this version's id, the same carrier_id and season_id, and compliance_state CLEAN"
          - "increments ScheduleVersion.version by 1 on the superseded row"
        note: The same transition applies from VALIDATED and from FILED; the successor always starts in DRAFT with zero legs.
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "POST /schedule-versions/{schedule_version_id}/supersede"
        actor: NetworkPlanner
        preconditions:
          - "schedule_version.filing_status == VALIDATED"
          - "request expected_schedule_version_version == schedule_version.version (else ERR_STALE_SCHEDULE_VERSION, 412)"
        side_effects:
          - "creates the successor ScheduleVersion as above"
          - "increments ScheduleVersion.version by 1 on the superseded row"
      - from: FILED
        to: SUPERSEDED
        trigger: "POST /schedule-versions/{schedule_version_id}/supersede"
        actor: NetworkPlanner
        preconditions:
          - "schedule_version.filing_status == FILED"
          - "request expected_schedule_version_version == schedule_version.version (else ERR_STALE_SCHEDULE_VERSION, 412)"
        side_effects:
          - "creates the successor ScheduleVersion as above"
          - "increments ScheduleVersion.version by 1 on the superseded row"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /schedule-versions/{schedule_version_id}/withdraw, or the Carrier ACTIVE -> SUSPENDED cascade (system)"
        actor: NetworkPlanner
        preconditions:
          - "schedule_version.filing_status IN {DRAFT, VALIDATED}"
          - "no FilingSubmission of this version has status IN {QUEUED, TRANSMITTED} (else ERR_FILING_IN_FLIGHT)"
        side_effects:
          - "every FlightLeg of this version with status != CANCELLED moves to CANCELLED with cancellation_reason \"SCHEDULE_WITHDRAWN\""
          - "each such leg detaches from its departure_slot_holding_id and arrival_slot_holding_id, which recomputes each holding's attached_operations, utilization_pct_as_filed and at_risk_of_loss"
          - "increments ScheduleVersion.version by 1"
      - from: VALIDATED
        to: WITHDRAWN
        trigger: "POST /schedule-versions/{schedule_version_id}/withdraw"
        actor: NetworkPlanner
        preconditions:
          - "schedule_version.filing_status == VALIDATED"
          - "no FilingSubmission of this version has status IN {QUEUED, TRANSMITTED} (else ERR_FILING_IN_FLIGHT)"
        side_effects:
          - "same leg-cancellation and slot-detachment cascade as from DRAFT"
          - "increments ScheduleVersion.version by 1"

  - entity: ScheduleVersion
    initial_state: CLEAN
    terminal_states: []
    dimension: compliance_state
    note: |
      Second, independent state dimension on the same row. It is re-derived from
      calculations.schedule_compliance_score after EVERY mutation that changes
      any counter, and it can move in both directions without filing_status
      changing at all.
    transitions:
      - from: CLEAN
        to: WARNED
        trigger: "system re-derivation after any counter change (leg create/retime/cancel/assign/attach, slot detachment, transaction execution, validate)"
        actor: system
        preconditions:
          - "schedule_compliance_score < 85.00"
          - "at_risk_slot_count == 0"
        side_effects:
          - "every FilingSubmission of this version with status == ACKNOWLEDGED has resync_required set to true (the submission stays ACKNOWLEDGED)"
          - "increments ScheduleVersion.version by 1"
      - from: WARNED
        to: CLEAN
        trigger: "system re-derivation after a counter change that repairs the schedule"
        actor: system
        preconditions:
          - "schedule_compliance_score >= 85.00"
          - "at_risk_slot_count == 0"
        side_effects:
          - "increments ScheduleVersion.version by 1"
        note: resync_required is NOT cleared by recovery; only a fresh FilingSubmission clears the planner's obligation.
      - from: CLEAN
        to: BLOCKED
        trigger: "system re-derivation after any counter change"
        actor: system
        preconditions:
          - "at_risk_slot_count >= 1 OR schedule_compliance_score < 60.00"
        side_effects:
          - "every FilingSubmission of this version with status IN {TRANSMITTED, ACKNOWLEDGED} moves to REJECTED with rejection_reason \"SCHEDULE_BLOCKED\", which reverses ScheduleVersion.filing_charge_accrued_cents by that submission's total_charge_cents and moves the version's FILED legs back to SLOT_BACKED"
          - "conditional cascade: a FilingSubmission of this version with status == QUEUED is left QUEUED and untouched — it never accrued and never reached a distribution system, so there is nothing to reverse. Its transmit attempt is what fails, with ERR_SCHEDULE_BLOCKED."
          - "increments ScheduleVersion.version by 1"
      - from: WARNED
        to: BLOCKED
        trigger: "system re-derivation after any counter change"
        actor: system
        preconditions:
          - "at_risk_slot_count >= 1 OR schedule_compliance_score < 60.00"
        side_effects:
          - "same FilingSubmission rejection and ledger reversal cascade as CLEAN -> BLOCKED"
          - "increments ScheduleVersion.version by 1"
      - from: BLOCKED
        to: WARNED
        trigger: "system re-derivation after a counter change that clears every at-risk slot"
        actor: system
        preconditions:
          - "at_risk_slot_count == 0"
          - "60.00 <= schedule_compliance_score < 85.00"
        side_effects:
          - "increments ScheduleVersion.version by 1"
      - from: BLOCKED
        to: CLEAN
        trigger: "system re-derivation after a counter change that clears every penalty"
        actor: system
        preconditions:
          - "at_risk_slot_count == 0"
          - "schedule_compliance_score >= 85.00"
        side_effects:
          - "increments ScheduleVersion.version by 1"

  - entity: FlightLeg
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    dimension: status
    note: |
      Cyclic: SLOT_BACKED -> FILED -> REFILE_REQUIRED -> SLOT_BACKED can be
      traversed any number of times within one season as slots move.
      `required_slot_set(leg)` = {DEPARTURE if origin Station.coordination_level ==
      LEVEL_3_COORDINATED} UNION {ARRIVAL if dest Station.coordination_level ==
      LEVEL_3_COORDINATED}. A leg is "fully slotted" when every member of that set
      has a non-null holding id on the leg.
    transitions:
      - from: DRAFT
        to: ASSIGNED
        trigger: "POST /flight-legs/{flight_leg_id}/assign-aircraft"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == DRAFT"
          - "aircraft.status == IN_SERVICE (else ERR_AIRCRAFT_NOT_IN_SERVICE)"
          - "aircraft.fleet_type_code == flight_leg.fleet_type_code (else ERR_FLEET_TYPE_MISMATCH)"
          - "aircraft.carrier_id == schedule_version.carrier_id (else ERR_AIRCRAFT_CARRIER_MISMATCH)"
          - "calculations.rotation_feasibility_evaluation over the tail's non-CANCELLED legs plus this one yields FEASIBLE (else ERR_ROTATION_CONTINUITY_BROKEN / ERR_TURN_TIME_VIOLATION / ERR_DAILY_BLOCK_CAP_EXCEEDED)"
        side_effects:
          - "sets FlightLeg.assigned_aircraft_id"
          - "recomputes Aircraft.assigned_leg_count, rotation_feasibility_status, maintenance_opportunity_minutes and cumulative_ground_minutes"
          - "if required_slot_set(leg) is empty OR the leg is already fully slotted, the leg immediately auto-transitions ASSIGNED -> SLOT_BACKED in the same request"
          - "recomputes the version's counters, schedule_compliance_score and compliance_state"
          - "increments FlightLeg.version by 1"
      - from: DRAFT
        to: DRAFT
        trigger: "POST /flight-legs/{flight_leg_id}/attach-slot"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == DRAFT"
          - "slot_holding.holding_status == HELD (else ERR_SLOT_HOLDING_STATE_INVALID)"
          - "slot_holding.carrier_id == schedule_version.carrier_id (else ERR_SLOT_CARRIER_MISMATCH)"
          - "slot_holding.station_id equals the leg's origin_station_id when movement_type == DEPARTURE, or its dest_station_id when movement_type == ARRIVAL (else ERR_SLOT_STATION_MISMATCH)"
          - "the UTC time-of-day of slot_holding.slot_time_utc equals the UTC time-of-day of the leg's dep_utc (DEPARTURE) or arr_utc (ARRIVAL), and the ISO weekday of that instant is a member of slot_holding.days_of_week (else ERR_SLOT_TIME_MISMATCH)"
          - "slot_holding.pending_transaction_id == null (else ERR_SLOT_ENCUMBERED)"
          - "slot_holding.attached_operations < slot_holding.planned_operations (else ERR_SLOT_SERIES_OVERSUBSCRIBED)"
        side_effects:
          - "sets FlightLeg.departure_slot_holding_id or arrival_slot_holding_id"
          - "recomputes SlotHolding.attached_operations, utilization_pct_as_filed and at_risk_of_loss (ledger sync)"
          - "recomputes the version's at_risk_slot_count, schedule_compliance_score and compliance_state"
          - "increments FlightLeg.version by 1 and SlotHolding.version by 1"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /flight-legs/{flight_leg_id}/attach-slot when the leg is not yet fully slotted"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == ASSIGNED"
          - "same slot preconditions as the DRAFT -> DRAFT attach"
          - "required_slot_set(leg) still has an unfilled member other than the one being attached"
        side_effects:
          - "same attach side effects as DRAFT -> DRAFT"
      - from: ASSIGNED
        to: SLOT_BACKED
        trigger: "POST /flight-legs/{flight_leg_id}/attach-slot completing required_slot_set(leg)"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == ASSIGNED"
          - "same slot preconditions as the DRAFT -> DRAFT attach"
          - "after this attachment every member of required_slot_set(leg) is filled"
        side_effects:
          - "same attach side effects, plus status -> SLOT_BACKED"
      - from: REFILE_REQUIRED
        to: REFILE_REQUIRED
        trigger: "POST /flight-legs/{flight_leg_id}/attach-slot when the leg is still not fully slotted"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == REFILE_REQUIRED"
          - "same slot preconditions as the DRAFT -> DRAFT attach"
        side_effects:
          - "same attach side effects as DRAFT -> DRAFT"
      - from: REFILE_REQUIRED
        to: SLOT_BACKED
        trigger: "POST /flight-legs/{flight_leg_id}/attach-slot completing required_slot_set(leg)"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == REFILE_REQUIRED"
          - "flight_leg.assigned_aircraft_id != null"
          - "after this attachment every member of required_slot_set(leg) is filled"
        side_effects:
          - "status -> SLOT_BACKED"
          - "recomputes SlotHolding.attached_operations, utilization_pct_as_filed, at_risk_of_loss"
          - "the version's unslotted_leg_count decreases by 1, schedule_compliance_score rises and compliance_state is re-derived (which may move BLOCKED -> WARNED -> CLEAN)"
          - "increments FlightLeg.version by 1 and SlotHolding.version by 1"
      - from: SLOT_BACKED
        to: FILED
        trigger: "POST /filing-submissions/{filing_submission_id}/transmit (system side effect)"
        actor: system
        preconditions:
          - "flight_leg.status == SLOT_BACKED"
          - "flight_leg.schedule_version_id == the submission's schedule_version_id"
        side_effects:
          - "increments FlightLeg.version by 1"
      - from: FILED
        to: REFILE_REQUIRED
        trigger: "PATCH /flight-legs/{flight_leg_id} changing dep_utc or arr_utc"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == FILED"
          - "new dep_utc/arr_utc fall inside the season window (else ERR_LEG_OUTSIDE_SEASON_WINDOW)"
          - "the retimed leg does not violate curfew at either endpoint unless curfew_waiver_reference is supplied (else ERR_CURFEW_VIOLATION)"
        side_effects:
          - "L1: dep_utc/arr_utc updated; block_minutes recomputed; departure_slot_holding_id and arrival_slot_holding_id are BOTH set to null (a retimed leg loses its slot backing)"
          - "L2: because of L1 each detached SlotHolding recomputes attached_operations and utilization_pct_as_filed"
          - "L3: because of L2 any such holding whose utilization_pct_as_filed fell below 80.00 while still HELD with attached_operations >= 1 flips at_risk_of_loss to true"
          - "L4: because of L3 the version's at_risk_slot_count rises, schedule_compliance_score is recomputed and compliance_state moves to BLOCKED"
          - "L5: because of L4 every FilingSubmission of the version with status IN {TRANSMITTED, ACKNOWLEDGED} moves to REJECTED with rejection_reason \"SCHEDULE_BLOCKED\", ScheduleVersion.filing_charge_accrued_cents is reversed by that submission's total_charge_cents, and the version's remaining FILED legs move back to SLOT_BACKED"
          - "fan-out (not part of the L1..L5 chain): when booked_first + booked_business + booked_economy > 0 and the retime magnitude reaches 30 minutes, a PassengerNotificationObligation is created with trigger_kind RETIME"
          - "Aircraft.rotation_feasibility_status, maintenance_opportunity_minutes and cumulative_ground_minutes are recomputed for the assigned tail"
          - "increments FlightLeg.version by 1"
      - from: SLOT_BACKED
        to: ASSIGNED
        trigger: "PATCH /flight-legs/{flight_leg_id} changing dep_utc or arr_utc"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == SLOT_BACKED"
          - "same retime preconditions as FILED -> REFILE_REQUIRED"
        side_effects:
          - "same L1..L4 detachment chain; the leg returns to ASSIGNED rather than REFILE_REQUIRED because it has not been filed yet, but it is now missing a required slot, so the version's unslotted_leg_count still rises by 1 whenever required_slot_set(leg) is non-empty"
          - "when required_slot_set(leg) is empty the leg immediately re-enters SLOT_BACKED in the same request"
          - "increments FlightLeg.version by 1"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "PATCH /flight-legs/{flight_leg_id} changing dep_utc, arr_utc, flight_number or curfew_waiver_reference"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == ASSIGNED"
          - "same retime preconditions"
        side_effects:
          - "fields updated; slot ids nulled if any were attached; version counters, gate_overflow_count and mct_violation_count recomputed (a retime COUNTS gate overflow and MCT shortfall instead of rejecting them)"
          - "increments FlightLeg.version by 1"
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /flight-legs/{flight_leg_id}"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == DRAFT"
          - "same retime preconditions"
        side_effects:
          - "fields updated; slot ids nulled if any were attached; version counters recomputed"
          - "increments FlightLeg.version by 1"
      - from: REFILE_REQUIRED
        to: REFILE_REQUIRED
        trigger: "PATCH /flight-legs/{flight_leg_id}"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status == REFILE_REQUIRED"
          - "same retime preconditions"
        side_effects:
          - "fields updated; version counters recomputed"
          - "increments FlightLeg.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /flight-legs/{flight_leg_id}/cancel"
        actor: NetworkPlanner
        preconditions:
          - "flight_leg.status != CANCELLED (else ERR_FLIGHT_LEG_STATE_INVALID)"
        side_effects:
          - "sets cancellation_reason; detaches both slot holdings, which recomputes each holding's attached_operations, utilization_pct_as_filed and at_risk_of_loss (compensating the attach; SlotHolding.attached_operations returns to its pre-attach value)"
          - "recomputes Aircraft.assigned_leg_count, rotation_feasibility_status and maintenance opportunity for the assigned tail"
          - "recomputes the version's counters, schedule_compliance_score and compliance_state"
          - "when booked_first + booked_business + booked_economy > 0 a PassengerNotificationObligation is created with trigger_kind CANCELLATION, change_magnitude_minutes 240 and obligation_tier MANDATORY_REACCOMMODATION"
          - "increments FlightLeg.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /flight-legs/{flight_leg_id}/cancel"
        actor: NetworkPlanner
        preconditions: ["flight_leg.status == ASSIGNED"]
        side_effects: ["same cancellation side effects as DRAFT -> CANCELLED"]
      - from: SLOT_BACKED
        to: CANCELLED
        trigger: "POST /flight-legs/{flight_leg_id}/cancel"
        actor: NetworkPlanner
        preconditions: ["flight_leg.status == SLOT_BACKED"]
        side_effects: ["same cancellation side effects as DRAFT -> CANCELLED"]
      - from: FILED
        to: CANCELLED
        trigger: "POST /flight-legs/{flight_leg_id}/cancel"
        actor: NetworkPlanner
        preconditions: ["flight_leg.status == FILED"]
        side_effects: ["same cancellation side effects as DRAFT -> CANCELLED"]
      - from: REFILE_REQUIRED
        to: CANCELLED
        trigger: "POST /flight-legs/{flight_leg_id}/cancel"
        actor: NetworkPlanner
        preconditions: ["flight_leg.status == REFILE_REQUIRED"]
        side_effects: ["same cancellation side effects as DRAFT -> CANCELLED"]
      - from: SLOT_BACKED
        to: REFILE_REQUIRED
        trigger: "SlotTransaction EXECUTED or SlotHolding leaving HELD (system detachment cascade)"
        actor: system
        preconditions:
          - "flight_leg.status IN {SLOT_BACKED, FILED}"
          - "the leg references the holding that left HELD (or whose series time changed) through departure_slot_holding_id or arrival_slot_holding_id"
        side_effects:
          - "the referencing slot id is set to null"
          - "the version's unslotted_leg_count rises, schedule_compliance_score is recomputed and compliance_state is re-derived"
          - "increments FlightLeg.version by 1"
      - from: FILED
        to: REFILE_REQUIRED
        trigger: "SlotTransaction EXECUTED or SlotHolding leaving HELD (system detachment cascade)"
        actor: system
        preconditions:
          - "flight_leg.status == FILED"
          - "the leg references the affected holding"
        side_effects:
          - "same detachment side effects as SLOT_BACKED -> REFILE_REQUIRED"
      - from: FILED
        to: SLOT_BACKED
        trigger: "POST /filing-submissions/{filing_submission_id}/acknowledge with outcome=REJECTED, or the compliance_state -> BLOCKED cascade (system)"
        actor: system
        preconditions:
          - "flight_leg.status == FILED"
        side_effects:
          - "increments FlightLeg.version by 1"
        note: Conditional cascade — legs already in REFILE_REQUIRED are skipped.

  - entity: SlotHolding
    initial_state: HELD
    terminal_states: [RETURNED, TRANSFERRED_OUT, LOST, EXPIRED]
    dimension: holding_status
    transitions:
      - from: HELD
        to: RETURNED
        trigger: "POST /slot-holdings/{slot_holding_id}/return"
        actor: NetworkPlanner
        preconditions:
          - "slot_holding.holding_status == HELD (else ERR_SLOT_HOLDING_STATE_INVALID)"
          - "season.status == OPEN (else ERR_SEASON_NOT_OPEN — checked at priority 26, BEFORE the deadline check at priority 73)"
          - "current_utc <= season.slot_return_deadline_utc (else ERR_SLOT_RETURN_DEADLINE_PASSED)"
          - "slot_holding.pending_transaction_id == null (else ERR_SLOT_ENCUMBERED)"
        side_effects:
          - "sets returned_reason and returned_before_deadline = true"
          - "sets retains_historic_precedence = true — a series handed back before the deadline keeps its grandfather claim for the next season (this is the ONLY exit from HELD that preserves precedence)"
          - "every FlightLeg referencing this holding with status IN {SLOT_BACKED, FILED} moves to REFILE_REQUIRED and nulls the referencing slot id"
          - "recomputes attached_operations (which drops to 0), utilization_pct_as_filed and at_risk_of_loss (which becomes false because holding_status is no longer HELD)"
          - "recomputes each affected ScheduleVersion's unslotted_leg_count, schedule_compliance_score and compliance_state"
          - "increments SlotHolding.version by 1"
      - from: HELD
        to: TRANSFERRED_OUT
        trigger: "POST /slot-transactions/{slot_transaction_id}/approve with decision=APPROVE (system side effect)"
        actor: system
        preconditions:
          - "slot_holding.holding_status == HELD"
          - "slot_holding.id == transaction.offered_slot_holding_id"
        side_effects:
          - "sets retains_historic_precedence = false (the transferor loses the grandfather claim; it moves to the successor holding)"
          - "sets pending_transaction_id = null"
          - "every FlightLeg referencing this holding with status IN {SLOT_BACKED, FILED} moves to REFILE_REQUIRED and nulls the referencing slot id"
          - "recomputes attached_operations, utilization_pct_as_filed, at_risk_of_loss"
          - "increments SlotHolding.version by 1"
      - from: HELD
        to: LOST
        trigger: "POST /seasons/{season_id}/slot-audit (system side effect, use-it-or-lose-it enforcement)"
        actor: system
        preconditions:
          - "slot_holding.holding_status == HELD"
          - "slot_holding.utilization_pct < 80.00 (the as_operated variant — the audit NEVER uses utilization_pct_as_filed)"
        side_effects:
          - "sets historic_precedence = false and retains_historic_precedence = false"
          - "every FlightLeg referencing this holding with status IN {SLOT_BACKED, FILED} moves to REFILE_REQUIRED and nulls the referencing slot id"
          - "recomputes at_risk_of_loss to false (the holding is no longer HELD, so the risk has been realised rather than pending)"
          - "recomputes each affected ScheduleVersion's counters, schedule_compliance_score and compliance_state"
          - "creates one PassengerNotificationObligation with trigger_kind SLOT_LOSS for each detached leg whose booked_first + booked_business + booked_economy > 0"
          - "increments SlotHolding.version by 1"
      - from: HELD
        to: EXPIRED
        trigger: "POST /seasons/{season_id}/transition with to_status=ARCHIVED (system side effect)"
        actor: system
        preconditions:
          - "slot_holding.holding_status == HELD"
          - "slot_holding.retains_historic_precedence == false"
        side_effects:
          - "sets historic_precedence = false"
          - "increments SlotHolding.version by 1"
        note: Holdings with retains_historic_precedence == true stay HELD through archival and carry historic_precedence = true forward.

  - entity: SlotTransaction
    initial_state: PROPOSED
    terminal_states: [COUNTERPARTY_REJECTED, COORDINATOR_DENIED, EXECUTED, WITHDRAWN]
    dimension: status
    note: |
      Branching two-gate workflow: the counterparty answers first, then the slot
      coordinator. Both gates must clear for EXECUTED. The side effects of
      EXECUTED differ by `kind` (EXCHANGE swaps two holdings; TRANSFER mints one
      successor holding for the counterparty).
    transitions:
      - from: PROPOSED
        to: COUNTERPARTY_ACCEPTED
        trigger: "POST /slot-transactions/{slot_transaction_id}/respond with decision=ACCEPT"
        actor: PartnerCarrier
        preconditions:
          - "slot_transaction.status == PROPOSED (else ERR_SLOT_TRANSACTION_STATE_INVALID)"
          - "the acting principal's carrier is slot_transaction.counterparty_carrier_id (else ERR_OWNERSHIP_MISMATCH)"
          - "current_utc <= slot_transaction.response_deadline_utc (else ERR_SLOT_TRANSACTION_DEADLINE_PASSED)"
        side_effects:
          - "sets responded_by_user_id to the acting X-User-ID"
          - "increments SlotTransaction.version by 1"
      - from: PROPOSED
        to: COUNTERPARTY_REJECTED
        trigger: "POST /slot-transactions/{slot_transaction_id}/respond with decision=REJECT"
        actor: PartnerCarrier
        preconditions:
          - "slot_transaction.status == PROPOSED"
          - "the acting principal's carrier is slot_transaction.counterparty_carrier_id"
          - "request rejection_reason is present"
        side_effects:
          - "sets responded_by_user_id and decision_reason"
          - "releases the encumbrance: offered_slot_holding.pending_transaction_id = null (and counter_slot_holding's too when kind == EXCHANGE), incrementing each holding's version by 1"
          - "increments SlotTransaction.version by 1"
      - from: COUNTERPARTY_ACCEPTED
        to: EXECUTED
        trigger: "POST /slot-transactions/{slot_transaction_id}/approve with decision=APPROVE"
        actor: SlotCoordinator
        preconditions:
          - "slot_transaction.status == COUNTERPARTY_ACCEPTED (else ERR_SLOT_TRANSACTION_STATE_INVALID)"
          - "the acting X-User-ID != slot_transaction.proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES, 403)"
          - "season.status == OPEN (else ERR_SEASON_NOT_OPEN)"
          - "offered_slot_holding.historic_precedence == false OR kind == EXCHANGE (a historic series may be exchanged but never transferred outright; else ERR_HISTORIC_PRECEDENCE_PROTECTED)"
        side_effects:
          - "sets approved_by_user_id, executed_at_utc = current_utc"
          - "when kind == TRANSFER: the offered holding moves HELD -> TRANSFERRED_OUT, and a NEW SlotHolding is created for counterparty_carrier_id with the same station_id, season_id, slot_time_utc, days_of_week and series_weeks, holding_status HELD, historic_precedence copied from the offered holding, historic_predecessor_holding_id = the offered holding's id, and attached_operations 0; its id is written back to slot_transaction.successor_slot_holding_id"
          - "when kind == EXCHANGE: the offered and counter holdings swap carrier_id (each row keeps its own slot_time_utc and days_of_week), both stay HELD, no successor holding is minted, and slot_transaction.successor_slot_holding_id stays null"
          - "in BOTH kinds every FlightLeg attached to a holding that changed carrier moves SLOT_BACKED/FILED -> REFILE_REQUIRED with the referencing slot id nulled, which raises each affected ScheduleVersion's unslotted_leg_count, recomputes schedule_compliance_score and re-derives compliance_state; an ACKNOWLEDGED FilingSubmission of such a version has resync_required set to true"
          - "clears pending_transaction_id on every holding involved"
          - "increments SlotTransaction.version by 1"
      - from: COUNTERPARTY_ACCEPTED
        to: COORDINATOR_DENIED
        trigger: "POST /slot-transactions/{slot_transaction_id}/approve with decision=DENY"
        actor: SlotCoordinator
        preconditions:
          - "slot_transaction.status == COUNTERPARTY_ACCEPTED"
          - "the acting X-User-ID != slot_transaction.proposed_by_user_id"
          - "request denial_reason is present"
        side_effects:
          - "sets approved_by_user_id and decision_reason"
          - "releases the encumbrance on every involved holding (pending_transaction_id = null), incrementing each holding's version by 1"
          - "no holding changes carrier and no leg is detached"
          - "increments SlotTransaction.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /slot-transactions/{slot_transaction_id}/withdraw"
        actor: NetworkPlanner
        preconditions:
          - "slot_transaction.status IN {PROPOSED, COUNTERPARTY_ACCEPTED}"
          - "the acting principal's carrier is slot_transaction.initiating_carrier_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "sets decision_reason"
          - "releases the encumbrance on every involved holding"
          - "increments SlotTransaction.version by 1"
      - from: COUNTERPARTY_ACCEPTED
        to: WITHDRAWN
        trigger: "POST /slot-transactions/{slot_transaction_id}/withdraw"
        actor: NetworkPlanner
        preconditions:
          - "slot_transaction.status == COUNTERPARTY_ACCEPTED"
          - "the acting principal's carrier is slot_transaction.initiating_carrier_id"
        side_effects:
          - "same encumbrance release as PROPOSED -> WITHDRAWN"

  - entity: FilingSubmission
    initial_state: QUEUED
    terminal_states: [REJECTED]
    dimension: status
    transitions:
      - from: QUEUED
        to: TRANSMITTED
        trigger: "POST /filing-submissions/{filing_submission_id}/transmit"
        actor: FilingAgent
        preconditions:
          - "filing_submission.status == QUEUED (else ERR_FILING_SUBMISSION_STATE_INVALID)"
          - "schedule_version.compliance_state != BLOCKED (else ERR_SCHEDULE_BLOCKED at priority 34)"
          - "schedule_version.filing_charge_accrued_cents + filing_submission.total_charge_cents <= schedule_version.filing_charge_budget_cents (else ERR_FILING_CHARGE_BUDGET_EXCEEDED, 402, at priority 80)"
          - "filing_submission.codeshare_sync_status != PENDING_ACK (else ERR_CODESHARE_NOT_SYNCHRONIZED, 409)"
          - "the acting X-User-ID != schedule_version.validated_by_user_id (else ERR_SEGREGATION_OF_DUTIES, 403)"
          - "current_utc <= season.filing_change_window_close_utc when change_window == STANDARD (else ERR_CHANGE_WINDOW_CLOSED)"
        side_effects:
          - "sets transmitted_by_user_id and transmitted_at_utc = current_utc"
          - "ScheduleVersion.filing_charge_accrued_cents += total_charge_cents (ledger sync — the invariant accrued == sum of TRANSMITTED/ACKNOWLEDGED totals holds after this write)"
          - "ScheduleVersion.filing_status VALIDATED -> FILED and every SLOT_BACKED leg of that version -> FILED"
          - "increments FilingSubmission.version by 1 and ScheduleVersion.version by 1"
      - from: TRANSMITTED
        to: ACKNOWLEDGED
        trigger: "POST /filing-submissions/{filing_submission_id}/acknowledge with outcome=ACCEPT"
        actor: FilingAgent
        preconditions:
          - "filing_submission.status == TRANSMITTED"
        side_effects:
          - "sets acknowledged_at_utc = current_utc and resync_required = false"
          - "no ledger movement — an ACKNOWLEDGED submission still counts toward filing_charge_accrued_cents"
          - "increments FilingSubmission.version by 1"
      - from: TRANSMITTED
        to: REJECTED
        trigger: "POST /filing-submissions/{filing_submission_id}/acknowledge with outcome=REJECT"
        actor: FilingAgent
        preconditions:
          - "filing_submission.status == TRANSMITTED"
          - "request rejection_reason is present"
        side_effects:
          - "sets rejection_reason and acknowledged_at_utc = current_utc"
          - "ScheduleVersion.filing_charge_accrued_cents -= total_charge_cents (compensation — the ledger returns exactly to its pre-transmit value with no drift)"
          - "ScheduleVersion.filing_status FILED -> VALIDATED and every FILED leg of that version -> SLOT_BACKED (legs already REFILE_REQUIRED are skipped)"
          - "increments FilingSubmission.version by 1 and ScheduleVersion.version by 1"
      - from: ACKNOWLEDGED
        to: REJECTED
        trigger: "the ScheduleVersion compliance_state -> BLOCKED cascade (system)"
        actor: system
        preconditions:
          - "filing_submission.status == ACKNOWLEDGED"
          - "the owning schedule_version has just entered compliance_state BLOCKED"
        side_effects:
          - "sets rejection_reason = \"SCHEDULE_BLOCKED\""
          - "ScheduleVersion.filing_charge_accrued_cents -= total_charge_cents"
          - "increments FilingSubmission.version by 1"
    conditional_cascade_note: |
      The compliance_state -> BLOCKED cascade reaches ONLY submissions in
      TRANSMITTED or ACKNOWLEDGED. A submission still in QUEUED is deliberately
      left alone: it never accrued against filing_charge_accrued_cents and never
      reached a distribution system, so there is no side effect to compensate.
      The block surfaces later, when that QUEUED submission is transmitted and
      the transmit precondition rejects it with ERR_SCHEDULE_BLOCKED.

  - entity: RouteAuthority
    initial_state: ACTIVE
    terminal_states: [SUSPENDED, EXPIRED]
    dimension: status
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /route-authorities/{route_authority_id}/suspend"
        actor: SystemAdmin
        preconditions:
          - "route_authority.status == ACTIVE"
        side_effects:
          - "increments RouteAuthority.version by 1"
        note: |
          Cross-entity guard, not a cascade — suspending an authority does not
          touch existing legs, but every subsequent POST /flight-legs on that
          country pair fails with ERR_ROUTE_AUTHORITY_INACTIVE.
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past granted_until_utc (system re-derivation)"
        actor: system
        preconditions:
          - "route_authority.status == ACTIVE"
          - "current_utc > route_authority.granted_until_utc"
        side_effects:
          - "increments RouteAuthority.version by 1"

  - entity: PassengerNotificationObligation
    initial_state: PENDING
    terminal_states: [DISPATCHED, WAIVED]
    dimension: status
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /notification-obligations/{notification_obligation_id}/dispatch"
        actor: ComplianceOfficer
        preconditions:
          - "obligation.status == PENDING (else ERR_NOTIFICATION_STATE_INVALID)"
          - "when current_utc > obligation.notify_deadline_utc the request MUST carry regulator_reference (else ERR_LATE_NOTIFICATION_UNREFERENCED, 422)"
          - "when obligation_tier == MANDATORY_REACCOMMODATION the channel must be EMAIL or AGENCY_QUEUE, never SMS (else ERR_NOTIFICATION_CHANNEL_INSUFFICIENT, 422)"
        side_effects:
          - "sets dispatched_channel, regulator_reference and late_dispatch = (current_utc > notify_deadline_utc)"
          - "FlightLeg.open_obligation_count decreases by 1 (ledger sync)"
          - "increments PassengerNotificationObligation.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "system reversal when the underlying change is undone (a REFILE_REQUIRED leg is re-slotted at its original dep_utc/arr_utc, or a cancelled leg's version is withdrawn)"
        actor: system
        preconditions:
          - "obligation.status == PENDING"
          - "the leg's dep_utc and arr_utc match the values recorded before the triggering change"
        side_effects:
          - "sets waiver_reason = \"CHANGE_REVERTED\""
          - "FlightLeg.open_obligation_count decreases by 1 (compensation — the counter returns to its pre-change value)"
          - "increments PassengerNotificationObligation.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — the ONLY sanctioned write-write conflict surface
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: schedule_version_supersede_occ
    write_endpoint: "POST /schedule-versions/{schedule_version_id}/supersede"
    occ_entity: ScheduleVersion
    occ_field: version
    request_field: expected_schedule_version_version
    error_id: ERR_STALE_SCHEDULE_VERSION
    http_status: 412
    description: |
      Superseding a schedule version forks the whole plan, so the caller must
      prove it read the version it is forking. Every write anywhere in the
      version's subtree (leg create, retime, cancel, assign, attach, validate,
      transmit, acknowledge, compliance re-derivation) increments
      ScheduleVersion.version, so a supersede request built from a stale read is
      rejected with 412 and NOTHING is mutated — no successor row is created.
      A fresh GET /schedule-versions/{id} then re-attempt succeeds.

  - rule_id: slot_transaction_propose_occ
    write_endpoint: "POST /slot-transactions"
    occ_entity: SlotHolding
    occ_field: version
    request_field: expected_slot_holding_version
    error_id: ERR_STALE_SLOT_HOLDING
    http_status: 412
    description: |
      Proposing an exchange or transfer encumbers the offered SlotHolding
      (pending_transaction_id), which is the one genuinely contended resource in
      the domain. The proposer must supply expected_slot_holding_version matching
      offered_slot_holding.version at read time. Any intervening write to that
      holding — a leg attaching to it, a leg detaching from it, a return, an
      audit outcome, or a competing proposal — bumps the version and makes the
      second proposal fail with 412, leaving pending_transaction_id owned by the
      first proposal only.

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:

  - name: slot_utilization_credit
    algorithm_type: chronological
    output_fields: [SlotHolding.planned_operations, SlotHolding.credited_operations, SlotHolding.utilization_pct, SlotHolding.utilization_pct_as_filed, SlotHolding.at_risk_of_loss]
    input_set: "every SlotUtilizationRecord whose slot_holding_id == this holding, processed in ascending operation_date order, then ascending created_at order for ties"
    constants:
      UTILIZATION_THRESHOLD_PCT: 80.00
      PRECISION_DECIMALS: 2
      ROUNDING: round_half_up
    variants:
      - variant: as_operated
        output_field: SlotHolding.utilization_pct
        formula: |
          planned_operations = series_weeks * len(days_of_week)
          credited_operations = count of records whose outcome IN
              {OPERATED, CANCELLED_ATC, RETURNED_IN_TIME}
            (OPERATED counts because it flew; CANCELLED_ATC counts because the
             cancellation was not the carrier's fault; RETURNED_IN_TIME counts
             because the series was handed back before the deadline.
             CANCELLED_CARRIER and NOT_OPERATED never count.)
          utilization_pct = round_half_up(
              credited_operations * 100 / planned_operations, 2)
        used_by: "POST /seasons/{season_id}/slot-audit — the use-it-or-lose-it audit compares THIS variant against UTILIZATION_THRESHOLD_PCT and moves the holding HELD -> LOST when it is strictly below."
      - variant: as_filed
        output_field: SlotHolding.utilization_pct_as_filed
        formula: |
          utilization_pct_as_filed = round_half_up(
              attached_operations * 100 / planned_operations, 2)
          where attached_operations = count of FlightLeg rows whose
            departure_slot_holding_id or arrival_slot_holding_id is this holding
            and whose status != CANCELLED
        used_by: "SlotHolding.at_risk_of_loss, which is true when holding_status == HELD AND attached_operations >= 1 AND utilization_pct_as_filed < UTILIZATION_THRESHOLD_PCT. This is the forward-looking planning signal that drives ScheduleVersion.at_risk_slot_count; it is NEVER the number the audit acts on."
    variant_divergence_example: |
      planned_operations = 5 (series_weeks 5, days_of_week "1").
      4 SlotUtilizationRecords exist: OPERATED, OPERATED, CANCELLED_ATC,
      CANCELLED_CARRIER  ->  credited_operations = 3  ->  utilization_pct = 60.00.
      Meanwhile 4 non-cancelled legs are attached  ->  attached_operations = 4
      ->  utilization_pct_as_filed = 80.00.
      Same holding, same instant: as_operated 60.00 is BELOW threshold (the audit
      will take the slot) while as_filed 80.00 is exactly AT threshold (so
      at_risk_of_loss is false and the schedule looks clean). Delta 20.00.
    boundary_examples:
      - "credited 4 of 5 -> 80.00, which is NOT strictly below 80.00 -> holding is retained by the audit"
      - "credited 3 of 5 -> 60.00 -> holding is LOST"
      - "attached 4 of 5 -> as_filed 80.00 -> at_risk_of_loss false"
      - "attached 3 of 5 -> as_filed 60.00 -> at_risk_of_loss true"
      - "attached 0 of 5 -> as_filed 0.00 but at_risk_of_loss is still false because attached_operations >= 1 fails (a brand-new holding with no legs yet is not at risk)"
    ordering_note: "Records may be POSTed out of chronological order; the credited count and the resulting percentage must be identical to the in-order result. Only the ordering of the audit's per-holding narrative depends on operation_date."

  - name: maintenance_opportunity_minutes
    algorithm_type: interval_merge
    output_fields: [Aircraft.maintenance_opportunity_minutes, Aircraft.cumulative_ground_minutes]
    input_set: "the FlightLeg rows whose assigned_aircraft_id == this aircraft and whose status != CANCELLED, sorted by dep_utc ASC then created_at ASC, grouped by the UTC calendar date of dep_utc"
    constants:
      PRECISION_DECIMALS: 0
      ROUNDING: round_half_up
    formula: |
      For each UTC calendar date group, walk consecutive leg pairs
      (leg[i], leg[i+1]) and form the ground interval
          [leg[i].arr_utc, leg[i+1].dep_utc)
      Keep the interval ONLY when the station where the aircraft is sitting,
      i.e. leg[i].dest_station_id, has maintenance_capable == true.
      Overlapping or adjacent kept intervals at the same station are merged
      before measurement (gap == 0 means one continuous window).
    variants:
      - variant: contiguous_window
        output_field: Aircraft.maintenance_opportunity_minutes
        formula: "the length in whole minutes of the LONGEST single merged kept interval across all date groups"
      - variant: cumulative_ground
        output_field: Aircraft.cumulative_ground_minutes
        formula: "the SUM in whole minutes of every merged kept interval across all date groups"
    variant_selection: "ERR_MAINTENANCE_OPPORTUNITY_INSUFFICIENT is raised from the contiguous_window variant only: a heavy check cannot be split across two separate ground periods. cumulative_ground_minutes is reported for planning but never gates validation."
    variant_divergence_example: |
      Tail D-AHXA, required_check_minutes 240, one UTC date, MUC maintenance_capable
      true and TXL maintenance_capable false:
        L1 06:00->07:00 MUC->TXL
        L2 07:45->08:45 TXL->MUC
        L3 11:15->12:15 MUC->TXL
        L4 13:00->14:00 TXL->MUC
        L5 16:00->17:00 MUC->TXL
      Ground intervals: [07:00,07:45) at TXL = 45 (DISCARDED, not capable),
      [08:45,11:15) at MUC = 150 (kept), [12:15,13:00) at TXL = 45 (DISCARDED),
      [14:00,16:00) at MUC = 120 (kept).
      contiguous_window = 150; cumulative_ground = 270. Delta 120.
      With required_check_minutes 240 the two variants disagree on the verdict:
      cumulative 270 >= 240 would pass, contiguous 150 < 240 fails. The gate uses
      contiguous, so validation is rejected.
    boundary_examples:
      - "adjacency: if L3 departed at 11:15 and a sixth leg made the MUC ground periods touch exactly (gap 0), the two intervals merge into one window rather than counting as two"
      - "a tail with a single leg has no consecutive pair, so both variants are 0"
      - "an aircraft whose only ground time is at a maintenance_capable == false station reports 0 for both variants even though it sat for hours"

  - name: rotation_feasibility_evaluation
    algorithm_type: constraint_propagation
    output_fields: [Aircraft.rotation_feasibility_status, FlightLeg.block_minutes]
    input_set: "the FlightLeg rows whose assigned_aircraft_id == this aircraft and whose status != CANCELLED, sorted by dep_utc ASC then created_at ASC (never by id), then partitioned into groups by the UTC calendar date of dep_utc; every check below is evaluated WITHIN a single date group only"
    constants:
      INTERNATIONAL_TURN_BUMP_MINUTES: 15
    formula: |
      block_minutes(leg) = (leg.arr_utc - leg.dep_utc) in whole minutes
      required_turn_minutes(inbound_leg) =
          max(aircraft.min_turn_minutes,
              station(inbound_leg.dest_station_id).min_turn_override_minutes)
          + (INTERNATIONAL_TURN_BUMP_MINUTES if inbound_leg.is_international else 0)

      Evaluated in this pinned order and short-circuiting on the FIRST failure,
      recording the offending leg as first_violation_leg_id:
        1. CONTINUITY  — for every consecutive pair,
             leg[i].dest_station_id == leg[i+1].origin_station_id
           else status INFEASIBLE_CONTINUITY / ERR_ROTATION_CONTINUITY_BROKEN
        2. TURN        — for every consecutive pair,
             leg[i+1].dep_utc >= leg[i].arr_utc + required_turn_minutes(leg[i])
           else status INFEASIBLE_TURN / ERR_TURN_TIME_VIOLATION
        3. BLOCK CAP   — for each date group,
             sum(block_minutes) <= aircraft.max_daily_block_minutes
           else status INFEASIBLE_BLOCK_CAP / ERR_DAILY_BLOCK_CAP_EXCEEDED
      All groups clean -> FEASIBLE. An aircraft with zero assigned legs is UNCHECKED.
    propagation_note: |
      The evaluation is a fixed-point walk: assigning, retiming or cancelling ONE
      leg re-derives block_minutes for that leg, then re-walks every date group of
      the tail, then re-derives rotation_feasibility_status, maintenance_opportunity_minutes
      and cumulative_ground_minutes, then re-derives every ScheduleVersion counter
      that references the tail. Because the walk is per-date-group it always
      terminates in one pass; there is no cyclic dependency.
    boundary_examples:
      - "arr 09:00, min_turn_minutes 45, domestic, dest min_turn_override_minutes 0 -> required 45 -> next dep 09:45 is FEASIBLE (>= is inclusive)"
      - "same tail, next dep 09:44 -> ERR_TURN_TIME_VIOLATION"
      - "same tail but the inbound leg is_international -> required 45 + 15 = 60 -> next dep 09:45 now FAILS and 10:00 is the first feasible departure"
      - "dest station min_turn_override_minutes 75 beats aircraft min_turn_minutes 45 -> required 75"
      - "two legs on DIFFERENT UTC dates never form a pair, so a 23:30 arrival followed by a 00:15 departure the next day is not a turn violation and the discontinuity between the last leg of one date and the first leg of the next is not a continuity break"
      - "block cap: 10 legs of 60 minutes = 600 with max_daily_block_minutes 600 -> FEASIBLE; an 11th 60-minute leg on the same date -> 660 -> ERR_DAILY_BLOCK_CAP_EXCEEDED"

  - name: notification_compensation_cents
    algorithm_type: tiered_pricing
    output_fields: [PassengerNotificationObligation.obligation_tier, PassengerNotificationObligation.compensation_cents, PassengerNotificationObligation.booked_total, PassengerNotificationObligation.notify_deadline_utc]
    input_set: "the booked_first / booked_business / booked_economy snapshot copied off the FlightLeg at the instant the obligation is created (the obligation never re-reads the leg afterwards)"
    constants:
      MIN_MAGNITUDE_MINUTES: 30
      TIER_THRESHOLD_MINUTES: 120
      ADVISORY_MULTIPLIER_PCT: 37.50
      MANDATORY_MULTIPLIER_PCT: 100.00
      RATE_FIRST_CENTS: 61500
      RATE_BUSINESS_CENTS: 40252
      RATE_ECONOMY_CENTS: 25124
      NOTIFY_WINDOW_HOURS: 72
      PRECISION_DECIMALS: 0
      ROUNDING: round_half_up
    formula: |
      An obligation is created at all only when
        booked_first + booked_business + booked_economy > 0
        AND change_magnitude_minutes >= MIN_MAGNITUDE_MINUTES
      (a CANCELLATION or SLOT_LOSS trigger always uses
       change_magnitude_minutes = 240, so it always clears MIN_MAGNITUDE_MINUTES).

      obligation_tier = MANDATORY_REACCOMMODATION
                          when change_magnitude_minutes >= TIER_THRESHOLD_MINUTES
                        else ADVISORY
      multiplier_pct  = MANDATORY_MULTIPLIER_PCT for MANDATORY_REACCOMMODATION
                        else ADVISORY_MULTIPLIER_PCT

      PINNED ROUNDING ORDER — round each cabin to whole cents FIRST, then sum:
        first_cents    = round_half_up(booked_first    * RATE_FIRST_CENTS    * multiplier_pct / 100, 0)
        business_cents = round_half_up(booked_business * RATE_BUSINESS_CENTS * multiplier_pct / 100, 0)
        economy_cents  = round_half_up(booked_economy  * RATE_ECONOMY_CENTS  * multiplier_pct / 100, 0)
        compensation_cents = first_cents + business_cents + economy_cents
      Summing the three unrounded cabin amounts and rounding once at the end is
      WRONG and is detectably different (see the worked example).

      booked_total       = booked_first + booked_business + booked_economy
      notify_deadline_utc = current_utc + NOTIFY_WINDOW_HOURS hours
    worked_example: |
      RETIME of 45 minutes, booked_first 3, booked_business 7, booked_economy 41.
      45 < 120 -> ADVISORY -> multiplier 37.50.
        first    3 * 61500 = 184500  * 0.375 =  69187.5 -> 69188
        business 7 * 40252 = 281764  * 0.375 = 105661.5 -> 105662
        economy 41 * 25124 = 1030084 * 0.375 = 386281.5 -> 386282
        compensation_cents = 69188 + 105662 + 386282 = 561132
      Round-at-the-end would give 69187.5 + 105661.5 + 386281.5 = 561130.5
      -> 561131, which is 1 cent LOW. booked_total = 51.
    boundary_examples:
      - "change_magnitude_minutes 29 with 51 booked passengers -> NO obligation is created at all"
      - "change_magnitude_minutes 30 -> obligation created, ADVISORY"
      - "change_magnitude_minutes 119 -> ADVISORY; 120 -> MANDATORY_REACCOMMODATION (the threshold is inclusive on the mandatory side)"
      - "MANDATORY with the same 3/7/41 snapshot: multiplier 100.00 -> 184500 + 281764 + 1030084 = 1496348, and every cabin amount is already whole so the rounding order is invisible"
      - "CANCELLATION with booked 2/5/30: magnitude 240 -> MANDATORY -> 123000 + 201260 + 753720 = 1077980, booked_total 37"
      - "a leg with booked_first 0, booked_business 0, booked_economy 0 that is retimed by 6 hours produces NO obligation"

  - name: filing_change_charge_cents
    algorithm_type: tiered_pricing
    output_fields: [FilingSubmission.changed_leg_count, FilingSubmission.base_charge_subtotal_cents, FilingSubmission.expedite_rate_pct, FilingSubmission.expedite_fee_cents, FilingSubmission.total_charge_cents]
    input_set: "the FlightLeg rows of the submission's schedule_version whose status IN {SLOT_BACKED, CANCELLED} at the instant POST /filing-submissions runs; the count is FROZEN onto the submission and is never recomputed, so later leg churn cannot retroactively change an existing submission's charge"
    constants:
      BASE_RATE_PER_LEG_CENTS: 4225
      TIER_1_MAX_LEGS: 5
      TIER_1_SURCHARGE_PCT: 0.00
      TIER_2_MAX_LEGS: 20
      TIER_2_SURCHARGE_PCT: 12.50
      TIER_3_SURCHARGE_PCT: 22.00
      EXPEDITE_RATE_STANDARD_PCT: 0.00
      EXPEDITE_RATE_EXPEDITED_PCT: 35.00
      EXPEDITE_RATE_EMERGENCY_PCT: 80.00
      PRECISION_DECIMALS: 0
      ROUNDING: round_half_up
    formula: |
      Five steps, in exactly this order:
        1. changed_leg_count = |{legs with status IN {SLOT_BACKED, CANCELLED}}|
        2. raw_cents = changed_leg_count * BASE_RATE_PER_LEG_CENTS
        3. surcharge_pct is chosen by changed_leg_count:
             changed_leg_count <= TIER_1_MAX_LEGS            -> TIER_1_SURCHARGE_PCT
             TIER_1_MAX_LEGS < c <= TIER_2_MAX_LEGS          -> TIER_2_SURCHARGE_PCT
             changed_leg_count >  TIER_2_MAX_LEGS            -> TIER_3_SURCHARGE_PCT
           base_charge_subtotal_cents =
               round_half_up(raw_cents * (100 + surcharge_pct) / 100, 0)
           The tier is a FLAT surcharge on the whole raw amount, not a marginal
           band: 21 legs are all charged at 22.00%, none of them at 0.00%.
        4. expedite_rate_pct is chosen by change_window (STANDARD / EXPEDITED /
           EMERGENCY) and
               expedite_fee_cents =
                   round_half_up(base_charge_subtotal_cents * expedite_rate_pct / 100, 0)
           The expedite fee is keyed on base_charge_subtotal_cents — the
           POST-surcharge subtotal — never on raw_cents and never on a total that
           already contains the fee.
        5. total_charge_cents = base_charge_subtotal_cents + expedite_fee_cents
    worked_examples:
      - "4 legs, EXPEDITED: raw 16900; tier 1 surcharge 0.00 -> subtotal 16900; expedite 35.00 -> 5915; total 22815"
      - "7 legs, EMERGENCY: raw 29575; tier 2 surcharge 12.50 -> 33271.875 -> subtotal 33272; expedite 80.00 -> 26617.6 -> 26618; total 59890. Keying the expedite fee on raw_cents instead would give 23660 and a total of 56932."
      - "20 legs, STANDARD: raw 84500; tier 2 -> 95062.5 -> round_half_up -> subtotal 95063 (a banker's-rounding implementation returns 95062 and is wrong); expedite 0 -> total 95063"
      - "21 legs, STANDARD: raw 88725; tier 3 surcharge 22.00 -> 108244.5 -> subtotal 108245; total 108245, which exceeds the default filing_charge_budget_cents of 100000 and makes transmit fail with ERR_FILING_CHARGE_BUDGET_EXCEEDED"
    boundary_examples:
      - "5 legs -> tier 1 -> subtotal 21125; 6 legs -> tier 2 -> raw 25350 -> 28518.75 -> 28519"
      - "20 legs -> tier 2; 21 legs -> tier 3"
      - "0 changed legs -> raw 0, subtotal 0, expedite 0, total 0 (a submission is still creatable and still transmits)"

  - name: schedule_compliance_score
    algorithm_type: weighted_scoring
    output_fields: [ScheduleVersion.schedule_compliance_score, ScheduleVersion.compliance_state, ScheduleVersion.unslotted_leg_count, ScheduleVersion.curfew_violation_count, ScheduleVersion.mct_violation_count, ScheduleVersion.gate_overflow_count, ScheduleVersion.at_risk_slot_count]
    input_set: "the FlightLeg rows of this version with status != CANCELLED, plus every SlotHolding referenced by those legs"
    constants:
      BASE_SCORE: 100.00
      W_CURFEW: 12.00
      W_MCT: 7.00
      W_GATE: 9.00
      W_UNSLOTTED: 8.00
      W_AT_RISK_SLOT: 15.00
      BLOCK_THRESHOLD: 60.00
      WARN_THRESHOLD: 85.00
      PRECISION_DECIMALS: 2
      ROUNDING: round_half_up
    formula: |
      Counters first (all over non-CANCELLED legs of this version):
        curfew_violation_count = |{legs with a non-null curfew_waiver_reference}|
        mct_violation_count    = |{legs with mct_shortfall_minutes > 0}|
        gate_overflow_count    = |{legs that sit in a station/UTC-date window whose
                                   gate_occupancy_load peak exceeds that station's
                                   gate_count}|
        unslotted_leg_count    = |{legs that are not fully slotted: status ==
                                   REFILE_REQUIRED, or some member of
                                   required_slot_set(leg) has no holding
                                   attached (a leg touching no
                                   LEVEL_3_COORDINATED station has an empty
                                   required_slot_set and never counts here)}|
        at_risk_slot_count     = |{distinct SlotHoldings referenced by those legs
                                   with at_risk_of_loss == true}|
      Then:
        raw_penalty = curfew_violation_count * W_CURFEW
                    + mct_violation_count    * W_MCT
                    + gate_overflow_count    * W_GATE
                    + unslotted_leg_count    * W_UNSLOTTED
                    + at_risk_slot_count     * W_AT_RISK_SLOT
        capped_penalty = min(raw_penalty, 100.00)
        schedule_compliance_score =
            round_half_up(max(0.00, BASE_SCORE - capped_penalty), 2)
      And the derived dimension:
        compliance_state = BLOCKED  if at_risk_slot_count >= 1
                                    OR schedule_compliance_score < BLOCK_THRESHOLD
                           WARNED   elif schedule_compliance_score < WARN_THRESHOLD
                           CLEAN    else
      A single at-risk slot BLOCKS regardless of score: losing a coordinated-airport
      series is unrecoverable, so it is not tradeable against a good score.
    worked_examples:
      - "0 of everything -> raw 0 -> score 100.00 -> CLEAN"
      - "at_risk_slot_count 1 and unslotted_leg_count 1 -> raw 15 + 8 = 23 -> score 77.00 -> BLOCKED (77.00 is far above BLOCK_THRESHOLD; the at-risk slot is what blocks)"
      - "unslotted_leg_count 2, at_risk 0 -> raw 16 -> score 84.00 -> WARNED"
      - "2 curfew + 1 mct + 1 gate -> raw 24 + 7 + 9 = 40 -> score 60.00 -> WARNED, because the block test is strictly less than 60.00"
      - "3 curfew + 1 mct + 1 gate -> raw 36 + 7 + 9 = 52 -> score 48.00 -> BLOCKED with at_risk_slot_count still 0"
      - "5 curfew + 3 gate + 2 mct -> raw 60 + 27 + 14 = 101 -> capped 100.00 -> score 0.00 (never negative) -> BLOCKED"
    boundary_examples:
      - "raw 15 (one curfew + one mct minus... precisely: one at-risk slot alone) -> score 85.00 which is NOT below WARN_THRESHOLD, so the score alone says CLEAN — but at_risk_slot_count 1 forces BLOCKED. This is the pair that separates a score-only implementation from a correct one."
      - "raw 16 -> 84.00 -> WARNED (first score below the warn line)"
      - "raw 40 -> 60.00 -> WARNED; raw 41 -> 59.00 -> BLOCKED"

  - name: gate_occupancy_load
    algorithm_type: interval_merge
    output_fields: [ScheduleVersion.gate_overflow_count]
    input_set: "for one Station and one UTC calendar date, every FlightLeg with status != CANCELLED whose origin_station_id is that station (contributing a departure occupancy) or whose dest_station_id is that station (contributing an arrival occupancy), across ALL schedule versions and carriers at that station"
    constants:
      GATE_PREP_MINUTES: 45
      GATE_RELEASE_MINUTES: 30
    formula: |
      Each leg contributes a HALF-OPEN occupancy interval:
        departure at this station:  [dep_utc - GATE_PREP_MINUTES, dep_utc)
        arrival   at this station:  [arr_utc, arr_utc + GATE_RELEASE_MINUTES)
      A leg that both arrives at and departs from the same station contributes
      both intervals independently.
      peak_concurrency = the maximum number of intervals simultaneously active,
      computed by sweeping the interval endpoints in ascending instant order and
      processing every END before any START at the same instant (this is what
      makes the intervals half-open: two intervals that merely touch are NOT
      concurrent).
      The station is over capacity when peak_concurrency > station.gate_count.
    worked_examples:
      - "FRA gate_count 2, departures at 08:00, 08:20 and 08:40 -> intervals [07:15,08:00), [07:35,08:20), [07:55,08:40). At 07:55 all three are active -> peak 3 > 2 -> ERR_GATE_CAPACITY_EXCEEDED at POST /flight-legs"
      - "FRA gate_count 2, departures at 08:00 and 08:20 -> peak 2 -> exactly at capacity -> accepted"
      - "touching intervals: a departure at 08:00 gives [07:15,08:00) and a departure at 08:45 gives [08:00,08:45); at instant 08:00 the first has already ended, so peak is 1, not 2"
      - "an arrival at 08:00 gives [08:00,08:30) and a departure at 08:45 gives [08:00,08:45) -> these two DO overlap -> peak 2"
    reject_vs_count_note: |
      POST /flight-legs REJECTS with ERR_GATE_CAPACITY_EXCEEDED when the new leg
      pushes peak_concurrency above gate_count. PATCH /flight-legs/{id} does NOT
      reject: it accepts the retime and increments ScheduleVersion.gate_overflow_count
      instead, so the overflow is visible in the compliance score. This asymmetry
      is deliberate — a planner must be able to retime into a congested bank and
      then see the penalty.

  - name: mct_shortfall_minutes
    algorithm_type: threshold
    output_fields: [FlightLeg.connect_minutes, FlightLeg.mct_shortfall_minutes, FlightLeg.is_international, FlightLeg.block_minutes]
    input_set: "this FlightLeg and, when connects_from_leg_id is not null, the upstream FlightLeg it references"
    constants:
      PRECISION_DECIMALS: 0
    formula: |
      is_international(leg) = station(origin_station_id).country_code
                           != station(dest_station_id).country_code
      block_minutes(leg)    = (arr_utc - dep_utc) in whole minutes

      When connects_from_leg_id is null: connect_minutes = null and
      mct_shortfall_minutes = 0.
      Otherwise, with up = the upstream leg and cx = station(up.dest_station_id):
        connect_minutes = (this.dep_utc - up.arr_utc) in whole minutes
        required_mct = cx.min_connect_international_minutes
                         when up.is_international OR this.is_international
                       else cx.min_connect_domestic_minutes
        mct_shortfall_minutes = max(0, required_mct - connect_minutes)
      A single international sector on EITHER side of the connection promotes the
      whole connection to the international minimum.
    worked_examples:
      - "FRA min_connect_domestic_minutes 35: upstream arrives 10:00, this departs 10:35 -> connect 35, required 35, shortfall 0 -> accepted"
      - "same pair with this departing 10:34 -> connect 34, shortfall 1 -> ERR_MIN_CONNECT_TIME_VIOLATION at POST /flight-legs"
      - "FRA min_connect_international_minutes 60, upstream is a DE->PT sector arriving 10:00, this is a domestic DE sector departing 10:45 -> required 60, connect 45, shortfall 15 -> rejected at create even though 45 clears the domestic 35"
      - "negative connect time: this departs 09:50 before the upstream arrives at 10:00 -> connect -10 -> shortfall 45 -> rejected"
    boundary_examples:
      - "connect_minutes exactly equal to required_mct -> shortfall 0 (the minimum is inclusive)"
      - "upstream.dest_station_id != this.origin_station_id -> ERR_CONNECTION_STATION_MISMATCH, checked BEFORE any MCT arithmetic"
      - "a retime via PATCH that creates a shortfall is accepted and only increments ScheduleVersion.mct_violation_count"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority order;
#      the FIRST rule whose condition is violated determines the response)
# ---------------------------------------------------------------------------
validations:

  # ---- authentication / authorization -------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  # ---- request shape ------------------------------------------------------
  - priority: 4
    category: request
    check: "every required input field is present; enum fields carry a declared member; timestamps parse as ISO-8601 with a Z suffix; integer fields are integers within range; monetary and count fields are non-negative; days_of_week is a non-empty string of distinct digits 1-7; limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # ---- existence (path ids left-to-right, then body FK references) --------
  - priority: 6
    category: existence
    check: "the carrier_id in the path or body resolves to a Carrier"
    error_id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /carriers/{carrier_id}, POST /carriers/{carrier_id}/suspend, POST /aircraft, POST /schedule-versions, POST /slot-holdings, POST /slot-transactions, POST /route-authorities, POST /filing-submissions/{filing_submission_id}/codeshare-ack"
  - priority: 7
    category: existence
    check: "every station id in the path or body resolves to a Station"
    error_id: ERR_STATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /stations/{station_id}, POST /aircraft, POST /flight-legs, POST /slot-holdings"
  - priority: 8
    category: existence
    check: "the season_id in the path or body resolves to a Season"
    error_id: ERR_SEASON_NOT_FOUND
    http_status: 404
    applies_to: "GET /seasons/{season_id}, POST /seasons/{season_id}/transition, POST /seasons/{season_id}/slot-audit, POST /schedule-versions, POST /slot-holdings"
  - priority: 9
    category: existence
    check: "the aircraft_id in the path or body resolves to an Aircraft"
    error_id: ERR_AIRCRAFT_NOT_FOUND
    http_status: 404
    applies_to: "GET /aircraft/{aircraft_id}, GET /aircraft/{aircraft_id}/rotation-feasibility, POST /flight-legs/{flight_leg_id}/assign-aircraft"
  - priority: 10
    category: existence
    check: "the schedule_version_id in the path or body resolves to a ScheduleVersion"
    error_id: ERR_SCHEDULE_VERSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /schedule-versions/{schedule_version_id}, POST /schedule-versions/{schedule_version_id}/supersede, POST /schedule-versions/{schedule_version_id}/validate, POST /schedule-versions/{schedule_version_id}/withdraw, POST /flight-legs, POST /filing-submissions"
  - priority: 11
    category: existence
    check: "the flight_leg_id in the path or body resolves to a FlightLeg"
    error_id: ERR_FLIGHT_LEG_NOT_FOUND
    http_status: 404
    applies_to: "GET /flight-legs/{flight_leg_id}, PATCH /flight-legs/{flight_leg_id}, all POST /flight-legs/{flight_leg_id}/* actions, POST /flight-legs (connects_from_leg_id), POST /notification-obligations"
  - priority: 12
    category: existence
    check: "the slot_holding_id in the path or body resolves to a SlotHolding"
    error_id: ERR_SLOT_HOLDING_NOT_FOUND
    http_status: 404
    applies_to: "GET /slot-holdings/{slot_holding_id}, POST /slot-holdings/{slot_holding_id}/return, POST /flight-legs/{flight_leg_id}/attach-slot, POST /slot-utilization-records, POST /slot-transactions (offered_slot_holding_id and counter_slot_holding_id)"
  - priority: 13
    category: existence
    check: "the slot_utilization_record_id in the path resolves to a SlotUtilizationRecord"
    error_id: ERR_SLOT_UTILIZATION_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /slot-utilization-records/{slot_utilization_record_id}"
  - priority: 14
    category: existence
    check: "the slot_transaction_id in the path resolves to a SlotTransaction"
    error_id: ERR_SLOT_TRANSACTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /slot-transactions/{slot_transaction_id}, POST /slot-transactions/{slot_transaction_id}/respond, POST /slot-transactions/{slot_transaction_id}/approve, POST /slot-transactions/{slot_transaction_id}/withdraw"
  - priority: 15
    category: existence
    check: "the filing_submission_id in the path resolves to a FilingSubmission"
    error_id: ERR_FILING_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /filing-submissions/{filing_submission_id}, POST /filing-submissions/{filing_submission_id}/codeshare-ack, POST /filing-submissions/{filing_submission_id}/transmit, POST /filing-submissions/{filing_submission_id}/acknowledge"
  - priority: 16
    category: existence
    check: "the route_authority_id in the path resolves to a RouteAuthority"
    error_id: ERR_ROUTE_AUTHORITY_NOT_FOUND
    http_status: 404
    applies_to: "GET /route-authorities/{route_authority_id}, POST /route-authorities/{route_authority_id}/suspend"
  - priority: 17
    category: existence
    check: "the notification_obligation_id in the path resolves to a PassengerNotificationObligation"
    error_id: ERR_NOTIFICATION_OBLIGATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /notification-obligations/{notification_obligation_id}, POST /notification-obligations/{notification_obligation_id}/dispatch"

  # ---- ownership ----------------------------------------------------------
  - priority: 20
    category: auth
    check: "when X-User-Role is an entity_backed role (NetworkPlanner or PartnerCarrier), the acting X-User-ID must equal the Carrier id that owns the target resource: schedule_version.carrier_id for schedule and leg writes, slot_holding.carrier_id for slot writes, slot_transaction.initiating_carrier_id for withdraw, slot_transaction.counterparty_carrier_id for respond"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "every write under /schedule-versions, /flight-legs, /slot-holdings, /slot-transactions"

  # ---- optimistic concurrency (before any state check) -------------------
  - priority: 22
    category: state
    check: "expected_schedule_version_version equals schedule_version.version"
    error_id: ERR_STALE_SCHEDULE_VERSION
    http_status: 412
    applies_to: "POST /schedule-versions/{schedule_version_id}/supersede"
  - priority: 23
    category: state
    check: "expected_slot_holding_version equals offered_slot_holding.version"
    error_id: ERR_STALE_SLOT_HOLDING
    http_status: 412
    applies_to: "POST /slot-transactions"

  # ---- season lifecycle gate (deliberately ABOVE every temporal deadline) -
  - priority: 26
    category: state
    check: "the governing Season.status == OPEN"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 409
    applies_to: "POST /schedule-versions, POST /flight-legs, POST /slot-holdings, POST /slot-holdings/{slot_holding_id}/return, POST /slot-transactions, POST /slot-transactions/{slot_transaction_id}/approve"
    priority_conflict_note: "Ranked at 26, far above ERR_SLOT_RETURN_DEADLINE_PASSED at 73. A return attempt against a CLOSED season whose slot_return_deadline_utc has ALSO already passed must report ERR_SEASON_NOT_OPEN — the season being shut is the more fundamental objection than the deadline being blown."
  - priority: 27
    category: state
    check: "Season.status is CLOSED when POST /seasons/{season_id}/slot-audit runs, and the requested to_status is the immediate successor of the current status for POST /seasons/{season_id}/transition (DRAFT->OPEN->CLOSED->ARCHIVED only)"
    error_id: ERR_SEASON_STATE_INVALID
    http_status: 409
    applies_to: "POST /seasons/{season_id}/transition, POST /seasons/{season_id}/slot-audit"
  - priority: 28
    category: state
    check: "Season.slot_audit_completed_at_utc is null when the audit runs"
    error_id: ERR_SLOT_AUDIT_ALREADY_RUN
    http_status: 409
    applies_to: "POST /seasons/{season_id}/slot-audit"
  - priority: 29
    category: state
    check: "Season.slot_audit_completed_at_utc is NOT null before a CLOSED -> ARCHIVED transition"
    error_id: ERR_SEASON_AUDIT_PENDING
    http_status: 409
    applies_to: "POST /seasons/{season_id}/transition"
  - priority: 30
    category: state
    check: "the owning Carrier.status == ACTIVE"
    error_id: ERR_CARRIER_SUSPENDED
    http_status: 409
    applies_to: "POST /schedule-versions, POST /aircraft, POST /slot-holdings, POST /slot-transactions"

  # ---- target-resource state preconditions -------------------------------
  - priority: 32
    category: state
    check: "ScheduleVersion.filing_status permits the requested action: validate requires DRAFT; withdraw requires DRAFT or VALIDATED; supersede requires DRAFT, VALIDATED or FILED; POST /flight-legs and POST /filing-submissions require DRAFT (legs) / VALIDATED (submissions)"
    error_id: ERR_SCHEDULE_VERSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /schedule-versions/{schedule_version_id}/validate, POST /schedule-versions/{schedule_version_id}/withdraw, POST /schedule-versions/{schedule_version_id}/supersede, POST /flight-legs, POST /filing-submissions"
  - priority: 33
    category: state
    check: "at validate time the version has leg_count >= 1 and every non-CANCELLED leg has a non-null assigned_aircraft_id"
    error_id: ERR_SCHEDULE_VERSION_NOT_READY
    http_status: 409
    applies_to: "POST /schedule-versions/{schedule_version_id}/validate"
  - priority: 34
    category: state
    check: "ScheduleVersion.compliance_state != BLOCKED"
    error_id: ERR_SCHEDULE_BLOCKED
    http_status: 409
    applies_to: "POST /schedule-versions/{schedule_version_id}/validate, POST /filing-submissions, POST /filing-submissions/{filing_submission_id}/transmit"
    priority_conflict_note: "Ranked at 34, above ERR_FILING_CHARGE_BUDGET_EXCEEDED at 80. A transmit that is BOTH blocked on compliance AND over the filing charge budget must report ERR_SCHEDULE_BLOCKED — a schedule that must not be filed at all is never a budget question."
  - priority: 35
    category: state
    check: "FlightLeg.status permits the requested action: assign-aircraft requires DRAFT; attach-slot requires DRAFT, ASSIGNED or REFILE_REQUIRED; PATCH and booking-snapshot require any status except CANCELLED; cancel requires any status except CANCELLED"
    error_id: ERR_FLIGHT_LEG_STATE_INVALID
    http_status: 409
    applies_to: "PATCH /flight-legs/{flight_leg_id}, all POST /flight-legs/{flight_leg_id}/* actions"
  - priority: 36
    category: state
    check: "SlotHolding.holding_status == HELD"
    error_id: ERR_SLOT_HOLDING_STATE_INVALID
    http_status: 409
    applies_to: "POST /flight-legs/{flight_leg_id}/attach-slot, POST /slot-holdings/{slot_holding_id}/return, POST /slot-utilization-records, POST /slot-transactions"
  - priority: 37
    category: state
    check: "SlotHolding.pending_transaction_id is null — a holding encumbered by an open exchange or transfer cannot be attached, returned or re-offered"
    error_id: ERR_SLOT_ENCUMBERED
    http_status: 409
    applies_to: "POST /flight-legs/{flight_leg_id}/attach-slot, POST /slot-holdings/{slot_holding_id}/return, POST /slot-transactions"
  - priority: 38
    category: state
    check: "SlotTransaction.status permits the requested action: respond requires PROPOSED; approve requires COUNTERPARTY_ACCEPTED; withdraw requires PROPOSED or COUNTERPARTY_ACCEPTED"
    error_id: ERR_SLOT_TRANSACTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /slot-transactions/{slot_transaction_id}/respond, POST /slot-transactions/{slot_transaction_id}/approve, POST /slot-transactions/{slot_transaction_id}/withdraw"
  - priority: 39
    category: state
    check: "FilingSubmission.status permits the requested action: transmit requires QUEUED; acknowledge requires TRANSMITTED; codeshare-ack requires QUEUED"
    error_id: ERR_FILING_SUBMISSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /filing-submissions/{filing_submission_id}/transmit, POST /filing-submissions/{filing_submission_id}/acknowledge, POST /filing-submissions/{filing_submission_id}/codeshare-ack"
  - priority: 40
    category: state
    check: "PassengerNotificationObligation.status == PENDING"
    error_id: ERR_NOTIFICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /notification-obligations/{notification_obligation_id}/dispatch"
  - priority: 41
    category: state
    check: "no FilingSubmission of this ScheduleVersion has status IN {QUEUED, TRANSMITTED}"
    error_id: ERR_FILING_IN_FLIGHT
    http_status: 409
    applies_to: "POST /schedule-versions/{schedule_version_id}/withdraw"

  # ---- business_safety: regulatory and operational safety ----------------
  - priority: 44
    category: business_safety
    check: "the acting X-User-ID differs from the user that performed the paired upstream step — transmit's actor must not be schedule_version.validated_by_user_id, and approve's actor must not be slot_transaction.proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /filing-submissions/{filing_submission_id}/transmit, POST /slot-transactions/{slot_transaction_id}/approve"
  - priority: 45
    category: business_safety
    check: "neither endpoint of the leg falls inside its station's local curfew window, unless the request supplies curfew_waiver_reference. The window is evaluated in station local time: local_minutes = (utc_minute_of_day + station.utc_offset_minutes) mod 1440, and when curfew_start_local_minutes > curfew_end_local_minutes the window wraps midnight (inclusive of start, exclusive of end)"
    error_id: ERR_CURFEW_VIOLATION
    http_status: 422
    applies_to: "POST /flight-legs, PATCH /flight-legs/{flight_leg_id}"
    priority_conflict_note: "Ranked at 45, above ERR_ROUTE_AUTHORITY_MISSING at 66. A leg that both lands inside a night curfew and has no traffic right at all must report ERR_CURFEW_VIOLATION — a noise-abatement breach is a physical-safety/community objection and outranks a paperwork objection."
  - priority: 46
    category: business_safety
    check: "for every Aircraft with maintenance_check_required == true that is assigned to a non-CANCELLED leg of the version, aircraft.maintenance_opportunity_minutes >= aircraft.required_check_minutes. The check reads the contiguous_window variant only; cumulative_ground_minutes is never sufficient"
    error_id: ERR_MAINTENANCE_OPPORTUNITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /schedule-versions/{schedule_version_id}/validate"
  - priority: 47
    category: business_safety
    check: "an obligation whose obligation_tier == MANDATORY_REACCOMMODATION is dispatched over EMAIL or AGENCY_QUEUE; SMS is not an acceptable channel for a reaccommodation notice"
    error_id: ERR_NOTIFICATION_CHANNEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /notification-obligations/{notification_obligation_id}/dispatch"

  # ---- business_constraint: fleet, rotation, connection, gate, slot ------
  - priority: 48
    category: business_constraint
    check: "Aircraft.status == IN_SERVICE"
    error_id: ERR_AIRCRAFT_NOT_IN_SERVICE
    http_status: 422
    applies_to: "POST /flight-legs/{flight_leg_id}/assign-aircraft"
  - priority: 49
    category: business_constraint
    check: "aircraft.fleet_type_code == flight_leg.fleet_type_code"
    error_id: ERR_FLEET_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /flight-legs/{flight_leg_id}/assign-aircraft"
  - priority: 50
    category: business_constraint
    check: "aircraft.carrier_id == the leg's schedule_version.carrier_id"
    error_id: ERR_AIRCRAFT_CARRIER_MISMATCH
    http_status: 422
    applies_to: "POST /flight-legs/{flight_leg_id}/assign-aircraft"
  - priority: 51
    category: business_constraint
    check: "within each UTC-date group of the tail's non-CANCELLED legs sorted by dep_utc then created_at, every consecutive pair satisfies leg[i].dest_station_id == leg[i+1].origin_station_id"
    error_id: ERR_ROTATION_CONTINUITY_BROKEN
    http_status: 422
    applies_to: "POST /flight-legs/{flight_leg_id}/assign-aircraft"
  - priority: 52
    category: business_constraint
    check: "within each UTC-date group, every consecutive pair satisfies leg[i+1].dep_utc >= leg[i].arr_utc + required_turn_minutes(leg[i])"
    error_id: ERR_TURN_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /flight-legs/{flight_leg_id}/assign-aircraft"
  - priority: 53
    category: business_constraint
    check: "within each UTC-date group, sum(block_minutes) <= aircraft.max_daily_block_minutes"
    error_id: ERR_DAILY_BLOCK_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /flight-legs/{flight_leg_id}/assign-aircraft"
  - priority: 54
    category: business_constraint
    check: "when connects_from_leg_id is supplied, the upstream leg belongs to the same schedule_version and upstream.dest_station_id == this leg's origin_station_id"
    error_id: ERR_CONNECTION_STATION_MISMATCH
    http_status: 422
    applies_to: "POST /flight-legs"
  - priority: 55
    category: business_constraint
    check: "mct_shortfall_minutes == 0 at creation time"
    error_id: ERR_MIN_CONNECT_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /flight-legs"
    conditional_note: "Creation REJECTS a shortfall; PATCH /flight-legs/{flight_leg_id} accepts it and increments ScheduleVersion.mct_violation_count instead."
  - priority: 56
    category: business_constraint
    check: "gate_occupancy_load peak_concurrency <= station.gate_count at both endpoints of the new leg, on the leg's own UTC date, aggregated across every carrier and schedule version at that station"
    error_id: ERR_GATE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /flight-legs"
    conditional_note: "Creation REJECTS an overflow; PATCH /flight-legs/{flight_leg_id} accepts it and increments ScheduleVersion.gate_overflow_count instead. Aggregate validation — each leg is individually fine and only the collective bank exceeds the gate count."
  - priority: 57
    category: business_constraint
    check: "the station of a new SlotHolding has coordination_level == LEVEL_3_COORDINATED — slots exist only at fully coordinated airports"
    error_id: ERR_STATION_NOT_COORDINATED
    http_status: 422
    applies_to: "POST /slot-holdings"
  - priority: 58
    category: business_constraint
    check: "at validate time every non-CANCELLED leg has a non-null departure_slot_holding_id when its origin station is LEVEL_3_COORDINATED and a non-null arrival_slot_holding_id when its destination station is LEVEL_3_COORDINATED"
    error_id: ERR_SLOT_REQUIRED_AT_COORDINATED_STATION
    http_status: 422
    applies_to: "POST /schedule-versions/{schedule_version_id}/validate"
  - priority: 59
    category: business_constraint
    check: "slot_holding.station_id equals the leg's origin_station_id for movement_type DEPARTURE and its dest_station_id for movement_type ARRIVAL"
    error_id: ERR_SLOT_STATION_MISMATCH
    http_status: 422
    applies_to: "POST /flight-legs/{flight_leg_id}/attach-slot"
  - priority: 60
    category: business_constraint
    check: "slot_holding.carrier_id equals the leg's schedule_version.carrier_id, and for POST /slot-utilization-records the acting planner's carrier"
    error_id: ERR_SLOT_CARRIER_MISMATCH
    http_status: 422
    applies_to: "POST /flight-legs/{flight_leg_id}/attach-slot, POST /slot-utilization-records"
  - priority: 61
    category: business_constraint
    check: "the UTC time-of-day of slot_holding.slot_time_utc equals the UTC time-of-day of the leg's dep_utc (DEPARTURE) or arr_utc (ARRIVAL), and the ISO weekday (1=Monday..7=Sunday) of that instant is a member of slot_holding.days_of_week"
    error_id: ERR_SLOT_TIME_MISMATCH
    http_status: 422
    applies_to: "POST /flight-legs/{flight_leg_id}/attach-slot"
  - priority: 62
    category: business_constraint
    check: "slot_holding.attached_operations < slot_holding.planned_operations — a series cannot back more operations than it was granted"
    error_id: ERR_SLOT_SERIES_OVERSUBSCRIBED
    http_status: 409
    applies_to: "POST /flight-legs/{flight_leg_id}/attach-slot"
  - priority: 63
    category: business_constraint
    check: "no other SlotHolding with holding_status == HELD shares this holding's station_id, season_id, movement_type and UTC time-of-day of slot_time_utc while its days_of_week digit set intersects the requested days_of_week"
    error_id: ERR_SLOT_SERIES_CONFLICT
    http_status: 409
    applies_to: "POST /slot-holdings"
  - priority: 64
    category: business_constraint
    check: "slot_transaction.counterparty_carrier_id != slot_transaction.initiating_carrier_id"
    error_id: ERR_SELF_TRANSACTION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /slot-transactions"
  - priority: 65
    category: business_constraint
    check: "counter_slot_holding_id is present when kind == EXCHANGE, absent when kind == TRANSFER, and when present belongs to counterparty_carrier_id"
    error_id: ERR_COUNTER_SLOT_REQUIRED
    http_status: 422
    applies_to: "POST /slot-transactions"

  # ---- business_referential: traffic rights, codeshare, precedence -------
  - priority: 66
    category: business_referential
    check: "an international leg (origin country != destination country) has a matching RouteAuthority for the acting carrier on the unordered country pair"
    error_id: ERR_ROUTE_AUTHORITY_MISSING
    http_status: 422
    applies_to: "POST /flight-legs"
  - priority: 67
    category: business_referential
    check: "the matching RouteAuthority has status == ACTIVE and granted_from_utc <= leg.dep_utc <= granted_until_utc"
    error_id: ERR_ROUTE_AUTHORITY_INACTIVE
    http_status: 422
    applies_to: "POST /flight-legs"
  - priority: 68
    category: business_referential
    check: "a leg whose origin and destination countries are identical and are both different from the operating carrier's country_code is domestic carriage inside a foreign state and is prohibited unless the matching RouteAuthority has freedom_type == SEVENTH"
    error_id: ERR_CABOTAGE_PROHIBITED
    http_status: 422
    applies_to: "POST /flight-legs"
  - priority: 69
    category: business_referential
    check: "the number of non-CANCELLED legs of the acting carrier on this unordered country pair inside the leg's ISO week (Monday 00:00:00Z through the following Monday 00:00:00Z, exclusive) does not exceed route_authority.weekly_frequency_cap"
    error_id: ERR_FREQUENCY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /flight-legs"
  - priority: 70
    category: business_referential
    check: "FilingSubmission.codeshare_sync_status != PENDING_ACK — every marketing carrier listed on any leg of the version has appeared in codeshare_ack_carrier_ids"
    error_id: ERR_CODESHARE_NOT_SYNCHRONIZED
    http_status: 409
    applies_to: "POST /filing-submissions/{filing_submission_id}/transmit"
  - priority: 71
    category: business_referential
    check: "a SlotHolding with historic_precedence == true is never disposed of by an outright TRANSFER; it may only be EXCHANGEd"
    error_id: ERR_HISTORIC_PRECEDENCE_PROTECTED
    http_status: 409
    applies_to: "POST /slot-transactions, POST /slot-transactions/{slot_transaction_id}/approve"

  # ---- business_temporal: windows and deadlines --------------------------
  - priority: 72
    category: business_temporal
    check: "season.start_date <= leg.dep_utc and leg.arr_utc <= season.end_date, and dep_utc < arr_utc"
    error_id: ERR_LEG_OUTSIDE_SEASON_WINDOW
    http_status: 422
    applies_to: "POST /flight-legs, PATCH /flight-legs/{flight_leg_id}"
  - priority: 73
    category: business_temporal
    check: "current_utc <= season.slot_return_deadline_utc"
    error_id: ERR_SLOT_RETURN_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /slot-holdings/{slot_holding_id}/return"
    priority_conflict_note: "Ranked at 73, below ERR_SEASON_NOT_OPEN at 26 — see that rule's note for the pair."
  - priority: 74
    category: business_temporal
    check: "current_utc <= slot_transaction.response_deadline_utc"
    error_id: ERR_SLOT_TRANSACTION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /slot-transactions/{slot_transaction_id}/respond, POST /slot-transactions/{slot_transaction_id}/approve"
  - priority: 75
    category: business_temporal
    check: "when change_window == STANDARD, current_utc <= season.filing_change_window_close_utc. EXPEDITED and EMERGENCY submissions are exempt from the close, which is exactly what the surcharge pays for"
    error_id: ERR_CHANGE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /filing-submissions/{filing_submission_id}/transmit"
  - priority: 76
    category: business_temporal
    check: "when current_utc > obligation.notify_deadline_utc the dispatch request carries a non-blank regulator_reference"
    error_id: ERR_LATE_NOTIFICATION_UNREFERENCED
    http_status: 422
    applies_to: "POST /notification-obligations/{notification_obligation_id}/dispatch"

  # ---- business_fiscal: budget last -------------------------------------
  - priority: 80
    category: business_fiscal
    check: "schedule_version.filing_charge_accrued_cents + filing_submission.total_charge_cents <= schedule_version.filing_charge_budget_cents"
    error_id: ERR_FILING_CHARGE_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /filing-submissions/{filing_submission_id}/transmit"
    priority_conflict_note: "Ranked last at 80, below ERR_SCHEDULE_BLOCKED at 34 — see that rule's note for the pair."

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table  (api_prefix is "" — every collection is top-level
#      and flat, so every FK is reverse-reachable through a filtered list)
# ---------------------------------------------------------------------------
endpoints:

  # ---- Carrier ------------------------------------------------------------
  - method: POST
    path: "/carriers"
    description: "Register a carrier — either the home carrier whose network is being planned or a partner carrier that can appear as a slot-transaction counterparty or a codeshare marketing carrier."
    roles: [SystemAdmin]
    code: 201
    input: ["iata_code", "icao_code", "country_code", "is_home_carrier?"]
    output: Carrier
    side_effects: ["creates the Carrier in status ACTIVE with held_series_count 0"]
  - method: GET
    path: "/carriers/{carrier_id}"
    description: "Read one carrier."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: GET
    path: "/carriers"
    description: "List carriers with optional filters and pagination."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["country_code?", "status?", "is_home_carrier?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []
  - method: POST
    path: "/carriers/{carrier_id}/suspend"
    description: "Suspend a carrier's operating licence."
    roles: [SystemAdmin]
    code: 200
    input: ["reason"]
    output: Carrier
    side_effects: ["status ACTIVE -> SUSPENDED", "every ScheduleVersion of the carrier in DRAFT or VALIDATED moves to WITHDRAWN with its legs cancelled and its slots detached"]

  # ---- Station ------------------------------------------------------------
  - method: POST
    path: "/stations"
    description: "Register an airport with its IATA slot coordination level, gate capacity, curfew window in local minutes-from-midnight, minimum connect times and turn override."
    roles: [SystemAdmin]
    code: 201
    input: ["iata_code", "country_code", "coordination_level", "utc_offset_minutes", "gate_count", "curfew_start_local_minutes?", "curfew_end_local_minutes?", "min_connect_domestic_minutes?", "min_connect_international_minutes?", "min_turn_override_minutes?", "maintenance_capable?"]
    output: Station
    side_effects: []
  - method: GET
    path: "/stations/{station_id}"
    description: "Read one station."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: Station
    side_effects: []
  - method: GET
    path: "/stations"
    description: "List stations with optional filters and pagination."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["country_code?", "coordination_level?", "maintenance_capable?", "limit?", "offset?"]
    output: Station[]
    side_effects: []

  # ---- Season -------------------------------------------------------------
  - method: POST
    path: "/seasons"
    description: "Open a scheduling season with its slot return deadline and filing change-window close."
    roles: [SystemAdmin]
    code: 201
    input: ["season_code", "start_date", "end_date", "slot_return_deadline_utc", "filing_change_window_close_utc"]
    output: Season
    side_effects: ["creates the Season in status DRAFT with held_series_count 0"]
  - method: GET
    path: "/seasons/{season_id}"
    description: "Read one season."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: GET
    path: "/seasons"
    description: "List seasons with optional filters and pagination."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["status?", "season_code?", "limit?", "offset?"]
    output: Season[]
    side_effects: []
  - method: POST
    path: "/seasons/{season_id}/transition"
    description: "Advance a season one step along DRAFT -> OPEN -> CLOSED -> ARCHIVED."
    roles: [SystemAdmin]
    code: 200
    input: ["to_status"]
    output: Season
    side_effects: ["OPEN unlocks slot-holding creation, schedule-version creation, leg creation and slot transactions", "CLOSED is the only state the slot audit may run in", "ARCHIVED requires a completed audit and expires every HELD holding that does not retain historic precedence"]
  - method: POST
    path: "/seasons/{season_id}/slot-audit"
    description: "Run the season's use-it-or-lose-it audit. Every HELD SlotHolding of the season is scored on its as_operated utilization_pct; anything strictly below 80.00 percent is taken away."
    roles: [SlotCoordinator]
    code: 200
    input: ["audit_reference"]
    output: "{ audited_count: integer, retained_count: integer, lost_count: integer, audit_reference: string, audited_slot_holding_ids: string[] }"
    side_effects: ["stamps Season.slot_audit_completed_at_utc and audit_reference", "each failing holding moves HELD -> LOST, detaches its legs to REFILE_REQUIRED, and raises a SLOT_LOSS PassengerNotificationObligation for every detached leg with bookings", "recomputes every affected ScheduleVersion's counters, schedule_compliance_score and compliance_state", "recomputes Carrier.held_series_count and Season.held_series_count"]

  # ---- Aircraft -----------------------------------------------------------
  - method: POST
    path: "/aircraft"
    description: "Register a tail with its turn time, daily block cap and required maintenance check length."
    roles: [NetworkPlanner]
    code: 201
    input: ["carrier_id", "base_station_id", "registration", "fleet_type_code", "seats", "min_turn_minutes", "max_daily_block_minutes", "required_check_minutes", "maintenance_check_required?", "status?"]
    output: Aircraft
    side_effects: ["creates the Aircraft with assigned_leg_count 0 and rotation_feasibility_status UNCHECKED"]
  - method: GET
    path: "/aircraft/{aircraft_id}"
    description: "Read one tail."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: Aircraft
    side_effects: []
  - method: GET
    path: "/aircraft"
    description: "List tails filtered by operating carrier, maintenance base or status. Reverse-reachability channel for Aircraft.carrier_id and Aircraft.base_station_id."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["carrier_id?", "base_station_id?", "status?", "fleet_type_code?", "rotation_feasibility_status?", "limit?", "offset?"]
    output: Aircraft[]
    side_effects: []
  - method: GET
    path: "/aircraft/{aircraft_id}/rotation-feasibility"
    description: "Computed read: the tail's rotation walk. Returns the pinned leg order, the feasibility verdict, the offending leg when infeasible, the required turn at the first pair, and both maintenance-opportunity variants."
    roles: [NetworkPlanner, ComplianceOfficer, SlotCoordinator, PartnerCarrier, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: "{ rotation_feasibility_status: string, maintenance_opportunity_minutes: integer, cumulative_ground_minutes: integer, ordered_leg_ids: string[], first_violation_leg_id: string, required_turn_minutes: integer, total_block_minutes: integer }"
    side_effects: []

  # ---- ScheduleVersion ----------------------------------------------------
  - method: POST
    path: "/schedule-versions"
    description: "Start a schedule version for a carrier and season."
    roles: [NetworkPlanner]
    code: 201
    input: ["carrier_id", "season_id", "version_label", "filing_charge_budget_cents?"]
    output: ScheduleVersion
    side_effects: ["creates the version in filing_status DRAFT, compliance_state CLEAN, schedule_compliance_score 100.00, filing_charge_accrued_cents 0 and every counter 0"]
  - method: GET
    path: "/schedule-versions/{schedule_version_id}"
    description: "Read one schedule version with its live counters, compliance score and charge ledger."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: ScheduleVersion
    side_effects: []
  - method: GET
    path: "/schedule-versions"
    description: "List schedule versions. Reverse-reachability channel for ScheduleVersion.carrier_id, ScheduleVersion.season_id and ScheduleVersion.supersedes_version_id (the successor minted by supersede appears in no creation response)."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["carrier_id?", "season_id?", "supersedes_version_id?", "filing_status?", "compliance_state?", "limit?", "offset?"]
    output: ScheduleVersion[]
    side_effects: []
  - method: POST
    path: "/schedule-versions/{schedule_version_id}/supersede"
    description: "Fork a new DRAFT version from this one. Requires expected_schedule_version_version — the only OCC-guarded schedule write."
    roles: [NetworkPlanner]
    code: 201
    input: ["version_label", "expected_schedule_version_version", "filing_charge_budget_cents?"]
    output: ScheduleVersion
    side_effects: ["this version moves to SUPERSEDED", "a successor ScheduleVersion is created in DRAFT with supersedes_version_id pointing back here", "stale expected_schedule_version_version returns ERR_STALE_SCHEDULE_VERSION (412) and mutates nothing"]
  - method: POST
    path: "/schedule-versions/{schedule_version_id}/validate"
    description: "Run the full compliance gate over the version: leg readiness, slot coverage at coordinated stations, rotation feasibility, maintenance opportunity and the compliance score."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ScheduleVersion
    side_effects: ["filing_status DRAFT -> VALIDATED", "stamps validated_by_user_id with the acting X-User-ID, which is what the transmit segregation-of-duties check later compares against", "recomputes every counter, schedule_compliance_score and compliance_state"]
  - method: POST
    path: "/schedule-versions/{schedule_version_id}/withdraw"
    description: "Abandon a version that has not been filed."
    roles: [NetworkPlanner]
    code: 200
    input: ["reason"]
    output: ScheduleVersion
    side_effects: ["filing_status -> WITHDRAWN", "every non-CANCELLED leg moves to CANCELLED with cancellation_reason SCHEDULE_WITHDRAWN and detaches its slots", "each detached SlotHolding recomputes attached_operations, utilization_pct_as_filed and at_risk_of_loss"]

  # ---- FlightLeg ----------------------------------------------------------
  - method: POST
    path: "/flight-legs"
    description: "Add a leg to a DRAFT schedule version. Hard-checks curfew, traffic rights, cabotage, frequency cap, connection station, minimum connect time and gate capacity at creation time."
    roles: [NetworkPlanner]
    code: 201
    input: ["schedule_version_id", "flight_number", "origin_station_id", "dest_station_id", "dep_utc", "arr_utc", "fleet_type_code", "connects_from_leg_id?", "marketing_carrier_ids?", "curfew_waiver_reference?"]
    output: FlightLeg
    side_effects: ["creates the leg in status DRAFT", "computes block_minutes, is_international, connect_minutes and mct_shortfall_minutes", "increments ScheduleVersion.leg_count and re-derives schedule_compliance_score and compliance_state", "a supplied curfew_waiver_reference increments ScheduleVersion.curfew_violation_count instead of rejecting"]
  - method: GET
    path: "/flight-legs/{flight_leg_id}"
    description: "Read one leg."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: FlightLeg
    side_effects: []
  - method: GET
    path: "/flight-legs"
    description: "List legs. Reverse-reachability channel for FlightLeg.schedule_version_id, origin_station_id, dest_station_id, assigned_aircraft_id, departure_slot_holding_id, arrival_slot_holding_id and connects_from_leg_id."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["schedule_version_id?", "origin_station_id?", "dest_station_id?", "assigned_aircraft_id?", "departure_slot_holding_id?", "arrival_slot_holding_id?", "connects_from_leg_id?", "status?", "flight_number?", "limit?", "offset?"]
    output: FlightLeg[]
    side_effects: []
  - method: PATCH
    path: "/flight-legs/{flight_leg_id}"
    description: "Retime or relabel a leg. Unlike creation this is permissive: a gate overflow or an MCT shortfall is COUNTED on the version instead of rejected, because a planner must be able to move a leg into a congested bank and then see the compliance penalty."
    roles: [NetworkPlanner]
    code: 200
    input: ["dep_utc?", "arr_utc?", "flight_number?", "curfew_waiver_reference?"]
    output: FlightLeg
    side_effects: ["a dep_utc/arr_utc change detaches BOTH slot holdings and moves the leg FILED -> REFILE_REQUIRED or SLOT_BACKED -> ASSIGNED", "each detached holding recomputes attached_operations, utilization_pct_as_filed and at_risk_of_loss, which can flip the version to BLOCKED and reject its TRANSMITTED/ACKNOWLEDGED filing submissions with the charge reversed", "a retime of at least 30 minutes on a leg with bookings raises a RETIME PassengerNotificationObligation and increments FlightLeg.open_obligation_count", "recomputes the assigned tail's rotation_feasibility_status, maintenance_opportunity_minutes and cumulative_ground_minutes"]
  - method: POST
    path: "/flight-legs/{flight_leg_id}/assign-aircraft"
    description: "Assign a tail to a leg and re-walk the whole rotation for that tail."
    roles: [NetworkPlanner]
    code: 200
    input: ["aircraft_id"]
    output: FlightLeg
    side_effects: ["status DRAFT -> ASSIGNED, or straight to SLOT_BACKED when the leg needs no slot or is already fully slotted", "recomputes Aircraft.assigned_leg_count, rotation_feasibility_status, maintenance_opportunity_minutes and cumulative_ground_minutes", "rejects with ERR_ROTATION_CONTINUITY_BROKEN, ERR_TURN_TIME_VIOLATION or ERR_DAILY_BLOCK_CAP_EXCEEDED when the walk fails"]
  - method: POST
    path: "/flight-legs/{flight_leg_id}/attach-slot"
    description: "Back one movement of a leg with a held slot series."
    roles: [NetworkPlanner]
    code: 200
    input: ["slot_holding_id", "movement_type"]
    output: FlightLeg
    side_effects: ["sets departure_slot_holding_id or arrival_slot_holding_id", "moves the leg to SLOT_BACKED once every required movement is slotted", "recomputes SlotHolding.attached_operations, utilization_pct_as_filed and at_risk_of_loss", "recomputes ScheduleVersion.unslotted_leg_count, at_risk_slot_count, schedule_compliance_score and compliance_state"]
  - method: POST
    path: "/flight-legs/{flight_leg_id}/cancel"
    description: "Cancel a leg."
    roles: [NetworkPlanner]
    code: 200
    input: ["reason"]
    output: FlightLeg
    side_effects: ["status -> CANCELLED with cancellation_reason set", "detaches both slot holdings, which returns each holding's attached_operations to its pre-attach value with no drift", "recomputes the assigned tail's rotation walk and maintenance opportunity", "a leg with bookings raises a CANCELLATION PassengerNotificationObligation at change_magnitude_minutes 240"]
  - method: POST
    path: "/flight-legs/{flight_leg_id}/booking-snapshot"
    description: "Record the current booked load per cabin on a leg. This is the passenger-impact input the notification obligation copies at creation."
    roles: [NetworkPlanner, ComplianceOfficer]
    code: 200
    input: ["booked_first", "booked_business", "booked_economy"]
    output: FlightLeg
    side_effects: ["overwrites booked_first, booked_business and booked_economy"]

  # ---- SlotHolding --------------------------------------------------------
  - method: POST
    path: "/slot-holdings"
    description: "Record a slot series held at a LEVEL_3_COORDINATED airport, as a movement type, a UTC slot time, a day-of-week mask and a number of series weeks."
    roles: [SlotCoordinator]
    code: 201
    input: ["station_id", "season_id", "carrier_id", "movement_type", "slot_time_utc", "days_of_week", "series_weeks", "historic_precedence?", "historic_predecessor_holding_id?"]
    output: SlotHolding
    side_effects: ["creates the holding in HELD with planned_operations = series_weeks * len(days_of_week), attached_operations 0, credited_operations 0, utilization_pct 0.00, utilization_pct_as_filed 0.00 and at_risk_of_loss false", "recomputes Carrier.held_series_count and Season.held_series_count"]
  - method: GET
    path: "/slot-holdings/{slot_holding_id}"
    description: "Read one slot series with both utilization variants and its at-risk flag."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: SlotHolding
    side_effects: []
  - method: GET
    path: "/slot-holdings"
    description: "List slot series. Reverse-reachability channel for SlotHolding.station_id, season_id, carrier_id, historic_predecessor_holding_id and pending_transaction_id — and the ONLY way to discover the successor holding minted by a TRANSFER execution."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["station_id?", "season_id?", "carrier_id?", "historic_predecessor_holding_id?", "pending_transaction_id?", "holding_status?", "movement_type?", "at_risk_of_loss?", "limit?", "offset?"]
    output: SlotHolding[]
    side_effects: []
  - method: POST
    path: "/slot-holdings/{slot_holding_id}/return"
    description: "Hand a series back to the coordinator. Returning before the season's slot_return_deadline_utc is the only exit from HELD that preserves the grandfather claim."
    roles: [NetworkPlanner]
    code: 200
    input: ["reason"]
    output: SlotHolding
    side_effects: ["holding_status HELD -> RETURNED with returned_before_deadline true and retains_historic_precedence true", "every attached leg in SLOT_BACKED or FILED moves to REFILE_REQUIRED with the slot id nulled", "recomputes each affected ScheduleVersion's unslotted_leg_count, schedule_compliance_score and compliance_state", "recomputes Carrier.held_series_count and Season.held_series_count"]

  # ---- SlotUtilizationRecord ---------------------------------------------
  - method: POST
    path: "/slot-utilization-records"
    description: "Log what actually happened on one dated operation of a slot series. Immutable — the entity has no version field and no update endpoint. Records may be posted out of chronological order."
    roles: [NetworkPlanner, SlotCoordinator]
    code: 201
    input: ["slot_holding_id", "operation_date", "outcome"]
    output: SlotUtilizationRecord
    side_effects: ["sets credited = (outcome IN {OPERATED, CANCELLED_ATC, RETURNED_IN_TIME})", "stamps recorded_by_user_id with the acting X-User-ID", "recomputes SlotHolding.credited_operations and utilization_pct (the as_operated variant only — utilization_pct_as_filed is untouched)"]
  - method: GET
    path: "/slot-utilization-records/{slot_utilization_record_id}"
    description: "Read one utilization record."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: SlotUtilizationRecord
    side_effects: []
  - method: GET
    path: "/slot-utilization-records"
    description: "List utilization records. Reverse-reachability channel for SlotUtilizationRecord.slot_holding_id."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["slot_holding_id?", "outcome?", "credited?", "limit?", "offset?"]
    output: SlotUtilizationRecord[]
    side_effects: []

  # ---- SlotTransaction ----------------------------------------------------
  - method: POST
    path: "/slot-transactions"
    description: "Propose an exchange or an outright transfer of a held series to another carrier. Requires expected_slot_holding_version on the offered holding — the second OCC-guarded write."
    roles: [NetworkPlanner]
    code: 201
    input: ["kind", "counterparty_carrier_id", "offered_slot_holding_id", "response_deadline_utc", "expected_slot_holding_version", "counter_slot_holding_id?"]
    output: SlotTransaction
    side_effects: ["creates the transaction in PROPOSED with initiating_carrier_id copied from the offered holding and proposed_by_user_id stamped from the acting X-User-ID", "encumbers every involved holding by setting pending_transaction_id, which blocks attach, return and any competing proposal", "stale expected_slot_holding_version returns ERR_STALE_SLOT_HOLDING (412) and encumbers nothing"]
  - method: GET
    path: "/slot-transactions/{slot_transaction_id}"
    description: "Read one slot transaction."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: SlotTransaction
    side_effects: []
  - method: GET
    path: "/slot-transactions"
    description: "List slot transactions. Reverse-reachability channel for initiating_carrier_id, counterparty_carrier_id, offered_slot_holding_id, counter_slot_holding_id and successor_slot_holding_id."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["initiating_carrier_id?", "counterparty_carrier_id?", "offered_slot_holding_id?", "counter_slot_holding_id?", "successor_slot_holding_id?", "kind?", "status?", "limit?", "offset?"]
    output: SlotTransaction[]
    side_effects: []
  - method: POST
    path: "/slot-transactions/{slot_transaction_id}/respond"
    description: "First gate: the counterparty carrier accepts or rejects the proposal before its response deadline."
    roles: [PartnerCarrier]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: SlotTransaction
    side_effects: ["ACCEPT moves PROPOSED -> COUNTERPARTY_ACCEPTED and stamps responded_by_user_id", "REJECT moves PROPOSED -> COUNTERPARTY_REJECTED and releases every encumbrance"]
  - method: POST
    path: "/slot-transactions/{slot_transaction_id}/approve"
    description: "Second gate: the slot coordinator approves or denies. Approval is what actually moves the slots, and the acting user may not be the proposer."
    roles: [SlotCoordinator]
    code: 200
    input: ["decision", "denial_reason?"]
    output: SlotTransaction
    side_effects: ["APPROVE moves COUNTERPARTY_ACCEPTED -> EXECUTED and stamps approved_by_user_id and executed_at_utc", "on kind TRANSFER the offered holding moves HELD -> TRANSFERRED_OUT and a successor HELD holding is minted for the counterparty with historic_predecessor_holding_id set", "on kind EXCHANGE the offered and counter holdings swap carrier_id and both stay HELD", "in both kinds every attached leg moves to REFILE_REQUIRED, the owning versions' unslotted_leg_count rises and any ACKNOWLEDGED filing submission gets resync_required true", "DENY moves to COORDINATOR_DENIED and releases every encumbrance without moving any slot"]
  - method: POST
    path: "/slot-transactions/{slot_transaction_id}/withdraw"
    description: "The initiating carrier pulls its own proposal back."
    roles: [NetworkPlanner]
    code: 200
    input: ["reason"]
    output: SlotTransaction
    side_effects: ["status -> WITHDRAWN", "releases pending_transaction_id on every involved holding"]

  # ---- FilingSubmission ---------------------------------------------------
  - method: POST
    path: "/filing-submissions"
    description: "Queue a schedule filing to a distribution system. The changed-leg count and the whole charge breakdown are computed and FROZEN here, so later leg churn never retroactively reprices an existing submission."
    roles: [FilingAgent]
    code: 201
    input: ["schedule_version_id", "distribution_system", "change_window"]
    output: FilingSubmission
    side_effects: ["creates the submission in QUEUED with submitted_by_user_id stamped", "freezes changed_leg_count and computes base_charge_subtotal_cents, expedite_rate_pct, expedite_fee_cents and total_charge_cents", "sets codeshare_sync_status to PENDING_ACK when any non-CANCELLED leg of the version carries a non-empty marketing_carrier_ids, otherwise NOT_REQUIRED"]
  - method: GET
    path: "/filing-submissions/{filing_submission_id}"
    description: "Read one filing submission with its frozen charge breakdown."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: FilingSubmission
    side_effects: []
  - method: GET
    path: "/filing-submissions"
    description: "List filing submissions. Reverse-reachability channel for FilingSubmission.schedule_version_id."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["schedule_version_id?", "distribution_system?", "change_window?", "status?", "resync_required?", "limit?", "offset?"]
    output: FilingSubmission[]
    side_effects: []
  - method: POST
    path: "/filing-submissions/{filing_submission_id}/codeshare-ack"
    description: "Record one marketing carrier's acknowledgement of the schedule change. Once every marketing carrier on the version has acked, codeshare_sync_status flips PENDING_ACK -> SYNCHRONIZED and the filing may transmit."
    roles: [FilingAgent, PartnerCarrier]
    code: 200
    input: ["marketing_carrier_id"]
    output: FilingSubmission
    side_effects: ["appends to codeshare_ack_carrier_ids", "recomputes codeshare_sync_status against the distinct marketing_carrier_ids of the version's non-CANCELLED legs"]
  - method: POST
    path: "/filing-submissions/{filing_submission_id}/transmit"
    description: "Send the filing to the distribution system. The gate stack here is the domain's densest: compliance block, budget, codeshare sync, segregation of duties and the change window."
    roles: [FilingAgent]
    code: 200
    input: []
    output: FilingSubmission
    side_effects: ["status QUEUED -> TRANSMITTED with transmitted_by_user_id and transmitted_at_utc stamped", "ScheduleVersion.filing_charge_accrued_cents += total_charge_cents", "ScheduleVersion.filing_status VALIDATED -> FILED and every SLOT_BACKED leg -> FILED"]
  - method: POST
    path: "/filing-submissions/{filing_submission_id}/acknowledge"
    description: "Record the distribution system's answer."
    roles: [FilingAgent]
    code: 200
    input: ["outcome", "rejection_reason?"]
    output: FilingSubmission
    side_effects: ["ACCEPT moves TRANSMITTED -> ACKNOWLEDGED, stamps acknowledged_at_utc, clears resync_required and leaves the ledger alone", "REJECT moves TRANSMITTED -> REJECTED, subtracts total_charge_cents back off ScheduleVersion.filing_charge_accrued_cents, returns the version FILED -> VALIDATED and moves every FILED leg back to SLOT_BACKED while skipping legs already in REFILE_REQUIRED"]

  # ---- RouteAuthority ----------------------------------------------------
  - method: POST
    path: "/route-authorities"
    description: "Grant a carrier a traffic right on a country pair, with a freedom type, a weekly frequency cap and a validity window."
    roles: [SystemAdmin]
    code: 201
    input: ["carrier_id", "origin_country_code", "dest_country_code", "freedom_type", "weekly_frequency_cap", "granted_from_utc", "granted_until_utc"]
    output: RouteAuthority
    side_effects: ["creates the authority in status ACTIVE"]
  - method: GET
    path: "/route-authorities/{route_authority_id}"
    description: "Read one traffic right."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: RouteAuthority
    side_effects: []
  - method: GET
    path: "/route-authorities"
    description: "List traffic rights. Reverse-reachability channel for RouteAuthority.carrier_id."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["carrier_id?", "origin_country_code?", "dest_country_code?", "freedom_type?", "status?", "limit?", "offset?"]
    output: RouteAuthority[]
    side_effects: []
  - method: POST
    path: "/route-authorities/{route_authority_id}/suspend"
    description: "Suspend a traffic right. Existing legs are untouched; every subsequent leg on that country pair is refused."
    roles: [SystemAdmin]
    code: 200
    input: ["reason"]
    output: RouteAuthority
    side_effects: ["status ACTIVE -> SUSPENDED with suspension_reason set"]

  # ---- PassengerNotificationObligation -----------------------------------
  - method: POST
    path: "/notification-obligations"
    description: "Raise a passenger notification obligation against a leg by hand. The system raises these automatically on retime, cancellation and slot loss; this endpoint lets a compliance officer log one for a change that arrived from outside the system, and is the direct way to exercise every tier of the compensation ladder."
    roles: [ComplianceOfficer]
    code: 201
    input: ["flight_leg_id", "trigger_kind", "change_magnitude_minutes"]
    output: PassengerNotificationObligation
    side_effects: ["snapshots booked_first, booked_business and booked_economy off the leg and never re-reads them", "derives booked_total, obligation_tier, compensation_cents and notify_deadline_utc = current_utc + 72 hours", "increments FlightLeg.open_obligation_count", "rejects with ERR_INVALID_REQUEST when booked_total is 0 or change_magnitude_minutes is below 30, because no obligation exists to log"]
  - method: GET
    path: "/notification-obligations/{notification_obligation_id}"
    description: "Read one notification obligation with its tier and compensation."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: []
    output: PassengerNotificationObligation
    side_effects: []
  - method: GET
    path: "/notification-obligations"
    description: "List notification obligations. Reverse-reachability channel for PassengerNotificationObligation.flight_leg_id, and the only discovery path for the obligations the system creates as cascade side effects."
    roles: [NetworkPlanner, PartnerCarrier, SlotCoordinator, ComplianceOfficer, FilingAgent, SystemAdmin]
    code: 200
    input: ["flight_leg_id?", "trigger_kind?", "obligation_tier?", "status?", "late_dispatch?", "limit?", "offset?"]
    output: PassengerNotificationObligation[]
    side_effects: []
  - method: POST
    path: "/notification-obligations/{notification_obligation_id}/dispatch"
    description: "Send the notice. A dispatch after notify_deadline_utc is allowed only with a regulator_reference, and a MANDATORY_REACCOMMODATION notice may not go by SMS."
    roles: [ComplianceOfficer]
    code: 200
    input: ["channel", "regulator_reference?"]
    output: PassengerNotificationObligation
    side_effects: ["status PENDING -> DISPATCHED with dispatched_channel set", "sets late_dispatch = (current_utc > notify_deadline_utc)", "decrements FlightLeg.open_obligation_count"]

  # ---- test-driving surface ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time; that default sits at or before every fixture date, so every deadline, expiry and window rule in this scaffold is deterministic and run-time independent."
    roles: [SystemAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["every subsequent read of current_utc returns this instant", "re-derives RouteAuthority.status ACTIVE -> EXPIRED for any authority whose granted_until_utc is now in the past"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — every id is triggerable by at least one §1.5 call
# ---------------------------------------------------------------------------
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header absent or blank on any endpoint"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting X-User-Role is not in the target endpoint's roles list — e.g. a FilingAgent calling POST /schedule-versions/{id}/validate"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "an entity_backed role acts on a resource owned by a different Carrier — e.g. the partner carrier calling POST /slot-holdings/{id}/return on the home carrier's series, or a NetworkPlanner calling respond on a transaction it proposed"
  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is not a declared member, a timestamp is not ISO-8601 Z, a count is negative, days_of_week is empty or contains a digit outside 1-7, limit is outside 1..100, offset is negative, or POST /notification-obligations is called for a leg with no bookings or a change_magnitude_minutes below 30"
  # existence
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "a carrier_id in the path or body matches no Carrier"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "a station id in the path or body matches no Station"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "a season_id in the path or body matches no Season"
  - id: ERR_AIRCRAFT_NOT_FOUND
    http: 404
    condition: "an aircraft_id in the path or body matches no Aircraft"
  - id: ERR_SCHEDULE_VERSION_NOT_FOUND
    http: 404
    condition: "a schedule_version_id in the path or body matches no ScheduleVersion"
  - id: ERR_FLIGHT_LEG_NOT_FOUND
    http: 404
    condition: "a flight_leg_id in the path or body (including connects_from_leg_id) matches no FlightLeg"
  - id: ERR_SLOT_HOLDING_NOT_FOUND
    http: 404
    condition: "a slot holding id in the path or body (including counter_slot_holding_id) matches no SlotHolding"
  - id: ERR_SLOT_UTILIZATION_RECORD_NOT_FOUND
    http: 404
    condition: "the slot_utilization_record_id in the path matches no SlotUtilizationRecord"
  - id: ERR_SLOT_TRANSACTION_NOT_FOUND
    http: 404
    condition: "the slot_transaction_id in the path matches no SlotTransaction"
  - id: ERR_FILING_SUBMISSION_NOT_FOUND
    http: 404
    condition: "the filing_submission_id in the path matches no FilingSubmission"
  - id: ERR_ROUTE_AUTHORITY_NOT_FOUND
    http: 404
    condition: "the route_authority_id in the path matches no RouteAuthority"
  - id: ERR_NOTIFICATION_OBLIGATION_NOT_FOUND
    http: 404
    condition: "the notification_obligation_id in the path matches no PassengerNotificationObligation"
  # optimistic concurrency
  - id: ERR_STALE_SCHEDULE_VERSION
    http: 412
    condition: "expected_schedule_version_version on POST /schedule-versions/{id}/supersede does not equal the current ScheduleVersion.version; nothing is mutated and no successor version is created"
  - id: ERR_STALE_SLOT_HOLDING
    http: 412
    condition: "expected_slot_holding_version on POST /slot-transactions does not equal the offered SlotHolding.version; no transaction row is created and no holding is encumbered"
  # season / carrier lifecycle
  - id: ERR_SEASON_NOT_OPEN
    http: 409
    condition: "the governing Season.status is not OPEN on a schedule-version create, leg create, slot-holding create, slot return, transaction proposal or transaction approval. Outranks every deadline check."
  - id: ERR_SEASON_STATE_INVALID
    http: 409
    condition: "a season transition skips a step (e.g. DRAFT straight to CLOSED), targets its own current status, or the slot audit is run while the season is not CLOSED"
  - id: ERR_SLOT_AUDIT_ALREADY_RUN
    http: 409
    condition: "POST /seasons/{id}/slot-audit when slot_audit_completed_at_utc is already stamped — the use-it-or-lose-it sweep is not idempotent and refuses a second run"
  - id: ERR_SEASON_AUDIT_PENDING
    http: 409
    condition: "a CLOSED -> ARCHIVED transition while slot_audit_completed_at_utc is still null"
  - id: ERR_CARRIER_SUSPENDED
    http: 409
    condition: "the owning Carrier.status is SUSPENDED on a schedule-version, aircraft, slot-holding or slot-transaction create"
  # target-resource state
  - id: ERR_SCHEDULE_VERSION_STATE_INVALID
    http: 409
    condition: "the version's filing_status forbids the action — validating a version that is not DRAFT, withdrawing a FILED version, superseding a SUPERSEDED or WITHDRAWN version, adding a leg to a version that is not DRAFT, or queueing a submission against a version that is not VALIDATED"
  - id: ERR_SCHEDULE_VERSION_NOT_READY
    http: 409
    condition: "validate on a version with leg_count 0, or with a non-CANCELLED leg that still has assigned_aircraft_id null"
  - id: ERR_SCHEDULE_BLOCKED
    http: 409
    condition: "validate, submission create or transmit while ScheduleVersion.compliance_state is BLOCKED. Outranks the filing charge budget check."
  - id: ERR_FLIGHT_LEG_STATE_INVALID
    http: 409
    condition: "the leg's status forbids the action — assigning an aircraft to a leg that is not DRAFT, attaching a slot to a FILED leg, or any action on a CANCELLED leg including a second cancel"
  - id: ERR_SLOT_HOLDING_STATE_INVALID
    http: 409
    condition: "the target SlotHolding.holding_status is not HELD — attaching, returning, logging a utilization record against, or re-offering a RETURNED, TRANSFERRED_OUT, LOST or EXPIRED series"
  - id: ERR_SLOT_ENCUMBERED
    http: 409
    condition: "the SlotHolding has a non-null pending_transaction_id — an open exchange or transfer has the series locked, so it cannot be attached, returned or offered again"
  - id: ERR_SLOT_TRANSACTION_STATE_INVALID
    http: 409
    condition: "respond on a transaction that is not PROPOSED, approve on one that is not COUNTERPARTY_ACCEPTED (including approving straight out of PROPOSED, which skips the counterparty gate), or withdraw on a terminal transaction"
  - id: ERR_FILING_SUBMISSION_STATE_INVALID
    http: 409
    condition: "transmit on a submission that is not QUEUED (including a second transmit), acknowledge on one that is not TRANSMITTED, or codeshare-ack after the submission has left QUEUED"
  - id: ERR_NOTIFICATION_STATE_INVALID
    http: 409
    condition: "dispatch on an obligation that is already DISPATCHED or WAIVED"
  - id: ERR_FILING_IN_FLIGHT
    http: 409
    condition: "withdraw on a schedule version that still has a FilingSubmission in QUEUED or TRANSMITTED"
  # business_safety
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals ScheduleVersion.validated_by_user_id on transmit, or equals SlotTransaction.proposed_by_user_id on approve — right role, wrong person"
  - id: ERR_CURFEW_VIOLATION
    http: 422
    condition: "a leg departs or arrives inside its station's local curfew window and the request supplies no curfew_waiver_reference. Outranks the traffic-rights checks."
  - id: ERR_MAINTENANCE_OPPORTUNITY_INSUFFICIENT
    http: 422
    condition: "validate while some assigned Aircraft with maintenance_check_required true has maintenance_opportunity_minutes (the contiguous window) below required_check_minutes, even when cumulative_ground_minutes would have been enough"
  - id: ERR_NOTIFICATION_CHANNEL_INSUFFICIENT
    http: 422
    condition: "dispatching a MANDATORY_REACCOMMODATION obligation over channel SMS"
  # business_constraint
  - id: ERR_AIRCRAFT_NOT_IN_SERVICE
    http: 422
    condition: "assign-aircraft with a tail whose status is MAINTENANCE_GROUNDED or RETIRED"
  - id: ERR_FLEET_TYPE_MISMATCH
    http: 422
    condition: "assign-aircraft where aircraft.fleet_type_code differs from the leg's fleet_type_code"
  - id: ERR_AIRCRAFT_CARRIER_MISMATCH
    http: 422
    condition: "assign-aircraft with a tail belonging to a different Carrier than the leg's schedule version"
  - id: ERR_ROTATION_CONTINUITY_BROKEN
    http: 422
    condition: "within one UTC date the tail would have to teleport — leg[i].dest_station_id differs from leg[i+1].origin_station_id"
  - id: ERR_TURN_TIME_VIOLATION
    http: 422
    condition: "within one UTC date leg[i+1].dep_utc is earlier than leg[i].arr_utc plus the required turn (aircraft min_turn_minutes, raised by the arrival station's min_turn_override_minutes, plus 15 minutes when the inbound leg is international)"
  - id: ERR_DAILY_BLOCK_CAP_EXCEEDED
    http: 422
    condition: "the tail's total block_minutes inside one UTC date would exceed max_daily_block_minutes"
  - id: ERR_CONNECTION_STATION_MISMATCH
    http: 422
    condition: "connects_from_leg_id points at a leg whose dest_station_id is not this leg's origin_station_id, or at a leg in a different schedule version"
  - id: ERR_MIN_CONNECT_TIME_VIOLATION
    http: 422
    condition: "at POST /flight-legs the designated connection has connect_minutes below the connecting station's applicable minimum. A PATCH that creates the same shortfall is accepted and only counted."
  - id: ERR_GATE_CAPACITY_EXCEEDED
    http: 409
    condition: "at POST /flight-legs the new leg pushes a station's peak gate occupancy above gate_count on that UTC date, counting 45 minutes before every departure and 30 minutes after every arrival across all carriers. A PATCH that creates the same overflow is accepted and only counted."
  - id: ERR_STATION_NOT_COORDINATED
    http: 422
    condition: "POST /slot-holdings against a station whose coordination_level is LEVEL_1_NON_COORDINATED or LEVEL_2_FACILITATED"
  - id: ERR_SLOT_REQUIRED_AT_COORDINATED_STATION
    http: 422
    condition: "validate while a non-CANCELLED leg touching a LEVEL_3_COORDINATED station has no holding attached for that movement"
  - id: ERR_SLOT_STATION_MISMATCH
    http: 422
    condition: "attach-slot where the holding's station is not the leg's origin (DEPARTURE) or destination (ARRIVAL)"
  - id: ERR_SLOT_CARRIER_MISMATCH
    http: 422
    condition: "attach-slot or a utilization record where the holding belongs to a different Carrier than the acting planner's schedule version"
  - id: ERR_SLOT_TIME_MISMATCH
    http: 422
    condition: "attach-slot where the holding's UTC time-of-day differs from the leg's movement time, or the leg's ISO weekday is not in the holding's days_of_week mask"
  - id: ERR_SLOT_SERIES_OVERSUBSCRIBED
    http: 409
    condition: "attach-slot when attached_operations has already reached planned_operations"
  - id: ERR_SLOT_SERIES_CONFLICT
    http: 409
    condition: "POST /slot-holdings duplicates an existing HELD series at the same station, season, movement type and UTC time-of-day with an intersecting day-of-week mask"
  - id: ERR_SELF_TRANSACTION_NOT_ALLOWED
    http: 422
    condition: "POST /slot-transactions where counterparty_carrier_id equals the offered holding's carrier_id"
  - id: ERR_COUNTER_SLOT_REQUIRED
    http: 422
    condition: "kind EXCHANGE without counter_slot_holding_id, kind TRANSFER with one, or a counter holding that does not belong to the counterparty carrier"
  # business_referential
  - id: ERR_ROUTE_AUTHORITY_MISSING
    http: 422
    condition: "an international leg with no RouteAuthority for the acting carrier on that unordered country pair"
  - id: ERR_ROUTE_AUTHORITY_INACTIVE
    http: 422
    condition: "the matching RouteAuthority is SUSPENDED or EXPIRED, or the leg's dep_utc falls outside granted_from_utc..granted_until_utc"
  - id: ERR_CABOTAGE_PROHIBITED
    http: 422
    condition: "a leg entirely inside a foreign country whose matching RouteAuthority does not carry freedom_type SEVENTH"
  - id: ERR_FREQUENCY_CAP_EXCEEDED
    http: 409
    condition: "the carrier's non-CANCELLED legs on that country pair inside the leg's ISO week would exceed the authority's weekly_frequency_cap — each leg is individually authorised and only the weekly aggregate breaches"
  - id: ERR_CODESHARE_NOT_SYNCHRONIZED
    http: 409
    condition: "transmit while codeshare_sync_status is PENDING_ACK because at least one marketing carrier on the version's legs has not acknowledged"
  - id: ERR_HISTORIC_PRECEDENCE_PROTECTED
    http: 409
    condition: "proposing or approving a TRANSFER whose offered holding has historic_precedence true — grandfathered series may be exchanged but never handed away outright"
  # business_temporal
  - id: ERR_LEG_OUTSIDE_SEASON_WINDOW
    http: 422
    condition: "dep_utc before the season's start_date, arr_utc after its end_date, or arr_utc at or before dep_utc"
  - id: ERR_SLOT_RETURN_DEADLINE_PASSED
    http: 422
    condition: "POST /slot-holdings/{id}/return after the season's slot_return_deadline_utc, on a season that is still OPEN"
  - id: ERR_SLOT_TRANSACTION_DEADLINE_PASSED
    http: 422
    condition: "respond or approve after slot_transaction.response_deadline_utc"
  - id: ERR_CHANGE_WINDOW_CLOSED
    http: 409
    condition: "transmit a STANDARD change_window submission after the season's filing_change_window_close_utc; EXPEDITED and EMERGENCY are exempt"
  - id: ERR_LATE_NOTIFICATION_UNREFERENCED
    http: 422
    condition: "dispatch after notify_deadline_utc without a regulator_reference"
  # business_fiscal
  - id: ERR_FILING_CHARGE_BUDGET_EXCEEDED
    http: 402
    condition: "transmit would push ScheduleVersion.filing_charge_accrued_cents plus this submission's total_charge_cents past filing_charge_budget_cents. Ranked last, so a blocked schedule reports ERR_SCHEDULE_BLOCKED instead."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# ---------------------------------------------------------------------------
roles:
  - name: NetworkPlanner
    description: "Schedule planner at the home carrier. Builds versions, legs and rotations, attaches and returns slots, proposes and withdraws slot transactions. Cannot validate its own schedule, cannot approve its own slot transaction and cannot transmit a filing."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /aircraft"
      - "POST /schedule-versions"
      - "POST /schedule-versions/{schedule_version_id}/supersede"
      - "POST /schedule-versions/{schedule_version_id}/withdraw"
      - "POST /flight-legs"
      - "PATCH /flight-legs/{flight_leg_id}"
      - "POST /flight-legs/{flight_leg_id}/assign-aircraft"
      - "POST /flight-legs/{flight_leg_id}/attach-slot"
      - "POST /flight-legs/{flight_leg_id}/cancel"
      - "POST /slot-holdings/{slot_holding_id}/return"
      - "POST /slot-transactions"
      - "POST /slot-transactions/{slot_transaction_id}/withdraw"
    shared_operations:
      - "POST /flight-legs/{flight_leg_id}/booking-snapshot (with ComplianceOfficer)"
      - "POST /slot-utilization-records (with SlotCoordinator)"
      - "every GET endpoint"
    identity_note: "X-User-ID is the id of the Carrier this planner works for. Ownership checks compare it to schedule_version.carrier_id, slot_holding.carrier_id and slot_transaction.initiating_carrier_id."
  - name: PartnerCarrier
    description: "A counterparty airline. Answers slot exchange and transfer proposals aimed at it and acknowledges codeshare schedule changes. Has no power over the home carrier's schedule."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /slot-transactions/{slot_transaction_id}/respond"
    shared_operations:
      - "POST /filing-submissions/{filing_submission_id}/codeshare-ack (with FilingAgent)"
      - "every GET endpoint"
    identity_note: "X-User-ID is the id of the counterparty Carrier. respond compares it to slot_transaction.counterparty_carrier_id, so the initiator cannot answer on the counterparty's behalf even by sending the PartnerCarrier role."
  - name: SlotCoordinator
    description: "The independent airport slot coordinator. Allocates series, approves or denies exchanges and transfers, and runs the season use-it-or-lose-it audit. Never touches a schedule version."
    identity: opaque
    exclusive_operations:
      - "POST /slot-holdings"
      - "POST /slot-transactions/{slot_transaction_id}/approve"
      - "POST /seasons/{season_id}/slot-audit"
    shared_operations:
      - "POST /slot-utilization-records (with NetworkPlanner)"
      - "every GET endpoint"
    identity_note: "X-User-ID is an operator identifier. It is compared against SlotTransaction.proposed_by_user_id on approve to enforce segregation of duties, but it never has to equal any entity's id."
  - name: ComplianceOfficer
    description: "Runs the compliance gate on a schedule version and owns passenger notification duties. Validating is what stamps validated_by_user_id, which then locks this same person out of transmitting."
    identity: opaque
    exclusive_operations:
      - "POST /schedule-versions/{schedule_version_id}/validate"
      - "POST /notification-obligations"
      - "POST /notification-obligations/{notification_obligation_id}/dispatch"
    shared_operations:
      - "POST /flight-legs/{flight_leg_id}/booking-snapshot (with NetworkPlanner)"
      - "every GET endpoint"
    identity_note: "X-User-ID is an operator identifier, stored on ScheduleVersion.validated_by_user_id at validate time and compared against the transmitting user."
  - name: FilingAgent
    description: "Files schedules to distribution systems and records their acknowledgements. Cannot validate a schedule and cannot transmit a schedule it validated itself."
    identity: opaque
    exclusive_operations:
      - "POST /filing-submissions"
      - "POST /filing-submissions/{filing_submission_id}/transmit"
      - "POST /filing-submissions/{filing_submission_id}/acknowledge"
    shared_operations:
      - "POST /filing-submissions/{filing_submission_id}/codeshare-ack (with PartnerCarrier)"
      - "every GET endpoint"
    identity_note: "X-User-ID is an operator identifier, stored on FilingSubmission.submitted_by_user_id and transmitted_by_user_id. The transmit gate requires it to differ from the version's validated_by_user_id."
  - name: SystemAdmin
    description: "Reference-data and clock administrator. Registers carriers, stations, seasons and traffic rights, drives season transitions and suspensions, and sets the logical clock. Holds no planning, slot, compliance or filing power at all."
    identity: opaque
    exclusive_operations:
      - "POST /carriers"
      - "POST /carriers/{carrier_id}/suspend"
      - "POST /stations"
      - "POST /seasons"
      - "POST /seasons/{season_id}/transition"
      - "POST /route-authorities"
      - "POST /route-authorities/{route_authority_id}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
    identity_note: "X-User-ID is an operator identifier that is never compared to any entity id."

segregation_of_duties_rules:
  - rule: "transmit_not_validator"
    description: "POST /filing-submissions/{filing_submission_id}/transmit rejects with ERR_SEGREGATION_OF_DUTIES (403) when the acting X-User-ID equals the ScheduleVersion.validated_by_user_id. The FilingAgent role is correct; the person is not. A second FilingAgent user with a different X-User-ID succeeds on the identical request."
  - rule: "approve_not_proposer"
    description: "POST /slot-transactions/{slot_transaction_id}/approve rejects with ERR_SEGREGATION_OF_DUTIES (403) when the acting X-User-ID equals SlotTransaction.proposed_by_user_id. This matters because a NetworkPlanner user id and a SlotCoordinator user id can coincide in a small deployment where one person wears both hats."
