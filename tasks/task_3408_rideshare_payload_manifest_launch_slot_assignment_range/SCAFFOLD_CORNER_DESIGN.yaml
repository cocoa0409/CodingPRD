              as: ContractManager
              captures: { cv_now: $.data.version }
          trigger:
            - call: "POST /rideshare/contracts/${ct_id}/rebook"
              payload: { to_mission_id: "${m2_id}", expected_contract_version: "${cv_now}" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
