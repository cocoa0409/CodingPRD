  - rule_id: compensating_invariant
    instances:
      - name: ledger_conservation_on_remittance_reverse
        grounds:
          - state_machines.Remittance.CLEARED_to_REVERSED
          - calculations.operator_account_balance
          - entities.LedgerEntry.fields.amount_signed_cents
        distinguishing_aspect: >
          Conserved money quantity: account_balance_cents == SUM(LedgerEntry.amount_signed_cents).
          After clear (-120000) then reverse (+120000) the balance returns to 120000 with no drift
          (TAX_DUE +120000, REMITTANCE -120000, REMITTANCE_REVERSAL +120000).
        test_recipe:
          setup:
            - "Active operator; FILED return period 2026-04 tax 120,000; one CLEARED remittance of 120,000 (balance 0, settlement PAID)"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City Q", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
