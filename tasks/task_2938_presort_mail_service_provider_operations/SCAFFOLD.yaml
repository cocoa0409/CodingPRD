# =============================================================================
# PRD Benchmark Seed Tables — Presort Mail Service Provider Operations
# §1.0 – §1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2938. Presort Mail Service Provider Operations (presort bureau): mail acceptance from clients with piece counts, mail class and postage payment method verification, address hygiene, standardization and move update processing before presorting, commingling across client jobs to achieve deeper discount tiers, sortation to qualifying containers, trays and pallets with documentation generation, postage statement preparation, entry point planning and drop shipment scheduling, verification at the acceptance unit with error correction and postage adjustment, permit and postage account management with client billing of postage plus service fees, service level tracking on delivery days by zone

domain_name: presort-bureau-operations
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # MailJob <-> CommingleBatch is many-to-many through the BatchMember junction;
  # SortContainer / DropShipment / PostageStatement hang off CommingleBatch while
  # ServiceLevelRecord reaches back to SortContainer, so postage money flows in a
  # cycle Client -> PermitAccount -> PostageStatement -> BatchMember -> Client.

  state_machine_shape: branching
  # PostageStatement forks SUBMITTED -> {ACCEPTED_CLEAN, ACCEPTED_WITH_ADJUSTMENT,
  # RETURNED_FOR_CORRECTION} with three disjoint side-effect sets, and cycles back
  # RETURNED_FOR_CORRECTION -> DRAFT -> SUBMITTED. MailJob is cyclic
  # (HYGIENE_CLEARED <-> POOLED, POOLED -> PRESORTED -> REWORK -> POOLED).

  relationship_patterns:
    - one_to_many        # Client -> PermitAccount, CommingleBatch -> SortContainer
    - many_to_many       # MailJob <-> CommingleBatch via BatchMember
    - cross_aggregate    # PostageStatement debits a PermitAccount owned by one Client
                         # while allocating cost to BatchMembers of other Clients

  role_model: segregation_of_duties
  # The PostageManager user id that submits a statement may never be the
  # AcceptanceClerk user id that verifies it (ERR_SEGREGATION_OF_DUTIES).

  consistency_model: immediate

  difficulty_level: expert

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the mailer that tenders mail to the bureau.
        constraints: 1-120 characters, non-blank
      - name: client_code
        type: string
        source: input
        description: Short operator-facing code for the client.
        constraints: 2-16 chars, uppercase A-Z0-9, globally unique (ERR_DUPLICATE_CLIENT_CODE)
      - name: service_fee_rate_per_thousand_cents
        type: integer
        source: input
        description: Bureau service fee in cents charged per thousand mailed pieces before volume discount.
        constraints: integer >= 1
      - name: billing_terms
        type: enum
        source: input
        description: Payment terms printed on the client invoice.
        default: NET_30
        constraints: one of {NET_15, NET_30}
      - name: commingle_opt_in
        type: boolean
        source: input
        description: When false the client's jobs may not be pooled into a CommingleBatch.
        default: true
      - name: status
        type: enum
        source: system
        description: Trading status of the client.
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED}
      - name: suspension_reason
        type: string
        source: system
        description: Free-text reason stamped when status becomes SUSPENDED; null while ACTIVE.
        default: null
      - name: unbilled_postage_cents
        type: integer
        source: computed
        description: Postage already verified and charged to permit accounts but not yet placed on a ClientInvoice.
        default: 0
      - name: lifetime_pieces_mailed
        type: integer
        source: computed
        description: Running count of accepted pieces on this client's MailJobs that have reached MAILED.
        default: 0

  - name: PermitAccount
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the client that holds this permit and funds its postage.
      - name: permit_number
        type: string
        source: input
        description: Permit number issued by the acceptance unit.
        constraints: 4-24 chars, globally unique (ERR_DUPLICATE_PERMIT_NUMBER)
      - name: payment_method
        type: enum
        source: input
        description: How postage is paid on mail filed under this permit.
        constraints: one of {PERMIT_IMPRINT, METER, PRECANCELED_STAMP}
      - name: annual_fee_paid_through_utc
        type: datetime
        source: input
        description: Instant through which the annual mailing fee is paid; mail may not be accepted or filed after it.
        constraints: ISO 8601 UTC with three fractional digits
      - name: balance_cents
        type: integer
        source: computed
        description: Unreserved postage funds available on the account.
        default: 0
      - name: reserved_cents
        type: integer
        source: computed
        description: Funds encumbered by PostageStatements currently in SUBMITTED.
        default: 0
      - name: status
        type: enum
        source: system
        description: Operational status of the permit account.
        default: ACTIVE
        constraints: one of {ACTIVE, HOLD, CLOSED}

  - name: MailJob
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the mailer that tendered this job.
      - name: permit_account_id
        type: string
        source: input
        description: FK -> PermitAccount.id; must belong to client_id (ERR_PERMIT_CLIENT_MISMATCH).
      - name: commingle_batch_id
        type: string
        source: computed
        description: FK -> CommingleBatch.id; denormalized pointer set when the job is pooled and cleared when its BatchMember is removed. Null while RECEIVED / HYGIENE_CLEARED / CANCELLED.
        default: null
      - name: mail_class
        type: enum
        source: input
        description: Postal class the job is entered under.
        constraints: one of {FIRST_CLASS, MARKETING_MAIL, PERIODICALS}
      - name: processing_category
        type: enum
        source: input
        description: Physical processing category of the pieces.
        constraints: one of {LETTERS, FLATS}
      - name: declared_piece_count
        type: integer
        source: input
        description: Piece count declared by the client on tender.
        constraints: integer >= 1 (ERR_INVALID_PIECE_COUNT)
      - name: declared_weight_oz_per_piece
        type: number
        source: input
        description: Declared per-piece weight in ounces.
        constraints: number > 0, at most 3 decimals
      - name: status
        type: enum
        source: system
        description: Lifecycle position of the job.
        default: RECEIVED
        constraints: one of {RECEIVED, HYGIENE_CLEARED, POOLED, PRESORTED, REWORK, MAILED, BILLED, CANCELLED}
      - name: accepted_piece_count
        type: integer
        source: computed
        description: Mailable piece count after address hygiene; equals declared_piece_count until the first AddressHygieneRun, then the highest-run_index run's submitted_piece_count minus undeliverable_removed_count.
      - name: hygiene_run_count
        type: integer
        source: computed
        description: Number of AddressHygieneRun rows recorded against this job.
        default: 0
      - name: rework_count
        type: integer
        source: computed
        description: Number of times this job has been driven back to REWORK by a returned PostageStatement.
        default: 0
      - name: address_quality_pct
        type: number
        source: computed
        description: CASS match percentage from the highest-run_index AddressHygieneRun; null before the first run.
        default: null
      - name: move_update_compliant
        type: boolean
        source: computed
        description: Whether the highest-run_index AddressHygieneRun's move_update_age_days is within MOVE_UPDATE_MAX_AGE_DAYS; null before the first run.
        default: null
      - name: postage_due_cents
        type: integer
        source: computed
        description: Postage attributed to this job once its statement is accepted; equals its BatchMember's allocated_postage_cents plus allocated_adjustment_cents. Reset to 0 on REWORK.
        default: 0
      - name: mailed_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant at which the job's batch was deposited and the job reached MAILED; null before that.
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded when the job is cancelled; null otherwise.
        default: null

  - name: AddressHygieneRun
    parent: MailJob
    common_fields: false
    fields:
      - name: mail_job_id
        type: string
        source: input
        description: FK -> MailJob.id; the job this hygiene pass was run against.
      - name: submitted_piece_count
        type: integer
        source: input
        description: Pieces submitted into the hygiene pass.
        constraints: integer >= 1 (ERR_INVALID_PIECE_COUNT)
      - name: cass_matched_count
        type: integer
        source: input
        description: Pieces whose addresses were CASS-matched and standardized.
        constraints: 0 <= cass_matched_count <= submitted_piece_count (ERR_INVALID_PIECE_COUNT)
      - name: ncoa_move_updated_count
        type: integer
        source: input
        description: Pieces whose addresses were changed by NCOALink move update.
        constraints: 0 <= ncoa_move_updated_count <= submitted_piece_count (ERR_INVALID_PIECE_COUNT)
      - name: undeliverable_removed_count
        type: integer
        source: input
        description: Pieces suppressed as undeliverable and removed from the mailing.
        constraints: 0 <= undeliverable_removed_count < submitted_piece_count (ERR_INVALID_PIECE_COUNT)
      - name: move_update_age_days
        type: integer
        source: input
        description: Age in days of the move-update data set used for this pass.
        constraints: integer >= 0
      - name: run_index
        type: integer
        source: computed
        description: Zero-based ordinal of this run on the job; equals the job's hygiene_run_count immediately before this run was recorded.
      - name: net_piece_count
        type: integer
        source: computed
        description: submitted_piece_count minus undeliverable_removed_count.
      - name: address_quality_pct
        type: number
        source: computed
        description: CASS match percentage for this pass, two decimals.
      - name: move_update_compliant
        type: boolean
        source: computed
        description: True when move_update_age_days <= MOVE_UPDATE_MAX_AGE_DAYS (95).

  - name: EntryFacility
    parent: null
    common_fields: true
    fields:
      - name: facility_code
        type: string
        source: input
        description: Operator-facing code of the entry point.
        constraints: 3-24 chars, globally unique (ERR_DUPLICATE_FACILITY_CODE)
      - name: facility_type
        type: enum
        source: input
        description: Depth of the entry point in the postal network.
        constraints: one of {DDU, SCF, NDC}
      - name: zip3
        type: string
        source: input
        description: Three-digit ZIP prefix the facility itself sits in.
        constraints: exactly 3 digits
      - name: dock_capacity_pallets_per_slot
        type: integer
        source: input
        description: Maximum pallets the dock can absorb across all appointment windows that overlap any instant.
        constraints: integer >= 1
      - name: drop_ship_discount_bp
        type: integer
        source: input
        description: Drop-ship discount in basis points applied to the per-piece rate for batches entered here.
        constraints: 0 <= drop_ship_discount_bp <= 2000
      - name: served_zip3_list
        type: array
        source: input
        description: Three-digit ZIP prefixes this facility delivers directly; drives zone and committed service days.
        constraints: array of 1-40 distinct 3-digit strings
      - name: status
        type: enum
        source: system
        description: Whether the facility is accepting drop shipments.
        default: OPEN
        constraints: one of {OPEN, CLOSED}

  - name: CommingleBatch
    parent: null
    common_fields: true
    fields:
      - name: entry_facility_id
        type: string
        source: input
        description: FK -> EntryFacility.id; entry point the batch is planned against; its drop_ship_discount_bp feeds the rate.
      - name: mail_class
        type: enum
        source: input
        description: Mail class every member job must share.
        constraints: one of {FIRST_CLASS, MARKETING_MAIL, PERIODICALS}
      - name: processing_category
        type: enum
        source: input
        description: Processing category every member job must share.
        constraints: one of {LETTERS, FLATS}
      - name: status
        type: enum
        source: system
        description: Lifecycle position of the pool.
        default: OPEN
        constraints: one of {OPEN, SORTED, DOCUMENTED, REWORK, CLOSED}
      - name: member_job_count
        type: integer
        source: computed
        description: Number of BatchMember rows currently attached.
        default: 0
      - name: total_piece_count
        type: integer
        source: computed
        description: Sum of contributed_piece_count over the batch's BatchMember rows.
        default: 0
      - name: container_count
        type: integer
        source: computed
        description: Number of SortContainer rows attached to the batch.
        default: 0
      - name: achieved_tier
        type: enum
        source: computed
        description: Presort discount tier the pooled volume qualifies for; recomputed on every member add/remove and frozen at sortation.
        default: NONE
        constraints: one of {NONE, BASIC, THREE_DIGIT, FIVE_DIGIT}
      - name: rate_mills_per_piece
        type: integer
        source: computed
        description: Per-piece rate in mills (thousandths of a cent) pinned at sortation from mail_class, achieved_tier and the entry facility discount.
        default: 0
      - name: batch_postage_cents
        type: integer
        source: computed
        description: Whole-batch postage in cents pinned at sortation.
        default: 0

  - name: BatchMember
    parent: CommingleBatch
    common_fields: true
    fields:
      - name: commingle_batch_id
        type: string
        source: input
        description: FK -> CommingleBatch.id; the pool this membership belongs to.
      - name: mail_job_id
        type: string
        source: input
        description: FK -> MailJob.id; the pooled job. At most one non-removed BatchMember exists per MailJob.
      - name: contributed_piece_count
        type: integer
        source: computed
        description: Snapshot of the job's accepted_piece_count at the instant of pooling; never re-read afterwards.
      - name: share_basis_pct
        type: number
        source: computed
        description: contributed_piece_count divided by the batch total_piece_count at sortation, as a percentage with four decimals.
        default: null
      - name: allocated_postage_cents
        type: integer
        source: computed
        description: This member's share of batch_postage_cents after floor-plus-remainder allocation at sortation.
        default: 0
      - name: allocated_adjustment_cents
        type: integer
        source: computed
        description: This member's share of the accepted statement's adjustment_cents, allocated by the same rule.
        default: 0

  - name: SortContainer
    parent: CommingleBatch
    common_fields: true
    fields:
      - name: commingle_batch_id
        type: string
        source: input
        description: FK -> CommingleBatch.id; the pool this physical container was built for.
      - name: container_type
        type: enum
        source: input
        description: Physical container class.
        constraints: one of {TRAY, PALLET}
      - name: destination_zip3
        type: string
        source: input
        description: Three-digit ZIP prefix the container is labelled to.
        constraints: exactly 3 digits
      - name: sort_level
        type: enum
        source: input
        description: Sortation depth the container was built at.
        constraints: one of {MIXED_ADC, ADC, THREE_DIGIT, FIVE_DIGIT}
      - name: piece_count
        type: integer
        source: input
        description: Pieces physically placed in the container.
        constraints: integer >= 1 (ERR_INVALID_PIECE_COUNT)
      - name: qualifies
        type: boolean
        source: computed
        description: Whether the container meets the minimum for its container_type and sort_level.
      - name: placard_id
        type: string
        source: computed
        description: Documentation placard identifier of the form <facility_code>-<destination_zip3>-<sequence_index>.
      - name: sequence_index
        type: integer
        source: computed
        description: Zero-based ordinal of the container within its batch, assigned in creation order.
      - name: zone
        type: integer
        source: computed
        description: Delivery zone derived from the batch entry facility and destination_zip3.
        constraints: one of {1, 2, 4, 8}
      - name: committed_days
        type: integer
        source: computed
        description: Service-standard delivery days committed for this container.
      - name: status
        type: enum
        source: system
        description: Documentation and induction status of the container.
        default: STAGED
        constraints: one of {STAGED, DOCUMENTED, RETURNED, DEPOSITED}

  - name: DropShipment
    parent: null
    common_fields: true
    fields:
      - name: commingle_batch_id
        type: string
        source: input
        description: FK -> CommingleBatch.id; the pool being inducted.
      - name: entry_facility_id
        type: string
        source: input
        description: FK -> EntryFacility.id; dock the appointment is booked on.
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the appointment window.
        constraints: ISO 8601 UTC with three fractional digits
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the appointment window; must be strictly after window_start_utc.
        constraints: ISO 8601 UTC with three fractional digits
      - name: pallet_count
        type: integer
        source: input
        description: Pallets tendered against the dock capacity in this window.
        constraints: integer >= 1 (ERR_INVALID_PIECE_COUNT)
      - name: status
        type: enum
        source: system
        description: Appointment status.
        default: SCHEDULED
        constraints: one of {SCHEDULED, IN_TRANSIT, DEPOSITED, CANCELLED, NO_SHOW}
      - name: deposited_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant of the deposit; null until DEPOSITED.
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded on cancel; null otherwise.
        default: null

  - name: PostageStatement
    parent: CommingleBatch
    common_fields: true
    fields:
      - name: commingle_batch_id
        type: string
        source: input
        description: FK -> CommingleBatch.id; the sorted pool this statement documents.
      - name: permit_account_id
        type: string
        source: input
        description: FK -> PermitAccount.id; account of record that funds and is debited for the whole statement.
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the PostageManager that created the statement.
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the PostageManager that submitted the statement; null while DRAFT.
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the AcceptanceClerk that verified the statement; null before verification.
        default: null
      - name: statement_piece_count
        type: integer
        source: computed
        description: Piece count frozen from the batch total_piece_count when the statement was created; never re-derived.
      - name: rate_mills_per_piece
        type: integer
        source: computed
        description: Per-piece rate in mills frozen from the batch at creation; never re-derived.
      - name: declared_postage_cents
        type: integer
        source: computed
        description: Postage declared on the statement, frozen from the batch batch_postage_cents at creation.
      - name: adjustment_cents
        type: integer
        source: computed
        description: Sum of VerificationFinding surcharges applied at verification; 0 before verification.
        default: 0
      - name: verified_postage_cents
        type: integer
        source: computed
        description: declared_postage_cents plus adjustment_cents, set at verification; 0 before verification.
        default: 0
      - name: verification_error_count
        type: integer
        source: computed
        description: Number of VerificationFinding rows recorded against this statement.
        default: 0
      - name: revision_index
        type: integer
        source: computed
        description: Zero-based count of times this statement has been returned for correction and revised.
        default: 0
      - name: status
        type: enum
        source: system
        description: Statement lifecycle position.
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, ACCEPTED_CLEAN, ACCEPTED_WITH_ADJUSTMENT, RETURNED_FOR_CORRECTION, VOID}
      - name: void_reason
        type: string
        source: system
        description: Reason recorded when the statement is voided or superseded; null otherwise.
        default: null

  - name: VerificationFinding
    parent: PostageStatement
    common_fields: false
    fields:
      - name: postage_statement_id
        type: string
        source: input
        description: FK -> PostageStatement.id; the statement being verified.
      - name: finding_type
        type: enum
        source: input
        description: Category of the error found at the acceptance unit.
        constraints: one of {SHORT_PAID, BAD_ADDRESS_QUALITY, CONTAINER_NOT_QUALIFIED, MOVE_UPDATE_STALE, DOC_MISMATCH}
      - name: affected_piece_count
        type: integer
        source: input
        description: Pieces implicated by this finding.
        constraints: 1 <= affected_piece_count <= statement.statement_piece_count (ERR_INVALID_PIECE_COUNT)
      - name: assessed_by_user_id
        type: string
        source: system
        description: X-User-ID of the AcceptanceClerk that recorded the finding.
      - name: severity
        type: enum
        source: computed
        description: MAJOR when affected_piece_count is at least MAJOR_THRESHOLD_BP of the frozen statement_piece_count, else MINOR.
        constraints: one of {MINOR, MAJOR}
      - name: surcharge_cents
        type: integer
        source: computed
        description: Postage surcharge this finding contributes to the statement adjustment.

  - name: ServiceLevelRecord
    parent: SortContainer
    common_fields: true
    fields:
      - name: sort_container_id
        type: string
        source: computed
        description: FK -> SortContainer.id; the deposited container whose delivery performance is tracked.
      - name: zone
        type: integer
        source: computed
        description: Delivery zone copied from the container at deposit.
        constraints: one of {1, 2, 4, 8}
      - name: committed_days
        type: integer
        source: computed
        description: Service-standard days committed, copied from the container at deposit.
      - name: piece_count
        type: integer
        source: computed
        description: Pieces in the container, copied at deposit.
      - name: deposited_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant of the deposit that created this record.
      - name: actual_delivery_days
        type: integer
        source: input
        description: Observed delivery days reported by the delivery scan; null until scanned.
        default: null
        constraints: integer >= 0
      - name: scanned_at_utc
        type: datetime
        source: input
        description: Instant the delivery scan was captured; null until scanned.
        default: null
      - name: on_time
        type: boolean
        source: computed
        description: True when actual_delivery_days <= committed_days; null until scanned.
        default: null

  - name: ClientInvoice
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the billed mailer.
      - name: period_start_utc
        type: datetime
        source: input
        description: Inclusive start of the billing period.
        constraints: ISO 8601 UTC with three fractional digits
      - name: period_end_utc
        type: datetime
        source: input
        description: Inclusive end of the billing period; must be strictly after period_start_utc.
        constraints: ISO 8601 UTC with three fractional digits
      - name: postage_cents
        type: integer
        source: computed
        description: Sum of allocated_postage_cents over the BatchMembers of the billed jobs.
      - name: adjustment_cents
        type: integer
        source: computed
        description: Sum of allocated_adjustment_cents over the BatchMembers of the billed jobs.
      - name: service_fee_cents
        type: integer
        source: computed
        description: Bureau service fee for the period after volume discount and minimum-charge floor.
      - name: total_cents
        type: integer
        source: computed
        description: postage_cents plus adjustment_cents plus service_fee_cents.
      - name: included_job_count
        type: integer
        source: computed
        description: Number of MailJobs rolled into this invoice.
      - name: billed_piece_count
        type: integer
        source: computed
        description: Sum of accepted_piece_count over the billed jobs; drives the service-fee volume tier.
      - name: status
        type: enum
        source: system
        description: Invoice settlement status.
        default: ISSUED
        constraints: one of {ISSUED, PAID}
      - name: paid_amount_cents
        type: integer
        source: computed
        description: Amount recorded against the invoice; 0 until PAID.
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Client
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clients/{id}/status with status=SUSPENDED"
        actor: BureauAdmin
        preconditions:
          - "client.status == ACTIVE"
        side_effects:
          - "sets Client.suspension_reason to the request reason (or to 'REPEATED_PRESORT_REWORK' when driven by the rework cascade)"
          - "increments Client.version by 1"
        note: "Also reached as system link 4 of the statement-return cascade when a member job's rework_count reaches REWORK_SUSPEND_THRESHOLD."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{id}/status with status=ACTIVE"
        actor: BureauAdmin
        preconditions:
          - "client.status == SUSPENDED"
        side_effects:
          - "clears Client.suspension_reason to null"
          - "increments Client.version by 1"

  - entity: PermitAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: HOLD
        trigger: "POST /permit-accounts/{id}/status with status=HOLD"
        actor: BureauAdmin
        preconditions:
          - "permit_account.status == ACTIVE"
        side_effects:
          - "increments PermitAccount.version by 1"
        note: "While HOLD the account funds nothing: pooling and statement submission against it are rejected with ERR_PERMIT_ACCOUNT_NOT_ACTIVE."
      - from: HOLD
        to: ACTIVE
        trigger: "POST /permit-accounts/{id}/status with status=ACTIVE"
        actor: BureauAdmin
        preconditions:
          - "permit_account.status == HOLD"
        side_effects:
          - "increments PermitAccount.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /permit-accounts/{id}/status with status=CLOSED"
        actor: BureauAdmin
        preconditions:
          - "permit_account.status == ACTIVE"
          - "permit_account.reserved_cents == 0"
        side_effects:
          - "increments PermitAccount.version by 1"
      - from: HOLD
        to: CLOSED
        trigger: "POST /permit-accounts/{id}/status with status=CLOSED"
        actor: BureauAdmin
        preconditions:
          - "permit_account.status == HOLD"
          - "permit_account.reserved_cents == 0"
        side_effects:
          - "increments PermitAccount.version by 1"

  - entity: EntryFacility
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /entry-facilities/{id}/status with status=CLOSED"
        actor: BureauAdmin
        preconditions:
          - "entry_facility.status == OPEN"
        side_effects:
          - "increments EntryFacility.version by 1"
          - "existing DropShipments are untouched; only new bookings are refused with ERR_ENTRY_FACILITY_CLOSED"
      - from: CLOSED
        to: OPEN
        trigger: "POST /entry-facilities/{id}/status with status=OPEN"
        actor: BureauAdmin
        preconditions:
          - "entry_facility.status == CLOSED"
        side_effects:
          - "increments EntryFacility.version by 1"

  - entity: MailJob
    initial_state: RECEIVED
    terminal_states: [BILLED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: HYGIENE_CLEARED
        trigger: "POST /mail-jobs/{id}/hygiene-runs"
        actor: PresortOperator
        preconditions:
          - "mail_job.status == RECEIVED"
          - "mail_job's Client.status == ACTIVE"
          - "mail_job's PermitAccount.status == ACTIVE"
          - "mail_job's PermitAccount.annual_fee_paid_through_utc >= logical clock now"
        side_effects:
          - "creates an AddressHygieneRun with run_index = mail_job.hygiene_run_count (pre-increment)"
          - "sets MailJob.accepted_piece_count = run.net_piece_count"
          - "sets MailJob.address_quality_pct = run.address_quality_pct"
          - "sets MailJob.move_update_compliant = run.move_update_compliant"
          - "increments MailJob.hygiene_run_count by 1"
          - "increments MailJob.version by 1"
      - from: HYGIENE_CLEARED
        to: HYGIENE_CLEARED
        trigger: "POST /mail-jobs/{id}/hygiene-runs (re-run after a corrected address file)"
        actor: PresortOperator
        preconditions:
          - "mail_job.status == HYGIENE_CLEARED"
          - "mail_job's Client.status == ACTIVE"
          - "mail_job's PermitAccount.status == ACTIVE"
          - "mail_job's PermitAccount.annual_fee_paid_through_utc >= logical clock now"
        side_effects:
          - "creates a further AddressHygieneRun with the next run_index"
          - "overwrites MailJob.accepted_piece_count, address_quality_pct and move_update_compliant from the new highest-run_index run"
          - "increments MailJob.hygiene_run_count by 1"
          - "increments MailJob.version by 1"
        note: "Self-loop: this is the revision cycle that lets a stale move-update file be replaced before pooling."
      - from: HYGIENE_CLEARED
        to: POOLED
        trigger: "POST /commingle-batches/{id}/members"
        actor: PresortOperator
        preconditions:
          - "mail_job.status == HYGIENE_CLEARED"
          - "commingle_batch.status == OPEN"
          - "mail_job's Client.status == ACTIVE and Client.commingle_opt_in == true"
          - "mail_job's PermitAccount.status == ACTIVE"
          - "mail_job.move_update_compliant == true"
          - "mail_job.address_quality_pct >= MIN_ADDRESS_QUALITY_PCT (95.00)"
          - "mail_job.mail_class == commingle_batch.mail_class"
          - "mail_job.processing_category == commingle_batch.processing_category"
        side_effects:
          - "creates a BatchMember with contributed_piece_count = mail_job.accepted_piece_count (snapshot)"
          - "sets MailJob.commingle_batch_id = commingle_batch.id"
          - "adds contributed_piece_count to CommingleBatch.total_piece_count"
          - "increments CommingleBatch.member_job_count by 1"
          - "recomputes CommingleBatch.achieved_tier via presort_tier_qualification"
          - "increments CommingleBatch.version by 1 and MailJob.version by 1"
      - from: POOLED
        to: HYGIENE_CLEARED
        trigger: "DELETE /commingle-batches/{id}/members/{batch_member_id}"
        actor: PresortOperator
        preconditions:
          - "mail_job.status == POOLED"
          - "commingle_batch.status == OPEN"
        side_effects:
          - "deletes the BatchMember row"
          - "clears MailJob.commingle_batch_id to null"
          - "subtracts the removed contributed_piece_count from CommingleBatch.total_piece_count"
          - "decrements CommingleBatch.member_job_count by 1"
          - "recomputes CommingleBatch.achieved_tier via presort_tier_qualification"
          - "increments CommingleBatch.version by 1 and MailJob.version by 1"
        note: "Compensating action for the pool-add; conserves the piece ledger (see compensating_invariant batch_piece_ledger_conservation)."
      - from: POOLED
        to: PRESORTED
        trigger: "system, on POST /commingle-batches/{id}/sort"
        actor: system
        preconditions:
          - "commingle_batch.status == OPEN and sortation passes all container gates"
        side_effects:
          - "sets MailJob.postage_due_cents = 0 (postage is not attributed until verification)"
          - "increments MailJob.version by 1"
      - from: PRESORTED
        to: REWORK
        trigger: "system, link 3 of the statement-return cascade on POST /postage-statements/{id}/verify with outcome=RETURN"
        actor: system
        preconditions:
          - "mail_job.status == PRESORTED"
          - "the job's CommingleBatch has just entered REWORK"
        side_effects:
          - "increments MailJob.rework_count by 1"
          - "sets MailJob.postage_due_cents = 0"
          - "increments MailJob.version by 1"
          - "link 4: if MailJob.rework_count >= REWORK_SUSPEND_THRESHOLD (2) then the job's Client transitions ACTIVE -> SUSPENDED with suspension_reason 'REPEATED_PRESORT_REWORK'"
      - from: REWORK
        to: POOLED
        trigger: "system, on POST /postage-statements/{id}/revise"
        actor: system
        preconditions:
          - "mail_job.status == REWORK"
          - "the job's CommingleBatch is returning REWORK -> OPEN"
        side_effects:
          - "increments MailJob.version by 1"
        note: "Closes the presort cycle POOLED -> PRESORTED -> REWORK -> POOLED."
      - from: PRESORTED
        to: MAILED
        trigger: "system, link 3 of the deposit cascade on POST /drop-shipments/{id}/deposit"
        actor: system
        preconditions:
          - "mail_job.status == PRESORTED"
          - "the job's CommingleBatch has just entered CLOSED"
        side_effects:
          - "sets MailJob.mailed_at_utc = logical clock now"
          - "link 4: adds MailJob.accepted_piece_count to the job's Client.lifetime_pieces_mailed"
          - "increments MailJob.version by 1 and Client.version by 1"
      - from: MAILED
        to: BILLED
        trigger: "system, on POST /clients/{id}/invoices when the job falls inside the billing period"
        actor: system
        preconditions:
          - "mail_job.status == MAILED"
          - "period_start_utc <= mail_job.mailed_at_utc <= period_end_utc"
        side_effects:
          - "increments MailJob.version by 1"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /mail-jobs/{id}/cancel"
        actor: PresortOperator
        preconditions:
          - "mail_job.status == RECEIVED"
        side_effects:
          - "sets MailJob.cancel_reason"
          - "increments MailJob.version by 1"
      - from: HYGIENE_CLEARED
        to: CANCELLED
        trigger: "POST /mail-jobs/{id}/cancel"
        actor: PresortOperator
        preconditions:
          - "mail_job.status == HYGIENE_CLEARED"
        side_effects:
          - "sets MailJob.cancel_reason"
          - "increments MailJob.version by 1"

  - entity: CommingleBatch
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SORTED
        trigger: "POST /commingle-batches/{id}/sort"
        actor: PresortOperator
        preconditions:
          - "commingle_batch.status == OPEN"
          - "commingle_batch.member_job_count >= 1"
          - "commingle_batch.container_count >= 1"
          - "every SortContainer of the batch has qualifies == true"
          - "sum of SortContainer.piece_count over the batch == commingle_batch.total_piece_count"
        side_effects:
          - "freezes CommingleBatch.achieved_tier via presort_tier_qualification"
          - "sets CommingleBatch.rate_mills_per_piece and batch_postage_cents via commingled_postage_assessment (variant batch_commingled)"
          - "sets every BatchMember.share_basis_pct and allocated_postage_cents via pro_rata_cost_allocation over batch_postage_cents"
          - "transitions every member MailJob POOLED -> PRESORTED"
          - "transitions every SortContainer STAGED -> DOCUMENTED and assigns placard_id"
          - "increments CommingleBatch.version by 1"
      - from: SORTED
        to: DOCUMENTED
        trigger: "system, on POST /postage-statements/{id}/submit"
        actor: system
        preconditions:
          - "commingle_batch.status == SORTED"
          - "the submitted PostageStatement.commingle_batch_id == commingle_batch.id"
        side_effects:
          - "increments CommingleBatch.version by 1"
      - from: DOCUMENTED
        to: REWORK
        trigger: "system, link 2 of the statement-return cascade on POST /postage-statements/{id}/verify with outcome=RETURN"
        actor: system
        preconditions:
          - "commingle_batch.status == DOCUMENTED"
          - "the batch's SUBMITTED PostageStatement has just entered RETURNED_FOR_CORRECTION"
        side_effects:
          - "resets CommingleBatch.achieved_tier to NONE, rate_mills_per_piece to 0 and batch_postage_cents to 0"
          - "link 3: resets every BatchMember.allocated_postage_cents and allocated_adjustment_cents to 0 and share_basis_pct to null"
          - "link 3: transitions every member MailJob PRESORTED -> REWORK"
          - "link 3: transitions every SortContainer DOCUMENTED -> RETURNED"
          - "increments CommingleBatch.version by 1"
      - from: REWORK
        to: OPEN
        trigger: "system, on POST /postage-statements/{id}/revise"
        actor: system
        preconditions:
          - "commingle_batch.status == REWORK"
          - "the batch's RETURNED_FOR_CORRECTION PostageStatement is returning to DRAFT"
        side_effects:
          - "recomputes CommingleBatch.achieved_tier via presort_tier_qualification, then rate_mills_per_piece and batch_postage_cents via commingled_postage_assessment (variant batch_commingled), then every BatchMember.share_basis_pct and allocated_postage_cents via pro_rata_cost_allocation — all from the surviving members, restoring the values the batch held before it was unwound"
          - "transitions every member MailJob REWORK -> POOLED"
          - "transitions every SortContainer RETURNED -> STAGED"
          - "increments CommingleBatch.version by 1"
      - from: DOCUMENTED
        to: SORTED
        trigger: "system, on POST /postage-statements/{id}/void when the voided statement was SUBMITTED"
        actor: system
        preconditions:
          - "commingle_batch.status == DOCUMENTED"
          - "the voided PostageStatement.commingle_batch_id == commingle_batch.id and its status was SUBMITTED"
        side_effects:
          - "leaves achieved_tier, rate_mills_per_piece, batch_postage_cents and every BatchMember allocation intact (the sortation itself is untouched)"
          - "increments CommingleBatch.version by 1"
        note: "Reverse of SORTED -> DOCUMENTED; lets a replacement statement be prepared against the same sortation."
      - from: DOCUMENTED
        to: CLOSED
        trigger: "system, link 1 of the deposit cascade on POST /drop-shipments/{id}/deposit"
        actor: system
        preconditions:
          - "commingle_batch.status == DOCUMENTED"
          - "the batch has a PostageStatement in ACCEPTED_CLEAN or ACCEPTED_WITH_ADJUSTMENT"
        side_effects:
          - "transitions every SortContainer DOCUMENTED -> DEPOSITED"
          - "link 2: creates one ServiceLevelRecord per newly DEPOSITED SortContainer, in container sequence_index order"
          - "link 3: transitions every member MailJob PRESORTED -> MAILED"
          - "increments CommingleBatch.version by 1"

  - entity: SortContainer
    initial_state: STAGED
    terminal_states: [DEPOSITED]
    transitions:
      - from: STAGED
        to: DOCUMENTED
        trigger: "system, on POST /commingle-batches/{id}/sort"
        actor: system
        preconditions:
          - "sort_container.status == STAGED"
          - "sort_container.qualifies == true"
        side_effects:
          - "assigns SortContainer.placard_id = <entry facility facility_code>-<destination_zip3>-<sequence_index>"
          - "increments SortContainer.version by 1"
      - from: DOCUMENTED
        to: RETURNED
        trigger: "system, link 3 of the statement-return cascade"
        actor: system
        preconditions:
          - "sort_container.status == DOCUMENTED"
          - "the container's CommingleBatch has just entered REWORK"
        side_effects:
          - "increments SortContainer.version by 1"
      - from: RETURNED
        to: STAGED
        trigger: "system, on POST /postage-statements/{id}/revise"
        actor: system
        preconditions:
          - "sort_container.status == RETURNED"
          - "the container's CommingleBatch is returning REWORK -> OPEN"
        side_effects:
          - "clears SortContainer.placard_id to null"
          - "increments SortContainer.version by 1"
      - from: DOCUMENTED
        to: DEPOSITED
        trigger: "system, link 1 of the deposit cascade on POST /drop-shipments/{id}/deposit"
        actor: system
        preconditions:
          - "sort_container.status == DOCUMENTED"
          - "the container's CommingleBatch has just entered CLOSED"
        side_effects:
          - "link 2: creates a ServiceLevelRecord carrying this container's zone, committed_days and piece_count"
          - "increments SortContainer.version by 1"

  - entity: DropShipment
    initial_state: SCHEDULED
    terminal_states: [DEPOSITED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /drop-shipments/{id}/depart"
        actor: PresortOperator
        preconditions:
          - "drop_shipment.status == SCHEDULED"
        side_effects:
          - "increments DropShipment.version by 1"
      - from: IN_TRANSIT
        to: DEPOSITED
        trigger: "POST /drop-shipments/{id}/deposit"
        actor: AcceptanceClerk
        preconditions:
          - "drop_shipment.status == IN_TRANSIT"
          - "drop_shipment's CommingleBatch.status == DOCUMENTED"
          - "that batch has a PostageStatement in ACCEPTED_CLEAN or ACCEPTED_WITH_ADJUSTMENT"
          - "window_start_utc <= logical clock now <= window_end_utc"
        side_effects:
          - "sets DropShipment.deposited_at_utc = logical clock now"
          - "link 1: transitions the CommingleBatch DOCUMENTED -> CLOSED (which cascades containers, service-level records and member jobs)"
          - "increments DropShipment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /drop-shipments/{id}/cancel"
        actor: PresortOperator
        preconditions:
          - "drop_shipment.status == SCHEDULED"
        side_effects:
          - "sets DropShipment.cancel_reason"
          - "releases this shipment's pallet_count from the dock capacity of all overlapping windows"
          - "increments DropShipment.version by 1"
      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /drop-shipments/{id}/cancel"
        actor: PresortOperator
        preconditions:
          - "drop_shipment.status == IN_TRANSIT"
        side_effects:
          - "sets DropShipment.cancel_reason"
          - "releases this shipment's pallet_count from the dock capacity of all overlapping windows"
          - "increments DropShipment.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system, on POST /_clock/set_current_utc when the new clock value is strictly after window_end_utc"
        actor: system
        preconditions:
          - "drop_shipment.status == SCHEDULED"
          - "new logical clock value > drop_shipment.window_end_utc"
        side_effects:
          - "releases this shipment's pallet_count from the dock capacity of all overlapping windows"
          - "increments DropShipment.version by 1"
          - "the shipment's id is returned in the clock endpoint's no_show_shipment_ids"
        note: "Ops-run checkpoint: evaluated over all SCHEDULED shipments in created_at ASC order on every clock advance. IN_TRANSIT shipments are exempt."

  - entity: PostageStatement
    initial_state: DRAFT
    terminal_states: [ACCEPTED_CLEAN, ACCEPTED_WITH_ADJUSTMENT, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /postage-statements/{id}/submit"
        actor: PostageManager
        preconditions:
          - "postage_statement.status == DRAFT"
          - "postage_statement's CommingleBatch.status == SORTED"
          - "postage_statement's PermitAccount.status == ACTIVE"
          - "postage_statement's PermitAccount.annual_fee_paid_through_utc >= logical clock now"
          - "postage_statement's PermitAccount.balance_cents >= postage_statement.declared_postage_cents"
        side_effects:
          - "sets PostageStatement.submitted_by_user_id = the acting X-User-ID"
          - "subtracts declared_postage_cents from PermitAccount.balance_cents and adds it to PermitAccount.reserved_cents"
          - "transitions the CommingleBatch SORTED -> DOCUMENTED"
          - "increments PostageStatement.version by 1 and PermitAccount.version by 1"
      - from: SUBMITTED
        to: ACCEPTED_CLEAN
        trigger: "POST /postage-statements/{id}/verify with outcome=ACCEPT, resolving to adjustment_cents == 0"
        actor: AcceptanceClerk
        preconditions:
          - "postage_statement.status == SUBMITTED"
          - "the acting X-User-ID != postage_statement.submitted_by_user_id"
          - "verification_adjustment resolves adjustment_cents to exactly 0"
        side_effects:
          - "sets adjustment_cents = 0 and verified_postage_cents = declared_postage_cents"
          - "sets verified_by_user_id = the acting X-User-ID"
          - "subtracts declared_postage_cents from PermitAccount.reserved_cents (consumes the reservation)"
          - "sets every BatchMember.allocated_adjustment_cents = 0 and every member MailJob.postage_due_cents = its BatchMember.allocated_postage_cents"
          - "adds each member job's postage_due_cents to that job's Client.unbilled_postage_cents"
          - "leaves the CommingleBatch in DOCUMENTED"
          - "increments PostageStatement.version by 1 and PermitAccount.version by 1"
      - from: SUBMITTED
        to: ACCEPTED_WITH_ADJUSTMENT
        trigger: "POST /postage-statements/{id}/verify with outcome=ACCEPT, resolving to adjustment_cents > 0"
        actor: AcceptanceClerk
        preconditions:
          - "postage_statement.status == SUBMITTED"
          - "the acting X-User-ID != postage_statement.submitted_by_user_id"
          - "verification_adjustment resolves adjustment_cents > 0"
          - "PermitAccount.balance_cents >= adjustment_cents"
        side_effects:
          - "sets adjustment_cents from verification_adjustment and verified_postage_cents = declared_postage_cents + adjustment_cents"
          - "sets verified_by_user_id = the acting X-User-ID"
          - "subtracts declared_postage_cents from PermitAccount.reserved_cents and adjustment_cents from PermitAccount.balance_cents"
          - "sets every BatchMember.allocated_adjustment_cents via pro_rata_cost_allocation over adjustment_cents"
          - "sets every member MailJob.postage_due_cents = allocated_postage_cents + allocated_adjustment_cents"
          - "adds each member job's postage_due_cents to that job's Client.unbilled_postage_cents"
          - "leaves the CommingleBatch in DOCUMENTED"
          - "increments PostageStatement.version by 1 and PermitAccount.version by 1"
        note: "Divergent branch: unlike ACCEPTED_CLEAN this branch debits balance_cents and writes non-zero allocated_adjustment_cents."
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /postage-statements/{id}/verify with outcome=RETURN"
        actor: AcceptanceClerk
        preconditions:
          - "postage_statement.status == SUBMITTED"
          - "the acting X-User-ID != postage_statement.submitted_by_user_id"
          - "postage_statement.verification_error_count >= 1"
        side_effects:
          - "sets verified_by_user_id = the acting X-User-ID; leaves adjustment_cents and verified_postage_cents at 0"
          - "link 1: subtracts declared_postage_cents from PermitAccount.reserved_cents and adds it back to PermitAccount.balance_cents"
          - "link 2: transitions the CommingleBatch DOCUMENTED -> REWORK"
          - "link 3: (caused by link 2) resets every BatchMember allocation, drives every member MailJob PRESORTED -> REWORK and every SortContainer DOCUMENTED -> RETURNED"
          - "link 4: (caused by link 3) suspends the Client of any member job whose rework_count has reached REWORK_SUSPEND_THRESHOLD"
          - "increments PostageStatement.version by 1 and PermitAccount.version by 1"
        note: "Divergent branch: no money leaves the permit account and the whole batch is unwound."
      - from: RETURNED_FOR_CORRECTION
        to: DRAFT
        trigger: "POST /postage-statements/{id}/revise"
        actor: PostageManager
        preconditions:
          - "postage_statement.status == RETURNED_FOR_CORRECTION"
          - "postage_statement's CommingleBatch.status == REWORK"
        side_effects:
          - "increments PostageStatement.revision_index by 1"
          - "resets adjustment_cents, verified_postage_cents and verification_error_count to 0 and discards nothing (VerificationFinding rows are retained as history)"
          - "transitions the CommingleBatch REWORK -> OPEN, which recomputes achieved_tier, rate_mills_per_piece, batch_postage_cents and every BatchMember allocation and cascades member jobs back to POOLED and containers back to STAGED"
          - "increments PostageStatement.version by 1"
        note: "Closes the statement cycle SUBMITTED -> RETURNED_FOR_CORRECTION -> DRAFT -> SUBMITTED."
      - from: DRAFT
        to: VOID
        trigger: "POST /postage-statements/{id}/void"
        actor: PostageManager
        preconditions:
          - "postage_statement.status == DRAFT"
        side_effects:
          - "sets void_reason"
          - "increments PostageStatement.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "system, superseded when POST /postage-statements creates a newer statement on the same CommingleBatch"
        actor: system
        preconditions:
          - "postage_statement.status == DRAFT"
          - "a new PostageStatement is being created for the same commingle_batch_id"
        side_effects:
          - "sets void_reason = 'SUPERSEDED_BY_NEWER_STATEMENT'"
          - "increments PostageStatement.version by 1"
      - from: SUBMITTED
        to: VOID
        trigger: "POST /postage-statements/{id}/void"
        actor: PostageManager
        preconditions:
          - "postage_statement.status == SUBMITTED"
        side_effects:
          - "sets void_reason"
          - "subtracts declared_postage_cents from PermitAccount.reserved_cents and adds it back to PermitAccount.balance_cents"
          - "transitions the CommingleBatch DOCUMENTED -> SORTED so a replacement statement can be prepared against the same sortation"
          - "increments PostageStatement.version by 1 and PermitAccount.version by 1"
        note: "Compensating action for submit; conserves permit_total_funds_cents (see compensating_invariant permit_funds_conservation)."

  - entity: ClientInvoice
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /client-invoices/{id}/payment"
        actor: PostageManager
        preconditions:
          - "client_invoice.status == ISSUED"
          - "the request amount_cents == client_invoice.total_cents"
        side_effects:
          - "sets ClientInvoice.paid_amount_cents = amount_cents"
          - "increments ClientInvoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: permit-funding-stale-account
    parent_entity: PermitAccount
    write_endpoint: "POST /permit-accounts/{id}/funding"
    occ_field: "expected_permit_account_version"
    description: |
      A funding deposit carrying a PermitAccount version older than the account's
      current version is rejected. Repeated deposits are legitimate on their own
      terms, so a writer whose view of balance_cents is stale would otherwise
      succeed and top the account up to the wrong figure; the OCC check on the
      account's version turns that into a deterministic stale-version rejection.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

  - rule_id: statement-create-stale-batch
    parent_entity: CommingleBatch
    write_endpoint: "POST /postage-statements"
    occ_field: "expected_batch_version"
    description: |
      Creating a PostageStatement against a CommingleBatch whose version has
      advanced since the client last read it is rejected. Statement creation
      legitimately supersedes any prior DRAFT statement on the same batch, so a
      writer holding a stale batch view would otherwise void a statement that was
      prepared from different piece counts; the OCC check on the batch's version
      makes that a stale-version rejection instead.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: presort_tier_qualification
    trigger: "On POST /commingle-batches/{id}/members, on DELETE /commingle-batches/{id}/members/{batch_member_id}, on POST /commingle-batches/{id}/sort (freeze), on the REWORK -> OPEN recompute, and inside commingled_postage_assessment for the job_standalone variant."
    algorithm: threshold
    formula: |
      presort_tier_qualification(piece_count):
        if piece_count >= TIER_MIN_PIECES.FIVE_DIGIT   -> FIVE_DIGIT
        if piece_count >= TIER_MIN_PIECES.THREE_DIGIT  -> THREE_DIGIT
        if piece_count >= TIER_MIN_PIECES.BASIC        -> BASIC
        otherwise                                      -> NONE
      Comparisons are inclusive (>=): exactly 3000 pieces qualifies THREE_DIGIT,
      2999 qualifies only BASIC.
    input_set: "For a CommingleBatch: piece_count = CommingleBatch.total_piece_count, i.e. the sum of contributed_piece_count over the batch's currently attached BatchMember rows (removed members are excluded). For the job_standalone variant: piece_count = MailJob.accepted_piece_count of that one job."
    constants:
      TIER_MIN_PIECES: { BASIC: 500, THREE_DIGIT: 3000, FIVE_DIGIT: 15000 }
    precision: "Integer piece counts; no rounding."

  - name: commingled_postage_assessment
    trigger: "Variant batch_commingled runs on POST /commingle-batches/{id}/members, on DELETE /commingle-batches/{id}/members/{batch_member_id}, on the CommingleBatch REWORK -> OPEN recompute driven by POST /postage-statements/{id}/revise, and on POST /commingle-batches/{id}/sort (where it is frozen), each time writing CommingleBatch.rate_mills_per_piece and CommingleBatch.batch_postage_cents. Variant job_standalone runs read-only on GET /mail-jobs/{id}/postage-estimate and persists nothing."
    algorithm: tiered_pricing
    formula: |
      STEP 1  tier    = presort_tier_qualification(piece_count)
      STEP 2  tier_bp = TIER_DISCOUNT_BP[tier]
      STEP 3  ship_bp = the drop-ship discount in basis points for this variant
      STEP 4  base    = BASE_RATE_CENTS_PER_PIECE[mail_class]
      STEP 5  rate_mills_per_piece =
                floor( base * 1000 * (10000 - tier_bp) * (10000 - ship_bp) / 100000000 )
              The whole numerator is evaluated in exact integer arithmetic and
              floored EXACTLY ONCE, at the end. Flooring after the tier factor and
              again after the ship factor is forbidden.
      STEP 6  postage_cents = round_half_up( piece_count * rate_mills_per_piece / 1000 )
              Mills are converted to cents EXACTLY ONCE, on the whole piece_count,
              never per container and never per member.
    input_set: "batch_commingled: piece_count = CommingleBatch.total_piece_count, mail_class = CommingleBatch.mail_class, ship_bp = the batch's EntryFacility.drop_ship_discount_bp. job_standalone: piece_count = MailJob.accepted_piece_count, mail_class = MailJob.mail_class, ship_bp = 0 (an unpooled single job earns no drop-ship discount because it is not tendered at an entry point on its own)."
    constants:
      BASE_RATE_CENTS_PER_PIECE: { FIRST_CLASS: 64, MARKETING_MAIL: 32, PERIODICALS: 28 }
      TIER_DISCOUNT_BP: { NONE: 0, BASIC: 800, THREE_DIGIT: 1500, FIVE_DIGIT: 2200 }
    precision: "rate_mills_per_piece is an integer number of mills (thousandths of a cent), floor. postage_cents is an integer number of cents, round_half_up."
    variants:
      - name: job_standalone
        when: "A MailJob is priced on its own accepted_piece_count, before pooling, via GET /mail-jobs/{id}/postage-estimate."
        difference: "The tier is derived from the single job's piece count and ship_bp is forced to 0, so a 1200-piece MARKETING_MAIL job prices at the BASIC tier with rate_mills_per_piece = 29440."
      - name: batch_commingled
        when: "The same job's pieces are priced as part of a CommingleBatch at sortation."
        difference: "The tier is derived from the pooled total across all client jobs and ship_bp comes from the entry facility, so the same 1200 pieces inside a 3000-piece batch entered at an SCF price at THREE_DIGIT with rate_mills_per_piece = 26384 — a strictly lower per-piece cost for identical mail."

  - name: pro_rata_cost_allocation
    trigger: "On POST /commingle-batches/{id}/members, on DELETE /commingle-batches/{id}/members/{batch_member_id}, on the CommingleBatch REWORK -> OPEN recompute driven by POST /postage-statements/{id}/revise, and on POST /commingle-batches/{id}/sort, each with pool_cents = CommingleBatch.batch_postage_cents, writing BatchMember.share_basis_pct and BatchMember.allocated_postage_cents. MailJob.postage_due_cents is NOT written here; it is set only when verification accepts the statement. On POST /postage-statements/{id}/verify with outcome=ACCEPT and adjustment_cents > 0 with pool_cents = PostageStatement.adjustment_cents, writing BatchMember.allocated_adjustment_cents."
    algorithm: waterfall_allocation
    formula: |
      PINNED ROUNDING ORDER — the pool is rounded to whole cents FIRST by its
      producer, then split. Rounding each member's raw share half-up and summing is
      forbidden: it can drift from pool_cents by up to one cent per member.
      STEP 1  members = the batch's currently attached BatchMember rows
              denom   = sum(m.contributed_piece_count) == CommingleBatch.total_piece_count
      STEP 2  for each m: raw_m = pool_cents * m.contributed_piece_count / denom
                          (exact rational, NOT rounded here)
                          share_basis_pct_m = round_half_up(
                              m.contributed_piece_count * 100 / denom , 4 )
      STEP 3  base_m = floor(raw_m)
      STEP 4  remainder = pool_cents - sum(base_m)        # 0 <= remainder < len(members)
      STEP 5  distribution_order = members sorted by contributed_piece_count DESC,
                                   then created_at ASC
      STEP 6  the first `remainder` members in distribution_order each receive +1 cent
      STEP 7  allocated_m = base_m + (1 if m is among those, else 0)
      INVARIANT  sum(allocated_m) == pool_cents exactly, for every pool and every
                 member set.
    input_set: "Only BatchMember rows still attached to the batch at the moment the allocation runs; a member removed by DELETE before sortation is not allocated anything. denom is never zero because sortation requires member_job_count >= 1."
    constants: {}
    precision: "allocated_* are integers in cents (floor plus one-cent remainder units). share_basis_pct is a number with four decimal places, round_half_up. No random field participates: the distribution order is contributed_piece_count DESC then created_at ASC."

  - name: verification_adjustment
    trigger: "severity and surcharge_cents are computed on POST /postage-statements/{id}/findings. adjustment_cents and verified_postage_cents are computed on POST /postage-statements/{id}/verify with outcome=ACCEPT."
    algorithm: constraint_propagation
    formula: |
      This calculation looks circular — a surcharge is a rate applied to a share of
      the statement, and the statement total is what the surcharge changes. The
      evaluation order below is PINNED so the value is well defined.
      STEP 0  statement_piece_count and rate_mills_per_piece were FROZEN onto the
              PostageStatement when it was created. They are NEVER re-read from the
              CommingleBatch and NEVER reduced by affected pieces.
      STEP 1  findings = the statement's VerificationFinding rows ordered created_at ASC
              (which is exactly the order they were recorded in).
      STEP 2  walk findings in that order, carrying cumulative_affected starting at 0:
                cumulative_affected += f.affected_piece_count
                severity_f = MAJOR  if cumulative_affected * 10000
                                       >= statement.statement_piece_count * MAJOR_THRESHOLD_BP
                             else MINOR
                bp_f         = SEVERITY_SURCHARGE_BP[severity_f]
                surcharge_f  = round_half_up( f.affected_piece_count
                                              * statement.rate_mills_per_piece
                                              * bp_f / 10000000 )
              severity is therefore CUMULATIVE and ORDER-SENSITIVE: recording a
              120-piece finding then a 400-piece finding on a 3000-piece statement
              yields MINOR then MAJOR, while the reverse order yields MAJOR then
              MAJOR and a strictly larger adjustment. severity_f and surcharge_f are
              persisted on the VerificationFinding when it is recorded and are never
              recomputed afterwards.
      STEP 3  adjustment_cents = sum(f.surcharge_cents) over the same ordered walk
      STEP 4  verified_postage_cents = declared_postage_cents + adjustment_cents
      STEP 5  the presort tier is NOT re-derived from verified_postage_cents and
              statement_piece_count is NOT reduced. Doing either would make
              adjustment_cents depend on verified_postage_cents, which depends on
              adjustment_cents.
    input_set: "Every VerificationFinding attached to the statement, including findings recorded before an earlier RETURNED_FOR_CORRECTION only if they were recorded during the current SUBMITTED episode — POST /postage-statements/{id}/revise resets verification_error_count to 0 and findings recorded before that revise are historical and excluded from STEP 1."
    constants:
      MAJOR_THRESHOLD_BP: 500
      SEVERITY_SURCHARGE_BP: { MINOR: 2500, MAJOR: 10000 }
    precision: "surcharge_cents and adjustment_cents are integers in cents, round_half_up per finding, then summed. Summing the exact rationals and rounding once at the end is forbidden."

  - name: address_hygiene_metrics
    trigger: "On POST /mail-jobs/{id}/hygiene-runs, writing the AddressHygieneRun computed fields and mirroring them onto the MailJob."
    algorithm: aggregation
    formula: |
      run_index             = mail_job.hygiene_run_count  (value BEFORE this run is counted)
      net_piece_count       = submitted_piece_count - undeliverable_removed_count
      address_quality_pct   = round_half_up( cass_matched_count * 100
                                             / submitted_piece_count , 2 )
      move_update_compliant = ( move_update_age_days <= MOVE_UPDATE_MAX_AGE_DAYS )
      Mirrored onto the MailJob from the run with the HIGHEST run_index:
        MailJob.accepted_piece_count  = net_piece_count
        MailJob.address_quality_pct   = address_quality_pct
        MailJob.move_update_compliant = move_update_compliant
    input_set: "Exactly one AddressHygieneRun — the one being created. The mirror onto the MailJob always uses the highest run_index, so a later corrective run fully replaces an earlier one; earlier runs are retained as history and never averaged in."
    constants:
      MOVE_UPDATE_MAX_AGE_DAYS: 95
      MIN_ADDRESS_QUALITY_PCT: 95.00
    precision: "address_quality_pct is a number with two decimal places, round_half_up. move_update_compliant uses <= so exactly 95 days is compliant and 96 days is not."

  - name: container_qualification
    trigger: "On POST /commingle-batches/{id}/containers, writing SortContainer.qualifies, sequence_index, zone and committed_days."
    algorithm: threshold
    formula: |
      min_pieces = PALLET_MIN_PIECES                if container_type == PALLET
                   TRAY_MIN_PIECES_DEEP             if container_type == TRAY
                                                       and sort_level in {THREE_DIGIT, FIVE_DIGIT}
                   TRAY_MIN_PIECES_SHALLOW          if container_type == TRAY
                                                       and sort_level in {ADC, MIXED_ADC}
      qualifies      = ( piece_count >= min_pieces )
      sequence_index = the count of SortContainer rows already attached to this batch
                       (zero-based, assigned in creation order)
      placard_id     = null until sortation, then
                       "<entry facility facility_code>-<destination_zip3>-<sequence_index>"
    input_set: "The single SortContainer being created, plus the count of containers already on the batch for sequence_index."
    constants:
      TRAY_MIN_PIECES_DEEP: 150
      TRAY_MIN_PIECES_SHALLOW: 1
      PALLET_MIN_PIECES: 250
    precision: "Integer comparison with >=: a TRAY at FIVE_DIGIT holding exactly 150 pieces qualifies; 149 does not."

  - name: zone_and_service_commitment
    trigger: "On POST /commingle-batches/{id}/containers, writing SortContainer.zone and SortContainer.committed_days; copied onto ServiceLevelRecord at deposit."
    algorithm: threshold
    formula: |
      facility = the EntryFacility referenced by the container's CommingleBatch
      if container.destination_zip3 is an element of facility.served_zip3_list:
          if facility.facility_type == DDU : zone = 1 ; base_days = 1
          if facility.facility_type == SCF : zone = 2 ; base_days = 2
          if facility.facility_type == NDC : zone = 4 ; base_days = 3
      else:
          zone = 8 ; base_days = 5
      committed_days = base_days + CLASS_DAY_ADDER[ batch.mail_class ]
      on_time        = ( actual_delivery_days <= committed_days )   # set by the delivery scan
    input_set: "The container's destination_zip3 against the batch entry facility's served_zip3_list (exact string membership, no prefix logic), the facility_type, and the batch mail_class."
    constants:
      CLASS_DAY_ADDER: { FIRST_CLASS: 0, MARKETING_MAIL: 2, PERIODICALS: 1 }
    precision: "Integer days. on_time uses <= so delivering in exactly committed_days is on time."

  - name: client_service_level_index
    trigger: "Read-only on GET /clients/{id}/service-level; recomputed on every read from the current ServiceLevelRecord population."
    algorithm: weighted_scoring
    formula: |
      records = every ServiceLevelRecord r with r.actual_delivery_days IS NOT NULL whose
                SortContainer (r.sort_container_id) belongs to a CommingleBatch that has
                at least one BatchMember whose MailJob.client_id == {id}
      if records is empty:
          zone_weighted_index = null ; piece_weighted_index = null ; record_count = 0
      variant zone_weighted:
          num = sum( ZONE_WEIGHT[r.zone] * (1 if r.on_time else 0) )
          den = sum( ZONE_WEIGHT[r.zone] )
          zone_weighted_index = round_half_up( num * 100 / den , 2 )
      variant piece_weighted:
          num = sum( r.piece_count * (1 if r.on_time else 0) )
          den = sum( r.piece_count )
          piece_weighted_index = round_half_up( num * 100 / den , 2 )
      on_time_count = count of records with on_time == true
    input_set: "Only ServiceLevelRecords that have been delivery-scanned (actual_delivery_days IS NOT NULL); unscanned records are excluded from both numerator and denominator. Records are reached through SortContainer -> CommingleBatch -> BatchMember -> MailJob.client_id, so a commingled container counts once for every client with mail in that batch."
    constants:
      ZONE_WEIGHT: { 1: 1, 2: 2, 4: 3, 8: 5 }
    precision: "Both indexes are numbers with two decimal places, round_half_up."
    variants:
      - name: zone_weighted
        when: "Reported as zone_weighted_index — the bureau's contractual service metric, which weights distant entry zones more heavily."
        difference: "Weights each record by ZONE_WEIGHT[zone], so one late zone-8 container of 2000 pieces alongside one on-time zone-2 container of 1000 pieces yields 28.57."
      - name: piece_weighted
        when: "Reported as piece_weighted_index — the volume-fair metric shown to the client."
        difference: "Weights each record by piece_count, so the identical two records yield 33.33 — a different number from identical inputs."

  - name: client_invoice_charges
    trigger: "On POST /clients/{id}/invoices, writing every computed field of the ClientInvoice."
    algorithm: tiered_pricing
    formula: |
      STEP 1  selected = MailJob rows with client_id == {id}
                         AND status == MAILED
                         AND period_start_utc <= mailed_at_utc <= period_end_utc
                         (CLOSED interval on both ends), ordered created_at ASC
      STEP 2  if selected is empty -> reject with ERR_NO_BILLABLE_JOBS
      STEP 3  member_j = the BatchMember row whose mail_job_id == j.id (exactly one per
              selected job, because a job only reaches MAILED through a sorted batch)
              postage_cents      = sum( member_j.allocated_postage_cents )
              adjustment_cents   = sum( member_j.allocated_adjustment_cents )
              billed_piece_count = sum( j.accepted_piece_count )
              included_job_count = count( selected )
      STEP 4  thousands = ceil( billed_piece_count / 1000 )
      STEP 5  volume_discount_bp = 0     if billed_piece_count < 5000
                                   500   if 5000 <= billed_piece_count < 25000
                                   1200  if billed_piece_count >= 25000
      STEP 6  gross_fee_cents = thousands * client.service_fee_rate_per_thousand_cents
      STEP 7  discounted_fee_cents = round_half_up(
                  gross_fee_cents * (10000 - volume_discount_bp) / 10000 )
      STEP 8  service_fee_cents = max( MIN_SERVICE_FEE_CENTS , discounted_fee_cents )
      STEP 9  total_cents = postage_cents + adjustment_cents + service_fee_cents
      The three inputs billed_piece_count, service_fee_rate_per_thousand_cents and
      volume_discount_bp interact non-linearly: the ceil in STEP 4 is applied before
      the tier factor in STEP 7, and the MIN floor in STEP 8 is applied after it, so a
      small mailing can pay the floor while a large one pays the discounted rate.
    input_set: "Only MailJobs in MAILED whose mailed_at_utc lies in the closed billing period. Jobs already BILLED are excluded because their status is no longer MAILED, which is what makes the invoice idempotent against re-issue over the same jobs."
    constants:
      MIN_SERVICE_FEE_CENTS: 2500
      VOLUME_DISCOUNT_TIERS: "[ (0, 0), (5000, 500), (25000, 1200) ] as (min_billed_pieces, discount_bp), highest satisfied min wins"
    precision: "All money is integer cents. STEP 7 is the only rounding step, round_half_up. thousands is a ceiling on an integer division."

  - name: dock_capacity_occupancy
    trigger: "On POST /drop-shipments, before the appointment is created."
    algorithm: interval_merge
    formula: |
      candidates = DropShipment s with s.entry_facility_id == request.entry_facility_id
                   AND s.status IN {SCHEDULED, IN_TRANSIT}
      overlaps   = { s in candidates :
                       s.window_start_utc <  request.window_end_utc
                       AND request.window_start_utc <  s.window_end_utc }
                   # HALF-OPEN [start, end) geometry: touching endpoints do NOT overlap
      occupied_pallets = sum( s.pallet_count for s in overlaps )
      reject with ERR_DOCK_CAPACITY_EXCEEDED iff
          occupied_pallets + request.pallet_count
              > facility.dock_capacity_pallets_per_slot
      This is AGGREGATE-CAPACITY geometry: any number of shipments may share a window
      as long as their pallets sum within capacity, and a shipment starting exactly
      when another ends is never a conflict at all.
    input_set: "Only DropShipments in SCHEDULED or IN_TRANSIT on the same facility. CANCELLED, NO_SHOW and DEPOSITED shipments release their pallets and are excluded."
    constants: {}
    precision: "Integer pallet counts. The comparison is strict (>), so occupied_pallets + request.pallet_count exactly equal to capacity is accepted."

  - name: billing_period_exclusivity
    trigger: "On POST /clients/{id}/invoices, before client_invoice_charges runs."
    algorithm: interval_merge
    formula: |
      existing = ClientInvoice i with i.client_id == {id}
                 AND i.status IN {ISSUED, PAID}
      conflict iff EXISTS i :  request.period_start_utc <= i.period_end_utc
                               AND i.period_start_utc <= request.period_end_utc
                   # CLOSED [start, end] geometry: touching endpoints DO conflict
      reject with ERR_BILLING_PERIOD_OVERLAP on the first conflict found when
      scanning existing invoices in created_at ASC order.
      This is PAIRWISE-EXCLUSIVE geometry with zero capacity: unlike the dock rule
      there is no aggregate allowance, and unlike the dock rule adjacency is a
      conflict — a new period starting exactly on a prior period's end instant is
      rejected because that instant would be billed twice.
    input_set: "All ISSUED and PAID invoices of this client; no other client's invoices participate."
    constants: {}
    precision: "Instant comparison at millisecond resolution on ISO 8601 UTC values with three fractional digits."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST violated rule determines the error returned)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (a header consisting only of whitespace counts as absent)."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles and that role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body parses, contains every required field for the endpoint, every field has the declared type, and every enum field holds a declared member. Unknown fields are rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path id resolves to an existing row, validated left to right: client_id -> ERR_CLIENT_NOT_FOUND, permit_account_id -> ERR_PERMIT_ACCOUNT_NOT_FOUND, mail_job_id -> ERR_MAIL_JOB_NOT_FOUND, commingle_batch_id -> ERR_BATCH_NOT_FOUND, batch_member_id -> ERR_BATCH_MEMBER_NOT_FOUND, sort_container_id -> ERR_CONTAINER_NOT_FOUND, entry_facility_id -> ERR_ENTRY_FACILITY_NOT_FOUND, postage_statement_id -> ERR_STATEMENT_NOT_FOUND, drop_shipment_id -> ERR_DROP_SHIPMENT_NOT_FOUND, service_level_record_id -> ERR_SERVICE_LEVEL_RECORD_NOT_FOUND, client_invoice_id -> ERR_INVOICE_NOT_FOUND."
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input: client_id, permit_account_id, entry_facility_id, commingle_batch_id, mail_job_id."
    error_id: ERR_MAIL_JOB_NOT_FOUND
    http_status: 404
    applies_to: "POST /permit-accounts, POST /mail-jobs, POST /commingle-batches, POST /commingle-batches/{id}/members, POST /drop-shipments, POST /postage-statements"

  - priority: 6
    category: existence
    check: "A path-nested child actually belongs to its path parent: the BatchMember's commingle_batch_id equals the path commingle_batch_id."
    error_id: ERR_BATCH_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "DELETE /commingle-batches/{id}/members/{batch_member_id}"

  - priority: 7
    category: auth
    check: "When X-User-Role is ClientContact, X-User-ID equals the Client.id being read or written — directly for /clients/{id}/... paths, or through MailJob.client_id for job paths and through the request body client_id on POST /mail-jobs."
    error_id: ERR_CLIENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /clients/{id}, GET /clients/{id}/mail-jobs, GET /clients/{id}/permit-accounts, GET /clients/{id}/invoices, GET /clients/{id}/service-level, GET /mail-jobs/{id}, GET /mail-jobs/{id}/postage-estimate, GET /mail-jobs/{id}/hygiene-runs, POST /mail-jobs"

  - priority: 8
    category: business_referential
    check: "The PermitAccount named by permit_account_id has client_id equal to the request's client_id (a client may never file under another client's permit)."
    error_id: ERR_PERMIT_CLIENT_MISMATCH
    http_status: 422
    applies_to: "POST /mail-jobs"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: on verification, the acting X-User-ID differs from the PostageStatement.submitted_by_user_id. The same human may not both file and accept a statement."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /postage-statements/{id}/verify, POST /postage-statements/{id}/findings"

  - priority: 10
    category: state
    check: "The target MailJob is in a state the operation allows. On pooling: status == POOLED yields ERR_JOB_ALREADY_POOLED, any other status that is not HYGIENE_CLEARED yields ERR_INVALID_JOB_STATE. On hygiene-runs: status must be RECEIVED or HYGIENE_CLEARED. On cancel: status must be RECEIVED or HYGIENE_CLEARED."
    error_id: ERR_INVALID_JOB_STATE
    http_status: 409
    applies_to: "POST /mail-jobs/{id}/hygiene-runs, POST /mail-jobs/{id}/cancel, POST /commingle-batches/{id}/members"

  - priority: 11
    category: state
    check: "The referenced MailJob already has a BatchMember, i.e. its status is POOLED."
    error_id: ERR_JOB_ALREADY_POOLED
    http_status: 409
    applies_to: "POST /commingle-batches/{id}/members"

  - priority: 12
    category: state
    check: "The target CommingleBatch is in a state the operation allows: OPEN for member add/remove, container add and sort; SORTED for statement creation; OPEN, SORTED or DOCUMENTED for drop-shipment scheduling; DOCUMENTED for deposit."
    error_id: ERR_INVALID_BATCH_STATE
    http_status: 409
    applies_to: "POST /commingle-batches/{id}/members, DELETE /commingle-batches/{id}/members/{batch_member_id}, POST /commingle-batches/{id}/containers, POST /commingle-batches/{id}/sort, POST /postage-statements, POST /drop-shipments, POST /drop-shipments/{id}/deposit"

  - priority: 13
    category: state
    check: "The target PostageStatement is in a state the operation allows: DRAFT for submit and void; SUBMITTED for findings, verify and void; RETURNED_FOR_CORRECTION for revise."
    error_id: ERR_INVALID_STATEMENT_STATE
    http_status: 409
    applies_to: "POST /postage-statements/{id}/submit, POST /postage-statements/{id}/findings, POST /postage-statements/{id}/verify, POST /postage-statements/{id}/void, POST /postage-statements/{id}/revise"

  - priority: 14
    category: state
    check: "The target DropShipment is in a state the operation allows: SCHEDULED for depart, IN_TRANSIT for deposit, SCHEDULED or IN_TRANSIT for cancel."
    error_id: ERR_INVALID_SHIPMENT_STATE
    http_status: 409
    applies_to: "POST /drop-shipments/{id}/depart, POST /drop-shipments/{id}/deposit, POST /drop-shipments/{id}/cancel"

  - priority: 15
    category: state
    check: "The target ClientInvoice is in ISSUED; a PAID invoice cannot be paid again."
    error_id: ERR_INVALID_INVOICE_STATE
    http_status: 409
    applies_to: "POST /client-invoices/{id}/payment"

  - priority: 16
    category: state
    check: "Optimistic concurrency: expected_permit_account_version equals the PermitAccount's current version."
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
    applies_to: "POST /permit-accounts/{id}/funding"

  - priority: 17
    category: state
    check: "Optimistic concurrency: expected_batch_version equals the CommingleBatch's current version."
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    applies_to: "POST /postage-statements"

  - priority: 18
    category: state
    check: "Cross-entity: the Client that owns the target resource is ACTIVE. Checked against MailJob.client_id on job creation, hygiene runs and pooling, and against the path client_id on invoice issue."
    error_id: ERR_CLIENT_SUSPENDED
    http_status: 409
    applies_to: "POST /mail-jobs, POST /mail-jobs/{id}/hygiene-runs, POST /commingle-batches/{id}/members, POST /clients/{id}/invoices"

  - priority: 19
    category: state
    check: "Cross-entity: the PermitAccount funding the operation has status == ACTIVE (HOLD and CLOSED both refuse). Reached through MailJob.permit_account_id on job creation, hygiene runs and pooling, and through PostageStatement.permit_account_id on submit."
    error_id: ERR_PERMIT_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /mail-jobs, POST /mail-jobs/{id}/hygiene-runs, POST /commingle-batches/{id}/members, POST /postage-statements/{id}/submit, POST /permit-accounts/{id}/funding"

  - priority: 20
    category: state
    check: "Cross-entity: the EntryFacility being booked has status == OPEN."
    error_id: ERR_ENTRY_FACILITY_CLOSED
    http_status: 409
    applies_to: "POST /drop-shipments"

  - priority: 21
    category: state
    check: "Cross-entity: the CommingleBatch of the shipment being deposited has a PostageStatement in ACCEPTED_CLEAN or ACCEPTED_WITH_ADJUSTMENT."
    error_id: ERR_STATEMENT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /drop-shipments/{id}/deposit"

  - priority: 22
    category: business_safety
    check: "Regulatory: the PermitAccount's annual_fee_paid_through_utc is greater than or equal to the current logical clock."
    error_id: ERR_PERMIT_ANNUAL_FEE_LAPSED
    http_status: 409
    applies_to: "POST /mail-jobs, POST /mail-jobs/{id}/hygiene-runs, POST /postage-statements/{id}/submit"

  - priority: 23
    category: business_safety
    check: "Move update currency: the job's move_update_compliant is true, i.e. the highest-run_index AddressHygieneRun used move-update data no older than MOVE_UPDATE_MAX_AGE_DAYS (95) days."
    error_id: ERR_MOVE_UPDATE_STALE
    http_status: 422
    applies_to: "POST /commingle-batches/{id}/members"

  - priority: 24
    category: business_safety
    check: "Address hygiene floor: the job's address_quality_pct is greater than or equal to MIN_ADDRESS_QUALITY_PCT (95.00)."
    error_id: ERR_ADDRESS_QUALITY_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /commingle-batches/{id}/members"

  - priority: 25
    category: business_referential
    check: "The job's mail_class equals the batch's mail_class."
    error_id: ERR_MAIL_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /commingle-batches/{id}/members"

  - priority: 26
    category: business_referential
    check: "The job's processing_category equals the batch's processing_category."
    error_id: ERR_PROCESSING_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /commingle-batches/{id}/members"

  - priority: 27
    category: business_referential
    check: "The job's Client has commingle_opt_in == true."
    error_id: ERR_COMMINGLE_OPT_OUT
    http_status: 422
    applies_to: "POST /commingle-batches/{id}/members"

  - priority: 28
    category: business_constraint
    check: "Uniqueness: client_code is not already held by another Client."
    error_id: ERR_DUPLICATE_CLIENT_CODE
    http_status: 409
    applies_to: "POST /clients"

  - priority: 29
    category: business_constraint
    check: "Uniqueness: permit_number is not already held by another PermitAccount."
    error_id: ERR_DUPLICATE_PERMIT_NUMBER
    http_status: 409
    applies_to: "POST /permit-accounts"

  - priority: 30
    category: business_constraint
    check: "Uniqueness: facility_code is not already held by another EntryFacility."
    error_id: ERR_DUPLICATE_FACILITY_CODE
    http_status: 409
    applies_to: "POST /entry-facilities"

  - priority: 31
    category: business_constraint
    check: "Piece and pallet arithmetic: declared_piece_count >= 1; container piece_count >= 1; pallet_count >= 1; funding amount_cents >= 1; hygiene submitted_piece_count >= 1 with cass_matched_count <= submitted_piece_count, ncoa_move_updated_count <= submitted_piece_count and undeliverable_removed_count < submitted_piece_count; finding affected_piece_count between 1 and the statement's frozen statement_piece_count inclusive."
    error_id: ERR_INVALID_PIECE_COUNT
    http_status: 400
    applies_to: "POST /mail-jobs, POST /mail-jobs/{id}/hygiene-runs, POST /commingle-batches/{id}/containers, POST /drop-shipments, POST /permit-accounts/{id}/funding, POST /postage-statements/{id}/findings"

  - priority: 32
    category: business_constraint
    check: "Empty-collection gate: the batch has at least one SortContainer (container_count >= 1) and at least one BatchMember (member_job_count >= 1)."
    error_id: ERR_BATCH_HAS_NO_CONTAINERS
    http_status: 422
    applies_to: "POST /commingle-batches/{id}/sort"

  - priority: 33
    category: business_constraint
    check: "Every SortContainer attached to the batch has qualifies == true."
    error_id: ERR_CONTAINER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /commingle-batches/{id}/sort"

  - priority: 34
    category: business_constraint
    check: "The sum of SortContainer.piece_count over the batch equals CommingleBatch.total_piece_count."
    error_id: ERR_CONTAINER_PIECE_MISMATCH
    http_status: 422
    applies_to: "POST /commingle-batches/{id}/sort"

  - priority: 35
    category: business_constraint
    check: "At most one DropShipment per CommingleBatch may be in SCHEDULED or IN_TRANSIT."
    error_id: ERR_SHIPMENT_ALREADY_SCHEDULED
    http_status: 409
    applies_to: "POST /drop-shipments"

  - priority: 36
    category: business_constraint
    check: "A ServiceLevelRecord may be delivery-scanned only once: actual_delivery_days is null before the scan."
    error_id: ERR_DELIVERY_ALREADY_SCANNED
    http_status: 409
    applies_to: "POST /service-level-records/{id}/delivery-scan"

  - priority: 37
    category: business_temporal
    check: "Interval well-formedness: window_end_utc is strictly after window_start_utc; period_end_utc is strictly after period_start_utc."
    error_id: ERR_INTERVAL_INVALID
    http_status: 400
    applies_to: "POST /drop-shipments, POST /clients/{id}/invoices"

  - priority: 38
    category: business_temporal
    check: "window_start_utc is greater than or equal to the current logical clock; appointments may not be booked into the past."
    error_id: ERR_SHIPMENT_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /drop-shipments"

  - priority: 39
    category: business_temporal
    check: "Dock aggregate capacity over half-open overlapping windows per dock_capacity_occupancy: occupied_pallets + pallet_count must not exceed the facility's dock_capacity_pallets_per_slot."
    error_id: ERR_DOCK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /drop-shipments"

  - priority: 40
    category: business_temporal
    check: "The deposit happens inside the appointment window: window_start_utc <= logical clock now <= window_end_utc."
    error_id: ERR_OUTSIDE_APPOINTMENT_WINDOW
    http_status: 422
    applies_to: "POST /drop-shipments/{id}/deposit"

  - priority: 41
    category: business_temporal
    check: "Closed-interval billing-period exclusivity per billing_period_exclusivity: the requested period must not touch or overlap any ISSUED or PAID invoice period of the same client."
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /clients/{id}/invoices"

  - priority: 42
    category: business_constraint
    check: "A returned statement may only be returned when at least one VerificationFinding has been recorded: verification_error_count >= 1 for outcome=RETURN."
    error_id: ERR_NO_VERIFICATION_FINDINGS
    http_status: 422
    applies_to: "POST /postage-statements/{id}/verify"

  - priority: 43
    category: business_constraint
    check: "The invoice covers at least one billable job per client_invoice_charges STEP 2."
    error_id: ERR_NO_BILLABLE_JOBS
    http_status: 422
    applies_to: "POST /clients/{id}/invoices"

  - priority: 44
    category: business_constraint
    check: "The payment amount_cents equals the invoice total_cents exactly."
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /client-invoices/{id}/payment"

  - priority: 45
    category: business_constraint
    check: "A PermitAccount may only be CLOSED when reserved_cents == 0."
    error_id: ERR_PERMIT_HAS_RESERVED_FUNDS
    http_status: 409
    applies_to: "POST /permit-accounts/{id}/status"

  - priority: 46
    category: business_fiscal
    check: "Postage funding sufficiency, evaluated LAST: on submit, PermitAccount.balance_cents >= PostageStatement.declared_postage_cents; on verify with outcome=ACCEPT and adjustment_cents > 0, PermitAccount.balance_cents >= adjustment_cents."
    error_id: ERR_INSUFFICIENT_POSTAGE_BALANCE
    http_status: 402
    applies_to: "POST /postage-statements/{id}/submit, POST /postage-statements/{id}/verify"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- Clients ---
  - method: POST
    path: "/clients"
    description: "Register a mail owner (client) of the presort bureau, with its per-thousand service fee rate and commingling preference."
    roles: [BureauAdmin]
    code: 201
    input: ["name", "client_code", "service_fee_rate_per_thousand_cents", "billing_terms?", "commingle_opt_in?"]
    output: Client
    side_effects: ["status initialised to ACTIVE", "unbilled_postage_cents and lifetime_pieces_mailed initialised to 0", "billing_terms defaults to NET_30 and commingle_opt_in defaults to true when omitted"]

  - method: GET
    path: "/clients/{id}"
    description: "Read one client, including its running unbilled_postage_cents ledger and lifetime_pieces_mailed counter."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk, ClientContact]
    code: 200
    output: Client

  - method: POST
    path: "/clients/{id}/status"
    description: "Suspend or reinstate a client. Suspension blocks new job intake, hygiene runs and pooling for that client."
    roles: [BureauAdmin]
    code: 200
    input: ["status", "reason?"]
    output: Client
    side_effects: ["sets suspension_reason on SUSPENDED and clears it on ACTIVE", "increments Client.version by 1"]

  - method: GET
    path: "/clients/{id}/permit-accounts"
    description: "List the permit accounts belonging to one client (reverse lookup for PermitAccount.client_id)."
    roles: [BureauAdmin, PostageManager, ClientContact]
    code: 200
    output: PermitAccount[]

  - method: GET
    path: "/clients/{id}/mail-jobs"
    description: "List the mail jobs belonging to one client (reverse lookup for MailJob.client_id)."
    roles: [BureauAdmin, PostageManager, PresortOperator, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: MailJob[]

  - method: GET
    path: "/clients/{id}/invoices"
    description: "List the invoices issued to one client (reverse lookup for ClientInvoice.client_id)."
    roles: [BureauAdmin, PostageManager, ClientContact]
    code: 200
    output: ClientInvoice[]

  - method: POST
    path: "/clients/{id}/invoices"
    description: "Issue an invoice for one client covering a closed billing period: postage plus verification adjustments plus the volume-tiered service fee, per client_invoice_charges."
    roles: [PostageManager]
    code: 201
    input: ["period_start_utc", "period_end_utc"]
    output: ClientInvoice
    side_effects: ["runs billing_period_exclusivity against the client's existing invoice periods", "runs client_invoice_charges to derive billed_piece_count, postage_cents, adjustment_cents, service_fee_cents and total_cents", "transitions every included MailJob from MAILED to BILLED", "decreases Client.unbilled_postage_cents by the invoiced postage_cents plus adjustment_cents", "status initialised to ISSUED and paid_amount_cents to 0"]

  - method: GET
    path: "/clients/{id}/service-level"
    description: "Computed read: the client's two service-level indices over its scanned ServiceLevelRecords, per client_service_level_index."
    roles: [BureauAdmin, PostageManager, ClientContact]
    code: 200
    output: "{ zone_weighted_index: number, piece_weighted_index: number, record_count: integer, on_time_count: integer }"

  # -------------------------------------------------------- Permit accounts ---
  - method: POST
    path: "/permit-accounts"
    description: "Open a postage permit account for a client under a chosen payment method."
    roles: [PostageManager]
    code: 201
    input: ["client_id", "permit_number", "payment_method", "annual_fee_paid_through_utc"]
    output: PermitAccount
    side_effects: ["status initialised to ACTIVE", "balance_cents and reserved_cents initialised to 0"]

  - method: GET
    path: "/permit-accounts/{id}"
    description: "Read one permit account, including balance_cents, reserved_cents and version for optimistic concurrency."
    roles: [BureauAdmin, PostageManager, AcceptanceClerk, ClientContact]
    code: 200
    output: PermitAccount

  - method: POST
    path: "/permit-accounts/{id}/funding"
    description: "Deposit postage funds into a permit account. Guarded by optimistic concurrency on expected_permit_account_version."
    roles: [PostageManager]
    code: 200
    input: ["amount_cents", "expected_permit_account_version", "reference?"]
    output: PermitAccount
    side_effects: ["increases balance_cents by amount_cents", "leaves reserved_cents unchanged, preserving the permit_total_funds_cents invariant", "increments PermitAccount.version by 1"]

  - method: POST
    path: "/permit-accounts/{id}/status"
    description: "Place a permit account on HOLD, reinstate it, or close it. Closing requires reserved_cents to be zero."
    roles: [PostageManager]
    code: 200
    input: ["status", "reason?"]
    output: PermitAccount
    side_effects: ["increments PermitAccount.version by 1"]

  - method: GET
    path: "/permit-accounts/{id}/postage-statements"
    description: "List the postage statements filed against one permit account (reverse lookup for PostageStatement.permit_account_id)."
    roles: [BureauAdmin, PostageManager, AcceptanceClerk]
    code: 200
    output: PostageStatement[]

  # -------------------------------------------------------------- Mail jobs ---
  - method: POST
    path: "/mail-jobs"
    description: "Accept a client mail job into the bureau with declared piece count, mail class, processing category and per-piece weight."
    roles: [PresortOperator, ClientContact]
    code: 201
    input: ["client_id", "permit_account_id", "mail_class", "processing_category", "declared_piece_count", "declared_weight_oz_per_piece"]
    output: MailJob
    side_effects: ["status initialised to RECEIVED", "accepted_piece_count initialised to declared_piece_count", "hygiene_run_count and rework_count initialised to 0; address_quality_pct and postage_due_cents initialised to 0; move_update_compliant initialised to false", "commingle_batch_id initialised to null"]

  - method: GET
    path: "/mail-jobs/{id}"
    description: "Read one mail job, including its post-hygiene accepted_piece_count and its allocated postage_due_cents."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk, ClientContact]
    code: 200
    output: MailJob

  - method: GET
    path: "/mail-jobs"
    description: "Filtered, paginated list of mail jobs (reverse lookup for MailJob.permit_account_id and MailJob.commingle_batch_id)."
    roles: [BureauAdmin, PostageManager, PresortOperator]
    code: 200
    input: ["client_id?", "permit_account_id?", "commingle_batch_id?", "status?", "limit?", "offset?"]
    output: MailJob[]

  - method: POST
    path: "/mail-jobs/{id}/hygiene-runs"
    description: "Record an address hygiene, standardization and move-update pass over the job's list, per address_hygiene_metrics."
    roles: [PresortOperator]
    code: 201
    input: ["submitted_piece_count", "cass_matched_count", "ncoa_move_updated_count", "undeliverable_removed_count", "move_update_age_days"]
    output: AddressHygieneRun
    side_effects: ["runs address_hygiene_metrics to derive net_piece_count, address_quality_pct and move_update_compliant", "assigns run_index as the job's hygiene_run_count BEFORE this run (zero-based, so the first run carries run_index 0) and then increments MailJob.hygiene_run_count by 1", "copies net_piece_count into MailJob.accepted_piece_count and copies address_quality_pct and move_update_compliant onto the job", "transitions MailJob from RECEIVED to HYGIENE_CLEARED, or leaves it in HYGIENE_CLEARED on a re-run", "increments MailJob.version by 1"]

  - method: GET
    path: "/mail-jobs/{id}/hygiene-runs"
    description: "List the hygiene runs recorded for one job in run_index order (reverse lookup for AddressHygieneRun.mail_job_id)."
    roles: [BureauAdmin, PresortOperator, AcceptanceClerk, ClientContact]
    code: 200
    output: AddressHygieneRun[]

  - method: GET
    path: "/mail-jobs/{id}/batch-memberships"
    description: "List the commingle memberships this job holds, with its allocated postage share (reverse lookup for BatchMember.mail_job_id)."
    roles: [BureauAdmin, PostageManager, PresortOperator, ClientContact]
    code: 200
    output: BatchMember[]

  - method: POST
    path: "/mail-jobs/{id}/cancel"
    description: "Cancel a mail job that has not yet been pooled into a commingle batch."
    roles: [PresortOperator, BureauAdmin]
    code: 200
    input: ["reason"]
    output: MailJob
    side_effects: ["sets cancel_reason", "increments MailJob.version by 1"]

  - method: GET
    path: "/mail-jobs/{id}/postage-estimate"
    description: "Computed read: what this job would pay standing alone, using the job_standalone variant of commingled_postage_assessment."
    roles: [BureauAdmin, PostageManager, PresortOperator, ClientContact]
    code: 200
    output: "{ piece_count: integer, standalone_tier: string, standalone_rate_mills_per_piece: integer, standalone_postage_cents: integer }"

  # ------------------------------------------------------- Entry facilities ---
  - method: POST
    path: "/entry-facilities"
    description: "Register a postal entry point (DDU, SCF or NDC) with its dock capacity per appointment slot, drop-ship discount and served ZIP3 list."
    roles: [BureauAdmin]
    code: 201
    input: ["facility_code", "facility_type", "zip3", "dock_capacity_pallets_per_slot", "drop_ship_discount_bp", "served_zip3_list"]
    output: EntryFacility
    side_effects: ["status initialised to OPEN"]

  - method: GET
    path: "/entry-facilities/{id}"
    description: "Read one entry facility, including its dock capacity and drop-ship discount in basis points."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk]
    code: 200
    output: EntryFacility

  - method: POST
    path: "/entry-facilities/{id}/status"
    description: "Open or close an entry facility. A CLOSED facility refuses new drop-shipment appointments."
    roles: [BureauAdmin]
    code: 200
    input: ["status"]
    output: EntryFacility
    side_effects: ["increments EntryFacility.version by 1"]

  - method: GET
    path: "/entry-facilities/{id}/drop-shipments"
    description: "List the drop shipments booked at one facility (reverse lookup for DropShipment.entry_facility_id)."
    roles: [BureauAdmin, PresortOperator, AcceptanceClerk]
    code: 200
    output: DropShipment[]

  # ------------------------------------------------------- Commingle batches ---
  - method: POST
    path: "/commingle-batches"
    description: "Open a commingling pool for one mail class and processing category, destined for one entry facility."
    roles: [PresortOperator]
    code: 201
    input: ["mail_class", "processing_category", "entry_facility_id"]
    output: CommingleBatch
    side_effects: ["status initialised to OPEN", "member_job_count, total_piece_count, container_count, rate_mills_per_piece and batch_postage_cents initialised to 0", "achieved_tier initialised to NONE"]

  - method: GET
    path: "/commingle-batches/{id}"
    description: "Read one commingle batch, including its achieved_tier, rate_mills_per_piece, batch_postage_cents and version for optimistic concurrency."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk]
    code: 200
    output: CommingleBatch

  - method: GET
    path: "/commingle-batches"
    description: "Filtered, paginated list of commingle batches (reverse lookup for CommingleBatch.entry_facility_id)."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk]
    code: 200
    input: ["status?", "mail_class?", "entry_facility_id?", "limit?", "offset?"]
    output: CommingleBatch[]

  - method: POST
    path: "/commingle-batches/{id}/members"
    description: "Pool one hygiene-cleared mail job into the batch so its pieces count toward a deeper presort discount tier."
    roles: [PresortOperator]
    code: 201
    input: ["mail_job_id"]
    output: BatchMember
    side_effects: ["copies the job's accepted_piece_count into contributed_piece_count", "increments CommingleBatch.member_job_count by 1 and increases total_piece_count by contributed_piece_count", "re-runs presort_tier_qualification, then the batch_commingled variant of commingled_postage_assessment, refreshing achieved_tier, rate_mills_per_piece and batch_postage_cents", "re-runs pro_rata_cost_allocation over all members, refreshing every member's share_basis_pct and allocated_postage_cents", "transitions the MailJob from HYGIENE_CLEARED to POOLED and sets its commingle_batch_id", "increments CommingleBatch.version and MailJob.version by 1"]

  - method: GET
    path: "/commingle-batches/{id}/members"
    description: "List the pooled jobs of one batch with their pro-rata postage shares (reverse lookup for BatchMember.commingle_batch_id)."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk]
    code: 200
    output: BatchMember[]

  - method: DELETE
    path: "/commingle-batches/{id}/members/{batch_member_id}"
    description: "Withdraw a pooled job from an OPEN batch, reversing every ledger effect of the original pooling."
    roles: [PresortOperator]
    code: 204
    output: null
    side_effects: ["decrements CommingleBatch.member_job_count by 1 and decreases total_piece_count by the member's contributed_piece_count, restoring the batch piece ledger", "re-runs presort_tier_qualification and the batch_commingled variant of commingled_postage_assessment", "re-runs pro_rata_cost_allocation over the remaining members", "transitions the MailJob from POOLED back to HYGIENE_CLEARED, clears its commingle_batch_id and resets its postage_due_cents to 0", "increments CommingleBatch.version and MailJob.version by 1"]

  - method: POST
    path: "/commingle-batches/{id}/containers"
    description: "Add a qualifying tray or pallet to the batch at a declared sort level and destination ZIP3, per container_qualification and zone_and_service_commitment."
    roles: [PresortOperator]
    code: 201
    input: ["container_type", "destination_zip3", "sort_level", "piece_count"]
    output: SortContainer
    side_effects: ["runs container_qualification to derive qualifies", "runs zone_and_service_commitment to derive zone and committed_days", "assigns sequence_index as the batch's container_count BEFORE this container (zero-based) and then increments CommingleBatch.container_count by 1", "placard_id initialised to null; it is only stamped at sortation", "status initialised to STAGED", "increments CommingleBatch.version by 1"]

  - method: GET
    path: "/commingle-batches/{id}/containers"
    description: "List the trays and pallets of one batch in sequence_index order (reverse lookup for SortContainer.commingle_batch_id)."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk]
    code: 200
    output: SortContainer[]

  - method: POST
    path: "/commingle-batches/{id}/sort"
    description: "Close sortation and generate container documentation for the batch, freezing the tier and rate for statement preparation."
    roles: [PresortOperator]
    code: 200
    output: CommingleBatch
    side_effects: ["transitions CommingleBatch from OPEN to SORTED", "freezes achieved_tier and rate_mills_per_piece via presort_tier_qualification and the batch_commingled variant of commingled_postage_assessment, and writes batch_postage_cents", "runs pro_rata_cost_allocation with pool_cents = batch_postage_cents, writing every BatchMember.share_basis_pct and allocated_postage_cents (MailJob.postage_due_cents stays 0 until verification acceptance)", "transitions every member MailJob POOLED -> PRESORTED", "transitions every SortContainer of the batch from STAGED to DOCUMENTED and stamps each placard_id as '<facility_code>-<destination_zip3>-<sequence_index>'", "increments CommingleBatch.version by 1"]

  - method: GET
    path: "/commingle-batches/{id}/postage-statements"
    description: "List the postage statements prepared for one batch, including superseded revisions (reverse lookup for PostageStatement.commingle_batch_id)."
    roles: [BureauAdmin, PostageManager, AcceptanceClerk]
    code: 200
    output: PostageStatement[]

  - method: GET
    path: "/commingle-batches/{id}/drop-shipments"
    description: "List the drop shipments booked for one batch (reverse lookup for DropShipment.commingle_batch_id)."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk]
    code: 200
    output: DropShipment[]

  # -------------------------------------------------------- Sort containers ---
  - method: GET
    path: "/sort-containers/{id}"
    description: "Read one tray or pallet with its qualification verdict, zone and committed delivery days."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk]
    code: 200
    output: SortContainer

  - method: GET
    path: "/sort-containers/{id}/service-level-records"
    description: "List the service-level records opened for one container at deposit (reverse lookup for ServiceLevelRecord.sort_container_id)."
    roles: [BureauAdmin, PostageManager, AcceptanceClerk]
    code: 200
    output: ServiceLevelRecord[]

  # --------------------------------------------------------- Drop shipments ---
  - method: POST
    path: "/drop-shipments"
    description: "Book a dock appointment to enter a documented batch at a facility inside a half-open time window, per dock_capacity_occupancy."
    roles: [PresortOperator]
    code: 201
    input: ["commingle_batch_id", "entry_facility_id", "window_start_utc", "window_end_utc", "pallet_count"]
    output: DropShipment
    side_effects: ["runs dock_capacity_occupancy over the facility's SCHEDULED and IN_TRANSIT shipments", "status initialised to SCHEDULED"]

  - method: GET
    path: "/drop-shipments/{id}"
    description: "Read one drop-shipment appointment with its window, pallet count and status."
    roles: [BureauAdmin, PostageManager, PresortOperator, AcceptanceClerk]
    code: 200
    output: DropShipment

  - method: POST
    path: "/drop-shipments/{id}/depart"
    description: "Dispatch the scheduled load from the bureau toward the entry facility."
    roles: [PresortOperator]
    code: 200
    output: DropShipment
    side_effects: ["transitions DropShipment from SCHEDULED to IN_TRANSIT", "increments DropShipment.version by 1"]

  - method: POST
    path: "/drop-shipments/{id}/deposit"
    description: "Record acceptance-unit deposit of the load inside its appointment window, closing the batch and starting service-level clocks."
    roles: [AcceptanceClerk]
    code: 200
    output: DropShipment
    side_effects: ["transitions DropShipment from IN_TRANSIT to DEPOSITED and stamps deposited_at_utc from the logical clock", "link 1: transitions the CommingleBatch from DOCUMENTED to CLOSED", "link 2 (caused by link 1): transitions every DOCUMENTED SortContainer of the batch to DEPOSITED", "link 3 (caused by link 2): each newly DEPOSITED container opens one ServiceLevelRecord carrying that container's zone, committed_days and piece_count, with deposited_at_utc set to the logical clock", "link 3 (caused by link 1): transitions every PRESORTED member MailJob to MAILED and stamps mailed_at_utc", "link 4 (caused by link 3): adds each newly MAILED job's accepted_piece_count to that job's Client.lifetime_pieces_mailed", "increments DropShipment.version and CommingleBatch.version by 1"]

  - method: POST
    path: "/drop-shipments/{id}/cancel"
    description: "Cancel a booked or in-transit drop shipment, freeing its dock capacity."
    roles: [PresortOperator, BureauAdmin]
    code: 200
    input: ["reason"]
    output: DropShipment
    side_effects: ["sets cancel_reason", "removes the shipment from dock_capacity_occupancy for future bookings", "increments DropShipment.version by 1"]

  # ------------------------------------------------------ Postage statements ---
  - method: POST
    path: "/postage-statements"
    description: "Prepare a postage statement for a sorted batch, freezing the batch's piece count and rate. Guarded by optimistic concurrency on expected_batch_version."
    roles: [PostageManager]
    code: 201
    input: ["commingle_batch_id", "permit_account_id", "expected_batch_version"]
    output: PostageStatement
    side_effects: ["freezes statement_piece_count from CommingleBatch.total_piece_count and rate_mills_per_piece from CommingleBatch.rate_mills_per_piece", "sets declared_postage_cents from CommingleBatch.batch_postage_cents", "sets prepared_by_user_id from the acting X-User-ID", "status initialised to DRAFT, and adjustment_cents, verified_postage_cents, verification_error_count and revision_index all initialised to 0", "increments CommingleBatch.version by 1"]

  - method: GET
    path: "/postage-statements/{id}"
    description: "Read one postage statement with its frozen piece count and rate, its adjustment and its verified total."
    roles: [BureauAdmin, PostageManager, AcceptanceClerk, ClientContact]
    code: 200
    output: PostageStatement

  - method: POST
    path: "/postage-statements/{id}/submit"
    description: "File the statement with the acceptance unit, reserving the declared postage against the permit account."
    roles: [PostageManager]
    code: 200
    output: PostageStatement
    side_effects: ["transitions PostageStatement from DRAFT to SUBMITTED", "sets submitted_by_user_id from the acting X-User-ID", "moves declared_postage_cents from PermitAccount.balance_cents into PermitAccount.reserved_cents, preserving the permit_total_funds_cents invariant", "transitions the CommingleBatch from SORTED to DOCUMENTED", "increments PostageStatement.version and PermitAccount.version by 1"]

  - method: POST
    path: "/postage-statements/{id}/findings"
    description: "Record a verification finding raised at the acceptance unit against a submitted statement, per verification_adjustment."
    roles: [AcceptanceClerk]
    code: 201
    input: ["finding_type", "affected_piece_count"]
    output: VerificationFinding
    side_effects: ["runs verification_adjustment over all findings in created_at ASC order to derive each finding's cumulative severity and surcharge_cents", "sets assessed_by_user_id from the acting X-User-ID", "refreshes PostageStatement.adjustment_cents and verification_error_count", "increments PostageStatement.version by 1"]

  - method: GET
    path: "/postage-statements/{id}/findings"
    description: "List the verification findings raised against one statement in created_at order (reverse lookup for VerificationFinding.postage_statement_id)."
    roles: [BureauAdmin, PostageManager, AcceptanceClerk]
    code: 200
    output: VerificationFinding[]

  - method: POST
    path: "/postage-statements/{id}/verify"
    description: "Close verification at the acceptance unit: accept the statement clean, accept it with a postage adjustment, or return it for correction. Segregation of duties applies."
    roles: [AcceptanceClerk]
    code: 200
    input: ["outcome"]
    output: PostageStatement
    side_effects: ["outcome ACCEPT with adjustment_cents == 0 transitions to ACCEPTED_CLEAN; outcome ACCEPT with adjustment_cents > 0 transitions to ACCEPTED_WITH_ADJUSTMENT; outcome RETURN transitions to RETURNED_FOR_CORRECTION", "sets verified_by_user_id from the acting X-User-ID and verified_postage_cents to declared_postage_cents plus adjustment_cents", "on ACCEPT, draws the adjustment_cents from PermitAccount.balance_cents into reserved_cents and re-runs pro_rata_cost_allocation to spread the adjustment over the batch members as allocated_adjustment_cents", "on RETURN, transitions the CommingleBatch from DOCUMENTED to REWORK, which returns every member MailJob from POOLED to REWORK and every SortContainer from DOCUMENTED to RETURNED, and each returned job whose rework_count reaches REWORK_SUSPEND_THRESHOLD suspends its Client", "on RETURN, releases the reserved_cents back to PermitAccount.balance_cents", "increments PostageStatement.version, PermitAccount.version and CommingleBatch.version by 1"]

  - method: POST
    path: "/postage-statements/{id}/void"
    description: "Void a draft or submitted statement, releasing any reservation it held."
    roles: [PostageManager]
    code: 200
    input: ["reason"]
    output: PostageStatement
    side_effects: ["sets void_reason", "returns any reserved_cents this statement holds to PermitAccount.balance_cents, preserving the permit_total_funds_cents invariant", "returns the CommingleBatch from DOCUMENTED to SORTED when the voided statement had been SUBMITTED, so a replacement statement can be prepared", "increments PostageStatement.version and PermitAccount.version by 1"]

  - method: POST
    path: "/postage-statements/{id}/revise"
    description: "Reopen a returned statement for correction, re-reading the batch's current piece count and rate into a new revision."
    roles: [PostageManager]
    code: 200
    output: PostageStatement
    side_effects: ["transitions PostageStatement from RETURNED_FOR_CORRECTION to DRAFT", "increments revision_index by 1", "AFTER the batch has returned REWORK -> OPEN and recomputed itself, re-freezes statement_piece_count and rate_mills_per_piece from the batch and recomputes declared_postage_cents from them", "clears adjustment_cents, verified_postage_cents, verification_error_count, submitted_by_user_id and verified_by_user_id", "increments PostageStatement.version by 1"]

  # ---------------------------------------------------------- Service level ---
  - method: GET
    path: "/service-level-records/{id}"
    description: "Read one service-level record with its zone, committed_days and on-time verdict."
    roles: [BureauAdmin, PostageManager, AcceptanceClerk, ClientContact]
    code: 200
    output: ServiceLevelRecord

  - method: POST
    path: "/service-level-records/{id}/delivery-scan"
    description: "Record the observed delivery-days scan for a deposited container, settling its on-time verdict."
    roles: [AcceptanceClerk]
    code: 200
    input: ["actual_delivery_days", "scanned_at_utc"]
    output: ServiceLevelRecord
    side_effects: ["sets actual_delivery_days and scanned_at_utc", "sets on_time to true when actual_delivery_days is less than or equal to committed_days", "increments ServiceLevelRecord.version by 1"]

  # -------------------------------------------------------- Client invoices ---
  - method: GET
    path: "/client-invoices/{id}"
    description: "Read one client invoice: postage, verification adjustments, service fee and total."
    roles: [BureauAdmin, PostageManager, ClientContact]
    code: 200
    output: ClientInvoice

  - method: POST
    path: "/client-invoices/{id}/payment"
    description: "Record a client payment settling an issued invoice in full."
    roles: [PostageManager]
    code: 200
    input: ["amount_cents"]
    output: ClientInvoice
    side_effects: ["transitions ClientInvoice from ISSUED to PAID", "sets paid_amount_cents to amount_cents", "increments ClientInvoice.version by 1"]

  # -------------------------------------------------------- Test-driving API ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary instant so appointment windows, permit fee lapses and move-update ages are deterministic. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [BureauAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string, no_show_shipment_ids: string[] }"
    side_effects: ["advancing the clock past a SCHEDULED DropShipment's window_end_utc transitions that shipment to NO_SHOW and returns its id in no_show_shipment_ids"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization -----------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is absent, empty, or whitespace-only."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is unknown, or the role is not listed in the target endpoint's roles."
  - id: ERR_CLIENT_SCOPE_VIOLATION
    http: 403
    condition: "A ClientContact acts on a client, job, permit account or invoice that does not belong to its own Client id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals the statement's submitted_by_user_id on a verification action."

  # --- request shape ----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, unknown field, or enum value outside the declared set."
  - id: ERR_INVALID_PIECE_COUNT
    http: 400
    condition: "A piece, pallet or money count is below its floor, or a hygiene sub-count exceeds the submitted_piece_count it is drawn from, or a finding's affected_piece_count exceeds the statement's frozen statement_piece_count."
  - id: ERR_INTERVAL_INVALID
    http: 400
    condition: "An interval's end instant is not strictly after its start instant."

  # --- existence --------------------------------------------------------------
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "No Client exists for the supplied client_id."
  - id: ERR_PERMIT_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No PermitAccount exists for the supplied permit_account_id."
  - id: ERR_MAIL_JOB_NOT_FOUND
    http: 404
    condition: "No MailJob exists for the supplied mail_job_id."
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No CommingleBatch exists for the supplied commingle_batch_id."
  - id: ERR_BATCH_MEMBER_NOT_FOUND
    http: 404
    condition: "No BatchMember exists for the supplied batch_member_id, or it belongs to a different batch than the path parent."
  - id: ERR_CONTAINER_NOT_FOUND
    http: 404
    condition: "No SortContainer exists for the supplied sort_container_id."
  - id: ERR_ENTRY_FACILITY_NOT_FOUND
    http: 404
    condition: "No EntryFacility exists for the supplied entry_facility_id."
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "No PostageStatement exists for the supplied postage_statement_id."
  - id: ERR_DROP_SHIPMENT_NOT_FOUND
    http: 404
    condition: "No DropShipment exists for the supplied drop_shipment_id."
  - id: ERR_SERVICE_LEVEL_RECORD_NOT_FOUND
    http: 404
    condition: "No ServiceLevelRecord exists for the supplied service_level_record_id."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "No ClientInvoice exists for the supplied client_invoice_id."

  # --- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_PERMIT_VERSION
    http: 412
    condition: "expected_permit_account_version does not equal the PermitAccount's current version."
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_batch_version does not equal the CommingleBatch's current version."

  # --- own-state errors -------------------------------------------------------
  - id: ERR_INVALID_JOB_STATE
    http: 409
    condition: "The MailJob's status does not permit the requested operation."
  - id: ERR_JOB_ALREADY_POOLED
    http: 409
    condition: "The MailJob is already POOLED into a commingle batch."
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "The CommingleBatch's status does not permit the requested operation."
  - id: ERR_INVALID_STATEMENT_STATE
    http: 409
    condition: "The PostageStatement's status does not permit the requested operation."
  - id: ERR_INVALID_SHIPMENT_STATE
    http: 409
    condition: "The DropShipment's status does not permit the requested operation."
  - id: ERR_INVALID_INVOICE_STATE
    http: 409
    condition: "The ClientInvoice is already PAID."

  # --- cross-entity state errors ----------------------------------------------
  - id: ERR_CLIENT_SUSPENDED
    http: 409
    condition: "The owning Client's status is SUSPENDED."
  - id: ERR_PERMIT_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "The funding PermitAccount's status is HOLD or CLOSED."
  - id: ERR_ENTRY_FACILITY_CLOSED
    http: 409
    condition: "The EntryFacility being booked has status CLOSED."
  - id: ERR_STATEMENT_NOT_ACCEPTED
    http: 409
    condition: "The batch being deposited has no PostageStatement in ACCEPTED_CLEAN or ACCEPTED_WITH_ADJUSTMENT."
  - id: ERR_PERMIT_ANNUAL_FEE_LAPSED
    http: 409
    condition: "The PermitAccount's annual_fee_paid_through_utc is earlier than the current logical clock."
  - id: ERR_PERMIT_HAS_RESERVED_FUNDS
    http: 409
    condition: "A PermitAccount close was requested while reserved_cents is greater than 0."

  # --- uniqueness -------------------------------------------------------------
  - id: ERR_DUPLICATE_CLIENT_CODE
    http: 409
    condition: "Another Client already holds the supplied client_code."
  - id: ERR_DUPLICATE_PERMIT_NUMBER
    http: 409
    condition: "Another PermitAccount already holds the supplied permit_number."
  - id: ERR_DUPLICATE_FACILITY_CODE
    http: 409
    condition: "Another EntryFacility already holds the supplied facility_code."

  # --- referential / eligibility ----------------------------------------------
  - id: ERR_PERMIT_CLIENT_MISMATCH
    http: 422
    condition: "The named PermitAccount belongs to a different Client than the job's client_id."
  - id: ERR_MOVE_UPDATE_STALE
    http: 422
    condition: "The job's latest hygiene run used move-update data older than MOVE_UPDATE_MAX_AGE_DAYS, so move_update_compliant is false."
  - id: ERR_ADDRESS_QUALITY_BELOW_MINIMUM
    http: 422
    condition: "The job's address_quality_pct is below MIN_ADDRESS_QUALITY_PCT."
  - id: ERR_MAIL_CLASS_MISMATCH
    http: 422
    condition: "The job's mail_class differs from the batch's mail_class."
  - id: ERR_PROCESSING_CATEGORY_MISMATCH
    http: 422
    condition: "The job's processing_category differs from the batch's processing_category."
  - id: ERR_COMMINGLE_OPT_OUT
    http: 422
    condition: "The job's Client has commingle_opt_in set to false."

  # --- sortation / documentation ----------------------------------------------
  - id: ERR_BATCH_HAS_NO_CONTAINERS
    http: 422
    condition: "A sort was requested on a batch whose container_count or member_job_count is 0."
  - id: ERR_CONTAINER_NOT_QUALIFIED
    http: 422
    condition: "At least one SortContainer on the batch has qualifies false."
  - id: ERR_CONTAINER_PIECE_MISMATCH
    http: 422
    condition: "The sum of container piece_count over the batch differs from the batch's total_piece_count."

  # --- appointment / temporal -------------------------------------------------
  - id: ERR_SHIPMENT_ALREADY_SCHEDULED
    http: 409
    condition: "The batch already has a DropShipment in SCHEDULED or IN_TRANSIT."
  - id: ERR_SHIPMENT_WINDOW_IN_PAST
    http: 422
    condition: "window_start_utc is earlier than the current logical clock."
  - id: ERR_DOCK_CAPACITY_EXCEEDED
    http: 409
    condition: "Aggregate pallets already committed over overlapping half-open windows plus the requested pallet_count exceed the facility's dock_capacity_pallets_per_slot."
  - id: ERR_OUTSIDE_APPOINTMENT_WINDOW
    http: 422
    condition: "A deposit was attempted with the logical clock outside the shipment's closed appointment window."
  - id: ERR_DELIVERY_ALREADY_SCANNED
    http: 409
    condition: "The ServiceLevelRecord already carries an actual_delivery_days scan."

  # --- verification / billing -------------------------------------------------
  - id: ERR_NO_VERIFICATION_FINDINGS
    http: 422
    condition: "A RETURN verification outcome was requested while verification_error_count is 0."
  - id: ERR_BILLING_PERIOD_OVERLAP
    http: 409
    condition: "The requested billing period touches or overlaps an existing invoice period of the same client."
  - id: ERR_NO_BILLABLE_JOBS
    http: 422
    condition: "No MailJob of the client is MAILED with mailed_at_utc inside the requested period."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "The payment amount_cents differs from the invoice total_cents."

  # --- fiscal -----------------------------------------------------------------
  - id: ERR_INSUFFICIENT_POSTAGE_BALANCE
    http: 402
    condition: "The PermitAccount's balance_cents cannot cover the postage being reserved or the adjustment being drawn."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ClientContact
    description: "A mail owner acting on its own account: submits jobs, reads its own jobs, permits, statements, invoices and service-level indices. Never touches sortation, verification or billing issuance."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /mail-jobs (own client_id only)"
      - "GET /clients/{id} and its permit-accounts, mail-jobs, invoices and service-level sub-resources (own client only)"
      - "GET /mail-jobs/{id}, its hygiene-runs, batch-memberships and postage-estimate (own jobs only)"
      - "GET /permit-accounts/{id}, GET /postage-statements/{id}, GET /service-level-records/{id}, GET /client-invoices/{id}"

  - name: PresortOperator
    description: "Production floor: runs address hygiene and move update, pools jobs into commingle batches, builds trays and pallets, closes sortation and books drop shipments."
    identity: "opaque"
    exclusive_operations:
      - "POST /mail-jobs/{id}/hygiene-runs"
      - "POST /commingle-batches"
      - "POST /commingle-batches/{id}/members"
      - "DELETE /commingle-batches/{id}/members/{batch_member_id}"
      - "POST /commingle-batches/{id}/containers"
      - "POST /commingle-batches/{id}/sort"
      - "POST /drop-shipments"
      - "POST /drop-shipments/{id}/depart"
    shared_operations:
      - "POST /mail-jobs"
      - "POST /mail-jobs/{id}/cancel"
      - "POST /drop-shipments/{id}/cancel"
      - "read endpoints across clients, jobs, batches, containers, facilities and shipments"

  - name: PostageManager
    description: "Postage and money: opens and funds permit accounts, prepares, submits, revises and voids postage statements, issues client invoices and records payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /permit-accounts"
      - "POST /permit-accounts/{id}/funding"
      - "POST /permit-accounts/{id}/status"
      - "POST /postage-statements"
      - "POST /postage-statements/{id}/submit"
      - "POST /postage-statements/{id}/void"
      - "POST /postage-statements/{id}/revise"
      - "POST /clients/{id}/invoices"
      - "POST /client-invoices/{id}/payment"
    shared_operations:
      - "read endpoints across clients, permit accounts, jobs, batches, statements, containers, shipments, service level and invoices"

  - name: AcceptanceClerk
    description: "Acceptance unit: records verification findings, closes verification with accept or return, receives the deposit at the dock and scans delivery. Segregated from statement filing."
    identity: "opaque"
    exclusive_operations:
      - "POST /postage-statements/{id}/findings"
      - "POST /postage-statements/{id}/verify"
      - "POST /drop-shipments/{id}/deposit"
      - "POST /service-level-records/{id}/delivery-scan"
    shared_operations:
      - "read endpoints across clients, permit accounts, jobs, batches, containers, facilities, shipments, statements, findings and service level"

  - name: BureauAdmin
    description: "Bureau administration: onboards clients and entry facilities, suspends and reinstates clients, opens and closes facilities, cancels work, and drives the logical clock. Does not run production, postage or acceptance actions."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /clients/{id}/status"
      - "POST /entry-facilities"
      - "POST /entry-facilities/{id}/status"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /mail-jobs/{id}/cancel"
      - "POST /drop-shipments/{id}/cancel"
      - "read endpoints across every resource"
