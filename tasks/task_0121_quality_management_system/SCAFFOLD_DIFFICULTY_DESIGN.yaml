# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_0121_quality_management_system  —  Expert tier
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Deleting this file leaves
# the scaffold's declared behavior identical.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: capa_effectiveness_provisional_vs_final
        grounds:
          - calculations.capa_effectiveness
          - state_machines.Capa.ROOT_CAUSE_to_VERIFICATION
          - state_machines.Capa.EFFECTIVENESS_CHECK_to_CLOSED_EFFECTIVE
          - entities.Capa.fields.provisional_effectiveness
          - entities.Capa.fields.final_effectiveness
        distinguishing_aspect: |
          On the Capa entity, the SAME effectiveness metric is computed two valid ways:
          the provisional variant projects forward from PLANNED D4/D5 containment_count
          (containment 3 / defect_qty 5 = 0.60), while the final variant measures
          chronologically from the D8 recurred_defects (0 recurrences / 5 = 1.00) — the
          two variants yield different numbers for the same CAPA.
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager Personnel exist."
            - "A SUPPLIER-source NCR (defect_qty=5) is DISPOSITIONED REWORK by the QM, then a CAPA is opened (NCR -> CAPA_IN_PROGRESS)."
            - "D1 + D4 (containment_count=3) steps recorded; CAPA advanced OPEN->ROOT_CAUSE->VERIFICATION so provisional_effectiveness is computed."
            - "D8 step (recurred_defects=0) recorded; CAPA verified into EFFECTIVENESS_CHECK."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE One", email: "qe1@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Two", email: "qm2@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm2_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Acme Parts", code: "ACME" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "Bent flange", source: "SUPPLIER", severity: "MAJOR", defect_qty: 5, unit_cost_cents: 1000, part_number: "P-100", supplier_id: "${sup_id}", rework_hours: 2.0 }
              as: QualityEngineer
              as_user_id: "${qe1_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe1_id}"
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm2_id}"
            - call: "POST /capas"
              payload: { ncr_id: "${ncr_id}", title: "8D for bent flange" }
              as: QualityEngineer
              as_user_id: "${qe1_id}"
              captures: { capa_id: $.data.id }
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D1", narrative: "team formed" }
              as: QualityEngineer
              as_user_id: "${qe1_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D4", narrative: "root cause + containment", containment_count: 3 }
              as: QualityEngineer
              as_user_id: "${qe1_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe1_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe1_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D8", narrative: "monitoring window", recurred_defects: 0 }
              as: QualityEngineer
              as_user_id: "${qe1_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "VERIFY" }
              as: QualityManager
              as_user_id: "${qm2_id}"
          trigger:
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "CLOSE_EFFECTIVE" }
              as: QualityManager
              as_user_id: "${qm2_id}"
              captures: { final_eff: $.data.final_effectiveness }
            - call: "GET /capas/${capa_id}"
              payload: {}
              as: QualityManager
              as_user_id: "${qm2_id}"
          assert:
            - "Capa.${capa_id}.provisional_effectiveness == 0.60"
            - "Capa.${capa_id}.final_effectiveness == 1.00"
            - "Capa.${capa_id}.provisional_effectiveness != Capa.${capa_id}.final_effectiveness"
            - "Capa.${capa_id}.status == CLOSED_EFFECTIVE"

      - name: aql_sampling_normal_vs_tightened
        grounds:
          - calculations.aql_sampling
          - state_machines.InspectionLot.PENDING_to_IN_INSPECTION
          - state_machines.InspectionLot.IN_INSPECTION_to_ACCEPTED
          - state_machines.InspectionLot.IN_INSPECTION_to_REJECTED
          - entities.InspectionLot.fields.acceptance_number
          - entities.InspectionPlan.fields.severity_mode
        distinguishing_aspect: |
          On the InspectionLot/InspectionPlan domain (distinct from the Capa effectiveness
          domain), the SAME aql_sampling calc has two valid variants: NORMAL reads cell
          (F,4.0)->Ac=2, TIGHTENED reads the next-tighter column (F,2.5)->Ac=1, so an
          identical defects_found=2 flips ACCEPTED under NORMAL to REJECTED under TIGHTENED.
        test_recipe:
          setup:
            - "An Inspector and a QualityManager Personnel and a Supplier exist."
            - "A ControlPlan + InspectionPlan(lot_size=120 -> code letter F, aql_pct=4.0, level GII) exist; plan starts severity_mode=NORMAL."
            - "Two lots are pushed to REJECTED on this plan to trigger NORMAL->TIGHTENED (consecutive_rejects reaches 2)."
            - "A third lot is started (now reads TIGHTENED column) and dispositioned with defects_found=2."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp One", email: "insp1@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Beta Mfg", code: "BETA" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP F", part_number: "P-F" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP F", control_plan_id: "${cp_id}", part_number: "P-F", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /inspection-lots/${lot1_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots/${lot1_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot2_id: $.data.id }
            - call: "POST /inspection-lots/${lot2_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots/${lot2_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot3_id: $.data.id }
            - call: "POST /inspection-lots/${lot3_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot3_ac: $.data.acceptance_number, lot3_mode: $.data.severity_mode_used }
          trigger:
            - call: "POST /inspection-lots/${lot3_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 2 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot3_status: $.data.status }
          assert:
            - "InspectionLot.${lot3_id}.severity_mode_used == TIGHTENED"
            - "InspectionLot.${lot3_id}.acceptance_number == 1"
            - "InspectionLot.${lot3_id}.sample_size == 20"
            - "InspectionLot.${lot3_id}.status == REJECTED"

  - rule_id: combinatorial_formula
    instances:
      - name: supplier_quality_rating_three_factor_min_max
        grounds:
          - calculations.supplier_quality_rating
          - entities.Supplier.fields.quality_rating
          - entities.Supplier.fields.approval_status
          - state_machines.InspectionLot.IN_INSPECTION_to_REJECTED
          - state_machines.NonconformanceReport.DRAFT_to_OPEN
          - state_machines.Scar.OPEN_to_ACK
        distinguishing_aspect: |
          Mode (a) — non-linear interaction of THREE inputs: lot_factor=max(0,1-1/2)=0.5,
          ncr_factor=max(0,1-2*0.10)=0.8, scar_penalty=min(0.20,1*0.05)=0.05 combine via
          weighted base then max(0, base - penalty), giving 57.00 (PROBATION); the nested
          max()/min() make it more than a linear sum.
        test_recipe:
          setup:
            - "An Inspector, a QualityEngineer, a QualityManager Personnel and a Supplier exist."
            - "Two inspection lots dispositioned on the same plan: one REJECTED, one ACCEPTED (lots_inspected=2, lots_rejected=1)."
            - "Two SUPPLIER-source NCRs opened against the supplier (ncrs_attributed=2)."
            - "One SCAR opened against the supplier and left OPEN (open_scar_count=1)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp C", email: "inspc@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QE C", email: "qec@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Gamma Co", code: "GAMMA" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP G", part_number: "P-G" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP G", control_plan_id: "${cp_id}", part_number: "P-G", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lotr_id: $.data.id }
            - call: "POST /inspection-lots/${lotr_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots/${lotr_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lota_id: $.data.id }
            - call: "POST /inspection-lots/${lota_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots/${lota_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /nonconformance-reports"
              payload: { title: "NCR A", source: "SUPPLIER", severity: "MINOR", defect_qty: 1, unit_cost_cents: 100, part_number: "P-G", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncra_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncra_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports"
              payload: { title: "NCR B", source: "SUPPLIER", severity: "MINOR", defect_qty: 1, unit_cost_cents: 100, part_number: "P-G", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncrb_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncrb_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /scars"
              payload: { ncr_id: "${ncra_id}", supplier_id: "${sup_id}", due_at: "2026-09-01T00:00:00Z" }
              as: QualityManager
              captures: { scar_id: $.data.id }
          trigger:
            - call: "GET /suppliers/${sup_id}"
              payload: {}
              as: QualityManager
              captures: { qr: $.data.quality_rating, ap: $.data.approval_status }
          assert:
            - "Supplier.${sup_id}.lots_inspected == 2"
            - "Supplier.${sup_id}.lots_rejected == 1"
            - "Supplier.${sup_id}.ncrs_attributed == 2"
            - "Supplier.${sup_id}.open_scar_count == 1"
            - "Supplier.${sup_id}.quality_rating == 57.00"
            - "Supplier.${sup_id}.approval_status == PROBATION"

      - name: ncr_cost_of_quality_round_per_line_then_sum
        grounds:
          - calculations.ncr_cost_of_quality
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - entities.NonconformanceReport.fields.cost_of_quality_cents
          - entities.NonconformanceReport.fields.rework_hours
          - entities.NonconformanceReport.fields.severity
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER the scaffold pins: labour_cents_per_unit
          rounds FIRST (round_half_up(0.5*6000)=3000), the per-line product rounds with the
          MINOR weight 0.5 (round_half_up(3000*0.5)=1500), THEN the sum over defect_qty=3
          gives 4500; round-then-sum vs sum-then-round are distinguished by this pinned order.
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager Personnel and a Supplier exist."
            - "A SUPPLIER NCR with severity=MINOR, defect_qty=3, unit_cost_cents=999, rework_hours=0.5 is OPEN."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE R", email: "qer@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM R", email: "qmr@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Delta Inc", code: "DELTA" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "rework rounding", source: "SUPPLIER", severity: "MINOR", defect_qty: 3, unit_cost_cents: 999, part_number: "P-R", supplier_id: "${sup_id}", rework_hours: 0.5 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { coq: $.data.cost_of_quality_cents }
          assert:
            - "NonconformanceReport.${ncr_id}.disposition == REWORK"
            - "NonconformanceReport.${ncr_id}.cost_of_quality_cents == 4500"
            - "NonconformanceReport.${ncr_id}.budget_reserved_cents == 4500"

  - rule_id: non_linear_state_machine
    instances:
      - name: capa_verification_cycle_back_to_root_cause
        grounds:
          - state_machines.Capa.VERIFICATION_to_ROOT_CAUSE
          - state_machines.Capa.ROOT_CAUSE_to_VERIFICATION
          - entities.Capa.fields.rework_loops
          - entities.Capa.fields.current_step
          - entities.Capa.fields.provisional_effectiveness
        distinguishing_aspect: |
          The Capa machine is CYCLIC: REJECT_VERIFICATION returns VERIFICATION->ROOT_CAUSE
          (current_step D6->D4), increments rework_loops to 1, and clears
          provisional_effectiveness to null — a back-edge that no linear pipeline exhibits.
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager Personnel and a Supplier exist."
            - "A SUPPLIER NCR (defect_qty=5) is DISPOSITIONED REWORK; a CAPA is opened (NCR -> CAPA_IN_PROGRESS)."
            - "D1 + D4 (containment_count=3) recorded; CAPA advanced to VERIFICATION (provisional_effectiveness=0.60)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE V", email: "qev@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM V", email: "qmv@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Cyc Co", code: "CYC" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "cyclic capa", source: "SUPPLIER", severity: "MAJOR", defect_qty: 5, unit_cost_cents: 1000, part_number: "P-V", supplier_id: "${sup_id}", rework_hours: 2.0 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_id}"
            - call: "POST /capas"
              payload: { ncr_id: "${ncr_id}", title: "cyclic 8D" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { capa_id: $.data.id }
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D1", narrative: "team" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D4", narrative: "root cause", containment_count: 3 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "REJECT_VERIFICATION" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { rl: $.data.rework_loops, cs: $.data.current_step }
          assert:
            - "Capa.${capa_id}.status == ROOT_CAUSE"
            - "Capa.${capa_id}.current_step == D4"
            - "Capa.${capa_id}.rework_loops == 1"
            - "Capa.${capa_id}.provisional_effectiveness == null"

      - name: ncr_disposition_branching_fork_divergent_cost
        grounds:
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - entities.NonconformanceReport.fields.disposition
          - entities.NonconformanceReport.fields.cost_of_quality_cents
          - calculations.ncr_cost_of_quality
        distinguishing_aspect: |
          On a DIFFERENT entity (NonconformanceReport, not Capa), OPEN->DISPOSITIONED is a
          BRANCHING fork: two NCRs with identical inputs (severity=MAJOR, defect_qty=10,
          unit_cost_cents=500) take divergent branches — SCRAP yields cost 5000 while
          RETURN_TO_SUPPLIER yields cost 500 (handling-only), divergent side-effect sets.
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager Personnel and a Supplier exist."
            - "Two identical SUPPLIER NCRs (severity=MAJOR, defect_qty=10, unit_cost_cents=500) are OPEN."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE F", email: "qef@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM F", email: "qmf@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Fork Co", code: "FORK" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "scrap branch", source: "SUPPLIER", severity: "MAJOR", defect_qty: 10, unit_cost_cents: 500, part_number: "P-F1", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr1_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr1_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports"
              payload: { title: "rts branch", source: "SUPPLIER", severity: "MAJOR", defect_qty: 10, unit_cost_cents: 500, part_number: "P-F2", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr2_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr2_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr1_id}/disposition"
              payload: { disposition: "SCRAP" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { coq1: $.data.cost_of_quality_cents }
            - call: "POST /nonconformance-reports/${ncr2_id}/disposition"
              payload: { disposition: "RETURN_TO_SUPPLIER" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { coq2: $.data.cost_of_quality_cents }
          assert:
            - "NonconformanceReport.${ncr1_id}.disposition == SCRAP"
            - "NonconformanceReport.${ncr1_id}.cost_of_quality_cents == 5000"
            - "NonconformanceReport.${ncr2_id}.disposition == RETURN_TO_SUPPLIER"
            - "NonconformanceReport.${ncr2_id}.cost_of_quality_cents == 500"
            - "NonconformanceReport.${ncr1_id}.cost_of_quality_cents != NonconformanceReport.${ncr2_id}.cost_of_quality_cents"

  - rule_id: transitive_cascade
    instances:
      - name: capa_close_cascades_ncr_scar_supplier_depth3
        grounds:
          - state_machines.Capa.EFFECTIVENESS_CHECK_to_CLOSED_EFFECTIVE
          - state_machines.NonconformanceReport.CAPA_IN_PROGRESS_to_CLOSED
          - state_machines.Scar.ACCEPTED_RESPONSE_to_RESOLVED
          - calculations.supplier_quality_rating
          - entities.Supplier.fields.open_scar_count
          - entities.Supplier.fields.quality_rating
        distinguishing_aspect: |
          Depth-3 transitive chain originating from Capa CLOSE_EFFECTIVE: closing the CAPA
          drives NCR CAPA_IN_PROGRESS->CLOSED (hop 1), the NCR reaching CLOSED drives
          Scar ACCEPTED_RESPONSE->RESOLVED (hop 2 caused by hop 1), and the Scar resolving
          decrements Supplier.open_scar_count 1->0 and recomputes quality_rating 91.00->96.00
          (hop 3 caused by hop 2) — each link caused by the previous, not by the CLOSE call.
        test_recipe:
          setup:
            - "A QualityEngineer, independent QualityManager Personnel, and a Supplier exist; SupplierUser acts as that Supplier."
            - "A SUPPLIER NCR (defect_qty=5) is opened (ncrs_attributed=1), dispositioned REWORK, and a CAPA opened."
            - "A SCAR is opened against the supplier for that NCR (open_scar_count=1, rating=91.00), then ACKNOWLEDGE -> RESPOND -> ACCEPT_RESPONSE (status ACCEPTED_RESPONSE)."
            - "The CAPA is driven D1/D4(containment=3)/D8(recurred=0) and verified into EFFECTIVENESS_CHECK."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE T3", email: "qet3@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM T3", email: "qmt3@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Casc Co", code: "CASC" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "cascade ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 5, unit_cost_cents: 1000, part_number: "P-T3", supplier_id: "${sup_id}", rework_hours: 2.0 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_id}"
            - call: "POST /capas"
              payload: { ncr_id: "${ncr_id}", title: "cascade 8D" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { capa_id: $.data.id }
            - call: "POST /scars"
              payload: { ncr_id: "${ncr_id}", supplier_id: "${sup_id}", due_at: "2026-09-01T00:00:00Z" }
              as: QualityManager
              captures: { scar_id: $.data.id }
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "RESPOND", response_narrative: "corrected tooling" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "ACCEPT_RESPONSE" }
              as: QualityManager
              as_user_id: "${qm_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D1", narrative: "team" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D4", narrative: "root cause", containment_count: 3 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D8", narrative: "monitor", recurred_defects: 0 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "VERIFY" }
              as: QualityManager
              as_user_id: "${qm_id}"
          trigger:
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "CLOSE_EFFECTIVE" }
              as: QualityManager
              as_user_id: "${qm_id}"
            - call: "GET /nonconformance-reports/${ncr_id}"
              payload: {}
              as: QualityManager
            - call: "GET /scars/${scar_id}"
              payload: {}
              as: QualityManager
            - call: "GET /suppliers/${sup_id}"
              payload: {}
              as: QualityManager
              captures: { qr: $.data.quality_rating }
          assert:
            - "Capa.${capa_id}.status == CLOSED_EFFECTIVE"
            - "NonconformanceReport.${ncr_id}.status == CLOSED"
            - "NonconformanceReport.${ncr_id}.budget_reserved_cents == 0"
            - "Scar.${scar_id}.status == RESOLVED"
            - "Supplier.${sup_id}.open_scar_count == 0"
            - "Supplier.${sup_id}.quality_rating == 96.00"

      - name: lot_reject_cascades_consecutive_then_tightened_depth2
        grounds:
          - state_machines.InspectionLot.IN_INSPECTION_to_REJECTED
          - entities.InspectionPlan.fields.consecutive_rejects
          - entities.InspectionPlan.fields.severity_mode
        distinguishing_aspect: |
          A DIFFERENT trigger (InspectionLot DISPOSITION->REJECTED) drives a depth-2 transitive
          chain: the rejection increments InspectionPlan.consecutive_rejects (hop 1), and the
          counter REACHING 2 then flips InspectionPlan.severity_mode NORMAL->TIGHTENED (hop 2
          caused by the counter crossing the threshold, not directly by the disposition call).
        test_recipe:
          setup:
            - "An Inspector Personnel, a Supplier, a ControlPlan and an InspectionPlan(lot_size=120, aql_pct=4.0, GII) exist; plan severity_mode=NORMAL, consecutive_rejects=0."
            - "One lot has already been dispositioned REJECTED (consecutive_rejects=1, still NORMAL)."
            - "A second lot is created and started IN_INSPECTION."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp T2", email: "inspt2@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Tight Co", code: "TIGHT" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP T2", part_number: "P-T2" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP T2", control_plan_id: "${cp_id}", part_number: "P-T2", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /inspection-lots/${lot1_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots/${lot1_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot2_id: $.data.id }
            - call: "POST /inspection-lots/${lot2_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspection-lots/${lot2_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /inspection-plans/${ip_id}"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { cr: $.data.consecutive_rejects, sm: $.data.severity_mode }
          assert:
            - "InspectionLot.${lot2_id}.status == REJECTED"
            - "InspectionPlan.${ip_id}.consecutive_rejects == 2"
            - "InspectionPlan.${ip_id}.severity_mode == TIGHTENED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: disposition_state_beats_segregation_of_duties
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - entities.NonconformanceReport.fields.created_by_personnel_id
        distinguishing_aspect: |
          One disposition request fails TWO checks of different categories — p6 category=state
          (NCR is DRAFT, not OPEN) and p8 category=business_safety (acting X-User-ID equals
          created_by_personnel_id, SoD violation). Lower priority number wins: ERR_INVALID_STATE
          (p6), NOT ERR_SEGREGATION_OF_DUTIES (p8).
        test_recipe:
          setup:
            - "A QualityEngineer Personnel exists and raises a SUPPLIER NCR; the NCR is left in DRAFT (never opened)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE P5a", email: "qep5a@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Pri Co A", code: "PRIA" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "draft ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-P5A", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qe_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "data.error_id != ERR_SEGREGATION_OF_DUTIES"

      - name: scar_ack_state_beats_resource_owner
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Scar.OPEN_to_ACK
          - state_machines.Scar.OPEN_to_CANCELLED
          - entities.Scar.fields.supplier_id
        distinguishing_aspect: |
          One ACKNOWLEDGE request fails TWO checks of a DIFFERENT category pair than the prior
          instance — p6 category=state (SCAR is CANCELLED, not OPEN) and p7 category=
          business_referential (acting SupplierUser X-User-ID is a different supplier than
          Scar.supplier_id). Lower priority wins: ERR_INVALID_STATE (p6), NOT
          ERR_NOT_RESOURCE_OWNER (p7).
        test_recipe:
          setup:
            - "A QualityEngineer Personnel and TWO Suppliers (owner + other) exist."
            - "A SUPPLIER NCR is opened against the owner supplier; a SCAR is opened for it, then CANCELLED by the QualityManager (status CANCELLED)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE P5b", email: "qep5b@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Owner Co", code: "OWNB" }
              as: QualityManager
              captures: { owner_sup_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Other Co", code: "OTHB" }
              as: QualityManager
              captures: { other_sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "scar ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-P5B", supplier_id: "${owner_sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /scars"
              payload: { ncr_id: "${ncr_id}", supplier_id: "${owner_sup_id}", due_at: "2026-09-01T00:00:00Z" }
              as: QualityManager
              captures: { scar_id: $.data.id }
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "CANCEL" }
              as: QualityManager
          trigger:
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: SupplierUser
              as_user_id: "${other_sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "data.error_id != ERR_NOT_RESOURCE_OWNER"

  - rule_id: boundary_precision_check
    instances:
      - name: lot_defects_equal_acceptance_number_accepts
        grounds:
          - state_machines.InspectionLot.IN_INSPECTION_to_ACCEPTED
          - state_machines.InspectionLot.IN_INSPECTION_to_REJECTED
          - calculations.aql_sampling
          - entities.InspectionLot.fields.acceptance_number
          - entities.InspectionLot.fields.defects_found
        distinguishing_aspect: |
          Numeric threshold boundary on the DISPOSITION endpoint: with NORMAL cell (F,4.0)
          Ac=2, defects_found == Ac (2 == 2) ACCEPTS (the rule is defects_found <= Ac, so the
          exact equality lands on ACCEPTED, not REJECTED which needs defects_found >= Ac+1=3).
        test_recipe:
          setup:
            - "An Inspector Personnel, a Supplier, a ControlPlan and an InspectionPlan(lot_size=120, aql_pct=4.0, GII, NORMAL) exist."
            - "A lot is created and started IN_INSPECTION (acceptance_number resolves to 2)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp B1", email: "inspb1@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Bound Co", code: "BND1" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP B1", part_number: "P-B1" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP B1", control_plan_id: "${cp_id}", part_number: "P-B1", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ac: $.data.acceptance_number }
          trigger:
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 2 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { status: $.data.status }
          assert:
            - "InspectionLot.${lot_id}.acceptance_number == 2"
            - "InspectionLot.${lot_id}.rejection_number == 3"
            - "InspectionLot.${lot_id}.defects_found == 2"
            - "InspectionLot.${lot_id}.status == ACCEPTED"

      - name: audit_close_with_zero_open_findings_succeeds
        grounds:
          - state_machines.Audit.IN_PROGRESS_to_CLOSED
          - validations[priority=13]
          - entities.Audit.fields.open_finding_count
        distinguishing_aspect: |
          Empty-collection / zero-count boundary on a DIFFERENT endpoint (audit transition):
          an IN_PROGRESS audit with open_finding_count == 0 (no findings recorded) closes
          successfully — the exact zero edge passes ERR_AUDIT_HAS_OPEN_FINDINGS (which fires
          only when open_finding_count > 0).
        test_recipe:
          setup:
            - "An AUDITOR Personnel exists and is the lead auditor of a single Audit; no findings are recorded (open_finding_count=0)."
            - "The audit is STARTed PLANNED->IN_PROGRESS by the lead auditor."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Aud B2", email: "audb2@x.com", role: "AUDITOR" }
              as: QualityManager
              captures: { aud_id: $.data.id }
            - call: "POST /audits"
              payload: { title: "empty audit", lead_auditor_id: "${aud_id}", scheduled_from: "2026-07-01T00:00:00Z", scheduled_to: "2026-07-02T00:00:00Z", clause_scope: "8.5" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { audit_id: $.data.id }
            - call: "POST /audits/${audit_id}/transition"
              payload: { action: "START" }
              as: Auditor
              as_user_id: "${aud_id}"
          trigger:
            - call: "POST /audits/${audit_id}/transition"
              payload: { action: "CLOSE" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { status: $.data.status }
          assert:
            - "Audit.${audit_id}.open_finding_count == 0"
            - "Audit.${audit_id}.status == CLOSED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: finding_close_requires_escalated_ncr_closed
        grounds:
          - state_machines.AuditFinding.NCR_RAISED_to_CLOSED
          - validations[priority=6]
          - entities.AuditFinding.fields.raised_ncr_id
          - state_machines.NonconformanceReport.DRAFT_to_OPEN
        distinguishing_aspect: |
          AuditFinding's NCR_RAISED->CLOSED is gated by a DIFFERENT entity's state: the NCR
          referenced by raised_ncr_id must be CLOSED. Attempting CLOSE while that NCR is only
          OPEN is rejected with ERR_FINDING_NCR_OPEN (AuditFinding depends on
          NonconformanceReport state).
        test_recipe:
          setup:
            - "An AUDITOR Personnel leads an Audit, STARTed IN_PROGRESS, with one MAJOR AuditFinding (OPEN)."
            - "A QualityEngineer raises a source=AUDIT NCR against that finding and OPENs it (finding -> NCR_RAISED, NCR status OPEN — NOT closed)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Aud C7", email: "audc7@x.com", role: "AUDITOR" }
              as: QualityManager
              captures: { aud_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QE C7", email: "qec7@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /audits"
              payload: { title: "C7 audit", lead_auditor_id: "${aud_id}", scheduled_from: "2026-07-01T00:00:00Z", scheduled_to: "2026-07-02T00:00:00Z", clause_scope: "8.7" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { audit_id: $.data.id }
            - call: "POST /audits/${audit_id}/transition"
              payload: { action: "START" }
              as: Auditor
              as_user_id: "${aud_id}"
            - call: "POST /audits/${audit_id}/findings"
              payload: { clause: "8.7.1", grade: "MAJOR", description: "uncontrolled nonconforming output" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { finding_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "audit ncr", source: "AUDIT", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-C7", audit_finding_id: "${finding_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /audit-findings/${finding_id}/transition"
              payload: { action: "CLOSE" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 409"
            - "data.error_id == ERR_FINDING_NCR_OPEN"
            - "AuditFinding.${finding_id}.status == NCR_RAISED"

      - name: use_as_is_disposition_requires_approved_in_window_deviation
        grounds:
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - validations[priority=9]
          - state_machines.Deviation.REQUESTED_to_APPROVED
          - entities.Deviation.fields.status
          - entities.NonconformanceReport.fields.deviation_id
          - calculations.ncr_cost_of_quality
        distinguishing_aspect: |
          A DIFFERENT entity pair: NonconformanceReport's OPEN->DISPOSITIONED with USE_AS_IS
          depends on a Deviation being in state APPROVED, in-window, with max_qty >= defect_qty.
          With an APPROVED in-window Deviation (max_qty 5 >= defect_qty 4) the disposition
          succeeds, sets NCR.deviation_id, and computes cost_of_quality_cents = 600.
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager Personnel and a Supplier exist; server clock set to 2026-06-15T00:00:00Z."
            - "A SUPPLIER NCR (severity=MINOR, defect_qty=4, unit_cost_cents=1000) is OPEN."
            - "A Deviation for that NCR (part_number P-C72, max_qty=5, window 2026-06-01..2026-12-01) is APPROVED while the clock is in-window."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE C72", email: "qec72@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM C72", email: "qmc72@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Dev Co", code: "DEVC" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
