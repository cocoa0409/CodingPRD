              as: NetworkAdmin
              captures: { plan1: $.data.id }
            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I21", urgency: "STAT" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r1: $.data.id }
            - call: "POST /referrals/${r1}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I22", urgency: "STAT" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r2: $.data.id }
            - call: "POST /referrals/${r2}/accept"
              as: ReferralCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /referrals/aging-sweep"
              as: ReferralCoordinator
              captures: { swept: $.data.expired_count }
            - call: "GET /referring-providers/${pa}"
              as: ReferralCoordinator
          assert:
            - "sweep response expired_count == 2"
            - "Referral.${r1}.status == EXPIRED and Referral.${r2}.status == EXPIRED"
            - "GET /referring-providers/${pa}: leakage_event_count == 2 and watch_flag == true (inclusive threshold >= 2)"
            - "GET /referring-providers/${pa}/leakage-records returns 2 rows, both category == EXPIRED_UNRESOLVED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_no_show
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NO_SHOW_TOO_EARLY]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: a CANCELLED appointment
          marked no-show before its grace window violates both; the state error
          (priority 7) wins over the temporal error (priority 11).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; full bootstrap; referral R accepted/assigned/booked: appointment A 2026-08-02T10:00-11:00; A cancelled; clock set to 2026-08-02T10:05:00Z (before grace 10:15)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }
              as: NetworkAdmin
              captures: { plan1: $.data.id }
            - call: "POST /specialty-providers"
              payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /network-participations"
              payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: NetworkAdmin
            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r: $.data.id }
            - call: "POST /referrals/${r}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${r}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { r_v: $.data.version }
            - call: "POST /referrals/${r}/appointments"
              payload: { expected_referral_version: "${r_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ReferralCoordinator
              captures: { a: $.data.id }
            - call: "POST /appointments/${a}/cancel"
              as: ReferralCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:05:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /appointments/${a}/mark-no-show"
              as: ReferralCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 7 beats business_temporal priority 11), HTTP 409"
            - "Appointment.${a}.status remains CANCELLED; Patient.${pt1}.no_show_strikes == 0"

      - name: existence_beats_state_on_booking
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_SPECIALIST_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair existence vs state (distinct from state vs
          business_temporal): booking on a PENDING_TRIAGE referral with a
          nonexistent specialist_id violates both; the existence error (priority 5)
          wins over the state error (priority 7).
        test_recipe:
          setup:
            - "Clock default; plan; provider PA; patient PT; referral R created and left PENDING_TRIAGE (never accepted)"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }
              as: NetworkAdmin
              captures: { plan1: $.data.id }
            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r: $.data.id, r_v: $.data.version }
          trigger:
            - call: "POST /referrals/${r}/appointments"
              payload: { expected_referral_version: "${r_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", specialist_id: "00000000-0000-0000-0000-000000000000" }
              as: ReferralCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SPECIALIST_NOT_FOUND (existence priority 5 beats state priority 7), HTTP 404"
            - "Referral.${r}.status remains PENDING_TRIAGE and version unchanged"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sla_expiry_inclusive_boundary
        grounds:
          - calculations.referral_sla_and_aging
          - state_machines.Referral.ACCEPTED_to_EXPIRED
        distinguishing_aspect: |
          Metric: SLA days on the aging-sweep endpoint. now == sla_due_at expires
          (inclusive >=); one second before does not. Distinct metric and endpoint
          from no_show_grace_inclusive_boundary.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; provider PA; patient PT (plan PPO-1); ROUTINE referral R accepted at 2026-08-01T00:00:00Z so sla_due_at == 2026-08-31T00:00:00Z"
