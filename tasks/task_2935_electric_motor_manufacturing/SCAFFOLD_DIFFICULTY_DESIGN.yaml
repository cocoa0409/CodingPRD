  - rule_id: non_linear_state_machine
    instances:

      - name: design_request_changes_revision_cycle_hits_review_round_limit
        grounds:
          - state_machines.MotorDesign.IN_REVIEW_to_DRAFT
          - state_machines.MotorDesign.RELEASED_to_REVISION_OPEN
          - state_machines.MotorDesign.REVISION_OPEN_to_IN_REVIEW
          - entities.MotorDesign.fields.review_round
          - entities.MotorDesign.fields.revision_index
          - validations[priority=82]
          - errors[ERR_ROUND_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          The MotorDesign machine is CYCLIC on two distinct loops that share one bounded counter:
          IN_REVIEW -> DRAFT -> IN_REVIEW (REQUEST_CHANGES) and RELEASED -> REVISION_OPEN ->
          IN_REVIEW -> RELEASED (open-revision). review_round increments on EVERY decision and is
          never reset by either loop, so the third decision leaves review_round == 3 and the
          fourth is rejected with ERR_ROUND_LIMIT_EXCEEDED while revision_index has independently
          reached 3.
        test_recipe:
          setup:
            - "Empty DB; logical clock at the 2026-08-01T00:00:00.000Z startup default."
            - "Design D1 created by u_eng_1 and submitted for review (status IN_REVIEW, revision_index 0, review_round 0)."
          setup_api_calls:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
          trigger:
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "REQUEST_CHANGES", review_notes: "Raise slot fill; recheck core loss." }
              as: DesignReviewer
              as_user_id: "u_rev_1"
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
            - call: "POST /motor-designs/${d1_id}/open-revision"
              payload: { revision_reason: "Bearing supplier change." }
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
            - call: "POST /motor-designs/${d1_id}/open-revision"
              payload: { revision_reason: "Nameplate artwork revision." }
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { round_limit_error: $.data.error_id }
          assert:
            - "after trigger 1: MotorDesign.${d1_id}.status == DRAFT, revision_index == 1, review_round == 1"
            - "after trigger 3: MotorDesign.${d1_id}.status == RELEASED, revision_index == 1, review_round == 2, released_by_user_id == u_rev_1"
            - "after trigger 4: MotorDesign.${d1_id}.status == REVISION_OPEN, revision_index == 2, review_round == 2"
            - "after trigger 6: MotorDesign.${d1_id}.status == RELEASED, revision_index == 2, review_round == 3"
            - "after trigger 7: MotorDesign.${d1_id}.status == REVISION_OPEN, revision_index == 3"
            - "after trigger 8: MotorDesign.${d1_id}.status == IN_REVIEW"
            - "trigger 9 returns HTTP 422 with ${round_limit_error} == ERR_ROUND_LIMIT_EXCEEDED"
            - "after trigger 9: MotorDesign.${d1_id}.status == IN_REVIEW (unchanged) and review_round == 3 (not incremented on the rejected decision)"

      - name: rotor_cage_fork_join_die_cast_vs_brazed_bar_convergence
        grounds:
          - state_machines.RotorBuild.PLANNED_to_CAST_POURED
          - state_machines.RotorBuild.PLANNED_to_BARS_BRAZED
          - state_machines.RotorBuild.CAST_POURED_to_MACHINED
          - state_machines.RotorBuild.BARS_BRAZED_to_MACHINED
          - calculations.rotor_cage_properties
          - validations[priority=42]
          - validations[priority=44]
          - errors[ERR_ROTOR_CONSTRUCTION_MISMATCH]
          - errors[ERR_ROTOR_BAR_COUNT_MISMATCH]
        distinguishing_aspect: |
          The RotorBuild machine is BRANCHING with a fork-join: PLANNED forks to CAST_POURED or
          BARS_BRAZED depending on the pinned design's rotor_construction — each fork demanding a
          disjoint payload and writing a different cage property set (0.62 / 1.8 / 18000 versus
          1.00 / 0.6 / 47500) — and both forks join at MACHINED, from which the downstream
          balance transition is identical. Taking the wrong fork is rejected, not silently coerced.
        test_recipe:
          setup:
            - "Designs D1 (DIE_CAST_ALUMINUM, 34 bars) and D2 (FABRICATED_COPPER, 40 bars) both RELEASED."
            - "Work orders WO_A on D1 and WO_B on D2, both build_status RELEASED, each with one PLANNED RotorBuild."
