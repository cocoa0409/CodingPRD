          Two guards on the measurement path, each with a boundary that must be
          read the right way round: a window may END exactly at the logical clock
          but not one second later, and a finding may be confirmed at exactly
          IVT_CONFIRM_CONFIDENCE_FLOOR (0.75) but not at 0.7499. Both boundaries
          are exercised in the same fixture together with their refusals, so an
          off-by-one comparison shows up as a wrong status on one call while the
          other still passes.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; classified page; one INGESTED batch measured 10000 whose window ends exactly at the clock."
