            - "Buyer.${buyer_id}.credit_used_cents == 98650 after the successful create, and DiscountOffer.${offer_id}.version == v_accepted + 1 because the successful create bumps the offer version - so a second replay of v_accepted would now be stale in turn"

      - name: version_increments_on_every_write_to_the_addressed_row
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.BuyerProgram
          - endpoints[POST /buyer-programs/{id}/open]
          - endpoints[POST /buyer-programs/{id}/status]
          - entities.BuyerProgram
        distinguishing_aspect: |
          Version is not only bumped by the two OCC-guarded creates: every state write on the
          addressed row advances it by exactly one, and a read never advances it. Walking
          create -> open -> PAUSE -> RESUME must give 1, 2, 3, 4 with two interleaved GETs that
          change nothing, which rules out both a version that only tracks the OCC endpoints and a
          version that jumps by more than one per write.
        test_recipe:
          setup:
            - "One Buyer and one DRAFT programme; no suppliers, sessions or invoices are needed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Version Walk Buyer", tax_id: "347778889", credit_limit_cents: 100000000, self_funding_enabled: true }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Version Walk Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id", v_create: "$.data.version" }
            - call: "GET /buyer-programs/${program_id}"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { v_read_1: "$.data.version" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { v_open: "$.data.version" }
            - call: "POST /buyer-programs/${program_id}/status"
              payload: { action: "PAUSE" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { v_pause: "$.data.version", status_pause: "$.data.status" }
            - call: "GET /buyer-programs/${program_id}"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { v_read_2: "$.data.version" }
            - call: "POST /buyer-programs/${program_id}/status"
              payload: { action: "RESUME" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { v_resume: "$.data.version", status_resume: "$.data.status" }
          assert:
            - "v_create == 1 - a freshly created row starts at version 1"
            - "v_read_1 == 1 - the GET did not advance the version"
            - "v_open == 2 and BuyerProgram.${program_id}.status == OPEN"
            - "v_pause == 3 and status_pause == PAUSED"
            - "v_read_2 == 3 - the second GET did not advance the version either"
            - "v_resume == 4 and status_resume == OPEN"
            - "the sequence is exactly 1, 2, 3, 4: every write advanced the version by one and no write advanced it by two"

      - name: n_level_cascade_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / dispute_suppression_cascades_four_hops_and_releases_funder_capital
          rationale: |
            The cascading_side_effects layer is exercised at its full depth by the difficulty
            instance, which walks the four hops of the suppression cascade (Invoice -> DiscountOffer
            -> EarlyPayment -> Funder plus the programme analytics hop), checks the ordering
            sensitivity of the capital release relative to the status writes, and asserts that
            non-terminal rows only are touched. A separate breadth instance would restate the same
            chain with fewer hops.

      - name: both_discount_variants_produce_their_expected_results
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / early_payment_discount_pay_date_vs_value_date_basis
          rationale: |
            The dual_variant_calculation layer has exactly one dual-variant pair in this scaffold,
            early_payment_discount over days_early, and the difficulty instance already computes
            both variants on the same row and asserts the signed true-up delta written at settlement
            confirmation. The §1.9 calculations section keeps only the thin selection and divergence
            stubs that point at it.

      - name: cumulative_adoption_threshold_is_tested_at_its_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: boundary_precision_check / adoption_rate_empty_denominator_and_inclusive_throttled_edge
          rationale: |
            The rate_threshold_triggers layer is driven entirely by adoption_rate_pct crossing
            ADOPTION_OPTIMISED_PCT and ADOPTION_THROTTLED_PCT into the DISCOVERY / OPTIMISED /
            THROTTLED postures and the rate ceiling they imply. The difficulty instance sits exactly
            on the inclusive THROTTLED edge and on the empty-denominator case, which is the only
            boundary behaviour worth a dedicated test.

      - name: funder_selector_policy_picks_by_score_not_by_capacity
        claim_type: selector_policy
        excluded_because:
          difficulty_instance: combinatorial_formula / funder_selection_score_beats_raw_capital_depth
          rationale: |
            The selector_policy layer is realised by calculations.funder_selection, whose scoring,
            capacity bonus and three-level tie-break are the subject of the difficulty instance. The
            §1.9 calculations section retains only the lower-fee-spread tie-break instance, which
            probes a branch the difficulty instance does not reach.

