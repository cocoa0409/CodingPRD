              payload: { jobs_created: 4, jobs_retained: 1, housing_units: 0, businesses_financed: 1 }
              as: Borrower
              as_user_id: "${b1_id}"
              captures: { s_res: $.status, e_res: $.data.error_id }
          assert:
            - "${s_dec} == 409"
            - "${e_dec} == ERR_LOAN_NOT_IN_UNDERWRITING"
