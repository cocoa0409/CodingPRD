              payload: { isbn_base: "9780000011101", subject: "SCIENCE", grade_low: 5, grade_high: 5, copyright_year: 2025, content_tags: ["LAB_SAFETY"], page_count: 300, signature_page_capacity: 384, list_price_cents: 8900 }
