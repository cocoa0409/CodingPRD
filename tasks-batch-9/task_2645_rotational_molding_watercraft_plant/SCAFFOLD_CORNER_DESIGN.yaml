              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh_i}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_i_v1: $.data.version }
            - call: "POST /finished-units/${fu1}/store"
              payload: { expected_warehouse_version: "${wh_i_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh_j}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_j_v1: $.data.version }
            - call: "POST /finished-units/${fu3}/store"
              payload: { expected_warehouse_version: "${wh_j_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh_j}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_j_v2: $.data.version }
            - call: "POST /finished-units/${fu4}/store"
              payload: { expected_warehouse_version: "${wh_j_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh_j}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh_i}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units/${fu1}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "before the first store WH-CVI reports committed_cube_m3 0.0000, remaining 1.2000 and both zones at committed 0.0000 / remaining 0.6000 — the site has more free cube than the hull needs"
            - "the store of fu1 nevertheless fails 409 ERR_NO_ELIGIBLE_ZONE: storage_zone_selection finds no anchor for PM-CVR anywhere, so the required footprint is the full gross 1.0000, and remaining_after is 0.6000 - 1.0000 == -0.4000 in BOTH zones, which fails the eligibility test remaining_after >= 0.0000"
            - "rung 75 would have been satisfied by the same call (0.0000 + 1.0000 <= 1.2000), so the 409 proves the per-zone rung is evaluated before the site aggregate and that a site total is never a substitute for a zone fit"
            - "the store of fu3 at WH-CVJ returns 200 into zone Z1: both zones are empty and tie on anchor_exists false and remaining_after 1.0000 - 1.0000 == 0.0000, so the final tie-break zone_code ASC decides, and Z1 becoming the anchor at exactly zero remaining is the eligibility bound met at equality"
            - "the store of fu4 returns 200 into zone Z2 as a SECOND anchor at the full gross 1.0000, not as a nested sibling: Z1 already anchors PM-CVR and so ranks first on anchor_exists DESC, but its remaining_after would be 1.0000 - 1.0000 - round(1.0000 * 0.5000, 4) == -0.5000, so anchor affinity loses to eligibility and the ranking falls through to Z2"
            - "WH-CVJ then reads committed_cube_m3 2.0000 against footprint_capacity_cube_m3 2.0000 — rung 75's test committed + required <= capacity held at exact equality, which is the ONLY face of that rung a client can reach"
            - "structural note for the audit: because footprint_capacity_cube_m3 must equal round(sum(zones[].capacity_cube_m3), 4) and each zone's committed can never exceed its own capacity, the site remaining is the sum of the zone remainings; any request that busts the site therefore busts every zone first, so ERR_WAREHOUSE_CUBE_EXCEEDED is unreachable behind rung 73 and this instance pins its boundary from the passing side"
            - "WH-CVJ's utilization_pct is round(2.0000 / 2.0000 * 100, 2) == 100.00, which is >= frozen_threshold_pct 95.00, so its posture is FROZEN and PO-CVR2 (already COMPLETE at ordered_qty 2) is unaffected while any further store there would fail rung 40 instead"
            - "WH-CVI still reports committed_cube_m3 0.0000 with both zones empty and stored_unit_count 0, and fu1 still reads logistics_status UNALLOCATED with warehouse_id null and stored_footprint_cube_m3 0.0000 — the refusal wrote nothing"

      # -----------------------------------------------------------------------
      # V18 — rung 26: zone_code uniqueness is scoped to ONE warehouse's zones
      # array while site_code is global; the capacity-sum constraint is separate.
      # -----------------------------------------------------------------------
      - name: val_violation_duplicate_zone_code_within_one_warehouse_rejected
        claim_type: "Violation → Error"
        grounds:
          - validation_rules.priority_26
          - errors.ERR_DUPLICATE_CODE
          - errors.ERR_VALIDATION
          - entities.Warehouse.zones
          - endpoints.POST_/warehouses
        distinguishing_aspect: "Two zones called Z1 inside one POST /warehouses body are refused 409 ERR_DUPLICATE_CODE even though their capacities sum correctly, while a second site reusing the zone_code Z1 is accepted — the uniqueness scope is the zones array, not the installation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "No Warehouse exists yet, so every site_code and every zone_code below is free."
          setup_api_calls:
            - *cvA_clock
          trigger:
            - call: "POST /warehouses"
              payload: { site_code: "WH-CVD-DUP", footprint_capacity_cube_m3: 10.0000, zones: [{ zone_code: "Z1", capacity_cube_m3: 5.0000 }, { zone_code: "Z1", capacity_cube_m3: 5.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warehouses"
              payload: { site_code: "WH-CVD1", footprint_capacity_cube_m3: 10.0000, zones: [{ zone_code: "Z1", capacity_cube_m3: 4.0000 }, { zone_code: "Z2", capacity_cube_m3: 6.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh_d1: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-CVD2", footprint_capacity_cube_m3: 3.0000, zones: [{ zone_code: "Z1", capacity_cube_m3: 3.0000 }] }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_d2: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-CVD1", footprint_capacity_cube_m3: 8.0000, zones: [{ zone_code: "ZA", capacity_cube_m3: 8.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warehouses"
              payload: { site_code: "WH-CVD-SUM", footprint_capacity_cube_m3: 10.0000, zones: [{ zone_code: "Z1", capacity_cube_m3: 4.0000 }, { zone_code: "Z2", capacity_cube_m3: 5.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /warehouses/${wh_d1}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh_d2}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "the first call fails 409 ERR_DUPLICATE_CODE: two zones share zone_code Z1 inside one zones array, and the rung explicitly covers 'a duplicate zone_code inside one warehouse's zones array' even though nothing persisted yet for it to collide with"
            - "the duplicate is caught despite the body being otherwise impeccable — 5.0000 + 5.0000 == 10.0000 satisfies the capacity-sum constraint exactly, so no other check can explain the refusal"
            - "WH-CVD1 with zones Z1 4.0000 and Z2 6.0000 returns 201 with committed_cube_m3 0.0000, utilization_pct 0.00, posture NORMAL and the defaulted restricted_threshold_pct 85.00 / frozen_threshold_pct 95.00"
            - "WH-CVD2 returns 201 with its own zone Z1: the zone_code Z1 already exists at WH-CVD1, which proves the uniqueness scope is one warehouse's array and not the whole plant — an implementation with a global zone index would wrongly reject this"
            - "the LogisticsPlanner role is accepted on that create, matching the endpoint's roles [PlantAdmin, LogisticsPlanner], so the 201 also clears rung 3"
            - "the second WH-CVD1 fails 409 ERR_DUPLICATE_CODE with a completely distinct zones array: site_code IS global, which is the contrast that makes the zone scoping falsifiable rather than incidental"
            - "WH-CVD-SUM fails 422 ERR_VALIDATION with unique zone codes but round(4.0000 + 5.0000, 4) == 9.0000 != footprint_capacity_cube_m3 10.0000; audit note: this consistency check is declared on the Warehouse.footprint_capacity_cube_m3 field and has no dedicated rung in the priority ladder, so this instance keeps it in a body that violates nothing else and asserts no ordering against rung 26"
            - "the two footprint summaries confirm only the two accepted sites exist, WH-CVD1 listing zones Z1 remaining 4.0000 and Z2 remaining 6.0000 with stored_unit_count 0 and blocked_production_order_count 0, and WH-CVD2 listing the single zone Z1 remaining 3.0000"

      # =======================================================================
      # VALIDATION CORNERS ALREADY PROBED BY §1.8 — stubs only, no recipe.
      # Each cites the one difficulty instance that already exercises it.
      # =======================================================================
      - name: val_priority_conflict_pair1_order_not_schedulable_beats_oven_window
        claim_type: "Priority conflict"
        grounds:
          - validation_rules.priority_34
          - validation_rules.priority_62
          - errors.ERR_ORDER_NOT_SCHEDULABLE
          - errors.ERR_OVEN_WINDOW_CONFLICT
          - endpoints.POST_/molding-cycles
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pair1_order_not_schedulable_beats_oven_window_conflict"
          rationale: "§1.8 already builds the doubly-invalid schedule request — a BLOCKED_WAREHOUSE order asking for an arm span that a SCHEDULED cycle already occupies — and shows ERR_ORDER_NOT_SCHEDULABLE winning, then reaches each member alone. A breadth restatement would add no §1.5 surface: V14 already exercises this endpoint's capacity rungs with 34 and 62 deliberately satisfied, which is the complementary observation."
      - name: val_priority_conflict_pair2_regrind_limit_beats_resin_insufficient
        claim_type: "Priority conflict"
        grounds:
          - validation_rules.priority_52
          - validation_rules.priority_72
          - errors.ERR_REGRIND_LIMIT_EXCEEDED
          - errors.ERR_RESIN_INSUFFICIENT
          - endpoints.POST_/resin-charges
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pair2_regrind_limit_beats_resin_insufficient"
          rationale: "§1.8 already posts one charge that both busts the post-add blend ceiling and exceeds available_kg, proving the business_safety rung answers before the fiscal one, and then isolates each. V9 covers the same endpoint's OTHER ordering (rung 51 above rung 72) and V4 drives its tolerance rung at the bound, so the charge endpoint is not under-probed by this exclusion."
      - name: val_priority_conflict_pair5_storage_review_incomplete_beats_term_expired
        claim_type: "Priority conflict"
        grounds:
          - validation_rules.priority_55
          - validation_rules.priority_64
          - errors.ERR_STORAGE_REVIEW_INCOMPLETE
          - errors.ERR_WARRANTY_TERM_EXPIRED
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/approve
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pair5_storage_review_incomplete_beats_warranty_term_expired"
          rationale: "§1.8 already approves a 61-month-old hull whose storage review is still NOT_STARTED and shows ERR_STORAGE_REVIEW_INCOMPLETE rather than the term error, then walks each member out on its own including the inclusive month-60 boundary. V7 and V12 exercise this endpoint from the reserve and deduction side with both rungs satisfied, so the approve surface is covered without duplicating the pair."
      - name: val_violation_resin_lot_quarantined_blocks_charge_creation
        claim_type: "Violation → Error"
        grounds:
          - validation_rules.priority_36
          - errors.ERR_RESIN_LOT_NOT_AVAILABLE
          - state_machines.ResinLot
          - endpoints.POST_/resin-charges
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / production_order_blocks_on_resin_lot_quarantine_and_unblocks_on_release"
          rationale: "§1.8 already quarantines a lot mid-flight, watches CASCADE-F release the RESERVED charges and abort their cycles, proves a fresh charge on the quarantined lot is refused, and then releases the lot and re-charges successfully. Repeating the plain refusal here would restate one link of that cascade; V9 already covers the lot-eligibility rungs that sit BELOW the status rung on the same endpoint."
      - name: val_cross_entity_store_gated_by_warehouse_frozen_posture
        claim_type: "Cross-entity validation"
        grounds:
          - validation_rules.priority_40
          - errors.ERR_WAREHOUSE_FROZEN
          - calculations.warehouse_footprint_posture
          - endpoints.POST_/finished-units/{finished_unit_id}/store
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / finished_unit_store_gated_by_warehouse_frozen_posture"
          rationale: "§1.8 already drives a site into FROZEN, refuses the next store on a perfectly SELLABLE hull, empties the site so the posture relaxes and lets the identical store succeed — the full cross-entity round trip. V6 reuses the frozen posture only as the WINNER of a three-way rung conflict (40 over 74 over 73), which is a different claim from the gate itself."
      - name: val_satisfaction_frozen_threshold_rounded_boundary_admits_the_store
        claim_type: "Satisfaction → Pass"
        grounds:
          - validation_rules.priority_40
          - calculations.warehouse_footprint_posture
          - endpoints.POST_/finished-units/{finished_unit_id}/store
        excluded_because:
          difficulty_instance: "boundary_precision_check / warehouse_frozen_threshold_rounded_95_00_freezes_vs_95_01_threshold"
          rationale: "The satisfaction side of the posture gate is exactly what §1.8 pins: the store that lands ON the rounded 95.00 threshold is ACCEPTED and only freezes the site afterwards, while 95.01 is the next unit's problem. V17 observes the same accept-then-freeze order at 100.00 as a by-product of the zone cascade, so the passing face is doubly covered without a dedicated instance."
      - name: val_temporal_oven_arm_buffered_window_conflict
        claim_type: "Temporal validation"
        grounds:
          - validation_rules.priority_62
          - errors.ERR_OVEN_WINDOW_CONFLICT
          - calculations.oven_arm_window_check
          - endpoints.POST_/molding-cycles
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / oven_arm_half_open_span_with_symmetric_changeover_buffer"
          rationale: "§1.8 already probes the buffered half-open arm span from both sides — abutting at the buffer edge accepted, one minute inside rejected, and the same clock times on a different arm_index accepted — which is the whole content of rung 62. V11 covers this endpoint's other temporal rung (63, oven_start_at against the clock) at its equality boundary instead."
      - name: val_aggregate_cooling_bay_slot_capacity_on_the_closed_window
        claim_type: "Aggregate validation"
        grounds:
          - validation_rules.priority_71
          - errors.ERR_COOLING_BAY_CAPACITY_EXCEEDED
          - calculations.cooling_bay_slot_check
          - endpoints.POST_/molding-cycles
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / cooling_bay_closed_interval_aggregate_slot_capacity"
          rationale: "§1.8 already fills a bay to its concurrent_slot_capacity, shows the touching CLOSED-interval neighbour counted as an overlap (where a half-open reading would have admitted it), and frees a slot to let the refused body through. V14 keeps a free cooling slot deliberately available so that rung 71 is satisfied while rung 79 binds, which is the complementary use of the same aggregate."
      - name: val_violation_no_eligible_mold_occupancy_versus_capability
        claim_type: "Violation → Error"
        grounds:
          - validation_rules.priority_70
          - errors.ERR_NO_ELIGIBLE_MOLD
          - errors.ERR_MOLD_WINDOW_CONFLICT
          - calculations.mold_selection
          - endpoints.POST_/molding-cycles
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / mold_half_open_oven_plus_cooling_span_occupancy_vs_capability"
          rationale: "§1.8 already separates the two failure faces of rung 70 — every capable tool busy over the oven-plus-cooling span yields ERR_MOLD_WINDOW_CONFLICT, no capable tool at all yields ERR_NO_ELIGIBLE_MOLD — across the half-open span boundary. V14 exercises the selector's SUCCESS path with its deterministic mold_code ASC tie-break, so the endpoint keeps coverage on both sides."
      - name: val_satisfaction_six_measurements_accepted_five_rejected
        claim_type: "Satisfaction → Pass"
        grounds:
          - validation_rules.priority_25
          - errors.ERR_INSUFFICIENT_MEASUREMENTS
          - calculations.wall_thickness_distribution
          - endpoints.POST_/finished-units/{finished_unit_id}/inspect
        excluded_because:
          difficulty_instance: "boundary_precision_check / inspection_measurement_count_six_accepted_vs_five_rejected"
          rationale: "§1.8 already inspects one hull with exactly six points (accepted, and the six-point sample then drives the CV verdict) and its sibling with five (refused with ERR_INSUFFICIENT_MEASUREMENTS and no build_status movement), which is both faces of the count rung. Every inspect call in this fragment carries six points, so the satisfying side is continuously re-exercised as a precondition."
      - name: val_violation_regrind_ceiling_exact_30_00_accepted_30_01_rejected
        claim_type: "Violation → Error"
        grounds:
          - validation_rules.priority_50
          - errors.ERR_REGRIND_LIMIT_EXCEEDED
          - calculations.qualified_resin_lot_count
          - endpoints.POST_/resin-charges
        excluded_because:
          difficulty_instance: "boundary_precision_check / regrind_ceiling_exact_30_00_pct_accepted_vs_30_01_rejected"
          rationale: "§1.8 already drives the lot-level regrind ceiling at both sides of its inclusive bound on one model, so a breadth instance would only restate the <= comparison. C3 and C12 keep the regrind figure in play from the calculation side — as the rounded blend percentage and as one conjunct of the eight-clause qualification predicate — which are different claims from the rung."
# =============================================================================
# §1.9 Scaffold Corner Design — FRAGMENT 3 of 3
# task_2645_rotational_molding_watercraft_plant
#
# Sections in this fragment: endpoints, errors, rbac,
#                            cross_cutting_complexity_layers, consistency_model
#
# Conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml §1.8)
# ---------------------------------------------------------------
#   * The logical clock starts at exactly 2026-08-01T00:00:00Z. Wherever an
#     endpoint takes an explicit actual timestamp AND stamps the clock, the
#     chain sets the clock first and passes the identical instant.
#   * Opaque roles act as the fixed audit ids "admin-1" / "planner-1" /
#     "agent-1"; §1.4 priority 1 requires a non-empty X-User-ID on EVERY call.
#   * Segregation of duties (§1.4 priority 57) is honoured: MOLDING_OPERATOR,
#     ASSEMBLY_TECH and QUALITY_INSPECTOR are always three distinct Technician
#     rows.
#   * Every expected_*_version is captured from a GET immediately before the
#     OCC call (or is a deliberately superseded capture, for stale tests).
#   * Production orders are created WITHOUT demand_bucket_id unless the
#     instance targets the build-ahead quota.
#   * All literal business codes in this fragment carry the "-CD-" infix
#     (PM-CD-KM, MLD-CD-1, OVN-CD-1, BAY-CD-1, T-CD-*, WH-CD, LOT-CD-1,
#     PO-CD-*, HK-CD-*, SHP-CD-*, CUS-CD-*, CLM-CD-*) so nothing can collide
#     with the §1.8 file's identifiers.
#   * YAML anchors prefixed "cd2_" carry the shared setup calls. Every anchor
#     is DEFINED in the endpoints section and only ALIASED afterwards, so the
#     merged document always defines before it references.
#
# Numeric literals in asserts were computed with python3 (Decimal,
# ROUND_HALF_UP) from the §1.3 formulas, never estimated.
# =============================================================================

  # ===========================================================================
  # SECTION — endpoints  (§1.5)
  #
  # Claim types drawn from claim-extraction-guide "From Table 5 (Endpoints)":
  # Standard CRUD, Action endpoint, Bulk action, Cross-reference link,
  # Computed read, Conditional action.
  #
  # NOTE on the "Bulk action" row: §1.5 declares no endpoint that accepts a
  # collection of ids or returns per-item status, so the row is vacuous for
  # this scaffold and no instance is invented for it. Likewise §1.0/§1.5
  # declare no method-not-allowed or unknown-path behaviour, so no such claim
  # is asserted.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: ep_response_envelope_success_and_error_shapes_on_one_resource
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.error
          - "endpoints.POST_/product-models"
          - "endpoints.GET_/product-models/{product_model_id}"
          - "errors[ERR_PRODUCT_MODEL_NOT_FOUND]"
        distinguishing_aspect: |
          Both halves of the §1.0 envelope are asserted on the same resource in
          one instance: the 201 create carries meta.api_request_id,
          meta.api_request_timestamp, response_type "object" and a data object,
          while the 404 read carries response_type "error" and puts error_id
          INSIDE data — there is no top-level "error" key on either shape.
        test_recipe:
          setup:
            - "Empty database. Logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &cd2_clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
          trigger:
            - &cd2_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CD-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 12.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id, pm_v: $.data.version }
            - call: "GET /product-models/pm-cd-does-not-exist"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the create response status is 201 and response_type is object"
            - "meta.api_request_id and meta.api_request_timestamp are both present and non-empty on the create response"
            - "ProductModel.${pm}.model_code == 'PM-CD-KM' and ProductModel.${pm}.version == 1"
            - "ProductModel.${pm}.warranty_reserve_cents == 500000 and ProductModel.${pm}.warranty_paid_cents == 0"
            - "the create response body has exactly the keys meta, response_type and data — no top-level error key"
            - "the GET /product-models/pm-cd-does-not-exist response status is 404 and response_type is error"
            - "the 404 response data.error_id == 'ERR_PRODUCT_MODEL_NOT_FOUND' and data.message is a non-empty string"
            - "the 404 response carries meta.api_request_id and meta.api_request_timestamp, and has no top-level error key"

      - name: ep_finished_unit_filtered_list_is_the_only_discovery_channel_for_its_fks
        claim_type: Cross-reference link
        grounds:
          - "endpoints.GET_/finished-units"
          - "endpoints.GET_/finished-units/{finished_unit_id}"
          - "endpoints.POST_/molding-cycles/{molding_cycle_id}/demold"
          - entities.FinishedUnit.fields.hull_serial
          - entities.FinishedUnit.fields.is_zone_anchor
        distinguishing_aspect: |
          FinishedUnit has no POST, so every one of the six foreign keys the
          demold cascade mints (molding_cycle_id, product_model_id,
          warehouse_id, outfitted_by_technician_id, inspected_by_technician_id,
          demand_bucket_id) must be reverse-reachable through
          GET /finished-units filters; the is_zone_anchor filter separates the
          anchor hull from its nested sibling inside the same zone.
        test_recipe:
          setup:
            - "ProductModel PM-CD-KM: KAYAK/MID, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 24.000, nominal_charge_kg 12.000, charge_tolerance_pct 5.00, min_cooling_minutes 30, wall_thickness_min_mm 4.50, wall_cv_max_pct 12.00, impact_test_min_joules 90.00, msrp_cents 180000, PRO_RATA_AGE, reserve 500000."
            - "Mold MLD-CD-1 for that model, cavity_count 2 so one demold mints two hulls, nominal_charge_kg 24.000, service_interval_cycles 10 so CASCADE-B never fires."
            - "OvenStation OVN-CD-1 (arm_count 2, changeover_buffer_min 15, energy_cents_per_min 100, max_size_class OVERSIZE) and CoolingBay BAY-CD-1 (concurrent_slot_capacity 2, airflow_mode FORCED_AIR), both OPERATIONAL."
            - "Four ACTIVE Technicians with distinct role_codes: RESIN_TECH (RESIN_BLENDING), MOLDING_OPERATOR, ASSEMBLY_TECH (FIXTURE_ASSEMBLY), QUALITY_INSPECTOR (WALL_GAUGE + IMPACT_RIG)."
            - "Warehouse WH-CD, footprint_capacity_cube_m3 20.0000, one zone Z-A of 20.0000, thresholds 85.00 / 95.00 so the site stays NORMAL."
            - "ResinLot LOT-CD-1 qualified for the model: HDPE_LINEAR, melt_index 4.00, colour exactly SEAFOAM, additive UV12, regrind 10.00 pct, 210 cents/kg, received 500.000 kg, expires 2027-12-31."
