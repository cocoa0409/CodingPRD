scenario: "Hose, Fittings & Hydraulic Shop Counter (Parker Store): assembly build to spec & crimp certification, pressure test & tagging, emergency mobile hose service, inventory of bulk hose & coupling combinations, application-error liability, customer hose-management program & inspection interval, price by assembly labor vs material, cut-length waste"

domain_name: "hose-fittings-hydraulic-counter"
api_prefix: "/api"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Customer company or contact name"
      - name: credit_hold
        type: boolean
        source: input
        description: "When true, order confirmation and dispatch creation are blocked"
        default: false
      - name: program_enrolled
        type: boolean
        source: input
        description: "Enrolled in the customer hose-management program"
        default: false
      - name: program_discount_pct
        type: number
        source: input
        description: "Fractional discount on assembly order totals (e.g. 0.10); applied only while program_status == ACTIVE"
        default: 0
      - name: inspection_interval_days
        type: integer
        source: input
        description: "Days between required hose inspections for this customer's assets"
        default: 365
        constraints: "must be >= 1"
      - name: compliance_score_strict
        type: number
        source: computed
        description: "Percent of ACTIVE assets whose compliance_posture is COMPLIANT or DUE_SOON; 100.00 when the customer has no ACTIVE assets; see calculations.compliance_score"
      - name: compliance_score_projected
        type: number
        source: computed
        description: "Lenient variant: additionally counts OVERDUE/NON_COMPLIANT assets that hold a SCHEDULED inspection whose scheduled_window_end >= current clock as compliant"
      - name: program_status
        type: enum
        source: computed
        description: "NONE when not enrolled; ACTIVE when enrolled and compliance_score_strict >= PROBATION_THRESHOLD; otherwise PROBATION"
        constraints: "NONE | ACTIVE | PROBATION"

  - name: EquipmentAsset
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owning customer"
      - name: asset_tag
        type: string
        source: input
        description: "Customer-visible machine label"
      - name: machine_type
        type: string
        source: input
        description: "Machine class (excavator, press, etc.)"
      - name: installed_at
        type: datetime
        source: input
        description: "Optional at create (program enrollment of an existing fleet); overwritten by system when an AssemblyOrder with this equipment_asset_id reaches COMPLETED"
        default: null
      - name: status
        type: enum
        source: input
        description: "Lifecycle of the asset"
        default: ACTIVE
        constraints: "ACTIVE | DECOMMISSIONED"
      - name: installed_assembly_order_id
        type: string
        source: system
        description: "FK -> AssemblyOrder.id; set when that order reaches COMPLETED for this asset"
        default: null
      - name: last_passed_inspection_at
        type: datetime
        source: system
        description: "Timestamp of the most recent PASSED inspection; null if none"
        default: null
      - name: next_due_date
        type: datetime
        source: computed
        description: "(last_passed_inspection_at if set else installed_at) + customer.inspection_interval_days; null when neither base exists"
      - name: compliance_posture
        type: enum
        source: computed
        description: "NON_COMPLIANT if latest completed inspection is FAILED with no later PASSED; else OVERDUE if clock > next_due_date; else DUE_SOON if next_due_date - clock <= DUE_SOON_DAYS; else COMPLIANT. DECOMMISSIONED assets keep last computed posture."
        constraints: "COMPLIANT | DUE_SOON | OVERDUE | NON_COMPLIANT"

  - name: Reel
    parent: null
    common_fields: true
    fields:
      - name: hose_sku
        type: string
        source: input
        description: "Bulk hose product code"
      - name: hose_diameter_in
        type: number
        source: input
        description: "Inner diameter in inches; selects labor rate tier"
      - name: working_pressure_psi
        type: integer
        source: input
        description: "Rated working pressure of the bulk hose"
      - name: price_per_meter_cents
        type: integer
        source: input
        description: "Material price per meter of cut hose"
      - name: initial_length_mm
        type: integer
        source: input
        description: "Reel length when received"
        constraints: "must be >= 1"
      - name: remaining_length_mm
        type: integer
        source: system
        description: "Unallocated length; initialized to initial_length_mm; debited at order confirm by (cut_length_mm + scrap_added_mm), restored on cancel from CONFIRMED"
      - name: scrap_length_mm
        type: integer
        source: system
        description: "Total remnant millimeters scrapped because a cut left < MIN_REMNANT_MM"
        default: 0
      - name: status
        type: enum
        source: system
        description: "AVAILABLE when remaining_length_mm >= LOW_THRESHOLD_MM; LOW when MIN_REMNANT_MM <= remaining < LOW_THRESHOLD_MM; DEPLETED when remaining < MIN_REMNANT_MM; RETIRED via retire action (terminal)"
        constraints: "AVAILABLE | LOW | DEPLETED | RETIRED"

  - name: Coupling
    parent: null
    common_fields: true
    fields:
      - name: coupling_sku
        type: string
        source: input
        description: "Fitting product code"
      - name: size_in
        type: number
        source: input
        description: "Fitting size in inches"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Sell price per fitting"
      - name: initial_on_hand_qty
        type: integer
        source: input
        description: "Starting stock at creation; seeds on_hand_qty"
        constraints: "must be >= 0"
      - name: on_hand_qty
        type: integer
        source: system
        description: "Physical stock; incremented by receipts, decremented when an order containing it reaches COMPLETED"
      - name: reserved_qty
        type: integer
        source: computed
        description: "Sum of AssemblyLine.quantity over orders in {CONFIRMED, BUILT, TEST_PASSED, TEST_FAILED, REWORK, TAGGED}"
      - name: available_qty
        type: integer
        source: computed
        description: "on_hand_qty - reserved_qty"

  - name: AssemblyOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; ordering customer"
      - name: reel_id
        type: string
        source: input
        description: "FK -> Reel.id; source reel for the cut"
      - name: equipment_asset_id
        type: string
        source: input
        description: "FK -> EquipmentAsset.id; optional target asset for installation"
        default: null
      - name: cut_length_mm
        type: integer
        source: input
        description: "Requested cut length"
        constraints: "must be >= 1"
      - name: required_working_pressure_psi
        type: integer
        source: input
        description: "Application working pressure; must not exceed reel.working_pressure_psi at confirm"
      - name: crimp_diameter_spec_mm
        type: number
        source: input
        description: "Required crimp diameter per die chart"
      - name: crimp_tolerance_mm
        type: number
        source: input
        description: "Allowed +/- tolerance on measured crimp diameter"
        default: 0.2
      - name: crimp_count
        type: integer
        source: input
        description: "Number of crimped ends"
        default: 2
      - name: estimated_labor_minutes
        type: integer
        source: input
        description: "Quoted labor estimate; drives the provisional price variant"
      - name: is_emergency
        type: boolean
        source: input
        description: "Emergency/after-hours build; labor multiplied by EMERGENCY_LABOR_MULT"
        default: false
      - name: application_error_suspected
        type: boolean
        source: input
        description: "Shop suspects customer misapplication; confirm requires waiver fields"
        default: false
      - name: waiver_signed
        type: boolean
        source: system
        description: "True once waiver_signed_by + waiver_liability_cents are supplied at confirm"
        default: false
      - name: waiver_signed_by
        type: string
        source: system
        description: "Name captured on the application-error liability waiver"
        default: null
      - name: waiver_liability_cents
        type: integer
        source: system
        description: "Liability cap recorded on the waiver"
        default: null
      - name: measured_crimp_diameter_mm
        type: number
        source: system
        description: "Measured crimp diameter recorded at complete-build"
        default: null
      - name: actual_labor_minutes
        type: integer
        source: system
        description: "Actual labor recorded at complete-build; drives the final price variant"
        default: null
      - name: test_pressure_psi
        type: integer
        source: system
        description: "Pressure applied at the recorded pressure test"
        default: null
      - name: test_result
        type: enum
        source: system
        description: "PASSED | FAILED as recorded at record-pressure-test"
        default: null
        constraints: "PASSED | FAILED"
      - name: tag_serial
        type: string
        source: system
        description: "Certification tag serial; unique across all non-CANCELLED orders"
        default: null
      - name: scrap_charged_mm
        type: integer
        source: system
        description: "Remnant millimeters scrapped and charged to this order at confirm (0 when the remnant is >= MIN_REMNANT_MM or exactly 0)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state; see state_machines.AssemblyOrder"
        constraints: "DRAFT | CONFIRMED | BUILT | TEST_PASSED | TEST_FAILED | REWORK | TAGGED | COMPLETED | CANCELLED"
      - name: material_hose_cents
        type: integer
        source: computed
        description: "round_half_up(cut_length_mm / 1000 * reel.price_per_meter_cents); computed at create"
      - name: material_couplings_cents
        type: integer
        source: computed
        description: "Sum of AssemblyLine.line_total_cents for this order"
      - name: waste_surcharge_cents
        type: integer
        source: computed
        description: "round_half_up(scrap_charged_mm / 1000 * reel.price_per_meter_cents)"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Provisional variant of assembly_price using estimated_labor_minutes; fixed at create"
      - name: final_total_cents
        type: integer
        source: computed
        description: "Final variant of assembly_price using actual_labor_minutes; null until the order reaches COMPLETED"
        default: null

  - name: AssemblyLine
    parent: null
    common_fields: false
    fields:
      - name: assembly_order_id
        type: string
        source: input
        description: "FK -> AssemblyOrder.id; owning order (lines are supplied in the create payload)"
      - name: coupling_id
        type: string
        source: input
        description: "FK -> Coupling.id; fitting being reserved"
      - name: quantity
        type: integer
        source: input
        description: "Number of fittings"
        constraints: "must be >= 1"
      - name: unit_price_cents
        type: integer
        source: system
        description: "Price snapshot copied from Coupling.unit_price_cents at order creation"
      - name: line_total_cents
        type: integer
        source: computed
        description: "quantity * unit_price_cents (integer cents, no rounding needed)"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: equipment_asset_id
        type: string
        source: input
        description: "FK -> EquipmentAsset.id; asset under inspection (path parent)"
      - name: inspector_name
        type: string
        source: input
        description: "Inspector of record"
        default: null
      - name: scheduled_window_start
        type: datetime
        source: input
        description: "Inspection window start; closed-interval semantics on the same asset"
      - name: scheduled_window_end
        type: datetime
        source: input
        description: "Inspection window end; must be strictly after scheduled_window_start"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle state; see state_machines.Inspection"
        constraints: "SCHEDULED | IN_PROGRESS | PASSED | FAILED | SUPERSEDED"
      - name: result
        type: enum
        source: system
        description: "PASSED | FAILED as recorded at complete"
        default: null
        constraints: "PASSED | FAILED"
      - name: performed_at
        type: datetime
        source: system
        description: "Logical clock timestamp at complete"
        default: null
      - name: was_overdue
        type: boolean
        source: system
        description: "True when performed_at > asset.next_due_date (strictly greater; equal is on time) at completion"
        default: false

  - name: ServiceDispatch
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; customer requesting emergency service"
      - name: equipment_asset_id
        type: string
        source: input
        description: "FK -> EquipmentAsset.id; optional machine being serviced"
        default: null
      - name: van_id
        type: string
        source: input
        description: "Service van identifier; half-open window overlap is enforced per van"
      - name: window_start
        type: datetime
        source: input
        description: "Dispatch window start (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "Dispatch window end (exclusive); must be strictly after window_start"
      - name: status
        type: enum
        source: system
        description: "Dispatch lifecycle state; see state_machines.ServiceDispatch"
        constraints: "REQUESTED | DISPATCHED | ON_SITE | COMPLETED | ABORTED"
      - name: installed_assembly_order_id
        type: string
        source: input
        description: "FK -> AssemblyOrder.id; optionally supplied at complete; must reference a TAGGED order of the same customer, which is then transitioned to COMPLETED"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AssemblyOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /api/assembly-orders/{id}/confirm"
        actor: CounterSales
        preconditions:
          - "reel.status IN {AVAILABLE, LOW}"
          - "order.cut_length_mm <= reel.remaining_length_mm"
          - "for every line: line.quantity <= coupling.available_qty"
          - "order.required_working_pressure_psi <= reel.working_pressure_psi"
          - "if order.application_error_suspected then payload supplies waiver_signed_by and waiver_liability_cents"
          - "customer.credit_hold == false"
        side_effects:
          - "reel.remaining_length_mm -= (cut_length_mm + scrap_added_mm); scrap_added_mm = (remaining_after > 0 AND remaining_after < MIN_REMNANT_MM) ? remaining_after : 0; reel.scrap_length_mm += scrap_added_mm; order.scrap_charged_mm = scrap_added_mm; order.waste_surcharge_cents recomputed"
          - "reel.status recomputed from remaining_length_mm (AVAILABLE/LOW/DEPLETED)"
          - "for every line: coupling reservation takes effect (coupling.reserved_qty includes this order while in CONFIRMED)"
          - "if waiver fields present: waiver_signed = true, waiver_signed_by / waiver_liability_cents stored"
      - from: CONFIRMED
        to: BUILT
        trigger: "POST /api/assembly-orders/{id}/complete-build"
        actor: ShopTechnician
        preconditions:
          - "abs(measured_crimp_diameter_mm - crimp_diameter_spec_mm) <= crimp_tolerance_mm"
        side_effects:
          - "measured_crimp_diameter_mm and actual_labor_minutes stored"
      - from: REWORK
        to: BUILT
        trigger: "POST /api/assembly-orders/{id}/complete-build"
        actor: ShopTechnician
        preconditions:
          - "abs(measured_crimp_diameter_mm - crimp_diameter_spec_mm) <= crimp_tolerance_mm"
        side_effects:
          - "measured_crimp_diameter_mm and actual_labor_minutes overwritten (rework rebuild)"
      - from: BUILT
        to: TEST_PASSED
        trigger: "POST /api/assembly-orders/{id}/record-pressure-test with result = PASSED"
        actor: ShopTechnician
        preconditions:
          - "test_pressure_psi >= TEST_PRESSURE_MULTIPLIER * required_working_pressure_psi"
        side_effects:
          - "test_pressure_psi and test_result = PASSED stored"
      - from: BUILT
        to: TEST_FAILED
        trigger: "POST /api/assembly-orders/{id}/record-pressure-test with result = FAILED"
        actor: ShopTechnician
        preconditions:
          - "test_pressure_psi >= TEST_PRESSURE_MULTIPLIER * required_working_pressure_psi"
        side_effects:
          - "test_pressure_psi and test_result = FAILED stored"
      - from: TEST_FAILED
        to: REWORK
        trigger: "POST /api/assembly-orders/{id}/rework"
        actor: ShopTechnician
        preconditions: []
        side_effects:
          - "reel lengths and coupling reservations are NOT altered by rework (cut already committed)"
      - from: TEST_PASSED
        to: TAGGED
        trigger: "POST /api/assembly-orders/{id}/tag"
        actor: ShopTechnician
        preconditions:
          - "tag_serial not present on any other order whose status != CANCELLED"
        side_effects:
          - "tag_serial stored"
      - from: TAGGED
        to: COMPLETED
        trigger: "POST /api/assembly-orders/{id}/complete OR POST /api/service-dispatches/{id}/complete with installed_assembly_order_id"
        actor: CounterSales
        preconditions: []
        side_effects:
          - "final_total_cents computed via assembly_price final variant (actual_labor_minutes)"
          - "for every line: coupling.on_hand_qty -= line.quantity; reservation released (coupling.reserved_qty recomputed)"
          - "if equipment_asset_id present: asset.installed_assembly_order_id = this order; asset.installed_at = current clock; asset.next_due_date recomputed; asset.compliance_posture recomputed; customer.compliance_score_strict / compliance_score_projected / program_status recomputed"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/assembly-orders/{id}/cancel"
        actor: CounterSales
        preconditions: []
        side_effects:
          - "no inventory was committed; nothing is restored"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/assembly-orders/{id}/cancel"
        actor: CounterSales
        preconditions: []
        side_effects:
          - "reel.remaining_length_mm += (cut_length_mm + scrap_charged_mm); reel.scrap_length_mm -= scrap_charged_mm"
          - "reel.status recomputed from remaining_length_mm (a DEPLETED reel can return to AVAILABLE/LOW)"
          - "coupling reservations released (coupling.reserved_qty recomputed)"
      - from: BUILT
        to: CANCELLED
        trigger: "POST /api/assembly-orders/{id}/cancel"
        actor: CounterSales
        preconditions: []
        side_effects:
          - "coupling reservations released; reel lengths NOT restored (hose already cut and crimped)"
      - from: TEST_PASSED
        to: CANCELLED
        trigger: "POST /api/assembly-orders/{id}/cancel"
        actor: CounterSales
        preconditions: []
        side_effects:
          - "coupling reservations released; reel lengths NOT restored"
      - from: TEST_FAILED
        to: CANCELLED
        trigger: "POST /api/assembly-orders/{id}/cancel"
        actor: CounterSales
        preconditions: []
        side_effects:
          - "coupling reservations released; reel lengths NOT restored"
      - from: REWORK
        to: CANCELLED
        trigger: "POST /api/assembly-orders/{id}/cancel"
        actor: CounterSales
        preconditions: []
        side_effects:
          - "coupling reservations released; reel lengths NOT restored"
      - from: TAGGED
        to: CANCELLED
        trigger: "POST /api/assembly-orders/{id}/cancel"
        actor: CounterSales
        preconditions: []
        side_effects:
          - "coupling reservations released; tag_serial freed; reel lengths NOT restored"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/inspections/{id}/start"
        actor: FieldTechnician
        preconditions:
          - "equipment_asset.status == ACTIVE"
        side_effects: []
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /api/inspections/{id}/complete with result = PASSED"
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "performed_at = current clock; was_overdue = (asset.next_due_date != null AND performed_at > asset.next_due_date)"
          - "asset.last_passed_inspection_at = performed_at; asset.next_due_date recomputed"
          - "asset.compliance_posture recomputed"
          - "customer.compliance_score_strict / compliance_score_projected / program_status recomputed"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /api/inspections/{id}/complete with result = FAILED"
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "performed_at = current clock; was_overdue = (asset.next_due_date != null AND performed_at > asset.next_due_date)"
          - "asset.compliance_posture recomputed (becomes NON_COMPLIANT until a later PASSED)"
          - "customer.compliance_score_strict / compliance_score_projected / program_status recomputed (program_status flips to PROBATION when strict < PROBATION_THRESHOLD)"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system: a new Inspection is created for the same equipment_asset_id via POST /api/equipment-assets/{id}/inspections"
        actor: system
        preconditions: []
        side_effects:
          - "all prior SCHEDULED inspections of the same asset move to SUPERSEDED atomically with the create"

  - entity: ServiceDispatch
    initial_state: REQUESTED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /api/service-dispatches/{id}/advance"
        actor: FieldTechnician
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /api/service-dispatches/{id}/advance"
        actor: FieldTechnician
        preconditions: []
        side_effects: []
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /api/service-dispatches/{id}/complete"
        actor: FieldTechnician
        preconditions:
          - "if installed_assembly_order_id supplied: that order exists, belongs to the same customer_id, and its status == TAGGED"
        side_effects:
          - "if installed_assembly_order_id supplied: the referenced AssemblyOrder transitions TAGGED -> COMPLETED with all of that transition's side effects (final pricing, coupling on_hand decrement, asset installation, score recompute)"
      - from: REQUESTED
        to: ABORTED
        trigger: "POST /api/service-dispatches/{id}/abort"
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "van window freed (ABORTED dispatches no longer participate in overlap checks)"
      - from: DISPATCHED
        to: ABORTED
        trigger: "POST /api/service-dispatches/{id}/abort"
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "van window freed"

  - entity: Reel
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: LOW
        trigger: "system: remaining_length_mm falls below LOW_THRESHOLD_MM after an order confirm"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: remaining_length_mm falls below MIN_REMNANT_MM after an order confirm"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOW
        to: DEPLETED
        trigger: "system: remaining_length_mm falls below MIN_REMNANT_MM after an order confirm"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system: remaining_length_mm restored to >= LOW_THRESHOLD_MM by a cancel from CONFIRMED"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: LOW
        trigger: "system: remaining_length_mm restored into [MIN_REMNANT_MM, LOW_THRESHOLD_MM) by a cancel from CONFIRMED"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOW
        to: AVAILABLE
        trigger: "system: remaining_length_mm restored to >= LOW_THRESHOLD_MM by a cancel from CONFIRMED"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /api/reels/{id}/retire"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "reel can no longer be confirmed against (ERR_REEL_NOT_USABLE); existing committed orders are unaffected"
      - from: LOW
        to: RETIRED
        trigger: "POST /api/reels/{id}/retire"
        actor: ShopManager
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: RETIRED
        trigger: "POST /api/reels/{id}/retire"
        actor: ShopManager
        preconditions: []
        side_effects: []

  - entity: EquipmentAsset
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /api/equipment-assets/{id}/decommission"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "asset excluded from customer compliance score denominators; new inspections and order installs rejected with ERR_ASSET_NOT_ACTIVE"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: inspection-create-stale-asset
    parent_entity: EquipmentAsset
    write_endpoint: "POST /api/equipment-assets/{id}/inspections"
    occ_field: expected_equipment_asset_version
    description: |
      Creating an Inspection against an EquipmentAsset whose version has
      advanced since the client last observed it is rejected. Creating an
      Inspection legitimately supersedes any prior SCHEDULED inspection on the
      asset and bumps the asset version, so a second create carrying the
      previously observed version is operating on a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: assembly_price
    trigger: "provisional variant at POST /api/assembly-orders (writes quoted_total_cents); final variant at the TAGGED -> COMPLETED transition (writes final_total_cents)"
    algorithm: tiered_pricing
    formula: |
      material_hose_cents = round_half_up(cut_length_mm / 1000 * reel.price_per_meter_cents)   # rounded to whole cents BEFORE summing
      material_couplings_cents = sum(line.line_total_cents)                                    # integer cents already
      rate = LABOR_RATE_STD_CPM if reel.hose_diameter_in <= DIA_STD_MAX_IN
             else LABOR_RATE_MID_CPM if reel.hose_diameter_in <= DIA_MID_MAX_IN
             else LABOR_RATE_HIGH_CPM
      minutes = estimated_labor_minutes (provisional) | actual_labor_minutes (final)
      labor_cents = round_half_up(minutes * rate * (EMERGENCY_LABOR_MULT if is_emergency else 1.0))
      waste_surcharge_cents = round_half_up(scrap_charged_mm / 1000 * reel.price_per_meter_cents)
      subtotal = material_hose_cents + material_couplings_cents + labor_cents + waste_surcharge_cents
      discount_cents = round_half_up(subtotal * customer.program_discount_pct) if customer.program_status == ACTIVE else 0
      total = subtotal - discount_cents
    input_set: "the AssemblyOrder, its Reel, its AssemblyLines, and its Customer"
    constants:
      LABOR_RATE_STD_CPM: 150
      LABOR_RATE_MID_CPM: 200
      LABOR_RATE_HIGH_CPM: 260
      DIA_STD_MAX_IN: 0.5
      DIA_MID_MAX_IN: 1.0
      EMERGENCY_LABOR_MULT: 1.5
    precision: "all monetary fields integer cents; round_half_up applied per component BEFORE summing (see assembly_invoice_total for the pinned rounding order)"
    variants:
      - name: provisional
        when: "at order creation (DRAFT) and until completion"
        difference: "uses estimated_labor_minutes; labor known only by estimate, so quoted_total_cents diverges from final_total_cents whenever actual != estimated"
      - name: final
        when: "at the TAGGED -> COMPLETED transition"
        difference: "uses actual_labor_minutes recorded at complete-build; written to final_total_cents"

  - name: assembly_invoice_total
    trigger: "inside assembly_price, whenever a total (quoted or final) is produced"
    algorithm: aggregation
    formula: |
      # Pinned rounding order (round per component, then sum; discount last):
      # 1. round_half_up(material hose)  -> integer cents
      # 2. line totals are integer cents (quantity * unit_price_cents), summed exactly
      # 3. round_half_up(labor)          -> integer cents
      # 4. round_half_up(waste surcharge)-> integer cents
      # 5. subtotal = 1 + 2 + 3 + 4      (integer sum, no further rounding)
      # 6. discount = round_half_up(subtotal * program_discount_pct) if program ACTIVE
      # 7. total = subtotal - discount
      # Rounding only the final sum (no per-component rounding) yields different
      # cents whenever hose and waste both carry fractional cents; this order is
      # pinned and the alternative is NOT permitted.
    input_set: "components of one AssemblyOrder"
    constants: {}
    precision: "integer cents, round_half_up per component"

  - name: cut_waste_allocation
    trigger: "AssemblyOrder DRAFT -> CONFIRMED transition"
    algorithm: threshold
    formula: |
      remaining_after = reel.remaining_length_mm - cut_length_mm
      if remaining_after == 0:
          scrap_added_mm = 0                      # clean cut; reel becomes DEPLETED
      elif remaining_after < MIN_REMNANT_MM:
          scrap_added_mm = remaining_after        # remnant too short to reuse; scrapped and charged
      else:
          scrap_added_mm = 0                      # remnant >= MIN_REMNANT_MM stays on the reel
      reel.remaining_length_mm -= (cut_length_mm + scrap_added_mm)
      reel.scrap_length_mm += scrap_added_mm
      order.scrap_charged_mm = scrap_added_mm
      # reel.status then recomputed: DEPLETED if remaining < MIN_REMNANT_MM,
      # LOW if < LOW_THRESHOLD_MM, else AVAILABLE
    input_set: "the confirming AssemblyOrder and its Reel"
    constants:
      MIN_REMNANT_MM: 1000
      LOW_THRESHOLD_MM: 20000
    precision: "integer millimeters, no rounding"

  - name: next_due_date
    trigger: "asset creation with installed_at; AssemblyOrder TAGGED -> COMPLETED with equipment_asset_id; Inspection completion with result PASSED"
    algorithm: chronological
    formula: |
      base = asset.last_passed_inspection_at if set else asset.installed_at
      next_due_date = base + customer.inspection_interval_days (days), or null when base is null
    input_set: "the EquipmentAsset and its Customer"
    constants: {}
    precision: "datetime, day granularity"

  - name: compliance_score
    trigger: "Inspection completion (either result); asset installation; asset decommission; read of Customer"
    algorithm: aggregation
    formula: |
      eligible = assets of the customer with status == ACTIVE
      strict_compliant = eligible whose compliance_posture IN {COMPLIANT, DUE_SOON}
      compliance_score_strict = 100.0 * len(strict_compliant) / len(eligible); 100.00 when eligible is empty
      projected_compliant = strict_compliant + (eligible with posture IN {OVERDUE, NON_COMPLIANT}
        that hold at least one Inspection with status == SCHEDULED and scheduled_window_end >= current clock)
      compliance_score_projected = 100.0 * len(projected_compliant) / len(eligible); 100.00 when eligible is empty
      program_status = NONE if not program_enrolled
                       else ACTIVE if compliance_score_strict >= PROBATION_THRESHOLD
                       else PROBATION
    input_set: "EquipmentAssets of one Customer (status == ACTIVE only) and their SCHEDULED Inspections"
    constants:
      PROBATION_THRESHOLD: 70
      DUE_SOON_DAYS: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict
        when: "compliance_score_strict and program_status derivation; gates the program discount"
        difference: "only currently-compliant postures count; OVERDUE/NON_COMPLIANT assets drag the score down now"
      - name: projected
        when: "compliance_score_projected (forward-looking program health)"
        difference: "OVERDUE/NON_COMPLIANT assets with a future-scheduled inspection count as compliant, so projected >= strict for identical data"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles; entity_backed Customer role may only touch resources whose customer_id equals X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path ids and body foreign keys reference existing resources (customer_id, reel_id, equipment_asset_id, coupling_id in lines, installed_assembly_order_id), validated left-to-right"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "all (specific variant per resource: ERR_ASSET_NOT_FOUND, ERR_REEL_NOT_FOUND, ERR_COUPLING_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_DISPATCH_NOT_FOUND)"
  - priority: 4
    category: state
    check: "AssemblyOrder is not COMPLETED or CANCELLED (terminal lockdown)"
    error_id: ERR_ORDER_TERMINAL
    http_status: 409
    applies_to: "POST /api/assembly-orders/{id}/confirm, complete-build, record-pressure-test, rework, tag, complete, cancel"
  - priority: 5
    category: state
    check: "target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "expected_equipment_asset_version matches the asset's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/equipment-assets/{id}/inspections"
  - priority: 7
    category: business_safety
    check: "required_working_pressure_psi <= reel.working_pressure_psi"
    error_id: ERR_PRESSURE_RATING_MISMATCH
    http_status: 422
    applies_to: "POST /api/assembly-orders/{id}/confirm"
  - priority: 8
    category: business_safety
    check: "application_error_suspected orders carry waiver_signed_by and waiver_liability_cents at confirm"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /api/assembly-orders/{id}/confirm"
  - priority: 9
    category: business_safety
    check: "abs(measured_crimp_diameter_mm - crimp_diameter_spec_mm) <= crimp_tolerance_mm"
    error_id: ERR_CRIMP_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /api/assembly-orders/{id}/complete-build"
  - priority: 10
    category: business_safety
    check: "test_pressure_psi >= TEST_PRESSURE_MULTIPLIER (2.0) * required_working_pressure_psi"
    error_id: ERR_TEST_PRESSURE_TOO_LOW
    http_status: 422
    applies_to: "POST /api/assembly-orders/{id}/record-pressure-test"
  - priority: 11
    category: business_temporal
    check: "window_end strictly after window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /api/service-dispatches, POST /api/equipment-assets/{id}/inspections"
  - priority: 12
    category: business_temporal
    check: "van half-open overlap: no other dispatch with same van_id and status IN {REQUESTED, DISPATCHED, ON_SITE} may satisfy (new.window_start < existing.window_end AND new.window_end > existing.window_start); touching endpoints are allowed"
    error_id: ERR_VAN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/service-dispatches"
  - priority: 13
    category: business_temporal
    check: "asset closed-interval overlap: no IN_PROGRESS inspection on the same asset may satisfy NOT(new.end < existing.start OR new.start > existing.end); touching endpoints count as overlap"
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/equipment-assets/{id}/inspections"
  - priority: 14
    category: business_constraint
    check: "tag_serial unique across all orders with status != CANCELLED"
    error_id: ERR_TAG_SERIAL_TAKEN
    http_status: 409
    applies_to: "POST /api/assembly-orders/{id}/tag"
  - priority: 15
    category: business_referential
    check: "reel.status IN {AVAILABLE, LOW} (not DEPLETED or RETIRED)"
    error_id: ERR_REEL_NOT_USABLE
    http_status: 422
    applies_to: "POST /api/assembly-orders/{id}/confirm"
  - priority: 16
    category: business_referential
    check: "equipment_asset.status == ACTIVE for new inspections, new orders targeting the asset, and installation at order completion"
    error_id: ERR_ASSET_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /api/equipment-assets/{id}/inspections, POST /api/inspections/{id}/start, POST /api/assembly-orders, POST /api/assembly-orders/{id}/complete"
  - priority: 17
    category: business_fiscal
    check: "customer.credit_hold == false"
    error_id: ERR_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /api/assembly-orders/{id}/confirm, POST /api/service-dispatches"
  - priority: 18
    category: business_fiscal
    check: "cut_length_mm <= reel.remaining_length_mm (equality allowed)"
    error_id: ERR_INSUFFICIENT_REEL_LENGTH
    http_status: 422
    applies_to: "POST /api/assembly-orders/{id}/confirm"
  - priority: 19
    category: business_fiscal
    check: "for every line: line.quantity <= coupling.available_qty at confirm time"
    error_id: ERR_INSUFFICIENT_COUPLING_STOCK
    http_status: 422
    applies_to: "POST /api/assembly-orders/{id}/confirm"
  - priority: 20
    category: existence
    check: "required request fields present; enum values valid; numeric ranges sane (malformed request bodies)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/api/customers"
    description: "Create a customer"
    roles: [ShopManager]
    code: 201
    input: [name, "credit_hold?", "program_enrolled?", "program_discount_pct?", "inspection_interval_days?"]
    output: Customer
    side_effects: ["compliance scores initialized to 100.00; program_status derived"]
  - method: GET
    path: "/api/customers/{id}"
    description: "Read a customer including computed compliance scores and program_status"
    roles: [ShopManager, CounterSales, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: PATCH
    path: "/api/customers/{id}"
    description: "Update customer flags (credit_hold, program enrollment, discount, interval)"
    roles: [ShopManager]
    code: 200
    input: ["name?", "credit_hold?", "program_enrolled?", "program_discount_pct?", "inspection_interval_days?"]
    output: Customer
    side_effects: ["program_status recomputed when enrollment or interval changes; next_due_date of assets recomputed when interval changes"]
  - method: POST
    path: "/api/equipment-assets"
    description: "Register a customer machine (optionally with installed_at for program enrollment of an existing fleet)"
    roles: [ShopManager, CounterSales]
    code: 201
    input: [customer_id, asset_tag, machine_type, "installed_at?"]
    output: EquipmentAsset
    side_effects: ["next_due_date and compliance_posture computed; customer scores recomputed"]
  - method: GET
    path: "/api/equipment-assets"
    description: "List assets with filters"
    roles: [ShopManager, CounterSales, ShopTechnician, FieldTechnician, Customer]
    code: 200
    input: ["customer_id?", "status?", "installed_assembly_order_id?", "limit?", "offset?"]
    output: EquipmentAsset[]
    side_effects: []
  - method: GET
    path: "/api/equipment-assets/{id}"
    description: "Read one asset"
    roles: [ShopManager, CounterSales, ShopTechnician, FieldTechnician, Customer]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: []
  - method: POST
    path: "/api/equipment-assets/{id}/decommission"
    description: "Decommission an asset (terminal)"
    roles: [ShopManager]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: ["customer compliance scores recomputed"]
  - method: POST
    path: "/api/equipment-assets/{id}/inspections"
    description: "Schedule an inspection; supersedes existing SCHEDULED inspections of the asset; OCC-guarded on the asset version"
    roles: [ShopManager, CounterSales]
    code: 201
    input: [expected_equipment_asset_version, scheduled_window_start, scheduled_window_end, "inspector_name?"]
    output: Inspection
    side_effects: ["prior SCHEDULED inspections of the asset -> SUPERSEDED", "increments EquipmentAsset.version by 1"]
  - method: GET
    path: "/api/equipment-assets/{id}/inspections"
    description: "List inspections of an asset"
    roles: [ShopManager, CounterSales, ShopTechnician, FieldTechnician, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/api/inspections/{id}/start"
    description: "Begin an inspection (requires asset ACTIVE)"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/api/inspections/{id}/complete"
    description: "Complete an inspection with a result; performed_at stamped from the logical clock"
    roles: [FieldTechnician]
    code: 200
    input: [result]
    output: Inspection
    side_effects: ["asset last_passed/next_due/posture recomputed on PASSED; posture -> NON_COMPLIANT on FAILED; customer scores and program_status recomputed"]
  - method: POST
    path: "/api/reels"
    description: "Receive a bulk hose reel"
    roles: [ShopManager]
    code: 201
    input: [hose_sku, hose_diameter_in, working_pressure_psi, price_per_meter_cents, initial_length_mm]
    output: Reel
    side_effects: ["remaining_length_mm = initial_length_mm; status derived"]
  - method: GET
    path: "/api/reels/{id}"
    description: "Read one reel"
    roles: [ShopManager, CounterSales, ShopTechnician]
    code: 200
    input: []
    output: Reel
    side_effects: []
  - method: POST
    path: "/api/reels/{id}/retire"
    description: "Retire a reel (terminal)"
    roles: [ShopManager]
    code: 200
    input: []
    output: Reel
    side_effects: []
  - method: POST
    path: "/api/couplings"
    description: "Register a coupling SKU with initial stock"
    roles: [ShopManager]
    code: 201
    input: [coupling_sku, size_in, unit_price_cents, initial_on_hand_qty]
    output: Coupling
    side_effects: ["on_hand_qty = initial_on_hand_qty"]
  - method: GET
    path: "/api/couplings/{id}"
    description: "Read one coupling including reserved/available"
    roles: [ShopManager, CounterSales, ShopTechnician]
    code: 200
    input: []
    output: Coupling
    side_effects: []
  - method: POST
    path: "/api/couplings/{id}/receipts"
    description: "Receive additional stock"
    roles: [ShopManager]
    code: 200
    input: [quantity]
    output: Coupling
    side_effects: ["on_hand_qty += quantity"]
  - method: GET
    path: "/api/couplings/{id}/assembly-lines"
    description: "List order lines referencing this coupling"
    roles: [ShopManager, CounterSales]
    code: 200
    input: ["limit?", "offset?"]
    output: AssemblyLine[]
    side_effects: []
  - method: POST
    path: "/api/assembly-orders"
    description: "Create an assembly order in DRAFT with optional coupling lines; provisional price computed"
    roles: [CounterSales, ShopManager]
    code: 201
    input: [customer_id, reel_id, "equipment_asset_id?", cut_length_mm, required_working_pressure_psi, crimp_diameter_spec_mm, "crimp_tolerance_mm?", "crimp_count?", estimated_labor_minutes, "is_emergency?", "application_error_suspected?", "lines?"]
    output: AssemblyOrder
    side_effects: ["AssemblyLines created with unit_price snapshot", "quoted_total_cents computed (provisional variant)"]
  - method: GET
    path: "/api/assembly-orders"
    description: "List orders with filters"
    roles: [ShopManager, CounterSales, ShopTechnician, Customer]
    code: 200
    input: ["customer_id?", "reel_id?", "equipment_asset_id?", "status?", "limit?", "offset?"]
    output: AssemblyOrder[]
    side_effects: []
  - method: GET
    path: "/api/assembly-orders/{id}"
    description: "Read one order"
    roles: [ShopManager, CounterSales, ShopTechnician, Customer]
    code: 200
    input: []
    output: AssemblyOrder
    side_effects: []
  - method: GET
    path: "/api/assembly-orders/{id}/lines"
    description: "List the order's coupling lines"
    roles: [ShopManager, CounterSales, ShopTechnician, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: AssemblyLine[]
    side_effects: []
  - method: POST
    path: "/api/assembly-orders/{id}/confirm"
    description: "Confirm a DRAFT order: validates safety/waiver/referential/fiscal rules, commits reel length (with waste scrap), reserves couplings"
    roles: [CounterSales, ShopManager]
    code: 200
    input: ["waiver_signed_by?", "waiver_liability_cents?"]
    output: AssemblyOrder
    side_effects: ["cut_waste_allocation applied to the reel", "reel status recomputed", "coupling reservations take effect", "waiver fields stored when supplied"]
  - method: POST
    path: "/api/assembly-orders/{id}/complete-build"
    description: "Record measured crimp diameter and actual labor; CONFIRMED or REWORK -> BUILT"
    roles: [ShopTechnician]
    code: 200
    input: [measured_crimp_diameter_mm, actual_labor_minutes]
    output: AssemblyOrder
    side_effects: []
  - method: POST
    path: "/api/assembly-orders/{id}/record-pressure-test"
    description: "Record pressure test; BUILT -> TEST_PASSED or TEST_FAILED per result"
    roles: [ShopTechnician]
    code: 200
    input: [test_pressure_psi, result]
    output: AssemblyOrder
    side_effects: ["test_pressure_psi and test_result stored"]
  - method: POST
    path: "/api/assembly-orders/{id}/rework"
    description: "Send a failed assembly back to build; TEST_FAILED -> REWORK"
    roles: [ShopTechnician]
    code: 200
    input: []
    output: AssemblyOrder
    side_effects: []
  - method: POST
    path: "/api/assembly-orders/{id}/tag"
    description: "Attach the certification tag serial; TEST_PASSED -> TAGGED"
    roles: [ShopTechnician]
    code: 200
    input: [tag_serial]
    output: AssemblyOrder
    side_effects: ["tag_serial stored (unique among non-CANCELLED orders)"]
  - method: POST
    path: "/api/assembly-orders/{id}/complete"
    description: "Complete a TAGGED order: final pricing, coupling stock decrement, asset installation cascade"
    roles: [CounterSales, ShopManager]
    code: 200
    input: []
    output: AssemblyOrder
    side_effects: ["final_total_cents computed (final variant)", "coupling on_hand_qty decremented per line", "asset installed_at/installed_assembly_order_id set, next_due and posture recomputed", "customer scores and program_status recomputed"]
  - method: POST
    path: "/api/assembly-orders/{id}/cancel"
    description: "Cancel a non-terminal order; inventory restoration depends on the from-state"
    roles: [CounterSales, ShopManager]
    code: 200
    input: []
    output: AssemblyOrder
    side_effects: ["from CONFIRMED: reel length and scrap restored, reel status recomputed, coupling reservations released", "from DRAFT: nothing to release", "from later states: coupling reservations released, reel NOT restored"]
  - method: POST
    path: "/api/service-dispatches"
    description: "Book an emergency mobile service window on a van (half-open overlap per van)"
    roles: [CounterSales, ShopManager]
    code: 201
    input: [customer_id, van_id, window_start, window_end, "equipment_asset_id?"]
    output: ServiceDispatch
    side_effects: []
  - method: GET
    path: "/api/service-dispatches"
    description: "List dispatches with filters"
    roles: [ShopManager, CounterSales, FieldTechnician]
    code: 200
    input: ["van_id?", "customer_id?", "equipment_asset_id?", "installed_assembly_order_id?", "status?", "limit?", "offset?"]
    output: ServiceDispatch[]
    side_effects: []
  - method: GET
    path: "/api/service-dispatches/{id}"
    description: "Read one dispatch"
    roles: [ShopManager, CounterSales, FieldTechnician]
    code: 200
    input: []
    output: ServiceDispatch
    side_effects: []
  - method: POST
    path: "/api/service-dispatches/{id}/advance"
    description: "Advance REQUESTED -> DISPATCHED -> ON_SITE"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: ServiceDispatch
    side_effects: []
  - method: POST
    path: "/api/service-dispatches/{id}/complete"
    description: "Complete from ON_SITE; optionally installs a TAGGED assembly order (which it transitions to COMPLETED)"
    roles: [FieldTechnician]
    code: 200
    input: ["installed_assembly_order_id?"]
    output: ServiceDispatch
    side_effects: ["referenced order TAGGED -> COMPLETED with all of that transition's side effects"]
  - method: POST
    path: "/api/service-dispatches/{id}/abort"
    description: "Abort from REQUESTED or DISPATCHED; frees the van window"
    roles: [FieldTechnician, ShopManager]
    code: 200
    input: []
    output: ServiceDispatch
    side_effects: []
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["all subsequent clock reads return the set instant until changed"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted on the endpoint, or Customer role accessing a resource owned by another customer"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Referenced customer id does not exist"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "Referenced equipment asset id does not exist"
  - id: ERR_REEL_NOT_FOUND
    http: 404
    condition: "Referenced reel id does not exist"
  - id: ERR_COUPLING_NOT_FOUND
    http: 404
    condition: "Referenced coupling id does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced assembly order id does not exist"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "Referenced inspection id does not exist"
  - id: ERR_DISPATCH_NOT_FOUND
    http: 404
    condition: "Referenced service dispatch id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, invalid enum value, or out-of-range numeric input"
  - id: ERR_INVALID_WINDOW
    http: 400
    condition: "window_end is not strictly after window_start"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state permitting the requested transition"
  - id: ERR_ORDER_TERMINAL
    http: 409
    condition: "AssemblyOrder already COMPLETED or CANCELLED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_equipment_asset_version does not match the asset's current version"
  - id: ERR_PRESSURE_RATING_MISMATCH
    http: 422
    condition: "required_working_pressure_psi exceeds reel.working_pressure_psi at confirm"
  - id: ERR_WAIVER_REQUIRED
    http: 422
    condition: "application_error_suspected order confirmed without waiver fields"
  - id: ERR_CRIMP_OUT_OF_TOLERANCE
    http: 422
    condition: "Measured crimp diameter outside spec +/- tolerance at complete-build"
  - id: ERR_TEST_PRESSURE_TOO_LOW
    http: 422
    condition: "test_pressure_psi below 2.0x required_working_pressure_psi at record-pressure-test"
  - id: ERR_TAG_SERIAL_TAKEN
    http: 409
    condition: "tag_serial already present on another non-CANCELLED order"
  - id: ERR_VAN_WINDOW_CONFLICT
    http: 409
    condition: "Van window overlaps another non-terminal dispatch on the same van (half-open semantics)"
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "Inspection window overlaps an IN_PROGRESS inspection on the same asset (closed semantics; touching counts)"
  - id: ERR_REEL_NOT_USABLE
    http: 422
    condition: "Reel is DEPLETED or RETIRED at confirm"
  - id: ERR_ASSET_NOT_ACTIVE
    http: 422
    condition: "Equipment asset is DECOMMISSIONED"
  - id: ERR_CREDIT_HOLD
    http: 402
    condition: "Customer is on credit hold"
  - id: ERR_INSUFFICIENT_REEL_LENGTH
    http: 422
    condition: "cut_length_mm exceeds reel.remaining_length_mm"
  - id: ERR_INSUFFICIENT_COUPLING_STOCK
    http: 422
    condition: "Line quantity exceeds coupling.available_qty at confirm"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Shop manager; owns catalog (reels, couplings), customers, program configuration; override on order/dispatch actions"
    identity: opaque
    exclusive_operations:
      - "POST /api/customers"
      - "PATCH /api/customers/{id}"
      - "POST /api/equipment-assets/{id}/decommission"
      - "POST /api/reels"
      - "POST /api/reels/{id}/retire"
      - "POST /api/couplings"
      - "POST /api/couplings/{id}/receipts"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "create/confirm/complete/cancel assembly orders"
      - "create/list/read dispatches"
      - "create inspections"
      - "read any resource"
  - name: CounterSales
    description: "Counter salesperson; quotes, confirms, completes, and cancels assembly orders; books emergency dispatches"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /api/assembly-orders, confirm, complete, cancel"
      - "POST /api/service-dispatches"
      - "POST /api/equipment-assets"
      - "POST /api/equipment-assets/{id}/inspections"
      - "read customers, assets, reels, couplings, orders, dispatches, inspections, lines"
  - name: ShopTechnician
    description: "Build/crimp/test technician; owns the build, pressure-test, rework, and tag steps"
    identity: opaque
    exclusive_operations:
      - "POST /api/assembly-orders/{id}/complete-build"
      - "POST /api/assembly-orders/{id}/record-pressure-test"
      - "POST /api/assembly-orders/{id}/rework"
      - "POST /api/assembly-orders/{id}/tag"
    shared_operations:
      - "read assets, reels, couplings, orders, lines, inspections"
  - name: FieldTechnician
    description: "Mobile service technician; advances/completes/aborts dispatches and performs inspections"
    identity: opaque
    exclusive_operations:
      - "POST /api/service-dispatches/{id}/advance"
      - "POST /api/service-dispatches/{id}/complete"
      - "POST /api/inspections/{id}/start"
      - "POST /api/inspections/{id}/complete"
    shared_operations:
      - "POST /api/service-dispatches/{id}/abort (shared with ShopManager)"
      - "read assets, dispatches, inspections"
  - name: Customer
    description: "Customer portal user; reads own account, assets, orders, and inspections only"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET /api/customers/{id} (self only)"
      - "GET /api/equipment-assets, /api/equipment-assets/{id}, /api/equipment-assets/{id}/inspections (own assets only)"
      - "GET /api/assembly-orders, /api/assembly-orders/{id}, /api/assembly-orders/{id}/lines (own orders only)"
