          setup:
            - "urologist, scheduler, nurse, pathology liaison; patient; room Cysto A (turnover 10)"
            - "type PROSTATE_BIOPSY: base_minutes 30, cleanup HIGH, CYSTO_SUITE, requires_specimen true, no prep codes, no antibiotic, no scope, no consignment"
