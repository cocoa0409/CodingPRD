            - "Asset.${t1}.current_location_id == null"
            - "Location.${a_id}.physical_balance == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hire_open_asset_referential_beats_credit_limit_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_ASSET_NOT_AVAILABLE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_referential (priority 8, ERR_ASSET_NOT_AVAILABLE) vs business_fiscal
          (priority 12, ERR_CREDIT_LIMIT_EXCEEDED): a hire open that BOTH targets a non-AVAILABLE
          asset (already ON_HIRE) AND would breach credit_limit returns ERR_ASSET_NOT_AVAILABLE
          because asset-availability (priority 8) precedes the fiscal check (priority 12).
        test_recipe:
          setup:
            - "Account credit_limit_cents=1 (any hire breaches fiscal); one asset already ON_HIRE on a first hire; attempt a second hire on the SAME already-on-hire asset"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 100000000 }
              as: PoolAdmin
              captures: { big_acct: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Tiny", role_type: "RETAILER", credit_limit_cents: 1 }
              as: PoolAdmin
              captures: { tiny_acct: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${big_acct}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "Q1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a1: $.data.id }
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
              captures: { l1_v: $.data.version }
            - call: "POST /hires"
              payload: { account_id: "${big_acct}", location_id: "${l1_id}", asset_type_id: "${at_id}", asset_ids: ["${a1}"], expected_location_version: "${l1_v}" }
              as: PoolOperator
              captures: { hire1: $.data.id }
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
              captures: { l1_v2: $.data.version }
          trigger:
            - call: "POST /hires"
              payload: { account_id: "${tiny_acct}", location_id: "${l1_id}", asset_type_id: "${at_id}", asset_ids: ["${a1}"], expected_location_version: "${l1_v2}" }
              as: PoolOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ASSET_NOT_AVAILABLE"
            - "response.status == 409"

      - name: finalize_audit_forbidden_role_beats_not_found
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_FOR_ROLE]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Category pair auth (priority 2, ERR_FORBIDDEN_FOR_ROLE) vs existence (priority 3,
          ERR_NOT_FOUND) — a DIFFERENT pair than business_referential-vs-business_fiscal above: a
          Participant (not permitted for audit finalize) calling finalize on a NON-existent audit id
          returns ERR_FORBIDDEN_FOR_ROLE because role authorization (priority 2) precedes existence
          (priority 3).
        test_recipe:
          setup:
            - "An Account exists so a Participant identity is available; no AuditReconciliation with the queried id exists"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /audit-reconciliations/00000000-0000-4000-8000-000000000000/finalize"
              payload: {}
              as: Participant
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "response.status == 403"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_exposure_equal_allowed_strict_over_rejected
        grounds:
          - validations[priority=12]
          - calculations.account_outstanding_charge
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
          - entities.Account.fields.credit_limit_cents
        distinguishing_aspect: |
          Numeric threshold metric on POST /hires: with day-1 reservation 5400 (12 assets, tiered
          rate 450), a credit_limit of exactly 5400 ALLOWS the hire (exposure == limit) while a
