  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: high_bank_deliverable_exactly_at_min_keeps_posture_open
        grounds:
          - calculations.station_safety_posture.MIN_HIGH_BANK_DELIVERABLE_KG
          - calculations.cascade_fill_allocation
          - entities.Station.fields.high_bank_deliverable_kg
          - state_machines.Station.OPEN_to_RESTRICTED
          - endpoints.POST_/dispense-sessions/{id}/complete
        distinguishing_aspect: |
          Metric under test is high_bank_deliverable_kg in kg against the numeric threshold
          MIN_HIGH_BANK_DELIVERABLE_KG = 10.000, exercised through POST /dispense-sessions/{id}/complete.
          The first fill lands the bank at EXACTLY 10.000 kg; the comparison is strict (`< MIN`), so the
          posture must remain OPEN. A second 0.100 kg fill takes the bank to 9.900 and the posture must
          then flip to RESTRICTED, so an implementation using `<=` fails on the first assert and one
          that never restricts fails on the second.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Station STN-K, nozzle_count 4, storage_capacity_kg 900.000, reserve_floor_kg 10.000, max_pressure_class H35, compressor_status ONLINE."
            - "A SINGLE HIGH vessel, water_volume_l 1250.0 (exactly 0.100 kg per bar), mawp_bar 1000.00, min_residual_bar 200.00, initial_pressure_bar 950.00 — onsite_inventory_kg 95.000, total_deliverable_kg 75.000, high_bank_deliverable_kg 75.000, safety_posture OPEN."
            - "Two current EMERGENCY_RESPONSE responder certifications."
            - "Session 1 opened for H35 with planned_kg 65.000 at ambient_temp_c 20.0 (required_precool_c -26.0) and fuelled at -30.0 C."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-K-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-K", name: "Boundary Yard K", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 10.000, max_pressure_class: "H35", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 1250.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-K-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-K-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version", hbd_before: "$.data.high_bank_deliverable_kg" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "HEAVY_TRUCK", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 65.000, ambient_temp_c: 20.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s1: "$.data.id", precool_req: "$.data.required_precool_c" }
            - call: "POST /dispense-sessions/${s1}/fuel"
              payload: { precool_temp_achieved_c: -30.0 }
              as: StationOperator
              as_user_id: "${st_id}"
          trigger:
            - call: "POST /dispense-sessions/${s1}/complete"
              payload: { metered_kg: 65.000, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { direct_1: "$.data.direct_cascade_kg", makeup_1: "$.data.compressor_makeup_kg" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v2: "$.data.version", hbd_at_min: "$.data.high_bank_deliverable_kg", posture_at_min: "$.data.safety_posture" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "FORKLIFT", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 0.100, ambient_temp_c: 20.0, expected_station_version: "${st_v2}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s2: "$.data.id" }
            - call: "POST /dispense-sessions/${s2}/fuel"
              payload: { precool_temp_achieved_c: -30.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s2}/complete"
              payload: { metered_kg: 0.100, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
          assert:
            - "${hbd_before} == 75.000 and ${precool_req} == -26.0"
            - "${direct_1} == 51.200 and ${makeup_1} == 13.800"
            - "PressureVessel.${v_high}.current_pressure_bar == 300.00 after the first fill"
            - "${hbd_at_min} == 10.000 (exactly at MIN_HIGH_BANK_DELIVERABLE_KG)"
            - "${posture_at_min} == OPEN (the comparison is strictly less-than)"
            - "DispenseSession.${s1}.density_correction_factor == 1.0 and corrected_kg == 65.000 and metering_error_pct == 0.000"
            - "Station.${st_id}.onsite_inventory_kg == 30.000 after the first fill"
            - "PressureVessel.${v_high}.current_pressure_bar == 299.00 after the second fill"
            - "Station.${st_id}.high_bank_deliverable_kg == 9.900 after the second fill"
            - "Station.${st_id}.safety_posture == RESTRICTED after the second fill"
            - "Station.${st_id}.onsite_inventory_kg == 29.900 and supply_alert == false"

      - name: incentive_claim_with_empty_metered_session_set_yields_zero_credits
        grounds:
          - calculations.incentive_credit_netting
          - entities.IncentiveClaim.fields.dispensed_kg
          - entities.IncentiveClaim.fields.energy_mj
          - entities.IncentiveClaim.fields.gross_credits_mt
          - calculations.metering_accuracy_rollup
          - endpoints.POST_/incentive-claims
        distinguishing_aspect: |
          Different metric and a different edge kind, reached through a different endpoint: this is the
          EMPTY-SET / ZERO edge of credit mass in metric tonnes at POST /incentive-claims. The station
          has two DispenseSession rows but neither is in the input set — one is still PENDING and the
          other has been VOIDED — so dispensed_kg is 0.000, energy_mj is 0.000, gross_credits_mt clamps
          to 0.000 through MAX(0.000, ...), the admin tier still resolves to the lowest rate 0.010 and
          net_credits_mt is 0.000 rather than a negative number or a division-by-zero failure. The
