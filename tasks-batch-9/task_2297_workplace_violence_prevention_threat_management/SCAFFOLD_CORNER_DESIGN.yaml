              captures: { hr_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Wendy Cole", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { w1_id: $.data.id, w1_id_v: $.data.version }
            - call: "POST /training-modules"
              payload: { code: "WVP-ADMIN", job_function_scope: ["ADMIN"], scenario_set_version: "2026.1", refresh_interval_days: 365, passing_score: 80, required_for_escort: false }
              as: ProgramAdmin
              captures: { mod_adm_id: $.data.id }
            - call: "POST /training-assignments"
              payload: { employee_id: "${w1_id}", module_id: "${mod_adm_id}", due_at: "2026-08-20T00:00:00Z", expected_employee_version: "${w1_id_v}" }
              as: HRPartner
