      - name: peer_reject_cascade_walks_four_hops_from_report_to_effective_statement
        claim_type: cascading_side_effects
        grounds:
          - state_machines.EngineeringReport.transitions.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.ConversionProject.transitions.DOCUMENTS_PREPARATION_to_SUITABILITY_REVIEW
          - endpoints[POST /engineering-reports/{id}/peer-review-decisions]
          - entities.MajorComponent.fields.verification_status
          - entities.SuitabilityAssessment.fields.status
          - entities.PublicOfferingStatement.fields.status
          - entities.ConversionProject.fields.posture
        distinguishing_aspect: "One REJECT must walk all four declared hops in order - un-verify the child
          components and zero the report aggregates, INVALIDATE the report's EFFECTIVE assessment, clear
          the project's gate to FAILED with suitability_score 0.00, and only then, because the gate is
          FAILED, drive posture to FROZEN and the EFFECTIVE PublicOfferingStatement to
          AMENDMENT_REQUIRED. The rejected report is the project's ONLY assessment carrier, which is what
          makes hop 3's 'no EFFECTIVE assessment left' guard fire. Hop 3's status clause is nevertheless
          conditional: the project sits in PRESALE, not DOCUMENTS_PREPARATION, so the status must stay
          PRESALE while every unconditional write in the same hop still happens. An implementation that
          stops after hop 1, or that fires the status rewrite unconditionally, is distinguished."
        test_recipe:
          setup:
            - "The golden path to an EFFECTIVE PublicOfferingStatement (project in PRESALE) in which ER-1
              is still SUBMITTED - never peer-accepted - so it both carries the project's only EFFECTIVE
              AS_INSPECTED assessment (score 100.00, gate PASSED) and is still rejectable."
