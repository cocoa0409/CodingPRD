  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: inv_sheets_reserve_then_cancel_release
        grounds:
          - calculations.sheet_allocation
          - state_machines.Job.ENGINEERING_to_PRESS_READY
          - "state_machines.Job.[QUOTED, ENGINEERING, PRESS_READY]_to_CANCELLED"
        distinguishing_aspect: |
          Conserved quantity = raw board sheets: received == available + reserved + consumed.
          Forward action mark-press-ready reserves 130 (available 5000 -> 4870); compensating action
          cancel releases them; consumed stays 0 throughout and available returns to exactly 5000.
        test_recipe:
          setup:
            - "Job qty 3000 ENGINEERING with approved design + locked plan (gross 130); stock 5000 @300c"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Sigma", brand_code: "SGM" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
            - { call: "POST /plant/color-standards/${std}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${job_v2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${job_v3}" }, as: StructuralDesigner }
          trigger:
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner, captures: { j_res: $.data.reserved_sheets } }
            - { call: "GET /plant/board-stocks/${stock}", payload: {}, as: PlantAdmin, captures: { res_mid: $.data.reserved_sheets, avail_mid: $.data.available_sheets, con_mid: $.data.consumed_sheets } }
            - { call: "POST /plant/jobs/${job}/cancel", payload: {}, as: PlantAdmin, captures: { j_st: $.data.status, j_res2: $.data.reserved_sheets } }
            - { call: "GET /plant/board-stocks/${stock}", payload: {}, as: PlantAdmin, captures: { res_end: $.data.reserved_sheets, avail_end: $.data.available_sheets, con_end: $.data.consumed_sheets, rec_end: $.data.received_sheets } }
          assert:
            - "after reserve: job.reserved_sheets == 130; stock reserved == 130, available == 4870, consumed == 0 (${res_mid}, ${avail_mid})"
            - "after cancel (compensating): job CANCELLED with reserved_sheets == 0; stock reserved == 0, available == 5000, consumed == 0"
            - "invariant holds at both observation points: received 5000 == available + reserved + consumed (${rec_end} == ${avail_end} + ${res_end} + ${con_end})"
            - "no drift: available_sheets after the pair equals the pre-pair value 5000"

      - name: inv_cartons_kit_allocate_then_cancel
        grounds:
          - calculations.kitting_consumption
          - state_machines.KitOrder.PLANNED_to_CANCELLED
          - entities.Job.fields.available_cartons
        distinguishing_aspect: |
          Conserved quantity = finished cartons (different quantity from raw sheets):
          good_cartons_actual == allocated_cartons + available_cartons. Forward kit-create allocates
          300 (3000 -> 2700 available); compensating kit-cancel returns them; good_cartons_actual
