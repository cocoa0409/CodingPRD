# =============================================================================
# Homeowners Insurance Underwriting — Scaffold (§1.0–§1.7)
# Difficulty band: EXPERT
# =============================================================================

scenario: |
  166. Homeowners Insurance Underwriting: replacement-cost estimator,
  peril/exclusion endorsements, wildfire/flood zone scoring, 4-point
  inspection, wind/hail percentage deductible, binding/declination,
  reinstatement, lapse

domain_name: homeowners-insurance-underwriting
api_prefix: ""   # flat topology: every entity is a top-level collection (/properties, /applications, /policies, ...)

complexity_profile:
  primary_archetype: compliance_audit          # underwriting gates + binding/declination with audit trail
  secondary_archetype: ledger_reconciliation    # provisional vs final premium / replacement-cost ledgers
  complexity_layers:
    - optimistic_concurrency        # OCC on Application.version (bind) and Policy.version (lapse)
    - dual_variant_calculation      # replacement-cost & wildfire-score provisional-vs-final
    - cascading_side_effects        # bind → policy → endorsement apply → premium-balance debit chain
    - derived_field_reconciliation  # premium_balance / total_insured_value kept consistent

  entity_topology: flat             # peer entities joined by FK fields; no nested URL ownership
  state_machine_shape: cyclic       # policy lapse/reinstate loop, inspection re-inspect loop
  relationship_patterns:
    - one_to_many                   # property → inspections; application → endorsements
    - cross_aggregate               # policy spans application + property; inspection spans property + inspector
  role_model: segregation_of_duties # the Agent who submits cannot be the Underwriter who binds/declines
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: street_address, type: string, source: input, description: "Full street address of the insured dwelling" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code (e.g., CA, FL, TX)" }
      - { name: year_built, type: integer, source: input, description: "Year the dwelling was constructed", constraints: "1800 <= year_built <= 2026" }
      - { name: square_footage, type: integer, source: input, description: "Living-area square footage", constraints: "square_footage > 0" }
      - { name: construction_type, type: enum, source: input, description: "FRAME | MASONRY | FIRE_RESISTIVE — feeds per-sqft and component replacement rates" }
      - { name: roof_age_years, type: integer, source: input, description: "Age of the roof in years at submission", constraints: "roof_age_years >= 0" }
      - { name: stories, type: integer, source: input, default: 1, description: "Number of stories", constraints: "stories >= 1" }
      - { name: replacement_cost, type: number, source: computed, description: "Read-only: latest committed replacement-cost estimate (Coverage A); 0 until an estimate is committed. See §1.3 replacement_cost_estimate" }
      - { name: total_insured_value, type: number, source: computed, description: "Read-only: conserved quantity = replacement_cost (Coverage A) + sum of coverage_limit over APPLIED PERIL_ADD endorsements on the bound policy. Starts 0; reset to replacement_cost on estimate commit" }
      - { name: estimate_variant, type: enum, source: computed, description: "Which replacement-cost variant produced replacement_cost: COMPONENT | SQFT_BLEND | NONE (default NONE)", constraints: "COMPONENT | SQFT_BLEND | NONE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED — ARCHIVED excluded from default lists. Starts ACTIVE", constraints: "ACTIVE | ARCHIVED" }

  - name: RiskAssessment
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the property scored by this assessment" }
      - { name: wildfire_fuel_density, type: integer, source: input, description: "Surrounding-vegetation fuel density 0-100", constraints: "0 <= wildfire_fuel_density <= 100" }
      - { name: slope_grade_pct, type: integer, source: input, description: "Terrain slope grade percent feeding wildfire spread", constraints: "0 <= slope_grade_pct <= 100" }
      - { name: defensible_space_ft, type: integer, source: input, description: "Cleared defensible-space radius in feet", constraints: "defensible_space_ft >= 0" }
      - { name: flood_zone, type: enum, source: input, description: "FEMA flood zone: X | A | AE | VE", constraints: "X | A | AE | VE" }
      - { name: distance_to_coast_mi, type: number, source: input, description: "Miles to nearest coastline; feeds wind/hail tier", constraints: "distance_to_coast_mi >= 0" }
      - { name: wildfire_score, type: integer, source: computed, description: "Read-only: weighted wildfire score 0-100; PROVISIONAL pre-inspection, FINAL after a PASSED inspection. See §1.3 wildfire_score" }
      - { name: wind_hail_tier, type: enum, source: computed, description: "Read-only: TIER_3 if distance_to_coast_mi < 5; TIER_2 if 5 <= distance_to_coast_mi <= 50; TIER_1 if distance_to_coast_mi > 50 (closer coast = higher wind/hail risk)", constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: score_stage, type: enum, source: system, description: "PROVISIONAL | FINAL — FINAL when the property's Inspection PASSES. Starts PROVISIONAL", constraints: "PROVISIONAL | FINAL" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector's name" }
      - { name: license_state, type: string, source: input, description: "Two-letter state code the inspector is licensed in" }
      - { name: buffer_minutes, type: integer, source: input, default: 60, description: "Mandatory travel buffer (minutes) that must separate two inspections by this inspector", constraints: "buffer_minutes >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED. Starts ACTIVE", constraints: "ACTIVE | ARCHIVED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the property being inspected" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; the assigned inspector" }
      - { name: window_start, type: integer, source: input, description: "Inspection window start as Unix epoch seconds" }
      - { name: window_end, type: integer, source: input, description: "Inspection window end as Unix epoch seconds (half-open [start,end))", constraints: "window_end > window_start" }
      - { name: roof_ok, type: boolean, source: input, default: false, description: "4-point: roof passes" }
      - { name: electrical_ok, type: boolean, source: input, default: false, description: "4-point: electrical passes" }
      - { name: plumbing_ok, type: boolean, source: input, default: false, description: "4-point: plumbing passes" }
      - { name: hvac_ok, type: boolean, source: input, default: false, description: "4-point: HVAC passes" }
      - { name: passed_count, type: integer, source: computed, description: "Read-only: count of the four points true at COMPLETED; 0 until completed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | PASSED | FAILED. Starts SCHEDULED", constraints: "SCHEDULED | COMPLETED | PASSED | FAILED" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the dwelling to be insured" }
      - { name: agent_id, type: string, source: input, description: "Opaque operator id of the producing Agent (X-User-ID of the creating Agent); not an FK to a persisted entity" }
      - { name: requested_coverage_a, type: number, source: input, description: "Requested Coverage A (dwelling) limit; must be >= committed replacement_cost to submit" }
      - { name: wind_hail_deductible_pct, type: number, source: input, default: 2, description: "Wind/hail percentage deductible (percent of Coverage A)", constraints: "wind_hail_deductible_pct IN {1, 2, 5}" }
      - { name: quoted_premium, type: number, source: computed, description: "Read-only: annual_premium from the latest BOUND_OFFER Quote; 0 until submitted. See §1.3 annual_premium" }
      - { name: decline_reason, type: enum, source: computed, description: "Reason on declination: WILDFIRE_UNINSURABLE | INSPECTION_FAILED | NONE (default NONE)", constraints: "WILDFIRE_UNINSURABLE | INSPECTION_FAILED | NONE" }
      - { name: assigned_underwriter_id, type: string, source: input, description: "FK -> Underwriter.id; underwriter who took the application UNDER_REVIEW (null until taken)", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | BOUND | DECLINED. Starts DRAFT", constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | BOUND | DECLINED" }

  - name: Endorsement
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this rider modifies" }
      - { name: kind, type: enum, source: input, description: "PERIL_ADD | EXCLUSION — PERIL_ADD widens coverage (premium debit), EXCLUSION narrows it (premium credit)", constraints: "PERIL_ADD | EXCLUSION" }
      - { name: peril_code, type: enum, source: input, description: "WATER_BACKUP | SCREENED_ENCLOSURE | ORDINANCE_LAW | EARTH_MOVEMENT | MOLD", constraints: "WATER_BACKUP | SCREENED_ENCLOSURE | ORDINANCE_LAW | EARTH_MOVEMENT | MOLD" }
      - { name: coverage_limit, type: number, source: input, default: 0, description: "Additive coverage limit for PERIL_ADD (0 for EXCLUSION)", constraints: "coverage_limit >= 0" }
      - { name: premium_delta, type: number, source: computed, description: "Read-only: signed annual premium impact (+ for PERIL_ADD, - for EXCLUSION). See §1.3 endorsement_premium_delta" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING | APPLIED | REJECTED | REMOVED. Starts DRAFT", constraints: "DRAFT | PENDING | APPLIED | REJECTED | REMOVED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this quote prices" }
      - { name: base_premium, type: number, source: computed, description: "Read-only: pre-endorsement annual premium (unrounded internal value rounded to cents). See §1.3 annual_premium" }
      - { name: endorsement_premium, type: number, source: computed, description: "Read-only: sum of premium_delta over PENDING endorsements at quote time (each pre-rounded)" }
      - { name: annual_premium, type: number, source: computed, description: "Read-only: rounded base_premium + endorsement_premium; rounding order pinned in §1.3 premium_rounding" }
      - { name: wind_hail_deductible_amount, type: number, source: computed, description: "Read-only: dollar wind/hail deductible. See §1.3 wind_hail_deductible_amount" }
      - { name: status, type: enum, source: system, description: "BOUND_OFFER | SUPERSEDED — a newer quote on the same application supersedes the prior. Starts BOUND_OFFER", constraints: "BOUND_OFFER | SUPERSEDED" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application that was bound into this policy" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the insured dwelling" }
      - { name: effective_date, type: integer, source: input, description: "Coverage effective date as Unix epoch seconds (closed-interval start)" }
      - { name: expiration_date, type: integer, source: input, description: "Coverage expiration date as Unix epoch seconds (closed-interval end, inclusive)", constraints: "expiration_date > effective_date" }
      - { name: annual_premium, type: number, source: computed, description: "Read-only: premium copied from the BOUND_OFFER Quote at binding" }
      - { name: premium_balance, type: number, source: computed, description: "Read-only: conserved quantity = sum(DEBIT postings) - sum(CREDIT postings) over this policy's internal ledger. See §1.3 premium_balance" }
      - { name: lapse_count, type: integer, source: computed, description: "Read-only: number of times this policy has lapsed; starts 0" }
      - { name: status, type: enum, source: system, description: "PENDING_PAYMENT | ACTIVE | LAPSED | REINSTATED | CANCELLED. Starts PENDING_PAYMENT", constraints: "PENDING_PAYMENT | ACTIVE | LAPSED | REINSTATED | CANCELLED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy this payment settles" }
      - { name: purpose, type: enum, source: input, description: "BINDING | REINSTATEMENT", constraints: "BINDING | REINSTATEMENT" }
      - { name: amount, type: number, source: input, description: "Dollar amount tendered", constraints: "amount > 0" }
      - { name: status, type: enum, source: system, description: "SETTLED — a payment is recorded only on success. Starts SETTLED", constraints: "SETTLED" }

  - name: Underwriter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Underwriter's name" }
      - { name: authority_limit, type: number, source: input, description: "Max Coverage A this underwriter may bind without escalation", constraints: "authority_limit > 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [BOUND, DECLINED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Agent
        preconditions:
          - "Application.status == DRAFT (else ERR_APPLICATION_NOT_DRAFT)"
          - "Property.replacement_cost > 0 — an estimate has been committed (else ERR_REPLACEMENT_COST_MISSING)"
          - "Application.requested_coverage_a >= Property.replacement_cost (else ERR_COVERAGE_BELOW_REPLACEMENT_COST)"
          - "A RiskAssessment exists for Application.property_id (else ERR_RISK_ASSESSMENT_NOT_FOUND)"
        side_effects:
          - "A Quote is generated (BOUND_OFFER): base_premium, endorsement_premium, annual_premium, wind_hail_deductible_amount computed (§1.3); any prior BOUND_OFFER Quote on this application → SUPERSEDED"
          - "Application.quoted_premium = new Quote.annual_premium"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/take-review"
        actor: Underwriter
        preconditions:
          - "Application.status == SUBMITTED (else ERR_APPLICATION_NOT_SUBMITTED)"
        side_effects:
          - "Application.assigned_underwriter_id = acting Underwriter.id"
      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /applications/{id}/return-to-queue"
        actor: Underwriter
        note: "Cycle edge — underwriter releases the application back to the submitted queue for re-review."
        preconditions:
          - "Application.status == UNDER_REVIEW (else ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "acting Underwriter.id == Application.assigned_underwriter_id (else ERR_NOT_ASSIGNED_UNDERWRITER)"
        side_effects:
          - "Application.assigned_underwriter_id = null"
      - from: UNDER_REVIEW
        to: BOUND
        trigger: "POST /applications/{id}/bind"
        actor: Underwriter
        preconditions:
          - "Application.status == UNDER_REVIEW (else ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "acting Underwriter.id == Application.assigned_underwriter_id (else ERR_NOT_ASSIGNED_UNDERWRITER) — segregation of duties: producer is an Agent, binder is the assigned Underwriter"
          - "A PASSED Inspection exists for Application.property_id (else ERR_INSPECTION_NOT_PASSED) — cross-entity Application↔Inspection"
          - "RiskAssessment.score_stage == FINAL for the property (else ERR_SCORE_NOT_FINAL)"
          - "RiskAssessment.wildfire_score < 80 (else ERR_WILDFIRE_UNINSURABLE) — boundary at 80"
          - "Application.requested_coverage_a <= acting Underwriter.authority_limit (else ERR_AUTHORITY_LIMIT_EXCEEDED)"
          - "expected_application_version matches Application.version (else ERR_STALE_APPLICATION_VERSION)"
        side_effects:
          - "Application.status = BOUND"
          - "CASCADE A step 1 → a Policy is created PENDING_PAYMENT with annual_premium = latest BOUND_OFFER Quote.annual_premium, property_id = Application.property_id, premium_balance = 0"
          - "CASCADE A step 2 → every Endorsement on this application in PENDING transitions PENDING → APPLIED (Endorsement machine)"
          - "increments Application.version by 1"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /applications/{id}/decline"
        actor: Underwriter
        preconditions:
          - "Application.status == UNDER_REVIEW (else ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "acting Underwriter.id == Application.assigned_underwriter_id (else ERR_NOT_ASSIGNED_UNDERWRITER)"
        side_effects:
          - "Application.status = DECLINED"
          - "Application.decline_reason set from request reason (WILDFIRE_UNINSURABLE | INSPECTION_FAILED)"
          - "every Endorsement on this application in DRAFT or PENDING → REJECTED"

  - entity: Endorsement
    initial_state: DRAFT
    terminal_states: [REJECTED, REMOVED]
    transitions:
      - from: DRAFT
        to: PENDING
        trigger: "POST /endorsements/{id}/attach"
        actor: Agent
        preconditions:
          - "Endorsement.status == DRAFT (else ERR_ENDORSEMENT_NOT_DRAFT)"
          - "parent Application.status IN {DRAFT, SUBMITTED, UNDER_REVIEW} (else ERR_APPLICATION_NOT_OPEN_FOR_ENDORSEMENT)"
        side_effects:
          - "Endorsement.premium_delta computed (§1.3 endorsement_premium_delta)"
      - from: PENDING
        to: APPLIED
        trigger: "system (CASCADE A step 2 — fired by Application bind)"
        actor: system
        note: "Cross-entity guarded transition: fires only as a consequence of the parent Application BIND."
        preconditions:
          - "parent Application transitioned UNDER_REVIEW → BOUND in this request"
        side_effects:
          - "CASCADE A step 3 → posts to the new Policy's internal ledger: DEBIT amount=premium_delta (PERIL_ADD) OR CREDIT amount=|premium_delta| (EXCLUSION); Policy.premium_balance recomputed (§1.3 premium_balance)"
          - "Property.total_insured_value += coverage_limit (PERIL_ADD only)"
      - from: PENDING
        to: REJECTED
        trigger: "system (cascade from Application decline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: REJECTED
        trigger: "system (cascade from Application decline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: REMOVED
        trigger: "POST /endorsements/{id}/remove"
        actor: Underwriter
        note: "Compensating action for §1.9 — leaves premium_balance and total_insured_value at the exact reversal of the APPLIED posting."
        preconditions:
          - "Endorsement.status == APPLIED (else ERR_ENDORSEMENT_NOT_APPLIED)"
          - "the application's Policy.status IN {PENDING_PAYMENT, ACTIVE, REINSTATED} (else ERR_POLICY_NOT_AMENDABLE) — cross-entity Endorsement↔Policy"
        side_effects:
          - "reversing ledger posting: CREDIT amount=premium_delta for a removed PERIL_ADD, OR DEBIT amount=|premium_delta| for a removed EXCLUSION; Policy.premium_balance recomputed"
          - "Property.total_insured_value -= coverage_limit (removed PERIL_ADD only)"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED (else ERR_INSPECTION_NOT_SCHEDULED)"
        side_effects:
          - "passed_count = count of (roof_ok, electrical_ok, plumbing_ok, hvac_ok) that are true"
      - from: COMPLETED
        to: PASSED
        trigger: "system (auto on complete when all four points true)"
        actor: system
        preconditions:
          - "passed_count == 4 (boundary: 3 fails, 4 passes)"
        side_effects:
          - "the property's RiskAssessment.score_stage → FINAL; wildfire_score recomputed under FINAL variant (§1.3)"
      - from: COMPLETED
        to: FAILED
        trigger: "system (auto on complete when fewer than four points true)"
        actor: system
        preconditions:
          - "passed_count < 4"
        side_effects: []
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /inspections/{id}/reschedule"
        actor: Inspector
        note: "Cycle edge — re-inspection loop after a failed 4-point."
        preconditions:
          - "Inspection.status == FAILED (else ERR_INSPECTION_NOT_FAILED)"
          - "new window does not collide with another SCHEDULED/COMPLETED/PASSED inspection on the same inspector within buffer (§1.4 overlap, else ERR_INSPECTION_WINDOW_CONFLICT)"
        side_effects:
          - "window_start, window_end updated; roof_ok/electrical_ok/plumbing_ok/hvac_ok reset to false; passed_count reset to 0"

  - entity: Policy
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /payments (purpose=BINDING)"
        actor: Agent
        preconditions:
          - "Policy.status == PENDING_PAYMENT (else ERR_POLICY_NOT_PENDING_PAYMENT)"
          - "payment.amount == Policy.annual_premium (else ERR_PAYMENT_AMOUNT_MISMATCH)"
          - "no other ACTIVE/REINSTATED Policy covers the same property_id over an overlapping [effective_date, expiration_date] closed interval (else ERR_COVERAGE_PERIOD_OVERLAP)"
        side_effects:
          - "Policy.status = ACTIVE"
          - "ledger DEBIT amount=annual_premium (BIND_PREMIUM); Policy.premium_balance recomputed"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /policies/{id}/lapse"
        actor: Underwriter
        preconditions:
          - "Policy.status == ACTIVE (else ERR_POLICY_NOT_ACTIVE)"
          - "expected_policy_version matches Policy.version (else ERR_STALE_POLICY_VERSION)"
        side_effects:
          - "Policy.status = LAPSED; Policy.lapse_count += 1"
          - "CASCADE B step 1 → ledger CREDIT amount=premium_balance (LAPSE_WRITEOFF) so premium_balance returns to 0"
          - "increments Policy.version by 1"
      - from: REINSTATED
        to: LAPSED
        trigger: "POST /policies/{id}/lapse"
        actor: Underwriter
        preconditions:
          - "Policy.status == REINSTATED (else ERR_POLICY_NOT_ACTIVE)"
          - "expected_policy_version matches Policy.version (else ERR_STALE_POLICY_VERSION)"
        side_effects:
          - "Policy.status = LAPSED; Policy.lapse_count += 1"
          - "CASCADE B step 1 → ledger CREDIT amount=premium_balance (LAPSE_WRITEOFF); premium_balance returns to 0"
          - "increments Policy.version by 1"
      - from: LAPSED
        to: REINSTATED
        trigger: "POST /payments (purpose=REINSTATEMENT)"
        actor: Agent
        preconditions:
          - "Policy.status == LAPSED (else ERR_POLICY_NOT_LAPSED)"
          - "Policy.lapse_count <= 2 (else ERR_REINSTATEMENT_LIMIT_EXCEEDED) — boundary: 3rd lapse cannot reinstate"
          - "payment.amount == (Policy.annual_premium + REINSTATEMENT_FEE) (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "Policy.status = REINSTATED"
          - "ledger DEBIT amount=annual_premium (BIND_PREMIUM); ledger DEBIT amount=REINSTATEMENT_FEE (REINSTATEMENT_FEE); premium_balance recomputed"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "Policy.status IN {ACTIVE, REINSTATED, LAPSED} (else ERR_POLICY_NOT_CANCELLABLE)"
        side_effects:
          - "Policy.status = CANCELLED"
      - from: REINSTATED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "Policy.status IN {ACTIVE, REINSTATED, LAPSED} (else ERR_POLICY_NOT_CANCELLABLE)"
        side_effects:
          - "Policy.status = CANCELLED"
      - from: LAPSED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "Policy.status IN {ACTIVE, REINSTATED, LAPSED} (else ERR_POLICY_NOT_CANCELLABLE)"
        side_effects:
          - "Policy.status = CANCELLED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: bind-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/bind"
    occ_field: "expected_application_version"
    description: |
      Binding an Application whose version has advanced since the client last
      observed it is rejected on a stale version. This captures the case where
      another writer has just mutated the application (e.g., a return-to-queue /
      re-take cycle, or a re-submit that regenerated the quote) and the current
      binder's view is therefore stale; the bind would otherwise legitimately
      supersede that view.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: lapse-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/lapse"
    occ_field: "expected_policy_version"
    description: |
      Lapsing a Policy whose version has advanced since the client last observed
      it is rejected on a stale version. This captures the case where another
      writer has already lapsed-and-reinstated (or otherwise advanced) the policy
      and the current writer's view is stale; the lapse would otherwise legitimately
      apply to the version the client thought it held.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: replacement_cost_estimate
    trigger: "POST /properties/{id}/estimate-replacement-cost"
    algorithm: forward_looking
    formula: |
      Two variants produce DIFFERENT Coverage A for identical Property inputs.
      The request's `method` field selects the variant; the committed value and
      estimate_variant are stored on Property.

      base_rate    = CONSTRUCTION_RATE[construction_type]   # $/sqft
      story_factor = 1 + STORY_STEP * (stories - 1)

      COMPONENT (method="COMPONENT"):
        structure = base_rate * square_footage * story_factor
        roof_repl = ROOF_RATE[construction_type] * square_footage
        roof_adj  = roof_repl * (1 - min(roof_age_years, 20) * 0.01)   # newer roof costs more to match
        replacement_cost = round_half_up(structure + roof_adj, 2)

      SQFT_BLEND (method="SQFT_BLEND"):
        blended_rate = base_rate * BLEND_UPLIFT[construction_type]      # roof folded in; no separate roof line
        replacement_cost = round_half_up(blended_rate * square_footage * story_factor, 2)
    input_set: "Single Property row; no cross-entity aggregation"
    constants:
      CONSTRUCTION_RATE: { FRAME: 120, MASONRY: 150, FIRE_RESISTIVE: 185 }
      ROOF_RATE: { FRAME: 18, MASONRY: 22, FIRE_RESISTIVE: 26 }
      BLEND_UPLIFT: { FRAME: 1.18, MASONRY: 1.16, FIRE_RESISTIVE: 1.15 }
      STORY_STEP: 0.04
    precision: "2 decimal places, round_half_up"
    variants:
      - name: COMPONENT
        when: "request method == COMPONENT"
        difference: "Roof costed as a separate depreciated line; structure uses raw per-sqft rate."
      - name: SQFT_BLEND
        when: "request method == SQFT_BLEND"
        difference: "Single blended per-sqft rate folds the roof in; no separate roof depreciation — different dollar value for the same Property."

  - name: wildfire_score
    trigger: "POST /risk-assessments (PROVISIONAL) and Inspection COMPLETED→PASSED (FINAL)"
    algorithm: weighted_scoring
    formula: |
      Two variants produce DIFFERENT scores for the same RiskAssessment inputs.
      raw = W_FUEL*wildfire_fuel_density + W_SLOPE*slope_grade_pct
            - W_SPACE * min(defensible_space_ft, SPACE_CAP)

      PROVISIONAL (score_stage==PROVISIONAL, pre-inspection):
        wildfire_score = clamp(round_half_up(raw), 0, 100)

      FINAL (score_stage==FINAL, set when Inspection PASSES):
        wildfire_score = clamp(round_half_up(raw) - MITIGATION_CREDIT, 0, 100)   # verified-mitigation credit
    input_set: "Single RiskAssessment row; FINAL requires the property's Inspection PASSED"
    constants:
      W_FUEL: 0.7
      W_SLOPE: 0.5
      W_SPACE: 0.3
      SPACE_CAP: 200
      MITIGATION_CREDIT: 12
    precision: "integer, round_half_up before clamp"
    variants:
      - name: PROVISIONAL
        when: "score_stage == PROVISIONAL"
        difference: "No mitigation credit; higher score; gates the submission risk view."
      - name: FINAL
        when: "score_stage == FINAL (inspection passed)"
        difference: "Subtracts MITIGATION_CREDIT, lowering the score; this FINAL value is compared against the 80 declination boundary at bind."

  - name: annual_premium
    trigger: "Application SUBMITTED (quote generation) and re-submit re-quote"
    algorithm: tiered_pricing
    formula: |
      Combinatorial mode (a): >=3 inputs, nested min/max, conditional branches,
      tiered-rate selection. Evaluation order is pinned.

      Step 1 — Coverage-A tier rate (tiered on requested_coverage_a):
        rate = TIER_RATE row where requested_coverage_a in [tier.lo, tier.hi)
        # tiers: [0,200k)->0.0040, [200k,400k)->0.0035, [400k,inf)->0.0031
      Step 2 — base = requested_coverage_a * rate
      Step 3 — zone multipliers (multiplicative, conditional branch on wildfire_score):
        wf_mult = 1 + max(0, (wildfire_score - 40)) * 0.005     # surcharge only above 40
        fl_mult = FLOOD_MULT[flood_zone]
        wh_mult = WIND_HAIL_MULT[wind_hail_tier]
        zoned   = base * wf_mult * fl_mult * wh_mult
      Step 4 — deductible credit (higher % deductible lowers premium):
        base_premium_raw = zoned * (1 - DED_CREDIT[wind_hail_deductible_pct])
      Quote.base_premium = round_half_up(base_premium_raw, 2)   # per-component rounding (see premium_rounding)
      Uses the property's FINAL-or-PROVISIONAL wildfire_score current at quote time.
    input_set: "Application.requested_coverage_a, Application.wind_hail_deductible_pct + the property's RiskAssessment (wildfire_score current, flood_zone, wind_hail_tier)"
    constants:
      TIER_RATE: [{ lo: 0, hi: 200000, rate: 0.0040 }, { lo: 200000, hi: 400000, rate: 0.0035 }, { lo: 400000, hi: 999999999, rate: 0.0031 }]
      FLOOD_MULT: { X: 1.0, A: 1.2, AE: 1.35, VE: 1.6 }
      WIND_HAIL_MULT: { TIER_1: 1.0, TIER_2: 1.18, TIER_3: 1.4 }
      DED_CREDIT: { 1: 0.0, 2: 0.05, 5: 0.12 }
    precision: "base_premium rounded to 2 dp; final assembly pinned in premium_rounding"

  - name: premium_rounding
    trigger: "Quote creation (Application SUBMITTED) and re-quote"
    algorithm: aggregation
    formula: |
      Combinatorial mode (b): nested rounding where order matters. PINNED ORDER —
      round EACH component to cents FIRST, THEN sum (NOT sum-then-round):
        c_base = round_half_up(base_premium_raw, 2)            # Quote.base_premium
        c_endt = round_half_up(sum_of_premium_delta_PENDING, 2) # Quote.endorsement_premium (each delta already rounded)
        annual_premium = c_base + c_endt
      Per-component-then-sum vs sum-then-round can differ by one cent; the system
      commits per-component-then-sum.
    input_set: "Quote.base_premium and Quote.endorsement_premium for one application"
    constants: {}
    precision: "2 decimal places, round_half_up, per-component THEN sum"

  - name: endorsement_premium_delta
    trigger: "Endorsement DRAFT→PENDING (attach)"
    algorithm: threshold
    formula: |
      PERIL_ADD: premium_delta =  round_half_up(coverage_limit * PERIL_RATE[peril_code], 2)   # positive
      EXCLUSION: premium_delta = -round_half_up(EXCLUSION_CREDIT[peril_code], 2)               # negative
    input_set: "Single Endorsement row"
    constants:
      PERIL_RATE: { WATER_BACKUP: 0.004, SCREENED_ENCLOSURE: 0.003, ORDINANCE_LAW: 0.0025, EARTH_MOVEMENT: 0.006, MOLD: 0.005 }
      EXCLUSION_CREDIT: { WATER_BACKUP: 60, SCREENED_ENCLOSURE: 45, ORDINANCE_LAW: 80, EARTH_MOVEMENT: 140, MOLD: 70 }
    precision: "2 decimal places, round_half_up"

  - name: wind_hail_deductible_amount
    trigger: "Quote creation (Application SUBMITTED)"
    algorithm: threshold
    formula: |
      Combinatorial mode (c): circular-looking dependency pinned by evaluation
      order. The dollar deductible is a percent of Coverage A, while a MIN floor
      and the deductible_pct also feed the premium credit in annual_premium.
      PINNED: compute deductible_amount from the COMMITTED Coverage A
      (requested_coverage_a) BEFORE the premium credit is applied, so the credit
      (annual_premium step 4) never feeds back into the deductible.
        raw = requested_coverage_a * (wind_hail_deductible_pct / 100)
        wind_hail_deductible_amount = round_half_up(max(raw, MIN_DEDUCTIBLE), 2)
    input_set: "Application.requested_coverage_a and Application.wind_hail_deductible_pct"
    constants:
      MIN_DEDUCTIBLE: 2500
    precision: "2 decimal places, round_half_up"

  - name: premium_balance
    trigger: "Any ledger posting (bind payment, endorsement apply/remove, lapse writeoff, reinstatement)"
    algorithm: aggregation
    formula: |
      premium_balance = SUM(DEBIT postings for this policy) - SUM(CREDIT postings for this policy)
      Conserved quantity for §1.9: a forward posting plus its compensating reversal
      MUST net to zero change in premium_balance.
    input_set: "All internal ledger postings for the policy (append-only; none excluded)"
    constants:
      REINSTATEMENT_FEE: 250
    precision: "2 decimal places"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with ids

  - priority: 4
    category: state
    check: "Target resource is in the correct state for the operation (Application UNDER_REVIEW for bind, Policy PENDING_PAYMENT for binding payment, Inspection SCHEDULED for complete, etc.)"
    error_id: "varies (ERR_APPLICATION_NOT_UNDER_REVIEW, ERR_POLICY_NOT_PENDING_PAYMENT, ERR_INSPECTION_NOT_SCHEDULED, ...)"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 5
    category: business_referential
    check: "Cross-entity prerequisite: bind requires a PASSED Inspection for the application's property"
    error_id: ERR_INSPECTION_NOT_PASSED
    http_status: 409
    applies_to: "POST /applications/{id}/bind"

  - priority: 6
    category: business_safety
    check: "Wildfire insurability: FINAL RiskAssessment.wildfire_score must be < 80 to bind (boundary: 80 declines)"
    error_id: ERR_WILDFIRE_UNINSURABLE
    http_status: 422
    applies_to: "POST /applications/{id}/bind"

  - priority: 7
    category: business_temporal
    check: "No two ACTIVE/REINSTATED policies may cover the same property over overlapping [effective_date, expiration_date] closed intervals"
    error_id: ERR_COVERAGE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /payments (purpose=BINDING)"

  - priority: 8
    category: business_temporal
    check: "Inspection window on an inspector must not fall within buffer_minutes of another SCHEDULED/COMPLETED/PASSED inspection for the same inspector (half-open windows plus buffer gap)"
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /inspections, POST /inspections/{id}/reschedule"

  - priority: 9
    category: business_constraint
    check: "requested_coverage_a >= Property.replacement_cost at submission"
    error_id: ERR_COVERAGE_BELOW_REPLACEMENT_COST
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "Reinstatement limit: Policy.lapse_count must be <= 2 to reinstate (3rd lapse blocks reinstatement)"
    error_id: ERR_REINSTATEMENT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /payments (purpose=REINSTATEMENT)"

  - priority: 11
    category: business_fiscal
    check: "Underwriter authority: requested_coverage_a <= acting Underwriter.authority_limit at bind"
    error_id: ERR_AUTHORITY_LIMIT_EXCEEDED
    http_status: 403
    applies_to: "POST /applications/{id}/bind"

  - priority: 12
    category: business_fiscal
    check: "Payment amount equals the required amount (binding: annual_premium; reinstatement: annual_premium + REINSTATEMENT_FEE)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /payments"

  - priority: 13
    category: business_constraint
    check: "Input field constraints (enum membership, numeric ranges, window_end > window_start, expiration_date > effective_date, deductible_pct IN {1,2,5})"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all create/transition endpoints

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Underwriter (role-backed identity; Agent & Inspector ids captured from their own POSTs) ----
  - { method: POST, path: "/underwriters", description: "Create an Underwriter", roles: [Admin], code: 201, input: [full_name, authority_limit], output: Underwriter, side_effects: [] }

  # ---- Property ----
  - { method: POST, path: "/properties", description: "Create a Property", roles: [Agent], code: 201, input: [street_address, state_code, year_built, square_footage, construction_type, roof_age_years, "stories?"], output: Property, side_effects: ["status=ACTIVE, replacement_cost=0, total_insured_value=0, estimate_variant=NONE"] }
  - { method: GET, path: "/properties", description: "List Properties (ARCHIVED excluded unless include_archived=true)", roles: [Admin, Agent, Underwriter], code: 200, input: ["include_archived?", "limit?", "offset?"], output: "Property[]", side_effects: [] }
  - { method: GET, path: "/properties/{id}", description: "Get a Property", roles: [Admin, Agent, Underwriter], code: 200, input: [], output: Property, side_effects: [] }
  - { method: POST, path: "/properties/{id}/estimate-replacement-cost", description: "Compute and commit a replacement-cost estimate (Coverage A) under the chosen variant", roles: [Agent], code: 200, input: [method], output: Property, side_effects: ["replacement_cost set, estimate_variant set, total_insured_value reset to replacement_cost (§1.3 replacement_cost_estimate)"] }

  # ---- RiskAssessment ----
  - { method: POST, path: "/risk-assessments", description: "Create a RiskAssessment and compute PROVISIONAL wildfire score + wind_hail_tier", roles: [Underwriter], code: 201, input: [property_id, wildfire_fuel_density, slope_grade_pct, defensible_space_ft, flood_zone, distance_to_coast_mi], output: RiskAssessment, side_effects: ["wildfire_score (PROVISIONAL) and wind_hail_tier computed; score_stage=PROVISIONAL"] }
  - { method: GET, path: "/risk-assessments", description: "List RiskAssessments (filter by property_id)", roles: [Admin, Agent, Underwriter], code: 200, input: ["property_id?", "limit?", "offset?"], output: "RiskAssessment[]", side_effects: [] }
  - { method: GET, path: "/risk-assessments/{id}", description: "Get a RiskAssessment", roles: [Admin, Agent, Underwriter], code: 200, input: [], output: RiskAssessment, side_effects: [] }

  # ---- Inspector ----
  - { method: POST, path: "/inspectors", description: "Create an Inspector", roles: [Admin], code: 201, input: [full_name, license_state, "buffer_minutes?"], output: Inspector, side_effects: ["status=ACTIVE"] }

  # ---- Inspection ----
  - { method: POST, path: "/inspections", description: "Schedule a 4-point Inspection (window overlap + buffer checked)", roles: [Underwriter], code: 201, input: [property_id, inspector_id, window_start, window_end], output: Inspection, side_effects: ["status=SCHEDULED, 4-point flags default false, passed_count=0"] }
  - { method: GET, path: "/inspections", description: "List Inspections (filter by property_id and/or inspector_id)", roles: [Admin, Agent, Underwriter, Inspector], code: 200, input: ["property_id?", "inspector_id?", "limit?", "offset?"], output: "Inspection[]", side_effects: [] }
  - { method: GET, path: "/inspections/{id}", description: "Get an Inspection", roles: [Admin, Agent, Underwriter, Inspector], code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: POST, path: "/inspections/{id}/complete", description: "Submit 4-point results; auto-resolves PASSED (all four) or FAILED", roles: [Inspector], code: 200, input: [roof_ok, electrical_ok, plumbing_ok, hvac_ok], output: Inspection, side_effects: ["passed_count computed; PASSED→RiskAssessment FINAL recompute, else FAILED"] }
  - { method: POST, path: "/inspections/{id}/reschedule", description: "Reschedule a FAILED inspection (overlap re-checked)", roles: [Inspector], code: 200, input: [window_start, window_end], output: Inspection, side_effects: ["status→SCHEDULED, 4-point flags reset, passed_count=0"] }

  # ---- Application ----
  - { method: POST, path: "/applications", description: "Create a DRAFT Application", roles: [Agent], code: 201, input: [property_id, requested_coverage_a, "wind_hail_deductible_pct?"], output: Application, side_effects: ["status=DRAFT; agent_id=acting Agent X-User-ID; quoted_premium=0; decline_reason=NONE"] }
  - { method: GET, path: "/applications", description: "List Applications (filter by property_id and/or agent_id and/or assigned_underwriter_id)", roles: [Admin, Agent, Underwriter], code: 200, input: ["property_id?", "agent_id?", "assigned_underwriter_id?", "limit?", "offset?"], output: "Application[]", side_effects: [] }
  - { method: GET, path: "/applications/{id}", description: "Get an Application", roles: [Admin, Agent, Underwriter], code: 200, input: [], output: Application, side_effects: [] }
  - { method: POST, path: "/applications/{id}/submit", description: "Submit a DRAFT application; generates a Quote", roles: [Agent], code: 200, input: [], output: Application, side_effects: ["status→SUBMITTED; Quote generated (§1.3); prior BOUND_OFFER quote→SUPERSEDED; quoted_premium set"] }
  - { method: POST, path: "/applications/{id}/take-review", description: "Underwriter takes a SUBMITTED application UNDER_REVIEW", roles: [Underwriter], code: 200, input: [], output: Application, side_effects: ["status→UNDER_REVIEW; assigned_underwriter_id set"] }
  - { method: POST, path: "/applications/{id}/return-to-queue", description: "Assigned underwriter returns the application to the submitted queue (cycle)", roles: [Underwriter], code: 200, input: [], output: Application, side_effects: ["status→SUBMITTED; assigned_underwriter_id=null"] }
  - { method: POST, path: "/applications/{id}/bind", description: "Bind the application into a Policy (full underwriting gate)", roles: [Underwriter], code: 200, input: [effective_date, expiration_date, expected_application_version], output: Application, side_effects: ["status→BOUND; Policy created PENDING_PAYMENT (CASCADE A); PENDING endorsements→APPLIED with ledger postings; increments Application.version by 1"] }
  - { method: POST, path: "/applications/{id}/decline", description: "Decline the application under review", roles: [Underwriter], code: 200, input: [reason], output: Application, side_effects: ["status→DECLINED; decline_reason set; DRAFT/PENDING endorsements→REJECTED"] }

  # ---- Endorsement ----
  - { method: POST, path: "/endorsements", description: "Create a DRAFT Endorsement on an application", roles: [Agent], code: 201, input: [application_id, kind, peril_code, "coverage_limit?"], output: Endorsement, side_effects: ["status=DRAFT, premium_delta=0"] }
  - { method: GET, path: "/endorsements", description: "List Endorsements (filter by application_id)", roles: [Admin, Agent, Underwriter], code: 200, input: ["application_id?", "limit?", "offset?"], output: "Endorsement[]", side_effects: [] }
  - { method: GET, path: "/endorsements/{id}", description: "Get an Endorsement", roles: [Admin, Agent, Underwriter], code: 200, input: [], output: Endorsement, side_effects: [] }
  - { method: POST, path: "/endorsements/{id}/attach", description: "Attach a DRAFT endorsement (DRAFT→PENDING); computes premium_delta", roles: [Agent], code: 200, input: [], output: Endorsement, side_effects: ["status→PENDING; premium_delta computed (§1.3)"] }
  - { method: POST, path: "/endorsements/{id}/remove", description: "Remove an APPLIED endorsement (compensating reversal)", roles: [Underwriter], code: 200, input: [], output: Endorsement, side_effects: ["status→REMOVED; reversing ledger posting; total_insured_value adjusted; premium_balance recomputed"] }

  # ---- Quote ----
  - { method: GET, path: "/quotes", description: "List Quotes (filter by application_id)", roles: [Admin, Agent, Underwriter], code: 200, input: ["application_id?", "limit?", "offset?"], output: "Quote[]", side_effects: [] }
  - { method: GET, path: "/quotes/{id}", description: "Get a Quote", roles: [Admin, Agent, Underwriter], code: 200, input: [], output: Quote, side_effects: [] }

  # ---- Policy ----
  - { method: GET, path: "/policies", description: "List Policies (filter by application_id and/or property_id)", roles: [Admin, Agent, Underwriter], code: 200, input: ["application_id?", "property_id?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }
  - { method: GET, path: "/policies/{id}", description: "Get a Policy", roles: [Admin, Agent, Underwriter], code: 200, input: [], output: Policy, side_effects: [] }
  - { method: POST, path: "/policies/{id}/lapse", description: "Lapse an ACTIVE/REINSTATED policy", roles: [Underwriter], code: 200, input: [expected_policy_version], output: Policy, side_effects: ["status→LAPSED; lapse_count+1; LAPSE_WRITEOFF credit; increments Policy.version by 1 (CASCADE B)"] }
  - { method: POST, path: "/policies/{id}/cancel", description: "Cancel a policy", roles: [Underwriter], code: 200, input: [], output: Policy, side_effects: ["status→CANCELLED"] }

  # ---- Payment ----
  - { method: POST, path: "/payments", description: "Record a binding or reinstatement payment (drives the Policy transition)", roles: [Agent], code: 201, input: [policy_id, purpose, amount], output: Payment, side_effects: ["BINDING: Policy PENDING_PAYMENT→ACTIVE + BIND_PREMIUM debit; REINSTATEMENT: Policy LAPSED→REINSTATED + premium & fee debits"] }
  - { method: GET, path: "/payments", description: "List Payments (filter by policy_id)", roles: [Admin, Agent, Underwriter], code: 200, input: ["policy_id?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: GET, path: "/payments/{id}", description: "Get a Payment", roles: [Admin, Agent, Underwriter], code: 200, input: [], output: Payment, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  # --- Not found (one per persisted resource referenced by id) ---
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not exist" }
  - { id: ERR_RISK_ASSESSMENT_NOT_FOUND, http: 404, condition: "RiskAssessment id does not exist, or none exists for a property at submit/bind" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "Inspector id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id does not exist" }
  - { id: ERR_ENDORSEMENT_NOT_FOUND, http: 404, condition: "Endorsement id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "Quote id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "Policy id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Payment id does not exist" }
  - { id: ERR_UNDERWRITER_NOT_FOUND, http: 404, condition: "Underwriter id does not exist" }
  # --- State ---
  - { id: ERR_APPLICATION_NOT_DRAFT, http: 409, condition: "submit requires Application in DRAFT" }
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "take-review requires Application in SUBMITTED" }
  - { id: ERR_APPLICATION_NOT_UNDER_REVIEW, http: 409, condition: "bind/decline/return-to-queue requires Application in UNDER_REVIEW" }
  - { id: ERR_NOT_ASSIGNED_UNDERWRITER, http: 403, condition: "Acting underwriter is not the assigned_underwriter_id for bind/decline/return-to-queue" }
  - { id: ERR_ENDORSEMENT_NOT_DRAFT, http: 409, condition: "attach requires Endorsement in DRAFT" }
  - { id: ERR_ENDORSEMENT_NOT_APPLIED, http: 409, condition: "remove requires Endorsement in APPLIED" }
  - { id: ERR_APPLICATION_NOT_OPEN_FOR_ENDORSEMENT, http: 409, condition: "attach requires parent Application in DRAFT/SUBMITTED/UNDER_REVIEW" }
  - { id: ERR_POLICY_NOT_AMENDABLE, http: 409, condition: "endorsement remove requires the policy in PENDING_PAYMENT/ACTIVE/REINSTATED" }
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "complete requires Inspection in SCHEDULED" }
  - { id: ERR_INSPECTION_NOT_FAILED, http: 409, condition: "reschedule requires Inspection in FAILED" }
  - { id: ERR_POLICY_NOT_PENDING_PAYMENT, http: 409, condition: "binding payment requires Policy in PENDING_PAYMENT" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "lapse requires Policy in ACTIVE or REINSTATED" }
  - { id: ERR_POLICY_NOT_LAPSED, http: 409, condition: "reinstatement payment requires Policy in LAPSED" }
  - { id: ERR_POLICY_NOT_CANCELLABLE, http: 409, condition: "cancel requires Policy in ACTIVE/REINSTATED/LAPSED" }
  # --- Business gates ---
  - { id: ERR_REPLACEMENT_COST_MISSING, http: 409, condition: "submit requires a committed replacement_cost (> 0)" }
  - { id: ERR_COVERAGE_BELOW_REPLACEMENT_COST, http: 422, condition: "requested_coverage_a < Property.replacement_cost at submit" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 409, condition: "bind requires a PASSED Inspection for the property" }
  - { id: ERR_SCORE_NOT_FINAL, http: 409, condition: "bind requires RiskAssessment.score_stage == FINAL" }
  - { id: ERR_WILDFIRE_UNINSURABLE, http: 422, condition: "FINAL wildfire_score >= 80 at bind" }
  - { id: ERR_AUTHORITY_LIMIT_EXCEEDED, http: 403, condition: "requested_coverage_a > acting Underwriter.authority_limit at bind" }
  - { id: ERR_COVERAGE_PERIOD_OVERLAP, http: 409, condition: "Binding payment would create overlapping coverage for the same property" }
  - { id: ERR_REINSTATEMENT_LIMIT_EXCEEDED, http: 409, condition: "Policy.lapse_count > 2 at reinstatement" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount does not equal the required binding/reinstatement amount" }
  - { id: ERR_INSPECTION_WINDOW_CONFLICT, http: 409, condition: "Inspection window collides with another inspection on the same inspector within buffer" }
  # --- Input / OCC ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, bad enum, out-of-range numeric, window_end<=window_start, expiration_date<=effective_date, or missing required field" }
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version does not match Application.version at bind" }
  - { id: ERR_STALE_POLICY_VERSION, http: 412, condition: "expected_policy_version does not match Policy.version at lapse" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Platform operator; provisions underwriters and inspectors. Cannot act in the agent/underwriting workflow."
    identity: opaque
    exclusive_operations:
      - "POST /underwriters — create underwriter"
      - "POST /inspectors — create inspector"
    shared_operations:
      - "All GET reads"

  - name: Agent
    description: "Producing agent: creates properties/applications/endorsements, commits estimates, submits, tenders payments. Cannot take-review/bind/decline (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /properties, POST /properties/{id}/estimate-replacement-cost"
      - "POST /applications, POST /applications/{id}/submit"
      - "POST /endorsements, POST /endorsements/{id}/attach"
      - "POST /payments — binding & reinstatement"
    shared_operations:
      - "All GET reads"

  - name: Underwriter
    description: "Risk authority: scores risk, schedules inspections, takes review, binds/declines, lapses/cancels, removes endorsements. Cannot create properties/applications or tender payments (segregation of duties)."
    identity: "entity_backed:Underwriter"
    exclusive_operations:
      - "POST /risk-assessments"
      - "POST /inspections"
      - "POST /applications/{id}/take-review, .../return-to-queue, .../bind, .../decline"
      - "POST /policies/{id}/lapse, POST /policies/{id}/cancel"
      - "POST /endorsements/{id}/remove"
    shared_operations:
      - "All GET reads"

  - name: Inspector
    description: "Field inspector: completes and reschedules inspections."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/complete"
      - "POST /inspections/{id}/reschedule"
    shared_operations:
      - "GET /inspections"
