              as: KitchenLead
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 30, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { slip_id: $.data.id }
            - call: "POST /showtimes/${x1_id}/start-service"
              payload: {}
              as: KitchenLead
