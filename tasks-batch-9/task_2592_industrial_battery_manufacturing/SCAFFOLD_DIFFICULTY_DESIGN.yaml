          REVOKED (3) -> every SCHEDULED test on those assemblies VOIDED (4). The
          fan-out at hops 3 and 4 hits siblings the trigger never named, and the
          voided sibling test proves the cascade is transitive rather than a single
          two-entity rule: nothing links test T2 to test T1 except the lot.
