            - "Call 2 isolates the state violation and returns HTTP 409 with data.error_id == ERR_SURVEY_ROUND_NOT_OPEN"
            - "Call 4 isolates the link violation on an OPEN round and returns HTTP 422 with ERR_ENTITY_LINK_MISMATCH, confirming both rules are individually live"
            - "Call 5 returns HTTP 201 and SurveyRound.${r1_id}.observation_count == 1 — none of the three refusals moved the counter"

      - name: revision_limit_violation_on_return_and_resubmit
        claim_type: Violation → Error
        grounds:
          - validations[priority=50]
        excluded_because:
          difficulty_instance: non_linear_state_machine / consult_return_resubmit_cycle_increments_revision
          rationale: "That §1.8 instance walks the TRIAGED -> RETURNED_FOR_INFO -> REQUESTED cycle to the MAX_REVISIONS ceiling and asserts ERR_REVISION_LIMIT_REACHED together with the revision_count that produced it."

      - name: order_not_pending_violation_on_approve
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / order_state_beats_budget_on_approve
          rationale: "ERR_ORDER_NOT_PENDING is the asserted winner there, chosen precisely because the same call also breaches the priority-72 budget ceiling."

      - name: segregation_of_duties_violation_on_validate
        claim_type: Violation → Error
        grounds:
          - validations[priority=30]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_beats_poa_window_on_validate
          rationale: "That §1.8 instance has the staging nurse validate her own assessment on a request that ALSO breaches the POA window, and asserts ERR_SEGREGATION_OF_DUTIES as the returned error."

      - name: certification_gating_violation_on_assign
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=32]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assign_blocked_when_nurse_lapsed
          rationale: "The named §1.8 instance lapses a previously CERTIFIED nurse and asserts that the identical assign call flips from 200 to ERR_NURSE_NOT_CERTIFIED with no change to the consult."

      - name: stage_validation_gating_violation_on_protocol
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=34]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dressing_protocol_blocked_until_assessment_validated
          rationale: "That §1.8 instance files a protocol against a PENDING_VALIDATION assessment for ERR_STAGE_NOT_VALIDATED and then repeats it after validation for the 201."

      - name: surface_occupation_temporal_violation
        claim_type: Temporal validation
        grounds:
          - validations[priority=46]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / surface_adjacent_rental_rejected_by_clean_buffer
          rationale: "The reclean-buffer arithmetic and its ERR_SURFACE_UNAVAILABLE outcome are the entire subject of that §1.8 instance, including the abutting interval that would pass without the buffer."

      - name: survey_window_contention_temporal_violation
        claim_type: Temporal validation
        grounds:
          - validations[priority=44]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / unit_prevalence_window_conflict_closed_interval_capacity
          rationale: "That §1.8 instance covers the closed-interval collision test and the aggregate capacity of 1 for PREVALENCE rounds, asserting ERR_SURVEY_WINDOW_CONFLICT on the touching-endpoint case."

  - section: endpoints
    instances:
      - name: unit_crud_create_read_and_paginated_list
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /units]
          - endpoints[GET /units/{unit_id}]
          - endpoints[GET /units]
          - entities.Unit
        distinguishing_aspect: "The create/read/list triple has to agree with itself: the read must echo the created row including every computed default, and the list must report total_count and has_more against the FULL filtered set rather than the page, so a limit of 2 over 3 rows must still say 3."
        test_recipe:
          setup:
            - "Three units 3E, 4W and 5N are created with different bed counts and different rental caps; nothing else exists."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /units"
              payload: { unit_code: "4W", name: "Four West", bed_count: 22, rental_budget_cap_cents: 100000 }
              as: WocProgramDirector
              captures: { u2_id: "$.data.id" }
            - call: "POST /units"
              payload: { unit_code: "5N", name: "Five North", bed_count: 30 }
              as: WocProgramDirector
              captures: { u3_id: "$.data.id" }
          trigger:
            - call: "GET /units/${u2_id}"
              payload: {}
              as: UnitCharge
              as_user_id: "${u2_id}"
            - call: "GET /units?limit=2&offset=0"
              payload: {}
              as: WocProgramDirector
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /units?limit=2&offset=2"
              payload: {}
              as: WocProgramDirector
            - call: "GET /units?survey_posture=OPEN"
              payload: {}
              as: WocProgramDirector
          assert:
            - "Every create returned HTTP 201 with a system-generated id, created_at, updated_at and version == 1"
            - "Unit.${u3_id}.rental_budget_cap_cents == 0 — the omitted optional input took its declared default"
            - "Call 1 returns HTTP 200 and echoes the stored row exactly: unit_code == \"4W\", name == \"Four West\", bed_count == 22, rental_budget_cap_cents == 100000"
            - "Call 1 also shows the computed defaults: rental_encumbered_cents == 0, rental_committed_cents == 0, rental_released_cents == 0, rental_available_cents == 100000, open_hapi_rca_count == 0, disputed_staging_count == 0, survey_posture == OPEN, last_prevalence_rate == null, last_incidence_rate == null"
            - "Call 2 returns exactly 2 rows with total_count == 3 and has_more == true — the count describes the whole result set, not the page"
            - "Call 3 returns exactly 1 row with total_count == 3 and has_more == false, and its id is neither ${page1_first_id} nor the other first-page id: the offset window does not overlap"
            - "Call 4 returns 3 rows with total_count == 3: all three units are at the OPEN end of the posture ladder, so the filter is satisfied by every row"
            - "None of the four reads mutated anything: every unit's version is still 1"

      - name: nurse_lapse_action_zeroes_max_load_without_touching_active_load
        claim_type: Action endpoint
        grounds:
