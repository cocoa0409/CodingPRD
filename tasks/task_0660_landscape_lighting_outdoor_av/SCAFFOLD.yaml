    roles: [InstallTech]
    code: 201
    input: [project_id, quote_id]
    output: InstallJob
    side_effects: ["status=SCHEDULED, wiring_status=PENDING, fixtures_status=PENDING"]

  - method: GET
    path: "/install-jobs/{id}"
    description: "Read an install job."
    roles: [InstallTech, LightingDesigner, OperationsAdmin]
    code: 200
    input: []
    output: InstallJob
    side_effects: []

  - method: GET
    path: "/projects/{id}/install-jobs"
    description: "List install jobs for a project (reverse-reachability for InstallJob.project_id)."
    roles: [InstallTech, LightingDesigner, OperationsAdmin]
    code: 200
    input: []
    output: InstallJob[]
    side_effects: []

  - method: GET
    path: "/quotes/{id}/install-jobs"
    description: "List install jobs authorized by a quote (reverse-reachability for InstallJob.quote_id)."
    roles: [InstallTech, LightingDesigner, OperationsAdmin]
    code: 200
    input: []
    output: InstallJob[]
    side_effects: []

  - method: POST
    path: "/install-jobs/{id}/start"
    description: "Start an install job (SCHEDULED -> IN_PROGRESS)."
    roles: [InstallTech]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status=IN_PROGRESS"]

  - method: POST
    path: "/install-jobs/{id}/complete-wiring"
    description: "Complete wiring branch; energizes staged transformers."
    roles: [InstallTech]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["wiring_status=WIRED", "staged transformers on project -> ENERGIZED"]

  - method: POST
    path: "/install-jobs/{id}/complete-fixtures"
    description: "Complete fixtures branch; mounts planned zoned fixtures (requires WIRED). On join, energizes job and sets project INSTALLED."
    roles: [InstallTech]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["fixtures_status=MOUNTED", "planned zoned fixtures -> INSTALLED", "join -> status=ENERGIZED, project commercial_status INSTALLED"]

  - method: POST
    path: "/install-jobs/{id}/cancel"
    description: "Cancel a scheduled install job (SCHEDULED -> CANCELLED)."
    roles: [InstallTech]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status=CANCELLED"]

  # ----- ScheduleProgram -----
  - method: POST
    path: "/schedule-programs"
    description: "Create a draft schedule program (smart-control scene window)."
    roles: [ControlProgrammer]
    code: 201
    input: [project_id, scene_label, window_start_min, window_end_min]
    output: ScheduleProgram
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/schedule-programs/{id}"
    description: "Read a schedule program."
    roles: [ControlProgrammer, OperationsAdmin]
    code: 200
    input: []
    output: ScheduleProgram
    side_effects: []

  - method: GET
    path: "/projects/{id}/schedule-programs"
    description: "List schedule programs for a project (reverse-reachability for ScheduleProgram.project_id)."
    roles: [ControlProgrammer, OperationsAdmin]
    code: 200
    input: []
    output: ScheduleProgram[]
    side_effects: []

  - method: POST
    path: "/schedule-programs/{id}/activate"
    description: "Activate a program (DRAFT -> ACTIVE; buffered window-overlap gate)."
    roles: [ControlProgrammer]
    code: 200
    input: []
    output: ScheduleProgram
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/schedule-programs/{id}/disable"
    description: "Disable an active program (ACTIVE -> DISABLED)."
    roles: [ControlProgrammer]
    code: 200
    input: []
    output: ScheduleProgram
    side_effects: ["status=DISABLED"]

  # ----- ServicePlan -----
  - method: POST
    path: "/service-plans"
    description: "Create a pending service plan for a project."
    roles: [OperationsAdmin, Customer]
    code: 201
    input: [project_id, tier, annual_fee_cents, "refundable?"]
    output: ServicePlan
    side_effects: ["status=PENDING, season_cycle_count=0"]

  - method: GET
    path: "/service-plans/{id}"
    description: "Read a service plan."
    roles: [OperationsAdmin, Customer, InstallTech]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []

  - method: GET
    path: "/projects/{id}/service-plans"
    description: "List service plans for a project (reverse-reachability for ServicePlan.project_id)."
    roles: [OperationsAdmin, Customer, InstallTech]
    code: 200
    input: []
    output: ServicePlan[]
    side_effects: []

  - method: POST
    path: "/service-plans/{id}/activate"
    description: "Activate a plan (PENDING -> ACTIVE; debits annual fee)."
    roles: [Customer]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["status=ACTIVE, activated_at stamped, Customer.wallet_credit_cents debited by annual_fee_cents"]

  - method: POST
    path: "/service-plans/{id}/begin-seasonal-adjustment"
    description: "Begin a seasonal adjustment (ACTIVE -> ADJUSTING)."
    roles: [InstallTech]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["status=ADJUSTING"]

  - method: POST
    path: "/service-plans/{id}/complete-seasonal-adjustment"
    description: "Complete a seasonal adjustment (ADJUSTING -> ACTIVE; cycle)."
    roles: [InstallTech]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["status=ACTIVE, season_cycle_count incremented by 1"]

  - method: POST
    path: "/service-plans/{id}/cancel"
    description: "Cancel an active plan (ACTIVE -> CANCELLED; refund per calc service_plan_refund)."
    roles: [Customer]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["status=CANCELLED, Customer.wallet_credit_cents credited by refund (PRORATED or FORFEIT)"]

  # ----- ServiceVisit -----
  - method: POST
    path: "/service-visits"
    description: "Request a service visit under a plan."
    roles: [Customer, InstallTech]
    code: 201
    input: [service_plan_id, project_id, visit_date, window_start_min, window_end_min]
    output: ServiceVisit
    side_effects: ["status=REQUESTED, route_id=null"]

  - method: GET
    path: "/service-visits/{id}"
    description: "Read a service visit (lazily transitions to MISSED if past date and unrouted)."
    roles: [Customer, InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["lazy REQUESTED->MISSED if clock date > visit_date"]

  - method: GET
    path: "/service-plans/{id}/service-visits"
    description: "List visits under a plan (reverse-reachability for ServiceVisit.service_plan_id)."
    roles: [Customer, InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: ServiceVisit[]
    side_effects: []

  - method: GET
    path: "/projects/{id}/service-visits"
    description: "List visits for a project (reverse-reachability for ServiceVisit.project_id)."
    roles: [Customer, InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: ServiceVisit[]
    side_effects: []

  # ----- CrewRoute -----
  - method: POST
    path: "/crew-routes"
    description: "Create an open crew route for a technician on a date."
    roles: [InstallTech]
    code: 201
    input: [technician_id, route_date]
    output: CrewRoute
    side_effects: ["status=OPEN, visit_count=0"]

  - method: GET
    path: "/crew-routes/{id}"
    description: "Read a crew route including visit_count."
    roles: [InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: CrewRoute
    side_effects: []

  - method: GET
    path: "/crew-routes/{id}/visits"
    description: "List visits sequenced on a route (reverse-reachability for ServiceVisit.route_id)."
    roles: [InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: ServiceVisit[]
    side_effects: []

  - method: POST
    path: "/crew-routes/{id}/add-visit"
    description: "Add a requested visit to an open route (half-open window-overlap gate)."
    roles: [InstallTech]
    code: 200
    input: [visit_id]
    output: ServiceVisit
    side_effects: ["visit.route_id set, status=ROUTED, CrewRoute.visit_count recomputed"]

  - method: POST
    path: "/crew-routes/{id}/dispatch"
    description: "Dispatch a route (OPEN -> DISPATCHED)."
    roles: [InstallTech]
    code: 200
    input: []
    output: CrewRoute
    side_effects: ["status=DISPATCHED"]

  - method: POST
    path: "/crew-routes/{id}/complete"
    description: "Complete a dispatched route (DISPATCHED -> COMPLETED; cascades routed visits to COMPLETED)."
    roles: [InstallTech]
    code: 200
    input: []
    output: CrewRoute
    side_effects: ["status=COMPLETED", "routed visits -> COMPLETED"]

  # ----- WarrantyClaim -----
  - method: POST
    path: "/warranty-claims"
    description: "Submit a warranty claim against an installed fixture (sets fixture FAILED)."
    roles: [Customer]
    code: 201
    input: [fixture_id, project_id, reason]
    output: WarrantyClaim
    side_effects: ["status=SUBMITTED", "fixture INSTALLED->FAILED; zone+transformer load recomputed"]

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Read a warranty claim including credit_variant and credit_cents."
    roles: [Customer, OperationsAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/projects/{id}/warranty-claims"
    description: "List warranty claims for a project (reverse-reachability for WarrantyClaim.project_id)."
    roles: [Customer, OperationsAdmin]
    code: 200
    input: []
    output: WarrantyClaim[]
    side_effects: []

  - method: GET
    path: "/fixtures/{id}/warranty-claims"
    description: "List warranty claims against a fixture (reverse-reachability for WarrantyClaim.fixture_id)."
    roles: [Customer, OperationsAdmin]
    code: 200
    input: []
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Approve a claim (SUBMITTED -> APPROVED; credits customer; re-energizes fixture)."
    roles: [OperationsAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["credit computed via calc warranty_replacement_credit", "Customer.wallet_credit_cents credited", "fixture FAILED->INSTALLED"]

  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Deny a claim (SUBMITTED -> DENIED)."
    roles: [OperationsAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status=DENIED"]

  # ----- AddOnModule -----
  - method: POST
    path: "/add-ons"
    description: "Propose an audio/security add-on module for a project."
    roles: [ControlProgrammer, LightingDesigner]
    code: 201
    input: [project_id, kind, power_draw_va, "zone_id?"]
    output: AddOnModule
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/add-ons/{id}"
    description: "Read an add-on module."
    roles: [ControlProgrammer, LightingDesigner, OperationsAdmin]
    code: 200
    input: []
    output: AddOnModule
    side_effects: []

  - method: GET
    path: "/projects/{id}/add-ons"
    description: "List add-ons for a project (reverse-reachability for AddOnModule.project_id)."
    roles: [ControlProgrammer, LightingDesigner, OperationsAdmin]
    code: 200
    input: []
    output: AddOnModule[]
    side_effects: []

  - method: GET
    path: "/zones/{id}/add-ons"
    description: "List add-ons powered by a zone (reverse-reachability for AddOnModule.zone_id)."
    roles: [ControlProgrammer, LightingDesigner, OperationsAdmin]
    code: 200
    input: []
    output: AddOnModule[]
    side_effects: []

  - method: POST
    path: "/add-ons/{id}/activate"
    description: "Activate an add-on (PROPOSED -> ACTIVE; capacity-gated if zone-powered)."
    roles: [ControlProgrammer]
    code: 200
    input: []
    output: AddOnModule
    side_effects: ["status=ACTIVE; Transformer.committed_load_va recomputed if zone-powered"]

  - method: POST
    path: "/add-ons/{id}/remove"
    description: "Remove an active add-on (ACTIVE -> REMOVED)."
    roles: [ControlProgrammer]
    code: 200
    input: []
    output: AddOnModule
    side_effects: ["status=REMOVED; Transformer.committed_load_va recomputed if zone-powered"]

  # ----- Test-driving clock -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All deadlines, expiries, proration, and warranty-age math read this clock."
    roles: [OperationsAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID, or unknown role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this operation per §1.7."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A referenced path/body id does not resolve to an existing resource."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, invalid enum value, or pagination limit out of [1,100]."
  - id: ERR_CROSS_PROJECT_REFERENCE
    http: 409
    condition: "A FK references an entity in a different project than required (zone->transformer, fixture->zone, line->quote project mismatch)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is defined."
  - id: ERR_STALE_TRANSFORMER_VERSION
    http: 412
    condition: "expected_transformer_version does not equal the target zone's Transformer.version (OCC)."
  - id: ERR_WIRING_NOT_COMPLETE
    http: 409
    condition: "complete-fixtures attempted while wiring_status != WIRED."
  - id: ERR_UNZONED_FIXTURE
    http: 409
    condition: "lock-design attempted while a PLANNED fixture on the project has null zone_id."
  - id: ERR_VISIT_WINDOW_OVERLAP
    http: 409
    condition: "Adding a visit whose half-open window overlaps an already-ROUTED visit on the same route."
  - id: ERR_SCENE_WINDOW_TOO_CLOSE
    http: 409
    condition: "Activating a program whose window is within TRANSITION_BUFFER_MIN minutes of an ACTIVE program on the same project."
  - id: ERR_TRANSFORMER_CAPACITY_EXCEEDED
    http: 409
    condition: "A fixture assignment or zone-powered add-on activation would push committed_load_va above usable_capacity_va."
  - id: ERR_OUT_OF_WARRANTY
    http: 409
    condition: "Approving a claim when age_months >= fixture.warranty_months (age_months == warranty_months is out)."
  - id: ERR_INVALID_WINDOW
    http: 400
    condition: "window_end_min not strictly greater than window_start_min, or out of 0..1440 range."
  - id: ERR_DEMO_TIME_REQUIRED
    http: 400
    condition: "night_demo_requested true but night_demo_at missing on quote create."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Customer email already exists (case-insensitive)."
  - id: ERR_TRANSFORMER_NOT_ENERGIZED
    http: 409
    condition: "Decommission attempted on a transformer not in ENERGIZED, or a zone still has PLANNED/INSTALLED fixtures."
  - id: ERR_QUOTE_NO_LINES
    http: 409
    condition: "Sending a quote that has zero QuoteLines."
  - id: ERR_DESIGN_NOT_LOCKED
    http: 409
    condition: "Sending a quote whose project design_status != DESIGN_LOCKED."
  - id: ERR_PROJECT_NOT_INSTALLED
    http: 409
    condition: "Activating a service plan, schedule program, or add-on while project commercial_status != INSTALLED."
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "Accepting/rejecting a quote that has lazily transitioned to EXPIRED."
  - id: ERR_ROUTE_DATE_MISMATCH
    http: 409
    condition: "Adding a visit whose visit_date does not equal the route's route_date."
  - id: ERR_PLAN_BLOCKS_CLOSE
    http: 409
    condition: "Closing a project that still has a ServicePlan in PENDING or ADJUSTING."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LightingDesigner
    description: "Designs projects: creates projects, transformers, zones, fixtures, quotes, lines; locks design; proposes add-ons."
    identity: opaque
    exclusive_operations:
      - "POST /transformers"
      - "POST /projects/{id}/zones"
      - "POST /fixtures"
      - "POST /fixtures/{id}/assign-zone"
      - "POST /projects/{id}/lock-design"
      - "POST /quotes"
      - "POST /quotes/{id}/lines"
      - "POST /quotes/{id}/send"
      - "POST /quotes/{id}/revise"
    shared_operations:
      - "POST /projects"
      - "POST /add-ons"
      - "GET (project/transformer/zone/fixture/quote/add-on reads and lists)"

  - name: InstallTech
    description: "Installs and services: runs install jobs, wiring, fixture mounting/removal, transformer decommission, crew routes, seasonal adjustments."
    identity: opaque
    exclusive_operations:
      - "POST /install-jobs"
      - "POST /install-jobs/{id}/start"
      - "POST /install-jobs/{id}/complete-wiring"
      - "POST /install-jobs/{id}/complete-fixtures"
      - "POST /install-jobs/{id}/cancel"
      - "POST /fixtures/{id}/remove"
      - "POST /transformers/{id}/decommission"
      - "POST /crew-routes"
      - "POST /crew-routes/{id}/add-visit"
      - "POST /crew-routes/{id}/dispatch"
      - "POST /crew-routes/{id}/complete"
      - "POST /service-plans/{id}/begin-seasonal-adjustment"
      - "POST /service-plans/{id}/complete-seasonal-adjustment"
    shared_operations:
      - "POST /service-visits"
      - "GET (install/transformer/route/visit/plan reads and lists)"

  - name: ControlProgrammer
    description: "Programs smart-control scenes and activates add-ons."
    identity: opaque
    exclusive_operations:
      - "POST /schedule-programs"
      - "POST /schedule-programs/{id}/activate"
      - "POST /schedule-programs/{id}/disable"
      - "POST /add-ons/{id}/activate"
      - "POST /add-ons/{id}/remove"
    shared_operations:
      - "POST /add-ons"
      - "GET (schedule-program/add-on reads and lists)"

  - name: Customer
    description: "Property owner: accepts/rejects quotes, manages service plans, requests visits, files warranty claims."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /quotes/{id}/accept"
      - "POST /quotes/{id}/reject"
      - "POST /service-plans/{id}/activate"
      - "POST /service-plans/{id}/cancel"
      - "POST /warranty-claims"
    shared_operations:
      - "POST /service-plans"
      - "POST /service-visits"
      - "GET (own project/quote/fixture/plan/visit/claim reads)"

  - name: OperationsAdmin
    description: "Operator: registers customers, manages plan catalog, approves/denies claims, closes projects, sets the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /projects/{id}/close"
      - "POST /warranty-claims/{id}/approve"
      - "POST /warranty-claims/{id}/deny"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /projects"
      - "POST /service-plans"
      - "GET (all reads and lists)"
