        claim_type: "role denial"
        grounds:
          - roles.Consumer
          - endpoints.POST_/crayon-works/colors
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The public Consumer role is confined to ballot casting: color creation is 403 ERR_UNAUTHORIZED."
