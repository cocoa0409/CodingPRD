  - id: ERR_TERMINATION_CASE_NOT_FOUND
    http: 404
    condition: "no TerminationCase with the given id"
  - id: ERR_MISREPRESENTATION_CASE_NOT_FOUND
    http: 404
    condition: "no MisrepresentationCase with the given id"
  - id: ERR_REFERENCE_FILE_NOT_FOUND
    http: 404
    condition: "no ReferenceFile with the given id"
  - id: ERR_INGESTION_BATCH_NOT_FOUND
    http: 404
    condition: "no IngestionBatch with the given id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "no SafeHarborAudit with the given id"

  - id: ERR_INVALID_AGENT_STATE
    http: 409
    condition: "the designated agent's registration_status does not permit this transition (submit from SUBMITTED or REGISTERED, register from DRAFT or LAPSED, lapse from anything but REGISTERED)"
  - id: ERR_INVALID_POLICY_STATE
    http: 409
    condition: "publish attempted on a policy that is already PUBLISHED or SUPERSEDED"
  - id: ERR_INVALID_NOTICE_STATE
    http: 409
    condition: "validate on a notice that is not RECEIVED, process on a notice that is not VALIDATED, or withdraw on a REJECTED, WITHDRAWN or CLOSED notice"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "restore on a claim that is not RESTORATION_SCHEDULED, or uphold on a claim that is neither DISABLED nor RESTORATION_SCHEDULED-with-a-BLOCKED_BY_SUIT-counter-notice"
  - id: ERR_INVALID_COUNTER_NOTICE_STATE
    http: 409
    condition: "validate on a counter-notice that is not RECEIVED, forward on one that is not VALIDATED, or record-suit-notice on one that is not FORWARDED or RESTORATION_SCHEDULED"
  - id: ERR_INVALID_CONTENT_STATE
    http: 409
    condition: "purge attempted on a PURGED item, or on a DISABLED item with a COUNTER_NOTICED or RESTORATION_SCHEDULED claim"
  - id: ERR_INVALID_ACCOUNT_STANDING
    http: 409
    condition: "reinstate attempted on an account that is not TERMINATED, or on a TERMINATED account whose recomputed strike_points are still at or above limitation_threshold_points"
  - id: ERR_INVALID_TERMINATION_STATE
    http: 409
    condition: "execute on a case that is not OPEN, file-appeal on a case that is not EXECUTED, or decide-appeal on a case that is not APPEAL_FILED"
  - id: ERR_INVALID_MISREPRESENTATION_STATE
    http: 409
    condition: "substantiate or dismiss on a case that is not OPEN, or substantiate against an UPHELD claim"
  - id: ERR_INVALID_REFERENCE_FILE_STATE
    http: 409
    condition: "activate on a file that is ACTIVE or QUARANTINED"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "complete on a batch that is not PROCESSING or whose notices are not all settled, or reject on a batch that already has notices"

  - id: ERR_DESIGNATED_AGENT_NOT_REGISTERED
    http: 409
    condition: "notice validation attempted while the provider has no REGISTERED designated agent"
  - id: ERR_PUBLIC_CONTACT_NOT_PUBLISHED
    http: 409
    condition: "agent registration attempted before the provider published its public contact information"
  - id: ERR_SAFE_HARBOR_NOT_ELIGIBLE
    http: 403
    condition: "automated ingestion attempted while the provider's safe_harbor_status is not ELIGIBLE"
  - id: ERR_REPEAT_INFRINGER_POLICY_NOT_PUBLISHED
    http: 409
    condition: "notice processing or termination execution attempted with no PUBLISHED repeat infringer policy"

  - id: ERR_RESTORATION_TOO_EARLY
    http: 409
    condition: "restore attempted before the claim's restoration_due_at"
  - id: ERR_COUNTER_NOTICE_WINDOW_CLOSED
    http: 409
    condition: "counter-notice submitted after claim.disabled_at plus counter_notice_window_days"
  - id: ERR_COUNTER_NOTICE_WINDOW_OPEN
    http: 409
    condition: "uphold attempted while the counter-notice window is still open"
  - id: ERR_SUIT_NOTICE_WINDOW_CLOSED
    http: 409
    condition: "notice of court action recorded at or after restoration_deadline_at"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "appeal filed at or after the termination case's appeal_deadline_at"
  - id: ERR_REGISTRATION_NOT_EXPIRED
    http: 409
    condition: "lapse attempted before the designated agent's expires_at"

  - id: ERR_RIGHTS_HOLDER_NOT_ENROLLED
    http: 409
    condition: "reference-file activation, ingestion or tier promotion attempted while the holder is PROSPECT or SUSPENDED"
  - id: ERR_ACCOUNT_TERMINATED
    http: 403
    condition: "a terminated account attempts to upload material or submit a counter-notice"
  - id: ERR_ACCOUNT_UPLOAD_RESTRICTED
    http: 403
    condition: "an account whose standing is LIMITED attempts to upload material"
  - id: ERR_PROGRAM_TIER_INSUFFICIENT
    http: 409
    condition: "a STANDARD-tier holder attempts automated ingestion or submits a notice carrying an ingestion_batch_id"
  - id: ERR_NO_REFERENCE_FILE_ACTIVE
    http: 409
    condition: "promotion to TRUSTED attempted with no ACTIVE reference file"
  - id: ERR_ABUSE_SCORE_TOO_HIGH
    http: 409
    condition: "promotion attempted with abuse_score at or above 40, or enrollment attempted with abuse_score at or above 70"

  - id: ERR_RESTORATION_BLOCKED_BY_SUIT
    http: 409
    condition: "restore attempted while the governing counter-notice is BLOCKED_BY_SUIT"

  - id: ERR_CONTENT_URL_CONFLICT
    http: 409
    condition: "content_url already exists under the same provider"
  - id: ERR_ACCOUNT_HANDLE_CONFLICT
    http: 409
    condition: "handle already exists under the same provider"
  - id: ERR_DUPLICATE_CLAIM_WINDOW
    http: 409
    condition: "every resolvable claimed URL already sits inside the half-open dispute interval of an existing claim from the same rights holder"
  - id: ERR_MISREPRESENTATION_CASE_EXISTS
    http: 409
    condition: "an OPEN misrepresentation case already exists for this (rights_holder_id, claim_id) pair"
  - id: ERR_AGENT_ALREADY_REGISTERED
    http: 409
    condition: "the provider already has a REGISTERED designated agent"

  - id: ERR_NO_ACTIONABLE_CLAIMS
    http: 422
    condition: "processing a validated notice whose claimed_urls resolve to no ContentItem in AVAILABLE or RESTORED"

  - id: ERR_REFERENCE_QUOTA_EXCEEDED
    http: 409
    condition: "the holder's PENDING plus ACTIVE reference files would exceed reference_file_quota"
  - id: ERR_INGESTION_WINDOW_QUOTA_EXCEEDED
    http: 409
    condition: "rolling_item_total in the closed 24-hour window would exceed daily_item_quota"

  - id: ERR_STALE_PROVIDER_VERSION
    http: 412
    condition: "expected_provider_version does not equal the provider's current version"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal the claim's current version"

# =============================================================================
# Table 7: RBAC Matrix (§1.7) — segregation of duties
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Owns the provider's safe harbor documentation: agent registration, policy publication, account lifecycle, terminations and audits"
    identity: "opaque"
    exclusive_operations:
      - "POST /dmca/providers"
      - "POST /dmca/providers/{id}/publish-contact"
      - "POST /dmca/designated-agents"
      - "POST /dmca/designated-agents/{id}/submit"
      - "POST /dmca/designated-agents/{id}/register"
      - "POST /dmca/designated-agents/{id}/lapse"
      - "POST /dmca/repeat-infringer-policies"
      - "POST /dmca/repeat-infringer-policies/{id}/publish"
      - "POST /dmca/accounts"
      - "POST /dmca/accounts/{id}/reinstate"
      - "POST /dmca/rights-holders"
      - "POST /dmca/rights-holders/{id}/enroll"
      - "POST /dmca/rights-holders/{id}/promote-tier"
      - "POST /dmca/ingestion-batches/{id}/reject"
      - "POST /dmca/termination-cases/{id}/execute"
      - "POST /dmca/termination-cases/{id}/decide-appeal"
      - "POST /dmca/safe-harbor-audits"
    shared_operations:
      - "POST /dmca/rights-holders/{id}/suspend (with AbuseInvestigator)"
      - "POST /dmca/reference-files and POST /dmca/reference-files/{id}/activate (with RightsHolderRep)"
      - "POST /dmca/content-items/{id}/purge (with Subscriber)"
      - "all GET endpoints except the subscriber-owned reads"
    note: "A ComplianceOfficer who executed a termination cannot decide its appeal; a second officer identity must decide."

  - name: TakedownAgent
    description: "Processes notice intake, disabling, counter-notice handling and restoration"
    identity: "opaque"
    exclusive_operations:
      - "POST /dmca/notices/{id}/validate"
      - "POST /dmca/notices/{id}/process"
      - "POST /dmca/claims/{id}/uphold"
      - "POST /dmca/claims/{id}/restore"
      - "POST /dmca/counter-notices/{id}/validate"
      - "POST /dmca/counter-notices/{id}/forward"
      - "POST /dmca/counter-notices/{id}/record-suit-notice"
    shared_operations:
      - "POST /dmca/notices (with RightsHolderRep)"
      - "GET reads across providers, accounts, notices, claims, counter-notices, strikes and reference files"

  - name: AbuseInvestigator
    description: "Detects fraudulent takedowns and assesses misrepresentation penalties"
    identity: "opaque"
    exclusive_operations:
      - "POST /dmca/misrepresentation-cases"
      - "POST /dmca/misrepresentation-cases/{id}/substantiate"
      - "POST /dmca/misrepresentation-cases/{id}/dismiss"
    shared_operations:
      - "POST /dmca/rights-holders/{id}/suspend (with ComplianceOfficer)"
      - "GET reads across providers, accounts, rights holders, notices, claims, counter-notices and audits"
    note: "An investigator who opened a case cannot substantiate or dismiss it; a second investigator identity must decide."

  - name: RightsHolderRep
    description: "Acts for one rights holder: notice submission, withdrawal, reference files and automated ingestion"
    identity: "entity_backed:RightsHolder"
    exclusive_operations:
      - "POST /dmca/notices/{id}/withdraw"
      - "POST /dmca/ingestion-batches"
      - "POST /dmca/ingestion-batches/{id}/complete"
    shared_operations:
      - "POST /dmca/notices (with TakedownAgent)"
      - "POST /dmca/reference-files and POST /dmca/reference-files/{id}/activate (with ComplianceOfficer)"
      - "GET reads limited to its own rights holder, notices, claims, reference files and ingestion batches"

  - name: Subscriber
    description: "Acts for one account: uploads material, submits counter-notices and appeals terminations"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /dmca/content-items"
      - "POST /dmca/counter-notices"
      - "POST /dmca/termination-cases/{id}/file-appeal"
    shared_operations:
      - "POST /dmca/content-items/{id}/purge (with ComplianceOfficer)"
      - "GET reads limited to its own account, content items, strikes, termination cases, claims and counter-notices"








