        claim_type: conditional_action
        grounds: ["concurrency_rules[markdown-decision-stale-item]", "errors[ERR_STALE_ITEM_VERSION]"]
        distinguishing_aspect: "A markdown decision carrying an item version one behind the current version is rejected with ERR_STALE_ITEM_VERSION (412)."
        test_recipe:
          setup: ["Region, vendor, ACTIVE TREASURE_HUNT item (exit window 2026-09-30); client observed version before activation"]
