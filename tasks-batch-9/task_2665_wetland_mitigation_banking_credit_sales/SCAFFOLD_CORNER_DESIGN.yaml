        distinguishing_aspect: "Only standards with effective_from_year <= monitoring_year enter the score, so a year-1 report supplies just two of the bank's four measurements without tripping ERR_MEASUREMENT_MISSING and its denominator is 0.550 (0.300 + 0.250) rather than 1.000 — scoring 1.0000 PASS even though the two year-3 standards were never measured."
