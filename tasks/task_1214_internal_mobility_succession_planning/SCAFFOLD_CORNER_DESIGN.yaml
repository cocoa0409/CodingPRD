  # ============================================================ rbac
  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: rbac_deny
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails authentication (401) before any role check."
        test_recipe:
          setup: ["empty database; request sent with no X-User-Role / X-User-ID headers"]
          setup_api_calls: []
          trigger:
            - { call: "GET /talent/employees", as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401 (headers stripped by the test harness for this call)"

      - name: employee_cannot_create_critical_role
        claim_type: rbac_deny
        grounds: ["validations[priority=2]", roles.Employee]
        distinguishing_aspect: "The Employee role is not in the roles list of POST /talent/critical-roles: ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["one employee exists to act as the caller"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "E120", full_name: "Erin Nope", department: "ENG", job_level: 4, hire_date: "2023-06-01", performance_rating: "SOLID" }, as: HRAdmin, captures: { e: $.data.id } }
          trigger:
            - { call: "POST /talent/critical-roles", payload: { role_title: "Nope Role", department: "ENG", criticality_tier: "TIER_3", assessment_method: "WEIGHTED" }, as: Employee, as_user_id: "${e}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED and http status 403"

      - name: manager_cannot_endorse_nomination
        claim_type: rbac_deny
        grounds: ["validations[priority=2]", roles.Manager]
        distinguishing_aspect: "Endorse is HRBusinessPartner-exclusive; a Manager caller is rejected with ERR_UNAUTHORIZED before the segregation-of-duties check (priority 2 < 7)."
        test_recipe:
          setup: ["OPEN cycle; nomination of N121 by manager M121"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "MGR121", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "N121", full_name: "Nia Nom", department: "ENG", job_level: 5, hire_date: "2023-01-15", performance_rating: "STRONG", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { n: $.data.id } }
            - { call: "POST /talent/hipo-cycles", payload: { cycle_name: "2026-C121", capacity: 5 }, as: HRAdmin, captures: { cy: $.data.id } }
            - { call: "POST /talent/hipo-cycles/${cy}/nominations", payload: { employee_id: "${n}" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id } }
          trigger:
            - { call: "POST /talent/hipo-nominations/${nom}/endorse", as: Manager, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (role gate fires before the segregation-of-duties gate)"

      - name: hrbp_cannot_enroll_nomination
        claim_type: rbac_deny
        grounds: ["validations[priority=2]", roles.TalentManager]
        distinguishing_aspect: "Enroll is TalentManager-exclusive; HRBusinessPartner (who can endorse) is rejected with ERR_UNAUTHORIZED — peer roles own disjoint steps of the program pipeline."
        test_recipe:
          setup: ["OPEN cycle; nomination of N122 endorsed"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC122", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR122", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "N122", full_name: "Nia Nom", department: "ENG", job_level: 5, hire_date: "2023-01-15", performance_rating: "STRONG", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { n: $.data.id } }
            - { call: "POST /talent/hipo-cycles", payload: { cycle_name: "2026-C122", capacity: 5 }, as: HRAdmin, captures: { cy: $.data.id } }
            - { call: "POST /talent/hipo-cycles/${cy}/nominations", payload: { employee_id: "${n}" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id } }
            - { call: "POST /talent/hipo-nominations/${nom}/endorse", as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/hipo-nominations/${nom}/enroll", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED; nomination remains ENDORSED"

      - name: hipo_endorse_by_nominator_returns_segregation_of_duties
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The same person may not nominate and endorse: an HRBP-role call whose X-User-ID equals the nomination's nominated_by_manager_id fails with ERR_SEGREGATION_OF_DUTIES (409)."
        test_recipe:
          setup: ["OPEN cycle; nomination of N123 created by M123"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "MGR123", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "N123", full_name: "Nia Nom", department: "ENG", job_level: 5, hire_date: "2023-01-15", performance_rating: "STRONG", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { n: $.data.id } }
            - { call: "POST /talent/hipo-cycles", payload: { cycle_name: "2026-C123", capacity: 5 }, as: HRAdmin, captures: { cy: $.data.id } }
            - { call: "POST /talent/hipo-cycles/${cy}/nominations", payload: { employee_id: "${n}" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id } }
          trigger:
            - { call: "POST /talent/hipo-nominations/${nom}/endorse", as: HRBusinessPartner, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES; nomination remains NOMINATED with endorsed_by_id null"

      - name: ratify_by_proposer_returns_segregation_of_duties
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.CalibrationEntry.PROPOSED_to_RATIFIED]
        distinguishing_aspect: "The same person may not propose and ratify: a TalentManager-role call whose X-User-ID equals proposed_by_manager_id fails with ERR_SEGREGATION_OF_DUTIES; a different TalentManager then ratifies successfully."
        test_recipe:
          setup: ["IN_PROGRESS session; entry for E124 proposed by M124"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "TM124", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR124", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E124", full_name: "Erin Subj", department: "ENG", job_level: 5, hire_date: "2023-02-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/calibration-sessions", payload: { name: "CAL-124", department_scope: "ENG", scheduled_start: "2026-04-15T09:00:00Z", scheduled_end: "2026-04-15T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s: $.data.id } }
            - { call: "POST /talent/calibration-sessions/${s}/start", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s}/entries", payload: { employee_id: "${e}", proposed_rating: "SOLID" }, as: Manager, as_user_id: "${mgr}", captures: { en: $.data.id } }
          trigger:
            - { call: "POST /talent/calibration-entries/${en}/ratify", payload: { final_rating: "SOLID" }, as: TalentManager, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
            - { call: "POST /talent/calibration-entries/${en}/ratify", payload: { final_rating: "STRONG" }, as: TalentManager, as_user_id: "${tm}", captures: { st: $.data.status } }
          assert:
            - "first ratify (same person as proposer): error_id == ERR_SEGREGATION_OF_DUTIES"
            - "second ratify (different TalentManager): status == RATIFIED, calibrated_rating == STRONG"

  # ============================================================ complexity layers
  - section: complexity_layers
    instances:
      - name: occ_patch_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[critical-role-patch-stale-version]"]
        distinguishing_aspect: "Two sequential PATCHes carrying the same observed version: the first succeeds (version advances 1 -> 2), the second carries the now-stale version 1 and is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["PROPOSED role at version 1"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC130", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 130", department: "ENG", criticality_tier: "TIER_3", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, rv: $.data.version } }
          trigger:
            - { call: "PATCH /talent/critical-roles/${r}", payload: { role_title: "Role 130 renamed", expected_critical_role_version: "${rv}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { v2: $.data.version } }
            - { call: "PATCH /talent/critical-roles/${r}", payload: { department: "OPS", expected_critical_role_version: "${rv}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "first PATCH succeeds and version advances to 2; role_title == 'Role 130 renamed'"
            - "second PATCH with the stale observed version fails with error_id == ERR_STALE_VERSION, http 412; department unchanged (ENG)"

      - name: occ_successor_create_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[slate-supersede-stale-role]"]
        distinguishing_aspect: "The create-with-supersede endpoint is OCC-guarded on the parent role: after one entry creation advances the role version, a second create carrying the previously observed version is rejected with ERR_STALE_VERSION before any slate constraint runs."
        test_recipe:
          setup: ["ACTIVE role at version 2 after activation; caller holds observed version 2"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC131", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC131", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S131A", full_name: "Sue A", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sa: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S131B", full_name: "Sue B", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sb: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 131", department: "ENG", criticality_tier: "TIER_3", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { rv2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sa}", readiness_rating: "READY_1_2", slate_position: 1, expected_critical_role_version: "${rv2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ea: $.data.id } }
          trigger:
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sb}", readiness_rating: "READY_NOW", slate_position: 2, expected_critical_role_version: "${rv2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (412): the first creation advanced the role version to 3, so the observed version 2 is stale"
            - "no second entry is created (slate still has exactly 1 non-terminal entry)"

      - name: selector_skips_suspended_entry
        claim_type: selector_policy
        grounds: [calculations.slate_fill_selection]
        distinguishing_aspect: "Eligibility filter excludes non-ACTIVE entries: with the position-1 READY_NOW entry SUSPENDED, the fill selects the position-2 ACTIVE READY_1_2 entry instead."
        test_recipe:
          setup: ["vacancy; slate: S132A ACTIVE READY_1_2 at position 2; S132B SUSPENDED READY_NOW at position 1"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC132", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC132", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S132A", full_name: "Sue A", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sa: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S132B", full_name: "Sue B", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sb: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 132", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
