      - name: lodging_beds_are_half_open_per_night_and_aggregate_across_groups
        grounds:
          - "validations[priority 24]"
          - "errors[ERR_LODGING_CAPACITY_EXCEEDED]"
          - "calculations.volunteer_skill_fit_score.constants.LODGING_INTERVAL_SEMANTICS"
          - "entities.LodgingSite.fields.peak_committed_beds"
          - "endpoints[POST /housing-assignments]"
        distinguishing_aspect: "Two overlapping stays already fill L1 to exactly its 20-bed capacity on the nights of 09-09, 09-10 and 09-11. A single extra volunteer on the night of 09-10 must be rejected at 21 beds, while the same one-bed request on the night of 09-12 must be accepted because HA1's check_out_date of 09-12 releases its 12 beds for that night and only HA2's 8 remain. An implementation using closed intervals treats 09-12 as still occupied by HA1 (20 beds) and rejects the second request; one that compares whole stays rather than per-night sums rejects both."
