            - "naming Weatherly with audit_opinion DISCLAIMER returns 200: the join completes and the filing becomes READY_TO_FILE at version 4 with audit_firm_service_provider_id set to Weatherly"
            - "file then returns 409 ERR_AUDIT_OPINION_UNACCEPTABLE — a disclaimer of opinion satisfies the attestation branch but not the acceptance gate"
            - "the final GET shows filing_status READY_TO_FILE, filed_at null, version 4 and filing_deadline_date 2027-08-02"

  - section: rbac
