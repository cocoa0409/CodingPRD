            - call: "POST /demolition-work-orders/${wo1}/complete"
              payload: { work_order_id: "${wo1}", total_debris_tons: 100.00, recycled_tons: 30.00, disposal_manifest_no: "MAN-1", disposal_facility_type: "COMBINED" }
              as: SubrecipientCoordinator
