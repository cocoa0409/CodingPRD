scenario: |
  Generate task harder than expert level!

  2603. Contact Center Quality Monitoring & Coaching (customer service quality program): evaluation form design with weighted behaviors, compliance-critical items and automatic-fail criteria, sample selection across random, targeted and customer-flagged interactions with volume per agent, calibration sessions among evaluators with variance measurement and scoring guidance updates, agent feedback delivery, dispute process and coaching plan assignment, automated speech and text analytics screening to prioritize manual review, correlation of quality scores with customer satisfaction and repeat contact rates, compliance monitoring for disclosure requirements and recording consent, performance improvement escalation and recognition programs

domain_name: contact-center-quality-monitoring
api_prefix: "/"   # flat topology: every entity collection is a top-level path; no shared prefix segment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection at the URL root; parent links are carried as
  # FK fields in request bodies (`plan_id`, `interaction_id`, `selection_id`), never
  # as nested path segments. The only path suffixes are action verbs
  # (`/activate`, `/submit`, `/resolve`) and one computed read
  # (`/agents/{id}/quality-summary`) plus one FK reverse-read
  # (`/evaluation-forms/{id}/behaviors`).

  state_machine_shape: parallel
  # Evaluation carries two independent dimensions on the same row:
  #   review_status   : DRAFT -> SUBMITTED -> FINALIZED, with SUBMITTED/FINALIZED -> REOPENED -> SUBMITTED
  #   feedback_status : PENDING -> DELIVERED -> {ACKNOWLEDGED, DISPUTED} -> PENDING
  # Dispute is cyclic (SUBMITTED -> UNDER_REVIEW -> NEEDS_MORE_INFO -> SUBMITTED).
  # CalibrationSession is branching (SCORING -> {CLOSED_ALIGNED, CLOSED_VARIANT, VOID}).

  relationship_patterns:
    - one_to_many          # EvaluationForm -> FormBehavior, SamplePlan -> SampleSelection
    - many_to_many         # SampleSelection is the junction of SamplePlan x Interaction
    - cross_aggregate      # Evaluation reaches Agent/Interaction/EvaluationForm across aggregates
    - polymorphic: false

  role_model: segregation_of_duties
  # The QualityEvaluator who scored an Evaluation may never review the Dispute filed
  # against it; recording-consent outcomes may only be set by ComplianceAuditor and
  # never by the QualityManager who owns sampling.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 58 endpoints / 65 error codes / 8 calculations (3 with variants) /
  # 9 state machines (parallel + cyclic + branching) / 3 OCC rules / 53 validation rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: EvaluationForm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human label of the scorecard
        constraints: "1..120 chars"
      - name: version_label
        type: string
        source: input
        description: author-assigned revision label
        constraints: "1..20 chars; unique per name"
      - name: status
        type: enum
        source: system
        description: lifecycle state of the scorecard
        default: DRAFT
        constraints: "status IN {DRAFT, ACTIVE, RETIRED}"
      - name: min_compliance_item_score
        type: integer
        source: input
        description: minimum points a compliance-critical behavior must score for compliance_result PASS
        default: 3
        constraints: ">= 1; must be <= the smallest max_points among compliance_critical behaviors"
      - name: auto_fail_policy
        type: enum
        source: input
        description: how an automatic-fail violation reshapes the weighted score
        constraints: "auto_fail_policy IN {ZERO_TOTAL, COMPLIANCE_SECTION_ZERO}"
      - name: behavior_weight_total
        type: number
        source: computed
        description: sum of weight_pct over all FormBehavior rows of this form, 2 decimals
        default: 0.00
      - name: compliance_behavior_count
        type: integer
        source: computed
        description: count of FormBehavior rows of this form with compliance_critical == true
        default: 0
      - name: guidance_version
        type: integer
        source: system
        description: form-level scoring-guidance revision; bumped once per calibration close that carries guidance_updates
        default: 1
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of DRAFT -> ACTIVE; null while DRAFT
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: logical-clock instant of ACTIVE -> RETIRED; null otherwise
        default: null

  - name: FormBehavior
    parent: EvaluationForm
    common_fields: true
    fields:
      - name: form_id
        type: string
        source: input
        description: "FK -> EvaluationForm.id; the scorecard this behavior belongs to"
      - name: code
        type: string
        source: input
        description: stable behavior code referenced by item_scores payloads
        constraints: "^[A-Z_]{2,24}$; unique within form_id"
      - name: label
        type: string
        source: input
        description: display label of the observed behavior
      - name: weight_pct
        type: number
        source: input
        description: percentage weight of this behavior in the form total
        constraints: "> 0.00, <= 100.00, exactly 2 decimals"
      - name: compliance_critical
        type: boolean
        source: input
        description: when true, scoring below form.min_compliance_item_score forces compliance_result FAIL
        default: false
      - name: auto_fail_on_violation
        type: boolean
        source: input
        description: when true, points == 0 on this behavior triggers the form's auto_fail_policy
        default: false
      - name: max_points
        type: integer
        source: input
        description: scale ceiling for this behavior
        default: 5
        constraints: "IN {3, 4, 5}"
      - name: allows_not_applicable
        type: boolean
        source: input
        description: when true, an evaluator may mark this behavior not_applicable
        default: false
      - name: guidance_text
        type: string
        source: input
        description: scoring guidance shown to evaluators
      - name: guidance_version
        type: integer
        source: system
        description: per-behavior guidance revision; bumped by each calibration close that rewrites this behavior's guidance
        default: 1

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - name: external_ref
        type: string
        source: input
        description: workforce-system identifier of the agent
        constraints: unique across Agent
      - name: full_name
        type: string
        source: input
        description: agent display name
      - name: team_code
        type: string
        source: input
        description: team the agent belongs to
      - name: hire_date
        type: datetime
        source: input
        description: ISO 8601 UTC hire instant, used for tenure reporting only
      - name: quality_index_rolling
        type: number
        source: computed
        description: ROLLING_4 variant of agent_quality_index (see 1.3); null when the agent has no evaluation in {SUBMITTED, FINALIZED}
        default: null
      - name: quality_index_period
        type: number
        source: computed
        description: PERIOD_DURATION_WEIGHTED variant of agent_quality_index (see 1.3); null when no OPEN SamplePlan covers the clock instant
        default: null
      - name: open_compliance_findings
        type: integer
        source: computed
        description: count of Interaction rows of this agent with compliance_hold == true
        default: 0
      - name: consecutive_passing_evaluations
        type: integer
        source: computed
        description: streak of consecutive evaluations (by submitted_at ASC, tie-break created_at ASC) with compliance_result PASS and effective_score >= 85.00; reset to 0 by any FAIL or score < 85.00
        default: 0
      - name: coaching_state
        type: enum
        source: system
        description: derived coaching posture driven by compliance findings and coaching plans
        default: NONE
        constraints: "coaching_state IN {NONE, REQUIRED, ACTIVE, CLEARED}"
      - name: recognition_points
        type: integer
        source: system
        description: cumulative recognition-program points awarded
        default: 0

  - name: Evaluator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: evaluator display name
      - name: max_open_assignments
        type: integer
        source: input
        description: cap on concurrently ASSIGNED sample selections for this evaluator
        default: 3
        constraints: ">= 1, <= 20"
      - name: calibration_status
        type: enum
        source: system
        description: calibration standing driven by calibration_variance side effects
        default: CALIBRATED
        constraints: "calibration_status IN {CALIBRATED, PROBATION, SUSPENDED}"
      - name: last_deviation_pct
        type: number
        source: computed
        description: deviation_pct of this evaluator's most recent CalibrationSubmission (by created_at DESC); null before the first submission
        default: null
      - name: open_assignment_count
        type: integer
        source: computed
        description: count of SampleSelection rows with assigned_evaluator_id == this id and status == ASSIGNED
        default: 0

  - name: Interaction
    parent: null
    common_fields: true
    fields:
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; the agent who handled the contact"
      - name: channel
        type: enum
        source: input
        description: contact channel, drives the analytics channel multiplier
        constraints: "channel IN {VOICE, CHAT, EMAIL}"
      - name: started_at
        type: datetime
        source: input
        description: ISO 8601 UTC contact start
      - name: ended_at
        type: datetime
        source: input
        description: ISO 8601 UTC contact end; must be > started_at
      - name: duration_seconds
        type: integer
        source: computed
        description: floor((ended_at - started_at) in seconds); weight of this interaction in PERIOD_DURATION_WEIGHTED
      - name: required_disclosures
        type: array
        source: input
        description: disclosure codes the channel/jurisdiction requires on this contact
        default: []
        constraints: "each element IN {RECORDING, MINI_MIRANDA, RATE_CHANGE, THIRD_PARTY}"
      - name: captured_disclosures
        type: array
        source: system
        description: disclosure codes the ComplianceAuditor confirmed during consent review
        default: []
        constraints: "each element IN {RECORDING, MINI_MIRANDA, RATE_CHANGE, THIRD_PARTY}"
      - name: recording_consent_status
        type: enum
        source: system
        description: recording-consent posture; gates assignment and evaluation
        default: PENDING
        constraints: "recording_consent_status IN {PENDING, VERIFIED, DENIED, NOT_REQUIRED}"
      - name: customer_flagged
        type: boolean
        source: input
        description: customer asked for this contact to be reviewed
        default: false
      - name: csat_score
        type: integer
        source: input
        description: post-contact satisfaction rating; null when the customer did not respond
        default: null
        constraints: "null or 1..5"
      - name: repeat_contact_within_72h
        type: boolean
        source: input
        description: the same customer contacted again within 72 hours of this contact
        default: false
      - name: compliance_hold
        type: boolean
        source: system
        description: set true when an Evaluation of this interaction lands compliance_result FAIL; cleared when that failure is overturned
        default: false
      - name: sampled_count
        type: integer
        source: computed
        description: count of SampleSelection rows referencing this interaction with status IN {SELECTED, ASSIGNED, EVALUATED}
        default: 0

  - name: AnalyticsScan
    parent: Interaction
    common_fields: true
    fields:
      - name: interaction_id
        type: string
        source: input
        description: "FK -> Interaction.id; the screened contact"
      - name: silence_pct
        type: number
        source: input
        description: percentage of the contact classified as dead air by the speech engine
        constraints: "0.00 .. 100.00, 2 decimals"
      - name: sentiment_delta
        type: number
        source: input
        description: end-minus-start customer sentiment; negative values raise risk
        constraints: "-1.00 .. 1.00, 2 decimals"
      - name: flagged_categories
        type: array
        source: input
        description: phrase-spotting categories detected by speech/text analytics
        default: []
        constraints: "each element IN {PROFANITY, NO_DISCLOSURE, ESCALATION_REQUEST, CONSENT_OBJECTION}; no duplicates"
      - name: risk_score
        type: number
        source: computed
        description: analytics_priority_score output, 0.00 .. 100.00
      - name: priority_tier
        type: enum
        source: computed
        description: manual-review priority band derived from risk_score
        constraints: "priority_tier IN {P1, P2, P3}"
      - name: status
        type: enum
        source: system
        description: only one scan per interaction is CURRENT; a newer scan supersedes the prior one
        default: CURRENT
        constraints: "status IN {CURRENT, SUPERSEDED}"

  - name: SamplePlan
    parent: null
    common_fields: true
    fields:
      - name: form_id
        type: string
        source: input
        description: "FK -> EvaluationForm.id; the scorecard every evaluation in this plan must use"
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the monitoring period
      - name: period_end
        type: datetime
        source: input
        description: inclusive end of the monitoring period; must be > period_start
      - name: per_agent_target_volume
        type: integer
        source: input
        description: number of interactions to review per agent inside this period
        constraints: ">= 1, <= 50"
      - name: source_mix
        type: object
        source: input
        description: "percentage split of the per-agent volume across sources: { random_pct, targeted_pct, customer_flagged_pct }; the three integers must sum to exactly 100"
      - name: status
        type: enum
        source: system
        description: plan lifecycle
        default: DRAFT
        constraints: "status IN {DRAFT, OPEN, CLOSED}"
      - name: pinned_form_guidance_version
        type: integer
        source: system
        description: EvaluationForm.guidance_version captured at DRAFT -> OPEN; null while DRAFT
        default: null
      - name: selections_count
        type: integer
        source: computed
        description: count of SampleSelection rows of this plan with status IN {SELECTED, ASSIGNED, EVALUATED}
        default: 0
      - name: excluded_count
        type: integer
        source: computed
        description: count of SampleSelection rows of this plan with status == EXCLUDED
        default: 0
      - name: targeted_reserved_count
        type: integer
        source: computed
        description: total targeted follow-up slots reserved by compliance cascades on this plan (sum of targeted_reserve_by_agent values)
        default: 0
      - name: targeted_reserve_by_agent
        type: object
        source: computed
        description: "map agent_id -> integer count of extra TARGETED slots granted to that agent by the compliance cascade; raises that agent's effective TARGETED cap"
        default: {}
      - name: agent_volume_attainment
        type: object
        source: computed
        description: "map agent_id -> { consumed: integer, remaining: integer, by_source: { RANDOM: integer, TARGETED: integer, CUSTOMER_FLAGGED: integer } } computed by sample_quota_attainment (see 1.3)"
        default: {}

  - name: SampleSelection
    parent: SamplePlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> SamplePlan.id; the plan that consumed a slot for this selection"
      - name: interaction_id
        type: string
        source: input
        description: "FK -> Interaction.id; the sampled contact"
      - name: agent_id
        type: string
        source: system
        description: "FK -> Agent.id; denormalized from Interaction.agent_id at creation and never updated afterwards"
      - name: assigned_evaluator_id
        type: string
        source: system
        description: "FK -> Evaluator.id; set by the assign action, cleared when the selection is released back to SELECTED"
        default: null
      - name: source
        type: enum
        source: input
        description: sampling source this selection is charged against
        constraints: "source IN {RANDOM, TARGETED, CUSTOMER_FLAGGED}"
      - name: status
        type: enum
        source: system
        description: selection lifecycle
        default: SELECTED
        constraints: "status IN {SELECTED, ASSIGNED, EVALUATED, EXCLUDED}"
      - name: review_window_start
        type: datetime
        source: system
        description: inclusive start of the evaluator's reserved review window; set by assign, cleared on release
        default: null
      - name: review_window_end
        type: datetime
        source: system
        description: exclusive end of the evaluator's reserved review window; set by assign, cleared on release
        default: null
      - name: exclusion_reason
        type: enum
        source: system
        description: why the selection left the sampling pool; null unless status == EXCLUDED
        default: null
        constraints: "exclusion_reason IN {CONSENT_DENIED, DUPLICATE_INTERACTION, EVALUATOR_UNAVAILABLE, PLAN_CLOSED_SWEEP}"

  - name: Evaluation
    parent: SampleSelection
    common_fields: true
    fields:
      - name: selection_id
        type: string
        source: input
        description: "FK -> SampleSelection.id; the assigned selection being scored"
      - name: evaluator_id
        type: string
        source: system
        description: "FK -> Evaluator.id; copied from the selection's assigned_evaluator_id at creation"
      - name: form_id
        type: string
        source: system
        description: "FK -> EvaluationForm.id; copied from the selection's plan.form_id at creation"
      - name: agent_id
        type: string
        source: system
        description: "FK -> Agent.id; copied from the selection's agent_id at creation"
      - name: pinned_guidance_version
        type: integer
        source: system
        description: EvaluationForm.guidance_version captured at evaluation creation; submit requires it to still equal the form's current guidance_version
      - name: item_scores
        type: object
        source: input
        description: "object keyed by behavior code -- { \"<BEHAVIOR_CODE>\": integer 0..max_points, or the literal string \"NA\" when the behaviour allows_not_applicable }; supplied at submit"
        default: {}
      - name: weighted_score
        type: number
        source: computed
        description: RENORMALIZED variant of evaluation_weighted_score (see 1.3), 2 decimals; null before submit
        default: null
      - name: raw_weighted_score
        type: number
        source: computed
        description: FIXED_DENOMINATOR variant of evaluation_weighted_score (see 1.3), 2 decimals; null before submit
        default: null
      - name: adjusted_weighted_score
        type: number
        source: computed
        description: RENORMALIZED score recomputed from the dispute's adjusted_item_scores; null until a dispute is UPHELD
        default: null
      - name: auto_fail_triggered
        type: boolean
        source: computed
        description: true when any behavior with auto_fail_on_violation scored exactly 0 points
        default: false
      - name: compliance_result
        type: enum
        source: computed
        description: compliance outcome of the scored interaction
        default: NOT_EVALUATED
        constraints: "compliance_result IN {NOT_EVALUATED, PASS, FAIL}"
      - name: review_status
        type: enum
        source: system
        description: scoring dimension of the parallel state machine
        default: DRAFT
        constraints: "review_status IN {DRAFT, SUBMITTED, FINALIZED, REOPENED}"
      - name: feedback_status
        type: enum
        source: system
        description: agent-facing dimension of the parallel state machine, evolves independently of review_status
        default: PENDING
        constraints: "feedback_status IN {PENDING, DELIVERED, ACKNOWLEDGED, DISPUTED}"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent submit; ordering key for consecutive_passing_evaluations and ROLLING_4
        default: null
      - name: feedback_delivered_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent deliver; start of the dispute window
        default: null
      - name: agreement
        type: enum
        source: input
        description: agent's stance captured at acknowledge
        default: null
        constraints: "null or agreement IN {AGREE, DISAGREE}"

  - name: CalibrationSession
    parent: null
    common_fields: true
    fields:
      - name: form_id
        type: string
        source: input
        description: "FK -> EvaluationForm.id; the scorecard being calibrated; must be ACTIVE at creation"
      - name: interaction_id
        type: string
        source: input
        description: "FK -> Interaction.id; the shared contact every participant scores"
      - name: scheduled_start
        type: datetime
        source: input
        description: inclusive start of the calibration meeting window
      - name: scheduled_end
        type: datetime
        source: input
        description: inclusive end of the calibration meeting window; must be > scheduled_start
      - name: benchmark_item_scores
        type: object
        source: input
        description: "calibration lead's master scores, same shape as Evaluation.item_scores"
      - name: benchmark_weighted_score
        type: number
        source: computed
        description: RENORMALIZED evaluation_weighted_score of benchmark_item_scores against form_id, computed at creation
      - name: status
        type: enum
        source: system
        description: session lifecycle; close branches on participant count and variance
        default: OPEN
        constraints: "status IN {OPEN, SCORING, CLOSED_ALIGNED, CLOSED_VARIANT, VOID}"
      - name: participant_count
        type: integer
        source: computed
        description: count of CalibrationSubmission rows of this session
        default: 0
      - name: variance_pct
        type: number
        source: computed
        description: max over submissions of abs(deviation_pct), 2 decimals; null before close
        default: null
      - name: mean_abs_deviation
        type: number
        source: computed
        description: mean over submissions of abs(deviation_pct), 2 decimals; null before close
        default: null
      - name: guidance_updates_applied
        type: integer
        source: computed
        description: number of FormBehavior rows whose guidance_text was rewritten by this session's close
        default: 0

  - name: CalibrationSubmission
    parent: CalibrationSession
    common_fields: false
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> CalibrationSession.id; the session being scored"
      - name: evaluator_id
        type: string
        source: system
        description: "FK -> Evaluator.id; taken from the submitting evaluator's X-User-ID"
      - name: item_scores
        type: object
        source: input
        description: "this evaluator's scores, same shape as Evaluation.item_scores"
      - name: weighted_score
        type: number
        source: computed
        description: RENORMALIZED evaluation_weighted_score of item_scores against the session's form
      - name: deviation_pct
        type: number
        source: computed
        description: round(weighted_score - session.benchmark_weighted_score, 2); signed
      - name: alignment
        type: enum
        source: computed
        description: alignment band derived from abs(deviation_pct)
        constraints: "alignment IN {ALIGNED, MINOR_VARIANCE, MAJOR_VARIANCE}"

  - name: Dispute
    parent: Evaluation
    common_fields: true
    fields:
      - name: evaluation_id
        type: string
        source: input
        description: "FK -> Evaluation.id; the scored evaluation being contested"
      - name: agent_id
        type: string
        source: system
        description: "FK -> Agent.id; copied from the evaluation at creation; must equal the filing agent's X-User-ID"
      - name: reviewer_evaluator_id
        type: string
        source: system
        description: "FK -> Evaluator.id; set at review from X-User-ID; must differ from the evaluation's evaluator_id"
        default: null
      - name: disputed_behavior_codes
        type: array
        source: input
        description: FormBehavior codes the agent contests; each must exist on the evaluation's form
        constraints: "non-empty; no duplicates"
      - name: rationale
        type: string
        source: input
        description: agent's written justification
        constraints: "10..1000 chars"
      - name: adjusted_item_scores
        type: object
        source: input
        description: "replacement scores supplied at resolve when outcome == UPHELD; same shape as Evaluation.item_scores"
        default: null
      - name: outcome_note
        type: string
        source: input
        description: reviewer's written decision note, captured at resolve
        default: null
      - name: status
        type: enum
        source: system
        description: dispute lifecycle; cycles through NEEDS_MORE_INFO back to SUBMITTED
        default: SUBMITTED
        constraints: "status IN {SUBMITTED, UNDER_REVIEW, NEEDS_MORE_INFO, UPHELD, REJECTED}"
      - name: round_count
        type: integer
        source: system
        description: number of review rounds opened on this dispute; incremented on each SUBMITTED -> UNDER_REVIEW
        default: 0

  - name: CoachingPlan
    parent: Agent
    common_fields: true
    fields:
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; the coached agent"
      - name: source_evaluation_id
        type: string
        source: input
        description: "FK -> Evaluation.id; the evaluation that justified the plan; must belong to agent_id"
      - name: assigned_supervisor_id
        type: string
        source: input
        description: opaque operator id of the supervising Supervisor; never compared to any entity id
      - name: target_score
        type: number
        source: input
        description: quality index the agent must reach, 2 decimals
        constraints: "> 0.00, <= 100.00"
      - name: deficit_pct
        type: number
        source: computed
        description: round(target_score - agent.quality_index_rolling, 2) captured at creation
      - name: escalation_tier
        type: enum
        source: computed
        description: coaching tier after the compliance bump described in coaching_requirement (see 1.3)
        constraints: "escalation_tier IN {T1, T2, T3}"
      - name: required_session_count
        type: integer
        source: computed
        description: coaching sessions required, computed from the tier selected on the raw deficit
        constraints: "1..8"
      - name: completed_session_count
        type: integer
        source: computed
        description: count of logged coaching sessions on this plan
        default: 0
      - name: due_at
        type: datetime
        source: computed
        description: creation clock instant plus the tier's due_days
      - name: status
        type: enum
        source: system
        description: plan lifecycle
        default: ASSIGNED
        constraints: "status IN {ASSIGNED, IN_PROGRESS, COMPLETED, ESCALATED, VOIDED}"
      - name: escalation_note
        type: string
        source: input
        description: reason recorded when a plan is escalated to performance improvement
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: EvaluationForm
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /evaluation-forms/{id}/activate"
        actor: QualityManager
        preconditions:
          - "form.status == DRAFT (else ERR_FORM_NOT_DRAFT)"
          - "form.behavior_weight_total == 100.00 exactly (else ERR_WEIGHTS_NOT_100)"
          - "form.compliance_behavior_count >= 1 (else ERR_NO_COMPLIANCE_BEHAVIOR)"
          - "form.min_compliance_item_score <= min(max_points) over compliance_critical behaviors (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status := ACTIVE"
          - "activated_at := logical clock now"
          - "increments EvaluationForm.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /evaluation-forms/{id}/retire"
        actor: QualityManager
        preconditions:
          - "form.status == ACTIVE (else ERR_FORM_NOT_ACTIVE)"
        side_effects:
          - "status := RETIRED"
          - "retired_at := logical clock now"
          - "increments EvaluationForm.version by 1"
        note: "Retiring does NOT touch SamplePlan rows already OPEN on this form; those plans keep running against the pinned guidance version. A RETIRED form can no longer back a new plan (ERR_FORM_NOT_ACTIVE on plan open) nor a new CalibrationSession."

  - entity: Interaction
    initial_state: PENDING
    terminal_states: [DENIED]
    note: "State field is recording_consent_status. VERIFIED and NOT_REQUIRED are non-terminal only in the sense that a later consent review may still flip them to DENIED."
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /interactions/{id}/consent-review with consent_outcome VERIFIED"
        actor: ComplianceAuditor
        preconditions:
          - "interaction.recording_consent_status IN {PENDING, NOT_REQUIRED, VERIFIED}"
          - "captured_disclosures is a superset of interaction.required_disclosures (else ERR_INVALID_REQUEST)"
        side_effects:
          - "recording_consent_status := VERIFIED"
          - "captured_disclosures := payload captured_disclosures"
          - "increments Interaction.version by 1"
      - from: PENDING
        to: NOT_REQUIRED
        trigger: "POST /interactions/{id}/consent-review with consent_outcome NOT_REQUIRED"
        actor: ComplianceAuditor
        preconditions:
          - "interaction.recording_consent_status IN {PENDING, NOT_REQUIRED, VERIFIED}"
          - "interaction.channel IN {CHAT, EMAIL} (VOICE always requires consent, else ERR_INVALID_REQUEST)"
        side_effects:
          - "recording_consent_status := NOT_REQUIRED"
          - "captured_disclosures := payload captured_disclosures"
          - "increments Interaction.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /interactions/{id}/consent-review with consent_outcome DENIED"
        actor: ComplianceAuditor
        preconditions:
          - "interaction.recording_consent_status != DENIED (else ERR_CONSENT_ALREADY_DENIED)"
        side_effects:
          - "recording_consent_status := DENIED"
          - "increments Interaction.version by 1"
          - "CASCADE hop 1: every SampleSelection of this interaction with status IN {SELECTED, ASSIGNED} := EXCLUDED with exclusion_reason CONSENT_DENIED"
          - "CASCADE hop 2: because those selections left the pool, their plan's sample_quota_attainment is recomputed (consumed drops, remaining rises) and Interaction.sampled_count is recomputed"
          - "CASCADE hop 3: because an EXCLUDED selection releases its evaluator, each affected selection's assigned_evaluator_id := null, review_window_start/end := null, and that Evaluator.open_assignment_count is recomputed"
        note: "Selections whose status is already EVALUATED are left untouched (conditional cascade)."

  - entity: AnalyticsScan
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system, inside POST /analytics-scans when a newer scan is created for the same interaction_id"
        actor: system
        preconditions:
          - "the prior scan of this interaction_id has status == CURRENT"
        side_effects:
          - "prior scan status := SUPERSEDED"
          - "increments the prior AnalyticsScan.version by 1"
        note: "At most one CURRENT scan per interaction. The create path is OCC-guarded on Interaction.version (see 1.2.1 analytics-scan-create-stale-interaction)."

  - entity: SamplePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /sample-plans/{id}/open"
        actor: QualityManager
        preconditions:
          - "plan.status == DRAFT (else ERR_PLAN_NOT_DRAFT)"
          - "plan.form.status == ACTIVE (else ERR_FORM_NOT_ACTIVE) -- cross-entity guard"
          - "no other SamplePlan with the same form_id and status IN {DRAFT, OPEN} has a period colliding with this plan under CLOSED-interval semantics (else ERR_PLAN_PERIOD_OVERLAP)"
        side_effects:
          - "status := OPEN"
          - "pinned_form_guidance_version := form.guidance_version at this instant"
          - "increments SamplePlan.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /sample-plans/{id}/close"
        actor: QualityManager
        preconditions:
          - "plan.status == OPEN (else ERR_PLAN_NOT_OPEN)"
        side_effects:
          - "status := CLOSED"
          - "CASCADE hop 1: every SampleSelection of this plan with status IN {SELECTED, ASSIGNED}, processed in created_at ASC order, := EXCLUDED with exclusion_reason PLAN_CLOSED_SWEEP"
          - "CASCADE hop 2: because each swept selection left the pool, its assigned_evaluator_id := null, review_window_start/end := null and that Evaluator.open_assignment_count is recomputed, freeing the window for later assignments"
          - "CASCADE hop 3: because the swept selections no longer consume slots, agent_volume_attainment, selections_count and excluded_count are recomputed on this plan and Interaction.sampled_count is recomputed for each swept interaction"
          - "increments SamplePlan.version by 1"
        note: "Selections already EVALUATED keep their status; the sweep is a conditional cascade over non-terminal children only."

  - entity: SampleSelection
    initial_state: SELECTED
    terminal_states: [EVALUATED, EXCLUDED]
    transitions:
      - from: SELECTED
        to: ASSIGNED
        trigger: "POST /sample-selections/{id}/assign"
        actor: QualityManager
        preconditions:
          - "selection.status == SELECTED (else ERR_SELECTION_NOT_ASSIGNABLE)"
          - "selection.plan.status == OPEN (else ERR_PLAN_NOT_OPEN)"
          - "selection.interaction.recording_consent_status IN {VERIFIED, NOT_REQUIRED} (else ERR_CONSENT_NOT_VERIFIED) -- cross-entity guard"
          - "evaluator.calibration_status != SUSPENDED (else ERR_EVALUATOR_NOT_CALIBRATED) -- cross-entity guard"
          - "review_window_end > review_window_start (else ERR_INVALID_TIME_RANGE)"
          - "the half-open window [review_window_start, review_window_end) does not intersect the window of any other SampleSelection with the same assigned_evaluator_id and status == ASSIGNED (else ERR_EVALUATOR_WINDOW_CONFLICT)"
          - "evaluator.open_assignment_count < evaluator.max_open_assignments (else ERR_EVALUATOR_CAPACITY_EXCEEDED)"
        side_effects:
          - "status := ASSIGNED, assigned_evaluator_id := payload assigned_evaluator_id, review_window_start/end := payload values"
          - "Evaluator.open_assignment_count recomputed (+1)"
          - "increments SampleSelection.version by 1"
      - from: ASSIGNED
        to: SELECTED
        trigger: "system, inside POST /calibration-sessions/{id}/close when the assigned evaluator becomes SUSPENDED"
        actor: system
        preconditions:
          - "selection.status == ASSIGNED"
          - "no Evaluation row exists with selection_id == this selection"
        side_effects:
          - "status := SELECTED, assigned_evaluator_id := null, review_window_start/end := null"
          - "Evaluator.open_assignment_count recomputed (-1)"
          - "increments SampleSelection.version by 1"
        note: "Conditional cascade: a selection that already has an Evaluation row (even DRAFT) is left ASSIGNED so the in-flight evaluation is not orphaned."
      - from: ASSIGNED
        to: EVALUATED
        trigger: "POST /evaluations/{id}/submit"
        actor: QualityEvaluator
        preconditions:
          - "the submitting evaluation's selection.status == ASSIGNED"
        side_effects:
          - "status := EVALUATED"
          - "Evaluator.open_assignment_count recomputed (-1)"
          - "increments SampleSelection.version by 1"
      - from: SELECTED
        to: EXCLUDED
        trigger: "POST /sample-selections/{id}/exclude"
        actor: QualityManager
        preconditions:
          - "selection.status IN {SELECTED, ASSIGNED} (else ERR_SELECTION_TERMINAL)"
          - "selection.plan.status == OPEN (else ERR_PLAN_NOT_OPEN)"
        side_effects:
          - "status := EXCLUDED, exclusion_reason := payload exclusion_reason, assigned_evaluator_id := null, review_window_start/end := null"
          - "plan.agent_volume_attainment, plan.selections_count, plan.excluded_count and interaction.sampled_count recomputed -- the slot is returned to the agent's remaining volume"
          - "Evaluator.open_assignment_count recomputed when the selection had been ASSIGNED"
          - "increments SampleSelection.version by 1"
      - from: ASSIGNED
        to: EXCLUDED
        trigger: "POST /sample-selections/{id}/exclude"
        actor: QualityManager
        preconditions:
          - "selection.status IN {SELECTED, ASSIGNED} (else ERR_SELECTION_TERMINAL)"
          - "selection.plan.status == OPEN (else ERR_PLAN_NOT_OPEN)"
        side_effects:
          - "identical to the SELECTED -> EXCLUDED side effects, plus the released review window becomes available to other assignments of that evaluator"

  - entity: Evaluation
    initial_state: "review_status DRAFT x feedback_status PENDING"
    terminal_states: []
    note: |
      PARALLEL state machine. The two dimensions below live on the same row and
      advance independently: review_status is driven by the evaluator's scoring
      actions, feedback_status by the agent-facing delivery/acknowledgement/dispute
      actions. A row may legitimately sit at (FINALIZED, DISPUTED) or at
      (REOPENED, PENDING). Neither dimension has a terminal state, because a
      dispute can reopen a FINALIZED row and a reopened row must be re-delivered.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        dimension: review_status
        trigger: "POST /evaluations/{id}/submit"
        actor: QualityEvaluator
        preconditions:
          - "evaluation.review_status IN {DRAFT, REOPENED} (else ERR_EVALUATION_NOT_EDITABLE)"
          - "X-User-ID == evaluation.evaluator_id (else ERR_NOT_RESOURCE_OWNER)"
          - "evaluator.calibration_status != SUSPENDED (else ERR_EVALUATOR_NOT_CALIBRATED) -- cross-entity guard on Evaluator"
          - "evaluation.selection.status == ASSIGNED when review_status == DRAFT; == EVALUATED when review_status == REOPENED"
          - "evaluation.selection.interaction.recording_consent_status IN {VERIFIED, NOT_REQUIRED} (else ERR_CONSENT_NOT_VERIFIED) -- cross-entity guard on Interaction"
          - "evaluation.pinned_guidance_version == evaluation.form.guidance_version (else ERR_GUIDANCE_VERSION_STALE)"
          - "evaluation.form_id == evaluation.selection.plan.form_id (else ERR_FORM_VERSION_MISMATCH)"
          - "item_scores covers every FormBehavior code of the form exactly once, with no omitted and no repeated code (else ERR_ITEM_SCORE_INCOMPLETE); a key that is not a behavior code of the pinned form is ERR_FORM_VERSION_MISMATCH (priority 29 beats 35)"
          - "every item points integer in 0..behavior.max_points (else ERR_ITEM_SCORE_OUT_OF_RANGE)"
          - "not_applicable true only where behavior.allows_not_applicable (else ERR_NA_NOT_ALLOWED)"
        side_effects:
          - "ordered step 1: item_scores := payload; weighted_score, raw_weighted_score, auto_fail_triggered and compliance_result := evaluation_weighted_score outputs (1.3)"
          - "ordered step 2: review_status := SUBMITTED; submitted_at := logical clock now; feedback_status untouched (stays PENDING)"
          - "ordered step 3: selection.status := EVALUATED and Evaluator.open_assignment_count recomputed"
          - "ordered step 4: Agent.quality_index_rolling and Agent.quality_index_period recomputed by agent_quality_index (1.3); Agent.consecutive_passing_evaluations recomputed"
          - "ordered step 5 -- CASCADE hop 1: when compliance_result == FAIL, interaction.compliance_hold := true"
          - "ordered step 6 -- CASCADE hop 2: because interaction.compliance_hold flipped false -> true, Agent.open_compliance_findings is recomputed (+1) and Agent.coaching_state := REQUIRED when it was NONE or CLEARED"
          - "ordered step 7 -- CASCADE hop 3: because Agent.coaching_state flipped to REQUIRED, the reservation-target plan (see note) reserves one extra TARGETED slot for that agent: targeted_reserve_by_agent[agent_id] += 1, targeted_reserved_count and agent_volume_attainment recomputed"
          - "increments Evaluation.version, SampleSelection.version, Agent.version, Interaction.version and (when hop 3 fires) SamplePlan.version by 1 each"
        note: |
          Reservation-target plan selector for hop 3: the candidate set is every
          SamplePlan with status == OPEN whose CLOSED interval [period_start,
          period_end] contains the logical clock instant. Ranking: period_start ASC;
          tie-break created_at ASC. Fallback: when the candidate set is empty, hop 3
          is a no-op and no error is raised. Hops 1..3 are strictly chained -- hop 2
          fires only because hop 1 flipped compliance_hold, hop 3 only because hop 2
          flipped coaching_state.
      - from: REOPENED
        to: SUBMITTED
        dimension: review_status
        trigger: "POST /evaluations/{id}/submit (re-score after an upheld dispute)"
        actor: QualityEvaluator
        preconditions:
          - "same list as DRAFT -> SUBMITTED, with selection.status == EVALUATED"
        side_effects:
          - "same ordered steps as DRAFT -> SUBMITTED, except step 3 is a no-op (the selection is already EVALUATED) and adjusted_weighted_score := null (the re-score replaces the dispute adjustment)"
      - from: SUBMITTED
        to: FINALIZED
        dimension: review_status
        trigger: "POST /evaluations/{id}/acknowledge, or POST /disputes/{id}/resolve with outcome REJECTED"
        actor: "Agent | QualityEvaluator"
        preconditions:
          - "evaluation.review_status == SUBMITTED"
          - "for acknowledge: evaluation.feedback_status == DELIVERED (else ERR_FEEDBACK_NOT_DELIVERED)"
        side_effects:
          - "review_status := FINALIZED"
          - "increments Evaluation.version by 1"
      - from: SUBMITTED
        to: REOPENED
        dimension: review_status
        trigger: "POST /disputes/{id}/resolve with outcome UPHELD"
        actor: QualityEvaluator
        preconditions:
          - "evaluation.review_status IN {SUBMITTED, FINALIZED}"
        side_effects:
          - "see the Dispute UNDER_REVIEW -> UPHELD transition for the full four-hop cascade"
      - from: FINALIZED
        to: REOPENED
        dimension: review_status
        trigger: "POST /disputes/{id}/resolve with outcome UPHELD"
        actor: QualityEvaluator
        preconditions:
          - "evaluation.review_status IN {SUBMITTED, FINALIZED}"
        side_effects:
          - "identical to SUBMITTED -> REOPENED; a FINALIZED row is NOT locked against dispute outcomes"
      - from: PENDING
        to: DELIVERED
        dimension: feedback_status
        trigger: "POST /evaluations/{id}/deliver"
        actor: "QualityEvaluator | Supervisor"
        preconditions:
          - "evaluation.review_status IN {SUBMITTED, FINALIZED} (else ERR_EVALUATION_NOT_DELIVERABLE)"
          - "evaluation.feedback_status == PENDING (else ERR_FEEDBACK_ALREADY_DELIVERED)"
        side_effects:
          - "feedback_status := DELIVERED; feedback_delivered_at := logical clock now (this instant starts the DISPUTE_WINDOW_DAYS window)"
          - "increments Evaluation.version by 1"
      - from: DELIVERED
        to: ACKNOWLEDGED
        dimension: feedback_status
        trigger: "POST /evaluations/{id}/acknowledge"
        actor: Agent
        preconditions:
          - "evaluation.feedback_status == DELIVERED (else ERR_FEEDBACK_NOT_DELIVERED)"
          - "X-User-ID == evaluation.agent_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "feedback_status := ACKNOWLEDGED; agreement := payload agreement"
          - "review_status := FINALIZED when it was SUBMITTED (the two dimensions are coupled only here)"
          - "increments Evaluation.version by 1"
      - from: DELIVERED
        to: DISPUTED
        dimension: feedback_status
        trigger: "POST /disputes"
        actor: Agent
        preconditions:
          - "evaluation.feedback_status IN {DELIVERED, ACKNOWLEDGED} (else ERR_FEEDBACK_NOT_DELIVERED); an ACKNOWLEDGED row files from that dimension state too and lands in the same DISPUTED state"
          - "a filing attempt while feedback_status is already DISPUTED is NOT rejected here: validation priority 18 lets DISPUTED through and priority 41 answers with ERR_DISPUTE_ALREADY_OPEN"
        side_effects:
          - "feedback_status := DISPUTED"
          - "increments Evaluation.version by 1"
      - from: DISPUTED
        to: PENDING
        dimension: feedback_status
        trigger: "POST /disputes/{id}/resolve with outcome UPHELD"
        actor: QualityEvaluator
        preconditions:
          - "evaluation.feedback_status == DISPUTED"
        side_effects:
          - "feedback_status := PENDING and feedback_delivered_at := null -- the adjusted score must be delivered again before it can be acknowledged or disputed"
      - from: DISPUTED
        to: DELIVERED
        dimension: feedback_status
        trigger: "POST /disputes/{id}/resolve with outcome REJECTED"
        actor: QualityEvaluator
        preconditions:
          - "evaluation.feedback_status == DISPUTED"
        side_effects:
          - "feedback_status := DELIVERED and feedback_delivered_at is left at its original value -- COMPENSATION: rejecting the dispute restores exactly the pre-dispute feedback state, so the agent's remaining dispute window is unchanged"

  - entity: CalibrationSession
    initial_state: OPEN
    terminal_states: [CLOSED_ALIGNED, CLOSED_VARIANT, VOID]
    note: "BRANCHING fork-join: the single close trigger forks into three terminal states with different side-effect sets."
    transitions:
      - from: OPEN
        to: SCORING
        trigger: "POST /calibration-sessions/{id}/start-scoring"
        actor: QualityManager
        preconditions:
          - "session.status == OPEN (else ERR_SESSION_NOT_OPEN)"
          - "session.form.status == ACTIVE (else ERR_FORM_NOT_ACTIVE) -- cross-entity guard"
        side_effects:
          - "status := SCORING (submissions are only accepted in SCORING)"
          - "increments CalibrationSession.version by 1"
      - from: SCORING
        to: CLOSED_ALIGNED
        trigger: "POST /calibration-sessions/{id}/close"
        actor: QualityManager
        preconditions:
          - "session.status == SCORING (else ERR_SESSION_NOT_SCORING)"
          - "participant_count >= 2"
          - "variance_pct <= VARIANCE_ALIGNED_MAX (7.00)"
        side_effects:
          - "ordered step 1: for every CalibrationSubmission of the session, deviation_pct and alignment := calibration_variance outputs (1.3); Evaluator.last_deviation_pct refreshed"
          - "ordered step 2: variance_pct := max abs deviation; mean_abs_deviation := mean abs deviation; status := CLOSED_ALIGNED"
          - "ordered step 3: every participating Evaluator whose alignment == ALIGNED and whose calibration_status == PROBATION := CALIBRATED -- COMPENSATION restoring standing"
          - "ordered step 4: for each entry of the close payload's guidance_updates, that FormBehavior.guidance_text := new text and its guidance_version += 1; guidance_updates_applied := number of entries; when the list is non-empty the form's guidance_version += 1 exactly once"
          - "increments CalibrationSession.version by 1"
      - from: SCORING
        to: CLOSED_VARIANT
        trigger: "POST /calibration-sessions/{id}/close"
        actor: QualityManager
        preconditions:
          - "session.status == SCORING (else ERR_SESSION_NOT_SCORING)"
          - "participant_count >= 2"
          - "variance_pct > VARIANCE_ALIGNED_MAX (7.00)"
        side_effects:
          - "ordered steps 1, 2 and 4 identical to CLOSED_ALIGNED, with status := CLOSED_VARIANT"
          - "ordered step 3a: every Evaluator with alignment == MAJOR_VARIANCE and abs(deviation_pct) > VARIANCE_SEVERE_MAX (15.00) := SUSPENDED"
          - "ordered step 3b: every other Evaluator with alignment == MAJOR_VARIANCE := PROBATION when it was CALIBRATED, or SUSPENDED when it was already PROBATION"
          - "ordered step 3c -- CASCADE hop 1: because those Evaluators became SUSPENDED, each of their SampleSelection rows with status == ASSIGNED and no Evaluation row := SELECTED with assigned_evaluator_id and review windows cleared"
          - "ordered step 3d -- CASCADE hop 2: because those selections were released, each affected Evaluator.open_assignment_count is recomputed and the freed review windows stop blocking ERR_EVALUATOR_WINDOW_CONFLICT"
          - "increments CalibrationSession.version by 1 and the version of every mutated Evaluator / SampleSelection / FormBehavior / EvaluationForm row by 1"
      - from: SCORING
        to: VOID
        trigger: "POST /calibration-sessions/{id}/close"
        actor: QualityManager
        preconditions:
          - "session.status == SCORING (else ERR_SESSION_NOT_SCORING)"
          - "participant_count < 2 -- fewer than two evaluators scored the shared interaction"
        side_effects:
          - "status := VOID; variance_pct := null; mean_abs_deviation := null; guidance_updates_applied := 0"
          - "no Evaluator.calibration_status is changed, no guidance_text is rewritten and no form guidance_version is bumped even when the payload carried guidance_updates -- a void session may not move the scoring standard"
          - "no CalibrationSubmission of the session is scored either: deviation_pct and alignment stay null and Evaluator.last_deviation_pct is left untouched -- a single-participant session yields no comparable deviation"
          - "increments CalibrationSession.version by 1"

  - entity: Dispute
    initial_state: SUBMITTED
    terminal_states: [UPHELD, REJECTED]
    note: "CYCLIC: SUBMITTED -> UNDER_REVIEW -> NEEDS_MORE_INFO -> SUBMITTED may repeat until round_count reaches MAX_DISPUTE_ROUNDS."
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/review"
        actor: QualityEvaluator
        preconditions:
          - "dispute.status == SUBMITTED (else ERR_DISPUTE_NOT_REVIEWABLE)"
          - "X-User-ID != dispute.evaluation.evaluator_id (else ERR_SEGREGATION_OF_DUTIES) -- the evaluator who produced the score may never review its dispute"
          - "the reviewing Evaluator.calibration_status != SUSPENDED (else ERR_EVALUATOR_NOT_CALIBRATED)"
          - "dispute.round_count < MAX_DISPUTE_ROUNDS (2) (else ERR_DISPUTE_ROUND_LIMIT)"
        side_effects:
          - "status := UNDER_REVIEW; reviewer_evaluator_id := X-User-ID; round_count += 1"
          - "increments Dispute.version by 1"
      - from: UNDER_REVIEW
        to: NEEDS_MORE_INFO
        trigger: "POST /disputes/{id}/resolve with outcome NEEDS_MORE_INFO"
        actor: QualityEvaluator
        preconditions:
          - "dispute.status == UNDER_REVIEW (else ERR_DISPUTE_NOT_RESOLVABLE)"
          - "X-User-ID == dispute.reviewer_evaluator_id (else ERR_NOT_RESOURCE_OWNER)"
          - "adjusted_item_scores is absent (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status := NEEDS_MORE_INFO; outcome_note := payload outcome_note; reviewer_evaluator_id is retained"
          - "evaluation.feedback_status stays DISPUTED -- the loop does not return feedback to the agent"
          - "increments Dispute.version by 1"
      - from: NEEDS_MORE_INFO
        to: SUBMITTED
        trigger: "POST /disputes/{id}/respond"
        actor: Agent
        preconditions:
          - "dispute.status == NEEDS_MORE_INFO (else ERR_DISPUTE_NOT_RESPONDABLE)"
          - "X-User-ID == dispute.agent_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status := SUBMITTED; rationale := rationale + ' | ' + payload additional_rationale; reviewer_evaluator_id := null (the next round may be picked up by any other evaluator)"
          - "round_count is NOT changed by this transition"
          - "increments Dispute.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /disputes/{id}/resolve with outcome REJECTED"
        actor: QualityEvaluator
        preconditions:
          - "dispute.status == UNDER_REVIEW (else ERR_DISPUTE_NOT_RESOLVABLE)"
          - "X-User-ID == dispute.reviewer_evaluator_id (else ERR_NOT_RESOURCE_OWNER)"
          - "adjusted_item_scores is absent (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status := REJECTED; outcome_note := payload outcome_note"
          - "evaluation.feedback_status := DELIVERED with feedback_delivered_at unchanged, and evaluation.review_status := FINALIZED when it was SUBMITTED -- COMPENSATION: every field the dispute touched returns to its pre-dispute value, scores included"
          - "increments Dispute.version and Evaluation.version by 1"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve with outcome UPHELD"
        actor: QualityEvaluator
        preconditions:
          - "dispute.status == UNDER_REVIEW (else ERR_DISPUTE_NOT_RESOLVABLE)"
          - "X-User-ID == dispute.reviewer_evaluator_id (else ERR_NOT_RESOURCE_OWNER)"
          - "adjusted_item_scores is present and covers every FormBehavior code of the evaluation's form exactly once (else ERR_ITEM_SCORE_INCOMPLETE)"
          - "every adjusted points value is within 0..behavior.max_points (else ERR_ITEM_SCORE_OUT_OF_RANGE)"
          - "adjusted points differ from the evaluation's item_scores on at least one code listed in disputed_behavior_codes (else ERR_INVALID_REQUEST)"
        side_effects:
          - "ordered step 1: status := UPHELD; outcome_note := payload outcome_note"
          - "ordered step 2 -- CASCADE hop 1: because the dispute was upheld, evaluation.adjusted_weighted_score := RENORMALIZED evaluation_weighted_score over adjusted_item_scores, evaluation.compliance_result is recomputed from the adjusted scores, review_status := REOPENED and feedback_status := PENDING with feedback_delivered_at := null"
          - "ordered step 3 -- CASCADE hop 2: because compliance_result flipped FAIL -> PASS, interaction.compliance_hold := false"
          - "ordered step 4 -- CASCADE hop 3: because interaction.compliance_hold flipped true -> false, Agent.open_compliance_findings is recomputed (-1) and Agent.quality_index_rolling / quality_index_period are recomputed from effective_score (adjusted_weighted_score now wins over weighted_score)"
          - "ordered step 5 -- CASCADE hop 4: because Agent.open_compliance_findings reached 0, every CoachingPlan of that agent with status IN {ASSIGNED, IN_PROGRESS} and source_evaluation_id == this evaluation := VOIDED, and Agent.coaching_state := CLEARED when it was REQUIRED or ACTIVE"
          - "increments Dispute.version, Evaluation.version, Interaction.version, Agent.version and any mutated CoachingPlan.version by 1"
        note: |
          Hops 2..4 are strictly chained: hop 2 fires only because hop 1 recomputed
          compliance_result to PASS, hop 3 only because hop 2 cleared compliance_hold,
          hop 4 only because hop 3 drove open_compliance_findings to 0. When the
          adjusted scores still leave compliance_result == FAIL, hops 2, 3 and 4 do not
          fire at all and only hop 1's fields change.

  - entity: CoachingPlan
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, ESCALATED, VOIDED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /coaching-plans/{id}/log-session"
        actor: Supervisor
        preconditions:
          - "plan.status IN {ASSIGNED, IN_PROGRESS} (else ERR_COACHING_PLAN_TERMINAL)"
          - "session_at >= plan.created_at (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status := IN_PROGRESS; completed_session_count += 1"
          - "increments CoachingPlan.version by 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /coaching-plans/{id}/log-session (subsequent sessions)"
        actor: Supervisor
        preconditions:
          - "plan.status IN {ASSIGNED, IN_PROGRESS} (else ERR_COACHING_PLAN_TERMINAL)"
        side_effects:
          - "completed_session_count += 1 (self-loop; status unchanged)"
          - "increments CoachingPlan.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /coaching-plans/{id}/complete"
        actor: Supervisor
        preconditions:
          - "plan.status IN {ASSIGNED, IN_PROGRESS} (else ERR_COACHING_PLAN_TERMINAL)"
          - "agent.open_compliance_findings == 0 (else ERR_COMPLIANCE_HOLD_OPEN) -- cross-entity guard on Agent"
          - "completed_session_count >= required_session_count (else ERR_SESSIONS_INCOMPLETE); an ASSIGNED plan always fails this check because required_session_count is at least 1"
        side_effects:
          - "status := COMPLETED"
          - "Agent.coaching_state := CLEARED"
          - "increments CoachingPlan.version and Agent.version by 1"
      - from: ASSIGNED
        to: ESCALATED
        trigger: "POST /coaching-plans/{id}/escalate"
        actor: QualityManager
        preconditions:
          - "plan.status IN {ASSIGNED, IN_PROGRESS} (else ERR_COACHING_PLAN_TERMINAL)"
          - "logical clock now >= plan.due_at OR agent.open_compliance_findings >= ESCALATION_FINDING_THRESHOLD (2) (else ERR_ESCALATION_NOT_DUE)"
        side_effects:
          - "status := ESCALATED; escalation_note := payload escalation_note; escalation_tier := T3"
          - "Agent.coaching_state is left unchanged (an escalated plan is still an active intervention)"
          - "increments CoachingPlan.version by 1"
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /coaching-plans/{id}/escalate"
        actor: QualityManager
        preconditions:
          - "identical to ASSIGNED -> ESCALATED"
        side_effects:
          - "identical to ASSIGNED -> ESCALATED"
      - from: ASSIGNED
        to: VOIDED
        trigger: "system, inside POST /disputes/{id}/resolve (UPHELD cascade hop 4) or inside POST /coaching-plans when a newer plan supersedes this one"
        actor: system
        preconditions:
          - "plan.status IN {ASSIGNED, IN_PROGRESS}"
        side_effects:
          - "status := VOIDED"
          - "increments CoachingPlan.version by 1"
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "system, inside POST /disputes/{id}/resolve (UPHELD cascade hop 4) or inside POST /coaching-plans when a newer plan supersedes this one"
        actor: system
        preconditions:
          - "plan.status IN {ASSIGNED, IN_PROGRESS}"
        side_effects:
          - "status := VOIDED; completed_session_count is retained for audit"
          - "increments CoachingPlan.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version -- the only sanctioned
#       write-write conflict mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: analytics-scan-create-stale-interaction
    parent_entity: Interaction
    write_endpoint: "POST /analytics-scans"
    occ_field: "expected_interaction_version"
    description: |
      Creating an AnalyticsScan against an Interaction whose version has advanced
      since the client last read it is rejected. A newly created scan legitimately
      supersedes the interaction's prior CURRENT scan, so a writer holding a stale
      view of the interaction (its consent outcome may have changed, or a scan may
      already have superseded the one the writer believes is current) must re-read
      before screening again.
    error_id: ERR_STALE_INTERACTION_VERSION
    http_status: 412
  - rule_id: coaching-plan-create-stale-agent
    parent_entity: Agent
    write_endpoint: "POST /coaching-plans"
    occ_field: "expected_agent_version"
    description: |
      Creating a CoachingPlan against an Agent whose version has advanced since the
      client last read it is rejected. A new plan legitimately supersedes the agent's
      prior ASSIGNED / IN_PROGRESS plan (which is VOIDED), and the required session
      count is derived from the agent's quality_index_rolling, so a stale agent view
      would both void the wrong plan and size the new one from an outdated index.
    error_id: ERR_STALE_AGENT_VERSION
    http_status: 412
  - rule_id: dispute-create-stale-evaluation
    parent_entity: Evaluation
    write_endpoint: "POST /disputes"
    occ_field: "expected_evaluation_version"
    description: |
      Filing a Dispute against an Evaluation whose version has advanced since the
      agent last read it is rejected. The delivered score the agent is contesting may
      already have been re-scored and re-delivered after an earlier upheld dispute,
      in which case the new filing legitimately supersedes the agent's stale view of
      the scorecard.
    error_id: ERR_STALE_EVALUATION_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: evaluation_weighted_score
    trigger: "POST /evaluations/{id}/submit (both DRAFT -> SUBMITTED and REOPENED -> SUBMITTED); POST /disputes/{id}/resolve with outcome UPHELD (over adjusted_item_scores); POST /calibration-sessions (over benchmark_item_scores); POST /calibration-submissions (over the participant's item_scores)"
    algorithm: weighted_scoring
    formula: |
      INPUT: form       = EvaluationForm(target.form_id)
             behaviors  = FormBehavior rows with form_id == form.id, iterated in code ASC order
             items      = the supplied item_scores, keyed by behavior_code

      STEP 1 -- per-item contribution, ROUNDED HALF_UP TO 2 DECIMALS PER ITEM
               (PINNED ORDER: round per item first, sum afterwards):
        for each b in behaviors:
          if items[b.code].not_applicable == true:
            contrib_renorm[b.code] = EXCLUDED
            contrib_fixed[b.code]  = round(b.weight_pct * 1, 2)      # N/A earns FULL credit in the FIXED variant
          else:
            pct = items[b.code].points / b.max_points                # exact rational, never rounded here
            contrib_renorm[b.code] = round(b.weight_pct * pct, 2)
            contrib_fixed[b.code]  = contrib_renorm[b.code]

      STEP 2 -- auto-fail reshaping:
        auto_fail_triggered = EXISTS b WHERE b.auto_fail_on_violation == true
                                        AND items[b.code].not_applicable == false
                                        AND items[b.code].points == 0
        if auto_fail_triggered AND form.auto_fail_policy == COMPLIANCE_SECTION_ZERO:
          for each b WHERE b.compliance_critical == true:
            if contrib_renorm[b.code] != EXCLUDED: contrib_renorm[b.code] = 0.00
            contrib_fixed[b.code] = 0.00
          # the renormalisation denominator is NOT reduced: zeroed compliance weight stays in it

      STEP 3 -- aggregate, renormalise, round again
               (PINNED ORDER: per-item round -> sum -> renormalise -> round):
        applicable_weight  = sum(b.weight_pct for b WHERE contrib_renorm[b.code] != EXCLUDED)
        weighted_score     = round(sum(contrib_renorm WHERE != EXCLUDED) * 100 / applicable_weight, 2)
        raw_weighted_score = round(sum(contrib_fixed over ALL behaviors), 2)

      STEP 4 -- total zeroing:
        if auto_fail_triggered AND form.auto_fail_policy == ZERO_TOTAL:
          weighted_score = 0.00 AND raw_weighted_score = 0.00

      STEP 5 -- compliance verdict:
        compliance_result = FAIL when auto_fail_triggered == true
                                 OR EXISTS b WHERE b.compliance_critical == true
                                                AND items[b.code].not_applicable == false
                                                AND items[b.code].points < form.min_compliance_item_score
                            else PASS

      EDGE -- when every behavior is marked not_applicable, applicable_weight == 0:
        weighted_score = null, raw_weighted_score = 100.00, compliance_result = NOT_EVALUATED
    input_set: "exactly the FormBehavior rows of the pinned form (evaluation.form_id / session.form_id); behaviors of any other form are never read, and a form's behaviour set is frozen once the form leaves DRAFT"
    constants:
      ITEM_ROUNDING: "HALF_UP to 2 decimals, applied once per behaviour BEFORE summation"
      FINAL_ROUNDING: "HALF_UP to 2 decimals, applied after renormalisation"
    precision: "2 decimal places, round_half_up, applied twice (per item, then on the renormalised total)"
    variants:
      - name: RENORMALIZED
        when: "always -- persisted into Evaluation.weighted_score, CalibrationSubmission.weighted_score, CalibrationSession.benchmark_weighted_score and Evaluation.adjusted_weighted_score"
        difference: "behaviours marked not_applicable are removed from BOTH numerator and denominator; the remaining weight is scaled back up to 100"
      - name: FIXED_DENOMINATOR
        when: "always -- persisted in parallel into Evaluation.raw_weighted_score"
        difference: "the denominator is always 100.00 and a not_applicable behaviour earns full credit for its whole weight; for the same submitted item_scores this diverges from RENORMALIZED whenever at least one behaviour is not_applicable (e.g. 78.82 vs 82.00 on the reference form)"

  - name: agent_quality_index
    trigger: "recomputed at ordered step 4 of POST /evaluations/{id}/submit and at cascade hop 3 of POST /disputes/{id}/resolve with outcome UPHELD; read back by GET /agents/{id} and GET /agents/{id}/quality-summary"
    algorithm: aggregation
    formula: |
      effective_score(e) = e.adjusted_weighted_score when it is not null, else e.weighted_score

      input_set = Evaluation rows WHERE agent_id == A
                                   AND review_status IN {SUBMITTED, FINALIZED, REOPENED}
                                   AND weighted_score IS NOT NULL

      ROLLING_4:
        ordered = input_set sorted by submitted_at DESC, tie-break created_at DESC
        window  = the first min(4, count(ordered)) rows of `ordered`
        quality_index_rolling = round(sum(effective_score(e) for e in window) / count(window), 2)
        when input_set is empty -> quality_index_rolling = null

      PERIOD_DURATION_WEIGHTED:
        plan = the SamplePlan with status == OPEN whose CLOSED interval
               [period_start, period_end] contains the logical clock instant;
               ranking period_start ASC, tie-break created_at ASC
        when no such plan exists -> quality_index_period = null
        subset = input_set WHERE Interaction(e).started_at is inside the CLOSED
                 interval [plan.period_start, plan.period_end]
        when subset is empty OR sum(duration_seconds) == 0 -> quality_index_period = null
        quality_index_period = round( sum(effective_score(e) * Interaction(e).duration_seconds)
                                      / sum(Interaction(e).duration_seconds), 2 )
    input_set: "evaluations in review_status {SUBMITTED, FINALIZED, REOPENED}; DRAFT evaluations never contribute, and EXCLUDED selections contribute nothing because they never produce an evaluation"
    constants:
      ROLLING_WINDOW_SIZE: 4
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ROLLING_4
        when: "persisted into Agent.quality_index_rolling and used by coaching_requirement and the recognition threshold"
        difference: "unweighted mean of the 4 most recent evaluations regardless of contact length or monitoring period"
      - name: PERIOD_DURATION_WEIGHTED
        when: "persisted into Agent.quality_index_period and reported by GET /agents/{id}/quality-summary"
        difference: "duration-weighted mean restricted to the open monitoring period; long contacts dominate, so for the same two evaluations (78.82 over 600s and 52.00 over 1800s) it reads 58.71 where ROLLING_4 reads 65.41"

  - name: analytics_priority_score
    trigger: "POST /analytics-scans"
    algorithm: weighted_scoring
    formula: |
      base = min( 100,
                    silence_pct * SILENCE_WEIGHT
                  + max(0, -sentiment_delta) * 100 * SENTIMENT_WEIGHT
                  + sum(CATEGORY_POINTS[c] for c in flagged_categories) )

      disclosure_gap = DISCLOSURE_GAP_BONUS when interaction.required_disclosures is non-empty
                       AND at least one required code is missing from interaction.captured_disclosures,
                       else 0

      risk_score = round( min(100.00, base * CHANNEL_MULTIPLIER[interaction.channel] + disclosure_gap), 2 )

      priority_tier = P1 when risk_score >= 70.00
                      P2 when 40.00 <= risk_score < 70.00
                      P3 when risk_score < 40.00
    input_set: "the payload metrics plus the interaction's channel, required_disclosures and captured_disclosures as they stand at the instant of the call; a later consent review does NOT retro-adjust an existing scan"
    constants:
      SILENCE_WEIGHT: 0.45
      SENTIMENT_WEIGHT: 0.35
      CATEGORY_POINTS: { PROFANITY: 25, NO_DISCLOSURE: 30, ESCALATION_REQUEST: 15, CONSENT_OBJECTION: 40 }
      CHANNEL_MULTIPLIER: { VOICE: 1.20, CHAT: 1.00, EMAIL: 0.80 }
      DISCLOSURE_GAP_BONUS: 15
      TIER_P1_MIN: 70.00
      TIER_P2_MIN: 40.00
    precision: "2 decimal places, round_half_up; the inner `base` cap and the channel multiplication are performed on unrounded values, the single rounding happens on risk_score"

  - name: coaching_requirement
    trigger: "POST /coaching-plans"
    algorithm: threshold
    formula: |
      PRECONDITION: agent.quality_index_rolling IS NOT NULL (else ERR_INSUFFICIENT_EVALUATION_HISTORY)

      STEP 1: deficit_pct = round(target_score - agent.quality_index_rolling, 2)
              when deficit_pct <= 0.00 -> ERR_INVALID_REQUEST (a plan needs a real gap)

      STEP 2 -- tier selection is made on the RAW deficit and is NEVER revisited:
              tier = T1 when deficit_pct <= 5.00
                     T2 when 5.00 < deficit_pct <= 12.00
                     T3 when deficit_pct > 12.00

      STEP 3: adjusted_deficit = round(deficit_pct * TIER[tier].multiplier, 2)

      STEP 4: required_session_count = clamp( ceil(adjusted_deficit / TIER[tier].session_gain), 1, 8 )
              # PINNED EVALUATION ORDER: the multiplier is applied AFTER the tier is
              # fixed. Even when adjusted_deficit crosses the next tier's boundary the
              # tier is NOT re-selected and session_gain is NOT swapped.

      STEP 5: due_at = logical clock now + TIER[tier].due_days days

      STEP 6 -- compliance bump, applied AFTER required_session_count is final:
              escalation_tier = tier bumped one level (T1->T2, T2->T3, T3->T3) when
                                agent.open_compliance_findings >= 1, else tier.
              required_session_count and due_at are NOT recomputed from the bumped tier.
    input_set: "the agent's quality_index_rolling and open_compliance_findings as they stand when the plan is created; later evaluations never resize an existing plan"
    constants:
      TIER: { T1: { multiplier: 1.00, session_gain: 2.50, due_days: 30 }, T2: { multiplier: 1.25, session_gain: 2.00, due_days: 45 }, T3: { multiplier: 1.50, session_gain: 1.50, due_days: 60 } }
      TIER_T1_MAX_DEFICIT: 5.00
      TIER_T2_MAX_DEFICIT: 12.00
      MIN_SESSIONS: 1
      MAX_SESSIONS: 8
    precision: "deficit and adjusted_deficit rounded HALF_UP to 2 decimals; session count is a ceiling on the rounded adjusted deficit"

  - name: calibration_variance
    trigger: "POST /calibration-sessions/{id}/close; per-submission fields are also written by POST /calibration-submissions (weighted_score only, deviation and alignment stay null until close)"
    algorithm: aggregation
    formula: |
      submissions = CalibrationSubmission rows WHERE session_id == S, iterated created_at ASC

      for each s in submissions:
        s.deviation_pct = round(s.weighted_score - S.benchmark_weighted_score, 2)     # signed
        s.alignment     = ALIGNED         when abs(s.deviation_pct) <= 3.00
                          MINOR_VARIANCE  when 3.00 < abs(s.deviation_pct) <= 7.00
                          MAJOR_VARIANCE  when abs(s.deviation_pct) > 7.00

      S.participant_count   = count(submissions)
      S.variance_pct        = round(max(abs(s.deviation_pct) for s in submissions), 2)
      S.mean_abs_deviation  = round(sum(abs(s.deviation_pct) for s in submissions) / count(submissions), 2)

      outcome = VOID            when participant_count < 2
                CLOSED_ALIGNED  when variance_pct <= VARIANCE_ALIGNED_MAX
                CLOSED_VARIANT  when variance_pct >  VARIANCE_ALIGNED_MAX

      when outcome == VOID only S.participant_count is persisted: no submission
      deviation_pct/alignment is written (both stay null) and S.variance_pct /
      S.mean_abs_deviation stay null.

      evaluator standing (skipped entirely when outcome == VOID), applied per submission
      in created_at ASC order:
        abs(deviation) >  VARIANCE_SEVERE_MAX                       -> SUSPENDED
        alignment == MAJOR_VARIANCE and status == CALIBRATED        -> PROBATION
        alignment == MAJOR_VARIANCE and status == PROBATION         -> SUSPENDED
        alignment == ALIGNED        and status == PROBATION         -> CALIBRATED
        otherwise                                                   -> unchanged
    input_set: "every CalibrationSubmission of the session, whatever the submitting evaluator's calibration_status; the session's own benchmark_weighted_score is the reference and is never re-derived at close"
    constants:
      VARIANCE_ALIGNED_MAX: 7.00
      VARIANCE_SEVERE_MAX: 15.00
      ALIGNED_MAX: 3.00
      MIN_PARTICIPANTS: 2
    precision: "2 decimal places, round_half_up; band comparisons use the rounded absolute deviation, so exactly 7.00 is MINOR_VARIANCE and exactly 3.00 is ALIGNED"

  - name: agent_quality_correlation
    trigger: "GET /agents/{id}/quality-summary (computed per request, never persisted)"
    algorithm: aggregation
    formula: |
      input_set = Evaluation rows WHERE agent_id == A
                                   AND review_status IN {SUBMITTED, FINALIZED, REOPENED}
                                   AND weighted_score IS NOT NULL
      each row is paired with Interaction(SampleSelection(e.selection_id).interaction_id)

      high = rows WHERE effective_score >= HIGH_SCORE_FLOOR
      low  = rows WHERE effective_score <  HIGH_SCORE_FLOOR

      PAIRED_ONLY:
        h = round(mean(csat_score of high WHERE csat_score IS NOT NULL), 2)
        l = round(mean(csat_score of low  WHERE csat_score IS NOT NULL), 2)
        csat_gap_paired = round(h - l, 2)        # PINNED: each mean is rounded BEFORE the subtraction
        null when either side has no non-null csat_score

      ALL_SCORED_IMPUTED:
        same computation with every null csat_score replaced by CSAT_IMPUTED_DEFAULT
        csat_gap_all = round(h' - l', 2)
        null only when `high` or `low` is empty

      paired_sample_size     = count(input_set WHERE csat_score IS NOT NULL)
      evaluations_considered = count(input_set)
      repeat_contact_rate    = round(count(input_set WHERE repeat_contact_within_72h == true)
                                     / count(input_set) * 100, 2)
      EDGE -- input_set empty: evaluations_considered = 0, paired_sample_size = 0 and
             csat_gap_paired, csat_gap_all, repeat_contact_rate are all null; the endpoint
             still answers 200 and never divides by zero.
    input_set: "same evaluation status filter as agent_quality_index; DRAFT evaluations and EXCLUDED selections contribute nothing"
    constants:
      HIGH_SCORE_FLOOR: 85.00
      CSAT_IMPUTED_DEFAULT: 3
    precision: "2 decimal places, round_half_up on each mean and again on the gap"
    variants:
      - name: PAIRED_ONLY
        when: "reported as csat_gap_paired"
        difference: "interactions with a null csat_score are dropped entirely"
      - name: ALL_SCORED_IMPUTED
        when: "reported as csat_gap_all"
        difference: "interactions with a null csat_score are kept and imputed at 3; for the same three evaluations the paired gap reads 3.00 while the imputed gap reads 2.50"

  - name: sample_quota_attainment
    trigger: "recomputed on POST /sample-selections, POST /sample-selections/{id}/exclude, POST /sample-plans/{id}/close, the consent-DENIED cascade and the compliance TARGETED reservation cascade; read back on GET /sample-plans/{id}"
    algorithm: waterfall_allocation
    formula: |
      per plan P and agent A:
        base_cap[s]        = floor(P.per_agent_target_volume * P.source_mix.<s>_pct / 100)
                             for s in [RANDOM, TARGETED, CUSTOMER_FLAGGED]
        remainder          = P.per_agent_target_volume - sum(base_cap[s])
        effective_cap[RANDOM]           = base_cap[RANDOM] + remainder      # PINNED: the whole
                                          # remainder always lands on RANDOM, never split
        effective_cap[TARGETED]         = base_cap[TARGETED] + reserve(P, A)
        effective_cap[CUSTOMER_FLAGGED] = base_cap[CUSTOMER_FLAGGED]
        reserve(P, A)      = P.targeted_reserve_by_agent[A], or 0 when the key is absent

        consumed_by_source[s] = count(SampleSelection WHERE plan_id == P AND agent_id == A
                                       AND source == s AND status IN {SELECTED, ASSIGNED, EVALUATED})
        consumed              = sum(consumed_by_source[s])
        remaining             = P.per_agent_target_volume + reserve(P, A) - consumed

        agent_volume_attainment[A] = { consumed, remaining, by_source: consumed_by_source }

      P.selections_count = count(SampleSelection of P WHERE status IN {SELECTED, ASSIGNED, EVALUATED})
      P.excluded_count   = count(SampleSelection of P WHERE status == EXCLUDED)
      P.targeted_reserved_count = sum(P.targeted_reserve_by_agent values)

      CONSERVED QUANTITY (checked by the compensating-invariant tests):
        for every (P, A):  consumed(P,A) + remaining(P,A)
                           == P.per_agent_target_volume + reserve(P, A)
        EXCLUDED selections never appear in consumed, so a create followed by an exclude of
        the same selection returns both sides to their exact pre-create values.
    input_set: "selections in status {SELECTED, ASSIGNED, EVALUATED}; EXCLUDED selections are historical and consume nothing"
    constants:
      REMAINDER_TARGET_SOURCE: RANDOM
    precision: "integer counts only; caps use floor division on the integer percentage split"

  - name: evaluator_load
    trigger: "recomputed whenever a SampleSelection is assigned, released, evaluated or excluded; read back on GET /evaluators/{id}"
    algorithm: aggregation
    formula: |
      open_assignment_count = count(SampleSelection WHERE assigned_evaluator_id == E
                                                       AND status == ASSIGNED)
      capacity gate at assign time: open_assignment_count (BEFORE this assignment)
                                    < Evaluator.max_open_assignments
      last_deviation_pct = deviation_pct of the CalibrationSubmission of E with the greatest
                           created_at (tie-break: the row created last within the same instant
                           is impossible because created_at carries millisecond precision and a
                           single evaluator may hold at most one submission per session); null
                           before E's first submission
    input_set: "only selections in status ASSIGNED count against capacity; SELECTED, EVALUATED and EXCLUDED selections are free"
    constants:
      DEFAULT_MAX_OPEN_ASSIGNMENTS: 3
    precision: "integer counts; deviation copied at 2 decimals"

validations:
  # ---- 1-2: authentication and authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ---- 3: request shape ----------------------------------------------------
  - priority: 3
    category: business_constraint
    check: "request body parses, every required input field is present and non-null, every field has the declared JSON type, every enum-typed field carries a declared member, integers are integers, decimals carry at most 2 fractional digits, datetimes are RFC3339 UTC with a trailing Z, and every declared numeric range holds (weight_pct in 0.01..100.00, silence_pct in 0.00..100.00, sentiment_delta in -1.00..1.00, csat_score in 1..5, max_points in {3,4,5}, per_agent_target_volume in 1..50, target_score in 0.00..100.00, points in 1..500)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  # ---- 4-5: existence ------------------------------------------------------
  - priority: 4
    category: existence
    check: "every id in the request PATH resolves to a stored row, validated left-to-right"
    error_id: "ERR_FORM_NOT_FOUND | ERR_AGENT_NOT_FOUND | ERR_EVALUATOR_NOT_FOUND | ERR_INTERACTION_NOT_FOUND | ERR_SCAN_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_SELECTION_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_COACHING_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint whose path carries an {id}"
  - priority: 5
    category: existence
    check: "every FK id in the request BODY resolves to a stored row, validated in the order the endpoint's input list declares them (e.g. POST /sample-plans checks form_id; POST /sample-selections checks plan_id then interaction_id; POST /coaching-plans checks agent_id then source_evaluation_id)"
    error_id: "ERR_FORM_NOT_FOUND | ERR_AGENT_NOT_FOUND | ERR_EVALUATOR_NOT_FOUND | ERR_INTERACTION_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_SELECTION_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_SESSION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /analytics-scans, POST /sample-plans, POST /sample-selections, POST /sample-selections/{id}/assign, POST /evaluations, POST /calibration-sessions, POST /calibration-submissions, POST /disputes, POST /coaching-plans"

  # ---- 6-7: identity-bound authorization ----------------------------------
  - priority: 6
    category: auth
    check: "for an entity_backed role the acting X-User-ID must own the target: Agent may only acknowledge, dispute or respond on an Evaluation/Dispute whose agent_id equals X-User-ID; QualityEvaluator may only open or submit an Evaluation on a selection whose assigned_evaluator_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /evaluations, POST /evaluations/{id}/submit, POST /evaluations/{id}/acknowledge, POST /disputes, POST /disputes/{id}/respond"
  - priority: 7
    category: auth
    check: "segregation of duties: the QualityEvaluator reviewing or resolving a Dispute must NOT be the evaluator who authored the disputed Evaluation (X-User-ID != evaluation.evaluator_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disputes/{id}/review, POST /disputes/{id}/resolve"

  # ---- 8: optimistic concurrency ------------------------------------------
  - priority: 8
    category: state
    check: "the submitted expected_<parent>_version equals the parent's current version (see §1.2.1 concurrency_rules)"
    error_id: "ERR_STALE_INTERACTION_VERSION | ERR_STALE_AGENT_VERSION | ERR_STALE_EVALUATION_VERSION"
    http_status: 412
    applies_to: "POST /analytics-scans, POST /coaching-plans, POST /disputes"

  # ---- 9-25: state preconditions ------------------------------------------
  - priority: 9
    category: state
    check: "the target EvaluationForm is in status DRAFT"
    error_id: ERR_FORM_NOT_DRAFT
    http_status: 409
    applies_to: "POST /evaluation-forms/{id}/activate"
  - priority: 10
    category: state
    check: "the referenced EvaluationForm is in status ACTIVE"
    error_id: ERR_FORM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sample-plans, POST /sample-plans/{id}/open, POST /calibration-sessions"
  - priority: 11
    category: state
    check: "the target SamplePlan is in status DRAFT"
    error_id: ERR_PLAN_NOT_DRAFT
    http_status: 409
    applies_to: "POST /sample-plans/{id}/open"
  - priority: 12
    category: state
    check: "the referenced SamplePlan is in status OPEN"
    error_id: ERR_PLAN_NOT_OPEN
    http_status: 409
    applies_to: "POST /sample-selections, POST /sample-selections/{id}/assign, POST /sample-selections/{id}/exclude, POST /sample-plans/{id}/close"
  - priority: 13
    category: state
    check: "the target SampleSelection is in status SELECTED (assign) or ASSIGNED (evaluation creation)"
    error_id: ERR_SELECTION_NOT_ASSIGNABLE
    http_status: 409
    applies_to: "POST /sample-selections/{id}/assign, POST /evaluations"
  - priority: 14
    category: state
    check: "the target SampleSelection has not reached a terminal status (EVALUATED or EXCLUDED)"
    error_id: ERR_SELECTION_TERMINAL
    http_status: 409
    applies_to: "POST /sample-selections/{id}/exclude"
  - priority: 15
    category: state
    check: "the target Evaluation's review_status is DRAFT or REOPENED"
    error_id: ERR_EVALUATION_NOT_EDITABLE
    http_status: 409
    applies_to: "POST /evaluations/{id}/submit"
  - priority: 16
    category: state
    check: "the target Evaluation's review_status is SUBMITTED or FINALIZED"
    error_id: ERR_EVALUATION_NOT_DELIVERABLE
    http_status: 409
    applies_to: "POST /evaluations/{id}/deliver"
  - priority: 17
    category: state
    check: "the target Evaluation's feedback_status is still PENDING (delivery is not idempotent)"
    error_id: ERR_FEEDBACK_ALREADY_DELIVERED
    http_status: 409
    applies_to: "POST /evaluations/{id}/deliver"
  - priority: 18
    category: state
    check: "the target Evaluation's feedback_status is DELIVERED (acknowledgement) or IN {DELIVERED, ACKNOWLEDGED, DISPUTED} (dispute filing) -- a DISPUTED row is deliberately let through this rule so that the more specific duplicate-dispute rule at priority 41 owns the answer"
    error_id: ERR_FEEDBACK_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /evaluations/{id}/acknowledge, POST /disputes"
  - priority: 19
    category: state
    check: "the target Interaction's recording_consent_status is not already DENIED (a denied interaction is frozen)"
    error_id: ERR_CONSENT_ALREADY_DENIED
    http_status: 409
    applies_to: "POST /interactions/{id}/consent-review, POST /analytics-scans"
  - priority: 20
    category: state
    check: "the target CalibrationSession is in status OPEN"
    error_id: ERR_SESSION_NOT_OPEN
    http_status: 409
    applies_to: "POST /calibration-sessions/{id}/start-scoring"
  - priority: 21
    category: state
    check: "the referenced CalibrationSession is in status SCORING"
    error_id: ERR_SESSION_NOT_SCORING
    http_status: 409
    applies_to: "POST /calibration-submissions, POST /calibration-sessions/{id}/close"
  - priority: 22
    category: state
    check: "the target Dispute is in status SUBMITTED"
    error_id: ERR_DISPUTE_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /disputes/{id}/review"
  - priority: 23
    category: state
    check: "the target Dispute is in status UNDER_REVIEW"
    error_id: ERR_DISPUTE_NOT_RESOLVABLE
    http_status: 409
    applies_to: "POST /disputes/{id}/resolve"
  - priority: 24
    category: state
    check: "the target Dispute is in status NEEDS_MORE_INFO"
    error_id: ERR_DISPUTE_NOT_RESPONDABLE
    http_status: 409
    applies_to: "POST /disputes/{id}/respond"
  - priority: 25
    category: state
    check: "the target CoachingPlan has not reached a terminal status (COMPLETED, ESCALATED or VOIDED)"
    error_id: ERR_COACHING_PLAN_TERMINAL
    http_status: 409
    applies_to: "POST /coaching-plans/{id}/log-session, POST /coaching-plans/{id}/complete, POST /coaching-plans/{id}/escalate"

  # ---- 26-28: safety / compliance -----------------------------------------
  - priority: 26
    category: business_safety
    check: "the referenced Interaction's recording_consent_status IN {VERIFIED, NOT_REQUIRED}; a PENDING or DENIED interaction may never enter the review pool or a calibration session"
    error_id: ERR_CONSENT_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /sample-selections, POST /sample-selections/{id}/assign, POST /evaluations, POST /evaluations/{id}/submit, POST /calibration-sessions"
  - priority: 27
    category: business_safety
    check: "the Evaluator receiving work has calibration_status != SUSPENDED"
    error_id: ERR_EVALUATOR_NOT_CALIBRATED
    http_status: 409
    applies_to: "POST /sample-selections/{id}/assign, POST /evaluations/{id}/submit, POST /disputes/{id}/review"
  - priority: 28
    category: business_safety
    check: "the Agent has no open compliance findings (Agent.open_compliance_findings == 0) before a coaching plan may be completed or a recognition award granted"
    error_id: ERR_COMPLIANCE_HOLD_OPEN
    http_status: 409
    applies_to: "POST /coaching-plans/{id}/complete, POST /agents/{id}/recognition"

  # ---- 29-30: referential integrity of pinned form data -------------------
  - priority: 29
    category: business_referential
    check: "every key of the submitted item_scores map is a behavior code declared on the pinned form (evaluation submit) or on the session's form (calibration submission); an unknown code means the client scored against a different form version"
    error_id: ERR_FORM_VERSION_MISMATCH
    http_status: 422
    applies_to: "POST /evaluations/{id}/submit, POST /calibration-submissions, POST /calibration-sessions, POST /disputes/{id}/resolve"
  - priority: 30
    category: business_referential
    check: "the plan's pinned_form_guidance_version equals the form's current guidance_version; a calibration session that bumped guidance since the plan opened blocks new evaluations until a fresh plan pins the new guidance"
    error_id: ERR_GUIDANCE_VERSION_STALE
    http_status: 409
    applies_to: "POST /evaluations, POST /evaluations/{id}/submit"

  # ---- 31-44: business constraints ----------------------------------------
  - priority: 31
    category: business_constraint
    check: "the submitted behaviors[] weight_pct values sum to exactly 100.00"
    error_id: ERR_WEIGHTS_NOT_100
    http_status: 422
    applies_to: "POST /evaluation-forms"
  - priority: 32
    category: business_constraint
    check: "at least one submitted behavior has compliance_critical == true"
    error_id: ERR_NO_COMPLIANCE_BEHAVIOR
    http_status: 422
    applies_to: "POST /evaluation-forms"
  - priority: 33
    category: business_constraint
    check: "behavior codes within one form are unique (case-sensitive)"
    error_id: ERR_DUPLICATE_BEHAVIOR_CODE
    http_status: 422
    applies_to: "POST /evaluation-forms"
  - priority: 34
    category: business_constraint
    check: "source_mix carries exactly random_pct, targeted_pct and customer_flagged_pct as non-negative integers summing to exactly 100"
    error_id: ERR_SOURCE_MIX_INVALID
    http_status: 422
    applies_to: "POST /sample-plans"
  - priority: 35
    category: business_constraint
    check: "item_scores covers every behavior code of the form exactly once; a behavior may be omitted only if allows_not_applicable is true AND it is submitted with the literal value \"NA\""
    error_id: ERR_ITEM_SCORE_INCOMPLETE
    http_status: 422
    applies_to: "POST /evaluations/{id}/submit, POST /calibration-submissions, POST /calibration-sessions"
  - priority: 36
    category: business_constraint
    check: "each numeric item score is an integer in 0..behavior.max_points"
    error_id: ERR_ITEM_SCORE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /evaluations/{id}/submit, POST /calibration-submissions, POST /calibration-sessions, POST /disputes/{id}/resolve"
  - priority: 37
    category: business_constraint
    check: "the literal \"NA\" appears only for behaviors whose allows_not_applicable is true, and never for a compliance_critical behavior"
    error_id: ERR_NA_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /evaluations/{id}/submit, POST /calibration-submissions, POST /calibration-sessions, POST /disputes/{id}/resolve"
  - priority: 38
    category: business_constraint
    check: "the requested source is eligible for this interaction: CUSTOMER_FLAGGED requires interaction.customer_flagged == true; TARGETED requires an AnalyticsScan on that interaction with status CURRENT and priority_tier IN {P1, P2}; RANDOM carries no extra requirement"
    error_id: ERR_SOURCE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /sample-selections"
  - priority: 39
    category: business_constraint
    check: "the interaction is not already selected inside the same plan by a selection whose status IN {SELECTED, ASSIGNED, EVALUATED}"
    error_id: ERR_DUPLICATE_INTERACTION_SELECTION
    http_status: 409
    applies_to: "POST /sample-selections"
  - priority: 40
    category: business_constraint
    check: "the acting evaluator has not already submitted to this calibration session"
    error_id: ERR_SESSION_PARTICIPANT_DUPLICATE
    http_status: 409
    applies_to: "POST /calibration-submissions"
  - priority: 41
    category: business_constraint
    check: "the Evaluation has no Dispute in a non-terminal status (SUBMITTED, UNDER_REVIEW or NEEDS_MORE_INFO)"
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 42
    category: business_constraint
    check: "dispute.round_count < MAX_DISPUTE_ROUNDS (2) before another NEEDS_MORE_INFO round may be opened"
    error_id: ERR_DISPUTE_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /disputes/{id}/resolve"
  - priority: 43
    category: business_constraint
    check: "completed_session_count >= required_session_count before a coaching plan may be completed"
    error_id: ERR_SESSIONS_INCOMPLETE
    http_status: 422
    applies_to: "POST /coaching-plans/{id}/complete"
  - priority: 44
    category: business_constraint
    check: "the Agent has enough scored history for the requested action: recognition needs at least RECOGNITION_MIN_EVALUATIONS (2) evaluations in status IN {SUBMITTED, FINALIZED, REOPENED}; a coaching plan needs quality_index_rolling IS NOT NULL, i.e. at least one such evaluation"
    error_id: ERR_INSUFFICIENT_EVALUATION_HISTORY
    http_status: 422
    applies_to: "POST /agents/{id}/recognition, POST /coaching-plans"

  # ---- 45-49: temporal ----------------------------------------------------
  - priority: 45
    category: business_temporal
    check: "interval endpoints are strictly ordered: interactions require ended_at > started_at; plans require period_end > period_start; calibration sessions require scheduled_end > scheduled_start; assignments require review_window_end > review_window_start"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /interactions, POST /sample-plans, POST /calibration-sessions, POST /sample-selections/{id}/assign"
  - priority: 46
    category: business_temporal
    check: "no other SamplePlan for the same form_id in status IN {DRAFT, OPEN} has a period colliding with this one under CLOSED-interval semantics -- touching endpoints collide (a plan ending 2026-08-31 collides with one starting 2026-08-31)"
    error_id: ERR_PLAN_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /sample-plans, POST /sample-plans/{id}/open"
  - priority: 47
    category: business_temporal
    check: "the evaluator's requested review window does not overlap any window they already hold on a selection in status ASSIGNED, under HALF-OPEN [start, end) semantics -- touching endpoints are allowed (a window ending 11:00 sits legally beside one starting 11:00)"
    error_id: ERR_EVALUATOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /sample-selections/{id}/assign"
  - priority: 48
    category: business_temporal
    check: "the dispute is filed no later than DISPUTE_WINDOW_DAYS (7) days after evaluation.feedback_delivered_at, compared against the logical clock"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /disputes"
  - priority: 49
    category: business_temporal
    check: "the logical clock has reached coaching_plan.due_at before the plan may be escalated"
    error_id: ERR_ESCALATION_NOT_DUE
    http_status: 422
    applies_to: "POST /coaching-plans/{id}/escalate"

  # ---- 50-53: capacity / quota / recognition budget -----------------------
  - priority: 50
    category: business_fiscal
    check: "consumed(plan, agent) < per_agent_target_volume + targeted_reserve_by_agent[agent] before another selection may be created for that agent"
    error_id: ERR_AGENT_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /sample-selections"
  - priority: 51
    category: business_fiscal
    check: "consumed_by_source(plan, agent, source) < effective_cap(plan, agent, source) per sample_quota_attainment"
    error_id: ERR_SOURCE_MIX_EXCEEDED
    http_status: 422
    applies_to: "POST /sample-selections"
  - priority: 52
    category: business_fiscal
    check: "evaluator.open_assignment_count < evaluator.max_open_assignments before another selection may be assigned to them"
    error_id: ERR_EVALUATOR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /sample-selections/{id}/assign"
  - priority: 53
    category: business_fiscal
    check: "agent.quality_index_rolling >= RECOGNITION_MIN_INDEX (92.00) before recognition points may be awarded"
    error_id: ERR_RECOGNITION_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /agents/{id}/recognition"

endpoints:
  # ---- evaluation forms ----------------------------------------------------
  - method: POST
    path: "/evaluation-forms"
    description: "Create a DRAFT evaluation form together with its weighted behaviors. behaviors[] items carry code, label, weight_pct, compliance_critical?, auto_fail_on_violation?, max_points?, allows_not_applicable?, guidance_text; each item becomes a FormBehavior row whose form_id is the new form."
    roles: [QualityManager]
    code: 201
    input: [name, version_label, auto_fail_policy, behaviors, "min_compliance_item_score?"]
    output: EvaluationForm
    side_effects:
      - "creates one FormBehavior per behaviors[] element with guidance_version := 1"
      - "behavior_weight_total := sum(weight_pct); compliance_behavior_count := count(compliance_critical == true)"
      - "status := DRAFT, guidance_version := 1"
  - method: POST
    path: "/evaluation-forms/{id}/activate"
    description: "Publish a DRAFT form so plans and calibration sessions may reference it."
    roles: [QualityManager]
    code: 200
    input: []
    output: EvaluationForm
    side_effects:
      - "status := ACTIVE, activated_at := logical clock now"
      - "increments EvaluationForm.version by 1"
  - method: POST
    path: "/evaluation-forms/{id}/retire"
    description: "Retire an ACTIVE form; evaluations keep their pinned guidance copy."
    roles: [QualityManager]
    code: 200
    input: []
    output: EvaluationForm
    side_effects:
      - "status := RETIRED, retired_at := logical clock now"
      - "CASCADE: SamplePlan rows of this form in status DRAFT stay DRAFT but can no longer be opened (ERR_FORM_NOT_ACTIVE)"
      - "increments EvaluationForm.version by 1"
  - method: GET
    path: "/evaluation-forms/{id}"
    description: "Read one evaluation form with its computed weight totals and guidance_version."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: []
    output: EvaluationForm
    side_effects: []
  - method: GET
    path: "/evaluation-forms/{id}/behaviors"
    description: "List the behaviors of one form ordered by code ASC; the only discovery channel for the cascade-created FormBehavior rows."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: FormBehavior[]
    side_effects: []
  - method: GET
    path: "/evaluation-forms"
    description: "Paginated list of evaluation forms, filterable by status."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EvaluationForm[]
    side_effects: []

  # ---- agents and evaluators ----------------------------------------------
  - method: POST
    path: "/agents"
    description: "Register a contact-center agent."
    roles: [QualityManager]
    code: 201
    input: [external_ref, full_name, team_code, hire_date]
    output: Agent
    side_effects: ["quality_index_rolling := null, coaching_state := NONE, recognition_points := 0"]
  - method: GET
    path: "/agents/{id}"
    description: "Read one agent including quality_index_rolling, open_compliance_findings, coaching_state and recognition_points."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor, Agent]
    code: 200
    input: []
    output: Agent
    side_effects: []
  - method: GET
    path: "/agents"
    description: "Paginated list of agents, filterable by team_code and coaching_state."
    roles: [QualityManager, Supervisor]
    code: 200
    input: ["team_code?", "coaching_state?", "limit?", "offset?"]
    output: Agent[]
    side_effects: []
  - method: GET
    path: "/agents/{id}/quality-summary"
    description: "Computed read: agent_quality_index plus both agent_quality_correlation variants over the agent's scored evaluations. Nothing is persisted; an agent with no scored evaluations gets nulls, not an error."
    roles: [QualityManager, Supervisor, ComplianceAuditor]
    code: 200
    input: []
    output: { quality_index_rolling: number, quality_index_period: number, csat_gap_paired: number, csat_gap_all: number, repeat_contact_rate: number, paired_sample_size: integer, evaluations_considered: integer }
    side_effects: []
  - method: POST
    path: "/agents/{id}/recognition"
    description: "Award recognition points to a high performer. Conditional action: needs at least 2 scored evaluations, a rolling quality index at or above 92.00, and zero open compliance findings."
    roles: [QualityManager]
    code: 200
    input: [award_code, points]
    output: Agent
    side_effects:
      - "recognition_points := recognition_points + points"
      - "increments Agent.version by 1"
  - method: POST
    path: "/evaluators"
    description: "Register a quality evaluator; calibration_status starts CALIBRATED."
    roles: [QualityManager]
    code: 201
    input: [full_name, "max_open_assignments?"]
    output: Evaluator
    side_effects: ["calibration_status := CALIBRATED, open_assignment_count := 0, last_deviation_pct := null"]
  - method: GET
    path: "/evaluators/{id}"
    description: "Read one evaluator including calibration_status, last_deviation_pct and open_assignment_count."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: []
    output: Evaluator
    side_effects: []
  - method: GET
    path: "/evaluators"
    description: "Paginated list of evaluators, filterable by calibration_status."
    roles: [QualityManager, Supervisor]
    code: 200
    input: ["calibration_status?", "limit?", "offset?"]
    output: Evaluator[]
    side_effects: []

  # ---- interactions and analytics screening --------------------------------
  - method: POST
    path: "/interactions"
    description: "Record a handled contact. duration_seconds is computed from the interval; recording_consent_status starts PENDING for every channel."
    roles: [QualityManager, ComplianceAuditor]
    code: 201
    input: [agent_id, channel, started_at, ended_at, "required_disclosures?", "customer_flagged?", "csat_score?", "repeat_contact_within_72h?"]
    output: Interaction
    side_effects:
      - "duration_seconds := floor(ended_at - started_at in seconds)"
      - "recording_consent_status := PENDING, captured_disclosures := [], compliance_hold := false, sampled_count := 0"
  - method: POST
    path: "/interactions/{id}/consent-review"
    description: "ComplianceAuditor records the recording-consent outcome and which required disclosures were actually captured. consent_outcome IN {VERIFIED, DENIED, NOT_REQUIRED}. A DENIED outcome fires the 3-hop withdrawal cascade over this interaction's live selections."
    roles: [ComplianceAuditor]
    code: 200
    input: [consent_outcome, "captured_disclosures?"]
    output: Interaction
    side_effects:
      - "recording_consent_status := consent_outcome; captured_disclosures := payload captured_disclosures (default [])"
      - "on DENIED -- CASCADE hop 1: every SampleSelection of this interaction with status IN {SELECTED, ASSIGNED} := EXCLUDED with exclusion_reason CONSENT_DENIED"
      - "on DENIED -- CASCADE hop 2: each swept selection releases its evaluator (assigned_evaluator_id := null, windows cleared, Evaluator.open_assignment_count recomputed)"
      - "on DENIED -- CASCADE hop 3: each affected SamplePlan recomputes agent_volume_attainment, selections_count and excluded_count, and this interaction's sampled_count returns to 0"
      - "on DENIED: every AnalyticsScan of this interaction with status CURRENT := SUPERSEDED"
      - "increments Interaction.version by 1"
  - method: GET
    path: "/interactions/{id}"
    description: "Read one interaction with consent posture, disclosure arrays, compliance_hold and sampled_count."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: []
    output: Interaction
    side_effects: []
  - method: GET
    path: "/interactions"
    description: "Paginated list of interactions; agent_id resolves Agent -> Interaction reverse reachability."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["agent_id?", "channel?", "customer_flagged?", "recording_consent_status?", "compliance_hold?", "limit?", "offset?"]
    output: Interaction[]
    side_effects: []
  - method: POST
    path: "/analytics-scans"
    description: "Attach a speech/text analytics screening result to an interaction and let analytics_priority_score rank it for manual review. OCC guarded on the parent Interaction: expected_interaction_version must match, and a successful scan bumps that version."
    roles: [QualityManager, ComplianceAuditor]
    code: 201
    input: [interaction_id, silence_pct, sentiment_delta, expected_interaction_version, "flagged_categories?"]
    output: AnalyticsScan
    side_effects:
      - "risk_score and priority_tier computed by analytics_priority_score"
      - "status := CURRENT; every earlier AnalyticsScan of the same interaction with status CURRENT := SUPERSEDED"
      - "increments Interaction.version by 1"
  - method: GET
    path: "/analytics-scans/{id}"
    description: "Read one analytics scan with its computed risk_score and priority_tier."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: []
    output: AnalyticsScan
    side_effects: []
  - method: GET
    path: "/analytics-scans"
    description: "Paginated list of analytics scans; interaction_id resolves Interaction -> AnalyticsScan reverse reachability. Default order is risk_score DESC, created_at ASC -- the manual-review work queue."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["interaction_id?", "status?", "priority_tier?", "limit?", "offset?"]
    output: AnalyticsScan[]
    side_effects: []

  # ---- sample plans --------------------------------------------------------
  - method: POST
    path: "/sample-plans"
    description: "Draft a sampling plan for one ACTIVE form over a closed date period. source_mix is an object with random_pct, targeted_pct and customer_flagged_pct summing to 100."
    roles: [QualityManager]
    code: 201
    input: [form_id, period_start, period_end, per_agent_target_volume, source_mix]
    output: SamplePlan
    side_effects:
      - "status := DRAFT, pinned_form_guidance_version := null"
      - "selections_count := 0, excluded_count := 0, targeted_reserved_count := 0, targeted_reserve_by_agent := {}, agent_volume_attainment := {}"
  - method: POST
    path: "/sample-plans/{id}/open"
    description: "Open a DRAFT plan for selection. Pins the form's guidance_version onto the plan and re-checks closed-interval period collision against sibling plans of the same form."
    roles: [QualityManager]
    code: 200
    input: []
    output: SamplePlan
    side_effects:
      - "status := OPEN, pinned_form_guidance_version := form.guidance_version"
      - "increments SamplePlan.version by 1"
  - method: POST
    path: "/sample-plans/{id}/close"
    description: "Close an OPEN plan and sweep every still-live selection out of the pool (3-hop cascade). Selections already EVALUATED keep their status."
    roles: [QualityManager]
    code: 200
    input: []
    output: SamplePlan
    side_effects:
      - "status := CLOSED"
      - "every SampleSelection of this plan with status IN {SELECTED, ASSIGNED}, in created_at ASC order, := EXCLUDED with exclusion_reason PLAN_CLOSED_SWEEP"
      - "each swept selection releases its evaluator and its interaction's sampled_count; agent_volume_attainment, selections_count and excluded_count recomputed"
      - "increments SamplePlan.version by 1"
  - method: GET
    path: "/sample-plans/{id}"
    description: "Read one plan with sample_quota_attainment output: agent_volume_attainment, targeted_reserve_by_agent, selections_count, excluded_count, targeted_reserved_count."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: []
    output: SamplePlan
    side_effects: []
  - method: GET
    path: "/sample-plans"
    description: "Paginated list of sampling plans; form_id resolves EvaluationForm -> SamplePlan reverse reachability."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["form_id?", "status?", "limit?", "offset?"]
    output: SamplePlan[]
    side_effects: []

  # ---- sample selections ---------------------------------------------------
  - method: POST
    path: "/sample-selections"
    description: "Pull one interaction into an OPEN plan's review pool under a named source. Enforces source eligibility (TARGETED needs a CURRENT P1/P2 analytics scan, CUSTOMER_FLAGGED needs interaction.customer_flagged), per-agent volume, and the per-source caps of sample_quota_attainment."
    roles: [QualityManager]
    code: 201
    input: [plan_id, interaction_id, source]
    output: SampleSelection
    side_effects:
      - "agent_id := interaction.agent_id (denormalized), status := SELECTED"
      - "plan.agent_volume_attainment, plan.selections_count and interaction.sampled_count recomputed"
      - "increments SamplePlan.version by 1"
  - method: POST
    path: "/sample-selections/{id}/assign"
    description: "Reserve a half-open [start, end) review window for one evaluator on a SELECTED selection. Adjacent windows are legal; overlapping windows are not."
    roles: [QualityManager]
    code: 200
    input: [assigned_evaluator_id, review_window_start, review_window_end]
    output: SampleSelection
    side_effects:
      - "status := ASSIGNED, assigned_evaluator_id and window fields set"
      - "Evaluator.open_assignment_count recomputed (+1)"
      - "increments SampleSelection.version by 1"
  - method: POST
    path: "/sample-selections/{id}/exclude"
    description: "Drop a live selection out of the pool with a reason, returning the consumed slot to the agent's remaining volume."
    roles: [QualityManager]
    code: 200
    input: [exclusion_reason]
    output: SampleSelection
    side_effects:
      - "status := EXCLUDED, exclusion_reason set, evaluator and window released"
      - "plan.agent_volume_attainment, plan.selections_count, plan.excluded_count and interaction.sampled_count recomputed"
      - "increments SampleSelection.version by 1"
  - method: GET
    path: "/sample-selections/{id}"
    description: "Read one selection with its source, status, assigned evaluator and review window."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: []
    output: SampleSelection
    side_effects: []
  - method: GET
    path: "/sample-selections"
    description: "Paginated list of selections; plan_id, interaction_id, agent_id and assigned_evaluator_id each resolve one FK's reverse reachability. Also the discovery channel for selections mutated by a cascade."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["plan_id?", "interaction_id?", "agent_id?", "assigned_evaluator_id?", "status?", "source?", "limit?", "offset?"]
    output: SampleSelection[]
    side_effects: []

  # ---- evaluations ---------------------------------------------------------
  - method: POST
    path: "/evaluations"
    description: "Open a DRAFT evaluation on a selection assigned to the acting evaluator. Pins form_id, agent_id and the plan's guidance version onto the row so a later guidance bump cannot rewrite history."
    roles: [QualityEvaluator]
    code: 201
    input: [selection_id]
    output: Evaluation
    side_effects:
      - "evaluator_id := selection.assigned_evaluator_id, form_id := selection.plan.form_id, agent_id := selection.agent_id"
      - "pinned_guidance_version := selection.plan.pinned_form_guidance_version"
      - "review_status := DRAFT, feedback_status := PENDING, item_scores := {}, weighted_score := null, adjusted_weighted_score := null, agreement := null"
  - method: POST
    path: "/evaluations/{id}/submit"
    description: "Score the interaction. item_scores is an object keyed by behavior code whose values are integers 0..max_points or the literal \"NA\". Runs evaluation_weighted_score (both variants), the auto-fail policy, and the 3-hop compliance cascade onto Interaction, Agent and the open SamplePlan's targeted reserve."
    roles: [QualityEvaluator]
    code: 200
    input: [item_scores]
    output: Evaluation
    side_effects:
      - "item_scores stored; weighted_score := RENORMALIZED variant; raw_weighted_score := FIXED_DENOMINATOR variant; auto_fail_triggered and compliance_result computed"
      - "review_status := SUBMITTED, submitted_at := logical clock now; selection.status := EVALUATED and Evaluator.open_assignment_count recomputed"
      - "CASCADE hop 1 on compliance_result FAIL: interaction.compliance_hold := true"
      - "CASCADE hop 2: Agent.open_compliance_findings recomputed, Agent.coaching_state := REQUIRED, consecutive_passing_evaluations := 0"
      - "CASCADE hop 3: the OPEN SamplePlan of the same form covering the interaction's started_at date reserves one extra TARGETED slot for that agent (targeted_reserve_by_agent[agent] += 1, targeted_reserved_count recomputed)"
      - "Agent.quality_index_rolling and quality_index_period recomputed by agent_quality_index"
      - "increments Evaluation.version, SampleSelection.version, Interaction.version, Agent.version and any mutated SamplePlan.version by 1"
  - method: POST
    path: "/evaluations/{id}/deliver"
    description: "Deliver the scored feedback to the agent, starting the dispute window. Not idempotent."
    roles: [QualityEvaluator, Supervisor]
    code: 200
    input: []
    output: Evaluation
    side_effects:
      - "feedback_status := DELIVERED, feedback_delivered_at := logical clock now"
      - "increments Evaluation.version by 1"
  - method: POST
    path: "/evaluations/{id}/acknowledge"
    description: "Agent acknowledges delivered feedback, recording whether they agree. agreement IN {AGREE, DISAGREE}."
    roles: [Agent]
    code: 200
    input: [agreement]
    output: Evaluation
    side_effects:
      - "feedback_status := ACKNOWLEDGED, agreement := payload agreement"
      - "review_status := FINALIZED when it was SUBMITTED"
      - "Agent.consecutive_passing_evaluations += 1 when compliance_result == PASS and effective_score >= 85.00"
      - "increments Evaluation.version and Agent.version by 1"
  - method: GET
    path: "/evaluations/{id}"
    description: "Read one evaluation with both score variants, the adjusted score, the auto-fail flag and both state dimensions."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor, Agent]
    code: 200
    input: []
    output: Evaluation
    side_effects: []
  - method: GET
    path: "/evaluations"
    description: "Paginated list of evaluations; selection_id, evaluator_id, form_id and agent_id each resolve one FK's reverse reachability."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["selection_id?", "evaluator_id?", "form_id?", "agent_id?", "review_status?", "feedback_status?", "compliance_result?", "limit?", "offset?"]
    output: Evaluation[]
    side_effects: []

  # ---- disputes ------------------------------------------------------------
  - method: POST
    path: "/disputes"
    description: "Agent contests delivered feedback within DISPUTE_WINDOW_DAYS (7) days. OCC guarded on the parent Evaluation: expected_evaluation_version must match the version the agent last read."
    roles: [Agent]
    code: 201
    input: [evaluation_id, disputed_behavior_codes, rationale, expected_evaluation_version]
    output: Dispute
    side_effects:
      - "agent_id := evaluation.agent_id, status := SUBMITTED, round_count := 0, reviewer_evaluator_id := null"
      - "evaluation.feedback_status := DISPUTED"
      - "increments Evaluation.version by 1"
  - method: POST
    path: "/disputes/{id}/review"
    description: "A different evaluator picks up the dispute (segregation of duties: never the author of the disputed evaluation)."
    roles: [QualityEvaluator]
    code: 200
    input: []
    output: Dispute
    side_effects:
      - "status := UNDER_REVIEW, reviewer_evaluator_id := X-User-ID"
      - "increments Dispute.version by 1"
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Resolve an UNDER_REVIEW dispute. outcome IN {UPHELD, REJECTED, NEEDS_MORE_INFO}. UPHELD requires adjusted_item_scores and fires the 4-hop reversal cascade; NEEDS_MORE_INFO cycles the dispute back to the agent and is capped at MAX_DISPUTE_ROUNDS (2)."
    roles: [QualityEvaluator]
    code: 200
    input: [outcome, "adjusted_item_scores?", "outcome_note?"]
    output: Dispute
    side_effects:
      - "on UPHELD: adjusted_item_scores stored; evaluation.adjusted_weighted_score recomputed (RENORMALIZED), compliance_result recomputed, review_status := REOPENED, feedback_status := PENDING, feedback_delivered_at := null"
      - "on UPHELD, chained: interaction.compliance_hold cleared -> Agent.open_compliance_findings and quality indices recomputed -> matching CoachingPlan rows := VOIDED and Agent.coaching_state := CLEARED"
      - "on REJECTED: status := REJECTED, evaluation.feedback_status := ACKNOWLEDGED (compensation restoring the pre-dispute posture), evaluation scores untouched"
      - "on NEEDS_MORE_INFO: status := NEEDS_MORE_INFO, round_count += 1"
      - "increments Dispute.version and Evaluation.version by 1 (plus Interaction, Agent and CoachingPlan versions on the UPHELD cascade)"
  - method: POST
    path: "/disputes/{id}/respond"
    description: "Agent supplies the additional rationale a NEEDS_MORE_INFO dispute asked for, cycling it back to SUBMITTED."
    roles: [Agent]
    code: 200
    input: [additional_rationale]
    output: Dispute
    side_effects:
      - "status := SUBMITTED, rationale := rationale + additional_rationale, reviewer_evaluator_id := null"
      - "increments Dispute.version by 1"
  - method: GET
    path: "/disputes/{id}"
    description: "Read one dispute with its round_count, reviewer and adjusted scores."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor, Agent]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "Paginated list of disputes; evaluation_id, agent_id and reviewer_evaluator_id each resolve one FK's reverse reachability."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["evaluation_id?", "agent_id?", "reviewer_evaluator_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  # ---- calibration ---------------------------------------------------------
  - method: POST
    path: "/calibration-sessions"
    description: "Schedule a calibration session on one ACTIVE form and one consent-cleared interaction. benchmark_item_scores is scored with evaluation_weighted_score (RENORMALIZED) to fix the reference score every participant is measured against."
    roles: [QualityManager]
    code: 201
    input: [form_id, interaction_id, scheduled_start, scheduled_end, benchmark_item_scores]
    output: CalibrationSession
    side_effects:
      - "benchmark_weighted_score := RENORMALIZED evaluation_weighted_score over benchmark_item_scores"
      - "status := OPEN, participant_count := 0, variance_pct := null, mean_abs_deviation := null, guidance_updates_applied := 0"
  - method: POST
    path: "/calibration-sessions/{id}/start-scoring"
    description: "Move an OPEN session to SCORING so participants may submit."
    roles: [QualityManager]
    code: 200
    input: []
    output: CalibrationSession
    side_effects:
      - "status := SCORING"
      - "increments CalibrationSession.version by 1"
  - method: POST
    path: "/calibration-submissions"
    description: "One evaluator scores the calibration interaction. Immutable row (no version, no update endpoint); deviation_pct and alignment stay null until the session closes."
    roles: [QualityEvaluator]
    code: 201
    input: [session_id, item_scores]
    output: CalibrationSubmission
    side_effects:
      - "evaluator_id := X-User-ID; weighted_score := RENORMALIZED evaluation_weighted_score over item_scores"
      - "deviation_pct := null, alignment := null"
      - "session.participant_count recomputed; increments CalibrationSession.version by 1"
  - method: POST
    path: "/calibration-sessions/{id}/close"
    description: "Close a SCORING session: run calibration_variance over every submission, move evaluator standing, and optionally rewrite behavior guidance. guidance_updates is an array of objects with code and guidance_text. Fewer than MIN_PARTICIPANTS (2) submissions closes the session VOID and changes nothing else."
    roles: [QualityManager]
    code: 200
    input: ["guidance_updates?"]
    output: CalibrationSession
    side_effects:
      - "each submission gets deviation_pct and alignment; session variance_pct and mean_abs_deviation set"
      - "status := CLOSED_ALIGNED, CLOSED_VARIANT or VOID"
      - "on a non-VOID close: participating Evaluator.calibration_status moves per calibration_variance and last_deviation_pct is refreshed"
      - "on a non-VOID close with guidance_updates: each named FormBehavior.guidance_text is rewritten, its guidance_version and the form's guidance_version += 1, guidance_updates_applied := count(guidance_updates)"
      - "on a non-VOID close: every SampleSelection in status ASSIGNED held by a newly SUSPENDED evaluator and carrying no Evaluation row is released back to SELECTED"
      - "increments CalibrationSession.version, any mutated Evaluator.version, EvaluationForm.version and SampleSelection.version by 1"
  - method: GET
    path: "/calibration-sessions/{id}"
    description: "Read one calibration session with its benchmark score, participant_count, variance_pct and mean_abs_deviation."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: []
    output: CalibrationSession
    side_effects: []
  - method: GET
    path: "/calibration-sessions"
    description: "Paginated list of calibration sessions; form_id and interaction_id each resolve one FK's reverse reachability."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["form_id?", "interaction_id?", "status?", "limit?", "offset?"]
    output: CalibrationSession[]
    side_effects: []
  - method: GET
    path: "/calibration-submissions/{id}"
    description: "Read one calibration submission with its post-close deviation_pct and alignment."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: []
    output: CalibrationSubmission
    side_effects: []
  - method: GET
    path: "/calibration-submissions"
    description: "Paginated list of calibration submissions; session_id and evaluator_id each resolve one FK's reverse reachability."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor]
    code: 200
    input: ["session_id?", "evaluator_id?", "alignment?", "limit?", "offset?"]
    output: CalibrationSubmission[]
    side_effects: []

  # ---- coaching ------------------------------------------------------------
  - method: POST
    path: "/coaching-plans"
    description: "Assign a coaching plan off a scored evaluation. coaching_requirement sizes deficit_pct, escalation_tier, required_session_count and due_at. OCC guarded on the parent Agent: expected_agent_version must match. assigned_supervisor_id is an opaque operator id, not an entity FK."
    roles: [Supervisor]
    code: 201
    input: [agent_id, source_evaluation_id, assigned_supervisor_id, target_score, expected_agent_version]
    output: CoachingPlan
    side_effects:
      - "deficit_pct, escalation_tier, required_session_count and due_at computed by coaching_requirement"
      - "status := ASSIGNED, completed_session_count := 0, escalation_note := null"
      - "Agent.coaching_state := ACTIVE; any earlier CoachingPlan of the same agent in status IN {ASSIGNED, IN_PROGRESS} := VOIDED"
      - "increments Agent.version and any superseded CoachingPlan.version by 1"
  - method: POST
    path: "/coaching-plans/{id}/log-session"
    description: "Record one delivered coaching session; the first one moves the plan to IN_PROGRESS and further ones self-loop."
    roles: [Supervisor]
    code: 200
    input: [session_note, session_at]
    output: CoachingPlan
    side_effects:
      - "completed_session_count += 1; status := IN_PROGRESS"
      - "increments CoachingPlan.version by 1"
  - method: POST
    path: "/coaching-plans/{id}/complete"
    description: "Close out a coaching plan once every required session is logged and the agent carries no open compliance finding."
    roles: [Supervisor]
    code: 200
    input: []
    output: CoachingPlan
    side_effects:
      - "status := COMPLETED; Agent.coaching_state := CLEARED"
      - "increments CoachingPlan.version and Agent.version by 1"
  - method: POST
    path: "/coaching-plans/{id}/escalate"
    description: "Conditional action: escalate a plan once the logical clock passes due_at, or immediately when the agent has ESCALATION_FINDING_THRESHOLD (2) or more open compliance findings."
    roles: [QualityManager]
    code: 200
    input: [escalation_note]
    output: CoachingPlan
    side_effects:
      - "status := ESCALATED, escalation_tier := T3, escalation_note stored"
      - "increments CoachingPlan.version by 1"
  - method: GET
    path: "/coaching-plans/{id}"
    description: "Read one coaching plan with its computed deficit, tier, session requirement and due date."
    roles: [QualityManager, Supervisor, ComplianceAuditor, Agent]
    code: 200
    input: []
    output: CoachingPlan
    side_effects: []
  - method: GET
    path: "/coaching-plans"
    description: "Paginated list of coaching plans; agent_id and source_evaluation_id each resolve one FK's reverse reachability. Also the discovery channel for plans VOIDED by a cascade."
    roles: [QualityManager, Supervisor, ComplianceAuditor]
    code: 200
    input: ["agent_id?", "source_evaluation_id?", "status?", "escalation_tier?", "limit?", "offset?"]
    output: CoachingPlan[]
    side_effects: []

  # ---- test-driving surface ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window and timestamp in this domain reads. The server starts at the fixed default 2026-08-01T00:00:00Z and never falls back to wall-clock time, so an unset clock is a deterministic earliest instant."
    roles: [QualityManager, QualityEvaluator, Supervisor, ComplianceAuditor, Agent]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["the logical clock advances or rewinds to to_iso8601; no entity is mutated"]

errors:
  # ---- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource that does not belong to its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the evaluator reviewing or resolving a dispute authored the disputed evaluation"

  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong JSON type, undeclared enum member, out-of-range number, or a non-RFC3339 timestamp"

  # ---- existence -----------------------------------------------------------
  - id: ERR_FORM_NOT_FOUND
    http: 404
    condition: "form_id in the path or body matches no EvaluationForm"
  - id: ERR_AGENT_NOT_FOUND
    http: 404
    condition: "agent_id in the path or body matches no Agent"
  - id: ERR_EVALUATOR_NOT_FOUND
    http: 404
    condition: "an evaluator id in the path or body matches no Evaluator"
  - id: ERR_INTERACTION_NOT_FOUND
    http: 404
    condition: "interaction_id in the path or body matches no Interaction"
  - id: ERR_SCAN_NOT_FOUND
    http: 404
    condition: "the analytics-scan id in the path matches no AnalyticsScan"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id in the path or body matches no SamplePlan"
  - id: ERR_SELECTION_NOT_FOUND
    http: 404
    condition: "selection_id in the path or body matches no SampleSelection"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "an evaluation id in the path or body matches no Evaluation"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "session_id in the path or body matches no CalibrationSession"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "the calibration-submission id in the path matches no CalibrationSubmission"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "the dispute id in the path matches no Dispute"
  - id: ERR_COACHING_PLAN_NOT_FOUND
    http: 404
    condition: "the coaching-plan id in the path matches no CoachingPlan"

  # ---- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_INTERACTION_VERSION
    http: 412
    condition: "expected_interaction_version does not equal the Interaction's current version on POST /analytics-scans"
  - id: ERR_STALE_AGENT_VERSION
    http: 412
    condition: "expected_agent_version does not equal the Agent's current version on POST /coaching-plans"
  - id: ERR_STALE_EVALUATION_VERSION
    http: 412
    condition: "expected_evaluation_version does not equal the Evaluation's current version on POST /disputes"

  # ---- state preconditions -------------------------------------------------
  - id: ERR_FORM_NOT_DRAFT
    http: 409
    condition: "activation attempted on a form that is not DRAFT"
  - id: ERR_FORM_NOT_ACTIVE
    http: 409
    condition: "a plan or calibration session references a form that is not ACTIVE"
  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "open attempted on a plan that is not DRAFT"
  - id: ERR_PLAN_NOT_OPEN
    http: 409
    condition: "selection create, assign, exclude or close attempted on a plan that is not OPEN"
  - id: ERR_SELECTION_NOT_ASSIGNABLE
    http: 409
    condition: "assign attempted on a selection that is not SELECTED, or an evaluation opened on a selection that is not ASSIGNED"
  - id: ERR_SELECTION_TERMINAL
    http: 409
    condition: "exclude attempted on a selection already EVALUATED or EXCLUDED"
  - id: ERR_EVALUATION_NOT_EDITABLE
    http: 409
    condition: "submit attempted on an evaluation whose review_status is neither DRAFT nor REOPENED"
  - id: ERR_EVALUATION_NOT_DELIVERABLE
    http: 409
    condition: "deliver attempted on an evaluation whose review_status is neither SUBMITTED nor FINALIZED"
  - id: ERR_FEEDBACK_ALREADY_DELIVERED
    http: 409
    condition: "deliver attempted a second time while feedback_status is no longer PENDING"
  - id: ERR_FEEDBACK_NOT_DELIVERED
    http: 409
    condition: "acknowledge or dispute filed before the feedback reached the agent"
  - id: ERR_CONSENT_ALREADY_DENIED
    http: 409
    condition: "consent review or analytics scan attempted on an interaction whose recording consent is already DENIED"
  - id: ERR_SESSION_NOT_OPEN
    http: 409
    condition: "start-scoring attempted on a calibration session that is not OPEN"
  - id: ERR_SESSION_NOT_SCORING
    http: 409
    condition: "submission or close attempted on a calibration session that is not SCORING"
  - id: ERR_DISPUTE_NOT_REVIEWABLE
    http: 409
    condition: "review attempted on a dispute that is not SUBMITTED"
  - id: ERR_DISPUTE_NOT_RESOLVABLE
    http: 409
    condition: "resolve attempted on a dispute that is not UNDER_REVIEW"
  - id: ERR_DISPUTE_NOT_RESPONDABLE
    http: 409
    condition: "respond attempted on a dispute that is not NEEDS_MORE_INFO"
  - id: ERR_COACHING_PLAN_TERMINAL
    http: 409
    condition: "log-session, complete or escalate attempted on a plan already COMPLETED, ESCALATED or VOIDED"

  # ---- safety / compliance -------------------------------------------------
  - id: ERR_CONSENT_NOT_VERIFIED
    http: 422
    condition: "the interaction's recording_consent_status is PENDING or DENIED when it is pulled into the pool, scored, or calibrated"
  - id: ERR_EVALUATOR_NOT_CALIBRATED
    http: 409
    condition: "a SUSPENDED evaluator is assigned work, submits a score, or picks up a dispute"
  - id: ERR_COMPLIANCE_HOLD_OPEN
    http: 409
    condition: "coaching completion or recognition attempted while the agent still has open compliance findings"

  # ---- referential ---------------------------------------------------------
  - id: ERR_FORM_VERSION_MISMATCH
    http: 422
    condition: "an item_scores key is not a behavior code of the referenced form, or an evaluation's pinned form_id disagrees with its plan's form_id"
  - id: ERR_GUIDANCE_VERSION_STALE
    http: 409
    condition: "the plan's pinned_form_guidance_version no longer equals the form's guidance_version because a calibration session rewrote guidance"

  # ---- business constraints ------------------------------------------------
  - id: ERR_WEIGHTS_NOT_100
    http: 422
    condition: "the submitted behavior weight_pct values do not sum to exactly 100.00"
  - id: ERR_NO_COMPLIANCE_BEHAVIOR
    http: 422
    condition: "no submitted behavior is marked compliance_critical"
  - id: ERR_DUPLICATE_BEHAVIOR_CODE
    http: 422
    condition: "two behaviors of the same form share a code"
  - id: ERR_SOURCE_MIX_INVALID
    http: 422
    condition: "source_mix is missing a key, carries a negative percentage, or its three percentages do not sum to 100"
  - id: ERR_ITEM_SCORE_INCOMPLETE
    http: 422
    condition: "item_scores omits a behavior code of the form, or repeats one"
  - id: ERR_ITEM_SCORE_OUT_OF_RANGE
    http: 422
    condition: "a numeric item score falls outside 0..max_points for its behavior"
  - id: ERR_NA_NOT_ALLOWED
    http: 422
    condition: "the literal NA is submitted for a behavior whose allows_not_applicable is false, or for a compliance_critical behavior"
  - id: ERR_SOURCE_NOT_ELIGIBLE
    http: 422
    condition: "CUSTOMER_FLAGGED requested on an unflagged interaction, or TARGETED requested with no CURRENT P1/P2 analytics scan"
  - id: ERR_DUPLICATE_INTERACTION_SELECTION
    http: 409
    condition: "the interaction is already held by a live selection in the same plan"
  - id: ERR_SESSION_PARTICIPANT_DUPLICATE
    http: 409
    condition: "the acting evaluator already submitted to this calibration session"
  - id: ERR_DISPUTE_ALREADY_OPEN
    http: 409
    condition: "the evaluation already carries a dispute in SUBMITTED, UNDER_REVIEW or NEEDS_MORE_INFO"
  - id: ERR_DISPUTE_ROUND_LIMIT
    http: 422
    condition: "a further NEEDS_MORE_INFO round is requested after MAX_DISPUTE_ROUNDS (2) rounds"
  - id: ERR_SESSIONS_INCOMPLETE
    http: 422
    condition: "completion attempted with completed_session_count below required_session_count"
  - id: ERR_INSUFFICIENT_EVALUATION_HISTORY
    http: 422
    condition: "recognition attempted with fewer than RECOGNITION_MIN_EVALUATIONS (2) scored evaluations"

  # ---- temporal ------------------------------------------------------------
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "an interval's end is not strictly after its start"
  - id: ERR_PLAN_PERIOD_OVERLAP
    http: 409
    condition: "a live plan for the same form already covers a colliding closed-interval period, endpoints included"
  - id: ERR_EVALUATOR_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open review window intersects another window the evaluator already holds"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 422
    condition: "the dispute is filed more than DISPUTE_WINDOW_DAYS (7) days after feedback delivery"
  - id: ERR_ESCALATION_NOT_DUE
    http: 422
    condition: "escalation attempted before due_at with fewer than ESCALATION_FINDING_THRESHOLD (2) open compliance findings"

  # ---- capacity / quota ----------------------------------------------------
  - id: ERR_AGENT_QUOTA_EXCEEDED
    http: 422
    condition: "the agent's per-plan sampling volume, including any targeted reserve, is already consumed"
  - id: ERR_SOURCE_MIX_EXCEEDED
    http: 422
    condition: "the per-source cap for this agent inside this plan is already consumed"
  - id: ERR_EVALUATOR_CAPACITY_EXCEEDED
    http: 422
    condition: "the evaluator already holds max_open_assignments assigned selections"
  - id: ERR_RECOGNITION_THRESHOLD_NOT_MET
    http: 422
    condition: "the agent's rolling quality index is below RECOGNITION_MIN_INDEX (92.00)"

roles:
  - name: QualityManager
    description: "owns the quality program: forms and behaviors, sampling plans and selections, calibration sessions, recognition awards and coaching escalation"
    identity: "opaque"
    exclusive_operations:
      - "POST /evaluation-forms"
      - "POST /evaluation-forms/{id}/activate"
      - "POST /evaluation-forms/{id}/retire"
      - "POST /agents"
      - "POST /evaluators"
      - "POST /sample-plans"
      - "POST /sample-plans/{id}/open"
      - "POST /sample-plans/{id}/close"
      - "POST /sample-selections"
      - "POST /sample-selections/{id}/assign"
      - "POST /sample-selections/{id}/exclude"
      - "POST /calibration-sessions"
      - "POST /calibration-sessions/{id}/start-scoring"
      - "POST /calibration-sessions/{id}/close"
      - "POST /agents/{id}/recognition"
      - "POST /coaching-plans/{id}/escalate"
      - "GET /agents"
      - "GET /evaluators"
    shared_operations:
      - "POST /interactions"
      - "POST /analytics-scans"
      - "POST /_clock/set_current_utc"
      - "every GET read endpoint except GET /coaching-plans/{id} ownership reads"
  - name: QualityEvaluator
    description: "scores sampled interactions, delivers feedback and adjudicates other evaluators' disputes"
    identity: "entity_backed:Evaluator"
    exclusive_operations:
      - "POST /evaluations"
      - "POST /evaluations/{id}/submit"
      - "POST /calibration-submissions"
      - "POST /disputes/{id}/review"
      - "POST /disputes/{id}/resolve"
    shared_operations:
      - "POST /evaluations/{id}/deliver"
      - "POST /_clock/set_current_utc"
      - "GET /evaluation-forms/{id}, GET /evaluation-forms/{id}/behaviors, GET /interactions, GET /analytics-scans, GET /sample-selections, GET /evaluations, GET /calibration-sessions, GET /calibration-submissions, GET /disputes"
  - name: Agent
    description: "the coached contact-center agent: acknowledges feedback, files disputes and supplies extra rationale"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /evaluations/{id}/acknowledge"
      - "POST /disputes"
      - "POST /disputes/{id}/respond"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /agents/{id}, GET /evaluations/{id}, GET /disputes/{id}, GET /coaching-plans/{id}"
  - name: Supervisor
    description: "the agent's line manager: owns coaching plan assignment, session logging and completion"
    identity: "opaque"
    exclusive_operations:
      - "POST /coaching-plans"
      - "POST /coaching-plans/{id}/log-session"
      - "POST /coaching-plans/{id}/complete"
    shared_operations:
      - "POST /evaluations/{id}/deliver"
      - "POST /_clock/set_current_utc"
      - "GET /agents, GET /agents/{id}, GET /agents/{id}/quality-summary, GET /evaluators, GET /evaluations, GET /coaching-plans"
  - name: ComplianceAuditor
    description: "records recording-consent outcomes and disclosure capture, and reads the whole quality record for audit"
    identity: "opaque"
    exclusive_operations:
      - "POST /interactions/{id}/consent-review"
    shared_operations:
      - "POST /interactions"
      - "POST /analytics-scans"
      - "POST /_clock/set_current_utc"
      - "GET /agents/{id}/quality-summary and every other GET read endpoint"
