          assert:
            - "the 30-minute delivery succeeds: DeliveryOrder.${do_ok}.status == DELIVERED and last_excursion_minutes == 30"
            - "DeliveryOrder.${do_ok}.handling_fee_usd == 35.40"
            - "the 31-minute delivery returns error_id ERR_COLD_CHAIN_EXCURSION with HTTP 422"
            - "DeliveryOrder.${do_bad}.status is still OUT_FOR_DELIVERY"

