# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable claim §1.1–§1.7 surfaces beyond §1.8's depth
# probe. section: / claim_type: values come from references/claim-extraction-guide.md.
# Each active instance's setup_api_calls drives empty-DB -> precondition via §1.5.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Program, endpoints]
        distinguishing_aspect: "POST /wm/programs with name -> 201; response carries id, version==1, current_utc==epoch, coach_max_active_members default 50."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /wm/programs", payload: { name: "Prog" }, as: ProgramAdmin, captures: { pid: $.data.id, v: $.data.version, cu: $.data.current_utc, cap: $.data.coach_max_active_members } }
          assert:
            - "HTTP status == 201"
            - "Program.${pid}.version == 1"
            - "Program.${pid}.current_utc == 1970-01-01T00:00:00.000Z"
            - "Program.${pid}.coach_max_active_members == 50"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /wm/members/{random-uuid} -> ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /wm/members/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramAdmin, captures: { eid: $.data.error_id } }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_MEMBER_NOT_FOUND"

      - name: create_member_missing_height_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member.fields.height_cm, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /wm/members omitting required height_cm -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A program exists."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "x@x.com" }, as: ProgramAdmin, captures: { eid: $.data.error_id } }
          assert:
            - "HTTP status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: intake_bmi_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.IntakeAssessment.fields.bmi, calculations.bmi]
        distinguishing_aspect: "After submit, IntakeAssessment.bmi == 32.9 for weight 95kg/height 170cm; bmi is server-computed, never client-supplied."
        test_recipe:
          setup: ["Member height 170, DRAFT intake at 95kg."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c1@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
          trigger:
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}", captures: { b: $.data.bmi, rb: $.data.risk_band } }
          assert:
            - "IntakeAssessment.${iid}.bmi == 32.9"
            - "IntakeAssessment.${iid}.risk_band == MODERATE"

      - name: weighin_lean_mass_computed_correctly
        claim_type: Computed Fields
        grounds: [entities.WeighIn.fields.lean_mass_kg]
        distinguishing_aspect: "A weigh-in at 90kg with body_fat_pct 25 -> lean_mass_kg == 67.5 (90 * 0.75)."
        test_recipe:
          setup: ["ACTIVE enrollment, baseline 95kg."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c2@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { eid_enr: $.data.id } }
            - { call: "POST /wm/enrollments/${eid_enr}/activate", payload: {}, as: ProgramAdmin, captures: { ev: $.data.version } }
          trigger:
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${eid_enr}", weight_kg: 90, body_fat_pct: 25, counts: true, expected_enrollment_version: "${ev}" }, as: Member, as_user_id: "${mid}", captures: { lm: $.data.lean_mass_kg } }
          assert:
            - "WeighIn.${eid_enr}.latest.lean_mass_kg == 67.5"

      - name: create_member_invalid_email_type_constraint
        claim_type: Type Constraints
        grounds: [entities.PlanCatalogItem.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /wm/plans with tier 'PREMIUM' (not in {COACHING,RX,MEAL}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A program exists."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "PREMIUM", name: "X", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { eid: $.data.error_id } }
          assert:
            - "HTTP status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: weighin_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.WeighIn]
        distinguishing_aspect: "WeighIn has common_fields:false — its read carries id + created_at but no version field; there is no update endpoint."
        test_recipe:
          setup: ["ACTIVE enrollment with one weigh-in."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c3@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin, captures: { ev: $.data.version } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr}", weight_kg: 92, counts: true, expected_enrollment_version: "${ev}" }, as: Member, as_user_id: "${mid}", captures: { wid: $.data.id } }
          trigger:
            - { call: "GET /wm/weigh-ins/${wid}", payload: {}, as: ProgramAdmin, captures: { cid: $.data.id } }
          assert:
            - "WeighIn.${wid} response has id and created_at but no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_intake_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.IntakeAssessment.UNDER_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve on a DRAFT (never submitted/reviewed) intake -> ERR_INVALID_STATE (409); no baseline set."
        test_recipe:
          setup: ["A DRAFT intake exists."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c4@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
          trigger:
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "IntakeAssessment.${iid}.status == DRAFT"

      - name: terminal_rejected_intake_rejects_start_review
        claim_type: Terminal State Lockdown
        grounds: [state_machines.IntakeAssessment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal REJECTED, start-review -> ERR_INVALID_STATE (409); no transitions leave a terminal state."
        test_recipe:
          setup: ["An intake driven to REJECTED."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c5@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/reject", payload: { review_notes: "ineligible" }, as: Clinician }
          trigger:
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "IntakeAssessment.${iid}.status == REJECTED"

      - name: request_revision_without_notes_returns_invalid_request
        claim_type: Precondition Enforcement
        grounds: [state_machines.IntakeAssessment.UNDER_REVIEW_to_NEEDS_REVISION, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "request-revision with empty/absent review_notes -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An intake in UNDER_REVIEW."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c6@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
          trigger:
            - { call: "POST /wm/intake-assessments/${iid}/request-revision", payload: { review_notes: "" }, as: Clinician, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: revoke_rx_while_enrollment_active_blocked
        claim_type: guarded transitions
        grounds: [state_machines.RxAuthorization.ISSUED_to_REVOKED, "errors[ERR_ENROLLMENT_ACTIVE_RX_LOCKED]"]
        distinguishing_aspect: "revoke of an ISSUED Rx whose RX enrollment is clinically ACTIVE -> ERR_ENROLLMENT_ACTIVE_RX_LOCKED (409)."
        test_recipe:
          setup: ["RX enrollment ACTIVE relying on an ISSUED Rx (member 95kg BMI 32.9, eligibility APPROVED)."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "RX", name: "Rx", monthly_fee_cents: 9000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c7@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "GET /wm/enrollments/${enr}", payload: {}, as: ProgramAdmin, captures: { ev: $.data.version } }
            - { call: "POST /wm/eligibility-determinations", payload: { member_id: "${mid}", enrollment_id: "${enr}" }, as: Clinician, captures: { did: $.data.id } }
            - { call: "POST /wm/eligibility-determinations/${did}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/rx-authorizations", payload: { enrollment_id: "${enr}", eligibility_determination_id: "${did}" }, as: Clinician, captures: { rid: $.data.id } }
            - { call: "POST /wm/rx-authorizations/${rid}/issue", payload: { expected_enrollment_version: "${ev}" }, as: Clinician }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /wm/rx-authorizations/${rid}/revoke", payload: {}, as: Clinician, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_ENROLLMENT_ACTIVE_RX_LOCKED"
            - "RxAuthorization.${rid}.status == ISSUED"

      - name: cannot_void_initial_invoice
        claim_type: Precondition Enforcement
        grounds: [state_machines.Invoice.ISSUED_to_VOID, "errors[ERR_CANNOT_VOID_INITIAL_INVOICE]"]
        distinguishing_aspect: "void on the cycle-0 (cycle_index 0) invoice -> ERR_CANNOT_VOID_INITIAL_INVOICE (409)."
        test_recipe:
          setup: ["ACTIVE enrollment with cycle-0 ISSUED invoice."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c8@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin }
            - { call: "GET /wm/invoices?enrollment_id=${enr}", payload: {}, as: BillingAgent, captures: { inv0: "$.data[0].id" } }
          trigger:
            - { call: "POST /wm/invoices/${inv0}/void", payload: {}, as: BillingAgent, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_CANNOT_VOID_INITIAL_INVOICE"

      - name: invalid_transition_enrollment_activate_already_active
        claim_type: Idempotency
        grounds: [state_machines.Enrollment.PENDING_CLINICAL_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "activate twice: second activate on an already-ACTIVE enrollment -> ERR_INVALID_STATE (409); no duplicate cycle-0 invoice."
        test_recipe:
          setup: ["ACTIVE enrollment."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c9@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Enrollment.${enr}.cycles_billed == 1"

  # ===========================================================================
  - section: calculations
    instances:
      - name: goal_progress_50_percent_correct
        claim_type: Correct Result
        grounds: [calculations.goal_progress_pct, entities.Goal.fields.progress_pct]
        distinguishing_aspect: "baseline 95, target 85, latest 90 -> progress_pct == 50.0 (span 10, lost 5)."
        test_recipe:
          setup: ["ACTIVE enrollment baseline 95, PRIMARY goal target 85, one counted weigh-in 90."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c10@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin, captures: { ev: $.data.version } }
            - { call: "POST /wm/goals", payload: { enrollment_id: "${enr}", kind: "PRIMARY", target_weight_kg: 85 }, as: ProgramAdmin, captures: { gid: $.data.id } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr}", weight_kg: 90, counts: true, expected_enrollment_version: "${ev}" }, as: Coach }
          trigger:
            - { call: "GET /wm/goals/${gid}", payload: {}, as: ProgramAdmin, captures: { pp: $.data.progress_pct } }
          assert:
            - "Goal.${gid}.progress_pct == 50.0"
            - "Goal.${gid}.status == OPEN"

      - name: uncounted_weighin_excluded_from_progress
        claim_type: Input Set Filtering
        grounds: [calculations.scale_progress_pct, entities.WeighIn.fields.counts]
        distinguishing_aspect: "A weigh-in with counts==false does NOT update member.latest_weight_kg/scale_progress_pct; they stay at their counted-only value."
        test_recipe:
          setup: ["ACTIVE enrollment baseline 95; one counted weigh-in 90 then one uncounted weigh-in 80."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c11@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin, captures: { ev: $.data.version } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr}", weight_kg: 90, counts: true, expected_enrollment_version: "${ev}" }, as: Coach }
            - { call: "GET /wm/enrollments/${enr}", payload: {}, as: ProgramAdmin, captures: { ev2: $.data.version } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr}", weight_kg: 80, counts: false, expected_enrollment_version: "${ev2}" }, as: Coach }
          trigger:
