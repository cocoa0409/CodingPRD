  # ----------------------------------------------------- Carrier pickups
  - method: POST
    path: "/fulfillment-network/stores/{store_id}/carrier-pickups"
    description: "Schedule a carrier pickup window at a node."
    roles: [CarrierCoordinator, NetworkPlanner]
    code: 201
    input: [carrier_code, window_start_utc, window_end_utc, parcel_capacity]
    output: CarrierPickup
    side_effects:
      - "status = SCHEDULED, reserved_parcels = 0"
      - "runs calculations.carrier_pickup_window_conflict against the node's SCHEDULED and CLOSED windows"

  - method: GET
    path: "/fulfillment-network/carrier-pickups"
    description: "List pickups, filterable by node (FK reverse-reachability for CarrierPickup.store_id)."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["store_id?", "status?", "carrier_code?", "limit?", "offset?"]
    output: CarrierPickup[]
