scenario: "generate task hard than expert level! 1152. Tugboat & Harbor Assist Services (Moran Towing style operator): job order by vessel & maneuver requirement, tug assignment & horsepower matching, tariff/rate schedule & standby time, pilot coordination & scheduling windows, crew rotation & watch schedules, towing gear inspection & failure incident, weather/current restriction & job cancellation, damage claim & liability limitation"
domain_name: "tugboat-harbor-assist"
api_prefix: "/api"
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Vessel display name
      - name: imo_number
        type: string
        source: input
        description: IMO number; unique across vessels
        constraints: unique
      - name: deadweight_tonnage
        type: integer
        source: input
        description: Deadweight tonnage (DWT); must be > 0
      - name: loa_meters
        type: number
        source: input
        description: Length overall in meters; must be > 0
      - name: outstanding_billed_cents
        type: integer
        source: computed
        description: max(0, sum of Invoice.total_cents over this vessel's jobs with Invoice.status IN {PROVISIONAL, FINALIZED} minus sum of DamageClaim.payout_cents over this vessel's claims with status == SETTLED)
        default: 0

  - name: Tug
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Tug display name
      - name: bollard_pull_tons
        type: number
        source: input
        description: Rated bollard pull in metric tons; must be > 0
      - name: horsepower
        type: integer
        source: input
        description: Installed horsepower; must be > 0
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Charter hourly rate in cents; must be >= 0
      - name: insured_value_cents
        type: integer
        source: input
        description: Insured hull value in cents; used by liability cap calculation
      - name: home_port
        type: string
        source: input
        description: Home port name
      - name: operational_status
        type: enum
        source: system
        description: Lifecycle state machine state
        constraints: "one of {AVAILABLE, RESTRICTED, OUT_OF_SERVICE}"
        default: AVAILABLE

  - name: Pilot
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Pilot display name
      - name: license_class
        type: enum
        source: input
        description: "Harbor pilot license class; CLASS_I highest, CLASS_III lowest"
        constraints: "one of {CLASS_I, CLASS_II, CLASS_III}"
      - name: active
        type: boolean
        source: input
        description: Whether the pilot is available for booking
        default: true

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Crew member full name
      - name: crew_role
        type: enum
        source: input
        description: Shipboard role
        constraints: "one of {CAPTAIN, MATE, ENGINEER, DECKHAND}"
      - name: max_watch_hours
        type: integer
        source: input
        description: Maximum continuous watch hours permitted
        default: 12

  - name: TariffRate
    parent: null
    common_fields: true
    fields:
      - name: tariff_code
        type: string
        source: input
        description: Unique tariff code
        constraints: unique
      - name: maneuver_type
        type: enum
        source: input
        description: Maneuver this tariff prices
        constraints: "one of {DOCKING, UNDOCKING, SHIFTING, ESCORT, TOWAGE}"
      - name: base_fee_cents
        type: integer
        source: input
        description: Flat base fee per job in cents; >= 0
      - name: free_standby_minutes
        type: integer
        source: input
        description: Standby minutes included free before billing starts
        default: 30
      - name: standby_block_minutes
        type: integer
        source: input
        description: Billing block size for standby time
        default: 15
      - name: standby_block_rate_cents
        type: integer
        source: input
        description: Charge per standby block in cents
      - name: weather_surcharge_pct
        type: number
        source: input
        description: Surcharge fraction (e.g. 0.15) applied to subtotal when the job experienced a weather hold
        default: 0
      - name: effective_from
        type: datetime
        source: input
        description: Start of tariff effectiveness window (inclusive)
      - name: effective_to
        type: datetime
        source: input
        description: End of tariff effectiveness window (inclusive)

  - name: JobOrder
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the vessel ordering the assist job"
      - name: tariff_rate_id
        type: string
        source: input
        description: "FK -> TariffRate.id; tariff used to price the job"
      - name: maneuver_type
        type: enum
        source: input
        description: Requested maneuver
        constraints: "one of {DOCKING, UNDOCKING, SHIFTING, ESCORT, TOWAGE}"
      - name: scheduled_start
        type: datetime
        source: input
        description: Scheduled job window start (UTC)
      - name: scheduled_end
        type: datetime
        source: input
        description: Scheduled job window end (UTC); must be strictly after scheduled_start
      - name: required_bollard_pull_tons
        type: number
        source: computed
        description: Computed at create/amend by calculation required_bollard_pull
      - name: actual_start
        type: datetime
        source: system
        description: Stamped from logical clock on start transition; null until started
      - name: actual_end
        type: datetime
        source: system
        description: Stamped from logical clock on complete transition; null until completed
      - name: had_weather_hold
        type: boolean
        source: system
        description: Set true when the job ever enters ON_HOLD; drives weather surcharge
        default: false
      - name: needs_reassignment
        type: boolean
        source: system
        description: Set true when a tug-failure cascade strips confirmed assignments; cleared on successful dispatch
        default: false
      - name: cancel_reason
        type: string
        source: input
        description: Optional free-text reason recorded on cancel
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        constraints: "one of {REQUESTED, CONFIRMED, DISPATCHED, ON_HOLD, IN_PROGRESS, COMPLETED, INVOICED, CANCELLED}"
        default: REQUESTED

  - name: TugAssignment
    parent: null
    common_fields: true
    fields:
      - name: job_order_id
        type: string
        source: input
        description: "FK -> JobOrder.id; the job this assignment serves"
      - name: tug_id
        type: string
        source: input
        description: "FK -> Tug.id; the assigned tug"
      - name: window_start
        type: datetime
        source: input
        description: Occupation window start on the tug (half-open interval)
      - name: window_end
        type: datetime
        source: input
        description: Occupation window end on the tug (half-open interval); strictly after window_start
      - name: participated
        type: boolean
        source: system
        description: Set true when the assignment goes ACTIVE at job start; only participated assignments bill
        default: false
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        constraints: "one of {PROPOSED, CONFIRMED, ACTIVE, RELEASED, SUPERSEDED}"
        default: PROPOSED

  - name: PilotBooking
    parent: null
    common_fields: true
    fields:
      - name: job_order_id
        type: string
        source: input
        description: "FK -> JobOrder.id; the job this booking serves"
      - name: pilot_id
        type: string
        source: input
        description: "FK -> Pilot.id; the booked pilot"
      - name: window_start
        type: datetime
        source: input
        description: Booking window start
      - name: window_end
        type: datetime
        source: input
        description: Booking window end; strictly after window_start
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        constraints: "one of {REQUESTED, CONFIRMED, BOARDED, COMPLETED, NO_SHOW, CANCELLED, SUPERSEDED}"
        default: REQUESTED

  - name: WatchRotation
    parent: null
    common_fields: true
    fields:
      - name: tug_assignment_id
        type: string
        source: input
        description: "FK -> TugAssignment.id; the assignment this watch serves"
      - name: crew_member_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the crew member standing watch"
      - name: watch_start
        type: datetime
        source: input
        description: Watch start (UTC)
      - name: watch_end
        type: datetime
        source: input
        description: Watch end (UTC); strictly after watch_start

  - name: GearInspection
    parent: null
    common_fields: false
    fields:
      - name: tug_id
        type: string
        source: input
        description: "FK -> Tug.id; inspected tug"
      - name: inspection_item
        type: enum
        source: input
        description: Towing gear item inspected
        constraints: "one of {TOWING_HOOK, TOW_LINE, WINCH, BITTS}"
      - name: outcome
        type: enum
        source: input
        description: Inspection outcome
        constraints: "one of {PASSED, FAILED}"
      - name: inspected_at
        type: datetime
        source: input
        description: When the inspection occurred (UTC)
      - name: next_due_at
        type: datetime
        source: input
        description: When the next inspection of this item falls due (UTC)
      - name: deficiency_notes
        type: string
        source: input
        description: Optional notes on deficiencies found

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: tug_id
        type: string
        source: input
        description: "FK -> Tug.id; tug involved in the incident"
      - name: job_order_id
        type: string
        source: input
        description: "FK -> JobOrder.id; optional link to the job being worked when the incident occurred"
      - name: incident_type
        type: enum
        source: input
        description: Incident classification
        constraints: "one of {GEAR_FAILURE, CONTACT_DAMAGE, POLLUTION, PERSONAL_INJURY}"
      - name: severity
        type: enum
        source: input
        description: "Severity; MAJOR/CRITICAL drive the tug OUT_OF_SERVICE"
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: occurred_at
        type: datetime
        source: input
        description: When the incident occurred (UTC)
      - name: description
        type: string
        source: input
        description: Free-text description
      - name: resolution_notes
        type: string
        source: input
        description: Recorded on resolve
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        constraints: "one of {REPORTED, UNDER_INVESTIGATION, RESOLVED}"
        default: REPORTED

  - name: WeatherRestriction
    parent: null
    common_fields: true
    fields:
      - name: restriction_type
        type: enum
        source: input
        description: Restriction driver
        constraints: "one of {WIND, CURRENT, VISIBILITY}"
      - name: threshold_value
        type: number
        source: input
        description: Measured value (knots for WIND/CURRENT, meters for VISIBILITY) that motivated the restriction
      - name: port_area
        type: string
        source: input
        description: Port area the restriction applies to
      - name: effective_start
        type: datetime
        source: input
        description: Restriction window start (half-open)
      - name: effective_end
        type: datetime
        source: input
        description: Restriction window end (half-open); strictly after effective_start
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        constraints: "one of {ACTIVE, LIFTED}"
        default: ACTIVE

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: job_order_id
        type: string
        source: system
        description: "FK -> JobOrder.id; invoice is auto-created when the job completes"
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        constraints: "one of {PROVISIONAL, FINALIZED, VOID}"
        default: PROVISIONAL
      - name: variant_basis
        type: enum
        source: computed
        description: "SCHEDULED for PROVISIONAL invoices (scheduled times, zero standby), ACTUAL for FINALIZED invoices (actual timestamps)"
        constraints: "one of {SCHEDULED, ACTUAL}"
      - name: base_fee_cents
        type: integer
        source: computed
        description: Tariff base fee line
      - name: tug_hire_cents
        type: integer
        source: computed
        description: Sum of per-assignment tug hire lines (each line rounded half-up to whole cents BEFORE summation)
      - name: standby_minutes
        type: integer
        source: computed
        description: Standby minutes recognized (0 under SCHEDULED basis)
      - name: standby_cents
        type: integer
        source: computed
        description: Standby charge line
      - name: weather_surcharge_cents
        type: integer
        source: computed
        description: Weather surcharge line (0 unless job.had_weather_hold)
      - name: total_cents
        type: integer
        source: computed
        description: Sum of all rounded lines

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; incident being claimed on"
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; claimant vessel"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Claimed amount in cents; > 0
      - name: liability_variant
        type: enum
        source: computed
        description: "PER_VOYAGE when the incident's job has a FINALIZED invoice at claim-creation time, else PER_INCIDENT"
        constraints: "one of {PER_INCIDENT, PER_VOYAGE}"
      - name: liability_cap_cents
        type: integer
        source: computed
        description: Liability cap computed per liability_variant
      - name: deductible_cents
        type: integer
        source: computed
        description: 10% of min(claimed_amount_cents, liability_cap_cents), rounded half-up
      - name: payout_cents
        type: integer
        source: computed
        description: min(claimed_amount_cents, liability_cap_cents) minus deductible_cents
      - name: reviewer_notes
        type: string
        source: input
        description: Notes recorded by the claims adjuster on review actions
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        constraints: "one of {FILED, UNDER_REVIEW, ACCEPTED, DENIED, SETTLED}"
        default: FILED

state_machines:
  - entity: JobOrder
    initial_state: REQUESTED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/job-orders/{id}/confirm"
        actor: PortDispatcher
        preconditions:
          - "No WeatherRestriction with status == ACTIVE overlaps [scheduled_start, scheduled_end) (half-open intersection)"
          - "TariffRate referenced by tariff_rate_id is effective at scheduled_start (effective_from <= scheduled_start <= effective_to)"
        side_effects:
          - "JobOrder.version increments by 1"
      - from: REQUESTED
        to: REQUESTED
        trigger: "POST /api/job-orders/{id}/amend"
        actor: VesselAgent
        preconditions:
          - "expected_job_order_version equals current JobOrder.version (OCC)"
        side_effects:
          - "Applies provided field updates (scheduled_start, scheduled_end, maneuver_type, tariff_rate_id)"
          - "Recomputes required_bollard_pull_tons via calculation required_bollard_pull"
          - "JobOrder.version increments by 1"
      - from: CONFIRMED
        to: REQUESTED
        trigger: "POST /api/job-orders/{id}/amend"
        actor: VesselAgent
        preconditions:
          - "expected_job_order_version equals current JobOrder.version (OCC)"
        side_effects:
          - "Applies provided field updates and recomputes required_bollard_pull_tons"
          - "All TugAssignment rows with job_order_id == this job and status == CONFIRMED become SUPERSEDED"
          - "All PilotBooking rows with job_order_id == this job and status IN {REQUESTED, CONFIRMED} become SUPERSEDED"
          - "JobOrder.version increments by 1"
      - from: CONFIRMED
        to: DISPATCHED
        trigger: "POST /api/job-orders/{id}/dispatch"
        actor: PortDispatcher
        preconditions:
          - "Sum of Tug.bollard_pull_tons over TugAssignment rows with job_order_id == this job and status == CONFIRMED is >= JobOrder.required_bollard_pull_tons"
          - "At least one PilotBooking with job_order_id == this job has status == CONFIRMED"
          - "No WeatherRestriction with status == ACTIVE overlaps [scheduled_start, scheduled_end)"
        side_effects:
          - "needs_reassignment set to false"
          - "JobOrder.version increments by 1"
      - from: DISPATCHED
        to: ON_HOLD
        trigger: "system: a WeatherRestriction is created with status ACTIVE whose [effective_start, effective_end) overlaps this job's [scheduled_start, scheduled_end)"
        actor: system
        preconditions:
          - "JobOrder.status == DISPATCHED at restriction creation time"
        side_effects:
          - "had_weather_hold set to true"
          - "JobOrder.version increments by 1"
      - from: ON_HOLD
        to: DISPATCHED
        trigger: "system: a WeatherRestriction is lifted (POST /api/weather-restrictions/{id}/lift) and no other ACTIVE restriction still overlaps this job's window"
        actor: system
        preconditions:
          - "After the lift, zero WeatherRestriction rows with status == ACTIVE overlap [scheduled_start, scheduled_end)"
        side_effects:
          - "JobOrder.version increments by 1"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /api/job-orders/{id}/start"
        actor: PortDispatcher
        preconditions:
          - "JobOrder.status == DISPATCHED"
        side_effects:
          - "actual_start stamped from logical clock"
          - "All TugAssignment rows with job_order_id == this job and status == CONFIRMED become ACTIVE with participated = true"
          - "JobOrder.version increments by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/job-orders/{id}/complete"
        actor: PortDispatcher
        preconditions:
          - "JobOrder.status == IN_PROGRESS"
        side_effects:
          - "actual_end stamped from logical clock"
          - "All TugAssignment rows with job_order_id == this job and status == ACTIVE become RELEASED"
          - "All PilotBooking rows with job_order_id == this job and status == BOARDED become COMPLETED"
          - "All PilotBooking rows with job_order_id == this job and status == CONFIRMED become NO_SHOW"
          - "An Invoice is auto-created for this job with status PROVISIONAL and variant_basis SCHEDULED (calculation invoice_charge)"
          - "Vessel.outstanding_billed_cents recomputed via calculation vessel_outstanding (hop 2 of the complete cascade)"
          - "JobOrder.version increments by 1"
      - from: COMPLETED
        to: INVOICED
        trigger: "system: the job's Invoice transitions PROVISIONAL -> FINALIZED via POST /api/invoices/{id}/finalize"
        actor: system
        preconditions:
          - "Invoice.status == PROVISIONAL and finalize OCC check passes"
        side_effects:
          - "JobOrder.version increments by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/job-orders/{id}/cancel"
        actor: "VesselAgent | PortDispatcher"
        preconditions: []
        side_effects:
          - "cancel_reason recorded if provided"
          - "All TugAssignment rows with job_order_id == this job and status IN {PROPOSED, CONFIRMED} become RELEASED"
          - "All PilotBooking rows with job_order_id == this job and status IN {REQUESTED, CONFIRMED} become CANCELLED"
          - "JobOrder.version increments by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/job-orders/{id}/cancel"
        actor: "VesselAgent | PortDispatcher"
        preconditions: []
        side_effects:
          - "cancel_reason recorded if provided"
          - "All TugAssignment rows with job_order_id == this job and status IN {PROPOSED, CONFIRMED} become RELEASED"
          - "All PilotBooking rows with job_order_id == this job and status IN {REQUESTED, CONFIRMED} become CANCELLED"
          - "JobOrder.version increments by 1"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /api/job-orders/{id}/cancel"
        actor: "VesselAgent | PortDispatcher"
        preconditions: []
        side_effects:
          - "cancel_reason recorded if provided"
          - "All TugAssignment rows with job_order_id == this job and status IN {PROPOSED, CONFIRMED} become RELEASED"
          - "All PilotBooking rows with job_order_id == this job and status IN {REQUESTED, CONFIRMED} become CANCELLED"
          - "JobOrder.version increments by 1"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /api/job-orders/{id}/cancel"
        actor: "VesselAgent | PortDispatcher"
        preconditions: []
        side_effects:
          - "cancel_reason recorded if provided"
          - "All TugAssignment rows with job_order_id == this job and status IN {PROPOSED, CONFIRMED} become RELEASED"
          - "All PilotBooking rows with job_order_id == this job and status IN {REQUESTED, CONFIRMED} become CANCELLED"
          - "JobOrder.version increments by 1"

  - entity: TugAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /api/tug-assignments/{id}/confirm"
        actor: TugCaptain
        preconditions:
          - "Acting TugCaptain's X-User-ID equals this assignment's tug_id"
          - "Tug.operational_status == AVAILABLE"
          - "Most recent GearInspection for the tug (ordered by inspected_at DESC, tie-break created_at DESC) has outcome == PASSED and next_due_at strictly after current logical clock"
        side_effects:
          - "TugAssignment.version increments by 1"
      - from: CONFIRMED
        to: ACTIVE
        trigger: "system: owning JobOrder transitions DISPATCHED -> IN_PROGRESS"
        actor: system
        preconditions: []
        side_effects:
          - "participated set to true"
          - "TugAssignment.version increments by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "system: owning JobOrder transitions IN_PROGRESS -> COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "TugAssignment.version increments by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /api/tug-assignments/{id}/release OR system cascade from owning JobOrder cancel"
        actor: "PortDispatcher | system"
        preconditions: []
        side_effects:
          - "TugAssignment.version increments by 1"
      - from: PROPOSED
        to: RELEASED
        trigger: "system cascade from owning JobOrder cancel"
        actor: system
        preconditions: []
        side_effects:
          - "TugAssignment.version increments by 1"
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system cascade: owning JobOrder amended from CONFIRMED, OR assigned Tug enters RESTRICTED/OUT_OF_SERVICE while this assignment's window_start is strictly after the current logical clock"
        actor: system
        preconditions: []
        side_effects:
          - "TugAssignment.version increments by 1"

  - entity: PilotBooking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/pilot-bookings/{id}/confirm"
        actor: Pilot
        preconditions:
          - "Acting Pilot's X-User-ID equals this booking's pilot_id"
        side_effects:
          - "PilotBooking.version increments by 1"
      - from: CONFIRMED
        to: BOARDED
        trigger: "POST /api/pilot-bookings/{id}/board"
        actor: Pilot
        preconditions:
          - "Acting Pilot's X-User-ID equals this booking's pilot_id"
          - "Owning JobOrder.status IN {DISPATCHED, IN_PROGRESS}"
        side_effects:
          - "PilotBooking.version increments by 1"
      - from: BOARDED
        to: COMPLETED
        trigger: "system: owning JobOrder transitions IN_PROGRESS -> COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "PilotBooking.version increments by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system: owning JobOrder transitions IN_PROGRESS -> COMPLETED while this booking was never BOARDED"
        actor: system
        preconditions: []
        side_effects:
          - "PilotBooking.version increments by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system cascade from owning JobOrder cancel"
        actor: system
        preconditions: []
        side_effects:
          - "PilotBooking.version increments by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system cascade from owning JobOrder cancel"
        actor: system
        preconditions: []
        side_effects:
          - "PilotBooking.version increments by 1"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system cascade from owning JobOrder amend-from-CONFIRMED"
        actor: system
        preconditions: []
        side_effects:
          - "PilotBooking.version increments by 1"
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system cascade from owning JobOrder amend-from-CONFIRMED"
        actor: system
        preconditions: []
        side_effects:
          - "PilotBooking.version increments by 1"

  - entity: Tug
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESTRICTED
        trigger: "system: POST /api/gear-inspections records outcome == FAILED for this tug"
        actor: system
        preconditions: []
        side_effects:
          - "Every TugAssignment with tug_id == this tug, status == CONFIRMED, and window_start strictly after current logical clock becomes SUPERSEDED (hop 2)"
          - "For each such superseded assignment, its JobOrder (if status == CONFIRMED) becomes REQUESTED with needs_reassignment = true (hop 3)"
          - "Tug.version increments by 1"
      - from: RESTRICTED
        to: AVAILABLE
        trigger: "system: POST /api/gear-inspections records outcome == PASSED and the most recent inspection per inspection_item is now PASSED for every item"
        actor: system
        preconditions:
          - "No Incident for this tug with status IN {REPORTED, UNDER_INVESTIGATION} and severity IN {MAJOR, CRITICAL}"
        side_effects:
          - "Tug.version increments by 1"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "system: POST /api/incidents records severity IN {MAJOR, CRITICAL} for this tug"
        actor: system
        preconditions: []
        side_effects:
          - "Every TugAssignment with tug_id == this tug, status == CONFIRMED, and window_start strictly after current logical clock becomes SUPERSEDED"
          - "For each such superseded assignment, its JobOrder (if status == CONFIRMED) becomes REQUESTED with needs_reassignment = true"
          - "Tug.version increments by 1"
      - from: RESTRICTED
        to: OUT_OF_SERVICE
        trigger: "system: POST /api/incidents records severity IN {MAJOR, CRITICAL} for this tug"
        actor: system
        preconditions: []
        side_effects:
          - "Every TugAssignment with tug_id == this tug, status == CONFIRMED, and window_start strictly after current logical clock becomes SUPERSEDED"
          - "For each such superseded assignment, its JobOrder (if status == CONFIRMED) becomes REQUESTED with needs_reassignment = true"
          - "Tug.version increments by 1"
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "system: POST /api/incidents/{id}/resolve resolves the last unresolved MAJOR/CRITICAL incident and every inspection_item's latest GearInspection outcome is PASSED"
        actor: system
        preconditions:
          - "After this resolve, zero Incident rows for this tug have status IN {REPORTED, UNDER_INVESTIGATION} and severity IN {MAJOR, CRITICAL}"
          - "Latest GearInspection per inspection_item (inspected_at DESC, tie created_at DESC) all PASSED"
        side_effects:
          - "Tug.version increments by 1"
      - from: OUT_OF_SERVICE
        to: RESTRICTED
        trigger: "system: POST /api/incidents/{id}/resolve resolves the last unresolved MAJOR/CRITICAL incident but at least one inspection_item's latest GearInspection outcome is FAILED"
        actor: system
        preconditions:
          - "After this resolve, zero unresolved MAJOR/CRITICAL incidents remain for this tug"
        side_effects:
          - "Tug.version increments by 1"

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /api/damage-claims creates a claim referencing this incident"
        actor: system
        preconditions:
          - "Incident.status == REPORTED (claim creation against UNDER_INVESTIGATION is allowed but does not re-transition; RESOLVED is rejected with ERR_INCIDENT_ALREADY_RESOLVED)"
        side_effects:
          - "Incident.version increments by 1"
      - from: REPORTED
        to: RESOLVED
        trigger: "POST /api/incidents/{id}/resolve"
        actor: MarineSurveyor
        preconditions: []
        side_effects:
          - "resolution_notes recorded"
          - "Tug.operational_status recomputed per Tug state machine (OUT_OF_SERVICE -> AVAILABLE/RESTRICTED)"
          - "Incident.version increments by 1"
      - from: UNDER_INVESTIGATION
        to: RESOLVED
        trigger: "POST /api/incidents/{id}/resolve"
        actor: MarineSurveyor
        preconditions: []
        side_effects:
          - "resolution_notes recorded"
          - "Tug.operational_status recomputed per Tug state machine"
          - "Incident.version increments by 1"

  - entity: WeatherRestriction
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /api/weather-restrictions/{id}/lift"
        actor: PortAdmin
        preconditions: []
        side_effects:
          - "Every JobOrder with status == ON_HOLD whose [scheduled_start, scheduled_end) no longer overlaps any ACTIVE WeatherRestriction returns to DISPATCHED"
          - "WeatherRestriction.version increments by 1"

  - entity: Invoice
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /api/invoices/{id}/finalize"
        actor: PortDispatcher
        preconditions:
          - "expected_invoice_version equals current Invoice.version (OCC)"
          - "Owning JobOrder.status == COMPLETED"
        side_effects:
          - "All charge lines recomputed under variant_basis ACTUAL (calculation invoice_charge)"
          - "variant_basis set to ACTUAL"
          - "Owning JobOrder transitions COMPLETED -> INVOICED"
          - "Vessel.outstanding_billed_cents recomputed via calculation vessel_outstanding"
          - "Invoice.version increments by 1"
      - from: PROVISIONAL
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: PortAdmin
        preconditions: []
        side_effects:
          - "Vessel.outstanding_billed_cents recomputed (this invoice excluded)"
          - "Invoice.version increments by 1"
      - from: FINALIZED
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: PortAdmin
        preconditions: []
        side_effects:
          - "Vessel.outstanding_billed_cents recomputed (this invoice excluded)"
          - "Invoice.version increments by 1"

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/damage-claims/{id}/review with action == START_REVIEW"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "reviewer_notes recorded if provided"
          - "DamageClaim.version increments by 1"
      - from: UNDER_REVIEW
        to: FILED
        trigger: "POST /api/damage-claims/{id}/review with action == REQUEST_INFO"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "reviewer_notes recorded if provided"
          - "DamageClaim.version increments by 1"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /api/damage-claims/{id}/review with action == ACCEPT"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "DamageClaim.version increments by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/damage-claims/{id}/review with action == DENY"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "DamageClaim.version increments by 1"
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /api/damage-claims/{id}/settle"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "Vessel.outstanding_billed_cents recomputed via calculation vessel_outstanding (settled payout now subtracts)"
          - "DamageClaim.version increments by 1"

concurrency_rules:
  - rule_id: job-amend-stale-version
    parent_entity: JobOrder
    write_endpoint: "POST /api/job-orders/{id}/amend"
    occ_field: "expected_job_order_version"
    description: |
      Amending a JobOrder whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just amended the schedule (which legitimately supersedes the prior
      schedule and its confirmed assignments) and the current writer's view of
      the job is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: tug-assignment-create-stale-job
    parent_entity: JobOrder
    write_endpoint: "POST /api/tug-assignments"
    occ_field: "expected_job_order_version"
    description: |
      Creating a TugAssignment against a JobOrder whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just amended the job's schedule or window and
      the assignment would otherwise be planned against a stale window.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: invoice-finalize-stale-version
    parent_entity: Invoice
    write_endpoint: "POST /api/invoices/{id}/finalize"
    occ_field: "expected_invoice_version"
    description: |
      Finalizing an Invoice whose version has advanced since the client last
      observed it is rejected. This captures the case where the invoice's
      charge lines were recomputed after the client read them and the client's
      view of the provisional totals is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: required_bollard_pull
    trigger: "JobOrder creation and every successful amend (stored on JobOrder.required_bollard_pull_tons)"
    algorithm: threshold
    formula: |
      base = vessel.deadweight_tonnage * MANEUVER_FACTOR[job.maneuver_type] / 1000
      if vessel.loa_meters > LOA_SURCHARGE_THRESHOLD_M:
          base = base * LOA_MULTIPLIER
      required_bollard_pull_tons = max(MIN_BOLLARD_PULL_TONS, round_half_up(base, 1))
    input_set: "The JobOrder's vessel (deadweight_tonnage, loa_meters) and maneuver_type"
    constants:
      MANEUVER_FACTOR: {DOCKING: 1.5, UNDOCKING: 1.2, SHIFTING: 1.0, ESCORT: 0.8, TOWAGE: 2.0}
      LOA_SURCHARGE_THRESHOLD_M: 200
      LOA_MULTIPLIER: 1.25
      MIN_BOLLARD_PULL_TONS: 20.0
    precision: "1 decimal place, round_half_up"

  - name: invoice_charge
    trigger: "Invoice auto-creation at JobOrder complete (variant SCHEDULED) and Invoice finalize (variant ACTUAL, full recompute)"
    algorithm: tiered_pricing
    formula: |
      # PINNED rounding order: every line is rounded half-up to whole cents BEFORE summation.
      basis_start = job.scheduled_start if variant == SCHEDULED else job.actual_start
      line_base = tariff.base_fee_cents
      tug_hire_cents = 0
      for each TugAssignment a of the job with a.participated == true:
          hours_a = round_half_up((a.window_end - a.window_start) / 3600 seconds, 2)
          line_a = round_half_up(tug(a.tug_id).hourly_rate_cents * hours_a)   # per-line rounding pinned
          tug_hire_cents += line_a
      if variant == SCHEDULED:
          standby_minutes = 0
      else:
          standby_minutes = max(0, minutes_between(job.scheduled_start, job.actual_start))
      billable = max(0, standby_minutes - tariff.free_standby_minutes)
      blocks = ceil(billable / tariff.standby_block_minutes)
      standby_cents = blocks * tariff.standby_block_rate_cents
      subtotal = line_base + tug_hire_cents + standby_cents
      weather_surcharge_cents = round_half_up(subtotal * tariff.weather_surcharge_pct) if job.had_weather_hold else 0
      total_cents = subtotal + weather_surcharge_cents
    input_set: "JobOrder (scheduled/actual times, had_weather_hold), its TariffRate, its TugAssignment rows with participated == true joined to their Tug hourly_rate_cents"
    constants: {}
    precision: "integer cents; hours rounded half-up to 2 decimals before multiplication; each money line rounded half-up to whole cents before summation (pinned order — sum-then-round is a rejected alternative)"
    variants:
      - name: provisional
        when: "Invoice auto-created at job completion"
        difference: "variant_basis SCHEDULED: uses scheduled times and standby_minutes = 0"
      - name: final
        when: "POST /api/invoices/{id}/finalize"
        difference: "variant_basis ACTUAL: uses actual_start and bills real standby minutes"

  - name: standby_blocks
    trigger: "Inside invoice_charge under ACTUAL basis"
    algorithm: threshold
    formula: |
      standby_minutes = max(0, minutes_between(job.scheduled_start, job.actual_start))
      billable = max(0, standby_minutes - tariff.free_standby_minutes)
      blocks = ceil(billable / tariff.standby_block_minutes)   # billable == 0 -> 0 blocks; boundary: standby == free allowance bills nothing (strictly greater than free allowance bills)
    input_set: "JobOrder.scheduled_start, JobOrder.actual_start, TariffRate.free_standby_minutes, TariffRate.standby_block_minutes"
    constants: {}
    precision: "integer minutes and blocks"

  - name: liability_settlement
    trigger: "DamageClaim creation (computed fields stored on the claim)"
    algorithm: waterfall_allocation
    formula: |
      # PINNED evaluation order: cap first, then min(claimed, cap), then deductible on the capped amount, then subtract.
      if incident.job_order_id references a JobOrder whose Invoice has status == FINALIZED at claim-creation time:
          liability_variant = PER_VOYAGE
          cap_raw = round_half_up(VOYAGE_INVOICE_MULTIPLE * invoice.total_cents)
      else:
          liability_variant = PER_INCIDENT
          cap_raw = round_half_up(TUG_VALUE_CAP_FRACTION * tug(incident.tug_id).insured_value_cents)
      liability_cap_cents = max(MIN_CAP_CENTS, cap_raw)
      capped = min(claimed_amount_cents, liability_cap_cents)
      deductible_cents = round_half_up(DEDUCTIBLE_PCT * capped)
      payout_cents = capped - deductible_cents
    input_set: "DamageClaim.claimed_amount_cents; Incident (tug_id, job_order_id); Tug.insured_value_cents; the job's Invoice (status, total_cents)"
    constants:
      MIN_CAP_CENTS: 10000000
      TUG_VALUE_CAP_FRACTION: 0.5
      VOYAGE_INVOICE_MULTIPLE: 20
      DEDUCTIBLE_PCT: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: per_incident
        when: "No FINALIZED invoice exists for the incident's job at claim-creation time"
        difference: "cap derived from tug insured value"
      - name: per_voyage
        when: "The incident's job has a FINALIZED invoice at claim-creation time"
        difference: "cap derived from a multiple of the finalized voyage invoice total"

  - name: crew_rest_hours
    trigger: "POST /api/watch-rotations validation"
    algorithm: chronological
    formula: |
      window = [new.watch_start - 24h, new.watch_start)
      worked_minutes = 0
      for each existing WatchRotation w of the same crew member, processed in watch_start ASC order (tie-break: created_at ASC):
          worked_minutes += overlap_minutes([w.watch_start, w.watch_end), window)
      rest_minutes = 24*60 - worked_minutes
      require rest_minutes >= REQUIRED_REST_MINUTES  else ERR_CREW_REST_VIOLATION
    input_set: "All existing WatchRotation rows with crew_member_id == new.crew_member_id (any assignment); the new watch window"
    constants:
      REST_WINDOW_HOURS: 24
      REQUIRED_REST_MINUTES: 600
    precision: "integer minutes"

  - name: vessel_outstanding
    trigger: "Invoice auto-creation, finalize, void; DamageClaim settle"
    algorithm: aggregation
    formula: |
      invoice_sum = sum(Invoice.total_cents) over invoices whose job's vessel_id == vessel.id
                    and Invoice.status IN {PROVISIONAL, FINALIZED}
      payout_sum = sum(DamageClaim.payout_cents) over claims with vessel_id == vessel.id
                   and DamageClaim.status == SETTLED
      outstanding_billed_cents = max(0, invoice_sum - payout_sum)
    input_set: "Invoices joined through JobOrder to the vessel with status filter {PROVISIONAL, FINALIZED}; DamageClaims of the vessel with status SETTLED"
    constants: {}
    precision: "integer cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "VesselAgent ownership: X-User-ID equals vessel_id on job order create / cancel / amend and on damage claim create"
    error_id: ERR_JOB_NOT_OWNED
    http_status: 403
    applies_to: "POST /api/job-orders, POST /api/job-orders/{id}/amend, POST /api/job-orders/{id}/cancel, POST /api/damage-claims"
  - priority: 4
    category: auth
    check: "Pilot ownership: X-User-ID equals the booking's pilot_id"
    error_id: ERR_BOOKING_NOT_OWNED
    http_status: 403
    applies_to: "POST /api/pilot-bookings/{id}/confirm, POST /api/pilot-bookings/{id}/board"
  - priority: 5
    category: auth
    check: "TugCaptain ownership: X-User-ID equals the assignment's tug_id (confirm) or the referenced tug_id (incident create, watch-rotation create via its assignment)"
    error_id: ERR_ASSIGNMENT_NOT_OWNED
    http_status: 403
    applies_to: "POST /api/tug-assignments/{id}/confirm, POST /api/watch-rotations, POST /api/incidents"
  - priority: 6
    category: existence
    check: "Every path id and body FK reference exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version (where the endpoint declares it)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/job-orders/{id}/amend, POST /api/tug-assignments, POST /api/invoices/{id}/finalize"
  - priority: 8
    category: state
    check: "Target resource is not in a terminal state for the attempted transition"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints on stateful resources"
  - priority: 9
    category: state
    check: "Target resource's current state is a valid from-state for the attempted transition; child creation also requires the parent's state to admit it (TugAssignment/PilotBooking creation requires JobOrder.status IN {REQUESTED, CONFIRMED}; WatchRotation creation requires TugAssignment.status IN {CONFIRMED, ACTIVE})"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints on stateful resources, POST /api/tug-assignments, POST /api/pilot-bookings, POST /api/watch-rotations"
  - priority: 10
    category: business_safety
    check: "Tug.operational_status == AVAILABLE for tug assignment creation and confirmation"
    error_id: ERR_TUG_UNAVAILABLE
    http_status: 409
    applies_to: "POST /api/tug-assignments, POST /api/tug-assignments/{id}/confirm"
  - priority: 11
    category: business_safety
    check: "Latest gear inspection for the tug (inspected_at DESC, tie created_at DESC) is PASSED with next_due_at strictly after current logical clock (confirmation only)"
    error_id: ERR_GEAR_INSPECTION_OVERDUE
    http_status: 409
    applies_to: "POST /api/tug-assignments/{id}/confirm"
  - priority: 12
    category: business_safety
    check: "No WeatherRestriction with status == ACTIVE overlaps the job's [scheduled_start, scheduled_end) window (half-open intersection)"
    error_id: ERR_WEATHER_RESTRICTED
    http_status: 409
    applies_to: "POST /api/job-orders/{id}/confirm, POST /api/job-orders/{id}/dispatch"
  - priority: 13
    category: business_temporal
    check: "Tug window conflict: new assignment window must not half-open-overlap any existing TugAssignment of the same tug with status IN {PROPOSED, CONFIRMED, ACTIVE}; adjacency (new_start == existing_end) is allowed"
    error_id: ERR_TUG_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/tug-assignments"
  - priority: 14
    category: business_temporal
    check: "Pilot turnaround buffer: new booking must satisfy new_start >= existing_end + 60 minutes or new_end <= existing_start - 60 minutes against every PilotBooking of the same pilot with status IN {REQUESTED, CONFIRMED, BOARDED}"
    error_id: ERR_PILOT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/pilot-bookings"
  - priority: 15
    category: business_temporal
    check: "Watch overlap: new watch must not half-open-overlap any existing WatchRotation of the same crew member"
    error_id: ERR_WATCH_OVERLAP
    http_status: 409
    applies_to: "POST /api/watch-rotations"
  - priority: 16
    category: business_temporal
    check: "Job scheduled_start must not be strictly before the current logical clock at creation"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /api/job-orders"
  - priority: 17
    category: business_temporal
    check: "Job scheduled_end must be strictly after scheduled_start"
    error_id: ERR_JOB_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /api/job-orders, POST /api/job-orders/{id}/amend"
  - priority: 18
    category: business_temporal
    check: "WeatherRestriction effective_end must be strictly after effective_start"
    error_id: ERR_WEATHER_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /api/weather-restrictions"
  - priority: 19
    category: business_constraint
    check: "No duplicate tug: the job must not already have a TugAssignment with the same tug_id and status IN {PROPOSED, CONFIRMED, ACTIVE}"
    error_id: ERR_DUPLICATE_TUG_ASSIGNMENT
    http_status: 409
    applies_to: "POST /api/tug-assignments"
  - priority: 20
    category: business_constraint
    check: "Dispatch horsepower/bollard matching: sum of bollard_pull_tons over the job's CONFIRMED assignments >= JobOrder.required_bollard_pull_tons (exact equality passes)"
    error_id: ERR_INSUFFICIENT_BOLLARD_PULL
    http_status: 422
    applies_to: "POST /api/job-orders/{id}/dispatch"
  - priority: 21
    category: business_constraint
    check: "Pilot coordination: at least one PilotBooking of the job has status == CONFIRMED at dispatch"
    error_id: ERR_PILOT_BOOKING_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /api/job-orders/{id}/dispatch"
  - priority: 22
    category: business_constraint
    check: "Pilot license class suffices for the maneuver: TOWAGE/ESCORT require CLASS_I; DOCKING/UNDOCKING require CLASS_I or CLASS_II; SHIFTING allows any class"
    error_id: ERR_PILOT_LICENSE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /api/pilot-bookings"
  - priority: 23
    category: business_constraint
    check: "Crew rest: rest_minutes computed by calculation crew_rest_hours >= 600"
    error_id: ERR_CREW_REST_VIOLATION
    http_status: 422
    applies_to: "POST /api/watch-rotations"
  - priority: 24
    category: business_constraint
    check: "At most one DamageClaim per incident"
    error_id: ERR_CLAIM_ALREADY_FILED
    http_status: 409
    applies_to: "POST /api/damage-claims"
  - priority: 25
    category: business_referential
    check: "DamageClaim requires the referenced Incident's status IN {REPORTED, UNDER_INVESTIGATION}; a claim against a RESOLVED incident is rejected (claims open the investigation)"
    error_id: ERR_INCIDENT_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /api/damage-claims"
  - priority: 26
    category: business_referential
    check: "TariffRate effective window covers the job's scheduled_start (effective_from <= scheduled_start <= effective_to)"
    error_id: ERR_TARIFF_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /api/job-orders, POST /api/job-orders/{id}/amend, POST /api/job-orders/{id}/confirm"
  - priority: 27
    category: business_fiscal
    check: "Required input fields present, well-typed, and enum values in their declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 28
    category: business_fiscal
    check: "Enum fields carry a member of the declared set (separate error for enum violations)"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all"

endpoints:
  - method: POST
    path: "/api/tugs"
    description: "Register a tug"
    roles: [PortAdmin]
    code: 201
    input: [name, bollard_pull_tons, horsepower, hourly_rate_cents, insured_value_cents, "home_port?"]
    output: Tug
    side_effects: ["operational_status initialized AVAILABLE"]
  - method: GET
    path: "/api/tugs"
    description: "List tugs"
    roles: [PortAdmin, VesselAgent, PortDispatcher, Pilot, TugCaptain, MarineSurveyor, ClaimsAdjuster]
    code: 200
    input: ["operational_status?"]
    output: Tug[]
    side_effects: []
  - method: GET
    path: "/api/tugs/{id}"
    description: "Get one tug"
