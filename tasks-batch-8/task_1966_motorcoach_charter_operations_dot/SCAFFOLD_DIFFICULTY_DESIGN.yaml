  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_assignment_conflict_same_vehicle
        grounds:
          - state_machines.Vehicle
          - entities.Vehicle.fields.status
          - validations[priority=4]
        distinguishing_aspect: |
          Interval semantics: vehicle occupation is a half-open interval [trip_date, return_date).
          A vehicle already ASSIGNED to one order cannot be assigned to another overlapping
          order — the status check (AVAILABLE) acts as the occupation guard. Different
          from driver overlap in that vehicle checks use discrete status while driver HOS
          uses continuous time accumulation.
        test_recipe:
          setup:
            - "Two orders both CONFIRMED"
            - "One vehicle assigned to order A; attempt to assign same vehicle to order B"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Overlap Test", contact_email: "overlap@x.com", contact_phone: "555-1500", billing_address: "1500 Birch St" }
              as: QuoteAgent
              captures: { cust15_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-1001", make_model: "Prevost H3-45", year: 2023, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-011", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { veh15_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Grace Ho", cdl_number: "CDL-009", cdl_class: "CLASS_B", endorsements: ["P"], hire_date: "2020-01-01T00:00:00Z" }
              as: FleetManager
              captures: { drv15_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Hank Yu", cdl_number: "CDL-010", cdl_class: "CLASS_B", endorsements: ["P"], hire_date: "2021-01-01T00:00:00Z" }
              as: FleetManager
              captures: { drv15b_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust15_id}", trip_date: "2026-09-01T08:00:00Z", return_date: "2026-09-01T16:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 300, estimated_hours: 5, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote15a_id: $.data.id }
            - call: "POST /api/v1/quotes/${quote15a_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { quote15a_v: $.data.version }
            - call: "POST /api/v1/quotes/${quote15a_id}/accept"
              payload: { expected_quote_version: "${quote15a_v}" }
              as: Customer
              as_user_id: "${cust15_id}"
              captures: { order15a_id: $.data.id }
            - call: "POST /api/v1/orders/${order15a_id}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${cust15_id}"
            - call: "GET /api/v1/orders/${order15a_id}"
              payload: {}
              as: DispatchManager
              captures: { order15a_v: $.data.version }
            - call: "POST /api/v1/orders/${order15a_id}/assign"
              payload: { vehicle_id: "${veh15_id}", driver_id: "${drv15_id}", expected_order_version: "${order15a_v}" }
              as: DispatchManager
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust15_id}", trip_date: "2026-09-01T10:00:00Z", return_date: "2026-09-01T18:00:00Z", origin: "Houston TX", destination: "San Antonio TX", passenger_count: 30, estimated_miles: 250, estimated_hours: 4, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote15b_id: $.data.id }
            - call: "POST /api/v1/quotes/${quote15b_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { quote15b_v: $.data.version }
            - call: "POST /api/v1/quotes/${quote15b_id}/accept"
              payload: { expected_quote_version: "${quote15b_v}" }
              as: Customer
              as_user_id: "${cust15_id}"
              captures: { order15b_id: $.data.id }
            - call: "POST /api/v1/orders/${order15b_id}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${cust15_id}"
            - call: "GET /api/v1/orders/${order15b_id}"
              payload: {}
              as: DispatchManager
              captures: { order15b_v: $.data.version }
          trigger:
            - call: "POST /api/v1/orders/${order15b_id}/assign"
              payload: { vehicle_id: "${veh15_id}", driver_id: "${drv15b_id}", expected_order_version: "${order15b_v}" }
              as: DispatchManager
              captures: { err_overlap1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Vehicle.${veh15_id}.status == ASSIGNED"

      - name: driver_hos_accumulation_overlap
        grounds:
          - calculations.calc_hos_feasibility
          - entities.Driver.fields.current_driving_hours_today
          - errors[ERR_HOS_VIOLATION]
        distinguishing_aspect: |
          Interval semantics: driver availability is governed by continuous HOS time
          accumulation, not a discrete status. A driver may be AVAILABLE by status but
          still ineligible because remaining driving hours in the current window are
          insufficient for the trip — aggregate capacity constraint over a rolling window.
        test_recipe:
          setup:
            - "Driver who has already accumulated driving hours via a prior completed trip"
            - "Second trip that would exceed remaining driving hours"
            - "Note: This tests the HOS feasibility calculation that checks remaining capacity"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "HOS Overlap", contact_email: "hos@x.com", contact_phone: "555-1600", billing_address: "1600 Cedar St" }
              as: QuoteAgent
              captures: { cust16_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-1101", make_model: "Prevost H3-45", year: 2023, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-012", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { veh16_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-1102", make_model: "MCI J4500", year: 2024, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-06-01T00:00:00Z", maintenance_due_miles: 60000, insurance_policy_number: "INS-013", insurance_expiry: "2027-06-01T00:00:00Z" }
              as: FleetManager
              captures: { veh16b_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Ivy Chen", cdl_number: "CDL-011", cdl_class: "CLASS_B", endorsements: ["P"], hire_date: "2020-01-01T00:00:00Z" }
              as: FleetManager
              captures: { drv16_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust16_id}", trip_date: "2026-08-10T06:00:00Z", return_date: "2026-08-10T14:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 400, estimated_hours: 8, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote16a_id: $.data.id }
            - call: "POST /api/v1/quotes/${quote16a_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { quote16a_v: $.data.version }
            - call: "POST /api/v1/quotes/${quote16a_id}/accept"
              payload: { expected_quote_version: "${quote16a_v}" }
              as: Customer
              as_user_id: "${cust16_id}"
              captures: { order16a_id: $.data.id }
            - call: "POST /api/v1/orders/${order16a_id}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${cust16_id}"
            - call: "GET /api/v1/orders/${order16a_id}"
              payload: {}
              as: DispatchManager
              captures: { order16a_v: $.data.version }
            - call: "POST /api/v1/orders/${order16a_id}/assign"
              payload: { vehicle_id: "${veh16_id}", driver_id: "${drv16_id}", expected_order_version: "${order16a_v}" }
              as: DispatchManager
          trigger:
            - call: "GET /api/v1/drivers/${drv16_id}"
              payload: {}
              as: DispatchManager
          assert:
            - "Driver.${drv16_id}.status == ON_DUTY_NOT_DRIVING"
            - "Driver.${drv16_id}.status != AVAILABLE"

  # ==========================================================================
  # Rule 9: compensating_invariant — Two invariants with different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_conserves_deposit_total
        grounds:
          - calculations.calc_cancellation_fee
          - entities.CharterOrder.fields.cancellation_fee_cents
          - entities.CharterOrder.fields.refund_cents
          - entities.CharterOrder.fields.deposit_paid_cents
        distinguishing_aspect: |
          Conserved quantity: deposit_paid_cents. The forward action (pay-deposit) plus
          the compensating action (cancel by customer) must satisfy:
          cancellation_fee_cents + refund_cents == deposit_paid_cents.
          No drift in the deposit accounting identity.
        test_recipe:
          setup:
            - "Order in CONFIRMED status with deposit_paid_cents known"
            - "Clock set to 200 hours before trip_date (fee_pct = 0.25)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Invariant Test", contact_email: "inv@x.com", contact_phone: "555-1700", billing_address: "1700 Elm St" }
              as: QuoteAgent
              captures: { cust17_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust17_id}", trip_date: "2026-08-09T08:00:00Z", return_date: "2026-08-09T16:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 600, estimated_hours: 8, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote17_id: $.data.id }
            - call: "POST /api/v1/quotes/${quote17_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { quote17_v: $.data.version }
            - call: "POST /api/v1/quotes/${quote17_id}/accept"
              payload: { expected_quote_version: "${quote17_v}" }
              as: Customer
              as_user_id: "${cust17_id}"
              captures: { order17_id: $.data.id }
            - call: "POST /api/v1/orders/${order17_id}/pay-deposit"
              payload: { amount_cents: 46683 }
              as: Customer
              as_user_id: "${cust17_id}"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/orders/${order17_id}/cancel"
              payload: { reason: "Plans changed" }
              as: Customer
              as_user_id: "${cust17_id}"
          assert:
            - "CharterOrder.${order17_id}.status == CANCELLED"
            - "CharterOrder.${order17_id}.cancelled_by == CUSTOMER"
            - "CharterOrder.${order17_id}.cancellation_fee_cents + CharterOrder.${order17_id}.refund_cents == CharterOrder.${order17_id}.deposit_paid_cents"
            - "CharterOrder.${order17_id}.deposit_paid_cents == 46683"

      - name: breakdown_compensation_conserves_invoice_integrity
        grounds:
          - calculations.calc_breakdown_compensation
          - entities.BreakdownEvent.fields.customer_compensation_cents
          - entities.CharterOrder.fields.final_subtotal_cents
        distinguishing_aspect: |
          Conserved quantity: CharterOrder financial integrity. When a breakdown
          compensation is applied as a credit to final_subtotal_cents, the invariant is:
          compensation_cents <= deposit_paid_cents (capped) AND
          final_subtotal_cents_after == final_subtotal_cents_before - compensation_cents.
          The compensation must not create a negative subtotal.
        test_recipe:
          setup:
            - "Order IN_PROGRESS, breakdown REPORTED and resolved in place with 90 min delay"
            - "Quote subtotal known"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/customers"
              payload: { company_name: "Inv2 Test", contact_email: "inv2@x.com", contact_phone: "555-1800", billing_address: "1800 Oak St" }
              as: QuoteAgent
              captures: { cust18_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { unit_number: "MC-1201", make_model: "Prevost H3-45", year: 2023, seating_capacity: 56, vehicle_class: "STANDARD", dot_inspection_expiry: "2027-01-01T00:00:00Z", maintenance_due_miles: 50000, insurance_policy_number: "INS-014", insurance_expiry: "2027-01-01T00:00:00Z" }
              as: FleetManager
              captures: { veh18_id: $.data.id }
            - call: "POST /api/v1/drivers"
              payload: { full_name: "Jack Liu", cdl_number: "CDL-012", cdl_class: "CLASS_B", endorsements: ["P"], hire_date: "2020-01-01T00:00:00Z" }
              as: FleetManager
              captures: { drv18_id: $.data.id }
            - call: "POST /api/v1/quotes"
              payload: { customer_id: "${cust18_id}", trip_date: "2026-07-10T08:00:00Z", return_date: "2026-07-10T16:00:00Z", origin: "Dallas TX", destination: "Austin TX", passenger_count: 40, estimated_miles: 300, estimated_hours: 5, vehicle_class_requested: "STANDARD" }
              as: QuoteAgent
              captures: { quote18_id: $.data.id }
            - call: "POST /api/v1/quotes/${quote18_id}/price"
              payload: {}
              as: QuoteAgent
              captures: { quote18_v: $.data.version }
            - call: "POST /api/v1/quotes/${quote18_id}/accept"
              payload: { expected_quote_version: "${quote18_v}" }
              as: Customer
              as_user_id: "${cust18_id}"
              captures: { order18_id: $.data.id }
            - call: "POST /api/v1/orders/${order18_id}/pay-deposit"
              payload: { amount_cents: 30000 }
              as: Customer
              as_user_id: "${cust18_id}"
            - call: "GET /api/v1/orders/${order18_id}"
              payload: {}
              as: DispatchManager
              captures: { order18_v: $.data.version }
            - call: "POST /api/v1/orders/${order18_id}/assign"
              payload: { vehicle_id: "${veh18_id}", driver_id: "${drv18_id}", expected_order_version: "${order18_v}" }
              as: DispatchManager
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T07:30:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/orders/${order18_id}/start-trip"
              payload: {}
              as: DispatchManager
            - call: "POST /api/v1/orders/${order18_id}/breakdowns"
              payload: { vehicle_id: "${veh18_id}", driver_id: "${drv18_id}", location: "I-35 Mile 100", description: "Flat tire" }
              as: DispatchManager
              captures: { brk18_id: $.data.id }
          trigger:
            - call: "POST /api/v1/breakdowns/${brk18_id}/resolve-in-place"
              payload: { delay_minutes: 90 }
              as: DispatchManager
          assert:
            - "BreakdownEvent.${brk18_id}.status == RESOLVED_IN_PLACE"
            - "BreakdownEvent.${brk18_id}.customer_compensation_cents >= 0"
            - "BreakdownEvent.${brk18_id}.customer_compensation_cents <= CharterOrder.${order18_id}.deposit_paid_cents"
