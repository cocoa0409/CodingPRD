              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Rotor Re", policy_number: "POL-COV-01", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { polid: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${polid}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-COV", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-08-10T09:00:00Z", planned_end: "2026-08-10T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.58, launch_longitude: -122.30 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fa: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-08-20T09:00:00Z", planned_end: "2026-08-20T10:00:00Z", planned_max_altitude_ft: 390, launch_latitude: 47.58, launch_longitude: -122.30 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fb: $.data.id }
            - call: "POST /drone-ops/flights/${fa}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fa}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/flights/${fa}/complete"
