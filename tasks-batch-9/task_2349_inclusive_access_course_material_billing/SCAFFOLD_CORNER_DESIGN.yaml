          - errors[ERR_ADOPTION_DEADLINE_PASSED]
          - errors[ERR_SUPERSEDE_TARGET_INVALID]
        distinguishing_aspect: |
          The faculty deadline is inclusive on its last day and applies only to first-time adoptions:
          a submit on 2026-07-15 passes, an ordinary submit on 2026-07-16 is refused, and a
          superseding adoption submitted on that same 2026-07-16 passes because
