            - { call: "POST /media-attachments/${m1}/purge", payload: {}, as: Superintendent, captures: { err: $.data.error_id } }
            - { call: "POST /media-attachments/${m2}/purge", payload: {}, as: Superintendent, captures: { st: $.data.status } }
            - { call: "GET /safety-observations/${ob}", payload: {}, as: SafetyOfficer, captures: { ob_media: $.data.media_attachment_id } }
          assert:
            - "purge M1 (incident-linked) -> ERR_MEDIA_LINKED_TO_INCIDENT (409)"
            - "purge M2 -> PURGED; observation media_attachment_id cleared to null (HIGH-risk rule applies at create only)"

