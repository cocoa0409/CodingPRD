          - errors[ERR_DUPLICATE_SKU]
          - errors[ERR_DUPLICATE_PAR_LEVEL]
        distinguishing_aspect: "All four uniqueness rules are exercised in one run and each returns its OWN 409 error_id: model_code, serial_number, sku and the (site_id, product_id) par pair - the last one colliding with a FORECAST row the server itself created."
