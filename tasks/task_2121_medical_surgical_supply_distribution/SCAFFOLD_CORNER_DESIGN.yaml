      - name: clinician_cannot_write_order_lines
        claim_type: role_denied
        grounds:
          - roles.Clinician
          - roles.MaterialsManager
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Writing order lines is exclusive to MaterialsManager under the peer split, so a Clinician attempt returns ERR_ROLE_NOT_PERMITTED 403 and never reaches the OCC or formulary checks."
        test_recipe:
          setup:
            - "One ACUTE supply room with an APPROVED formulary mapping priced by an ACTIVE TIER_1 contract, and one empty DRAFT order."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-700", room_code: "GEN-700", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
