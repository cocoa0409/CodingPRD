        distinguishing_aspect: "OCC on Order.version — after paying (which bumps version), cancelling with an older expected_order_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Order created and paid; version has advanced from 1 to 2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
