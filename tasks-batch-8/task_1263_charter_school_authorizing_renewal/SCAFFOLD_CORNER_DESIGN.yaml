            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "ACADEMIC_PLAN", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_s3
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "FINANCE_PLAN", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_s3
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "GOVERNANCE", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_s3
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "OPERATIONS_PLAN", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_s3
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "COMMUNITY_SUPPORT", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_s3
            - call: "POST /authorizer/applications/${app_id}/interviews"
              payload: { scheduled_start: "2026-05-23T10:00:00Z", scheduled_end: "2026-05-23T11:00:00Z", panelist_user_ids: ["rev_panel_s3"] }
              as: AuthorizerStaff
              captures: { int_id: $.data.id }
            - call: "POST /authorizer/interviews/${int_id}/score"
              payload: { panel_score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_panel_s3
            - call: "POST /authorizer/applications/${app_id}/advance-to-board"
              payload: {}
              as: AuthorizerStaff
            - call: "POST /authorizer/applications/${app_id}/decide"
              payload: { outcome: "APPROVED" }
              as: BoardMember
              as_user_id: board_1
            - call: "GET /authorizer/applications/${app_id}/schools"
              as: AuthorizerStaff
              captures: { school_id : "$.data[0].id", school_v: "$.data[0].version" }
            - call: "POST /authorizer/schools/${school_id}/contracts"
              payload: { framework_version: "FW-1", term_start: "2027-07-01T00:00:00Z", term_end: "2032-06-30T00:00:00Z", expected_school_version: "${school_v}" }
              as: AuthorizerStaff
              captures: { contract_id: $.data.id }
            - call: "POST /authorizer/contracts/${contract_id}/targets"
              payload: { domain: "ACADEMIC", metric_code: "MATH_PROF", target_value: 80, floor_value: 60, weight: 0.5 }
              as: AuthorizerStaff
            - call: "POST /authorizer/contracts/${contract_id}/targets"
              payload: { domain: "FINANCIAL", metric_code: "AUDIT_CLEAN", target_value: 1, floor_value: 1, weight: 0.25 }
              as: AuthorizerStaff
            - call: "POST /authorizer/contracts/${contract_id}/targets"
              payload: { domain: "OPERATIONAL", metric_code: "ENROLL_PCT", target_value: 95, floor_value: 85, weight: 0.25 }
              as: AuthorizerStaff
            - call: "POST /authorizer/contracts/${contract_id}/activate"
              payload: {}
              as: AuthorizerStaff
            - call: "POST /authorizer/schools/${school_id}/monitoring-reports"
              payload: { fiscal_year: 2028, academic_score: 85, financial_score: 85, operational_score: 85 }
              as: AuthorizerStaff
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /authorizer/monitoring-reports/${rep_id}/return"
              payload: {}
              as: AuthorizerStaff
              captures: { err: $.data.error_id }
          assert:
            - "captured error_id == 'ERR_INVALID_REQUEST' (missing return_notes)"
            - "MonitoringReport.${rep_id}.status == 'SUBMITTED'"

      - name: sm_report_resubmit_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MonitoringReport.RETURNED_to_SUBMITTED, "errors[ERR_REPORT_INVALID_STATE]"]
        distinguishing_aspect: "The resubmit transition is only valid from RETURNED; calling submit on a SUBMITTED report fails with ERR_REPORT_INVALID_STATE."
        test_recipe:
          setup: ["school OPEN (standard fixture); report fiscal 2028 SUBMITTED, never returned"]
          setup_api_calls:
            - call: "POST /authorizer/applications"
