  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state x business_safety vs
  # business_safety x business_constraint)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_precondition_beats_training_safety
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.Protocol.DRAFT_to_WITHDRAWN
        distinguishing_aspect: |
          Pair state x business_safety: a submit on a WITHDRAWN protocol by an
          investigator whose training has lapsed violates both priority 4
          (ERR_INVALID_STATE) and priority 5 (ERR_PI_TRAINING_LAPSED); the
          state error wins because priority 4 precedes priority 5.
        test_recipe:
          setup:
            - "Investigator with training_expires_at 2026-01-01T00:00:00Z (lapsed at the default clock 2026-05-01T00:00:00Z)"
            - "Protocol P in WITHDRAWN (created then withdrawn from DRAFT)"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Lapsed", email: "lapsed@univ.edu", department: "History", training_expires_at: "2026-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Dual Fail Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/withdraw"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /irb/protocols/${proto_id}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id ERR_INVALID_STATE (http 409), not ERR_PI_TRAINING_LAPSED"
            - "Protocol.${proto_id}.status == WITHDRAWN"

      - name: assignment_conflict_safety_beats_duplicate_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.ConflictDeclaration.PENDING_REVIEW_to_CONFLICTED
        distinguishing_aspect: |
          Pair business_safety x business_constraint: re-assigning a reviewer
          who holds a CONFLICTED declaration AND already has a SUBMITTED
          assignment on the protocol violates both priority 6
          (ERR_REVIEWER_CONFLICTED) and priority 11 (ERR_DUPLICATE_ASSIGNMENT);
          the safety error wins because priority 6 precedes priority 11.
        test_recipe:
          setup:
            - "Protocol P UNDER_EXPEDITED_REVIEW"
            - "Reviewer rev1's assignment on P is SUBMITTED (recommendation APPROVE)"
            - "rev1's FINANCIAL declaration on P adjudicated CONFLICTED by the chair, voiding the submitted recommendation"
