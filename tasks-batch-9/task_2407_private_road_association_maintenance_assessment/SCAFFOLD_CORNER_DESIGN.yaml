            - "the project after the award reads status AWARDED with awarded_amount_cents 500000 and a version strictly greater than the version captured at creation"
            - "the bid carrying the pre-award version returns HTTP 412 with error_id ERR_STALE_PROJECT_VERSION"
            - "the identical bid carrying the refreshed version returns HTTP 409 with error_id ERR_PROJECT_NOT_IN_SOLICITATION, so the OCC check at priority 9 precedes the state guard at priority 22"
            - "GET /maintenance-projects/{project_id}/contractor-bids returns total_count 1: neither rejected submission created a bid row"

      - name: stale_proposal_version_rejects_a_cast_written_against_an_unseen_tally
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.ballot-cast-stale-proposal
          - validations[priority=10]
          - entities.SpecialAssessmentProposal.fields.counted_weight_total
        distinguishing_aspect: "The second member's cast carries the version read at open-balloting, which the first member's cast has already advanced, so it is rejected with ERR_STALE_PROPOSAL_VERSION even though casting is otherwise legal; re-reading and recasting succeeds and counted_weight_total reaches 2."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; two ACTIVE covenant-recorded parcels with deed-verified members MA and MB; a GRADING proposal of 1,500,000 cents in BALLOTING until 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BoardTreasurer
              as_user_id: "bt-1"
            - call: "POST /associations"
              payload: { name: "Stale Ballot Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Stale Ballot Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB176-P01", frontage_feet: 240, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 4, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pa_id: $.data.id }
            - call: "POST /members"
              payload: { parcel_id: "${pa_id}", owner_name: "A. Whitcomb", deed_book_page: "DB176-P01", deed_recorded_date: "2019-04-11" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { ma_id: $.data.id }
            - call: "POST /members/${ma_id}/verify-deed"
              payload: { verified_deed_book_page: "DB176-P01" }
              as: AssociationSecretary
              as_user_id: "sec-1"
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB176-P02", frontage_feet: 200, usage_class: "SEASONAL", trips_per_day: 2, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pb_id: $.data.id }
            - call: "POST /members"
              payload: { parcel_id: "${pb_id}", owner_name: "B. Okafor", deed_book_page: "DB176-P02", deed_recorded_date: "2020-06-02" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { mb_id: $.data.id }
            - call: "POST /members/${mb_id}/verify-deed"
              payload: { verified_deed_book_page: "DB176-P02" }
              as: AssociationSecretary
              as_user_id: "sec-1"
            - call: "POST /special-assessment-proposals"
              payload: { road_segment_id: "${seg_id}", project_type: "GRADING", title: "Concurrent ballots", estimated_cost_cents: 1500000, cost_allocation_method: "EQUAL_SHARE" }
              as: BoardTreasurer
              as_user_id: "bt-1"
              captures: { prop_id: $.data.id }
            - call: "POST /special-assessment-proposals/${prop_id}/open-balloting"
              payload: { balloting_closes_at: "2026-08-15T00:00:00Z" }
              as: BoardTreasurer
              as_user_id: "bt-1"
              captures: { pv_open: $.data.version }
          trigger:
            - call: "POST /ballots"
              payload: { proposal_id: "${prop_id}", member_id: "${ma_id}", choice: "YES", expected_proposal_version: "${pv_open}" }
              as: MemberOwner
              as_user_id: "${ma_id}"
              captures: { ballot_a: $.data.id }
            - call: "POST /ballots"
              payload: { proposal_id: "${prop_id}", member_id: "${mb_id}", choice: "NO", expected_proposal_version: "${pv_open}" }
              as: MemberOwner
              as_user_id: "${mb_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /special-assessment-proposals/${prop_id}"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-1"
              captures: { pv_after_a: $.data.version }
            - call: "POST /ballots"
              payload: { proposal_id: "${prop_id}", member_id: "${mb_id}", choice: "NO", expected_proposal_version: "${pv_after_a}" }
              as: MemberOwner
              as_user_id: "${mb_id}"
              captures: { ballot_b: $.data.id }
          assert:
            - "MA's cast returns HTTP 201 with weight_snapshot 1 and drives counted_weight_total to 1 and yes_weight_total to 1, advancing the proposal version"
            - "MB's cast carrying the open-balloting version returns HTTP 412 with error_id ERR_STALE_PROPOSAL_VERSION, and counted_weight_total stays 1"
            - "MB's cast carrying the refreshed version returns HTTP 201 with weight_snapshot 1, counted_weight_total 2, yes_weight_total 1, no_weight_total 1 and quorum_met true"
            - "GET /special-assessment-proposals/{proposal_id}/ballots returns total_count 2: the rejected cast created no row"

      - name: stale_parcel_version_rejects_an_overwrite_of_an_unseen_reclassification
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.parcel-update-stale
          - validations[priority=11]
          - calculations.parcel_share_units
        distinguishing_aspect: "Two sequential reclassifications of the same parcel are individually legal, so only the version guard distinguishes them: the second PATCH replaying the creation-time version is rejected with ERR_STALE_PARCEL_VERSION and the parcel keeps the COMMERCIAL values from the write the client never observed."
        test_recipe:
          setup:
            - "One Association, one RoadSegment and one ACTIVE parcel of 240 frontage feet, RESIDENTIAL_YEAR_ROUND, 4 trips per day; no roll exists."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Lost Update Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Lost Update Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB177-P01", frontage_feet: 240, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 4, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { p1_id: $.data.id, pv1: $.data.version }
          trigger:
            - call: "PATCH /parcels/${p1_id}"
              payload: { expected_parcel_version: "${pv1}", usage_class: "COMMERCIAL" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pv2: $.data.version }
            - call: "PATCH /parcels/${p1_id}"
              payload: { expected_parcel_version: "${pv1}", usage_class: "SEASONAL" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { e_stale: $.data.error_id }
            - call: "PATCH /parcels/${p1_id}"
              payload: { expected_parcel_version: "${pv2}", usage_class: "SEASONAL" }
              as: AssociationSecretary
              as_user_id: "sec-1"
          assert:
            - "the first PATCH returns HTTP 200 with usage_class COMMERCIAL, frontage_share_units 420.0 and version 2"
            - "the second PATCH replaying version 1 returns HTTP 412 with error_id ERR_STALE_PARCEL_VERSION, and the parcel still reads usage_class COMMERCIAL with frontage_share_units 420.0 and version 2"
            - "the third PATCH carrying version 2 returns HTTP 200 with usage_class SEASONAL, frontage_share_units 144.0 (240 * 0.60), trip_share_units 148.0 (4 * 25 + 240 * 0.20) and version 3"
            - "version advances only on accepted writes: 1 -> 2 -> 3 across three PATCH attempts"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: deficient_inspection_cancels_paving_reverses_reserve_and_retunes_threshold
          rationale: "That §1.8 cascade-collision instance walks a four-hop chain end-to-end (inspection -> project cancellation -> reserve reversal -> DRAFT proposal threshold) and the companion instance lien_effectuation_cascades_to_a_balloting_proposal_tally covers ordering sensitivity on a second chain."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: annual_roll_method_variant_divergence_frontage_vs_trip
          rationale: "That §1.8 instance drives both allocation variants and the delta on switch; lien_payoff_statutory_vs_association_policy_divergence does the same for the interest basis, so both dual-variant calculations are covered at depth."

      - name: rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: aggregate_restriction_days_ceiling_holds_across_the_fiscal_year_and_survives_release
          rationale: "That §1.8 instance tests the cumulative 45-day ceiling at 44, 45 and 46 days and shows that a release does not reset the accumulator, which is the boundary and reset claim set for this layer."

      - name: derived_field_reconciliation_layer
        claim_type: derived_field_reconciliation
        excluded_because:
          difficulty_instance: reserve_balance_conserved_across_award_cancel_and_bid_withdrawal
          rationale: "That §1.8 invariant instance checks reserve_balance_cents, reserve_funding_ratio and reserve_posture after each of the writes that move them, and counted_voting_weight_conserved_across_revoke_recast_and_lien_void does the same for the proposal tallies."

  - section: consistency_model
    instances:

      - name: every_derived_field_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.AssessmentRoll.DRAFT_to_CERTIFIED
          - state_machines.AssessmentRoll.CERTIFIED_to_LEVIED
          - calculations.reserve_balance_reconciliation
        distinguishing_aspect: "No read-after-write lag is tolerated anywhere in the chain: the certify response itself already carries total_share_units and total_levied_cents, the charge is listable in the very next call, and the levy response's reserve_contribution_cents is already reflected in the association row without any intervening refresh."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; single-parcel association (290 ft RESIDENTIAL_YEAR_ROUND, deed-verified member) with a DRAFT FY2026 roll of 4,000,000 cents; association reserve_target 1,000,000 and balance 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
            - call: "POST /associations"
              payload: { name: "No Lag Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "No Lag Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB178-P01", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { p1_id: $.data.id }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "A. Whitcomb", deed_book_page: "DB178-P01", deed_recorded_date: "2019-04-11" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB178-P01" }
              as: AssociationSecretary
              as_user_id: "sec-1"
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2026, fy_start_date: "2026-01-01", fy_end_date: "2026-12-31", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { roll_id: $.data.id }
          trigger:
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
              as_user_id: "clerk-1"
            - call: "GET /assessment-charges"
              payload: { roll_id: "${roll_id}" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { charge_id: "$.data[0].id" }
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-1"
            - call: "GET /associations/${assoc_id}"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-1"
            - call: "GET /assessment-charges/${charge_id}"
              payload: {}
              as: AssessmentClerk
              as_user_id: "clerk-1"
          assert:
            - "the certify response itself carries status CERTIFIED, total_share_units 290, total_levied_cents 1600000, unallocated_residual_cents 2400000 and certified_at 2026-08-01T00:00:00Z - not a later re-read"
            - "the immediately following list returns total_count 1 with that charge already at share_units_snapshot 290.0 and amount_cents 1600000"
            - "the levy response carries reserve_contribution_cents 600000 and due_date 2026-09-15 in the same body"
            - "the association read immediately after the levy already shows reserve_balance_cents 600000, reserve_funding_ratio 0.6 and reserve_posture ADEQUATE with no intervening write"
            - "the charge read immediately after the levy already shows status OPEN and due_date 2026-09-15, so the levy cascade is visible without delay"
