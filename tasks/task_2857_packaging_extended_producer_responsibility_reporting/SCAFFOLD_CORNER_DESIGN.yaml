              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus/${sku_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/pros"
              payload: { name: "Circular Stewardship Alliance", contact_email: "ops@csa.example" }
              as: ProgramRegulator
