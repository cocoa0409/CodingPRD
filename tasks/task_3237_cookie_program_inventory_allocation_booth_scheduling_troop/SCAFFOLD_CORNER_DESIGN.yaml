# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (Non-Difficulty Tests)
# Breadth walk across §1.1–§1.7 per references/claim-extraction-guide.md.
# `excluded_because:` stubs mark corners already asserted inside §1.8 instances.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: season_create_success_and_defaults
        claim_type: creation
        grounds:
          - entities.CookieSeason
          - 'endpoints["POST /cookie-program/seasons"]'
        distinguishing_aspect: "POST with all required fields returns 201 with status DRAFT, version 1, and zero-valued computed commitment fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2101", name: "Season 2101", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /cookie-program/seasons/${s_id}"
              payload: {}
              as: CouncilAdmin
          assert:
            - "CookieSeason.${s_id}.status == DRAFT"
            - "CookieSeason.${s_id}.version == 1"
            - "CookieSeason.${s_id}.initial_commit_units == 0"
            - "CookieSeason.${s_id}.purchased_units == 0"

      - name: season_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.CookieSeason.fields.code
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "Omitting required field `code` -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cookie-program/seasons"
              payload: { name: "No Code Season", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: season_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "GET with a random UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cookie-program/seasons/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: CouncilAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: product_fiscal_constraint_proceeds_below_price
        claim_type: type_constraints
        grounds:
          - 'validations[priority=12]'
          - entities.CookieProduct.fields.troop_proceeds_cents
        distinguishing_aspect: "troop_proceeds_cents >= unit_price_cents violates the fiscal guard -> ERR_FISCAL_VIOLATION at create."
        test_recipe:
          setup: ["Season exists in DRAFT"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2102", name: "S2102", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "BAD", name: "Bad", unit_price_cents: 500, troop_proceeds_cents: 600, allergen_tags: [], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FISCAL_VIOLATION"

      - name: product_default_packages_per_case_applied
        claim_type: defaults
        grounds:
          - entities.CookieProduct.fields.packages_per_case
        distinguishing_aspect: "Omitting packages_per_case applies the default 12."
        test_recipe:
          setup: ["Season exists in DRAFT"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2103", name: "S2103", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [] }
              as: CouncilAdmin
              captures: { p_case: $.data.packages_per_case }
          assert:
            - "p_case == 12"

      - name: case_pack_violation_on_order_line
        claim_type: type_constraints
        grounds:
          - 'validations[priority=10]'
          - 'errors[ERR_CASE_PACK_VIOLATION]'
        distinguishing_aspect: "package_qty=13 with packages_per_case=12 is not a multiple -> ERR_CASE_PACK_VIOLATION."
        test_recipe:
          setup: ["Season OPEN with TM case 12; troop T1; DRAFT order"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2104", name: "S2104", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 12 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 13 }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CASE_PACK_VIOLATION"

      - name: computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds:
          - entities.CookieSeason.fields.remaining_units
        distinguishing_aspect: "Client-sent values for computed fields (remaining_units etc.) on create are ignored; response shows system-computed 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2105", name: "S2105", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_rem: $.data.remaining_units, s_ver: $.data.version }
          assert:
            - "s_rem == 0"
            - "s_ver == 1"

      - name: pagination_defaults_and_fields
        claim_type: listing
        grounds:
          - response_envelope
          - 'endpoints["GET /cookie-program/seasons"]'
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["Three seasons exist"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2201", name: "A", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2202", name: "B", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2203", name: "C", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
          trigger:
            - call: "GET /cookie-program/seasons?limit=2&offset=0"
              payload: {}
              as: CouncilAdmin
          assert:
            - "response data array length == 2"
            - "envelope exposes total_count == 3 and has_more == true"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: season_open_requires_nonempty_catalog
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CookieSeason.DRAFT_to_OPEN
          - 'errors[ERR_PRODUCT_CATALOG_EMPTY]'
        distinguishing_aspect: "DRAFT season with zero products cannot open -> ERR_PRODUCT_CATALOG_EMPTY."
        test_recipe:
          setup: ["Season in DRAFT with no products"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2301", name: "S2301", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRODUCT_CATALOG_EMPTY"
            - "CookieSeason.${s_id}.status == DRAFT"

      - name: season_terminal_lockdown_closed_rejects_open
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CookieSeason
        distinguishing_aspect: "A CLOSED season rejects every further transition; re-open attempt -> ERR_SEASON_INVALID_STATE."
        test_recipe:
          setup: ["Season fully cycled to CLOSED via confirm -> reconciliation -> close-out (no agreements, no recalls, no transfers, no pending booth requests)"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2302", name: "S2302", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "ABC", product_id: "${p_tm}", quantity: 100, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po1}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/accounts"
              payload: { troop_id: "${t1}" }
              as: CouncilAdmin
            - call: "POST /cookie-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 80 }
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/confirm"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/begin-reconciliation"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/close-out"
              payload: {}
              as: CouncilAdmin
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEASON_INVALID_STATE"
            - "CookieSeason.${s_id}.status == CLOSED"

      - name: initial_order_outside_window_rejected
        claim_type: precondition_enforcement
        grounds:
          - 'validations[priority=9]'
          - 'errors[ERR_ORDER_WINDOW_CLOSED]'
        distinguishing_aspect: "Clock set BEFORE ordering_opens_at: INITIAL submit -> ERR_ORDER_WINDOW_CLOSED; boundary inclusive is covered by difficulty instances."
        test_recipe:
          setup: ["Season OPEN; clock at 2026-12-15 (before opens 2027-01-01); troop order with one line"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2303", name: "S2303", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 10 }
              as: TroopLeader
              as_user_id: "${t1}"
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_WINDOW_CLOSED (default clock 2026-09-01 is before ordering_opens_at)"

      - name: replenishment_order_rejected_before_selling
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CookieOrder.DRAFT_to_SUBMITTED
          - 'errors[ERR_SEASON_NOT_ACCEPTING]'
        distinguishing_aspect: "REPLENISHMENT kind requires SELLING; while OPEN it fails ERR_SEASON_NOT_ACCEPTING."
        test_recipe:
          setup: ["Season OPEN (attainment below gate); troop REPLENISHMENT order with one line, in window"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2304", name: "S2304", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-03-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "ABC", product_id: "${p_tm}", quantity: 100, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po1}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/accounts"
              payload: { troop_id: "${t1}" }
              as: CouncilAdmin
            - call: "POST /cookie-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "REPLENISHMENT" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_r: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_r}/lines"
              payload: { product_id: "${p_tm}", package_qty: 10 }
              as: TroopLeader
              as_user_id: "${t1}"
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_r}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEASON_NOT_ACCEPTING (REPLENISHMENT requires SELLING; season is OPEN)"

      - name: transfer_sod_requester_cannot_ship_sign_own_request
        claim_type: precondition_enforcement
        grounds:
          - 'validations[priority=7]'
          - 'errors[ERR_SOD_SAME_TROOP]'
        distinguishing_aspect: "Troop-to-troop transfer requested by T1 cannot be ship-signed by T1 -> ERR_SOD_SAME_TROOP."
        test_recipe:
          setup: ["Season SELLING; troops T1, T2; T1 created a T1->T2 transfer"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2305", name: "S2305", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 12 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "ABC", product_id: "${p_tm}", quantity: 600, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po1}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/open"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-101", name: "Troop 101", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t1: $.data.id }
            - call: "POST /cookie-program/troops"
              payload: { troop_number: "T-102", name: "Troop 102", service_unit: "SU-1" }
              as: CouncilAdmin
              captures: { t2: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/accounts"
              payload: { troop_id: "${t1}" }
              as: CouncilAdmin
            - call: "POST /cookie-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 480 }
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/confirm"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/transfers"
              payload: { season_id: "${s_id}", product_id: "${p_tm}", package_qty: 12, source_troop_id: "${t1}", dest_troop_id: "${t2}" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { tr1: $.data.id }
          trigger:
            - call: "POST /cookie-program/transfers/${tr1}/sign-ship"
              payload: { signing_troop_id: "${t1}" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SOD_SAME_TROOP (requester troop cannot also ship-sign)"

      - name: booth_request_approved_cancel_frees_capacity
        claim_type: side_effect_execution
        grounds:
          - state_machines.BoothRequest.APPROVED_to_CANCELLED
        distinguishing_aspect: "Cancelling an APPROVED request decrements slot occupancy so a second troop's request can then be approved."
        test_recipe:
          setup: ["Season SELLING; location permitted; slot capacity 1; T1 FIRST_COME request APPROVED"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2306", name: "S2306", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
