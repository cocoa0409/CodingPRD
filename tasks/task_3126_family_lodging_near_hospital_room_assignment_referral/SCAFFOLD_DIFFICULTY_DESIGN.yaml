              as_user_id: "${fam_id}"
            - call: "POST /api/stay-requests/${sr_id}/check-in"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { stay_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
