          assert:
            - "after first return at exactly 45.00: no HEEL_SHORTFALL event exists and compliance_standing was still GOOD at that point"
            - "after second return at 44.99: Contractor.${cr_id}.compliance_standing == WATCH and heel_violation_count_12m == 1"
            - "events for ${cyr_id} contain one ADJUSTMENT event with note HEEL_SHORTFALL"

      - name: coop_accrual_input_set_filtering
        claim_type: input_set_filtering
