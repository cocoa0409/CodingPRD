# =============================================================================
# PRD Benchmark Seed Tables — Wildlife Refuge Public Use Permitting & Habitat
# Management (USFWS). §1.0–§1.7. Difficulty design (§1.8) and corner design
# (§1.9) live in sibling files and are NOT emitted here.
# =============================================================================

scenario: |
  Wildlife Refuge Public Use Permitting & Habitat Management (United States Fish and Wildlife Service): refuge comprehensive conservation planning with public involvement and compatibility determinations for proposed uses, public use permitting for photography, research, commercial filming and guided activity with conditions and fees, habitat management including water level manipulation, prescribed treatment and invasive species control on a seasonal calendar, cooperative farming and grazing agreements used as habitat tools with participant selection, visitor facility operation including trails, observation structures and interpretive programs with seasonal closures for nesting and migration, volunteer and friends group coordination for programs and maintenance, law enforcement of refuge regulations with citation authority, partnership with state wildlife agencies on population management

domain_name: "wildlife-refuge-permitting"
api_prefix: "/refuge"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ManagementUnit
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable unit name (e.g. 'North Marsh')."
      - name: habitat_type
        type: enum
        source: input
        description: "Dominant habitat class."
        constraints: "one of [WETLAND, GRASSLAND, FOREST, MIXED]"
      - name: acreage
        type: integer
        source: input
        description: "Unit acreage."
        constraints: "must be > 0"
      - name: access_posture
        type: enum
        source: computed
        description: "Derived snapshot from ACTIVE FacilityClosures on this unit: CLOSED if any ACTIVE closure has scope FULL; else RESTRICTED if any ACTIVE closure has scope TRAILS_ONLY; else OPEN. Recomputed on every closure activate/lift. See calculations.access_posture_derivation."
        constraints: "one of [OPEN, RESTRICTED, CLOSED]"
      - name: committed_visitor_days
        type: integer
        source: computed
        description: "Sum of crew_size x trip_days (inclusive day count) over PermitApplications in status ACTIVE on this unit. Recomputed on permit pay, suspend, reinstate, revoke, complete. See calculations.committed_visitor_days."
      - name: habitat_priority_breeding
        type: integer
        source: computed
        description: "Breeding-season-weighted habitat priority score over COMPLETED HabitatTreatments. See calculations.habitat_priority_score (variant breeding_weighted)."
      - name: habitat_priority_annual
        type: integer
        source: computed
        description: "Annual-mean habitat priority score over the same COMPLETED HabitatTreatments. See calculations.habitat_priority_score (variant annual_mean)."

  - name: CompatibilityDetermination
    parent: null
    common_fields: true
    fields:
      - name: use_type
        type: enum
        source: input
        description: "Proposed public use this determination covers."
        constraints: "one of [RESEARCH, PHOTOGRAPHY, COMMERCIAL_FILMING, GUIDED_ACTIVITY, GRAZING]"
      - name: title
        type: string
        source: input
        description: "Determination title."
      - name: comment_open_date
        type: string
        source: input
        description: "First date (YYYY-MM-DD) the public comment window may be opened."
        constraints: "ISO date; must be >= current logical clock date at creation"
      - name: comment_close_date
        type: string
        source: input
        description: "Last date (YYYY-MM-DD) of the public comment window."
        constraints: "ISO date; must be > comment_open_date"
      - name: status
        type: enum
        source: system
        description: "Lifecycle: DRAFT -> PUBLIC_COMMENT -> ADJUDICATION -> FINAL (linear; see state_machines.CompatibilityDetermination)."
        constraints: "one of [DRAFT, PUBLIC_COMMENT, ADJUDICATION, FINAL]"
        default: DRAFT
      - name: finding
        type: enum
        source: system
        description: "Compatibility finding, null until finalize; set from finalize payload."
        constraints: "null or one of [COMPATIBLE, NOT_COMPATIBLE]"
        default: null
      - name: rationale
        type: string
        source: system
        description: "Finding rationale recorded at finalize."
        default: null
      - name: unresolved_comment_count
        type: integer
        source: computed
        description: "Count of PublicComments on this determination with status SUBMITTED. Recomputed on comment create and adjudicate."

  - name: PublicComment
    parent: CompatibilityDetermination
    common_fields: true
    fields:
      - name: determination_id
        type: string
        source: input
        description: "FK -> CompatibilityDetermination.id; from path on create."
      - name: author_name
        type: string
        source: input
        description: "Display name of the commenter."
      - name: body
        type: string
        source: input
        description: "Comment text."
      - name: status
        type: enum
        source: system
        description: "SUBMITTED until adjudicated."
        constraints: "one of [SUBMITTED, ADJUDICATED]"
        default: SUBMITTED
      - name: disposition
        type: enum
        source: system
        description: "Adjudication outcome, null until adjudicate."
        constraints: "null or one of [ACCEPTED, REJECTED, NOTED]"
        default: null

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_ref
        type: string
        source: input
        description: "Opaque applicant identity; MUST equal the caller's X-User-ID when role is PermitApplicant (ownership anchor)."
      - name: management_unit_id
        type: string
        source: input
        description: "FK -> ManagementUnit.id; unit where the use occurs."
      - name: determination_id
        type: string
        source: input
        description: "FK -> CompatibilityDetermination.id; the determination authorizing this use_type."
      - name: use_type
        type: enum
        source: input
        description: "Requested use."
        constraints: "one of [RESEARCH, PHOTOGRAPHY, COMMERCIAL_FILMING, GUIDED_ACTIVITY]; must equal the referenced determination's use_type"
      - name: crew_size
        type: integer
        source: input
        description: "Total participants/crew on site per day."
        constraints: "integer >= 1"
      - name: start_date
        type: string
        source: input
        description: "First day of authorized use (YYYY-MM-DD)."
      - name: end_date
        type: string
        source: input
        description: "Last day of authorized use (YYYY-MM-DD); inclusive. trip_days = (end_date - start_date) + 1."
        constraints: ">= start_date"
      - name: status
        type: enum
        source: system
        description: "See state_machines.PermitApplication."
        constraints: "one of [SUBMITTED, REVISION_REQUESTED, UNDER_REVIEW, APPROVED, ACTIVE, SUSPENDED, COMPLETED, REVOKED, EXPIRED]"
        default: SUBMITTED
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: "Flat estimate at submission = base fee for use_type only. See calculations.permit_fee_assessment variant provisional."
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: "Final fee computed at approve; null until APPROVED. See calculations.permit_fee_assessment variant assessed."
        default: null
      - name: revision_note
        type: string
        source: system
        description: "Officer note recorded on return-for-revision."
        default: null
      - name: suspended_by_closure_id
        type: string
        source: system
        description: "Id of the FacilityClosure whose activation suspended this permit (nullable; not a declared FK, no reverse reach required)."
        default: null

  - name: HabitatTreatment
    parent: ManagementUnit
    common_fields: true
    fields:
      - name: management_unit_id
        type: string
        source: input
        description: "FK -> ManagementUnit.id; from path on create."
      - name: treatment_type
        type: enum
        source: input
        description: "Habitat tool applied."
        constraints: "one of [WATER_MANIPULATION, PRESCRIBED_BURN, INVASIVE_CONTROL]"
      - name: window_start
        type: string
        source: input
        description: "First day (YYYY-MM-DD) the treatment may be executed."
      - name: window_end
        type: string
        source: input
        description: "Last day (YYYY-MM-DD); half-open semantics for overlap: [window_start, window_end)."
        constraints: "> window_start"
      - name: status
        type: enum
        source: system
        description: "See state_machines.HabitatTreatment."
        constraints: "one of [SCHEDULED, WINDOW_OPEN, IN_PROGRESS, COMPLETED, EXPIRED]"
        default: SCHEDULED
      - name: notes
        type: string
        source: input
        description: "Optional prescription notes."
        default: null

  - name: FacilityClosure
    parent: ManagementUnit
    common_fields: true
    fields:
      - name: management_unit_id
        type: string
        source: input
        description: "FK -> ManagementUnit.id; from path on create."
      - name: closure_type
        type: enum
        source: input
        description: "Reason for closure."
        constraints: "one of [NESTING, MIGRATION, HUNT_SAFETY, SPECIAL_EVENT]"
      - name: scope
        type: enum
        source: input
        description: "FULL closes the whole unit; TRAILS_ONLY closes visitor facilities only."
        constraints: "one of [FULL, TRAILS_ONLY]"
      - name: start_date
        type: string
        source: input
        description: "First closed day (YYYY-MM-DD)."
      - name: end_date
        type: string
        source: input
        description: "Last closed day (YYYY-MM-DD), inclusive for overlap/gating purposes."
        constraints: ">= start_date"
      - name: status
        type: enum
        source: system
        description: "See state_machines.FacilityClosure. Activation and lift are explicit ranger actions, not clock-driven."
        constraints: "one of [SCHEDULED, ACTIVE, LIFTED]"
        default: SCHEDULED

  - name: InterpretiveProgram
    parent: ManagementUnit
    common_fields: true
    fields:
      - name: management_unit_id
        type: string
        source: input
        description: "FK -> ManagementUnit.id; from path on create."
      - name: title
        type: string
        source: input
        description: "Program title."
      - name: program_date
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the program runs; must be >= current logical clock date at creation."
      - name: min_volunteers
        type: integer
        source: input
        description: "Minimum ACTIVE VolunteerAssignments required to keep the program viable."
        constraints: "integer >= 1"
      - name: max_volunteers
        type: integer
        source: input
        description: "Maximum ACTIVE VolunteerAssignments accepted."
        constraints: "integer >= min_volunteers"
      - name: status
        type: enum
        source: system
        description: "See state_machines.InterpretiveProgram. No manual cancel: CANCELLED only via cascade, COMPLETED via clock."
        constraints: "one of [SCHEDULED, CANCELLED, COMPLETED]"
        default: SCHEDULED

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Volunteer name."
      - name: email
        type: string
        source: input
        description: "Contact email."
      - name: background_status
        type: enum
        source: system
        description: "See state_machines.Volunteer. PENDING at registration; CLEARED by coordinator; EXPIRED by clock at cleared_on + 365 days."
        constraints: "one of [PENDING, CLEARED, EXPIRED]"
        default: PENDING
      - name: cleared_on
        type: string
        source: system
        description: "Date (YYYY-MM-DD) of last background clearance; set to logical clock date on clear-background."
        default: null

  - name: VolunteerAssignment
    parent: null
    common_fields: true
    fields:
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; assigned volunteer."
      - name: program_id
        type: string
        source: input
        description: "FK -> InterpretiveProgram.id; from path on create."
      - name: status
        type: enum
        source: system
        description: "ACTIVE until RELEASED (volunteer expiry or program cancellation cascade) or COMPLETED (program completion cascade)."
        constraints: "one of [ACTIVE, RELEASED, COMPLETED]"
        default: ACTIVE

  - name: GrazingOffering
    parent: ManagementUnit
    common_fields: true
    fields:
      - name: management_unit_id
        type: string
        source: input
        description: "FK -> ManagementUnit.id; from path on create."
      - name: description
        type: string
        source: input
        description: "Habitat objective this grazing agreement serves."
      - name: aum_cap
        type: integer
        source: input
        description: "Maximum animal-unit-months authorized over the window."
        constraints: "integer > 0"
      - name: grazing_window_start
        type: string
        source: input
        description: "First grazing day (YYYY-MM-DD)."
      - name: grazing_window_end
        type: string
        source: input
        description: "Last grazing day (YYYY-MM-DD)."
        constraints: "> grazing_window_start"
      - name: application_deadline
        type: string
        source: input
        description: "Last date (YYYY-MM-DD) bids are accepted; must be >= current logical clock date at offering creation."
      - name: min_stewardship_rating
        type: integer
        source: input
        description: "Minimum bid stewardship_rating eligible for award."
        constraints: "integer in [1, 10]"
      - name: status
        type: enum
        source: system
        description: "See state_machines.GrazingOffering."
        constraints: "one of [OPEN, AWARDED, EXPIRED]"
        default: OPEN

  - name: CooperatorBid
    parent: GrazingOffering
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> GrazingOffering.id; from path on create."
      - name: cooperator_ref
        type: string
        source: input
        description: "Opaque cooperator identity; MUST equal the caller's X-User-ID when role is Cooperator."
      - name: rate_cents_per_aum
        type: integer
        source: input
        description: "Bid rate in cents per animal-unit-month."
        constraints: "integer > 0"
      - name: stewardship_rating
        type: integer
        source: input
        description: "Self-declared stewardship rating, evaluated against offering.min_stewardship_rating."
        constraints: "integer in [1, 10]"
      - name: status
        type: enum
        source: system
        description: "SUBMITTED until close-and-select marks it WINNING or REJECTED."
        constraints: "one of [SUBMITTED, WINNING, REJECTED]"
        default: SUBMITTED

  - name: CooperativeAgreement
    parent: ManagementUnit
    common_fields: true
    fields:
      - name: management_unit_id
        type: string
        source: system
        description: "FK -> ManagementUnit.id; copied from the offering at award."
      - name: winning_bid_id
        type: string
        source: system
        description: "FK -> CooperatorBid.id; the winning bid this agreement was created from (1:1)."
      - name: cooperator_ref
        type: string
        source: system
        description: "Copied from the winning bid; ownership anchor for Cooperator payments."
      - name: aum_cap
        type: integer
        source: system
        description: "Copied from the offering."
      - name: grazing_window_start
        type: string
        source: system
        description: "Copied from the offering."
      - name: grazing_window_end
        type: string
        source: system
        description: "Copied from the offering."
      - name: compliance_points
        type: integer
        source: system
        description: "Starts at 100. Debited by ISSUED citations by severity (MINOR 10, MAJOR 25, CRITICAL 50), credited back on void. See calculations.compliance_point_deduction."
      - name: assessed_total_cents
        type: integer
        source: system
        description: "Sum of all period assessments (per-period rounded, then summed). See calculations.cost_share_assessment."
        default: 0
      - name: paid_total_cents
        type: integer
        source: system
        description: "Sum of PAYMENT ledger entries."
        default: 0
      - name: refunded_total_cents
        type: integer
        source: system
        description: "Sum of REFUND ledger entries."
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "assessed_total_cents - paid_total_cents + refunded_total_cents. Invariant: a payment followed by an equal refund leaves outstanding unchanged."
      - name: status
        type: enum
        source: system
        description: "See state_machines.CooperativeAgreement. ACTIVE <-> SUSPENDED cycle is citation-driven."
        constraints: "one of [ACTIVE, SUSPENDED, COMPLETED]"
        default: ACTIVE

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - name: severity
        type: enum
        source: input
        description: "Violation severity."
        constraints: "one of [MINOR, MAJOR, CRITICAL]"
      - name: points
        type: integer
        source: computed
        description: "Compliance points debited: MINOR 10, MAJOR 25, CRITICAL 50. Input value ignored if supplied (computed)."
      - name: subject_permit_id
        type: string
        source: input
        description: "FK -> PermitApplication.id; nullable. Exactly one of subject_permit_id / subject_agreement_id must be supplied."
        default: null
      - name: subject_agreement_id
        type: string
        source: input
        description: "FK -> CooperativeAgreement.id; nullable. Exactly one of subject_permit_id / subject_agreement_id must be supplied."
        default: null
      - name: note
        type: string
        source: input
        description: "Free-text violation note."
      - name: status
        type: enum
        source: system
        description: "ISSUED until voided."
        constraints: "one of [ISSUED, VOIDED]"
        default: ISSUED

  - name: PopulationObjective
    parent: ManagementUnit
    common_fields: true
    fields:
      - name: management_unit_id
        type: string
        source: input
        description: "FK -> ManagementUnit.id; from path on create."
      - name: species
        type: string
        source: input
        description: "Species common name (e.g. 'Sandhill Crane')."
      - name: target_count
        type: integer
        source: input
        description: "State-agency population target for this unit."
        constraints: "integer > 0"
      - name: current_survey_count
        type: integer
        source: system
        description: "Latest survey count; null until first survey."
        default: null
      - name: status
        type: enum
        source: computed
        description: "NO_SURVEY until first survey; then AT_TARGET iff survey_count * 10 >= target_count * 7, else BELOW_TARGET. See calculations.population_deviation."
        constraints: "one of [NO_SURVEY, AT_TARGET, BELOW_TARGET]"
        default: NO_SURVEY

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CompatibilityDetermination
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: PUBLIC_COMMENT
        trigger: "POST /refuge/determinations/{id}/open-comment"
        actor: PermitOfficer
        preconditions:
          - "status == DRAFT"
          - "current logical clock date is within [comment_open_date, comment_close_date] inclusive (else ERR_INVALID_STATE if not DRAFT; ERR_WINDOW_IN_PAST / ERR_INVALID_STATE per validation order if outside window)"
        side_effects:
          - "no field changes beyond status; comment window is now open"
      - from: PUBLIC_COMMENT
        to: ADJUDICATION
        trigger: "system: POST /_clock/set_current_utc advances clock past comment_close_date"
        actor: system
        preconditions:
          - "status == PUBLIC_COMMENT"
          - "current logical clock date > comment_close_date"
        side_effects:
          - "status := ADJUDICATION (comment intake closes)"
      - from: ADJUDICATION
        to: FINAL
        trigger: "POST /refuge/determinations/{id}/finalize"
        actor: PermitOfficer
        preconditions:
          - "status == ADJUDICATION"
          - "unresolved_comment_count == 0 (else ERR_UNRESOLVED_COMMENTS)"
        side_effects:
          - "finding := payload.finding; rationale := payload.rationale"
          - "status := FINAL"

  - entity: PublicComment
    initial_state: SUBMITTED
    terminal_states: [ADJUDICATED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /refuge/comments/{id}/adjudicate"
        actor: PermitOfficer
        preconditions:
          - "comment.status == SUBMITTED"
          - "parent determination (PublicComment.determination_id) status in {PUBLIC_COMMENT, ADJUDICATION}"
        side_effects:
          - "disposition := payload.disposition"
          - "recompute parent determination.unresolved_comment_count (decrements by 1)"

  - entity: PermitApplication
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, REVOKED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /refuge/permits/{id}/return-for-revision"
        actor: PermitOfficer
        preconditions:
          - "status in {SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "revision_note := payload.note"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /refuge/permits/{id}/return-for-revision"
        actor: PermitOfficer
        preconditions:
          - "status in {SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "revision_note := payload.note"
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /refuge/permits/{id}/resubmit"
        actor: PermitApplicant
        preconditions:
          - "status == REVISION_REQUESTED"
          - "caller X-User-ID == permit.applicant_ref"
          - "use_type and determination_id are immutable after create (not in resubmit input)"
        side_effects:
          - "recompute provisional_fee_cents via calculations.permit_fee_assessment (provisional variant) if crew_size/start_date/end_date supplied"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /refuge/permits/{id}/approve"
        actor: PermitOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "referenced determination.status == FINAL (else ERR_DETERMINATION_NOT_FINAL)"
          - "referenced determination.finding == COMPATIBLE (else ERR_USE_INCOMPATIBLE)"
          - "commercial capacity: if use_type == COMMERCIAL_FILMING, no calendar day in [start_date, end_date] may already carry >= MAX_COMMERCIAL_PERMITS_PER_UNIT_DAY (2) permits in {APPROVED, ACTIVE} on the same unit (else ERR_COMMERCIAL_CAPACITY_EXCEEDED)"
        side_effects:
          - "assessed_fee_cents := calculations.permit_fee_assessment (assessed variant)"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /refuge/permits/{id}/pay"
        actor: PermitApplicant
        preconditions:
          - "status == APPROVED"
          - "caller X-User-ID == permit.applicant_ref"
          - "payload.amount_cents == assessed_fee_cents exactly (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "recompute ManagementUnit.committed_visitor_days (adds crew_size x trip_days)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: cascade from POST /refuge/closures/{id}/activate when a FULL-scope closure on the same unit is activated and [permit.start_date, permit.end_date] intersects [closure.start_date, closure.end_date]"
        actor: system
        preconditions:
          - "permit.status == ACTIVE and date intersection non-empty and closure.scope == FULL"
        side_effects:
          - "suspended_by_closure_id := closure.id"
          - "recompute ManagementUnit.committed_visitor_days (releases this permit's days)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: cascade from POST /refuge/closures/{id}/lift when permit.suspended_by_closure_id == closure.id and permit.end_date >= current logical clock date"
        actor: system
        preconditions:
          - "permit.suspended_by_closure_id == the lifted closure.id"
          - "permit.end_date >= current logical clock date (else -> EXPIRED instead)"
        side_effects:
          - "suspended_by_closure_id := null"
          - "recompute ManagementUnit.committed_visitor_days (re-adds this permit's days)"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: cascade from POST /refuge/closures/{id}/lift when permit.suspended_by_closure_id == closure.id and permit.end_date < current logical clock date"
        actor: system
        preconditions:
          - "permit.suspended_by_closure_id == the lifted closure.id"
          - "permit.end_date < current logical clock date"
        side_effects:
          - "suspended_by_closure_id := null"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: POST /_clock/set_current_utc advances clock past end_date"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "current logical clock date > end_date"
        side_effects:
          - "recompute ManagementUnit.committed_visitor_days (releases this permit's days)"
      - from: UNDER_REVIEW
        to: REVOKED
        trigger: "POST /refuge/permits/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "status in {UNDER_REVIEW, APPROVED, ACTIVE, SUSPENDED}"
        side_effects:
          - "if prior status was ACTIVE: recompute ManagementUnit.committed_visitor_days (releases days)"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /refuge/permits/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "status in {UNDER_REVIEW, APPROVED, ACTIVE, SUSPENDED}"
        side_effects:
          - "no visitor-day change (APPROVED permits hold no committed days)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /refuge/permits/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "status in {UNDER_REVIEW, APPROVED, ACTIVE, SUSPENDED}"
        side_effects:
          - "recompute ManagementUnit.committed_visitor_days (releases days)"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /refuge/permits/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "status in {UNDER_REVIEW, APPROVED, ACTIVE, SUSPENDED}"
        side_effects:
          - "suspended_by_closure_id := null"

  - entity: HabitatTreatment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: WINDOW_OPEN
        trigger: "system: POST /_clock/set_current_utc advances clock into [window_start, window_end]"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "window_start <= current logical clock date <= window_end"
        side_effects: []
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances clock past window_end while still SCHEDULED"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "current logical clock date > window_end"
        side_effects: []
      - from: WINDOW_OPEN
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances clock past window_end while WINDOW_OPEN"
        actor: system
        preconditions:
          - "status == WINDOW_OPEN"
          - "current logical clock date > window_end"
        side_effects: []
      - from: WINDOW_OPEN
        to: IN_PROGRESS
        trigger: "POST /refuge/treatments/{id}/start"
        actor: Biologist
        preconditions:
          - "status == WINDOW_OPEN"
          - "unit access_posture at the current clock date != CLOSED (else ERR_POSTURE_CLOSED): no ACTIVE FULL-scope closure on the unit covers the current clock date"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /refuge/treatments/{id}/complete"
        actor: Biologist
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "recompute ManagementUnit.habitat_priority_breeding and ManagementUnit.habitat_priority_annual via calculations.habitat_priority_score"

  - entity: FacilityClosure
    initial_state: SCHEDULED
    terminal_states: [LIFTED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /refuge/closures/{id}/activate"
        actor: Biologist
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "recompute ManagementUnit.access_posture (may become RESTRICTED or CLOSED)"
          - "cascade (hop 1): every InterpretiveProgram on the same unit with status SCHEDULED whose program_date falls within [closure.start_date, closure.end_date] -> CANCELLED"
          - "cascade (hop 2): every VolunteerAssignment with status ACTIVE whose program_id was cancelled in hop 1 -> RELEASED"
          - "cascade (hop 1, permits): if scope == FULL, every PermitApplication on the same unit with status ACTIVE whose [start_date, end_date] intersects [closure.start_date, closure.end_date] -> SUSPENDED with suspended_by_closure_id := closure.id"
          - "cascade (hop 2, ledger): each permit suspension in the previous hop recomputes ManagementUnit.committed_visitor_days (releases that permit's crew_size x trip_days)"
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /refuge/closures/{id}/lift"
        actor: Biologist
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "recompute ManagementUnit.access_posture"
          - "cascade: every PermitApplication with suspended_by_closure_id == closure.id -> ACTIVE if permit.end_date >= current logical clock date, else -> EXPIRED; each reinstatement recomputes ManagementUnit.committed_visitor_days (re-adds days)"
          - "programs cancelled by activation are NOT restored (pinned: cancellation is permanent)"

  - entity: InterpretiveProgram
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from POST /refuge/closures/{id}/activate (program_date within closure dates, same unit) OR cascade from volunteer expiry leaving fewer ACTIVE assignments than min_volunteers"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "either an activated closure's [start_date, end_date] contains program_date (same unit), or a cascade-released assignment drops the count of remaining ACTIVE assignments below min_volunteers"
        side_effects:
          - "cascade: every VolunteerAssignment with program_id == this program and status ACTIVE -> RELEASED"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system: POST /_clock/set_current_utc advances clock past program_date"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "current logical clock date > program_date"
        side_effects:
          - "cascade: every VolunteerAssignment with program_id == this program and status ACTIVE -> COMPLETED"
        note: "clock-set evaluation order is pinned: determinations -> treatments -> volunteers (with cascade) -> programs -> permits; a volunteer-expiry shortfall therefore cancels a past-due SCHEDULED program before the completion step can complete it"

  - entity: Volunteer
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /refuge/volunteers/{id}/clear-background"
        actor: VolunteerCoordinator
        preconditions:
          - "background_status in {PENDING, EXPIRED}"
        side_effects:
          - "cleared_on := current logical clock date"
      - from: EXPIRED
        to: CLEARED
        trigger: "POST /refuge/volunteers/{id}/clear-background"
        actor: VolunteerCoordinator
        preconditions:
          - "background_status in {PENDING, EXPIRED}"
        side_effects:
          - "cleared_on := current logical clock date (renewal)"
      - from: CLEARED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances clock to cleared_on + 365 days or later"
        actor: system
        preconditions:
          - "background_status == CLEARED"
          - "current logical clock date >= cleared_on + 365 days (boundary: exactly cleared_on + 365 expires)"
        side_effects:
          - "cascade (hop 1): every VolunteerAssignment with volunteer_id == this volunteer and status ACTIVE -> RELEASED"
          - "cascade (hop 2): every InterpretiveProgram with status SCHEDULED whose remaining ACTIVE assignment count drops below min_volunteers because of hop 1 -> CANCELLED (and its own cascade releases remaining ACTIVE assignments)"
    note: "state field is background_status; machine is cyclic (EXPIRED -> CLEARED renewal)"

  - entity: VolunteerAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system: cascade from volunteer expiry, program cancellation, or closure-activation program cancellation"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: cascade from program completion (clock past program_date)"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects: []

  - entity: GrazingOffering
    initial_state: OPEN
    terminal_states: [AWARDED, EXPIRED]
    transitions:
      - from: OPEN
        to: AWARDED
        trigger: "POST /refuge/grazing-offerings/{id}/close-and-select with a non-empty eligible bid pool"
        actor: RefugeManager
        preconditions:
          - "status == OPEN"
          - "eligible pool (calculations.bid_selection_ranking) non-empty"
        side_effects:
          - "highest-ranked eligible bid -> WINNING"
          - "all other SUBMITTED bids -> REJECTED"
          - "create CooperativeAgreement (status ACTIVE, compliance_points 100, totals 0) copying management_unit_id, aum_cap, grazing window from the offering and cooperator_ref from the winning bid; winning_bid_id := winning bid id"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /refuge/grazing-offerings/{id}/close-and-select with an empty eligible bid pool"
        actor: RefugeManager
        preconditions:
          - "status == OPEN"
          - "eligible pool empty (zero SUBMITTED bids, or all bids below min_stewardship_rating)"
        side_effects:
          - "all SUBMITTED bids -> REJECTED"

  - entity: CooperatorBid
    initial_state: SUBMITTED
    terminal_states: [WINNING, REJECTED]
    transitions:
      - from: SUBMITTED
        to: WINNING
        trigger: "system: cascade from POST /refuge/grazing-offerings/{id}/close-and-select (highest rank_score in eligible pool)"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: cascade from POST /refuge/grazing-offerings/{id}/close-and-select (not selected, or pool empty)"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects: []

  - entity: CooperativeAgreement
    initial_state: ACTIVE
    terminal_states: [COMPLETED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: cascade from POST /refuge/citations when an ISSUED citation debits compliance_points below SUSPEND_THRESHOLD_POINTS (60)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "compliance_points after debit < 60 (boundary: exactly 60 remains ACTIVE)"
        side_effects:
          - "status := SUSPENDED (assessments blocked; payments still accepted)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: cascade from POST /refuge/citations/{id}/void when restored compliance_points >= 60"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "compliance_points after credit >= 60"
        side_effects:
          - "status := ACTIVE"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /refuge/cooperative-agreements/{id}/complete"
        actor: RefugeManager
        preconditions:
          - "status == ACTIVE"
          - "outstanding_balance_cents == 0 (else ERR_OUTSTANDING_BALANCE)"
        side_effects: []

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /refuge/citations/{id}/void"
        actor: LawEnforcementOfficer
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "if subject_agreement_id present: credit points back to the agreement (compliance_points += points); if the agreement is SUSPENDED and restored points >= 60, cascade SUSPENDED -> ACTIVE"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: occ-agreement-assess-stale
    parent_entity: CooperativeAgreement
    write_endpoint: "POST /refuge/cooperative-agreements/{id}/assess"
    occ_field: "expected_agreement_version"
    description: |
      Recording a period assessment against a CooperativeAgreement whose
      version has advanced since the client last observed it is rejected.
      Assessing a new period is legitimate against any ACTIVE agreement, so a
      strictly later request sees identical state and would succeed; the OCC
      check rejects the stale view (assessment math may depend on totals the
      client did not observe).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-citation-issue-stale
    parent_entity: CooperativeAgreement
    write_endpoint: "POST /refuge/citations"
    occ_field: "expected_agreement_version"
    description: |
      Issuing a citation against an agreement subject whose version has
      advanced since the officer last observed it is rejected. Issuing a
      further citation is legitimate against the agreement regardless of
      prior citations (multiple violations may be cited), so a strictly later
      request sees identical state and would succeed; the OCC check rejects
      the stale view (compliance_points may have been debited or restored
      since the officer's read). Applies when subject_agreement_id is
      supplied; permit-subject citations carry no OCC field.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_fee_assessment
    trigger: "provisional variant runs on POST /refuge/permits (and on resubmit when crew_size/dates change); assessed variant runs on POST /refuge/permits/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      days = (end_date - start_date) + 1            # inclusive day count
      tier_mult = TIER_SMALL if crew_size <= 9
                  else TIER_MEDIUM if crew_size <= 19
                  else TIER_LARGE                    # crew_size >= 20
      raw = BASE_FEE[use_type]
            + round_half_up(PER_DAY[use_type] * days * tier_mult)
            + (COMMERCIAL_SURCHARGE if use_type == COMMERCIAL_FILMING else 0)
      assessed = min(raw, FEE_CAP_CENTS)
      assessed = max(assessed, FEE_FLOOR_CENTS)
    input_set: "the single PermitApplication being created/approved; use_type, crew_size, start_date, end_date"
    constants:
      BASE_FEE_RESEARCH_CENTS: 15000
      BASE_FEE_PHOTOGRAPHY_CENTS: 7500
      BASE_FEE_COMMERCIAL_FILMING_CENTS: 20000
      BASE_FEE_GUIDED_ACTIVITY_CENTS: 3000
      PER_DAY_RESEARCH_CENTS: 2000
      PER_DAY_PHOTOGRAPHY_CENTS: 1500
      PER_DAY_COMMERCIAL_FILMING_CENTS: 5000
      PER_DAY_GUIDED_ACTIVITY_CENTS: 800
      TIER_SMALL: 1.0
      TIER_MEDIUM: 1.25
      TIER_LARGE: 1.5
      COMMERCIAL_SURCHARGE_CENTS: 10000
      FEE_FLOOR_CENTS: 5000
      FEE_CAP_CENTS: 100000
    precision: "integer cents; round_half_up applied exactly once, to the per-day x days x tier product, before adding base and surcharge"
    variants:
      - name: provisional
        when: "at POST /refuge/permits and at resubmit"
        difference: "flat estimate = BASE_FEE[use_type] only; ignores crew_size, days, tier, surcharge, floor and cap. For identical application data the provisional and assessed values differ (e.g. RESEARCH crew 4, 3 days: provisional 15000 vs assessed 21000)."
      - name: assessed
        when: "at POST /refuge/permits/{id}/approve"
        difference: "full formula above with tier selection, commercial surcharge, floor and cap."

  - name: cost_share_assessment
    trigger: "POST /refuge/cooperative-agreements/{id}/assess"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round each period, then sum. Never sum then round.
      period_amount = round_half_up(aum_used * rate_cents_per_aum * COOP_SHARE_PCT / 100)
      assessed_total_cents_new = assessed_total_cents + period_amount
      outstanding_balance_cents = assessed_total_cents_new - paid_total_cents + refunded_total_cents
    input_set: "single CooperativeAgreement in status ACTIVE; payload period_key, aum_used, rate_cents_per_aum"
    constants:
      COOP_SHARE_PCT: 50
    precision: "integer cents; round_half_up per period, then summed. Example pinned: aum 3, rate 1001 -> round_half_up(1501.5) = 1502 per period; two such periods -> assessed_total 3004 (sum-then-round would yield 3003 and is WRONG)."
    variants: []

  - name: habitat_priority_score
    trigger: "POST /refuge/treatments/{id}/complete (recompute); read via GET /refuge/management-units/{id}/posture"
    algorithm: weighted_scoring
    formula: |
      weights = { WATER_MANIPULATION: 30, PRESCRIBED_BURN: 50, INVASIVE_CONTROL: 20 }
      input set = HabitatTreatments on the unit with status == COMPLETED only
      annual = sum(weights[t.treatment_type] for t in input_set)
      breeding = sum(weights[t.treatment_type] * (2 if [t.window_start, t.window_end]
                     intersects [year(t.window_start)-03-01, year(t.window_start)-06-30]
                     else 1) for t in input_set)
    input_set: "COMPLETED HabitatTreatments of the unit; SCHEDULED, WINDOW_OPEN, IN_PROGRESS and EXPIRED are excluded"
    constants:
      WEIGHT_WATER_MANIPULATION: 30
      WEIGHT_PRESCRIBED_BURN: 50
      WEIGHT_INVASIVE_CONTROL: 20
      BREEDING_MULTIPLIER: 2
    precision: "integer scores; no rounding"
    variants:
      - name: breeding_weighted
        when: "reported as ManagementUnit.habitat_priority_breeding"
        difference: "doubles the weight of treatments whose execution window intersects the breeding window (Mar 1 - Jun 30 of window_start's year). For identical completed-treatment sets the variants differ whenever any treatment intersects the breeding window (e.g. one burn in March + one invasive-control in August: breeding 120 vs annual 70)."
      - name: annual_mean
        when: "reported as ManagementUnit.habitat_priority_annual"
        difference: "flat weight sum with no seasonal multiplier."

  - name: committed_visitor_days
    trigger: "POST /refuge/permits/{id}/pay; cascade from closure activate (suspend), closure lift (reinstate), revoke of an ACTIVE permit, and clock-driven completion of an ACTIVE permit"
    algorithm: aggregation
    formula: |
      trip_days(p) = (p.end_date - p.start_date) + 1
      committed_visitor_days = sum(p.crew_size * trip_days(p)
                                   for p in PermitApplications
                                   where p.management_unit_id == unit.id
                                     and p.status == ACTIVE)
    input_set: "PermitApplications on the unit with status == ACTIVE only; APPROVED, SUSPENDED, COMPLETED, REVOKED, EXPIRED contribute 0"
    constants: {}
    precision: "integer visitor-days"
    variants: []
    note: "Invariant: a suspend followed by its matching reinstate (same closure) leaves committed_visitor_days unchanged; pay followed by closure-activation returns the unit to its pre-pay value."

  - name: compliance_point_deduction
    trigger: "POST /refuge/citations (agreement subject) and POST /refuge/citations/{id}/void"
    algorithm: threshold
    formula: |
      points(c) = 10 if c.severity == MINOR; 25 if MAJOR; 50 if CRITICAL
      on issue: compliance_points -= points(c)
      on void:  compliance_points += points(c)
      after every debit:  if status == ACTIVE and compliance_points < SUSPEND_THRESHOLD_POINTS -> SUSPENDED
      after every credit: if status == SUSPENDED and compliance_points >= SUSPEND_THRESHOLD_POINTS -> ACTIVE
    input_set: "single CooperativeAgreement; citation severity"
    constants:
      SUSPEND_THRESHOLD_POINTS: 60
      POINTS_MINOR: 10
      POINTS_MAJOR: 25
      POINTS_CRITICAL: 50
      INITIAL_COMPLIANCE_POINTS: 100
    precision: "integer points; boundary pinned: exactly 60 remains ACTIVE, 59 suspends"
    variants: []

  - name: bid_selection_ranking
    trigger: "POST /refuge/grazing-offerings/{id}/close-and-select"
    algorithm: weighted_scoring
    formula: |
      eligible = [b for b in bids of offering
                  where b.status == SUBMITTED
                    and b.stewardship_rating >= offering.min_stewardship_rating]
      rank_score(b) = b.stewardship_rating * 1000 - b.rate_cents_per_aum
      winner = argmax(rank_score) over eligible;
               ties broken by created_at ASC (earliest bid wins)
      if eligible is empty: offering -> EXPIRED, all SUBMITTED bids -> REJECTED
      else: winner -> WINNING, all other SUBMITTED bids -> REJECTED, create CooperativeAgreement
    input_set: "CooperatorBids of the offering with status SUBMITTED"
    constants:
      RATING_WEIGHT: 1000
    precision: "integer rank_score"
    variants: []
    note: "Selector policy is fully pinned: eligibility filter (SUBMITTED and rating >= min), ranking expression (rank_score DESC), tie-break (created_at ASC), empty-pool fallback (offering EXPIRED). Random ids never participate."

  - name: access_posture_derivation
    trigger: "POST /refuge/closures/{id}/activate and POST /refuge/closures/{id}/lift; read via GET /refuge/management-units/{id}/posture"
    algorithm: aggregation
    formula: |
      active_closures = FacilityClosures on the unit with status == ACTIVE
      if any(c.scope == FULL for c in active_closures): posture = CLOSED
      elif any(c.scope == TRAILS_ONLY for c in active_closures): posture = RESTRICTED
      else: posture = OPEN
    input_set: "FacilityClosures of the unit with status == ACTIVE; SCHEDULED and LIFTED never contribute"
    constants: {}
    precision: "enum"
    variants: []
    note: "Posture is a point-in-time snapshot of the unit. Gating rules that are date-scoped (program creation on a specific program_date) additionally require that date to intersect the ACTIVE FULL closure's [start_date, end_date]; the start-treatment gate uses the posture at the current clock date."

  - name: population_deviation
    trigger: "POST /refuge/population-objectives/{id}/surveys"
    algorithm: threshold
    formula: |
      current_survey_count := payload.survey_count
      status = AT_TARGET if survey_count * 10 >= target_count * 7 else BELOW_TARGET
      (integer comparison; avoids float. Boundary: survey * 10 == target * 7 -> AT_TARGET)
    input_set: "single PopulationObjective"
    constants:
      BELOW_TARGET_RATIO_NUM: 7
      BELOW_TARGET_RATIO_DEN: 10
    precision: "integer counts"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to a declared role; X-User-ID header present for every role except Anonymous."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role appears in the endpoint's roles list; ownership anchors enforced: PermitApplicant calls carry X-User-ID == PermitApplication.applicant_ref (and permit create payload applicant_ref == X-User-ID); Cooperator calls carry X-User-ID == bid/agreement cooperator_ref; Volunteer list calls filter on own volunteer id."
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, types match, enum members valid; for POST /refuge/citations exactly one of subject_permit_id / subject_agreement_id is supplied."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every path id and body-supplied FK reference resolves to an existing resource, validated left-to-right (path first, then body)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "State-machine preconditions of the invoked transition hold (correct from-state; terminal states reject all transitions)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC: when an endpoint declares expected_agreement_version, the supplied value must equal the CooperativeAgreement's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /refuge/cooperative-agreements/{id}/assess; POST /refuge/citations (when subject_agreement_id supplied)"
  - priority: 7
    category: business_safety
    check: "PRESCRIBED_BURN window must keep a NESTING_BUFFER_DAYS (14) gap before any NESTING FacilityClosure (status SCHEDULED or ACTIVE) on the same unit: rejected if burn window_end > nesting.start_date - 14 days, whenever the burn window precedes or overlaps the closure window."
    error_id: ERR_NESTING_BLACKOUT
    http_status: 422
    applies_to: "POST /refuge/management-units/{id}/treatments"
  - priority: 8
    category: business_safety
    check: "Program creation rejected when program_date intersects an ACTIVE FULL-scope closure window on the same unit; treatment start rejected when unit access_posture at the current clock date is CLOSED."
    error_id: ERR_POSTURE_CLOSED
    http_status: 422
    applies_to: "POST /refuge/management-units/{id}/programs; POST /refuge/treatments/{id}/start"
  - priority: 9
    category: business_referential
    check: "Referenced CompatibilityDetermination must be FINAL (permit approve; grazing offering create)."
    error_id: ERR_DETERMINATION_NOT_FINAL
    http_status: 422
    applies_to: "POST /refuge/permits/{id}/approve; POST /refuge/management-units/{id}/grazing-offerings"
  - priority: 10
    category: business_referential
    check: "Referenced CompatibilityDetermination finding must be COMPATIBLE (permit approve; grazing offering create for GRAZING use_type)."
    error_id: ERR_USE_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /refuge/permits/{id}/approve; POST /refuge/management-units/{id}/grazing-offerings"
  - priority: 11
    category: business_referential
    check: "Volunteer referenced by a new assignment must have background_status == CLEARED."
    error_id: ERR_VOLUNTEER_NOT_CLEARED
    http_status: 422
    applies_to: "POST /refuge/programs/{id}/assignments"
  - priority: 12
    category: business_constraint
    check: "Permit use_type must equal the referenced determination's use_type."
    error_id: ERR_USE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /refuge/permits; POST /refuge/permits/{id}/resubmit"
  - priority: 13
    category: business_constraint
    check: "A cooperator may hold at most one SUBMITTED bid per offering."
    error_id: ERR_DUPLICATE_BID
    http_status: 422
    applies_to: "POST /refuge/grazing-offerings/{id}/bids"
  - priority: 14
    category: business_constraint
    check: "A volunteer may hold at most one ACTIVE assignment per program."
    error_id: ERR_DUPLICATE_ASSIGNMENT
    http_status: 422
    applies_to: "POST /refuge/programs/{id}/assignments"
  - priority: 15
    category: business_constraint
    check: "Program's ACTIVE assignment count must stay < max_volunteers before adding; creating an assignment when count == max_volunteers is rejected."
    error_id: ERR_PROGRAM_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /refuge/programs/{id}/assignments"
  - priority: 16
    category: business_constraint
    check: "Commercial capacity: approving a COMMERCIAL_FILMING permit is rejected when any calendar day in its [start_date, end_date] already carries MAX_COMMERCIAL_PERMITS_PER_UNIT_DAY (2) permits in {APPROVED, ACTIVE} on the same unit."
    error_id: ERR_COMMERCIAL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /refuge/permits/{id}/approve"
  - priority: 17
    category: business_constraint
    check: "Determination finalize requires unresolved_comment_count == 0."
    error_id: ERR_UNRESOLVED_COMMENTS
    http_status: 422
    applies_to: "POST /refuge/determinations/{id}/finalize"
  - priority: 18
    category: business_temporal
    check: "Date ranges valid: end >= start (end > start where the entity declares strict); determination comment_close_date > comment_open_date."
    error_id: ERR_DATE_RANGE_INVALID
    http_status: 422
    applies_to: "create endpoints with date ranges"
  - priority: 19
    category: business_temporal
    check: "Scheduled windows must not open in the past: treatment window_start, program_date, offering application_deadline and determination comment_open_date must be >= current logical clock date at creation; bids rejected when current clock date > offering.application_deadline."
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "create endpoints for HabitatTreatment, InterpretiveProgram, GrazingOffering, CompatibilityDetermination; POST /refuge/grazing-offerings/{id}/bids"
  - priority: 20
    category: business_temporal
    check: "Treatment windows on the same ManagementUnit must not overlap under half-open semantics [window_start, window_end): adjacency (one window_end == another window_start) is allowed; any strict intersection is rejected."
    error_id: ERR_TREATMENT_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /refuge/management-units/{id}/treatments"
  - priority: 21
    category: business_fiscal
    check: "Permit payment amount_cents must equal assessed_fee_cents exactly."
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /refuge/permits/{id}/pay"
  - priority: 22
    category: business_fiscal
    check: "Refund amount must not exceed refundable balance (paid_total_cents - refunded_total_cents)."
    error_id: ERR_REFUND_EXCEEDS_PAID
    http_status: 422
    applies_to: "POST /refuge/cooperative-agreements/{id}/ledger-entries (type REFUND)"
  - priority: 23
    category: business_fiscal
    check: "Agreement completion requires outstanding_balance_cents == 0."
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 422
    applies_to: "POST /refuge/cooperative-agreements/{id}/complete"
  - priority: 24
    category: business_fiscal
    check: "PAYMENT ledger entries must not exceed the current outstanding_balance_cents (no overpayment / negative balances)."
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /refuge/cooperative-agreements/{id}/ledger-entries (type PAYMENT)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/refuge/management-units"
    description: "Create a management unit."
    roles: [RefugeManager]
    code: 201
    input: [name, habitat_type, acreage]
    output: ManagementUnit
    side_effects: ["initializes computed fields: access_posture OPEN, committed_visitor_days 0, habitat scores 0"]
  - method: GET
    path: "/refuge/management-units/{id}"
    description: "Read one management unit (collection segment anchor)."
    roles: [RefugeManager, Biologist, PermitOfficer, VolunteerCoordinator, LawEnforcementOfficer, StateAgencyPartner]
    code: 200
    input: []
    output: ManagementUnit
    side_effects: []
  - method: GET
    path: "/refuge/management-units/{id}/posture"
    description: "Computed read: current derived posture snapshot of the unit."
    roles: [RefugeManager, Biologist, PermitOfficer, VolunteerCoordinator, LawEnforcementOfficer, StateAgencyPartner]
    code: 200
    input: []
    output: "{ access_posture: string, committed_visitor_days: integer, habitat_priority_breeding: integer, habitat_priority_annual: integer, active_closure_count: integer }"
    side_effects: []

  - method: POST
    path: "/refuge/determinations"
    description: "Create a compatibility determination for a proposed use (starts DRAFT)."
    roles: [PermitOfficer, RefugeManager]
    code: 201
    input: [use_type, title, comment_open_date, comment_close_date]
    output: CompatibilityDetermination
    side_effects: []
  - method: GET
    path: "/refuge/determinations/{id}"
    description: "Read one determination (collection segment anchor)."
    roles: [PermitOfficer, RefugeManager, Anonymous]
    code: 200
    input: []
    output: CompatibilityDetermination
    side_effects: []
  - method: POST
    path: "/refuge/determinations/{id}/open-comment"
    description: "Open the public comment window (DRAFT -> PUBLIC_COMMENT)."
    roles: [PermitOfficer, RefugeManager]
    code: 200
    input: []
    output: CompatibilityDetermination
    side_effects: ["status := PUBLIC_COMMENT"]
  - method: POST
    path: "/refuge/determinations/{id}/finalize"
    description: "Finalize a determination (ADJUDICATION -> FINAL); requires zero unresolved comments."
    roles: [PermitOfficer, RefugeManager]
    code: 200
    input: [finding, rationale]
    output: CompatibilityDetermination
    side_effects: ["finding/rationale set; status := FINAL"]
  - method: POST
    path: "/refuge/determinations/{id}/comments"
    description: "Submit a public comment on a determination in PUBLIC_COMMENT (public involvement)."
    roles: [Anonymous]
    code: 201
    input: [author_name, body]
    output: PublicComment
    side_effects: ["recompute determination.unresolved_comment_count (+1)"]
  - method: GET
    path: "/refuge/determinations/{id}/comments"
    description: "List comments on a determination (FK reverse reach for PublicComment.determination_id)."
    roles: [PermitOfficer, RefugeManager, Anonymous]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []
  - method: POST
    path: "/refuge/comments/{id}/adjudicate"
    description: "Adjudicate a submitted comment (SUBMITTED -> ADJUDICATED)."
    roles: [PermitOfficer, RefugeManager]
    code: 200
    input: [disposition, "note?"]
    output: PublicComment
    side_effects: ["disposition set; recompute determination.unresolved_comment_count (-1)"]

  - method: POST
    path: "/refuge/permits"
    description: "Submit a public use permit application (starts SUBMITTED; provisional fee computed)."
    roles: [PermitApplicant]
    code: 201
    input: [applicant_ref, management_unit_id, determination_id, use_type, crew_size, start_date, end_date]
    output: PermitApplication
    side_effects: ["compute provisional_fee_cents via calculations.permit_fee_assessment (provisional variant)"]
  - method: GET
    path: "/refuge/permits/{id}"
    description: "Read one permit application (collection segment anchor)."
    roles: [PermitApplicant, PermitOfficer, RefugeManager]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []
  - method: GET
    path: "/refuge/permits"
    description: "List permit applications; filtered-list FK reverse reach for applicant_ref / management_unit_id / determination_id."
    roles: [PermitApplicant, PermitOfficer, RefugeManager]
    code: 200
    input: ["applicant_ref?", "management_unit_id?", "determination_id?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []
  - method: POST
    path: "/refuge/permits/{id}/return-for-revision"
    description: "Officer returns the application for revision (SUBMITTED/UNDER_REVIEW -> REVISION_REQUESTED)."
    roles: [PermitOfficer, RefugeManager]
    code: 200
    input: [note]
    output: PermitApplication
    side_effects: ["revision_note set"]
  - method: POST
    path: "/refuge/permits/{id}/resubmit"
    description: "Applicant resubmits a returned application (REVISION_REQUESTED -> UNDER_REVIEW); optional field revisions."
    roles: [PermitApplicant]
    code: 200
    input: ["crew_size?", "start_date?", "end_date?", "note?"]
    output: PermitApplication
    side_effects: ["recompute provisional_fee_cents when crew_size/start_date/end_date supplied"]
  - method: POST
    path: "/refuge/permits/{id}/approve"
    description: "Approve an application (UNDER_REVIEW -> APPROVED); assesses the final fee; enforces determination FINAL+COMPATIBLE and commercial capacity."
    roles: [PermitOfficer, RefugeManager]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["compute assessed_fee_cents via calculations.permit_fee_assessment (assessed variant)"]
  - method: POST
    path: "/refuge/permits/{id}/pay"
    description: "Pay the assessed fee (APPROVED -> ACTIVE); amount must equal assessed_fee_cents."
    roles: [PermitApplicant]
    code: 200
    input: [amount_cents]
    output: PermitApplication
    side_effects: ["recompute ManagementUnit.committed_visitor_days (adds crew_size x trip_days)"]
  - method: POST
    path: "/refuge/permits/{id}/revoke"
    description: "Revoke a permit (UNDER_REVIEW/APPROVED/ACTIVE/SUSPENDED -> REVOKED)."
    roles: [PermitOfficer, RefugeManager]
    code: 200
    input: [reason]
    output: PermitApplication
    side_effects: ["if prior status ACTIVE: recompute ManagementUnit.committed_visitor_days (releases days)"]

  - method: POST
    path: "/refuge/management-units/{id}/treatments"
    description: "Schedule a habitat treatment window on a unit (starts SCHEDULED). Enforces nesting blackout buffer and same-unit half-open window overlap."
    roles: [Biologist, RefugeManager]
    code: 201
    input: [treatment_type, window_start, window_end, "notes?"]
    output: HabitatTreatment
    side_effects: []
  - method: GET
    path: "/refuge/management-units/{id}/treatments"
    description: "List treatments on a unit (FK reverse reach for HabitatTreatment.management_unit_id)."
    roles: [RefugeManager, Biologist, PermitOfficer, VolunteerCoordinator, LawEnforcementOfficer, StateAgencyPartner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HabitatTreatment[]
    side_effects: []
  - method: POST
    path: "/refuge/treatments/{id}/start"
    description: "Begin execution of a window-open treatment (WINDOW_OPEN -> IN_PROGRESS)."
    roles: [Biologist, RefugeManager]
    code: 200
    input: []
    output: HabitatTreatment
    side_effects: []
  - method: POST
    path: "/refuge/treatments/{id}/complete"
    description: "Complete a treatment (IN_PROGRESS -> COMPLETED); recomputes unit habitat priority scores."
    roles: [Biologist, RefugeManager]
    code: 200
    input: []
    output: HabitatTreatment
    side_effects: ["recompute ManagementUnit.habitat_priority_breeding and habitat_priority_annual via calculations.habitat_priority_score"]

  - method: POST
    path: "/refuge/management-units/{id}/closures"
    description: "Schedule a facility closure on a unit (starts SCHEDULED)."
    roles: [Biologist, RefugeManager]
    code: 201
    input: [closure_type, scope, start_date, end_date]
    output: FacilityClosure
    side_effects: []
  - method: GET
    path: "/refuge/management-units/{id}/closures"
    description: "List closures on a unit (FK reverse reach for FacilityClosure.management_unit_id)."
    roles: [RefugeManager, Biologist, PermitOfficer, VolunteerCoordinator, LawEnforcementOfficer, StateAgencyPartner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FacilityClosure[]
    side_effects: []
  - method: POST
    path: "/refuge/closures/{id}/activate"
    description: "Activate a scheduled closure (SCHEDULED -> ACTIVE); fires program-cancellation, assignment-release, and permit-suspension cascades."
    roles: [Biologist, RefugeManager]
    code: 200
    input: []
    output: FacilityClosure
    side_effects:
      - "recompute ManagementUnit.access_posture"
      - "cascade: overlapping SCHEDULED InterpretivePrograms on the unit -> CANCELLED; their ACTIVE VolunteerAssignments -> RELEASED"
      - "cascade (scope FULL only): overlapping ACTIVE PermitApplications -> SUSPENDED (suspended_by_closure_id set); each recomputes ManagementUnit.committed_visitor_days"
  - method: POST
    path: "/refuge/closures/{id}/lift"
    description: "Lift an active closure (ACTIVE -> LIFTED); reinstates permits suspended by this closure whose window is still valid, expires the rest; cancelled programs are not restored."
    roles: [Biologist, RefugeManager]
    code: 200
    input: []
    output: FacilityClosure
    side_effects:
      - "recompute ManagementUnit.access_posture"
      - "cascade: permits with suspended_by_closure_id == closure.id -> ACTIVE (end_date >= clock date) else EXPIRED; reinstates recompute ManagementUnit.committed_visitor_days"

  - method: POST
    path: "/refuge/management-units/{id}/programs"
    description: "Schedule an interpretive program (starts SCHEDULED); rejected when program_date intersects an ACTIVE FULL closure window (ERR_POSTURE_CLOSED)."
    roles: [VolunteerCoordinator, RefugeManager]
    code: 201
    input: [title, program_date, min_volunteers, max_volunteers]
    output: InterpretiveProgram
    side_effects: []
  - method: GET
    path: "/refuge/management-units/{id}/programs"
    description: "List programs on a unit (FK reverse reach for InterpretiveProgram.management_unit_id)."
    roles: [VolunteerCoordinator, RefugeManager, Anonymous]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InterpretiveProgram[]
    side_effects: []

  - method: POST
    path: "/refuge/volunteers"
    description: "Register a volunteer (background_status PENDING)."
    roles: [Anonymous]
    code: 201
    input: [full_name, email]
    output: Volunteer
    side_effects: []
  - method: POST
    path: "/refuge/volunteers/{id}/clear-background"
    description: "Clear a volunteer's background check (PENDING/EXPIRED -> CLEARED); stamps cleared_on with the current logical clock date."
    roles: [VolunteerCoordinator, RefugeManager]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["cleared_on := current logical clock date"]

  - method: POST
    path: "/refuge/programs/{id}/assignments"
    description: "Assign a volunteer to a program (starts ACTIVE); requires volunteer CLEARED, program SCHEDULED, capacity and uniqueness checks."
    roles: [VolunteerCoordinator, RefugeManager]
    code: 201
    input: [volunteer_id]
    output: VolunteerAssignment
    side_effects: []
  - method: GET
    path: "/refuge/assignments/{id}"
    description: "Read one assignment (collection segment anchor)."
    roles: [VolunteerCoordinator, RefugeManager, Volunteer]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects: []
  - method: GET
    path: "/refuge/assignments"
    description: "List assignments; filtered-list FK reverse reach for volunteer_id and program_id. Volunteer callers may only query their own volunteer_id (else ERR_UNAUTHORIZED_ROLE)."
    roles: [VolunteerCoordinator, RefugeManager, Volunteer]
    code: 200
    input: ["volunteer_id?", "program_id?", "status?", "limit?", "offset?"]
    output: VolunteerAssignment[]
    side_effects: []

  - method: POST
    path: "/refuge/management-units/{id}/grazing-offerings"
    description: "Post a cooperative grazing offering (starts OPEN); requires a FINAL COMPATIBLE determination with use_type GRAZING."
    roles: [Biologist, RefugeManager]
    code: 201
    input: [description, aum_cap, grazing_window_start, grazing_window_end, application_deadline, min_stewardship_rating]
    output: GrazingOffering
    side_effects: []
  - method: GET
    path: "/refuge/management-units/{id}/grazing-offerings"
    description: "List offerings on a unit (FK reverse reach for GrazingOffering.management_unit_id)."
    roles: [Biologist, RefugeManager, Cooperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GrazingOffering[]
    side_effects: []
  - method: GET
    path: "/refuge/grazing-offerings/{id}"
    description: "Read one offering (collection segment anchor)."
    roles: [Biologist, RefugeManager, Cooperator]
    code: 200
    input: []
    output: GrazingOffering
    side_effects: []
  - method: POST
    path: "/refuge/grazing-offerings/{id}/bids"
    description: "Submit a cooperator bid on an OPEN offering (one SUBMITTED bid per cooperator per offering)."
    roles: [Cooperator]
    code: 201
    input: [cooperator_ref, rate_cents_per_aum, stewardship_rating]
    output: CooperatorBid
    side_effects: []
  - method: GET
    path: "/refuge/grazing-offerings/{id}/bids"
    description: "List bids on an offering (FK reverse reach for CooperatorBid.offering_id)."
    roles: [Biologist, RefugeManager, Cooperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CooperatorBid[]
    side_effects: []
  - method: POST
    path: "/refuge/grazing-offerings/{id}/close-and-select"
    description: "Close bidding and select a participant via calculations.bid_selection_ranking; creates the CooperativeAgreement on award, or expires the offering on an empty eligible pool."
    roles: [RefugeManager]
    code: 200
    input: []
    output: GrazingOffering
    side_effects:
      - "winner bid -> WINNING; all other SUBMITTED bids -> REJECTED (all SUBMITTED -> REJECTED when pool empty and offering -> EXPIRED)"
      - "on award: create CooperativeAgreement (ACTIVE, compliance_points 100, totals 0) copying unit/window/aum_cap from offering and cooperator_ref from winning bid"

  - method: GET
    path: "/refuge/cooperative-agreements/{id}"
    description: "Read one cooperative agreement (collection segment anchor)."
    roles: [RefugeManager, Biologist, Cooperator]
    code: 200
    input: []
    output: CooperativeAgreement
    side_effects: []
  - method: GET
    path: "/refuge/cooperative-agreements"
    description: "List cooperative agreements; filtered-list FK reverse reach for management_unit_id and winning_bid_id."
    roles: [RefugeManager, Biologist, Cooperator]
    code: 200
    input: ["management_unit_id?", "winning_bid_id?", "status?", "limit?", "offset?"]
    output: CooperativeAgreement[]
    side_effects: []
  - method: POST
    path: "/refuge/cooperative-agreements/{id}/assess"
    description: "Record one period's cost-share assessment (per-period rounding, then summed). Requires ACTIVE and OCC expected_agreement_version."
    roles: [Biologist, RefugeManager]
    code: 200
    input: [period_key, aum_used, rate_cents_per_aum, expected_agreement_version]
    output: CooperativeAgreement
    side_effects:
      - "compute period amount via calculations.cost_share_assessment; assessed_total_cents += period amount; recompute outstanding_balance_cents"
      - "increments CooperativeAgreement.version by 1"
  - method: POST
    path: "/refuge/cooperative-agreements/{id}/ledger-entries"
    description: "Record a ledger entry on an agreement. type PAYMENT (owning Cooperator only) reduces outstanding and must not exceed it (ERR_OVERPAYMENT); type REFUND (RefugeManager only) restores it, capped at the refundable balance (ERR_REFUND_EXCEEDS_PAID). Allowed in ACTIVE and SUSPENDED."
    roles: [Cooperator, RefugeManager]
    code: 200
    input: [type, amount_cents]
    output: CooperativeAgreement
    side_effects:
      - "PAYMENT: paid_total_cents += amount; REFUND: refunded_total_cents += amount; recompute outstanding_balance_cents"
      - "increments CooperativeAgreement.version by 1"
  - method: POST
    path: "/refuge/cooperative-agreements/{id}/complete"
    description: "Complete an agreement at season end (ACTIVE -> COMPLETED); requires zero outstanding balance."
    roles: [RefugeManager]
    code: 200
    input: []
    output: CooperativeAgreement
    side_effects: []

  - method: POST
    path: "/refuge/citations"
    description: "Issue a citation against a permit or an agreement (exactly one subject). Agreement-subject citations debit compliance_points and may cascade-suspend. OCC expected_agreement_version required when subject_agreement_id is supplied."
    roles: [LawEnforcementOfficer, RefugeManager]
    code: 201
    input: [severity, note, "subject_permit_id?", "subject_agreement_id?", "expected_agreement_version?"]
    output: Citation
    side_effects:
      - "if subject_agreement_id: agreement.compliance_points -= points(severity); increments CooperativeAgreement.version by 1; if points < 60 cascade agreement -> SUSPENDED"
      - "permit-subject citations record the violation only (no fee or status effect)"
  - method: GET
    path: "/refuge/citations/{id}"
    description: "Read one citation (collection segment anchor)."
    roles: [LawEnforcementOfficer, RefugeManager, PermitOfficer]
    code: 200
    input: []
    output: Citation
    side_effects: []
  - method: GET
    path: "/refuge/citations"
    description: "List citations; filtered-list FK reverse reach for subject_permit_id and subject_agreement_id."
    roles: [LawEnforcementOfficer, RefugeManager, PermitOfficer]
    code: 200
    input: ["subject_permit_id?", "subject_agreement_id?", "status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []
  - method: POST
    path: "/refuge/citations/{id}/void"
    description: "Void an issued citation (ISSUED -> VOIDED); restores agreement compliance points and may cascade-reinstate a SUSPENDED agreement."
    roles: [LawEnforcementOfficer, RefugeManager]
    code: 200
    input: [reason]
    output: Citation
    side_effects:
      - "if subject_agreement_id: agreement.compliance_points += points; if agreement SUSPENDED and restored points >= 60, cascade SUSPENDED -> ACTIVE"
      - "increments CooperativeAgreement.version by 1 (agreement subjects only)"

  - method: POST
    path: "/refuge/management-units/{id}/population-objectives"
    description: "State-partner sets an annual population objective for a species on a unit."
    roles: [StateAgencyPartner, RefugeManager]
    code: 201
    input: [species, target_count]
    output: PopulationObjective
    side_effects: []
  - method: GET
    path: "/refuge/management-units/{id}/population-objectives"
    description: "List population objectives on a unit (FK reverse reach for PopulationObjective.management_unit_id)."
    roles: [RefugeManager, Biologist, PermitOfficer, VolunteerCoordinator, LawEnforcementOfficer, StateAgencyPartner]
    code: 200
    input: ["limit?", "offset?"]
    output: PopulationObjective[]
    side_effects: []
  - method: POST
    path: "/refuge/population-objectives/{id}/surveys"
    description: "Record a survey count for an objective; recomputes AT_TARGET / BELOW_TARGET status."
    roles: [StateAgencyPartner, RefugeManager]
    code: 200
    input: [survey_count]
    output: PopulationObjective
    side_effects: ["current_survey_count := survey_count; recompute status via calculations.population_deviation"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (outside the /refuge business surface): set the logical clock. Startup default before any call is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All server-minted timestamps (created_at, updated_at, api_request_timestamp) read this logical clock, and date comparisons use its UTC date portion. Advancing the clock fires auto-transitions in this pinned order: (1) determinations PUBLIC_COMMENT past close -> ADJUDICATION; (2) treatments SCHEDULED/WINDOW_OPEN window transitions (WINDOW_OPEN when clock inside window, EXPIRED when past window_end); (3) volunteers CLEARED past cleared_on + 365 days -> EXPIRED with assignment-release and program-shortfall cascades; (4) programs SCHEDULED past program_date -> COMPLETED with assignment completion cascade; (5) permits ACTIVE past end_date -> COMPLETED."
    roles: [RefugeManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "applies the five pinned auto-transition classes listed in the description, in order"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing/unknown, or X-User-ID missing for a non-Anonymous role."
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Role not in endpoint roles, or ownership anchor violated (applicant_ref / cooperator_ref / volunteer self-scope mismatch)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, wrong type, invalid enum member, or citation with zero/two subjects."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK reference does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine precondition failed: wrong from-state or terminal-state transition attempt."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_agreement_version does not match the CooperativeAgreement's current version."
  - id: ERR_NESTING_BLACKOUT
    http: 422
    condition: "PRESCRIBED_BURN window violates the 14-day buffer before a NESTING closure (SCHEDULED or ACTIVE) on the same unit."
  - id: ERR_POSTURE_CLOSED
    http: 422
    condition: "Program date intersects an ACTIVE FULL closure window (program create), or unit posture at current clock date is CLOSED (treatment start)."
  - id: ERR_DETERMINATION_NOT_FINAL
    http: 422
    condition: "Permit approve or grazing-offering create references a determination not yet FINAL."
  - id: ERR_USE_INCOMPATIBLE
    http: 422
    condition: "Referenced determination is FINAL with finding NOT_COMPATIBLE."
  - id: ERR_VOLUNTEER_NOT_CLEARED
    http: 422
    condition: "Assignment references a volunteer whose background_status is not CLEARED."
  - id: ERR_USE_TYPE_MISMATCH
    http: 422
    condition: "Permit use_type differs from the referenced determination's use_type."
  - id: ERR_DUPLICATE_BID
    http: 422
    condition: "Cooperator already holds a SUBMITTED bid on the offering."
  - id: ERR_DUPLICATE_ASSIGNMENT
    http: 422
    condition: "Volunteer already holds an ACTIVE assignment on the program."
  - id: ERR_PROGRAM_CAPACITY_EXCEEDED
    http: 422
    condition: "Program already carries max_volunteers ACTIVE assignments."
  - id: ERR_COMMERCIAL_CAPACITY_EXCEEDED
    http: 422
    condition: "Approving would place more than 2 concurrent {APPROVED, ACTIVE} COMMERCIAL_FILMING permits on some calendar day on the unit."
  - id: ERR_UNRESOLVED_COMMENTS
    http: 422
    condition: "Determination finalize attempted with unresolved_comment_count > 0."
  - id: ERR_DATE_RANGE_INVALID
    http: 422
    condition: "end precedes start (or comment_close_date <= comment_open_date, etc.)."
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "Scheduled window/date opens before the current logical clock date, or bid submitted after the offering's application_deadline."
  - id: ERR_TREATMENT_WINDOW_OVERLAP
    http: 422
    condition: "Same-unit treatment windows strictly intersect under half-open [start, end) semantics."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 402
    condition: "Permit payment amount_cents differs from assessed_fee_cents."
  - id: ERR_REFUND_EXCEEDS_PAID
    http: 422
    condition: "REFUND exceeds refundable balance (paid_total_cents - refunded_total_cents)."
  - id: ERR_OUTSTANDING_BALANCE
    http: 422
    condition: "Agreement completion attempted with outstanding_balance_cents != 0."
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "PAYMENT ledger entry amount_cents exceeds current outstanding_balance_cents."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RefugeManager
    description: "Refuge manager; hierarchical override over all staff operations plus exclusive unit creation, award selection, refunds and agreement completion."
    identity: "opaque"
    exclusive_operations:
      - "POST /refuge/management-units"
      - "POST /refuge/grazing-offerings/{id}/close-and-select"
      - "POST /refuge/cooperative-agreements/{id}/ledger-entries (type REFUND)"
      - "POST /refuge/cooperative-agreements/{id}/complete"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all staff read endpoints; may perform any Biologist / PermitOfficer / VolunteerCoordinator / LawEnforcementOfficer / StateAgencyPartner operation"
  - name: Biologist
    description: "Refuge biologist; owns habitat treatments, closures and grazing offering lifecycle, period assessments."
    identity: "opaque"
    exclusive_operations:
      - "POST /refuge/management-units/{id}/treatments (shared only with RefugeManager override)"
      - "POST /refuge/management-units/{id}/closures"
      - "POST /refuge/closures/{id}/activate | lift"
      - "POST /refuge/management-units/{id}/grazing-offerings"
      - "POST /refuge/cooperative-agreements/{id}/assess"
    shared_operations: ["staff read endpoints"]
  - name: PermitOfficer
    description: "Permits and compatibility officer; owns determinations, comment adjudication, permit review/approve/revoke."
    identity: "opaque"
    exclusive_operations:
      - "POST /refuge/determinations; open-comment; finalize"
      - "POST /refuge/comments/{id}/adjudicate"
      - "POST /refuge/permits/{id}/return-for-revision | approve | revoke"
    shared_operations: ["staff read endpoints", "GET /refuge/citations"]
  - name: VolunteerCoordinator
    description: "Coordinates volunteers and interpretive programs."
    identity: "opaque"
    exclusive_operations:
      - "POST /refuge/management-units/{id}/programs"
      - "POST /refuge/volunteers/{id}/clear-background"
      - "POST /refuge/programs/{id}/assignments"
    shared_operations: ["staff read endpoints"]
  - name: LawEnforcementOfficer
    description: "Refuge law enforcement; citation authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /refuge/citations"
      - "POST /refuge/citations/{id}/void"
    shared_operations: ["staff read endpoints"]
  - name: StateAgencyPartner
    description: "State wildlife agency partner; sets population objectives and records surveys."
    identity: "opaque"
    exclusive_operations:
      - "POST /refuge/management-units/{id}/population-objectives"
      - "POST /refuge/population-objectives/{id}/surveys"
    shared_operations: ["staff read endpoints"]
  - name: PermitApplicant
    description: "Public applicant; owns their permit applications via applicant_ref == X-User-ID."
    identity: "opaque"
    exclusive_operations:
      - "POST /refuge/permits"
      - "POST /refuge/permits/{id}/resubmit"
      - "POST /refuge/permits/{id}/pay"
    shared_operations: ["GET /refuge/permits and GET /refuge/permits/{id} restricted to own applicant_ref"]
  - name: Cooperator
    description: "Farmers/graziers bidding on offerings and paying their agreements; owns bids via cooperator_ref == X-User-ID."
    identity: "opaque"
    exclusive_operations:
      - "POST /refuge/grazing-offerings/{id}/bids"
      - "POST /refuge/cooperative-agreements/{id}/ledger-entries (type PAYMENT, own agreement only)"
    shared_operations: ["GET offering/bid/agreement reads"]
  - name: Volunteer
    description: "Registered volunteer; reads own assignments."
    identity: "entity_backed:Volunteer"
    exclusive_operations: []
    shared_operations: ["GET /refuge/assignments and GET /refuge/assignments/{id} restricted to own volunteer_id"]
  - name: Anonymous
    description: "Unauthenticated public; comment submission, volunteer self-registration, public reads."
    identity: "opaque"
    exclusive_operations:
      - "POST /refuge/determinations/{id}/comments"
      - "POST /refuge/volunteers"
    shared_operations:
      - "GET /refuge/determinations/{id}"
      - "GET /refuge/determinations/{id}/comments"
      - "GET /refuge/management-units/{id}/programs"
