            - "appeal at 2026-10-16 (31 days later) returns 409 ERR_APPEAL_WINDOW_CLOSED"
            - "status remains DECIDED_DENIED and appeal_round stays 1"

      - name: quorum_full_fourth_assignment_rejected
        claim_type: invalid_transition
        grounds:
          - errors.ERR_REVIEW_QUORUM_FULL
          - calculations.blind_reviewer_selection
        distinguishing_aspect: "A round holds at most 3 active assignments: with three OFFERED outstanding, a fourth blind assign is rejected ERR_REVIEW_QUORUM_FULL even though a fourth ELIGIBLE reviewer exists."
        test_recipe:
