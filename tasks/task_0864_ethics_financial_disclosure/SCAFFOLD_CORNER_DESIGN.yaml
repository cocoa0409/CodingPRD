  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_statement_returns_conflict
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_STATEMENT]"]
        distinguishing_aspect: "A second statement for the same (filer, filing_period) while the first is non-SUPERSEDED returns ERR_DUPLICATE_STATEMENT."
        test_recipe:
          setup: ["One DRAFT statement already exists for (filer, period)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt1_id: $.data.id }
          trigger:
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_STATEMENT"

      - name: statement_create_against_closed_period_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=17]", "entities.FilingPeriod.fields.status", "errors[ERR_PERIOD_CLOSED]"]
        distinguishing_aspect: "Creating a statement against a FilingPeriod with status CLOSED returns ERR_PERIOD_CLOSED."
        test_recipe:
          setup: ["A CLOSED filing period."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2023-01-01T00:00:00Z", coverage_end: "2023-12-31T00:00:00Z", due_at: "2024-06-01T00:00:00Z", status: "CLOSED" }
              as: Registrar
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PERIOD_CLOSED"

      - name: recusal_adjacent_half_open_allowed
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=10]", "entities.RecusalEntry.fields.effective_end"]
        distinguishing_aspect: "Two recusals on the same (filer, matter) with touching half-open intervals [.,2026-06-10) and [2026-06-10,.) do NOT overlap and both succeed (open_recusal_count 2)."
        test_recipe:
          setup: ["Filer with one DECLARED recusal on M1 over [2026-06-01, 2026-06-10)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /recusals"
              payload: { filer_id: "${filer_id}", matter_id: "M1", effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-10T00:00:00Z" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { rec1_id: $.data.id }
          trigger:
            - call: "POST /recusals"
              payload: { filer_id: "${filer_id}", matter_id: "M1", effective_start: "2026-06-10T00:00:00Z", effective_end: "2026-06-20T00:00:00Z" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { rec2_id: $.data.id }
          assert:
            - "RecusalEntry.${rec2_id}.status == DECLARED"
            - "Filer.${filer_id}.open_recusal_count == 2"

      - name: gift_travel_empty_legs_returns_invalid_payload
        claim_type: Conditional validation
        grounds: ["validations[priority=18]", "errors[ERR_INVALID_GIFT_KIND_PAYLOAD]"]
        distinguishing_aspect: "A gift_kind TRAVEL report with an empty travel_legs array returns ERR_INVALID_GIFT_KIND_PAYLOAD (checked after the training gate passes)."
        test_recipe:
          setup: ["Filer CURRENT training."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          trigger:
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "ConfOrg", gift_kind: "TRAVEL", received_at: "2026-05-01T00:00:00Z", travel_legs: [] }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_GIFT_KIND_PAYLOAD"

      - name: list_pagination_limit_too_large_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=19]", "errors[ERR_PAGINATION_INVALID]", "response_envelope"]
        distinguishing_aspect: "GET /filers with limit 500 (above max 100) returns ERR_PAGINATION_INVALID."
        test_recipe:
          setup: ["Empty DB (no rows required to reject bad pagination)."]
          setup_api_calls: []
          trigger:
            - call: "GET /filers?limit=500"
              payload: { limit: 500 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PAGINATION_INVALID"

  # =========================================================================
  # Endpoints (incl. OCC concurrency + FK reverse-reachability)
  # =========================================================================
  - section: endpoints
    instances:
      - name: publish_stale_statement_version_returns_412
        claim_type: Conditional action
        grounds: ["state_machines.Statement.concurrency_rules.publish-stale-statement", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a successful publish bumps Statement.version, a second publish still carrying the pre-publish version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An ACCEPTED statement; client captured its version before the first publish."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "SENIOR_STAFF" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /statements/${stmt_id}/accept"
              payload: {}
              as: EthicsOfficer
            - call: "GET /statements/${stmt_id}"
              payload: {}
              as: Registrar
              captures: { v_pre: $.data.version }
            - call: "POST /statements/${stmt_id}/publish"
              payload: { expected_statement_version: "${v_pre}" }
              as: Registrar
          trigger:
            - call: "POST /statements/${stmt_id}/publish"
              payload: { expected_statement_version: "${v_pre}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: gift_reports_reverse_reachable_by_filer_id
        claim_type: Cross-reference link
        grounds: [entities.GiftReport.fields.filer_id, endpoints]
        distinguishing_aspect: "A cascade/side-effect-agnostic filtered list GET /gift-reports?filer_id returns the filer's gift reports (FK reverse-reachability)."
        test_recipe:
          setup: ["Filer CURRENT training with one reported gift."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "Acme", gift_kind: "GIFT", received_at: "2026-05-01T00:00:00Z", fair_market_value_cents: 3000 }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { gift_id: $.data.id }
          trigger:
            - call: "GET /gift-reports?filer_id=${filer_id}"
              payload: { filer_id: "${filer_id}" }
              as: EthicsOfficer
          assert:
            - "response.response_type == array"
            - "response.meta pagination total_count == 1"
            - "GET /gift-reports?filer_id=${filer_id} data[0].id == ${gift_id}"

  # =========================================================================
  # Errors / RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["A filer exists; the request under test is sent with NO auth headers."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
          trigger:
            - call: "GET /filers/${filer_id}"
              payload: {}
              as: Public
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: filer_cannot_create_jurisdiction_returns_unauthorized
        claim_type: Cannot perform others' exclusive op
        grounds: ["roles", "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Filer calling POST /jurisdictions (a Registrar-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A registered filer acting as Filer."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "Rogue Board" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: filer_cannot_submit_other_filers_statement
        claim_type: peer_roles ownership isolation
        grounds: ["validations[priority=6]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Filer B submitting Filer A's statement returns ERR_NOT_RESOURCE_OWNER; entity_backed ownership is enforced by X-User-ID."
        test_recipe:
          setup: ["Filer A (CURRENT training) with a DRAFT statement; Filer B also registered."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
