            - "GET the first case: case_status still 'PRESENTED' and funding_status still 'UNFUNDED' (the cascade defers presentations, it does not rewind cases that were never denied)."
      - name: corner_clock_advance_expires_only_sources_past_their_expiry_date
        claim_type: conditional_cascade
        grounds: ["endpoints[POST /_clock/set_current_utc]", "entities.FundingSource.fields.status"]
        distinguishing_aspect: "Advancing the logical clock to 2026-10-15 must expire only the source whose expires_on is 2026-09-30 and leave the 2026-11-30 source and the never-expiring UNRESTRICTED source OPEN. An implementation that expires every source, or none, cannot produce the mixed result, and the returned expired_funding_source_ids list must name exactly one id."
        test_recipe:
          setup:
            - "Three OPEN FundingSources: FS_EARLY expiring 2026-09-30, FS_LATE expiring 2026-11-30, and FS_NONE with no expires_on."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /funding-sources
              payload: { label: "Early grant", source_type: "FOUNDATION_GRANT", restriction_code: "STRUCTURE_REPAIR_ONLY", total_cents: 500000, expires_on: "2026-09-30", admin_retention_allowed: true }
              as: LTRGAdmin
              as_user_id: u_admin_1
              captures: { fse: "$.data.id" }
            - call: POST /funding-sources
              payload: { label: "Late grant", source_type: "FOUNDATION_GRANT", restriction_code: "STRUCTURE_REPAIR_ONLY", total_cents: 500000, expires_on: "2026-11-30", admin_retention_allowed: true }
              as: LTRGAdmin
              as_user_id: u_admin_1
              captures: { fsl: "$.data.id" }
            - call: POST /funding-sources
              payload: { label: "Open-ended donations", source_type: "INDIVIDUAL_DONATION", restriction_code: "UNRESTRICTED", total_cents: 500000, admin_retention_allowed: true }
              as: LTRGAdmin
              as_user_id: u_admin_1
              captures: { fsn: "$.data.id" }
          trigger:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: GET /funding-sources
              payload: { status: "EXPIRED" }
              as: DisbursementOfficer
              as_user_id: u_do_1
            - call: GET /funding-sources
              payload: { status: "OPEN" }
              as: DisbursementOfficer
              as_user_id: u_do_1
          assert:
            - "The clock response reports current_utc '2026-10-15T00:00:00Z' and expired_funding_source_ids containing exactly one element, ${fse}."
            - "GET /funding-sources?status=EXPIRED returns total_count 1 containing only ${fse}."
            - "GET /funding-sources?status=OPEN returns total_count 2 containing ${fsl} and ${fsn}, each still with available_cents 500000."
      - name: corner_parallel_case_dimensions_move_independently
        claim_type: parallel
        grounds: ["state_machines.RecoveryCase.case_status", "state_machines.RecoveryCase.funding_status"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_funding_status_reaches_satisfied_while_case_status_holds_active_recovery
          rationale: "That §1.8 instance drives funding_status from FULLY_COMMITTED through DISBURSING to SATISFIED while asserting case_status stays ACTIVE_RECOVERY, which is exactly the independent-dimension claim."
      - name: corner_project_suspend_cross_entity_side_effects
        claim_type: cross_entity
        grounds: ["state_machines.ConstructionProject.transitions.IN_PROGRESS_to_SUSPENDED"]
        excluded_because:
          difficulty_instance: transitive_cascade / project_suspend_cascades_deployment_housing_lodging_and_counters
          rationale: "That §1.8 instance asserts the deployment, housing assignment, lodging site and counter effects of one SUSPEND end to end."
      - name: corner_reverse_compensates_every_original_side_effect
        claim_type: compensation
        grounds: ["state_machines.Disbursement.transitions.PAID_to_REVERSED"]
        excluded_because:
          difficulty_instance: compensating_invariant / reverse_restores_funding_source_conservation_identity_exactly
          rationale: "That §1.8 instance asserts the full FundingSource conservation identity before and after the reversal with no drift."
      - name: corner_housing_release_syncs_lodging_site_ledger
        claim_type: ledger_sync
        grounds: ["endpoints[POST /housing-assignments/{id}/release]", "entities.LodgingSite.fields.peak_committed_beds"]
        distinguishing_aspect: "Releasing one of two overlapping assignments must re-derive the site's peak_committed_beds from the survivors only, dropping it from 18 to 6 and flipping status FULL -> OPEN with available_beds 12. An implementation that decrements a counter rather than re-deriving the per-night peak reports 12 remaining beds occupied instead of 6."
        test_recipe:
          setup:
            - "LodgingSite L with bed_capacity 18. Group P (12 beds) and Group Q (6 beds) both booked 2026-09-07 -> 2026-09-10, filling the site to exactly 18 on the nights of 09-07, 09-08 and 09-09."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
