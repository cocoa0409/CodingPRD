            - { call: "POST /api/permits", payload: { face_id: "${fa}", permit_number: "P-2A", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/permits", payload: { face_id: "${fb}", permit_number: "P-2B", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/permits", payload: { face_id: "${fc}", permit_number: "P-2C", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
