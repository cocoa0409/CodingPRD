              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "A", rating: 5, text: "Great", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev1: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r2", author_name: "B", rating: 3, text: "Fine", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev2: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r3", author_name: "C", rating: 2, text: "Poor", posted_at: "2026-05-01T00:00:00Z" }
