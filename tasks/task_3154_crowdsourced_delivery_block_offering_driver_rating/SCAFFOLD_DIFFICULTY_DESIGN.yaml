      400 pts at 2026-08-20} read at 2026-09-01 yields rating_score_x100 == 400 (rolling 90d excludes the 103-day-old event) but lifetime_rating_x100
      == 420 ((400*100 + 500*25) / 125) — two valid algorithms, different results.
