# =============================================================================
# PRD Benchmark Seed Tables — Real Estate Team & Lead Routing Operations
# =============================================================================

scenario: |
  Real Estate Team & Lead Routing Operations (real estate mega-team): lead
  source intake & speed-to-lead routing rules, agent capacity/round-robin &
  performance-based distribution, lead claim window & reassignment on
  non-response, referral fee & internal split agreements, nurture campaign
  staging by lead temperature, conversion attribution & source ROI, agent
  onboarding to the roster & offboarding of pipeline, accountability metrics.

domain_name: real-estate-team-lead-routing
api_prefix: /crm

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - selector_policy            # deterministic agent selection: eligibility, ranking, tie-break, empty-pool fallback, retry exclusion
    - rate_threshold_triggers    # performance tier / temperature / budget boundaries with pinned >= vs <= semantics
    - optimistic_concurrency     # OCC on Team.version for policy activation (create-with-supersede)
    - derived_field_reconciliation # agent active_lead_count, source monthly spend, trailing-90d stats stay consistent across cascades
  entity_topology: flat          # peer entities joined by foreign keys; no URL nesting except action endpoints and the two declared sub-resource GETs
  state_machine_shape: parallel  # Lead carries status x temperature as independent dimensions; Agent and Deal machines are cyclic
  relationship_patterns:
    - one_to_many
    - self_referential           # Assignment.supersedes_assignment_id reassignment chain
    - cross_aggregate            # Deal snapshots ReferralPartner / SplitAgreement terms across aggregates
  role_model: hierarchical_override  # TeamAdmin superset; TeamLeader mid-tier entity-backed; Agent base; ReferralPartner narrow
  consistency_model: immediate   # every mutation's side effects and recomputes are visible in the same response

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Team display name" }
      - { name: market, type: string, source: input, description: "Market / metro label" }
      - { name: timezone, type: string, source: input, description: "IANA timezone used for calendar-month budget boundaries" }
      - { name: speed_to_lead_window_seconds, type: integer, source: input, default: 900, description: "Default SLA: max seconds from lead intake to first agent response; overridable per RoutingPolicy" }
      - { name: claim_window_seconds, type: integer, source: input, default: 7200, description: "Default seconds an offered agent has to claim before reassignment; overridable per RoutingPolicy" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; roster this agent belongs to" }
      - { name: display_name, type: string, source: input, description: "Agent display name" }
      - { name: license_number, type: string, source: input, description: "License number; unique per team" , constraints: "unique among Agent rows with the same team_id" }
      - { name: role_on_team, type: enum, source: input, default: MEMBER, description: "MEMBER | LEADER; LEADER identity backs the TeamLeader role" , constraints: "MEMBER | LEADER" }
      - { name: max_active_leads, type: integer, source: input, description: "Capacity ceiling: max leads with status in {OFFERED, CLAIMED, WORKING, UNDER_CONTRACT} assigned to this agent" , constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | PAUSED | OFFBOARDING | OFFBOARDED" , constraints: "see Agent state machine" }
      - { name: performance_tier, type: enum, source: computed, default: BRONZE, description: "BRONZE | SILVER | GOLD | PLATINUM; recomputed from trailing stats after every conversion/claim/response or import-production-stats" , constraints: "BRONZE | SILVER | GOLD | PLATINUM" }
      - { name: active_lead_count, type: integer, source: computed, default: 0, description: "Count of assigned leads with status in {OFFERED, CLAIMED, WORKING, UNDER_CONTRACT}; reconciled on every assignment-affecting mutation" }
      - { name: trailing_90d_conversions, type: integer, source: computed, default: 0, description: "Deals APPROVED or PAID_OUT with approved_at within the trailing 90 days where this agent is closing agent" }
      - { name: trailing_90d_claimed, type: integer, source: computed, default: 0, description: "Assignments CLAIMED by this agent within the trailing 90 days" }
      - { name: trailing_90d_offered, type: integer, source: computed, default: 0, description: "Assignments OFFERED to this agent within the trailing 90 days (denominator of claim rate)" }
      - { name: avg_first_response_seconds, type: integer, source: computed, default: null, description: "Mean of (first_response_at - Lead.created_at) over this agent's leads with first_response_at set, trailing 90 days; null when no responses" }
      - { name: consecutive_missed_claims, type: integer, source: system, default: 0, description: "Deadline-expiry miss streak; reset to 0 on successful claim and on resume; reaching 3 auto-pauses the agent" }
      - { name: last_assigned_at, type: datetime, source: system, default: null, description: "Timestamp of the most recent Assignment created for this agent; round-robin sort key" }
      - { name: onboarded_at, type: datetime, source: system, description: "Set when the agent first reaches ACTIVE" }

  - name: AgentTimeOff
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; agent taking time off" }
      - { name: starts_at, type: datetime, source: input, description: "Inclusive start of the time-off block (closed interval)" }
      - { name: ends_at, type: datetime, source: input, description: "Inclusive end of the time-off block (closed interval); must be strictly after starts_at" }
      - { name: reason, type: string, source: input, description: "Free-text reason. Blocks are approved on creation; creation is rejected when the new [starts_at, ends_at] block intersects an existing block under CLOSED-interval semantics (touching endpoints conflict)" }

  - name: RoutingPolicy
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; team this policy belongs to" }
      - { name: version_no, type: integer, source: system, description: "Per-team sequential policy revision starting at 1" }
      - { name: mode, type: enum, source: input, description: "ROUND_ROBIN | PERFORMANCE_WEIGHTED; default selector mode" , constraints: "ROUND_ROBIN | PERFORMANCE_WEIGHTED" }
      - { name: tier_weight_bps, type: object, source: input, default: "{BRONZE: 10000, SILVER: 11000, GOLD: 12500, PLATINUM: 15000}", description: "Performance-weighted selector multipliers per performance_tier, in basis points" }
      - { name: source_mode_overrides, type: object, source: input, default: "{}", description: "Optional map of LeadSource.type to mode; overrides policy.mode for leads from that source type" }
      - { name: claim_window_seconds, type: integer, source: input, default: null, description: "Optional override of Team.claim_window_seconds for leads routed under this policy" }
      - { name: speed_to_lead_window_seconds, type: integer, source: input, default: null, description: "Optional override of Team.speed_to_lead_window_seconds for leads routed under this policy" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED; at most one ACTIVE per team" , constraints: "DRAFT | ACTIVE | SUPERSEDED" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Timestamp of activation" }

  - name: LeadSource
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: name, type: string, source: input, description: "Source display name (e.g., 'Zillow Premier')" }
      - { name: type, type: enum, source: input, description: "PORTAL | IDX_WEBSITE | PAID_AD | REFERRAL_PARTNER | SPHERE | SIGN_CALL" , constraints: "PORTAL | IDX_WEBSITE | PAID_AD | REFERRAL_PARTNER | SPHERE | SIGN_CALL" }
      - { name: cost_per_lead_cents, type: integer, source: input, description: "Acquisition cost attributed to each lead intake from this source" , constraints: ">= 0" }
      - { name: monthly_budget_cents, type: integer, source: input, description: "Monthly spend ceiling; intake rejected once spent_this_month_cents + cost_per_lead_cents would exceed it" , constraints: ">= 0" }
      - { name: priority_weight, type: integer, source: input, default: 50, description: "1-100 intake priority label used by reporting; not a selector input" , constraints: "1 <= x <= 100" }
      - { name: auto_route, type: boolean, source: input, default: true, description: "When true, intake immediately attempts routing; when false the lead pools in NEW until manually routed" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED" , constraints: "ACTIVE | PAUSED" }
      - { name: leads_this_month_count, type: integer, source: computed, default: 0, description: "Leads created in the current calendar month of the logical clock (per Team.timezone) from this source" }
      - { name: spent_this_month_cents, type: integer, source: computed, default: 0, description: "leads_this_month_count * cost_per_lead_cents; recomputed on intake" }

  - name: Lead
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: source_id, type: string, source: input, description: "FK -> LeadSource.id; intake source (first-touch attribution anchor)" }
      - { name: assigned_agent_id, type: string, source: system, default: null, description: "FK -> Agent.id; currently responsible agent, null while pooled in NEW or CLOSED_LOST" }
      - { name: referral_partner_id, type: string, source: input, default: null, description: "FK -> ReferralPartner.id; required iff source.type == REFERRAL_PARTNER, forbidden otherwise" }
      - { name: contact_name, type: string, source: input, description: "Lead contact name" }
      - { name: contact_phone, type: string, source: input, description: "E.164 phone; unique per team among leads whose status is not in {CLOSED_WON, CLOSED_LOST}" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: expected_close_price_cents, type: integer, source: input, description: "Expected transaction price; feeds projected source ROI" , constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "NEW | OFFERED | CLAIMED | WORKING | UNDER_CONTRACT | CLOSED_WON | CLOSED_LOST" , constraints: "see Lead state machine (status dimension)" }
      - { name: temperature, type: enum, source: computed, default: COLD, description: "COLD | WARM | HOT; independent parallel state dimension derived from engagement_score" , constraints: "COLD | WARM | HOT" }
      - { name: engagement_score, type: integer, source: computed, default: 0, description: "Sum of decayed EngagementEvent effective_points for this lead" }
      - { name: first_response_at, type: datetime, source: system, default: null, description: "Timestamp of the first log-response; null until set" }
      - { name: within_speed_sla, type: boolean, source: computed, default: null, description: "first_response_at <= speed_deadline_at; computed at first log-response, null before" }
      - { name: speed_deadline_at, type: datetime, source: system, default: null, description: "created_at + effective speed-to-lead window, snapshotted at first routing" }
      - { name: claim_deadline_at, type: datetime, source: system, default: null, description: "Assignment.offered_at + effective claim window of the current OFFERED assignment; null while not OFFERED" }
      - { name: current_assignment_id, type: string, source: system, default: null, description: "Server-maintained pointer (not a foreign key) to the current non-terminal Assignment; null when pooled or terminal" }
      - { name: close_reason, type: string, source: system, default: null, description: "Reason recorded at CLOSED_LOST" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: lead_id, type: string, source: system, description: "FK -> Lead.id; lead being routed" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; agent the lead is offered to / claimed by" }
      - { name: policy_id, type: string, source: system, description: "FK -> RoutingPolicy.id; policy revision that produced this assignment (snapshot of routing context)" }
      - { name: supersedes_assignment_id, type: string, source: system, default: null, description: "FK -> Assignment.id; previous assignment this one replaces after expiry/reassign (self-referential chain); null for first routing" }
      - { name: rotation_seq, type: integer, source: system, description: "Per-team monotonically increasing routing sequence number" }
      - { name: policy_mode_snapshot, type: enum, source: system, description: "ROUND_ROBIN | PERFORMANCE_WEIGHTED; effective mode (after source override) used for this assignment" }
      - { name: offered_at, type: datetime, source: system, description: "Timestamp the assignment was created" }
      - { name: claim_deadline_at, type: datetime, source: system, description: "offered_at + effective claim window" }
      - { name: responded_at, type: datetime, source: system, default: null, description: "Set when the claiming agent logs first response on the lead" }
      - { name: status, type: enum, source: system, description: "OFFERED | CLAIMED | EXPIRED | RELEASED | REASSIGNED" , constraints: "see Assignment state machine" }
      - { name: outcome_reason, type: enum, source: system, default: null, description: "DEADLINE | AUTO_PAUSE | OFFBOARD | MANUAL | RELEASED; why a non-CLAIMED terminal transition happened" }

  - name: EngagementEvent
    parent: null
    common_fields: false
    fields:
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id" }
      - { name: type, type: enum, source: input, description: "EMAIL_OPEN(5) | LINK_CLICK(10) | CALL_ANSWERED(20) | FORM_SUBMIT(25) | REPLIED(30) | SHOWING_ATTENDED(40); points in parentheses" , constraints: "EMAIL_OPEN | LINK_CLICK | CALL_ANSWERED | FORM_SUBMIT | REPLIED | SHOWING_ATTENDED" }
      - { name: occurred_at, type: datetime, source: input, description: "When the engagement happened; drives step decay" }
      - { name: points, type: integer, source: computed, description: "Base points for the event type per the constants table" }
      - { name: effective_points, type: integer, source: computed, description: "points after step decay vs the logical clock at read time: full if age < 30 days, floor(points/2) if 30 <= age < 60 days, 0 if age >= 60 days" }

  - name: NurtureCampaign
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: temperature_target, type: enum, source: input, description: "COLD | WARM | HOT; only leads whose current temperature equals this may enroll" , constraints: "COLD | WARM | HOT" }
      - { name: steps, type: array, source: input, description: "Ordered steps [{offset_days, channel}]; offset_days from enrollment for step 0, then cumulative per index; non-empty, offsets strictly increasing" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED" , constraints: "DRAFT | ACTIVE | PAUSED" }

  - name: NurtureEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> NurtureCampaign.id" }
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id" }
      - { name: status, type: enum, source: system, description: "ENROLLED | PAUSED | COMPLETED | EXITED" , constraints: "see NurtureEnrollment state machine" }
      - { name: entered_temperature, type: enum, source: system, description: "Lead temperature snapshot at enrollment" }
      - { name: current_step_index, type: integer, source: system, default: 0, description: "Index of the next step to send within Campaign.steps" }
      - { name: next_send_at, type: datetime, source: system, description: "enrolled_at + steps[0].offset_days initially; advanced by the clock sweep" }
      - { name: exit_reason, type: enum, source: system, default: null, description: "MANUAL | TEMPERATURE_SHIFT | CONVERTED; null until EXITED" }

  - name: ReferralPartner
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: name, type: string, source: input, description: "Partner display name" }
      - { name: fee_bps, type: integer, source: input, description: "Base referral fee in basis points of deal basis; volume tier may add a premium" , constraints: "0 <= x <= 5000" }
      - { name: status, type: enum, source: system, description: "ACTIVE; configuration entity with no lifecycle transitions" , constraints: "ACTIVE" }

  - name: SplitAgreement
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: agent_a_id, type: string, source: input, description: "FK -> Agent.id; first side of the split (receives a_share_bps of the agent pool)" }
      - { name: agent_b_id, type: string, source: input, description: "FK -> Agent.id; second side (receives the remainder of the agent pool)" }
      - { name: a_share_bps, type: integer, source: input, description: "Agent A share of the agent pool in basis points", constraints: "a_share_bps + b_share_bps == 10000" }
      - { name: b_share_bps, type: integer, source: input, description: "Agent B share of the agent pool in basis points", constraints: "a_share_bps + b_share_bps == 10000" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of effectiveness (half-open interval)" }
      - { name: effective_until, type: datetime, source: input, default: null, description: "Exclusive end of effectiveness; null = open-ended" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED | EXPIRED; created ACTIVE", constraints: "ACTIVE | TERMINATED | EXPIRED" }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; copied from the lead" }
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id; the lead that went under contract" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; closing agent = lead.assigned_agent_id at creation" }
      - { name: gross_commission_cents, type: integer, source: input, description: "Estimated gross commission reported at contract time (provisional basis)", constraints: "> 0" }
      - { name: actual_gross_commission_cents, type: integer, source: input, default: null, description: "Actual gross commission confirmed at approval; when provided it becomes the final basis", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DISPUTED | PAID_OUT", constraints: "see Deal state machine" }
      - { name: split_basis_type, type: enum, source: computed, description: "ESTIMATED while PENDING (basis = gross_commission_cents); ACTUAL after approval when actual_gross_commission_cents provided", constraints: "ESTIMATED | ACTUAL" }
      - { name: split_basis_cents, type: integer, source: computed, description: "PENDING: gross_commission_cents; APPROVED/PAID_OUT: actual_gross_commission_cents ?? gross_commission_cents" }
      - { name: referral_partner_id, type: string, source: system, default: null, description: "Snapshot (not a live foreign key) of Lead.referral_partner_id at deal creation; terms frozen thereafter" }
      - { name: effective_fee_bps, type: integer, source: computed, default: 0, description: "Referral fee rate actually applied: partner base fee_bps, plus 500 premium when the partner's calendar-year approved volume (excluding this deal) is >= 10000000 cents" }
      - { name: referral_fee_cents, type: integer, source: computed, default: 0, description: "round_half_up(split_basis_cents * effective_fee_bps / 10000); recomputed on basis change" }
      - { name: house_share_cents, type: integer, source: computed, description: "round_half_up((split_basis_cents - referral_fee_cents) * 3000 / 10000)" }
      - { name: agent_pool_cents, type: integer, source: computed, description: "split_basis_cents - referral_fee_cents - house_share_cents" }
      - { name: agent_shares, type: array, source: computed, description: "[{agent_id, amount_cents}]; single entry (closing agent gets the whole pool) unless a covering ACTIVE SplitAgreement exists at the computation timestamp, in which case A gets round_half_up(pool * a_share_bps / 10000) and B gets the remainder" }
      - { name: split_agreement_id, type: string, source: system, default: null, description: "Snapshot (not a live foreign key) of the SplitAgreement applied at approval; null when none applied" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Timestamp of the most recent PENDING->APPROVED or DISPUTED->APPROVED transition" }
      - { name: dispute_reason, type: string, source: system, default: null, description: "Reason recorded at DISPUTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Agent
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /crm/agents/{agentId}/activate"
        actor: TeamAdmin
        preconditions:
          - "Agent.status == ONBOARDING (else ERR_INVALID_STATE)"
        side_effects:
          - "onboarded_at = now"
          - "Agent becomes eligible for the routing selector"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /crm/agents/{agentId}/pause OR system (automatic when consecutive_missed_claims reaches 3 after a deadline expiry)"
        actor: TeamAdmin | TeamLeader | system
        preconditions:
          - "Agent.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Every OFFERED Assignment of this agent transitions to EXPIRED with outcome_reason AUTO_PAUSE (cascade expirations do NOT increment consecutive_missed_claims)"
          - "Each lead whose assignment was cascade-expired is immediately re-routed via the selector with this agent excluded (see agent_selector retry exclusion); if no eligible agent remains, the lead stays NEW with assigned_agent_id null"
          - "Agent excluded from the selector while PAUSED"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /crm/agents/{agentId}/resume"
        actor: TeamAdmin | TeamLeader
        preconditions:
          - "Agent.status == PAUSED (else ERR_INVALID_STATE)"
        side_effects:
          - "consecutive_missed_claims = 0"

      - from: ACTIVE
        to: OFFBOARDING
        trigger: "POST /crm/agents/{agentId}/offboard"
        actor: TeamAdmin
        preconditions:
          - "Agent.status in {ACTIVE, PAUSED} (ONBOARDING or OFFBOARDED -> ERR_INVALID_STATE; OFFBOARDING is transient because the drain runs inside this call)"
        side_effects:
          - "OFFERED assignments of this agent -> EXPIRED (outcome_reason OFFBOARD)"
          - "Leads in CLAIMED/WORKING/UNDER_CONTRACT assigned to this agent: assignment -> RELEASED (outcome_reason OFFBOARD), lead -> NEW, assigned_agent_id = null"
          - "Every lead returned to NEW by this offboard is immediately re-routed via the selector with this agent excluded; leads that cannot be routed remain NEW"
          - "If active_lead_count reaches 0, agent immediately transitions OFFBOARDING -> OFFBOARDED"

      - from: PAUSED
        to: OFFBOARDING
        trigger: "POST /crm/agents/{agentId}/offboard"
        actor: TeamAdmin
        preconditions:
          - "Agent.status in {ACTIVE, PAUSED}"
        side_effects:
          - "Same release/re-route cascade as ACTIVE -> OFFBOARDING"

      - from: OFFBOARDING
        to: OFFBOARDED
        trigger: "system (automatic when active_lead_count == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Agent permanently excluded from the selector and from claim/release/log-response"

  - entity: Lead
    initial_state: NEW
    terminal_states: [CLOSED_WON]
    note: "Lead carries TWO independent state dimensions: status (lifecycle) and temperature (COLD/WARM/HOT, computed). Temperature changes never alter status and vice versa; temperature shifts may cascade to NurtureEnrollment."
    transitions:
      - from: NEW
        to: OFFERED
        trigger: "POST /crm/leads/{leadId}/route OR system auto-route during POST /crm/leads when source.auto_route is true"
        actor: TeamAdmin | TeamLeader | system
        preconditions:
          - "Lead.status == NEW (manual route from any other status -> ERR_INVALID_STATE)"
          - "An ACTIVE RoutingPolicy exists for the team (else ERR_NO_ACTIVE_POLICY)"
          - "Selector eligibility pool non-empty (manual route: ERR_NO_ELIGIBLE_AGENT; intake auto-route: lead silently stays NEW)"
        side_effects:
          - "Create Assignment: OFFERED, policy snapshot, rotation_seq = next per-team sequence, supersedes_assignment_id set when this is a re-route"
          - "assigned_agent_id / current_assignment_id set; claim_deadline_at = offered_at + effective claim window; speed_deadline_at set on first routing only (Lead.created_at + effective speed window)"
          - "Agent.active_lead_count += 1; Agent.last_assigned_at = now"

      - from: OFFERED
        to: CLAIMED
        trigger: "POST /crm/leads/{leadId}/claim"
        actor: Agent
        preconditions:
          - "Lead.status == OFFERED (else ERR_INVALID_STATE)"
          - "X-User-ID equals the current OFFERED assignment's agent_id (else ERR_NOT_OFFERED_TO_AGENT)"
          - "The clock sweep expires any assignment whose claim_deadline_at is strictly before now, and claiming at exactly claim_deadline_at is allowed (inclusive); a claim after the deadline therefore always observes an already-EXPIRED assignment and fails the state precondition with ERR_INVALID_STATE"
        side_effects:
          - "Assignment -> CLAIMED"
          - "Claiming agent's consecutive_missed_claims = 0; trailing_90d_claimed recomputed"

      - from: OFFERED
        to: NEW
        trigger: "system clock sweep (POST /_clock/set_current_utc) when claim_deadline_at < now"
        actor: system
        preconditions:
          - "Assignment still OFFERED and claim_deadline_at strictly before now"
        side_effects:
          - "Assignment -> EXPIRED (outcome_reason DEADLINE); current_assignment_id = null"
          - "Assigned agent consecutive_missed_claims += 1; on reaching 3 that agent auto-transitions ACTIVE -> PAUSED (see Agent machine), which itself cascade-expires that agent's other OFFERED assignments and re-routes their leads"
          - "This lead is re-routed via the selector with the missed agent excluded; if the pool is empty the lead stays NEW"

      - from: CLAIMED
        to: WORKING
        trigger: "POST /crm/leads/{leadId}/log-response (first response)"
        actor: Agent
        preconditions:
          - "Lead.status == CLAIMED (else ERR_INVALID_STATE)"
          - "Lead.first_response_at is null (a second log-response -> ERR_INVALID_STATE)"
          - "X-User-ID equals assigned_agent_id (else ERR_AGENT_IDENTITY_MISMATCH)"
        side_effects:
          - "first_response_at = now; within_speed_sla = (first_response_at <= speed_deadline_at)"
          - "current Assignment.responded_at = now"
          - "Agent.avg_first_response_seconds recomputed; performance_tier re-evaluated"

      - from: CLAIMED
        to: NEW
        trigger: "POST /crm/leads/{leadId}/release"
        actor: Agent | TeamLeader | TeamAdmin
        preconditions:
          - "Lead.status in {CLAIMED, WORKING} (else ERR_INVALID_STATE)"
          - "Agent role callers must be the assigned agent (else ERR_AGENT_IDENTITY_MISMATCH)"
        side_effects:
          - "Assignment -> RELEASED (outcome_reason RELEASED); current_assignment_id = null; assigned_agent_id = null"
          - "Agent.active_lead_count -= 1"
          - "Lead remains NEW until re-routed (explicit POST /route or reassignment)"

      - from: WORKING
        to: NEW
        trigger: "POST /crm/leads/{leadId}/release"
        actor: Agent | TeamLeader | TeamAdmin
        preconditions:
          - "Lead.status in {CLAIMED, WORKING}"
        side_effects:
          - "Same release side effects as CLAIMED -> NEW"

      - from: WORKING
        to: UNDER_CONTRACT
        trigger: "POST /crm/deals (creates the Deal)"
        actor: Agent | TeamLeader
        preconditions:
          - "Lead.status == WORKING (else ERR_INVALID_STATE)"
          - "Agent role callers must be the assigned agent (else ERR_AGENT_IDENTITY_MISMATCH)"
        side_effects:
          - "Deal created in PENDING with ESTIMATED split fields computed from gross_commission_cents"

      - from: UNDER_CONTRACT
        to: CLOSED_WON
        trigger: "system (as a side effect of POST /crm/deals/{dealId}/approve)"
        actor: system
        preconditions: []
        side_effects:
          - "Agent.active_lead_count -= 1"
          - "Agent.trailing_90d_conversions recomputed; performance_tier re-evaluated"
          - "Any ENROLLED or PAUSED NurtureEnrollment for this lead -> EXITED (exit_reason CONVERTED)"

      - from: CLAIMED
        to: CLOSED_LOST
        trigger: "POST /crm/leads/{leadId}/close-lost"
        actor: Agent | TeamLeader | TeamAdmin
        preconditions:
          - "Lead.status in {CLAIMED, WORKING} (else ERR_INVALID_STATE)"
          - "Agent role callers must be the assigned agent"
        side_effects:
          - "close_reason recorded; assignment stays CLAIMED as historical record; current_assignment_id = null; assigned_agent_id = null"
          - "Agent.active_lead_count -= 1"

      - from: WORKING
        to: CLOSED_LOST
        trigger: "POST /crm/leads/{leadId}/close-lost"
        actor: Agent | TeamLeader | TeamAdmin
        preconditions:
          - "Lead.status in {CLAIMED, WORKING}"
        side_effects:
          - "Same as CLAIMED -> CLOSED_LOST"

      - from: CLOSED_LOST
        to: NEW
        trigger: "POST /crm/leads/{leadId}/recycle"
        actor: TeamLeader | TeamAdmin
        preconditions:
          - "Lead.status == CLOSED_LOST (else ERR_INVALID_STATE)"
        side_effects:
          - "status = NEW; engagement_score and temperature are preserved (history survives recycling)"

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [CLAIMED, EXPIRED, RELEASED, REASSIGNED]
    transitions:
      - from: OFFERED
        to: CLAIMED
        trigger: "POST /crm/leads/{leadId}/claim"
        actor: Agent
        preconditions: ["see Lead OFFERED -> CLAIMED"]
        side_effects: ["see Lead OFFERED -> CLAIMED"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system clock sweep when claim_deadline_at < now, OR cascade from Agent auto-pause/offboard"
        actor: system
        preconditions: []
        side_effects: ["DEADLINE expiry increments the agent's missed-claim counter; AUTO_PAUSE and OFFBOARD expirations do not"]
      - from: OFFERED
        to: RELEASED
        trigger: "POST /crm/leads/{leadId}/release OR Agent offboard cascade"
        actor: Agent | TeamLeader | TeamAdmin | system
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: REASSIGNED
        trigger: "POST /crm/assignments/{assignmentId}/reassign"
        actor: TeamLeader | TeamAdmin
        preconditions:
          - "Assignment.status == OFFERED (else ERR_INVALID_STATE)"
        side_effects:
          - "A successor Assignment is created for the same lead with supersedes_assignment_id = this assignment; lead stays OFFERED with the new agent, fresh claim_deadline_at"

  - entity: RoutingPolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /crm/routing-policies/{policyId}/activate"
        actor: TeamAdmin
        preconditions:
          - "RoutingPolicy.status == DRAFT (else ERR_POLICY_NOT_ACTIVATABLE)"
          - "expected_team_version matches Team.version (else ERR_STALE_VERSION)"
        side_effects:
          - "The team's previously ACTIVE policy (if any) -> SUPERSEDED"
          - "activated_at = now; Team.version increments by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (as a side effect of activating a newer DRAFT policy on the same team)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LeadSource
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /crm/lead-sources/{sourceId}/pause"
        actor: TeamAdmin
        preconditions: ["LeadSource.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["Intake from this source is rejected while PAUSED (ERR_SOURCE_NOT_ACTIVE)"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /crm/lead-sources/{sourceId}/resume"
        actor: TeamAdmin
        preconditions: ["LeadSource.status == PAUSED (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: NurtureCampaign
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /crm/nurture-campaigns/{campaignId}/activate"
        actor: TeamAdmin
        preconditions: ["status in {DRAFT, PAUSED} (from ACTIVE -> ERR_INVALID_STATE)"]
        side_effects: ["When resuming from PAUSED: all PAUSED enrollments of this campaign -> ENROLLED"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /crm/nurture-campaigns/{campaignId}/activate"
        actor: TeamAdmin
        preconditions: []
        side_effects: ["All PAUSED enrollments of this campaign -> ENROLLED"]
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /crm/nurture-campaigns/{campaignId}/pause"
        actor: TeamAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["All ENROLLED enrollments of this campaign -> PAUSED"]

  - entity: NurtureEnrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, EXITED]
    transitions:
      - from: ENROLLED
        to: PAUSED
        trigger: "system (campaign pause cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ENROLLED
        trigger: "system (campaign resume cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: EXITED
        trigger: "POST /crm/nurture-enrollments/{enrollmentId}/exit OR system (lead temperature no longer equals campaign.temperature_target, exit_reason TEMPERATURE_SHIFT; or lead CLOSED_WON, exit_reason CONVERTED)"
        actor: TeamLeader | TeamAdmin | system
        preconditions: ["status in {ENROLLED, PAUSED} for manual exit (else ERR_ENROLLMENT_NOT_ACTIVE)"]
        side_effects: ["exit_reason recorded (MANUAL | TEMPERATURE_SHIFT | CONVERTED)"]
      - from: PAUSED
        to: EXITED
        trigger: "POST /crm/nurture-enrollments/{enrollmentId}/exit OR system (TEMPERATURE_SHIFT / CONVERTED)"
        actor: TeamLeader | TeamAdmin | system
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: COMPLETED
        trigger: "system clock sweep: next_send_at <= now advances current_step_index; completing the final step -> COMPLETED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SplitAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /crm/split-agreements/{agreementId}/terminate"
        actor: TeamLeader | TeamAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["Already-approved deals keep their snapshot; future approvals no longer match this agreement"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock sweep when effective_until is not null and now >= effective_until"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Deal
    initial_state: PENDING
    terminal_states: [PAID_OUT]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /crm/deals/{dealId}/approve"
        actor: TeamLeader
        preconditions:
          - "Deal.status in {PENDING, DISPUTED} (else ERR_DEAL_NOT_APPROVABLE)"
          - "Caller identity resolves to an Agent with role_on_team == LEADER on the deal's team (else ERR_AGENT_IDENTITY_MISMATCH)"
        side_effects:
          - "If actual_gross_commission_cents provided: split_basis_type = ACTUAL and all split fields recomputed"
          - "Referral fee tier snapshot taken from partner calendar-year volume excluding this deal"
          - "Lead -> CLOSED_WON (cascade: capacity release, trailing conversions recompute + tier re-evaluation, nurture enrollment EXITED with CONVERTED)"
          - "approved_at = now"
      - from: DISPUTED
        to: APPROVED
        trigger: "POST /crm/deals/{dealId}/approve"
        actor: TeamLeader
        preconditions: ["same as PENDING -> APPROVED"]
        side_effects: ["same as PENDING -> APPROVED; corrected actual_gross_commission_cents replaces the basis and every derived split field"]
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /crm/deals/{dealId}/dispute"
        actor: TeamAdmin
        preconditions: ["Deal.status == APPROVED (else ERR_INVALID_STATE)"]
        side_effects: ["dispute_reason recorded; lead remains CLOSED_WON; split fields retained until corrected re-approval"]
      - from: APPROVED
        to: PAID_OUT
        trigger: "POST /crm/deals/{dealId}/mark-paid"
        actor: TeamAdmin
        preconditions: ["Deal.status == APPROVED (else ERR_INVALID_STATE)"]
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: policy-activate-stale-team
    parent_entity: Team
    write_endpoint: "POST /crm/routing-policies/{policyId}/activate"
    occ_field: expected_team_version
    description: |
      Activating a DRAFT RoutingPolicy supersedes the team's currently ACTIVE
      policy. A client whose view of the team predates the most recent
      activation has a stale picture of which policy is being superseded, so
      the activation is rejected when expected_team_version does not match the
      team's current version. A second activation carrying the version observed
      before the first activation is therefore deterministically rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: agent_selector
    trigger: "Lead routing: POST /crm/leads auto-route, POST /crm/leads/{id}/route, reassignment, expiry re-route, pause/offboard cascade re-route"
    algorithm: weighted_scoring
    formula: |
      ELIGIBILITY: Agent.status == ACTIVE
        AND Agent.active_lead_count < Agent.max_active_leads
        AND NOT EXISTS AgentTimeOff with starts_at <= now <= ends_at (closed interval)
        AND agent not in excluded_agent_ids (retry exclusion: the agent whose
            assignment just expired/released is excluded from the immediate re-route)
      MODE: mode = policy.source_mode_overrides[LeadSource.type] ?? policy.mode
      if mode == ROUND_ROBIN:
        order by (last_assigned_at ASC NULLS FIRST, Agent.created_at ASC); take first
      else PERFORMANCE_WEIGHTED:
        score = tier_weight_bps[agent.performance_tier] * (agent.max_active_leads - agent.active_lead_count)
        if Lead.temperature == HOT AND agent.trailing_90d_conversions >= 5: score = score * 2
        order by (score DESC, last_assigned_at ASC NULLS FIRST, Agent.created_at ASC); take first
      EMPTY POOL: manual route -> ERR_NO_ELIGIBLE_AGENT; intake auto-route -> lead stays NEW
      (non-linear interaction: >= 3 inputs — tier weight, remaining capacity, HOT-boost
      conditional branch — combined multiplicatively; mode branch on policy + source type)
    input_set: "Agents of the lead's team; lead's source type and temperature; the team's ACTIVE policy"
    constants:
      HOT_BOOST_MIN_CONVERSIONS: 5
      HOT_BOOST_MULTIPLIER: 2
    precision: "integer score arithmetic; no rounding"

  - name: engagement_score_and_temperature
    trigger: "POST /crm/leads/{leadId}/engagement-events and any read of Lead.temperature"
    algorithm: decay_function
    formula: |
      effective_points(event) = points if age_days < 30
                              = floor(points / 2) if 30 <= age_days < 60
                              = 0 if age_days >= 60
        where age_days = floor((now - occurred_at) / 86400), now = logical clock
      engagement_score = sum of effective_points over all EngagementEvents of the lead
      temperature = HOT  if engagement_score >= 75
                  = WARM if 40 <= engagement_score < 75
                  = COLD if engagement_score < 40
      Boundary: score exactly 40 is WARM; exactly 75 is HOT (>= semantics).
      Side effect of a temperature change: every ENROLLED/PAUSED NurtureEnrollment whose
      campaign.temperature_target != new temperature transitions to EXITED (TEMPERATURE_SHIFT).
    input_set: "All EngagementEvent rows of the lead (no status filter — append-only log)"
    constants:
      POINTS: "{EMAIL_OPEN: 5, LINK_CLICK: 10, CALL_ANSWERED: 20, FORM_SUBMIT: 25, REPLIED: 30, SHOWING_ATTENDED: 40}"
      DECAY_STEP1_DAYS: 30
      DECAY_STEP2_DAYS: 60
      WARM_THRESHOLD: 40
      HOT_THRESHOLD: 75
    precision: "integer points; floor division for decayed values"

  - name: agent_performance_tier
    trigger: "Recomputed after deal approval (conversion), log-response (response-time input changes), and POST /crm/agents/{id}/import-production-stats"
    algorithm: threshold
    formula: |
      c = trailing_90d_conversions; r = avg_first_response_seconds (null when no responses)
      if c >= 8 AND r is not null AND r <= 300: PLATINUM
      elif c >= 4 AND r is not null AND r <= 900: GOLD
      elif c >= 1: SILVER
      else: BRONZE
      Boundary semantics are inclusive (>= on conversions, <= on response time):
      c == 4 with r == 900 -> GOLD; c == 8 with r == 300 -> PLATINUM.
    input_set: "Agent trailing-90-day counters and average response seconds"
    constants:
      PLATINUM_MIN_CONVERSIONS: 8
      PLATINUM_MAX_RESPONSE_SECONDS: 300
      GOLD_MIN_CONVERSIONS: 4
      GOLD_MAX_RESPONSE_SECONDS: 900
      SILVER_MIN_CONVERSIONS: 1
    precision: "integer comparisons"

  - name: accountability_score
    trigger: "GET /crm/agents/{agentId}/scorecard (computed on read from current counters)"
    algorithm: weighted_scoring
    formula: |
      claim_rate_bps = trailing_90d_claimed * 10000 / max(1, trailing_90d_offered)   # integer floor division
      speed_score_bps = 10000 if avg_first_response_seconds is not null and avg_first_response_seconds <= effective speed window
                      = 0 if avg_first_response_seconds is null
                      else floor(10000 * window / avg_first_response_seconds)
      conversion_rate_bps = trailing_90d_conversions * 10000 / max(1, trailing_90d_claimed)
      accountability_score_bps = round_half_up((5*claim_rate_bps + 3*speed_score_bps + 2*conversion_rate_bps) / 10)
    input_set: "Agent counters; effective speed window = ACTIVE policy override ?? team default"
    constants:
      W_CLAIM: 5
      W_SPEED: 3
      W_CONVERSION: 2
    precision: "basis points; round_half_up on the final weighted mean only"

  - name: commission_split
    trigger: "Deal creation (ESTIMATED basis) and Deal approval (recomputed; ACTUAL basis when actual_gross_commission_cents provided)"
    algorithm: waterfall_allocation
    formula: |
      basis = (Deal.status == PENDING) ? gross_commission_cents
                                       : (actual_gross_commission_cents ?? gross_commission_cents)
      referral_fee_cents = round_half_up(basis * effective_fee_bps / 10000)   # 0 when no referral partner
      house_share_cents = round_half_up((basis - referral_fee_cents) * 3000 / 10000)
      agent_pool_cents = basis - referral_fee_cents - house_share_cents
      if an ACTIVE SplitAgreement covers the closing agent (closing agent in {agent_a_id, agent_b_id})
         at the computation timestamp (deal creation for the ESTIMATED variant, approval for the
         ACTUAL variant), i.e. effective_from <= now < (effective_until ?? infinity):
        a_amt = round_half_up(agent_pool_cents * a_share_bps / 10000)
        b_amt = agent_pool_cents - a_amt            # remainder to B — pinned rounding order
        agent_shares = [{agent_a_id, a_amt}, {agent_b_id, b_amt}]
      else:
        agent_shares = [{closing_agent_id, agent_pool_cents}]
      PINNED ROUNDING ORDER (nested-rounding rule): compute referral fee first (round half-up),
      then house share on the post-referral remainder (round half-up), then agent A share on the
      pool (round half-up); agent B always receives the unrounded remainder so that
      referral_fee + house_share + sum(agent_shares) == basis exactly (money conservation).
      The evaluation order basis -> fee -> house -> pool -> A -> B is fixed and MUST NOT be
      reordered; a different order yields different cents for the same inputs.
    input_set: "Deal basis, ReferralPartner fee (snapshot), SplitAgreement (snapshot at approval)"
    constants:
      HOUSE_BPS: 3000
    precision: "integer cents; round_half_up at each pinned step"
    variants:
      - name: estimated
        when: "Deal PENDING — basis is the agent-reported gross_commission_cents"
        difference: "Split fields are provisional and recompute on approval"
      - name: actual
        when: "Deal APPROVED/DISPUTED-reapproved with actual_gross_commission_cents provided"
        difference: "Basis switches to the actual figure; all downstream cents differ from the estimated variant for the same deal whenever actual != estimated"

  - name: referral_fee_tier
    trigger: "Computed inside commission_split at Deal approval (and at creation for the ESTIMATED variant, using the same snapshot rule)"
    algorithm: threshold
    formula: |
      CIRCULAR-LOOKING DEPENDENCY, PINNED: the current deal's basis NEVER counts toward the
      volume that sets its own fee tier.
      ytd_volume_cents = sum of split_basis_cents over the partner's other deals with
        status in {APPROVED, PAID_OUT} and approved_at in the current calendar year
        (logical clock), EXCLUDING the deal being computed
      effective_fee_bps = partner.fee_bps + 500 if ytd_volume_cents >= 10000000
                        = partner.fee_bps otherwise
      Boundary: ytd_volume exactly 10000000 cents qualifies for the premium (>= semantics).
    input_set: "ReferralPartner deals for the same team in the current calendar year"
    constants:
      VOLUME_TIER_THRESHOLD_CENTS: 10000000
      VOLUME_PREMIUM_BPS: 500
    precision: "integer cents and basis points"

  - name: source_roi
    trigger: "GET /crm/lead-sources/{sourceId}/roi (computed on read)"
    algorithm: aggregation
    formula: |
      window = [now - window_days days, now], now = logical clock, window_days default 90
      cohort = leads with source_id = this source and created_at inside the window
      leads_count = |cohort|
      spend_cents = leads_count * cost_per_lead_cents
      REALIZED basis:
        attributed_commission_cents = sum of split_basis_cents over deals of cohort leads
          with status in {APPROVED, PAID_OUT}
      PROJECTED basis:
        attributed_commission_cents = REALIZED sum
          + sum over cohort leads with status in {OFFERED, CLAIMED, WORKING, UNDER_CONTRACT} of
            round_half_up(expected_close_price_cents * 300 / 10000 * TEMP_PROBABILITY_BPS[temperature] / 10000)
      roi_bps = (attributed_commission_cents - spend_cents) * 10000 / spend_cents   # integer floor division
      roi_bps = null when spend_cents == 0 (empty-cohort guard)
    input_set: "Leads of the source created inside the window; their deals"
    constants:
      EST_COMMISSION_BPS: 300
      TEMP_PROBABILITY_BPS: "{COLD: 500, WARM: 2000, HOT: 4500}"
      DEFAULT_WINDOW_DAYS: 90
    precision: "integer cents and basis points; round_half_up on each pipeline contribution; floor division for roi_bps"
    variants:
      - name: realized
        when: "basis=REALIZED (default)"
        difference: "Only closed-won commission counts; pipeline contributes zero"
      - name: projected
        when: "basis=PROJECTED"
        difference: "Open pipeline contributes temperature-probability-weighted expected commission; for the same source data the two bases produce different roi_bps whenever the source has any open pipeline"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request body is well-formed: required fields present, no undeclared fields (strict schema — computed/system fields sent by the client are rejected), enum values valid, datetimes parseable, integer ranges respected (max_active_leads >= 1, fee_bps 0-5000, priority_weight 1-100, expected_close_price_cents > 0, gross amounts > 0, ends_at strictly after starts_at, steps non-empty with strictly increasing offset_days)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every id referenced in the path and body exists (team, agent, source, policy, campaign, partner, agreement, lead, assignment, enrollment, deal), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: auth
    check: "Entity-backed identity: Agent callers act only as themselves on claim/release/log-response/engagement/deal-create/time-off-create; TeamLeader callers must resolve to an Agent with role_on_team == LEADER on the relevant team; ReferralPartner lead intake must carry referral_partner_id == caller id"
    error_id: "ERR_AGENT_IDENTITY_MISMATCH | ERR_NOT_OFFERED_TO_AGENT | ERR_PARTNER_IDENTITY_MISMATCH"
    http_status: 403
    applies_to: "identity-scoped endpoints (claim uses ERR_NOT_OFFERED_TO_AGENT when the caller is an ACTIVE agent but not the offered one)"

  - priority: 6
    category: state
    check: "Target resource in the required state for the transition (lead routable/claimable/releasable, assignment OFFERED, agent ONBOARDING/ACTIVE/PAUSED as required, source ACTIVE for intake, policy DRAFT for activation, deal PENDING|DISPUTED for approval, enrollment ENROLLED|PAUSED for exit, agreement ACTIVE for terminate); referenced-entity state checks whose failure blocks the operation (campaign must be ACTIVE at enrollment) also live here"
    error_id: "ERR_INVALID_STATE | ERR_SOURCE_NOT_ACTIVE | ERR_NO_ACTIVE_POLICY | ERR_POLICY_NOT_ACTIVATABLE | ERR_DEAL_NOT_APPROVABLE | ERR_ENROLLMENT_NOT_ACTIVE | ERR_CAMPAIGN_NOT_ACTIVE"
    http_status: 409
    applies_to: "state transition endpoints and enrollment create"

  - priority: 7
    category: business_temporal
    check: "Temporal rules: new time-off block must not intersect an existing block of the same agent under CLOSED-interval semantics (touching endpoints conflict); new split agreement window must not overlap an ACTIVE agreement for the same unordered agent pair under HALF-OPEN semantics (adjacency allowed: new.effective_from == existing.effective_until is permitted)"
    error_id: "ERR_TIME_OFF_OVERLAP | ERR_SPLIT_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "claim, time-off create, split-agreement create"

  - priority: 8
    category: business_constraint
    check: "Structural cross-field constraints: split shares sum to exactly 10000 bps; split agents are distinct ACTIVE members of the same team; referral_partner_id present iff source.type == REFERRAL_PARTNER"
    error_id: "ERR_SPLIT_SHARE_SUM_INVALID | ERR_SPLIT_AGENT_PAIR_INVALID | ERR_REFERRAL_PARTNER_REQUIRED"
    http_status: 422
    applies_to: "split-agreement create, lead create"

  - priority: 9
    category: business_constraint
    check: "Conflict-style constraints: license number unique per team; contact_phone unique per team among leads with status not in {CLOSED_WON, CLOSED_LOST}; lead temperature equals campaign temperature_target at enrollment; no other ENROLLED or PAUSED enrollment exists for the lead"
    error_id: "ERR_DUPLICATE_LICENSE_NUMBER | ERR_DUPLICATE_OPEN_LEAD | ERR_TEMPERATURE_MISMATCH | ERR_LEAD_ALREADY_ENROLLED"
    http_status: 409
    applies_to: "agent create, lead create, enrollment create"

  - priority: 10
    category: business_fiscal
    check: "Source monthly budget: spent_this_month_cents + cost_per_lead_cents <= monthly_budget_cents (equality allowed)"
    error_id: ERR_SOURCE_BUDGET_EXHAUSTED
    http_status: 409
    applies_to: "POST /crm/leads"

  - priority: 11
    category: business_constraint
    check: "Selector pool non-empty for manual route (after eligibility filters and retry exclusion)"
    error_id: ERR_NO_ELIGIBLE_AGENT
    http_status: 409
    applies_to: "POST /crm/leads/{leadId}/route, POST /crm/assignments/{assignmentId}/reassign"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (outside the business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Default before any call: 2026-08-01T00:00:00Z exactly — the clock never falls back to wall-clock time. Setting the clock runs the system sweep: deadline-expire OFFERED assignments (with missed-claim counter, auto-pause at 3, and re-route cascades), EXPIRE split agreements past effective_until, and advance/complete due nurture enrollment steps. Sweep ordering is pinned: expired OFFERED assignments are processed in (claim_deadline_at ASC, created_at ASC) order; an auto-pause cascade expires that agent's remaining OFFERED assignments immediately inside the triggering expiry's processing (cascade expirations carry outcome_reason AUTO_PAUSE and do NOT increment consecutive_missed_claims)."
    roles: [TeamAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_utc: datetime, expired_assignment_count: integer, auto_paused_agent_count: integer, expired_agreement_count: integer, advanced_enrollment_count: integer }
    side_effects: ["claim-deadline expiry cascade (Assignment -> EXPIRED -> Agent missed counter -> auto-pause at 3 -> cascade expiry + re-route)", "SplitAgreement -> EXPIRED", "NurtureEnrollment step advance / COMPLETED"]

  # --- Team ---
  - method: POST
    path: "/crm/teams"
    description: "Create a team"
    roles: [TeamAdmin]
    code: 201
    input: [name, market, timezone, "speed_to_lead_window_seconds?", "claim_window_seconds?"]
    output: Team
    side_effects: ["version starts at 1"]
  - method: GET
    path: "/crm/teams/{teamId}"
    description: "Get a team"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: Team
    side_effects: []

  # --- Agent ---
  - method: POST
    path: "/crm/agents"
    description: "Create an agent in ONBOARDING"
    roles: [TeamAdmin]
    code: 201
    input: [team_id, display_name, license_number, "role_on_team?", max_active_leads]
    output: Agent
    side_effects: ["status=ONBOARDING, performance_tier=BRONZE, counters zeroed"]
  - method: GET
    path: "/crm/agents/{agentId}"
    description: "Get an agent"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: Agent
    side_effects: []
  - method: GET
    path: "/crm/agents"
    description: "List agents with filters and pagination"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["team_id?", "status?", "role_on_team?", "limit?", "offset?"]
    output: Agent[]
    side_effects: []
  - method: POST
    path: "/crm/agents/{agentId}/activate"
    description: "Activate an ONBOARDING agent"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["status -> ACTIVE, onboarded_at set"]
  - method: POST
    path: "/crm/agents/{agentId}/pause"
    description: "Pause an ACTIVE agent; cascade-expires their OFFERED assignments and re-routes those leads excluding this agent"
    roles: [TeamAdmin, TeamLeader]
    code: 200
    input: []
    output: Agent
    side_effects: ["status -> PAUSED", "OFFERED assignments -> EXPIRED (AUTO_PAUSE, no missed-claim increment)", "affected leads re-routed excluding this agent"]
  - method: POST
    path: "/crm/agents/{agentId}/resume"
    description: "Resume a PAUSED agent; resets consecutive_missed_claims to 0"
    roles: [TeamAdmin, TeamLeader]
    code: 200
    input: []
    output: Agent
    side_effects: ["status -> ACTIVE", "consecutive_missed_claims = 0"]
  - method: POST
    path: "/crm/agents/{agentId}/offboard"
    description: "Offboard an ACTIVE or PAUSED agent: releases their whole pipeline back to the pool and re-routes it excluding this agent; transitions to OFFBOARDED once active_lead_count reaches 0"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["status -> OFFBOARDING", "OFFERED assignments -> EXPIRED (OFFBOARD)", "CLAIMED/WORKING/UNDER_CONTRACT leads -> NEW with assignment RELEASED (OFFBOARD)", "released leads re-routed excluding this agent", "auto OFFBOARDED when drained"]
  - method: GET
    path: "/crm/agents/{agentId}/scorecard"
    description: "Computed accountability scorecard (accountability_score calculation)"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: { agent_id: string, performance_tier: string, active_lead_count: integer, trailing_90d_conversions: integer, trailing_90d_claimed: integer, trailing_90d_offered: integer, avg_first_response_seconds: integer, claim_rate_bps: integer, speed_score_bps: integer, conversion_rate_bps: integer, accountability_score_bps: integer }
    side_effects: []
  - method: POST
    path: "/crm/agents/{agentId}/import-production-stats"
    description: "Backfill an onboarding agent's trailing-90-day production history (real-world roster onboarding import); recomputes performance_tier"
    roles: [TeamAdmin]
    code: 200
    input: ["trailing_90d_conversions?", "trailing_90d_claimed?", "trailing_90d_offered?", "avg_first_response_seconds?", "consecutive_missed_claims?"]
    output: Agent
    side_effects: ["counters set from payload", "performance_tier recomputed per agent_performance_tier"]
  - method: POST
    path: "/crm/agents/{agentId}/time-offs"
    description: "Create an approved time-off block; rejected on CLOSED-interval intersection with an existing block"
    roles: [Agent, TeamAdmin]
    code: 201
    input: [starts_at, ends_at, reason]
    output: AgentTimeOff
    side_effects: []
  - method: GET
    path: "/crm/agents/{id}/time-offs"
    description: "List an agent's time-off blocks"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: AgentTimeOff[]
    side_effects: []

  # --- RoutingPolicy ---
  - method: POST
