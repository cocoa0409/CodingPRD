scaffold_corner_design:
  - section: entities
    instances:
      - name: exhibit_project_creation_seeds_every_computed_bucket_and_the_default_closure_capacity
        claim_type: creation
        grounds:
          - entities.ExhibitProject
          - endpoints.POST_/exhibit-projects
          - response_envelope.success
        distinguishing_aspect: |
          The create must mint the four common fields, apply the phase initial
          state, apply the max_concurrent_closures default of 2, and seed all five
          money buckets so that the identity holds from the very first row:
          committed = retainage = warranty_reserve = released = 0 and uncommitted
          == contract_value_cents. posture is computed, not stored, so it must read
          OPEN even though no child row exists yet. The id must be a bare UUID with
          no type prefix.
        test_recipe:
          setup:
            - "empty database; logical clock pinned to the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
          trigger:
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id, ver: $.data.version, ph: $.data.phase, post: $.data.posture, mcc: $.data.max_concurrent_closures, com: $.data.committed_fabrication_cents, ret: $.data.retainage_held_cents, war: $.data.warranty_reserve_cents, rel: $.data.released_cents, unc: $.data.uncommitted_cents, pcy: $.data.parts_commitment_years, cby: $.data.created_by_user_id, wra: $.data.warranty_registered_at }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "${proj} is a bare RFC 4122 UUID with no type prefix and no underscore"
            - "${ver} == 1, ${ph} == INTERPRETIVE and ${post} == OPEN"
            - "${mcc} == 2 - the omitted max_concurrent_closures takes its declared default"
            - "${com} == 0, ${ret} == 0, ${war} == 0, ${rel} == 0 and ${unc} == 9000000, so the five buckets already sum to contract_value_cents"
            - "${pcy} == 0, ${cby} == pm-01 and ${wra} == null"
            - "conservation_veto_count, conservation_block_count, open_revision_count, conditional_case_count, pending_material_count and blocking_punch_count are all 0"

      - name: gallery_zone_and_project_optional_fields_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.GalleryZone.fields.is_public_operating
          - entities.GalleryZone.fields.closure_allowed
          - entities.GalleryZone.fields.dust_settling_buffer_minutes
          - entities.InstallWindow.fields.requires_gallery_closure
        distinguishing_aspect: |
          Three of the zone's optional inputs have non-obvious defaults that later
          decide behaviour: is_public_operating defaults TRUE, closure_allowed
          defaults FALSE (so an omitted flag makes closures illegal rather than
          legal), and dust_settling_buffer_minutes defaults to 120 - exactly the
          DUST_GENERATING constant, so the default zone is indistinguishable from
          the constant and only an override reveals which one the implementation
          used. available_case_slots must also be derived at create time rather
          than left null.
        test_recipe:
          setup:
            - "project in phase SCHEMATIC"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v2: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v2}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg1: $.data.id }
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd1: $.data.id }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
          trigger:
            - call: "POST /exhibit-projects/${proj}/gallery-zones"
              payload: { zone_code: "Z-A", visitor_route_order: 1, max_noise_dba: 85.0, case_slot_capacity: 4 }
              as: MuseumOperations
              as_user_id: ops-01
              captures: { zone1: $.data.id, pub: $.data.is_public_operating, ca: $.data.closure_allowed, dust: $.data.dust_settling_buffer_minutes, occ: $.data.occupancy_state, res: $.data.reserved_case_slots, avl: $.data.available_case_slots, zver: $.data.version }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "DESIGN_DEV" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v3: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v3}", stage: "DESIGN_DEV", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg2: $.data.id }
            - call: "POST /design-packages/${pkg2}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd2: $.data.id }
            - call: "POST /review-rounds/${rnd2}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd2}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-STRATA", kind: "TOUCHSCREEN", objective_code: "OBJ-STRATA", expected_daily_uses: 150, duty_hours_per_day: 6.0, mtbf_cycles: 1200000, parts_availability_years: 10, warranty_months: 24 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { int1: $.data.id }
            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-EXT", kind: "AUDIO", objective_code: "OBJ-EXTINCTION", expected_daily_uses: 40, duty_hours_per_day: 4.0, mtbf_cycles: 2000000, parts_availability_years: 10, warranty_months: 24 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { int2: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "FABRICATION" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /install-windows"
              payload: { project_id: "${proj}", zone_id: "${zone1}", work_class: "QUIET", noise_dba: 50.0, starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T10:00:00Z" }
              as: FabricationLead
              as_user_id: fab-01
              captures: { win1: $.data.id, rgc: $.data.requires_gallery_closure, pre: $.data.pre_access_buffer_minutes, setb: $.data.settling_buffer_minutes }
          assert:
            - "${pub} == true - is_public_operating defaults to true, so a zone is assumed open to visitors unless stated otherwise"
            - "${ca} == false - closure_allowed defaults to false, the SAFE default; an omitted flag forbids closures"
            - "${dust} == 120 and ${occ} == OPERATING"
            - "${res} == 0, ${avl} == 4 and ${zver} == 1 - available_case_slots is derived at create time, not on first read"
            - "${rgc} == false, ${pre} == 0 and ${setb} == 0 for the QUIET window"

      - name: client_supplied_system_and_computed_fields_are_input_ignored
        claim_type: system_fields
        grounds:
          - entities.ArtifactCase.fields.status
          - entities.ArtifactCase.fields.case_volume_m3
          - entities.ArtifactCase.fields.placed_artifact_count
          - endpoints.POST_/exhibit-projects/{id}/artifact-cases
        distinguishing_aspect: |
          status, mount_status, placed_artifact_count, case_volume_m3, silica_gel_kg,
          version and id are declared system or computed. A body that also carries
          them must not be honoured: the server mints its own values. The trap is
          that the supplied values are individually plausible - an APPROVED status,
          a volume of 9.999 - so an implementation that mass-assigns the request
          body produces a case that is APPROVED without ever passing conservation.
        test_recipe:
          setup:
            - "project in phase DESIGN_DEV with zone Z-A"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v2: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v2}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg1: $.data.id }
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd1: $.data.id }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
            - call: "POST /exhibit-projects/${proj}/gallery-zones"
              payload: { zone_code: "Z-A", visitor_route_order: 1, max_noise_dba: 85.0, case_slot_capacity: 2, closure_allowed: true, dust_settling_buffer_minutes: 120 }
              as: MuseumOperations
              as_user_id: ops-01
              captures: { zone1: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "DESIGN_DEV" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v3: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v3}", stage: "DESIGN_DEV", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg2: $.data.id }
            - call: "POST /design-packages/${pkg2}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd2: $.data.id }
            - call: "POST /review-rounds/${rnd2}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd2}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
          trigger:
            - call: "POST /exhibit-projects/${proj}/artifact-cases"
              payload: { zone_id: "${zone1}", case_code: "C-01", objective_code: "OBJ-EXTINCTION", security_tier: "ENHANCED", target_rh_pct: 50.0, rh_tolerance_pct: 2.0, target_lux: 50.0, uv_microwatt_per_lumen: 20.0, interior_l_cm: 120.0, interior_w_cm: 60.0, interior_h_cm: 90.0, air_exchanges_per_day: 0.4, status: "APPROVED", mount_status: "MOUNT_INSTALLED", placed_artifact_count: 7, case_volume_m3: 9.999, silica_gel_kg: 42.0, version: 99 }
              as: Curator
              as_user_id: cur-01
              captures: { case1: $.data.id, cst: $.data.status, cmt: $.data.mount_status, ccnt: $.data.placed_artifact_count, cvol: $.data.case_volume_m3, csil: $.data.silica_gel_kg, cver: $.data.version, cfeas: $.data.env_feasible }
          assert:
            - "HTTP 201 - the system-owned keys are ignored, not honoured"
            - "${cst} == DRAFT and ${cmt} == NOT_STARTED - the declared initial states of the two independent dimensions"
            - "${ccnt} == 0 and ${cver} == 1"
            - "${cvol} == 0.648 == round_half_up(120.0 * 60.0 * 90.0 / 1000000.0, 4) and ${csil} == 0.91 == round_half_up(0.648 * 0.4 * 3.5, 2) - both recomputed from the geometry, not taken from the body"
            - "${case1} is a server-minted UUID unrelated to anything in the request"
            - "${cfeas} == true from the empty-placed-set branch of calculations.case_environmental_envelope"

      - name: the_review_round_quorum_is_computed_from_the_panel_size_at_open_time
        claim_type: computed_fields
        grounds:
          - entities.ReviewRound.fields.required_vote_count
          - state_machines.DesignPackage.DRAFT_to_SUPERSEDED
          - state_machines.DesignPackage.IN_REVIEW_to_SUPERSEDED
          - endpoints.POST_/design-packages/{id}/review-rounds
        distinguishing_aspect: |
          required_vote_count is ceil(length(panel_roles) * 2 / 3), so a 3-role
          panel needs 2 votes, a 4-role panel needs 3 and a 5-role panel needs 4.
          The three sizes are chosen because 8/3 = 2.67 and 10/3 = 3.33 both have to
          round UP while 6/3 = 2 is exact, so floor, truncation and round-half-up
          each get a different one of the three wrong. The chain also exercises the
          supersede cascade: each new SCHEMATIC package retires the previous one and
          closes its OPEN round.
        test_recipe:
          setup:
            - "project in phase SCHEMATIC with no design package yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
          trigger:
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { vA: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${vA}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkgA: $.data.id }
            - call: "POST /design-packages/${pkgA}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rndA: $.data.id, reqA: $.data.required_vote_count, castA: $.data.cast_vote_count, rnA: $.data.round_number, rstA: $.data.status }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { vB: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${vB}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkgB: $.data.id }
            - call: "GET /design-packages/${pkgA}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkgAst: $.data.status, pkgAsup: $.data.superseded_by_package_id }
            - call: "GET /review-rounds/${rndA}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { rndAst: $.data.status }
            - call: "POST /design-packages/${pkgB}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager", "AccessibilitySpecialist"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rndB: $.data.id, reqB: $.data.required_vote_count, rnB: $.data.round_number }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { vC: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${vC}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkgC: $.data.id }
            - call: "POST /design-packages/${pkgC}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager", "AccessibilitySpecialist", "FabricationLead"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rndC: $.data.id, reqC: $.data.required_vote_count, rnC: $.data.round_number }
          assert:
            - "${reqA} == 2 == ceil(3 * 2 / 3), with ${castA} == 0, ${rnA} == 1 and ${rstA} == OPEN"
            - "${reqB} == 3 == ceil(4 * 2 / 3) - 8/3 is 2.67 and must round UP, so floor and truncation both give the wrong 2"
            - "${reqC} == 4 == ceil(5 * 2 / 3) - 10/3 is 3.33, so round-half-up would give the wrong 3"
            - "${pkgAst} == SUPERSEDED with ${pkgAsup} == ${pkgB}, and ${rndAst} == CLOSED_SUPERSEDED"
            - "${rnB} == 1 and ${rnC} == 1 - round_number is scoped per package, not per project"

      - name: artifact_case_retrieval_returns_the_same_derived_envelope_the_placement_returned
        claim_type: retrieval
        grounds:
          - entities.ArtifactCase
          - endpoints.GET_/artifact-cases/{id}
          - endpoints.GET_/gallery-zones/{id}/artifact-cases
          - calculations.case_environmental_envelope
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          A case carries eight derived fields (case_volume_m3, silica_gel_kg,
          placed_artifact_count, required_rh_min_pct, required_rh_max_pct,
          allowed_lux, env_feasible, security_ok). The claim is that a plain GET
          re-reads the STORED values rather than recomputing something different,
          and that the same row read through the zone sub-resource collection is
          byte-identical to the row read by id. A naive implementation that
          recomputes the envelope lazily on read, or that folds the artifact set in
          a different order, will drift on at least one of the two rounded numbers.
        test_recipe:
          setup:
            - "one project advanced to SCHEMATIC, one zone, one stable PAPER artifact 45.0-55.0 RH / 50.0 lux / ENHANCED, one case 120x60x90 cm interior at 0.4 air exchanges per day, and the artifact placed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /exhibit-projects/${proj}/gallery-zones"
              payload: { zone_code: "Z-A", visitor_route_order: 1, max_noise_dba: 85.0, case_slot_capacity: 2, closure_allowed: true, dust_settling_buffer_minutes: 120 }
              as: MuseumOperations
              as_user_id: ops-01
              captures: { zone1: $.data.id }
            - call: "POST /exhibit-projects/${proj}/artifacts"
              payload: { accession_number: "2019.14.3", material_class: "PAPER", required_rh_min_pct: 45.0, required_rh_max_pct: 55.0, max_lux: 50.0, security_class: "ENHANCED", condition_status: "STABLE" }
              as: Curator
              as_user_id: cur-01
              captures: { art1: $.data.id }
            - call: "POST /exhibit-projects/${proj}/artifact-cases"
              payload: { zone_id: "${zone1}", case_code: "C-01", objective_code: "OBJ-EXTINCTION", security_tier: "ENHANCED", target_rh_pct: 50.0, rh_tolerance_pct: 2.0, target_lux: 50.0, uv_microwatt_per_lumen: 20.0, interior_l_cm: 120.0, interior_w_cm: 60.0, interior_h_cm: 90.0, air_exchanges_per_day: 0.4 }
              as: Curator
              as_user_id: cur-01
              captures: { case1: $.data.id, case_v1: $.data.version }
            - call: "POST /artifact-cases/${case1}/placements"
              payload: { expected_case_version: "${case_v1}", artifact_id: "${art1}" }
              as: Curator
              as_user_id: cur-01
              captures: { pst: $.data.placement_status, acid: $.data.assigned_case_id }
          trigger:
            - call: "GET /artifact-cases/${case1}"
              payload: {}
              as: MuseumOperations
              as_user_id: ops-01
              captures: { vol: $.data.case_volume_m3, sil: $.data.silica_gel_kg, cnt: $.data.placed_artifact_count, rmin: $.data.required_rh_min_pct, rmax: $.data.required_rh_max_pct, alux: $.data.allowed_lux, feas: $.data.env_feasible, sok: $.data.security_ok, cst: $.data.status, mst: $.data.mount_status, cver: $.data.version }
            - call: "GET /gallery-zones/${zone1}/artifact-cases"
              payload: {}
              as: MuseumOperations
              as_user_id: ops-01
