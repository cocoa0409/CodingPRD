              as: ProgramAdmin
              captures: { ps_a: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "NovaPen Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@novapen.example", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { sp_np: $.data.id }
