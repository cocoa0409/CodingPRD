            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Hal", specialty: "FAMILY_MEDICINE", email: "hal@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
