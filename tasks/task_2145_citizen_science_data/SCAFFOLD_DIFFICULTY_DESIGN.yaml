      - name: publication_quality_floor_pinned_to_candidate_set
        grounds:
          - calculations.publication_release_metrics
          - entities.DataPublication.fields.quality_floor
          - entities.DataPublication.fields.record_count
          - entities.DataPublication.fields.mean_quality
          - concurrency_rules[publication-create-against-stale-campaign]
        distinguishing_aspect: |
          Mode (c) circular-dependency instance: record_count depends on quality_floor while
          quality_floor is a median over the set record_count would select. The scaffold pins the
          floor to the CANDIDATE set and forbids re-derivation, so four accepted observations with
          final_quality_points [12.80, 25.60, 66.00, 66.00] yield quality_floor 20.48 and
          record_count 3; re-deriving the median from the included set would give floor 52.80 and
          record_count 2.
