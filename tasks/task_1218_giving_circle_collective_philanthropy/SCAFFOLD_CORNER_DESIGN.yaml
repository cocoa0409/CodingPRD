  - section: rbac
    instances:
      - name: member_cannot_advance_cycle_forbidden
        claim_type: role_denial
        grounds:
          - roles.CircleAdmin
          - endpoints["POST /api/cycles/{cycle_id}/advance"]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Exclusive operation: advance belongs to CircleAdmin; a Member caller with a perfectly valid OCC version gets 403 ERR_FORBIDDEN (priority 2, before any state check)."
        test_recipe:
          setup: ["Cycle in DRAFT; one ACTIVE membership"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle RB1", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.rb1@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
          trigger:
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"
            - "GivingCycle.${cycle_id}.phase == DRAFT"

      - name: finance_officer_cannot_receive_contribution_forbidden
        claim_type: role_denial
        grounds:
          - roles.FinanceOfficer
          - endpoints["POST /api/contributions/{contribution_id}/receive"]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Peer separation between host-org roles: FinanceOfficer handles payouts only; recording a contribution receipt is CircleAdmin-exclusive and yields 403."
        test_recipe:
          setup: ["Cycle in POOLING; one PLEDGED contribution"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle RB2", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
