  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ph_penalty_boundary_exactly_7_8
        grounds:
          - calculations.dosing_recommendation
          - entities.ChemicalReading.fields.recommended_dose_grams
        distinguishing_aspect: |
          Numeric threshold metric: pH penalty fires on ph > 7.8 (strict). At ph == 7.8 no penalty
          (dose 28.0); the boundary uses > not >=. Reached via POST /visits/{id}/readings.
        test_recipe:
          setup:
            - "CHLORINE pool 10000 gal OPEN, ACTIVE plan, DISPATCHED route, SCHEDULED visit; reading fc=1.0 ph=7.8 ta=100."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Qr Owner", email: "qr@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 10000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
          trigger:
            - call: "POST /visits/${visit_id}/readings"
              payload: { free_chlorine_ppm: 1.0, ph: 7.8, total_alkalinity_ppm: 100 }
              as: FieldTechnician
              captures: { reading_id: $.data.id }
          assert:
            - "ChemicalReading.${reading_id}.recommended_dose_grams == 28.0"

      - name: route_at_capacity_boundary_empty_slot_count
        grounds:
          - validations[priority=12]
          - entities.RouteAssignment.fields.capacity_visits
          - state_machines.ServiceVisit.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          A different metric (collection count, not a numeric chemistry threshold) reached through a different
          endpoint (POST /visits): a route with capacity_visits==1 holding exactly one non-terminal visit
          rejects the next at count==capacity (>=), but accepts a new one after the first becomes terminal.
        test_recipe:
          setup:
            - "Route capacity 1, one SCHEDULED visit; pool OPEN, plan ACTIVE."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "St Owner", email: "st@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 1 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_a: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 600, slot_end_minute: 660 }
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ROUTE_AT_CAPACITY"

  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_complete_requires_pool_open
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_COMPLETED
          - entities.Pool.fields.service_status
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair ServiceVisit->Pool: a SCHEDULED visit may only complete when its Pool.service_status
          IN {OPEN, GREEN_RECOVERY}; a CLOSED pool blocks completion with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Plan ACTIVE, route DISPATCHED, one SCHEDULED visit, but pool still CLOSED (never opened)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Uv Owner", email: "uv@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: false }
              as: FieldTechnician
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ServiceVisit.${visit_id}.status == SCHEDULED"

      - name: plan_activate_requires_customer_active
        grounds:
          - state_machines.ServicePlan.DRAFT_to_ACTIVE
          - entities.Customer.fields.account_status
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair ServicePlan->Customer (different pair than ServiceVisit->Pool): a DRAFT plan may only
          activate when its owning Customer.account_status == ACTIVE; a SUSPENDED customer blocks activation
          with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Customer SUSPENDED, a DRAFT plan on their pool."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Wx Owner", email: "wx@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /customers/${cust_id}/suspend"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ServicePlan.${plan_id}.status == DRAFT"

  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: visit_slot_overlap_on_route_half_open
        grounds:
          - validations[priority=8]
          - entities.ServiceVisit.fields.slot_start_minute
          - entities.ServiceVisit.fields.slot_end_minute
        distinguishing_aspect: |
          Half-open [start,end) slot occupancy on a RouteAssignment: an existing visit [540,600) rejects a
          new [580,640) (overlap) but a new [600,660) is accepted (adjacency at the shared boundary 600 is
          allowed). Interval semantics: point-adjacency permitted.
        test_recipe:
          setup:
            - "Route capacity 5 with one SCHEDULED visit [540,600); pool OPEN, plan ACTIVE."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Yz Owner", email: "yz@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_a: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 580, slot_end_minute: 640 }
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SLOT_OVERLAP"

      - name: visit_slot_outside_route_window
        grounds:
          - validations[priority=8]
          - entities.RouteAssignment.fields.window_start_minute
          - entities.RouteAssignment.fields.window_end_minute
        distinguishing_aspect: |
          Different interval semantics (containment of a slot inside the route window, not pairwise visit
          overlap): a slot [1000,1040) on a route window [480,1020) is rejected because 1040 exceeds the
          window end 1020, even though no other visit occupies that span — geometric treatment is window
          boundary containment.
        test_recipe:
          setup:
            - "Empty route window [480,1020), capacity 5; pool OPEN, plan ACTIVE."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ab Owner", email: "ab2@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 1000, slot_end_minute: 1040 }
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SLOT_OVERLAP"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_issue_then_void_balance_conserved
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOIDED
          - entities.Pool.fields.balance_due_cents
        distinguishing_aspect: |
          Conserved quantity = Pool.balance_due_cents (money). Forward issue adds amount_cents to the balance;
          the compensating void removes it. Invariant: balance_due_cents == sum(Invoice.amount_cents WHERE
          status==ISSUED); after issue+void it returns to its pre-issue value (0).
        test_recipe:
          setup:
            - "Pool with a COMPLETED visit billed 26000 and a DRAFT invoice referencing it."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cd Owner", email: "cd@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: true }
              as: FieldTechnician
            - call: "POST /invoices"
              payload: { pool_id: "${pool_id}", visit_id: "${visit_id}" }
              as: AccountManager
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: AccountManager
          assert:
            - "Invoice.${inv_id}.status == VOIDED"
            - "Pool.${pool_id}.balance_due_cents == 0"

      - name: green_recovery_create_then_cancel_recovery_count_conserved
        grounds:
          - state_machines.Pool.OPEN_to_GREEN_RECOVERY
          - state_machines.ServiceVisit.RECOVERY_SCHEDULED_to_CANCELLED
          - state_machines.Pool.GREEN_RECOVERY_to_OPEN
        distinguishing_aspect: |
          Conserved quantity = the pool's open recovery-visit count / posture (a non-money quantity, distinct
          from balance). Forward green completion flips Pool to GREEN_RECOVERY and creates one
          RECOVERY_SCHEDULED visit; the compensating cancel of that sole recovery visit reverts Pool to OPEN,
          leaving zero RECOVERY_SCHEDULED visits — posture and count restored.
        test_recipe:
          setup:
            - "Pool in GREEN_RECOVERY after a green completion, with exactly one auto-created RECOVERY_SCHEDULED visit."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ef2 Owner", email: "ef2@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "RECURRING", frequency: "WEEKLY", per_visit_rate_cents: 6000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: true }
              as: FieldTechnician
            - call: "GET /routes/${route_id}/visits"
              payload: {}
              as: RouteManager
              captures: { recovery_visit_id: "$.data[1].id" }
          trigger:
            - call: "POST /visits/${recovery_visit_id}/cancel"
              payload: {}
              as: RouteManager
          assert:
            - "ServiceVisit.${recovery_visit_id}.status == CANCELLED"
            - "Pool.${pool_id}.service_status == OPEN"
