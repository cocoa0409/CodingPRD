            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-06T08:00:00.000Z", end_at: "2026-08-06T18:00:00.000Z", volunteer_slots: 2 }, as: ConstructionManager, as_user_id: "cm-1", captures: { sh4: $.data.id } }
