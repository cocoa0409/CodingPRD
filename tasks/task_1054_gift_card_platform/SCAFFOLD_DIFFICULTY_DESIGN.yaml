            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c_id}/redeem", payload: { amount_cents: 1000 }, as: POSTerminal }
            - { call: "POST /gift-cards/${c_id}/redeem", payload: { amount_cents: 1000 }, as: POSTerminal }
            - { call: "POST /gift-cards/${c_id}/redeem", payload: { amount_cents: 1000 }, as: POSTerminal }
            - { call: "POST /gift-cards/${c_id}/redeem", payload: { amount_cents: 1000 }, as: POSTerminal }
            - { call: "POST /gift-cards/${c_id}/redeem", payload: { amount_cents: 1000 }, as: POSTerminal }
          trigger:
