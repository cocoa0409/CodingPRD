  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: health_clearance_hard_fail_zero_component
        claim_type: correct_result
        grounds: [calculations.health_clearance_score, state_machines.HealthScreening.DRAFT_to_FAILED, state_machines.Dog.IN_HEALTH_SCREENING_to_CAREER_CHANGED]
        distinguishing_aspect: "Hard-fail gate dominates the weighted total: components 0+20+15+15+20 sum to 70, but hip POOR (0 points) forces FAILED and Dog -> CAREER_CHANGED with reason HEALTH, even though 70 would pass no threshold anyway — verified separately that a zero component at a hypothetical passing total still fails."
        test_recipe:
          setup: ["DONATED dog IN_HEALTH_SCREENING with a DRAFT screening (hip POOR)"]
          setup_api_calls:
            - { call: "POST /api/dogs", payload: { name: "Hipless", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2024-01-01", region: NW, donor_name: "Donor H" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: POOR, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CLEAR }, as: Veterinarian, captures: { sc_id: $.data.id } }
          trigger:
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian, captures: { outcome: $.data.status, score: $.data.clearance_score } }
          assert:
            - "HealthScreening.${sc_id}.clearance_score == 70 (0+20+15+15+20)"
            - "HealthScreening.${sc_id}.status == FAILED (hard fail: hip POOR scores 0)"
            - "Dog.${d_id}.status == CAREER_CHANGED and career_change_reason == HEALTH"

      - name: health_clearance_bred_vs_donated_thresholds
        claim_type: correct_result
        grounds: [calculations.health_clearance_score]
        distinguishing_aspect: "Variant selection by Dog.origin: identical components summing 84 with genetic CARRIER pass a DONATED dog (>= 84) but fail a BRED dog twice (84 < 92 and genetic != CLEAR) — same numbers, origin-dependent outcome."
        test_recipe:
          setup: ["one DONATED dog and one BRED dog, both IN_HEALTH_SCREENING with identical component drafts"]
          setup_api_calls:
            - { call: "POST /api/dogs", payload: { name: "SireB", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2022-01-01", region: NW, donor_name: "Donor SB" }, as: ProgramAdmin, captures: { sire_id: $.data.id } }
            - { call: "POST /api/dogs", payload: { name: "DamB", origin: DONATED, breed: "Labrador", sex: FEMALE, born_on: "2022-02-01", region: NW, donor_name: "Donor DB" }, as: ProgramAdmin, captures: { dam_id: $.data.id } }
            - { call: "POST /api/dogs", payload: { name: "DonatedPup", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2024-06-01", region: NW, donor_name: "Donor DP" }, as: ProgramAdmin, captures: { dd_id: $.data.id } }
            - { call: "POST /api/dogs/${dd_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs", payload: { name: "BredPup", origin: BRED, breed: "Labrador", sex: FEMALE, born_on: "2024-06-01", region: NW, sire_id: "${sire_id}", dam_id: "${dam_id}" }, as: ProgramAdmin, captures: { bd_id: $.data.id } }
            - { call: "POST /api/dogs/${bd_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${dd_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { scd_id: $.data.id } }
            - { call: "POST /api/dogs/${bd_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { scb_id: $.data.id } }
          trigger:
            - { call: "POST /api/screenings/${scd_id}/submit", as: Veterinarian }
            - { call: "POST /api/screenings/${scb_id}/submit", as: Veterinarian }
          assert:
            - "DONATED: HealthScreening.${scd_id}.status == CLEARED with clearance_score == 84; Dog.${dd_id}.status == CLEARED"
            - "BRED: HealthScreening.${scb_id}.status == FAILED with clearance_score == 84; Dog.${bd_id}.status == CAREER_CHANGED (84 < 92 AND genetic_panel CARRIER != CLEAR)"

      - name: raiser_selector_tie_break_created_at
        claim_type: correct_result
        grounds: [calculations.raiser_selector]
        distinguishing_aspect: "Selector determinism: two APPROVED raisers in the dog's region with equal experience_score (50) and null last_placement_ended_at — the tie is broken by created_at ASC, so the first-created raiser wins; nulls-last tie-break is exercised because both are null."
        test_recipe:
          setup: ["raisers R1 then R2 (creation order pinned), both APPROVED, region NW, experience 50, capacity 1; CLEARED dog in region NW"]
          setup_api_calls:
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser First", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r1_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r1_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r1_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser Second", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r2_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r2_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r2_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "TieDog", origin: DONATED, breed: "Poodle", sex: MALE, born_on: "2024-01-01", region: NW, donor_name: "Donor T" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
          trigger:
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: {}, as: TrainingDirector, captures: { chosen: $.data.puppy_raiser_id } }
          assert:
            - "placement.puppy_raiser_id == ${r1_id} (experience tie 50 == 50, both last_placement_ended_at null, created_at ASC breaks the tie)"
            - "PuppyRaiser.${r1_id}.status == ACTIVE and current_dog_count == 1; ${r2_id} unchanged"

      - name: raiser_selector_empty_pool_returns_error
        claim_type: correct_result
        grounds: [calculations.raiser_selector, "errors[ERR_NO_AVAILABLE_RAISER]"]
        distinguishing_aspect: "Selector fallback: pool filtered to empty (no APPROVED/ACTIVE raiser in region NW with spare capacity) yields ERR_NO_AVAILABLE_RAISER, not a silent null pick."
        test_recipe:
          setup: ["CLEARED dog in region SW; the only raiser is APPROVED but region NW"]
          setup_api_calls:
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser NW", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "SWDog", origin: DONATED, breed: "Poodle", sex: FEMALE, born_on: "2024-01-01", region: SW, donor_name: "Donor SW" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
          trigger:
            - call: "POST /api/dogs/${d_id}/raiser-placements"
              payload: {}
              as: TrainingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_AVAILABLE_RAISER (region filter empties the pool)"
            - "no RaiserPlacement created: GET /api/dogs/${d_id}/raiser-placements returns empty list"

      - name: match_selector_task_coverage_and_explicit_insufficient
        claim_type: correct_result
        grounds: [calculations.match_selector, "errors[ERR_NO_ELIGIBLE_MATCH]", "errors[ERR_TASK_COVERAGE_INSUFFICIENT]"]
        distinguishing_aspect: "Match selector coverage filter: dog certified only for RETRIEVE_ITEMS while the sole ELIGIBLE entry requires [RETRIEVE_ITEMS, OPEN_DOORS] — selector mode returns ERR_NO_ELIGIBLE_MATCH; naming the same entry explicitly returns ERR_TASK_COVERAGE_INSUFFICIENT (422), proving filter-vs-violation divergence."
        test_recipe:
          setup: ["MATCH_READY dog certified for RETRIEVE_ITEMS only; ELIGIBLE entry requiring RETRIEVE_ITEMS + OPEN_DOORS"]
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Cov", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/trainers/${t_id}/certify", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "CoverDog", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2024-01-01", region: NW, donor_name: "Donor CV" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser CV", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /api/raiser-placements/${pl_id}/complete", payload: { primary_trainer_id: "${t_id}" }, as: TrainingDirector }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 95 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 90 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: PUBLIC_MANNERS, score: 88 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: OBEDIENCE, score: 85 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: SOCIALIZATION, score: 82 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 84 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/applicants", payload: { full_name: "Cov Applicant", email: "cov.a@x.com", placement_track: MOBILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [RETRIEVE_ITEMS, OPEN_DOORS], task_urgency_tier: STANDARD, home_environment_score: 6 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor CW", amount_cents: 1350000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c_id: $.data.id } }
            - { call: "POST /api/contributions/${c_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id" } }
            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { d_v: $.data.version } }
          trigger:
            - call: "POST /api/dogs/${d_id}/match-proposals"
              payload: { expected_dog_version: "${d_v}" }
              as: IntakeCoordinator
              captures: { err1: $.data.error_id }
            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { d_v2: $.data.version } }
            - call: "POST /api/dogs/${d_id}/match-proposals"
              payload: { waitlist_entry_id: "${entry_id}", expected_dog_version: "${d_v2}" }
              as: IntakeCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "selector mode: error_id == ERR_NO_ELIGIBLE_MATCH (coverage filter emptied the pool)"
            - "explicit mode: error_id == ERR_TASK_COVERAGE_INSUFFICIENT (422; named entry fails subset check)"
            - "no MatchRecord created: GET /api/dogs/${d_id}/matches returns empty list"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Undeclared role header value is rejected with ERR_UNAUTHENTICATED (401) before any role-permission check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/applicants"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED; http status == 401"

      - name: role_not_permitted_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Veterinarian (a declared role) calling the IntakeCoordinator-exclusive POST /api/applicants is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/applicants"
              payload: { full_name: "Vet Attempt", email: "vet.a@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN; http status == 403; no Applicant created"

      - name: ownership_scope_violation_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_OWNERSHIP_SCOPE]", "roles[Applicant]"]
        distinguishing_aspect: "Applicant B's identity acting on applicant A's resubmit (A is in NEEDS_INFO) is rejected with ERR_OWNERSHIP_SCOPE — the entity-backed ownership check compares X-User-ID to the resource's applicant id."
        test_recipe:
          setup: ["applicant A IN_REVIEW then NEEDS_INFO; applicant B exists"]
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Owner A", email: "owner.a@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/request-info", payload: { info_request_note: "need docs" }, as: IntakeCoordinator }
            - { call: "POST /api/applicants", payload: { full_name: "Owner B", email: "owner.b@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator, captures: { b_id: $.data.id } }
          trigger:
            - call: "POST /api/applicants/${a_id}/resubmit"
              as: Applicant
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OWNERSHIP_SCOPE; http 403"
            - "Applicant.${a_id}.application_status remains NEEDS_INFO"

      - name: contribution_receive_sod_same_operator_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SOD_CONFLICT]", state_machines.Contribution.PLEDGED_to_RECEIVED]
        distinguishing_aspect: "Segregation of duties on the fundraising ledger: the coordinator who recorded a PLEDGED contribution cannot also mark it RECEIVED — same operator id yields ERR_SOD_CONFLICT."
        test_recipe:
          setup: ["WAITLISTED applicant with a PLEDGED contribution created by operator coord-a"]
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Sod Ledger", email: "sod.l@x.com", placement_track: FACILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [GUIDE_NAVIGATION], task_urgency_tier: STANDARD, home_environment_score: 5 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor Sod", amount_cents: 100000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c_id: $.data.id } }
          trigger:
            - call: "POST /api/contributions/${c_id}/receive"
              as: IntakeCoordinator
              as_user_id: "coord-a"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SOD_CONFLICT; http 409"
            - "Contribution.${c_id}.status remains PLEDGED"

      - name: contribution_below_minimum_unshadowed
        claim_type: violation_to_error
        grounds: ["validations[priority=33]", "errors[ERR_CONTRIBUTION_BELOW_MINIMUM]"]
        distinguishing_aspect: "amount_cents 50 on an active WAITLISTED applicant surfaces the fiscal minimum error itself (no higher-priority violation present)."
        test_recipe:
          setup: ["WAITLISTED applicant"]
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Min Fund", email: "min.f@x.com", placement_track: FACILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [GUIDE_NAVIGATION], task_urgency_tier: STANDARD, home_environment_score: 5 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
          trigger:
            - call: "POST /api/applicants/${a_id}/contributions"
              payload: { donor_name: "Tiny", amount_cents: 50 }
              as: IntakeCoordinator
              as_user_id: "coord-a"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CONTRIBUTION_BELOW_MINIMUM; http 422"

      - name: approve_without_accepted_assessment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=30]", "errors[ERR_ASSESSMENT_REQUIRED]"]
        distinguishing_aspect: "Approve from IN_REVIEW with only a FINALIZED_REJECTED assessment fails with ERR_ASSESSMENT_REQUIRED (referential requirement)."
        test_recipe:
          setup: ["applicant IN_REVIEW; its only assessment FINALIZED_REJECTED"]
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "No Assess", email: "no.a@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [RETRIEVE_ITEMS], task_urgency_tier: STANDARD, home_environment_score: 2 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_REJECTED }, as: IntakeCoordinator }
          trigger:
            - call: "POST /api/applicants/${a_id}/approve"
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSESSMENT_REQUIRED; http 409"
            - "Applicant.${a_id}.application_status remains IN_REVIEW"

      - name: recert_window_enforced
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_RECERT_WINDOW]"]
        distinguishing_aspect: "Recertification scheduled 45 days before recert_due_at (window is +-30 days, inclusive) is rejected with ERR_RECERT_WINDOW; OCC version was fresh, isolating the temporal rule."
        test_recipe:
          setup: ["graduated partnership ACTIVE since 2026-10-16 (recert_due_at 2027-10-16); certified pat evaluator E"]
