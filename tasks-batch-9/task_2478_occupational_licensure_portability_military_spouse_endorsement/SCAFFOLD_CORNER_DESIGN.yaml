        excluded_because:
          difficulty_instance: combinatorial_formula / fee_waiver_per_component_rounding_beats_sum_then_round
          rationale: "The round-per-component-then-sum ordering is exactly what that §1.8 instance pins, asserting 12342 rather than the sum-then-round 12344."

      - name: expedite_surcharge_and_waiver_cap_interaction
        claim_type: Constants Applied
        grounds:
          - calculations.net_fee_due_cents.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / expedite_surcharge_flips_military_waiver_cap_tier
          rationale: "That §1.8 instance drives the MILITARY_FULL_WAIVER_CAP_CENTS tier flip by toggling only the expedited flag."

      - name: exam_waiver_threshold_boundary
        claim_type: Correct Result
        grounds:
          - calculations.substantial_equivalency_score
          - entities.CredentialEvaluation.fields.exam_waiver_granted
        excluded_because:
          difficulty_instance: boundary_precision_check / exam_waiver_threshold_at_exactly_min_score_vs_one_hundredth_below
          rationale: "The at-threshold and one-hundredth-below cases are both asserted there, together with the divergent EXAM_FEE_REVERSAL consequence."

      - name: permit_window_interval_merge_boundary
        claim_type: Correct Result
        grounds:
          - calculations.permit_window
        excluded_because:
          difficulty_instance: resource_temporal_overlap / permit_half_open_boundary_touching_start_admitted_one_second_earlier_collides
          rationale: "The half-open touching-endpoint case for permit windows is asserted there at one-second resolution."

