  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: fee_schedule_half_open_window_overlap_and_adjacency
        grounds:
          - validations[priority=12]
          - state_machines.FeeSchedule.PENDING_to_ACTIVE
          - errors.ERR_SCHEDULE_OVERLAP
        distinguishing_aspect: |
          Interval semantics = half-open [effective_from, effective_to) on the
          FeeSchedule resource. A retroactive insertion (new.effective_from <
          existing.effective_from with overlapping windows) is rejected with
          ERR_SCHEDULE_OVERLAP, while a schedule whose effective_from equals
          the existing schedule's effective_to is ADJACENT (no shared instant)
          and activates cleanly with no truncation.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Schedule A PPO [2026-01-01, 2026-06-01) ACTIVE."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", entries: [{ cdt_code: "D0120", allowed_cents: 5000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_a: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_a}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2025-06-01T00:00:00Z", entries: [{ cdt_code: "D0120", allowed_cents: 4000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_retro: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-06-01T00:00:00Z", entries: [{ cdt_code: "D0120", allowed_cents: 6000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_adj: $.data.id }
          trigger:
            - call: "POST /dental/fee-schedules/${fees_retro}/activate"
              payload: {}
              as: NetworkManager
              captures: { err: $.data.error_id }
            - call: "POST /dental/fee-schedules/${fees_adj}/activate"
              payload: {}
              as: NetworkManager
              captures: { adj_status: $.data.status }
            - call: "GET /dental/fee-schedules/${fees_a}"
              payload: {}
              as: NetworkManager
              captures: { a_to: $.data.effective_to, a_status: $.data.status }
          assert:
            - "retroactive schedule (effective_from 2025-06-01 < existing 2026-01-01, overlapping window) is rejected with 409 ERR_SCHEDULE_OVERLAP and remains PENDING"
            - "adjacent schedule (effective_from 2026-06-01 == existing effective_to 2026-06-01) activates: status == ACTIVE"
            - "schedule A is untouched: effective_to remains \"2026-06-01T00:00:00Z\" and status remains ACTIVE (half-open adjacency shares no instant, so no truncation)"

      - name: frequency_rolling_window_inclusive_both_ends
        grounds:
          - calculations.limitation_rule_evaluation
          - entities.LimitationRule.fields.window_months
          - entities.ClaimLine.fields.denial_code
        distinguishing_aspect: |
          Interval semantics = CLOSED [service_date - window_months,
          service_date] over a patient's paid-claim history — inclusive on
          both ends, unlike the half-open schedule windows. A prior paid
          cleaning exactly 6 months before the service date COUNTS toward the
          frequency cap, so a third cleaning inside the closed window is
          denied FREQUENCY.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan: deductible 0, prev 100, no waiting, ABP off; LimitationRule D0120 FREQUENCY window_months 6 max_occurrences 2."
            - "PPO provider; schedule with D0120 5000 ACTIVE; subscriber effective 2025-01-01."
            - "Paid claims for D0120 on 2026-01-15 and 2026-07-15."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
