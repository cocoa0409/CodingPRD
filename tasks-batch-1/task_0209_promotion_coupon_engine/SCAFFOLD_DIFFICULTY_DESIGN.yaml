              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "ABUC", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart1_id: $.data.id }
            - call: "POST /carts/${cart1_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart1_id}/applications"
              payload: { code: "ABUC" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart1_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart1_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart1_ver: $.data.version }
            - call: "POST /carts/${cart1_id}/checkout"
              payload: { expected_cart_version: "${cart1_ver}" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart2_id: $.data.id }
            - call: "POST /carts/${cart2_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
