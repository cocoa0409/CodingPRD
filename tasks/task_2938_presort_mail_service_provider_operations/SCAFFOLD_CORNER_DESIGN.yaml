              as: PresortOperator
              captures: { cont_bad_id: $.data.id, qualifies_bad: $.data.qualifies }
            - call: "POST /commingle-batches/${batch_1_id}/sort"
              payload: {}
              as: PresortOperator
              captures: { err_qual: $.data.error_id }
            - call: "POST /commingle-batches/${batch_2_id}/members"
              payload: { mail_job_id: "${job_2_id}" }
              as: PresortOperator
            - call: "POST /commingle-batches/${batch_2_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "021", sort_level: "FIVE_DIGIT", piece_count: 900 }
              as: PresortOperator
              captures: { cont_ok_id: $.data.id, qualifies_ok: $.data.qualifies }
            - call: "POST /commingle-batches/${batch_2_id}/sort"
              payload: {}
              as: PresortOperator
              captures: { err_pieces: $.data.error_id }
          assert:
            - "Empty batch: HTTP 422 with ${err_empty} == ERR_BATCH_HAS_NO_CONTAINERS — the piece-sum check never runs, so 0 vs 0 is not reported as a match either"
            - "${qualifies_bad} == false: a TRAY at FIVE_DIGIT needs 150 pieces and this one holds 100"
            - "Unqualified container: HTTP 422 with ${err_qual} == ERR_CONTAINER_NOT_QUALIFIED even though 100 != 1000 also violates priority 34 — the lower priority number wins"
            - "${qualifies_ok} == true for the 900-piece FIVE_DIGIT tray on batch 2"
            - "Qualified but short: HTTP 422 with ${err_pieces} == ERR_CONTAINER_PIECE_MISMATCH (900 containerised vs total_piece_count 1000)"
            - "Both batches are still OPEN with achieved_tier BASIC and rate_mills_per_piece 0 — no sortation was frozen"

      - name: priority_ordering_state_before_fiscal_on_a_resubmitted_statement
        claim_type: priority_ordering
        grounds:
          - validations[priority=13]
          - validations[priority=46]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_precedes_fiscal_on_resubmitted_statement
          rationale: "That instance violates the statement-state rule and the postage-balance rule in one call and asserts the state error wins, then clears the state violation to reveal the fiscal one."

      - name: priority_conflict_safety_before_referential_on_a_stale_move_update
        claim_type: priority_conflict
        grounds:
          - validations[priority=23]
          - validations[priority=25]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_referential_on_stale_move_update_and_class_mismatch
          rationale: "Both rules are violated by a single pooling call there and the move-update error is asserted to win, with the mail-class error revealed only after the first is fixed."

      - name: cross_entity_validation_permit_account_state_gates_pooling
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=19]
          - errors.ERR_PERMIT_ACCOUNT_NOT_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pooling_requires_active_permit_account
          rationale: "Both directions are asserted there: pooling refused while the funding permit is on HOLD and the same call succeeding once it is ACTIVE again, with the job's own state untouched by the refusal."

      - name: temporal_validation_billing_period_closed_interval_exclusivity
        claim_type: temporal_validation
        grounds:
          - validations[priority=41]
          - calculations.billing_period_exclusivity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / billing_period_closed_interval_pairwise_exclusivity
          rationale: "Closed-interval touching (an adjacent period sharing a single instant) is asserted to conflict there, with the pairwise scan in created_at ASC order."

      - name: aggregate_validation_dock_capacity_over_overlapping_windows
        claim_type: aggregate_validation
        grounds:
          - validations[priority=39]
          - calculations.dock_capacity_occupancy
        excluded_because:
          difficulty_instance: resource_temporal_overlap / dock_half_open_aggregate_capacity_at_facility
          rationale: "Individually valid appointments that collectively exceed dock_capacity_pallets_per_slot are asserted there, including the strict `occupied + new > capacity` boundary and the abutting window that does not count."

  # ===========================================================================
  # Section 5 — Endpoints (§1.5)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: action_endpoint_depart_moves_the_shipment_to_in_transit
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /drop-shipments/{id}/depart]
          - state_machines.DropShipment.SCHEDULED_to_IN_TRANSIT
        distinguishing_aspect: "Depart is a pure state action: it takes an empty payload, moves SCHEDULED -> IN_TRANSIT, bumps version and touches nothing else — deposited_at_utc stays null, the batch stays DOCUMENTED-or-earlier and the dock reservation is NOT released (unlike cancel). It also makes the shipment exempt from the clock's NO_SHOW sweep."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z; facility SCF-021 has dock_capacity_pallets_per_slot 4."
            - "One OPEN batch holds a SCHEDULED 4-pallet shipment for [2026-08-12T08:00:00.000Z, 2026-08-12T12:00:00.000Z), and a second OPEN batch exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 4, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_1_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_2_id: $.data.id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_1_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T08:00:00.000Z", window_end_utc: "2026-08-12T12:00:00.000Z", pallet_count: 4 }
              as: PresortOperator
              captures: { ship_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /drop-shipments/${ship_id}/depart"
              payload: {}
              as: PresortOperator
              captures: { status_1: $.data.status, deposited: $.data.deposited_at_utc, v1: $.data.version }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_2_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T08:00:00.000Z", window_end_utc: "2026-08-12T12:00:00.000Z", pallet_count: 1 }
              as: PresortOperator
              captures: { err_dock: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T13:00:00.000Z" }
              as: BureauAdmin
              captures: { swept: $.data.no_show_shipment_ids }
          assert:
            - "${status_1} == IN_TRANSIT, ${deposited} == null and ${v1} == ${v0} + 1 == 2"
            - "The dock is still held: ${err_dock} == ERR_DOCK_CAPACITY_EXCEEDED with HTTP 409, because an IN_TRANSIT shipment still occupies 4 of 4 pallets in that window"
            - "After the clock passes window_end_utc, ${swept} is an empty list and DropShipment.${ship_id}.status is still IN_TRANSIT — only SCHEDULED shipments are swept to NO_SHOW"
            - "CommingleBatch.${batch_1_id}.status is still OPEN: departing does not advance the batch"

      - name: computed_read_standalone_postage_estimate_for_one_job
        claim_type: computed_read
        grounds:
          - endpoints[GET /mail-jobs/{id}/postage-estimate]
          - calculations.commingled_postage_assessment
        distinguishing_aspect: "The estimate is a pure read with a four-field inline output and must persist nothing: it prices the job's own accepted_piece_count (1200, not the declared 1250) at the BASIC tier with ship_bp forced to 0, giving floor(32 * 1000 * 9200 * 10000 / 100000000) == 29440 mills and round_half_up(1200 * 29440 / 1000) == 35328 c, while MailJob.postage_due_cents stays 0."
        test_recipe:
          setup:
            - "Client ESTIM is ACTIVE with an ACTIVE permit account."
            - "One MARKETING_MAIL/LETTERS job of 1250 declared pieces with one hygiene run leaving accepted_piece_count 1200."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Estimate Mailers", client_code: "ESTIM", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-360360", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_id: $.data.id }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
          trigger:
            - call: "GET /mail-jobs/${job_id}/postage-estimate"
              payload: {}
              as: ClientContact
              captures: { pieces: $.data.piece_count, tier: $.data.standalone_tier, rate: $.data.standalone_rate_mills_per_piece, postage: $.data.standalone_postage_cents }
          assert:
            - "HTTP 200 with exactly the four declared fields: ${pieces} == 1200, ${tier} == BASIC, ${rate} == 29440, ${postage} == 35328"
            - "${pieces} is accepted_piece_count 1200, NOT declared_piece_count 1250 — 1250 pieces would price at 36800 c"
            - "${rate} == 29440 has no drop-ship component: the job_standalone variant forces ship_bp to 0 even though the client's usual entry facility discounts 300 bp"
            - "Nothing is persisted: MailJob.${job_id}.postage_due_cents == 0, status still HYGIENE_CLEARED and version unchanged by the read"

      - name: cross_reference_link_member_add_binds_job_to_batch_both_ways
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /commingle-batches/{id}/members]
          - entities.BatchMember
          - endpoints[GET /mail-jobs/{id}/batch-memberships]
        distinguishing_aspect: "The link endpoint requires BOTH sides to exist — an unknown mail_job_id is a 404 on the body reference, not a 400 — and on success it writes a junction row plus the reverse pointer on the job, so the association is navigable from either end and carries the piece snapshot."
        test_recipe:
          setup:
            - "Client LINKS is ACTIVE with commingle_opt_in true and an ACTIVE permit account."
            - "One hygiene-cleared MARKETING_MAIL/LETTERS job of 1000 accepted pieces and one OPEN MARKETING_MAIL/LETTERS batch at an OPEN SCF facility."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Linkline Mail", client_code: "LINKS", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-370370", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_id: $.data.id }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 990, ncoa_move_updated_count: 30, undeliverable_removed_count: 0, move_update_age_days: 10 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "11111111-2222-3333-4444-555555555555" }
              as: PresortOperator
              captures: { err_job: $.data.error_id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_id}" }
              as: PresortOperator
              captures: { mem_id: $.data.id, mem_job: $.data.mail_job_id, mem_batch: $.data.commingle_batch_id, contributed: $.data.contributed_piece_count }
            - call: "GET /mail-jobs/${job_id}/batch-memberships"
              payload: {}
              as: PresortOperator
              captures: { back_ref_id: "$.data[0].id" }
            - call: "GET /commingle-batches/${batch_id}/members"
              payload: {}
              as: PresortOperator
              captures: { fwd_ref_id: "$.data[0].id" }
          assert:
            - "Unknown job on the body: HTTP 404 with ${err_job} == ERR_MAIL_JOB_NOT_FOUND (the batch in the path exists, so this is a body-reference 404 and not ERR_INVALID_REQUEST)"
            - "Successful link: HTTP 201 with ${mem_job} == ${job_id}, ${mem_batch} == ${batch_id} and ${contributed} == 1000"
            - "Reverse navigation from the job returns exactly one row and ${back_ref_id} == ${mem_id}"
            - "Forward navigation from the batch returns exactly one row with total_count 1, and ${fwd_ref_id} == ${mem_id}"
            - "The job carries the pointer too: MailJob.${job_id}.commingle_batch_id == ${batch_id} and status == POOLED"

      - name: conditional_action_deposit_only_inside_the_appointment_window
        claim_type: conditional_action
        grounds:
          - validations[priority=40]
          - errors.ERR_OUTSIDE_APPOINTMENT_WINDOW
          - state_machines.DropShipment.IN_TRANSIT_to_DEPOSITED
        distinguishing_aspect: "Deposit is permitted only while the logical clock lies in the CLOSED window [window_start_utc, window_end_utc]; a truck that departed on time but arrives an hour late is refused with 422 and none of the deposit cascade fires — the batch stays DOCUMENTED, the containers stay DOCUMENTED and no ServiceLevelRecord is created. The shipment is not swept to NO_SHOW either, because IN_TRANSIT shipments are exempt."
        test_recipe:
          setup:
            - "The canonical batch is sorted, its statement submitted by pm-001 and then accepted clean by clerk-007, so the batch is DOCUMENTED."
            - "A 2-pallet shipment is booked for [2026-08-12T08:00:00.000Z, 2026-08-12T16:00:00.000Z] and has already departed."
          setup_api_calls: *corner_chain_submitted
          trigger:
            - call: "POST /postage-statements/${stmt_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T08:00:00.000Z", window_end_utc: "2026-08-12T16:00:00.000Z", pallet_count: 2 }
              as: PresortOperator
              captures: { ship_id: $.data.id }
            - call: "POST /drop-shipments/${ship_id}/depart"
              payload: {}
              as: PresortOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T17:00:00.000Z" }
              as: BureauAdmin
              captures: { swept: $.data.no_show_shipment_ids }
            - call: "POST /drop-shipments/${ship_id}/deposit"
              payload: {}
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { err_id: $.data.error_id }
          assert:
            - "${swept} is an empty list and DropShipment.${ship_id}.status is IN_TRANSIT — the sweep only takes SCHEDULED shipments"
            - "Late deposit: HTTP 422 with ${err_id} == ERR_OUTSIDE_APPOINTMENT_WINDOW, because 17:00 > window_end_utc 16:00"
            - "No cascade: DropShipment.${ship_id}.deposited_at_utc == null, CommingleBatch.${batch_id}.status == DOCUMENTED, SortContainer.${cont_1_id}.status == DOCUMENTED and MailJob.${job_a_id}.status == PRESORTED with mailed_at_utc null"
            - "GET /sort-containers/${cont_1_id}/service-level-records returns total_count 0 — records are created only by a successful deposit"
            - "Client.${cl_a_id}.lifetime_pieces_mailed == 0"

      - name: standard_crud_invoice_issue_then_exact_payment_settles_it
        claim_type: standard_crud
        grounds:
          - endpoints[POST /clients/{id}/invoices]
          - endpoints[POST /client-invoices/{id}/payment]
          - state_machines.ClientInvoice.ISSUED_to_PAID
          - validations[priority=44]
        distinguishing_aspect: "Payment settles only on an EXACT match with total_cents: 34159 c against a 34160 c invoice is refused with 422 and leaves paid_amount_cents at 0, the exact amount flips ISSUED -> PAID, and a replay of the same exact payment is then refused with 409 because the invoice is no longer ISSUED. Issuing the invoice must also drain the client's unbilled ledger from 31660 to 0 and move the job to BILLED."
        test_recipe:
          setup:
            - "The canonical batch has been accepted clean and deposited at 2026-08-12T14:00:00.000Z, so job A is MAILED with mailed_at_utc 2026-08-12T14:00:00.000Z and Client ACME has unbilled_postage_cents 31660."
          setup_api_calls: *corner_chain_deposited
          trigger:
            - call: "POST /clients/${cl_a_id}/invoices"
              payload: { period_start_utc: "2026-08-01T00:00:00.000Z", period_end_utc: "2026-08-31T23:59:59.000Z" }
              as: PostageManager
              captures: { inv_id: $.data.id, inv_total: $.data.total_cents, inv_status: $.data.status }
            - call: "POST /client-invoices/${inv_id}/payment"
              payload: { amount_cents: 34159 }
              as: PostageManager
              captures: { err_short: $.data.error_id }
            - call: "POST /client-invoices/${inv_id}/payment"
              payload: { amount_cents: 34160 }
              as: PostageManager
              captures: { paid_status: $.data.status, paid_amount: $.data.paid_amount_cents }
            - call: "POST /client-invoices/${inv_id}/payment"
              payload: { amount_cents: 34160 }
              as: PostageManager
              captures: { err_replay: $.data.error_id }
          assert:
            - "Issue: HTTP 201 with ${inv_status} == ISSUED, included_job_count 1, billed_piece_count 1200, postage_cents 31660, adjustment_cents 0, service_fee_cents 2500 and ${inv_total} == 34160"
            - "Ledger drained on issue: Client.${cl_a_id}.unbilled_postage_cents == 0 and MailJob.${job_a_id}.status == BILLED"
            - "Short payment: HTTP 422 with ${err_short} == ERR_PAYMENT_AMOUNT_MISMATCH; the invoice is still ISSUED with paid_amount_cents 0"
            - "Exact payment: HTTP 200 with ${paid_status} == PAID and ${paid_amount} == 34160"
            - "Replay: HTTP 409 with ${err_replay} == ERR_INVALID_INVOICE_STATE and paid_amount_cents still 34160"

  # ===========================================================================
  # Section 6 — Errors (§1.6) — every catalog code must be triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: not_found_family_for_every_path_id_in_the_catalog
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors.ERR_CLIENT_NOT_FOUND
          - errors.ERR_PERMIT_ACCOUNT_NOT_FOUND
          - errors.ERR_BATCH_NOT_FOUND
          - errors.ERR_BATCH_MEMBER_NOT_FOUND
          - errors.ERR_CONTAINER_NOT_FOUND
          - errors.ERR_ENTRY_FACILITY_NOT_FOUND
          - errors.ERR_STATEMENT_NOT_FOUND
          - errors.ERR_DROP_SHIPMENT_NOT_FOUND
          - errors.ERR_SERVICE_LEVEL_RECORD_NOT_FOUND
          - errors.ERR_INVOICE_NOT_FOUND
        distinguishing_aspect: "Each path-id family has its OWN 404 code, so a generic ERR_NOT_FOUND fails every call here. The last call also proves priority 6: a syntactically real BatchMember id under the WRONG batch is a 404 on the member (child does not belong to the path parent), not a success and not a batch 404."
        test_recipe:
          setup:
            - "One OPEN EntryFacility and two OPEN MARKETING_MAIL/LETTERS batches exist, so the last call can pair a real batch path with an unknown member id."
          setup_api_calls:
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: BureauAdmin
              captures: { e_client: $.data.error_id }
            - call: "GET /permit-accounts/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PostageManager
              captures: { e_permit: $.data.error_id }
            - call: "GET /commingle-batches/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PresortOperator
              captures: { e_batch: $.data.error_id }
            - call: "GET /sort-containers/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PresortOperator
              captures: { e_container: $.data.error_id }
            - call: "GET /entry-facilities/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: BureauAdmin
              captures: { e_facility: $.data.error_id }
            - call: "GET /postage-statements/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PostageManager
              captures: { e_statement: $.data.error_id }
            - call: "GET /drop-shipments/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: PresortOperator
              captures: { e_shipment: $.data.error_id }
            - call: "GET /service-level-records/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: AcceptanceClerk
              captures: { e_slr: $.data.error_id }
            - call: "GET /client-invoices/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PostageManager
              captures: { e_invoice: $.data.error_id }
            - call: "DELETE /commingle-batches/${batch_id}/members/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: PresortOperator
              captures: { e_member: $.data.error_id }
          assert:
            - "All ten calls return HTTP 404 with response_type == 'error'"
            - "${e_client} == ERR_CLIENT_NOT_FOUND, ${e_permit} == ERR_PERMIT_ACCOUNT_NOT_FOUND, ${e_batch} == ERR_BATCH_NOT_FOUND, ${e_container} == ERR_CONTAINER_NOT_FOUND, ${e_facility} == ERR_ENTRY_FACILITY_NOT_FOUND"
            - "${e_statement} == ERR_STATEMENT_NOT_FOUND, ${e_shipment} == ERR_DROP_SHIPMENT_NOT_FOUND, ${e_slr} == ERR_SERVICE_LEVEL_RECORD_NOT_FOUND, ${e_invoice} == ERR_INVOICE_NOT_FOUND"
            - "${e_member} == ERR_BATCH_MEMBER_NOT_FOUND — the batch in the path exists, so the 404 names the member, and no row is deleted"

      - name: duplicate_natural_keys_on_client_permit_and_facility_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - validations[priority=29]
          - validations[priority=30]
          - errors.ERR_DUPLICATE_CLIENT_CODE
          - errors.ERR_DUPLICATE_PERMIT_NUMBER
          - errors.ERR_DUPLICATE_FACILITY_CODE
        distinguishing_aspect: "Three independent natural keys are enforced globally, not per parent: the same permit_number is refused even when it is offered for a DIFFERENT client, which a per-client uniqueness index would allow. All three are 409 and none may create a second row."
        test_recipe:
          setup:
            - "Client DUPE and client OTHER exist, DUPE holds permit PI-380380 and facility SCF-021 is registered."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Duplicate Mailers", client_code: "DUPE", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Other Mailers", client_code: "OTHER", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_other_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-380380", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { name: "Impostor Mailers", client_code: "DUPE", service_fee_rate_per_thousand_cents: 2000 }
              as: BureauAdmin
              captures: { e_client: $.data.error_id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_other_id}", permit_number: "PI-380380", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { e_permit: $.data.error_id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "NDC", zip3: "022", dock_capacity_pallets_per_slot: 20, drop_ship_discount_bp: 200, served_zip3_list: ["022"] }
              as: BureauAdmin
              captures: { e_facility: $.data.error_id }
          assert:
            - "${e_client} == ERR_DUPLICATE_CLIENT_CODE with HTTP 409; Client.${cl_id}.name is still 'Duplicate Mailers'"
            - "${e_permit} == ERR_DUPLICATE_PERMIT_NUMBER with HTTP 409 even though the second attempt names a different client — permit_number is globally unique"
            - "${e_facility} == ERR_DUPLICATE_FACILITY_CODE with HTTP 409; EntryFacility.${fac_id}.facility_type is still SCF and dock_capacity_pallets_per_slot still 12"
            - "GET /clients/${cl_id} and GET /clients/${cl_other_id} still return the original two rows and GET /clients/${cl_id}/permit-accounts reports total_count 1 — no partial rows were written"

      - name: interval_temporal_and_empty_period_rejections_on_booking_and_billing
        claim_type: violation_to_error
        grounds:
          - validations[priority=37]
          - validations[priority=38]
          - validations[priority=43]
          - errors.ERR_INTERVAL_INVALID
          - errors.ERR_SHIPMENT_WINDOW_IN_PAST
          - errors.ERR_NO_BILLABLE_JOBS
        distinguishing_aspect: "Interval well-formedness is a 400 that precedes every business rule, an equal start and end is malformed because the comparison is STRICTLY after, and booking into the past is a separate 422 evaluated after it. An invoice period with no MAILED job is a 422 rather than a zero-total invoice."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z; one OPEN facility, one OPEN batch and one ACTIVE client with no mail jobs at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { name: "Empty Period Mailers", client_code: "EMPTY", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T10:00:00.000Z", window_end_utc: "2026-08-12T10:00:00.000Z", pallet_count: 2 }
              as: PresortOperator
              captures: { e_interval: $.data.error_id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-09T10:00:00.000Z", window_end_utc: "2026-08-09T18:00:00.000Z", pallet_count: 2 }
              as: PresortOperator
              captures: { e_past: $.data.error_id }
            - call: "POST /clients/${cl_id}/invoices"
              payload: { period_start_utc: "2026-08-31T00:00:00.000Z", period_end_utc: "2026-08-01T00:00:00.000Z" }
              as: PostageManager
              captures: { e_period: $.data.error_id }
            - call: "POST /clients/${cl_id}/invoices"
              payload: { period_start_utc: "2026-08-01T00:00:00.000Z", period_end_utc: "2026-08-31T23:59:59.000Z" }
              as: PostageManager
              captures: { e_billable: $.data.error_id }
          assert:
            - "${e_interval} == ERR_INTERVAL_INVALID with HTTP 400 — a zero-length window is malformed, not merely empty"
            - "${e_past} == ERR_SHIPMENT_WINDOW_IN_PAST with HTTP 422; the window is well formed but starts before the clock"
            - "${e_period} == ERR_INTERVAL_INVALID with HTTP 400 for the reversed invoice period"
            - "${e_billable} == ERR_NO_BILLABLE_JOBS with HTTP 422 for the well-formed period, because the client has no MAILED job in it"
            - "GET /commingle-batches/${batch_id}/drop-shipments returns total_count 0 and GET /clients/${cl_id}/invoices returns total_count 0 — all four calls wrote nothing"

      - name: pooling_gate_errors_for_already_pooled_category_mismatch_and_suspension
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - validations[priority=26]
          - validations[priority=18]
          - errors.ERR_JOB_ALREADY_POOLED
          - errors.ERR_PROCESSING_CATEGORY_MISMATCH
          - errors.ERR_CLIENT_SUSPENDED
        distinguishing_aspect: "Three distinct gates around intake and pooling: re-pooling an already POOLED job is its own code rather than the generic job-state error, a FLATS job on a LETTERS batch is refused even though its mail_class matches, and once the client is SUSPENDED even plain job intake stops. Each refusal must leave the batch ledger at its previous value."
        test_recipe:
          setup:
            - "Client GATE2 is ACTIVE with commingle_opt_in true and an ACTIVE permit account."
            - "One hygiene-cleared MARKETING_MAIL/LETTERS job of 1000 accepted pieces and one hygiene-cleared MARKETING_MAIL/FLATS job of 800 accepted pieces."
            - "One OPEN MARKETING_MAIL/LETTERS batch at an OPEN SCF facility."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Gate Two Mail", client_code: "GATE2", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-390390", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_letters_id: $.data.id }
            - call: "POST /mail-jobs/${job_letters_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 990, ncoa_move_updated_count: 30, undeliverable_removed_count: 0, move_update_age_days: 10 }
              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "FLATS", declared_piece_count: 800, declared_weight_oz_per_piece: 2.5 }
              as: PresortOperator
              captures: { job_flats_id: $.data.id }
            - call: "POST /mail-jobs/${job_flats_id}/hygiene-runs"
              payload: { submitted_piece_count: 800, cass_matched_count: 795, ncoa_move_updated_count: 20, undeliverable_removed_count: 0, move_update_age_days: 10 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_letters_id}" }
              as: PresortOperator
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_letters_id}" }
              as: PresortOperator
              captures: { e_pooled: $.data.error_id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_flats_id}" }
              as: PresortOperator
              captures: { e_category: $.data.error_id }
            - call: "POST /clients/${cl_id}/status"
              payload: { status: "SUSPENDED", reason: "credit hold" }
              as: BureauAdmin
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 400, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { e_suspended: $.data.error_id }
          assert:
            - "${e_pooled} == ERR_JOB_ALREADY_POOLED with HTTP 409 — priority 11 fires before the generic ERR_INVALID_JOB_STATE"
            - "${e_category} == ERR_PROCESSING_CATEGORY_MISMATCH with HTTP 422; MailJob.${job_flats_id}.status is still HYGIENE_CLEARED"
            - "After both refusals CommingleBatch.${batch_id}.member_job_count == 1, total_piece_count == 1000 and BatchMember ${mem_id} is unchanged with contributed_piece_count 1000"
            - "${e_suspended} == ERR_CLIENT_SUSPENDED with HTTP 409 and GET /clients/${cl_id}/mail-jobs still reports total_count 2"

      - name: permit_fiscal_and_shipment_uniqueness_gate_errors
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - validations[priority=35]
          - validations[priority=45]
          - errors.ERR_PERMIT_ANNUAL_FEE_LAPSED
          - errors.ERR_SHIPMENT_ALREADY_SCHEDULED
          - errors.ERR_PERMIT_HAS_RESERVED_FUNDS
        distinguishing_aspect: "Three gates that all read state OUTSIDE the request body: a permit whose annual fee lapsed one clock-tick ago blocks intake even though the account is ACTIVE and funded; a batch may hold only one live appointment at a time, so the second booking is refused even though the dock has room; and an account carrying reserved funds cannot be closed until the reservation is released by voiding the statement."
        test_recipe:
          setup:
            - "The canonical batch is sorted and its statement submitted by pm-001, so the house permit holds 120848 available and 79152 reserved and the batch is DOCUMENTED."
            - "The logical clock stands at 2026-08-10T09:00:00.000Z."
          setup_api_calls: *corner_chain_submitted
          trigger:
            - call: "POST /permit-accounts/${pa_h_id}/status"
              payload: { status: "CLOSED", reason: "consolidating accounts" }
              as: PostageManager
              captures: { e_reserved: $.data.error_id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_a_id}", permit_number: "PI-410410", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2026-08-09T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_lapsed_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_a_id}", permit_account_id: "${pa_lapsed_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 600, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { e_lapsed: $.data.error_id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T08:00:00.000Z", window_end_utc: "2026-08-12T16:00:00.000Z", pallet_count: 2 }
              as: PresortOperator
              captures: { ship_id: $.data.id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-13T08:00:00.000Z", window_end_utc: "2026-08-13T16:00:00.000Z", pallet_count: 2 }
              as: PresortOperator
              captures: { e_second_ship: $.data.error_id }
          assert:
            - "${e_reserved} == ERR_PERMIT_HAS_RESERVED_FUNDS with HTTP 409; PermitAccount.${pa_h_id}.status is still ACTIVE with reserved_cents 79152"
            - "The lapsed permit is created successfully (status ACTIVE, balance 0) — lapse is not a creation-time rule"
            - "${e_lapsed} == ERR_PERMIT_ANNUAL_FEE_LAPSED with HTTP 409, because annual_fee_paid_through_utc 2026-08-09T23:59:59.000Z is before the clock at 2026-08-10T09:00:00.000Z"
            - "${e_second_ship} == ERR_SHIPMENT_ALREADY_SCHEDULED with HTTP 409 even though the second window is a different day with a free dock, since DropShipment.${ship_id} is still SCHEDULED"
            - "GET /commingle-batches/${batch_id}/drop-shipments reports total_count 1"

      - name: delivery_scan_may_not_be_recorded_twice_on_one_record
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - errors.ERR_DELIVERY_ALREADY_SCANNED
          - endpoints[POST /service-level-records/{id}/delivery-scan]
        distinguishing_aspect: "The scan is single-shot: the guard is `actual_delivery_days IS NULL`, so a second scan is a 409 and must not overwrite the first verdict — a late correction cannot silently flip an on-time record to late. The service-level index therefore stays at the first scan's value."
        test_recipe:
          setup:
            - "The canonical batch has been deposited at 2026-08-12T14:00:00.000Z, so two unscanned ServiceLevelRecords exist (zone 2 / committed 4 / 1000 pieces and zone 8 / committed 7 / 2000 pieces)."
          setup_api_calls: *corner_chain_deposited
          trigger:
            - call: "POST /service-level-records/${slr_1_id}/delivery-scan"
              payload: { actual_delivery_days: 4, scanned_at_utc: "2026-08-16T10:00:00.000Z" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { first_days: $.data.actual_delivery_days, first_ontime: $.data.on_time, v1: $.data.version }
            - call: "POST /service-level-records/${slr_1_id}/delivery-scan"
              payload: { actual_delivery_days: 9, scanned_at_utc: "2026-08-21T10:00:00.000Z" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { e_scan: $.data.error_id }
            - call: "GET /clients/${cl_a_id}/service-level"
              payload: {}
              as: PostageManager
              captures: { zwi: $.data.zone_weighted_index, count: $.data.record_count }
          assert:
            - "First scan: HTTP 200 with ${first_days} == 4, ${first_ontime} == true and ${v1} == 2"
            - "Second scan: HTTP 409 with ${e_scan} == ERR_DELIVERY_ALREADY_SCANNED"
            - "Nothing was overwritten: ServiceLevelRecord.${slr_1_id}.actual_delivery_days == 4, scanned_at_utc == '2026-08-16T10:00:00.000Z', on_time == true and version still 2"
            - "${zwi} == 100.00 with ${count} == 1 — the refused correction did not enter the index, and record ${slr_2_id} is still unscanned"

      - name: insufficient_postage_balance_on_statement_submit
        claim_type: violation_to_error
        grounds:
          - validations[priority=46]
          - errors.ERR_INSUFFICIENT_POSTAGE_BALANCE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_precedes_fiscal_on_resubmitted_statement
          rationale: "The 402 balance error is asserted there as the surviving error once the statement-state violation is cleared, with the permit ledger untouched."

      - name: statement_not_accepted_on_deposit
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors.ERR_STATEMENT_NOT_ACCEPTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / deposit_requires_accepted_postage_statement
          rationale: "Deposit is attempted with the statement still SUBMITTED there and then succeeds after acceptance, with the whole deposit cascade asserted only on the second attempt."

      - name: entry_facility_closed_and_dock_capacity_exceeded_on_booking
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - validations[priority=39]
          - errors.ERR_ENTRY_FACILITY_CLOSED
          - errors.ERR_DOCK_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_temporal_on_closed_facility_and_full_dock
          rationale: "Both codes are triggered there in one instance, including the case where both rules are violated at once and the facility-state error must win."

      - name: move_update_stale_and_mail_class_mismatch_on_pooling
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - validations[priority=25]
          - errors.ERR_MOVE_UPDATE_STALE
          - errors.ERR_MAIL_CLASS_MISMATCH
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_referential_on_stale_move_update_and_class_mismatch
          rationale: "Both codes are asserted there from one pooling call, first as the winning error and then as the residual error after the first violation is repaired."

      - name: permit_account_not_active_on_pooling
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors.ERR_PERMIT_ACCOUNT_NOT_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pooling_requires_active_permit_account
          rationale: "The HOLD-then-ACTIVE pair is asserted there against an otherwise perfectly poolable job."

      - name: invalid_batch_state_on_statement_creation_and_submit
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors.ERR_INVALID_BATCH_STATE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_submit_requires_sorted_batch
          rationale: "The OPEN-batch refusal and the post-sort success are both asserted there, with the batch's frozen sortation fields checked after the successful path."

      - name: billing_period_overlap_on_invoice_issue
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - errors.ERR_BILLING_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / billing_period_closed_interval_pairwise_exclusivity
          rationale: "The touching-period conflict and the accepted disjoint period are both asserted there."

  # ===========================================================================
  # Section 7 — RBAC (§1.7)
  # ===========================================================================
  - section: rbac
    instances:

      - name: exclusive_operations_each_role_runs_its_own_surface
        claim_type: exclusive_operations
        grounds:
          - roles.BureauAdmin.exclusive_operations
          - roles.PostageManager.exclusive_operations
          - roles.PresortOperator.exclusive_operations
          - roles.AcceptanceClerk.exclusive_operations
        distinguishing_aspect: "The happy path spans four roles and no single role can drive it end to end: onboarding is BureauAdmin, permits and statements are PostageManager, pooling and sortation are PresortOperator, findings and verification are AcceptanceClerk. Every call in the chain must be accepted under its declared role, which is the positive half of the RBAC matrix."
        test_recipe:
          setup:
            - "Empty database; each call below is issued under the single role that declares it."
          setup_api_calls: *corner_chain_submitted
          trigger:
            - call: "POST /postage-statements/${stmt_id}/findings"
              payload: { finding_type: "SHORT_PAID", affected_piece_count: 120 }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { finding_id: $.data.id }
            - call: "GET /postage-statements/${stmt_id}/findings"
              payload: {}
              as: BureauAdmin
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "Every setup call succeeded under its declared role: BureauAdmin created the three clients and the facility, PostageManager created the three permits, funded the house account and created and submitted the statement, PresortOperator created the jobs, hygiene runs, batch, members and containers and closed sortation"
            - "AcceptanceClerk records the finding: HTTP 201 with ${finding_id} present and PostageStatement.${stmt_id}.verification_error_count == 1"
            - "Reads are shared across the oversight roles: BureauAdmin lists the findings and ${listed_id} == ${finding_id}"
            - "PostageStatement.${stmt_id}.status == SUBMITTED with submitted_by_user_id == 'pm-001'"

      - name: denial_cross_role_exclusive_operations_are_unauthorized
        claim_type: denial
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
          - roles.PresortOperator.exclusive_operations
          - roles.PostageManager.exclusive_operations
        distinguishing_aspect: "Role checks are per endpoint and there is no hierarchy: BureauAdmin — the most senior role — cannot close a sortation, PresortOperator cannot open a permit account, and AcceptanceClerk cannot pool a job. Each denial is 403 and must happen before any state or business rule, so the refused call cannot be distinguished from a rule violation by its side effects (there are none)."
        test_recipe:
          setup:
            - "Client RBAC1 is ACTIVE with commingle_opt_in true and an ACTIVE permit account, one hygiene-cleared MARKETING_MAIL/LETTERS job of 1000 accepted pieces and one OPEN MARKETING_MAIL/LETTERS batch."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Role Test Mail", client_code: "RBAC1", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-420420", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_id: $.data.id }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 990, ncoa_move_updated_count: 30, undeliverable_removed_count: 0, move_update_age_days: 10 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/sort"
              payload: {}
              as: BureauAdmin
              captures: { e_admin_sort: $.data.error_id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-430430", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PresortOperator
              captures: { e_operator_permit: $.data.error_id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_id}" }
              as: AcceptanceClerk
              captures: { e_clerk_pool: $.data.error_id }
            - call: "POST /clients/${cl_id}/status"
              payload: { status: "SUSPENDED", reason: "not my job" }
              as: PostageManager
              captures: { e_manager_suspend: $.data.error_id }
          assert:
            - "All four calls return HTTP 403 with ERR_UNAUTHORIZED: ${e_admin_sort}, ${e_operator_permit}, ${e_clerk_pool} and ${e_manager_suspend}"
            - "${e_admin_sort} is 403 even though the batch is also empty (which would otherwise be ERR_BATCH_HAS_NO_CONTAINERS) — the role check at priority 2 runs first"
            - "No side effects: CommingleBatch.${batch_id} is still OPEN with member_job_count 0, GET /clients/${cl_id}/permit-accounts reports total_count 1, MailJob.${job_id}.status is still HYGIENE_CLEARED and Client.${cl_id}.status is still ACTIVE"

      - name: segregation_of_duties_filer_cannot_verify_own_statement
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=9]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.PostageStatement.fields.submitted_by_user_id
        distinguishing_aspect: "The rule is on the USER identity, not the role: the same human holding the AcceptanceClerk role may not verify or annotate the statement they filed as pm-001, while a different X-User-ID with the same role may. It fires at priority 9, before every state and business rule, and applies to findings as well as verification."
        test_recipe:
          setup:
            - "The canonical batch is sorted and its statement submitted with X-User-ID pm-001, so submitted_by_user_id == 'pm-001'."
          setup_api_calls: *corner_chain_submitted
          trigger:
            - call: "POST /postage-statements/${stmt_id}/findings"
              payload: { finding_type: "SHORT_PAID", affected_piece_count: 120 }
              as: AcceptanceClerk
              as_user_id: "pm-001"
              captures: { e_finding: $.data.error_id }
            - call: "POST /postage-statements/${stmt_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceClerk
              as_user_id: "pm-001"
              captures: { e_verify: $.data.error_id }
            - call: "POST /postage-statements/${stmt_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { final_status: $.data.status, verified_by: $.data.verified_by_user_id }
          assert:
            - "${e_finding} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 and verification_error_count still 0"
            - "${e_verify} == ERR_SEGREGATION_OF_DUTIES with HTTP 403; the statement is still SUBMITTED and the permit still holds 120848 / 79152"
            - "A different user in the same role succeeds: ${final_status} == ACCEPTED_CLEAN and ${verified_by} == 'clerk-007'"
            - "PostageStatement.${stmt_id}.submitted_by_user_id is still 'pm-001' — the verification does not overwrite the filer"

      - name: denial_client_contact_cannot_reach_another_clients_records
        claim_type: denial
        grounds:
          - validations[priority=7]
          - errors.ERR_CLIENT_SCOPE_VIOLATION
          - roles.ClientContact.identity
        distinguishing_aspect: "ClientContact is entity-backed, so its X-User-ID IS a Client.id and scope is enforced by identity rather than by role: the same GET succeeds for its own client and is 403 for another, and the scope also reaches through MailJob.client_id and through the request body on POST /mail-jobs. A tenant-blind implementation would return 200 with another mailer's volumes."
        test_recipe:
          setup:
            - "Clients SELFC and RIVAL are both ACTIVE, each with its own ACTIVE permit account."
            - "RIVAL owns one MARKETING_MAIL/LETTERS job of 900 declared pieces."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Self Serve Mail", client_code: "SELFC", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_self_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Rival Mail", client_code: "RIVAL", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_rival_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_self_id}", permit_number: "PI-440440", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_self_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_rival_id}", permit_number: "PI-450450", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_rival_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_rival_id}", permit_account_id: "${pa_rival_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 900, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_rival_id: $.data.id }
          trigger:
            - call: "GET /clients/${cl_self_id}"
              payload: {}
              as: ClientContact
              as_user_id: "${cl_self_id}"
              captures: { own_code: $.data.client_code }
            - call: "GET /clients/${cl_rival_id}"
              payload: {}
              as: ClientContact
              as_user_id: "${cl_self_id}"
              captures: { e_other_client: $.data.error_id }
            - call: "GET /mail-jobs/${job_rival_id}"
              payload: {}
              as: ClientContact
              as_user_id: "${cl_self_id}"
              captures: { e_other_job: $.data.error_id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_rival_id}", permit_account_id: "${pa_rival_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 100, declared_weight_oz_per_piece: 1.0 }
              as: ClientContact
              as_user_id: "${cl_self_id}"
              captures: { e_other_post: $.data.error_id }
          assert:
            - "Own record: HTTP 200 with ${own_code} == 'SELFC'"
            - "${e_other_client} == ERR_CLIENT_SCOPE_VIOLATION with HTTP 403 — a 404 would leak nothing but is the wrong code"
            - "${e_other_job} == ERR_CLIENT_SCOPE_VIOLATION with HTTP 403, resolved through MailJob.client_id rather than the path client_id"
            - "${e_other_post} == ERR_CLIENT_SCOPE_VIOLATION with HTTP 403 and GET /clients/${cl_rival_id}/mail-jobs still reports total_count 1"

      - name: unauthenticated_missing_or_whitespace_only_identity_headers
        claim_type: denial
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 treats a whitespace-only header exactly like a missing one, and it precedes the role check, so a blank X-User-Role yields 401 ERR_UNAUTHENTICATED rather than 403 ERR_UNAUTHORIZED. It also precedes body validation, so a request that is BOTH unauthenticated and malformed still returns 401."
        test_recipe:
          setup:
            - "Empty database; no authentication state is needed because the check runs before anything else."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "No Headers Mail", client_code: "NOHDR", service_fee_rate_per_thousand_cents: 1000 }
              as: ""
              as_user_id: "admin-001"
              captures: { e_no_role: $.data.error_id }
            - call: "POST /clients"
              payload: { name: "No Headers Mail", client_code: "NOHDR", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              as_user_id: ""
              captures: { e_no_user: $.data.error_id }
            - call: "GET /clients/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: "   "
              as_user_id: "   "
              captures: { e_blank: $.data.error_id }
            - call: "POST /clients"
              payload: { client_code: "NOHDR" }
              as: ""
              as_user_id: ""
              captures: { e_blank_and_invalid: $.data.error_id }
          assert:
            - "Missing X-User-Role: HTTP 401 with ${e_no_role} == ERR_UNAUTHENTICATED (not 403)"
            - "Missing X-User-ID: HTTP 401 with ${e_no_user} == ERR_UNAUTHENTICATED"
            - "Whitespace-only headers: HTTP 401 with ${e_blank} == ERR_UNAUTHENTICATED — '   ' counts as absent, it is not a role name"
            - "Blank headers plus a body missing required fields: HTTP 401 with ${e_blank_and_invalid} == ERR_UNAUTHENTICATED, because priority 1 precedes priority 3"
            - "No Client row was created by any of the four calls"

  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_stale_permit_version_on_funding
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.permit-funding-stale-account
          - validations[priority=16]
          - errors.ERR_STALE_PERMIT_VERSION
        distinguishing_aspect: "Repeated deposits are legitimate on their own terms, so the only thing separating a correct top-up from a double credit is the OCC token: replaying version 1 after the first deposit has moved the account to version 2 must be a 412 and must NOT add the money again. The refused call also must not bump the version, so the caller's next attempt with version 2 succeeds."
        test_recipe:
          setup:
            - "Client OCC1 is ACTIVE with one ACTIVE PermitAccount at version 1, balance_cents 0 and reserved_cents 0."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Concurrency Mail", client_code: "OCC1", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-460460", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /permit-accounts/${pa_id}/funding"
              payload: { amount_cents: 50000, expected_permit_account_version: "${v0}", reference: "WIRE-1" }
              as: PostageManager
              captures: { bal_1: $.data.balance_cents, v1: $.data.version }
            - call: "POST /permit-accounts/${pa_id}/funding"
              payload: { amount_cents: 50000, expected_permit_account_version: "${v0}", reference: "WIRE-2" }
              as: PostageManager
              captures: { e_stale: $.data.error_id }
            - call: "POST /permit-accounts/${pa_id}/funding"
              payload: { amount_cents: 50000, expected_permit_account_version: "${v1}", reference: "WIRE-3" }
              as: PostageManager
              captures: { bal_2: $.data.balance_cents, v2: $.data.version }
          assert:
            - "First deposit: HTTP 200 with ${bal_1} == 50000 and ${v1} == 2 (${v0} was 1)"
            - "Replay of the stale token: HTTP 412 with ${e_stale} == ERR_STALE_PERMIT_VERSION"
            - "The refusal is total: PermitAccount.${pa_id}.balance_cents is still 50000 and version is still 2 — a failed OCC write does not bump the version"
            - "Retry with the fresh token: ${bal_2} == 100000 and ${v2} == 3, so exactly two of the three deposits landed"

      - name: optimistic_concurrency_stale_batch_version_on_statement_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.statement-create-stale-batch
          - validations[priority=17]
          - errors.ERR_STALE_BATCH_VERSION
        distinguishing_aspect: "The token is the BATCH's version, not the statement's, and sortation itself advances it: a caller who read the batch before the sort holds a stale token and must be refused with 412 even though the batch is now in the SORTED state the endpoint requires. Since statement creation voids any prior DRAFT statement, accepting the stale write would price the statement from piece counts the caller never saw."
        test_recipe:
          setup:
            - "Client OCC2 is ACTIVE with commingle_opt_in true and an ACTIVE PermitAccount funded with 100000 c."
            - "One hygiene-cleared MARKETING_MAIL/LETTERS job of 1200 accepted pieces is pooled into an OPEN batch at SCF-021, and a single 1200-piece FIVE_DIGIT tray is attached."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Batch Token Mail", client_code: "OCC2", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-470470", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id, pa_v0: $.data.version }
            - call: "POST /permit-accounts/${pa_id}/funding"
              payload: { amount_cents: 100000, expected_permit_account_version: "${pa_v0}", reference: "WIRE-9" }
              as: PostageManager
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_id: $.data.id }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_id}" }
              as: PresortOperator
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "021", sort_level: "FIVE_DIGIT", piece_count: 1200 }
              as: PresortOperator
            - call: "GET /commingle-batches/${batch_id}"
              payload: {}
              as: PostageManager
              captures: { stale_v: $.data.version }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/sort"
              payload: {}
              as: PresortOperator
              captures: { sorted_v: $.data.version, sorted_rate: $.data.rate_mills_per_piece, sorted_postage: $.data.batch_postage_cents }
            - call: "POST /postage-statements"
              payload: { commingle_batch_id: "${batch_id}", permit_account_id: "${pa_id}", expected_batch_version: "${stale_v}" }
              as: PostageManager
              as_user_id: "pm-002"
              captures: { e_stale: $.data.error_id }
            - call: "POST /postage-statements"
              payload: { commingle_batch_id: "${batch_id}", permit_account_id: "${pa_id}", expected_batch_version: "${sorted_v}" }
              as: PostageManager
              as_user_id: "pm-002"
              captures: { stmt_id: $.data.id, declared: $.data.declared_postage_cents, stmt_status: $.data.status }
          assert:
            - "Sortation freezes the batch: ${sorted_rate} == 28556 (BASIC 800 bp then SCF 300 bp, floored once) and ${sorted_postage} == 34267 (round_half_up(1200 * 28556 / 1000))"
            - "${sorted_v} > ${stale_v} — the sort bumped the version the reader had captured"
            - "Stale token: HTTP 412 with ${e_stale} == ERR_STALE_BATCH_VERSION, even though the batch IS SORTED as priority 12 requires"
            - "No statement row was written by the refused call: GET /commingle-batches/${batch_id}/postage-statements reports total_count 1 after the next call, not 2"
            - "Fresh token: HTTP 201 with ${stmt_status} == DRAFT and ${declared} == 34267"

      - name: pagination_with_filtering_stays_consistent_across_a_mutation
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /mail-jobs]
          - response_envelope.pagination_fields
        distinguishing_aspect: "total_count and has_more are recomputed per request against the FILTERED population, so inserting a third matching job between page reads must lift total_count from 2 to 3 and flip has_more back to true on the offset-1 page — a count cached from the first request, or a has_more derived from the unfiltered table, both fail."
        test_recipe:
          setup:
            - "Client PAGE1 is ACTIVE with an ACTIVE permit account and two RECEIVED MARKETING_MAIL/LETTERS jobs; client PAGE2 owns one RECEIVED job that must never appear."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Page One Mail", client_code: "PAGE1", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_1_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Page Two Mail", client_code: "PAGE2", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_2_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_1_id}", permit_number: "PI-480480", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_1_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_2_id}", permit_number: "PI-490490", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_2_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_1_id}", permit_account_id: "${pa_1_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 100, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_1_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_1_id}", permit_account_id: "${pa_1_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 200, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_2_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_2_id}", permit_account_id: "${pa_2_id}", mail_class: "FIRST_CLASS", processing_category: "LETTERS", declared_piece_count: 300, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_other_id: $.data.id }
          trigger:
            - call: "GET /mail-jobs"
              payload: { client_id: "${cl_1_id}", status: "RECEIVED", limit: 1, offset: 0 }
              as: PostageManager
            - call: "GET /mail-jobs"
              payload: { client_id: "${cl_1_id}", permit_account_id: "${pa_1_id}", mail_class: "MARKETING_MAIL", limit: 1, offset: 1 }
              as: PostageManager
              captures: { e_unknown_filter: $.data.error_id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_1_id}", permit_account_id: "${pa_1_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 300, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_3_id: $.data.id }
            - call: "GET /mail-jobs"
              payload: { client_id: "${cl_1_id}", status: "RECEIVED", limit: 1, offset: 1 }
              as: PostageManager
            - call: "GET /mail-jobs"
              payload: { client_id: "${cl_1_id}", status: "RECEIVED", limit: 100, offset: 0 }
              as: PostageManager
          assert:
            - "First page: exactly 1 row, total_count == 2, limit == 1, offset == 0, has_more == true"
            - "${e_unknown_filter} == ERR_INVALID_REQUEST with HTTP 400 — mail_class is not a declared query field for this endpoint, so unknown fields are rejected rather than ignored"
            - "After ${job_3_id} is created, the offset-1 page reports total_count == 3 with has_more == true (one row remains beyond offset 1)"
            - "The full page at limit 100 returns exactly 3 rows, total_count == 3, has_more == false, and they are exactly ${job_1_id}, ${job_2_id} and ${job_3_id}"
            - "${job_other_id} never appears in any of the four responses"

      - name: cascading_side_effects_deposit_chain_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CommingleBatch.DOCUMENTED_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / deposit_cascade_depth_three
          rationale: "The three-level chain from the shipment through the batch to containers, service-level records, member jobs and the client ledger is asserted level by level there."

      - name: dual_variant_calculation_both_postage_variants
        claim_type: dual_variant_calculation
        grounds:
          - calculations.commingled_postage_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / standalone_versus_commingled_rate_divergence
          rationale: "Both variants are evaluated over the same jobs there and the delta is asserted, which is exactly this layer's claim."

      - name: rate_threshold_triggers_rework_count_suspension
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - entities.MailJob.fields.rework_count
        excluded_because:
          difficulty_instance: transitive_cascade / statement_return_cascade_depth_four
          rationale: "The cumulative rework threshold is asserted there at its boundary: the first return leaves the client ACTIVE and the second, which takes rework_count to 2, suspends it with suspension_reason REPEATED_PRESORT_REWORK."

      - name: derived_field_reconciliation_batch_piece_ledger
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CommingleBatch.fields.total_piece_count
          - entities.CommingleBatch.fields.member_job_count
        excluded_because:
          difficulty_instance: compensating_invariant / batch_piece_ledger_conservation_on_member_add_then_remove
          rationale: "The derived ledger is asserted correct after add, after remove and after re-add, with the downstream sortation proving zero drift accumulated."

  # ===========================================================================
  # Section 9 — Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_pooling_response_already_shows_the_recomputed_ledger
        claim_type: immediate
        grounds:
          - endpoints[POST /commingle-batches/{id}/members]
          - calculations.pro_rata_cost_allocation
        distinguishing_aspect: "The declared consistency model is immediate, so the second member's own 201 response must already carry the re-derived allocation for BOTH members and the batch read taken in the same sequence must already show the THREE_DIGIT tier — no second write, no re-read delay and no background recompute. Crucially the FIRST member's allocation must have changed too (from 79152-at-100% pricing of its own pieces to 31660), which a naive implementation that only prices the row being inserted would miss."
        test_recipe:
          setup:
            - "Clients ACME (1200 accepted pieces) and BORE (1800 accepted pieces) each own one hygiene-cleared MARKETING_MAIL/LETTERS job, both ACTIVE with commingle_opt_in true and ACTIVE permit accounts."
            - "One OPEN MARKETING_MAIL/LETTERS batch at SCF-021 (drop_ship_discount_bp 300)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme Direct", client_code: "ACME", service_fee_rate_per_thousand_cents: 900 }
              as: BureauAdmin
              captures: { cl_a_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Borealis Mailers", client_code: "BORE", service_fee_rate_per_thousand_cents: 2200 }
              as: BureauAdmin
              captures: { cl_b_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_a_id}", permit_number: "PI-100100", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_a_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_b_id}", permit_number: "PI-200200", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_b_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_a_id}", permit_account_id: "${pa_a_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_a_id: $.data.id }
            - call: "POST /mail-jobs/${job_a_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_b_id}", permit_account_id: "${pa_b_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1850, declared_weight_oz_per_piece: 1.1 }
              as: PresortOperator
              captures: { job_b_id: $.data.id }
            - call: "POST /mail-jobs/${job_b_id}/hygiene-runs"
              payload: { submitted_piece_count: 1850, cass_matched_count: 1830, ncoa_move_updated_count: 55, undeliverable_removed_count: 50, move_update_age_days: 20 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_a_id}" }
              as: PresortOperator
              captures: { mem_a_id: $.data.id, alloc_a_1: $.data.allocated_postage_cents, share_a_1: $.data.share_basis_pct }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_b_id}" }
              as: PresortOperator
              captures: { mem_b_id: $.data.id, alloc_b: $.data.allocated_postage_cents, share_b: $.data.share_basis_pct }
            - call: "GET /commingle-batches/${batch_id}/members"
              payload: {}
              as: PostageManager
              captures: { first_row_alloc: "$.data[0].allocated_postage_cents" }
            - call: "GET /commingle-batches/${batch_id}"
              payload: {}
              as: PostageManager
              captures: { tier: $.data.achieved_tier, rate: $.data.rate_mills_per_piece, pool: $.data.batch_postage_cents }
          assert:
            - "After the first add the batch is already priced at BASIC: ${alloc_a_1} == 34267 with ${share_a_1} == 100.0000 (1200 pieces at 28556 mills)"
            - "The second add's own response already reflects the deeper tier: ${alloc_b} == 47492 and ${share_b} == 60.0000"
            - "The FIRST member was re-allocated in the same request cycle: ${first_row_alloc} == 31660 for ${mem_a_id}, no longer 34267, and BatchMember.${mem_a_id}.share_basis_pct == 40.0000"
            - "The batch read shows ${tier} == THREE_DIGIT, ${rate} == 26384 and ${pool} == 79152 == 31660 + 47492 with no re-read delay"
            - "MailJob.${job_a_id}.postage_due_cents and MailJob.${job_b_id}.postage_due_cents are both still 0 — pooling allocates on the BatchMember only; the job ledger moves at verification"
