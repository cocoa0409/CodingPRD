  - section: cross_cutting_complexity_layers
    note: |
      One claim per active layer in complexity_profile.complexity_layers: both §1.2.1 concurrency
      rules get their own stale-version instance, the cascade layer is already exhausted by §1.8,
      the scheduled layer is probed through the sweep's four counters, and the selector layer is
      probed on the one path §1.8 never takes - a replacement with no named successor.
    instances:
      - name: nomination_refuses_a_case_version_read_before_the_three_member_election
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.appointment-nominate-stale-case
          - validations[priority=45].ERR_STALE_CASE_VERSION
          - calculations.filing_fee_assessment
        distinguishing_aspect: "The version read before the response is exactly the snapshot the rule exists to reject: the respondent's election changed required_seat_count from 1 to 3 and re-assessed the fee, so a PRESIDING nomination computed against that snapshot is refused with 412 before the seat vocabulary at priority 63 is ever consulted, and nothing is written."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9040; domain occ1.example; complainant Occ Ltd (country_code GB); a case driven to COMMENCED with 150000 paid; panelist Anna Bauer (DE)."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Occ1 Registrar", iana_id: "IANA-9040", contact_email: "abuse@occ1reg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "occ1.example", registrar_id: "${reg_id}", registrant_name_public: "Occ1 Holder", registrant_email_public: "occ1@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
