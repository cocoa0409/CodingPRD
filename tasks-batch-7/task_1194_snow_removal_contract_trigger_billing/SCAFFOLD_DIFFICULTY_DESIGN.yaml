            - { call: "POST /contracts/${kD}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.1, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { eLo: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${eLo}", contract_site_id: "${csD}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { vLo: $.data.id } }
