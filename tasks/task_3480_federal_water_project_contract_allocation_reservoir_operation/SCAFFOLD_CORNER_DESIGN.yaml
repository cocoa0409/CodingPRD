      - name: review_pending_blocks_approve_until_resolved
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_REVIEW_PENDING
        distinguishing_aspect: "decide APPROVE with a FILED review on the transfer fails 409 ERR_REVIEW_PENDING; after the review is DISMISSED the identical approve succeeds — the referential gate is about review state, not review existence."
        test_recipe:
          setup:
            - "Base announced fixture; transfer UNDER_REVIEW with a third-party review FILED."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_d_tp
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
