            - "GET /api/invitations?case_id=${case_k3} returns total_count == 0 (no invitation materialized)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: recuse_retract_preserves_round_electorate
        grounds:
          - state_machines.Vote.CAST_to_RETRACTED
          - calculations.vote_tally
          - entities.ReviewRound.fields.eligible_voter_count
        distinguishing_aspect: |
          Conserved quantity: the round electorate arithmetic. Forward action
          (RECUSE ballot) moves eligible_voter_count 5 -> 4 and quorum_required
          3 -> 2; the compensating retract MUST restore exactly
          eligible_voter_count == 5, quorum_required == 3, votes_cast == 0,
          recusal_count == 0 — no residual drift in any derived field.
        test_recipe:
          setup:
            - "Case at DEPT_COMMITTEE; committee 4 MEMBERs + 1 CHAIR (M = 5); round VOTING_OPEN with zero ballots"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand F", employee_id: "E2000", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_f: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_f}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY", waiver_signed: true }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_f: $.data.id, case_f_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_f}", category: "TEACHING", title: "T1", page_count: 10, expected_case_version: "${case_f_v}" }, as: Candidate, as_user_id: "${cand_f}", captures: { f_t1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_f}", category: "TEACHING", title: "T2", page_count: 10, expected_case_version: "${case_f_v} + 1" }, as: Candidate, as_user_id: "${cand_f}", captures: { f_t2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_f}", category: "RESEARCH", title: "R1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_f_v} + 2" }, as: Candidate, as_user_id: "${cand_f}", captures: { f_r1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_f}", category: "RESEARCH", title: "R2", page_count: 12, expected_case_version: "${case_f_v} + 3" }, as: Candidate, as_user_id: "${cand_f}", captures: { f_r2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_f}", category: "RESEARCH", title: "R3", page_count: 12, expected_case_version: "${case_f_v} + 4" }, as: Candidate, as_user_id: "${cand_f}", captures: { f_r3: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_f}", category: "SERVICE", title: "S1", page_count: 5, expected_case_version: "${case_f_v} + 5" }, as: Candidate, as_user_id: "${cand_f}", captures: { f_s1: $.data.id } }
            - { call: "POST /api/dossier-items/${f_t1}/submit", as: Candidate, as_user_id: "${cand_f}" }
            - { call: "POST /api/dossier-items/${f_t2}/submit", as: Candidate, as_user_id: "${cand_f}" }
            - { call: "POST /api/dossier-items/${f_r1}/submit", as: Candidate, as_user_id: "${cand_f}" }
            - { call: "POST /api/dossier-items/${f_r2}/submit", as: Candidate, as_user_id: "${cand_f}" }
            - { call: "POST /api/dossier-items/${f_r3}/submit", as: Candidate, as_user_id: "${cand_f}" }
            - { call: "POST /api/dossier-items/${f_s1}/submit", as: Candidate, as_user_id: "${cand_f}" }
            - { call: "POST /api/cases/${case_f}/submit-dossier", as: Candidate, as_user_id: "${cand_f}", captures: { case_f_v8: $.data.version } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev F1", institution: "MIT", email: "rf1@mit.edu", expertise_area: "CS" }, as: ProvostOfficer, captures: { rev_f1: $.data.id } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev F2", institution: "CMU", email: "rf2@cmu.edu", expertise_area: "CS" }, as: ProvostOfficer, captures: { rev_f2: $.data.id } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev F3", institution: "Stanford", email: "rf3@stanford.edu", expertise_area: "CS" }, as: ProvostOfficer, captures: { rev_f3: $.data.id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_f}", reviewer_id: "${rev_f1}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: false, expected_case_version: "${case_f_v8}" }, as: ProvostOfficer, captures: { inv_f1: $.data.id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_f}", reviewer_id: "${rev_f2}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: false, expected_case_version: "${case_f_v8} + 1" }, as: ProvostOfficer, captures: { inv_f2: $.data.id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_f}", reviewer_id: "${rev_f3}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: false, expected_case_version: "${case_f_v8} + 2" }, as: ProvostOfficer, captures: { inv_f3: $.data.id } }
            - { call: "POST /api/invitations/${inv_f1}/accept", as: ExternalReviewer, as_user_id: "${rev_f1}" }
            - { call: "POST /api/invitations/${inv_f1}/submit-letter", payload: { letter_text: "F1." }, as: ExternalReviewer, as_user_id: "${rev_f1}" }
            - { call: "POST /api/invitations/${inv_f2}/accept", as: ExternalReviewer, as_user_id: "${rev_f2}" }
            - { call: "POST /api/invitations/${inv_f2}/submit-letter", payload: { letter_text: "F2." }, as: ExternalReviewer, as_user_id: "${rev_f2}" }
            - { call: "POST /api/invitations/${inv_f3}/accept", as: ExternalReviewer, as_user_id: "${rev_f3}" }
            - { call: "POST /api/invitations/${inv_f3}/submit-letter", payload: { letter_text: "F3." }, as: ExternalReviewer, as_user_id: "${rev_f3}" }
            - { call: "POST /api/midterm-reviews", payload: { case_id: "${case_f}", review_year: 3 }, as: ProvostOfficer, captures: { mid_f: $.data.id } }
            - { call: "POST /api/midterm-reviews/${mid_f}/complete", payload: { outcome: "SATISFACTORY" }, as: ProvostOfficer }
            - { call: "POST /api/committees", payload: { level: "DEPARTMENT", academic_unit: "CS", term_start: "2026-01-01", term_end: "2026-12-31", pass_rule: "STRICT_MAJORITY_OF_CAST" }, as: ProvostOfficer, captures: { comm_f: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_f}", full_name: "Chair F", email: "chair_f@u.edu", role_in_committee: "CHAIR", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { chair_f: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_f}", full_name: "F1", email: "f1@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { fm1: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_f}", full_name: "F2", email: "f2@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { fm2: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_f}", full_name: "F3", email: "f3@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { fm3: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_f}", full_name: "F4", email: "f4@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { fm4: $.data.id } }
            - { call: "POST /api/cases/${case_f}/close-solicitation", as: ProvostOfficer }
            - { call: "GET /api/rounds?case_id=${case_f}", as: Any, captures: { round_f: "$.data[0].id" } }
            - { call: "POST /api/rounds/${round_f}/open", as: CommitteeChair, as_user_id: "${chair_f}" }
            - { call: "GET /api/rounds/${round_f}", as: Any, captures: { f_elig_0: $.data.eligible_voter_count, f_quorum_0: $.data.quorum_required, f_cast_0: $.data.votes_cast } }
          trigger:
            - { call: "POST /api/votes", payload: { round_id: "${round_f}", ballot: "RECUSE" }, as: CommitteeVoter, as_user_id: "${fm1}", captures: { vote_f1: $.data.id } }
            - { call: "GET /api/rounds/${round_f}", as: Any, captures: { f_elig_1: $.data.eligible_voter_count, f_quorum_1: $.data.quorum_required, f_rec_1: $.data.recusal_count } }
            - { call: "POST /api/votes/${vote_f1}/retract", as: CommitteeVoter, as_user_id: "${fm1}" }
            - { call: "GET /api/rounds/${round_f}", as: Any, captures: { f_elig_2: $.data.eligible_voter_count, f_quorum_2: $.data.quorum_required, f_cast_2: $.data.votes_cast, f_rec_2: $.data.recusal_count } }
          assert:
            - "f_elig_0 == 5 AND f_quorum_0 == 3 AND f_cast_0 == 0 (baseline: M = 5 incl. silent chair)"
            - "f_elig_1 == 4 AND f_quorum_1 == 2 AND f_rec_1 == 1 (RECUSE shrinks the electorate, never the ballot count)"
            - "f_elig_2 == f_elig_0 AND f_quorum_2 == f_quorum_0 AND f_cast_2 == f_cast_0 AND f_rec_2 == 0 (compensation restores the exact baseline — invariant over the electorate quantities)"
            - "Vote.${vote_f1}.status == RETRACTED AND Vote.${vote_f1}.retracted_at != null"

      - name: extension_approve_rescind_preserves_clock
        grounds:
          - state_machines.ClockExtensionRequest.PENDING_to_APPROVED
          - state_machines.ClockExtensionRequest.APPROVED_to_RESCINDED
          - calculations.extension_day_merge
          - calculations.mandatory_review_date
        distinguishing_aspect: |
          Conserved quantity: the case tenure clock. Approving
          [2023-01-01, 2023-04-01) moves extension_days 0 -> 90 and
          mandatory_review_date 2026-08-01 -> 2026-10-30; the compensating
          rescind MUST restore extension_days == 0 and
          mandatory_review_date == 2026-08-01 exactly (while the case version
          still advances — the invariant is over the clock fields, not the
          version counter).
        test_recipe:
          setup:
            - "Fresh case (ANNIVERSARY, clock start 2020-08-01), stage DOSSIER_ASSEMBLY; one PENDING clock-extension request"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand J", employee_id: "E2100", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_j: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_j}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_j: $.data.id } }
            - { call: "POST /api/clock-extensions", payload: { case_id: "${case_j}", reason: "MEDICAL_LEAVE", interval_start: "2023-01-01", interval_end: "2023-04-01" }, as: Candidate, as_user_id: "${cand_j}", captures: { ext_j: $.data.id } }
            - { call: "GET /api/cases/${case_j}", as: Any, captures: { j_days_0: $.data.extension_days, j_date_0: $.data.mandatory_review_date, j_ver_0: $.data.version } }
          trigger:
            - { call: "POST /api/clock-extensions/${ext_j}/approve", as: ProvostOfficer }
            - { call: "GET /api/cases/${case_j}", as: Any, captures: { j_days_1: $.data.extension_days, j_date_1: $.data.mandatory_review_date, j_ver_1: $.data.version } }
            - { call: "POST /api/clock-extensions/${ext_j}/rescind", as: ProvostOfficer, captures: { ext_j_status: $.data.status } }
            - { call: "GET /api/cases/${case_j}", as: Any, captures: { j_days_2: $.data.extension_days, j_date_2: $.data.mandatory_review_date, j_ver_2: $.data.version } }
          assert:
            - "j_days_0 == 0 AND j_date_0 == 2026-08-01 (baseline)"
            - "j_days_1 == 90 AND j_date_1 == 2026-10-30 (forward action)"
            - "j_days_2 == 0 AND j_date_2 == 2026-08-01 (compensation restores the clock exactly)"
            - "j_ver_2 == j_ver_0 + 2 (version still advances — the invariant covers the clock fields, not the OCC counter)"
            - "ext_j_status == RESCINDED"
