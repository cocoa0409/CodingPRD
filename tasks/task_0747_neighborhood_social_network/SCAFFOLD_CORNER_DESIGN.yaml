          difficulty_instance: post_cycles_published_flagged_hidden_published_via_reverse
          rationale: "OCC version bumps between UPHOLD and REVERSE are exercised in the cyclic-Post §1.8 instance where p1_v_flagged and p1_v_hidden are captured after each transition."

