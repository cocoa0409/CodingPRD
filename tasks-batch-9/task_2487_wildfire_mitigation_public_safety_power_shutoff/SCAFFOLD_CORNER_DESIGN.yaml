        excluded_because:
          difficulty_instance: fpi_tier_r5_boundary_at_exactly_seventy_five
          rationale: "The R4/R5 break is inclusive at 75.00 and exclusive below it; that instance contrasts ECHO at exactly 75.00 with FOXTROT at 74.91."
      - name: fpi_observation_window_right_endpoint
