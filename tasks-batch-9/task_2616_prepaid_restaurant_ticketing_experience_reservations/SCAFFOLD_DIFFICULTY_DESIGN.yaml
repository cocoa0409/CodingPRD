  - rule_id: resource_temporal_overlap
    instances:

      - name: table_occupancy_half_open_adjacency_allowed
        grounds:
          - calculations.table_turn_occupancy
          - calculations.table_turn_occupancy.constants.INTERVAL_SEMANTICS
          - entities.Table.fields.turn_buffer_minutes
          - validations.priority_33_ERR_TABLE_TURN_CONFLICT
        distinguishing_aspect: |
          Resource: a single physical Table. Interval semantics: HALF-OPEN
          [seat_from, seat_from + turn_time + turn_buffer), so a second party
          starting at the exact instant the first occupancy ends is accepted.
          With turn_time 150 and turn_buffer 15 the occupancy is 165 minutes:
          a 00:44:00Z start is refused and a 00:45:00Z start is allowed. One
          minute separates the two outcomes, and the boundary instant belongs to
          the LATER reservation.
