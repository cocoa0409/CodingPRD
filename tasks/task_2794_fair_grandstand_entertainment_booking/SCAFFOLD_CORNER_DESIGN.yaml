              as: FairOperationsDirector
              captures: { ed_a2: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed_a2}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st_a2: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag_a2: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag_a2}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar_a2: "$.data.id" }
          trigger:
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2027, name: "State Fair 2027", run_start_date: "2027-08-20", run_end_date: "2027-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: BoxOfficeManager
              captures: { err_b1: "$.data.error_id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_a2}", artist_id: "${ar_a2}", target_stage_id: "${st_a2}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: SettlementController
              captures: { err_b2: "$.data.error_id" }
            - call: "POST /grandstand/rider-items/00000000-0000-4000-8000-00000000dead/rule"
              payload: { decision: "APPROVED" }
              as: TalentBuyer
              captures: { err_b3: "$.data.error_id" }
            - call: "POST /grandstand/show-bookings/00000000-0000-4000-8000-00000000dead/announce"
