  - rule_id: resource_temporal_overlap
    instances:
      - name: exhibit_case_half_open_window_and_changeover_buffer
        grounds:
          - calculations.exhibit_window_conflict
          - validations[priority=68]
          - entities.ExhibitCase.fields.changeover_buffer_days
          - entities.ExhibitCase.fields.artifacts_installed
        distinguishing_aspect: |
          Interval semantics under test: HALF-OPEN display windows on the ExhibitCase resource. Two
          windows of the SAME induction that touch at 2026-12-01 are legal because
          new.display_starts_on == other.display_ends_on does not intersect a half-open interval,
          whereas a DIFFERENT induction starting at 2026-12-15 - exactly when the previous window
          ends - is rejected because a changeover_buffer_days == 7 gap is required, and the same
          window shifted to 2026-12-22 (exactly 7 days later) is accepted.
        test_recipe:
          setup:
            - "A certified 2026 cycle with two inductions ind1 and ind2, both ANNOUNCED."
            - "Both inductions have completed artifact intake with artifact_count 2, so artifact_status == RECEIVED for each."
            - "One ExhibitCase CASE-A with capacity_artifacts 10 and changeover_buffer_days 7 and artifacts_installed 0."
