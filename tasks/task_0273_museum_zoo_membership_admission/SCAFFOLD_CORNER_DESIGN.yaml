          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_v}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: renew_correct_version_succeeds_and_bumps_version
        claim_type: satisfaction_to_pass
        grounds:
          - "concurrency_rules[membership-renew-stale-version]"
          - entities.Membership.fields.version
        distinguishing_aspect: "A renew carrying the current expected_membership_version succeeds (200), extends the term, and increments Membership.version by 1."
        test_recipe:
          setup: ["Patron P, membership M ACTIVE activated 2026-06-01, version observed via GET."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "INDIVIDUAL", annual_fee_cents: 12000, household_max: 0, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "rv@x.com", full_name: "RV" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}", auto_renew: false }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_v}" }
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "response.status == 200"
            - "Membership.${m_id}.term_count == 2"

  # ===========================================================================
  - section: rbac
    instances:
      - name: patron_cannot_create_membership_plan_forbidden
        claim_type: rbac_denial
        grounds:
          - roles
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "POST /membership-plans is MembershipAdmin-exclusive; a Patron caller -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A patron P exists to act as caller."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { email: "rb@x.com", full_name: "RB" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /membership-plans"
              payload: { tier: "INDIVIDUAL", annual_fee_cents: 12000, household_max: 0, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: patron_cannot_act_on_other_patrons_order
        claim_type: ownership_denial
        grounds:
          - roles
          - "validations[priority=3]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: "A Patron confirming another patron's order (X-User-ID != order.patron_id) -> ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Patron P1 owns DRAFT order O on a future slot with 1 ticket; Patron P2 is a different account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "own1@x.com", full_name: "Own1" }
              as: MembershipAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "own2@x.com", full_name: "Own2" }
              as: MembershipAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p1_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${p1_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "A" }
              as: Patron
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_role_header_unauthenticated
        claim_type: rbac_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no/invalid X-User-Role header -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /membership-plans"
              payload: {}
              as: NoRole
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: gatescanner_can_checkin_but_not_create_order
        claim_type: rbac_denial
        grounds:
          - roles
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "GateScanner may POST check-in but POST /admission-orders is not in its operations -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A patron P and a future slot exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "gs@x.com", full_name: "GS" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}" }
              as: GateScanner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_layer_excluded
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[membership-renew-stale-version]"
        excluded_because:
          difficulty_instance: dual_variant_calc / renewal_fee_early_vs_lapsed_diverge_on_membership_domain
          rationale: "The renew endpoint and its version mechanics are exercised; the stale-version 412 path is asserted directly in the errors section instance stale_version_renew_excluded."

      - name: cascade_membership_cancel_layer_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Membership.transitions
        excluded_because:
          difficulty_instance: transitive_cascade / membership_cancel_cascade_depth3_to_guestpass_ticket_slot
          rationale: "The depth-3 cancellation cascade is the asserted behavior of that §1.8 instance."

      - name: rate_threshold_slot_capacity_boundary_excluded
        claim_type: rate_threshold_triggers
        grounds:
          - "validations[priority=15]"
        excluded_because:
          difficulty_instance: boundary_precision_check / slot_capacity_exact_fill_succeeds_one_more_rejects
          rationale: "The slot-capacity threshold boundary (exact fill succeeds, +1 rejects) is the asserted boundary in that §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: confirm_immediately_reflects_reserved_count
        claim_type: immediate
        grounds:
          - calculations.slot_reserved_count
          - state_machines.AdmissionOrder.DRAFT_to_CONFIRMED
        distinguishing_aspect: "Immediate consistency: a GET on the slot right after confirm already shows reserved_count incremented by party_size within the same request flow (no lag)."
        test_recipe:
          setup: ["Patron P; slot S capacity 10; DRAFT order O with 2 NON_MEMBER tickets."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "im@x.com", full_name: "IM" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "A" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "B" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "GET /timed-entry-slots/${slot_id}"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "TimedEntrySlot.${slot_id}.reserved_count == 2"
