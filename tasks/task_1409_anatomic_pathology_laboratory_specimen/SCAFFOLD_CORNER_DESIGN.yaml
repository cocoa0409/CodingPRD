scaffold_corner_design:
  - section: entities
    instances:
      - name: patient_create_missing_required_mrn_returns_400
        claim_type: required_fields
        grounds:
        - entities.Patient.fields.mrn
        - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required mrn yields ERR_INVALID_REQUEST (400) and no Patient row is created."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pathology/patients", payload: { full_name: "No Mrn", date_of_birth: "1990-01-01" }, as: LabAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST (http 400)"]
      - name: patient_duplicate_mrn_rejected
        claim_type: type_constraints
        grounds:
        - entities.Patient.fields.mrn
        - validations[priority=38, errors[ERR_DUPLICATE_MRN]]
        distinguishing_aspect: "The mrn uniqueness constraint rejects the second registration with ERR_DUPLICATE_MRN (409)."
        test_recipe:
          setup: ["one patient with mrn MRN-DUP"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-DUP", full_name: "First", date_of_birth: "1990-01-01" }, as: LabAdmin }
          trigger:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-DUP", full_name: "Second", date_of_birth: "1991-02-02" }, as: LabAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_DUPLICATE_MRN (http 409)"]
      - name: case_create_applies_defaults_and_initial_deadline
        claim_type: defaults
        grounds:
        - entities.Case.fields.tat_mode
        - entities.Case.fields.status
        - calculations.turnaround_deadline
        distinguishing_aspect: "Omitting tat_mode defaults it to CALENDAR; a fresh case is OPEN/SIMPLE with turnaround_deadline == created_at + 48h == 2026-08-03T00:00:00Z under the startup clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["patient registered; logical clock untouched at its 2026-08-01T00:00:00Z default"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-D1", full_name: "Defaults", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
          trigger:
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "BREAST" }, as: LabAdmin, captures: { c1: $.data.id } }
          assert:
            - "Case.${c1}.tat_mode == CALENDAR, status == OPEN, complexity_class == SIMPLE, complexity_score == 0.0"
            - "Case.${c1}.created_at == 2026-08-01T00:00:00Z (startup clock default) and turnaround_deadline == 2026-08-03T00:00:00Z"
            - "Case.${c1}.assigned_pathologist_id is null, tat_breached == false, version == 1"
      - name: specimen_accession_computed_fields
        claim_type: computed_fields
        grounds:
        - entities.Specimen.fields.accession_number
        - entities.Specimen.fields.cold_ischemia_minutes
        - entities.Specimen.fields.fixative_type
        distinguishing_aspect: "Accession mints accession_number SP26-000001 (first sequence of the default-clock year), computes cold_ischemia_minutes == 30, and defaults fixative_type to FORMALIN."
        test_recipe:
          setup: ["patient and GI case exist"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-D2", full_name: "Computed", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-D2", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:30:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
          assert:
            - "Specimen.${sp1}.accession_number == SP26-000001 (system minted; no type prefix on id but accession format is SP<YY>-<6 digits>)"
            - "Specimen.${sp1}.cold_ischemia_minutes == 30, fixative_type == FORMALIN, status == ACCESSIONED"
      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds:
        - validations[priority=4, errors[ERR_NOT_FOUND]]
        distinguishing_aspect: "GET with a well-formed but unknown id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pathology/cases/11111111-2222-3333-4444-555555555555", as: LabAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND (http 404)"]
      - name: case_list_pagination_envelope
        claim_type: listing
        grounds:
        - response_envelope
        - endpoints[GET /pathology/cases]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more; page 1 (limit 2 of 3) has has_more true, page 2 has exactly 1 item and has_more false."
        test_recipe:
          setup: ["one patient with three cases"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-D3", full_name: "Paged", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin }
          trigger:
            - { call: "GET /pathology/cases", payload: { limit: 2, offset: 0 }, as: LabAdmin }
            - { call: "GET /pathology/cases", payload: { limit: 2, offset: 2 }, as: LabAdmin }
          assert:
            - "page 1: data has 2 items, total_count == 3, has_more == true, meta.api_request_id present"
            - "page 2: data has 1 item, total_count == 3, has_more == false"
      - name: fk_reverse_reachability_lists_children
        claim_type: parent_relationships
        grounds:
        - entities.Specimen.fields.case_id
        - entities.Block.fields.specimen_id
        - endpoints[GET /pathology/specimens, endpoints[GET /pathology/blocks]]
        distinguishing_aspect: "Children are discoverable from their parent id via filtered lists: GET /specimens?case_id returns the case's specimens and GET /blocks?specimen_id the specimen's blocks."
        test_recipe:
          setup: ["case with one specimen and two blocks"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-D4", full_name: "Fk", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-D4", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A2" }, as: Histotech }
          trigger:
            - { call: "GET /pathology/specimens", payload: { case_id: "${c1}" }, as: LabAdmin }
            - { call: "GET /pathology/blocks", payload: { specimen_id: "${sp1}" }, as: LabAdmin }
          assert:
            - "specimens filter returns total_count 1 with data[0].id == ${sp1}"
            - "blocks filter returns total_count 2, both with specimen_id == ${sp1}"

  - section: state_machines
    instances:
      - name: slide_qc_review_from_ordered_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Slide
          - validations[priority=11]
          - errors[ERR_SLIDE_WRONG_STATE]
        distinguishing_aspect: "qc-review on an ORDERED slide (never sectioned/stained) fails with ERR_SLIDE_WRONG_STATE; the slide stays ORDERED."
        test_recipe:
          setup: ["GI case in WORKUP with one EMBEDDED block and one ORDERED slide s1"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-S1", full_name: "Sm One", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-S1", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech, captures: { err: $.data.error_id } }
          assert: ["err == ERR_SLIDE_WRONG_STATE (http 409); Slide.${s1}.status == ORDERED"]
      - name: specimen_gross_after_reject_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Specimen
          - validations[priority=6]
          - errors[ERR_SPECIMEN_NOT_ACCESSIONED]
        distinguishing_aspect: "REJECTED is terminal: a gross attempt on a rejected specimen fails with ERR_SPECIMEN_NOT_ACCESSIONED and no fields change."
        test_recipe:
          setup: ["case with one ACCESSIONED specimen that is then rejected"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-S2", full_name: "Sm Two", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-S2", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Skin", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 2 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-S2", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Arm", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp2: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/reject", payload: { reason: "no tissue in container" }, as: Histotech }
          trigger:
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "too late" }, as: PathologyAssistant, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SPECIMEN_NOT_ACCESSIONED (http 409); Specimen.${sp1}.status == REJECTED and gross_description stays null"
            - "Case.${c1}.status == OPEN (only one of two specimens rejected, so no auto-cancel)"
      - name: case_pending_signout_pullback_on_qc_fail
        claim_type: side_effect_execution
        grounds:
          - state_machines.Slide.STAINED_to_QC_FAILED
          - state_machines.Case.PENDING_SIGNOUT_to_WORKUP
        distinguishing_aspect: "Conditional cross-entity cascade: a QC FAIL on a slide of a PENDING_SIGNOUT case pulls the case back to WORKUP, so a later submit must run again."
        test_recipe:
          setup: ["case signed-ready with slide s1 QC_PASSED and case PENDING_SIGNOUT; a second slide s2 added afterwards reaches STAINED"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-S3", full_name: "Sm Three", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Pull", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-S3", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/submit-for-signout", as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-2" }, as: Histotech, captures: { s2: $.data.id } }
            - { call: "POST /pathology/slides/${s2}/section", payload: { consumption_pct: 5.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s2}/stain-complete", as: Histotech }
          trigger:
            - { call: "POST /pathology/slides/${s2}/qc-review", payload: { result: "FAIL", reason: "bubbles" }, as: Histotech }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin }
          assert:
            - "Slide.${s2}.status == QC_FAILED with qc_failure_reason == bubbles"
            - "Case.${c1}.status == WORKUP (pulled back from PENDING_SIGNOUT by the QC failure)"
      - name: stain_order_create_pulls_back_pending_signout
        claim_type: side_effect_execution
        grounds:
          - state_machines.Case.PENDING_SIGNOUT_to_WORKUP
          - endpoints[POST /pathology/cases/{id}/stain-orders]
        distinguishing_aspect: "Ordering a new stain while the case awaits sign-out reopens workup: the case returns to WORKUP and the new order is ORDERED."
        test_recipe:
          setup: ["case PENDING_SIGNOUT with one QC_PASSED slide (RESECTION specimen, cold ischemia 60 minutes)"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-S4", full_name: "Sm Four", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Stain", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-S4", patient_dob: "1980-01-01", specimen_type: "RESECTION", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "segment" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/submit-for-signout", as: Pathologist, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /pathology/cases/${c1}/stain-orders", payload: { block_id: "${b1}", stain_type: "MUCIN" }, as: Pathologist, as_user_id: "${p1}", captures: { so1: $.data.id } }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin }
          assert:
            - "StainOrder.${so1}.status == ORDERED"
            - "Case.${c1}.status == WORKUP (pulled back); a second submit-for-signout now fails with ERR_SLIDES_NOT_READY until the stain is resulted or cancelled"
      - name: consultation_decline_then_reroute_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Consultation.REQUESTED_to_DECLINED
          - state_machines.Consultation.DECLINED_to_REQUESTED
        distinguishing_aspect: "The DECLINED -> REQUESTED reroute closes the consultation cycle: after reroute the consultant is p3, due_at is replaced, and reroute_count == 1."
        test_recipe:
          setup: ["WORKUP case assigned to p1; consultation requested by p1 to p2 (due 2026-08-10); p2 declines"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-S5", full_name: "Sm Five", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Req", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Busy", subspecialties: ["GI"] }, as: LabAdmin, captures: { p2: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Free", subspecialties: ["GI"] }, as: LabAdmin, captures: { p3: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-S5", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/consultations", payload: { consultant_pathologist_id: "${p2}", subspecialty: "GI", question_text: "grade?", due_at: "2026-08-10T00:00:00Z" }, as: Pathologist, as_user_id: "${p1}", captures: { q1: $.data.id } }
            - { call: "POST /pathology/consultations/${q1}/decline", payload: { reason: "overloaded" }, as: Pathologist, as_user_id: "${p2}" }
          trigger:
            - { call: "POST /pathology/consultations/${q1}/reroute", payload: { consultant_pathologist_id: "${p3}", due_at: "2026-08-12T00:00:00Z" }, as: Pathologist, as_user_id: "${p1}" }
          assert:
            - "Consultation.${q1}.status == REQUESTED again (cycle), consultant_pathologist_id == ${p3}, due_at == 2026-08-12T00:00:00Z, reroute_count == 1"
      - name: consultation_expiry_sweep_strict_boundary
        claim_type: side_effect_execution
        grounds:
          - state_machines.Consultation.REQUESTED_to_EXPIRED
          - endpoints[POST /pathology/_clock/set_current_utc]
        distinguishing_aspect: "The clock sweep expires REQUESTED consultations only when due_at is strictly before now: at exactly due_at the consultation survives, one second later it is EXPIRED."
        test_recipe:
          setup: ["WORKUP case assigned to p1; consultation to p2 with due_at 2026-08-05T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-S6", full_name: "Sm Six", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Ask", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Slow", subspecialties: ["GI"] }, as: LabAdmin, captures: { p2: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-S6", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/consultations", payload: { consultant_pathologist_id: "${p2}", subspecialty: "GI", question_text: "subtype?", due_at: "2026-08-05T00:00:00Z" }, as: Pathologist, as_user_id: "${p1}", captures: { q1: $.data.id } }
          trigger:
            - { call: "POST /pathology/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: LabAdmin }
            - { call: "GET /pathology/consultations/${q1}", as: LabAdmin, captures: { st1: $.data.status } }
            - { call: "POST /pathology/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:01Z" }, as: LabAdmin }
            - { call: "GET /pathology/consultations/${q1}", as: LabAdmin, captures: { st2: $.data.status } }
          assert:
            - "at exactly due_at: st1 == REQUESTED (equality is not expired)"
            - "one second past due_at: st2 == EXPIRED"
      - name: release_overdue_sweep_and_late_return
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReleaseRequest.SHIPPED_to_OVERDUE
          - state_machines.ReleaseRequest.OVERDUE_to_RETURNED
