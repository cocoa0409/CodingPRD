  - rule_id: cross_entity_state_dependency
    instances:
      - name: refresh_certify_blocked_until_both_file_types_published
        grounds:
          - validations[priority=24]
          - errors[ERR_MRF_NOT_PUBLISHED]
          - state_machines.MachineReadableFile.VALIDATING_to_REJECTED
          - state_machines.RefreshCycle.PENDING_to_CERTIFIED
        distinguishing_aspect: |
          Certifying the 2027-06 RefreshCycle depends on the status of TWO sibling MachineReadableFile
          rows of different file_type. IN_NETWORK_RATES is PUBLISHED but ALLOWED_AMOUNTS validated
          with 2 errors and is therefore REJECTED, so certify must fail with 409
          ERR_MRF_NOT_PUBLISHED and leave the cycle PENDING. Only after the rejected file is revised
          and re-validated with 0 errors does the identical certify call succeed. An implementation
          that checks "at least one published file for the month", or checks existence rather than
          status, passes the first attempt and fails this pair.
        test_recipe:
          setup:
            - "Logical clock at 2027-07-01T09:00:00Z."
            - "ACTIVE PlanYear PY2027, covered_lives 6000, one TPA contract."
            - "IN_NETWORK_RATES for posting_month 2027-06 is PUBLISHED (validated with 0 errors)."
            - "ALLOWED_AMOUNTS for posting_month 2027-06 was validated with 2 errors, so it is REJECTED."
            - "A PENDING RefreshCycle for 2027-06 exists with deadline_at 2027-07-05T23:59:59.999Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/machine-readable-files"
              payload: { plan_year_id: "${py}", file_type: "IN_NETWORK_RATES", posting_month: "2027-06", public_url: "https://transparency.meridian.example/2027-06/in-network-rates.json", row_count: 812004, schema_version: "1.2.0" }
              as: PlanSponsorAdmin
              captures: { mrf_in: "$.data.id" }
            - call: "POST /compliance/machine-readable-files/${mrf_in}/validate"
              payload: { validation_error_count: 0 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/machine-readable-files"
              payload: { plan_year_id: "${py}", file_type: "ALLOWED_AMOUNTS", posting_month: "2027-06", public_url: "https://transparency.meridian.example/2027-06/allowed-amounts.json", row_count: 204119, schema_version: "1.2.0" }
              as: PlanSponsorAdmin
              captures: { mrf_aa: "$.data.id" }
            - call: "POST /compliance/machine-readable-files/${mrf_aa}/validate"
              payload: { validation_error_count: 2 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/refresh-cycles"
              payload: { plan_year_id: "${py}", period_month: "2027-06", period_start: "2027-06-01", period_end: "2027-06-30" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rc_jun: "$.data.id" }
          trigger:
            - call: "POST /compliance/refresh-cycles/${rc_jun}/certify"
              payload: { certification_note: "First attempt while allowed-amounts file is rejected." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/machine-readable-files/${mrf_aa}/revise"
              payload: { public_url: "https://transparency.meridian.example/2027-06/allowed-amounts-r2.json", row_count: 204140 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/machine-readable-files/${mrf_aa}/validate"
              payload: { validation_error_count: 0 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/refresh-cycles/${rc_jun}/certify"
              payload: { certification_note: "Second attempt after both file types are published." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "the first certify response HTTP status == 409 and its data.error_id == \"ERR_MRF_NOT_PUBLISHED\""
            - "immediately after the first certify, GET /compliance/refresh-cycles/${rc_jun} -> data.status == \"PENDING\" and data.certified_at == null"
            - "after revise+validate, GET /compliance/machine-readable-files/${mrf_aa} -> data.status == \"PUBLISHED\", data.revision_number == 1, data.validation_error_count == 0"
            - "the second certify response HTTP status == 200 and GET /compliance/refresh-cycles/${rc_jun} -> data.status == \"CERTIFIED\", data.on_time == true, data.certified_at == \"2027-07-01T09:00:00Z\""
            - "GET /compliance/plan-years/${py} -> data.deficiency_points == 0 and data.compliance_posture == \"COMPLIANT\""

      - name: package_delivery_requires_secured_data_rights_on_contract
        grounds:
          - validations[priority=29]
          - errors[ERR_DATA_RIGHTS_NOT_SECURED]
          - state_machines.ServiceProviderContract.data_rights_status
          - state_machines.VendorDataPackage.EXPECTED_to_RECEIVED
        distinguishing_aspect: |
          A VendorDataPackage may only be delivered when its vendor's contract has
          data_rights_status SECURED, which is reached only by EXECUTING a DATA_RIGHTS
          ContractAmendment — a two-hop dependency (package -> contract -> amendment). The first
          delivery attempt, made while the amendment is still PROPOSED, must fail 409
          ERR_DATA_RIGHTS_NOT_SECURED and leave the package EXPECTED with delivery_round 0; the same
          call after execution succeeds. Checking only that an amendment row exists passes the first
          attempt.
