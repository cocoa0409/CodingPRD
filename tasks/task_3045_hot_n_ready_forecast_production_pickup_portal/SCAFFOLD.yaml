    side_effects: ["status PLANNED"]

  - method: GET
    path: "/dayparts/{daypartId}/production-runs"
    description: "List production runs of a daypart"
    roles: [StoreManager, ShiftLead, CrewMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []

  - method: GET
    path: "/production-runs/{runId}"
    description: "Get a production run"
    roles: [StoreManager, ShiftLead, CrewMember]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: POST
    path: "/production-runs/{runId}/start-baking"
    description: "Start baking a planned run; consumes dough and cheese"
    roles: [CrewMember]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status PLANNED -> BAKING; dough/cheese remaining_units decremented"]

  - method: POST
    path: "/production-runs/{runId}/rack"
    description: "Rack a baked run into the warming rack; mints HoldUnits"
    roles: [CrewMember]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status BAKING -> HOLDING; quantity HoldUnits created; StoreDay.produced_units += quantity"]

  # --- HoldUnit ---
  - method: GET
    path: "/hold-units"
    description: "List hold units, filterable"
    roles: [StoreManager, ShiftLead, CrewMember]
    code: 200
    input: ["limit?", "offset?", "production_run_id?", "status?", "product_id?", "allocated_order_id?"]
    output: "HoldUnit[]"
    side_effects: []

  - method: GET
    path: "/hold-units/{unitId}"
    description: "Get a hold unit"
    roles: [StoreManager, ShiftLead, CrewMember]
    code: 200
    input: []
    output: HoldUnit
    side_effects: []

  - method: POST
    path: "/hold-units/{unitId}/discard"
    description: "Manually discard a HOLDING unit (DAMAGED or QUALITY); optional donation flag"
    roles: [ShiftLead]
    code: 200
    input: [reason, "donated?"]
    output: HoldUnit
    side_effects: ["status -> DISCARDED; WasteLog appended; StoreDay waste counters recomputed"]

  # --- Order ---
  - method: POST
    path: "/orders"
    description: "Place an order (PORTAL_STANDARD, PORTAL_PREORDER, or COUNTER)"
    roles: [Customer, ShiftLead]
    code: 201
    input: [store_day_id, daypart_id, customer_id, kind, lines]
    output: Order
    side_effects: ["order_pricing computed and frozen"]

  - method: GET
    path: "/orders"
    description: "List orders, filterable"
    roles: [StoreManager, ShiftLead, CrewMember, Customer]
    code: 200
    input: ["limit?", "offset?", "store_day_id?", "daypart_id?", "customer_id?", "kind?", "fulfillment_status?", "locker_slot_id?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/orders/{orderId}"
    description: "Get an order"
    roles: [StoreManager, ShiftLead, CrewMember, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/pay"
    description: "Pay for an order"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status UNPAID -> PAID; preorder reservation may bump daypart"]

  - method: POST
    path: "/orders/{orderId}/start-preparation"
    description: "Start preparing an order; pulls from made-ahead hold inventory first"
    roles: [CrewMember]
    code: 200
    input: []
    output: Order
    side_effects: ["hold_pull_allocation; made_ahead_units/made_to_order_units recorded; posture gate"]

  - method: POST
    path: "/orders/{orderId}/mark-ready"
    description: "Mark an order ready; PORTAL kinds occupy a locker slot and mint a pickup code"
    roles: [CrewMember]
    code: 200
    input: []
    output: Order
    side_effects: ["locker assignment; pickup_code + code_expires_at; allocated units SOLD"]

  - method: POST
    path: "/orders/{orderId}/claim"
    description: "Customer claims a portal order with its pickup code"
    roles: [Customer]
    code: 200
    input: [pickup_code]
    output: Order
