              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "GET /ppa/settlement-periods/${period_id}"
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
              captures: { period_v1: $.data.version }
            - call: "POST /ppa/settlement-periods/${period_id}/intervals"
              payload: { hour_start: "2027-07-05T11:00:00Z", metered_mwh: 7.0000, node_price_usd_per_mwh: 31.00, hub_price_usd_per_mwh: 36.00, expected_settlement_period_version: "${period_v1}" }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /ppa/deals/${deal_id}/risk-events"
