  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_number_block_version_is_refused_and_the_refreshed_one_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.reservation-create-stale-number-block
          - validations[priority=22]
          - errors.ERR_STALE_NUMBER_BLOCK_VERSION
        distinguishing_aspect: "The second reservation would otherwise be perfectly legal - a free number, capacity to spare, a valid window - so only the version the caller carried distinguishes it: reusing the pre-reservation version is ERR_STALE_NUMBER_BLOCK_VERSION (412), and re-reading the block makes the identical body succeed."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; block 415634 with numbers 4801 and 4802 and max_concurrent_reservations 3"
            - "the block version is read once into blk_v1 before any reservation exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1048", billing_name: "ZINNIA AS", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415634", total_capacity: 4, max_concurrent_reservations: 3 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "4801" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "4802" }
              as: NumberingAdmin
              captures: { pn2_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v1: $.data.version }
          trigger:
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-04T00:00:00Z", reserved_until: "2026-08-06T00:00:00Z", expected_number_block_version: "${blk_v1}" }
              as: NumberingAdmin
              captures: { res1_id: $.data.id }
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-04T00:00:00Z", reserved_until: "2026-08-06T00:00:00Z", expected_number_block_version: "${blk_v1}" }
              as: NumberingAdmin
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v2: $.data.version }
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-04T00:00:00Z", reserved_until: "2026-08-06T00:00:00Z", expected_number_block_version: "${blk_v2}" }
              as: NumberingAdmin
              captures: { res2_id: $.data.id }
          assert:
            - "the first trigger returns HTTP 201 with NumberReservation.${res1_id}.number_id == '${pn1_id}'"
            - "the second trigger returns HTTP 412 with error_id ERR_STALE_NUMBER_BLOCK_VERSION and creates no reservation"
            - "${blk_v2} == ${blk_v1} + 1, so exactly one write advanced the block"
            - "the fourth trigger returns HTTP 201 with NumberReservation.${res2_id}.number_id == '${pn2_id}'"
            - "NumberBlock.${blk_id} finally reports reserved_count 2, available_count 0 and version ${blk_v1} + 2"

      - name: stale_port_request_version_is_refused_after_a_resubmit_bumped_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.csr-snapshot-create-stale-port-request
          - validations[priority=21]
          - errors.ERR_STALE_PORT_REQUEST_VERSION
        distinguishing_aspect: "The resubmission returns the request to SUBMITTED, so the state precondition at priority 21's upstream neighbour is satisfied and a second snapshot is a legal product operation: the only defect is the liaison's stale version, giving ERR_STALE_PORT_REQUEST_VERSION (412) rather than ERR_PORT_REQUEST_STATE_INVALID."
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z; STRICT carrier; port request filed by porting-1 with version captured as pr_v1"
            - "liaison-1 posts a mismatching snapshot, then porting-1 resubmits, so the request is SUBMITTED again at a higher version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1049", billing_name: "ALDER OY", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Alder Legacy", ocn: "AL24", csr_match_policy: "STRICT", porting_buffer_minutes: 30, foc_business_days: 2 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551812"], claimed_account_number: "CSR-1049", claimed_pin: "0000", claimed_billing_name: "ALDER OY", claimed_address_line1: "49 ALDER ARCH", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_id: $.data.id, pr_v1: $.data.version }
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-1049", pin_on_file: "1049", billing_name_on_file: "ALDER OY", address_line1_on_file: "49 ALDER ARCH", zip_on_file: "94577", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
            - call: "POST /voip/port-requests/${pr_id}/resubmit"
              payload: { claimed_account_number: "CSR-1049", claimed_pin: "1049", claimed_billing_name: "ALDER OY", claimed_address_line1: "49 ALDER ARCH", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_v3: $.data.version }
          trigger:
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-1049", pin_on_file: "1049", billing_name_on_file: "ALDER OY", address_line1_on_file: "49 ALDER ARCH", zip_on_file: "94577", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-1049", pin_on_file: "1049", billing_name_on_file: "ALDER OY", address_line1_on_file: "49 ALDER ARCH", zip_on_file: "94577", expected_port_request_version: "${pr_v3}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
              captures: { snap_id: $.data.id }
          assert:
            - "before the triggers PortRequest.${pr_id}.status == SUBMITTED, resubmission_count == 1 and version == ${pr_v3} == ${pr_v1} + 2"
            - "the first trigger returns HTTP 412 with error_id ERR_STALE_PORT_REQUEST_VERSION, not ERR_PORT_REQUEST_STATE_INVALID"
            - "after the refusal GET /voip/port-requests/${pr_id}/csr-snapshots still returns total_count 1"
            - "the second trigger returns HTTP 201 with CarrierAccountSnapshot.${snap_id}.match_status == MATCHED and PortRequest.${pr_id}.status == VALIDATED"

      - name: the_fourth_rapid_international_attempt_crosses_the_fraud_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.toll_fraud_risk_score
          - validations[priority=51]
          - errors.ERR_TOLL_FRAUD_THRESHOLD_BREACHED
        distinguishing_aspect: "Four one-minute calls at a frozen clock score 39, 49, 59 and 69: the third sits one point under FRAUD_BLOCK_THRESHOLD 60 and is still ALLOWED, while the fourth crosses it and is refused with ERR_TOLL_FRAUD_THRESHOLD_BREACHED (409), leaving the device INTL_BLOCKED with fraud_block_count 1 - the velocity and spread terms grow with the run while geo_points stays pinned at the worst country seen."
        test_recipe:
          setup:
            - "device created 2026-08-01T00:00:00Z, non-nomadic, holding number 4901 with a VERIFIED registration, so nomadic_points 0"
            - "clock then set to 2026-08-05T10:00:00Z and left there, so all four attempts share the 60-minute window and the age multiplier is 1.0"
            - "account intl_calling_enabled true with the default cap of 2000 cents, far above the 307-cent day subtotal"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1050", billing_name: "BIRCH SPA", service_state_code: "CA", status: "ACTIVE", intl_calling_enabled: true }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415635", total_capacity: 10, max_concurrent_reservations: 2 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "4901" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC004901", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "50 BIRCH BEND", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+252612345678", destination_country_code: "252", requested_duration_seconds: 60 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca1_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+2348012345678", destination_country_code: "234", requested_duration_seconds: 60 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca2_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+5355551234", destination_country_code: "53", requested_duration_seconds: 60 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca3_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900502", destination_country_code: "44", requested_duration_seconds: 60 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
          assert:
            - "CallAttempt.${ca1_id}.realtime_risk_score == 39 (velocity 4 + geo 35) with decision ALLOWED, rate_cents_per_minute 140, day_subtotal_cents 140"
            - "CallAttempt.${ca2_id}.realtime_risk_score == 49 (velocity 8 + geo 35 + spread 6) with decision ALLOWED, rate 95, day_subtotal_cents 235"
            - "CallAttempt.${ca3_id}.realtime_risk_score == 59 (velocity 12 + geo 35 + spread 12) with decision ALLOWED, rate 60, day_subtotal_cents 295"
            - "the fourth trigger returns HTTP 409 with error_id ERR_TOLL_FRAUD_THRESHOLD_BREACHED and its persisted row has realtime_risk_score 69 with decision BLOCKED_FRAUD"
            - "Device.${dev_id}.toll_fraud_score == 69, fraud_block_count == 1 and calling_status == INTL_BLOCKED"
            - "GET /voip/devices/${dev_id}/call-attempts returns total_count 4, exactly one of them with decision BLOCKED_FRAUD"

      - name: reject_cascade_spans_slot_bridge_reservation_and_number
