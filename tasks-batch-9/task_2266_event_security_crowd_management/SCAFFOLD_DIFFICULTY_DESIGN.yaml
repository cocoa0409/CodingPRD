  - rule_id: transitive_cascade
    instances:
    - name: cancel_confirmed_assignment_cascades_post_plan_event
      grounds:
      - state_machines.PostAssignment.CONFIRMED_to_CANCELLED
      - calculations.post_fill_and_status
      - calculations.plan_coverage_and_posture
      - calculations.plan_cost_and_hours_ledger
      - calculations.event_gate_posture
      - complexity_profile.complexity_layers.cascading_side_effects
      distinguishing_aspect: 'A single CANCEL on one assignment propagates through four hops in one request: PostAssignment -> Post (FILLED to UNDERSTAFFED) -> StaffingPlan (coverage 1.00 to 0.80, READY to BLOCKED, ledger 82500 to 66000 cents and 37.50 to 30.00 hours) -> SecurityEvent (gate_posture OPEN to RESTRICTED). The four untouched assignments and their posts must be provably unchanged, which is what separates a real cascade from a blanket recompute.

        '
      test_recipe:
        setup:
        - 'canonical five-post plan: Venue (gross_capacity 8000, door_count 1) with zones ZF, ZI, ZE; SecurityEvent with expected_attendance 200 and an APPROVED RiskAssessment (T1, required_total_staff 5, required_supervisors 1, minimum_staffing_cost_floor_cents 36000)'
        - StaffingPlan ACTIVATED with budget_cents 500000 and five posts S1/P1/I1/F1/E1 each requiring one guard over 2026-09-12T15:00:00Z..22:30:00Z
        - five VERIFIED guards each at base_hourly_rate_cents 2200 (guard GC-1005 on the emergency-exit post carries credential_expires_on 2026-09-13T00:00:00Z, every other guard 2026-12-31T00:00:00Z)
        - 'all five assignments CONFIRMED: committed_cost_cents 82500, budget_remaining_cents 417500, committed_guard_hours 37.50, coverage_ratio 1.00, readiness_posture READY, every Post FILLED, SecurityEvent STAFFED with gate_posture OPEN'
