              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/public-hearings/${h1}/hold"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-27T09:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /district/budget-versions/${bv}/adopt"
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NO_REVENUE_ESTIMATE with http 409"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent WITHOUT the X-User-Role header is unauthenticated: ERR_UNAUTHENTICATED (401) fires before any role or existence check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED with http 401 (test sends no X-User-Role / X-User-ID headers)"

      - name: auditor_cannot_create_fiscal_year
        claim_type: rbac_denial
        grounds: [roles.Auditor, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Auditor is read-only: POST /district/fiscal-years as Auditor yields ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with http 403"

      - name: budget_analyst_cannot_certify_projection
        claim_type: rbac_denial
        grounds: [roles.BudgetAnalyst, roles.BusinessManager, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Projection certification is exclusive to BusinessManager: BudgetAnalyst (the projection's creator role) is denied with ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["FY2028 OPEN with ELEMENTARY projection 1200"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
              captures: { ep: $.data.id }
          trigger:
            - call: "POST /district/enrollment-projections/${ep}/certify"
              payload: { actual_pupils: 1250 }
              as: BudgetAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with http 403"

      - name: treasurer_cannot_adopt_budget_authz_before_state
        claim_type: rbac_denial
        grounds: [roles.DistrictTreasurer, roles.BoardClerk, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Authorization (priority 2) precedes state checks (priority 8): DistrictTreasurer attempting adopt on a DRAFT version gets ERR_FORBIDDEN_ROLE — NOT ERR_BUDGET_VERSION_NOT_HEARING_HELD."
        test_recipe:
          setup: ["FY2028 OPEN with one DRAFT budget version"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv}/adopt"
              as: DistrictTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with http 403 (role gate fires before the state-machine gate)"

      - name: auditor_can_read_all_resources
        claim_type: rbac_allowed
        grounds: [roles.Auditor]
        distinguishing_aspect: "Auditor's shared read surface works: GET fiscal-years, GET one fiscal year, and GET budget-versions all succeed as Auditor."
        test_recipe:
          setup: ["FY2028 OPEN with one budget version"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
          trigger:
            - call: "GET /district/fiscal-years"
              as: Auditor
              captures: { fy0: "$.data[0].id" }
            - call: "GET /district/fiscal-years/${fy}"
              as: Auditor
              captures: { fy_one: $.data.id }
            - call: "GET /district/fiscal-years/${fy}/budget-versions"
              as: Auditor
              captures: { bv0: "$.data[0].id" }
          assert:
            - "All three reads succeed (http 200): list contains ${fy}, single GET returns ${fy}, sub-list contains ${bv}"

  # ===========================================================================
  # Section: cross-cutting complexity layers (optimistic concurrency)
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: budget_version_create_stale_fiscal_year_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[budget-version-create-stale-fiscal-year]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on FiscalYear.version: after creating budget version v1 (which bumps the fiscal year to version 3), a second create carrying the previously-observed version 2 is rejected with ERR_STALE_VERSION (412) even though creating another version would otherwise be legal."
        test_recipe:
          setup: ["FY2028 OPEN at version 2; budget version v1 created with expected_fiscal_year_version 2 (fiscal year now at version 3)"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id, v0: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv1: $.data.id }
          trigger:
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "FiscalYear version was 1 at create (${v0}) and 2 after open; v1 creation succeeded against 2"
            - "Second create with the stale expected version 2 rejected: ${err} == ERR_STALE_VERSION with http 412"
            - "Only one budget version exists (GET /district/fiscal-years/${fy}/budget-versions has total_count 1)"

      - name: bond_sale_create_stale_proposal_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[bond-sale-create-stale-proposal]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on BondProposal.version: after sale 2027-A advances the proposal's version, a second sale create carrying the pre-sale version is rejected with ERR_STALE_VERSION (412) even though its par amount fits the remaining authorization."
        test_recipe:
          setup: ["FY2028 OPEN; proposal 18,000,000 PASSED at the 2027-11-02 election (version observed at 4); sale 2027-A created against that version"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/bond-proposals"
              payload: { question_title: "Bond Question A", purpose: "Capital improvements", total_amount: 18000000 }
              as: BoardClerk
              captures: { bp: $.data.id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Roof Replacement", site_code: "HS-01", estimated_cost: 6000000, construction_start: "2028-06-01", construction_end: "2028-08-15", priority_rank: 1 }
              as: BoardClerk
            - call: "POST /district/bond-proposals/${bp}/approve-board"
              as: BoardClerk
            - call: "POST /district/elections"
              payload: { election_date: "2027-11-02", election_type: "REGULAR" }
              as: BoardClerk
              captures: { el: $.data.id }
            - call: "POST /district/elections/${el}/ballot-measures"
              payload: { bond_proposal_id: "${bp}", ballot_language: "Shall the District issue bonds for capital improvements" }
              as: BoardClerk
              as_user_id: "clerk-drafter-1"
              captures: { bm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/ballot-measures/${bm}/certify"
              as: BoardClerk
              as_user_id: "clerk-certifier-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-03T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/elections/${el}/canvass"
              payload: { results: [ { ballot_measure_id: "${bm}", yes_votes: 5200, no_votes: 4800 } ] }
              as: BoardClerk
            - call: "GET /district/bond-proposals/${bp}"
              as: DistrictTreasurer
              captures: { bp_v: $.data.version }
            - call: "POST /district/bond-proposals/${bp}/bond-sales"
              payload: { series_label: "2027-A", par_amount: 1000000, premium: 0, issuance_costs: 0, sale_date: "2027-12-01", expected_bond_proposal_version: "${bp_v}" }
              as: DistrictTreasurer
              captures: { sale: $.data.id }
          trigger:
            - call: "POST /district/bond-proposals/${bp}/bond-sales"
              payload: { series_label: "2027-B", par_amount: 500000, premium: 0, issuance_costs: 0, sale_date: "2028-01-15", expected_bond_proposal_version: "${bp_v}" }
              as: DistrictTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_VERSION with http 412 (proposal version advanced when sale 2027-A was created)"
            - "GET /district/bond-proposals/${bp}/bond-sales returns exactly one sale (2027-A)"

  # ===========================================================================
  # Section: consistency model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a mutation's effects are visible in the very next read — after the transfer, GET budget-lines shows both updated appropriations with no reconciliation delay."
        test_recipe:
          setup: ["FY2028 OPEN; budget version with lines L1 1,000,000 and L2 500,000"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 1000000 }
              as: BudgetAnalyst
              captures: { l1: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "OPERATIONS", function_code: "2500", object_code: "300", cost_center: "DISTRICT", appropriation_amount: 500000 }
              as: BudgetAnalyst
              captures: { l2: $.data.id }
          trigger:
            - call: "POST /district/budget-versions/${bv}/transfers"
              payload: { from_line_id: "${l1}", to_line_id: "${l2}", amount: 250000 }
              as: BudgetAnalyst
            - call: "GET /district/budget-versions/${bv}/budget-lines"
              as: Auditor
              captures: { a1: "$.data[0].appropriation_amount", a2: "$.data[1].appropriation_amount" }
          assert:
            - "The very next GET shows appropriation_amount 750000.00 on line 1 and 750000.00 on line 2 (no eventual-consistency lag)"
            - "Both lines' updated_at advanced past their creation timestamps and each line's version incremented to 2"
