        grounds: ["validations[priority=12]", "errors[ERR_REFUND_EXCEEDS_PAID]"]
        distinguishing_aspect: "REFUND of 6000 against only 5000 net cash paid → ERR_REFUND_EXCEEDS_PAID; equal-to-paid (5000) allowed."
        test_recipe:
          setup: ["program; enrolled student with PAYMENT 5000"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "RX", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
