            - "Two doping tests for athlete A: one with window ending 2026-08-10T18:00:00Z left SCHEDULED, and one with window 2026-08-12T08:00:00Z..18:00:00Z collected inside its window."
            - "The clock is then advanced to 2026-09-01T00:00:00Z, past every response deadline and past both windows."
