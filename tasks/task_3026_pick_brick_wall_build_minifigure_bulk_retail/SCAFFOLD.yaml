# =============================================================================
# PRD Benchmark Seed Tables — Pick-a-Brick Wall & Build-a-Minifigure Bulk Retail
# =============================================================================

scenario: |
  Pick-a-Brick Wall & Build-a-Minifigure Bulk Retail Operations (LEGO Brand Retail): bulk element wall assortment rotation with element sourcing from surplus and current production, cup-fill and per-piece pricing models with weighing or volume-based checkout, element restocking cadence driven by observed depletion and theme launches, build-a-minifigure component tracking across torso, legs, head and accessory bins, exclusive set launch queuing with per-customer purchase limits and loyalty early access, in-store build events and monthly mini-build registration with capacity caps, replacement-part requests for missing elements without proof of purchase, shrink control on loose-element merchandising

domain_name: pick-a-brick-wall-bulk-retail
api_prefix: /stores

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - selector_policy
    - ops_run_checkpoint
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Unique store code, e.g. LEGO-0142", constraints: "globally unique across non-CLOSED stores" }
      - { name: display_name, type: string, source: input, description: "Store display name" }
      - { name: wall_bin_capacity_grams, type: integer, source: input, default: 20000, description: "Total loose-element mass the Pick-a-Brick wall bins can hold" }
      - { name: bin_engine_mass_grams, type: integer, source: computed, default: 0, description: "Sum of bin_mass_grams over all WallBin rows in status OPEN, LOW, or EMPTY" }
      - { name: shrinkage_basis_points, type: integer, source: computed, default: 0, description: "Lifetime cumulative shrink ratio in basis points; = round_half_up(sum(variance_grams over VOID and CLOSED FusionOrders) * 10000 / sum(declared_mass_grams over VOID and CLOSED FusionOrders))" }
      - { name: event_capacity_units, type: integer, source: input, default: 40, description: "Maximum combined registrations for one StoreEvent slot" }
      - { name: checklist_required, type: boolean, source: input, default: true, description: "When true, FusionOrder checkout additionally requires the ExitInspection checklist to be COMPLETED" }
      - { name: last_event_run_index, type: integer, source: system, default: 0, description: "event_run_index value at which this store last ran rotate_events" }
      - { name: stage, type: enum, source: system, description: "TRADING → RESTRICTED → FROZEN", constraints: "enum values in {TRADING, RESTRICTED, FROZEN}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique loyalty email", constraints: "globally unique" }
      - { name: display_name, type: string, source: input, description: "Member display name" }
      - { name: tier, type: enum, source: system, description: "STANDARD | VIP; derived from passed MiniBuildReservation count", constraints: "enum values in {STANDARD, VIP}" }
      - { name: home_store_id, type: string, source: input, description: "FK -> Store.id; the member's preferred store" }
      - { name: passed_mb_reservations, type: integer, source: computed, default: 0, description: "Count of passed MiniBuildReservation rows across all waves, at the current event_run_index" }
      - { name: points_balance, type: integer, source: computed, default: 0, description: "Sum of signed points_delta over this member's LoyaltyLedger rows plus earned_points awarded by CLAIMED replacement requests" }
      - { name: stage, type: enum, source: system, description: "ACTIVE → RESTRICTED → SUSPENDED", constraints: "enum values in {ACTIVE, RESTRICTED, SUSPENDED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Element
    parent: null
    common_fields: true
    fields:
      - { name: element_code, type: string, source: input, description: "Element design code, e.g. 3001", constraints: "globally unique" }
      - { name: element_name, type: string, source: input, description: "Human-readable element name" }
      - { name: theme, type: string, source: input, description: "Owning theme such as Town, Icons, Technic" }
      - { name: unit_mass_grams, type: number, source: input, description: "Mass of one element in grams", constraints: "greater than 0" }
      - { name: cost_basis_cents, type: integer, source: input, description: "Wholesale cost basis per element in cents", constraints: "greater than or equal to 0" }
      - { name: make_ready_lead_days, type: integer, source: input, default: 5, description: "Days a surplus backfill takes to reach the wall" }
      - { name: sourcing_mode, type: enum, source: system, description: "SURPLUS | CURRENT_PRODUCTION", constraints: "enum values in {SURPLUS, CURRENT_PRODUCTION}" }
      - { name: status, type: enum, source: system, description: "PENDING_CATALOG → ACTIVE → RETIRED_TO_ARCHIVE → CATALOG", constraints: "enum values in {PENDING_CATALOG, ACTIVE, RETIRED_TO_ARCHIVE, CATALOG}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ThemeLaunch
    parent: null
    common_fields: true
    fields:
      - { name: theme, type: string, source: input, description: "Theme whose launch rotation is scheduled" }
      - { name: release_utc, type: datetime, source: input, description: "Scheduled release instant; set by POST /theme-launches with integer days_from_default_clock, resolved against the logical clock at creation" }
      - { name: per_customer_limit, type: integer, source: input, default: 1, description: "Maximum EXCLUSIVE_SET units per member per wave", constraints: "greater than or equal to 1" }
      - { name: vip_early_access_utc, type: datetime, source: input, description: "Instant from which VIP members may queue; must be strictly before release_utc" }
      - { name: exclusive_set_sku, type: string, source: input, description: "The exclusive set SKU gated by this launch" }
      - { name: exclusive_set_unit_price_cents, type: integer, source: input, description: "Unit price charged for each exclusive set unit" }
      - { name: stage, type: enum, source: system, description: "SCHEDULED → VIP_EARLY → STAGED_OPEN → CLOSED", constraints: "enum values in {SCHEDULED, VIP_EARLY, STAGED_OPEN, CLOSED}" }
      - { name: exclusive_set_units_remaining, type: integer, source: computed, default: 0, description: "Units of the allocation that have not been claimed; = allocated_exclusive_units - sum(units over queues for this launch in status GRANTED, PURCHASED, PURCHASED_ROLLBACK, EXPIRED, NO_SHOW)" }
      - { name: allocated_exclusive_units, type: integer, source: input, description: "Pool of exclusive-set units the launch is allowed to sell inside this store", constraints: "greater than or equal to 0" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: LaunchQueue
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; launch queues are store scoped" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member holding the queue slot" }
      - { name: launch_id, type: string, source: input, description: "FK -> ThemeLaunch.id; the launch being queued for" }
      - { name: priority_class, type: enum, source: input, description: "VIP_EARLY | GENERAL", constraints: "enum values in {VIP_EARLY, GENERAL}" }
      - { name: requested_units, type: integer, source: input, default: 1, description: "Exclusive set units requested by this queue entry", constraints: "greater than or equal to 1" }
      - { name: sequence, type: integer, source: system, description: "Monotone per-launch arrival counter; authoritative FIFO tie-break, never the id" }
      - { name: wait_mark, type: integer, source: system, description: "Value of the launch-wide arrival counter at the instant this row entered WAITING; every queue join raises the counter, so wait_mark records arrival position" }
      - { name: status, type: enum, source: system, description: "WAITING → GRANTED → PURCHASED | NO_SHOW | EXPIRED | VOIDED, WAITING → EXPIRED, GRANTED → PURCHASED_ROLLBACK", constraints: "enum values in {WAITING, GRANTED, PURCHASED, NO_SHOW, EXPIRED, VOIDED, PURCHASED_ROLLBACK}" }
      - { name: granted_units, type: integer, source: system, default: 0, description: "Units the grant allocated; set when the row enters GRANTED and reversed when it enters PURCHASED_ROLLBACK" }
      - { name: id_check_state, type: enum, source: system, description: "IDENTITY_UNVERIFIED → IDENTITY_VERIFIED | IDENTITY_ESCALATED; the independent identity dimension of this row", constraints: "enum values in {IDENTITY_UNVERIFIED, IDENTITY_VERIFIED, IDENTITY_ESCALATED}" }
      - { name: batch_index, type: integer, source: system, default: 0, description: "Sequence number of the grant this row is part of" }
      - { name: soft_hold_units, type: integer, source: system, default: 0, description: "Per-ThemeLaunch sum of requested_units over rows in WAITING or GRANTED; recomputed on every queue mutation" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: WallBin
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the store whose wall this bin belongs to" }
      - { name: element_id, type: string, source: input, description: "FK -> Element.id; the element currently loaded in this bin" }
      - { name: bin_label, type: string, source: input, description: "Physical wall position label, e.g. A12", constraints: "unique within a store" }
      - { name: bin_capacity_grams, type: integer, source: input, description: "Mass this bin holds when full", constraints: "greater than 0" }
      - { name: bin_mass_grams, type: integer, source: computed, default: 0, description: "Current loose-element mass in the bin", constraints: "greater than or equal to 0" }
      - { name: fill_pct, type: number, source: computed, default: 0, description: "= bin_mass_grams * 100 / bin_capacity_grams, rounded to 1 decimal place with round_half_up" }
      - { name: depletion_rate_pct_per_day, type: number, source: computed, default: 0, description: "Trailing observed depletion from FusionOrders settled for this bin over the trailing 7-day window; used only as a tie-break" }
      - { name: status, type: enum, source: system, description: "OPEN → LOW → EMPTY → RETIRED, EMPTY → OPEN on auto-backfill, LOW → OPEN on surplus backfill", constraints: "enum values in {OPEN, LOW, EMPTY, RETIRED}" }
      - { name: last_restock_index, type: integer, source: system, default: 0, description: "rotation_index value at which this bin was last restocked" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: FusionOrder
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the store where the cup was filled" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member checking out" }
      - { name: cup_size, type: enum, source: input, description: "SMALL | LARGE | JUMBO", constraints: "enum values in {SMALL, LARGE, JUMBO}" }
      - { name: pricing_model, type: enum, source: input, description: "CUP_FILL or PER_PIECE", constraints: "enum values in {CUP_FILL, PER_PIECE}" }
      - { name: pieced_element_id, type: string, source: input, description: "FK -> Element.id; required when pricing_model is PER_PIECE, absent otherwise" }
      - { name: declared_piece_count, type: integer, source: input, default: 0, description: "Client-declared piece count; advisory only for CUP_FILL, authoritative for PER_PIECE", constraints: "greater than or equal to 0" }
      - { name: declared_mass_grams, type: integer, source: input, description: "Mass of the filled cup on the scale", constraints: "greater than 0" }
      - { name: measured_volume_ml, type: number, source: input, default: 0, description: "Cup volume measured at the tunnel; used by the VOLUME variant", constraints: "greater than or equal to 0" }
      - { name: priced_piece_count, type: integer, source: computed, default: 0, description: "Pieces the checkout charged for in PER_PIECE, or the inferred piece count in CUP_FILL" }
      - { name: base_price_cents, type: integer, source: computed, default: 0, description: "Price before member discount and before theme-launch surcharge" }
      - { name: member_discount_cents, type: integer, source: computed, default: 0, description: "VIP tier discount applied to base_price_cents" }
      - { name: final_price_cents, type: integer, source: computed, default: 0, description: "Amount actually charged" }
      - { name: variance_grams, type: integer, source: computed, default: 0, description: "= declared_mass_grams - sum(allocation_grams); the shrink signal" }
      - { name: status, type: enum, source: system, description: "PENDING → SETTLED → VOID → CLOSED", constraints: "enum values in {PENDING, SETTLED, VOID, CLOSED}" }
      - { name: exit_inspection_id, type: string, source: system, description: "ExitInspection id of the inspection that gated this checkout; discoverable through GET /stores/exit-inspections?fusion_order_id=" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: FusionAllocation
    parent: FusionOrder
    common_fields: false
    fields:
      - { name: fusion_order_id, type: string, source: system, description: "FK -> FusionOrder.id; the order this bin draw belongs to" }
      - { name: wall_bin_id, type: string, source: input, description: "FK -> WallBin.id; the bin drawn from" }
      - { name: allocation_grams, type: integer, source: input, description: "Grams drawn from this bin by this cup", constraints: "greater than 0" }

  - name: MinifigureBuild
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the store where the figure was assembled" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the builder" }
      - { name: torso_element_id, type: string, source: input, description: "FK -> Element.id; the torso element fastened to the assembly platform" }
      - { name: head_element_id, type: string, source: input, description: "FK -> Element.id; the head element fastened to the assembly platform" }
      - { name: legs_element_id, type: string, source: input, description: "FK -> Element.id; the legs element fastened to the assembly platform" }
      - { name: accessory_element_id, type: string, source: input, description: "FK -> Element.id; the accessory element taken, or null when the builder declined an accessory" }
      - { name: platform_gen, type: integer, source: system, default: 0, description: "Generation counter incremented by every platform mutation while status is BUILDING" }
      - { name: components_missing, type: integer, source: computed, default: 0, description: "Count of the four component slots whose element is not loaded in any bin of this store with bin_mass_grams > 0" }
      - { name: status, type: enum, source: system, description: "BUILDING → SEALED → RETURNED", constraints: "enum values in {BUILDING, SEALED, RETURNED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: StoreEvent
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the store hosting the event" }
      - { name: event_kind, type: enum, source: input, description: "BUILD_EVENT | MINI_BUILD", constraints: "enum values in {BUILD_EVENT, MINI_BUILD}" }
      - { name: title, type: string, source: input, description: "Event title shown to members" }
      - { name: capacity_units, type: integer, source: input, description: "Maximum combined registrations for this event slot", constraints: "greater than or equal to 1" }
      - { name: start_utc, type: datetime, source: input, description: "Event start instant; set as integer days_from_default_clock resolved against the logical clock at creation" }
      - { name: end_utc, type: datetime, source: input, description: "Event end instant; must be after start_utc" }
      - { name: registered_count, type: integer, source: computed, default: 0, description: "Count of MiniBuildReservation rows in REGISTERED for this event" }
      - { name: waitlisted_count, type: integer, source: computed, default: 0, description: "Count of MiniBuildReservation rows in WAITLISTED for this event" }
      - { name: waitlist_epoch, type: integer, source: system, default: 0, description: "Promotion-wave fence. Read at the start of wave_reconcile Round 2 and incremented right after the promotion pass, so a row that joined after that read is carried to the next wave" }
      - { name: event_run_index, type: integer, source: computed, default: 0, description: "Value of Store.last_event_run_index at the instant this slot was created" }
      - { name: stage, type: enum, source: system, description: "SCHEDULED → OPEN → CLOSED → COMPLETED", constraints: "enum values in {SCHEDULED, OPEN, CLOSED, COMPLETED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: MiniBuildReservation
    parent: StoreEvent
    common_fields: true
    fields:
      - { name: store_event_id, type: string, source: system, description: "FK -> StoreEvent.id; the event slot reserved" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member or group representative" }
      - { name: seats, type: integer, source: input, default: 1, description: "Seats taken by this registration", constraints: "greater than or equal to 1" }
      - { name: wait_mark, type: integer, source: system, description: "StoreEvent.waitlist_epoch value stamped when this row entered WAITLISTED; the fence that keeps a late join out of an already-run promotion wave" }
      - { name: status, type: enum, source: system, description: "REGISTERED → PASSED | WAITLISTED → PROMOTED | NOT_ADMITTED | EXPIRED, REGISTERED → EXPIRED", constraints: "enum values in {REGISTERED, WAITLISTED, PROMOTED, PASSED, EXPIRED, NOT_ADMITTED}" }
      - { name: arrival_counter, type: integer, source: system, description: "Monotone per-store event-registration arrival counter; authoritative FIFO tie-break, never the id" }
      - { name: checked_in_at_utc, type: datetime, source: system, description: "Logical-clock instant the member checked in; null until checked in" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ReplacementRequest
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the store fulfilling the request" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the requester" }
      - { name: element_id, type: string, source: input, description: "FK -> Element.id; the element being replaced" }
      - { name: quantity_missing, type: integer, source: input, description: "Number of missing elements claimed", constraints: "greater than or equal to 1" }
      - { name: proof_of_purchase_supplied, type: boolean, source: input, default: false, description: "Whether the member offered a receipt; never required" }
      - { name: window_days, type: integer, source: input, default: 30, description: "Resolution window in days granted at approval", constraints: "greater than or equal to 1" }
      - { name: window_expires_utc, type: datetime, source: computed, description: "= auto_approved_at_utc + window_days * 1 day, evaluated against the logical clock" }
      - { name: earned_points, type: integer, source: computed, default: 0, description: "Loyalty points granted on CLAIMED prospects; 0 for denied or completed requests" }
      - { name: stage, type: enum, source: system, description: "OPEN → PROSPECT | DENIED, PROSPECT → CLAIMED, OPEN → COMPLETED", constraints: "enum values in {OPEN, PROSPECT, DENIED, CLAIMED, COMPLETED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: LoyaltyLedger
    parent: Member
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the member whose balance this entry moves" }
      - { name: entry_kind, type: enum, source: input, description: "REDEMPTION | REPLACEMENT_GRANT | MANUAL_ADJUSTMENT", constraints: "enum values in {REDEMPTION, REPLACEMENT_GRANT, MANUAL_ADJUSTMENT}" }
      - { name: points_delta, type: integer, source: input, description: "Signed points movement", constraints: "non-zero" }
      - { name: reason, type: string, source: input, description: "Operator-facing reason for the movement" }

  - name: ExitInspection
    parent: FusionOrder
    common_fields: true
    fields:
      - { name: fusion_order_id, type: string, source: system, description: "FK -> FusionOrder.id; the order under inspection" }
      - { name: outcome, type: enum, source: input, description: "CLEAR | MISMATCH", constraints: "enum values in {CLEAR, MISMATCH}" }
      - { name: checklist_result, type: enum, source: input, description: "COMPLETED | PARTIAL | WAIVED", constraints: "enum values in {COMPLETED, PARTIAL, WAIVED}" }
      - { name: reviewed_by_user_id, type: string, source: input, description: "Opaque operator identifier of the reviewer" }
      - { name: variance_bps, type: integer, source: computed, default: 0, description: "= round_half_up(abs(variance_grams) * 10000 / declared_mass_grams)" }
      - { name: stage, type: enum, source: system, description: "SCHEDULED → COMPLETED | WAIVED", constraints: "enum values in {SCHEDULED, COMPLETED, WAIVED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Store: cyclic recovery cycle, compound input from Member children ---
  - entity: Store
    initial_state: TRADING
    terminal_states: []
    notes: |
      The store stage is a derived posture with two independent inputs:
      (i) bin_engine_mass_grams versus wall_bin_capacity_grams, and
      (ii) the count of Member rows whose home_store_id is this store and whose
      stage is SUSPENDED. Both inputs are folded into the single stage field.
    transitions:
      - from: TRADING
        to: RESTRICTED
        trigger: "system (automatic when bin_engine_mass_grams < floor(wall_bin_capacity_grams * 0.10) after any bin mutation)"
        actor: system
        preconditions:
          - "Store.stage == TRADING"
        side_effects:
          - "Store.stage = RESTRICTED"
          - "POST /stores/fusion-orders at this store now rejects with ERR_STORE_RESTRICTED when declared_mass_grams > CUP_CAPACITY_GRAMS[cup_size]"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system (automatic when bin_engine_mass_grams reaches 0 on a bin mutation, or when the third distinct Member row with home_store_id == store.id enters SUSPENDED)"
        actor: system
        preconditions:
          - "Store.stage == RESTRICTED"
        side_effects:
          - "Store.stage = FROZEN"
          - "Every LaunchQueue row of this store in status WAITING or GRANTED is set to VOIDED"
          - "Every StoreEvent row of this store in stage SCHEDULED or OPEN is set to CLOSED"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system (automatic when bin_engine_mass_grams rises above 0 and the suspended-member count is below 3)"
        actor: system
        preconditions:
          - "Store.stage == FROZEN"
        side_effects:
          - "Store.stage = RESTRICTED"
      - from: RESTRICTED
        to: TRADING
        trigger: "system (automatic when bin_engine_mass_grams reaches floor(wall_bin_capacity_grams * 0.10) or above and the suspended-member count is below 3)"
        actor: system
        preconditions:
          - "Store.stage == RESTRICTED"
        side_effects:
          - "Store.stage = TRADING"

  # --- Member: cyclic with reinstatement ---
  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (automatic when passed_mb_reservations >= NO_SHOW_RESTRICT_COUNT, or when home store stage becomes FROZEN)"
        actor: system
        preconditions:
          - "Member.stage == ACTIVE"
        side_effects:
          - "Member.stage = RESTRICTED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /stores/members/{memberId}/suspend"
        actor: StoreAssociate
        preconditions:
          - "Member.stage IN {ACTIVE, RESTRICTED}"
          - "At least one LaunchQueue row for this member in status GRANTED exists, or a justified suspension reason_code is supplied"
        side_effects:
          - "Member.stage = SUSPENDED"
          - "Every LaunchQueue row of this member in status WAITING or GRANTED becomes VOIDED"
          - "Each newly VOIDED LaunchQueue row releases its granted_units back to ThemeLaunch.exclusive_set_units_remaining"
          - "ThemeLaunch.soft_hold_units recomputed for every affected launch (launch_grant_allocation)"
          - "For each affected launch in stage STAGED_OPEN whose soft_hold_units is now below exclusive_set_units_remaining, the launch grant batch is re-evaluated (POST /stores/launch-queues/grant semantics)"
          - "If an affected launch reaches exclusive_set_units_remaining == 0, that ThemeLaunch.stage becomes CLOSED"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "POST /stores/members/{memberId}/suspend"
        actor: StoreAssociate
        preconditions:
          - "Member.stage IN {ACTIVE, RESTRICTED}"
          - "At least one LaunchQueue row for this member in status GRANTED exists, or a justified suspension reason_code is supplied"
        side_effects:
          - "Member.stage = SUSPENDED"
          - "Every LaunchQueue row of this member in status WAITING or GRANTED becomes VOIDED"
          - "Each newly VOIDED LaunchQueue row releases its granted_units back to ThemeLaunch.exclusive_set_units_remaining"
          - "ThemeLaunch.soft_hold_units recomputed for every affected launch (launch_grant_allocation)"
          - "For each affected launch in stage STAGED_OPEN whose soft_hold_units is now below exclusive_set_units_remaining, the launch grant batch is re-evaluated (POST /stores/launch-queues/grant semantics)"
          - "If an affected launch reaches exclusive_set_units_remaining == 0, that ThemeLaunch.stage becomes CLOSED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /stores/members/{memberId}/reinstate"
        actor: StoreAssociate
        preconditions:
          - "Member.stage == SUSPENDED"
          - "Member's home Store.bin_engine_mass_grams >= floor(wall_bin_capacity_grams * 0.25)"
        side_effects:
          - "Member.stage = ACTIVE"
          - "Member.passed_mb_reservations reset to 0"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "system (automatic on the wave_reconcile Round 3 pass when no-show count is below NO_SHOW_RESTRICT_COUNT and home store stage is not FROZEN)"
        actor: system
        preconditions:
          - "Member.stage == RESTRICTED"
        side_effects:
          - "Member.stage = ACTIVE"

  # --- Element: catalog loop ---
  - entity: Element
    initial_state: PENDING_CATALOG
    terminal_states: []
    transitions:
      - from: PENDING_CATALOG
        to: ACTIVE
        trigger: "system (automatic when the first WallBin row loading this element reaches bin_mass_grams > 0)"
        actor: system
        preconditions:
          - "Element.status == PENDING_CATALOG"
        side_effects:
          - "Element.status = ACTIVE"
      - from: ACTIVE
        to: RETIRED_TO_ARCHIVE
        trigger: "POST /stores/elements/{elementId}/retire"
        actor: StoreAssociate
        preconditions:
          - "No WallBin row with element_id == element.id has bin_mass_grams > 0"
          - "No FusionOrder row with pieced_element_id == element.id is in status PENDING"
        side_effects:
          - "Element.status = RETIRED_TO_ARCHIVE"
      - from: RETIRED_TO_ARCHIVE
        to: CATALOG
        trigger: "system (automatic on the wave_reconcile Round 1 pass when a RESTOCK_SURPLUS requisition names the element)"
        actor: system
        preconditions:
          - "Element.status == RETIRED_TO_ARCHIVE"
        side_effects:
          - "Element.status = CATALOG"
          - "Element.sourcing_mode = SURPLUS"
      - from: CATALOG
        to: ACTIVE
        trigger: "POST /stores/elements/{elementId}/reissue"
        actor: StoreAssociate
        preconditions:
          - "Element.status == CATALOG"
        side_effects:
          - "Element.status = ACTIVE"
          - "Element.sourcing_mode = CURRENT_PRODUCTION"

  # --- ThemeLaunch: cyclic with a postponement revert ---
  - entity: ThemeLaunch
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: VIP_EARLY
        trigger: "system (automatic on the wave_reconcile Round 1 pass when the logical clock is at or past vip_early_access_utc)"
        actor: system
        preconditions:
          - "ThemeLaunch.stage == SCHEDULED"
        side_effects:
          - "ThemeLaunch.stage = VIP_EARLY"
      - from: VIP_EARLY
        to: STAGED_OPEN
        trigger: "system (automatic on the wave_reconcile Round 1 pass when the logical clock is at or past release_utc)"
        actor: system
        preconditions:
          - "ThemeLaunch.stage == VIP_EARLY"
        side_effects:
          - "ThemeLaunch.stage = STAGED_OPEN"
          - "LaunchQueue rows in WAITING with priority_class == GENERAL become grant-eligible"
      - from: STAGED_OPEN
        to: CLOSED
        trigger: "system (automatic when exclusive_set_units_remaining reaches 0 after a grant or purchase)"
        actor: system
        preconditions:
          - "ThemeLaunch.stage == STAGED_OPEN"
        side_effects:
          - "ThemeLaunch.stage = CLOSED"
          - "Every LaunchQueue row of this launch still in WAITING becomes EXPIRED"
      - from: VIP_EARLY
        to: SCHEDULED
        trigger: "POST /stores/theme-launches/{launchId}/reschedule"
        actor: PlatformAdmin
        preconditions:
          - "ThemeLaunch.stage == VIP_EARLY"
          - "No LaunchQueue row of this launch is in status GRANTED or PURCHASED"
        side_effects:
          - "ThemeLaunch.stage = SCHEDULED"
          - "ThemeLaunch.release_utc and vip_early_access_utc recomputed from the new days_from_default_clock"
      - from: CLOSED
        to: SCHEDULED
        trigger: "POST /stores/theme-launches/{launchId}/reschedule"
        actor: PlatformAdmin
        preconditions:
          - "ThemeLaunch.stage == CLOSED"
        side_effects:
          - "ThemeLaunch.stage = SCHEDULED"
          - "ThemeLaunch.exclusive_set_units_remaining = ThemeLaunch.allocated_exclusive_units"
          - "ThemeLaunch.release_utc and vip_early_access_utc recomputed from the new days_from_default_clock"

  # --- LaunchQueue: two independent state dimensions on one row ---
  - entity: LaunchQueue
    initial_state: WAITING
    terminal_states: [PURCHASED, NO_SHOW, EXPIRED, VOIDED]
    notes: |
      Two independent state dimensions live on one LaunchQueue row.
      Dimension 1 is status (the slot dimension): WAITING → GRANTED →
      PURCHASED | NO_SHOW, with WAITING → EXPIRED | VOIDED, GRANTED →
      PURCHASED_ROLLBACK, and PURCHASED → PURCHASED_ROLLBACK.
      Dimension 2 is id_check_state (the identity dimension):
      IDENTITY_UNVERIFIED → IDENTITY_VERIFIED | IDENTITY_ESCALATED.
      The two dimensions evolve independently of each other; the purchase
      transition is the only join that reads both.
    transitions:
      - from: WAITING
        to: GRANTED
        trigger: "POST /stores/launch-queues/grant (batch grant)"
        actor: StoreAssociate
        preconditions:
          - "ThemeLaunch.stage == STAGED_OPEN for GENERAL rows, or ThemeLaunch.stage == VIP_EARLY for VIP_EARLY rows"
          - "Row is among the first eligible candidates ordered by sequence ASC (launch_grant_allocation)"
          - "Member.stage == ACTIVE"
          - "cumulative requested_units through the rows granted in this batch <= exclusive_set_units_remaining (equality is granted)"
        side_effects:
          - "LaunchQueue.status = GRANTED"
          - "LaunchQueue.granted_units = requested_units"
          - "LaunchQueue.batch_index = the grant batch counter of this call"
          - "ThemeLaunch.exclusive_set_units_remaining decremented by granted_units"
          - "ThemeLaunch.soft_hold_units recomputed for this launch"
          - "If ThemeLaunch.exclusive_set_units_remaining == 0: ThemeLaunch.stage = CLOSED"
      - from: WAITING
        to: EXPIRED
        trigger: "system (automatic on the wave_reconcile Round 2 pass for a launch entering CLOSED, and on the Round 3 purge for a launch in CLOSED)"
        actor: system
        preconditions:
          - "Member.stage != ACTIVE, or ThemeLaunch.stage == CLOSED"
        side_effects:
          - "LaunchQueue.status = EXPIRED"
          - "ThemeLaunch.soft_hold_units recomputed for this launch"
      - from: WAITING
        to: VOIDED
        trigger: "system (automatic when the owning Member enters SUSPENDED, or when the store stage becomes FROZEN)"
        actor: system
        preconditions:
          - "LaunchQueue.status == WAITING"
        side_effects:
          - "LaunchQueue.status = VOIDED"
          - "ThemeLaunch.soft_hold_units recomputed for this launch"
      - from: GRANTED
        to: PURCHASED
        trigger: "POST /stores/launch-queues/{queueId}/purchase"
        actor: Member
        preconditions:
          - "LaunchQueue.status == GRANTED"
          - "LaunchQueue.id_check_state == IDENTITY_VERIFIED"
          - "Member.stage == ACTIVE"
          - "requested_units <= ThemeLaunch.per_customer_limit"
        side_effects:
          - "LaunchQueue.status = PURCHASED"
          - "Member.points_balance += requested_units * EXCLUSIVE_PURCHASE_POINTS"
      - from: GRANTED
        to: NO_SHOW
        trigger: "system (automatic on the wave_reconcile Round 2 pass when ThemeLaunch.stage == CLOSED and id_check_state != IDENTITY_VERIFIED)"
        actor: system
        preconditions:
          - "LaunchQueue.status == GRANTED"
        side_effects:
          - "LaunchQueue.status = NO_SHOW"
          - "LaunchQueue.granted_units held; exclusive_set_units_remaining decremented by granted_units"
          - "Member.passed_mb_reservations += 1"
      - from: GRANTED
        to: PURCHASED_ROLLBACK
        trigger: "system (automatic on the wave_reconcile Round 3 pass when the FusionOrder carrying this exclusive set was voided)"
        actor: system
        preconditions:
          - "LaunchQueue.status == GRANTED or PURCHASED"
          - "The linked FusionOrder is in status VOID"
        side_effects:
          - "LaunchQueue.status = PURCHASED_ROLLBACK"
          - "ThemeLaunch.exclusive_set_units_remaining incremented by granted_units"
      - from: PURCHASED
        to: PURCHASED_ROLLBACK
        trigger: "system (automatic on the wave_reconcile Round 3 pass when the FusionOrder carrying this exclusive set was voided)"
        actor: system
        preconditions:
          - "The linked FusionOrder is in status VOID"
        side_effects:
          - "LaunchQueue.status = PURCHASED_ROLLBACK"
          - "ThemeLaunch.exclusive_set_units_remaining incremented by granted_units"
      - from: PURCHASED_ROLLBACK
        to: WAITING
        trigger: "system (automatic on the wave_reconcile Round 3 pass after the unit release)"
        actor: system
        preconditions:
          - "LaunchQueue.status == PURCHASED_ROLLBACK"
          - "ThemeLaunch.stage != CLOSED"
        side_effects:
          - "LaunchQueue.status = WAITING"
          - "LaunchQueue.sequence reassigned to the next launch arrival counter value"
          - "LaunchQueue.granted_units reset to 0"
          - "ThemeLaunch.soft_hold_units recomputed for this launch"
          - "When the refund lifts ThemeLaunch.exclusive_set_units_remaining above 0 while ThemeLaunch.stage is CLOSED: ThemeLaunch.stage returns to STAGED_OPEN (this is the compensating half of the invariant, and it is what makes the launch sellable again)"
      - from: GRANTED
        to: VOIDED
        trigger: "system (automatic when the owning Member enters SUSPENDED)"
        actor: system
        preconditions:
          - "LaunchQueue.status == GRANTED"
        side_effects:
          - "LaunchQueue.status = VOIDED"
          - "ThemeLaunch.exclusive_set_units_remaining incremented by granted_units"
          - "LaunchQueue.granted_units reset to 0"
          - "ThemeLaunch.soft_hold_units recomputed for this launch"

  # --- WallBin: depletion loop with auto-backfill ---
  - entity: WallBin
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: LOW
        trigger: "system (automatic when fill_pct drops below 50.0 after a FusionAllocation decrement)"
        actor: system
        preconditions:
          - "WallBin.fill_pct < 50.0"
        side_effects:
          - "WallBin.status = LOW"
      - from: LOW
        to: EMPTY
        trigger: "system (automatic when fill_pct drops below 15.0 after a FusionAllocation decrement)"
        actor: system
        preconditions:
          - "WallBin.fill_pct < 15.0"
        side_effects:
          - "WallBin.status = EMPTY"
      - from: EMPTY
        to: OPEN
        trigger: "system (automatic on the wave_reconcile Round 1 pass: auto-backfill)"
        actor: system
        preconditions:
          - "Element.status IN {ACTIVE, CATALOG} for the loaded element"
        side_effects:
          - "WallBin.bin_mass_grams += round_half_up(bin_capacity_grams * EMPTY_BACKFILL_PCT)"
          - "WallBin.status = OPEN"
          - "WallBin.last_restock_index = Store.last_event_run_index"
      - from: LOW
        to: OPEN
        trigger: "POST /stores/wall-bins/{binId}/restock (surplus backfill arrives)"
        actor: StoreAssociate
        preconditions:
          - "add_grams > 0"
          - "bin_mass_grams + add_grams <= bin_capacity_grams"
        side_effects:
          - "WallBin.bin_mass_grams += add_grams"
          - "WallBin.status recomputed from fill_pct"
          - "Store.bin_engine_mass_grams recomputed"
      - from: OPEN
        to: RETIRED
        trigger: "POST /stores/wall-bins/rotate"
        actor: StoreAssociate
        preconditions:
          - "WallBin is not among the retained candidates of the rotation plan (wall_depletion_restock)"
        side_effects:
          - "WallBin.status = RETIRED"
          - "WallBin.element_id reassigned to the rotation element chosen for this bin"
          - "Store.bin_engine_mass_grams recomputed"
      - from: RETIRED
        to: OPEN
        trigger: "POST /stores/wall-bins/rotate"
        actor: StoreAssociate
        preconditions:
          - "WallBin is among the first RESTOCK_BATCH_SIZE candidates of the rotation plan (wall_depletion_restock)"
        side_effects:
          - "WallBin.status = OPEN"
          - "WallBin.element_id reassigned to the rotation element chosen for this bin"
          - "WallBin.last_restock_index = Store.last_event_run_index"

  # --- FusionOrder: price/commit pipeline with compensating void and reopen ---
  - entity: FusionOrder
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /stores/fusion-orders/{orderId}/checkout"
        actor: Member
        preconditions:
          - "FusionOrder.status == PENDING"
          - "Store.stage IN {TRADING, RESTRICTED}"
          - "When Store.checklist_required is true: the linked ExitInspection stage == COMPLETED"
          - "For CUP_FILL: declared_mass_grams <= CUP_CAPACITY_GRAMS[cup_size]"
        side_effects:
          - "FusionOrder.status = SETTLED"
          - "FusionOrder.priced_piece_count, base_price_cents, member_discount_cents and final_price_cents computed (fusion_order_base_price, launch_surcharge_and_discount_band)"
          - "Store.shrinkage_basis_points recomputed (store_shrinkage_basis_points)"
      - from: SETTLED
        to: VOID
        trigger: "POST /stores/fusion-orders/{orderId}/void"
        actor: Member
        preconditions:
          - "FusionOrder.status == SETTLED"
        side_effects:
          - "FusionOrder.status = VOID"
          - "Every FusionAllocation of this order is reversed: WallBin.bin_mass_grams += allocation_grams"
          - "WallBin.status recomputed from fill_pct for every reversed bin"
          - "Store.bin_engine_mass_grams recomputed"
          - "Store.stage recomputed against the two posture inputs"
          - "A linked ExitInspection in stage SCHEDULED becomes WAIVED"
          - "ThemeLaunch.exclusive_set_units_remaining recomputed on the next wave_reconcile pass"
      - from: SETTLED
        to: CLOSED
        trigger: "system (automatic on the wave_reconcile Round 3 pass when the linked ExitInspection stage == COMPLETED)"
        actor: system
        preconditions:
          - "FusionOrder.status == SETTLED"
        side_effects:
          - "FusionOrder.status = CLOSED"
      - from: VOID
        to: CLOSED
        trigger: "system (automatic on the wave_reconcile Round 3 pass when no ExitInspection of this order is in stage SCHEDULED)"
        actor: system
        preconditions:
          - "FusionOrder.status == VOID"
        side_effects:
          - "FusionOrder.status = CLOSED"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /stores/exit-inspections (a re-inspection opened on an order whose MISMATCH outcome was overturned)"
        actor: StoreAssociate
        preconditions:
          - "FusionOrder.status == CLOSED"
          - "the newly recorded ExitInspection outcome == CLEAR"
        side_effects:
          - "FusionOrder.status = SETTLED"
          - "Store.shrinkage_basis_points recomputed (store_shrinkage_basis_points)"
      - from: PENDING
        to: VOID
        trigger: "POST /stores/fusion-orders/{orderId}/void"
        actor: Member
        preconditions:
          - "FusionOrder.status == PENDING"
          - "No ExitInspection of this order is in stage COMPLETED"
        side_effects:
          - "FusionOrder.status = VOID"
          - "Every FusionAllocation of this order is reversed: WallBin.bin_mass_grams += allocation_grams"
          - "WallBin.status recomputed from fill_pct for every reversed bin"

  # --- MinifigureBuild: platform assembly with a correction revert ---
  - entity: MinifigureBuild
    initial_state: BUILDING
    terminal_states: [RETURNED]
    transitions:
      - from: BUILDING
        to: BUILDING
        trigger: "POST /stores/minifigure-builds/{buildId}/components"
        actor: Member
        preconditions:
          - "MinifigureBuild.status == BUILDING"
          - "Every element supplied in this call is loaded in at least one WallBin of this store with bin_mass_grams > 0"
        side_effects:
          - "Named component slots reassigned"
          - "MinifigureBuild.platform_gen += 1"
          - "MinifigureBuild.components_missing recomputed"
      - from: BUILDING
        to: SEALED
        trigger: "POST /stores/minifigure-builds/{buildId}/seal"
        actor: Member
        preconditions:
          - "MinifigureBuild.status == BUILDING"
          - "MinifigureBuild.components_missing == 0"
          - "MinifigureBuild.platform_gen >= 1 (the assembly platform was populated at least once)"
        side_effects:
          - "MinifigureBuild.status = SEALED"
          - "Member.points_balance += MINIFIGURE_SEAL_POINTS"
      - from: SEALED
        to: BUILDING
        trigger: "POST /stores/minifigure-builds/{buildId}/components"
        actor: Member
        preconditions:
          - "MinifigureBuild.status == SEALED"
          - "The logical clock is within SEALED_CORRECTION_HOURS hours of the seal"
        side_effects:
          - "MinifigureBuild.status = BUILDING"
          - "Named component slots reassigned"
          - "MinifigureBuild.platform_gen += 1"
          - "MinifigureBuild.components_missing recomputed"
      - from: SEALED
        to: RETURNED
        trigger: "system (automatic on the wave_reconcile Round 3 pass when a RETURN_TO_BIN correction is recorded for a SEALED build)"
        actor: system
        preconditions:
          - "MinifigureBuild.status == SEALED"
          - "the correction names at least one component slot"
        side_effects:
          - "MinifigureBuild.status = RETURNED"

  # --- StoreEvent: scheduling window with child-gated completion ---
  - entity: StoreEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (automatic on the wave_reconcile Round 1 pass when the logical clock is at or past start_utc)"
        actor: system
        preconditions:
          - "StoreEvent.stage == SCHEDULED"
          - "Store.stage != FROZEN for the hosting store"
        side_effects:
          - "StoreEvent.stage = OPEN"
      - from: OPEN
        to: CLOSED
        trigger: "system (automatic on the wave_reconcile Round 2 pass when the logical clock is at or past end_utc)"
        actor: system
        preconditions:
          - "StoreEvent.stage == OPEN"
        side_effects:
          - "StoreEvent.stage = CLOSED"
          - "MiniBuildReservation rows in REGISTERED with checked_in_at_utc == null become EXPIRED"
          - "MiniBuildReservation rows in WAITLISTED are promoted by the wait_mark rule (waitlist_promotion, last_call_promotion). Round 2 snaps StoreEvent.waitlist_epoch before the pass and increments it after, so a row that joined after the snap is held for the next wave"
      - from: CLOSED
        to: OPEN
        trigger: "POST /stores/mini-build-reservations/{reservationId}/cancel"
        actor: Member
        preconditions:
          - "StoreEvent.stage == CLOSED"
          - "The logical clock is strictly before end_utc"
          - "The cancellation leaves registered_count + seats <= capacity_units for a registration entering REGISTERED"
        side_effects:
          - "StoreEvent.stage = OPEN"
      - from: CLOSED
        to: COMPLETED
        trigger: "system (automatic on the wave_reconcile Round 3 pass when every MiniBuildReservation of this event is in a terminal status)"
        actor: system
        preconditions:
          - "StoreEvent.stage == CLOSED"
          - "No MiniBuildReservation of this event is in REGISTERED, WAITLISTED or PROMOTED"
        side_effects:
          - "StoreEvent.stage = COMPLETED"

  # --- MiniBuildReservation: fork with waitlist promotion ---
  - entity: MiniBuildReservation
    initial_state: REGISTERED
    terminal_states: [PASSED, EXPIRED, NOT_ADMITTED]
    transitions:
      - from: REGISTERED
        to: PASSED
        trigger: "POST /stores/mini-build-reservations/{reservationId}/check-in"
        actor: Member
        preconditions:
          - "MiniBuildReservation.status == REGISTERED"
          - "StoreEvent.stage == OPEN"
          - "The logical clock is within the event window"
        side_effects:
          - "MiniBuildReservation.status = PASSED"
          - "MiniBuildReservation.checked_in_at_utc = the current logical clock instant"
          - "Member.passed_mb_reservations += 1"
          - "Member.tier recomputed (vip_early_access_eligibility)"
          - "When the recomputation raises the tier to VIP: every LaunchQueue row of this member in status WAITING has priority_class set to VIP_EARLY (launch_queue_priority_reclass)"
      - from: REGISTERED
        to: EXPIRED
        trigger: "POST /stores/mini-build-reservations/{reservationId}/cancel"
        actor: Member
        preconditions:
          - "MiniBuildReservation.status == REGISTERED"
        side_effects:
          - "MiniBuildReservation.status = EXPIRED"
          - "The first WAITLISTED row of this event is promoted to PROMOTED (waitlist promotion)"
      - from: REGISTERED
        to: EXPIRED
        trigger: "system (automatic on the wave_reconcile Round 2 pass when StoreEvent.stage becomes CLOSED and checked_in_at_utc == null)"
        actor: system
        preconditions:
          - "MiniBuildReservation.checked_in_at_utc == null"
        side_effects:
          - "MiniBuildReservation.status = EXPIRED"
      - from: WAITLISTED
        to: PROMOTED
        trigger: "system (automatic when a REGISTERED row of the same event leaves REGISTERED, or on the last_call_promotion rule)"
        actor: system
        preconditions:
          - "MiniBuildReservation.status == WAITLISTED"
          - "registered_count + seats <= StoreEvent.capacity_units after promotion"
          - "For the wave-driven case: StoreEvent.stage == CLOSED and wait_mark <= the StoreEvent.waitlist_epoch snapped at the start of wave_reconcile Round 2"
          - "For the cancel-driven case: the freed seats were released after this row entered WAITLISTED"
        side_effects:
          - "MiniBuildReservation.status = PROMOTED"
          - "Every LaunchQueue row of the promoted member in status WAITING has priority_class set to VIP_EARLY (launch_queue_priority_reclass)"
          - "StoreEvent.registered_count recomputed"
          - "At the end of the promotion pass, StoreEvent.waitlist_epoch += 1"
      - from: PROMOTED
        to: PASSED
        trigger: "POST /stores/mini-build-reservations/{reservationId}/check-in"
        actor: Member
        preconditions:
          - "MiniBuildReservation.status == PROMOTED"
          - "StoreEvent.stage == OPEN"
          - "The logical clock is within the event window"
        side_effects:
          - "MiniBuildReservation.status = PASSED"
          - "MiniBuildReservation.checked_in_at_utc = the current logical clock instant"
          - "Member.passed_mb_reservations += 1"
          - "Member.tier recomputed (vip_early_access_eligibility)"
      - from: PROMOTED
        to: NOT_ADMITTED
        trigger: "system (automatic on the wave_reconcile Round 2 pass when StoreEvent.stage becomes CLOSED and a PROMOTED row is not checked in)"
        actor: system
        preconditions:
          - "MiniBuildReservation.status == PROMOTED"
          - "MiniBuildReservation.checked_in_at_utc == null"
        side_effects:
          - "MiniBuildReservation.status = NOT_ADMITTED"
      - from: WAITLISTED
        to: NOT_ADMITTED
        trigger: "system (automatic on the wave_reconcile Round 2 pass when StoreEvent.stage becomes COMPLETED)"
        actor: system
        preconditions:
          - "MiniBuildReservation.status == WAITLISTED"
        side_effects:
          - "MiniBuildReservation.status = NOT_ADMITTED"

  # --- ReplacementRequest: evidence-dichotomy fork ---
  - entity: ReplacementRequest
    initial_state: OPEN
    terminal_states: [DENIED, CLAIMED, COMPLETED, EXPIRED]
    transitions:
      - from: OPEN
        to: PROSPECT
        trigger: "system (automatic at creation when the named element is sourced from surplus)"
        actor: system
        preconditions:
          - "Member.stage == ACTIVE"
          - "Element.sourcing_mode == SURPLUS"
          - "The member has fewer than REPLACEMENT_LIMIT_PER_90_DAYS non-DENIED requests created within the trailing 90-day window (replacement_request_budget)"
        side_effects:
          - "ReplacementRequest.stage = PROSPECT"
          - "ReplacementRequest.window_expires_utc = auto_approved_at_utc + window_days days (replacement_window_expiry)"
      - from: OPEN
        to: DENIED
        trigger: "system (automatic at creation when the named element is not sourced, or when the member request budget is exhausted)"
        actor: system
        preconditions:
          - "Element.sourcing_mode == CURRENT_PRODUCTION, or the trailing-90-day request count is at or above REPLACEMENT_LIMIT_PER_90_DAYS"
        side_effects:
          - "ReplacementRequest.stage = DENIED"
          - "ReplacementRequest.earned_points = 0"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /stores/replacement-requests/{requestId}/complete"
        actor: StoreAssociate
        preconditions:
          - "ReplacementRequest.stage == OPEN"
          - "quantity_missing elements were issued from the surplus drawer"
        side_effects:
          - "ReplacementRequest.stage = COMPLETED"
          - "ReplacementRequest.earned_points = the COMPLETION_CREDIT variant of replacement_points_award"
          - "Member.points_balance += earned_points"
      - from: PROSPECT
        to: CLAIMED
        trigger: "POST /stores/replacement-requests/{requestId}/claim"
        actor: Member
        preconditions:
          - "ReplacementRequest.stage == PROSPECT"
          - "The logical clock is strictly before window_expires_utc"
          - "Member.stage == ACTIVE"
        side_effects:
          - "ReplacementRequest.stage = CLAIMED"
          - "ReplacementRequest.earned_points = the CLAIM_VALUATION variant of replacement_points_award"
          - "Member.points_balance += earned_points"
      - from: PROSPECT
        to: EXPIRED
        trigger: "system (automatic on the wave_reconcile Round 2 pass when the logical clock is at or past window_expires_utc)"
        actor: system
        preconditions:
          - "ReplacementRequest.stage == PROSPECT"
          - "the logical clock is at or past window_expires_utc"
        side_effects:
          - "ReplacementRequest.stage = EXPIRED"
          - "ReplacementRequest.earned_points = 0"

  # --- ExitInspection: checklist gate with waiver ---
  - entity: ExitInspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /stores/exit-inspections"
        actor: StoreAssociate
        preconditions:
          - "ExitInspection.stage == SCHEDULED"
          - "outcome IN {CLEAR, MISMATCH}"
        side_effects:
          - "ExitInspection.stage = COMPLETED"
          - "ExitInspection.variance_bps computed from FusionOrder.variance_grams"
          - "If outcome == MISMATCH: Store.shrinkage_basis_points recomputed with this order included"
      - from: SCHEDULED
        to: WAIVED
        trigger: "system (automatic when the inspected FusionOrder enters VOID)"
        actor: system
        preconditions:
          - "ExitInspection.stage == SCHEDULED"
        side_effects:
          - "ExitInspection.stage = WAIVED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's version)
# =============================================================================
concurrency_rules:
  - rule_id: launch-grant-stale-launch
    parent_entity: ThemeLaunch
    write_endpoint: "POST /stores/launch-queues/grant"
    occ_field: "expected_theme_launch_version"
    description: |
      Running a grant batch against a ThemeLaunch whose version has advanced
      since the caller last observed it is rejected. This captures the case
      where the caller's view of the launch allocation is stale because a
      prior grant batch already consumed part of exclusive_set_units_remaining.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: replacement-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /stores/replacement-requests"
    occ_field: "expected_member_version"
    description: |
      Filing a replacement request against a Member whose version has advanced
      since the caller last observed it is rejected. A distinct request may
      legitimately supersede the prior one when the member's trailing-90-day
      budget still allows it, so the second sequential filing cannot be
      rejected by a state precondition — only the stale member version can
      distinguish it.
    error_id: ERR_MEMBER_STALE_VERSION
    http_status: 412

  - rule_id: exit-inspection-stale-order
    parent_entity: FusionOrder
    write_endpoint: "POST /stores/exit-inspections"
    occ_field: "expected_fusion_order_version"
    description: |
      Recording an exit inspection against a FusionOrder whose version has
      advanced since the caller last observed it is rejected. This captures
      the case where the caller's view of the order is stale because the order
      was voided or reopened after the caller read it. A second inspection may
      legitimately supersede the first one once the order is PENDING again
      after a reopen.
    error_id: ERR_INSPECTION_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cup_fill_inferred_pieces
    trigger: "FusionOrder creation with pricing_model == CUP_FILL, and again on every checkout"
    algorithm: aggregation
    formula: |
      priced_piece_count = round_half_up(declared_mass_grams * INCLUDED_PIECES[cup_size] / CUP_REFERENCE_MASS_GRAMS[cup_size])
      # Rounding order is pinned: the product is formed first, then divided,
      # then rounded once with round_half_up to an integer.
      # declared_piece_count is advisory for CUP_FILL and is NOT an input.
    input_set: "the single FusionOrder being priced; measured_volume_ml is not an input to this variant"
    constants:
      INCLUDED_PIECES: { SMALL: 60, LARGE: 120, JUMBO: 200 }
      CUP_REFERENCE_MASS_GRAMS: { SMALL: 200, LARGE: 400, JUMBO: 620 }
    precision: "integer, round_half_up applied once at the end"
    variants:
      - name: VOLUME
        when: "the checkout call passes pricing_variant: VOLUME"
        difference: "replaces declared_mass_grams with (measured_volume_ml * CUP_REFERENCE_MASS_GRAMS[cup_size] / CUP_VOLUME_ML[cup_size]) before the same rounding, so the two variants produce different priced_piece_count for the same physical cup"
    constants_note: "CUP_VOLUME_ML = { SMALL: 250, LARGE: 500, JUMBO: 750 } is pinned for the VOLUME variant"

  - name: cup_fill_overage_band
    trigger: "FusionOrder checkout with pricing_model == CUP_FILL"
    algorithm: tiered_pricing
    formula: |
      n = priced_piece_count
      if n <= INCLUDED_PIECES[cup_size]:
        overage_band_cents = 0
      else:
        overage_pieces = n - INCLUDED_PIECES[cup_size]
        overage_band_cents = round_half_up(overage_pieces * OVERAGE_BAND_CENTS[cup_size] / INCLUDED_PIECES[cup_size])
      # Boundary: exactly INCLUDED_PIECES[cup_size] pieces is inside the flat
      # price; INCLUDED_PIECES[cup_size] + 1 piece produces the first non-zero band.
    input_set: "the single FusionOrder; the bucket base is charged once, never per piece"
    constants:
      OVERAGE_BAND_CENTS: { SMALL: 44, LARGE: 88, JUMBO: 132 }
    precision: "integer cents, round_half_up"

  - name: cup_fill_set_price
    trigger: "FusionOrder checkout with pricing_model == CUP_FILL"
    algorithm: threshold
    formula: |
      # Combinatorial branch on the bucket result plus the Store.stage input.
      n = priced_piece_count
      if n <= INCLUDED_PIECES[cup_size]:
        bucket_cents = INCLUDED_PIECES[cup_size]
      else:
        bucket_cents = INCLUDED_PIECES[cup_size] + cup_fill_overage_band
      if Store.stage == RESTRICTED:
        bucket_cents = round_half_up(bucket_cents / RESTRICTED_SURCHARGE_DIVISOR)
      if Store.stage == FROZEN:
        reject with ERR_STORE_FROZEN
      # A FROZEN store never reaches this line; a RESTRICTED store halves the
      # bucket price, including the overage band.
    input_set: "the single FusionOrder plus its Store.stage"
    constants:
      RESTRICTED_SURCHARGE_DIVISOR: 2
    precision: "integer cents, round_half_up"

  - name: per_piece_price
    trigger: "FusionOrder checkout with pricing_model == PER_PIECE"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: (1) piece subtotal, (2) bulk-surcharge band
      # keyed on the declared piece count, (3) sum. The band is NOT computed
      # against a running total that already includes the band.
      piece_subtotal_cents = declared_piece_count * PER_PIECE_UNIT_CENTS
      if declared_piece_count >= PER_PIECE_SURCHARGE_THRESHOLD:
        bulk_surcharge_cents = PER_PIECE_SURCHARGE_BAND
      else:
        bulk_surcharge_cents = 0
      base_price_cents_before_discount = piece_subtotal_cents + bulk_surcharge_cents
    input_set: "the single FusionOrder; pieced_element_id must resolve to an Element in status ACTIVE or CATALOG"
    constants:
      PER_PIECE_UNIT_CENTS: 12
      PER_PIECE_SURCHARGE_THRESHOLD: 100
      PER_PIECE_SURCHARGE_BAND: 400
    precision: "integer cents, round_half_up"

  - name: member_price_with_launch_surcharge
    trigger: "FusionOrder checkout"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is pinned: round_half_up after the discount and again
      # after the launch surcharge, never once at the end.
      if pricing_model == CUP_FILL:
        base = cup_fill_set_price
      else:
        base = per_piece_price
      discount_rate = VIP_DISCOUNT_PCT if Member.tier == VIP else STANDARD_DISCOUNT_PCT
      member_discount_cents = round_half_up(base * discount_rate)
      discounted = base - member_discount_cents
      if exclusive_launch_id is supplied:
        final_price_cents = round_half_up(discounted * (1 + LAUNCH_SURCHARGE_PCT))
      else:
        final_price_cents = discounted
    input_set: "the single FusionOrder, its Member.tier, and the optional exclusive_launch_id on the checkout call"
    constants:
      VIP_DISCOUNT_PCT: 0.05
      STANDARD_DISCOUNT_PCT: 0.10
      LAUNCH_SURCHARGE_PCT: 0.25
    precision: "integer cents, round_half_up at each step"
    variants:
      - name: POST_DISCOUNT
        when: "the checkout call passes pricing_variant: POST_DISCOUNT or omits pricing_variant"
        difference: "the launch surcharge applies to the discounted amount; this is the base variant"
      - name: PRE_DISCOUNT
        when: "the checkout call passes pricing_variant: PRE_DISCOUNT"
        difference: "the launch surcharge applies to base before member_discount_cents is subtracted; final = round_half_up(base * (1 + LAUNCH_SURCHARGE_PCT)) - member_discount_cents, giving a larger final_price_cents than the base variant for identical inputs"

  - name: wall_bin_fill_pct
    trigger: "any change to WallBin.bin_mass_grams"
    algorithm: aggregation
    formula: |
      fill_pct = round_half_up_1dp(bin_mass_grams * 100 / bin_capacity_grams)
      if fill_pct < FILL_EMPTY_PCT: WallBin.status = EMPTY
      elif fill_pct < FILL_LOW_PCT: WallBin.status = LOW
      else: WallBin.status = OPEN, unless the previous status was RETIRED
      # Boundary: fill_pct exactly 15.0 is LOW, not EMPTY. fill_pct exactly
      # 50.0 is OPEN, not LOW.
    input_set: "the single WallBin"
    constants:
      FILL_LOW_PCT: 50.0
      FILL_EMPTY_PCT: 15.0
    precision: "1 decimal place, round_half_up"

  - name: wall_engine_mass_and_posture
    trigger: "any change to a WallBin in status OPEN, LOW or EMPTY"
    algorithm: threshold
    formula: |
      bin_engine_mass_grams = sum(bin_mass_grams for WallBin rows of this store with status IN {OPEN, LOW, EMPTY})
      suspended_member_count = count(Member rows with home_store_id == store.id and stage == SUSPENDED)
      if bin_engine_mass_grams == 0 or suspended_member_count >= SUSPENDED_MEMBER_FREEZE_COUNT:
        stage = FROZEN
      elif bin_engine_mass_grams < floor(wall_bin_capacity_grams * ENGINE_RESTRICTED_FRACTION):
        stage = RESTRICTED
      else:
        stage = TRADING
      # stage is a pure function of the current engine mass and the suspended
      # member count; there is no restoration hysteresis, so a void that
      # returns mass above the edge moves the store straight back to TRADING.
      # Boundary: at wall_bin_capacity_grams == 20000 the restricted edge is
      # exactly 2000 grams; 2000 reads TRADING and 1999 reads RESTRICTED.
    input_set: "all WallBin rows of the store except RETIRED, plus the store's Member children"
    constants:
      ENGINE_RESTRICTED_FRACTION: 0.10
      SUSPENDED_MEMBER_FREEZE_COUNT: 3
    precision: "integer grams; the fractions are compared as exact decimals with no rounding"

  - name: wall_depletion_restock
    trigger: "POST /stores/wall-bins/rotate, and the wave_reconcile Round 1 auto-backfill"
    algorithm: selector_policy
    formula: |
      candidates = WallBin rows of the store with status IN {EMPTY, LOW} whose id is in the bin_ids list supplied by the caller
      retained   = WallBin rows of the store with status == OPEN
      rank key   = (status_priority, fill_pct ASC, depletion_rate_pct_per_day DESC, created_at ASC)
      status_priority: EMPTY = 0, LOW = 1
      # created_at ASC is the final tie-break; id is never used.
      restock_set = first RESTOCK_BATCH_SIZE rows of candidates sorted by the rank key
      if restock_set is empty:
        respond 200 with an empty array and no mutation (no error)
      else:
        rotatable_retained = retained rows sorted by (fill_pct DESC, created_at ASC)
        the first len(restock_set) rows of rotatable_retained become RETIRED
        each row of restock_set takes the element released by the RETIRED row at the same index,
        and a row that was EMPTY gets bin_mass_grams set to round_half_up(bin_capacity_grams * EMPTY_BACKFILL_PCT)
    input_set: "WallBin rows of one store"
    constants:
      RESTOCK_BATCH_SIZE: 3
      EMPTY_BACKFILL_PCT: 1.00
    precision: "fill_pct sorts on the 1-decimal rounded value"

  - name: store_shrinkage_basis_points
    trigger: "FusionOrder checkout, FusionOrder void, and wave_reconcile Round 3"
    algorithm: aggregation
    formula: |
      included = FusionOrder rows of the store with status IN {VOID, CLOSED}
      shrinkage_basis_points = 0 when sum(declared_mass_grams over included) == 0
      else round_half_up( sum(variance_grams over included) * 10000 / sum(declared_mass_grams over included) )
      variance_grams = declared_mass_grams - sum(allocation_grams over that order's FusionAllocation rows)
      # Boundary is on the empty set: an order still PENDING or SETTLED is
      # excluded, so a store holding only PENDING orders reads 0.
      # A voided order flips into the included set and can move the ratio either way.
    input_set: "FusionOrder rows with status VOID or CLOSED only"
    constants:
      SHRINKAGE_ALERT_BPS: 500
    precision: "integer basis points, round_half_up applied once to the whole ratio"
    variants:
      - name: SITE_CUMULATIVE
        when: "read through GET /stores/{storeId}"
        difference: "accumulates over the store's whole lifetime and is never reset by run_epoch, so it lags a fresh correction"
      - name: ORDER_VARIANCE
        when: "compute_site_shrinkage_variance is read on one order"
        difference: "reports one order's variance_grams as a signed integer instead of a store-level ratio; the two are not interchangeable"

  - name: compute_site_shrinkage_variance
    trigger: "ExitInspection completion, and FusionOrder void"
    algorithm: aggregation
    formula: |
      order_variance_grams = FusionOrder.declared_mass_grams - sum(allocation_grams over that order's FusionAllocation rows)
      sign convention: negative means the bin engine lost mass (shrink); positive means the engine gained mass
      variance_bps = round_half_up(abs(order_variance_grams) * 10000 / declared_mass_grams)
    input_set: "the single FusionOrder and its FusionAllocation children"
    precision: "integer grams and integer basis points, round_half_up"
    variants:
      - name: FIRST_CHECK
        when: "the order has no completed ExitInspection yet"
        difference: "reports the uncorrected variance, and the store-level store_shrinkage_basis_points ignores this order entirely while it is PENDING"
      - name: REINSPECTION
        when: "a CLOSED order is reopened by a CLEAR inspection"
        difference: "reports the corrected variance and writes it into store_shrinkage_basis_points, which the pre-correction reading did not include"

  - name: launch_grant_allocation
    trigger: "POST /stores/launch-queues/grant"
    algorithm: waterfall_allocation
    formula: |
      eligible = LaunchQueue rows of launch_id with status == WAITING and Member.stage == ACTIVE
                 and (priority_class == VIP_EARLY and ThemeLaunch.stage IN {VIP_EARLY, STAGED_OPEN}
                      or priority_class == GENERAL and ThemeLaunch.stage == STAGED_OPEN)
      ordered  = eligible sorted by (priority_class_rank, sequence ASC)
      priority_class_rank: VIP_EARLY = 0, GENERAL = 1
      cumulative = 0; grant_set = []
      for row in ordered:
        if cumulative + row.requested_units <= ThemeLaunch.exclusive_set_units_remaining:
          append row to grant_set; cumulative += row.requested_units
        else:
          break                      # the waterfall stops at the first row that does not fit
      # Equality is granted: a row is granted when cumulative + requested_units
      # equals exclusive_set_units_remaining exactly.
      # Rows the waterfall did not reach stay WAITING; no partial grant is made.
    input_set: "LaunchQueue rows of one launch in status WAITING, joined to Member.stage"
    constants:
      PRIORITY_CLASS_RANK: { VIP_EARLY: 0, GENERAL: 1 }
    precision: "integer units"

  - name: per_customer_limit_check
    trigger: "POST /stores/launch-queues and POST /stores/launch-queues/{queueId}/purchase"
    algorithm: threshold
    formula: |
      # Two different ceilings share this rule and must not be conflated.
      on a queue join:
        wave_units = sum(requested_units over this member's LaunchQueue rows for this launch whose status is not VOIDED and not EXPIRED)
        if wave_units + requested_units > ThemeLaunch.per_customer_limit: reject ERR_PURCHASE_LIMIT_EXCEEDED
      on a purchase:
        if requested_units > ThemeLaunch.per_customer_limit: reject ERR_PURCHASE_LIMIT_EXCEEDED
      # Boundary: requested_units equal to per_customer_limit is accepted;
      # per_customer_limit + 1 is rejected.
    input_set: "the member's non-voided LaunchQueue rows for the launch"
    constants:
      MAX_LAUNCH_PURCHASES_PER_WAVE: 2
      EXCLUSIVE_PURCHASE_POINTS: 50
    precision: "integer units; the points constant is the per-unit award posted on purchase"

  - name: waitlist_promotion
    trigger: "POST /stores/mini-build-reservations/{reservationId}/cancel"
    algorithm: waterfall_allocation
    formula: |
      fence = StoreEvent.waitlist_epoch snapped at the start of the promotion pass
      pool = MiniBuildReservation rows of the event with status == WAITLISTED
             whose wait_mark <= fence
      ordered = pool sorted by (arrival_counter ASC)
      for row in ordered:
        if registered_count + row.seats <= StoreEvent.capacity_units:
          row.status = PROMOTED; registered_count += row.seats
        else:
          row.status = NOT_ADMITTED
      # Boundary: registered_count + seats == capacity_units promotes.
      # The fence is what makes promotion idempotent across waves: a row that
      # joined after the snap cannot be promoted until the next wave advances
      # waitlist_epoch past its wait_mark.
    input_set: "MiniBuildReservation rows of one StoreEvent"
    constants:
      WAITLIST_BACKMARK_HOLD: true
    precision: "integer seats"

  - name: last_call_promotion
    trigger: "the wave_reconcile Round 2 pass when the logical clock is at or past StoreEvent.end_utc"
    algorithm: waterfall_allocation
    formula: |
      fence = StoreEvent.waitlist_epoch snapped at the start of the promotion pass
      pool = WAITLISTED rows with wait_mark <= fence
      # The pool is read once at the start of the pass, so a join recorded
      # after the snap carries a higher wait_mark and is carried to the next wave.
      promote in arrival_counter ASC order while registered_count + seats <= capacity_units
      every remaining WAITLISTED row becomes NOT_ADMITTED
      # Because the fence is snapped before the pass, a member who joins the
      # waitlist after the clock passes end_utc is out of this pool even though
      # the registration endpoint still accepted them.
    input_set: "MiniBuildReservation rows of one StoreEvent"
    constants:
      WAITLIST_BACKMARK_HOLD: true
    precision: "integer seats"

  - name: replacement_window_expiry
    trigger: "ReplacementRequest creation into PROSPECT, and the wave_reconcile Round 2 pass"
    algorithm: threshold
    formula: |
      window_expires_utc = auto_approved_at_utc + window_days * 1 day, evaluated against the logical clock
      expires when current_utc >= window_expires_utc
      # Boundary: a claim at exactly window_expires_utc is rejected (>=); a
      # claim one second earlier is accepted.
    input_set: "ReplacementRequest rows in status PROSPECT"
    constants:
      DEFAULT_WINDOW_DAYS: 30
    precision: "whole days against the logical clock, compared with >="

  - name: replacement_points_award
    trigger: "ReplacementRequest claim and complete"
    algorithm: threshold
    formula: |
      # Two variants awarded from the same quantity and element, deliberately
      # producing different point totals.
      if stage becomes CLAIMED:
        earned_points = round_half_up(quantity_missing * Element.cost_basis_cents * CLAIM_VALUATION_RATE)
      if stage becomes COMPLETED:
        earned_points = COMPLETION_CREDIT_PER_UNIT * quantity_missing
      if stage becomes DENIED or EXPIRED:
        earned_points = 0
      # For an element with cost_basis_cents 8 and quantity_missing 5 the claim
      # variant awards 4 points and the completion variant awards 125 points.
    input_set: "the single ReplacementRequest, its Element.cost_basis_cents, and whether it entered CLAIMED or COMPLETED"
    constants:
      CLAIM_VALUATION_RATE: 0.10
      COMPLETION_CREDIT_PER_UNIT: 25
    precision: "integer points, round_half_up"
    variants:
      - name: CLAIM_VALUATION
        when: "the member claims inside the resolution window"
        difference: "values the claim from the element's surplus cost basis, a small number"
      - name: COMPLETION_CREDIT
        when: "the store fulfils the request instead"
        difference: "pays a flat per-unit good-will credit, orders of magnitude larger, and is not adjusted when the element is later retired"

  - name: vip_early_access_eligibility
    trigger: "Member tier recomputation on every MiniBuildReservation check-in and on every LaunchQueue creation"
    algorithm: threshold
    formula: |
      if passed_mb_reservations >= VIP_PASSED_MB_THRESHOLD: Member.tier = VIP
      else: Member.tier = STANDARD
      # Boundary: exactly VIP_PASSED_MB_THRESHOLD passes promotes to VIP.
      # The count includes PASSED MiniBuildReservation rows only; EXPIRED and
      # NOT_ADMITTED rows never count, and reinstatement resets the count to 0.
    input_set: "MiniBuildReservation rows of the member in status PASSED"
    constants:
      VIP_PASSED_MB_THRESHOLD: 2
    precision: "integer count"

  - name: replacement_request_budget
    trigger: "ReplacementRequest creation"
    algorithm: threshold
    formula: |
      window_start = the logical clock minus REPLACEMENT_WINDOW_LOOKBACK_DAYS days
      used = count(ReplacementRequest rows of the member with stage != DENIED and created_at >= window_start)
      if used >= REPLACEMENT_LIMIT_PER_90_DAYS:
        reject with ERR_REPLACEMENT_LIMIT_REACHED
      # Boundary: used equal to REPLACEMENT_LIMIT_PER_90_DAYS is rejected;
      # used below it is admitted. Proof of purchase never changes the count.
    input_set: "the member's non-DENIED ReplacementRequest rows created inside the trailing window"
    constants:
      REPLACEMENT_LIMIT_PER_90_DAYS: 1
      REPLACEMENT_WINDOW_LOOKBACK_DAYS: 90
    precision: "integer count against the logical clock"

  - name: launch_queue_priority_reclass
    trigger: "Member tier promotion to VIP on a MiniBuildReservation check-in"
    algorithm: constraint_propagation
    formula: |
      for each LaunchQueue row of the member with status == WAITING:
        priority_class = VIP_EARLY
      # Only WAITING rows are reclassified. A row already in GRANTED keeps the
      # priority_class it was granted under, so a promotion never rewrites the
      # history of an allocation that has already been made.
      # The row's sequence is untouched, so the member keeps its arrival place.
    input_set: "the member's LaunchQueue rows in status WAITING"
    constants:
      RECLASS_SOURCE_TIER: VIP
    precision: "enum reassignment, no arithmetic"

  - name: minifigure_component_availability
    trigger: "MinifigureBuild component assignment and seal"
    algorithm: aggregation
    formula: |
      slots = [torso_element_id, head_element_id, legs_element_id, accessory_element_id]
      components_missing = count(slot for slot in slots
                                 if slot is not null
                                 and no WallBin row of this store has element_id == slot and bin_mass_grams > 0)
      # Boundary: an accessory_element_id of null is not counted as missing.
      # A slot whose element sits only in a RETIRED bin is missing, because
      # RETIRED bins are not on the wall.
    input_set: "the four component slots plus the store's WallBin rows with bin_mass_grams > 0"
    constants:
      COMPONENT_SLOT_COUNT: 4
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and the role is recognised"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation, and where the operation acts on the caller's own row, X-User-ID equals the owning member_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every referenced id exists; path ids resolve left to right and the first miss is reported"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "the target resource is in a state that admits the operation, including the optimistic-concurrency expected_*_version match"
    error_id: "ERR_INVALID_STATE / ERR_STALE_VERSION / ERR_MEMBER_STALE_VERSION / ERR_INSPECTION_STALE_VERSION"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 5
    category: business_referential
    check: "referenced sibling resources carry the status this operation requires, checked before any fiscal or capacity rule"
    error_id: "ERR_INSPECTION_REQUIRED / ERR_COMPONENT_NOT_STOCKED / ERR_ELEMENT_NOT_SOURCED / ERR_QUEUE_NOT_READY"
    http_status: 422
    applies_to: "POST /stores/fusion-orders/{orderId}/checkout, POST /stores/minifigure-builds/{buildId}/components, POST /stores/replacement-requests, POST /stores/launch-queues/{queueId}/purchase; the ERR_INSPECTION_REQUIRED branch applies only when Store.checklist_required is true"

  - priority: 6
    category: business_temporal
    check: "the logical clock sits inside the window the operation requires"
    error_id: "ERR_WINDOW_EXPIRED / ERR_EVENT_WINDOW_CLOSED / ERR_LAUNCH_NOT_OPEN"
    http_status: 422
    applies_to: "POST /stores/replacement-requests/{requestId}/claim, POST /stores/mini-build-reservations/{reservationId}/check-in, POST /stores/launch-queues"

  - priority: 7
    category: business_constraint
    check: "the operation does not exceed a per-customer, per-event or per-member ceiling"
    error_id: "ERR_PURCHASE_LIMIT_EXCEEDED / ERR_EVENT_CAPACITY_EXCEEDED / ERR_REPLACEMENT_LIMIT_REACHED / ERR_MEMBER_FROZEN / ERR_EVENT_SLOT_OVERLAP / ERR_LAUNCH_WINDOW_INVALID / ERR_LAUNCH_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /stores/launch-queues, POST /stores/launch-queues/{queueId}/purchase, POST /stores/mini-build-reservations, POST /stores/replacement-requests, POST /stores/store-events, POST /stores/theme-launches"

  - priority: 8
    category: business_fiscal
    check: "the priced amount and the store's shrink position admit the operation"
    error_id: "ERR_CUP_CAPACITY_EXCEEDED / ERR_SHRINKAGE_ALERT"
    http_status: 409
    applies_to: "POST /stores/fusion-orders/{orderId}/checkout"

  - priority: 9
    category: business_safety
    check: "the store posture admits the operation; evaluated last so a requester hears about their own ceiling before the store's"
    error_id: "ERR_STORE_FROZEN / ERR_STORE_RESTRICTED"
    http_status: 409
    applies_to: "POST /stores/fusion-orders/{orderId}/checkout, POST /stores/launch-queues, POST /stores/mini-build-reservations"

# =============================================================================
# §1.5 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Store, epoch and clock ---
  - method: POST
    path: "/stores"
    description: "Open a store"
    roles: [PlatformAdmin]
    code: 201
    input: ["store_code", "display_name", "wall_bin_capacity_grams?", "event_capacity_units?", "checklist_required?"]
    output: Store
    side_effects:
      - "stage=TRADING, bin_engine_mass_grams=0, shrinkage_basis_points=0, last_event_run_index=0"

  - method: GET
    path: "/stores/{id}"
    description: "Read a store, including its derived engine mass, shrink position and stage"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: POST
    path: "/stores/{id}/run_epoch"
    description: "Run the wall rotation epoch. Advances last_event_run_index and drives the three wave_reconcile passes."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Store
    side_effects:
      - "last_event_run_index += 1"
      - "wave_reconcile Round 1: re-derive wall_engine_mass_and_posture, run the wall_depletion_restock auto-backfill, roll ThemeLaunch stages to VIP_EARLY and STAGED_OPEN, reopen StoreEvent rows whose start has passed"
      - "wave_reconcile Round 2: snap waitlist_epoch, expire MiniBuildReservation rows past check-in, run waitlist_promotion and last_call_promotion against the snapped fence, advance waitlist_epoch, expire ReplacementRequest rows past their window, expire stale LaunchQueue rows, close StoreEvent rows past end_utc"
      - "wave_reconcile Round 3: close FusionOrder rows whose ExitInspection is terminal, run the LaunchQueue PURCHASED_ROLLBACK refunds, purge LaunchQueue rows of CLOSED launches, complete StoreEvent rows whose children are all terminal, return restricted Members to ACTIVE when the no-show count allows"
      - "increments Store.version by 1"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server starts at 2026-09-01T00:00:00Z and never reads wall-clock time, so every window, expiry and promotion rule is deterministic."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects: ["the logical clock takes the supplied instant"]

  # --- Member ---
  - method: POST
    path: "/stores/members"
    description: "Create a loyalty member"
    roles: [PlatformAdmin]
    code: 201
    input: ["email", "display_name", "home_store_id"]
    output: Member
    side_effects: ["tier=STANDARD, points_balance=0, passed_mb_reservations=0, stage=ACTIVE"]

  - method: GET
    path: "/stores/members/{id}"
    description: "Read a member"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/stores/members"
    description: "List members, optionally restricted to one home store"
    roles: [PlatformAdmin, StoreAssociate]
    code: 200
    input: ["home_store_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: PATCH
    path: "/stores/members/{id}"
    description: "Adjust a member record"
    roles: [PlatformAdmin]
    code: 200
    input: ["tier?", "points_balance?"]
    output: Member
    side_effects: ["increments Member.version by 1"]

  - method: POST
    path: "/stores/members/{id}/suspend"
    description: "Suspend a restricted member"
    roles: [StoreAssociate]
    code: 200
    input: ["reason_code"]
    output: Member
    side_effects:
      - "stage=SUSPENDED"
      - "every LaunchQueue row of the member in WAITING or GRANTED becomes VOIDED and releases granted_units back to the launch"
      - "increments Member.version by 1"

  - method: POST
    path: "/stores/members/{id}/reinstate"
    description: "Reinstate a suspended member onto the trade floor"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: Member
    side_effects:
      - "stage=ACTIVE, passed_mb_reservations=0"
      - "increments Member.version by 1"

  # --- Element ---
  - method: POST
    path: "/stores/elements"
    description: "Register an element design for the wall"
    roles: [PlatformAdmin]
    code: 201
    input: ["element_code", "element_name", "theme", "unit_mass_grams", "cost_basis_cents", "make_ready_lead_days?"]
    output: Element
    side_effects: ["status=PENDING_CATALOG, sourcing_mode=CURRENT_PRODUCTION"]

  - method: GET
    path: "/stores/elements/{id}"
    description: "Read an element"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: Element
    side_effects: []

  - method: GET
    path: "/stores/elements"
    description: "List elements, optionally by status or theme"
    roles: [PlatformAdmin, StoreAssociate]
    code: 200
    input: ["status?", "theme?", "limit?", "offset?"]
    output: Element[]
    side_effects: []

  - method: POST
    path: "/stores/elements/{id}/retire"
    description: "Retire an element from the wall into the archive, moving it to surplus sourcing"
    roles: [StoreAssociate]
    code: 200
    input: ["expected_element_version"]
    output: Element
    side_effects:
      - "status=RETIRED_TO_ARCHIVE and sourcing_mode=SURPLUS"
      - "increments Element.version by 1"

  - method: POST
    path: "/stores/elements/{id}/reissue"
    description: "Bring an archived element back onto the wall under current-production sourcing"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: Element
    side_effects:
      - "status=ACTIVE, sourcing_mode=CURRENT_PRODUCTION"
      - "increments Element.version by 1"

  # --- WallBin ---
  - method: POST
    path: "/stores/wall-bins"
    description: "Load a wall bin with an element"
    roles: [StoreAssociate]
    code: 201
    input: ["store_id", "element_id", "bin_label", "bin_capacity_grams", "bin_mass_grams?"]
    output: WallBin
    side_effects:
      - "status derived from fill_pct; last_restock_index=Store.last_event_run_index"
      - "Store.bin_engine_mass_grams recomputed (wall_engine_mass_and_posture)"

  - method: GET
    path: "/stores/wall-bins/{id}"
    description: "Read a wall bin"
    roles: [StoreAssociate, Member]
    code: 200
    input: []
    output: WallBin
    side_effects: []

  - method: GET
    path: "/stores/wall-bins"
    description: "List wall bins, filtered by store, element or status"
    roles: [StoreAssociate, Member]
    code: 200
    input: ["store_id?", "element_id?", "status?", "limit?", "offset?"]
    output: WallBin[]
    side_effects: []

  - method: GET
    path: "/stores/wall-bins/{id}/allocations"
    description: "List the cup draws taken from one bin"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: FusionAllocation[]
    side_effects: []

  - method: POST
    path: "/stores/wall-bins/{id}/restock"
    description: "Add mass to a bin from the surplus drawer"
    roles: [StoreAssociate]
    code: 200
    input: ["add_grams"]
    output: WallBin
    side_effects:
      - "bin_mass_grams += add_grams; status recomputed from fill_pct"
      - "Store.bin_engine_mass_grams recomputed and Store.stage re-derived (wall_engine_mass_and_posture)"
      - "increments WallBin.version by 1"

  - method: POST
    path: "/stores/wall-bins/rotate"
    description: "Rotate the wall: pick the next restock set and reassign elements off the retired bins"
    roles: [StoreAssociate]
    code: 200
    input: ["store_id", "bin_ids"]
    output: WallBin[]
    side_effects:
      - "wall_depletion_restock selects the restock set and the retained rows to retire"
      - "each restocked bin takes the released element; a bin that was EMPTY is auto-backfilled"
      - "Store.bin_engine_mass_grams recomputed and Store.stage re-derived"

  # --- FusionOrder ---
  - method: POST
    path: "/stores/fusion-orders"
    description: "Open a Pick-a-Brick cup"
    roles: [StoreAssociate]
    code: 201
    input: ["store_id", "member_id", "cup_size", "pricing_model", "declared_mass_grams", "pieced_element_id?", "declared_piece_count?", "measured_volume_ml?"]
    output: FusionOrder
    side_effects: ["status=PENDING"]

  - method: POST
    path: "/stores/fusion-orders/{id}/allocations"
    description: "Record one bin draw against a cup. A draw larger than the bin currently holds is rejected with ERR_CONSTRAINT_VIOLATION rather than driving the bin negative."
    roles: [StoreAssociate]
    code: 200
    input: ["wall_bin_id", "allocation_grams"]
    output: FusionOrder
    side_effects:
      - "WallBin.bin_mass_grams -= allocation_grams; WallBin.status recomputed from fill_pct"
      - "FusionOrder.variance_grams recomputed"
      - "Store.bin_engine_mass_grams recomputed and Store.stage re-derived"
      - "increments FusionOrder.version by 1"

  - method: GET
    path: "/stores/fusion-orders/{id}"
    description: "Read a cup, including its priced fields"
    roles: [StoreAssociate, Member]
    code: 200
    input: []
    output: FusionOrder
    side_effects: []

  - method: GET
    path: "/stores/fusion-orders"
    description: "List cups, filtered by store, member, status or the per-piece element"
    roles: [StoreAssociate]
    code: 200
    input: ["store_id?", "member_id?", "status?", "pieced_element_id?", "limit?", "offset?"]
    output: FusionOrder[]
    side_effects: []

  - method: GET
    path: "/stores/fusion-orders/{id}/allocations"
    description: "List the bin draws of a cup"
    roles: [StoreAssociate, Member]
    code: 200
    input: []
    output: FusionAllocation[]
    side_effects: []

  - method: POST
    path: "/stores/fusion-orders/{id}/checkout"
    description: "Price and settle a cup"
    roles: [Member]
    code: 200
    input: ["expected_fusion_order_version", "pricing_variant?", "exclusive_launch_id?"]
    output: FusionOrder
    side_effects:
      - "status=SETTLED"
      - "priced_piece_count, base_price_cents, member_discount_cents and final_price_cents computed (member_price_with_launch_surcharge)"
      - "Store.shrinkage_basis_points recomputed (store_shrinkage_basis_points)"
      - "increments FusionOrder.version by 1"

  - method: POST
    path: "/stores/fusion-orders/{id}/void"
    description: "Void a cup and return its mass to the bins"
    roles: [Member]
    code: 200
    input: ["expected_fusion_order_version"]
    output: FusionOrder
    side_effects:
      - "status=VOID"
      - "every FusionAllocation reversed: WallBin.bin_mass_grams += allocation_grams and WallBin.status recomputed"
      - "Store.bin_engine_mass_grams recomputed and Store.stage re-derived"
      - "a SCHEDULED ExitInspection of this order becomes WAIVED"
      - "increments FusionOrder.version by 1"

  # --- ExitInspection ---
  - method: POST
    path: "/stores/exit-inspections"
    description: "Record the exit-tunnel inspection of a cup"
    roles: [StoreAssociate]
    code: 201
    input: ["fusion_order_id", "outcome", "checklist_result", "reviewed_by_user_id", "expected_fusion_order_version"]
    output: ExitInspection
    side_effects:
      - "stage=COMPLETED, variance_bps computed (compute_site_shrinkage_variance)"
      - "on outcome MISMATCH: Store.shrinkage_basis_points recomputed with this order included"
      - "a CLOSED FusionOrder with a CLEAR re-inspection returns to SETTLED"
      - "increments FusionOrder.version by 1"

  - method: GET
    path: "/stores/exit-inspections/{id}"
    description: "Read an exit inspection"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: ExitInspection
    side_effects: []

  - method: GET
    path: "/stores/exit-inspections"
    description: "List exit inspections by cup or stage"
    roles: [StoreAssociate]
    code: 200
    input: ["fusion_order_id?", "stage?", "limit?", "offset?"]
    output: ExitInspection[]
    side_effects: []

  # --- MinifigureBuild ---
  - method: POST
    path: "/stores/minifigure-builds"
    description: "Open a Build-a-Minifigure assembly platform"
    roles: [StoreAssociate]
    code: 201
    input: ["store_id", "member_id"]
    output: MinifigureBuild
    side_effects: ["status=BUILDING, platform_gen=0, components_missing=4"]

  - method: POST
    path: "/stores/minifigure-builds/{id}/components"
    description: "Place or replace component elements on the assembly platform"
    roles: [Member]
    code: 200
    input: ["torso_element_id?", "head_element_id?", "legs_element_id?", "accessory_element_id?"]
    output: MinifigureBuild
    side_effects:
      - "named component slots reassigned; platform_gen += 1"
      - "components_missing recomputed (minifigure_component_availability)"
      - "a SEALED build returns to BUILDING when the correction lands inside the hold window"
      - "increments MinifigureBuild.version by 1"

  - method: GET
    path: "/stores/minifigure-builds/{id}"
    description: "Read a build, including components_missing"
    roles: [Member, StoreAssociate]
    code: 200
    input: []
    output: MinifigureBuild
    side_effects: []

  - method: GET
    path: "/stores/minifigure-builds"
    description: "List builds, filtered by store, member, status or any component element slot"
    roles: [StoreAssociate, Member]
    code: 200
    input: ["store_id?", "member_id?", "status?", "torso_element_id?", "head_element_id?", "legs_element_id?", "accessory_element_id?", "limit?", "offset?"]
    output: MinifigureBuild[]
    side_effects: []

  - method: POST
    path: "/stores/minifigure-builds/{id}/seal"
    description: "Seal a completed figure"
    roles: [Member]
    code: 200
    input: ["expected_build_version"]
    output: MinifigureBuild
    side_effects:
      - "status=SEALED"
      - "increments MinifigureBuild.version by 1"

  # --- ThemeLaunch ---
  - method: POST
    path: "/stores/theme-launches"
    description: "Schedule an exclusive set launch. The identity-check window is the half-open interval [vip_early_access_utc, release_utc); it must have positive width and must not intersect the identity-check window of an existing launch of the same theme. The width check runs before the overlap check, and the overlap check runs before the allocation check."
    roles: [PlatformAdmin]
    code: 201
    input: ["theme", "exclusive_set_sku", "allocated_exclusive_units", "exclusive_set_unit_price_cents", "per_customer_limit?", "days_from_default_clock", "vip_early_days_before_release?"]
    output: ThemeLaunch
    side_effects:
      - "stage=SCHEDULED"
      - "release_utc computed as the logical clock plus days_from_default_clock days"
      - "vip_early_access_utc computed as release_utc minus vip_early_days_before_release days"
      - "exclusive_set_units_remaining=allocated_exclusive_units"
      - "rejects with ERR_LAUNCH_WINDOW_INVALID when vip_early_access_utc is not strictly before release_utc"
      - "rejects with ERR_LAUNCH_WINDOW_OVERLAP when the identity-check window intersects an existing launch's window for the same theme"

  - method: GET
    path: "/stores/theme-launches/{id}"
    description: "Read a launch, including its remaining allocation"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: ThemeLaunch
    side_effects: []

  - method: POST
    path: "/stores/theme-launches/{id}/reschedule"
    description: "Postpone or reopen a launch"
    roles: [PlatformAdmin]
    code: 200
    input: ["days_from_default_clock"]
    output: ThemeLaunch
    side_effects:
      - "release_utc and vip_early_access_utc recomputed from the new days_from_default_clock"
      - "when the launch was CLOSED: stage becomes SCHEDULED and exclusive_set_units_remaining is restored to allocated_exclusive_units"
      - "when the launch was VIP_EARLY: stage returns to SCHEDULED and both instants are recomputed"
      - "increments ThemeLaunch.version by 1"

  # --- LaunchQueue ---
  - method: POST
    path: "/stores/launch-queues"
    description: "Join a member to the launch queue"
    roles: [StoreAssociate]
    code: 201
    input: ["member_id", "launch_id", "priority_class", "requested_units?"]
    output: LaunchQueue
    side_effects:
      - "status=WAITING; priority_class forced to GENERAL when Member.tier is not VIP"
      - "sequence and wait_mark assigned"
      - "ThemeLaunch.soft_hold_units recomputed"

  - method: GET
    path: "/stores/launch-queues/{id}"
    description: "Read a queue row"
    roles: [StoreAssociate, Member]
    code: 200
    input: []
    output: LaunchQueue
    side_effects: []

  - method: GET
    path: "/stores/launch-queues"
    description: "List queue rows by store, launch, member or status"
    roles: [StoreAssociate, Member]
    code: 200
    input: ["store_id?", "launch_id?", "member_id?", "status?", "limit?", "offset?"]
    output: LaunchQueue[]
    side_effects: []

  - method: POST
    path: "/stores/launch-queues/{id}/verify-identity"
    description: "Record the door identity check of a queued member"
    roles: [StoreAssociate]
    code: 200
    input: ["check_result", "expected_queue_version"]
    output: LaunchQueue
    side_effects:
      - "id_check_state = IDENTITY_VERIFIED when check_result is PASS, otherwise IDENTITY_ESCALATED"
      - "increments LaunchQueue.version by 1"

  - method: POST
    path: "/stores/launch-queues/grant"
    description: "Run one grant batch for a launch"
    roles: [StoreAssociate]
    code: 200
    input: ["launch_id", "expected_theme_launch_version", "eligible_queue_ids?"]
    output: LaunchQueue[]
    side_effects:
      - "launch_grant_allocation selects the grant set in priority_class then sequence order"
      - "each granted row moves to GRANTED with granted_units=requested_units and a shared batch_index"
      - "ThemeLaunch.exclusive_set_units_remaining decremented by the batch total"
      - "a launch whose remaining units reach 0 becomes CLOSED and its WAITING rows become EXPIRED"
      - "increments ThemeLaunch.version by 1"

  - method: POST
    path: "/stores/launch-queues/{id}/purchase"
    description: "Buy the granted exclusive set units"
    roles: [Member]
    code: 200
    input: ["expected_queue_version"]
    output: LaunchQueue
    side_effects:
      - "status=PURCHASED"
      - "Member.points_balance += requested_units * EXCLUSIVE_PURCHASE_POINTS"
      - "increments LaunchQueue.version by 1"

  # --- StoreEvent ---
  - method: POST
    path: "/stores/store-events"
    description: "Schedule an in-store build event or monthly mini-build. The requested interval is half-open [start_utc, end_utc); it must not intersect an existing slot of the same store, and touching boundaries are permitted. The window-validity check runs before the overlap check."
    roles: [StoreAssociate]
    code: 201
    input: ["store_id", "event_kind", "title", "capacity_units", "days_from_default_clock", "duration_hours", "start_offset_hours?"]
    output: StoreEvent
    side_effects:
      - "stage=SCHEDULED"
      - "start_utc computed as the logical clock plus days_from_default_clock days plus start_offset_hours hours"
      - "end_utc computed as start_utc plus duration_hours hours"
      - "event_run_index=Store.last_event_run_index"
      - "rejects with ERR_EVENT_SLOT_OVERLAP when the half-open interval intersects an existing slot of the same store"

  - method: GET
    path: "/stores/store-events/{id}"
    description: "Read an event slot, including its registered and waitlisted counts"
    roles: [StoreAssociate, Member]
    code: 200
    input: []
    output: StoreEvent
    side_effects: []

  - method: GET
    path: "/stores/store-events"
    description: "List event slots by store, kind or stage"
    roles: [StoreAssociate, Member]
    code: 200
    input: ["store_id?", "event_kind?", "stage?", "limit?", "offset?"]
    output: StoreEvent[]
    side_effects: []

  # --- MiniBuildReservation ---
  - method: POST
    path: "/stores/mini-build-reservations"
    description: "Register for an event slot, or join its waitlist when the slot is full. A request asking for more seats than the whole slot capacity is rejected rather than waitlisted."
    roles: [StoreAssociate]
    code: 201
    input: ["store_event_id", "member_id", "seats?"]
    output: MiniBuildReservation
    side_effects:
      - "rejects with ERR_EVENT_CAPACITY_EXCEEDED when seats exceeds capacity_units"
      - "status=REGISTERED when registered_count + seats <= capacity_units; otherwise status=WAITLISTED with wait_mark stamped"
      - "arrival_counter assigned"
      - "StoreEvent.registered_count and waitlisted_count recomputed"

  - method: GET
    path: "/stores/mini-build-reservations/{id}"
    description: "Read a reservation"
    roles: [StoreAssociate, Member]
    code: 200
    input: []
    output: MiniBuildReservation
    side_effects: []

  - method: GET
    path: "/stores/mini-build-reservations"
    description: "List reservations by event, member or status"
    roles: [StoreAssociate, Member]
    code: 200
    input: ["store_event_id?", "member_id?", "status?", "limit?", "offset?"]
    output: MiniBuildReservation[]
    side_effects: []

  - method: POST
    path: "/stores/mini-build-reservations/{id}/check-in"
    description: "Check in to an event slot"
    roles: [Member]
    code: 200
    input: []
    output: MiniBuildReservation
    side_effects:
      - "status=PASSED, checked_in_at_utc stamped from the logical clock"
      - "Member.passed_mb_reservations += 1 and Member.tier recomputed (vip_early_access_eligibility)"
      - "increments MiniBuildReservation.version by 1"

  - method: POST
    path: "/stores/mini-build-reservations/{id}/cancel"
    description: "Cancel a reservation or a waitlist place"
    roles: [Member]
    code: 200
    input: []
    output: MiniBuildReservation
    side_effects:
      - "status=EXPIRED"
      - "the freed seats promote the next waitlist row (waitlist_promotion)"
      - "a StoreEvent in CLOSED reopens to OPEN when the cancellation lands before end_utc and the slot still has room"
      - "StoreEvent.registered_count recomputed"
      - "increments MiniBuildReservation.version by 1"

  # --- ReplacementRequest ---
  - method: POST
    path: "/stores/replacement-requests"
    description: "File a missing-element replacement request. No proof of purchase is required."
    roles: [StoreAssociate]
    code: 201
    input: ["store_id", "member_id", "element_id", "quantity_missing", "proof_of_purchase_supplied?", "window_days?", "expected_member_version"]
    output: ReplacementRequest
    side_effects:
      - "stage=PROSPECT with window_expires_utc set when Element.sourcing_mode is SURPLUS and the member is under the trailing-90-day ceiling"
      - "stage=DENIED when Element.sourcing_mode is CURRENT_PRODUCTION or the ceiling is reached"
      - "validation order for this one endpoint inverts the table default: business_constraint (replacement ceiling) is checked before business_referential (element sourcing), so a filing that trips both reports ERR_REPLACEMENT_LIMIT_REACHED"
      - "increments Member.version by 1"

  - method: GET
    path: "/stores/replacement-requests/{id}"
    description: "Read a replacement request"
    roles: [StoreAssociate, Member]
    code: 200
    input: []
    output: ReplacementRequest
    side_effects: []

  - method: GET
    path: "/stores/replacement-requests"
    description: "List replacement requests by member, store, element or stage"
    roles: [StoreAssociate, Member]
    code: 200
    input: ["member_id?", "store_id?", "element_id?", "stage?", "limit?", "offset?"]
    output: ReplacementRequest[]
    side_effects: []

  - method: POST
    path: "/stores/replacement-requests/{id}/claim"
    description: "Claim a prospect inside its resolution window"
    roles: [Member]
    code: 200
    input: []
    output: ReplacementRequest
    side_effects:
      - "stage=CLAIMED, earned_points computed with the CLAIM_VALUATION variant"
      - "Member.points_balance += earned_points"
      - "increments ReplacementRequest.version by 1"

  - method: POST
    path: "/stores/replacement-requests/{id}/complete"
    description: "Fulfil a request from the surplus drawer"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: ReplacementRequest
    side_effects:
      - "stage=COMPLETED, earned_points computed with the COMPLETION_CREDIT variant"
      - "Member.points_balance += earned_points"
      - "increments ReplacementRequest.version by 1"

  # --- LoyaltyLedger ---
  - method: POST
    path: "/stores/loyalty-ledger"
    description: "Post a signed points movement against a member"
    roles: [PlatformAdmin]
    code: 201
    input: ["member_id", "entry_kind", "points_delta", "reason"]
    output: LoyaltyLedger
    side_effects:
      - "Member.points_balance += points_delta; a negative delta is a redemption or a correction"
      - "increments Member.version by 1"

  - method: GET
    path: "/stores/members/{id}/loyalty-ledger"
    description: "List the ledger entries of one member"
    roles: [PlatformAdmin, Member]
    code: 200
    input: []
    output: LoyaltyLedger[]
    side_effects: []

  - method: GET
    path: "/stores/loyalty-ledger"
    description: "List ledger entries, filtered by member or entry kind"
    roles: [PlatformAdmin, Member]
    code: 200
    input: ["member_id?", "entry_kind?", "limit?", "offset?"]
    output: LoyaltyLedger[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not recognised"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not permitted for this operation, or X-User-ID is not the owning member of the target row"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced or path id does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is in a state that does not admit this operation"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_theme_launch_version does not match ThemeLaunch.version on a grant batch"

  - id: ERR_MEMBER_STALE_VERSION
    http: 412
    condition: "expected_member_version does not match Member.version when filing a replacement request"

  - id: ERR_INSPECTION_STALE_VERSION
    http: 412
    condition: "expected_fusion_order_version does not match FusionOrder.version when recording an exit inspection"

  - id: ERR_STORE_FROZEN
    http: 409
    condition: "the store stage is FROZEN, so cups, launch joins, event registrations and replacement filings are all blocked"

  - id: ERR_STORE_RESTRICTED
    http: 409
    condition: "the store stage is RESTRICTED and the cup declared_mass_grams exceeds CUP_CAPACITY_GRAMS[cup_size]"

  - id: ERR_CUP_CAPACITY_EXCEEDED
    http: 409
    condition: "declared_mass_grams exceeds CUP_CAPACITY_GRAMS[cup_size] for the declared cup_size"

  - id: ERR_SHRINKAGE_ALERT
    http: 409
    condition: "Store.shrinkage_basis_points is at or above SHRINKAGE_ALERT_BPS at checkout, so the store's shrink position blocks further settlement"

  - id: ERR_INSPECTION_REQUIRED
    http: 422
    condition: "Store.checklist_required is true and the linked ExitInspection is not in stage COMPLETED"

  - id: ERR_COMPONENT_NOT_STOCKED
    http: 422
    condition: "a component element supplied to a build is not loaded in any bin of the store with bin_mass_grams > 0"

  - id: ERR_COMPONENTS_INCOMPLETE
    http: 409
    condition: "a build seal was attempted while components_missing is greater than 0"

  - id: ERR_ELEMENT_NOT_SOURCED
    http: 422
    condition: "the element named on a per-piece cup resolves to a status other than ACTIVE or CATALOG"

  - id: ERR_ELEMENT_BIN_OCCUPIED
    http: 409
    condition: "an element could not be retired because a bin still holds mass of it"

  - id: ERR_QUEUE_NOT_READY
    http: 422
    condition: "the queue row's id_check_state is IDENTITY_UNVERIFIED, so no purchase may proceed"

  - id: ERR_PURCHASE_LIMIT_EXCEEDED
    http: 409
    condition: "the requested exclusive-set units exceed ThemeLaunch.per_customer_limit"

  - id: ERR_EVENT_CAPACITY_EXCEEDED
    http: 409
    condition: "registered_count plus seats exceeds StoreEvent.capacity_units and waitlisting is not permitted"

  - id: ERR_WINDOW_EXPIRED
    http: 422
    condition: "the logical clock is at or past ReplacementRequest.window_expires_utc"

  - id: ERR_EVENT_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is outside the StoreEvent window, so no check-in is accepted"

  - id: ERR_LAUNCH_NOT_OPEN
    http: 422
    condition: "ThemeLaunch.stage is SCHEDULED or CLOSED, so no queue join is accepted"

  - id: ERR_REPLACEMENT_LIMIT_REACHED
    http: 409
    condition: "the member already has REPLACEMENT_LIMIT_PER_90_DAYS non-DENIED requests inside the trailing 90-day window"

  - id: ERR_MEMBER_FROZEN
    http: 409
    condition: "Member.stage is SUSPENDED, so queue joins, purchases and claims are refused"

  - id: ERR_EVENT_SLOT_OVERLAP
    http: 409
    condition: "the requested StoreEvent interval [start_utc, end_utc) intersects an existing slot of the same store; touching boundaries do not intersect"

  - id: ERR_LAUNCH_WINDOW_INVALID
    http: 409
    condition: "vip_early_access_utc is not strictly before release_utc, so the early-access window has zero or negative width"

  - id: ERR_LAUNCH_WINDOW_OVERLAP
    http: 409
    condition: "the requested launch's identity-check window intersects the identity-check window of an existing launch of the same theme"

  - id: ERR_CONSTRAINT_VIOLATION
    http: 409
    condition: "a bin mass or a grant total would go negative"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Head-office operator. Owns the element catalog, launch scheduling, member records and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /stores — open a store"
      - "POST /stores/{storeId}/run_epoch — run the wall rotation epoch"
      - "POST /_clock/set_current_utc — set the logical clock"
      - "POST /stores/members — create a member"
      - "PATCH /stores/members/{memberId} — adjust a member record"
      - "POST /stores/elements — register an element"
      - "POST /stores/theme-launches — schedule a launch"
      - "POST /stores/theme-launches/{launchId}/reschedule — postpone or reopen a launch"
      - "POST /stores/loyalty-ledger — post a points movement"
    shared_operations:
      - "GET /stores/{storeId} — read a store"
      - "GET /stores/members/{memberId} — read a member"
      - "GET /stores/elements/{elementId} — read an element"
      - "GET /stores/loyalty-ledger — list ledger entries"
      - "GET /stores/theme-launches/{launchId} — read a launch"

  - name: StoreAssociate
    description: "Brick specialist on the shop floor. Owns the wall, the exit tunnel, event scheduling and replacement fulfilment."
    identity: opaque
    exclusive_operations:
      - "POST /stores/elements/{elementId}/retire — retire an element"
      - "POST /stores/elements/{elementId}/reissue — reissue an element"
      - "POST /stores/wall-bins — load a bin"
      - "POST /stores/wall-bins/{binId}/restock — restock a bin"
      - "POST /stores/wall-bins/rotate — rotate the wall"
      - "POST /stores/fusion-orders — open a cup"
      - "POST /stores/fusion-orders/{orderId}/allocations — record a bin draw"
      - "POST /stores/exit-inspections — record an exit inspection"
      - "POST /stores/minifigure-builds — open a build platform"
      - "POST /stores/store-events — schedule an event"
      - "POST /stores/mini-build-reservations — register a member for an event"
      - "POST /stores/replacement-requests — file a replacement request"
      - "POST /stores/replacement-requests/{requestId}/complete — fulfil a request"
      - "POST /stores/launch-queues — join a member to a launch queue"
      - "POST /stores/launch-queues/grant — run a grant batch"
      - "POST /stores/members/{memberId}/suspend — suspend a member"
      - "POST /stores/members/{memberId}/reinstate — reinstate a member"
    shared_operations:
      - "GET /stores/{storeId} — read a store"
      - "GET /stores/elements/{elementId} — read an element"
      - "GET /stores/wall-bins — list bins"
      - "GET /stores/fusion-orders/{orderId} — read a cup"
      - "GET /stores/exit-inspections — list inspections"
      - "GET /stores/launch-queues — list queue rows"

  - name: Member
    description: "Loyalty member acting on their own cup, build, reservation, queue row or replacement request."
    identity: entity_backed:Member
    exclusive_operations:
      - "POST /stores/fusion-orders/{orderId}/checkout — settle a cup"
      - "POST /stores/fusion-orders/{orderId}/void — void a cup"
      - "POST /stores/minifigure-builds/{buildId}/components — place components"
      - "POST /stores/minifigure-builds/{buildId}/seal — seal a build"
      - "POST /stores/launch-queues/{queueId}/purchase — buy granted units"
      - "POST /stores/mini-build-reservations/{reservationId}/check-in — check in"
      - "POST /stores/mini-build-reservations/{reservationId}/cancel — cancel a reservation"
      - "POST /stores/replacement-requests/{requestId}/claim — claim a prospect"
    shared_operations:
      - "GET /stores/{storeId} — read a store"
      - "GET /stores/wall-bins — list bins"
      - "GET /stores/fusion-orders/{orderId} — read a cup"
      - "GET /stores/minifigure-builds/{buildId} — read a build"
      - "GET /stores/mini-build-reservations/{reservationId} — read a reservation"
      - "GET /stores/replacement-requests/{requestId} — read a replacement request"
      - "GET /stores/theme-launches/{launchId} — read a launch"
      - "GET /stores/loyalty-ledger — list own ledger entries"