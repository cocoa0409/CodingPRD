              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 1", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 2", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p2_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 3", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p3_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 4", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p4_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 5", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p5_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel 6", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p6_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
            - call: "POST /audition-slots"
