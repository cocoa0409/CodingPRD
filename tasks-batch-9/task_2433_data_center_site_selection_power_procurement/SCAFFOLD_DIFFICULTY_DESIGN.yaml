scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: load_study_nameplate_vs_diversified_with_cooling_floor
        grounds:
          - calculations.load_study_peak_load
          - entities.LoadStudy.fields.nameplate_peak_mw
          - entities.LoadStudy.fields.diversified_peak_mw
          - entities.LoadStudy.fields.upgrade_required
          - state_machines.InterconnectionApplication.SUBMITTED_to_STUDY_COMPLETE
        distinguishing_aspect: |
          One LoadStudy row carries both variants of the same three load components: nameplate_stacked
          ignores diversity entirely (318.0 MW) while diversified_coincident scales IT load by
          diversity_factor and floors cooling load at COOLING_FLOOR_FACTOR (293.52 MW), so the two
          variants differ by exactly 24.48 MW on identical inputs, and only the diversified variant
          decides upgrade_required and network_upgrade_cost_usd.
        test_recipe:
          setup:
            - "Program 'Hyperscale Alpha' with target_load_mw 300, required_energization_date 2029-06-30, capital_budget_usd 60,000,000."
            - "Utility with total_transmission_capacity_mw 500 (upgrade trigger 250.0 MW), network_upgrade_rate_usd_per_mw 85,000, interconnect_study_fee_per_mw_usd 1,200, commissioning_buffer_days 90."
            - "Site Alpha screened to hazard_tier MODERATE (HAZARD_UPLIFT 0.08)."
            - "Interconnection application for 300 MW, SUBMITTED (study_fee_usd 360,000.00)."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /candidate-sites/${s1_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "EVAPORATIVE", annual_water_demand_mgal: 250 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
            - call: "POST /interconnection-applications"
              payload: { site_id: "${s1_id}", utility_id: "${u_id}", requested_mw: 300, window_start: "2029-01-01T00:00:00Z", window_end: "2029-12-31T00:00:00Z" }
              as: SiteScreeningAnalyst
              captures: { a1_id: $.data.id }
            - call: "POST /interconnection-applications/${a1_id}/submit"
              payload: {}
              as: SiteScreeningAnalyst
          trigger:
            - call: "POST /interconnection-applications/${a1_id}/load-studies"
              payload: { it_load_mw: 240, cooling_load_mw: 66, ancillary_load_mw: 12, diversity_factor: 0.92 }
              as: UtilityPlanner
              as_user_id: "${u_id}"
              captures: { study1_id: $.data.id }
            - call: "POST /interconnection-applications/${a1_id}/load-studies"
              payload: { it_load_mw: 240, cooling_load_mw: 66, ancillary_load_mw: 12, diversity_factor: 0.60 }
              as: UtilityPlanner
              as_user_id: "${u_id}"
              captures: { study2_id: $.data.id }
          assert:
            - "LoadStudy.${study1_id}.study_round == 1"
            - "LoadStudy.${study1_id}.nameplate_peak_mw == 318.0"
            - "LoadStudy.${study1_id}.diversified_peak_mw == 293.52"
            - "LoadStudy.${study1_id}.nameplate_peak_mw - LoadStudy.${study1_id}.diversified_peak_mw == 24.48"
            - "LoadStudy.${study1_id}.upgrade_required == true"
            - "LoadStudy.${study1_id}.network_upgrade_cost_usd == 26945136.00"
            - "LoadStudy.${study2_id}.study_round == 2"
            - "LoadStudy.${study2_id}.nameplate_peak_mw == 318.0"
            - "LoadStudy.${study2_id}.diversified_peak_mw == 212.1"
            - "LoadStudy.${study2_id}.upgrade_required == false"
            - "LoadStudy.${study2_id}.network_upgrade_cost_usd == 0.00"
            - "InterconnectionApplication.${a1_id}.status == STUDY_COMPLETE"
            - "InterconnectionApplication.${a1_id}.study_round == 2"
            - "InterconnectionApplication.${a1_id}.diversified_peak_mw == 212.1"
            - "InterconnectionApplication.${a1_id}.network_upgrade_cost_usd == 0.00"
            - "InterconnectionApplication.${a1_id}.study_fee_usd == 360000.00"
            - "CandidateSite.${s1_id}.site_capital_commitment_usd == 360000.00"

      - name: ppa_annual_volumetric_vs_hourly_matched_credit
        grounds:
          - calculations.ppa_credited_coverage
          - entities.PowerPurchaseAgreement.fields.credited_coverage_mwh
          - entities.PowerPurchaseAgreement.fields.matching_mode
          - entities.SitingProgram.fields.renewable_coverage_pct
        distinguishing_aspect: |
          Two PPAs with byte-identical volumes (annual_generation_mwh 2,100,000 and
          hourly_matched_mwh 1,500,000, SOLAR) credit 1,974,000.0 MWh under ANNUAL_VOLUMETRIC and
          1,470,000.0 MWh under HOURLY_MATCHED, because the first variant applies
          CURTAILMENT[SOLAR] to annual generation while the second applies HOURLY_DELIVERABILITY to
          the load-coincident subset and ignores curtailment entirely.
        test_recipe:
          setup:
            - "Program with target_load_mw 300, so program_annual_load_mwh == 2365200.0."
            - "Two DRAFT PPAs on that program with identical volumes and prices, differing only in matching_mode."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /power-purchase-agreements"
              payload: { program_id: "${p_id}", counterparty_name: "Sunbelt Solar I", technology: "SOLAR", contracted_capacity_mw: 900, annual_generation_mwh: 2100000, hourly_matched_mwh: 1500000, strike_price_usd_per_mwh: 41.50, matching_mode: "ANNUAL_VOLUMETRIC", delivery_start: "2029-07-01T00:00:00Z", delivery_end: "2044-06-30T00:00:00Z" }
              as: PortfolioDirector
              captures: { ppa_vol_id: $.data.id }
            - call: "POST /power-purchase-agreements"
              payload: { program_id: "${p_id}", counterparty_name: "Sunbelt Solar II", technology: "SOLAR", contracted_capacity_mw: 900, annual_generation_mwh: 2100000, hourly_matched_mwh: 1500000, strike_price_usd_per_mwh: 41.50, matching_mode: "HOURLY_MATCHED", delivery_start: "2029-07-01T00:00:00Z", delivery_end: "2044-06-30T00:00:00Z" }
              as: PortfolioDirector
              captures: { ppa_hr_id: $.data.id }
          trigger:
            - call: "POST /power-purchase-agreements/${ppa_vol_id}/execute"
              payload: {}
              as: PortfolioDirector
            - call: "POST /power-purchase-agreements/${ppa_hr_id}/execute"
              payload: {}
              as: PortfolioDirector
          assert:
            - "PowerPurchaseAgreement.${ppa_vol_id}.credited_coverage_mwh == 1974000.0"
            - "PowerPurchaseAgreement.${ppa_hr_id}.credited_coverage_mwh == 1470000.0"
            - "PowerPurchaseAgreement.${ppa_vol_id}.annual_cost_usd == 87150000.00"
            - "PowerPurchaseAgreement.${ppa_hr_id}.annual_cost_usd == 87150000.00"
            - "PowerPurchaseAgreement.${ppa_vol_id}.status == EXECUTED"
            - "SitingProgram.${p_id}.program_annual_load_mwh == 2365200.0"
            - "SitingProgram.${p_id}.renewable_coverage_pct == 145.61"

  - rule_id: combinatorial_formula
    instances:
      - name: site_screening_score_five_component_weighted_composite
        grounds:
          - calculations.site_screening_score
          - calculations.water_headroom_and_feasibility
          - entities.CandidateSite.fields.screening_score
          - entities.CandidateSite.fields.hazard_tier
          - state_machines.CandidateSite.DRAFT_to_SCREENED
        distinguishing_aspect: |
          Mode (a) composition: five independently capped weighted components (power 24.0, fiber
          15.0, water 15.0, workforce 20.0, land 15.0) minus a hazard-tier penalty selected by the
          MAXIMUM of three separate hazard indices, giving exactly 83.00 for Site Alpha and 89.00
          for an otherwise identical site whose flood index is 0.399 instead of 0.45; no single
          component determines the result.
        test_recipe:
          setup:
            - "Program with target_load_mw 300 and a water source permitted for 900 Mgal at NORMAL drought stage."
            - "Two sibling sites of 300 acres each on the same program, utility and water source, each with cooling demand 250 Mgal."
            - "Site Alpha hazard indices 0.20 / 0.45 / 0.30 (max 0.45 -> MODERATE, penalty 6); Site Bravo 0.20 / 0.399 / 0.30 (max 0.399 -> LOW, penalty 0)."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Bravo", state_code: "NC", county: "Davie", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /candidate-sites/${s1_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "EVAPORATIVE", annual_water_demand_mgal: 250 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
            - call: "POST /candidate-sites/${s2_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.399, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "EVAPORATIVE", annual_water_demand_mgal: 250 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
          assert:
            - "CandidateSite.${s1_id}.status == SCREENED"
            - "CandidateSite.${s1_id}.hazard_tier == MODERATE"
            - "CandidateSite.${s1_id}.workforce_availability_ratio == 0.8"
            - "CandidateSite.${s1_id}.screening_score == 83.00"
            - "CandidateSite.${s2_id}.hazard_tier == LOW"
            - "CandidateSite.${s2_id}.screening_score == 89.00"
            - "CandidateSite.${s2_id}.water_headroom_mgal == 650.0"
            - "CandidateSite.${s2_id}.water_feasible == true"
            - "CandidateSite.${s1_id}.water_headroom_mgal == 650.0"
            - "CandidateSite.${s1_id}.screening_score == 83.00 (frozen: the sibling screening changed water_headroom_mgal from 900.0 to 650.0 but did NOT re-derive the score)"
            - "WaterSource.${w_id}.committed_annual_demand_mgal == 500.0"

      - name: incentive_npv_tiered_sales_tax_with_per_year_rounding
        grounds:
          - calculations.incentive_npv
          - entities.IncentiveNegotiation.fields.sales_tax_benefit_usd
          - entities.IncentiveNegotiation.fields.abatement_npv_usd
          - entities.IncentiveNegotiation.fields.clawback_exposure_usd
          - state_machines.IncentiveNegotiation.DRAFT_to_AUTHORITY_COUNTER_PENDING
        distinguishing_aspect: |
          Mode (b) composition: a capex-selected sales-tax tier (3.2e9 -> SALES_TAX_TIER_HIGH
          0.0475) combined with a ten-term discounted abatement stream whose rounding order is
          pinned — rounding each year to cents before summation yields abatement_npv_usd
          343874552.25, whereas summing first and rounding once yields 343874552.24, a one-cent
          divergence the assertion pins.
        test_recipe:
          setup:
            - "Site Alpha exists in DRAFT (screening is not required to negotiate incentives)."
            - "A STATE-level incentive negotiation in DRAFT with no rounds yet, so all four money fields are 0."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /incentive-negotiations"
              payload: { site_id: "${s1_id}", authority_level: "STATE", counterparty_name: "NC Dept of Commerce" }
              as: IncentiveNegotiator
              captures: { n1_id: $.data.id }
          trigger:
            - call: "POST /incentive-negotiations/${n1_id}/rounds"
              payload: { submitted_by_party: "COMPANY", sales_tax_exemption_pct: 1.0, abatement_years: 10, abatement_pct: 0.80, jobs_commitment: 150, capex_commitment_usd: 3200000000 }
              as: IncentiveNegotiator
              as_user_id: "user_negotiator_1"
          assert:
            - "IncentiveNegotiation.${n1_id}.sales_tax_benefit_usd == 94240000.00"
            - "IncentiveNegotiation.${n1_id}.abatement_npv_usd == 343874552.25"
            - "IncentiveNegotiation.${n1_id}.npv_incentive_usd == 438114552.25"
            - "IncentiveNegotiation.${n1_id}.clawback_exposure_usd == 175245820.90"
            - "IncentiveNegotiation.${n1_id}.status == AUTHORITY_COUNTER_PENDING"
            - "IncentiveNegotiation.${n1_id}.round_count == 1"
            - "IncentiveNegotiation.${n1_id}.last_party == COMPANY"

      - name: zoning_mitigation_tier_then_escrow_pct_chain
        grounds:
          - calculations.zoning_mitigation_and_escrow
          - entities.ZoningApplication.fields.weighted_opposition_score
          - entities.ZoningApplication.fields.required_mitigation_tier
          - entities.ZoningApplication.fields.conditions_escrow_usd
          - state_machines.ZoningApplication.SUBMITTED_to_APPROVED_WITH_CONDITIONS
        distinguishing_aspect: |
          Mode (c) composition: five ordered steps where each consumes the previous one's output —
          weighted objections (8.50) and noise excess (7.0 dBA) select BERM_AND_SCREENING, whose
          TIER_BASE plus a per-dBA adder gives mitigation_cost_usd 2975000.00, and that COST (not
          the tier) selects escrow_pct 0.15 for conditions_escrow_usd 446250.00.
        test_recipe:
          setup:
            - "Site Alpha in DRAFT with a zoning application: noise_limit_dba 55, projected_noise_dba 62, visual_mitigation_tier BERM_AND_SCREENING."
            - "Five community objections recorded: three NOISE (1.5 each) and two WATER (2.0 each)."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /zoning-applications"
              payload: { site_id: "${s1_id}", jurisdiction: "Rowan County Board", hearing_date: "2027-03-15T00:00:00Z", noise_limit_dba: 55, projected_noise_dba: 62, visual_mitigation_tier: "BERM_AND_SCREENING" }
              as: SiteScreeningAnalyst
              captures: { z1_id: $.data.id }
            - call: "POST /zoning-applications/${z1_id}/community-objections"
              payload: { objection_type: "NOISE", commenter_reference: "CMT-001" }
              as: PermittingAuthority
            - call: "POST /zoning-applications/${z1_id}/community-objections"
              payload: { objection_type: "NOISE", commenter_reference: "CMT-002" }
              as: PermittingAuthority
            - call: "POST /zoning-applications/${z1_id}/community-objections"
              payload: { objection_type: "NOISE", commenter_reference: "CMT-003" }
              as: PermittingAuthority
            - call: "POST /zoning-applications/${z1_id}/community-objections"
              payload: { objection_type: "WATER", commenter_reference: "CMT-004" }
              as: PermittingAuthority
            - call: "POST /zoning-applications/${z1_id}/community-objections"
              payload: { objection_type: "WATER", commenter_reference: "CMT-005" }
              as: PermittingAuthority
          trigger:
            - call: "POST /zoning-applications/${z1_id}/decide"
              payload: { outcome: "APPROVED_WITH_CONDITIONS", decision_note: "Approved subject to acoustic enclosure and screening conditions." }
              as: PermittingAuthority
          assert:
            - "ZoningApplication.${z1_id}.objection_count == 5"
            - "ZoningApplication.${z1_id}.weighted_opposition_score == 8.50"
            - "ZoningApplication.${z1_id}.noise_excess_dba == 7.0"
            - "ZoningApplication.${z1_id}.required_mitigation_tier == BERM_AND_SCREENING"
            - "ZoningApplication.${z1_id}.mitigation_cost_usd == 2975000.00"
            - "ZoningApplication.${z1_id}.conditions_escrow_usd == 446250.00"
            - "ZoningApplication.${z1_id}.status == APPROVED_WITH_CONDITIONS"
            - "CandidateSite.${s1_id}.site_capital_commitment_usd == 3421250.00"

  - rule_id: non_linear_state_machine
    instances:
      - name: incentive_negotiation_party_alternation_cycle
        grounds:
          - state_machines.IncentiveNegotiation.AUTHORITY_COUNTER_PENDING_to_COMPANY_OFFER_PENDING
          - state_machines.IncentiveNegotiation.COMPANY_OFFER_PENDING_to_AUTHORITY_COUNTER_PENDING
          - validations[priority=14]
          - calculations.incentive_npv
        distinguishing_aspect: |
          A two-state ping-pong cycle traversed twice: the negotiation returns to
          AUTHORITY_COUNTER_PENDING after round 3 and to COMPANY_OFFER_PENDING after round 4, so
          round_count 4 coexists with only two distinct non-terminal states, and each traversal
          overwrites the money fields from the CURRENT round's terms (58099812.47 after round 4,
          not the 438114552.25 of the company rounds).
        test_recipe:
          setup:
            - "Site Alpha in DRAFT with a STATE incentive negotiation in DRAFT."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /incentive-negotiations"
              payload: { site_id: "${s1_id}", authority_level: "STATE", counterparty_name: "NC Dept of Commerce" }
              as: IncentiveNegotiator
              captures: { n1_id: $.data.id }
            - call: "POST /incentive-negotiations/${n1_id}/rounds"
              payload: { submitted_by_party: "COMPANY", sales_tax_exemption_pct: 1.0, abatement_years: 10, abatement_pct: 0.80, jobs_commitment: 150, capex_commitment_usd: 3200000000 }
              as: IncentiveNegotiator
              as_user_id: "user_negotiator_1"
            - call: "POST /incentive-negotiations/${n1_id}/rounds"
