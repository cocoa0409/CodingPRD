  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_execution_requires_home_posture_open_not_restricted
        grounds:
          - validations[priority=502]
          - calculations.home_leasing_posture
          - state_machines.ComplianceObligation.RESOLUTION_SUBMITTED_to_RESOLVED
          - state_machines.Lease.DRAFT_to_EXECUTED
          - errors.ERR_HOME_LEASING_FROZEN
        distinguishing_aspect: |
          Lease execution reads a state that lives on neither the Lease nor the Home but on a third
          entity: while a MAJOR INSURANCE_DEFICIENCY obligation is OPEN the home is RESTRICTED, and
          RESTRICTED - which still permits showings and screening - is not enough for execution, so
          the same fully funded lease is refused and then accepted with no change to the lease itself.
        test_recipe:
          setup:
            - "Chain S has driven Home H1 to STABILIZED / VACANT with leasing_posture OPEN."
            - "Verified prospect P1 screened CONDITIONAL_APPROVED (total_move_in_deposit_cents 352500) and lease L1 is DRAFT at 208000/month with deposit_paid_cents 352500, so V602 can never fire."
            - "A MAJOR INSURANCE_DEFICIENCY obligation is then opened on H1, so calculations.home_leasing_posture yields RESTRICTED - showings and screening stay legal, execution does not."
