          assert:
            - "Before accept: ex8_posture_pre == RESTRICTED and ex8_overdue_pre == 1 (item PENDING, due 7/20 < clock 7/25)"
            - "After accept: FirstDayLetterItem.${it8}.status == SUBMITTED (hop 1)"
            - "After accept: ex8_overdue_post == 0 (hop 2: overdue_item_count recomputed)"
            - "After accept: ex8_posture_post == NORMAL (hop 3: posture relaxed)"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: auth_beats_state_conflict_on_closed_exam_action
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Conflict pair = auth (priority 2) vs state (priority 4): a request that fails BOTH
          the role check AND the state precondition must return ERR_UNAUTHORIZED (403), not
          ERR_INVALID_STATE. Tests the priority ordering across error categories.
        test_recipe:
          setup:
            - "One examination in CLOSED terminal state (or simply SCHEDULED); caller uses RemediationOwner role which is not authorized for /close"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "CFPB2", agency_name: "CFPB2", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag9: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag9}", exam_cycle_code: "T", exam_type: "TRUST", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex9: $.data.id }
            - call: "POST /regulatory-exams/officers"
              payload: { full_name: "O9", email: "o9@x", officer_role_title: "CRO" }
              as: PlatformAdmin
              captures: { off9: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/examinations/${ex9}/close"
              payload: {}
              as: RemediationOwner
              as_user_id: "${off9}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHORIZED (priority 2 auth beats priority 4 state)"
            - "NOT ERR_INVALID_STATE — even though the exam is also in SCHEDULED (not VALIDATION), the role check fires first"

      - name: business_temporal_overlap_beats_business_constraint_duplicate
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_EXAM_SCHEDULE_OVERLAP]
          - errors[ERR_DUPLICATE_KEY]
        distinguishing_aspect: |
          Conflict pair = business_temporal (priority 8) vs business_constraint uniqueness
          (priority 11): creating an exam that BOTH overlaps an existing exam AND would collide
          on exam_cycle_code-like unique field must return ERR_EXAM_SCHEDULE_OVERLAP.
          Different category pair than auth-vs-state.
        test_recipe:
          setup:
            - "Agency with existing exam E1 covering 2026-07-06 to 2026-07-10 (status SCHEDULED, not CANCELLED/CLOSED)"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "FRB3", agency_name: "FRB3", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag10: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag10}", exam_cycle_code: "BASE", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex10_base: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag10}", exam_cycle_code: "BASE", exam_type: "COMPLIANCE", scheduled_start_date: "2026-07-08T00:00:00Z", scheduled_end_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_EXAM_SCHEDULE_OVERLAP (priority 8 temporal beats priority 11 uniqueness)"
            - "NOT ERR_DUPLICATE_KEY even though exam_cycle_code 'BASE' duplicates the existing exam"

  # ===================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: posture_threshold_exactly_three_overdue_items
        grounds:
          - calculations.exam_posture
          - validations[priority=13]
        distinguishing_aspect: |
          Boundary on a NUMERIC COUNT metric: exactly FROZEN_ITEM_THRESHOLD=3 overdue items
          (inclusive >=) must yield FROZEN, whereas 2 yields RESTRICTED. Reachable via
          POST /regulatory-exams/examinations + clock advance.
        test_recipe:
          setup:
            - "Exam with exactly 3 first-day items, all PENDING, all with due_date strictly before clock"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "OCC4", agency_name: "OCC4", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
