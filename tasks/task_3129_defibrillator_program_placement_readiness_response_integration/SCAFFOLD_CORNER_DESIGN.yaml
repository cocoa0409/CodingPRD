  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_device_version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[device-install-stale-version]
          - concurrency_rules[device-consumable-install-stale]
        distinguishing_aspect: "Every Device-mutating endpoint (install, installs, send_to_maintenance, decommission, etc.) increments Device.version by exactly 1; OCC rejects any write carrying the previous version."
        test_recipe:
          setup: ["Device REGISTERED at version 1."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M-OCV", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
