  # ============================================================ errors
  - section: errors
    instances:
      - name: error_cycle_window_overlap_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: cycle_windows_overlap_half_open_adjacency
          rationale: "Asserted as the first trigger of the §1.8 temporal-overlap instance."
      - name: error_placement_period_overlap_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PLACEMENT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: placement_open_ended_period_overlap
          rationale: "Asserted as the trigger of the §1.8 open-ended-overlap instance."
      - name: error_guardian_mismatch_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_GUARDIAN_MISMATCH]
        excluded_because:
          difficulty_instance: guardian_ownership_beats_placement_state
          rationale: "Asserted as the winning error of the §1.8 auth-vs-state priority instance."

  # ============================================================ rbac
  - section: rbac
    instances:
      - name: educator_cannot_create_cycle_returns_unauthorized
        claim_type: role_exclusive_denial
        grounds:
          - roles
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "ReferringEducator calling POST /gifted/screening-cycles is denied with ERR_INSUFFICIENT_PERMISSIONS (403) — cycle administration is GiftedCoordinator-exclusive."
        test_recipe:
          setup: ["none (role check precedes all resource checks)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: ReferringEducator, as_user_id: "edu-9", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (http 403)"

      - name: member_cannot_finalize_scoring_returns_unauthorized
        claim_type: role_exclusive_denial
        grounds:
          - roles
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "CommitteeMember calling finalize-scoring is denied with ERR_INSUFFICIENT_PERMISSIONS — scoring is a coordinator operation even for committee voters (role check precedes existence, so a bogus case id still yields 403)."
        test_recipe:
          setup: ["none"]
          setup_api_calls: []
          trigger:
            - { call: "POST /gifted/cases/00000000-0000-0000-0000-000000000000/finalize-scoring", payload: {}, as: CommitteeMember, as_user_id: "cm-9", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (http 403), not 404"

      - name: coordinator_cannot_cast_vote_returns_unauthorized
        claim_type: role_exclusive_denial
        grounds:
          - roles
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "GiftedCoordinator calling the votes endpoint is denied with ERR_INSUFFICIENT_PERMISSIONS — voting is CommitteeMember-exclusive (separation between administering and deciding)."
        test_recipe:
          setup: ["none"]
          setup_api_calls: []
          trigger:
            - { call: "POST /gifted/committee-reviews/00000000-0000-0000-0000-000000000000/votes", payload: { verdict: "QUALIFY" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (http 403)"

      - name: parent_cannot_open_band_review_returns_unauthorized
        claim_type: role_exclusive_denial
        grounds:
          - roles
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "ParentGuardian may file APPEAL reviews but not BAND_REVIEW: the review_kind-conditional role rule denies a parent's BAND_REVIEW creation with ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["none (role-kind check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /gifted/cases/00000000-0000-0000-0000-000000000000/committee-reviews", payload: { review_kind: "BAND_REVIEW", grounds: "x" }, as: ParentGuardian, as_user_id: "guard-9", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (http 403), not 404"

  # ============================================================ cross_cutting_layers
  - section: cross_cutting_layers
    instances:
      - name: occ_profile_publish_stale_cycle
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[profile-publish-stale-cycle]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After publishing profile A advances the cycle version from 1 to 2, publishing profile B with the stale expected_cycle_version 1 is rejected with ERR_STALE_VERSION (412); B stays DRAFT and A stays PUBLISHED."
        test_recipe:
          setup: ["cycle (version 1 captured at creation) with DRAFT profiles A and B; profile A already published with the captured version"]
          setup_api_calls:
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "A", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof_a: $.data.id } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "B", ability_weight: 0.35, achievement_weight: 0.25, rating_weight: 0.25, portfolio_weight: 0.15, cut_score: 93, review_band_floor: 86, cut_score_2e: 88, review_band_floor_2e: 80 }, as: GiftedCoordinator, captures: { prof_b: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof_a}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
          trigger:
            - { call: "POST /gifted/cut-score-profiles/${prof_b}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_VERSION (http 412): publishing A moved the cycle to version 2, so B's expected version 1 is stale"
            - "profile B remains DRAFT; profile A remains PUBLISHED; cycle.published_profile_id == ${prof_a}"

      - name: reevaluation_auto_activates_on_due_date
        claim_type: scheduled_actions
        grounds: [state_machines.ReEvaluation.SCHEDULED_to_IN_REVIEW]
        distinguishing_aspect: "A re-evaluation is still SCHEDULED one day before due_on (2027-01-14) and flips to IN_REVIEW exactly on due_on (2027-01-15, inclusive >= boundary) when the clock is set."
        test_recipe:
          setup: ["clock 2026-08-20; site; honored student; ACTIVE placement; re-evaluation due 2027-01-15"]
