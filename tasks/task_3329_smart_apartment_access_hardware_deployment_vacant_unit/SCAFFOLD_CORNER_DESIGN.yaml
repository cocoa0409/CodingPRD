          - entities.Device.fields.battery_replacements
        distinguishing_aspect: "replace_battery on an ONLINE device sets battery_pct to 100 and bumps battery_replacements from 0 to 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B with one ONLINE lock D at battery_pct 20, battery_replacements 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
