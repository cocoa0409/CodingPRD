# =============================================================================
# PRD Benchmark Seed Tables — task_2393_new_product_development_stage_gate
# Difficulty target: beyond Expert (§0.4) — 17 entities, 69 endpoints,
# 10 calculations, 51 error codes, 10 state machines (2 on one entity),
# 3 OCC races, 9/9 Difficulty Rules satisfied with 21 §1.8 instances.
# =============================================================================

scenario: |
  2393. New Product Development Stage-Gate & Launch (consumer packaged goods innovation team): idea intake and screening against strategic fit, consumer need and financial hurdle criteria, concept development with consumer testing, volume forecasting and preliminary business case, formulation, packaging and process development with pilot plant scale-up and shelf-life testing, gate reviews with cross-functional deliverable checklists and go/no-go authority, regulatory, claims and label approval prior to commercialization, customer sell-in with trade presentation timing and retailer shelf reset windows, launch readiness across manufacturing, distribution, marketing and sales with a launch date lock, post-launch performance tracking against the business case with continue, fix or discontinue decisions

domain_name: npd-stage-gate
# Flat/graph topology: InnovationProject, StageGate, Retailer and PilotLine are
# all top-level roots, so the API has no single resource prefix.
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Four independent roots (InnovationProject, StageGate, Retailer, PilotLine)
  # joined by cross-aggregate FKs plus a self-referential Deliverable
  # prerequisite DAG; no single ownership tree.

  state_machine_shape: branching
  # GateReview forks IN_SESSION -> {PASSED, CONDITIONAL_PASS, RECYCLED, KILLED}
  # with a divergent side-effect set per branch; InnovationProject.dev_status is
  # cyclic (PILOT_QUALIFIED -> SCREENED on recycle, LAUNCHED <-> IN_MARKET_FIX)
  # and advances independently of InnovationProject.commercial_status on the same row.

  relationship_patterns:
    - one_to_many          # InnovationProject -> GateReview/Deliverable/BusinessCase/...
    - self_referential     # Deliverable.prerequisite_deliverable_id (DAG, cycle detection)
    - cross_aggregate      # PilotRun -> PilotLine, SellInPresentation -> ShelfResetWindow
    - polymorphic: false

  role_model: segregation_of_duties
  # Gate voters may not be the project owner; a deliverable's approver may not be
  # its submitter; the gate chair may not have voted in the review it closes.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# Reusable role list for read-only endpoints (every declared role may read).
role_sets:
  readers: &readers
    - PortfolioAdmin
    - InnovationLead
    - GateChair
    - FunctionalReviewer
    - RegulatoryApprover
    - RnDLead
    - SalesAccountManager

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: InnovationProject
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Working title of the innovation project.
        constraints: 1..120 chars
      - name: brand
        type: string
        source: input
        description: Owning brand name.
      - name: category
        type: enum
        source: input
        description: CPG category the project competes in; selects the StageGate configuration set and the readiness category factor.
        constraints: BEVERAGE | SNACK | DAIRY | HOUSEHOLD
      - name: project_type
        type: enum
        source: input
        description: Innovation type; selects the screening weight vector and the readiness weight vector.
        constraints: NEW_BRAND | LINE_EXTENSION | RENOVATION
      - name: owner_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the InnovationLead that created the project; used by the segregation-of-duties checks. NOT a foreign key.
      - name: strategic_fit_score
        type: number
        source: input
        description: Strategic-fit rating used by screening_score.
        constraints: 0.00..10.00
      - name: consumer_need_score
        type: number
        source: input
        description: Consumer-need rating used by screening_score.
        constraints: 0.00..10.00
      - name: target_gross_margin_pct
        type: number
        source: input
        description: Target gross-margin percent used as the financial-hurdle proxy in screening_score.
        constraints: 0.00..100.00
      - name: category_attractiveness_score
        type: number
        source: input
        description: Category attractiveness rating used by screening_score.
        constraints: 0.00..10.00
      - name: development_budget_cap_usd
        type: number
        source: input
        description: Hard cap on committed development spend (pilot runs plus shelf-life studies).
        constraints: ">= 0.00, 2 decimals"
      - name: development_budget_committed_usd
        type: number
        source: computed
        description: Ledger mirror of committed_development_budget (§1.3); conserved quantity of compensating-invariant dev_budget_ledger.
        default: 0.00
      - name: screening_score
        type: number
        source: computed
        description: Output of screening_score (§1.3); null until POST /innovation-projects/{id}/screen runs.
        default: null
      - name: screening_decision
        type: enum
        source: computed
        description: Screening outcome recorded by the screen endpoint.
        default: PENDING
        constraints: PENDING | PASSED | REJECTED
      - name: dev_status
        type: enum
        source: system
        description: Development-track state (state machine InnovationProject.dev_status).
        default: IDEA
        constraints: IDEA | SCREENED | PILOT_QUALIFIED | LAUNCH_READY | LAUNCHED | IN_MARKET_FIX | KILLED | DISCONTINUED
      - name: commercial_status
        type: enum
        source: system
        description: Commercial-track state evolving independently of dev_status on the same row (state machine InnovationProject.commercial_status).
        default: NOT_STARTED
        constraints: NOT_STARTED | SELL_IN_SCHEDULED | PRESENTED | AUTHORIZED | SELL_IN_REJECTED | LAUNCH_LOCKED | LOCK_SLIPPED | SHIPPED
      - name: next_gate_number
        type: integer
        source: computed
        description: Gate number the project must convene next; enforced by ERR_GATE_SEQUENCE_VIOLATION.
        default: 2
      - name: recycle_count
        type: integer
        source: computed
        description: Number of RECYCLED gate decisions taken against this project.
        default: 0
      - name: open_gate_conditions
        type: boolean
        source: computed
        description: True while a CONDITIONAL_PASS gate review still has unresolved conditions; blocks opening the next gate review.
        default: false
      - name: launch_date
        type: datetime
        source: system
        description: Locked launch date; set by launch-lock, cleared to null when the lock slips.
        default: null
      - name: shelf_reset_window_id
        type: string
        source: system
        description: "FK -> ShelfResetWindow.id; the retailer reset window the locked launch_date falls inside. Null until launch-lock, re-nulled on LOCK_SLIPPED."
        default: null
      - name: launch_readiness_pct
        type: number
        source: computed
        description: Output of launch_readiness_pct (§1.3) over the commercialization gate's required deliverable types.
        default: 0.00
      - name: authorized_acv_pct
        type: number
        source: computed
        description: Sum of Retailer.acv_contribution_pct over this project's SellInPresentation rows with status ACCEPTED, capped at 100.00.
        default: 0.00
      - name: post_launch_decision
        type: enum
        source: computed
        description: Decision carried by the highest period_index PostLaunchPeriod of this project; null before the first period is reported.
        default: null
        constraints: CONTINUE | FIX | DISCONTINUE

  - name: StageGate
    parent: null
    common_fields: true
    fields:
      - name: gate_number
        type: integer
        source: input
        description: Gate ordinal; 2 is the first convened gate (gate 1 is the screen endpoint).
        constraints: ">= 2, unique per (category, gate_number)"
      - name: category
        type: enum
        source: input
        description: Category this gate configuration applies to.
        constraints: BEVERAGE | SNACK | DAIRY | HOUSEHOLD
      - name: stage_from
        type: enum
        source: input
        description: dev_status a project must hold to convene this gate.
        constraints: SCREENED | PILOT_QUALIFIED
      - name: stage_to
        type: enum
        source: input
        description: dev_status the project moves to on PASSED or CONDITIONAL_PASS.
        constraints: PILOT_QUALIFIED | LAUNCH_READY
      - name: required_deliverable_types
        type: array
        source: input
        description: Checklist types auto-created as PENDING Deliverable rows when the project enters stage_from; may be the empty array.
        constraints: subset of the Deliverable.deliverable_type enum, no duplicates
      - name: quorum_size
        type: integer
        source: input
        description: Minimum GateVote count required before the review may be closed.
        constraints: ">= 1"
      - name: veto_functions
        type: array
        source: input
        description: Functions whose REJECT vote turns the decision into KILLED instead of RECYCLED.
        constraints: subset of {R_AND_D, MARKETING, FINANCE, OPERATIONS, QUALITY, REGULATORY, SALES}
      - name: npv_hurdle_usd
        type: number
        source: input
        description: Minimum BusinessCase.npv_usd for a PASSED decision.
        constraints: ">= 0.00"
      - name: payback_months_max
        type: integer
        source: input
        description: Maximum BusinessCase.payback_months for a PASSED decision.
        constraints: ">= 0"
      - name: gross_margin_floor_pct
        type: number
        source: input
        description: Minimum BusinessCase.gross_margin_pct for a PASSED decision.
        constraints: ">= 0.00"
      - name: readiness_floor_index
        type: number
        source: input
        description: Minimum GateReview.readiness_index for a PASSED decision.
        constraints: 0.00..100.00

  - name: GateReview
    parent: InnovationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> InnovationProject.id; project under review."
      - name: gate_id
        type: string
        source: input
        description: "FK -> StageGate.id; gate configuration governing this review."
      - name: scheduled_at
        type: datetime
        source: input
        description: Scheduled session start (informational; no temporal precondition).
      - name: status
        type: enum
        source: system
        description: Review state (state machine GateReview).
        default: SCHEDULED
        constraints: SCHEDULED | IN_SESSION | PASSED | CONDITIONAL_PASS | RECYCLED | KILLED | CANCELLED
      - name: decision
        type: enum
        source: computed
        description: Decision derived from the GateVote set at close; null until closed.
        default: null
        constraints: PASSED | CONDITIONAL_PASS | RECYCLED | KILLED
      - name: chair_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the GateChair that closed the review; null while open. NOT a foreign key.
        default: null
      - name: deliverable_completeness_pct
        type: number
        source: computed
        description: Output of deliverable_completeness_pct (§1.3), frozen at close; 0.00 until first computed at open.
        default: 0.00
      - name: readiness_index
        type: number
        source: computed
        description: Output of gate_readiness_index (§1.3), recomputed at open and re-frozen at close.
        default: 0.00
      - name: vote_count
        type: integer
        source: computed
        description: Number of GateVote rows attached to this review.
        default: 0
      - name: conditions
        type: string
        source: input
        description: Condition text supplied at close when the decision is CONDITIONAL_PASS.
        default: null
      - name: conditions_due_at
        type: datetime
        source: input
        description: Deadline for clearing CONDITIONAL_PASS conditions.
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the review was closed.
        default: null

  - name: GateVote
    parent: GateReview
    common_fields: false
    fields:
      - name: gate_review_id
        type: string
        source: input
        description: "FK -> GateReview.id; review this vote belongs to."
      - name: function
        type: enum
        source: input
        description: Cross-functional seat casting the vote; at most one vote per function per review.
        constraints: R_AND_D | MARKETING | FINANCE | OPERATIONS | QUALITY | REGULATORY | SALES
      - name: vote
        type: enum
        source: input
        description: Ballot value feeding the decision derivation at close.
        constraints: APPROVE | APPROVE_WITH_CONDITIONS | REJECT
      - name: voter_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the voter; compared against InnovationProject.owner_user_id by the segregation-of-duties check. NOT a foreign key.
      - name: rationale
        type: string
        source: input
        description: Free-text justification.
        default: null

  - name: Deliverable
    parent: InnovationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> InnovationProject.id; owning project."
      - name: gate_id
        type: string
        source: input
        description: "FK -> StageGate.id; gate whose checklist this row belongs to."
      - name: deliverable_type
        type: enum
        source: input
        description: Checklist item type; the six evidence types are auto-approved by their evidence-producing transitions, the four readiness types are submitted and decided by hand.
        constraints: CONSUMER_CONCEPT_TEST | PRELIM_BUSINESS_CASE | FINAL_BUSINESS_CASE | PILOT_SCALE_UP_REPORT | SHELF_LIFE_REPORT | REGULATORY_CLEARANCE | MANUFACTURING_READINESS | DISTRIBUTION_READINESS | MARKETING_LAUNCH_PLAN | SALES_SELL_IN_PLAN
      - name: owner_function
        type: enum
        source: input
        description: Function accountable for the item; auto-created rows take it from the fixed type-to-function map in §1.3 deliverable_completeness_pct.
        constraints: R_AND_D | MARKETING | FINANCE | OPERATIONS | QUALITY | REGULATORY | SALES
      - name: prerequisite_deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id; self-referential prerequisite edge. Must be APPROVED or WAIVED before this row may be submitted; the edge set must stay acyclic."
        default: null
      - name: status
        type: enum
        source: system
        description: Checklist item state (state machine Deliverable).
        default: PENDING
        constraints: PENDING | SUBMITTED | APPROVED | REJECTED | WAIVED | CANCELLED
      - name: due_at
        type: datetime
        source: input
        description: Optional due date (informational).
        default: null
      - name: evidence_url
        type: string
        source: input
        description: Evidence pointer captured at submit; set to the literal "system://auto-approved" for evidence-driven auto-approvals.
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the submitter; the approver must differ from it. NOT a foreign key. Set to null for auto-approved rows.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the FunctionalReviewer that approved or rejected the row. NOT a foreign key.
        default: null
      - name: submission_count
        type: integer
        source: computed
        description: Number of times this row has entered SUBMITTED; proves the REJECTED -> SUBMITTED revision loop ran.
        default: 0

  - name: ConceptTest
    parent: InnovationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> InnovationProject.id; project whose concept was tested."
      - name: test_type
        type: enum
        source: input
        description: Research instrument used.
        constraints: MONADIC | SEQUENTIAL_MONADIC | IN_HOME_USE
      - name: sample_size
        type: integer
        source: input
        description: Respondent count; selects the confidence multiplier tier in concept_score.
        constraints: ">= 1"
      - name: purchase_intent_top2_pct
        type: number
        source: input
        description: Top-two-box purchase intent percent.
        constraints: 0.00..100.00
      - name: uniqueness_pct
        type: number
        source: input
        description: Uniqueness percent.
        constraints: 0.00..100.00
      - name: fielded_at
        type: datetime
        source: input
        description: Date the study was fielded.
      - name: concept_score
        type: number
        source: computed
        description: Output of concept_score (§1.3).
      - name: is_authoritative
        type: boolean
        source: computed
        description: True only for the project's latest ConceptTest (highest fielded_at, created_at ASC tie-break); only the authoritative row feeds gate_readiness_index.
        default: true

  - name: BusinessCase
    parent: InnovationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> InnovationProject.id; project the case belongs to."
      - name: variant_mode
        type: enum
        source: input
        description: Volume-derivation variant selector for forecast_volume_and_revenue.
        constraints: BOTTOM_UP | TOP_DOWN
      - name: case_type
        type: enum
        source: computed
        description: PRELIMINARY for the project's first case, FINAL for every later case; determines which Deliverable type is auto-approved.
        constraints: PRELIMINARY | FINAL
      - name: category_size_units_year
        type: integer
        source: input
        description: Category size in units per year; used only by the TOP_DOWN variant.
        constraints: ">= 0"
      - name: target_share_pct
        type: number
        source: input
        description: Target category share percent; used only by the TOP_DOWN variant.
        constraints: 0.00..100.00
      - name: cogs_per_unit_usd
        type: number
        source: input
        description: Cost of goods per unit.
        constraints: ">= 0.0000, 4 decimals"
      - name: slotting_fees_usd
        type: number
        source: input
        description: One-time slotting fees charged against year-1 cash flow.
        constraints: ">= 0.00"
      - name: capex_usd
        type: number
        source: input
        description: Up-front capital expenditure; the year-0 outflow of the NPV.
        constraints: ">= 0.00"
      - name: discount_rate_pct
        type: number
        source: input
        description: Annual discount rate for the NPV.
        constraints: 0.00..100.00
      - name: status
        type: enum
        source: system
        description: Case state (state machine BusinessCase).
        default: DRAFT
        constraints: DRAFT | COMPUTED | LOCKED | SUPERSEDED
      - name: annual_units
        type: integer
        source: computed
        description: Output of forecast_volume_and_revenue (§1.3), variant-dependent.
        default: 0
      - name: gross_revenue_usd
        type: number
        source: computed
        description: Output of forecast_volume_and_revenue (§1.3), variant-dependent.
        default: 0.00
      - name: avg_list_price_usd
        type: number
        source: computed
        description: Store-count-weighted average list price across the case's ForecastLine rows, 4 decimals.
        default: 0.0000
      - name: trade_spend_rate_pct
        type: number
        source: computed
        description: Tiered trade-spend rate selected by gross_revenue_usd (§1.3 business_case_financials).
        default: 0.00
      - name: trade_spend_usd
        type: number
        source: computed
        description: Output of business_case_financials (§1.3).
        default: 0.00
      - name: net_revenue_usd
        type: number
        source: computed
        description: Output of business_case_financials (§1.3).
        default: 0.00
      - name: cogs_total_usd
        type: number
        source: computed
        description: Output of business_case_financials (§1.3).
        default: 0.00
      - name: gross_margin_usd
        type: number
        source: computed
        description: Output of business_case_financials (§1.3).
        default: 0.00
      - name: gross_margin_pct
        type: number
        source: computed
        description: Output of business_case_financials (§1.3); may be negative.
        default: 0.00
      - name: npv_usd
        type: number
        source: computed
        description: Output of business_case_financials (§1.3); three-year discounted cash flow less capex.
        default: 0.00
      - name: payback_months
        type: integer
        source: computed
        description: Output of business_case_financials (§1.3); the sentinel 999 means never.
        default: 0

  - name: ForecastLine
    parent: BusinessCase
    common_fields: true
    fields:
      - name: business_case_id
        type: string
        source: input
        description: "FK -> BusinessCase.id; case this channel line belongs to."
      - name: channel
        type: enum
        source: input
        description: Retail channel; at most one line per channel per case.
        constraints: GROCERY | MASS | CLUB | CONVENIENCE | ECOMMERCE
      - name: store_count
        type: integer
        source: input
        description: Distribution point count.
        constraints: ">= 0"
      - name: base_velocity_units_per_store_week
        type: number
        source: input
        description: Base weekly units per store.
        constraints: ">= 0.00"
      - name: promo_weeks
        type: integer
        source: input
        description: Promoted weeks per year.
        constraints: 0..52
      - name: promo_lift_pct
        type: number
        source: input
        description: Percent velocity lift during promoted weeks.
        constraints: ">= 0.00"
      - name: list_price_usd
        type: number
        source: input
        description: List price per unit, 4 decimals.
        constraints: ">= 0.0000"
      - name: line_units
        type: integer
        source: computed
        description: Per-line annual units, rounded to the unit before summation (§1.3 forecast_volume_and_revenue).
        default: 0
      - name: line_revenue_usd
        type: number
        source: computed
        description: Per-line annual gross revenue, rounded to the cent before summation (§1.3).
        default: 0.00

  - name: Formulation
    parent: InnovationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> InnovationProject.id; project this formulation belongs to."
      - name: revision
        type: integer
        source: computed
        description: 1-based revision ordinal within the project; a new revision supersedes the previous one.
        default: 1
      - name: spec_summary
        type: string
        source: input
        description: Formula, packaging and process summary.
      - name: allergen_regime
        type: enum
        source: input
        description: Allergen regime; a mismatch against the pilot line doubles the required changeover buffer.
        constraints: NONE | DAIRY | NUT | GLUTEN
      - name: target_shelf_life_days
        type: integer
        source: input
        description: Shelf-life target used by shelf_life_verdict.
        constraints: ">= 1"
      - name: unit_cost_usd
        type: number
        source: input
        description: Estimated unit cost from the process spec, 4 decimals.
        constraints: ">= 0.0000"
      - name: status
        type: enum
        source: system
        description: Formulation state (state machine Formulation).
        default: DRAFT
        constraints: DRAFT | PILOT_PASSED | PILOT_FAILED | SHELF_LIFE_CLEARED | SUPERSEDED
      - name: best_pilot_yield_pct
        type: number
        source: computed
        description: Highest yield percent across this formulation's COMPLETED PilotRun rows; feeds gate_readiness_index.
        default: 0.00

  - name: PilotLine
    parent: null
    common_fields: true
    fields:
      - name: plant_name
        type: string
        source: input
        description: Pilot plant name.
      - name: line_code
        type: string
        source: input
        description: Line identifier, unique across pilot lines.
        constraints: 1..40 chars, unique
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: Base changeover buffer appended to every booked run before the overlap test.
        constraints: 0..1440
      - name: allergen_regime
        type: enum
        source: input
        description: Allergen regime currently set up on the line.
        constraints: NONE | DAIRY | NUT | GLUTEN
      - name: hourly_cost_usd
        type: number
        source: input
        description: Informational hourly line cost.
        constraints: ">= 0.00"

  - name: PilotRun
    parent: Formulation
    common_fields: true
    fields:
      - name: formulation_id
        type: string
        source: input
        description: "FK -> Formulation.id; formulation being scaled up."
      - name: pilot_line_id
        type: string
        source: input
        description: "FK -> PilotLine.id; line booked for the run."
      - name: window_start
        type: datetime
        source: input
        description: Run start; the booked interval is half-open on [window_start, window_end + buffer).
      - name: window_end
        type: datetime
        source: input
        description: Run end; must be strictly after window_start.
      - name: planned_units
        type: integer
        source: input
        description: Planned output units; the yield denominator.
        constraints: ">= 1"
      - name: committed_cost_usd
        type: number
        source: input
        description: Cost committed to the development budget ledger while the run is SCHEDULED, RUNNING or COMPLETED.
        constraints: ">= 0.00"
      - name: effective_buffer_minutes
        type: integer
        source: computed
        description: changeover_buffer_minutes doubled when Formulation.allergen_regime differs from PilotLine.allergen_regime, otherwise unchanged.
        default: 0
      - name: actual_units
        type: integer
        source: input
        description: Measured output units, supplied at completion.
        default: null
      - name: yield_pct
        type: number
        source: computed
        description: round_half_up(actual_units / planned_units * 100, 2); null until completion.
        default: null
      - name: status
        type: enum
        source: system
        description: Run state (state machine PilotRun).
        default: SCHEDULED
        constraints: SCHEDULED | RUNNING | COMPLETED | CANCELLED

  - name: ShelfLifeStudy
    parent: Formulation
    common_fields: true
    fields:
      - name: formulation_id
        type: string
        source: input
        description: "FK -> Formulation.id; formulation under stability test."
      - name: duration_days
        type: integer
        source: input
        description: Planned study duration in days.
        constraints: ">= 1"
      - name: committed_cost_usd
        type: number
        source: input
        description: Cost committed to the development budget ledger while the study is ACTIVE, PASSED or FAILED.
        constraints: ">= 0.00"
      - name: start_at
        type: datetime
        source: input
        description: Study start instant.
      - name: timepoints
        type: array
        source: computed
        description: "Appended list of { day_index, quality_score } observations, kept sorted by day_index ascending."
        default: "[]"
      - name: min_quality_score
        type: number
        source: computed
        description: Lowest quality_score across recorded timepoints; null while the list is empty.
        default: null
      - name: verdict
        type: enum
        source: computed
        description: Output of shelf_life_verdict (§1.3); null until the study is closed.
        default: null
        constraints: PASS | FAIL
      - name: status
        type: enum
        source: system
        description: Study state (state machine ShelfLifeStudy).
        default: ACTIVE
        constraints: ACTIVE | PASSED | FAILED | ABANDONED

  - name: LabelApproval
    parent: InnovationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> InnovationProject.id; project the artwork belongs to."
      - name: formulation_id
        type: string
        source: input
        description: "FK -> Formulation.id; formulation the label describes. Must belong to the same project."
      - name: label_version
        type: string
        source: input
        description: Artwork version label.
      - name: claims
        type: array
        source: input
        description: Marketing claims printed on pack.
        constraints: 1..10 non-empty strings
      - name: status
        type: enum
        source: system
        description: Label state (state machine LabelApproval).
        default: DRAFT
        constraints: DRAFT | IN_REVIEW | APPROVED | CONDITIONAL | REJECTED | INVALIDATED
      - name: unsupported_claims
        type: array
        source: input
        description: Claims the regulatory approver flagged as unsupported; a CONDITIONAL decision requires a non-empty list.
        default: "[]"
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the RegulatoryApprover that decided the label. NOT a foreign key.
        default: null

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Retailer name, unique.
        constraints: 1..80 chars, unique
      - name: channel
        type: enum
        source: input
        description: Channel the retailer trades in; must match a ForecastLine channel for the sell-in referential check.
        constraints: GROCERY | MASS | CLUB | CONVENIENCE | ECOMMERCE
      - name: acv_contribution_pct
        type: number
        source: input
        description: All-commodity-volume contribution added to authorized_acv_pct when a presentation is accepted.
        constraints: 0.00..100.00
      - name: presentation_lead_days
        type: integer
        source: input
        description: Minimum whole days between a presentation and the start of its reset window.
        constraints: ">= 0"

  - name: ShelfResetWindow
    parent: Retailer
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; retailer owning the window."
      - name: category
        type: enum
        source: input
        description: Category the reset window applies to; must match the project's category.
        constraints: BEVERAGE | SNACK | DAIRY | HOUSEHOLD
      - name: window_start
        type: datetime
        source: input
        description: Inclusive window start.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive window end; must be strictly after window_start.
      - name: max_presentations
        type: integer
        source: input
        description: Aggregate slot capacity for the window.
        constraints: ">= 1"
      - name: booked_slot_count
        type: integer
        source: computed
        description: Conserved counter equal to the number of SellInPresentation rows on this window in status PLANNED, PRESENTED, DEFERRED or ACCEPTED.
        default: 0

  - name: SellInPresentation
    parent: InnovationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> InnovationProject.id; project being sold in."
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; retailer receiving the trade presentation."
      - name: shelf_reset_window_id
        type: string
        source: input
        description: "FK -> ShelfResetWindow.id; reset window the presentation targets. Must belong to retailer_id."
      - name: scheduled_at
        type: datetime
        source: input
        description: Presentation instant; must precede window_start by at least Retailer.presentation_lead_days.
      - name: proposed_sku_count
        type: integer
        source: input
        description: SKU count proposed to the retailer.
        constraints: ">= 1"
      - name: accepted_sku_count
        type: integer
        source: input
        description: SKU count the retailer authorized; must not exceed proposed_sku_count.
        default: null
      - name: status
        type: enum
        source: system
        description: Presentation state (state machine SellInPresentation).
        default: PLANNED
        constraints: PLANNED | PRESENTED | ACCEPTED | DEFERRED | REJECTED | WITHDRAWN

  - name: PostLaunchPeriod
    parent: InnovationProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> InnovationProject.id; launched project being tracked."
      - name: period_index
        type: integer
        source: input
        description: 1-based sequential quarter index; must be exactly the project's current period count plus one.
        constraints: ">= 1"
      - name: actual_units
        type: integer
        source: input
        description: Units sold in the period.
        constraints: ">= 0"
      - name: actual_net_revenue_usd
        type: number
        source: input
        description: Net revenue realized in the period.
        constraints: ">= 0.00"
      - name: actual_gross_margin_usd
        type: number
        source: input
        description: Gross margin realized in the period; may be negative.
      - name: attainment_basis
        type: enum
        source: input
        description: Variant selector for post_launch_attainment; picks which stored attainment feeds the decision.
        constraints: CUMULATIVE | TRAILING
      - name: plan_units_per_period
        type: number
        source: computed
        description: Locked FINAL BusinessCase annual_units divided by PERIODS_PER_YEAR, 2 decimals.
        default: 0.00
      - name: attainment_cumulative_pct
        type: number
        source: computed
        description: Cumulative-basis attainment (§1.3 post_launch_attainment); always stored regardless of attainment_basis.
        default: 0.00
      - name: attainment_trailing_pct
        type: number
        source: computed
        description: Trailing-single-period attainment (§1.3 post_launch_attainment); always stored regardless of attainment_basis.
        default: 0.00
      - name: attainment_pct
        type: number
        source: computed
        description: The attainment selected by attainment_basis; the value the decision thresholds are applied to.
        default: 0.00
      - name: decision
        type: enum
        source: computed
        description: CONTINUE, FIX or DISCONTINUE derived from attainment_pct (§1.3).
        constraints: CONTINUE | FIX | DISCONTINUE

# =============================================================================
# Table 2: State Machine Table
# Ten machines; InnovationProject carries two independent machines on one row.
# =============================================================================
state_machines:
  - entity: InnovationProject
    state_field: dev_status
    initial_state: IDEA
    terminal_states: [KILLED, DISCONTINUED]
    transitions:
      - from: IDEA
        to: SCREENED
        trigger: "POST /innovation-projects/{id}/screen"
        actor: GateChair
        preconditions:
          - "dev_status == IDEA"
          - "screening_score >= SCREENING_PASS_FLOOR (60.00)"
          - "a StageGate exists for (project.category, gate_number == 2)"
        side_effects:
          - "screening_score set from screening_score (§1.3); screening_decision set to PASSED"
          - "auto-create one PENDING Deliverable per entry of the gate-2 StageGate.required_deliverable_types, in array order, owner_function taken from DELIVERABLE_OWNER_MAP; skip any (gate_id, deliverable_type) pair that already exists on the project"
          - "next_gate_number stays 2"
      - from: IDEA
        to: KILLED
        trigger: "POST /innovation-projects/{id}/screen"
        actor: GateChair
        preconditions:
          - "dev_status == IDEA"
          - "screening_score < SCREENING_PASS_FLOOR (60.00)"
        side_effects:
          - "screening_score set; screening_decision set to REJECTED"
          - "no deliverable checklist is created"
      - from: SCREENED
        to: PILOT_QUALIFIED
        trigger: "POST /gate-reviews/{id}/close (decision PASSED or CONDITIONAL_PASS, gate.stage_from == SCREENED)"
        actor: GateChair
        preconditions:
          - "review.status == IN_SESSION"
          - "gate.stage_to == PILOT_QUALIFIED"
        side_effects:
          - "next_gate_number set to gate.gate_number + 1"
          - "the project's authoritative BusinessCase moves COMPUTED -> LOCKED"
          - "auto-create the checklist of the StageGate for (category, next_gate_number) when one exists and its stage_from equals the new dev_status; skip existing (gate_id, deliverable_type) pairs"
          - "open_gate_conditions set to true when the decision is CONDITIONAL_PASS"
      - from: PILOT_QUALIFIED
        to: LAUNCH_READY
        trigger: "POST /gate-reviews/{id}/close (decision PASSED or CONDITIONAL_PASS, gate.stage_from == PILOT_QUALIFIED)"
        actor: GateChair
        preconditions:
          - "review.status == IN_SESSION"
          - "gate.stage_to == LAUNCH_READY"
        side_effects:
          - "next_gate_number set to gate.gate_number + 1"
          - "launch_readiness_pct recomputed (§1.3)"
          - "open_gate_conditions set to true when the decision is CONDITIONAL_PASS"
      - from: PILOT_QUALIFIED
        to: SCREENED
        trigger: "POST /gate-reviews/{id}/close (decision RECYCLED, gate.stage_from == PILOT_QUALIFIED)"
        actor: GateChair
        preconditions:
          - "review.status == IN_SESSION"
          - "at least one REJECT vote exists and no REJECT vote came from a veto function"
        side_effects:
          - "dev_status steps back to STAGE_ORDER[index(gate.stage_from) - 1], floored at SCREENED"
          - "next_gate_number set to max(2, gate.gate_number - 1)"
          - "recycle_count incremented"
          - "the gate-2 checklist is re-created for any (gate_id, deliverable_type) pair that no longer exists"
      - from: SCREENED
        to: SCREENED
        trigger: "POST /gate-reviews/{id}/close (decision RECYCLED, gate.stage_from == SCREENED)"
        actor: GateChair
        preconditions:
          - "review.status == IN_SESSION"
          - "at least one REJECT vote exists and no REJECT vote came from a veto function"
        side_effects:
          - "dev_status is floored at SCREENED so the row self-loops"
          - "next_gate_number stays 2; recycle_count incremented"
      - from: SCREENED
        to: KILLED
        trigger: "POST /gate-reviews/{id}/close (decision KILLED)"
        actor: GateChair
        preconditions:
          - "review.status == IN_SESSION"
          - "a REJECT vote came from a function listed in gate.veto_functions"
        side_effects:
          - "project cascade: every Deliverable in PENDING, SUBMITTED or REJECTED moves to CANCELLED; every GateReview in SCHEDULED moves to CANCELLED"
          - "every SellInPresentation in PLANNED, PRESENTED, DEFERRED or ACCEPTED moves to WITHDRAWN, each decrementing ShelfResetWindow.booked_slot_count and (for ACCEPTED) authorized_acv_pct"
          - "commercial_status reset to NOT_STARTED; launch_date and shelf_reset_window_id cleared"
      - from: PILOT_QUALIFIED
        to: KILLED
        trigger: "POST /gate-reviews/{id}/close (decision KILLED)"
        actor: GateChair
        preconditions:
          - "review.status == IN_SESSION"
          - "a REJECT vote came from a function listed in gate.veto_functions"
        side_effects:
          - "same project cascade as SCREENED -> KILLED"
      - from: LAUNCH_READY
        to: LAUNCHED
        trigger: "POST /innovation-projects/{id}/launch"
        actor: GateChair
        preconditions:
          - "dev_status == LAUNCH_READY"
          - "commercial_status == LAUNCH_LOCKED"
          - "launch_readiness_pct == 100.00"
          - "current_utc >= launch_date"
        side_effects:
          - "commercial_status moves LAUNCH_LOCKED -> SHIPPED"
      - from: LAUNCHED
        to: IN_MARKET_FIX
        trigger: "POST /innovation-projects/{id}/post-launch-periods (decision FIX)"
        actor: PortfolioAdmin
        preconditions:
          - "dev_status is LAUNCHED or IN_MARKET_FIX"
          - "attainment_pct >= FIX_FLOOR_PCT (70.00) and < CONTINUE_FLOOR_PCT (90.00)"
        side_effects:
          - "post_launch_decision set to FIX"
      - from: IN_MARKET_FIX
        to: LAUNCHED
        trigger: "POST /innovation-projects/{id}/post-launch-periods (decision CONTINUE)"
        actor: PortfolioAdmin
        preconditions:
          - "dev_status is LAUNCHED or IN_MARKET_FIX"
          - "attainment_pct >= CONTINUE_FLOOR_PCT (90.00)"
        side_effects:
          - "post_launch_decision set to CONTINUE"
      - from: LAUNCHED
        to: DISCONTINUED
        trigger: "POST /innovation-projects/{id}/post-launch-periods (decision DISCONTINUE)"
        actor: PortfolioAdmin
        preconditions:
          - "attainment_pct < FIX_FLOOR_PCT (70.00)"
        side_effects:
          - "post_launch_decision set to DISCONTINUE"
          - "every SellInPresentation in PLANNED, PRESENTED or DEFERRED moves to WITHDRAWN with slot decrements"
      - from: IN_MARKET_FIX
        to: DISCONTINUED
        trigger: "POST /innovation-projects/{id}/post-launch-periods (decision DISCONTINUE)"
        actor: PortfolioAdmin
        preconditions:
          - "attainment_pct < FIX_FLOOR_PCT (70.00)"
        side_effects:
          - "same as LAUNCHED -> DISCONTINUED"

  - entity: InnovationProject
    state_field: commercial_status
    initial_state: NOT_STARTED
    terminal_states: [SHIPPED]
    transitions:
      - from: NOT_STARTED
        to: SELL_IN_SCHEDULED
        trigger: "POST /innovation-projects/{id}/sell-in-presentations"
        actor: SalesAccountManager
        preconditions:
          - "dev_status is PILOT_QUALIFIED, LAUNCH_READY, LAUNCHED or IN_MARKET_FIX"
        side_effects:
          - "ShelfResetWindow.booked_slot_count incremented"
      - from: SELL_IN_REJECTED
        to: SELL_IN_SCHEDULED
        trigger: "POST /innovation-projects/{id}/sell-in-presentations"
        actor: SalesAccountManager
        preconditions:
          - "dev_status is not KILLED or DISCONTINUED"
        side_effects:
          - "ShelfResetWindow.booked_slot_count incremented"
      - from: SELL_IN_SCHEDULED
        to: PRESENTED
        trigger: "POST /sell-in-presentations/{id}/present"
        actor: SalesAccountManager
        preconditions:
          - "presentation.status == PLANNED"
          - "current_utc >= presentation.scheduled_at"
        side_effects:
          - "presentation moves PLANNED -> PRESENTED"
      - from: PRESENTED
        to: AUTHORIZED
        trigger: "POST /sell-in-presentations/{id}/record-outcome (outcome ACCEPTED)"
        actor: SalesAccountManager
        preconditions:
          - "presentation.status == PRESENTED"
          - "accepted_sku_count <= proposed_sku_count"
        side_effects:
          - "authorized_acv_pct increased by Retailer.acv_contribution_pct, capped at 100.00"
      - from: PRESENTED
        to: SELL_IN_SCHEDULED
        trigger: "POST /sell-in-presentations/{id}/record-outcome (outcome DEFERRED)"
        actor: SalesAccountManager
        preconditions:
          - "presentation.status == PRESENTED"
        side_effects:
          - "booked_slot_count unchanged because DEFERRED still occupies a slot"
      - from: PRESENTED
        to: SELL_IN_REJECTED
        trigger: "POST /sell-in-presentations/{id}/record-outcome (outcome REJECTED)"
        actor: SalesAccountManager
        preconditions:
          - "presentation.status == PRESENTED"
          - "no other presentation of this project is in PLANNED, PRESENTED, DEFERRED or ACCEPTED"
        side_effects:
          - "ShelfResetWindow.booked_slot_count decremented"
      - from: AUTHORIZED
        to: LAUNCH_LOCKED
        trigger: "POST /innovation-projects/{id}/launch-lock"
        actor: GateChair
        preconditions:
          - "dev_status == LAUNCH_READY"
          - "launch_readiness_pct == 100.00"
          - "an APPROVED or CONDITIONAL LabelApproval exists on the project's newest non-SUPERSEDED Formulation"
          - "launch_date falls inside [window.window_start, window.window_end]"
          - "launch_date - current_utc >= LOCK_LEAD_DAYS (45) whole days"
        side_effects:
          - "launch_date and shelf_reset_window_id set"
      - from: LOCK_SLIPPED
        to: LAUNCH_LOCKED
        trigger: "POST /innovation-projects/{id}/launch-lock"
        actor: GateChair
        preconditions:
          - "same preconditions as AUTHORIZED -> LAUNCH_LOCKED"
        side_effects:
          - "launch_date and shelf_reset_window_id re-set"
      - from: LAUNCH_LOCKED
        to: LOCK_SLIPPED
        trigger: "POST /innovation-projects/{id}/formulations (cascade through LabelApproval and Deliverable)"
        actor: RnDLead
        preconditions:
          - "commercial_status == LAUNCH_LOCKED"
          - "the superseded formulation carries an APPROVED or CONDITIONAL LabelApproval"
        side_effects:
          - "launch_date and shelf_reset_window_id cleared; launch_readiness_pct recomputed"
      - from: LAUNCH_LOCKED
        to: SHIPPED
        trigger: "POST /innovation-projects/{id}/launch"
        actor: GateChair
        preconditions:
          - "dev_status == LAUNCH_READY"
        side_effects:
          - "dev_status moves LAUNCH_READY -> LAUNCHED in the same request"

  - entity: GateReview
    initial_state: SCHEDULED
    terminal_states: [PASSED, RECYCLED, KILLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /gate-reviews/{id}/open"
        actor: GateChair
        preconditions:
          - "project.dev_status == gate.stage_from"
          - "gate.gate_number == project.next_gate_number"
          - "project.open_gate_conditions == false"
          - "no other GateReview of this project is IN_SESSION"
        side_effects:
          - "deliverable_completeness_pct and readiness_index computed (§1.3)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /gate-reviews/{id}/close (cascade from a KILLED sibling review)"
        actor: GateChair
        preconditions:
          - "project.dev_status moved to KILLED"
        side_effects: []
      - from: IN_SESSION
        to: PASSED
        trigger: "POST /gate-reviews/{id}/close"
        actor: GateChair
        preconditions:
          - "vote_count >= gate.quorum_size"
          - "no REJECT vote and no APPROVE_WITH_CONDITIONS vote"
          - "deliverable_completeness_pct == 100.00"
          - "readiness_index >= gate.readiness_floor_index"
          - "the authoritative BusinessCase clears all three financial hurdles"
        side_effects:
          - "decision PASSED; closed_at and chair_user_id set; completeness and readiness re-frozen"
          - "project dev_status advances to gate.stage_to; authoritative BusinessCase moves to LOCKED"
      - from: IN_SESSION
        to: CONDITIONAL_PASS
        trigger: "POST /gate-reviews/{id}/close"
        actor: GateChair
        preconditions:
          - "vote_count >= gate.quorum_size"
          - "no REJECT vote and at least one APPROVE_WITH_CONDITIONS vote"
          - "the same completeness, readiness and hurdle checks as PASSED"
          - "conditions is a non-empty string and conditions_due_at is strictly after current_utc"
        side_effects:
          - "decision CONDITIONAL_PASS; project.open_gate_conditions set to true"
          - "project dev_status advances to gate.stage_to"
      - from: IN_SESSION
        to: RECYCLED
        trigger: "POST /gate-reviews/{id}/close"
        actor: GateChair
        preconditions:
          - "vote_count >= gate.quorum_size"
          - "at least one REJECT vote, none from a veto function"
        side_effects:
          - "project steps back one stage; recycle_count incremented"
      - from: IN_SESSION
        to: KILLED
        trigger: "POST /gate-reviews/{id}/close"
        actor: GateChair
        preconditions:
          - "vote_count >= gate.quorum_size"
          - "at least one REJECT vote from a function in gate.veto_functions"
        side_effects:
          - "project dev_status moves to KILLED with the full project cascade"
      - from: CONDITIONAL_PASS
        to: PASSED
        trigger: "POST /gate-reviews/{id}/clear-conditions"
        actor: GateChair
        preconditions:
          - "status == CONDITIONAL_PASS"
          - "current_utc <= conditions_due_at"
          - "deliverable_completeness_pct of the gate checklist is 100.00 at clearing time"
        side_effects:
          - "project.open_gate_conditions set to false; decision rewritten to PASSED"
      - from: CONDITIONAL_PASS
        to: RECYCLED
        trigger: "POST /gate-reviews/{id}/expire-conditions"
        actor: PortfolioAdmin
        preconditions:
          - "status == CONDITIONAL_PASS"
          - "current_utc > conditions_due_at"
        side_effects:
          - "project.open_gate_conditions set to false; project steps back one stage; recycle_count incremented"

  - entity: Deliverable
    initial_state: PENDING
    terminal_states: [WAIVED, CANCELLED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /deliverables/{id}/submit"
        actor: InnovationLead
        preconditions:
          - "status is PENDING or REJECTED"
          - "prerequisite_deliverable_id is null, or the prerequisite row is APPROVED or WAIVED"
          - "project.dev_status is not KILLED or DISCONTINUED"
        side_effects:
          - "evidence_url and submitted_by_user_id recorded; submission_count incremented"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /deliverables/{id}/submit"
        actor: InnovationLead
        preconditions:
          - "same as PENDING -> SUBMITTED"
        side_effects:
          - "submission_count incremented; decided_by_user_id cleared"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /deliverables/{id}/decide (decision APPROVE)"
        actor: FunctionalReviewer
        preconditions:
          - "status == SUBMITTED"
          - "acting X-User-ID differs from submitted_by_user_id"
        side_effects:
          - "decided_by_user_id set; project.launch_readiness_pct recomputed when the type is one of the four readiness types"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /deliverables/{id}/decide (decision REJECT)"
        actor: FunctionalReviewer
        preconditions:
          - "status == SUBMITTED"
          - "acting X-User-ID differs from submitted_by_user_id"
        side_effects:
          - "decided_by_user_id set"
      - from: PENDING
        to: APPROVED
        trigger: "evidence-driven auto-approval (see §1.3 DELIVERABLE_EVIDENCE_MAP)"
        actor: RnDLead
        preconditions:
          - "status == PENDING"
          - "the evidence-producing transition succeeded on the same project"
        side_effects:
          - "evidence_url set to the literal system://auto-approved; submitted_by_user_id and decided_by_user_id stay null"
      - from: PENDING
        to: WAIVED
        trigger: "POST /deliverables/{id}/waive"
        actor: GateChair
        preconditions:
          - "status is PENDING, SUBMITTED or REJECTED"
          - "deliverable_type is not REGULATORY_CLEARANCE"
        side_effects:
          - "counts as satisfied for deliverable_completeness_pct but contributes 0 to launch_readiness_pct"
      - from: REJECTED
        to: WAIVED
        trigger: "POST /deliverables/{id}/waive"
        actor: GateChair
        preconditions:
          - "same as PENDING -> WAIVED"
        side_effects: []
      - from: APPROVED
        to: PENDING
        trigger: "POST /innovation-projects/{id}/formulations (cascade: LabelApproval INVALIDATED)"
        actor: RnDLead
        preconditions:
          - "deliverable_type == REGULATORY_CLEARANCE and status == APPROVED"
        side_effects:
          - "evidence_url cleared; APPROVED is therefore not a terminal state"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /gate-reviews/{id}/close (decision KILLED)"
        actor: GateChair
        preconditions:
          - "project moved to KILLED"
        side_effects: []

  - entity: BusinessCase
    initial_state: DRAFT
    terminal_states: [LOCKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /business-cases/{id}/forecast-lines"
        actor: InnovationLead
        preconditions:
          - "status == DRAFT or COMPUTED"
          - "no existing line on this case uses the same channel"
        side_effects:
          - "forecast_volume_and_revenue and business_case_financials recomputed (§1.3)"
          - "the matching PRELIM_BUSINESS_CASE or FINAL_BUSINESS_CASE Deliverable auto-approves once the case reaches COMPUTED"
      - from: COMPUTED
        to: COMPUTED
        trigger: "POST /business-cases/{id}/forecast-lines"
        actor: InnovationLead
        preconditions:
          - "status == COMPUTED"
        side_effects:
          - "all financial fields recomputed from the full line set"
      - from: COMPUTED
        to: LOCKED
        trigger: "POST /gate-reviews/{id}/close (decision PASSED or CONDITIONAL_PASS)"
        actor: GateChair
        preconditions:
          - "this row is the project's authoritative case"
        side_effects:
          - "the case becomes the post-launch plan basis"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /innovation-projects/{id}/business-cases"
        actor: InnovationLead
        preconditions:
          - "a newer case is created on the same project"
        side_effects: []
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "POST /innovation-projects/{id}/business-cases"
        actor: InnovationLead
        preconditions:
          - "a newer case is created on the same project and this row is not LOCKED"
        side_effects: []

  - entity: Formulation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PILOT_PASSED
        trigger: "POST /pilot-runs/{id}/complete"
        actor: RnDLead
        preconditions:
          - "yield_pct >= PILOT_YIELD_FLOOR_PCT (85.00)"
        side_effects:
          - "best_pilot_yield_pct updated; the PILOT_SCALE_UP_REPORT Deliverable auto-approves"
      - from: DRAFT
        to: PILOT_FAILED
        trigger: "POST /pilot-runs/{id}/complete"
        actor: RnDLead
        preconditions:
          - "yield_pct < PILOT_YIELD_FLOOR_PCT (85.00)"
        side_effects:
          - "best_pilot_yield_pct updated; no deliverable is approved"
      - from: PILOT_FAILED
        to: PILOT_PASSED
        trigger: "POST /pilot-runs/{id}/complete"
        actor: RnDLead
        preconditions:
          - "a later run reaches yield_pct >= 85.00"
        side_effects:
          - "PILOT_SCALE_UP_REPORT Deliverable auto-approves"
      - from: PILOT_PASSED
        to: SHELF_LIFE_CLEARED
        trigger: "POST /shelf-life-studies/{id}/timepoints (study closes PASSED)"
        actor: RnDLead
        preconditions:
          - "study.verdict == PASS"
        side_effects:
          - "SHELF_LIFE_REPORT Deliverable auto-approves"
      - from: SHELF_LIFE_CLEARED
        to: SUPERSEDED
        trigger: "POST /innovation-projects/{id}/formulations"
        actor: RnDLead
        preconditions:
          - "a newer revision is created on the same project"
        side_effects:
          - "cascade depth 4: ACTIVE ShelfLifeStudy rows move to ABANDONED with ledger release; APPROVED or CONDITIONAL LabelApproval rows move to INVALIDATED; the REGULATORY_CLEARANCE Deliverable returns to PENDING; commercial_status LAUNCH_LOCKED moves to LOCK_SLIPPED"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /innovation-projects/{id}/formulations"
        actor: RnDLead
        preconditions:
          - "a newer revision is created"
        side_effects:
          - "SCHEDULED or RUNNING PilotRun rows move to CANCELLED with ledger release"

  - entity: PilotRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /pilot-runs/{id}/start"
        actor: RnDLead
        preconditions:
          - "status == SCHEDULED"
          - "current_utc >= window_start"
          - "formulation.status is not SUPERSEDED"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /pilot-runs/{id}/complete"
        actor: RnDLead
        preconditions:
          - "status == RUNNING"
          - "actual_units >= 0"
        side_effects:
          - "yield_pct computed; formulation transitions to PILOT_PASSED or PILOT_FAILED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pilot-runs/{id}/cancel"
        actor: RnDLead
        preconditions:
          - "status is SCHEDULED or RUNNING"
        side_effects:
          - "committed_cost_usd released from InnovationProject.development_budget_committed_usd"
      - from: RUNNING
        to: CANCELLED
        trigger: "POST /pilot-runs/{id}/cancel"
        actor: RnDLead
        preconditions:
          - "status is SCHEDULED or RUNNING"
        side_effects:
          - "committed_cost_usd released from the ledger"

  - entity: ShelfLifeStudy
    initial_state: ACTIVE
    terminal_states: [PASSED, FAILED, ABANDONED]
    transitions:
      - from: ACTIVE
        to: PASSED
        trigger: "POST /shelf-life-studies/{id}/timepoints"
        actor: RnDLead
        preconditions:
          - "day_index >= duration_days"
          - "shelf_life_verdict (§1.3) yields PASS"
        side_effects:
          - "verdict PASS; formulation moves PILOT_PASSED -> SHELF_LIFE_CLEARED; SHELF_LIFE_REPORT auto-approves"
      - from: ACTIVE
        to: FAILED
        trigger: "POST /shelf-life-studies/{id}/timepoints"
        actor: RnDLead
        preconditions:
          - "quality_score < ABSOLUTE_FLOOR (60.00), or day_index >= duration_days with shelf_life_verdict FAIL"
        side_effects:
          - "verdict FAIL; the formulation stays at its current status"
      - from: ACTIVE
        to: ABANDONED
        trigger: "POST /innovation-projects/{id}/formulations (cascade)"
        actor: RnDLead
        preconditions:
          - "the parent formulation is being superseded"
        side_effects:
          - "committed_cost_usd released from the ledger"

  - entity: LabelApproval
    initial_state: DRAFT
    terminal_states: [INVALIDATED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /label-approvals/{id}/submit"
        actor: InnovationLead
        preconditions:
          - "status is DRAFT or REJECTED"
          - "formulation.status is SHELF_LIFE_CLEARED"
        side_effects: []
      - from: REJECTED
        to: IN_REVIEW
        trigger: "POST /label-approvals/{id}/submit"
        actor: InnovationLead
        preconditions:
          - "status is DRAFT or REJECTED"
        side_effects:
          - "unsupported_claims cleared"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /label-approvals/{id}/decide (decision APPROVE)"
        actor: RegulatoryApprover
        preconditions:
          - "status == IN_REVIEW"
        side_effects:
          - "the REGULATORY_CLEARANCE Deliverable auto-approves"
      - from: IN_REVIEW
        to: CONDITIONAL
        trigger: "POST /label-approvals/{id}/decide (decision APPROVE_WITH_CHANGES)"
        actor: RegulatoryApprover
        preconditions:
          - "status == IN_REVIEW"
          - "unsupported_claims is a non-empty array"
        side_effects:
          - "the REGULATORY_CLEARANCE Deliverable auto-approves"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /label-approvals/{id}/decide (decision REJECT)"
        actor: RegulatoryApprover
        preconditions:
          - "status == IN_REVIEW"
        side_effects:
          - "no deliverable approval occurs"
      - from: APPROVED
        to: INVALIDATED
        trigger: "POST /innovation-projects/{id}/formulations (cascade)"
        actor: RnDLead
        preconditions:
          - "the described formulation is being superseded"
        side_effects:
          - "REGULATORY_CLEARANCE Deliverable returns to PENDING; commercial_status may slip"
      - from: CONDITIONAL
        to: INVALIDATED
        trigger: "POST /innovation-projects/{id}/formulations (cascade)"
        actor: RnDLead
        preconditions:
          - "the described formulation is being superseded"
        side_effects:
          - "same as APPROVED -> INVALIDATED"

  - entity: SellInPresentation
    initial_state: PLANNED
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: PLANNED
        to: PRESENTED
        trigger: "POST /sell-in-presentations/{id}/present"
        actor: SalesAccountManager
        preconditions:
          - "status == PLANNED"
          - "current_utc >= scheduled_at"
        side_effects:
          - "project commercial_status moves SELL_IN_SCHEDULED -> PRESENTED"
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /sell-in-presentations/{id}/record-outcome (outcome ACCEPTED)"
        actor: SalesAccountManager
        preconditions:
          - "status == PRESENTED"
          - "accepted_sku_count is present and <= proposed_sku_count"
        side_effects:
          - "project authorized_acv_pct increased; commercial_status moves to AUTHORIZED"
      - from: PRESENTED
        to: DEFERRED
        trigger: "POST /sell-in-presentations/{id}/record-outcome (outcome DEFERRED)"
        actor: SalesAccountManager
        preconditions:
          - "status == PRESENTED"
        side_effects:
          - "the reset-window slot stays booked"
      - from: PRESENTED
        to: REJECTED
        trigger: "POST /sell-in-presentations/{id}/record-outcome (outcome REJECTED)"
        actor: SalesAccountManager
        preconditions:
          - "status == PRESENTED"
        side_effects:
          - "ShelfResetWindow.booked_slot_count decremented"
      - from: PLANNED
        to: WITHDRAWN
        trigger: "POST /sell-in-presentations/{id}/withdraw"
        actor: SalesAccountManager
        preconditions:
          - "status is PLANNED, PRESENTED, DEFERRED or ACCEPTED"
        side_effects:
          - "ShelfResetWindow.booked_slot_count decremented"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /sell-in-presentations/{id}/withdraw"
        actor: SalesAccountManager
        preconditions:
          - "status is PLANNED, PRESENTED, DEFERRED or ACCEPTED"
          - "project.commercial_status is not SHIPPED"
        side_effects:
          - "booked_slot_count decremented and authorized_acv_pct reduced by the retailer's contribution"
      - from: DEFERRED
        to: WITHDRAWN
        trigger: "POST /sell-in-presentations/{id}/withdraw"
        actor: SalesAccountManager
        preconditions:
          - "status is PLANNED, PRESENTED, DEFERRED or ACCEPTED"
        side_effects:
          - "booked_slot_count decremented"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent version is the only sanctioned
# race mechanism in this domain.
# =============================================================================
concurrency_rules:
  - id: business-case-create-stale-project
    parent_entity: InnovationProject
    write_endpoint: "POST /innovation-projects/{id}/business-cases"
    occ_field: expected_project_version
    guarantee: "The write is accepted only when expected_project_version equals the stored InnovationProject.version at validation time. A caller holding a version read before an intervening project write is rejected."
    error_id: ERR_PROJECT_VERSION_CONFLICT
    http_status: 412
    serialization: "InnovationProject.version increments on every accepted write to the project row; ordering fallback, if ever needed, is created_at ascending — never id."
  - id: formulation-create-stale-project
    parent_entity: InnovationProject
    write_endpoint: "POST /innovation-projects/{id}/formulations"
    occ_field: expected_project_version
    guarantee: "Creating a new formulation revision supersedes the previous one and can slip a launch lock, so it is accepted only when expected_project_version matches the stored InnovationProject.version."
    error_id: ERR_PROJECT_VERSION_CONFLICT
    http_status: 412
    serialization: "The cascade runs inside the accepted write; a rejected write leaves the prior formulation, its label approvals and the launch lock untouched."
  - id: shelf-life-study-create-stale-formulation
    parent_entity: Formulation
    write_endpoint: "POST /formulations/{id}/shelf-life-studies"
    occ_field: expected_formulation_version
    guarantee: "A study may only be opened against the formulation revision the caller last read; expected_formulation_version must equal the stored Formulation.version."
    error_id: ERR_FORMULATION_VERSION_CONFLICT
    http_status: 412
    serialization: "Formulation.version increments on every accepted write to the formulation row, including the pilot-run and study cascades."

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_score
    description: Weighted idea-screening score; the weight vector is selected by InnovationProject.project_type and the margin criterion is normalized against a fixed target and capped.
    trigger: "POST /innovation-projects/{id}/screen"
    inputs: [project_type, strategic_fit_score, consumer_need_score, target_gross_margin_pct, category_attractiveness_score]
    algorithm: weighted_scoring
    formula: |
      margin_norm = min(100, round_half_up(target_gross_margin_pct / MARGIN_TARGET_PCT * 100, 4))
      (w_fit, w_need, w_margin, w_cat) = SCREENING_WEIGHTS[project_type]
      screening_score = round_half_up(
          w_fit    * strategic_fit_score          * 10
        + w_need   * consumer_need_score          * 10
        + w_margin * margin_norm
        + w_cat    * category_attractiveness_score * 10, 2)
      screening_decision = PASSED when screening_score >= SCREENING_PASS_FLOOR else REJECTED
    constants:
      MARGIN_TARGET_PCT: 40
      SCREENING_PASS_FLOOR: 60.00
      SCREENING_WEIGHTS:
        NEW_BRAND: [0.30, 0.30, 0.25, 0.15]
        LINE_EXTENSION: [0.30, 0.25, 0.30, 0.15]
        RENOVATION: [0.20, 0.35, 0.25, 0.20]
    precision: "2 decimal places, round_half_up; margin_norm intermediate kept at 4 decimals then capped at 100"
    worked_examples:
      - "NEW_BRAND (7, 8, 32, 6) -> margin_norm 80 -> 21 + 24 + 20 + 9 = 74.00 (PASSED)"
      - "LINE_EXTENSION (8, 7, 36, 7) -> 24 + 17.5 + 27 + 10.5 = 79.00 (PASSED)"
      - "LINE_EXTENSION (6, 6, 24, 6) -> every component 60 -> 60.00 exactly (PASSED at the floor)"
      - "LINE_EXTENSION (6, 6, 23.99, 6) -> 59.9925 -> 59.99 (REJECTED, one cent under)"
      - "identical inputs (8, 7, 36, 7) score 78.00 as NEW_BRAND, 79.00 as LINE_EXTENSION and 77.00 as RENOVATION"
      - "NEW_BRAND (7, 8, 60, 6) -> margin_norm capped from 150 to 100 -> 79.00 instead of 91.50"

  - name: concept_score
    description: Consumer-test score blending purchase intent and uniqueness, scaled by a sample-size confidence multiplier tier.
    trigger: "POST /innovation-projects/{id}/concept-tests"
    inputs: [purchase_intent_top2_pct, uniqueness_pct, sample_size]
    algorithm: threshold
    formula: |
      confidence = 1.00 when sample_size >= 300
                   0.95 when 100 <= sample_size < 300
                   0.85 when sample_size < 100
      concept_score = round_half_up((INTENT_WEIGHT * purchase_intent_top2_pct
                                   + UNIQUE_WEIGHT * uniqueness_pct) * confidence, 2)
    constants:
      INTENT_WEIGHT: 0.60
      UNIQUE_WEIGHT: 0.40
      CONFIDENCE_TIERS: "[<100 -> 0.85, 100..299 -> 0.95, >=300 -> 1.00]"
    precision: "2 decimal places, round_half_up"
    worked_examples:
      - "(62, 48, 400) -> 56.4 * 1.00 = 56.40"
      - "(42, 35, 250) -> 39.2 * 0.95 = 37.24"
      - "(70, 55, 90) -> 64.0 * 0.85 = 54.40"
      - "sample_size 100 uses 0.95 while 99 uses 0.85 (tier boundary)"

  - name: forecast_volume_and_revenue
    description: Annual volume and gross revenue for a business case; the derivation differs by variant_mode and per-line rounding is pinned before summation.
    trigger: "POST /business-cases/{id}/forecast-lines (recomputes the whole case)"
    inputs: [variant_mode, forecast_lines, category_size_units_year, target_share_pct]
    algorithm: aggregation
    formula: |
      per line:
        raw_units    = store_count * base_velocity_units_per_store_week
                       * (WEEKS_PER_YEAR + promo_weeks * promo_lift_pct / 100)
        line_units   = round_half_up(raw_units, 0)                 # rounded BEFORE summation
        line_revenue = round_half_up(line_units * list_price_usd, 2)  # rounded BEFORE summation
      avg_list_price_usd = round_half_up(
          sum(list_price_usd * store_count) / sum(store_count), 4)   # store-count weighted
      BOTTOM_UP:
        annual_units      = sum(line_units)
        gross_revenue_usd = sum(line_revenue)
      TOP_DOWN:
        annual_units      = round_half_up(category_size_units_year * target_share_pct / 100, 0)
        gross_revenue_usd = round_half_up(annual_units * avg_list_price_usd, 2)
      An empty line set leaves annual_units 0, gross_revenue_usd 0.00 and avg_list_price_usd 0.0000.
    constants:
      WEEKS_PER_YEAR: 52
    precision: "units are whole numbers, revenue 2 decimals, prices 4 decimals, all round_half_up"
    variants:
      - name: BOTTOM_UP
        when: "BusinessCase.variant_mode == BOTTOM_UP"
        difference: "Volume is built from the channel lines; category_size_units_year and target_share_pct are ignored entirely."
      - name: TOP_DOWN
        when: "BusinessCase.variant_mode == TOP_DOWN"
        difference: "Volume comes from category size times share; the lines contribute only the store-count-weighted average price."
    worked_examples:
      - "lines [(GROCERY, 4200, 1.75, 6, 45.5, 3.4915), (MASS, 3150, 2.35, 8, 57.5, 3.2875)] -> line_units 402266 and 418982, line_revenue 1404511.74 and 1377403.33"
      - "BOTTOM_UP totals: annual_units 821248, gross_revenue_usd 2781915.07"
      - "rounding order matters: summing the raw units first would give 821247 and rounding the revenue only once would give 2781915.06"
      - "TOP_DOWN over the same lines with category_size 40000000 and share 1.25 -> annual_units 500000, avg_list_price 3.4041, gross_revenue_usd 1702050.00"

  - name: business_case_financials
    description: Trade spend, net revenue, margin, NPV and payback for a business case, evaluated in a pinned order in which the tiered trade rate keys off GROSS revenue.
    trigger: "recomputed with forecast_volume_and_revenue on every forecast-line write"
    inputs: [annual_units, gross_revenue_usd, cogs_per_unit_usd, slotting_fees_usd, capex_usd, discount_rate_pct]
    algorithm: tiered_pricing
    formula: |
      step 1  trade_spend_rate_pct = TRADE_TIERS lookup on gross_revenue_usd
      step 2  trade_spend_usd  = round_half_up(gross_revenue_usd * trade_spend_rate_pct / 100, 2)
      step 3  net_revenue_usd  = round_half_up(gross_revenue_usd - trade_spend_usd - slotting_fees_usd, 2)
      step 4  cogs_total_usd   = round_half_up(annual_units * cogs_per_unit_usd, 2)
      step 5  gross_margin_usd = round_half_up(net_revenue_usd - cogs_total_usd, 2)
      step 6  gross_margin_pct = round_half_up(gross_margin_usd / net_revenue_usd * 100, 2)
                                 (0.00 when net_revenue_usd == 0)
      step 7  cf1 = gross_margin_usd
              cf2 = round_half_up(cf1 * GROWTH_Y2, 2)
              cf3 = round_half_up(cf2 * GROWTH_Y3, 2)
      step 8  d = 1 + discount_rate_pct / 100
              npv_usd = round_half_up( round_half_up(cf1 / d, 2)
                                     + round_half_up(cf2 / (d*d), 2)
                                     + round_half_up(cf3 / (d*d*d), 2)
                                     - capex_usd, 2)
      step 9  walk months 1..36 accumulating round_half_up(cf_of_that_year / 12, 2);
              payback_months = the first month whose cumulative total >= capex_usd,
              otherwise PAYBACK_NEVER
    constants:
      TRADE_TIERS: "[gross < 1000000.00 -> 10.00, 1000000.00 <= gross < 5000000.00 -> 12.00, gross >= 5000000.00 -> 15.00]"
      GROWTH_Y2: 1.15
      GROWTH_Y3: 1.08
      PAYBACK_NEVER: 999
    precision: "2 decimal places, round_half_up at every numbered step; gross_margin_pct may be negative"
    worked_examples:
      - "BOTTOM_UP case (units 821248, gross 2781915.07, cogs_pu 1.0500, slotting 250000, capex 900000, disc 9.00) -> rate 12.00, trade 333829.81, net 2198085.26, cogs 862310.40, gm 1335774.86, gm_pct 60.77, npv 2899498.14, payback 9"
      - "TOP_DOWN case over the same project (units 500000, gross 1702050.00) -> trade 204246.00, net 1247804.00, cogs 525000.00, gm 722804.00, gm_pct 57.93, npv 1155954.60, payback 15"
      - "gross exactly 5000000.00 selects 15.00 (trade 750000.00, net 4000000.00, cogs 2100000.00, gm 1900000.00, gm_pct 47.50, npv 4504388.64, payback 6) while gross 4990000.00 still selects 12.00"
      - "loss case (units 66000, gross 224670.60, cogs_pu 2.4000, slotting 120000, capex 1500000) -> rate 10.00, trade 22467.06, net 82203.54, cogs 158400.00, gm -76196.46, gm_pct -92.69, npv -1716734.36, payback 999"
      - "HOUSEHOLD case (units 153216, gross 880992.00, cogs_pu 3.2000, slotting 50000, capex 300000) -> rate 10.00, trade 88099.20, net 742892.80, cogs 490291.20, gm 252601.60, gm_pct 34.00, npv 418503.80, payback 14"

  - name: deliverable_completeness_pct
    description: Share of a gate's required checklist that is satisfied; an empty checklist is vacuously complete.
    trigger: "POST /gate-reviews/{id}/open and again at close and clear-conditions"
    inputs: [gate.required_deliverable_types, project deliverables for that gate]
    algorithm: aggregation
    formula: |
      required = gate.required_deliverable_types
      if required is empty: return 100.00
      satisfied = count of required types whose Deliverable on (project_id, gate_id)
                  has status APPROVED or WAIVED
      deliverable_completeness_pct = round_half_up(satisfied / len(required) * 100, 2)
      DELIVERABLE_OWNER_MAP fixes owner_function for auto-created rows:
        CONSUMER_CONCEPT_TEST -> MARKETING      PRELIM_BUSINESS_CASE   -> FINANCE
        FINAL_BUSINESS_CASE   -> FINANCE        PILOT_SCALE_UP_REPORT  -> R_AND_D
        SHELF_LIFE_REPORT     -> QUALITY        REGULATORY_CLEARANCE   -> REGULATORY
        MANUFACTURING_READINESS -> OPERATIONS   DISTRIBUTION_READINESS -> OPERATIONS
        MARKETING_LAUNCH_PLAN -> MARKETING      SALES_SELL_IN_PLAN     -> SALES
      DELIVERABLE_EVIDENCE_MAP fixes evidence-driven auto-approval:
        CONSUMER_CONCEPT_TEST  <- a ConceptTest is created
        PRELIM_BUSINESS_CASE   <- a PRELIMINARY BusinessCase reaches COMPUTED
        FINAL_BUSINESS_CASE    <- a FINAL BusinessCase reaches COMPUTED
        PILOT_SCALE_UP_REPORT  <- a PilotRun completes with yield_pct >= 85.00
        SHELF_LIFE_REPORT      <- a ShelfLifeStudy closes PASSED
        REGULATORY_CLEARANCE   <- a LabelApproval reaches APPROVED or CONDITIONAL
    constants:
      EMPTY_CHECKLIST_RESULT: 100.00
    precision: "2 decimal places, round_half_up"
    worked_examples:
      - "6 required types with 6 APPROVED -> 100.00"
      - "6 required types with 4 APPROVED and 1 WAIVED -> 5/6 -> 83.33"
      - "an empty required_deliverable_types array -> 100.00, not 0.00 and not a division error"
      - "a REJECTED or PENDING row counts as unsatisfied even though it exists"

  - name: gate_readiness_index
    description: Composite gate-readiness index nesting four sub-scores under a project_type weight vector and a category adjustment factor, clamped at 100.00.
    trigger: "POST /gate-reviews/{id}/open and re-frozen at close"
    inputs: [project_type, category, deliverable_completeness_pct, authoritative concept_score, authoritative business case, best_pilot_yield_pct]
    algorithm: weighted_scoring
    formula: |
      completeness = deliverable_completeness_pct of this review
      concept      = concept_score of the project's authoritative ConceptTest, else 0.00
      hurdle       = 100.00 when the authoritative BusinessCase clears npv_hurdle_usd,
                     payback_months_max and gross_margin_floor_pct together,
                     50.00 when it clears exactly two of the three,
                     0.00 otherwise (or when no case exists)
      yield        = min(100.00, best_pilot_yield_pct of the newest non-SUPERSEDED Formulation, else 0.00)
      (w_c, w_k, w_h, w_y) = READINESS_WEIGHTS[project_type]
      base = w_c * completeness + w_k * concept + w_h * hurdle + w_y * yield
      readiness_index = min(100.00, round_half_up(base * CATEGORY_FACTOR[category], 2))
    constants:
      READINESS_WEIGHTS:
        NEW_BRAND: [0.35, 0.30, 0.20, 0.15]
        LINE_EXTENSION: [0.30, 0.25, 0.25, 0.20]
        RENOVATION: [0.40, 0.20, 0.20, 0.20]
      CATEGORY_FACTOR:
        BEVERAGE: 1.00
        SNACK: 1.00
        DAIRY: 0.95
        HOUSEHOLD: 1.05
      INDEX_CAP: 100.00
    precision: "2 decimal places, round_half_up applied once after the category factor"
    worked_examples:
      - "NEW_BRAND / BEVERAGE (100, 56.40, 100, 85.00) -> 35 + 16.92 + 20 + 12.75 = 84.67"
      - "NEW_BRAND / BEVERAGE (100, 37.24, 100, 0.00) -> 66.17, which is below a 70.00 floor"
      - "NEW_BRAND / DAIRY with the same sub-scores -> 84.67 * 0.95 = 80.4365 -> 80.44"
      - "LINE_EXTENSION / HOUSEHOLD (100, 0.00, 0.00, 0.00) -> 30 * 1.05 = 31.50"

  - name: shelf_life_verdict
    description: Stability verdict from the recorded timepoint series against a target-day floor and an absolute floor.
    trigger: "POST /shelf-life-studies/{id}/timepoints"
    inputs: [timepoints, duration_days, formulation.target_shelf_life_days]
    algorithm: chronological
    formula: |
      any recorded quality_score < ABSOLUTE_FLOOR closes the study FAILED immediately
      when day_index >= duration_days the study closes:
        target_point = the timepoint with the largest day_index that is
                       <= formulation.target_shelf_life_days
        verdict = PASS when target_point exists
                       and target_point.quality_score >= TARGET_FLOOR
                       and min_quality_score >= ABSOLUTE_FLOOR
                  else FAIL
      timepoints must arrive with strictly increasing day_index
    constants:
      TARGET_FLOOR: 70.00
      ABSOLUTE_FLOOR: 60.00
    precision: "quality scores carry 2 decimals, round_half_up"
    worked_examples:
      - "target 180 days, duration 180, points (30, 92.00), (90, 84.50), (180, 70.00) -> target point is day 180 at exactly the floor -> PASS"
      - "the same series ending (180, 69.99) -> FAIL"
      - "a point (90, 59.99) closes the study FAILED at once without waiting for day 180"

  - name: launch_readiness_pct
    description: Weighted completion of the four commercialization readiness deliverables, renormalized over only the types the project's commercialization gate actually requires.
    trigger: "deliverable approval or waiver, gate close into LAUNCH_READY, and the label-invalidation cascade"
    inputs: [commercialization gate required_deliverable_types, readiness deliverable statuses]
    algorithm: weighted_scoring
    formula: |
      required = the intersection of READINESS_WEIGHTS keys with the
                 required_deliverable_types of the StageGate whose stage_to is LAUNCH_READY
      denominator = sum of READINESS_WEIGHTS over required
      numerator   = sum of READINESS_WEIGHTS over the required types whose
                    Deliverable status is APPROVED (WAIVED contributes nothing)
      launch_readiness_pct = 0.00 when denominator == 0
                             else round_half_up(numerator / denominator * 100, 2)
      blocking_deliverable_types = the required types not APPROVED, in checklist order
      earliest_lockable_date     = current_utc + LOCK_LEAD_DAYS whole days, derived on every
                                   read of GET /innovation-projects/{id}/launch-readiness
                                   and never stored
    constants:
      READINESS_WEIGHTS:
        MANUFACTURING_READINESS: 0.35
        DISTRIBUTION_READINESS: 0.25
        MARKETING_LAUNCH_PLAN: 0.20
        SALES_SELL_IN_PLAN: 0.20
      LOCK_LEAD_DAYS: 45
    precision: "2 decimal places, round_half_up"
    worked_examples:
      - "all four required, only MANUFACTURING_READINESS approved -> 0.35 / 1.00 -> 35.00"
      - "all four required, MANUFACTURING_READINESS and DISTRIBUTION_READINESS approved -> 60.00"
      - "a gate requiring only MANUFACTURING_READINESS and SALES_SELL_IN_PLAN with MANUFACTURING approved -> 0.35 / 0.55 -> 63.6363 -> 63.64"
      - "the same two-type gate with both approved -> 100.00, which is what unlocks launch-lock"

  - name: post_launch_attainment
    description: Post-launch attainment against the locked business case, stored on both bases with the reported basis selecting the value the continue/fix/discontinue thresholds are applied to.
    trigger: "POST /innovation-projects/{id}/post-launch-periods"
    inputs: [locked BusinessCase.annual_units, prior periods, actual_units, attainment_basis]
    algorithm: threshold
    formula: |
      plan_units_per_period      = round_half_up(locked_case.annual_units / PERIODS_PER_YEAR, 2)
      cumulative_actual          = sum of actual_units over periods 1..period_index
      attainment_cumulative_pct  = round_half_up(cumulative_actual
                                     / (plan_units_per_period * period_index) * 100, 2)
      attainment_trailing_pct    = round_half_up(actual_units / plan_units_per_period * 100, 2)
      attainment_pct             = attainment_cumulative_pct when attainment_basis == CUMULATIVE
                                   else attainment_trailing_pct
      decision = CONTINUE    when attainment_pct >= CONTINUE_FLOOR_PCT
                 FIX         when attainment_pct >= FIX_FLOOR_PCT
                 DISCONTINUE otherwise
    constants:
      PERIODS_PER_YEAR: 4
      CONTINUE_FLOOR_PCT: 90.00
      FIX_FLOOR_PCT: 70.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: CUMULATIVE
        when: "PostLaunchPeriod.attainment_basis == CUMULATIVE"
        difference: "Averages every period to date, so a weak quarter is cushioned by earlier strength."
      - name: TRAILING
        when: "PostLaunchPeriod.attainment_basis == TRAILING"
        difference: "Uses the reported period alone, so it reacts immediately and can reach a harsher decision than CUMULATIVE on identical data."
    worked_examples:
      - "annual_units 153216 -> plan_units_per_period 38304.00"
      - "period 1 with 34000 units -> both bases give 88.76 -> FIX (the two variants coincide at period 1)"
      - "period 2 with 26000 units -> cumulative 78.32 -> FIX, trailing 67.88 -> DISCONTINUE on the very same row inputs"

  - name: committed_development_budget
    description: Ledger of development spend committed by pilot runs and stability studies, kept equal to the sum of its live contributors at all times.
    trigger: "pilot-run create/cancel, shelf-life-study create/abandon, and the formulation supersede cascade"
    inputs: [PilotRun.committed_cost_usd, ShelfLifeStudy.committed_cost_usd]
    algorithm: aggregation
    formula: |
      development_budget_committed_usd = round_half_up(
          sum(PilotRun.committed_cost_usd where status in (SCHEDULED, RUNNING, COMPLETED)
              and the run's formulation belongs to this project)
        + sum(ShelfLifeStudy.committed_cost_usd where status in (ACTIVE, PASSED, FAILED)
              and the study's formulation belongs to this project), 2)
      A create is rejected with ERR_DEV_BUDGET_EXCEEDED when the post-write value
      would exceed development_budget_cap_usd; the boundary value itself is allowed.
      CANCELLED runs and ABANDONED studies release their commitment, so the field
      returns to its pre-write value with no drift.
    constants:
      LEDGER_BASIS: "SCHEDULED, RUNNING, COMPLETED runs and ACTIVE, PASSED, FAILED studies"
    precision: "2 decimal places, round_half_up"
    worked_examples:
      - "cap 200000.00, a run at 120000.00 then a study at 80000.00 -> committed 200000.00 exactly, both accepted"
      - "with committed 200000.00 a further run at 0.01 is rejected and the field stays 200000.00"
      - "cancelling the 120000.00 run brings the field back to 80000.00, so the same run cost can be re-committed"

# =============================================================================
# Table 4: Validation Rules Table (evaluated strictly in priority order;
# the first violated rule determines the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-Role headers are present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Runs before anything else, including path existence, so an unauthenticated request against a non-existent id still returns 401."

  - priority: 2
    category: auth
    check: "X-Role is one of the endpoint's authorized roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Role authorization precedes path existence, so a wrong-role request against a non-existent id returns 403, not 404."

  - priority: 3
    category: existence
    check: "every id appearing in the path resolves to a stored row"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
    description: "Resolved outer-to-inner; a nested path with two unknown ids reports the outer resource first."

  - priority: 4
    category: validation
    check: "request body parses, all required fields are present, enums are legal, numbers are in range and datetimes are ISO-8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
    description: "Shape validation runs before any body-borne foreign key is resolved, so a request that both omits a required field and names a non-existent parent returns 400."

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "gate-reviews, deliverables, pilot-runs, label-approvals, sell-in-presentations, launch-lock, set-prerequisite"
    description: "Body foreign keys are resolved left to right in the order the fields are declared in the endpoint's input list."

  - priority: 6
    category: state
    check: "the subject row and its governing parents are in a state that admits the requested transition"
    error_id: "ERR_<ENTITY>_INVALID_STATE"
    http_status: 409
    applies_to: "all transition endpoints"
    description: "State is checked before optimistic concurrency, so a stale version against an already-terminal row reports the state error rather than 412."

  - priority: 7
    category: concurrency
    check: "expected_project_version or expected_formulation_version equals the stored parent version"
    error_id: "ERR_PROJECT_VERSION_CONFLICT | ERR_FORMULATION_VERSION_CONFLICT"
    http_status: 412
    applies_to: "POST /innovation-projects/{id}/business-cases, POST /innovation-projects/{id}/formulations, POST /formulations/{id}/shelf-life-studies"
    description: "Optimistic concurrency runs after state and before every business rule, so a stale version wins over a budget or referential violation in the same request."

  - priority: 8
    category: auth
    check: "segregation of duties: the acting X-User-ID is not disqualified for this act"
    error_id: "ERR_SELF_APPROVAL_FORBIDDEN | ERR_OWNER_CANNOT_VOTE | ERR_CHAIR_CANNOT_VOTE_AND_CLOSE"
    http_status: 403
    applies_to: "POST /deliverables/{id}/decide, POST /gate-reviews/{id}/votes, POST /gate-reviews/{id}/close"
    description: "A deliverable approver may not be its submitter, the project owner may not vote on its own gate, and a chair who voted may not close the review. Runs after state so a decide on a PENDING row reports the state error."

  - priority: 9
    category: business_safety
    check: "gate sequencing: gate.gate_number equals project.next_gate_number"
    error_id: ERR_GATE_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /gate-reviews/{id}/open"
    description: "Prevents skipping a gate; after a RECYCLED decision the project must re-run the earlier gate."

  - priority: 9
    category: business_safety
    check: "no other GateReview of the project is already IN_SESSION"
    error_id: ERR_GATE_REVIEW_ALREADY_IN_SESSION
    http_status: 409
    applies_to: "POST /gate-reviews/{id}/open"
    description: "At most one review may be open per project at a time."

  - priority: 9
    category: business_safety
    check: "project.open_gate_conditions is false"
    error_id: ERR_GATE_CONDITIONS_OPEN
    http_status: 409
    applies_to: "POST /gate-reviews/{id}/open"
    description: "Unresolved CONDITIONAL_PASS conditions block the next gate."

  - priority: 9
    category: business_safety
    check: "vote_count >= gate.quorum_size"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /gate-reviews/{id}/close"
    description: "Checked before the decision is derived, so a single REJECT vote under quorum reports the quorum error rather than killing the project."

  - priority: 9
    category: business_safety
    check: "no other GateVote on this review already carries the same function"
    error_id: ERR_DUPLICATE_FUNCTION_VOTE
    http_status: 409
    applies_to: "POST /gate-reviews/{id}/votes"
    description: "One ballot per cross-functional seat."

  - priority: 9
    category: business_safety
    check: "the prerequisite deliverable is APPROVED or WAIVED"
    error_id: ERR_PREREQUISITE_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /deliverables/{id}/submit"
    description: "Enforces the self-referential prerequisite edge before a checklist item may be submitted."

  - priority: 9
    category: business_safety
    check: "the proposed prerequisite edge does not create a cycle in the project's prerequisite graph"
    error_id: ERR_DELIVERABLE_CYCLE
    http_status: 409
    applies_to: "POST /deliverables/{id}/set-prerequisite, POST /innovation-projects/{id}/deliverables"
    description: "Walks the existing prerequisite chain; a self-edge and any longer loop are both rejected."

  - priority: 9
    category: business_safety
    check: "deliverable_type is not REGULATORY_CLEARANCE"
    error_id: ERR_REGULATORY_WAIVER_FORBIDDEN
    http_status: 409
    applies_to: "POST /deliverables/{id}/waive"
    description: "Regulatory clearance is the one checklist item that can never be waived."

  - priority: 9
    category: business_safety
    check: "no live Deliverable already exists on the same (project_id, gate_id, deliverable_type)"
    error_id: ERR_DUPLICATE_DELIVERABLE_TYPE
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/deliverables"
    description: "Prevents a manual duplicate of an auto-created checklist row."

  - priority: 9
    category: business_safety
    check: "no existing ForecastLine on the case uses the same channel"
    error_id: ERR_DUPLICATE_CHANNEL_LINE
    http_status: 409
    applies_to: "POST /business-cases/{id}/forecast-lines"
    description: "One line per channel per case."

  - priority: 9
    category: business_safety
    check: "uniqueness of (category, gate_number) for stage gates, line_code for pilot lines and name for retailers"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /stage-gates, POST /pilot-lines, POST /retailers"
    description: "Shared uniqueness error for the three configuration roots."

  - priority: 9
    category: business_safety
    check: "the requested pilot window does not overlap an existing booking on the same line"
    error_id: ERR_PILOT_LINE_CONFLICT
    http_status: 409
    applies_to: "POST /formulations/{id}/pilot-runs"
    description: "Pairwise half-open comparison of [window_start, window_end + effective_buffer_minutes) against every SCHEDULED or RUNNING run on the line; the buffer doubles when the formulation and line allergen regimes differ."

  - priority: 9
    category: business_safety
    check: "booked_slot_count of the reset window is below max_presentations"
    error_id: ERR_RESET_WINDOW_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/sell-in-presentations"
    description: "Aggregate capacity over the closed window interval; each individual presentation is legal but the collective count is capped."

  - priority: 10
    category: business_referential
    check: "the reset window belongs to the named retailer"
    error_id: ERR_WINDOW_RETAILER_MISMATCH
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/sell-in-presentations"
    description: "Both rows exist, so this is a relationship violation rather than a 404."

  - priority: 10
    category: business_referential
    check: "the reset window category equals the project category"
    error_id: ERR_WINDOW_CATEGORY_MISMATCH
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/sell-in-presentations, POST /innovation-projects/{id}/launch-lock"
    description: "A beverage project cannot take a household reset slot."

  - priority: 10
    category: business_referential
    check: "the retailer's channel appears as a ForecastLine channel on the project's authoritative business case"
    error_id: ERR_CHANNEL_NOT_FORECAST
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/sell-in-presentations"
    description: "Cross-aggregate check binding the sell-in plan to the forecast."

  - priority: 10
    category: business_referential
    check: "the named formulation belongs to the project in the path"
    error_id: ERR_FORMULATION_PROJECT_MISMATCH
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/label-approvals"
    description: "Both rows exist but belong to different projects."

  - priority: 10
    category: business_referential
    check: "an APPROVED or CONDITIONAL LabelApproval exists on the project's newest non-SUPERSEDED formulation"
    error_id: ERR_LABEL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/launch-lock"
    description: "Regulatory, claims and label approval must precede commercialization."

  - priority: 10
    category: business_referential
    check: "the project's authoritative BusinessCase (newest non-SUPERSEDED, created_at ASC tie-break) is in status LOCKED"
    error_id: ERR_NO_LOCKED_BUSINESS_CASE
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/post-launch-periods"
    description: "Post-launch tracking is measured against the business case locked at the gate."

  - priority: 10
    category: business_referential
    check: "period_index equals the project's existing period count plus one"
    error_id: ERR_PERIOD_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/post-launch-periods"
    description: "Periods must be reported in order with no gaps and no repeats."

  - priority: 11
    category: business_temporal
    check: "scheduled_at precedes window_start by at least Retailer.presentation_lead_days whole days"
    error_id: ERR_PRESENTATION_LEAD_TIME_VIOLATION
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/sell-in-presentations"
    description: "Trade presentation timing rule; the boundary value exactly equal to the lead time is accepted."

  - priority: 11
    category: business_temporal
    check: "launch_date falls inside the closed interval [window_start, window_end]"
    error_id: ERR_LAUNCH_DATE_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/launch-lock"
    description: "The launch must land inside the retailer's shelf reset window; both endpoints are inclusive."

  - priority: 11
    category: business_temporal
    check: "launch_date is at least LOCK_LEAD_DAYS whole days after current_utc"
    error_id: ERR_LOCK_LEAD_TIME_VIOLATION
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/launch-lock"
    description: "Evaluated after the window containment check, so a date that is both outside the window and too soon reports the window error."

  - priority: 11
    category: business_temporal
    check: "current_utc has reached the locked launch_date"
    error_id: ERR_LAUNCH_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /innovation-projects/{id}/launch"
    description: "The launch date lock cannot be pulled forward."

  - priority: 11
    category: business_temporal
    check: "current_utc has reached scheduled_at"
    error_id: ERR_PRESENTATION_NOT_DUE
    http_status: 409
    applies_to: "POST /sell-in-presentations/{id}/present"
    description: "A presentation cannot be recorded before its scheduled instant."

  - priority: 11
    category: business_temporal
    check: "current_utc has reached window_start"
    error_id: ERR_PILOT_RUN_NOT_DUE
    http_status: 409
    applies_to: "POST /pilot-runs/{id}/start"
    description: "A pilot run cannot start before its booked window opens."

  - priority: 11
    category: business_temporal
    check: "day_index is strictly greater than every recorded timepoint day_index"
    error_id: ERR_TIMEPOINT_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /shelf-life-studies/{id}/timepoints"
    description: "Stability observations must arrive chronologically."

  - priority: 11
    category: business_temporal
    check: "current_utc has not passed conditions_due_at"
    error_id: ERR_CONDITIONS_DUE_PASSED
    http_status: 409
    applies_to: "POST /gate-reviews/{id}/clear-conditions"
    description: "Conditions cannot be cleared after their deadline; the deadline instant itself still counts as on time."

  - priority: 11
    category: business_temporal
    check: "current_utc has passed conditions_due_at"
    error_id: ERR_CONDITIONS_NOT_DUE
    http_status: 409
    applies_to: "POST /gate-reviews/{id}/expire-conditions"
    description: "Conditions cannot be expired early."

  - priority: 12
    category: business_constraint
    check: "deliverable_completeness_pct is 100.00 for the gate checklist"
    error_id: ERR_DELIVERABLE_CHECKLIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /gate-reviews/{id}/close (PASSED or CONDITIONAL_PASS branch only), POST /gate-reviews/{id}/clear-conditions"
    description: "Only the passing branches require a complete checklist; a KILLED or RECYCLED close is allowed with an incomplete checklist."

  - priority: 12
    category: business_constraint
    check: "readiness_index >= gate.readiness_floor_index"
    error_id: ERR_GATE_READINESS_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /gate-reviews/{id}/close (passing branches only)"
    description: "Evaluated after the checklist check, so an incomplete checklist masks a low readiness index."

  - priority: 12
    category: business_constraint
    check: "accepted_sku_count does not exceed proposed_sku_count"
    error_id: ERR_ACCEPTED_SKU_EXCEEDS_PROPOSED
    http_status: 422
    applies_to: "POST /sell-in-presentations/{id}/record-outcome"
    description: "Equality is accepted; one more than proposed is rejected."

  - priority: 12
    category: business_constraint
    check: "launch_readiness_pct is exactly 100.00"
    error_id: ERR_LAUNCH_READINESS_INCOMPLETE
    http_status: 422
    applies_to: "POST /innovation-projects/{id}/launch-lock"
    description: "Manufacturing, distribution, marketing and sales readiness must all be approved before the launch date can be locked."

  - priority: 12
    category: business_constraint
    check: "a CONDITIONAL label decision carries a non-empty unsupported_claims array"
    error_id: ERR_UNSUPPORTED_CLAIMS_REQUIRED
    http_status: 422
    applies_to: "POST /label-approvals/{id}/decide"
    description: "Conditional clearance must name the claims that were not supported."

  - priority: 13
    category: business_fiscal
    check: "the post-write committed development budget does not exceed development_budget_cap_usd"
    error_id: ERR_DEV_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /formulations/{id}/pilot-runs, POST /formulations/{id}/shelf-life-studies"
    description: "Lowest priority, so a stale formulation version or a pilot line conflict is reported ahead of the budget overrun."

  - priority: 13
    category: business_fiscal
    check: "the authoritative BusinessCase clears npv_hurdle_usd, payback_months_max and gross_margin_floor_pct"
    error_id: ERR_BUSINESS_CASE_HURDLE_NOT_MET
    http_status: 422
    applies_to: "POST /gate-reviews/{id}/close (passing branches only)"
    description: "The last check on the passing path, evaluated after checklist completeness and the readiness floor."

# =============================================================================
# Table 5: API Endpoint Table
# 69 endpoints: 38 writes, 30 reads and 1 test-driving clock endpoint.
# =============================================================================
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    description: "Sets the logical clock used by every temporal rule. The clock starts at 2026-08-01T00:00:00Z on a fresh system and only ever moves through this endpoint."
    roles: [PortfolioAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["current_utc is replaced for all later requests"]

  - method: POST
    path: /stage-gates
    description: "Registers a gate configuration for one category."
    roles: [PortfolioAdmin]
    code: 201
    input: [gate_number, category, stage_from, stage_to, required_deliverable_types, quorum_size, veto_functions, npv_hurdle_usd, payback_months_max, gross_margin_floor_pct, readiness_floor_index]
    output: StageGate
    side_effects: []

  - method: GET
    path: /stage-gates
    description: "Lists gate configurations, newest first by created_at descending."
    roles: *readers
    code: 200
    input: ["category?", "gate_number?", "limit?", "offset?"]
    output: "StageGate[]"
    side_effects: []

  - method: GET
    path: /stage-gates/{gate_id}
    description: "Reads one gate configuration."
    roles: *readers
    code: 200
    input: []
    output: StageGate
    side_effects: []

  - method: POST
    path: /retailers
    description: "Registers a retail customer."
    roles: [PortfolioAdmin]
    code: 201
