scaffold_corner_design:
  - section: entities
    instances: []
# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3024_restaurant_attached_gift_shop_inventory_cross_merchandising
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs with no
# test_recipe. Sections and claim_type names come from
# references/claim-extraction-guide.md and are not invented here.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: brand_create_returns_every_declared_field_and_starts_open
        claim_type: Creation
        grounds:
          - entities.Brand
          - endpoints.POST_/retail-ops/brands
        distinguishing_aspect: "A brand created with only its identifying fields comes back 201 with fiscal_period_status OPEN, every computed revenue field at 0, and server-stamped id / created_at / updated_at / version 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_brand
              call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-1042", legal_name: "Old Mill Retail Partners LLC", fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { brand_id: $.data.id, brand_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Brand.${brand_id}.brand_code == \"BR-1042\" and Brand.${brand_id}.fiscal_period == \"2026-Q3\""
            - "Brand.${brand_id}.retail_recognition_policy == FINAL_ONLY and Brand.${brand_id}.open_receipt_grace_hours == 24 and Brand.${brand_id}.tip_minimum_minutes == 240 and Brand.${brand_id}.clearance_buffer_hours == 24"
            - "Brand.${brand_id}.food_storage_corridor_units == 40 and Brand.${brand_id}.max_check_total_cents == 50000 and Brand.${brand_id}.transfer_variance_tolerance_bps == 200"
            - "Brand.${brand_id}.fiscal_period_status == OPEN"
            - "Brand.${brand_id}.provisional_retail_revenue_cents == 0 and Brand.${brand_id}.recognized_retail_revenue_cents == 0 and Brand.${brand_id}.brand_retail_sales_per_guest_cents == 0"
            - "Brand.${brand_id}.version == 1 and created_at and updated_at are both non-null with three fractional digits"

      - name: location_create_applies_region_tier_and_zeroed_posture
        claim_type: Creation
        grounds:
          - entities.Location
          - endpoints.POST_/retail-ops/locations
          - entities.Brand.fields.food_storage_corridor_units
        distinguishing_aspect: "A location's staging_free_units is derived at creation from its own capacity minus the brand's food-storage corridor, and every active counter starts at zero."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Brand BR-1042 exists."
          setup_api_calls:
            - *c_clock
            - *c_brand
          trigger:
            - &c_loc
              call: "POST /retail-ops/locations"
              payload: { brand_id: "${brand_id}", store_number: "1042", region_code: "SOUTHEAST", assortment_tier: "REGIONAL_TWEAK", backroom_capacity_units: 400, clearance_max_active: 3, local_event_codes: ["SUMMER_BOAT"] }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          assert:
            - "Location.${loc_id}.region_code == SOUTHEAST and Location.${loc_id}.assortment_tier == REGIONAL_TWEAK"
            - "Location.${loc_id}.backroom_capacity_units == 400 and Location.${loc_id}.clearance_max_active == 3"
            - "Location.${loc_id}.local_event_codes == [\"SUMMER_BOAT\"]"
            - "Location.${loc_id}.staging_free_units == 360 — 400 minus the brand's 40-unit food-storage corridor"
            - "Location.${loc_id}.backroom_occupancy_units == 0 and Location.${loc_id}.backroom_committed_units == 0 and Location.${loc_id}.active_clearance_count == 0"
            - "Location.${loc_id}.active_planogram_version_id is null"

      - name: store_day_get_returns_derived_gate_and_traffic_unchanged
        claim_type: Retrieval
        grounds:
          - entities.StoreDay
          - endpoints.GET_/retail-ops/store-days/{id}
        distinguishing_aspect: "Every derived StoreDay field round-trips through GET unchanged, including the null closed_at and the zeroed waiting-area counters."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN at store 1042 and is still QUIET with an OPEN gate."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - &c_day_open
              call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-21T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_id: $.data.id, day_v: $.data.version }
          trigger:
            - call: "GET /retail-ops/store-days/${day_id}"
              payload: {}
              as: RetailLead
          assert:
            - "the response status is 200 and response_type is object"
            - "StoreDay.${day_id}.day_status == OPEN and StoreDay.${day_id}.traffic_state == QUIET and StoreDay.${day_id}.conversion_gate == OPEN"
            - "StoreDay.${day_id}.closed_at is null"
            - "StoreDay.${day_id}.restaurant_guest_count == 0 and StoreDay.${day_id}.retail_sales_cents == 0 and StoreDay.${day_id}.retail_transaction_count == 0"
            - "StoreDay.${day_id}.waiting_area_shopper_count == 0 and StoreDay.${day_id}.waiting_area_converted_count == 0"
            - "StoreDay.${day_id}.waiting_area_conversion_index_bps == 0 and StoreDay.${day_id}.retail_sales_per_guest_cents == 0"

      - name: receipts_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/retail-ops/receipts
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three receipts on one store day, limit=2&offset=0 returns two rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN with three DRAFT receipts at store 1042."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - &c_item_a
              call: "POST /retail-ops/items"
              payload: { sku: "ITM-BOAT-6400", name: "Hand-Carved Cedar Boat Shelf", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 6400, unit_cost_cents: 2400, import_lead_time_days: 45 }
              as: AssortmentPlanner
              captures: { item_a_id: $.data.id, item_a_v: $.data.version }
            - *c_day_open
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0001", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0002", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CASH" }
              as: RetailLead
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0003", lines: [{ item_id: "${item_a_id}", quantity: 2, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "GIFT_CARD" }
              as: RetailLead
          trigger:
            - call: "GET /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", limit: 2, offset: 0 }
              as: BoutiqueManager
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /retail-ops/receipts?store_day_id=${day_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /retail-ops/receipts?store_day_id=${day_id}&payment_method=GIFT_CARD returns exactly 1 row"
            - "GET /retail-ops/receipts?store_day_id=${day_id} with no limit returns 3 rows with limit defaulting to 10 and offset to 0"
            - "pagination_fields are exactly limit, offset, total_count and has_more on every list response"

      - name: item_get_with_unknown_id_returns_item_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/retail-ops/items/{id}
          - errors[ERR_ITEM_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unallocated item id on a path segment produces the entity-specific 404 ERR_ITEM_NOT_FOUND rather than a generic 404."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. No item has been created."
          setup_api_calls:
            - *c_clock
            - *c_brand
          trigger:
            - call: "GET /retail-ops/items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AssortmentPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "the error_id is ERR_ITEM_NOT_FOUND, not ERR_NOT_FOUND and not ERR_INVALID_REQUEST"
            - "the message field is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present on the error response too"

      - name: store_day_create_missing_business_date_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/retail-ops/store-days
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required business_date field yields 400 ERR_INVALID_REQUEST rather than a 404 or a 409, because a malformed body outranks every business check."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Store 1042 exists."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
          trigger:
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}" }
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and the error_id is ERR_INVALID_REQUEST"
            - "no StoreDay was created: GET /retail-ops/store-days?location_id=${loc_id} returns 0 rows"
            - "the same request with a business_date present returns a 404 ERR_LOCATION_NOT_FOUND when location_id is unallocated, so the 400 above is genuinely the missing-field check and not an ordering artifact"

      - name: item_defaults_apply_when_optional_fields_are_omitted
        claim_type: Defaults
        grounds:
          - entities.Item.fields.nostalgia_flag
          - entities.Item.fields.status
          - entities.Item.fields.current_markdown_pct
          - entities.Item.fields.effective_price_cents
        distinguishing_aspect: "Omitting nostalgia_flag leaves it false, and the item's effective and compounded prices are seeded from unit_retail_cents rather than left at zero."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Brand BR-1042 exists."
          setup_api_calls:
            - *c_clock
            - *c_brand
          trigger:
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-PLATE-1800", name: "Stoneware Pie Plate", theme_code: "NOSTALGIA_CLASSIC", unit_retail_cents: 1800, unit_cost_cents: 600, import_lead_time_days: 30 }
              as: AssortmentPlanner
              captures: { item_id: $.data.id }
          assert:
            - "Item.${item_id}.nostalgia_flag == false"
            - "Item.${item_id}.status == ACTIVE"
            - "Item.${item_id}.current_markdown_pct == 0"
            - "Item.${item_id}.effective_price_cents == 1800 and Item.${item_id}.compounded_price_cents == 1800"
            - "Item.${item_id}.on_hand_units == 0 and Item.${item_id}.clearance_week == 0 and Item.${item_id}.order_deadline_reached == false"

      - name: receipt_computed_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Receipt.fields.provisional_retail_cents
          - entities.Receipt.fields.recognized_retail_cents
          - entities.Receipt.fields.recognition_delta_cents
        distinguishing_aspect: "Client-supplied values for the computed retail revenue fields are discarded and recomputed from the line set, so an attempt to post 1 cent is ignored."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN and ITM-BOAT-6400 exists."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
          trigger:
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0040", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD", provisional_retail_cents: 1, recognized_retail_cents: 1, status: "RECONCILED" }
              as: RetailLead
              captures: { receipt_id: $.data.id }
          assert:
            - "the unknown payload fields are discarded, not honoured: the created receipt does not report 1 cent anywhere"
            - "Receipt.${receipt_id}.status == DRAFT — a client cannot open a receipt already reconciled"
            - "Receipt.${receipt_id}.provisional_retail_cents == 6071 — base block 6400, per-line cleared value round_half_up(6400*0.36) == 2304, and 6400 - round_half_up(2304/7) == 6400 - 329"
            - "Receipt.${receipt_id}.recognized_retail_cents == 5632 — 6400 - round_half_up(2304/3) == 6400 - 768"
            - "Receipt.${receipt_id}.recognition_delta_cents == -439"

      - name: receipt_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Receipt
          - endpoints.POST_/retail-ops/receipts
        distinguishing_aspect: "id, created_at, updated_at and version are server-stamped; a client-supplied id or version is never accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN and ITM-BOAT-6400 exists."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
          trigger:
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0041", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD", id: "11111111-1111-4111-8111-111111111111", version: 99 }
              as: RetailLead
              captures: { receipt_id: $.data.id, receipt_v: $.data.version }
          assert:
            - "Receipt.${receipt_id}.id != \"11111111-1111-4111-8111-111111111111\" — the server minted a fresh id"
            - "the minted id matches the shape of a bare UUID with no type prefix"
            - "Receipt.${receipt_id}.version == 1, not the 99 the client sent"
            - "Receipt.${receipt_id}.created_at and updated_at are both server-stamped and equal at creation"

      - name: planogram_slot_type_constraints_reject_out_of_range_facings
        claim_type: Type Constraints
        grounds:
          - entities.PlanogramSlot.fields.facings
          - entities.PlanogramSlot.fields.slot_position
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_PLANOGRAM_SLOT_CONFLICT]
        distinguishing_aspect: "A facings value below one fails the numeric bound with a 400, while a duplicate slot_position fails the uniqueness constraint with a 409 — two different error classes from the same endpoint."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. A DRAFT planogram version for store 1042 exists with one slot at position 1."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - call: "POST /retail-ops/planogram-versions"
              payload: { location_id: "${loc_id}", assortment_tier: "REGIONAL_TWEAK", effective_date: "2026-10-01T00:00:00Z" }
              as: AssortmentPlanner
              captures: { pog_id: $.data.id }
            - call: "POST /retail-ops/planogram-slots"
              payload: { planogram_version_id: "${pog_id}", item_id: "${item_a_id}", slot_position: 1, facings: 2, min_presentation_units: 1 }
              as: AssortmentPlanner
          trigger:
            - call: "POST /retail-ops/planogram-slots"
              payload: { planogram_version_id: "${pog_id}", item_id: "${item_a_id}", slot_position: 2, facings: 0, min_presentation_units: 1 }
              as: AssortmentPlanner
              captures: { bound_error: $.data.error_id }
            - call: "POST /retail-ops/planogram-slots"
              payload: { planogram_version_id: "${pog_id}", item_id: "${item_a_id}", slot_position: 1, facings: 1, min_presentation_units: 1 }
              as: AssortmentPlanner
              captures: { conflict_error: $.data.error_id }
          assert:
            - "facings 0 returns 400 ERR_INVALID_REQUEST because facings must be at least 1"
            - "the duplicate slot_position 1 returns 409 ERR_PLANOGRAM_SLOT_CONFLICT"
            - "there is exactly one row after the two rejected attempts: GET /retail-ops/planogram-slots?planogram_version_id=${pog_id} returns 1 row"
            - "PlanogramVersion.${pog_id}.slot_count == 1"

      - name: clearance_schedule_end_before_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ClearanceSchedule.fields.start_date
          - entities.ClearanceSchedule.fields.end_date
          - endpoints.POST_/retail-ops/clearance-schedules
        distinguishing_aspect: "A clearance window whose end_date precedes its start_date is a malformed interval and is rejected with a 400 before any overlap arithmetic is attempted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Store 1042 and ITM-BOAT-6400 exist."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
          trigger:
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_a_id}", start_date: "2026-11-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z", expected_item_version: "${item_a_v}" }
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and the error_id is ERR_INVALID_REQUEST"
            - "no schedule was created: GET /retail-ops/clearance-schedules?item_id=${item_a_id} returns 0 rows"
            - "a window with start_date equal to end_date is also rejected, so the interval must have positive length"
            - "the same request with the two dates swapped returns 201 with status DRAFT"

      - name: planogram_version_cannot_be_deleted_once_published
        claim_type: Immutability
        grounds:
          - state_machines.PlanogramVersion.DRAFT_to_PUBLISHED
          - endpoints.DELETE_/retail-ops/planogram-versions/{id}
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A published planogram version is no longer deletable; only a DRAFT version accepts DELETE, and the published one must be superseded and retired instead."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. A DRAFT planogram version exists with six slots and has been published."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - call: "POST /retail-ops/planogram-versions"
              payload: { location_id: "${loc_id}", assortment_tier: "REGIONAL_TWEAK", effective_date: "2026-10-01T00:00:00Z" }
              as: AssortmentPlanner
              captures: { pog_draft_id: $.data.id }
            - call: "POST /retail-ops/planogram-versions/${pog_draft_id}/publish"
              payload: {}
              as: AssortmentPlanner
              captures: { pog_status: $.data.status }
          trigger:
            - call: "DELETE /retail-ops/planogram-versions/${pog_draft_id}"
              payload: {}
              as: AssortmentPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "PlanogramVersion.${pog_draft_id}.status == PUBLISHED after the publish call"
            - "the DELETE returns 409 ERR_INVALID_STATE, not a 204"
            - "GET /retail-ops/planogram-versions/${pog_draft_id} still returns the version, so nothing was soft-deleted either"
            - "a second DRAFT version of the same location does accept DELETE with a 204"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: receipt_reconcile_from_reconciled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Receipt.DRAFT_to_RECONCILED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From RECONCILED there is no trigger that returns the receipt to RECONCILED, so a second reconcile is refused with no side effects."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Receipt R-1042-0001 is RECONCILED at store 1042."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0001", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { receipt_id: $.data.id }
            - call: "POST /retail-ops/receipts/${receipt_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { brand_after_first: $.data.recognized_retail_cents }
          trigger:
            - call: "POST /retail-ops/receipts/${receipt_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { error_id: $.data.error_id }
          assert:
            - "the second reconcile returns 409 ERR_INVALID_STATE"
            - "no side effect fired: Brand.${brand_id}.recognized_retail_revenue_cents is unchanged at 5632"
            - "Receipt.${receipt_id}.version is unchanged by the rejected call"
            - "the only forward trigger from RECONCILED is settle or dispute; a third reconcile is equally refused"

      - name: transfer_reconcile_from_planned_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Transfer.PLANNED_to_IN_TRANSIT
          - state_machines.Transfer.RECEIVED_to_RECONCILED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reconcile has a single source state, RECEIVED; from PLANNED it is refused, so the two intermediate hops cannot be skipped."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Transfer TR-1 is PLANNED with declared_units 40 for ITM-BOAT-6400."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 40, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/transfers/${tr_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { error_id: $.data.error_id }
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 40 }
              as: RetailLead
              captures: { receive_error: $.data.error_id }
          assert:
            - "the reconcile attempt returns 409 ERR_INVALID_STATE"
            - "the receive attempt is also refused with 409 ERR_INVALID_STATE, so neither intermediate hop can be skipped"
            - "Transfer.${tr_id}.status == PLANNED unchanged and Location.${loc_id}.backroom_committed_units == 0 unchanged"
            - "dispatching first makes reconcile reachable once the transfer has been received: the full dispatch, receive, reconcile chain returns RECONCILED with a 200"

      - name: store_day_initial_state_is_open_quiet_and_unclosed
        claim_type: Initial State
        grounds:
          - state_machines.StoreDay.initial_state
          - entities.StoreDay.fields.traffic_state
        distinguishing_aspect: "A freshly opened store day lands on OPEN with traffic QUIET and an OPEN gate, and closed_at stays null until the day is closed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Store 1042 exists."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
          trigger:
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-22T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_id: $.data.id }
          assert:
            - "StoreDay.${day_id}.day_status == OPEN"
            - "StoreDay.${day_id}.traffic_state == QUIET and StoreDay.${day_id}.conversion_gate == OPEN"
            - "StoreDay.${day_id}.closed_at is null"
            - "StoreDay.${day_id}.version == 1, so creation counts as the first version"

      - name: receipt_closed_is_terminal_for_further_writes
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Receipt.SETTLED_to_CLOSED
          - state_machines.Receipt.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal for the Receipt machine: every action endpoint refuses, and no side effect can be triggered from it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Receipt R-1042-0001 is SETTLED and its store day has been closed, bubbling it to CLOSED."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0001", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { receipt_id: $.data.id }
            - call: "POST /retail-ops/receipts/${receipt_id}/reconcile"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/receipts/${receipt_id}/settle"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/store-days/${day_id}/close"
              payload: { expected_store_day_version: "${day_v}" }
              as: BoutiqueManager
              captures: { closed_status: $.data.day_status }
          trigger:
            - call: "POST /retail-ops/receipts/${receipt_id}/dispute"
              payload: {}
              as: BoutiqueManager
              captures: { dispute_error: $.data.error_id }
            - call: "POST /retail-ops/receipts/${receipt_id}/settle"
              payload: {}
              as: RetailLead
              captures: { settle_error: $.data.error_id }
          assert:
            - "StoreDay.${day_id}.day_status == CLOSED and Receipt.${receipt_id}.status == CLOSED"
            - "the dispute attempt returns 409 ERR_INVALID_STATE and the settle attempt returns 409 ERR_INVALID_STATE"
            - "Receipt.${receipt_id}.closed_at is non-null and Receipt.${receipt_id}.version is unchanged by both rejected calls"
            - "PUT on the closed receipt also returns 409 ERR_INVALID_STATE, so the lockdown covers edits as well as actions"

      - name: clearance_activate_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.ClearanceSchedule.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activation is not idempotent: the second call observes ACTIVE and is refused, so the markdown stage cannot be double-advanced by replaying the request."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. ClearanceSchedule CS-1 is ACTIVE at stage S1 on ITM-BOAT-6400."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 5, received_units: 5, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 5 }
              as: RetailLead
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_a_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z", expected_item_version: "${item_a_v}" }
              as: BoutiqueManager
              captures: { cs_id: $.data.id }
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/activate"
              payload: {}
              as: BoutiqueManager
              captures: { price_after_first: $.data.markdown_pct }
          trigger:
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/activate"
              payload: {}
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the second activation returns 409 ERR_INVALID_STATE"
            - "ClearanceSchedule.${cs_id}.stage is still S1 and ClearanceSchedule.${cs_id}.markdown_pct is still 0.25"
            - "Location.${loc_id}.active_clearance_count is still 1, so the counter was not double-incremented"
            - "the same replay of the liquidate endpoint is likewise refused from ACTIVE while stage is S1, with 409 ERR_CLEARANCE_NOT_FINAL"

      - name: planogram_publish_supersedes_the_prior_version_and_freezes_its_slots
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PlanogramVersion.DRAFT_to_PUBLISHED
          - state_machines.PlanogramVersion.PUBLISHED_to_SUPERSEDED
          - endpoints.POST_/retail-ops/planogram-versions/{id}/publish
        distinguishing_aspect: "Publishing a second version moves the location's pointer, flips the new version's slots to APPLIED and freezes the superseded version's slots — three side effects across two entities from one call."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Planogram version POG-1 with six slots is PUBLISHED for store 1042; POG-2 with six slots is DRAFT and takes effect a week later."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - call: "POST /retail-ops/planogram-versions"
              payload: { location_id: "${loc_id}", assortment_tier: "REGIONAL_TWEAK", effective_date: "2026-10-01T00:00:00Z" }
              as: AssortmentPlanner
              captures: { pog1_id: $.data.id }
            - call: "POST /retail-ops/planogram-versions/${pog1_id}/publish"
              payload: {}
              as: AssortmentPlanner
              captures: { pog1_slots: $.data.slot_count }
            - call: "POST /retail-ops/planogram-versions"
              payload: { location_id: "${loc_id}", assortment_tier: "REGIONAL_TWEAK", effective_date: "2026-10-08T00:00:00Z", clone_slots_from_version_id: "${pog1_id}" }
              as: AssortmentPlanner
              captures: { pog2_id: $.data.id, pog2_slot_count: $.data.slot_count }
          trigger:
            - call: "POST /retail-ops/planogram-versions/${pog2_id}/publish"
              payload: {}
              as: AssortmentPlanner
              captures: { pog2_status: $.data.status }
          assert:
            - "the clone produced PlanogramVersion.${pog2_id}.slot_count == 6, the same count as the published version"
            - "PlanogramVersion.${pog2_id}.status == PUBLISHED and published_at is non-null"
            - "PlanogramVersion.${pog1_id}.status == SUPERSEDED and PlanogramVersion.${pog1_id}.superseded_by_version_id == ${pog2_id}"
            - "every slot of POG-1 now reports status FROZEN: GET /retail-ops/planogram-slots?planogram_version_id=${pog1_id}&status=FROZEN returns 6 rows"
            - "Location.${loc_id}.active_planogram_version_id == ${pog2_id}"

      - name: staff_shift_complete_requires_an_in_progress_shift
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.StaffShift.IN_PROGRESS_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completion requires the shift to already be IN_PROGRESS; a SCHEDULED shift cannot be completed directly, so the start hop cannot be skipped."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T09:00:00Z. StaffShift SH-X is SCHEDULED for 09:00Z to 13:00Z on CASHIER."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-201", start_utc: "2026-09-21T09:00:00Z", end_utc: "2026-09-21T13:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/staff-shifts/${shift_id}/complete"
              payload: {}
              as: BoutiqueManager
              captures: { error_id: $.data.error_id }
            - call: "POST /retail-ops/staff-shifts/${shift_id}/start"
              payload: {}
              as: BoutiqueManager
              captures: { started_status: $.data.status }
          assert:
            - "the completion of a SCHEDULED shift returns 409 ERR_INVALID_STATE"
            - "StaffShift.${shift_id}.status == SCHEDULED unchanged and tip_eligible still false"
            - "the start call then succeeds with 200 and StaffShift.${shift_id}.status == IN_PROGRESS"
            - "completing after the start succeeds and reports tip_eligible true, because 09:00Z to 13:00Z is exactly 240 minutes"

      - name: transfer_void_receiving_requires_the_received_state_and_a_tolerance_breach
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Transfer.RECEIVED_to_VOID_RECEIVING
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TRANSFER_VARIANCE_EXCEEDED]
        distinguishing_aspect: "The void is guarded by two independent preconditions — the RECEIVED state and a variance above tolerance — so passing only one still fails, and the failure uses a different error id in each case."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Transfer TR-OK has been received cleanly with declared 40 and received 40; Transfer TR-BAD has been received with declared 40 and received 30."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 40, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_ok_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_ok_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_ok_id}/receive"
              payload: { received_units: 40 }
              as: RetailLead
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_a_id}", declared_units: 40, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_bad_id: $.data.id, tr_bad_v: $.data.version }
            - call: "POST /retail-ops/transfers/${tr_bad_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_bad_id}/receive"
              payload: { received_units: 30 }
              as: RetailLead
              captures: { bad_variance_bps: $.data.variance_bps }
          trigger:
            - call: "POST /retail-ops/transfers/${tr_ok_id}/void-receiving"
              payload: {}
              as: BoutiqueManager
              captures: { tolerance_error: $.data.error_id }
            - call: "POST /retail-ops/transfers/${tr_bad_id}/void-receiving"
              payload: {}
              as: BoutiqueManager
              captures: { void_status: $.data.status }
          assert:
            - "the clean transfer's void returns 422 ERR_TRANSFER_VARIANCE_EXCEEDED because its variance is 0 basis points, below the 200 tolerance"
            - "Transfer.${tr_ok_id}.status == RECEIVED unchanged after the rejected void"
            - "the bad transfer's variance is 2500 basis points, so its void succeeds and Transfer.${tr_bad_id}.status == VOID_RECEIVING"
            - "critically, the state row is priority 7 and the variance row is priority 27, so a void attempted on a still-PLANNED transfer reports ERR_INVALID_STATE rather than ERR_TRANSFER_VARIANCE_EXCEEDED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: service_fee_marginal_bands_at_the_exact_tier_boundary
        claim_type: tiered_pricing
        grounds:
          - calculations.compute_service_fee
          - calculations.combined_check_total
          - entities.GuestCheck.fields.service_fee_cents
        distinguishing_aspect: "At a fee basis of exactly 12000 the fourth band contributes nothing beyond rounding, so the marginal sum is 1486 and a per-band ceil applied to a 12000 basis still gives 1486 — a check one cent below the boundary gives 1486.8 rounded to 1487 and one cent above also 1487."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. A PENDING guest check exists with restaurant_subtotal_cents 10800 and tip_cents 1200, so the fee basis is 10800 and the check total is 12000."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_day_open
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-311", start_utc: "2026-09-21T09:00:00Z", end_utc: "2026-09-21T13:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_id: $.data.id }
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "5", restaurant_guest_count: 4, restaurant_subtotal_cents: 10800, presented_shift_id: "${shift_id}" }
              as: Server
              as_user_id: "${shift_id}"
              captures: { check_id: $.data.id }
            - call: "POST /retail-ops/guest-checks/${check_id}/tips"
              payload: { tip_cents: 1200 }
              as: Cashier
              as_user_id: "${shift_id}"
          trigger:
            - call: "POST /retail-ops/guest-checks/${check_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "${shift_id}"
              captures: { fee: $.data.service_fee_cents, total: $.data.total_cents }
          assert:
            - "the provisional total used for tier selection is 10800 + 0 + 1200 == 12000, which sits exactly on the fourth band's lower edge and selects the 0.20 tier"
            - "GuestCheck.${check_id}.service_fee_cents == 1104 — the marginal sum is round_half_up(4000*0.00) + round_half_up(4000*0.15) + round_half_up(2800*0.18) == 0 + 600 + 504"
            - "GuestCheck.${check_id}.total_cents == 13104"
            - "the tier walk is inclusive at 12000: the provisional total 10800 + 0 + 1200 == 12000 selects the 0.20 band rather than 0.18, while one cent less selects 0.18 — under marginal allocation the band position does not move the fee, only the basis does"

      - name: service_fee_basis_excludes_the_tip
        claim_type: Input Set Filtering
        grounds:
          - calculations.compute_service_fee
          - entities.GuestCheck.fields.tip_cents
        distinguishing_aspect: "The tip is counted when the tier is selected but excluded from the basis the fee percent multiplies, so two checks on the same tier with different tips get the same fee."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Two PENDING checks with restaurant_subtotal_cents 9000 each; the first carries a 0 tip and the second a 4000 tip, putting only the second above the 12000 boundary."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_day_open
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-312", start_utc: "2026-09-21T09:00:00Z", end_utc: "2026-09-21T13:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_id: $.data.id }
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "6", restaurant_guest_count: 3, restaurant_subtotal_cents: 9000, presented_shift_id: "${shift_id}" }
              as: Server
              as_user_id: "${shift_id}"
              captures: { check_a_id: $.data.id }
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "7", restaurant_guest_count: 3, restaurant_subtotal_cents: 9000, presented_shift_id: "${shift_id}" }
              as: Server
              as_user_id: "${shift_id}"
              captures: { check_b_id: $.data.id }
            - call: "POST /retail-ops/guest-checks/${check_b_id}/tips"
              payload: { tip_cents: 4000 }
              as: Cashier
              as_user_id: "${shift_id}"
          trigger:
            - call: "POST /retail-ops/guest-checks/${check_a_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "${shift_id}"
              captures: { fee_a: $.data.service_fee_cents, total_a: $.data.total_cents }
            - call: "POST /retail-ops/guest-checks/${check_b_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "${shift_id}"
              captures: { fee_b: $.data.service_fee_cents, total_b: $.data.total_cents }
          assert:
            - "check A selects the 0.18 band on a 9000 provisional total and pays round_half_up(4000*0.00) + round_half_up(4000*0.15) + round_half_up(1000*0.18) == 0 + 600 + 180 == 780"
            - "check B selects the 0.20 band on a 13000 provisional total and pays 780 as well, because the tip moved only the tier position and never the basis"
            - "GuestCheck.${check_a_id}.service_fee_cents == 780 and GuestCheck.${check_b_id}.service_fee_cents == 780"
            - "an implementation that multiplies the selected tier percent by the tip-inclusive total reports 1170 and 2060, so that reading diverges by 390 and 1280"
            - "GuestCheck.${check_a_id}.total_cents == 9780 and GuestCheck.${check_b_id}.total_cents == 13780"

      - name: liquidation_waterfall_allocates_across_three_buckets
        claim_type: waterfall_allocation
        grounds:
          - calculations.liquidation_tier_price
          - entities.ClearanceSchedule.fields.liquidation_bucket_units
          - entities.ClearanceSchedule.fields.liquidation_blended_cents
        distinguishing_aspect: "Five remaining units fill 40, 30 and 30 percent buckets in ascending order, giving bucket units [2, 1, 1] with the residual spilling into the last bucket at the last tier's rate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. ClearanceSchedule CS-1 covers ITM-DECOR-2400, is ACTIVE, has 5 remaining units, and has walked five full weeks of cadence so its stage is S4."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-DECOR-2400", name: "Harvest Wall Plaque", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 2400, unit_cost_cents: 900, import_lead_time_days: 40 }
              as: AssortmentPlanner
              captures: { item_id: $.data.id, item_v: $.data.version }
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_id}", declared_units: 5, received_units: 5, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 5 }
              as: RetailLead
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z", expected_item_version: "${item_v}" }
              as: BoutiqueManager
              captures: { cs_id: $.data.id }
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/activate"
              payload: {}
              as: BoutiqueManager
            - call: "POST /retail-ops/transfers/${tr_id}/advance"
              payload: { from_iso8601: "2026-10-01T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_version_after_advance: $.data.version }
          trigger:
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/liquidate"
              payload: {}
              as: BoutiqueManager
              captures: { buckets: $.data.liquidation_bucket_units, blended: $.data.liquidation_blended_cents, liquidated: $.data.liquidated_units }
          assert:
            - "five completed weeks of cadence take the schedule to stage S4 with ClearanceSchedule.${cs_id}.stage == S4"
            - "ClearanceSchedule.${cs_id}.liquidation_bucket_units == [2, 1, 2] — floor(5*0.40) == 2 and floor(5*0.30) == 1, leaving an unfilled residual of 2 units that spills into the last tier"
            - "unit_value is min(900, 2400) == 900, so bucket prices are round_half_up(900*0.90) == 810, round_half_up(900*0.70) == 630 and round_half_up(900*0.55) == 495"
            - "ClearanceSchedule.${cs_id}.liquidation_blended_cents == 648 — (2*810 + 1*630 + 2*495) / 5 == 3240 / 5"
            - "an implementation that prices every unit at the first bucket rate reports 810 blended, so the waterfall makes a 162-cent difference here"
            - "ClearanceSchedule.${cs_id}.liquidation_price_cents == 810 and ClearanceSchedule.${cs_id}.liquidated_units == 5"
            - "Item.${item_id}.on_hand_units == 0 and Item.${item_id}.status == DISCONTINUED"

      - name: liquidation_waterfall_skips_the_third_bucket_at_three_units
        claim_type: waterfall_allocation
        grounds:
          - calculations.liquidation_tier_price
          - entities.ClearanceSchedule.fields.liquidation_bucket_units
        distinguishing_aspect: "At three remaining units the waterfall degenerates: floor(3*0.40) is 1 and floor(3*0.30) is 0, so the whole residual two units fall into the last tier rather than forming a third bucket."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. ClearanceSchedule CS-2 covers ITM-DECOR-1300, is ACTIVE, has 3 remaining units, and has walked five full weeks of cadence so its stage is S4."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-DECOR-1300", name: "Porch Sign", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 1300, unit_cost_cents: 500, import_lead_time_days: 40 }
              as: AssortmentPlanner
              captures: { item_id: $.data.id, item_v: $.data.version }
            - *c_day_open
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_id}", declared_units: 3, received_units: 3, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
