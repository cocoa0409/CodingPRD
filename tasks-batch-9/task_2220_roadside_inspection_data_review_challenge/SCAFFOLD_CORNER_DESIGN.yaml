              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070404", inspection_state: "OH", inspection_level: 1, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00404", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_vm4_id}", unit_type: "VEHICLE", out_of_service: true }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/validate"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "POST /inspection-reports/${r1_id}/score"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
            - call: "POST /data-challenges"
              payload: { report_id: "${r1_id}", challenge_type: "VIOLATION_NOT_SUPPORTED", narrative: "Brake measurement was never recorded.", target_violation_id: "${v1_id}" }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
