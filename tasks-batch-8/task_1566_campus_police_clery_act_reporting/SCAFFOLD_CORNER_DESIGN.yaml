            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-11T09:00:00Z", occurred_at: "2026-04-11T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
