        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_temporal_on_late_revision_filing
          rationale: "state-before-temporal precedence asserted in the §1.8 instance."

