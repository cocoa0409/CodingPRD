            - "selected_nurse_id == ${n_free_id}"
            - "the auto-staff returns HTTP 201 with ShiftAssignment.${asg_id}.nurse_id == ${n_free_id} and match_score_at_assignment == 60, even though ${n_busy_id} is the older row"
            - "GET /pdn/nurses/${n_busy_id} still shows scheduled_minutes_this_week == 120 and ${n_free_id} shows 480 after the new assignment"

  - section: consistency_model
    instances:
      - name: the_hold_response_already_carries_every_recomputed_figure
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /pdn/cases/{id}/hold]
          - calculations.case_fill_metrics
        distinguishing_aspect: >-
          The three-hop hold cascade is visible inside the hold call's own response body: the returned
          Case already reports unfilled_shift_count 0 and fill_rate 1.0000, and a follow-up read adds
          nothing new.
        test_recipe:
          setup:
            - "An ACTIVE case with one ASSIGNED and one OPEN future shift in ISO week 32."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/payers"
              payload: { name: "Sunrise MCO", plan_type: "MEDICAID_MCO", weekly_hour_cap: 84 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
            - call: "POST /pdn/patients"
              payload: { payer_id: "${payer_id}", full_name: "Mia Reyes", date_of_birth: "2019-04-12", primary_diagnosis: "Chronic respiratory failure", requires_trach: true, requires_vent: true }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { patient_id: $.data.id }
            - call: "POST /pdn/plans-of-care"
              payload: { patient_id: "${patient_id}", requested_hours_per_week: 56, start_date: "2026-08-03", end_date: "2026-11-01", ordering_physician_npi: "1234567893" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { poc_id: $.data.id }
            - call: "POST /pdn/plans-of-care/${poc_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { poc_v: $.data.version }
            - call: "POST /pdn/authorizations"
              payload: { plan_of_care_id: "${poc_id}", payer_id: "${payer_id}", approved_hours_per_week: 40, effective_start: "2026-08-03T00:00:00Z", effective_end: "2026-11-01T00:00:00Z", expected_plan_of_care_version: "${poc_v}" }
              as: PayerReviewer
              as_user_id: "${payer_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /pdn/authorizations/${auth_id}/activate"
              payload: {}
              as: PayerReviewer
              as_user_id: "${payer_id}"
            - call: "POST /pdn/nurses"
              payload: { full_name: "Nora Vance", license_type: "RN", license_number: "RN-100001", license_expires_on: "2027-06-30", max_weekly_hours: 48 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { n1_id: $.data.id }
            - call: "POST /pdn/nurses/${n1_id}/competencies"
              payload: { skill: "TRACH", validated_on: "2026-06-01", expires_on: "2027-07-01" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
            - call: "POST /pdn/nurses/${n1_id}/competencies"
              payload: { skill: "VENT", validated_on: "2026-06-01", expires_on: "2027-07-01" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
            - call: "POST /pdn/cases"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", assigned_supervisor_user_id: "sup-001", continuity_nurse_id: "${n1_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_id: $.data.id }
            - call: "POST /pdn/cases/${case_id}/activate"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /pdn/shifts"
              payload: { case_id: "${case_id}", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T16:00:00Z", required_skills: ["TRACH", "VENT"] }
              as: Scheduler
              as_user_id: "sch-001"
              captures: { shift_a_id: $.data.id, shift_a_v: $.data.version }
            - call: "POST /pdn/shift-assignments"
              payload: { shift_id: "${shift_a_id}", nurse_id: "${n1_id}", expected_shift_version: "${shift_a_v}" }
              as: Scheduler
              as_user_id: "sch-001"
              captures: { asg_id: $.data.id }
            - call: "POST /pdn/shifts"
              payload: { case_id: "${case_id}", start_at: "2026-08-07T08:00:00Z", end_at: "2026-08-07T16:00:00Z", required_skills: ["TRACH", "VENT"] }
              as: Scheduler
              as_user_id: "sch-001"
              captures: { shift_b_id: $.data.id }
          trigger:
            - call: "POST /pdn/cases/${case_id}/hold"
              payload: { hold_reason: "FAMILY_REQUEST" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
            - call: "GET /pdn/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /pdn/authorizations/${auth_id}"
              payload: {}
