              as: NetworkAdmin
              captures: { n_id: $.data.id }
            - call: "POST /networks/${n_id}/drug-products"
              payload: { ndc: "00000000051", brand_name: "Vincristol", generic_name: "vincristine-xyz", therapeutic_class: "CYTOTOXIC", unit_type: "VIAL", network_base_price_cents: 5000, is_shortage_candidate: true }
              as: NetworkAdmin
