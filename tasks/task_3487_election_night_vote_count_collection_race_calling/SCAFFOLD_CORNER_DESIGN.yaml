              as_user_id: "${str_s}"
              captures: { err1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-03T13:00:00Z" }
              as: ElectionOpsAdmin
            - call: "POST /assignments/${asg}/status-actions"
              payload: { action: "NO_SHOW" }
              as: StringerCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_OUTSIDE_ASSIGNMENT_WINDOW (check-in before window_start)"
            - "err2 == ERR_OUTSIDE_ASSIGNMENT_WINDOW (NO_SHOW before window_end)"
            - "StringerAssignment.${asg}.status == SCHEDULED"

      - name: release_from_scheduled_returns_invalid_state
        claim_type: Invalid Transition
        grounds:
          - state_machines.StringerAssignment.ACTIVE_to_RELEASED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RELEASE is only declared from ACTIVE; a SCHEDULED assignment rejects it with ERR_INVALID_STATE (the SCHEDULED off-ramp is NO_SHOW)."
        test_recipe:
          setup: ["Clock set; event with Alameda; Sally assigned but never checked in."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_str
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T08:00:00Z", window_end: "2026-11-03T20:00:00Z", stringer_id: "${str_s}" }
              as: StringerCoordinator
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /assignments/${asg}/status-actions"
              payload: { action: "RELEASE" }
              as: StringerCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "StringerAssignment.${asg}.status == SCHEDULED"

      - name: coverage_decline_revise_reapprove_fund_loop
        claim_type: Valid Transition
        grounds:
          - state_machines.CoverageDecision
        distinguishing_aspect: "The cyclic machine walks PROPOSED -> DECLINED -> PROPOSED -> APPROVED -> FUNDED; revise lands back in PROPOSED carrying the updated hours."
        test_recipe:
          setup: ["Clock set; event with contest; decision D1 (40h) proposed."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cst
            - *k_lnk_a
            - call: "POST /election-events/${ev}/coverage-decisions"
              payload: { contest_id: "${cst}", allocated_stringer_hours: 40, coverage_start: "2026-10-30", coverage_end: "2026-11-03" }
              as: CoveragePlanner
              captures: { d1: $.data.id }
            - call: "POST /coverage-decisions/${d1}/review"
              payload: { decision: "DECLINE" }
              as: ElectionOpsAdmin
          trigger:
            - call: "POST /coverage-decisions/${d1}/revise"
              payload: { allocated_stringer_hours: 30 }
              as: CoveragePlanner
            - call: "POST /coverage-decisions/${d1}/review"
              payload: { decision: "APPROVE" }
              as: ElectionOpsAdmin
            - call: "POST /coverage-decisions/${d1}/review"
              payload: { decision: "FUND" }
              as: ElectionOpsAdmin
          assert:
            - "after DECLINE: status was DECLINED"
            - "revise returns it to PROPOSED with allocated_stringer_hours == 30"
            - "final status == FUNDED"

      - name: fund_from_proposed_returns_invalid_state
        claim_type: Invalid Transition
        grounds:
          - state_machines.CoverageDecision.APPROVED_to_FUNDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "FUND is declared only from APPROVED; a PROPOSED decision rejects it with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock set; event with contest; decision proposed, never reviewed."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cst
            - *k_lnk_a
            - call: "POST /election-events/${ev}/coverage-decisions"
              payload: { contest_id: "${cst}", allocated_stringer_hours: 40, coverage_start: "2026-10-30", coverage_end: "2026-11-03" }
              as: CoveragePlanner
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /coverage-decisions/${d1}/review"
              payload: { decision: "FUND" }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "CoverageDecision.${d1}.status == PROPOSED"

