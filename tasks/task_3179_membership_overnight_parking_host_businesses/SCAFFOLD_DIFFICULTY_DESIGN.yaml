# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine Difficulty Rules
# in SKILL.md §0.5. Every grounds: entry resolves to a declared element.
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: capacity_basis_reserved_vs_occupied_on_host
        grounds:
          - calculations.host_committed_sites
          - entities.HostBusiness.fields.committed_sites
          - entities.StayRequest.fields.count_toward_capacity
          - endpoints./api/hosts/{hostId}/capacity_summary
        distinguishing_aspect: |
          host_committed_sites declares two variants on the HostBusiness domain —
          the reserved basis counts CONFIRMED stays plus first-round REQUESTED
          requests while the occupied basis counts only CONFIRMED and CHECKED_IN —
          so one unconsumed request makes the two bases disagree by exactly 1.
        test_recipe:
          setup:
            - "Logical clock at the 2026-09-01T00:00:00Z default"
            - "TX/FARM host approved with 8 active parking sites, base capacity 8, no availability window, posture OPEN"
            - "One ACTIVE member with one self-contained 30-foot vehicle"
            - "One stay request filed at request_depth 0, left in REQUESTED so nothing has been consumed yet"
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Lone Star Farm", category: "FARM", address_line1: "1 Ranch Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_tx: $.data.id, h_tx_v0: $.data.version }
            - call: "POST /api/hosts/${h_tx}/parking-sites"
              payload: { site_label: "S1", site_class: "PULL_THROUGH", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_tx}/parking-sites"
              payload: { site_label: "S2", site_class: "PULL_THROUGH", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_tx}/parking-sites"
              payload: { site_label: "S3", site_class: "PULL_THROUGH", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_tx}/parking-sites"
              payload: { site_label: "S4", site_class: "PULL_THROUGH", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_tx}/parking-sites"
              payload: { site_label: "S5", site_class: "PULL_THROUGH", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_tx}/parking-sites"
              payload: { site_label: "S6", site_class: "PULL_THROUGH", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_tx}/parking-sites"
              payload: { site_label: "S7", site_class: "PULL_THROUGH", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_tx}/parking-sites"
              payload: { site_label: "S8", site_class: "PULL_THROUGH", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_tx}"
              payload: {}
              as: HostOperator
              captures: { h_tx_v1: $.data.version }
            - call: "POST /api/hosts/${h_tx}/decisions"
              payload: { action: "APPROVE", reason: "sites declared", expected_host_version: "${h_tx_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "m1@x.com", full_name: "M One", plan_tier: "PLUS", home_state_code: "TX" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /api/members/${m1}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m1}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m1}"
              captures: { v1: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_tx}", member_id: "${m1}", vehicle_id: "${v1}", arrival_date: "2026-09-10", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "GET /api/hosts/${h_tx}/capacity_summary"
              payload: {}
              as: HostOperator
          assert:
            - "capacity_summary.committed_sites_reserved_basis == 1"
            - "capacity_summary.committed_sites_occupied_basis == 0"
            - "capacity_summary.base_capacity == 8 and capacity_summary.capacity_basis == \"base\""
            - "capacity_summary.free_sites == 7 and capacity_summary.posture == \"OPEN\""

      - name: capacity_basis_base_sites_vs_active_window_override
        grounds:
          - calculations.host_effective_capacity
          - entities.HostAvailabilityWindow.fields.member_capacity_ceiling
          - entities.HostBusiness.fields.effective_capacity
          - state_machines.HostAvailabilityWindow.SCHEDULED_to_ACTIVE
        distinguishing_aspect: |
          host_effective_capacity declares two variants on the HostBusiness domain —
          the base basis counts active HostParkingSite rows while the live basis
          takes window.capacity_override minus window.reserved_sites — so an event
          window with 3 physical sites reports effective_capacity 5.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-10-02T00:00:00Z"
            - "TX/ATTRACTION host approved with 3 active parking sites, base capacity 3"
            - "An EVENT window 2026-10-01 to 2026-10-15 with capacity_override 20 and reserved_sites 15, auto-ACTIVE because the clock is inside it"
            - "One ACTIVE member with a 30-foot vehicle"
            - "Three stay requests filed on disjoint date ranges, all left REQUESTED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Hill Country Attraction", category: "ATTRACTION", address_line1: "2 Ridge Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_at: $.data.id }
            - call: "POST /api/hosts/${h_at}/parking-sites"
              payload: { site_label: "A1", site_class: "PULL_THROUGH", max_vehicle_length_feet: 45, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_at}/parking-sites"
              payload: { site_label: "A2", site_class: "PULL_THROUGH", max_vehicle_length_feet: 45, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_at}/parking-sites"
              payload: { site_label: "A3", site_class: "PULL_THROUGH", max_vehicle_length_feet: 45, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_at}"
              payload: {}
              as: HostOperator
              captures: { h_at_v1: $.data.version }
            - call: "POST /api/hosts/${h_at}/decisions"
              payload: { action: "APPROVE", reason: "sites declared", expected_host_version: "${h_at_v1}" }
              as: PlatformAdmin
            - call: "POST /api/availability-windows"
              payload: { host_id: "${h_at}", kind: "EVENT", label: "Fall Festival", start_date: "2026-10-01", end_date: "2026-10-15", capacity_override: 20, reserved_sites: 15 }
              as: HostOperator
              captures: { w_at: $.data.id }
            - call: "POST /api/members"
              payload: { email: "m2@x.com", full_name: "M Two", plan_tier: "CLASSIC", home_state_code: "TX" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /api/members/${m2}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m2}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m2}"
              captures: { v2: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_at}", member_id: "${m2}", vehicle_id: "${v2}", arrival_date: "2026-10-05", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m2}"
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_at}", member_id: "${m2}", vehicle_id: "${v2}", arrival_date: "2026-10-08", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m2}"
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_at}", member_id: "${m2}", vehicle_id: "${v2}", arrival_date: "2026-10-11", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m2}"
          trigger:
            - call: "GET /api/hosts/${h_at}/capacity_summary"
              payload: {}
              as: HostOperator
          assert:
            - "capacity_summary.capacity_basis == \"live\" and capacity_summary.active_window_id == \"${w_at}\""
            - "capacity_summary.base_capacity == 3 while capacity_summary.effective_capacity == 5"
            - "capacity_summary.active_window_member_ceiling == 5"
            - "capacity_summary.free_sites == 2 and capacity_summary.posture == \"OPEN\""

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: ordinance_cap_and_site_length_state_branch
        grounds:
          - calculations.ordinance_compliance
          - calculations.stay_ancillary_charge
          - validations[priority=6]
          - state_machines.HostBusiness.PENDING_REVIEW_to_APPROVED
        distinguishing_aspect: |
          ordinance_compliance mode (a): a three-way non-linear branch on
          (state_code, category) selects the nightly site cap, and the same
          4-site 45-foot layout is approved in TX/FARM (cap 8) while the
          identical CA/BREWERY layout is refused (cap 3) — the confirm-side
          vehicle-length check only reached in the approved state yields
          ancillary_charge_cents 3690.
        test_recipe:
          setup:
            - "Logical clock at the 2026-09-01T00:00:00Z default"
            - "CA/BREWERY host with 4 active sites each 45 feet long"
            - "TX/FARM host with 4 active sites each 45 feet long"
            - "One ACTIVE PREMIER member, home state CA, with a self-contained CLASS_A vehicle 45 feet long"
            - "The TX host approved; the CA host still PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Bay Brewing", category: "BREWERY", address_line1: "3 Hop St", state_code: "CA", self_contained_required: false }
              as: HostOperator
              captures: { h_cab: $.data.id }
            - call: "POST /api/hosts/${h_cab}/parking-sites"
              payload: { site_label: "B1", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
            - call: "POST /api/hosts/${h_cab}/parking-sites"
              payload: { site_label: "B2", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
            - call: "POST /api/hosts/${h_cab}/parking-sites"
              payload: { site_label: "B3", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
            - call: "POST /api/hosts/${h_cab}/parking-sites"
              payload: { site_label: "B4", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
            - call: "POST /api/hosts"
              payload: { legal_name: "Pecan Farm", category: "FARM", address_line1: "4 Grove Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_txf: $.data.id }
            - call: "POST /api/hosts/${h_txf}/parking-sites"
              payload: { site_label: "F1", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
            - call: "POST /api/hosts/${h_txf}/parking-sites"
              payload: { site_label: "F2", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
            - call: "POST /api/hosts/${h_txf}/parking-sites"
              payload: { site_label: "F3", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
            - call: "POST /api/hosts/${h_txf}/parking-sites"
              payload: { site_label: "F4", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
            - call: "GET /api/hosts/${h_txf}"
              payload: {}
              as: HostOperator
              captures: { h_txf_v1: $.data.version }
            - call: "POST /api/hosts/${h_txf}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_txf_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "m3@x.com", full_name: "M Three", plan_tier: "PREMIER", home_state_code: "CA" }
              as: Anonymous
              captures: { m3: $.data.id }
            - call: "POST /api/members/${m3}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m3}/vehicles"
              payload: { vehicle_class: "CLASS_A", length_feet: 45, self_contained: true, inspection_state_code: "CA" }
              as: Member
              as_user_id: "${m3}"
              captures: { v3: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_txf}", member_id: "${m3}", vehicle_id: "${v3}", arrival_date: "2026-09-12", nights: 3, party_size: 4, electric_request_code: "ELECTRIC_50A", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m3}"
              captures: { r_txf: $.data.id }
            - call: "POST /api/members/${m3}/subscription_actions"
              payload: { action: "SET_GUEST_PASSES", guest_passes_remaining: 2 }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/hosts/${h_cab}"
              payload: {}
              as: HostOperator
              captures: { h_cab_v: $.data.version }
            - call: "POST /api/hosts/${h_cab}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_cab_v}" }
              as: PlatformAdmin
            - call: "GET /api/hosts/${h_txf}"
              payload: {}
              as: HostOperator
              captures: { h_txf_v2: $.data.version }
            - call: "POST /api/stay-requests/${r_txf}/decisions"
              payload: { decision: "CONFIRM", site_id: "F1", expected_host_version: "${h_txf_v2}" }
              as: HostOperator
              as_user_id: "${h_txf}"
              captures: { r_txf_out: $.data.ancillary_charge_cents }
          assert:
            - "the CA/BREWERY approval returns error_id ERR_ORDINANCE_CONSTRAINT with http 422 (4 sites > cap 3) and the host stays PENDING_REVIEW"
            - "StayRequest.${r_txf}.ancillary_charge_cents == 3690"
            - "the TX/FARM request with the byte-identical 4-site 45-foot layout was admitted and this confirmation is 200, proving the branch is selected on (state_code, category) alone"
            - "StayRequest.${r_txf}.request_status == \"CONFIRMED\" and StayRequest.${r_txf}.confirmed_site_id is not null"

      - name: constitutive_charge_rounding_order_inversion
        grounds:
          - calculations.stay_ancillary_charge
          - calculations.late_cancellation_fee
          - entities.StayRequest.fields.ancillary_charge_cents
          - endpoints./api/stay-requests/{requestId}/decisions
        distinguishing_aspect: |
          stay_ancillary_charge mode (b) plus (c): the tier discount is pinned to
          the rounded subtotal rather than applied per night, and the hard cap
          value 25000 is itself an input to late_cancellation_fee, so the
          confirm-then-cancel chain that reaches the cap can only reproduce
          cancellation_fee_cents 7750 if the order is honored.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-06-01T00:00:00Z"
            - "TX/ATTRACTION host approved that ignores state_code alignment, with a 45-foot 50A site labelled H1"
            - "One ACTIVE PREMIER member with a CLASS_A vehicle 45 feet long and 4 standing guest passes"
            - "A 3-night stay request for 9 people requesting ELECTRIC_50A"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Big Bar Jamboree", category: "ATTRACTION", address_line1: "5 Fair Way", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_bb: $.data.id }
            - call: "POST /api/hosts/${h_bb}/parking-sites"
              payload: { site_label: "H1", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
            - call: "GET /api/hosts/${h_bb}"
              payload: {}
              as: HostOperator
              captures: { h_bb_v1: $.data.version }
            - call: "POST /api/hosts/${h_bb}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_bb_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "m4@x.com", full_name: "M Four", plan_tier: "PREMIER", home_state_code: "TX" }
              as: Anonymous
              captures: { m4: $.data.id }
            - call: "POST /api/members/${m4}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m4}/subscription_actions"
              payload: { action: "SET_GUEST_PASSES", guest_passes_remaining: 4 }
              as: PlatformAdmin
            - call: "POST /api/members/${m4}/vehicles"
              payload: { vehicle_class: "CLASS_A", length_feet: 45, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m4}"
              captures: { v4: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_bb}", member_id: "${m4}", vehicle_id: "${v4}", arrival_date: "2026-07-01", nights: 3, party_size: 9, electric_request_code: "ELECTRIC_50A", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m4}"
              captures: { r_bb: $.data.id }
            - call: "GET /api/hosts/${h_bb}"
              payload: {}
              as: HostOperator
              captures: { h_bb_v2: $.data.version }
          trigger:
            - call: "POST /api/stay-requests/${r_bb}/decisions"
              payload: { decision: "CONFIRM", site_id: "H1", expected_host_version: "${h_bb_v2}" }
              as: HostOperator
              as_user_id: "${h_bb}"
              captures: { r_bb_c: $.data.id, r_bb_anc: $.data.ancillary_charge_cents }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/stay-requests/${r_bb}/cancellations"
              payload: {}
              as: Member
              as_user_id: "${m4}"
              captures: { r_bb_fee: $.data.cancellation_fee_cents }
          assert:
            - "StayRequest.${r_bb}.ancillary_charge_cents == 25000"
            - "StayRequest.${r_bb}.cancellation_fee_cents == 7750"
            - "the 3-night rate component is 3600 and the 5 billable guests contribute 2500, giving a subtotal of 6100 and a PREMIER discount of 1220 before the 25000 cap binds"
            - "StayRequest.${r_bb}.request_status == \"CANCELLED\" and StayRequest.${r_bb}.request_depth == 1"

  # ---------------------------------------------------------------------------
  # Rule 3 — non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: stay_request_second_negotiation_round
        grounds:
          - state_machines.StayRequest.DECLINED_to_REQUESTED
          - state_machines.StayRequest.CANCELLED_to_REQUESTED
          - state_machines.StayRequest.REQUESTED_to_DECLINED
          - entities.StayRequest.fields.request_depth
        distinguishing_aspect: |
          StayRequest is cyclic: the DECLINED -> REQUESTED counter edge makes
          REQUESTED -> DECLINED -> REQUESTED -> DECLINED -> REQUESTED a legal
          four-step loop, and request_depth advances on the two DECLINE edges so
          the fifth response is refused with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-06-01T00:00:00Z"
            - "TX/FARM host approved with one 40-foot site labelled S1"
            - "One ACTIVE CLASSIC member with a self-contained 30-foot CLASS_C vehicle"
            - "One stay request on 2026-07-05 for 2 nights, left REQUESTED at request_depth 0"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Round Rock Farm", category: "FARM", address_line1: "6 Loop Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_rr: $.data.id }
            - call: "POST /api/hosts/${h_rr}/parking-sites"
              payload: { site_label: "S1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_rr}"
              payload: {}
              as: HostOperator
              captures: { h_rr_v1: $.data.version }
            - call: "POST /api/hosts/${h_rr}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_rr_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "m5@x.com", full_name: "M Five", plan_tier: "CLASSIC", home_state_code: "TX" }
              as: Anonymous
              captures: { m5: $.data.id }
            - call: "POST /api/members/${m5}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m5}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m5}"
              captures: { v5: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_rr}", member_id: "${m5}", vehicle_id: "${v5}", arrival_date: "2026-07-05", nights: 2, party_size: 2, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m5}"
              captures: { r_rr: $.data.id }
          trigger:
            - call: "GET /api/hosts/${h_rr}"
              payload: {}
              as: HostOperator
              captures: { h_rr_v2: $.data.version }
            - call: "POST /api/stay-requests/${r_rr}/decisions"
              payload: { decision: "DECLINE", expected_host_version: "${h_rr_v2}" }
              as: HostOperator
              as_user_id: "${h_rr}"
