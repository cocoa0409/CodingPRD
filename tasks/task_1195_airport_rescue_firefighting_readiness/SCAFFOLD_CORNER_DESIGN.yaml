# =============================================================================
# Task 1195: ARFF Readiness — §1.9 Scaffold Corner Design (Coverage Index)
# Breadth coverage of every non-§1.8 testable claim in §1.1-§1.7, organized by
# the claim-extraction-guide sections. Recipes replay from empty-DB.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities (claim-extraction-guide §1)
  # ===========================================================================
  - section: entities
    instances:
      - name: ent_profile_create_computed_initial_and_singleton_rejected
        claim_type: creation
        grounds: [entities.AirportOpsProfile, "errors[ERR_PROFILE_ALREADY_EXISTS]"]
        distinguishing_aspect: "Profile creation succeeds once with computed posture fields initialized (required A, supported NONE, effective NONE, NONCOMPLIANT); the second create is rejected as singleton violation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager, captures: { p_req: $.data.required_index_by_aircraft, p_equip: $.data.supported_index_by_equipment, p_staff: $.data.supported_index_by_staffing, p_eff: $.data.effective_index, p_comp: $.data.index_compliance_status } }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDUP", certificated_index: "A" }, as: AirportManager, captures: { err: $.data.error_id } }
          assert:
            - "First create 201: required_index_by_aircraft == \"A\", supported_index_by_equipment == \"NONE\", supported_index_by_staffing == \"NONE\", effective_index == \"NONE\", index_compliance_status == \"NONCOMPLIANT\""
            - "${err} == \"ERR_PROFILE_ALREADY_EXISTS\""

      - name: ent_aircraft_band_edges_and_defaults
        claim_type: defaults
        grounds: [entities.AircraftType.fields.index_band, entities.AircraftType.fields.in_scheduled_service, calculations.index_band_for_aircraft]
        distinguishing_aspect: "Band lower bounds are inclusive (90.0 -> B, 126.0 -> C, 159.0 -> D, 200.0 -> E; 89.9 -> A) and omitted in_scheduled_service defaults to true."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "E" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/aircraft", payload: { model_name: "C172", length_ft: 89.9, avg_daily_departures: 0 }, as: AirportManager, captures: { b_a: $.data.index_band, dflt: $.data.in_scheduled_service } }
            - { call: "POST /arff/aircraft", payload: { model_name: "E190", length_ft: 90.0, avg_daily_departures: 0 }, as: AirportManager, captures: { b_b: $.data.index_band } }
            - { call: "POST /arff/aircraft", payload: { model_name: "A321", length_ft: 126.0, avg_daily_departures: 0 }, as: AirportManager, captures: { b_c: $.data.index_band } }
            - { call: "POST /arff/aircraft", payload: { model_name: "B767", length_ft: 159.0, avg_daily_departures: 0 }, as: AirportManager, captures: { b_d: $.data.index_band } }
            - { call: "POST /arff/aircraft", payload: { model_name: "A380", length_ft: 200.0, avg_daily_departures: 0 }, as: AirportManager, captures: { b_e: $.data.index_band } }
          assert:
            - "${b_a} == \"A\" and ${b_b} == \"B\" and ${b_c} == \"C\" and ${b_d} == \"D\" and ${b_e} == \"E\""
            - "${dflt} == true  # default applied when field omitted"

      - name: ent_vehicle_latest_readiness_none_fail_pass_recency
        claim_type: computed_fields
        grounds: [entities.ArffVehicle.fields.latest_readiness_result, entities.ReadinessCheck.fields.result]
        distinguishing_aspect: "latest_readiness_result starts NONE, follows the most recent check by checked_at (FAIL when discharge_system_ok false), and a newer PASS supersedes it."
        test_recipe:
          setup: ["Profile exists; vehicle RED-1 registered"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id, v0_latest: $.data.latest_readiness_result } }
          trigger:
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: false }, as: ArffChief, captures: { rc_fail: $.data.result } }
            - { call: "GET /arff/vehicles/${veh1}", as: ArffChief, captures: { v_fail: $.data.latest_readiness_result } }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief, captures: { rc_pass: $.data.result } }
            - { call: "GET /arff/vehicles/${veh1}", as: ArffChief, captures: { v_pass: $.data.latest_readiness_result } }
          assert:
            - "${v0_latest} == \"NONE\""
            - "${rc_fail} == \"FAIL\" and ${v_fail} == \"FAIL\""
            - "${rc_pass} == \"PASS\" and ${v_pass} == \"PASS\"  # newer checked_at wins"

      - name: ent_vehicle_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.ArffVehicle]
        distinguishing_aspect: "Client-supplied id/created_at/version are ignored on create; the server mints id, stamps created_at, and sets version 1."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500, id: "11111111-1111-1111-1111-111111111111", created_at: "1999-01-01T00:00:00Z", version: 99 }, as: ArffChief, captures: { v_id: $.data.id, v_created: $.data.created_at, v_version: $.data.version } }
          assert:
            - "${v_id} != \"11111111-1111-1111-1111-111111111111\""
            - "${v_created} == \"2026-05-01T00:00:00Z\"  # logical clock, not client value"
            - "${v_version} == 1"

      - name: ent_vehicle_missing_required_call_sign_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ArffVehicle.fields.call_sign, "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "Omitting required call_sign yields ERR_VALIDATION_FAILED (400) and no vehicle is persisted."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/vehicles", payload: { water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { err: $.data.error_id } }
            - { call: "GET /arff/vehicles", as: ArffChief }
          assert:
            - "${err} == \"ERR_VALIDATION_FAILED\""
            - "GET /arff/vehicles returns total_count == 0"

      - name: ent_firefighter_deployable_compound
        claim_type: computed_fields
        grounds: [entities.Firefighter.fields.is_deployable, entities.Firefighter.fields.is_training_current, entities.Firefighter.fields.last_live_fire_completed_on]
        distinguishing_aspect: "is_deployable is the AND of status and currency: no training -> false; FAIL record -> false; PASS record -> true; suspension -> false."
        test_recipe:
          setup: ["Profile exists; clock 2026-05-01"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id, d0: $.data.is_deployable, c0: $.data.is_training_current } }
          trigger:
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-01", drill_type: "AIRCRAFT", result: "FAIL" }, as: ArffChief }
            - { call: "GET /arff/firefighters/${ff1}", as: ArffChief, captures: { d1: $.data.is_deployable, l1: $.data.last_live_fire_completed_on } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-10", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "GET /arff/firefighters/${ff1}", as: ArffChief, captures: { d2: $.data.is_deployable, l2: $.data.last_live_fire_completed_on } }
            - { call: "POST /arff/firefighters/${ff1}/suspend", as: ArffChief, captures: { d3: $.data.is_deployable, s3: $.data.status } }
          assert:
            - "${d0} == false and ${c0} == false  # ACTIVE but never trained"
            - "${d1} == false and ${l1} == null  # FAIL record confers nothing"
            - "${d2} == true and ${l2} == \"2026-04-10\""
            - "${d3} == false and ${s3} == \"SUSPENDED\"  # suspension dominates"

      - name: ent_aircraft_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_AIRCRAFT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown aircraft UUID returns 404 ERR_AIRCRAFT_NOT_FOUND."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "GET /arff/aircraft/00000000-0000-0000-0000-000000000000", as: AirportManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == \"ERR_AIRCRAFT_NOT_FOUND\""

  # ===========================================================================
  # Section: state_machines (claim-extraction-guide §2)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_drill_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.ResponseDrill]
        distinguishing_aspect: "A newly created drill is SCHEDULED with outcome null and executed_at null."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-03T10:00:00Z", scheduled_end: "2026-05-03T11:00:00Z" }, as: ArffChief, captures: { d_status: $.data.status, d_outcome: $.data.outcome, d_exec: $.data.executed_at } }
          assert:
            - "${d_status} == \"SCHEDULED\" and ${d_outcome} == null and ${d_exec} == null"

      - name: sm_incident_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AlertIncident]
        distinguishing_aspect: "From CLOSED every further action is rejected: respond -> ERR_INCIDENT_NOT_OPEN, alert-level patch -> ERR_INCIDENT_NOT_OPEN."
        test_recipe:
          setup:
            - "Compliant index-C airport (2 vehicles measured at capacity, 4 current firefighters, band-C aircraft)"
            - "Incident driven REPORTED -> RESPONDING -> CONTROLLED -> CLOSED"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/incidents", payload: { alert_level: "ALERT_1", location: "Taxiway A" }, as: ArffChief, captures: { inc1: $.data.id } }
            - { call: "POST /arff/incidents/${inc1}/respond", as: ArffChief }
            - { call: "POST /arff/incidents/${inc1}/control", as: ArffChief }
            - { call: "POST /arff/incidents/${inc1}/close", as: ArffChief, captures: { inc_closed: $.data.status } }
          trigger:
            - { call: "POST /arff/incidents/${inc1}/respond", as: ArffChief, captures: { err1: $.data.error_id } }
            - { call: "PATCH /arff/incidents/${inc1}/alert-level", payload: { alert_level: "ALERT_3" }, as: ArffChief, captures: { err2: $.data.error_id } }
          assert:
            - "${inc_closed} == \"CLOSED\""
            - "${err1} == \"ERR_INCIDENT_NOT_OPEN\" and ${err2} == \"ERR_INCIDENT_NOT_OPEN\""

      - name: sm_drill_certify_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ResponseDrill.EXECUTED_to_CERTIFIED, "errors[ERR_DRILL_NOT_CERTIFIABLE]"]
        distinguishing_aspect: "Certify is defined only from EXECUTED; a SCHEDULED drill (never executed) is rejected with ERR_DRILL_NOT_CERTIFIABLE and remains SCHEDULED."
        test_recipe:
          setup: ["Profile exists; drill scheduled for a future window"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-03T10:00:00Z", scheduled_end: "2026-05-03T11:00:00Z" }, as: ArffChief, captures: { dr1: $.data.id } }
          trigger:
            - { call: "POST /arff/response-drills/${dr1}/certify", as: ArffChief, captures: { err: $.data.error_id } }
            - { call: "GET /arff/response-drills/${dr1}", as: ArffChief, captures: { d_status: $.data.status } }
          assert:
            - "${err} == \"ERR_DRILL_NOT_CERTIFIABLE\" and ${d_status} == \"SCHEDULED\""

      - name: sm_agreement_auto_expires_on_clock_advance
        claim_type: valid_transition
        grounds: [state_machines.MutualAidAgreement.ACTIVE_to_EXPIRED, calculations.downgrade_cure_deadline]
        distinguishing_aspect: "An ACTIVE agreement whose end_date is passed by the logical clock flips to EXPIRED on the clock-set re-evaluation; mutual-aid requests against it are then rejected."
        test_recipe:
          setup:
            - "Profile exists; agreement KCTY [2026-01-01, 2026-05-10] activated at clock 2026-05-01"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/mutual-aid-agreements", payload: { partner_airport_code: "KCTY", max_alert_level: "ALERT_2", start_date: "2026-01-01", end_date: "2026-05-10" }, as: AirportManager, captures: { ag1: $.data.id } }
            - { call: "POST /arff/mutual-aid-agreements/${ag1}/activate", as: AirportManager }
          trigger:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: AirportManager }
            - { call: "GET /arff/mutual-aid-agreements/${ag1}", as: AirportManager, captures: { ag_status: $.data.status } }
          assert:
            - "${ag_status} == \"EXPIRED\""

      - name: sm_notification_overdue_then_acknowledge
        claim_type: valid_transition
        grounds: [state_machines.IndexDowngradeNotification.PENDING_to_OVERDUE, state_machines.IndexDowngradeNotification.OVERDUE_to_ACKNOWLEDGED, calculations.downgrade_cure_deadline]
        distinguishing_aspect: "A PENDING notification flips to OVERDUE when the logical clock passes cure_deadline (notified_at + 30 days), and acknowledge remains valid from OVERDUE."
        test_recipe:
          setup:
            - "Compliant index-C airport (2 vehicles measured at capacity, 4 current firefighters)"
            - "Two suspensions drop deployment-ready headcount 4 -> 2, driving effective_index C -> A and creating a PENDING notification (cause STAFFING, notified_at 2026-05-01)"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/firefighters/${ff3}/suspend", as: ArffChief }
            - { call: "POST /arff/firefighters/${ff4}/suspend", as: ArffChief }
            - { call: "GET /arff/index-downgrade-notifications", as: FaaInspector, captures: { n_id: "$.data[0].id", n_status0: "$.data[0].status" } }
          trigger:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AirportManager }
            - { call: "GET /arff/index-downgrade-notifications/${n_id}", as: FaaInspector, captures: { n_status1: $.data.status } }
            - { call: "POST /arff/index-downgrade-notifications/${n_id}/acknowledge", as: FaaInspector, captures: { n_status2: $.data.status } }
          assert:
            - "${n_status0} == \"PENDING\""
            - "${n_status1} == \"OVERDUE\"  # 2026-06-01 > notified_at 2026-05-01 + 30 days"
            - "${n_status2} == \"ACKNOWLEDGED\"  # acknowledge allowed from OVERDUE"

      - name: sm_drill_fail_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ResponseDrill.EXECUTED_to_FAILED]
        distinguishing_aspect: "After an executed drill is dispositioned FAILED (terminal), both execute and certify are rejected with state errors."
        test_recipe:
          setup: ["Profile exists; drill window [2026-05-03T10:00Z, 2026-05-03T11:00Z]; clock inside window; drill executed with first=200 (outcome FAIL)"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-03T10:00:00Z", scheduled_end: "2026-05-03T11:00:00Z" }, as: ArffChief, captures: { dr1: $.data.id } }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T10:30:00Z" }, as: AirportManager }
            - { call: "POST /arff/response-drills/${dr1}/execute", payload: { first_vehicle_arrival_seconds: 200, all_vehicles_arrival_seconds: 220 }, as: ArffChief }
            - { call: "POST /arff/response-drills/${dr1}/fail", as: ArffChief, captures: { d_failed: $.data.status } }
          trigger:
            - { call: "POST /arff/response-drills/${dr1}/execute", payload: { first_vehicle_arrival_seconds: 100, all_vehicles_arrival_seconds: 200 }, as: ArffChief, captures: { err1: $.data.error_id } }
            - { call: "POST /arff/response-drills/${dr1}/certify", as: ArffChief, captures: { err2: $.data.error_id } }
          assert:
            - "${d_failed} == \"FAILED\""
            - "${err1} == \"ERR_DRILL_NOT_EXECUTABLE\" and ${err2} == \"ERR_DRILL_NOT_CERTIFIABLE\""

      - name: sm_request_decline_branch_rejects_deploy
        claim_type: invalid_transition
        grounds: [state_machines.MutualAidRequest.REQUESTED_to_DECLINED, state_machines.MutualAidRequest.REQUESTED_to_DEPLOYED]
        distinguishing_aspect: "DECLINED is terminal for the deploy branch: deploy after decline is rejected with ERR_REQUEST_NOT_ACTIONABLE; the independent DECLINED vs DEPLOYED branches diverge from REQUESTED."
        test_recipe:
          setup:
            - "Compliant index-C airport; ACTIVE agreement KCTY; incident REPORTED; request created"
          setup_api_calls:
