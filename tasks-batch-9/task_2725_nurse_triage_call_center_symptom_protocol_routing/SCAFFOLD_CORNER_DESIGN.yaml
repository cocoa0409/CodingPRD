            - "A re-assessment with 0 red flags (62 -> URGENT_CARE_24H) supersedes assessment_1, voids disposition_1 and returns the call to ASSESSING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
