              as: LeagueOps
            - call: "POST /markets"
              payload: { code: "NYC", name: "New York", zip_prefixes: ["100"], home_team_codes: ["NYC"] }
              as: LeagueOps
            - call: "POST /week-slates"
              payload: { season_id: "${season_id}", week_index: 4 }
              as: LeagueOps
              captures: { slate_id: $.data.id, slate_v0: $.data.version }
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "KC", home_team_code: "DAL", kickoff_at: "2026-08-30T17:00:00Z", home_market_code: "DAL" }
              as: LeagueOps
              captures: { game_dal: $.data.id }
            - call: "POST /games"
              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "BUF", home_team_code: "NYC", kickoff_at: "2026-08-30T20:00:00Z", home_market_code: "NYC" }
              as: LeagueOps
              captures: { game_nyc: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", plan_tier: "BASE", base_price_cents: 20000, includes_multiview: false, includes_companion: false, valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "inv@x.com", full_name: "Inv Ariant", account_kind: "RESIDENTIAL", billing_zip: "10001" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", offer_id: "${offer_id}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /game-entitlements"
              payload: { subscription_id: "${sub_id}", status: "GRANTED" }
              as: PlatformAdmin
              captures: { granted_count_probe: "$.data[0].week_index" }
            - call: "GET /week-slates/${slate_id}"
              payload: {}
              as: LeagueOps
              captures: { slate_v1: $.data.version }
          trigger:
            - call: "POST /week-slates/${slate_id}/selections"
              payload: { game_id: "${game_dal}", action: "ADD", expected_slate_version: "${slate_v1}" }
              as: LeagueOps
              captures: { slate_v2: $.data.version }
            - call: "GET /game-entitlements"
              payload: { subscription_id: "${sub_id}" }
              as: PlatformAdmin
            - call: "POST /week-slates/${slate_id}/selections"
              payload: { game_id: "${game_dal}", action: "REMOVE", expected_slate_version: "${slate_v2}" }
              as: LeagueOps
          assert:
            - "before ADD: exactly 2 GRANTED GameEntitlement rows for Subscription.${sub_id}"
            - "after ADD: exactly 1 GRANTED and 1 WITHDRAWN (reason NATIONAL_SELECTION); total row count still 2 (no rows created or deleted)"
            - "after compensating REMOVE: exactly 2 GRANTED again; the restored row's withdrawn_reason is cleared; total row count still 2"
            - "WeekSlate.${slate_id}.package_game_count returns to 2"
