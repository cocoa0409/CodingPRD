      - name: rbac_medic_segregation_of_duties_on_clearance
        claim_type: rbac_denial
        grounds: [roles, "validations[priority=7]"]
        distinguishing_aspect: "Segregation of duties: a medic who evaluated the case cannot clear it even when two recommendations exist — cleared_by equal to an evaluator fails."
        test_recipe:
          setup: ["talent T with OPEN case MC; two recommending evaluations from medic-m1 and medic-m2"]
          setup_api_calls:
