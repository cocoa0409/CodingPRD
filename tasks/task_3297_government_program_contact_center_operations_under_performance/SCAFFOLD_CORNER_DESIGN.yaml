        captures:
          occ_err2: $.data.error_id
      assert:
      - the SL activation bumped Contract.version beyond ${occ_cv}
      - 'the approve with the pre-activation version: 412 and occ_err2 == ERR_STALE_VERSION'
      - Invoice.${occ_inv}.status remains SUBMITTED
  - name: cure_window_closed_on_remedied_and_no_eligible_queue_uncertified
