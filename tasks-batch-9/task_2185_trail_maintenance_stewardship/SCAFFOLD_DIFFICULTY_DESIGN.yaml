  - rule_id: compensating_invariant
    instances:
      - name: material_order_cancel_restores_budget_identity_with_zero_drift
        grounds:
          - calculations.work_plan_budget_ledger
          - state_machines.MaterialOrder.DRAFT_to_CANCELLED
          - state_machines.AdoptionAgreement.SUSPENDED_to_ACTIVE
          - entities.WorkPlan.fields.available_cents
          - entities.WorkPlan.fields.committed_cents
        distinguishing_aspect: |
          Conserved quantity 1 is MONEY IN CENTS. The invariant
          INV_BUDGET: approved_budget_cents == committed_cents + spent_cents + available_cents
          must hold at 250000 before, during and after the forward action (create the 47700-cent
          BRIDGE requisition, which tips the plan to OVER_COMMITTED) and its compensating action
          (cancel it), with committed_cents returning to exactly 205236 - no rounding drift.
        test_recipe:
          setup:
            - "An ACTIVE adoption on Alder Creek with an APPROVED plan carrying approved_budget_cents 250000."
            - "One DRAFT SIGNAGE requisition of 205236 cents already committed, leaving available_cents 44764 and budget_posture TIGHT."
