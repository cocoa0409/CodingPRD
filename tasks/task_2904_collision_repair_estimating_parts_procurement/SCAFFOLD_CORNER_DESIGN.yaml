          - endpoints.POST_/repair-orders/{id}/estimate-lines
        distinguishing_aspect: >-
          The FK is scoped to the parent, not merely to existence: a real DamageLine id belonging to a
          different RepairOrder is ERR_DAMAGE_LINE_NOT_FOUND (404), the same answer an unknown id
          receives. Cross-order estimate writing is therefore impossible even with a valid id in hand.
