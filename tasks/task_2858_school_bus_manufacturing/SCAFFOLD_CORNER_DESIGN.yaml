            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-TX-092", buyer_type: "DISTRICT", buyer_name: "Frisco ISD", spec_profile_id: "${tx_id}", unit_count: 1, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 20000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_tx_id: $.data.id }
          trigger:
            - call: "POST /bids"
              payload: { solicitation_id: "00000000-0000-0000-0000-0000000000aa", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { err_sol_fk: $.data.error_id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_tx_id}", bus_model_id: "00000000-0000-0000-0000-0000000000bb", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { err_model_fk: $.data.error_id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_tx_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "00000000-0000-0000-0000-0000000000cc", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
