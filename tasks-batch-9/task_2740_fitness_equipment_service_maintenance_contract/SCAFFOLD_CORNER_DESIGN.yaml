  - section: cross_cutting_complexity_layers
    instances:
      - name: both_occ_guarded_writes_demand_the_contracts_current_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-create-stale-contract]
          - concurrency_rules[credit-reconciliation-stale-contract]
          - errors.ERR_STALE_CONTRACT_VERSION
        distinguishing_aspect: "Both declared concurrency rules are walked on one contract in the order that makes them interfere: the reconciliation bumps the version, so the renewal-quote request that was prepared against the pre-reconciliation version is now stale — the two OCC-guarded endpoints share a single version counter rather than each keeping their own."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH (open 05:00-23:00), unit e1 installed 2024-03-01 with 500 usage hours, technician T1."
            - "ACTIVE GOLD/FULL contract, annual_base_cents 250000, allowance 500000, term 2026-01-01..2026-12-31 — credit_cap_cents 37500, version 2 after activation."
            - "One MAJOR call on e1 is reported at 08:00, arrives at 08:00 and is resolved at 14:00, closing a 360-minute event: 180 minutes past the GOLD grace at 1600 cents/hour = 4800 cents provisional, and the whole window sits inside operating hours so the final figure is 4800 too."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-OCC-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id", v_created: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator, captures: { v_active: "$.data.version" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T14:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_id}/resolve", payload: { resolution_code: "BELT_TENSIONED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { v_pre: "$.data.version", prov_pre: "$.data.credit_provisional_cents" } }
          trigger:
            - { call: "POST /fleetcare/contracts/${c_id}/credit-reconciliations", payload: { period_key: "2026-08", expected_contract_version: "${v_pre} - 1" }, as: ContractAdministrator, captures: { stale_recon: "$.data.error_id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/credit-reconciliations", payload: { period_key: "2026-08", expected_contract_version: "${v_pre}" }, as: ContractAdministrator, captures: { posted: "$.data.posted_credit_cents", v_after_recon: "$.data.contract_version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${v_pre}" }, as: ContractAdministrator, captures: { stale_quote: "$.data.error_id" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { v_mid: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${v_mid}" }, as: ContractAdministrator, captures: { q_id: "$.data.id", q_total: "$.data.quoted_annual_cents", q_floor: "$.data.floor_applied" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { v_final: "$.data.version", status_final: "$.data.status" } }
          assert:
            - "${v_created} == 1, ${v_active} == 2 and ${v_pre} == 2 — resolving a service call does not bump the contract version, only contract-level transitions and reconciliations do"
            - "${prov_pre} == 4800 — the closed event is visible on the contract before any reconciliation"
            - "${stale_recon} == 'ERR_STALE_CONTRACT_VERSION' with HTTP 412, and the event is still CLOSED with posted_credit_cents null"
            - "${posted} == 4800 and ${v_after_recon} == 3 — the successful reconciliation is the write that advances the counter"
            - "${stale_quote} == 'ERR_STALE_CONTRACT_VERSION' with HTTP 412 — the version read before the reconciliation is now stale for the OTHER guarded endpoint, and no RenewalQuote row was created"
            - "${v_mid} == 3, and the retry at that version issues ${q_id} with HTTP 201"
            - "${q_total} == 225000 with ${q_floor} == true — the computed 134520 (120000 base + 21600 FULL surcharge, less the 5% compliance discount of 7080) is lifted to 90% of 250000"
            - "${v_final} == 4 and ${status_final} == 'RENEWAL_QUOTED' — three successful writes, three increments"

      - name: filtered_call_lists_page_over_the_filtered_total_not_the_table
