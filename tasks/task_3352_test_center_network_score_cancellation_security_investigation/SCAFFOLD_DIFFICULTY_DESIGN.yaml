  - rule_id: non_linear_state_machine
    instances:
      - name: test_center_authorization_cycle
        grounds:
          - state_machines.TestCenter.AUTHORIZED_to_SUSPENDED
          - state_machines.TestCenter.SUSPENDED_to_AUTHORIZED
        distinguishing_aspect: |
          TestCenter machine is cyclic (AUTHORIZED -> SUSPENDED -> AUTHORIZED
          via successive audits), a non-linear shape on a different entity than
          the Registration parallel-dimension instance.
        test_recipe:
          setup:
            - "one center that earns AUTHORIZED, then fails an audit, then passes a later audit"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center CY", facility_seat_capacity: 25, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a1: $.data.id }
            - call: "POST /ets/audits/${a1}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-20", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a2: $.data.id }
            - call: "POST /ets/audits/${a2}/complete"
              payload: { facility_findings: 2, staffing_findings: 1, equipment_findings: 3, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-10-01", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a3: $.data.id }
          trigger:
            - call: "POST /ets/audits/${a3}/complete"
              payload: { facility_findings: 0, staffing_findings: 0, equipment_findings: 1, high_severity_findings: 0 }
              as: Auditor
          assert:
            - "after audit 1 (score 82 PASSED): TestCenter.${c_id}.authorization_status == AUTHORIZED"
            - "after audit 2 (score 74 FAILED): TestCenter.${c_id}.authorization_status == SUSPENDED"
            - "after audit 3 (score 97 PASSED): TestCenter.${c_id}.authorization_status == AUTHORIZED (cycle closed)"
            - "TestCenter.${c_id}.last_audit_outcome == PASSED"

      - name: registration_parallel_dimensions
        grounds:
          - state_machines.Registration
          - entities.Registration.fields.booking_status
          - entities.Registration.fields.attendance_status
        distinguishing_aspect: |
          Registration carries two independent state dimensions on one row:
          attendance moves PENDING -> ADMITTED while booking stays CONFIRMED,
          and booking then moves CONFIRMED -> CANCELLED while attendance stays
          frozen at ADMITTED. A different non-linear shape (parallel dimensions)
          on a different entity than the TestCenter cycle.
        test_recipe:
          setup:
            - "AUTHORIZED center, PUBLISHED session 2026-10-10, one examinee CONFIRMED; on test day the examinee is ADMITTED, then the registration is cancelled before administration closes"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center PD", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr PD", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Proc PD", staff_role: "PROCTOR", certification_level: "BASIC" }
              as: ProgramAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 5, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex PD", date_of_birth: "2001-07-07", id_document_type: "PASSPORT", id_document_number: "PPD1", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_a}", expected_session_version: "${s_v}" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { r_a: $.data.id }
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T07:45:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/lock"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_a}/check-in"
              payload: { id_document_number: "PPD1", id_document_expiry: "2027-06-01", biometric_sample: "bio-pd" }
              as: Proctor
              as_user_id: "${pro_id}"
          trigger:
            - call: "POST /ets/registrations/${r_a}/cancel"
              as: Examinee
              as_user_id: "${ex_a}"
            - call: "GET /ets/registrations/${r_a}"
              as: ProgramAdmin
          assert:
            - "before cancel: Registration.${r_a}.booking_status == CONFIRMED while attendance_status == ADMITTED (dimensions independent)"
            - "after cancel: Registration.${r_a}.booking_status == CANCELLED"
            - "after cancel: Registration.${r_a}.attendance_status == ADMITTED (cancel does not rewrite the attendance dimension)"

  - rule_id: transitive_cascade
    instances:
      - name: failed_audit_cascade_depth3
        grounds:
          - state_machines.TestCenter.AUTHORIZED_to_SUSPENDED
          - state_machines.TestSession.PUBLISHED_to_CANCELLED
          - state_machines.Registration
        distinguishing_aspect: |
          Depth-3 chain: audit completion (FAILED) mutates the TestCenter; the
          center's SUSPENDED transition itself cancels each DRAFT/PUBLISHED
          TestSession; each session's cancellation itself cancels its live
          Registrations. Each hop is caused by the previous hop, not by the
          audit call directly.
        test_recipe:
          setup:
            - "AUTHORIZED center with one PUBLISHED session holding one CONFIRMED registration; a second audit is scheduled"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center FC", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
