        claim_type: error_triggerable
        grounds:
          - validations[priority=62]
          - errors.ERR_POSTURE_NOT_COMPLIANT
        excluded_because:
          difficulty_instance: transitive_cascade / charge_off_cascade_reaches_matching_fund_commitment_hold
          rationale: "After the charge-off drops the lender to PROBATION and suspends the award there, the recipe attempts resume-draws and asserts 409 ERR_POSTURE_NOT_COMPLIANT."
