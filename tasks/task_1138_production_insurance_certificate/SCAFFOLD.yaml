scenario: |
  1138. Production Insurance & Certificate Management (entertainment insurance broker): coverage placement (general liability/equipment/cast/E&O) by production, location/vendor certificate issuance with additional insured, cast physical & essential-element endorsement, claim reporting (damage/injury/weather) & deductible, completion bond requirement & interaction, foreign/travel coverage extension, E&O clearance requirements (script/title/rights), policy renewal & audit of payroll basis

domain_name: production-insurance
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: production_code, type: string, source: input, description: "Unique broker-assigned production code (e.g. PRD-2026-014)" }
      - { name: title, type: string, source: input, description: "Working title of the film/TV production" }
      - { name: production_type, type: enum, source: input, description: "FEATURE | EPISODIC | DOCUMENTARY | COMMERCIAL | MUSIC_VIDEO" }
      - { name: principal_photography_start, type: datetime, source: input, description: "First scheduled shooting day, ISO8601 UTC" }
      - { name: principal_photography_end, type: datetime, source: input, description: "Last scheduled shooting day, must be > principal_photography_start" }
      - { name: budget_cents, type: integer, source: input, description: "Total production budget in cents; must be > 0" }
      - { name: requires_completion_bond, type: boolean, source: input, default: false, description: "True when budget or financier mandates a completion bond" }
      - { name: coverage_posture, type: enum, source: computed, description: "Derived: UNBOUND | BOUND_PARTIAL | BOUND_FULL | RESTRICTED | SUSPENDED — gates certificate issuance, foreign travel, claim acceptance" }
      - { name: posture_reasons, type: array, source: computed, description: "List of string codes explaining current posture (e.g. MISSING_CAST_ENDORSEMENT, OPEN_INJURY_CLAIM)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | WRAPPED | CANCELLED" }

  - name: Policy
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; owning production" }
      - { name: coverage_line, type: enum, source: input, description: "GENERAL_LIABILITY | EQUIPMENT | CAST | ERRORS_OMISSIONS | FOREIGN_TRAVEL" }
      - { name: carrier_code, type: string, source: input, description: "Issuing carrier code (e.g. CHUBB, AIG, TRAVELERS)" }
      - { name: policy_number, type: string, source: input, description: "Carrier-assigned policy number; unique per (carrier_code, coverage_line)" }
      - { name: limit_cents, type: integer, source: input, description: "Per-occurrence coverage limit in cents; > 0" }
      - { name: aggregate_limit_cents, type: integer, source: input, description: "Aggregate coverage limit in cents; >= limit_cents" }
      - { name: deductible_cents, type: integer, source: input, description: "Per-claim deductible in cents; >= 0" }
      - { name: effective_date, type: datetime, source: input, description: "Policy effective date, ISO8601 UTC" }
      - { name: expiry_date, type: datetime, source: input, description: "Policy expiry date; must be > effective_date" }
      - { name: provisional_premium_cents, type: integer, source: computed, description: "Premium estimated from declared payroll basis at bind time" }
      - { name: final_premium_cents, type: integer, source: computed, description: "Premium recomputed from audited payroll; populated only after payroll audit posts" }
      - { name: payroll_basis_cents, type: integer, source: input, description: "Declared payroll basis used for provisional premium; >= 0" }
      - { name: audited_payroll_cents, type: integer, source: computed, description: "Final payroll basis after audit; populated only by audit post" }
      - { name: status, type: enum, source: system, description: "QUOTED | BOUND | ENDORSED_PENDING | ACTIVE | EXPIRED | CANCELLED" }

  - name: CastMember
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; owning production" }
      - { name: full_name, type: string, source: input, description: "Cast member legal name" }
      - { name: role_tier, type: enum, source: input, description: "PRINCIPAL | SUPPORTING | DAY_PLAYER | STUNT" }
      - { name: weekly_salary_cents, type: integer, source: input, description: "Contracted weekly salary in cents; > 0" }
      - { name: essential_element, type: boolean, source: input, default: false, description: "True when production cannot complete without this cast member" }
      - { name: physical_exam_status, type: enum, source: system, description: "PENDING | CLEARED | CONDITIONAL | FAILED | EXPIRED" }
      - { name: physical_exam_expires_at, type: datetime, source: computed, description: "Set when exam clears; exam validity = cleared_at + 90 days" }
      - { name: endorsement_required, type: boolean, source: computed, description: "True when essential_element==true OR role_tier==PRINCIPAL" }

  - name: CastEndorsement
    parent: CastMember
    common_fields: true
    fields:
      - { name: cast_member_id, type: string, source: system, description: "FK -> CastMember.id; endorsed cast member" }
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; must be a CAST-coverage policy on same production" }
      - { name: endorsement_type, type: enum, source: input, description: "PHYSICAL_CLEARANCE | ESSENTIAL_ELEMENT | STUNT_RIDER" }
      - { name: underwriter_notes, type: string, source: input, description: "Free-text underwriter annotation" }
      - { name: issued_at, type: datetime, source: system, description: "Set on issuance" }
      - { name: revoked_at, type: datetime, source: system, description: "Set on revocation; null when active" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | REVOKED" }

  - name: Certificate
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; issuing production" }
      - { name: certificate_type, type: enum, source: input, description: "LOCATION | VENDOR | EQUIPMENT_RENTAL | PERMIT" }
      - { name: holder_name, type: string, source: input, description: "Certificate holder legal name (location owner, vendor, municipality)" }
      - { name: holder_address, type: string, source: input, description: "Certificate holder mailing address" }
      - { name: additional_insured_name, type: string, source: input, description: "Additional insured party name; required for LOCATION and PERMIT types" }
      - { name: coverage_lines, type: array, source: input, description: "Subset of {GENERAL_LIABILITY, EQUIPMENT, ERRORS_OMISSIONS}; must each be bound on the production" }
      - { name: location_start, type: datetime, source: input, description: "Coverage-effective window start (ISO8601 UTC)" }
      - { name: location_end, type: datetime, source: input, description: "Coverage-effective window end; > location_start" }
      - { name: certificate_number, type: string, source: system, description: "Server-minted unique certificate number, format CERT-<prod>-<seq>" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | VOIDED | EXPIRED" }

  - name: Claim
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; owning production" }
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; policy the claim is reported against" }
      - { name: claim_type, type: enum, source: input, description: "DAMAGE | INJURY | WEATHER_DELAY | THEFT | THIRD_PARTY" }
      - { name: occurrence_date, type: datetime, source: input, description: "Date loss occurred; must be within policy effective window" }
      - { name: reported_date, type: datetime, source: system, description: "Server-stamped when claim submitted" }
      - { name: loss_amount_cents, type: integer, source: input, description: "Claimed loss amount in cents; > 0" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Deductible portion charged to production on this claim" }
      - { name: carrier_payable_cents, type: integer, source: computed, description: "loss_amount_cents - deductible_applied_cents (>= 0)" }
      - { name: reserve_cents, type: integer, source: computed, description: "Initial reserve = carrier_payable_cents at SUBMITTED; adjusters may update" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | ADJUSTED | DENIED | SETTLED | CLOSED" }

  - name: ClaimEvent
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim" }
      - { name: event_type, type: enum, source: input, description: "SUBMIT | ADJUST_RESERVE | DENY | SETTLE | REOPEN | CLOSE" }
      - { name: payload, type: object, source: input, description: "Event-specific data (e.g. new_reserve_cents for ADJUST_RESERVE)" }
      - { name: recorded_at, type: datetime, source: system, description: "Server-stamped event timestamp" }
      - { name: actor_role, type: string, source: system, description: "Role that emitted the event" }

  - name: ClearanceItem
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; owning production" }
      - { name: clearance_kind, type: enum, source: input, description: "SCRIPT | TITLE | MUSIC | PERSONAL_RIGHTS | TRADEMARK | LOCATION_RIGHTS" }
      - { name: item_reference, type: string, source: input, description: "Human-readable description (e.g. 'Title report for \"Night Shift\"')" }
      - { name: legal_reviewer, type: string, source: input, description: "Clearance counsel name" }
      - { name: notes, type: string, source: input, description: "Reviewer notes / exceptions" }
      - { name: status, type: enum, source: system, description: "PENDING | CLEARED | FLAGGED | WAIVED" }

  - name: CompletionBond
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; bonded production (1:1)" }
      - { name: surety_company, type: string, source: input, description: "Issuing surety name" }
      - { name: bond_amount_cents, type: integer, source: input, description: "Bond penalty amount in cents; must be >= budget_cents * BOND_COVER_MIN_PCT" }
      - { name: bond_premium_cents, type: integer, source: computed, description: "Bond fee; tiered on bond_amount_cents and budget_cents" }
      - { name: strike_price_cents, type: integer, source: computed, description: "Takeover threshold the surety will fund up to" }
      - { name: status, type: enum, source: system, description: "APPLIED | UNDERWRITTEN | ISSUED | CLAIMED | RELEASED | LAPSED" }

  - name: ForeignTravelExtension
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; owning production" }
      - { name: territory_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country code (e.g. FR, JP)" }
      - { name: travel_window_start, type: datetime, source: input, description: "Foreign travel window start, ISO8601 UTC" }
      - { name: travel_window_end, type: datetime, source: input, description: "Foreign travel window end; > travel_window_start" }
      - { name: travelers_count, type: integer, source: input, description: "Number of cast/crew traveling; > 0" }
      - { name: repatriation_limit_cents, type: integer, source: input, description: "Medical-repatriation sub-limit in cents; > 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | ACTIVE | EXPIRED | DENIED" }

  - name: PayrollAudit
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; audited policy" }
      - { name: audit_period_start, type: datetime, source: input, description: "Payroll audit window start (ISO8601 UTC)" }
      - { name: audit_period_end, type: datetime, source: input, description: "Payroll audit window end; > audit_period_start" }
      - { name: auditor_name, type: string, source: input, description: "External auditor name" }
      - { name: reported_payroll_cents, type: integer, source: input, description: "Auditor-reported payroll total in cents; >= 0" }
      - { name: premium_delta_cents, type: integer, source: computed, description: "final_premium_cents - provisional_premium_cents; positive = production owes carrier, negative = refund due" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SUBMITTED | POSTED | DISPUTED" }

  - name: RenewalOffer
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; policy being renewed" }
      - { name: offered_premium_cents, type: integer, source: computed, description: "Quoted premium for renewal term" }
      - { name: loss_ratio_pct, type: integer, source: computed, description: "Prior-term incurred losses / prior-term earned premium, percentage points 0..10000 (basis-points*100)" }
      - { name: renewal_term_months, type: integer, source: input, description: "Renewal term length in months; 6 | 12 | 18" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Server-stamped, = created_at + 14 days" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | EXPIRED | SUPERSEDED" }

# =============================================================================
# Table 2: State Machines
# =============================================================================
state_machines:
  - entity: Production
    initial_state: DRAFT
    terminal_states: [WRAPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /productions/{id}/activate"
        actor: BrokerAgent
        preconditions:
          - "At least one Policy in {BOUND, ENDORSED_PENDING, ACTIVE} for production (ERR_NO_BOUND_POLICY)"
          - "If requires_completion_bond == true, CompletionBond.status must be ISSUED (ERR_BOND_NOT_ISSUED)"
          - "Every CastMember with endorsement_required == true has at least one CastEndorsement in ISSUED (ERR_CAST_ENDORSEMENT_MISSING)"
          - "Every ClearanceItem with clearance_kind in {SCRIPT, TITLE, PERSONAL_RIGHTS} must be in {CLEARED, WAIVED} (ERR_MANDATORY_CLEARANCE_OPEN)"
        side_effects:
          - "coverage_posture recomputed via production_posture_derive"

      - from: ACTIVE
        to: WRAPPED
        trigger: "POST /productions/{id}/wrap"
        actor: ProductionManager
        preconditions:
          - "All Claims on production are in {SETTLED, DENIED, CLOSED} (ERR_OPEN_CLAIMS_BLOCK_WRAP)"
          - "All Certificates on production are in {ISSUED, VOIDED, EXPIRED} — DRAFT certs must be issued or voided first (ERR_DRAFT_CERTIFICATES_OPEN)"
        side_effects:
          - "All Certificates with status == ISSUED auto-transition to EXPIRED"
          - "All ForeignTravelExtension with status == ACTIVE auto-transition to EXPIRED"
          - "CompletionBond (if ISSUED) auto-transitions to RELEASED"
          - "Schedule PayrollAudit creation task per ACTIVE policy (audit_status := SCHEDULED)"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /productions/{id}/cancel"
        actor: BrokerAgent
        preconditions:
          - "No Claim on production is in {SUBMITTED, UNDER_REVIEW, ADJUSTED} (ERR_OPEN_CLAIMS_BLOCK_CANCEL)"
        side_effects:
          - "All Policies in {BOUND, ENDORSED_PENDING, ACTIVE} transition to CANCELLED"
          - "All Certificates in {DRAFT, ISSUED} transition to VOIDED"
          - "All CastEndorsement in ISSUED transition to REVOKED"
          - "CompletionBond (if present, not CLAIMED) transitions to LAPSED"
          - "All ForeignTravelExtension in {REQUESTED, APPROVED, ACTIVE} transition to DENIED"
          - "coverage_posture recomputed via production_posture_derive"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /productions/{id}/cancel"
        actor: BrokerAgent
        preconditions: []
        side_effects:
          - "All Policies in QUOTED transition to CANCELLED"

  - entity: Policy
    initial_state: QUOTED
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /productions/{prodId}/policies/{id}/bind"
        actor: BrokerAgent
        preconditions:
          - "Production.status in {DRAFT, ACTIVE}"
          - "If coverage_line == CAST: every CastMember with endorsement_required == true must already have physical_exam_status in {CLEARED, CONDITIONAL} (ERR_CAST_EXAM_INCOMPLETE)"
          - "If coverage_line == ERRORS_OMISSIONS: every ClearanceItem with clearance_kind in {SCRIPT, TITLE} must be in {CLEARED, WAIVED} (ERR_EO_CLEARANCE_INCOMPLETE)"
          - "If coverage_line == FOREIGN_TRAVEL: a GENERAL_LIABILITY policy on same production must already be in {BOUND, ENDORSED_PENDING, ACTIVE} (ERR_GL_PREREQUISITE_MISSING)"
          - "provisional_premium_cents computed via provisional_premium_calculate"
        side_effects:
          - "provisional_premium_cents computed and stored"
          - "coverage_posture recomputed via production_posture_derive"

      - from: BOUND
        to: ACTIVE
        trigger: "system (automatic when current_utc >= effective_date)"
        actor: system
        preconditions:
          - "current_utc >= effective_date"
        side_effects:
          - "coverage_posture recomputed"

      - from: BOUND
        to: ENDORSED_PENDING
        trigger: "POST /productions/{prodId}/policies/{id}/endorsements (when coverage_line == CAST)"
        actor: UnderwriterAgent
        preconditions:
          - "endorsement cast_member_id belongs to same production"
          - "endorsement_type must be in {PHYSICAL_CLEARANCE, ESSENTIAL_ELEMENT, STUNT_RIDER}"
        side_effects:
          - "CastEndorsement created in DRAFT"

      - from: ENDORSED_PENDING
        to: ACTIVE
        trigger: "system (automatic when all DRAFT endorsements on this policy reach ISSUED or REVOKED AND current_utc >= effective_date)"
        actor: system
        preconditions:
          - "No CastEndorsement on this Policy is in DRAFT"
          - "current_utc >= effective_date"
        side_effects:
          - "coverage_posture recomputed"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when current_utc >= expiry_date AND no open RenewalOffer)"
        actor: system
        preconditions:
          - "current_utc >= expiry_date"
          - "No RenewalOffer for this policy in {OFFERED, ACCEPTED}"
        side_effects:
          - "All Certificates listing this coverage_line auto-transition to EXPIRED"
          - "coverage_posture recomputed"

      - from: BOUND
        to: CANCELLED
        trigger: "POST /productions/{prodId}/policies/{id}/cancel"
        actor: BrokerAgent
        preconditions:
          - "No Claim on this policy in {SUBMITTED, UNDER_REVIEW, ADJUSTED} (ERR_OPEN_CLAIMS_BLOCK_POLICY_CANCEL)"
        side_effects:
          - "CastEndorsement on this policy in {DRAFT, ISSUED} transition to REVOKED"
          - "coverage_posture recomputed"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /productions/{prodId}/policies/{id}/cancel"
        actor: BrokerAgent
        preconditions:
          - "No Claim on this policy in {SUBMITTED, UNDER_REVIEW, ADJUSTED}"
        side_effects:
          - "Same as BOUND→CANCELLED"
          - "Certificates listing this coverage_line transition to VOIDED"

  - entity: CastMember
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /productions/{prodId}/cast-members/{id}/physical-exam"
        actor: UnderwriterAgent
        preconditions:
          - "Production.status != CANCELLED"
        side_effects:
          - "physical_exam_status := CLEARED"
          - "physical_exam_expires_at := current_utc + 90 days"

      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /productions/{prodId}/cast-members/{id}/physical-exam"
        actor: UnderwriterAgent
        preconditions:
          - "Production.status != CANCELLED"
        side_effects:
          - "physical_exam_status := CONDITIONAL"
          - "physical_exam_expires_at := current_utc + 30 days"

      - from: PENDING
        to: FAILED
        trigger: "POST /productions/{prodId}/cast-members/{id}/physical-exam"
        actor: UnderwriterAgent
        preconditions: []
        side_effects:
          - "physical_exam_status := FAILED"
          - "Production.coverage_posture recomputed"

      - from: CLEARED
        to: EXPIRED
        trigger: "system (automatic when current_utc >= physical_exam_expires_at)"
        actor: system
        preconditions:
          - "current_utc >= physical_exam_expires_at"
        side_effects:
          - "Any CastEndorsement referencing this CastMember with endorsement_type == PHYSICAL_CLEARANCE in ISSUED auto-transitions to REVOKED"
          - "Production.coverage_posture recomputed"

      - from: CONDITIONAL
        to: CLEARED
        trigger: "POST /productions/{prodId}/cast-members/{id}/physical-exam"
        actor: UnderwriterAgent
        preconditions: []
        side_effects:
          - "physical_exam_status := CLEARED"
          - "physical_exam_expires_at := current_utc + 90 days"

      - from: CONDITIONAL
        to: EXPIRED
        trigger: "system (automatic when current_utc >= physical_exam_expires_at)"
        actor: system
        preconditions:
          - "current_utc >= physical_exam_expires_at"
        side_effects:
          - "Same as CLEARED → EXPIRED"

      - from: FAILED
        to: PENDING
        trigger: "POST /productions/{prodId}/cast-members/{id}/physical-exam-retake"
        actor: UnderwriterAgent
        preconditions: []
        side_effects:
          - "physical_exam_status := PENDING"
          - "physical_exam_expires_at := null"

  - entity: CastEndorsement
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /productions/{prodId}/cast-endorsements/{id}/issue"
        actor: UnderwriterAgent
        preconditions:
          - "CastMember.physical_exam_status in {CLEARED, CONDITIONAL} when endorsement_type == PHYSICAL_CLEARANCE"
          - "CastMember.essential_element == true when endorsement_type == ESSENTIAL_ELEMENT"
          - "CastMember.role_tier == STUNT when endorsement_type == STUNT_RIDER"
          - "Policy.status in {BOUND, ENDORSED_PENDING, ACTIVE}"
        side_effects:
          - "Policy (if ENDORSED_PENDING) may auto-transition to ACTIVE"
          - "Production.coverage_posture recomputed"

      - from: ISSUED
        to: REVOKED
        trigger: "POST /productions/{prodId}/cast-endorsements/{id}/revoke"
        actor: UnderwriterAgent
        preconditions: []
        side_effects:
          - "Production.coverage_posture recomputed"

      - from: DRAFT
        to: REVOKED
        trigger: "POST /productions/{prodId}/cast-endorsements/{id}/revoke"
        actor: UnderwriterAgent
        preconditions: []
        side_effects: []

  - entity: Certificate
    initial_state: DRAFT
    terminal_states: [VOIDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /productions/{prodId}/certificates/{id}/issue"
        actor: BrokerAgent
        preconditions:
          - "Production.status == ACTIVE (ERR_PRODUCTION_NOT_ACTIVE)"
          - "Production.coverage_posture in {BOUND_FULL, BOUND_PARTIAL} (ERR_POSTURE_BLOCKS_ISSUANCE)"
          - "Every coverage_line in coverage_lines has at least one Policy on this production in {BOUND, ENDORSED_PENDING, ACTIVE} (ERR_COVERAGE_LINE_NOT_BOUND)"
          - "location_start < location_end AND location_end <= principal_photography_end + 30 days"
          - "If certificate_type in {LOCATION, PERMIT}: additional_insured_name must be non-empty (ERR_ADDITIONAL_INSURED_REQUIRED)"
          - "current_utc <= location_end (ERR_CERT_WINDOW_ELAPSED)"
        side_effects:
          - "certificate_number minted"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /productions/{prodId}/certificates/{id}/void"
        actor: BrokerAgent
        preconditions:
          - "current_utc < location_start (cannot void after coverage window has started; use expire)"
        side_effects: []

      - from: ISSUED
        to: EXPIRED
        trigger: "system (automatic when current_utc > location_end, or parent production/policy expires/cancels)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: VOIDED
        trigger: "POST /productions/{prodId}/certificates/{id}/void"
        actor: BrokerAgent
        preconditions: []
        side_effects: []

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [DENIED, SETTLED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /productions/{prodId}/claims/{id}/acknowledge"
        actor: ClaimsAdjuster
        preconditions:
          - "Policy referenced by Claim.policy_id is in {BOUND, ENDORSED_PENDING, ACTIVE, EXPIRED} — claims against QUOTED or CANCELLED policies rejected (ERR_POLICY_NOT_CLAIMABLE)"
        side_effects:
          - "reserve_cents := carrier_payable_cents (initial reserve)"
          - "ClaimEvent(SUBMIT) appended"

      - from: UNDER_REVIEW
        to: ADJUSTED
        trigger: "POST /productions/{prodId}/claims/{id}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "payload.new_reserve_cents >= 0"
        side_effects:
          - "reserve_cents := payload.new_reserve_cents"
          - "ClaimEvent(ADJUST_RESERVE) appended"

      - from: ADJUSTED
        to: UNDER_REVIEW
        trigger: "POST /productions/{prodId}/claims/{id}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "payload.new_reserve_cents >= 0"
        side_effects:
          - "reserve_cents := payload.new_reserve_cents"
          - "ClaimEvent(ADJUST_RESERVE) appended"
        note: "Cyclic adjustment loop permitted"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /productions/{prodId}/claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "payload.reason non-empty"
        side_effects:
          - "reserve_cents := 0"
          - "ClaimEvent(DENY) appended"

      - from: UNDER_REVIEW
        to: SETTLED
        trigger: "POST /productions/{prodId}/claims/{id}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "payload.settlement_amount_cents >= 0"
          - "payload.settlement_amount_cents <= reserve_cents (ERR_SETTLEMENT_EXCEEDS_RESERVE)"
          - "Segregation of duties: the same X-User-ID that submitted the claim (ProductionManager) cannot settle it (ERR_SELF_SETTLEMENT_FORBIDDEN)"
        side_effects:
          - "reserve_cents := 0"
          - "ClaimEvent(SETTLE) appended"

      - from: ADJUSTED
        to: SETTLED
        trigger: "POST /productions/{prodId}/claims/{id}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "payload.settlement_amount_cents >= 0"
          - "payload.settlement_amount_cents <= reserve_cents"
          - "Segregation of duties applies"
        side_effects:
          - "reserve_cents := 0"
          - "ClaimEvent(SETTLE) appended"

      - from: ADJUSTED
        to: DENIED
        trigger: "POST /productions/{prodId}/claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "reserve_cents := 0"
          - "ClaimEvent(DENY) appended"

      - from: SETTLED
        to: CLOSED
        trigger: "POST /productions/{prodId}/claims/{id}/close"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "ClaimEvent(CLOSE) appended"

      - from: DENIED
        to: CLOSED
        trigger: "POST /productions/{prodId}/claims/{id}/close"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "ClaimEvent(CLOSE) appended"

  - entity: ClearanceItem
    initial_state: PENDING
    terminal_states: [CLEARED, WAIVED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /productions/{prodId}/clearance-items/{id}/resolve"
        actor: ClearanceCounsel
        preconditions:
          - "payload.outcome == CLEARED"
        side_effects:
          - "Production.coverage_posture recomputed"

      - from: PENDING
        to: FLAGGED
        trigger: "POST /productions/{prodId}/clearance-items/{id}/resolve"
        actor: ClearanceCounsel
        preconditions:
          - "payload.outcome == FLAGGED"
        side_effects:
          - "Production.coverage_posture recomputed"

      - from: FLAGGED
        to: CLEARED
        trigger: "POST /productions/{prodId}/clearance-items/{id}/resolve"
        actor: ClearanceCounsel
        preconditions:
          - "payload.outcome == CLEARED"
        side_effects:
          - "Production.coverage_posture recomputed"

      - from: FLAGGED
        to: WAIVED
        trigger: "POST /productions/{prodId}/clearance-items/{id}/resolve"
        actor: ClearanceCounsel
        preconditions:
          - "payload.outcome == WAIVED"
          - "payload.waiver_justification non-empty"
        side_effects:
          - "Production.coverage_posture recomputed"

  - entity: CompletionBond
    initial_state: APPLIED
    terminal_states: [CLAIMED, RELEASED, LAPSED]
    transitions:
      - from: APPLIED
        to: UNDERWRITTEN
        trigger: "POST /productions/{prodId}/completion-bond/underwrite"
        actor: SuretyUnderwriter
        preconditions:
          - "Production.requires_completion_bond == true"
          - "Production.budget_cents > 0"
          - "bond_amount_cents >= ceil(budget_cents * BOND_COVER_MIN_PCT / 100)"
        side_effects:
          - "bond_premium_cents computed via bond_premium_calculate"
          - "strike_price_cents := bond_amount_cents"

      - from: UNDERWRITTEN
        to: ISSUED
        trigger: "POST /productions/{prodId}/completion-bond/issue"
        actor: SuretyUnderwriter
        preconditions:
          - "Production.coverage_posture in {BOUND_PARTIAL, BOUND_FULL} (ERR_POSTURE_BLOCKS_BOND)"
        side_effects: []

      - from: ISSUED
        to: CLAIMED
        trigger: "POST /productions/{prodId}/completion-bond/claim"
        actor: SuretyUnderwriter
        preconditions:
          - "Production has at least one Claim in {SUBMITTED, UNDER_REVIEW, ADJUSTED} whose loss_amount_cents >= strike_price_cents"
        side_effects:
          - "All Policies on production transition to CANCELLED"
          - "All Certificates transition to VOIDED"
          - "Production.coverage_posture recomputed"

      - from: ISSUED
        to: RELEASED
        trigger: "system (automatic on production wrap)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPLIED
        to: LAPSED
        trigger: "POST /productions/{prodId}/completion-bond/lapse"
        actor: SuretyUnderwriter
        preconditions:
          - "No claim has been made"
        side_effects: []

      - from: UNDERWRITTEN
        to: LAPSED
        trigger: "POST /productions/{prodId}/completion-bond/lapse"
        actor: SuretyUnderwriter
        preconditions: []
        side_effects: []

  - entity: ForeignTravelExtension
    initial_state: REQUESTED
    terminal_states: [EXPIRED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /productions/{prodId}/foreign-travel-extensions/{id}/approve"
        actor: UnderwriterAgent
        preconditions:
          - "Production.coverage_posture in {BOUND_PARTIAL, BOUND_FULL} (ERR_POSTURE_BLOCKS_FOREIGN)"
          - "A FOREIGN_TRAVEL Policy on the production is in {BOUND, ENDORSED_PENDING, ACTIVE}"
          - "travel_window overlaps [policy.effective_date, policy.expiry_date]"
        side_effects: []

      - from: REQUESTED
        to: DENIED
        trigger: "POST /productions/{prodId}/foreign-travel-extensions/{id}/deny"
        actor: UnderwriterAgent
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: ACTIVE
        trigger: "system (automatic when current_utc >= travel_window_start)"
        actor: system
        preconditions:
          - "current_utc >= travel_window_start"
        side_effects: []

      - from: APPROVED
        to: DENIED
        trigger: "POST /productions/{prodId}/foreign-travel-extensions/{id}/deny"
        actor: UnderwriterAgent
        preconditions:
          - "current_utc < travel_window_start"
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when current_utc > travel_window_end)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PayrollAudit
    initial_state: SCHEDULED
    terminal_states: [POSTED, DISPUTED]
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /productions/{prodId}/policies/{pid}/payroll-audits/{id}/submit"
        actor: ExternalAuditor
        preconditions:
          - "reported_payroll_cents >= 0"
          - "audit_period_end > audit_period_start"
        side_effects: []

      - from: SUBMITTED
        to: POSTED
        trigger: "POST /productions/{prodId}/policies/{pid}/payroll-audits/{id}/post"
        actor: BrokerAgent
        preconditions:
          - "Policy.status in {ACTIVE, EXPIRED} (cannot post audit against QUOTED/CANCELLED policy)"
        side_effects:
          - "Policy.audited_payroll_cents := reported_payroll_cents"
          - "Policy.final_premium_cents computed via final_premium_calculate"
          - "premium_delta_cents := final_premium_cents - provisional_premium_cents"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /productions/{prodId}/policies/{pid}/payroll-audits/{id}/dispute"
        actor: ProductionManager
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /productions/{prodId}/policies/{pid}/payroll-audits/{id}/submit"
        actor: ExternalAuditor
        preconditions: []
        side_effects: []

  - entity: RenewalOffer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /productions/{prodId}/policies/{pid}/renewal-offers/{id}/accept"
        actor: ProductionManager
        preconditions:
          - "current_utc < offer_expires_at (ERR_RENEWAL_OFFER_EXPIRED)"
          - "Policy.status in {ACTIVE, EXPIRED}"
          - "Policy has no PayrollAudit in {SCHEDULED, SUBMITTED} (ERR_AUDIT_PENDING_BLOCKS_RENEWAL)"
        side_effects:
          - "Policy transitions: expiry_date extended by renewal_term_months, status := ACTIVE if was EXPIRED, provisional_premium_cents := offered_premium_cents, audited_payroll_cents := null, final_premium_cents := null"
          - "version on Policy increments"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /productions/{prodId}/policies/{pid}/renewal-offers/{id}/decline"
        actor: ProductionManager
        preconditions: []
        side_effects: []

      - from: OFFERED
        to: EXPIRED
        trigger: "system (automatic when current_utc >= offer_expires_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OFFERED
        to: SUPERSEDED
        trigger: "system (automatic when a newer RenewalOffer for same policy transitions to OFFERED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: certificate-issue-stale-production
    parent_entity: Production
    write_endpoint: "POST /productions/{prodId}/certificates/{id}/issue"
    occ_field: "expected_production_version"
    description: |
      Issuing a Certificate against a Production whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just changed a coverage-affecting field (e.g.
      bound a new policy, revoked an endorsement, flagged a clearance item)
      and the current writer's view of coverage_posture is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: policy-bind-stale-production
    parent_entity: Production
    write_endpoint: "POST /productions/{prodId}/policies/{id}/bind"
    occ_field: "expected_production_version"
    description: |
      Binding a Policy against a Production whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just modified cast clearance or coverage state and
      the current writer's premium/posture computation would be against a
      stale snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: renewal-accept-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /productions/{prodId}/policies/{pid}/renewal-offers/{id}/accept"
    occ_field: "expected_policy_version"
    description: |
      Accepting a RenewalOffer against a Policy whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just posted a payroll audit or amended the
      policy's deductible/limits and the current writer's renewal terms
      would be computed against stale policy state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules
# =============================================================================
calculations:
  - name: provisional_premium_calculate
    trigger: "on Policy transition QUOTED → BOUND"
    algorithm: tiered_pricing
    formula: |
      # Multi-line tiered premium formula with conditional branches on
      # production_type and role-tier composition. Mode (a) — non-linear
      # interaction of >=3 inputs.
      #
      # base_rate_pct depends on coverage_line:
      #   GENERAL_LIABILITY : 0.0120  (120 bps)
      #   EQUIPMENT         : 0.0185
      #   CAST              : 0.0275
      #   ERRORS_OMISSIONS  : 0.0350
      #   FOREIGN_TRAVEL    : 0.0420
      #
      # risk_multiplier depends on production_type:
      #   FEATURE     : 1.00
      #   EPISODIC    : 1.15
      #   DOCUMENTARY : 0.85
      #   COMMERCIAL  : 0.90
      #   MUSIC_VIDEO : 1.05
      #
      # stunt_loading applies when coverage_line == CAST:
      #   stunt_loading = 1.0 + 0.10 * count(CastMember where role_tier == STUNT)
      #   (capped at 1.50)
      #
      # essential_element_loading applies when coverage_line == CAST:
      #   1.20 if any CastMember has essential_element == true, else 1.00
      #
      # foreign_travel_loading applies when coverage_line == FOREIGN_TRAVEL:
      #   1.0 + 0.05 * travelers_count (capped at 1.40)
      #
      # Raw premium (cents) =
      #   payroll_basis_cents
      #   * base_rate_pct
      #   * risk_multiplier
      #   * (stunt_loading if CAST else 1.0)
      #   * (essential_element_loading if CAST else 1.0)
      #   * (foreign_travel_loading if FOREIGN_TRAVEL else 1.0)
      #
      # Round to nearest cent (round_half_up) BEFORE minimum premium floor.
      # Apply MIN_PREMIUM_CENTS floor of 250_00 after rounding.
    input_set: "Policy being bound + Production + all CastMember rows for production"
    constants:
      MIN_PREMIUM_CENTS: 25000
      STUNT_LOADING_PER_STUNT: 0.10
      STUNT_LOADING_CAP: 1.50
      ESSENTIAL_ELEMENT_LOADING: 1.20
      FOREIGN_TRAVEL_LOADING_PER_TRAVELER: 0.05
      FOREIGN_TRAVEL_LOADING_CAP: 1.40
    precision: "0 decimal places (integer cents), round_half_up after each multiplication step"
    variants:
      - name: provisional
        when: "computed at bind time from declared payroll_basis_cents"
        difference: "uses declared payroll; result is provisional_premium_cents"
      - name: final
        when: "computed at payroll-audit post time from audited_payroll_cents"
        difference: "uses audited payroll; result is final_premium_cents; same formula otherwise"

  - name: final_premium_calculate
    trigger: "on PayrollAudit transition SUBMITTED → POSTED"
    algorithm: tiered_pricing
    formula: |
      # Same formula as provisional_premium_calculate but reading
      # audited_payroll_cents instead of payroll_basis_cents. Result is
      # stored in Policy.final_premium_cents.
      #
      # premium_delta_cents = final_premium_cents - provisional_premium_cents
      #   positive => production owes carrier the difference
      #   negative => carrier owes production a refund
    input_set: "PayrollAudit + Policy + Production"
    constants:
      MIN_PREMIUM_CENTS: 25000
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: posted
        when: "audit posted"
        difference: "stores final_premium_cents and premium_delta_cents on PayrollAudit"

  - name: claim_deductible_applied
    trigger: "on Claim creation (SUBMITTED state entry)"
    algorithm: threshold
    formula: |
      # Computes deductible portion the production absorbs on a claim.
      #
      # per_claim_deductible = Policy.deductible_cents
      #
      # cumulative_paid_deductibles_cents =
      #   sum(Claim.deductible_applied_cents)
      #   for claims on same Policy
      #   where status IN {UNDER_REVIEW, ADJUSTED, SETTLED}
      #   AND occurrence_date within same policy effective window
      #
      # annual_aggregate_cap = Policy.aggregate_limit_cents / 4
      #   (annual aggregate deductible cap is 25% of aggregate limit)
      #
      # remaining_cap_room =
      #   max(0, annual_aggregate_cap - cumulative_paid_deductibles_cents)
      #
      # deductible_applied_cents =
      #   min(per_claim_deductible, loss_amount_cents, remaining_cap_room)
      #
      # carrier_payable_cents =
      #   loss_amount_cents - deductible_applied_cents
      #
      # Boundary: when loss_amount_cents == per_claim_deductible exactly,
      # deductible_applied_cents == loss_amount_cents and
      # carrier_payable_cents == 0 (claim sits entirely on the production).
    input_set: "Claim being created + Policy + all prior claims on same Policy in {UNDER_REVIEW, ADJUSTED, SETTLED}"
    constants:
      AGGREGATE_DEDUCTIBLE_CAP_FRACTION: 0.25
    precision: "0 decimal places (integer cents), no rounding needed (subtraction only)"

  - name: bond_premium_calculate
    trigger: "on CompletionBond transition APPLIED → UNDERWRITTEN"
    algorithm: tiered_pricing
    formula: |
      # Tiered bond premium with nested rounding (mode b).
      # Order of rounding operations matters; this formula pins:
      #   per-tier rounding FIRST (each tier's contribution is rounded to
      #   integer cents using round_half_up), THEN sum the rounded tier
      #   contributions. Do NOT sum-then-round.
      #
      # Tier table on bond_amount_cents:
      #   Tier 1: 0              .. 1_000_000_00  ->  rate 0.0200
      #   Tier 2: 1_000_000_00   .. 5_000_000_00  ->  rate 0.0150
      #   Tier 3: 5_000_000_00   .. 25_000_000_00 ->  rate 0.0110
      #   Tier 4: > 25_000_000_00                 ->  rate 0.0085
      #
      # For each tier:
      #   tier_base = min(bond_amount_cents, tier_upper) - tier_lower
      #   tier_contribution_cents = round_half_up(tier_base * tier_rate)
      #
      # bond_premium_cents = sum(tier_contribution_cents)
      #
      # Boundary: bond_amount_cents == 1_000_000_00 sits entirely in Tier 1
      # (tier boundary is INCLUSIVE at the lower bound of the next tier;
      #  Tier 2 covers amounts strictly above 1_000_000_00).
    input_set: "CompletionBond + Production"
    constants:
      TIER1_UPPER_CENTS: 100000000
      TIER1_RATE: 0.0200
      TIER2_UPPER_CENTS: 500000000
      TIER2_RATE: 0.0150
      TIER3_UPPER_CENTS: 2500000000
      TIER3_RATE: 0.0110
      TIER4_RATE: 0.0085
      BOND_COVER_MIN_PCT: 50
    precision: "0 decimal places (integer cents), round_half_up applied per-tier BEFORE summation"

  - name: production_posture_derive
    trigger: "after every mutation on Production, Policy, CastEndorsement, ClearanceItem, Claim, CompletionBond, CastMember"
    algorithm: constraint_propagation
    formula: |
      # Derives Production.coverage_posture and posture_reasons from children.
      # Evaluation order is FIXED (this is a circular-looking dependency
      # pinned explicit — mode c):
      #
      #   step 1: bound_lines = set of Policy.coverage_line where
      #                       Policy.status IN {BOUND, ENDORSED_PENDING, ACTIVE}
      #
      #   step 2: required_lines = {GENERAL_LIABILITY, EQUIPMENT}
      #           if Production.production_type in {FEATURE, EPISODIC}:
      #             required_lines |= {CAST}
      #           if Production.requires_completion_bond:
      #             # completion bond is orthogonal to coverage_lines; no addition
      #             pass
      #
      #   step 3: missing_lines = required_lines - bound_lines
      #
      #   step 4: open_injury_claims = count(Claim where
      #                       claim_type == INJURY
      #                       AND status IN {SUBMITTED, UNDER_REVIEW, ADJUSTED})
      #
      #   step 5: uncleared_mandatory_clearances = count(ClearanceItem where
      #                       clearance_kind IN {SCRIPT, TITLE, PERSONAL_RIGHTS}
      #                       AND status IN {PENDING, FLAGGED})
      #
      #   step 6: failed_cast_exams = count(CastMember where
      #                       endorsement_required == true
      #                       AND physical_exam_status IN {PENDING, FAILED, EXPIRED})
      #
      #   step 7: bond_status = CompletionBond.status if requires_completion_bond
      #                       else null
      #
      #   step 8: posture =
      #     if Production.status == CANCELLED:                SUSPENDED
      #     elif open_injury_claims > 0:                      RESTRICTED
      #     elif uncleared_mandatory_clearances > 0:          RESTRICTED
      #     elif requires_completion_bond AND bond_status != ISSUED: RESTRICTED
      #     elif missing_lines is empty AND failed_cast_exams == 0: BOUND_FULL
      #     elif missing_lines is empty AND failed_cast_exams > 0:  BOUND_PARTIAL
      #     elif bound_lines is empty:                        UNBOUND
      #     else:                                             BOUND_PARTIAL
      #
      #   step 9: posture_reasons lists every contributing code, sorted:
      #           MISSING_LINE_<COVERAGE_LINE>
      #           OPEN_INJURY_CLAIM
      #           MANDATORY_CLEARANCE_OPEN_<KIND>
      #           CAST_EXAM_FAILED_<cast_member_id>
      #           BOND_NOT_ISSUED
      #
      # Note: posture_reasons sorted lexicographically for determinism.
    input_set: "Production + all Policy, Claim, ClearanceItem, CastMember, CompletionBond for that production"
    constants:
      MANDATORY_CLEARANCE_KINDS: "SCRIPT,TITLE,PERSONAL_RIGHTS"
    precision: "n/a (enumeration)"

  - name: certificate_coverage_window_validate
    trigger: "on Certificate ISSUED transition"
    algorithm: interval_merge
    formula: |
      # Validates the certificate's coverage window against:
      #   1. Production.principal_photography window (extended by +30 days)
      #   2. The intersection of every bound Policy's [effective_date, expiry_date]
      #      for the coverage_lines listed on the certificate
      #
      # certificate_window = [location_start, location_end]
      # allowed_outer = [production.principal_photography_start,
      #                  production.principal_photography_end + 30 days]
      #
      # for each line in certificate.coverage_lines:
      #   policy_window[line] = intersect of all bound policies'
      #                         [effective_date, expiry_date] on that line
      #
      # certificate_window MUST be a subset of allowed_outer AND a subset of
      # every policy_window[line].
      #
      # Boundary semantics: all intervals are half-open [start, end).
      # location_end == principal_photography_end + 30 days is ALLOWED
      # (touches the outer boundary exactly).
      # location_start == effective_date of a policy is ALLOWED.
      # location_end == expiry_date of a policy is NOT allowed
      # (would touch the upper exclusive boundary of policy window).
    input_set: "Certificate + Production + bound Policies"
    constants:
      POST_PRODUCTION_EXTENSION_DAYS: 30
    precision: "datetime (ISO8601), second precision"

  - name: foreign_travel_overlap_validate
    trigger: "on ForeignTravelExtension approval"
    algorithm: interval_merge
    formula: |
      # ForeignTravelExtension window must not overlap with another APPROVED
      # or ACTIVE extension on the same production for the same territory_code.
      # Interval semantics: half-open [travel_window_start, travel_window_end).
      # Two extensions with one starting exactly when the other ends
      # (travel_window_start_new == travel_window_end_existing) do NOT overlap.
      #
      # Additionally, the extension window must be a subset of
      # [production.principal_photography_start - 14 days,
      #  production.principal_photography_end + 14 days]
      # (pre-production scout and post-production wrap are allowed 14 days
      # beyond principal photography on each side).
    input_set: "ForeignTravelExtension + other extensions on same production with same territory_code"
    constants:
      FOREIGN_TRAVEL_BUFFER_DAYS: 14
    precision: "datetime (ISO8601), second precision"

  - name: loss_ratio_calculate
    trigger: "on RenewalOffer creation"
    algorithm: aggregation
    formula: |
      # loss_ratio_pct expresses prior-term incurred losses vs earned premium,
      # in basis-points-of-percent (i.e. 10000 = 100.00%).
      #
      # incurred_losses_cents =
      #   sum(Claim.loss_amount_cents - Claim.deductible_applied_cents)
      #   for claims on the policy where status IN {ADJUSTED, SETTLED, CLOSED}
      #   AND occurrence_date within policy effective window
      #
      # earned_premium_cents = policy.provisional_premium_cents
      #   (uses provisional, not final — audits are not always complete)
      #
      # if earned_premium_cents == 0:
      #   loss_ratio_pct = 0
      # else:
      #   loss_ratio_pct = round_half_up(
      #     incurred_losses_cents * 10000 / earned_premium_cents
      #   )
      #
      # Boundary: a policy with no claims yields loss_ratio_pct == 0.
      # A policy with incurred losses exactly equal to earned premium yields
      # loss_ratio_pct == 10000 (100.00%).
    input_set: "Policy + all Claims on policy in {ADJUSTED, SETTLED, CLOSED}"
    constants: {}
    precision: "0 decimal places, round_half_up; ratio expressed in basis-points-of-percent (10000 = 100.00%)"

  - name: renewal_premium_quote
    trigger: "on RenewalOffer creation"
    algorithm: tiered_pricing
    formula: |
      # Renewal premium starts from the prior-term premium, then applies
      # a loss-ratio loading factor:
      #
      #   base = policy.provisional_premium_cents
      #   ratio = loss_ratio_pct (from loss_ratio_calculate)
      #
      #   loading_factor:
      #     ratio < 3000   -> 0.90   (10% discount)
      #     3000 <= ratio < 6000   -> 1.00
      #     6000 <= ratio < 9000   -> 1.15
      #     ratio >= 9000  -> 1.40
      #
      #   offered_premium_cents = round_half_up(base * loading_factor)
      #
      # Boundary: ratio == 3000 exactly selects the 1.00 tier
      # (boundary is INCLUSIVE at lower bound of higher tier).
      # ratio == 6000 selects 1.15; ratio == 9000 selects 1.40.
    input_set: "Policy + computed loss_ratio_pct"
    constants:
      RATIO_T1_MAX: 3000
      RATIO_T1_FACTOR: 0.90
      RATIO_T2_MAX: 6000
      RATIO_T2_FACTOR: 1.00
      RATIO_T3_MAX: 9000
      RATIO_T3_FACTOR: 1.15
      RATIO_T4_FACTOR: 1.40
    precision: "0 decimal places (integer cents), round_half_up"

# =============================================================================
# Table 4: Validation Rules (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in declared role set"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-ID header present for entity_backed roles; well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role authorized for this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path-template ids (production, policy, claim, certificate, etc.) exist; left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Referenced body FKs (policy_id, cast_member_id, etc.) resolve to existing entities"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all mutation endpoints"

  - priority: 6
    category: state
    check: "Target entity in valid `from` state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "Stale expected_*_version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /productions/{prodId}/certificates/{id}/issue, POST /productions/{prodId}/policies/{id}/bind, POST /productions/{prodId}/policies/{pid}/renewal-offers/{id}/accept"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: claims adjuster cannot settle a claim they themselves submitted"
    error_id: ERR_SELF_SETTLEMENT_FORBIDDEN
    http_status: 403
    applies_to: "POST /productions/{prodId}/claims/{id}/settle"

  - priority: 9
    category: business_safety
    check: "Production.coverage_posture permits the requested operation (certificate issuance, foreign-travel approval, bond issuance)"
    error_id: ERR_POSTURE_BLOCKS_ISSUANCE
    http_status: 422
    applies_to: "POST /productions/{prodId}/certificates/{id}/issue, POST /productions/{prodId}/foreign-travel-extensions/{id}/approve, POST /productions/{prodId}/completion-bond/issue"

  - priority: 10
    category: business_safety
    check: "Cast endorsement gating: cast member exam status / essential_element / role_tier matches endorsement_type"
    error_id: ERR_CAST_ENDORSEMENT_INVALID
    http_status: 422
    applies_to: "POST /productions/{prodId}/cast-endorsements/{id}/issue"

  - priority: 11
    category: business_referential
    check: "FK target state compatible (e.g., Policy referenced by Claim in claimable status, CompletionBond on production with requires_completion_bond)"
    error_id: ERR_REFERENCED_STATE_INVALID
    http_status: 422
    applies_to: "POST /productions/{prodId}/claims, POST /productions/{prodId}/completion-bond/underwrite"

  - priority: 12
    category: business_constraint
    check: "Required field presence (e.g., additional_insured_name on LOCATION/PERMIT certificate types)"
    error_id: ERR_ADDITIONAL_INSURED_REQUIRED
    http_status: 400
    applies_to: "POST /productions/{prodId}/certificates, POST /productions/{prodId}/certificates/{id}/issue"

  - priority: 13
    category: business_constraint
    check: "Field shape and enum membership (coverage_line, claim_type, endorsement_type, etc.)"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 14
    category: business_temporal
    check: "Datetime ordering: end > start, occurrence within policy window, travel window within buffer"
    error_id: ERR_TEMPORAL_RANGE_INVALID
    http_status: 422
    applies_to: "endpoints accepting datetime ranges"

  - priority: 15
    category: business_temporal
    check: "Certificate coverage window within allowed outer window AND all bound policy windows (half-open)"
    error_id: ERR_CERT_WINDOW_OUTSIDE_POLICY
    http_status: 422
    applies_to: "POST /productions/{prodId}/certificates/{id}/issue"

  - priority: 16
    category: business_temporal
    check: "ForeignTravelExtension no-overlap with same-territory extensions AND within production buffer window"
    error_id: ERR_FOREIGN_TRAVEL_OVERLAP
    http_status: 422
    applies_to: "POST /productions/{prodId}/foreign-travel-extensions/{id}/approve"

  - priority: 17
    category: business_temporal
    check: "current_utc constraints (renewal offer not expired, certificate window not elapsed)"
    error_id: ERR_WINDOW_ELAPSED
    http_status: 422
    applies_to: "POST /productions/{prodId}/policies/{pid}/renewal-offers/{id}/accept, POST /productions/{prodId}/certificates/{id}/issue"

  - priority: 18
    category: business_fiscal
    check: "Fiscal sanity: loss_amount > 0, bond_amount >= min pct of budget, settlement <= reserve"
    error_id: ERR_FISCAL_CONSTRAINT_VIOLATED
    http_status: 422
    applies_to: "POST /productions/{prodId}/claims, POST /productions/{prodId}/completion-bond/underwrite, POST /productions/{prodId}/claims/{id}/settle"

  - priority: 19
    category: business_fiscal
    check: "Aggregate deductible cap not exceeded (computation path)"
    error_id: ERR_DEDUCTIBLE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /productions/{prodId}/claims"

  - priority: 20
    category: business_constraint
    check: "Conditional uniqueness: certificate_number, policy_number per (carrier_code, coverage_line)"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /productions/{prodId}/policies, POST /productions/{prodId}/certificates"

# =============================================================================
# Table 5: API Endpoints
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set server logical clock. Server boots with logical clock = 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock before the first set_current_utc call."
    roles: [PlatformOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "datetime" }
    side_effects: ["triggers all time-based auto-transitions whose threshold has been crossed"]

  # --- Production ---
  - method: POST
    path: "/productions"
    description: "Create a new Production"
    roles: [BrokerAgent]
    code: 201
    input: [production_code, title, production_type, principal_photography_start, principal_photography_end, budget_cents, "requires_completion_bond?"]
    output: Production
    side_effects: ["initial coverage_posture := UNBOUND"]

  - method: GET
    path: "/productions"
    description: "List productions with pagination"
    roles: [BrokerAgent, ProductionManager, UnderwriterAgent, ClaimsAdjuster, ClearanceCounsel, SuretyUnderwriter, ExternalAuditor, PlatformOperator]
    code: 200
    input: ["limit?", "offset?", "status?", "coverage_posture?"]
    output: Production[]
    side_effects: []

  - method: GET
    path: "/productions/{id}"
    description: "Get production by id"
    roles: [BrokerAgent, ProductionManager, UnderwriterAgent, ClaimsAdjuster, ClearanceCounsel, SuretyUnderwriter, ExternalAuditor, PlatformOperator]
    code: 200
    input: []
    output: Production
    side_effects: []

  - method: POST
    path: "/productions/{id}/activate"
    description: "Transition Production DRAFT → ACTIVE"
    roles: [BrokerAgent]
    code: 200
    input: []
    output: Production
    side_effects: ["coverage_posture recomputed"]

  - method: POST
    path: "/productions/{id}/wrap"
    description: "Transition Production ACTIVE → WRAPPED"
    roles: [ProductionManager]
    code: 200
    input: []
    output: Production
    side_effects: ["ISSUED certificates expire", "ACTIVE travel extensions expire", "ISSUED bond releases", "PayrollAudit task scheduled per ACTIVE policy"]

  - method: POST
    path: "/productions/{id}/cancel"
    description: "Transition Production {DRAFT, ACTIVE} → CANCELLED"
    roles: [BrokerAgent]
    code: 200
    input: []
    output: Production
    side_effects: ["policies cancelled", "certificates voided", "endorsements revoked", "bond lapsed", "travel extensions denied", "posture recomputed"]

  # --- Policies ---
  - method: POST
    path: "/productions/{id}/policies"
    description: "Create a Policy in QUOTED state"
    roles: [BrokerAgent]
    code: 201
    input: [coverage_line, carrier_code, policy_number, limit_cents, aggregate_limit_cents, deductible_cents, effective_date, expiry_date, payroll_basis_cents]
    output: Policy
    side_effects: []

  - method: GET
    path: "/productions/{id}/policies"
    description: "List policies for a production"
    roles: [BrokerAgent, ProductionManager, UnderwriterAgent, ClaimsAdjuster, ExternalAuditor, PlatformOperator]
    code: 200
    input: ["limit?", "offset?", "coverage_line?", "status?"]
    output: Policy[]
    side_effects: []

  - method: GET
    path: "/productions/{id}/policies/{childId}"
    description: "Get policy"
    roles: [BrokerAgent, ProductionManager, UnderwriterAgent, ClaimsAdjuster, ExternalAuditor, PlatformOperator]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/productions/{id}/policies/{childId}/bind"
    description: "Bind a QUOTED policy (computes provisional premium)"
    roles: [BrokerAgent]
    code: 200
    input: [expected_production_version]
    output: Policy
    side_effects: ["provisional_premium_cents computed", "Production.version incremented", "coverage_posture recomputed"]

  - method: POST
    path: "/productions/{id}/policies/{childId}/cancel"
    description: "Cancel a BOUND or ACTIVE policy"
    roles: [BrokerAgent]
    code: 200
    input: []
    output: Policy
    side_effects: ["endorsements revoked", "certificates voided if policy was ACTIVE", "posture recomputed"]

  # --- Cast Members ---
