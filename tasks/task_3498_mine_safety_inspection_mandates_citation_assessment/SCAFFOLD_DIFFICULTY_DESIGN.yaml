              captures: { insp1: $.data.id }
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
          trigger:
