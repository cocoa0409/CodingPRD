# =============================================================================
# PRD Benchmark Seed Tables — task_3029
# Autoship Cadence Optimization & Veterinary Prescription Verification (Chewy)
# =============================================================================

scenario: |
  Autoship Cadence Optimization & Veterinary Prescription Verification (Chewy): autoship enrollment with per-item cadence, discount on first and recurring orders and bundling of due items, prescription item ordering requiring veterinarian authorization by clinic contact, uploaded script or written prescription, clinic verification workflow with callback attempts, approval expiry and refill quantity limits, controlled and temperature-sensitive medication handling with cold-pack shipping, cadence adjustment prompts based on pet weight, dosage and consumption modeling, order cancellation and pet-passing handling with compassionate refunds, pharmacy licensing by state and shipping restrictions, autoship price protection and promotion stacking rules

domain_name: autoship-rx-cadence
api_prefix: /v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_deferred_actions
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: delegated_authority
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Pet
    parent: null
    common_fields: false
    fields:
      - { name: pet_name, type: string, source: input, description: "Pet display name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | HORSE | BIRD", constraints: "one of DOG, CAT, HORSE, BIRD" }
      - { name: breed, type: string, source: input, description: "Breed label" }
      - { name: weight_kg, type: number, source: input, description: "Latest recorded body weight in kilograms; dosage_mg_per_day and consumption_cycle_days recompute from it" }
      - { name: owner_state, type: string, source: input, description: "Two-letter state code of the pet owner's shipping address; becomes Shipment.destination_state" }
      - { name: pet_status, type: enum, source: system, description: "ACTIVE | PASSED", constraints: "starts ACTIVE; PASSED is terminal" }
      - { name: passed_at, type: datetime, source: system, description: "Instant the passing was reported; null while pet_status == ACTIVE" }
      - { name: pet_lifecycle_state, type: enum, source: computed, description: "ALIVE | PASSED | ARCHIVED; output of pet_state_tracking, derived from pet_status together with the linked review_status" }
      - { name: compassionate_review_id, type: string, source: system, description: "FK -> CompassionateReview.id; the review opened for the reported passing; null until a passing is reported" }

  - name: Veterinarian
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Veterinarian full name" }
      - { name: clinic_name, type: string, source: input, description: "Practice name recorded on the authorization" }
      - { name: clinic_phone, type: string, source: input, description: "Clinic callback number dialled by the verification workflow" }
      - { name: vet_email, type: string, source: input, description: "Veterinarian contact email; normalized (lowercased and trimmed) before comparison with written_prescriber_email_hash" }
      - { name: license_number, type: string, source: input, description: "State veterinary license number" }
      - { name: license_state, type: string, source: input, description: "Two-letter state code the veterinary license was issued in" }
      - { name: vet_status, type: enum, source: system, description: "LISTED | VETERINARIAN_VERIFIED | SUSPENDED | RETIRED | BLOCKED", constraints: "starts LISTED; only LISTED and VETERINARIAN_VERIFIED may authorize a prescription" }

  - name: PharmacySite
    parent: null
    common_fields: true
    fields:
      - { name: site_code, type: string, source: input, description: "Site short code; the ascending sort key of origin_site_selection", constraints: "unique across sites" }
      - { name: site_state, type: string, source: input, description: "Two-letter state code the site ships from" }
      - { name: licensed_states, type: array, source: input, description: "Two-letter state codes this site may dispense into; a PRESCRIPTION-scope order may only ship to a destination_state contained in this list" }
      - { name: cold_pack_capacity_units, type: integer, source: input, description: "Maximum cold-pack units the site may have committed at once", constraints: ">= 0" }
      - { name: csr_registered, type: boolean, source: input, description: "Whether the site holds a controlled-substance registration; a CII prescription may not be authorized unless every site licensed for the owning pet's owner_state has this true" }
      - { name: cold_pack_committed_units, type: integer, source: system, description: "Cold-pack units currently committed by non-terminal shipments; recomputed by cold_pack_reserved_units" }
      - { name: site_status, type: enum, source: system, description: "ACTIVE | RESTRICTED | CLOSED", constraints: "starts ACTIVE; CLOSED sites are ineligible origins" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU", constraints: "unique across products" }
      - { name: product_name, type: string, source: input, description: "Display name" }
      - { name: medication_scope, type: enum, source: input, description: "OTC | PRESCRIPTION", constraints: "PRESCRIPTION products require a VERIFIED prescription on the scheduling item" }
      - { name: cold_pack_required, type: boolean, source: input, description: "When true the product ships cold and consumes cold-pack units" }
      - { name: unit_dose_mg_per_kg, type: number, source: input, description: "Milligrams of active ingredient per kilogram of body weight per day", constraints: "> 0" }
      - { name: pack_size_units, type: integer, source: input, description: "Dispensing units contained in one sellable pack", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Catalog list price for one pack in cents; mutated by POST /v1/products/{id}/price" }

  - name: AutoshipPlan
    parent: Pet
    common_fields: true
    fields:
      - { name: pet_id, type: string, source: system, description: "FK -> Pet.id; the pet this plan replenishes" }
      - { name: plan_status, type: enum, source: system, description: "ACTIVE | PAUSED | SUSPENDED | CANCELED | COMPASSIONATE_CANCELED", constraints: "starts ACTIVE" }
      - { name: autoship_discount_eligibility, type: enum, source: computed, description: "ELIGIBLE | INELIGIBLE; set INELIGIBLE by the verification-failure cascade hop 4" }
      - { name: next_order_due_date, type: datetime, source: computed, description: "Earliest autoship_item_next_due_date across items with item_status == ACTIVE; null when the plan has no ACTIVE items" }
      - { name: autoship_item_count, type: integer, source: computed, description: "Count of items with item_status IN {ACTIVE, PAUSED}" }
      - { name: cadence_prompt_due_date, type: datetime, source: computed, description: "cadence_prompt_due_days_delta base date minus the prompt delta; the deferral date of the next cadence prompt" }
      - { name: cadence_prompt_due_days_delta, type: integer, source: computed, description: "Output of cadence_prompt_due_days_delta" }
      - { name: blackout_start_date, type: datetime, source: input, description: "Optional start of an interval during which the plan accepts no new order windows; null when unset" }
      - { name: blackout_end_date, type: datetime, source: input, description: "Optional end of the blackout interval; null when unset" }
      - { name: released_refunds_cents, type: integer, source: computed, description: "Sum of refunded_amount_cents over every order of the plan; written by payment_settlement_net" }
      - { name: transaction_adjustments_cents, type: integer, source: computed, description: "Sum of settlement_net_cents over every order of the plan; written by payment_settlement_net" }

  - name: AutoshipItem
    parent: AutoshipPlan
    common_fields: true
    fields:
      - { name: autoship_plan_id, type: string, source: system, description: "FK -> AutoshipPlan.id; the plan this item belongs to" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; the product scheduled for recurring delivery" }
      - { name: item_status, type: enum, source: system, description: "ACTIVE | PAUSED | COMPLETED | CANCELED", constraints: "starts ACTIVE" }
      - { name: verification_state, type: enum, source: computed, description: "UNVERIFIED | VERIFIED | BLOCKED | EXPIRATION_MARKED; BLOCKED is written by the verification-failure cascade hop 2 and cleared only by POST /v1/prescriptions/{id}/reopen" }
      - { name: cadence_days, type: integer, source: input, description: "Recurring cadence in days", constraints: "one of 14, 21, 28, 42, 56, 84" }
      - { name: autoship_item_next_due_date, type: datetime, source: computed, description: "Next date this item is due; advanced exactly once per composed order by advance_item_cadence" }
      - { name: unit_lifecycle_equivalent_days, type: integer, source: computed, description: "Output of consumption_cycle_days for this item's pet and product" }
      - { name: cadence_prompt_state, type: enum, source: computed, description: "UNDER_CONSUMPTION | ALIGNED | OVER_CONSUMPTION; output of cadence_prompt_due_days_delta" }
      - { name: default_quantity, type: integer, source: input, description: "Units dispensed on each recurring order", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Price currently charged per unit; mirrors Product.unit_price_cents" }
      - { name: price_protected_unit_price_cents, type: integer, source: computed, description: "Price locked at the plan's first composed order by autoship_price_protection; null until then" }
      - { name: protection_state, type: enum, source: computed, description: "PROTECTED | REPRICED; output of autoship_price_protection, reading the price_protected_unit_price_cents guard" }

  - name: Prescription
    parent: AutoshipItem
    common_fields: true
    fields:
      - { name: autoship_item_id, type: string, source: system, description: "FK -> AutoshipItem.id; the item this prescription authorizes" }
      - { name: prescriber_id, type: string, source: system, description: "FK -> Veterinarian.id; the veterinarian of record" }
      - { name: rx_status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFICATION_IN_PROGRESS | VERIFIED | VERIFICATION_FAILED | EXPIRED", constraints: "starts PENDING_VERIFICATION" }
      - { name: script_source, type: enum, source: input, description: "UPLOADED_SCRIPT | WRITTEN_PRESCRIPTION" }
      - { name: script_document_id, type: string, source: input, description: "Uploaded script document reference; required when script_source == UPLOADED_SCRIPT" }
      - { name: written_prescriber_email_hash, type: string, source: input, description: "Normalized email of the prescriber named on a written prescription; required when script_source == WRITTEN_PRESCRIPTION and must equal the normalized prescriber vet_email" }
      - { name: drug_schedule, type: enum, source: input, description: "NONE | CII | CIII | CIV | CV", constraints: "one of NONE, CII, CIII, CIV, CV" }
      - { name: temperature_sensitive, type: boolean, source: input, description: "When true the shipment carrying this prescription needs cold-pack coverage" }
      - { name: authorized_qty_total, type: integer, source: input, description: "Total units the veterinarian authorized", constraints: ">= 1" }
      - { name: authorized_qty_remaining, type: integer, source: computed, description: "Units still dispensable; debited by refill_units_consumed on each composed order" }
      - { name: refills_authorized, type: integer, source: input, description: "Refills the veterinarian authorized", constraints: ">= 0" }
      - { name: refills_used, type: integer, source: computed, description: "Refills consumed; advanced by one per composed order" }
      - { name: verification_expires_at, type: datetime, source: computed, description: "Output of verification_expiry_stamp; the authorization interval is half-open and closes at this instant" }
      - { name: callback_attempt_count, type: integer, source: system, description: "Clinic callback attempts recorded so far", constraints: "0..3" }

  - name: Order
    parent: AutoshipPlan
    common_fields: true
    fields:
      - { name: autoship_plan_id, type: string, source: system, description: "FK -> AutoshipPlan.id; the plan this order was composed from" }
      - { name: order_kind, type: enum, source: system, description: "FIRST | RECURRING", constraints: "FIRST only for the plan's first successfully composed order" }
      - { name: order_status, type: enum, source: system, description: "PLACED | PROCESSING | SHIPPED | AWAITING_PET_PASSING_DECISION | DELIVERED | CANCELED", constraints: "starts PLACED" }
      - { name: composed_at, type: datetime, source: system, description: "Logical instant the order was composed" }
      - { name: bundle_line_count, type: integer, source: computed, description: "Number of order lines bundled into this order; 0 when no item was due at compose time", constraints: ">= 0" }
      - { name: merchandise_subtotal_cents, type: integer, source: computed, description: "Sum of line_item_subtotal_cents over this order's lines; evaluated before any discount" }
      - { name: autoship_discount_cents, type: integer, source: computed, description: "Output of autoship_promo_reconciliation, which starts from autoship_first_order_discount_cents" }
      - { name: residual_promo_discount_cents, type: integer, source: computed, description: "Portion of the promotion moved into autoship_discount_cents by autoship_promo_reconciliation; 0 when no promotion applies" }
      - { name: order_total_cents, type: computed, source: computed, description: "Payable total; always equal to order_total_components_sum" }
      - { name: order_total_components_sum, type: integer, source: computed, description: "merchandise_subtotal_cents - autoship_discount_cents + cold_pack_fee_cents + expedited_shipping_fee_cents; recomputed so order_total_cents always equals it" }
      - { name: cold_pack_fee_cents, type: integer, source: computed, description: "599 when at least one order line is cold-pack-required, otherwise exactly 0" }
      - { name: expedited_shipping_fee_cents, type: integer, source: computed, description: "990 when at least one line carries a prescription with drug_schedule IN {CII, CIII}, otherwise exactly 0" }
      - { name: promotion_code, type: string, source: input, description: "Optional promotion code evaluated by autoship_promo_reconciliation" }
      - { name: cancellation_reason, type: enum, source: input, description: "CUSTOMER_REQUEST | NON_DELIVERY | PET_PASSED | null" }
      - { name: refunded_amount_cents, type: integer, source: computed, description: "Output of order_cancellation_settlement; 0 until the order is canceled or a compassionate review is approved" }
      - { name: settlement_net_cents, type: integer, source: computed, description: "order_total_cents - refunded_amount_cents; written by payment_settlement_net" }
      - { name: settlement_payment_balance_cents, type: integer, source: computed, description: "Standing balance reconciled by payment_settlement_net: order.settlement_payment_balance_cents + order_total_cents - order.refunded_amount_cents" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order this line belongs to" }
      - { name: autoship_item_id, type: string, source: system, description: "FK -> AutoshipItem.id; the item this line was composed from" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; the product dispensed on this line" }
      - { name: quantity, type: integer, source: system, description: "Units dispensed on this line", constraints: ">= 1" }
      - { name: line_unit_price_cents, type: integer, source: computed, description: "Unit price actually charged after autoship_price_protection" }
      - { name: line_autoship_discount_cents, type: integer, source: computed, description: "Per-line share of the autoship discount, rounded per line by autoship_first_order_discount_cents" }
      - { name: line_item_subtotal_cents, type: integer, source: computed, description: "line_unit_price_cents * quantity" }
      - { name: line_requires_clinic_auth, type: boolean, source: computed, description: "True when the line's product has medication_scope == PRESCRIPTION" }

  - name: Shipment
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order being shipped" }
      - { name: origin_site_id, type: string, source: system, description: "FK -> PharmacySite.id; the dispensing site chosen by origin_site_selection" }
      - { name: destination_state, type: string, source: system, description: "Two-letter destination state copied from the owning pet's owner_state" }
      - { name: shipment_status, type: enum, source: system, description: "PENDING | PACKED | DISPATCHED | AWAITING_PET_PASSING_DECISION | DELIVERED | CANCELED", constraints: "starts PENDING" }
      - { name: cold_pack_required, type: boolean, source: computed, description: "True when any line's product has cold_pack_required true" }
      - { name: cold_pack_units, type: integer, source: computed, description: "Units reserved; output of cold_pack_thermal_reserve" }
      - { name: transit_window_start_date, type: datetime, source: computed, description: "Start of the shipment's transit interval; equals the dispatch instant" }
      - { name: transit_window_end_date, type: datetime, source: computed, description: "Exclusive end of the shipment's transit interval; the interval is half-open [start, end) with a 1-day buffer appended before overlap is tested" }
      - { name: tracking_code, type: string, source: system, description: "Carrier tracking code; null until DISPATCHED" }

  - name: ColdPackReservation
    parent: Shipment
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; the shipment consuming cold-pack capacity" }
      - { name: site_id, type: string, source: system, description: "FK -> PharmacySite.id; the site whose capacity is reserved" }
      - { name: units, type: integer, source: computed, description: "Units reserved for this shipment; output of cold_pack_thermal_reserve" }
      - { name: reservation_status, type: enum, source: system, description: "HELD | CONSUMED | RELEASED", constraints: "starts HELD" }

  - name: CompassionateReview
    parent: null
    common_fields: true
    fields:
      - { name: pet_id, type: string, source: system, description: "FK -> Pet.id; the pet whose passing opened this review" }
      - { name: affected_shipment_id, type: string, source: system, description: "FK -> Shipment.id; the in-transit shipment parked for this review; null when no shipment was mid-flight" }
      - { name: review_status, type: enum, source: system, description: "OPEN | APPROVED | REJECTED", constraints: "starts OPEN" }
      - { name: refund_destination, type: enum, source: input, description: "WALLET | ORIGINAL_PAYMENT" }
      - { name: refunded_amount_cents, type: integer, source: computed, description: "Output of order_cancellation_settlement when the review is approved, otherwise 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: AutoshipPlan
    field: plan_status
    initial_state: ACTIVE
    terminal_states: [CANCELED, COMPASSIONATE_CANCELED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /v1/autoship-plans/{id}/pause"
        actor: Customer
        preconditions:
          - "plan_status == ACTIVE"
          - "no Order under this plan is in order_status PROCESSING"
        side_effects:
          - "plan_status := PAUSED"
          - "items keep their item_status; composition now returns ERR_PLAN_PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /v1/autoship-plans/{id}/resume"
        actor: Customer
        preconditions: ["plan_status == PAUSED"]
        side_effects:
          - "plan_status := ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/autoship-plans/{id}/suspend"
        actor: CustomerService
        preconditions: ["plan_status == ACTIVE"]
        side_effects:
          - "plan_status := SUSPENDED"
          - "hop 1 of the pet-passing cascade: every Shipment whose parent Order belongs to this plan and whose shipment_status == DISPATCHED becomes AWAITING_PET_PASSING_DECISION"
          - "hop 2 of the pet-passing cascade: each such Order's SHIPPED -> AWAITING_PET_PASSING_DECISION transition is parked, so the order stops advancing"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/autoship-plans/{id}/resume"
        actor: Customer
        preconditions: ["plan_status == SUSPENDED"]
        side_effects: ["plan_status := ACTIVE"]
      - from: ACTIVE
        to: CANCELED
        trigger: "POST /v1/autoship-plans/{id}/cancel"
        actor: Customer
        preconditions:
          - "plan_status IN {ACTIVE, PAUSED, SUSPENDED}"
          - "cancellation_reason is present"
        side_effects:
          - "plan_status := CANCELED"
          - "every Order under this plan whose order_status IN {PLACED, PROCESSING} becomes CANCELED and its Shipment becomes CANCELED"
          - "cold_pack_reserved_units releases each canceled shipment's reservation at its origin site"
      - from: ACTIVE
        to: COMPASSIONATE_CANCELED
        trigger: "system (the owning Pet's pet_status flips ALIVE -> PASSED)"
        actor: system
        preconditions:
          - "plan_status IN {ACTIVE, PAUSED, SUSPENDED}"
          - "Pet.pet_status == PASSED"
        side_effects:
          - "plan_status := COMPASSIONATE_CANCELED"
          - "hop 3 of the pet-passing cascade: every Shipment under this plan's orders that is DISPATCHED becomes AWAITING_PET_PASSING_DECISION"
          - "hop 4 of the pet-passing cascade: each of those Orders goes SHIPPED -> AWAITING_PET_PASSING_DECISION"

  - entity: AutoshipItem
    field: item_status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /v1/autoship-plans/{plan_id}/items/{item_id}/pause"
        actor: Customer
        preconditions: ["item_status == ACTIVE"]
        side_effects:
          - "item_status := PAUSED"
          - "AutoshipPlan.autoship_item_count recomputed over items with item_status IN {ACTIVE, PAUSED}"
          - "AutoshipPlan.next_order_due_date recomputed over remaining ACTIVE items"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /v1/autoship-plans/{plan_id}/items/{item_id}/resume"
        actor: Customer
        preconditions: ["item_status == PAUSED"]
        side_effects:
          - "item_status := ACTIVE"
          - "AutoshipPlan.next_order_due_date recomputed"
      - from: ACTIVE
        to: CANCELED
        trigger: "POST /v1/autoship-plans/{plan_id}/items/{item_id}/cancel"
        actor: Customer
        preconditions: ["item_status IN {ACTIVE, PAUSED}"]
        side_effects:
          - "item_status := CANCELED"
          - "AutoshipPlan.autoship_item_count and next_order_due_date recomputed"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/autoship-plans/{id}/compose (per-item cadence advance)"
        actor: Customer
        preconditions:
          - "item_status == ACTIVE"
          - "autoship_item_next_due_date <= current logical date"
          - "AutoshipItem.verification_state != BLOCKED"
        side_effects:
          - "advance_item_cadence: autoship_item_next_due_date := autoship_item_next_due_date + cadence_days, applied once per composed order in ascending (autoship_item_next_due_date, created_at) order"
          - "AutoshipPlan.next_order_due_date recomputed"
        note: "Self-loop cycle: this transition is the only writer of autoship_item_next_due_date and is re-entered on every subsequent compose."
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (the item's prescription authorized_qty_remaining reaches 0)"
        actor: system
        preconditions: ["the owning Prescription.authorized_qty_remaining == 0"]
        side_effects:
          - "item_status := COMPLETED"
          - "AutoshipPlan.autoship_item_count and next_order_due_date recomputed"

  - entity: Prescription
    field: rx_status
    initial_state: PENDING_VERIFICATION
    terminal_states: [EXPIRED, VERIFICATION_FAILED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFICATION_IN_PROGRESS
        trigger: "POST /v1/prescriptions/{id}/clinic-contacts"
        actor: PharmacyTechnician
        preconditions:
          - "rx_status IN {PENDING_VERIFICATION, VERIFICATION_IN_PROGRESS}"
          - "callback_attempt_count < 3"
        side_effects:
          - "rx_status := VERIFICATION_IN_PROGRESS"
          - "callback_attempt_count := callback_attempt_count + 1"
          - "AutoshipItem.version advanced by 1 (the parent item's version tracks its prescription's verification activity)"
      - from: VERIFICATION_IN_PROGRESS
        to: VERIFICATION_IN_PROGRESS
        trigger: "POST /v1/prescriptions/{id}/clinic-contacts (second attempt, or a repeat call below the cap)"
        actor: PharmacyTechnician
        preconditions:
          - "rx_status == VERIFICATION_IN_PROGRESS"
          - "callback_attempt_count < call n, and call n <= 3"
        side_effects:
          - "callback_attempt_count := callback_attempt_count + 1"
          - "the item's autoship_item_next_due_date is re-pulled to the prescription's verification lead time by recompute_item_due_after_verification"
        note: "Self-loop cycle: the callback workflow may be re-entered until the attempt cap is reached."
      - from: VERIFICATION_IN_PROGRESS
        to: VERIFIED
        trigger: "POST /v1/prescriptions/{id}/clinic-authorizations"
        actor: ClinicContact
        preconditions:
          - "rx_status IN {PENDING_VERIFICATION, VERIFICATION_IN_PROGRESS}"
          - "the authorizing identity resolves to a Veterinarian that is this prescription's prescriber_id"
          - "the Veterinarian's vet_status IN {LISTED, VETERINARIAN_VERIFIED}"
          - "script_source == UPLOADED_SCRIPT and script_document_id present, OR script_source == WRITTEN_PRESCRIPTION and written_prescriber_email_hash equals the normalized vet_email"
          - "authorized_qty_total >= 1 and refills_authorized >= 0"
        side_effects:
          - "rx_status := VERIFIED"
          - "the prescriber's vet_status LISTED -> VETERINARIAN_VERIFIED"
          - "recompute_item_due_after_verification recomputes the owning AutoshipItem's autoship_item_next_due_date"
          - "verification_expiry_stamp runs: verification_expires_at := current logical date + 365 days"
          - "the owning AutoshipItem's verification_state UNVERIFIED -> VERIFIED"
      - from: VERIFICATION_IN_PROGRESS
        to: VERIFICATION_FAILED
        trigger: "POST /v1/prescriptions/{id}/clinic-contacts (the third attempt)"
        actor: PharmacyTechnician
        preconditions: ["callback_attempt_count == 2 and rx_status == VERIFICATION_IN_PROGRESS"]
        side_effects:
          - "rx_status := VERIFICATION_FAILED"
          - "callback_attempt_count := 3"
          - "hop 1 of the verification-failure cascade: AutoshipItem.verification_state UNVERIFIED -> BLOCKED (prescription_block_applied)"
          - "hop 2 of the verification-failure cascade: AutoshipPlan.plan_status ACTIVE -> SUSPENDED because a live item on the plan is BLOCKED (plan_suspended_on_item_block)"
          - "hop 3 of the verification-failure cascade: AutoshipPlan.autoship_discount_eligibility ELIGIBLE -> INELIGIBLE because the plan carries a BLOCKED item (discount_eligibility_revoked)"
      - from: VERIFIED
        to: VERIFIED
        trigger: "POST /v1/orders/{id}/ship (refill consumption)"
        actor: PharmacyTechnician
        preconditions:
          - "refills_used < refills_authorized"
          - "refill_units_consumed <= authorized_qty_remaining"
        side_effects:
          - "authorized_qty_remaining := authorized_qty_remaining - refill_units_consumed"
          - "refills_used := refills_used + 1"
        note: "Self-loop cycle: one iteration per refill dispensed."
      - from: VERIFIED
        to: VERIFICATION_FAILED
        trigger: "system (the owning item's verification lapsed while the prescription was under review)"
        actor: system
        preconditions:
          - "the owning Veterinarian's vet_status becomes SUSPENDED or BLOCKED"
        side_effects:
          - "rx_status := VERIFICATION_FAILED"
          - "hop 1 of the verification-failure cascade: AutoshipItem.verification_state VERIFIED -> BLOCKED"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (the clock advances to or past verification_expires_at)"
        actor: system
        preconditions:
          - "rx_status == VERIFIED"
          - "current logical date >= verification_expires_at"
        side_effects:
          - "rx_status := EXPIRED"
          - "the owning AutoshipItem's verification_state VERIFIED -> EXPIRATION_MARKED"
      - from: VERIFICATION_FAILED
        to: PENDING_VERIFICATION
        trigger: "POST /v1/prescriptions/{id}/reopen"
        actor: PharmacyManager
        preconditions: ["rx_status == VERIFICATION_FAILED"]
        side_effects:
          - "rx_status := PENDING_VERIFICATION"
          - "callback_attempt_count := 0"
          - "the owning AutoshipItem's verification_state BLOCKED -> UNVERIFIED (prescription_block_cleared)"

  - entity: Order
    field: order_status
    initial_state: PLACED
    terminal_states: [DELIVERED, CANCELED]
    transitions:
      - from: PLACED
        to: PROCESSING
        trigger: "POST /v1/orders/{id}/ship"
        actor: PharmacyTechnician
        preconditions:
          - "order_status == PLACED"
          - "every PRESCRIPTION line has a Prescription with rx_status == VERIFIED and current logical date < verification_expires_at"
          - "the shipment's origin site licensed_states contains destination_state"
          - "the shipment's origin site site_status == ACTIVE"
          - "the origin site has cold_pack_capacity_units - cold_pack_committed_units >= this order's cold_pack_units when the order needs cold packs"
        side_effects:
          - "order_status := PROCESSING"
          - "the order's Shipment PENDING -> PACKED"
          - "cold_pack_reserved_units commits the order's reservation at its origin site"
      - from: PROCESSING
        to: SHIPPED
        trigger: "POST /v1/orders/{id}/ship"
        actor: PharmacyTechnician
        preconditions: ["order_status == PROCESSING"]
        side_effects:
          - "order_status := SHIPPED"
          - "Shipment PACKED -> DISPATCHED and tracking_code stamped"
          - "refill_consumption_applied debits each Prescription, cycling rx_status VERIFIED -> VERIFIED; when an authorized_qty_remaining reaches 0 the owning AutoshipItem goes ACTIVE -> COMPLETED"
      - from: PLACED
        to: CANCELED
        trigger: "POST /v1/orders/{id}/cancel"
        actor: PharmacyTechnician
        preconditions: ["order_status IN {PLACED, PROCESSING} and cancellation_reason is present"]
        side_effects:
          - "order_status := CANCELED"
          - "the order's Shipment becomes CANCELED and cold_pack_reserved_units releases its reservation"
          - "order_cancellation_settlement computes the order's refund for a subsequent compassionate review"
      - from: PROCESSING
        to: CANCELED
        trigger: "POST /v1/orders/{id}/cancel"
        actor: PharmacyTechnician
        preconditions: ["order_status == PROCESSING and cancellation_reason is present"]
        side_effects:
          - "order_status := CANCELED"
          - "the committed cold-pack reservation is released via cold_pack_reserved_units"
          - "the OrderLine rows are retained for order_cancellation_settlement"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /v1/orders/{id}/deliver"
        actor: PharmacyTechnician
        preconditions: ["order_status == SHIPPED"]
        side_effects: ["order_status := DELIVERED", "Shipment DISPATCHED -> DELIVERED"]
      - from: SHIPPED
        to: AWAITING_PET_PASSING_DECISION
        trigger: "system (Pet PASSED reported while this order is in transit)"
        actor: system
        preconditions: ["order_status == SHIPPED"]
        side_effects:
          - "the order is parked: it may later resume SHIPPED -> DELIVERED or be settled SHIPPED -> CANCELED"
          - "its Shipment goes DISPATCHED -> AWAITING_PET_PASSING_DECISION"

  - entity: Shipment
    field: shipment_status
    initial_state: PENDING
    terminal_states: [DELIVERED, CANCELED]
    transitions:
      - from: PENDING
        to: PACKED
        trigger: "POST /v1/orders/{id}/ship (pack step)"
        actor: PharmacyTechnician
        preconditions: ["the parent order's order_status == PLACED"]
        side_effects: ["cold_pack_thermal_reserve computes cold_pack_units and cold_pack_reserved_units commits them"]
      - from: PACKED
        to: DISPATCHED
        trigger: "POST /v1/orders/{id}/ship (dispatch step)"
        actor: PharmacyTechnician
        preconditions: ["pack step for the same order has run in the same request"]
        side_effects:
          - "tracking_code stamped"
          - "transit_window_start_date := dispatch instant, transit_window_end_date := start + 2 days"
      - from: DISPATCHED
        to: AWAITING_PET_PASSING_DECISION
        trigger: "system (Pet PASSED reported while this shipment is in transit)"
        actor: system
        preconditions: ["shipment_status == DISPATCHED"]
        side_effects: ["the shipment is parked until the linked CompassionateReview decides (hop 1 of the pet-passing cascade)"]
      - from: AWAITING_PET_PASSING_DECISION
        to: CANCELED
        trigger: "POST /v1/compassionate-reviews/{review_id}/decide"
        actor: CustomerService
        preconditions: ["the linked review is not OPEN"]
        side_effects:
          - "the shipment is canceled and cold_pack_reserved_units releases its reservation at the origin site"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /v1/orders/{id}/deliver"
        actor: PharmacyTechnician
        preconditions: ["shipment_status == DISPATCHED"]
        side_effects: ["delivery confirmed"]
      - from: PENDING
        to: CANCELED
        trigger: "POST /v1/orders/{id}/cancel or POST /v1/autoship-plans/{id}/cancel"
        actor: PharmacyTechnician
        preconditions: ["shipment_status IN {PENDING, PACKED}"]
        side_effects: ["any held cold-pack reservation is released"]
      - from: PACKED
        to: CANCELED
        trigger: "POST /v1/orders/{id}/cancel"
        actor: PharmacyTechnician
        preconditions: ["shipment_status == PACKED"]
        side_effects: ["cold_pack_reserved_units releases the committed reservation at the origin site"]

  - entity: Pet
    field: pet_status
    initial_state: ACTIVE
    terminal_states: [PASSED]
    transitions:
      - from: ACTIVE
        to: PASSED
        trigger: "POST /v1/pets/{id}/passings"
        actor: Customer
        preconditions: ["pet_status == ACTIVE"]
        side_effects:
          - "pet_status := PASSED and passed_at := current logical date"
          - "hop 1 of the pet-passing cascade: every Shipment under this pet's plans with shipment_status == DISPATCHED becomes AWAITING_PET_PASSING_DECISION"
          - "hop 2 of the pet-passing cascade: each of those shipments' Orders goes SHIPPED -> AWAITING_PET_PASSING_DECISION"
          - "hop 3 of the pet-passing cascade: every AutoshipPlan of this pet goes ACTIVE -> COMPASSIONATE_CANCELED"
          - "a CompassionateReview is opened in review_status OPEN with affected_shipment_id set to the parked shipment, or null when no shipment was in transit"
          - "pet_lifecycle_state recomputed PASSED by pet_state_tracking"

  - entity: CompassionateReview
    field: review_status
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /v1/compassionate-reviews/{review_id}/decide"
        actor: CustomerService
        preconditions:
          - "review_status == OPEN"
          - "the linked Pet.pet_status == PASSED"
          - "outcome == APPROVED"
          - "the deciding identity differs from the identity that recorded the pet passing"
        side_effects:
          - "review_status := APPROVED"
          - "order_cancellation_settlement runs over every CANCELED order of the linked pet's plans and writes each order's refund"
          - "the parked Shipment AWAITING_PET_PASSING_DECISION -> CANCELED and its reservation is released"
          - "pet_lifecycle_state recomputed ARCHIVED"
      - from: OPEN
        to: REJECTED
        trigger: "POST /v1/compassionate-reviews/{review_id}/decide"
        actor: CustomerService
        preconditions:
          - "review_status == OPEN"
          - "outcome == REJECTED"
          - "the deciding identity differs from the identity that recorded the pet passing"
        side_effects:
          - "review_status := REJECTED"
          - "no refund is written; order_cancellation_settlement does not run"
          - "the parked Shipment AWAITING_PET_PASSING_DECISION -> CANCELED"
          - "pet_lifecycle_state recomputed ARCHIVED"

  - entity: PharmacySite
    field: site_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /v1/pharmacy-sites/{id}/restrict"
        actor: ComplianceOfficer
        preconditions: ["site_status == ACTIVE"]
        side_effects:
          - "site_status := RESTRICTED"
          - "the site is excluded from origin_site_selection candidates"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /v1/pharmacy-sites/{id}/clear-restriction"
        actor: ComplianceOfficer
        preconditions: ["site_status == RESTRICTED"]
        side_effects: ["site_status := ACTIVE"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /v1/pharmacy-sites/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "site_status == ACTIVE"
          - "cold_pack_committed_units == 0"
        side_effects: ["site_status := CLOSED"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: compose-stale-plan
    parent_entity: AutoshipPlan
    write_endpoint: "POST /v1/autoship-plans/{id}/compose"
    occ_field: "expected_plan_version"
    description: |
      Composing an order against an AutoshipPlan whose version has advanced
      since the caller last observed it is rejected, because a prior composer
      has legitimately advanced the plan's version by composing from it.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: cadence-stale-item
    parent_entity: AutoshipItem
    write_endpoint: "POST /v1/autoship-plans/{plan_id}/items/{item_id}/cadence"
    occ_field: "expected_item_version"
    description: |
      Changing an AutoshipItem's cadence against a version of that item that
      has advanced since the caller last observed it is rejected, because
      prescription verification activity has legitimately advanced the item's
      version since the caller's read.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: dosage_mg_per_day
    trigger: "autoship item read, pet weight recorded, or plan compose"
    algorithm: weighted_scoring
    formula: |
      species_multiplier = 1.0 when Pet.species == CAT, otherwise 1.2
      dosage_mg_per_day = round_half_up(Product.unit_dose_mg_per_kg * Pet.weight_kg * species_multiplier, MG_PER_DAY_PRECISION)
    input_set: "the composed line's own autoship item, its product and its owning pet; Pet.pet_status is not filtered so a PASSED pet still yields a dosage"
    constants:
      CAT_SPECIES_MULTIPLIER: 1.0
      OTHER_SPECIES_MULTIPLIER: 1.2
      MG_PER_DAY_PRECISION: 2
    precision: "round_half_up to 2 decimal places, applied once to the final product"
    variants:
      - name: pet_only_projection
        when: "the display projection omits the species multiplier"
        difference: "dosage_pet_only = round_half_up(Product.unit_dose_mg_per_kg * Pet.weight_kg, 2); for unit_dose_mg_per_kg = 0.035 and weight_kg = 40 the base variant yields 1.68 while this variant yields 1.40"

  - name: run_cadence_days
    trigger: "autoship item read, cadence update, pet weight recorded, or plan compose"
    algorithm: tiered_pricing
    formula: |
      sentinel_weight_kg = max(Pet.weight_kg, MIN_WEIGHT_KG)
      weight_cat_kg = ceil(sentinel_weight_kg)
      body_dose_mg = weight_cat_kg * Product.unit_dose_mg_per_kg
      tier_ge_dose_limit = floor(body_dose_mg / DOSE_TIER_MG) when body_dose_mg >= DOSE_TIER_MG else -1
      tier_lt_dose_limit = 2 * floor(body_dose_mg / DOSE_TIER_LT_MG) when body_dose_mg < DOSE_TIER_MG else -1
      run_units_per_day = max(1, max(tier_ge_dose_limit, tier_lt_dose_limit))
      run_cycle_days = floor(Product.pack_size_units / run_units_per_day)
      run_cadence_days = max(MIN_CYCLE_DAYS, min(MAX_EQUIVALENT_DAYS, run_cycle_days))
      AutoshipItem.unit_lifecycle_equivalent_days := run_cadence_days
    input_set: "the single autoship item's owning pet, evaluated against the pet's current weight_kg and the product's pack_size_units"
    constants:
      MIN_WEIGHT_KG: 2.5
      DOSE_TIER_MG: 30
      DOSE_TIER_LT_MG: 5
      MIN_CYCLE_DAYS: 14
      MAX_EQUIVALENT_DAYS: 84
    precision: "integer days; ceil on the weight category and floor on the tier counts; the max(1, ...) clamp is applied before the division"
    variants:
      - name: band_cadence
        when: "the cadence is read from the weight band's whole-day target instead of the tiered pipeline"
        difference: "run_cadence_days = pack_whole_days + BAND_OFFSET_DAYS with BAND_OFFSET_DAYS = 3, where pack_whole_days = floor(Product.pack_size_units / ceil(max(Pet.weight_kg, 2.5))); for unit_dose_mg_per_kg = 0.035, weight_kg = 40 and pack_size_units = 30 the base variant yields 30 while this variant yields 4"
      - name: rounded_tier_limit
        when: "the sub-tier dose limit rounds the body dose up instead of down"
        difference: "tier_lt_dose_limit = 2 * ceil(body_dose_mg / DOSE_TIER_LT_MG); for body_dose_mg = 0.105 the base variant yields 0 while this variant yields 2"

  - name: cadence_prompt_due_days_delta
    trigger: "plan read, pet weight recorded, item cadence update, or plan compose"
    algorithm: threshold
    formula: |
      prompt_date = AutoshipPlan.cadence_prompt_due_date when not null, otherwise AutoshipPlan.next_order_due_date
      gap_days = floor((AutoshipPlan.next_order_due_date - prompt_date) in whole days)
      when AutoshipPlan.next_order_due_date is null: cadence_prompt_due_days_delta = 0
      when gap_days <= -OVERDUE_URGENT_DAYS: cadence_prompt_due_days_delta = 14
      when gap_days <= -OVERDUE_SOON_DAYS:   cadence_prompt_due_days_delta = 7
      when gap_days <= 0:                    cadence_prompt_due_days_delta = 0
      when gap_days < PROMPT_ALIGNED_WINDOW_DAYS: cadence_prompt_due_days_delta = PROMPT_ALIGNED_WINDOW_DAYS
      otherwise: cadence_prompt_due_days_delta = min(gap_days - PROMPT_ALIGNED_WINDOW_DAYS, MAX_PROMPT_DEFERRAL_DAYS)
      AutoshipPlan.cadence_prompt_due_date := prompt_date + cadence_prompt_due_days_delta days
      cadence_prompt_state = UNDER_CONSUMPTION when run_cadence_days - item.cadence_days > PROMPT_ALIGNED_WINDOW_DAYS
                           = OVER_CONSUMPTION  when item.cadence_days - run_cadence_days > PROMPT_ALIGNED_WINDOW_DAYS
                           = ALIGNED           otherwise
    input_set: "plans with at least one item in item_status ACTIVE; PAUSED, COMPLETED and CANCELED items are excluded from next_order_due_date and from the prompt state"
    constants:
      OVERDUE_URGENT_DAYS: 28
      OVERDUE_SOON_DAYS: 14
      PROMPT_ALIGNED_WINDOW_DAYS: 3
      MAX_PROMPT_DEFERRAL_DAYS: 21
    precision: "integer days; the whole-day gap is floored before the threshold ladder is evaluated"
    variants:
      - name: units_delta
        when: "the aligned band is measured in dispensing units rather than days"
        difference: "the aligned band becomes abs(default_quantity - run_units_per_day) <= 1 unit; the same data reads ALIGNED under the units variant and UNDER_CONSUMPTION under the base days variant"

  - name: refill_units_consumed
    trigger: "order ship (refill consumption) and prescription read"
    algorithm: aggregation
    formula: |
      doses_per_day = ceil(dosage_mg_per_day / Product.unit_dose_mg_per_kg)
      refill_units_consumed = doses_per_day * AutoshipItem.cadence_days * UNITS_PER_DOSE
    input_set: "lines whose product has medication_scope == PRESCRIPTION and whose Prescription.rx_status == VERIFIED"
    constants:
      UNITS_PER_DOSE: 1
    precision: "integer units; ceil applied to doses_per_day only, then a single multiplication"
    variants:
      - name: pack_rounded_consumption
        when: "consumption is rounded up to whole packs"
        difference: "refill_units_consumed = ceil(doses_per_day * cadence_days / pack_size_units) * pack_size_units; for doses_per_day = 30, cadence_days = 30 and pack_size_units = 30 the base variant yields 900 while this variant also yields 900, but for doses_per_day = 26, cadence_days = 30 and pack_size_units = 30 the base variant yields 780 while this variant yields 780 — they diverge at doses_per_day = 4, cadence_days = 14, pack_size_units = 30 where the base yields 56 and this variant yields 60"
      - name: packs_basis
        when: "the prescription is written as a number of packs to be consumed"
        difference: "refill_units_consumed = (floor(cadence_days / pack_whole_days) + 1) * pack_size_units where pack_whole_days = floor(pack_size_units / max(1, floor(dosage_mg_per_day / unit_dose_mg_per_kg))); for pack_size_units = 30, cadence_days = 30 and pack_whole_days = 30 the base variant yields 900 while this variant yields 60"

  - name: autoship_discount_cents
    trigger: "plan compose"
    algorithm: chronological
    formula: |
      discount_rate = FIRST_ORDER_DISCOUNT_RATE when the plan has no prior composed order, otherwise RECURRING_DISCOUNT_RATE
      iterate the order's lines in ascending line position:
          autoship_base_cents = (AutoshipItem.unit_price_cents * OrderLine.quantity) when price_protected_unit_price_cents is not null,
                                otherwise line_item_subtotal_cents
          line_autoship_discount_cents = round_half_up(autoship_base_cents * discount_rate, 0)
      autoship_discount_cents = sum(line_autoship_discount_cents)
    input_set: "all lines of the order being composed, including PRESCRIPTION lines; lines already priced by autoship_price_protection use line_unit_price_cents"
    constants:
      FIRST_ORDER_DISCOUNT_RATE: 0.35
      RECURRING_DISCOUNT_RATE: 0.10
    precision: "round_half_up per line to integer cents, then summed; the order-level product is never rounded directly"
    variants:
      - name: order_level_rounding
        when: "the discount is rounded once over merchandise_subtotal_cents"
        difference: "autoship_discount_cents = round_half_up(merchandise_subtotal_cents * discount_rate); for a recurring order with lines 1550 and 656 the per-line sum is 155 + 64 = 219 while the order-level value is 221"

  - name: autoship_promo_reconciliation
    trigger: "plan compose with a promotion_code, plan cancel, compassionate review approval"
    algorithm: constraint_propagation
    formula: |
      raw_autoship_discount_cents = autoship_discount_cents before reconciliation
      when AutoshipPlan.autoship_discount_eligibility == INELIGIBLE: error ERR_PROMO_STACKING_NOT_ALLOWED
      when raw_autoship_discount_cents > 0 and promotion_code is present: error ERR_PROMO_STACKING_NOT_ALLOWED
      when raw_autoship_discount_cents == 0 and promotion_code is present and merchandise_subtotal_cents >= PROMO_MIN_SUBTOTAL_CENTS:
          residual_promo_discount_cents = min(PROMO_DISCOUNT_CENTS, merchandise_subtotal_cents - raw_autoship_discount_cents)
          autoship_discount_cents := raw_autoship_discount_cents + residual_promo_discount_cents
      otherwise:
          residual_promo_discount_cents = 0
      order_total_cents := merchandise_subtotal_cents - autoship_discount_cents + cold_pack_fee_cents + expedited_shipping_fee_cents
      order_total_components_sum := order_total_cents
    input_set: "the order being composed; a promotion never stacks on a nonzero autoship discount, and an INELIGIBLE plan accepts no promotion at all"
    constants:
      PROMO_DISCOUNT_CENTS: 1500
      PROMO_MIN_SUBTOTAL_CENTS: 3500
    precision: "integer cents; the min clamp is applied before order_total_components_sum is recomputed"
    variants:
      - name: promo_on_top
        when: "a promotion is applied on top of a nonzero autoship discount"
        difference: "autoship_discount_cents = raw + PROMO_DISCOUNT_CENTS with no zero guard and no eligibility guard; a recurring order that also carries a promotion ends strictly cheaper than under the base variant"

  - name: autoship_price_protection
    trigger: "plan compose (first and recurring), product list price change"
    algorithm: threshold
    formula: |
      guard_cents = round_half_up(price_protected_unit_price_cents * (1 + PROTECTION_GUARD_RATE), 0)
      protection_state = PROTECTED when AutoshipItem.unit_price_cents <= guard_cents otherwise REPRICED
      line_unit_price_cents = min(AutoshipItem.unit_price_cents, guard_cents) when price_protected_unit_price_cents is not null
      line_unit_price_cents = AutoshipItem.unit_price_cents when price_protected_unit_price_cents is null
      price_protected_unit_price_cents is written exactly once, on the plan's first composed order, from the then-current unit_price_cents
    input_set: "the composed line's own autoship item; the write happens only while the plan has no prior composed order"
    constants:
      PROTECTION_GUARD_RATE: 0.05
    precision: "round_half_up to integer cents on the guard amount; the guard is computed per unit and only then multiplied by quantity"
    variants:
      - name: no_protection
        when: "price protection is disabled for the plan"
        difference: "line_unit_price_cents = AutoshipItem.unit_price_cents in every case, so a list price raised past the guard is charged in full"
      - name: percent_only
        when: "the protection state is read from a floating point percentage delta instead of the rounded guard"
        difference: "protection_state = PROTECTED while (unit_price_cents - price_protected_unit_price_cents) / price_protected_unit_price_cents <= 0.05; for a protected price of 1610 and a current price of 1691 the base variant reads PROTECTED (1691 <= round_half_up(1690.5) = 1691) while this variant reads REPRICED (0.05031 > 0.05)"

  - name: cold_pack_units
    trigger: "shipment pack step"
    algorithm: aggregation
    formula: |
      quantity_sum = sum of OrderLine.quantity over lines whose Product.cold_pack_required == true
      site_load_units = PharmacySite.cold_pack_committed_units observed before this shipment is packed
      thermal_reserve_hours = PACKING_BUFFER_HOURS
                            + max(0.0, AMBIENT_EXPECTED_C - PACK_TARGET_TEMPERATURE_C) * DEGRADATION_HOURS_PER_DEGREE_C
                            + site_load_units * (AMBIENT_EXPECTED_C - PACK_TARGET_TEMPERATURE_C) / COOLING_BURDEN_HOURS_PER_DEGREE_C
                            + (quantity_sum - 1) / 4.0
      cold_pack_units = 0 when quantity_sum == 0, otherwise ceil(thermal_reserve_hours)
      Shipment.cold_pack_units := cold_pack_units
    input_set: "only lines whose Product.cold_pack_required == true on the shipment's order, plus the origin site's current committed load"
    constants:
      PACKING_BUFFER_HOURS: 24.0
      AMBIENT_EXPECTED_C: 25.0
      PACK_TARGET_TEMPERATURE_C: 4.0
      DEGRADATION_HOURS_PER_DEGREE_C: 1.5
      COOLING_BURDEN_HOURS_PER_DEGREE_C: 100.0
    precision: "ceil to integer units, a single rounding applied after the whole sum is formed"
    variants:
      - name: flat_per_line
        when: "one unit is reserved per temperature-sensitive line instead of a computed reserve"
        difference: "cold_pack_units = max(1, quantity_sum); for quantity_sum = 5 both variants yield 57 only when the site load is 0 and the base thermal sum is 56.5, but for quantity_sum = 1 the base variant yields 56 while this variant yields 1"

  - name: order_cancellation_settlement
    trigger: "order cancel, plan cancel, compassionate review approval"
    algorithm: aggregation
    formula: |
      iterate the linked pet's orders in ascending (composed_at, created_at) order:
          settle only orders whose order_status == CANCELED; DELIVERED orders contribute 0
          iterate that order's lines in ascending line position, counting only lines whose Product.cold_pack_required == true:
              the first such line refunds in full: component_refund_cents += line_item_subtotal_cents
              the second such line refunds at HALF_PRICE_LINE_FACTOR: component_refund_cents += round_half_up(line_item_subtotal_cents * HALF_PRICE_LINE_FACTOR)
              any further such line refunds nothing
          packing_fee_refund_cents += 0.0 * order.cold_pack_fee_cents
      payable_total_cents = merchandise_subtotal_cents - autoship_discount_cents + cold_pack_fee_cents
      total_refund_cents = min(component_refund_cents + packing_fee_refund_cents, payable_total_cents)
      Order.refunded_amount_cents := total_refund_cents
      CompassionateReview.refunded_amount_cents := sum of total_refund_cents over the linked pet's plans
    input_set: "only CANCELED orders of the review's linked pet; the packing fee component never refunds at PACKING_FEE_REFUND_RATE"
    constants:
      FULL_PRICE_LINE_LIMIT: 1
      HALF_PRICE_LINE_LIMIT: 1
      HALF_PRICE_LINE_FACTOR: 0.5
      PACKING_FEE_REFUND_RATE: 0.0
    precision: "integer cents; round_half_up per component before summing"
    variants:
      - name: no_cap
        when: "the refund is not capped at the order's payable total"
        difference: "total_refund_cents = component_refund_cents with no min clamp, so an order whose fee lines exceed its net merchandise refunds strictly more than it was charged"

  - name: payment_settlement_net
    trigger: "plan cancel, compassionate review approval, order deliver"
    algorithm: chronological
    formula: |
      released_refunds_cents = 0
      transaction_adjustments_cents = 0
      iterate the plan's orders in ascending (composed_at, created_at) order:
          released_refunds_cents += Order.refunded_amount_cents
          transaction_adjustments_cents += Order.settlement_net_cents
          Order.settlement_payment_balance_cents += Order.settlement_net_cents
      AutoshipPlan.released_refunds_cents := released_refunds_cents
      AutoshipPlan.transaction_adjustments_cents := transaction_adjustments_cents
    input_set: "every order of the plan regardless of order_status; DELIVERED orders carry refunded_amount_cents of 0"
    constants:
      ZERO_REFUND: 0
    precision: "integer cents, no rounding"
    variants:
      - name: gross_sales_basis
        when: "the settlement basis is gross sales before refunds"
        difference: "settlement_net_cents = order_total_cents with refunds never subtracted, so a canceled order reads 2586 under this variant and 708 under the base variant for the D9 compensating-invariant order"

  - name: pet_state_tracking
    trigger: "pet passing report and compassionate review decision"
    algorithm: constraint_propagation
    formula: |
      Pet.pet_lifecycle_state := ALIVE while Pet.pet_status == ACTIVE
                            := PASSED while Pet.pet_status == PASSED and the linked CompassionateReview.review_status == OPEN
                            := ARCHIVED while Pet.pet_status == PASSED and the linked review_status IN {APPROVED, REJECTED}
      transitions: ALIVE to PASSED on the pet passing report; PASSED to ARCHIVED on a review decision; PASSED to PASSED while the review stays OPEN
    input_set: "the pet and its single linked CompassionateReview; a pet with no review row reads ALIVE while ACTIVE"
    constants:
      REVIEW_OPEN_STATE: OPEN
    precision: "enum state only, no numeric rounding"
    variants:
      - name: plan_basis
        when: "the lifecycle state is read from the plan rather than from the review"
        difference: "Pet.pet_lifecycle_state := ARCHIVED when the plan's plan_status == COMPASSIONATE_CANCELED regardless of review_status, so a pet whose plan was canceled before the review was decided reads ARCHIVED under this variant while the base variant still reads PASSED"

  - name: transit_window_dates
    trigger: "shipment dispatch"
    algorithm: interval_merge
    formula: |
      transit_window_start_date = current logical date at dispatch
      transit_window_end_date = transit_window_start_date + TRANSIT_DAYS days
      the window is half-open: [transit_window_start_date, transit_window_end_date)
      the overlap test at validations[priority=16] extends the window by TRANSIT_BUFFER_DAYS at its end before comparing it to the plan blackout interval
    input_set: "the single shipment and the logical clock at dispatch"
    constants:
      TRANSIT_DAYS: 2
      TRANSIT_BUFFER_DAYS: 1
    precision: "whole-day instants"
    variants:
      - name: unbuffered_window
        when: "the buffer is not appended before the overlap test"
        difference: "the extended end becomes transit_window_end_date rather than end + 1 day, so a window ending exactly at blackout_start_date reads as non-conflicting while the base variant reports ERR_TEMPERATURE_CHAIN_RISK"

  - name: cold_pack_reserved_units
    trigger: "shipment pack step, order cancel, plan cancel, compassionate review decision"
    algorithm: aggregation
    formula: |
      reserve_units = sum of ColdPackReservation.units over reservations on this shipment with reservation_status in a holding state
      PharmacySite.cold_pack_committed_units := sum of ColdPackReservation.units over all reservations at that site whose reservation_status == HELD
      commit step: reservation_status HELD -> CONSUMED and the site's committed load includes the shipment's units
      release step: reservation_status HELD -> RELEASED and the site's committed load excludes the shipment's units
      invariant: PharmacySite.cold_pack_committed_units == sum of HELD reservation units at that site
    input_set: "reservations of every shipment at the site; CONSUMED and RELEASED reservations are excluded from the sum"
    constants:
      FREE_UNITS_PER_SHIPMENT: 0
    precision: "integer units, no rounding"
    variants:
      - name: capacity_on_dispatch_basis
        when: "capacity is counted from dispatched shipments instead of HELD reservations"
        difference: "cold_pack_committed_units = sum of units of shipments with shipment_status IN {DISPATCHED, DELIVERED}; a canceled shipment whose reservation was released still counts under this variant while the base variant excludes it"

  - name: verification_expiry_stamp
    trigger: "clinic authorization confirmation and clock advance"
    algorithm: forward_looking
    formula: |
      verification_expires_at = clinic authorization confirmation instant + AUTHORIZATION_VALID_DAYS days, preserving the time of day
      the authorization interval is half-open [confirmation, verification_expires_at)
      compose or ship is refused with ERR_RX_EXPIRED when current logical date >= verification_expires_at
    input_set: "the single prescription and the logical clock only"
    constants:
      AUTHORIZATION_VALID_DAYS: 365
    precision: "whole-day instants, no fractional accumulation"
    variants:
      - name: last_day_inclusive
        when: "the final day of the authorization remains usable"
        difference: "the interval is closed [confirmation, verification_expires_at], so a dispatch on the 365th day succeeds under this variant and fails with ERR_RX_EXPIRED under the base variant"

  - name: advance_item_cadence
    trigger: "plan compose (per item)"
    algorithm: chronological
    formula: |
      iterate the plan's due items in ascending (autoship_item_next_due_date, created_at) order, tie-broken by created_at ascending
      step_days = AutoshipItem.cadence_days
      when cadence_days == DAILY_CADENCE_DAYS and AutoshipItem.unit_price_cents < UNIT_PRICE_DEFERRAL_THRESHOLD_CENTS:
          step_days = DEFERRED_CADENCE_DAYS
      AutoshipItem.autoship_item_next_due_date := AutoshipItem.autoship_item_next_due_date + step_days days
      applied exactly once per composed order per item
    input_set: "items whose item_status == ACTIVE and whose autoship_item_next_due_date <= current logical date; at most one advance per item per compose"
    constants:
      DAILY_CADENCE_DAYS: 14
      DEFERRED_CADENCE_DAYS: 28
      UNIT_PRICE_DEFERRAL_THRESHOLD_CENTS: 1000
    precision: "integer days, no rounding"
    variants:
      - name: no_price_deferral
        when: "the daily cadence is never stretched"
        difference: "step_days = cadence_days always, so a 14-day item priced at 900 cents next falls due on 2026-10-13 under the base variant and on 2026-09-27 under this variant"

  - name: origin_site_selection
    trigger: "shipment creation"
    algorithm: waterfall_allocation
    formula: |
      candidates = PharmacySite where
          site_status == ACTIVE
          and Shipment.destination_state is contained in licensed_states
          and cold_pack_capacity_units - cold_pack_committed_units >= cold_pack_units when cold_pack_units > 0
      ranking key = (cold_pack_committed_units ascending, site_code ascending)
      selected_site = first candidate by ranking key
      empty candidate set -> ERR_NO_ELIGIBLE_SITE
    input_set: "every site; RESTRICTED and CLOSED sites are excluded by the eligibility filter, and the fallback when the pool is empty is the error above rather than a second-choice site"
    constants:
      SITE_STATUS_ELIGIBLE: ACTIVE
    precision: "integer units for the capacity comparison; site_code compared as an ASCII string"
    variants:
      - name: unrestricted_fallback
        when: "a RESTRICTED site is allowed when no ACTIVE site is eligible"
        difference: "the eligibility filter becomes site_status IN {ACTIVE, RESTRICTED}; for a destination served only by a RESTRICTED site the base variant raises ERR_NO_ELIGIBLE_SITE while this variant selects it"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and X-User-Role names a declared role"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: "all"
    description: "Header presence is checked before anything else, including path existence."

  - priority: 2
    category: auth
    check: "the declared role is permitted on the target endpoint per §1.7"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource id named in the path exists, validated left to right (plan, then item, then prescription, then order, then shipment); an id owned by another party is reported as absent"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-scoped endpoints"

  - priority: 4
    category: state
    check: "the target resource's status admits this operation, meaning the from: value of the governing §1.2 transition equals the current status"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
    description: "Domain-specific realisations of this rule are used where §1.6 names them: composition against a non-ACTIVE plan reports ERR_PLAN_PAUSED rather than a generic code, and every other transition reports ERR_INVALID_STATE."

  - priority: 5
    category: scarcity
    check: "cold-pack capacity: PharmacySite.cold_pack_committed_units plus the requested reservation must not exceed cold_pack_capacity_units"
    error_id: ERR_COLD_PACK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/orders/{id}/ship"

  - priority: 6
    category: business_safety
    check: "the prescription being authorized must be in rx_status VERIFICATION_IN_PROGRESS, and the prescriber must hold vet_status IN {LISTED, VETERINARIAN_VERIFIED}"
    error_id: ERR_PRESCRIBER_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /v1/prescriptions/{id}/clinic-authorizations"

  - priority: 7
    category: business_safety
    check: "for script_source WRITTEN_PRESCRIPTION the written_prescriber_email_hash must equal the normalized (lowercased and trimmed) vet_email of prescriber_id"
    error_id: ERR_PRESCRIBER_MISMATCH
    http_status: 422
    applies_to: "POST /v1/prescriptions/{id}/clinic-authorizations"

  - priority: 8
    category: business_safety
    check: "segregation of duties on clinic authorization: the authorizing identity must differ from the identity that recorded the submission, and the prescriber of record must not be the authorizing act itself when the submission named the same person"
    error_id: ERR_SUBMITTER_CANNOT_AUTHORIZE
    http_status: 403
    applies_to: "POST /v1/prescriptions/{id}/clinic-authorizations"

  - priority: 9
    category: business_safety
    check: "a drug_schedule CII prescription may not be authorized unless every PharmacySite whose licensed_states contains the owning pet's owner_state has csr_registered true"
    error_id: ERR_CSR_AUTH_BLOCKED
    http_status: 422
    applies_to: "POST /v1/prescriptions/{id}/clinic-authorizations"

  - priority: 10
    category: business_constraint
    check: "the origin PharmacySite.licensed_states must contain the Shipment.destination_state for any order carrying a PRESCRIPTION-scope line"
    error_id: ERR_SITE_NOT_LICENSED
    http_status: 422
    applies_to: "POST /v1/orders/{id}/ship"

  - priority: 11
    category: business_constraint
    check: "an item scheduling a PRESCRIPTION-scope product must carry a Prescription whose rx_status IN {VERIFIED, EXPIRED} before composition; a prescription that is absent or in PENDING_VERIFICATION, VERIFICATION_IN_PROGRESS or VERIFICATION_FAILED is refused here, while an EXPIRED one is refused at priority 18 with ERR_RX_EXPIRED instead"
    error_id: ERR_RX_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /v1/autoship-plans/{id}/compose, POST /v1/orders/{id}/ship"

  - priority: 12
    category: business_constraint
    check: "cadence_days must be a member of {14, 21, 28, 42, 56, 84} and default_quantity must be >= 1"
    error_id: ERR_INVALID_CADENCE
    http_status: 400
    applies_to: "POST /v1/autoship-plans/{plan_id}/items, POST /v1/autoship-plans/{plan_id}/items/{item_id}/cadence"

  - priority: 13
    category: business_constraint
    check: "the requested refill_units_consumed must stay within authorized_qty_remaining and within refills_authorized minus refills_used"
    error_id: ERR_REFILL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/orders/{id}/ship"

  - priority: 14
    category: business_constraint
    check: "the cumulative quantity over an order's PRESCRIPTION lines for one prescription must not exceed MAX_RX_UNITS_PER_ORDER"
    error_id: ERR_RX_QUANTITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/orders/{id}/ship"

  - priority: 15
    category: business_constraint
    check: "the selected origin site must not be CLOSED, and must not be RESTRICTED for a new autoship order"
    error_id: ERR_SITE_RESTRICTED
    http_status: 409
    applies_to: "POST /v1/shipments, POST /v1/orders/{id}/ship"

  - priority: 16
    category: business_temporal
    check: "for a temperature-sensitive shipment the transit interval [transit_window_start_date, transit_window_end_date) is extended by TRANSIT_BUFFER_DAYS at its end before overlap is tested against the plan's blackout interval [blackout_start_date, blackout_end_date); because of that buffer a transit interval ending exactly at blackout_start_date still conflicts, unlike the priority-17 cadence window which permits the same adjacency"
    error_id: ERR_TEMPERATURE_CHAIN_RISK
    http_status: 422
    applies_to: "POST /v1/orders/{id}/ship"

  - priority: 17
    category: business_temporal
    check: "the cadence window is the half-open interval [current logical date, current logical date + cadence_days); it conflicts when window_start_date < blackout_end_date AND blackout_start_date < window_end_date, so a window ending exactly at blackout_start_date is permitted while one ending one day later is not"
    error_id: ERR_CADENCE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /v1/autoship-plans/{plan_id}/items/{item_id}/cadence"

  - priority: 18
    category: business_temporal
    check: "the prescription must not be composed or dispensed at or after verification_expires_at, and the authorization must not be older than AUTHORIZATION_GRACE_DAYS"
    error_id: ERR_RX_EXPIRED
    http_status: 422
    applies_to: "POST /v1/autoship-plans/{id}/compose, POST /v1/orders/{id}/ship"

  - priority: 19
    category: business_fiscal
    check: "the price-protected line total must not exceed the plan's outstanding balance; the line is charged at the guard price rather than the raised list price"
    error_id: ERR_PRICE_PROTECTION_CONFLICT
    http_status: 422
    applies_to: "POST /v1/autoship-plans/{id}/compose"

  - priority: 20
    category: business_referential
    check: "a written prescription's prescriber must be resolvable from written_prescriber_email_hash; an email naming no Veterinarian is unresolvable"
    error_id: ERR_PRESCRIBER_NOT_FOUND
    http_status: 422
    applies_to: "POST /v1/prescriptions/{id}/clinic-authorizations"

  - priority: 21
    category: business_referential
    check: "a shipment may only be created for an order in order_status PLACED, and only once per order"
    error_id: ERR_ORDER_ALREADY_SHIPPED
    http_status: 409
    applies_to: "POST /v1/shipments"

  - priority: 22
    category: business_referential
    check: "the plan's owning pet must be in pet_status ACTIVE before composition or shipment"
    error_id: ERR_PET_INACTIVE
    http_status: 409
    applies_to: "POST /v1/autoship-plans/{id}/compose, POST /v1/orders/{id}/ship"

  - priority: 23
    category: business_constraint
    check: "a plan whose autoship_discount_eligibility is INELIGIBLE must not receive a promotion, and a recurring order carrying a nonzero autoship discount must not receive a promotion"
    error_id: ERR_PROMO_STACKING_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /v1/autoship-plans/{id}/compose"

  - priority: 24
    category: business_referential
    check: "a new shipment requires an eligible origin site for the destination state and cold-pack load; an empty candidate set is a failure rather than a silent second choice"
    error_id: ERR_NO_ELIGIBLE_SITE
    http_status: 409
    applies_to: "POST /v1/shipments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  - method: POST
    path: "/v1/pets"
    description: "Register a pet owned by the calling identity"
    roles: [Customer, CustomerService]
    code: 201
    input: [pet_name, species, breed, weight_kg, owner_state]
    output: Pet
    side_effects: ["pet_status := ACTIVE", "pet_lifecycle_state := ALIVE via pet_state_tracking"]

  - method: GET
    path: "/v1/pets"
    description: "List pets, filterable by status or by the compassionate review opened for them"
    roles: [Customer, CustomerService, PharmacyTechnician, ComplianceOfficer]
    code: 200
    input: ["pet_status?", "compassionate_review_id?", "limit?", "offset?"]
    output: Pet[]
    side_effects: []

  - method: GET
    path: "/v1/pets/{id}"
    description: "Read a pet"
    roles: [Customer, CustomerService, PharmacyTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: Pet
    side_effects: []

  - method: POST
    path: "/v1/pets/{id}/weights"
    description: "Record a body weight and recalibrate dosage, consumption and cadence prompts"
    roles: [Customer, CustomerService]
    code: 200
    input: [weight_kg]
    output: Pet
    side_effects:
      - "Pet.weight_kg := weight_kg"
      - "dosage_mg_per_day recomputed"
      - "each AutoshipItem of this pet has unit_lifecycle_equivalent_days recomputed by run_cadence_days"
      - "each AutoshipPlan of this pet has cadence_prompt_due_days_delta recomputed"

  - method: POST
    path: "/v1/pets/{id}/passings"
    description: "Report a pet's passing, opening a compassionate review and parking in-flight work"
    roles: [Customer, CustomerService]
    code: 200
    input: [refund_destination]
    output: Pet
    side_effects:
      - "Pet pet_status ACTIVE -> PASSED"
      - "a CompassionateReview is created in review_status OPEN with affected_shipment_id bound to the parked shipment or null"
      - "cascade: Pet.Shipment.DISPATCHED -> AWAITING_PET_PASSING_DECISION, then Pet.Order.SHIPPED -> AWAITING_PET_PASSING_DECISION, then Pet.AutoshipPlan.ACTIVE -> COMPASSIONATE_CANCELED"
      - "pet_lifecycle_state recomputed to PASSED"

  - method: POST
    path: "/v1/veterinarians"
    description: "Register a veterinarian of record"
    roles: [Customer, CustomerService, PharmacyTechnician, ClinicContact, ComplianceOfficer]
    code: 201
    input: [full_name, clinic_name, clinic_phone, vet_email, license_number, license_state]
    output: Veterinarian
    side_effects: ["vet_status := LISTED"]

  - method: GET
    path: "/v1/veterinarians"
    description: "List veterinarians"
    roles: [Customer, CustomerService, PharmacyTechnician, ClinicContact, ComplianceOfficer]
    code: 200
    input: ["vet_status?", "limit?", "offset?"]
    output: Veterinarian[]
    side_effects: []

  - method: GET
    path: "/v1/veterinarians/{id}"
    description: "Read a veterinarian"
    roles: [Customer, CustomerService, PharmacyTechnician, ClinicContact, ComplianceOfficer]
    code: 200
    input: []
    output: Veterinarian
    side_effects: []

  - method: POST
    path: "/v1/veterinarians/{id}/status"
    description: "Set a veterinarian's licence status, for example after a licence suspension"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: [vet_status]
    output: Veterinarian
    side_effects:
      - "Veterinarian.vet_status := vet_status"
      - "when the new vet_status is SUSPENDED or BLOCKED, every Prescription written by this veterinarian whose rx_status == VERIFIED fails over to VERIFICATION_FAILED and its owning item is blocked"

  - method: GET
    path: "/v1/veterinarians/{id}/prescriptions"
    description: "Find the prescriptions written by a veterinarian"
    roles: [PharmacyTechnician, PharmacyManager, ClinicContact, ComplianceOfficer]
    code: 200
    input: []
    output: Prescription[]
    side_effects: []

  - method: POST
    path: "/v1/products"
    description: "Create a catalog product"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [sku, product_name, medication_scope, cold_pack_required, unit_dose_mg_per_kg, pack_size_units, unit_price_cents]
    output: Product
    side_effects: []

  - method: GET
    path: "/v1/products"
    description: "List products"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["medication_scope?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/v1/products"
    description: "Also serves as the reverse-reachability list for a catalog SKU"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["medication_scope?", "sku?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/v1/products/{id}"
    description: "Read a product"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/v1/products/{id}/autoship-items"
    description: "Find the autoship items scheduling a product"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AutoshipItem[]
    side_effects: []

  - method: GET
    path: "/v1/products/{id}/order-lines"
    description: "Find the order lines dispensing a product"
    roles: [CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/v1/products/{id}/price"
    description: "Change a product's catalog list price"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [unit_price_cents]
    output: Product
    side_effects:
      - "Product.unit_price_cents := unit_price_cents"
      - "every AutoshipItem on this product recomputes unit_price_cents and re-evaluates protection_state via autoship_price_protection and price_protection_snapshot"

  - method: POST
    path: "/v1/pharmacy-sites"
    description: "Create a dispensing site with its state licences and cold-pack capacity"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [site_code, site_state, licensed_states, cold_pack_capacity_units, csr_registered]
    output: PharmacySite
    side_effects: ["site_status := ACTIVE", "cold_pack_committed_units := 0"]

  - method: GET
    path: "/v1/pharmacy-sites"
    description: "List dispensing sites"
    roles: [PlatformAdmin, ComplianceOfficer, PharmacyManager, PharmacyTechnician]
    code: 200
    input: ["site_status?", "limit?", "offset?"]
    output: PharmacySite[]
    side_effects: []

  - method: GET
    path: "/v1/pharmacy-sites/{id}"
    description: "Read a dispensing site"
    roles: [PlatformAdmin, ComplianceOfficer, PharmacyManager, PharmacyTechnician]
    code: 200
    input: []
    output: PharmacySite
    side_effects: []

  - method: GET
    path: "/v1/pharmacy-sites/{id}/shipments"
    description: "Find the shipments originating at a site"
    roles: [PharmacyTechnician, PharmacyManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/v1/pharmacy-sites/{id}/cold-pack-reservations"
    description: "Find the cold-pack reservations held at a site"
    roles: [PharmacyTechnician, PharmacyManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ColdPackReservation[]
    side_effects: []

  - method: POST
    path: "/v1/pharmacy-sites/{id}/restrict"
    description: "Restrict a site from new dispensing"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PharmacySite
    side_effects: ["site_status ACTIVE -> RESTRICTED"]

  - method: POST
    path: "/v1/pharmacy-sites/{id}/clear-restriction"
    description: "Clear a site restriction"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PharmacySite
    side_effects: ["site_status RESTRICTED -> ACTIVE"]

  - method: POST
    path: "/v1/pharmacy-sites/{id}/close"
    description: "Close a dispensing site"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PharmacySite
    side_effects: ["site_status ACTIVE -> CLOSED"]

  - method: POST
    path: "/v1/autoship-plans"
    description: "Enroll a pet in autoship"
    roles: [Customer, CustomerService, PharmacyTechnician]
    code: 201
    input: ["pet_id", "blackout_start_date?", "blackout_end_date?"]
    output: AutoshipPlan
    side_effects:
      - "plan_status := ACTIVE"
      - "autoship_discount_eligibility := ELIGIBLE"
      - "autoship_item_count := 0 and next_order_due_date := null"
      - "cadence_prompt_due_date := cadence_prompt_due_days_delta base minus the computed delta"

  - method: GET
    path: "/v1/autoship-plans"
    description: "List autoship plans"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: ["pet_id?", "plan_status?", "limit?", "offset?"]
    output: AutoshipPlan[]
    side_effects: []

  - method: GET
    path: "/v1/autoship-plans/{id}"
    description: "Read an autoship plan"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: AutoshipPlan
    side_effects: []

  - method: POST
    path: "/v1/autoship-plans/{id}/pause"
    description: "Pause an autoship plan"
    roles: [Customer, CustomerService]
    code: 200
    input: []
    output: AutoshipPlan
    side_effects: ["plan_status ACTIVE -> PAUSED"]

  - method: POST
    path: "/v1/autoship-plans/{id}/resume"
    description: "Resume a paused or suspended plan"
    roles: [Customer, CustomerService]
    code: 200
    input: []
    output: AutoshipPlan
    side_effects: ["plan_status PAUSED -> ACTIVE or SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/v1/autoship-plans/{id}/suspend"
    description: "Suspend a plan and park its in-flight shipments"
    roles: [CustomerService, PharmacyManager]
    code: 200
    input: []
    output: AutoshipPlan
    side_effects:
      - "plan_status ACTIVE -> SUSPENDED"
      - "the in-transit chain parks: Shipment DISPATCHED -> AWAITING_PET_PASSING_DECISION, then Order SHIPPED -> AWAITING_PET_PASSING_DECISION"

  - method: POST
    path: "/v1/autoship-plans/{id}/cancel"
    description: "Cancel a plan and its non-terminal orders"
    roles: [Customer, CustomerService]
    code: 200
    input: [cancellation_reason]
    output: AutoshipPlan
    side_effects:
      - "plan_status ACTIVE -> CANCELED"
      - "each Order of the plan with order_status IN {PLACED, PROCESSING, SHIPPED, AWAITING_PET_PASSING_DECISION} becomes CANCELED"
      - "each such order's Shipment becomes CANCELED and cold_pack_reserved_units releases its reservation"
      - "order_cancellation_settlement recomputes each canceled order's refund; payment_settlement_net recomputes the plan's released refunds"

  - method: POST
    path: "/v1/autoship-plans/{id}/compose"
    description: "Bundle every due item into a single new order"
    roles: [Customer, CustomerService, PharmacyTechnician]
    code: 201
    input: ["expected_plan_version", "promotion_code?", "override_code?"]
    output: Order
    side_effects:
      - "increments AutoshipPlan.version by 1"
      - "the request is accepted even when the due set is empty; an Order is created with order_kind FIRST when no prior composed order exists, otherwise RECURRING"
      - "one OrderLine is created per composed item, copying default_quantity into quantity and computing line_unit_price_cents, line_autoship_discount_cents and line_item_subtotal_cents; bundle_line_count := the composed line count, which is 0 when nothing was due"
      - "autoship_price_protection prices each line and writes each item's protection_state, locking price_protected_unit_price_cents on the plan's first composed order"
      - "autoship_discount_cents priced by autoship_discount_cents, then reconciled with promotion_code"
      - "autoship_promo_reconciliation settles promotion_code, then recomputes order_total_components_sum and order_total_cents"
      - "cold_pack_units and reservation units computed by cold_pack_thermal_reserve"
      - "advance_item_cadence advances each due item exactly once in ascending (autoship_item_next_due_date, created_at) order"
      - "AutoshipPlan.next_order_due_date, cadence_prompt_due_date_delta and the cadence prompt date are recomputed"

  - method: GET
    path: "/v1/autoship-plans/{id}/orders"
    description: "Find the orders composed from a plan"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: Order[]
    side_effects: []

  - method: GET
    path: "/v1/autoship-plans/{id}/items"
    description: "Find the items on a plan, optionally narrowed to one product"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: ["product_id?"]
    output: AutoshipItem[]
    side_effects: []

  - method: GET
    path: "/v1/autoship-items/{id}"
    description: "Read an autoship item by its own identifier"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: AutoshipItem
    side_effects: []

  - method: GET
    path: "/v1/autoship-items/{id}/order-lines"
    description: "Find the order lines composed from an autoship item"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/v1/autoship-plans/{plan_id}/items"
    description: "Add an item to a plan"
    roles: [Customer, CustomerService, PharmacyTechnician]
    code: 201
    input: [product_id, cadence_days, default_quantity]
    output: AutoshipItem
    side_effects:
      - "item_status := ACTIVE; autoship_item_next_due_date := current logical date"
      - "unit_price_cents := Product.unit_price_cents; price_protected_unit_price_cents stays null"
      - "verification_state := UNVERIFIED"
      - "unit_lifecycle_equivalent_days recomputed by run_cadence_days and cadence_prompt_state by cadence_prompt_due_days_delta"
      - "AutoshipPlan.autoship_item_count incremented and next_order_due_date recomputed"

  - method: GET
    path: "/v1/autoship-plans/{plan_id}/items/{item_id}"
    description: "Read an item with its dosage and consumption projections"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: AutoshipItem
    side_effects: []

  - method: POST
    path: "/v1/autoship-plans/{plan_id}/items/{item_id}/cadence"
    description: "Change an item's cadence or default quantity"
    roles: [Customer, CustomerService]
    code: 200
    input: ["expected_item_version", "cadence_days?", "default_quantity?"]
    output: AutoshipItem
    side_effects:
      - "increments AutoshipItem.version by 1"
      - "cadence_days and default_quantity are overwritten when supplied"
      - "advance_item_cadence recomputes autoship_item_next_due_date from the new cadence"
      - "cadence_prompt_state and AutoshipPlan.next_order_due_date recomputed"

  - method: POST
    path: "/v1/autoship-plans/{plan_id}/items/{item_id}/pause"
    description: "Pause an item"
    roles: [Customer, CustomerService]
    code: 200
    input: []
    output: AutoshipItem
    side_effects: ["item_status ACTIVE -> PAUSED", "AutoshipPlan.autoship_item_count recomputed"]

  - method: POST
    path: "/v1/autoship-plans/{plan_id}/items/{item_id}/resume"
    description: "Resume a paused item"
    roles: [Customer, CustomerService]
    code: 200
    input: []
    output: AutoshipItem
    side_effects: ["item_status PAUSED -> ACTIVE", "AutoshipPlan.next_order_due_date recomputed"]

  - method: POST
    path: "/v1/autoship-plans/{plan_id}/items/{item_id}/cancel"
    description: "Cancel an item"
    roles: [Customer, CustomerService]
    code: 200
    input: []
    output: AutoshipItem
    side_effects: ["item_status ACTIVE -> CANCELED", "AutoshipPlan.autoship_item_count recomputed"]

  - method: POST
    path: "/v1/prescriptions"
    description: "Attach a prescription to an autoship item"
    roles: [Customer, CustomerService, PharmacyTechnician, ClinicContact]
    code: 201
    input: ["autoship_item_id", "prescriber_id", "script_source", "drug_schedule", "temperature_sensitive", "authorized_qty_total", "refills_authorized", "script_document_id?", "written_prescriber_email_hash?"]
    output: Prescription
    side_effects:
      - "rx_status := PENDING_VERIFICATION"
      - "callback_attempt_count := 0"
      - "authorized_qty_remaining := authorized_qty_total; refills_used := 0"
      - "the owning AutoshipItem's verification_state := UNVERIFIED"

  - method: GET
    path: "/v1/prescriptions"
    description: "List prescriptions; the automatic VERIFIED to EXPIRED transition is also evaluated on this read for prescriptions whose stamped instant has passed"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ClinicContact, ComplianceOfficer]
    code: 200
    input: ["autoship_item_id?", "rx_status?", "limit?", "offset?"]
    output: Prescription[]
    side_effects: []

  - method: GET
    path: "/v1/prescriptions/{id}"
    description: "Read a prescription"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ClinicContact, ComplianceOfficer]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: POST
    path: "/v1/prescriptions/{id}/clinic-contacts"
    description: "Record a clinic callback attempt"
    roles: [PharmacyTechnician, PharmacyManager]
    code: 200
    input: []
    output: Prescription
    side_effects:
      - "increments AutoshipItem.version by 1"
      - "callback_attempt_count := callback_attempt_count + 1"
      - "rx_status PENDING_VERIFICATION -> VERIFICATION_IN_PROGRESS, or VERIFICATION_IN_PROGRESS -> VERIFICATION_IN_PROGRESS while below the cap, or -> VERIFICATION_FAILED on the third attempt"
      - "on the third attempt the verification-failure cascade fires: AutoshipItem.verification_state -> BLOCKED, then AutoshipPlan.plan_status -> SUSPENDED, then AutoshipPlan.autoship_discount_eligibility -> INELIGIBLE"

  - method: POST
    path: "/v1/prescriptions/{id}/clinic-authorizations"
    description: "Record the veterinarian's authorization of a prescription"
    roles: [ClinicContact]
    code: 200
    input: ["authorized_qty_total?", "refills_authorized?"]
    output: Prescription
    side_effects:
      - "rx_status VERIFICATION_IN_PROGRESS -> VERIFIED"
      - "the prescriber's vet_status LISTED -> VETERINARIAN_VERIFIED"
      - "recompute_item_due_after_verification recomputes the owning item's autoship_item_next_due_date"
      - "verification_expiry_stamp sets verification_expires_at"
      - "the owning AutoshipItem's verification_state -> VERIFIED"

  - method: POST
    path: "/v1/prescriptions/{id}/reopen"
    description: "Reopen a failed verification for another round of attempts"
    roles: [PharmacyManager]
    code: 200
    input: []
    output: Prescription
    side_effects:
      - "rx_status VERIFICATION_FAILED -> PENDING_VERIFICATION"
      - "callback_attempt_count := 0"
      - "the owning AutoshipItem's verification_state BLOCKED -> UNVERIFIED"

  - method: POST
    path: "/v1/orders/{id}/cancel"
    description: "Cancel an order and release its shipment"
    roles: [Customer, CustomerService, PharmacyTechnician]
    code: 200
    input: [cancellation_reason]
    output: Order
    side_effects:
      - "order_status PLACED -> CANCELED or PROCESSING -> CANCELED"
      - "the order's Shipment becomes CANCELED and cold_pack_reserved_units releases its reservation"
      - "order_cancellation_settlement recomputes the order's refund and order_total_components_sum; payment_settlement_net recomputes the plan's released refunds"

  - method: POST
    path: "/v1/orders/{id}/ship"
    description: "Pack, reserve cold-pack units, dispatch and consume refills"
    roles: [PharmacyTechnician, PharmacyManager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "order_status PLACED -> PROCESSING then PROCESSING -> SHIPPED"
      - "Shipment PENDING -> PACKED then PACKED -> DISPATCHED with tracking_code stamped"
      - "refill_consumption_applied debits each prescription: authorized_qty_remaining and refills_used advance, cycling rx_status VERIFIED -> VERIFIED"
      - "cold_pack_units and cold_pack_reserved_units compute and commit the reservation units; transit_window_dates stamps the half-open transit window"
      - "when a prescription reaches authorized_qty_remaining 0 the owning AutoshipItem goes ACTIVE -> COMPLETED"

  - method: POST
    path: "/v1/orders/{id}/deliver"
    description: "Mark an order delivered"
    roles: [PharmacyTechnician, PharmacyManager]
    code: 200
    input: []
    output: Order
    side_effects: ["order_status SHIPPED -> DELIVERED", "Shipment DISPATCHED -> DELIVERED", "payment_settlement_net recomputes the plan's settlement, on which a delivered order carries no refund"]

  - method: GET
    path: "/v1/orders"
    description: "List orders"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: ["autoship_plan_id?", "order_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/v1/orders/{id}"
    description: "Read an order"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/v1/orders/{id}/lines"
    description: "Find the lines of an order"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []

  - method: GET
    path: "/v1/orders/{id}/shipments"
    description: "Find the shipments of an order"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/v1/order-lines"
    description: "List order lines, filterable by order, item or product"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: ["order_id?", "autoship_item_id?", "product_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/v1/shipments"
    description: "Create the shipment record for an order and select its origin site"
    roles: [PharmacyTechnician, PharmacyManager]
    code: 201
    input: [order_id]
    output: Shipment
    side_effects:
      - "Shipment created in PENDING with destination_state copied from the owning pet and origin_site_id chosen by origin_site_selection"
      - "cold_pack_required computed from the order's lines"

  - method: GET
    path: "/v1/shipments"
    description: "List shipments, filterable by order or origin site"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: ["order_id?", "origin_site_id?", "shipment_status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/v1/shipments/{id}"
    description: "Read a shipment"
    roles: [Customer, CustomerService, PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/v1/shipments/{id}/cold-pack-reservations"
    description: "Find the cold-pack reservations of a shipment"
    roles: [PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: []
    output: ColdPackReservation[]
    side_effects: []

  - method: GET
    path: "/v1/cold-pack-reservations"
    description: "List cold-pack reservations by shipment or site"
    roles: [PharmacyTechnician, PharmacyManager, ComplianceOfficer]
    code: 200
    input: ["shipment_id?", "site_id?", "limit?", "offset?"]
    output: ColdPackReservation[]
    side_effects: []

  - method: POST
    path: "/v1/compassionate-reviews/{review_id}/decide"
    description: "Approve or reject a compassionate review"
    roles: [CustomerService]
    code: 200
    input: [outcome]
    output: CompassionateReview
    side_effects:
      - "review_status OPEN -> APPROVED or OPEN -> REJECTED"
      - "on APPROVED, order_cancellation_settlement writes each CANCELED order's refund and the parked shipment goes AWAITING_PET_PASSING_DECISION -> CANCELED"
      - "on REJECTED, no refund is written and the parked shipment still goes AWAITING_PET_PASSING_DECISION -> CANCELED"
      - "pet_lifecycle_state recomputed ARCHIVED"

  - method: GET
    path: "/v1/compassionate-reviews"
    description: "List compassionate reviews, filterable by pet or affected shipment"
    roles: [Customer, CustomerService, ComplianceOfficer]
    code: 200
    input: ["pet_id?", "affected_shipment_id?", "review_status?", "limit?", "offset?"]
    output: CompassionateReview[]
    side_effects: []

  - method: GET
    path: "/v1/compassionate-reviews/{id}"
    description: "Read a compassionate review"
    roles: [Customer, CustomerService, ComplianceOfficer]
    code: 200
    input: []
    output: CompassionateReview
    side_effects: []

  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Test-driving endpoint. Moves the logical clock to current_utc. The clock's startup default is 2026-09-01T00:00:00Z and it never falls back to real wall-clock time until this endpoint is first called, so every deadline, expiry and half-open interval is deterministic."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "current logical date := current_utc"
      - "the prescription_verification machine's automatic VERIFIED -> EXPIRED transition is evaluated for every prescription: any whose verification_expires_at is at or before the new clock value becomes EXPIRED and has its item marked EXPIRATION_MARKED"
      - "every plan's cadence_prompt_due_date is recomputed and every shipment's transit window is re-evaluated against the new clock"

  - method: GET
    path: "/v1/_sites/find-eligible"
    description: "Test-driving endpoint. Runs origin_site_selection in read-only form and returns the candidate sites for a destination state, in ranking order."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["destination_state", "cold_pack_units?", "limit?", "offset?"]
    output: PharmacySite[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  - id: ERR_MISSING_USER_CONTEXT
    http: 401
    condition: "X-User-ID or X-User-Role is absent, or X-User-Role names no declared role"

  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the declared role is not permitted on the target endpoint per §1.7"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path-scoped id does not exist or belongs to another owner"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's status does not match the from: value of the governing §1.2 transition"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing or carries an undeclared value"

  - id: ERR_INVALID_CADENCE
    http: 400
    condition: "cadence_days is outside {14, 21, 28, 42, 56, 84} or default_quantity is below 1"

  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "compose carries an expected_plan_version older than the plan's current version"

  - id: ERR_STALE_ITEM_VERSION
    http: 412
    condition: "cadence update carries an expected_item_version older than the item's current version"

  - id: ERR_PLAN_PAUSED
    http: 409
    condition: "compose is attempted while plan_status is PAUSED"

  - id: ERR_PET_INACTIVE
    http: 409
    condition: "compose or ship is attempted against a plan whose owning pet is PASSED"

  - id: ERR_RX_NOT_VERIFIED
    http: 422
    condition: "a PRESCRIPTION-scope item is composed or shipped without a VERIFIED prescription"

  - id: ERR_RX_EXPIRED
    http: 422
    condition: "the prescription is EXPIRED, or the current logical date is at or past verification_expires_at, or the authorization is older than AUTHORIZATION_GRACE_DAYS"

  - id: ERR_REFILL_LIMIT_EXCEEDED
    http: 422
    condition: "the requested refill_units_consumed exceeds authorized_qty_remaining, or exceeds refills_authorized minus refills_used"

  - id: ERR_RX_QUANTITY_LIMIT_EXCEEDED
    http: 422
    condition: "the order's cumulative PRESCRIPTION quantity for one prescription exceeds MAX_RX_UNITS_PER_ORDER"

  - id: ERR_PRESCRIBER_NOT_FOUND
    http: 422
    condition: "written_prescriber_email_hash names no Veterinarian"

  - id: ERR_PRESCRIBER_MISMATCH
    http: 422
    condition: "written_prescriber_email_hash does not equal the normalized vet_email of the prescription's prescriber"

  - id: ERR_PRESCRIBER_NOT_VERIFIED
    http: 422
    condition: "the prescriber holds vet_status SUSPENDED, RETIRED or BLOCKED, or is not licensed for the destination state"

  - id: ERR_CSR_AUTH_BLOCKED
    http: 422
    condition: "a CII prescription is authorized while some PharmacySite licensed for the owning pet's owner_state has csr_registered false"

  - id: ERR_SITE_NOT_LICENSED
    http: 422
    condition: "the origin site's licensed_states does not contain the shipment's destination_state for a PRESCRIPTION-scope order"

  - id: ERR_SITE_RESTRICTED
    http: 409
    condition: "the origin site is CLOSED, or is RESTRICTED and the shipment belongs to a new autoship order"

  - id: ERR_COLD_PACK_CAPACITY_EXCEEDED
    http: 422
    condition: "committing the shipment's cold-pack units would exceed the site's cold_pack_capacity_units"

  - id: ERR_TEMPERATURE_CHAIN_RISK
    http: 422
    condition: "a temperature-sensitive line's transit interval overlaps a window with no cold-pack coverage at the origin site"

  - id: ERR_CADENCE_WINDOW_OVERLAP
    http: 409
    condition: "the requested cadence window intersects the plan's half-open blackout interval [blackout_start_date, blackout_end_date)"

  - id: ERR_PRICE_PROTECTION_CONFLICT
    http: 422
    condition: "the price-protected line total exceeds the plan's outstanding balance"

  - id: ERR_PROMO_STACKING_NOT_ALLOWED
    http: 422
    condition: "a promotion is supplied on an order whose raw autoship discount is nonzero, or on a plan whose autoship_discount_eligibility is INELIGIBLE"

  - id: ERR_ORDER_ALREADY_SHIPPED
    http: 409
    condition: "a shipment is created for an order that already has one, or for an order not in PLACED"

  - id: ERR_SUBMITTER_CANNOT_AUTHORIZE
    http: 403
    condition: "the authorizing identity equals the identity that recorded the submission on the same prescription"

  - id: ERR_NO_ELIGIBLE_SITE
    http: 409
    condition: "origin_site_selection finds no eligible candidate for the destination state and cold-pack load"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Customer
    description: "Pet owner; enrolls autoship plans, records weights and reports passings"
    identity: entity_backed:Pet
    exclusive_operations:
      - "POST /v1/pets — register an owned pet"
      - "POST /v1/pets/{id}/weights — record an owned pet's weight"
      - "POST /v1/pets/{id}/passings — report an owned pet's passing"
      - "POST /v1/autoship-plans — enroll an owned pet"
    shared_operations:
      - "POST /v1/veterinarians"
      - "POST /v1/autoship-plans/{plan_id}/items"
      - "POST /v1/autoship-plans/{plan_id}/items/{item_id}/cadence"
      - "POST /v1/autoship-plans/{plan_id}/items/{item_id}/pause"
      - "POST /v1/autoship-plans/{plan_id}/items/{item_id}/resume"
      - "POST /v1/autoship-plans/{plan_id}/items/{item_id}/cancel"
      - "POST /v1/autoship-plans/{id}/pause"
      - "POST /v1/autoship-plans/{id}/resume"
      - "POST /v1/autoship-plans/{id}/cancel"
      - "POST /v1/autoship-plans/{id}/compose"
      - "POST /v1/prescriptions"
      - "POST /v1/orders/{id}/cancel"

  - name: ClinicContact
    description: "Veterinary clinic staff acting for a prescriber; confirms a prescription after the callback workflow"
    identity: entity_backed:Veterinarian
    exclusive_operations:
      - "POST /v1/prescriptions/{id}/clinic-authorizations — record the prescriber's authorization"
    shared_operations:
      - "POST /v1/veterinarians"
      - "POST /v1/prescriptions"

  - name: PharmacyTechnician
    description: "Pharmacy operations; runs callbacks, packs, dispatches and cancels orders"
    identity: opaque
    exclusive_operations:
      - "POST /v1/shipments — create a shipment and select its origin site"
      - "POST /v1/orders/{id}/ship"
      - "POST /v1/orders/{id}/deliver"
      - "POST /v1/prescriptions/{id}/clinic-contacts — record a callback attempt"
    shared_operations:
      - "POST /v1/autoship-plans"
      - "POST /v1/autoship-plans/{id}/compose"
      - "POST /v1/autoship-plans/{plan_id}/items"
      - "POST /v1/orders/{id}/cancel"

  - name: PharmacyManager
    description: "Pharmacy supervisor; reopens failed verifications, suspends plans and ships"
    identity: opaque
    exclusive_operations:
      - "POST /v1/prescriptions/{id}/reopen"
    shared_operations:
      - "POST /v1/orders/{id}/ship"
      - "POST /v1/orders/{id}/deliver"
      - "POST /v1/shipments"
      - "POST /v1/prescriptions/{id}/clinic-contacts"
      - "POST /v1/autoship-plans/{id}/suspend"

  - name: CustomerService
    description: "Care agent; handles cancellations, passings and compassionate decisions"
    identity: opaque
    exclusive_operations:
      - "POST /v1/compassionate-reviews/{review_id}/decide — approve or reject a review"
    shared_operations:
      - "POST /v1/pets"
      - "POST /v1/pets/{id}/weights"
      - "POST /v1/pets/{id}/passings"
      - "POST /v1/autoship-plans"
      - "POST /v1/autoship-plans/{id}/pause"
      - "POST /v1/autoship-plans/{id}/resume"
      - "POST /v1/autoship-plans/{id}/suspend"
      - "POST /v1/autoship-plans/{id}/cancel"
      - "POST /v1/autoship-plans/{id}/compose"
      - "POST /v1/orders/{id}/cancel"

  - name: ComplianceOfficer
    description: "Licensing and shipping-restriction authority; owns sites and catalog medication scope"
    identity: opaque
    exclusive_operations:
      - "POST /v1/pharmacy-sites"
      - "POST /v1/pharmacy-sites/{id}/restrict"
      - "POST /v1/pharmacy-sites/{id}/clear-restriction"
      - "POST /v1/pharmacy-sites/{id}/close"
      - "POST /v1/products"
      - "POST /v1/products/{id}/price"
      - "POST /v1/veterinarians/{id}/status"
    shared_operations:
      - "GET /v1/pharmacy-sites"
      - "GET /v1/prescriptions"

  - name: PlatformAdmin
    description: "Platform operator; exposes the logical clock and the read-only site selector"
    identity: opaque
    exclusive_operations:
      - "POST /v1/_clock/set_current_utc"
      - "POST /v1/veterinarians/{id}/status"
    shared_operations:
      - "GET /v1/_sites/find-eligible"