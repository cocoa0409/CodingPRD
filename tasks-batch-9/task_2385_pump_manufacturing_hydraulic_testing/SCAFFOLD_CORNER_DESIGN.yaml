          The running-clearance band is [min_running_clearance_mm, min + CLEARANCE_BAND_WIDTH_MM] = [0.30,
          0.45] mm and BOTH ends are inclusive: 0.29 mm is too tight and 0.46 mm too slack, so each must
          return 422 with residual unbalance well inside its own allowance, isolating priority 60 from
          priority 59; 0.30 mm on the lower edge is then accepted.
