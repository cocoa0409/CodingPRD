              captures: { tc_sh_id: $.data.id, tc_sh_v: $.data.version }
          trigger:
            - call: "POST /offers"
              payload: { show_id: "${tc_sh_id}", expected_show_version: "${tc_sh_v}", deal_structure: "GUARANTEE", guarantee_cents: 1000000, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { tc_bad_enum: $.data.error_id }
            - call: "POST /offers"
              payload: { show_id: "${tc_sh_id}", expected_show_version: "${tc_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 0, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { tc_zero_guarantee: $.data.error_id }
            - call: "POST /offers"
              payload: { show_id: "${tc_sh_id}", expected_show_version: "${tc_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 1000001, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { tc_deposit_over: $.data.error_id }
            - call: "POST /artists"
              payload: { name: "Over Withholding", agency: "Typ Talent", tier: "CLUB", historical_sellthrough_pct: 50.00, withholding_pct: 40.01 }
              as: TalentBuyer
              captures: { tc_withholding_over: $.data.error_id }
            - call: "POST /artists"
