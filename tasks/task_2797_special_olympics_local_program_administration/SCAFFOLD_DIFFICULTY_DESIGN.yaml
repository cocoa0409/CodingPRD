  - rule_id: non_linear_state_machine
    instances:
      - name: athlete_parallel_registration_and_medical_dimensions
        grounds:
          - state_machines.Athlete.registration_status.ACTIVE_to_LAPSED
          - state_machines.Athlete.medical_status.CLEARED_to_HOLD
          - entities.Athlete.fields.registration_status
          - entities.Athlete.fields.medical_status
          - calculations.athlete_registration_expiry
        distinguishing_aspect: |
          Athlete carries two independent state dimensions on one row: an URGENT health screening drives
          medical_status CLEARED -> HOLD while registration_status stays ACTIVE, and a later sweep drives
          registration_status ACTIVE -> LAPSED while medical_status stays HOLD - neither dimension's
          transition is a precondition of the other.
        test_recipe:
          setup:
            - "One program and one athlete whose medical form was approved on 2026-08-01"
            - "registration_expires_on is min(2026-06-15 + 1095, 2026-08-01 + 365) = 2027-08-01"
            - "An URGENT screening logged on 2026-08-01 puts the medical dimension in HOLD"
            - "Clock advanced to 2027-08-02, one day past the registration expiry"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Maya Foster", birth_date: "2004-03-09", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath: $.data.id }
            - call: "POST /athletes/${ath}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
              as: ProgramManager
              captures: { form: $.data.id }
            - call: "POST /medical-forms/${form}/review"
              payload: { decision: "APPROVE" }
              as: MedicalReviewer
              as_user_id: "reviewer-1"
            - call: "POST /health-screenings"
              payload: { athlete_id: "${ath}", event_name: "Riverbend Fall Games", discipline: "HEALTHY_HEARING", screened_on: "2026-08-01", finding_severity: "URGENT", finding_note: "Bilateral conductive loss, immediate referral" }
              as: HealthScreeningLead
              captures: { scr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-02T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /programs/${prog}/compliance-sweep"
              payload: {}
              as: ProgramManager
          assert:
            - "Athlete.${ath}.registration_expires_on == 2027-08-01"
            - "Athlete.${ath}.registration_status == LAPSED"
            - "Athlete.${ath}.medical_status == HOLD"
            - "MedicalForm.${form}.status == APPROVED and MedicalForm.${form}.expires_on == 2029-06-14"
            - "HealthScreening.${scr}.referral_status == ESCALATED and HealthScreening.${scr}.referral_due_on == 2026-08-31"
            - "Program.${prog}.unresolved_urgent_referral_count == 1"
            - "Program.${prog}.compliance_posture == FROZEN"
            - "Program.${prog}.sweep_epoch == 1 and Program.${prog}.last_sweep_at == 2027-08-02T00:00:00.000Z"

      - name: credential_fork_join_and_renewal_cycle
        grounds:
          - state_machines.Credential.INITIATED_to_TRAINING_COMPLETE
          - state_machines.Credential.TRAINING_COMPLETE_to_READY_TO_CERTIFY
          - state_machines.Credential.EXPIRED_to_RENEWAL_IN_PROGRESS
          - state_machines.Credential.RENEWAL_IN_PROGRESS_to_CERTIFIED
          - calculations.credential_effective_expiry
        distinguishing_aspect: |
          Credential is a fork-join plus a cycle on a different entity from Athlete: the training branch
          is recorded before the screening branch (proving branch order is free), the join only fires
          when both are present, and after sweep-driven expiry the same row re-enters the cycle through
          RENEWAL_IN_PROGRESS and returns to CERTIFIED with a freshly computed expiry.
        test_recipe:
          setup:
            - "One program with one coach volunteer and one credential"
            - "Training recorded first on 2026-07-05, then screening on 2026-07-01, then certification at clock 2026-08-01 giving expires_on 2027-07-05"
            - "Clock advanced to 2027-07-06 and a sweep run so the credential is EXPIRED"
            - "Both branches re-recorded on 2027-07-06, putting the credential in RENEWAL_IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CredentialingOfficer
