              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu}/outfit"
              payload: { hardware_kit_serial: "HK-X6C-01" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
              captures: { fu_v_outfitted: $.data.version }
          trigger:
            - call: "POST /finished-units/${fu}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { err_five: $.data.error_id }
            - call: "GET /finished-units/${fu}"
              payload: {}
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { fu_v_after_reject: $.data.version }
            - call: "POST /finished-units/${fu}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { verdict: $.data.inspection_verdict, cv: $.data.wall_cv_pct }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the 5-point call returns HTTP 422 with error_id ERR_INSUFFICIENT_MEASUREMENTS: n == 5 < MIN_MEASUREMENT_POINTS 6"
            - "${fu_v_after_reject} == ${fu_v_outfitted}   (the refused inspection wrote nothing, so FinishedUnit.version did not move)"
            - "FinishedUnit.${fu}.build_status after the refused call is still OUTFITTED and inspection_verdict is still PENDING"
            - "the 6-point call is ACCEPTED with HTTP 200: n == 6 == MIN_MEASUREMENT_POINTS, so exactly the minimum cardinality passes"
            - "FinishedUnit.${fu}.mean_wall_thickness_mm == 6.000   (sum 36.00 / 6, rounded to 3 dp)"
            - "FinishedUnit.${fu}.wall_sd_mm == 0.065   (population sd about the ROUNDED mean 6.000: sqrt(0.0255 / 6) == 0.06519..., rounded to 3 dp)"
            - "FinishedUnit.${fu}.wall_cv_pct == 1.08   (0.065 / 6.000 * 100 == 1.08333..., rounded to 2 dp, computed from the two already-rounded values)"
            - "FinishedUnit.${fu}.min_wall_thickness_mm == 5.900 and 5.900 >= wall_thickness_min_mm 4.50, so clause 1 of the verdict ladder does not scrap"
            - "FinishedUnit.${fu}.final_warpage_index == 0.000 and FinishedUnit.${fu}.inspection_verdict == PASS"
            - "FinishedUnit.${fu}.build_status == SELLABLE and FinishedUnit.${fu}.logistics_status == UNALLOCATED"
            - "ProductionOrder.${po}.completed_qty == 1 and ProductionOrder.${po}.status == COMPLETE"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # Two dependencies across DIFFERENT entity pairs: ProductionOrder gated by
  # ResinLot availability (upstream material), and FinishedUnit storage gated by
  # Warehouse posture (downstream capacity). Each instance drives the gate CLOSED
  # and then OPEN again so the dependency is observable in both directions.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: production_order_blocks_on_resin_lot_quarantine_and_unblocks_on_release
        grounds:
          - state_machines.ProductionOrder.IN_PRODUCTION_to_BLOCKED_RESIN
          - state_machines.ProductionOrder.BLOCKED_RESIN_to_READY_TO_SCHEDULE
          - state_machines.ResinLot.AVAILABLE_to_QUARANTINED
          - state_machines.ResinLot.QUARANTINED_to_AVAILABLE
          - calculations.qualified_resin_lot_count
          - validations[priority=34]
          - errors.ERR_ORDER_NOT_SCHEDULABLE
          - "CASCADE-F links 2-4"
        distinguishing_aspect: |
          The dependency crosses the ProductionOrder <- ResinLot pair, in the UPSTREAM material
          direction: quarantining the only qualified lot drops calculations.qualified_resin_lot_count
          to 0 and drives the order IN_PRODUCTION -> BLOCKED_RESIN with blocked_reason
          NO_QUALIFIED_RESIN_LOT, so a subsequent POST /molding-cycles is refused 409
          ERR_ORDER_NOT_SCHEDULABLE, and release-quarantine on that same lot returns the order to
          READY_TO_SCHEDULE and makes the identical POST succeed.
        test_recipe:
          setup:
            - "ProductModel PM-X7A-KM: KAYAK/MID, resin_grade HDPE_LINEAR, master_color_code SEAFOAM, max_color_delta_e 1.50, required_additive_package_code UV12, max_regrind_pct 30.00, melt band 2.50 to 6.00, nominal_charge_kg 24.000, charge_tolerance_pct 5.00."
            - "Single-cavity Mold MLD-X7A-1 (nominal_charge_kg 24.000, service_interval_cycles 10), OvenStation OV-X7A (arm_count 2, changeover_buffer_min 15, max_size_class OVERSIZE), CoolingBay CB-X7A (concurrent_slot_capacity 2, FORCED_AIR)."
            - "Three distinct ACTIVE Technicians: T-X7A-RES (RESIN_TECH, RESIN_BLENDING), T-X7A-OPR (MOLDING_OPERATOR) and T-X7A-QCI (QUALITY_INSPECTOR with WALL_GAUGE and IMPACT_RIG) — the quarantine endpoint is QualityInspector-exclusive."
            - "Warehouse WH-X7A with footprint_capacity_cube_m3 20.0000 in one zone Z-A; nothing is stored, so posture is NORMAL throughout and the BLOCKED_WAREHOUSE branch of the unblock edge never fires."
            - "EXACTLY ONE lot exists for this grade: ResinLot LOT-X7A (HDPE_LINEAR, melt_index_g10min 4.00, colour SEAFOAM with color_delta_e 0.50, additive UV12, regrind_pct_by_mass 10.00, received_kg 500.000, expires_on 2027-12-31) in status AVAILABLE — so qualified_resin_lot_count for PM-X7A-KM is exactly 1 and quarantining it takes the count to 0."
            - "ProductionOrder PO-X7A (ordered_qty 2, no demand_bucket_id) was released while the lot was AVAILABLE, so it went DRAFT -> READY_TO_SCHEDULE, and one MoldingCycle at 09:00-10:30 was then accepted, moving the order READY_TO_SCHEDULE -> IN_PRODUCTION."
            - "That cycle holds one RESERVED ResinCharge of 24.000 kg (regrind 2.400 kg, charge_regrind_pct 10.00), so the lot reads available_kg 476.000 / reserved_kg 24.000 / consumed_kg 0.000 and the cycle is still SCHEDULED — no oven has been started, so CASCADE-F can reach it."
            - "The logical clock is still at its 2026-08-01T00:00:00Z default, so both the existing 09:00 window and the replacement 12:00 window are in the future (§1.4 priority 63) and no lot has expired."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-X7A-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X7A-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-X7A", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-X7A", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-X7A-RES", full_name: "Rina Resin", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-X7A-OPR", full_name: "Omar Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-X7A-QCI", full_name: "Qadir Quality", role_code: "QUALITY_INSPECTOR", certifications: ["WALL_GAUGE", "IMPACT_RIG"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_qc: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-X7A", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-X7A", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-X7A", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v1: $.data.version, po_status_released: $.data.status }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc1: $.data.id }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v1: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc1}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${lot_v1}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ch1: $.data.id }
          trigger:
            - call: "POST /resin-lots/${lot}/quarantine"
              payload: { quarantine_reason: "COLOUR_DRIFT_AUDIT" }
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { lot_status_q: $.data.status }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_status_blocked: $.data.status, po_reason_blocked: $.data.blocked_reason, po_v2: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T12:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { err_blocked: $.data.error_id }
            - call: "POST /resin-lots/${lot}/release-quarantine"
              payload: { release_note: "Colour audit closed; lot returned to service" }
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { lot_status_r: $.data.status }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_status_ok: $.data.status, po_reason_ok: $.data.blocked_reason, po_v3: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T12:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v3}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc2: $.data.id }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "${po_status_released} == READY_TO_SCHEDULE   (the order was schedulable while the lot was AVAILABLE)"
            - "ResinLot.${lot}.status == QUARANTINED immediately after the quarantine call"
            - "ResinCharge.${ch1}.status == RELEASED and ResinCharge.${ch1}.released_reason == LOT_QUARANTINED   (CASCADE-F link 2)"
            - "MoldingCycle.${cyc1}.status == ABORTED and MoldingCycle.${cyc1}.abort_reason == LOT_QUARANTINED   (CASCADE-F link 3)"
            - "${po_status_blocked} == BLOCKED_RESIN and ${po_reason_blocked} == NO_QUALIFIED_RESIN_LOT   (CASCADE-F link 4, because completed_qty 0 < ordered_qty 2 and qualified_resin_lot_count fell to 0)"
            - "the 12:00 POST /molding-cycles issued while the order is BLOCKED_RESIN returns HTTP 409 with error_id ERR_ORDER_NOT_SCHEDULABLE (§1.4 priority 34), and it wins over §1.4 priority 62 because no arm conflict is even evaluated"
            - "ResinLot.${lot}.available_kg == 500.000 and reserved_kg == 0.000 and consumed_kg == 0.000 after the quarantine cascade — aborting from SCHEDULED returns the full reservation"
            - "${lot_status_r} == AVAILABLE after release-quarantine"
            - "${po_status_ok} == READY_TO_SCHEDULE and ${po_reason_ok} == null   (the only outbound edge from BLOCKED_RESIN; the order does NOT return to IN_PRODUCTION)"
            - "the IDENTICAL 12:00 POST /molding-cycles now returns HTTP 201 and MoldingCycle.${cyc2}.status == SCHEDULED with mold_id == ${mold}"
            - "ProductionOrder.${po}.status == IN_PRODUCTION after the accepted cycle and ${po_v3} == ${po_v2} + 1"

      - name: finished_unit_store_gated_by_warehouse_frozen_posture
        grounds:
          - state_machines.FinishedUnit.logistics.UNALLOCATED_to_STORED
          - state_machines.Warehouse.NORMAL_to_FROZEN
          - state_machines.Warehouse.FROZEN_to_NORMAL
          - state_machines.ProductionOrder.IN_PRODUCTION_to_BLOCKED_WAREHOUSE
          - state_machines.ProductionOrder.BLOCKED_WAREHOUSE_to_READY_TO_SCHEDULE
          - validations[priority=40]
          - errors.ERR_WAREHOUSE_FROZEN
          - "CASCADE-H link 4"
          - "CASCADE-C link 4"
        distinguishing_aspect: |
          The dependency crosses a DIFFERENT pair — FinishedUnit <- Warehouse — and runs in the
          DOWNSTREAM capacity direction rather than the upstream material direction of
          production_order_blocks_on_resin_lot_quarantine_and_unblocks_on_release: a hull's
          UNALLOCATED -> STORED transition is legal only while its target site's posture is not
          FROZEN, so the second store drives the site to 100.00 pct utilisation and the third
          store is refused 409 ERR_WAREHOUSE_FROZEN until a release-storage on a sibling pulls
          the site back to NORMAL.
