      - name: panel_pass_bubbles_up_to_sku_provisional_certification
        claim_type: side_effect_execution
        grounds:
          - "state_machines.TestPanel IN_TEST -> PASSED side effect (CASCADE to ProductSku)"
          - "state_machines.ProductSku certification_status=TESTING -> PROVISIONAL"
          - "calculations.test_spec_limit_and_outcome"
        distinguishing_aspect: |
          The bubble-up fires from the CHILD's completion, not from any call on the SKU:
          the second result completes coverage, flips the panel to PASSED, and the parent
          SKU's certification dimension advances to PROVISIONAL in the same request — and
          it does so only because the passing coverage contains both gate test types.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
