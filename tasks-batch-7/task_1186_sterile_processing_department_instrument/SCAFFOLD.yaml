# =============================================================================
# PRD Benchmark Seed Tables — Sterile Processing Department (SPD) & Instrument Tracking
# =============================================================================

scenario: |
  Sterile Processing Department & Instrument Tracking (hospital SPD): tray assembly count sheet & instrument inventory, decontamination-to-sterilization workflow with load documentation, biological indicator monitoring & load release/recall, tray availability vs OR schedule demand, immediate-use sterilization exception tracking, instrument repair/replacement cycle, technician certification & competency, loaner set intake deadline & processing

domain_name: sterile-processing-department
api_prefix: /spd

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers: [cascading_side_effects, rate_threshold_triggers, derived_field_reconciliation, optimistic_concurrency]
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# All timestamps are evaluated against the server's logical clock (see
# POST /_clock/set_current_utc; default 2026-05-01T00:00:00Z).
# =============================================================================
entities:
  - name: TrayTemplate
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique template code (e.g. ORTHO-MAJOR-01); duplicates rejected with ERR_DUPLICATE_TEMPLATE_CODE" }
      - { name: name, type: string, source: input, description: "Human-readable tray name" }
      - { name: specialty, type: string, source: input, description: "Surgical specialty label" }
      - { name: packaging_type, type: enum, source: input, description: "WRAPPED | RIGID_CONTAINER; drives sterility shelf-life tier" }
      - { name: instrument_requirements, type: array, source: input, description: "Count sheet spec: list of {instrument_type: string, quantity: integer >= 1}; must be non-empty" }
      - { name: assembly_minutes, type: integer, source: input, description: "Standard assembly labor minutes" }

  - name: Tray
    parent: null
    common_fields: true
    fields:
      - { name: template_id, type: string, source: system, description: "FK -> TrayTemplate.id; set at creation" }
      - { name: label, type: string, source: input, description: "Physical tray label / barcode text" }
      - { name: status, type: enum, source: system, description: "AWAITING_DECONTAMINATION | IN_DECONTAMINATION | DECONTAMINATED | IN_ASSEMBLY | ASSEMBLED | IN_LOAD | STERILE | IN_USE | QUARANTINED | DISCARDED. Reservations are temporal bookings on a STERILE tray and do not change tray status; a tray may hold multiple non-overlapping reservations." }
      - { name: current_load_id, type: string, source: system, description: "FK -> SterilizationLoad.id; null unless status == IN_LOAD", constraints: "nullable" }
      - { name: sterility_expires_at, type: datetime, source: computed, description: "Set at load release = released_at + shelf hours by template.packaging_type; null unless STERILE/RESERVED/IN_USE-from-sterile", constraints: "nullable" }
      - { name: cycles_completed, type: integer, source: system, default: 0, description: "Increments by 1 each time the tray survives a load release (IN_LOAD -> STERILE)" }
      - { name: quarantine_reason, type: string, source: system, description: "Free-text reason copied from the triggering recall; null when not quarantined", constraints: "nullable" }

  - name: AssemblyVerification
    parent: Tray
    common_fields: false
    fields:
      - { name: tray_id, type: string, source: system, description: "FK -> Tray.id; the tray whose count sheet was verified" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; the acting technician from X-User-ID" }
      - { name: lines, type: array, source: input, description: "Submitted count sheet: list of {instrument_type: string, counted_qty: integer >= 0}" }
      - { name: result, type: enum, source: computed, description: "PASS when every template requirement matches counted_qty exactly and no extra instrument_type appears; else FAIL" }
      - { name: mismatch_count, type: integer, source: computed, description: "Number of requirement lines (including missing types, counted as 0, and unexpected extra types) whose counted_qty != required quantity" }

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - { name: instrument_type, type: string, source: input, description: "Type key matching template requirement lines (e.g. SCALPEL)" }
      - { name: serial_number, type: string, source: input, description: "Unique serial; duplicates rejected with ERR_DUPLICATE_SERIAL_NUMBER" }
      - { name: max_cycles, type: integer, source: input, description: "Lifecycle limit; assignment blocked when usage_cycles >= max_cycles" }
      - { name: usage_cycles, type: integer, source: input, default: 0, description: "Sterilization cycles already survived; may be registered non-zero for used stock; +1 on each load release of the assigned tray" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "New-unit replacement cost in cents (> 0)" }
      - { name: criticality, type: enum, source: input, description: "ROUTINE | CRITICAL" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | FLAGGED_FOR_REPAIR | OUT_FOR_REPAIR | RETIRED" }
      - { name: repair_count, type: integer, source: system, default: 0, description: "Number of completed repairs (receive outcome FIXED)" }
      - { name: assigned_tray_id, type: string, source: system, description: "FK -> Tray.id; null when unassigned", constraints: "nullable" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: system, description: "FK -> Instrument.id; set by flag-for-repair" }
      - { name: status, type: enum, source: system, description: "OPEN | SENT | CLOSED_FIXED | CLOSED_CONDEMNED" }
      - { name: vendor, type: string, source: input, description: "Repair vendor name (set at send)" }
      - { name: quoted_cost_cents, type: integer, source: input, description: "Quoted repair cost in cents (set at send)" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Final invoiced cost in cents (set at receive)" }
      - { name: recommended_outcome, type: enum, source: computed, description: "FIXED | CONDEMNED per repair_vs_replace_recommendation, computed at receive" }
      - { name: outcome, type: enum, source: system, description: "FIXED | CONDEMNED; the disposition applied at receive", constraints: "nullable until closed" }
      - { name: outcome_overridden, type: boolean, source: computed, default: false, description: "True when applied outcome != recommended_outcome (requires override_justification)" }

  - name: Sterilizer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sterilizer name" }
      - { name: method, type: enum, source: input, description: "STEAM_GRAVITY | STEAM_PREVAC | LOW_TEMP_H2O2" }
      - { name: chamber_capacity, type: integer, source: input, description: "Max trays per load (>= 1)" }
      - { name: cycle_minutes, type: integer, source: input, description: "Nominal cycle length in minutes (>= 1)" }
      - { name: required_certification_level, type: integer, source: input, description: "Minimum technician certification_level, 1..3" }
      - { name: status, type: enum, source: system, description: "IDLE | RUNNING; RUNNING while one of its loads is RUNNING" }

  - name: SterilizationLoad
    parent: null
    common_fields: true
    fields:
      - { name: sterilizer_id, type: string, source: input, description: "FK -> Sterilizer.id" }
      - { name: operator_id, type: string, source: system, description: "FK -> Technician.id; creator's X-User-ID" }
      - { name: planned_start_at, type: datetime, source: input, description: "Planned cycle start; defines the planned occupation window [planned_start_at, planned_start_at + cycle_minutes)" }
      - { name: started_at, type: datetime, source: system, description: "Actual start timestamp", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Cycle completion timestamp", constraints: "nullable" }
      - { name: released_at, type: datetime, source: system, description: "Release timestamp; basis for sterility expiry", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "LOADING | RUNNING | COMPLETED | RELEASED | FAILED_CYCLE | FAILED_BI | RECALLED | ABORTED" }
      - { name: tray_count, type: integer, source: computed, default: 0, description: "Number of member trays currently IN_LOAD on this load" }
      - { name: total_chargeback_cents, type: integer, source: computed, description: "Department chargeback per load_reprocessing_chargeback; null until RELEASED", constraints: "nullable" }
      - { name: recall_reason, type: string, source: system, description: "Reason recorded at recall (manual recall input or 'BI_POSITIVE')", constraints: "nullable" }
      - { name: recalled_at, type: datetime, source: system, description: "Timestamp of the RELEASED -> RECALLED transition; feeds loads_recalled_30d", constraints: "nullable" }

  - name: BiologicalIndicator
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> SterilizationLoad.id; exactly one BI per load, auto-created at load completion" }
      - { name: lot_number, type: string, source: system, default: "AUTO-LOT", description: "BI vial lot identifier" }
      - { name: status, type: enum, source: system, description: "INCUBATING | RESULT_RECORDED" }
      - { name: result, type: enum, source: system, description: "PENDING | NEGATIVE | POSITIVE" }
      - { name: due_at, type: datetime, source: computed, description: "= load.completed_at + BI_INCUBATION_HOURS (3h); result cannot be recorded before this instant" }
      - { name: recorded_at, type: datetime, source: system, description: "Timestamp of record-result", constraints: "nullable" }

  - name: ORCase
    parent: null
    common_fields: true
    fields:
      - { name: case_number, type: string, source: input, description: "Unique OR case number; duplicates rejected with ERR_INVALID_REQUEST" }
      - { name: surgeon, type: string, source: input, description: "Surgeon name" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Scheduled case start (must be < scheduled_end_at)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Scheduled case end" }
      - { name: priority, type: enum, source: input, description: "ELECTIVE | URGENT | EMERGENCY" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | TRAYS_RESERVED | AT_RISK | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "Completion timestamp; feeds compliance windows", constraints: "nullable" }

  - name: TrayReservation
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ORCase.id; from path" }
      - { name: tray_id, type: string, source: input, description: "FK -> Tray.id; the reserved tray" }
      - { name: status, type: enum, source: system, description: "RESERVED | USED | RELEASED | CANCELLED" }
      - { name: reserved_at, type: datetime, source: system, description: "Timestamp of reservation creation" }

  - name: IussException
    parent: null
    common_fields: true
    fields:
      - { name: tray_id, type: string, source: input, description: "FK -> Tray.id; the tray flashed for immediate use" }
      - { name: case_id, type: string, source: input, description: "FK -> ORCase.id; the case the tray was flashed for" }
      - { name: justification, type: string, source: input, description: "Free-text justification, >= 20 chars (ERR_JUSTIFICATION_TOO_SHORT)" }
      - { name: logged_by_id, type: string, source: system, description: "FK -> Technician.id; creator's X-User-ID" }
      - { name: logged_at, type: datetime, source: system, description: "Logical-clock timestamp of logging" }
      - { name: status, type: enum, source: system, description: "DOCUMENTED | REVIEWED" }
      - { name: review_note, type: string, source: input, description: "Optional auditor note set at review", constraints: "nullable" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Technician name" }
      - { name: certification_level, type: integer, source: input, description: "1..3; must be >= sterilizer.required_certification_level to start a load" }
      - { name: certified_methods, type: array, source: input, description: "Non-empty list of STEAM_GRAVITY | STEAM_PREVAC | LOW_TEMP_H2O2" }
      - { name: certification_expires_at, type: datetime, source: input, description: "Certification expiry instant; status flips to CERTIFICATION_EXPIRED once the logical clock passes it" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CERTIFICATION_EXPIRED" }
      - { name: competency_score, type: number, source: computed, default: 100, description: "Rolling 90-day competency per technician_competency_score (rolling_90d variant); floor 0" }
      - { name: competency_score_lifetime, type: number, source: computed, default: 100, description: "Lifetime variant (no window, no decay); floor 0" }

  - name: LoanerSet
    parent: null
    common_fields: true
    fields:
      - { name: vendor, type: string, source: input, description: "Loaner vendor name" }
      - { name: case_id, type: string, source: input, description: "FK -> ORCase.id; the case this set is loaned for" }
      - { name: tray_count, type: integer, source: input, description: "Number of trays in the loaner set (>= 1)" }
      - { name: due_by, type: datetime, source: computed, description: "= case.scheduled_start_at - lead hours per loaner_intake_deadline (24h, or 48h when tray_count >= 10)" }
      - { name: received_at, type: datetime, source: system, description: "Intake timestamp", constraints: "nullable" }
      - { name: received_late, type: boolean, source: computed, default: false, description: "True when received_at > due_by (strictly; equality is on time)" }
      - { name: status, type: enum, source: system, description: "BOOKED | RECEIVED | LATE_RECEIVED | READY | IN_USE | RETURNED" }

# =============================================================================
# Table 2: State Machine Table
# "Lazy sweep" note: the logical clock is the only time source. Two system
# transitions (Tray sterility expiry, Technician certification expiry) are
# evaluated lazily and deterministically: the server applies any due sweep to
# the TARGET entity of the endpoint being served (the addressed resource, or
# each row of a list response) before validation/response. Linked entities are
# NOT swept transitively — e.g. POST /spd/or-cases/{id}/start observes its
# reserved trays as stored, so a tray whose expiry passed but which has not
# itself been read/touched still trips ERR_RESERVED_TRAY_EXPIRED at case start;
# a subsequent direct GET of that tray then applies the sweep.
# =============================================================================
state_machines:
  - entity: Tray
    initial_state: AWAITING_DECONTAMINATION
    terminal_states: [DISCARDED]
    transitions:
      - from: AWAITING_DECONTAMINATION
        to: IN_DECONTAMINATION
        trigger: "POST /spd/trays/{id}/decontamination/start"
        actor: SpdTechnician
        preconditions: ["tray.status in {AWAITING_DECONTAMINATION, QUARANTINED} (ERR_TRAY_NOT_READY_FOR_DECONTAMINATION)"]
        side_effects: ["quarantine_reason cleared to null when entering from QUARANTINED (reprocessing)"]
      - from: QUARANTINED
        to: IN_DECONTAMINATION
        trigger: "POST /spd/trays/{id}/decontamination/start"
        actor: SpdTechnician
        preconditions: ["tray.status in {AWAITING_DECONTAMINATION, QUARANTINED} (ERR_TRAY_NOT_READY_FOR_DECONTAMINATION)"]
        side_effects: ["quarantine_reason cleared to null"]
      - from: IN_DECONTAMINATION
        to: DECONTAMINATED
        trigger: "POST /spd/trays/{id}/decontamination/complete"
        actor: SpdTechnician
        preconditions: ["tray.status == IN_DECONTAMINATION (ERR_TRAY_NOT_IN_DECONTAMINATION)"]
        side_effects: []
      - from: DECONTAMINATED
        to: IN_ASSEMBLY
        trigger: "POST /spd/trays/{id}/assembly/start"
        actor: SpdTechnician
        preconditions: ["tray.status == DECONTAMINATED (ERR_TRAY_NOT_DECONTAMINATED)"]
        side_effects: []
      - from: IN_ASSEMBLY
        to: ASSEMBLED
        trigger: "system (POST /spd/trays/{id}/assembly-verifications with computed result == PASS)"
        actor: SpdTechnician
        preconditions: ["tray.status == IN_ASSEMBLY (ERR_TRAY_NOT_IN_ASSEMBLY)", "verification result == PASS (every requirement line counted_qty == required quantity, no extra types)"]
        side_effects: ["AssemblyVerification record persisted (result PASS, mismatch_count 0)"]
        note: "A FAIL verification leaves the tray in IN_ASSEMBLY, persists the record (result FAIL, mismatch_count > 0), and adds a -2 competency event for the acting technician; re-verification is allowed."
      - from: ASSEMBLED
        to: IN_LOAD
        trigger: "POST /spd/sterilization-loads/{loadId}/trays"
        actor: SpdTechnician
        preconditions: ["tray.status == ASSEMBLED (ERR_TRAY_NOT_ASSEMBLED)", "load.status == LOADING (ERR_LOAD_NOT_LOADING)", "load.tray_count < sterilizer.chamber_capacity (ERR_LOAD_CAPACITY_EXCEEDED)"]
        side_effects: ["tray.current_load_id = load.id", "load.tray_count += 1"]
      - from: IN_LOAD
        to: STERILE
        trigger: "system (member load transitions COMPLETED -> RELEASED)"
        actor: system
        preconditions: ["load.status transitions to RELEASED"]
        side_effects: ["tray.sterility_expires_at = load.released_at + shelf hours per sterility_expiry_assignment", "tray.cycles_completed += 1", "tray.current_load_id = null", "every Instrument with assigned_tray_id == tray.id gains usage_cycles += 1"]
      - from: IN_LOAD
        to: ASSEMBLED
        trigger: "system (member load transitions RUNNING -> FAILED_CYCLE or LOADING -> ABORTED)"
        actor: system
        preconditions: ["load.status transitions to FAILED_CYCLE or ABORTED"]
        side_effects: ["tray.current_load_id = null"]
      - from: IN_LOAD
        to: DECONTAMINATED
        trigger: "system (member load transitions COMPLETED -> FAILED_BI on BI POSITIVE)"
        actor: system
        preconditions: ["load.status transitions to FAILED_BI"]
        side_effects: ["tray.current_load_id = null"]
      - from: STERILE
        to: IN_USE
        trigger: "system (POST /spd/or-cases/{id}/start on a case holding a RESERVED reservation for this tray)"
        actor: system
        preconditions: ["case transitions to IN_PROGRESS; reservation exists for this tray on that case"]
        side_effects: []
      - from: DECONTAMINATED
        to: IN_USE
        trigger: "system (POST /spd/iuss-exceptions)"
        actor: system
        preconditions: ["tray.status in {DECONTAMINATED, ASSEMBLED} (ERR_IUSS_TRAY_NOT_ELIGIBLE)"]
        side_effects: ["tray linked to the IussException; on the referenced case's completion the tray returns to AWAITING_DECONTAMINATION"]
      - from: ASSEMBLED
        to: IN_USE
        trigger: "system (POST /spd/iuss-exceptions)"
        actor: system
        preconditions: ["tray.status in {DECONTAMINATED, ASSEMBLED} (ERR_IUSS_TRAY_NOT_ELIGIBLE)"]
        side_effects: ["same as DECONTAMINATED -> IN_USE IUSS path"]
      - from: IN_USE
        to: AWAITING_DECONTAMINATION
        trigger: "system (POST /spd/or-cases/{id}/complete on the using case)"
        actor: system
        preconditions: ["case transitions to COMPLETED"]
        side_effects: ["tray.sterility_expires_at = null"]
      - from: STERILE
        to: QUARANTINED
        trigger: "system (member load RELEASED -> RECALLED)"
        actor: system
        preconditions: ["tray.current load recalled; tray currently STERILE"]
        side_effects: ["tray.quarantine_reason = load.recall_reason", "tray.sterility_expires_at = null", "every TrayReservation with tray_id == this tray and status == RESERVED -> CANCELLED", "each cancelled reservation's case, if TRAYS_RESERVED, -> AT_RISK"]
      - from: QUARANTINED
        to: DISCARDED
        trigger: "POST /spd/trays/{id}/discard"
        actor: SpdSupervisor
        preconditions: ["tray.status == QUARANTINED (ERR_TRAY_NOT_QUARANTINED)"]
        side_effects: []
      - from: STERILE
        to: AWAITING_DECONTAMINATION
        trigger: "system (lazy sterility sweep: logical clock >= sterility_expires_at)"
        actor: system
        preconditions: ["tray.status == STERILE and now >= tray.sterility_expires_at"]
        side_effects: ["every TrayReservation with tray_id == this tray and status == RESERVED -> RELEASED", "each released reservation's case recompute: if 0 remaining RESERVED reservations and case.status in {TRAYS_RESERVED, AT_RISK}: -> SCHEDULED", "tray.sterility_expires_at = null"]
      - from: IN_ASSEMBLY
        to: IN_ASSEMBLY
        trigger: "system (instrument send-for-repair cascade removes an assigned instrument)"
        actor: system
        preconditions: ["an assigned instrument's repair order transitions OPEN -> SENT while tray.status in {IN_ASSEMBLY, ASSEMBLED, IN_LOAD}"]
        side_effects: ["if tray was IN_LOAD: tray removed from load (current_load_id = null, load.tray_count -= 1)"]
        note: "ASSEMBLED/IN_LOAD trays are demoted to IN_ASSEMBLY by the cascade; IN_ASSEMBLY stays IN_ASSEMBLY."
      - from: ASSEMBLED
        to: IN_ASSEMBLY
        trigger: "system (instrument send-for-repair cascade)"
        actor: system
        preconditions: ["an assigned instrument's repair order transitions OPEN -> SENT"]
        side_effects: []
      - from: IN_LOAD
        to: IN_ASSEMBLY
        trigger: "system (instrument send-for-repair cascade)"
        actor: system
        preconditions: ["an assigned instrument's repair order transitions OPEN -> SENT"]
        side_effects: ["tray.current_load_id = null", "load.tray_count -= 1"]

  - entity: SterilizationLoad
    initial_state: LOADING
    terminal_states: [FAILED_CYCLE, FAILED_BI, RECALLED, ABORTED]
    transitions:
      - from: LOADING
        to: RUNNING
        trigger: "POST /spd/sterilization-loads/{id}/start"
        actor: SpdTechnician
        preconditions: ["load.status == LOADING (ERR_LOAD_NOT_LOADING)", "load.tray_count >= 1 (ERR_LOAD_EMPTY)", "sterilizer.status == IDLE (ERR_STERILIZER_NOT_IDLE)", "now >= load.planned_start_at (ERR_LOAD_PLANNED_START_NOT_REACHED)", "acting technician (X-User-ID) exists and status == ACTIVE (ERR_TECHNICIAN_SUSPENDED if SUSPENDED, ERR_CERTIFICATION_EXPIRED if CERTIFICATION_EXPIRED)", "sterilizer.method in technician.certified_methods (ERR_CERTIFICATION_METHOD_MISMATCH)", "technician.certification_level >= sterilizer.required_certification_level (ERR_CERTIFICATION_LEVEL_INSUFFICIENT)", "if sterilizer.method == LOW_TEMP_H2O2: technician.competency_score >= 70 (ERR_COMPETENCY_BELOW_THRESHOLD)"]
        side_effects: ["load.started_at = now", "sterilizer.status -> RUNNING"]
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /spd/sterilization-loads/{id}/complete"
        actor: SpdTechnician
        preconditions: ["load.status == RUNNING (ERR_LOAD_NOT_RUNNING)"]
        side_effects: ["load.completed_at = now", "sterilizer.status -> IDLE", "BiologicalIndicator auto-created for this load: status INCUBATING, result PENDING, due_at = completed_at + 3h"]
      - from: RUNNING
        to: FAILED_CYCLE
        trigger: "POST /spd/sterilization-loads/{id}/fail-cycle"
        actor: SpdTechnician
        preconditions: ["load.status == RUNNING (ERR_LOAD_NOT_RUNNING)"]
        side_effects: ["sterilizer.status -> IDLE", "member trays IN_LOAD -> ASSEMBLED (current_load_id cleared)", "-8 competency event attributed to operator_id"]
      - from: LOADING
        to: ABORTED
        trigger: "POST /spd/sterilization-loads/{id}/abort"
        actor: SpdTechnician
        preconditions: ["load.status == LOADING (ERR_LOAD_NOT_LOADING)"]
        side_effects: ["member trays IN_LOAD -> ASSEMBLED (current_load_id cleared)"]
      - from: COMPLETED
        to: RELEASED
        trigger: "POST /spd/sterilization-loads/{id}/release"
        actor: SpdSupervisor
        preconditions: ["load.status == COMPLETED (ERR_LOAD_NOT_RELEASABLE)", "caller X-User-ID != load.operator_id — segregation of duties (ERR_RELEASE_OPERATOR_SEGREGATION)", "at least one BiologicalIndicator exists for the load and every BI of the load has status == RESULT_RECORDED with result == NEGATIVE (ERR_BI_NOT_PASSED)"]
        side_effects: ["load.released_at = now", "member trays IN_LOAD -> STERILE with sterility_expires_at per sterility_expiry_assignment, cycles_completed += 1, assigned instruments usage_cycles += 1", "load.total_chargeback_cents computed per load_reprocessing_chargeback"]
      - from: COMPLETED
        to: FAILED_BI
        trigger: "system (BI record-result POSITIVE while load is COMPLETED)"
        actor: system
        preconditions: ["BI.result == POSITIVE and load.status == COMPLETED"]
        side_effects: ["member trays IN_LOAD -> DECONTAMINATED (current_load_id cleared)"]
      - from: RELEASED
        to: RECALLED
        trigger: "POST /spd/sterilization-loads/{id}/recall (manual, input reason) OR system on BI record-result POSITIVE (reason 'BI_POSITIVE')"
        actor: SpdSupervisor | QualityAuditor | system
        preconditions: ["load.status == RELEASED (ERR_LOAD_NOT_RECALLABLE)"]
        side_effects: ["load.recall_reason set, load.recalled_at = now", "every member tray in STERILE -> QUARANTINED (quarantine_reason = recall_reason, sterility_expires_at = null)", "every TrayReservation with status RESERVED on those trays -> CANCELLED", "each cancelled reservation's case, if TRAYS_RESERVED, -> AT_RISK"]

  - entity: BiologicalIndicator
    initial_state: INCUBATING
    terminal_states: [RESULT_RECORDED]
    transitions:
      - from: INCUBATING
        to: RESULT_RECORDED
        trigger: "POST /spd/biological-indicators/{id}/record-result"
        actor: QualityAuditor
        preconditions: ["bi.status == INCUBATING (ERR_BI_ALREADY_RECORDED)", "now >= bi.due_at (ERR_BI_STILL_INCUBATING)", "input result in {NEGATIVE, POSITIVE} (ERR_INVALID_ENUM_VALUE)"]
        side_effects: ["bi.result set, bi.recorded_at = now", "if result == POSITIVE and load.status == COMPLETED: load -> FAILED_BI (tray cascade)", "if result == POSITIVE and load.status == RELEASED: load -> RECALLED with recall_reason 'BI_POSITIVE' (full recall cascade: trays -> QUARANTINED, reservations -> CANCELLED, cases -> AT_RISK)"]

  - entity: Instrument
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: FLAGGED_FOR_REPAIR
        trigger: "POST /spd/instruments/{id}/flag-for-repair"
        actor: SpdTechnician
        preconditions: ["instrument.status == IN_SERVICE (ERR_INSTRUMENT_NOT_IN_SERVICE)"]
        side_effects: ["RepairOrder created (status OPEN, instrument_id = this instrument)"]
        note: "Assignment linkage (assigned_tray_id) is preserved at flag time; the tray cascade fires at send time."
      - from: FLAGGED_FOR_REPAIR
        to: OUT_FOR_REPAIR
        trigger: "system (POST /spd/repair-orders/{id}/send)"
        actor: system
        preconditions: ["repair order transitions OPEN -> SENT"]
        side_effects: ["if instrument.assigned_tray_id != null: the owning tray, if in {IN_ASSEMBLY, ASSEMBLED, IN_LOAD}, demotes to IN_ASSEMBLY (IN_LOAD trays also leave the load: current_load_id = null, load.tray_count -= 1); instrument.assigned_tray_id = null"]
      - from: OUT_FOR_REPAIR
        to: IN_SERVICE
        trigger: "system (POST /spd/repair-orders/{id}/receive with outcome FIXED)"
        actor: system
        preconditions: ["repair order transitions SENT -> CLOSED_FIXED"]
        side_effects: ["instrument.repair_count += 1"]
      - from: OUT_FOR_REPAIR
        to: RETIRED
        trigger: "system (POST /spd/repair-orders/{id}/receive with outcome CONDEMNED)"
        actor: system
        preconditions: ["repair order transitions SENT -> CLOSED_CONDEMNED"]
        side_effects: []
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /spd/instruments/{id}/retire"
        actor: FacilityAdmin
        preconditions: ["instrument.status in {IN_SERVICE, FLAGGED_FOR_REPAIR} (ERR_INSTRUMENT_NOT_RETIRABLE)", "if FLAGGED_FOR_REPAIR: its OPEN repair order -> CLOSED_CONDEMNED (auto-condemnation)"]
        side_effects: ["instrument.assigned_tray_id = null (tray cascade identical to send-time demotion if assigned)"]
      - from: FLAGGED_FOR_REPAIR
        to: RETIRED
        trigger: "POST /spd/instruments/{id}/retire"
        actor: FacilityAdmin
        preconditions: ["instrument.status in {IN_SERVICE, FLAGGED_FOR_REPAIR} (ERR_INSTRUMENT_NOT_RETIRABLE)"]
        side_effects: ["its OPEN RepairOrder -> CLOSED_CONDEMNED", "assigned_tray_id = null with the same tray demotion cascade"]

  - entity: RepairOrder
    initial_state: OPEN
    terminal_states: [CLOSED_FIXED, CLOSED_CONDEMNED]
    transitions:
      - from: OPEN
        to: SENT
        trigger: "POST /spd/repair-orders/{id}/send"
        actor: FacilityAdmin
        preconditions: ["order.status == OPEN (ERR_REPAIR_ORDER_NOT_OPEN)"]
        side_effects: ["vendor, quoted_cost_cents recorded", "instrument FLAGGED_FOR_REPAIR -> OUT_FOR_REPAIR", "tray demotion cascade per Instrument machine"]
      - from: SENT
        to: CLOSED_FIXED
        trigger: "POST /spd/repair-orders/{id}/receive with outcome FIXED"
        actor: FacilityAdmin
        preconditions: ["order.status == SENT (ERR_REPAIR_ORDER_NOT_SENT)", "recommended_outcome computed per repair_vs_replace_recommendation; if outcome != recommended_outcome then override_justification (>= 20 chars) is required (ERR_OUTCOME_OVERRIDE_JUSTIFICATION_REQUIRED)"]
        side_effects: ["actual_cost_cents recorded", "recommended_outcome, outcome, outcome_overridden set", "instrument OUT_FOR_REPAIR -> IN_SERVICE, repair_count += 1"]
      - from: SENT
        to: CLOSED_CONDEMNED
        trigger: "POST /spd/repair-orders/{id}/receive with outcome CONDEMNED"
        actor: FacilityAdmin
        preconditions: ["order.status == SENT (ERR_REPAIR_ORDER_NOT_SENT)", "override_justification required when outcome != recommended_outcome (ERR_OUTCOME_OVERRIDE_JUSTIFICATION_REQUIRED)"]
        side_effects: ["instrument OUT_FOR_REPAIR -> RETIRED"]

  - entity: ORCase
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: TRAYS_RESERVED
        trigger: "system (first POST /spd/or-cases/{id}/reservations succeeds)"
        actor: system
        preconditions: ["reservation creation succeeded"]
        side_effects: []
      - from: AT_RISK
        to: TRAYS_RESERVED
        trigger: "system (a new reservation is created while AT_RISK)"
        actor: system
        preconditions: ["reservation creation succeeded"]
        side_effects: []
      - from: TRAYS_RESERVED
        to: SCHEDULED
        trigger: "system (reservation release/expiry leaves 0 RESERVED reservations)"
        actor: system
        preconditions: ["after the mutation, count(reservations with status RESERVED) == 0"]
        side_effects: []
      - from: AT_RISK
        to: SCHEDULED
        trigger: "system (reservation release leaves 0 RESERVED reservations)"
        actor: system
        preconditions: ["after the mutation, count(reservations with status RESERVED) == 0"]
        side_effects: []
      - from: TRAYS_RESERVED
        to: AT_RISK
        trigger: "system (recall cascade cancels >= 1 RESERVED reservation of this case)"
        actor: system
        preconditions: ["a reservation of this case transitions RESERVED -> CANCELLED"]
        side_effects: []
      - from: TRAYS_RESERVED
        to: IN_PROGRESS
        trigger: "POST /spd/or-cases/{id}/start"
        actor: OrScheduler
        preconditions: ["case.status in {TRAYS_RESERVED, AT_RISK} (ERR_CASE_NOT_STARTABLE)", "count(RESERVED reservations) >= 1 (ERR_CASE_NOT_STARTABLE)", "every RESERVED reservation's tray is STERILE (post-sweep) with sterility_expires_at > now (ERR_RESERVED_TRAY_EXPIRED)", "every LoanerSet with case_id == case.id has status == READY (ERR_LOANER_NOT_READY)"]
        side_effects: ["RESERVED reservations' trays -> IN_USE", "linked loaner sets READY -> IN_USE"]
      - from: AT_RISK
        to: IN_PROGRESS
        trigger: "POST /spd/or-cases/{id}/start"
        actor: OrScheduler
        preconditions: ["same as TRAYS_RESERVED -> IN_PROGRESS"]
        side_effects: ["same as TRAYS_RESERVED -> IN_PROGRESS"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /spd/or-cases/{id}/start (emergency IUSS path)"
        actor: OrScheduler
        preconditions: ["case.status == SCHEDULED", "count(IussException with case_id == case.id) >= 1 (else ERR_CASE_NOT_STARTABLE)", "every LoanerSet with case_id == case.id has status == READY (ERR_LOANER_NOT_READY)"]
        side_effects: ["linked loaner sets READY -> IN_USE"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /spd/or-cases/{id}/complete"
        actor: OrScheduler
        preconditions: ["case.status == IN_PROGRESS (ERR_CASE_NOT_COMPLETABLE)"]
        side_effects: ["case.completed_at = now", "RESERVED reservations -> USED; their trays IN_USE -> AWAITING_DECONTAMINATION", "trays referenced by this case's IussExceptions with status IN_USE -> AWAITING_DECONTAMINATION", "linked loaner sets IN_USE -> RETURNED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /spd/or-cases/{id}/cancel"
        actor: OrScheduler
        preconditions: ["case.status in {SCHEDULED, TRAYS_RESERVED, AT_RISK} (ERR_CASE_NOT_CANCELLABLE)"]
        side_effects: ["RESERVED reservations -> RELEASED (trays unchanged, remain STERILE)"]
      - from: TRAYS_RESERVED
        to: CANCELLED
        trigger: "POST /spd/or-cases/{id}/cancel"
        actor: OrScheduler
        preconditions: ["case.status in {SCHEDULED, TRAYS_RESERVED, AT_RISK} (ERR_CASE_NOT_CANCELLABLE)"]
        side_effects: ["RESERVED reservations -> RELEASED (trays unchanged, remain STERILE)"]
      - from: AT_RISK
        to: CANCELLED
        trigger: "POST /spd/or-cases/{id}/cancel"
        actor: OrScheduler
        preconditions: ["case.status in {SCHEDULED, TRAYS_RESERVED, AT_RISK} (ERR_CASE_NOT_CANCELLABLE)"]
        side_effects: ["RESERVED reservations -> RELEASED (trays unchanged, remain STERILE)"]

  - entity: TrayReservation
    initial_state: RESERVED
    terminal_states: [USED, RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: USED
        trigger: "system (case completion)"
        actor: system
        preconditions: ["owning case transitions IN_PROGRESS -> COMPLETED"]
        side_effects: []
      - from: RESERVED
        to: RELEASED
        trigger: "POST /spd/tray-reservations/{id}/release, or system (case cancel, tray sterility sweep)"
        actor: OrScheduler | system
        preconditions: ["reservation.status == RESERVED (ERR_RESERVATION_NOT_ACTIVE)"]
        side_effects: ["tray status unchanged on manual release / case cancel (stays STERILE); on expiry sweep the tray -> AWAITING_DECONTAMINATION", "owning case recompute: -> SCHEDULED when 0 RESERVED remain and case.status in {TRAYS_RESERVED, AT_RISK}"]
      - from: RESERVED
        to: CANCELLED
        trigger: "system (recall cascade on the reserved tray)"
        actor: system
        preconditions: ["tray transitions STERILE -> QUARANTINED while this reservation is RESERVED"]
        side_effects: ["owning case, if TRAYS_RESERVED, -> AT_RISK"]

  - entity: LoanerSet
    initial_state: BOOKED
    terminal_states: [RETURNED]
    transitions:
      - from: BOOKED
        to: RECEIVED
        trigger: "POST /spd/loaner-sets/{id}/receive when now <= due_by"
        actor: SpdTechnician
        preconditions: ["loaner.status == BOOKED (ERR_LOANER_NOT_BOOKED)", "now <= due_by (equality is on time)"]
        side_effects: ["received_at = now, received_late = false"]
      - from: BOOKED
        to: LATE_RECEIVED
        trigger: "POST /spd/loaner-sets/{id}/receive when now > due_by"
        actor: SpdTechnician
        preconditions: ["loaner.status == BOOKED (ERR_LOANER_NOT_BOOKED)", "now > due_by"]
        side_effects: ["received_at = now, received_late = true"]
      - from: RECEIVED
        to: READY
        trigger: "POST /spd/loaner-sets/{id}/mark-ready"
        actor: SpdTechnician
        preconditions: ["loaner.status in {RECEIVED, LATE_RECEIVED} (ERR_LOANER_NOT_RECEIVED)"]
        side_effects: []
      - from: LATE_RECEIVED
        to: READY
        trigger: "POST /spd/loaner-sets/{id}/mark-ready"
        actor: SpdTechnician
        preconditions: ["loaner.status in {RECEIVED, LATE_RECEIVED} (ERR_LOANER_NOT_RECEIVED)"]
        side_effects: ["received_late remains true (audit trail)"]
      - from: READY
        to: IN_USE
        trigger: "system (owning case start)"
        actor: system
        preconditions: ["case transitions to IN_PROGRESS"]
        side_effects: []
      - from: IN_USE
        to: RETURNED
        trigger: "system (owning case completion)"
        actor: system
        preconditions: ["case transitions IN_PROGRESS -> COMPLETED"]
        side_effects: []

  - entity: IussException
    initial_state: DOCUMENTED
    terminal_states: [REVIEWED]
    transitions:
      - from: DOCUMENTED
        to: REVIEWED
        trigger: "POST /spd/iuss-exceptions/{id}/review"
        actor: QualityAuditor
        preconditions: ["iuss.status == DOCUMENTED (ERR_IUSS_ALREADY_REVIEWED)"]
        side_effects: ["review_note recorded if provided"]

  - entity: Technician
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /spd/technicians/{id}/suspend"
        actor: SpdSupervisor
        preconditions: ["technician.status == ACTIVE (ERR_TECHNICIAN_NOT_ACTIVE)"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /spd/technicians/{id}/reinstate"
        actor: SpdSupervisor
        preconditions: ["technician.status == SUSPENDED (ERR_TECHNICIAN_NOT_SUSPENDED)"]
        side_effects: []
      - from: ACTIVE
        to: CERTIFICATION_EXPIRED
        trigger: "system (lazy sweep: logical clock > certification_expires_at)"
        actor: system
        preconditions: ["now > technician.certification_expires_at"]
        side_effects: []
      - from: CERTIFICATION_EXPIRED
        to: ACTIVE
        trigger: "PUT /spd/technicians/{id} with certification_expires_at > now"
        actor: FacilityAdmin
        preconditions: ["new certification_expires_at > now"]
        side_effects: []

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-case
    parent_entity: ORCase
    write_endpoint: "POST /spd/or-cases/{id}/reservations"
    occ_field: expected_or_case_version
    description: |
      Creating a TrayReservation against an ORCase whose version has advanced
      since the caller last observed it is rejected. Each successful
      reservation creation mutates the case (status recompute) and increments
      ORCase.version by 1, so a second create carrying a previously observed
      version is deterministically rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: template-update-stale-template
    parent_entity: TrayTemplate
    write_endpoint: "PUT /spd/tray-templates/{id}"
    occ_field: expected_template_version
    description: |
      Updating a TrayTemplate whose version has advanced since the caller
      last observed it is rejected. A successful PUT increments
      TrayTemplate.version by 1, so a subsequent PUT carrying the older
      version is deterministically rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: tray_availability_projection
    trigger: "GET /spd/tray-templates/{id}/availability"
    algorithm: forward_looking
    description: "Two sanctioned availability variants for one template over one future window, returned side by side."
    formula: |
      Let W = input window_start_at.
      confirmed_available_count = count of Tray t where
        t.template_id == {id} AND t.status == STERILE AND t.sterility_expires_at > W.
      projected_release_at(L) for a SterilizationLoad L on Sterilizer S:
        L.status == LOADING   -> L.planned_start_at + S.cycle_minutes minutes + BI_INCUBATION_HOURS hours
        L.status == RUNNING   -> L.started_at        + S.cycle_minutes minutes + BI_INCUBATION_HOURS hours
        L.status == COMPLETED -> L.completed_at      + BI_INCUBATION_HOURS hours
      pipeline_available_count = confirmed_available_count + count of Tray t where
        t.template_id == {id} AND t.status == IN_LOAD
        AND load(t.current_load_id).status in {LOADING, RUNNING, COMPLETED}
        AND projected_release_at(load(t.current_load_id)) <= W   (inclusive boundary).
      Trays in any other status (including QUARANTINED and IN_USE) count in neither variant; existing TrayReservation bookings do not reduce either count (bookings are temporal, not status-based).
    input_set: "Trays of the template in the statuses listed above; loads referenced by current_load_id"
    constants:
      BI_INCUBATION_HOURS: 3
    precision: "integer counts; projected_release_at boundary is inclusive (<=)"
    variants:
      - name: confirmed_only
        when: "conservative planning — only physically sterile stock"
        difference: "equals confirmed_available_count; excludes every in-pipeline tray"
      - name: pipeline_inclusive
        when: "optimistic planning — includes in-pipeline trays projected sterile by W"
        difference: "adds IN_LOAD trays whose projected_release_at <= W; identical inputs yield a strictly larger count whenever such trays exist"

  - name: sterility_expiry_assignment
    trigger: "SterilizationLoad COMPLETED -> RELEASED"
    algorithm: threshold
    description: "Shelf-life tier assignment by packaging type."
    formula: |
      for each member tray transitioning IN_LOAD -> STERILE:
        tray.sterility_expires_at = load.released_at + SHELF_HOURS[template(tray.template_id).packaging_type]
    input_set: "member trays of the released load (status IN_LOAD at release time)"
    constants:
      SHELF_HOURS_WRAPPED: 720
      SHELF_HOURS_RIGID_CONTAINER: 2160
    precision: "exact datetime arithmetic; expiry comparison is strict (expires_at must be > case.scheduled_start_at)"

  - name: repair_vs_replace_recommendation
    trigger: "POST /spd/repair-orders/{id}/receive (computed from that call's actual_cost_cents and the instrument's current fields)"
    algorithm: decision_ladder
    description: "Repair-vs-replace recommendation; applied outcome may differ only with override_justification."
    formula: |
      remaining_cycles = instrument.max_cycles - instrument.usage_cycles
      1. if instrument.usage_cycles >= instrument.max_cycles        -> CONDEMNED
      2. elif instrument.repair_count >= MAX_REPAIRS                -> CONDEMNED
      3. else:
           base_ratio     = actual_cost_cents / replacement_cost_cents
           adjusted_ratio = base_ratio * (1 + REPAIR_COUNT_FACTOR * instrument.repair_count)
           if instrument.criticality == CRITICAL and remaining_cycles <= CRITICAL_REMAINING_CYCLES:
             adjusted_ratio = adjusted_ratio * CRITICAL_FACTOR
           if adjusted_ratio >= REPLACE_RATIO_LIMIT -> CONDEMNED else FIXED
      Boundary: adjusted_ratio exactly == 0.6 yields CONDEMNED (>=).
    input_set: "the RepairOrder's instrument; actual_cost_cents from the receive call"
    constants:
      MAX_REPAIRS: 3
      REPAIR_COUNT_FACTOR: 0.25
      CRITICAL_REMAINING_CYCLES: 10
      CRITICAL_FACTOR: 1.5
      REPLACE_RATIO_LIMIT: 0.6
    precision: "exact decimal arithmetic; no rounding before the >= comparison"

  - name: load_reprocessing_chargeback
    trigger: "SterilizationLoad COMPLETED -> RELEASED"
    algorithm: aggregation
    description: "Department chargeback for a released load; rounding order is pinned."
    formula: |
      for each member tray (IN_LOAD -> STERILE at release):
        raw_cents  = BASE_FEE_CENTS * METHOD_MULTIPLIER[sterilizer(load.sterilizer_id).method]
        tray_fee   = round_half_up(raw_cents) to integer cents      # ROUND PER TRAY LINE FIRST
      load.total_chargeback_cents = sum of tray_fee over all member trays
      PINNED ORDER: round each per-tray fee, THEN sum. The alternative
      (sum raw_cents, then round once) is the forbidden variant and yields
      different cents, e.g. 3 PREVAC trays: pinned 3 * round(1237.5) = 3714
      vs forbidden round(3712.5) = 3713.
    input_set: "member trays of the released load"
    constants:
      BASE_FEE_CENTS: 1000
      METHOD_MULTIPLIER_STEAM_GRAVITY: 1.0
      METHOD_MULTIPLIER_STEAM_PREVAC: 1.2375
      METHOD_MULTIPLIER_LOW_TEMP_H2O2: 1.7625
    precision: "per-tray round_half_up to integer cents, then integer sum"

  - name: iuss_rolling_window_rate
    trigger: "GET /spd/compliance/summary; the gating count also runs inside POST /spd/iuss-exceptions"
    algorithm: threshold
    description: "Rolling-window IUSS monitoring with two denominator variants."
    formula: |
      iuss_count_7d        = count of IussException with logged_at in (now - 168h, now]   # window start exclusive, now inclusive
      completed_cases_30d  = count of ORCase with status == COMPLETED and completed_at in (now - 720h, now]
      scheduled_cases_30d  = count of ORCase with scheduled_start_at in (now - 720h, now], any status
      iuss_rate_per_completed = iuss_count_7d / max(completed_cases_30d, 1)
      iuss_rate_per_scheduled = iuss_count_7d / max(scheduled_cases_30d, 1)
      Gate (POST /spd/iuss-exceptions): prospective_count = iuss_count_7d + 1;
      if prospective_count >= SUPERVISOR_THRESHOLD (4) the caller's role must be
      SpdSupervisor, else ERR_IUSS_RATE_EXCEEDED. A technician may therefore log
      the 1st, 2nd and 3rd events in the window; the 4th is supervisor-only.
    input_set: "IussException and ORCase rows in the trailing windows"
    constants:
      IUSS_WINDOW_HOURS: 168
      CASE_WINDOW_HOURS: 720
      SUPERVISOR_THRESHOLD: 4
    precision: "rates to 4 decimal places, round_half_up; counts are integers"
    variants:
      - name: per_completed_case
        when: "rate against cases actually completed in the trailing 30 days"
        difference: "denominator completed_cases_30d"
      - name: per_scheduled_case
        when: "rate against all cases scheduled in the trailing 30 days regardless of outcome"
        difference: "denominator scheduled_cases_30d (>= completed_cases_30d), so identical numerators yield a smaller-or-equal rate"

  - name: technician_competency_score
    trigger: "read of Technician; gating inside POST /spd/sterilization-loads/{id}/start for LOW_TEMP_H2O2"
    algorithm: weighted_scoring
    description: "Competency score from demerit events with age-based decay; two window variants."
    formula: |
      Demerit events attributed to technician X:
        - AssemblyVerification with technician_id == X and result == FAIL: FAIL_VERIFY_PTS each (event time = created_at)
        - SterilizationLoad with operator_id == X that reached FAILED_CYCLE: CYCLE_FAIL_PTS each (event time = the transition's logical timestamp)
      rolling_90d variant (competency_score):
        include only events with age <= 90 days
        weight = 1.0 if age <= 30d; 0.5 if 30d < age <= 60d; 0.25 if 60d < age <= 90d
      lifetime variant (competency_score_lifetime):
        include all events regardless of age; weight = 1.0 always
      score = max(0, 100 - sum(weight * points))
      Gate: starting a load on a LOW_TEMP_H2O2 sterilizer requires competency_score >= 70 (boundary: exactly 70 passes).
    input_set: "AssemblyVerification FAIL records and FAILED_CYCLE loads attributed to the technician"
    constants:
      FAIL_VERIFY_PTS: 2
      CYCLE_FAIL_PTS: 8
      H2O2_COMPETENCY_GATE: 70
      DECAY_TIER1_DAYS: 30
      DECAY_TIER2_DAYS: 60
      WINDOW_DAYS: 90
    precision: "score in exact decimal (multiples of 0.5 possible); floor 0"
    variants:
      - name: rolling_90d
        when: "default gating score"
        difference: "excludes events older than 90 days and decays 30-90 day events"
      - name: lifetime
        when: "audit view"
        difference: "counts every event at full weight; identical event history yields a lower-or-equal score than rolling_90d"

  - name: loaner_intake_deadline
    trigger: "POST /spd/loaner-sets (due_by computed); POST /spd/loaner-sets/{id}/receive (lateness verdict)"
    algorithm: threshold
    description: "Tiered intake lead time before the linked case."
    formula: |
      lead_hours = STANDARD_LEAD_HOURS if tray_count < BULK_THRESHOLD else BULK_LEAD_HOURS
      due_by = case(case_id).scheduled_start_at - lead_hours
      at receive: received_late = (now > due_by)   # strictly greater; now == due_by is ON TIME
    input_set: "the loaner set and its linked case"
    constants:
      STANDARD_LEAD_HOURS: 24
      BULK_LEAD_HOURS: 48
      BULK_THRESHOLD: 10
    precision: "exact datetime arithmetic"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles ('Any' admits every declared role)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Request shape: required fields present, types valid, enum values in their declared sets, justification strings >= 20 chars; body FK references (tray_id, case_id, instrument_id, sterilizer_id, template_id) resolve to existing rows"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_ENUM_VALUE | ERR_JUSTIFICATION_TOO_SHORT"
    http_status: 400
    applies_to: "all mutation endpoints with a body"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version (checked BEFORE any business rule)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /spd/tray-templates/{id}; POST /spd/or-cases/{id}/reservations"
  - priority: 6
    category: state
    check: "State preconditions of the target entity's state machine, in declared order: own-status gate first (ERR_TRAY_NOT_* / ERR_LOAD_NOT_* / ERR_CASE_NOT_* / ERR_RESERVATION_NOT_ACTIVE / ERR_BI_ALREADY_RECORDED / ERR_INSTRUMENT_NOT_* / ERR_REPAIR_ORDER_NOT_* / ERR_LOANER_NOT_* / ERR_IUSS_ALREADY_REVIEWED / ERR_TECHNICIAN_NOT_*), then linked-entity state gates (case start: ERR_LOANER_NOT_READY; reservation create: ERR_TRAY_NOT_STERILE; load start: ERR_STERILIZER_NOT_IDLE)"
    error_id: "(per-gate domain error ids)"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Patient-safety gates: release segregation (ERR_RELEASE_OPERATOR_SEGREGATION), release requires recorded NEGATIVE BI (ERR_BI_NOT_PASSED), reservation requires sterility_expires_at > scheduled_start_at strictly (ERR_STERILITY_EXPIRED_FOR_CASE), case start requires every reserved tray unexpired (ERR_RESERVED_TRAY_EXPIRED). Intra-priority order: segregation before BI; on reservations the expiry gate precedes every temporal gate."
    error_id: "ERR_RELEASE_OPERATOR_SEGREGATION | ERR_BI_NOT_PASSED | ERR_STERILITY_EXPIRED_FOR_CASE | ERR_RESERVED_TRAY_EXPIRED"
    http_status: 409
    applies_to: "load release; reservation create; case start"
  - priority: 8
    category: business_temporal
    check: "Temporal gates: BI incubation complete (ERR_BI_STILL_INCUBATING); sterilizer planned-window overlap, half-open [start, start+cycle_minutes), adjacency allowed (ERR_STERILIZER_WINDOW_CONFLICT); load start not before planned_start_at (ERR_LOAD_PLANNED_START_NOT_REACHED); tray reservation buffered overlap with TURNOVER_BUFFER_MINUTES=45 on both sides, gap exactly 45 min allowed (ERR_TRAY_RESERVATION_TIME_CONFLICT)"
    error_id: "ERR_BI_STILL_INCUBATING | ERR_STERILIZER_WINDOW_CONFLICT | ERR_LOAD_PLANNED_START_NOT_REACHED | ERR_TRAY_RESERVATION_TIME_CONFLICT"
    http_status: 409
    applies_to: "BI record-result; load create/start; reservation create"
  - priority: 9
    category: business_constraint
    check: "Constraint gates, in order: technician standing (ERR_TECHNICIAN_SUSPENDED, ERR_CERTIFICATION_EXPIRED), method certification (ERR_CERTIFICATION_METHOD_MISMATCH), certification level (ERR_CERTIFICATION_LEVEL_INSUFFICIENT), H2O2 competency gate (ERR_COMPETENCY_BELOW_THRESHOLD); load empty (ERR_LOAD_EMPTY), chamber capacity (ERR_LOAD_CAPACITY_EXCEEDED); instrument assignment rules (ERR_INSTRUMENT_ALREADY_ASSIGNED, ERR_INSTRUMENT_CYCLE_LIMIT); uniqueness (ERR_DUPLICATE_SERIAL_NUMBER, ERR_DUPLICATE_TEMPLATE_CODE); IUSS eligibility and rolling-window rate (ERR_IUSS_TRAY_NOT_ELIGIBLE as state at p6, ERR_IUSS_RATE_EXCEEDED here); repair override justification (ERR_OUTCOME_OVERRIDE_JUSTIFICATION_REQUIRED)"
    error_id: "(per-gate domain error ids)"
    http_status: 409
    applies_to: "load start; add-tray; instrument assign; instrument/template create; IUSS create; repair receive"
    note: "ERR_TECHNICIAN_SUSPENDED and ERR_CERTIFICATION_EXPIRED are 403; ERR_COMPETENCY_BELOW_THRESHOLD, ERR_CERTIFICATION_METHOD_MISMATCH, ERR_CERTIFICATION_LEVEL_INSUFFICIENT are 403; ERR_IUSS_RATE_EXCEEDED is 403; all others in this row are 409 except ERR_OUTCOME_OVERRIDE_JUSTIFICATION_REQUIRED (400) and the duplicate errors (409)."

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Tray templates ---
  - { method: POST, path: "/spd/tray-templates", description: "Create a tray template (count sheet spec)", roles: [FacilityAdmin], code: 201, input: [code, name, specialty, packaging_type, instrument_requirements, assembly_minutes], output: TrayTemplate, side_effects: ["version initialized to 1"] }
  - { method: GET, path: "/spd/tray-templates", description: "List tray templates", roles: [Any], code: 200, input: ["specialty?", "limit?", "offset?"], output: "TrayTemplate[]", side_effects: [] }
  - { method: GET, path: "/spd/tray-templates/{id}", description: "Get one tray template", roles: [Any], code: 200, input: [], output: TrayTemplate, side_effects: [] }
  - { method: PUT, path: "/spd/tray-templates/{id}", description: "Update a tray template (OCC-guarded)", roles: [FacilityAdmin], code: 200, input: ["name?", "specialty?", "packaging_type?", "instrument_requirements?", "assembly_minutes?", expected_template_version], output: TrayTemplate, side_effects: ["increments TrayTemplate.version by 1"] }
  - { method: GET, path: "/spd/tray-templates/{id}/availability", description: "Computed availability projection (both variants) for a window", roles: [Any], code: 200, input: [window_start_at], output: { template_id: string, window_start_at: datetime, confirmed_available_count: integer, pipeline_available_count: integer }, side_effects: ["runs tray_availability_projection"] }

  # --- Trays ---
  - { method: POST, path: "/spd/trays", description: "Register a physical tray (starts AWAITING_DECONTAMINATION)", roles: [SpdTechnician], code: 201, input: [template_id, label], output: Tray, side_effects: ["status = AWAITING_DECONTAMINATION"] }
  - { method: GET, path: "/spd/trays", description: "List/filter trays", roles: [Any], code: 200, input: ["template_id?", "current_load_id?", "status?", "limit?", "offset?"], output: "Tray[]", side_effects: ["lazy sterility sweep applied to returned rows"] }
  - { method: GET, path: "/spd/trays/{id}", description: "Get one tray", roles: [Any], code: 200, input: [], output: Tray, side_effects: ["lazy sterility sweep applied before responding"] }
  - { method: POST, path: "/spd/trays/{id}/decontamination/start", description: "Begin decontamination (also the QUARANTINED reprocessing entry)", roles: [SpdTechnician], code: 200, input: [], output: Tray, side_effects: ["AWAITING_DECONTAMINATION|QUARANTINED -> IN_DECONTAMINATION"] }
  - { method: POST, path: "/spd/trays/{id}/decontamination/complete", description: "Finish decontamination", roles: [SpdTechnician], code: 200, input: [], output: Tray, side_effects: ["IN_DECONTAMINATION -> DECONTAMINATED"] }
  - { method: POST, path: "/spd/trays/{id}/assembly/start", description: "Begin assembly", roles: [SpdTechnician], code: 200, input: [], output: Tray, side_effects: ["DECONTAMINATED -> IN_ASSEMBLY"] }
  - { method: POST, path: "/spd/trays/{id}/assembly-verifications", description: "Submit the assembly count sheet; PASS moves tray to ASSEMBLED, FAIL keeps IN_ASSEMBLY and records a competency demerit", roles: [SpdTechnician], code: 201, input: [lines], output: AssemblyVerification, side_effects: ["result and mismatch_count computed against template.instrument_requirements", "PASS: tray -> ASSEMBLED", "FAIL: -2 competency event for acting technician"] }
  - { method: GET, path: "/spd/assembly-verifications", description: "List/filter assembly verifications", roles: [Any], code: 200, input: ["tray_id?", "technician_id?", "result?", "limit?", "offset?"], output: "AssemblyVerification[]", side_effects: [] }
  - { method: GET, path: "/spd/assembly-verifications/{id}", description: "Get one assembly verification", roles: [Any], code: 200, input: [], output: AssemblyVerification, side_effects: [] }
  - { method: POST, path: "/spd/trays/{id}/discard", description: "Discard a quarantined tray", roles: [SpdSupervisor], code: 200, input: [], output: Tray, side_effects: ["QUARANTINED -> DISCARDED"] }

  # --- Instruments & repair ---
  - { method: POST, path: "/spd/instruments", description: "Register an instrument", roles: [FacilityAdmin], code: 201, input: [instrument_type, serial_number, max_cycles, replacement_cost_cents, criticality, "usage_cycles?"], output: Instrument, side_effects: ["status = IN_SERVICE, repair_count = 0"] }
  - { method: GET, path: "/spd/instruments", description: "List/filter instruments", roles: [Any], code: 200, input: ["status?", "assigned_tray_id?", "instrument_type?", "limit?", "offset?"], output: "Instrument[]", side_effects: [] }
  - { method: GET, path: "/spd/instruments/{id}", description: "Get one instrument", roles: [Any], code: 200, input: [], output: Instrument, side_effects: [] }
  - { method: POST, path: "/spd/instruments/{id}/assign", description: "Assign an instrument to a tray under assembly", roles: [SpdTechnician], code: 200, input: [tray_id], output: Instrument, side_effects: ["assigned_tray_id = tray_id (requires instrument IN_SERVICE, unassigned, usage_cycles < max_cycles, tray IN_ASSEMBLY)"] }
  - { method: POST, path: "/spd/instruments/{id}/flag-for-repair", description: "Flag an instrument for repair; opens a RepairOrder", roles: [SpdTechnician], code: 201, input: [], output: RepairOrder, side_effects: ["instrument IN_SERVICE -> FLAGGED_FOR_REPAIR", "RepairOrder created (OPEN)"] }
  - { method: POST, path: "/spd/instruments/{id}/retire", description: "Retire an instrument directly", roles: [FacilityAdmin], code: 200, input: [], output: Instrument, side_effects: ["IN_SERVICE|FLAGGED_FOR_REPAIR -> RETIRED", "open repair order auto-condemned", "tray demotion cascade if assigned"] }
  - { method: GET, path: "/spd/repair-orders", description: "List/filter repair orders", roles: [Any], code: 200, input: ["instrument_id?", "status?", "limit?", "offset?"], output: "RepairOrder[]", side_effects: [] }
  - { method: GET, path: "/spd/repair-orders/{id}", description: "Get one repair order", roles: [Any], code: 200, input: [], output: RepairOrder, side_effects: [] }
  - { method: POST, path: "/spd/repair-orders/{id}/send", description: "Send the instrument to the vendor", roles: [FacilityAdmin], code: 200, input: [vendor, quoted_cost_cents], output: RepairOrder, side_effects: ["OPEN -> SENT", "instrument -> OUT_FOR_REPAIR and unassigned", "tray demotion cascade"] }
  - { method: POST, path: "/spd/repair-orders/{id}/receive", description: "Receive the instrument back with a disposition", roles: [FacilityAdmin], code: 200, input: [actual_cost_cents, outcome, "override_justification?"], output: RepairOrder, side_effects: ["recommended_outcome computed per repair_vs_replace_recommendation", "SENT -> CLOSED_FIXED (instrument IN_SERVICE, repair_count+1) or CLOSED_CONDEMNED (instrument RETIRED)", "outcome_overridden recorded"] }

  # --- Sterilizers ---
  - { method: POST, path: "/spd/sterilizers", description: "Register a sterilizer", roles: [FacilityAdmin], code: 201, input: [name, method, chamber_capacity, cycle_minutes, required_certification_level], output: Sterilizer, side_effects: ["status = IDLE"] }
  - { method: GET, path: "/spd/sterilizers", description: "List/filter sterilizers", roles: [Any], code: 200, input: ["status?", "method?", "limit?", "offset?"], output: "Sterilizer[]", side_effects: [] }
  - { method: GET, path: "/spd/sterilizers/{id}", description: "Get one sterilizer", roles: [Any], code: 200, input: [], output: Sterilizer, side_effects: [] }

  # --- Sterilization loads ---
  - { method: POST, path: "/spd/sterilization-loads", description: "Schedule a load on a sterilizer (planned window overlap check)", roles: [SpdTechnician], code: 201, input: [sterilizer_id, planned_start_at], output: SterilizationLoad, side_effects: ["status = LOADING", "operator_id = X-User-ID"] }
  - { method: GET, path: "/spd/sterilization-loads", description: "List/filter loads", roles: [Any], code: 200, input: ["sterilizer_id?", "operator_id?", "status?", "limit?", "offset?"], output: "SterilizationLoad[]", side_effects: [] }
  - { method: GET, path: "/spd/sterilization-loads/{id}", description: "Get one load", roles: [Any], code: 200, input: [], output: SterilizationLoad, side_effects: [] }
  - { method: POST, path: "/spd/sterilization-loads/{id}/trays", description: "Add an ASSEMBLED tray to a LOADING load (capacity check)", roles: [SpdTechnician], code: 200, input: [tray_id], output: SterilizationLoad, side_effects: ["tray ASSEMBLED -> IN_LOAD", "tray.current_load_id = load id", "load.tray_count += 1"] }
  - { method: POST, path: "/spd/sterilization-loads/{id}/start", description: "Start the cycle (technician certification, sterilizer idle, planned-start gates)", roles: [SpdTechnician], code: 200, input: [], output: SterilizationLoad, side_effects: ["LOADING -> RUNNING", "started_at = now", "sterilizer -> RUNNING"] }
  - { method: POST, path: "/spd/sterilization-loads/{id}/complete", description: "Complete the cycle; auto-creates the biological indicator", roles: [SpdTechnician], code: 200, input: [], output: SterilizationLoad, side_effects: ["RUNNING -> COMPLETED", "completed_at = now", "sterilizer -> IDLE", "BiologicalIndicator created (INCUBATING, PENDING, due_at = completed_at + 3h)"] }
  - { method: POST, path: "/spd/sterilization-loads/{id}/fail-cycle", description: "Record a cycle parameter failure", roles: [SpdTechnician], code: 200, input: [], output: SterilizationLoad, side_effects: ["RUNNING -> FAILED_CYCLE", "sterilizer -> IDLE", "member trays -> ASSEMBLED", "-8 competency event for operator"] }
  - { method: POST, path: "/spd/sterilization-loads/{id}/abort", description: "Abort a load still loading", roles: [SpdTechnician], code: 200, input: [], output: SterilizationLoad, side_effects: ["LOADING -> ABORTED", "member trays -> ASSEMBLED"] }
  - { method: POST, path: "/spd/sterilization-loads/{id}/release", description: "Release a completed load after a negative BI (segregation of duties: releaser != operator)", roles: [SpdSupervisor], code: 200, input: [], output: SterilizationLoad, side_effects: ["COMPLETED -> RELEASED", "released_at = now", "member trays -> STERILE with sterility_expires_at and cycles_completed += 1", "assigned instruments usage_cycles += 1", "total_chargeback_cents computed"] }
  - { method: POST, path: "/spd/sterilization-loads/{id}/recall", description: "Manually recall a released load", roles: [SpdSupervisor, QualityAuditor], code: 200, input: [reason], output: SterilizationLoad, side_effects: ["RELEASED -> RECALLED", "recall cascade: member trays STERILE|RESERVED -> QUARANTINED, affected reservations -> CANCELLED, affected cases TRAYS_RESERVED -> AT_RISK"] }

  # --- Biological indicators ---
  - { method: POST, path: "/spd/sterilization-loads/{id}/biological-indicators", description: "Add an extra (follow-up / spore-strip) biological indicator to a load; allowed while the load is COMPLETED or RELEASED. The auto-created cycle BI exists from completion; this endpoint adds another.", roles: [QualityAuditor], code: 201, input: ["lot_number?"], output: BiologicalIndicator, side_effects: ["BI created INCUBATING, result PENDING, due_at = now + 3h", "requires load COMPLETED or RELEASED (ERR_BI_LOAD_STATE_INVALID)"] }
  - { method: GET, path: "/spd/biological-indicators", description: "List/filter BIs", roles: [Any], code: 200, input: ["load_id?", "result?", "limit?", "offset?"], output: "BiologicalIndicator[]", side_effects: [] }
  - { method: GET, path: "/spd/biological-indicators/{id}", description: "Get one BI", roles: [Any], code: 200, input: [], output: BiologicalIndicator, side_effects: [] }
  - { method: POST, path: "/spd/biological-indicators/{id}/record-result", description: "Record the incubated BI result", roles: [QualityAuditor], code: 200, input: [result], output: BiologicalIndicator, side_effects: ["INCUBATING -> RESULT_RECORDED", "POSITIVE on COMPLETED load -> FAILED_BI + tray cascade", "POSITIVE on RELEASED load -> RECALLED + full recall cascade"] }

  # --- OR cases & reservations ---
  - { method: POST, path: "/spd/or-cases", description: "Schedule an OR case", roles: [OrScheduler], code: 201, input: [case_number, surgeon, scheduled_start_at, scheduled_end_at, priority], output: ORCase, side_effects: ["status = SCHEDULED", "version = 1"] }
  - { method: GET, path: "/spd/or-cases", description: "List/filter cases", roles: [Any], code: 200, input: ["status?", "priority?", "limit?", "offset?"], output: "ORCase[]", side_effects: [] }
  - { method: GET, path: "/spd/or-cases/{id}", description: "Get one case", roles: [Any], code: 200, input: [], output: ORCase, side_effects: [] }
  - { method: POST, path: "/spd/or-cases/{id}/reservations", description: "Reserve a sterile tray for a case (OCC on the case); the tray stays STERILE — the booking is temporal", roles: [OrScheduler], code: 201, input: [tray_id, expected_or_case_version], output: TrayReservation, side_effects: ["reservation created RESERVED", "case -> TRAYS_RESERVED (from SCHEDULED or AT_RISK)", "increments ORCase.version by 1"] }
  - { method: GET, path: "/spd/tray-reservations", description: "List/filter reservations", roles: [Any], code: 200, input: ["case_id?", "tray_id?", "status?", "limit?", "offset?"], output: "TrayReservation[]", side_effects: [] }
  - { method: GET, path: "/spd/tray-reservations/{id}", description: "Get one reservation", roles: [Any], code: 200, input: [], output: TrayReservation, side_effects: [] }
  - { method: POST, path: "/spd/tray-reservations/{id}/release", description: "Release an active reservation (compensating action of reserve; tray stays STERILE)", roles: [OrScheduler], code: 200, input: [], output: TrayReservation, side_effects: ["RESERVED -> RELEASED", "case -> SCHEDULED if 0 RESERVED remain"] }
  - { method: POST, path: "/spd/or-cases/{id}/start", description: "Start the case (reservation or IUSS path, loaner gate, expiry gate)", roles: [OrScheduler], code: 200, input: [], output: ORCase, side_effects: ["-> IN_PROGRESS", "reserved trays -> IN_USE", "READY loaner sets -> IN_USE"] }
  - { method: POST, path: "/spd/or-cases/{id}/complete", description: "Complete the case; instruments/trays cycle back to decontamination", roles: [OrScheduler], code: 200, input: [], output: ORCase, side_effects: ["IN_PROGRESS -> COMPLETED", "completed_at = now", "reservations -> USED", "IN_USE trays -> AWAITING_DECONTAMINATION", "IN_USE loaner sets -> RETURNED"] }
  - { method: POST, path: "/spd/or-cases/{id}/cancel", description: "Cancel a non-terminal case", roles: [OrScheduler], code: 200, input: [], output: ORCase, side_effects: ["-> CANCELLED", "RESERVED reservations -> RELEASED (trays unchanged, remain STERILE)"] }

  # --- IUSS exceptions ---
  - { method: POST, path: "/spd/iuss-exceptions", description: "Log an immediate-use steam sterilization exception (rolling-window supervisor gate)", roles: [SpdTechnician, SpdSupervisor], code: 201, input: [tray_id, case_id, justification], output: IussException, side_effects: ["tray DECONTAMINATED|ASSEMBLED -> IN_USE", "logged_by_id = X-User-ID, logged_at = now", "status = DOCUMENTED"] }
  - { method: GET, path: "/spd/iuss-exceptions", description: "List/filter IUSS exceptions", roles: [Any], code: 200, input: ["tray_id?", "case_id?", "logged_by_id?", "limit?", "offset?"], output: "IussException[]", side_effects: [] }
  - { method: GET, path: "/spd/iuss-exceptions/{id}", description: "Get one IUSS exception", roles: [Any], code: 200, input: [], output: IussException, side_effects: [] }
  - { method: POST, path: "/spd/iuss-exceptions/{id}/review", description: "Auditor review of an IUSS exception", roles: [QualityAuditor], code: 200, input: ["review_note?"], output: IussException, side_effects: ["DOCUMENTED -> REVIEWED"] }

  # --- Technicians ---
  - { method: POST, path: "/spd/technicians", description: "Register a technician with certifications", roles: [FacilityAdmin], code: 201, input: [name, certification_level, certified_methods, certification_expires_at], output: Technician, side_effects: ["status = ACTIVE", "competency scores = 100"] }
  - { method: GET, path: "/spd/technicians", description: "List/filter technicians", roles: [Any], code: 200, input: ["status?", "limit?", "offset?"], output: "Technician[]", side_effects: ["lazy certification-expiry sweep applied to returned rows"] }
  - { method: GET, path: "/spd/technicians/{id}", description: "Get one technician", roles: [Any], code: 200, input: [], output: Technician, side_effects: ["lazy certification-expiry sweep applied before responding"] }
  - { method: PUT, path: "/spd/technicians/{id}", description: "Update certifications / renew (reactivates CERTIFICATION_EXPIRED when new expiry > now)", roles: [FacilityAdmin], code: 200, input: ["certification_level?", "certified_methods?", "certification_expires_at?"], output: Technician, side_effects: ["CERTIFICATION_EXPIRED -> ACTIVE when certification_expires_at renewed beyond now"] }
  - { method: POST, path: "/spd/technicians/{id}/suspend", description: "Suspend a technician", roles: [SpdSupervisor], code: 200, input: [], output: Technician, side_effects: ["ACTIVE -> SUSPENDED"] }
  - { method: POST, path: "/spd/technicians/{id}/reinstate", description: "Reinstate a suspended technician", roles: [SpdSupervisor], code: 200, input: [], output: Technician, side_effects: ["SUSPENDED -> ACTIVE"] }

  # --- Loaner sets ---
  - { method: POST, path: "/spd/loaner-sets", description: "Book a loaner set for a case (due_by computed per tiered lead time)", roles: [OrScheduler], code: 201, input: [vendor, case_id, tray_count], output: LoanerSet, side_effects: ["status = BOOKED", "due_by computed per loaner_intake_deadline"] }
  - { method: GET, path: "/spd/loaner-sets", description: "List/filter loaner sets", roles: [Any], code: 200, input: ["case_id?", "status?", "limit?", "offset?"], output: "LoanerSet[]", side_effects: [] }
  - { method: GET, path: "/spd/loaner-sets/{id}", description: "Get one loaner set", roles: [Any], code: 200, input: [], output: LoanerSet, side_effects: [] }
  - { method: POST, path: "/spd/loaner-sets/{id}/receive", description: "Record loaner intake; branches RECEIVED vs LATE_RECEIVED on due_by", roles: [SpdTechnician], code: 200, input: [], output: LoanerSet, side_effects: ["BOOKED -> RECEIVED (now <= due_by) or LATE_RECEIVED (now > due_by)", "received_at, received_late set"] }
  - { method: POST, path: "/spd/loaner-sets/{id}/mark-ready", description: "Finish loaner processing", roles: [SpdTechnician], code: 200, input: [], output: LoanerSet, side_effects: ["RECEIVED|LATE_RECEIVED -> READY"] }

  # --- Compliance computed read ---
  - { method: GET, path: "/spd/compliance/summary", description: "Compliance KPIs over rolling windows (both IUSS rate variants)", roles: [Any], code: 200, input: [], output: { iuss_count_7d: integer, completed_cases_30d: integer, scheduled_cases_30d: integer, iuss_rate_per_completed: number, iuss_rate_per_scheduled: number, loads_recalled_30d: integer, trays_quarantined_count: integer }, side_effects: ["runs iuss_rolling_window_rate; loads_recalled_30d counts loads with recalled... loads with status RECALLED whose recall happened in (now-720h, now]; trays_quarantined_count counts trays currently QUARANTINED"] }

  # --- Test-driving logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (ISO8601). Startup default before any call is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time. All timestamps, deadlines, windows and lazy sweeps in this scaffold read this clock.", roles: [FacilityAdmin], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["logical clock set; lazy sweeps apply on subsequent reads/actions"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted on this endpoint" }
  # --- Existence / input shape ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource id does not exist (leftmost missing id wins)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, unresolvable body FK, scheduled_start_at >= scheduled_end_at, duplicate case_number, or empty instrument_requirements" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 400, condition: "Enum field value outside its declared set" }
  - { id: ERR_JUSTIFICATION_TOO_SHORT, http: 400, condition: "justification / override_justification shorter than 20 characters" }
  - { id: ERR_DUPLICATE_SERIAL_NUMBER, http: 409, condition: "Instrument serial_number already registered" }
  - { id: ERR_DUPLICATE_TEMPLATE_CODE, http: 409, condition: "TrayTemplate code already registered" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version" }
  # --- Tray state gates ---
  - { id: ERR_TRAY_NOT_READY_FOR_DECONTAMINATION, http: 409, condition: "decontamination/start requires status AWAITING_DECONTAMINATION or QUARANTINED" }
  - { id: ERR_TRAY_NOT_IN_DECONTAMINATION, http: 409, condition: "decontamination/complete requires IN_DECONTAMINATION" }
  - { id: ERR_TRAY_NOT_DECONTAMINATED, http: 409, condition: "assembly/start requires DECONTAMINATED" }
  - { id: ERR_TRAY_NOT_IN_ASSEMBLY, http: 409, condition: "assembly-verifications and instrument assign require tray IN_ASSEMBLY" }
  - { id: ERR_TRAY_NOT_ASSEMBLED, http: 409, condition: "adding to a load requires tray ASSEMBLED" }
  - { id: ERR_TRAY_NOT_STERILE, http: 409, condition: "reservation requires tray STERILE (post-sweep)" }
  - { id: ERR_TRAY_NOT_QUARANTINED, http: 409, condition: "discard requires tray QUARANTINED" }
  # --- Load / sterilizer state gates ---
  - { id: ERR_LOAD_NOT_LOADING, http: 409, condition: "add-tray, start, abort require load LOADING" }
  - { id: ERR_LOAD_NOT_RUNNING, http: 409, condition: "complete / fail-cycle require load RUNNING" }
  - { id: ERR_LOAD_NOT_RELEASABLE, http: 409, condition: "release requires load COMPLETED" }
  - { id: ERR_LOAD_NOT_RECALLABLE, http: 409, condition: "recall requires load RELEASED" }
  - { id: ERR_LOAD_EMPTY, http: 409, condition: "start requires tray_count >= 1" }
  - { id: ERR_LOAD_CAPACITY_EXCEEDED, http: 409, condition: "add-tray when tray_count == sterilizer.chamber_capacity" }
  - { id: ERR_STERILIZER_NOT_IDLE, http: 409, condition: "load start requires sterilizer IDLE" }
  - { id: ERR_LOAD_PLANNED_START_NOT_REACHED, http: 409, condition: "load start before planned_start_at" }
  # --- Safety ---
  - { id: ERR_RELEASE_OPERATOR_SEGREGATION, http: 403, condition: "Load release caller X-User-ID equals load.operator_id (segregation of duties)" }
  - { id: ERR_BI_NOT_PASSED, http: 409, condition: "Release requires the load's BI recorded with result NEGATIVE" }
  - { id: ERR_STERILITY_EXPIRED_FOR_CASE, http: 409, condition: "Reservation requires tray.sterility_expires_at strictly greater than case.scheduled_start_at" }
  - { id: ERR_RESERVED_TRAY_EXPIRED, http: 409, condition: "Case start finds a RESERVED reservation whose tray is not STERILE post-sweep or whose sterility_expires_at <= now" }
  # --- Temporal ---
  - { id: ERR_BI_STILL_INCUBATING, http: 409, condition: "record-result before bi.due_at (now < due_at)" }
  - { id: ERR_BI_LOAD_STATE_INVALID, http: 409, condition: "manual BI creation requires the load COMPLETED or RELEASED" }
  - { id: ERR_BI_ALREADY_RECORDED, http: 409, condition: "record-result on a BI already RESULT_RECORDED" }
  - { id: ERR_STERILIZER_WINDOW_CONFLICT, http: 409, condition: "New load's planned half-open window [planned_start_at, planned_start_at + cycle_minutes) overlaps another LOADING/RUNNING load on the same sterilizer; adjacency (shared endpoint) is allowed" }
  - { id: ERR_TRAY_RESERVATION_TIME_CONFLICT, http: 409, condition: "New reservation's case window, expanded by TURNOVER_BUFFER_MINUTES=45 on both sides, intersects another RESERVED reservation's case window for the same tray; a gap of exactly 45 minutes is allowed" }
  # --- Technician standing / certification ---
  - { id: ERR_TECHNICIAN_SUSPENDED, http: 403, condition: "Load start by a SUSPENDED technician" }
  - { id: ERR_CERTIFICATION_EXPIRED, http: 403, condition: "Load start by a CERTIFICATION_EXPIRED technician (post-sweep)" }
  - { id: ERR_CERTIFICATION_METHOD_MISMATCH, http: 403, condition: "Sterilizer method not in technician.certified_methods" }
  - { id: ERR_CERTIFICATION_LEVEL_INSUFFICIENT, http: 403, condition: "technician.certification_level < sterilizer.required_certification_level" }
  - { id: ERR_COMPETENCY_BELOW_THRESHOLD, http: 403, condition: "LOW_TEMP_H2O2 load start with competency_score < 70" }
  - { id: ERR_TECHNICIAN_NOT_ACTIVE, http: 409, condition: "suspend requires technician ACTIVE" }
  - { id: ERR_TECHNICIAN_NOT_SUSPENDED, http: 409, condition: "reinstate requires technician SUSPENDED" }
  # --- Instrument / repair ---
  - { id: ERR_INSTRUMENT_NOT_IN_SERVICE, http: 409, condition: "flag-for-repair / assign require instrument IN_SERVICE" }
  - { id: ERR_INSTRUMENT_ALREADY_ASSIGNED, http: 409, condition: "assign when assigned_tray_id != null" }
  - { id: ERR_INSTRUMENT_CYCLE_LIMIT, http: 409, condition: "assign when usage_cycles >= max_cycles (equality blocks)" }
  - { id: ERR_INSTRUMENT_NOT_RETIRABLE, http: 409, condition: "retire requires IN_SERVICE or FLAGGED_FOR_REPAIR" }
  - { id: ERR_REPAIR_ORDER_NOT_OPEN, http: 409, condition: "send requires repair order OPEN" }
  - { id: ERR_REPAIR_ORDER_NOT_SENT, http: 409, condition: "receive requires repair order SENT" }
  - { id: ERR_OUTCOME_OVERRIDE_JUSTIFICATION_REQUIRED, http: 400, condition: "receive outcome differs from recommended_outcome without override_justification >= 20 chars" }
  # --- Case / reservation ---
  - { id: ERR_CASE_NOT_RESERVABLE, http: 409, condition: "reservation create requires case SCHEDULED, TRAYS_RESERVED or AT_RISK" }
  - { id: ERR_CASE_NOT_STARTABLE, http: 409, condition: "start requires TRAYS_RESERVED/AT_RISK with >= 1 RESERVED reservation, or SCHEDULED with >= 1 IUSS exception" }
  - { id: ERR_CASE_NOT_COMPLETABLE, http: 409, condition: "complete requires case IN_PROGRESS" }
  - { id: ERR_CASE_NOT_CANCELLABLE, http: 409, condition: "cancel requires case SCHEDULED, TRAYS_RESERVED or AT_RISK" }
  - { id: ERR_RESERVATION_NOT_ACTIVE, http: 409, condition: "release requires reservation RESERVED" }
  - { id: ERR_LOANER_NOT_READY, http: 409, condition: "case start while a linked LoanerSet is not READY" }
  # --- Loaner ---
  - { id: ERR_LOANER_NOT_BOOKED, http: 409, condition: "receive requires loaner BOOKED" }
  - { id: ERR_LOANER_NOT_RECEIVED, http: 409, condition: "mark-ready requires loaner RECEIVED or LATE_RECEIVED" }
  # --- IUSS ---
  - { id: ERR_IUSS_TRAY_NOT_ELIGIBLE, http: 409, condition: "IUSS tray must be DECONTAMINATED or ASSEMBLED" }
  - { id: ERR_IUSS_RATE_EXCEEDED, http: 403, condition: "Rolling 168h window already holds >= 3 IUSS events; the 4th and later require role SpdSupervisor" }
  - { id: ERR_IUSS_ALREADY_REVIEWED, http: 409, condition: "review requires IUSS exception DOCUMENTED" }
  - { id: ERR_CASE_TERMINAL_FOR_IUSS, http: 409, condition: "IUSS case_id references a COMPLETED or CANCELLED case" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: FacilityAdmin
    description: "SPD facility administrator: owns configuration (templates, sterilizers, instruments, technicians), repair-order dispatch/receive, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /spd/tray-templates; PUT /spd/tray-templates/{id}"
      - "POST /spd/instruments; POST /spd/instruments/{id}/retire"
      - "POST /spd/repair-orders/{id}/send; POST /spd/repair-orders/{id}/receive"
      - "POST /spd/sterilizers"
      - "POST /spd/technicians; PUT /spd/technicians/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints (Any)"]
  - name: SpdTechnician
    description: "Certified SPD technician: runs decontamination, assembly, count-sheet verification, instrument assignment/flagging, load operation, IUSS logging, loaner intake"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /spd/trays; POST /spd/trays/{id}/decontamination/start|complete; POST /spd/trays/{id}/assembly/start; POST /spd/trays/{id}/assembly-verifications"
      - "POST /spd/instruments/{id}/assign; POST /spd/instruments/{id}/flag-for-repair"
      - "POST /spd/sterilization-loads; POST .../trays; POST .../start; POST .../complete; POST .../fail-cycle; POST .../abort"
      - "POST /spd/loaner-sets/{id}/receive; POST /spd/loaner-sets/{id}/mark-ready"
    shared_operations: ["POST /spd/iuss-exceptions (shared with SpdSupervisor)", "all GET endpoints (Any)"]
  - name: SpdSupervisor
    description: "SPD supervisor (also a credentialed technician identity): releases loads (never own-operated), recalls, discards quarantined trays, suspends/reinstates technicians, logs IUSS beyond the technician rate"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /spd/sterilization-loads/{id}/release"
      - "POST /spd/trays/{id}/discard"
      - "POST /spd/technicians/{id}/suspend; POST /spd/technicians/{id}/reinstate"
    shared_operations: ["POST /spd/sterilization-loads/{id}/recall (shared with QualityAuditor)", "POST /spd/iuss-exceptions (shared with SpdTechnician)", "all GET endpoints (Any)"]
  - name: OrScheduler
    description: "OR scheduling desk: schedules cases, reserves/releases trays (OCC-guarded), books loaner sets, starts/completes/cancels cases"
    identity: opaque
    exclusive_operations:
      - "POST /spd/or-cases; POST /spd/or-cases/{id}/start; POST /spd/or-cases/{id}/complete; POST /spd/or-cases/{id}/cancel"
      - "POST /spd/or-cases/{id}/reservations; POST /spd/tray-reservations/{id}/release"
      - "POST /spd/loaner-sets"
    shared_operations: ["all GET endpoints (Any)"]
  - name: QualityAuditor
    description: "Quality/compliance auditor: records biological indicator results, reviews IUSS exceptions, may recall released loads"
    identity: opaque
    exclusive_operations:
      - "POST /spd/biological-indicators/{id}/record-result"
      - "POST /spd/sterilization-loads/{id}/biological-indicators"
      - "POST /spd/iuss-exceptions/{id}/review"
    shared_operations: ["POST /spd/sterilization-loads/{id}/recall (shared with SpdSupervisor)", "all GET endpoints (Any)"]
  - name: Any
    description: "Every declared role may perform read operations"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
