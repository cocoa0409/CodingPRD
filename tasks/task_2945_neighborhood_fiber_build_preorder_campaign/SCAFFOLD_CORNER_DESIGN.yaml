          - validations[priority 18 ERR_INVALID_WINDOW]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / zone_construction_not_active_outranks_invalid_window
          rationale: "A state-category error beating a temporal-category one on the same request is asserted there."

