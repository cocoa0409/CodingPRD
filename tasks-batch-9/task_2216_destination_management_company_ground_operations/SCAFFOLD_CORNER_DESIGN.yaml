            - "Program.${prog_id}.version == 1"
            - "Program.${prog_id}.estimated_client_total_cents == 0"

      - name: program_create_with_markup_pct_outside_the_band_rejected
        claim_type: triggerable
        grounds: ["validations[priority=45]", "errors[ERR_MARKUP_PCT_OUT_OF_BAND]"]
        distinguishing_aspect: "The markup band is closed on both ends: 0.36 above and 0.04 below are rejected with HTTP 422 ERR_MARKUP_PCT_OUT_OF_BAND while the exact lower bound 0.05 is accepted, so the guard is an inclusive range check and not a strict inequality."
        test_recipe:
          setup: ["Logical clock 2026-08-01T00:00:00Z; nothing else is required because the band is checked before persistence."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /dmc/programs"
              payload: { client_name: "Greedy Markup Client", group_name: "Greedy Markup Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.36 }
              as: ProgramDirector
              captures: { e_high: $.data.error_id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Thin Markup Client", group_name: "Thin Markup Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.04 }
              as: ProgramDirector
              captures: { e_low: $.data.error_id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Boundary Markup Client", group_name: "Boundary Markup Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.05 }
              as: ProgramDirector
              captures: { ok_id: $.data.id }
          assert:
