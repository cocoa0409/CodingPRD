              payload: { drug_id: "${dr1}", lot_number: "LOT-DEC", units_received: 10, expires_on: "2026-12-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
