  - { method: POST, path: "/api/tour-expenses/{id}/approve", description: "SUBMITTED -> APPROVED; category + total caps; debits tour recoupment bucket", roles: [FinanceController], code: 200, input: [], output: TourExpense, side_effects: ["RecoupmentAccount.tour_support_balance_cents += amount_cents", "approved_expense_total_cents += amount_cents"] }
  - { method: POST, path: "/api/tour-expenses/{id}/reject", description: "SUBMITTED -> REJECTED", roles: [FinanceController], code: 200, input: [], output: TourExpense, side_effects: [] }
  - { method: POST, path: "/api/tour-expenses/{id}/void", description: "APPROVED -> VOIDED; compensating credit while tour not CLOSED", roles: [FinanceController], code: 200, input: [], output: TourExpense, side_effects: ["RecoupmentAccount.tour_support_balance_cents -= amount_cents", "approved_expense_total_cents -= amount_cents"] }

  # --- RevenueReport / RoyaltyRun / RoyaltyStatement ---
  - { method: POST, path: "/api/revenue-reports", description: "Ingest an append-only distributor revenue line", roles: [FinanceController], code: 201, input: ["label_id", "distributor_id", "release_id", "period", "channel", "units", "gross_revenue_cents", "note?"], output: RevenueReport, side_effects: [] }
  - { method: GET, path: "/api/revenue-reports/{id}", description: "Get a revenue report", roles: [LabelAdmin, AnRManager, FinanceController], code: 200, input: [], output: RevenueReport, side_effects: [] }
  - { method: GET, path: "/api/revenue-reports", description: "List revenue reports with filters", roles: [LabelAdmin, AnRManager, FinanceController], code: 200, input: ["label_id?", "distributor_id?", "release_id?", "period?", "channel?", "limit?", "offset?"], output: "RevenueReport[]", side_effects: [] }
  - { method: POST, path: "/api/royalty-runs", description: "Open a royalty run for a period (unique per label)", roles: [FinanceController], code: 201, input: ["label_id", "period"], output: RoyaltyRun, side_effects: ["status = OPEN"] }
  - { method: GET, path: "/api/royalty-runs/{id}", description: "Get a royalty run", roles: [LabelAdmin, FinanceController], code: 200, input: [], output: RoyaltyRun, side_effects: [] }
  - { method: GET, path: "/api/royalty-runs", description: "List royalty runs", roles: [LabelAdmin, FinanceController], code: 200, input: ["label_id?", "status?", "limit?", "offset?"], output: "RoyaltyRun[]", side_effects: [] }
  - { method: POST, path: "/api/royalty-runs/{id}/close", description: "OPEN -> CLOSED; freezes revenue intake for the period", roles: [FinanceController], code: 200, input: [], output: RoyaltyRun, side_effects: [] }
  - { method: POST, path: "/api/royalty-runs/{id}/calculate", description: "CLOSED -> CALCULATED; generates PROVISIONAL statements (projection only, no bucket mutation)", roles: [FinanceController], code: 200, input: [], output: RoyaltyRun, side_effects: ["PROVISIONAL RoyaltyStatements created for eligible contracts"] }
  - { method: POST, path: "/api/royalty-runs/{id}/finalize", description: "CALCULATED -> FINALIZED; 3-link cascade: statements FINAL -> waterfall applied -> payout flip", roles: [FinanceController], code: 200, input: [], output: RoyaltyRun, side_effects: ["Statements PROVISIONAL -> FINAL", "recoupment_waterfall applied to accounts", "RECOUPING -> EARNING flips"] }
  - { method: POST, path: "/api/royalty-runs/{id}/mark-paid", description: "FINALIZED -> PAID; requires every statement PAID", roles: [FinanceController], code: 200, input: [], output: RoyaltyRun, side_effects: [] }
  - { method: GET, path: "/api/royalty-runs/{id}/statements", description: "Reverse FK lookup of a run's statements", roles: [LabelAdmin, FinanceController], code: 200, input: ["status?", "limit?", "offset?"], output: "RoyaltyStatement[]", side_effects: [] }
  - { method: GET, path: "/api/royalty-statements/{id}", description: "Get a statement (artist portal reads own)", roles: [LabelAdmin, FinanceController, ArtistPortal], code: 200, input: [], output: RoyaltyStatement, side_effects: [] }
  - { method: GET, path: "/api/royalty-statements", description: "List statements with filters (artist portal filters own via artist_id)", roles: [LabelAdmin, FinanceController, ArtistPortal], code: 200, input: ["run_id?", "contract_id?", "artist_id?", "status?", "limit?", "offset?"], output: "RoyaltyStatement[]", side_effects: [] }
  - { method: POST, path: "/api/royalty-statements/{id}/dispute", description: "FINAL -> DISPUTED by the owning artist", roles: [ArtistPortal], code: 200, input: ["dispute_note"], output: RoyaltyStatement, side_effects: ["dispute_note recorded"] }
  - { method: POST, path: "/api/royalty-statements/{id}/adjust", description: "OCC-guarded signed adjustment while PROVISIONAL or DISPUTED; applied after reserve", roles: [FinanceController], code: 200, input: ["expected_royalty_statement_version", "adjustment_delta_cents"], output: RoyaltyStatement, side_effects: ["adjustment_cents += delta", "net_payable_cents recomputed", "increments RoyaltyStatement.version by 1"] }
  - { method: POST, path: "/api/royalty-statements/{id}/resolve-dispute", description: "DISPUTED -> FINAL", roles: [FinanceController], code: 200, input: [], output: RoyaltyStatement, side_effects: [] }
  - { method: POST, path: "/api/royalty-statements/{id}/pay", description: "FINAL -> PAID; run must be FINALIZED; net must be >= 0", roles: [FinanceController], code: 200, input: [], output: RoyaltyStatement, side_effects: [] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Missing/unknown X-User-ID or X-User-Role header" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_ARTIST_OWNERSHIP_MISMATCH, http: 403, condition: "ArtistPortal caller's X-User-ID does not equal the owning Artist.id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced resource id does not exist (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, enum violation, or numeric range violation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on OCC-guarded writes" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current status does not declare the attempted transition, or a state precondition fails (including terminal-state attempts and cross-entity state gates)" }
  - { id: ERR_GUARDIAN_CONSENT_REQUIRED, http: 422, condition: "Deal execute for an under-18 artist without guardian_name and guardian_email" }
  - { id: ERR_SAMPLE_CLEARANCE_MISSING, http: 422, condition: "Track with contains_sample=true advancing to CLEARED without clearance_ref" }
  - { id: ERR_DEAL_MEMO_ALREADY_OPEN, http: 409, condition: "Artist already has a memo in DRAFT/PROPOSED/COUNTERED/APPROVED" }
  - { id: ERR_SCOUTING_SCORE_TOO_LOW, http: 422, condition: "artist.scouting_score below label.sign_threshold_score at propose" }
  - { id: ERR_DEAL_MEMO_EXPIRED, http: 422, condition: "Guarded memo transition attempted after valid_until_date; memo transitions to EXPIRED" }
  - { id: ERR_ADVANCE_CAP_EXCEEDED, http: 422, condition: "Execute: advance_cents exceeds label.advance_cap_cents" }
  - { id: ERR_RENEGOTIATION_IN_PROGRESS, http: 409, condition: "Option exercise while an open memo exists for the artist" }
  - { id: ERR_OPTION_WINDOW_CLOSED, http: 422, condition: "Option exercise after current_term_end_date" }
  - { id: ERR_UNRECOUPED_BALANCE, http: 422, condition: "Terminate with total_unrecouped_cents > 0 and write_off_unrecouped false" }
  - { id: ERR_CONTRACT_NOT_FUNDED, http: 409, condition: "Project start while contract advance_status is PENDING" }
  - { id: ERR_ARTIST_NOT_SIGNABLE, http: 409, condition: "Artist status does not permit the operation (e.g., memo for HIATUS/DROPPED artist, project for SCOUTED artist)" }
  - { id: ERR_PROJECT_BUDGET_EXCEEDED, http: 422, condition: "Milestone pay would push spent_cents above budget_cents" }
  - { id: ERR_BUDGET_BELOW_SPEND, http: 422, condition: "Amended budget below already-spent amount" }
  - { id: ERR_MILESTONE_SEQUENCE_CONFLICT, http: 409, condition: "Duplicate milestone sequence within the project among non-CANCELLED milestones" }
  - { id: ERR_ISRC_CONFLICT, http: 409, condition: "ISRC already exists on another track of the label" }
  - { id: ERR_SINGLE_TRACK_COUNT, http: 422, condition: "SINGLE release without exactly 1 track, ALBUM outside 2..30, or tracks not of this contract / not in MIXED+ states" }
  - { id: ERR_TRACKS_NOT_CLEARED, http: 422, condition: "Assemble while any member track is not CLEARED" }
  - { id: ERR_COVER_ART_MISSING, http: 422, condition: "lock-assets with cover_art_confirmed != true" }
  - { id: ERR_ASSETS_NOT_LOCKED, http: 409, condition: "Schedule while asset_status is not LOCKED" }
  - { id: ERR_RELEASE_LEAD_TIME, http: 422, condition: "release_date earlier than today + release_lead_days at schedule" }
  - { id: ERR_DISTRIBUTOR_INACTIVE, http: 422, condition: "Delivery creation for an inactive distributor" }
  - { id: ERR_DUPLICATE_DELIVERY, http: 409, condition: "A non-terminal delivery already exists for the (release, distributor) pair" }
  - { id: ERR_RELEASE_DATE_NOT_REACHED, http: 422, condition: "Go-live before release_date" }
  - { id: ERR_BEAT_OUTSIDE_WINDOW, http: 422, condition: "Beat outside [release_date - beat_pre_release_days, release_date + beat_post_release_days]" }
  - { id: ERR_BEAT_WINDOW_OVERLAP, http: 409, condition: "Half-open overlap with a non-terminal beat on the same release+channel" }
  - { id: ERR_CAMPAIGN_WINDOW_CONFLICT, http: 409, condition: "Less than campaign_gap_days between closed intervals of non-KILLED campaigns on the same release+channel" }
  - { id: ERR_CAMPAIGN_CAP_EXCEEDED, http: 422, condition: "Spend would push spend_cents above spend_cap_cents" }
  - { id: ERR_APPROVED_EXCEEDS_REQUESTED, http: 422, condition: "Tour approve with approved_budget_cents above requested_amount_cents" }
  - { id: ERR_CATEGORY_CAP_EXCEEDED, http: 422, condition: "Tour expense would exceed its category cap (bps of approved budget, floor)" }
  - { id: ERR_TOUR_BUDGET_EXCEEDED, http: 422, condition: "Tour expense would exceed the total approved budget" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Tour advance-funds caller equals the approver's X-User-ID" }
  - { id: ERR_DUPLICATE_REVENUE_REPORT, http: 409, condition: "Duplicate (label, distributor, release, period, channel) revenue report" }
  - { id: ERR_RELEASE_NOT_LIVE, http: 422, condition: "Revenue report for a release whose distribution_status is not DELIVERED/LIVE/TAKEN_DOWN" }
  - { id: ERR_RUN_PERIOD_CONFLICT, http: 409, condition: "A royalty run already exists for this label and period" }
  - { id: ERR_RUN_HAS_UNPAID_STATEMENTS, http: 409, condition: "mark-paid while any statement of the run is not PAID" }
  - { id: ERR_NEGATIVE_PAYABLE, http: 422, condition: "Statement pay with net_payable_cents < 0" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: LabelAdmin
    description: "Label executive superuser: deal approval/execution, option exercise, termination, distributor administration, clock and sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /api/labels — create label"
      - "POST /api/labels/{id}/ops/sweep — housekeeping sweep"
      - "POST /api/_clock/set_current_utc — set logical clock"
      - "POST /api/artists/{id}/drop — drop artist"
      - "POST /api/deal-memos/{id}/approve — approve memo"
      - "POST /api/deal-memos/{id}/execute — execute memo"
      - "POST /api/contracts/{id}/exercise-option — exercise option"
      - "POST /api/contracts/{id}/terminate — terminate contract"
      - "POST /api/milestones/{id}/approve — approve milestone"
      - "POST /api/milestones/{id}/reject — reject milestone"
      - "POST /api/distributors, PATCH /api/distributors/{id} — distributor administration"
      - "POST /api/tour-supports/{id}/approve — approve tour support"
      - "POST /api/tour-supports/{id}/decline — decline tour support"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/releases/{id}/cancel — shared with AnRManager"
  - name: AnRManager
    description: "A&R: scouting, deal drafting and negotiation, recording projects, milestones, tracks, release assembly and cancellation, tour support proposals"
    identity: opaque
    exclusive_operations:
      - "POST /api/artists — create artist"
      - "POST /api/artists/{id}/hiatus, /reactivate — artist lifecycle"
      - "POST /api/artists/{id}/deal-memos — draft memo"
      - "POST /api/deal-memos/{id}/propose, /reject — memo lifecycle"
      - "POST /api/contracts/{id}/recording-projects — create project"
      - "POST /api/recording-projects/{id}/amend-budget, /start, /advance-stage, /cancel — project lifecycle (OCC on amend)"
      - "POST /api/recording-projects/{id}/milestones — create milestone"
      - "POST /api/milestones/{id}/submit — submit milestone"
      - "POST /api/recording-projects/{id}/tracks — create track"
      - "POST /api/tracks/{id}/advance-stage, /block, /rework — track lifecycle"
      - "POST /api/contracts/{id}/releases — create release"
      - "POST /api/releases/{id}/assemble, /lock-assets — asset pipeline"
      - "POST /api/contracts/{id}/tour-supports — propose tour support"
      - "POST /api/tour-supports/{id}/cancel — cancel tour support"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/deal-memos/{id}/counter — shared with ArtistPortal (OCC)"
      - "POST /api/releases/{id}/cancel — shared with LabelAdmin"
  - name: FinanceController
    description: "Finance: advance disbursement, milestone payment, tour funding and expense adjudication, revenue ingestion, royalty runs and statements"
    identity: opaque
    exclusive_operations:
      - "POST /api/contracts/{id}/disburse-advance — fund advance"
      - "POST /api/milestones/{id}/pay — pay milestone"
      - "POST /api/tour-supports/{id}/advance-funds, /reconcile, /close — tour money lifecycle (SoD on advance)"
      - "POST /api/tour-expenses/{id}/approve, /reject, /void — expense adjudication"
      - "POST /api/revenue-reports — ingest revenue"
      - "POST /api/royalty-runs, /close, /calculate, /finalize, /mark-paid — royalty run lifecycle"
      - "POST /api/royalty-statements/{id}/adjust, /resolve-dispute, /pay — statement lifecycle (OCC on adjust)"
    shared_operations:
      - "All GET endpoints"
  - name: MarketingManager
    description: "Marketing: release scheduling, distributor deliveries, go-live/takedown, marketing beats, promo campaigns and spend"
    identity: opaque
    exclusive_operations:
      - "POST /api/releases/{id}/schedule, /deliveries, /go-live, /takedown, /relaunch — distribution pipeline"
      - "POST /api/asset-deliveries/{id}/transmit, /acknowledge, /reject, /retry — delivery ops"
      - "POST /api/releases/{id}/beats — plan beats"
      - "POST /api/beats/{id}/ready, /execute, /measure, /skip — beat lifecycle"
      - "POST /api/releases/{id}/promo-campaigns — create campaign"
      - "POST /api/promo-campaigns/{id}/activate, /pause, /resume, /complete, /kill, /spend — campaign lifecycle"
    shared_operations:
      - "All GET endpoints"
  - name: ArtistPortal
    description: "The signed artist: reads own contract/account/statements, counters deal memos, submits tour expenses, disputes statements"
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /api/tour-supports/{id}/expenses — submit own tour expense"
      - "POST /api/royalty-statements/{id}/dispute — dispute own FINAL statement"
    shared_operations:
      - "GET endpoints for own artist's resources (ownership-checked)"
      - "POST /api/deal-memos/{id}/counter — shared with AnRManager (OCC, own memos only)"
