      - name: glass_grade_suitability_outranks_blank_sufficiency_on_work_order_create
        grounds:
          - validations.priority_21
          - validations.priority_26
          - errors.ERR_GLASS_GRADE_UNSUITABLE
          - errors.ERR_INSUFFICIENT_BLANKS
          - conventions.grade_ranks
          - calculations.blank_conservation_ledger
        distinguishing_aspect: |
          A four-element order against a single-blank H5/D lot breaks the priority-21 grade rule and the
          priority-26 blank-sufficiency rule at once (reserved_blank_count 5 against available_blank_count
          1); the response must be ERR_GLASS_GRADE_UNSUITABLE. Repeating the same order against an equally
          short but grade-compliant H2/A lot then surfaces ERR_INSUFFICIENT_BLANKS, and neither lot's
          ledger moves.
        test_recipe:
          setup:
            - "A RELEASED design demanding min_index_homogeneity_grade H2 and max_striae_grade A."
            - "GL-2540-B: certified H5/D with total_blank_count 1 (fails both rules). GL-2540-G: certified H2/A with total_blank_count 1 (fails only the blank rule)."
            - "element_count 4 computes spare_blank_count 1 and reserved_blank_count 5, so 1 available blank is never enough."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050, min_index_homogeneity_grade: "H2", max_striae_grade: "A" }
              as: OpticsEngineer
