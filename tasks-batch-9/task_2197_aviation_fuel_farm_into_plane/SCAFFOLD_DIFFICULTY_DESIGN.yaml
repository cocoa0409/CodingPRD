  - rule_id: non_linear_state_machine
    instances:
      - name: tank_isolated_to_in_service_blocked_on_second_visit_by_quality_dimension
        grounds:
          - state_machines.StorageTank.ISOLATED_to_IN_SERVICE
          - state_machines.StorageTank.RELEASED_to_QUARANTINED
          - state_machines.StorageTank.QUARANTINED_to_ON_TEST
          - state_machines.StorageTank.ON_TEST_to_RELEASED
          - entities.StorageTank.fields.service_status
          - entities.StorageTank.fields.quality_status
        distinguishing_aspect: |
          The tank reaches the ISOLATED service node twice with identical service history, yet the very same
          ISOLATED -> IN_SERVICE request succeeds the first time and returns 409 ERR_INVALID_TANK_STATE the
          second time, because the orthogonal quality dimension moved RELEASED -> QUARANTINED in between.
          Recovery is not a rewind of the service dimension: it requires a full ON_TEST re-qualification loop
          (samples -> test-results -> quality-release by a second inspector) on the quality dimension before
          the service transition is legal again, so the machine is not a linear chain and node identity alone
          does not determine the allowed successors.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T06:00:00Z"
            - "farm SFO with ACTIVE permit, one asset TRK1 IN_SERVICE (so in_service_asset_count > 0 and posture stays OPEN)"
            - "tank T1 opening_volume_liters 1000000.0, water_bottom_mm 0.0, driven ON_TEST -> RELEASED"
            - "no fueling orders exist on the tank"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /fuel-farms"
              payload: { iata_code: "SFO", name: "SFO Fuel Consortium", hydrant_system_available: true, unpumpable_bottom_liters: 500.0 }
              as: ConsortiumAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/environmental-permits"
              payload: { permit_number: "P-2026-001", valid_from_utc: "2026-01-01T00:00:00Z", valid_until_utc: "2027-01-01T00:00:00Z", max_daily_throughput_liters: 400000.0, max_reportable_spill_liters: 20.0 }
              as: ConsortiumAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/fueling-assets"
              payload: { asset_code: "TRK1", asset_type: "TRUCK", tank_capacity_liters: 40000.0, turnaround_buffer_minutes: 15, differential_pressure_kpa: 10.0 }
              as: ConsortiumAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/storage-tanks"
              payload: { tank_code: "T1", capacity_liters: 5000000.0, safe_fill_liters: 4000000.0, density_kg_per_m3: 795.0, opening_volume_liters: 1000000.0 }
              as: ConsortiumAdmin
              captures: { tank_id: $.data.id }
            - call: "POST /storage-tanks/${tank_id}/samples"
              payload: { sample_purpose: "PERIODIC_TANK_QA" }
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { s1_id: $.data.id }
            - call: "POST /quality-samples/${s1_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.5, conductivity_ps_per_m: 120.0, observed_density_kg_per_m3: 795.0, flash_point_c: 42.0 }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /storage-tanks/${tank_id}/quality-release"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-bob"
            - call: "POST /storage-tanks/${tank_id}/service-status"
              payload: { to_status: "ISOLATED", isolation_window_start_utc: "2026-08-10T06:00:00Z", isolation_window_end_utc: "2026-08-10T10:00:00Z" }
              as: FarmOperator
            - call: "POST /storage-tanks/${tank_id}/service-status"
              payload: { to_status: "IN_SERVICE" }
              as: FarmOperator
            - call: "POST /storage-tanks/${tank_id}/service-status"
              payload: { to_status: "ISOLATED", isolation_window_start_utc: "2026-08-10T06:00:00Z", isolation_window_end_utc: "2026-08-10T10:00:00Z" }
              as: FarmOperator
            - call: "POST /storage-tanks/${tank_id}/quarantine"
              payload: { reason: "routine surveillance sample off-spec" }
              as: QualityInspector
              as_user_id: "qi-alice"
          trigger:
            - call: "POST /storage-tanks/${tank_id}/service-status"
              payload: { to_status: "IN_SERVICE" }
              as: FarmOperator
            - call: "POST /storage-tanks/${tank_id}/samples"
              payload: { sample_purpose: "PERIODIC_TANK_QA" }
              as: QualityInspector
              as_user_id: "qi-carol"
              captures: { s2_id: $.data.id }
            - call: "POST /quality-samples/${s2_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.4, conductivity_ps_per_m: 130.0, observed_density_kg_per_m3: 795.0, flash_point_c: 43.0 }
              as: QualityInspector
