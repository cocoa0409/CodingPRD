            - "response data.error_id == ERR_DUPLICATE_APPEAL_CODE"

      - name: pledge_one_time_frequency_count_mismatch
        claim_type: Conditional validation
        grounds: ["validations[priority=18]", "errors[ERR_INSTALLMENT_FREQUENCY_MISMATCH]"]
        distinguishing_aspect: "POST /pledges with frequency ONE_TIME but installment_count 3 returns ERR_INSTALLMENT_FREQUENCY_MISMATCH (422)."
