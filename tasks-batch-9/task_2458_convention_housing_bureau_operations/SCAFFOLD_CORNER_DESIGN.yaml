      - name: hotel_suspended_state_beats_terms_not_standardized
        claim_type: priority_ordering
        grounds:
          - validations[priority=52]
          - validations[priority=96]
          - errors[ERR_HOTEL_SUSPENDED]
          - errors[ERR_TERMS_NOT_STANDARDIZED]
        distinguishing_aspect: "Contracting a SUSPENDED hotel on sub-standard terms (commission_pct 0.09 < the event standard 0.10) returns the priority-52 state error ERR_HOTEL_SUSPENDED; only after reinstating the hotel does the priority-96 constraint surface as ERR_TERMS_NOT_STANDARDIZED."
        test_recipe:
          setup: ["Event with standard_commission_pct 0.10; hotel suspended; block submitted at commission_pct 0.09 so both rules are violated at once."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.09, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.09, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "PATCH /housing/hotels/${hotel_id}/standing"
              payload: { standing: "SUSPENDED" }
              as: BureauCoordinator
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-019" }
              as: HotelManager
              as_user_id: "${hotel_id}"
            - call: "PATCH /housing/hotels/${hotel_id}/standing"
              payload: { standing: "ACTIVE" }
