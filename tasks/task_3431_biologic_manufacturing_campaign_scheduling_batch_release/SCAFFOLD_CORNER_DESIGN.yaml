              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_retry: $.data.id }
          assert:
            - "the stale create is rejected 412 with ${err} == ERR_STALE_BATCH_VERSION (batch version was 2, payload carried ${bat_v} == 1)"
            - "the retry with the fresh version (${bat_v2} == 2) returns 201 and InProcessTest.${t_retry}.status == RECORDED"

