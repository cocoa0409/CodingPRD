            - call: "POST /builders/${b1_id}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { v_suspended: $.data.version }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
              captures: { v_reauthorized: $.data.version }
            - call: "GET /builders/${b1_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "${v_created} == 1 — a freshly created row starts at version 1 with status PENDING_AUTHORIZATION"
            - "${v_after_read} == ${v_created} and the second read agrees: reads never advance the counter"
            - "${v_authorized} == 2, ${v_suspended} == 3 and ${v_reauthorized} == 4 — three writes, three increments"
            - "the final read returns version 4 with status AUTHORIZED, the same status the row held at version 2, so version is not derivable from status"
            - "created_at is unchanged across all six calls while updated_at moves with each write"

