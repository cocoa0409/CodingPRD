      - name: honoraria_pool_is_conserved_to_the_cent_across_a_reseated_presiding_chair
        grounds:
          - calculations.panelist_honoraria_allocation
          - calculations.filing_fee_assessment
          - state_machines.PanelistAppointment.ACCEPTED_to_REPLACED
          - entities.PanelistAppointment.fields.honoraria_cents
          - entities.Case.fields.honoraria_pool_cents
        distinguishing_aspect: |
          The pool is 293125 cents - the expedited three-member figure, deliberately chosen because it
          is NOT divisible into the 40/30/30 split, so one cent of remainder exists and must land on
          the PRESIDING seat. The chair is then replaced and re-seated, and the invariant
          sum(honoraria_cents over ACCEPTED seats) == Case.honoraria_pool_cents must hold again after
          re-allocation, with the vacated row zeroed rather than carrying a stale 117251. An
          implementation that re-allocates only the vacant seat, or that rounds each seat
          independently, ends at 293126 or leaves 410376 spread across four rows.
