            - "trigger step 3 returns 200: FundReplacementProposal.${prop_id}.status APPROVED -> UNDER_REVIEW, approving_motion_id back to null, AssetClassSlot.${slot_lg_id}.status PENDING_REPLACEMENT -> ACTIVE because Fund.${fund_lg_id}.watch_status == CLEAR (an AT_RISK-seated slot would have gone to AT_RISK instead), and current_fund_id is still ${fund_lg_id}"
            - "trigger step 4 shows the triple restored bit-identically to its pre-approve values: occupied_menu_slots == 4, reserved_menu_slots == 0, available_menu_slots == 1, at_risk_slot_ratio == 0.0000, menu_posture == OPEN"
            - "trigger step 5 returns 200 with the identical call that failed in step 2: AssetClassSlot.${slot_tips_id}.status EMPTY -> ACTIVE, Fund.${fund_tips_id}.menu_status CANDIDATE -> ACTIVE, triple becomes occupied 5 / reserved 0 / available 0, and Plan.total_plan_assets_cents == 10500000"
            - "trigger step 6 returns 409 ERR_MENU_CAPACITY_EXHAUSTED: the freed unit was consumed by the seat-fund, so the same carried motion can no longer reserve a slot; FundReplacementProposal.${prop_id}.status stays UNDER_REVIEW with approving_motion_id null"
            - "at every observation point occupied_menu_slots + reserved_menu_slots + available_menu_slots == 5 exactly, and available_menu_slots never went negative"

      - name: review_reopen_inverts_finalize_cascade_except_reopen_count
        grounds:
          - state_machines.QuarterlyReview.PENDING_MINUTES_to_FINALIZED
          - state_machines.QuarterlyReview.FINALIZED_to_REOPENED
          - state_machines.AssetClassSlot.ACTIVE_to_AT_RISK
          - state_machines.AssetClassSlot.AT_RISK_to_ACTIVE
          - calculations.watch_recommendation
          - calculations.menu_posture
          - validations[priority=76]
          - entities.Fund.fields.watch_status_before_last_review
          - entities.AssetClassSlot.fields.status_before_last_review
          - entities.Fund.fields.consecutive_breach_quarters
          - entities.Fund.fields.latest_composite_score
          - entities.QuarterlyReview.fields.reopen_count
        distinguishing_aspect: |
          The conserved quantity here is NOT capacity but the per-fund watch-history tuple
          (watch_status, consecutive_breach_quarters, latest_composite_score) together with the plan's
          at_risk_slot_ratio == |slots in {AT_RISK, PENDING_REPLACEMENT}| / |non-RETIRED slots|, so
          reopen must undo all four finalize hops from the stored snapshots — watch_status CLEAR,
          consecutive_breach_quarters back to 0, latest_composite_score back to null, slot AT_RISK back
          to ACTIVE, ratio 0.5000 back to 0.0000, posture FROZEN back to OPEN, the BLOCKED proposal back
          to DRAFT — while reopen_count deliberately ratchets from 0 to 1 and is never restored.
