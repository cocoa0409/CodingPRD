            - "MaintenanceBlackout.${bl_id}.status == APPROVED"
            - "SpaceUnit.${sp_bb_id}.active_blackout_count == 1"
            - "SpaceUnit.${sp_bc_id}.active_blackout_count == 0"
            - "SpaceHold.${hold_bb_id}.status == RELEASED"
            - "SpaceHold.${hold_bc_id}.status == CONFIRMED"
            - "EventBooking.${bk_bb_id}.hold_count == 0 and status == TENTATIVE"
            - "EventBooking.${bk_bc_id}.hold_count == 1"

      - name: error_hold_sweep_bulk_action_over_expired_challenges
        claim_type: bulk_action
        grounds:
          - endpoints[POST /convention-center/_ops/hold-sweep]
        excluded_because:
          difficulty_instance: transitive_cascade / expired_challenge_sweep_cascades_hold_release_to_booking_license_and_service_order
          rationale: "The named §1.8 instance runs the sweep endpoint and asserts its four aggregate counters together with the downstream cascade."

  - section: errors
    instances:
      - name: request_with_missing_x_user_headers_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Authentication is checked at priority 10, ahead of every other rule, so a
          request with no X-User-Role and X-User-ID headers and a request carrying a role
          string that is not one of the six declared roles must both return 401
          ERR_UNAUTHENTICATED rather than 403 or 404, even though the target identifier
          does not exist either.
        test_recipe:
          setup:
            - "the database is empty and no identity headers are supplied"
          setup_api_calls: []
          trigger:
            - call: "GET /convention-center/bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: "(no X-User-Role or X-User-ID header)"
            - call: "GET /convention-center/bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: "Janitor"
          assert:
            - "both triggers return 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "neither returns ERR_FORBIDDEN_ROLE nor ERR_BOOKING_NOT_FOUND"
            - "both responses carry response_type error with meta.api_request_id present"

      - name: every_path_identifier_miss_returns_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors[ERR_CLIENT_NOT_FOUND]
          - errors[ERR_SPACE_NOT_FOUND]
          - errors[ERR_POLICY_WINDOW_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
          - errors[ERR_HOLD_NOT_FOUND]
          - errors[ERR_LICENSE_NOT_FOUND]
          - errors[ERR_VENDOR_NOT_FOUND]
          - errors[ERR_JURISDICTION_NOT_FOUND]
          - errors[ERR_SERVICE_ORDER_NOT_FOUND]
          - errors[ERR_LABOR_CALL_NOT_FOUND]
          - errors[ERR_CATERING_NOT_FOUND]
          - errors[ERR_SETTLEMENT_NOT_FOUND]
          - errors[ERR_BLACKOUT_NOT_FOUND]
        distinguishing_aspect: |
          Thirteen single-entity reads are issued as VenueAdmin, the one role admitted to
          all of them, against the same well-formed but absent identifier. Each must
          answer 404 with the error identifier of its own entity, so a shared generic
          not-found code or a leaked 403 is caught on the offending route.
        test_recipe:
          setup:
            - "the database is empty, so no row carries identifier 00000000-0000-4000-8000-000000000000"
          setup_api_calls: []
          trigger:
            - call: "GET /convention-center/clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/spaces/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/policy-windows/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/holds/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/licenses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/vendors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/union-jurisdictions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/service-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/labor-calls/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/catering-arrangements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/settlements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
            - call: "GET /convention-center/maintenance-blackouts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueAdmin
          assert:
            - "every trigger returns 404"
            - "the thirteen error_id values are, in order, ERR_CLIENT_NOT_FOUND, ERR_SPACE_NOT_FOUND, ERR_POLICY_WINDOW_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND, ERR_SERVICE_ORDER_NOT_FOUND, ERR_LABOR_CALL_NOT_FOUND, ERR_CATERING_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND, ERR_BLACKOUT_NOT_FOUND"
            - "no response carries response_type object"

      - name: body_foreign_key_misses_return_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors[ERR_CLIENT_NOT_FOUND]
          - errors[ERR_SPACE_NOT_FOUND]
          - errors[ERR_VENDOR_NOT_FOUND]
          - errors[ERR_JURISDICTION_NOT_FOUND]
          - errors[ERR_HOLD_NOT_FOUND]
          - errors[ERR_SETTLEMENT_NOT_FOUND]
        distinguishing_aspect: |
          Priority 32 covers foreign keys carried in the request body rather than in the
          path, which is a separate code path from priority 30. Each request is otherwise
          fully valid and names an existing parent in the path, so only the body reference
          can be at fault; the challenger_hold_id case proves the self-referential edge is
          resolved before the priority-rank comparison at 86 runs.
        test_recipe:
          setup:
            - "a CONSUMER_SHOW window, Meeting Room 301, one client and one TENTATIVE booking with one ACTIVE hold exist"
            - "no row carries identifier 00000000-0000-4000-8000-000000000000"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
