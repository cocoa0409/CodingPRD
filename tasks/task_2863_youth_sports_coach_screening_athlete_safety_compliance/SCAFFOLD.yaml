    input: ["club_id?", "member_id?", "trip_label?", "room_number?", "status?", "limit?", "offset?"]
    output: RoomStay[]
    side_effects: []
  - method: GET
    path: "/safesport/room-stays/{room_stay_id}"
    description: "Read one room stay including its occupant kind, minor athlete age and lodging safety verdict"
    roles: [NgbAdmin, ClubAdministrator, ComplianceAuditor, SafeSportOfficer]
