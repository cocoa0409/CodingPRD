# §1.9 Scaffold Corner Design — task_2733_drum_corps_tour_member_housing
# Breadth probe: the nine sections of references/claim-extraction-guide.md walked
# against this scaffold's §1.1-§1.7. Corners already asserted by a §1.8 instance
# are emitted as excluded_because stubs citing that instance by name.
# The logical clock starts at 2026-08-01T00:00:00Z; every literal below was
# computed from the §1.3 formulas, never estimated.
scaffold_corner_design:
  - section: entities
    instances:
      - name: season_creation_returns_201_with_zeroed_ledgers_and_open_status
        claim_type: creation
        grounds:
          - entities.Season
          - endpoints.POST_/seasons
        distinguishing_aspect: "A brand-new Season must come back with every ledger rollup at 0, ledger_status OPEN, billing_epoch 0 and version 1 — a scaffold that leaves the rollups null or omits them from the create response fails."
        test_recipe:
          setup: ["Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
          assert:
            - "HTTP 201 with an envelope carrying data, and data.id is a bare UUID with no type prefix"
            - "Season.${season_id}.name == 2027 Tour and year == 2027 and tuition_base_cents == 399900"
            - "Season.${season_id}.billing_epoch == 0 and ledger_status == OPEN"
            - "Season.${season_id}.tuition_charged_cents == 0 and tuition_collected_cents == 0 and late_fee_collected_cents == 0 and housing_cost_cents == 0 and tour_revenue_cents == 0"
            - "Season.${season_id}.version == 1 and created_at and updated_at are ISO 8601 UTC with three fractional digits"

      - name: host_school_retrieval_returns_stored_representation
        claim_type: retrieval
        grounds:
          - entities.HostSchool
          - endpoints.GET_/host-schools/{host_school_id}
        distinguishing_aspect: "GET /host-schools/{id} must echo the stored inputs and the two derived counters at their initial 0 values; a read that recomputes has_air_conditioning or drops rehearsal_field_count fails."
        test_recipe:
          setup: ["One host school has been registered."]
          setup_api_calls:
            - call: "POST /host-schools"
              payload: { name: "Rockford High School", city: "Rockford", state_code: "IL", sleeping_space_count: 30, capacity_per_space: 12, rehearsal_field_count: 2, has_air_conditioning: true }
              as: TourManager
              captures: { school_id: "$.data.id" }
          trigger:
            - call: "GET /host-schools/${school_id}"
              as: TourManager
          assert:
            - "HTTP 200 and HostSchool.${school_id}.name == Rockford High School and city == Rockford and state_code == IL"
            - "HostSchool.${school_id}.sleeping_space_count == 30 and capacity_per_space == 12 and rehearsal_field_count == 2 and has_air_conditioning == true"
            - "HostSchool.${school_id}.booked_block_count == 0 and reserved_bed_nights == 0 and version == 1"

      - name: tour_stop_listing_filters_by_season_and_status_with_pagination
        claim_type: listing
        grounds:
          - endpoints.GET_/tour-stops
          - entities.TourStop.fields.status
        distinguishing_aspect: "The list endpoint's optional filters and paging must compose: three stops exist, one is CANCELLED, and a status=PLANNED + limit=1 + offset=1 query must return exactly the second PLANNED stop by created_at, never the cancelled one and never an id-ordered result."
        test_recipe:
          setup:
            - "One season carries three stops created in a known order; the third has been cancelled, leaving two PLANNED stops."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Stop One", city: "Rockford", state_code: "IL", arrive_at: "2027-06-18T08:00:00Z", depart_at: "2027-06-18T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop1_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Stop Two", city: "Dubuque", state_code: "IA", arrive_at: "2027-06-19T08:00:00Z", depart_at: "2027-06-19T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop2_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Stop Three", city: "Peoria", state_code: "IL", arrive_at: "2027-06-20T08:00:00Z", depart_at: "2027-06-20T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop3_id: "$.data.id" }
            - call: "POST /tour-stops/${stop3_id}/cancel"
              payload: { cancel_reason: "route change" }
              as: CorpsDirector
          trigger:
            - call: "GET /tour-stops"
              payload: { season_id: "${season_id}", status: "PLANNED", limit: 1, offset: 1 }
              as: TourManager
          assert:
            - "HTTP 200 and the returned array holds exactly one element, TourStop.${stop2_id}"
            - "the envelope reports total_count == 2 and has_more == false for status=PLANNED with limit 1 and offset 1"
            - "TourStop.${stop3_id} is absent from the filtered result because its status is CANCELLED"
            - "ordering is by created_at ascending, so offset 1 selects the second-created PLANNED stop and never depends on id"

      - name: unknown_path_ids_return_not_found_per_collection
        claim_type: not_found
        grounds:
          - errors[ERR_SEASON_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_PAYMENT_PLAN_NOT_FOUND]
          - errors[ERR_FACILITY_AGREEMENT_NOT_FOUND]
          - errors[ERR_TOUR_STOP_NOT_FOUND]
          - errors[ERR_SHOW_SETTLEMENT_NOT_FOUND]
          - validations.priority_7_path_existence
        distinguishing_aspect: "Path existence is checked at priority 7, before any state or business rule, and each collection reports its OWN error_id — a shared generic ERR_NOT_FOUND fails, and so does a 200 with a null body."
        test_recipe:
          setup: ["Empty database; no entity of any type exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /seasons/11111111-1111-4111-8111-111111111111"
              as: CorpsDirector
              captures: { season_err: "$.data.error_id" }
            - call: "GET /members/22222222-2222-4222-8222-222222222222"
              as: MembershipCoordinator
              captures: { member_err: "$.data.error_id" }
            - call: "GET /payment-plans/33333333-3333-4333-8333-333333333333"
              as: BusinessManager
              captures: { plan_err: "$.data.error_id" }
            - call: "GET /facility-agreements/44444444-4444-4444-8444-444444444444"
              as: TourManager
              captures: { agreement_err: "$.data.error_id" }
            - call: "GET /tour-stops/55555555-5555-4555-8555-555555555555"
              as: TourManager
              captures: { stop_err: "$.data.error_id" }
            - call: "GET /show-settlements/66666666-6666-4666-8666-666666666666"
              as: BusinessManager
              captures: { settlement_err: "$.data.error_id" }
            - call: "GET /member-contracts/77777777-7777-4777-8777-777777777777"
              as: CorpsDirector
              captures: { contract_err: "$.data.error_id" }
            - call: "GET /tuition-payments/88888888-8888-4888-8888-888888888888"
              as: CorpsDirector
              captures: { payment_err: "$.data.error_id" }
            - call: "GET /housing-assignments/99999999-9999-4999-8999-999999999999"
              as: CorpsDirector
              captures: { housing_err: "$.data.error_id" }
            - call: "GET /site-bookings/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
              as: CorpsDirector
              captures: { booking_err: "$.data.error_id" }
            - call: "GET /staff-assignments/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              as: CorpsDirector
              captures: { staffing_err: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404 with an error envelope carrying error_id and message and an error_id-shaped body, not data == null"
            - "${season_err} == ERR_SEASON_NOT_FOUND"
            - "${member_err} == ERR_MEMBER_NOT_FOUND"
            - "${plan_err} == ERR_PAYMENT_PLAN_NOT_FOUND"
            - "${agreement_err} == ERR_FACILITY_AGREEMENT_NOT_FOUND"
            - "${stop_err} == ERR_TOUR_STOP_NOT_FOUND"
            - "${settlement_err} == ERR_SHOW_SETTLEMENT_NOT_FOUND"
            - "${contract_err} == ERR_CONTRACT_NOT_FOUND"
            - "${payment_err} == ERR_TUITION_PAYMENT_NOT_FOUND"
            - "${housing_err} == ERR_HOUSING_ASSIGNMENT_NOT_FOUND"
            - "${booking_err} == ERR_SITE_BOOKING_NOT_FOUND"
            - "${staffing_err} == ERR_STAFF_ASSIGNMENT_NOT_FOUND"
            - "each of the eleven collections owns a distinct error_id — eleven distinct values across the eleven reads"

      - name: member_create_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/members
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: "Every field in POST /members' input list except none is optional, so omitting section (an enum) and omitting date_of_birth must each raise ERR_INVALID_REQUEST at priority 3 — before the season FK is even resolved, which a 404-first implementation gets wrong."
        test_recipe:
          setup: ["One season exists."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { missing_section_err: "$.data.error_id" }
            - call: "POST /members"
              payload: { season_id: "99999999-9999-4999-8999-999999999999", full_name: "Avery Nakamura", email: "avery@corps.test", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { missing_dob_err: "$.data.error_id" }
          assert:
            - "${missing_section_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "${missing_dob_err} == ERR_INVALID_REQUEST with HTTP 400 — schema validation at priority 3 outranks the unresolvable season_id, which would otherwise be ERR_SEASON_NOT_FOUND at priority 8"
            - "no Member row is created and Season.${season_id}.version is still 1"

      - name: facility_agreement_defaults_applied_on_create
        claim_type: defaults
        grounds:
          - entities.FacilityAgreement.fields.counter_round
          - entities.FacilityAgreement.fields.occupied_bed_nights
          - endpoints.POST_/facility-agreements
        distinguishing_aspect: "A newly drafted agreement must default status DRAFT, counter_round 0, occupied/billable bed-nights 0, billable_cents 0 and leave countered_nightly_rate_cents and effective_nightly_rate_cents null — pinning the rate at creation instead of at signing is the classic error."
        test_recipe:
          setup: ["A season and a host school exist."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /host-schools"
              payload: { name: "Rockford High School", city: "Rockford", state_code: "IL", sleeping_space_count: 30, capacity_per_space: 12, rehearsal_field_count: 2, has_air_conditioning: true }
              as: TourManager
              captures: { school_id: "$.data.id" }
          trigger:
            - call: "POST /facility-agreements"
              payload: { host_school_id: "${school_id}", season_id: "${season_id}", usage_type: "SPRING_TRAINING", start_date: "2027-05-10", end_date: "2027-06-05", nightly_rate_cents: 500, minimum_billable_beds: 100 }
              as: TourManager
              captures: { agreement_id: "$.data.id" }
          assert:
            - "HTTP 201 and FacilityAgreement.${agreement_id}.status == DRAFT and counter_round == 0"
            - "FacilityAgreement.${agreement_id}.countered_nightly_rate_cents == null and effective_nightly_rate_cents == null"
            - "FacilityAgreement.${agreement_id}.agreement_nights == 26 and occupied_bed_nights == 0 and billable_bed_nights == 0 and billable_cents == 0"
            - "Season.${season_id}.housing_cost_cents == 0 — a DRAFT agreement contributes nothing"
            - "HostSchool.${school_id}.booked_block_count == 0 and reserved_bed_nights == 0"

      - name: member_computed_ledger_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Member.fields.tuition_charged_cents
          - entities.Member.fields.is_minor
          - entities.Member.fields.membership_status
        distinguishing_aspect: "Client-supplied values for computed or system-managed fields must be discarded, not stored: posting tuition_charged_cents, membership_status and is_minor in the create body must still yield 0 / APPLICANT / the value derived from date_of_birth against tour_departure_date."
        test_recipe:
          setup: ["One season with tour_departure_date 2027-06-12 exists."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Jamie Torres", email: "jamie@corps.test", date_of_birth: "2010-09-01", section: "COLOR_GUARD", dietary_flag: "NONE", tuition_charged_cents: 1, membership_status: "ON_TOUR", is_minor: false }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
          assert:
            - "HTTP 201 and Member.${member_id}.membership_status == APPLICANT (the supplied ON_TOUR is ignored)"
            - "Member.${member_id}.is_minor == true (derived: born 2010-09-01 is under 18 on 2027-06-12, so the supplied false is ignored)"
            - "Member.${member_id}.tuition_charged_cents == 0 and tuition_paid_cents == 0 and tuition_balance_cents == 0 and refund_due_cents == 0"
            - "Member.${member_id}.medical_status == CLEARED and withdrawal_obligation_basis == NONE and version == 1"

      - name: system_fields_are_server_minted_input_ignored
        claim_type: system_fields
        grounds:
          - entities.HostSchool
          - endpoints.POST_/host-schools
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: a create body that supplies all four must be accepted with server values, and the returned id must be a bare UUID rather than the client's string."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /host-schools"
              payload: { name: "Dubuque Senior High", city: "Dubuque", state_code: "IA", sleeping_space_count: 20, capacity_per_space: 10, rehearsal_field_count: 1, has_air_conditioning: false, id: "hs_client_supplied", created_at: "1999-01-01T00:00:00.000Z", updated_at: "1999-01-01T00:00:00.000Z", version: 77 }
              as: TourManager
              captures: { school_id: "$.data.id" }
          assert:
            - "HTTP 201 and HostSchool.${school_id}.id is a server-minted bare UUID, not hs_client_supplied"
            - "HostSchool.${school_id}.version == 1, not 77"
            - "HostSchool.${school_id}.created_at is the current logical clock instant 2026-08-01T00:00:00.000Z, not 1999-01-01T00:00:00.000Z, and updated_at equals created_at"

      - name: inverted_date_pairs_and_bad_enum_values_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_4_ERR_INVALID_DATE_RANGE
          - validations.priority_3_ERR_INVALID_REQUEST
          - validations.priority_6_ERR_AMOUNT_NOT_POSITIVE
        distinguishing_aspect: "Three distinct schema-band rules fire on their own error_ids: a non-increasing date pair is ERR_INVALID_DATE_RANGE (priority 4), an out-of-enum section is ERR_INVALID_REQUEST (priority 3), and a non-positive money input is ERR_AMOUNT_NOT_POSITIVE (priority 6). Collapsing all three into ERR_INVALID_REQUEST fails."
        test_recipe:
          setup: ["One season exists."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /host-schools"
              payload: { name: "Rockford High School", city: "Rockford", state_code: "IL", sleeping_space_count: 30, capacity_per_space: 12, rehearsal_field_count: 2, has_air_conditioning: true }
              as: TourManager
              captures: { school_id: "$.data.id" }
          trigger:
            - call: "POST /facility-agreements"
              payload: { host_school_id: "${school_id}", season_id: "${season_id}", usage_type: "SPRING_TRAINING", start_date: "2027-06-05", end_date: "2027-05-10", nightly_rate_cents: 500, minimum_billable_beds: 100 }
              as: TourManager
              captures: { range_err: "$.data.error_id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BAGPIPES", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { enum_err: "$.data.error_id" }
            - call: "POST /facility-agreements"
              payload: { host_school_id: "${school_id}", season_id: "${season_id}", usage_type: "SPRING_TRAINING", start_date: "2027-05-10", end_date: "2027-06-05", nightly_rate_cents: 0, minimum_billable_beds: 100 }
              as: TourManager
              captures: { amount_err: "$.data.error_id" }
          assert:
            - "${range_err} == ERR_INVALID_DATE_RANGE with HTTP 400 because end_date is not strictly after start_date"
            - "${enum_err} == ERR_INVALID_REQUEST with HTTP 400 because BAGPIPES is outside BRASS | PERCUSSION | COLOR_GUARD"
            - "${amount_err} == ERR_AMOUNT_NOT_POSITIVE with HTTP 400 because nightly_rate_cents must be positive"
            - "no FacilityAgreement and no Member row exists after the three rejections"

      - name: body_foreign_keys_must_resolve_or_return_404
        claim_type: parent_relationships
        grounds:
          - validations.priority_8_body_fk_existence
          - errors[ERR_SEASON_NOT_FOUND]
          - errors[ERR_HOST_SCHOOL_NOT_FOUND]
          - errors[ERR_VOLUNTEER_NOT_FOUND]
        distinguishing_aspect: "Body-level FKs are resolved at priority 8, after schema validation but before any business rule, and each unresolvable FK reports the error of ITS OWN parent type — including the self-referential TourStop.previous_stop_id, which must report ERR_TOUR_STOP_NOT_FOUND rather than ERR_SEASON_NOT_FOUND."
        test_recipe:
          setup: ["One season and one tour stop exist so that the well-formed parts of each payload resolve."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Stop One", city: "Rockford", state_code: "IL", arrive_at: "2027-06-18T08:00:00Z", depart_at: "2027-06-18T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop_id: "$.data.id" }
          trigger:
            - call: "POST /members"
              payload: { season_id: "99999999-9999-4999-8999-999999999999", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { season_fk_err: "$.data.error_id" }
            - call: "POST /facility-agreements"
              payload: { host_school_id: "88888888-8888-4888-8888-888888888888", season_id: "${season_id}", usage_type: "SPRING_TRAINING", start_date: "2027-05-10", end_date: "2027-06-05", nightly_rate_cents: 500, minimum_billable_beds: 100 }
              as: TourManager
              captures: { school_fk_err: "$.data.error_id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", previous_stop_id: "77777777-7777-4777-8777-777777777777", stop_type: "REHEARSAL_ONLY", venue_name: "Orphan Stop", city: "Peoria", state_code: "IL", arrive_at: "2027-06-19T08:00:00Z", depart_at: "2027-06-19T20:00:00Z", travel_miles_from_previous: 60, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { prev_stop_fk_err: "$.data.error_id" }
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "66666666-6666-4666-8666-666666666666", tour_stop_id: "${stop_id}", duty: "DRIVE", shift_start_at: "2027-06-18T09:00:00Z", shift_end_at: "2027-06-18T19:00:00Z" }
              as: TourManager
              captures: { volunteer_fk_err: "$.data.error_id" }
          assert:
            - "${season_fk_err} == ERR_SEASON_NOT_FOUND with HTTP 404"
            - "${school_fk_err} == ERR_HOST_SCHOOL_NOT_FOUND with HTTP 404"
            - "${prev_stop_fk_err} == ERR_TOUR_STOP_NOT_FOUND with HTTP 404 (the self-referential FK reports its own type)"
            - "${volunteer_fk_err} == ERR_VOLUNTEER_NOT_FOUND with HTTP 404"
            - "no child row is created by any of the four calls"

      - name: site_booking_school_must_match_its_agreement_school
        claim_type: flat_topology_fk_integrity
        grounds:
          - validations.priority_27_ERR_AGREEMENT_SCHOOL_MISMATCH
          - validations.priority_26_ERR_SEASON_MISMATCH
          - complexity_profile.entity_topology_flat
        distinguishing_aspect: "In a flat topology the child carries several independent FKs and their mutual coherence must be checked, not just their existence: a SiteBooking whose host_school_id resolves but is not the agreement's school is ERR_AGREEMENT_SCHOOL_MISMATCH, and a stop from another season is ERR_SEASON_MISMATCH."
        test_recipe:
          setup:
            - "Two seasons exist. Season 1 has host schools A and B, a SIGNED TOUR_REHEARSAL agreement at school A covering 2027-06-18 to 2027-06-25, and a PLANNED stop; season 2 has its own PLANNED stop."
          setup_api_calls:
            - call: "POST /seasons"
