              payload: { store_id: "${store_id}", inspector_name: "Inspector Vale", citations: [ { citation_code: "608-LEAK-REC", severity: "MINOR", violation_days: 1 } ] }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { insp_id: $.data.id, insp_penalty: $.data.penalty_exposure_usd }
            - call: "POST /inspections/${insp_id}/response"
              payload: { response_summary: "All leak records reconciled and refiled.", corrective_action_code: "RECORDS_CORRECTED" }
              as: ComplianceManager
              captures: { insp_status_mid: $.data.status }
          trigger:
            - call: "POST /inspections/${insp_id}/closure"
              payload: { closure_note: "Corrective action accepted; matter closed." }
              as: Regulator
              as_user_id: "regulator-2"
              captures: { insp_status_final: $.data.status, insp_closed_at: $.data.closed_at }
            - call: "POST /systems"
