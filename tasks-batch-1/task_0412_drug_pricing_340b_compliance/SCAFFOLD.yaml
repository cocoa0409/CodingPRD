scenario: "340B Drug Pricing & Compliance (HRSA): covered-entity registration & child sites, eligible-patient determination, split-billing & accumulator, contract-pharmacy dispensing, duplicate-discount/Medicaid carve-out, GPO prohibition, audit & self-disclosure, ceiling-price reconciliation"
domain_name: drug-pricing-340b-compliance
api_prefix: /340b

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: hybrid
  # CoveredEntity is the registration root; ChildSite, ContractPharmacyArrangement,
  # PurchaseOrder, Accumulator hang off it. PrescriptionDispense is a flat fact that
  # references CoveredEntity, ChildSite, ContractPharmacyArrangement, DrugProduct, Patient,
  # Prescriber by FK — cross-aggregate. DrugProduct + CeilingPriceRecord are configuration
  # peers. AuditFinding + RepaymentObligation are compliance peers referencing dispenses.
  state_machine_shape: branching
  # CoveredEntity: branching registration (PENDING -> {ACTIVE, DENIED}) + recertification cycle.
  # PrescriptionDispense: parallel dimensions (classification_status x dispense_status) +
  #   classification branch (340B vs WAC) with divergent side-effect sets + reversal cycle.
  # AuditFinding: cyclic (UNDER_REVIEW -> DISPUTED -> UNDER_REVIEW revision loop).
  relationship_patterns:
    - one_to_many          # CoveredEntity -> ChildSite, ContractPharmacyArrangement, PurchaseOrder
    - cross_aggregate      # PrescriptionDispense references 6 parents; AuditFinding -> PrescriptionDispense
    - polymorphic          # RepaymentObligation.source_ref_id references an AuditFinding OR a CeilingPriceRecord
  role_model: segregation_of_duties
  # ComplianceOfficer self-discloses but cannot resolve the audit that contains the disclosure;
  # HrsaAuditor resolves audits but cannot dispense or self-disclose. PharmacyOperator dispenses.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# ============================================================================
entities:
  - name: CoveredEntity
    parent: null
    common_fields: true
    fields:
      - name: hrsa_id
        type: string
        source: input
        description: "HRSA-assigned grant/registration identifier, e.g. DSH010000"
        constraints: "unique across all CoveredEntity; non-empty"
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the covered entity"
      - name: entity_type
        type: enum
        source: input
        description: "340B eligibility category; drives GPO-prohibition default"
        constraints: "one of {DSH, CHILDRENS_HOSPITAL, FREESTANDING_CANCER, CRITICAL_ACCESS, RURAL_REFERRAL, FQHC, RYAN_WHITE, STD_CLINIC}"
      - name: gpo_prohibited
        type: boolean
        source: computed
        description: "True when entity_type in {DSH, CHILDRENS_HOSPITAL, FREESTANDING_CANCER}; these hospital types may not purchase covered outpatient drugs through a GPO. Computed at create from entity_type and never overwritten by input."
      - name: medicaid_billing_mode
        type: enum
        source: input
        description: "Carve-in (bills Medicaid FFS using 340B drugs, must appear on Medicaid Exclusion File) or carve-out (does not use 340B for Medicaid FFS)"
        default: CARVE_OUT
        constraints: "one of {CARVE_IN, CARVE_OUT}"
      - name: medicaid_provider_number
        type: string
        source: input
        description: "Medicaid billing NPI/provider number listed on the Medicaid Exclusion File; required only when medicaid_billing_mode == CARVE_IN"
        default: null
      - name: registration_status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 CoveredEntity state machine"
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, RECERT_DUE, DENIED, TERMINATED}"
      - name: recert_period_index
        type: integer
        source: system
        description: "Number of completed recertification cycles; starts at 0, increments on each recertify"
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived gate: GOOD when no OPEN/UNDER_REVIEW/DISPUTED AuditFinding and no UNPAID RepaymentObligation references this CE; FLAGGED otherwise. Recomputed on every audit/repayment side effect."
        default: GOOD
        constraints: "one of {GOOD, FLAGGED}"
      - name: open_repayment_cents
        type: integer
        source: computed
        description: "Sum of remaining_balance_cents over RepaymentObligation rows referencing this CE whose status in {OWED, PARTIALLY_PAID}; recomputed on every repayment mutation"
        default: 0

  - name: ChildSite
    parent: CoveredEntity
    common_fields: true
    fields:
      - name: covered_entity_id
        type: string
        source: input
        description: "FK -> CoveredEntity.id; the parent covered entity this child site registers under"
      - name: site_name
        type: string
        source: input
        description: "Name of the child/associated site"
      - name: service_address
        type: string
        source: input
        description: "Physical service address of the child site"
      - name: registered
        type: boolean
        source: system
        description: "True once the child site is listed on the 340B OPAIS database; only registered child sites confer 340B eligibility on dispenses"
        default: false

  - name: Prescriber
    parent: null
    common_fields: false
    fields:
      - name: covered_entity_id
        type: string
        source: input
        description: "FK -> CoveredEntity.id; the covered entity that employs or contracts this prescriber"
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier of the prescriber"
        constraints: "unique across all Prescriber"
      - name: full_name
        type: string
        source: input
        description: "Prescriber full name"
      - name: relationship_type
        type: enum
        source: input
        description: "Employment relationship between prescriber and CE; drives eligible-patient determination"
        constraints: "one of {EMPLOYED, CONTRACTED, REFERRAL_ONLY, EXTERNAL}"

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: covered_entity_id
        type: string
        source: input
        description: "FK -> CoveredEntity.id; the covered entity at which the patient has an established care record"
      - name: mrn
        type: string
        source: input
        description: "Medical record number within the covered entity"
      - name: has_ce_care_record
        type: boolean
        source: input
        description: "True when the CE maintains records of the patient's care (HRSA patient-definition prong 1)"
        default: true
      - name: ce_retains_responsibility
        type: boolean
        source: input
        description: "True when the CE retains responsibility for the patient's care (HRSA patient-definition prong 2)"
        default: true
      - name: medicaid_ffs_enrolled
        type: boolean
        source: input
        description: "True when the patient is enrolled in Medicaid fee-for-service (relevant to duplicate-discount / carve-out)"
        default: false

  - name: DrugProduct
    parent: null
    common_fields: true
    fields:
      - name: ndc
        type: string
        source: input
        description: "11-digit National Drug Code"
        constraints: "unique across all DrugProduct; non-empty"
      - name: drug_name
        type: string
        source: input
        description: "Product name"
      - name: package_size_units
        type: integer
        source: input
        description: "Number of dispensable units in one purchasable package (replenishment granularity for the accumulator)"
        constraints: "integer >= 1"
      - name: is_covered_outpatient_drug
        type: boolean
        source: input
        description: "True when the NDC is a covered outpatient drug subject to GPO prohibition for GPO-prohibited entities"
        default: true
      - name: wac_price_per_unit_cents
        type: integer
        source: input
        description: "Wholesale Acquisition Cost per unit in cents; the non-340B (GPO/WAC) acquisition price"
        constraints: "integer >= 0"

  - name: CeilingPriceRecord
    parent: DrugProduct
    common_fields: true
    fields:
      - name: drug_product_id
        type: string
        source: input
        description: "FK -> DrugProduct.id; the NDC this ceiling price applies to"
      - name: quarter
        type: string
        source: input
        description: "Pricing quarter, format YYYYQn e.g. 2026Q2"
        constraints: "matches ^[0-9]{4}Q[1-4]$"
      - name: amp_per_unit_cents
        type: integer
        source: input
        description: "Average Manufacturer Price per unit in cents for the quarter"
        constraints: "integer >= 0"
      - name: ura_per_unit_cents
        type: integer
        source: input
        description: "Unit Rebate Amount per unit in cents for the quarter"
        constraints: "integer >= 0"
      - name: is_published
        type: boolean
        source: input
        description: "True when this is the manufacturer-published final price for the quarter; false marks a provisional estimate"
        default: true
      - name: ceiling_price_per_unit_cents
        type: integer
        source: computed
        description: "Calculated ceiling price per unit; see §1.3 ceiling_price. Penny-priced to 1 cent when URA >= AMP."
      - name: pricing_variant
        type: enum
        source: computed
        description: "STANDARD when ceiling = AMP - URA; PENNY when URA >= AMP forced the 1-cent floor"
        constraints: "one of {STANDARD, PENNY}"

  - name: ContractPharmacyArrangement
    parent: CoveredEntity
    common_fields: true
    fields:
      - name: covered_entity_id
        type: string
        source: input
        description: "FK -> CoveredEntity.id; the covered entity contracting the pharmacy"
      - name: pharmacy_name
        type: string
        source: input
        description: "Name of the external contract pharmacy"
      - name: ship_to_bill_to_npi
        type: string
        source: input
        description: "Ship-to / bill-to NPI under which 340B drugs are replenished to the contract pharmacy"
      - name: effective_start
        type: string
        source: input
        description: "Inclusive start date (YYYY-MM-DD) of the arrangement's effective window"
        constraints: "matches ^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      - name: effective_end
        type: string
        source: input
        description: "Exclusive end date (YYYY-MM-DD) of the arrangement's effective window; half-open interval [effective_start, effective_end)"
        constraints: "matches ^[0-9]{4}-[0-9]{2}-[0-9]{2}$; effective_end > effective_start"
      - name: arrangement_status
        type: enum
        source: system
        description: "Lifecycle of the contract-pharmacy arrangement"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}"

  - name: Accumulator
    parent: CoveredEntity
    common_fields: true
    fields:
      - name: covered_entity_id
        type: string
        source: input
        description: "FK -> CoveredEntity.id; the covered entity that owns this split-billing accumulator"
      - name: drug_product_id
        type: string
        source: input
        description: "FK -> DrugProduct.id; the NDC tracked by this accumulator"
      - name: accrued_units
        type: integer
        source: computed
        description: "Running count of 340B-classified dispensed units not yet replenished into a whole package; incremented chronologically by each 340B dispense, decremented by replenishment. Always in [0, package_size_units - 1] after each replenish sweep."
        default: 0
      - name: replenished_packages_total
        type: integer
        source: computed
        description: "Cumulative whole packages replenished at the 340B price across the accumulator's life"
        default: 0
      - name: last_replenish_dispense_id
        type: string
        source: system
        description: "id of the most recent PrescriptionDispense whose classification triggered a replenishment sweep; null before the first replenishment"
        default: null

  - name: PrescriptionDispense
    parent: null
    common_fields: true
    fields:
      - name: covered_entity_id
        type: string
        source: input
        description: "FK -> CoveredEntity.id; the covered entity responsible for the dispense"
      - name: child_site_id
        type: string
        source: input
        description: "FK -> ChildSite.id; the registered child site of service, when the dispense is at a child site rather than the parent site"
        default: null
      - name: contract_pharmacy_id
        type: string
        source: input
        description: "FK -> ContractPharmacyArrangement.id; the contract pharmacy that physically dispensed, when applicable"
        default: null
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient receiving the drug"
      - name: prescriber_id
        type: string
        source: input
        description: "FK -> Prescriber.id; the prescriber who wrote the prescription"
      - name: drug_product_id
        type: string
        source: input
        description: "FK -> DrugProduct.id; the NDC dispensed"
      - name: quantity_units
        type: integer
        source: input
        description: "Number of units dispensed"
        constraints: "integer >= 1"
      - name: quarter
        type: string
        source: input
        description: "Pricing quarter the dispense falls in, format YYYYQn"
        constraints: "matches ^[0-9]{4}Q[1-4]$"
      - name: dispense_status
        type: enum
        source: system
        description: "Lifecycle dimension; see §1.2"
        default: DISPENSED
        constraints: "one of {DISPENSED, REVERSED, DISCLOSED}"
      - name: classification_status
        type: enum
        source: system
        description: "Parallel classification dimension; see §1.2. Set by the eligibility determination at creation."
        constraints: "one of {CLASSIFIED_340B, CLASSIFIED_WAC}"
      - name: eligibility_reason
        type: enum
        source: computed
        description: "Why the dispense was classified the way it was; see §1.3 eligibility_determination"
        constraints: "one of {ELIGIBLE_340B, INELIGIBLE_NO_RELATIONSHIP, INELIGIBLE_NO_RESPONSIBILITY, INELIGIBLE_PRESCRIBER, INELIGIBLE_UNREGISTERED_SITE, CARVED_OUT_MEDICAID}"
      - name: applied_price_per_unit_cents
        type: integer
        source: computed
        description: "Per-unit acquisition price applied: ceiling_price_per_unit_cents of the published CeilingPriceRecord for (NDC, quarter) when CLASSIFIED_340B, else DrugProduct.wac_price_per_unit_cents"
      - name: line_cost_cents
        type: integer
        source: computed
        description: "applied_price_per_unit_cents * quantity_units; see §1.3 dispense_line_cost"

  - name: MedicaidClaim
    parent: PrescriptionDispense
    common_fields: true
    fields:
      - name: prescription_dispense_id
        type: string
        source: input
        description: "FK -> PrescriptionDispense.id; the dispense billed to Medicaid"
      - name: medicaid_state_code
        type: string
        source: input
        description: "Two-letter state code of the Medicaid program billed"
        constraints: "two uppercase letters"
      - name: claim_status
        type: enum
        source: system
        description: "DUPLICATE_RISK when the underlying dispense is CLASSIFIED_340B for a carve-in CE that did not list on the MEF (rebate would duplicate the discount); CLEAN otherwise"
        default: CLEAN
        constraints: "one of {CLEAN, DUPLICATE_RISK, VOIDED}"

  - name: AuditFinding
    parent: CoveredEntity
    common_fields: true
    fields:
      - name: covered_entity_id
        type: string
        source: input
        description: "FK -> CoveredEntity.id; the covered entity under audit"
      - name: prescription_dispense_id
        type: string
        source: input
        description: "FK -> PrescriptionDispense.id; the specific dispense the finding concerns"
      - name: finding_type
        type: enum
        source: input
        description: "Category of the compliance finding"
        constraints: "one of {DIVERSION, DUPLICATE_DISCOUNT, GPO_VIOLATION, INELIGIBLE_PATIENT}"
      - name: origin
        type: enum
        source: input
        description: "SELF_DISCLOSURE when raised by the covered entity's compliance officer; HRSA_AUDIT when raised by an auditor"
        constraints: "one of {SELF_DISCLOSURE, HRSA_AUDIT}"
      - name: finding_status
        type: enum
        source: system
        description: "Lifecycle; see §1.2 AuditFinding state machine"
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, DISPUTED, RESOLVED, DISMISSED}"
      - name: assessed_units
        type: integer
        source: input
        description: "Units of the dispense the finding assesses as non-compliant (<= dispense quantity)"
        constraints: "integer >= 1"

  - name: RepaymentObligation
    parent: CoveredEntity
    common_fields: true
    fields:
      - name: covered_entity_id
        type: string
        source: input
        description: "FK -> CoveredEntity.id; the covered entity that owes the remittance"
      - name: source_kind
        type: enum
        source: input
        description: "Which entity type the obligation derives from (polymorphic source)"
        constraints: "one of {AUDIT_FINDING, CEILING_RECONCILIATION}"
      - name: source_ref_id
        type: string
        source: input
        description: "FK -> AuditFinding.id when source_kind == AUDIT_FINDING; FK -> CeilingPriceRecord.id when source_kind == CEILING_RECONCILIATION (polymorphic reference resolved by source_kind)"
      - name: assessed_cents
        type: integer
        source: computed
        description: "Total remittance owed; see §1.3 repayment_assessment (diversion vs overcharge variants)"
      - name: paid_cents
        type: integer
        source: system
        description: "Cumulative amount remitted so far"
        default: 0
      - name: remaining_balance_cents
        type: integer
        source: computed
        description: "assessed_cents - paid_cents; never negative"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; see §1.2 RepaymentObligation state machine"
        default: OWED
        constraints: "one of {OWED, PARTIALLY_PAID, SETTLED, WAIVED}"

  - name: PurchaseOrder
    parent: CoveredEntity
    common_fields: true
    fields:
      - name: covered_entity_id
        type: string
        source: input
        description: "FK -> CoveredEntity.id; the covered entity placing the order"
      - name: drug_product_id
        type: string
        source: input
        description: "FK -> DrugProduct.id; the NDC ordered"
      - name: accumulator_id
        type: string
        source: input
        description: "FK -> Accumulator.id; the accumulator whose replenishment generated this PO; null for direct (non-replenishment) purchases"
        default: null
      - name: channel
        type: enum
        source: input
        description: "Procurement channel: GPO, WAC (direct wholesaler), or B340B (340B replenishment price)"
        constraints: "one of {GPO, WAC, B340B}"
      - name: packages_ordered
        type: integer
        source: input
        description: "Number of whole packages ordered"
        constraints: "integer >= 1"
      - name: quarter
        type: string
        source: input
        description: "Pricing quarter of the purchase, format YYYYQn"
        constraints: "matches ^[0-9]{4}Q[1-4]$"
      - name: unit_price_paid_cents
        type: integer
        source: input
        description: "Per-unit price actually paid on this PO in cents (used for ceiling-price reconciliation overcharge detection)"
        constraints: "integer >= 0"

# ============================================================================
# §1.2 STATE MACHINE TABLE
# ============================================================================
state_machines:
  - entity: CoveredEntity
    initial_state: PENDING
    terminal_states: [DENIED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /covered-entities/{id}/approve"
        actor: HrsaAuditor
        preconditions:
          - "registration_status == PENDING"
          - "if medicaid_billing_mode == CARVE_IN then medicaid_provider_number is non-null"
        side_effects:
          - "set registration_status = ACTIVE"
          - "recompute compliance_posture (GOOD on a fresh CE)"
        note: "Branch point: approve vs deny from PENDING."
      - from: PENDING
        to: DENIED
        trigger: "POST /covered-entities/{id}/deny"
        actor: HrsaAuditor
        preconditions:
          - "registration_status == PENDING"
        side_effects:
          - "set registration_status = DENIED"
      - from: ACTIVE
        to: RECERT_DUE
        trigger: "POST /covered-entities/{id}/flag-recert"
        actor: HrsaAuditor
        preconditions:
          - "registration_status == ACTIVE"
        side_effects:
          - "set registration_status = RECERT_DUE"
      - from: RECERT_DUE
        to: ACTIVE
        trigger: "POST /covered-entities/{id}/recertify"
        actor: ComplianceOfficer
        preconditions:
          - "registration_status == RECERT_DUE"
          - "compliance_posture == GOOD (no open findings, no outstanding repayment)"
        side_effects:
          - "set registration_status = ACTIVE"
          - "increment recert_period_index by 1"
        note: "Cycle: ACTIVE -> RECERT_DUE -> ACTIVE; recertification is blocked while compliance_posture == FLAGGED (cross-entity gate on AuditFinding/RepaymentObligation)."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /covered-entities/{id}/terminate"
        actor: HrsaAuditor
        preconditions:
          - "registration_status == ACTIVE"
        side_effects:
          - "set registration_status = TERMINATED"
          - "cascade: every ContractPharmacyArrangement of this CE with arrangement_status == ACTIVE -> TERMINATED"
      - from: RECERT_DUE
        to: TERMINATED
        trigger: "POST /covered-entities/{id}/terminate"
        actor: HrsaAuditor
        preconditions:
          - "registration_status == RECERT_DUE"
        side_effects:
          - "set registration_status = TERMINATED"
          - "cascade: every ContractPharmacyArrangement of this CE with arrangement_status == ACTIVE -> TERMINATED"

  - entity: PrescriptionDispense
    initial_state: DISPENSED
    terminal_states: [DISCLOSED]
    transitions:
      - from: DISPENSED
        to: DISPENSED
        trigger: "POST /dispenses (creation)"
        actor: PharmacyOperator
        preconditions:
          - "covered_entity.registration_status == ACTIVE"
          - "if contract_pharmacy_id present then that ContractPharmacyArrangement.arrangement_status == ACTIVE and belongs to covered_entity_id"
          - "if child_site_id present then that ChildSite.covered_entity_id == covered_entity_id"
          - "a published CeilingPriceRecord exists for (drug_product_id, quarter) when the dispense classifies CLASSIFIED_340B"
        side_effects:
          - "run §1.3 eligibility_determination -> set classification_status and eligibility_reason"
          - "run §1.3 dispense_line_cost -> set applied_price_per_unit_cents and line_cost_cents"
          - "if classification_status == CLASSIFIED_340B: cascade into the (covered_entity_id, drug_product_id) Accumulator -> accrued_units += quantity_units, then run §1.3 accumulator_replenishment which may itself create a B340B PurchaseOrder and bump replenished_packages_total"
        note: "Initial classification (340B vs WAC) is a branch with divergent side-effect sets: only the 340B branch touches the Accumulator."
      - from: DISPENSED
        to: REVERSED
        trigger: "POST /dispenses/{id}/reverse"
        actor: PharmacyOperator
        preconditions:
          - "dispense_status == DISPENSED"
          - "no AuditFinding referencing this dispense has finding_status in {UNDER_REVIEW, DISPUTED, RESOLVED}"
        side_effects:
          - "set dispense_status = REVERSED"
          - "compensation: if classification_status == CLASSIFIED_340B, debit the Accumulator -> accrued_units -= quantity_units (the accumulator invariant: total 340B units accrued minus replenished*package_size equals accrued_units, preserved across reverse)"
        note: "Reversal cycle DISPENSED -> REVERSED; a reversed dispense may be re-classified is NOT allowed (REVERSED has no outward transitions except DISCLOSED via disclosure of an already-reversed line)."
      - from: REVERSED
        to: DISPENSED
        trigger: "POST /dispenses/{id}/reinstate"
        actor: PharmacyOperator
        preconditions:
          - "dispense_status == REVERSED"
          - "covered_entity.registration_status == ACTIVE"
        side_effects:
          - "set dispense_status = DISPENSED"
          - "compensation reversal: if classification_status == CLASSIFIED_340B, re-credit the Accumulator -> accrued_units += quantity_units, then re-run §1.3 accumulator_replenishment"
        note: "Cycle: DISPENSED <-> REVERSED via reverse/reinstate; the accumulator conserved quantity must net to zero across a reverse+reinstate pair."
      - from: DISPENSED
        to: DISCLOSED
        trigger: "POST /covered-entities/{ceId}/self-disclosures (creation, when the disclosure targets this dispense)"
        actor: ComplianceOfficer
        preconditions:
          - "dispense_status == DISPENSED"
          - "an AuditFinding with origin == SELF_DISCLOSURE was created for this dispense in the same request"
        side_effects:
          - "set dispense_status = DISCLOSED"
        note: "DISCLOSED is terminal; a disclosed dispense cannot be reversed or reinstated."

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /audit-findings/{id}/start-review"
        actor: HrsaAuditor
        preconditions:
          - "finding_status == OPEN"
        side_effects:
          - "set finding_status = UNDER_REVIEW"
          - "recompute covered_entity.compliance_posture (remains FLAGGED while UNDER_REVIEW)"
      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: "POST /audit-findings/{id}/dispute"
        actor: ComplianceOfficer
        preconditions:
          - "finding_status == UNDER_REVIEW"
          - "actor (ComplianceOfficer) X-User-ID != the X-User-ID that created the finding when origin == SELF_DISCLOSURE (segregation of duties: a self-disclosed finding may not be disputed by its discloser)"
        side_effects:
          - "set finding_status = DISPUTED"
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "POST /audit-findings/{id}/start-review"
        actor: HrsaAuditor
        preconditions:
          - "finding_status == DISPUTED"
        side_effects:
          - "set finding_status = UNDER_REVIEW"
        note: "Revision loop UNDER_REVIEW -> DISPUTED -> UNDER_REVIEW; the cycle has no fixed bound but each dispute requires a prior review."
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /audit-findings/{id}/resolve"
        actor: HrsaAuditor
        preconditions:
          - "finding_status == UNDER_REVIEW"
          - "a RepaymentObligation with source_kind == AUDIT_FINDING and source_ref_id == this finding exists (resolution requires remittance to be set up)"
        side_effects:
          - "set finding_status = RESOLVED"
          - "set the referenced dispense dispense_status = DISCLOSED if not already terminal"
          - "recompute covered_entity.compliance_posture"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /audit-findings/{id}/dismiss"
        actor: HrsaAuditor
        preconditions:
          - "finding_status == OPEN"
        side_effects:
          - "set finding_status = DISMISSED"
          - "recompute covered_entity.compliance_posture"
      - from: DISPUTED
        to: DISMISSED
        trigger: "POST /audit-findings/{id}/dismiss"
        actor: HrsaAuditor
        preconditions:
          - "finding_status == DISPUTED"
        side_effects:
          - "set finding_status = DISMISSED"
          - "recompute covered_entity.compliance_posture"

  - entity: RepaymentObligation
    initial_state: OWED
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: OWED
        to: PARTIALLY_PAID
        trigger: "POST /repayment-obligations/{id}/remit"
        actor: ComplianceOfficer
        preconditions:
          - "status == OWED"
          - "0 < amount_cents < remaining_balance_cents"
        side_effects:
          - "paid_cents += amount_cents; recompute remaining_balance_cents"
          - "recompute covered_entity.open_repayment_cents and compliance_posture"
      - from: OWED
        to: SETTLED
        trigger: "POST /repayment-obligations/{id}/remit"
        actor: ComplianceOfficer
        preconditions:
          - "status == OWED"
          - "amount_cents == remaining_balance_cents"
        side_effects:
          - "paid_cents += amount_cents; remaining_balance_cents = 0"
          - "recompute covered_entity.open_repayment_cents and compliance_posture (may flip FLAGGED -> GOOD if no other obligations/findings open)"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /repayment-obligations/{id}/remit"
        actor: ComplianceOfficer
        preconditions:
          - "status == PARTIALLY_PAID"
          - "0 < amount_cents < remaining_balance_cents"
        side_effects:
          - "paid_cents += amount_cents; recompute remaining_balance_cents"
          - "recompute covered_entity.open_repayment_cents"
      - from: PARTIALLY_PAID
        to: SETTLED
        trigger: "POST /repayment-obligations/{id}/remit"
        actor: ComplianceOfficer
        preconditions:
          - "status == PARTIALLY_PAID"
          - "amount_cents == remaining_balance_cents"
        side_effects:
          - "paid_cents += amount_cents; remaining_balance_cents = 0"
          - "recompute covered_entity.open_repayment_cents and compliance_posture"
      - from: OWED
        to: WAIVED
        trigger: "POST /repayment-obligations/{id}/waive"
        actor: HrsaAuditor
        preconditions:
          - "status == OWED"
        side_effects:
          - "set status = WAIVED; remaining_balance_cents = 0"
          - "recompute covered_entity.open_repayment_cents and compliance_posture"

  - entity: ContractPharmacyArrangement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contract-pharmacies/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "arrangement_status == ACTIVE"
        side_effects:
          - "set arrangement_status = SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contract-pharmacies/{id}/reactivate"
        actor: ComplianceOfficer
        preconditions:
          - "arrangement_status == SUSPENDED"
          - "covered_entity.registration_status == ACTIVE"
        side_effects:
          - "set arrangement_status = ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contract-pharmacies/{id}/terminate OR cascade from CoveredEntity termination"
        actor: ComplianceOfficer
        preconditions:
          - "arrangement_status == ACTIVE"
        side_effects:
          - "set arrangement_status = TERMINATED"

# ============================================================================
# §1.2.1 CONCURRENCY RULES
# ============================================================================
concurrency_rules:
  - rule_id: accumulator-replenish-stale
    parent_entity: Accumulator
    write_endpoint: "POST /accumulators/{id}/replenish"
    occ_field: "expected_accumulator_version"
    description: |
      Manually finalising a replenishment sweep against an Accumulator whose
      version has advanced since the client last observed it is rejected. This
      captures the case where a 340B dispense (or an automatic replenishment it
      triggered) has already advanced accrued_units and the accumulator version
      between the client's read and this manual replenish call, so the client's
      view of the package count is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ceiling-reconcile-stale
    parent_entity: DrugProduct
    write_endpoint: "POST /drug-products/{id}/reconcile"
    occ_field: "expected_drug_product_version"
    description: |
      Running a ceiling-price reconciliation against a DrugProduct whose version
      has advanced since the client last observed it is rejected. A new published
      CeilingPriceRecord (which legitimately supersedes the prior quarter price
      and bumps the parent DrugProduct version) may have landed between the
      client's read and this reconcile call, making the overcharge basis the
      client computed against stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# §1.3 CALCULATION RULES TABLE
# ============================================================================
calculations:
  - name: ceiling_price
    trigger: "On CeilingPriceRecord creation (POST /drug-products/{id}/ceiling-prices) and recomputed if its source fields change"
    algorithm: threshold
    formula: |
      # all amounts in integer cents per unit
      if ura_per_unit_cents >= amp_per_unit_cents:
          ceiling_price_per_unit_cents = 1      # penny pricing: 1 cent floor
          pricing_variant = "PENNY"
      else:
          ceiling_price_per_unit_cents = amp_per_unit_cents - ura_per_unit_cents
          pricing_variant = "STANDARD"
    input_set: "the single CeilingPriceRecord being created; amp/ura are its own fields"
    constants:
      PENNY_PRICE_CENTS: 1
    precision: "integer cents; no rounding needed (inputs are integer cents)"
    variants:
      - name: standard
        when: "ura_per_unit_cents < amp_per_unit_cents"
        difference: "ceiling = amp - ura; pricing_variant = STANDARD"
      - name: penny
        when: "ura_per_unit_cents >= amp_per_unit_cents (rebate meets or exceeds AMP)"
        difference: "ceiling forced to PENNY_PRICE_CENTS = 1 cent; pricing_variant = PENNY. Boundary is inclusive: ura == amp yields PENNY, not 0."

  - name: published_vs_provisional_ceiling
    trigger: "When a dispense classifies CLASSIFIED_340B and needs applied_price_per_unit_cents, OR GET /drug-products/{id}/ceiling-prices/effective"
    algorithm: forward_looking
    formula: |
      # Select the ceiling price to apply for (drug_product_id, quarter).
      candidates = CeilingPriceRecord WHERE drug_product_id == X AND quarter == Q
      published  = [c for c in candidates if c.is_published == true]
      if published is non-empty:
          # FINAL variant: use the published record (tie-break created_at ASC -> earliest published wins is wrong;
          # use latest published by created_at DESC, tie-break id excluded -> created_at ASC fallback)
          effective = max(published, key = created_at)        # most recent published
          variant = "FINAL"
      elif candidates non-empty:
          provisional = [c for c in candidates if c.is_published == false]
          effective = max(provisional, key = created_at)      # most recent provisional estimate
          variant = "PROVISIONAL"
      else:
          effective = none -> dispense cannot classify 340B (precondition fails)
    input_set: "all CeilingPriceRecord rows for (drug_product_id, quarter); published filtered first, provisional fallback"
    constants: {}
    precision: "integer cents"
    variants:
      - name: final
        when: "at least one published CeilingPriceRecord exists for (NDC, quarter)"
        difference: "uses published ceiling; a later provisional estimate never overrides a published price"
      - name: provisional
        when: "no published record exists but a provisional estimate does"
        difference: "uses the most recent provisional estimate by created_at; a dispense priced provisionally is re-reconcilable when the published price later lands (see overcharge_reconciliation)"

  - name: eligibility_determination
    trigger: "On PrescriptionDispense creation (POST /dispenses); sets classification_status and eligibility_reason"
    algorithm: constraint_propagation
    formula: |
      # Evaluated in this fixed order; first failing prong determines eligibility_reason.
      # 1. Relationship prong
      if patient.has_ce_care_record == false:
          classification_status = CLASSIFIED_WAC; eligibility_reason = INELIGIBLE_NO_RELATIONSHIP
      # 2. Responsibility prong
      elif patient.ce_retains_responsibility == false:
          classification_status = CLASSIFIED_WAC; eligibility_reason = INELIGIBLE_NO_RESPONSIBILITY
      # 3. Prescriber prong
      elif prescriber.relationship_type not in {EMPLOYED, CONTRACTED}:
          classification_status = CLASSIFIED_WAC; eligibility_reason = INELIGIBLE_PRESCRIBER
      # 4. Site prong (only when dispense is at a child site)
      elif child_site_id is not null and child_site.registered == false:
          classification_status = CLASSIFIED_WAC; eligibility_reason = INELIGIBLE_UNREGISTERED_SITE
      # 5. Medicaid carve-out duplicate-discount guard
      elif patient.medicaid_ffs_enrolled == true and covered_entity.medicaid_billing_mode == CARVE_OUT:
          classification_status = CLASSIFIED_WAC; eligibility_reason = CARVED_OUT_MEDICAID
      else:
          classification_status = CLASSIFIED_340B; eligibility_reason = ELIGIBLE_340B
    input_set: "the dispense's Patient, Prescriber, ChildSite (if any), and CoveredEntity"
    constants:
      ELIGIBLE_PRESCRIBER_TYPES: [EMPLOYED, CONTRACTED]
    precision: "n/a (categorical)"

  - name: dispense_line_cost
    trigger: "On PrescriptionDispense creation, after eligibility_determination"
    algorithm: aggregation
    formula: |
      if classification_status == CLASSIFIED_340B:
          applied_price_per_unit_cents = effective_ceiling_price_per_unit_cents   # from published_vs_provisional_ceiling
      else:
          applied_price_per_unit_cents = drug_product.wac_price_per_unit_cents
      line_cost_cents = applied_price_per_unit_cents * quantity_units
    input_set: "the dispense, its DrugProduct, and the effective CeilingPriceRecord when 340B"
    constants: {}
    precision: "integer cents; product of two integers, exact"

  - name: accumulator_replenishment
    trigger: "Cascaded from a CLASSIFIED_340B dispense creation/reinstate after accrued_units is incremented; also from manual POST /accumulators/{id}/replenish"
    algorithm: chronological
    formula: |
      # Chronological accumulator: dispenses are applied in created_at ASC order
      # (tie-break created_at ASC then by nothing else — ids never decide order).
      # After incrementing accrued_units by the dispense quantity:
      package_size = drug_product.package_size_units
      if accrued_units >= package_size:                # boundary inclusive: exactly package_size triggers
          packages = accrued_units // package_size     # integer floor division
          accrued_units = accrued_units - packages * package_size   # remainder kept in [0, package_size-1]
          replenished_packages_total += packages
          last_replenish_dispense_id = triggering_dispense.id
          # cascade: create a PurchaseOrder(channel=B340B, packages_ordered=packages,
          #          accumulator_id=this, unit_price_paid_cents = effective ceiling price per unit)
    input_set: "the (covered_entity_id, drug_product_id) Accumulator and the package_size_units of its DrugProduct"
    constants: {}
    precision: "integer units; floor division"
    variants:
      - name: virtual_inventory_unit_based
        when: "GET /accumulators/{id} summary read"
        difference: "reports accrued_units as a running unit balance without crystallising a package; no PurchaseOrder is created — read-only projection"
      - name: actual_replenishment_package_based
        when: "a 340B dispense pushes accrued_units to >= package_size, or a manual replenish runs"
        difference: "crystallises floor(accrued_units / package_size) whole packages, decrements accrued_units by packages*package_size, and creates a B340B PurchaseOrder; the unit-based virtual read and the package-based actual replenishment diverge until the next package boundary is crossed"

  - name: overcharge_reconciliation
    trigger: "POST /drug-products/{id}/reconcile (manual, OCC-guarded) — reconciles purchase prices paid against the published ceiling price"
    algorithm: aggregation
    formula: |
      # For the target DrugProduct and a target quarter Q:
      ceiling = effective published ceiling_price_per_unit_cents for (drug_product_id, Q)   # FINAL only; provisional cannot reconcile
      pos = PurchaseOrder WHERE drug_product_id == X AND quarter == Q AND channel == B340B
            ordered by created_at ASC                              # chronological, ids never order
      total_overcharge_cents = 0
      for po in pos:
          units = po.packages_ordered * drug_product.package_size_units
          per_unit_over = max(0, po.unit_price_paid_cents - ceiling)     # floor at 0 per PO; undercharges do not net against overcharges
          po_overcharge = per_unit_over * units                          # exact integer-cent product, computed PER PO
          total_overcharge_cents += po_overcharge                        # ROUND-PER-PO-THEN-SUM order is pinned: each PO floored at 0 before summing
      # total_overcharge_cents is the assessed_cents of a CEILING_RECONCILIATION RepaymentObligation (created as a side effect when > 0)
    input_set: "all B340B PurchaseOrders for (drug_product_id, quarter); the published ceiling for that quarter"
    constants: {}
    precision: "integer cents; per-PO floor at 0 BEFORE summation (sum-of-floored, not floor-of-sum) — pinned order"
    variants:
      - name: per_po_floored
        when: "default reconciliation"
        difference: "each PO's overcharge is floored at 0 (undercharges contribute 0), THEN summed; a PO bought below ceiling never offsets a PO bought above ceiling"

  - name: repayment_assessment
    trigger: "On RepaymentObligation creation (POST /covered-entities/{ceId}/self-disclosures, POST /audit-findings/{id}/repayments, or cascaded from reconcile)"
    algorithm: aggregation
    formula: |
      if source_kind == AUDIT_FINDING:
          # Diversion / ineligible / duplicate-discount remittance: the discount the CE
          # wrongly captured = (WAC price - 340B ceiling) per unit * assessed_units,
          # floored at 0 (if 340B price exceeded WAC, no discount was captured -> 0).
          finding = AuditFinding(source_ref_id)
          dispense = PrescriptionDispense(finding.prescription_dispense_id)
          ceiling = effective published ceiling_price_per_unit_cents for (dispense.drug_product_id, dispense.quarter)
          wac = drug_product.wac_price_per_unit_cents
          per_unit_benefit = max(0, wac - ceiling)
          assessed_cents = per_unit_benefit * finding.assessed_units
      else:  # CEILING_RECONCILIATION
          assessed_cents = total_overcharge_cents from overcharge_reconciliation
      remaining_balance_cents = assessed_cents - paid_cents   # paid_cents starts at 0
    input_set: "the source AuditFinding + its dispense + DrugProduct + published ceiling (AUDIT_FINDING variant), or the reconcile output (CEILING_RECONCILIATION variant)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: diversion_benefit_clawback
        when: "source_kind == AUDIT_FINDING"
        difference: "assessed = max(0, wac - ceiling) * assessed_units; the CE repays the discount it should not have received"
      - name: overcharge_refund
        when: "source_kind == CEILING_RECONCILIATION"
        difference: "assessed = manufacturer overcharge total from overcharge_reconciliation; the manufacturer owes the CE, modelled as a remittance obligation against the manufacturer reconciled at the CE level"

# ============================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right; for FK body fields, the referenced parent exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: business_constraint
    check: "Request body has all required fields with correct types; enum values are members of the declared set; integer fields satisfy their >= bound"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 5
    category: business_referential
    check: "On dispense create: child_site (if present) belongs to covered_entity_id; contract_pharmacy (if present) belongs to covered_entity_id; prescriber and patient belong to covered_entity_id"
    error_id: ERR_CROSS_ENTITY_MISMATCH
    http_status: 409
    applies_to: "POST /dispenses"
  - priority: 6
    category: business_constraint
    check: "On CoveredEntity create: medicaid_billing_mode == CARVE_IN requires a non-null medicaid_provider_number (Medicaid Exclusion File listing)"
    error_id: ERR_MEF_NUMBER_REQUIRED
    http_status: 422
    applies_to: "POST /covered-entities, POST /covered-entities/{id}/approve"
  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is allowed (e.g., dispense reverse requires dispense_status == DISPENSED; recertify requires registration_status == RECERT_DUE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: business_constraint
    check: "On dispense create: covered_entity.registration_status == ACTIVE (only an active CE may dispense)"
    error_id: ERR_CE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /dispenses, POST /dispenses/{id}/reinstate"
  - priority: 9
    category: business_safety
    check: "GPO prohibition: a PurchaseOrder with channel == GPO is rejected when the covered_entity.gpo_prohibited == true AND the drug_product.is_covered_outpatient_drug == true"
    error_id: ERR_GPO_PROHIBITED
    http_status: 409
    applies_to: "POST /purchase-orders"
  - priority: 10
    category: business_safety
    check: "Duplicate-discount guard: a MedicaidClaim cannot be created against a CLASSIFIED_340B dispense when the covered_entity.medicaid_billing_mode == CARVE_OUT (carve-out CEs must bill Medicaid at WAC, not 340B)"
    error_id: ERR_DUPLICATE_DISCOUNT
    http_status: 409
    applies_to: "POST /dispenses/{id}/medicaid-claims"
  - priority: 11
    category: business_referential
    check: "On dispense create with classification 340B: a published-or-provisional CeilingPriceRecord exists for (drug_product_id, quarter); without any ceiling the 340B price is undefined"
    error_id: ERR_NO_CEILING_PRICE
    http_status: 409
    applies_to: "POST /dispenses"
  - priority: 12
    category: business_constraint
    check: "On AuditFinding create: assessed_units <= the referenced dispense.quantity_units"
    error_id: ERR_ASSESSED_UNITS_EXCEED
    http_status: 422
    applies_to: "POST /audit-findings, POST /covered-entities/{id}/self-disclosures"
  - priority: 13
    category: business_safety
    check: "Segregation of duties on dispute: the ComplianceOfficer X-User-ID disputing a SELF_DISCLOSURE finding must differ from the X-User-ID that created it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /audit-findings/{id}/dispute"
  - priority: 14
    category: business_fiscal
    check: "On remit: 0 < amount_cents <= remaining_balance_cents (overpayment beyond the remaining balance is rejected)"
    error_id: ERR_REMIT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /repayment-obligations/{id}/remit"
  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the live parent version on OCC-guarded writes (accumulator replenish, drug-product reconcile)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accumulators/{id}/replenish, POST /drug-products/{id}/reconcile"
  - priority: 16
    category: business_referential
    check: "On reconcile: a published CeilingPriceRecord exists for (drug_product_id, target quarter); a provisional-only quarter cannot be reconciled"
    error_id: ERR_NO_PUBLISHED_CEILING
    http_status: 409
    applies_to: "POST /drug-products/{id}/reconcile"
  - priority: 17
    category: business_temporal
    check: "Contract-pharmacy window overlap: a new ContractPharmacyArrangement under a CE is rejected when an existing arrangement of the same CE with arrangement_status in {ACTIVE, SUSPENDED} shares the same ship_to_bill_to_npi AND its half-open window [effective_start, effective_end) intersects the new [effective_start, effective_end). Adjacency is allowed: existing.effective_end == new.effective_start does NOT collide (half-open semantics)."
    error_id: ERR_CP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /covered-entities/{id}/contract-pharmacies"
  - priority: 18
    category: business_temporal
    check: "Ceiling-quarter collision: a second is_published==true CeilingPriceRecord for the same (drug_product_id, quarter) is rejected — a quarter is a degenerate closed point interval [Q,Q], so two published records collide on exact quarter equality (provisional records never collide, and may coexist with a published one)."
    error_id: ERR_CEILING_QUARTER_OVERLAP
    http_status: 409
    applies_to: "POST /drug-products/{id}/ceiling-prices"

# ============================================================================
# §1.5 API ENDPOINT TABLE
# ============================================================================
endpoints:
  # ---- CoveredEntity ----
  - method: POST
    path: "/340b/covered-entities"
    description: "Register a covered entity (starts PENDING)"
    roles: [ComplianceOfficer]
    code: 201
    input: ["hrsa_id", "legal_name", "entity_type", "medicaid_billing_mode?", "medicaid_provider_number?"]
    output: CoveredEntity
    side_effects: ["compute gpo_prohibited from entity_type", "registration_status = PENDING", "compliance_posture = GOOD"]
  - method: GET
    path: "/340b/covered-entities/{id}"
    description: "Fetch a covered entity"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: []
    output: CoveredEntity
    side_effects: []
  - method: GET
    path: "/340b/covered-entities"
    description: "List covered entities (paginated)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: ["registration_status?", "limit?", "offset?"]
    output: CoveredEntity[]
    side_effects: []
  - method: POST
    path: "/340b/covered-entities/{id}/approve"
    description: "HRSA approves a pending registration"
    roles: [HrsaAuditor]
    code: 200
    input: []
    output: CoveredEntity
    side_effects: ["registration_status PENDING -> ACTIVE"]
  - method: POST
    path: "/340b/covered-entities/{id}/deny"
    description: "HRSA denies a pending registration"
    roles: [HrsaAuditor]
    code: 200
    input: []
    output: CoveredEntity
    side_effects: ["registration_status PENDING -> DENIED"]
  - method: POST
    path: "/340b/covered-entities/{id}/flag-recert"
    description: "HRSA flags an active CE as recertification-due"
    roles: [HrsaAuditor]
    code: 200
    input: []
    output: CoveredEntity
    side_effects: ["registration_status ACTIVE -> RECERT_DUE"]
  - method: POST
    path: "/340b/covered-entities/{id}/recertify"
    description: "CE completes recertification; blocked when compliance_posture FLAGGED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CoveredEntity
    side_effects: ["registration_status RECERT_DUE -> ACTIVE", "recert_period_index += 1"]
  - method: POST
    path: "/340b/covered-entities/{id}/terminate"
    description: "HRSA terminates a CE; cascades termination to active contract pharmacies"
    roles: [HrsaAuditor]
    code: 200
    input: []
    output: CoveredEntity
    side_effects: ["registration_status -> TERMINATED", "cascade ACTIVE ContractPharmacyArrangements -> TERMINATED"]

  # ---- ChildSite ----
  - method: POST
    path: "/340b/covered-entities/{id}/child-sites"
    description: "Register a child site under a CE"
    roles: [ComplianceOfficer]
    code: 201
    input: ["site_name", "service_address", "registered?"]
    output: ChildSite
    side_effects: []
  - method: GET
    path: "/340b/covered-entities/{id}/child-sites"
    description: "List child sites of a CE (FK reverse-reachability for ChildSite.covered_entity_id)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: ["registered?", "limit?", "offset?"]
    output: ChildSite[]
    side_effects: []
  - method: GET
    path: "/340b/child-sites/{id}"
    description: "Fetch a child site"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: []
    output: ChildSite
    side_effects: []

  # ---- Prescriber ----
  - method: POST
    path: "/340b/covered-entities/{id}/prescribers"
    description: "Register a prescriber under a CE"
    roles: [ComplianceOfficer]
    code: 201
    input: [npi, full_name, relationship_type]
    output: Prescriber
    side_effects: []
  - method: GET
    path: "/340b/prescribers"
    description: "List prescribers, filterable by covered_entity_id (FK reverse-reachability for Prescriber.covered_entity_id)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: ["covered_entity_id?", "limit?", "offset?"]
    output: Prescriber[]
    side_effects: []
  - method: GET
    path: "/340b/prescribers/{id}"
    description: "Fetch a prescriber"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: []
    output: Prescriber
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/340b/covered-entities/{id}/patients"
    description: "Register a patient under a CE"
    roles: [ComplianceOfficer, PharmacyOperator]
    code: 201
    input: ["mrn", "has_ce_care_record?", "ce_retains_responsibility?", "medicaid_ffs_enrolled?"]
    output: Patient
    side_effects: []
  - method: GET
    path: "/340b/patients"
    description: "List patients, filterable by covered_entity_id (FK reverse-reachability for Patient.covered_entity_id)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: ["covered_entity_id?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: GET
    path: "/340b/patients/{id}"
    description: "Fetch a patient"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- DrugProduct + CeilingPriceRecord ----
  - method: POST
    path: "/340b/drug-products"
    description: "Create a drug product (NDC config)"
    roles: [ComplianceOfficer, HrsaAuditor]
    code: 201
    input: ["ndc", "drug_name", "package_size_units", "is_covered_outpatient_drug?", "wac_price_per_unit_cents"]
    output: DrugProduct
    side_effects: []
  - method: GET
    path: "/340b/drug-products/{id}"
    description: "Fetch a drug product"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: []
    output: DrugProduct
    side_effects: []
  - method: POST
    path: "/340b/drug-products/{id}/ceiling-prices"
    description: "Add a quarterly ceiling-price record (computes ceiling_price_per_unit_cents and pricing_variant); rejects a second published record for an existing (NDC, quarter)"
    roles: [ComplianceOfficer, HrsaAuditor]
    code: 201
    input: ["quarter", "amp_per_unit_cents", "ura_per_unit_cents", "is_published?"]
    output: CeilingPriceRecord
    side_effects: ["ceiling-quarter collision check (published-vs-published on same quarter)", "compute ceiling_price_per_unit_cents and pricing_variant via §1.3 ceiling_price", "increments DrugProduct.version by 1"]
  - method: GET
    path: "/340b/drug-products/{id}/ceiling-prices"
    description: "List ceiling-price records for a drug product (FK reverse-reachability for CeilingPriceRecord.drug_product_id)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: ["quarter?", "is_published?", "limit?", "offset?"]
    output: CeilingPriceRecord[]
    side_effects: []
  - method: GET
    path: "/340b/drug-products/{id}/ceiling-prices/effective"
    description: "Computed read: the effective ceiling for (drug_product, quarter) with FINAL/PROVISIONAL variant tag"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: [quarter]
    output: CeilingPriceRecord
    side_effects: ["run §1.3 published_vs_provisional_ceiling"]
  - method: POST
    path: "/340b/drug-products/{id}/reconcile"
    description: "OCC-guarded ceiling-price overcharge reconciliation for a quarter; creates a CEILING_RECONCILIATION RepaymentObligation when overcharge > 0"
    roles: [HrsaAuditor]
    code: 201
    input: [quarter, expected_drug_product_version]
    output: RepaymentObligation
    side_effects: ["run §1.3 overcharge_reconciliation", "create RepaymentObligation (source_kind=CEILING_RECONCILIATION) when total_overcharge_cents > 0", "increments DrugProduct.version by 1", "recompute CE open_repayment_cents and compliance_posture"]

  # ---- ContractPharmacyArrangement ----
  - method: POST
    path: "/340b/covered-entities/{id}/contract-pharmacies"
    description: "Create a contract-pharmacy arrangement under a CE; rejects an effective-window overlap against an existing non-terminated arrangement sharing the same ship_to_bill_to_npi"
    roles: [ComplianceOfficer]
    code: 201
    input: [pharmacy_name, ship_to_bill_to_npi, effective_start, effective_end]
    output: ContractPharmacyArrangement
    side_effects: ["overlap check on [effective_start, effective_end) against non-terminated same-NPI arrangements"]
  - method: GET
    path: "/340b/covered-entities/{id}/contract-pharmacies"
    description: "List contract pharmacies of a CE (FK reverse-reachability for ContractPharmacyArrangement.covered_entity_id)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: ["arrangement_status?", "limit?", "offset?"]
    output: ContractPharmacyArrangement[]
    side_effects: []
  - method: GET
    path: "/340b/contract-pharmacies/{id}"
    description: "Fetch a contract-pharmacy arrangement"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: []
    output: ContractPharmacyArrangement
    side_effects: []
  - method: POST
    path: "/340b/contract-pharmacies/{id}/suspend"
    description: "Suspend a contract-pharmacy arrangement"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ContractPharmacyArrangement
    side_effects: ["arrangement_status ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/340b/contract-pharmacies/{id}/reactivate"
    description: "Reactivate a suspended contract-pharmacy arrangement"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ContractPharmacyArrangement
    side_effects: ["arrangement_status SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/340b/contract-pharmacies/{id}/terminate"
    description: "Terminate a contract-pharmacy arrangement"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ContractPharmacyArrangement
    side_effects: ["arrangement_status -> TERMINATED"]

  # ---- Accumulator ----
  - method: POST
    path: "/340b/covered-entities/{id}/accumulators"
    description: "Create a split-billing accumulator for a (CE, NDC) pair"
    roles: [ComplianceOfficer, PharmacyOperator]
    code: 201
    input: [drug_product_id]
    output: Accumulator
    side_effects: ["accrued_units = 0", "replenished_packages_total = 0"]
  - method: GET
    path: "/340b/covered-entities/{id}/accumulators"
    description: "List accumulators of a CE (FK reverse-reachability for Accumulator.covered_entity_id)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: ["drug_product_id?", "limit?", "offset?"]
    output: Accumulator[]
    side_effects: []
  - method: GET
    path: "/340b/accumulators"
    description: "List accumulators, filterable by drug_product_id / covered_entity_id (FK reverse-reachability for Accumulator.drug_product_id)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: ["drug_product_id?", "covered_entity_id?", "limit?", "offset?"]
    output: Accumulator[]
    side_effects: []
  - method: GET
    path: "/340b/accumulators/{id}"
    description: "Fetch an accumulator (virtual unit-based read; no replenishment crystallised)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: []
    output: Accumulator
    side_effects: ["§1.3 accumulator_replenishment virtual_inventory_unit_based variant"]
  - method: POST
    path: "/340b/accumulators/{id}/replenish"
    description: "OCC-guarded manual replenishment sweep; crystallises whole packages and creates a B340B PurchaseOrder when accrued_units >= package_size"
    roles: [PharmacyOperator]
    code: 200
    input: [expected_accumulator_version]
    output: Accumulator
    side_effects: ["§1.3 accumulator_replenishment actual_replenishment_package_based variant", "create B340B PurchaseOrder", "increments Accumulator.version by 1"]

  # ---- PrescriptionDispense ----
  - method: POST
    path: "/340b/dispenses"
    description: "Record a dispense; runs eligibility determination, line cost, and (if 340B) accumulator cascade"
    roles: [PharmacyOperator]
    code: 201
    input: ["covered_entity_id", "child_site_id?", "contract_pharmacy_id?", "patient_id", "prescriber_id", "drug_product_id", "quantity_units", "quarter"]
    output: PrescriptionDispense
    side_effects: ["§1.3 eligibility_determination", "§1.3 dispense_line_cost", "if 340B: Accumulator accrued_units += quantity_units then §1.3 accumulator_replenishment cascade (may create B340B PurchaseOrder, bump Accumulator.version)"]
  - method: GET
    path: "/340b/dispenses/{id}"
    description: "Fetch a dispense"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: []
    output: PrescriptionDispense
    side_effects: []
  - method: GET
    path: "/340b/dispenses"
    description: "List dispenses, filterable by covered_entity_id / patient_id / prescriber_id / drug_product_id / contract_pharmacy_id / child_site_id (FK reverse-reachability for all six dispense FKs)"
    roles: [ComplianceOfficer, HrsaAuditor, PharmacyOperator]
    code: 200
    input: ["covered_entity_id?", "patient_id?", "prescriber_id?", "drug_product_id?", "contract_pharmacy_id?", "child_site_id?", "classification_status?", "dispense_status?", "limit?", "offset?"]
    output: PrescriptionDispense[]
    side_effects: []
  - method: POST
    path: "/340b/dispenses/{id}/reverse"
    description: "Reverse a dispense; compensates the accumulator if 340B"
    roles: [PharmacyOperator]
    code: 200
    input: []
    output: PrescriptionDispense
    side_effects: ["dispense_status DISPENSED -> REVERSED", "if 340B: Accumulator accrued_units -= quantity_units"]
  - method: POST
    path: "/340b/dispenses/{id}/reinstate"
    description: "Reinstate a reversed dispense; re-credits the accumulator if 340B"
    roles: [PharmacyOperator]
    code: 200
    input: []
    output: PrescriptionDispense
    side_effects: ["dispense_status REVERSED -> DISPENSED", "if 340B: Accumulator accrued_units += quantity_units then §1.3 accumulator_replenishment cascade"]

  # ---- MedicaidClaim ----
  - method: POST
    path: "/340b/dispenses/{id}/medicaid-claims"
    description: "Bill a dispense to Medicaid; duplicate-discount guarded"
    roles: [ComplianceOfficer]
    code: 201
    input: [medicaid_state_code]
    output: MedicaidClaim
    side_effects: ["set claim_status (DUPLICATE_RISK when 340B + carve-in CE not MEF-listed, else CLEAN)"]
  - method: GET
    path: "/340b/dispenses/{id}/medicaid-claims"
    description: "List Medicaid claims on a dispense (FK reverse-reachability for MedicaidClaim.prescription_dispense_id)"
    roles: [ComplianceOfficer, HrsaAuditor]
    code: 200
    input: ["claim_status?", "limit?", "offset?"]
    output: MedicaidClaim[]
    side_effects: []

  # ---- AuditFinding ----
  - method: POST
    path: "/340b/audit-findings"
    description: "HRSA auditor raises a finding against a dispense (origin HRSA_AUDIT)"
    roles: [HrsaAuditor]
    code: 201
    input: [covered_entity_id, prescription_dispense_id, finding_type, assessed_units]
    output: AuditFinding
    side_effects: ["origin = HRSA_AUDIT", "finding_status = OPEN", "recompute CE compliance_posture -> FLAGGED"]
  - method: POST
    path: "/340b/covered-entities/{id}/self-disclosures"
    description: "Compliance officer self-discloses a finding against a dispense (origin SELF_DISCLOSURE); marks dispense DISCLOSED"
    roles: [ComplianceOfficer]
    code: 201
    input: [prescription_dispense_id, finding_type, assessed_units]
    output: AuditFinding
    side_effects: ["origin = SELF_DISCLOSURE", "finding_status = OPEN", "dispense_status DISPENSED -> DISCLOSED", "recompute CE compliance_posture -> FLAGGED"]
  - method: GET
    path: "/340b/audit-findings/{id}"
    description: "Fetch an audit finding"
    roles: [ComplianceOfficer, HrsaAuditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []
  - method: GET
    path: "/340b/covered-entities/{id}/audit-findings"
    description: "List audit findings of a CE (FK reverse-reachability for AuditFinding.covered_entity_id)"
    roles: [ComplianceOfficer, HrsaAuditor]
    code: 200
    input: ["finding_status?", "origin?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: GET
    path: "/340b/audit-findings"
    description: "List audit findings, filterable by prescription_dispense_id (FK reverse-reachability for AuditFinding.prescription_dispense_id)"
    roles: [ComplianceOfficer, HrsaAuditor]
    code: 200
    input: ["prescription_dispense_id?", "finding_status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
  - method: POST
    path: "/340b/audit-findings/{id}/start-review"
    description: "Move a finding OPEN->UNDER_REVIEW or DISPUTED->UNDER_REVIEW"
    roles: [HrsaAuditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["finding_status -> UNDER_REVIEW"]
  - method: POST
    path: "/340b/audit-findings/{id}/dispute"
    description: "Compliance officer disputes an UNDER_REVIEW finding (segregation of duties on self-disclosures)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["finding_status UNDER_REVIEW -> DISPUTED"]
  - method: POST
    path: "/340b/audit-findings/{id}/resolve"
    description: "Resolve an UNDER_REVIEW finding (requires a repayment obligation to exist)"
    roles: [HrsaAuditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["finding_status UNDER_REVIEW -> RESOLVED", "referenced dispense -> DISCLOSED if non-terminal", "recompute CE compliance_posture"]
  - method: POST
    path: "/340b/audit-findings/{id}/dismiss"
    description: "Dismiss a finding from OPEN or DISPUTED"
    roles: [HrsaAuditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["finding_status -> DISMISSED", "recompute CE compliance_posture"]
  - method: POST
    path: "/340b/audit-findings/{id}/repayments"
    description: "Create the repayment obligation for a finding (diversion clawback)"
    roles: [HrsaAuditor, ComplianceOfficer]
    code: 201
    input: []
    output: RepaymentObligation
    side_effects: ["source_kind = AUDIT_FINDING", "run §1.3 repayment_assessment diversion variant", "recompute CE open_repayment_cents and compliance_posture"]

  # ---- RepaymentObligation ----
  - method: GET
    path: "/340b/repayment-obligations/{id}"
    description: "Fetch a repayment obligation"
    roles: [ComplianceOfficer, HrsaAuditor]
    code: 200
    input: []
    output: RepaymentObligation
    side_effects: []
  - method: GET
    path: "/340b/covered-entities/{id}/repayment-obligations"
    description: "List repayment obligations of a CE (FK reverse-reachability for RepaymentObligation.covered_entity_id)"
    roles: [ComplianceOfficer, HrsaAuditor]
    code: 200
    input: ["status?", "source_kind?", "limit?", "offset?"]
    output: RepaymentObligation[]
    side_effects: []
  - method: GET
    path: "/340b/repayment-obligations"
    description: "List repayment obligations, filterable by source_ref_id (FK reverse-reachability for RepaymentObligation.source_ref_id)"
    roles: [ComplianceOfficer, HrsaAuditor]
    code: 200
    input: ["source_ref_id?", "source_kind?", "status?", "limit?", "offset?"]
    output: RepaymentObligation[]
    side_effects: []
  - method: POST
    path: "/340b/repayment-obligations/{id}/remit"
    description: "Remit a payment toward an obligation"
    roles: [ComplianceOfficer]
    code: 200
    input: [amount_cents]
    output: RepaymentObligation
    side_effects: ["paid_cents += amount_cents", "status transition per §1.2", "recompute CE open_repayment_cents and compliance_posture"]
  - method: POST
    path: "/340b/repayment-obligations/{id}/waive"
    description: "HRSA waives an obligation"
    roles: [HrsaAuditor]
    code: 200
    input: []
    output: RepaymentObligation
    side_effects: ["status -> WAIVED", "remaining_balance_cents = 0", "recompute CE open_repayment_cents and compliance_posture"]

  # ---- PurchaseOrder ----
  - method: POST
    path: "/340b/purchase-orders"
    description: "Place a drug purchase order; GPO-prohibition guarded"
    roles: [PharmacyOperator, ComplianceOfficer]
    code: 201
    input: ["covered_entity_id", "drug_product_id", "channel", "packages_ordered", "quarter", "unit_price_paid_cents", "accumulator_id?"]
    output: PurchaseOrder
    side_effects: ["reject GPO channel when CE gpo_prohibited and drug is covered outpatient"]
  - method: GET
    path: "/340b/purchase-orders/{id}"
    description: "Fetch a purchase order"
    roles: [PharmacyOperator, ComplianceOfficer, HrsaAuditor]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []
  - method: GET
    path: "/340b/purchase-orders"
    description: "List purchase orders, filterable by covered_entity_id / drug_product_id / accumulator_id (FK reverse-reachability for all three PO FKs)"
    roles: [PharmacyOperator, ComplianceOfficer, HrsaAuditor]
    code: 200
    input: ["covered_entity_id?", "drug_product_id?", "accumulator_id?", "channel?", "quarter?", "limit?", "offset?"]
    output: PurchaseOrder[]
    side_effects: []

# ============================================================================
# §1.6 ERROR CODE CATALOG
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header, or unknown role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role is not permitted for this endpoint per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource or an FK-referenced parent does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong type, bad enum member, or integer bound violated"
  - id: ERR_CROSS_ENTITY_MISMATCH
    http: 409
    condition: "On dispense create, a referenced child_site/contract_pharmacy/patient/prescriber does not belong to covered_entity_id"
  - id: ERR_MEF_NUMBER_REQUIRED
    http: 422
    condition: "CARVE_IN CoveredEntity created or approved without a medicaid_provider_number"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not allowed from the resource's current state"
  - id: ERR_CE_NOT_ACTIVE
    http: 409
    condition: "Dispense create or reinstate attempted while covered_entity.registration_status != ACTIVE"
  - id: ERR_GPO_PROHIBITED
    http: 409
    condition: "GPO-channel PurchaseOrder for a covered outpatient drug at a gpo_prohibited CE"
  - id: ERR_DUPLICATE_DISCOUNT
    http: 409
    condition: "MedicaidClaim created against a CLASSIFIED_340B dispense at a CARVE_OUT CE"
  - id: ERR_NO_CEILING_PRICE
    http: 409
    condition: "Dispense would classify 340B but no CeilingPriceRecord (published or provisional) exists for (NDC, quarter)"
  - id: ERR_ASSESSED_UNITS_EXCEED
    http: 422
    condition: "AuditFinding/self-disclosure assessed_units exceeds the referenced dispense.quantity_units"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A SELF_DISCLOSURE finding is disputed by the same X-User-ID that created it"
  - id: ERR_REMIT_EXCEEDS_BALANCE
    http: 422
    condition: "Remit amount_cents <= 0 or > remaining_balance_cents"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match the live parent version on an OCC-guarded write"
  - id: ERR_NO_PUBLISHED_CEILING
    http: 409
    condition: "Reconcile requested for a (NDC, quarter) with no published CeilingPriceRecord"
  - id: ERR_REPAYMENT_REQUIRED
    http: 409
    condition: "Resolve attempted on a finding with no RepaymentObligation set up"
  - id: ERR_DUPLICATE_HRSA_ID
    http: 409
    condition: "CoveredEntity created with an hrsa_id already in use"
  - id: ERR_DUPLICATE_NDC
    http: 409
    condition: "DrugProduct created with an ndc already in use"
  - id: ERR_DUPLICATE_ACCUMULATOR
    http: 409
    condition: "Accumulator created for a (covered_entity_id, drug_product_id) pair that already has one"
  - id: ERR_VALIDATION_PAGINATION
    http: 422
    condition: "limit/offset out of bounds (limit < 1, limit > 100, offset < 0)"
  - id: ERR_CP_WINDOW_OVERLAP
    http: 409
    condition: "New ContractPharmacyArrangement effective window overlaps a non-terminated same-NPI arrangement of the same CE (half-open [start,end) intersection)"
  - id: ERR_CEILING_QUARTER_OVERLAP
    http: 409
    condition: "A second published CeilingPriceRecord created for an existing (drug_product_id, quarter)"

# ============================================================================
# §1.7 RBAC MATRIX
# ============================================================================
roles:
  - name: ComplianceOfficer
    description: "Acts on behalf of a covered entity: registers the CE and its sub-resources, self-discloses findings, remits repayments. Cannot perform HRSA adjudication (approve/deny/resolve/dismiss/waive/raise HRSA audit findings)."
    identity: "opaque"
    exclusive_operations:
      - "POST /340b/covered-entities (register CE)"
      - "POST /340b/covered-entities/{id}/recertify"
      - "POST /340b/covered-entities/{id}/child-sites"
      - "POST /340b/covered-entities/{id}/prescribers"
      - "POST /340b/covered-entities/{id}/contract-pharmacies"
      - "POST /340b/contract-pharmacies/{id}/suspend|reactivate|terminate"
      - "POST /340b/covered-entities/{id}/self-disclosures"
      - "POST /340b/audit-findings/{id}/dispute"
      - "POST /340b/dispenses/{id}/medicaid-claims"
      - "POST /340b/repayment-obligations/{id}/remit"
    shared_operations:
      - "POST /340b/covered-entities/{id}/patients (with PharmacyOperator)"
      - "POST /340b/covered-entities/{id}/accumulators (with PharmacyOperator)"
      - "POST /340b/drug-products, POST /340b/drug-products/{id}/ceiling-prices (with HrsaAuditor)"
      - "POST /340b/audit-findings/{id}/repayments (with HrsaAuditor)"
      - "POST /340b/purchase-orders (with PharmacyOperator)"
      - "all GET reads"
  - name: HrsaAuditor
    description: "HRSA-side adjudicator: approves/denies/terminates registrations, raises audit findings, drives the finding review lifecycle, reconciles ceiling prices, waives repayments. Cannot dispense, self-disclose, or remit."
    identity: "opaque"
    exclusive_operations:
      - "POST /340b/covered-entities/{id}/approve|deny|flag-recert|terminate"
      - "POST /340b/audit-findings (raise HRSA finding)"
      - "POST /340b/audit-findings/{id}/start-review|resolve|dismiss"
      - "POST /340b/drug-products/{id}/reconcile"
      - "POST /340b/repayment-obligations/{id}/waive"
    shared_operations:
      - "POST /340b/drug-products, POST /340b/drug-products/{id}/ceiling-prices (with ComplianceOfficer)"
      - "POST /340b/audit-findings/{id}/repayments (with ComplianceOfficer)"
      - "all GET reads"
  - name: PharmacyOperator
    description: "Operates the pharmacy: records dispenses, reverses/reinstates, runs manual accumulator replenishment, places purchase orders, registers patients/accumulators. Cannot adjudicate findings or remit."
    identity: "opaque"
    exclusive_operations:
      - "POST /340b/dispenses"
      - "POST /340b/dispenses/{id}/reverse|reinstate"
      - "POST /340b/accumulators/{id}/replenish"
    shared_operations:
      - "POST /340b/covered-entities/{id}/patients (with ComplianceOfficer)"
