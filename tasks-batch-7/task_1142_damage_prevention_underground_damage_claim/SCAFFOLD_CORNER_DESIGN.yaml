            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseWC}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseWC}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocWC}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
