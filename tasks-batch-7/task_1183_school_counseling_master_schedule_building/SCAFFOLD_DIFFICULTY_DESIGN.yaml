          assert:
            - "back-to-back (gap 0 min) fails ERR_APPOINTMENT_CONFLICT (409)"
            - "gap 9 min fails ERR_APPOINTMENT_CONFLICT (buffer >= 10 required)"
            - "gap exactly 10 min succeeds (boundary: >= 10 satisfied)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: swap_preserves_global_enrollment_count
        grounds:
          - state_machines.ScheduleChangeRequest.APPROVED_to_EXECUTED
          - state_machines.ScheduleEntry.ENROLLED_to_MOVED
          - entities.Section.fields.enrolled_count
        distinguishing_aspect: |
          Conserved quantity: total ENROLLED seats across the two affected
          sections. A SWAP execution leaves enrolled_count(sec_from) +
          enrolled_count(sec_to) unchanged (sec_from loses exactly 1, sec_to
          gains exactly 1) and the student's ENROLLED entry count is invariant
          at 1.
        test_recipe:
          setup:
            - "Term T13 in CHANGE_WINDOW; s_swap enrolled in sec_p (period 1, enrolled_count 10, capacity 32); sec_q (period 2, enrolled_count 5, capacity 32); APPROVED SWAP request cr_swap."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Seventeen", max_caseload: 100 }
              as: Administrator
              captures: { c17: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2038-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term13: "$.data.id" }
            # NOTE for the test-generator: chain to CHANGE_WINDOW with the
            # pinned section loads (10 enrolled in sec_p incl. s_swap, 5 in
            # sec_q); SWAP created, claimed, approved with fresh term version.
            - call: "POST /scheduling/students"
              payload: { external_ref: "SWP", full_name: "Swap Stu", grade_level: 10, counselor_id: "${c17}" }
              as: Administrator
              captures: { s_swap: "$.data.id" }
            - call: "GET /scheduling/terms/${term13}"
              as: Administrator
              captures: { term13_v: "$.data.version" }
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_p: "$.data[0].id", sec_q: "$.data[1].id" }
            - call: "GET /scheduling/students/${s_swap}/schedule"
              as: Administrator
              captures: { entry_p: "$.data[0].id" }
            - call: "POST /scheduling/change-requests"
              payload: { student_id: "${s_swap}", term_id: "${term13}", kind: "SWAP", drop_entry_id: "${entry_p}", add_section_id: "${sec_q}", reason: "Swap for band practice slot" }
              as: Student
              as_user_id: "${s_swap}"
              captures: { cr_swap: "$.data.id" }
            - call: "POST /scheduling/change-requests/${cr_swap}/claim"
              payload: {}
              as: Counselor
              as_user_id: "${c17}"
            - call: "POST /scheduling/change-requests/${cr_swap}/decide"
              payload: { decision: "APPROVE", expected_term_version: "${term13_v}" }
              as: Administrator
          trigger:
            - call: "POST /scheduling/change-requests/${cr_swap}/execute"
              payload: {}
              as: Administrator
            - call: "GET /scheduling/sections/${sec_p}"
              as: Administrator
              captures: { p_after: "$.data.enrolled_count" }
            - call: "GET /scheduling/sections/${sec_q}"
              as: Administrator
              captures: { q_after: "$.data.enrolled_count" }
            - call: "GET /scheduling/students/${s_swap}/schedule"
              as: Administrator
              captures: { swap_entries: "$.data" }
          assert:
            - "ScheduleEntry.${entry_p}.state == MOVED and moved_to_section_id == ${sec_q}"
            - "enrolled_count(${sec_p}) == 9 (was 10) and enrolled_count(${sec_q}) == 6 (was 5); the sum 15 is unchanged"
            - "s_swap holds exactly 1 ENROLLED entry (per-student count conserved)"
      - name: schedule_cancel_preserves_teacher_load_arithmetic
        grounds:
          - state_machines.Section.SCHEDULED_to_CANCELLED
          - state_machines.Section.DRAFT_to_SCHEDULED
          - entities.Teacher.fields.assigned_section_count
        distinguishing_aspect: |
          Conserved quantity: teacher load arithmetic — assigned_section_count
          always equals the number of non-CANCELLED SCHEDULED/PUBLISHED
          sections for that teacher (different conserved quantity from
          enrollment seats). Schedule-then-cancel is the forward/compensating
          pair: count goes 1 -> 2 -> 1 with zero drift.
        test_recipe:
          setup:
            - "Term T14 in BUILDING; teacher t_inv (max_sections 3) already teaches 1 SCHEDULED section; sec_inv is a DRAFT section with no enrollments; room rm_inv exists."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Eighteen", max_caseload: 100 }
              as: Administrator
              captures: { c18: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2039-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term14: "$.data.id" }
            # NOTE for the test-generator: chain — two courses requested, two
            # DRAFT sections generated; teacher t_inv qualified for both;
            # section 1 PATCHed to SCHEDULED at period 1 (load 1); sec_inv is
            # section 2 (still DRAFT).
            - call: "POST /scheduling/teachers"
              payload: { full_name: "T Inv", max_sections: 3 }
              as: Administrator
              captures: { t_inv: "$.data.id" }
            - call: "POST /scheduling/rooms"
              payload: { room_number: "INV-1", capacity: 32, room_type: "STANDARD" }
              as: Administrator
              captures: { rm_inv: "$.data.id" }
            - call: "GET /scheduling/teachers/${t_inv}"
              as: Administrator
              captures: { load_before: "$.data.assigned_section_count" }
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_inv: "$.data[1].id" }
            - call: "GET /scheduling/terms/${term14}"
              as: Administrator
              captures: { term14_v: "$.data.version" }
          trigger:
            - call: "PATCH /scheduling/sections/${sec_inv}"
              payload: { teacher_id: "${t_inv}", room_id: "${rm_inv}", period: 5, capacity: 32, expected_term_version: "${term14_v}" }
              as: Administrator
              captures: { sec_inv_state: "$.data.state" }
            - call: "GET /scheduling/teachers/${t_inv}"
              as: Administrator
              captures: { load_mid: "$.data.assigned_section_count" }
            - call: "POST /scheduling/sections/${sec_inv}/cancel"
              payload: {}
              as: Administrator
            - call: "GET /scheduling/teachers/${t_inv}"
              as: Administrator
              captures: { load_after: "$.data.assigned_section_count" }
          assert:
            - "assigned_section_count before == 1, after schedule == 2, after cancel == 1 (forward + compensating actions leave the quantity unchanged)"
            - "Section.${sec_inv}.state == CANCELLED (the enrolled_count == 0 precondition held)"
