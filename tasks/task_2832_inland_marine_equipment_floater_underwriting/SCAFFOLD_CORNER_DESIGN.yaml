            - "trigger[0] response error_id == ERR_FLOATER_OUTSIDE_POLICY_TERM"
            - "after trigger[0]: CoveragePart.${cp}.rated_premium_cents == 0 and the part has zero InstallationFloater children"
            - "trigger[1] HTTP status == 201"
            - "after trigger[1]: InstallationFloater.${flt}.term_days == 92 (inclusive of both dates) and status == PENDING"
            - "after trigger[2]: InstallationFloater.${flt}.rated_premium_cents == 70575, CoveragePart.${cp}.rated_premium_cents == 70575 and Policy.${pol}.written_premium_cents == 73398"
            - "after trigger[5]: InstallationFloater.${flt}.status == ACTIVE and Jobsite.${js}.active_floater_count == 1"
            - "trigger[6] HTTP status == 422"
            - "trigger[6] response error_id == ERR_TERMINATION_DATE_OUTSIDE_COVERAGE"
            - "after trigger[6]: InstallationFloater.${flt}.status == ACTIVE, termination_trigger is null, termination_date is null and earned_premium_cents == 0"
            - "trigger[7] HTTP status == 200"
            - "after trigger[7]: InstallationFloater.${flt}.status == TERMINATED_ACCEPTANCE with termination_trigger == ACCEPTANCE, earned_premium_cents == 23781 and unearned_return_cents == 46794"
            - "after trigger[7]: Policy.${pol}.premium_balance_cents == 26604 and one ENDORSEMENT_RETURN LedgerEntry exists with amount_cents == -46794"
            - "after trigger[7]: Jobsite.${js}.active_floater_count == 0 and status == RELEASED"
