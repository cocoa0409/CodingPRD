# =============================================================================
# PRD Benchmark Seed Tables — Auto Transport & Car-Shipping Broker (Montway style)
# Difficulty: Expert
# =============================================================================

scenario: |
  579. Auto Transport & Car-Shipping Broker (Montway style): quote (open/enclosed)
  & route, carrier dispatch & load board, pickup/delivery window & inspection
  (BOL/condition), door-to-door vs terminal, deposit & COD balance, damage claim
  & carrier insurance, expedited & multi-car, tracking

domain_name: car-shipping
api_prefix: /
# Flat topology: every entity is a top-level collection (/carriers, /shipment-orders,
# /vehicles, /quotes, /listings, /offers, /assignments, /inspections,
# /ledger-entries, /claims, /shippers). The API root "/" is the common prefix.

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (Order, Vehicle, Quote, Listing, Offer,
  # Assignment, Inspection, LedgerEntry, Claim) — no deep URL nesting; children
  # carry FK fields and are discovered via filtered-list GETs.

  state_machine_shape: cyclic
  # Order runs a branching+cyclic lifecycle (dispatch can be revoked back to a
  # prior state; a claim reopens); DispatchOffer negotiates in rounds
  # (COUNTERED loops); Claim has a review cycle (RETURNED_FOR_INFO -> SUBMITTED).

  relationship_patterns:
    - one_to_many        # Order -> Vehicle, Order -> LedgerEntry, Order -> Claim
    - flat_reference     # DispatchOffer -> Listing, Assignment -> Carrier
    - cross_aggregate    # Assignment references Carrier across aggregate boundary

  role_model: peer_roles
  # Shipper (customer), Broker (dispatch operator, opaque), Carrier (entity-backed),
  # Admin (opaque superuser for claims/adjustments).

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Carrier company legal name" }
      - { name: mc_number, type: string, source: input, description: "Motor Carrier authority number; unique across carriers" }
      - { name: cargo_insurance_limit_cents, type: integer, source: input, description: "Per-load cargo insurance coverage ceiling in cents" }
      - { name: insurance_expiry_date, type: datetime, source: input, description: "ISO 8601 date the cargo insurance certificate expires" }
      - { name: equipment_type, type: enum, source: input, description: "OPEN | ENCLOSED — trailer type this carrier operates", constraints: "OPEN | ENCLOSED" }
      - { name: rating, type: number, source: input, default: 3.0, description: "Broker rating 0.0-5.0 used as dispatch ranking key" }
      - { name: aggregate_exposure_cents, type: integer, source: computed, default: 0, description: "Read-only: sum of declared_value_cents across all vehicles of orders currently assigned to this carrier in status DISPATCHED or PICKED_UP (calc carrier_insurance_exposure, aggregate variant)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — suspended carriers cannot be assigned", constraints: "ACTIVE | SUSPENDED" }

  - name: ShipmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: system, description: "FK -> Shipper.id; owning customer, taken from X-User-ID at creation" }
      - { name: origin_zip, type: string, source: input, description: "Pickup 5-digit ZIP" }
      - { name: dest_zip, type: string, source: input, description: "Delivery 5-digit ZIP" }
      - { name: route_miles, type: integer, source: input, description: "Quoted route distance in miles; must be > 0" }
      - { name: transport_type, type: enum, source: input, description: "OPEN | ENCLOSED", constraints: "OPEN | ENCLOSED" }
      - { name: delivery_mode, type: enum, source: input, default: DOOR_TO_DOOR, description: "DOOR_TO_DOOR | TERMINAL", constraints: "DOOR_TO_DOOR | TERMINAL" }
      - { name: service_level, type: enum, source: input, default: STANDARD, description: "STANDARD | EXPEDITED", constraints: "STANDARD | EXPEDITED" }
      - { name: pickup_window_start, type: datetime, source: input, description: "Requested pickup window open (ISO 8601 UTC)" }
      - { name: pickup_window_end, type: datetime, source: input, description: "Requested pickup window close; must be > pickup_window_start" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Locked provisional total price from the accepted Quote; null until a quote is accepted" }
      - { name: settled_total_cents, type: integer, source: computed, description: "Final re-priced total computed at delivery from the PICKUP inspection's observed inoperable count (calc settlement_pricing); null until DELIVERED" }
      - { name: deposit_cents, type: integer, source: computed, description: "Broker deposit portion of quoted_total_cents (see calc deposit_split)" }
      - { name: cod_balance_cents, type: integer, source: computed, description: "Carrier cash-on-delivery balance = quoted_total_cents - deposit_cents" }
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; required when delivery_mode == TERMINAL, else null" }
      - { name: terminal_slot_start, type: datetime, source: input, description: "Reserved terminal dock window open (ISO 8601 UTC); required when delivery_mode == TERMINAL" }
      - { name: terminal_slot_end, type: datetime, source: input, description: "Reserved terminal dock window close; must be > terminal_slot_start; required when delivery_mode == TERMINAL" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Running sum of POSTED LedgerEntry.amount_cents of kind DEPOSIT/COD_PAYMENT" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "quoted_total_cents - amount_paid_cents; recomputed on every ledger post" }
      - { name: assigned_carrier_id, type: string, source: computed, description: "FK -> Carrier.id; set when an Assignment is dispatched, cleared on revoke" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | QUOTED | LISTED | DISPATCHED | PICKED_UP | DELIVERED | CLOSED | CANCELLED", constraints: "DRAFT | QUOTED | LISTED | DISPATCHED | PICKED_UP | DELIVERED | CLOSED | CANCELLED" }
      - { name: has_open_claim, type: boolean, source: computed, default: false, description: "True while any child Claim is in a non-terminal state" }

  - name: Vehicle
    parent: ShipmentOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ShipmentOrder.id; owning order" }
      - { name: make, type: string, source: input, description: "Vehicle make" }
      - { name: model, type: string, source: input, description: "Vehicle model" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: is_inoperable, type: boolean, source: input, default: false, description: "Whether the vehicle is non-running (adds a surcharge)" }
      - { name: declared_value_cents, type: integer, source: input, description: "Owner-declared vehicle value; used for insurance-adequacy check" }

  - name: Quote
    parent: ShipmentOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ShipmentOrder.id; order this quote prices" }
      - { name: base_cents, type: integer, source: computed, description: "Distance base = route_miles * PER_MILE_CENTS by band (see calc quote_pricing)" }
      - { name: transport_surcharge_cents, type: integer, source: computed, description: "Enclosed and expedited surcharges" }
      - { name: inoperable_surcharge_cents, type: integer, source: computed, description: "Sum of per-vehicle inoperable surcharges" }
      - { name: multi_car_discount_cents, type: integer, source: computed, description: "Volume discount for 2+ vehicles" }
      - { name: total_cents, type: integer, source: computed, description: "Final quote total after surcharges and discount" }
      - { name: valid_until, type: datetime, source: computed, description: "Quote expiry = created_at + QUOTE_TTL_HOURS; expired quotes cannot be accepted" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "OFFERED | ACCEPTED | SUPERSEDED (expiry is enforced via valid_until, not a status)", constraints: "OFFERED | ACCEPTED | SUPERSEDED" }

  - name: LoadListing
    parent: ShipmentOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ShipmentOrder.id; order posted to the load board" }
      - { name: offered_carrier_pay_cents, type: integer, source: input, description: "Carrier pay advertised on the board; must be <= order.quoted_total_cents" }
      - { name: expedited, type: boolean, source: computed, description: "Mirror of order.service_level == EXPEDITED at listing time" }
      - { name: best_offer_id, type: string, source: computed, description: "Denormalized id of the current lowest-ask PENDING DispatchOffer on this listing (tie-break created_at ASC); null if none. Not a queryable FK." }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | AWARDED | WITHDRAWN", constraints: "OPEN | AWARDED | WITHDRAWN" }

  - name: DispatchOffer
    parent: LoadListing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> LoadListing.id; board listing this offer targets" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; bidding carrier, from X-User-ID" }
      - { name: ask_pay_cents, type: integer, source: input, description: "Carrier's asking pay for the load" }
      - { name: pickup_eta, type: datetime, source: input, description: "Carrier-promised pickup datetime; must fall within order pickup window" }
      - { name: round_no, type: integer, source: computed, default: 1, description: "Negotiation round; increments on each counter" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | COUNTERED | ACCEPTED | DECLINED | WITHDRAWN", constraints: "PENDING | COUNTERED | ACCEPTED | DECLINED | WITHDRAWN" }

  - name: Assignment
    parent: ShipmentOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ShipmentOrder.id; dispatched order" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; the dispatched carrier" }
      - { name: offer_id, type: string, source: system, description: "FK -> DispatchOffer.id; the accepted board offer" }
      - { name: carrier_pay_cents, type: integer, source: computed, description: "Locked carrier pay = accepted offer.ask_pay_cents" }
      - { name: status, type: enum, source: system, default: DISPATCHED, description: "DISPATCHED | REVOKED | COMPLETED", constraints: "DISPATCHED | REVOKED | COMPLETED" }

  - name: Inspection
    parent: ShipmentOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ShipmentOrder.id; inspected order" }
      - { name: phase, type: enum, source: input, description: "PICKUP | DELIVERY — which BOL leg", constraints: "PICKUP | DELIVERY" }
      - { name: damage_count, type: integer, source: input, default: 0, description: "Number of new damage points recorded on the BOL for this phase" }
      - { name: observed_inoperable_count, type: integer, source: input, default: 0, description: "Number of vehicles observed non-running at this BOL leg; the PICKUP value feeds calc settlement_pricing" }
      - { name: odometer, type: integer, source: input, description: "Recorded odometer reading" }
      - { name: signed_by_carrier_id, type: string, source: system, description: "FK -> Carrier.id; the carrier that signed this BOL leg" }

  - name: LedgerEntry
    parent: ShipmentOrder
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ShipmentOrder.id; order whose ledger this belongs to" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | COD_PAYMENT | REFUND | CLAIM_PAYOUT", constraints: "DEPOSIT | COD_PAYMENT | REFUND | CLAIM_PAYOUT" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount; DEPOSIT/COD_PAYMENT positive (inflow), REFUND/CLAIM_PAYOUT negative (outflow)" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | VOIDED", constraints: "POSTED | VOIDED" }

  - name: Claim
    parent: ShipmentOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ShipmentOrder.id; order the damage is claimed against" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; carrier held responsible (order.assigned_carrier_id snapshot)" }
      - { name: claimed_cents, type: integer, source: input, description: "Amount the shipper claims for damages" }
      - { name: approved_cents, type: integer, source: computed, description: "Payout after insurance-cap adjudication; <= carrier insurance limit" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | RETURNED_FOR_INFO | APPROVED | DENIED | PAID", constraints: "SUBMITTED | RETURNED_FOR_INFO | APPROVED | DENIED | PAID" }

  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Shipper contact email; unique" }
      - { name: full_name, type: string, source: input, description: "Shipper full name" }

  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Terminal facility name" }
      - { name: dock_zip, type: string, source: input, description: "Terminal 5-digit ZIP" }
      - { name: dock_count, type: integer, source: input, description: "Concurrent dock capacity; must be >= 1" }
      - { name: buffer_minutes, type: integer, source: input, default: 60, description: "Symmetric turnaround buffer applied to each side of a reserved slot for overlap detection" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ShipmentOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /shipment-orders/{orderId}/quotes/{quoteId}/accept"
        actor: Shipper
        preconditions:
          - "Order has >= 1 Vehicle (ERR_NO_VEHICLES)"
          - "Quote.status == OFFERED (ERR_QUOTE_NOT_OFFERED)"
          - "current_utc <= Quote.valid_until (ERR_QUOTE_EXPIRED)"
        side_effects:
          - "Order.quoted_total_cents = Quote.total_cents"
          - "run calc deposit_split -> set Order.deposit_cents and Order.cod_balance_cents"
          - "Order.outstanding_balance_cents = Order.quoted_total_cents (amount_paid_cents still 0)"
          - "Quote.status = ACCEPTED; all sibling OFFERED quotes on this order -> SUPERSEDED"
          - "increments ShipmentOrder.version by 1"

      - from: QUOTED
        to: LISTED
        trigger: "POST /shipment-orders/{orderId}/listings"
        actor: Broker
        preconditions:
          - "A POSTED DEPOSIT LedgerEntry exists so Order.amount_paid_cents >= Order.deposit_cents (ERR_DEPOSIT_NOT_PAID)"
          - "offered_carrier_pay_cents <= Order.quoted_total_cents (ERR_PAY_EXCEEDS_TOTAL)"
        side_effects:
          - "create LoadListing in OPEN"
          - "LoadListing.expedited = (Order.service_level == EXPEDITED)"
          - "increments ShipmentOrder.version by 1"

      - from: LISTED
        to: DISPATCHED
        trigger: "POST /listings/{listingId}/offers/{offerId}/accept"
        actor: Broker
        preconditions:
          - "DispatchOffer.status IN {PENDING, COUNTERED} (ERR_OFFER_NOT_ACTIVE)"
          - "no other DISPATCHED/PICKED_UP Assignment of this Carrier has a pickup window that half-open-overlaps this order's window (ERR_CARRIER_SCHEDULE_CONFLICT)"
          - "Carrier.status == ACTIVE (ERR_CARRIER_SUSPENDED)"
          - "Carrier.equipment_type == Order.transport_type (ERR_EQUIPMENT_MISMATCH)"
          - "current_utc <= Carrier.insurance_expiry_date (ERR_INSURANCE_EXPIRED)"
          - "Carrier.cargo_insurance_limit_cents >= sum of Vehicle.declared_value_cents for the order (per_load exposure) (ERR_INSURANCE_INADEQUATE)"
        side_effects:
          - "create Assignment in DISPATCHED with carrier_pay_cents = offer.ask_pay_cents"
          - "Order.assigned_carrier_id = Carrier.id"
          - "DispatchOffer.status = ACCEPTED"
          - "LoadListing.status = AWARDED; all sibling PENDING/COUNTERED offers -> DECLINED"
          - "recompute Carrier.aggregate_exposure_cents (calc carrier_insurance_exposure aggregate variant)"
          - "increments ShipmentOrder.version by 1"

      - from: DISPATCHED
        to: LISTED
        trigger: "POST /assignments/{assignmentId}/revoke"
        actor: Broker
        preconditions:
          - "Assignment.status == DISPATCHED (ERR_ASSIGNMENT_NOT_DISPATCHED)"
          - "No PICKUP Inspection exists for the order (ERR_ALREADY_PICKED_UP)"
        side_effects:
          - "Assignment.status = REVOKED"
          - "Order.assigned_carrier_id = null"
          - "reopen LoadListing.status = OPEN; its best_offer_id recomputed"
          - "recompute Carrier.aggregate_exposure_cents (order leaves the active set)"
          - "increments ShipmentOrder.version by 1"

      - from: DISPATCHED
        to: PICKED_UP
        trigger: "POST /shipment-orders/{orderId}/inspections (phase=PICKUP)"
        actor: Carrier
        preconditions:
          - "Assignment.status == DISPATCHED and Assignment.carrier_id == X-User-ID (ERR_NOT_ASSIGNED_CARRIER)"
          - "Inspection.phase == PICKUP and no prior PICKUP inspection exists (ERR_DUPLICATE_INSPECTION)"
        side_effects:
          - "create Inspection (PICKUP) with signed_by_carrier_id = Carrier.id"
          - "increments ShipmentOrder.version by 1"

      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /shipment-orders/{orderId}/inspections (phase=DELIVERY)"
        actor: Carrier
        preconditions:
          - "Assignment.carrier_id == X-User-ID (ERR_NOT_ASSIGNED_CARRIER)"
          - "A PICKUP inspection exists and no prior DELIVERY inspection exists (ERR_DUPLICATE_INSPECTION)"
        side_effects:
          - "create Inspection (DELIVERY) with signed_by_carrier_id = Carrier.id"
          - "run calc settlement_pricing -> set Order.settled_total_cents (final variant, uses PICKUP observed_inoperable_count)"
          - "Assignment.status = COMPLETED"
          - "recompute Carrier.aggregate_exposure_cents (order leaves the active set)"
          - "increments ShipmentOrder.version by 1"

      - from: DELIVERED
        to: CLOSED
        trigger: "POST /shipment-orders/{orderId}/close"
        actor: Broker
        preconditions:
          - "Order.outstanding_balance_cents == 0 (ERR_BALANCE_OUTSTANDING)"
          - "Order.has_open_claim == false (ERR_OPEN_CLAIM)"
        side_effects:
          - "Order.status = CLOSED"
          - "increments ShipmentOrder.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /shipment-orders/{orderId}/cancel"
        actor: Shipper
        preconditions:
          - "Order.status IN {DRAFT, QUOTED, LISTED} (ERR_CANCEL_TOO_LATE)"
        side_effects:
          - "Order.status = CANCELLED"
          - "if a POSTED DEPOSIT exists, post a REFUND LedgerEntry of -deposit_cents (compensation), recompute amount_paid_cents and outstanding_balance_cents"
          - "any OPEN LoadListing -> WITHDRAWN; its PENDING/COUNTERED offers -> DECLINED"
          - "increments ShipmentOrder.version by 1"
        note: "Same cancel endpoint valid from QUOTED and LISTED; DISPATCHED+ cannot cancel."

  - entity: DispatchOffer
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: COUNTERED
        trigger: "POST /listings/{listingId}/offers/{offerId}/counter"
        actor: Broker
        preconditions:
          - "DispatchOffer.status == PENDING (ERR_OFFER_NOT_ACTIVE)"
          - "LoadListing.status == OPEN (ERR_LISTING_NOT_OPEN)"
        side_effects:
          - "DispatchOffer.round_no += 1"
          - "DispatchOffer.status = COUNTERED"
        note: "counter_pay_cents stored is the broker's target; carrier re-asks via re-offer."

      - from: COUNTERED
        to: PENDING
        trigger: "POST /listings/{listingId}/offers/{offerId}/reoffer"
        actor: Carrier
        preconditions:
          - "DispatchOffer.status == COUNTERED (ERR_OFFER_NOT_ACTIVE)"
          - "reoffer carrier_id == X-User-ID == DispatchOffer.carrier_id (ERR_NOT_OFFER_OWNER)"
        side_effects:
          - "DispatchOffer.ask_pay_cents = new ask; DispatchOffer.round_no += 1"
          - "DispatchOffer.status = PENDING"
          - "recompute LoadListing.best_offer_id"
        note: "Cyclic PENDING<->COUNTERED negotiation loop."

      - from: PENDING
        to: ACCEPTED
        trigger: "POST /listings/{listingId}/offers/{offerId}/accept"
        actor: Broker
        preconditions:
          - "see ShipmentOrder LISTED->DISPATCHED preconditions"
        side_effects:
          - "DispatchOffer.status = ACCEPTED (bubbles the order to DISPATCHED)"

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /listings/{listingId}/offers/{offerId}/withdraw"
        actor: Carrier
        preconditions:
          - "DispatchOffer.status IN {PENDING, COUNTERED} (ERR_OFFER_NOT_ACTIVE)"
          - "withdraw carrier_id == X-User-ID == DispatchOffer.carrier_id (ERR_NOT_OFFER_OWNER)"
        side_effects:
          - "DispatchOffer.status = WITHDRAWN"
          - "recompute LoadListing.best_offer_id"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /claims/{claimId}/return"
        actor: Admin
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_NOT_ACTIONABLE)"
        side_effects:
          - "Claim.status = RETURNED_FOR_INFO"

      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /claims/{claimId}/resubmit"
        actor: Shipper
        preconditions:
          - "Claim.status == RETURNED_FOR_INFO (ERR_CLAIM_NOT_ACTIONABLE)"
          - "resubmit shipper_id == X-User-ID == Order.shipper_id (ERR_NOT_ORDER_OWNER)"
        side_effects:
          - "Claim.status = SUBMITTED; Claim.claimed_cents updated to resubmitted amount"
        note: "Cyclic review loop SUBMITTED<->RETURNED_FOR_INFO."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /claims/{claimId}/approve"
        actor: Admin
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_NOT_ACTIONABLE)"
          - "Order.status IN {DELIVERED} and a DELIVERY inspection with damage_count > 0 exists (ERR_NO_DAMAGE_ON_RECORD)"
        side_effects:
          - "run calc claim_adjudication -> set Claim.approved_cents (capped by carrier insurance)"
          - "Claim.status = APPROVED"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{claimId}/deny"
        actor: Admin
        preconditions:
          - "Claim.status IN {SUBMITTED, RETURNED_FOR_INFO} (ERR_CLAIM_NOT_ACTIONABLE)"
        side_effects:
          - "Claim.status = DENIED; Order.has_open_claim recomputed"

      - from: APPROVED
        to: PAID
        trigger: "POST /claims/{claimId}/pay"
        actor: Admin
        preconditions:
          - "Claim.status == APPROVED (ERR_CLAIM_NOT_ACTIONABLE)"
        side_effects:
          - "post a CLAIM_PAYOUT LedgerEntry of -approved_cents on the order"
          - "recompute Order.amount_paid_cents and Order.outstanding_balance_cents"
          - "Claim.status = PAID; Order.has_open_claim recomputed"

  - entity: Assignment
    initial_state: DISPATCHED
    terminal_states: [REVOKED, COMPLETED]
    transitions:
      - from: DISPATCHED
        to: REVOKED
        trigger: "POST /assignments/{assignmentId}/revoke"
        actor: Broker
        preconditions:
          - "Assignment.status == DISPATCHED (ERR_ASSIGNMENT_NOT_DISPATCHED)"
          - "No PICKUP Inspection exists for the order (ERR_ALREADY_PICKED_UP)"
        side_effects:
          - "mirrors ShipmentOrder DISPATCHED->LISTED (order and listing reopen; carrier exposure recomputed)"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /shipment-orders/{orderId}/inspections (phase=DELIVERY)"
        actor: Carrier
        preconditions:
          - "order transitions PICKED_UP->DELIVERED (see ShipmentOrder)"
        side_effects:
          - "Assignment.status = COMPLETED (bubbled from the DELIVERY inspection)"
        note: "Assignment is driven entirely by the order/inspection lifecycle; it has no independent forward endpoint besides revoke."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-order
    parent_entity: ShipmentOrder
    write_endpoint: "POST /shipment-orders/{orderId}/quotes"
    occ_field: "expected_order_version"
    description: |
      Generating a Quote for an order whose version has advanced since the client
      last observed it is rejected. A quote prices the order's CURRENT vehicle set;
      because attaching a vehicle (POST /shipment-orders/{orderId}/vehicles) bumps
      ShipmentOrder.version, a client that fetched the order, then generates a quote
      carrying the pre-attach version, is pricing a stale vehicle set. This is a true
      race rather than a state precondition: quoting a DRAFT order is always
      permitted by the state machine, so a second sequential quote request against
      the unchanged DRAFT state would legitimately succeed — only the version guard
      distinguishes the stale view. The stale request is rejected on the version
      check instead of silently emitting a mis-priced quote.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_pricing
    trigger: "POST /shipment-orders/{orderId}/quotes (quote generation)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is fixed; each step reads only prior results.
      1. Select PER_MILE_CENTS by distance band (marginal per-band, NOT flat):
           miles in [1,500]      -> 95 cents/mi on those miles
           miles in [501,1500]   -> 75 cents/mi on those miles
           miles in [1501, inf)  -> 60 cents/mi on those miles
         base_cents = sum over bands of (miles_in_band * band_rate), rounded to
         whole cents at the very end (sum-then-round, NOT per-band round).
      2. transport_surcharge_cents:
           enclosed_add  = (transport_type == ENCLOSED) ? round(base_cents * 0.40) : 0
           expedite_add  = (service_level == EXPEDITED)  ? round(base_cents * 0.25) : 0
           transport_surcharge_cents = enclosed_add + expedite_add
      3. inoperable_surcharge_cents = INOP_SURCHARGE_CENTS * count(Vehicle.is_inoperable == true)
      4. multi_car_discount_cents:
           n = count(Vehicle for order)
           if n >= 2: discount = round( (base_cents + transport_surcharge_cents) * MULTI_CAR_PCT_PER_EXTRA * (n-1) ),
                       capped at MULTI_CAR_MAX_PCT of (base_cents + transport_surcharge_cents)
           else 0
      5. total_cents = base_cents + transport_surcharge_cents
                       + inoperable_surcharge_cents - multi_car_discount_cents
    input_set: "All Vehicles currently attached to the order at quote time."
    constants:
      BAND1_RATE: 95
      BAND2_RATE: 75
      BAND3_RATE: 60
      BAND1_MAX: 500
      BAND2_MAX: 1500
      INOP_SURCHARGE_CENTS: 15000
      MULTI_CAR_PCT_PER_EXTRA: 0.05
      MULTI_CAR_MAX_PCT: 0.15
      ENCLOSED_PCT: 0.40
      EXPEDITE_PCT: 0.25
      QUOTE_TTL_HOURS: 72
    precision: "integer cents, round_half_up; sum-then-round for base_cents"

  - name: settlement_pricing
    trigger: "ShipmentOrder PICKED_UP->DELIVERED (delivery inspection)"
    algorithm: tiered_pricing
    formula: |
      Re-run the exact quote_pricing formula BUT replace the inoperable-vehicle
      count with the count OBSERVED at pickup rather than the count DECLARED at
      order creation:
        observed_inop = (PICKUP Inspection).observed_inoperable_count
        inoperable_surcharge_cents = INOP_SURCHARGE_CENTS * observed_inop
        settled_total_cents = base_cents + transport_surcharge_cents
                              + inoperable_surcharge_cents - multi_car_discount_cents
      base_cents, transport_surcharge_cents and multi_car_discount_cents are the
      SAME values as the accepted quote (route/transport/service unchanged).
      settled_total_cents is informational (does NOT alter outstanding_balance_cents);
      it diverges from quoted_total_cents exactly when observed_inop differs from the
      declared inoperable count used at quote time.
    input_set: "The order's accepted Quote components + the PICKUP inspection observed count."
    constants:
      INOP_SURCHARGE_CENTS: 15000
    precision: "integer cents, round_half_up; sum-then-round for base_cents"
    variants:
      - name: provisional
        when: "at quote generation / acceptance"
        difference: "inoperable_surcharge uses DECLARED Vehicle.is_inoperable count (quoted_total_cents)"
      - name: final
        when: "at delivery inspection"
        difference: "inoperable_surcharge uses PICKUP-OBSERVED count (settled_total_cents); same data, different total"

  - name: deposit_split
    trigger: "ShipmentOrder DRAFT->QUOTED (quote acceptance)"
    algorithm: threshold
    formula: |
      deposit_cents is the broker's cut, computed from quoted_total_cents:
        raw = round(quoted_total_cents * DEPOSIT_PCT)
        deposit_cents = min( max(raw, DEPOSIT_FLOOR_CENTS), DEPOSIT_CAP_CENTS )
      cod_balance_cents = quoted_total_cents - deposit_cents
      Invariant: deposit_cents + cod_balance_cents == quoted_total_cents (exactly).
    input_set: "The single accepted Quote's total_cents."
    constants:
      DEPOSIT_PCT: 0.20
      DEPOSIT_FLOOR_CENTS: 10000
      DEPOSIT_CAP_CENTS: 40000
    precision: "integer cents, round_half_up"

  - name: claim_adjudication
    trigger: "Claim SUBMITTED->APPROVED (claim approval)"
    algorithm: threshold
    formula: |
      The payout is bounded by both the declared exposure and the carrier's
      cargo insurance limit:
        eligible = min(Claim.claimed_cents, sum of Vehicle.declared_value_cents for order)
        approved_cents = min(eligible, Carrier.cargo_insurance_limit_cents)
      Boundary: if approved_cents would be 0 (limit is 0), approval still
      succeeds with approved_cents = 0 (documented denial-equivalent payout).
    input_set: "The order's Vehicles + the responsible Carrier's insurance limit."
    constants: {}
    precision: "integer cents"

  - name: carrier_insurance_exposure
    trigger: "at dispatch (offer accept) for the per_load variant; recomputed on any Assignment status change for the aggregate variant"
    algorithm: aggregation
    formula: |
      Two valid readings of a carrier's insured exposure:
        per_load  = sum of Vehicle.declared_value_cents for the SINGLE order being
                    dispatched. The dispatch gate enforces:
                      Carrier.cargo_insurance_limit_cents >= per_load
                    (violation -> ERR_INSURANCE_INADEQUATE).
        aggregate = sum of Vehicle.declared_value_cents across ALL orders currently
                    assigned to the carrier with Assignment.status IN {DISPATCHED, PICKED_UP}
                    (INCLUDING the order just dispatched). Stored on
                    Carrier.aggregate_exposure_cents; informational, NOT gated.
      For a carrier holding two active loads the two readings differ: per_load sees
      one order, aggregate sees both.
    input_set: "per_load: the dispatched order's vehicles. aggregate: vehicles of all DISPATCHED/PICKED_UP orders of the carrier."
    constants: {}
    precision: "integer cents"
    variants:
      - name: per_load
        when: "insurance-adequacy gate at dispatch"
        difference: "counts only the single order being dispatched"
      - name: aggregate
        when: "Carrier.aggregate_exposure_cents monitoring field"
        difference: "counts every active load of the carrier; same carrier data yields a larger number"

  - name: order_balance_reconciliation
    trigger: "any POST/void of a LedgerEntry on the order (DEPOSIT, COD_PAYMENT, REFUND, CLAIM_PAYOUT)"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum of amount_cents over LedgerEntry where
        order_id == this order
        AND status == POSTED
        AND kind IN {DEPOSIT, COD_PAYMENT}     (inflows only; positive)
      refunds_and_payouts_cents = sum of (-amount_cents) over LedgerEntry where
        status == POSTED AND kind IN {REFUND, CLAIM_PAYOUT}
      outstanding_balance_cents = quoted_total_cents - amount_paid_cents
      Note: REFUND/CLAIM_PAYOUT do NOT reduce outstanding_balance_cents (they are
      broker->shipper cash out, tracked separately); only DEPOSIT and COD_PAYMENT
      inflows reduce what the shipper still owes.
    input_set: "All POSTED LedgerEntry rows for the order; VOIDED excluded."
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource IDs exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting entity-backed user owns/relates to the resource (Shipper owns order; Carrier owns offer; Assignment carrier == caller)"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "order-owner and carrier-owner actions"

  - priority: 5
    category: state
    check: "Target resource in a state that permits this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (overridden by domain-specific state error where declared)"

  - priority: 6
    category: business_constraint
    check: "Request field shape valid (positive miles, pickup_window_end > start, valid enum members, ask/pay > 0; when delivery_mode == TERMINAL then terminal_id + terminal_slot_start + terminal_slot_end all present and terminal_slot_end > terminal_slot_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/action endpoints with a body"

  - priority: 7
    category: business_temporal
    check: "Quote not expired at acceptance: current_utc <= Quote.valid_until"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST .../quotes/{quoteId}/accept"

  - priority: 8
    category: business_temporal
    check: "Carrier insurance certificate not expired at dispatch: current_utc <= Carrier.insurance_expiry_date"
    error_id: ERR_INSURANCE_EXPIRED
    http_status: 409
    applies_to: "POST /listings/{listingId}/offers/{offerId}/accept"

  - priority: 9
    category: business_temporal
    check: "DispatchOffer.pickup_eta within [Order.pickup_window_start, Order.pickup_window_end] (closed interval, both endpoints inclusive)"
    error_id: ERR_PICKUP_ETA_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /listings/{listingId}/offers"

  - priority: 10
    category: business_temporal
    check: "Terminal dock overlap: at TERMINAL-mode order creation, the count of OTHER non-CANCELLED orders on the same terminal whose buffered slot [slot_start - buffer, slot_end + buffer] intersects (as a CLOSED interval, touching endpoints count as intersecting) this order's [slot_start, slot_end] must be < Terminal.dock_count"
    error_id: ERR_TERMINAL_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /shipment-orders (delivery_mode == TERMINAL)"

  - priority: 11
    category: business_temporal
    check: "Carrier schedule overlap: at dispatch, the carrier must have no other Assignment in status DISPATCHED/PICKED_UP whose order pickup window [pickup_window_start, pickup_window_end) intersects this order's window as a HALF-OPEN interval (touching endpoints do NOT conflict)"
    error_id: ERR_CARRIER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /listings/{listingId}/offers/{offerId}/accept"

  - priority: 12
    category: business_safety
    check: "Carrier equipment_type matches Order.transport_type at dispatch"
    error_id: ERR_EQUIPMENT_MISMATCH
    http_status: 409
    applies_to: "POST /listings/{listingId}/offers/{offerId}/accept"

  - priority: 13
    category: business_safety
    check: "Carrier cargo insurance limit >= sum of Vehicle.declared_value_cents (per_load exposure) at dispatch"
    error_id: ERR_INSURANCE_INADEQUATE
    http_status: 409
    applies_to: "POST /listings/{listingId}/offers/{offerId}/accept"

  - priority: 14
    category: business_fiscal
    check: "Listing offered_carrier_pay_cents (and any accepted offer ask) must not exceed Order.quoted_total_cents"
    error_id: ERR_PAY_EXCEEDS_TOTAL
    http_status: 402
    applies_to: "POST /shipment-orders/{orderId}/listings, POST /listings/{listingId}/offers/{offerId}/accept"

  - priority: 15
    category: business_fiscal
    check: "Deposit must be paid before listing: Order.amount_paid_cents >= Order.deposit_cents"
    error_id: ERR_DEPOSIT_NOT_PAID
    http_status: 402
    applies_to: "POST /shipment-orders/{orderId}/listings"

  - priority: 16
    category: business_fiscal
    check: "COD_PAYMENT amount must not overpay: amount_cents <= Order.outstanding_balance_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 402
    applies_to: "POST /shipment-orders/{orderId}/ledger-entries (kind=COD_PAYMENT)"

  - priority: 17
    category: business_constraint
    check: "OCC expected_order_version matches ShipmentOrder.version when generating a quote against a possibly-stale vehicle set"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /shipment-orders/{orderId}/quotes"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Shipper ---
  - method: POST
    path: "/shippers"
    description: "Register a shipper (customer) account"
    roles: [Shipper, Admin]
    code: 201
    input: [email, full_name]
    output: Shipper
    side_effects: ["status implicit ACTIVE"]

  - method: GET
    path: "/shippers/{shipperId}"
    description: "Get a shipper"
    roles: [Shipper, Admin]
    code: 200
    input: []
    output: Shipper
    side_effects: []

  # --- Terminal ---
  - method: POST
    path: "/terminals"
    description: "Register a terminal facility with a dock capacity and buffer"
    roles: [Broker, Admin]
    code: 201
    input: [name, dock_zip, dock_count, "buffer_minutes?"]
    output: Terminal
    side_effects: []

  - method: GET
    path: "/terminals"
    description: "List terminals"
    roles: [Shipper, Broker, Admin]
    code: 200
    input: ["dock_zip?", "limit?", "offset?"]
    output: "Terminal[]"
    side_effects: []

  - method: GET
    path: "/terminals/{terminalId}"
    description: "Get a terminal"
    roles: [Shipper, Broker, Admin]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  # --- Carrier ---
  - method: POST
    path: "/carriers"
    description: "Register a carrier onto the load board"
    roles: [Broker, Admin]
    code: 201
    input: [legal_name, mc_number, cargo_insurance_limit_cents, insurance_expiry_date, equipment_type, "rating?"]
    output: Carrier
    side_effects: ["status = ACTIVE; version = 1"]

  - method: GET
    path: "/carriers"
    description: "List carriers (filterable)"
    roles: [Broker, Admin]
    code: 200
    input: ["equipment_type?", "status?", "limit?", "offset?"]
    output: "Carrier[]"
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}"
    description: "Get a carrier"
    roles: [Broker, Admin, Carrier]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: POST
    path: "/carriers/{carrierId}/suspend"
    description: "Suspend a carrier (blocks future dispatch)"
    roles: [Admin]
    code: 200
    input: []
    output: Carrier
    side_effects: ["Carrier.status = SUSPENDED; version += 1"]

  # --- ShipmentOrder ---
  - method: POST
    path: "/shipment-orders"
    description: "Create a shipment order in DRAFT. When delivery_mode == TERMINAL, terminal_id + terminal_slot_start + terminal_slot_end are required and the terminal dock-overlap check runs."
    roles: [Shipper]
    code: 201
    input: [origin_zip, dest_zip, route_miles, transport_type, "delivery_mode?", "service_level?", pickup_window_start, pickup_window_end, "terminal_id?", "terminal_slot_start?", "terminal_slot_end?"]
    output: ShipmentOrder
    side_effects: ["status = DRAFT; shipper_id = X-User-ID; version = 1", "if TERMINAL: validate terminal dock overlap (ERR_TERMINAL_SLOT_CONFLICT)"]

  - method: GET
    path: "/shipment-orders"
    description: "List shipment orders (filterable by shipper/status/carrier/terminal)"
    roles: [Shipper, Broker, Admin]
    code: 200
    input: ["shipper_id?", "status?", "assigned_carrier_id?", "terminal_id?", "limit?", "offset?"]
    output: "ShipmentOrder[]"
    side_effects: []

  - method: GET
    path: "/shipment-orders/{orderId}"
    description: "Get a shipment order (all computed balances)"
    roles: [Shipper, Broker, Admin, Carrier]
    code: 200
    input: []
    output: ShipmentOrder
    side_effects: []

  - method: POST
    path: "/shipment-orders/{orderId}/cancel"
    description: "Cancel an order (DRAFT/QUOTED/LISTED); refunds deposit if paid"
    roles: [Shipper]
    code: 200
    input: []
    output: ShipmentOrder
    side_effects: ["status = CANCELLED; refund cascade; withdraw listing/offers; version += 1"]

  - method: POST
    path: "/shipment-orders/{orderId}/close"
    description: "Close a delivered order once balance is 0 and no open claim"
    roles: [Broker]
    code: 200
    input: []
    output: ShipmentOrder
    side_effects: ["status = CLOSED; version += 1"]

  # --- Vehicle ---
  - method: POST
    path: "/shipment-orders/{orderId}/vehicles"
    description: "Attach a vehicle to a DRAFT order"
    roles: [Shipper]
    code: 201
    input: [make, model, year, "is_inoperable?", declared_value_cents]
    output: Vehicle
    side_effects: ["Vehicle.order_id set", "increments ShipmentOrder.version by 1 (the order's pricing basis changed)"]

  - method: GET
    path: "/vehicles"
    description: "List vehicles, filterable by order"
    roles: [Shipper, Broker, Admin, Carrier]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicleId}"
    description: "Get a vehicle"
    roles: [Shipper, Broker, Admin, Carrier]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  # --- Quote ---
  - method: POST
    path: "/shipment-orders/{orderId}/quotes"
    description: "Generate a priced quote for the order's current vehicles. Requires expected_order_version (OCC) so a quote is never priced on a stale vehicle set."
    roles: [Shipper, Broker]
    code: 201
    input: [expected_order_version]
    output: Quote
    side_effects: ["OCC: reject if expected_order_version != ShipmentOrder.version (ERR_STALE_VERSION)", "run calc quote_pricing; set all computed price fields; status = OFFERED; valid_until = created_at + 72h; prior OFFERED quotes -> SUPERSEDED", "increments ShipmentOrder.version by 1"]

  - method: GET
    path: "/quotes"
    description: "List quotes, filterable by order"
    roles: [Shipper, Broker, Admin]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: "Quote[]"
    side_effects: []

  - method: GET
    path: "/quotes/{quoteId}"
    description: "Get a quote"
    roles: [Shipper, Broker, Admin]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/shipment-orders/{orderId}/quotes/{quoteId}/accept"
    description: "Accept a quote, locking the price and computing deposit/COD split"
    roles: [Shipper]
    code: 200
    input: []
    output: ShipmentOrder
    side_effects: ["order DRAFT->QUOTED; deposit_split; version += 1"]

  # --- LedgerEntry ---
  - method: POST
    path: "/shipment-orders/{orderId}/ledger-entries"
    description: "Post a payment/refund/payout ledger entry"
    roles: [Broker, Admin]
    code: 201
    input: [kind, amount_cents]
    output: LedgerEntry
    side_effects: ["status = POSTED; run calc order_balance_reconciliation on the order"]

  - method: GET
    path: "/ledger-entries"
    description: "List ledger entries, filterable by order"
    roles: [Broker, Admin, Shipper]
    code: 200
    input: ["order_id?", "kind?", "status?", "limit?", "offset?"]
    output: "LedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/ledger-entries/{ledgerEntryId}"
    description: "Get a ledger entry"
    roles: [Broker, Admin, Shipper]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: POST
    path: "/ledger-entries/{ledgerEntryId}/void"
    description: "Void a posted ledger entry"
    roles: [Admin]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: ["status = VOIDED; recompute order balances"]

  # --- LoadListing ---
  - method: POST
    path: "/shipment-orders/{orderId}/listings"
    description: "Post a quoted order to the load board"
    roles: [Broker]
    code: 201
    input: [offered_carrier_pay_cents]
    output: LoadListing
    side_effects: ["order QUOTED->LISTED; listing OPEN; expedited mirror; version += 1"]

  - method: GET
    path: "/listings"
    description: "List load-board listings, filterable by order/status"
    roles: [Broker, Admin, Carrier]
    code: 200
    input: ["order_id?", "status?", "expedited?", "limit?", "offset?"]
    output: "LoadListing[]"
    side_effects: []

  - method: GET
    path: "/listings/{listingId}"
    description: "Get a listing"
    roles: [Broker, Admin, Carrier]
    code: 200
    input: []
    output: LoadListing
    side_effects: []

  # --- DispatchOffer ---
  - method: POST
    path: "/listings/{listingId}/offers"
    description: "Carrier bids on an open listing"
    roles: [Carrier]
    code: 201
    input: [ask_pay_cents, pickup_eta]
    output: DispatchOffer
    side_effects: ["offer PENDING; carrier_id = X-User-ID; recompute listing.best_offer_id"]

  - method: GET
    path: "/offers"
    description: "List dispatch offers, filterable by listing/carrier"
    roles: [Broker, Admin, Carrier]
    code: 200
    input: ["listing_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: "DispatchOffer[]"
    side_effects: []

  - method: GET
    path: "/offers/{offerId}"
    description: "Get a dispatch offer"
    roles: [Broker, Admin, Carrier]
    code: 200
    input: []
    output: DispatchOffer
    side_effects: []

  - method: POST
    path: "/listings/{listingId}/offers/{offerId}/counter"
    description: "Broker counters a pending offer"
    roles: [Broker]
    code: 200
    input: [counter_pay_cents]
    output: DispatchOffer
    side_effects: ["offer PENDING->COUNTERED; round_no += 1"]

  - method: POST
    path: "/listings/{listingId}/offers/{offerId}/reoffer"
    description: "Carrier re-asks after a counter"
    roles: [Carrier]
    code: 200
    input: [ask_pay_cents, "pickup_eta?"]
    output: DispatchOffer
    side_effects: ["offer COUNTERED->PENDING; ask updated; round_no += 1; recompute best_offer_id"]

  - method: POST
    path: "/listings/{listingId}/offers/{offerId}/withdraw"
    description: "Carrier withdraws its offer"
    roles: [Carrier]
    code: 200
    input: []
    output: DispatchOffer
    side_effects: ["offer -> WITHDRAWN; recompute best_offer_id"]

  - method: POST
    path: "/listings/{listingId}/offers/{offerId}/accept"
    description: "Broker accepts an offer, dispatching the carrier (runs schedule-overlap, equipment, insurance-expiry and per_load insurance-adequacy gates)"
    roles: [Broker]
    code: 200
    input: []
    output: Assignment
    side_effects: ["order LISTED->DISPATCHED; create Assignment; listing AWARDED; sibling PENDING/COUNTERED offers DECLINED; recompute Carrier.aggregate_exposure_cents; order.version += 1"]

  # --- Assignment ---
  - method: GET
    path: "/assignments"
    description: "List assignments, filterable by order/carrier/offer"
    roles: [Broker, Admin, Carrier]
    code: 200
    input: ["order_id?", "carrier_id?", "offer_id?", "status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/assignments/{assignmentId}"
    description: "Get an assignment"
    roles: [Broker, Admin, Carrier]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/assignments/{assignmentId}/revoke"
    description: "Broker revokes a dispatch before pickup, reopening the listing"
    roles: [Broker]
    code: 200
    input: []
    output: Assignment
    side_effects: ["order DISPATCHED->LISTED; assignment REVOKED; listing reopened OPEN; order.version += 1"]

  # --- Inspection ---
  - method: POST
    path: "/shipment-orders/{orderId}/inspections"
    description: "Record a BOL inspection (PICKUP advances to PICKED_UP, DELIVERY to DELIVERED)"
    roles: [Carrier]
    code: 201
    input: [phase, "damage_count?", "observed_inoperable_count?", odometer]
    output: Inspection
    side_effects: ["order state advances; DELIVERY completes assignment; version += 1"]

  - method: GET
    path: "/inspections"
    description: "List inspections, filterable by order/signing carrier"
    roles: [Shipper, Broker, Admin, Carrier]
    code: 200
    input: ["order_id?", "signed_by_carrier_id?", "phase?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/inspections/{inspectionId}"
    description: "Get an inspection"
    roles: [Shipper, Broker, Admin, Carrier]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/shipment-orders/{orderId}/claims"
    description: "Shipper files a damage claim against the responsible carrier"
    roles: [Shipper]
    code: 201
    input: [claimed_cents]
    output: Claim
    side_effects: ["claim SUBMITTED; carrier_id = order.assigned_carrier_id; Order.has_open_claim = true"]

  - method: GET
    path: "/claims"
    description: "List claims, filterable by order/carrier/status"
    roles: [Shipper, Broker, Admin, Carrier]
    code: 200
    input: ["order_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/claims/{claimId}"
    description: "Get a claim"
    roles: [Shipper, Broker, Admin, Carrier]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/return"
    description: "Admin returns a claim for more info"
    roles: [Admin]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim SUBMITTED->RETURNED_FOR_INFO"]

  - method: POST
    path: "/claims/{claimId}/resubmit"
    description: "Shipper resubmits a returned claim"
    roles: [Shipper]
    code: 200
    input: [claimed_cents]
    output: Claim
    side_effects: ["claim RETURNED_FOR_INFO->SUBMITTED; claimed_cents updated"]

  - method: POST
    path: "/claims/{claimId}/approve"
    description: "Admin approves a claim, computing the insurance-capped payout"
    roles: [Admin]
    code: 200
    input: []
    output: Claim
    side_effects: ["run calc claim_adjudication; claim SUBMITTED->APPROVED"]

  - method: POST
    path: "/claims/{claimId}/deny"
    description: "Admin denies a claim"
    roles: [Admin]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim -> DENIED; Order.has_open_claim recomputed"]

  - method: POST
    path: "/claims/{claimId}/pay"
    description: "Admin pays an approved claim, posting the payout to the ledger"
    roles: [Admin]
    code: 200
    input: []
    output: Claim
    side_effects: ["post CLAIM_PAYOUT ledger entry; recompute balances; claim -> PAID; has_open_claim recomputed"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. Governs quote expiry and insurance expiry checks."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced path resource does not exist" }
  - { id: ERR_NOT_ORDER_OWNER, http: 403, condition: "Acting shipper is not the order's owner" }
  - { id: ERR_NOT_OFFER_OWNER, http: 403, condition: "Acting carrier is not the offer's owner" }
  - { id: ERR_NOT_ASSIGNED_CARRIER, http: 403, condition: "Acting carrier is not the order's assigned carrier" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: bad enum, non-positive miles, window end <= start, non-positive amounts" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the requested transition (generic)" }
  - { id: ERR_NO_VEHICLES, http: 409, condition: "Quote acceptance attempted on an order with no vehicles" }
  - { id: ERR_QUOTE_NOT_OFFERED, http: 409, condition: "Quote is not in OFFERED state at acceptance" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "current_utc > Quote.valid_until at acceptance" }
  - { id: ERR_DEPOSIT_NOT_PAID, http: 402, condition: "Listing attempted before deposit is paid" }
  - { id: ERR_PAY_EXCEEDS_TOTAL, http: 402, condition: "Carrier pay exceeds order.quoted_total_cents" }
  - { id: ERR_OVERPAYMENT, http: 402, condition: "COD_PAYMENT amount exceeds outstanding_balance_cents" }
  - { id: ERR_OFFER_NOT_ACTIVE, http: 409, condition: "Offer not in PENDING/COUNTERED for the requested action" }
  - { id: ERR_LISTING_NOT_OPEN, http: 409, condition: "Listing not OPEN for offer/counter action" }
  - { id: ERR_CARRIER_SUSPENDED, http: 409, condition: "Carrier is SUSPENDED at dispatch" }
  - { id: ERR_EQUIPMENT_MISMATCH, http: 409, condition: "Carrier equipment_type != order.transport_type at dispatch" }
  - { id: ERR_INSURANCE_EXPIRED, http: 409, condition: "Carrier insurance certificate expired at dispatch" }
  - { id: ERR_INSURANCE_INADEQUATE, http: 409, condition: "Carrier insurance limit < sum of declared vehicle values at dispatch" }
  - { id: ERR_PICKUP_ETA_OUT_OF_WINDOW, http: 422, condition: "Offer pickup_eta outside the order pickup window" }
  - { id: ERR_TERMINAL_SLOT_CONFLICT, http: 409, condition: "TERMINAL-mode order's dock slot exceeds terminal dock_count under buffered closed-interval overlap" }
  - { id: ERR_CARRIER_SCHEDULE_CONFLICT, http: 409, condition: "Carrier already has an active assignment whose pickup window half-open-overlaps this order's window" }
  - { id: ERR_ASSIGNMENT_NOT_DISPATCHED, http: 409, condition: "Revoke attempted on a non-DISPATCHED assignment" }
  - { id: ERR_ALREADY_PICKED_UP, http: 409, condition: "Revoke attempted after a PICKUP inspection exists" }
  - { id: ERR_DUPLICATE_INSPECTION, http: 409, condition: "A duplicate or out-of-order inspection phase was submitted" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 409, condition: "Close attempted while outstanding_balance_cents > 0" }
  - { id: ERR_OPEN_CLAIM, http: 409, condition: "Close attempted while an open claim exists" }
  - { id: ERR_CLAIM_NOT_ACTIONABLE, http: 409, condition: "Claim not in a state that permits the requested transition" }
  - { id: ERR_NO_DAMAGE_ON_RECORD, http: 409, condition: "Claim approval attempted with no DELIVERY damage on record" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_DUPLICATE_MC_NUMBER, http: 409, condition: "Carrier mc_number already registered" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Shipper email already registered" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Shipper
    description: "The customer who ships vehicles; owns orders, vehicles, quotes acceptance, and claims."
    identity: "entity_backed:Shipper"
    exclusive_operations:
      - "POST /shipment-orders"
      - "POST /shipment-orders/{orderId}/vehicles"
      - "POST /shipment-orders/{orderId}/quotes/{quoteId}/accept"
      - "POST /shipment-orders/{orderId}/cancel"
      - "POST /shipment-orders/{orderId}/claims"
      - "POST /claims/{claimId}/resubmit"
    shared_operations:
      - "POST /shipment-orders/{orderId}/quotes (with Broker)"
      - "GET reads on own orders, vehicles, quotes, claims, ledger, inspections"

  - name: Broker
    description: "Dispatch operator running the load board; posts listings, negotiates offers, dispatches, revokes, closes, posts ledger."
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers"
      - "POST /shipment-orders/{orderId}/listings"
      - "POST /listings/{listingId}/offers/{offerId}/counter"
      - "POST /listings/{listingId}/offers/{offerId}/accept"
      - "POST /assignments/{assignmentId}/revoke"
      - "POST /shipment-orders/{orderId}/close"
    shared_operations:
      - "POST /shipment-orders/{orderId}/quotes (with Shipper)"
      - "POST /shipment-orders/{orderId}/ledger-entries (with Admin)"
      - "POST /terminals (with Admin)"
      - "GET reads on listings, offers, orders, carriers, assignments, terminals"

  - name: Carrier
    description: "Trucking company that bids on and hauls loads; owns offers, records BOL inspections."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /listings/{listingId}/offers"
      - "POST /listings/{listingId}/offers/{offerId}/reoffer"
      - "POST /listings/{listingId}/offers/{offerId}/withdraw"
      - "POST /shipment-orders/{orderId}/inspections"
    shared_operations:
      - "GET reads on listings, own offers, own assignments, orders, inspections"

  - name: Admin
    description: "Platform superuser; adjudicates claims, suspends carriers, posts/voids ledger entries."
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers/{carrierId}/suspend"
      - "POST /ledger-entries/{ledgerEntryId}/void"
      - "POST /claims/{claimId}/return"
      - "POST /claims/{claimId}/approve"
      - "POST /claims/{claimId}/deny"
      - "POST /claims/{claimId}/pay"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /carriers (with Broker)"
      - "POST /terminals (with Broker)"
      - "POST /shipment-orders/{orderId}/ledger-entries (with Broker)"
      - "GET reads on all resources"
