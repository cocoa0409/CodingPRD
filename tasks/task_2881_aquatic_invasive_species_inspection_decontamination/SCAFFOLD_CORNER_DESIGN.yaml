              captures: { agr_id: $.data.id }
          assert:
            - "the trigger returns 201, and every setup call returned its declared success code: 200 for the clock, 201 for the water body, 200 for the drainage PATCH, 201 for the station, 201 for the hours row, 200 for the status transition, 201 for the inspector"
            - "GET /inspection-stations/${st_id} shows status == OPEN and seal_stock_count == 5, so the exclusive transition really executed its side effects"
            - "GET /water-bodies/${wb_id} shows risk_tier == MODERATE, so the exclusive PATCH really landed"
            - "none of these calls required an X-User-ID that resolves to an Inspector row, because ProgramAdmin identity is opaque"

      - name: cross_role_denied_each_role_is_barred_from_the_others_exclusive_operations
