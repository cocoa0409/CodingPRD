    output: "RetailCrossSell[]"
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by every temporal rule, deadline, validity window and expiry in this scaffold. The server starts with the logical clock fixed at 2026-09-01T00:00:00Z and never reads wall-clock time; the clock advances only through this endpoint, monotonically forward. A to_iso8601 earlier than the current value is accepted as a rewind and then makes every mutating call fail with ERR_BACKDATED_ACTION until the clock is advanced forward again."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, highest_set_utc: datetime }"
    side_effects: ["every deadline, screening validity window, certificate expiry, pharmacy hold and occupancy recalculation is evaluated against the new clock value"]

errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is absent, or names a role that is not declared in §1.7"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The acting role is not permitted for this operation"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong type, unknown field, or an enum member outside the declared set"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "No store matches the storeId in the path"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "No member matches the memberId in the path"
  - id: ERR_PET_NOT_FOUND
    http: 404
    condition: "No pet matches the petId in the path or the pet_id in the body"
  - id: ERR_SERVICE_BAY_NOT_FOUND
    http: 404
    condition: "No service bay matches the bayId in the path or the bay_id in the body"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "No service booking matches the bookingId in the path"
  - id: ERR_ENCOUNTER_NOT_FOUND
    http: 404
    condition: "No veterinary encounter matches the encounterId in the path"
  - id: ERR_CLINIC_NOT_FOUND
    http: 404
    condition: "No vaccination clinic matches the clinicId in the path"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "No vaccination visit matches the visitId in the path"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "No prescription authorization matches the authorizationId in the path"
  - id: ERR_PHARMACY_ORDER_NOT_FOUND
    http: 404
    condition: "No pharmacy order matches the orderId in the path"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "No incident record matches the incidentId in the path"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "No service package matches the packageId in the path"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No billing cycle matches the requested cycle index"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "No training enrollment matches the enrollmentId in the path"
  - id: ERR_CROSS_SELL_NOT_FOUND
    http: 404
    condition: "No retail cross-sell matches the crossSellId in the path"
  - id: ERR_BREED_RULE_NOT_FOUND
    http: 404
    condition: "No breed handling rule matches the ruleId in the path"
  - id: ERR_STORE_CODE_DUPLICATE
    http: 409
    condition: "A store with this store_code already exists"
  - id: ERR_MEMBER_EMAIL_DUPLICATE
    http: 409
    condition: "A member with this email already exists"
  - id: ERR_BAY_CODE_DUPLICATE
    http: 409
    condition: "A service bay with this bay_code already exists in the store"
  - id: ERR_BREED_RULE_DUPLICATE
    http: 409
    condition: "A breed handling rule for this breed and species already exists"
  - id: ERR_CERTIFICATE_SERIAL_DUPLICATE
    http: 409
    condition: "The allocated rabies certificate serial is already in use"
  - id: ERR_PACKAGE_ALREADY_ACTIVE
    http: 409
    condition: "The member already holds an ACTIVE service package at this tier"
  - id: ERR_MEMBER_HOME_STORE_MISMATCH
    http: 409
    condition: "The member's home_store_id is not the storeId in the path"
  - id: ERR_PET_MEMBER_MISMATCH
    http: 409
    condition: "The pet_id in the body does not belong to the member identified by the path or by the owning resource"
  - id: ERR_BOOKING_PET_MISMATCH
    http: 409
    condition: "The booking's pet_id does not match the pet named elsewhere in the request"
  - id: ERR_VISIT_CLINIC_MISMATCH
    http: 409
    condition: "The vaccination visit's clinic_id does not belong to the storeId in the path"
  - id: ERR_AUTHORIZATION_PET_MISMATCH
    http: 409
    condition: "The prescription's pet_id does not match the pet of the named encounter or pharmacy order"
  - id: ERR_UNDERLYING_EXAM_REQUIRED
    http: 409
    condition: "A prescription may only be raised from an encounter whose pet is the prescribed pet"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent row's current version"
  - id: ERR_MISSING_EXPECTED_VERSION
    http: 400
    condition: "A mutating call against a versioned parent omitted expected_<parent>_version"
  - id: ERR_BACKDATED_ACTION
    http: 422
    condition: "The logical clock is earlier than the clock value already used to create or read the target resource, so the mutation would backdate history"
  - id: ERR_STORE_HOSPITAL_FROZEN
    http: 409
    condition: "The parent store's hospital_posture is FROZEN and the operation is a hospital-partition mutation"
  - id: ERR_STORE_NOT_RESTRICTED
    http: 409
    condition: "The store must be RESTRICTED before it may be escalated to FROZEN"
  - id: ERR_HOSPITAL_AT_CAPACITY
    http: 409
    condition: "The store's occupied encounter count is at or above hospital_capacity, or a posture escalation was requested while occupancy is below capacity"
  - id: ERR_BAY_NOT_ACTIVE
    http: 409
    condition: "The parent service bay's status is not ACTIVE"
  - id: ERR_BAY_HAS_ACTIVE_BOOKINGS
    http: 409
    condition: "The bay still holds a booking in {REQUESTED, SCREENED, BAY_CONFIRMED, IN_SERVICE} and cannot be disabled"
  - id: ERR_BAY_SLOT_CONFLICT
    http: 409
    condition: "The requested half-open window overlaps an existing non-terminal booking on the same bay"
  - id: ERR_PET_DOUBLE_BOOKED
    http: 409
    condition: "The pet's buffered window overlaps a non-terminal booking of the same pet in a different bay"
  - id: ERR_BOOKING_NOT_SCREENABLE
    http: 409
    condition: "The booking is not in REQUESTED and therefore cannot be screened"
  - id: ERR_BOOKING_NOT_GROOMING
    http: 409
    condition: "The booking's service_type is not GROOMING and therefore has no grooming screening"
  - id: ERR_BOOKING_NOT_SCREENED
    http: 409
    condition: "A grooming booking is not in SCREENED and therefore cannot be bay-confirmed"
  - id: ERR_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "The booking is not in BAY_CONFIRMED and therefore cannot enter service"
  - id: ERR_BOOKING_NOT_IN_SERVICE
    http: 409
    condition: "The booking is not in IN_SERVICE and therefore cannot be completed"
  - id: ERR_BOOKING_NOT_CANCELLABLE
    http: 409
    condition: "The booking is not in BAY_CONFIRMED and therefore cannot be cancelled"
  - id: ERR_BOOKING_END_NOT_AFTER_START
    http: 400
    condition: "ends_at is not strictly after starts_at, or ends_at is absent while starts_at is present"
  - id: ERR_HIGH_RISK_NOT_ACKNOWLEDGED
    http: 422
    condition: "The grooming screening score is at or above 70 and aggression_acknowledged is not true"
  - id: ERR_BREED_NOT_GROOMABLE
    http: 422
    condition: "The pet's breed matches a BreedHandlingRule whose allowed_for_grooming is false"
  - id: ERR_CLINIC_NOT_OPEN
    http: 409
    condition: "The walk-in clinic's clinic_status is not OPEN"
  - id: ERR_CLINIC_STORE_NOT_OPEN
    http: 409
    condition: "The retail store's hospital_posture is not OPEN, so walk-ins may not be opened"
  - id: ERR_CLINIC_COVERAGE_REQUIRED
    http: 400
    condition: "coverage_required is true but coverage_provider is empty, or the clinic is being opened on a date other than its clinic_date"
  - id: ERR_CLINIC_WINDOW_INVALID
    http: 400
    condition: "close_time is not strictly after open_time"
  - id: ERR_CLINIC_OVERLAP
    http: 409
    condition: "Another walk-in clinic of the same store already holds an overlapping open_time..close_time window on that clinic_date"
  - id: ERR_CLINIC_HAS_OPEN_VISITS
    http: 409
    condition: "A visit of this clinic remains in {REGISTERED, CERTIFICATE_ISSUED, REPORT_REQUIRED} and the clinic cannot be closed"
  - id: ERR_VISIT_NOT_RABIES
    http: 409
    condition: "The visit's vaccine_type is not RABIES and therefore no rabies certificate may be issued"
  - id: ERR_VISIT_OUTSIDE_WINDOW
    http: 422
    condition: "The logical clock lies outside the clinic's own open_time..close_time walk-in window"
  - id: ERR_VISIT_WEEKEND_BLOCKED
    http: 422
    condition: "The logical clock falls on a Saturday or Sunday, so no certificate may be issued on that day"
  - id: ERR_PRIOR_VACCINATION_NOT_PRIOR
    http: 422
    condition: "prior_rabies_vaccination_date is on or after the issuing clinic's date"
  - id: ERR_VISIT_NOT_REPORTABLE
    http: 409
    condition: "The visit is not in REPORT_REQUIRED and therefore has nothing to report"
  - id: ERR_VISIT_ALREADY_REPORTED
    http: 409
    condition: "The visit's state_report_status is already SUBMITTED"
  - id: ERR_ENCOUNTER_NOT_CHECKED_IN
    http: 409
    condition: "The encounter is not in CHECKED_IN and therefore the exam cannot start"
  - id: ERR_ENCOUNTER_NOT_IN_EXAM
    http: 409
    condition: "The encounter is not in IN_EXAM and therefore cannot be completed"
  - id: ERR_ENCOUNTER_NOT_CANCELLABLE
    http: 409
    condition: "The encounter is not in {SCHEDULED, CHECKED_IN} and therefore cannot be cancelled"
  - id: ERR_ENCOUNTER_BLOCKED_PHARMACY_HOLD
    http: 409
    condition: "The store's pharmacy_hold_until is still in the future, so hospital activity is blocked"
  - id: ERR_PHARMACY_HOLD_ACTIVE
    http: 409
    condition: "The store's pharmacy is held and no new pharmacy handoff may be authorized or dispensed"
  - id: ERR_QUANTITY_EXCEEDS_AUTHORIZATION
    http: 402
    condition: "The requested handoff quantity exceeds the authorizing prescription's remaining quantity"
  - id: ERR_AUTHORIZATION_NOT_ACTIVE
    http: 409
    condition: "The prescription is not in {AUTHORIZED, PARTIALLY_DISPENSED}, or the logical clock is past its expires_at, so it funds no handoff"
  - id: ERR_PHARMACY_ORDER_NOT_AUTHORIZED
    http: 409
    condition: "The pharmacy order is not in AUTHORIZED and therefore cannot be dispensed or rejected"
  - id: ERR_INCIDENT_NOT_REVIEWABLE
    http: 409
    condition: "The incident is not in UNREVIEWED and therefore cannot enter review"
  - id: ERR_INCIDENT_NOT_UNDER_REVIEW
    http: 409
    condition: "The incident is not in UNDER_REVIEW and therefore cannot be approved or returned to the queue"
  - id: ERR_INCIDENT_NOT_DENIABLE
    http: 409
    condition: "The incident is already DENIED, which is terminal"
  - id: ERR_INCIDENT_BOOKING_TYPE_MISMATCH
    http: 409
    condition: "The incident references a booking whose service_type is not GROOMING"
  - id: ERR_CLAIM_CAP_EXCEEDED
    http: 402
    condition: "The claim amount exceeds the store state's cap and no override_reason was supplied"
  - id: ERR_PET_ARCHIVED
    http: 409
    condition: "The pet is ARCHIVED, so grooming screening, claim approval and course starts are refused"
  - id: ERR_PACKAGE_NOT_ACTIVE
    http: 409
    condition: "The service package is not ACTIVE"
  - id: ERR_PACKAGE_NOT_PAUSED
    http: 409
    condition: "The service package is not PAUSED"
  - id: ERR_ENROLLMENT_NOT_RESTRICTED
    http: 409
    condition: "The training enrollment is not RESTRICTED"
  - id: ERR_ENROLLMENT_NOT_IN_PROGRESS
    http: 409
    condition: "The training enrollment is not IN_PROGRESS"
  - id: ERR_COURSES_ALREADY_COMPLETE
    http: 409
    condition: "courses_needed is already 0, so no further course may be started"
  - id: ERR_MEMBER_SUSPENDED
    http: 409
    condition: "The member's status is not ACTIVE"
  - id: ERR_ILLEGAL_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared for the resource's current state"

roles:
  - name: PlatformAdmin
    description: "Operational administrator who owns the store estate, breed handling rules and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /stores — create a pet care center"
      - "POST /stores/{storeId}/restrict — escalate to RESTRICTED"
      - "POST /stores/{storeId}/lift-posture-restriction — release to OPEN"
      - "POST /stores/{storeId}/freeze-hospital — escalate to FROZEN"
      - "POST /stores/{storeId}/reopen-hospital — return to OPEN"
      - "POST /breed-handling-rules — register a breed handling rule"
      - "POST /_clock/set_current_utc — advance the logical clock"
      - "POST /stores/{storeId}/_bump-occupancy-v1 — test-driving occupancy bump"
    shared_operations: []
  - name: StoreManager
    description: "Store-level manager who owns membership, bay confirmation, claims, package billing and pet archiving"
    identity: opaque
    exclusive_operations:
      - "POST /stores/members — register a member"
