  - rule_id: resource_temporal_overlap
    instances:
      - name: manual_disqualification_closed_interval_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_DISQUALIFICATION_OVERLAP]
          - entities.Disqualification.fields.end_date
        distinguishing_aspect: |
          CLOSED-interval semantics on the DriverRecord resource: manual disqualification windows
          include both boundary days, so [2026-09-10, 2026-10-10] and [2026-10-10, 2026-11-09]
          collide on the shared day 2026-10-10, while the truly disjoint [2026-10-11, 2026-11-09]
          is accepted.
        test_recipe:
          setup:
            - "Jurisdiction AA is ACTIVE with a CERTIFIED POINTER_NETWORK participation"
            - "Driver D's ACTIVE record is held by AA (no disqualifications yet)"
          setup_api_calls:
