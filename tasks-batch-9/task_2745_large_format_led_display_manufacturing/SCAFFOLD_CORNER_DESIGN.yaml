      - name: replacement_more_than_one_bin_away_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=51]
          - errors.ERR_COLOR_BIN_MISMATCH
          - calculations.module_color_bin_assignment
        distinguishing_aspect: |
          The colour-match rule is a distance test on an ordinal that neither module
          carries in its request: both bins are computed at calibration time from a
          chroma error and a brightness floor, and the check compares |rank delta|
          against COLOR_BIN_RANK_TOLERANCE = 1. A B2 spare (rank 3) against an A1
          original (rank 0) is a legal, calibrated, correctly reserved module of the
          right display model — it fails on colour distance alone — while an A2 spare
          sits exactly ON the tolerance and must be accepted, so an implementation
          using `==` on color_bin instead of the rank delta passes the negative case
          and fails the positive one.
        test_recipe:
          setup:
            - "The commissioned FP16-STD wall (contract ${sc} GOLD/ACTIVE, cabinet ${cab} holding ${m1} = A1 rank 0 in slot 1 and ${m2} = A1 in slot 2)."
            - "Two spares are calibrated and reserved to ${sc}: ${sb2} lands in B2 (chroma 0.0050, 4700 nits -> rank 3) and ${sa2} lands in A2 (chroma 0.0002, 4700 nits -> rank 1)."
            - "A MODULE_FAULT case ${case} naming ${m1} has been responded to and APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
