        distinguishing_aspect: |
          Two inclusive integer breakpoints meet on the same audit: units_affected 4999 leaves CARE_UNSUBSTANTIATED at MAJOR while 5000 escalates it to CRITICAL, and the brand turns RESTRICTED at exactly 3 critical findings, not at 4 - so the second and third criticals must leave the posture OPEN and the third must flip it.
