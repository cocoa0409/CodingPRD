# =============================================================================
# PRD Benchmark Scaffold — task_3083_payroll_service_bureau_tax_filing_agency_client
# Payroll Service Bureau Tax Filing Agency & Client Fund Management (ADP-style)
# =============================================================================

scenario: |
  Payroll Service Bureau Tax Filing Agency & Client Fund Management (ADP): client onboarding with
  jurisdiction registration verification and power of attorney for tax filing, impound of payroll
  and tax funds from client accounts with settlement timing and float, tax deposit scheduling by
  jurisdiction frequency with penalty exposure for late deposits, quarterly and annual return
  filing with agency reconciliation and amendment processing, agency notice handling where the
  bureau resolves discrepancies on the client's behalf, client credit risk assessment for funding
  failures and reversal of drafted payrolls, multi-jurisdiction registration onboarding delays and
  interim manual filings, year-end wage statement production and correction cycles

domain_name: payroll-service-bureau
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - contagion_risk_propagation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Bureau-scoped unique jurisdiction code, e.g. FED-941, CA-DE9, NY-NYS45" }
      - { name: name, type: string, source: input, description: "Display name of the tax agency jurisdiction" }
      - { name: deposit_frequency, type: enum, source: input, description: "SEMIWEEKLY | MONTHLY | QUARTERLY — drives TaxDeposit scheduling and penalty tiers" }
      - { name: penalty_tier1_rate, type: number, source: input, description: "Fraction of the shortfall charged when 1-5 calendar days late (e.g. 0.02)" }
      - { name: penalty_tier2_rate, type: number, source: input, description: "Fraction of the shortfall charged when 6-15 calendar days late (e.g. 0.05)" }
      - { name: penalty_tier3_rate, type: number, source: input, description: "Fraction of the shortfall charged when 16+ calendar days late (e.g. 0.10)" }
      - { name: underpayment_threshold_cents, type: integer, source: input, description: "Quarterly deposits at or above this total excuse the quarterly balance-due shortfall penalty (e.g. 250000 = $2,500)" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive jurisdictions cannot receive new registrations or deposits" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Client legal entity name" }
      - { name: ein, type: string, source: input, description: "Employer identification number; unique among non-terminated clients" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ONBOARDING | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: risk_posture, type: enum, source: computed, description: "NORMAL | ELEVATED | HIGH — derived from funding-failure strikes per client_credit_risk_posture" }
      - { name: funding_failure_count, type: integer, source: computed, description: "Total unresolved FundingFailureEvent strikes driving risk_posture (0-3+)" }
      - { name: credit_hold, type: boolean, source: system, default: false, description: "Compliance-imposed hold; blocks ALL new impounds regardless of posture" }
      - { name: onboarded_at, type: datetime, source: system, description: "Timestamp the client reached ACTIVE" }

  - name: JurisdictionRegistration
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction being registered" }
      - { name: agency_account_number, type: string, source: input, description: "Client's account number with the tax agency" }
      - { name: poa_document_ref, type: string, source: input, description: "Reference to the signed power-of-attorney document for this jurisdiction" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED" }
      - { name: verified_at, type: datetime, source: system, description: "Timestamp verification was recorded" }
      - { name: rejected_reason, type: string, source: system, description: "Reason recorded on rejection" }

  - name: PayrollRun
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client" }
      - { name: pay_date, type: datetime, source: input, description: "Date employees are paid (date-only; times normalized to 00:00:00Z)" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the pay period" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive end of the pay period; must be >= period_start" }
      - { name: gross_pay_cents, type: integer, source: input, description: "Total gross wages in cents" }
      - { name: total_tax_cents, type: integer, source: input, description: "Total employer+employee tax withheld in cents" }
      - { name: impound_amount_cents, type: integer, source: computed, description: "gross_pay_cents + total_tax_cents — amount drafted from the client account" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | IMPOUNDED | SETTLED | REVERSED | CANCELLED" }
      - { name: funding_model, type: enum, source: computed, description: "STANDARD | WIRE_REQUIRED — effective funding rule after risk-posture override" }
      - { name: funding_confirmed_at, type: datetime, source: system, description: "When the client confirmed same-day wire funding (WIRE_REQUIRED runs only)" }

  - name: Impound
    parent: PayrollRun
    common_fields: true
    fields:
      - { name: payroll_run_id, type: string, source: system, description: "FK -> PayrollRun.id; the run this impound funds" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; denormalized owning client" }
      - { name: amount_cents, type: integer, source: system, description: "Drafted amount; equals the run's impound_amount_cents" }
      - { name: initiated_at, type: datetime, source: system, description: "When the draft was initiated" }
      - { name: due_by, type: datetime, source: computed, description: "initiated_at + 2 business days (STANDARD) or end of initiated_at day (WIRE_REQUIRED); weekend/holiday roll per settlement_timing" }
      - { name: settled_at, type: datetime, source: system, description: "When funds settled into the bureau tax account" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED | FAILED | RETURNED" }

  - name: FundingFailureEvent
    parent: Impound
    common_fields: false
    fields:
      - { name: impound_id, type: string, source: system, description: "FK -> Impound.id; the failed impound" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; denormalized owning client" }
      - { name: kind, type: enum, source: system, description: "NSF_RETURN | WIRE_NOT_CONFIRMED" }
      - { name: occurred_at, type: datetime, source: system, description: "When the failure was recorded" }
      - { name: resolved_at, type: datetime, source: system, description: "When treasury marked the strike cured (null while unresolved)" }
      - { name: strike_count_after, type: integer, source: system, description: "Client.funding_failure_count immediately after this event was applied (audit snapshot)" }

  - name: TaxDeposit
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; destination agency" }
      - { name: payroll_run_id, type: string, source: system, description: "FK -> PayrollRun.id; the SETTLED run whose tax funds back this deposit" }
      - { name: amount_cents, type: integer, source: input, description: "Deposit amount in cents" }
      - { name: due_date, type: datetime, source: computed, description: "Statutory due date per deposit_due_date (frequency + pay_date)" }
      - { name: quarter, type: string, source: computed, description: "Quarter bucket of pay_date, e.g. 2026-Q3" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SUBMITTED | CONFIRMED | FAILED | CANCELLED" }
      - { name: submitted_at, type: datetime, source: system, description: "When remitted to the agency" }
      - { name: confirmed_at, type: datetime, source: system, description: "When the agency accepted the deposit" }
      - { name: late_days, type: integer, source: computed, description: "max(0, calendar days between due_date and confirmed_at); 0 while unconfirmed" }
      - { name: penalty_exposure_cents, type: integer, source: computed, description: "Late-deposit penalty per late_deposit_penalty; 0 when on time" }

  - name: TaxReturn
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; agency the return is filed with" }
      - { name: period, type: string, source: input, description: "Return period: QUARTERLY uses 2026-Q3 form; ANNUAL uses 2026 form" }
      - { name: filing_method, type: enum, source: computed, description: "ELECTRONIC | MANUAL_INTERIM — MANUAL_INTERIM when the registration is still PENDING" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | ACCEPTED | RECONCILED | AMENDED | REJECTED" }
      - { name: expected_liability_cents, type: integer, source: computed, description: "Liability expected per agency_liability_reconciliation for the period" }
      - { name: filed_at, type: datetime, source: system, description: "When the return was filed" }
      - { name: reconciled_at, type: datetime, source: system, description: "When agency reconciliation completed" }
      - { name: supersedes_return_id, type: string, source: system, description: "FK -> TaxReturn.id; self-referential link to the AMENDED return this filing supersedes (null unless this return is an amendment filing)" }
      - { name: shortfall_penalty_exposure_cents, type: integer, source: computed, description: "Quarterly balance-due penalty per shortfall_penalty; 0 when the safe-harbor threshold is met" }

  - name: ReturnAmendment
    parent: TaxReturn
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; the ACCEPTED or RECONCILED return being amended" }
      - { name: reason, type: string, source: input, description: "Free-text reason for the amendment" }
      - { name: adjusted_liability_cents, type: integer, source: input, description: "Corrected liability in cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | ACCEPTED | REJECTED" }

  - name: AgencyNotice
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; client the bureau represents" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; agency that issued the notice" }
      - { name: return_id, type: string, source: input, description: "FK -> TaxReturn.id; the return the notice disputes" }
      - { name: notice_type, type: enum, source: input, description: "BALANCE_DUE | PENALTY_ASSESSMENT | DATA_MISMATCH | MISSING_RETURN" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the agency claims (0 allowed for MISSING_RETURN)" }
      - { name: received_at, type: datetime, source: input, description: "When the bureau received the notice" }
      - { name: response_due_at, type: datetime, source: input, description: "Statutory response deadline" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | RESOLVED_NO_CHANGE | RESOLVED_ADJUSTMENT | ESCALATED | CLOSED" }
      - { name: resolution_note, type: string, source: system, description: "Resolution summary recorded at resolution" }
      - { name: adjustment_amount_cents, type: integer, source: system, description: "Agreed adjustment when RESOLVED_ADJUSTMENT (else 0)" }

  - name: CreditAssessment
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; assessed client" }
      - { name: assessed_at, type: datetime, source: system, description: "When the assessment ran" }
      - { name: prior_posture, type: enum, source: system, description: "risk_posture before this assessment" }
      - { name: new_posture, type: enum, source: system, description: "risk_posture after this assessment" }
      - { name: trigger, type: enum, source: system, description: "FUNDING_FAILURE | FAILURE_CURED | MANUAL_REVIEW" }
      - { name: note, type: string, source: input, description: "Analyst note (required for MANUAL_REVIEW)" }

  - name: WageStatement
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; employer of record" }
      - { name: tax_year, type: integer, source: input, description: "Calendar year the statement covers" }
      - { name: employee_ref, type: string, source: input, description: "Opaque employee identifier supplied by the client" }
      - { name: wages_cents, type: integer, source: input, description: "Reported wages for the year" }
      - { name: withheld_cents, type: integer, source: input, description: "Reported withholding for the year" }
      - { name: statement_kind, type: enum, source: system, description: "ORIGINAL | CORRECTION" }
      - { name: corrects_statement_id, type: string, source: system, description: "FK -> WageStatement.id; self-referential link to the VOIDED statement this correction replaces (null for ORIGINAL)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | CORRECTED | VOIDED" }
      - { name: issued_at, type: datetime, source: system, description: "When the statement was issued" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ONBOARDING
        trigger: "POST /clients/{clientId}/begin-onboarding"
        actor: BureauOnboarder
        preconditions: []
        side_effects: []

      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /clients/{clientId}/activate"
        actor: BureauOnboarder
        preconditions:
          - "At least one JurisdictionRegistration for the client is VERIFIED (ERR_NO_VERIFIED_JURISDICTION)"
          - "credit_hold is false (ERR_CREDIT_HOLD_ACTIVE)"
        side_effects:
          - "onboarded_at = logical clock now"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when funding_failure_count reaches 3 — third strike applied by a FundingFailureEvent)"
        actor: system
        preconditions: []
        side_effects:
          - "New impound initiation is blocked for this client until reactivation"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{clientId}/reactivate"
        actor: BureauCompliance
        preconditions:
          - "Every FundingFailureEvent for the client has resolved_at set (ERR_UNRESOLVED_FUNDING_FAILURES)"
          - "credit_hold is false (ERR_CREDIT_HOLD_ACTIVE)"
        side_effects:
          - "risk_posture recomputed (0 strikes -> NORMAL)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /clients/{clientId}/terminate"
        actor: BureauCompliance
        preconditions:
          - "No Impound in PENDING status (ERR_PENDING_IMPOUNDS)"
          - "No TaxDeposit in SCHEDULED or SUBMITTED status (ERR_OPEN_OBLIGATIONS)"
          - "No AgencyNotice in OPEN or IN_REVIEW status (ERR_OPEN_OBLIGATIONS)"
          - "No PayrollRun in DRAFT, SUBMITTED or IMPOUNDED status (ERR_OPEN_OBLIGATIONS)"
        side_effects: []

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /clients/{clientId}/terminate"
        actor: BureauCompliance
        preconditions:
          - "Same open-obligation preconditions as ACTIVE -> TERMINATED"
        side_effects: []

  - entity: JurisdictionRegistration
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /registrations/{registrationId}/verify"
        actor: BureauOnboarder
        preconditions:
          - "poa_document_ref is present (ERR_POA_REQUIRED)"
          - "agency_account_number is present (ERR_POA_REQUIRED)"
        side_effects:
          - "verified_at = logical clock now"
          - "The owning Client's activation gate may now be satisfied"

      - from: PENDING
        to: REJECTED
        trigger: "POST /registrations/{registrationId}/reject"
        actor: BureauOnboarder
        preconditions: []
        side_effects:
          - "rejected_reason recorded"

      - from: REJECTED
        to: PENDING
        trigger: "POST /registrations/{registrationId}/resubmit"
        actor: BureauOnboarder
        preconditions: []
        side_effects:
          - "verified_at and rejected_reason cleared"
        note: "Rejection loop: a registration may cycle REJECTED -> PENDING -> VERIFIED any number of times."

  - entity: PayrollRun
    initial_state: DRAFT
    terminal_states: [SETTLED, REVERSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /payroll-runs/{runId}/submit"
        actor: ClientPayrollAdmin
        preconditions:
          - "gross_pay_cents > 0 and total_tax_cents >= 0 (ERR_INVALID_REQUEST)"
          - "Client.status == ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "funding_model computed: WIRE_REQUIRED if client.risk_posture == HIGH else STANDARD"

      - from: SUBMITTED
        to: IMPOUNDED
        trigger: "POST /payroll-runs/{runId}/initiate-impound (system creates the Impound)"
        actor: ClientPayrollAdmin
        preconditions:
          - "Client.status == ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
          - "Client.credit_hold is false (ERR_CREDIT_HOLD_ACTIVE)"
        side_effects:
          - "Impound created (PENDING) with amount_cents = impound_amount_cents, initiated_at = now, due_by per settlement_timing"
          - "Client.version increments by 1 (impound bookkeeping touches the client aggregate)"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /payroll-runs/{runId}/cancel"
        actor: ClientPayrollAdmin
        preconditions: []
        side_effects: []

      - from: IMPOUNDED
        to: SETTLED
        trigger: "POST /impounds/{impoundId}/settle (treasury bank webhook)"
        actor: BureauTreasury
        preconditions: []
        side_effects:
          - "Impound.status = SETTLED, settled_at = now"
          - "Client float window closes for this run"

      - from: IMPOUNDED
        to: REVERSED
        trigger: "system (automatic when the Impound transitions to FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "The run's tax funds are never scheduled; any not-yet-submitted SCHEDULED TaxDeposit rows for this run are CANCELLED (see TaxDeposit cascade)"

      - from: IMPOUNDED
        to: REVERSED
        trigger: "POST /payroll-runs/{runId}/reverse (treasury-initiated reversal of a drafted payroll)"
        actor: BureauTreasury
        preconditions:
          - "The run's Impound is in PENDING status (ERR_INVALID_STATE when already SETTLED — a settled run must instead be handled via funding failure after settle is impossible, or left settled)"
        side_effects:
          - "Impound.status = FAILED (returned draft)"
          - "FundingFailureEvent (kind NSF_RETURN) created; client_credit_risk_posture recomputed; strike cascades per FundingFailureEvent side effects"
          - "SCHEDULED TaxDeposit rows for this run -> CANCELLED"

  - entity: Impound
    initial_state: PENDING
    terminal_states: [SETTLED, FAILED, RETURNED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /impounds/{impoundId}/settle"
        actor: BureauTreasury
        preconditions:
          - "For WIRE_REQUIRED runs: PayrollRun.funding_confirmed_at must be set (ERR_WIRE_CONFIRMATION_REQUIRED)"
        side_effects:
          - "settled_at = now; owning PayrollRun IMPOUNDED -> SETTLED"

      - from: PENDING
        to: FAILED
        trigger: "POST /impounds/{impoundId}/fail (bank NSF return webhook)"
        actor: BureauTreasury
        preconditions: []
        side_effects:
          - "FundingFailureEvent created with kind NSF_RETURN"
          - "Owning PayrollRun IMPOUNDED -> REVERSED (system)"
          - "That run's SCHEDULED TaxDeposit rows -> CANCELLED"
          - "Client.funding_failure_count += 1; client_credit_risk_posture recomputed; on 3rd strike Client -> SUSPENDED; a CreditAssessment (trigger FUNDING_FAILURE) is appended"

      - from: SETTLED
        to: RETURNED
        trigger: "POST /impounds/{impoundId}/return (late bank return after settlement)"
        actor: BureauTreasury
        preconditions: []
        side_effects:
          - "FundingFailureEvent created with kind NSF_RETURN"
          - "PayrollRun stays SETTLED (the payroll itself completed); the bureau covers the returned funds"
          - "Client.funding_failure_count += 1; posture recompute; 3rd strike -> SUSPENDED; CreditAssessment appended"
        note: "SETTLED -> RETURNED is the late-return loop: the run remains SETTLED, but the client accrues a strike."

  - entity: TaxDeposit
    initial_state: SCHEDULED
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /deposits/{depositId}/submit"
        actor: BureauTaxFiler
        preconditions:
          - "Owning PayrollRun.status == SETTLED (ERR_FUNDS_NOT_SETTLED)"
          - "The JurisdictionRegistration for (client, jurisdiction) is VERIFIED (ERR_REGISTRATION_NOT_VERIFIED)"
        side_effects:
          - "submitted_at = now"

      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /deposits/{depositId}/confirm (agency acceptance webhook)"
        actor: BureauTaxFiler
        preconditions: []
        side_effects:
          - "confirmed_at = now; late_days and penalty_exposure_cents recomputed per late_deposit_penalty"

      - from: SUBMITTED
        to: FAILED
        trigger: "POST /deposits/{depositId}/fail (agency rejection)"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

      - from: FAILED
        to: SCHEDULED
        trigger: "POST /deposits/{depositId}/reschedule"
        actor: BureauTaxFiler
        preconditions: []
        side_effects:
          - "submitted_at cleared; due_date unchanged (statutory — rescheduling does NOT move the due date)"
        note: "Failure loop: SCHEDULED -> SUBMITTED -> FAILED -> SCHEDULED is unbounded; due_date never moves, so late_days grows."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from owning PayrollRun reversal) or POST /deposits/{depositId}/cancel"
        actor: system | BureauTaxFiler
        preconditions:
          - "Manual cancel only allowed while SCHEDULED (ERR_INVALID_STATE otherwise)"
        side_effects: []

  - entity: TaxReturn
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /returns/{returnId}/file"
        actor: BureauTaxFiler
        preconditions:
          - "filing_method == ELECTRONIC requires the JurisdictionRegistration VERIFIED; if still PENDING the return may only be filed with filing_method MANUAL_INTERIM (ERR_REGISTRATION_NOT_VERIFIED on an electronic attempt)"
        side_effects:
          - "filed_at = now"
          - "expected_liability_cents recomputed per agency_liability_reconciliation"
          - "For QUARTERLY returns: shortfall_penalty_exposure_cents computed per shortfall_penalty using CONFIRMED deposits for the quarter to date"

      - from: FILED
        to: ACCEPTED
        trigger: "POST /returns/{returnId}/accept (agency acceptance webhook)"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

      - from: FILED
        to: REJECTED
        trigger: "POST /returns/{returnId}/reject (agency rejection webhook)"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /returns/{returnId}/redraft"
        actor: BureauTaxFiler
        preconditions: []
        side_effects:
          - "filed_at cleared"
        note: "Rejection loop: DRAFT -> FILED -> REJECTED -> DRAFT is unbounded."

      - from: ACCEPTED
        to: RECONCILED
        trigger: "POST /returns/{returnId}/reconcile"
        actor: BureauTaxFiler
        preconditions:
          - "No AgencyNotice for this return is OPEN or IN_REVIEW (ERR_OPEN_NOTICE_BLOCKS_RECONCILIATION)"
        side_effects:
          - "reconciled_at = now; final liability comparison per agency_liability_reconciliation is frozen on the return"

      - from: ACCEPTED
        to: AMENDED
        trigger: "system (automatic when a ReturnAmendment against this return is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "The amendment's filing produces a new TaxReturn whose supersedes_return_id points here"

      - from: RECONCILED
        to: AMENDED
        trigger: "system (automatic when a ReturnAmendment against this return is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Same supersession side effect as ACCEPTED -> AMENDED"

  - entity: ReturnAmendment
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /amendments/{amendmentId}/file"
        actor: BureauTaxFiler
        preconditions:
          - "The amended TaxReturn is ACCEPTED or RECONCILED (ERR_RETURN_NOT_AMENDABLE)"
        side_effects: []

      - from: FILED
        to: ACCEPTED
        trigger: "POST /amendments/{amendmentId}/accept"
        actor: BureauTaxFiler
        preconditions: []
        side_effects:
          - "Amended TaxReturn -> AMENDED"
          - "New TaxReturn created in FILED status with supersedes_return_id = amended return id, same client/jurisdiction/period, expected_liability_cents = adjusted_liability_cents"

      - from: FILED
        to: REJECTED
        trigger: "POST /amendments/{amendmentId}/reject"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /amendments/{amendmentId}/redraft"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

  - entity: AgencyNotice
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /notices/{noticeId}/start-review"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: RESOLVED_NO_CHANGE
        trigger: "POST /notices/{noticeId}/resolve (resolution = NO_CHANGE)"
        actor: BureauTaxFiler
        preconditions: []
        side_effects:
          - "resolution_note recorded; adjustment_amount_cents = 0"
          - "If no other OPEN/IN_REVIEW notices remain for the return, the return's reconcile gate re-opens"

      - from: IN_REVIEW
        to: RESOLVED_ADJUSTMENT
        trigger: "POST /notices/{noticeId}/resolve (resolution = ADJUSTMENT)"
        actor: BureauTaxFiler
        preconditions:
          - "adjustment_amount_cents must be supplied and > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "adjustment_amount_cents recorded; resolution_note recorded"
          - "The return's expected_liability_cents is NOT rewritten by the notice; corrections flow through ReturnAmendment"

      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /notices/{noticeId}/escalate"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

      - from: ESCALATED
        to: IN_REVIEW
        trigger: "POST /notices/{noticeId}/start-review"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []
        note: "Escalation loop: IN_REVIEW -> ESCALATED -> IN_REVIEW is unbounded."

      - from: RESOLVED_NO_CHANGE
        to: CLOSED
        trigger: "POST /notices/{noticeId}/close"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

      - from: RESOLVED_ADJUSTMENT
        to: CLOSED
        trigger: "POST /notices/{noticeId}/close"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

  - entity: WageStatement
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /wage-statements/{statementId}/issue"
        actor: BureauTaxFiler
        preconditions:
          - "The logical clock must be on or after January 1 of tax_year + 1 (ERR_YEAR_NOT_CLOSED)"
          - "No other ISSUED or CORRECTED WageStatement exists for (client_id, tax_year, employee_ref) (ERR_DUPLICATE_ACTIVE_STATEMENT)"
        side_effects:
          - "issued_at = now"

      - from: ISSUED
        to: CORRECTED
        trigger: "system (automatic when a correction statement for this row is issued)"
        actor: system
        preconditions: []
        side_effects:
          - "The new statement (statement_kind CORRECTION, corrects_statement_id = this id) becomes the sole active statement for the key"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /wage-statements/{statementId}/void"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []

      - from: CORRECTED
        to: VOIDED
        trigger: "POST /wage-statements/{statementId}/void"
        actor: BureauTaxFiler
        preconditions: []
        side_effects: []
        note: "Correction chain is cyclic at the entity-family level: issue original, issue correction (old -> CORRECTED), issue correction of the correction — only one statement is ever active per (client, year, employee)."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: deposit-create-stale-run
    parent_entity: PayrollRun
    write_endpoint: "POST /payroll-runs/{runId}/deposits"
    occ_field: "expected_payroll_run_version"
    description: |
      Creating a TaxDeposit against a PayrollRun whose version has advanced
      since the caller last observed it is rejected. This captures the case
      where another deposit was just scheduled against the same run (which
      legitimately changes the run's scheduled-deposit set) and the current
      writer's view of the run is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: return-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /returns"
    occ_field: "expected_client_version"
    description: |
      Creating a TaxReturn for a Client whose version has advanced since the
      caller last observed it is rejected. A new filing supersedes the
      caller's snapshot of the client's filing landscape, so a stale view is
      refused rather than silently serialized.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: impound-initiate-stale-client
    parent_entity: Client
    write_endpoint: "POST /payroll-runs/{runId}/initiate-impound"
    occ_field: "expected_client_version"
    description: |
      Initiating an impound while carrying a Client version that no longer
      matches the stored version is rejected. Risk posture and credit-hold
      changes advance Client.version, so a stale read of the client's funding
      posture cannot be used to justify a new draft.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: impound_amount
    trigger: "PayrollRun creation and on any PATCH that changes gross_pay_cents or total_tax_cents while DRAFT"
    algorithm: aggregation
    formula: |
      impound_amount_cents = gross_pay_cents + total_tax_cents
    input_set: "The single PayrollRun row; both inputs are client-supplied integers in cents"
    precision: "integer cents; no rounding"

  - name: settlement_timing
    trigger: "Impound creation"
    algorithm: chronological
    formula: |
      STANDARD funding:   due_by = add_business_days(initiated_at, 2)
      WIRE_REQUIRED:      due_by = end_of_calendar_day(initiated_at)  (23:59:59Z same day)
      add_business_days rolls forward over Saturdays and Sundays only; the bureau
      observes no holiday calendar. A Friday initiation + 2 business days lands on
      the following Tuesday.
    input_set: "The Impound's initiated_at and the owning PayrollRun.funding_model"
    constants:
      STANDARD_SETTLEMENT_BUSINESS_DAYS: 2
    precision: "datetime to the second"

  - name: deposit_due_date
    trigger: "TaxDeposit creation"
    algorithm: chronological
    formula: |
      Let P = owning PayrollRun.pay_date (date portion).
      SEMIWEEKLY:  P in Wed/Thu/Fri  -> due = next Wednesday strictly after P
                   P in Sat/Sun/Mon/Tue -> due = next Friday strictly after P
      MONTHLY:     due = the 15th day of the month following P's month
      QUARTERLY:   due = last day of the month following P's quarter
                   (Q1 -> Apr 30, Q2 -> Jul 31, Q3 -> Oct 31, Q4 -> Jan 31 of next year)
    input_set: "Jurisdiction.deposit_frequency of the deposit's jurisdiction; PayrollRun.pay_date"
    precision: "date precision; time normalized to 23:59:59Z on the due date"

  - name: late_deposit_penalty
    trigger: "TaxDeposit SUBMITTED -> CONFIRMED (and re-derived on reads of CONFIRMED deposits)"
    algorithm: threshold
    formula: |
      late_days = max(0, days_between(due_date, confirmed_at))   # calendar days, date portions
      if late_days == 0:      penalty_exposure_cents = 0
      elif late_days <= 5:    penalty_exposure_cents = round_half_up(amount_cents * penalty_tier1_rate)
      elif late_days <= 15:   penalty_exposure_cents = round_half_up(amount_cents * penalty_tier2_rate)
      else:                   penalty_exposure_cents = round_half_up(amount_cents * penalty_tier3_rate)
      Boundary is INCLUSIVE at the tier edges: exactly 5 days late is tier 1, exactly 6 is tier 2,
      exactly 15 is tier 2, exactly 16 is tier 3.
    input_set: "The single TaxDeposit; rates from its Jurisdiction"
    precision: "integer cents, round_half_up"

  - name: agency_liability_reconciliation
    trigger: "TaxReturn DRAFT -> FILED; again at TaxReturn -> RECONCILED; also re-derived on GET of a FILED/ACCEPTED return"
    algorithm: aggregation
    input_set: "See variants — the inclusion set is exactly what the variants disagree on"
    formula: |
      expected_liability_cents = sum of tax contributions per the active variant (see variants)
    precision: "integer cents"
    variants:
      - name: bureau_books_variant
        when: "Filing-time view (DRAFT -> FILED) and reads of FILED/ACCEPTED returns"
        difference: |
          Sums total_tax_cents of the client's PayrollRuns whose period_end falls inside the return
          period and whose status IN {SUBMITTED, IMPOUNDED, SETTLED} — i.e. includes money the bureau
          has drafted but not yet settled. REVERSED and CANCELLED runs are excluded.
      - name: agency_confirmed_variant
        when: "Reconciliation-time view (TaxReturn -> RECONCILED)"
        difference: |
          Sums amount_cents of the client's CONFIRMED TaxDeposits for the return's jurisdiction whose
          quarter falls inside the return period — i.e. only money the agency has acknowledged.
          For identical period data the two variants diverge whenever a run is drafted-but-unsettled
          at filing time or a deposit is still unconfirmed at reconcile time.

  - name: shortfall_penalty
    trigger: "QUARTERLY TaxReturn DRAFT -> FILED"
    algorithm: tiered_pricing
    formula: |
      Let Q = the return's period (a quarter). Let D = the set of the client's TaxDeposits for this
      jurisdiction with quarter == Q and status == CONFIRMED.
      confirmed_total = sum(D.amount_cents)
      liability = expected_liability_cents (bureau_books_variant, computed first)
      if confirmed_total >= jurisdiction.underpayment_threshold_cents:
          shortfall_penalty_exposure_cents = 0            # safe harbor: deposits were substantive
      else:
          shortfall = liability - confirmed_total
          if shortfall <= 0: shortfall_penalty_exposure_cents = 0
          else:
              days = calendar days from quarter end to filing date
              rate = penalty_tier1_rate if days <= 5 else (penalty_tier2_rate if days <= 15 else penalty_tier3_rate)
              shortfall_penalty_exposure_cents = round_half_up(shortfall * rate)
      Evaluation order is pinned: liability FIRST (bureau_books_variant), then the safe-harbor
      comparison against the threshold, then the shortfall. The circular-looking dependency
      (penalty keyed on liability, liability including runs whose deposits may be unconfirmed) is
      resolved by always using the bureau-books liability, never the agency-confirmed total.
    input_set: "CONFIRMED TaxDeposits of (client, jurisdiction, quarter); the return's liability; Jurisdiction.underpayment_threshold_cents and penalty tiers"
    precision: "integer cents, round_half_up; threshold comparison is >= (exactly at threshold is safe)"

  - name: client_credit_risk_posture
    trigger: "FundingFailureEvent creation; FundingFailureEvent resolution (cure); CreditAssessment with trigger MANUAL_REVIEW"
    algorithm: weighted_scoring
    formula: |
      Let U = the client's FundingFailureEvent rows with resolved_at == null.
      base = sum over U of (2 if kind == NSF_RETURN else 1)        # wire misses weigh less
      posture: base >= 4 -> HIGH; base in {2,3} -> ELEVATED; base <= 1 -> NORMAL
      funding_failure_count = |U|  (count of unresolved events, NOT the weighted base)
      Client suspension is keyed on the COUNT: when funding_failure_count reaches 3 the client
      auto-suspends. A single NSF_RETURN (base 2, count 1) already elevates posture to ELEVATED
      without suspending.
    input_set: "Unresolved FundingFailureEvent rows for the client"
    precision: "integer scores; thresholds inclusive (base == 4 is HIGH)"
    variants:
      - name: count_based_view
        when: "Suspension gate and funding_failure_count field"
        difference: "Counts unresolved events (1 per event) — drives the 3-strike suspension"
      - name: weighted_view
        when: "risk_posture derivation"
        difference: "Weights NSF_RETURN at 2 and WIRE_NOT_CONFIRMED at 1 — drives NORMAL/ELEVATED/HIGH"

  - name: wage_statement_annual_total
    trigger: "Read of GET /clients/{clientId}/wage-statements/summary"
    algorithm: aggregation
    formula: |
      For a (client, tax_year): a statement is ACTIVE iff status == ISSUED. (CORRECTED rows are
      superseded predecessors; DRAFT rows are unpublished; VOIDED rows are dead.)
      total_wages_cents    = sum(wages_cents)    over ISSUED statements
      total_withheld_cents = sum(withheld_cents) over ISSUED statements
      active_statement_count = count of ISSUED statements
      voided_total_cents   = sum(wages_cents) over VOIDED statements (always reported)
      Exactly one ISSUED row exists per employee key because issuing a CORRECTION flips its target
      ISSUED -> CORRECTED in the same transition.
    input_set: "WageStatement rows for (client, tax_year)"
    precision: "integer cents"
    variants:
      - name: as_issued_view
        when: "Default summary (include_voided omitted or false)"
        difference: "Reports only the ISSUED-row totals; voided_total_cents is still returned but excluded from the totals"
      - name: as_filed_history_view
        when: "Audit view via ?include_voided=true"
        difference: "Folds VOIDED rows into total_wages_cents / total_withheld_cents as well — identical stored data, larger totals whenever a correction-then-void cycle has run"

  - name: registration_interim_gate
    trigger: "TaxReturn creation and DRAFT -> FILED"
    algorithm: constraint_propagation
    formula: |
      filing_method = ELECTRONIC if the JurisdictionRegistration for (client, jurisdiction) is VERIFIED
                      else MANUAL_INTERIM if the registration is PENDING
                      else the return cannot be created (REJECTED registration -> ERR_REGISTRATION_NOT_VERIFIED)
      Propagation: a registration that flips PENDING -> VERIFIED does NOT rewrite already-FILED
      MANUAL_INTERIM returns; it only changes the filing_method computed for returns created after.
    input_set: "The single JurisdictionRegistration for (client, jurisdiction)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and name a declared role; X-User-ID required for entity-backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Entity-backed identity: ClientPayrollAdmin's X-User-ID must equal the client_id of the client aggregate being touched"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "client-scoped endpoints invoked as ClientPayrollAdmin"

  - priority: 4
    category: existence
    check: "Path and body resource ids must exist, validated left-to-right (path ids before body ids, body ids in declared input order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 5
    category: business_constraint
    check: "Request body required fields present; enum values in-domain; integer cents fields >= 0; period_end >= period_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 6
    category: state
    check: "Target resource must be in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the same X-User-ID that filed a TaxReturn cannot accept, reject, or reconcile that same return; the same X-User-ID that filed a ReturnAmendment cannot accept or reject it"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /returns/{id}/accept, POST /returns/{id}/reject, POST /returns/{id}/reconcile, POST /amendments/{id}/accept, POST /amendments/{id}/reject"

  - priority: 8
    category: business_safety
    check: "Client credit gate: Client must be ACTIVE (not SUSPENDED/ONBOARDING/TERMINATED) and credit_hold false before submit / initiate-impound"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /payroll-runs, POST /payroll-runs/{id}/submit, POST /payroll-runs/{id}/initiate-impound"

  - priority: 9
    category: business_safety
    check: "Credit hold imposed by compliance blocks every new impound even when the client is ACTIVE"
    error_id: ERR_CREDIT_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /payroll-runs/{id}/initiate-impound, POST /clients/{id}/activate, POST /clients/{id}/reactivate"

  - priority: 10
    category: business_safety
    check: "WIRE_REQUIRED funding: a HIGH-posture run's impound cannot settle until the client confirms same-day wire funding"
    error_id: ERR_WIRE_CONFIRMATION_REQUIRED
    http_status: 409
    applies_to: "POST /impounds/{id}/settle"

  - priority: 11
    category: business_referential
    check: "POA and agency account number must be present before a registration can be verified"
    error_id: ERR_POA_REQUIRED
    http_status: 422
    applies_to: "POST /registrations/{id}/verify"

  - priority: 12
    category: business_referential
    check: "Deposit submission and ELECTRONIC filing require a VERIFIED JurisdictionRegistration for (client, jurisdiction)"
    error_id: ERR_REGISTRATION_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /deposits/{id}/submit, POST /returns, POST /returns/{id}/file"

  - priority: 13
    category: business_fiscal
    check: "TaxDeposit schedule must not double-book the same (payroll_run_id, jurisdiction_id) pair in SCHEDULED or SUBMITTED status"
    error_id: ERR_DUPLICATE_DEPOSIT
    http_status: 409
    applies_to: "POST /payroll-runs/{id}/deposits"

  - priority: 14
    category: business_fiscal
    check: "Cumulative SCHEDULED + SUBMITTED + CONFIRMED deposit amount for a run must not exceed the run's total_tax_cents"
    error_id: ERR_DEPOSIT_EXCEEDS_LIABILITY
    http_status: 422
    applies_to: "POST /payroll-runs/{id}/deposits"

  - priority: 15
    category: business_fiscal
    check: "Deposit submission requires the backing PayrollRun to be SETTLED (funds actually in the bureau account)"
    error_id: ERR_FUNDS_NOT_SETTLED
    http_status: 409
    applies_to: "POST /deposits/{id}/submit"

  - priority: 16
    category: business_temporal
    check: "A QUARTERLY or ANNUAL TaxReturn's period must be closed: filing before the period end + jurisdiction filing window is rejected"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /returns/{id}/file"

  - priority: 17
    category: business_temporal
    check: "WageStatement issue requires the logical clock to be on/after Jan 1 of tax_year + 1"
    error_id: ERR_YEAR_NOT_CLOSED
    http_status: 409
    applies_to: "POST /wage-statements/{id}/issue"

  - priority: 18
    category: business_constraint
    check: "Only one active (ISSUED or CORRECTED-pending-correction) WageStatement per (client, tax_year, employee_ref); creating an ORIGINAL while one is active is rejected"
    error_id: ERR_DUPLICATE_ACTIVE_STATEMENT
    http_status: 409
    applies_to: "POST /wage-statements, POST /wage-statements/{id}/issue"

  - priority: 19
    category: business_referential
    check: "An open (OPEN or IN_REVIEW) AgencyNotice blocks reconciliation of its return"
    error_id: ERR_OPEN_NOTICE_BLOCKS_RECONCILIATION
    http_status: 409
    applies_to: "POST /returns/{id}/reconcile"

  - priority: 20
    category: business_referential
    check: "Amendments may only be filed against ACCEPTED or RECONCILED returns"
    error_id: ERR_RETURN_NOT_AMENDABLE
    http_status: 409
    applies_to: "POST /amendments, POST /amendments/{id}/file"

  - priority: 21
    category: business_constraint
    check: "Client termination requires zero pending impounds, zero open deposits, zero open notices, and zero non-terminal payroll runs"
    error_id: ERR_OPEN_OBLIGATIONS
    http_status: 409
    applies_to: "POST /clients/{id}/terminate"

  - priority: 22
    category: business_constraint
    check: "Client activation requires at least one VERIFIED JurisdictionRegistration"
    error_id: ERR_NO_VERIFIED_JURISDICTION
    http_status: 422
    applies_to: "POST /clients/{id}/activate"

  - priority: 23
    category: business_constraint
    check: "Client reactivation requires every FundingFailureEvent to be resolved"
    error_id: ERR_UNRESOLVED_FUNDING_FAILURES
    http_status: 409
    applies_to: "POST /clients/{id}/reactivate"

  - priority: 24
    category: business_constraint
    check: "OCC: expected_*_version fields must match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /payroll-runs/{id}/deposits, POST /returns, POST /payroll-runs/{id}/initiate-impound"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [BureauCompliance]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["Recompute time-derived fields that depend on the logical clock (e.g. computed statuses that age)"]

  # --- Unauthenticated probe (test-driving) ---
  - method: GET
    path: "/_probe/no-auth"
    description: "Probe endpoint that requires a declared role header; used to verify that a request with no X-User-Role is rejected 401 before anything else."
    roles: [BureauCompliance]
    code: 200
    input: []
    output: "{ ok: boolean }"
    side_effects: []

  # --- Jurisdiction ---
  - method: POST
    path: "/jurisdictions"
    description: "Create a tax agency jurisdiction with its deposit frequency and penalty configuration"
    roles: [BureauCompliance]
    code: 201
    input: [code, name, deposit_frequency, penalty_tier1_rate, penalty_tier2_rate, penalty_tier3_rate, underpayment_threshold_cents, "active?"]
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/jurisdictions"
    description: "List jurisdictions"
    roles: [BureauCompliance, BureauOnboarder, BureauTaxFiler, BureauTreasury, ClientPayrollAdmin]
    code: 200
    input: ["deposit_frequency?", "active?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  - method: GET
    path: "/jurisdictions/{jurisdictionId}"
    description: "Get one jurisdiction"
    roles: [BureauCompliance, BureauOnboarder, BureauTaxFiler, BureauTreasury, ClientPayrollAdmin]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Create a client (starts PROSPECT)"
    roles: [BureauOnboarder]
    code: 201
    input: [legal_name, ein]
    output: Client
    side_effects: ["status = PROSPECT; risk_posture = NORMAL; funding_failure_count = 0; credit_hold = false"]

  - method: GET
    path: "/clients"
    description: "List clients"
    roles: [BureauCompliance, BureauOnboarder, BureauTaxFiler, BureauTreasury]
    code: 200
    input: ["status?", "risk_posture?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: GET
    path: "/registrations"
    description: "List registrations across clients (client_id / jurisdiction_id filters are reverse-reachability channels)"
    roles: [BureauCompliance, BureauOnboarder, BureauTaxFiler]
    code: 200
    input: ["client_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: JurisdictionRegistration[]
    side_effects: []

  - method: GET
    path: "/clients/{clientId}"
    description: "Get one client"
    roles: [BureauCompliance, BureauOnboarder, BureauTaxFiler, BureauTreasury, ClientPayrollAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/begin-onboarding"
    description: "PROSPECT -> ONBOARDING"
    roles: [BureauOnboarder]
    code: 200
    input: []
    output: Client
    side_effects: ["increments Client.version by 1"]

  - method: POST
    path: "/clients/{clientId}/activate"
    description: "ONBOARDING -> ACTIVE (requires a VERIFIED registration and no credit hold)"
    roles: [BureauOnboarder]
    code: 200
    input: []
    output: Client
    side_effects: ["onboarded_at = now; increments Client.version by 1"]

  - method: POST
    path: "/clients/{clientId}/terminate"
    description: "ACTIVE|SUSPENDED -> TERMINATED (requires no open obligations)"
    roles: [BureauCompliance]
    code: 200
    input: []
    output: Client
    side_effects: ["increments Client.version by 1"]

  - method: POST
    path: "/clients/{clientId}/reactivate"
    description: "SUSPENDED -> ACTIVE (requires all funding failures cured and no credit hold)"
    roles: [BureauCompliance]
    code: 200
    input: []
    output: Client
    side_effects: ["risk_posture recomputed; increments Client.version by 1"]

  - method: POST
    path: "/clients/{clientId}/credit-hold"
    description: "Set or clear the compliance credit hold"
    roles: [BureauCompliance]
    code: 200
    input: [hold]
    output: Client
    side_effects: ["credit_hold = hold; increments Client.version by 1"]

  - method: GET
    path: "/clients/{clientId}/funding-failures"
    description: "List the client's FundingFailureEvent rows (sub-resource reverse reachability)"
    roles: [BureauCompliance, BureauTreasury, BureauOnboarder]
    code: 200
    input: ["resolved?", "limit?", "offset?"]
    output: FundingFailureEvent[]
    side_effects: []

  - method: GET
    path: "/clients/{clientId}/credit-assessments"
    description: "List the client's CreditAssessment rows (sub-resource reverse reachability)"
    roles: [BureauCompliance, BureauTreasury]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditAssessment[]
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/credit-assessments"
    description: "Record a manual credit review (MANUAL_REVIEW); recompute posture"
    roles: [BureauCompliance]
    code: 201
    input: [note]
    output: CreditAssessment
    side_effects: ["client_credit_risk_posture recomputed; increments Client.version by 1"]

  # --- JurisdictionRegistration ---
  - method: POST
    path: "/clients/{clientId}/registrations"
    description: "Request registration of the client with a jurisdiction (starts PENDING)"
    roles: [BureauOnboarder]
    code: 201
    input: [jurisdiction_id, agency_account_number, poa_document_ref]
    output: JurisdictionRegistration
    side_effects: []

  - method: GET
    path: "/clients/{clientId}/registrations"
    description: "List a client's registrations"
    roles: [BureauCompliance, BureauOnboarder, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: ["jurisdiction_id?", "status?", "limit?", "offset?"]
    output: JurisdictionRegistration[]
    side_effects: []

  - method: GET
    path: "/registrations/{registrationId}"
    description: "Get one registration"
    roles: [BureauCompliance, BureauOnboarder, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: []
    output: JurisdictionRegistration
    side_effects: []

  - method: POST
    path: "/registrations/{registrationId}/verify"
    description: "PENDING -> VERIFIED (POA + account number required)"
    roles: [BureauOnboarder]
    code: 200
    input: []
    output: JurisdictionRegistration
    side_effects: ["verified_at = now"]

  - method: POST
    path: "/registrations/{registrationId}/reject"
    description: "PENDING -> REJECTED"
    roles: [BureauOnboarder]
    code: 200
    input: [reason]
    output: JurisdictionRegistration
    side_effects: []

  - method: POST
    path: "/registrations/{registrationId}/resubmit"
    description: "REJECTED -> PENDING (re-onboard after agency rejection)"
    roles: [BureauOnboarder]
    code: 200
    input: []
    output: JurisdictionRegistration
    side_effects: []

  # --- PayrollRun ---
  - method: POST
    path: "/payroll-runs"
    description: "Create a payroll run (DRAFT)"
    roles: [ClientPayrollAdmin]
    code: 201
    input: [client_id, pay_date, period_start, period_end, gross_pay_cents, total_tax_cents]
    output: PayrollRun
    side_effects: ["impound_amount_cents computed per impound_amount"]

  - method: GET
    path: "/payroll-runs"
    description: "List payroll runs (client_id filter is the reverse-reachability channel)"
    roles: [BureauCompliance, BureauTreasury, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: PayrollRun[]
    side_effects: []

  - method: GET
    path: "/payroll-runs/{runId}"
    description: "Get one payroll run"
    roles: [BureauCompliance, BureauTreasury, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: []
    output: PayrollRun
    side_effects: []

  - method: POST
    path: "/payroll-runs/{runId}/submit"
    description: "DRAFT -> SUBMITTED; computes the effective funding_model from client posture"
    roles: [ClientPayrollAdmin]
    code: 200
    input: []
    output: PayrollRun
    side_effects: ["funding_model = WIRE_REQUIRED if client.risk_posture == HIGH else STANDARD; increments PayrollRun.version by 1"]

  - method: POST
    path: "/payroll-runs/{runId}/initiate-impound"
    description: "SUBMITTED -> IMPOUNDED; creates the Impound. OCC-guarded on Client.version."
    roles: [ClientPayrollAdmin]
    code: 201
    input: [expected_client_version]
    output: Impound
    side_effects: ["Impound created (PENDING) with due_by per settlement_timing; increments Client.version by 1; increments PayrollRun.version by 1"]

  - method: POST
    path: "/payroll-runs/{runId}/cancel"
    description: "SUBMITTED -> CANCELLED"
    roles: [ClientPayrollAdmin]
    code: 200
    input: []
    output: PayrollRun
    side_effects: ["increments PayrollRun.version by 1"]

  - method: POST
    path: "/payroll-runs/{runId}/reverse"
    description: "IMPOUNDED -> REVERSED (treasury-initiated); fails the PENDING impound, applies a funding strike, cancels the run's SCHEDULED deposits"
    roles: [BureauTreasury]
    code: 200
    input: []
    output: PayrollRun
    side_effects: ["Impound -> FAILED; FundingFailureEvent (NSF_RETURN) created; client_credit_risk_posture recomputed (3rd strike suspends the client); the run's SCHEDULED TaxDeposit rows -> CANCELLED; CreditAssessment (FUNDING_FAILURE) appended; increments Client.version by 1"]

  # --- Impound ---
  - method: GET
    path: "/impounds"
    description: "List impounds (payroll_run_id / client_id filters are reverse-reachability channels)"
    roles: [BureauCompliance, BureauTreasury, ClientPayrollAdmin]
    code: 200
    input: ["payroll_run_id?", "client_id?", "status?", "limit?", "offset?"]
    output: Impound[]
    side_effects: []

  - method: GET
    path: "/impounds/{impoundId}"
    description: "Get one impound"
    roles: [BureauCompliance, BureauTreasury, ClientPayrollAdmin]
    code: 200
    input: []
    output: Impound
    side_effects: []

  - method: POST
    path: "/impounds/{impoundId}/settle"
    description: "PENDING -> SETTLED (WIRE_REQUIRED runs need funding confirmation first); settles the owning run"
    roles: [BureauTreasury]
    code: 200
    input: []
    output: Impound
    side_effects: ["settled_at = now; owning PayrollRun IMPOUNDED -> SETTLED; increments PayrollRun.version by 1"]

  - method: POST
    path: "/impounds/{impoundId}/fail"
    description: "PENDING -> FAILED (bank NSF return); reverses the owning run, applies a strike, cancels its SCHEDULED deposits"
    roles: [BureauTreasury]
    code: 200
    input: []
    output: Impound
    side_effects: ["FundingFailureEvent (NSF_RETURN) created; owning PayrollRun IMPOUNDED -> REVERSED; that run's SCHEDULED TaxDeposit rows -> CANCELLED; client_credit_risk_posture recomputed (3rd strike suspends); CreditAssessment (FUNDING_FAILURE) appended; increments Client.version by 1"]

  - method: POST
    path: "/impounds/{impoundId}/return"
    description: "SETTLED -> RETURNED (late bank return); the run stays SETTLED but the client takes a strike"
    roles: [BureauTreasury]
    code: 200
    input: []
    output: Impound
    side_effects: ["FundingFailureEvent (NSF_RETURN) created; client_credit_risk_posture recomputed (3rd strike suspends); CreditAssessment (FUNDING_FAILURE) appended; increments Client.version by 1"]

  - method: POST
    path: "/impounds/{impoundId}/confirm-wire"
    description: "Client confirms same-day wire funding for a WIRE_REQUIRED run (sets PayrollRun.funding_confirmed_at); a missed wire confirmation may instead be recorded as a WIRE_NOT_CONFIRMED failure via /miss-wire"
    roles: [ClientPayrollAdmin]
    code: 200
    input: []
    output: Impound
    side_effects: ["PayrollRun.funding_confirmed_at = now; increments PayrollRun.version by 1"]

  - method: POST
    path: "/impounds/{impoundId}/miss-wire"
    description: "Treasury records that a WIRE_REQUIRED impound's due_by passed without confirmation: creates a WIRE_NOT_CONFIRMED FundingFailureEvent and fails the impound"
    roles: [BureauTreasury]
    code: 200
    input: []
    output: Impound
    side_effects: ["FundingFailureEvent (WIRE_NOT_CONFIRMED) created; Impound -> FAILED; owning PayrollRun IMPOUNDED -> REVERSED; that run's SCHEDULED TaxDeposit rows -> CANCELLED; client_credit_risk_posture recomputed; CreditAssessment (FUNDING_FAILURE) appended; increments Client.version by 1"]

  - method: GET
    path: "/funding-failures/{eventId}"
    description: "Get one funding failure event"
    roles: [BureauCompliance, BureauTreasury]
    code: 200
    input: []
    output: FundingFailureEvent
    side_effects: []

  - method: GET
    path: "/funding-failures"
    description: "List funding failure events (impound_id / client_id / resolved filters)"
    roles: [BureauCompliance, BureauTreasury]
    code: 200
    input: ["impound_id?", "client_id?", "resolved?", "limit?", "offset?"]
    output: FundingFailureEvent[]
    side_effects: []

  - method: POST
    path: "/funding-failures/{eventId}/resolve"
    description: "Mark a FundingFailureEvent cured (sets resolved_at); recompute posture"
    roles: [BureauTreasury]
    code: 200
    input: []
    output: FundingFailureEvent
    side_effects: ["resolved_at = now; client_credit_risk_posture recomputed; increments Client.version by 1"]

  # --- TaxDeposit ---
  - method: POST
    path: "/payroll-runs/{runId}/deposits"
    description: "Schedule a tax deposit against a run. OCC-guarded on PayrollRun.version."
    roles: [BureauTaxFiler]
    code: 201
    input: [jurisdiction_id, amount_cents, expected_payroll_run_version]
    output: TaxDeposit
    side_effects: ["due_date and quarter computed per deposit_due_date; increments PayrollRun.version by 1"]

  - method: GET
    path: "/deposits"
    description: "List deposits (client_id / jurisdiction_id / payroll_run_id filters are reverse-reachability channels)"
    roles: [BureauCompliance, BureauTaxFiler, BureauTreasury, ClientPayrollAdmin]
    code: 200
    input: ["client_id?", "jurisdiction_id?", "payroll_run_id?", "status?", "quarter?", "limit?", "offset?"]
    output: TaxDeposit[]
    side_effects: []

  - method: GET
    path: "/deposits/{depositId}"
    description: "Get one deposit (late_days and penalty_exposure_cents recomputed on read)"
    roles: [BureauCompliance, BureauTaxFiler, BureauTreasury, ClientPayrollAdmin]
    code: 200
    input: []
    output: TaxDeposit
    side_effects: []

  - method: POST
    path: "/deposits/{depositId}/submit"
    description: "SCHEDULED -> SUBMITTED (requires SETTLED run and VERIFIED registration)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxDeposit
    side_effects: ["submitted_at = now; increments TaxDeposit.version by 1"]

  - method: POST
    path: "/deposits/{depositId}/confirm"
    description: "SUBMITTED -> CONFIRMED (agency acceptance); computes late_days and penalty_exposure_cents"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxDeposit
    side_effects: ["confirmed_at = now; late_days and penalty_exposure_cents computed per late_deposit_penalty; increments TaxDeposit.version by 1"]

  - method: POST
    path: "/deposits/{depositId}/fail"
    description: "SUBMITTED -> FAILED (agency rejection)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxDeposit
    side_effects: ["increments TaxDeposit.version by 1"]

  - method: POST
    path: "/deposits/{depositId}/reschedule"
    description: "FAILED -> SCHEDULED (due_date unchanged — statutory)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxDeposit
    side_effects: ["submitted_at cleared; increments TaxDeposit.version by 1"]

  - method: POST
    path: "/deposits/{depositId}/cancel"
    description: "SCHEDULED -> CANCELLED (manual)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxDeposit
    side_effects: ["increments TaxDeposit.version by 1"]

  # --- TaxReturn ---
  - method: POST
    path: "/returns"
    description: "Create a return (DRAFT). filing_method derived per registration_interim_gate. OCC-guarded on Client.version."
    roles: [BureauTaxFiler]
    code: 201
    input: [client_id, jurisdiction_id, period, expected_client_version]
    output: TaxReturn
    side_effects: ["filing_method computed per registration_interim_gate; increments Client.version by 1"]

  - method: GET
    path: "/returns"
    description: "List returns"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: ["client_id?", "jurisdiction_id?", "status?", "period?", "supersedes_return_id?", "limit?", "offset?"]
    output: TaxReturn[]
    side_effects: []

  - method: GET
    path: "/returns/{returnId}"
    description: "Get one return"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: []
    output: TaxReturn
    side_effects: []

  - method: POST
    path: "/returns/{returnId}/file"
    description: "DRAFT -> FILED; computes liability (bureau-books variant) and, for QUARTERLY returns, the shortfall penalty"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["filed_at = now; expected_liability_cents per agency_liability_reconciliation bureau_books_variant; shortfall_penalty_exposure_cents per shortfall_penalty (QUARTERLY only); increments TaxReturn.version by 1"]

  - method: POST
    path: "/returns/{returnId}/accept"
    description: "FILED -> ACCEPTED (agency acceptance; SoD: filer cannot accept)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["increments TaxReturn.version by 1"]

  - method: POST
    path: "/returns/{returnId}/reject"
    description: "FILED -> REJECTED (agency rejection; SoD applies)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["increments TaxReturn.version by 1"]

  - method: POST
    path: "/returns/{returnId}/redraft"
    description: "REJECTED -> DRAFT"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["filed_at cleared; increments TaxReturn.version by 1"]

  - method: POST
    path: "/returns/{returnId}/reconcile"
    description: "ACCEPTED -> RECONCILED; freezes the agency-confirmed liability comparison; blocked by open notices"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["reconciled_at = now; expected_liability_cents re-derived per agency_confirmed_variant and frozen; increments TaxReturn.version by 1"]

  - method: GET
    path: "/returns/{returnId}/amendments"
    description: "List amendments filed against a return (sub-resource reverse reachability)"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReturnAmendment[]
    side_effects: []

  - method: GET
    path: "/returns/{returnId}/notices"
    description: "List agency notices tied to a return (sub-resource reverse reachability)"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AgencyNotice[]
    side_effects: []

  # --- ReturnAmendment ---
  - method: POST
    path: "/amendments"
    description: "Create an amendment (DRAFT) against an ACCEPTED or RECONCILED return"
    roles: [BureauTaxFiler]
    code: 201
    input: [return_id, reason, adjusted_liability_cents]
    output: ReturnAmendment
    side_effects: []

  - method: GET
    path: "/amendments"
    description: "List amendments (return_id filter is a reverse-reachability channel)"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: ["return_id?", "status?", "limit?", "offset?"]
    output: ReturnAmendment[]
    side_effects: []

  - method: GET
    path: "/amendments/{amendmentId}"
    description: "Get one amendment"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: []
    output: ReturnAmendment
    side_effects: []

  - method: POST
    path: "/amendments/{amendmentId}/file"
    description: "DRAFT -> FILED"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: ReturnAmendment
    side_effects: ["increments ReturnAmendment.version by 1"]

  - method: POST
    path: "/amendments/{amendmentId}/accept"
    description: "FILED -> ACCEPTED; supersedes the amended return and files the replacement return (SoD: filer cannot accept)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: ReturnAmendment
    side_effects: ["Amended TaxReturn -> AMENDED; new TaxReturn created FILED with supersedes_return_id = amended id and expected_liability_cents = adjusted_liability_cents; increments ReturnAmendment.version by 1"]

  - method: POST
    path: "/amendments/{amendmentId}/reject"
    description: "FILED -> REJECTED (SoD applies)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: ReturnAmendment
    side_effects: ["increments ReturnAmendment.version by 1"]

  - method: POST
    path: "/amendments/{amendmentId}/redraft"
    description: "REJECTED -> DRAFT"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: ReturnAmendment
    side_effects: ["increments ReturnAmendment.version by 1"]

  # --- AgencyNotice ---
  - method: POST
    path: "/notices"
    description: "Record an agency notice against a client's return"
    roles: [BureauTaxFiler, BureauCompliance]
    code: 201
    input: [client_id, jurisdiction_id, return_id, notice_type, claimed_amount_cents, received_at, response_due_at]
    output: AgencyNotice
    side_effects: []

  - method: GET
    path: "/notices"
    description: "List notices"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: ["client_id?", "jurisdiction_id?", "return_id?", "status?", "limit?", "offset?"]
    output: AgencyNotice[]
    side_effects: []

  - method: GET
    path: "/notices/{noticeId}"
    description: "Get one notice"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: []
    output: AgencyNotice
    side_effects: []

  - method: POST
    path: "/notices/{noticeId}/start-review"
    description: "OPEN|ESCALATED -> IN_REVIEW (bureau takes ownership of the discrepancy on the client's behalf)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: AgencyNotice
    side_effects: ["increments AgencyNotice.version by 1"]

  - method: POST
    path: "/notices/{noticeId}/resolve"
    description: "IN_REVIEW -> RESOLVED_NO_CHANGE | RESOLVED_ADJUSTMENT"
    roles: [BureauTaxFiler]
    code: 200
    input: [resolution, resolution_note, "adjustment_amount_cents?"]
    output: AgencyNotice
    side_effects: ["adjustment_amount_cents recorded (0 for NO_CHANGE); increments AgencyNotice.version by 1"]

  - method: POST
    path: "/notices/{noticeId}/escalate"
    description: "IN_REVIEW -> ESCALATED"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: AgencyNotice
    side_effects: ["increments AgencyNotice.version by 1"]

  - method: POST
    path: "/notices/{noticeId}/close"
    description: "RESOLVED_* -> CLOSED"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: AgencyNotice
    side_effects: ["increments AgencyNotice.version by 1"]

  # --- WageStatement ---
  - method: POST
    path: "/wage-statements"
    description: "Create a wage statement (DRAFT). statement_kind ORIGINAL, or CORRECTION when corrects_statement_id is supplied."
    roles: [BureauTaxFiler]
    code: 201
    input: [client_id, tax_year, employee_ref, wages_cents, withheld_cents, "corrects_statement_id?"]
    output: WageStatement
    side_effects: ["statement_kind = CORRECTION when corrects_statement_id present (target must be ISSUED; ERR_INVALID_STATE otherwise)"]

  - method: GET
    path: "/wage-statements"
    description: "List wage statements"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: ["client_id?", "tax_year?", "employee_ref?", "status?", "include_voided?", "corrects_statement_id?", "limit?", "offset?"]
    output: WageStatement[]
    side_effects: []

  - method: GET
    path: "/wage-statements/{statementId}"
    description: "Get one wage statement"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: []
    output: WageStatement
    side_effects: []

  - method: POST
    path: "/wage-statements/{statementId}/issue"
    description: "DRAFT -> ISSUED (year must be closed; uniqueness per employee key; issuing a CORRECTION flips its target ISSUED -> CORRECTED)"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: WageStatement
    side_effects: ["issued_at = now; if statement_kind == CORRECTION: target statement ISSUED -> CORRECTED; increments WageStatement.version by 1 (and target's)"]

  - method: POST
    path: "/wage-statements/{statementId}/void"
    description: "ISSUED|CORRECTED -> VOIDED"
    roles: [BureauTaxFiler]
    code: 200
    input: []
    output: WageStatement
    side_effects: ["increments WageStatement.version by 1"]

  - method: GET
    path: "/credit-assessments"
    description: "List credit assessments (client_id filter is the reverse-reachability channel)"
    roles: [BureauCompliance, BureauTreasury]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: CreditAssessment[]
    side_effects: []

  - method: GET
    path: "/credit-assessments/{assessmentId}"
    description: "Get one credit assessment"
    roles: [BureauCompliance, BureauTreasury]
    code: 200
    input: []
    output: CreditAssessment
    side_effects: []

  - method: GET
    path: "/clients/{clientId}/wage-statements/summary"
    description: "Annual totals per wage_statement_annual_total; ?tax_year= and ?include_voided= select the variant"
    roles: [BureauCompliance, BureauTaxFiler, ClientPayrollAdmin]
    code: 200
    input: [tax_year, "include_voided?"]
    output: "{ tax_year: integer, total_wages_cents: integer, total_withheld_cents: integer, active_statement_count: integer, voided_total_cents: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role; X-User-ID missing for an entity-backed role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity-backed identity mismatch (ClientPayrollAdmin acting on another client's aggregate)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: the user who filed a return/amendment attempts to accept, reject, or reconcile the same object" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, out-of-domain enum, negative cents, period_end < period_start, or adjustment_amount_cents missing/non-positive on an ADJUSTMENT resolution" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined (incl. correction targeting a non-ISSUED statement, manual cancel of a non-SCHEDULED deposit, reverse of a non-PENDING impound's run)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Client is not ACTIVE (SUSPENDED by strikes, still ONBOARDING, or TERMINATED) for a payroll submit/impound/create attempt" }
  - { id: ERR_CREDIT_HOLD_ACTIVE, http: 409, condition: "Compliance credit hold blocks impound initiation or client activation/reactivation" }
  - { id: ERR_WIRE_CONFIRMATION_REQUIRED, http: 409, condition: "WIRE_REQUIRED impound cannot settle before the client confirms same-day wire funding" }
  - { id: ERR_POA_REQUIRED, http: 422, condition: "Registration verification attempted without poa_document_ref or agency_account_number" }
  - { id: ERR_REGISTRATION_NOT_VERIFIED, http: 422, condition: "Deposit submission, return creation, or ELECTRONIC filing attempted while the jurisdiction registration is PENDING or REJECTED" }
  - { id: ERR_NO_VERIFIED_JURISDICTION, http: 422, condition: "Client activation attempted with zero VERIFIED registrations" }
  - { id: ERR_DUPLICATE_DEPOSIT, http: 409, condition: "A SCHEDULED or SUBMITTED deposit already exists for the same (payroll_run_id, jurisdiction_id)" }
  - { id: ERR_DEPOSIT_EXCEEDS_LIABILITY, http: 422, condition: "Cumulative deposits for a run would exceed the run's total_tax_cents" }
  - { id: ERR_FUNDS_NOT_SETTLED, http: 409, condition: "Deposit submission attempted while the backing PayrollRun is not SETTLED" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 409, condition: "Filing attempted before the return period closed (period end + filing window not reached on the logical clock)" }
  - { id: ERR_YEAR_NOT_CLOSED, http: 409, condition: "Wage statement issue attempted before January 1 of tax_year + 1" }
  - { id: ERR_DUPLICATE_ACTIVE_STATEMENT, http: 409, condition: "An ISSUED (or active CORRECTION) statement already exists for (client, tax_year, employee_ref)" }
  - { id: ERR_OPEN_NOTICE_BLOCKS_RECONCILIATION, http: 409, condition: "Reconciliation attempted while an AgencyNotice for the return is OPEN or IN_REVIEW" }
  - { id: ERR_RETURN_NOT_AMENDABLE, http: 409, condition: "Amendment attempted against a return that is not ACCEPTED or RECONCILED" }
  - { id: ERR_OPEN_OBLIGATIONS, http: 409, condition: "Client termination attempted with pending impounds, open deposits, open notices, or non-terminal payroll runs" }
  - { id: ERR_UNRESOLVED_FUNDING_FAILURES, http: 409, condition: "Client reactivation attempted while FundingFailureEvent rows remain unresolved" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClientPayrollAdmin
    description: "The client company's payroll administrator; drafts and submits payroll runs, confirms wire funding, and reads their own client's data"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /payroll-runs — create a run for their own client"
      - "POST /payroll-runs/{id}/submit — submit a run"
      - "POST /payroll-runs/{id}/initiate-impound — initiate the impound (OCC on Client.version)"
      - "POST /payroll-runs/{id}/cancel — cancel a submitted run"
      - "POST /impounds/{id}/confirm-wire — confirm same-day wire funding"
    shared_operations:
      - "GET reads of own client's runs, impounds, deposits, returns, notices, wage statements, registrations, jurisdictions"

  - name: BureauOnboarder
    description: "Bureau onboarding specialist; manages client lifecycle from PROSPECT to ACTIVE and jurisdiction registrations with POA verification"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients — create client"
      - "POST /clients/{id}/begin-onboarding"
      - "POST /clients/{id}/activate"
      - "POST /clients/{id}/registrations — create registration"
      - "POST /registrations/{id}/verify, /reject, /resubmit — registration decisions"
    shared_operations:
      - "GET reads of clients, registrations, jurisdictions, funding failures"

  - name: BureauTaxFiler
    description: "Bureau tax filing operations; schedules deposits, files returns and amendments, and works agency notices on the client's behalf"
    identity: "opaque"
    exclusive_operations:
      - "POST /payroll-runs/{id}/deposits — schedule a deposit (OCC on PayrollRun.version)"
      - "POST /deposits/{id}/submit, /confirm, /fail, /reschedule, /cancel — deposit lifecycle"
      - "POST /returns — create return (OCC on Client.version)"
      - "POST /returns/{id}/file, /accept, /reject, /redraft, /reconcile — return lifecycle (SoD-gated)"
      - "POST /amendments and /amendments/{id}/* — amendment lifecycle (SoD-gated)"
      - "POST /notices and /notices/{id}/* — agency notice handling"
      - "POST /wage-statements and /wage-statements/{id}/issue, /void — year-end statements"
    shared_operations:
      - "GET reads of deposits, returns, amendments, notices, wage statements, clients, registrations, jurisdictions"

  - name: BureauTreasury
    description: "Bureau treasury operations; settles/fails/returns impounds, reverses drafted payrolls, and cures funding failures"
    identity: "opaque"
    exclusive_operations:
      - "POST /impounds/{id}/settle, /fail, /return, /miss-wire — impound lifecycle"
      - "POST /payroll-runs/{id}/reverse — reverse a drafted payroll"
      - "POST /funding-failures/{id}/resolve — cure a funding strike"
    shared_operations:
      - "GET reads of impounds, payroll runs, deposits, clients, jurisdictions"

  - name: BureauCompliance
    description: "Bureau compliance officer; owns jurisdiction configuration, credit holds, client termination/reactivation, manual credit reviews, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /jurisdictions — create jurisdiction"
      - "POST /_clock/set_current_utc — set the logical clock"
      - "POST /clients/{id}/credit-hold — set/clear credit hold"
      - "POST /clients/{id}/terminate"
      - "POST /clients/{id}/reactivate"
      - "POST /clients/{id}/credit-assessments — manual credit review"
    shared_operations:
      - "GET reads across all resources; POST /notices — record an agency notice"
