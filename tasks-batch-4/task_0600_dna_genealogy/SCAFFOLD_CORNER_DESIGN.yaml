        distinguishing_aspect: "A DELETE request approved at 2026-05-01 is scheduled for 2026-05-08T00:00:00Z; a purge-run at exactly that instant (inclusive boundary) completes it, purges the customer, revokes reports and withdraws consents; a purge-run one day earlier is a no-op."
