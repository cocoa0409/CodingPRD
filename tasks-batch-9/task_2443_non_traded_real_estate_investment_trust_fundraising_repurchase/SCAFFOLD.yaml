# =============================================================================
# task_2443 — Non-Traded REIT Fundraising & Repurchase (non-traded REIT sponsor)
# SCAFFOLD.yaml — §1.0 through §1.7
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2443. Non-Traded Real Estate Investment Trust Fundraising & Repurchase (non-traded REIT sponsor): continuous offering registration with escrow break and minimum offering thresholds, share class structure with differing fees, selling commissions and distribution fee caps, monthly net asset value calculation methodology with independent valuation advisor oversight, distribution declaration with coverage from cash flow versus return of capital disclosure, share repurchase plan with monthly and quarterly caps, early repurchase deduction and suspension authority, broker-dealer selling agreement supervision and suitability documentation, subscription processing, transfer agent operations and investor reporting, liquidity event planning and stockholder approval

domain_name: nontraded-reit-fundraising
api_prefix: "/"

# -----------------------------------------------------------------------------
# §0 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a top-level collection reached by its own path segment; all
  # relationships are foreign keys carried in request bodies, never URL nesting.

  state_machine_shape: parallel
  # Offering carries three independent status axes (registration_status ×
  # escrow_status × repurchase_plan_status). NavRecord adds a revision cycle
  # (DRAFT → ADVISOR_REVIEW → DRAFT), RepurchaseRequest adds a fork
  # (QUEUED → {FULFILLED, PARTIALLY_FULFILLED, REJECTED}) with divergent
  # side-effect sets per branch, and SellingAgreement is compound (status is
  # derived from open supervision-finding counters).

  relationship_patterns:
    - one_to_many        # Offering → ShareClass / SellingAgreement / RepurchasePeriod / DistributionDeclaration / LiquidityEvent
    - cross_aggregate    # ShareLot references Subscription, Investor and ShareClass across aggregates
    - polymorphic: false
    - self_referential   # ShareLot.converted_from_share_class_id links a lot back across ShareClass rows after a distribution-fee-cap conversion

  role_model: segregation_of_duties
  # NAV preparer (SponsorOperator) may never confirm its own NAV — only
  # IndependentValuationAdvisor may. Distributions are declared by
  # SponsorOperator but paid only by TransferAgent. Supervision findings and
  # repurchase-plan suspension belong to ComplianceOfficer, never to the
  # SponsorOperator who runs fundraising.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
#
# Money: integer cents. Share quantities: integer `_e4` units where
# 1 share = 10000 e4 units (four decimal places of a share).
# -----------------------------------------------------------------------------
entities:
  - name: Offering
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Registered offering name", constraints: "1..120 chars" }
      - { name: minimum_offering_amount_cents, type: integer, source: input, description: "Minimum offering proceeds that must sit in escrow before escrow may be broken", constraints: ">= 1" }
      - { name: maximum_offering_amount_cents, type: integer, source: input, description: "Registered maximum aggregate offering amount", constraints: ">= minimum_offering_amount_cents" }
      - { name: escrow_deadline_date, type: string, source: input, description: "Last calendar date (YYYY-MM-DD, UTC) on which escrow may be broken", constraints: "YYYY-MM-DD" }
      - { name: initial_offering_price_cents, type: integer, source: input, description: "Price per share used whenever no PUBLISHED NavRecord exists for a share class", constraints: "> 0" }
      - { name: rescission_window_days, type: integer, source: input, description: "Days after a ShareLot's issued_date during which the investor may rescind the subscription", default: 5, constraints: ">= 0" }
      - { name: registration_status, type: enum, source: system, description: "Registration axis: DRAFT | EFFECTIVE | SUSPENDED | CLOSED", default: DRAFT }
      - { name: escrow_status, type: enum, source: system, description: "Escrow axis: COLLECTING | BROKEN | FAILED", default: COLLECTING }
      - { name: repurchase_plan_status, type: enum, source: system, description: "Share repurchase plan axis: ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }
      - { name: repurchase_plan_suspension_reason, type: string, source: system, description: "Reason recorded when repurchase_plan_status becomes SUSPENDED; null otherwise", default: null }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "= sum(Subscription.gross_investment_cents WHERE subscription.offering_id = this.id AND subscription.status = ESCROWED)", default: 0 }
      - { name: gross_proceeds_cents, type: integer, source: computed, description: "= sum(Subscription.gross_investment_cents WHERE subscription.offering_id = this.id AND subscription.status = ACCEPTED)", default: 0 }
      - { name: aggregate_nav_cents, type: integer, source: computed, description: "= sum over ShareClass of this offering of round_half_up(class_transaction_price_cents * shares_outstanding_e4 / 10000); see calculations.aggregate_nav", default: 0 }

  - name: ShareClass
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; the offering this class belongs to" }
      - { name: class_code, type: enum, source: input, description: "T | S | D | I — unique per offering_id" }
      - { name: upfront_selling_commission_bps, type: integer, source: input, description: "Upfront selling commission in basis points of gross_investment_cents", constraints: "0..1000" }
      - { name: dealer_manager_fee_bps, type: integer, source: input, description: "Dealer manager fee in basis points of gross_investment_cents", constraints: "0..300" }
      - { name: annual_distribution_fee_bps, type: integer, source: input, description: "Annual distribution (trail) fee in basis points of lot value; accrues monthly on declaration payment", constraints: "0..1500" }
      - { name: distribution_fee_cap_bps, type: integer, source: input, description: "Cumulative distribution-fee cap in basis points of a lot's gross_offering_price_cents; 0 means no distribution fee is ever charged", constraints: "0..2000" }
      - { name: converts_to_class_code, type: enum, source: input, description: "Class code a lot converts into once its distribution-fee cap is reached; null for classes that never convert", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED_TO_NEW", default: ACTIVE }
      - { name: shares_outstanding_e4, type: integer, source: computed, description: "= sum(ShareLot.remaining_shares_e4 WHERE share_lot.share_class_id = this.id AND share_lot.status = OPEN)", default: 0 }

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Investor legal name", constraints: "1..120 chars" }
      - { name: email, type: string, source: input, description: "Investor email; unique across investors" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code driving the concentration-limit basis", constraints: "exactly 2 uppercase letters" }
      - { name: net_worth_cents, type: integer, source: input, description: "Investor-attested net worth in cents", constraints: ">= 0" }
      - { name: annual_income_cents, type: integer, source: input, description: "Investor-attested annual income in cents", constraints: ">= 0" }
      - { name: suitability_status, type: enum, source: system, description: "INCOMPLETE | DOCUMENTED | FLAGGED", default: INCOMPLETE }
      - { name: suitability_documentation_reference, type: string, source: system, description: "Reference string of the last accepted suitability documentation package; null when never documented", default: null }
      - { name: concentration_limit_cents, type: integer, source: computed, description: "= floor(concentration_basis_cents * 1000 / 10000); see calculations.investor_concentration_limit", default: 0 }
      - { name: cumulative_invested_cents, type: integer, source: computed, description: "= sum(Subscription.gross_investment_cents WHERE subscription.investor_id = this.id AND subscription.status = ACCEPTED)", default: 0 }
      - { name: total_shares_e4, type: integer, source: computed, description: "= sum(ShareLot.remaining_shares_e4 WHERE share_lot.investor_id = this.id AND share_lot.status = OPEN)", default: 0 }
      - { name: cumulative_distributions_received_cents, type: integer, source: computed, description: "Running total of per-lot distribution credits paid to this investor across all PAID declarations", default: 0 }
      - { name: cumulative_early_repurchase_deduction_cents, type: integer, source: computed, description: "Running total of early-repurchase deductions withheld from this investor's settled repurchases", default: 0 }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | CLOSED_NO_POSITION", default: ACTIVE }

  - name: BrokerDealer
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Broker-dealer firm name" }
      - { name: crd_number, type: string, source: input, description: "CRD registration number; unique across broker dealers" }
      - { name: supervision_status, type: enum, source: system, description: "IN_GOOD_STANDING | HEIGHTENED_SUPERVISION | BARRED", default: IN_GOOD_STANDING }
      - { name: suspended_agreement_count, type: integer, source: computed, description: "= count(SellingAgreement WHERE selling_agreement.broker_dealer_id = this.id AND selling_agreement.status = SUSPENDED)", default: 0 }

  - name: SellingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering covered by this selling agreement" }
      - { name: broker_dealer_id, type: string, source: input, description: "FK -> BrokerDealer.id; the selling firm bound by this agreement" }
      - { name: max_commission_bps, type: integer, source: input, description: "Maximum total upfront load (selling commission + dealer manager fee) in bps this firm may place", constraints: "0..1300" }
      - { name: suitability_documentation_required, type: boolean, source: input, description: "Whether investors placed under this agreement must carry suitability_status = DOCUMENTED", default: true }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | TERMINATED", default: PENDING }
      - { name: open_minor_finding_count, type: integer, source: computed, description: "Open MINOR supervision findings recorded against this agreement", default: 0 }
      - { name: open_major_finding_count, type: integer, source: computed, description: "Open MAJOR supervision findings recorded against this agreement", default: 0 }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering subscribed into" }
      - { name: share_class_id, type: string, source: input, description: "FK -> ShareClass.id; class subscribed into" }
      - { name: investor_id, type: string, source: input, description: "FK -> Investor.id; subscribing investor" }
      - { name: selling_agreement_id, type: string, source: input, description: "FK -> SellingAgreement.id; agreement under which the sale was placed" }
      - { name: gross_investment_cents, type: integer, source: input, description: "Gross subscription amount tendered by the investor", constraints: ">= 1" }
      - { name: transaction_price_cents, type: integer, source: computed, description: "Price per share pinned at subscription creation; see calculations.transaction_price_selection" }
      - { name: upfront_selling_commission_cents, type: integer, source: computed, description: "= round_half_up(gross_investment_cents * share_class.upfront_selling_commission_bps / 10000)" }
      - { name: dealer_manager_fee_cents, type: integer, source: computed, description: "= round_half_up(gross_investment_cents * share_class.dealer_manager_fee_bps / 10000)" }
      - { name: net_invested_cents, type: integer, source: computed, description: "= gross_investment_cents - upfront_selling_commission_cents - dealer_manager_fee_cents (per-line rounding, then sum)" }
      - { name: shares_issued_e4, type: integer, source: computed, description: "= floor(net_invested_cents * 10000 / transaction_price_cents); minted into a ShareLot on ACCEPTED" }
      - { name: unapplied_cash_cents, type: integer, source: computed, description: "= net_invested_cents - floor(shares_issued_e4 * transaction_price_cents / 10000); returned to the investor at acceptance" }
      - { name: status, type: enum, source: system, description: "PENDING | ESCROWED | ACCEPTED | REJECTED | REFUNDED | RESCINDED", default: PENDING }
      - { name: rejection_reason, type: string, source: system, description: "Reason captured on REJECTED / REFUNDED / RESCINDED; null otherwise", default: null }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock instant at which the subscription became ACCEPTED; null otherwise", default: null }

  - name: ShareLot
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; the subscription that minted this lot" }
      - { name: investor_id, type: string, source: input, description: "FK -> Investor.id; holder of record" }
      - { name: share_class_id, type: string, source: input, description: "FK -> ShareClass.id; class the lot currently sits in" }
      - { name: converted_from_share_class_id, type: string, source: system, description: "FK -> ShareClass.id; class the lot converted out of when its distribution-fee cap was reached; null when never converted", default: null }
      - { name: issued_date, type: datetime, source: system, description: "Logical-clock instant of minting; basis for holding-period and rescission-window arithmetic" }
      - { name: original_shares_e4, type: integer, source: system, description: "Share units minted (or re-minted on conversion)" }
      - { name: remaining_shares_e4, type: integer, source: computed, description: "Share units still held after repurchase settlements", default: 0 }
      - { name: gross_offering_price_cents, type: integer, source: system, description: "Gross investment attributable to this lot; the basis of distribution_fee_cap_cents and never changed by conversion" }
      - { name: cumulative_distribution_fee_cents, type: integer, source: computed, description: "Distribution fees accrued against this lot across all PAID declarations", default: 0 }
      - { name: distribution_fee_cap_cents, type: integer, source: computed, description: "= floor(gross_offering_price_cents * share_class.distribution_fee_cap_bps / 10000) evaluated against the class the lot sat in at minting" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | RESCINDED", default: OPEN }

  - name: NavRecord
    parent: null
    common_fields: true
    fields:
      - { name: share_class_id, type: string, source: input, description: "FK -> ShareClass.id; class being valued" }
      - { name: period_start_date, type: string, source: input, description: "First calendar date of the valuation period (YYYY-MM-DD, UTC), inclusive", constraints: "YYYY-MM-DD" }
      - { name: period_end_date, type: string, source: input, description: "Last calendar date of the valuation period (YYYY-MM-DD, UTC), inclusive", constraints: ">= period_start_date" }
      - { name: gross_asset_value_cents, type: integer, source: input, description: "Advisor-appraised gross asset value allocable to the class", constraints: ">= 0" }
      - { name: other_liabilities_cents, type: integer, source: input, description: "Class-allocable liabilities excluding declared-but-unpaid distributions", constraints: ">= 0" }
      - { name: accrued_distribution_payable_cents, type: integer, source: computed, description: "= sum(DistributionDeclaration.total_declared_cents WHERE declaration.offering_id = share_class.offering_id AND declaration.status = DECLARED AND declaration.record_date <= period_end_date)" }
      - { name: shares_outstanding_e4_snapshot, type: integer, source: computed, description: "ShareClass.shares_outstanding_e4 captured at NavRecord creation" }
      - { name: nav_per_share_pre_accrual_cents, type: integer, source: computed, description: "Disclosure variant: ignores accrued_distribution_payable_cents; see calculations.nav_per_share" }
      - { name: nav_per_share_cents, type: integer, source: computed, description: "Official variant: net of accrued_distribution_payable_cents; the transaction price once PUBLISHED" }
      - { name: variance_bps, type: integer, source: computed, description: "= floor(abs(nav_per_share_cents - prior_published_nav_per_share_cents) * 10000 / prior_published_nav_per_share_cents); 0 when no prior PUBLISHED record exists for the class" }
      - { name: advisor_opinion_reference, type: string, source: system, description: "Independent valuation advisor opinion reference recorded on ADVISOR_CONFIRMED; null until then", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Advisor rejection reason recorded when the record is pushed back to DRAFT; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | ADVISOR_REVIEW | ADVISOR_CONFIRMED | PUBLISHED | SUPERSEDED", default: DRAFT }

  - name: DistributionDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering declaring the distribution" }
      - { name: record_date, type: string, source: input, description: "Record date (YYYY-MM-DD, UTC) determining which lots participate", constraints: "YYYY-MM-DD" }
      - { name: payment_date, type: string, source: input, description: "Scheduled payment date (YYYY-MM-DD, UTC)", constraints: ">= record_date" }
      - { name: declared_per_share_cents, type: integer, source: input, description: "Declared distribution per whole share, in cents", constraints: ">= 1" }
      - { name: gaap_net_income_cents, type: integer, source: input, description: "GAAP net income for the declaration period", constraints: "any integer" }
      - { name: adjusted_cash_flow_cents, type: integer, source: input, description: "Adjusted cash flow from operations (AFFO) for the declaration period", constraints: "any integer" }
      - { name: board_uncovered_acknowledgement, type: boolean, source: input, description: "Board acknowledgement that the declaration is not fully covered by adjusted cash flow", default: false }
      - { name: total_declared_cents, type: integer, source: computed, description: "= sum over ShareClass of the offering of round_half_up(declared_per_share_cents * shares_outstanding_e4 / 10000)" }
      - { name: coverage_ratio_gaap_bps, type: integer, source: computed, description: "= floor(gaap_net_income_cents * 10000 / total_declared_cents)" }
      - { name: coverage_ratio_cash_bps, type: integer, source: computed, description: "= floor(adjusted_cash_flow_cents * 10000 / total_declared_cents)" }
      - { name: return_of_capital_bps, type: integer, source: computed, description: "Disclosed return-of-capital portion on the cash-flow basis = max(0, 10000 - coverage_ratio_cash_bps)" }
      - { name: gaap_return_of_capital_bps, type: integer, source: computed, description: "Return-of-capital portion on the GAAP basis = max(0, 10000 - coverage_ratio_gaap_bps)" }
      - { name: total_distribution_fee_accrued_cents, type: integer, source: computed, description: "Distribution fees accrued across all OPEN lots when this declaration was paid", default: 0 }
      - { name: status, type: enum, source: system, description: "DECLARED | SUPERSEDED | PAID | CANCELLED", default: DECLARED }

  - name: RepurchasePeriod
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering whose repurchase plan this period belongs to" }
      - { name: period_month, type: string, source: input, description: "Calendar month of the period (YYYY-MM); unique per offering among periods with status != CANCELLED", constraints: "YYYY-MM" }
      - { name: quarter_key, type: string, source: computed, description: "= '<YYYY>-Q<n>' derived from period_month; groups periods for the quarterly cap" }
      - { name: opens_at, type: datetime, source: input, description: "Inclusive start of the request window (half-open interval [opens_at, request_cutoff_at))" }
      - { name: request_cutoff_at, type: datetime, source: input, description: "Exclusive end of the request window; processing is only permitted at or after this instant", constraints: "> opens_at" }
      - { name: settlement_date, type: string, source: input, description: "Settlement date (YYYY-MM-DD, UTC); the next period may not open until settlement_date + 5 days", constraints: ">= date(request_cutoff_at)" }
      - { name: monthly_cap_cents, type: integer, source: computed, description: "= floor(offering.aggregate_nav_cents * 200 / 10000) captured at processing", default: 0 }
      - { name: quarterly_remaining_cents, type: integer, source: computed, description: "= max(0, floor(offering.aggregate_nav_cents * 500 / 10000) - quarter_used_cents) captured at processing", default: 0 }
      - { name: capacity_cents, type: integer, source: computed, description: "= min(monthly_cap_cents, quarterly_remaining_cents) captured at processing", default: 0 }
      - { name: settled_amount_cents, type: integer, source: computed, description: "= sum(RepurchaseRequest.approved_value_cents for requests of this period) — the gross basis charged against both caps", default: 0 }
      - { name: prorated, type: boolean, source: computed, description: "True when at least one non-hardship request in this period was cut back by the capacity pro-ration", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED | PROCESSED | CANCELLED", default: OPEN }

  - name: RepurchaseRequest
    parent: null
    common_fields: true
    fields:
      - { name: repurchase_period_id, type: string, source: input, description: "FK -> RepurchasePeriod.id; period the request is queued into" }
      - { name: investor_id, type: string, source: system, description: "FK -> Investor.id; taken from the acting InvestorUser's X-User-ID" }
      - { name: share_class_id, type: string, source: input, description: "FK -> ShareClass.id; class whose shares are tendered" }
      - { name: shares_requested_e4, type: integer, source: input, description: "Share units tendered for repurchase", constraints: ">= 1" }
      - { name: hardship_type, type: enum, source: input, description: "NONE | DEATH | DISABILITY — DEATH and DISABILITY are Tier 1 in the allocation waterfall", default: NONE }
      - { name: requested_value_cents, type: integer, source: computed, description: "= round_half_up(shares_requested_e4 * class_transaction_price_cents / 10000) captured at processing" }
      - { name: approved_value_cents, type: integer, source: computed, description: "Gross value approved by the allocation waterfall; 0 when rejected", default: 0 }
      - { name: approved_shares_e4, type: integer, source: computed, description: "= floor(approved_value_cents * 10000 / class_transaction_price_cents)", default: 0 }
      - { name: early_repurchase_deduction_cents, type: integer, source: computed, description: "Sum of per-lot early-repurchase deductions withheld from this request", default: 0 }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "Sum of per-lot (gross - deduction) amounts paid for this request", default: 0 }
      - { name: status, type: enum, source: system, description: "QUEUED | HELD | FULFILLED | PARTIALLY_FULFILLED | REJECTED | WITHDRAWN", default: QUEUED }

  - name: LiquidityEvent
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering whose liquidity is being planned" }
      - { name: event_type, type: enum, source: input, description: "LISTING | MERGER | ASSET_SALE" }
      - { name: proposed_effective_date, type: string, source: input, description: "Proposed effective date (YYYY-MM-DD, UTC)", constraints: "YYYY-MM-DD" }
      - { name: record_date_shares_e4, type: integer, source: computed, description: "= sum(ShareClass.shares_outstanding_e4) across the offering, snapshotted when the vote opens", default: 0 }
      - { name: votes_for_e4, type: integer, source: computed, description: "= sum(StockholderVote.voting_shares_e4 WHERE choice = FOR)", default: 0 }
      - { name: votes_against_e4, type: integer, source: computed, description: "= sum(StockholderVote.voting_shares_e4 WHERE choice = AGAINST)", default: 0 }
      - { name: votes_abstain_e4, type: integer, source: computed, description: "= sum(StockholderVote.voting_shares_e4 WHERE choice = ABSTAIN)", default: 0 }
      - { name: quorum_met, type: boolean, source: computed, description: "= (votes_for_e4 + votes_against_e4 + votes_abstain_e4) >= floor(record_date_shares_e4 / 2), evaluated at tally", default: false }
      - { name: status, type: enum, source: system, description: "PROPOSED | BOARD_APPROVED | VOTE_OPEN | APPROVED | REJECTED | EXECUTED | ABANDONED", default: PROPOSED }

  - name: StockholderVote
    parent: null
    common_fields: false
    fields:
      - { name: liquidity_event_id, type: string, source: input, description: "FK -> LiquidityEvent.id; event being voted on" }
      - { name: investor_id, type: string, source: system, description: "FK -> Investor.id; taken from the acting InvestorUser's X-User-ID" }
      - { name: choice, type: enum, source: input, description: "FOR | AGAINST | ABSTAIN" }
      - { name: voting_shares_e4, type: integer, source: system, description: "Investor.total_shares_e4 snapshotted at the instant the ballot was cast; immutable thereafter" }

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
#
# Offering carries three INDEPENDENT status axes, each modelled as its own
# machine. All other entities have a single `status` axis.
# -----------------------------------------------------------------------------
state_machines:
  - entity: Offering
    state_field: registration_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /offerings/{offering_id}/registration { action: DECLARE_EFFECTIVE }"
        actor: ComplianceOfficer
        preconditions:
          - "at least one ShareClass exists for the offering"
          - "current logical date <= offering.escrow_deadline_date"
        side_effects:
          - "increments Offering.version by 1"
      - from: EFFECTIVE
        to: SUSPENDED
        trigger: "POST /offerings/{offering_id}/registration { action: SUSPEND }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments Offering.version by 1"
          - "new Subscription creation is blocked with ERR_OFFERING_NOT_EFFECTIVE while suspended"
      - from: SUSPENDED
        to: EFFECTIVE
        trigger: "POST /offerings/{offering_id}/registration { action: REINSTATE }"
        actor: ComplianceOfficer
        preconditions:
          - "offering.escrow_status != FAILED"
        side_effects:
          - "increments Offering.version by 1"
      - from: EFFECTIVE
        to: CLOSED
        trigger: "POST /offerings/{offering_id}/registration { action: CLOSE }"
        actor: ComplianceOfficer
        preconditions:
          - "no Subscription of this offering is in status PENDING or ESCROWED"
        side_effects:
          - "increments Offering.version by 1"
          - "sets every ACTIVE ShareClass of the offering to CLOSED_TO_NEW"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /offerings/{offering_id}/registration { action: CLOSE }"
        actor: ComplianceOfficer
        preconditions:
          - "no Subscription of this offering is in status PENDING or ESCROWED"
        side_effects:
          - "increments Offering.version by 1"
          - "sets every ACTIVE ShareClass of the offering to CLOSED_TO_NEW"

  - entity: Offering
    state_field: escrow_status
    initial_state: COLLECTING
    terminal_states: [BROKEN, FAILED]
    transitions:
      - from: COLLECTING
        to: BROKEN
        trigger: "POST /offerings/{offering_id}/escrow { action: BREAK }"
        actor: ComplianceOfficer
        preconditions:
          - "offering.registration_status = EFFECTIVE"
          - "offering.escrow_balance_cents >= offering.minimum_offering_amount_cents"
          - "current logical date <= offering.escrow_deadline_date"
        side_effects:
          - "increments Offering.version by 1"
          - "transitions every ESCROWED Subscription of the offering to ACCEPTED in created_at ASC order"
          - "mints one ShareLot per accepted Subscription with issued_date = current logical clock"
          - "recomputes ShareClass.shares_outstanding_e4 and Investor.total_shares_e4 for every touched row"
          - "recomputes Investor.cumulative_invested_cents and re-evaluates suitability_status against concentration_limit_cents"
          - "moves offering.escrow_balance_cents into offering.gross_proceeds_cents"
      - from: COLLECTING
        to: FAILED
        trigger: "POST /offerings/{offering_id}/escrow { action: FAIL }"
        actor: ComplianceOfficer
        preconditions:
          - "current logical date > offering.escrow_deadline_date OR offering.registration_status = SUSPENDED"
        side_effects:
          - "increments Offering.version by 1"
          - "transitions every ESCROWED Subscription of the offering to REFUNDED with rejection_reason = 'ESCROW_FAILED'"
          - "zeroes offering.escrow_balance_cents"
          - "sets offering.repurchase_plan_status to TERMINATED"

  - entity: Offering
    state_field: repurchase_plan_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: SUSPEND, reason }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments Offering.version by 1"
          - "records offering.repurchase_plan_suspension_reason"
          - "sets every OPEN RepurchasePeriod of the offering to SUSPENDED"
          - "sets every QUEUED RepurchaseRequest in those periods to HELD"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: RESUME }"
        actor: ComplianceOfficer
        preconditions:
          - "offering.escrow_status = BROKEN"
        side_effects:
          - "increments Offering.version by 1"
          - "clears offering.repurchase_plan_suspension_reason"
          - "sets every SUSPENDED RepurchasePeriod of the offering back to OPEN"
          - "sets every HELD RepurchaseRequest in those periods back to QUEUED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: TERMINATE, reason }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments Offering.version by 1"
          - "sets every OPEN or SUSPENDED RepurchasePeriod of the offering to CANCELLED"
          - "sets every QUEUED or HELD RepurchaseRequest in those periods to REJECTED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: TERMINATE, reason }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments Offering.version by 1"
          - "sets every OPEN or SUSPENDED RepurchasePeriod of the offering to CANCELLED"
          - "sets every QUEUED or HELD RepurchaseRequest in those periods to REJECTED"

  - entity: ShareClass
    state_field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED_TO_NEW]
    transitions:
      - from: ACTIVE
        to: CLOSED_TO_NEW
        trigger: "POST /offerings/{offering_id}/registration { action: CLOSE } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "parent offering transitions registration_status to CLOSED"
        side_effects:
          - "increments ShareClass.version by 1"
          - "further Subscription creation into the class fails with ERR_SHARE_CLASS_CLOSED"
      - from: ACTIVE
        to: CLOSED_TO_NEW
        trigger: "POST /share-classes/{share_class_id}/status { to_status: CLOSED_TO_NEW }"
        actor: SponsorOperator
        preconditions:
          - "offering.registration_status = EFFECTIVE"
        side_effects:
          - "increments ShareClass.version by 1"
          - "further Subscription creation into the class fails with ERR_SHARE_CLASS_CLOSED while sibling classes of the same offering stay open"

  - entity: Investor
    state_field: suitability_status
    initial_state: INCOMPLETE
    terminal_states: []
    transitions:
      - from: INCOMPLETE
        to: DOCUMENTED
        trigger: "POST /investors/{investor_id}/suitability-documentation"
        actor: BrokerDealerRep
        preconditions:
          - "documentation_reference is present"
        side_effects:
          - "records investor.suitability_documentation_reference"
          - "increments Investor.version by 1"
      - from: DOCUMENTED
        to: FLAGGED
        trigger: "POST /offerings/{offering_id}/escrow { action: BREAK } or POST /subscriptions/{subscription_id}/status { to_status: ACCEPTED } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "investor.cumulative_invested_cents > investor.concentration_limit_cents after the acceptance"
        side_effects:
          - "increments Investor.version by 1"
          - "further Subscription creation for the investor fails with ERR_SUITABILITY_NOT_DOCUMENTED"
      - from: FLAGGED
        to: DOCUMENTED
        trigger: "POST /investors/{investor_id}/suitability-documentation"
        actor: ComplianceOfficer
        preconditions:
          - "acting role is ComplianceOfficer (a BrokerDealerRep may not clear a FLAGGED investor)"
        side_effects:
          - "replaces investor.suitability_documentation_reference"
          - "increments Investor.version by 1"

  - entity: Investor
    state_field: account_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CLOSED_NO_POSITION
        trigger: "POST /repurchase-periods/{repurchase_period_id}/processing (cascade) or POST /subscriptions/{subscription_id}/status { to_status: RESCINDED } (cascade)"
        actor: TransferAgent
        preconditions:
          - "investor.total_shares_e4 becomes 0 after the settlement closes, or the rescission voids, its last OPEN ShareLot"
        side_effects:
          - "increments Investor.version by 1"
      - from: CLOSED_NO_POSITION
        to: ACTIVE
        trigger: "POST /subscriptions/{subscription_id}/status { to_status: ACCEPTED } (cascade)"
        actor: SponsorOperator
        preconditions:
          - "a new ShareLot is minted for the investor"
        side_effects:
          - "increments Investor.version by 1"

  - entity: BrokerDealer
    state_field: supervision_status
    initial_state: IN_GOOD_STANDING
    terminal_states: [BARRED]
    transitions:
      - from: IN_GOOD_STANDING
        to: HEIGHTENED_SUPERVISION
        trigger: "POST /broker-dealers/{broker_dealer_id}/supervision-status { to_status: HEIGHTENED_SUPERVISION }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments BrokerDealer.version by 1"
      - from: HEIGHTENED_SUPERVISION
        to: IN_GOOD_STANDING
        trigger: "POST /broker-dealers/{broker_dealer_id}/supervision-status { to_status: IN_GOOD_STANDING }"
        actor: ComplianceOfficer
        preconditions:
          - "broker_dealer.suspended_agreement_count = 0"
        side_effects:
          - "increments BrokerDealer.version by 1"
      - from: HEIGHTENED_SUPERVISION
        to: BARRED
        trigger: "POST /broker-dealers/{broker_dealer_id}/supervision-status { to_status: BARRED }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments BrokerDealer.version by 1"
          - "sets every PENDING, ACTIVE or SUSPENDED SellingAgreement of the firm to TERMINATED"
          - "sets every PENDING Subscription placed under those agreements to REJECTED with rejection_reason = 'BROKER_DEALER_BARRED'"

  - entity: SellingAgreement
    state_field: status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /selling-agreements/{selling_agreement_id}/status { to_status: ACTIVE }"
        actor: ComplianceOfficer
        preconditions:
          - "broker_dealer.supervision_status != BARRED"
          - "offering.registration_status = EFFECTIVE"
        side_effects:
          - "increments SellingAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /selling-agreements/{selling_agreement_id}/supervision-findings { action: RECORD } (auto-derived) or { to_status: SUSPENDED }"
        actor: ComplianceOfficer
        preconditions:
          - "open_minor_finding_count >= 3 OR open_major_finding_count >= 1, or an explicit SUSPEND is requested"
        side_effects:
          - "increments SellingAgreement.version by 1"
          - "increments BrokerDealer.suspended_agreement_count"
          - "sets broker_dealer.supervision_status to HEIGHTENED_SUPERVISION when it was IN_GOOD_STANDING"
          - "new Subscription creation under the agreement fails with ERR_SELLING_AGREEMENT_NOT_ACTIVE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /selling-agreements/{selling_agreement_id}/supervision-findings { action: RESOLVE } (auto-derived)"
        actor: ComplianceOfficer
        preconditions:
          - "open_minor_finding_count < 3 AND open_major_finding_count = 0 after the resolution"
          - "broker_dealer.supervision_status != BARRED"
        side_effects:
          - "increments SellingAgreement.version by 1"
          - "decrements BrokerDealer.suspended_agreement_count"
      - from: PENDING
        to: TERMINATED
        trigger: "POST /selling-agreements/{selling_agreement_id}/status { to_status: TERMINATED }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments SellingAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /selling-agreements/{selling_agreement_id}/status { to_status: TERMINATED }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments SellingAgreement.version by 1"
          - "sets every PENDING Subscription placed under the agreement to REJECTED with rejection_reason = 'AGREEMENT_TERMINATED'"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /selling-agreements/{selling_agreement_id}/status { to_status: TERMINATED }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments SellingAgreement.version by 1"
          - "decrements BrokerDealer.suspended_agreement_count"

  - entity: Subscription
    state_field: status
    initial_state: PENDING
    terminal_states: [REJECTED, REFUNDED, RESCINDED]
    transitions:
      - from: PENDING
        to: ESCROWED
        trigger: "POST /subscriptions/{subscription_id}/status { to_status: ESCROWED }"
        actor: TransferAgent
        preconditions:
          - "offering.escrow_status = COLLECTING"
          - "offering.registration_status = EFFECTIVE"
        side_effects:
          - "increments Subscription.version by 1"
          - "adds gross_investment_cents to offering.escrow_balance_cents"
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /subscriptions/{subscription_id}/status { to_status: ACCEPTED }"
        actor: SponsorOperator
        preconditions:
          - "offering.escrow_status = BROKEN"
          - "offering.registration_status = EFFECTIVE"
          - "a PUBLISHED NavRecord exists for the share class"
          - "offering.gross_proceeds_cents + gross_investment_cents <= offering.maximum_offering_amount_cents"
        side_effects:
          - "increments Subscription.version by 1"
          - "sets accepted_at to the current logical clock"
          - "mints a ShareLot with original_shares_e4 = shares_issued_e4 and distribution_fee_cap_cents from the class"
          - "adds gross_investment_cents to offering.gross_proceeds_cents and to investor.cumulative_invested_cents"
          - "recomputes share_class.shares_outstanding_e4, investor.total_shares_e4 and offering.aggregate_nav_cents"
          - "sets investor.suitability_status to FLAGGED when cumulative_invested_cents now exceeds concentration_limit_cents"
          - "sets investor.account_status to ACTIVE when it was CLOSED_NO_POSITION"
      - from: ESCROWED
        to: ACCEPTED
        trigger: "POST /offerings/{offering_id}/escrow { action: BREAK } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "offering escrow break succeeds"
        side_effects:
          - "identical to the PENDING -> ACCEPTED side effects, applied in created_at ASC order"
      - from: ESCROWED
        to: REFUNDED
        trigger: "POST /offerings/{offering_id}/escrow { action: FAIL } (cascade) or POST /subscriptions/{subscription_id}/status { to_status: REFUNDED }"
        actor: TransferAgent
        preconditions:
          - "offering.escrow_status = COLLECTING or FAILED"
        side_effects:
          - "increments Subscription.version by 1"
          - "subtracts gross_investment_cents from offering.escrow_balance_cents"
      - from: PENDING
        to: REJECTED
        trigger: "POST /subscriptions/{subscription_id}/status { to_status: REJECTED, rejection_reason }"
        actor: SponsorOperator
        preconditions: []
        side_effects:
          - "increments Subscription.version by 1"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /subscriptions/{subscription_id}/status { to_status: RESCINDED, rejection_reason }"
        actor: TransferAgent
        preconditions:
          - "current logical clock <= share_lot.issued_date + offering.rescission_window_days days"
          - "the minted ShareLot has remaining_shares_e4 = original_shares_e4 (no partial repurchase yet)"
        side_effects:
          - "increments Subscription.version by 1"
          - "sets the minted ShareLot to RESCINDED and zeroes its remaining_shares_e4"
          - "subtracts gross_investment_cents from offering.gross_proceeds_cents and investor.cumulative_invested_cents"
          - "recomputes share_class.shares_outstanding_e4, investor.total_shares_e4 and offering.aggregate_nav_cents"
          - "re-evaluates investor.suitability_status (FLAGGED clears back to DOCUMENTED when the limit is respected again)"
          - "sets investor.account_status to CLOSED_NO_POSITION when the investor holds no OPEN lot afterwards"

  - entity: ShareLot
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED, RESCINDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /repurchase-periods/{repurchase_period_id}/processing (cascade)"
        actor: TransferAgent
        preconditions:
          - "remaining_shares_e4 reaches 0 after FIFO consumption by an approved repurchase"
        side_effects:
          - "increments ShareLot.version by 1"
          - "excludes the lot from share_class.shares_outstanding_e4 and investor.total_shares_e4"
          - "sets investor.account_status to CLOSED_NO_POSITION when the investor holds no OPEN lot afterwards"
      - from: OPEN
        to: RESCINDED
        trigger: "POST /subscriptions/{subscription_id}/status { to_status: RESCINDED } (cascade)"
        actor: TransferAgent
        preconditions:
          - "the parent subscription is rescinded inside the rescission window"
        side_effects:
          - "increments ShareLot.version by 1"
          - "zeroes remaining_shares_e4"

  - entity: NavRecord
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADVISOR_REVIEW
        trigger: "POST /nav-records/{nav_record_id}/status { to_status: ADVISOR_REVIEW }"
        actor: SponsorOperator
        preconditions:
          - "current logical date > nav_record.period_end_date"
        side_effects:
          - "increments NavRecord.version by 1"
          - "clears rejection_reason"
      - from: ADVISOR_REVIEW
        to: DRAFT
        trigger: "POST /nav-records/{nav_record_id}/status { to_status: DRAFT, rejection_reason }"
        actor: IndependentValuationAdvisor
        preconditions:
          - "rejection_reason is present"
        side_effects:
          - "increments NavRecord.version by 1"
          - "records rejection_reason; the record may be resubmitted after correction (cycle)"
      - from: ADVISOR_REVIEW
        to: ADVISOR_CONFIRMED
        trigger: "POST /nav-records/{nav_record_id}/status { to_status: ADVISOR_CONFIRMED, advisor_opinion_reference }"
        actor: IndependentValuationAdvisor
        preconditions:
          - "advisor_opinion_reference is present when variance_bps > 500"
        side_effects:
          - "increments NavRecord.version by 1"
          - "records advisor_opinion_reference"
      - from: ADVISOR_CONFIRMED
        to: PUBLISHED
        trigger: "POST /nav-records/{nav_record_id}/status { to_status: PUBLISHED }"
        actor: SponsorOperator
        preconditions:
          - "no other PUBLISHED NavRecord for the class covers an overlapping period"
        side_effects:
          - "increments NavRecord.version by 1"
          - "sets the previously PUBLISHED NavRecord of the class to SUPERSEDED"
          - "recomputes offering.aggregate_nav_cents from the new transaction price"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /nav-records/{nav_record_id}/status { to_status: PUBLISHED } on a later record (cascade)"
        actor: SponsorOperator
        preconditions:
          - "a later-period NavRecord for the same class is published"
        side_effects:
          - "increments NavRecord.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /nav-records (create, cascade)"
        actor: SponsorOperator
        preconditions:
          - "a new NavRecord is created for the same class with an overlapping period"
        side_effects:
          - "increments NavRecord.version by 1"

  - entity: DistributionDeclaration
    state_field: status
    initial_state: DECLARED
    terminal_states: [SUPERSEDED, PAID, CANCELLED]
    transitions:
      - from: DECLARED
        to: PAID
        trigger: "POST /distribution-declarations/{distribution_declaration_id}/payment"
        actor: TransferAgent
        preconditions:
          - "current logical date >= declaration.payment_date"
          - "offering.escrow_status = BROKEN"
        side_effects:
          - "increments DistributionDeclaration.version by 1"
          - "credits each OPEN ShareLot as of record_date into investor.cumulative_distributions_received_cents"
          - "accrues the monthly distribution fee against each OPEN lot, capped by distribution_fee_cap_cents"
          - "converts every lot that reaches its cap into the class named by converts_to_class_code, setting converted_from_share_class_id"
          - "records total_distribution_fee_accrued_cents"
          - "removes the declaration from every future NavRecord.accrued_distribution_payable_cents"
      - from: DECLARED
        to: SUPERSEDED
        trigger: "POST /distribution-declarations (create, cascade)"
        actor: SponsorOperator
        preconditions:
          - "a new declaration is created for the same offering and record_date"
        side_effects:
          - "increments DistributionDeclaration.version by 1"
          - "increments Offering.version by 1"
      - from: DECLARED
        to: CANCELLED
        trigger: "POST /distribution-declarations/{distribution_declaration_id}/payment { action: CANCEL }"
        actor: BoardCommittee
        preconditions:
          - "declaration.status = DECLARED"
        side_effects:
          - "increments DistributionDeclaration.version by 1"
          - "removes the declaration from every future NavRecord.accrued_distribution_payable_cents"

  - entity: RepurchasePeriod
    state_field: status
    initial_state: OPEN
    terminal_states: [PROCESSED, CANCELLED]
    transitions:
      - from: OPEN
        to: PROCESSED
        trigger: "POST /repurchase-periods/{repurchase_period_id}/processing"
        actor: TransferAgent
        preconditions:
          - "current logical clock >= period.request_cutoff_at"
          - "offering.repurchase_plan_status = ACTIVE"
          - "a PUBLISHED NavRecord exists for every class holding a QUEUED request"
        side_effects:
          - "captures monthly_cap_cents, quarterly_remaining_cents and capacity_cents"
          - "runs the tiered pro-rata allocation waterfall over QUEUED requests"
          - "sets each request to FULFILLED, PARTIALLY_FULFILLED or REJECTED"
          - "consumes ShareLot rows FIFO by issued_date ASC then created_at ASC, applying the early-repurchase deduction per lot"
          - "sets settled_amount_cents and prorated"
          - "recomputes share_class.shares_outstanding_e4, investor.total_shares_e4 and offering.aggregate_nav_cents"
          - "sets investor.account_status to CLOSED_NO_POSITION for investors left with no OPEN lot"
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: SUSPEND } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "parent offering suspends the repurchase plan"
        side_effects:
          - "sets every QUEUED RepurchaseRequest of the period to HELD"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: RESUME } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "parent offering resumes the repurchase plan"
        side_effects:
          - "sets every HELD RepurchaseRequest of the period back to QUEUED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: TERMINATE } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "parent offering terminates the repurchase plan"
        side_effects:
          - "sets every QUEUED RepurchaseRequest of the period to REJECTED"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: TERMINATE } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "parent offering terminates the repurchase plan"
        side_effects:
          - "sets every HELD RepurchaseRequest of the period to REJECTED"

  - entity: RepurchaseRequest
    state_field: status
    initial_state: QUEUED
    terminal_states: [FULFILLED, PARTIALLY_FULFILLED, REJECTED, WITHDRAWN]
    transitions:
      - from: QUEUED
        to: FULFILLED
        trigger: "POST /repurchase-periods/{repurchase_period_id}/processing (cascade)"
        actor: TransferAgent
        preconditions:
          - "approved_value_cents = requested_value_cents"
        side_effects:
          - "sets approved_shares_e4, early_repurchase_deduction_cents and net_proceeds_cents"
          - "consumes ShareLot rows FIFO and adds the deduction to investor.cumulative_early_repurchase_deduction_cents"
      - from: QUEUED
        to: PARTIALLY_FULFILLED
        trigger: "POST /repurchase-periods/{repurchase_period_id}/processing (cascade)"
        actor: TransferAgent
        preconditions:
          - "0 < approved_value_cents < requested_value_cents"
        side_effects:
          - "identical settlement side effects on the approved portion; the unapproved portion is NOT carried forward"
          - "sets period.prorated to true"
      - from: QUEUED
        to: REJECTED
        trigger: "POST /repurchase-periods/{repurchase_period_id}/processing (cascade) or POST /offerings/{offering_id}/repurchase-plan { action: TERMINATE } (cascade)"
        actor: TransferAgent
        preconditions:
          - "approved_value_cents = 0, or the repurchase plan is terminated"
        side_effects:
          - "no share lot is consumed and no proceeds are paid"
      - from: QUEUED
        to: HELD
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: SUSPEND } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "parent offering suspends the repurchase plan"
        side_effects:
          - "the request is excluded from any allocation while HELD"
      - from: HELD
        to: QUEUED
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: RESUME } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "parent offering resumes the repurchase plan"
        side_effects: []
      - from: HELD
        to: REJECTED
        trigger: "POST /offerings/{offering_id}/repurchase-plan { action: TERMINATE } (cascade)"
        actor: ComplianceOfficer
        preconditions:
          - "parent offering terminates the repurchase plan"
        side_effects: []
      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /repurchase-requests/{repurchase_request_id}/status { to_status: WITHDRAWN }"
        actor: InvestorUser
        preconditions:
          - "current logical clock < period.request_cutoff_at"
          - "the acting InvestorUser owns the request"
        side_effects:
          - "increments RepurchaseRequest.version by 1"

  - entity: LiquidityEvent
    state_field: status
    initial_state: PROPOSED
    terminal_states: [EXECUTED, ABANDONED]
    transitions:
      - from: PROPOSED
        to: BOARD_APPROVED
        trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: BOARD_APPROVE }"
        actor: BoardCommittee
        preconditions:
          - "offering.escrow_status = BROKEN"
        side_effects:
          - "increments LiquidityEvent.version by 1"
      - from: BOARD_APPROVED
        to: VOTE_OPEN
        trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: OPEN_VOTE }"
        actor: SponsorOperator
        preconditions:
          - "offering.registration_status != DRAFT"
        side_effects:
          - "increments LiquidityEvent.version by 1"
          - "snapshots record_date_shares_e4 from the sum of ShareClass.shares_outstanding_e4"
          - "StockholderVote creation becomes permitted"
      - from: VOTE_OPEN
        to: APPROVED
        trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: CLOSE_VOTE }"
        actor: SponsorOperator
        preconditions:
          - "quorum_met is true and votes_for_e4 * 2 > record_date_shares_e4"
        side_effects:
          - "increments LiquidityEvent.version by 1"
          - "tallies votes_for_e4, votes_against_e4, votes_abstain_e4 and quorum_met"
          - "sets offering.repurchase_plan_status to SUSPENDED with reason 'LIQUIDITY_EVENT_APPROVED'"
      - from: VOTE_OPEN
        to: REJECTED
        trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: CLOSE_VOTE }"
        actor: SponsorOperator
        preconditions:
          - "quorum_met is false OR votes_for_e4 * 2 <= record_date_shares_e4"
        side_effects:
          - "increments LiquidityEvent.version by 1"
          - "tallies votes_for_e4, votes_against_e4, votes_abstain_e4 and quorum_met"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: EXECUTE }"
        actor: BoardCommittee
        preconditions:
          - "current logical date >= liquidity_event.proposed_effective_date"
        side_effects:
          - "increments LiquidityEvent.version by 1"
          - "sets offering.registration_status to CLOSED and repurchase_plan_status to TERMINATED"
          - "sets every ACTIVE ShareClass of the offering to CLOSED_TO_NEW"
      - from: PROPOSED
        to: ABANDONED
        trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: ABANDON }"
        actor: BoardCommittee
        preconditions: []
        side_effects:
          - "increments LiquidityEvent.version by 1"
      - from: BOARD_APPROVED
        to: ABANDONED
        trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: ABANDON }"
        actor: BoardCommittee
        preconditions: []
        side_effects:
          - "increments LiquidityEvent.version by 1"
      - from: VOTE_OPEN
        to: ABANDONED
        trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: ABANDON }"
        actor: BoardCommittee
        preconditions: []
        side_effects:
          - "increments LiquidityEvent.version by 1"
          - "further StockholderVote creation fails with ERR_VOTE_NOT_OPEN"
      - from: REJECTED
        to: ABANDONED
        trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: ABANDON }"
        actor: BoardCommittee
        preconditions: []
        side_effects:
          - "increments LiquidityEvent.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (optimistic concurrency control only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - name: declaration-create-stale-offering
    parent_entity: Offering
    occ_field: expected_offering_version
    write_endpoint: "POST /distribution-declarations"
    error_id: ERR_STALE_OFFERING_VERSION
    http_status: 412
    guarantee: |
      Creating a DistributionDeclaration requires the caller to echo the
      Offering.version it read. If the stored Offering.version differs, the write
      is rejected with ERR_STALE_OFFERING_VERSION (412) and nothing is mutated.
      A successful create increments Offering.version by 1, so any second caller
      still holding the old version is rejected until it re-reads the offering.
    legitimate_use: |
      A board may legitimately supersede a DECLARED declaration by creating a new
      declaration for the same record_date. That supersede path is exactly the
      write that bumps Offering.version, which is why the echo is mandatory: the
      second declaration for a record_date must be authored against the offering
      state that already reflects the first.

  - name: nav-create-stale-share-class
    parent_entity: ShareClass
    occ_field: expected_share_class_version
    write_endpoint: "POST /nav-records"
    error_id: ERR_STALE_SHARE_CLASS_VERSION
    http_status: 412
    guarantee: |
      Creating a NavRecord requires the caller to echo the ShareClass.version it
      read when it snapshotted shares_outstanding_e4. If the stored version
      differs, the write is rejected with ERR_STALE_SHARE_CLASS_VERSION (412) and
      no NavRecord row is created. A successful create increments
      ShareClass.version by 1.
    legitimate_use: |
      Creating a NavRecord whose period overlaps an existing DRAFT record for the
      same class legitimately supersedes that DRAFT. Because the share count is
      snapshotted at creation, the echo forces the preparer to have observed the
      class as of its current outstanding-share total rather than a stale one.

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
#
# Money is integer cents. Share quantities are integer `_e4` units
# (1 share = 10000 e4). `round_half_up(x)` rounds a rational to the nearest
# integer with ties away from zero; `floor` truncates toward negative infinity.
# No calculation ever consults an `id` value; the only sanctioned tie-break is
# `created_at ASC`.
# -----------------------------------------------------------------------------
calculations:
  - name: investor_concentration_limit
    description: |
      Maximum aggregate amount an investor may hold in the offering, expressed as
      a percentage of a state-dependent basis. Strict states measure the
      percentage against the LESSER of net worth and annual income; all other
      states measure it against net worth alone.
    trigger: "Investor creation; recomputed whenever net_worth_cents or annual_income_cents changes"
    inputs: [investor.state_code, investor.net_worth_cents, investor.annual_income_cents]
    algorithm: threshold
    formula: |
      if investor.state_code in STRICT_CONCENTRATION_STATES:
          concentration_basis_cents = min(net_worth_cents, annual_income_cents)
      else:
          concentration_basis_cents = net_worth_cents
      concentration_limit_cents = floor(concentration_basis_cents * CONCENTRATION_LIMIT_BPS / 10000)
    constants:
      CONCENTRATION_LIMIT_BPS: 1000
      STRICT_CONCENTRATION_STATES: ["OH", "MA", "NM", "IA", "AL"]
    precision: "integer cents, floor"

  - name: transaction_price_selection
    description: |
      Price per whole share used to convert money into share units. The most
      recent PUBLISHED NavRecord for the share class wins; before any NAV is
      published the offering's initial_offering_price_cents applies.
    trigger: "Subscription creation; RepurchasePeriod processing; aggregate_nav recomputation"
    inputs: [share_class.id, offering.initial_offering_price_cents, NavRecord.status, NavRecord.period_end_date]
    algorithm: chronological
    formula: |
      candidates = NavRecord WHERE share_class_id = share_class.id AND status = PUBLISHED
      if candidates is empty:
          transaction_price_cents = offering.initial_offering_price_cents
      else:
          winner = candidates ordered by period_end_date DESC, created_at ASC -> first
          transaction_price_cents = winner.nav_per_share_cents
    constants: {}
    precision: "integer cents"
    notes: |
      Subscription ACCEPTANCE additionally REQUIRES a PUBLISHED NavRecord once
      escrow is BROKEN (ERR_NO_PUBLISHED_NAV); the initial_offering_price_cents
      fallback is therefore only reachable while escrow is COLLECTING.

  - name: subscription_load_and_shares
    description: |
      Upfront load and share issuance for a subscription. The selling commission
      and the dealer manager fee are TWO SEPARATE rounded lines, each computed
      from the gross amount and rounded independently, and only then subtracted.
      Rounding the combined bps in a single step produces a different net amount
      for some gross amounts, which is explicitly NOT the required behaviour.
    trigger: "POST /subscriptions (creation)"
    inputs:
      - subscription.gross_investment_cents
      - share_class.upfront_selling_commission_bps
      - share_class.dealer_manager_fee_bps
      - subscription.transaction_price_cents
    algorithm: aggregation
    formula: |
      upfront_selling_commission_cents =
          round_half_up(gross_investment_cents * upfront_selling_commission_bps / 10000)
      dealer_manager_fee_cents =
          round_half_up(gross_investment_cents * dealer_manager_fee_bps / 10000)
      total_load_cents = upfront_selling_commission_cents + dealer_manager_fee_cents
      net_invested_cents = gross_investment_cents - total_load_cents
      shares_issued_e4 = floor(net_invested_cents * 10000 / transaction_price_cents)
      unapplied_cash_cents =
          net_invested_cents - floor(shares_issued_e4 * transaction_price_cents / 10000)
    constants:
      SHARE_UNIT_SCALE: 10000
      MINIMUM_INITIAL_INVESTMENT_CENTS: 250000
      MINIMUM_ADDITIONAL_INVESTMENT_CENTS: 50000
    precision: "each load line rounded half-up to integer cents INDEPENDENTLY, then summed; share units floored"
    notes: |
      Worked divergence: class D at 275 bps commission + 25 bps dealer manager on
      gross 250200 gives 6881 + 626 = 7507, whereas
      round_half_up(250200 * 300 / 10000) = 7506. net_invested_cents must be
      242693, not 242694.

  - name: nav_per_share
    description: |
      Monthly net asset value per share for a share class, produced in two
      variants from one dataset.
    trigger: "POST /nav-records (creation); recomputed on nothing else — the record is a snapshot"
    inputs:
      - nav_record.gross_asset_value_cents
      - nav_record.other_liabilities_cents
      - nav_record.accrued_distribution_payable_cents
      - nav_record.shares_outstanding_e4_snapshot
    algorithm: aggregation
    formula: |
      shares_outstanding_e4_snapshot = share_class.shares_outstanding_e4  # captured at creation
      accrued_distribution_payable_cents =
          sum(DistributionDeclaration.total_declared_cents
              WHERE offering_id = share_class.offering_id
                AND status = DECLARED
                AND record_date <= nav_record.period_end_date)

      net_assets_pre_accrual_cents = gross_asset_value_cents - other_liabilities_cents
      net_assets_cents = net_assets_pre_accrual_cents - accrued_distribution_payable_cents

      if shares_outstanding_e4_snapshot == 0:
          nav_per_share_pre_accrual_cents = offering.initial_offering_price_cents
          nav_per_share_cents            = offering.initial_offering_price_cents
      else:
          nav_per_share_pre_accrual_cents =
              round_half_up(net_assets_pre_accrual_cents * 10000 / shares_outstanding_e4_snapshot)
          nav_per_share_cents =
              round_half_up(net_assets_cents * 10000 / shares_outstanding_e4_snapshot)
    constants:
      SHARE_UNIT_SCALE: 10000
    precision: "integer cents, round_half_up"
    variants:
      - name: pre_accrual_disclosure
        when: "Always computed and stored in nav_per_share_pre_accrual_cents; the figure disclosed as 'NAV before distribution accrual'"
        difference: "Ignores accrued_distribution_payable_cents entirely"
      - name: official_transaction_price
        when: "Always computed and stored in nav_per_share_cents; becomes the class transaction price once the record is PUBLISHED"
        difference: "Subtracts DECLARED-but-unpaid distributions with record_date <= period_end_date before dividing"
    notes: |
      Worked divergence: shares_outstanding_e4_snapshot = 193000000,
      gross_asset_value_cents = 20000000, other_liabilities_cents = 1000000, one
      DECLARED declaration with total_declared_cents = 96500 gives
      nav_per_share_pre_accrual_cents = 984 and nav_per_share_cents = 979.

  - name: nav_variance
    description: |
      Absolute month-over-month move of the official NAV, in basis points of the
      prior PUBLISHED NAV. Crossing the escalation threshold makes an independent
      valuation advisor opinion reference mandatory before confirmation.
    trigger: "POST /nav-records (creation), after nav_per_share_cents is known"
    inputs: [nav_record.nav_per_share_cents, prior_published_nav_per_share_cents]
    algorithm: threshold
    formula: |
      prior = the PUBLISHED NavRecord for the class with the greatest
              period_end_date (tie-break created_at ASC), or none
      if prior is none:
          variance_bps = 0
      else:
          variance_bps = floor(abs(nav_per_share_cents - prior.nav_per_share_cents)
                               * 10000 / prior.nav_per_share_cents)
      advisor_opinion_required = variance_bps > NAV_VARIANCE_ESCALATION_BPS
    constants:
      NAV_VARIANCE_ESCALATION_BPS: 500
    precision: "integer basis points, floor"
    notes: |
      Strictly greater-than: 1000 -> 1050 yields exactly 500 bps and does NOT
      require an opinion reference; 1000 -> 1055 yields 550 bps and does.

  - name: aggregate_nav
    description: |
      Offering-level aggregate net asset value; the denominator of both
      repurchase caps.
    trigger: "Recomputed after any change to ShareClass.shares_outstanding_e4 or after a NavRecord is PUBLISHED"
    inputs: [ShareClass.shares_outstanding_e4, transaction_price_selection]
    algorithm: aggregation
    formula: |
      aggregate_nav_cents = sum over every ShareClass sc of this offering of
          round_half_up(transaction_price_cents(sc) * sc.shares_outstanding_e4 / 10000)
    constants:
      SHARE_UNIT_SCALE: 10000
    precision: "each class contribution rounded half-up independently, then summed"

  - name: distribution_declaration_total_and_coverage
    description: |
      Declared amount and the two coverage disclosures. The SAME declared total
      is measured against GAAP net income and against adjusted cash flow (AFFO),
      producing two different return-of-capital percentages that must both be
      reported.
    trigger: "POST /distribution-declarations (creation)"
    inputs:
      - declaration.declared_per_share_cents
      - ShareClass.shares_outstanding_e4
      - declaration.gaap_net_income_cents
      - declaration.adjusted_cash_flow_cents
    algorithm: aggregation
    formula: |
      total_declared_cents = sum over every ShareClass sc of the offering of
          round_half_up(declared_per_share_cents * sc.shares_outstanding_e4 / 10000)

      coverage_ratio_gaap_bps = floor(gaap_net_income_cents * 10000 / total_declared_cents)
      coverage_ratio_cash_bps = floor(adjusted_cash_flow_cents * 10000 / total_declared_cents)

      return_of_capital_bps      = max(0, 10000 - coverage_ratio_cash_bps)
      gaap_return_of_capital_bps = max(0, 10000 - coverage_ratio_gaap_bps)

      board_acknowledgement_required = coverage_ratio_cash_bps < 10000
    constants:
      FULL_COVERAGE_BPS: 10000
    precision: "integer cents / integer basis points, floor on both ratios"
    variants:
      - name: gaap_basis
        when: "Always; stored in coverage_ratio_gaap_bps and gaap_return_of_capital_bps"
        difference: "Denominator of coverage is GAAP net income, which typically shows a larger return-of-capital portion because depreciation is expensed"
      - name: cash_flow_basis
        when: "Always; stored in coverage_ratio_cash_bps and return_of_capital_bps"
        difference: "Denominator of coverage is adjusted cash flow; ONLY this variant gates ERR_UNCOVERED_DISTRIBUTION_UNACKNOWLEDGED"
    notes: |
      Worked divergence: total_declared_cents = 150000 with
      gaap_net_income_cents = 90000 and adjusted_cash_flow_cents = 135000 gives
      coverage_ratio_gaap_bps = 6000, coverage_ratio_cash_bps = 9000,
      return_of_capital_bps = 1000 and gaap_return_of_capital_bps = 4000.
      adjusted_cash_flow_cents = 150000 gives coverage_ratio_cash_bps exactly
      10000, return_of_capital_bps = 0 and no board acknowledgement required.

  - name: distribution_fee_accrual_and_conversion
    description: |
      Monthly trail-fee accrual against each OPEN share lot, capped by the lot's
      cumulative cap, followed by conversion of any capped lot into its
      destination class. The order is strict: accrue (capped) first, then convert;
      a lot that reaches its cap in a month still bears that month's partial fee.
    trigger: "POST /distribution-declarations/{distribution_declaration_id}/payment"
    inputs:
      - share_lot.remaining_shares_e4
      - share_lot.cumulative_distribution_fee_cents
      - share_lot.distribution_fee_cap_cents
      - share_class.annual_distribution_fee_bps
      - share_class.converts_to_class_code
      - transaction_price_selection
    algorithm: threshold
    formula: |
      for each OPEN ShareLot lot, ordered by issued_date ASC then created_at ASC:
          price      = transaction_price_cents(lot.share_class)
          lot_value  = round_half_up(price * lot.remaining_shares_e4 / 10000)
          full_fee   = round_half_up(lot_value * annual_distribution_fee_bps
                                     / (10000 * MONTHS_PER_YEAR))
          headroom   = max(0, lot.distribution_fee_cap_cents
                              - lot.cumulative_distribution_fee_cents)
          applied_fee = min(full_fee, headroom)
          lot.cumulative_distribution_fee_cents += applied_fee

          # conversion happens only AFTER the capped accrual is booked
          if lot.cumulative_distribution_fee_cents >= lot.distribution_fee_cap_cents
             and lot.share_class.converts_to_class_code is not null:
              dest        = ShareClass of the same offering whose class_code
                            = lot.share_class.converts_to_class_code
              dest_price  = transaction_price_cents(dest)
              new_shares_e4 = floor(lot.remaining_shares_e4 * price / dest_price)
              lot.converted_from_share_class_id = lot.share_class_id
              lot.share_class_id  = dest.id
              lot.original_shares_e4  = new_shares_e4
              lot.remaining_shares_e4 = new_shares_e4
              # gross_offering_price_cents and distribution_fee_cap_cents are NEVER re-based
      total_distribution_fee_accrued_cents = sum of applied_fee over all lots
    constants:
      MONTHS_PER_YEAR: 12
      SHARE_UNIT_SCALE: 10000
    precision: "each lot's fee rounded half-up independently, then summed"
    notes: |
      Worked example: a lot of 10000000 e4 with gross_offering_price_cents
      1000000 in a class with distribution_fee_cap_bps 150 has
      distribution_fee_cap_cents 15000. At class price 1000 the lot value is
      1000000 and the monthly full fee at 1200 annual bps is 10000. Month 1
      applies 10000 (cumulative 10000, no conversion). Month 2's full fee is
      10000 but headroom is only 5000, so 5000 is applied, the cap is reached and
      the lot converts. At destination price 1250 the lot becomes
      floor(10000000 * 1000 / 1250) = 8000000 e4.

  - name: repurchase_capacity
    description: |
      Capacity available in a repurchase period: the binding minimum of a monthly
      cap and the remaining quarterly cap, both measured against the offering's
      aggregate NAV as observed at processing time.
    trigger: "POST /repurchase-periods/{repurchase_period_id}/processing"
    inputs: [offering.aggregate_nav_cents, RepurchasePeriod.quarter_key, RepurchasePeriod.settled_amount_cents]
    algorithm: threshold
    formula: |
      agg = offering.aggregate_nav_cents        # read fresh at processing time
      monthly_cap_cents = floor(agg * MONTHLY_REPURCHASE_CAP_BPS / 10000)

      quarter_used_cents = sum(other.settled_amount_cents
                               WHERE other.offering_id = this.offering_id
                                 AND other.quarter_key = this.quarter_key
                                 AND other.status = PROCESSED)
      quarterly_remaining_cents = max(0, floor(agg * QUARTERLY_REPURCHASE_CAP_BPS / 10000)
                                         - quarter_used_cents)
      capacity_cents = min(monthly_cap_cents, quarterly_remaining_cents)
    constants:
      MONTHLY_REPURCHASE_CAP_BPS: 200
      QUARTERLY_REPURCHASE_CAP_BPS: 500
    precision: "integer cents, floor"
    notes: |
      The quarterly cap is recomputed from the CURRENT aggregate NAV each month,
      not carried forward as a fixed dollar budget, so a shrinking NAV can make
      the quarterly leg bind even when the monthly leg alone would not. Worked
      third-month case: agg 28812000 gives monthly 576240 and quarterly
      1440600; with 1188000 already used in the quarter the remaining quarterly
      capacity is 252600, which binds.

  - name: repurchase_allocation_waterfall
    description: |
      Tiered pro-rata allocation of a period's capacity across QUEUED requests.
      Hardship requests (death or disability) form Tier 1 and are satisfied in
      full before any ordinary request receives anything; ordinary requests share
      whatever remains pro rata by requested value.
    trigger: "POST /repurchase-periods/{repurchase_period_id}/processing"
    inputs: [RepurchaseRequest.shares_requested_e4, RepurchaseRequest.hardship_type, repurchase_capacity, transaction_price_selection]
    algorithm: waterfall_allocation
    formula: |
      for each QUEUED request r (HELD requests are excluded):
          r.requested_value_cents =
              round_half_up(r.shares_requested_e4
                            * transaction_price_cents(r.share_class) / 10000)

      tier1 = QUEUED requests with hardship_type in (DEATH, DISABILITY)
      tier2 = QUEUED requests with hardship_type = NONE

      remaining = capacity_cents
      # Tier 1: full satisfaction in created_at ASC order until capacity is dry
      for r in tier1 ordered by created_at ASC:
          grant = min(r.requested_value_cents, remaining)
          r.approved_value_cents = grant
          remaining -= grant

      # Tier 2: pro rata by requested value against what Tier 1 left
      tier2_total = sum(r.requested_value_cents for r in tier2)
      if tier2_total <= remaining:
          every r in tier2 gets r.requested_value_cents
          remaining -= tier2_total
      else:
          for r in tier2:
              r.approved_value_cents = floor(remaining * r.requested_value_cents / tier2_total)
          leftover = remaining - sum(r.approved_value_cents for r in tier2)
          # distribute the rounding leftover one cent at a time, earliest request first
          for r in tier2 ordered by created_at ASC while leftover > 0:
              r.approved_value_cents += 1
              leftover -= 1

      for each request r:
          r.approved_shares_e4 = floor(r.approved_value_cents * 10000
                                       / transaction_price_cents(r.share_class))
          r.status = FULFILLED            if r.approved_value_cents == r.requested_value_cents
                     REJECTED             if r.approved_value_cents == 0
                     PARTIALLY_FULFILLED  otherwise
      period.settled_amount_cents = sum(r.approved_value_cents)
      period.prorated = any tier2 request has approved_value_cents < requested_value_cents
    constants: {}
    precision: "pro-rata shares floored, then the cent-level leftover assigned by created_at ASC"
    notes: |
      Worked case: capacity 600000 with tier1 request B at 300000 and tier2
      requests A 400000 and C 200001 (A created before C). Tier 1 takes 300000,
      leaving 300000. Raw pro rata gives A floor(300000*400000/600001) = 199999
      and C floor(300000*200001/600001) = 100000, leftover 1 cent goes to A.
      Final: A 200000 (PARTIALLY_FULFILLED), B 300000 (FULFILLED),
      C 100000 (PARTIALLY_FULFILLED); settled_amount_cents 600000; prorated true.
      An unapproved remainder is never carried into the next period.

  - name: early_repurchase_deduction
    description: |
      Settlement of an approved repurchase against the investor's share lots.
      Lots are consumed FIFO and the early-repurchase deduction is assessed
      PER LOT against that lot's own gross proceeds, because the holding period
      is a property of the lot, not of the request.
    trigger: "POST /repurchase-periods/{repurchase_period_id}/processing, after the waterfall"
    inputs: [RepurchaseRequest.approved_shares_e4, ShareLot.issued_date, ShareLot.remaining_shares_e4, transaction_price_selection]
    algorithm: chronological
    formula: |
      price = transaction_price_cents(request.share_class)
      to_consume_e4 = request.approved_shares_e4
      deduction_total = 0
      proceeds_total  = 0

      for lot in OPEN ShareLot
                 WHERE investor_id = request.investor_id
                   AND share_class_id = request.share_class_id
                 ordered by issued_date ASC, created_at ASC:
          if to_consume_e4 == 0: break
          take_e4 = min(lot.remaining_shares_e4, to_consume_e4)
          lot_gross_cents = round_half_up(price * take_e4 / 10000)

          holding_days = floor_days(period.settlement_date - date(lot.issued_date))
          if holding_days < EARLY_REPURCHASE_MIN_HOLDING_DAYS:
              lot_deduction = round_half_up(lot_gross_cents
                                            * EARLY_REPURCHASE_DEDUCTION_BPS / 10000)
          else:
              lot_deduction = 0

          deduction_total += lot_deduction
          proceeds_total  += lot_gross_cents - lot_deduction
          lot.remaining_shares_e4 -= take_e4
          if lot.remaining_shares_e4 == 0: lot.status = CLOSED
          to_consume_e4 -= take_e4

      if to_consume_e4 > 0: raise ERR_INSUFFICIENT_SHARES
      request.early_repurchase_deduction_cents = deduction_total
      request.net_proceeds_cents = proceeds_total
      investor.cumulative_early_repurchase_deduction_cents += deduction_total
    constants:
      EARLY_REPURCHASE_DEDUCTION_BPS: 200
      EARLY_REPURCHASE_MIN_HOLDING_DAYS: 365
    precision: "each lot's gross and deduction rounded half-up independently, then summed"
    notes: |
      Per-lot rounding diverges from an aggregate-basis deduction. Two lots worth
      250025 and 50025 cents yield deductions 5001 + 1001 = 6002 and net
      proceeds 294048, whereas one 2% deduction on the 300050 aggregate would
      give 6001 and 294049. The boundary is inclusive at the top: a lot held
      exactly 365 days bears NO deduction; 364 days does.

  - name: vote_tally
    description: |
      Stockholder approval test for a liquidity event: a quorum of shares must be
      cast, and a majority of ALL shares outstanding on the record date (not
      merely of shares cast) must vote FOR.
    trigger: "POST /liquidity-events/{liquidity_event_id}/status { action: CLOSE_VOTE }"
    inputs: [LiquidityEvent.record_date_shares_e4, StockholderVote.choice, StockholderVote.voting_shares_e4]
    algorithm: aggregation
    formula: |
      votes_for_e4     = sum(voting_shares_e4 WHERE choice = FOR)
      votes_against_e4 = sum(voting_shares_e4 WHERE choice = AGAINST)
      votes_abstain_e4 = sum(voting_shares_e4 WHERE choice = ABSTAIN)
      cast_e4 = votes_for_e4 + votes_against_e4 + votes_abstain_e4

      quorum_met = cast_e4 >= floor(record_date_shares_e4 / QUORUM_DIVISOR)
      approved   = quorum_met and (votes_for_e4 * 2 > record_date_shares_e4)
      status     = APPROVED if approved else REJECTED
    constants:
      QUORUM_DIVISOR: 2
    precision: "integer e4 share units, floor on the quorum threshold"
    notes: |
      An ABSTAIN ballot counts toward quorum but never toward approval, so a
      record_date_shares_e4 of 300000000 with 150000000 FOR and 100000000
      ABSTAIN meets quorum yet is REJECTED because 300000000 is not strictly
      greater than 300000000.

  - name: repurchase_period_window
    description: |
      Validity of a repurchase period's request window relative to sibling
      periods of the same offering. The request window is the half-open interval
      [opens_at, request_cutoff_at); windows may abut but never overlap, and a new
      window may not open until the mandatory settlement buffer after the prior
      period's settlement_date has elapsed.
    trigger: "POST /repurchase-periods (creation)"
    inputs: [RepurchasePeriod.opens_at, RepurchasePeriod.request_cutoff_at, RepurchasePeriod.settlement_date]
    algorithm: interval_merge
    formula: |
      quarter_key = '<YYYY>-Q' + str(floor((month_of(period_month) - 1) / 3) + 1)

      siblings = RepurchasePeriod WHERE offering_id = this.offering_id
                                    AND status != CANCELLED
      for s in siblings:
          if this.opens_at < s.request_cutoff_at and s.opens_at < this.request_cutoff_at:
              raise ERR_REPURCHASE_PERIOD_WINDOW_CONFLICT      # true overlap
          if this.opens_at >= s.request_cutoff_at:
              buffer_start = date(s.settlement_date) + REPURCHASE_PERIOD_BLACKOUT_DAYS days
              if date(this.opens_at) < buffer_start:
                  raise ERR_REPURCHASE_PERIOD_WINDOW_CONFLICT  # settlement buffer violated
    constants:
      REPURCHASE_PERIOD_BLACKOUT_DAYS: 5
    precision: "instants compared to the second; the blackout buffer compared on calendar dates"
    notes: |
      Adjacency is legal: this.opens_at exactly equal to s.request_cutoff_at is
      NOT an overlap, provided the settlement buffer is also satisfied.

  - name: nav_period_coverage
    description: |
      Validity of a NAV record's valuation period relative to sibling records for
      the same share class. Periods are CLOSED intervals on calendar dates, so a
      shared endpoint IS an overlap; back-to-back months (one ending on the last
      day, the next starting on the first day of the following month) are legal.
    trigger: "POST /nav-records (creation)"
    inputs: [NavRecord.period_start_date, NavRecord.period_end_date, NavRecord.status]
    algorithm: interval_merge
    formula: |
      siblings = NavRecord WHERE share_class_id = this.share_class_id
                             AND status in (ADVISOR_REVIEW, ADVISOR_CONFIRMED, PUBLISHED)
      for s in siblings:
          if this.period_start_date <= s.period_end_date
             and s.period_start_date <= this.period_end_date:
              raise ERR_NAV_PERIOD_OVERLAP
      # a sibling still in DRAFT is SUPERSEDED instead of blocking the create
      # (the period must also have fully elapsed before the record may be
      #  submitted for advisor review — see ERR_NAV_PERIOD_NOT_ELAPSED, which is
      #  enforced on POST /nav-records/{nav_record_id}/status, not on create)
    constants: {}
    precision: "calendar dates, closed interval on both ends"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (strict global priority ladder)
#
# Every write request is evaluated top to bottom. The FIRST violated rule
# determines the response; later violations are never reported. Within a single
# priority, path parameters are checked before body fields, and body fields are
# checked in the order they are listed in the endpoint's `input:`.
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Missing, blank or unrecognised role header. Evaluated before any resource lookup, so an unauthenticated call against a non-existent id still returns 401."

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's `roles` list AND, for transition endpoints, is permitted to drive the requested action / to_status"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
    description: "Segregation of duties. A SponsorOperator may submit a NavRecord for review but may never confirm it; only IndependentValuationAdvisor may reach ADVISOR_CONFIRMED or push back to DRAFT. Only ComplianceOfficer may clear a FLAGGED investor. Only TransferAgent may pay a declaration. Only BoardCommittee may approve or execute a liquidity event."

  - priority: 3
    category: schema
    check: "Request body parses, every required input is present, every value matches its declared type / enum / range / format"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Includes negative or zero money and share amounts, unknown enum members, malformed YYYY-MM / YYYY-MM-DD / ISO-8601 values, period_end_date < period_start_date, request_cutoff_at <= opens_at, maximum_offering_amount_cents < minimum_offering_amount_cents, and pagination limit outside 1..100."

  - priority: 4
    category: existence
    check: "Every referenced id resolves to a stored row — path parameters first, then body foreign keys in input order: offering_id, share_class_id, investor_id, selling_agreement_id, subscription_id, repurchase_period_id, liquidity_event_id, nav_record_id"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
    description: "A single error code for every missing referent. When a subscription body names both a non-existent offering_id and a non-existent investor_id, the offering is reported because it is listed first."

  - priority: 5
    category: ownership
    check: "An entity_backed role acts only on its own rows: a BrokerDealerRep may only reference selling agreements of its own BrokerDealer; an InvestorUser may only create, withdraw or read requests, votes and statements for its own Investor"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to:
      - "POST /subscriptions"
      - "POST /investors/{investor_id}/suitability-documentation"
      - "GET /investors/{investor_id}/statement"
      - "POST /repurchase-requests"
      - "POST /repurchase-requests/{repurchase_request_id}/status"
      - "POST /stockholder-votes"
    description: "Distinguished from ERR_ROLE_NOT_PERMITTED: the role is allowed to call the endpoint, but not against this row."

  - priority: 6
    category: concurrency
    check: "expected_offering_version equals the stored Offering.version; expected_share_class_version equals the stored ShareClass.version"
    error_id: ERR_STALE_OFFERING_VERSION | ERR_STALE_SHARE_CLASS_VERSION
    http_status: 412
    applies_to:
      - "POST /distribution-declarations"
      - "POST /nav-records"
    description: "Optimistic concurrency control, evaluated after existence and ownership but before any state or business rule, so a stale echo is reported even when the request would also have failed a later business check."

  - priority: 7
    category: state
    check: "The requested transition exists in the target row's own state machine for its current state"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to:
      - "POST /offerings/{offering_id}/registration"
      - "POST /offerings/{offering_id}/escrow"
      - "POST /offerings/{offering_id}/repurchase-plan"
      - "POST /share-classes/{share_class_id}/status"
      - "POST /broker-dealers/{broker_dealer_id}/supervision-status"
      - "POST /selling-agreements/{selling_agreement_id}/status"
      - "POST /subscriptions/{subscription_id}/status"
      - "POST /nav-records/{nav_record_id}/status"
      - "POST /distribution-declarations/{distribution_declaration_id}/payment"
      - "POST /repurchase-periods/{repurchase_period_id}/processing"
      - "POST /repurchase-requests/{repurchase_request_id}/status"
      - "POST /liquidity-events/{liquidity_event_id}/status"
    description: "Covers terminal-state lockdown and repeat triggers (paying a PAID declaration, processing a PROCESSED period, breaking an already BROKEN escrow)."

  - priority: 8
    category: cross_entity_state
    check: "Every OTHER entity the operation depends on is in an admissible state"
    error_id: ERR_OFFERING_NOT_EFFECTIVE | ERR_SHARE_CLASS_CLOSED | ERR_SELLING_AGREEMENT_NOT_ACTIVE | ERR_BROKER_DEALER_BARRED | ERR_REPURCHASE_PLAN_SUSPENDED | ERR_NO_PUBLISHED_NAV | ERR_VOTE_NOT_OPEN
    http_status: 409
    applies_to:
      - "POST /subscriptions"
      - "POST /subscriptions/{subscription_id}/status"
      - "POST /share-classes/{share_class_id}/status"
      - "POST /selling-agreements/{selling_agreement_id}/status"
      - "POST /nav-records"
      - "POST /distribution-declarations"
      - "POST /distribution-declarations/{distribution_declaration_id}/payment"
      - "POST /repurchase-periods"
      - "POST /repurchase-requests"
      - "POST /repurchase-periods/{repurchase_period_id}/processing"
      - "POST /stockholder-votes"
    description: "Checked in a fixed order per endpoint: offering registration, then share class, then selling agreement, then broker dealer, then repurchase plan, then published NAV. The dependency's state outranks any amount- or window-based rule below."

  - priority: 9
    category: business_temporal
    check: "The operation falls inside its permitted time window as measured by the logical clock"
    error_id: ERR_REPURCHASE_PERIOD_CLOSED | ERR_REPURCHASE_PERIOD_WINDOW_CONFLICT | ERR_NAV_PERIOD_OVERLAP | ERR_NAV_PERIOD_NOT_ELAPSED | ERR_ESCROW_DEADLINE_PASSED | ERR_RESCISSION_WINDOW_EXPIRED | ERR_PERIOD_NOT_READY_FOR_PROCESSING | ERR_PAYMENT_DATE_NOT_REACHED | ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    applies_to:
      - "POST /offerings/{offering_id}/registration"
      - "POST /offerings/{offering_id}/escrow"
      - "POST /nav-records"
      - "POST /nav-records/{nav_record_id}/status"
      - "POST /repurchase-periods"
      - "POST /repurchase-requests"
      - "POST /repurchase-requests/{repurchase_request_id}/status"
      - "POST /repurchase-periods/{repurchase_period_id}/processing"
      - "POST /subscriptions/{subscription_id}/status"
      - "POST /distribution-declarations/{distribution_declaration_id}/payment"
      - "POST /liquidity-events/{liquidity_event_id}/status"
    description: "Window membership is decided before any quantity is examined, so a request filed after request_cutoff_at is rejected as ERR_REPURCHASE_PERIOD_CLOSED even if the investor also lacks the shares."

  - priority: 10
    category: business_safety
    check: "Investor-protection gates: suitability documentation, concentration limit, minimum investment, uncovered-distribution acknowledgement, advisor opinion for a large NAV move"
    error_id: ERR_SUITABILITY_NOT_DOCUMENTED | ERR_CONCENTRATION_LIMIT_EXCEEDED | ERR_BELOW_MINIMUM_INVESTMENT | ERR_UNCOVERED_DISTRIBUTION_UNACKNOWLEDGED | ERR_ADVISOR_OPINION_REQUIRED
    http_status: 422
    applies_to:
      - "POST /subscriptions"
      - "POST /distribution-declarations"
      - "POST /nav-records/{nav_record_id}/status"
    description: "Suitability is checked before the concentration limit, which is checked before the minimum investment. These gates outrank every capacity, commission and fiscal rule below: an undocumented investor's oversized subscription reports ERR_SUITABILITY_NOT_DOCUMENTED."

  - priority: 11
    category: business_constraint
    check: "Structural and quantity constraints: share availability, duplicate keys, commission ceilings"
    error_id: ERR_INSUFFICIENT_SHARES | ERR_DUPLICATE_STOCKHOLDER_VOTE | ERR_DUPLICATE_SHARE_CLASS_CODE | ERR_DUPLICATE_REPURCHASE_PERIOD | ERR_COMMISSION_CAP_EXCEEDED | ERR_DUPLICATE_INVESTOR_EMAIL | ERR_DUPLICATE_CRD_NUMBER
    http_status: 422
    applies_to:
      - "POST /share-classes"
      - "POST /investors"
      - "POST /broker-dealers"
      - "POST /subscriptions"
      - "POST /repurchase-periods"
      - "POST /repurchase-requests"
      - "POST /stockholder-votes"
    description: "ERR_INSUFFICIENT_SHARES compares shares_requested_e4 against the investor's OPEN lots in the class, net of shares already tendered in other QUEUED or HELD requests of the same period."

  - priority: 12
    category: business_referential
    check: "Referential integrity between rows that are individually valid: a lot may not be rescinded once partially repurchased; a paid declaration may not be superseded"
    error_id: ERR_LOT_PARTIALLY_REPURCHASED | ERR_DECLARATION_ALREADY_PAID
    http_status: 409
    applies_to:
      - "POST /subscriptions/{subscription_id}/status"
      - "POST /distribution-declarations"
    description: "Distinguished from priority 7 because the blocking row is a different entity that is itself in a perfectly legal state."

  - priority: 13
    category: business_fiscal
    check: "Offering-level money ceilings and floors"
    error_id: ERR_OFFERING_MAXIMUM_EXCEEDED | ERR_MINIMUM_OFFERING_NOT_MET
    http_status: 422
    applies_to:
      - "POST /subscriptions"
      - "POST /subscriptions/{subscription_id}/status"
      - "POST /offerings/{offering_id}/escrow"
    description: "Lowest priority: the registered maximum and the escrow minimum are the last things checked, so a subscription into a SUSPENDED offering reports ERR_OFFERING_NOT_EFFECTIVE rather than ERR_OFFERING_MAXIMUM_EXCEEDED even when it would also breach the maximum."

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# `input:` lists BODY fields only (for GET, query parameters); path parameters
# are never repeated there. A trailing `?` marks an optional field. Every
# collection GET additionally accepts `limit?` and `offset?`.
# -----------------------------------------------------------------------------
endpoints:
  # --- Offering -------------------------------------------------------------
  - method: POST
    path: /offerings
    description: "Register a continuous offering in DRAFT with all three status axes at their initial states."
    roles: [SponsorOperator]
    status: 201
    input:
      - name
      - minimum_offering_amount_cents
      - maximum_offering_amount_cents
      - escrow_deadline_date
      - initial_offering_price_cents
      - rescission_window_days?
    output: Offering
    side_effects:
      - "sets registration_status = DRAFT, escrow_status = COLLECTING, repurchase_plan_status = ACTIVE"
      - "initialises escrow_balance_cents, gross_proceeds_cents and aggregate_nav_cents to 0"

  - method: GET
    path: /offerings
    description: "List offerings with optional status filters."
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, BoardCommittee, IndependentValuationAdvisor]
    status: 200
    input:
      - registration_status?
      - escrow_status?
      - repurchase_plan_status?
      - limit?
      - offset?
    output: Offering[]
    side_effects: []

  - method: GET
    path: /offerings/{offering_id}
    description: "Retrieve one offering including its three status axes and derived money totals."
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, BoardCommittee, IndependentValuationAdvisor]
    status: 200
    input: []
    output: Offering
    side_effects: []

  - method: POST
    path: /offerings/{offering_id}/registration
    description: "Drive the registration axis: DECLARE_EFFECTIVE | SUSPEND | REINSTATE | CLOSE."
    roles: [ComplianceOfficer]
    status: 200
    input:
      - action
      - reason?
    output: Offering
    side_effects:
      - "increments Offering.version by 1"
      - "CLOSE sets every ACTIVE ShareClass of the offering to CLOSED_TO_NEW"

  - method: POST
    path: /offerings/{offering_id}/escrow
    description: "Drive the escrow axis: BREAK | FAIL."
    roles: [ComplianceOfficer]
    status: 200
    input:
      - action
    output: Offering
    side_effects:
      - "increments Offering.version by 1"
      - "BREAK accepts every ESCROWED Subscription in created_at ASC order and mints one ShareLot each"
      - "BREAK moves escrow_balance_cents into gross_proceeds_cents and recomputes aggregate_nav_cents"
      - "BREAK re-evaluates Investor.suitability_status against concentration_limit_cents"
      - "FAIL refunds every ESCROWED Subscription and terminates the repurchase plan"

  - method: POST
    path: /offerings/{offering_id}/repurchase-plan
    description: "Drive the repurchase-plan axis: SUSPEND | RESUME | TERMINATE."
    roles: [ComplianceOfficer]
    status: 200
    input:
      - action
      - reason?
    output: Offering
    side_effects:
      - "increments Offering.version by 1"
      - "SUSPEND cascades OPEN RepurchasePeriod -> SUSPENDED and QUEUED RepurchaseRequest -> HELD"
      - "RESUME reverses that cascade"
      - "TERMINATE cascades periods -> CANCELLED and requests -> REJECTED"

  # --- ShareClass -----------------------------------------------------------
  - method: POST
    path: /share-classes
    description: "Add a share class to an offering with its own fee schedule and distribution-fee cap."
    roles: [SponsorOperator]
    status: 201
    input:
      - offering_id
      - class_code
      - upfront_selling_commission_bps
      - dealer_manager_fee_bps
      - annual_distribution_fee_bps
      - distribution_fee_cap_bps
      - converts_to_class_code?
    output: ShareClass
    side_effects:
      - "sets status = ACTIVE and shares_outstanding_e4 = 0"

  - method: GET
    path: /share-classes
    description: "List share classes, filterable by parent offering."
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, IndependentValuationAdvisor, BrokerDealerRep, InvestorUser]
    status: 200
    input:
      - offering_id?
      - class_code?
      - status?
      - limit?
      - offset?
    output: ShareClass[]
    side_effects: []

  - method: GET
    path: /share-classes/{share_class_id}
    description: "Retrieve one share class including its current outstanding share count."
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, IndependentValuationAdvisor, BrokerDealerRep, InvestorUser]
    status: 200
    input: []
    output: ShareClass
    side_effects: []

  - method: POST
    path: /share-classes/{share_class_id}/status
    description: "Close a share class to new subscriptions while the offering itself stays EFFECTIVE (a sponsor may retire one class's fee structure without ending the offering)."
    roles: [SponsorOperator]
    status: 200
    input:
      - to_status
    output: ShareClass
    side_effects:
      - "increments ShareClass.version by 1"
      - "further Subscription creation into the class fails with ERR_SHARE_CLASS_CLOSED"

  # --- Investor -------------------------------------------------------------
  - method: POST
    path: /investors
    description: "Open an investor account and compute its concentration limit from the state-dependent basis."
    roles: [SponsorOperator, TransferAgent, BrokerDealerRep]
    status: 201
    input:
      - legal_name
      - email
      - state_code
      - net_worth_cents
      - annual_income_cents
    output: Investor
    side_effects:
      - "computes concentration_limit_cents per calculations.investor_concentration_limit"
      - "sets suitability_status = INCOMPLETE and account_status = ACTIVE"

  - method: GET
    path: /investors
    description: "List investor accounts."
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, BrokerDealerRep]
    status: 200
    input:
      - suitability_status?
      - account_status?
      - state_code?
      - limit?
      - offset?
    output: Investor[]
    side_effects: []

  - method: GET
    path: /investors/{investor_id}
    description: "Retrieve one investor account with its derived holding and distribution totals."
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, BrokerDealerRep, InvestorUser]
    status: 200
    input: []
    output: Investor
    side_effects: []

  - method: POST
    path: /investors/{investor_id}/suitability-documentation
    description: "Record a suitability documentation package. A FLAGGED investor may only be cleared by a ComplianceOfficer."
    roles: [BrokerDealerRep, ComplianceOfficer]
    status: 200
    input:
      - documentation_reference
    output: Investor
    side_effects:
      - "sets suitability_status = DOCUMENTED and records suitability_documentation_reference"
      - "increments Investor.version by 1"

  - method: GET
    path: /investors/{investor_id}/statement
    description: "Transfer-agent investor statement: a computed read that reconciles holdings, distributions and deductions. open_lot_count = count(ShareLot WHERE investor_id = path investor_id AND status = OPEN); estimated_value_cents = sum over those OPEN lots of round_half_up(lot.remaining_shares_e4 * transaction_price_cents(lot.share_class_id) / 10000); every other field is copied from the Investor row."
    roles: [TransferAgent, SponsorOperator, InvestorUser]
    status: 200
    input: []
    output:
      investor_id: string
      total_shares_e4: integer
      open_lot_count: integer
      cumulative_invested_cents: integer
      cumulative_distributions_received_cents: integer
      cumulative_early_repurchase_deduction_cents: integer
      estimated_value_cents: integer
    side_effects: []

  # --- BrokerDealer ---------------------------------------------------------
  - method: POST
    path: /broker-dealers
    description: "Register a selling broker-dealer firm."
    roles: [ComplianceOfficer]
    status: 201
    input:
      - firm_name
      - crd_number
    output: BrokerDealer
    side_effects:
      - "sets supervision_status = IN_GOOD_STANDING and suspended_agreement_count = 0"

  - method: GET
    path: /broker-dealers
    description: "List broker-dealer firms."
    roles: [ComplianceOfficer, SponsorOperator, TransferAgent, BrokerDealerRep]
    status: 200
    input:
      - supervision_status?
      - crd_number?
      - limit?
      - offset?
    output: BrokerDealer[]
    side_effects: []

  - method: GET
    path: /broker-dealers/{broker_dealer_id}
    description: "Retrieve one broker-dealer firm with its suspended-agreement counter."
    roles: [ComplianceOfficer, SponsorOperator, TransferAgent, BrokerDealerRep]
    status: 200
    input: []
    output: BrokerDealer
    side_effects: []

  - method: POST
    path: /broker-dealers/{broker_dealer_id}/supervision-status
    description: "Move a firm along the supervision axis; BARRED cascades to every agreement and pending subscription."
    roles: [ComplianceOfficer]
    status: 200
    input:
      - to_status
      - reason?
    output: BrokerDealer
    side_effects:
      - "increments BrokerDealer.version by 1"
      - "BARRED terminates every non-terminal SellingAgreement and rejects every PENDING Subscription under them"

  # --- SellingAgreement -----------------------------------------------------
  - method: POST
    path: /selling-agreements
    description: "Create a selling agreement binding a broker-dealer to an offering with a commission ceiling."
    roles: [ComplianceOfficer]
    status: 201
    input:
      - offering_id
      - broker_dealer_id
      - max_commission_bps
      - suitability_documentation_required?
    output: SellingAgreement
    side_effects:
      - "sets status = PENDING with both finding counters at 0"

  - method: GET
    path: /selling-agreements
    description: "List selling agreements, filterable by offering or broker-dealer."
    roles: [ComplianceOfficer, SponsorOperator, TransferAgent, BrokerDealerRep]
    status: 200
    input:
      - offering_id?
      - broker_dealer_id?
      - status?
      - limit?
      - offset?
    output: SellingAgreement[]
    side_effects: []

  - method: GET
    path: /selling-agreements/{selling_agreement_id}
    description: "Retrieve one selling agreement with its open supervision-finding counters."
    roles: [ComplianceOfficer, SponsorOperator, TransferAgent, BrokerDealerRep]
    status: 200
    input: []
    output: SellingAgreement
    side_effects: []

  - method: POST
    path: /selling-agreements/{selling_agreement_id}/status
    description: "Explicit agreement transition: ACTIVE | SUSPENDED | TERMINATED."
    roles: [ComplianceOfficer]
    status: 200
    input:
      - to_status
      - reason?
    output: SellingAgreement
    side_effects:
      - "increments SellingAgreement.version by 1"
      - "SUSPENDED increments BrokerDealer.suspended_agreement_count and escalates the firm to HEIGHTENED_SUPERVISION"
      - "TERMINATED rejects every PENDING Subscription under the agreement"

  - method: POST
    path: /selling-agreements/{selling_agreement_id}/supervision-findings
    description: "Record or resolve a supervision finding; the agreement's status is re-derived from the resulting counters."
    roles: [ComplianceOfficer]
    status: 200
    input:
      - action
      - severity?
      - finding_reference?
    output: SellingAgreement
    side_effects:
      - "RECORD increments open_minor_finding_count or open_major_finding_count per severity"
      - "RESOLVE decrements the matching counter"
      - "auto-suspends the agreement at 3 open MINOR or 1 open MAJOR finding; auto-reactivates when both thresholds clear"
      - "increments SellingAgreement.version by 1"

  # --- Subscription ---------------------------------------------------------
  - method: POST
    path: /subscriptions
    description: "Submit a subscription; pins the transaction price and computes the two independently rounded load lines."
    roles: [SponsorOperator, BrokerDealerRep]
    status: 201
    input:
      - offering_id
      - share_class_id
      - investor_id
      - selling_agreement_id
      - gross_investment_cents
    output: Subscription
    side_effects:
      - "pins transaction_price_cents per calculations.transaction_price_selection"
      - "computes upfront_selling_commission_cents, dealer_manager_fee_cents, net_invested_cents, shares_issued_e4 and unapplied_cash_cents"
      - "sets status = PENDING"

  - method: GET
    path: /subscriptions
    description: "List subscriptions, filterable by offering, class, investor or agreement."
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, BrokerDealerRep, InvestorUser]
    status: 200
    input:
      - offering_id?
      - share_class_id?
      - investor_id?
      - selling_agreement_id?
      - status?
      - limit?
      - offset?
    output: Subscription[]
    side_effects: []

  - method: GET
    path: /subscriptions/{subscription_id}
    description: "Retrieve one subscription with its computed load, share and unapplied-cash figures."
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, BrokerDealerRep, InvestorUser]
    status: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: /subscriptions/{subscription_id}/status
    description: "Drive a subscription: ESCROWED | ACCEPTED | REJECTED | REFUNDED | RESCINDED."
    roles: [SponsorOperator, TransferAgent]
    status: 200
    input:
      - to_status
      - rejection_reason?
    output: Subscription
    side_effects:
      - "increments Subscription.version by 1"
      - "ESCROWED adds gross_investment_cents to offering.escrow_balance_cents"
      - "ACCEPTED mints a ShareLot, stamps accepted_at, updates gross_proceeds_cents, cumulative_invested_cents, shares_outstanding_e4, total_shares_e4, aggregate_nav_cents and may set suitability_status = FLAGGED or account_status = ACTIVE"
      - "REFUNDED removes gross_investment_cents from escrow_balance_cents"
      - "RESCINDED sets the minted ShareLot to RESCINDED and reverses every ACCEPTED-side money and share effect"

  # --- ShareLot -------------------------------------------------------------
  - method: GET
    path: /share-lots
    description: "List share lots, filterable by subscription, investor, current class or pre-conversion class."
    roles: [TransferAgent, SponsorOperator, ComplianceOfficer, InvestorUser]
    status: 200
    input:
      - subscription_id?
      - investor_id?
      - share_class_id?
      - converted_from_share_class_id?
      - status?
      - limit?
      - offset?
    output: ShareLot[]
    side_effects: []

  - method: GET
    path: /share-lots/{share_lot_id}
    description: "Retrieve one share lot with its remaining shares and cumulative distribution fee."
    roles: [TransferAgent, SponsorOperator, ComplianceOfficer, InvestorUser]
    status: 200
    input: []
    output: ShareLot
    side_effects: []

  # --- NavRecord ------------------------------------------------------------
  - method: POST
    path: /nav-records
    description: "Prepare a monthly NAV record for a share class in both variants. Requires the caller to echo ShareClass.version."
    roles: [SponsorOperator]
    status: 201
    input:
      - share_class_id
      - period_start_date
      - period_end_date
      - gross_asset_value_cents
      - other_liabilities_cents
      - expected_share_class_version
    output: NavRecord
    side_effects:
      - "increments ShareClass.version by 1"
      - "snapshots shares_outstanding_e4_snapshot and sums accrued_distribution_payable_cents"
      - "computes nav_per_share_pre_accrual_cents, nav_per_share_cents and variance_bps"
      - "sets any overlapping DRAFT NavRecord of the same class to SUPERSEDED"
      - "sets status = DRAFT"

  - method: GET
    path: /nav-records
    description: "List NAV records, filterable by share class and status."
    roles: [SponsorOperator, IndependentValuationAdvisor, ComplianceOfficer, TransferAgent, InvestorUser]
    status: 200
    input:
      - share_class_id?
      - status?
      - period_end_date?
      - limit?
      - offset?
    output: NavRecord[]
    side_effects: []

  - method: GET
    path: /nav-records/{nav_record_id}
    description: "Retrieve one NAV record with both per-share variants and its variance."
    roles: [SponsorOperator, IndependentValuationAdvisor, ComplianceOfficer, TransferAgent, InvestorUser]
    status: 200
    input: []
    output: NavRecord
    side_effects: []

  - method: POST
    path: /nav-records/{nav_record_id}/status
    description: "Drive a NAV record: ADVISOR_REVIEW | ADVISOR_CONFIRMED | DRAFT (advisor push-back) | PUBLISHED."
    roles: [SponsorOperator, IndependentValuationAdvisor]
    status: 200
    input:
      - to_status
      - advisor_opinion_reference?
      - rejection_reason?
    output: NavRecord
    side_effects:
      - "increments NavRecord.version by 1"
      - "PUBLISHED supersedes the prior PUBLISHED record of the class and recomputes offering.aggregate_nav_cents"

  # --- DistributionDeclaration ---------------------------------------------
  - method: POST
    path: /distribution-declarations
    description: "Declare a distribution with both coverage disclosures. Requires the caller to echo Offering.version."
    roles: [SponsorOperator, BoardCommittee]
    status: 201
    input:
      - offering_id
      - record_date
      - payment_date
      - declared_per_share_cents
      - gaap_net_income_cents
      - adjusted_cash_flow_cents
      - board_uncovered_acknowledgement?
      - expected_offering_version
    output: DistributionDeclaration
    side_effects:
      - "increments Offering.version by 1"
      - "computes total_declared_cents, both coverage ratios and both return-of-capital percentages"
      - "sets any DECLARED declaration of the same offering and record_date to SUPERSEDED"
      - "sets status = DECLARED"

  - method: GET
    path: /distribution-declarations
    description: "List distribution declarations, filterable by offering and status."
    roles: [SponsorOperator, BoardCommittee, TransferAgent, ComplianceOfficer, InvestorUser]
    status: 200
    input:
      - offering_id?
      - status?
      - record_date?
      - limit?
      - offset?
    output: DistributionDeclaration[]
    side_effects: []

  - method: GET
    path: /distribution-declarations/{distribution_declaration_id}
    description: "Retrieve one declaration with its GAAP and cash-flow coverage disclosures."
    roles: [SponsorOperator, BoardCommittee, TransferAgent, ComplianceOfficer, InvestorUser]
    status: 200
    input: []
    output: DistributionDeclaration
    side_effects: []

  - method: POST
    path: /distribution-declarations/{distribution_declaration_id}/payment
    description: "Pay a declaration (default action PAY) or cancel it. Payment accrues capped distribution fees and converts capped lots."
    roles: [TransferAgent, BoardCommittee]
    status: 200
    input:
      - action?
    output: DistributionDeclaration
    side_effects:
      - "increments DistributionDeclaration.version by 1"
      - "credits Investor.cumulative_distributions_received_cents per OPEN lot as of record_date"
      - "accrues the capped monthly distribution fee per lot and records total_distribution_fee_accrued_cents"
      - "converts every lot that reaches its cap into converts_to_class_code, setting converted_from_share_class_id"
      - "removes the declaration from future NavRecord.accrued_distribution_payable_cents"

  # --- RepurchasePeriod -----------------------------------------------------
  - method: POST
    path: /repurchase-periods
    description: "Open a monthly repurchase period with a half-open request window and a settlement date."
    roles: [TransferAgent, SponsorOperator]
    status: 201
    input:
      - offering_id
      - period_month
      - opens_at
      - request_cutoff_at
      - settlement_date
    output: RepurchasePeriod
    side_effects:
      - "derives quarter_key from period_month"
      - "sets status = OPEN with every cap field at 0 and prorated = false"

  - method: GET
    path: /repurchase-periods
    description: "List repurchase periods, filterable by offering, quarter and status."
    roles: [TransferAgent, SponsorOperator, ComplianceOfficer, InvestorUser]
    status: 200
    input:
      - offering_id?
      - status?
      - quarter_key?
      - period_month?
      - limit?
      - offset?
    output: RepurchasePeriod[]
    side_effects: []

  - method: GET
    path: /repurchase-periods/{repurchase_period_id}
    description: "Retrieve one repurchase period with its captured caps and settled amount."
    roles: [TransferAgent, SponsorOperator, ComplianceOfficer, InvestorUser]
    status: 200
    input: []
    output: RepurchasePeriod
    side_effects: []

  - method: POST
    path: /repurchase-periods/{repurchase_period_id}/processing
    description: "Process a closed period: capture caps, run the tiered pro-rata waterfall, settle lots FIFO with per-lot early-repurchase deductions."
    roles: [TransferAgent]
    status: 200
    input: []
    output: RepurchasePeriod
    side_effects:
      - "captures monthly_cap_cents, quarterly_remaining_cents and capacity_cents"
      - "sets every QUEUED request to FULFILLED, PARTIALLY_FULFILLED or REJECTED"
      - "consumes ShareLot rows FIFO, closing exhausted lots"
      - "sets settled_amount_cents and prorated, and moves the period to PROCESSED"
      - "recomputes ShareClass.shares_outstanding_e4, Investor.total_shares_e4 and Offering.aggregate_nav_cents"
      - "credits Investor.cumulative_early_repurchase_deduction_cents and may set account_status = CLOSED_NO_POSITION"

  # --- RepurchaseRequest ----------------------------------------------------
  - method: POST
    path: /repurchase-requests
    description: "Tender shares into an OPEN repurchase period. The acting InvestorUser is the holder of record."
    roles: [InvestorUser]
    status: 201
    input:
      - repurchase_period_id
      - share_class_id
      - shares_requested_e4
      - hardship_type?
    output: RepurchaseRequest
    side_effects:
      - "sets investor_id from the acting InvestorUser and status = QUEUED"
      - "leaves every settlement field at 0 until the period is processed"

  - method: GET
    path: /repurchase-requests
    description: "List repurchase requests, filterable by period, investor, class, status and hardship tier."
    roles: [TransferAgent, SponsorOperator, ComplianceOfficer, InvestorUser]
    status: 200
    input:
      - repurchase_period_id?
      - investor_id?
      - share_class_id?
      - status?
      - hardship_type?
      - limit?
      - offset?
    output: RepurchaseRequest[]
    side_effects: []

  - method: GET
    path: /repurchase-requests/{repurchase_request_id}
    description: "Retrieve one repurchase request with its approved amount, deduction and net proceeds."
    roles: [TransferAgent, SponsorOperator, ComplianceOfficer, InvestorUser]
    status: 200
    input: []
    output: RepurchaseRequest
    side_effects: []

  - method: POST
    path: /repurchase-requests/{repurchase_request_id}/status
    description: "Withdraw a queued request before the period's cutoff."
    roles: [InvestorUser]
    status: 200
    input:
      - to_status
    output: RepurchaseRequest
    side_effects:
      - "increments RepurchaseRequest.version by 1"

  # --- LiquidityEvent -------------------------------------------------------
  - method: POST
    path: /liquidity-events
    description: "Propose a liquidity event for the offering."
    roles: [SponsorOperator]
    status: 201
    input:
      - offering_id
      - event_type
      - proposed_effective_date
    output: LiquidityEvent
    side_effects:
      - "sets status = PROPOSED with every tally field at 0 and quorum_met = false"

  - method: GET
    path: /liquidity-events
    description: "List liquidity events, filterable by offering, type and status."
    roles: [SponsorOperator, BoardCommittee, ComplianceOfficer, TransferAgent, InvestorUser]
    status: 200
    input:
      - offering_id?
      - status?
      - event_type?
      - limit?
      - offset?
    output: LiquidityEvent[]
    side_effects: []

  - method: GET
    path: /liquidity-events/{liquidity_event_id}
    description: "Retrieve one liquidity event with its record-date share snapshot and vote tally."
    roles: [SponsorOperator, BoardCommittee, ComplianceOfficer, TransferAgent, InvestorUser]
    status: 200
    input: []
    output: LiquidityEvent
    side_effects: []

  - method: POST
    path: /liquidity-events/{liquidity_event_id}/status
    description: "Drive a liquidity event: BOARD_APPROVE | OPEN_VOTE | CLOSE_VOTE | EXECUTE | ABANDON."
    roles: [SponsorOperator, BoardCommittee]
    status: 200
    input:
      - action
      - reason?
    output: LiquidityEvent
    side_effects:
      - "increments LiquidityEvent.version by 1"
      - "OPEN_VOTE snapshots record_date_shares_e4 across every share class of the offering"
      - "CLOSE_VOTE tallies the ballots, sets quorum_met and resolves to APPROVED or REJECTED"
      - "CLOSE_VOTE to APPROVED suspends the offering's repurchase plan"
      - "EXECUTE closes the offering's registration, terminates the repurchase plan and closes every share class"

  # --- StockholderVote ------------------------------------------------------
  - method: POST
    path: /stockholder-votes
    description: "Cast an immutable ballot; the acting InvestorUser's current holdings are snapshotted as voting power."
    roles: [InvestorUser]
    status: 201
    input:
      - liquidity_event_id
      - choice
    output: StockholderVote
    side_effects:
      - "sets investor_id from the acting InvestorUser and snapshots voting_shares_e4 = Investor.total_shares_e4"
      - "one ballot per investor per event; the row is immutable and carries no version"

  - method: GET
    path: /stockholder-votes
    description: "List cast ballots, filterable by event, investor and choice."
    roles: [SponsorOperator, BoardCommittee, ComplianceOfficer, TransferAgent, InvestorUser]
    status: 200
    input:
      - liquidity_event_id?
      - investor_id?
      - choice?
      - limit?
      - offset?
    output: StockholderVote[]
    side_effects: []

  - method: GET
    path: /stockholder-votes/{stockholder_vote_id}
    description: "Retrieve one ballot with its snapshotted voting power."
    roles: [SponsorOperator, BoardCommittee, ComplianceOfficer, TransferAgent, InvestorUser]
    status: 200
    input: []
    output: StockholderVote
    side_effects: []

  # --- Logical clock (mandatory test-driving endpoint) ----------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the server's logical current UTC instant. Every temporal rule in this scaffold reads this clock, never the wall clock. Default at boot: 2026-08-01T00:00:00Z."
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, BoardCommittee, IndependentValuationAdvisor, BrokerDealerRep, InvestorUser]
    status: 200
    input:
      - current_utc
    output:
      current_utc: datetime
      previous_utc: datetime
    side_effects:
      - "changes no business row; only the instant that subsequent requests observe"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-User-Role header missing, blank, or naming an unknown role"
    applies_to: [all]
  - id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "Acting role is not listed for the endpoint, or is not permitted to drive the requested action / to_status"
    applies_to: [all]
  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "An entity_backed role acts on a row belonging to a different Investor or BrokerDealer"
    applies_to: ["POST /subscriptions", "POST /investors/{investor_id}/suitability-documentation", "GET /investors/{investor_id}/statement", "POST /repurchase-requests", "POST /repurchase-requests/{repurchase_request_id}/status", "POST /stockholder-votes"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "Missing required field, wrong type, unknown enum member, malformed date or instant, out-of-range value, inverted interval, pagination limit outside 1..100"
    applies_to: [all]
  - id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    condition: "A path parameter or body foreign key does not resolve to a stored row"
    applies_to: [all]
  - id: ERR_STALE_OFFERING_VERSION
    http_status: 412
    condition: "expected_offering_version does not equal the stored Offering.version"
    applies_to: ["POST /distribution-declarations"]
  - id: ERR_STALE_SHARE_CLASS_VERSION
    http_status: 412
    condition: "expected_share_class_version does not equal the stored ShareClass.version"
    applies_to: ["POST /nav-records"]
  - id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    condition: "The requested transition is not defined from the row's current state, including terminal-state lockdown and repeated triggers"
    applies_to: ["POST /offerings/{offering_id}/registration", "POST /offerings/{offering_id}/escrow", "POST /offerings/{offering_id}/repurchase-plan", "POST /share-classes/{share_class_id}/status", "POST /broker-dealers/{broker_dealer_id}/supervision-status", "POST /selling-agreements/{selling_agreement_id}/status", "POST /subscriptions/{subscription_id}/status", "POST /nav-records/{nav_record_id}/status", "POST /distribution-declarations/{distribution_declaration_id}/payment", "POST /repurchase-periods/{repurchase_period_id}/processing", "POST /repurchase-requests/{repurchase_request_id}/status", "POST /liquidity-events/{liquidity_event_id}/status"]
  - id: ERR_OFFERING_NOT_EFFECTIVE
    http_status: 409
    condition: "The offering's registration_status is not EFFECTIVE where the operation requires it"
    applies_to: ["POST /subscriptions", "POST /subscriptions/{subscription_id}/status", "POST /share-classes/{share_class_id}/status", "POST /selling-agreements/{selling_agreement_id}/status", "POST /repurchase-periods"]
  - id: ERR_SHARE_CLASS_CLOSED
    http_status: 409
    condition: "The target share class is CLOSED_TO_NEW"
    applies_to: ["POST /subscriptions"]
  - id: ERR_SELLING_AGREEMENT_NOT_ACTIVE
    http_status: 409
    condition: "The selling agreement is PENDING, SUSPENDED or TERMINATED"
    applies_to: ["POST /subscriptions"]
  - id: ERR_BROKER_DEALER_BARRED
    http_status: 409
    condition: "The broker-dealer behind the agreement is BARRED"
    applies_to: ["POST /subscriptions", "POST /selling-agreements/{selling_agreement_id}/status"]
  - id: ERR_REPURCHASE_PLAN_SUSPENDED
    http_status: 409
    condition: "The offering's repurchase_plan_status is SUSPENDED or TERMINATED"
    applies_to: ["POST /repurchase-periods", "POST /repurchase-requests", "POST /repurchase-periods/{repurchase_period_id}/processing"]
  - id: ERR_NO_PUBLISHED_NAV
    http_status: 409
    condition: "No PUBLISHED NavRecord exists for a share class whose shares are being accepted or repurchased after escrow has broken"
    applies_to: ["POST /subscriptions/{subscription_id}/status", "POST /repurchase-periods/{repurchase_period_id}/processing"]
  - id: ERR_VOTE_NOT_OPEN
    http_status: 409
    condition: "A ballot is cast against a liquidity event that is not VOTE_OPEN"
    applies_to: ["POST /stockholder-votes"]
  - id: ERR_REPURCHASE_PERIOD_CLOSED
    http_status: 409
    condition: "A request is filed or withdrawn outside the half-open window [opens_at, request_cutoff_at)"
    applies_to: ["POST /repurchase-requests", "POST /repurchase-requests/{repurchase_request_id}/status"]
  - id: ERR_REPURCHASE_PERIOD_WINDOW_CONFLICT
    http_status: 409
    condition: "A new period's window overlaps a sibling window, or opens before the prior period's settlement_date plus the 5-day blackout buffer"
    applies_to: ["POST /repurchase-periods"]
  - id: ERR_PERIOD_NOT_READY_FOR_PROCESSING
    http_status: 409
    condition: "Processing is attempted before request_cutoff_at"
    applies_to: ["POST /repurchase-periods/{repurchase_period_id}/processing"]
  - id: ERR_NAV_PERIOD_OVERLAP
    http_status: 409
    condition: "The proposed valuation period shares at least one calendar date with a non-DRAFT, non-SUPERSEDED sibling record of the same class"
    applies_to: ["POST /nav-records"]
  - id: ERR_NAV_PERIOD_NOT_ELAPSED
    http_status: 409
    condition: "A NAV record is submitted for advisor review before its period_end_date has passed"
    applies_to: ["POST /nav-records/{nav_record_id}/status"]
  - id: ERR_ESCROW_DEADLINE_PASSED
    http_status: 409
    condition: "Escrow is broken, or an offering is declared effective, after escrow_deadline_date"
    applies_to: ["POST /offerings/{offering_id}/escrow", "POST /offerings/{offering_id}/registration"]
  - id: ERR_RESCISSION_WINDOW_EXPIRED
    http_status: 409
    condition: "A rescission is attempted more than rescission_window_days after the lot's issued_date"
    applies_to: ["POST /subscriptions/{subscription_id}/status"]
  - id: ERR_PAYMENT_DATE_NOT_REACHED
    http_status: 409
    condition: "A declaration is paid before its payment_date"
    applies_to: ["POST /distribution-declarations/{distribution_declaration_id}/payment"]
  - id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    condition: "A liquidity event is executed before its proposed_effective_date"
    applies_to: ["POST /liquidity-events/{liquidity_event_id}/status"]
  - id: ERR_SUITABILITY_NOT_DOCUMENTED
    http_status: 422
    condition: "The investor's suitability_status is INCOMPLETE or FLAGGED while the selling agreement requires documentation"
    applies_to: ["POST /subscriptions"]
  - id: ERR_CONCENTRATION_LIMIT_EXCEEDED
    http_status: 422
    condition: "A single subscription alone would push cumulative_invested_cents past concentration_limit_cents"
    applies_to: ["POST /subscriptions"]
  - id: ERR_BELOW_MINIMUM_INVESTMENT
    http_status: 422
    condition: "gross_investment_cents is below 250000 for an investor's first subscription in the offering, or below 50000 for a subsequent one"
    applies_to: ["POST /subscriptions"]
  - id: ERR_UNCOVERED_DISTRIBUTION_UNACKNOWLEDGED
    http_status: 422
    condition: "coverage_ratio_cash_bps is below 10000 and board_uncovered_acknowledgement is false"
    applies_to: ["POST /distribution-declarations"]
  - id: ERR_ADVISOR_OPINION_REQUIRED
    http_status: 422
    condition: "variance_bps exceeds 500 and no advisor_opinion_reference accompanies the confirmation"
    applies_to: ["POST /nav-records/{nav_record_id}/status"]
  - id: ERR_INSUFFICIENT_SHARES
    http_status: 422
    condition: "shares_requested_e4 exceeds the investor's OPEN lots in the class net of shares already tendered in other QUEUED or HELD requests of the same period"
    applies_to: ["POST /repurchase-requests"]
  - id: ERR_DUPLICATE_STOCKHOLDER_VOTE
    http_status: 422
    condition: "The acting investor has already cast a ballot for this liquidity event"
    applies_to: ["POST /stockholder-votes"]
  - id: ERR_DUPLICATE_SHARE_CLASS_CODE
    http_status: 422
    condition: "The offering already has a share class with this class_code"
    applies_to: ["POST /share-classes"]
  - id: ERR_DUPLICATE_REPURCHASE_PERIOD
    http_status: 422
    condition: "The offering already has a non-CANCELLED period for this period_month"
    applies_to: ["POST /repurchase-periods"]
  - id: ERR_DUPLICATE_INVESTOR_EMAIL
    http_status: 422
    condition: "Another investor already uses this email"
    applies_to: ["POST /investors"]
  - id: ERR_DUPLICATE_CRD_NUMBER
    http_status: 422
    condition: "Another broker-dealer already uses this crd_number"
    applies_to: ["POST /broker-dealers"]
  - id: ERR_COMMISSION_CAP_EXCEEDED
    http_status: 422
    condition: "The share class's upfront_selling_commission_bps + dealer_manager_fee_bps exceeds the selling agreement's max_commission_bps"
    applies_to: ["POST /subscriptions"]
  - id: ERR_LOT_PARTIALLY_REPURCHASED
    http_status: 409
    condition: "A rescission is attempted on a subscription whose lot has already been partially repurchased"
    applies_to: ["POST /subscriptions/{subscription_id}/status"]
  - id: ERR_DECLARATION_ALREADY_PAID
    http_status: 409
    condition: "A new declaration would supersede a declaration for the same record_date that is already PAID"
    applies_to: ["POST /distribution-declarations"]
  - id: ERR_OFFERING_MAXIMUM_EXCEEDED
    http_status: 422
    condition: "gross_proceeds_cents plus the subscription's gross_investment_cents would exceed maximum_offering_amount_cents"
    applies_to: ["POST /subscriptions", "POST /subscriptions/{subscription_id}/status"]
  - id: ERR_MINIMUM_OFFERING_NOT_MET
    http_status: 422
    condition: "Escrow is broken while escrow_balance_cents is below minimum_offering_amount_cents"
    applies_to: ["POST /offerings/{offering_id}/escrow"]

# -----------------------------------------------------------------------------
# §1.7 RBAC Permission Matrix
# -----------------------------------------------------------------------------
roles:
  - name: SponsorOperator
    description: "The REIT sponsor's fundraising and valuation preparation desk. Runs the offering's commercial machinery but is deliberately barred from confirming its own valuations, paying distributions, and approving or executing liquidity events."
    identity: opaque
    exclusive_operations:
      - "POST /offerings"
      - "POST /share-classes"
      - "POST /share-classes/{share_class_id}/status"
      - "POST /nav-records"
      - "POST /liquidity-events"
      - "POST /nav-records/{nav_record_id}/status { to_status: ADVISOR_REVIEW }"
      - "POST /nav-records/{nav_record_id}/status { to_status: PUBLISHED }"
      - "POST /liquidity-events/{liquidity_event_id}/status { action: OPEN_VOTE }"
      - "POST /liquidity-events/{liquidity_event_id}/status { action: CLOSE_VOTE }"
    shared_operations:
      - "POST /investors"
      - "POST /subscriptions"
      - "POST /subscriptions/{subscription_id}/status { to_status: ACCEPTED | REJECTED }"
      - "POST /distribution-declarations"
      - "POST /repurchase-periods"
      - "GET /investors/{investor_id}/statement"
      - "every collection and single-resource GET"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Owns registration, escrow, the repurchase plan's suspension authority, broker-dealer supervision and suitability adjudication. Never sells, never values, never pays."
    identity: opaque
    exclusive_operations:
      - "POST /offerings/{offering_id}/registration"
      - "POST /offerings/{offering_id}/escrow"
      - "POST /offerings/{offering_id}/repurchase-plan"
      - "POST /broker-dealers"
      - "POST /broker-dealers/{broker_dealer_id}/supervision-status"
      - "POST /selling-agreements"
      - "POST /selling-agreements/{selling_agreement_id}/status"
      - "POST /selling-agreements/{selling_agreement_id}/supervision-findings"
      - "POST /investors/{investor_id}/suitability-documentation on a FLAGGED investor"
    shared_operations:
      - "POST /investors/{investor_id}/suitability-documentation on an INCOMPLETE investor"
      - "every collection and single-resource GET except GET /investors/{investor_id}/statement"
      - "POST /_clock/set_current_utc"

  - name: IndependentValuationAdvisor
    description: "External valuation firm. The only role that may confirm or push back a NAV record; it may never prepare or publish one."
    identity: opaque
    exclusive_operations:
      - "POST /nav-records/{nav_record_id}/status { to_status: ADVISOR_CONFIRMED }"
      - "POST /nav-records/{nav_record_id}/status { to_status: DRAFT } (push-back with rejection_reason)"
    shared_operations:
      - "GET /nav-records"
      - "GET /nav-records/{nav_record_id}"
      - "GET /share-classes"
      - "GET /share-classes/{share_class_id}"
      - "GET /offerings"
      - "GET /offerings/{offering_id}"
      - "POST /_clock/set_current_utc"

  - name: TransferAgent
    description: "Transfer agent and paying agent. Escrows, refunds and rescinds subscriptions, pays declarations, opens and processes repurchase periods, and issues investor statements."
    identity: opaque
    exclusive_operations:
      - "POST /subscriptions/{subscription_id}/status { to_status: ESCROWED | REFUNDED | RESCINDED }"
      - "POST /distribution-declarations/{distribution_declaration_id}/payment { action: PAY }"
      - "POST /repurchase-periods/{repurchase_period_id}/processing"
    shared_operations:
      - "POST /investors"
      - "POST /repurchase-periods"
      - "GET /investors/{investor_id}/statement"
      - "every collection and single-resource GET"
      - "POST /_clock/set_current_utc"

  - name: BoardCommittee
    description: "The board's independent-directors committee. Approves and executes liquidity events, cancels declarations, and may itself declare a distribution."
    identity: opaque
    exclusive_operations:
      - "POST /liquidity-events/{liquidity_event_id}/status { action: BOARD_APPROVE | EXECUTE | ABANDON }"
      - "POST /distribution-declarations/{distribution_declaration_id}/payment { action: CANCEL }"
    shared_operations:
      - "POST /distribution-declarations"
      - "GET /offerings, GET /liquidity-events, GET /stockholder-votes, GET /distribution-declarations and their single-resource forms"
      - "POST /_clock/set_current_utc"

  - name: BrokerDealerRep
    description: "A registered representative of one selling broker-dealer. Scoped to its own firm's agreements and to the investors it introduces."
    identity: "entity_backed:BrokerDealer"
    exclusive_operations: []
    shared_operations:
      - "POST /investors"
      - "POST /investors/{investor_id}/suitability-documentation on an INCOMPLETE investor"
      - "POST /subscriptions under an agreement of its own BrokerDealer"
      - "GET /subscriptions, GET /selling-agreements, GET /broker-dealers, GET /investors, GET /share-classes and their single-resource forms"
      - "POST /_clock/set_current_utc"

  - name: InvestorUser
    description: "A stockholder acting on its own account. X-User-ID is the Investor.id."
    identity: "entity_backed:Investor"
    exclusive_operations:
      - "POST /repurchase-requests"
      - "POST /repurchase-requests/{repurchase_request_id}/status { to_status: WITHDRAWN }"
      - "POST /stockholder-votes"
    shared_operations:
      - "GET /investors/{investor_id}/statement for its own account"
      - "GET /share-lots, GET /repurchase-requests, GET /repurchase-periods, GET /subscriptions, GET /nav-records, GET /distribution-declarations, GET /liquidity-events, GET /stockholder-votes and their single-resource forms"
      - "POST /_clock/set_current_utc"

