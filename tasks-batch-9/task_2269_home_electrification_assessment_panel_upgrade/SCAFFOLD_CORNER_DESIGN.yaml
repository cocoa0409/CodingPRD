      - name: stale_household_version_blocks_the_assessment_filed_across_an_income_decision
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.assessment-create-stale-household
          - errors.ERR_STALE_HOUSEHOLD_VERSION
          - endpoints.POST_/assessments
        distinguishing_aspect: |
          The household version is bumped by a write the CONTRACTOR never made
          — the reviewer's income verification — so a contractor who read the
          household before the tier decision is stopped with 412
          ERR_STALE_HOUSEHOLD_VERSION even though nothing about its own measure
          list changed. A second stale attempt with the same old version fails
          identically (the 412 is not a one-shot latch).
        test_recipe:
          setup:
            - "One OPEN program with the BASE MEASURE catalog item, a household with a SUBMITTED IncomeVerification and an ENROLLED_ACTIVE contractor."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 OCC Household", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", sort_order: 10, required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Stale Stan", email: "stale@example.com", service_address_line1: "360 Stale Sq", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Stale Mechanical", license_number: "MC-3001", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { hh_v_old: $.data.version }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v_old}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { err_stale_household: $.data.error_id }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v_old}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 999999 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { err_stale_household_again: $.data.error_id }
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { hh_v_new: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v_new}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
          assert:
            - "Trigger call 1 returns version == 1 with income_tier == null"
            - "Trigger call 3 returns 412 with data.error_id == \"ERR_STALE_HOUSEHOLD_VERSION\" and no Assessment or EligibleMeasure row is created"
            - "Trigger call 4 returns 412 with the same data.error_id — repeating the stale write does not eventually succeed"
            - "${hh_v_new} == 2 == ${hh_v_old} + 1: only the VERIFY bumped the household, and neither 412 did"
            - "Trigger call 6 returns 201 with qualified_measure_count == 1, estimated_total_incentive_cents == 800000 and effective_panel_amps == 200"
            - "GET /households/${hh_id} after trigger call 6 returns version == 3 — the successful assessment bumps the household exactly once"

      - name: version_advances_once_per_write_and_never_on_reads
          # NOTE: covers the third bullet of the optimistic_concurrency layer.
        claim_type: optimistic_concurrency
        grounds:
          - entities.Household.fields.version
          - state_machines.IncomeVerification.SUBMITTED_to_VERIFIED
          - endpoints.POST_/rebate-projects/{id}/reservations
        distinguishing_aspect: |
          The version is a write counter with a precise ledger: household
          version 1 at create, 2 after the income VERIFY, 3 after the
          assessment, still 3 after the project create (project create carries
          no OCC field and touches no household money) and 4 only when the
