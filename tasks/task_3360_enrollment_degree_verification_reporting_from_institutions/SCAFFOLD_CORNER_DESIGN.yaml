            - { call: "GET /verification-requests/${r2}", payload: {}, as: ClearinghouseOps, captures: { r2_status: "$.data.status", r2_refund: "$.data.refund_cents" } }
            - { call: "GET /requesters/${rq_id}", payload: {}, as: ClearinghouseOps, captures: { bal: "$.data.credit_balance_cents" } }
          assert:
            - "captured r1_status == CANCELLED and r1_refund == 0 (QUOTED: nothing to refund)"
            - "captured r2_status == CANCELLED and r2_refund == 2599 (PAID: full refund)"
