              as: AppealsAdjudicator
              as_user_id: "adjudicator-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with ${err} == ERR_APPEAL_ALREADY_DECIDED"
            - "Appeal.${appeal_id}.status == DENIED and relief_granted_cents == 0"
            - "Appeal.${appeal_id}.decision_rationale == 'Invoices do not tie to the approved scope of work'"
