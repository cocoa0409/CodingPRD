            - { call: "POST /v1/containment-records/${cr_id}/verify", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/complete-field-work", payload: { gallons_removed: 1000, feet_cleaned: 0 }, as: ProjectManager }
          trigger:
            - { call: "POST /v1/jobs/${job_id}/generate-invoice", payload: {}, as: SafetyManager, as_user_id: "sm_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN and HTTP 403"

      - name: rbac_account_manager_cannot_set_clock
        claim_type: role_exclusive_denied
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - "endpoints[POST /v1/_clock/set_current_utc]"
        distinguishing_aspect: "The test-driving clock endpoint is PlatformAdmin-exclusive; AccountManager gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: AccountManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN and HTTP 403"

      - name: rbac_compliance_cannot_approve_and_approver_cannot_submit
        claim_type: role_exclusive_denied
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.EnvironmentalApprover.exclusive_operations
        distinguishing_aspect: "Peer-role split on waste profiles: ComplianceOfficer cannot approve (ERR_FORBIDDEN) and EnvironmentalApprover cannot submit (ERR_FORBIDDEN) — the two halves of the segregated workflow live on different roles."
        test_recipe:
          setup: ["Site + facility; profile DRAFT then SUBMITTED (by ComplianceOfficer)"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Bayport Terminal" }, as: AccountManager, captures: { site_id: $.data.id } }
            - { call: "POST /v1/disposal-facilities", payload: { name: "Gulf Coast TSDF", epa_id: "TXD0001", total_capacity_tons: 1000 }, as: PlatformAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /v1/waste-profiles", payload: { site_id: "${site_id}", facility_id: "${fac_id}", waste_code: "D008", hazard_class: "HAZ", density_lbs_per_gal: 8.0, disposal_rate_per_ton_cents: 35000, variance_basis: "WEIGHT" }, as: ComplianceOfficer, captures: { prof1: $.data.id } }
            - { call: "POST /v1/waste-profiles", payload: { site_id: "${site_id}", facility_id: "${fac_id}", waste_code: "NONHAZ-WW", hazard_class: "NON_HAZ", density_lbs_per_gal: 8.345, disposal_rate_per_ton_cents: 12000, variance_basis: "VOLUME" }, as: ComplianceOfficer, captures: { prof2: $.data.id } }
            - { call: "POST /v1/waste-profiles/${prof2}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /v1/waste-profiles/${prof1}/submit", payload: {}, as: EnvironmentalApprover, as_user_id: "ea_1", captures: { err_submit: $.data.error_id } }
            - { call: "POST /v1/waste-profiles/${prof2}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_1", captures: { err_approve: $.data.error_id } }
          assert:
            - "err_submit == ERR_FORBIDDEN (EnvironmentalApprover cannot submit)"
            - "err_approve == ERR_FORBIDDEN (ComplianceOfficer cannot approve)"

      - name: rbac_field_supervisor_jha_draft_and_submit_allowed
        claim_type: role_exclusive_allowed
        grounds:
          - roles.FieldSupervisor.exclusive_operations
        distinguishing_aspect: "Positive control: FieldSupervisor performs its exclusive JHA create (201, DRAFT) and submit (200, SUBMITTED) without error."
        test_recipe:
          setup: ["QUOTED job"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "rbac positive" }, as: ProjectManager, captures: { job_id: $.data.id } }
          trigger:
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["ERGONOMIC"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id, jha_st: $.data.status } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_st2: $.data.status } }
          assert:
            - "jha_st == DRAFT and jha_st2 == SUBMITTED (201 then 200, no error)"

  # ================================================================ cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_schedule_activation_stale_then_fresh_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[schedule-activation-stale-site]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Site.version: after S1's activation bumps the site version, activating S2 with the stale captured version fails 412 ERR_STALE_VERSION; re-reading the site and retrying with the fresh version succeeds and SUPERSEDES S1."
        test_recipe:
          setup: ["Site created (version captured); S1 activated; S2 created DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S2", vacuum_per_gallon_cents: 300, hydroblast_per_foot_cents: 1900, labor_rate_cents_per_hour: 15000, equipment_rate_cents_per_hour: 23000, standby_rate_cents_per_hour: 12500, overtime_multiplier: 1.5, minimum_invoice_cents: 80000 }, as: AccountManager, captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /v1/rate-schedules/${s2}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager, captures: { err: $.data.error_id } }
            - { call: "GET /v1/sites/${site_id}", payload: {}, as: AccountManager, captures: { site_v_fresh: $.data.version } }
            - { call: "POST /v1/rate-schedules/${s2}/activate", payload: { expected_site_version: "${site_v_fresh}" }, as: AccountManager, captures: { s2_status: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION with HTTP 412 (site version had advanced past the captured value)"
            - "s2_status == ACTIVE after retry with the fresh version; RateSchedule.${s1}.status == SUPERSEDED"

      - name: occ_jha_approval_stale_job_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[jha-approval-stale-job]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Job.version: the version captured before rev1's approval is stale for rev2's approval (approval bumped the job) — rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["QUOTED job; JHA rev1 APPROVED (job version bumped); JHA rev2 SUBMITTED; client holds the pre-approval version"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "occ jha" }, as: ProjectManager, captures: { job_id: $.data.id, job_v_stale: $.data.version } }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["SLIP_TRIP"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha1: $.data.id } }
            - { call: "POST /v1/jhas/${jha1}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "POST /v1/jhas/${jha1}/approve", payload: { expected_job_version: "${job_v_stale}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["SLIP_TRIP", "ERGONOMIC"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha2: $.data.id } }
            - { call: "POST /v1/jhas/${jha2}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
          trigger:
            - { call: "POST /v1/jhas/${jha2}/approve", payload: { expected_job_version: "${job_v_stale}" }, as: SafetyManager, as_user_id: "sm_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_VERSION with HTTP 412 (job version advanced when rev1 was approved)"
            - "JobHazardAnalysis.${jha2}.status stays SUBMITTED; ${jha1} stays APPROVED"

      - name: job_standby_accrual_reconciles_after_each_close
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.job_standby_accrual
          - entities.Job.fields.standby_accrued_cents
        excluded_because:
          difficulty_instance: downtime_grace_cap_block_formula
          rationale: "Accrual recompute (99000 after two closes) is asserted by the named 1.8 instance."

  # ================================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_mutation_visible_in_same_response_and_read
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - "endpoints[POST /v1/permits/{permitId}/activate]"
        distinguishing_aspect: "Immediate consistency: the activate response itself carries status ACTIVE (no stale read), and a follow-up filtered list GET /v1/permits?job_id= shows the same state."
        test_recipe:
          setup: ["MOBILIZED job; HOT_WORK permit ISSUED"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-02", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "consistency probe" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/permits", payload: { job_id: "${job_id}", permit_type: "HOT_WORK", space_id: "B-201", valid_from: "2026-07-31T00:00:00Z", valid_until: "2026-08-05T18:00:00Z" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { perm_id: $.data.id } }
          trigger:
            - { call: "POST /v1/permits/${perm_id}/activate", payload: {}, as: FieldSupervisor, as_user_id: "fs_1", captures: { st_resp: $.data.status } }
            - { call: "GET /v1/permits?job_id=${job_id}", payload: {}, as: ProjectManager, captures: { st_list: "$.data[0].status" } }
          assert:
            - "st_resp == ACTIVE (mutation visible in the same response)"
            - "st_list == ACTIVE (read-after-write consistent)"
