      - name: error_client_credit_hold_blocks_qualification
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CLIENT_CREDIT_HOLD]
        excluded_because:
          difficulty_instance: transitive_cascade / transitive_upheld_claim_holds_credit_and_blocks_qualified_inquiry
          rationale: "That §1.8 instance drives credit to HOLD through the two-strike cascade and then asserts ERR_CLIENT_CREDIT_HOLD on a fresh qualification."

      - name: error_speaker_not_active_blocks_the_signature_leg
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SPEAKER_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_speaker_probation_blocks_only_the_speaker_signature_leg
          rationale: "That §1.8 instance triggers ERR_SPEAKER_NOT_ACTIVE on the speaker leg while the client leg still succeeds."

      - name: error_segregation_of_duties_on_commission_adjustment
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_segregation_of_duties_outranks_stale_engagement_version
          rationale: "That §1.8 instance triggers ERR_SEGREGATION_OF_DUTIES for the owning agent and shows it outranking the OCC check."

      - name: error_revision_limit_reached_after_two_rounds
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REVISION_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / non_linear_proposal_revision_cycle_bounded_at_two_rounds
          rationale: "That §1.8 instance exhausts the two allowed revisions and asserts ERR_REVISION_LIMIT_REACHED on the third request."

      - name: error_engagement_already_terminal_on_second_cancel
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ENGAGEMENT_ALREADY_TERMINAL]
        excluded_because:
          difficulty_instance: non_linear_state_machine / non_linear_engagement_settlement_advances_while_booking_stays_cancelled
          rationale: "That §1.8 instance re-cancels a cancelled engagement and asserts ERR_ENGAGEMENT_ALREADY_TERMINAL while the settlement lane keeps advancing."

      - name: error_budget_below_floor_and_insufficient_lead_time
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BUDGET_BELOW_FLOOR]
          - errors[ERR_INSUFFICIENT_LEAD_TIME]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_lead_time_outranks_budget_floor_on_qualification
          rationale: "That §1.8 instance triggers both errors on the same endpoint and asserts which one wins when both are violated."

      - name: error_invoice_not_payable_after_a_void
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVOICE_NOT_PAYABLE]
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_invoice_void_unwinds_client_balance_and_speaker_payable
          rationale: "That §1.8 instance voids an issued invoice and asserts ERR_INVOICE_NOT_PAYABLE on the second void."

