scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: grade_provisional_vs_final_diverge_on_uneven_subgrades
        grounds:
          - calculations.provisional_overall_grade
          - calculations.final_overall_grade
          - state_machines.SubmissionItem.INTAKE_LOGGED_to_GRADING
          - entities.GradeAssessment.fields.provisional_overall
          - entities.GradeAssessment.fields.final_overall
        distinguishing_aspect: |
          On GradeAssessment (item-grade domain), provisional ignores the
          min-subgrade+1.5 cap while final applies it: subgrades 10/10/10/6
          give provisional 9.0 but final 7.5 — same inputs, different overall.
        test_recipe:
          setup:
            - "ServiceLevel EXPRESS (base 5000, rate 200bps, cap 50000)."
            - "GradingStandard CARD_10PT (equal 2500bps weights, max 10, authentic_min 1.0)."
            - "Customer with a SUBMITTED submission, one item INTAKE_LOGGED matching declaration."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "Card A", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
          trigger:
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 10, corners_subgrade: 10, edges_subgrade: 10, surface_subgrade: 6 }
              as: Grader
              captures: { ga_id: $.data.id }
            - call: "POST /grade-assessments/${ga_id}/finalize"
              payload: {}
              as: Grader
          assert:
            - "GradeAssessment.${ga_id}.provisional_overall == 9.0"
            - "GradeAssessment.${ga_id}.final_overall == 7.5"
            - "GradeAssessment.${ga_id}.provisional_overall != GradeAssessment.${ga_id}.final_overall"

      - name: insurance_estimate_vs_final_fee_diverge_over_tier_cap
        grounds:
          - calculations.estimate_item_fee
          - calculations.finalize_item_fee
          - state_machines.SubmissionItem.AUTHENTICATED_to_ENCAPSULATED
          - entities.SubmissionItem.fields.estimated_fee_cents
          - entities.SubmissionItem.fields.final_fee_cents
        distinguishing_aspect: |
          On SubmissionItem (item-fee domain — different entity from grade),
          the estimate insures the UNCAPPED declared value (80000 -> est fee
          6600) while final insures the CAPPED value 50000 (-> final fee 6000):
          same item, two algorithms, different fee.
        test_recipe:
          setup:
            - "ServiceLevel EXPRESS (cap 50000). Item declared 80000 (over cap)."
            - "Item carried to AUTHENTICATED with a finalized GENUINE assessment."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "Card B", declared_value_cents: 80000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { ga_id: $.data.id }
            - call: "POST /grade-assessments/${ga_id}/finalize"
              payload: {}
              as: Grader
            - call: "POST /submission-items/${item_id}/authentication"
              payload: { verdict: "GENUINE" }
              as: Authenticator
          trigger:
            - call: "POST /submission-items/${item_id}/encapsulate"
              payload: { assessment_id: "${ga_id}" }
              as: Authenticator
          assert:
            - "SubmissionItem.${item_id}.estimated_fee_cents == 6600"
            - "SubmissionItem.${item_id}.final_fee_cents == 6000"
            - "SubmissionItem.${item_id}.estimated_fee_cents != SubmissionItem.${item_id}.final_fee_cents"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: final_grade_nonlinear_min_cap_three_inputs   # mode (a)
        grounds:
          - calculations.final_overall_grade
          - state_machines.SubmissionItem.GRADING_to_AUTHENTICATED
          - entities.GradeAssessment.fields.final_overall
        distinguishing_aspect: |
          Mode (a): final_overall = floor_half(min(weighted_floor, min_sub+1.5))
          nests a weighted sum, a min over four subgrades, and a min cap — a
          >=3-input non-linear interaction where the cap, not the weighted mean,
          decides the output (subgrades 10/10/10/6 -> 7.5 from cap, not 9.0).
        test_recipe:
          setup:
            - "EXPRESS tier, CARD_10PT standard, one INTAKE_LOGGED item."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "Card C", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 10, corners_subgrade: 10, edges_subgrade: 10, surface_subgrade: 6 }
              as: Grader
              captures: { ga_id: $.data.id }
          trigger:
            - call: "POST /grade-assessments/${ga_id}/finalize"
              payload: {}
              as: Grader
          assert:
            - "GradeAssessment.${ga_id}.final_overall == 7.5"

      - name: estimate_submission_fee_per_item_then_sum_rounding_order   # mode (b)
        grounds:
          - calculations.estimate_item_fee
          - calculations.estimate_submission_fee
          - state_machines.Submission.DRAFT_to_SUBMITTED
          - entities.Submission.fields.total_estimated_fee_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned to per-item-ceil-then-sum.
          Tier ROUND (base 1000, 125bps), three items each 1201 -> per item
          ceil(15.0125)=16 so item est 1016, sum 3048; sum-then-ceil would be
          3046. The scaffold pins 3048.
        test_recipe:
          setup:
            - "ServiceLevel ROUND (base 1000, rate 125bps, cap 1000000000)."
            - "Three DRAFT items each declared 1201."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "ROUND", turnaround_business_days: 5, base_fee_cents: 1000, max_declared_value_cents: 1000000000, insurance_rate_bps: 125 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "I1", declared_value_cents: 1201 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "I2", declared_value_cents: 1201 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "I3", declared_value_cents: 1201 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Submission.${sub_id}.total_estimated_fee_cents == 3048"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: submission_item_cyclic_crack_and_regrade_loop
        grounds:
          - state_machines.SubmissionItem.ENCAPSULATED_to_CRACK_PENDING
          - state_machines.SubmissionItem.CRACK_PENDING_to_GRADING
          - entities.SubmissionItem.fields.regrade_count
          - entities.SubmissionItem.fields.status
        distinguishing_aspect: |
          SubmissionItem is cyclic: ENCAPSULATED -> CRACK_PENDING -> GRADING
          returns the item to a state it already left, with regrade_count
          incremented to 1 — a true loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Item ENCAPSULATED with an active slab; submission not shipped."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "Card D", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 7, corners_subgrade: 8, edges_subgrade: 8, surface_subgrade: 8 }
              as: Grader
              captures: { ga_id: $.data.id }
            - call: "POST /grade-assessments/${ga_id}/finalize"
              payload: {}
              as: Grader
            - call: "POST /submission-items/${item_id}/authentication"
              payload: { verdict: "GENUINE" }
              as: Authenticator
            - call: "POST /submission-items/${item_id}/encapsulate"
              payload: { assessment_id: "${ga_id}" }
              as: Authenticator
              captures: { slab_id: $.data.id }
            - call: "GET /submission-items/${item_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_v: $.data.version }
            - call: "POST /submission-items/${item_id}/regrade-requests"
              payload: { prior_slab_id: "${slab_id}", expected_item_version: "${item_v}", reason: "undergraded" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { ga2_id: $.data.id }
          assert:
            - "SubmissionItem.${item_id}.status == GRADING"
            - "SubmissionItem.${item_id}.regrade_count == 1"

      - name: submission_compound_posture_derived_from_children
        grounds:
          - state_machines.Submission.RECEIVING_to_IN_GRADING
          - state_machines.Submission.IN_GRADING_to_READY_TO_SHIP
          - entities.Submission.fields.status
        distinguishing_aspect: |
          Submission is compound (a different entity): its status is auto-derived
          from child SubmissionItem states — IN_GRADING while any child grades,
          READY_TO_SHIP only when every non-rejected child is ENCAPSULATED — not
          a manually-driven linear edge.
        test_recipe:
          setup:
            - "Submission with one item carried INTAKE_LOGGED then into GRADING."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "Card E", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
          trigger:
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
          assert:
            - "Submission.${sub_id}.status == IN_GRADING"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: crack_cascade_slab_assessment_population_version   # depth >= 3
        grounds:
          - state_machines.SubmissionItem.ENCAPSULATED_to_CRACK_PENDING
          - calculations.population_decrement
          - entities.Slab.fields.active
          - entities.GradeAssessment.fields.superseded
          - entities.PopulationReport.fields.pop_count
        distinguishing_aspect: |
          Opening a RegradeRequest (A) cracks the active Slab (B, active=false);
          that crack supersedes the active GradeAssessment (C, superseded=true);
          which decrements the PopulationReport bucket (D, pop_count 1->0) — a
          depth-4 chain each link caused by the previous, originating from the
          crack trigger.
        test_recipe:
          setup:
            - "Item ENCAPSULATED with active slab; population bucket pop_count==1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "Card F", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { ga_id: $.data.id }
            - call: "POST /grade-assessments/${ga_id}/finalize"
              payload: {}
              as: Grader
            - call: "POST /submission-items/${item_id}/authentication"
              payload: { verdict: "GENUINE" }
              as: Authenticator
            - call: "POST /submission-items/${item_id}/encapsulate"
              payload: { assessment_id: "${ga_id}" }
              as: Authenticator
              captures: { slab_id: $.data.id }
            - call: "GET /submission-items/${item_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_v: $.data.version }
          trigger:
            - call: "POST /submission-items/${item_id}/regrade-requests"
              payload: { prior_slab_id: "${slab_id}", expected_item_version: "${item_v}", reason: "undergraded" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Slab.${slab_id}.active == false"
            - "GradeAssessment.${ga_id}.superseded == true"
            - "SubmissionItem.${item_id}.status == CRACK_PENDING"

      - name: lost_shipment_cascade_claim_payout_store_credit   # depth >= 2
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_LOST
          - calculations.insurance_payout
          - entities.InsurancePolicy.fields.claim_status
          - entities.InsurancePolicy.fields.payout_cents
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Reporting a Shipment LOST (A) flips InsurancePolicy.claim_status to
          PAID (B); which pays payout_cents and credits Customer.store_credit_cents
          (C) — a depth-3 chain from a DIFFERENT trigger (report-lost) than the
          crack cascade. Single item covered 50000 -> store_credit += 1000... no:
          covered for one item declared 80000 capped 50000 -> payout 50000.
        test_recipe:
          setup:
            - "Submission with one item declared 80000 (capped to 50000), shipped & IN_TRANSIT."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c8@x.com", full_name: "C Eight" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "Card G", declared_value_cents: 80000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
