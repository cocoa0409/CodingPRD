              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Wendy Whole", lease_start_on: "2024-01-10", lease_end_on: "2026-02-01", monthly_rent_cents: 150000, deposit_cents: 100010, keys_issued: 1, fobs_issued: 0 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2024-01-10T09:00:00Z", scheduled_end_at: "2024-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi: $.data.id }
            - { call: "POST /pm/inspections/${mi}/complete", payload: {}, as: Inspector }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-01-10T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/tenancies/${ten}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten}/record_key_return", payload: { keys_returned: 1, fobs_returned: 0 }, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-01-10T10:00:00Z", scheduled_end_at: "2026-01-10T11:00:00Z" }
              as: PropertyManager
              captures: { mo: $.data.id }
            - { call: "POST /pm/inspections/${mo}/complete", payload: {}, as: Inspector }
          trigger:
            - call: "GET /pm/tenancies/${ten}"
              as: PropertyManager
              captures: { int_seen: $.data.interest_accrued_cents }
          assert:
            - "Tenancy.${ten}.interest_accrued_cents == 5000"
            - "${int_seen} == 5000  (per-year round-then-sum; sum-then-round would give 5001)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: statement_revision_cycle_draft_issued_disputed_draft
        grounds:
          - state_machines.DepositStatement.DRAFT_to_ISSUED
          - state_machines.DepositStatement.ISSUED_to_DISPUTED
          - state_machines.DepositStatement.DISPUTED_to_DRAFT
        distinguishing_aspect: |
          DepositStatement is cyclic: DRAFT -> ISSUED -> DISPUTED -> DRAFT ->
          ISSUED again on the SAME row, with the DISPUTED -> DRAFT hop
          compensating BILLED deduction lines back to DRAFT and withdrawing the
          dispute. Paint damage 60,000c; refund_due 149,337c after each
          issuance.
        test_recipe:
          setup:
            - "Canonical tenancy VACATED with one paint TENANT_DAMAGE deduction (60,000c); keys 2/2 and fob 1/1 returned so no key lines"
            - "Statement created DRAFT, issued at 2026-08-10 (timely), disputed by the tenant for 20,000c"
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi: $.data.id }
            - call: "POST /pm/inspections/${mi}/items"
