              captures: { claim1_id: $.data.id }
            - call: "POST /warranty-claims/${claim1_id}/adjudication"
              payload: { decision: "APPROVE" }
              as: WarrantyAdjudicator
            - call: "POST /warranty-claims"
              payload: { connected_unit_id: "${unit_id}", service_partner_id: "${sp_id}", technician_certification_id: "${tc2_id}", claim_code: "CLM-3", parts_cost_cents: 93111, labor_hours: 2.0 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { claim3_id: $.data.id }
            - call: "POST /warranty-claims/${claim3_id}/adjudication"
              payload: { decision: "APPROVE" }
              as: WarrantyAdjudicator
            - call: "GET /connected-units/${unit_id}"
              payload: {}
              as: ConnectedOpsEngineer
              captures: { balance_before: $.data.reserve_balance_cents, paid_before: $.data.claims_paid_cents, coverage_before: $.data.service_program_status, grace_before: $.data.grace_expires_on }
          trigger:
            - call: "POST /warranty-claims/${claim3_id}/reversal"
              payload: { reversal_reason: "parts invoice was billed to the wrong serial" }
              as: WarrantyAdjudicator
            - call: "GET /connected-units/${unit_id}"
              payload: {}
              as: ConnectedOpsEngineer
              captures: { balance_after: $.data.reserve_balance_cents, paid_after: $.data.claims_paid_cents, coverage_after: $.data.service_program_status, grace_after: $.data.grace_expires_on }
          assert:
            - "${reserve_initial} == 250000"
            - "${balance_before} == 0"
            - "${paid_before} == 250000"
            - "${coverage_before} == GRACE"
            - "${grace_before} == '2026-08-31T00:00:00Z'"
            - "${balance_after} == 100000"
            - "${paid_after} == 150000"
            - "${balance_after} + ${paid_after} == 250000"
            - "${coverage_after} == ACTIVE"
            - "${grace_after} is null"
            - "WarrantyClaim.${claim3_id}.status == REVERSED"
            - "WarrantyClaim.${claim1_id}.status == APPROVED"
            - "WarrantyClaim.${claim1_id}.adjudicated_amount_cents == 150000"
