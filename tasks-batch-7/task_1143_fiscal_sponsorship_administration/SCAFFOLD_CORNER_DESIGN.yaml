      - name: sm_tranche_close_before_period_end_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.GrantTranche.ISSUED_to_CLOSED, "errors[ERR_TRANCHE_STATE_INVALID]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Tranche close requires the logical clock past period_end; default clock 2026-05-01T00:00:00Z is before 2026-06-30 so close fails, then advancing the clock to 2026-07-01 makes it succeed."
        test_recipe:
          setup: ["PRE_APPROVED_GRANT project ACTIVE; tranche [2026-01-01, 2026-06-30] ISSUED; logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "TC", mission_statement: "m", requested_model: "PRE_APPROVED_GRANT", budget_estimate_cents: 1000, contact_email: "tc@x.org" }, as: Applicant, as_user_id: user_c_tc, captures: { app: $.data.id } }
