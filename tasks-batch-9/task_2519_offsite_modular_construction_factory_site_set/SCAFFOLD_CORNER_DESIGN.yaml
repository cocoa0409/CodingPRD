  # ===========================================================================
  # Every error in §1.6 must be triggerable. The instances below cover the ids
  # that no other §1.8 or §1.9 instance already provokes; the remaining ids are
  # each asserted by name inside a §1.8 instance or in an earlier §1.9 section.
  - section: errors
    instances:
      - name: every_path_id_error_in_the_catalog_is_triggerable
        claim_type: Triggerability
        grounds:
          - errors[ERR_FACTORY_NOT_FOUND]
          - errors[ERR_AGENCY_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - errors[ERR_DEFECT_CLAIM_NOT_FOUND]
          - errors[ERR_DRAW_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          Each entity has its OWN not-found id, so a generic 404 fails this corner. The unknown ids
          are well-formed UUIDs that never existed, and every response must name the entity of the
          path segment it failed on.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; empty database otherwise"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /modular/factories/11111111-1111-4111-8111-111111111111"
              as: ProgramAdmin
              captures: { e1: "$.data.error_id" }
            - call: "GET /modular/agencies/22222222-2222-4222-8222-222222222222"
              as: ProgramAdmin
              captures: { e2: "$.data.error_id" }
            - call: "GET /modular/projects/33333333-3333-4333-8333-333333333333"
              as: ProgramAdmin
              captures: { e3: "$.data.error_id" }
            - call: "GET /modular/design-packages/44444444-4444-4444-8444-444444444444"
              as: ProgramAdmin
              captures: { e4: "$.data.error_id" }
            - call: "GET /modular/modules/55555555-5555-4555-8555-555555555555"
              as: ProgramAdmin
              captures: { e5: "$.data.error_id" }
            - call: "GET /modular/permits/66666666-6666-4666-8666-666666666666"
              as: ProgramAdmin
              captures: { e6: "$.data.error_id" }
