  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth-3 from run-cycle expiry; depth-2 from PATCH suspend)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: compliance_expiry_three_hop_cascade
        grounds:
          - state_machines.ComplianceDoc.APPROVED_to_EXPIRED
          - state_machines.Driver.ACTIVE_to_SUSPENDED
          - state_machines.Assignment.ACCEPTED_to_RELEASED
          - state_machines.Ride.ASSIGNED_to_DISPATCHING
        distinguishing_aspect: |
          Depth-3 chain from a single run-cycle trigger: ComplianceDoc APPROVED ->
          EXPIRED mutates Driver ACTIVE -> SUSPENDED, which itself mutates
          Assignment ACCEPTED -> RELEASED, which itself mutates Ride ASSIGNED ->
          DISPATCHING (driver cleared, round +1, driver excluded). Each hop is
          caused by the previous hop, not by run-cycle directly.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; ACTIVE client"
            - "Driver ACTIVE with BACKGROUND_CHECK and INSURANCE valid to 2027-01-01 but BONDING valid only [2026-01-01, 2026-06-30)"
            - "Ride pickup 2026-06-10T10:00:00Z ASSIGNED to that driver (bonding covered pickup date at accept time)"
            - "Logical clock advanced to 2026-06-30 (bonding window closed today)"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bg: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bg}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-01-01", valid_until: "2026-06-30" }, as: Coordinator, captures: { doc_bd: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bd}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_in: $.data.id } }
            - { call: "POST /compliance-docs/${doc_in}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "APPOINTMENT", scheduled_pickup_at: "2026-06-10T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id } }
            - { call: "POST /rides/${ride}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg: $.data.id } }
            - { call: "POST /assignments/${asg}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-30T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /ops/run-cycle", as: PlatformAdmin, captures: { epoch: $.data.ops_epoch } }
            - { call: "GET /compliance-docs/${doc_bd}", as: ComplianceOfficer, captures: { doc_status: $.data.status } }
            - { call: "GET /drivers/${drv}", as: Coordinator, captures: { drv_status: $.data.status } }
            - { call: "GET /assignments/${asg}", as: Coordinator, captures: { asg_status: $.data.status } }
            - { call: "GET /rides/${ride}", as: Coordinator, captures: { ride_status: $.data.status, ride_round: $.data.dispatch_round, ride_driver: $.data.assigned_driver_id } }
          assert:
            - "ComplianceDoc.${doc_bd}.status == EXPIRED (half-open window [2026-01-01, 2026-06-30) closed at 06-30)"
            - "Driver.${drv}.status == SUSPENDED (posture incomplete: BONDING has no valid APPROVED doc today)"
            - "Assignment.${asg}.status == RELEASED with release_reason DRIVER_SUSPENDED"
            - "Ride.${ride}.status == DISPATCHING, dispatch_round == 2, assigned_driver_id == null"
            - "Ride.${ride}.excluded_driver_ids contains ${drv}"

      - name: client_suspension_two_hop_cascade
        grounds:
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - state_machines.Ride.DISPATCHING_to_CANCELLED
          - state_machines.Assignment.OFFERED_to_EXPIRED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (PATCH suspend, not run-cycle):
          Client ACTIVE -> SUSPENDED mutates the client's DISPATCHING Ride ->
          CANCELLED (fee 0, reason CLIENT_SUSPENDED), which itself mutates the
          ride's live OFFERED Assignment -> EXPIRED (release_reason RIDE_CANCELLED).
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; ACTIVE client (version captured); ACTIVE driver"
            - "Ride in DISPATCHING with a live OFFERED assignment (dispatch run, no response yet)"
          setup_api_calls:
