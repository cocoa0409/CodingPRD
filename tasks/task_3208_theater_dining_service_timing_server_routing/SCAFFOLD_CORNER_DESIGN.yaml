            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Dune", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${s1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 4, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${s1_id}"
              captures: { slip_id: $.data.id }
          trigger:
            - call: "POST /order-slips/${slip_id}/prepare"
              payload: {}
              as: Server
              as_user_id: "${s2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "acting as S2 on S1's slip is refused with data.error_id == \"ERR_NOT_ASSIGNED_SERVER\" and HTTP 403"
            - "the refusal is produced by the identity mismatch and not by the pose of the header, since S2 is a real server entity"
            - "the slip's status is still ACCEPTED, so the rejected call applied no side effect"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: optimistic_concurrency_version_advances_on_every_section_reassignment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reassign-stale-section-assignment]
          - errors[ERR_STALE_SECTION_ASSIGNMENT_VERSION]
          - entities.SectionAssignment.fields.version
        distinguishing_aspect: "Reassignment is guarded by the section's own version, so after the first reassignment advances it the second request carrying the earlier version is refused."
        test_recipe:
          setup:
            - "Auditorium A, servers S1, S2 and S3, showtime X1 open for dining with SA1 owned by S1."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 29", seat_capacity: 60 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Tia", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Uma", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Vic", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { s3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Dune", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id }
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${s1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id, sa1_v: $.data.version }
          trigger:
            - call: "PATCH /section-assignments/${sa1_id}"
              payload: { server_id: "${s2_id}", expected_section_assignment_version: "${sa1_v}" }
              as: KitchenLead
            - call: "PATCH /section-assignments/${sa1_id}"
              payload: { server_id: "${s3_id}", expected_section_assignment_version: "${sa1_v}" }
              as: KitchenLead
              captures: { err_id: $.data.error_id }
          assert:
            - "the first reassignment succeeds with HTTP 200 and the section's version advances past ${sa1_v}"
            - "the second reassignment, carrying the same ${sa1_v}, is refused with data.error_id == \"ERR_STALE_SECTION_ASSIGNMENT_VERSION\" and HTTP 412"
            - "the section's server_id is still ${s2_id}, so the stale request changed nothing"

      - name: derived_field_reconciliation_self_heals_a_stale_auditorium_posture
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.auditorium_posture_reconciliation
          - endpoints.GET_/auditoriums/{id}/posture
          - entities.Auditorium.fields.service_posture
        distinguishing_aspect: "The posture read recomputes from member showtimes and the clock rather than trusting the stored value, so moving the clock alone changes the reported build phase without any write to the auditorium."
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, one scheduled showtime X1 starting 2026-09-01T20:00:00Z runtime 60, clock 2026-09-01T18:00:00Z."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 30", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Dune", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id }
          trigger:
            - call: "GET /auditoriums/${aud_id}/posture"
              payload: {}
              as: KitchenLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:20:00Z" }
              as: PlatformAdmin
            - call: "GET /auditoriums/${aud_id}/posture"
              payload: {}
              as: KitchenLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:45:00Z" }
              as: PlatformAdmin
            - call: "GET /auditoriums/${aud_id}/posture"
              payload: {}
              as: KitchenLead
          assert:
            - "at 18:00 the posture reads build_phase == \"SETUP\", since the dining open instant 19:40 is more than 30 minutes away"
            - "at 19:20 the posture reads build_phase == \"NEARLY_READY\", since 19:40 falls inside the 30-minute lead"
            - "at 19:45 the posture reads build_phase == \"READY\" and next_scheduled_showtime_dining_open_at_utc == \"2026-09-01T19:40:00Z\""
            - "no endpoint wrote to the auditorium between the three reads, so the reported changes came from reconciliation alone"

      - name: immediate_consistency_exposes_a_settled_check_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/checks/{id}/close
          - entities.CheckTab.fields.refunded_cents
        distinguishing_aspect: "The settlement response already carries the post-refund fields, so no second read is needed to observe the compensated balance."
        test_recipe:
          setup:
            - "Auditorium A, E1 price 1000 prep 1, server S1, showtime X1 with a delivered entree slip past the deadline so a 300 cent compensation is booked."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 31", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Burrito", channel: "ENTREE", price_cents: 1000, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Wes", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Dune", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 5, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv_id}"
              captures: { slip_id: $.data.id }
            - call: "POST /showtimes/${x1_id}/start-service"
              payload: {}
              as: KitchenLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T21:20:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes/${x1_id}/start-feature"
              payload: {}
              as: KitchenLead
            - call: "GET /order-slips/${slip_id}"
              payload: {}
              as: Server
              captures: { slip_v: $.data.version }
            - call: "GET /checks"
              payload: { order_slip_id: "${slip_id}" }
              as: KitchenLead
              captures: { check_id: "$.data[0].id" }
          trigger:
            - call: "POST /checks/${check_id}/close"
              payload: { expected_order_slip_version: "${slip_v}" }
              as: Server
              as_user_id: "${srv_id}"
          assert:
            - "the close response itself carries data.status == \"SETTLED\""
            - "the same response carries data.original_cents == 1000 and data.refunded_cents == 300"
            - "no follow-up GET is required to observe the compensated balance, which is what immediate consistency means here"

  # ===========================================================================
  - section: response_envelope
    instances:

      - name: success_envelope_shape_is_stable_across_read_and_write
        claim_type: envelope
        grounds:
          - response_envelope.success
          - endpoints.POST_/auditoriums
          - endpoints.GET_/auditoriums/{id}
        distinguishing_aspect: "Both a write and a read return the same four keys in the declared order, with response_type differing only in object versus array."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /auditoriums"
              payload: { name: "Theater 32", seat_capacity: 40 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "GET /auditoriums/${aud_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "both responses carry a meta object with api_request_id prefixed req_ and api_request_timestamp in ISO 8601"
            - "the write carries response_type == \"object\" and the list form carries response_type == \"array\" when listing"
            - "the data key is present on both, and no success response carries an error_id"

      - name: error_envelope_shape_matches_the_declared_contract
        claim_type: envelope
        grounds:
          - response_envelope.error
          - errors[ERR_AUDITORIUM_NOT_FOUND]
        distinguishing_aspect: "Every failure returns response_type error together with exactly the two declared data keys and no partial business payload."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /auditoriums/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response carries HTTP 404 and response_type == \"error\""
            - "data contains exactly error_id and message, with data.error_id == \"ERR_AUDITORIUM_NOT_FOUND\""
            - "data carries no entity fields such as name or seat_capacity"
