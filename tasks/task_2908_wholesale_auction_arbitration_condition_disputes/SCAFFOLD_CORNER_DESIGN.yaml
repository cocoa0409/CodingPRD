              as: AuctionAdmin
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 and response.data.error_id == \"ERR_UNAUTHENTICATED\""
            - "response.data.message is a non-empty string and response.meta.api_request_id is present"

