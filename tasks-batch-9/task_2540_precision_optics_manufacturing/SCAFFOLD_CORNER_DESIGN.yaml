            - "the five-in-band payload returns HTTP 200 with in_band_sample_count 5, band_average_reflectance_pct 0.1400, worst_point_reflectance_pct 0.1800 and spectral_verdict PASS"
            - "CoatingRun.${c1}.coating_status == VERIFIED_PASS and WorkOrder.${w1}.process_status == COATED"
            - "the 700 nm point counts as in-band in both payloads, since the band bounds are inclusive"

      - name: thin_blanks_empty_assemblies_and_unreleased_elements_each_have_their_own_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_GLASS_GRADE_UNSUITABLE
          - errors.ERR_ASSEMBLY_EMPTY
          - errors.ERR_COMPONENT_NOT_RELEASED
          - validations.priority_21
          - validations.priority_24
          - validations.priority_13
        distinguishing_aspect: |
          Three refusals that share nothing but their 409 status: a lot whose blanks are 5000.0 um thick
          fails the design's 5800.0 um minimum under the grade rule even though both its grades are
          suitable, cementing an assembly that owns no ACTIVE component is ERR_ASSEMBLY_EMPTY, and kitting
          an element whose work order is still in fabrication is ERR_COMPONENT_NOT_RELEASED. Each is then
          shown to clear once its single cause is removed.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A with the default min_center_thickness_um of 5800.0."
            - "Two RELEASED lots certified H3/B: GL-2540-THIN with blank_center_thickness_um 5000.0 and GL-2540-OK with 6200.0, both holding 20 blanks."
            - "One KITTED assembly AS-2540-1 with no components at all."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-THIN", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A", blank_center_thickness_um: 5000.0 }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-OK", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A", blank_center_thickness_um: 6200.0 }
              as: ProcurementOfficer
              captures: { g2: $.data.id }
            - call: "POST /optics/glass-lots/${g2}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-2" }
              as: ProcurementOfficer
              captures: { g2v: $.data.version }
            - call: "POST /optics/assemblies"
              payload: { design_id: "${d1}", assembly_code: "AS-2540-1" }
              as: ProcessTechnician
              captures: { a1: $.data.id, a1v: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-THIN", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
            - call: "POST /optics/assemblies/${a1}/cement"
              payload: { cement_lot_code: "CEM-A-114" }
              as: ProcessTechnician
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-OK", design_id: "${d1}", glass_lot_id: "${g2}", element_count: 2, expected_glass_lot_version: "${g2v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "POST /optics/assembly-components"
              payload: { assembly_id: "${a1}", work_order_id: "${w1}", slot_index: 1, decenter_um: 10.0, tilt_arcmin: 1.0, element_wavefront_rms_waves: 0.0600, expected_assembly_version: "${a1v}" }
              as: ProcessTechnician
            - call: "GET /optics/assemblies/${a1}/components"
              payload: { limit: 10, offset: 0 }
              as: ProcessTechnician
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
          assert:
            - "the work order on GL-2540-THIN returns HTTP 409 with error_id ERR_GLASS_GRADE_UNSUITABLE, although its effective grades H3/B satisfy the design"
            - "the cement on the empty assembly returns HTTP 409 with error_id ERR_ASSEMBLY_EMPTY and Assembly.${a1}.assembly_status stays KITTED"
            - "the work order on GL-2540-OK returns HTTP 201 in process_status BLANKS_RESERVED, so only the blank thickness had blocked the first one"
            - "the component drawn from that BLANKS_RESERVED order returns HTTP 409 with error_id ERR_COMPONENT_NOT_RELEASED"
            - "the assembly's component list is still empty and Assembly.${a1}.version is unchanged"
            - "GlassLot.${g1} still reads reserved_blank_count 0 and available_blank_count 20: the refused work order reserved nothing"

      - name: an_analysis_with_no_active_allocation_is_refused
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TOLERANCE_STACK_EMPTY
          - validations.priority_25
          - calculations.tolerance_stack_analysis
        distinguishing_aspect: |
          The remaining §1.4 priority-25 code: the empty-input-set refusal of the tolerance analysis, both
          on a design that never had an allocation and on one whose only allocation was retired.
        excluded_because:
          difficulty_instance: tolerance_analysis_on_empty_active_allocation_set_is_rejected
          rationale: |
            That §1.8 instance requests the analysis on a design with no ACTIVE allocation, retires the
            only allocation of a second design to reach the same state from the other direction, and
            asserts ERR_TOLERANCE_STACK_EMPTY (422) with design_status still DRAFT and all four stack
            outputs still null in both cases.

  # =======================================================================
  - section: rbac
    instances:

      - name: each_of_the_seven_roles_performs_its_own_exclusive_operations_end_to_end
        claim_type: exclusive_operations_permitted
        grounds:
          - roles.OpticsEngineer
          - roles.ProcurementOfficer
          - roles.ProcessTechnician
          - roles.MetrologyTechnician
          - roles.QualityManager
          - roles.ExportComplianceOfficer
          - roles.PlantAdmin
        distinguishing_aspect: |
          One optic is carried from design to released assembly with every single call issued by the role
          that §1.7 says owns it, and every call succeeds: the engineer designs and releases, procurement
          receives and certifies the melt, the plant admin registers the station and the chamber, the
          technician fabricates and kits, metrology records, the compliance officer classifies and
          licences, and the quality manager waives nothing but signs off the package and the release. No
          call in the chain is made by a role that merely shares the operation.
        test_recipe:
          setup:
            - "Empty database."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
            - "The design, the allocation, the analysis and the design release are OpticsEngineer-exclusive; the lot and its certification are ProcurementOfficer-exclusive; the instrument and the chamber are PlantAdmin-exclusive."
            - "The work order, the process run, its start and completion, the coating run, the deposit, the assembly, the component, the cement, the mount and the align are ProcessTechnician-exclusive; the metrology report is MetrologyTechnician-exclusive."
            - "The classification, the licence decision and the compliance screen are ExportComplianceOfficer-exclusive; the assembly release and the package review are QualityManager-exclusive."
            - "Distinct X-User-IDs are used wherever a segregation rule applies: the report is recorded by mt-001 and signed by mt-002, the package is submitted by qm-001 and reviewed by qm-002, the classification is created by eco-001 and decided by eco-002."
