            - { call: "POST /seafood/recalls/${recall_id}/notify", payload: {}, as: ComplianceManager, captures: { err: "$.data.error_id" } }
          assert:
            - "first notify: status == NOTIFIED, notified_at == current logical clock timestamp (2026-08-01T00:00:00Z default)"
            - "second notify: error_id == ERR_INVALID_STATE with http 409"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: evaluation_outcome_tier_boundary
        claim_type: threshold_boundary
        grounds: [entities.SupplierEvaluation.fields.overall_score, entities.SupplierEvaluation.fields.outcome]
        distinguishing_aspect: "The APPROVED/CONDITIONAL boundary is >= 70.00: overall 69.99 yields CONDITIONAL (supplier stays PENDING_EVALUATION), while exactly 70.00 yields APPROVED (supplier -> APPROVED)."
        test_recipe:
          setup: ["one supplier in PENDING_EVALUATION"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Boundary Foods", country_code: "PE", facility_registration_number: "FRN-CAL1" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
          trigger:
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 69.99, record_review_score: 69.99, performance_score: 69.99 }, as: ComplianceManager, captures: { ev1_overall: "$.data.overall_score", ev1_outcome: "$.data.outcome" } }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { st1: "$.data.fsvp_status", sup_v2: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v2}", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", hazard_analysis_score: 70, record_review_score: 70, performance_score: 70 }, as: ComplianceManager, captures: { ev2_overall: "$.data.overall_score", ev2_outcome: "$.data.outcome" } }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { st2: "$.data.fsvp_status" } }
          assert:
            - "first evaluation: overall_score == 69.99, outcome == CONDITIONAL, supplier stays PENDING_EVALUATION"
            - "second evaluation: overall_score == 70.00, outcome == APPROVED (>= boundary inclusive), supplier -> APPROVED"

      - name: abuse_minutes_240_boundary
        claim_type: threshold_boundary
        grounds: [calculations.temperature_abuse_exposure, entities.ReceiptLot.fields.cumulative_abuse_minutes]
        distinguishing_aspect: "Cumulative abuse uses >= 240: at 239 minutes no corrective action exists and the lot stays UNDER_INSPECTION; the 240th minute auto-creates a TEMPERATURE_ABUSE CA and quarantines the lot."
        test_recipe:
          setup: ["approved supplier; RELEASED entry; one TUNA lot in UNDER_INSPECTION"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Meridian Marine", country_code: "EC", facility_registration_number: "FRN-CAL2" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-CAL2", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 500000, freight_cost_cents: 20000, duty_rate_pct: 0.0, total_weight_kg: 80 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Meridiano", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO87", harvest_country_code: "EC", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 80, ice_deduction_pct: 0, receiving_temp_c: 5.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/temperature-logs", payload: { receipt_lot_id: "${lot_id}", interval_start: "2026-07-25T09:00:00Z", interval_end: "2026-07-25T11:00:00Z", core_temp_c: 5.0, avg_temp_c: 5.0, source: "CONTINUOUS_MONITOR" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/temperature-logs", payload: { receipt_lot_id: "${lot_id}", interval_start: "2026-07-25T11:00:00Z", interval_end: "2026-07-25T12:59:00Z", core_temp_c: 5.0, avg_temp_c: 5.0, source: "CONTINUOUS_MONITOR" }, as: QualityAssuranceTech }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: QualityAssuranceTech, captures: { ab1: "$.data.cumulative_abuse_minutes", st1: "$.data.status" } }
            - { call: "POST /seafood/temperature-logs", payload: { receipt_lot_id: "${lot_id}", interval_start: "2026-07-25T12:59:00Z", interval_end: "2026-07-25T13:00:00Z", core_temp_c: 5.0, avg_temp_c: 5.0, source: "MANUAL_PROBE" }, as: QualityAssuranceTech, as_user_id: "qa-09" }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: QualityAssuranceTech, captures: { ab2: "$.data.cumulative_abuse_minutes", st2: "$.data.status" } }
            - { call: "GET /seafood/corrective-actions?receipt_lot_id=${lot_id}", payload: {}, as: ComplianceManager, captures: { ca_id: "$.data[0].id", ca_src: "$.data[0].source_type", ca_opened: "$.data[0].opened_by" } }
            - { call: "POST /seafood/corrective-actions/${ca_id}/investigate", payload: {}, as: ComplianceManager, as_user_id: "cm-01" }
            - { call: "POST /seafood/corrective-actions/${ca_id}/resolve", payload: { resolution_note: "lot destroyed documentation" }, as: ComplianceManager, as_user_id: "cm-01" }
            - { call: "POST /seafood/receipt-lots/${lot_id}/quarantine-release", payload: {}, as: ComplianceManager, captures: { err: "$.data.error_id" } }
          assert:
            - "after 239 cumulative minutes (120 + 119): cumulative_abuse_minutes == 239, status == UNDER_INSPECTION, no CA exists"
            - "after the 240th minute: cumulative_abuse_minutes == 240, status == QUARANTINED"
            - "exactly one CA created with source_type == TEMPERATURE_ABUSE and opened_by == qa-09 (>= 240 boundary is over the limit)"
            - "even with the CA RESOLVED, quarantine-release still fails: error_id == ERR_TEMPERATURE_ABUSE_EXCEEDED with http 422 (abuse accumulation is permanent)"

      - name: confirmatory_requires_three_subsamples
        claim_type: constants_applied
        grounds: [calculations.histamine_verdict, "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "CONFIRMATORY histamine records enforce MIN_SUBSAMPLES == 3: two subsamples are rejected ERR_VALIDATION_FAILED (400) before any verdict is computed."
        test_recipe:
          setup: ["approved supplier; RELEASED entry; one TUNA lot in UNDER_INSPECTION"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Meridian Marine", country_code: "EC", facility_registration_number: "FRN-CAL3" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-CAL3", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 500000, freight_cost_cents: 20000, duty_rate_pct: 0.0, total_weight_kg: 80 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Meridiano", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO87", harvest_country_code: "EC", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 80, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot_id}", phase: "CONFIRMATORY", subsample_values: [45.0, 48.0], measured_at: "2026-07-25T10:00:00Z" }, as: QualityAssuranceTech, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION_FAILED with http 400"

      - name: allocation_remainder_tie_break
        claim_type: correct_result
        grounds: [calculations.entry_cost_allocation]
        excluded_because:
          difficulty_instance: "compensating_invariant / quarantine_release_conserves_allocated_cost"
          rationale: "The 1-cent remainder assigned to the earliest-created tied lot (A == 540001, B == 540000 over total 1080001) is asserted in the named Rule 9 instance; re-testing here would duplicate coverage."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is rejected ERR_UNAUTHENTICATED (401) at priority 1, before role, existence, or business checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "X", country_code: "US", facility_registration_number: "FRN-V01" }, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http 401"

      - name: prior_notice_deadline_boundary
        claim_type: temporal_validation
        grounds: ["validations[priority=17]", "errors[ERR_PRIOR_NOTICE_WINDOW_MISSED]"]
        distinguishing_aspect: "The prior-notice window is inclusive at the deadline (current_utc <= arrival - 8h for VESSEL): filing at exactly 2026-08-01T00:00:00Z against an 08:00 arrival succeeds; one minute later fails ERR_PRIOR_NOTICE_WINDOW_MISSED."
        test_recipe:
          setup: ["approved supplier; two DRAFT entries both arriving 2026-08-01T08:00:00Z by VESSEL (deadline 2026-08-01T00:00:00Z, the default clock)"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Boundary Foods", country_code: "PE", facility_registration_number: "FRN-V02" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-V02A", species_declared: "SHRIMP", transport_mode: "VESSEL", scheduled_arrival: "2026-08-01T08:00:00Z", port_code: "USMIA", goods_value_cents: 1000, freight_cost_cents: 0, duty_rate_pct: 0.0, total_weight_kg: 10 }, as: ImportCoordinator, captures: { ent_a: "$.data.id" } }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-V02B", species_declared: "SHRIMP", transport_mode: "VESSEL", scheduled_arrival: "2026-08-01T08:00:00Z", port_code: "USMIA", goods_value_cents: 1000, freight_cost_cents: 0, duty_rate_pct: 0.0, total_weight_kg: 10 }, as: ImportCoordinator, captures: { ent_b: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/import-entries/${ent_a}/file-prior-notice", payload: {}, as: ImportCoordinator, captures: { st_a: "$.data.status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:01:00Z" }, as: PlatformAdmin }
            - { call: "POST /seafood/import-entries/${ent_b}/file-prior-notice", payload: {}, as: ImportCoordinator, captures: { err_b: "$.data.error_id" } }
          assert:
            - "entry A filed at exactly the deadline: status == PRIOR_NOTICE_FILED (equality passes)"
            - "entry B filed one minute past the deadline: error_id == ERR_PRIOR_NOTICE_WINDOW_MISSED with http 422; status remains DRAFT"

      - name: quarantine_release_blocked_by_open_ca
        claim_type: cross_entity_validation
        grounds: ["validations[priority=16]", "errors[ERR_OPEN_CORRECTIVE_ACTIONS]"]
        distinguishing_aspect: "quarantine-release is referentially gated on the lot's corrective actions: while the mismatch CA is OPEN the release fails ERR_OPEN_CORRECTIVE_ACTIONS; after investigate+resolve by a different user, the same release succeeds."
        test_recipe:
          setup: ["approved supplier; RELEASED entry; TUNA lot quarantined by a species mismatch (CA OPEN, opened_by ri-01)"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Crimson Gulf Fisheries", country_code: "MX", facility_registration_number: "FRN-V03" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-V03", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 600000, freight_cost_cents: 25000, duty_rate_pct: 0.03, total_weight_kg: 90 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Golfo", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO77", harvest_country_code: "MX", production_method: "WILD", species_declared: "TUNA", grade: "B", quantity_received_kg: 90, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "DNA_BARCODING", sample_size: 5, verified_species: "ESCOLAR" }, as: ReceivingInspector, as_user_id: "ri-01", captures: { ver_id: "$.data.id" } }
            - { call: "GET /seafood/corrective-actions?receipt_lot_id=${lot_id}", payload: {}, as: ComplianceManager, captures: { ca_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /seafood/receipt-lots/${lot_id}/quarantine-release", payload: {}, as: ComplianceManager, captures: { err1: "$.data.error_id" } }
            - { call: "POST /seafood/corrective-actions/${ca_id}/investigate", payload: {}, as: ComplianceManager, as_user_id: "cm-02" }
            - { call: "POST /seafood/corrective-actions/${ca_id}/resolve", payload: { resolution_note: "lot relabeled to verified species" }, as: ComplianceManager, as_user_id: "cm-02" }
            - { call: "POST /seafood/species-verifications/${ver_id}/resolve", payload: { resolution: "RELABEL_AS_VERIFIED" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/receipt-lots/${lot_id}/quarantine-release", payload: {}, as: ComplianceManager, captures: { st2: "$.data.status" } }
          assert:
            - "first release attempt: error_id == ERR_OPEN_CORRECTIVE_ACTIONS with http 422"
            - "after CA resolved and verification resolved: release succeeds, lot status == ACCEPTED"

      - name: release_blocked_by_stale_label_then_relabeled
        claim_type: cross_entity_validation
        grounds: ["validations[priority=15]", entities.FinishedProductLot.fields.label_version_pinned, entities.FinishedProductLot.fields.label_stale]
        distinguishing_aspect: "Version pinning on approval: apply-label pins the label's version; approving a superseding label flips label_stale to true and release fails ERR_LABEL_STALE; re-applying the new APPROVED label re-pins and clears staleness, and release then succeeds."
        test_recipe:
          setup: ["COD batch RECONCILED (zero variance); finished lot LABELED with label L1 (pinned version 2 after its approve); second label L2 approved with supersedes_label_id = L1"]
          setup_api_calls:
