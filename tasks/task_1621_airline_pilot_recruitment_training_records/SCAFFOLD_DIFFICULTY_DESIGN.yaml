            - "30-minute-gap booking succeeded: TrainingEvent.${ev_s2}.status == SCHEDULED (boundary: gap >= 30 minutes is allowed)"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: confirm_withdraw_pair_conserves_class_seat_counters
        grounds:
          - state_machines.Enrollment.TENTATIVE_to_CONFIRMED
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
          - entities.TrainingClass.fields.confirmed_count
        distinguishing_aspect: |
          Conserved quantity: seat counters. Invariant — for any TrainingClass,
          confirmed_count == count of enrollments with status IN {CONFIRMED,
          IN_PROGRESS, REMEDIATION, COMPLETED} and active_enrollment_count ==
          count IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION}; a
          confirm-then-withdraw pair on the same enrollment returns BOTH
          counters to their exact pre-pair values.
        test_recipe:
          setup:
            - "OPEN class with one baseline CONFIRMED enrollment (confirmed_count 1, active 1); a second cleared applicant enrolled TENTATIVE"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "A343", name: "Airbus A340-300", simulator_cost_per_hour_cents: 45000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Kat Lee", email: "kat@x.com", license_number: "L340", total_flight_hours: 2200 }, as: Recruiter, captures: { ap1: $.data.id } }
