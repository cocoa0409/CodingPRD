            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 8000, reason_code: DELIVERY, message: "g", idempotency_key: "ce3-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
