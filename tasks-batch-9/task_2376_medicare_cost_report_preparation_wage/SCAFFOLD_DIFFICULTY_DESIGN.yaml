  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cost_report_status_and_wage_data_status_evolve_independently
        grounds:
          - state_machines.CostReport.DRAFT_to_FILED
          - state_machines.WageIndexSubmission.ACCEPTED_to_UNDER_REVIEW
          - state_machines.WageIndexSubmission.UNDER_REVIEW_to_CHANGE_REQUESTED
          - entities.CostReport.fields.status
          - entities.CostReport.fields.wage_data_status
        distinguishing_aspect: |
          Non-linearity here is PARALLEL DIMENSIONS on the CostReport row: a desk review that walks
          wage_data_status VERIFIED -> UNDER_REVIEW -> REVISION_REQUESTED -> COLLECTED leaves
          status == FILED and filed_at untouched, so the two dimensions on one entity advance
          independently and the combination (FILED, REVISION_REQUESTED) is reachable.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a FILED CostReport (status FILED, filed_at 2026-08-01T00:00:00Z, wage_data_status VERIFIED, allocation_status CURRENT)"
            - "its WageIndexSubmission is ACCEPTED with revision_number 0 and three staffed occupational-mix categories"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
