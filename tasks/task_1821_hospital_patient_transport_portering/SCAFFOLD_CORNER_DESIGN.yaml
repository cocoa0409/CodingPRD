          trigger:
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE, http 403 (offer.transporter_id != X-User-ID)"

      - name: segregation_of_duty_verify_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTY]"]
        distinguishing_aspect: "The same operator id that finished a task cannot verify it even when acting with the TransportSupervisor role; a different supervisor id succeeds."
        test_recipe:
          setup: ["STANDARD task finished by user hk-1 (AWAITING_VERIFICATION, performed_by == hk-1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/cleaning-tasks", payload: { equipment_asset_id: "${a1}" }, as: HousekeepingStaff, as_user_id: "hk-1", captures: { ct: "$.data[0].id" } }
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "IN_PROGRESS" }, as: HousekeepingStaff, as_user_id: "hk-1" }
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "AWAITING_VERIFICATION" }, as: HousekeepingStaff, as_user_id: "hk-1" }
          trigger:
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "VERIFIED" }, as: TransportSupervisor, as_user_id: "hk-1", captures: { err: $.data.error_id } }
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "VERIFIED" }, as: TransportSupervisor, as_user_id: "sup-9", captures: { st: $.data.status, vb: $.data.verified_by } }
          assert:
            - "verify by hk-1 (the finisher): error_id == ERR_SEGREGATION_OF_DUTY, http 403"
            - "verify by sup-9: status == VERIFIED (${st}) and verified_by == sup-9 (${vb})"

      - name: clinician_cancel_foreign_request_returns_403
        claim_type: rbac_denial
        grounds: [roles.RequestingClinician, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A clinician may cancel only requests whose requested_by matches their X-User-ID; clin-2 cancelling clin-1's request is refused."
        test_recipe:
          setup: ["R1 QUEUED created by clin-1"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /transport/requests/${r1}/close", payload: { action: "CANCEL", reason: "NOT_MINE_TEST" }, as: RequestingClinician, as_user_id: "clin-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE, http 403"

  # ==================================================================
  # Section: cross_cutting_layers
  # ==================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[offer-create-stale-request]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential offer creations: the first (expected version 1) succeeds and bumps the request to version 2; the second, still carrying expected version 1, is rejected ERR_STALE_VERSION 412 — no simultaneity involved."
        test_recipe:
          setup: ["T1 ON_SHIFT; R1 QUEUED WHEELCHAIR; asset WC-001 AVAILABLE; captured request version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r_v: $.data.version } }
          trigger:
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r_v}" }, as: TransportDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "first offer ${o1} created (201)"
            - "second offer with the same observed version: error_id == ERR_STALE_VERSION, http 412"

      - name: occ_fresh_version_supersedes_pending_offer
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[offer-create-stale-request]", state_machines.DispatchOffer.PENDING_to_SUPERSEDED]
        distinguishing_aspect: "A fresh expected version succeeds and supersedes the prior PENDING offer, which releases and re-reserves the single asset to the new offer with offer_seq 2."
        test_recipe:
          setup: ["Same site as occ_stale_version_returns_412; offer O1 created at request version 1 (now version 2)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:01:00Z" }, as: TransportSupervisor }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { r_v2: $.data.version } }
          trigger:
            - { call: "POST /transport/requests/${r1}/offers", payload: { expected_request_version: "${r_v2}" }, as: TransportDispatcher, captures: { o2: $.data.id, o2_seq: $.data.offer_seq } }
            - { call: "GET /transport/requests/${r1}/offers", as: TransportDispatcher, captures: { o1_st: "$.data[0].status", o2_st: "$.data[1].status" } }
            - { call: "GET /transport/equipment-assets/${a1}", as: TransportDispatcher, captures: { a_st: $.data.status } }
          assert:
            - "second offer created with offer_seq == 2 (${o2_seq}); transporter auto-selected to ${t1} (only eligible) when transporter_id omitted"
            - "O1 status == SUPERSEDED (${o1_st}); O2 status == PENDING (${o2_st})"
            - "asset WC-001 status == RESERVED (${a_st}) — released by supersession, re-reserved by the new offer"

