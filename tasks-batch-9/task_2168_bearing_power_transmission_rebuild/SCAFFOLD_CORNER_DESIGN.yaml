        distinguishing_aspect: "Re-using an account_code, a model_code, a bench_code or an asset_tag within one customer returns ERR_DUPLICATE_KEY (409), while re-using a serial_no within one customer returns the more specific ERR_DUPLICATE_SERIAL (409); the same serial under a different customer is accepted."
        test_recipe:
          setup:
            - "Two customers, one standard, one bench, one asset and one core with serial SN-DUP-1 under the first customer."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Dup Mill", account_code: "DUP-001" }
