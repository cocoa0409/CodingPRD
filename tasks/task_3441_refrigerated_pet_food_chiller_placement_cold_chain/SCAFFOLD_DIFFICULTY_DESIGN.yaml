      - name: trial_calendar_closed_interval_with_gap
        grounds:
          - state_machines.TrialCampaign
          - errors[ERR_TRIAL_WINDOW_OVERLAP]
          - errors[ERR_TRIAL_GAP_VIOLATION]
        distinguishing_aspect: |
          Interval semantics: CLOSED date intervals on the STORE's trial
          calendar PLUS a mandatory 14-day clear gap — sharing an end/start
          date IS an overlap (unlike the half-open service calendar), and even
          disjoint windows fail when the gap is under 14 days (exactly 14
          allowed). Different resource and different interval semantics than
          the chiller-calendar sibling.
