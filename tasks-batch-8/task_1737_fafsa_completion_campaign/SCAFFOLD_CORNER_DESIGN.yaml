          assert:
            - "Created with assigned_specialist_id == null (empty pool fallback, not an error)"
            - "Accept while unassigned: error_id == ERR_CASE_UNASSIGNED (HTTP 409)"
            - "After manual assign: accept succeeds, status == IN_REVIEW"

  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A call with no X-User-Role/X-User-ID headers is rejected 400 at priority 1 before any resource lookup."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fafsa/campaigns", as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400)"

      - name: existence_beats_state_on_nested_action
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_SCHOOL_NOT_FOUND]
        distinguishing_aspect: "Pair (existence, state): enrolling a nonexistent school while the campaign is still DRAFT returns the 404, proving existence (p4) is evaluated before the campaign-OPEN state gate (p5). Distinct pair from the three §1.8 priority conflicts."
        test_recipe:
          setup: ["Campaign exists but still DRAFT (enroll would fail ERR_CAMPAIGN_NOT_OPEN if the school existed)"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
          trigger:
            - { call: "POST /fafsa/schools/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/enroll", as: CampaignAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SCHOOL_NOT_FOUND (HTTP 404), NOT ERR_CAMPAIGN_NOT_OPEN"

      - name: uniqueness_constraints_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_STUDENT_REF]
          - errors[ERR_DUPLICATE_EXTERNAL_REF]
          - errors[ERR_CONSENT_ALREADY_ACTIVE]
          - errors[ERR_CASE_ALREADY_OPEN]
          - errors[ERR_DUPLICATE_ASSIGNMENT]
        distinguishing_aspect: "Five distinct uniqueness invariants each return their own 409: student_ref per school, external_ref per campaign, one GRANTED consent per senior, one non-terminal case per (senior, case_type), one non-terminal assignment per (event, staff)."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; senior S1 with GRANTED consent; specialist; event DRAFT; staff with one INVITED assignment"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["STATUS_DETAIL"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/staff-profiles", as: CampaignAdmin, payload: { campaign_id: "${camp}", full_name: "Spec Sal", capabilities: ["CASE_SPECIALIST", "EVENT_STAFF"], languages: ["en"] }, captures: { spec: $.data.id } }
            - { call: "POST /fafsa/support-cases", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", case_type: "SPECIAL_CIRCUMSTANCE" }, captures: { cs: $.data.id } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC01", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
            - { call: "POST /fafsa/staff-assignments", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", staff_profile_id: "${spec}", assigned_role: "VOLUNTEER" } }
          trigger:
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Other Name", dob: "2009-09-09", home_language: "es" }, captures: { e1: $.data.error_id } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Other", dob: "2000-01-01", school_code: "SC02", district_code: "D02", initial_status: "STARTED", effective_date: "2027-01-11" }, captures: { e2: $.data.error_id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["OUTREACH"], granted_by: "ADULT_STUDENT" }, captures: { e3: $.data.error_id } }
            - { call: "POST /fafsa/support-cases", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", case_type: "SPECIAL_CIRCUMSTANCE" }, captures: { e4: $.data.error_id } }
            - { call: "POST /fafsa/staff-assignments", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", staff_profile_id: "${spec}", assigned_role: "VOLUNTEER" }, captures: { e5: $.data.error_id } }
          assert:
            - "e1 == ERR_DUPLICATE_STUDENT_REF; e2 == ERR_DUPLICATE_EXTERNAL_REF; e3 == ERR_CONSENT_ALREADY_ACTIVE; e4 == ERR_CASE_ALREADY_OPEN; e5 == ERR_DUPLICATE_ASSIGNMENT (all HTTP 409)"

      - name: registration_requires_outreach_consent
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_CONSENT_REQUIRED]
        distinguishing_aspect: "The consent safety gate fires at priority 6 for a well-formed, in-state request: PUBLISHED event, enrolled school, capacity free — but no GRANTED OUTREACH consent for the senior."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; PUBLISHED event capacity 10; senior WITHOUT any consent"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
            - { call: "POST /fafsa/events/${ev}/publish", as: SchoolCoordinator, as_user_id: "${sch}" }
          trigger:
            - { call: "POST /fafsa/event-registrations", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", senior_record_id: "${sr}" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONSENT_REQUIRED (HTTP 403); no registration persisted"

      - name: second_link_for_same_senior_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LINK_ALREADY_EXISTS]
        distinguishing_aspect: "With a non-terminal (SUGGESTED) link present and a FRESH OCC version, the dedupe constraint — not the OCC check — rejects the second link."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; senior with one SUGGESTED link (score 0.85)"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id, sr_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "E1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC99", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { ar1: $.data.id } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "E2", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC98", district_code: "D01", initial_status: "STARTED", effective_date: "2027-01-11" }, captures: { ar2: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar1}", expected_senior_record_version: "${sr_v}" } }
            - { call: "GET /fafsa/senior-records/${sr}", as: MatchReviewer, captures: { sr_v2: $.data.version } }
          trigger:
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar2}", expected_senior_record_version: "${sr_v2}" }, captures: { err: $.data.error_id } }
          assert:
