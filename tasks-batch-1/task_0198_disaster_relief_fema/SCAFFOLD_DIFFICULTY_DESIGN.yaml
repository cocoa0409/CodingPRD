# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Disaster Relief & FEMA Case Management — Expert
# Nine §0.5 rules x >= 2 instances each. All asserts are precomputed integer-cent
# literals. All ${var} placeholders trace to a captures: on an earlier line.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_award_diverges
        grounds:
          - calculations.eligible_award_amount
          - state_machines.IhpCase.DRAFT_to_ELIGIBILITY_PENDING
          - state_machines.IhpCase.ELIGIBILITY_PENDING_to_AWARD_APPROVED
          - entities.IhpCase.fields.gross_eligible_cents
        distinguishing_aspect: |
          Same household, two valid runs of eligible_award_amount on the IhpCase
          domain: provisional uses Applicant.reported_* (gross 3,900,000) at case
          create; final uses DamageAssessment.verified_* (gross 2,600,000) at
          approve. The two variants produce different gross_eligible_cents.
        test_recipe:
          setup:
            - "Declaration DR-A OPEN, incident period 2026-01-01..2026-02-28, ihp_max_grant_cents 4,250,000, registration_deadline 2026-03-31."
            - "Applicant reported repair 2,000,000 / personal 1,000,000 / rental 6 months; damage_date 2026-01-15."
            - "Assessment INSPECTED+VERIFIED with verified repair 1,200,000 / personal 800,000 / rental 4 months, UNINHABITABLE."
            - "IhpCase created with monthly_fmr_cents 150,000 (provisional computed), not yet approved."
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-A Storms", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/inspectors"
              payload: { full_name: "Ina Spector", badge_number: "INS-A1" }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /disaster-relief/caseworkers"
              payload: { full_name: "Carl Case", employee_id: "CW-A1" }
              as: ProgramAdmin
              captures: { cw1_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Alpha Household", household_size: 3, annual_income_cents: 4000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 2000000, reported_personal_property_cents: 1000000, reported_rental_months: 6 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/assessments"
              payload: { applicant_id: "${app_id}", inspector_id: "${insp_id}", scheduled_start: "2026-02-02T09:00:00Z", scheduled_end: "2026-02-02T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /disaster-relief/assessments/${asm_id}/inspect"
              payload: { habitability: "UNINHABITABLE", verified_repair_cost_cents: 1200000, verified_personal_property_cents: 800000, verified_rental_months: 4 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /disaster-relief/assessments/${asm_id}/verify"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
            - call: "POST /disaster-relief/ihp-cases"
              payload: { applicant_id: "${app_id}", assessment_id: "${asm_id}", monthly_fmr_cents: 150000 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { case_id: $.data.id, prov_gross: $.data.gross_eligible_cents }
          trigger:
            - call: "POST /disaster-relief/ihp-cases/${case_id}/approve"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { final_gross: $.data.gross_eligible_cents }
          assert:
            - "IhpCase.${case_id}.gross_eligible_cents captured at create (prov_gross) == 3900000"
            - "IhpCase.${case_id}.gross_eligible_cents after approve (final_gross) == 2600000"
            - "IhpCase.${case_id}.total_approved_cents == 2600000"
            - "IhpCase.${case_id}.net_eligible_cents == 2600000"

      - name: dob_offset_at_award_vs_at_recoupment_diverges
        grounds:
          - calculations.duplication_of_benefits_offset
          - entities.Applicant.fields.total_dob_cents
          - entities.IhpCase.fields.dob_offset_cents
          - state_machines.DobRecord.RECORDED_to_REVERSED
        distinguishing_aspect: |
          duplication_of_benefits_offset runs on the Applicant/DobRecord benefit
          domain (NOT the IhpCase award domain of the prior instance). at_award
          counts only DOB with received_at <= approved_at (offset 400,000); a
          LATE DOB (received_at after approve) raises the at_recoupment offset to
          1,000,000 — the same case yields two different dob_offset_cents.
        test_recipe:
          setup:
            - "Declaration DR-C OPEN, incident 2026-01-01..2026-02-28, ihp_max 4,250,000."
            - "Applicant inspected UNINHABITABLE verified repair 1,000,000 / personal 500,000 / rental 3 mo; FMR 100,000; gross 1,800,000."
            - "An INSURANCE DobRecord 400,000 received 2026-02-05 exists BEFORE approve; case approved 2026-03-01 -> at_award offset 400,000, net 1,400,000."
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-C Floods", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/inspectors"
              payload: { full_name: "Ivy Insp", badge_number: "INS-C1" }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /disaster-relief/caseworkers"
              payload: { full_name: "Cara Work", employee_id: "CW-C1" }
              as: ProgramAdmin
              captures: { cw1_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Gamma Household", household_size: 2, annual_income_cents: 3000000, damage_date: "2026-01-20T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/assessments"
              payload: { applicant_id: "${app_id}", inspector_id: "${insp_id}", scheduled_start: "2026-02-06T09:00:00Z", scheduled_end: "2026-02-06T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /disaster-relief/assessments/${asm_id}/inspect"
              payload: { habitability: "UNINHABITABLE", verified_repair_cost_cents: 1000000, verified_personal_property_cents: 500000, verified_rental_months: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /disaster-relief/assessments/${asm_id}/verify"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
            - call: "POST /disaster-relief/dob-records"
              payload: { applicant_id: "${app_id}", source_type: "INSURANCE", amount_cents: 400000, received_at: "2026-02-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { dob_ins_id: $.data.id }
            - call: "POST /disaster-relief/ihp-cases"
              payload: { applicant_id: "${app_id}", assessment_id: "${asm_id}", monthly_fmr_cents: 100000 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/ihp-cases/${case_id}/approve"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { award_offset: $.data.dob_offset_cents, award_net: $.data.net_eligible_cents }
          trigger:
            - call: "POST /disaster-relief/dob-records"
              payload: { applicant_id: "${app_id}", source_type: "OTHER_FEDERAL", amount_cents: 600000, received_at: "2026-04-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { dob_late_id: $.data.id }
            - call: "GET /disaster-relief/ihp-cases/${case_id}"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { recoup_offset: $.data.dob_offset_cents, recoup_net: $.data.net_eligible_cents }
          assert:
            - "IhpCase.${case_id}.dob_offset_cents at approve (award_offset) == 400000"
            - "IhpCase.${case_id}.net_eligible_cents at approve (award_net) == 1400000"
            - "IhpCase.${case_id}.dob_offset_cents after LATE DOB (recoup_offset) == 1000000"
            - "IhpCase.${case_id}.net_eligible_cents after LATE DOB (recoup_net) == 800000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: award_formula_multi_input_nonlinear_mode_a
        grounds:
          - calculations.eligible_award_amount
          - entities.DamageAssessment.fields.habitability
          - state_machines.IhpCase.ELIGIBILITY_PENDING_to_AWARD_APPROVED
        distinguishing_aspect: |
          MODE (a): eligible_award_amount combines >=3 inputs (repair, personal,
          rental_months x FMR) with nested min() caps AND a conditional branch on
          habitability (HABITABLE zeroes rental+replacement; UNINHABITABLE enables
          them). Non-linear interaction across inputs, not a flat sum.
        test_recipe:
          setup:
            - "Declaration DR-B2 OPEN, ihp_max 4,250,000, incident 2026-01-01..2026-02-28."
            - "Applicant inspected HABITABLE, verified repair 700,000 / personal 300,000 / rental 5 mo (rental ignored because HABITABLE); FMR 150,000."
            - "IhpCase created, not yet approved."
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-B2", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/inspectors"
              payload: { full_name: "Ike Insp", badge_number: "INS-B2" }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /disaster-relief/caseworkers"
              payload: { full_name: "Cleo Work", employee_id: "CW-B2" }
              as: ProgramAdmin
              captures: { cw1_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Beta Household", household_size: 1, annual_income_cents: 2000000, damage_date: "2026-01-12T00:00:00Z", reported_repair_cost_cents: 700000, reported_personal_property_cents: 300000, reported_rental_months: 5 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/assessments"
              payload: { applicant_id: "${app_id}", inspector_id: "${insp_id}", scheduled_start: "2026-02-11T09:00:00Z", scheduled_end: "2026-02-11T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /disaster-relief/assessments/${asm_id}/inspect"
              payload: { habitability: "HABITABLE", verified_repair_cost_cents: 700000, verified_personal_property_cents: 300000, verified_rental_months: 5 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /disaster-relief/assessments/${asm_id}/verify"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
            - call: "POST /disaster-relief/ihp-cases"
              payload: { applicant_id: "${app_id}", assessment_id: "${asm_id}", monthly_fmr_cents: 150000 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/ihp-cases/${case_id}/approve"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { gross: $.data.gross_eligible_cents, net: $.data.net_eligible_cents }
          assert:
            - "IhpCase.${case_id}.gross_eligible_cents (gross) == 1000000 (700000 repair + 300000 personal; rental and replacement zeroed by HABITABLE branch)"
            - "IhpCase.${case_id}.net_eligible_cents (net) == 1000000"
            - "AwardLineItem RENTAL_ASSISTANCE for ${case_id} has approved_amount_cents == 0"

      - name: cap_waterfall_floor_then_remainder_mode_b
        grounds:
          - calculations.max_grant_cap_waterfall
          - entities.AwardLineItem.fields.approved_amount_cents
          - state_machines.IhpCase.ELIGIBILITY_PENDING_to_AWARD_APPROVED
        distinguishing_aspect: |
          MODE (b): max_grant_cap_waterfall pins rounding ORDER — floor() each line
          during cap proration FIRST, then assign the lost remainder pennies to the
          LAST non-zero line in CATEGORY_ORDER, THEN subtract DOB. gross 14,783,331
          prorated to cap 4,250,000 floors to 670,799 / 1,193,066 / 1,193,066 /
          1,193,066 (sum 4,249,997); remainder 3 goes to REPLACEMENT -> 1,193,069.
        test_recipe:
          setup:
            - "Declaration DR-CAP OPEN, ihp_max 4,250,000."
            - "Applicant inspected UNINHABITABLE verified repair 5,000,000 (>cap, enables REPLACEMENT) / personal 4,150,000 / rental 7 mo; FMR 333,333; gross 14,783,331 > cap."
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-12T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-CAP", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/inspectors"
              payload: { full_name: "Iris Insp", badge_number: "INS-CAP" }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /disaster-relief/caseworkers"
              payload: { full_name: "Cyrus Work", employee_id: "CW-CAP" }
              as: ProgramAdmin
              captures: { cw1_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Cap Household", household_size: 5, annual_income_cents: 5000000, damage_date: "2026-01-22T00:00:00Z", reported_repair_cost_cents: 5000000, reported_personal_property_cents: 4150000, reported_rental_months: 7 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/assessments"
              payload: { applicant_id: "${app_id}", inspector_id: "${insp_id}", scheduled_start: "2026-02-13T09:00:00Z", scheduled_end: "2026-02-13T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /disaster-relief/assessments/${asm_id}/inspect"
              payload: { habitability: "UNINHABITABLE", verified_repair_cost_cents: 5000000, verified_personal_property_cents: 4150000, verified_rental_months: 7 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /disaster-relief/assessments/${asm_id}/verify"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
            - call: "POST /disaster-relief/ihp-cases"
              payload: { applicant_id: "${app_id}", assessment_id: "${asm_id}", monthly_fmr_cents: 333333 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/ihp-cases/${case_id}/approve"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { net: $.data.net_eligible_cents, capped: $.data.capped_eligible_cents }
            - call: "GET /disaster-relief/award-line-items?ihp_case_id=${case_id}&category=REPLACEMENT"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { repl_approved: "$.data[0].approved_amount_cents" }
          assert:
            - "IhpCase.${case_id}.capped_eligible_cents (capped) == 4250000"
            - "IhpCase.${case_id}.total_approved_cents == 4250000"
            - "AwardLineItem RENTAL_ASSISTANCE approved_amount_cents == 670799"
            - "AwardLineItem REPAIR_ASSISTANCE approved_amount_cents == 1193066"
            - "AwardLineItem PERSONAL_PROPERTY approved_amount_cents == 1193066"
            - "AwardLineItem REPLACEMENT approved_amount_cents (repl_approved) == 1193069 (1193066 + 3 remainder pennies)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ihp_case_appeal_cycle_back_to_award_approved
        grounds:
          - state_machines.IhpCase.AWARD_APPROVED_to_UNDER_APPEAL
          - state_machines.IhpCase.UNDER_APPEAL_to_AWARD_APPROVED
          - entities.IhpCase.fields.status
        distinguishing_aspect: |
          CYCLE on IhpCase: AWARD_APPROVED -> UNDER_APPEAL -> AWARD_APPROVED. The
          case re-enters AWARD_APPROVED after an appeal is GRANTED, a non-linear
          loop (not a forward-only pipeline) — verified by status returning to
          AWARD_APPROVED with a higher version.
        test_recipe:
          setup:
            - "Approved IhpCase (DR-D, init total_approved 1,540,000), determined by caseworker cw1; a second caseworker cw2 exists for the SoD-compliant appeal decision."
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-D", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/inspectors"
              payload: { full_name: "Igor Insp", badge_number: "INS-D" }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /disaster-relief/caseworkers"
              payload: { full_name: "Cw One D", employee_id: "CW-D1" }
              as: ProgramAdmin
              captures: { cw1_id: $.data.id }
            - call: "POST /disaster-relief/caseworkers"
              payload: { full_name: "Cw Two D", employee_id: "CW-D2" }
              as: ProgramAdmin
              captures: { cw2_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Delta Household", household_size: 4, annual_income_cents: 3500000, damage_date: "2026-01-18T00:00:00Z", reported_repair_cost_cents: 900000, reported_personal_property_cents: 400000, reported_rental_months: 2 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/assessments"
              payload: { applicant_id: "${app_id}", inspector_id: "${insp_id}", scheduled_start: "2026-02-15T09:00:00Z", scheduled_end: "2026-02-15T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /disaster-relief/assessments/${asm_id}/inspect"
              payload: { habitability: "UNINHABITABLE", verified_repair_cost_cents: 900000, verified_personal_property_cents: 400000, verified_rental_months: 2 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /disaster-relief/assessments/${asm_id}/verify"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
            - call: "POST /disaster-relief/ihp-cases"
              payload: { applicant_id: "${app_id}", assessment_id: "${asm_id}", monthly_fmr_cents: 120000 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /disaster-relief/ihp-cases/${case_id}/approve"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { case_v: $.data.version }
            - call: "POST /disaster-relief/appeals"
              payload: { ihp_case_id: "${case_id}", expected_ihp_case_version: "${case_v}", reason: "verified repair underestimated", requested_repair_cost_cents: 1500000 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/appeals/${appeal_id}/decide"
              payload: { outcome: "GRANTED" }
              as: Caseworker
              as_user_id: "${cw2_id}"
              captures: { case_status_after: $.data.status }
            - call: "GET /disaster-relief/ihp-cases/${case_id}"
              payload: {}
              as: Caseworker
              as_user_id: "${cw2_id}"
              captures: { final_status: $.data.status, final_total: $.data.total_approved_cents }
          assert:
            - "IhpCase.${case_id}.status (final_status) == AWARD_APPROVED after appeal GRANTED (cycle closed)"
            - "IhpCase.${case_id}.total_approved_cents (final_total) == 2140000 (raised from 1540000 by appeal override repair 1500000)"

      - name: sba_referral_branching_divergent_side_effects
        grounds:
          - state_machines.SbaReferral.REFERRED_to_SBA_APPROVED
          - state_machines.SbaReferral.REFERRED_to_SBA_DECLINED
          - entities.SbaReferral.fields.status
        distinguishing_aspect: |
          BRANCHING on SbaReferral (a DIFFERENT entity from the IhpCase cycle):
          REFERRED forks to SBA_APPROVED (creates an SBA_LOAN DobRecord, cascades
          into the award) vs SBA_DECLINED (no DobRecord, no cascade). Divergent
          side-effect sets per branch.
        test_recipe:
          setup:
            - "Approved case with an open SBA referral (income above ceiling but loss above threshold qualifies); referral will be APPROVED with loan 600,000 creating an SBA_LOAN DobRecord."
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-16T00:00:00Z" }
