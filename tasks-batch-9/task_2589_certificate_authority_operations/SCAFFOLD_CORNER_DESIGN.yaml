            - "the second trigger returns HTTP 422 and ${err_crl_window} == ERR_INVALID_CRL_WINDOW"
            - "the third trigger returns HTTP 422 and ${err_crl_too_long} == ERR_CRL_VALIDITY_TOO_LONG (25 hours exceeds max_crl_validity_hours 24)"
            - "after the two rejected publications CertificateProfile.${profile_id}.last_crl_number == 0 and its version still equals ${profile_version}, so the fourth call's OCC token is still current"
            - "the fourth trigger returns HTTP 201 with ${crl_number} == 1 and ${crl_entries} == 0 (24 hours is exactly at the ceiling and accepted), and CertificateProfile.${profile_id}.last_crl_next_update == 2026-08-02T00:00:00Z"

      - name: a_cascade_raised_revocation_request_can_never_be_denied
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CASCADE_REVOCATION_NOT_DENIABLE]
          - validations[priority=81]
          - state_machines.KeyCeremony.transitions.ATTESTED_to_ATTESTATION_REVOKED
        distinguishing_aspect: "The deny endpoint discriminates on origin, not on state: the cascade-raised request is in the same REQUESTED state as a manual one (so the priority 44 check passes) yet is refused with ERR_CASCADE_REVOCATION_NOT_DENIABLE, leaving the certificate pinned in REVOCATION_PENDING with the subscriber's revocation_pending_count untouched."
        test_recipe:
          setup:
            - "Chain A up to one PREISSUANCE certificate, then the ceremony's attestation is repudiated so the four-hop cascade raises a SYSTEM_CASCADE revocation request against it."
          setup_api_calls:
