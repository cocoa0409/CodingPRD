  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_certification_version_blocks_the_repricing_and_bumps_nothing
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tuition-report-supersede-stale-certification]
          - errors.ERR_STALE_CERTIFICATION_VERSION
          - validations[priority=10]
          - endpoints[POST /tuition-fee-reports]
          - entities.EnrollmentCertification.fields.net_covered_cents
          - state_machines.TuitionFeeReport.REPORTED_to_SUPERSEDED
        distinguishing_aspect: "Accepting the first tuition report advances the certification's version, so replaying the version observed at creation is refused with 412 ERR_STALE_CERTIFICATION_VERSION: no second report row is written, the certification keeps net_covered_cents 2950000 and its version does not move again, and only after re-reading the current version does the revision land, superseding the first report and rewriting net_covered_cents to 3150000."
