        grounds: ["validations[priority=10]", "errors[ERR_FAMILY_LIMIT_REACHED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / consent_vs_family_limit_on_reservation"
          rationale: "The family-limit-reached reservation refusal is exercised as the lower-priority side of that §1.8 priority-conflict instance (with consent present it becomes the winning error)."

