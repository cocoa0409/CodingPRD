    description: "Uphold a flag; applies score_delta and recomputes fraud_status"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FraudFlag
    side_effects: ["Customer.fraud_score += score_delta; fraud_status recomputed"]

  - method: POST
    path: "/opaque/fraud-flags/{flagId}/dismiss"
    description: "Dismiss a flag; reverses score_delta"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FraudFlag
    side_effects: ["Customer.fraud_score = max(0, fraud_score - score_delta); fraud_status recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "supplier id does not exist" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "property id does not exist" }
  - { id: ERR_RATE_WINDOW_NOT_FOUND, http: 404, condition: "rate window id does not exist" }
  - { id: ERR_DISCLOSURE_ZONE_NOT_FOUND, http: 404, condition: "disclosure zone id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id does not exist" }
  - { id: ERR_OPAQUE_BID_NOT_FOUND, http: 404, condition: "opaque bid id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking id does not exist" }
  - { id: ERR_COMPLAINT_CASE_NOT_FOUND, http: 404, condition: "complaint case id does not exist" }
  - { id: ERR_SETTLEMENT_BATCH_NOT_FOUND, http: 404, condition: "settlement batch id does not exist" }
  - { id: ERR_FRAUD_FLAG_NOT_FOUND, http: 404, condition: "fraud flag id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is not in a state that permits this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, type mismatch, enum violation, or mode-semantics violation (BID without bid_price_cents, amenity filter not in zone's revealed set)" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "check_out_date not strictly after check_in_date, or check_in_date in the past" }
  - { id: ERR_DISCLOSURE_BOUNDARY_VIOLATION, http: 422, condition: "Request would narrow disclosure below the zone's declared granularity, threatening rate parity" }
  - { id: ERR_CUSTOMER_BLOCKED, http: 403, condition: "Customer.fraud_status == BLOCKED at bid creation or evaluation" }
  - { id: ERR_DUPLICATE_COMPLAINT, http: 409, condition: "An OPEN or UNDER_REVIEW ComplaintCase already exists for this booking" }
  - { id: ERR_BID_BELOW_FLOOR, http: 422, condition: "BID-mode evaluation with fail_on_reject=true where bid_price_cents < computed_price_cents or concealment_discount_pct < supplier minimum" }
  - { id: ERR_INVALID_GOODWILL_AMOUNT, http: 422, condition: "goodwill_credit_cents not in (0, charged_price_cents) exclusive" }
  - { id: ERR_SUPPLIER_HAS_OPEN_BATCH, http: 409, condition: "Supplier termination blocked by a DRAFT or APPROVED SettlementBatch" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_BATCH_EMPTY, http: 422, condition: "SettlementBatch approval requires a non-empty booking_ids" }

