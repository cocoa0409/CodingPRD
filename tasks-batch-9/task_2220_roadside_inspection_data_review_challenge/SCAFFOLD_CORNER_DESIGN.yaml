            - "after trigger[1]: CitationAdjudication.${adj1_id}.record_update_status == NOT_APPLIED"
            - "after trigger[1]: CitationAdjudication.${adj1_id}.severity_factor == 1.0 and superseded == false"
            - "after trigger[1]: Violation.${v1_id}.version == ${v1_v_fresh} + 1"
            - "after trigger[1]: Violation.${v1_id}.time_weighted_severity == 15.0 (opening a citation does not change the pin)"

      - name: version_increments_by_one_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - entities.Carrier
          - entities.InspectionReport
        distinguishing_aspect: |
          Every entity with common_fields starts at version 1 and advances by exactly one per accepted
          mutation, including transitions that carry no request body (validate, score) and cascaded
          state changes; reads never advance it.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; UNSAFE_DRIVING code and UNSAFE_DRIVING/MEDIUM threshold present so scoring succeeds."
