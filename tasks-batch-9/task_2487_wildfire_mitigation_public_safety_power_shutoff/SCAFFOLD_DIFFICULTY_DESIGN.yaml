  - rule_id: cross_entity_state_dependency
    instances:

      - name: patrol_start_requires_event_in_restoration
        grounds:
          - state_machines.PatrolAssignment.SCHEDULED_to_IN_PROGRESS
          - validations[priority=9]
          - errors[ERR_EVENT_NOT_IN_RESTORATION]
          - entities.PSPSEvent.fields.scope_status
        distinguishing_aspect: |
          The (PatrolAssignment, PSPSEvent) pair: the assignment is SCHEDULED and its circuit is
          DE_ENERGIZED — both local preconditions hold — yet the start is refused with
          ERR_EVENT_NOT_IN_RESTORATION solely because the governing PSPSEvent is still ACTIVE and
          meteorology has not declared all-clear.
        test_recipe:
          setup:
            - "Everything from deenergize_locks_posture_and_suspends_mitigation_execution, then the de-energize call itself: EV-1 is ACTIVE, all three circuits are DE_ENERGIZED."
            - "A GROUND patrol assignment on ALPHA has been created and is SCHEDULED."
            - "No all-clear has been declared, so EV-1.scope_status is still ACTIVE."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "ALPHA", district_code: "D-NORTH", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
