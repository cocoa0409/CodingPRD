  - rule_id: boundary_precision_check
    instances:
      - name: qc_deviation_exactly_at_fail_limit_is_warn_and_one_thousandth_over_is_fail
        grounds:
          - calculations.qc_deviation_and_result
          - entities.QcRun.fields.deviation_sd_units
          - entities.QcRun.fields.result
          - state_machines.Densitometer.ACTIVE_to_QC_HOLD
          - endpoints["POST /bone-density/densitometers/{id}/qc-runs"]
        distinguishing_aspect: |
          The classification reads the value already rounded to three decimals, so phantom 1.0150
          gives deviation_sd_units exactly 1.500 which is QC_FAIL_SD_LIMIT and therefore WARN with the
          device left ACTIVE, while phantom 1.0151 gives 1.510 and is FAIL with the device driven to
          QC_HOLD. One ten-thousandth of BMD separates "keep scanning" from "stop the plant", and an
          implementation using > instead of >=, or classifying the unrounded quotient, flips it.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-05T08:00:00Z."
            - "One ACTIVE Densitometer HLG-0001 with phantom_baseline_bmd_g_cm2 1.0000 and phantom_baseline_sd_g_cm2 0.0100, consecutive_qc_pass_count 0."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id }
          trigger:
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0150, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { qc_warn_id: $.data.id }
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0151, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { qc_fail_id: $.data.id }
          assert:
            - "QcRun.${qc_warn_id}.deviation_g_cm2 == 0.0150"
