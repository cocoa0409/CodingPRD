  # =========================================================================
  # Section: errors (excluded_because stubs for corners covered by §1.8)
  # =========================================================================
  - section: errors
    instances:
      - name: error_segregation_violation_covered_by_difficulty
        claim_type: Violation → Error
        grounds:
          - errors[ERR_SEGREGATION_VIOLATION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / seal_segregation_before_closure_tolerance
          rationale: "ERR_SEGREGATION_VIOLATION is asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_closure_out_of_tolerance_covered_by_difficulty
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CLOSURE_OUT_OF_TOLERANCE]
        excluded_because:
          difficulty_instance: boundary_precision_check / closure_ppm_exactly_at_max_seals_one_over_rejected
          rationale: "The closure tolerance ceiling (and its rejection) is exercised by the boundary §1.8 instance."

      - name: error_title_not_clear_covered_by_difficulty
        claim_type: Violation → Error
        grounds:
          - errors[ERR_TITLE_NOT_CLEAR]
        excluded_because:
          difficulty_instance: boundary_precision_check / research_clear_at_zero_encumbrance_hold_at_one
          rationale: "ERR_TITLE_NOT_CLEAR is the failure path asserted in the encumbrance-boundary §1.8 instance."

      - name: error_crew_double_booked_covered_by_difficulty
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CREW_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_double_book_half_open_adjacency_allowed
          rationale: "ERR_CREW_DOUBLE_BOOKED is asserted in the half-open overlap §1.8 instance."

      - name: error_instrument_unavailable_covered_by_difficulty
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INSTRUMENT_UNAVAILABLE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / instrument_reservation_buffered_interval_conflict
          rationale: "ERR_INSTRUMENT_UNAVAILABLE is asserted in the buffered-interval §1.8 instance."

      - name: error_invalid_window_covered_by_difficulty
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_WINDOW]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / field_assignment_invalid_window_before_role_mismatch
          rationale: "ERR_INVALID_WINDOW is the lower-priority co-violated rule in the named §1.8 instance (ERR_ROLE_MISMATCH wins, but the window violation is present)."
