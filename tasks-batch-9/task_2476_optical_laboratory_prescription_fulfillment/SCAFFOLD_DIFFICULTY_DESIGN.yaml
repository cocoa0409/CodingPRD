      - name: surfacing_breakage_without_replacement_cascades_three_hops_into_at_risk_turnaround
        grounds:
          - state_machines.LabJob.SURFACING_to_BLANK_BACKORDER
          - calculations.blank_lot_selection
          - calculations.turnaround_and_expedite_fee
          - entities.RxOrder.fields.tat_commitment_status
          - endpoints.POST_/lab-operations/{id}/report-breakage
        distinguishing_aspect: |
          A different trigger (POST /lab-operations/{id}/report-breakage) drives a depth-3 chain
          through a different entity spine: HOP 1 scraps the held blank and empties the job's
          allocation, HOP 2 (caused only by the selector returning the empty set after HOP 1) moves
          the job to BLANK_BACKORDER, and HOP 3 (caused only by HOP 2) pushes the order's
          promised_due_at out by 48 hours to 2026-08-04T12:00:00Z and flags it AT_RISK.
