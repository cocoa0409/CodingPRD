      - name: refused_transfer_is_denied_terminal_and_rejects_a_later_approve
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PointTransfer.status.transitions.REQUESTED_to_DENIED
          - state_machines.PointTransfer.status.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A DECEASED source makes basis DEATH's factual precondition hold, so
          creation lands in REQUESTED with exception_required false — the mirror
          of the fork claim. A policy REFUSE from REQUESTED then reaches the
          terminal DENIED state, after which approve must answer 409
          ERR_INVALID_STATE rather than the priority-13
          ERR_TRANSFER_POLICY_EXCEPTION_REQUIRED carve-out (which is scoped to
          EXCEPTION_PENDING only).
