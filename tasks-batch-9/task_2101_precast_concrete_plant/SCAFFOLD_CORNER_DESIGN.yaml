        grounds: ["errors[ERR_STEAM_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / steam_zone_aggregate_boiler_demand_at_half_open_instants
          rationale: "Asserted as the rejected 110 bhp cycle in that instance."

      - name: error_mix_design_not_qualified_on_cast
        claim_type: Violation → Error
        grounds: ["errors[ERR_MIX_DESIGN_NOT_QUALIFIED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / bed_run_cast_gated_on_mix_design_qualified_state
          rationale: "Asserted as that instance's first trigger outcome."

      - name: error_permit_not_issued_on_dispatch
        claim_type: Violation → Error
        grounds: ["errors[ERR_PERMIT_NOT_ISSUED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / shipment_dispatch_gated_on_haul_permit_issued_state
