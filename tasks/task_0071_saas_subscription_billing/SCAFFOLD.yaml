# =============================================================================
# task_0071: SaaS subscription billing benchmark seed tables
# =============================================================================

scenario: |
  SaaS subscription billing system: tenant management with tenant profile, contact
  information, billing entity (independent/parent-subsidiary), tenant-status
  (trial/active/suspended/terminated) management, and tenant data isolation;
  package definition (tiered/usage-based/hybrid) with package-type configuration,
  included quotas (seats/calls/storage), tiered-pricing brackets, overage rates,
  package add-ons, and package-version effective-date control; subscription
  upgrade/downgrade (pro-rated by day) with upgrade immediate effect and
  pro-rated charging, downgrade end-of-cycle effect or immediate refund,
  mid-cycle plan change rules, quota carry-forward and reset rules, and
  trial-to-paid conversion; usage data collection with multi-dimension metering
  (API call/storage/bandwidth/active user), real-time and batch ingestion,
  idempotent data processing, late-arrival data handling, and usage-data
  archiving; bill generation with billing cycle (monthly/quarterly/annual),
  pre-paid and post-paid combination, tax calculation by jurisdiction,
  multi-currency settlement, discount and credit application, and bill-issuance
  workflow; overdue handling with payment-due reminder, tiered overdue rules
  (read-only/feature-restriction/suspension/termination), late-fee calculation,
  payment-recovery workflow, dunning notification, and reactivation-on-payment;
  event-driven synchronization with payment-Pay, accounting, CRM, and
  tax-compliance systems; audit logging for subscription changes and billing
  adjustments.

domain_name: saas-subscription-billing
api_prefix: /tenants

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: event_sourcing
  complexity_layers:
    - multi_tenancy_isolation
    - dual_variant_calculation
    - idempotency
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential          # Tenant parent_tenant_id for parent-subsidiary
    - cross_aggregate           # Subscription references PackageVersion across aggregates
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the tenant organization" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: contact_phone, type: string, source: input, description: "Primary contact phone" }
      - { name: billing_entity_type, type: enum, source: input, description: "INDEPENDENT | PARENT | SUBSIDIARY" , constraints: "INDEPENDENT|PARENT|SUBSIDIARY"}
      - { name: parent_tenant_id, type: string, source: input, description: "When billing_entity_type=SUBSIDIARY, references the parent Tenant.id; null otherwise", default: null }
      - { name: currency, type: string, source: input, description: "ISO 4217 currency code, e.g., USD, EUR, GBP, JPY" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction.id used for tax computation" }
      - { name: tenant_status, type: enum, source: system, description: "TRIAL | ACTIVE | SUSPENDED | TERMINATED", default: "TRIAL", constraints: "TRIAL|ACTIVE|SUSPENDED|TERMINATED" }
      - { name: restriction_level, type: enum, source: system, description: "NONE | READ_ONLY | FEATURE_RESTRICTED — applied while tenant_status remains ACTIVE during dunning; cleared on payment", default: "NONE", constraints: "NONE|READ_ONLY|FEATURE_RESTRICTED" }
      - { name: trial_expires_at, type: datetime, source: system, description: "ISO 8601 UTC; when trial automatically converts or terminates" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of Invoice.amount_due_cents for ISSUED|OVERDUE invoices on this tenant, in tenant.currency" }
      - { name: active_subscription_id, type: string, source: computed, description: "id of the Subscription whose subscription_status IN {TRIAL, ACTIVE} for this tenant; null if none" }

  - name: PackageVersion
    parent: null
    common_fields: false      # immutable configuration snapshot — only id + created_at
    fields:
      - { name: package_code, type: string, source: input, description: "Stable package identifier across versions, e.g., 'STARTER'" }
      - { name: version_number, type: integer, source: input, description: "Monotonic version number per package_code, starting at 1" }
      - { name: package_type, type: enum, source: input, description: "TIERED | USAGE_BASED | HYBRID", constraints: "TIERED|USAGE_BASED|HYBRID" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC inclusive. A subscription created at time T uses the PackageVersion with the largest effective_from <= T for that package_code." }
      - { name: base_price_cents, type: integer, source: input, description: "Base recurring price per billing cycle, in currency below. For USAGE_BASED packages this is 0." }
      - { name: currency, type: string, source: input, description: "Package price currency; subscription must match tenant.currency" }
      - { name: billing_cycle, type: enum, source: input, description: "MONTHLY | QUARTERLY | ANNUAL", constraints: "MONTHLY|QUARTERLY|ANNUAL" }
      - { name: pricing_model, type: enum, source: input, description: "PREPAID | POSTPAID — PREPAID issues an invoice at cycle start; POSTPAID issues at cycle end. HYBRID packages are always PREPAID for base + POSTPAID for overage.", constraints: "PREPAID|POSTPAID" }
      - { name: included_quotas, type: object, source: input, description: "Map metric→integer cap: {seats, api_calls, storage_gb, bandwidth_gb, active_users}. Missing keys mean zero included." }
      - { name: tiered_brackets, type: array, source: input, description: "For TIERED|HYBRID: ordered list of {metric, upper_bound, unit_price_cents}. Last bracket has upper_bound=null meaning ∞. Empty for USAGE_BASED." }
      - { name: overage_rates, type: object, source: input, description: "For USAGE_BASED|HYBRID: flat overage rate per metric in cents per unit when no tier bracket applies. Empty for TIERED." }
      - { name: addons, type: array, source: input, description: "List of {code, monthly_price_cents} purchasable add-ons" }

  - name: Subscription
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "Owning Tenant.id" }
      - { name: package_code, type: string, source: input, description: "Selected package_code (resolves to a PackageVersion via effective_from)" }
      - { name: package_version_id, type: string, source: system, description: "Resolved PackageVersion.id locked in at activation/upgrade time" }
      - { name: selected_addons, type: array, source: input, description: "List of add-on codes currently active" }
      - { name: subscription_status, type: enum, source: system, description: "PENDING | TRIAL | ACTIVE | PENDING_DOWNGRADE | CANCELLED", default: "PENDING", constraints: "PENDING|TRIAL|ACTIVE|PENDING_DOWNGRADE|CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "Parallel dimension to subscription_status. CURRENT | DUE | OVERDUE_TIER1 | OVERDUE_TIER2 | OVERDUE_TIER3", default: "CURRENT", constraints: "CURRENT|DUE|OVERDUE_TIER1|OVERDUE_TIER2|OVERDUE_TIER3" }
      - { name: cycle_start, type: datetime, source: system, description: "Inclusive ISO 8601 UTC start of current billing cycle" }
      - { name: cycle_end, type: datetime, source: system, description: "Exclusive ISO 8601 UTC end of current billing cycle" }
      - { name: pending_change_package_version_id, type: string, source: system, description: "If subscription_status=PENDING_DOWNGRADE, the PackageVersion.id that will be applied at cycle_end", default: null }
      - { name: quota_consumed, type: object, source: computed, description: "Per-metric integer counter of usage already attributed to this billing cycle (after idempotent ingestion)" }
      - { name: quota_carry_forward, type: object, source: system, description: "Per-metric integer; ANNUAL prepaid plans carry forward unused seats only; resets on package change", default: {} }

  - name: SubscriptionChange
    parent: Subscription
    common_fields: false       # immutable event log (id + created_at only)
    fields:
      - { name: subscription_id, type: string, source: system, description: "Parent Subscription.id" }
      - { name: tenant_id, type: string, source: system, description: "Denormalized tenant ownership for audit queries" }
      - { name: change_type, type: enum, source: input, description: "UPGRADE | DOWNGRADE_IMMEDIATE_REFUND | DOWNGRADE_END_OF_CYCLE | TRIAL_CONVERSION | ADDON_ADD | ADDON_REMOVE | CANCEL", constraints: "UPGRADE|DOWNGRADE_IMMEDIATE_REFUND|DOWNGRADE_END_OF_CYCLE|TRIAL_CONVERSION|ADDON_ADD|ADDON_REMOVE|CANCEL" }
      - { name: from_package_version_id, type: string, source: system, description: "PackageVersion.id before the change" }
      - { name: to_package_version_id, type: string, source: system, description: "PackageVersion.id after the change (null for CANCEL)" }
      - { name: effective_at, type: datetime, source: system, description: "ISO 8601 UTC. UPGRADE = now; DOWNGRADE_END_OF_CYCLE = cycle_end; DOWNGRADE_IMMEDIATE_REFUND = now" }
      - { name: prorated_charge_cents, type: integer, source: computed, description: "Signed amount: positive = charge to tenant; negative = refund. Computed by proration_amount calculation." }

  - name: UsageRecord
    parent: Subscription
    common_fields: false       # immutable, append-only
    fields:
      - { name: subscription_id, type: string, source: system, description: "Parent Subscription.id" }
      - { name: tenant_id, type: string, source: system, description: "Denormalized for archive partitioning" }
      - { name: idempotency_key, type: string, source: input, description: "Caller-supplied unique key per metric event. Repeated submissions return the original record." }
      - { name: metric, type: enum, source: input, description: "API_CALL | STORAGE_GB | BANDWIDTH_GB | ACTIVE_USER", constraints: "API_CALL|STORAGE_GB|BANDWIDTH_GB|ACTIVE_USER" }
      - { name: quantity, type: integer, source: input, description: "Non-negative integer count" }
      - { name: event_timestamp, type: datetime, source: input, description: "ISO 8601 UTC when the metered event occurred (may pre-date ingestion)" }
      - { name: ingestion_mode, type: enum, source: input, description: "REALTIME | BATCH", constraints: "REALTIME|BATCH" }
      - { name: attributed_cycle_start, type: datetime, source: system, description: "Subscription.cycle_start of the billing cycle this usage was attributed to (per late-arrival rule)" }
      - { name: archived, type: boolean, source: system, description: "True if record predates current archive_cutoff", default: false }

  - name: Invoice
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: system, description: "Owning Tenant.id" }
      - { name: subscription_id, type: string, source: system, description: "Associated Subscription.id (the bill payer)" }
      - { name: cycle_start, type: datetime, source: system, description: "Subscription.cycle_start at the time the invoice was issued" }
      - { name: cycle_end, type: datetime, source: system, description: "Subscription.cycle_end at the time the invoice was issued" }
      - { name: invoice_status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | OVERDUE | WRITTEN_OFF", default: "DRAFT", constraints: "DRAFT|ISSUED|PARTIALLY_PAID|PAID|OVERDUE|WRITTEN_OFF" }
      - { name: currency, type: string, source: system, description: "Always equals Tenant.currency at issue time" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Base + tiered + overage + addon line items before tax/discount/credit, in currency above" }
      - { name: discount_cents, type: integer, source: input, description: "Applied discount (>=0). Cannot exceed subtotal_cents.", default: 0 }
      - { name: credit_applied_cents, type: integer, source: system, description: "Sum of CreditNote.applied_cents toward this invoice", default: 0 }
      - { name: tax_cents, type: integer, source: computed, description: "Tax computed via tax_calculation on (subtotal - discount) using Tenant.jurisdiction_code" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Accumulated late-fee per late_fee_accrual; resets to 0 on reactivation_on_payment", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal - discount - credit_applied + tax + late_fee" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents allocated to this invoice" }
      - { name: amount_due_cents, type: integer, source: computed, description: "max(total_cents - amount_paid_cents, 0)" }
      - { name: due_at, type: datetime, source: system, description: "ISO 8601 UTC payment-due deadline" }
      - { name: line_items, type: array, source: system, description: "Frozen list of line items (each with kind, optional metric, description, quantity, unit_price_cents, line_total_cents) computed at issuance" }
      - { name: pricing_model, type: enum, source: system, description: "PREPAID | POSTPAID — copied from PackageVersion at issuance" }

  - name: Payment
    parent: Tenant
    common_fields: false      # immutable: id + created_at
    fields:
      - { name: tenant_id, type: string, source: system, description: "Tenant.id paying" }
      - { name: invoice_id, type: string, source: input, description: "Invoice.id being paid (one Payment applies to exactly one Invoice)" }
      - { name: amount_cents, type: integer, source: input, description: "Positive integer; partial payments allowed" }
      - { name: currency, type: string, source: input, description: "Must equal Invoice.currency" }
      - { name: external_reference, type: string, source: input, description: "Caller-supplied unique reference per tenant for idempotency" }
      - { name: payment_status, type: enum, source: system, description: "RECEIVED | REVERSED", default: "RECEIVED", constraints: "RECEIVED|REVERSED" }

  - name: CreditNote
    parent: Tenant
    common_fields: false      # immutable record (id + created_at)
    fields:
      - { name: tenant_id, type: string, source: system, description: "Tenant.id receiving the credit" }
      - { name: origin, type: enum, source: input, description: "REFUND_DOWNGRADE | MANUAL_ADJUSTMENT | TAX_CORRECTION", constraints: "REFUND_DOWNGRADE|MANUAL_ADJUSTMENT|TAX_CORRECTION" }
      - { name: amount_cents, type: integer, source: input, description: "Positive credit amount in tenant.currency" }
      - { name: applied_to_invoice_id, type: string, source: system, description: "Invoice.id this credit was consumed by; null while unapplied", default: null }
      - { name: applied_cents, type: integer, source: system, description: "Cents actually consumed against applied_to_invoice_id; <= amount_cents", default: 0 }

  - name: Jurisdiction
    parent: null
    common_fields: false     # configuration record (id + created_at)
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Unique code, e.g., 'US-CA', 'DE', 'JP'. Equals Tenant.jurisdiction_code." }
      - { name: tax_rate_bps, type: integer, source: input, description: "Tax rate in basis points (e.g., 875 = 8.75%)" }
      - { name: rounding_mode, type: enum, source: input, description: "PER_LINE | TOTAL — PER_LINE rounds tax on each line then sums; TOTAL sums lines then rounds tax once", constraints: "PER_LINE|TOTAL" }

  - name: SyncEvent
    parent: null
    common_fields: false     # append-only event log (id + created_at)
    fields:
      - { name: tenant_id, type: string, source: system, description: "Subject tenant" }
      - { name: target_system, type: enum, source: system, description: "PAYMENT_PAY | ACCOUNTING | CRM | TAX_COMPLIANCE", constraints: "PAYMENT_PAY|ACCOUNTING|CRM|TAX_COMPLIANCE" }
      - { name: event_type, type: enum, source: system, description: "SUBSCRIPTION_CREATED | SUBSCRIPTION_CHANGED | INVOICE_ISSUED | PAYMENT_RECEIVED | TENANT_SUSPENDED | TENANT_REACTIVATED", constraints: "SUBSCRIPTION_CREATED|SUBSCRIPTION_CHANGED|INVOICE_ISSUED|PAYMENT_RECEIVED|TENANT_SUSPENDED|TENANT_REACTIVATED" }
      - { name: payload, type: object, source: system, description: "Frozen JSON snapshot of the affected entity at emission time" }
      - { name: delivery_status, type: enum, source: system, description: "QUEUED | DELIVERED | FAILED — only QUEUED|DELIVERED produced by this system; FAILED is reserved for downstream test trigger", default: "QUEUED", constraints: "QUEUED|DELIVERED|FAILED" }

  - name: AuditLog
    parent: null
    common_fields: false     # immutable append-only (id + created_at)
    fields:
      - { name: tenant_id, type: string, source: system, description: "Subject tenant" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role header value at the moment of the action" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID header value at the moment of the action" }
      - { name: action, type: enum, source: system, description: "SUBSCRIPTION_CREATE | SUBSCRIPTION_UPGRADE | SUBSCRIPTION_DOWNGRADE | INVOICE_ADJUSTMENT | CREDIT_ISSUE | TENANT_STATUS_CHANGE", constraints: "SUBSCRIPTION_CREATE|SUBSCRIPTION_UPGRADE|SUBSCRIPTION_DOWNGRADE|INVOICE_ADJUSTMENT|CREDIT_ISSUE|TENANT_STATUS_CHANGE" }
      - { name: target_entity_type, type: string, source: system, description: "Entity name affected (Subscription, Invoice, Tenant, CreditNote)" }
      - { name: target_entity_id, type: string, source: system, description: "id of the target entity" }
      - { name: before_snapshot, type: object, source: system, description: "JSON snapshot of relevant fields before the change" }
      - { name: after_snapshot, type: object, source: system, description: "JSON snapshot of relevant fields after the change" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Tenant
    field: tenant_status
    initial_state: TRIAL
    terminal_states: [TERMINATED]
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /tenants/{tenant_id}/subscriptions/{id}/convert (TRIAL_CONVERSION) or system trial_expires_at reached AND payment method valid (POST /_clock/advance)"
        actor: TenantAdmin
        preconditions:
          - "Tenant.tenant_status == TRIAL"
          - "An ACTIVE Subscription exists with subscription_status transitioned to ACTIVE in same request, OR trial conversion event"
        side_effects:
          - "Issue first prepaid Invoice for the active subscription (POSTPAID packages skip prepaid issuance)"
          - "Emit SyncEvent {event_type=SUBSCRIPTION_CREATED, target_system=ACCOUNTING}"
          - "AuditLog action=TENANT_STATUS_CHANGE"
      - from: TRIAL
        to: TERMINATED
        trigger: "POST /_clock/advance such that now > Tenant.trial_expires_at AND no Subscription has transitioned to ACTIVE"
        actor: system
        preconditions:
          - "Tenant.tenant_status == TRIAL"
          - "Now > trial_expires_at"
          - "No active subscription"
        side_effects:
          - "Cancel any PENDING Subscription"
          - "AuditLog action=TENANT_STATUS_CHANGE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /_dunning/run advances payment_status to OVERDUE_TIER3 (dunning_tier_advance)"
        actor: system
        preconditions:
          - "Tenant.tenant_status == ACTIVE"
          - "Subscription.payment_status reaches OVERDUE_TIER3"
        side_effects:
          - "Set Tenant.restriction_level=NONE (suspension supersedes)"
          - "Emit SyncEvent {event_type=TENANT_SUSPENDED, target_system=CRM}"
          - "AuditLog action=TENANT_STATUS_CHANGE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments where Payment causes Invoice.amount_due_cents -> 0 AND no other OVERDUE invoice (reactivation_on_payment)"
        actor: TenantAdmin
        preconditions:
          - "Tenant.tenant_status == SUSPENDED"
          - "After payment allocation, Tenant.outstanding_balance_cents == 0"
        side_effects:
          - "Reset Subscription.payment_status to CURRENT"
          - "Reset Tenant.restriction_level to NONE"
          - "Recompute Invoice.late_fee_cents=0 on the just-paid invoice"
          - "Emit SyncEvent {event_type=TENANT_REACTIVATED, target_system=CRM}"
          - "AuditLog action=TENANT_STATUS_CHANGE"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /_dunning/run when tenant_status has been SUSPENDED for more than TERMINATION_GRACE_DAYS"
        actor: system
        preconditions:
          - "Tenant.tenant_status == SUSPENDED"
          - "now - (last TENANT_STATUS_CHANGE to SUSPENDED).created_at > 30 days"
        side_effects:
          - "Cancel active Subscription (subscription_status -> CANCELLED)"
          - "Write off all OVERDUE invoices to invoice_status=WRITTEN_OFF (no late_fee further accrual)"
          - "Emit SyncEvent {event_type=SUBSCRIPTION_CHANGED, target_system=ACCOUNTING}"
          - "AuditLog action=TENANT_STATUS_CHANGE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "DELETE /tenants/{id} by PlatformAdmin"
        actor: PlatformAdmin
        preconditions:
          - "Tenant.tenant_status == ACTIVE"
          - "Tenant.outstanding_balance_cents == 0 (else ERR_OUTSTANDING_BALANCE_EXISTS)"
        side_effects:
          - "Cancel active Subscription"
          - "AuditLog action=TENANT_STATUS_CHANGE"

  - entity: Tenant
    field: restriction_level
    initial_state: NONE
    terminal_states: []   # cyclic — clears on payment
    transitions:
      - from: NONE
        to: READ_ONLY
        trigger: "POST /_dunning/run advances Subscription.payment_status to OVERDUE_TIER1 (dunning_tier_advance)"
        actor: system
        preconditions:
          - "Tenant.tenant_status == ACTIVE"
        side_effects:
          - "Mutation endpoints other than payments now return ERR_TENANT_READ_ONLY"
      - from: READ_ONLY
        to: FEATURE_RESTRICTED
        trigger: "POST /_dunning/run advances Subscription.payment_status to OVERDUE_TIER2"
        actor: system
        preconditions:
          - "Tenant.tenant_status == ACTIVE"
        side_effects:
          - "Usage ingestion of metric=API_CALL beyond included_quotas is rejected with ERR_TENANT_FEATURE_RESTRICTED"
      - from: FEATURE_RESTRICTED
        to: NONE
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments such that Invoice.amount_due_cents -> 0 (reactivation_on_payment)"
        actor: TenantAdmin
        preconditions:
          - "Tenant.outstanding_balance_cents == 0 post-allocation"
        side_effects:
          - "Reset Subscription.payment_status to CURRENT"
          - "Recompute Invoice.late_fee_cents=0 on the just-paid invoice"
      - from: READ_ONLY
        to: NONE
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments such that Invoice.amount_due_cents -> 0"
        actor: TenantAdmin
        preconditions:
          - "Tenant.outstanding_balance_cents == 0 post-allocation"
        side_effects:
          - "Reset Subscription.payment_status to CURRENT"
          - "Recompute Invoice.late_fee_cents=0 on the just-paid invoice"

  - entity: Subscription
    field: subscription_status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: TRIAL
        trigger: "POST /tenants/{tenant_id}/subscriptions when Tenant.tenant_status=TRIAL"
        actor: TenantAdmin
        preconditions:
          - "Tenant.tenant_status == TRIAL"
          - "Selected PackageVersion exists and PackageVersion.currency == Tenant.currency"
        side_effects:
          - "Lock package_version_id to the PackageVersion with largest effective_from <= now for package_code"
          - "Set cycle_start=now, cycle_end=cycle_start + billing_cycle_period"
          - "AuditLog action=SUBSCRIPTION_CREATE"
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /tenants/{tenant_id}/subscriptions/{id}/convert (TRIAL_CONVERSION)"
        actor: TenantAdmin
        preconditions:
          - "Subscription.subscription_status == TRIAL"
          - "Tenant.tenant_status IN {TRIAL, ACTIVE}"
        side_effects:
          - "Tenant.tenant_status -> ACTIVE (cascade)"
          - "Reset cycle_start=now, cycle_end=now + billing_cycle_period"
          - "Issue PREPAID Invoice if PackageVersion.pricing_model IN {PREPAID, HYBRID}"
          - "Emit SyncEvent SUBSCRIPTION_CREATED target_system=PAYMENT_PAY"
          - "AuditLog action=SUBSCRIPTION_CREATE"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /tenants/{tenant_id}/subscriptions/{id}/upgrade — immediate upgrade with prorated charge"
        actor: TenantAdmin
        preconditions:
          - "Subscription.subscription_status == ACTIVE"
          - "Target PackageVersion.base_price_cents > current PackageVersion.base_price_cents"
          - "Tenant.restriction_level == NONE"
        side_effects:
          - "Replace package_version_id with target"
          - "Create SubscriptionChange change_type=UPGRADE with prorated_charge_cents from proration_amount (variant=UPGRADE_FORWARD_LOOKING)"
          - "Issue a prorated Invoice (line_items reflect the prorated charge) for that change"
          - "Reset quota_consumed to zero for the remainder of the cycle (quota carry-forward rule)"
          - "Emit SyncEvent SUBSCRIPTION_CHANGED target_system=ACCOUNTING"
          - "AuditLog action=SUBSCRIPTION_UPGRADE"
      - from: ACTIVE
        to: PENDING_DOWNGRADE
        trigger: "POST /tenants/{tenant_id}/subscriptions/{id}/downgrade?mode=END_OF_CYCLE"
        actor: TenantAdmin
        preconditions:
          - "Subscription.subscription_status == ACTIVE"
          - "Target PackageVersion.base_price_cents < current PackageVersion.base_price_cents"
        side_effects:
          - "Set pending_change_package_version_id to target PackageVersion.id"
          - "Create SubscriptionChange change_type=DOWNGRADE_END_OF_CYCLE with effective_at=cycle_end, prorated_charge_cents=0"
          - "AuditLog action=SUBSCRIPTION_DOWNGRADE"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /tenants/{tenant_id}/subscriptions/{id}/downgrade?mode=IMMEDIATE_REFUND"
        actor: TenantAdmin
        preconditions:
          - "Subscription.subscription_status == ACTIVE"
          - "Target PackageVersion.base_price_cents < current PackageVersion.base_price_cents"
          - "Current PackageVersion.pricing_model IN {PREPAID, HYBRID}"
        side_effects:
          - "Replace package_version_id with target"
          - "Compute prorated_charge_cents = proration_amount variant=DOWNGRADE_CHRONOLOGICAL_REFUND (NEGATIVE — refund)"
          - "Issue CreditNote origin=REFUND_DOWNGRADE amount_cents=abs(prorated_charge_cents) auto-applied to most-recent ISSUED invoice for this subscription"
          - "Reset quota_consumed to zero"
          - "Emit SyncEvent SUBSCRIPTION_CHANGED target_system=ACCOUNTING"
          - "AuditLog action=SUBSCRIPTION_DOWNGRADE"
      - from: PENDING_DOWNGRADE
        to: ACTIVE
        trigger: "POST /_clock/advance such that now >= Subscription.cycle_end (cycle_rollover)"
        actor: system
        preconditions:
          - "Subscription.subscription_status == PENDING_DOWNGRADE"
        side_effects:
          - "Set package_version_id = pending_change_package_version_id, clear pending_change_package_version_id"
          - "Set cycle_start=cycle_end_old, cycle_end=cycle_start + billing_cycle_period"
          - "Apply quota_carry_forward (ANNUAL prepaid: carry unused seats only; all others: reset)"
          - "Reset quota_consumed=0"
          - "Issue next cycle Invoice for new package (PREPAID/HYBRID), or accumulate (POSTPAID)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "DELETE /tenants/{tenant_id}/subscriptions/{id} or cascading Tenant SUSPENDED->TERMINATED"
        actor: TenantAdmin
        preconditions:
          - "Subscription.subscription_status IN {TRIAL, ACTIVE, PENDING_DOWNGRADE}"
        side_effects:
          - "Final POSTPAID invoice issued if pricing_model includes POSTPAID and current_cycle has usage"
          - "Emit SyncEvent SUBSCRIPTION_CHANGED target_system=CRM"
          - "AuditLog action=SUBSCRIPTION_DOWNGRADE (change_type CANCEL)"
      - from: TRIAL
        to: CANCELLED
        trigger: "DELETE /tenants/{tenant_id}/subscriptions/{id} during trial"
        actor: TenantAdmin
        preconditions:
          - "Subscription.subscription_status == TRIAL"
        side_effects:
          - "No invoice issued"
          - "AuditLog action=SUBSCRIPTION_DOWNGRADE (change_type CANCEL)"

  - entity: Subscription
    field: payment_status
    initial_state: CURRENT
    terminal_states: []   # cyclic
    transitions:
      - from: CURRENT
        to: DUE
        trigger: "POST /_clock/advance crosses an Invoice.due_at while it is ISSUED|PARTIALLY_PAID"
        actor: system
        preconditions:
          - "At least one Invoice for this subscription is ISSUED|PARTIALLY_PAID and now >= due_at"
        side_effects:
          - "Recompute Invoice.late_fee_cents via late_fee_accrual"
          - "No restriction_level change yet"
      - from: DUE
        to: OVERDUE_TIER1
        trigger: "POST /_dunning/run after DUE state held GRACE_DAYS_TIER1"
        actor: system
        preconditions:
          - "Invoice.amount_due_cents > 0 for GRACE_DAYS_TIER1+ days past due_at"
        side_effects:
          - "Invoice.invoice_status -> OVERDUE"
          - "Tenant.restriction_level -> READ_ONLY"
          - "Late fee continues to accrue"
      - from: OVERDUE_TIER1
        to: OVERDUE_TIER2
        trigger: "POST /_dunning/run after held GRACE_DAYS_TIER2 past due_at"
        actor: system
        preconditions: ["Invoice still unpaid past TIER2 threshold"]
        side_effects:
          - "Tenant.restriction_level -> FEATURE_RESTRICTED"
      - from: OVERDUE_TIER2
        to: OVERDUE_TIER3
        trigger: "POST /_dunning/run after held GRACE_DAYS_TIER3 past due_at"
        actor: system
        preconditions: ["Invoice still unpaid past TIER3 threshold"]
        side_effects:
          - "Tenant.tenant_status -> SUSPENDED (cascade)"
          - "Tenant.restriction_level -> NONE (overridden by SUSPENDED)"
      - from: OVERDUE_TIER1
        to: CURRENT
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments such that Invoice.amount_due_cents -> 0"
        actor: TenantAdmin
        preconditions: ["After allocation, Tenant.outstanding_balance_cents == 0"]
        side_effects:
          - "Recompute Invoice.late_fee_cents=0"
          - "Tenant.restriction_level -> NONE"
      - from: OVERDUE_TIER2
        to: CURRENT
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments such that Invoice.amount_due_cents -> 0"
        actor: TenantAdmin
        preconditions: ["After allocation, Tenant.outstanding_balance_cents == 0"]
        side_effects:
          - "Recompute Invoice.late_fee_cents=0"
          - "Tenant.restriction_level -> NONE"
      - from: OVERDUE_TIER3
        to: CURRENT
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments such that Invoice.amount_due_cents -> 0 while Tenant.tenant_status == SUSPENDED"
        actor: TenantAdmin
        preconditions: ["After allocation, Tenant.outstanding_balance_cents == 0"]
        side_effects:
          - "Tenant.tenant_status -> ACTIVE (reactivation_on_payment)"
          - "Recompute Invoice.late_fee_cents=0"
      - from: DUE
        to: CURRENT
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments such that Invoice.amount_due_cents -> 0"
        actor: TenantAdmin
        preconditions: ["After allocation, Tenant.outstanding_balance_cents == 0"]
        side_effects:
          - "Recompute Invoice.late_fee_cents=0"

  - entity: Invoice
    field: invoice_status
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/issue (BillingOperator) or system at cycle_rollover"
        actor: BillingOperator
        preconditions:
          - "Invoice.invoice_status == DRAFT"
          - "Invoice.subtotal_cents and tax_cents and total_cents finalized via bill_total_calc"
        side_effects:
          - "Line items frozen"
          - "due_at set"
          - "Emit SyncEvent event_type=INVOICE_ISSUED target_system=ACCOUNTING"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments where 0 < amount_paid_cents < total_cents"
        actor: TenantAdmin
        preconditions: ["Invoice.invoice_status == ISSUED"]
        side_effects:
          - "Recompute amount_due_cents"
          - "Emit SyncEvent event_type=PAYMENT_RECEIVED target_system=PAYMENT_PAY"
      - from: ISSUED
        to: PAID
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments where amount_paid_cents >= total_cents"
        actor: TenantAdmin
        preconditions: ["Invoice.invoice_status == ISSUED"]
        side_effects:
          - "Cascading: Subscription.payment_status -> CURRENT (if no other unpaid invoices)"
          - "Cascading: Tenant.restriction_level -> NONE (if no other unpaid invoices)"
          - "Emit SyncEvent event_type=PAYMENT_RECEIVED target_system=PAYMENT_PAY"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments where amount_paid_cents reaches total_cents"
        actor: TenantAdmin
        preconditions: ["Invoice.invoice_status == PARTIALLY_PAID"]
        side_effects:
          - "Cascading: Subscription.payment_status -> CURRENT (if no other unpaid invoices)"
          - "Cascading: Tenant.restriction_level -> NONE (if no other unpaid invoices)"
      - from: ISSUED
        to: OVERDUE
        trigger: "POST /_dunning/run after due_at + GRACE_DAYS_TIER1"
        actor: system
        preconditions: ["now >= due_at + GRACE_DAYS_TIER1 AND amount_due_cents > 0"]
        side_effects:
          - "Subscription.payment_status -> OVERDUE_TIER1 (cascade)"
          - "Tenant.restriction_level -> READ_ONLY (cascade)"
          - "Recompute Invoice.late_fee_cents via late_fee_accrual"
      - from: PARTIALLY_PAID
        to: OVERDUE
        trigger: "POST /_dunning/run after due_at + GRACE_DAYS_TIER1 with residual amount_due_cents>0"
        actor: system
        preconditions: ["now >= due_at + GRACE_DAYS_TIER1 AND amount_due_cents > 0"]
        side_effects:
          - "Subscription.payment_status -> OVERDUE_TIER1 (cascade)"
          - "Tenant.restriction_level -> READ_ONLY (cascade)"
          - "Recompute Invoice.late_fee_cents via late_fee_accrual"
      - from: OVERDUE
        to: PAID
        trigger: "POST /tenants/{tenant_id}/invoices/{id}/payments where amount_paid_cents reaches total_cents+late_fee_cents"
        actor: TenantAdmin
        preconditions: ["Invoice.invoice_status == OVERDUE"]
        side_effects:
          - "Cascading: Subscription.payment_status -> CURRENT"
          - "Cascading: Tenant.restriction_level -> NONE; Tenant.tenant_status->ACTIVE if was SUSPENDED"
          - "Set Invoice.late_fee_cents=0 post-clearance recompute"
      - from: OVERDUE
        to: WRITTEN_OFF
        trigger: "Cascade from Tenant SUSPENDED->TERMINATED"
        actor: system
        preconditions: ["Tenant transitioning to TERMINATED with OVERDUE invoices"]
        side_effects:
          - "Stop late_fee accrual"
          - "Emit SyncEvent event_type=SUBSCRIPTION_CHANGED target_system=ACCOUNTING"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two upgrade requests on the same subscription submitted simultaneously"
    guarantee: "At most one upgrade succeeds; loser is rejected because Subscription.subscription_status already advanced"
    error_id: ERR_SUBSCRIPTION_CHANGE_IN_FLIGHT
    http_status: 409
    serialization: "First-writer-wins on Subscription.version"
  - scenario: "Upgrade and downgrade race on the same subscription"
    guarantee: "Exactly one operation succeeds; loser receives concurrent-change rejection"
    error_id: ERR_SUBSCRIPTION_CHANGE_IN_FLIGHT
    http_status: 409
    serialization: "First-writer-wins on Subscription.version"
  - scenario: "Two Payments with the same external_reference for the same tenant submitted simultaneously"
    guarantee: "Exactly one Payment is created; duplicate returns the original Payment via idempotency"
    error_id: ERR_DUPLICATE_PAYMENT_REFERENCE
    http_status: 409
    serialization: "First-writer-wins on (tenant_id, external_reference) uniqueness"
  - scenario: "Two UsageRecords with the same idempotency_key on the same subscription submitted simultaneously"
    guarantee: "Exactly one UsageRecord is persisted; second submission returns the original record"
    error_id: ERR_DUPLICATE_USAGE_IDEMPOTENCY_KEY
    http_status: 409
    serialization: "First-writer-wins on (subscription_id, idempotency_key) uniqueness"
  - scenario: "Issue invoice while another issuance for the same subscription cycle is racing"
    guarantee: "At most one Invoice per (subscription_id, cycle_start, pricing_model) is created"
    error_id: ERR_INVOICE_CYCLE_ALREADY_ISSUED
    http_status: 409
    serialization: "First-writer-wins on Invoice composite uniqueness"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: proration_amount
    trigger: "On POST /subscriptions/{id}/upgrade or /downgrade (variants below)"
    algorithm: forward_looking
    formula: |
      let cycle_days        = (cycle_end - cycle_start) in whole days
      let elapsed_days      = floor((now - cycle_start) in days)
      let remaining_days    = cycle_days - elapsed_days
      let old_per_day_cents = current.base_price_cents / cycle_days
      let new_per_day_cents = target.base_price_cents  / cycle_days
      # VARIANT UPGRADE_FORWARD_LOOKING:
      #   prorated_charge_cents =
      #     round_half_up( (new_per_day_cents - old_per_day_cents) * remaining_days )
      # VARIANT DOWNGRADE_CHRONOLOGICAL_REFUND:
      #   # Replay each day already elapsed and charge old rate; only refund the
      #   # difference for the unconsumed remaining_days (NEGATIVE result).
      #   prorated_charge_cents =
      #     round_half_up( (new_per_day_cents - old_per_day_cents) * remaining_days )
      #   # remaining_days < cycle_days here, but the math is signed: when target < current
      #   # the result is naturally negative (refund).
      # Rounding order MUST be: compute the difference per_day in unrounded float cents,
      # multiply by remaining_days, then round_half_up to integer cents at the very end.
    input_set: |
      Subscription.{cycle_start, cycle_end, package_version_id} ; PackageVersion.{base_price_cents};
      target PackageVersion.{base_price_cents}; the current request timestamp (now).
    constants: {}
    precision: "round_half_up to integer cents at the FINAL step only"
    variants:
      - name: UPGRADE_FORWARD_LOOKING
        when: "change_type == UPGRADE"
        difference: "Charges the *delta* per remaining day, looking forward only; ignores how much was already consumed in the current cycle. Sign is POSITIVE (charge)."
      - name: DOWNGRADE_CHRONOLOGICAL_REFUND
        when: "change_type == DOWNGRADE_IMMEDIATE_REFUND"
        difference: "Same formula but evaluated as a chronological reconciliation: the tenant has already been charged for the FULL cycle at the OLD rate; we refund the *forward portion* of the price delta. Sign is NEGATIVE (refund). Although the formula collapses to the same expression, the variant pins the SIGN convention and constrains rounding to be performed on the (already-negative) integer."

  - name: bill_total_calc
    trigger: "On POST /tenants/{tenant_id}/invoices/{id}/issue, and on system-issued invoices at cycle_rollover, trial-conversion, upgrade-proration, and downgrade-refund"
    algorithm: tiered_pricing
    formula: |
      # Step 1: base_line_cents
      if PackageVersion.pricing_model == POSTPAID:
        base_line_cents = 0
      else:
        base_line_cents = PackageVersion.base_price_cents

      # Step 2: tiered_lines_cents — for HYBRID/TIERED only
      tiered_lines_cents = 0
      for metric in {API_CALL, STORAGE_GB, BANDWIDTH_GB, ACTIVE_USER}:
          consumed   = Subscription.quota_consumed[metric] - PackageVersion.included_quotas[metric]
          if consumed <= 0: continue
          remaining = consumed
          for bracket in PackageVersion.tiered_brackets where bracket.metric==metric (in order):
              bracket_capacity = (bracket.upper_bound or +∞) - included_quotas[metric] - (previous brackets capacity)
              take = min(remaining, bracket_capacity)
              tiered_lines_cents += take * bracket.unit_price_cents
              remaining -= take
              if remaining <= 0: break

      # Step 3: overage_lines_cents — for USAGE_BASED + HYBRID residual past last bracket
      overage_lines_cents = 0
      for metric in PackageVersion.overage_rates:
          uncovered = max(consumed_after_tiers, 0)
          overage_lines_cents += uncovered * PackageVersion.overage_rates[metric]

      # Step 4: addon_lines_cents
      addon_lines_cents = sum(addon.monthly_price_cents for addon in selected_addons)

      subtotal_cents = base_line_cents + tiered_lines_cents + overage_lines_cents + addon_lines_cents

      # Step 5: discount and credit
      discount_cents = clamp(Invoice.discount_cents, 0, subtotal_cents)
      taxable_base   = subtotal_cents - discount_cents

      # Step 6: tax — see tax_calculation
      tax_cents = tax_calculation(taxable_base, Jurisdiction)

      # Step 7: credits (applied AFTER tax — credits offset the gross bill, not the taxable base)
      credit_applied_cents = clamp(sum(unapplied CreditNote.amount_cents for tenant), 0, taxable_base + tax_cents)
      credits_pre = credit_applied_cents

      # Step 8: late_fee (only for re-issuance during dunning; new invoice starts at 0)
      late_fee_cents = late_fee_accrual(Invoice)

      total_cents = taxable_base + tax_cents - credit_applied_cents + late_fee_cents
      EVALUATION ORDER IS PINNED — do NOT recompute tax after applying credits.
    input_set: "Subscription.{quota_consumed, package_version_id, selected_addons}; PackageVersion.{base_price_cents, pricing_model, included_quotas, tiered_brackets, overage_rates, addons}; Invoice.{discount_cents}; CreditNotes with applied_to_invoice_id==null for the tenant; Jurisdiction record for tenant.jurisdiction_code."
    constants: {}
    precision: "All intermediate sums in integer cents; rounding deferred to tax_calculation per Jurisdiction.rounding_mode."
    variants: []

  - name: tax_calculation
    trigger: "Called by bill_total_calc"
    algorithm: tiered_pricing
    formula: |
      # Jurisdiction.rounding_mode==PER_LINE:
      #   for each line_item in (base, tiered, overage, addon):
      #       line_tax = round_half_up(line.line_total_cents * Jurisdiction.tax_rate_bps / 10000)
      #   tax_cents = sum of line_tax MINUS round_half_up(Invoice.discount_cents * tax_rate_bps / 10000)
      # Jurisdiction.rounding_mode==TOTAL:
      #   tax_cents = round_half_up( (subtotal_cents - discount_cents) * Jurisdiction.tax_rate_bps / 10000 )
      # The two rounding modes WILL produce different tax_cents for the same inputs.
      # The scaffold pins the order: PER_LINE rounds first then sums; TOTAL sums first then rounds.
    input_set: "Invoice.line_items, Invoice.discount_cents, Jurisdiction.{tax_rate_bps, rounding_mode}"
    constants: {}
    precision: "round_half_up to integer cents at each rounding step"
    variants: []

  - name: late_fee_accrual
    trigger: "On POST /_dunning/run for each ISSUED|PARTIALLY_PAID|OVERDUE invoice with amount_due_cents>0; recomputed on POST /tenants/{tenant_id}/invoices/{id}/payments before zero-out check"
    algorithm: threshold
    formula: |
      days_past_due = floor( (now - Invoice.due_at) / 1 day )
      if days_past_due <= 0:           late_fee_cents = 0
      elif days_past_due <= 30:        late_fee_cents = round_half_up( Invoice.amount_due_cents * 100 / 10000 )   # 1.00%
      elif days_past_due <= 60:        late_fee_cents = round_half_up( Invoice.amount_due_cents * 250 / 10000 )   # 2.50%
      else:                            late_fee_cents = round_half_up( Invoice.amount_due_cents * 500 / 10000 )   # 5.00%
      # Boundary: days_past_due == 31 selects the 60-day bracket. days_past_due == 30 selects the 30-day bracket. The check is "<= 30" inclusive of 30.
    input_set: "Invoice.{due_at, amount_due_cents}; current clock"
    constants:
      RATE_BPS_TIER1: 100
      RATE_BPS_TIER2: 250
      RATE_BPS_TIER3: 500
    precision: "round_half_up integer cents"
    variants: []

  - name: usage_attribution
    trigger: "On POST /tenants/{tenant_id}/subscriptions/{id}/usage ingestion"
    algorithm: chronological
    formula: |
      # Late-arrival handling. attributed_cycle is determined by event_timestamp vs cycle boundaries.
      LATE_ARRIVAL_WINDOW_DAYS = 7
      candidate = the cycle [cs, ce) on this Subscription such that cs <= event_timestamp < ce
      if such cycle exists in the persisted history (current or prior cycle):
          attributed_cycle_start = candidate.cs
      elif event_timestamp >= current_cycle.cycle_end:
          attributed_cycle_start = current_cycle.cycle_start   # future-dated => attribute to current
      elif event_timestamp < current_cycle.cycle_start - LATE_ARRIVAL_WINDOW_DAYS:
          REJECT with ERR_USAGE_TOO_LATE
      else:
          # Within late-arrival window but the historical cycle is already invoiced —
          # attribute to current_cycle.cycle_start (cannot retroactively modify a sealed cycle)
          attributed_cycle_start = current_cycle.cycle_start
      Then add quantity to Subscription.quota_consumed[metric] IF AND ONLY IF
      attributed_cycle_start == current_cycle.cycle_start.
      Idempotency: re-submitting same (subscription_id, idempotency_key) returns the persisted UsageRecord; quota_consumed not double-incremented.
    input_set: "Subscription.{cycle_start, cycle_end}; UsageRecord history; clock"
    constants:
      LATE_ARRIVAL_WINDOW_DAYS: 7
    precision: "integer counts"
    variants: []

  - name: tenant_outstanding_balance
    trigger: "Recomputed on every Invoice status change, every Payment creation, every CreditNote application, dunning, and reactivation."
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum( Invoice.amount_due_cents )
        FOR  Invoice.tenant_id == this tenant
        WHERE Invoice.invoice_status IN {ISSUED, PARTIALLY_PAID, OVERDUE}
        WHERE Invoice.currency == Tenant.currency
      # WRITTEN_OFF, PAID, DRAFT excluded.
      # Cross-tenant rollup for billing_entity_type==PARENT: parents do NOT auto-absorb subsidiary
      # balances in this field; subsidiary balance stays on subsidiary record.
    input_set: "All Invoice rows where invoice_status IN {ISSUED, PARTIALLY_PAID, OVERDUE}"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: quota_carry_forward_rule
    trigger: "On cycle_rollover (PENDING_DOWNGRADE -> ACTIVE, or POSTPAID/PREPAID cycle advancement)"
    algorithm: aggregation
    formula: |
      if NEW PackageVersion.billing_cycle == ANNUAL and pricing_model IN {PREPAID, HYBRID}:
          carry = max( NEW.included_quotas['seats'] + (OLD.included_quotas['seats'] - OLD.quota_consumed['seats']) - NEW.included_quotas['seats'], 0 )
          # ie: unused OLD seats above NEW.included_quotas carry forward
          quota_carry_forward['seats'] = max(OLD.included_quotas['seats'] - OLD.quota_consumed['seats'], 0)
          # other metrics: zero
      else:
          quota_carry_forward = {}  # nothing carries
      # On any package_change (upgrade or downgrade) quota_carry_forward is reset to {} and
      # quota_consumed is reset to {} regardless of cycle alignment.
    input_set: "Old Subscription state at cycle close, new PackageVersion"
    constants: {}
    precision: "integer counts"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered priority)
# =============================================================================
validations:

  # --- Authentication / Authorization ---
  - { priority: 1,  category: auth,                check: "X-User-Role header present and one of {PlatformAdmin, BillingOperator, TenantAdmin}", error_id: ERR_AUTH_MISSING_ROLE,                 http_status: 401, applies_to: all }
  - { priority: 2,  category: auth,                check: "X-User-ID header present",                                                            error_id: ERR_AUTH_MISSING_USER,                 http_status: 401, applies_to: all }
  - { priority: 3,  category: auth,                check: "Role permitted for this endpoint per RBAC matrix",                                    error_id: ERR_FORBIDDEN,                         http_status: 403, applies_to: all }

  # --- Existence (path-level, left-to-right) ---
  - { priority: 4,  category: existence,           check: "Tenant exists",                                                                       error_id: ERR_TENANT_NOT_FOUND,                  http_status: 404, applies_to: all }
  - { priority: 5,  category: existence,           check: "Subscription exists and Subscription.tenant_id == path tenant_id",                   error_id: ERR_SUBSCRIPTION_NOT_FOUND,            http_status: 404, applies_to: "/tenants/{tid}/subscriptions/{id}*" }
  - { priority: 6,  category: existence,           check: "Invoice exists and Invoice.tenant_id == path tenant_id",                              error_id: ERR_INVOICE_NOT_FOUND,                 http_status: 404, applies_to: "/tenants/{tid}/invoices/{id}*" }
  - { priority: 7,  category: existence,           check: "Referenced PackageVersion (by package_code + effective time) exists",                error_id: ERR_PACKAGE_NOT_FOUND,                 http_status: 404, applies_to: "POST /tenants/{tid}/subscriptions, /upgrade, /downgrade" }
  - { priority: 8,  category: existence,           check: "Referenced Jurisdiction exists for tenant.jurisdiction_code",                         error_id: ERR_JURISDICTION_NOT_FOUND,            http_status: 404, applies_to: "POST /tenants, PATCH /tenants/{id}" }

  # --- Multi-tenancy isolation ---
  - { priority: 9,  category: business_referential, check: "TenantAdmin's X-User-ID equals path tenant_id (cross-tenant access forbidden)",      error_id: ERR_CROSS_TENANT_ACCESS,               http_status: 403, applies_to: "all tenant-scoped routes when role==TenantAdmin" }

  # --- State preconditions ---
  - { priority: 10, category: state,               check: "Operation requires Tenant.tenant_status in declared set (per state machine)",        error_id: ERR_TENANT_STATUS_INVALID,             http_status: 409, applies_to: "POST/PATCH/DELETE under /tenants/{id}/**" }
  - { priority: 11, category: state,               check: "Operation requires Subscription.subscription_status in declared set",                error_id: ERR_SUBSCRIPTION_STATUS_INVALID,       http_status: 409, applies_to: "POST /subscriptions/{id}/(upgrade|downgrade|convert|cancel)" }
  - { priority: 12, category: state,               check: "Operation requires Invoice.invoice_status in declared set",                          error_id: ERR_INVOICE_STATUS_INVALID,            http_status: 409, applies_to: "POST /invoices/{id}/issue, /payments" }

  # --- Restriction gating (during dunning) ---
  - { priority: 13, category: business_safety,     check: "Tenant.restriction_level == NONE for mutation endpoints other than payments and reads", error_id: ERR_TENANT_READ_ONLY,                  http_status: 403, applies_to: "All POST/PATCH/DELETE except payments while Tenant.restriction_level IN {READ_ONLY, FEATURE_RESTRICTED}" }
  - { priority: 14, category: business_safety,     check: "Tenant.restriction_level != FEATURE_RESTRICTED when ingesting metric=API_CALL above included_quotas",  error_id: ERR_TENANT_FEATURE_RESTRICTED,         http_status: 403, applies_to: "POST /subscriptions/{id}/usage" }

  # --- Concurrency / OCC ---
  - { priority: 15, category: business_constraint, check: "If version supplied, equals Subscription.version",                                   error_id: ERR_VERSION_CONFLICT,                  http_status: 409, applies_to: "PATCH /subscriptions/{id}, /upgrade, /downgrade" }
  - { priority: 16, category: business_constraint, check: "Subscription has no in-flight change (no other concurrent /upgrade or /downgrade)",  error_id: ERR_SUBSCRIPTION_CHANGE_IN_FLIGHT,     http_status: 409, applies_to: "POST /subscriptions/{id}/(upgrade|downgrade)" }

  # --- Business referential integrity ---
  - { priority: 17, category: business_referential, check: "On Tenant create with billing_entity_type==SUBSIDIARY, parent_tenant_id refers to existing tenant with billing_entity_type==PARENT", error_id: ERR_INVALID_PARENT_TENANT,             http_status: 422, applies_to: "POST /tenants" }
  - { priority: 18, category: business_referential, check: "PackageVersion.currency == Tenant.currency at subscription creation/upgrade",       error_id: ERR_CURRENCY_MISMATCH,                 http_status: 422, applies_to: "POST /tenants/{tid}/subscriptions, /upgrade, /downgrade" }
  - { priority: 19, category: business_referential, check: "Payment.currency == Invoice.currency",                                              error_id: ERR_CURRENCY_MISMATCH,                 http_status: 422, applies_to: "POST /tenants/{tid}/invoices/{id}/payments" }

  # --- Business temporal ---
  - { priority: 20, category: business_temporal,    check: "POST /subscriptions/{id}/upgrade — target package_version.base_price_cents > current.base_price_cents", error_id: ERR_NOT_AN_UPGRADE,                    http_status: 422, applies_to: "POST /subscriptions/{id}/upgrade" }
  - { priority: 21, category: business_temporal,    check: "POST /subscriptions/{id}/downgrade — target package_version.base_price_cents < current.base_price_cents", error_id: ERR_NOT_A_DOWNGRADE,                   http_status: 422, applies_to: "POST /subscriptions/{id}/downgrade" }
  - { priority: 22, category: business_temporal,    check: "Usage event_timestamp not earlier than (current_cycle.cycle_start - LATE_ARRIVAL_WINDOW_DAYS)",  error_id: ERR_USAGE_TOO_LATE,                    http_status: 422, applies_to: "POST /subscriptions/{id}/usage" }

  # --- Business constraint (uniqueness, idempotency, fiscal) ---
  - { priority: 23, category: business_constraint,  check: "(subscription_id, idempotency_key) globally unique on UsageRecord",                  error_id: ERR_DUPLICATE_USAGE_IDEMPOTENCY_KEY,   http_status: 409, applies_to: "POST /subscriptions/{id}/usage" }
  - { priority: 24, category: business_constraint,  check: "(tenant_id, external_reference) globally unique on Payment",                        error_id: ERR_DUPLICATE_PAYMENT_REFERENCE,       http_status: 409, applies_to: "POST /tenants/{tid}/invoices/{id}/payments" }
  - { priority: 25, category: business_constraint,  check: "(subscription_id, cycle_start, pricing_model) uniqueness on Invoice",               error_id: ERR_INVOICE_CYCLE_ALREADY_ISSUED,      http_status: 409, applies_to: "POST /invoices/{id}/issue and system cycle-rollover invoices" }
  - { priority: 26, category: business_constraint,  check: "(package_code, version_number) uniqueness on PackageVersion",                       error_id: ERR_PACKAGE_VERSION_DUPLICATE,         http_status: 409, applies_to: "POST /packages" }
  - { priority: 27, category: business_constraint,  check: "Payment.amount_cents > 0",                                                          error_id: ERR_INVALID_AMOUNT,                    http_status: 422, applies_to: "POST /tenants/{tid}/invoices/{id}/payments" }
  - { priority: 28, category: business_constraint,  check: "Invoice.discount_cents >= 0 AND <= Invoice.subtotal_cents",                          error_id: ERR_DISCOUNT_EXCEEDS_SUBTOTAL,         http_status: 422, applies_to: "PATCH /tenants/{tid}/invoices/{id} (discount field)" }
  - { priority: 29, category: business_constraint,  check: "Quantity in UsageRecord >= 0",                                                       error_id: ERR_INVALID_USAGE_QUANTITY,            http_status: 422, applies_to: "POST /subscriptions/{id}/usage" }

  # --- Business fiscal (outstanding balance & termination) ---
  - { priority: 30, category: business_fiscal,      check: "DELETE /tenants/{id} — Tenant.outstanding_balance_cents == 0",                       error_id: ERR_OUTSTANDING_BALANCE_EXISTS,        http_status: 422, applies_to: "DELETE /tenants/{id}" }
  - { priority: 31, category: business_fiscal,      check: "DELETE /tenants/{id} — no SUBSIDIARY tenants attached when this Tenant is PARENT",   error_id: ERR_TENANT_HAS_SUBSIDIARIES,           http_status: 422, applies_to: "DELETE /tenants/{id}" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Tenants ----
  - { method: POST,   path: "/tenants",                                            description: "Create a tenant (TRIAL by default)", roles: [PlatformAdmin],                          code: 201, input: [legal_name, contact_email, contact_phone, billing_entity_type, "parent_tenant_id?", currency, jurisdiction_code, "trial_expires_at?"],  output: Tenant, side_effects: ["Emit SyncEvent SUBSCRIPTION_CREATED target_system=CRM (placeholder until first subscription)", "AuditLog action=TENANT_STATUS_CHANGE"] }
  - { method: GET,    path: "/tenants",                                            description: "List tenants (PlatformAdmin only; TenantAdmin gets 403)", roles: [PlatformAdmin],          code: 200, input: ["limit?", "offset?", "tenant_status?"], output: "Tenant[]", side_effects: [] }
  - { method: GET,    path: "/tenants/{id}",                                       description: "Get tenant",                            roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: [], output: Tenant, side_effects: [] }
  - { method: PATCH,  path: "/tenants/{id}",                                       description: "Update tenant profile/contact",         roles: [PlatformAdmin, TenantAdmin],            code: 200, input: ["legal_name?", "contact_email?", "contact_phone?", "version?"], output: Tenant, side_effects: ["AuditLog action=TENANT_STATUS_CHANGE"] }
  - { method: DELETE, path: "/tenants/{id}",                                       description: "Terminate tenant (must have outstanding_balance=0)", roles: [PlatformAdmin],            code: 204, input: [], output: null, side_effects: ["Cancel active Subscription", "AuditLog action=TENANT_STATUS_CHANGE", "Emit SyncEvent SUBSCRIPTION_CHANGED target_system=ACCOUNTING"] }

  # ---- Packages ----
  - { method: POST,   path: "/packages",                                           description: "Define a new PackageVersion",            roles: [PlatformAdmin],                          code: 201, input: [package_code, version_number, package_type, effective_from, base_price_cents, currency, billing_cycle, pricing_model, included_quotas, tiered_brackets, overage_rates, addons], output: PackageVersion, side_effects: [] }
  - { method: GET,    path: "/packages",                                           description: "List packages, latest effective version per package_code",  roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: ["package_code?", "package_type?", "limit?", "offset?"], output: "PackageVersion[]", side_effects: [] }
  - { method: GET,    path: "/packages/{id}",                                      description: "Get a specific PackageVersion",          roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: [], output: PackageVersion, side_effects: [] }

  # ---- Subscriptions ----
  - { method: POST,   path: "/tenants/{tenant_id}/subscriptions",                  description: "Create subscription in TRIAL state",     roles: [PlatformAdmin, TenantAdmin],            code: 201, input: [package_code, "selected_addons?"],                                                  output: Subscription, side_effects: ["Lock package_version_id", "AuditLog action=SUBSCRIPTION_CREATE"] }
  - { method: GET,    path: "/tenants/{tenant_id}/subscriptions/{id}",             description: "Get subscription",                       roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST,   path: "/tenants/{tenant_id}/subscriptions/{id}/convert",     description: "Trial-to-paid conversion",               roles: [PlatformAdmin, TenantAdmin],            code: 200, input: ["version?"],                                                                         output: Subscription, side_effects: ["Tenant -> ACTIVE", "Issue prepaid Invoice", "Emit SyncEvent", "AuditLog SUBSCRIPTION_CREATE"] }
  - { method: POST,   path: "/tenants/{tenant_id}/subscriptions/{id}/upgrade",     description: "Immediate upgrade with prorated charge", roles: [PlatformAdmin, TenantAdmin],            code: 200, input: [target_package_code, "version?"],                                                    output: Subscription, side_effects: ["Replace package_version_id", "Create SubscriptionChange UPGRADE", "Issue prorated Invoice", "Reset quota_consumed", "AuditLog SUBSCRIPTION_UPGRADE", "Emit SyncEvent"] }
  - { method: POST,   path: "/tenants/{tenant_id}/subscriptions/{id}/downgrade",   description: "Downgrade end-of-cycle or immediate-refund (mode query param)", roles: [PlatformAdmin, TenantAdmin], code: 200, input: [target_package_code, mode, "version?"],                                             output: Subscription, side_effects: ["If END_OF_CYCLE: set pending_change_package_version_id, status -> PENDING_DOWNGRADE", "If IMMEDIATE_REFUND: replace package_version_id, create CreditNote REFUND_DOWNGRADE", "AuditLog SUBSCRIPTION_DOWNGRADE"] }
  - { method: DELETE, path: "/tenants/{tenant_id}/subscriptions/{id}",             description: "Cancel subscription",                    roles: [PlatformAdmin, TenantAdmin],            code: 204, input: ["version?"],                                                                         output: null, side_effects: ["Issue final POSTPAID Invoice if needed", "AuditLog"] }
  - { method: GET,    path: "/tenants/{tenant_id}/subscriptions/{id}/changes",     description: "List subscription change history",        roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: ["limit?", "offset?"], output: "SubscriptionChange[]", side_effects: [] }

  # ---- Usage ----
  - { method: POST,   path: "/tenants/{tenant_id}/subscriptions/{id}/usage",       description: "Ingest a usage record (real-time or batch)", roles: [PlatformAdmin, TenantAdmin],         code: 201, input: [idempotency_key, metric, quantity, event_timestamp, ingestion_mode],              output: UsageRecord, side_effects: ["Increment Subscription.quota_consumed if attributed to current cycle"] }
  - { method: GET,    path: "/tenants/{tenant_id}/subscriptions/{id}/usage",       description: "List usage records (paginated, filterable)", roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: ["metric?", "cycle_start?", "archived?", "limit?", "offset?"], output: "UsageRecord[]", side_effects: [] }

  # ---- Invoices ----
  - { method: GET,    path: "/tenants/{tenant_id}/invoices",                       description: "List invoices",                          roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: ["invoice_status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET,    path: "/tenants/{tenant_id}/invoices/{id}",                  description: "Get invoice",                            roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: PATCH,  path: "/tenants/{tenant_id}/invoices/{id}",                  description: "Apply discount before issuance (DRAFT only)", roles: [PlatformAdmin, BillingOperator],  code: 200, input: [discount_cents, "version?"],                                                         output: Invoice, side_effects: ["Recompute subtotal/tax/total via bill_total_calc", "AuditLog INVOICE_ADJUSTMENT"] }
  - { method: POST,   path: "/tenants/{tenant_id}/invoices/{id}/issue",            description: "Issue an invoice (DRAFT -> ISSUED)",     roles: [PlatformAdmin, BillingOperator],        code: 200, input: ["version?"],                                                                         output: Invoice, side_effects: ["Freeze line items", "Set due_at", "Emit SyncEvent INVOICE_ISSUED target_system=ACCOUNTING"] }
  - { method: POST,   path: "/tenants/{tenant_id}/invoices/{id}/payments",         description: "Apply payment to invoice",               roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 201, input: [amount_cents, currency, external_reference],                                       output: Payment, side_effects: ["Recompute Invoice.amount_due_cents", "Cascade Subscription.payment_status / Tenant.restriction_level / tenant_status if cleared", "Emit SyncEvent PAYMENT_RECEIVED target_system=PAYMENT_PAY"] }

  # ---- Credit notes ----
  - { method: POST,   path: "/tenants/{tenant_id}/credit-notes",                   description: "Issue a manual credit note",             roles: [PlatformAdmin, BillingOperator],        code: 201, input: [origin, amount_cents, "applied_to_invoice_id?"],                                     output: CreditNote, side_effects: ["If applied_to_invoice_id given: subtract from Invoice.total via bill_total_calc", "AuditLog CREDIT_ISSUE"] }
  - { method: GET,    path: "/tenants/{tenant_id}/credit-notes",                   description: "List credit notes for tenant",           roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: ["limit?", "offset?"], output: "CreditNote[]", side_effects: [] }

  # ---- Jurisdictions ----
  - { method: POST,   path: "/jurisdictions",                                      description: "Define a tax jurisdiction",              roles: [PlatformAdmin],                          code: 201, input: [jurisdiction_code, tax_rate_bps, rounding_mode], output: Jurisdiction, side_effects: [] }
  - { method: GET,    path: "/jurisdictions",                                      description: "List jurisdictions",                     roles: [PlatformAdmin, BillingOperator],         code: 200, input: ["limit?", "offset?"], output: "Jurisdiction[]", side_effects: [] }

  # ---- Sync events & audit ----
  - { method: GET,    path: "/tenants/{tenant_id}/sync-events",                    description: "List sync events emitted for this tenant", roles: [PlatformAdmin, BillingOperator],       code: 200, input: ["target_system?", "event_type?", "limit?", "offset?"], output: "SyncEvent[]", side_effects: [] }
  - { method: GET,    path: "/tenants/{tenant_id}/audit-logs",                     description: "List audit logs for this tenant",        roles: [PlatformAdmin, BillingOperator, TenantAdmin], code: 200, input: ["action?", "limit?", "offset?"], output: "AuditLog[]", side_effects: [] }

  # ---- Test harness drivers (REQUIRED for clock-gated transitions) ----
  - { method: POST,   path: "/_clock/advance",                                     description: "Advance system clock by a delta (test harness; required to drive trial expiry, due_at, late-fee tiers, cycle_rollover, PENDING_DOWNGRADE finalization)", roles: [PlatformAdmin], code: 200, input: [seconds],   output: "{ now }", side_effects: ["May trigger trial_expires_at automatic Tenant TRIAL->TERMINATED if no active subscription", "May trigger PENDING_DOWNGRADE->ACTIVE cycle_rollover"] }
  - { method: POST,   path: "/_dunning/run",                                       description: "Run the dunning sweep — advances payment_status tiers and emits restriction/suspension cascades. Test harness only.", roles: [PlatformAdmin], code: 200, input: [], output: "{ scanned, transitioned }", side_effects: ["Subscription.payment_status tier advances", "Tenant.restriction_level upgrades", "Tenant.tenant_status -> SUSPENDED or TERMINATED", "Invoice late_fee recompute"] }
  - { method: POST,   path: "/_archive/run",                                       description: "Run usage-archive sweep — marks UsageRecord.archived=true for records older than archive_cutoff. Test harness only.", roles: [PlatformAdmin], code: 200, input: [cutoff_iso], output: "{ archived_count }", side_effects: ["UsageRecord.archived flag flips"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth / authz ----
  - { id: ERR_AUTH_MISSING_ROLE,                http: 401, condition: "X-User-Role header missing or value not one of recognized roles" }
  - { id: ERR_AUTH_MISSING_USER,                http: 401, condition: "X-User-ID header missing" }
  - { id: ERR_FORBIDDEN,                        http: 403, condition: "Role not authorized for endpoint per RBAC matrix" }
  - { id: ERR_CROSS_TENANT_ACCESS,              http: 403, condition: "TenantAdmin's X-User-ID does not match path tenant_id" }
  - { id: ERR_TENANT_READ_ONLY,                 http: 403, condition: "Tenant.restriction_level=READ_ONLY blocks mutation except payments and reads" }
  - { id: ERR_TENANT_FEATURE_RESTRICTED,        http: 403, condition: "Tenant.restriction_level=FEATURE_RESTRICTED blocks API_CALL usage ingestion beyond included_quotas" }

  # ---- existence ----
  - { id: ERR_TENANT_NOT_FOUND,                 http: 404, condition: "Tenant id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND,           http: 404, condition: "Subscription id does not exist or does not belong to path tenant" }
  - { id: ERR_INVOICE_NOT_FOUND,                http: 404, condition: "Invoice id does not exist or does not belong to path tenant" }
  - { id: ERR_PACKAGE_NOT_FOUND,                http: 404, condition: "PackageVersion not resolvable for package_code at given timestamp" }
  - { id: ERR_JURISDICTION_NOT_FOUND,           http: 404, condition: "Jurisdiction.jurisdiction_code does not exist" }

  # ---- state ----
  - { id: ERR_TENANT_STATUS_INVALID,            http: 409, condition: "Tenant.tenant_status not in allowed set for this transition" }
  - { id: ERR_SUBSCRIPTION_STATUS_INVALID,      http: 409, condition: "Subscription.subscription_status not in allowed set for this operation" }
  - { id: ERR_INVOICE_STATUS_INVALID,           http: 409, condition: "Invoice.invoice_status not in allowed set (e.g., issue on non-DRAFT)" }

  # ---- concurrency / OCC / idempotency ----
  - { id: ERR_VERSION_CONFLICT,                 http: 409, condition: "Supplied version != server-stored version" }
  - { id: ERR_SUBSCRIPTION_CHANGE_IN_FLIGHT,    http: 409, condition: "Concurrent /upgrade or /downgrade on same Subscription" }
  - { id: ERR_DUPLICATE_USAGE_IDEMPOTENCY_KEY,  http: 409, condition: "Duplicate (subscription_id, idempotency_key) on UsageRecord with conflicting payload — pure idempotent replay with identical body returns the existing record with 201 (per spec)" }
  - { id: ERR_DUPLICATE_PAYMENT_REFERENCE,      http: 409, condition: "Duplicate (tenant_id, external_reference) on Payment with conflicting payload — pure idempotent replay returns existing Payment with 201" }
  - { id: ERR_INVOICE_CYCLE_ALREADY_ISSUED,     http: 409, condition: "(subscription_id, cycle_start, pricing_model) already has an issued Invoice" }
  - { id: ERR_PACKAGE_VERSION_DUPLICATE,        http: 409, condition: "(package_code, version_number) already exists" }

  # ---- business referential ----
  - { id: ERR_INVALID_PARENT_TENANT,            http: 422, condition: "billing_entity_type=SUBSIDIARY but parent_tenant_id missing or not a PARENT tenant" }
  - { id: ERR_CURRENCY_MISMATCH,                http: 422, condition: "Currency mismatch between PackageVersion/Tenant or Payment/Invoice" }

  # ---- business constraint / fiscal / temporal ----
  - { id: ERR_NOT_AN_UPGRADE,                   http: 422, condition: "Target PackageVersion.base_price_cents <= current (so it's not an upgrade)" }
  - { id: ERR_NOT_A_DOWNGRADE,                  http: 422, condition: "Target PackageVersion.base_price_cents >= current (so it's not a downgrade)" }
  - { id: ERR_USAGE_TOO_LATE,                   http: 422, condition: "event_timestamp predates current_cycle.cycle_start - LATE_ARRIVAL_WINDOW_DAYS" }
  - { id: ERR_INVALID_AMOUNT,                   http: 422, condition: "Amount must be a positive integer" }
  - { id: ERR_INVALID_USAGE_QUANTITY,           http: 422, condition: "UsageRecord.quantity < 0" }
  - { id: ERR_DISCOUNT_EXCEEDS_SUBTOTAL,        http: 422, condition: "Invoice.discount_cents > subtotal_cents or < 0" }
  - { id: ERR_OUTSTANDING_BALANCE_EXISTS,       http: 422, condition: "Cannot terminate tenant — outstanding_balance_cents > 0" }
  - { id: ERR_TENANT_HAS_SUBSIDIARIES,          http: 422, condition: "Cannot terminate PARENT tenant while SUBSIDIARY tenants remain" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator. Full access across all tenants. Manages packages, jurisdictions, test-harness endpoints. X-User-ID is operator identifier (opaque)."
    identity: opaque
    exclusive_operations:
      - "POST /packages"
      - "POST /jurisdictions"
      - "POST /_clock/advance"
      - "POST /_dunning/run"
      - "POST /_archive/run"
      - "POST /tenants"
      - "DELETE /tenants/{id}"
      - "GET /tenants (list across all tenants)"
    shared_operations:
      - "GET /tenants/{id}"
      - "PATCH /tenants/{id}"
      - "POST/GET/PATCH/DELETE under /tenants/{tenant_id}/subscriptions/**"
      - "POST/GET/PATCH under /tenants/{tenant_id}/invoices/**"
      - "POST /tenants/{tenant_id}/invoices/{id}/payments"
      - "POST/GET /tenants/{tenant_id}/credit-notes"
      - "POST/GET /tenants/{tenant_id}/subscriptions/{id}/usage"
      - "GET /tenants/{tenant_id}/sync-events"
      - "GET /tenants/{tenant_id}/audit-logs"
      - "GET /packages, /packages/{id}, /jurisdictions"

  - name: BillingOperator
    description: "Finance/billing operator. Can adjust invoices, issue credits, view all tenants' invoices, but cannot create tenants or change tenant lifecycle. X-User-ID is operator identifier (opaque)."
    identity: opaque
    exclusive_operations:
      - "PATCH /tenants/{tenant_id}/invoices/{id} (discount adjustment)"
      - "POST /tenants/{tenant_id}/credit-notes"
    shared_operations:
      - "GET /tenants/{id}"
      - "GET /tenants/{tenant_id}/subscriptions/{id} and /changes"
      - "GET /tenants/{tenant_id}/invoices, /invoices/{id}"
      - "POST /tenants/{tenant_id}/invoices/{id}/issue"
      - "POST /tenants/{tenant_id}/invoices/{id}/payments"
      - "GET /tenants/{tenant_id}/subscriptions/{id}/usage"
      - "GET /tenants/{tenant_id}/credit-notes, /sync-events, /audit-logs"
      - "GET /packages, /packages/{id}, /jurisdictions"

  - name: TenantAdmin
    description: "End-customer administrator. X-User-Role=TenantAdmin requires X-User-ID == Tenant.id for the path tenant (cross-tenant access -> ERR_CROSS_TENANT_ACCESS). Cannot read other tenants."
    identity: "entity_backed:Tenant"
    exclusive_operations: []
    shared_operations:
      - "GET /tenants/{id} (own tenant only)"
      - "PATCH /tenants/{id} (contact/profile only on own tenant)"
      - "POST /tenants/{tenant_id}/subscriptions"
      - "GET /tenants/{tenant_id}/subscriptions/{id} and /changes"
      - "POST /tenants/{tenant_id}/subscriptions/{id}/convert"
      - "POST /tenants/{tenant_id}/subscriptions/{id}/upgrade"
      - "POST /tenants/{tenant_id}/subscriptions/{id}/downgrade"
      - "DELETE /tenants/{tenant_id}/subscriptions/{id}"
      - "POST /tenants/{tenant_id}/subscriptions/{id}/usage"
      - "GET /tenants/{tenant_id}/subscriptions/{id}/usage"
      - "GET /tenants/{tenant_id}/invoices, /invoices/{id}"
      - "POST /tenants/{tenant_id}/invoices/{id}/payments"
      - "GET /tenants/{tenant_id}/credit-notes"
      - "GET /tenants/{tenant_id}/audit-logs"
      - "GET /packages, /packages/{id}"
