            - "CuringCycle.${cyc_a_id}.steam_demand_bhp == 40 and CuringCycle.${cyc_b_id}.steam_demand_bhp == 40"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: bed_committed_strand_force_returns_to_baseline_after_abort
        grounds:
          - state_machines.BedRun.SCHEDULED_to_TENSIONED
          - state_machines.BedRun.TENSIONED_to_SCHEDULED
          - entities.CastingBed.fields.committed_strand_force_kips
          - calculations.strand_jacking_force
        distinguishing_aspect: |
          Conserved quantity 1 is a FORCE in kips. The invariant is
          CastingBed.committed_strand_force_kips == sum of BedRun.computed_jacking_force_kips over
          runs on that bed with status IN {TENSIONED, CURING, RELEASE_READY, RELEASED}; tension
          followed by abort-tensioning must return it to exactly 0.00 with no residue.
        test_recipe:
          setup:
            - "Bed B1 is AVAILABLE with committed_strand_force_kips 0.00 and cumulative_cycle_count 0."
            - "Run R1 on B1 is SCHEDULED and has never been tensioned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix_id: $.data.id }
            - call: "POST /mix-designs/${mix_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /steam-zones"
              payload: { zone_code: "Z1", boiler_capacity_bhp: 100, therm_rate_cents_per_therm: 95 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
            - call: "POST /casting-beds"
              payload: { bed_code: "B1", steam_zone_id: "${zone_id}", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed_id: $.data.id }
            - call: "POST /bed-runs"
              payload: { bed_id: "${bed_id}", mix_design_id: "${mix_id}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-04T06:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { run_id: $.data.id }
            - call: "GET /casting-beds/${bed_id}"
              payload: {}
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { bed_force_before: $.data.committed_strand_force_kips }
          trigger:
            - call: "POST /bed-runs/${run_id}/tension"
              payload: { strand_count: 24, strand_diameter_in: 0.500, measured_elongation_in: 35.500 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /bed-runs/${run_id}/abort-tensioning"
              payload: { reason: "Chuck slip detected on strand 7" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
          assert:
            - "${bed_force_before} == 0.00"
            - "between the two trigger calls CastingBed.${bed_id}.committed_strand_force_kips == 768.00 and status == OCCUPIED"
            - "CastingBed.${bed_id}.committed_strand_force_kips == 0.00 (exactly the pre-tension baseline)"
            - "CastingBed.${bed_id}.status == AVAILABLE"
            - "CastingBed.${bed_id}.cumulative_cycle_count == 0 (an abort is not a completed cycle)"
            - "BedRun.${run_id}.status == SCHEDULED"
            - "BedRun.${run_id}.computed_jacking_force_kips == null"
            - "BedRun.${run_id}.strand_count == null and strand_diameter_in == null and measured_elongation_in == null"
            - "BedRun.${run_id}.theoretical_elongation_in == null and elongation_deviation_pct == null"

      - name: yard_stored_weight_returns_to_baseline_after_restack_pull
        grounds:
          - state_machines.YardPlacement.ACTIVE_to_RELEASED
          - state_machines.Piece.production_status.YARDED_to_STRIPPED
          - calculations.yard_slot_occupancy
          - entities.YardSlot.fields.occupied_weight_lb
          - concurrency_rules[placement-create-stale-slot]
        distinguishing_aspect: |
          Conserved quantity 2 is a MASS in pounds, on an entirely different pair of entities. The
          invariant is sum over all YardSlot.occupied_weight_lb == sum of Piece.weight_lb over pieces
          with production_status == YARDED; placing then pulling with release_reason RESTACK must
          bring both sides back to 0 and leave the slot EMPTY.
        test_recipe:
          setup:
            - "Piece DT-101 (48200 lb) has been released and stripped and is production_status STRIPPED."
            - "Yard slot S1 has capacity_weight_lb 120000, max_stack_count 3, occupied_weight_lb 0, stacked_count 0 and status EMPTY."
