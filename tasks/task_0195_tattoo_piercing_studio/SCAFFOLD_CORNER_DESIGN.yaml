              as: Client
              as_user_id: "${cid}"
              captures: { ap1: $.data.id }
          trigger:
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${chid}", expected_chair_version: "${chv}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 60, start_at: "2026-07-01T14:00:00Z", end_at: "2026-07-01T15:00:00Z" }
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response HTTP status == 412"

      - name: occ_deposit_stale_appointment_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[deposit-pay-stale-appointment]", entities.Appointment.fields.version]
        distinguishing_aspect: "Paying a deposit bumps Appointment.version; a second deposit reusing the pre-bump expected_appointment_version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["One HELD appointment at version V; first deposit advances it to V+1."]
