            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GZ2", full_name: "CGZ2", home_state: "TX" }, as: CarrierAdmin, captures: { cz2: $.data.id } }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gz}", counselor_id: "${cz1}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cza: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cza}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gz}", counselor_id: "${cz2}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { czb: $.data.id } }
          trigger:
            - { call: "POST /employer-groups/${gz}/suspend", payload: {}, as: CarrierAdmin }
