            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "B Bank AG", swift_bic: "BBBBDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-2", expected_monthly_volume_usd: 400000.00, expected_monthly_count: 80, nested_activity_permitted: false }
