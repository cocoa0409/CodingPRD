            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "MOAT", period_start: "2026-08-01", period_end: "2026-08-07", measured_impressions: 100000, viewable_impressions: 80000, ivt_impressions: 5000 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr_id: $.data.id } }
            - { call: "POST /make-goods", payload: { verification_report_id: "${vr_id}", kind: "CREDIT", credit_cents: 1000 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { mg_id: $.data.id } }
