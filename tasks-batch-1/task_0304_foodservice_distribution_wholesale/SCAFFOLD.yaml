scenario: |
  Foodservice Distribution & Wholesale Ordering (B2B): customer order guide & catalog,
  cutoff & route/delivery day, case/split pricing tiers, credit terms & hold,
  substitution & out-of-stock, pick/load & proof of delivery, returns/credit memo,
  par-based replenishment

domain_name: foodservice-distribution-wholesale
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # All entities are peer top-level collections (/products, /orders, /customers, ...) keyed
  # by FK references in request bodies rather than nested URL paths. Distributor is the tenant
  # scope every other entity carries as distributor_id; Order/OrderLine, Shipment, Return,
  # OrderGuide/OrderGuideItem, InventoryLot/PriceTier all link by FK, not by URL nesting.

  state_machine_shape: parallel
  # Order carries two independent dimensions: fulfillment_status (DRAFT..DELIVERED) and
  # credit_status (PENDING/APPROVED/ON_HOLD). Return adds a branching revert loop and
  # Shipment a linear pick/load/POD pipeline; Customer carries a posture-style AR status.

  relationship_patterns:
    - one_to_many        # Distributor -> Customer; Order -> OrderLine; Product -> InventoryLot
    - cross_aggregate    # OrderLine references Product, InventoryLot, OrderGuideItem across aggregates
    - self_referential   # Product.substitute_product_id references another Product

  role_model: peer_roles
  # SalesRep owns customer-facing order capture; WarehouseOp owns pick/load/POD;
  # CreditManager owns credit holds/releases & credit-memo approval; DistributorAdmin
  # is the operational superset for catalog/pricing/route configuration.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Distribution company name" }
      - { name: current_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Server clock for cutoff/delivery-day math; advanced only via /_clock/set_current_utc" }
      - { name: catalog_revision, type: integer, source: system, default: 0, description: "Increments whenever any Product or PriceTier under this distributor is created or repriced" }

  - name: Warehouse
    parent: Distributor
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: code, type: string, source: input, description: "Short warehouse code, unique per distributor", constraints: "unique within distributor" }
      - { name: name, type: string, source: input, description: "Warehouse display name" }

  - name: Route
    parent: Distributor
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; warehouse that picks/loads this route" }
      - { name: code, type: string, source: input, description: "Route code, unique per distributor", constraints: "unique within distributor" }
      - { name: delivery_dow, type: integer, source: input, description: "Delivery day of week, 0=Monday .. 6=Sunday", constraints: "0..6" }
      - { name: cutoff_lead_hours, type: integer, source: input, description: "Hours before delivery midnight UTC by which an order must be submitted", constraints: ">= 0" }
      - { name: min_delivery_gap_days, type: integer, source: input, default: 0, description: "Minimum whole-day buffer required between two deliveries to the same customer on this route; a new order whose requested_delivery_date is within this buffer of an existing active order's delivery date is rejected", constraints: ">= 0" }

  - name: Product
    parent: Distributor
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: sku, type: string, source: input, description: "Stock keeping unit, unique per distributor", constraints: "unique within distributor" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: category, type: string, source: input, description: "Merch category (e.g., DAIRY, PRODUCE, DRY)" }
      - { name: splits_per_case, type: integer, source: input, description: "Number of split (each) units per case", constraints: ">= 1" }
      - { name: split_allowed, type: boolean, source: input, default: true, description: "Whether the product may be ordered in SPLIT uom" }
      - { name: perishable, type: boolean, source: input, default: false, description: "If true, lots carry expiration and allocate FEFO" }
      - { name: substitute_product_id, type: string, source: input, description: "FK -> Product.id; default substitution target when out of stock (null = none)", default: null }
      - { name: case_cost_cents, type: integer, source: input, description: "Distributor landed cost per case in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DISCONTINUED" }

  - name: PriceTier
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; copied from product" }
      - { name: min_cases, type: integer, source: input, description: "Inclusive lower bound (in CASE equivalents) at which this tier's case price applies", constraints: ">= 1" }
      - { name: case_price_cents, type: integer, source: input, description: "Price per case in cents when ordered case-equiv >= min_cases and < next tier's min_cases", constraints: ">= 0" }

  - name: Customer
    parent: Distributor
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: route_id, type: string, source: input, description: "FK -> Route.id; the delivery route this ship-to is on" }
      - { name: name, type: string, source: input, description: "Customer / ship-to name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open AR exposure permitted", constraints: ">= 0" }
      - { name: split_fee_cents, type: integer, source: input, default: 0, description: "Per-split-line handling surcharge in cents added to any SPLIT order line for this customer", constraints: ">= 0" }
      - { name: ar_balance_cents, type: integer, source: computed, default: 0, description: "Open AR exposure: increased at credit approval, decreased at cancel/credit-memo" }
      - { name: ar_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CREDIT_HOLD | CLOSED" }

  - name: OrderGuide
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; copied from customer" }
      - { name: name, type: string, source: input, description: "Order guide name (a customer may have several, e.g., WEEKLY, DRY)" }

  - name: OrderGuideItem
    parent: OrderGuide
    common_fields: true
    fields:
      - { name: order_guide_id, type: string, source: input, description: "FK -> OrderGuide.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the catalog product this guide line tracks" }
      - { name: par_level_splits, type: integer, source: input, description: "Target on-hand par expressed in split (each) units; replenishment fills up to this", constraints: ">= 0" }
      - { name: on_hand_splits, type: integer, source: input, default: 0, description: "Last-reported customer on-hand in split units (input to par replenishment)", constraints: ">= 0" }

  - name: InventoryLot
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; lot is stocked at this warehouse" }
      - { name: lot_code, type: string, source: input, description: "Vendor lot code" }
      - { name: expires_on, type: datetime, source: input, description: "Lot expiration timestamp (UTC); drives FEFO ordering for perishables", default: null }
      - { name: on_hand_splits, type: integer, source: input, description: "Sellable quantity in split units", constraints: ">= 0" }
      - { name: reserved_splits, type: integer, source: computed, default: 0, description: "Split units reserved by APPROVED, not-yet-shipped order lines against this lot" }

  - name: Order
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; copied from customer" }
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; snapshotted from customer at submit", default: null }
      - { name: requested_delivery_date, type: datetime, source: input, description: "Requested delivery calendar date (UTC midnight); must match route delivery_dow and beat cutoff" }
      - { name: fulfillment_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | PICKING | LOADED | DELIVERED | CANCELLED" }
      - { name: credit_status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | ON_HOLD (independent dimension from fulfillment_status)" }
      - { name: goods_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of OrderLine.extended_price_cents across non-removed lines" }
      - { name: split_fee_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-split-line handling fees across SPLIT lines" }
      - { name: order_total_cents, type: integer, source: computed, default: 0, description: "goods_subtotal_cents + split_fee_total_cents" }
      - { name: settled, type: boolean, source: system, default: false, description: "True once delivery POD is captured; order no longer counts as open for customer-close" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product originally requested on this line" }
      - { name: order_guide_item_id, type: string, source: input, description: "FK -> OrderGuideItem.id; optional guide line this was placed from (null = ad hoc)", default: null }
      - { name: uom, type: enum, source: input, description: "CASE | SPLIT" }
      - { name: ordered_qty, type: integer, source: input, description: "Quantity in the chosen uom", constraints: ">= 1" }
      - { name: fulfilled_product_id, type: string, source: computed, description: "FK -> Product.id; product actually allocated (== product_id unless substituted)", default: null }
      - { name: allocated_splits, type: integer, source: computed, default: 0, description: "Split-equivalent quantity reserved from inventory for this line" }
      - { name: substituted, type: boolean, source: computed, default: false, description: "True when fulfilled_product_id differs from product_id" }
      - { name: short_splits, type: integer, source: computed, default: 0, description: "Split-equivalent quantity that could not be allocated (out-of-stock shortfall)" }
      - { name: unit_case_price_cents, type: integer, source: computed, default: 0, description: "Tier-selected case price applied to this line at approval" }
      - { name: extended_price_cents, type: integer, source: computed, default: 0, description: "Line goods price = priced cases * unit_case_price_cents + split residual, see calculations" }
      - { name: line_status, type: enum, source: system, default: "OPEN", description: "OPEN | ALLOCATED | SHORTED | REMOVED" }

  - name: Shipment
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; copied from order" }
      - { name: warehouse_id, type: string, source: system, description: "FK -> Warehouse.id; snapshotted from route at pick start" }
      - { name: pod_signature, type: string, source: input, description: "Receiver signature captured at proof of delivery (null until delivered)", default: null }
      - { name: delivered_total_cents, type: integer, source: computed, default: 0, description: "order_total_cents snapshot recorded at POD" }
      - { name: status, type: enum, source: system, default: "PICKING", description: "PICKING | LOADED | DELIVERED" }

  - name: Return
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; copied from customer" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the delivered order being returned against" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the delivered line being returned" }
      - { name: reason, type: enum, source: input, description: "DAMAGED | OVERAGE | QUALITY | WRONG_ITEM" }
      - { name: return_splits, type: integer, source: input, description: "Quantity returned in split units", constraints: ">= 1" }
      - { name: restock_fee_cents, type: integer, source: computed, default: 0, description: "Restocking fee retained by distributor (0 except OVERAGE)" }
      - { name: credit_amount_cents, type: integer, source: computed, default: 0, description: "Credit memo value = returned goods value - restock_fee_cents" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | REJECTED | CREDITED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /customers/{customerId}/credit-hold"
        actor: CreditManager
        preconditions:
          - "Customer is ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "ar_status = CREDIT_HOLD"
          - "increments Customer.version by 1"
        note: "Manual hold; blocks new order submission and credit approval for this customer."
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system (AR sweep on /_clock/set_current_utc when ar_balance_cents > credit_limit_cents)"
        actor: system
        preconditions:
          - "ar_balance_cents > credit_limit_cents"
        side_effects:
          - "ar_status = CREDIT_HOLD"
          - "increments Customer.version by 1"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /customers/{customerId}/credit-release"
        actor: CreditManager
        preconditions:
          - "ar_balance_cents <= credit_limit_cents (else ERR_OVER_CREDIT_LIMIT)"
        side_effects:
          - "ar_status = ACTIVE"
          - "Each Order for this customer with credit_status ON_HOLD whose order_total still fits under (credit_limit - ar_balance) transitions credit_status ON_HOLD -> PENDING (cascade)"
          - "increments Customer.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /customers/{customerId}/close"
        actor: DistributorAdmin
        preconditions:
          - "ar_balance_cents == 0 (else ERR_CUSTOMER_NOT_SETTLED)"
          - "No Order in fulfillment_status {SUBMITTED, PICKING, LOADED} (else ERR_CUSTOMER_HAS_OPEN_ORDERS)"
        side_effects:
          - "ar_status = CLOSED"
          - "increments Customer.version by 1"

  - entity: Order
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /orders/{orderId}/submit"
        actor: SalesRep
        preconditions:
          - "Order has >= 1 OrderLine with line_status != REMOVED (else ERR_EMPTY_ORDER)"
          - "Customer.ar_status == ACTIVE (else ERR_CUSTOMER_ON_CREDIT_HOLD)"
          - "requested_delivery_date day-of-week == route.delivery_dow (else ERR_DELIVERY_DAY_MISMATCH)"
          - "current_utc <= (requested_delivery_date 00:00Z - route.cutoff_lead_hours hours) (else ERR_CUTOFF_PASSED)"
          - "No other Order for this customer in fulfillment_status {SUBMITTED, PICKING, LOADED, DELIVERED} whose requested_delivery_date is within route.min_delivery_gap_days days of this order's date — i.e., abs(day-diff) < min_delivery_gap_days collides (else ERR_DELIVERY_GAP_CONFLICT). Buffer/adjacency interval semantics on the Route resource."
        side_effects:
          - "fulfillment_status = SUBMITTED; credit_status = PENDING"
          - "route_id snapshotted from customer.route_id"
          - "increments Order.version by 1"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /orders/{orderId}/approve-credit"
        actor: CreditManager
        preconditions:
          - "credit_status == PENDING (else ERR_INVALID_STATE)"
          - "expected_customer_version == Customer.version (else ERR_STALE_CUSTOMER_VERSION) — guards against approving against a Customer whose ar_balance moved since the client read it"
          - "Customer.ar_status == ACTIVE (else ERR_CUSTOMER_ON_CREDIT_HOLD)"
          - "For every perishable line, at least one eligible candidate lot exists whose freshness window contains the delivery instant — expires_on > requested_delivery_date (half-open [received, expires_on)); if every available lot (primary and substitute) for a line expires_on <= requested_delivery_date, reject with ERR_LOT_EXPIRES_BEFORE_DELIVERY. Containment interval semantics on the InventoryLot resource."
        side_effects:
          - "calc allocate_inventory runs: each OPEN line allocates FEFO from InventoryLot, setting allocated_splits / short_splits / substituted / fulfilled_product_id and line_status ALLOCATED or SHORTED"
          - "InventoryLot.reserved_splits increased for each allocated line (cascade onto lots)"
          - "calc line_pricing + order_totals run: unit_case_price_cents, extended_price_cents, goods_subtotal_cents, split_fee_total_cents, order_total_cents set"
          - "credit check: if ar_balance_cents + order_total_cents <= credit_limit_cents -> credit_status = APPROVED and Customer.ar_balance_cents += order_total_cents; else credit_status = ON_HOLD and reservations rolled back (lots un-reserved, no AR change)"
          - "increments Order.version by 1"
          - "increments Customer.version by 1 (the approval advances the customer's AR snapshot, so the next stale approve-credit on a sibling order fails OCC)"
        note: "Over-limit at approval routes the order to ON_HOLD and reverses any reservation; it does not raise ERR_OVER_CREDIT_LIMIT. Customer.version advances even on the ON_HOLD path so the OCC guard is well-defined."
      - from: SUBMITTED
        to: PICKING
        trigger: "POST /orders/{orderId}/start-pick"
        actor: WarehouseOp
        preconditions:
          - "credit_status == APPROVED (else ERR_CREDIT_NOT_APPROVED)"
          - "At least one OrderLine line_status == ALLOCATED (else ERR_NOTHING_TO_PICK)"
        side_effects:
          - "fulfillment_status = PICKING"
          - "Create Shipment with status PICKING, warehouse_id snapshotted from route.warehouse_id"
          - "increments Order.version by 1"
      - from: PICKING
        to: LOADED
        trigger: "POST /shipments/{shipmentId}/load"
        actor: WarehouseOp
        preconditions:
          - "Shipment.status == PICKING (else ERR_INVALID_STATE)"
        side_effects:
          - "fulfillment_status = LOADED; Shipment.status = LOADED"
          - "increments Order.version by 1"
      - from: LOADED
        to: DELIVERED
        trigger: "POST /shipments/{shipmentId}/pod"
        actor: WarehouseOp
        preconditions:
          - "Shipment.status == LOADED (else ERR_INVALID_STATE)"
          - "pod_signature non-empty (else ERR_POD_SIGNATURE_REQUIRED)"
        side_effects:
          - "fulfillment_status = DELIVERED; Shipment.status = DELIVERED; settled = true"
          - "Each allocated InventoryLot.on_hand_splits decremented by the line's allocated_splits and reserved_splits decremented likewise (cascade: stock consumed)"
          - "delivered_total_cents = order_total_cents"
          - "increments Order.version by 1"
        note: "AR balance stays (it was debited at approval); settled flips so the order no longer counts as 'open' for customer-close checks."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: SalesRep | DistributorAdmin
        preconditions: []
        side_effects:
          - "fulfillment_status = CANCELLED"
          - "increments Order.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: SalesRep | DistributorAdmin
        preconditions:
          - "fulfillment_status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "fulfillment_status = CANCELLED"
          - "If credit_status == APPROVED: release reservations — each allocated line's InventoryLot.reserved_splits decremented by allocated_splits (cascade), and Customer.ar_balance_cents decreased by order_total_cents (compensation)"
          - "credit_status reset to PENDING"
          - "increments Order.version by 1"
        note: "Cancelling an approved-but-unpicked order is the compensating action for approve-credit; AR and reservations must net to zero."

  - entity: Shipment
    initial_state: PICKING
    terminal_states: [DELIVERED]
    transitions:
      - from: PICKING
        to: LOADED
        trigger: "POST /shipments/{shipmentId}/load"
        actor: WarehouseOp
        preconditions:
          - "status == PICKING (else ERR_INVALID_STATE)"
          - "parent Order.fulfillment_status == PICKING (else ERR_INVALID_STATE)"
        side_effects:
          - "status = LOADED; bubble up Order.fulfillment_status = LOADED"
          - "increments Shipment.version by 1"
      - from: LOADED
        to: DELIVERED
        trigger: "POST /shipments/{shipmentId}/pod"
        actor: WarehouseOp
        preconditions:
          - "status == LOADED (else ERR_INVALID_STATE)"
          - "pod_signature provided (else ERR_POD_SIGNATURE_REQUIRED)"
        side_effects:
          - "status = DELIVERED; bubble up Order.fulfillment_status = DELIVERED, settled=true"
          - "Inventory consumption cascade (see Order LOADED->DELIVERED)"
          - "delivered_total_cents = Order.order_total_cents"
          - "increments Shipment.version by 1"

  - entity: Return
    initial_state: REQUESTED
    terminal_states: [REJECTED, CREDITED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{returnId}/approve"
        actor: CreditManager
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
          - "referenced Order.fulfillment_status == DELIVERED (else ERR_ORDER_NOT_DELIVERED)"
          - "return_splits <= referenced OrderLine.allocated_splits (else ERR_RETURN_EXCEEDS_DELIVERED)"
        side_effects:
          - "status = APPROVED"
          - "calc return_credit runs: restock_fee_cents and credit_amount_cents computed"
          - "increments Return.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{returnId}/reject"
        actor: CreditManager
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = REJECTED"
          - "increments Return.version by 1"
      - from: APPROVED
        to: CREDITED
        trigger: "POST /returns/{returnId}/issue-credit"
        actor: CreditManager
        preconditions:
          - "status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "status = CREDITED"
          - "Customer.ar_balance_cents decreased by credit_amount_cents (compensation against the delivered order's AR debit; reconciliation)"
          - "If decreasing AR brings ar_balance_cents <= credit_limit_cents AND ar_status == CREDIT_HOLD: Customer ar_status -> ACTIVE, then each ON_HOLD order that now fits -> credit_status PENDING (transitive cascade Return -> Customer -> Order)"
          - "increments Return.version by 1"
        note: "Issuing the credit memo is the conserved-quantity compensation: returned goods value minus restock fee leaves AR consistent."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: approve-credit-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /orders/{orderId}/approve-credit"
    occ_field: "expected_customer_version"
    description: |
      Approving credit on an order pins the Customer version the client last
      observed. Approving a *different* sibling order for the same customer
      debits ar_balance_cents and advances Customer.version; a later
      approve-credit that still carries the pre-debit customer version is
      rejected as stale, because its credit decision (ar_balance + order_total
      <= credit_limit) was evaluated against a Customer AR snapshot that has
      since changed. This is the CREATE-with-supersede shape: the second
      approval would itself legitimately succeed under natural semantics (the
      order is still PENDING, the customer still ACTIVE), so only the stale
      version rejects it.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_pricing
    trigger: "Order SUBMITTED->SUBMITTED via approve-credit (credit_status PENDING->APPROVED)"
    algorithm: tiered_pricing
    formula: |
      # Per OrderLine, run at approval AFTER allocate_inventory. Tier is chosen on the
      # ORDERED quantity's case-equivalents; the charge multiplies the ALLOCATED quantity.
      splits_per_case = fulfilled_product.splits_per_case
      if uom == CASE:
        ordered_splits = ordered_qty * splits_per_case
      else:  # SPLIT
        ordered_splits = ordered_qty

      # Tier selection key = floor of case-equivalents of the ORDERED quantity.
      tier_key_cases = floor(ordered_splits / splits_per_case)
      if tier_key_cases < 1: tier_key_cases = 1   # a SPLIT-only sub-case line still prices at the lowest tier
      # Select tier: among PriceTier rows of fulfilled_product with min_cases <= tier_key_cases,
      # pick the one with the greatest min_cases. (min_cases is unique per product; if ever tied, created_at ASC.)
      unit_case_price_cents = selected_tier.case_price_cents

      # Charge the ALLOCATED quantity (allocated_splits), NOT the ordered quantity:
      priced_splits = allocated_splits
      full_cases = floor(priced_splits / splits_per_case)
      residual_splits = priced_splits - full_cases * splits_per_case
      # Each residual split priced at ceil(case_price / splits_per_case) (rounds in distributor's favor).
      split_unit_cents = ceil(unit_case_price_cents / splits_per_case)
      extended_price_cents = full_cases * unit_case_price_cents + residual_splits * split_unit_cents
    input_set: "fulfilled_product_id (post-substitution) and its PriceTier rows; allocated_splits from allocate_inventory which runs first"
    constants: {}
    precision: "integer cents; floor for full_cases and tier_key_cases, ceil for split_unit_cents"
    variants:
      - name: ordered_basis_tier
        when: "tier selection"
        difference: "Tier chosen by ORDERED case-equivalents (floor of ordered_splits/splits_per_case), so a shorted line keeps the price tier the customer qualified for at order time."
      - name: allocated_basis_charge
        when: "extended price"
        difference: "Extended price multiplies the ALLOCATED (delivered) quantity, so the customer pays only for what ships even though the tier was earned on the ordered amount — same line, two quantity bases."

  - name: allocate_inventory
    trigger: "Order SUBMITTED->SUBMITTED via approve-credit"
    algorithm: waterfall_allocation
    formula: |
      # Per OPEN OrderLine, processed in OrderLine.created_at ASC order (deterministic line order).
      need_splits = (ordered_qty * splits_per_case) if uom==CASE else ordered_qty
      target_product = line.product_id
      # FEFO candidate lots: InventoryLot of target_product at route.warehouse_id with
      # available = on_hand_splits - reserved_splits > 0. For perishable products, a lot is only
      # eligible when its freshness window contains the delivery instant: expires_on > requested_delivery_date
      # (half-open [received, expires_on)); lots that expire on/before delivery are excluded.
      # Perishable lots ordered by expires_on ASC then created_at ASC; non-perishable by created_at ASC.
      allocate from candidate lots in that order until need met or lots exhausted:
        take = min(need_remaining, lot.on_hand_splits - lot.reserved_splits)
        lot.reserved_splits += take ; allocated_splits += take ; need_remaining -= take
      if need_remaining > 0 and product.substitute_product_id is not null:
        # SUBSTITUTION fallback: fill the remaining shortfall from the substitute product's FEFO lots
        # (same warehouse) under the same FEFO ordering.
        repeat FEFO allocation against substitute_product_id; mark substituted=true if any substitute splits taken
      short_splits = need_remaining   # whatever still cannot be filled
      line_status = ALLOCATED if (allocated_splits == need_splits) else SHORTED
      fulfilled_product_id = substitute_product_id if (substituted and primary allocation was 0) else product_id
    input_set: "InventoryLot rows for product (and its substitute) at the order's route warehouse with available = on_hand_splits - reserved_splits > 0"
    constants: {}
    precision: "integer splits; FEFO tie-break expires_on ASC then created_at ASC; never id"
    variants:
      - name: primary_fefo
        when: "primary product has stock"
        difference: "Allocates from primary product lots, fulfilled_product_id == product_id, substituted=false."
      - name: substitute_fallback
        when: "primary fully out of stock and substitute_product_id set"
        difference: "Shortfall filled from substitute product lots; fulfilled_product_id == substitute_product_id, substituted=true; line re-prices on substitute's tiers."

  - name: order_totals
    trigger: "Order approve-credit (after line_pricing); recomputed on line removal before submit"
    algorithm: aggregation
    formula: |
      goods_subtotal_cents = sum(line.extended_price_cents for line in order.lines if line.line_status != REMOVED)
      # Per-split-line handling fee: customer.split_fee_cents charged once per SPLIT line that allocated > 0 splits.
      split_fee_total_cents = customer.split_fee_cents * count(line for line in order.lines
                                  if line.uom == SPLIT and line.line_status != REMOVED and line.allocated_splits > 0)
      order_total_cents = goods_subtotal_cents + split_fee_total_cents
    input_set: "all OrderLine of the order with line_status != REMOVED"
    constants: {}
    precision: "integer cents; round-per-line then sum (each line already rounded by line_pricing — order pinned: line first, then aggregate)"
    variants: []

  - name: par_replenishment
    trigger: "GET /order-guides/{orderGuideId}/replenishment (read-only suggestion)"
    algorithm: threshold
    formula: |
      # Per OrderGuideItem in the guide, suggest a fill-to-par quantity.
      deficit_splits = max(0, par_level_splits - on_hand_splits)
      splits_per_case = product.splits_per_case
      if not product.split_allowed:
        suggested_uom = CASE ; suggested_qty = ceil(deficit_splits / splits_per_case)   # round UP to whole cases
      else:
        suggested_uom = SPLIT ; suggested_qty = deficit_splits                          # exact split deficit
      # Items already at/over par (deficit_splits == 0) are omitted from the suggestion list.
    input_set: "OrderGuideItem rows of the guide with par_level_splits > on_hand_splits"
    constants: {}
    precision: "integer; ceil for case rounding when split not allowed"
    variants:
      - name: split_capable_exact
        when: "product.split_allowed == true"
        difference: "Suggests exact split deficit, no case rounding."
      - name: case_only_roundup
        when: "product.split_allowed == false"
        difference: "Rounds deficit UP to whole cases (can over-suggest vs par), changing the number from the split-capable basis."

  - name: return_credit
    trigger: "Return REQUESTED->APPROVED via approve"
    algorithm: weighted_scoring
    formula: |
      line = referenced OrderLine ; splits_per_case = fulfilled_product.splits_per_case
      # Per-split delivered value = line goods price spread over its allocated splits.
      delivered_split_value_cents = round_half_up(line.extended_price_cents / line.allocated_splits)
      returned_goods_cents = delivered_split_value_cents * return_splits
      # Restocking fee: only OVERAGE returns incur a fee (customer over-ordered); damage/quality/wrong-item are free.
      if reason == OVERAGE:
        restock_fee_cents = round_half_up(returned_goods_cents * RESTOCK_FEE_RATE)
      else:
        restock_fee_cents = 0
      credit_amount_cents = returned_goods_cents - restock_fee_cents
    input_set: "the single referenced OrderLine; its extended_price_cents and allocated_splits"
    constants:
      RESTOCK_FEE_RATE: 0.15   # 15% restocking fee on OVERAGE returns
    precision: "integer cents, round_half_up on per-split value and on restock fee"
    variants:
      - name: no_fee_return
        when: "reason in {DAMAGED, QUALITY, WRONG_ITEM}"
        difference: "restock_fee_cents == 0; credit_amount_cents == full returned_goods_cents."
      - name: overage_fee_return
        when: "reason == OVERAGE"
        difference: "15% restock fee withheld; credit_amount_cents == returned_goods_cents - round_half_up(returned_goods_cents*0.15), so same returned quantity yields a different credit than a damage return."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every referenced resource (path id and body FK) exists under the distributor, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, integers non-negative where constrained"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: business_constraint
    check: "SPLIT uom only allowed when Product.split_allowed == true"
    error_id: ERR_SPLIT_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /orders/{orderId}/lines"

  - priority: 6
    category: business_constraint
    check: "OCC: expected_customer_version must match current Customer.version on approve-credit"
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412
    applies_to: "approve-credit"

  - priority: 7
    category: state
    check: "Target resource in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_referential
    check: "Customer not CLOSED for any order/return-creating action; cited order_line belongs to the cited order"
    error_id: ERR_CUSTOMER_CLOSED
    http_status: 409
    applies_to: "order create/submit; return create"

  - priority: 9
    category: business_temporal
    check: "requested_delivery_date day-of-week matches route.delivery_dow"
    error_id: ERR_DELIVERY_DAY_MISMATCH
    http_status: 409
    applies_to: "order submit"

  - priority: 10
    category: business_temporal
    check: "current_utc must be <= (delivery date 00:00Z minus cutoff_lead_hours); equality is allowed, strictly-after is rejected"
    error_id: ERR_CUTOFF_PASSED
    http_status: 409
    applies_to: "order submit"

  - priority: 11
    category: business_temporal
    check: "Buffer/adjacency overlap: a new order's delivery date must be >= route.min_delivery_gap_days away from every other active order's delivery date for the same customer"
    error_id: ERR_DELIVERY_GAP_CONFLICT
    http_status: 409
    applies_to: "order submit"

  - priority: 12
    category: business_safety
    check: "Customer.ar_status must be ACTIVE to submit an order or approve its credit"
    error_id: ERR_CUSTOMER_ON_CREDIT_HOLD
    http_status: 409
    applies_to: "order submit; approve-credit"

  - priority: 13
    category: business_temporal
    check: "Freshness-window containment: every perishable line must have at least one eligible lot whose expires_on > requested_delivery_date"
    error_id: ERR_LOT_EXPIRES_BEFORE_DELIVERY
    http_status: 409
    applies_to: "approve-credit"

  - priority: 14
    category: business_fiscal
    check: "credit-release blocked while ar_balance_cents > credit_limit_cents (approval over-limit instead routes the order ON_HOLD, see state machine)"
    error_id: ERR_OVER_CREDIT_LIMIT
    http_status: 409
    applies_to: "credit-release"

  - priority: 15
    category: business_constraint
    check: "Return quantity must not exceed delivered allocated_splits on the referenced line"
    error_id: ERR_RETURN_EXCEEDS_DELIVERED
    http_status: 422
    applies_to: "return approve"

  - priority: 16
    category: business_constraint
    check: "POD requires non-empty pod_signature"
    error_id: ERR_POD_SIGNATURE_REQUIRED
    http_status: 422
    applies_to: "shipment pod"

  - priority: 17
    category: business_referential
    check: "Route.warehouse_id, Customer.route_id, OrderGuideItem.product_id, OrderLine.product_id and substitute references must resolve within the same distributor"
    error_id: ERR_CROSS_DISTRIBUTOR_REFERENCE
    http_status: 409
    applies_to: "route/customer/order-guide-item/order-line/inventory-lot create"

# =============================================================================
# 1.5 API Endpoint Table  (flat topology: peer collections, FK in bodies)
# =============================================================================
endpoints:
  # --- Distributor ---
  - method: POST
    path: "/distributors"
    description: "Create a distributor (tenant root)"
    roles: [DistributorAdmin]
    code: 201
    input: [name]
    output: Distributor
    side_effects: ["current_utc=epoch, catalog_revision=0"]

  - method: GET
    path: "/distributors/{distributorId}"
    description: "Get a distributor"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set a distributor's server clock; triggers AR over-limit sweep"
    roles: [DistributorAdmin]
    code: 200
    input: [distributor_id, to_iso8601]
    output: Distributor
    side_effects:
      - "Distributor.current_utc = to_iso8601"
      - "AR sweep: any ACTIVE Customer with ar_balance_cents > credit_limit_cents -> CREDIT_HOLD"

  # --- Warehouse ---
  - method: POST
    path: "/warehouses"
    description: "Create a warehouse"
    roles: [DistributorAdmin]
    code: 201
    input: [distributor_id, code, name]
    output: Warehouse
    side_effects: ["ERR_DUPLICATE_CODE if code exists for distributor"]

  - method: GET
    path: "/warehouses/{warehouseId}"
    description: "Get a warehouse"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: Warehouse
    side_effects: []

  - method: GET
    path: "/warehouses"
    description: "List warehouses (reverse-reachability for Warehouse.distributor_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["distributor_id?"]
    output: "Warehouse[]"
    side_effects: []

  # --- Route ---
  - method: POST
    path: "/routes"
    description: "Create a delivery route"
    roles: [DistributorAdmin]
    code: 201
    input: [distributor_id, warehouse_id, code, delivery_dow, cutoff_lead_hours, "min_delivery_gap_days?"]
    output: Route
    side_effects: ["ERR_CROSS_DISTRIBUTOR_REFERENCE if warehouse not in distributor; ERR_DUPLICATE_CODE on code clash"]

  - method: GET
    path: "/routes/{routeId}"
    description: "Get a route"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: GET
    path: "/routes"
    description: "List routes (reverse-reachability for Route.distributor_id and Route.warehouse_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["distributor_id?", "warehouse_id?"]
    output: "Route[]"
    side_effects: []

  # --- Product / catalog ---
  - method: POST
    path: "/products"
    description: "Create a catalog product"
    roles: [DistributorAdmin]
    code: 201
    input: [distributor_id, sku, name, category, splits_per_case, "split_allowed?", "perishable?", "substitute_product_id?", case_cost_cents]
    output: Product
    side_effects: ["Distributor.catalog_revision += 1", "ERR_DUPLICATE_SKU on sku clash"]

  - method: GET
    path: "/products/{productId}"
    description: "Get a product"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List/browse catalog (reverse-reachability for Product.distributor_id and Product.substitute_product_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["distributor_id?", "category?", "substitute_product_id?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: POST
    path: "/products/{productId}/discontinue"
    description: "Discontinue a product"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: Product
    side_effects: ["status=DISCONTINUED"]

  # --- PriceTier ---
  - method: POST
    path: "/price-tiers"
    description: "Add a volume price tier to a product"
    roles: [DistributorAdmin]
    code: 201
    input: [product_id, min_cases, case_price_cents]
    output: PriceTier
    side_effects: ["Distributor.catalog_revision += 1", "ERR_DUPLICATE_TIER if min_cases already present for product"]

  - method: GET
    path: "/price-tiers/{priceTierId}"
    description: "Get a price tier"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: PriceTier
    side_effects: []

  - method: GET
    path: "/price-tiers"
    description: "List price tiers (reverse-reachability for PriceTier.product_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["product_id?", "distributor_id?"]
    output: "PriceTier[]"
    side_effects: []

  # --- InventoryLot ---
  - method: POST
    path: "/inventory-lots"
    description: "Receive an inventory lot for a product at a warehouse"
    roles: [DistributorAdmin, WarehouseOp]
    code: 201
    input: [product_id, warehouse_id, lot_code, "expires_on?", on_hand_splits]
    output: InventoryLot
    side_effects: ["reserved_splits=0", "ERR_CROSS_DISTRIBUTOR_REFERENCE if warehouse not in distributor"]

  - method: GET
    path: "/inventory-lots/{lotId}"
    description: "Get an inventory lot"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: GET
    path: "/inventory-lots"
    description: "List lots (reverse-reachability for InventoryLot.product_id and InventoryLot.warehouse_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["product_id?", "warehouse_id?"]
    output: "InventoryLot[]"
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a customer / ship-to"
    roles: [DistributorAdmin, SalesRep]
    code: 201
    input: [distributor_id, route_id, name, credit_limit_cents, "split_fee_cents?"]
    output: Customer
    side_effects: ["ar_status=ACTIVE, ar_balance_cents=0", "ERR_CROSS_DISTRIBUTOR_REFERENCE if route not in distributor"]

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer (includes ar_balance_cents, ar_status, version)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers (reverse-reachability for Customer.distributor_id and Customer.route_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["distributor_id?", "route_id?"]
    output: "Customer[]"
    side_effects: []

  - method: POST
    path: "/customers/{customerId}/credit-limit"
    description: "Adjust a customer's credit_limit_cents (e.g., tighten credit); lowering below ar_balance does NOT auto-hold — the next AR sweep does"
    roles: [CreditManager, DistributorAdmin]
    code: 200
    input: [credit_limit_cents]
    output: Customer
    side_effects: ["credit_limit_cents updated"]

  - method: POST
    path: "/customers/{customerId}/credit-hold"
    description: "Place a customer on manual credit hold"
    roles: [CreditManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["ar_status=CREDIT_HOLD"]

  - method: POST
    path: "/customers/{customerId}/credit-release"
    description: "Release a customer from credit hold (cascades ON_HOLD orders back to PENDING)"
    roles: [CreditManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["ar_status=ACTIVE", "ON_HOLD orders that now fit -> credit_status PENDING"]

  - method: POST
    path: "/customers/{customerId}/close"
    description: "Close a fully-settled customer"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["ar_status=CLOSED if settled and no open orders"]

  # --- OrderGuide ---
  - method: POST
    path: "/order-guides"
    description: "Create an order guide for a customer"
    roles: [DistributorAdmin, SalesRep]
    code: 201
    input: [customer_id, name]
    output: OrderGuide
    side_effects: ["ERR_CUSTOMER_CLOSED if customer CLOSED"]

  - method: GET
    path: "/order-guides/{orderGuideId}"
    description: "Get an order guide"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: OrderGuide
    side_effects: []

  - method: GET
    path: "/order-guides"
    description: "List order guides (reverse-reachability for OrderGuide.customer_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["customer_id?", "distributor_id?"]
    output: "OrderGuide[]"
    side_effects: []

  # --- OrderGuideItem ---
  - method: POST
    path: "/order-guide-items"
    description: "Add an item with a par level to an order guide"
    roles: [DistributorAdmin, SalesRep]
    code: 201
    input: [order_guide_id, product_id, par_level_splits, "on_hand_splits?"]
    output: OrderGuideItem
    side_effects: ["ERR_CROSS_DISTRIBUTOR_REFERENCE if product not in distributor"]

  - method: GET
    path: "/order-guide-items/{orderGuideItemId}"
    description: "Get an order guide item"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: OrderGuideItem
    side_effects: []

  - method: GET
    path: "/order-guide-items"
    description: "List order guide items (reverse-reachability for OrderGuideItem.order_guide_id and OrderGuideItem.product_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["order_guide_id?", "product_id?"]
    output: "OrderGuideItem[]"
    side_effects: []

  - method: GET
    path: "/order-guides/{orderGuideId}/replenishment"
    description: "Computed read: par-based fill-to-par suggestions for the guide"
    roles: [DistributorAdmin, SalesRep]
    code: 200
    input: []
    output: "OrderGuideItem[]"
    side_effects: ["read-only; runs par_replenishment calc, returns items annotated with suggested_uom and suggested_qty"]

  # --- Order ---
  - method: POST
    path: "/orders"
    description: "Create a draft order for a customer"
    roles: [SalesRep, DistributorAdmin]
    code: 201
    input: [customer_id, requested_delivery_date]
    output: Order
    side_effects: ["fulfillment_status=DRAFT, credit_status=PENDING", "ERR_CUSTOMER_CLOSED if customer CLOSED"]

  - method: GET
    path: "/orders/{orderId}"
    description: "Get an order (totals, both status dimensions, version)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders (reverse-reachability for Order.customer_id, Order.route_id, Order.distributor_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["customer_id?", "route_id?", "distributor_id?", "fulfillment_status?"]
    output: "Order[]"
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/lines"
    description: "Add a line to a draft order"
    roles: [SalesRep, DistributorAdmin]
    code: 201
    input: [product_id, uom, ordered_qty, "order_guide_item_id?"]
    output: OrderLine
    side_effects: ["line_status=OPEN", "ERR_SPLIT_NOT_ALLOWED if uom=SPLIT and product.split_allowed=false", "ERR_CROSS_DISTRIBUTOR_REFERENCE if product not in distributor"]

  - method: GET
    path: "/order-lines/{orderLineId}"
    description: "Get an order line"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "List order lines (reverse-reachability for OrderLine.order_id, OrderLine.product_id, OrderLine.fulfilled_product_id, OrderLine.order_guide_item_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["order_id?", "product_id?", "fulfilled_product_id?", "order_guide_item_id?"]
    output: "OrderLine[]"
    side_effects: []

  - method: POST
    path: "/order-lines/{orderLineId}/remove"
    description: "Remove a line from a draft order"
    roles: [SalesRep, DistributorAdmin]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["line_status=REMOVED; recompute order_totals"]

  - method: POST
    path: "/orders/{orderId}/submit"
    description: "Submit a draft order (cutoff & delivery-day & gap checks)"
    roles: [SalesRep, DistributorAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status=SUBMITTED, route snapshotted", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{orderId}/approve-credit"
    description: "Credit-approve a submitted order; runs allocation + pricing; OCC on the customer (expected_customer_version)"
    roles: [CreditManager]
    code: 200
    input: [expected_customer_version]
    output: Order
    side_effects:
      - "credit_status=APPROVED (or ON_HOLD if over limit)"
      - "allocate_inventory + line_pricing + order_totals run"
      - "InventoryLot.reserved_splits increased; Customer.ar_balance_cents increased (when APPROVED)"
      - "increments Order.version by 1"
      - "increments Customer.version by 1 (OCC guard)"

  - method: POST
    path: "/orders/{orderId}/start-pick"
    description: "Begin picking an approved order; creates a Shipment"
    roles: [WarehouseOp]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status=PICKING; Shipment created (PICKING)"]

  - method: POST
    path: "/orders/{orderId}/cancel"
    description: "Cancel a draft or submitted order (compensates reservations + AR if approved)"
    roles: [SalesRep, DistributorAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status=CANCELLED; release reservations and AR if previously approved"]

  # --- Shipment ---
  - method: GET
    path: "/shipments/{shipmentId}"
    description: "Get a shipment"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/shipments"
    description: "List shipments (reverse-reachability for Shipment.order_id, Shipment.distributor_id, Shipment.warehouse_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["order_id?", "distributor_id?", "warehouse_id?"]
    output: "Shipment[]"
    side_effects: []

  - method: POST
    path: "/shipments/{shipmentId}/load"
    description: "Mark a shipment loaded (bubbles order to LOADED)"
    roles: [WarehouseOp]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status=LOADED; Order.fulfillment_status=LOADED"]

  - method: POST
    path: "/shipments/{shipmentId}/pod"
    description: "Capture proof of delivery (consumes inventory, settles order)"
    roles: [WarehouseOp]
    code: 200
    input: [pod_signature]
    output: Shipment
    side_effects: ["status=DELIVERED; Order DELIVERED+settled; InventoryLot on_hand/reserved decremented; delivered_total_cents set"]

  # --- Return ---
  - method: POST
    path: "/returns"
    description: "Request a return against a delivered order line"
    roles: [SalesRep, DistributorAdmin, CreditManager]
    code: 201
    input: [customer_id, order_id, order_line_id, reason, return_splits]
    output: Return
    side_effects: ["status=REQUESTED", "ERR_CUSTOMER_CLOSED if customer CLOSED"]

  - method: GET
    path: "/returns/{returnId}"
    description: "Get a return"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: []
    output: Return
    side_effects: []

  - method: GET
    path: "/returns"
    description: "List returns (reverse-reachability for Return.customer_id, Return.order_id, Return.order_line_id, Return.distributor_id)"
    roles: [DistributorAdmin, SalesRep, WarehouseOp, CreditManager]
    code: 200
    input: ["customer_id?", "order_id?", "order_line_id?", "distributor_id?"]
    output: "Return[]"
    side_effects: []

  - method: POST
    path: "/returns/{returnId}/approve"
    description: "Approve a return (computes restock fee + credit amount)"
    roles: [CreditManager]
    code: 200
    input: []
    output: Return
    side_effects: ["status=APPROVED; return_credit calc runs"]

  - method: POST
    path: "/returns/{returnId}/reject"
    description: "Reject a return"
    roles: [CreditManager]
    code: 200
    input: []
    output: Return
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/returns/{returnId}/issue-credit"
    description: "Issue the credit memo for an approved return (reduces AR, may release hold)"
    roles: [CreditManager]
    code: 200
    input: []
    output: Return
    side_effects: ["status=CREDITED; Customer.ar_balance_cents reduced; may cascade CREDIT_HOLD->ACTIVE then ON_HOLD orders->PENDING"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Authenticated role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource does not exist under the distributor" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, invalid enum, or out-of-range integer in request body" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Warehouse or route code already exists for the distributor" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Product sku already exists for the distributor" }
  - { id: ERR_DUPLICATE_TIER, http: 409, condition: "A PriceTier with the same min_cases already exists for the product" }
  - { id: ERR_CROSS_DISTRIBUTOR_REFERENCE, http: 409, condition: "A referenced warehouse/route/product/substitute belongs to a different distributor" }
  - { id: ERR_SPLIT_NOT_ALLOWED, http: 422, condition: "OrderLine uom=SPLIT but Product.split_allowed is false" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "Submit attempted on an order with no non-removed lines" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_DELIVERY_DAY_MISMATCH, http: 409, condition: "requested_delivery_date day-of-week does not equal route.delivery_dow" }
  - { id: ERR_CUTOFF_PASSED, http: 409, condition: "current_utc is strictly after the route cutoff for the requested delivery date" }
  - { id: ERR_DELIVERY_GAP_CONFLICT, http: 409, condition: "Another active order for the same customer has a delivery date within route.min_delivery_gap_days of this one (buffer/adjacency overlap)" }
  - { id: ERR_LOT_EXPIRES_BEFORE_DELIVERY, http: 409, condition: "Every eligible lot for a perishable line expires on/before requested_delivery_date (freshness-window containment fails)" }
  - { id: ERR_CUSTOMER_ON_CREDIT_HOLD, http: 409, condition: "Customer ar_status is CREDIT_HOLD when submitting or approving an order" }
  - { id: ERR_CUSTOMER_CLOSED, http: 409, condition: "Action attempted against a CLOSED customer" }
  - { id: ERR_CUSTOMER_NOT_SETTLED, http: 409, condition: "Close attempted while ar_balance_cents != 0" }
  - { id: ERR_CUSTOMER_HAS_OPEN_ORDERS, http: 409, condition: "Close attempted while an order is SUBMITTED/PICKING/LOADED" }
  - { id: ERR_OVER_CREDIT_LIMIT, http: 409, condition: "credit-release attempted while ar_balance_cents > credit_limit_cents" }
  - { id: ERR_CREDIT_NOT_APPROVED, http: 409, condition: "start-pick attempted while credit_status != APPROVED" }
  - { id: ERR_NOTHING_TO_PICK, http: 409, condition: "start-pick attempted with no ALLOCATED lines" }
  - { id: ERR_POD_SIGNATURE_REQUIRED, http: 422, condition: "POD attempted without a non-empty pod_signature" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "Return approve attempted while referenced order is not DELIVERED" }
  - { id: ERR_RETURN_EXCEEDS_DELIVERED, http: 422, condition: "return_splits exceeds the delivered allocated_splits on the line" }
  - { id: ERR_STALE_CUSTOMER_VERSION, http: 412, condition: "expected_customer_version does not match current Customer.version on approve-credit" }
  - { id: ERR_VALIDATION_LIMIT, http: 422, condition: "Pagination limit/offset out of bounds (limit 1..100, offset >= 0)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistributorAdmin
    description: "Operational superset: catalog, pricing, routes, warehouses, customer lifecycle; may also place/cancel orders."
    identity: opaque
    exclusive_operations:
      - "Create/discontinue Product; create PriceTier; create Warehouse; create Route"
      - "Close Customer"
    shared_operations:
      - "Create Customer (with SalesRep)"
      - "Create/submit/cancel Order, add/remove lines (with SalesRep)"
      - "Receive InventoryLot (with WarehouseOp)"
      - "Create OrderGuide/items (with SalesRep)"
      - "Request Return (with SalesRep, CreditManager)"
      - "All GET reads"

  - name: SalesRep
    description: "Customer-facing order capture and order guides."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "Create Customer (with DistributorAdmin)"
      - "Create OrderGuide and items (with DistributorAdmin)"
      - "Create/submit/cancel Order, add/remove lines (with DistributorAdmin)"
      - "Request Return (with DistributorAdmin, CreditManager)"
      - "Read replenishment suggestions"
      - "All GET reads"

  - name: WarehouseOp
    description: "Warehouse fulfillment: receive stock, pick, load, capture POD."
    identity: opaque
    exclusive_operations:
      - "start-pick an order; load and POD a shipment"
    shared_operations:
      - "Receive InventoryLot (with DistributorAdmin)"
      - "All GET reads"

  - name: CreditManager
    description: "Credit governance: holds/releases, order credit approval, return credit memos."
    identity: opaque
    exclusive_operations:
      - "credit-hold / credit-release a Customer"
      - "approve-credit an Order"
      - "approve / reject / issue-credit a Return"
    shared_operations:
      - "Request Return (with SalesRep, DistributorAdmin)"
      - "All GET reads"
