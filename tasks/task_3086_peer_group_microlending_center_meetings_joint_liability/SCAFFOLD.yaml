    description: "List loans with optional filters"
    roles: [ProgramAdmin, BranchManager, CenterManager, FieldOfficer, Member]
    code: 200
    input: ["member_id?", "loan_application_id?", "status?"]
    output: "Loan[]"
    side_effects: []

  - method: GET
    path: "/loans/{id}"
