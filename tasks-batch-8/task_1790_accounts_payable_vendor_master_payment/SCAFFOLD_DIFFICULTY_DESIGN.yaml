              as_user_id: "u-vs-01"
            - { call: "GET /sanctions-cases", payload: { vendor_id: "${v_id}", status: "OPEN" }, as: ComplianceOfficer, as_user_id: "u-co-01", captures: { case_id: "$.data[0].id" } }
            - { call: "POST /sanctions-cases/${case_id}/disposition", payload: { decision: "CONFIRMED_HIT", note: "exact principal match" }, as: ComplianceOfficer, as_user_id: "u-co-01" }
          assert:
            - "PATCH re-screen: Vendor.${v_id}.status == SUSPENDED, one OPEN case created, inv2/inv3 ON_HOLD with pre_hold_status PENDING_APPROVAL / APPROVED"
            - "After CONFIRMED_HIT: Vendor.${v_id}.status == BLOCKED (link 1)"
            - "Invoice.${inv1}.status == ON_HOLD with pre_hold_status == IN_PAYMENT_RUN (link 2; IN_PAYMENT_RUN is held only by the block cascade, not by plain suspend)"
            - "Payment.${pay1}.status == VOIDED with void_reason == VENDOR_BLOCKED (link 3)"
            - "PaymentRun.${run_id}: total_amount_cents == 0, item_count == 0, status == COMPILED (link 4: content change demoted the APPROVED run)"
            - "SanctionsReviewCase.${case_id}.status == CONFIRMED_HIT"

      - name: positive_pay_mismatch_depth3_fraud_chain
        grounds:
          - state_machines.Payment.RELEASED_to_VOIDED
          - state_machines.Vendor.ACTIVE_to_SUSPENDED
          - state_machines.Invoice.APPROVED_to_ON_HOLD
          - state_machines.PaymentRun.RELEASED_to_CLOSED
        distinguishing_aspect: |
          Depth-3 chain from a bank ack (different trigger than the sanctions disposition): MISMATCH
          voids the payment -> payment void suspends the vendor (fraud hold) -> the suspend cascade
          holds the vendor's actionable invoices — and because the chain is ordered, the mismatched
          payment's own invoice first reverts to APPROVED and is THEN held (ends ON_HOLD with
          pre_hold_status APPROVED, never observed APPROVED by the caller).
