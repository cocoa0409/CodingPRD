  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: depreciation_floor_applies_after_eleven_years
        claim_type: constants_applied
        grounds: ['calculations.depreciation_and_repair_decision']
        distinguishing_aspect: "With purchase 10000 cents 11 years before intake, raw decay (10000 x 0.8^11 = 858.99 -> 859) is overridden by the 10% floor: depreciated_value_cents == 1000; estimate 500 < 0.75 x 1000 selects REPAIR with payout min(500, 1000) == 500."
        test_recipe:
          setup: ["station JFK; carrier AA; vendor capacity 2; DAMAGED report assessed repairable; order purchase_date 2015-08-01, intake 2026-08-10, estimate 500"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/repair-vendors", payload: { name: "FixIt", bench_capacity: 2 }, as: SystemAdmin, captures: { vnd: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234621", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00121", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DAMAGED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/assess-damage", payload: { repairable: true, contents_damage_cents: 0 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/repair-orders", payload: { report_id: "${rpt}", vendor_id: "${vnd}", intake_date: "2026-08-10", promised_date: "2026-08-20", purchase_price_cents: 10000, purchase_date: "2015-08-01", repair_estimate_cents: 500 }, as: ClaimsAdjuster, captures: { ro: $.data.id } }
          trigger:
            - { call: "POST /baggage/repair-orders/${ro}/decide", payload: {}, as: ClaimsAdjuster, captures: { dep: $.data.depreciated_value_cents } }
            - { call: "POST /baggage/repair-orders/${ro}/complete", payload: {}, as: ClaimsAdjuster }
          assert:
            - "RepairOrder.${ro}.depreciated_value_cents == 1000"
            - "RepairOrder.${ro}.decision == REPAIR"
            - "RepairOrder.${ro}.payout_cents == 500"
            - "RepairOrder.${ro}.status == REPAIR_SETTLED"

      - name: expense_window_excludes_out_of_window_receipts
        claim_type: input_set_filtering
        grounds: ['calculations.expense_reimbursement', 'entities.ExpenseClaim.fields.eligible_receipt_count']
        distinguishing_aspect: "Only receipts inside [opened_on, opened_on+5d] enter the calculation: the 2026-08-10 receipt is excluded (not an error), so eligible_receipt_count == 1 and the reimbursable total is 4000 despite a claimed_total_cents of 13000."
        test_recipe:
          setup: ["station JFK; carrier AA; STANDARD passenger; domestic bag; DELAYED report opened 2026-08-01 in TRACING; claim with receipts on 2026-08-02 (4000) and 2026-08-10 (9000)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234622", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00122", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt}", receipts: [{ incurred_on: "2026-08-02", description: "meals", amount_minor: 4000, currency_code: "USD" }, { incurred_on: "2026-08-10", description: "late coat", amount_minor: 9000, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm: $.data.id } }
          trigger:
            - { call: "POST /baggage/expense-claims/${clm}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
          assert:
            - "ExpenseClaim.${clm}.claimed_total_cents == 13000"
            - "ExpenseClaim.${clm}.eligible_receipt_count == 1"
            - "ExpenseClaim.${clm}.reimbursable_total_cents == 4000"

      - name: declared_value_raises_effective_cap
        claim_type: correct_result
        grounds: ['calculations.liability_cap', 'calculations.settlement_offer']
        distinguishing_aspect: "A declared value of 200000 lifts the DOMESTIC 20kg cap from 50000 to 200000 (max rule), so a 150000 contents loss is offered in full (150000) instead of being clipped to 50000."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; domestic 20kg bag with declared_value_cents 200000; DELAYED report swept to DECLARED_LOST, assess-loss 150000, in CLAIM_REVIEW"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
