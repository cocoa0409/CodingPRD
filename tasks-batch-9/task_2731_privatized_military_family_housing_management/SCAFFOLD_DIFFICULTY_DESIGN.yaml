      - name: work_order_reopen_cycle_spends_budget_then_closes_terminal
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.WorkOrder.IN_PROGRESS_to_CLOSED
          - state_machines.WorkOrder.COMPLETED_to_REOPENED
          - state_machines.WorkOrder.REOPENED_to_ASSIGNED
          - entities.WorkOrder.fields.reopen_count
          - validations[priority=20]
        distinguishing_aspect: |
          WorkOrder is a cycle with a hard budget: the loop
          ASSIGNED -> IN_PROGRESS -> COMPLETED -> REOPENED -> ASSIGNED runs
          twice, and on the third completion the SAME trigger
          POST /work-orders/{id}/complete diverges to the terminal CLOSED state
          because reopen_count has reached REOPEN_LIMIT 2 instead of returning
          to the re-enterable COMPLETED state — a reopen attempt afterwards is
          then rejected by priority 20 ERR_TERMINAL_STATE_LOCKED, which
          pre-empts the priority 28 ERR_REOPEN_LIMIT_REACHED that a
          non-terminal budget-exhausted order would produce; this is the
          WorkOrder entity, not Lease or HazardCase.
        test_recipe:
          setup:
            - "One installation, one 2-bedroom TOWNHOME unit, one E5 sponsor with three full-time-custody dependents; lease 1 OCCUPIED from 2026-09-01."
            - "The logical clock stands at 2026-09-10T09:00:00Z."
            - "A COSMETIC work order with habitability_impact false exists on the unit, so priority_class is ROUTINE with completion_due_at 2026-10-10T09:00:00Z and every completion below is inside SLA."
