              captures: { rep5: $.data.id }
          trigger:
            - call: "POST /trips/${g1}/start"
              payload: { actual_departure_min: 425 }
              as: DriverUser
              as_user_id: "${d12a}"
            - call: "POST /trips/${g1}/complete"
              payload: { actual_completion_min: 470, boarded: 5, alighted: 5, ada_boardings: 0 }
              as: DriverUser
              as_user_id: "${d12a}"
            - call: "POST /trips/${g2}/start"
              payload: { actual_departure_min: 438 }
              as: DriverUser
              as_user_id: "${d12b}"
            - call: "POST /trips/${g2}/complete"
              payload: { actual_completion_min: 486, boarded: 5, alighted: 5, ada_boardings: 0 }
              as: DriverUser
              as_user_id: "${d12b}"
            - call: "POST /service-period-reports/${rep5}/submit"
              payload: {}
              as: ClientLiaison
              as_user_id: "liaison-5"
              captures: { ontime_n: $.data.on_time_trip_count, ontime_pct: $.data.on_time_pct }
          assert:
            - "${ontime_n} == 1"
            - "${ontime_pct} == 50.00"
            - "ServicePeriodReport.${rep5}.countable_trip_count == 2"
            - "ServicePeriodReport.${rep5}.penalty_tier_pct == 10"
