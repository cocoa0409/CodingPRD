scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: admission_billable_nights_projected_versus_chronological_actual
        grounds:
          - calculations.admission_billable_nights
          - entities.Admission.fields.projected_billable_nights
          - entities.Admission.fields.final_billable_nights
          - state_machines.Admission.ACTIVE_to_DISCHARGED
          - entities.Youth.fields.cumulative_shelter_nights
        distinguishing_aspect: |
          This dual-variant pair lives on the Admission stay-accounting domain: the forward_projected
          variant counts calendar days admitted_at -> planned_discharge_at and can never award the
          noon-cutoff night, while chronological_actual counts admitted_at -> discharged_at and adds
          one night when the discharge instant is at or after 12:00:00Z, so the same admission
          reports 7 projected nights and 8 final nights - a delta of exactly 1.
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program 'Riverside Emergency Shelter' with licensed_bed_capacity 2, age band 12..17, max_stay_nights 21"
            - "youth Ava Reyes, date_of_birth 2010-03-15, so age_years is 16 at the default logical clock 2026-08-01T00:00:00Z"
            - "Ava has one SafetyScreening dispositioned CLEARED (score 0 tier LOW), so her admission short-circuits straight to ACTIVE"
            - "Admission ACTIVE with admitted_at 2026-08-01T00:00:00Z and planned_discharge_at 2026-08-08T00:00:00Z"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { shelter_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ava", legal_last_name: "Reyes", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ava_id: $.data.id }
            - call: "POST /ryhs/youths/${ava_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ava_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${ava_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${ava_id}", program_id: "${shelter_id}", planned_discharge_at: "2026-08-08T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ava_adm_id: $.data.id, ava_projected: $.data.projected_billable_nights }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T15:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions/${ava_adm_id}/discharge"
              payload: { exit_destination: "TRANSITIONAL_LIVING" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ava_final: $.data.final_billable_nights }
          assert:
            - "Admission.${ava_adm_id}.projected_billable_nights == 7"
            - "Admission.${ava_adm_id}.final_billable_nights == 8"
            - "Admission.${ava_adm_id}.final_billable_nights - Admission.${ava_adm_id}.projected_billable_nights == 1"
            - "Admission.${ava_adm_id}.status == DISCHARGED"
            - "Admission.${ava_adm_id}.discharged_at == 2026-08-08T15:00:00Z"
            - "Admission.${ava_adm_id}.outcome_positive == true"
            - "Youth.${ava_id}.cumulative_shelter_nights == 8"
            - "Youth.${ava_id}.status == EXITED"
            - "ShelterProgram.${shelter_id}.occupied_beds == 0"

      - name: trafficking_risk_score_screening_snapshot_versus_decayed_outreach_history
        grounds:
          - calculations.trafficking_risk_score
          - entities.SafetyScreening.fields.score
          - entities.Youth.fields.trafficking_risk_score
          - entities.Youth.fields.trafficking_risk_tier
        distinguishing_aspect: |
          This dual-variant pair lives on the Youth risk-scoring domain rather than on stay
          accounting: screening_time freezes an undecayed 55-point snapshot of one indicator set onto
          the SafetyScreening row, while outreach_history floors each OutreachContact's contribution
          by 10 percentage points per completed week before summing, so the identical indicator set
          [THIRD_PARTY_CONTROL, QUOTA_DEBT] reads 55 on the screening and 44 on the youth after 15
          days - a delta of exactly 11 driven by decay, not by different inputs.
        test_recipe:
          setup:
            - "youth Kai Osei with no admissions, created at the default logical clock 2026-08-01T00:00:00Z"
            - "one OutreachContact logged at 2026-08-01T00:00:00Z with indicator_flags [THIRD_PARTY_CONTROL, QUOTA_DEBT], raw weight 30 + 25 = 55, undecayed at logging time"
            - "the logical clock is then moved 15 days forward to 2026-08-16T00:00:00Z, which is 2 completed weeks of decay"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Kai", legal_last_name: "Osei", date_of_birth: "2010-05-04", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { kai_id: $.data.id }
            - call: "POST /ryhs/youths/${kai_id}/outreach-contacts"
              payload: { engagement_stage: "RAPPORT_BUILDING", basic_needs_provided: ["FOOD", "HYGIENE_KIT"], indicator_flags: ["THIRD_PARTY_CONTROL", "QUOTA_DEBT"] }
              as: OutreachWorker
              as_user_id: "worker-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/youths/${kai_id}/safety-screenings"
              payload: { indicator_codes: ["THIRD_PARTY_CONTROL", "QUOTA_DEBT"] }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { kai_scr_id: $.data.id, kai_scr_score: $.data.score }
            - call: "POST /_ops/nightly-census"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "SafetyScreening.${kai_scr_id}.score == 55"
            - "SafetyScreening.${kai_scr_id}.tier == ELEVATED"
            - "SafetyScreening.${kai_scr_id}.status == SUBMITTED"
            - "Youth.${kai_id}.trafficking_risk_score == 44"
            - "Youth.${kai_id}.trafficking_risk_tier == ELEVATED"
            - "SafetyScreening.${kai_scr_id}.score - Youth.${kai_id}.trafficking_risk_score == 11"
            - "Youth.${kai_id}.risk_posture == OPEN"

  - rule_id: combinatorial_formula
    instances:
      - name: savings_match_rounds_per_entry_before_summing
        grounds:
          - calculations.savings_match_award
          - entities.SavingsLedgerEntry.fields.match_component_cents
          - entities.TlpPlacement.fields.match_awarded_cents
          - entities.TlpPlacement.fields.savings_balance_cents
          - concurrency_rules[savings-entry-stale-placement]
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the cents: the scaffold pins round_half_up
          per SavingsLedgerEntry BEFORE summation, so three 1010-cent deposits at a 2500 bp match rate
          award 253 + 253 + 253 = 759 match cents and a 3789-cent balance, whereas the rejected
          sum-then-round order would award round_half_up(3030 * 0.25) = 758 and a 3788-cent balance.
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program (capacity 2, band 12..17) and one TRANSITIONAL_LIVING program 'Northside Transitional Living' with licensed_bed_capacity 3, band 16..20, max_placement_days 540, savings_match_rate_bp 2500 and required_savings_rate_bp 2000"
            - "youth Ava Reyes (date_of_birth 2010-03-15, age_years 16 at the default clock 2026-08-01T00:00:00Z) with a CLEARED SafetyScreening"
            - "Ava holds an ACTIVE shelter Admission whose 24-hour GuardianNotification has been attempted once and then resolved CONTACTED, so Youth.risk_posture is back to OPEN and validations priority 48 lets the placement through"
            - "Ava holds a TlpPlacement with tenancy_status PLACED, compliance_status IN_COMPLIANCE, documented_monthly_income_cents 120000, savings_balance_cents 0 and version 1"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { shelter_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { tlp_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ava", legal_last_name: "Reyes", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ava_id: $.data.id }
            - call: "POST /ryhs/youths/${ava_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ava_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${ava_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${ava_id}", program_id: "${shelter_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ava_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${ava_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ava_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${ava_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${ava_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${ava_id}", program_id: "${tlp_program_id}", documented_monthly_income_cents: 120000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { ava_plc_id: $.data.id, plc_v1: $.data.version }
          trigger:
            - call: "POST /ryhs/tlp-placements/${ava_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1010, expected_placement_version: "${plc_v1}", source_note: "deposit 1 of 3" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { entry1_id: $.data.id, entry1_match: $.data.match_component_cents }
            - call: "GET /ryhs/tlp-placements/${ava_plc_id}"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { plc_v2: $.data.version }
            - call: "POST /ryhs/tlp-placements/${ava_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1010, expected_placement_version: "${plc_v2}", source_note: "deposit 2 of 3" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { entry2_id: $.data.id }
            - call: "GET /ryhs/tlp-placements/${ava_plc_id}"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { plc_v3: $.data.version }
            - call: "POST /ryhs/tlp-placements/${ava_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1010, expected_placement_version: "${plc_v3}", source_note: "deposit 3 of 3" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { entry3_id: $.data.id, entry3_balance: $.data.balance_after_cents }
          assert:
            - "SavingsLedgerEntry.${entry1_id}.match_component_cents == 253"
            - "SavingsLedgerEntry.${entry2_id}.match_component_cents == 253"
            - "SavingsLedgerEntry.${entry3_id}.match_component_cents == 253"
            - "SavingsLedgerEntry.${entry1_id}.balance_after_cents == 1263"
            - "SavingsLedgerEntry.${entry2_id}.balance_after_cents == 2526"
            - "SavingsLedgerEntry.${entry3_id}.balance_after_cents == 3789"
            - "TlpPlacement.${ava_plc_id}.match_awarded_cents == 759"
            - "TlpPlacement.${ava_plc_id}.savings_balance_cents == 3789"
            - "TlpPlacement.${ava_plc_id}.match_awarded_cents != 758"
            - "Youth.${ava_id}.lifetime_savings_deposited_cents == 3030"

      - name: tlp_duration_allowance_pins_ratio_against_base_allowance_only
        grounds:
          - calculations.tlp_duration_allowance
          - entities.TlpPlacement.fields.consumed_ratio_bp
          - entities.TlpPlacement.fields.earned_bonus_days
          - entities.TlpPlacement.fields.allowance_days
          - entities.LifeSkillsCompletion.fields.credit_hours
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency whose evaluation order the scaffold pins: STEP 1
          always divides days_elapsed by base_allowance_days (540), so at 420 elapsed days the ratio
          is 7777 bp, crosses HAIRCUT_RATIO_BP 7500 and halves the 40-hour milestone bonus from 60 to
          30 days, yielding allowance_days 570; the rejected order that recomputes the ratio against
          the post-bonus allowance would read 7000 bp, skip the haircut and hand back 600.
        test_recipe:
          setup:
            - "the same two programs and the same CLEARED-screening, notification-resolved Ava as instance savings_match_rounds_per_entry_before_summing"
            - "Ava holds a TlpPlacement placed at 2026-08-01T00:00:00Z with base_allowance_days 540, life_skills_credit_hours 0, earned_bonus_days 0 and allowance_days 540"
            - "the logical clock is moved to 2027-09-25T00:00:00Z, exactly 420 days after placed_at, so days_elapsed is 420 and consumed_ratio_bp is floor(420 * 10000 / 540) = 7777"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { shelter2_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { tlp2_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ava", legal_last_name: "Reyes", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ava2_id: $.data.id }
            - call: "POST /ryhs/youths/${ava2_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ava2_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${ava2_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${ava2_id}", program_id: "${shelter2_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ava2_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${ava2_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ava2_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${ava2_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${ava2_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${ava2_id}", program_id: "${tlp2_program_id}", documented_monthly_income_cents: 120000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { ava2_plc_id: $.data.id, ava2_base_allowance: $.data.base_allowance_days }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-25T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/tlp-placements/${ava2_plc_id}/life-skills-completions"
              payload: { module_code: "BUDGETING", credit_hours: 40 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { ava2_lsc_id: $.data.id }
            - call: "GET /ryhs/tlp-placements/${ava2_plc_id}"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { ava2_allowance: $.data.allowance_days }
          assert:
            - "TlpPlacement.${ava2_plc_id}.days_elapsed == 420"
            - "TlpPlacement.${ava2_plc_id}.base_allowance_days == 540"
            - "TlpPlacement.${ava2_plc_id}.consumed_ratio_bp == 7777"
            - "TlpPlacement.${ava2_plc_id}.life_skills_credit_hours == 40"
            - "TlpPlacement.${ava2_plc_id}.earned_bonus_days == 30"
            - "TlpPlacement.${ava2_plc_id}.allowance_days == 570"
            - "TlpPlacement.${ava2_plc_id}.allowance_days != 600"
            - "TlpPlacement.${ava2_plc_id}.tenancy_status == PLACED"
            - "LifeSkillsCompletion.${ava2_lsc_id}.credit_hours == 40"

      - name: admission_priority_score_nested_caps_and_critical_bump_clamp
        grounds:
          - calculations.admission_priority_score
          - calculations.trafficking_risk_score
          - entities.Admission.fields.priority_score
          - entities.Youth.fields.engagement_contact_count
        distinguishing_aspect: |
          Mode (a) - one formula with five inputs interacting non-linearly through nested min/max and
          a conditional branch on entity state: age_component 16, risk_component min(40, 100) = 40,
          engagement_component min(20, 5 * 5) = 20 and exposure_component 15 sum to 91, the CRITICAL
          tier adds 10 to reach 101, and the outer min(100, .) clamps the stored priority_score to
          exactly 100 - the caps and the clamp are three distinct saturation points in one formula.
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program (licensed_bed_capacity 2, band 12..17) at the default clock 2026-08-01T00:00:00Z"
            - "youth Bo Nakamura, date_of_birth 2012-06-10, so age_years is 14"
            - "five OutreachContact rows all logged at 2026-08-01T00:00:00Z, each with indicator_flags [COMMERCIAL_SEX, THIRD_PARTY_CONTROL] worth 40 + 30 = 70 undecayed points, so the summed history is 350 and Youth.trafficking_risk_score saturates at 100 with tier CRITICAL"
            - "Bo has one SafetyScreening with indicator_codes [] dispositioned CLEARED, so the admission short-circuits to ACTIVE and validations priority 19 passes"
            - "Bo has never been sheltered, so cumulative_shelter_nights is 0 and exposure_component is the full EXPOSURE_BASE 15"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { shelter3_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Bo", legal_last_name: "Nakamura", date_of_birth: "2012-06-10", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { bo_id: $.data.id }
            - call: "POST /ryhs/youths/${bo_id}/outreach-contacts"
              payload: { engagement_stage: "FIRST_CONTACT", basic_needs_provided: ["FOOD"], indicator_flags: ["COMMERCIAL_SEX", "THIRD_PARTY_CONTROL"] }
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${bo_id}/outreach-contacts"
              payload: { engagement_stage: "RAPPORT_BUILDING", basic_needs_provided: ["HYGIENE_KIT"], indicator_flags: ["COMMERCIAL_SEX", "THIRD_PARTY_CONTROL"] }
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${bo_id}/outreach-contacts"
              payload: { engagement_stage: "RAPPORT_BUILDING", basic_needs_provided: ["CLOTHING"], indicator_flags: ["COMMERCIAL_SEX", "THIRD_PARTY_CONTROL"] }
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${bo_id}/outreach-contacts"
              payload: { engagement_stage: "SERVICE_OFFER", basic_needs_provided: ["TRANSIT_PASS"], indicator_flags: ["COMMERCIAL_SEX", "THIRD_PARTY_CONTROL"] }
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${bo_id}/outreach-contacts"
              payload: { engagement_stage: "TRUST_ESTABLISHED", basic_needs_provided: ["MEDICAL_REFERRAL"], indicator_flags: ["COMMERCIAL_SEX", "THIRD_PARTY_CONTROL"] }
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${bo_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { bo_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${bo_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${bo_id}", program_id: "${shelter3_id}", planned_discharge_at: "2026-08-12T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
