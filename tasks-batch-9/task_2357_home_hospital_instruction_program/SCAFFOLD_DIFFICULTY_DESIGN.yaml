      - name: session_create_rejects_with_in_home_not_permitted_not_student_daily_limit
        grounds:
          - validations.priority_10.ERR_IN_HOME_NOT_PERMITTED
          - validations.priority_14.ERR_STUDENT_DAILY_LIMIT
        distinguishing_aspect: |
          A VIRTUAL_SYNC case already has exactly max_daily_minutes (180) scheduled on 2026-09-14, and the
          new request is a 90-minute IN_HOME session on that date, so it breaks both the safety/mode guard
          (priority 10) and the aggregate daily cap (priority 14, 270 > 180). The aggregate check is the
          one an implementation naturally performs last-but-cheapest, yet the contract demands the
          priority-10 422 ERR_IN_HOME_NOT_PERMITTED. Distinct from the first pair: both rules here are
          in the 4xx-unprocessable family and the losing rule requires an aggregate over sibling rows.
        test_recipe:
          setup:
            - "MIDDLE/VIRTUAL_SYNC rule PUBLISHED (base 240, cap 400, min_session 20, max_session 90, max_daily 180, min_gap 10, travel_buffer 0)."
            - "HomeboundCase ACTIVE with delivery_mode VIRTUAL_SYNC, weekly_entitled_minutes 270, and a FINALIZED safety review with clearance CLEARED (risk_score 5) so no safety-artifact rule is violated."
            - "Two SCHEDULED VIRTUAL_SYNC sessions on 2026-09-14: 09:00-10:30 and 11:00-12:30 (180 minutes, exactly max_daily_minutes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
