              as: Teller
              as_user_id: "teller-1"
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 180000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
