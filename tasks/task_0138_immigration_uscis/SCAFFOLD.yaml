scenario: |
  138. Immigration Case Management (USCIS): case type (I-130/485/765/131), Receipt Number, Biometrics,
  RFE response, Priority Date, Visa Bulletin, AOS interview.

  A USCIS-style case management system for petitioners and beneficiaries to track family-based
  immigration filings across four form types (I-130 Petition for Alien Relative, I-485 Adjustment of
  Status, I-765 Employment Authorization, I-131 Advance Parole). The system mints Receipt Numbers,
  schedules and tracks Biometrics appointments, issues and resolves Requests for Evidence (RFE),
  manages Priority Dates against monthly Visa Bulletin snapshots (Final Action / Dates for Filing
  charts by preference category and country of chargeability), and schedules AOS interviews. Officers
  approve or deny cases, request evidence, and reschedule biometrics. The system must compute whether
  a Priority Date is "current" under either chart, and pin per-case derived fields (e.g., RFE deadline,
  retrogression posture) deterministically.

domain_name: immigration-uscis
api_prefix: /cases

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - conditional_feature_flags
    - derived_field_reconciliation

  entity_topology: hybrid
  # Case is the central aggregate (parent) with child Biometrics, RFE, Interview, CaseEvent appointments
  # under it; VisaBulletin and CaseTypeConfig are flat reference entities; Beneficiary is a peer
  # entity linked by FK.

  state_machine_shape: branching
  # Case has a branching state machine with revert (RFE pause loop). Biometrics has parallel
  # dimensions on the Case (biometrics_status evolves independently of priority_date_status).

  relationship_patterns:
    - one_to_many        # Case has many Biometrics, RFEs, Interviews, CaseEvents
    - cross_aggregate    # Case references VisaBulletin row by (chart, preference_category, country, month)

  role_model: hierarchical_override
  # Petitioner < Beneficiary (limited) < Officer < Supervisor. Officer can act on any case in their
  # service center; Supervisor can override decision states.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — copied verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Petitioner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal full name of the petitioner
        constraints: 1..120 chars
      - name: a_number
        type: string
        source: input
        description: USCIS Alien Registration Number, if any
        default: null
        constraints: "regex ^A\\d{9}$ when present; nullable"
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD)
        constraints: must be >= 14 years before today
      - name: country_of_citizenship
        type: string
        source: input
        description: ISO 3166-1 alpha-3 country code
        constraints: 3 uppercase letters
      - name: email
        type: string
        source: input
        description: Notification address for officer correspondence
        constraints: RFC-5322

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - name: petitioner_id
        type: string
        source: input
        description: FK to Petitioner.id (sponsor)
      - name: full_name
        type: string
        source: input
        description: Legal full name
        constraints: 1..120 chars
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date
      - name: country_of_chargeability
        type: string
        source: input
        description: ISO 3166-1 alpha-3 used for Visa Bulletin chargeability
        constraints: 3 uppercase letters
      - name: preference_category
        type: enum
        source: input
        description: Family-based preference category
        constraints: "values: F1, F2A, F2B, F3, F4, IR (immediate relative — exempt from numerical limits)"
      - name: relationship_to_petitioner
        type: enum
        source: input
        description: Petitioner-beneficiary relationship
        constraints: "values: SPOUSE, CHILD, PARENT, SIBLING, FIANCE"

  - name: CaseTypeConfig
    parent: null
    common_fields: false
    fields:
      - name: case_type
        type: enum
        source: input
        description: USCIS form code
        constraints: "values: I-130, I-485, I-765, I-131"
      - name: requires_biometrics
        type: boolean
        source: input
        description: Whether Biometrics must be completed before approval
      - name: requires_interview
        type: boolean
        source: input
        description: Whether AOS interview must be completed before approval
      - name: rfe_response_window_days
        type: integer
        source: input
        description: Days the beneficiary has to respond to an RFE before automatic denial
        constraints: positive integer, typically 87
      - name: requires_priority_date_current
        type: boolean
        source: input
        description: Whether priority-date currency under Visa Bulletin gates approval (true for I-485 when not IR)
      - name: receipt_prefix
        type: string
        source: input
        description: Three-letter service-center prefix used to mint Receipt Numbers
        constraints: "values: MSC, EAC, WAC, NBC, LIN, SRC, IOE, YSC"

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: petitioner_id
        type: string
        source: input
        description: FK to Petitioner.id
      - name: beneficiary_id
        type: string
        source: input
        description: FK to Beneficiary.id
      - name: case_type
        type: enum
        source: input
        description: USCIS form code; must match a CaseTypeConfig
        constraints: "values: I-130, I-485, I-765, I-131"
      - name: receipt_number
        type: string
        source: system
        description: USCIS-style Receipt Number minted on filing
        constraints: "format: <3-letter prefix from CaseTypeConfig.receipt_prefix><10 digits>, exactly 13 chars; globally unique"
      - name: priority_date
        type: string
        source: computed
        description: |
          ISO 8601 date used to determine visa availability.
          For I-130: equals filing_date of this case.
          For I-485 with a linked approved I-130: copied from the I-130 priority_date.
          For I-765 / I-131: null.
        default: null
      - name: filing_date
        type: datetime
        source: system
        description: UTC timestamp when the case entered FILED state
      - name: status
        type: enum
        source: computed
        description: Case workflow status
        constraints: "values: DRAFT, FILED, BIOMETRICS_SCHEDULED, BIOMETRICS_COMPLETED, RFE_ISSUED, RFE_RESPONDED, INTERVIEW_SCHEDULED, READY_FOR_DECISION, APPROVED, DENIED, WITHDRAWN"
      - name: priority_date_status
        type: enum
        source: computed
        description: |
          Parallel dimension to status: whether the case's priority_date is current under the
          latest VisaBulletin. Evolves independently of workflow status.
        constraints: "values: NOT_APPLICABLE, CURRENT, NOT_CURRENT, RETROGRESSED"
        default: NOT_APPLICABLE
      - name: rfe_deadline
        type: datetime
        source: computed
        description: |
          UTC datetime by which RFE response is due. Set to the timestamp of the issuing transition
          plus CaseTypeConfig.rfe_response_window_days * 86400 seconds. Cleared on RFE response or
          automatic denial.
        default: null
      - name: linked_i130_case_id
        type: string
        source: input
        description: For I-485 only — FK to the approved I-130 Case whose priority_date is inherited
        default: null
      - name: decision_at
        type: datetime
        source: computed
        description: UTC timestamp when status entered APPROVED or DENIED
        default: null
      - name: denial_reason
        type: enum
        source: computed
        description: Reason captured when status entered DENIED
        default: null
        constraints: "values: RFE_TIMEOUT, OFFICER_DENIAL, ABANDONMENT, INELIGIBLE"

  - name: Biometrics
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id
      - name: scheduled_at
        type: datetime
        source: input
        description: UTC datetime of the biometrics appointment
      - name: location_code
        type: string
        source: input
        description: ASC (Application Support Center) code
        constraints: 4..6 uppercase letters/digits
      - name: status
        type: enum
        source: computed
        description: Lifecycle status of the appointment
        constraints: "values: SCHEDULED, COMPLETED, NO_SHOW, RESCHEDULED, CANCELLED"
      - name: reschedule_count
        type: integer
        source: computed
        description: Number of times this appointment chain has been rescheduled
        default: 0
        constraints: "<= 3; the 4th reschedule attempt is rejected"
      - name: completed_at
        type: datetime
        source: computed
        description: UTC timestamp when officer marked COMPLETED
        default: null

  - name: RFE
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id
      - name: issued_at
        type: datetime
        source: system
        description: UTC timestamp the RFE was issued
      - name: deadline_at
        type: datetime
        source: computed
        description: issued_at + CaseTypeConfig.rfe_response_window_days
      - name: reason_code
        type: enum
        source: input
        description: Why evidence was requested
        constraints: "values: MISSING_DOC, IDENTITY_DOC, FINANCIAL_PROOF, MEDICAL_EXAM, TRANSLATION"
      - name: officer_notes
        type: string
        source: input
        description: Free-text notes from the issuing officer
        constraints: 1..2000 chars
      - name: response_received_at
        type: datetime
        source: computed
        description: UTC timestamp when beneficiary responded
        default: null
      - name: status
        type: enum
        source: computed
        description: RFE lifecycle
        constraints: "values: OUTSTANDING, RESPONDED, EXPIRED"

  - name: Interview
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id (must be I-485)
      - name: scheduled_at
        type: datetime
        source: input
        description: UTC datetime of the AOS interview
      - name: field_office_code
        type: string
        source: input
        description: USCIS field office code
        constraints: 3..5 uppercase letters
      - name: status
        type: enum
        source: computed
        description: Interview lifecycle
        constraints: "values: SCHEDULED, COMPLETED, NO_SHOW, CANCELLED"
      - name: outcome
        type: enum
        source: input
        description: Officer-recorded outcome on completion
        default: null
        constraints: "values: RECOMMEND_APPROVAL, RECOMMEND_DENIAL, CONTINUED"

  - name: VisaBulletin
    parent: null
    common_fields: false
    fields:
      - name: bulletin_month
        type: string
        source: input
        description: Month the bulletin applies to, format YYYY-MM
        constraints: "regex ^\\d{4}-(0[1-9]|1[0-2])$"
      - name: chart_type
        type: enum
        source: input
        description: USCIS publishes two charts per month
        constraints: "values: FINAL_ACTION, DATES_FOR_FILING"
      - name: preference_category
        type: enum
        source: input
        description: Family preference category
        constraints: "values: F1, F2A, F2B, F3, F4"
      - name: country
        type: string
        source: input
        description: ISO 3166-1 alpha-3 country of chargeability, or the literal "ROW" for rest-of-world
        constraints: 3 uppercase letters or "ROW"
      - name: cutoff_date
        type: string
        source: input
        description: |
          Cutoff date for this row. ISO 8601 date, or the literal "CURRENT" meaning all dates are
          current for this row, or the literal "UNAVAILABLE" meaning no dates are current.
        constraints: "format: YYYY-MM-DD | 'CURRENT' | 'UNAVAILABLE'"
      - name: published_at
        type: datetime
        source: system
        description: UTC timestamp the bulletin row was published into the system

  - name: CaseEvent
    parent: Case
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to Case.id
      - name: event_type
        type: enum
        source: system
        description: System event type
        constraints: "values: STATUS_CHANGED, BIOMETRICS_SCHEDULED, BIOMETRICS_COMPLETED, RFE_ISSUED, RFE_RESPONDED, INTERVIEW_SCHEDULED, BULLETIN_REFRESHED, PRIORITY_DATE_RECOMPUTED, DECISION_RECORDED"
      - name: from_value
        type: string
        source: system
        description: Prior value (e.g., status, priority_date_status) for audit
        default: null
      - name: to_value
        type: string
        source: system
        description: New value after the event
        default: null
      - name: actor_role
        type: string
        source: system
        description: Role string of the X-User-Role header that drove the event, or "system"
      - name: occurred_at
        type: datetime
        source: system
        description: UTC timestamp of the event

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /cases/{id}/file"
        actor: Petitioner
        preconditions:
          - "Case.petitioner_id, beneficiary_id, case_type are all set"
          - "If case_type == I-485 and beneficiary.preference_category != IR, then linked_i130_case_id MUST reference an approved I-130 Case"
        side_effects:
          - "Case.filing_date := now()"
          - "Case.receipt_number := mint_receipt_number(CaseTypeConfig.receipt_prefix, sequence) — see calculations.mint_receipt_number"
          - "If case_type == I-130: Case.priority_date := today (UTC, date portion of filing_date)"
          - "If case_type == I-485 and linked_i130_case_id is set: Case.priority_date := the linked I-130 Case.priority_date"
          - "If CaseTypeConfig.requires_priority_date_current: recompute Case.priority_date_status against the latest VisaBulletin (cascade hop 1)"
          - "Emit CaseEvent(STATUS_CHANGED, DRAFT→FILED)"

      - from: FILED
        to: BIOMETRICS_SCHEDULED
        trigger: "POST /cases/{id}/biometrics"
        actor: Officer
        preconditions:
          - "CaseTypeConfig.requires_biometrics is true"
          - "No existing Biometrics row for this case with status SCHEDULED"
          - "Provided scheduled_at >= now() + 7 days"
        side_effects:
          - "Create Biometrics(case_id, scheduled_at, location_code, status=SCHEDULED, reschedule_count=0)"
          - "Emit CaseEvent(BIOMETRICS_SCHEDULED)"

      - from: BIOMETRICS_SCHEDULED
        to: BIOMETRICS_COMPLETED
        trigger: "POST /biometrics/{biometrics_id}/complete"
        actor: Officer
        preconditions:
          - "Biometrics.status == SCHEDULED"
          - "now() >= Biometrics.scheduled_at"
        side_effects:
          - "Biometrics.status := COMPLETED"
          - "Biometrics.completed_at := now()"
          - "Emit CaseEvent(BIOMETRICS_COMPLETED)"

      - from: BIOMETRICS_COMPLETED
        to: RFE_ISSUED
        trigger: "POST /cases/{id}/rfe"
        actor: Officer
        preconditions:
          - "No existing RFE row for this case with status OUTSTANDING"
        side_effects:
          - "Create RFE(case_id, issued_at=now(), deadline_at=now() + CaseTypeConfig.rfe_response_window_days days, reason_code, officer_notes, status=OUTSTANDING)"
          - "Case.rfe_deadline := RFE.deadline_at"
          - "Emit CaseEvent(RFE_ISSUED)"
        note: "RFE_ISSUED is also reachable from FILED (skipping biometrics) and INTERVIEW_SCHEDULED. See additional transitions below."

      - from: FILED
        to: RFE_ISSUED
        trigger: "POST /cases/{id}/rfe"
        actor: Officer
        preconditions:
          - "CaseTypeConfig.requires_biometrics is false (otherwise biometrics must precede)"
          - "No existing RFE row for this case with status OUTSTANDING"
        side_effects:
          - "Create RFE(...)"
          - "Case.rfe_deadline := RFE.deadline_at"
          - "Emit CaseEvent(RFE_ISSUED)"

      - from: RFE_ISSUED
        to: RFE_RESPONDED
        trigger: "POST /rfes/{rfe_id}/respond"
        actor: Beneficiary
        preconditions:
          - "RFE.status == OUTSTANDING"
          - "now() <= RFE.deadline_at"
        side_effects:
          - "RFE.status := RESPONDED"
          - "RFE.response_received_at := now()"
          - "Case.rfe_deadline := null"
          - "Emit CaseEvent(RFE_RESPONDED)"

      - from: RFE_ISSUED
        to: DENIED
        trigger: "POST /_clock/advance crossing RFE.deadline_at (system)"
        actor: system
        preconditions:
          - "RFE.status == OUTSTANDING AND now() > RFE.deadline_at"
        side_effects:
          - "RFE.status := EXPIRED"
          - "Case.status := DENIED"
          - "Case.denial_reason := RFE_TIMEOUT"
          - "Case.decision_at := now()"
          - "Cascade: if Case.priority_date is set and priority_date_status != NOT_APPLICABLE, leave it unchanged (terminal)"
          - "Cascade hop 2: for every Case where linked_i130_case_id == this.id AND this.case_type == I-130 — no priority_date inheritance change because I-130 was not approved"
          - "Emit CaseEvent(STATUS_CHANGED, RFE_ISSUED→DENIED)"
        note: "Automatic denial; only reachable via /_clock/advance."

      - from: RFE_RESPONDED
        to: INTERVIEW_SCHEDULED
        trigger: "POST /cases/{id}/interview"
        actor: Officer
        preconditions:
          - "Case.case_type == I-485 (CaseTypeConfig.requires_interview is true)"
          - "Provided scheduled_at >= now() + 14 days"
        side_effects:
          - "Create Interview(case_id, scheduled_at, field_office_code, status=SCHEDULED)"
          - "Emit CaseEvent(INTERVIEW_SCHEDULED)"

      - from: BIOMETRICS_COMPLETED
        to: INTERVIEW_SCHEDULED
        trigger: "POST /cases/{id}/interview"
        actor: Officer
        preconditions:
          - "Case.case_type == I-485"
          - "No RFE.status == OUTSTANDING for this case"
        side_effects:
          - "Create Interview(...)"
          - "Emit CaseEvent(INTERVIEW_SCHEDULED)"

      - from: INTERVIEW_SCHEDULED
        to: READY_FOR_DECISION
        trigger: "POST /interviews/{interview_id}/complete"
        actor: Officer
        preconditions:
          - "Interview.status == SCHEDULED"
          - "now() >= Interview.scheduled_at"
          - "outcome IN {RECOMMEND_APPROVAL, RECOMMEND_DENIAL, CONTINUED}"
        side_effects:
          - "Interview.status := COMPLETED"
          - "Interview.outcome := provided outcome"
          - "Emit CaseEvent(STATUS_CHANGED, INTERVIEW_SCHEDULED→READY_FOR_DECISION)"

      - from: BIOMETRICS_COMPLETED
        to: READY_FOR_DECISION
        trigger: "POST /cases/{id}/ready-for-decision"
        actor: Officer
        preconditions:
          - "CaseTypeConfig.requires_interview is false (case_type IN {I-130, I-765, I-131})"
          - "No RFE.status == OUTSTANDING"
        side_effects:
          - "Emit CaseEvent(STATUS_CHANGED, BIOMETRICS_COMPLETED→READY_FOR_DECISION)"

      - from: READY_FOR_DECISION
        to: APPROVED
        trigger: "POST /cases/{id}/decide with decision=APPROVE"
        actor: Officer
        preconditions:
          - "If CaseTypeConfig.requires_priority_date_current AND Case.priority_date_status != CURRENT then REJECT (ERR_PRIORITY_DATE_NOT_CURRENT)"
          - "If CaseTypeConfig.requires_interview then exists Interview with outcome IN {RECOMMEND_APPROVAL, CONTINUED}; RECOMMEND_DENIAL forces officer to DENY"
        side_effects:
          - "Case.decision_at := now()"
          - "Cascade hop 1: if Case.case_type == I-130 — for every dependent I-485 Case where linked_i130_case_id == this.id AND Case.priority_date is null, set dependent.priority_date := this.priority_date"
          - "Cascade hop 2: for each dependent I-485 updated in hop 1, recompute that dependent's priority_date_status against the latest VisaBulletin (transitive cascade — calculations.priority_date_currency)"
          - "Emit CaseEvent(DECISION_RECORDED, READY_FOR_DECISION→APPROVED)"

      - from: READY_FOR_DECISION
        to: DENIED
        trigger: "POST /cases/{id}/decide with decision=DENY"
        actor: Officer
        preconditions:
          - "Officer provides denial_reason IN {OFFICER_DENIAL, INELIGIBLE}"
        side_effects:
          - "Case.decision_at := now()"
          - "Case.denial_reason := provided value"
          - "Cascade hop 1: if Case.case_type == I-130 — for every dependent I-485 Case where linked_i130_case_id == this.id AND status NOT IN {APPROVED, DENIED, WITHDRAWN}, force dependent.status := DENIED, dependent.denial_reason := INELIGIBLE, dependent.decision_at := now()"
          - "Cascade hop 2: for every dependent I-485 denied in hop 1 — auto-cancel any Interview with status SCHEDULED on that dependent (Interview.status := CANCELLED) and auto-cancel any Biometrics with status SCHEDULED (Biometrics.status := CANCELLED)"
          - "Emit CaseEvent(DECISION_RECORDED, READY_FOR_DECISION→DENIED) plus a CaseEvent on each dependent"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Petitioner
        preconditions: []
        side_effects:
          - "Case.decision_at := now()"
          - "Emit CaseEvent(STATUS_CHANGED, DRAFT→WITHDRAWN)"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Petitioner
        preconditions:
          - "No Biometrics.status == COMPLETED on this case"
        side_effects:
          - "Case.decision_at := now()"
          - "Emit CaseEvent(STATUS_CHANGED, FILED→WITHDRAWN)"

      - from: BIOMETRICS_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Petitioner
        preconditions: []
        side_effects:
          - "Case.decision_at := now()"
          - "For each Biometrics on this case with status == SCHEDULED, Biometrics.status := CANCELLED"
          - "Emit CaseEvent(STATUS_CHANGED, BIOMETRICS_SCHEDULED→WITHDRAWN)"

  - entity: Biometrics
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /biometrics/{id}/complete"
        actor: Officer
        preconditions:
          - "now() >= Biometrics.scheduled_at"
        side_effects:
          - "completed_at := now()"
          - "Parent Case.status := BIOMETRICS_COMPLETED if Case.status == BIOMETRICS_SCHEDULED"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /biometrics/{id}/no-show"
        actor: Officer
        preconditions:
          - "now() > Biometrics.scheduled_at + 24 hours"
        side_effects:
          - "Parent Case.status remains BIOMETRICS_SCHEDULED (officer can reschedule)"

      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /biometrics/{id}/reschedule"
        actor: Officer
        preconditions:
          - "Biometrics.reschedule_count < 3"
          - "Provided new_scheduled_at >= now() + 7 days"
          - "now() <= Biometrics.scheduled_at - 24 hours (cannot reschedule within last 24h)"
        side_effects:
          - "Old Biometrics.status := RESCHEDULED"
          - "Create new Biometrics(case_id, scheduled_at=new_scheduled_at, location_code, status=SCHEDULED, reschedule_count=old.reschedule_count+1)"
        note: "The new Biometrics row enters initial_state SCHEDULED with its reschedule_count incremented."

      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /biometrics/{id}/reschedule"
        actor: Officer
        preconditions:
          - "Biometrics.reschedule_count < 3"
        side_effects:
          - "Create new Biometrics row (reschedule_count = old + 1)"
          - "Old row stays in NO_SHOW (audit)"
        note: "Cyclic loop: NO_SHOW → SCHEDULED via reschedule."

  - entity: RFE
    initial_state: OUTSTANDING
    terminal_states: [RESPONDED, EXPIRED]
    transitions:
      - from: OUTSTANDING
        to: RESPONDED
        trigger: "POST /rfes/{id}/respond"
        actor: Beneficiary
        preconditions:
          - "now() <= deadline_at"
        side_effects:
          - "response_received_at := now()"
          - "Parent Case transitions RFE_ISSUED → RFE_RESPONDED"

      - from: OUTSTANDING
        to: EXPIRED
        trigger: "POST /_clock/advance crossing deadline_at (system)"
        actor: system
        preconditions:
          - "now() > deadline_at"
        side_effects:
          - "Parent Case.status := DENIED with denial_reason=RFE_TIMEOUT"

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /interviews/{id}/complete"
        actor: Officer
        preconditions:
          - "now() >= scheduled_at"
        side_effects:
          - "outcome := provided value"
          - "Parent Case.status := READY_FOR_DECISION"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /interviews/{id}/no-show"
        actor: Officer
        preconditions:
          - "now() > scheduled_at + 24 hours"
        side_effects:
          - "Parent Case remains INTERVIEW_SCHEDULED (officer may reschedule or deny)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "System cascade from parent Case decision/withdrawal"
        actor: system
        preconditions:
          - "Parent Case transitions to DENIED or WITHDRAWN"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two officers attempt to issue an RFE on the same case simultaneously"
    guarantee: "At most one OUTSTANDING RFE per case; the second insert is rejected"
    error_id: ERR_RFE_ALREADY_OUTSTANDING
    http_status: 409
    serialization: "First-writer-wins on RFE creation; loser sees the existing RFE.id"

  - scenario: "Officer approves while system auto-denies via RFE timeout at the same instant"
    guarantee: "Exactly one decision wins; loser is rejected on stale state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Case.status; the loser sees the new terminal status"

  - scenario: "Two filings race to mint the same receipt_number for the same prefix"
    guarantee: "Receipt numbers are globally unique; the second filer gets a fresh number"
    error_id: ERR_RECEIPT_NUMBER_COLLISION
    http_status: 409
    serialization: "Monotonic sequence per receipt_prefix; second writer retries and receives prefix + (sequence+1)"

  - scenario: "Beneficiary responds to RFE while clock advance is auto-expiring it"
    guarantee: "Exactly one wins; if clock-advance fired first, response is rejected"
    error_id: ERR_RFE_DEADLINE_PASSED
    http_status: 409
    serialization: "First-writer-wins on RFE.status; loser sees status=EXPIRED"

  - scenario: "Petitioner withdraws while officer approves on a READY_FOR_DECISION case"
    guarantee: "Exactly one terminal transition; loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Case.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: priority_date_currency
    description: |
      Decides whether a Case.priority_date is "current" against the latest VisaBulletin, producing
      Case.priority_date_status. USCIS publishes TWO charts per month — FINAL_ACTION and
      DATES_FOR_FILING — and the policy of which chart is in effect for I-485 can change
      month-to-month. This calculation has TWO variants based on which chart is in effect; both
      can produce different answers for the same priority_date.
    trigger: "Case enters FILED; I-130 APPROVED cascade hop 2; a newer VisaBulletin row is published; POST /cases/{id}/refresh-priority-date"
    algorithm: threshold
    formula: |
      # Pin the relevant bulletin row
      row = SELECT VisaBulletin
            WHERE chart_type == :chart_in_effect
              AND preference_category == Beneficiary.preference_category
              AND country IN (Beneficiary.country_of_chargeability, 'ROW')
              AND bulletin_month == latest_published_month
            ORDER BY (country == Beneficiary.country_of_chargeability) DESC   # country-specific row beats ROW
            LIMIT 1

      if row is None:
          status := NOT_CURRENT
      elif row.cutoff_date == 'CURRENT':
          status := CURRENT
      elif row.cutoff_date == 'UNAVAILABLE':
          status := NOT_CURRENT
      else:
          # cutoff_date is a real date — exact boundary semantics:
          # Case.priority_date STRICTLY BEFORE cutoff_date is CURRENT.
          # Case.priority_date == cutoff_date is NOT current (cutoff date itself is not yet current).
          if Case.priority_date < row.cutoff_date:
              status := CURRENT
          else:
              status := NOT_CURRENT

      # Retrogression detection — compares against this case's previously stored priority_date_status:
      if previous_status == CURRENT and status == NOT_CURRENT:
          status := RETROGRESSED
    input_set: |
      Source entities: VisaBulletin rows whose bulletin_month is the most-recently-published month
      across all chart_types. Filtering: chart_in_effect (variant), preference_category match,
      country match with explicit ROW fallback (country-specific row wins tie-break).
    constants:
      LATEST_MONTH_SELECTION: "MAX(VisaBulletin.bulletin_month) by lexical YYYY-MM order; if ties at month, MAX(published_at)"
      ROW_LITERAL: "ROW"
    precision: date-only, no time component; comparisons are strict <
    variants:
      - name: final_action_chart
        when: "chart_in_effect == FINAL_ACTION (default; USCIS issues final visa numbers off this chart)"
        difference: "Picks rows where chart_type == FINAL_ACTION"
      - name: dates_for_filing_chart
        when: "chart_in_effect == DATES_FOR_FILING (when USCIS announces filers may use this chart for a given month)"
        difference: |
          Picks rows where chart_type == DATES_FOR_FILING. The two charts publish DIFFERENT cutoff
          dates for the same (category, country, month), so the same Case.priority_date can be CURRENT
          under DATES_FOR_FILING but NOT_CURRENT under FINAL_ACTION (or vice versa, rarely). The
          system pins which chart is "in effect" via a server-managed configuration set per bulletin
          month via POST /admin/visa-bulletin/chart-in-effect.

  - name: rfe_response_deadline
    description: |
      Computes the absolute deadline by which a Request for Evidence must be responded to. Pure
      time-arithmetic but feeds into automatic denial (transitive cascade).
    trigger: "RFE row creation (transition into RFE_ISSUED)"
    algorithm: threshold
    formula: |
      RFE.deadline_at = RFE.issued_at + (CaseTypeConfig.rfe_response_window_days * 86400 seconds)
      Case.rfe_deadline = RFE.deadline_at
    input_set: "Exactly the RFE row being created plus its case's CaseTypeConfig"
    constants:
      DEFAULT_WINDOW_DAYS_I130: 87
      DEFAULT_WINDOW_DAYS_I485: 87
      DEFAULT_WINDOW_DAYS_I765: 87
      DEFAULT_WINDOW_DAYS_I131: 87
    precision: |
      Stored as ISO 8601 datetime to millisecond precision. Comparison rule:
      now() > deadline_at triggers EXPIRED (strict greater-than; the exact instant equal to
      deadline_at is still in-window).

  - name: mint_receipt_number
    description: |
      Mints USCIS-style Receipt Numbers exactly 13 characters long. Deterministic combinatorial
      formula across three inputs (prefix, year-bucket, monotonic sequence) with non-linear
      interactions in the digit layout. Evaluation ORDER is pinned: prefix is chosen first, then
      sequence is consumed atomically per-prefix, then digits are formatted with zero-padding.
    trigger: "Case transitions DRAFT → FILED"
    algorithm: chronological
    formula: |
      # Inputs: CaseTypeConfig.receipt_prefix (str), CaseTypeConfig (entity), now() (datetime)
      # Step 1 — pick prefix:   p   := CaseTypeConfig.receipt_prefix      # 3 letters
      # Step 2 — pick year:     yr2 := (now().year mod 100) as 2-digit zero-padded string
      # Step 3 — pick day-of-fiscal-year bucket:
      #   fy_start := October 1 of (now().year if now().month >= 10 else now().year - 1)
      #   doy3     := zero-padded 3-digit day-of-fiscal-year (1..366) of now()  # tier-style bucket
      # Step 4 — consume monotonic sequence for (prefix, fiscal_year):
      #   seq5     := zero-padded 5-digit next sequence for (p, fy_start.year)
      # Step 5 — assemble: receipt_number := p + yr2 + doy3 + seq5
      # Total length: 3 + 2 + 3 + 5 = 13 characters
      # Order of evaluation is pinned: prefix → yr2 → doy3 → seq5 → concat
      # Concurrent filings on the same (p, fy_start.year) MUST observe a monotonic sequence;
      # rounding does not apply (integer arithmetic).
    input_set: "Exactly one CaseTypeConfig row (matched by Case.case_type) and the wall clock now()"
    constants:
      FISCAL_YEAR_START_MONTH: 10
      PREFIX_LENGTH: 3
      YEAR_LENGTH: 2
      DOY_LENGTH: 3
      SEQ_LENGTH: 5
      TOTAL_LENGTH: 13
    precision: "Integer; zero-padded string concatenation; no rounding"

  - name: case_completeness_score
    description: |
      A weighted multi-factor score (0..100) summarising case progress, used for officer triage
      ranking. Combinatorial formula across 4 inputs with nested conditional branches AND a
      pinned rounding order — the per-factor weighted score is rounded BEFORE summing.
    trigger: "Any mutation on Case, Biometrics, RFE, Interview; recomputed on read via GET /cases/{id}/summary"
    algorithm: weighted_scoring
    formula: |
      # Inputs: Case status, count of Biometrics.COMPLETED, count of RFE.RESPONDED, presence of
      # Interview.COMPLETED, priority_date_status.
      #
      # Per-factor raw scores (each 0..1):
      f_status       := { DRAFT:0.00, FILED:0.10, BIOMETRICS_SCHEDULED:0.20, BIOMETRICS_COMPLETED:0.40,
                          RFE_ISSUED:0.30, RFE_RESPONDED:0.50, INTERVIEW_SCHEDULED:0.70,
                          READY_FOR_DECISION:0.90, APPROVED:1.00, DENIED:1.00, WITHDRAWN:1.00 }[Case.status]
      f_biometrics   := 1.00 if exists Biometrics.status == COMPLETED on this case else 0.00
      f_rfe          := 1.00 if (CaseTypeConfig.requires_priority_date_current==false OR not exists OUTSTANDING RFE) else 0.00
      f_interview    := 1.00 if exists Interview.status == COMPLETED on this case
                        else (0.50 if exists Interview.status == SCHEDULED else 0.00)
      f_priority     := 1.00 if Case.priority_date_status IN {CURRENT, NOT_APPLICABLE}
                        else (0.50 if Case.priority_date_status == NOT_CURRENT
                        else 0.00 if Case.priority_date_status == RETROGRESSED else 0.00)
      # Weights sum to 1.00:
      w := { status: 0.40, biometrics: 0.20, rfe: 0.10, interview: 0.15, priority: 0.15 }
      # Pinned rounding ORDER: round each weighted product to 2 dp FIRST, then sum, then multiply
      # by 100 and round to integer.
      s_status       := round(f_status     * w.status,     2)
      s_biometrics   := round(f_biometrics * w.biometrics, 2)
      s_rfe          := round(f_rfe        * w.rfe,        2)
      s_interview    := round(f_interview  * w.interview,  2)
      s_priority     := round(f_priority   * w.priority,   2)
      total          := round((s_status + s_biometrics + s_rfe + s_interview + s_priority) * 100, 0)
      # Clamp to [0, 100]:
      case_completeness_score := max(0, min(100, total))
    input_set: "This Case row, all Biometrics with case_id == this.id, all RFE with case_id == this.id, all Interview with case_id == this.id"
    constants:
      WEIGHT_STATUS: 0.40
      WEIGHT_BIOMETRICS: 0.20
      WEIGHT_RFE: 0.10
      WEIGHT_INTERVIEW: 0.15
      WEIGHT_PRIORITY: 0.15
      ROUND_PER_FACTOR_DP: 2
      ROUND_FINAL_DP: 0
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "Per-factor scores 2 decimal places half-up; final score integer half-up; clamp 0..100"
    variants:
      - name: live_summary
        when: "GET /cases/{id}/summary"
        difference: "Computed on-read against current child rows; never persisted"
      - name: snapshot_at_decision
        when: "Case transitions to APPROVED or DENIED — score is recomputed and recorded into the CaseEvent.to_value of the DECISION_RECORDED event"
        difference: "Persists into CaseEvent audit row; never overwritten after decision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_AUTH_MISSING_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role value is a known role from §1.7"
    error_id: ERR_AUTH_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "All path resources exist (validated left-to-right): case_id, biometrics_id, rfe_id, interview_id, beneficiary_id"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Cross-reference resources in the body exist: petitioner_id, beneficiary_id, linked_i130_case_id"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /cases; POST /cases/{id}/file"

  - priority: 6
    category: state
    check: "Target resource is in a state where the requested transition is permitted (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all mutating endpoints"

  - priority: 7
    category: business_safety
    check: "An I-485 filing must reference a linked_i130_case_id whose status == APPROVED unless beneficiary.preference_category == IR"
    error_id: ERR_I485_MISSING_APPROVED_I130
    http_status: 422
    applies_to: "POST /cases/{id}/file (case_type==I-485)"

  - priority: 8
    category: business_safety
    check: "An I-485 decision to APPROVE is rejected when Case.priority_date_status != CURRENT for cases that require priority-date currency"
    error_id: ERR_PRIORITY_DATE_NOT_CURRENT
    http_status: 409
    applies_to: "POST /cases/{id}/decide (case_type==I-485, decision==APPROVE)"

  - priority: 9
    category: business_referential
    check: "RFE creation rejected if an OUTSTANDING RFE already exists for the case"
    error_id: ERR_RFE_ALREADY_OUTSTANDING
    http_status: 409
    applies_to: "POST /cases/{id}/rfe"

  - priority: 10
    category: business_referential
    check: "Biometrics creation rejected if a SCHEDULED Biometrics already exists for the case"
    error_id: ERR_BIOMETRICS_ALREADY_SCHEDULED
    http_status: 409
    applies_to: "POST /cases/{id}/biometrics"

  - priority: 11
    category: business_temporal
    check: "Biometrics.scheduled_at must be >= now() + 7 days"
    error_id: ERR_BIOMETRICS_TOO_SOON
    http_status: 422
    applies_to: "POST /cases/{id}/biometrics; POST /biometrics/{id}/reschedule"

  - priority: 12
    category: business_temporal
    check: "Interview.scheduled_at must be >= now() + 14 days"
    error_id: ERR_INTERVIEW_TOO_SOON
    http_status: 422
    applies_to: "POST /cases/{id}/interview"

  - priority: 13
    category: business_temporal
    check: "RFE response rejected if now() > deadline_at (strict)"
    error_id: ERR_RFE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /rfes/{id}/respond"

  - priority: 14
    category: business_constraint
    check: "Biometrics.reschedule_count < 3 — the 4th reschedule attempt on the same chain is rejected"
    error_id: ERR_BIOMETRICS_RESCHEDULE_LIMIT
    http_status: 409
    applies_to: "POST /biometrics/{id}/reschedule"

  - priority: 15
    category: business_constraint
    check: "Biometrics reschedule rejected when now() > scheduled_at - 24h"
    error_id: ERR_BIOMETRICS_RESCHEDULE_TOO_LATE
    http_status: 422
    applies_to: "POST /biometrics/{id}/reschedule"

  - priority: 16
    category: business_constraint
    check: "Interview can only be scheduled on case_type == I-485"
    error_id: ERR_INTERVIEW_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /cases/{id}/interview"

  - priority: 17
    category: business_constraint
    check: "OCC: provided version must match current entity version on PATCH endpoints"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 18
    category: business_constraint
    check: "Receipt number must be globally unique"
    error_id: ERR_RECEIPT_NUMBER_COLLISION
    http_status: 409
    applies_to: "POST /cases/{id}/file"

  - priority: 19
    category: business_constraint
    check: "Pagination parameters: 1 <= limit <= 100; offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

  - priority: 20
    category: business_constraint
    check: "Request body shape: required fields present, enums in declared sets, dates ISO-8601"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Petitioners ----
  - method: POST
    path: "/petitioners"
    description: "Create a petitioner profile"
    roles: [Petitioner, Officer, Supervisor]
    code: 201
    input: ["full_name", "date_of_birth", "country_of_citizenship", "email", "a_number?"]
    output: Petitioner
    side_effects: []

  - method: GET
    path: "/petitioners/{petitioner_id}"
    description: "Fetch a petitioner"
    roles: [Petitioner, Officer, Supervisor]
    code: 200
    input: []
    output: Petitioner
    side_effects: []

  # ---- Beneficiaries ----
  - method: POST
    path: "/petitioners/{petitioner_id}/beneficiaries"
    description: "Create a beneficiary under a petitioner"
    roles: [Petitioner, Officer, Supervisor]
    code: 201
    input: [full_name, date_of_birth, country_of_chargeability, preference_category, relationship_to_petitioner]
    output: Beneficiary
    side_effects: []

  - method: GET
    path: "/beneficiaries/{beneficiary_id}"
    description: "Fetch a beneficiary"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  # ---- Case-Type Configuration ----
  - method: POST
    path: "/admin/case-type-config"
    description: "Upsert a case-type config row (idempotent on case_type)"
    roles: [Supervisor]
    code: 201
    input: [case_type, requires_biometrics, requires_interview, rfe_response_window_days, requires_priority_date_current, receipt_prefix]
    output: CaseTypeConfig
    side_effects: []

  - method: GET
    path: "/admin/case-type-config/{case_type}"
    description: "Fetch a case-type config"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: []
    output: CaseTypeConfig
    side_effects: []

  # ---- Cases ----
  - method: POST
    path: "/cases"
    description: "Create a Case in DRAFT"
    roles: [Petitioner, Officer]
    code: 201
    input: ["petitioner_id", "beneficiary_id", "case_type", "linked_i130_case_id?"]
    output: Case
    side_effects: ["Case.status := DRAFT"]

  - method: GET
    path: "/cases/{case_id}"
    description: "Fetch a Case (including computed priority_date_status)"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/cases"
    description: "List cases with filtering and pagination"
    roles: [Officer, Supervisor]
    code: 200
    input: ["status?", "case_type?", "petitioner_id?", "beneficiary_id?", "priority_date_status?", "limit?", "offset?"]
    output: "Case[]"
    side_effects: []

  - method: POST
    path: "/cases/{case_id}/file"
    description: "Transition DRAFT → FILED; mints receipt_number; triggers priority-date recomputation"
    roles: [Petitioner]
    code: 200
    input: []
    output: Case
    side_effects:
      - "calculations.mint_receipt_number"
      - "calculations.priority_date_currency (if applicable)"
      - "CaseEvent(STATUS_CHANGED)"

  - method: POST
    path: "/cases/{case_id}/biometrics"
    description: "Schedule biometrics — transitions Case to BIOMETRICS_SCHEDULED"
    roles: [Officer]
    code: 201
    input: [scheduled_at, location_code]
    output: Biometrics
    side_effects: ["Case.status update; CaseEvent(BIOMETRICS_SCHEDULED)"]

  - method: POST
    path: "/cases/{case_id}/rfe"
    description: "Issue an RFE — transitions Case to RFE_ISSUED; sets Case.rfe_deadline"
    roles: [Officer]
    code: 201
    input: [reason_code, officer_notes]
    output: RFE
    side_effects: ["calculations.rfe_response_deadline; CaseEvent(RFE_ISSUED)"]

  - method: POST
    path: "/cases/{case_id}/interview"
    description: "Schedule AOS interview — only valid for I-485"
    roles: [Officer]
    code: 201
    input: [scheduled_at, field_office_code]
    output: Interview
    side_effects: ["CaseEvent(INTERVIEW_SCHEDULED)"]

  - method: POST
    path: "/cases/{case_id}/ready-for-decision"
    description: "Manually mark a non-I-485 case ready for officer decision"
    roles: [Officer]
    code: 200
    input: []
    output: Case
    side_effects: ["CaseEvent(STATUS_CHANGED)"]

  - method: POST
    path: "/cases/{case_id}/decide"
    description: "Officer/Supervisor records APPROVE or DENY"
    roles: [Officer, Supervisor]
    code: 200
    input: ["decision", "denial_reason?"]
    output: Case
    side_effects:
      - "Cascade hop 1+2 on linked I-485 dependents if case_type == I-130"
      - "calculations.priority_date_currency on each dependent"
      - "calculations.case_completeness_score (snapshot_at_decision)"
      - "CaseEvent(DECISION_RECORDED)"

  - method: POST
    path: "/cases/{case_id}/withdraw"
    description: "Petitioner withdraws the case (terminal WITHDRAWN)"
    roles: [Petitioner]
    code: 200
    input: []
    output: Case
    side_effects: ["Cancel any SCHEDULED child Biometrics/Interview"]

  - method: POST
    path: "/cases/{case_id}/refresh-priority-date"
    description: "Force a recomputation of Case.priority_date_status against the latest VisaBulletin"
    roles: [Officer, Supervisor]
    code: 200
    input: []
    output: Case
    side_effects: ["calculations.priority_date_currency; CaseEvent(PRIORITY_DATE_RECOMPUTED)"]

  - method: GET
    path: "/cases/{case_id}/summary"
    description: "Live computed snapshot of a case including case_completeness_score (live_summary variant) and full child counts"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: []
    output: "object containing Case fields + computed score + child counters"
    side_effects: ["calculations.case_completeness_score (live)"]

  - method: GET
    path: "/cases/{case_id}/events"
    description: "Audit feed for a case"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: "CaseEvent[]"
    side_effects: []

  # ---- Biometrics ----
  - method: GET
    path: "/biometrics/{biometrics_id}"
    description: "Fetch a biometrics appointment"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: []
    output: Biometrics
    side_effects: []

  - method: POST
    path: "/biometrics/{biometrics_id}/complete"
    description: "Mark a biometrics appointment COMPLETED"
    roles: [Officer]
    code: 200
    input: []
    output: Biometrics
    side_effects: ["Parent Case.status := BIOMETRICS_COMPLETED"]

  - method: POST
    path: "/biometrics/{biometrics_id}/no-show"
    description: "Mark a biometrics appointment NO_SHOW"
    roles: [Officer]
    code: 200
    input: []
    output: Biometrics
    side_effects: []

  - method: POST
    path: "/biometrics/{biometrics_id}/reschedule"
    description: "Reschedule an existing biometrics appointment; creates a fresh SCHEDULED row with reschedule_count + 1"
    roles: [Officer]
    code: 201
    input: [new_scheduled_at, location_code]
    output: Biometrics
    side_effects: ["Old row → RESCHEDULED; new row created"]

  # ---- RFE ----
  - method: GET
    path: "/rfes/{rfe_id}"
    description: "Fetch an RFE"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: []
    output: RFE
    side_effects: []

  - method: POST
    path: "/rfes/{rfe_id}/respond"
    description: "Beneficiary submits RFE response"
    roles: [Beneficiary, Petitioner]
    code: 200
    input: []
    output: RFE
    side_effects: ["Parent Case → RFE_RESPONDED; Case.rfe_deadline := null"]

  # ---- Interviews ----
  - method: GET
    path: "/interviews/{interview_id}"
    description: "Fetch an interview"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: []
    output: Interview
    side_effects: []

  - method: POST
    path: "/interviews/{interview_id}/complete"
    description: "Officer marks interview COMPLETED with an outcome"
    roles: [Officer]
    code: 200
    input: [outcome]
    output: Interview
    side_effects: ["Parent Case → READY_FOR_DECISION"]

  - method: POST
    path: "/interviews/{interview_id}/no-show"
    description: "Mark interview NO_SHOW (cannot be earlier than scheduled_at + 24h)"
    roles: [Officer]
    code: 200
    input: []
    output: Interview
    side_effects: []

  # ---- Visa Bulletin ----
  - method: POST
    path: "/admin/visa-bulletin"
    description: "Publish a VisaBulletin row"
    roles: [Supervisor]
    code: 201
    input: [bulletin_month, chart_type, preference_category, country, cutoff_date]
    output: VisaBulletin
    side_effects: ["Sets published_at := now()"]

  - method: GET
    path: "/admin/visa-bulletin"
    description: "List VisaBulletin rows with filtering"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: ["bulletin_month?", "chart_type?", "preference_category?", "country?", "limit?", "offset?"]
    output: "VisaBulletin[]"
    side_effects: []

  - method: POST
    path: "/admin/visa-bulletin/chart-in-effect"
    description: "Configure which chart (FINAL_ACTION or DATES_FOR_FILING) governs priority-date currency for I-485"
    roles: [Supervisor]
    code: 200
    input: [chart_type]
    output: "object {chart_in_effect: <enum>}"
    side_effects: ["calculations.priority_date_currency may produce different results next time it is invoked"]

  # ---- System ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server clock to a specified ISO 8601 UTC timestamp; runs all time-triggered sweeps (RFE expiry → automatic case denial cascade)"
    roles: [Supervisor]
    code: 200
    input: [to]
    output: "object {now: ISO8601, expired_rfes: integer, auto_denied_cases: integer}"
    side_effects:
      - "For each RFE with status == OUTSTANDING AND now() > deadline_at: RFE.status := EXPIRED; parent Case → DENIED with denial_reason=RFE_TIMEOUT (cascade hop 1)"
      - "For each Case auto-denied above whose case_type == I-130: cascade hop 2 — any dependent I-485 (linked_i130_case_id == this.id) with non-terminal status is also DENIED with denial_reason=INELIGIBLE; their SCHEDULED Biometrics/Interview rows are CANCELLED (cascade hop 3)"

  - method: GET
    path: "/_clock"
    description: "Read the current server clock (test introspection)"
    roles: [Petitioner, Beneficiary, Officer, Supervisor]
    code: 200
    input: []
    output: "object {now: ISO8601}"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_AUTH_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not in the role set declared in §1.7"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role is not permitted to invoke this endpoint or act on this resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path resource (case_id, biometrics_id, rfe_id, interview_id, beneficiary_id, petitioner_id) does not exist"
  - id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 422
    condition: "A FK in the request body (petitioner_id, beneficiary_id, linked_i130_case_id) does not exist"
  - id: ERR_VALIDATION
    http: 422
    condition: "Request body schema violation: missing field, type mismatch, enum out of set, bad ISO date"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit out of [1,100] or offset < 0"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state where the requested transition is permitted"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency control: provided version != current version on PATCH"
  - id: ERR_RFE_ALREADY_OUTSTANDING
    http: 409
    condition: "Attempt to issue an RFE while one with status OUTSTANDING already exists on the same case"
  - id: ERR_BIOMETRICS_ALREADY_SCHEDULED
    http: 409
    condition: "Attempt to schedule biometrics while a SCHEDULED row already exists on the same case"
  - id: ERR_BIOMETRICS_TOO_SOON
    http: 422
    condition: "scheduled_at < now() + 7 days"
  - id: ERR_INTERVIEW_TOO_SOON
    http: 422
    condition: "Interview scheduled_at < now() + 14 days"
  - id: ERR_INTERVIEW_NOT_APPLICABLE
    http: 422
    condition: "Interview requested for a case whose case_type is not I-485"
  - id: ERR_BIOMETRICS_RESCHEDULE_LIMIT
    http: 409
    condition: "Reschedule attempted on a chain whose reschedule_count is already 3"
  - id: ERR_BIOMETRICS_RESCHEDULE_TOO_LATE
    http: 422
    condition: "Reschedule requested within 24h of the appointment"
  - id: ERR_RFE_DEADLINE_PASSED
    http: 409
    condition: "RFE response attempted after deadline_at (strict greater-than)"
  - id: ERR_I485_MISSING_APPROVED_I130
    http: 422
    condition: "I-485 filed for non-IR beneficiary without a linked_i130_case_id whose Case.status == APPROVED"
  - id: ERR_PRIORITY_DATE_NOT_CURRENT
    http: 409
    condition: "APPROVE decision on a case requiring priority-date currency where priority_date_status != CURRENT"
  - id: ERR_RECEIPT_NUMBER_COLLISION
    http: 409
    condition: "Two concurrent filings raced to mint the same receipt_number"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Petitioner
    description: "Sponsor who creates beneficiaries, files cases, withdraws cases, and responds to RFEs on behalf of the beneficiary"
    identity: "entity_backed:Petitioner"
    exclusive_operations:
      - "POST /cases/{id}/file"
      - "POST /cases/{id}/withdraw"
    shared_operations:
      - "POST /petitioners (create own)"
      - "POST /petitioners/{id}/beneficiaries (own petitioner only)"
      - "POST /cases (own petitioner only)"
      - "POST /rfes/{id}/respond"
      - "GET /cases/{id}, /cases/{id}/events, /cases/{id}/summary (own cases only)"

  - name: Beneficiary
    description: "Individual on whose behalf a case is filed; can respond to RFEs and read own case data"
    identity: "entity_backed:Beneficiary"
    exclusive_operations: []
    shared_operations:
      - "POST /rfes/{id}/respond (own case)"
      - "GET /cases/{id}, /cases/{id}/events, /cases/{id}/summary (own cases only)"
      - "GET /beneficiaries/{id} (self only)"

  - name: Officer
    description: "USCIS adjudicator who schedules biometrics, issues RFEs, schedules interviews, and records decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{id}/biometrics"
      - "POST /cases/{id}/rfe"
      - "POST /cases/{id}/interview"
      - "POST /cases/{id}/ready-for-decision"
      - "POST /cases/{id}/refresh-priority-date"
      - "POST /biometrics/{id}/complete"
      - "POST /biometrics/{id}/no-show"
      - "POST /biometrics/{id}/reschedule"
      - "POST /interviews/{id}/complete"
      - "POST /interviews/{id}/no-show"
    shared_operations:
      - "POST /cases (officer-initiated filings)"
      - "POST /cases/{id}/decide"
      - "GET /cases (full list across all cases)"

  - name: Supervisor
    description: "Senior officer who can do anything an Officer can, plus configure case-types, publish Visa Bulletins, set chart-in-effect, and advance the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /admin/case-type-config"
      - "POST /admin/visa-bulletin"
      - "POST /admin/visa-bulletin/chart-in-effect"
      - "POST /_clock/advance"
    shared_operations:
      - "Every Officer-eligible endpoint"
      - "POST /cases/{id}/decide"
