  - rule_id: compensating_invariant
    instances:
      - name: voiding_an_approved_drawing_returns_every_cent_and_the_five_bucket_identity_never_drifts
        grounds:
          - state_machines.ShopDrawing.APPROVED_to_VOID
          - "endpoints.POST_/shop-drawings/{id}/void"
          - calculations.fabrication_cost_estimate.variants.shop_drawing_actual
          - entities.ExhibitProject.fields.uncommitted_cents
          - validations.priority_51
        distinguishing_aspect: |
          committed_fabrication_cents is a derived ledger fed by drawing approvals
          and drained by voids, and the five buckets - committed, retainage,
          warranty reserve, released and uncommitted - must sum to
          contract_value_cents after every single write. The compensation has to
          release exactly actual_cost_cents, which is the ALREADY-ROUNDED
          per-line-item total, not a recomputation from the estimate variant and
          not a recomputation from the current inputs. Re-approving an identical
          replacement drawing must land the ledger on the byte-identical numbers it
          held before the void, and a second void of the same drawing must be
          refused rather than crediting the money twice - the classic
          double-compensation bug.
        test_recipe:
          setup:
            - "project with contract_value_cents 9000000 in phase FABRICATION"
            - "interactive int1 has an APPROVED prototype so drawings may name it"
            - "material spec mat1 (INTERACTIVE_HOUSING) is APPROVED by conservation"
