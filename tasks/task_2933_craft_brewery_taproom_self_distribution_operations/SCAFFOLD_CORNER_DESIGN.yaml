  - section: consistency_model
    instances:
      - name: every_derived_field_is_current_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.distribution_allocation_waterfall
          - state_machines.PackagingRun
        distinguishing_aspect: "No read-after-write lag anywhere: the allocate response itself carries the allocation lines and the frozen landed cost, the run it drew from already shows allocated_bbl moved out of available_bbl in a GET issued immediately afterwards, and the ship response shows the licence's YTD counter already advanced. A single request never leaves a denormalized field to catch up."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT with COLA_APPROVED; ID SELF_DISTRIBUTION licence with a 1000.00 bbl cap."
            - "Batch B-1001 CONDITIONING at 16.000 bbl; run R-1 (DISTRIBUTION, 10 units) COMPLETED, so 5.000 bbl are available."
