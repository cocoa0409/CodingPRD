# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7 claims not already covered by §1.8.
# Every non-stub instance carries an executable setup_api_calls chain; stubs cite a §1.8 instance.
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_program_returns_open_status
        claim_type: creation
        grounds: [entities.Program.fields.status, endpoints]
        distinguishing_aspect: "POST /programs with all required fields returns 201 with status OPEN and the echoed configuration."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
          assert:
            - "response.status == 201"
            - "data.status == OPEN"
            - "data.ami_limit_pct == 80"

      - name: create_program_missing_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Program.fields.max_assistance_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /programs omitting max_assistance_cents fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_applicant_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Applicant, "errors[ERR_APPLICANT_NOT_FOUND]"]
        distinguishing_aspect: "GET /applicants/{unknown-uuid} returns ERR_APPLICANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/applicants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_APPLICANT_NOT_FOUND"

      - name: create_funding_source_initializes_ledger
        claim_type: computed_fields
        grounds: [entities.FundingSource.fields.available_cents, entities.FundingSource.fields.reserved_cents]
        distinguishing_aspect: "POST /funding-sources sets available_cents = total_appropriation_cents, reserved_cents = 0, disbursed_cents = 0, status ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/funding-sources"
              payload: { name: "HOME Fund", priority: 1, total_appropriation_cents: 10000000 }
              as: ProgramAdmin
          assert:
            - "response.status == 201"
            - "data.available_cents == 10000000"
            - "data.reserved_cents == 0"
            - "data.disbursed_cents == 0"
            - "data.status == ACTIVE"

  - section: state_machines
    instances:
      - name: withdraw_already_withdrawn_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Application.DRAFT_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing an application already in terminal WITHDRAWN fails with ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["An application in DRAFT that has been withdrawn once (terminal WITHDRAWN)."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "W", email: "w@x.com", household_size: 4, annual_income_cents: 8000000 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "1 A", county_code: "K01", purchase_price_cents: 30000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 24000000, buyer_contribution_cents: 500000 }
              as: CaseManager
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: resubmit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Application.NEEDS_INFO_to_UNDER_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resubmitting an application in SUBMITTED (not NEEDS_INFO) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["An application in SUBMITTED (never sent to NEEDS_INFO)."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
            - call: "POST /api/v1/applicants"
              payload: { full_name: "R", email: "r@x.com", household_size: 4, annual_income_cents: 8000000 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "2 A", county_code: "K01", purchase_price_cents: 30000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 24000000, buyer_contribution_cents: 500000 }
              as: CaseManager
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/resubmit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: report_sale_before_open_returns_error
        claim_type: precondition_enforcement
        grounds: ["validations[priority=20]", "errors[ERR_SALE_BEFORE_OPEN]", state_machines.ServicingAccount.ACTIVE_to_IN_SALE]
        distinguishing_aspect: "Reporting a sale with sale_date (2026-07-01) earlier than the ServicingAccount.opened_at (2026-07-02T13:00) fails with ERR_SALE_BEFORE_OPEN (422)."
        test_recipe:
          setup: ["A funded, closed SHARED_APPRECIATION award with a ServicingAccount ACTIVE, opened_at 2026-07-02T13:00:00Z (clock never advanced past attendance)."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION", appreciation_share_pct: 30 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
            - call: "POST /api/v1/funding-sources"
              payload: { name: "HOME Fund", priority: 1, total_appropriation_cents: 10000000 }
              as: ProgramAdmin
              captures: { fs_id: $.data.id, fs_v: $.data.version }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Sb", email: "sb@x.com", household_size: 4, annual_income_cents: 8000000 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "3 A", county_code: "K01", purchase_price_cents: 30000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/properties/${pr_id}/appraisal"
              payload: { appraised_value_cents: 31000000 }
              as: CaseManager
            - call: "POST /api/v1/education-sessions"
              payload: { program_id: "${p_id}", title: "HB101", start_at: "2026-07-02T09:00:00Z", end_at: "2026-07-02T12:00:00Z", capacity: 10 }
              as: ProgramAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/education-sessions/${sess_id}/enrollments"
              payload: { applicant_id: "${a_id}" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T13:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/v1/enrollments/${enr_id}/attend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 24000000, buyer_contribution_cents: 500000 }
              as: CaseManager
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "START" }
              as: CaseManager
              as_user_id: "cm_reviewer"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
              as_user_id: "cm_reviewer"
            - call: "POST /api/v1/applications/${app_id}/awards"
              payload: { assistance_type: "SHARED_APPRECIATION" }
              as: CaseManager
              captures: { aw_id: $.data.id }
            - call: "POST /api/v1/awards/${aw_id}/approve"
              payload: {}
              as: CaseManager
              as_user_id: "cm_approver"
            - call: "POST /api/v1/funding-allocations"
              payload: { award_id: "${aw_id}", funding_source_id: "${fs_id}", amount_cents: 5000000, lien_position: 1, expected_funding_source_version: "${fs_v}" }
              as: CaseManager
            - call: "POST /api/v1/awards/${aw_id}/closings"
              payload: { property_id: "${pr_id}", scheduled_date: "2026-08-01T00:00:00Z", window_days: 7 }
              as: ClosingCoordinator
              captures: { cl_id: $.data.id }
            - call: "POST /api/v1/closings/${cl_id}/docs-pending"
              payload: {}
              as: ClosingCoordinator
            - call: "POST /api/v1/closings/${cl_id}/complete"
              payload: { final_purchase_price_cents: 30000000, final_first_mortgage_cents: 24000000 }
              as: ClosingCoordinator
            - call: "GET /api/v1/servicing-accounts?award_id=${aw_id}"
              payload: {}
              as: Servicer
              captures: { sa_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/servicing-accounts/${sa_id}/report-sale"
              payload: { sale_price_cents: 35000000, sale_date: "2026-07-01T00:00:00Z" }
              as: Servicer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_SALE_BEFORE_OPEN"

  - section: validations
    instances:
      - name: income_over_limit_on_eligible_review
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INCOME_OVER_LIMIT]", calculations.ami_eligibility]
        distinguishing_aspect: "Income 8,000,001 (ceiling 8,000,000) on an ELIGIBLE review decision fails with ERR_INCOME_OVER_LIMIT (422)."
        test_recipe:
          setup: ["Application (income 8,000,001, household 4, ami_100 10,000,000) moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Over", email: "over@x.com", household_size: 4, annual_income_cents: 8000001 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "4 A", county_code: "K01", purchase_price_cents: 30000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 24000000, buyer_contribution_cents: 500000 }
              as: CaseManager
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "START" }
              as: CaseManager
              as_user_id: "cm_reviewer"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
              as_user_id: "cm_reviewer"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_INCOME_OVER_LIMIT"

      - name: submit_without_income_limit_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INCOME_LIMIT_UNDEFINED]"]
        distinguishing_aspect: "Submitting when no IncomeLimit row exists for the applicant's household size fails with ERR_INCOME_LIMIT_UNDEFINED (422)."
        test_recipe:
          setup: ["Program with NO income-limit rows; a DRAFT application for a household of 4."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "NoLim", email: "nolim@x.com", household_size: 4, annual_income_cents: 8000000 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "5 A", county_code: "K01", purchase_price_cents: 30000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 24000000, buyer_contribution_cents: 500000 }
              as: CaseManager
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_INCOME_LIMIT_UNDEFINED"

      - name: enroll_into_full_session_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SESSION_FULL]", entities.EducationSession.fields.enrolled_count]
        distinguishing_aspect: "Enrolling a second applicant into a capacity-1 session (already at enrolled_count 1) fails with ERR_SESSION_FULL (409)."
        test_recipe:
          setup: ["A session with capacity 1 already holding one ENROLLED applicant; a second applicant exists."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "F1", email: "f1@x.com", household_size: 4, annual_income_cents: 8000000 }
              as: Anonymous
              captures: { a1_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "F2", email: "f2@x.com", household_size: 4, annual_income_cents: 8000000 }
              as: Anonymous
              captures: { a2_id: $.data.id }
            - call: "POST /api/v1/education-sessions"
              payload: { program_id: "${p_id}", title: "Cap1", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:00:00Z", capacity: 1 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/v1/education-sessions/${s_id}/enrollments"
              payload: { applicant_id: "${a1_id}" }
              as: Applicant
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /api/v1/education-sessions/${s_id}/enrollments"
              payload: { applicant_id: "${a2_id}" }
              as: Applicant
              as_user_id: "${a2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_SESSION_FULL"

      - name: create_session_bad_times_returns_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_SESSION_TIME_INVALID]"]
        distinguishing_aspect: "Creating a session with end_at <= start_at fails with ERR_SESSION_TIME_INVALID (400)."
        test_recipe:
          setup: ["A program exists."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /api/v1/education-sessions"
              payload: { program_id: "${p_id}", title: "Bad", start_at: "2026-07-10T12:00:00Z", end_at: "2026-07-10T09:00:00Z", capacity: 10 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_SESSION_TIME_INVALID"

      - name: duplicate_income_limit_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_DUPLICATE_INCOME_LIMIT]"]
        distinguishing_aspect: "Defining a second IncomeLimit for the same (program, household_size 4) fails with ERR_DUPLICATE_INCOME_LIMIT (409)."
        test_recipe:
          setup: ["Program with an income limit for household 4 already defined."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 11000000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_DUPLICATE_INCOME_LIMIT"

  - section: endpoints
    instances:
      - name: applicant_cannot_create_program_returns_unauthorized
        claim_type: rbac_denial
        grounds: [roles.Applicant, roles.ProgramAdmin, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "An Applicant calling POST /programs (a ProgramAdmin-exclusive op) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/programs"
              payload: { name: "X", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: Applicant
              as_user_id: "some_applicant"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "data.error_id == ERR_UNAUTHORIZED"

      - name: missing_role_header_returns_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request to an authenticated endpoint (GET /funding-sources) with no valid X-User-Role header fails with ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/funding-sources"
              payload: {}
              as: "NONE"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

      - name: list_programs_pagination_envelope
        claim_type: standard_crud
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /programs returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two programs created."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "P1", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
            - call: "POST /api/v1/programs"
              payload: { name: "P2", ami_limit_pct: 60, max_assistance_cents: 4000000, recapture_model: "DECLINING_BALANCE" }
              as: ProgramAdmin
          trigger:
            - call: "GET /api/v1/programs?limit=1&offset=0"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.status == 200"
            - "meta.total_count == 2"
            - "meta.has_more == true"

  - section: consistency_model
    instances:
      - name: allocation_reflected_immediately_in_award_and_source
        claim_type: immediate
        grounds: [entities.Award.fields.allocated_cents, entities.FundingSource.fields.available_cents]
        excluded_because:
          difficulty_instance: transitive_cascade / closing_complete_disbursement_chain_depth4
          rationale: "The immediate consistency of Award.allocated_cents and FundingSource ledger buckets in the same request is asserted end-to-end by that §1.8 cascade instance."

  - section: validations
    instances:
      - name: complete_without_appraisal_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_APPRAISAL_MISSING]", state_machines.Closing.DOCS_PENDING_to_COMPLETED]
        distinguishing_aspect: "Completing a closing on a FUNDED award whose property has no appraised_value fails with ERR_APPRAISAL_MISSING (422)."
        test_recipe:
          setup: ["Fully funded SHARED_APPRECIATION award (5,000,000 reserved), closing DOCS_PENDING, property NOT appraised."]
          setup_api_calls:
            - call: "POST /api/v1/programs"
