  - rule_id: resource_temporal_overlap
    instances:
      - name: lease_cycle_closed_interval_overlap
        grounds:
          - validations[priority=10]
          - endpoints."POST /turf/leases"
        distinguishing_aspect: |
          Closed-interval semantics on FleetLease cycles of one course: a new lease
          starting exactly on the sibling lease's end_date (2029-09-01) overlaps
          (shared boundary date counts) and is rejected; starting one day later is
          legal. FleetLease is a different resource from the irrigation project.
        test_recipe:
          setup:
            - "D1 ACTIVE; C1 CLUB; M1; lease L1 APPROVED for [2026-09-01, 2029-09-01]"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA", "NV"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
