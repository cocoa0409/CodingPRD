# =============================================================================
# SCAFFOLD — Rail Rate Complaint Adjudication & Transaction Review (STB)
# §1.0–§1.7 seed tables. Difficulty expressed through depth: interlocking
# threshold determinations, dual-variant ratio/ROI calculations, an ordered
# error catalog with pinned precedence, cascades across four subsystems.
# =============================================================================

scenario: "Rail Rate Complaint Adjudication & Transaction Review (Surface Transportation Board): rate reasonableness complaints from shippers with market dominance determination as a threshold, evidentiary standards including stand-alone cost analysis and simplified procedures for smaller disputes, revenue adequacy findings and their role in rate case standards, service complaints and emergency service orders when a carrier fails to provide adequate service, merger and acquisition review with public interest standards, service assurance plans and conditions imposed, line abandonment and discontinuance applications with public convenience findings and trail use conversions, reciprocal switching and interchange access petitions, common carrier obligation enforcement and reporting requirements"

domain_name: rail-rate-complaint-adjudication
api_prefix: /stb

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - cascading_side_effects
  entity_topology: flat        # peer entities joined by FK references; sub-resource GETs are read views only
  state_machine_shape: cyclic  # RateComplaint DECIDED→REOPENED→EVIDENTIARY_PHASE loop; MergerApplication forks
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles       # Shipper and CarrierOperator own disjoint filings; BoardAdjudicator decides
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All entities carry common_fields: true (id = server-minted dashed UUID,
# created_at / updated_at ISO-8601 UTC with 3 fractional digits, version
# integer starting at 1, +1 on every mutation including cascaded ones).
# Domain timestamps (issued_at, expires_at, comment_close_at, nitu_expires_at)
# render exactly as the logical clock read when they were computed.
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: carrier_code, type: string, source: input, description: "Unique railroad reporting mark (e.g. 'CSXT'); uniqueness enforced across all carriers", constraints: "unique; ERR_DUPLICATE_CARRIER_CODE" }
      - { name: legal_name, type: string, source: input, description: "Legal name of the railroad" }
      - { name: carrier_class, type: enum, source: input, description: "Carrier size class", constraints: "I | II | III" }
      - { name: base_route_miles, type: integer, source: input, description: "Total route miles at registration (whole miles); the conservation baseline for mileage accounting", constraints: ">= 1" }
      - { name: active_route_miles, type: integer, source: computed, description: "base_route_miles - abandoned_route_miles - trail_use_route_miles; recomputed on abandonment consummation / trail conversion" }
      - { name: abandoned_route_miles, type: integer, source: computed, default: 0, description: "Sum of segment_miles over this carrier's CONSUMMATED abandonment applications" }
      - { name: trail_use_route_miles, type: integer, source: computed, default: 0, description: "Sum of segment_miles over this carrier's TRAIL_CONVERTED abandonment applications" }
      - { name: revenue_adequacy_status, type: enum, source: computed, default: "UNDETERMINED", description: "UNDETERMINED | ADEQUATE | INADEQUATE; equals the `finding` of this carrier's RevenueAdequacyFinding with the greatest fiscal_year, UNDETERMINED when none exists" }
      - { name: compliance_standing, type: enum, source: computed, default: "GOOD", description: "GOOD | PROBATION; PROBATION iff the carrier has at least one EmergencyServiceOrder with status ACTIVE, else GOOD" }
      - { name: reparation_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of award_outstanding_cents over this carrier's RateComplaints with status DECIDED" }

  - name: RevenueAdequacyFinding
    parent: Carrier
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; taken from the creation path" }
      - { name: fiscal_year, type: integer, source: input, description: "Calendar year the finding covers; one finding per (carrier, fiscal_year)", constraints: "unique per carrier; ERR_DUPLICATE_FINDING" }
      - { name: operating_revenue_cents, type: integer, source: input, description: "Carrier operating revenue for the fiscal year (annual reporting requirement)", constraints: ">= 0" }
      - { name: operating_expense_cents, type: integer, source: input, description: "Carrier operating expense for the fiscal year", constraints: ">= 0" }
      - { name: net_investment_cents, type: integer, source: input, description: "Net investment base for the fiscal year", constraints: ">= 1" }
      - { name: current_year_roi_bps, type: integer, source: computed, description: "round_half_up((revenue - expense) * 10000 / net_investment); return on investment in basis points" }
      - { name: five_year_avg_roi_bps, type: integer, source: computed, description: "round_half_up(mean of current_year_roi_bps over this carrier's findings with fiscal_year in [Y-4, Y]); with fewer than 5 years present, averages only the years that exist" }
      - { name: finding, type: enum, source: computed, description: "ADEQUATE when five_year_avg_roi_bps >= COST_OF_CAPITAL_BPS (1140), else INADEQUATE" }

  - name: RateComplaint
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: input, description: "Shipper party identifier; for role Shipper must equal the X-User-ID header (party reference, not an entity FK)" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; the defendant railroad" }
      - { name: commodity, type: string, source: input, description: "Commodity moving under the challenged rate" }
      - { name: challenged_rate_cents_per_ton, type: integer, source: input, description: "The challenged through rate, integer cents per ton", constraints: ">= 1" }
      - { name: alleged_variable_cost_cents_per_ton, type: integer, source: input, description: "Shipper-alleged variable cost, integer cents per ton", constraints: ">= 1" }
      - { name: annual_tons, type: integer, source: input, description: "Annual tonnage subject to the challenged rate", constraints: ">= 1" }
      - { name: relief_sought_cents, type: integer, source: input, description: "Total reparations + rate relief sought; selects the evidentiary track", constraints: ">= 1" }
      - { name: contested_fiscal_year, type: integer, source: input, description: "Fiscal year whose RevenueAdequacyFinding governs the prescription floor at decide time" }
      - { name: track, type: enum, source: computed, description: "THREE_BENCHMARK when relief_sought_cents <= 100000000; SIMPLIFIED_SAC when <= 400000000; else FULL_SAC" }
      - { name: alleged_rvc_ratio, type: number, source: computed, description: "challenged_rate_cents_per_ton / alleged_variable_cost_cents_per_ton, 4 decimal places round_half_up" }
      - { name: adjudicated_rvc_ratio, type: number, source: computed, default: null, description: "challenged_rate_cents_per_ton / verified_variable_cost_cents_per_ton of the most recently VERIFIED evidence, 4dp round_half_up; null until first VERIFIED evidence; reset to null on reopen" }
      - { name: market_dominance, type: enum, source: system, default: "UNDETERMINED", description: "UNDETERMINED | PRESENT | ABSENT; set by determine-market-dominance" }
      - { name: status, type: enum, source: system, description: "FILED | EVIDENTIARY_PHASE | DECIDED | REOPENED | DISMISSED | CLOSED" }
      - { name: decision_outcome, type: enum, source: system, default: null, description: "UPHELD | REJECTED | DISMISSED; null until decide" }
      - { name: prescribed_rate_cents_per_ton, type: integer, source: computed, default: null, description: "Board-prescribed maximum reasonable rate; set only on UPHELD" }
      - { name: relief_granted_cents, type: integer, source: computed, default: null, description: "(challenged - prescribed) * annual_tons, capped at the track cap; set only on UPHELD" }
      - { name: award_granted_cents, type: integer, source: computed, default: 0, description: "Reparation award computed per-shipment rounded then summed (see reparation_award_total); 0 until UPHELD" }
      - { name: award_paid_cents, type: integer, source: computed, default: 0, description: "Sum of PAYMENT reparation events" }
      - { name: award_outstanding_cents, type: integer, source: computed, default: 0, description: "award_granted_cents - award_paid_cents; ledger identity pinned by invariant" }
      - { name: award_status, type: enum, source: system, default: "NONE", description: "NONE | GRANTED | PARTIALLY_PAID | PAID | REVERSED" }

  - name: EvidenceSubmission
    parent: RateComplaint
    common_fields: true
    fields:
      - { name: rate_complaint_id, type: string, source: system, description: "FK -> RateComplaint.id; taken from the creation path" }
      - { name: submission_type, type: enum, source: input, description: "SAC_STUDY | THREE_BENCHMARK_PACKET | REBUTTAL" }
      - { name: submitted_by_party, type: enum, source: input, description: "SHIPPER | CARRIER; must be consistent with the caller's role and ownership of the complaint" }
      - { name: reference_rate_cents_per_ton, type: integer, source: input, description: "Stand-alone-cost rate for SAC_STUDY, benchmark rate for THREE_BENCHMARK_PACKET, counter-figure for REBUTTAL", constraints: ">= 1" }
      - { name: verified_variable_cost_cents_per_ton, type: integer, source: input, description: "Cost figure the Board adopts if this submission is VERIFIED", constraints: ">= 1" }
      - { name: review_status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED | SUPERSEDED (SUPERSEDED when the complaint is reopened)" }

  - name: ServiceComplaint
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: input, description: "Shipper party identifier; for role Shipper must equal X-User-ID" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; the railroad alleged to fail adequate service" }
      - { name: issue_type, type: enum, source: input, description: "DELAY | EMBARGO | CAR_SUPPLY | FAILURE_TO_DELIVER" }
      - { name: territory_code, type: string, source: input, description: "Free-form territory designator (e.g. 'GULF-COAST')" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | RESOLVED" }

  - name: EmergencyServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; copied from the escalated ServiceComplaint" }
      - { name: service_complaint_id, type: string, source: system, description: "FK -> ServiceComplaint.id; the complaint whose escalation issued this order" }
      - { name: directive, type: string, source: input, description: "Board directive text supplied at escalation" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at issuance" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + ESO_DURATION_DAYS (60) days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | LIFTED; ACTIVE -> EXPIRED automatically when logical clock >= expires_at; ACTIVE -> LIFTED when the linked complaint resolves" }

  - name: MergerApplication
    parent: null
    common_fields: true
    fields:
      - { name: acquiring_carrier_id, type: string, source: input, description: "FK -> Carrier.id; for role CarrierOperator must equal X-User-ID" }
      - { name: target_carrier_id, type: string, source: input, description: "FK -> Carrier.id; the carrier being acquired" }
      - { name: transaction_value_cents, type: integer, source: input, description: "Announced transaction value", constraints: ">= 1" }
      - { name: competition_preservation_score, type: integer, source: input, description: "Applicant's competition-preservation showing, 0-100", constraints: "0..100" }
      - { name: service_reliability_score, type: integer, source: input, description: "Applicant's service-reliability showing, 0-100", constraints: "0..100" }
      - { name: shipper_impact_score, type: integer, source: input, description: "Applicant's shipper-impact showing, 0-100", constraints: "0..100" }
      - { name: public_interest_score, type: number, source: computed, description: "0.40*competition + 0.30*service + 0.30*shipper_impact, 2 decimal places round_half_up; recomputed on amend" }
      - { name: comment_close_at, type: datetime, source: computed, description: "created_at + MERGER_COMMENT_PERIOD_DAYS (45) at creation; reset to amend time + 45 days on every successful amend" }
      - { name: service_review_hold, type: boolean, source: computed, default: false, description: "true iff the acquiring carrier has any EmergencyServiceOrder with status ACTIVE (derived, recomputed on ESO lifecycle events)" }
      - { name: status, type: enum, source: system, description: "COMMENT_PERIOD | APPROVED | APPROVED_WITH_CONDITIONS | REJECTED" }
      - { name: conditions_imposed, type: array, source: system, default: [], description: "Condition strings recorded when the Board decides APPROVED_WITH_CONDITIONS" }

  - name: ServiceAssurancePlan
    parent: MergerApplication
    common_fields: true
    fields:
      - { name: merger_application_id, type: string, source: system, description: "FK -> MergerApplication.id; taken from the creation path" }
      - { name: plan_name, type: string, source: input, description: "Plan title" }
      - { name: commitments, type: array, source: input, description: "Array of service commitment strings; at most one plan per merger application", constraints: "one plan per merger; ERR_SERVICE_ASSURANCE_PLAN_EXISTS" }
      - { name: status, type: enum, source: system, description: "DRAFT on creation; -> MONITORING when the merger is APPROVED or APPROVED_WITH_CONDITIONS; -> MOOT when the merger is REJECTED" }

  - name: AbandonmentApplication
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; for role CarrierOperator must equal X-User-ID" }
      - { name: line_segment_ref, type: string, source: input, description: "Milepost designator of the line (e.g. 'MP 100.0-MP 120.0'); at most one non-terminal application per line_segment_ref", constraints: "unique among UNDER_REVIEW/GRANTED/TRAIL_PENDING; ERR_DUPLICATE_ACTIVE_ABANDONMENT" }
      - { name: segment_miles, type: integer, source: input, description: "Whole route miles of the segment", constraints: ">= 1" }
      - { name: public_convenience_finding, type: enum, source: system, default: null, description: "SERVED | NOT_SERVED; recorded at decide" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | GRANTED | DENIED | TRAIL_PENDING | TRAIL_CONVERTED | CONSUMMATED" }
      - { name: nitu_expires_at, type: datetime, source: computed, default: null, description: "Trail-use negotiation deadline = notice issuance + NITU_WINDOW_DAYS (180); null until a trail-use notice issues" }

  - name: ReciprocalSwitchingPetition
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: input, description: "Shipper party identifier; for role Shipper must equal X-User-ID" }
      - { name: incumbent_carrier_id, type: string, source: input, description: "FK -> Carrier.id; the serving carrier the petition seeks switching relief against" }
      - { name: interchange_code, type: string, source: input, description: "Identifier of the requested interchange point; slot accounting is per interchange_code" }
      - { name: facility_distance_miles, type: integer, source: input, description: "Distance from shipper facility to the interchange; must be <= INTERCHANGE_DISTANCE_LIMIT_MILES (30)", constraints: "0..30; ERR_FACILITY_BEYOND_INTERCHANGE_DISTANCE" }
      - { name: evidence_service_complaint_id, type: string, source: input, description: "Identifier of the ServiceComplaint evidencing inadequate service (existence-validated at creation; eligibility re-validated at decide)" }
      - { name: service_start_date, type: string, source: input, description: "Requested switching window start, ISO date YYYY-MM-DD (inclusive)" }
      - { name: service_end_date, type: string, source: input, description: "Requested switching window end, ISO date YYYY-MM-DD (exclusive); must be > service_start_date" }
      - { name: status, type: enum, source: system, description: "FILED | GRANTED | DENIED | TERMINATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RateComplaint
    initial_state: FILED
    terminal_states: [DISMISSED, CLOSED]
    transitions:
      - from: FILED
        to: EVIDENTIARY_PHASE
        trigger: "POST /stb/rate-complaints/{id}/determine-market-dominance"
        actor: BoardAdjudicator
        preconditions:
          - "Complaint status == FILED (ERR_COMPLAINT_NOT_FILED)"
          - "alleged_rvc_ratio >= 1.8000 AND product_competition_exists == false AND geographic_competition_exists == false (otherwise the ABSENT branch fires)"
        side_effects:
          - "market_dominance = PRESENT"
      - from: FILED
        to: DISMISSED
        trigger: "POST /stb/rate-complaints/{id}/determine-market-dominance"
        actor: BoardAdjudicator
        preconditions:
          - "Complaint status == FILED (ERR_COMPLAINT_NOT_FILED)"
          - "alleged_rvc_ratio < 1.8000 OR product_competition_exists == true OR geographic_competition_exists == true"
        side_effects:
          - "market_dominance = ABSENT"
      - from: EVIDENTIARY_PHASE
        to: EVIDENTIARY_PHASE
        trigger: "POST /stb/rate-complaints/{id}/evidence"
        actor: Shipper | CarrierOperator
        preconditions:
          - "Complaint status in {EVIDENTIARY_PHASE, REOPENED} (ERR_COMPLAINT_NOT_IN_EVIDENTIARY)"
        side_effects:
          - "EvidenceSubmission created with review_status = SUBMITTED"
      - from: REOPENED
        to: EVIDENTIARY_PHASE
        trigger: "POST /stb/rate-complaints/{id}/evidence"
        actor: Shipper | CarrierOperator
        preconditions:
          - "Complaint status in {EVIDENTIARY_PHASE, REOPENED} (ERR_COMPLAINT_NOT_IN_EVIDENTIARY)"
        side_effects:
          - "EvidenceSubmission created with review_status = SUBMITTED"
          - "Complaint leaves REOPENED and re-enters EVIDENTIARY_PHASE (cycle)"
      - from: EVIDENTIARY_PHASE
        to: DECIDED
        trigger: "POST /stb/rate-complaints/{id}/decide with outcome UPHELD or REJECTED"
        actor: BoardAdjudicator
        preconditions:
          - "Complaint status == EVIDENTIARY_PHASE (ERR_COMPLAINT_NOT_IN_EVIDENTIARY)"
          - "A RevenueAdequacyFinding exists for (carrier_id, contested_fiscal_year) (ERR_REVENUE_ADEQUACY_FINDING_REQUIRED)"
          - "At least one EvidenceSubmission with review_status == VERIFIED (ERR_NO_VERIFIED_EVIDENCE)"
          - "adjudicated_rvc_ratio >= 1.8000 (ERR_MARKET_DOMINANCE_ABSENT when outcome is UPHELD or REJECTED)"
        side_effects:
          - "decision_outcome set; prescribed_rate_cents_per_ton and relief_granted_cents computed on UPHELD (see prescribed_rate_and_relief)"
          - "On UPHELD: award_granted_cents = reparation_award_total(shipments); award_outstanding_cents = award_granted_cents; award_status = GRANTED (or PAID immediately when award is 0)"
          - "On UPHELD with award_granted_cents == 0: status passes through DECIDED and auto-advances to CLOSED"
          - "On UPHELD with award_granted_cents > 0: Carrier.reparation_exposure_cents += award_granted_cents"
          - "On REJECTED: award_status stays NONE; complaint remains DECIDED (reopenable)"
      - from: EVIDENTIARY_PHASE
        to: DISMISSED
        trigger: "POST /stb/rate-complaints/{id}/decide with outcome DISMISSED"
        actor: BoardAdjudicator
        preconditions:
          - "Complaint status == EVIDENTIARY_PHASE (ERR_COMPLAINT_NOT_IN_EVIDENTIARY)"
          - "adjudicated_rvc_ratio is null OR adjudicated_rvc_ratio < 1.8000 (ERR_MARKET_DOMINANCE_PRESENT otherwise)"
        side_effects:
          - "decision_outcome = DISMISSED; market_dominance = ABSENT"
      - from: DECIDED
        to: REOPENED
        trigger: "POST /stb/rate-complaints/{id}/reopen"
        actor: Shipper (complaint owner only)
        preconditions:
          - "Complaint status == DECIDED (ERR_COMPLAINT_NOT_DECIDED)"
        side_effects:
          - "Every EvidenceSubmission with review_status == VERIFIED becomes SUPERSEDED"
          - "adjudicated_rvc_ratio reset to null"
      - from: DECIDED
        to: CLOSED
        trigger: "system (automatic when award_status becomes PAID or REVERSED)"
        actor: system
        preconditions:
          - "award_status in {PAID, REVERSED}"
        side_effects:
          - "Carrier.reparation_exposure_cents recomputed (closed complaint no longer contributes)"

  - entity: EvidenceSubmission
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /stb/evidence-submissions/{id}/verify with review_outcome VERIFIED"
        actor: BoardAdjudicator
        preconditions:
          - "review_status == SUBMITTED (ERR_EVIDENCE_ALREADY_REVIEWED)"
        side_effects:
          - "Complaint.adjudicated_rvc_ratio recomputed from THIS evidence's verified_variable_cost_cents_per_ton (latest verified wins)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /stb/evidence-submissions/{id}/verify with review_outcome REJECTED"
        actor: BoardAdjudicator
        preconditions:
          - "review_status == SUBMITTED (ERR_EVIDENCE_ALREADY_REVIEWED)"
        side_effects: []
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system (automatic when the parent complaint is reopened)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServiceComplaint
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /stb/service-complaints/{id}/escalate"
        actor: BoardAdjudicator
        preconditions:
          - "Complaint status == OPEN (ERR_SERVICE_COMPLAINT_NOT_OPEN)"
          - "No other EmergencyServiceOrder with status ACTIVE exists for this carrier (ERR_ESO_ALREADY_ACTIVE)"
        side_effects:
          - "Cascade hop 1: EmergencyServiceOrder created (status ACTIVE, issued_at = now, expires_at = now + 60 days)"
          - "Cascade hop 2: the ESO becoming ACTIVE flips Carrier.compliance_standing to PROBATION"
          - "Cascade hop 3: PROBATION on the acquiring carrier sets service_review_hold = true on that carrier's COMMENT_PERIOD MergerApplications, which then blocks outcome APPROVED at decide (ERR_MERGER_SERVICE_HOLD)"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /stb/service-complaints/{id}/resolve"
        actor: BoardAdjudicator
        preconditions:
          - "Complaint status in {OPEN, ESCALATED} (ERR_SERVICE_COMPLAINT_NOT_OPEN)"
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /stb/service-complaints/{id}/resolve"
        actor: BoardAdjudicator
        preconditions:
          - "Complaint status in {OPEN, ESCALATED} (ERR_SERVICE_COMPLAINT_NOT_OPEN)"
        side_effects:
          - "Cascade hop 1: the linked EmergencyServiceOrder, if still ACTIVE, becomes LIFTED"
          - "Cascade hop 2: with no remaining ACTIVE ESO, Carrier.compliance_standing recomputes to GOOD"
          - "Cascade hop 3: GOOD clears service_review_hold on the carrier's COMMENT_PERIOD MergerApplications, unblocking outcome APPROVED"

  - entity: EmergencyServiceOrder
    initial_state: ACTIVE
    terminal_states: [EXPIRED, LIFTED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic: evaluated on any read or write when logical clock >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Carrier.compliance_standing recomputes to GOOD when no other ACTIVE ESO remains"
          - "service_review_hold clears on the carrier's COMMENT_PERIOD MergerApplications"
      - from: ACTIVE
        to: LIFTED
        trigger: "system (automatic when the linked ServiceComplaint resolves)"
        actor: system
        preconditions: []
        side_effects:
          - "Carrier.compliance_standing recomputes to GOOD when no other ACTIVE ESO remains"

  - entity: MergerApplication
    initial_state: COMMENT_PERIOD
    terminal_states: [APPROVED, APPROVED_WITH_CONDITIONS, REJECTED]
    transitions:
      - from: COMMENT_PERIOD
        to: COMMENT_PERIOD
        trigger: "POST /stb/merger-applications/{id}/amend"
        actor: CarrierOperator (acquiring carrier only)
        preconditions:
          - "Application status == COMMENT_PERIOD (ERR_MERGER_NOT_IN_COMMENT_PERIOD)"
          - "expected_merger_application_version == current version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "version incremented by 1"
          - "comment_close_at reset to amend time + 45 days"
          - "public_interest_score recomputed from the amended scores"
      - from: COMMENT_PERIOD
        to: APPROVED
        trigger: "POST /stb/merger-applications/{id}/decide with outcome APPROVED"
        actor: BoardAdjudicator
        preconditions:
          - "status == COMMENT_PERIOD (ERR_MERGER_NOT_IN_COMMENT_PERIOD)"
          - "logical clock >= comment_close_at (ERR_COMMENT_PERIOD_OPEN)"
          - "service_review_hold == false (ERR_MERGER_SERVICE_HOLD)"
          - "public_interest_score >= 60.00 (ERR_DECISION_INCONSISTENT_WITH_SCORE)"
        side_effects:
          - "ServiceAssurancePlan (if any) -> MONITORING"
      - from: COMMENT_PERIOD
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /stb/merger-applications/{id}/decide with outcome APPROVED_WITH_CONDITIONS"
        actor: BoardAdjudicator
        preconditions:
          - "status == COMMENT_PERIOD (ERR_MERGER_NOT_IN_COMMENT_PERIOD)"
          - "logical clock >= comment_close_at (ERR_COMMENT_PERIOD_OPEN)"
          - "45.00 <= public_interest_score < 60.00 (ERR_DECISION_INCONSISTENT_WITH_SCORE)"
          - "At least one ServiceAssurancePlan exists for this application (ERR_SERVICE_ASSURANCE_PLAN_REQUIRED)"
          - "conditions input is a non-empty array (ERR_INVALID_REQUEST)"
        side_effects:
          - "conditions_imposed = conditions input"
          - "ServiceAssurancePlan -> MONITORING (conditions attach to the plan; service_review_hold does NOT block this branch)"
      - from: COMMENT_PERIOD
        to: REJECTED
        trigger: "POST /stb/merger-applications/{id}/decide with outcome REJECTED"
        actor: BoardAdjudicator
        preconditions:
          - "status == COMMENT_PERIOD (ERR_MERGER_NOT_IN_COMMENT_PERIOD)"
          - "logical clock >= comment_close_at (ERR_COMMENT_PERIOD_OPEN)"
          - "public_interest_score < 45.00 (ERR_DECISION_INCONSISTENT_WITH_SCORE)"
        side_effects:
          - "ServiceAssurancePlan (if any) -> MOOT"

  - entity: ServiceAssurancePlan
    initial_state: DRAFT
    terminal_states: [MOOT]
    transitions:
      - from: DRAFT
        to: MONITORING
        trigger: "system (automatic when the parent merger is decided APPROVED or APPROVED_WITH_CONDITIONS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: MOOT
        trigger: "system (automatic when the parent merger is decided REJECTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AbandonmentApplication
    initial_state: UNDER_REVIEW
    terminal_states: [DENIED, TRAIL_CONVERTED, CONSUMMATED]
    transitions:
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /stb/abandonment-applications/{id}/decide with outcome GRANTED"
        actor: BoardAdjudicator
        preconditions:
          - "status == UNDER_REVIEW (ERR_ABANDONMENT_NOT_UNDER_REVIEW)"
          - "public_convenience_finding == SERVED (ERR_DECISION_INCONSISTENT_WITH_FINDING)"
        side_effects:
          - "public_convenience_finding recorded"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /stb/abandonment-applications/{id}/decide with outcome DENIED"
        actor: BoardAdjudicator
        preconditions:
          - "status == UNDER_REVIEW (ERR_ABANDONMENT_NOT_UNDER_REVIEW)"
        side_effects:
          - "public_convenience_finding recorded"
      - from: GRANTED
        to: TRAIL_PENDING
        trigger: "POST /stb/abandonment-applications/{id}/issue-trail-use-notice"
        actor: BoardAdjudicator
        preconditions:
          - "status == GRANTED (ERR_ABANDONMENT_NOT_GRANTED)"
        side_effects:
          - "nitu_expires_at = now + 180 days"
      - from: TRAIL_PENDING
        to: TRAIL_CONVERTED
        trigger: "POST /stb/abandonment-applications/{id}/convert-to-trail-use"
        actor: BoardAdjudicator
        preconditions:
          - "status == TRAIL_PENDING (ERR_ABANDONMENT_NOT_TRAIL_PENDING)"
          - "logical clock <= nitu_expires_at (ERR_TRAIL_USE_NOTICE_EXPIRED; equality still converts)"
        side_effects:
          - "Carrier.active_route_miles -= segment_miles; Carrier.trail_use_route_miles += segment_miles"
      - from: GRANTED
        to: CONSUMMATED
        trigger: "POST /stb/abandonment-applications/{id}/consummate-abandonment"
        actor: BoardAdjudicator
        preconditions:
          - "status in {GRANTED, TRAIL_PENDING} (ERR_ABANDONMENT_NOT_GRANTED)"
        side_effects:
          - "Carrier.active_route_miles -= segment_miles; Carrier.abandoned_route_miles += segment_miles"
      - from: TRAIL_PENDING
        to: CONSUMMATED
        trigger: "POST /stb/abandonment-applications/{id}/consummate-abandonment"
        actor: BoardAdjudicator
        preconditions:
          - "status in {GRANTED, TRAIL_PENDING} (ERR_ABANDONMENT_NOT_GRANTED)"
          - "logical clock > nitu_expires_at (ERR_TRAIL_USE_WINDOW_OPEN; strictly greater — at equality the window is still open)"
        side_effects:
          - "Carrier.active_route_miles -= segment_miles; Carrier.abandoned_route_miles += segment_miles"

  - entity: ReciprocalSwitchingPetition
    initial_state: FILED
    terminal_states: [DENIED, TERMINATED]
    transitions:
      - from: FILED
        to: GRANTED
        trigger: "POST /stb/reciprocal-switching-petitions/{id}/decide with outcome GRANTED"
        actor: BoardAdjudicator
        preconditions:
          - "status == FILED (ERR_PETITION_NOT_FILED)"
          - "evidence complaint's carrier_id == petition.incumbent_carrier_id (ERR_SERVICE_COMPLAINT_CARRIER_MISMATCH)"
          - "evidence complaint status == ESCALATED at decide time (ERR_PETITION_EVIDENCE_NOT_ESCALATED)"
          - "petition.created_at - evidence complaint.created_at <= 84 days (ERR_SERVICE_FAILURE_WINDOW_EXPIRED)"
          - "fewer than INTERCHANGE_SLOT_CAPACITY (4) GRANTED petitions on this interchange_code have windows overlapping [service_start_date, service_end_date) under half-open semantics (ERR_INTERCHANGE_CAPACITY_EXCEEDED)"
        side_effects:
          - "One switching slot on interchange_code is consumed for the window"
      - from: FILED
        to: DENIED
        trigger: "POST /stb/reciprocal-switching-petitions/{id}/decide with outcome DENIED"
        actor: BoardAdjudicator
        preconditions:
          - "status == FILED (ERR_PETITION_NOT_FILED)"
        side_effects: []
      - from: GRANTED
        to: TERMINATED
        trigger: "POST /stb/reciprocal-switching-petitions/{id}/terminate"
        actor: BoardAdjudicator
        preconditions:
          - "status == GRANTED (ERR_PETITION_NOT_GRANTED)"
        side_effects:
          - "The consumed switching slot on interchange_code is released (compensating action for grant)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: merger-amend-stale-version
    parent_entity: MergerApplication
    write_endpoint: "POST /stb/merger-applications/{id}/amend"
    occ_field: expected_merger_application_version
    description: |
      Amending a MergerApplication whose version has advanced since the client
      last observed it is rejected. An amend legitimately supersedes the prior
      application content (it resets the comment window), so a client holding a
      stale version would silently overwrite a newer amendment; the stale
      version is rejected with 412 instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: alleged_rvc_ratio
    trigger: "rate complaint creation (POST /stb/rate-complaints)"
    algorithm: threshold
    formula: |
      alleged_rvc_ratio = round_half_up(challenged_rate_cents_per_ton / alleged_variable_cost_cents_per_ton, 4)
      Market dominance threshold: PRESENT requires alleged_rvc_ratio >= 1.8000
      (a ratio of exactly 1.8000 clears the threshold; 1.7999 does not).
    input_set: "the new complaint's own challenged_rate_cents_per_ton and alleged_variable_cost_cents_per_ton"
    constants:
      MARKET_DOMINANCE_RVC_THRESHOLD: 1.8000
    precision: "4 decimal places, round_half_up"
    variants:
      - name: alleged_variant
        when: "at filing and at market-dominance determination"
        difference: "uses the shipper-alleged cost figure; this is the variant that gates FILED -> EVIDENTIARY_PHASE"
      - name: adjudicated_variant
        when: "at decide time"
        difference: "same formula over the most recently VERIFIED evidence's verified_variable_cost_cents_per_ton; identical inputs except the cost source — the two variants diverge whenever verified cost differs from alleged cost, and the adjudicated variant alone gates UPHELD/REJECTED outcomes"
  - name: adjudicated_rvc_ratio
    trigger: "evidence verification (POST /stb/evidence-submissions/{id}/verify with review_outcome VERIFIED)"
    algorithm: threshold
    formula: |
      On each VERIFIED review:
        complaint.adjudicated_rvc_ratio =
          round_half_up(complaint.challenged_rate_cents_per_ton / evidence.verified_variable_cost_cents_per_ton, 4)
      The most recently VERIFIED evidence wins; reopen resets adjudicated_rvc_ratio to null.
    input_set: "parent complaint's challenged_rate_cents_per_ton; the evidence being verified"
    constants:
      MARKET_DOMINANCE_RVC_THRESHOLD: 1.8000
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: revenue_adequacy_roi
    trigger: "revenue adequacy finding creation (POST /stb/carriers/{id}/revenue-adequacy-findings)"
    algorithm: aggregation
    formula: |
      current_year_roi_bps = round_half_up((operating_revenue_cents - operating_expense_cents) * 10000 / net_investment_cents, 0)
      five_year_avg_roi_bps = round_half_up(mean of current_year_roi_bps over this carrier's findings with fiscal_year in [fiscal_year - 4, fiscal_year], 0)
        (fewer than 5 findings present -> average only the existing years)
      finding = ADEQUATE when five_year_avg_roi_bps >= COST_OF_CAPITAL_BPS else INADEQUATE
      Carrier.revenue_adequacy_status := finding of the carrier's finding with the greatest fiscal_year.
    input_set: "the new finding's inputs; this carrier's existing findings with fiscal_year in [Y-4, Y]"
    constants:
      COST_OF_CAPITAL_BPS: 1140
    precision: "integer basis points, round_half_up"
    variants:
      - name: current_year_variant
        when: "reported standalone on the finding"
        difference: "uses only the filing year's own figures"
      - name: five_year_average_variant
        when: "drives `finding` and Carrier.revenue_adequacy_status"
        difference: "smooths across up to 5 fiscal years; identical filings can yield a current-year INADEQUATE yet a five-year ADEQUATE finding (or vice versa)"

  - name: prescribed_rate_and_relief
    trigger: "rate complaint decide with outcome UPHELD"
    algorithm: tiered_pricing
    formula: |
      Let C = challenged_rate_cents_per_ton,
          V = verified_variable_cost_cents_per_ton of the latest VERIFIED evidence,
          R = reference_rate_cents_per_ton of the latest VERIFIED evidence,
          F = ADEQUACY_FLOOR_RVC_ADEQUATE (1.0000) if the contested-year finding is ADEQUATE
              else ADEQUACY_FLOOR_RVC_INADEQUATE (1.1000)  [cross-entity: RevenueAdequacyFinding of (carrier, contested_fiscal_year)],
          T = complaint.track.
      floor_rate      = round_half_up(V * F, 0)                      # integer cents per ton
      prescribed_rate = min(C, max(R, floor_rate))                   # floor binds when it exceeds the reference rate
      relief_per_ton  = C - prescribed_rate
      relief_raw      = relief_per_ton * annual_tons
      relief_granted_cents = min(relief_raw, TRACK_CAP[T])           # cap applies to THREE_BENCHMARK / SIMPLIFIED_SAC
      Non-linear interaction: 4+ inputs (V, R, F, C, tons, track cap) with nested min/max and
      a branch on a DIFFERENT entity's computed finding.
    input_set: "the complaint; latest VERIFIED evidence; contested-year RevenueAdequacyFinding"
    constants:
      ADEQUACY_FLOOR_RVC_ADEQUATE: 1.0000
      ADEQUACY_FLOOR_RVC_INADEQUATE: 1.1000
      THREE_BENCHMARK_RELIEF_CAP_CENTS: 100000000
      SIMPLIFIED_SAC_RELIEF_CAP_CENTS: 400000000
    precision: "integer cents; floor_rate rounded round_half_up to whole cents before the max()"

  - name: reparation_award_total
    trigger: "rate complaint decide with outcome UPHELD, over the shipments array supplied in the decide call"
    algorithm: aggregation
    formula: |
      diff = challenged_rate_cents_per_ton - prescribed_rate_cents_per_ton     # integer cents per ton
      For each shipment i (tons_i a decimal with up to 3 decimal places):
        per_shipment_i = round_half_up(diff * tons_i, 0)                        # WHOLE cents, per shipment FIRST
      award_granted_cents = sum over i of per_shipment_i
      PINNED ROUNDING ORDER: round each per-shipment overcharge to whole cents, THEN sum.
      (Sum-then-round is the forbidden alternative and yields different cents on fractional tonnage.)
      Empty shipments array -> award_granted_cents = 0.
    input_set: "shipments array from the decide payload; complaint rate fields"
    constants: {}
    precision: "whole cents per shipment, round_half_up, then integer sum"

  - name: public_interest_score
    trigger: "merger application creation and every successful amend"
    algorithm: weighted_scoring
    formula: |
      public_interest_score = round_half_up(0.40 * competition_preservation_score
                                          + 0.30 * service_reliability_score
                                          + 0.30 * shipper_impact_score, 2)
      Outcome consistency enforced at decide:
        APPROVED                  requires score >= 60.00
        APPROVED_WITH_CONDITIONS  requires 45.00 <= score < 60.00
        REJECTED                  requires score < 45.00
    input_set: "the application's three showing scores"
    constants:
      WEIGHT_COMPETITION: 0.40
      WEIGHT_SERVICE: 0.30
      WEIGHT_SHIPPER_IMPACT: 0.30
      APPROVE_THRESHOLD: 60.00
      CONDITIONS_THRESHOLD: 45.00
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role (ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER); then request-shape validation: every required input field present, enums in range, numeric bounds respected, service_end_date > service_start_date, conditions non-empty when required (ERR_INVALID_REQUEST). Header failure precedes body failure."
    error_id: "ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER | ERR_INVALID_REQUEST"
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Ownership: role Shipper must pass shipper_id == X-User-ID (complaint/petition/service-complaint bodies and owner-only actions); role CarrierOperator must match the carrier in path or body (carrier_id path param == X-User-ID, acquiring_carrier_id == X-User-ID, complaint.carrier_id == X-User-ID for evidence/reparation, merger.acquiring_carrier_id == X-User-ID for amend/service-assurance-plans); submitted_by_party must equal SHIPPER for role Shipper and CARRIER for role CarrierOperator on evidence. Ownership is evaluated only when the target resource exists; an unknown path id cannot be ownership-checked and falls through to the priority-4 existence failure."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /stb/rate-complaints, POST .../evidence, POST .../reopen, POST .../reparation-events, POST /stb/service-complaints, POST /stb/reciprocal-switching-petitions, POST /stb/merger-applications, POST .../amend, POST .../service-assurance-plans, POST /stb/abandonment-applications"
  - priority: 4
    category: existence
    check: "Path identifiers exist, validated left-to-right (carrier, then complaint/application/petition/evidence)"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_RATE_COMPLAINT_NOT_FOUND | ERR_EVIDENCE_NOT_FOUND | ERR_SERVICE_COMPLAINT_NOT_FOUND | ERR_MERGER_APPLICATION_NOT_FOUND | ERR_ABANDONMENT_APPLICATION_NOT_FOUND | ERR_PETITION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Body references exist: carrier_id on complaint/service-complaint/petition/abandonment creates; acquiring_carrier_id and target_carrier_id on merger create; evidence_service_complaint_id on petition create"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_SERVICE_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints"
  - priority: 6
    category: state
    check: "Target resource is in a state that permits the transition (ERR_COMPLAINT_NOT_FILED, ERR_COMPLAINT_NOT_IN_EVIDENTIARY, ERR_COMPLAINT_NOT_DECIDED, ERR_EVIDENCE_ALREADY_REVIEWED, ERR_SERVICE_COMPLAINT_NOT_OPEN, ERR_MERGER_NOT_IN_COMMENT_PERIOD, ERR_ABANDONMENT_NOT_UNDER_REVIEW, ERR_ABANDONMENT_NOT_GRANTED, ERR_ABANDONMENT_NOT_TRAIL_PENDING, ERR_PETITION_NOT_FILED, ERR_PETITION_NOT_GRANTED)"
    error_id: "per-transition state errors (see §1.6)"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Regulatory gate 1 (rate decide): a RevenueAdequacyFinding exists for (carrier_id, contested_fiscal_year)"
    error_id: ERR_REVENUE_ADEQUACY_FINDING_REQUIRED
    http_status: 409
    applies_to: "POST /stb/rate-complaints/{id}/decide"
  - priority: 8
    category: business_safety
    check: "Regulatory gate 2 (rate decide, outcomes UPHELD or REJECTED only): at least one VERIFIED evidence submission exists"
    error_id: ERR_NO_VERIFIED_EVIDENCE
    http_status: 409
    applies_to: "POST /stb/rate-complaints/{id}/decide"
  - priority: 9
    category: business_safety
    check: "Regulatory gate 3 (rate decide): outcome UPHELD or REJECTED requires adjudicated_rvc_ratio >= 1.8000; outcome DISMISSED requires adjudicated_rvc_ratio null or < 1.8000"
    error_id: "ERR_MARKET_DOMINANCE_ABSENT | ERR_MARKET_DOMINANCE_PRESENT"
    http_status: 409
    applies_to: "POST /stb/rate-complaints/{id}/decide"
  - priority: 10
    category: business_safety
    check: "Regulatory gate 4 (merger decide): outcome APPROVED requires service_review_hold == false"
    error_id: ERR_MERGER_SERVICE_HOLD
    http_status: 409
    applies_to: "POST /stb/merger-applications/{id}/decide"
  - priority: 11
    category: business_safety
    check: "Regulatory gate 5 (merger decide): outcome APPROVED_WITH_CONDITIONS requires at least one ServiceAssurancePlan"
    error_id: ERR_SERVICE_ASSURANCE_PLAN_REQUIRED
    http_status: 409
    applies_to: "POST /stb/merger-applications/{id}/decide"
  - priority: 12
    category: business_safety
    check: "Regulatory gate 6: decision/score consistency (merger: outcome must match the public_interest_score band — ERR_DECISION_INCONSISTENT_WITH_SCORE; abandonment: GRANTED requires public_convenience_finding == SERVED — ERR_DECISION_INCONSISTENT_WITH_FINDING)"
    error_id: "ERR_DECISION_INCONSISTENT_WITH_SCORE | ERR_DECISION_INCONSISTENT_WITH_FINDING"
    http_status: 422
    applies_to: "POST /stb/merger-applications/{id}/decide, POST /stb/abandonment-applications/{id}/decide"
  - priority: 13
    category: business_referential
    check: "Petition evidence complaint's carrier_id == petition.incumbent_carrier_id"
    error_id: ERR_SERVICE_COMPLAINT_CARRIER_MISMATCH
    http_status: 422
    applies_to: "POST /stb/reciprocal-switching-petitions/{id}/decide"
  - priority: 14
    category: business_temporal
    check: "Petition evidence freshness: petition.created_at - evidence complaint.created_at <= 84 days"
    error_id: ERR_SERVICE_FAILURE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /stb/reciprocal-switching-petitions/{id}/decide"
  - priority: 15
    category: business_temporal
    check: "Temporal gates: petition evidence complaint must be ESCALATED at decide time (ERR_PETITION_EVIDENCE_NOT_ESCALATED); merger decide only at/after comment_close_at (ERR_COMMENT_PERIOD_OPEN); trail conversion only at/before nitu_expires_at (ERR_TRAIL_USE_NOTICE_EXPIRED); consummation from TRAIL_PENDING only strictly after nitu_expires_at (ERR_TRAIL_USE_WINDOW_OPEN)"
    error_id: "ERR_PETITION_EVIDENCE_NOT_ESCALATED | ERR_COMMENT_PERIOD_OPEN | ERR_TRAIL_USE_NOTICE_EXPIRED | ERR_TRAIL_USE_WINDOW_OPEN"
    http_status: 409
    applies_to: "decide / convert / consummate endpoints"
  - priority: 16
    category: business_constraint
    check: "Uniqueness and capacity: carrier_code unique (ERR_DUPLICATE_CARRIER_CODE); one finding per carrier+fiscal_year (ERR_DUPLICATE_FINDING); at most one ACTIVE EmergencyServiceOrder per carrier (ERR_ESO_ALREADY_ACTIVE); at most one non-terminal petition per (shipper_id, interchange_code) (ERR_DUPLICATE_ACTIVE_PETITION); at most one ServiceAssurancePlan per merger (ERR_SERVICE_ASSURANCE_PLAN_EXISTS); at most one non-terminal abandonment per line_segment_ref (ERR_DUPLICATE_ACTIVE_ABANDONMENT); fewer than 4 overlapping GRANTED petitions per interchange window (ERR_INTERCHANGE_CAPACITY_EXCEEDED); facility_distance_miles <= 30 (ERR_FACILITY_BEYOND_INTERCHANGE_DISTANCE)"
    error_id: "ERR_DUPLICATE_CARRIER_CODE | ERR_DUPLICATE_FINDING | ERR_ESO_ALREADY_ACTIVE | ERR_DUPLICATE_ACTIVE_PETITION | ERR_SERVICE_ASSURANCE_PLAN_EXISTS | ERR_DUPLICATE_ACTIVE_ABANDONMENT | ERR_INTERCHANGE_CAPACITY_EXCEEDED | ERR_FACILITY_BEYOND_INTERCHANGE_DISTANCE"
    http_status: 409
    applies_to: "creation and decide endpoints as listed"
  - priority: 17
    category: business_fiscal
    check: "Reparation payment: amount_cents >= 1 (ERR_INVALID_REQUEST) and amount_cents <= award_outstanding_cents (ERR_PAYMENT_EXCEEDS_OUTSTANDING); REVERSAL requires award_paid_cents == 0 (ERR_AWARD_HAS_PAYMENTS)"
    error_id: "ERR_INVALID_REQUEST | ERR_PAYMENT_EXCEEDS_OUTSTANDING | ERR_AWARD_HAS_PAYMENTS"
    http_status: 402
    applies_to: "POST /stb/rate-complaints/{id}/reparation-events"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/stb/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads this default and never wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "Advancing the clock past an ACTIVE EmergencyServiceOrder's expires_at transitions it to EXPIRED and recomputes the carrier's compliance_standing and merger service_review_hold"

  # --- Carrier ---
  - method: POST
    path: "/stb/carriers"
    description: "Register a railroad carrier"
    roles: [PlatformAdmin]
    code: 201
    input: [carrier_code, legal_name, carrier_class, base_route_miles]
    output: Carrier
    side_effects:
      - "active_route_miles = base_route_miles; abandoned/trail_use = 0; revenue_adequacy_status = UNDETERMINED; compliance_standing = GOOD; reparation_exposure_cents = 0"

  - method: GET
    path: "/stb/carriers/{id}"
    description: "Read a carrier including all computed fields"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  # --- Carrier-scoped read views (FK reverse reachability) ---
  - method: GET
    path: "/stb/carriers/{id}/revenue-adequacy-findings"
    description: "List revenue adequacy findings filed for a carrier"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "RevenueAdequacyFinding[]"
    side_effects: []

  - method: GET
    path: "/stb/carriers/{id}/rate-complaints"
    description: "List rate complaints filed against a carrier"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "RateComplaint[]"
    side_effects: []

  - method: GET
    path: "/stb/carriers/{id}/service-complaints"
    description: "List service complaints filed against a carrier"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ServiceComplaint[]"
    side_effects: []

  - method: GET
    path: "/stb/carriers/{id}/emergency-service-orders"
    description: "List emergency service orders directed at a carrier"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "EmergencyServiceOrder[]"
    side_effects: []

  - method: GET
    path: "/stb/carriers/{id}/merger-applications"
    description: "List merger applications where the carrier is acquirer or target"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "MergerApplication[]"
    side_effects: []

  - method: GET
    path: "/stb/carriers/{id}/abandonment-applications"
    description: "List abandonment applications filed by a carrier"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "AbandonmentApplication[]"
    side_effects: []

  - method: GET
    path: "/stb/carriers/{id}/reciprocal-switching-petitions"
    description: "List reciprocal switching petitions naming a carrier as incumbent"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ReciprocalSwitchingPetition[]"
    side_effects: []

  # --- RevenueAdequacyFinding ---
  - method: POST
    path: "/stb/carriers/{id}/revenue-adequacy-findings"
    description: "File the carrier's annual report and publish the Board's revenue adequacy finding for a fiscal year"
    roles: [BoardAdjudicator]
    code: 201
    input: [fiscal_year, operating_revenue_cents, operating_expense_cents, net_investment_cents]
    output: RevenueAdequacyFinding
    side_effects:
      - "current_year_roi_bps and five_year_avg_roi_bps computed; finding derived"
      - "Carrier.revenue_adequacy_status recomputed from the greatest-fiscal-year finding"

  # --- RateComplaint ---
  - method: POST
    path: "/stb/rate-complaints"
    description: "Shipper files a rate reasonableness complaint"
    roles: [Shipper]
    code: 201
    input: [shipper_id, carrier_id, commodity, challenged_rate_cents_per_ton, alleged_variable_cost_cents_per_ton, annual_tons, relief_sought_cents, contested_fiscal_year]
    output: RateComplaint
    side_effects:
      - "track computed from relief_sought_cents; alleged_rvc_ratio computed; status = FILED; market_dominance = UNDETERMINED; award_status = NONE"

  - method: GET
    path: "/stb/rate-complaints/{id}"
    description: "Read a rate complaint"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: []
    output: RateComplaint
    side_effects: []

  - method: POST
    path: "/stb/rate-complaints/{id}/determine-market-dominance"
    description: "Board issues the threshold market dominance determination"
    roles: [BoardAdjudicator]
    code: 200
    input: [product_competition_exists, geographic_competition_exists]
    output: RateComplaint
    side_effects:
      - "PRESENT (alleged_rvc_ratio >= 1.8000 and no competition) -> EVIDENTIARY_PHASE; else ABSENT -> DISMISSED"

  - method: POST
    path: "/stb/rate-complaints/{id}/evidence"
    description: "Submit evidentiary material (SAC study, three-benchmark packet, or rebuttal)"
    roles: [Shipper, CarrierOperator]
    code: 201
    input: [submission_type, submitted_by_party, reference_rate_cents_per_ton, verified_variable_cost_cents_per_ton]
    output: EvidenceSubmission
    side_effects:
      - "Evidence created SUBMITTED; if complaint was REOPENED it re-enters EVIDENTIARY_PHASE"

  - method: GET
    path: "/stb/rate-complaints/{id}/evidence"
    description: "List evidence submissions on a complaint"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "EvidenceSubmission[]"
    side_effects: []

  - method: POST
    path: "/stb/evidence-submissions/{id}/verify"
    description: "Board verifies or rejects an evidence submission"
    roles: [BoardAdjudicator]
    code: 200
    input: [review_outcome]
    output: EvidenceSubmission
    side_effects:
      - "On VERIFIED: parent complaint's adjudicated_rvc_ratio recomputed from this evidence"

  - method: POST
    path: "/stb/rate-complaints/{id}/decide"
    description: "Board decides the complaint on the merits or dismisses for lack of market dominance"
    roles: [BoardAdjudicator]
    code: 200
    input: [outcome, "shipments?"]
    output: RateComplaint
    side_effects:
      - "UPHELD: prescribed_rate_cents_per_ton and relief_granted_cents via prescribed_rate_and_relief; award via reparation_award_total; Carrier.reparation_exposure_cents += award_granted_cents"
      - "award 0 -> auto CLOSED; REJECTED -> DECIDED (award NONE); DISMISSED -> DISMISSED"

  - method: POST
    path: "/stb/rate-complaints/{id}/reopen"
    description: "Shipper petitions to reopen a decided complaint"
    roles: [Shipper]
    code: 200
    input: []
    output: RateComplaint
    side_effects:
      - "status -> REOPENED; VERIFIED evidence -> SUPERSEDED; adjudicated_rvc_ratio = null"

  - method: POST
    path: "/stb/rate-complaints/{id}/reparation-events"
    description: "Carrier posts a reparation PAYMENT; Board posts a REVERSAL (only when nothing paid)"
    roles: [CarrierOperator, BoardAdjudicator]
    code: 200
    input: [event_type, "amount_cents?"]
    output: RateComplaint
    side_effects:
      - "PAYMENT: award_paid_cents += amount, award_outstanding_cents -= amount; award_status -> PARTIALLY_PAID or PAID; PAID auto-closes the complaint and recomputes Carrier.reparation_exposure_cents"
      - "REVERSAL: award_granted_cents = award_paid_cents (== 0 precondition), award_outstanding_cents = 0, award_status = REVERSED; complaint auto-closes; exposure recomputed"

  # --- ServiceComplaint / EmergencyServiceOrder ---
  - method: POST
    path: "/stb/service-complaints"
    description: "Shipper files a service complaint against a carrier"
    roles: [Shipper]
    code: 201
    input: [shipper_id, carrier_id, issue_type, territory_code]
    output: ServiceComplaint
    side_effects:
      - "status = OPEN"

  - method: GET
    path: "/stb/service-complaints/{id}"
    description: "Read a service complaint"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: []
    output: ServiceComplaint
    side_effects: []

  - method: GET
    path: "/stb/service-complaints/{id}/emergency-service-orders"
    description: "List emergency service orders issued from a service complaint"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "EmergencyServiceOrder[]"
    side_effects: []

  - method: POST
    path: "/stb/service-complaints/{id}/resolve"
    description: "Board marks a service complaint resolved; lifts any active ESO"
    roles: [BoardAdjudicator]
    code: 200
    input: []
    output: ServiceComplaint
    side_effects:
      - "ESCALATED complaint: linked ESO (if ACTIVE) -> LIFTED; carrier standing and merger holds recomputed"

  - method: POST
    path: "/stb/service-complaints/{id}/escalate"
    description: "Board escalates a service complaint by issuing an emergency service order"
    roles: [BoardAdjudicator]
    code: 201
    input: [directive]
    output: EmergencyServiceOrder
    side_effects:
      - "Complaint -> ESCALATED; ESO created ACTIVE (issued_at = now, expires_at = now + 60 days)"
      - "Carrier.compliance_standing -> PROBATION; COMMENT_PERIOD mergers of the carrier gain service_review_hold"

  # --- MergerApplication / ServiceAssurancePlan ---
  - method: POST
    path: "/stb/merger-applications"
    description: "Acquiring carrier files a merger application; comment period opens immediately"
    roles: [CarrierOperator]
    code: 201
    input: [acquiring_carrier_id, target_carrier_id, transaction_value_cents, competition_preservation_score, service_reliability_score, shipper_impact_score]
    output: MergerApplication
    side_effects:
      - "status = COMMENT_PERIOD; comment_close_at = created_at + 45 days; public_interest_score computed"

  - method: GET
    path: "/stb/merger-applications/{id}"
    description: "Read a merger application"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: []
    output: MergerApplication
    side_effects: []

  - method: POST
    path: "/stb/merger-applications/{id}/amend"
    description: "Amend a merger application's showings; supersedes prior content and resets the comment window (OCC-guarded)"
    roles: [CarrierOperator]
    code: 200
    input: [expected_merger_application_version, "transaction_value_cents?", "competition_preservation_score?", "service_reliability_score?", "shipper_impact_score?"]
    output: MergerApplication
    side_effects:
      - "increments MergerApplication.version by 1"
      - "comment_close_at = now + 45 days; public_interest_score recomputed"

  - method: POST
    path: "/stb/merger-applications/{id}/decide"
    description: "Board decides a merger application on public interest standards"
    roles: [BoardAdjudicator]
    code: 200
    input: [outcome, "conditions?"]
    output: MergerApplication
    side_effects:
      - "APPROVED_WITH_CONDITIONS: conditions_imposed recorded; ServiceAssurancePlan -> MONITORING"
      - "APPROVED: ServiceAssurancePlan (if any) -> MONITORING; REJECTED: ServiceAssurancePlan (if any) -> MOOT"

  - method: POST
    path: "/stb/merger-applications/{id}/service-assurance-plans"
    description: "File a service assurance plan on a merger application (at most one)"
    roles: [CarrierOperator]
    code: 201
    input: [plan_name, commitments]
    output: ServiceAssurancePlan
    side_effects:
      - "status = DRAFT; precondition: parent merger must be in COMMENT_PERIOD (ERR_MERGER_NOT_IN_COMMENT_PERIOD)"

  - method: GET
    path: "/stb/merger-applications/{id}/service-assurance-plans"
    description: "List service assurance plans on a merger application"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceAssurancePlan[]"
    side_effects: []

  # --- AbandonmentApplication ---
  - method: POST
    path: "/stb/abandonment-applications"
    description: "Carrier files a line abandonment/discontinuance application"
    roles: [CarrierOperator]
    code: 201
    input: [carrier_id, line_segment_ref, segment_miles]
    output: AbandonmentApplication
    side_effects:
      - "status = UNDER_REVIEW"

  - method: GET
    path: "/stb/abandonment-applications/{id}"
    description: "Read an abandonment application"
    roles: [PlatformAdmin, BoardAdjudicator, Shipper, CarrierOperator]
    code: 200
    input: []
    output: AbandonmentApplication
    side_effects: []

  - method: POST
    path: "/stb/abandonment-applications/{id}/decide"
    description: "Board issues the public convenience and necessity finding and grants or denies"
    roles: [BoardAdjudicator]
    code: 200
    input: [outcome, public_convenience_finding]
    output: AbandonmentApplication
    side_effects:
      - "outcome GRANTED requires public_convenience_finding SERVED; DENIED records the finding and terminates the application"

  - method: POST
    path: "/stb/abandonment-applications/{id}/issue-trail-use-notice"
    description: "Board issues a Notice of Interim Trail Use, opening the 180-day negotiation window"
    roles: [BoardAdjudicator]
    code: 200
    input: []
    output: AbandonmentApplication
    side_effects:
      - "status -> TRAIL_PENDING; nitu_expires_at = now + 180 days"

  - method: POST
    path: "/stb/abandonment-applications/{id}/convert-to-trail-use"
    description: "Convert the line to interim trail use (railbanking) within the NITU window"
    roles: [BoardAdjudicator]
    code: 200
    input: []
    output: AbandonmentApplication
    side_effects:
      - "status -> TRAIL_CONVERTED; carrier mileage moves from active to trail_use"

  - method: POST
    path: "/stb/abandonment-applications/{id}/consummate-abandonment"
    description: "Consummate the abandonment; from TRAIL_PENDING only after the NITU window lapses"
    roles: [BoardAdjudicator]
    code: 200
    input: []
    output: AbandonmentApplication
    side_effects:
      - "status -> CONSUMMATED; carrier mileage moves from active to abandoned"

  # --- ReciprocalSwitchingPetition ---
  - method: POST
    path: "/stb/reciprocal-switching-petitions"
    description: "Shipper petitions for reciprocal switching / interchange access"
    roles: [Shipper]
    code: 201
    input: [shipper_id, incumbent_carrier_id, interchange_code, facility_distance_miles, evidence_service_complaint_id, service_start_date, service_end_date]
    output: ReciprocalSwitchingPetition
    side_effects:
      - "status = FILED"

  - method: POST
    path: "/stb/reciprocal-switching-petitions/{id}/decide"
    description: "Board grants or denies a reciprocal switching petition"
    roles: [BoardAdjudicator]
    code: 200
    input: [outcome]
    output: ReciprocalSwitchingPetition
    side_effects:
      - "GRANTED consumes one of the 4 switching slots on interchange_code for the requested window"

  - method: POST
    path: "/stb/reciprocal-switching-petitions/{id}/terminate"
    description: "Board terminates a granted petition, releasing its interchange slot"
    roles: [BoardAdjudicator]
    code: 200
    input: []
    output: ReciprocalSwitchingPetition
    side_effects:
      - "status -> TERMINATED; slot on interchange_code released"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or X-User-Role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role is not in the endpoint's role list (includes event_type/role mismatch on reparation-events)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Party/ownership mismatch: Shipper's X-User-ID != shipper_id, CarrierOperator's X-User-ID != the carrier in path/body, or submitted_by_party inconsistent with caller role" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, amount_cents < 1 on PAYMENT, service_end_date <= service_start_date, score out of 0..100, empty conditions on APPROVED_WITH_CONDITIONS, or other malformed input" }
  # --- existence ---
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "Referenced carrier id does not exist (path or body)" }
  - { id: ERR_RATE_COMPLAINT_NOT_FOUND, http: 404, condition: "Referenced rate complaint id does not exist" }
  - { id: ERR_EVIDENCE_NOT_FOUND, http: 404, condition: "Referenced evidence submission id does not exist" }
  - { id: ERR_SERVICE_COMPLAINT_NOT_FOUND, http: 404, condition: "Referenced service complaint id does not exist (path or petition evidence body reference)" }
  - { id: ERR_MERGER_APPLICATION_NOT_FOUND, http: 404, condition: "Referenced merger application id does not exist" }
  - { id: ERR_ABANDONMENT_APPLICATION_NOT_FOUND, http: 404, condition: "Referenced abandonment application id does not exist" }
  - { id: ERR_PETITION_NOT_FOUND, http: 404, condition: "Referenced reciprocal switching petition id does not exist" }
  # --- state ---
  - { id: ERR_COMPLAINT_NOT_FILED, http: 409, condition: "determine-market-dominance requires the complaint in FILED" }
  - { id: ERR_COMPLAINT_NOT_IN_EVIDENTIARY, http: 409, condition: "evidence submission or decide requires the complaint in EVIDENTIARY_PHASE (evidence also accepts REOPENED)" }
  - { id: ERR_COMPLAINT_NOT_DECIDED, http: 409, condition: "reopen or reparation-events require the complaint in DECIDED" }
  - { id: ERR_EVIDENCE_ALREADY_REVIEWED, http: 409, condition: "verify requires the evidence submission in SUBMITTED" }
  - { id: ERR_SERVICE_COMPLAINT_NOT_OPEN, http: 409, condition: "resolve/escalate require the service complaint in OPEN or ESCALATED (resolve) / OPEN (escalate)" }
  - { id: ERR_MERGER_NOT_IN_COMMENT_PERIOD, http: 409, condition: "amend/decide require the merger application in COMMENT_PERIOD" }
  - { id: ERR_ABANDONMENT_NOT_UNDER_REVIEW, http: 409, condition: "decide requires the abandonment application in UNDER_REVIEW" }
  - { id: ERR_ABANDONMENT_NOT_GRANTED, http: 409, condition: "issue-trail-use-notice requires GRANTED; consummate requires GRANTED or TRAIL_PENDING" }
  - { id: ERR_ABANDONMENT_NOT_TRAIL_PENDING, http: 409, condition: "convert-to-trail-use requires TRAIL_PENDING" }
  - { id: ERR_PETITION_NOT_FILED, http: 409, condition: "petition decide requires FILED" }
  - { id: ERR_PETITION_NOT_GRANTED, http: 409, condition: "petition terminate requires GRANTED" }
  # --- regulatory (business_safety) ---
  - { id: ERR_REVENUE_ADEQUACY_FINDING_REQUIRED, http: 409, condition: "rate decide: no RevenueAdequacyFinding exists for (carrier_id, contested_fiscal_year)" }
  - { id: ERR_NO_VERIFIED_EVIDENCE, http: 409, condition: "rate decide: no EvidenceSubmission with review_status VERIFIED" }
  - { id: ERR_MARKET_DOMINANCE_ABSENT, http: 409, condition: "rate decide UPHELD/REJECTED but adjudicated_rvc_ratio < 1.8000 (or null): the Board lacks jurisdiction; must DISMISS" }
  - { id: ERR_MARKET_DOMINANCE_PRESENT, http: 409, condition: "rate decide DISMISSED but adjudicated_rvc_ratio >= 1.8000: merits decision required" }
  - { id: ERR_MERGER_SERVICE_HOLD, http: 409, condition: "merger decide APPROVED while the acquiring carrier has an ACTIVE emergency service order (service_review_hold)" }
  - { id: ERR_SERVICE_ASSURANCE_PLAN_REQUIRED, http: 409, condition: "merger decide APPROVED_WITH_CONDITIONS but no ServiceAssurancePlan exists on the application" }
  - { id: ERR_DECISION_INCONSISTENT_WITH_SCORE, http: 422, condition: "merger outcome does not match the public_interest_score band (>= 60.00 APPROVED; 45.00-59.99 APPROVED_WITH_CONDITIONS; < 45.00 REJECTED)" }
  - { id: ERR_DECISION_INCONSISTENT_WITH_FINDING, http: 422, condition: "abandonment outcome GRANTED with public_convenience_finding != SERVED" }
  # --- referential / temporal ---
  - { id: ERR_SERVICE_COMPLAINT_CARRIER_MISMATCH, http: 422, condition: "petition decide: evidence complaint's carrier_id != petition.incumbent_carrier_id" }
  - { id: ERR_SERVICE_FAILURE_WINDOW_EXPIRED, http: 422, condition: "petition decide: evidence complaint created more than 84 days before the petition (petition.created_at - evidence.created_at > 84 days)" }
  - { id: ERR_PETITION_EVIDENCE_NOT_ESCALATED, http: 409, condition: "petition decide GRANTED: evidence service complaint is not in ESCALATED status at decide time" }
  - { id: ERR_COMMENT_PERIOD_OPEN, http: 409, condition: "merger decide before comment_close_at (logical clock < comment_close_at)" }
  - { id: ERR_TRAIL_USE_NOTICE_EXPIRED, http: 409, condition: "convert-to-trail-use after nitu_expires_at (logical clock > nitu_expires_at)" }
  - { id: ERR_TRAIL_USE_WINDOW_OPEN, http: 409, condition: "consummate from TRAIL_PENDING at or before nitu_expires_at (strictly-after required)" }
  # --- constraint ---
  - { id: ERR_DUPLICATE_CARRIER_CODE, http: 409, condition: "carrier_code already registered" }
  - { id: ERR_DUPLICATE_FINDING, http: 409, condition: "a RevenueAdequacyFinding already exists for this carrier and fiscal_year" }
  - { id: ERR_ESO_ALREADY_ACTIVE, http: 409, condition: "escalate while another EmergencyServiceOrder is ACTIVE for the same carrier (closed-interval capacity 1 per carrier)" }
  - { id: ERR_DUPLICATE_ACTIVE_PETITION, http: 409, condition: "a non-terminal (FILED or GRANTED) petition already exists for this (shipper_id, interchange_code)" }
  - { id: ERR_SERVICE_ASSURANCE_PLAN_EXISTS, http: 409, condition: "a ServiceAssurancePlan already exists on this merger application" }
  - { id: ERR_DUPLICATE_ACTIVE_ABANDONMENT, http: 409, condition: "a non-terminal (UNDER_REVIEW, GRANTED, TRAIL_PENDING) abandonment application already exists for this line_segment_ref" }
  - { id: ERR_INTERCHANGE_CAPACITY_EXCEEDED, http: 409, condition: "granting would give the interchange_code 4 overlapping GRANTED petition windows (half-open [start, end) semantics; adjacency does not overlap)" }
  - { id: ERR_FACILITY_BEYOND_INTERCHANGE_DISTANCE, http: 422, condition: "facility_distance_miles > 30" }
  # --- fiscal ---
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 402, condition: "reparation PAYMENT amount_cents > award_outstanding_cents" }
  - { id: ERR_AWARD_HAS_PAYMENTS, http: 409, condition: "reparation REVERSAL while award_paid_cents > 0" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_merger_application_version does not match the application's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Board staff administrator; registers carriers and operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /stb/carriers"
      - "POST /stb/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: BoardAdjudicator
    description: "STB board adjudicator; issues determinations, findings, decisions, orders, and petitions' dispositions"
    identity: opaque
    exclusive_operations:
      - "POST /stb/carriers/{id}/revenue-adequacy-findings"
      - "POST /stb/rate-complaints/{id}/determine-market-dominance"
      - "POST /stb/evidence-submissions/{id}/verify"
      - "POST /stb/rate-complaints/{id}/decide"
      - "POST /stb/service-complaints/{id}/resolve and .../escalate"
      - "POST /stb/merger-applications/{id}/decide"
      - "POST /stb/abandonment-applications/{id}/decide, .../issue-trail-use-notice, .../convert-to-trail-use, .../consummate-abandonment"
      - "POST /stb/reciprocal-switching-petitions/{id}/decide and .../terminate"
    shared_operations:
      - "POST /stb/rate-complaints/{id}/reparation-events (REVERSAL events)"
      - "All GET endpoints"
  - name: Shipper
    description: "Shipper party; files rate complaints, evidence, service complaints, and switching petitions. X-User-ID is the shipper party identifier recorded as shipper_id (not an entity id)."
    identity: opaque
    exclusive_operations:
      - "POST /stb/rate-complaints"
      - "POST /stb/rate-complaints/{id}/reopen"
      - "POST /stb/service-complaints"
      - "POST /stb/reciprocal-switching-petitions"
    shared_operations:
      - "POST /stb/rate-complaints/{id}/evidence (as submitted_by_party SHIPPER on own complaints)"
      - "All GET endpoints"
  - name: CarrierOperator
    description: "Railroad operator; X-User-ID equals the Carrier.id the operator acts for"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /stb/merger-applications and .../amend (as acquiring carrier)"
      - "POST /stb/merger-applications/{id}/service-assurance-plans"
      - "POST /stb/abandonment-applications"
    shared_operations:
      - "POST /stb/rate-complaints/{id}/evidence (as submitted_by_party CARRIER on complaints against own carrier)"
      - "POST /stb/rate-complaints/{id}/reparation-events (PAYMENT events on complaints against own carrier)"
      - "All GET endpoints"
