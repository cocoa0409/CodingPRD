      - name: station_decommission_cascade_retires_ports_excludes_open_outages_and_cancels_dispatches
        claim_type: cascade_down
        grounds:
          - state_machines.Station.transitions.OPERATIONAL_to_DECOMMISSIONED
          - state_machines.ChargingPort.transitions.OUT_OF_SERVICE_to_RETIRED
          - state_machines.OutageEvent.transitions.CLASSIFIED_to_EXCLUDED
          - state_machines.MaintenanceDispatch.transitions.CREATED_to_CANCELLED
          - state_machines.PartReservation.transitions.RESERVED_to_RELEASED
          - entities.HostSite.fields.station_count
        distinguishing_aspect: "Cascade B fans out from one status-transition into four dependent entities at once: both ports RETIRED, the open MAJOR outage EXCLUDED with excluded_cause_claim forced to HOST_SITE_CLOSURE, the live dispatch CANCELLED, its RESERVED part reservation RELEASED with the spare part's unencumbered_qty restored, and HostSite.station_count decremented. Cancelling only the dispatch while leaving stock encumbered fails."
