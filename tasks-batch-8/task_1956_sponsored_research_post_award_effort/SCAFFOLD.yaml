# =============================================================================
# Task 1956 — Sponsored Research Post-Award & Effort Reporting
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design
# (§1.9) live in sibling files.
# =============================================================================

scenario: |
  1956. Sponsored Research Post-Award & Effort Reporting (university grants accounting): account setup & budget load by category, expenditure allowability review & cost transfer justification, effort certification cycle & salary-cap handling, subaward invoice review & monitoring, no-cost extension & rebudget requests, milestone/technical report deadlines, invoicing/letter-of-credit drawdown & receivable aging, closeout & final financial report

domain_name: sponsored-research-post-award
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit          # UG-style allowability, segregation of duties, retroactive-transfer controls, closeout gates
  secondary_archetype: ledger_reconciliation   # provisional-vs-actual fringe; cash-basis vs accrual-basis drawdown pools
  complexity_layers:
    - optimistic_concurrency        # OCC on GrantAward.version (drawdown/modification create) and EffortStatement.version (certify)
    - cascading_side_effects        # expenditure post -> budget lines -> award MTDC/F&A -> draw pool + effort statement (depth 4)
    - dual_variant_calculation      # LOC cash-basis vs invoice accrual-basis; provisional vs actual fringe rate
    - rate_threshold_triggers       # 25% rebudget significance, 90-day retroactive transfer, 60-day interest grace, 75% key-personnel floor
    - derived_field_reconciliation  # award posture/pools recomputed from children; F&A line recomputed from direct lines
    - pagination_with_filtering     # flat list endpoints with FK/status filters + limit/offset

  entity_topology: flat               # all collections top-level under /api; FK links in request bodies; filtered-list reverse reads
  state_machine_shape: compound       # cyclic machines (transfer/statement/invoice/report) + GrantAward parallel dims (status x derived posture)
  relationship_patterns:
    - one_to_many         # award -> budget lines, expenditures, reports, drawdowns, receivables, modifications
    - cross_aggregate     # cost transfer links two awards; statements link cycle x person x award
    - self_referential    # Expenditure.transferred_from_id -> Expenditure.id (compensating mirror entries)
  role_model: segregation_of_duties   # submitter != approver on cost transfers; >90d transfers need a second approver from a different role
  consistency_model: immediate        # every mutation + cascade is atomically visible in the same request/response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All money fields are integer cents. All datetimes are ISO 8601 UTC.
# List endpoints default sort: created_at ASC (stable; never id-based).
# =============================================================================
entities:
  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sponsor (funding agency) name" }
      - { name: sponsor_type, type: enum, source: input, description: "FEDERAL | FEDERAL_FLOW_THROUGH | INDUSTRY | FOUNDATION | STATE" }
      - { name: payment_method, type: enum, source: input, description: "LETTER_OF_CREDIT | COST_REIMBURSABLE_INVOICE | FIXED_PRICE_SCHEDULE; inherited by awards at creation" }
      - { name: salary_cap_annual_cents, type: integer, source: input, required: false, description: "12-month-equivalent salary rate cap; omit/null = no cap applies" }
      - { name: f_and_a_rate_bps, type: integer, source: input, description: "Negotiated indirect (F&A) rate in basis points, applied to MTDC" }
      - { name: late_payment_apr_bps, type: integer, source: input, default: 0, description: "APR in basis points for receivable late-interest accrual beyond the grace period" }

  - name: Person
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Research personnel full name" }
      - { name: role_type, type: enum, source: input, description: "PRINCIPAL_INVESTIGATOR | RESEARCH_STAFF" }
      - { name: institutional_base_salary_annual_cents, type: integer, source: input, constraints: "> 0", description: "Institutional base salary (IBS) annualized for the appointment" }
      - { name: appointment_months, type: integer, source: input, constraints: "9 or 12", description: "Academic-year (9) or calendar-year (12) appointment; drives IBS monthly rate" }

  - name: GrantAward
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id" }
      - { name: pi_id, type: string, source: input, description: "FK -> Person.id; principal investigator" }
      - { name: award_number, type: string, source: input, constraints: "globally unique", description: "Sponsor award number" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: project_start_date, type: datetime, source: input, description: "Period of performance start (inclusive)" }
      - { name: original_end_date, type: datetime, source: input, description: "Period of performance end (inclusive) as awarded" }
      - { name: current_end_date, type: datetime, source: system, description: "Effective end date; = original_end_date at creation, extended by approved NO_COST_EXTENSION modifications" }
      - { name: total_obligated_cents, type: integer, source: input, constraints: ">= 0", description: "Total obligated amount; reduced at closeout by deobligation of residual" }
      - { name: salary_cap_annual_cents, type: integer, source: system, description: "Copied from Sponsor at award creation (version-pinned); null when sponsor has no cap" }
      - { name: f_and_a_rate_bps, type: integer, source: system, description: "Copied from Sponsor at award creation (version-pinned)" }
      - { name: payment_method, type: enum, source: system, description: "Copied from Sponsor at award creation (version-pinned)" }
      - { name: fringe_rate_bps, type: integer, source: input, description: "Provisional fringe benefit rate (bps) charged per salary line" }
      - { name: cost_share_committed_cents, type: integer, source: input, default: 0, description: "Committed cost share; shortfall reduces final payment at FFR submit" }
      - { name: status, type: enum, source: system, description: "PENDING_SETUP | ACTIVE | SUSPENDED | CLOSEOUT_PENDING | CLOSED" }
      - { name: posture, type: enum, source: computed, description: "Derived gating dimension: OPEN | RESTRICTED | FROZEN; recomputed from overdue reports and FFR lateness" }
      - { name: mtdc_spent_cents, type: integer, source: computed, default: 0, description: "Sum of mtdc_eligible_cents over POSTED non-cost-share expenditures" }
      - { name: f_and_a_accrued_cents, type: integer, source: computed, default: 0, description: "= round_half_up(f_and_a_rate_bps/10000 * mtdc_spent_cents)" }
      - { name: total_direct_spent_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over POSTED non-cost-share expenditures" }
      - { name: cost_share_met_cents, type: integer, source: computed, default: 0, description: "Posted cost-share expenditures + salary over-cap contributions" }
      - { name: cumulative_drawn_cents, type: integer, source: computed, default: 0, description: "Settled LOC drawdowns + principal paid on receivables" }
      - { name: reserved_draw_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over drawdown requests in SUBMITTED status" }
      - { name: available_draw_pool_cents, type: integer, source: computed, default: 0, description: "LOC: eligible pool minus cumulative_drawn minus reserved; see drawdown_eligible_pool" }
      - { name: nce_count, type: integer, source: system, default: 0, description: "Number of approved NO_COST_EXTENSION modifications" }
      - { name: residual_deobligated_cents, type: integer, source: system, description: "Residual obligation deobligated at close; null until CLOSED" }

  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> GrantAward.id" }
      - { name: category, type: enum, source: input, description: "PERSONNEL_SALARIES | FRINGE_BENEFITS | EQUIPMENT | TRAVEL | PARTICIPANT_SUPPORT | MATERIALS_SUPPLIES | SUBAWARDS | OTHER_DIRECT | F_AND_A" }
      - { name: authorized_cents, type: integer, source: input, constraints: ">= 0", description: "Authorized amount; for category F_AND_A this is system-computed (input ignored) — see f_and_a_accrual" }
      - { name: baseline_authorized_cents, type: integer, source: system, description: "Sponsor-approved baseline snapshot: set = authorized_cents at award activation and after each sponsor-approved REBUDGET" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over POSTED expenditures on this line (fringe postings land on FRINGE_BENEFITS line)" }
      - { name: mtdc_eligible_cents, type: integer, source: input, required: false, default: 0, constraints: "<= authorized_cents; only meaningful on SUBAWARDS lines", description: "Portion of a SUBAWARDS line counting toward MTDC (typically 25000 USD per planned subaward)" }

  - name: EffortCommitment
    parent: null
    common_fields: false
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> GrantAward.id" }
      - { name: person_id, type: string, source: input, description: "FK -> Person.id" }
      - { name: committed_effort_pct, type: number, source: input, constraints: "0 < x <= 100, 2 decimal places", description: "Effort committed to the sponsor for this person on this award" }
      - { name: is_key_personnel, type: boolean, source: input, default: false, description: "Key personnel trigger the 75% reduction floor at certification" }
    # uniqueness: (award_id, person_id) — duplicate rejected with ERR_DUPLICATE_COMMITMENT

  - name: Expenditure
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> GrantAward.id" }
      - { name: budget_line_id, type: string, source: input, description: "FK -> BudgetLine.id; must belong to award_id and match the category implied by expenditure_type" }
      - { name: person_id, type: string, source: input, required: false, description: "FK -> Person.id; required iff expenditure_type == SALARY" }
      - { name: transferred_from_id, type: string, source: system, required: false, description: "FK -> Expenditure.id; set on mirror entries created by an approved cost transfer" }
      - { name: expenditure_type, type: enum, source: input, description: "SALARY | TRAVEL | EQUIPMENT | SUPPLIES | PARTICIPANT_SUPPORT | OTHER_DIRECT | SUBAWARD_PAYMENT; SUBAWARD_PAYMENT is system-created only (by subaward invoice approval)" }
      - { name: amount_cents, type: integer, source: input, required: false, description: "Direct charge; required for non-SALARY types; for SALARY it is computed by salary_charge_with_cap and any input is ignored" }
      - { name: fringe_cents, type: integer, source: computed, default: 0, description: "Fringe charged on this salary line (provisional rate at post time); 0 for non-SALARY" }
      - { name: over_cap_cents, type: integer, source: computed, default: 0, description: "Salary portion above the sponsor cap: unallowable, routed to institutional cost share" }
      - { name: mtdc_eligible_cents, type: integer, source: computed, description: "Contribution to MTDC: 0 for EQUIPMENT/PARTICIPANT_SUPPORT/cost-share; capped subaward portion for SUBAWARD_PAYMENT; amount_cents otherwise" }
      - { name: effort_pct, type: number, required: false, source: input, constraints: "0 < x <= 100, 2dp", description: "Required iff SALARY: effort percentage for the charged period" }
      - { name: period_months, type: number, required: false, source: input, constraints: "> 0, <= 12, up to 2dp", description: "Required iff SALARY: number of months the charge covers" }
      - { name: transaction_date, type: datetime, source: input, description: "Date the cost was incurred; must lie within [project_start_date, current_end_date]" }
      - { name: is_cost_share, type: boolean, source: input, default: false, description: "Cost-share expenditures debit award.cost_share_met_cents instead of a budget line" }
      - { name: cash_disbursed, type: boolean, source: input, default: false, description: "True once cash left the institution; gates inclusion in the LOC (cash-basis) draw pool" }
      - { name: is_allocable, type: boolean, source: input, description: "Allowability attestation: allocable to this award" }
      - { name: is_reasonable, type: boolean, source: input, description: "Allowability attestation: reasonable cost" }
      - { name: is_consistent, type: boolean, source: input, description: "Allowability attestation: consistent with institutional policy" }
      - { name: description, type: string, source: input, required: false, description: "Free-text memo" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | POSTED | DISALLOWED | TRANSFERRED_OUT" }
      - { name: disallow_reason, type: string, source: system, required: false, description: "Set when disallowed" }
      - { name: posted_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of the POSTED transition; basis for the 90-day transfer rule" }
      - { name: invoiced_receivable_id, type: string, source: system, required: false, description: "FK -> Receivable.id; set when this expenditure was billed on a cost-reimbursable invoice (prevents double-billing)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the creator" }

  - name: CostTransfer
    parent: null
    common_fields: true
    fields:
      - { name: source_expenditure_id, type: string, source: input, description: "FK -> Expenditure.id; must be POSTED, non-SALARY, non-cost-share" }
      - { name: target_award_id, type: string, source: input, description: "FK -> GrantAward.id; must differ from the source expenditure's award" }
      - { name: target_budget_line_id, type: string, source: input, description: "FK -> BudgetLine.id on the target award; category must match the source expenditure's line category" }
      - { name: justification, type: string, source: input, constraints: ">= 20 chars", description: "Reason for the transfer" }
      - { name: enhanced_justification, type: string, source: input, required: false, constraints: ">= 50 chars when required", description: "Required when the transfer is retroactive (> 90 days after posting)" }
      - { name: is_retroactive, type: boolean, source: computed, description: "Computed at submit: days_since_posting > 90" }
      - { name: days_since_posting, type: integer, source: computed, description: "Whole days between source posted_at and the logical clock at submit" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PENDING_COUNTERSIGN | APPROVED | DENIED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator" }
      - { name: submitted_by_user_id, type: string, source: system, required: false, description: "X-User-ID of submitter; approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, required: false, description: "X-User-ID of approving GrantsAccountant" }
      - { name: countersigned_by_user_id, type: string, source: system, required: false, description: "X-User-ID of countersigning SponsoredProgramsOfficer (retroactive only)" }
      - { name: deny_reason, type: string, source: system, required: false, description: "Set on denial" }

  - name: EffortCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_code, type: string, source: input, constraints: "globally unique", description: "e.g. 2026-H1" }
      - { name: period_start, type: datetime, source: input, description: "Cycle window start (inclusive); half-open [period_start, period_end)" }
      - { name: period_end, type: datetime, source: input, description: "Cycle window end (exclusive); must be > period_start" }
      - { name: cycle_months, type: integer, source: input, constraints: "1..12", description: "Denominator months for charged-effort percentage" }
      - { name: actual_fringe_rate_bps, type: integer, source: system, required: false, description: "Actual fringe rate published at cycle close; drives fringe_trueup_adjustment" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CERTIFYING | CLOSED" }

  - name: EffortStatement
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> EffortCycle.id" }
      - { name: person_id, type: string, source: system, description: "FK -> Person.id" }
      - { name: award_id, type: string, source: system, required: false, description: "FK -> GrantAward.id; null iff statement_kind == NON_SPONSORED" }
      - { name: statement_kind, type: enum, source: system, description: "AWARD | NON_SPONSORED (institutional catch-all: teaching/admin); one NON_SPONSORED per person per cycle" }
      - { name: committed_effort_pct, type: number, source: system, description: "Snapshot of EffortCommitment.committed_effort_pct at cycle open (version-pinned); 0.0 for NON_SPONSORED" }
      - { name: charged_effort_pct, type: number, source: computed, description: "From effort_charged_percentage; recomputed on every salary posting in the window; 0.0 for NON_SPONSORED" }
      - { name: certified_effort_pct, type: number, source: system, required: false, description: "Value attested by the certifier at certify" }
      - { name: variance_pp, type: number, source: computed, required: false, description: "= round2(certified_effort_pct - charged_effort_pct) at certify" }
      - { name: payroll_adjustment_note, type: string, source: system, required: false, description: "Required at certify when |variance_pp| > 5.00" }
      - { name: key_reduction_flag, type: boolean, source: computed, default: false, description: "True at certify when is_key_personnel and certified_effort_pct < 0.75 * committed_effort_pct" }
      - { name: status, type: enum, source: system, description: "PENDING | CERTIFIED | REOPENED | RECERTIFIED" }

  - name: Subaward
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> GrantAward.id (prime award)" }
      - { name: subrecipient_name, type: string, source: input, description: "Subrecipient institution name" }
      - { name: total_subaward_cents, type: integer, source: input, constraints: "> 0", description: "Subaward ceiling; cumulative invoiced (direct + sub F&A) may not exceed it" }
      - { name: risk_rating, type: enum, source: input, description: "LOW | MEDIUM | HIGH; HIGH requires audit_reference at invoice approval" }
      - { name: start_date, type: datetime, source: input, description: "Subaward period start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Subaward period end (inclusive); invoice periods use CLOSED intervals within it" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED" }
      - { name: invoiced_to_date_cents, type: integer, source: computed, default: 0, description: "Sum of (direct + sub F&A) over invoices in RECEIVED/UNDER_REVIEW/PAID/RETURNED_FOR_REVISION" }
      - { name: mtdc_consumed_cents, type: integer, source: computed, default: 0, description: "Cumulative direct amount applied against the 2,500,000-cent MTDC cap for this subaward" }

  - name: SubawardInvoice
    parent: null
    common_fields: true
    fields:
      - { name: subaward_id, type: string, source: input, description: "FK -> Subaward.id" }
      - { name: invoice_number, type: string, source: input, constraints: "unique within subaward", description: "Subrecipient invoice number" }
      - { name: period_start, type: datetime, source: input, description: "Invoice period start (inclusive); CLOSED interval semantics — sharing a boundary day is an overlap" }
      - { name: period_end, type: datetime, source: input, description: "Invoice period end (inclusive); must be >= period_start" }
      - { name: current_period_direct_cents, type: integer, source: input, constraints: ">= 0", description: "Direct costs billed this period" }
      - { name: current_period_f_and_a_cents, type: integer, source: input, constraints: ">= 0", description: "Subrecipient's own F&A billed this period" }
      - { name: cumulative_direct_cents, type: integer, source: computed, description: "Sum of direct over non-REJECTED invoices of this subaward with period_start <= this period_start (chronological by period_start, tie-break created_at ASC)" }
      - { name: mtdc_portion_cents, type: integer, source: computed, description: "= min(cumulative_direct, 2500000) - min(cumulative_direct - current_period_direct, 2500000); chronological per subaward" }
      - { name: audit_reference, type: string, source: input, required: false, description: "Audit/monitoring reference; required at approve when subaward risk_rating == HIGH" }
      - { name: return_reason, type: string, source: system, required: false, description: "Set on RETURNED_FOR_REVISION / REJECTED" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | PAID | REJECTED | RETURNED_FOR_REVISION" }
      - { name: prime_expenditure_id, type: string, source: system, required: false, description: "FK -> Expenditure.id; the SUBAWARD_PAYMENT mirror created on the prime award at approval" }

  - name: ReportRequirement
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> GrantAward.id" }
      - { name: report_type, type: enum, source: input, description: "ANNUAL_PROGRESS | TECHNICAL_QUARTERLY | MILESTONE | FINAL_TECHNICAL" }
      - { name: due_date, type: datetime, source: input, description: "Deadline; PENDING -> OVERDUE when logical clock passes it" }
      - { name: status, type: enum, source: system, description: "PENDING | OVERDUE | SUBMITTED | ACCEPTED" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of submission" }
      - { name: days_overdue, type: integer, source: computed, default: 0, description: "Whole days between due_date and logical clock; 0 while not overdue" }
      - { name: reject_reason, type: string, source: system, required: false, description: "Set when sponsor rejects a submission (returns to PENDING with revised due date)" }

  - name: DrawdownRequest
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> GrantAward.id; award.payment_method must be LETTER_OF_CREDIT" }
      - { name: amount_cents, type: integer, source: input, constraints: "> 0", description: "Requested draw amount; at submit must be <= available_draw_pool_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SETTLED | REJECTED_BY_SPONSOR | CANCELLED" }
      - { name: eligible_pool_at_submission, type: integer, source: system, required: false, description: "Snapshot of available pool at submit (audit)" }
      - { name: reject_reason, type: string, source: system, required: false, description: "Set on sponsor rejection" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of submission" }
      - { name: settled_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of settlement" }

  - name: Receivable
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> GrantAward.id; award.payment_method must be COST_REIMBURSABLE_INVOICE" }
      - { name: period_start, type: datetime, source: input, description: "Billing window start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Billing window end (inclusive)" }
      - { name: amount_cents, type: integer, source: computed, description: "Accrual-basis invoice amount from drawdown_eligible_pool (invoice variant); computed at creation" }
      - { name: invoice_date, type: datetime, source: system, description: "Logical-clock date at creation; aging measured from this" }
      - { name: days_outstanding, type: integer, source: computed, default: 0, description: "Whole days between invoice_date and logical clock" }
      - { name: aging_bucket, type: enum, source: computed, description: "CURRENT (<=30) | D31_60 (31-60) | D61_90 (61-90) | D91_120 (91-120) | OVER_120 (>=121)" }
      - { name: accrued_interest_cents, type: integer, source: computed, default: 0, description: "Late interest per late_interest_accrual; frozen while DISPUTED" }
      - { name: disputed_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp when the current/last dispute opened" }
      - { name: total_disputed_days, type: integer, source: system, default: 0, description: "Cumulative whole days spent in DISPUTED; subtracted from interest-bearing days" }
      - { name: interest_paid_cents, type: integer, source: system, default: 0, description: "Cumulative interest satisfied by payments (waterfall: interest before principal)" }
      - { name: principal_paid_cents, type: integer, source: system, default: 0, description: "Cumulative principal satisfied by payments" }
      - { name: outstanding_total_cents, type: integer, source: computed, description: "= amount_cents + accrued_interest_cents - interest_paid_cents - principal_paid_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIALLY_PAID | PAID | DISPUTED" }
      - { name: dispute_reason, type: string, source: system, required: false, description: "Set while DISPUTED" }

  - name: ModificationRequest
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> GrantAward.id" }
      - { name: mod_type, type: enum, source: input, description: "NO_COST_EXTENSION | REBUDGET" }
      - { name: extension_months, type: integer, source: input, required: false, constraints: "1..12", description: "Required iff NO_COST_EXTENSION; months added to current_end_date" }
      - { name: rebudget_lines, type: array, source: input, required: false, description: "Required iff REBUDGET: [{budget_line_id, new_authorized_cents}]; F_AND_A lines forbidden" }
      - { name: justification, type: string, source: input, constraints: ">= 20 chars", description: "Request justification" }
      - { name: requires_sponsor, type: boolean, source: computed, description: "Per rebudget_significance_test (REBUDGET) or nce_count >= 1 (NCE); routes internal-approve to SPONSOR_REVIEW when true" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SPONSOR_REVIEW | APPROVED | DENIED | WITHDRAWN" }
      - { name: sponsor_decision_reason, type: string, source: system, required: false, description: "Set on sponsor decision" }

  - name: FinalFinancialReport
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> GrantAward.id; exactly one per award, auto-created by initiate-closeout" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | RETURNED" }
      - { name: unliquidated_obligations_cents, type: integer, source: input, description: "Declared at submit; must be 0 (all obligations liquidated before final report)" }
      - { name: total_expenditures_cents, type: integer, source: computed, required: false, description: "Snapshot at submit = award.total_direct_spent_cents + award.f_and_a_accrued_cents" }
      - { name: cost_share_shortfall_cents, type: integer, source: computed, default: 0, description: "= max(0, cost_share_committed_cents - cost_share_met_cents) at submit" }
      - { name: residual_cents, type: integer, source: computed, required: false, description: "= total_obligated_cents - cumulative_drawn_cents at submit (before shortfall reduction of the pool)" }
      - { name: return_reason, type: string, source: system, required: false, description: "Set when sponsor returns the report" }

# =============================================================================
# §1.2 State Machine Table
# GrantAward carries TWO parallel dimensions: status (lifecycle machine below)
# and posture (derived: OPEN | RESTRICTED | FROZEN — see award_posture_derivation).
# =============================================================================
state_machines:
  - entity: GrantAward
    initial_state: PENDING_SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_SETUP
        to: ACTIVE
        trigger: "POST /api/awards/{id}/activate"
        actor: SponsoredProgramsOfficer
        preconditions:
          - "Sum of authorized_cents over ALL budget lines (incl. computed F_AND_A line) == total_obligated_cents exactly (ERR_BUDGET_NOT_FULLY_ALLOCATED)"
          - "At least one non-F_AND_A budget line exists (ERR_INVALID_REQUEST)"
        side_effects:
          - "baseline_authorized_cents := authorized_cents on every budget line (sponsor-approved baseline snapshot)"
          - "posture recomputed (OPEN on a fresh activation)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/awards/{id}/suspend"
        actor: SponsorOfficial
        preconditions: []
        side_effects:
          - "All financial writes on the award become blocked by state validation (expenditure create/post, drawdown create/submit, transfer approve, invoice approve, modification submit)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/awards/{id}/reinstate"
        actor: SponsorOfficial
        preconditions: []
        side_effects: ["posture recomputed"]

      - from: ACTIVE
        to: CLOSEOUT_PENDING
        trigger: "POST /api/awards/{id}/initiate-closeout"
        actor: GrantsAccountant
        preconditions:
          - "logical clock >= current_end_date (ERR_CLOSEOUT_TOO_EARLY)"
        side_effects:
          - "System creates the award's FinalFinancialReport (status DRAFT) — discoverable via GET /api/final-financial-reports?award_id"
          - "posture recomputed (FFR lateness now gates posture)"

      - from: CLOSEOUT_PENDING
        to: ACTIVE
        trigger: "POST /api/awards/{id}/reopen"
        actor: SponsorOfficial
        preconditions: []
        side_effects:
          - "The DRAFT/RETURNED FinalFinancialReport is deleted; a later initiate-closeout creates a fresh one"
          - "posture recomputed"

      - from: CLOSEOUT_PENDING
        to: CLOSED
        trigger: "POST /api/awards/{id}/close"
        actor: GrantsAccountant
        preconditions:
          - "FinalFinancialReport.status == ACCEPTED (ERR_CLOSEOUT_INCOMPLETE)"
          - "No Receivable with status in {OPEN, PARTIALLY_PAID, DISPUTED} (ERR_CLOSEOUT_INCOMPLETE)"
          - "No DrawdownRequest with status in {DRAFT, SUBMITTED} (ERR_CLOSEOUT_INCOMPLETE)"
          - "No SubawardInvoice with status in {RECEIVED, UNDER_REVIEW} (ERR_CLOSEOUT_INCOMPLETE)"
          - "All ReportRequirement rows for the award have status ACCEPTED (ERR_CLOSEOUT_INCOMPLETE)"
        side_effects:
          - "residual_deobligated_cents := total_obligated_cents - cumulative_drawn_cents; total_obligated_cents := cumulative_drawn_cents (residual deobligation)"

  - entity: Expenditure
    initial_state: PENDING_REVIEW
    terminal_states: [TRANSFERRED_OUT]
    transitions:
      - from: PENDING_REVIEW
        to: POSTED
        trigger: "POST /api/expenditures/{id}/post"
        actor: GrantsAccountant
        preconditions:
          - "award.status == ACTIVE (ERR_AWARD_NOT_ACTIVE)"
          - "award.posture != FROZEN (ERR_AWARD_FROZEN)"
          - "is_allocable AND is_reasonable AND is_consistent (ERR_ALLOWABILITY_INCOMPLETE)"
          - "transaction_date within [award.project_start_date, award.current_end_date] (ERR_OUTSIDE_PERIOD_OF_PERFORMANCE)"
          - "SALARY: person has an EffortCommitment on the award (ERR_SALARY_NO_COMMITMENT)"
          - "Line sufficiency, in pinned order: PERSONNEL_SALARIES line fits amount_cents, then FRINGE_BENEFITS line fits fringe_cents (ERR_BUDGET_LINE_EXCEEDED); non-salary: line.spent_cents + amount_cents <= authorized_cents (cost-share expenditures skip line checks)"
        side_effects:
          - "posted_at := logical clock"
          - "Non-cost-share: budget_line.spent_cents += amount_cents (link 1 of ledger cascade); SALARY additionally: FRINGE_BENEFITS line spent_cents += fringe_cents (per-line rounding; when fringe_cents == 0 this debit is a no-op and no FRINGE_BENEFITS line need exist)"
          - "Cascade link 2: award.mtdc_spent_cents, total_direct_spent_cents, f_and_a_accrued_cents recomputed"
          - "Cascade link 3: award.available_draw_pool_cents recomputed (LOC awards)"
          - "Cascade link 4: for SALARY, EffortStatement rows (person, award, cycle whose window covers transaction_date, status != CLOSED cycle) recompute charged_effort_pct, then variance_pp/key flags on next certify"
          - "Cost-share: award.cost_share_met_cents += amount_cents instead of line spend; SALARY over_cap_cents always += award.cost_share_met_cents"
      - from: PENDING_REVIEW
        to: DISALLOWED
        trigger: "POST /api/expenditures/{id}/disallow"
        actor: GrantsAccountant
        preconditions: []
        side_effects: ["disallow_reason set"]
      - from: DISALLOWED
        to: PENDING_REVIEW
        trigger: "POST /api/expenditures/{id}/resubmit"
        actor: GrantCoordinator
        preconditions: []
        side_effects: ["disallow_reason cleared"]
      - from: POSTED
        to: TRANSFERRED_OUT
        trigger: "system (an approving CostTransfer naming this expenditure as source)"
        actor: system
        preconditions: []
        side_effects:
          - "Source budget line spent_cents -= amount_cents (compensating credit); award totals recomputed"

  - entity: CostTransfer
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/cost-transfers/{id}/submit"
        actor: GrantCoordinator | GrantsAccountant
        preconditions:
          - "is_retroactive computed now: days_since_posting > 90 => enhanced_justification required (>= 50 chars, ERR_ENHANCED_JUSTIFICATION_REQUIRED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID; is_retroactive and days_since_posting frozen at this moment"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/cost-transfers/{id}/approve (is_retroactive == false)"
        actor: GrantsAccountant
        preconditions:
          - "actor X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "target award posture != FROZEN (ERR_AWARD_FROZEN)"
          - "target award status in {ACTIVE, CLOSEOUT_PENDING} (ERR_AWARD_NOT_ACTIVE)"
          - "target line fits: spent_cents + amount <= authorized_cents (ERR_BUDGET_LINE_EXCEEDED)"
        side_effects: ["APPLY_EFFECTS (see approve_common)"]
      - from: SUBMITTED
        to: PENDING_COUNTERSIGN
        trigger: "POST /api/cost-transfers/{id}/approve (is_retroactive == true)"
        actor: GrantsAccountant
        preconditions: ["same as SUBMITTED -> APPROVED"]
        side_effects: ["approved_by_user_id set; no ledger effects yet"]
      - from: PENDING_COUNTERSIGN
        to: APPROVED
        trigger: "POST /api/cost-transfers/{id}/countersign"
        actor: SponsoredProgramsOfficer
        preconditions:
          - "target award posture != FROZEN (ERR_AWARD_FROZEN)"
          - "target line still fits (ERR_BUDGET_LINE_EXCEEDED)"
        side_effects: ["APPLY_EFFECTS (see approve_common)"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/cost-transfers/{id}/deny"
        actor: GrantsAccountant | SponsoredProgramsOfficer
        preconditions: []
        side_effects: ["deny_reason set"]
      - from: PENDING_COUNTERSIGN
        to: DENIED
        trigger: "POST /api/cost-transfers/{id}/deny"
        actor: GrantsAccountant | SponsoredProgramsOfficer
        preconditions: []
        side_effects: ["deny_reason set"]
      - from: DENIED
        to: DRAFT
        trigger: "POST /api/cost-transfers/{id}/revise"
        actor: GrantCoordinator | GrantsAccountant
        preconditions: []
        side_effects: ["deny_reason cleared; justification may be replaced"]
    note: |
      approve_common (APPLY_EFFECTS): (1) source expenditure -> TRANSFERRED_OUT and its line is credited;
      (2) system creates a mirror Expenditure on the target award: amount_cents equal, status POSTED,
      transferred_from_id = source id, same expenditure_type/category, cash_disbursed copied, transaction_date
      copied, posted_at := now; (3) target line debited; (4) BOTH awards recompute mtdc/f_and_a/pools
      (ledger sync); (5) money conservation invariant holds (see cost_transfer_money_conservation).

  - entity: EffortCycle
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: CERTIFYING
        trigger: "POST /api/effort-cycles/{id}/open"
        actor: GrantsAccountant
        preconditions:
          - "logical clock >= period_start (ERR_CYCLE_NOT_YET_OPENABLE)"
          - "No other EffortCycle with status CERTIFYING exists (ERR_CYCLE_ALREADY_CERTIFYING)"
        side_effects:
          - "Fan-out: for every Person with >= 1 EffortCommitment on an award whose [project_start_date, current_end_date] overlaps the cycle window, create one AWARD EffortStatement per commitment (committed_effort_pct snapshot; charged_effort_pct computed) plus exactly one NON_SPONSORED statement per person (charged 0.0, committed 0.0)"
      - from: CERTIFYING
        to: CLOSED
        trigger: "POST /api/effort-cycles/{id}/close"
        actor: GrantsAccountant
        preconditions:
          - "Every generated EffortStatement has status in {CERTIFIED, RECERTIFIED} (ERR_CYCLE_HAS_UNCERTIFIED_STATEMENTS)"
          - "Per person: sum of certified_effort_pct over all their statements == 100.00 exactly (ERR_EFFORT_TOTAL_NOT_100)"
        side_effects:
          - "actual_fringe_rate_bps := input; fringe_trueup_adjustment runs per award touched by the cycle (adjustment posted to each award's FRINGE_BENEFITS line)"

  - entity: EffortStatement
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /api/effort-statements/{id}/certify"
        actor: PrincipalInvestigator | ResearchStaff
        preconditions:
          - "X-User-ID == statement.person_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "cycle.status == CERTIFYING (ERR_STATEMENT_NOT_CERTIFIABLE)"
          - "expected_effort_statement_version == statement.version (ERR_STALE_STATEMENT_VERSION)"
          - "0.00 <= certified_effort_pct <= 100.00 (ERR_INVALID_REQUEST)"
          - "|certified - charged| > 5.00 requires payroll_adjustment_note >= 20 chars (ERR_VARIANCE_NOTE_REQUIRED)"
        side_effects:
          - "variance_pp := round2(certified - charged); key_reduction_flag computed; version += 1"
      - from: REOPENED
        to: RECERTIFIED
        trigger: "POST /api/effort-statements/{id}/certify"
        actor: PrincipalInvestigator | ResearchStaff
        preconditions: ["same as PENDING -> CERTIFIED"]
        side_effects: ["same as PENDING -> CERTIFIED"]
      - from: CERTIFIED
        to: REOPENED
        trigger: "POST /api/effort-statements/{id}/reopen"
        actor: GrantsAccountant
        preconditions:
          - "cycle.status == CERTIFYING (ERR_STATEMENT_NOT_CERTIFIABLE)"
        side_effects:
          - "charged_effort_pct recomputed (payroll adjustments landed since certification); certified_effort_pct/variance_pp cleared; version += 1"

  - entity: Subaward
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/subawards/{id}/activate"
        actor: SponsoredProgramsOfficer
        preconditions:
          - "prime award.status == ACTIVE (ERR_AWARD_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/subawards/{id}/close"
        actor: SponsoredProgramsOfficer
        preconditions:
          - "No invoices in {RECEIVED, UNDER_REVIEW} (ERR_INVOICE_NOT_REVIEWABLE)"
        side_effects: []

  - entity: SubawardInvoice
    initial_state: RECEIVED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /api/subaward-invoices/{id}/begin-review"
        actor: SponsoredProgramsOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: PAID
        trigger: "POST /api/subaward-invoices/{id}/approve"
        actor: SponsoredProgramsOfficer
        preconditions:
          - "subaward.status == ACTIVE (ERR_SUBAWARD_NOT_ACTIVE)"
          - "prime award.status == ACTIVE and posture != FROZEN (ERR_AWARD_NOT_ACTIVE / ERR_AWARD_FROZEN)"
          - "subaward.risk_rating == HIGH requires audit_reference present (ERR_AUDIT_REFERENCE_REQUIRED)"
          - "prime SUBAWARDS line fits: spent + (direct + sub F&A) <= authorized (ERR_BUDGET_LINE_EXCEEDED)"
        side_effects:
          - "System creates prime Expenditure: type SUBAWARD_PAYMENT, amount = direct + sub F&A, mtdc_eligible = invoice.mtdc_portion_cents, status POSTED, cash_disbursed = true (link 1)"
          - "Cascade link 2+: prime award SUBAWARDS line debited; mtdc/f_and_a/pools recomputed on the prime award"
          - "subaward.invoiced_to_date_cents and mtdc_consumed_cents updated; prime_expenditure_id set"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/subaward-invoices/{id}/reject"
        actor: SponsoredProgramsOfficer
        preconditions: []
        side_effects: ["return_reason set; invoice excluded from cumulative/overlap checks"]
      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /api/subaward-invoices/{id}/return-for-revision"
        actor: SponsoredProgramsOfficer
        preconditions: []
        side_effects: ["return_reason set"]
      - from: RETURNED_FOR_REVISION
        to: UNDER_REVIEW
        trigger: "POST /api/subaward-invoices/{id}/resubmit"
        actor: GrantCoordinator
        preconditions:
          - "Revised period must not overlap other non-REJECTED invoices (ERR_INVOICE_PERIOD_OVERLAP)"
          - "Revised cumulative must not exceed subaward total (ERR_SUBAWARD_BUDGET_EXCEEDED)"
        side_effects: ["cumulative_direct_cents and mtdc_portion_cents recomputed from revised amounts"]

  - entity: ReportRequirement
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: OVERDUE
        trigger: "system (logical clock passes due_date; evaluated on every /api/_clock/set_current_utc)"
        actor: system
        preconditions: []
        side_effects:
          - "days_overdue recomputed (link 1 of overdue cascade)"
          - "Cascade link 2: award.posture recomputed (RESTRICTED; FROZEN when FINAL_TECHNICAL days_overdue > 30)"
          - "Cascade link 3: on entering FROZEN, every DrawdownRequest in {DRAFT, SUBMITTED} -> CANCELLED and its reservation released"
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /api/report-requirements/{id}/submit"
        actor: PrincipalInvestigator | GrantCoordinator
        preconditions: ["PI actor: X-User-ID == award.pi_id (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: ["submitted_at set; posture recomputed (OVERDUE cleared)"]
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /api/report-requirements/{id}/submit"
        actor: PrincipalInvestigator | GrantCoordinator
        preconditions: ["PI actor: X-User-ID == award.pi_id (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: ["submitted_at set; posture recomputed"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/report-requirements/{id}/accept"
        actor: SponsorOfficial
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: PENDING
        trigger: "POST /api/report-requirements/{id}/reject"
        actor: SponsorOfficial
        preconditions: []
        side_effects: ["due_date := revised_due_date input; reject_reason set; posture recomputed"]

  - entity: DrawdownRequest
    initial_state: DRAFT
    terminal_states: [SETTLED, REJECTED_BY_SPONSOR, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/drawdown-requests/{id}/submit"
        actor: GrantsAccountant
        preconditions:
          - "award.status in {ACTIVE, CLOSEOUT_PENDING} (ERR_AWARD_NOT_ACTIVE)"
          - "award.posture == OPEN (ERR_AWARD_RESTRICTED / ERR_AWARD_FROZEN)"
          - "amount_cents <= award.available_draw_pool_cents (ERR_DRAWDOWN_EXCEEDS_ELIGIBLE)"
        side_effects:
          - "award.reserved_draw_cents += amount_cents; available_draw_pool_cents -= amount_cents (reservation); eligible_pool_at_submission snapshot"
      - from: SUBMITTED
        to: SETTLED
        trigger: "POST /api/drawdown-requests/{id}/settle"
        actor: SponsorOfficial
        preconditions: []
        side_effects:
          - "award.reserved_draw_cents -= amount; award.cumulative_drawn_cents += amount (pool conservation invariant holds)"
      - from: SUBMITTED
        to: REJECTED_BY_SPONSOR
        trigger: "POST /api/drawdown-requests/{id}/reject"
        actor: SponsorOfficial
        preconditions: []
        side_effects: ["reservation released: reserved -= amount, available += amount; reject_reason set"]
      - from: DRAFT
        to: CANCELLED
        trigger: "system (award posture enters FROZEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (award posture enters FROZEN)"
        actor: system
        preconditions: []
        side_effects: ["reservation released: reserved -= amount, available += amount"]

  - entity: Receivable
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "POST /api/receivables/{id}/payments (payment < outstanding_total_cents)"
        actor: GrantsAccountant
        preconditions: ["amount_cents <= outstanding_total_cents (ERR_RECEIVABLE_OVERPAYMENT)"]
        side_effects: ["Waterfall: payment satisfies accrued interest first, then principal; award.cumulative_drawn_cents += principal portion"]
      - from: OPEN
        to: PAID
        trigger: "POST /api/receivables/{id}/payments (payment == outstanding_total_cents)"
        actor: GrantsAccountant
        preconditions: ["amount_cents <= outstanding_total_cents (ERR_RECEIVABLE_OVERPAYMENT)"]
        side_effects: ["same waterfall; outstanding_total_cents becomes 0"]
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /api/receivables/{id}/payments (payment < remaining outstanding)"
        actor: GrantsAccountant
        preconditions: ["amount_cents <= outstanding_total_cents (ERR_RECEIVABLE_OVERPAYMENT)"]
        side_effects: ["same waterfall"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /api/receivables/{id}/payments (payment == remaining outstanding)"
        actor: GrantsAccountant
        preconditions: ["amount_cents <= outstanding_total_cents (ERR_RECEIVABLE_OVERPAYMENT)"]
        side_effects: ["same waterfall"]
      - from: OPEN
        to: DISPUTED
        trigger: "POST /api/receivables/{id}/dispute"
        actor: GrantsAccountant
        preconditions: []
        side_effects: ["dispute_reason set; interest accrual pauses while DISPUTED"]
      - from: DISPUTED
        to: OPEN
        trigger: "POST /api/receivables/{id}/resolve-dispute"
        actor: GrantsAccountant
        preconditions: []
        side_effects: ["interest accrual resumes; dispute period days do not accrue"]

  - entity: ModificationRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/modification-requests/{id}/submit"
        actor: GrantCoordinator
        preconditions:
          - "award.status == ACTIVE (ERR_AWARD_NOT_ACTIVE)"
          - "NCE: logical clock < award.current_end_date (ERR_NCE_AFTER_END_DATE)"
          - "REBUDGET: grand-total invariant — sum of new authorized over all direct lines + recomputed F_AND_A == total_obligated_cents (ERR_REBUDGET_NOT_ZERO_SUM); SUBAWARDS line new authorized >= its mtdc_eligible_cents (ERR_MTDC_ELIGIBLE_EXCEEDS_AUTHORIZED)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/modification-requests/{id}/internal-approve (requires_sponsor == false; grantee authority)"
        actor: SponsoredProgramsOfficer
        preconditions: []
        side_effects: ["APPLY_EFFECTS (see modification note)"]
      - from: SUBMITTED
        to: SPONSOR_REVIEW
        trigger: "POST /api/modification-requests/{id}/internal-approve (requires_sponsor == true)"
        actor: SponsoredProgramsOfficer
        preconditions: []
        side_effects: []
      - from: SPONSOR_REVIEW
        to: APPROVED
        trigger: "POST /api/modification-requests/{id}/sponsor-decision (decision = APPROVE)"
        actor: SponsorOfficial
        preconditions: []
        side_effects: ["APPLY_EFFECTS (see modification note)"]
      - from: SPONSOR_REVIEW
        to: DENIED
        trigger: "POST /api/modification-requests/{id}/sponsor-decision (decision = DENY)"
        actor: SponsorOfficial
        preconditions: []
        side_effects: ["sponsor_decision_reason set"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/modification-requests/{id}/withdraw"
        actor: GrantCoordinator
        preconditions: []
        side_effects: []
    note: |
      APPLY_EFFECTS — NO_COST_EXTENSION: current_end_date += extension_months (calendar months, day clamped
      to month end); nce_count += 1; due_date of every non-terminal ReportRequirement with report_type
      FINAL_TECHNICAL is shifted by the same extension; award.version += 1.
      APPLY_EFFECTS — REBUDGET: each listed line's authorized_cents := new value; F_AND_A line authorized
      recomputed per f_and_a_accrual over authorized bases; when approval came via sponsor-decision,
      baseline_authorized_cents := authorized_cents on every line; award.version += 1.

  - entity: FinalFinancialReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/final-financial-reports/{id}/submit"
        actor: GrantsAccountant
        preconditions:
          - "award.status == CLOSEOUT_PENDING (ERR_AWARD_NOT_IN_CLOSEOUT)"
          - "unliquidated_obligations_cents == 0 (ERR_UNLIQUIDATED_OBLIGATIONS)"
          - "No SubawardInvoice in {RECEIVED, UNDER_REVIEW} for the award (ERR_CLOSEOUT_INCOMPLETE)"
          - "No DrawdownRequest in {DRAFT, SUBMITTED} for the award (ERR_CLOSEOUT_INCOMPLETE)"
        side_effects:
          - "total_expenditures_cents, residual_cents, cost_share_shortfall_cents snapshots computed"
          - "LOC awards: available_draw_pool_cents reduced by cost_share_shortfall_cents (final payment adjustment)"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/final-financial-reports/{id}/submit"
        actor: GrantsAccountant
        preconditions: ["same as DRAFT -> SUBMITTED"]
        side_effects: ["same as DRAFT -> SUBMITTED"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/final-financial-reports/{id}/accept"
        actor: SponsorOfficial
        preconditions: []
        side_effects: ["posture recomputed (FFR no longer outstanding)"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /api/final-financial-reports/{id}/return"
        actor: SponsorOfficial
        preconditions: []
        side_effects: ["return_reason set"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: drawdown-create-stale-award
    parent_entity: GrantAward
    write_endpoint: "POST /api/drawdown-requests"
    occ_field: expected_award_version
    description: |
      Creating a DrawdownRequest against a GrantAward whose version has advanced since the client
      last read it is rejected: the eligible-pool computation the client priced its amount against
      may be stale (another draw creation, an expenditure post, or a rebudget may have shifted it).
    error_id: ERR_STALE_AWARD_VERSION
    http_status: 412
  - rule_id: modification-create-stale-award
    parent_entity: GrantAward
    write_endpoint: "POST /api/modification-requests"
    occ_field: expected_award_version
    description: |
      Creating a ModificationRequest against a GrantAward whose version has advanced since the client
      last read it is rejected: rebudget line sets and NCE math are computed against the baselines
      and current_end_date the client observed, and an intervening approved modification may have
      replaced them.
    error_id: ERR_STALE_AWARD_VERSION
    http_status: 412
  - rule_id: effort-certify-stale-statement
    parent_entity: EffortStatement
    write_endpoint: "POST /api/effort-statements/{id}/certify"
    occ_field: expected_effort_statement_version
    description: |
      Certifying an EffortStatement whose version has advanced since the certifier last read it is
      rejected: a payroll posting in the cycle window silently recomputes charged_effort_pct (and
      bumps version), so the certifier would otherwise attest against a charged figure they never saw.
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Global precision: integer cents, round_half_up, unless a rule says otherwise.
# Percentages: 2 decimal places, round_half_up.
# =============================================================================
calculations:
  - name: salary_charge_with_cap
    trigger: "POST /api/expenditures with expenditure_type == SALARY (amount computed at creation; inputs amount_cents ignored)"
    algorithm: tiered_pricing
    formula: |
      ibs_monthly    = round_half_up(person.institutional_base_salary_annual_cents / person.appointment_months)
      if award.salary_cap_annual_cents is null:
        billable_monthly = ibs_monthly
      else:
        cap_monthly      = round_half_up(award.salary_cap_annual_cents / 12)     # cap is always a 12-month-equivalent rate
        billable_monthly = min(ibs_monthly, cap_monthly)
      amount_cents   = round_half_up(billable_monthly * effort_pct/100 * period_months)
      over_cap_cents = round_half_up((ibs_monthly - billable_monthly) * effort_pct/100 * period_months)   # 0 when uncapped
      mtdc_eligible_cents = amount_cents
    input_set: "Person (IBS, appointment_months) x GrantAward (pinned salary_cap) x request (effort_pct, period_months)"
    precision: "integer cents, round_half_up at each pinned step (monthly rates first, then products)"
    variants:
      - name: capped_federal
        when: "award.salary_cap_annual_cents is not null AND ibs_monthly > cap_monthly"
        difference: "charge capped at cap_monthly; the excess is over_cap_cents — institutional cost share, never chargeable to this award"
      - name: uncapped
        when: "no sponsor cap OR ibs_monthly <= cap_monthly"
        difference: "full IBS monthly rate is billable; over_cap_cents == 0"

  - name: fringe_benefit_charge
    trigger: "expenditure post (PENDING_REVIEW -> POSTED) for SALARY expenditures"
    algorithm: aggregation
    formula: |
      fringe_cents = round_half_up(amount_cents * award.fringe_rate_bps / 10000)   # PROVISIONAL rate pinned on the award
      PINNED ROUNDING ORDER: fringe is rounded PER EXPENDITURE LINE first; the FRINGE_BENEFITS
      line total is the SUM of per-line rounded values. Summing salary first and rounding once
      (aggregate order) is a different, incorrect algorithm and yields different cents.
    input_set: "the single salary expenditure being posted"
    precision: "integer cents, round_half_up, per line"
    variants:
      - name: provisional
        when: "at post time, before the covering EffortCycle is closed"
        difference: "uses award.fringe_rate_bps (provisional)"
      - name: actual
        when: "cycle close publishes actual_fringe_rate_bps"
        difference: "see fringe_trueup_adjustment — the delta between actual and provisional is reconciled per award"

  - name: fringe_trueup_adjustment
    trigger: "POST /api/effort-cycles/{id}/close"
    algorithm: aggregation
    formula: |
      For each award A touched by the cycle (has >= 1 POSTED SALARY expenditure with
      transaction_date in [period_start, period_end)):
        base_cents = sum(amount_cents of those salary expenditures on A)
        adjustment_cents = round_half_up(base_cents * (cycle.actual_fringe_rate_bps - A.fringe_rate_bps) / 10000)
        if adjustment_cents != 0: A's FRINGE_BENEFITS line spent_cents += adjustment_cents
          (line-sufficiency is NOT re-validated for true-up deltas; they are rate reconciliations)
    input_set: "POSTED, non-TRANSFERRED_OUT SALARY expenditures per award, transaction_date in half-open cycle window"
    precision: "integer cents, round_half_up, per award"

  - name: mtdc_base_aggregation
    trigger: "any expenditure post or transfer-out/transfer-in affecting an award"
    algorithm: aggregation
    formula: |
      award.mtdc_spent_cents = sum(e.mtdc_eligible_cents) over expenditures e of the award
        where e.status == POSTED and e.is_cost_share == false
      (TRANSFERRED_OUT source entries excluded; mirror entries included with their own mtdc_eligible_cents)
      award.total_direct_spent_cents = sum(e.amount_cents) over the same set
    input_set: "expenditures of one award, status POSTED, is_cost_share false"
    precision: "integer cents (exact sum)"

  - name: f_and_a_accrual
    trigger: "immediately after every mtdc_spent_cents change; also at budget-line load and approved rebudget (over authorized bases)"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (budget load / rebudget over AUTHORIZED amounts):
        1. directs_authorized = sum(authorized_cents) over lines with category != F_AND_A
        2. mtdc_authorized    = directs_authorized
                                - authorized of EQUIPMENT lines
                                - authorized of PARTICIPANT_SUPPORT lines
                                - authorized of SUBAWARDS lines
                                + sum(mtdc_eligible_cents of SUBAWARDS lines)
        3. f_and_a_authorized = round_half_up(award.f_and_a_rate_bps/10000 * mtdc_authorized)
        4. F_AND_A line.authorized_cents := f_and_a_authorized (system line; user input forbidden)
        5. grand_total = directs_authorized + f_and_a_authorized  (activation/rebudget compare vs total_obligated_cents)
      ACCRUED variant (over SPENT amounts): award.f_and_a_accrued_cents =
        round_half_up(award.f_and_a_rate_bps/10000 * award.mtdc_spent_cents)
    input_set: "budget lines of the award (authorized variant) or mtdc_spent_cents (accrued variant)"
    precision: "integer cents, round_half_up"

  - name: budget_load_ceiling_check
    trigger: "POST /api/awards/{id}/activate and modification APPLY_EFFECTS for REBUDGET"
    algorithm: constraint_propagation
    formula: |
      Activation gate: grand_total (per f_and_a_accrual authorized variant) == total_obligated_cents EXACTLY.
      One cent under or over fails with ERR_BUDGET_NOT_FULLY_ALLOCATED.
      Rebudget gate: after applying new_authorized_cents to the listed direct lines, recomputed grand_total
      must == total_obligated_cents (ERR_REBUDGET_NOT_ZERO_SUM). Because F&A moves with MTDC, moving m cents
      INTO a non-MTDC category (EQUIPMENT) from MTDC-bearing lines requires a compensating +m/3 net boost of
      other MTDC-bearing lines when rate = 5000 bps: grand_total = directs + r*MTDC, so d(directs) + r*d(MTDC) = 0.
    input_set: "all budget lines of the award"
    precision: "integer cents"

  - name: drawdown_eligible_pool
    trigger: "recomputed on every expenditure post/transfer affecting the award and on every drawdown submit/settle/reject/cancel"
    algorithm: aggregation
    formula: |
      available = eligible_pool - cumulative_drawn_cents - reserved_draw_cents
      where the two variants compute eligible_pool differently over the SAME award data:
      LOC (cash basis):   eligible_pool = D_cash + round_half_up(rate_bps/10000 * MTDC_cash)
      INVOICE (accrual):  invoice amount = D_window + round_half_up(rate_bps/10000 * MTDC_window)
    input_set: "POSTED, non-cost-share expenditures of the award (see variants for filters)"
    precision: "integer cents, round_half_up"
    variants:
      - name: loc_cash_basis
        when: "award.payment_method == LETTER_OF_CREDIT"
        difference: "D_cash = sum(amount_cents) over expenditures with cash_disbursed == true; MTDC_cash = sum(mtdc_eligible_cents) over the same set. Undisbursed costs are NOT drawable."
      - name: invoice_accrual_basis
        when: "award.payment_method == COST_REIMBURSABLE_INVOICE; computed at POST /api/receivables"
        difference: "D_window = sum(amount_cents) over expenditures with transaction_date in [period_start, period_end] (closed) and invoiced_receivable_id null — REGARDLESS of cash_disbursed; MTDC_window likewise; result stamped as Receivable.amount_cents and each included expenditure's invoiced_receivable_id set."

  - name: receivable_aging_buckets
    trigger: "on every read of a Receivable and on /api/_clock/set_current_utc"
    algorithm: chronological
    formula: |
      days_outstanding = whole_days(invoice_date -> logical clock)   # 0 while clock <= invoice_date... (>= 0 by construction)
      aging_bucket = CURRENT     if days_outstanding <= 30
                     D31_60      if 31 <= days_outstanding <= 60
                     D61_90      if 61 <= days_outstanding <= 90
                     D91_120     if 91 <= days_outstanding <= 120
                     OVER_120    if days_outstanding >= 121
      Boundary pins: day 30 is CURRENT, day 31 is D31_60, day 60 is D31_60, day 61 is D61_90.
    input_set: "single receivable vs logical clock"
    precision: "whole days"

  - name: late_interest_accrual
    trigger: "on every read of a Receivable and on /api/_clock/set_current_utc"
    algorithm: decay_function
    formula: |
      if status == DISPUTED: accrual paused (accrued_interest frozen at value when dispute opened; dispute days never accrue)
      billable_days = max(0, days_outstanding - 60 - total_disputed_days)   # 60-day grace; exactly 60 => 0, day 61 => 1 day; disputed days excluded
      while DISPUTED: accrued_interest_cents stays frozen at the value computed when the dispute opened
      accrued_interest_cents = round_half_up((amount_cents - principal_paid_cents)
                                             * sponsor.late_payment_apr_bps / 10000 / 365 * billable_days)
      PINNED ROUNDING: computed PER RECEIVABLE and rounded once to cents; an aging report sums the
      per-receivable rounded values (never rounds the fleet total).
    constants:
      GRACE_DAYS: 60
      DAYS_PER_YEAR: 365
    input_set: "single receivable + its award's sponsor late_payment_apr_bps"
    precision: "integer cents, round_half_up, per receivable"

  - name: receivable_payment_waterfall
    trigger: "POST /api/receivables/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      outstanding = amount_cents + accrued_interest_cents - interest_paid_cents - principal_paid_cents
      if payment > outstanding: reject ERR_RECEIVABLE_OVERPAYMENT
      interest_part  = min(payment, accrued_interest_cents - interest_paid_cents)
      principal_part = payment - interest_part
      interest_paid_cents += interest_part; principal_paid_cents += principal_part
      award.cumulative_drawn_cents += principal_part
      status := PAID when outstanding_total_cents == 0 else PARTIALLY_PAID
    input_set: "single receivable + payment amount_cents"
    precision: "integer cents (exact)"

  - name: rebudget_significance_test
    trigger: "POST /api/modification-requests with mod_type == REBUDGET (computes requires_sponsor at creation)"
    algorithm: threshold
    formula: |
      For every line whose authorized would change (listed line new != current):
        baseline = line.baseline_authorized_cents
        significant(line) = (baseline > 0  AND abs(new - baseline) * 100 > 25 * baseline)    # EXACTLY 25% is NOT significant
                         OR (baseline == 0 AND new > 0)
      requires_sponsor = any(significant(line))
                      OR any listed EQUIPMENT line with new > current          # any net increase into EQUIPMENT
                      OR any listed PARTICIPANT_SUPPORT line with new < current # any net decrease out of PARTICIPANT_SUPPORT
    constants:
      SIGNIFICANCE_PCT: 25
    input_set: "rebudget_lines vs current line values and sponsor-approved baselines"
    precision: "integer cents; comparison in exact integer arithmetic (abs(new-baseline)*100 > 25*baseline)"

  - name: subaward_mtdc_cap_portion
    trigger: "subaward invoice create/resubmit (recompute), approval (consume)"
    algorithm: chronological
    formula: |
      Process a subaward's non-REJECTED invoices chronologically: order by period_start ASC,
      tie-break created_at ASC (never id).
      cumulative_direct(inv) = sum(current_period_direct_cents) over invoices up to and including inv
      mtdc_portion(inv) = min(cumulative_direct(inv), SUBAWARD_MTDC_CAP)
                          - min(cumulative_direct(inv) - inv.current_period_direct_cents, SUBAWARD_MTDC_CAP)
      At approval: subaward.mtdc_consumed_cents = min(cumulative_direct(inv), SUBAWARD_MTDC_CAP).
    constants:
      SUBAWARD_MTDC_CAP: 2500000   # 25,000 USD in cents
    input_set: "non-REJECTED invoices of one subaward"
    precision: "integer cents (exact)"

  - name: effort_charged_percentage
    trigger: "cycle open (statement generation) and every SALARY expenditure post/transfer affecting (person, award, window)"
    algorithm: aggregation
    formula: |
      numerator   = sum(amount_cents) over POSTED, non-TRANSFERRED_OUT SALARY expenditures of
                    (person, award) with transaction_date in [cycle.period_start, cycle.period_end)  # half-open
      denominator = round_half_up(person.institutional_base_salary_annual_cents / person.appointment_months) * cycle.cycle_months
      charged_effort_pct = round_half_up_2dp(100 * numerator / denominator)
      NOTE the cap interaction: the denominator uses FULL IBS (uncapped), while the numerator only ever
      contains the capped charge — an over-cap person CANNOT reach their nominal effort percentage on
      that award; the gap lands in institutional effort instead.
    input_set: "post salary expenditures for (person, award) in the cycle window; person IBS; cycle months"
    precision: "2 decimal places, round_half_up"

  - name: effort_variance_and_thresholds
    trigger: "POST /api/effort-statements/{id}/certify"
    algorithm: threshold
    formula: |
      variance_pp = round_half_up_2dp(certified_effort_pct - charged_effort_pct)
      if abs(variance_pp) > 5.00: payroll_adjustment_note (>= 20 chars) required (ERR_VARIANCE_NOTE_REQUIRED)
      if commitment.is_key_personnel AND certified_effort_pct < 0.75 * committed_effort_pct:
        key_reduction_flag = true   # sponsor prior-approval situation; observable on the statement
      Cycle-close aggregate: for each person, sum(certified_effort_pct over all their statements this cycle)
        must == 100.00 exactly (ERR_EFFORT_TOTAL_NOT_100).
    constants:
      VARIANCE_TOLERANCE_PP: 5.00
      KEY_PERSONNEL_FLOOR: 0.75
    input_set: "single statement at certify; per-person statement set at cycle close"
    precision: "2 decimal places, round_half_up"

  - name: cost_transfer_timeliness
    trigger: "POST /api/cost-transfers/{id}/submit"
    algorithm: threshold
    formula: |
      days_since_posting = whole_days(source.posted_at -> logical clock)
      is_retroactive = days_since_posting > 90       # EXACTLY 90 days is timely
      retroactive requires enhanced_justification (>= 50 chars) and routes approval through
      PENDING_COUNTERSIGN (SponsoredProgramsOfficer countersign) instead of direct APPROVED.
    constants:
      RETROACTIVE_DAYS: 90
    input_set: "source expenditure posted_at vs logical clock"
    precision: "whole days"

  - name: closeout_residual_and_shortfall
    trigger: "FFR submit and award close"
    algorithm: aggregation
    formula: |
      At FFR submit:
        total_expenditures_cents    = award.total_direct_spent_cents + award.f_and_a_accrued_cents
        residual_cents              = award.total_obligated_cents - award.cumulative_drawn_cents
        cost_share_shortfall_cents  = max(0, award.cost_share_committed_cents - award.cost_share_met_cents)
        LOC awards: available_draw_pool_cents = max(0, available - cost_share_shortfall_cents)
      At award close: residual_deobligated_cents = total_obligated_cents - cumulative_drawn_cents;
        total_obligated_cents := cumulative_drawn_cents.
    input_set: "single award aggregates"
    precision: "integer cents (exact)"

  - name: award_posture_derivation
    trigger: "recomputed on: /api/_clock/set_current_utc, report submit/accept/reject, FFR submit/accept, initiate-closeout, reinstate"
    algorithm: constraint_propagation
    formula: |
      Let FFR_due = award.current_end_date + 120 days (only meaningful once the FFR exists).
      ffr_days_overdue = (award in CLOSEOUT_PENDING AND FFR.status != ACCEPTED)
                         ? max(0, whole_days(FFR_due -> clock)) : 0
      FROZEN     if any ReportRequirement(report_type == FINAL_TECHNICAL).days_overdue > 30
                 OR  ffr_days_overdue > 30
      RESTRICTED else if any ReportRequirement.status == OVERDUE
                 OR  ffr_days_overdue > 0
      OPEN       otherwise
      On entering FROZEN: cancel all DrawdownRequest in {DRAFT, SUBMITTED} (reservations released).
      Gates: expenditure create needs posture != FROZEN... (pinned: create blocked unless OPEN;
      post blocked when FROZEN; drawdown submit needs OPEN; transfer approve and invoice approve
      blocked when FROZEN; effort certification and report submission never posture-gated).
    constants:
      FFR_DUE_DAYS: 120
      FINAL_REPORT_GRACE_DAYS: 30
    input_set: "award's reports, FFR, logical clock"
    precision: "whole days"

  - name: cost_transfer_money_conservation
    trigger: "invariant checked across every transfer approval"
    algorithm: constraint_propagation
    formula: |
      INVARIANT: for transfer T of amount A from source award S to target award G:
        (sum of spent_cents over all lines of S) + (sum of spent_cents over all lines of G)
          is IDENTICAL before and after approval.
        S side: source line -= A (source expenditure -> TRANSFERRED_OUT)
        G side: target line += A (mirror expenditure POSTED with amount_cents == A)
      A transfer never creates or destroys direct cost; it re-attributes it.
    input_set: "source and target awards' budget lines"
    precision: "integer cents (exact)"

  - name: drawdown_pool_conservation
    trigger: "invariant across drawdown submit/settle/reject/cancel and expenditure posting"
    algorithm: constraint_propagation
    formula: |
      INVARIANT (LOC awards): eligible_pool_cents == cumulative_drawn_cents + reserved_draw_cents
        + available_draw_pool_cents   — at all times.
      submit: reserved += A, available -= A (eligible unchanged)
      settle: reserved -= A, drawn += A (available unchanged)
      reject/cancel: reserved -= A, available += A
      expenditure post: eligible += (amount + F&A share), available += same
    input_set: "single award's draw fields"
    precision: "integer cents (exact)"

  - name: effort_total_conservation
    trigger: "invariant checked at POST /api/effort-cycles/{id}/close"
    algorithm: constraint_propagation
    formula: |
      INVARIANT: for every person with statements in the cycle,
        sum(certified_effort_pct) over ALL their statements (AWARD + NON_SPONSORED) == 100.00 exactly.
      Certification distributes a fixed 100% of institutional effort; closing with any other total
      fails with ERR_EFFORT_TOTAL_NOT_100 and the cycle stays CERTIFYING.
    input_set: "statements of one cycle, grouped by person"
    precision: "2 decimal places"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present, well-formed, and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Ownership scoping for entity-backed roles: PI/ResearchStaff may only act on EffortStatements with person_id == X-User-ID; PI submitting a report must satisfy award.pi_id == X-User-ID"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /api/effort-statements/{id}/certify, POST /api/report-requirements/{id}/submit (PI role)"
  - priority: 4
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right (path first, then body fields in declared order)"
    error_id: "ERR_SPONSOR_NOT_FOUND | ERR_PERSON_NOT_FOUND | ERR_AWARD_NOT_FOUND | ERR_BUDGET_LINE_NOT_FOUND | ERR_EXPENDITURE_NOT_FOUND | ERR_TRANSFER_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_STATEMENT_NOT_FOUND | ERR_SUBAWARD_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_DRAWDOWN_NOT_FOUND | ERR_RECEIVABLE_NOT_FOUND | ERR_MODIFICATION_NOT_FOUND | ERR_FFR_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version in the request equals the parent's current version"
    error_id: "ERR_STALE_AWARD_VERSION | ERR_STALE_STATEMENT_VERSION"
    http_status: 412
    applies_to: "POST /api/drawdown-requests, POST /api/modification-requests, POST /api/effort-statements/{id}/certify"
  - priority: 6
    category: state
    check: "State-machine transition is valid from the entity's current state (per-machine errors), incl. award.status requirements on child operations (ERR_AWARD_NOT_ACTIVE, ERR_AWARD_NOT_SUSPENDED, ERR_AWARD_NOT_IN_CLOSEOUT, ERR_EXPENDITURE_NOT_REVIEWABLE, ERR_TRANSFER_NOT_ACTIONABLE, ERR_CYCLE_NOT_CERTIFYING, ERR_STATEMENT_NOT_CERTIFIABLE, ERR_SUBAWARD_NOT_ACTIVE, ERR_INVOICE_NOT_REVIEWABLE, ERR_REPORT_NOT_SUBMITTABLE, ERR_DRAWDOWN_NOT_ACTIONABLE, ERR_RECEIVABLE_NOT_OPEN, ERR_MODIFICATION_NOT_ACTIONABLE, ERR_FFR_NOT_ACTIONABLE, ERR_CLOSEOUT_INCOMPLETE)"
    error_id: "per-machine state errors"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "Award posture gate: expenditure create and drawdown submit require posture == OPEN (ERR_AWARD_RESTRICTED, ERR_AWARD_FROZEN); expenditure post, transfer approve/countersign, subaward-invoice approve require posture != FROZEN (ERR_AWARD_FROZEN)"
    error_id: "ERR_AWARD_RESTRICTED | ERR_AWARD_FROZEN"
    http_status: 409
    applies_to: "POST /api/expenditures, POST /api/expenditures/{id}/post, POST /api/drawdown-requests/{id}/submit, POST /api/cost-transfers/{id}/approve, POST /api/cost-transfers/{id}/countersign, POST /api/subaward-invoices/{id}/approve"
  - priority: 8
    category: business_safety
    check: "Compliance: allowability attestations all true before posting (ERR_ALLOWABILITY_INCOMPLETE); transfer approver != submitter (ERR_SEGREGATION_OF_DUTIES); retroactive transfer needs enhanced_justification >= 50 chars (ERR_ENHANCED_JUSTIFICATION_REQUIRED); SALARY and cost-share expenditures are not transferable (ERR_SALARY_NOT_TRANSFERABLE, ERR_COST_SHARE_NOT_TRANSFERABLE); HIGH-risk subaward approve needs audit_reference (ERR_AUDIT_REFERENCE_REQUIRED)"
    error_id: "ERR_ALLOWABILITY_INCOMPLETE | ERR_SEGREGATION_OF_DUTIES | ERR_ENHANCED_JUSTIFICATION_REQUIRED | ERR_SALARY_NOT_TRANSFERABLE | ERR_COST_SHARE_NOT_TRANSFERABLE | ERR_AUDIT_REFERENCE_REQUIRED"
    http_status: 422
    applies_to: "expenditure post; cost-transfer submit/approve/countersign; subaward-invoice approve"
    note: "ERR_SEGREGATION_OF_DUTIES returns 403; all others 422"
  - priority: 9
    category: business_temporal
    check: "Temporal: expenditure transaction_date within [project_start_date, current_end_date] (ERR_OUTSIDE_PERIOD_OF_PERFORMANCE); invoice period within [subaward.start_date, subaward.end_date] closed (ERR_INVOICE_PERIOD_OUT_OF_RANGE); NCE submit requires clock < current_end_date (ERR_NCE_AFTER_END_DATE); initiate-closeout requires clock >= current_end_date (ERR_CLOSEOUT_TOO_EARLY); cycle open requires clock >= period_start (ERR_CYCLE_NOT_YET_OPENABLE)"
    error_id: "ERR_OUTSIDE_PERIOD_OF_PERFORMANCE | ERR_INVOICE_PERIOD_OUT_OF_RANGE | ERR_NCE_AFTER_END_DATE | ERR_CLOSEOUT_TOO_EARLY | ERR_CYCLE_NOT_YET_OPENABLE"
    http_status: 422
    applies_to: "expenditure post; subaward-invoice create/resubmit; modification submit; initiate-closeout; cycle open"
    note: "ERR_CLOSEOUT_TOO_EARLY and ERR_CYCLE_NOT_YET_OPENABLE return 409"
  - priority: 10
    category: business_constraint
    check: "Structural: effort cycles use HALF-OPEN windows — overlap iff start < other.end AND end > other.start (ERR_CYCLE_PERIOD_OVERLAP); subaward invoices use CLOSED windows over non-REJECTED invoices — overlap iff start <= other.end AND end >= other.start (ERR_INVOICE_PERIOD_OVERLAP); at most one CERTIFYING cycle (ERR_CYCLE_ALREADY_CERTIFYING); per-person certified total == 100.00 at cycle close (ERR_EFFORT_TOTAL_NOT_100); all statements certified at cycle close (ERR_CYCLE_HAS_UNCERTIFIED_STATEMENTS); variance note when |variance| > 5.00 (ERR_VARIANCE_NOTE_REQUIRED); rebudget grand-total invariant (ERR_REBUDGET_NOT_ZERO_SUM); F_AND_A line is system-managed (ERR_F_AND_A_LINE_SYSTEM_MANAGED); SUBAWARD_PAYMENT type is system-managed (ERR_EXPENDITURE_TYPE_SYSTEM_MANAGED); unique (award_id, person_id) commitment (ERR_DUPLICATE_COMMITMENT); unique invoice_number per subaward (ERR_DUPLICATE_INVOICE_NUMBER); unique award_number / cycle_code (ERR_DUPLICATE_AWARD_NUMBER / ERR_DUPLICATE_CYCLE_CODE)"
    error_id: "ERR_CYCLE_PERIOD_OVERLAP | ERR_INVOICE_PERIOD_OVERLAP | ERR_CYCLE_ALREADY_CERTIFYING | ERR_EFFORT_TOTAL_NOT_100 | ERR_CYCLE_HAS_UNCERTIFIED_STATEMENTS | ERR_VARIANCE_NOTE_REQUIRED | ERR_REBUDGET_NOT_ZERO_SUM | ERR_F_AND_A_LINE_SYSTEM_MANAGED | ERR_EXPENDITURE_TYPE_SYSTEM_MANAGED | ERR_DUPLICATE_COMMITMENT | ERR_DUPLICATE_INVOICE_NUMBER | ERR_DUPLICATE_AWARD_NUMBER | ERR_DUPLICATE_CYCLE_CODE"
    http_status: 409
    applies_to: "create/action endpoints as named"
    note: "ERR_REBUDGET_NOT_ZERO_SUM, ERR_F_AND_A_LINE_SYSTEM_MANAGED, ERR_EXPENDITURE_TYPE_SYSTEM_MANAGED, ERR_VARIANCE_NOTE_REQUIRED return 422"
  - priority: 11
    category: business_referential
    check: "Referential: budget_line belongs to the same award as the expenditure (ERR_BUDGET_LINE_AWARD_MISMATCH); expenditure_type matches line category mapping SALARY->PERSONNEL_SALARIES, TRAVEL->TRAVEL, EQUIPMENT->EQUIPMENT, SUPPLIES->MATERIALS_SUPPLIES, PARTICIPANT_SUPPORT->PARTICIPANT_SUPPORT, OTHER_DIRECT->OTHER_DIRECT (ERR_CATEGORY_TYPE_MISMATCH); SALARY post requires an EffortCommitment for (person, award) (ERR_SALARY_NO_COMMITMENT); transfer target award != source award (ERR_TRANSFER_TARGET_SAME_AS_SOURCE) and target line category == source line category (ERR_CATEGORY_TYPE_MISMATCH); drawdown requires payment_method LETTER_OF_CREDIT, receivable requires COST_REIMBURSABLE_INVOICE, both forbidden on FIXED_PRICE_SCHEDULE (ERR_PAYMENT_METHOD_MISMATCH)"
    error_id: "ERR_BUDGET_LINE_AWARD_MISMATCH | ERR_CATEGORY_TYPE_MISMATCH | ERR_SALARY_NO_COMMITMENT | ERR_TRANSFER_TARGET_SAME_AS_SOURCE | ERR_PAYMENT_METHOD_MISMATCH"
    http_status: 422
    applies_to: "expenditure create/post; cost-transfer create; drawdown create; receivable create"
  - priority: 12
    category: business_fiscal
    check: "Fiscal (last): line sufficiency at post/approve in pinned order salaries-then-fringe (ERR_BUDGET_LINE_EXCEEDED); activation exact allocation (ERR_BUDGET_NOT_FULLY_ALLOCATED); drawdown amount <= available pool (ERR_DRAWDOWN_EXCEEDS_ELIGIBLE); invoice cumulative (direct+subF&A) <= subaward total (ERR_SUBAWARD_BUDGET_EXCEEDED); payment <= outstanding (ERR_RECEIVABLE_OVERPAYMENT); unliquidated == 0 at FFR submit (ERR_UNLIQUIDATED_OBLIGATIONS); SUBAWARDS line authorized >= mtdc_eligible (ERR_MTDC_ELIGIBLE_EXCEEDS_AUTHORIZED); receivable window contains >= 1 uninvoiced posted cost (ERR_NO_UNINVOICED_COSTS)"
    error_id: "ERR_BUDGET_LINE_EXCEEDED | ERR_BUDGET_NOT_FULLY_ALLOCATED | ERR_DRAWDOWN_EXCEEDS_ELIGIBLE | ERR_SUBAWARD_BUDGET_EXCEEDED | ERR_RECEIVABLE_OVERPAYMENT | ERR_UNLIQUIDATED_OBLIGATIONS | ERR_MTDC_ELIGIBLE_EXCEEDS_AUTHORIZED | ERR_NO_UNINVOICED_COSTS"
    http_status: 402
    applies_to: "post/activate/submit/approve/payment endpoints as named"
    note: "ERR_BUDGET_NOT_FULLY_ALLOCATED, ERR_RECEIVABLE_OVERPAYMENT, ERR_UNLIQUIDATED_OBLIGATIONS, ERR_MTDC_ELIGIBLE_EXCEEDS_AUTHORIZED, ERR_NO_UNINVOICED_COSTS return 422; the three *EXCEEDED errors return 402"
  - priority: 13
    category: existence
    check: "Request shape: required fields present, types and enum values valid, numeric ranges respected (effort_pct in (0,100], period_months in (0,12], extension_months in 1..12, strings min lengths, period_end >= period_start, end_date > start_date)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    note: "Field-shape failures are checked LAST per endpoint: a request that is both malformed and unauthorized gets ERR_FORBIDDEN_ROLE."

# =============================================================================
# §1.5 API Endpoint Table
# GET list endpoints accept the FK/status filters listed plus limit?/offset?
# (pagination per §1.0). Default list sort: created_at ASC.
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. Setting the clock triggers the overdue sweep (ReportRequirement PENDING->OVERDUE), posture recompute + FROZEN drawdown cascade, and receivable aging/interest recompute."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["overdue sweep", "posture recompute", "drawdown auto-cancel on FROZEN", "aging recompute"]

  # --- sponsors ---
  - method: POST
    path: "/api/sponsors"
    description: "Create a sponsor"
    roles: [SponsoredProgramsOfficer]
    code: 201
    input: [name, sponsor_type, payment_method, "salary_cap_annual_cents?", f_and_a_rate_bps, "late_payment_apr_bps?"]
    output: Sponsor
    side_effects: []
  - method: GET
    path: "/api/sponsors"
    description: "List sponsors"
    roles: &all_roles [SystemAdmin, SponsoredProgramsOfficer, GrantCoordinator, GrantsAccountant, SponsorOfficial, PrincipalInvestigator, ResearchStaff]
    code: 200
    input: ["payment_method?", "sponsor_type?", "limit?", "offset?"]
    output: "Sponsor[]"
    side_effects: []
  - method: GET
    path: "/api/sponsors/{id}"
    description: "Get one sponsor"
    roles: *all_roles
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  # --- persons ---
  - method: POST
    path: "/api/persons"
    description: "Register research personnel"
    roles: [SponsoredProgramsOfficer]
    code: 201
    input: [full_name, role_type, institutional_base_salary_annual_cents, appointment_months]
    output: Person
    side_effects: []
  - method: GET
    path: "/api/persons"
    description: "List persons"
    roles: *all_roles
    code: 200
    input: ["role_type?", "limit?", "offset?"]
    output: "Person[]"
    side_effects: []
  - method: GET
    path: "/api/persons/{id}"
    description: "Get one person"
    roles: *all_roles
    code: 200
    input: []
    output: Person
    side_effects: []

  # --- awards ---
  - method: POST
    path: "/api/awards"
    description: "Create an award in PENDING_SETUP; salary cap, F&A rate and payment method are copied from the sponsor (version-pinned)"
    roles: [SponsoredProgramsOfficer]
    code: 201
    input: [sponsor_id, pi_id, award_number, title, project_start_date, original_end_date, total_obligated_cents, fringe_rate_bps, "cost_share_committed_cents?"]
    output: GrantAward
    side_effects: ["current_end_date := original_end_date", "status PENDING_SETUP", "posture OPEN", "system creates the F_AND_A budget line with authorized_cents 0"]
  - method: GET
    path: "/api/awards"
    description: "List awards (FK reverse-read for sponsor_id / pi_id)"
    roles: *all_roles
    code: 200
    input: ["sponsor_id?", "pi_id?", "status?", "posture?", "limit?", "offset?"]
    output: "GrantAward[]"
    side_effects: []
  - method: GET
    path: "/api/awards/{id}"
    description: "Get one award (all computed aggregates and posture)"
    roles: *all_roles
    code: 200
    input: []
    output: GrantAward
    side_effects: []
  - method: POST
    path: "/api/awards/{id}/activate"
    description: "Activate after budget load; requires exact allocation to total_obligated_cents; snapshots baselines"
    roles: [SponsoredProgramsOfficer]
    code: 200
    input: []
    output: GrantAward
    side_effects: ["status -> ACTIVE", "baseline snapshot on all lines", "increments version"]
  - method: POST
    path: "/api/awards/{id}/suspend"
    description: "Sponsor suspension of an ACTIVE award"
    roles: [SponsorOfficial]
    code: 200
    input: ["reason?"]
    output: GrantAward
    side_effects: ["status -> SUSPENDED", "increments version"]
  - method: POST
    path: "/api/awards/{id}/reinstate"
    description: "Reinstate a SUSPENDED award"
    roles: [SponsorOfficial]
    code: 200
    input: []
    output: GrantAward
    side_effects: ["status -> ACTIVE", "posture recompute", "increments version"]
  - method: POST
    path: "/api/awards/{id}/initiate-closeout"
    description: "Enter closeout at/after current_end_date; auto-creates the FinalFinancialReport (DRAFT)"
    roles: [GrantsAccountant]
    code: 200
    input: []
    output: GrantAward
    side_effects: ["status -> CLOSEOUT_PENDING", "FinalFinancialReport created", "posture recompute", "increments version"]
  - method: POST
    path: "/api/awards/{id}/reopen"
    description: "Sponsor-approved reopen from CLOSEOUT_PENDING back to ACTIVE; deletes a DRAFT/RETURNED FFR"
    roles: [SponsorOfficial]
    code: 200
    input: []
    output: GrantAward
    side_effects: ["status -> ACTIVE", "FFR (DRAFT/RETURNED) deleted", "posture recompute", "increments version"]
  - method: POST
    path: "/api/awards/{id}/close"
    description: "Final close; requires accepted FFR, no open receivables/draws/invoices, all reports accepted; deobligates residual"
    roles: [GrantsAccountant]
    code: 200
    input: []
    output: GrantAward
    side_effects: ["status -> CLOSED", "residual_deobligated_cents recorded", "total_obligated_cents := cumulative_drawn_cents", "increments version"]

  # --- budget lines ---
  - method: POST
    path: "/api/budget-lines"
    description: "Load one budget category line while the award is PENDING_SETUP; F_AND_A category is system-managed"
    roles: [GrantCoordinator]
    code: 201
    input: [award_id, category, authorized_cents, "mtdc_eligible_cents?"]
    output: BudgetLine
    side_effects: ["F_AND_A line authorized recomputed after each direct-line load", "increments parent award version"]
  - method: GET
    path: "/api/budget-lines"
    description: "List budget lines (FK reverse-read for award_id)"
    roles: *all_roles
    code: 200
    input: ["award_id?", "category?", "limit?", "offset?"]
    output: "BudgetLine[]"
    side_effects: []
  - method: GET
    path: "/api/budget-lines/{id}"
    description: "Get one budget line"
    roles: *all_roles
    code: 200
    input: []
    output: BudgetLine
    side_effects: []

  # --- effort commitments ---
  - method: POST
    path: "/api/effort-commitments"
    description: "Record committed effort for a person on an award (PENDING_SETUP or ACTIVE); unique per (award_id, person_id)"
    roles: [GrantCoordinator]
    code: 201
    input: [award_id, person_id, committed_effort_pct, "is_key_personnel?"]
    output: EffortCommitment
    side_effects: []
  - method: GET
    path: "/api/effort-commitments"
    description: "List effort commitments (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["award_id?", "person_id?", "limit?", "offset?"]
    output: "EffortCommitment[]"
    side_effects: []
  - method: GET
    path: "/api/effort-commitments/{id}"
    description: "Get one effort commitment"
    roles: *all_roles
    code: 200
    input: []
    output: EffortCommitment
    side_effects: []

  # --- expenditures ---
  - method: POST
    path: "/api/expenditures"
    description: "Submit an expenditure for review (PENDING_REVIEW); SALARY amount/fringe/over-cap computed by salary_charge_with_cap"
    roles: [GrantCoordinator]
    code: 201
    input: [award_id, budget_line_id, expenditure_type, transaction_date, is_allocable, is_reasonable, is_consistent, "amount_cents?", "effort_pct?", "period_months?", "person_id?", "is_cost_share?", "cash_disbursed?", "description?"]
    output: Expenditure
    side_effects: ["SALARY: amount_cents/fringe_cents/over_cap_cents computed", "submitted_by_user_id := X-User-ID"]
  - method: GET
    path: "/api/expenditures"
    description: "List expenditures (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["award_id?", "budget_line_id?", "person_id?", "status?", "transferred_from_id?", "invoiced_receivable_id?", "expenditure_type?", "limit?", "offset?"]
    output: "Expenditure[]"
    side_effects: []
  - method: GET
    path: "/api/expenditures/{id}"
    description: "Get one expenditure"
    roles: *all_roles
    code: 200
    input: []
    output: Expenditure
    side_effects: []
  - method: POST
    path: "/api/expenditures/{id}/post"
    description: "Post after allowability/budget review; fires the depth-4 ledger cascade (lines -> award MTDC/F&A -> draw pool -> effort statements)"
    roles: [GrantsAccountant]
    code: 200
    input: []
    output: Expenditure
    side_effects: ["status -> POSTED", "posted_at := clock", "budget line(s) debited", "award aggregates + draw pool recomputed", "effort statements recomputed for SALARY", "increments parent award version"]
  - method: POST
    path: "/api/expenditures/{id}/disallow"
    description: "Disallow a pending expenditure"
    roles: [GrantsAccountant]
    code: 200
    input: [disallow_reason]
    output: Expenditure
    side_effects: ["status -> DISALLOWED"]
  - method: POST
    path: "/api/expenditures/{id}/resubmit"
    description: "Revise attestations/amount and return a DISALLOWED expenditure to PENDING_REVIEW"
    roles: [GrantCoordinator]
    code: 200
    input: ["is_allocable?", "is_reasonable?", "is_consistent?", "amount_cents?"]
    output: Expenditure
    side_effects: ["status -> PENDING_REVIEW"]

  # --- cost transfers ---
  - method: POST
    path: "/api/cost-transfers"
    description: "Create a cost transfer (DRAFT) moving the full amount of a POSTED non-SALARY non-cost-share expenditure to another award"
    roles: [GrantCoordinator, GrantsAccountant]
    code: 201
    input: [source_expenditure_id, target_award_id, target_budget_line_id, justification]
    output: CostTransfer
    side_effects: ["created_by_user_id := X-User-ID"]
  - method: GET
    path: "/api/cost-transfers"
    description: "List cost transfers (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["source_expenditure_id?", "target_award_id?", "target_budget_line_id?", "status?", "limit?", "offset?"]
    output: "CostTransfer[]"
    side_effects: []
  - method: GET
    path: "/api/cost-transfers/{id}"
    description: "Get one cost transfer"
    roles: *all_roles
    code: 200
    input: []
    output: CostTransfer
    side_effects: []
  - method: POST
    path: "/api/cost-transfers/{id}/submit"
    description: "Submit for review; freezes is_retroactive/days_since_posting at the logical clock; retroactive needs enhanced_justification"
    roles: [GrantCoordinator, GrantsAccountant]
    code: 200
    input: ["enhanced_justification?"]
    output: CostTransfer
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id := X-User-ID", "is_retroactive/days_since_posting frozen"]
  - method: POST
    path: "/api/cost-transfers/{id}/approve"
    description: "Approve a non-retroactive transfer (APPROVED + ledger effects) or route a retroactive one to PENDING_COUNTERSIGN; approver must differ from submitter"
    roles: [GrantsAccountant]
    code: 200
    input: []
    output: CostTransfer
    side_effects: ["non-retroactive: source expenditure TRANSFERRED_OUT + mirror expenditure POSTED on target + both awards recompute", "retroactive: status -> PENDING_COUNTERSIGN only"]
  - method: POST
    path: "/api/cost-transfers/{id}/countersign"
    description: "Second-approval (different role) for a retroactive transfer; applies the full ledger effects"
    roles: [SponsoredProgramsOfficer]
    code: 200
    input: []
    output: CostTransfer
    side_effects: ["status -> APPROVED", "source TRANSFERRED_OUT + mirror POSTED + both awards recompute"]
  - method: POST
    path: "/api/cost-transfers/{id}/deny"
    description: "Deny a submitted or countersign-pending transfer"
    roles: [GrantsAccountant, SponsoredProgramsOfficer]
    code: 200
    input: [deny_reason]
    output: CostTransfer
    side_effects: ["status -> DENIED"]
  - method: POST
    path: "/api/cost-transfers/{id}/revise"
    description: "Return a DENIED transfer to DRAFT for revision (cycle)"
    roles: [GrantCoordinator, GrantsAccountant]
    code: 200
    input: ["justification?"]
    output: CostTransfer
    side_effects: ["status -> DRAFT", "deny_reason cleared"]

  # --- effort cycles ---
  - method: POST
    path: "/api/effort-cycles"
    description: "Create a certification cycle (SCHEDULED); half-open window must not overlap any existing cycle"
    roles: [GrantsAccountant]
    code: 201
    input: [cycle_code, period_start, period_end, cycle_months]
    output: EffortCycle
    side_effects: []
  - method: GET
    path: "/api/effort-cycles"
    description: "List effort cycles"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EffortCycle[]"
    side_effects: []
  - method: GET
    path: "/api/effort-cycles/{id}"
    description: "Get one effort cycle"
    roles: *all_roles
    code: 200
    input: []
    output: EffortCycle
    side_effects: []
  - method: POST
    path: "/api/effort-cycles/{id}/open"
    description: "Open certification: generates AWARD + NON_SPONSORED EffortStatements with committed snapshots"
    roles: [GrantsAccountant]
    code: 200
    input: []
    output: EffortCycle
    side_effects: ["status -> CERTIFYING", "EffortStatements generated (fan-out)"]
  - method: POST
    path: "/api/effort-cycles/{id}/close"
    description: "Close the cycle: all statements certified, per-person totals == 100.00; posts fringe true-up adjustments"
    roles: [GrantsAccountant]
    code: 200
    input: [actual_fringe_rate_bps]
    output: EffortCycle
    side_effects: ["status -> CLOSED", "fringe_trueup_adjustment per touched award", "actual_fringe_rate_bps recorded"]

  # --- effort statements ---
  - method: GET
    path: "/api/effort-statements"
    description: "List effort statements (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["cycle_id?", "person_id?", "award_id?", "status?", "statement_kind?", "limit?", "offset?"]
    output: "EffortStatement[]"
    side_effects: []
  - method: GET
    path: "/api/effort-statements/{id}"
    description: "Get one effort statement"
    roles: *all_roles
    code: 200
    input: []
    output: EffortStatement
    side_effects: []
  - method: POST
    path: "/api/effort-statements/{id}/certify"
    description: "Certify (or re-certify after reopen) own statement; OCC on statement version; variance note and key-personnel floor enforced"
    roles: [PrincipalInvestigator, ResearchStaff]
    code: 200
    input: [certified_effort_pct, expected_effort_statement_version, "payroll_adjustment_note?"]
    output: EffortStatement
    side_effects: ["status -> CERTIFIED/RECERTIFIED", "variance_pp, key_reduction_flag computed", "increments EffortStatement.version"]
  - method: POST
    path: "/api/effort-statements/{id}/reopen"
    description: "Reopen a CERTIFIED statement (payroll adjustment landed); recomputes charged_effort_pct"
    roles: [GrantsAccountant]
    code: 200
    input: [reason]
    output: EffortStatement
    side_effects: ["status -> REOPENED", "charged_effort_pct recomputed", "certified values cleared", "increments version"]

  # --- subawards ---
  - method: POST
    path: "/api/subawards"
    description: "Create a subaward (DRAFT) under a prime award"
    roles: [SponsoredProgramsOfficer]
    code: 201
    input: [award_id, subrecipient_name, total_subaward_cents, risk_rating, start_date, end_date]
    output: Subaward
    side_effects: []
  - method: GET
    path: "/api/subawards"
    description: "List subawards (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["award_id?", "status?", "risk_rating?", "limit?", "offset?"]
    output: "Subaward[]"
    side_effects: []
  - method: GET
    path: "/api/subawards/{id}"
    description: "Get one subaward"
    roles: *all_roles
    code: 200
    input: []
    output: Subaward
    side_effects: []
  - method: POST
    path: "/api/subawards/{id}/activate"
    description: "Activate a subaward (prime award must be ACTIVE)"
    roles: [SponsoredProgramsOfficer]
    code: 200
    input: []
    output: Subaward
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/api/subawards/{id}/close"
    description: "Close a subaward once no invoices are in flight"
    roles: [SponsoredProgramsOfficer]
    code: 200
    input: []
    output: Subaward
    side_effects: ["status -> CLOSED"]

  # --- subaward invoices ---
  - method: POST
    path: "/api/subaward-invoices"
    description: "Record a received subrecipient invoice; subaward must be DRAFT or ACTIVE (CLOSED -> ERR_SUBAWARD_NOT_ACTIVE); closed-interval overlap and cumulative-ceiling checks; MTDC cap portion computed chronologically"
    roles: [GrantCoordinator]
    code: 201
    input: [subaward_id, invoice_number, period_start, period_end, current_period_direct_cents, current_period_f_and_a_cents, "audit_reference?"]
    output: SubawardInvoice
    side_effects: ["cumulative_direct_cents, mtdc_portion_cents computed", "subaward.invoiced_to_date_cents updated"]
  - method: GET
    path: "/api/subaward-invoices"
    description: "List subaward invoices (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["subaward_id?", "status?", "prime_expenditure_id?", "limit?", "offset?"]
    output: "SubawardInvoice[]"
    side_effects: []
  - method: GET
    path: "/api/subaward-invoices/{id}"
    description: "Get one subaward invoice"
    roles: *all_roles
    code: 200
    input: []
    output: SubawardInvoice
    side_effects: []
  - method: POST
    path: "/api/subaward-invoices/{id}/begin-review"
    description: "Move a received invoice into review"
    roles: [SponsoredProgramsOfficer]
    code: 200
    input: []
    output: SubawardInvoice
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/api/subaward-invoices/{id}/approve"
    description: "Approve for payment: creates the SUBAWARD_PAYMENT mirror expenditure on the prime award (POSTED) and consumes MTDC cap"
    roles: [SponsoredProgramsOfficer]
    code: 200
    input: ["audit_reference?"]
    output: SubawardInvoice
    side_effects: ["status -> PAID", "prime expenditure created + posted", "prime award MTDC/F&A/pools recomputed", "subaward.mtdc_consumed_cents updated", "prime_expenditure_id set"]
  - method: POST
    path: "/api/subaward-invoices/{id}/reject"
    description: "Reject an invoice under review (terminal; excluded from cumulative and overlap checks)"
    roles: [SponsoredProgramsOfficer]
    code: 200
    input: [return_reason]
    output: SubawardInvoice
    side_effects: ["status -> REJECTED", "subaward.invoiced_to_date_cents decremented"]
  - method: POST
    path: "/api/subaward-invoices/{id}/return-for-revision"
    description: "Return an invoice to the subrecipient for revision"
    roles: [SponsoredProgramsOfficer]
    code: 200
    input: [return_reason]
    output: SubawardInvoice
    side_effects: ["status -> RETURNED_FOR_REVISION"]
  - method: POST
    path: "/api/subaward-invoices/{id}/resubmit"
    description: "Resubmit a returned invoice with revised amounts/period (cycle back to UNDER_REVIEW)"
    roles: [GrantCoordinator]
    code: 200
    input: [current_period_direct_cents, current_period_f_and_a_cents, "period_start?", "period_end?"]
    output: SubawardInvoice
    side_effects: ["status -> UNDER_REVIEW", "cumulative/mtdc recomputed", "invoiced_to_date_cents updated"]

  # --- report requirements ---
  - method: POST
    path: "/api/report-requirements"
    description: "Schedule a report requirement (PENDING)"
    roles: [SponsoredProgramsOfficer]
    code: 201
    input: [award_id, report_type, due_date]
    output: ReportRequirement
    side_effects: []
  - method: GET
    path: "/api/report-requirements"
    description: "List report requirements (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["award_id?", "status?", "report_type?", "limit?", "offset?"]
    output: "ReportRequirement[]"
    side_effects: []
  - method: GET
    path: "/api/report-requirements/{id}"
    description: "Get one report requirement (incl. computed days_overdue)"
    roles: *all_roles
    code: 200
    input: []
    output: ReportRequirement
    side_effects: []
  - method: POST
    path: "/api/report-requirements/{id}/submit"
    description: "Submit a report (from PENDING or OVERDUE); clears overdue posture on recompute"
    roles: [PrincipalInvestigator, GrantCoordinator]
    code: 200
    input: ["submission_note?"]
    output: ReportRequirement
    side_effects: ["status -> SUBMITTED", "submitted_at := clock", "award posture recompute"]
  - method: POST
    path: "/api/report-requirements/{id}/accept"
    description: "Sponsor accepts a submitted report (terminal)"
    roles: [SponsorOfficial]
    code: 200
    input: []
    output: ReportRequirement
    side_effects: ["status -> ACCEPTED"]
  - method: POST
    path: "/api/report-requirements/{id}/reject"
    description: "Sponsor rejects a submitted report: returns to PENDING with a revised due date"
    roles: [SponsorOfficial]
    code: 200
    input: [revised_due_date, reject_reason]
    output: ReportRequirement
    side_effects: ["status -> PENDING", "due_date := revised_due_date", "award posture recompute"]

  # --- drawdown requests (letter of credit) ---
  - method: POST
    path: "/api/drawdown-requests"
    description: "Create a drawdown request (DRAFT) against a LETTER_OF_CREDIT award; OCC on award version; increments award version"
    roles: [GrantsAccountant]
    code: 201
    input: [award_id, amount_cents, expected_award_version]
    output: DrawdownRequest
    side_effects: ["increments GrantAward.version by 1"]
  - method: GET
    path: "/api/drawdown-requests"
    description: "List drawdown requests (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: "DrawdownRequest[]"
    side_effects: []
  - method: GET
    path: "/api/drawdown-requests/{id}"
    description: "Get one drawdown request"
    roles: *all_roles
    code: 200
    input: []
    output: DrawdownRequest
    side_effects: []
  - method: POST
    path: "/api/drawdown-requests/{id}/submit"
    description: "Submit to sponsor: requires posture OPEN and amount <= available pool; reserves the amount"
    roles: [GrantsAccountant]
    code: 200
    input: []
    output: DrawdownRequest
    side_effects: ["status -> SUBMITTED", "reservation: reserved += amount, available -= amount", "eligible_pool_at_submission snapshot"]
  - method: POST
    path: "/api/drawdown-requests/{id}/settle"
    description: "Sponsor settles a submitted draw (cash in)"
    roles: [SponsorOfficial]
    code: 200
    input: []
    output: DrawdownRequest
    side_effects: ["status -> SETTLED", "reserved -= amount, cumulative_drawn += amount", "increments award version"]
  - method: POST
    path: "/api/drawdown-requests/{id}/reject"
    description: "Sponsor rejects a submitted draw; reservation released"
    roles: [SponsorOfficial]
    code: 200
    input: [reject_reason]
    output: DrawdownRequest
    side_effects: ["status -> REJECTED_BY_SPONSOR", "reservation released", "increments award version"]

  # --- receivables (cost-reimbursable invoicing) ---
  - method: POST
    path: "/api/receivables"
    description: "Bill a cost-reimbursable sponsor for a period: amount computed accrual-basis from uninvoiced POSTED costs in the window; marks them invoiced"
    roles: [GrantsAccountant]
    code: 201
    input: [award_id, period_start, period_end]
    output: Receivable
    side_effects: ["amount_cents computed (invoice_accrual_basis)", "invoice_date := clock", "included expenditures stamped invoiced_receivable_id", "increments award version"]
  - method: GET
    path: "/api/receivables"
    description: "List receivables (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["award_id?", "status?", "aging_bucket?", "limit?", "offset?"]
    output: "Receivable[]"
    side_effects: []
  - method: GET
    path: "/api/receivables/{id}"
    description: "Get one receivable (aging bucket, accrued interest, waterfall fields recomputed against the logical clock)"
    roles: *all_roles
    code: 200
    input: []
    output: Receivable
    side_effects: []
  - method: POST
    path: "/api/receivables/{id}/payments"
    description: "Record a sponsor payment; waterfall: accrued interest first, then principal; principal increments award.cumulative_drawn_cents"
    roles: [GrantsAccountant]
    code: 200
    input: [amount_cents]
    output: Receivable
    side_effects: ["waterfall allocation", "status update (OPEN/PARTIALLY_PAID/PAID)", "award.cumulative_drawn_cents += principal part"]
  - method: POST
    path: "/api/receivables/{id}/dispute"
    description: "Dispute an OPEN receivable; pauses interest accrual"
    roles: [GrantsAccountant]
    code: 200
    input: [dispute_reason]
    output: Receivable
    side_effects: ["status -> DISPUTED", "interest accrual paused"]
  - method: POST
    path: "/api/receivables/{id}/resolve-dispute"
    description: "Resolve a dispute; interest accrual resumes (dispute days never accrue)"
    roles: [GrantsAccountant]
    code: 200
    input: []
    output: Receivable
    side_effects: ["status -> OPEN"]
  - method: GET
    path: "/api/awards/{id}/receivables-aging"
    description: "Computed read: aging buckets (sums of per-receivable principal outstanding) and total accrued interest for one award"
    roles: *all_roles
    code: 200
    input: []
    output: { award_id: string, current_cents: integer, d31_60_cents: integer, d61_90_cents: integer, d91_120_cents: integer, over_120_cents: integer, total_outstanding_cents: integer, total_accrued_interest_cents: integer }
    side_effects: []

  # --- modification requests (NCE / rebudget) ---
  - method: POST
    path: "/api/modification-requests"
    description: "Create a modification request (DRAFT); requires_sponsor computed at creation; OCC on award version; increments award version"
    roles: [GrantCoordinator]
    code: 201
    input: [award_id, mod_type, justification, "extension_months?", "rebudget_lines?", expected_award_version]
    output: ModificationRequest
    side_effects: ["requires_sponsor computed", "increments GrantAward.version by 1"]
  - method: GET
    path: "/api/modification-requests"
    description: "List modification requests (FK reverse-read)"
    roles: *all_roles
    code: 200
    input: ["award_id?", "status?", "mod_type?", "limit?", "offset?"]
    output: "ModificationRequest[]"
    side_effects: []
  - method: GET
    path: "/api/modification-requests/{id}"
    description: "Get one modification request"
    roles: *all_roles
    code: 200
    input: []
    output: ModificationRequest
    side_effects: []
  - method: POST
    path: "/api/modification-requests/{id}/submit"
    description: "Submit a request: NCE must be before current_end_date; REBUDGET must satisfy the grand-total invariant"
    roles: [GrantCoordinator]
    code: 200
    input: []
    output: ModificationRequest
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/api/modification-requests/{id}/internal-approve"
    description: "Institutional approval: grantee-authority requests are APPROVED with effects; others route to SPONSOR_REVIEW"
    roles: [SponsoredProgramsOfficer]
    code: 200
    input: []
    output: ModificationRequest
    side_effects: ["grantee-authority: APPROVED + APPLY_EFFECTS", "else: status -> SPONSOR_REVIEW"]
  - method: POST
    path: "/api/modification-requests/{id}/sponsor-decision"
    description: "Sponsor approves (applies effects, refreshes rebudget baselines) or denies"
    roles: [SponsorOfficial]
    code: 200
    input: [decision, "reason?"]
    output: ModificationRequest
    side_effects: ["APPROVE: APPLY_EFFECTS incl. baseline refresh for REBUDGET", "DENY: status -> DENIED"]
  - method: POST
    path: "/api/modification-requests/{id}/withdraw"
    description: "Withdraw a submitted request before any decision"
    roles: [GrantCoordinator]
    code: 200
    input: []
    output: ModificationRequest
    side_effects: ["status -> WITHDRAWN"]

  # --- final financial report ---
  - method: GET
    path: "/api/final-financial-reports"
    description: "List FFRs (FK reverse-read; the cascade-created FFR is discovered here)"
    roles: *all_roles
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: "FinalFinancialReport[]"
    side_effects: []
  - method: GET
    path: "/api/final-financial-reports/{id}"
    description: "Get one FFR"
    roles: *all_roles
    code: 200
    input: []
    output: FinalFinancialReport
    side_effects: []
  - method: POST
    path: "/api/final-financial-reports/{id}/submit"
    description: "Submit the FFR: unliquidated obligations must be 0; snapshots totals; cost-share shortfall reduces the final draw pool"
    roles: [GrantsAccountant]
    code: 200
    input: [unliquidated_obligations_cents]
    output: FinalFinancialReport
    side_effects: ["status -> SUBMITTED", "total_expenditures/residual/shortfall snapshots", "LOC pool reduced by shortfall"]
  - method: POST
    path: "/api/final-financial-reports/{id}/accept"
    description: "Sponsor accepts the FFR"
    roles: [SponsorOfficial]
    code: 200
    input: []
    output: FinalFinancialReport
    side_effects: ["status -> ACCEPTED", "award posture recompute"]
  - method: POST
    path: "/api/final-financial-reports/{id}/return"
    description: "Sponsor returns the FFR for correction"
    roles: [SponsorOfficial]
    code: 200
    input: [return_reason]
    output: FinalFinancialReport
    side_effects: ["status -> RETURNED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth (1-3)
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-ID or X-User-Role header, or undeclared role value" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is not permitted on this endpoint per §1.5" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed role acting on a resource it does not own (statement person_id / award pi_id mismatch)" }
  # existence (4)
  - { id: ERR_SPONSOR_NOT_FOUND, http: 404, condition: "Sponsor id does not exist" }
  - { id: ERR_PERSON_NOT_FOUND, http: 404, condition: "Person id does not exist" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "GrantAward id does not exist" }
  - { id: ERR_BUDGET_LINE_NOT_FOUND, http: 404, condition: "BudgetLine id does not exist" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "EffortCommitment id does not exist" }
  - { id: ERR_EXPENDITURE_NOT_FOUND, http: 404, condition: "Expenditure id does not exist" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "CostTransfer id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "EffortCycle id does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "EffortStatement id does not exist" }
  - { id: ERR_SUBAWARD_NOT_FOUND, http: 404, condition: "Subaward id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "SubawardInvoice id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "ReportRequirement id does not exist" }
  - { id: ERR_DRAWDOWN_NOT_FOUND, http: 404, condition: "DrawdownRequest id does not exist" }
  - { id: ERR_RECEIVABLE_NOT_FOUND, http: 404, condition: "Receivable id does not exist" }
  - { id: ERR_MODIFICATION_NOT_FOUND, http: 404, condition: "ModificationRequest id does not exist" }
  - { id: ERR_FFR_NOT_FOUND, http: 404, condition: "FinalFinancialReport id does not exist" }
  # OCC (5)
  - { id: ERR_STALE_AWARD_VERSION, http: 412, condition: "expected_award_version != GrantAward.version at drawdown/modification create" }
  - { id: ERR_STALE_STATEMENT_VERSION, http: 412, condition: "expected_effort_statement_version != EffortStatement.version at certify" }
  # state (6-7)
  - { id: ERR_AWARD_NOT_ACTIVE, http: 409, condition: "Operation requires award status ACTIVE (or CLOSEOUT_PENDING where pinned); also blocks subaward/transfer operations keyed to award status" }
  - { id: ERR_AWARD_NOT_SUSPENDED, http: 409, condition: "Reinstate attempted on an award not in SUSPENDED" }
  - { id: ERR_AWARD_NOT_IN_CLOSEOUT, http: 409, condition: "FFR submit requires award status CLOSEOUT_PENDING" }
  - { id: ERR_EXPENDITURE_NOT_REVIEWABLE, http: 409, condition: "post/disallow requires PENDING_REVIEW; resubmit requires DISALLOWED" }
  - { id: ERR_TRANSFER_NOT_ACTIONABLE, http: 409, condition: "Transfer action invalid from current status (submit: DRAFT; approve/deny: SUBMITTED or PENDING_COUNTERSIGN per actor; countersign: PENDING_COUNTERSIGN; revise: DENIED)" }
  - { id: ERR_CYCLE_NOT_CERTIFYING, http: 409, condition: "Cycle action requires SCHEDULED (open) or CERTIFYING (close)" }
  - { id: ERR_STATEMENT_NOT_CERTIFIABLE, http: 409, condition: "certify requires statement PENDING/REOPENED with cycle CERTIFYING; reopen requires CERTIFIED with cycle CERTIFYING" }
  - { id: ERR_SUBAWARD_NOT_ACTIVE, http: 409, condition: "Invoice approve requires subaward ACTIVE" }
  - { id: ERR_INVOICE_NOT_REVIEWABLE, http: 409, condition: "Invoice action invalid from current status (begin-review: RECEIVED; approve/reject/return: UNDER_REVIEW; resubmit: RETURNED_FOR_REVISION); also subaward close with invoices in flight" }
  - { id: ERR_REPORT_NOT_SUBMITTABLE, http: 409, condition: "Report submit requires PENDING/OVERDUE; accept/reject require SUBMITTED" }
  - { id: ERR_DRAWDOWN_NOT_ACTIONABLE, http: 409, condition: "Drawdown action invalid from current status (submit: DRAFT; settle/reject: SUBMITTED)" }
  - { id: ERR_RECEIVABLE_NOT_OPEN, http: 409, condition: "payments/dispute require OPEN or PARTIALLY_PAID (payments) / OPEN (dispute); resolve requires DISPUTED" }
  - { id: ERR_MODIFICATION_NOT_ACTIONABLE, http: 409, condition: "Modification action invalid from current status (submit: DRAFT; internal-approve: SUBMITTED; sponsor-decision: SPONSOR_REVIEW; withdraw: SUBMITTED)" }
  - { id: ERR_FFR_NOT_ACTIONABLE, http: 409, condition: "FFR submit requires DRAFT/RETURNED; accept/return require SUBMITTED" }
  - { id: ERR_AWARD_RESTRICTED, http: 409, condition: "Award posture RESTRICTED blocks expenditure create and drawdown submit" }
  - { id: ERR_AWARD_FROZEN, http: 409, condition: "Award posture FROZEN blocks expenditure create, drawdown submit, transfer approve/countersign, invoice approve" }
  - { id: ERR_CLOSEOUT_INCOMPLETE, http: 409, condition: "Award close or FFR submit gated by unfinished closeout items (FFR not ACCEPTED, open receivables/draws/invoices, unaccepted reports)" }
  # business safety/compliance (8)
  - { id: ERR_ALLOWABILITY_INCOMPLETE, http: 422, condition: "Posting requires is_allocable AND is_reasonable AND is_consistent all true" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Cost-transfer approver X-User-ID equals submitted_by_user_id" }
  - { id: ERR_ENHANCED_JUSTIFICATION_REQUIRED, http: 422, condition: "Retroactive transfer (days_since_posting > 90) submitted without enhanced_justification >= 50 chars" }
  - { id: ERR_SALARY_NOT_TRANSFERABLE, http: 422, condition: "Cost transfer source expenditure has expenditure_type SALARY (salary corrections route via payroll/effort, not transfers)" }
  - { id: ERR_COST_SHARE_NOT_TRANSFERABLE, http: 422, condition: "Cost transfer source expenditure has is_cost_share == true" }
  - { id: ERR_AUDIT_REFERENCE_REQUIRED, http: 422, condition: "Approving an invoice for a HIGH-risk subaward without audit_reference" }
  # business temporal (9)
  - { id: ERR_OUTSIDE_PERIOD_OF_PERFORMANCE, http: 422, condition: "transaction_date outside [project_start_date, current_end_date]" }
  - { id: ERR_INVOICE_PERIOD_OUT_OF_RANGE, http: 422, condition: "Invoice period not fully inside [subaward.start_date, subaward.end_date]" }
  - { id: ERR_NCE_AFTER_END_DATE, http: 422, condition: "NCE submit when logical clock >= current_end_date" }
  - { id: ERR_CLOSEOUT_TOO_EARLY, http: 409, condition: "initiate-closeout before current_end_date" }
  - { id: ERR_CYCLE_NOT_YET_OPENABLE, http: 409, condition: "Cycle open before period_start" }
  # business constraint (10)
  - { id: ERR_CYCLE_PERIOD_OVERLAP, http: 409, condition: "New cycle half-open window overlaps an existing cycle (adjacency allowed)" }
  - { id: ERR_INVOICE_PERIOD_OVERLAP, http: 409, condition: "Invoice closed window overlaps a non-REJECTED invoice of the same subaward (shared boundary day counts)" }
  - { id: ERR_CYCLE_ALREADY_CERTIFYING, http: 409, condition: "Another EffortCycle is already CERTIFYING" }
  - { id: ERR_EFFORT_TOTAL_NOT_100, http: 422, condition: "At cycle close a person's certified statements do not sum to exactly 100.00" }
  - { id: ERR_CYCLE_HAS_UNCERTIFIED_STATEMENTS, http: 422, condition: "Cycle close attempted with statements outside {CERTIFIED, RECERTIFIED}" }
  - { id: ERR_VARIANCE_NOTE_REQUIRED, http: 422, condition: "|certified - charged| > 5.00 without payroll_adjustment_note >= 20 chars" }
  - { id: ERR_REBUDGET_NOT_ZERO_SUM, http: 422, condition: "Rebudget grand total (directs + recomputed F&A) != total_obligated_cents" }
  - { id: ERR_F_AND_A_LINE_SYSTEM_MANAGED, http: 422, condition: "Manual creation/modification of an F_AND_A budget line" }
  - { id: ERR_EXPENDITURE_TYPE_SYSTEM_MANAGED, http: 422, condition: "Manual creation of a SUBAWARD_PAYMENT expenditure" }
  - { id: ERR_DUPLICATE_COMMITMENT, http: 409, condition: "EffortCommitment already exists for (award_id, person_id)" }
  - { id: ERR_DUPLICATE_INVOICE_NUMBER, http: 409, condition: "invoice_number already used within this subaward (non-REJECTED)" }
  - { id: ERR_DUPLICATE_AWARD_NUMBER, http: 409, condition: "award_number already exists" }
  - { id: ERR_DUPLICATE_CYCLE_CODE, http: 409, condition: "cycle_code already exists" }
  # business referential (11)
  - { id: ERR_BUDGET_LINE_AWARD_MISMATCH, http: 422, condition: "budget_line_id belongs to a different award than award_id" }
  - { id: ERR_CATEGORY_TYPE_MISMATCH, http: 422, condition: "expenditure_type does not match line category mapping; or transfer target line category differs from source line category" }
  - { id: ERR_SALARY_NO_COMMITMENT, http: 422, condition: "SALARY post without an EffortCommitment for (person, award)" }
  - { id: ERR_TRANSFER_TARGET_SAME_AS_SOURCE, http: 422, condition: "target_award_id equals the source expenditure's award" }
  - { id: ERR_PAYMENT_METHOD_MISMATCH, http: 422, condition: "Drawdown on non-LETTER_OF_CREDIT award, receivable on non-COST_REIMBURSABLE_INVOICE award, either on FIXED_PRICE_SCHEDULE" }
  # business fiscal (12)
  - { id: ERR_BUDGET_LINE_EXCEEDED, http: 402, condition: "Posting/approval would push a line's spent_cents above authorized_cents (salary line checked before fringe line)" }
  - { id: ERR_BUDGET_NOT_FULLY_ALLOCATED, http: 422, condition: "Activation: sum of authorized across all lines (incl. computed F&A) != total_obligated_cents" }
  - { id: ERR_DRAWDOWN_EXCEEDS_ELIGIBLE, http: 402, condition: "Drawdown submit amount_cents > award.available_draw_pool_cents (or <= 0)" }
  - { id: ERR_SUBAWARD_BUDGET_EXCEEDED, http: 402, condition: "Invoice create/resubmit: cumulative (direct + sub F&A) over non-REJECTED invoices would exceed total_subaward_cents" }
  - { id: ERR_RECEIVABLE_OVERPAYMENT, http: 422, condition: "Payment exceeds outstanding_total_cents (interest + principal remaining)" }
  - { id: ERR_UNLIQUIDATED_OBLIGATIONS, http: 422, condition: "FFR submit with unliquidated_obligations_cents != 0" }
  - { id: ERR_MTDC_ELIGIBLE_EXCEEDS_AUTHORIZED, http: 422, condition: "SUBAWARDS line mtdc_eligible_cents > authorized_cents (at load or after rebudget)" }
  - { id: ERR_NO_UNINVOICED_COSTS, http: 422, condition: "Receivable window contains no uninvoiced POSTED non-cost-share expenditures" }
  # shape (13)
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, range violation, or min-length violation (checked last per endpoint)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; owns only the logical clock test-driving endpoint"
    identity: opaque
    exclusive_operations: ["POST /api/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: SponsoredProgramsOfficer
    description: "Central sponsored-programs office; sets up sponsors/persons/awards/subawards, reviews subaward invoices, countersigns retroactive transfers, internal-approves modifications, schedules reports"
    identity: opaque
    exclusive_operations: ["POST /api/sponsors", "POST /api/persons", "POST /api/awards", "POST /api/awards/{id}/activate", "POST /api/subawards*", "POST /api/subaward-invoices/{id}/begin-review|approve|reject|return-for-revision", "POST /api/cost-transfers/{id}/countersign", "POST /api/modification-requests/{id}/internal-approve", "POST /api/report-requirements (schedule)"]
    shared_operations: ["POST /api/cost-transfers/{id}/deny", "all GET endpoints"]
  - name: GrantCoordinator
    description: "Department research administrator; loads budgets, records commitments, submits expenditures/transfers/invoices/modifications, submits reports"
    identity: opaque
    exclusive_operations: ["POST /api/budget-lines", "POST /api/effort-commitments", "POST /api/expenditures", "POST /api/expenditures/{id}/resubmit", "POST /api/subaward-invoices (record)", "POST /api/subaward-invoices/{id}/resubmit", "POST /api/modification-requests*", "POST /api/report-requirements/{id}/submit (coordinator channel)"]
    shared_operations: ["POST /api/cost-transfers (create)", "POST /api/cost-transfers/{id}/submit|revise", "all GET endpoints"]
  - name: GrantsAccountant
    description: "Central post-award accountant; posts/disallows expenditures, approves transfers (never own submissions), runs effort cycles, draws down cash, bills sponsors, manages receivables, runs closeout/FFR"
    identity: opaque
