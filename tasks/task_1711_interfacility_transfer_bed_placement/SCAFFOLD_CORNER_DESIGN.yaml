        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without the X-User-ID / X-User-Role context headers fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role or existence checks."
        test_recipe:
