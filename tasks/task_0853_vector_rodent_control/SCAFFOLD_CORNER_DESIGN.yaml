            - "Second trigger (Inspector is not on the triage endpoint's roles list): HTTP 403 with error_id == ERR_UNAUTHORIZED"
            - "Complaint.${comp_id}.status remains RECEIVED and triaged_at remains null"

      - name: corner_unknown_ids_answer_their_own_not_found_error
