            - { call: "POST /referrals/${r}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { r_v: $.data.version } }
          trigger:
            - call: "POST /referrals/${r}/appointments"
              payload: { expected_referral_version: "${r_v}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }
              as: ReferralCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /referrals/${r}/appointments"
              payload: { expected_referral_version: "${r_v}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
