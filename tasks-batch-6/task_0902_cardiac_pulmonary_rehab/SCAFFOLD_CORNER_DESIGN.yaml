# =============================================================================
# Task 902 — §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7 claims
# not already probed by §1.8). Structured, lint-clean, reachable from empty DB.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: patient_create_returns_201_with_fields
        claim_type: creation
        grounds:
          - 'entities.Patient'
          - 'endpoints["POST /rehab/patients"]'
        distinguishing_aspect: "POST /rehab/patients with mrn/full_name/date_of_birth returns 201 with server-minted id and echoed inputs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-001", full_name: "Corner One", date_of_birth: "1960-01-01" }, as: RehabCoordinator, captures: { pat: $.data.id } }
          trigger:
            - { call: "GET /rehab/patients/${pat}", payload: {}, as: RehabCoordinator, captures: { got: $.data.id } }
          assert:
            - "Patient.${pat}.mrn == C-001 and full_name == 'Corner One'"
            - "response has data.id, data.created_at, data.version == 1"

      - name: get_program_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - 'entities.RehabProgram'
          - 'errors[ERR_PROGRAM_NOT_FOUND]'
        distinguishing_aspect: "GET /rehab/programs/{id} for a random non-existent UUID returns ERR_PROGRAM_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rehab/programs/00000000-0000-4000-8000-000000000000", payload: {}, as: RehabCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "trigger HTTP status == 404"

      - name: referral_missing_required_risk_returns_validation
        claim_type: required_fields
        grounds:
          - 'entities.Referral.fields.risk_stratification'
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "POST /rehab/referrals omitting risk_stratification (input, no default) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["a patient and a physician exist"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-002", full_name: "Corner Two", date_of_birth: "1961-02-02" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000001" }, as: RehabCoordinator, captures: { phy: $.data.id } }
          trigger:
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_VALIDATION"
            - "trigger HTTP status == 400"

      - name: program_authorized_session_cap_defaults_36
        claim_type: defaults
        grounds:
          - 'entities.RehabProgram.fields.authorized_session_cap'
        distinguishing_aspect: "Creating a program without authorized_session_cap applies the default 36."
        test_recipe:
          setup: ["an ACCEPTED referral"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-003", full_name: "Corner Three", date_of_birth: "1962-03-03" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000002" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "LOW" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
          trigger:
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id, cap: $.data.authorized_session_cap } }
          assert:
            - "RehabProgram.${prog}.authorized_session_cap == 36"
            - "RehabProgram.${prog}.status == DRAFT"

      - name: referral_invalid_enum_risk_returns_error
        claim_type: type_constraints
        grounds:
          - 'entities.Referral.fields.risk_stratification'
          - 'errors[ERR_INVALID_ENUM]'
        distinguishing_aspect: "risk_stratification value SEVERE (outside {LOW,MODERATE,HIGH}) returns ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["a patient and a physician exist"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-004", full_name: "Corner Four", date_of_birth: "1963-04-04" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000003" }, as: RehabCoordinator, captures: { phy: $.data.id } }
          trigger:
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "SEVERE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_INVALID_ENUM"
            - "trigger HTTP status == 400"

      - name: program_computed_counters_start_zero
        claim_type: computed_fields
        grounds:
          - 'entities.RehabProgram.fields.sessions_used'
          - 'entities.RehabProgram.fields.total_billed_cents'
        distinguishing_aspect: "A freshly created program reports computed sessions_used==0 and total_billed_cents==0 regardless of input."
        test_recipe:
          setup: ["an ACCEPTED referral"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-005", full_name: "Corner Five", date_of_birth: "1964-05-05" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000004" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "LOW" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
          trigger:
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id, su: $.data.sessions_used } }
          assert:
            - "RehabProgram.${prog}.sessions_used == 0"
            - "RehabProgram.${prog}.total_billed_cents == 0 and outstanding_balance_cents == 0"

      - name: sessions_list_filtered_by_program_paginates
        claim_type: listing
        grounds:
          - 'entities.RehabSession'
          - 'endpoints["GET /rehab/sessions"]'
        distinguishing_aspect: "GET /rehab/sessions?program_id returns the program's sessions with pagination fields (total_count, has_more)."
        test_recipe:
          setup: ["ACTIVE program with two SCHEDULED sessions"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-006", full_name: "Corner Six", date_of_birth: "1965-06-06" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000005" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP C", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-C6", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { s1: $.data.id } }
            - { call: "GET /rehab/programs/${prog}", payload: {}, as: RehabCoordinator, captures: { pv2: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T11:00:00Z", scheduled_end: "2026-05-04T12:00:00Z", expected_program_version: "${pv2}" }, as: RehabCoordinator, captures: { s2: $.data.id } }
          trigger:
            - { call: "GET /rehab/sessions", payload: { program_id: "${prog}" }, as: RehabCoordinator, captures: { first: "$.data[0].id" } }
          assert:
            - "response envelope meta pagination total_count == 2 and has_more == false"
            - "both ${s1} and ${s2} appear in data[]"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: claim_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - 'state_machines.BillingClaim'
          - 'entities.BillingClaim.fields.status'
        distinguishing_aspect: "A newly created BillingClaim starts in DRAFT."
        test_recipe:
          setup: ["ACTIVE MODERATE program on TELEMETRY station; one COMPLETED session; APPROVED authorization"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-007", full_name: "Corner Seven", date_of_birth: "1966-07-07" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000006" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP C", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-C7", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { sess: $.data.id } }
            - { call: "POST /rehab/sessions/${sess}/complete", payload: { post_spo2: 95, rpe: 12, exercise_minutes: 30 }, as: RehabClinician, as_user_id: "${clin}" }
          trigger:
            - { call: "POST /rehab/claims", payload: { program_id: "${prog}", session_id: "${sess}", authorization_id: "${auth}" }, as: BillingSpecialist, captures: { claim: $.data.id, stat: $.data.status } }
          assert:
            - "BillingClaim.${claim}.status == DRAFT"

      - name: complete_already_completed_session_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - 'state_machines.RehabSession.SCHEDULED_to_COMPLETED'
          - 'errors[ERR_SESSION_NOT_SCHEDULED]'
        distinguishing_aspect: "Completing a session already COMPLETED returns ERR_SESSION_NOT_SCHEDULED (409); no side effects fire twice."
        test_recipe:
          setup: ["ACTIVE program with one COMPLETED session"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-008", full_name: "Corner Eight", date_of_birth: "1967-08-08" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000007" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP C", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-C8", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { sess: $.data.id } }
            - { call: "POST /rehab/sessions/${sess}/complete", payload: { post_spo2: 95, rpe: 12, exercise_minutes: 30 }, as: RehabClinician, as_user_id: "${clin}" }
          trigger:
            - { call: "POST /rehab/sessions/${sess}/complete", payload: { post_spo2: 96, rpe: 11 }, as: RehabClinician, as_user_id: "${clin}", captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_SESSION_NOT_SCHEDULED"
            - "RehabProgram.${prog}.sessions_used == 1 (unchanged; no double count)"

      - name: approve_already_approved_authorization_returns_invalid
        claim_type: invalid_transition
        grounds:
          - 'state_machines.InsuranceAuthorization.PENDING_to_APPROVED'
          - 'errors[ERR_AUTHORIZATION_NOT_PENDING]'
        distinguishing_aspect: "Approving an authorization already APPROVED returns ERR_AUTHORIZATION_NOT_PENDING (409)."
        test_recipe:
          setup: ["a DRAFT program with an APPROVED authorization"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-009", full_name: "Corner Nine", date_of_birth: "1968-09-09" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000008" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "LOW" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
          trigger:
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_AUTHORIZATION_NOT_PENDING"

      - name: decision_on_declined_referral_returns_not_pending
        claim_type: idempotency
        grounds:
          - 'state_machines.Referral.PENDING_to_DECLINED'
          - 'errors[ERR_REFERRAL_NOT_PENDING]'
        distinguishing_aspect: "A second decision on a referral already DECLINED (terminal) returns ERR_REFERRAL_NOT_PENDING (409)."
        test_recipe:
          setup: ["a DECLINED referral"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-010", full_name: "Corner Ten", date_of_birth: "1969-10-10" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000009" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "LOW" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "DECLINE" }, as: RehabCoordinator }
          trigger:
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_REFERRAL_NOT_PENDING"

      - name: withdraw_terminal_program_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - 'state_machines.RehabProgram'
          - 'errors[ERR_PROGRAM_ALREADY_TERMINAL]'
        distinguishing_aspect: "Withdrawing a program already WITHDRAWN (terminal) returns ERR_PROGRAM_ALREADY_TERMINAL (409)."
        test_recipe:
          setup: ["a WITHDRAWN program (withdrawn from DRAFT)"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-011", full_name: "Corner Eleven", date_of_birth: "1970-11-11" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000010" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "LOW" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/programs/${prog}/withdraw", payload: { reason: "patient declined" }, as: RehabCoordinator }
          trigger:
            - { call: "POST /rehab/programs/${prog}/withdraw", payload: {}, as: RehabCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_PROGRAM_ALREADY_TERMINAL"

      - name: discharge_creates_maintenance_and_fails_open_goals
        claim_type: side_effect_execution
        grounds:
          - 'state_machines.RehabProgram.ACTIVE_to_DISCHARGED'
          - 'entities.MaintenanceProgram'
          - 'entities.CarePlanItem.fields.status'
        distinguishing_aspect: "Discharge creates an ACTIVE MaintenanceProgram AND flips all OPEN GOAL CarePlanItems to NOT_ACHIEVED."
        test_recipe:
          setup: ["ACTIVE program with FINALIZED baseline+discharge 6MWT and one OPEN GOAL item; no scheduled sessions"]
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "C-012", full_name: "Corner Twelve", date_of_birth: "1971-12-12" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr C", npi: "2000000011" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP C", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
