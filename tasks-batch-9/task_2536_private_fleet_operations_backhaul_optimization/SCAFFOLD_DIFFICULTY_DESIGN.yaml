  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: store_case_ledger_returns_to_zero_after_a_trip_cancel
        grounds:
          - entities.Store.open_scheduled_cases
          - state_machines.ReplenishmentOrder
          - endpoints[POST /fleet/trips/{trip_id}/plan]
          - endpoints[POST /fleet/trips/{trip_id}/cancel]
          - endpoints[POST /fleet/replenishment-orders/{order_id}/cancel]
        distinguishing_aspect: |
          CONSERVED QUANTITY: Store.open_scheduled_cases, which must equal the
          sum of ReplenishmentOrder.cases over that store's SCHEDULED orders at
          every observable instant. Planning adds 900 to the ledger and
          cancelling the trip removes exactly 900, returning the order to
          UNSCHEDULED. A second order is cancelled from UNSCHEDULED to prove
          the ledger only ever tracks the SCHEDULED filter and that an
          untracked row's removal must NOT touch it. This is a case-count
          ledger on a Store; the other two instances conserve money and safety
          points on entirely different entities.
        test_recipe:
          setup:
            - "Store S-1012 unloads 600 cases/hour with 2 doors, around the clock."
            - "Order OA-1 carries 900 cases and will be planned; order OA-2 carries 500 cases and stays UNSCHEDULED for the whole recipe."
            - "TRIP-W has one 900-case DELIVERY (service 105) and is staffed, so it can be planned and then cancelled from PLANNED."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1012", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_s12_id: $.data.id, s12_open_0: $.data.open_scheduled_cases, s12_delivered_0: $.data.delivered_cases_total }
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-MSP", region_code: "MIDWEST", tractor_capacity: 18, driver_headcount_target: 9, fixed_ownership_cents_per_day: 9000, overhead_cents_per_day: 2800, dedicated_rate_cents_per_mile: 268, dedicated_rate_cents_per_case: 194 }
              as: FleetPlanner
              captures: { dom_msp_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_a_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-110", domicile_id: "${dom_msp_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2011-08-08" }
              as: TransportManager
              captures: { drv_110_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-551", domicile_id: "${dom_msp_id}", odometer_miles: 10000, pm_interval_miles: 25000, pm_last_service_odometer: 9000 }
              as: MaintenanceCoordinator
              captures: { trc_551_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-951", domicile_id: "${dom_msp_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trl_951_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s12_id}", cases: 900, weight_lbs: 19500, requested_window_start: "2026-08-12T08:00:00Z", requested_window_end: "2026-08-12T14:00:00Z", temperature_mode: "DRY", priority: 3 }
              as: FleetPlanner
              captures: { ord_a1_id: $.data.id, ord_a1_status0: $.data.status }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s12_id}", cases: 500, weight_lbs: 11000, requested_window_start: "2026-08-12T08:00:00Z", requested_window_end: "2026-08-12T14:00:00Z", temperature_mode: "DRY", priority: 3 }
              as: FleetPlanner
              captures: { ord_a2_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-W", domicile_id: "${dom_msp_id}", planned_start_at: "2026-08-12T06:00:00Z" }
              as: FleetPlanner
              captures: { trip_w_id: $.data.id }
            - call: "POST /fleet/trips/${trip_w_id}/stops"
