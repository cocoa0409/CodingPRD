# =============================================================================
# §1.9 Scaffold Corner Design — coverage of every §1.1–§1.7 claim not already
# covered by §1.8. Names are unique across both design files.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: association_create_persists_fields_and_defaults
        claim_type: creation
        grounds: [entities.Association]
        distinguishing_aspect: "POST /mls/associations with all required fields returns 201 with consolidation_state ACTIVE, consolidated_into_id null, sanction_credit_cap_cents default 200000 when omitted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "E1", name: "Ent Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id, cap: $.data.sanction_credit_cap_cents }
          trigger:
            - call: "GET /mls/associations/${a_id}"
              payload: {}
              as: AssociationStaff
          assert:
            - "response 200; consolidation_state == ACTIVE; consolidated_into_id == null; version == 1"
            - "cap == 200000 (default applied when omitted)"
      - name: member_create_missing_required_member_nr_returns_invalid_request
        claim_type: required_fields
        grounds:
                  - entities.Member
                  - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting member_nr (source: input, no default) yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Association A exists"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "E2", name: "Req Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /mls/associations/${a_id}/members"
              payload: { full_name: "No Number" }
              as: AssociationStaff
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"
      - name: member_computed_fields_cannot_be_set_via_input
        claim_type: computed_fields
        grounds: [entities.Member.fields.sanction_credit_balance_cents, entities.Member.fields.strikes_12m]
        distinguishing_aspect: "Computed fields are not part of the member-create input schema; attempting to smuggle them yields 400 ERR_INVALID_REQUEST (unknown field), and a clean create starts both at 0."
        test_recipe:
          setup: ["Association A exists"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "E3", name: "Comp Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MX", full_name: "Sneaky", sanction_credit_balance_cents: 999999, strikes_12m: 42 }
              as: AssociationStaff
              captures: { err: $.data.error_id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MY", full_name: "Clean" }
              as: AssociationStaff
              captures: { bal: $.data.sanction_credit_balance_cents, strikes: $.data.strikes_12m }
          assert:
            - "err == ERR_INVALID_REQUEST (unknown/computed fields rejected from input)"
            - "Clean create: bal == 0 and strikes == 0 (computed defaults)"
      - name: consolidation_event_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.ConsolidationEvent]
        distinguishing_aspect: "ConsolidationEvent has common_fields: false — response carries id and created_at but no version field, and no PUT/PATCH endpoint exists for it."
        test_recipe:
          setup: ["Two associations exist"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "E4S", name: "Surv", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { s_id: $.data.id }
            - call: "POST /mls/associations"
              payload: { association_code: "E4A", name: "Abs", membership_dues_cents: 90000, late_fee_tier1_cents: 4000, late_fee_tier2_cents: 12000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /mls/associations/${s_id}/consolidations"
              payload: { absorbed_association_id: "${a_id}", effective_at: "2027-01-01T00:00:00Z" }
              as: AssociationStaff
              captures: { ce: $.data }
          assert:
            - "ConsolidationEvent response has id and created_at and no version key"
            - "ConsolidationEvent.status == SCHEDULED"
      - name: listing_get_not_found_wrong_office_scope
        claim_type: not_found
        grounds:
                  - entities.Listing
                  - errors[ERR_NOT_FOUND]
                  - validations[priority=3]
        distinguishing_aspect: "Listing exists but is fetched under the WRONG office id — nested scope validation returns 404 ERR_NOT_FOUND, not the listing."
        test_recipe:
          setup: ["Association A; broker MB; offices O1, O2; listing L created under O1"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "E5", name: "Scope Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { o1_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/offices"
              payload: { office_code: "O2", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { o2_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/offices/${o1_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-E5", property_address: "1 Scope St", list_price_cents: 20000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { l_id: $.data.id }
          trigger:
            - call: "GET /mls/associations/${a_id}/offices/${o2_id}/listings/${l_id}"
              payload: {}
              as: AssociationStaff
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (404, wrong office scope)"
      - name: cross_association_member_fk_rejected_on_citation
        claim_type: parent_relationships
        grounds:
                  - entities.Citation.fields.member_id
                  - errors[ERR_CROSS_ASSOCIATION_REFERENCE]
                  - validations[priority=11]
        distinguishing_aspect: "Citation created in association A referencing a member of association B is rejected 422 ERR_CROSS_ASSOCIATION_REFERENCE."
        test_recipe:
          setup: ["Associations A, B; member MB2 in B; FineSchedule INACCURACY on A"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "E6A", name: "Assoc A", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations"
              payload: { association_code: "E6B", name: "Assoc B", membership_dues_cents: 90000, late_fee_tier1_cents: 4000, late_fee_tier2_cents: 12000 }
              as: AssociationStaff
              captures: { b_id: $.data.id }
            - call: "POST /mls/associations/${b_id}/members"
              payload: { member_nr: "MB2", full_name: "Bee Member" }
              as: AssociationStaff
              captures: { mb2_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/fine-schedules"
              payload: { rule_code: "INACCURACY", fine_amount_cents: 30000, effective_from: "2026-01-01T00:00:00Z" }
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${a_id}/citations"
              payload: { member_id: "${mb2_id}", rule_code: "INACCURACY" }
              as: AssociationStaff
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CROSS_ASSOCIATION_REFERENCE (422)"
      - name: listing_enum_status_rejects_invalid_value
        claim_type: type_constraints
        grounds:
                  - entities.Listing.fields.status
                  - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /status with to_status not in the machine's allowed set (e.g. 'ARCHIVED') yields 400 ERR_INVALID_REQUEST, not ERR_INVALID_STATE."
        test_recipe:
          setup: ["Association A; broker MB; office O; DRAFT listing L"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "E7", name: "Enum Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { o_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/offices/${o_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-E7", property_address: "7 Enum Ave", list_price_cents: 20000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /mls/associations/${a_id}/offices/${o_id}/listings/${l_id}/status"
              payload: { to_status: "ARCHIVED", business_effective_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400; enum violation precedes state-machine checks)"
      - name: members_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Member]
        distinguishing_aspect: "GET .../members?limit=2 returns envelope with pagination fields limit/offset/total_count/has_more; total_count reflects all members, has_more true when more pages exist."
        test_recipe:
          setup: ["Association A with 3 members"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "E8", name: "Page Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "P1", full_name: "One" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "P2", full_name: "Two" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "P3", full_name: "Three" }
              as: AssociationStaff
          trigger:
            - call: "GET /mls/associations/${a_id}/members?limit=2&offset=0"
              payload: {}
              as: AssociationStaff
          assert:
            - "response envelope contains meta.api_request_id, response_type == 'array', data array length == 2"
            - "pagination: limit == 2, offset == 0, total_count == 3, has_more == true"

  - section: state_machines
    instances:
      - name: citation_pay_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
                  - state_machines.Citation.OPEN_to_PAID
                  - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Second pay on an already-PAID citation fails ERR_INVALID_STATE; no double credit accrual."
        test_recipe:
          setup: ["Association A; member MV; FineSchedule INACCURACY 30000c; citation C paid once"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "S1", name: "SM Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000, sanction_credit_cap_cents: 200000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MV", full_name: "Violator" }
              as: AssociationStaff
              captures: { mv_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/fine-schedules"
              payload: { rule_code: "INACCURACY", fine_amount_cents: 30000, effective_from: "2026-01-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/citations"
              payload: { member_id: "${mv_id}", rule_code: "INACCURACY" }
              as: AssociationStaff
              captures: { c_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/citations/${c_id}/pay"
              payload: { tender_cents: 30000 }
              as: Member
              as_user_id: "${mv_id}"
          trigger:
            - call: "POST /mls/associations/${a_id}/citations/${c_id}/pay"
              payload: { tender_cents: 30000 }
              as: Member
              as_user_id: "${mv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Member.${mv_id}.sanction_credit_balance_cents == 30000 (no double accrual)"
      - name: terminated_member_is_terminal_no_reinstatement
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Member]
        distinguishing_aspect: "TERMINATED is terminal: a second terminate attempt on a TERMINATED member fails ERR_INVALID_STATE; no transition out exists."
        test_recipe:
          setup: ["Association A; member MT suspended via reconcile at 2026-09-11; clock advanced to 2026-12-15 (>= 90 days); terminate once (succeeds)"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "S2", name: "Term Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MT", full_name: "Term" }
              as: AssociationStaff
              captures: { mt_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/dues-periods"
              payload: { year: 2026, period_start_date: "2026-09-01T00:00:00Z", due_date: "2026-09-05T00:00:00Z", grace_end_date: "2026-09-10T00:00:00Z", amount_cents: 100000 }
              as: AssociationStaff
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /mls/associations/${a_id}/dues-periods/${p_id}/bill"
              payload: { expected_dues_period_version: "${p_v}" }
              as: AssociationStaff
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/dues-periods/${p_id}/reconcile"
              payload: {}
              as: AssociationStaff
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/members/${mt_id}/terminate"
              payload: {}
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${a_id}/members/${mt_id}/terminate"
              payload: {}
              as: AssociationStaff
              captures: { err: $.data.error_id }
          assert:
            - "Member.${mt_id}.membership_state == TERMINATED after first terminate (>= 90 days suspended)"
            - "Second terminate rejected err == ERR_INVALID_STATE (terminal lockdown)"
      - name: office_broker_suspension_cascades_and_reinstatement_restores
        claim_type: side_effect_execution
        grounds: [state_machines.Office.ACTIVE_to_SUSPENDED, state_machines.Office.SUSPENDED_to_ACTIVE, state_machines.Member.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Broker suspension suspends the office; paying the broker's last PENDING invoice reinstates member AND office in one cascade; a non-broker member's payment leaves the office SUSPENDED."
        test_recipe:
          setup: ["Association A; broker MB + agent MA; office O brokered by MB; dues period billed; both invoices unpaid; reconcile suspends both"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "S3", name: "Cascade Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MA", full_name: "Agent" }
              as: AssociationStaff
              captures: { ma_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { o_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/dues-periods"
              payload: { year: 2026, period_start_date: "2026-09-01T00:00:00Z", due_date: "2026-09-05T00:00:00Z", grace_end_date: "2026-09-10T00:00:00Z", amount_cents: 100000 }
              as: AssociationStaff
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /mls/associations/${a_id}/dues-periods/${p_id}/bill"
              payload: { expected_dues_period_version: "${p_v}" }
              as: AssociationStaff
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/dues-periods/${p_id}/reconcile"
              payload: {}
              as: AssociationStaff
            - call: "GET /mls/dues-invoices?dues_period_id=${p_id}&member_id=${ma_id}"
              payload: {}
              as: AssociationStaff
              captures: { ma_inv: "$.data[0].id" }
            - call: "GET /mls/dues-invoices?dues_period_id=${p_id}&member_id=${mb_id}"
              payload: {}
              as: AssociationStaff
              captures: { mb_inv: "$.data[0].id" }
          trigger:
            - call: "POST /mls/associations/${a_id}/dues-invoices/${ma_inv}/pay"
              payload: { tender_cents: 100000 }
              as: Member
              as_user_id: "${ma_id}"
            - call: "GET /mls/associations/${a_id}/offices/${o_id}"
              payload: {}
              as: AssociationStaff
              captures: { office_mid: $.data.status }
            - call: "POST /mls/associations/${a_id}/dues-invoices/${mb_inv}/pay"
              payload: { tender_cents: 100000 }
              as: Member
              as_user_id: "${mb_id}"
            - call: "GET /mls/associations/${a_id}/offices/${o_id}"
              payload: {}
              as: AssociationStaff
              captures: { office_end: $.data.status }
          assert:
            - "office_mid == SUSPENDED (agent MA reinstated but broker still suspended)"
            - "office_end == ACTIVE after broker MB pays (bubble-up reinstatement)"
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.Listing, state_machines.DataLicense, state_machines.HearingPanel]
        distinguishing_aspect: "New Listing is DRAFT; new DataLicense is PENDING with feed_sync_state STALE; new HearingPanel is CONVENED."
        test_recipe:
          setup: ["Association A; member MB; office O; FineSchedule INACCURACY; pool members P1,P2,P3; citation C for MB; hearing requested"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "S4", name: "Init Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "P1", full_name: "P1" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "P2", full_name: "P2" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "P3", full_name: "P3" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { o_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/fine-schedules"
              payload: { rule_code: "INACCURACY", fine_amount_cents: 30000, effective_from: "2026-01-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/citations"
              payload: { member_id: "${mb_id}", rule_code: "INACCURACY" }
              as: AssociationStaff
              captures: { c_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/citations/${c_id}/request-hearing"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
          trigger:
            - call: "POST /mls/associations/${a_id}/offices/${o_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-S4", property_address: "4 Init St", list_price_cents: 20000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { l_status: $.data.status }
            - call: "POST /mls/associations/${a_id}/data-licenses"
              payload: { licensee_name: "InitPortal", scope: "IDX", display_ruleset_version: 0, listing_field_allowlist: ["property_address"] }
              as: AssociationStaff
              captures: { dl_status: $.data.status, dl_sync: $.data.feed_sync_state }
            - call: "POST /mls/associations/${a_id}/hearing-panels"
              payload: { case_type: "CITATION", case_id: "${c_id}" }
              as: AssociationStaff
              captures: { hp_status: $.data.status }
          assert:
            - "l_status == DRAFT; dl_status == PENDING and dl_sync == STALE; hp_status == CONVENED"
      - name: hearing_window_boundary_day20_allowed_day21_rejected
        claim_type: precondition_enforcement
        grounds:
                  - state_machines.Citation.OPEN_to_HEARING_PENDING
                  - errors[ERR_HEARING_WINDOW_CLOSED]
        distinguishing_aspect: "Hearing requested exactly at assessed_at + 20 days succeeds; at +21 days fails ERR_HEARING_WINDOW_CLOSED."
        test_recipe:
          setup: ["Association A; member MV; FineSchedule INACCURACY 30000c; citations CA and CB both assessed 2026-09-02"]
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "S5", name: "Window Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MV", full_name: "Violator" }
              as: AssociationStaff
              captures: { mv_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/fine-schedules"
