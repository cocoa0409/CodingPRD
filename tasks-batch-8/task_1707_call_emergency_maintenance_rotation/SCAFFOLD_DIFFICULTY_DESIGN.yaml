  # ---------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: response_sla_exact_target_boundary
        grounds:
          - calculations.sla_target_assignment
          - entities.CallTicket.fields.response_breach
          - entities.CallTicket.fields.response_minutes
        distinguishing_aspect: |
          Metric = response MINUTES, exercised through POST /arrive. The breach predicate is
          strictly-greater: exactly 30 minutes on a 30-minute (GAS_LEAK) target is NOT a
          breach; 31 minutes IS. Both tickets share an identical setup except the arrival
          minute.
        test_recipe:
          setup:
            - "T1 (TECHNICIAN) on ACTIVE shift 2026-08-03 09:00-13:00; unit exists"
            - "Ticket A (GAS_LEAK) received/dispatched at 10:00 (clock only advances throughout the chain)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-701", building_code: "B7" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T09:00:00Z", end_at: "2026-08-03T13:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller J", caller_phone: "555-0111", category: "GAS_LEAK", description: "Gas odor" }, as: Dispatcher, captures: { tka: $.data.id } }
            - { call: "POST /v1/call-tickets/${tka}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tka}", as: Dispatcher, captures: { tva: $.data.version } }
            - { call: "POST /v1/call-tickets/${tka}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tva}" }, as: Dispatcher }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tka}/arrive", as: OnCallTechnician, as_user_id: "${t1}", captures: { ra: $.data.response_minutes, ba: $.data.response_breach, ta: $.data.sla_target_minutes } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller K", caller_phone: "555-0112", category: "GAS_LEAK", description: "Gas odor, second call" }, as: Dispatcher, captures: { tkb: $.data.id } }
            - { call: "POST /v1/call-tickets/${tkb}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tkb}", as: Dispatcher, captures: { tvb: $.data.version } }
            - { call: "POST /v1/call-tickets/${tkb}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tvb}" }, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:31:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tkb}/arrive", as: OnCallTechnician, as_user_id: "${t1}", captures: { rb: $.data.response_minutes, bb: $.data.response_breach } }
          assert:
            - "Ticket A: sla_target_minutes == 30, response_minutes == 30, response_breach == false (equality is NOT a breach)"
            - "Ticket B: response_minutes == 31, response_breach == true (31 > 30)"

      - name: vendor_limit_exact_cap_boundary
        grounds:
          - calculations.vendor_exposure_check
          - errors[ERR_VENDOR_LIMIT_EXCEEDED]
          - entities.Vendor.fields.per_incident_limit_cents
        distinguishing_aspect: |
          Metric = authorization amount in CENTS, exercised through POST /authorize (a
          different endpoint and metric than the response-minute boundary). The cap
          predicate is inclusive: amount == per_incident_limit authorizes; amount ==
          limit + 1 cent is rejected with ERR_VENDOR_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Ticket mitigated; work order WO; vendor V1 with per_incident_limit_cents = 50000"
            - "VA1 = 50000 proposed by T1 (self-authorization permitted at exactly the 50000 self-auth cap); VA2 = 50001 proposed by T1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-702", building_code: "B7" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/vendors", payload: { name: "CapExact", trade: "GENERAL", per_incident_limit_cents: 50000 }, as: PropertyAdmin, captures: { v1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller L", caller_phone: "555-0113", category: "LEAK_MINOR", description: "Leak" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T01:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Contained", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}", as: Dispatcher, captures: { wo: "$.data[0].id" } }
            - { call: "POST /v1/call-tickets/${tk}/vendor-authorizations", payload: { work_order_id: "${wo}", vendor_id: "${v1}", amount_cents: 50000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { va1: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/vendor-authorizations", payload: { work_order_id: "${wo}", vendor_id: "${v1}", amount_cents: 50001 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { va2: $.data.id } }
          trigger:
            - { call: "POST /v1/vendor-authorizations/${va1}/authorize", as: OnCallTechnician, as_user_id: "${t1}", captures: { st1: $.data.status } }
            - { call: "POST /v1/vendor-authorizations/${va2}/authorize", as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { err: $.data.error_id } }
          assert:
            - "VA1 (${va1}) authorizes at exactly 50000 == vendor cap (inclusive) and status == AUTHORIZED"
            - "VA2 (${va2}) at 50001 fails with ERR_VENDOR_LIMIT_EXCEEDED (402)"
            - "VA2.status remains PROPOSED"

  # ---------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_close_blocked_until_incident_record_submitted
        grounds:
          - state_machines.CallTicket.MITIGATED_to_CLOSED
          - state_machines.IncidentRecord.DRAFT_to_SUBMITTED
          - errors[ERR_INCIDENT_RECORD_NOT_SUBMITTED]
        distinguishing_aspect: |
          Entity pair CallTicket -> IncidentRecord: the ticket's MITIGATED -> CLOSED
          transition is gated on a DIFFERENT entity's state machine (record must be
          SUBMITTED or beyond); a DRAFT record blocks the close with
          ERR_INCIDENT_RECORD_NOT_SUBMITTED, and submitting unblocks it.
        test_recipe:
          setup:
            - "Ticket mitigated by T1 (unit_uninhabitable=false); IncidentRecord IR exists in DRAFT (created by T1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-801", building_code: "B8" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller M", caller_phone: "555-0114", category: "APPLIANCE", description: "Oven sparking" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T01:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Oven disconnected", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk}/incident-record", payload: { narrative: "Element shorted", estimated_damage_cents: 12000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { ir: $.data.id } }
          trigger:
            - { call: "POST /v1/call-tickets/${tk}/close", as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /v1/incident-records/${ir}/submit", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk}/close", as: Dispatcher, captures: { st: $.data.status } }
          assert:
            - "First close: error_id == ERR_INCIDENT_RECORD_NOT_SUBMITTED (409); ticket stays MITIGATED"
            - "After IR DRAFT -> SUBMITTED, second close succeeds: status == CLOSED"

      - name: relocation_end_blocked_by_open_unit_work_order
        grounds:
          - state_machines.RelocationCase.ACTIVE_to_ENDED
          - state_machines.WorkOrder
          - errors[ERR_WORK_ORDER_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair RelocationCase -> WorkOrder (distinct from the CallTicket ->
          IncidentRecord pairing above): an ACTIVE case cannot END while any of the unit's
          work orders sits in {OPEN, ASSIGNED, IN_PROGRESS, REOPENED}; ON_HOLD orders do not
          block. Cancelling the blocker unblocks the end.
        test_recipe:
          setup:
            - "FLOOD ticket mitigated with unit_uninhabitable=true; auto EMERGENCY_FOLLOWUP WO still OPEN (exempt from the hold cascade, so it blocks the end)"
            - "RelocationCase RC (2026-08-03..2026-08-05, 10000/night) APPROVED by S1 and ACTIVE (clock 2026-08-03T09:00:00Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-802", building_code: "B8" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller N", caller_phone: "555-0115", category: "FLOOD", description: "Water heater burst" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Heater valved off; floors soaked", unit_uninhabitable: true }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}", as: Dispatcher, captures: { wo: "$.data[0].id" } }
            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u1}", call_ticket_id: "${tk}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-05T00:00:00Z", nightly_rate_cents: 10000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { rc: $.data.id } }
            - { call: "POST /v1/relocation-cases/${rc}/approve", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/relocation-cases/${rc}/activate", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
          trigger:
