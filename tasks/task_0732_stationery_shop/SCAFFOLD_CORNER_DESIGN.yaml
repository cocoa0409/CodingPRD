        distinguishing_aspect: "POST /paper-stocks as Customer → 403 ERR_UNAUTHORIZED (peer_roles: Customer is not in the endpoint's allowed set)."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rbac1@x.com", full_name: "U", phone: "555" }
