  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: maintenance_window_buffer_overlap_on_same_grid_zone
        grounds:
          - validations[priority=22]
          - errors.ERR_MAINTENANCE_WINDOW_OVERLAP
          - global_constants.MAINTENANCE_BUFFER_MINUTES
          - entities.MaintenanceWindow.fields.window_start
          - entities.MaintenanceWindow.fields.window_end
        distinguishing_aspect: |
          Two same-zone windows that do not touch as raw intervals still collide once each is widened
          by MAINTENANCE_BUFFER_MINUTES 15: a window starting 04:15 (exactly existing.end + 15 min)
          is ACCEPTED, but one starting 04:05 is REJECTED even though the raw intervals
          [02:00, 04:00) and [04:05, 04:12) are disjoint. Only the buffered predicate
          `new.start < existing.end + 15m AND existing.start < new.end + 15m` reproduces both outcomes.
        test_recipe:
          setup:
            - "One AMBIENT grid zone with no SKUs and no waves."
            - "A SCHEDULED window W1 covering [2026-08-02T02:00:00.000Z, 2026-08-02T04:00:00.000Z)."
            - "A second SCHEDULED window W2 covering [2026-08-02T04:15:00.000Z, 2026-08-02T05:00:00.000Z), accepted because its start sits exactly at W1's end plus the 15-minute buffer."
            - "Logical clock left at its 2026-08-01T00:00:00.000Z boot default, so both windows are in the future and neither has been activated."
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              captures: { zone_amb: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { grid_zone_id: "${zone_amb}", window_start: "2026-08-02T02:00:00.000Z", window_end: "2026-08-02T04:00:00.000Z" }
              as: GridEngineer
              as_user_id: "grid-1"
              captures: { window_1: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { grid_zone_id: "${zone_amb}", window_start: "2026-08-02T04:15:00.000Z", window_end: "2026-08-02T05:00:00.000Z" }
              as: GridEngineer
              as_user_id: "grid-1"
              captures: { window_2: $.data.id }
          trigger:
            - call: "POST /maintenance-windows"
              payload: { grid_zone_id: "${zone_amb}", window_start: "2026-08-02T04:05:00.000Z", window_end: "2026-08-02T04:12:00.000Z" }
              as: GridEngineer
              as_user_id: "grid-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_MAINTENANCE_WINDOW_OVERLAP"
            - "GET /maintenance-windows?grid_zone_id=${zone_amb} returns total_count == 2"
            - "MaintenanceWindow.${window_1}.status == SCHEDULED"
            - "MaintenanceWindow.${window_2}.status == SCHEDULED"
            - "MaintenanceWindow.${window_2}.window_start == 2026-08-02T04:15:00.000Z"
            - "GridZone.${zone_amb}.status == OPERATIONAL"

      - name: dock_bay_aggregate_concurrency_overlap
        grounds:
          - validations[priority=23]
          - errors.ERR_DOCK_BAY_CAPACITY_EXCEEDED
          - entities.DockBay.fields.parallel_van_capacity
          - entities.DeliveryWave.fields.load_start
          - entities.DeliveryWave.fields.load_end
          - state_machines.DeliveryWave.FORMING_to_FORMING
        distinguishing_aspect: |
          No single pair of dock reservations breaches the bay: W1 [08:00, 09:00) and W2
          [08:30, 09:30) overlap only two-deep against a parallel_van_capacity of 2, and W4
          [09:30, 10:00) is accepted because half-open intervals that merely touch W2's end do not
          overlap. Only the AGGREGATE count at instant 08:45 — where W1, W2 and W3 would coexist —
          exceeds 2, so the violation is invisible to any pairwise check.
