  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invoice_payment_state_error_beats_fiscal_error
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVOICE_NOT_ISSUED]
          - errors[ERR_PAYMENT_EXCEEDS_OUTSTANDING]
