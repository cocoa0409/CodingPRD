          setup:
            - "Railroads BN/CX, car type XM, junction JCT-CHI and CX-owned car CX 100001 all exist; the clock is 2026-08-26T00:00:00Z. The unused UUID 77777777-7777-4777-8777-777777777777 stands in for every dangling reference."
