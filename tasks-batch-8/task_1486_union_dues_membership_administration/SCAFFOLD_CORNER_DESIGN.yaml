  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_transfer_stale_member_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transfer-create-stale-member]", "errors[ERR_STALE_MEMBER_VERSION]"]
        distinguishing_aspect: "After a first transfer create bumps Member.version to 2, a second create carrying the stale observed version 1 is a 412 — two strictly sequential requests, deterministic."
        test_recipe:
          setup: ["FLAT locals L1, L2; member M ACTIVE (version 1 captured at creation)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l1: "$.data.id" }
            - call: "POST /api/locals"
              payload: { name: "Local 400", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l2: "$.data.id" }
            - call: "POST /api/locals/${l1}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${l1}", classification_id: "${cls}", full_name: "Occ Olga", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id", m_v: "$.data.version" }
          trigger:
            - call: "POST /api/members/${mem}/transfers"
              payload: { to_local_id: "${l2}", effective_period: "2026-09", expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${mem}"
              captures: { tr1: "$.data.id" }
            - call: "POST /api/members/${mem}/transfers"
              payload: { to_local_id: "${l2}", effective_period: "2026-10", expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${mem}"
              captures: { err: "$.data.error_id" }
          assert:
            - "first create with the observed version ${m_v} == 1 succeeds: ${tr1} is a UUID (member version now 2)"
            - "second create with the SAME stale version: ${err} == ERR_STALE_MEMBER_VERSION (412) — it would otherwise silently supersede ${tr1}"

      - name: occ_percapita_stale_local_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[percapita-report-create-stale-local]", "errors[ERR_STALE_LOCAL_VERSION]"]
        distinguishing_aspect: "After the first report create bumps Local.version to 2, a second create for the same period carrying version 1 is a 412."
        test_recipe:
          setup: ["PCT local (version 1 captured at creation)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
