# =============================================================================
# §1.8: Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# Conventions: agency created with commission_pct 0.15, slush_capacity 50 unless
# an instance says otherwise. All periods start at 0; no wall-clock waits.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_split_provisional_vs_final_on_installments
        grounds:
          - calculations.commission_split
          - entities.AdvanceInstallment.fields.agency_commission_cents
          - entities.ClientAgreement.fields.commission_pct_override
        distinguishing_aspect: |
          Same calculation (commission_split) on the same entity domain
          (AdvanceInstallment of a Deal): the provisional variant (override null,
          agency rate 0.15 at event time) yields 37500 on a 250000 installment,
          while the final variant (locked override 0.10) yields 25000 on an
          identical installment — proving the variant is selected by the
          agreement's override, not by the amount.
        test_recipe:
          setup:
            - "Agency commission_pct 0.15; one agent; one author (CLIENT after first accept); two editors"
            - "Pipeline A: manuscript A accepted, agreement A (override null) SIGNED, round A open, submission A sent to editor A, offer A advance 500000 pcts 0.10/0.08/0.25 no rights, accepted by ContractsManager cm-1, deal A executed at period 0"
            - "Pipeline B: manuscript B accepted, agreement B (override 0.10) SIGNED, round B open, submission B sent to editor B, offer B advance 500000 same pcts, accepted by cm-1, deal B executed at period 0"
            - "Both deals produce an ON_SIGNING installment of floor(500000*0.50) = 250000"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency DV", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "ImprintA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed B", imprint: "ImprintB", email: "edb@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edB: $.data.id } }
            # --- pipeline A (override null) ---
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { qA: $.data.id } }
            - { call: "POST /query-letters/${qA}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${qA}/request-manuscript", payload: { title: "Book A" }, as: Agent, as_user_id: "${agent1}", captures: { msA: $.data.id } }
            - { call: "POST /manuscripts/${msA}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${msA}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${msA}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${msA}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agrA: $.data.id } }
            - { call: "POST /client-agreements/${agrA}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agrA}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${msA}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { rA: $.data.id, rvA: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${rA}", editor_id: "${edA}" }, as: Agent, as_user_id: "${agent1}", captures: { sA: $.data.id } }
            - { call: "POST /submission-rounds/${rA}/open", payload: { expected_submission_round_version: "${rvA}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${sA}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /offers", payload: { submission_id: "${sA}", advance_cents: 500000, royalty_pct_hardcover: 0.10, royalty_pct_trade: 0.08, royalty_pct_ebook: 0.25 }, as: Agent, as_user_id: "${agent1}", captures: { oA: $.data.id } }
            - { call: "POST /offers/${oA}/accept", payload: {}, as: ContractsManager, as_user_id: "cm-1" }
            - { call: "GET /deals", payload: { offer_id: "${oA}" }, as: ContractsManager, as_user_id: "cm-1", captures: { dA: "$.data[0].id", dvA: "$.data[0].version" } }
            - { call: "POST /deals/${dA}/execute", payload: { expected_deal_version: "${dvA}" }, as: ContractsManager, as_user_id: "cm-1" }
            # --- pipeline B (override 0.10) ---
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "NONFICTION", word_count: 80000 }, as: Agent, as_user_id: "${agent1}", captures: { qB: $.data.id } }
            - { call: "POST /query-letters/${qB}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${qB}/request-manuscript", payload: { title: "Book B" }, as: Agent, as_user_id: "${agent1}", captures: { msB: $.data.id } }
            - { call: "POST /manuscripts/${msB}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${msB}/evaluate", payload: { eval_score: 85 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${msB}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${msB}", agent_id: "${agent1}", commission_pct_override: 0.10 }, as: Agent, as_user_id: "${agent1}", captures: { agrB: $.data.id } }
            - { call: "POST /client-agreements/${agrB}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agrB}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${msB}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { rB: $.data.id, rvB: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${rB}", editor_id: "${edB}" }, as: Agent, as_user_id: "${agent1}", captures: { sB: $.data.id } }
            - { call: "POST /submission-rounds/${rB}/open", payload: { expected_submission_round_version: "${rvB}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${sB}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /offers", payload: { submission_id: "${sB}", advance_cents: 500000, royalty_pct_hardcover: 0.10, royalty_pct_trade: 0.08, royalty_pct_ebook: 0.25 }, as: Agent, as_user_id: "${agent1}", captures: { oB: $.data.id } }
            - { call: "POST /offers/${oB}/accept", payload: {}, as: ContractsManager, as_user_id: "cm-1" }
            - { call: "GET /deals", payload: { offer_id: "${oB}" }, as: ContractsManager, as_user_id: "cm-1", captures: { dB: "$.data[0].id", dvB: "$.data[0].version" } }
            - { call: "POST /deals/${dB}/execute", payload: { expected_deal_version: "${dvB}" }, as: ContractsManager, as_user_id: "cm-1" }
          trigger:
            - { call: "GET /advance-installments", payload: { deal_id: "${dA}", milestone: "ON_SIGNING" }, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { iA: "$.data[0].id" } }
            - { call: "POST /advance-installments/${iA}/mark-paid", payload: {}, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { iA_comm: $.data.agency_commission_cents, iA_amt: $.data.amount_cents } }
            - { call: "GET /advance-installments", payload: { deal_id: "${dB}", milestone: "ON_SIGNING" }, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { iB: "$.data[0].id" } }
            - { call: "POST /advance-installments/${iB}/mark-paid", payload: {}, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { iB_comm: $.data.agency_commission_cents, iB_amt: $.data.amount_cents } }
          assert:
            - "AdvanceInstallment.${iA}.amount_cents == 250000"
            - "AdvanceInstallment.${iB}.amount_cents == 250000"
            - "AdvanceInstallment.${iA}.agency_commission_cents == 37500   # provisional: floor(250000 * 0.15)"
            - "AdvanceInstallment.${iB}.agency_commission_cents == 25000   # final: floor(250000 * 0.10 locked override)"
            - "${iA_comm} != ${iB_comm}"

      - name: auction_ranking_frontlist_vs_backlist_rank_flip
        grounds:
          - calculations.auction_ranking
          - entities.Offer.fields.auction_rank
          - entities.SubmissionRound.fields.valuation_mode
        distinguishing_aspect: |
          A second dual-variant calculation on a DIFFERENT entity domain (Offer,
          negotiation domain — not the AdvanceInstallment ledger domain of the
          sibling instance): identical offer terms rank B first under the
          frontlist variant (210000 > 120000) but A first under the backlist
          variant (1612000 > 206000), a full rank flip caused solely by
          valuation_mode.
        test_recipe:
          setup:
            - "Agency; one agent; one author; four editors (edF1, edF2, edB1, edB2)"
            - "Two accepted manuscripts (msF, msB) each with a SIGNED agreement"
            - "Round F on msF: auction_mode=true, valuation_mode=FRONTLIST, open, submissions to edF1 and edF2 both SENT"
            - "Round B on msB: auction_mode=true, valuation_mode=BACKLIST, open, submissions to edB1 and edB2 both SENT"
            - "Offer A terms on the edF1/edB1 submissions: advance 2600000, pcts 0.10/0.05/0.05, includes_film_rights=true"
            - "Offer B terms on the edF2/edB2 submissions: advance 200000, pcts 0.05/0.025/0.025, no rights"
            - "Composite values — frontlist: A=120000, B=210000; backlist: A=1612000, B=206000"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency AR", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed F1", imprint: "IF1", email: "ef1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edF1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed F2", imprint: "IF2", email: "ef2@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edF2: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed B1", imprint: "IB1", email: "eb1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edB1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed B2", imprint: "IB2", email: "eb2@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edB2: $.data.id } }
            # --- manuscript F ---
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { qF: $.data.id } }
            - { call: "POST /query-letters/${qF}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${qF}/request-manuscript", payload: { title: "Book F" }, as: Agent, as_user_id: "${agent1}", captures: { msF: $.data.id } }
            - { call: "POST /manuscripts/${msF}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${msF}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${msF}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${msF}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agrF: $.data.id } }
            - { call: "POST /client-agreements/${agrF}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agrF}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            # --- manuscript B ---
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "NONFICTION", word_count: 80000 }, as: Agent, as_user_id: "${agent1}", captures: { qB: $.data.id } }
            - { call: "POST /query-letters/${qB}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${qB}/request-manuscript", payload: { title: "Book B" }, as: Agent, as_user_id: "${agent1}", captures: { msB: $.data.id } }
            - { call: "POST /manuscripts/${msB}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${msB}/evaluate", payload: { eval_score: 85 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${msB}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${msB}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agrB: $.data.id } }
            - { call: "POST /client-agreements/${agrB}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agrB}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            # --- round F (FRONTLIST) ---
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${msF}", agent_id: "${agent1}", max_editors: 5, auction_mode: true, valuation_mode: "FRONTLIST" }, as: Agent, as_user_id: "${agent1}", captures: { rF: $.data.id, rvF: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${rF}", editor_id: "${edF1}" }, as: Agent, as_user_id: "${agent1}", captures: { sF1: $.data.id } }
            - { call: "POST /submissions", payload: { submission_round_id: "${rF}", editor_id: "${edF2}" }, as: Agent, as_user_id: "${agent1}", captures: { sF2: $.data.id } }
            - { call: "POST /submission-rounds/${rF}/open", payload: { expected_submission_round_version: "${rvF}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${sF1}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${sF2}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            # --- round B (BACKLIST) ---
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${msB}", agent_id: "${agent1}", max_editors: 5, auction_mode: true, valuation_mode: "BACKLIST" }, as: Agent, as_user_id: "${agent1}", captures: { rB: $.data.id, rvB: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${rB}", editor_id: "${edB1}" }, as: Agent, as_user_id: "${agent1}", captures: { sB1: $.data.id } }
            - { call: "POST /submissions", payload: { submission_round_id: "${rB}", editor_id: "${edB2}" }, as: Agent, as_user_id: "${agent1}", captures: { sB2: $.data.id } }
            - { call: "POST /submission-rounds/${rB}/open", payload: { expected_submission_round_version: "${rvB}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${sB1}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${sB2}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
          trigger:
            - { call: "POST /offers", payload: { submission_id: "${sF1}", advance_cents: 2600000, royalty_pct_hardcover: 0.10, royalty_pct_trade: 0.05, royalty_pct_ebook: 0.05, includes_film_rights: true }, as: Agent, as_user_id: "${agent1}", captures: { oFA: $.data.id } }
            - { call: "POST /offers", payload: { submission_id: "${sF2}", advance_cents: 200000, royalty_pct_hardcover: 0.05, royalty_pct_trade: 0.025, royalty_pct_ebook: 0.025 }, as: Agent, as_user_id: "${agent1}", captures: { oFB: $.data.id } }
            - { call: "POST /offers", payload: { submission_id: "${sB1}", advance_cents: 2600000, royalty_pct_hardcover: 0.10, royalty_pct_trade: 0.05, royalty_pct_ebook: 0.05, includes_film_rights: true }, as: Agent, as_user_id: "${agent1}", captures: { oBA: $.data.id } }
            - { call: "POST /offers", payload: { submission_id: "${sB2}", advance_cents: 200000, royalty_pct_hardcover: 0.05, royalty_pct_trade: 0.025, royalty_pct_ebook: 0.025 }, as: Agent, as_user_id: "${agent1}", captures: { oBB: $.data.id } }
            - { call: "GET /offers/${oFA}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { rFA: $.data.auction_rank } }
            - { call: "GET /offers/${oFB}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { rFB: $.data.auction_rank } }
            - { call: "GET /offers/${oBA}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { rBA: $.data.auction_rank } }
            - { call: "GET /offers/${oBB}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { rBB: $.data.auction_rank } }
          assert:
            - "Offer.${oFB}.auction_rank == 1   # frontlist: 210000 > 120000"
            - "Offer.${oFA}.auction_rank == 2"
            - "Offer.${oBA}.auction_rank == 1   # backlist: 1612000 > 206000 — rank flip on identical terms"
            - "Offer.${oBB}.auction_rank == 2"
            - "${rFA} != ${rBA}"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes (a) and (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_reconciliation_tiered_formula_full_compute
        grounds:
          - calculations.royalty_reconciliation
          - entities.RoyaltyStatement.fields.gross_royalty_cents
        distinguishing_aspect: |
          Mode (a) — a formula with >= 3 inputs (units, receipts, three royalty
          pcts) and non-linear interaction (per-format tier thresholds 5000/7500,
          escalator branch on units beyond threshold, floor-then-sum rounding
          pinned): full execution yields gross 1136000 = 625000 (hardcover:
          5000x100 + 1000x125) + 261000 (trade: 7500x32 + 500x42) + 250000
          (ebook whole-format).
        test_recipe:
          setup:
            - "Standard pipeline: accepted manuscript, SIGNED agreement (no override, agency pct 0.15), round open (non-auction), submission SENT, offer advance 1000000 pcts 0.10/0.08/0.25 NET no rights, accepted, deal executed at period 0"
            - "Statement: period 0, units 6000/8000/10000, receipts 6000000/3200000/1000000, publisher_reported 1136000"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency RR", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "Book One" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms1}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr1: $.data.id } }
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${ms1}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { r1: $.data.id, rv1: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${r1}", editor_id: "${edA}" }, as: Agent, as_user_id: "${agent1}", captures: { s1: $.data.id } }
            - { call: "POST /submission-rounds/${r1}/open", payload: { expected_submission_round_version: "${rv1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${s1}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /offers", payload: { submission_id: "${s1}", advance_cents: 1000000, royalty_pct_hardcover: 0.10, royalty_pct_trade: 0.08, royalty_pct_ebook: 0.25 }, as: Agent, as_user_id: "${agent1}", captures: { o1: $.data.id } }
            - { call: "POST /offers/${o1}/accept", payload: {}, as: ContractsManager, as_user_id: "cm-1" }
            - { call: "GET /deals", payload: { offer_id: "${o1}" }, as: ContractsManager, as_user_id: "cm-1", captures: { d1: "$.data[0].id", dv1: "$.data[0].version" } }
            - { call: "POST /deals/${d1}/execute", payload: { expected_deal_version: "${dv1}" }, as: ContractsManager, as_user_id: "cm-1" }
          trigger:
            - { call: "POST /royalty-statements", payload: { deal_id: "${d1}", period_index: 0, units_hardcover: 6000, units_trade: 8000, units_ebook: 10000, net_receipts_hardcover_cents: 6000000, net_receipts_trade_cents: 3200000, net_receipts_ebook_cents: 1000000, publisher_reported_royalty_cents: 1136000 }, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { rs1: $.data.id } }
            - { call: "POST /royalty-statements/${rs1}/reconcile", payload: {}, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { gross: $.data.gross_royalty_cents, comm: $.data.agency_commission_cents, net: $.data.author_net_cents, varc: $.data.variance_cents } }
          assert:
            - "RoyaltyStatement.${rs1}.gross_royalty_cents == 1136000   # 625000 hc + 261000 trade + 250000 ebook"
            - "RoyaltyStatement.${rs1}.agency_commission_cents == 170400   # floor(1136000 * 0.15)"
            - "RoyaltyStatement.${rs1}.author_net_cents == 965600"
            - "RoyaltyStatement.${rs1}.variance_cents == 0"
            - "RoyaltyStatement.${rs1}.status == RECONCILED"
            - "Deal.${d1}.advance_earned_out_cents == 965600   # min(1000000, 0 + 965600)"

      - name: advance_waterfall_remainder_bucket_absorbs_rounding
        grounds:
          - calculations.advance_waterfall
          - entities.AdvanceInstallment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (a DIFFERENT mode than
          the sibling's (a) tiered formula): floor-then-remainder with the
          publication bucket absorbing rounding gives 50000/25000/25001 for
          advance 100001, while the naive floor-each-bucket order would leave
          1 cent unallocated and round-each would overshoot — the pinned order
          is the only one that both sums exactly and matches the literals.
        test_recipe:
          setup:
            - "Standard pipeline to an accepted offer with advance_cents = 100001 (odd cent forces the rounding split), deal in NEGOTIATING"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency WF", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
