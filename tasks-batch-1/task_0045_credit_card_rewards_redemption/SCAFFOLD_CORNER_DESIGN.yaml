      - name: post_transaction_promotes_tier_then_subsequent_earns_at_new_tier
        claim_type: Bubble up
        grounds: [state_machines.Transaction.PENDING_to_POSTED, entities.CardAccount.fields.current_tier_index, calculations.points_earning]
        distinguishing_aspect: "Posting spend that reaches a tier threshold promotes current_tier_index; the NEXT txn earns at the new tier multiplier (this txn uses pre-spend tier)."
