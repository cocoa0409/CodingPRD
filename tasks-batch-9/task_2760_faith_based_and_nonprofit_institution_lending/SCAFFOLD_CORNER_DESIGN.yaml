        distinguishing_aspect: "Both FKs resolve, so existence checks pass; the flat topology is enforced instead by comparing GovernanceAuthorization.institution_id with the application's institution_id, yielding 409 ERR_INSTITUTION_MISMATCH."
        test_recipe:
