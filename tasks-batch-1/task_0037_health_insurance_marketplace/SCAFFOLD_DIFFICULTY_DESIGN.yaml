              as: MarketplaceAdmin
          trigger:
            - call: "POST /sep-requests/${sep_id}/approve"
              as: MarketplaceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "SepRequest.${sep_id}.window_close_date == '2026-05-31'"
            - "response status == 409"
            - "response.data.error_id == 'ERR_SEP_WINDOW_CLOSED'"

  # ─────────────────────────────────────────────────────────────────────
  - rule_id: compensating_invariant
    instances:
      - name: reopen_compensates_determination_count_invariant
        grounds:
          - state_machines.Application.SUBMITTED_to_DETERMINED
          - state_machines.Application.DETERMINED_to_DRAFT
          - entities.EligibilityDetermination.fields.application_id
        distinguishing_aspect: |
          Conserved quantity #1: the count of EligibilityDetermination rows for an application. The forward
          action (determine) creates exactly one determination; the compensating action (reopen) deletes it,
          leaving the invariant `count(EligibilityDetermination WHERE application_id == app) == 0` after the
          determine+reopen pair — identical to before determine. No orphaned determination drifts.
        test_recipe:
          setup:
            - "Household hh17 (RA01,2026), PRIMARY 3000000, benchmark plan present. Application SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "app-17"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Inv Ariant", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-17"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "app-17"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-17"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "app-17"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
          trigger:
            - call: "POST /applications/${app_id}/reopen"
              as: Applicant
              as_user_id: "app-17"
            - call: "GET /applications/${app_id}/determination"
              as: Applicant
              as_user_id: "app-17"
          assert:
            - "GET /applications/${app_id}/determination returns an array of length 0"
            - "Application.${app_id}.status == 'DRAFT'"

      - name: magi_recompute_conserves_sum_of_member_countable_income
        grounds:
          - calculations.household_magi
          - entities.Household.fields.household_magi_cents
          - entities.HouseholdMember.fields.annual_income_cents
          - entities.HouseholdMember.fields.is_countable_income
        distinguishing_aspect: |
          A different conserved quantity: household_magi_cents must always equal the running sum of countable
          member incomes. Forward action: PATCH raises a member's income by 500000 (household_magi 3000000 ->
          3500000). Compensating action: PATCH lowers it back by 500000 (household_magi 3500000 -> 3000000).
          The invariant `household_magi_cents == sum(member.annual_income_cents for countable members)` holds
          at every step with zero drift.
        test_recipe:
          setup:
            - "Household hh18 (size 1, RA01, 2026), PRIMARY income 3000000 -> household_magi_cents 3000000."
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "app-18"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Con Serve", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-18"
              captures: { mem_id: $.data.id }
            - call: "PATCH /households/${hh_id}/members/${mem_id}"
              payload: { annual_income_cents: 3500000 }
              as: Applicant
              as_user_id: "app-18"
          trigger:
            - call: "PATCH /households/${hh_id}/members/${mem_id}"
              payload: { annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "app-18"
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-18"
              captures: { magi: $.data.household_magi_cents }
          assert:
            - "Household.${hh_id}.household_magi_cents == 3000000"
            - "HouseholdMember.${mem_id}.annual_income_cents == 3000000"
