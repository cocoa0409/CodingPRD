    distinguishing_aspect: 'DockSlot interval semantics are AGGREGATE-over-overlap plus buffered separation: pallets of every half-open overlapping appointment are summed against pallet_capacity (so a touching
      09:00 start is legal while an 08:30 start pushing 6+5+5=16 past 12 is not), and appointments of a different risk_class must additionally be separated by sanitation_buffer_minutes even when they fit
      the capacity. This is a different geometry, on a different resource entity, from DeliveryRoute''s exclusive single-occupancy windows.'
