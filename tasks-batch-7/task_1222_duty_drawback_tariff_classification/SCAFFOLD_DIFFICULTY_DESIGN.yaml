# =============================================================================
# Task 1222 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and its recipe replays from empty-DB via §1.5 endpoints only.
#
# Standard fixture literals used across instances:
#   Client CL:        { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }
#   Classification:   { product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN",
#                       duty_rate_bps: 1650, declared_unit_value_cents: 5000 }
#   ImportEntry:      { entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704",
#                       line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }
#     -> unit eligible duty = 825; no measures -> eligible = unclaimed = 82500
#   ExportShipment:   { export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100,
#                       fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }
#   Claim:            { claim_type: DIRECT_IDENTIFICATION, period 2026-01-01 .. 2026-03-31 }
#   Segregation:      prepare as Analyst u_an1, file/certify as LicensedBroker u_br1
#   Precomputed:      direct line qty 40 -> 32670; qty 50 -> 40838; two qty-50 lines -> claimed 81676;
#                     substitution (export qty 200, fob 300000, rate 1000) qty 50 -> 7425;
#                     invoice fee on 32670 @2500bps -> 8168; accrual fee on approved 32670 -> 6534.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: claim_estimate_provisional_vs_frozen_final
        grounds:
          - calculations.line_refund_direct
          - calculations.claim_total
          - entities.DrawbackClaim.fields.estimate_cents
          - entities.DrawbackClaim.fields.claimed_duty_cents
        distinguishing_aspect: |
          Entity domain = claim duty valuation. PROVISIONAL (estimate_cents) recomputes live
          against current entry fields, so a post-filing-era correction moves it; FINAL
          (claimed_duty_cents) froze at filing. Two claims with byte-identical lines show
          32670 (frozen) vs 16335 (live after correction) — same original inputs, different results.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; two identical entries E100/E200 (eligible 82500 each); two identical exports"
            - "claimA (DIRECT, 2026-01-01..03-31) with one line qty 40 on E100; claimB (DIRECT, 2026-04-01..06-30) with one line qty 40 on E200"
            - "claimA FILED (claimed frozen at 32670); claimB still DRAFT"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E200", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enB: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-02T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exB: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimB: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimB}/lines", payload: { import_entry_id: "${enB}", export_shipment_id: "${exB}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "GET /customs/import-entries/${enB}", payload: {}, as: Analyst, as_user_id: "u_an1", captures: { enB_v: "$.data.version "} }
          trigger:
            - { call: "POST /customs/import-entries/${enB}/correct", payload: { duty_paid_cents: 41250, expected_import_entry_version: "${enB_v}" }, as: Analyst, as_user_id: "u_an1" }
          assert:
            - "GET /customs/claims/${claimA}: claimed_duty_cents == 32670 (FINAL frozen — correction cannot touch a filed claim's figure)"
            - "GET /customs/claims/${claimB}: estimate_cents == 16335 (PROVISIONAL live recompute: 0.99 * (41250/100) * 40)"
            - "GET /customs/import-entries/${enB}: drawback_eligible_duty_cents == 41250 and unclaimed_duty_cents == 24915"
            - "GET /customs/claim-lines?claim_id=${claimB}: $.data[0].drawback_amount_cents == 16335"

      - name: invoice_fee_accrued_vs_settled
        grounds:
          - calculations.invoice_fee_tiered
          - calculations.client_summary_aggregates
          - entities.Client.fields.projected_fee_accrual_cents
          - entities.Invoice.fields.fee_cents
        distinguishing_aspect: |
          Entity domain = contingency-fee billing (distinct from claim duty in the sibling
          instance). ACCRUED applies an 80% realization haircut to approved_duty_cents before
          tiering (6534), SETTLED tiers the full paid amount (8168): identical approved == paid
          == 32670 yields two different fee figures.
        test_recipe:
          setup:
            - "Client CL (fee 2500 bps) ACTIVE; classification CERTIFIED; entry E100 (eligible 82500); export X1"
            - "claim DIRECT 2026-01-01..03-31 with line qty 40 (amount 32670), FILED"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/review", payload: { outcome: "APPROVED", approved_duty_cents: 32670 }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "GET /customs/clients/${cl}", payload: {}, as: FirmAdmin, captures: { accrual_snap: "$.data.projected_fee_accrual_cents "} }
          trigger:
            - { call: "POST /customs/claims/${claimA}/record-payment", payload: { paid_duty_cents: 32670 }, as: FirmAdmin }
            - { call: "GET /customs/invoices?claim_id=${claimA}", payload: {}, as: FirmAdmin, captures: { inv_fee: "$.data[0].fee_cents "} }
            - { call: "GET /customs/clients/${cl}", payload: {}, as: FirmAdmin, captures: { accrual_after: "$.data.projected_fee_accrual_cents", recovered_after: "$.data.lifetime_recovered_cents "} }
          assert:
            - "captured accrual at APPROVED == 6534 (ACCRUED variant: fee(round_half_up(32670*0.8)=26136 @2500bps))"
            - "Invoice.fee_cents == 8168 (SETTLED variant: round_half_up(32670*2500/10000) = round_half_up(8167.5))"
            - "after payment: projected_fee_accrual_cents == 0 and lifetime_recovered_cents == 32670"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: substitution_lesser_of_unit_duty
        grounds:
          - calculations.line_refund_substitution
          - entities.ClaimLine.fields.drawback_amount_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — nested min(import_unit_duty=825,
          substitute_unit_duty=150) selected under a claim_type conditional branch, then scaled
          by REFUND_RATE_BPS and quantity. The substitute branch wins: line = 7425, not the
          import-side 40838 the same quantity would draw on a DIRECT claim.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry E100 (eligible 82500, unit 825)"
            - "export with quantity 200, fob 300000, substituted_duty_rate_bps 1000 -> substitute unit = 1000*300000/(10000*200) = 150"
            - "SUBSTITUTION claim in DRAFT"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 200, fob_value_cents: 300000, dest_country: "MX", substituted_duty_rate_bps: 1000 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "SUBSTITUTION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
          trigger:
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 50 }, as: Analyst, as_user_id: "u_an1", captures: { line_amt: "$.data.drawback_amount_cents", line_id: "$.data.id "} }
          assert:
            - "ClaimLine.${line_id}.drawback_amount_cents == 7425 (round_half_up(0.99 * min(825, 150) * 50))"
            - "GET /customs/import-entries/${enA}: unclaimed_duty_cents == 75075 and matched_quantity == 50 and status == PARTIALLY_MATCHED"
            - "GET /customs/export-shipments/${exA}: value_pool_remaining_cents == 292575 and matched_quantity == 50"
            - "GET /customs/claims/${claimA}: estimate_cents == 7425"

      - name: claim_total_per_line_rounding_order
        grounds:
          - calculations.claim_total
          - entities.DrawbackClaim.fields.claimed_duty_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two lines whose raw refunds are
          40837.5 each must be rounded per line (40838 + 40838) then summed to 81676; the
          forbidden sum-then-round yields 81675. Scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry E100 (unit eligible 825); export X1 qty 100"
            - "DIRECT claim DRAFT with two lines of matched_quantity 50 each"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 50 }, as: Analyst, as_user_id: "u_an1", captures: { l1_amt: "$.data.drawback_amount_cents "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 50 }, as: Analyst, as_user_id: "u_an1", captures: { l2_amt: "$.data.drawback_amount_cents "} }
          trigger:
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
          assert:
            - "captured l1_amt == 40838 and l2_amt == 40838 (each raw 40837.5 rounded per line)"
            - "GET /customs/claims/${claimA}: claimed_duty_cents == 81676 (per-line-then-sum; sum-then-round would give 81675)"
            - "GET /customs/import-entries/${enA}: unclaimed_duty_cents == 824 and status == MATCHED"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_deficiency_cycle_with_limit
        grounds:
          - state_machines.DrawbackClaim.FILED_to_DEFICIENCY_ISSUED
          - state_machines.DrawbackClaim.DEFICIENCY_ISSUED_to_FILED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity = DrawbackClaim. Cyclic shape FILED -> DEFICIENCY_ISSUED -> FILED bounded by
          deficiency_count < 2: two full cycles succeed, the third DEFICIENCY outcome is
          rejected with ERR_DEFICIENCY_LIMIT_REACHED while the claim remains FILED.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry E100; export X1; DIRECT claim FILED with one line qty 40"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
          trigger:
            - { call: "POST /customs/claims/${claimA}/review", payload: { outcome: "DEFICIENCY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/deficiency-response", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/review", payload: { outcome: "DEFICIENCY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/deficiency-response", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/review", payload: { outcome: "DEFICIENCY" }, as: LicensedBroker, as_user_id: "u_br1", captures: { err: "$.data.error_id "} }
          assert:
            - "first two DEFICIENCY/response cycles succeed: after cycle 1 deficiency_count == 1 and status returns to FILED; after cycle 2 deficiency_count == 2"
            - "third DEFICIENCY: captured err == ERR_DEFICIENCY_LIMIT_REACHED (HTTP 409)"
            - "GET /customs/claims/${claimA}: status == FILED and deficiency_count == 2 (failed outcome left state unchanged)"

      - name: classification_rework_cycle
        grounds:
          - state_machines.HTSClassification.DRAFT_to_IN_REVIEW
          - state_machines.HTSClassification.IN_REVIEW_to_DRAFT
          - state_machines.HTSClassification.IN_REVIEW_to_CERTIFIED
        distinguishing_aspect: |
          Entity = HTSClassification (different entity than the claim cycle). Cyclic shape
          DRAFT -> IN_REVIEW -> DRAFT via REWORK, repeatable; the cycle terminates when a
          later review-decision CERTIFYs. Segregation still binds on each certification.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification created in DRAFT"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
          trigger:
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "REWORK" }, as: LicensedBroker, as_user_id: "u_br1", captures: { st_after_rework: "$.data.status "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1", captures: { st_final: "$.data.status", cert_by: "$.data.certified_by_user_id "} }
          assert:
            - "captured st_after_rework == DRAFT (IN_REVIEW -> DRAFT loop closed)"
            - "captured st_final == CERTIFIED after re-submit"
            - "captured cert_by == u_br1 and submitted_by_user_id == u_an1 (loop did not blur the segregation trail)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: entry_correction_cascade_depth3
        grounds:
          - state_machines.DrawbackClaim (estimate recompute side effect)
          - calculations.line_refund_direct
          - calculations.entry_eligible_duty
          - concurrency_rules[entry-correction-stale-version]
          - entities.DrawbackClaim.fields.estimate_cents
        distinguishing_aspect: |
          Depth-3 chain, trigger = POST /customs/import-entries/{id}/correct: (1) correction
          halves the entry's eligible duty 82500 -> 41250; (2) that entry mutation itself
          re-rates the ACTIVE DRAFT-claim line 32670 -> 16335; (3) that line mutation itself
          recomputes the parent claim's estimate_cents to 16335. Each link is caused by the
          previous link's mutation, not by the original request.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry E100; export X1; DIRECT claim DRAFT with line qty 40 (32670)"
            - "entry version captured AFTER the line add (line add bumps entry version)"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1", captures: { lineA: "$.data.id "} }
            - { call: "GET /customs/import-entries/${enA}", payload: {}, as: Analyst, as_user_id: "u_an1", captures: { en_v: "$.data.version "} }
          trigger:
            - { call: "POST /customs/import-entries/${enA}/correct", payload: { duty_paid_cents: 41250, expected_import_entry_version: "${en_v}" }, as: Analyst, as_user_id: "u_an1" }
          assert:
            - "link 1 — GET /customs/import-entries/${enA}: drawback_eligible_duty_cents == 41250 and unclaimed_duty_cents == 24915"
            - "link 2 — GET /customs/claim-lines/${lineA}: drawback_amount_cents == 16335 (re-rated by the entry mutation)"
            - "link 3 — GET /customs/claims/${claimA}: estimate_cents == 16335 (recomputed by the line mutation)"

      - name: claim_payment_cascade_depth2
        grounds:
          - state_machines.DrawbackClaim.APPROVED_to_PAID
          - calculations.invoice_fee_tiered
          - calculations.client_summary_aggregates
          - calculations.retention_eligibility
        distinguishing_aspect: |
          Depth-2 chain, different trigger than the correction cascade — POST
          /customs/claims/{id}/record-payment: (1) claim -> PAID itself auto-creates the
          ISSUED Invoice with tiered fee 8168; (2) the invoice-creation mutation itself
          advances Client.lifetime_recovered_cents to 32670, drains projected_fee_accrual_cents
          to 0, and stamps the three ComplianceRecords' retention_until = paid_at + 3 years.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry E100; export X1; DIRECT claim FILED then APPROVED at 32670; logical clock never set (default 2026-05-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/review", payload: { outcome: "APPROVED", approved_duty_cents: 32670 }, as: LicensedBroker, as_user_id: "u_br1" }
          trigger:
            - { call: "POST /customs/claims/${claimA}/record-payment", payload: { paid_duty_cents: 32670 }, as: FirmAdmin, captures: { paid_status: "$.data.status", paid_at: "$.data.paid_at "} }
            - { call: "GET /customs/invoices?claim_id=${claimA}", payload: {}, as: FirmAdmin, captures: { inv_fee: "$.data[0].fee_cents", inv_status: "$.data[0].status "} }
            - { call: "GET /customs/clients/${cl}", payload: {}, as: FirmAdmin, captures: { recovered: "$.data.lifetime_recovered_cents", accrual: "$.data.projected_fee_accrual_cents "} }
            - { call: "GET /customs/records?claim_id=${claimA}", payload: {}, as: FirmAdmin, captures: { rec0_ret: "$.data[0].retention_until", rec0_status: "$.data[0].status "} }
          assert:
            - "captured paid_status == PAID and paid_at == 2026-05-01T00:00:00Z (logical-clock default)"
            - "link 1 — invoice: fee_cents == 8168 and status == ISSUED"
            - "link 2 — client: lifetime_recovered_cents == 32670 and projected_fee_accrual_cents == 0"
            - "link 2 — records: retention_until == 2029-05-01T00:00:00Z (paid_at + 3 years) and status == RETAINED on all three records"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: file_state_beats_deadline
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.DrawbackClaim.DRAFT_to_FILED
        distinguishing_aspect: |
          Category pair (state, business_temporal): filing a CANCELLED claim whose statutory
          deadline has ALSO passed must surface ERR_INVALID_STATE (priority 6), never
          ERR_FILING_DEADLINE_PASSED (priority 9).
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry with entry_date 2021-01-01 (filing deadline 2026-01-01, already past the default clock 2026-05-01); export X1"
            - "DIRECT claim DRAFT with one line qty 40, then CANCELLED"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E900", entry_date: "2021-01-01T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2021-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2021-01-01T00:00:00Z", period_end: "2021-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/cancel", payload: {}, as: Analyst, as_user_id: "u_an1" }
          trigger:
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1", captures: { err: "$.data.error_id "} }
          assert:
            - "captured err == ERR_INVALID_STATE (HTTP 409) — the state violation outranks the also-true ERR_FILING_DEADLINE_PASSED"
            - "GET /customs/claims/${claimA}: status == CANCELLED (unchanged)"

      - name: line_referential_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - entities.ClaimLine.fields.import_entry_id
        distinguishing_aspect: |
          Category pair (business_referential, business_fiscal) — a different pair than
          (state, business_temporal) in the sibling instance. A line referencing another
          client's entry AND exceeding the export's FOB pool must surface
          ERR_CROSS_CLIENT_REFERENCE (priority 8), never ERR_EXPORT_VALUE_POOL_EXCEEDED (13).
        test_recipe:
          setup:
            - "Client A (Acme) ACTIVE with DIRECT claim DRAFT; Client B (Beta) ACTIVE with CERTIFIED classification and an entry (qty 1, entered 100, duty 100)"
            - "Client A export with fob_value_cents 10 (any refund would breach the FOB pool)"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { clA: "$.data.id "} }
            - { call: "POST /customs/clients", payload: { name: "Beta Trade", importer_of_record_number: "98-7654321", contingency_fee_bps: 2000 }, as: FirmAdmin, captures: { clB: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${clB}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { clsB: "$.data.id "} }
            - { call: "POST /customs/classifications/${clsB}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${clsB}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${clB}", classification_id: "${clsB}", entry_number: "B100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 1, entered_value_cents: 100, duty_paid_cents: 100 }, as: Analyst, as_user_id: "u_an1", captures: { enB: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${clA}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 10, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${clA}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
          trigger:
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enB}", export_shipment_id: "${exA}", matched_quantity: 1 }, as: Analyst, as_user_id: "u_an1", captures: { err: "$.data.error_id "} }
          assert:
            - "captured err == ERR_CROSS_CLIENT_REFERENCE (HTTP 422) — referential failure (priority 8) masks the also-true FOB fiscal failure (priority 13: raw 99 > pool 10)"
            - "GET /customs/claims/${claimA}: estimate_cents == 0 (no line persisted)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: filing_deadline_inclusive_second
        grounds:
          - calculations.statutory_filing_deadline
          - validations[priority=9]
        distinguishing_aspect: |
          Metric = statutory filing timestamp; endpoint = POST /customs/claims/{id}/file.
          Boundary is INCLUSIVE: filing at exactly entry_date + 5 years (the same second)
          succeeds; the rule is <=, not <.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry with entry_date 2026-05-01T00:00:00Z (deadline 2031-05-01T00:00:00Z); export X1; DIRECT claim DRAFT with line qty 40"
            - "logical clock set to exactly the deadline second"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-05-01T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-05-02T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/_clock/set_current_utc", payload: { to_iso8601: "2031-05-01T00:00:00Z" }, as: FirmAdmin }
          trigger:
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1", captures: { st: "$.data.status", filed: "$.data.filed_at "} }
          assert:
            - "captured st == FILED and filed == 2031-05-01T00:00:00Z (deadline second is inclusive)"
            - "GET /customs/claims/${claimA}: claimed_duty_cents == 32670"

      - name: invoice_payment_exact_balance
        grounds:
          - state_machines.Invoice.PARTIALLY_PAID_to_PAID
          - entities.Invoice.fields.balance_cents
          - validations[priority=13]
        distinguishing_aspect: |
          Metric = invoice balance in cents; endpoint = POST /customs/invoices/{id}/payments
          (a different metric and endpoint than the filing deadline). Payment exactly equal to
          balance_cents succeeds and yields PAID; balance_cents + 1 is rejected with
          ERR_PAYMENT_EXCEEDS_BALANCE — the boundary is <=, not <.
        test_recipe:
          setup:
            - "Two fully-processed claims for Client CL (32670 each, disjoint periods, separate entries/exports), producing two ISSUED invoices of fee_cents 8168"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E200", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enB: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-02T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exB: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/review", payload: { outcome: "APPROVED", approved_duty_cents: 32670 }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/record-payment", payload: { paid_duty_cents: 32670 }, as: FirmAdmin }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimB: "$.data.id "} }
            - { call: "POST /customs/claims/${claimB}/lines", payload: { import_entry_id: "${enB}", export_shipment_id: "${exB}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimB}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimB}/review", payload: { outcome: "APPROVED", approved_duty_cents: 32670 }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimB}/record-payment", payload: { paid_duty_cents: 32670 }, as: FirmAdmin }
            - { call: "GET /customs/invoices?claim_id=${claimA}", payload: {}, as: FirmAdmin, captures: { invA: "$.data[0].id "} }
            - { call: "GET /customs/invoices?claim_id=${claimB}", payload: {}, as: FirmAdmin, captures: { invB: "$.data[0].id "} }
          trigger:
            - { call: "POST /customs/invoices/${invA}/payments", payload: { amount_cents: 8168 }, as: FirmAdmin, captures: { stA: "$.data.status", balA: "$.data.balance_cents "} }
            - { call: "POST /customs/invoices/${invB}/payments", payload: { amount_cents: 8169 }, as: FirmAdmin, captures: { errB: "$.data.error_id "} }
          assert:
            - "invoice A: captured stA == PAID and balA == 0 (payment == balance exactly is accepted)"
            - "invoice B: captured errB == ERR_PAYMENT_EXCEEDS_BALANCE (balance 8168 + 1 cent is rejected)"
            - "GET /customs/invoices/${invB}: status == ISSUED and amount_paid_cents == 0 (rejection left no trace)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_requires_certified_classification
        grounds:
          - validations[priority=8]
          - state_machines.HTSClassification.IN_REVIEW_to_CERTIFIED
        distinguishing_aspect: |
          Entity pair ImportEntry -> HTSClassification: entry registration is gated on the
          referenced classification being CERTIFIED; the same payload fails while it is DRAFT
          and succeeds after certification.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification in DRAFT (never submitted)"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
          trigger:
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { err: "$.data.error_id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { en: "$.data.id", en_status: "$.data.status", en_eligible: "$.data.drawback_eligible_duty_cents "} }
          assert:
            - "first attempt: captured err == ERR_CLASSIFICATION_NOT_CERTIFIED (HTTP 409)"
            - "after CERTIFY, identical payload succeeds: captured en_status == UNMATCHED and en_eligible == 82500"

      - name: claim_filing_requires_active_client
        grounds:
          - validations[priority=8]
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - state_machines.DrawbackClaim.DRAFT_to_FILED
        distinguishing_aspect: |
          Entity pair DrawbackClaim -> Client (different pair than entry->classification):
          filing is gated on the parent's engagement_status; SUSPENDED blocks with
          ERR_CLIENT_NOT_ACTIVE, and reactivation unblocks the same claim.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry E100; export X1; DIRECT claim DRAFT with line qty 40"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "PATCH /customs/clients/${cl}", payload: { engagement_status: "SUSPENDED" }, as: FirmAdmin }
          trigger:
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1", captures: { err: "$.data.error_id "} }
            - { call: "PATCH /customs/clients/${cl}", payload: { engagement_status: "ACTIVE" }, as: FirmAdmin }
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1", captures: { st: "$.data.status "} }
          assert:
            - "while SUSPENDED: captured err == ERR_CLIENT_NOT_ACTIVE (HTTP 409); claim stays DRAFT"
            - "after reactivation: captured st == FILED and claimed_duty_cents == 32670"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: measure_half_open_adjacency
        grounds:
          - validations[priority=10]
          - entities.TariffMeasure.fields.effective_to
          - calculations.entry_eligible_duty
        distinguishing_aspect: |
          Resource = TariffMeasure keyed by (measure_type, hts_code_prefix); interval
          semantics = HALF-OPEN [effective_from, effective_to): a second measure starting
          exactly when the first ends is adjacent, not overlapping, and is accepted; one
          starting a day earlier is rejected with ERR_MEASURE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "No entities needed beyond an empty DB; measures are top-level"
          setup_api_calls:
            - { call: "POST /customs/tariff-measures", payload: { hts_code_prefix: "6203", measure_type: "SECTION_301", surcharge_bps: 2500, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }, as: FirmAdmin, captures: { m1: "$.data.id "} }
          trigger:
            - { call: "POST /customs/tariff-measures", payload: { hts_code_prefix: "6203", measure_type: "SECTION_301", surcharge_bps: 750, effective_from: "2026-06-01T00:00:00Z" }, as: FirmAdmin, captures: { m2: "$.data.id "} }
            - { call: "POST /customs/tariff-measures", payload: { hts_code_prefix: "6203", measure_type: "SECTION_301", surcharge_bps: 500, effective_from: "2026-05-15T00:00:00Z" }, as: FirmAdmin, captures: { err: "$.data.error_id "} }
          assert:
            - "adjacent measure (from == prior to) accepted: m2 created with status ACTIVE"
            - "overlapping measure rejected: captured err == ERR_MEASURE_WINDOW_OVERLAP (HTTP 409)"
            - "GET /customs/tariff-measures?hts_code_prefix=6203&measure_type=SECTION_301 returns exactly 2 ACTIVE measures"

      - name: claim_closed_period_shared_date
        grounds:
          - validations[priority=10]
          - entities.DrawbackClaim.fields.period_end
        distinguishing_aspect: |
          Resource = DrawbackClaim keyed by (client_id, claim_type); interval semantics =
          CLOSED dates [period_start, period_end] — different semantics than the measure's
          half-open window. Back-to-back periods (next start == prior end + 1 day) are
          accepted, but sharing a single calendar date is an overlap.
        test_recipe:
          setup:
            - "Client CL ACTIVE; one DIRECT claim covering 2026-01-01..2026-03-31"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
          trigger:
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimB: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-03-31T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { err: "$.data.error_id "} }
          assert:
            - "back-to-back claim accepted: claimB created in DRAFT"
            - "shared-date claim rejected: captured err == ERR_CLAIM_PERIOD_OVERLAP (HTTP 409)"
            - "GET /customs/claims?client_id=${cl} returns exactly 2 claims"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: entry_duty_pool_conserved_on_void
        grounds:
          - entities.ImportEntry.fields.unclaimed_duty_cents
          - state_machines.ClaimLine.ACTIVE_to_VOID
          - calculations.line_refund_direct
        distinguishing_aspect: |
          Conserved quantity = eligible duty cents on ImportEntry: for every entry,
          sum(ACTIVE lines' drawback_amount_cents) + unclaimed_duty_cents ==
          drawback_eligible_duty_cents. Adding a line (32670) then voiding it returns
          unclaimed to exactly 82500 — the forward/compensating pair leaves zero drift.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry E100 (eligible 82500); export X1; DIRECT claim DRAFT with one ACTIVE line qty 40 (32670)"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1", captures: { lineA: "$.data.id "} }
            - { call: "GET /customs/import-entries/${enA}", payload: {}, as: Analyst, as_user_id: "u_an1", captures: { pool_mid: "$.data.unclaimed_duty_cents", qty_mid: "$.data.matched_quantity "} }
          trigger:
            - { call: "DELETE /customs/claims/${claimA}/lines/${lineA}", payload: {}, as: Analyst, as_user_id: "u_an1" }
          assert:
            - "mid-invariant: pool_mid == 49830 and 32670 + 49830 == 82500 == drawback_eligible_duty_cents"
            - "after compensating void: GET /customs/import-entries/${enA} unclaimed_duty_cents == 82500, matched_quantity == 0, status == UNMATCHED"
            - "GET /customs/claim-lines/${lineA}: status == VOID; GET /customs/claims/${claimA}: estimate_cents == 0"

      - name: export_quantity_conserved_on_void
        grounds:
          - entities.ExportShipment.fields.matched_quantity
          - entities.ExportShipment.fields.value_pool_remaining_cents
          - state_machines.ClaimLine.ACTIVE_to_VOID
        distinguishing_aspect: |
          Conserved quantity = exported units / FOB cents on ExportShipment (a different
          quantity type than the duty-cents pool): sum(ACTIVE lines' matched_quantity) +
          remaining == quantity, and value_pool_remaining_cents == fob - sum(amounts). The
          add-then-void pair restores matched_quantity 60 -> 0 and the pool to 480000.
        test_recipe:
          setup:
            - "Client CL ACTIVE; classification CERTIFIED; entry E100; export X1 (qty 100, fob 480000); DIRECT claim DRAFT with one ACTIVE line qty 60 (amount 49005)"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 60 }, as: Analyst, as_user_id: "u_an1", captures: { lineA: "$.data.id", line_amt: "$.data.drawback_amount_cents "} }
            - { call: "GET /customs/export-shipments/${exA}", payload: {}, as: Analyst, as_user_id: "u_an1", captures: { qty_mid: "$.data.matched_quantity", pool_mid: "$.data.value_pool_remaining_cents "} }
          trigger:
            - { call: "DELETE /customs/claims/${claimA}/lines/${lineA}", payload: {}, as: Analyst, as_user_id: "u_an1" }
          assert:
            - "line amount: captured line_amt == 49005 (round_half_up(0.99*825*60))"
            - "mid-invariant: qty_mid == 60 and pool_mid == 430995 (480000 - 49005)"
            - "after void: GET /customs/export-shipments/${exA} matched_quantity == 0, value_pool_remaining_cents == 480000, status == UNMATCHED"
