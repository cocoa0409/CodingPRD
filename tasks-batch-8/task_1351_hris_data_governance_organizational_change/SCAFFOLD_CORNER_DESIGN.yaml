# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1351: HRIS Data Governance & Organizational Change Management
# Breadth probe: enumerates every testable claim of §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Logical clock default:
# 2026-08-01T00:00:00Z. Sections/claim_types follow references/claim-extraction-guide.md.
# excluded_because stubs cite §1.8 instances by their exact name.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section 1 — Entities (creation, required fields, defaults, type
  # constraints, computed/system fields, immutability, not-found, FK integrity
  # for the flat topology)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_data_field_defaults_and_activate
        claim_type: creation
        grounds:
          - entities.DataField.fields.downstream_channels
          - state_machines.DataField.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          A DataField created without downstream_channels persists the declared
          default [] and starts in initial_state DRAFT; activate then moves it
          to ACTIVE and the change is visible on re-read.
        test_recipe:
          setup:
            - "Empty DB; logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.pay_grade", display_name: "Pay Grade", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", owner_team: "people" }
              as: DataSteward
              captures: { df_id: $.data.id, df_status: $.data.status, df_channels: $.data.downstream_channels }
          trigger:
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
              captures: { act_status: $.data.status }
            - call: "GET /hris/data-fields/${df_id}"
              payload: {}
              as: DataSteward
              captures: { get_status: $.data.status }
          assert:
            - "create response data.status == \"DRAFT\" (initial state)"
            - "create response data.downstream_channels == [] (declared default applied)"
            - "activate response data.status == \"ACTIVE\""
            - "GET re-read data.status == \"ACTIVE\""

      - name: create_data_field_missing_required_field_key_rejected
        claim_type: required_fields
        grounds:
          - entities.DataField.fields.field_key
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Omitting the required input field_key (source: input, no default) is
          rejected with ERR_INVALID_REQUEST (400) and no DataField is created.
        test_recipe:
          setup:
            - "One valid DataField already exists so the DB is non-trivial"
          setup_api_calls:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", owner_team: "comp" }
              as: DataSteward
          trigger:
            - call: "POST /hris/data-fields"
              payload: { display_name: "No Key", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", owner_team: "comp" }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_data_field_invalid_sensitivity_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.DataField.fields.sensitivity
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          sensitivity is an enum {PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED};
          the undeclared value TOP_SECRET is rejected with ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "GET /hris/data-fields"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.pay_grade", display_name: "Grade", sensitivity: "TOP_SECRET", history_policy: "CORRECTABLE", owner_team: "people" }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_data_field_unknown_field_key_rejected
        claim_type: type_constraints
        grounds:
          - entities.DataField.fields.field_key
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          field_key must name a governable attribute; "assignment.foo" is not
          in the governable set and is rejected with ERR_INVALID_REQUEST even
          though every other field is well-formed.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "GET /hris/data-fields"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.foo", display_name: "Bogus", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", owner_team: "comp" }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_data_field_duplicate_field_key_rejected
        claim_type: type_constraints
        grounds:
          - entities.DataField.fields.field_key
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          field_key is unique across DataField; a second entry with the same
          key assignment.salary_cents is rejected with ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "DataField df1 with field_key assignment.salary_cents exists"
          setup_api_calls:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", owner_team: "comp" }
              as: DataSteward
          trigger:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary Duplicate", sensitivity: "CONFIDENTIAL", history_policy: "APPEND_ONLY", owner_team: "comp" }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_worker_duplicate_worker_number_rejected
        claim_type: type_constraints
        grounds:
          - entities.Worker.fields.worker_number
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          worker_number is unique; a second worker with worker_number W600 is
          rejected with ERR_INVALID_REQUEST and no second Worker is created.
        test_recipe:
          setup:
            - "Position P; Worker W600 already hired into P"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "First", worker_number: "W600", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/workers"
              payload: { legal_name: "Second", worker_number: "W600", hire_date: "2026-02-01", initial_position_id: "${pos_id}", initial_salary_cents: 11000 }
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_worker_seeds_initial_assignment_row
        claim_type: creation
        grounds:
          - entities.PositionAssignment.fields.change_request_id
          - state_machines.PositionAssignment
        distinguishing_aspect: |
          Hiring a worker creates exactly one PositionAssignment row
          [hire_date, null) carrying the seed salary/grade/location with
          change_request_id null and row_status ACTIVE (hire_date 2026-01-05
          <= default clock 2026-08-01).
        test_recipe:
          setup:
            - "Position P ACTIVE"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
          trigger:
            - call: "POST /hris/workers"
              payload: { legal_name: "Seed Row", worker_number: "W700", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000, initial_pay_grade: "G7", initial_location_code: "NY" }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_status: $.data.status }
            - call: "GET /hris/position-assignments"
              payload: { worker_id: "${w_id}" }
              as: HrisAnalyst
              captures: { r_start: "$.data[0].effective_start_date", r_end: "$.data[0].effective_end_date", r_salary: "$.data[0].salary_cents", r_grade: "$.data[0].pay_grade", r_loc: "$.data[0].location_code", r_cr: "$.data[0].change_request_id", r_status: "$.data[0].row_status" }
          assert:
            - "worker create response status == \"ACTIVE\""
            - "exactly one assignment row: effective_start_date == \"2026-01-05\", effective_end_date == null"
            - "row salary_cents == 10000, pay_grade == \"G7\", location_code == \"NY\""
            - "row change_request_id == null (initial row)"
            - "row_status == \"ACTIVE\" (hire_date <= default logical clock date)"

      - name: create_worker_future_hire_row_status_future
        claim_type: computed_fields
        grounds:
          - entities.PositionAssignment.fields.row_status
          - state_machines.PositionAssignment
        distinguishing_aspect: |
          row_status is derived from the logical clock: a worker hired with
          hire_date 2026-09-01 (after the default clock 2026-08-01) has a
          FUTURE assignment row while the Worker itself is ACTIVE.
        test_recipe:
          setup:
            - "Position P ACTIVE"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
          trigger:
            - call: "POST /hris/workers"
              payload: { legal_name: "Future Hire", worker_number: "W701", hire_date: "2026-09-01", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_status: $.data.status }
            - call: "GET /hris/position-assignments"
              payload: { worker_id: "${w_id}" }
              as: HrisAnalyst
              captures: { r_status: "$.data[0].row_status" }
          assert:
            - "Worker.status == \"ACTIVE\""
            - "assignment row_status == \"FUTURE\" (derived: clock date 2026-08-01 < effective_start_date 2026-09-01)"

      - name: audit_entry_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.AuditEntry
          - state_machines.SecurityRoleAssignment.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          AuditEntry declares common_fields: false (append-only log): the
          GRANT_APPROVE entry produced by a grant approve exposes id and
          created_at but no version and no updated_at field.
        test_recipe:
          setup:
            - "Grant G for op-30 (HRIS_ANALYST) requested"
          setup_api_calls:
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "op-30", role_code: "HRIS_ANALYST", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /hris/security-role-assignments/${g_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
            - call: "GET /hris/audit-entries"
              payload: {}
              as: DataSteward
              captures: { a_action: "$.data[0].action" }
          assert:
            - "exactly one AuditEntry exists, action == \"GRANT_APPROVE\""
            - "entry has id and created_at fields"
            - "entry has NO version field and NO updated_at field (common_fields: false, immutable log)"

      - name: change_request_body_field_fk_not_found
        claim_type: not_found
        grounds:
          - entities.ChangeRequest.fields.target_field_id
          - validations[priority=3]
          - errors[ERR_DATA_FIELD_NOT_FOUND]
        distinguishing_aspect: |
          Flat-topology FK integrity: a change request whose body
          target_field_id does not resolve to a DataField is rejected with
          ERR_DATA_FIELD_NOT_FOUND (404) before any state/OCC check.
        test_recipe:
          setup:
            - "Position P; Worker W ACTIVE"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W Ten", worker_number: "W710", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
          trigger:
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "00000000-0000-0000-0000-000000000000", new_value: "12000", effective_date: "2026-09-01", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DATA_FIELD_NOT_FOUND, http 404"

      - name: change_request_target_row_fk_not_found
        claim_type: not_found
        grounds:
          - entities.ChangeRequest.fields.target_row_id
          - validations[priority=3]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
        distinguishing_aspect: |
          A CORRECT_HISTORY change request whose target_row_id does not
          resolve to a PositionAssignment is rejected with
          ERR_ASSIGNMENT_NOT_FOUND (404) at existence priority.
        test_recipe:
          setup:
            - "Position P; Worker W; ACTIVE CORRECTABLE salary field df"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W Eleven", worker_number: "W711", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "9500", correction_mode: "CORRECT_HISTORY", target_row_id: "00000000-0000-0000-0000-000000000000", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSIGNMENT_NOT_FOUND, http 404"

      - name: worker_create_position_fk_not_found
        claim_type: not_found
        grounds:
          - entities.Worker.fields.initial_position_id
          - validations[priority=3]
          - errors[ERR_POSITION_NOT_FOUND]
        distinguishing_aspect: |
          Hiring a worker with a non-existent initial_position_id is rejected
          with ERR_POSITION_NOT_FOUND (404); no Worker and no assignment row
          are created.
        test_recipe:
          setup:
            - "One unrelated Position exists (DB non-empty)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/workers"
              payload: { legal_name: "No Pos", worker_number: "W712", hire_date: "2026-01-05", initial_position_id: "00000000-0000-0000-0000-000000000000", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POSITION_NOT_FOUND, http 404"

  # ===========================================================================
  # Section 2 — State Machines (valid/invalid transitions, preconditions,
  # side effects, terminal lockdown, idempotency, cyclic clock sweeps)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: data_field_deprecate_state_guards
        claim_type: invalid_transition
        grounds:
          - state_machines.DataField.ACTIVE_to_DEPRECATED
          - errors[ERR_FIELD_NOT_ACTIVE]
        distinguishing_aspect: |
          Deprecate is only declared from ACTIVE: from DRAFT it fails with
          ERR_FIELD_NOT_ACTIVE, and from the terminal DEPRECATED state a second
          deprecate fails the same way while the successful ACTIVE->DEPRECATED
          transition in between returns DEPRECATED.
        test_recipe:
          setup:
            - "DataField df in DRAFT"
          setup_api_calls:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.pay_grade", display_name: "Grade", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", owner_team: "people" }
              as: DataSteward
              captures: { df_id: $.data.id }
          trigger:
            - call: "POST /hris/data-fields/${df_id}/deprecate"
              payload: {}
              as: DataSteward
              captures: { err1: $.data.error_id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/data-fields/${df_id}/deprecate"
              payload: {}
              as: DataSteward
              captures: { dep_status: $.data.status }
            - call: "POST /hris/data-fields/${df_id}/deprecate"
              payload: {}
              as: DataSteward
              captures: { err2: $.data.error_id }
          assert:
            - "deprecate from DRAFT: error_id == ERR_FIELD_NOT_ACTIVE (409)"
            - "deprecate from ACTIVE: status == \"DEPRECATED\""
            - "second deprecate from terminal DEPRECATED: error_id == ERR_FIELD_NOT_ACTIVE"

      - name: activate_active_field_rejected
        claim_type: idempotency
        grounds:
          - state_machines.DataField.DRAFT_to_ACTIVE
          - errors[ERR_FIELD_NOT_ACTIVE]
        distinguishing_aspect: |
          Repeating the activate trigger once the field is already ACTIVE is
          not a no-op: the second activate is rejected with
          ERR_FIELD_NOT_ACTIVE and the field stays ACTIVE.
        test_recipe:
          setup:
            - "DataField df already ACTIVE"
          setup_api_calls:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.location_code", display_name: "Location", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", owner_team: "people" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
              captures: { err: $.data.error_id }
            - call: "GET /hris/data-fields/${df_id}"
              payload: {}
              as: DataSteward
              captures: { st: $.data.status }
          assert:
            - "second activate: error_id == ERR_FIELD_NOT_ACTIVE (409)"
            - "field status remains \"ACTIVE\""

      - name: position_close_blocked_while_subtree_occupied_then_succeeds
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Position.ACTIVE_to_CLOSED
          - calculations.subtree_headcount
          - errors[ERR_POSITION_SUBTREE_OCCUPIED]
        distinguishing_aspect: |
          Close is guarded by FILLED_ONLY subtree headcount == 0 at the
          logical clock date: with one ACTIVE assignment row covering
          2026-08-01 close is rejected with ERR_POSITION_SUBTREE_OCCUPIED;
          after termination truncates the row to end 2026-06-01 (no longer
          covering the clock date) the same close succeeds.
        test_recipe:
          setup:
            - "Position P; Worker W with ACTIVE row [2026-01-05, null) into P"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 2 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Occ", worker_number: "W720", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /hris/positions/${pos_id}/close"
              payload: {}
              as: HrisAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /hris/workers/${w_id}/terminate"
              payload: { termination_date: "2026-06-01" }
              as: HrisAnalyst
            - call: "POST /hris/positions/${pos_id}/close"
              payload: {}
              as: HrisAnalyst
              captures: { close_status: $.data.status }
          assert:
            - "first close: error_id == ERR_POSITION_SUBTREE_OCCUPIED (409)"
            - "after termination (row no longer covers clock date): close returns status == \"CLOSED\""

      - name: close_closed_position_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Position.ACTIVE_to_CLOSED
          - errors[ERR_POSITION_NOT_ACTIVE]
        distinguishing_aspect: |
          CLOSED is terminal: a second close on an already-CLOSED position is
          rejected with ERR_POSITION_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Position P ACTIVE with empty subtree"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Empty", department: "ENG", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
          trigger:
            - call: "POST /hris/positions/${pos_id}/close"
              payload: {}
              as: HrisAnalyst
              captures: { st1: $.data.status }
            - call: "POST /hris/positions/${pos_id}/close"
              payload: {}
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "first close: status == \"CLOSED\""
            - "second close: error_id == ERR_POSITION_NOT_ACTIVE (409)"

      - name: terminate_worker_truncates_covering_row_and_voids_future_rows
        claim_type: cascade_down
        grounds:
          - state_machines.Worker.ACTIVE_to_TERMINATED
          - state_machines.PositionAssignment.FUTURE_to_VOIDED
        distinguishing_aspect: |
          Termination cascades to the worker's timeline: the row covering
          termination_date 2026-08-10 is truncated to end 2026-08-10 while the
          FUTURE row starting 2026-09-01 (after termination) is VOIDED; the
          Worker shows TERMINATED with termination_date set.
        test_recipe:
          setup:
            - "Worker W salary 10000, ACTIVE row R1 [2026-01-05, 2026-09-01) and FUTURE row R2 [2026-09-01, null) location SF (from an applied NEW_RECORD change)"
            - "appr-1 holds PROVISIONED CHANGE_APPROVER grant"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Term", worker_number: "W721", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000, initial_location_code: "NY" }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.location_code", display_name: "Location", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "people" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
