          rationale: "Covered as §1.8 transitive_cascade instance."

      - name: derived_field_reconciliation_member_open_gap_count
        claim_type: derived_field_reconciliation
        grounds: [entities.Member.fields.open_gap_count]
        distinguishing_aspect: "Member.open_gap_count stays consistent with CareGap rows: starts at N after panel activation, decrements on CLOSED, increments on REOPENED."
        test_recipe:
          setup: ["One member with one CareGap; capture initial open_gap_count; close gap; capture; reopen; capture"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365, reporting_lag_days: 30 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
