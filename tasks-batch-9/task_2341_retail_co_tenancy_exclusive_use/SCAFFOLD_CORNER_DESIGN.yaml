    - endpoints[POST /co-tenancy-conditions/{id}/waive]
    distinguishing_aspect: 'The BREACHED -> WAIVED transition fires all four declared side effects at once: breach_detected_at and consecutive_breach_days clear, the benefited lease drops ELIGIBLE -> NONE,
      the pending election is RESCINDED, and the center falls out of FROZEN back to WATCH because the waived condition leaves the breached population while occupancy stays 45.00.'
    test_recipe:
      setup:
      - 'Center Northgate Crossing (300000 GLA, occupancy_grace_days 30) with five EXECUTED-then-OPEN leases: A1 120000 anchor, A2 100000 anchor, I1 2000 coffee, I2 3000 books, I3 30000 fitness; occupied_gla_sqft
        255000, open_occupancy_pct 85.00, compliance_posture COMPLIANT'
      - CoTenancyCondition on lease I1 requiring 81.67 pct, grace 0, cure_period_days 30, max_reduction_pct 90.0
      - Anchor A1 (120000 sqft) DARK, so occupancy is 45.00 pct, the condition is BREACHED and compliance_posture is FROZEN
      - An ELECTED RENT_REDUCTION election E1 on lease I1 for 2026-08-01..2026-11-01
      - Logical clock at 2026-08-01T00:00:00Z
