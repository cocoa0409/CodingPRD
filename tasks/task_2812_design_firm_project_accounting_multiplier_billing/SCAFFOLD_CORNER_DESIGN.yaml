            - "the 412 did not advance Project.version: ${p_v2} equals the version the approval left behind, and the project's unbilled_wip is still 762.50"
            - "the create carrying ${p_v2} returns 201 with multiplier 3.2000, status ACTIVE, effective_from 2026-06-01"
