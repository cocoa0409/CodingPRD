      - name: calciner_aggregate_rate_over_overlapping_subinterval
        grounds:
          - calculations.calciner_aggregate_capacity
          - validations[priority=18]
          - errors[ERR_CALCINER_CAPACITY_EXCEEDED]
          - entities.Plant.fields.calciner_capacity_tph
          - endpoints[POST /plant-ops/calciner-batches]
        distinguishing_aspect: |
          Resource Plant calciner: overlap is NOT exclusive here, it is a summed-rate constraint over
          every boundary-delimited sub-interval, so two windows may overlap while their feed rates add
          to exactly 60 tph, a third overlapping batch of only 5 tph is rejected because the shared
          sub-interval reaches 65 tph, and a batch that begins exactly when another ends carries no
          load at all (half-open windows).
        test_recipe:
          setup:
            - "Plant GYP-1 with calciner_capacity_tph 60."
            - "Batch B1 PLANNED at 40.0 tph for 2026-08-02T08:00Z-14:00Z."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 200.000, calcination_temp_f: 320.0, feed_rate_tph: 40.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T14:00:00Z" }
              as: MaterialsController
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 70.000, calcination_temp_f: 315.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T12:00:00Z", feed_window_end: "2026-08-02T16:00:00Z" }
              as: MaterialsController
              captures: { b2_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 10.000, calcination_temp_f: 315.0, feed_rate_tph: 5.0, feed_window_start: "2026-08-02T13:00:00Z", feed_window_end: "2026-08-02T15:00:00Z" }
              as: MaterialsController
              captures: { err_id: $.data.error_id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 140.000, calcination_temp_f: 320.0, feed_rate_tph: 40.0, feed_window_start: "2026-08-02T16:00:00Z", feed_window_end: "2026-08-02T20:00:00Z" }
              as: MaterialsController
              captures: { b4_id: $.data.id }
          assert:
            - "CalcinerBatch.${b2_id}.status == PLANNED: the 12:00Z-14:00Z sub-interval carries 40.0 + 20.0 == 60.0 tph, equal to capacity, and equal passes"
            - "the 5.0 tph batch returned status 409 with ${err_id} == ERR_CALCINER_CAPACITY_EXCEEDED because 13:00Z-14:00Z would carry 65.0 tph"
            - "CalcinerBatch.${b4_id}.status == PLANNED: its window starts exactly when B2's ends, and half-open windows do not overlap, so its load is 40.0 tph alone"
            - "GET /plant-ops/calciner-batches?plant_id=${plant_id} returns total_count == 3"
            - "CalcinerBatch.${b1_id}.feed_rate_tph == 40.0 and CalcinerBatch.${b2_id}.feed_rate_tph == 20.0 are unchanged by the rejected attempt"

