        grounds:
          - calculations.player_minor_status
          - entities.Player.fields.age_years
          - entities.Player.fields.is_minor
          - entities.League.fields.minor_age_threshold_years
        distinguishing_aspect: |
          With the clock at 2026-08-01, a player born 2008-08-01 is exactly 18 and is NOT a minor,
          while a player born 2008-08-02 is 17 and is. Advancing the clock one day re-derives the
          second player as an adult on the read, without any write.
        test_recipe:
          setup:
            - "One league with the default minor_age_threshold_years 18; logical clock at 2026-08-01T00:00:00Z"
            - "Two players: one born 2008-08-01 (18 today) and one born 2008-08-02 (17 today)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
          trigger:
            - call: "POST /players"
              payload: { full_name: "Exactly Eighteen", birth_date: "2008-08-01", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { pAdult_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "One Day Short", birth_date: "2008-08-02", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { pMinor_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "GET /players/${pMinor_id}"
              as: Scout
              as_user_id: "scout-7"
          assert:
            - "Player.${pAdult_id}.age_years == 18, is_minor == false, guardian_consent_status == NOT_REQUIRED"
            - "Player.${pMinor_id} at creation: age_years == 17, is_minor == true, guardian_consent_status == REQUIRED"
            - "After the clock moves to 2026-08-02T00:00:00Z, GET /players/${pMinor_id} reports age_years == 18 and is_minor == false"
            - "Player.${pMinor_id}.version is unchanged by the clock move — age_years and is_minor are derived on read"

      - name: salary_cap_charge_variants_diverge_and_are_selected_by_context
