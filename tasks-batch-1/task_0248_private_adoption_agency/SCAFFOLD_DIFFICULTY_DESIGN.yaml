scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: revocation_deadline_calendar_vs_business_days
        grounds:
          - calculations.revocation_deadline
          - entities.ConsentRecord.fields.revocation_deadline
          - state_machines.ConsentRecord.SIGNED_to_REVOKED
        distinguishing_aspect: |
          Same signed_at instant on a ConsentRecord yields two DIFFERENT
          revocation_deadline values: CALENDAR_DAYS variant = signed_at + 10*24h,
          BUSINESS_DAYS variant = end-of-5th-business-day; this dual-variant lives
          on the ConsentRecord (consent-timeline) entity domain, distinct from the
          agency-billing domain of the second instance.
        test_recipe:
          setup:
            - "Agency exists; agency clock set to 2026-06-04T08:00:00Z."
            - "Interstate case (child_state=NV, family_state=CA) with an APPROVED non-expired HomeStudy and an ACCEPTED Match for the birth parent."
            - "Two ConsentRecords are created and signed at the same instant 2026-06-04T08:00:00Z, one with revocation_basis=CALENDAR_DAYS and one with BUSINESS_DAYS."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace Adoption", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-06-04T08:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "NV", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /home-studies/${hs_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat Doe", birth_state: "NV", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /matches"
              payload: { case_id: "${case_id}", family_id: "${family_id}", birth_parent_id: "${bp_id}" }
              as: Caseworker
              captures: { match_id: $.data.id }
            - call: "POST /matches/${match_id}/accept"
              payload: {}
              as: Supervisor
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Supervisor
              captures: { case_v2: $.data.version }
            - call: "POST /consent-records"
              payload: { case_id: "${case_id}", birth_parent_id: "${bp_id}", child_dob: "2026-06-01T08:00:00.000Z", revocation_basis: "CALENDAR_DAYS", expected_case_version: "${case_v2}" }
              as: Caseworker
              captures: { consent_cal_id: $.data.id, case_v3: $.data.version }
            - call: "POST /consent-records/${consent_cal_id}/sign"
              payload: {}
              as: Caseworker
            - call: "POST /consent-records"
              payload: { case_id: "${case_id}", birth_parent_id: "${bp_id}", child_dob: "2026-06-01T08:00:00.000Z", revocation_basis: "BUSINESS_DAYS", expected_case_version: "${case_v3}" }
              as: Caseworker
              captures: { consent_bus_id: $.data.id }
          trigger:
            - call: "POST /consent-records/${consent_bus_id}/sign"
              payload: {}
              as: Caseworker
              captures: { bus_deadline: $.data.revocation_deadline }
          assert:
            - "ConsentRecord.${consent_cal_id}.revocation_deadline == '2026-06-14T08:00:00.000Z'"
            - "ConsentRecord.${consent_bus_id}.revocation_deadline == '2026-06-11T23:59:59.000Z'"
            - "ConsentRecord.${consent_cal_id}.revocation_deadline != ConsentRecord.${consent_bus_id}.revocation_deadline"

      - name: agency_fee_sliding_scale_bands
        grounds:
          - calculations.agency_fee_total
          - entities.AgencyFeeInvoice.fields.total_due_cents
          - entities.AgencyFeeInvoice.fields.sliding_scale_pct
        distinguishing_aspect: |
          Same base fee yields two DIFFERENT total_due_cents depending on the
          family's income band (mid-band pct=0.00 vs high-band pct=+0.15); this
          dual-variant operates on the AgencyFeeInvoice (billing) domain, a
          different entity domain than instance 1's ConsentRecord timeline.
        test_recipe:
          setup:
            - "Agency with fee_schedule_cents=3000000."
            - "Case A has a family with annual_income_cents=8000000 (mid band, pct 0.00) and zero reimbursable expenses."
            - "Case B has a family with annual_income_cents=15000000 (high band, pct +0.15) and zero reimbursable expenses."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace Adoption", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-mid", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_mid_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_mid_id}", primary_applicant_name: "Mid", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-high", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_high_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_high_id}", primary_applicant_name: "High", residence_state: "CA", household_size: 2, annual_income_cents: 15000000 }
              as: Caseworker
            - call: "POST /agency-fee-invoices"
              payload: { case_id: "${case_mid_id}" }
              as: FinanceOfficer
              captures: { inv_mid_id: $.data.id }
          trigger:
            - call: "POST /agency-fee-invoices"
              payload: { case_id: "${case_high_id}" }
              as: FinanceOfficer
              captures: { inv_high_id: $.data.id }
          assert:
            - "AgencyFeeInvoice.${inv_mid_id}.sliding_scale_pct == 0.0"
            - "AgencyFeeInvoice.${inv_mid_id}.total_due_cents == 3000000"
            - "AgencyFeeInvoice.${inv_high_id}.sliding_scale_pct == 0.15"
            - "AgencyFeeInvoice.${inv_high_id}.total_due_cents == 3450000"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: agency_fee_tiered_min_branch_mode_a
        grounds:
          - calculations.agency_fee_total
          - entities.AgencyFeeInvoice.fields.total_due_cents
          - entities.AdoptionCase.fields.reimbursable_expense_cents
        distinguishing_aspect: |
          MODE (a): total_due_cents combines >=3 inputs (base fee, income band
          selection, reimbursable) with non-linear interaction — a threshold
          branch on income AND a min(reimbursable, CAP) clamp — so the output is
          not a linear function of any single input.
        test_recipe:
          setup:
            - "Agency fee_schedule_cents=3000000; mid-band family income 8000000 (pct 0.00)."
            - "Case has reimbursable_expense_cents=2000000 (one APPROVED expense of 2000000), which exceeds the 1500000 cap and is clamped."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-cap", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Mid", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "MEDICAL", amount_cents: 2000000 }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { exp_id: $.data.id }
            - call: "POST /expense-entries/${exp_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fo-1"
          trigger:
            - call: "POST /agency-fee-invoices"
              payload: { case_id: "${case_id}" }
              as: FinanceOfficer
              captures: { inv_id: $.data.id }
          assert:
            - "AgencyFeeInvoice.${inv_id}.base_fee_cents == 3000000"
            - "AgencyFeeInvoice.${inv_id}.total_due_cents == 4500000"

      - name: agency_fee_per_component_rounding_mode_b
        grounds:
          - calculations.agency_fee_total
          - entities.AgencyFeeInvoice.fields.total_due_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters — round EACH
          sliding-scaled component (base, reimbursable) THEN sum; the forbidden
          sum-then-round order gives 46 instead of 47 for base=30, reimb=10 at
          pct=0.15. Distinct mode from instance 1's (a).
        test_recipe:
          setup:
            - "Agency fee_schedule_cents=30 (tiny, to force a half-cent under the surcharge)."
            - "High-band family income 15000000 (pct +0.15)."
            - "Case has one APPROVED expense of 10 cents (reimbursable=10, below cap)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Tiny", licensed_state: "CA", fee_schedule_cents: 30 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-round", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "High", residence_state: "CA", household_size: 2, annual_income_cents: 15000000 }
              as: Caseworker
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "LEGAL", amount_cents: 10 }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { exp_id: $.data.id }
            - call: "POST /expense-entries/${exp_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fo-1"
          trigger:
            - call: "POST /agency-fee-invoices"
              payload: { case_id: "${case_id}" }
              as: FinanceOfficer
              captures: { inv_id: $.data.id }
          assert:
            - "AgencyFeeInvoice.${inv_id}.total_due_cents == 47"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: home_study_revision_cycle
        grounds:
          - state_machines.HomeStudy.UNDER_REVIEW_to_DEFICIENT
          - state_machines.HomeStudy.DEFICIENT_to_RESUBMITTED
          - state_machines.HomeStudy.RESUBMITTED_to_UNDER_REVIEW
          - entities.HomeStudy.fields.revision_count
        distinguishing_aspect: |
          CYCLE on HomeStudy: UNDER_REVIEW -> DEFICIENT -> RESUBMITTED ->
          UNDER_REVIEW loops back to a previously-visited state; revision_count
          increments each loop. Cycle lives on HomeStudy, distinct from
          instance 2's ICPC branch-with-revert.
        test_recipe:
          setup:
            - "A HomeStudy created by cw-1, submitted, returned as DEFICIENT (revision_count=1), resubmitted, and re-submitted into UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /home-studies/${hs_id}/return"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /home-studies/${hs_id}/resubmit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_status: $.data.status, rev: $.data.revision_count }
          assert:
            - "HomeStudy.${hs_id}.status == 'UNDER_REVIEW'"
            - "HomeStudy.${hs_id}.revision_count == 1"

      - name: icpc_branch_with_revert
        grounds:
          - state_machines.IcpcClearance.SUBMITTED_to_REJECTED
          - state_machines.IcpcClearance.REJECTED_to_DRAFT
          - state_machines.IcpcClearance.DRAFT_to_SUBMITTED
          - entities.IcpcClearance.fields.submitted_at
        distinguishing_aspect: |
          BRANCH-WITH-REVERT on IcpcClearance: SUBMITTED forks to either
          SENDING_APPROVED or REJECTED, and REJECTED reverts to DRAFT (clearing
          submitted_at) for rework — a non-linear revert on a different entity
          than instance 1's HomeStudy cycle.
        test_recipe:
          setup:
            - "Interstate case (NV->CA) with ACCEPTED Match; ICPC clearance created (DRAFT), submitted, then rejected; then reworked back to DRAFT."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-int", child_state: "NV", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /home-studies/${hs_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "NV", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /matches"
              payload: { case_id: "${case_id}", family_id: "${family_id}", birth_parent_id: "${bp_id}" }
              as: Caseworker
              captures: { match_id: $.data.id }
            - call: "POST /matches/${match_id}/accept"
              payload: {}
              as: Supervisor
            - call: "POST /icpc-clearances"
              payload: { case_id: "${case_id}" }
              as: Caseworker
              captures: { icpc_id: $.data.id }
            - call: "POST /icpc-clearances/${icpc_id}/submit"
              payload: {}
              as: Caseworker
            - call: "POST /icpc-clearances/${icpc_id}/reject"
              payload: {}
              as: CompactAdministrator
          trigger:
            - call: "POST /icpc-clearances/${icpc_id}/rework"
              payload: {}
              as: Caseworker
              captures: { icpc_status: $.data.status, sub_at: $.data.submitted_at }
          assert:
            - "IcpcClearance.${icpc_id}.status == 'DRAFT'"
            - "IcpcClearance.${icpc_id}.submitted_at == null"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consent_revoke_cascades_placement_visits_phase
        grounds:
          - state_machines.ConsentRecord.SIGNED_to_REVOKED
          - state_machines.Placement.ACTIVE_to_DISRUPTED
          - state_machines.PostPlacementVisit.SCHEDULED_to_MISSED
          - entities.AdoptionCase.fields.phase
        distinguishing_aspect: |
          DEPTH-3 cascade from consent revoke: revoke (A) disrupts the ACTIVE
          Placement (B); the Placement disruption B marks SCHEDULED visits MISSED
          (C); and bubbles AdoptionCase.phase -> DISRUPTED (D). Each hop is caused
          by the prior hop, not by the revoke directly.
        test_recipe:
          setup:
            - "In-state case (CA->CA) fully advanced: APPROVED HomeStudy, ACCEPTED Match, a SIGNED ConsentRecord whose revocation window is still open, an IRREVOCABLE ConsentRecord enabling placement, an ACTIVE Placement, and one SCHEDULED PostPlacementVisit."
            - "Clock set to 2026-06-05T00:00:00Z, before the SIGNED consent's revocation_deadline."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-06-04T08:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-cas", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /home-studies/${hs_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "CA", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /matches"
              payload: { case_id: "${case_id}", family_id: "${family_id}", birth_parent_id: "${bp_id}" }
              as: Caseworker
              captures: { match_id: $.data.id }
            - call: "POST /matches/${match_id}/accept"
              payload: {}
              as: Supervisor
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Supervisor
              captures: { cv1: $.data.version }
            - call: "POST /consent-records"
              payload: { case_id: "${case_id}", birth_parent_id: "${bp_id}", child_dob: "2026-06-01T08:00:00.000Z", revocation_basis: "BUSINESS_DAYS", expected_case_version: "${cv1}" }
              as: Caseworker
              captures: { consent_irr_id: $.data.id, cv2: $.data.version }
            - call: "POST /consent-records/${consent_irr_id}/sign"
              payload: {}
              as: Caseworker
            - call: "POST /consent-records/${consent_irr_id}/finalize-consent"
              payload: {}
              as: AgencyAdmin
            - call: "POST /placements"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Supervisor
              captures: { placement_id: $.data.id }
            - call: "POST /placements/${placement_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /post-placement-visits"
              payload: { case_id: "${case_id}", placement_id: "${placement_id}", window_start: "2026-06-10T09:00:00.000Z", window_end: "2026-06-10T17:00:00.000Z" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { visit_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Supervisor
              captures: { cv3: $.data.version }
            - call: "POST /consent-records"
              payload: { case_id: "${case_id}", birth_parent_id: "${bp_id}", child_dob: "2026-06-01T08:00:00.000Z", revocation_basis: "BUSINESS_DAYS", expected_case_version: "${cv3}" }
              as: Caseworker
              captures: { consent_open_id: $.data.id }
            - call: "POST /consent-records/${consent_open_id}/sign"
              payload: {}
              as: Caseworker
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-06-05T00:00:00.000Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /consent-records/${consent_open_id}/revoke"
              payload: {}
              as: Caseworker
          assert:
            - "Placement.${placement_id}.status == 'DISRUPTED'"
            - "PostPlacementVisit.${visit_id}.status == 'MISSED'"
            - "AdoptionCase.${case_id}.phase == 'DISRUPTED'"

      - name: expense_disburse_cascades_escrow_balance
        grounds:
          - state_machines.ExpenseEntry.APPROVED_to_DISBURSED
          - entities.EscrowTransaction.fields.txn_type
          - calculations.escrow_balance
          - entities.AdoptionCase.fields.escrow_balance_cents
        distinguishing_aspect: |
          DEPTH-2 cascade from a different trigger (expense disburse): disburse
          (A) creates a DISBURSEMENT EscrowTransaction (B), and that transaction
          recomputes AdoptionCase.escrow_balance_cents (C). Each hop caused by the
          prior; trigger transition differs from instance 1's consent revoke.
        test_recipe:
          setup:
            - "Case with escrow_balance_cents=1000000 (one DEPOSIT of 1000000) and an APPROVED ExpenseEntry of 300000."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-esc", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /escrow-transactions"
              payload: { case_id: "${case_id}", txn_type: "DEPOSIT", amount_cents: 1000000, expected_case_version: "${cv0}" }
              as: FinanceOfficer
              captures: { dep_id: $.data.id }
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "MEDICAL", amount_cents: 300000 }
              as: Caseworker
