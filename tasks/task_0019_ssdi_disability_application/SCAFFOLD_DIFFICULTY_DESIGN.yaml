          Interval semantics: a CLOSED 60-day window starting at
          MedicalDeterminationDecision.created_at and ending inclusively at
          decision_date + 60 days. Reconsideration MUST be requested within
          this window. After day 60, the appeal interval has closed; request
          collides with the closed window and is rejected. Resource:
          Application (appeal-window interval).
