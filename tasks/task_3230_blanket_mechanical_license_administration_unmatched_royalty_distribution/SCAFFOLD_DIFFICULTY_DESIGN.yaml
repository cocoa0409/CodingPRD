            - call: "POST /mlc/works"
              payload: { title: "Harrier" }
              as: MLCAdministrator
              captures: { w2: $.data.id, w2_v: $.data.version }
            - call: "POST /mlc/works/${w2}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 100, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w2_v}" }
