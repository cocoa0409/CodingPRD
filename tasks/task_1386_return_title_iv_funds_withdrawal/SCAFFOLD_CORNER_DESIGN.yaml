        grounds:
          - "errors[ERR_BREAK_OVERLAP]"
        excluded_because:
          difficulty_instance: break_adjacency_merges_for_deduction
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_stale_version_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_VERSION]"
        excluded_because:
          difficulty_instance: withdrawal_case_recalculate_loop_then_autoclose
          rationale: "The OCC write path and version capture are exercised there; the explicit 412 stale-version rejection is additionally covered by corner instance occ_stale_version_rejected below — this stub covers only the bare error-catalog row."

