            - "${h1_rank_after} == SECOND and ${h1_status_after} == HELD - at most one promotion per vacated window, so the loser keeps rank SECOND"
            - "${large_posture} == TENTATIVE, ${small_posture} == NONE, ${inc_posture} == RELEASED"
            - "GET /space-holds?center_hall_id=${hall_id}&hold_rank=FIRST&status=HELD returns exactly 1 row, id ${h2_id}"

  - rule_id: compensating_invariant
    instances:
      - name: fund_ledger_identity_survives_charge_decommit_receipt_and_recharge
        grounds:
          - entities.IncentiveFund.fields.uncommitted_amount
          - entities.IncentiveFund.fields.committed_amount
          - entities.IncentiveFund.fields.disbursed_amount
          - entities.LodgingTaxReceipt
          - state_machines.Opportunity.sales_stage.QUALIFIED_to_LOST
          - calculations.fund_charge_composition
        distinguishing_aspect: |
          budget_amount - committed_amount - disbursed_amount == uncommitted_amount is a conserved quantity that
          must hold at FIVE checkpoints across a charge, a full decommit driven from a different entity (the
          opportunity is lost, which declines the bid and reverses its charge), a lodging-tax receipt that
          RAISES the budget, and a fresh charge on a second opportunity. The decommit must restore
          uncommitted_amount to exactly 500000.00 - not 499999.xx and not the pre-fee 491000.00 - so the
          reversal has to unwind the 450.00 admin fee together with the 9000.00 principal.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; planner CDA (legacy 2 / 6000, tier TIER_B); incentive fund FY2028 with budget_amount 500000.00"
            - "opportunity ONE QUALIFIED with 1800 requested room nights at ceiling 219.00, no committed block (coverage_factor 0.75, incentive_cap_amount 11086.88)"
            - "opportunity TWO identical to ONE, created later, used for the re-charge checkpoint"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org", legacy_definite_count: 2, legacy_definite_room_nights: 6000 }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /incentive-funds"
              payload: { fiscal_year: 2028, budget_amount: 500000.00 }
              as: BureauAdmin
              captures: { fund_id: $.data.id, budget_cp0: $.data.budget_amount, committed_cp0: $.data.committed_amount, disbursed_cp0: $.data.disbursed_amount, uncommitted_cp0: $.data.uncommitted_amount, receipts_cp0: $.data.lodging_tax_receipts_total }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_one_id: $.data.id }
            - call: "POST /opportunities/${opp_one_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { opp_one_v: $.data.version }
            - call: "POST /bid-packages"
              payload: { opportunity_id: "${opp_one_id}", expected_opportunity_version: "${opp_one_v}" }
              as: SalesManager
              as_user_id: "sales-11"
              captures: { bid_one_id: $.data.id }
            - call: "POST /bid-packages/${bid_one_id}/request-incentive"
              payload: { incentive_request_amount: 9000.00, service_commitment_codes: ["AIRPORT_SHUTTLE"] }
              as: SalesManager
              as_user_id: "sales-11"
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { fund_v_a: $.data.version }
            - call: "POST /bid-packages/${bid_one_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 9000.00, rationale: "Charge to be fully reversed", expected_fund_version: "${fund_v_a}" }
              as: IncentiveApprover
              as_user_id: "approver-01"
              captures: { charge_one: $.data.total_charge_amount, fee_one: $.data.admin_fee_amount }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { committed_cp1: $.data.committed_amount, uncommitted_cp1: $.data.uncommitted_amount, disbursed_cp1: $.data.disbursed_amount }
          trigger:
            - call: "POST /opportunities/${opp_one_id}/lose"
              payload: { lost_reason: "RATE_TOO_HIGH" }
              as: SalesManager
              captures: { stage_lost: $.data.sales_stage }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { budget_cp2: $.data.budget_amount, committed_cp2: $.data.committed_amount, disbursed_cp2: $.data.disbursed_amount, uncommitted_cp2: $.data.uncommitted_amount, posture_cp2: $.data.posture }
            - call: "POST /incentive-funds/${fund_id}/lodging-tax-receipts"
              payload: { amount: 3400.00, received_at: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
              captures: { receipt_id: $.data.id }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { budget_cp3: $.data.budget_amount, uncommitted_cp3: $.data.uncommitted_amount, receipts_cp3: $.data.lodging_tax_receipts_total, fund_v_b: $.data.version }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2029", arrival_date: "2028-11-10", departure_date: "2028-11-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_two_id: $.data.id }
            - call: "POST /opportunities/${opp_two_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { opp_two_v: $.data.version }
            - call: "POST /bid-packages"
              payload: { opportunity_id: "${opp_two_id}", expected_opportunity_version: "${opp_two_v}" }
              as: SalesManager
              as_user_id: "sales-11"
              captures: { bid_two_id: $.data.id }
            - call: "POST /bid-packages/${bid_two_id}/request-incentive"
              payload: { incentive_request_amount: 9000.00, service_commitment_codes: ["AIRPORT_SHUTTLE"] }
              as: SalesManager
              as_user_id: "sales-11"
            - call: "POST /bid-packages/${bid_two_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 9000.00, rationale: "Fresh charge after the reversal", expected_fund_version: "${fund_v_b}" }
              as: IncentiveApprover
              as_user_id: "approver-01"
              captures: { charge_two: $.data.total_charge_amount }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { budget_cp4: $.data.budget_amount, committed_cp4: $.data.committed_amount, disbursed_cp4: $.data.disbursed_amount, uncommitted_cp4: $.data.uncommitted_amount }
          assert:
            - "CP0: ${budget_cp0} == 500000.00, ${committed_cp0} == 0.00, ${disbursed_cp0} == 0.00, ${uncommitted_cp0} == 500000.00, ${receipts_cp0} == 0.00"
            - "CP1: ${fee_one} == 450.00, ${charge_one} == 9450.00, ${committed_cp1} == 9450.00, ${disbursed_cp1} == 0.00, ${uncommitted_cp1} == 490550.00"
            - "${stage_lost} == LOST and BidPackage.${bid_one_id}.status == DECLINED with decline_reason RATE_TOO_HIGH"
            - "CP2: ${budget_cp2} == 500000.00, ${committed_cp2} == 0.00, ${disbursed_cp2} == 0.00, ${uncommitted_cp2} == 500000.00, ${posture_cp2} == OPEN - the 450.00 fee is reversed together with the 9000.00 principal"
            - "CP3: ${receipts_cp3} == 3400.00, ${budget_cp3} == 503400.00, ${uncommitted_cp3} == 503400.00"
            - "CP4: ${charge_two} == 9450.00, ${budget_cp4} == 503400.00, ${committed_cp4} == 9450.00, ${disbursed_cp4} == 0.00, ${uncommitted_cp4} == 493950.00"
            - "at every checkpoint budget_amount - committed_amount - disbursed_amount == uncommitted_amount holds exactly, with no cent of drift"
            - "GET /incentive-funds/${fund_id}/incentive-decisions returns 2 rows - the reversal deletes no history, it only moves the ledger"

      - name: hotel_room_counters_return_to_their_prior_values_after_withdraw
        grounds:
          - state_machines.RoomBlockCommitment.COMMITTED_to_WITHDRAWN
          - calculations.hotel_nightly_block_capacity
          - calculations.citywide_block_readiness
          - entities.Hotel.fields.committed_peak_rooms
          - entities.Opportunity.fields.block_coverage_pct
        distinguishing_aspect: |
          The withdraw side effects must be an exact inverse of the commit side effects on THREE derived
          quantities at once: Hotel.committed_peak_rooms (a nightly maximum, 400 -> 300), Hotel
          committed_room_nights (a sum, 800 -> 600) and Opportunity.block_coverage_pct (40.00 -> 30.00). Because
          committed_peak_rooms is a max and not a running total, an implementation that "subtracts what it
          added" happens to be right here but is caught by the re-commit leg, where the counters must climb back
          to exactly 400 / 800 / 40.00 through a NEW commitment row rather than by reviving the withdrawn one.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; Bayside Suites with committable_rooms 400"
            - "opportunity CDA Annual 2028 QUALIFIED, 2 event nights, peak_rooms_requested 1000"
            - "commitment ALPHA for Bayside COMMITTED at 300 rooms (rate 209.77, cutoff 30) - baseline counters are peak 300, room nights 600, coverage 30.00"
            - "commitment BETA for Harborview Grand COMMITTED at 100 rooms (rate 214.33, cutoff 30) - counters climb to opportunity coverage 40.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
