            - { call: "POST /api/v1/test-year-entries/${ea}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rca}", label: "Plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rba: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rba}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-B", utility_name: "Utility B", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1180000101, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rcb: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rcb}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { eb: $.data.id } }
            - { call: "POST /api/v1/test-year-entries/${eb}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${eb}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rcb}", label: "Plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rbb: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rbb}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-C", utility_name: "Utility C", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 0, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rcc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rcc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 0 }, as: UtilityFiler, captures: { ec: $.data.id } }
            - { call: "POST /api/v1/test-year-entries/${ec}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${ec}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rcc}", label: "Fully depreciated plant", plant_in_service_cents: 500000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 0, accumulated_deferred_taxes_cents: 0 }, as: UtilityFiler, captures: { rbc: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rbc}/submit", payload: {}, as: UtilityFiler }
          trigger:
            - { call: "POST /api/v1/rate-cases/${rca}/submit-filing", payload: {}, as: UtilityFiler, captures: { st_a: $.data.status } }
            - { call: "POST /api/v1/rate-cases/${rcb}/submit-filing", payload: {}, as: UtilityFiler, captures: { err_b: $.data.error_id } }
            - { call: "POST /api/v1/rate-cases/${rcc}/submit-filing", payload: {}, as: UtilityFiler, captures: { err_c: $.data.error_id } }
          assert:
            - "${st_a} == FILED (|1180000100 - 1180000000| == 100 <= 100 tolerance, inclusive boundary)"
            - "${err_b} == ERR_RR_MISMATCH (diff 101 > 100)"
            - "${err_c} == ERR_NONPOSITIVE_REVENUE_REQUIREMENT (computed 0; the nonpositive guard is evaluated before the mismatch check, which would also have passed at diff 0)"

