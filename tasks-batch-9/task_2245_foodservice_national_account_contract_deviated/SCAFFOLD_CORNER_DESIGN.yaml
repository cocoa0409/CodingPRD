          - entities.DeviationAgreement.fields.max_operator_price_cents
        distinguishing_aspect: |
          Priority 40 cannot be evaluated from the payload alone: with an AVG_COST entry
          band of 4100 a protected discount of 100 resolves to 4000 and is rejected
          against the 3900 ceiling, while a discount of 200 resolves to exactly 3900 and
          is accepted, proving the resolution runs first and the comparison is inclusive.
        test_recipe:
          setup:
            - "An ACTIVE contract whose PROTEIN entry band is AVG_COST PERCENT_OF_COST 25.00 on [0, unbounded)."
            - "Product P-CHKN with avg_cost 4100."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
              captures: { chkn_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "AVG_COST", markup_type: "PERCENT_OF_COST", markup_value: 25.00, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ct_ver: $.data.version }
          trigger:
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "COST_PLUS_PROTECTED", protected_discount_cents: 100, max_operator_price_cents: 3900, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { err_ceiling: $.data.error_id }
            - call: "GET /nac/contracts/${ct_id}"
              payload: {}
              as: PricingAnalyst
              captures: { ct_ver2: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "COST_PLUS_PROTECTED", protected_discount_cents: 200, max_operator_price_cents: 3900, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver2}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev_id: $.data.id, dev_price: $.data.deviated_price_cents, dev_status: $.data.status }
          assert:
            - "${err_ceiling} == ERR_DEVIATED_PRICE_ABOVE_CEILING with HTTP 422 because 4100 - 100 == 4000 exceeds the 3900 ceiling"
            - "${ct_ver2} == ${ct_ver}: the rejected create wrote nothing, so the contract version did not move"
            - "${dev_price} == 3900 and ${dev_status} == DRAFT: equality with max_operator_price_cents passes the inclusive check"
            - "GET /nac/deviation-agreements?contract_id=${ct_id} returns exactly 1 row, ${dev_id}"

      - claim_type: Conditional validation
        name: amendment_signature_requires_the_parent_to_still_be_amending
        grounds:
          - validations[priority=7]
          - state_machines.Contract.ACTIVE_to_AMENDING
          - state_machines.Contract.AMENDING_to_SUSPENDED
          - state_machines.Contract.SUSPENDED_to_ACTIVE
          - errors.ERR_PARENT_CONTRACT_NOT_AMENDING
          - entities.Contract.fields.amends_contract_id
        distinguishing_aspect: |
          The rule fires only for a child carrying amends_contract_id: suspending the
          parent mid-amendment strands the PENDING_SIGNATURE draft, and reinstating the
          parent to ACTIVE does not repair it either, because priority 7 demands AMENDING
          specifically and not merely a live parent.
        test_recipe:
          setup:
            - "An ACTIVE parent contract HLG-2026 with a tier and a coverage."
            - "An amendment draft HLG-2027 created from it, given its own tier and coverage and submitted for signature; the parent is therefore AMENDING."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { parent_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${parent_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 25.00, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${parent_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${parent_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${parent_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/contracts/${parent_id}/amendments"
              payload: { contract_code: "HLG-2027", effective_from: "2027-08-01T00:00:00Z", effective_to: "2028-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { child_id: $.data.id, child_parent: $.data.amends_contract_id, child_status: $.data.status }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${child_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 22.00, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${child_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2027-08-01T00:00:00Z", coverage_to: "2028-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${child_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
              captures: { child_pending: $.data.status }
          trigger:
            - call: "POST /nac/contracts/${parent_id}/suspend"
              payload: { note: "Credit hold during amendment" }
              as: NationalAccountManager
              captures: { parent_susp: $.data.status }
            - call: "POST /nac/contracts/${child_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { err_parent: $.data.error_id }
            - call: "POST /nac/contracts/${parent_id}/reinstate"
              payload: {}
              as: NationalAccountManager
              captures: { parent_back: $.data.status }
            - call: "POST /nac/contracts/${child_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { err_parent2: $.data.error_id }
            - call: "POST /nac/contracts/${child_id}/terminate"
              payload: { reason: "Amendment abandoned" }
              as: NationalAccountManager
              captures: { child_final: $.data.status }
            - call: "POST /nac/contracts/${parent_id}/amendments"
              payload: { contract_code: "HLG-2027B", effective_from: "2027-08-01T00:00:00Z", effective_to: "2028-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { child2_id: $.data.id, parent_amending_again: $.data.amends_contract_id }
          assert:
            - "${child_parent} == ${parent_id}, ${child_status} == DRAFT and ${child_pending} == PENDING_SIGNATURE"
            - "${parent_susp} == SUSPENDED"
            - "${err_parent} == ERR_PARENT_CONTRACT_NOT_AMENDING with HTTP 409 and Contract.${child_id}.status stays PENDING_SIGNATURE"
            - "${parent_back} == ACTIVE"
            - "${err_parent2} == ERR_PARENT_CONTRACT_NOT_AMENDING with HTTP 409: an ACTIVE parent is still not an AMENDING parent"
            - "${child_final} == TERMINATED and Contract.${parent_id}.status is still ACTIVE"
            - "${parent_amending_again} == ${parent_id} and Contract.${parent_id}.status == AMENDING, so nothing was deadlocked by the suspension"
            - "amendment draft ${child2_id} exists in DRAFT, so the parent can be amended again"

      - claim_type: Priority conflict
        name: higher_priority_state_error_masks_the_lower_priority_business_error
        grounds:
          - validations[priority=6]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: suspended_contract_outranks_deviated_price_ceiling
          rationale: |
            That §1.8 instance issues one call that violates priority 6 and priority 40
            together and asserts ERR_CONTRACT_NOT_ACTIVE, then repairs the contract and
            watches the same payload fall through to ERR_DEVIATED_PRICE_ABOVE_CEILING.

      - claim_type: Aggregate validation
        name: collective_interval_gap_exceeds_the_declared_buffer
        grounds:
          - validations[priority=19]
        excluded_because:
          difficulty_instance: dc_coverage_intervals_closed_with_fourteen_day_changeover_buffer
          rationale: |
            That §1.8 instance walks the 14-day buffer at 13, 14 and 15 days of gap on the
            same (contract, distribution_center) pair, which is this row in full.

  # ===========================================================================
  # Section: Endpoints
  # ===========================================================================
  - section: Endpoints
    instances:
      - claim_type: Standard CRUD
        name: reference_data_create_read_and_filtered_list_round_trip
        grounds:
          - endpoints["POST /nac/products"]
          - endpoints["GET /nac/products/{product_id}"]
          - endpoints["GET /nac/products"]
          - entities.Product
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Every stored product field survives the write-read round trip, and the list
          endpoint's filters compose: product_class_code PROTEIN with limit 2 returns
          exactly the two PROTEIN rows and never the DAIRY row, while there is no update
          or delete endpoint anywhere in the surface.
        test_recipe:
          setup:
            - "One manufacturer exists; no products exist."
          setup_api_calls:
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
          trigger:
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300, substitution_group_code: "CHKN" }
              as: SystemAdmin
              captures: { chkn_id: $.data.id, chkn_stock: $.data.stock_status, chkn_status: $.data.status, chkn_ver: $.data.version }
            - call: "POST /nac/products"
              payload: { sku: "P-BEEF", description: "Beef Chuck 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 5200, avg_cost_cents: 5100, replacement_cost_cents: 5300 }
              as: SystemAdmin
              captures: { beef_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-MILK", description: "Whole Milk 4/1gal", product_class_code: "DAIRY", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 3200, avg_cost_cents: 3100, replacement_cost_cents: 3300 }
              as: SystemAdmin
              captures: { milk_id: $.data.id }
            - call: "GET /nac/products/${chkn_id}"
              payload: {}
              as: NationalAccountManager
              captures: { read_sku: $.data.sku, read_last: $.data.last_cost_cents, read_avg: $.data.avg_cost_cents, read_repl: $.data.replacement_cost_cents, read_group: $.data.substitution_group_code, read_pack: $.data.pack_size }
            - call: "GET /nac/products"
              payload: { product_class_code: "PROTEIN", limit: 2, offset: 0 }
              as: PricingAnalyst
              captures: { protein_page: $.data }
            - call: "GET /nac/products"
              payload: { manufacturer_id: "${mfg_id}", product_class_code: "DAIRY", limit: 10, offset: 0 }
              as: PricingAnalyst
              captures: { dairy_page: $.data }
          assert:
            - "${read_sku} == P-CHKN, ${read_last} == 4200, ${read_avg} == 4100, ${read_repl} == 4300, ${read_group} == CHKN and ${read_pack} == 4"
            - "${chkn_stock} == IN_STOCK, ${chkn_status} == ACTIVE and ${chkn_ver} == 1 on creation"
            - "${protein_page} contains exactly the ids ${chkn_id} and ${beef_id}, in that creation order, and never ${milk_id}"
            - "${dairy_page} contains exactly ${milk_id}"
            - "the surface declares no PUT, PATCH or DELETE on /nac/products, so the only mutation path is POST /nac/products/{product_id}/availability"

      - claim_type: Action endpoint
        name: clock_advance_sweeps_contract_coverage_and_deviations
        grounds:
          - endpoints["POST /nac/_clock/set_current_utc"]
          - state_machines.Contract.ACTIVE_to_EXPIRED
          - state_machines.DeviationAgreement.ACTIVE_to_TERMINATED
          - state_machines.DcCoverage.ACTIVE_to_ENDED
        distinguishing_aspect: |
          One clock call past effective_to returns the swept ids in its own response body
          and leaves the contract EXPIRED, its ACTIVE deviation TERMINATED and its
          coverage ENDED while the tier stays ACTIVE, and a second advance sweeps nothing
          because the entities are already terminal.
        test_recipe:
          setup:
            - "An ACTIVE contract whose term ends 2026-08-31T23:59:59Z, with one PROTEIN tier, one IN_MARKET coverage and one ACTIVE FIXED_NET_PRICE deviation."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000 }
              as: SystemAdmin
              captures: { chkn_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-SHORT", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 25.00, min_case_volume: 0 }
              as: NationalAccountManager
              captures: { tier_id: $.data.id }
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2026-08-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { cov_id: $.data.id }
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ct_ver: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 4200, max_operator_price_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T23:59:59Z", expected_contract_version: "${ct_ver}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev_id: $.data.id }
            - call: "POST /nac/deviation-agreements/${dev_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nac/deviation-agreements/${dev_id}/manufacturer-decision"
              payload: { decision: "APPROVE" }
              as: ManufacturerRep
              as_user_id: "${mfg_id}"
            - call: "POST /nac/deviation-agreements/${dev_id}/activate"
              payload: {}
              as: NationalAccountManager
              as_user_id: "nam-1"
              captures: { dev_status: $.data.status }
          trigger:
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
              captures: { now: $.data.current_utc, swept_contracts: $.data.expired_contract_ids, swept_devs: $.data.expired_deviation_ids }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: SystemAdmin
              captures: { swept_again: $.data.expired_contract_ids }
          assert:
            - "${dev_status} == ACTIVE before the sweep"
            - "${now} == 2026-09-01T00:00:00Z"
            - "${swept_contracts} contains exactly ${ct_id} and ${swept_devs} contains exactly ${dev_id}"
            - "Contract.${ct_id}.status == EXPIRED, DeviationAgreement.${dev_id}.status == TERMINATED and DcCoverage.${cov_id}.status == ENDED"
            - "ContractTier.${tier_id}.status is still ACTIVE: expiry ends coverages and deviations but never supersedes tiers"
            - "${swept_again} is an empty list on the second advance, so the sweep is not repeated"

      - claim_type: Cross-reference link
        name: substitution_rule_requires_both_products_and_the_contract_to_exist
        grounds:
          - endpoints["POST /nac/substitution-rules"]
          - entities.SubstitutionRule.fields.primary_product_id
          - entities.SubstitutionRule.fields.substitute_product_id
          - validations[priority=3]
          - errors.ERR_PRODUCT_NOT_FOUND
        distinguishing_aspect: |
          The link endpoint validates three foreign keys independently: an unknown
          substitute id fails with ERR_PRODUCT_NOT_FOUND before any group comparison, and
          the successful row carries all three ids so the rule is reachable by either
          product filter.
        test_recipe:
          setup:
            - "A DRAFT contract with a PROTEIN tier; products P-CHKN and S1-CHKN share substitution_group_code CHKN."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000, substitution_group_code: "CHKN" }
              as: SystemAdmin
              captures: { chkn_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "S1-CHKN", description: "Chicken Breast alt", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4100, avg_cost_cents: 4100, replacement_cost_cents: 4100, substitution_group_code: "CHKN" }
              as: SystemAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 25.00, min_case_volume: 0 }
              as: NationalAccountManager
          trigger:
            - call: "POST /nac/substitution-rules"
              payload: { contract_id: "${ct_id}", primary_product_id: "${chkn_id}", substitute_product_id: "00000000-0000-0000-0000-000000000000", rank: 1, price_protection_mode: "HOLD_CONTRACT_PRICE", max_price_delta_pct: 5.00 }
              as: NationalAccountManager
              captures: { err_sub: $.data.error_id }
            - call: "POST /nac/substitution-rules"
              payload: { contract_id: "00000000-0000-0000-0000-000000000000", primary_product_id: "${chkn_id}", substitute_product_id: "${s1_id}", rank: 1, price_protection_mode: "HOLD_CONTRACT_PRICE", max_price_delta_pct: 5.00 }
              as: NationalAccountManager
              captures: { err_ct: $.data.error_id }
            - call: "POST /nac/substitution-rules"
              payload: { contract_id: "${ct_id}", primary_product_id: "${chkn_id}", substitute_product_id: "${s1_id}", rank: 1, price_protection_mode: "HOLD_CONTRACT_PRICE", max_price_delta_pct: 5.00 }
              as: NationalAccountManager
              captures: { rule_id: $.data.id, rule_primary: $.data.primary_product_id, rule_sub: $.data.substitute_product_id, rule_ct: $.data.contract_id, rule_mode: $.data.price_protection_mode }
            - call: "GET /nac/substitution-rules"
              payload: { primary_product_id: "${chkn_id}", status: "ACTIVE", limit: 10, offset: 0 }
              as: NationalAccountManager
              captures: { by_primary: $.data }
            - call: "GET /nac/substitution-rules"
              payload: { contract_id: "${ct_id}", limit: 10, offset: 0 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { by_contract: $.data }
          assert:
            - "${err_sub} == ERR_PRODUCT_NOT_FOUND with HTTP 404 (priority 3 runs before the priority 11 group comparison)"
