      - name: layer_cascading_side_effects_full_chain_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: cascade_audit_sustain_to_merchant_to_enrollment_to_capacity_to_waitlist_promotion
          rationale: "The §1.8 transitive-cascade instance already walks the full five-hop chain (audit SUSTAINED -> merchant assigned_mcc rewrite -> enrollment TERMINATED_INELIGIBLE -> capacity credit -> program reopen and waitlist promotion) and asserts every intermediate hop plus ordering sensitivity, so a separate breadth instance would duplicate it exactly."

      - name: layer_cascading_side_effects_ordering_sensitivity_of_the_finalize_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: cascade_batch_finalize_to_downgrade_counter_to_auto_audit_to_reclassification_suspension
          rationale: "Ordering sensitivity in the finalize chain (assessment before counter increment before audit auto-open before reclassification suspension) is precisely what the §1.8 finalize cascade instance pins down with per-hop assertions, so it is covered at greater depth there."

      - name: layer_dual_variant_calculation_both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_qualification_provisional_auth_based_vs_final_clearing_based
          rationale: "The §1.8 dual-variant instance already computes the provisional auth-time result and the final clearing-time result for the same record and asserts the reconciliation delta applied to the ledger, which is the whole of this layer's claim set."

      - name: layer_rate_threshold_triggers_boundary_and_reset
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: boundary_performance_score_exactly_at_threshold_keeps_enrollment_enrolled
          rationale: "The cumulative performance threshold is exercised exactly at its boundary by the §1.8 boundary instance (equality keeps ENROLLED, one unit below moves to PROBATION), and the counter-reset half is covered by the §1.8 finalize cascade's downgrade-counter assertions."

  - section: consistency model
    instances:
      - name: consistency_immediate_the_finalize_response_already_carries_every_cascade_effect
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.batch_assessment_total
          - calculations.merchant_assessment_ledger_invariant
          - response_envelope.data
        distinguishing_aspect: "No read-after-write lag is tolerated anywhere: the finalize response body itself already shows total_assessed_cents 24 and record_count 1, and the very next reads of the record and the merchant show QUALIFIED and lifetime_net_assessed_cents 24 with no intervening call, retry or clock advance."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one COMPLIANT US/USD acquirer."
            - "MccDefinition 5411 with SMALL_TICKET eligibility; SMALL_TICKET (165 bps + 4 cents) and STANDARD programs."
            - "One grocery merchant with lifetime_net_assessed_cents 0; one SUBMITTED batch holding a single 1200-cent record carrying AUTH_CODE and TERMINAL_ID cleared one hour after authorization."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "SMALL_TICKET_STD", name: "Small Ticket", category: "SMALL_TICKET", eligible_mcc_codes: ["5411"], base_rate_bps: 165, per_item_fee_cents: 4, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID"], max_clearing_delay_hours: 48 }
              as: NetworkAdmin
              captures: { st_id: $.data.id }
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id, mer_ledger0: $.data.lifetime_net_assessed_cents }
            - call: "POST /settlement-batches"
              payload: { acquirer_id: "${acq_id}", batch_date: "2026-09-02", currency_code: "USD" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { batch_id: $.data.id, batch_v0: $.data.version }
            - call: "POST /settlement-batches/${batch_id}/transaction-records"
              payload: { merchant_id: "${mer_id}", amount_cents: 1200, transaction_currency: "USD", auth_code: "A00900", auth_timestamp: "2026-09-02T00:00:00Z", clearing_timestamp: "2026-09-02T01:00:00Z", data_elements: ["AUTH_CODE", "TERMINAL_ID"], expected_batch_version: "${batch_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { rec_id: $.data.id, rec_status0: $.data.qualification_status }
            - call: "POST /settlement-batches/${batch_id}/submit"
              payload: {}
              as: AcquirerOps
              as_user_id: "${acq_id}"
          trigger:
            - call: "POST /settlement-batches/${batch_id}/finalize"
              payload: {}
              as: NetworkAdmin
              captures: { fin_status: $.data.status, fin_total: $.data.total_assessed_cents, fin_count: $.data.record_count }
            - call: "GET /transaction-records/${rec_id}"
              payload: {}
              as: NetworkAdmin
              captures: { rec_status1: $.data.qualification_status, rec_program: $.data.qualified_rate_program_id, rec_assessed: $.data.assessed_interchange_cents }
            - call: "GET /merchants/${mer_id}"
              payload: {}
              as: NetworkAdmin
              captures: { mer_ledger1: $.data.lifetime_net_assessed_cents, mer_downgrades: $.data.downgrade_count_current_quarter }
          assert:
            - "${rec_status0} == PENDING"
            - "${mer_ledger0} == 0"
            - "finalize returns HTTP status 200"
            - "${fin_status} == FINALIZED"
            - "${fin_total} == 24"
            - "${fin_count} == 1"
            - "${rec_status1} == QUALIFIED"
            - "${rec_program} == ${st_id}"
            - "${rec_assessed} == 24"
            - "${mer_ledger1} == 24"
            - "${mer_downgrades} == 0"
