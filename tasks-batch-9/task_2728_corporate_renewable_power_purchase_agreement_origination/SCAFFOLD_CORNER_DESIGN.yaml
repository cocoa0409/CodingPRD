            - "the eight triggers return 404 with error_id ERR_DEAL_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_ROUND_NOT_FOUND, ERR_CREDIT_SUPPORT_NOT_FOUND, ERR_CONDITION_PRECEDENT_NOT_FOUND, ERR_SETTLEMENT_PERIOD_NOT_FOUND, ERR_ATTRIBUTE_BATCH_NOT_FOUND and ERR_RISK_EVENT_NOT_FOUND respectively"
            - "the credit-support post returns 404 rather than 412 even though its expected_deal_version ${deal_v1} is current, and rather than 403, so the path-id lookup at priority 4 precedes both the counterparty and stale-version guards"
            - "the allocation and round calls return 404 rather than 403 ERR_NOT_DEAL_COUNTERPARTY, even though ${buyer_id} could not be a counterparty of a non-existent row"
            - "Deal.${deal_id}.version is still ${deal_v1} after all eight calls and GET /ppa/deals returns total_count 1, so nothing was mutated"

      - name: guarantor_re_parenting_that_closes_a_cycle_is_refused_at_any_depth
        claim_type: violation_to_error
        grounds:
          - errors[ERR_GUARANTOR_CYCLE]
          - validations.priority_6_ERR_GUARANTOR_CYCLE
          - endpoints.POST_/ppa/offtakers/{id}/rating-change
          - entities.Offtaker.fields.parent_guarantor_offtaker_id
        distinguishing_aspect: |
          Creation can only ever attach a leaf, so the cycle case exists only on the
          re-parenting path, and the walk must climb the whole upward chain rather than
          checking the immediate parent: with B guaranteed by A and C guaranteed by B,
          pointing A at C closes a three-node cycle that a one-level check would miss.
          The self-edge is refused by the same rule, and an unknown guarantor id must
          still surface as a 404 at priority 5 rather than as a cycle at priority 6.
        test_recipe:
          setup:
            - "Three offtakers: A is QUALIFIED with no guarantor, B was created with A as its parent guarantor, and C was created with B as its parent guarantor, so the upward chain is C to B to A to null."
          setup_api_calls:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_a: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_a}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_a}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Cascadia Foods Co", credit_rating: "BBB", rating_agency: "SP", reported_ebitda_usd: 40000000.00, net_debt_to_ebitda: 3.0, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: false, scope2_target_year: 2030, parent_guarantor_offtaker_id: "${buyer_a}" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_b: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Puget Logistics LLC", credit_rating: "BB", rating_agency: "SP", reported_ebitda_usd: 15000000.00, net_debt_to_ebitda: 3.5, disclosure_framework: "TCFD_ONLY", has_science_based_target: false, re100_member: false, scope2_target_year: 2032, parent_guarantor_offtaker_id: "${buyer_b}" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_c: $.data.id }
            - call: "GET /ppa/offtakers/${buyer_a}"
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { a_version: $.data.version }
          trigger:
            - call: "POST /ppa/offtakers/${buyer_a}/rating-change"
              payload: { credit_rating: "A", parent_guarantor_offtaker_id: "${buyer_a}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers/${buyer_a}/rating-change"
              payload: { credit_rating: "A", parent_guarantor_offtaker_id: "${buyer_b}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers/${buyer_a}/rating-change"
              payload: { credit_rating: "A", parent_guarantor_offtaker_id: "${buyer_c}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers/${buyer_a}/rating-change"
              payload: { credit_rating: "A", parent_guarantor_offtaker_id: "00000000-0000-4000-8000-0000000000e1" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "GET /ppa/offtakers/${buyer_a}"
              as: CreditOfficer
              as_user_id: "u_credit_1"
          assert:
            - "the three creations all return 201: a create attaches a leaf and can never close a cycle, so B and C are accepted with guarantors A and B respectively"
            - "the first trigger returns 422 with error_id ERR_GUARANTOR_CYCLE - a self-edge is the degenerate cycle"
            - "the second trigger returns 422 ERR_GUARANTOR_CYCLE: A guaranteeing B while B guarantees A is a two-node loop"
            - "the third trigger returns 422 ERR_GUARANTOR_CYCLE, which requires the walk to climb C to B to A; a check limited to the immediate parent would wrongly accept it"
            - "the fourth trigger returns 404 ERR_OFFTAKER_NOT_FOUND, not ERR_GUARANTOR_CYCLE, because the unknown-id rule sits at priority 5 ahead of the cycle rule at priority 6"
            - "the closing read shows Offtaker.${buyer_a}.parent_guarantor_offtaker_id still null, credit_score still 83.70, credit_score_variant STANDALONE and version still ${a_version}: four refusals, no re-parenting, no re-scoring"

      - name: submit_credit_is_refused_once_the_anchor_tier_falls_to_declined
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CREDIT_TIER_DECLINED]
          - validations.priority_12_ERR_CREDIT_TIER_DECLINED
          - endpoints.POST_/ppa/deals/{id}/submit-credit
          - calculations.offtaker_credit_tier
        distinguishing_aspect: |
          A DECLINED tier is unreachable at qualification - QUALIFY demands PRIME or
          STANDARD and even CONDITIONAL demands a tier above DECLINED - so this refusal
          exists only after a downgrade on an already-qualified buyer. The deal is left
          in DRAFT deliberately: the downgrade cascade only re-sizes deals from
          TERMS_AGREED onward, so the DRAFT deal keeps its 3000000.00 threshold snapshot
          and a 0.00 requirement, and the refusal therefore comes from the buyer's tier
          rather than from any collateral arithmetic. Recovery is symmetric: restoring
          the rating restores QUALIFIED and the very same call then succeeds.
        test_recipe:
          setup:
            - "CHAIN A: one node, Northwind QUALIFIED at credit_score 83.70 (PRIME, unsecured limit 3000000.00), one 100.000 MW project and a DRAFT 25.000 MW deal whose credit_support_required_usd is 0.00."
            - "A rating change then restates the buyer as CCC with net_debt_to_ebitda 8.0, which is a two-band drop."
