  - section: rbac
    instances:
      - name: merchant_user_cross_merchant_access_hidden
        claim_type: peer_roles
        grounds:
          - roles.MerchantUser
          - validations[priority=3]
        distinguishing_aspect: "MerchantUser is entity-backed by Merchant: touching another merchant's chargeback — read OR evidence upload — is answered 404 ERR_NOT_FOUND (existence hidden), never 403."
        test_recipe:
          setup: ["two merchants M1 and M2; M2 has a notified chargeback"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "M1", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m1: $.data.id }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "M2", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m2: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m2}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m2}", transaction_external_ref: "T-1", network_case_id: "NC-XM1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb2: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb2}/notify", as: AcquirerOps, payload: {} }
          trigger:
            - call: "GET /acquirer/chargebacks/${cb2}"
              as: MerchantUser
              as_user_id: "${m1}"
              captures: { err_read: $.data.error_id }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m1}"
              payload: { chargeback_id: "${cb2}", evidence_type: RECEIPT, document_uri: "s3://ev/x.pdf" }
              captures: { err_write: $.data.error_id }
          assert:
            - "err_read == ERR_NOT_FOUND and err_write == ERR_NOT_FOUND (cross-merchant existence hidden)"

      - name: role_matrix_exclusive_denials_forbidden
        claim_type: peer_roles
        grounds:
          - roles.FinanceOps
          - roles.AcquirerOps
          - roles.MerchantUser
        distinguishing_aspect: "Exclusive operations reject other roles with 403 ERR_FORBIDDEN_ROLE: FinanceOps cannot release reserves, AcquirerOps cannot create manual fees, MerchantUser cannot review plans."
        test_recipe:
          setup: ["merchant with reserve account; ACTIVE enrollment with a SUBMITTED plan awaiting review"]
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "RBAC M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { ra_id: "$.data[0].id" }
            - call: "POST /acquirer/program-enrollments"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}", network: VISA, program_code: VDMP_STANDARD, enrolled_month: "2026-05" }
              captures: { enr_id: $.data.id }
            - call: "POST /acquirer/remediation-plans"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { enrollment_id: "${enr_id}", root_cause_codes: [FRAUD_GAP], corrective_actions: ["deploy 3DS"] }
              captures: { plan_id: $.data.id }
            - { call: "POST /acquirer/remediation-plans/${plan_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
          trigger:
            - call: "POST /acquirer/reserve-accounts/${ra_id}/release"
              as: FinanceOps
              payload: {}
              captures: { err1: $.data.error_id }
            - call: "POST /acquirer/fee-assessments"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", kind: ARBITRATION_FEE, amount_cents: 1000 }
              captures: { err2: $.data.error_id }
            - call: "POST /acquirer/remediation-plans/${plan_id}/review"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { decision: APPROVE }
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_FORBIDDEN_ROLE (release is RiskOfficer-exclusive)"
            - "err2 == ERR_FORBIDDEN_ROLE (manual fee assessment is FinanceOps-exclusive)"
            - "err3 == ERR_FORBIDDEN_ROLE (plan review is RiskOfficer-exclusive)"

      - name: segregation_of_duties_fee_waive
        claim_type: segregation_of_duties
        grounds:
          - state_machines.FeeAssessment.ASSESSED_to_WAIVED
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "The FinanceOps user who assessed a fee cannot waive it (403 ERR_SEGREGATION_OF_DUTIES); a different FinanceOps user can — the duty split is keyed on X-User-ID, with system-assessed fees exempt."
        test_recipe:
          setup: ["merchant; manual ARBITRATION_FEE 50000 assessed by fin-1; one system-assessed CHARGEBACK_FEE from an ingested case"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "SoD M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-SD1", reason_code: "10.4", amount_cents: 5000 }
              captures: { cb_id: $.data.id }
            - call: "POST /acquirer/fee-assessments"
              as: FinanceOps
              as_user_id: "fin-1"
              payload: { merchant_id: "${m_id}", kind: ARBITRATION_FEE, amount_cents: 50000 }
              captures: { manual_fee: $.data.id, manual_assessor: $.data.assessed_by_user_id }
            - call: "GET /acquirer/fee-assessments"
              as: FinanceOps
              payload: { chargeback_id: "${cb_id}" }
              captures: { sys_fee: "$.data[0].id", sys_assessor: "$.data[0].assessed_by_user_id" }
          trigger:
            - call: "POST /acquirer/fee-assessments/${manual_fee}/waive"
              as: FinanceOps
              as_user_id: "fin-1"
              payload: {}
              captures: { err: $.data.error_id }
            - call: "POST /acquirer/fee-assessments/${manual_fee}/waive"
              as: FinanceOps
              as_user_id: "fin-2"
              payload: {}
              captures: { waived_status: $.data.status, waived_by: $.data.waived_by_user_id }
            - call: "POST /acquirer/fee-assessments/${sys_fee}/waive"
              as: FinanceOps
              as_user_id: "fin-1"
              payload: {}
              captures: { sys_waived: $.data.status }
          assert:
            - "manual_assessor == fin-1 and err == ERR_SEGREGATION_OF_DUTIES (self-waiver blocked)"
            - "waived_status == WAIVED and waived_by == fin-2 (different FinanceOps user succeeds)"
            - "sys_assessor == system and sys_waived == WAIVED (system-assessed fees are SoD-exempt)"

      - name: fee_settle_debits_clearing
        claim_type: side_effect_execution
        grounds:
          - state_machines.FeeAssessment.ASSESSED_to_SETTLED
          - entities.Merchant.fields.clearing_balance_cents
        distinguishing_aspect: "Settling an ASSESSED fee collects it from clearing: 100000 clearing drops by exactly the 7500-cent fee and settled_at is stamped."
        test_recipe:
          setup: ["merchant with 100000 clearing (10 sales of 10000 at rate 0); manual ARBITRATION_FEE 7500"]
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Settle M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 10, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z", external_ref_prefix: "S" } }
            - call: "POST /acquirer/fee-assessments"
              as: FinanceOps
              as_user_id: "fin-1"
              payload: { merchant_id: "${m_id}", kind: ARBITRATION_FEE, amount_cents: 7500 }
              captures: { fee_id: $.data.id }
          trigger:
            - call: "POST /acquirer/fee-assessments/${fee_id}/settle"
              as: FinanceOps
              as_user_id: "fin-1"
              payload: {}
              captures: { fee_status: $.data.status }
            - call: "GET /acquirer/merchants/${m_id}"
              as: FinanceOps
              captures: { clearing: $.data.clearing_balance_cents }
          assert:
            - "fee_status == SETTLED with settled_at stamped"
            - "clearing == 92500 (100000 - 7500)"

  - section: cross_cutting
    instances:
      - name: repeat_sweep_skips_existing_snapshot
        claim_type: idempotency
        grounds:
          - entities.RatioSnapshot
        distinguishing_aspect: "A second advance-month over the same (merchant, network, period_month) is an idempotent skip: snapshots_created == 0, snapshots_skipped == 1, and exactly one snapshot row persists."
        test_recipe:
          setup: ["merchant with July activity; month already swept once"]
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Idem M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 10, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z", external_ref_prefix: "I" } }
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-07", merchant_id: "${m_id}" } }
          trigger:
            - call: "POST /acquirer/ops/advance-month"
              as: AcquirerOps
              payload: { period_month: "2026-07", merchant_id: "${m_id}" }
              captures: { created: $.data.snapshots_created, skipped: $.data.snapshots_skipped }
            - call: "GET /acquirer/merchants/${m_id}/ratio-snapshots"
              as: AcquirerOps
              captures: { snaps: $.data }
          assert:
            - "created == 0 and skipped == 1"
            - "len(snaps) == 1 (no duplicate snapshot posted)"

      - name: list_pagination_defaults_and_envelope
        claim_type: pagination_with_filtering
        grounds:
          - response_envelope
        distinguishing_aspect: "List responses carry the fixed envelope: limit default 10, explicit limit 2 over 3 rows yields has_more true and total_count 3, and offset 2 pages to the final row; meta.api_request_id is present on every response."
        test_recipe:
          setup: ["merchant with three chargebacks"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Page M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-2", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-3", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-PG1", reason_code: "10.4", amount_cents: 5000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "T-2", network_case_id: "NC-PG2", reason_code: "10.4", amount_cents: 5000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "T-3", network_case_id: "NC-PG3", reason_code: "10.4", amount_cents: 5000 } }
          trigger:
            - call: "GET /acquirer/chargebacks"
              as: FinanceOps
              payload: { merchant_id: "${m_id}", limit: 2 }
              captures: { page1: $.data }
            - call: "GET /acquirer/chargebacks"
              as: FinanceOps
              payload: { merchant_id: "${m_id}", limit: 2, offset: 2 }
              captures: { page2: $.data }
          assert:
            - "page1 has 2 rows and the envelope reports total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page2 has 1 row with has_more == false"
            - "both responses carry meta.api_request_id and meta.api_request_timestamp; response_type == 'array'"
            - "rows are ordered created_at ascending (NC-PG1 first)"

      - name: occ_stale_representment_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[representment-create-stale-chargeback]
        distinguishing_aspect: "Creating a second packet with the chargeback version observed before the first packet existed fails 412 ERR_STALE_VERSION — and because OCC sits at priority 4, it fires ahead of the ALSO-violated ERR_REPRESENTMENT_ALREADY_OPEN (priority 7)."
        test_recipe:
          setup: ["notified chargeback; caller captured version 2 after notify; a first packet has since been created (version advanced to 3)"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "OCC M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-OC1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/r1.pdf" }
              captures: { ev1: $.data.id }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/r2.pdf" }
              captures: { ev2: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v: $.data.version }
            - { call: "POST /acquirer/representments", as: MerchantUser, as_user_id: "${m_id}", payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev1}"], expected_chargeback_version: "${cb_v}" } }
          trigger:
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev2}"], expected_chargeback_version: "${cb_v}" }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION with HTTP 412 (stale expected_chargeback_version; OCC outranks the open-packet constraint)"

      - name: occ_stale_reserve_policy_patch_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reserve-policy-patch-stale-merchant]
        distinguishing_aspect: "A reserve-policy patch replayed with the pre-patch merchant version fails 412 ERR_STALE_VERSION; the first patch succeeds and advances Merchant.version by 1."
        test_recipe:
          setup: ["merchant created (version 1 observed from the create response)"]
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "OCCP M", merchant_category_code: "5411", reserve_rate_bps: 500 }
              captures: { m_id: $.data.id, m_v: $.data.version }
          trigger:
            - call: "PATCH /acquirer/merchants/${m_id}/reserve-policy"
              as: RiskOfficer
              payload: { reserve_rate_bps: 750, expected_merchant_version: "${m_v}" }
              captures: { rate_now: $.data.reserve_rate_bps, v_now: $.data.version }
            - call: "PATCH /acquirer/merchants/${m_id}/reserve-policy"
              as: RiskOfficer
              payload: { reserve_rate_bps: 900, expected_merchant_version: "${m_v}" }
              captures: { err: $.data.error_id }
          assert:
            - "first patch: rate_now == 750 and v_now == 2 (version incremented by the write)"
            - "err == ERR_STALE_VERSION with HTTP 412 on the replayed stale version"

      - name: sweep_skips_inactive_merchant
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.chargeback_ratio
        distinguishing_aspect: "The ops checkpoint posts no snapshot for a merchant-network with neither sales nor chargebacks in the month (snapshots_created == 0, empty snapshot list) — the sweep is activity-gated, not merchant-gated."
        test_recipe:
          setup: ["merchant with no July activity at all"]
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Idle M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /acquirer/ops/advance-month"
              as: AcquirerOps
              payload: { period_month: "2026-07", merchant_id: "${m_id}" }
              captures: { created: $.data.snapshots_created }
            - call: "GET /acquirer/merchants/${m_id}/ratio-snapshots"
              as: AcquirerOps
              captures: { snaps: $.data }
          assert:
            - "created == 0 and len(snaps) == 0 (no activity -> no snapshot row)"

      - name: release_success_matured_partial
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.releasable_reserve
          - calculations.reserve_target
          - entities.ReserveAccount.fields.held_cents
        distinguishing_aspect: "Voluntary release draws only the matured pool and only down to the live target: 10 matured + 20 unmatured settlement holds (held 30000, target 20000) release exactly 10000, landing held == target with clearing credited."
        test_recipe:
          setup: ["merchant rate 1000 bps FIXED_TIER; 10 sales of 10000 occurred 2026-04-15 (matured 2026-07-14); 20 sales of 10000 occurred 2026-07-25 (unmatured); default clock 2026-08-01; no enrollments"]
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Release M", merchant_category_code: "5411", reserve_rate_bps: 1000 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 10, amount_cents: 10000, occurred_at: "2026-04-15T00:00:00Z", external_ref_prefix: "OLD" } }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 20, amount_cents: 10000, occurred_at: "2026-07-25T00:00:00Z", external_ref_prefix: "NEW" } }
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { ra_id: "$.data[0].id", held_pre: "$.data[0].held_cents", target_pre: "$.data[0].target_cents" }
          trigger:
            - call: "POST /acquirer/reserve-accounts/${ra_id}/release"
              as: RiskOfficer
              payload: {}
              captures: { held_post: $.data.held_cents, target_post: $.data.target_cents }
            - call: "GET /acquirer/reserve-accounts/${ra_id}/ledger-entries"
              as: RiskOfficer
              captures: { rel_entry: "$.data[30].entry_type", rel_amt: "$.data[30].amount_cents", rel_kind: "$.data[30].source_kind" }
            - call: "GET /acquirer/merchants/${m_id}"
              as: RiskOfficer
              captures: { clearing: $.data.clearing_balance_cents }
          assert:
            - "held_pre == 30000 (30 holds of 1000) and target_pre == 20000 (trailing-90d window starts 2026-05-03, so only the 20 July sales count: 10% of 200000)"
            - "rel_entry == RELEASE and rel_amt == 10000 and rel_kind == SCHEDULED_RELEASE (min(matured pool 10000, held-target headroom 10000))"
            - "held_post == 20000 == target_post (release stops at the target)"
            - "clearing == 280000 (30 x (10000-1000) = 270000 net settlement credits, plus the 10000 release)"

  - section: consistency
    instances:
      - name: immediate_consistency_after_ingest
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: every cascade effect of chargeback ingest — clearing debit, fee assessment, HIGH_RISK receipt holdback, transaction flip — is readable in the very next request with no lag or reconciliation step."
        test_recipe:
          setup: ["HIGH_RISK merchant rate 0 with one 10000-cent sale"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "IC M", merchant_category_code: "5411", risk_tier: HIGH_RISK, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - call: "POST /acquirer/transactions"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" }
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-IC1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - call: "GET /acquirer/merchants/${m_id}"
              as: AcquirerOps
              captures: { clearing: $.data.clearing_balance_cents }
            - call: "GET /acquirer/fee-assessments"
              as: FinanceOps
              payload: { chargeback_id: "${cb_id}" }
              captures: { fee_amt: "$.data[0].amount_cents", fee_kind: "$.data[0].kind", fee_status: "$.data[0].status" }
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { held: "$.data[0].held_cents" }
            - call: "GET /acquirer/transactions/${t_id}"
              as: AcquirerOps
              captures: { t_status: $.data.status }
          assert:
            - "clearing == 0 (sale +10000 then receipt debit -10000, visible immediately)"
            - "fee_kind == CHARGEBACK_FEE and fee_amt == 2500 and fee_status == ASSESSED (fee pass-through already posted)"
            - "held == 10000 (HIGH_RISK receipt holdback already posted)"
            - "t_status == CHARGED_BACK"
