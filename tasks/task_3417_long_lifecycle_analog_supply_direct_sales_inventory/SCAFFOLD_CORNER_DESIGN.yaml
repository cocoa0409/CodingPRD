            - call: "POST /reference-designs/${s9_rd}/publish"
              payload: {}
              as: FieldEngineer
            - call: "POST /design-wins"
              payload: { reference_design_id: "${s9_rd}", customer_id: "${s9_cust}", part_id: "${s9_part}", expected_lifetime_revenue_cents: 1000000, annual_volume_units: 5200, start_date: "2027-01-01T00:00:00Z" }
              as: FieldEngineer
