  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: moon_gate_boundary_40_passes_41_fails
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_MOON_TOO_BRIGHT]"]
        distinguishing_aspect: "moon_illumination_pct == 40 schedules fine (<= limit inclusive); 41 fails ERR_MOON_TOO_BRIGHT."
        test_recipe:
          setup: ["two PUBLIC_NIGHT DRAFT events, moon 40 and 41"]
          setup_api_calls:
            - call: "POST /club/observing-events"
              payload: { title: "M40", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 40, min_operators: 1 }
              as: EventCoordinator
              captures: { e40: $.data.id }
            - call: "POST /club/observing-events"
              payload: { title: "M41", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-11T01:00:00Z", window_end: "2026-08-11T05:00:00Z", moon_illumination_pct: 41, min_operators: 1 }
              as: EventCoordinator
              captures: { e41: $.data.id }
          trigger:
            - call: "POST /club/observing-events/${e40}/schedule"
              payload: {}
              as: EventCoordinator
              captures: { s40: $.data.status }
            - call: "POST /club/observing-events/${e41}/schedule"
              payload: {}
              as: EventCoordinator
              captures: { err41: $.data.error_id }
          assert:
            - "s40 == SCHEDULED"
            - "err41 == ERR_MOON_TOO_BRIGHT"

      - name: invalid_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "window_start == window_end rejected (strict inequality); inverted window rejected."
        test_recipe:
          setup: ["member standing + cert; telescope AVAILABLE"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Window Will", email: "will@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "W Scope", equipment_class: "REFRACTOR" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "REFRACTOR", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
          trigger:
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_WINDOW"
            - "Telescope.${scope_id}.status == AVAILABLE (no reservation materialized)"

      - name: solar_session_night_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_NOT_DAYLIGHT_WINDOW]"]
        distinguishing_aspect: "SOLAR_SESSION scheduled at night (01:00–05:00) fails ERR_NOT_DAYLIGHT_WINDOW; same window on PUBLIC_NIGHT passes the daylight gate (not applicable)."
        test_recipe:
          setup: ["two DRAFT events: SOLAR_SESSION at night, PUBLIC_NIGHT at night"]
          setup_api_calls:
            - call: "POST /club/observing-events"
              payload: { title: "SolarNight", event_kind: "SOLAR_SESSION", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 10, min_operators: 1 }
              as: EventCoordinator
              captures: { es: $.data.id }
            - call: "POST /club/observing-events"
              payload: { title: "PubNight", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 10, min_operators: 1 }
              as: EventCoordinator
              captures: { ep: $.data.id }
          trigger:
            - call: "POST /club/observing-events/${es}/schedule"
              payload: {}
              as: EventCoordinator
              captures: { err_solar: $.data.error_id }
            - call: "POST /club/observing-events/${ep}/schedule"
              payload: {}
              as: EventCoordinator
              captures: { pub_status: $.data.status }
          assert:
            - "err_solar == ERR_NOT_DAYLIGHT_WINDOW"
            - "pub_status == SCHEDULED"

      - name: insufficient_payment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_PAYMENT_INSUFFICIENT]"]
        distinguishing_aspect: "Payment 119999 against a 120000 invoice fails ERR_PAYMENT_INSUFFICIENT; exact 120000 succeeds and flips invoice PAID."
        test_recipe:
          setup: ["member + tier 120000; OPEN invoice"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Short Pay", email: "short@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 119999 }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
              captures: { pay_ok: $.data.id }
            - call: "GET /club/dues-invoices/${inv_id}"
              payload: {}
              as: ClubOfficer
              captures: { inv_status: $.data.status }
          assert:
            - "err == ERR_PAYMENT_INSUFFICIENT"
            - "inv_status == PAID"

      - name: collimation_due_blocks_reservation
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_TELESCOPE_NOT_RESERVABLE]"]
        distinguishing_aspect: "A telescope whose collimation_due_at <= logical clock cannot be reserved even while AVAILABLE: telescope created 2026-08-01 has collimation_due_at 2027-01-28 (created_at + 180d); with the clock at 2027-02-01 the reservation fails ERR_TELESCOPE_NOT_RESERVABLE while status stays AVAILABLE."
        test_recipe:
          setup: ["member standing + cert (cert valid past 2027-02); dues paid through 2028 so clock advance does not suspend; telescope created at default clock 2026-08-01; clock advanced to 2027-02-01 (past collimation_due_at 2027-01-28)"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Colli Chris", email: "chris@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2028-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id, inv_amt: $.data.amount_cents }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: "${inv_amt}" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "Uncollimated", equipment_class: "REFLECTOR" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "REFLECTOR", expires_at: "2028-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ClubOfficer
          trigger:
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope_id}", window_start: "2027-02-05T00:00:00Z", window_end: "2027-02-07T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TELESCOPE_NOT_RESERVABLE (collimation_due_at 2027-01-28 <= clock 2027-02-01)"
            - "Telescope.${scope_id}.status == AVAILABLE (status unchanged; the gate is collimation, not status)"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: retire_telescope_with_open_tickets_closes_them
        claim_type: conditional_action
        grounds: ["state_machines.Telescope.MAINTENANCE_to_RETIRED"]
        distinguishing_aspect: "Retiring a telescope in MAINTENANCE closes all non-CLOSED tickets and applies their condition_delta exactly once."
        test_recipe:
          setup: ["telescope with one ticket pushed to VERIFICATION (condition_delta -30)"]
          setup_api_calls:
            - call: "POST /club/telescopes"
              payload: { name: "Writeoff", equipment_class: "SCT" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/maintenance-tickets"
              payload: { telescope_id: "${scope_id}", kind: "REPAIR", severity: "HIGH", condition_delta: -30 }
              as: EquipmentChair
              captures: { ticket_id: $.data.id }
            - call: "POST /club/maintenance-tickets/${ticket_id}/start"
              payload: {}
              as: EquipmentChair
            - call: "POST /club/maintenance-tickets/${ticket_id}/submit-verification"
              payload: {}
              as: EquipmentChair
          trigger:
            - call: "POST /club/telescopes/${scope_id}/retire"
              payload: {}
              as: EquipmentChair
              captures: { t_status: $.data.status, t_score: $.data.condition_score }
          assert:
            - "t_status == RETIRED"
            - "t_score == 70 (100 - 30 applied once)"
            - "MaintenanceTicket.${ticket_id}.status == CLOSED"

      - name: unschedule_returns_event_to_draft
        claim_type: action_endpoint
        grounds: ["state_machines.ObservingEvent.SCHEDULED_to_DRAFT"]
        distinguishing_aspect: "SCHEDULED -> DRAFT via unschedule; re-scheduling after fix works (cycle DRAFT<->SCHEDULED)."
        test_recipe:
          setup: ["PUBLIC_NIGHT SCHEDULED"]
          setup_api_calls:
            - call: "POST /club/observing-events"
              payload: { title: "Replan", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 20, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /club/observing-events/${event_id}/schedule"
              payload: {}
              as: EventCoordinator
          trigger:
            - call: "POST /club/observing-events/${event_id}/unschedule"
              payload: {}
              as: EventCoordinator
              captures: { s1: $.data.status }
            - call: "POST /club/observing-events/${event_id}/schedule"
              payload: {}
              as: EventCoordinator
              captures: { s2: $.data.status }
          assert:
            - "s1 == DRAFT"
            - "s2 == SCHEDULED (cycle traversed)"

