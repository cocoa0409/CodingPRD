            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t1_id}"
              captures: { c_ver1: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "ONLINE_SUBSCRIPTION", expected_client_version: "${c_ver1}", monthly_fee_cents: 6000, cycle_start_utc: "2026-06-01T00:00:00Z" }
              as: Trainer
              as_user_id: "${t1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /bookings"
              payload: { engagement_id: "${e1_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T11:00:00Z" }
              as: Client
              as_user_id: "${c_id}"
              captures: { b1_id: $.data.id }
            - call: "GET /clients/${c_id}"
              payload: {}
              as: Trainer
              as_user_id: "${t1_id}"
              captures: { c_ver2: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "ONLINE_SUBSCRIPTION", expected_client_version: "${c_ver2}", monthly_fee_cents: 6000, cycle_start_utc: "2026-06-01T00:00:00Z" }
              as: Trainer
              as_user_id: "${t2_id}"
              captures: { e2_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { engagement_id: "${e2_id}", start_utc: "2026-06-10T11:00:00Z", end_utc: "2026-06-10T12:00:00Z" }
              as: Client
