# =============================================================================
# §1.8 Scaffold Difficulty Design — Plumbing & PVF Wholesale
# 9 rules x 2-3 instances = 25 instances. Every instance replays from empty DB.
# Product fixture legend reused across instances:
#   P1: PIPE, list 10000, cost 5000, cubes 10, mfr "Acme"
#   P2: VALVE, list 4000,  cost 2000, cubes 5,  mfr "Acme"
#   GOLD=10% tier, SILVER=5%, STANDARD=0%. Freight: 2500 under 50000 post-discount.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: job_cost_provisional_vs_final
        grounds:
          - calculations.job_cost_report
          - entities.Order.fields.job_name
          - entities.OrderLine.fields.status
        distinguishing_aspect: |
          Same account+job rows, two variants on the ORDER domain: provisional counts
          OPEN/ALLOCATED/BACKORDERED/FILLED line commitments (108000) while final counts
          only FILLED lines net of credited returns (0 before any staging) — identical
          data, different totals. Distinct entity domain from credit_exposure's instance.
        test_recipe:
          setup:
            - "GOLD account (10% tier) with credit_limit 10000000"
            - "P1 stocked 10 units; P2 stocked 0 units"
            - "One COUNTER order job_name JOB-7: L1 = P1 x10 @9000 (ALLOCATED), L2 = P2 x5 @3600 (BACKORDERED, no stock)"
            - "Order submitted: total 108000 (subtotal 108000, freight 0 at >= 50000)"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P2", description: "Ball valve", category: "VALVE", list_price_cents: 4000, cost_cents: 2000, manufacturer_name: "Acme", cubes_per_unit: 5 }, as: BranchManager, captures: { p2: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 10 }, as: WarehouseLead }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p2}", initial_on_hand: 0 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "JOB-7", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 10 }, as: CounterRep, captures: { l1: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p2}", qty: 5 }, as: CounterRep, captures: { l2: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
          trigger:
            - call: "GET /pvf/contractor-accounts/${acct}/job-costing"
              payload: { job_name: "JOB-7" }
              as: InsideSales
              captures: { prov: $.data.provisional_cost_cents, fin: $.data.final_cost_cents }
          assert:
            - "provisional_cost_cents == 108000 (L1 10*9000 + L2 5*3600, both non-CANCELLED lines)"
            - "final_cost_cents == 0 (no line is FILLED yet)"
            - "order_count == 1 and line_count == 2"
            - "provisional_cost_cents != final_cost_cents for identical underlying rows"

      - name: credit_exposure_statement_vs_forward
        grounds:
          - calculations.credit_exposure
          - entities.ContractorAccount.fields.forward_exposure_cents
          - entities.ContractorAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Same ledger, two variants on the ACCOUNT domain: chronological statement balance
          (invoiced minus payments minus credits = 40500) vs forward-looking exposure
          (adds the submitted-but-uninvoiced order = 81000). Distinct entity domain from
          the job-costing instance.
        test_recipe:
          setup:
            - "SILVER account (5% tier), credit_limit 1000000"
            - "Order A (will_call): P1 x4 @9500 = 38000 + freight 2500 = 40500; picked up -> INVOICED, balance 40500"
            - "Order B (will_call): P2 x10 @3800 = 38000 + freight 2500 = 40500; submitted, still UNINVOICED"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P2", description: "Ball valve", category: "VALVE", list_price_cents: 4000, cost_cents: 2000, manufacturer_name: "Acme", cubes_per_unit: 5 }, as: BranchManager, captures: { p2: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "Silver Co", pricing_tier: "SILVER", terms: "NET_30", credit_limit_cents: 1000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 10 }, as: WarehouseLead }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p2}", initial_on_hand: 10 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "A", will_call: true }, as: CounterRep, captures: { ordA: $.data.id } }
            - { call: "POST /pvf/orders/${ordA}/lines", payload: { product_id: "${p1}", qty: 4 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ordA}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ordA}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ordA}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "B", will_call: true }, as: CounterRep, captures: { ordB: $.data.id } }
            - { call: "POST /pvf/orders/${ordB}/lines", payload: { product_id: "${p2}", qty: 10 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ordB}/submit", payload: {}, as: CounterRep }
          trigger:
            - call: "GET /pvf/contractor-accounts/${acct}/credit-exposure"
              payload: {}
              as: InsideSales
              captures: { bal: $.data.statement_balance_cents, expo: $.data.forward_exposure_cents, avail: $.data.available_credit_cents }
          assert:
            - "statement_balance_cents == 40500 (only order A is INVOICED)"
            - "forward_exposure_cents == 81000 (40500 invoiced + 40500 committed-uninvoiced)"
            - "available_credit_cents == 919000"
            - "status == ACTIVE"
            - "statement_balance_cents != forward_exposure_cents for identical account state"

  - rule_id: combinatorial_formula
    instances:
      - name: counter_price_tier_promo_override_floor
        grounds:
          - calculations.counter_price_resolution
          - entities.Product.fields.promo_price_cents
        distinguishing_aspect: |
          Mode (a) — a formula with >= 3 inputs and non-linear interaction: tier discount
          (10% GOLD), promo markdown (8500), and override floor (ceil(cost*1.05)=5250)
          combine via nested min plus a conditional branch on price_override_cents presence.
          Distinct mode from the rounding-order and evaluation-order instances.
        test_recipe:
          setup:
            - "GOLD account; product PPRO list 10000 cost 5000 promo 8500; product PT list 10000 cost 5000 no promo"
            - "COUNTER order in DRAFT"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PPRO", description: "Promo pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 1, promo_price_cents: 8500 }, as: BranchManager, captures: { ppro: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PT", description: "Plain tee", category: "FITTING", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 1 }, as: BranchManager, captures: { pt: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
          trigger:
            - call: "POST /pvf/orders/${ord}/lines"
              payload: { product_id: "${ppro}", qty: 1 }
              as: CounterRep
              captures: { l1_price: $.data.unit_price_cents, l1_src: $.data.price_source }
            - call: "POST /pvf/orders/${ord}/lines"
              payload: { product_id: "${pt}", qty: 1 }
              as: CounterRep
              captures: { l2_price: $.data.unit_price_cents, l2_src: $.data.price_source }
          assert:
            - "line1.unit_price_cents == 8500 (min(tier 9000, promo 8500) — promo wins)"
            - "line1.price_source == PROMO"
            - "line2.unit_price_cents == 9000 (tier only)"
            - "line2.price_source == COUNTER_TIER"

      - name: restocking_fee_per_line_rounding
        grounds:
          - calculations.restocking_fee
          - entities.ReturnRequest.fields.restocking_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: fee is round_half_up PER LINE then
          summed (3 x round(333*0.25)=3x83=249); summing values first then rounding would
          give round(999*0.25)=250. The scaffold pins per-line-then-sum; the 1-cent delta is
          the falsifiable probe. Distinct mode from instances 1 and 3.
        test_recipe:
          setup:
            - "GOLD account; product PR list 370 cost 100 -> GOLD price 333 per unit; stock 3"
            - "Will-call order with THREE separate lines qty 1 each (line_total 333 each); staged and picked up at 2026-08-01"
            - "Logical clock advanced 45 days (2026-09-15) -> 25% restock tier"
            - "Return DRAFT over the three lines qty 1 each, submitted by rep-1"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PR", description: "Returnable fitting", category: "FITTING", list_price_cents: 370, cost_cents: 100, manufacturer_name: "Acme", cubes_per_unit: 1 }, as: BranchManager, captures: { pr: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${pr}", initial_on_hand: 3 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${pr}", qty: 1 }, as: CounterRep, captures: { l1: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${pr}", qty: 1 }, as: CounterRep, captures: { l2: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${pr}", qty: 1 }, as: CounterRep, captures: { l3: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: BranchManager }
            - { call: "POST /pvf/returns", payload: { order_id: "${ord}", reason: "job surplus", lines: [ { order_line_id: "${l1}", qty: 1 }, { order_line_id: "${l2}", qty: 1 }, { order_line_id: "${l3}", qty: 1 } ] }, as: CounterRep, as_user_id: "rep-1", captures: { ret: $.data.id } }
            - { call: "POST /pvf/returns/${ret}/submit", payload: {}, as: CounterRep, as_user_id: "rep-1" }
          trigger:
            - call: "POST /pvf/returns/${ret}/decision"
              payload: { decision: "APPROVE" }
              as: BranchManager
              as_user_id: "mgr-9"
              captures: { fee: $.data.restocking_fee_cents, cred: $.data.credit_cents }
          assert:
            - "restocking_fee_cents == 249 (per-line: round_half_up(83.25)=83, x3)"
            - "credit_cents == 750 (999 - 249)"
            - "a sum-then-round implementation would produce fee 250 / credit 749 and MUST fail this assertion"

      - name: document_totals_pinned_evaluation_order
        grounds:
          - calculations.document_totals
          - entities.Quote.fields.volume_discount_pct
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order: the volume tier
          is keyed on the PRE-discount subtotal (504000 >= 500000 -> 2%) while freight keys
          on the POST-discount value (493920 >= 50000 -> 0). Keying the tier on the
          post-discount value would yield 0% and total 504000. Distinct mode from (a) and (b).
        test_recipe:
          setup:
            - "GOLD account; P1 exists"
            - "Quote with one line: P1 x56 at explicit unit_price 9000 (floor 5250 satisfied)"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
          trigger:
            - call: "POST /pvf/quotes"
              payload: { account_id: "${acct}", branch_id: "${b}", job_name: "JOB-T", valid_until: "2026-12-31T00:00:00Z", lines: [ { product_id: "${p1}", qty: 56, unit_price_cents: 9000 } ] }
              as: InsideSales
              captures: { q: $.data.id, sub: $.data.subtotal_cents, pct: $.data.volume_discount_pct, disc: $.data.discount_cents, fr: $.data.freight_cents, tot: $.data.total_cents }
          assert:
            - "subtotal_cents == 504000 (56 x 9000)"
            - "volume_discount_pct == 2 (PRE-discount subtotal 504000 >= 500000)"
            - "discount_cents == 10080"
            - "freight_cents == 0 (POST-discount 493920 >= 50000)"
            - "total_cents == 493920"
            - "an implementation re-tiering on the post-discount value yields total 504000 and MUST fail"

  - rule_id: non_linear_state_machine
    instances:
      - name: quote_award_revise_resubmit_cycle
        grounds:
          - state_machines.Quote.AWARDED_to_REVISED
          - state_machines.Quote.DRAFT_to_SUBMITTED
          - state_machines.Quote.SUBMITTED_to_AWARDED
          - concurrency_rules[quote-revision-stale-quote]
        distinguishing_aspect: |
          Cyclic loop on Quote: AWARDED -> (revision created) -> old quote terminal REVISED
          while the new revision walks DRAFT -> SUBMITTED -> AWARDED again — an
          award -> revise -> re-award cycle across the self-referential supersedes chain.
          Different entity and shape than the Order parallel-dimensions instance.
        test_recipe:
          setup:
            - "GOLD account; quote Q1 (line P1 x2 @9000) submitted and awarded by the contractor"
            - "Q1.version captured after award"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/quotes", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "JOB-C", valid_until: "2026-09-01T00:00:00Z", lines: [ { product_id: "${p1}", qty: 2, unit_price_cents: 9000 } ] }, as: InsideSales, captures: { q1: $.data.id } }
            - { call: "POST /pvf/quotes/${q1}/submit", payload: {}, as: InsideSales }
            - { call: "POST /pvf/quotes/${q1}/award", payload: {}, as: Contractor, as_user_id: "${acct}", captures: { q1v: $.data.version } }
          trigger:
            - call: "POST /pvf/quotes/${q1}/revisions"
              payload: { expected_quote_version: "${q1v}", valid_until: "2026-12-31T00:00:00Z" }
              as: InsideSales
              captures: { q2: $.data.id, q2rev: $.data.revision_no, q2sup: $.data.supersedes_quote_id }
            - { call: "POST /pvf/quotes/${q2}/submit", payload: {}, as: InsideSales }
            - { call: "POST /pvf/quotes/${q2}/award", payload: {}, as: Contractor, as_user_id: "${acct}", captures: { q2status: $.data.status } }
          assert:
            - "Q2.revision_no == 2 and Q2.supersedes_quote_id == Q1.id"
            - "Q2.status == AWARDED after the second cycle"
            - "GET /pvf/quotes/${q1} shows status REVISED (terminal, superseded)"
            - "converting Q1 (REVISED) is rejected with ERR_INVALID_STATE — verified in corner design"

      - name: order_payment_fulfillment_parallel_independence
        grounds:
          - state_machines.Order.UNINVOICED_to_INVOICED
          - state_machines.Order.INVOICED_to_PAID
          - state_machines.Order.OPEN_to_CANCELLED
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: payment_status (UNINVOICED -> INVOICED ->
          PAID) and fulfillment_status (DRAFT -> ... -> PICKED_UP / CANCELLED) evolve
          independently except the single defined auto-invoice coupling. A payment flips
          payment_status without touching fulfillment; a cancel moves fulfillment without
          touching payment. Different entity and shape class than the quote cycle.
        test_recipe:
          setup:
            - "GOLD account; P1 stock 20"
            - "Order A will_call P1 x4: submitted, staged, picked up (fulfillment PICKED_UP, payment INVOICED, total 38500)"
            - "Order B will_call P1 x2: submitted (OPEN/PICKING), still UNINVOICED"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 20 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ordA: $.data.id } }
            - { call: "POST /pvf/orders/${ordA}/lines", payload: { product_id: "${p1}", qty: 4 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ordA}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ordA}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ordA}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ordB: $.data.id } }
            - { call: "POST /pvf/orders/${ordB}/lines", payload: { product_id: "${p1}", qty: 2 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ordB}/submit", payload: {}, as: CounterRep }
          trigger:
            - call: "POST /pvf/contractor-accounts/${acct}/payments"
              payload: { amount_cents: 38500, method: "ACH", allocations: [ { order_id: "${ordA}", amount_cents: 38500 } ] }
              as: CounterRep
            - { call: "POST /pvf/orders/${ordB}/cancel", payload: {}, as: CounterRep }
          assert:
            - "GET /pvf/orders/${ordA}: payment_status == PAID while fulfillment_status == PICKED_UP (payment did not move fulfillment)"
            - "GET /pvf/orders/${ordB}: fulfillment_status == CANCELLED while payment_status == UNINVOICED (cancel did not move payment)"
            - "account.outstanding_balance_cents == 0"

      - name: account_credit_hold_hysteresis_cycle
        grounds:
          - state_machines.ContractorAccount.ACTIVE_to_CREDIT_HOLD
          - state_machines.ContractorAccount.CREDIT_HOLD_to_ACTIVE
          - calculations.credit_exposure
        distinguishing_aspect: |
          Cyclic AUTOMATIC transitions on ContractorAccount with hysteresis: hold engages
          when balance strictly exceeds the limit (here via a manager ADJUST_LIMIT
          tightening below the invoiced balance — the only way balance can exceed the
          limit, since submit gates exposure) and releases only at <= 80% of it — the
          80%-100% band keeps the account on hold, so the loop has memory. Different entity
          and trigger class (system threshold) than the quote revision cycle.
        test_recipe:
          setup:
            - "GOLD account, credit_limit 200000 (NET_30); P1 stock 20"
            - "Order will_call P1 x12 -> total 108000 (subtotal 108000 >= 50000, freight 0); picked up -> balance 108000 (still ACTIVE: 108000 <= 200000, nothing past due)"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 200000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 20 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 12 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep, captures: { afterInv: $.data.payment_status } }
          trigger:
            - call: "POST /pvf/contractor-accounts/${acct}/credit-review"
              payload: { action: "ADJUST_LIMIT", new_credit_limit_cents: 100000 }
              as: BranchManager
              captures: { st0: $.data.status }
            - call: "POST /pvf/contractor-accounts/${acct}/payments"
              payload: { amount_cents: 20000, method: "CHECK" }
              as: CounterRep
            - call: "GET /pvf/contractor-accounts/${acct}"
              payload: {}
              as: InsideSales
              captures: { st1: $.data.status, bal1: $.data.outstanding_balance_cents }
            - call: "POST /pvf/contractor-accounts/${acct}/payments"
              payload: { amount_cents: 8000, method: "CHECK" }
              as: CounterRep
            - call: "GET /pvf/contractor-accounts/${acct}"
              payload: {}
              as: InsideSales
              captures: { st2: $.data.status, bal2: $.data.outstanding_balance_cents }
          assert:
            - "after pickup: payment_status == INVOICED and account still ACTIVE (108000 <= 200000)"
            - "after ADJUST_LIMIT to 100000: status == CREDIT_HOLD (108000 > 100000, strict engage)"
            - "after payment 20000: balance == 88000 and status == CREDIT_HOLD (88000 > 80000 release threshold — no flapping)"
            - "after payment 8000: balance == 80000 == 80% of limit and status == ACTIVE (equality releases)"

  - rule_id: transitive_cascade
    instances:
      - name: receipt_stocks_backorder_line_then_waves_order
        grounds:
          - calculations.backorder_allocation
          - state_machines.OrderLine.BACKORDERED_to_ALLOCATED
          - state_machines.Order.OPEN_to_PICKING
          - state_machines.Kit.DRAFT_to_ASSEMBLED
        distinguishing_aspect: |
          Depth-3 chain from a STOCK RECEIPT trigger: receipt increments InventoryStock
          (link 1); the stock increase triggers backorder_allocation which mutates the
          waiting OrderLine BACKORDERED -> ALLOCATED (link 2); the line mutation bubbles the
          owning Order OPEN -> PICKING (link 3) and any kit over the line DRAFT ->
          ASSEMBLED. Each link is caused by the previous link, not by the receipt directly.
        test_recipe:
          setup:
            - "GOLD account; P1 stock 2"
            - "Order (will_call) line P1 x5 -> submit allocates 2, backorders 3; line BACKORDERED, order OPEN"
            - "Kit K over the line is DRAFT (line not allocated)"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 2 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 5 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/kits", payload: { floor_label: "F1", order_line_ids: [ "${ln}" ] }, as: InsideSales, captures: { kit: $.data.id } }
          trigger:
            - call: "POST /pvf/branches/${b}/stock-receipts"
              payload: { lines: [ { product_id: "${p1}", qty: 3, unit_cost_cents: 5000 } ] }
              as: WarehouseLead
          assert:
            - "OrderLine.${ln}: qty_allocated == 5, qty_backordered == 0, status == ALLOCATED"
            - "InventoryStock(${b},${p1}): on_hand == 5, reserved == 5, available == 0"
            - "Order.${ord}: fulfillment_status == PICKING (no direct order call fired it)"
            - "Kit.${kit}: status == ASSEMBLED (posture derived from member line)"

      - name: return_restock_fills_waiting_order_and_credits_account
        grounds:
          - state_machines.ReturnRequest.APPROVED_to_CREDITED
          - calculations.backorder_allocation
          - calculations.credit_exposure
          - state_machines.Order.OPEN_to_PICKING
        distinguishing_aspect: |
          Depth-3 chain from a RETURN RECEIVE trigger (different origin than the receipt
          cascade): receive restocks InventoryStock (link 1); restock triggers
          backorder_allocation flipping a DIFFERENT order's line BACKORDERED -> ALLOCATED
          (link 2); that line's mutation waves its order OPEN -> PICKING (link 3) — while a
          parallel hop credits the returning account's balance (38500 -> 6100).
        test_recipe:
          setup:
            - "Account R (GOLD): order R will_call P1 x4 picked up -> INVOICED 38500 (36000 + freight 2500); stock now 0"
            - "Account W (GOLD, limit 1000000): order W will_call P1 x3 submitted -> BACKORDERED 3 (available 0), order OPEN"
            - "Return of order R's full line qty 4 approved (rep-1 submits, mgr-9 approves; within 30 days -> 10% fee 3600, credit 32400)"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "R Co", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acctR: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "W Co", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 1000000 }, as: InsideSales, captures: { acctW: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 4 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acctR}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ordR: $.data.id } }
            - { call: "POST /pvf/orders/${ordR}/lines", payload: { product_id: "${p1}", qty: 4 }, as: CounterRep, captures: { lnR: $.data.id } }
            - { call: "POST /pvf/orders/${ordR}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ordR}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ordR}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders", payload: { account_id: "${acctW}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ordW: $.data.id } }
            - { call: "POST /pvf/orders/${ordW}/lines", payload: { product_id: "${p1}", qty: 3 }, as: CounterRep, captures: { lnW: $.data.id } }
            - { call: "POST /pvf/orders/${ordW}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/returns", payload: { order_id: "${ordR}", reason: "overbuy", lines: [ { order_line_id: "${lnR}", qty: 4 } ] }, as: CounterRep, as_user_id: "rep-1", captures: { ret: $.data.id } }
            - { call: "POST /pvf/returns/${ret}/submit", payload: {}, as: CounterRep, as_user_id: "rep-1" }
            - { call: "POST /pvf/returns/${ret}/decision", payload: { decision: "APPROVE" }, as: BranchManager, as_user_id: "mgr-9" }
          trigger:
            - call: "POST /pvf/returns/${ret}/receive"
              payload: {}
              as: WarehouseLead
              captures: { rstatus: $.data.status }
          assert:
            - "ReturnRequest.${ret}.status == CREDITED, credit_cents == 32400 (36000 - 3600 fee)"
            - "Account R outstanding_balance_cents == 6100 (38500 - 32400)"
            - "OrderLine.${lnW}: qty_allocated == 3, status == ALLOCATED (filled by restock, not by a direct call)"
            - "Order W fulfillment_status == PICKING (bubble-up)"
            - "InventoryStock: on_hand == 4, reserved == 3, available == 1"
            - "OrderLine.${lnR}.qty_returned == 4"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_double_submit
        grounds:
          - validations[priority=7]
          - validations[priority=26]
        distinguishing_aspect: |
          Pair (state, business_fiscal): the second submit violates BOTH the state
          precondition (order already OPEN, p7) and the credit check (current exposure
          96100 + this order's total 42100 = 138200 > limit 100000, p26). The state error
          MUST win because p7 < p26.
        test_recipe:
          setup:
            - "GOLD account limit 100000; P1 stock 30; P2 stock 30"
            - "Order 1: P1 x6 -> 54000; submitted + picked up (INVOICED; balance 54000)"
            - "Order 2: P2 x11 -> 39600 + freight 2500 = 42100; first submit succeeds (54000 + 42100 = 96100 <= 100000); order now OPEN"
            - "At the moment of the trigger, forward exposure is 96100; re-submitting order 2 would double-count its 42100 -> 138200 > 100000, so the fiscal check would ALSO fail if it ran"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P2", description: "Ball valve", category: "VALVE", list_price_cents: 4000, cost_cents: 2000, manufacturer_name: "Acme", cubes_per_unit: 5 }, as: BranchManager, captures: { p2: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 100000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 30 }, as: WarehouseLead }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p2}", initial_on_hand: 30 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { o1: $.data.id } }
            - { call: "POST /pvf/orders/${o1}/lines", payload: { product_id: "${p1}", qty: 6 }, as: CounterRep }
            - { call: "POST /pvf/orders/${o1}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${o1}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${o1}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { o2: $.data.id } }
            - { call: "POST /pvf/orders/${o2}/lines", payload: { product_id: "${p2}", qty: 11 }, as: CounterRep }
            - { call: "POST /pvf/orders/${o2}/submit", payload: {}, as: CounterRep }
          trigger:
            - call: "POST /pvf/orders/${o2}/submit"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (state, priority 7)"
            - "NOT ERR_CREDIT_LIMIT_EXCEEDED (fiscal, priority 26) even though exposure+total (96100+42100=138200) > 100000"

      - name: existence_beats_state_on_line_add
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair (existence, state): adding a line with a non-existent product_id to an order
          that is already OPEN violates body-FK existence (p6) AND the DRAFT-only state
          precondition (p7). Existence MUST win. Distinct pair from (state, fiscal).
        test_recipe:
          setup:
            - "GOLD account; P1 stock 5; order submitted (OPEN) with one P1 line"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
          trigger:
            - call: "POST /pvf/orders/${ord}/lines"
              payload: { product_id: "00000000-0000-0000-0000-000000000000", qty: 1 }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PRODUCT_NOT_FOUND with http 404 (existence, priority 6)"
            - "NOT ERR_INVALID_STATE (priority 7) even though the order is OPEN"

      - name: temporal_beats_capacity_on_slot_booking
        grounds:
          - validations[priority=11]
          - validations[priority=18]
        distinguishing_aspect: |
          Pair (business_temporal, business_constraint): the slot window ended in the past
          (temporal, p11) AND the order's cubes (2) exceed the slot's remaining capacity (1)
          (capacity, p18) — with the slot still OPEN so no state error masks the pair. The
          temporal error MUST win. Distinct pair from the other two instances.
        test_recipe:
          setup:
            - "Slot created with window 2026-07-20T08:00:00Z..2026-07-20T12:00:00Z (already past at the default clock 2026-08-01); creation does NOT sweep it to COMPLETED — slot stays OPEN until a clock advance"
            - "Slot capacity_cubes 1; order line product has cubes_per_unit 2 (cubes_total 2 > 1)"
            - "Order submitted (OPEN), version captured"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PBIG", description: "Big valve", category: "VALVE", list_price_cents: 4000, cost_cents: 2000, manufacturer_name: "Acme", cubes_per_unit: 2 }, as: BranchManager, captures: { pb: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/delivery-slots", payload: { truck_label: "T1", window_start: "2026-07-20T08:00:00Z", window_end: "2026-07-20T12:00:00Z", capacity_cubes: 1 }, as: BranchManager, captures: { slot: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${pb}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${pb}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep, captures: { ov: $.data.version } }
          trigger:
            - call: "POST /pvf/orders/${ord}/delivery-booking"
              payload: { slot_id: "${slot}", expected_order_version: "${ov}" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DELIVERY_WINDOW_PAST with http 422 (temporal, priority 11)"
            - "NOT ERR_SLOT_FULL (capacity, priority 18) even though 0 + 2 > 1"

  - rule_id: boundary_precision_check
    instances:
      - name: slot_capacity_equality_books_then_full
        grounds:
          - validations[priority=18]
          - calculations.delivery_cubes
          - state_machines.DeliverySlot.OPEN_to_FULL
        distinguishing_aspect: |
          Metric: truck cube capacity via the delivery-booking endpoint. Equality is
          inclusive: booked 60 + 40 == capacity 100 is ACCEPTED (rejects only when strictly
          greater) and flips the slot FULL; the next +1 cube is rejected ERR_SLOT_FULL.
          Different metric and endpoint than the rebate and credit boundaries.
        test_recipe:
          setup:
            - "Slot T1 2026-08-02T08:00-12:00 capacity 100; P1 cubes_per_unit 10, stock 30"
            - "Orders A (P1 x6 = 60 cubes), B (P1 x4 = 40), C (P1 x1 = 10) — all submitted and fully allocated; versions captured"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 100000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 30 }, as: WarehouseLead }
            - { call: "POST /pvf/branches/${b}/delivery-slots", payload: { truck_label: "T1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", capacity_cubes: 100 }, as: BranchManager, captures: { slot: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { oA: $.data.id } }
            - { call: "POST /pvf/orders/${oA}/lines", payload: { product_id: "${p1}", qty: 6 }, as: CounterRep }
            - { call: "POST /pvf/orders/${oA}/submit", payload: {}, as: CounterRep, captures: { vA: $.data.version } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { oB: $.data.id } }
            - { call: "POST /pvf/orders/${oB}/lines", payload: { product_id: "${p1}", qty: 4 }, as: CounterRep }
            - { call: "POST /pvf/orders/${oB}/submit", payload: {}, as: CounterRep, captures: { vB: $.data.version } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { oC: $.data.id } }
            - { call: "POST /pvf/orders/${oC}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders/${oC}/submit", payload: {}, as: CounterRep, captures: { vC: $.data.version } }
          trigger:
            - { call: "POST /pvf/orders/${oA}/delivery-booking", payload: { slot_id: "${slot}", expected_order_version: "${vA}" }, as: CounterRep }
            - { call: "POST /pvf/orders/${oB}/delivery-booking", payload: { slot_id: "${slot}", expected_order_version: "${vB}" }, as: CounterRep, captures: { slotAfterB: $.data.delivery_slot_id } }
            - { call: "GET /pvf/delivery-slots/${slot}", payload: {}, as: InsideSales, captures: { booked: $.data.booked_cubes, slotStatus: $.data.status } }
            - call: "POST /pvf/orders/${oC}/delivery-booking"
              payload: { slot_id: "${slot}", expected_order_version: "${vC}" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "order B booking SUCCEEDS at exact equality (60 + 40 == 100): delivery_slot_id == slot id"
            - "slot.booked_cubes == 100 and slot.status == FULL (auto-transition at equality)"
            - "order C booking rejected: error_id == ERR_SLOT_FULL with http 409"

      - name: rebate_threshold_equality_attains_tier
        grounds:
          - calculations.rebate_tier_attainment
          - entities.ManufacturerProgram.fields.purchases_cents
        distinguishing_aspect: |
          Metric: program purchases_cents vs tier threshold_cents via the program close
          endpoint. Attainment uses >=: purchases EXACTLY 500000 attain the 2% tier
          (earned 10000); 499999 would attain only 1%. Different metric and endpoint than
          the cube-capacity and credit boundaries.
        test_recipe:
          setup:
            - "Program for manufacturer Acme, period 2026-07-01T00:00:00Z..2026-08-31T23:59:59Z, tiers [{250000,1},{500000,2}]"
            - "Product PM mfr Acme cost 50000; receipt of 10 units at 2026-08-01 (in window) -> purchases exactly 500000"
            - "Clock advanced past period_end (2026-09-01) so close is allowed"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PM", description: "Acme manifold", category: "FITTING", list_price_cents: 90000, cost_cents: 50000, manufacturer_name: "Acme", cubes_per_unit: 4 }, as: BranchManager, captures: { pm: $.data.id } }
            - { call: "POST /pvf/manufacturer-programs", payload: { manufacturer_name: "Acme", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", tiers: [ { threshold_cents: 250000, rebate_pct: 1 }, { threshold_cents: 500000, rebate_pct: 2 } ], committed_stock_value_cents: 0 }, as: BranchManager, captures: { prog: $.data.id } }
            - { call: "POST /pvf/branches/${b}/stock-receipts", payload: { lines: [ { product_id: "${pm}", qty: 10, unit_cost_cents: 50000 } ] }, as: WarehouseLead }
            - { call: "POST /pvf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BranchManager }
          trigger:
            - call: "POST /pvf/manufacturer-programs/${prog}/close"
              payload: {}
              as: BranchManager
              captures: { pct: $.data.attained_rebate_pct, earned: $.data.earned_rebate_cents, purch: $.data.purchases_cents }
          assert:
            - "purchases_cents == 500000 (10 x 50000, in-window)"
            - "attained_rebate_pct == 2 (purchases EXACTLY EQUAL to the 500000 threshold qualify — >=)"
            - "earned_rebate_cents == 10000"
            - "status == CLOSED"

      - name: credit_limit_equality_submits
        grounds:
          - validations[priority=26]
          - calculations.credit_exposure
        distinguishing_aspect: |
          Metric: exposure cents vs credit limit via the order submit endpoint. The check
          rejects only when exposure + total STRICTLY exceeds the limit: total exactly
          50000 against limit 50000 (exposure 0) is accepted and drives available credit to
          exactly 0. Different metric and endpoint than the cube and rebate boundaries.
        test_recipe:
          setup:
            - "STANDARD account (0% tier), credit_limit 50000"
            - "Product PL list 4750 (no discount), stock 10; order line PL x10 -> subtotal 47500, freight 2500, total exactly 50000"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PL", description: "Copper elbow", category: "FITTING", list_price_cents: 4750, cost_cents: 2000, manufacturer_name: "Acme", cubes_per_unit: 1 }, as: BranchManager, captures: { pl: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "Std Co", pricing_tier: "STANDARD", terms: "COD", credit_limit_cents: 50000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${pl}", initial_on_hand: 10 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${pl}", qty: 10 }, as: CounterRep }
          trigger:
            - call: "POST /pvf/orders/${ord}/submit"
              payload: {}
              as: CounterRep
              captures: { fst: $.data.fulfillment_status, tot: $.data.total_cents }
            - call: "GET /pvf/contractor-accounts/${acct}/credit-exposure"
              payload: {}
              as: InsideSales
              captures: { avail: $.data.available_credit_cents }
          assert:
            - "submit SUCCEEDS at exact equality (0 + 50000 <= 50000)"
            - "order.total_cents == 50000 and fulfillment_status == OPEN"
            - "available_credit_cents == 0 afterwards"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_gated_by_account_hold
        grounds:
          - validations[priority=8]
          - state_machines.ContractorAccount.ACTIVE_to_CREDIT_HOLD
          - state_machines.Order.DRAFT_to_OPEN
        distinguishing_aspect: |
          Pair (Order -> ContractorAccount): the order's DRAFT -> OPEN transition is gated
          on the ACCOUNT's state — a CREDIT_HOLD account (here: past-due NET_15 invoice
          after a clock advance) cannot submit even though the order itself is perfectly
          valid and exposure is far under the limit. Distinct entity pair from the sheet
          and return-line instances.
        test_recipe:
          setup:
            - "GOLD account, NET_15 terms, limit 10000000; P1 stock 20"
            - "Order 1 will_call P1 x2 -> 18000 + 2500 freight = 20500; picked up at 2026-08-01 -> INVOICED, invoiced_at 2026-08-01"
            - "Clock advanced to 2026-08-20 (19 days > NET_15) -> account auto CREDIT_HOLD on the sweep"
            - "Order 2 (same account): P1 x1, DRAFT, total 11500"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_15", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 20 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { o1: $.data.id } }
            - { call: "POST /pvf/orders/${o1}/lines", payload: { product_id: "${p1}", qty: 2 }, as: CounterRep }
            - { call: "POST /pvf/orders/${o1}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${o1}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${o1}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: BranchManager }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { o2: $.data.id } }
            - { call: "POST /pvf/orders/${o2}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep }
          trigger:
            - call: "POST /pvf/orders/${o2}/submit"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "account is CREDIT_HOLD (past-due invoice: 2026-08-20 > invoiced_at 2026-08-01 + 15 days)"
            - "error_id == ERR_ACCOUNT_CREDIT_HOLD with http 409"
            - "order 2 stays fulfillment_status == DRAFT"
            - "the gate is the ACCOUNT's state, not anything on the order"

      - name: sheet_convert_gated_by_sheet_state
        grounds:
          - state_machines.SelectionSheet
          - validations[priority=7]
        distinguishing_aspect: |
          Pair (Order <- SelectionSheet): creating the SHOWROOM order is gated on the
          SHEET's state — a DRAFT sheet rejects convert; only after present + contractor
          approve does convert succeed. Distinct entity pair from order->account and
          return->line.
        test_recipe:
          setup:
            - "GOLD account; fixture PF (category FIXTURE, is_special_order true, list 70000, cost 40000)"
            - "Selection sheet with one selection (PF, finish 'chrome', qty 1) — left in DRAFT"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PF", description: "Freestanding tub", category: "FIXTURE", list_price_cents: 70000, cost_cents: 40000, manufacturer_name: "BathCo", cubes_per_unit: 30, is_special_order: true }, as: BranchManager, captures: { pf: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/selection-sheets", payload: { account_id: "${acct}", branch_id: "${b}", customer_name: "Homeowner H", selections: [ { product_id: "${pf}", finish: "chrome", qty: 1 } ] }, as: InsideSales, captures: { sheet: $.data.id } }
          trigger:
            - call: "POST /pvf/selection-sheets/${sheet}/convert"
              payload: {}
              as: InsideSales
              captures: { err: $.data.error_id }
            - { call: "POST /pvf/selection-sheets/${sheet}/present", payload: {}, as: InsideSales }
            - { call: "POST /pvf/selection-sheets/${sheet}/approve", payload: {}, as: Contractor, as_user_id: "${acct}" }
            - call: "POST /pvf/selection-sheets/${sheet}/convert"
              payload: {}
              as: InsideSales
              captures: { ord: $.data.id, src: $.data.source, tot: $.data.total_cents }
          assert:
            - "first convert on the DRAFT sheet: error_id == ERR_INVALID_STATE with http 409"
            - "after present+approve, convert succeeds: order.source == SHOWROOM"
            - "order line price_source == SHOWROOM_LIST at list 70000 (no GOLD tier discount); total 70000 + 0 freight (70000 >= 50000) == 70000"
            - "sheet.status == ORDERED"

      - name: return_qty_gated_by_line_fulfillment
        grounds:
          - validations[priority=22]
          - entities.OrderLine.fields.qty_fulfilled
        distinguishing_aspect: |
          Pair (ReturnRequest -> OrderLine): the return's validity depends on the ORDER
          LINE's fulfillment state — qty 6 against qty_fulfilled 5 is rejected
          ERR_RETURN_QTY_EXCEEDS_FULFILLED. Distinct entity pair from the other two.
        test_recipe:
          setup:
            - "GOLD account; P1 stock 5; will-call order P1 x5 -> picked up, line qty_fulfilled == 5"
            - "Return DRAFT referencing the line with qty 6"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 5 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/returns", payload: { order_id: "${ord}", reason: "too many", lines: [ { order_line_id: "${ln}", qty: 6 } ] }, as: CounterRep, as_user_id: "rep-1", captures: { ret: $.data.id } }
          trigger:
            - call: "POST /pvf/returns/${ret}/submit"
              payload: {}
              as: CounterRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RETURN_QTY_EXCEEDS_FULFILLED with http 422 (6 > qty_fulfilled 5 - qty_returned 0)"
            - "return stays status == DRAFT"

  - rule_id: resource_temporal_overlap
    instances:
      - name: truck_slot_half_open_adjacency
        grounds:
          - validations[priority=15]
          - entities.DeliverySlot.fields.window_start
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the truck resource: [08:00,12:00) and
          [12:00,16:00) on the same truck are adjacent but NOT overlapping (allowed);
          [11:00,13:00) intersects both (rejected). Different interval semantics than the
          bin buffer-gap rule and the program closed-interval rule.
        test_recipe:
          setup: ["Branch only; slots are created directly by BranchManager"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/branches/${b}/delivery-slots", payload: { truck_label: "T1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", capacity_cubes: 100 }, as: BranchManager, captures: { s1: $.data.id } }
          trigger:
            - call: "POST /pvf/branches/${b}/delivery-slots"
              payload: { truck_label: "T1", window_start: "2026-08-02T12:00:00Z", window_end: "2026-08-02T16:00:00Z", capacity_cubes: 100 }
              as: BranchManager
              captures: { s2: $.data.id }
            - call: "POST /pvf/branches/${b}/delivery-slots"
              payload: { truck_label: "T1", window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T13:00:00Z", capacity_cubes: 50 }
              as: BranchManager
              captures: { err: $.data.error_id }
            - call: "POST /pvf/branches/${b}/delivery-slots"
              payload: { truck_label: "T2", window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T13:00:00Z", capacity_cubes: 50 }
              as: BranchManager
              captures: { s4: $.data.id }
          assert:
            - "adjacent slot (start == existing end) on T1 is CREATED (201) — touching half-open intervals do not overlap"
            - "intersecting slot on T1: error_id == ERR_SLOT_OVERLAP with http 409"
            - "identical window on a DIFFERENT truck T2 is CREATED (201) — overlap is per (branch, truck)"

      - name: staging_bin_turnaround_buffer
        grounds:
          - validations[priority=16]
          - state_machines.Kit.ASSEMBLED_to_STAGED
        distinguishing_aspect: |
          BUFFER-GAP interval semantics on the staging-bin resource: a staged kit occupies
          its bin through window_end + 2h turnaround; a successor window starting 1h after
          the first ends is rejected, while starting exactly at end+2h is allowed
          (gap >= 2h, equality allowed). Different semantics than truck half-open adjacency
          (gap 0 allowed) and program closed intervals (touching conflicts).
        test_recipe:
          setup:
            - "GOLD account; P1 stock 10; will-call order with two lines P1 x1 each; submitted -> both ALLOCATED"
            - "Kit K1 over line 1 and kit K2 over line 2; both auto-ASSEMBLED (member lines allocated)"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 10 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { l1: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { l2: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/kits", payload: { floor_label: "F1", order_line_ids: [ "${l1}" ] }, as: InsideSales, captures: { k1: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/kits", payload: { floor_label: "F2", order_line_ids: [ "${l2}" ] }, as: InsideSales, captures: { k2: $.data.id } }
            - { call: "POST /pvf/kits/${k1}/stage", payload: { staging_bin: "B7", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: WarehouseLead }
          trigger:
            - call: "POST /pvf/kits/${k2}/stage"
              payload: { staging_bin: "B7", window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T12:00:00Z" }
              as: WarehouseLead
              captures: { err: $.data.error_id }
            - call: "POST /pvf/kits/${k2}/stage"
              payload: { staging_bin: "B7", window_start: "2026-08-02T12:00:00Z", window_end: "2026-08-02T13:00:00Z" }
              as: WarehouseLead
              captures: { k2status: $.data.status }
          assert:
            - "K2 at 11:00 rejected: error_id == ERR_BIN_OVERLAP with http 409 (K1 occupies B7 through 10:00 + 2h buffer = 12:00)"
            - "K2 at exactly 12:00 SUCCEEDS (gap == WILL_CALL_BUFFER_HOURS exactly is allowed)"
            - "K2.status == STAGED after the second call"

      - name: program_closed_interval_touch
        grounds:
          - validations[priority=17]
          - entities.ManufacturerProgram.fields.period_start
        distinguishing_aspect: |
          CLOSED-interval semantics on the manufacturer program calendar: periods include
          both endpoints, so a second program starting EXACTLY on the first program's
          period_end conflicts (touching counts), unlike half-open truck slots where
          touching is allowed. Different semantics and resource than the other two.
        test_recipe:
          setup: ["Program P1 for Acme: 2026-01-01T00:00:00Z .. 2026-03-31T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /pvf/manufacturer-programs", payload: { manufacturer_name: "Acme", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", tiers: [ { threshold_cents: 100000, rebate_pct: 1 } ], committed_stock_value_cents: 0 }, as: BranchManager, captures: { p1: $.data.id } }
          trigger:
            - call: "POST /pvf/manufacturer-programs"
              payload: { manufacturer_name: "Acme", period_start: "2026-03-31T00:00:00Z", period_end: "2026-06-30T00:00:00Z", tiers: [ { threshold_cents: 100000, rebate_pct: 1 } ], committed_stock_value_cents: 0 }
              as: BranchManager
              captures: { err: $.data.error_id }
            - call: "POST /pvf/manufacturer-programs"
              payload: { manufacturer_name: "BrassCo", period_start: "2026-03-31T00:00:00Z", period_end: "2026-06-30T00:00:00Z", tiers: [ { threshold_cents: 100000, rebate_pct: 1 } ], committed_stock_value_cents: 0 }
              as: BranchManager
              captures: { p3: $.data.id }
            - call: "POST /pvf/manufacturer-programs"
              payload: { manufacturer_name: "Acme", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", tiers: [ { threshold_cents: 100000, rebate_pct: 1 } ], committed_stock_value_cents: 0 }
              as: BranchManager
              captures: { p4: $.data.id }
          assert:
            - "touching program (start == existing period_end) for the same manufacturer: error_id == ERR_PROGRAM_OVERLAP with http 409"
            - "same dates for a DIFFERENT manufacturer (BrassCo) are CREATED (201)"
            - "Acme program starting 2026-04-01 (strictly after period_end) is CREATED (201)"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_cancel_conserves_inventory
        grounds:
          - entities.InventoryStock.fields.available
          - state_machines.Order.OPEN_to_CANCELLED
          - state_machines.OrderLine.ALLOCATED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL UNITS. Invariant pinned: available == on_hand -
          reserved at every observable point; a submit (reserve) paired with its
          compensating cancel (release) leaves (on_hand, reserved, available) identical to
          the pre-submit triple (20, 0, 20) — zero drift.
        test_recipe:
          setup:
            - "P1 stock record: on_hand 20, reserved 0, available 20"
            - "GOLD account; order with P1 x7 submitted -> reserved 7, available 13"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 20 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 7 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "GET /pvf/branches/${b}/inventory", payload: { product_id: "${p1}" }, as: WarehouseLead, captures: { mid_on: "$.data[0].on_hand", mid_res: "$.data[0].reserved", mid_avail: "$.data[0].available" } }
          trigger:
            - { call: "POST /pvf/orders/${ord}/cancel", payload: {}, as: CounterRep }
            - { call: "GET /pvf/branches/${b}/inventory", payload: { product_id: "${p1}" }, as: WarehouseLead, captures: { end_on: "$.data[0].on_hand", end_res: "$.data[0].reserved", end_avail: "$.data[0].available" } }
          assert:
            - "mid-state: on_hand == 20, reserved == 7, available == 13 (20 - 7)"
            - "post-cancel: on_hand == 20, reserved == 0, available == 20 — identical to the pre-submit triple"
            - "invariant available == on_hand - reserved holds at all three observations"

      - name: invoice_payment_conserves_balance
        grounds:
          - calculations.credit_exposure
          - calculations.payment_auto_allocation
          - state_machines.Order.INVOICED_to_PAID
        distinguishing_aspect: |
          Conserved quantity: LEDGER CENTS. Invariant pinned: outstanding_balance ==
          sum(totals of INVOICED/PAID orders) - sum(payments) - sum(return credits). The
          invoice-at-pickup (+38500) paired with its compensating payment (-38500) returns
          the balance to exactly 0 and flips the order PAID — no drift.
        test_recipe:
          setup:
            - "GOLD account; P1 stock 10; will-call order P1 x4 -> total 38500 (36000 subtotal + 2500 freight)"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 10 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 4 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep, captures: { pay_st: $.data.payment_status } }
          trigger:
            - { call: "POST /pvf/contractor-accounts/${acct}/payments", payload: { amount_cents: 38500, method: "ACH" }, as: CounterRep }
            - { call: "GET /pvf/contractor-accounts/${acct}", payload: {}, as: InsideSales, captures: { bal: $.data.outstanding_balance_cents } }
            - { call: "GET /pvf/orders/${ord}", payload: {}, as: InsideSales, captures: { ost: $.data.payment_status } }
          assert:
            - "after pickup: payment_status == INVOICED and balance would be 38500"
            - "after payment 38500: outstanding_balance_cents == 0 (38500 invoiced - 38500 paid)"
            - "order payment_status == PAID (auto-allocation covered the full total)"
            - "invariant holds: 38500 (INVOICED/PAID totals) - 38500 (payments) - 0 (credits) == 0"

      - name: book_cancel_conserves_slot_capacity
        grounds:
          - calculations.delivery_cubes
          - state_machines.DeliverySlot.FULL_to_OPEN
          - state_machines.DeliverySlot.OPEN_to_FULL
        distinguishing_aspect: |
          Conserved quantity: SLOT CUBE CAPACITY. Invariant pinned: slot.booked_cubes ==
          sum of cubes_total over orders with an ACTIVE booking on the slot. A booking
          paired with its compensating cancel returns booked_cubes to the pre-booking value
          and auto-reverts FULL -> OPEN — no drift. Different conserved quantity than units
          and ledger cents.
        test_recipe:
          setup:
            - "Slot T1 2026-08-02 08:00-12:00 capacity 100; P1 cubes 10, stock 30"
            - "Orders A (x6 = 60 cubes) and B (x4 = 40 cubes) submitted; versions captured"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 100000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 30 }, as: WarehouseLead }
            - { call: "POST /pvf/branches/${b}/delivery-slots", payload: { truck_label: "T1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", capacity_cubes: 100 }, as: BranchManager, captures: { slot: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { oA: $.data.id } }
            - { call: "POST /pvf/orders/${oA}/lines", payload: { product_id: "${p1}", qty: 6 }, as: CounterRep }
            - { call: "POST /pvf/orders/${oA}/submit", payload: {}, as: CounterRep, captures: { vA: $.data.version } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { oB: $.data.id } }
            - { call: "POST /pvf/orders/${oB}/lines", payload: { product_id: "${p1}", qty: 4 }, as: CounterRep }
            - { call: "POST /pvf/orders/${oB}/submit", payload: {}, as: CounterRep, captures: { vB: $.data.version } }
          trigger:
            - { call: "POST /pvf/orders/${oA}/delivery-booking", payload: { slot_id: "${slot}", expected_order_version: "${vA}" }, as: CounterRep }
            - { call: "POST /pvf/orders/${oB}/delivery-booking", payload: { slot_id: "${slot}", expected_order_version: "${vB}" }, as: CounterRep }
            - { call: "GET /pvf/delivery-slots/${slot}", payload: {}, as: InsideSales, captures: { booked_full: $.data.booked_cubes, st_full: $.data.status } }
            - { call: "POST /pvf/orders/${oA}/delivery-booking/cancel", payload: {}, as: CounterRep, captures: { a_slot: $.data.delivery_slot_id } }
            - { call: "GET /pvf/delivery-slots/${slot}", payload: {}, as: InsideSales, captures: { booked_after: $.data.booked_cubes, st_after: $.data.status } }
          assert:
            - "at full: booked_cubes == 100 == 60 + 40 and status == FULL"
            - "after A cancels: booked_cubes == 40 == order B's cubes_total (A's contribution fully released)"
            - "slot auto-reverts FULL -> OPEN; order A delivery_slot_id == null"
            - "re-booking A would now succeed again (capacity conserved, no leak)"
