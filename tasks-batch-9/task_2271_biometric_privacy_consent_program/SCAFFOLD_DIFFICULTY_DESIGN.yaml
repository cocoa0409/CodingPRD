            - "At the gate: after the attestation call Vendor.${v2_id}.risk_score == 70 and VendorContract.${k2_id}.compliance_score == 82.50"
            - "VendorContract.${k2_id}.status == EXECUTED (82.50 is exactly CONTRACT_SCORE_FLOOR and passes)"
            - "The fourth trigger call returns 200 and BiometricAsset.${asset_id}.status == ACTIVE with pinned_policy_id == ${pol1_id}"
            - "BiometricAsset.${asset_id}.collection_started_at == 2026-08-01T00:00:00.000Z and destruction_due_at == 2026-08-31T00:00:00.000Z"

      - name: inventory_completeness_empty_scope_100_and_two_decimal_rounding_at_33_33_and_66_67
        grounds:
          - calculations.inventory_completeness_pct
          - entities.ComplianceProgram.fields.inventory_completeness_pct
          - endpoints["GET /programs/{program_id}"]
        distinguishing_aspect: |
          Metric: a 2-decimal percentage read through GET /programs/{program_id} — a different metric
          and a different endpoint from the integer risk-point gate. It pins the empty-scope
          convention (zero assets returns exactly 100.00, never a division-by-zero or 0.00) and the
          round_half_up-to-2dp behaviour at the repeating values 1/3 -> 33.33 and 2/3 -> 66.67.
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL and no BiometricAsset rows at all."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              as: SystemOperator
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { a1_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "ACCESS_CONTROL", modality: "HAND_GEOMETRY", subject_class: "EMPLOYEE", template_storage_location: "door-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { a2_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "SECURITY_CAMERA", modality: "FACE_GEOMETRY", subject_class: "EMPLOYEE", template_storage_location: "cam-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { a3_id: $.data.id }
            - call: "POST /biometric-assets/${a1_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: SystemOperator
            - call: "POST /biometric-assets/${a2_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: SystemOperator
            - call: "POST /biometric-assets/${a3_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: SystemOperator
          assert:
            - "Empty scope: the first GET returns inventory_completeness_pct == 100.00 (not 0.00 and not an error)"
            - "After the three DISCOVERED assets exist, inventory_completeness_pct == 0.00 (three in scope, none documented)"
            - "One of three documented: the GET after classifying ${a1_id} returns inventory_completeness_pct == 33.33 (round_half_up of 33.3333 to 2dp, not 33.34 and not 33.3)"
            - "Two of three documented: the GET after classifying ${a2_id} returns inventory_completeness_pct == 66.67 (round_half_up of 66.6666 to 2dp, not 66.66)"
            - "Three of three documented: the final GET returns inventory_completeness_pct == 100.00"

      - name: pra_exposure_half_cent_rounds_up_to_14585_not_14584
        grounds:
          - calculations.pra_exposure_estimate
          - entities.ExposureAssessment.fields.exposure_cents
          - endpoints["POST /exposure-assessments"]
        distinguishing_aspect: |
          Metric: integer cents produced by a single round_half_up of a fully multiplied product,
          exercised on POST /exposure-assessments — a third distinct metric and endpoint. Oregon's
          per-violation figure 33336 is chosen so the product lands exactly on a half cent
          (33336 x 0.50 x 1.25 x 0.70 = 14584.5), separating round_half_up (14585) from
          banker's rounding or truncation (14584).
        test_recipe:
          setup:
            - "One ComplianceProgram plus Jurisdiction OR: private_right_of_action LIMITED (factor 0.50), STATUTORY_PER_VIOLATION, per_violation_negligent_cents 33336, per_violation_reckless_cents 99999, cure_period_days 30 (so the 0.30 cure credit applies), notice_lead_days 0, retention_max_days 730, translation_required false, statutory_cap_cents omitted (null, so no cap clips the result)."
            - "A PUBLISHED policy scoped to OR and a PUBLISHED (OR, EMPLOYEE) notice published at the default clock 2026-08-01T00:00:00.000Z with notice_lead_days 0, so consent may be solicited immediately."
            - "One ACTIVE in-house BiometricAsset in OR and one EMPLOYEE DataSubject holding exactly one SOLICITED ConsentRecord, giving one negligent unit, zero reckless units and consent_gap_count 1 (which arms the 1.25 notice-gap multiplier)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "OR", statute_name: "ORS 646A.622", private_right_of_action: "LIMITED", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: false, translation_required: false, required_locales: ["en"], retention_max_days: 730, notice_lead_days: 0, per_violation_negligent_cents: 33336, per_violation_reckless_cents: 99999, cure_period_days: 30 }
              as: SystemOperator
              captures: { or_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${or_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${or_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${or_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-or-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /data-subjects"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${or_id}", subject_type: "EMPLOYEE", external_ref: "EMP-OR-0001", preferred_locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { s1_id: $.data.id }
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s1_id}", asset_id: "${asset_id}", locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { c1_id: $.data.id }
            - call: "GET /jurisdictions/${or_id}"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { or_v1: $.data.version }
          trigger:
            - call: "POST /exposure-assessments"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${or_id}", variant: "PER_VIOLATION_STACKED", expected_jurisdiction_version: "${or_v1}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { ea_id: $.data.id }
          assert:
            - "ExposureAssessment.${ea_id}.negligent_unit_count == 1 and ExposureAssessment.${ea_id}.reckless_unit_count == 0"
            - "ExposureAssessment.${ea_id}.base_cents == 33336"
            - "ExposureAssessment.${ea_id}.notice_gap_multiplier == 1.25 and ExposureAssessment.${ea_id}.cure_credit_pct == 0.30"
            - "ExposureAssessment.${ea_id}.exposure_cents == 14585"
            - "ExposureAssessment.${ea_id}.exposure_cents != 14584 (banker's rounding and truncation are both wrong here)"
            - "ExposureAssessment.${ea_id}.status == DRAFT and ComplianceProgram.${prog_id}.pra_exposure_cents == 0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: asset_activation_requires_notice_packet_in_published_state
        grounds:
          - state_machines.BiometricAsset.CLASSIFIED_to_ACTIVE
          - entities.NoticePacket.fields.status
          - errors[ERR_NOTICE_NOT_PUBLISHED]
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair BiometricAsset -> NoticePacket: the asset's own status, jurisdiction and vendor
          posture are all admissible, yet the transition is refused solely because a *different*
          entity — the NoticePacket covering (jurisdiction_id, subject_class) — is in DRAFT rather
          than PUBLISHED. Publishing that other row, with no change whatsoever to the asset, makes
          the identical call succeed.
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL and a PUBLISHED policy v1.0 scoped to IL."
            - "One NoticePacket for (IL, EMPLOYEE) with locales en and es left in DRAFT status."
            - "One in-house BiometricAsset (TIMEKEEPING/FINGERPRINT/EMPLOYEE) sitting in CLASSIFIED; the program posture is OPEN and no vendor gate applies."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
          trigger:
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
