        grounds:
          - validations[priority=50]
          - errors[ERR_SERVICE_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "In this flat topology every child carries its parent as a body FK, so an unresolvable service_id in the BODY is a 404 from the priority-50 pass exactly as an unresolvable path id is at priority 40 — and the created row's service_id is always the one supplied, never inferred."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one real service exists."
          setup_api_calls:
