# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: enumerative coverage of testable claims in §1.1–§1.7 not
# already covered by §1.8. Same seven-point per-instance contract.
# excluded_because: stubs cite a §1.8 instance by name.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_patient_minimal_required_fields_201
        claim_type: Creation
        grounds:
          - entities.Patient.fields.full_name
          - endpoints
        distinguishing_aspect: "POST /patients with full_name + date_of_birth returns 201, server mints id/version=1, intake_status=PENDING_INTAKE, membership_status=NONE, strike_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Jane Doe", date_of_birth: "1990-05-05" }
              as: ClinicAdmin
              captures: { pid: $.data.id, ver: $.data.version }
          assert:
            - "HTTP 201; data.id is a UUID; data.version == 1"
            - "data.intake_status == PENDING_INTAKE; data.membership_status == NONE; data.strike_count == 0; data.payer_mode == CASH"

      - name: get_patient_returns_stored_record
        claim_type: Retrieval
        grounds:
          - entities.Patient.fields.full_name
        distinguishing_aspect: "GET /patients/{id} returns the same full_name and date_of_birth that were stored."
        test_recipe:
          setup: ["One patient created."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Read Back", date_of_birth: "1991-02-03" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /patients/${pid}"
              payload: {}
              as: ClinicAdmin
              captures: { name: $.data.full_name }
          assert:
            - "data.full_name == 'Read Back'; data.date_of_birth == '1991-02-03'"

      - name: list_patients_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
        distinguishing_aspect: "GET /patients returns response_type array with pagination meta total_count and has_more."
        test_recipe:
          setup: ["Two patients created."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P1", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "P2", date_of_birth: "1990-01-02" }
              as: ClinicAdmin
          trigger:
            - call: "GET /patients"
              payload: { limit: 1, offset: 0 }
              as: ClinicAdmin
          assert:
            - "response_type == array; total_count == 2; has_more == true; len(data) == 1"

      - name: get_patient_not_found_404
        claim_type: Not Found
        grounds:
          - errors[ERR_PATIENT_NOT_FOUND]
        distinguishing_aspect: "GET /patients/{bogus-uuid} returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_PATIENT_NOT_FOUND"

      - name: create_patient_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Patient.fields.full_name
        distinguishing_aspect: "POST /patients missing full_name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"

      - name: patient_payer_mode_default_cash
        claim_type: Defaults
        grounds:
          - entities.Patient.fields.payer_mode
        distinguishing_aspect: "Omitting payer_mode applies default CASH; coinsurance_rate defaults to 0.0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Def Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pm: $.data.payer_mode }
          assert:
            - "data.payer_mode == CASH; data.coinsurance_rate == 0.0"

      - name: package_computed_fields_initialized
        claim_type: Computed Fields
        grounds:
          - entities.PackageSeries.fields.provisional_remaining_credits
          - entities.PackageSeries.fields.finalized_remaining_credits
        distinguishing_aspect: "On purchase, reserved=0, consumed=0, provisional_remaining_credits=total, finalized_remaining_credits=total — computed, not client-supplied."
        test_recipe:
          setup: ["Patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pkg Init", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /package-series"
              payload: { patient_id: "${pid}", total_credits: 8, price_paid_cents: 72000 }
              as: ClinicAdmin
              captures: { prov: $.data.provisional_remaining_credits }
          assert:
            - "data.reserved_credits == 0; data.consumed_credits == 0"
            - "data.provisional_remaining_credits == 8; data.finalized_remaining_credits == 8; data.status == ACTIVE"

      - name: patient_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Patient.fields.full_name
        distinguishing_aspect: "Client-supplied id/version/strike_count in POST /patients body are ignored; server mints id, version=1, strike_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Sys Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { ver: $.data.version, sc: $.data.strike_count }
          assert:
            - "data.version == 1; data.strike_count == 0 (server-controlled regardless of any client value)"

      - name: intake_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Intake.fields.tongue_finding
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST intake with tongue_finding not in {PALE,RED,PURPLE,NORMAL} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Practitioner + patient exist."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr E", license_number: "LIC-E1" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Enum Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "GREEN", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"

      - name: appointment_end_before_start_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Appointment.fields.scheduled_end
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Booking with scheduled_end <= scheduled_start returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Patient with finalized intake + ACTIVE plan, practitioner, room."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr E2", license_number: "LIC-E2" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room E2" }
              as: ClinicAdmin
              captures: { room: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "T Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pid}", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["LI4"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id, plv: $.data.version }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${pid}", treatment_plan_id: "${pl}", practitioner_id: "${prac}", room_id: "${room}", charge_source: "PER_VISIT", scheduled_start: "2026-06-15T11:00:00Z", scheduled_end: "2026-06-15T10:00:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv}" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"

      - name: create_plan_wrong_patient_parent_not_found
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_PATIENT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "POST /treatment-plans with a non-existent patient_id (body FK) returns ERR_PATIENT_NOT_FOUND (404) at body-FK existence (priority 5). All other FKs (practitioner_id, intake_id) are valid so patient_id is the sole failing reference."
        test_recipe:
          setup: ["Practitioner, a real patient, and a FINALIZED intake of that patient exist (so practitioner_id and intake_id resolve); patient_id in the trigger is a bogus UUID."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr E3", license_number: "LIC-E3" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Real Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { realp: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${realp}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
          trigger:
            - call: "POST /treatment-plans"
              payload: { patient_id: "00000000-0000-4000-8000-000000000999", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["LI4"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_PATIENT_NOT_FOUND"

      - name: appointment_body_fk_room_not_found
        claim_type: flat
        grounds:
          - errors[ERR_ROOM_NOT_FOUND]
          - entities.Appointment.fields.room_id
        distinguishing_aspect: "Booking with a non-existent room_id (body FK, priority 5) returns ERR_ROOM_NOT_FOUND (404)."
        test_recipe:
          setup: ["Patient with finalized intake + ACTIVE plan, practitioner; no such room."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr E4", license_number: "LIC-E4" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "FK Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pid}", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["LI4"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id, plv: $.data.version }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${pid}", treatment_plan_id: "${pl}", practitioner_id: "${prac}", room_id: "00000000-0000-4000-8000-0000000000bb", charge_source: "PER_VISIT", scheduled_start: "2026-06-15T10:00:00Z", scheduled_end: "2026-06-15T10:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv}" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_ROOM_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: finalize_already_finalized_intake_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Patient.PENDING_INTAKE_to_INTAKE_COMPLETE
          - errors[ERR_INTAKE_NOT_DRAFT]
        distinguishing_aspect: "Finalizing an already FINALIZED intake (second call) returns ERR_INTAKE_NOT_DRAFT (409); no side effects re-fire."
        test_recipe:
          setup: ["Patient + practitioner; intake finalized once."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr S1", license_number: "LIC-S1" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "S1 Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
          trigger:
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INTAKE_NOT_DRAFT"

      - name: resume_active_plan_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.TreatmentPlan.ON_HOLD_to_ACTIVE
          - errors[ERR_PLAN_NOT_ON_HOLD]
        distinguishing_aspect: "Resuming a plan that is ACTIVE (not ON_HOLD) returns ERR_PLAN_NOT_ON_HOLD (409)."
        test_recipe:
          setup: ["Patient with finalized intake + ACTIVE plan (never held)."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr S2", license_number: "LIC-S2" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "S2 Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pid}", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["LI4"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id }
          trigger:
            - call: "POST /treatment-plans/${pl}/resume"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_PLAN_NOT_ON_HOLD"

      - name: complete_plan_with_open_appointment_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TreatmentPlan.ACTIVE_to_COMPLETED
          - errors[ERR_PLAN_HAS_OPEN_APPOINTMENTS]
        distinguishing_aspect: "Completing an ACTIVE plan that still has a SCHEDULED appointment returns ERR_PLAN_HAS_OPEN_APPOINTMENTS (409)."
        test_recipe:
          setup: ["Patient with finalized intake + ACTIVE plan + one SCHEDULED PER_VISIT appointment."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr S3", license_number: "LIC-S3" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room S3" }
              as: ClinicAdmin
              captures: { room: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "S3 Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pid}", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["LI4"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id, plv: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pid}", treatment_plan_id: "${pl}", practitioner_id: "${prac}", room_id: "${room}", charge_source: "PER_VISIT", scheduled_start: "2026-06-16T10:00:00Z", scheduled_end: "2026-06-16T10:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv}" }
              as: ClinicAdmin
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /treatment-plans/${pl}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_PLAN_HAS_OPEN_APPOINTMENTS"

      - name: complete_scheduled_appointment_rejected_not_checked_in
        claim_type: invalid_transition
        grounds:
          - state_machines.Appointment.CHECKED_IN_to_COMPLETED
          - errors[ERR_APPT_NOT_CHECKED_IN]
        distinguishing_aspect: "Completing a SCHEDULED appointment (skipping check-in) returns ERR_APPT_NOT_CHECKED_IN (409)."
        test_recipe:
          setup: ["Patient with finalized intake + ACTIVE plan + one SCHEDULED appointment (not checked in)."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr S4", license_number: "LIC-S4" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room S4" }
              as: ClinicAdmin
              captures: { room: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "S4 Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pid}", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["LI4"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id, plv: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pid}", treatment_plan_id: "${pl}", practitioner_id: "${prac}", room_id: "${room}", charge_source: "PER_VISIT", scheduled_start: "2026-06-17T10:00:00Z", scheduled_end: "2026-06-17T10:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv}" }
              as: ClinicAdmin
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /appointments/${ap}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_APPT_NOT_CHECKED_IN"

      - name: cancel_completed_appointment_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - errors[ERR_APPT_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) appointment returns ERR_APPT_NOT_CANCELLABLE (409); no Charge is voided."
        test_recipe:
          setup: ["Patient with finalized intake + ACTIVE plan + an appointment that is checked-in then completed."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr S5", license_number: "LIC-S5" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room S5" }
              as: ClinicAdmin
              captures: { room: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "S5 Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pid}", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["LI4"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id, plv: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pid}", treatment_plan_id: "${pl}", practitioner_id: "${prac}", room_id: "${room}", charge_source: "PER_VISIT", scheduled_start: "2026-06-18T10:00:00Z", scheduled_end: "2026-06-18T10:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv}" }
              as: ClinicAdmin
              captures: { ap: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T10:00:00Z" }
              as: ClinicAdmin
