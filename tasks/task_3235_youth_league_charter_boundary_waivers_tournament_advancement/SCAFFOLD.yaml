scenario: 'Youth League Charter, Boundary Waivers & Tournament Advancement (Little League Baseball): local league chartering with defined geographic boundaries and annual charter renewal requirements, player
  eligibility determined by residence or school attendance with documentation and waiver processes, division placement by league age with cutoff dates and safety-based exceptions, volunteer background screening
  requirements applied to every adult with disqualification criteria, all-star team selection with residency and participation requirements for tournament eligibility, tournament advancement through district,
  sectional, state and regional levels with elimination formats and pitch count rules, protest and eligibility challenge procedures during tournament play, safety, equipment and field standards with insurance
  program participation

  '
domain_name: youth-league-charter
api_prefix: /leagues
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - rate_threshold_triggers
  - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: League
  parent: null
  common_fields: true
  fields:
  - name: league_name
    type: string
    source: input
    description: League name
  - name: region_code
    type: string
    source: input
    description: Region code (e.g., WEST, SOUTHWEST)
  - name: season_year
    type: integer
    source: input
    description: Home season year the league is chartered for
  - name: charter_status
    type: enum
    source: system
    description: PROVISIONAL | CHARTERED | SUSPENDED; initial PROVISIONAL
  - name: total_team_count
    type: integer
    source: computed
    description: Sum of team_count over this league's divisions; recomputed whenever a division team_count changes
- name: CharterRenewal
  parent: League
  common_fields: true
  fields:
  - name: league_id
    type: string
    source: system
    description: FK -> League.id
  - name: season_year
    type: integer
    source: input
    description: Season this renewal covers; must be >= league.season_year; at most one non-REJECTED renewal per (league, season_year)
  - name: window_classification
    type: enum
    source: computed
    description: ON_TIME | LATE, derived from submission date vs renewal window
  - name: provisional_fee_cents
    type: integer
    source: computed
    description: Fee computed at submission using division team_counts as of submission
  - name: final_fee_cents
    type: integer
    source: computed
    description: Fee recomputed at approval using current division team_counts; null until APPROVED
  - name: late_fee_paid
    type: boolean
    source: system
    description: Recorded from decide payload at approval; false for ON_TIME approvals
  - name: status
    type: enum
    source: system
    description: SUBMITTED | APPROVED | REJECTED
- name: Division
  parent: League
  common_fields: true
  fields:
  - name: league_id
    type: string
    source: system
    description: FK -> League.id
  - name: division_code
    type: enum
    source: system
    description: TEE_BALL | MINOR | MAJOR | JUNIOR | SENIOR; five standard divisions auto-created with the league
  - name: min_league_age
    type: integer
    source: system
    description: 'Standard range floor: 4/7/10/13/15 by division_code'
  - name: max_league_age
    type: integer
    source: system
    description: 'Standard range ceiling: 6/9/12/14/16 by division_code'
  - name: team_count
    type: integer
    source: input
    default: 0
    description: Number of teams fielded in this division; set via PATCH
  - name: status
    type: enum
    source: system
    description: ACTIVE | SUSPENDED
- name: Player
  parent: League
  common_fields: true
  fields:
  - name: league_id
    type: string
    source: system
    description: FK -> League.id
  - name: division_id
    type: string
    source: computed
    description: FK -> Division.id; auto-assigned by league_age at registration when a standard division covers the age; null otherwise; overwritten when an APPROVED waiver carries target_division_id
  - name: first_name
    type: string
    source: input
    description: Player first name
  - name: last_name
    type: string
    source: input
    description: Player last name
  - name: birth_date
    type: string
    source: input
    description: Birth date YYYY-MM-DD
  - name: residence_within_boundary
    type: boolean
    source: input
    description: True if the player's residence lies inside the league's chartered boundary
  - name: school_within_boundary
    type: boolean
    source: input
    description: True if the player's school lies inside the league's chartered boundary
  - name: games_played
    type: integer
    source: input
    description: Regular-season games the player appeared in
  - name: games_scheduled
    type: integer
    source: input
    description: Regular-season games the player's team scheduled
  - name: participation_pct
    type: number
    source: computed
    description: 100 * games_played / games_scheduled, 2 decimal places round_half_up; 0.00 when games_scheduled == 0
  - name: league_age
    type: integer
    source: computed
    description: Player age on Aug 31 of league.season_year
  - name: eligibility_status
    type: enum
    source: system
    description: PENDING | ELIGIBLE | INELIGIBLE
- name: EligibilityDocument
  parent: Player
  common_fields: false
  fields:
  - name: player_id
    type: string
    source: system
    description: FK -> Player.id
  - name: doc_type
    type: enum
    source: input
    description: BIRTH_CERTIFICATE | RESIDENCE_PROOF | SCHOOL_ENROLLMENT
  - name: issued_date
    type: string
    source: input
    description: Document issue date YYYY-MM-DD; RESIDENCE_PROOF and SCHOOL_ENROLLMENT must be issued within 365 days before the verification date
- name: BoundaryWaiver
  parent: League
  common_fields: true
  fields:
  - name: league_id
    type: string
    source: system
    description: FK -> League.id
  - name: player_id
    type: string
    source: input
    description: FK -> Player.id
  - name: waiver_type
    type: enum
    source: input
    description: RESIDENCY_BOUNDARY | PLAY_DOWN_SAFETY | BIRTH_DATE_CUTOFF
  - name: reason
    type: string
    source: input
    description: Justification text
  - name: valid_from
    type: string
    source: input
    description: Validity window start date YYYY-MM-DD (inclusive)
  - name: valid_until
    type: string
    source: input
    description: Validity window end date YYYY-MM-DD (exclusive); must be > valid_from
  - name: target_division_id
    type: string
    source: input
    description: FK -> Division.id; required for PLAY_DOWN_SAFETY and BIRTH_DATE_CUTOFF, forbidden for RESIDENCY_BOUNDARY
  - name: status
    type: enum
    source: system
    description: PENDING | APPROVED | DENIED | REVOKED
- name: Volunteer
  parent: League
  common_fields: true
  fields:
  - name: league_id
    type: string
    source: system
    description: FK -> League.id
  - name: full_name
    type: string
    source: input
    description: Volunteer full name
  - name: role_title
    type: enum
    source: input
    description: MANAGER | COACH | UMPIRE | BOARD_MEMBER | CONCESSIONS
  - name: status
    type: enum
    source: system
    description: REGISTERED | CLEARED | DISQUALIFIED
- name: BackgroundScreening
  parent: Volunteer
  common_fields: true
  fields:
  - name: volunteer_id
    type: string
    source: system
    description: FK -> Volunteer.id
  - name: offense_category
    type: enum
    source: input
    description: NONE | NONVIOLENT_MISDEMEANOR | VIOLENT_FELONY | SEXUAL_OFFENSE | CHILD_ABUSE
  - name: valid_from
    type: string
    source: input
    description: Screening validity start date YYYY-MM-DD
  - name: valid_through
    type: string
    source: input
    description: Screening validity end date YYYY-MM-DD (inclusive); must be >= valid_from
  - name: auto_flagged
    type: boolean
    source: computed
    description: True when offense_category is VIOLENT_FELONY, SEXUAL_OFFENSE, or CHILD_ABUSE at submission
  - name: status
    type: enum
    source: system
    description: SUBMITTED | CLEARED | DISQUALIFIED
- name: InsuranceCertificate
  parent: League
  common_fields: true
  fields:
  - name: league_id
    type: string
    source: system
    description: FK -> League.id
  - name: carrier_name
    type: string
    source: input
    description: Insurance carrier name
  - name: coverage_start
    type: string
    source: input
    description: Coverage window start YYYY-MM-DD (inclusive)
  - name: coverage_end
    type: string
    source: input
    description: Coverage window end YYYY-MM-DD (inclusive); must be >= coverage_start
  - name: status
    type: enum
    source: system
    description: ACTIVE | EXPIRED; EXPIRED set by clock sweep when current date > coverage_end
- name: AllStarRoster
  parent: League
  common_fields: true
  fields:
  - name: league_id
    type: string
    source: system
    description: FK -> League.id
  - name: division_id
    type: string
    source: input
    description: FK -> Division.id
  - name: season_year
    type: integer
    source: system
    description: Copied from league.season_year at creation
  - name: selections
    type: array
    source: system
    description: Array of {player_id, selected_at, status ACTIVE|VACATED}; appended by selections endpoint, VACATED by eligibility-revocation cascade
  - name: roster_size
    type: integer
    source: computed
    description: 'Count of selections with status ACTIVE; invariant: always equals that count'
  - name: status
    type: enum
    source: system
    description: OPEN | SUBMITTED | RECALLED | LOCKED
- name: TournamentEntry
  parent: League
  common_fields: true
  fields:
  - name: league_id
    type: string
    source: system
    description: FK -> League.id
  - name: roster_id
    type: string
    source: input
    description: FK -> AllStarRoster.id; roster must be SUBMITTED
  - name: level
    type: enum
    source: input
    description: DISTRICT | SECTIONAL | STATE | REGIONAL; non-DISTRICT requires an ADVANCED entry at the immediately preceding level in the same league
  - name: elimination_format
    type: enum
    source: computed
    description: DOUBLE_ELIMINATION for DISTRICT/SECTIONAL, SINGLE_ELIMINATION for STATE/REGIONAL
  - name: losses_count
    type: integer
    source: computed
    description: Number of FINAL games with result LOSS at this entry's level
  - name: status
    type: enum
    source: system
    description: ACTIVE | ADVANCED | ELIMINATED | WITHDRAWN
- name: TournamentGame
  parent: TournamentEntry
  common_fields: true
  fields:
  - name: entry_id
    type: string
    source: system
    description: FK -> TournamentEntry.id
  - name: opponent_entry_id
    type: string
    source: input
    description: FK -> TournamentEntry.id; optional; when provided must reference an ACTIVE entry at the same level
  - name: play_status
    type: enum
    source: system
    description: SCHEDULED | IN_PROGRESS | FINAL | CANCELLED
  - name: protest_status
    type: enum
    source: system
    description: NONE | OPEN | RESOLVED; independent parallel dimension
  - name: game_date
    type: string
    source: computed
    description: Date (from logical clock) the game moved to IN_PROGRESS; null while SCHEDULED
  - name: our_score
    type: integer
    source: system
    description: Recorded at finalize; null until FINAL
  - name: opponent_score
    type: integer
    source: system
    description: Recorded at finalize; null until FINAL
  - name: result
    type: enum
    source: computed
    description: WIN | LOSS; null until FINAL; cleared back to null when an upheld RULE_INTERPRETATION protest reopens the game
  - name: recorded_pitch_total
    type: integer
    source: computed
    description: 'Sum of effective pitches (official_pitches when set, else pitches_thrown) over this game''s RECORDED appearances; invariant: always equals that sum'
- name: PitchingAppearance
  parent: TournamentGame
  common_fields: true
  fields:
  - name: game_id
    type: string
    source: system
    description: FK -> TournamentGame.id
  - name: player_id
    type: string
    source: input
    description: FK -> Player.id; player must hold an ACTIVE selection on the entry's roster
  - name: pitches_thrown
    type: integer
    source: input
    description: Reported pitch count for this appearance; must be >= 1
  - name: official_pitches
    type: integer
    source: system
    description: Corrected count set by finalize scorebook_corrections; null until corrected
  - name: appearance_date
    type: string
    source: system
    description: Date (from logical clock) the appearance was recorded
  - name: rest_days_required
    type: integer
    source: computed
    description: Rest tier from effective pitch count; recomputed when official_pitches is set
  - name: eligible_again_on
    type: string
    source: computed
    description: appearance_date + rest_days_required (date); recomputed when official_pitches is set
  - name: status
    type: enum
    source: system
    description: RECORDED | REVERSED
- name: Protest
  parent: TournamentGame
  common_fields: true
  fields:
  - name: game_id
    type: string
    source: system
    description: FK -> TournamentGame.id
  - name: protest_type
    type: enum
    source: input
    description: RULE_INTERPRETATION | ELIGIBILITY_CHALLENGE
  - name: target_player_id
    type: string
    source: input
    description: FK -> Player.id; required for ELIGIBILITY_CHALLENGE, forbidden for RULE_INTERPRETATION
  - name: grounds
    type: string
    source: input
    description: Protest grounds text
  - name: status
    type: enum
    source: system
    description: FILED | UPHELD | OVERTURNED | WITHDRAWN
state_machines:
- entity: League
  initial_state: PROVISIONAL
  terminal_states: []
  transitions:
  - from: PROVISIONAL
    to: CHARTERED
    trigger: POST /leagues/{leagueId}/charter-renewals/{renewalId}/decide (action APPROVE)
    actor: DistrictAdministrator
    preconditions:
    - Renewal SUBMITTED; renewal season_window insurance containment satisfied; LATE renewals require late_fee_paid true
    side_effects:
    - CharterRenewal.status -> APPROVED; final_fee_cents computed from current division team_counts
    - League.version increments by 1
  - from: CHARTERED
    to: SUSPENDED
    trigger: system (clock sweep inside POST /_clock/set_current_utc)
    actor: system
    preconditions:
    - Latest APPROVED renewal covers season Y, the new clock date is after (Y+1)-03-31, and no APPROVED renewal exists for season Y+1
    side_effects:
    - Every Division with status ACTIVE -> SUSPENDED
    - Every TournamentEntry with status ACTIVE in this league -> WITHDRAWN
    - Every TournamentGame of those entries with play_status SCHEDULED -> CANCELLED
    - League.version increments by 1
  - from: SUSPENDED
    to: CHARTERED
    trigger: POST /leagues/{leagueId}/charter-renewals/{renewalId}/decide (action APPROVE)
    actor: DistrictAdministrator
    preconditions:
    - Same as PROVISIONAL -> CHARTERED
    side_effects:
    - CharterRenewal.status -> APPROVED; final_fee_cents computed
    - Every Division with status SUSPENDED -> ACTIVE
    - TournamentEntries remain WITHDRAWN (no resurrection)
    - League.version increments by 1
- entity: Division
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: system (cascade from League CHARTERED -> SUSPENDED)
    actor: system
    preconditions: []
    side_effects: []
  - from: SUSPENDED
    to: ACTIVE
    trigger: system (cascade from League SUSPENDED -> CHARTERED reinstatement)
    actor: system
    preconditions: []
    side_effects: []
- entity: CharterRenewal
  initial_state: SUBMITTED
  terminal_states:
  - APPROVED
  - REJECTED
  transitions:
  - from: SUBMITTED
    to: APPROVED
    trigger: POST /leagues/{leagueId}/charter-renewals/{renewalId}/decide (action APPROVE)
    actor: DistrictAdministrator
    preconditions:
    - Renewal SUBMITTED (ERR_RENEWAL_NOT_PENDING otherwise)
    - An ACTIVE InsuranceCertificate of the league covers [season-03-01, season-10-31] (ERR_INSURANCE_NOT_ACTIVE)
    - If window_classification == LATE then late_fee_paid must be true (ERR_LATE_FEE_UNPAID)
    side_effects:
    - final_fee_cents computed via charter_renewal_fee (final variant)
    - League charter transition (PROVISIONAL or SUSPENDED -> CHARTERED)
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /leagues/{leagueId}/charter-renewals/{renewalId}/decide (action REJECT)
    actor: DistrictAdministrator
    preconditions:
    - Renewal SUBMITTED
    side_effects: []
- entity: Player
  initial_state: PENDING
  terminal_states: []
  transitions:
  - from: PENDING
    to: ELIGIBLE
    trigger: POST /leagues/{leagueId}/players/{playerId}/verify-eligibility
    actor: LeagueAdministrator
    preconditions:
    - 'Registration window open for league.season_year: clock date within [season-01-01, season-04-30] (ERR_REGISTRATION_WINDOW_CLOSED)'
    - At least one BIRTH_CERTIFICATE document and at least one document matching the residency basis (RESIDENCE_PROOF or SCHOOL_ENROLLMENT), each fresh (ERR_NO_ELIGIBILITY_DOCUMENT, ERR_DOCUMENT_EXPIRED)
    - residence_within_boundary OR school_within_boundary OR an APPROVED RESIDENCY_BOUNDARY waiver covering the current date (ERR_OUTSIDE_BOUNDARY)
    - division_id is non-null (ERR_AGE_DIVISION_MISMATCH)
    side_effects: []
  - from: INELIGIBLE
    to: ELIGIBLE
    trigger: POST /leagues/{leagueId}/players/{playerId}/verify-eligibility
    actor: LeagueAdministrator
    preconditions:
    - Same as PENDING -> ELIGIBLE (reinstatement loop)
    side_effects: []
  - from: ELIGIBLE
    to: INELIGIBLE
    trigger: POST /leagues/{leagueId}/players/{playerId}/revoke-eligibility
    actor: LeagueAdministrator
    preconditions:
    - Player ELIGIBLE (ERR_PLAYER_NOT_ELIGIBLE otherwise)
    side_effects:
    - 'Every AllStarRoster containing an ACTIVE selection of this player: selection -> VACATED; roster_size recomputed; if roster status SUBMITTED -> RECALLED (LOCKED rosters remain LOCKED)'
    - Every TournamentEntry with status ACTIVE whose roster contains (or contained) an ACTIVE selection of this player -> WITHDRAWN
    - Every TournamentGame of those entries with play_status SCHEDULED -> CANCELLED
- entity: BoundaryWaiver
  initial_state: PENDING
  terminal_states:
  - DENIED
  - REVOKED
  transitions:
  - from: PENDING
    to: APPROVED
    trigger: POST /leagues/{leagueId}/boundary-waivers/{waiverId}/decide (action APPROVE)
    actor: DistrictAdministrator
    preconditions:
    - Waiver PENDING (ERR_WAIVER_NOT_PENDING)
    - No other APPROVED waiver for the same player and waiver_type whose half-open window [valid_from, valid_until) intersects this waiver's window; adjacency (a.valid_until == b.valid_from) is allowed
      (ERR_WAIVER_OVERLAP)
    side_effects:
    - 'If waiver_type is PLAY_DOWN_SAFETY or BIRTH_DATE_CUTOFF: Player.division_id := target_division_id'
  - from: PENDING
    to: DENIED
    trigger: POST /leagues/{leagueId}/boundary-waivers/{waiverId}/decide (action DENY)
    actor: DistrictAdministrator
    preconditions:
    - Waiver PENDING
    side_effects: []
  - from: APPROVED
    to: REVOKED
    trigger: POST /leagues/{leagueId}/boundary-waivers/{waiverId}/decide (action REVOKE)
    actor: DistrictAdministrator
    preconditions:
    - Waiver APPROVED
    side_effects: []
    note: Revocation does not roll back Player.division_id; it only closes the waiver's future effect on eligibility checks
- entity: Volunteer
  initial_state: REGISTERED
  terminal_states:
  - DISQUALIFIED
  transitions:
  - from: REGISTERED
    to: CLEARED
    trigger: POST .../screenings/{screeningId}/adjudicate (action APPROVE)
    actor: DistrictAdministrator
    preconditions:
    - Screening SUBMITTED and window containment satisfied
    side_effects: []
  - from: REGISTERED
    to: DISQUALIFIED
    trigger: POST .../screenings/{screeningId}/adjudicate (action DISQUALIFY)
    actor: DistrictAdministrator
    preconditions:
    - Screening SUBMITTED
    side_effects: []
- entity: BackgroundScreening
  initial_state: SUBMITTED
  terminal_states:
  - CLEARED
  - DISQUALIFIED
  transitions:
  - from: SUBMITTED
    to: CLEARED
    trigger: POST .../screenings/{screeningId}/adjudicate (action APPROVE)
    actor: DistrictAdministrator
    preconditions:
    - Screening SUBMITTED (ERR_SCREENING_NOT_ADJUDICATABLE)
    - Screening window [valid_from, valid_through] must fully contain the season window [league.season_year-03-01, league.season_year-10-31] (ERR_SCREENING_WINDOW_INCOMPLETE)
    - offense_category must not be in {VIOLENT_FELONY, SEXUAL_OFFENSE, CHILD_ABUSE} (ERR_DISQUALIFYING_OFFENSE)
    side_effects:
    - Volunteer.status -> CLEARED
  - from: SUBMITTED
    to: DISQUALIFIED
    trigger: POST .../screenings/{screeningId}/adjudicate (action DISQUALIFY)
    actor: DistrictAdministrator
    preconditions:
    - Screening SUBMITTED
    side_effects:
    - Volunteer.status -> DISQUALIFIED
- entity: InsuranceCertificate
  initial_state: ACTIVE
  terminal_states:
  - EXPIRED
  transitions:
  - from: ACTIVE
    to: EXPIRED
    trigger: system (clock sweep inside POST /_clock/set_current_utc when clock date > coverage_end)
    actor: system
    preconditions: []
    side_effects: []
- entity: AllStarRoster
  initial_state: OPEN
  terminal_states:
  - LOCKED
  transitions:
  - from: OPEN
    to: SUBMITTED
    trigger: POST /leagues/{leagueId}/all-star-rosters/{rosterId}/submit
    actor: LeagueAdministrator
    preconditions:
    - roster_size >= 3 (ERR_ROSTER_BELOW_MINIMUM)
    - Every ACTIVE selection's player is ELIGIBLE (ERR_PLAYER_NOT_ELIGIBLE)
    - Every ACTIVE selection's player has participation_pct >= 60.00 (ERR_PARTICIPATION_THRESHOLD_NOT_MET)
    side_effects: []
    note: Roster size bounds are 3..5 (benchmark scale for real 12..14)
  - from: RECALLED
    to: SUBMITTED
    trigger: POST /leagues/{leagueId}/all-star-rosters/{rosterId}/submit
    actor: LeagueAdministrator
    preconditions:
    - Same as OPEN -> SUBMITTED (re-submission after fixing selections)
    side_effects: []
  - from: SUBMITTED
    to: LOCKED
    trigger: system (cascade from POST /leagues/{leagueId}/tournament-entries using this roster)
    actor: system
    preconditions: []
    side_effects: []
  - from: SUBMITTED
    to: RECALLED
    trigger: system (cascade from Player ELIGIBLE -> INELIGIBLE for a player with an ACTIVE selection)
    actor: system
    preconditions: []
    side_effects:
    - The player's selection -> VACATED; roster_size recomputed
  - from: LOCKED
    to: LOCKED
    trigger: system (cascade from Player ELIGIBLE -> INELIGIBLE for a player with an ACTIVE selection on a LOCKED roster)
    actor: system
    preconditions: []
    side_effects:
    - The player's selection -> VACATED; roster_size recomputed; roster status unchanged
    note: 'Self-loop: a LOCKED roster stays LOCKED when a selection is vacated mid-tournament; the withdrawal happens on the TournamentEntry'
- entity: TournamentEntry
  initial_state: ACTIVE
  terminal_states:
  - ADVANCED
  - ELIMINATED
  - WITHDRAWN
  transitions:
  - from: ACTIVE
    to: ADVANCED
    trigger: POST /tournament-entries/{entryId}/advance
    actor: TournamentDirector
    preconditions:
    - Entry ACTIVE (ERR_ENTRY_NOT_ACTIVE)
    - level != REGIONAL (ERR_ALREADY_HIGHEST_LEVEL)
    - At least one FINAL game with result WIN at this level
    - losses_count < elimination limit (1 for SINGLE_ELIMINATION, 2 for DOUBLE_ELIMINATION)
    - 'No game of this entry has protest_status OPEN (ERR_PROTEST_NOT_OPEN reversed: open protest blocks)'
    side_effects: []
  - from: ACTIVE
    to: ELIMINATED
    trigger: system (cascade from game finalize producing a LOSS that reaches the elimination limit)
    actor: system
    preconditions:
    - SINGLE_ELIMINATION and losses_count becomes 1, or DOUBLE_ELIMINATION and losses_count becomes 2
    side_effects:
    - Remaining SCHEDULED games of this entry -> CANCELLED
  - from: ACTIVE
    to: WITHDRAWN
    trigger: system (cascade from League suspension OR roster recall)
    actor: system
    preconditions: []
    side_effects:
    - Remaining SCHEDULED games of this entry -> CANCELLED
  - from: ELIMINATED
    to: ACTIVE
    trigger: system (cascade from an UPHELD RULE_INTERPRETATION protest reopening the FINAL game that caused elimination)
    actor: system
    preconditions:
    - The reopened game's LOSS had pushed losses_count to the elimination limit
    side_effects:
    - losses_count decremented by 1
- entity: TournamentGame
  initial_state: SCHEDULED
  terminal_states:
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: IN_PROGRESS
    trigger: system (automatic when the first PitchingAppearance is recorded)
    actor: system
    preconditions: []
    side_effects:
    - game_date := current clock date
  - from: IN_PROGRESS
    to: FINAL
    trigger: POST /tournament-entries/{entryId}/games/{gameId}/finalize
    actor: TournamentDirector
    preconditions:
    - expected_game_version matches game.version (ERR_STALE_VERSION)
    - League of the entry has an ACTIVE InsuranceCertificate whose window contains the clock date (ERR_INSURANCE_NOT_ACTIVE)
    - Every RECORDED appearance's effective pitch count <= the player's division pitch maximum (ERR_PITCH_COUNT_EXCEEDED)
    - our_score != opponent_score (ERR_INVALID_REQUEST on tie)
    side_effects:
    - our_score, opponent_score recorded; result computed (WIN if our_score > opponent_score else LOSS)
    - 'scorebook_corrections applied: official_pitches set, rest_days_required and eligible_again_on recomputed per pitch_rest_requirement (official variant)'
    - recorded_pitch_total recomputed
    - Entry losses_count incremented on LOSS; elimination_evaluation may cascade entry -> ELIMINATED and its remaining SCHEDULED games -> CANCELLED
    - game.version increments by 1
  - from: FINAL
    to: IN_PROGRESS
    trigger: system (cascade from Protest resolve action UPHOLD on a RULE_INTERPRETATION protest)
    actor: system
    preconditions: []
    side_effects:
    - result cleared to null; our_score/opponent_score retained but no longer authoritative
    - 'If the finalized result was LOSS: entry losses_count decremented; if that LOSS had caused ELIMINATED, entry -> ACTIVE'
    - protest_status -> RESOLVED then reset to NONE (game can be protested again)
    - game.version increments by 1
  - from: SCHEDULED
    to: CANCELLED
    trigger: system (cascade from entry ELIMINATED or WITHDRAWN)
    actor: system
    preconditions: []
    side_effects: []
- entity: PitchingAppearance
  initial_state: RECORDED
  terminal_states:
  - REVERSED
  transitions:
  - from: RECORDED
    to: REVERSED
    trigger: system (cascade from Protest resolve action UPHOLD on an ELIGIBILITY_CHALLENGE protest targeting this player in this game)
    actor: system
    preconditions: []
    side_effects:
    - game.recorded_pitch_total recomputed excluding REVERSED appearances
- entity: Protest
  initial_state: FILED
  terminal_states:
  - UPHELD
  - OVERTURNED
  - WITHDRAWN
  transitions:
  - from: FILED
    to: UPHELD
    trigger: POST .../protests/{protestId}/resolve (action UPHOLD)
    actor: TournamentDirector
    preconditions:
    - Protest FILED and game.protest_status == OPEN (ERR_PROTEST_NOT_OPEN)
    side_effects:
    - 'RULE_INTERPRETATION: game FINAL -> IN_PROGRESS with result voided and elimination reversed (see TournamentGame); if game IN_PROGRESS, only protest_status changes'
    - 'ELIGIBILITY_CHALLENGE: every RECORDED PitchingAppearance of target_player_id in this game -> REVERSED; recorded_pitch_total recomputed'
    - game.protest_status -> RESOLVED (and reset to NONE if the game reopens)
  - from: FILED
    to: OVERTURNED
    trigger: POST .../protests/{protestId}/resolve (action OVERTURN)
    actor: TournamentDirector
    preconditions:
    - Protest FILED and game.protest_status == OPEN
    side_effects:
    - game.protest_status -> RESOLVED; game result and all counters stand unchanged
  - from: FILED
    to: WITHDRAWN
    trigger: POST .../protests/{protestId}/resolve (action WITHDRAW)
    actor: TournamentDirector
    preconditions:
    - Protest FILED and game.protest_status == OPEN
    side_effects:
    - game.protest_status -> RESOLVED
concurrency_rules:
- rule_id: waiver-create-stale-league
  parent_entity: League
  write_endpoint: POST /leagues/{leagueId}/boundary-waivers
  occ_field: expected_league_version
  description: 'Creating a BoundaryWaiver against a League whose version has advanced

    since the client last observed it is rejected, because waiver validity is

    evaluated against the league''s current charter posture (a charter renewal

    decision or suspension sweep legitimately supersedes the prior posture).

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: game-finalize-stale-game
  parent_entity: TournamentGame
  write_endpoint: POST /tournament-entries/{entryId}/games/{gameId}/finalize
  occ_field: expected_game_version
  description: 'Finalizing a TournamentGame whose version has advanced since the client

    last observed it is rejected, because each recorded pitching appearance

    advances the game version and the official score must be certified

    against the complete appearance set the client actually reviewed.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: league_age_determination
  trigger: player registration (POST /leagues/{leagueId}/players)
  algorithm: threshold
  formula: "league_age = league.season_year - birth_year\nif (birth_month, birth_day) > (CUTOFF_MONTH, CUTOFF_DAY):\n  league_age = league_age - 1\nDivision auto-assignment: the auto-created standard division\
    \ with\nmin_league_age <= league_age <= max_league_age; if none, division_id is null.\n"
  constants:
    CUTOFF_MONTH: 8
    CUTOFF_DAY: 31
  precision: integer years
  input_set: the registering player and the parent league's season_year
- name: participation_percentage
  trigger: player registration; re-read at all-star selection and roster submit
  algorithm: aggregation
  formula: "if games_scheduled == 0:\n  participation_pct = 0.00\nelse:\n  participation_pct = round_half_up(100 * games_played / games_scheduled, 2)\nEligibility threshold: participation_pct >= 60.00 (exactly\
    \ 60.00 passes).\n"
  constants:
    PARTICIPATION_THRESHOLD: 60.0
  precision: 2 decimal places, round_half_up
  input_set: games_played and games_scheduled of the player
- name: charter_renewal_fee
  trigger: renewal submission (provisional variant) and renewal approval (final variant)
  algorithm: tiered_pricing
  formula: "lines = [BASE_FEE_CENTS] + [division.team_count * PER_TEAM_FEE_CENTS for each division of the league]\nif window_classification == ON_TIME:\n  fee = sum(lines)\nelse:  # LATE\n  fee = sum(round_half_up(line\
    \ * LATE_MULTIPLIER, 0) for line in lines)\n# Rounding order is pinned: multiply-and-round each line to integer cents\n# FIRST, then sum. Rounding the total instead produces different cents.\n"
  constants:
    BASE_FEE_CENTS: 50000
    PER_TEAM_FEE_CENTS: 7500
    LATE_MULTIPLIER: 1.175
  precision: integer cents, round_half_up per line before summation
  input_set: all divisions of the league regardless of division status
  variants:
  - name: provisional
    when: computed at renewal submission
    difference: uses division team_counts as they exist at submission time
  - name: final
    when: computed at renewal approval (decide APPROVE)
    difference: recomputed from division team_counts as they exist at approval time; diverges from provisional whenever team_counts changed in between
- name: renewal_window_classification
  trigger: renewal submission
  algorithm: threshold
  formula: 'Let S = renewal season_year, D = clock date at submission.

    ON_TIME if D in [S-1 year Oct 01, S-1 year Dec 31] (closed interval)

    LATE    if D in [S year Jan 01, S year Mar 31] (closed interval)

    otherwise the submission is rejected with ERR_RENEWAL_WINDOW_CLOSED.

    '
  constants:
    ON_TIME_OPEN: 10-01 (of season_year - 1)
    ON_TIME_CLOSE: 12-31 (of season_year - 1)
    LATE_CLOSE: 03-31 (of season_year)
  precision: date granularity
  input_set: renewal season_year and the logical clock
- name: pitch_rest_requirement
  trigger: pitching appearance recording and game finalize (scorebook corrections)
  algorithm: threshold
  formula: "effective = official_pitches if official_pitches is not null else pitches_thrown\ncap = PITCH_MAX_BY_DIVISION[player's division_code]\n# Step 1 (cap, safety): at recording, pitches_thrown >\
    \ cap -> reject\n# ERR_PITCH_COUNT_EXCEEDED; at finalize, effective > cap -> reject.\n# Step 2 (tier select, closed intervals):\n#   1..20 -> 0 days; 21..35 -> 1; 36..50 -> 2; 51..65 -> 3; 66..cap ->\
    \ 4\n# Step 3 (rest gate): a new appearance for the same player is rejected\n# ERR_REST_REQUIREMENT_VIOLATION when the clock date is strictly before\n# the eligible_again_on of the player's latest RECORDED\
    \ appearance\n# (latest by appearance_date, tie-break created_at ASC \u2014 earlier wins,\n# so the appearance with the later created_at is the latest).\nrest_days_required = tier(effective)\neligible_again_on\
    \ = appearance_date + rest_days_required days\n"
  constants:
    PITCH_MAX_TEE_BALL: 50
    PITCH_MAX_MINOR: 75
    PITCH_MAX_MAJOR: 85
    PITCH_MAX_JUNIOR: 95
    PITCH_MAX_SENIOR: 95
    REST_TIER_1_MAX: 20
    REST_TIER_2_MAX: 35
    REST_TIER_3_MAX: 50
    REST_TIER_4_MAX: 65
  precision: integer pitches, integer days, date granularity
  input_set: the appearance, the player's division, the player's prior RECORDED appearances
  variants:
  - name: provisional
    when: at appearance recording
    difference: rest computed from reported pitches_thrown
  - name: official
    when: at game finalize when scorebook_corrections sets official_pitches
    difference: rest recomputed from official_pitches; a correction crossing a rest-tier boundary (e.g., 60 -> 70) changes eligible_again_on for the same appearance
- name: recorded_pitch_total
  trigger: appearance recording, finalize corrections, appearance reversal
  algorithm: aggregation
  formula: 'game.recorded_pitch_total = sum over this game''s PitchingAppearances

    with status RECORDED of (official_pitches if set else pitches_thrown).

    REVERSED appearances contribute 0.

    '
  precision: integer pitches
  input_set: the game's appearances with status RECORDED
- name: roster_size_count
  trigger: selection add, eligibility-revocation cascade
  algorithm: aggregation
  formula: 'roster.roster_size = count of roster.selections with status ACTIVE.

    Submittable window: MIN_ROSTER_SIZE <= roster_size <= MAX_ROSTER_SIZE

    (benchmark scale for Little League''s 12..14).

    '
  constants:
    MIN_ROSTER_SIZE: 3
    MAX_ROSTER_SIZE: 5
  precision: integer
  input_set: the roster's selections array
- name: elimination_evaluation
  trigger: game finalize producing result LOSS; protest reopen reversal
  algorithm: threshold
  formula: "limit = 1 if entry.elimination_format == SINGLE_ELIMINATION else 2\nOn LOSS: losses_count += 1; if losses_count >= limit: entry -> ELIMINATED.\nOn upheld RULE_INTERPRETATION reopen of a FINAL\
    \ LOSS game:\n  losses_count -= 1; if entry was ELIMINATED: entry -> ACTIVE.\n"
  constants:
    SINGLE_ELIMINATION_LIMIT: 1
    DOUBLE_ELIMINATION_LIMIT: 2
  precision: integer
  input_set: the entry's FINAL games at its level
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers must be present and valid
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: Role must have permission to perform this operation
  error_id: ERR_INSUFFICIENT_PERMISSIONS
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Resource IDs in path must exist, validated left-to-right (leagueId, then playerId/volunteerId/renewalId/waiverId/rosterId/divisionId, then entryId, then gameId, then protestId/screeningId)
  error_id: ERR_{RESOURCE}_NOT_FOUND (per resource type)
  http_status: 404
  applies_to: all nested endpoints
- priority: 4
  category: state
  check: 'League charter gate: league must be CHARTERED for player registration, boundary-waiver creation, all-star roster creation/selection/submit, and tournament-entry creation'
  error_id: ERR_LEAGUE_NOT_CHARTERED
  http_status: 409
  applies_to: POST players, POST boundary-waivers, POST all-star-rosters, POST selections, POST submit, POST tournament-entries
- priority: 5
  category: state
  check: Target entity must be in the correct state for the operation (renewal SUBMITTED, waiver PENDING for APPROVE/DENY or APPROVED for REVOKE, screening SUBMITTED, roster OPEN or RECALLED for selections
    and submit, roster SUBMITTED for entry creation, entry ACTIVE for games/advance, game SCHEDULED-or-IN_PROGRESS for appearances and IN_PROGRESS for finalize, protest FILED for resolve, player PENDING-or-INELIGIBLE
    for verify and ELIGIBLE for revoke/selection)
  error_id: ERR_RENEWAL_NOT_PENDING | ERR_WAIVER_NOT_PENDING | ERR_SCREENING_NOT_ADJUDICATABLE | ERR_ROSTER_NOT_OPEN | ERR_ROSTER_NOT_SUBMITTED | ERR_ENTRY_NOT_ACTIVE | ERR_GAME_NOT_IN_PROGRESS | ERR_PROTEST_NOT_OPEN
    | ERR_PLAYER_NOT_VERIFIABLE | ERR_PLAYER_NOT_ELIGIBLE
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  category: business_safety
  check: 'Pitching safety: pitches_thrown must not exceed the player''s division pitch maximum (ERR_PITCH_COUNT_EXCEEDED); the clock date must be on/after the player''s latest eligible_again_on (ERR_REST_REQUIREMENT_VIOLATION);
    a severe-category screening cannot be adjudicated APPROVE (ERR_DISQUALIFYING_OFFENSE)'
  error_id: ERR_PITCH_COUNT_EXCEEDED | ERR_REST_REQUIREMENT_VIOLATION | ERR_DISQUALIFYING_OFFENSE
  http_status: 409 | 422 (per error catalog)
  applies_to: POST pitching-appearances, POST finalize, POST screenings adjudicate
- priority: 7
  category: business_temporal
  check: 'Temporal windows: renewal submission inside ON_TIME or LATE window (ERR_RENEWAL_WINDOW_CLOSED); verify-eligibility inside registration window (ERR_REGISTRATION_WINDOW_CLOSED); RESIDENCE_PROOF/SCHOOL_ENROLLMENT
    issued within 365 days (ERR_DOCUMENT_EXPIRED); screening window contains the season window (ERR_SCREENING_WINDOW_INCOMPLETE)'
  error_id: ERR_RENEWAL_WINDOW_CLOSED | ERR_REGISTRATION_WINDOW_CLOSED | ERR_DOCUMENT_EXPIRED | ERR_SCREENING_WINDOW_INCOMPLETE
  http_status: 422
  applies_to: POST charter-renewals, POST verify-eligibility, POST screenings adjudicate
- priority: 8
  category: business_referential
  check: 'Cross-entity integrity: required eligibility documents present (ERR_NO_ELIGIBILITY_DOCUMENT); boundary or approved residency waiver (ERR_OUTSIDE_BOUNDARY); division assigned (ERR_AGE_DIVISION_MISMATCH);
    selection player division matches roster division (ERR_PLAYER_DIVISION_MISMATCH); participation >= 60.00 (ERR_PARTICIPATION_THRESHOLD_NOT_MET); appearance player on entry roster (ERR_PLAYER_NOT_ON_ROSTER);
    no overlapping APPROVED waiver window (ERR_WAIVER_OVERLAP); ACTIVE insurance containing season/game date (ERR_INSURANCE_NOT_ACTIVE); advancement prerequisites (ERR_ADVANCEMENT_PREREQUISITE_NOT_MET,
    ERR_ALREADY_HIGHEST_LEVEL); roster size bounds (ERR_ROSTER_BELOW_MINIMUM, ERR_ROSTER_ABOVE_MAXIMUM); within selections: player division match is evaluated before roster capacity'
  error_id: ERR_NO_ELIGIBILITY_DOCUMENT | ERR_OUTSIDE_BOUNDARY | ERR_AGE_DIVISION_MISMATCH | ERR_PLAYER_DIVISION_MISMATCH | ERR_PARTICIPATION_THRESHOLD_NOT_MET | ERR_PLAYER_NOT_ON_ROSTER | ERR_WAIVER_OVERLAP
    | ERR_INSURANCE_NOT_ACTIVE | ERR_ADVANCEMENT_PREREQUISITE_NOT_MET | ERR_ALREADY_HIGHEST_LEVEL | ERR_ROSTER_BELOW_MINIMUM | ERR_ROSTER_ABOVE_MAXIMUM
  http_status: 422
  applies_to: verify-eligibility, waiver decide, roster selections/submit, entries, appearances, finalize, advance, renewal decide
- priority: 9
  category: business_fiscal
  check: LATE renewal approvals require late_fee_paid true
  error_id: ERR_LATE_FEE_UNPAID
  http_status: 402
  applies_to: POST charter-renewals decide (APPROVE)
endpoints:
- method: POST
  path: /leagues
  description: Create a league; auto-creates the five standard divisions in fixed creation order TEE_BALL, MINOR, MAJOR, JUNIOR, SENIOR (TEE_BALL 4-6, MINOR 7-9, MAJOR 10-12, JUNIOR 13-14, SENIOR 15-16,
    team_count 0, status ACTIVE); charter_status starts PROVISIONAL. GET /leagues/{id}/divisions returns them in created_at ASC order (ties broken by the fixed creation order above), so index 0 is TEE_BALL,
    1 is MINOR, 2 is MAJOR, 3 is JUNIOR, 4 is SENIOR.
  roles:
  - DistrictAdministrator
  code: 201
  input:
  - league_name
  - region_code
  - season_year
  output: League
  side_effects:
  - five Division records created
  - total_team_count initialized to 0
- method: GET
  path: /leagues
  description: List leagues
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  output: League[]
  side_effects: []
- method: GET
  path: /leagues/{leagueId}
  description: Get a single league (charter_status, total_team_count, version)
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input: []
  output: League
  side_effects: []
- method: POST
  path: /leagues/{leagueId}/charter-renewals
  description: Submit a charter renewal for season_year; computes window_classification from the logical clock (rejects OUTSIDE window) and provisional_fee_cents
  roles:
  - LeagueAdministrator
  code: 201
  input:
  - season_year
  output: CharterRenewal
  side_effects:
  - window_classification computed
  - provisional_fee_cents computed via charter_renewal_fee (provisional variant)
- method: GET
  path: /leagues/{leagueId}/charter-renewals
  description: List charter renewals of a league
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  output: CharterRenewal[]
  side_effects: []
- method: POST
  path: /leagues/{leagueId}/charter-renewals/{renewalId}/decide
  description: Approve or reject a SUBMITTED renewal; APPROVE requires insurance containment, requires late_fee_paid for LATE renewals, computes final_fee_cents, and transitions the League to CHARTERED
  roles:
  - DistrictAdministrator
  code: 200
  input:
  - action
  - late_fee_paid?
  output: CharterRenewal
  side_effects:
  - 'on APPROVE: final_fee_cents computed via charter_renewal_fee (final variant)'
  - League -> CHARTERED
  - League.version increments by 1
  - SUSPENDED divisions -> ACTIVE on reinstatement
- method: GET
  path: /leagues/{leagueId}/divisions
  description: List divisions of a league
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  output: Division[]
  side_effects: []
- method: PATCH
  path: /leagues/{leagueId}/divisions/{divisionId}
  description: Set a division's team_count; allowed while league is PROVISIONAL or CHARTERED
  roles:
  - LeagueAdministrator
  code: 200
  input:
  - team_count
  output: Division
  side_effects:
  - League.total_team_count recomputed
  - League.version increments by 1
- method: POST
  path: /leagues/{leagueId}/players
  description: Register a player; computes league_age (Aug 31 cutoff), auto-assigns division_id when a standard division covers the age, computes participation_pct; eligibility_status starts PENDING
  roles:
  - LeagueAdministrator
  code: 201
  input:
  - first_name
  - last_name
  - birth_date
  - residence_within_boundary
  - school_within_boundary
  - games_played
  - games_scheduled
  output: Player
  side_effects:
  - league_age computed
  - division_id auto-assigned or null
  - participation_pct computed
- method: GET
  path: /leagues/{leagueId}/players
  description: List players of a league
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  - division_id?
  - eligibility_status?
  output: Player[]
  side_effects: []
- method: POST
  path: /leagues/{leagueId}/players/{playerId}/eligibility-documents
  description: Attach an eligibility document (attestation recorded by the league administrator)
  roles:
  - LeagueAdministrator
  code: 201
  input:
  - doc_type
  - issued_date
  output: EligibilityDocument
  side_effects: []
- method: GET
  path: /leagues/{leagueId}/players/{playerId}/eligibility-documents
  description: List a player's eligibility documents
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  output: EligibilityDocument[]
  side_effects: []
- method: POST
  path: /leagues/{leagueId}/players/{playerId}/verify-eligibility
  description: 'Verify a PENDING or INELIGIBLE player into ELIGIBLE: registration window, document presence and freshness, boundary or residency waiver, division assignment'
  roles:
  - LeagueAdministrator
  code: 200
  input: []
  output: Player
  side_effects:
  - eligibility_status -> ELIGIBLE
- method: POST
  path: /leagues/{leagueId}/players/{playerId}/revoke-eligibility
  description: Revoke an ELIGIBLE player; cascades to rosters (selection VACATED, SUBMITTED roster RECALLED), entries (WITHDRAWN), and SCHEDULED games (CANCELLED)
  roles:
  - LeagueAdministrator
  code: 200
  input:
  - reason?
  output: Player
  side_effects:
  - eligibility_status -> INELIGIBLE
  - selection -> VACATED
  - roster_size recomputed
  - SUBMITTED roster -> RECALLED
  - ACTIVE entry -> WITHDRAWN
  - SCHEDULED games -> CANCELLED
- method: POST
  path: /leagues/{leagueId}/boundary-waivers
  description: Request a boundary/safety/cutoff waiver; guarded by OCC on League.version (expected_league_version)
  roles:
  - LeagueAdministrator
  code: 201
  input:
  - player_id
  - waiver_type
  - reason
  - valid_from
  - valid_until
  - target_division_id?
  - expected_league_version
  output: BoundaryWaiver
  side_effects:
  - League.version increments by 1
- method: GET
  path: /leagues/{leagueId}/boundary-waivers
  description: List boundary waivers of a league
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  - player_id?
  - target_division_id?
  output: BoundaryWaiver[]
  side_effects: []
- method: POST
  path: /leagues/{leagueId}/boundary-waivers/{waiverId}/decide
  description: Approve, deny, or revoke a waiver; APPROVE enforces the half-open overlap rule per (player, waiver_type) and applies target_division_id to the player
  roles:
  - DistrictAdministrator
  code: 200
  input:
  - action
  output: BoundaryWaiver
  side_effects:
  - 'on APPROVE with target_division_id: Player.division_id := target_division_id'
- method: POST
  path: /leagues/{leagueId}/volunteers
  description: Register a volunteer (REGISTERED)
  roles:
  - LeagueAdministrator
  code: 201
  input:
  - full_name
  - role_title
  output: Volunteer
  side_effects: []
- method: GET
  path: /leagues/{leagueId}/volunteers
  description: List volunteers of a league
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  output: Volunteer[]
  side_effects: []
- method: POST
  path: /leagues/{leagueId}/volunteers/{volunteerId}/screenings
  description: Submit a background screening; the screening starts SUBMITTED with auto_flagged set when the offense_category is severe (VIOLENT_FELONY, SEXUAL_OFFENSE, CHILD_ABUSE)
  roles:
  - LeagueAdministrator
  code: 201
  input:
  - offense_category
  - valid_from
  - valid_through
  output: BackgroundScreening
  side_effects:
  - auto_flagged computed from offense_category
- method: POST
  path: /leagues/{leagueId}/volunteers/{volunteerId}/screenings/{screeningId}/adjudicate
  description: Adjudicate a SUBMITTED screening; APPROVE enforces season-window containment then clears the volunteer
  roles:
  - DistrictAdministrator
  code: 200
  input:
  - action
  output: BackgroundScreening
  side_effects:
  - 'APPROVE: screening -> CLEARED, Volunteer -> CLEARED'
  - 'DISQUALIFY: screening -> DISQUALIFIED, Volunteer -> DISQUALIFIED'
- method: GET
  path: /leagues/{leagueId}/volunteers/{volunteerId}/screenings
  description: List a volunteer's screenings
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  output: BackgroundScreening[]
  side_effects: []
- method: POST
  path: /leagues/{leagueId}/insurance-certificates
  description: Record an insurance certificate (ACTIVE until the clock passes coverage_end)
  roles:
  - DistrictAdministrator
  code: 201
  input:
  - carrier_name
  - coverage_start
  - coverage_end
  output: InsuranceCertificate
  side_effects: []
- method: GET
  path: /leagues/{leagueId}/insurance-certificates
  description: List insurance certificates of a league
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  output: InsuranceCertificate[]
  side_effects: []
- method: POST
  path: /leagues/{leagueId}/all-star-rosters
  description: Create an all-star roster for a division (status OPEN)
  roles:
  - LeagueAdministrator
  code: 201
  input:
  - division_id
  output: AllStarRoster
  side_effects:
  - season_year copied from league
  - selections initialized to []
  - roster_size 0
- method: GET
  path: /leagues/{leagueId}/all-star-rosters
  description: List all-star rosters of a league
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  - division_id?
  output: AllStarRoster[]
  side_effects: []
- method: POST
  path: /leagues/{leagueId}/all-star-rosters/{rosterId}/selections
  description: Add a player selection to an OPEN or RECALLED roster; player must be ELIGIBLE, division must match, participation_pct >= 60.00, roster_size must stay <= 5 (benchmark scale for the real 12..14
    roster window)
  roles:
  - LeagueAdministrator
  code: 201
  input:
  - player_id
  output: AllStarRoster
  side_effects:
  - selection appended with status ACTIVE
  - roster_size recomputed
- method: POST
  path: /leagues/{leagueId}/all-star-rosters/{rosterId}/submit
  description: Submit an OPEN or RECALLED roster for tournament eligibility; requires roster_size >= 3 and every selected player ELIGIBLE with participation_pct >= 60.00
  roles:
  - LeagueAdministrator
  code: 200
  input: []
  output: AllStarRoster
  side_effects:
  - status -> SUBMITTED
- method: POST
  path: /leagues/{leagueId}/tournament-entries
  description: Enter a SUBMITTED roster into a tournament level; non-DISTRICT levels require an ADVANCED entry at the preceding level in the same league; locks the roster
  roles:
  - TournamentDirector
  code: 201
  input:
  - roster_id
  - level
  output: TournamentEntry
  side_effects:
  - elimination_format computed from level
  - roster -> LOCKED
- method: GET
  path: /leagues/{leagueId}/tournament-entries
  description: List tournament entries of a league
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  - roster_id?
  output: TournamentEntry[]
  side_effects: []
- method: POST
  path: /tournament-entries/{entryId}/games
  description: Schedule a game for an ACTIVE entry; opponent_entry_id optional (must be an ACTIVE entry at the same level when provided)
  roles:
  - TournamentDirector
  code: 201
  input:
  - opponent_entry_id?
  output: TournamentGame
  side_effects:
  - play_status SCHEDULED
  - protest_status NONE
  - recorded_pitch_total 0
- method: GET
  path: /tournament-entries/{entryId}/games
  description: List games of an entry
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  - opponent_entry_id?
  output: TournamentGame[]
  side_effects: []
- method: POST
  path: /tournament-entries/{entryId}/games/{gameId}/pitching-appearances
  description: Record a pitching appearance; auto-starts a SCHEDULED game; enforces roster membership, pitch maximum, and rest-day gate; recomputes recorded_pitch_total
  roles:
  - OfficialScorer
  code: 201
  input:
  - player_id
  - pitches_thrown
  output: PitchingAppearance
  side_effects:
  - SCHEDULED game -> IN_PROGRESS with game_date set
  - rest_days_required and eligible_again_on computed (provisional variant)
  - game.recorded_pitch_total recomputed
  - game.version increments by 1
- method: GET
  path: /tournament-entries/{entryId}/games/{gameId}/pitching-appearances
  description: List pitching appearances of a game
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  - player_id?
  output: PitchingAppearance[]
  side_effects: []
- method: POST
  path: /tournament-entries/{entryId}/games/{gameId}/finalize
  description: Finalize an IN_PROGRESS game with the official score; OCC via expected_game_version; applies optional scorebook_corrections [{appearance_id, official_pitches}] before computing result and
    elimination
  roles:
  - TournamentDirector
  code: 200
  input:
  - our_score
  - opponent_score
  - expected_game_version
  - scorebook_corrections?
  output: TournamentGame
  side_effects:
  - play_status -> FINAL
  - result computed
  - corrections set official_pitches and recompute rest (official variant)
  - recorded_pitch_total recomputed
  - entry losses_count and possible ELIMINATED cascade
  - game.version increments by 1
- method: POST
  path: /tournament-entries/{entryId}/games/{gameId}/protests
  description: File a protest on an IN_PROGRESS or FINAL game whose protest_status is NONE
  roles:
  - TournamentDirector
  code: 201
  input:
  - protest_type
  - grounds
  - target_player_id?
  output: Protest
  side_effects:
  - game.protest_status -> OPEN
- method: GET
  path: /tournament-entries/{entryId}/games/{gameId}/protests
  description: List protests of a game
  roles:
  - DistrictAdministrator
  - LeagueAdministrator
  - TournamentDirector
  - OfficialScorer
  code: 200
  input:
  - limit?
  - offset?
  - player_id?
  output: Protest[]
  side_effects: []
- method: POST
  path: /tournament-entries/{entryId}/games/{gameId}/protests/{protestId}/resolve
  description: 'Resolve a FILED protest: UPHOLD (branching effects per protest_type), OVERTURN (result stands), WITHDRAW'
  roles:
  - TournamentDirector
  code: 200
  input:
  - action
  output: Protest
  side_effects:
  - 'UPHELD RULE_INTERPRETATION: FINAL game reopens, result voided, elimination reversed'
  - 'UPHELD ELIGIBILITY_CHALLENGE: target player''s appearances in this game REVERSED'
  - game.protest_status -> RESOLVED (reset to NONE on reopen)
- method: POST
  path: /tournament-entries/{entryId}/advance
  description: Advance an ACTIVE entry that has a FINAL WIN, losses below the elimination limit, and no OPEN protest on any of its games
  roles:
  - TournamentDirector
  code: 200
  input: []
  output: TournamentEntry
  side_effects:
  - status -> ADVANCED
- method: POST
  path: /_clock/set_current_utc
  description: 'Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads that default and never falls back to wall-clock time. Setting the clock sweeps: CHARTERED
    leagues whose latest approved season lapsed past (Y+1)-03-31 -> SUSPENDED (with cascade), and ACTIVE insurance certificates past coverage_end -> EXPIRED.'
  roles:
  - DistrictAdministrator
  code: 200
  input:
  - to_iso8601
  output: null
  side_effects:
  - charter lapse sweep with League->Division->TournamentEntry->TournamentGame cascade
  - insurance expiry sweep
