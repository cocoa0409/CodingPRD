          A second, differently-triggered depth-4 chain rooted at POST
          /take-back-notices/{noticeId}/offset-applications: the TAKE_BACK_OFFSET
          posting (hop 1) is what drives the CreditBalance offset_cents recompute
          (hop 2); that recompute is what flips its status ATTRIBUTED ->
          RESOLVED_BY_OFFSET (hop 3); and that status flip is what moves the
          MedicareRepaymentObligation OPEN -> SATISFIED_BY_OFFSET (hop 4).
