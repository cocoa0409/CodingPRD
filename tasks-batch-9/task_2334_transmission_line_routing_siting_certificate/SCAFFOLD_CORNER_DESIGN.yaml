              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RIGHT_OF_WAY_HOLD"
            - "SitingApplication.${app}.suspension_days == 90"
            - "SitingApplication.${app}.decision_deadline_at == 2027-11-29T00:00:00Z"
            - "Project.${proj}.slack_days == 124"
            - "Project.${proj}.schedule_posture == AT_RISK"
            - "Project.${proj}.right_of_way_hold == true"
            - "EasementTract.${tract1}.offer_round == 2"
            - "EasementTract.${tract1}.acquisition_status == OFFERED"
            - "EasementTract.${tract1}.court_docket_number == null"

      - name: award_without_value_diminution_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_NO_VALUE_DIMINUTION].check
          - calculations.easement_compensation.variants
        distinguishing_aspect: "The CONDEMNATION_AWARD variant is a before-and-after measure, so a tract whose before_value_cents equals its after_value_cents cannot produce an award: the court record is refused at priority 45 with ERR_NO_VALUE_DIMINUTION (422), award_cents stays null and the tract remains CONDEMNATION_FILED."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with eminent domain authorized"
            - "Tract B-207-04 filed for condemnation after two rejected offers, with before_value_cents == after_value_cents == 90000000"
          setup_api_calls: *cCERT
          trigger:
            - *c32
            - call: "POST /siting/easement-tracts"
              payload: { project_id: "${proj}", segment_id: "${seg2}", landowner_id: "${lo1}", parcel_number: "B-207-04", acres: 8.00, per_acre_value_cents: 300000, easement_factor: 0.50, structure_damages_cents: 0, before_value_cents: 90000000, after_value_cents: 90000000, severance_damages_cents: 0 }
              as: Developer
              as_user_id: "dev-nora"
              captures: { tract2: "$.data.id", t2v: "$.data.version" }
            - call: "POST /siting/easement-tracts/${tract2}/offers"
              payload: { expected_tract_version: "${t2v}", offer_note: "First offer" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { t2v2: "$.data.version" }
            - call: "POST /siting/easement-tracts/${tract2}/offer-response"
              payload: { response: "REJECT", response_note: "Refused" }
              as: Landowner
              as_user_id: "${lo1}"
              captures: { t2v3: "$.data.version" }
            - call: "POST /siting/easement-tracts/${tract2}/offers"
              payload: { expected_tract_version: "${t2v3}", offer_note: "Second offer" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { t2v4: "$.data.version" }
            - call: "POST /siting/easement-tracts/${tract2}/condemnation"
              payload: { court_docket_number: "BOO-CV-2026-311", deposit_cents: 1200000 }
              as: Developer
              as_user_id: "dev-nora"
            - call: "POST /siting/easement-tracts/${tract2}/award"
              payload: { award_note: "Commissioners report filed" }
              as: CommissionStaff
              as_user_id: "staff-lin"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_NO_VALUE_DIMINUTION"
            - "EasementTract.${tract2}.acquisition_status == CONDEMNATION_FILED"
            - "EasementTract.${tract2}.award_cents == null"
            - "EasementTract.${tract2}.committed_cents == 0"
            - "EasementTract.${tract2}.deposit_cents == 1200000"

      - name: activity_inside_the_seasonal_blackout_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_SEASONAL_BLACKOUT_VIOLATION].check
          - entities.CertificateCondition.fields.blackout_start_mmdd
        distinguishing_aspect: "Conditional validation on two rows at once: the ACTIVE SEASONAL_BLACKOUT condition runs 04-01..07-15 and segment 1 carries habitat_blackout true, so a 2027-05-01..2027-05-10 window is refused at priority 20 with ERR_SEASONAL_BLACKOUT_VIOLATION (422) and no crew is committed."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with condition ENV-BLACKOUT-1 ACTIVE for 04-01..07-15"
            - "Segment 1 has habitat_blackout true and committed_crew_count 0"
          setup_api_calls: *cCERT
          trigger:
            - call: "POST /siting/construction-activities"
              payload: { certificate_id: "${cert}", segment_id: "${seg1}", activity_kind: "CLEARING", crew_count: 6, window_start_at: "2027-05-01T00:00:00Z", window_end_at: "2027-05-10T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_SEASONAL_BLACKOUT_VIOLATION"
            - "ConstructionActivity count for certificate ${cert} == 0"
            - "RouteSegment.${seg1}.committed_crew_count == 0"
            - "RouteSegment.${seg1}.construction_state == PENDING"
            - "CertificateCondition.${cond1}.status == ACTIVE"

      - name: blackout_window_on_a_non_habitat_segment_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[ERR_SEASONAL_BLACKOUT_VIOLATION].check
          - entities.RouteSegment.fields.habitat_blackout
        distinguishing_aspect: "The negative half of the same conditional rule: the identical May 2027 window on segment 2, which has habitat_blackout false, is accepted (201) and commits 6 crew, proving the blackout is keyed on the segment flag rather than on the calendar alone."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with condition ENV-BLACKOUT-1 ACTIVE for 04-01..07-15"
            - "Segment 2 has habitat_blackout false and crew_capacity 12"
          setup_api_calls: *cCERT
          trigger:
            - call: "POST /siting/construction-activities"
              payload: { certificate_id: "${cert}", segment_id: "${seg2}", activity_kind: "CLEARING", crew_count: 6, window_start_at: "2027-05-01T00:00:00Z", window_end_at: "2027-05-10T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { act_ok: "$.data.id" }
          assert:
            - "response.status == 201"
            - "ConstructionActivity.${act_ok}.status == SCHEDULED"
            - "ConstructionActivity.${act_ok}.crew_count == 6"
            - "RouteSegment.${seg2}.committed_crew_count == 6"
            - "RouteSegment.${seg2}.construction_state == PENDING"
            - "Certificate.${cert}.posture == ACTIVE"

      - name: activity_creation_under_stop_work_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_CERTIFICATE_NOT_ACTIVE].check
          - calculations.certificate_compliance_index.formula
        distinguishing_aspect: "Posture, not status, is the construction gate: one SEVERE finding on the weight-4 blackout condition deducts 48.00 and drops compliance_index_rolling to 52.00, so the certificate is still ISSUED but STOP_WORK and new activities fail at priority 14 with ERR_CERTIFICATE_NOT_ACTIVE (409)."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with three conditions"
            - "One OPEN SEVERE nonconformance against ENV-BLACKOUT-1 (severity_weight 4)"
          setup_api_calls: *cCERT
          trigger:
            - &c50
              call: "POST /siting/nonconformances"
              payload: { certificate_id: "${cert}", condition_id: "${cond1}", severity: "SEVERE", observation: "Clearing inside the seasonal habitat blackout" }
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
              captures: { ncr1: "$.data.id" }
            - call: "POST /siting/construction-activities"
              payload: { certificate_id: "${cert}", segment_id: "${seg2}", activity_kind: "STRINGING", crew_count: 5, window_start_at: "2027-08-02T00:00:00Z", window_end_at: "2027-08-12T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CERTIFICATE_NOT_ACTIVE"
            - "Nonconformance.${ncr1}.deduction_points == 48.00"
            - "Certificate.${cert}.compliance_index_rolling == 52.00"
            - "Certificate.${cert}.compliance_index_cumulative == 52.00"
            - "Certificate.${cert}.posture == STOP_WORK"
            - "Certificate.${cert}.status == ISSUED"
            - "ConstructionActivity count for certificate ${cert} == 0"

      - name: waiver_on_a_revoked_certificate_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_CERTIFICATE_REVOKED].check
          - calculations.certificate_compliance_index.formula
        distinguishing_aspect: "Two SEVERE findings on weight-4 conditions deduct 48.00 each, taking compliance_index_cumulative to 4.00 — below the 25.00 revocation floor — so the waiver is refused one priority earlier than the ACTIVE-posture gate, at 13 with ERR_CERTIFICATE_REVOKED (409), and the monitoring condition stays ACTIVE."
        test_recipe:
          setup:
            - "Certificate ISSUED with conditions ENV-BLACKOUT-1 (weight 4), CUL-MON-1 (weight 2) and ENG-CREW-1 (weight 4)"
            - "Two OPEN SEVERE findings, one against ENV-BLACKOUT-1 and one against ENG-CREW-1"
          setup_api_calls: *cCERT
          trigger:
            - *c50
            - call: "POST /siting/nonconformances"
              payload: { certificate_id: "${cert}", condition_id: "${cond3}", severity: "SEVERE", observation: "Crew count exceeded the certificate limit for six shifts" }
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
              captures: { ncr2: "$.data.id" }
            - call: "POST /siting/certificate-conditions/${cond2}/waiver"
              payload: { waiver_reason: "Monitoring folded into the environmental inspector scope" }
              as: CommissionStaff
              as_user_id: "staff-lin"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CERTIFICATE_REVOKED"
            - "Nonconformance.${ncr2}.deduction_points == 48.00"
            - "Certificate.${cert}.compliance_index_cumulative == 4.00"
            - "Certificate.${cert}.compliance_index_rolling == 4.00"
            - "Certificate.${cert}.posture == REVOKED"
            - "CertificateCondition.${cond2}.status == ACTIVE"

      - name: activity_start_with_underfunded_escrow_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_ESCROW_UNDERFUNDED].check
          - calculations.mitigation_escrow_requirement.formula
        distinguishing_aspect: "The start-time fiscal gate compares Project.escrow_funded_cents against Certificate.escrow_required_cents (533000000 for a 480000000 base with three conditions), so a 100000000 deposit fails at priority 50 with ERR_ESCROW_UNDERFUNDED (402) even though the permit and easement gates at 21 and 46 are both satisfied."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with escrow_required_cents 533000000"
            - "Tract H-104-22 on segment 1 AGREED, so the easement gate passes; segment 1 needs no federal permit"
            - "Project escrow funded with 100000000 cents only"
            - "A SCHEDULED crew-6 CLEARING activity on segment 1 for 2027-08-02..2027-08-12, clock at 2027-08-02"
          setup_api_calls: *cCERT
          trigger:
            - *c32
            - *c41
            - *c42
            - *c43
            - call: "POST /siting/projects/${proj}/escrow-deposits"
              payload: { amount_cents: 100000000, reference: "ESCROW-PARTIAL" }
              as: Developer
              as_user_id: "dev-nora"
            - &c47
              call: "POST /siting/construction-activities"
              payload: { certificate_id: "${cert}", segment_id: "${seg1}", activity_kind: "CLEARING", crew_count: 6, window_start_at: "2027-08-02T00:00:00Z", window_end_at: "2027-08-12T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { act1: "$.data.id" }
            - &c48
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-02T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
            - call: "POST /siting/construction-activities/${act1}/start"
              payload: { start_note: "Mobilizing" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 402"
            - "response.data.error_id == ERR_ESCROW_UNDERFUNDED"
            - "Certificate.${cert}.escrow_required_cents == 533000000"
            - "Project.${proj}.escrow_funded_cents == 100000000"
            - "ConstructionActivity.${act1}.status == SCHEDULED"
            - "ConstructionActivity.${act1}.started_at == null"
            - "RouteSegment.${seg1}.construction_state == PENDING"
            - "Project.${proj}.stage == CERTIFICATED"

      - name: activity_completion_with_an_open_finding_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_OPEN_NONCONFORMANCE].check
          - endpoints[POST /siting/construction-activities/{activityId}/completion].side_effects
        distinguishing_aspect: "The same rule guards two endpoints: with one OPEN MINOR finding (4.80 points, rolling 95.20, posture still ACTIVE) the activity cannot be completed — ERR_OPEN_NONCONFORMANCE (409) at priority 49 — so committed_crew_count is not released."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE, escrow funded 600000000, tract on segment 1 AGREED"
            - "Crew-6 CLEARING activity on segment 1 IN_PROGRESS since 2027-08-02"
            - "One OPEN MINOR finding against CUL-MON-1 (severity_weight 2)"
          setup_api_calls: *cCERT
          trigger:
            - *c32
            - *c41
            - *c42
            - *c43
            - *c45
            - *c47
            - *c48
            - &c49
              call: "POST /siting/construction-activities/${act1}/start"
              payload: { start_note: "Crew mobilized" }
              as: Developer
              as_user_id: "dev-nora"
            - call: "POST /siting/nonconformances"
              payload: { certificate_id: "${cert}", condition_id: "${cond2}", severity: "MINOR", observation: "Cultural monitor absent for one shift", activity_id: "${act1}" }
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
              captures: { ncr_min: "$.data.id" }
            - call: "POST /siting/construction-activities/${act1}/completion"
              payload: { completion_note: "Clearing finished" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OPEN_NONCONFORMANCE"
            - "Nonconformance.${ncr_min}.deduction_points == 4.80"
            - "Certificate.${cert}.compliance_index_rolling == 95.20"
            - "Certificate.${cert}.compliance_index_cumulative == 95.20"
            - "Certificate.${cert}.posture == ACTIVE"
            - "ConstructionActivity.${act1}.status == IN_PROGRESS"
            - "ConstructionActivity.${act1}.completed_at == null"
            - "RouteSegment.${seg1}.committed_crew_count == 6"
            - "RouteSegment.${seg1}.construction_state == ACTIVE"
            - "Project.${proj}.stage == CONSTRUCTION"

      - name: closeout_below_the_cumulative_floor_rejected
        claim_type: violation_to_error
        grounds:
          - validations[ERR_COMPLIANCE_TOO_LOW].check
          - calculations.certificate_compliance_index.variants
        distinguishing_aspect: "Correcting the SEVERE finding restores half the penalty to the rolling index (76.00, so posture is ACTIVE again and the priority 14 gate passes) but nothing to the cumulative index (52.00), so closeout fails at priority 47 with ERR_COMPLIANCE_TOO_LOW (422) — ahead of the incomplete-segment check at 48."
        test_recipe:
          setup:
            - "Certificate ISSUED with one CORRECTED SEVERE finding against ENV-BLACKOUT-1"
            - "compliance_index_rolling 76.00, compliance_index_cumulative 52.00, posture ACTIVE"
          setup_api_calls: *cCERT
          trigger:
            - *c50
            - call: "POST /siting/nonconformances/${ncr1}/correction"
              payload: { corrective_action: "Habitat restoration completed and monitor sign-off obtained" }
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
            - call: "POST /siting/certificates/${cert}/closeout"
              payload: { closeout_note: "Requesting release" }
              as: CommissionStaff
              as_user_id: "staff-lin"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_COMPLIANCE_TOO_LOW"
            - "Nonconformance.${ncr1}.status == CORRECTED"
            - "Certificate.${cert}.compliance_index_rolling == 76.00"
            - "Certificate.${cert}.compliance_index_cumulative == 52.00"
            - "Certificate.${cert}.posture == ACTIVE"
            - "Certificate.${cert}.status == ISSUED"
            - "CertificateCondition.${cond1}.status == ACTIVE"
            - "Project.${proj}.stage == CERTIFICATED"

      - name: state_gate_outranks_the_filing_fee_gate
        claim_type: priority_ordering
        grounds:
          - validations[ERR_ROUTE_NOT_NOMINATED].priority
          - validations[ERR_FILING_FEE_INSUFFICIENT].priority
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_gate_beats_fiscal_gate_on_application_filing_rejected
          rationale: "The named §1.8 instance violates both rules in one call and asserts that the priority 12 state error is returned instead of the priority 50 fiscal error."

      - name: permit_gate_outranks_easement_and_escrow_gates
        claim_type: priority_ordering
        grounds:
          - validations[ERR_FEDERAL_PERMIT_MISSING].priority
          - validations[ERR_EASEMENT_NOT_ACQUIRED].priority
          - validations[ERR_ESCROW_UNDERFUNDED].priority
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / permit_safety_beats_easement_referential_on_activity_start_rejected
          rationale: "The named §1.8 instance violates all three start-time rules at once and asserts the priority 21 safety error wins over the referential and fiscal errors."

      - name: authorization_outranks_reference_existence
        claim_type: priority_ordering
        grounds:
          - validations[ERR_UNAUTHORIZED].priority
          - validations[ERR_REFERENCE_NOT_FOUND].priority
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / role_check_beats_reference_existence_unauthorized
          rationale: "The named §1.8 instance posts a nonconformance with a bad role and a dangling FK and asserts the priority 2 authorization error."

      - name: hearing_window_conflict_on_the_same_docket
        claim_type: violation_to_error
        grounds:
          - validations[ERR_HEARING_WINDOW_CONFLICT].check
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hearing_window_buffered_closed_interval_touching_rejected
          rationale: "The named §1.8 instance asserts the buffered closed-interval semantics of this rule at both the rejecting and the accepting minute."

      - name: crew_capacity_exceeded_in_aggregate
        claim_type: violation_to_error
        grounds:
          - validations[ERR_CREW_CAPACITY_EXCEEDED].check
        excluded_because:
          difficulty_instance: resource_temporal_overlap / activity_half_open_window_touching_allowed_overlap_rejected
          rationale: "The named §1.8 instance asserts the aggregate half-open-window crew rule, including the effective limit min(crew_capacity, crew_limit)."

      - name: easement_not_acquired_blocks_activity_start
        claim_type: violation_to_error
        grounds:
          - validations[ERR_EASEMENT_NOT_ACQUIRED].check
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / activity_start_blocked_by_unacquired_sibling_tract_state
          rationale: "The named §1.8 instance asserts this error from the state of a sibling tract on the same segment."

      - name: uncertified_study_blocks_application_filing
        claim_type: violation_to_error
        grounds:
          - validations[ERR_STUDY_NOT_SUFFICIENT].check
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / application_filing_blocked_by_uncertified_study_state
          rationale: "The named §1.8 instance asserts this error and then shows the same call succeeding once the study is certified."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: projects_listing_filtered_by_state_and_paginated
        claim_type: standard_crud
        grounds:
          - endpoints[GET /siting/projects].input
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list read honours jurisdiction_state plus limit/offset and reports meta.total_count over the filtered set (2) with has_more false on the last page, while data carries a single row."
        test_recipe:
          setup:
            - "Two KY projects exist"
          setup_api_calls:
            - *c01
            - *c33
          trigger:
            - call: "GET /siting/projects"
              payload: { jurisdiction_state: "KY", limit: 1, offset: 1 }
              as: CommissionStaff
              as_user_id: "staff-lin"
              captures: { page_row: "$.data[0].id" }
          assert:
            - "response.status == 200"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"
            - "response.data length == 1"

      - name: logical_clock_drives_the_published_comment_window
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc].side_effects
          - endpoints[POST /siting/routes/{routeId}/publication].side_effects
        distinguishing_aspect: "comment_window_closes_at is derived from the logical clock, not from wall time: with the clock moved to 2026-09-15 a 90-day window closes 2026-12-14, and 90 is accepted as the upper bound of comment_window_days."
        test_recipe:
          setup:
            - "Route A CONSTRAINT_MAPPED"
            - "Logical clock set to 2026-09-15T00:00:00Z"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
          trigger:
            - call: "POST /siting/routes/${routeA}/publication"
              payload: { comment_window_days: 90 }
              as: Developer
              as_user_id: "dev-nora"
          assert:
            - "response.status == 201"
            - "Route.${routeA}.status == PUBLISHED_FOR_COMMENT"
            - "Route.${routeA}.comment_window_days == 90"
            - "Route.${routeA}.comment_window_closes_at == 2026-12-14T00:00:00Z"

      - name: escrow_deposits_accumulate_on_the_conservation_triple
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /siting/projects/{projectId}/escrow-deposits].side_effects
          - entities.Project.fields.escrow_funded_cents
        distinguishing_aspect: "Two deposits add into both escrow_funded_cents and escrow_balance_cents (700000000 each) while escrow_disbursed_cents stays 0, so the funded == balance + disbursed invariant holds with nothing yet disbursed."
        test_recipe:
          setup:
            - "One project with all escrow counters at 0"
          setup_api_calls:
            - *c01
          trigger:
            - call: "POST /siting/projects/${proj}/escrow-deposits"
              payload: { amount_cents: 400000000, reference: "ESCROW-A" }
              as: Developer
              as_user_id: "dev-nora"
            - call: "POST /siting/projects/${proj}/escrow-deposits"
              payload: { amount_cents: 300000000, reference: "ESCROW-B" }
              as: Developer
              as_user_id: "dev-nora"
          assert:
            - "response.status == 201"
            - "Project.${proj}.escrow_funded_cents == 700000000"
            - "Project.${proj}.escrow_balance_cents == 700000000"
            - "Project.${proj}.escrow_disbursed_cents == 0"

      - name: comment_dismissal_releases_the_material_count
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /siting/public-comments/{commentId}/disposition].side_effects
          - state_machines.PublicComment.RECEIVED_to_DISMISSED
        distinguishing_aspect: "A written disposition is the other way out of RECEIVED besides refinement: DISMISS records the note, moves the comment to DISMISSED and decrements the segment's material_comment_count to 0 without touching the route's status or refinement_round."
        test_recipe:
          setup:
            - "Route A PUBLISHED_FOR_COMMENT with one MATERIAL comment RECEIVED on segment 1"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c18
            - *c37
          trigger:
