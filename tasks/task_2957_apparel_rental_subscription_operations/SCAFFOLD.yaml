    side_effects: []
  - method: POST
    path: "/reservations/{reservation_id}/release"
    description: "Member gives up a reservation before dispatch"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: ["a MATCHED reservation -> RELEASED and its unit RESERVED -> IN_STOCK", "a WAITLISTED reservation -> CANCELLED and remaining waitlist_positions are compacted", "waitlist promotion re-evaluated for the style", "member.units_out_count recomputed"]
  - method: POST
