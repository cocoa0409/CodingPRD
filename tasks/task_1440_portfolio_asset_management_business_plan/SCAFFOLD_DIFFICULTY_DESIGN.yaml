            - "st0 == DRAFT, st1 == SUBMITTED, st2 == REJECTED, st3 == SUBMITTED, st4 == APPROVED"
            - "BusinessPlan.${pl1}.version == pl_v0 + 4 after the full loop (submit, reject, resubmit, approve)"
            - "Asset.${a1}.current_plan_id == ${pl1} after approval"

