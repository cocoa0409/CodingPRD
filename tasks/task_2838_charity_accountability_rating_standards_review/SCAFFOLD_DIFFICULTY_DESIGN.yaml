# =============================================================================
# Section 1.8: Scaffold Difficulty Design (Test Targeting Index)
# Charity Accountability Rating & Standards Review
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml sections
# 1.1-1.7. Deleting this file leaves the declared behaviour identical.
#
# Fixture conventions used throughout (all literals, no wall-clock dependence):
#   * the logical clock starts at 2026-08-01T00:00:00Z
#   * methodology "M1" weights 0.40 / 0.25 / 0.20 / 0.15, floor 40.0
#   * canonical PUBLIC_CHARITY filings give program_expense_ratio 0.7500,
#     fundraising_efficiency 0.1867, months_of_reserve 7.20 -> FINANCIAL_HEALTH
#     raw 29 of 40 -> normalized 72.50
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_composite_diverge_on_zero_completeness_impact
        grounds:
          - calculations.composite_score_with_penalty
          - calculations.dimension_data_completeness
          - calculations.dimension_raw_points
          - entities.RatingCycle.fields.weighted_sum_provisional
          - entities.RatingCycle.fields.provisional_grade
          - entities.RatingCycle.fields.weighted_sum_final
          - entities.RatingCycle.fields.grade
          - entities.DimensionScore.fields.weight_applied
        distinguishing_aspect: |
          This is the RatingCycle/DimensionScore scoring domain. The two variants
          differ in their INCLUSION SET and weight renormalisation, and the
          divergence flips both the penalty rate (band C rate 1.00 provisional
          versus band B rate 1.50 final) and the published grade
          (NEEDS_IMPROVEMENT versus MEETS_STANDARDS) from one identical set of
          four DimensionScore rows.
        test_recipe:
          setup:
            - "Methodology M1 is ADOPTED and effective, logical clock at 2026-09-01T00:00:00Z"
            - "Organization Harbor Relief Fund is a PUBLIC_CHARITY with VALIDATED AUDITED_STATEMENT filings for FY2025, FY2024 and FY2023"
            - "RatingCycle for FY2025 is pinned to M1 and has an EVALUATED GovernanceProfile with 7 standards MET and CEO_COMP_REVIEW NOT_MET"
            - "The GovernanceProfile reports no impact report, zero outcome measures and no third-party evaluation, so the IMPACT dimension has data_completeness_pct 0.00"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "AUDITED_STATEMENT", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, joint_cost_allocated_cents: 500000, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2025: $.data.id }
            - call: "GET /organizations/${org1}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { org1_v2: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2024, source_kind: "AUDITED_STATEMENT", total_expense_cents: 6000000, program_expense_cents: 4500000, fundraising_expense_cents: 1000000, admin_expense_cents: 500000, contributions_cents: 5000000, total_revenue_cents: 6500000, net_assets_cents: 3000000, total_liabilities_cents: 1000000, expected_organization_version: "${org1_v2}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2024: $.data.id }
            - call: "GET /organizations/${org1}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { org1_v3: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2023, source_kind: "AUDITED_STATEMENT", total_expense_cents: 4000000, program_expense_cents: 2800000, fundraising_expense_cents: 900000, admin_expense_cents: 300000, contributions_cents: 3000000, total_revenue_cents: 4200000, net_assets_cents: 2000000, total_liabilities_cents: 800000, expected_organization_version: "${org1_v3}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2023: $.data.id }
            - call: "POST /filing-records/${f2025}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /filing-records/${f2024}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /filing-records/${f2023}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c1: $.data.id }
            - call: "POST /governance-profiles"
              payload: { rating_cycle_id: "${c1}", board_member_count: 7, independent_board_member_count: 4, conflict_of_interest_policy_on_file: true, coi_policy_reviewed_at: "2026-03-01T00:00:00Z", board_meetings_last_year: 4, audit_committee_exists: true, whistleblower_policy: true, ceo_compensation_reviewed: false, impact_report_on_file: false, outcome_measures_count: 0, third_party_evaluation_on_file: false }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { g1: $.data.id }
            - call: "POST /governance-profiles/${g1}/evaluate"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /rating-cycles/${c1}/score"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "GET /rating-cycles/${c1}/score-breakdown"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
          assert:
            - "RatingCycle.${c1}.status == SCORED"
            - "RatingCycle.${c1}.data_completeness_pct == 85.00"
            - "RatingCycle.${c1}.weighted_sum_provisional == 70.88"
            - "RatingCycle.${c1}.provisional_composite_score == 69.88"
            - "RatingCycle.${c1}.provisional_grade == NEEDS_IMPROVEMENT"
            - "RatingCycle.${c1}.weighted_sum_final == 83.38"
            - "RatingCycle.${c1}.final_composite_score == 81.88"
            - "RatingCycle.${c1}.grade == MEETS_STANDARDS"
            - "GET /rating-cycles/${c1}/score-breakdown returns provisional_band == C and provisional_penalty == 1.00"
            - "GET /rating-cycles/${c1}/score-breakdown returns final_band == B and final_penalty == 1.50"
            - "GET /rating-cycles/${c1}/score-breakdown returns final_included_dimensions == [FINANCIAL_HEALTH, ACCOUNTABILITY, TRANSPARENCY]"
            - "The IMPACT DimensionScore of ${c1} has normalized_score == 0.00, data_completeness_pct == 0.00, weight_applied == 0.0000 and weighted_contribution == 0.00"
            - "The FINANCIAL_HEALTH DimensionScore of ${c1} has normalized_score == 72.50, weight_applied == 0.4706 and weighted_contribution == 34.12"
            - "The ACCOUNTABILITY DimensionScore of ${c1} has normalized_score == 87.50, weight_applied == 0.2941 and weighted_contribution == 25.73"
            - "The TRANSPARENCY DimensionScore of ${c1} has normalized_score == 100.00, weight_applied == 0.2353 and weighted_contribution == 23.53"

      - name: complaint_credibility_intake_vs_investigated_crosses_severity_tier
        grounds:
          - calculations.complaint_credibility_score
          - state_machines.Complaint.INTAKE_to_INVESTIGATING
          - state_machines.Complaint.INVESTIGATING_to_SUBSTANTIATED
          - validations[priority=28]
          - entities.Complaint.fields.credibility_variant
          - entities.Complaint.fields.severity_tier
        distinguishing_aspect: |
          This is the Complaint intake domain, a different entity domain from the
          RatingCycle scoring instance. Its two variants differ in the ADJUSTMENT
          TERMS available at each stage (pattern points and finding adjustment
          exist only after investigation), not in an inclusion set, and the
          divergence moves the score across the MEDIUM/HIGH severity boundary,
          which is what raises the admissible penalty cap from 10 to 15.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default"
            - "Organization Harbor Relief Fund is registered and has no RatingCycle at all"
            - "A DONOR complaint alleging MISUSE_OF_FUNDS with 2 corroborating documents has been triaged to INVESTIGATING"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id }
            - call: "POST /complaints"
              payload: { organization_id: "${org1}", complainant_kind: "DONOR", category: "MISUSE_OF_FUNDS", narrative: "Restricted gift spent on unrelated overhead", corroborating_document_count: 2 }
              as: PublicUser
              as_user_id: "donor-1"
              captures: { cp1: $.data.id }
            - call: "POST /complaints/${cp1}/triage"
              payload: { disposition: "INVESTIGATE", triage_note: "credible on its face" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { cred_intake: $.data.credibility_score, tier_intake: $.data.severity_tier, variant_intake: $.data.credibility_variant, due_at: $.data.investigation_due_at }
          trigger:
            - call: "POST /complaints/${cp1}/resolve"
              payload: { finding: "SUBSTANTIATED", penalty_points: 12, finding_note: "records confirm diversion" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
          assert:
            - "${cred_intake} == 76.00"
            - "${tier_intake} == MEDIUM"
            - "${variant_intake} == INTAKE"
            - "${due_at} == 2026-08-31T00:00:00Z"
            - "Complaint.${cp1}.status == SUBSTANTIATED"
            - "Complaint.${cp1}.credibility_score == 86.00"
            - "Complaint.${cp1}.credibility_variant == INVESTIGATED"
            - "Complaint.${cp1}.severity_tier == HIGH"
            - "Complaint.${cp1}.penalty_points_applied == 12"
            - "Complaint.${cp1}.penalized_rating_cycle_id == null"
            - "Organization.${org1}.substantiated_complaint_count == 1"
            - "The same penalty_points of 12 would have been rejected with ERR_PENALTY_POINTS_RANGE had the MEDIUM cap of 10 from the intake variant been applied"

  - rule_id: combinatorial_formula
    instances:
      - name: fundraising_efficiency_pinned_per_year_rounding_order
        grounds:
          - calculations.fundraising_efficiency_3yr
          - calculations.winning_filing_selector
          - calculations.dimension_raw_points
        distinguishing_aspect: |
          Mode (b): a pinned order of operations. The three fiscal years are
          reduced to a per-year ratio FIRST (each rounded to 4 places), then
          re-weighted 3/2/1 over the AVAILABLE-year pool, then term-rounded and
          summed. Pooling the six cent amounts before dividing - the natural
          shortcut - yields 0.1824 instead of 0.1867 on exactly these filings, and
          both land in the same tier only by luck; the test pins the order, not
          the tier.
        test_recipe:
          setup:
            - "Methodology M1 adopted and effective, logical clock at 2026-09-01T00:00:00Z"
            - "Three VALIDATED AUDITED_STATEMENT filings whose per-year fundraising ratios are deliberately unequal: 0.1333 (FY2025), 0.2000 (FY2024), 0.3000 (FY2023)"
            - "A FY2025 RatingCycle pinned to M1 with an EVALUATED GovernanceProfile"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
