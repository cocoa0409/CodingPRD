  - rule_id: compensating_invariant
    instances:
      - name: full_conveyance_conserves_both_interest_totals_on_the_well
        conserved_quantity: "the two ACTIVE-row aggregates of a Well: sum(WellInterest.working_interest_pct) == 1.000000 and sum(WellInterest.net_revenue_interest_pct) == 0.802500, over rows with interest_status == ACTIVE"
        grounds:
          - state_machines.AssignmentTransfer.PPR_WAIVED_to_CLOSED
          - state_machines.WellInterest.ACTIVE_to_SUPERSEDED
          - calculations.bond_coverage_requirement
          - endpoints.POST_/land-admin/assignment-transfers/{transfer_id}/closing
        compensation: |
          Closing an assignment retires the assignor's row and writes the grantee's, so the write is
          a redistribution rather than a creation. The conveyance here is FULL - OB assigns its entire
          0.200000 / 0.150000 - which is the case that breaks naive implementations: the assignor's
          row must leave the ACTIVE set entirely rather than being replaced by a 0.000000 stub, and
          the grantee's brand-new row must carry exactly the retired amounts. Either half done alone
          moves the totals: dropping OB without writing OC leaves the well 0.200000 short of
          1.000000, and writing OC while leaving OB ACTIVE pushes the total to 1.200000, which the
          working-interest ceiling would then reject on the next unrelated write.
