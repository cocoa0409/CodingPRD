            - { call: "POST /api/practices", payload: { name: "P Ma", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-22", name: "Floss", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "RB", promo_kind: "MANUFACTURER_REBATE", eligible_product_ids: ["${c}"], rebate_per_unit_cents: 50, fund_total_cents: 10000, start_date: "2026-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: DistributionAdmin, captures: { promo: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: PracticeManager, as_user_id: "${p}", captures: { o: $.data.id } }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/orders/${o}/deliver", payload: {}, as: DistributionAdmin }
