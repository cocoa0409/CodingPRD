            - { call: "POST /work-orders/${ws}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${ws}/route", payload: { bath_id: "${bs}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${bs}", as: LabChemist, captures: { bs_v1: $.data.version } }
            - { call: "POST /work-orders/${ws}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bs_v1}" }, as: LineOperator, captures: { lrs1: $.data.id } }
            - { call: "POST /load-runs/${lrs1}/complete", as: LineOperator }
            - { call: "POST /work-orders/${ws}/inspections", payload: { thickness_readings_um: [13.0, 14.0, 15.0], defect_type: "NONE" }, as: QCInspector, captures: { ws_disp: $.data.disposition } }
            - { call: "GET /work-orders/${ws}", as: LabChemist, captures: { ws_lot_pending: $.data.status } }
            - { call: "POST /salt-spray-lots", payload: { work_order_id: "${ws}", sample_count: 5, hours_required: 96 }, as: LabChemist, captures: { lot1: $.data.id, lot1_allowed: $.data.allowed_failures } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /salt-spray-lots/${lot1}/evaluate", payload: { panels_failed: 2 }, as: LabChemist, captures: { lot1_res: $.data.result } }
            - { call: "GET /work-orders/${ws}", as: LabChemist, captures: { ws_rej: $.data.status, ws_def: $.data.last_defect_type } }
            - { call: "POST /work-orders/${ws}/start-strip", payload: { strip_method: "CHEMICAL" }, as: LineOperator }
            - { call: "POST /work-orders/${ws}/complete-strip", as: LineOperator, captures: { ws_rc: $.data.rework_count } }
            - { call: "POST /work-orders/${ws}/route", payload: { bath_id: "${bs}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${bs}", as: LabChemist, captures: { bs_v2: $.data.version } }
            - { call: "POST /work-orders/${ws}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bs_v2}" }, as: LineOperator, captures: { lrs2: $.data.id } }
            - { call: "POST /load-runs/${lrs2}/complete", as: LineOperator }
            - { call: "POST /work-orders/${ws}/inspections", payload: { thickness_readings_um: [13.0, 14.0, 15.0], defect_type: "NONE" }, as: QCInspector }
            - { call: "POST /salt-spray-lots", payload: { work_order_id: "${ws}", sample_count: 5, hours_required: 96 }, as: LabChemist, captures: { lot2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: ShopManager }
            - { call: "POST /salt-spray-lots/${lot2}/evaluate", payload: { panels_failed: 1 }, as: LabChemist, captures: { lot2_res: $.data.result } }
            - { call: "GET /work-orders/${ws}", as: LabChemist, captures: { ws_final: $.data.status } }
          assert:
            - "after PASS inspection: status == AWAITING_LOT_TEST; lot1 allowed_failures == 1"
            - "lot1 evaluate with panels_failed 2 (> 1): result == FAILED"
            - "work order cascaded to REJECTED with last_defect_type == LOT_CORROSION (pending_strip true)"
            - "after strip lap: rework_count == 1"
            - "lot2 evaluate at 96 h with panels_failed 1 (<= 1, inclusive): result == PASSED; work order == COMPLETE"

      - name: sulfuric_bath_immune_to_nickel_exceedance
        claim_type: conditional_cascade
        grounds: [state_machines.DischargePermit.ACTIVE_to_EXCEEDED, state_machines.PlatingBath.ACTIVE_to_QUARANTINED]
        distinguishing_aspect: "The exceedance cascade quarantines only baths whose chemistry_family maps to the exceeded analyte: a NICKEL exceedance quarantines the NICKEL bath (and holds its routed order) while the SULFURIC bath and its order are untouched."
        test_recipe:
          setup: ["customer CM; NICKEL bath BNI with routed order WNI; SULFURIC bath BSU with routed order WSU; permit PM NICKEL limit 2.0"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Map Co" }, as: ShopManager, captures: { cm: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "CRS1018", process_type: "PLATE", chemistry_family: "NICKEL", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "PLT-NI", process_type: "PLATE", chemistry_family: "NICKEL", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bni: $.data.id } }
            - { call: "POST /baths/${bni}/titrations", payload: { titrant_volume_ml: 20.0, titrant_normality: 0.1, sample_volume_ml: 11.74 }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-SU", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bsu: $.data.id } }
            - { call: "POST /baths/${bsu}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${cm}", part_number: "PN-NI", alloy_code: "CRS1018", process_type: "PLATE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cm}", captures: { wni: $.data.id } }
            - { call: "POST /work-orders/${wni}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wni}/route", payload: { bath_id: "${bni}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "POST /work-orders", payload: { customer_id: "${cm}", part_number: "PN-SU", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cm}", captures: { wsu: $.data.id } }
            - { call: "POST /work-orders/${wsu}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wsu}/route", payload: { bath_id: "${bsu}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-M", effective_from: "2026-08-01", effective_to: "2026-08-31", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 2.0, monthly_mass_cap_g: 500.0 }] }, as: EHSOfficer, captures: { pm: $.data.id } }
          trigger:
            - { call: "POST /discharge-permits/${pm}/samples", payload: { flow_liters: 1000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 3.0 }] }, as: EHSOfficer }
            - { call: "GET /baths/${bni}", as: LabChemist, captures: { bni_st: $.data.status } }
            - { call: "GET /baths/${bsu}", as: LabChemist, captures: { bsu_st: $.data.status } }
            - { call: "GET /work-orders/${wni}", as: LineOperator, captures: { wni_st: $.data.status } }
            - { call: "GET /work-orders/${wsu}", as: LineOperator, captures: { wsu_st: $.data.status } }
          assert:
            - "NICKEL bath QUARANTINED and its routed order ROUTE_HELD"
            - "SULFURIC bath remains ACTIVE and its routed order remains ROUTED (SULFURIC maps to no analyte)"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: titration_half_up_rounding
        claim_type: precision
        grounds: [calculations.titration_concentration]
        distinguishing_aspect: "1.0 ml x 0.1 N x 49.0 / 8.0 ml = 0.6125 exactly; 3-decimal half-up yields 0.613 (not 0.612 as banker's rounding would give)."
        test_recipe:
          setup: ["bath BT created (SULFURIC)"]
          setup_api_calls:
            - { call: "POST /baths", payload: { bath_code: "ANO-RT", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 0.1, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { brt: $.data.id } }
          trigger:
            - { call: "POST /baths/${brt}/titrations", payload: { titrant_volume_ml: 1.0, titrant_normality: 0.1, sample_volume_ml: 8.0 }, as: LabChemist, captures: { rt_conc: $.data.measured_concentration_g_l } }
            - { call: "GET /baths/${brt}", as: LabChemist, captures: { rt_bath_conc: $.data.current_concentration_g_l } }
          assert:
            - "titration measured_concentration_g_l == 0.613 (round_half_up of 0.6125)"
            - "bath current_concentration_g_l == 0.613"

      - name: dragout_depletion_visible_immediately
        claim_type: correct_result
        grounds: [calculations.dragout_depletion]
        distinguishing_aspect: "Completing a 25 dm2 load depletes concentration by exactly 25 x 0.0008 = 0.020 g/L: 5.000 -> 4.980, visible on the very next GET (immediate consistency, no lag)."
        test_recipe:
          setup: ["order WD2 completed one load on bath BD2 titrated to exactly 5.000"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Drag Co" }, as: ShopManager, captures: { cd2x: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-D2", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bd2: $.data.id } }
            - { call: "POST /baths/${bd2}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${cd2x}", part_number: "PN-D2", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cd2x}", captures: { wd2: $.data.id } }
            - { call: "POST /work-orders/${wd2}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wd2}/route", payload: { bath_id: "${bd2}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${bd2}", as: LabChemist, captures: { bd2_v: $.data.version } }
            - { call: "POST /work-orders/${wd2}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bd2_v}" }, as: LineOperator, captures: { lrd2: $.data.id } }
          trigger:
            - { call: "POST /load-runs/${lrd2}/complete", as: LineOperator }
            - { call: "GET /baths/${bd2}", as: LabChemist, captures: { bd2_conc: $.data.current_concentration_g_l, bd2_used: $.data.amp_hour_used, bd2_res: $.data.amp_hour_reserved } }
          assert:
            - "bath current_concentration_g_l == 4.98 immediately after completion"
            - "amp_hour_used == 25.0 and amp_hour_reserved == 0.0 immediately (reservation moved to used atomically)"

      - name: dose_gate_requires_retitration
        claim_type: input_set_filtering
        grounds: [calculations.dose_concentration, "errors[ERR_DOSE_VERIFICATION_PENDING]", entities.PlatingBath.fields.dose_verification_pending]
        distinguishing_aspect: "A dose raises concentration (4.9 + 80 g / 800 L = 5.000) but sets dose_verification_pending; load start -> ERR_DOSE_VERIFICATION_PENDING until a fresh titration clears the flag."
        test_recipe:
          setup: ["bath BG titrated to 4.900; order WG routed to it"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Gate Co" }, as: ShopManager, captures: { cg: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-G", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bg: $.data.id } }
            - { call: "POST /baths/${bg}/titrations", payload: { titrant_volume_ml: 10.0, titrant_normality: 0.1, sample_volume_ml: 10.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${cg}", part_number: "PN-G", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cg}", captures: { wg: $.data.id } }
            - { call: "POST /work-orders/${wg}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wg}/route", payload: { bath_id: "${bg}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
          trigger:
            - { call: "GET /baths/${bg}", as: LabChemist, captures: { bg_v1: $.data.version } }
            - { call: "POST /baths/${bg}/doses", payload: { chemical_code: "H2SO4", quantity_g: 80.0, expected_bath_version: "${bg_v1}" }, as: LabChemist, captures: { dg_conc: $.data.resulting_concentration_g_l } }
            - { call: "GET /baths/${bg}", as: LabChemist, captures: { bg_pend: $.data.dose_verification_pending, bg_v2: $.data.version } }
            - { call: "POST /work-orders/${wg}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bg_v2}" }, as: LineOperator, captures: { err_gate: $.data.error_id } }
            - { call: "POST /baths/${bg}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "GET /baths/${bg}", as: LabChemist, captures: { bg_pend2: $.data.dose_verification_pending, bg_v3: $.data.version } }
            - { call: "POST /work-orders/${wg}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bg_v3}" }, as: LineOperator, captures: { wg_lr: $.data.status } }
          assert:
            - "dose resulting_concentration_g_l == 5.0 (4.9 + 80/800)"
            - "after dose: dose_verification_pending == true; load start rejected ERR_DOSE_VERIFICATION_PENDING (422)"
            - "after re-titration: dose_verification_pending == false; load start succeeds (RUNNING)"

      - name: dose_not_needed_at_target
        claim_type: violation_to_error
        grounds: [calculations.dose_concentration, "errors[ERR_DOSE_NOT_NEEDED]"]
        distinguishing_aspect: "Dosing is rejected ERR_DOSE_NOT_NEEDED when current concentration equals the target exactly (>= boundary, inclusive); a bath 0.1 below target accepts the dose."
        test_recipe:
          setup: ["bath BH titrated to exactly 5.000 (target 5.0)"]
          setup_api_calls:
            - { call: "POST /baths", payload: { bath_code: "ANO-H", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bh: $.data.id, bh_v: $.data.version } }
            - { call: "POST /baths/${bh}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "GET /baths/${bh}", as: LabChemist, captures: { bh_v1: $.data.version } }
          trigger:
            - { call: "POST /baths/${bh}/doses", payload: { chemical_code: "H2SO4", quantity_g: 10.0, expected_bath_version: "${bh_v1}" }, as: LabChemist, captures: { err_dn: $.data.error_id } }
          assert:
            - "dose at current == target rejected: error_id == ERR_DOSE_NOT_NEEDED (422)"

      - name: month_reset_and_regression
        claim_type: input_set_filtering
        grounds: [calculations.waste_mass_accounting, "errors[ERR_SAMPLE_MONTH_REGRESSION]", entities.DischargePermit.fields.current_month]
        distinguishing_aspect: "A sample from a later calendar month RESETS cumulative_mass_g to just that sample's masses (monthly accounting); a subsequent sample dated in the earlier month is rejected ERR_SAMPLE_MONTH_REGRESSION."
        test_recipe:
          setup: ["permit PMR window [2026-08-01, 2026-12-31], NICKEL limit 10.0 mg/L, cap 1000.0 g"]
          setup_api_calls:
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-R", effective_from: "2026-08-01", effective_to: "2026-12-31", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 10.0, monthly_mass_cap_g: 1000.0 }] }, as: EHSOfficer, captures: { pmr: $.data.id } }
            - { call: "POST /discharge-permits/${pmr}/samples", payload: { flow_liters: 1000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 5.0 }], sampled_at: "2026-08-10T00:00:00Z" }, as: EHSOfficer }
          trigger:
            - { call: "POST /discharge-permits/${pmr}/samples", payload: { flow_liters: 1000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 5.0 }], sampled_at: "2026-09-05T00:00:00Z" }, as: EHSOfficer, captures: { s2_exc: $.data.is_exceedance } }
            - { call: "GET /discharge-permits/${pmr}", as: EHSOfficer, captures: { pmr_month: $.data.current_month, pmr_cum: $.data.cumulative_mass_g } }
            - { call: "POST /discharge-permits/${pmr}/samples", payload: { flow_liters: 1000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 5.0 }], sampled_at: "2026-08-20T00:00:00Z" }, as: EHSOfficer, captures: { err_reg: $.data.error_id } }
          assert:
            - "after the September sample: current_month == '2026-09' and cumulative_mass_g.NICKEL == 5.0 (reset dropped August's 5.0)"
            - "the September sample itself is not an exceedance"
            - "August-dated sample after September: error_id == ERR_SAMPLE_MONTH_REGRESSION (409)"

      - name: cumulative_cap_equality_compliant
        claim_type: correct_result
        grounds: [calculations.waste_mass_accounting]
        distinguishing_aspect: "Monthly cumulative mass is exceedance only when strictly greater than the cap: cumulative exactly == 30.0 g cap is compliant; the next 2.0 g sample (32.0 > 30.0) is the exceedance."
        test_recipe:
          setup: ["permit PC window [2026-08-01, 2026-08-31], NICKEL max 5.0 mg/L, monthly cap 30.0 g"]
          setup_api_calls:
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-C", effective_from: "2026-08-01", effective_to: "2026-08-31", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 5.0, monthly_mass_cap_g: 30.0 }] }, as: EHSOfficer, captures: { pc: $.data.id } }
          trigger:
            - { call: "POST /discharge-permits/${pc}/samples", payload: { flow_liters: 10000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 2.0 }] }, as: EHSOfficer, captures: { e1: $.data.is_exceedance } }
            - { call: "POST /discharge-permits/${pc}/samples", payload: { flow_liters: 5000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 2.0 }] }, as: EHSOfficer, captures: { e2: $.data.is_exceedance } }
            - { call: "GET /discharge-permits/${pc}", as: EHSOfficer, captures: { cum2: $.data.cumulative_mass_g, st2: $.data.status } }
            - { call: "POST /discharge-permits/${pc}/samples", payload: { flow_liters: 1000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 2.0 }] }, as: EHSOfficer, captures: { e3: $.data.is_exceedance } }
            - { call: "GET /discharge-permits/${pc}", as: EHSOfficer, captures: { st3: $.data.status } }
          assert:
            - "sample 1 (20.0 g) and sample 2 (10.0 g): both is_exceedance == false; cumulative exactly 30.0 == cap is compliant"
            - "permit still ACTIVE at exact cap"
            - "sample 3 (cumulative 32.0 > 30.0): is_exceedance == true; permit EXCEEDED"

      - name: lot_hours_gate_and_allowance_boundaries
        claim_type: correct_result
        grounds: [calculations.salt_spray_acceptance, "errors[ERR_LOT_HOURS_INSUFFICIENT]", "errors[ERR_LOT_NOT_RUNNING]"]
        distinguishing_aspect: "Evaluate at 95 of 96 required hours -> ERR_LOT_HOURS_INSUFFICIENT; at exactly 96 hours -> allowed. sample_count 4 allows 0 failures (1 failure -> FAILED); sample_count 10 allows 2 (2 -> PASSED). Double evaluate -> ERR_LOT_NOT_RUNNING."
        test_recipe:
          setup: ["orders W5 (lot sample_count 4) and W10 (lot sample_count 10), both AWAITING_LOT_TEST, lots created at 2026-08-01T00:00:00Z, hours_required 96"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Hours Co" }, as: ShopManager, captures: { ch: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-HR", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bh2: $.data.id } }
            - { call: "POST /baths/${bh2}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${ch}", part_number: "PN-H5", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0, requires_salt_spray: true }, as: Customer, as_user_id: "${ch}", captures: { wh5: $.data.id } }
            - { call: "POST /work-orders/${wh5}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wh5}/route", payload: { bath_id: "${bh2}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${bh2}", as: LabChemist, captures: { bh2_v1: $.data.version } }
            - { call: "POST /work-orders/${wh5}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bh2_v1}" }, as: LineOperator, captures: { lrh5: $.data.id } }
            - { call: "POST /load-runs/${lrh5}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wh5}/inspections", payload: { thickness_readings_um: [13.0, 14.0, 15.0], defect_type: "NONE" }, as: QCInspector }
            - { call: "POST /salt-spray-lots", payload: { work_order_id: "${wh5}", sample_count: 4, hours_required: 96 }, as: LabChemist, captures: { lot5: $.data.id, lot5_allowed: $.data.allowed_failures } }
            - { call: "POST /work-orders", payload: { customer_id: "${ch}", part_number: "PN-H10", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0, requires_salt_spray: true }, as: Customer, as_user_id: "${ch}", captures: { wh10: $.data.id } }
            - { call: "POST /work-orders/${wh10}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wh10}/route", payload: { bath_id: "${bh2}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${bh2}", as: LabChemist, captures: { bh2_v2: $.data.version } }
            - { call: "POST /work-orders/${wh10}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bh2_v2}" }, as: LineOperator, captures: { lrh10: $.data.id } }
            - { call: "POST /load-runs/${lrh10}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wh10}/inspections", payload: { thickness_readings_um: [13.0, 14.0, 15.0], defect_type: "NONE" }, as: QCInspector }
            - { call: "POST /salt-spray-lots", payload: { work_order_id: "${wh10}", sample_count: 10, hours_required: 96 }, as: LabChemist, captures: { lot10: $.data.id, lot10_allowed: $.data.allowed_failures } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T23:00:00Z" }, as: ShopManager }
            - { call: "POST /salt-spray-lots/${lot5}/evaluate", payload: { panels_failed: 0 }, as: LabChemist, captures: { err_hours: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ShopManager }
            - { call: "POST /salt-spray-lots/${lot5}/evaluate", payload: { panels_failed: 1 }, as: LabChemist, captures: { lot5_res: $.data.result } }
            - { call: "POST /salt-spray-lots/${lot5}/evaluate", payload: { panels_failed: 0 }, as: LabChemist, captures: { err_2x: $.data.error_id } }
            - { call: "POST /salt-spray-lots/${lot10}/evaluate", payload: { panels_failed: 2 }, as: LabChemist, captures: { lot10_res: $.data.result } }
            - { call: "GET /work-orders/${wh5}", as: LabChemist, captures: { wh5_st: $.data.status } }
            - { call: "GET /work-orders/${wh10}", as: LabChemist, captures: { wh10_st: $.data.status } }
          assert:
            - "lot5 allowed_failures == 0 (sample_count 4); lot10 allowed_failures == 2 (sample_count 10)"
            - "evaluate at 95 h: error_id == ERR_LOT_HOURS_INSUFFICIENT (409)"
            - "at exactly 96 h: lot5 with 1 failure (> 0 allowed) -> FAILED, order W5 -> REJECTED"
            - "double evaluate: error_id == ERR_LOT_NOT_RUNNING"
            - "lot10 with 2 failures (<= 2 allowed, inclusive) -> PASSED, order W10 -> COMPLETE"

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without a valid X-User-Role header is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before anything else — even on a nonexistent resource (auth outranks existence)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /baths/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: "", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), not 404"

      - name: role_not_listed_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "LineOperator (not in POST /baths roles) gets ERR_INSUFFICIENT_PERMISSIONS 403 even with a perfectly valid payload."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /baths", payload: { bath_code: "ANO-Z", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: LineOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403); no bath persisted"

      - name: customer_cannot_read_other_customer_order
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_RESOURCE_NOT_OWNED]"]
        distinguishing_aspect: "Customer A reading customer B's work order gets 403 ERR_RESOURCE_NOT_OWNED (not 404 — the resource exists but is outside the caller's ownership scope)."
        test_recipe:
          setup: ["customers CA and CB; CB owns order WB"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "A Co" }, as: ShopManager, captures: { cva: $.data.id } }
            - { call: "POST /customers", payload: { company_name: "B Co" }, as: ShopManager, captures: { cvb: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cvb}", part_number: "PN-B", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 5, surface_area_dm2_per_part: 2.0, thickness_spec_min_um: 10.0, thickness_spec_max_um: 14.0 }, as: Customer, as_user_id: "${cvb}", captures: { wvb: $.data.id } }
          trigger:
            - { call: "GET /work-orders/${wvb}", as: Customer, as_user_id: "${cva}", captures: { err_own: $.data.error_id } }
          assert:
            - "error_id == ERR_RESOURCE_NOT_OWNED (403)"

      - name: customer_list_scoped_to_own_records
        claim_type: satisfaction_pass
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "GET /work-orders as Customer A returns only A's orders (server-side ownership scoping), and GET /customers as Customer A returns only A's record."
        test_recipe:
          setup: ["customers CA2 (2 orders) and CB2 (1 order)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "A2 Co" }, as: ShopManager, captures: { cla: $.data.id } }
            - { call: "POST /customers", payload: { company_name: "B2 Co" }, as: ShopManager, captures: { clb: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cla}", part_number: "PN-A1", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 5, surface_area_dm2_per_part: 2.0, thickness_spec_min_um: 10.0, thickness_spec_max_um: 14.0 }, as: ShopManager }
            - { call: "POST /work-orders", payload: { customer_id: "${cla}", part_number: "PN-A2", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 5, surface_area_dm2_per_part: 2.0, thickness_spec_min_um: 10.0, thickness_spec_max_um: 14.0 }, as: ShopManager }
            - { call: "POST /work-orders", payload: { customer_id: "${clb}", part_number: "PN-B1", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 5, surface_area_dm2_per_part: 2.0, thickness_spec_min_um: 10.0, thickness_spec_max_um: 14.0 }, as: ShopManager }
          trigger:
            - { call: "GET /work-orders", as: Customer, as_user_id: "${cla}", captures: { list_a: $.data } }
            - { call: "GET /customers", as: Customer, as_user_id: "${cla}", captures: { cust_a: $.data } }
          assert:
            - "work order list for customer A contains exactly 2 rows, all with customer_id == ${cla}"
            - "customers list for customer A contains exactly 1 row (itself)"

      - name: nonexistent_bath_titration_returns_404
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 4) outranks schema (priority 5): titrating a nonexistent bath with a body that is ALSO missing required fields yields 404 ERR_NOT_FOUND, not 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /baths/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/titrations", payload: {}, as: LabChemist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404) despite the missing body fields"

      - name: workorder_amend_occ_and_quote_recompute
        claim_type: violation_to_error
        grounds: ["concurrency_rules[workorder-amend-stale-version]", calculations.provisional_quote, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with a stale expected_work_order_version -> 412 ERR_STALE_VERSION; PATCH with the current version succeeds and recomputes the provisional quote (part_count 10 -> 12 gives surface 30 dm2, quote 7950)."
        test_recipe:
          setup: ["order WV in RECEIVED (BARREL, 10 x 2.5 dm2, spec [12,18]) with version captured at creation"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Amend Co" }, as: ShopManager, captures: { cav: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cav}", part_number: "PN-V", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cav}", captures: { wv: $.data.id, wv_v: $.data.version } }
          trigger:
            - { call: "PATCH /work-orders/${wv}", payload: { expected_work_order_version: "${wv_v} - 1", part_count: 12 }, as: Customer, as_user_id: "${cav}", captures: { err_stale: $.data.error_id } }
            - { call: "PATCH /work-orders/${wv}", payload: { expected_work_order_version: "${wv_v}", part_count: 12 }, as: Customer, as_user_id: "${cav}", captures: { wv_q: $.data.provisional_quote_cents, wv_v2: $.data.version } }
          assert:
            - "stale amend: error_id == ERR_STALE_VERSION (412); quote and part_count unchanged"
            - "fresh amend: version increments by 1 and provisional_quote_cents == 7950 (barrel 1200 + processing round(30 x 15.0 x 15) = 6750)"

      - name: dose_stale_version_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[dose-stale-bath-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A dose carrying the bath version from before another dose landed is rejected 412 even though both doses would each be legitimate (bath ACTIVE, still below target)."
        test_recipe:
          setup: ["bath BDO titrated to 4.0 (target 5.0, band [4.0, 6.0]); bath version captured after titration"]
          setup_api_calls:
            - { call: "POST /baths", payload: { bath_code: "ANO-DO", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 3.5, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bdo: $.data.id } }
            - { call: "POST /baths/${bdo}/titrations", payload: { titrant_volume_ml: 40.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist, captures: { bdo_conc: $.data.measured_concentration_g_l } }
            - { call: "GET /baths/${bdo}", as: LabChemist, captures: { bdo_v: $.data.version } }
          trigger:
            - { call: "POST /baths/${bdo}/doses", payload: { chemical_code: "H2SO4", quantity_g: 80.0, expected_bath_version: "${bdo_v}" }, as: LabChemist, captures: { do1: $.data.resulting_concentration_g_l } }
            - { call: "POST /baths/${bdo}/doses", payload: { chemical_code: "H2SO4", quantity_g: 80.0, expected_bath_version: "${bdo_v}" }, as: LabChemist, captures: { err_do2: $.data.error_id } }
          assert:
            - "titration sets 4.0 g/L exactly (40 x 0.1 x 49 / 49)"
            - "first dose (fresh version) succeeds: resulting_concentration_g_l == 4.1"
            - "second dose with the same (now stale) version: error_id == ERR_STALE_VERSION (412)"

      - name: manifest_line_stale_version_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[manifest-line-add-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Adding a line with the manifest version captured before a prior add is rejected 412; both adds target a DRAFT manifest and would otherwise succeed — a true OCC stale-view surface."
        test_recipe:
          setup: ["manifest MSV DRAFT, version captured at creation"]
          setup_api_calls:
            - { call: "POST /waste-manifests", payload: { generator_epa_id: "EPA-GEN-SV" }, as: EHSOfficer, as_user_id: "ehs-sv", captures: { msv: $.data.id, msv_v: $.data.version } }
          trigger:
            - { call: "POST /waste-manifests/${msv}/line-items", payload: { waste_code: "F006", source_type: "SLUDGE_PRESS", description: "Cake A", volume_liters: 10, expected_manifest_version: "${msv_v}" }, as: EHSOfficer, as_user_id: "ehs-sv", captures: { msv_l1: $.data.id } }
            - { call: "POST /waste-manifests/${msv}/line-items", payload: { waste_code: "F006", source_type: "SLUDGE_PRESS", description: "Cake B", volume_liters: 10, expected_manifest_version: "${msv_v}" }, as: EHSOfficer, as_user_id: "ehs-sv", captures: { err_msv: $.data.error_id } }
          assert:
            - "first add succeeds (manifest now version 2)"
            - "second add with stale version: error_id == ERR_STALE_VERSION (412)"

      - name: conditional_alloy_requires_predip
        claim_type: conditional_validation
        grounds: ["errors[ERR_PREDIP_REQUIRED]", state_machines.WorkOrder.ROUTED_to_IN_PROCESS]
        distinguishing_aspect: "CONDITIONAL compatibility allows routing but blocks load start with ERR_PREDIP_REQUIRED until complete-predip sets predip_completed; the gate re-arms after every strip lap (predip_completed reset)."
        test_recipe:
          setup: ["rule TI64/ANODIZE/SULFURIC CONDITIONAL; bath BPD titrated 5.0; order WPD (alloy TI64) routed"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Predip Co" }, as: ShopManager, captures: { cpd: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "TI64", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "CONDITIONAL", notes: "Requires desmut pre-dip" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-PD", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bpd: $.data.id } }
            - { call: "POST /baths/${bpd}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${cpd}", part_number: "PN-PD", alloy_code: "TI64", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cpd}", captures: { wpd: $.data.id } }
            - { call: "POST /work-orders/${wpd}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wpd}/route", payload: { bath_id: "${bpd}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { wpd_route: $.data.status } }
          trigger:
            - { call: "GET /baths/${bpd}", as: LabChemist, captures: { bpd_v1: $.data.version } }
            - { call: "POST /work-orders/${wpd}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bpd_v1}" }, as: LineOperator, captures: { err_pd: $.data.error_id } }
            - { call: "POST /work-orders/${wpd}/complete-predip", as: LineOperator, captures: { wpd_pd: $.data.predip_completed } }
            - { call: "GET /baths/${bpd}", as: LabChemist, captures: { bpd_v2: $.data.version } }
            - { call: "POST /work-orders/${wpd}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${bpd_v2}" }, as: LineOperator, captures: { wpd_lr: $.data.status } }
          assert:
            - "CONDITIONAL rule allowed routing: status == ROUTED"
            - "load start without predip: error_id == ERR_PREDIP_REQUIRED (422)"
            - "complete-predip sets predip_completed == true; load start then succeeds (RUNNING)"

      - name: route_process_and_mode_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROCESS_TYPE_MISMATCH]", "errors[ERR_ROUTING_MODE_NOT_SUPPORTED]"]
        distinguishing_aspect: "An ANODIZE order routed to a PLATE bath -> ERR_PROCESS_TYPE_MISMATCH; the same order routed to an ANODIZE bath supporting only RACK -> ERR_ROUTING_MODE_NOT_SUPPORTED. The order stays READY_FOR_ROUTING after each rejection."
        test_recipe:
          setup: ["order WMM (ANODIZE, BARREL) prepared; bath BP1 PLATE/COPPER; bath BP2 ANODIZE/SULFURIC RACK-only, both titrated in-band (COPPER EQ 31.77: tv 15.727, n 0.1, sv 10 -> 5.0)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Mismatch Co" }, as: ShopManager, captures: { cmm: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "COPPER", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "PLT-MM", process_type: "PLATE", chemistry_family: "COPPER", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bp1: $.data.id } }
            - { call: "POST /baths/${bp1}/titrations", payload: { titrant_volume_ml: 15.727, titrant_normality: 0.1, sample_volume_ml: 10.0 }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-MM", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["RACK"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bp2: $.data.id } }
            - { call: "POST /baths/${bp2}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${cmm}", part_number: "PN-MM", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cmm}", captures: { wmm: $.data.id } }
            - { call: "POST /work-orders/${wmm}/prepare", payload: {}, as: LineOperator }
          trigger:
            - { call: "POST /work-orders/${wmm}/route", payload: { bath_id: "${bp1}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_pt: $.data.error_id } }
            - { call: "POST /work-orders/${wmm}/route", payload: { bath_id: "${bp2}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_rm: $.data.error_id } }
            - { call: "GET /work-orders/${wmm}", as: LineOperator, captures: { wmm_st: $.data.status } }
          assert:
            - "PLATE bath: error_id == ERR_PROCESS_TYPE_MISMATCH (422)"
            - "RACK-only bath for BARREL order: error_id == ERR_ROUTING_MODE_NOT_SUPPORTED (422)"
            - "order still READY_FOR_ROUTING after both rejections"

      - name: route_fixture_mode_and_capacity_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_FIXTURE_ROUTING_MODE_MISMATCH]", "errors[ERR_FIXTURE_CAPACITY_INSUFFICIENT]"]
        distinguishing_aspect: "RACK order with a BARREL fixture -> ERR_FIXTURE_ROUTING_MODE_MISMATCH; with a RACK fixture of capacity 20 dm2 < 25 dm2 -> ERR_FIXTURE_CAPACITY_INSUFFICIENT; with an adequate RACK fixture -> ROUTED."
        test_recipe:
          setup: ["order WFX (ANODIZE, RACK, 25 dm2) prepared; bath BFX titrated 5.0 RACK-capable; fixture FB BARREL; fixture FS RACK capacity 20; fixture FG RACK capacity 500"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Fixture Co" }, as: ShopManager, captures: { cfx: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /fixtures", payload: { fixture_code: "BAR-1", routing_mode: "BARREL", capacity_dm2: 500, purchase_cost_cents: 40000, rated_uses: 40 }, as: ShopManager, captures: { fb: $.data.id } }
            - { call: "POST /fixtures", payload: { fixture_code: "RACK-S", routing_mode: "RACK", capacity_dm2: 20, purchase_cost_cents: 40000, rated_uses: 40 }, as: ShopManager, captures: { fs: $.data.id } }
            - { call: "POST /fixtures", payload: { fixture_code: "RACK-G", routing_mode: "RACK", capacity_dm2: 500, purchase_cost_cents: 120000, rated_uses: 50 }, as: ShopManager, captures: { fg: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-FX", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["RACK"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bfx: $.data.id } }
            - { call: "POST /baths/${bfx}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${cfx}", part_number: "PN-FX", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "RACK", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cfx}", captures: { wfx: $.data.id } }
            - { call: "POST /work-orders/${wfx}/prepare", payload: {}, as: LineOperator }
          trigger:
            - { call: "POST /work-orders/${wfx}/route", payload: { bath_id: "${bfx}", fixture_id: "${fb}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_fm: $.data.error_id } }
            - { call: "POST /work-orders/${wfx}/route", payload: { bath_id: "${bfx}", fixture_id: "${fs}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_fc: $.data.error_id } }
            - { call: "POST /work-orders/${wfx}/route", payload: { bath_id: "${bfx}", fixture_id: "${fg}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { wfx_ok: $.data.status } }
          assert:
            - "BARREL fixture on RACK order: error_id == ERR_FIXTURE_ROUTING_MODE_MISMATCH"
            - "20 dm2 fixture under 25 dm2 load: error_id == ERR_FIXTURE_CAPACITY_INSUFFICIENT"
            - "adequate fixture: status == ROUTED and fixture_id == ${fg}"

      - name: prepare_masking_minutes_validation
        claim_type: conditional_validation
        grounds: ["errors[ERR_MASKING_MINUTES_REQUIRED]"]
        distinguishing_aspect: "requires_masking == true order prepared without masking_minutes -> ERR_MASKING_MINUTES_REQUIRED; a non-masking order prepared WITH masking_minutes -> same error; correct combinations succeed."
        test_recipe:
          setup: ["orders WMK (requires_masking) and WNM (no masking), both RECEIVED"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Mask Co" }, as: ShopManager, captures: { cmk: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cmk}", part_number: "PN-MK", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0, requires_masking: true }, as: Customer, as_user_id: "${cmk}", captures: { wmk: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cmk}", part_number: "PN-NM", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cmk}", captures: { wnm: $.data.id } }
          trigger:
            - { call: "POST /work-orders/${wmk}/prepare", payload: {}, as: LineOperator, captures: { err_mk: $.data.error_id } }
            - { call: "POST /work-orders/${wnm}/prepare", payload: { masking_minutes: 10 }, as: LineOperator, captures: { err_nm: $.data.error_id } }
            - { call: "POST /work-orders/${wmk}/prepare", payload: { masking_minutes: 25 }, as: LineOperator, captures: { wmk_st: $.data.status, wmk_q: $.data.provisional_quote_cents } }
            - { call: "POST /work-orders/${wnm}/prepare", payload: {}, as: LineOperator, captures: { wnm_st: $.data.status } }
          assert:
            - "masking order without minutes: error_id == ERR_MASKING_MINUTES_REQUIRED"
            - "non-masking order with minutes: error_id == ERR_MASKING_MINUTES_REQUIRED"
            - "masking order with 25 minutes: READY_FOR_ROUTING and quote recomputed with masking line 25 x 85 == 2125 (quote == 1200 + 5625 + 2125 == 8950)"
            - "non-masking order without minutes: READY_FOR_ROUTING"

      - name: manifest_finalize_segregation_and_empty
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "errors[ERR_MANIFEST_EMPTY]", "validations[priority=10]"]
        distinguishing_aspect: "Segregation binds every role: creator finalizing -> 403 (even a ShopManager who created the manifest); a different EHS user finalizing an EMPTY manifest -> 422 ERR_MANIFEST_EMPTY; with a line and a different finalizer -> FINALIZED. Pinned sub-order: segregation before emptiness within priority 10."
        test_recipe:
          setup: ["manifest MF created by 'ehs-x' (empty); manifest MG created by ShopManager user 'mgr-1' (empty)"]
          setup_api_calls:
            - { call: "POST /waste-manifests", payload: { generator_epa_id: "EPA-GEN-F" }, as: EHSOfficer, as_user_id: "ehs-x", captures: { mf: $.data.id, mf_v: $.data.version } }
            - { call: "POST /waste-manifests", payload: { generator_epa_id: "EPA-GEN-G" }, as: ShopManager, as_user_id: "mgr-1", captures: { mg: $.data.id } }
          trigger:
            - { call: "POST /waste-manifests/${mf}/finalize", as: EHSOfficer, as_user_id: "ehs-x", captures: { err_sod: $.data.error_id } }
            - { call: "POST /waste-manifests/${mg}/finalize", as: ShopManager, as_user_id: "mgr-1", captures: { err_sod_mgr: $.data.error_id } }
            - { call: "POST /waste-manifests/${mf}/finalize", as: EHSOfficer, as_user_id: "ehs-y", captures: { err_empty: $.data.error_id } }
            - { call: "POST /waste-manifests/${mf}/line-items", payload: { waste_code: "F006", source_type: "SLUDGE_PRESS", description: "Cake", volume_liters: 100, expected_manifest_version: "${mf_v}" }, as: EHSOfficer, as_user_id: "ehs-x" }
            - { call: "POST /waste-manifests/${mf}/finalize", as: EHSOfficer, as_user_id: "ehs-y", captures: { mf_fin: $.data.status, mf_mass: $.data.total_mass_kg } }
          assert:
            - "creator finalize: error_id == ERR_SEGREGATION_OF_DUTIES (403)"
            - "ShopManager creator finalize: error_id == ERR_SEGREGATION_OF_DUTIES (segregation binds managers too)"
            - "different user on empty manifest: error_id == ERR_MANIFEST_EMPTY (422)"
            - "line added (mass 150.0) then different user finalizes: status == FINALIZED, total_mass_kg == 150.0"

      - name: suspended_customer_blocked
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMER_SUSPENDED]", "validations[priority=11]"]
        distinguishing_aspect: "A SUSPENDED customer cannot create new work orders (403) and its existing prepared orders cannot be routed (403); in-flight loads are unaffected (not asserted here)."
        test_recipe:
          setup: ["customer CSU with one prepared order WSU; rule + titrated bath BSU exist; then CSU is suspended"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Susp Co" }, as: ShopManager, captures: { csu: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-SU2", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bsu2: $.data.id } }
            - { call: "POST /baths/${bsu2}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${csu}", part_number: "PN-SU", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${csu}", captures: { wsu2: $.data.id } }
            - { call: "POST /work-orders/${wsu2}/prepare", payload: {}, as: LineOperator }
            - { call: "PATCH /customers/${csu}", payload: { status: "SUSPENDED" }, as: ShopManager, captures: { csu_st: $.data.status } }
          trigger:
            - { call: "POST /work-orders", payload: { customer_id: "${csu}", part_number: "PN-SU2", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 5, surface_area_dm2_per_part: 2.0, thickness_spec_min_um: 10.0, thickness_spec_max_um: 14.0 }, as: ShopManager, captures: { err_new: $.data.error_id } }
            - { call: "POST /work-orders/${wsu2}/route", payload: { bath_id: "${bsu2}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_route: $.data.error_id } }
          assert:
            - "customer suspended (status == SUSPENDED observed on PATCH response)"
            - "new work order: error_id == ERR_CUSTOMER_SUSPENDED (403)"
            - "route of existing prepared order: error_id == ERR_CUSTOMER_SUSPENDED (403)"

      - name: route_nonexistent_bath_returns_404
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Routing with a bath_id that does not exist is a body-FK existence failure -> 404 ERR_NOT_FOUND, raised before state or safety checks."
        test_recipe:
          setup: ["prepared order WNB"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Ghost Co" }, as: ShopManager, captures: { cnb: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cnb}", part_number: "PN-NB", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${cnb}", captures: { wnb: $.data.id } }
            - { call: "POST /work-orders/${wnb}/prepare", payload: {}, as: LineOperator }
          trigger:
            - { call: "POST /work-orders/${wnb}/route", payload: { bath_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_ghost: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

