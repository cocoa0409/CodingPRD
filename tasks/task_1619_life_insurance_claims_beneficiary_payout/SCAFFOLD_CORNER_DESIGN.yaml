            - "ERR_ELECTION_NOT_FOUND / ERR_ACCOUNT_NOT_FOUND / ERR_MATCH_NOT_FOUND / ERR_CASE_NOT_FOUND"
            - "all responses http 404 with the error envelope"

  # ---------------------------------------------------------------------------
  # Section: rbac
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: c_approve_as_examiner_forbidden
        claim_type: rbac_deny
        grounds: ["roles[ClaimsApprover]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "ClaimsExaminer cannot approve: role check (p2) fires before any state check with ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["IL statute; policy; claim UNDER_REVIEW with certified doc VERIFIED (fully approvable otherwise)"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-RBAC-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-3", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INSUFFICIENT_PERMISSIONS (403); claim remains UNDER_REVIEW"]

      - name: c_statute_create_as_examiner_forbidden
        claim_type: rbac_deny
        grounds: ["roles[ComplianceOfficer]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Statute configuration is ComplianceOfficer-exclusive; ClaimsExaminer gets ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INSUFFICIENT_PERMISSIONS (403); GET /state-statutes returns 0 items"]

      - name: c_interpleader_as_approver_forbidden
        claim_type: rbac_deny
        grounds: ["roles[LegalCounsel]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Interpleader referral is LegalCounsel-exclusive; ClaimsApprover gets ERR_INSUFFICIENT_PERMISSIONS even when the claim state would otherwise matter (role check precedes state)."
        test_recipe:
          setup: ["IL statute; policy; claim UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-RBAC-2", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/refer-interpleader", payload: { court_reference: "2026-CV-0002" }, as: ClaimsApprover, as_user_id: "approver-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"]

      - name: c_sod_assigned_examiner_cannot_approve
        claim_type: rbac_deny
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties by user id: a ClaimsApprover whose X-User-ID equals the claim's assigned_examiner_id is rejected with ERR_SEGREGATION_OF_DUTIES_VIOLATION (403) even though the role is correct and the claim is fully approvable."
        test_recipe:
          setup: ["IL statute; policy; claim filed by examiner-1, docs verified, UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-RBAC-3", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION (403); claim remains UNDER_REVIEW"]

      - name: c_document_self_review_forbidden
        claim_type: rbac_deny
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]", "state_machines.DeathDocument.PENDING_to_VERIFIED"]
        distinguishing_aspect: "The document reviewer must differ from the uploader: examiner-1 reviewing their own upload gets ERR_SEGREGATION_OF_DUTIES_VIOLATION (403)."
        test_recipe:
          setup: ["IL statute; policy; claim; certified doc uploaded by examiner-1"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-RBAC-4", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
          trigger:
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION (403); document remains PENDING"]

  # ---------------------------------------------------------------------------
  # Section: cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: c_occ_stale_claim_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[election-create-stale-claim]", "errors[ERR_STALE_CLAIM_VERSION]"]
        distinguishing_aspect: "OCC on Claim.version: after a first election bumps the version, a second create carrying the previously observed version is rejected with ERR_STALE_CLAIM_VERSION (412)."
        test_recipe:
          setup: ["TX statute; approved claim (version captured at approve); first election already created (version bumped)"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "TX", annual_interest_rate_bp: 1200, interest_basis: "DATE_OF_DEATH", grace_days: 365, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-OCC-1", insured_name: "John Roe", insured_dob: "1955-05-05", state_code: "TX", face_amount_cents: 10000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Roe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Roe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { cl_v: $.data.version } }
            - { call: "POST /beneficiary-claims/${bc}/elections", payload: { option: "LUMP_SUM", expected_claim_version: "${cl_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /beneficiary-claims/${bc}/elections", payload: { option: "RETAINED_ASSET_ACCOUNT", expected_claim_version: "${cl_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_CLAIM_VERSION (412): the first election bumped Claim.version past ${cl_v}"
            - "Only the first (LUMP_SUM) election exists and remains ELECTED"

      - name: c_occ_stale_policy_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[designation-create-stale-policy]", "errors[ERR_STALE_POLICY_VERSION]"]
        distinguishing_aspect: "OCC on Policy.version: after one designation create bumps the policy version, a second create carrying the stale version is rejected with ERR_STALE_POLICY_VERSION (412)."
        test_recipe:
          setup: ["policy at version 1; designation D1 created (version now 2)"]
          setup_api_calls:
            - { call: "POST /policies", payload: { policy_number: "P-OCC-2", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 60, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator }
          trigger:
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Bob Doe", beneficiary_type: "PRIMARY", share_percent: 40, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_POLICY_VERSION (412): D1 creation bumped Policy.version to 2"
            - "Replaying the second create with the fresh version (2) succeeds — GET /policies/{id} first to observe it"

      - name: c_clock_default_is_2026_08_01
        claim_type: scheduled_actions
        grounds: ["endpoints.\"POST /_clock/set_current_utc", "entities.Claim.fields.notification_date"]
        distinguishing_aspect: "Without any set_current_utc call, the logical clock reads exactly 2026-08-01T00:00:00Z (never wall clock): a claim filed immediately has notification_date == 2026-08-01."
        test_recipe:
          setup: ["IL statute; policy; NO clock call made anywhere in the scenario"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-CLK-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { nd: $.data.notification_date } }
          assert: ["notification_date == '2026-08-01' (fixed startup default; deterministic regardless of real time)"]

      - name: c_rival_filing_cascade_stub
        claim_type: cascade_chain
        grounds: ["state_machines.BeneficiaryClaim.PAYABLE_to_DISPUTED", "state_machines.Claim.APPROVED_to_LEGAL_HOLD"]
        excluded_because:
          difficulty_instance: rival_beneficiary_filing_cascade
          rationale: "Depth-3 cascade asserted link-by-link there."

      - name: c_payment_cascade_stub
        claim_type: cascade_chain
        grounds: ["state_machines.BeneficiaryClaim.PAYABLE_to_PAID", "state_machines.Claim.APPROVED_to_PAID"]
        excluded_because:
          difficulty_instance: execute_payment_raa_cascade
          rationale: "Depth-3 payment cascade asserted link-by-link there."

  # ---------------------------------------------------------------------------
  # Section: consistency model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: c_immediate_read_after_write
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a created resource is fully visible to the very next GET (single-resource and list), including system-minted fields and version."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /policies", payload: { policy_number: "P-CON-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "GET /policies/${pol}", payload: {}, as: ClaimsExaminer }
            - { call: "GET /policies", payload: { state_code: "IL" }, as: ClaimsExaminer }
          assert:
            - "GET single immediately returns policy_number 'P-CON-1' with status ACTIVE and version 1"
            - "GET list?state_code=IL immediately contains exactly that 1 policy (total_count == 1)"
