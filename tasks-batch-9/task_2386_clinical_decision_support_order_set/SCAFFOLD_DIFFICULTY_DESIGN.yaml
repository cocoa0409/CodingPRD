  - rule_id: boundary_precision_check
    instances:
      - name: boundary_retirement_gate_rejects_fire_count_39_and_accepts_40
        boundary_value: "MIN_FIRE_COUNT = 40 firings per candidate window"
        grounds:
          - calculations.low_value_retirement_eligibility
          - validations[priority=27]
          - endpoints.POST_/cds/alerts/{id}/retire
          - errors.ERR_RETIREMENT_CRITERIA_NOT_MET
        distinguishing_aspect: |
          The boundary is the integer firing-count floor, tested on the retire endpoint.
          The trap is that the other two gate criteria are comfortably satisfied at 39
          firings — override_rate rises to 0.9231 and the burden_index still rounds to
          exactly 72.00 — so a single missing firing is the only thing standing between
          rejection and retirement, and it is invisible in the index.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair and two specialty approvers exist."
            - "An accepted ALERT request carries a TIER_2_INTERRUPTIVE alert with two override reason codes and no linked order set; it is APPROVED by two unanimous votes and activated at clock 2026-09-01T00:00:00Z."
            - "Window W1 spans 2026-09-01 to 2026-09-08 and receives 40 firings at 3600s from 2026-09-01T00:00:00Z of which 36 are overrides across 10 clinicians."
            - "Window W2 spans 2026-09-08 to 2026-09-15 and receives 39 firings at 3600s from 2026-09-09T00:00:00Z of which 36 are overrides across 10 clinicians; opening W2 supersedes and closes W1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cds/clinicians"
