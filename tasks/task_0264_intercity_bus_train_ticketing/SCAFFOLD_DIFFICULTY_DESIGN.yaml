              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 1, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v2: $.data.version }
          trigger:
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v2}" }
              as: Passenger
              as_user_id: "${p_id}"
          assert:
            - "the second confirm returns error_id == ERR_INVALID_STATE (state P6), NOT ERR_SOLD_OUT (fiscal P13)"
            - "http status == 409"

      - name: existence_beats_referential_on_baggage
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_PRECONDITION_NOT_MET]
        distinguishing_aspect: |
          Pair {existence (P3, ERR_NOT_FOUND) vs business_referential (P7, ERR_PRECONDITION_NOT_MET)}:
          adding baggage to a non-existent booking id fails the existence check (P3) first ->
          ERR_NOT_FOUND, never reaching any cross-entity precondition (P7). Different category pair from
          instance 1.
        test_recipe:
          setup:
            - "Operator and a registered passenger exist, but no booking with the queried id exists."
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings/00000000-0000-4000-8000-000000000000/baggage"
              payload: { weight_kg: 10.0 }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (existence P3), NOT ERR_PRECONDITION_NOT_MET (referential P7)"
            - "http status == 404"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: load_factor_tier_boundary_at_exactly_half
        grounds:
          - calculations.leg_fare_cents
          - entities.ServiceDate.fields.load_factor
          - state_machines.Booking.booking_status.HELD_to_CONFIRMED
        distinguishing_aspect: |
          Numeric threshold boundary: load_factor exactly 0.5 enters the 1.25 demand tier (lower-inclusive
          >=0.5), so a leg on a seats_total=2 SD with 1 confirmed prices to 4500 (=4000*1.25*0.90 at 14d),
          NOT 3600 (the 1.00 tier). Reached via /bookings/{id}/confirm.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; ServiceDate seats_total=2 base 4000 departure 2026-06-15 (14 days out)."
            - "One booking already CONFIRMED -> seats_sold=1, load_factor exactly 0.5; test passenger holds the 2nd booking."
