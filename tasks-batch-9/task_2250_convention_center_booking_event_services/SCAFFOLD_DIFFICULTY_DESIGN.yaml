            - "LicenseAgreement.${lic_id}.status == TERMINATED"
            - "Client.${cl_nwa_id}.credit_balance_cents == 8000000"
            - "Client.${cl_nwa_id}.total_deposits_paid_cents == 8000000"
            - "credit_balance_cents 8000000 plus deposit_held_cents 0 plus applied deposits 0 equals total_deposits_paid_cents 8000000"
            - "GET /convention-center/settlements?booking_id=${bk_id} returns data with length 0"

      - name: space_day_capacity_ledger_reverses_only_the_released_booking_share
        grounds:
          - calculations.space_days_committed
          - state_machines.EventBooking.TENTATIVE_to_RELEASED
          - entities.SpaceUnit.fields.committed_space_days
          - entities.EventBooking.fields.space_days_committed
        distinguishing_aspect: |
          The conserved quantity is CAPACITY measured in space-days, not money, and the
          invariant is a sum over surviving rows rather than a three-way identity:
          SpaceUnit.committed_space_days must always equal the sum of space_days_committed
          over that space's bookings whose status is in {TENTATIVE, DEFINITE, IN_HOUSE,
          CLOSED, SETTLED}. Releasing the second of two Hall A bookings must move the ledger
          from 18 to exactly 10, while the released booking retains its own historical 8.
        test_recipe:
          setup:
            - "Hall A has daily_base_rate_cents 4800000 and the CITYWIDE_CONVENTION window is published"
            - "National Widget Association holds two Hall A bookings: 2028-05-10 through 2028-05-19 (10 space-days) and 2028-09-05 through 2028-09-12 (8 space-days)"
            - "neither booking carries a SpaceHold, so SpaceUnit.committed_space_days is 18"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CITYWIDE_CONVENTION", priority_rank: 1, open_months_before: 60, close_months_before: 18, max_holds_per_booking: 3, challenge_response_hours: 120, rental_discount_pct: 0.25, max_challenge_rounds: 2 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Hall A", space_class: "HALL", rentable_sqft: 200000, daily_base_rate_cents: 4800000, rigging_capable: true }
              as: VenueAdmin
              captures: { sp_ha_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "National Widget Association", contact_email: "nwa@example.org", organization_type: "NATIONAL_ASSOCIATION" }
              as: VenueAdmin
              captures: { cl_nwa_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_nwa_id}", space_id: "${sp_ha_id}", event_name: "National Widget Convention", event_class: "CITYWIDE_CONVENTION", move_in_start_date: "2028-05-10", show_start_date: "2028-05-14", show_end_date: "2028-05-17", move_out_end_date: "2028-05-19", projected_room_nights: 3000 }
              as: SalesManager
              captures: { bk_keep_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_nwa_id}", space_id: "${sp_ha_id}", event_name: "National Widget Fall Council", event_class: "CITYWIDE_CONVENTION", move_in_start_date: "2028-09-05", show_start_date: "2028-09-08", show_end_date: "2028-09-10", move_out_end_date: "2028-09-12", projected_room_nights: 2600 }
              as: SalesManager
              captures: { bk_drop_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings/${bk_drop_id}/release"
              payload: {}
              as: SalesManager
          assert:
            - "EventBooking.${bk_drop_id}.status == RELEASED"
            - "EventBooking.${bk_drop_id}.space_days_committed == 8"
            - "EventBooking.${bk_keep_id}.status == TENTATIVE"
            - "EventBooking.${bk_keep_id}.space_days_committed == 10"
            - "SpaceUnit.${sp_ha_id}.committed_space_days == 10"

      - name: union_committed_crew_hours_return_to_zero_after_labor_call_cancellation
        grounds:
          - calculations.union_crew_hours_committed
          - state_machines.LaborCall.SCHEDULED_to_CANCELLED
          - entities.UnionJurisdiction.fields.committed_crew_hours
          - entities.LaborCall.fields.billed_hours
        distinguishing_aspect: |
          A third conserved quantity: crew-hours held against a union local, carried to one
          decimal place rather than integer cents or whole days. Booking a 3-member call from
          06:00 to 10:30 charges 13.5 crew-hours to SEIU Local 3; cancelling it must return
          the local to exactly 0.0 and zero the call's billed_hours, because CANCELLED rows
          are excluded from the aggregate. Leaving 13.5 committed silently strangles the
          local's remaining day capacity of 40.0.
        test_recipe:
          setup:
            - "SEIU Local 3 covers CLEANING at straight_time_rate_cents 9533 with min_call_hours 4 and max_crew_hours_per_day 40"
            - "the Meeting Room 301 booking is IN_HOUSE at logical clock 2027-03-01T08:00:00Z"
            - "a LaborCall for 3 crew scheduled 06:00 to 10:30 on 2027-03-01 is SCHEDULED with billed_hours 13.5 and estimated_charge_cents 128696, so the local shows committed_crew_hours 13.5"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/union-jurisdictions"
              payload: { craft_name: "SEIU Local 3", covered_category: "CLEANING", straight_time_rate_cents: 9533, max_crew_hours_per_day: 40, overtime_multiplier: 1.5, min_call_hours: 4, st_window_start_hour: 8, st_window_end_hour: 17 }
              as: VenueAdmin
              captures: { uj_clean_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients/${cl_ssp_id}/deposits"
              payload: { amount_cents: 200000 }
              as: VenueAdmin
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
            - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_id}/license"
              payload: {}
              as: SalesManager
              captures: { lic_id: $.data.id }
            - call: "POST /convention-center/licenses/${lic_id}/issue"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/licenses/${lic_id}/countersign"
              payload: {}
              as: Licensee
              as_user_id: "${cl_ssp_id}"
            - call: "POST /convention-center/bookings/${bk_id}/confirm-definite"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T08:00:00Z" }
              as: VenueAdmin
            - call: "POST /convention-center/bookings/${bk_id}/open-show"
              payload: {}
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/labor-calls"
              payload: { jurisdiction_id: "${uj_clean_id}", work_category: "CLEANING", work_date: "2027-03-01", scheduled_start_hour: 6.0, scheduled_end_hour: 10.5, crew_size: 3 }
              as: EventServicesManager
              captures: { lc_id: $.data.id }
          trigger:
            - call: "POST /convention-center/labor-calls/${lc_id}/cancel"
              payload: {}
              as: EventServicesManager
          assert:
            - "LaborCall.${lc_id}.status == CANCELLED"
            - "LaborCall.${lc_id}.billed_hours == 0.0"
            - "LaborCall.${lc_id}.estimated_charge_cents == 128696"
            - "UnionJurisdiction.${uj_clean_id}.committed_crew_hours == 0.0"
            - "EventBooking.${bk_id}.status == IN_HOUSE"
