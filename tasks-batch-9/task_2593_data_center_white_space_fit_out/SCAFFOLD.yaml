# =============================================================================
# SCAFFOLD.yaml — Data Center White Space Fit-Out
# Sections §1.0 – §1.7. (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2593. Data Center White Space Fit-Out (data center construction team): white space layout with
  rack density, hot/cold aisle containment and cable distribution planning, electrical distribution
  from power distribution units through busway with redundancy topology, cooling capacity and airflow
  modeling with containment and leakage testing, phased commissioning across integrated systems with
  load bank testing scripts, security infrastructure including access control, cages and camera
  coverage, tenant fit-out coordination in a multi-tenant facility with concurrent occupancy,
  capacity release to operations with as-built and asset tagging, change control in live space with
  method-of-procedure approvals

domain_name: data-center-white-space-fit-out
api_prefix: "/"

# Role name groups, referenced by YAML alias from `endpoints[].roles`.
# Purely an authoring convenience: `yaml.safe_load` expands every alias, so each
# endpoint's `roles:` resolves to the plain list of role names shown here.
role_groups:
  staff_read: &STAFF_READ
    - FacilityPlanner
    - ElectricalContractor
    - MechanicalContractor
    - CommissioningAgent
    - WitnessAuthority
    - ChangeManager
    - OperationsManager
    - SecurityAdministrator
  staff_and_tenant_read: &STAFF_TENANT_READ
    - FacilityPlanner
    - ElectricalContractor
    - MechanicalContractor
    - CommissioningAgent
    - WitnessAuthority
    - ChangeManager
    - OperationsManager
    - SecurityAdministrator
    - TenantRepresentative
  mop_authors: &MOP_AUTHORS
    - ElectricalContractor
    - MechanicalContractor

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1 – §0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - multi_tenancy_isolation

  entity_topology: graph
  # Rack <-> Busway is many-to-many through RackFeed; CommissioningPackage and
  # ReleasePacket carry self-referential supersede edges; MethodOfProcedure holds a
  # polymorphic edge to one of four target entity types.

  state_machine_shape: branching
  # MethodOfProcedure is cyclic (REVISION_REQUESTED -> UNDER_REVIEW) and branching
  # (IN_EXECUTION -> {CLOSED, BACKED_OUT}); CommissioningPackage carries two parallel
  # state dimensions (script_status x witness_status) plus a derived compound
  # package_state; Hall.status auto-transitions COMMISSIONING -> LIVE from aggregate
  # child state; ContainmentZone.leakage_status cycles FAIL -> REMEDIATION -> FAIL.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # A MethodOfProcedure author may not approve it; the CommissioningAgent that executed a
  # package script may not witness it; the CommissioningAgent that assembles a
  # ReleasePacket may not accept it.

  consistency_model: immediate

  notes: |
    Two finite pools are competed for and must never drift: electrical kW (PDU -> Busway ->
    RackFeed -> Rack) and cooling kW (CoolingUnit airflow degraded by ContainmentZone leakage).
    Both pools are re-derived on every mutation, and the electrical pool's usable ceiling changes
    algorithm when the Hall crosses into COMMISSIONING, so reservations legal at design time can
    become illegal at phase advance.

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Hall
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label of the data hall"
      - name: code
        type: string
        source: input
        description: "Short hall code"
        constraints: "1-16 chars; unique across Hall"
      - name: tenant_mode
        type: enum
        source: input
        description: "Whether the white space is occupied by one tenant or several"
        constraints: "SINGLE_TENANT | MULTI_TENANT"
      - name: design_kw_capacity
        type: number
        source: input
        description: "Design electrical capacity of the white space in kW"
        constraints: "> 0; 2 decimal places"
      - name: gross_area_sqm
        type: number
        source: input
        description: "Gross white space floor area in square metres"
        constraints: "> 0"
      - name: cooling_redundancy
        type: enum
        source: input
        description: "Mechanical redundancy stance used by the cooling capacity calculation"
        constraints: "N | N_PLUS_1"
      - name: planned_rack_count
        type: integer
        source: input
        description: "Rack positions the layout plans for"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Fit-out phase of the hall"
        default: PLANNING
        constraints: "PLANNING | FIT_OUT | COMMISSIONING | LIVE"
      - name: committed_kw
        type: number
        source: computed
        description: "Step 1 of calculation hall_power_ledger; kW held by non-released RackFeed rows"
        default: 0.00
      - name: commissioning_reserve_kw
        type: number
        source: computed
        description: "Step 2 of calculation hall_power_ledger; load bank reserve tier keyed on committed_kw"
        default: 25.00
      - name: spare_kw
        type: number
        source: computed
        description: "Step 3 of calculation hall_power_ledger; design_kw_capacity - committed_kw - commissioning_reserve_kw"
      - name: chargeable_kw
        type: number
        source: computed
        description: "Output of calculation rack_chargeable_rollup over every rack of this hall"
        default: 0.00
      - name: thermal_load_kw
        type: number
        source: computed
        description: "Diversified rack heat load; see calculation hall_cooling_model"
        default: 0.00
      - name: cooling_capacity_nameplate_kw
        type: number
        source: computed
        description: "Variant NAMEPLATE_SENSIBLE of calculation hall_cooling_model"
        default: 0.00
      - name: cooling_capacity_airflow_kw
        type: number
        source: computed
        description: "Variant AIRFLOW_LIMITED of calculation hall_cooling_model"
        default: 0.00
      - name: cooling_capacity_kw
        type: number
        source: computed
        description: "min of the two hall_cooling_model variants; the gating capacity"
        default: 0.00
      - name: cooling_margin_kw
        type: number
        source: computed
        description: "cooling_capacity_kw - thermal_load_kw"
        default: 0.00
      - name: thermal_posture
        type: enum
        source: computed
        description: "Derived thermal gate; see calculation hall_cooling_model"
        default: NOMINAL
        constraints: "NOMINAL | CONSTRAINED | CRITICAL"
      - name: release_posture
        type: enum
        source: computed
        description: "Derived change/release gate; see calculation hall_release_posture"
        default: OPEN
        constraints: "OPEN | RESTRICTED | LOCKED"
      - name: rack_total_count
        type: integer
        source: computed
        description: "Count of Rack rows of this hall"
        default: 0
      - name: custody_ops_count
        type: integer
        source: computed
        description: "Racks under operational load; count of Rack with status IN {POWERED, RELEASED}"
        default: 0
      - name: custody_fitout_count
        type: integer
        source: computed
        description: "Racks still in fit-out custody; count of Rack with status IN {PLANNED, INSTALLED, AT_RISK}"
        default: 0
      - name: at_risk_rack_count
        type: integer
        source: computed
        description: "Count of Rack with status == AT_RISK"
        default: 0
      - name: open_mop_count
        type: integer
        source: computed
        description: "Count of MethodOfProcedure of this hall with status IN {SCHEDULED, IN_EXECUTION}"
        default: 0

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Tenant legal name"
      - name: code
        type: string
        source: input
        description: "Short tenant code"
        constraints: "1-16 chars; unique across Tenant"
      - name: contracted_kw
        type: number
        source: input
        description: "Contracted electrical entitlement in kW"
        constraints: "> 0; 2 decimal places"
      - name: contract_start_date
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the tenant contract"
      - name: allocated_kw
        type: number
        source: computed
        description: "Sum of Rack.design_kw over racks of this tenant with status != PLANNED"
        default: 0.00

  - name: PowerDistributionUnit
    parent: Hall
    common_fields: true
    fields:
      - name: hall_id
        type: string
        source: input
        description: "FK -> Hall.id; the white space this PDU feeds"
      - name: name
        type: string
        source: input
        description: "PDU label"
      - name: feed_side
        type: enum
        source: input
        description: "Redundant feed side this PDU belongs to"
        constraints: "A | B"
      - name: rated_kw
        type: number
        source: input
        description: "PDU nameplate rating in kW"
        constraints: "> 0; 2 decimal places"
      - name: measured_derate_factor
        type: number
        source: input
        description: "Commissioned derate multiplier measured on site"
        default: 1.00
        constraints: "0.50 <= value <= 1.00; 2 decimal places"
      - name: usable_cap_kw
        type: number
        source: computed
        description: "round(rated_kw * CONTINUOUS_LOAD_FACTOR, 3); the PDU-level ceiling in calculation busway_usable_kw"
      - name: status
        type: enum
        source: system
        description: "Whether the measured derate factor has been recorded"
        default: PLANNED
        constraints: "PLANNED | COMMISSIONED"

  - name: Busway
    parent: PowerDistributionUnit
    common_fields: true
    fields:
      - name: pdu_id
        type: string
        source: input
        description: "FK -> PowerDistributionUnit.id; upstream PDU"
      - name: hall_id
        type: string
        source: computed
        description: "FK -> Hall.id; copied from the parent PDU's hall_id at creation and never changed"
      - name: name
        type: string
        source: input
        description: "Busway run label"
      - name: rated_amps
        type: integer
        source: input
        description: "Busway trunking current rating in amperes"
        constraints: ">= 1"
      - name: voltage_v
        type: integer
        source: input
        description: "Line-to-line volts"
        constraints: "one of 400 | 415 | 480"
      - name: redundancy_topology
        type: enum
        source: input
        description: "Redundancy stance driving TOPOLOGY_FACTOR in calculation busway_usable_kw"
        constraints: "N | N_PLUS_1 | TWO_N"
      - name: feed_side
        type: enum
        source: computed
        description: "Copied from the parent PDU's feed_side at creation"
        constraints: "A | B"
      - name: raw_kw
        type: number
        source: computed
        description: "round(rated_amps * voltage_v * SQRT3 * POWER_FACTOR / 1000, 3)"
      - name: usable_kw
        type: number
        source: computed
        description: "Output of calculation busway_usable_kw under the variant selected by the hall's status"
      - name: usable_variant
        type: enum
        source: computed
        description: "Which busway_usable_kw variant produced usable_kw"
        constraints: "DESIGN | COMMISSIONED"
      - name: committed_kw
        type: number
        source: computed
        description: "round(sum of RackFeed.allocated_kw on this busway with status IN {RESERVED, ENERGIZED, DERATED}, 3)"
        default: 0.000
      - name: feed_count
        type: integer
        source: computed
        description: "Count of RackFeed on this busway with status IN {RESERVED, ENERGIZED, DERATED}"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Electrical state of the busway run"
        default: INSTALLED
        constraints: "INSTALLED | ENERGIZED | ISOLATED"

  - name: Rack
    parent: Hall
    common_fields: true
    fields:
      - name: hall_id
        type: string
        source: input
        description: "FK -> Hall.id; white space that owns this rack position"
      - name: containment_zone_id
        type: string
        source: input
        description: "FK -> ContainmentZone.id; aisle containment zone the rack sits in"
      - name: cage_id
        type: string
        source: input
        description: "FK -> Cage.id; tenant cage the rack sits inside, null for facility-owned positions"
        default: null
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; tenant the rack is allocated to, null when unallocated"
        default: null
      - name: grid_row
        type: string
        source: input
        description: "Floor grid row label"
        constraints: "1-4 chars; (hall_id, grid_row, grid_col) unique"
      - name: grid_col
        type: integer
        source: input
        description: "Floor grid column number"
        constraints: ">= 1; (hall_id, grid_row, grid_col) unique"
      - name: design_kw
        type: number
        source: input
        description: "Designed rack density in kW"
        constraints: "> 0; 2 decimal places"
      - name: required_feed_count
        type: integer
        source: input
        description: "How many energized feeds the rack needs to be POWERED"
        default: 2
        constraints: "1 | 2"
      - name: u_height
        type: integer
        source: input
        description: "Cabinet height in rack units"
        default: 42
        constraints: "one of 42 | 45 | 48"
      - name: asset_tag
        type: string
        source: input
        description: "Asset tag applied during installation; null until tagged"
        default: null
      - name: status
        type: enum
        source: system
        description: "Fit-out lifecycle of the rack position"
        default: PLANNED
        constraints: "PLANNED | INSTALLED | POWERED | AT_RISK | RELEASED"
      - name: pre_risk_status
        type: enum
        source: system
        description: "Status held immediately before the rack was driven AT_RISK; restored on MOP close or back-out"
        default: null
        constraints: "null | POWERED | RELEASED"
      - name: connected_kw
        type: number
        source: computed
        description: "round(sum of RackFeed.allocated_kw for this rack with status IN {RESERVED, ENERGIZED, DERATED}, 3)"
        default: 0.000
      - name: energized_feed_count
        type: integer
        source: computed
        description: "Count of RackFeed for this rack with status == ENERGIZED"
        default: 0
      - name: chargeable_kw
        type: number
        source: computed
        description: "round(design_kw * RACK_OVERHEAD_FACTOR, 2); per-rack rounding step of calculation rack_chargeable_rollup"

  - name: RackFeed
    parent: Rack
    common_fields: true
    fields:
      - name: rack_id
        type: string
        source: input
        description: "FK -> Rack.id; rack drawing this feed"
      - name: busway_id
        type: string
        source: input
        description: "FK -> Busway.id; busway run the feed taps"
      - name: feed_side
        type: enum
        source: computed
        description: "Copied from the busway's feed_side at creation"
        constraints: "A | B"
      - name: allocated_kw
        type: number
        source: computed
        description: "round(requested_kw, 3) captured at creation; the reserved slice of busway capacity"
      - name: breaker_amps
        type: integer
        source: input
        description: "Tap-off breaker size in amperes"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Feed lifecycle; RELEASED is the soft-deleted terminal state"
        default: RESERVED
        constraints: "RESERVED | ENERGIZED | DERATED | RELEASED"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the feed was soft-deleted; null while not RELEASED"
        default: null

  - name: CoolingUnit
    parent: Hall
    common_fields: true
    fields:
      - name: hall_id
        type: string
        source: input
        description: "FK -> Hall.id; white space served by this unit"
      - name: name
        type: string
        source: input
        description: "CRAH/CRAC unit label"
      - name: rated_sensible_kw
        type: number
        source: input
        description: "Nameplate sensible cooling capacity in kW"
        constraints: "> 0; 2 decimal places"
      - name: design_airflow_cfm
        type: integer
        source: input
        description: "Design supply airflow in cubic feet per minute"
        constraints: ">= 1"
      - name: supply_delta_t_f
        type: number
        source: input
        description: "Design supply-to-return temperature difference in degrees Fahrenheit"
        constraints: "> 0; 1 decimal place"
      - name: redundancy_role
        type: enum
        source: input
        description: "Whether the unit is counted as duty or as the redundant spare"
        constraints: "PRIMARY | REDUNDANT"
      - name: measured_airflow_cfm
        type: integer
        source: computed
        description: "Airflow recorded at commissioning; null until commissioned"
        default: null
      - name: airflow_capacity_kw
        type: number
        source: computed
        description: "Per-unit AIRFLOW_LIMITED term of calculation hall_cooling_model; 0.00 until commissioned"
        default: 0.00
      - name: status
        type: enum
        source: system
        description: "Mechanical lifecycle of the unit"
        default: INSTALLED
        constraints: "INSTALLED | COMMISSIONED | IN_SERVICE | MAINTENANCE"

  - name: ContainmentZone
    parent: Hall
    common_fields: true
    fields:
      - name: hall_id
        type: string
        source: input
        description: "FK -> Hall.id; white space the containment zone belongs to"
      - name: label
        type: string
        source: input
        description: "Zone label"
        constraints: "1-16 chars; unique per hall_id"
      - name: zone_type
        type: enum
        source: input
        description: "Aisle the containment encloses"
        constraints: "HOT_AISLE | COLD_AISLE"
      - name: containment_kind
        type: enum
        source: input
        description: "Physical containment construction"
        constraints: "RIGID_ROOF | CURTAIN | CHIMNEY"
      - name: target_leakage_pct
        type: number
        source: input
        description: "Maximum leakage percentage the zone is allowed to measure at"
        constraints: "0 < value <= 25.00; 2 decimal places"
      - name: design_static_pressure_pa
        type: number
        source: input
        description: "Design differential static pressure in pascals"
        constraints: "> 0; 1 decimal place"
      - name: measured_leakage_pct
        type: number
        source: computed
        description: "Leakage recorded by the most recent leakage test; null while UNTESTED"
        default: null
      - name: measured_static_pressure_pa
        type: number
        source: computed
        description: "Static pressure recorded by the most recent leakage test; null while UNTESTED"
        default: null
      - name: leakage_status
        type: enum
        source: system
        description: "Containment integrity state; cycles FAIL -> REMEDIATION -> PASS or FAIL"
        default: UNTESTED
        constraints: "UNTESTED | PASS | FAIL | REMEDIATION"
      - name: test_count
        type: integer
        source: computed
        description: "How many leakage tests have been recorded against this zone"
        default: 0

  - name: Cage
    parent: Hall
    common_fields: true
    fields:
      - name: hall_id
        type: string
        source: input
        description: "FK -> Hall.id; white space the cage is built in"
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; tenant occupying the cage"
      - name: label
        type: string
        source: input
        description: "Cage label"
        constraints: "1-16 chars; unique per hall_id"
      - name: perimeter_length_m
        type: number
        source: input
        description: "Cage mesh perimeter length in metres; denominator of calculation cage_security_coverage"
        constraints: "> 0; 1 decimal place"
      - name: required_camera_coverage_pct
        type: number
        source: input
        description: "Camera coverage percentage the cage must reach before release"
        default: 95.00
        constraints: "0 < value <= 100.00; 2 decimal places"
      - name: required_reader_zone_count
        type: integer
        source: input
        description: "Distinct access-control reader zones the cage must have ACTIVE before release"
        default: 2
        constraints: ">= 1"
      - name: camera_coverage_pct
        type: number
        source: computed
        description: "Output of calculation cage_security_coverage; 0.00 when the cage has no ACTIVE camera"
        default: 0.00
      - name: active_reader_zone_count
        type: integer
        source: computed
        description: "Count of distinct SecurityDevice.reader_zone_label with device_type == CARD_READER and status == ACTIVE"
        default: 0
      - name: operational_status
        type: enum
        source: system
        description: "Security/handover state of the cage"
        default: FIT_OUT
        constraints: "FIT_OUT | SECURED | DEGRADED | RELEASED"

  - name: SecurityDevice
    parent: Cage
    common_fields: true
    fields:
      - name: cage_id
        type: string
        source: input
        description: "FK -> Cage.id; cage the device protects"
      - name: device_type
        type: enum
        source: input
        description: "Kind of security infrastructure"
        constraints: "CAMERA | CARD_READER"
      - name: label
        type: string
        source: input
        description: "Device label"
      - name: covered_length_m
        type: number
        source: input
        description: "Metres of cage perimeter the camera covers; required for CAMERA, must be omitted for CARD_READER"
        default: null
        constraints: "> 0; 1 decimal place"
      - name: reader_zone_label
        type: string
        source: input
        description: "Access-control zone the reader arms; required for CARD_READER, must be omitted for CAMERA"
        default: null
      - name: status
        type: enum
        source: system
        description: "Whether the device has been commissioned and counts toward coverage"
        default: PLANNED
        constraints: "PLANNED | ACTIVE"

  - name: CommissioningPackage
    parent: Hall
    common_fields: true
    fields:
      - name: hall_id
        type: string
        source: input
        description: "FK -> Hall.id; white space being commissioned"
      - name: level
        type: enum
        source: input
        description: "Commissioning level of the integrated systems test"
        constraints: "L1 | L2 | L3 | L4 | L5"
      - name: title
        type: string
        source: input
        description: "Package title"
      - name: target_load_kw
        type: number
        source: input
        description: "Load the package's scripts must demonstrate in kW"
        constraints: "> 0; 2 decimal places"
      - name: script_revision
        type: integer
        source: computed
        description: "Revision of the approved test script; 0 until approve-script"
        default: 0
      - name: script_status
        type: enum
        source: system
        description: "First parallel state dimension; advances independently of witness_status"
        default: NOT_STARTED
        constraints: "NOT_STARTED | SCRIPT_APPROVED | EXECUTED"
      - name: witness_status
        type: enum
        source: system
        description: "Second parallel state dimension; advances independently of script_status"
        default: PENDING
        constraints: "PENDING | WITNESSED | REJECTED | BLOCKED"
      - name: package_state
        type: enum
        source: computed
        description: "Compound state derived from script_status x witness_status; see calculation package_state_projection"
        default: DRAFT
        constraints: "DRAFT | IN_EXECUTION | CERTIFIED | FAILED | BLOCKED | SUPERSEDED"
      - name: executed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CommissioningAgent that executed the script; null until executed"
        default: null
      - name: witnessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the WitnessAuthority that signed the witness decision; null until witnessed"
        default: null
      - name: superseded_by_package_id
        type: string
        source: system
        description: "Id of the CommissioningPackage of the same hall and level that superseded this one; null when current"
        default: null
      - name: measured_load_kw
        type: number
        source: computed
        description: "Highest LoadBankTest.measured_kw among COMPLETED tests of this package; null when none"
        default: null

  - name: LoadBankTest
    parent: CommissioningPackage
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> CommissioningPackage.id; package whose script this run executes"
      - name: target_kw
        type: number
        source: input
        description: "Load bank set point in kW; consumes the hall commissioning reserve for its window"
        constraints: "> 0; 2 decimal places"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the test window; closed-interval left endpoint"
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the test window; closed-interval right endpoint"
        constraints: "> window_start"
      - name: step_pct_sequence
        type: array
        source: input
        description: "Ascending load steps as integer percentages of target_kw; last element must equal 100"
        constraints: "1-6 integers, strictly ascending, each 1-100, last == 100"
      - name: status
        type: enum
        source: system
        description: "Load bank run lifecycle"
        default: SCHEDULED
        constraints: "SCHEDULED | RUNNING | COMPLETED | ABORTED"
      - name: measured_kw
        type: number
        source: computed
        description: "Load recorded at completion; null until COMPLETED"
        default: null
      - name: measured_return_delta_t_f
        type: number
        source: computed
        description: "Return-air delta T recorded at completion in degrees Fahrenheit; null until COMPLETED"
        default: null
      - name: result
        type: enum
        source: computed
        description: "Output of calculation load_bank_result; null until COMPLETED"
        default: null
        constraints: "null | PASS | FAIL"
      - name: abort_reason
        type: string
        source: system
        description: "Reason captured when the run was aborted; null otherwise"
        default: null

  - name: MethodOfProcedure
    parent: Hall
    common_fields: true
    fields:
      - name: hall_id
        type: string
        source: input
        description: "FK -> Hall.id; white space the change is executed in"
      - name: target_resource_type
        type: enum
        source: input
        description: "Which entity type target_resource_id points at"
        constraints: "BUSWAY | COOLING_UNIT | CONTAINMENT_ZONE | RACK"
      - name: target_resource_id
        type: string
        source: input
        description: "Polymorphic reference resolved against target_resource_type (Busway.id, CoolingUnit.id, ContainmentZone.id or Rack.id); must exist and its hall_id must equal this MOP's hall_id"
      - name: title
        type: string
        source: input
        description: "MOP title"
      - name: risk_class
        type: enum
        source: input
        description: "Risk class driving required_approval_count and live-space eligibility"
        constraints: "LOW | MEDIUM | HIGH"
      - name: backout_plan
        type: string
        source: input
        description: "Written back-out plan; must be non-empty at submit"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the change window; half-open interval left endpoint"
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the change window; half-open interval right endpoint"
        constraints: "> window_start"
      - name: status
        type: enum
        source: system
        description: "Change-control lifecycle; cycles through REVISION_REQUESTED and branches at IN_EXECUTION"
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | SCHEDULED | IN_EXECUTION | CLOSED | BACKED_OUT | REJECTED"
      - name: author_user_id
        type: string
        source: system
        description: "X-User-ID captured from the create call; the segregation-of-duties subject"
      - name: revision_count
        type: integer
        source: computed
        description: "How many times the MOP has been revised after a REQUEST_REVISION decision"
        default: 0
      - name: approval_count
        type: integer
        source: computed
        description: "Count of MopApproval rows for this MOP with decision == APPROVE"
        default: 0
      - name: required_approval_count
        type: integer
        source: computed
        description: "1 for LOW and MEDIUM, 2 for HIGH; see calculation mop_approval_requirement"
      - name: tenant_notified_ids
        type: array
        source: computed
        description: "Tenant ids recorded at schedule time as notified of the change window"
        default: []
      - name: pre_execution_target_state
        type: string
        source: system
        description: "Status of the target resource captured at execute, restored on close or back-out; null before execution"
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant the MOP entered IN_EXECUTION; null before"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the MOP reached CLOSED or BACKED_OUT; null before"
        default: null

  - name: MopApproval
    parent: MethodOfProcedure
    common_fields: false
    fields:
      - name: mop_id
        type: string
        source: input
        description: "FK -> MethodOfProcedure.id; the MOP being decided on"
      - name: approver_role
        type: enum
        source: computed
        description: "X-User-Role of the decider, captured from the request header"
        constraints: "ChangeManager | OperationsManager"
      - name: approver_user_id
        type: string
        source: computed
        description: "X-User-ID of the decider, captured from the request header"
      - name: decision
        type: enum
        source: input
        description: "Decision recorded on the MOP"
        constraints: "APPROVE | REQUEST_REVISION | REJECT"
      - name: comment
        type: string
        source: input
        description: "Reviewer comment"
      - name: sequence
        type: integer
        source: computed
        description: "1-based position of this approval among the MOP's approvals ordered by created_at ASC"

  - name: ReleasePacket
    parent: Cage
    common_fields: true
    fields:
      - name: hall_id
        type: string
        source: input
        description: "FK -> Hall.id; white space the capacity is released from"
      - name: cage_id
        type: string
        source: input
        description: "FK -> Cage.id; cage whose racks are handed to operations"
      - name: as_built_drawing_ref
        type: string
        source: input
        description: "Reference of the as-built drawing set accompanying the handover"
        constraints: "non-empty, 1-64 chars"
      - name: status
        type: enum
        source: system
        description: "Handover lifecycle; SUSPENDED is re-entrant from ACCEPTED"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | SUSPENDED | REJECTED | SUPERSEDED"
      - name: released_kw
        type: number
        source: computed
        description: "Output of calculation rack_chargeable_rollup restricted to the cage's in-scope racks"
        default: 0.00
      - name: rack_in_scope_count
        type: integer
        source: computed
        description: "Count of Rack with cage_id == this cage and status IN {POWERED, AT_RISK, RELEASED}"
        default: 0
      - name: asset_tag_completion_pct
        type: number
        source: computed
        description: "Output of calculation asset_tag_completion; 100.00 means every in-scope rack carries an asset_tag"
        default: 0.00
      - name: supersedes_packet_id
        type: string
        source: system
        description: "Id of the prior ReleasePacket of the same cage that this packet superseded; null when none"
        default: null
      - name: accepted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the OperationsManager that accepted the handover; null until accepted"
        default: null
      - name: rejected_reason
        type: string
        source: system
        description: "Reason captured on rejection; null otherwise"
        default: null

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: Hall
    initial_state: PLANNING
    terminal_states: [LIVE]
    transitions:
      - from: PLANNING
        to: FIT_OUT
        trigger: "POST /halls/{hall_id}/advance-phase with target_status == FIT_OUT"
        actor: FacilityPlanner
        preconditions:
          - "hall has >= 1 PowerDistributionUnit with feed_side == A and >= 1 with feed_side == B"
          - "hall has >= 1 Busway"
          - "hall has >= 1 ContainmentZone"
        side_effects:
          - "Hall.status = FIT_OUT; Hall.version += 1"
          - "recompute calculation hall_power_ledger (committed_kw, commissioning_reserve_kw, spare_kw)"
      - from: FIT_OUT
        to: COMMISSIONING
        trigger: "POST /halls/{hall_id}/advance-phase with target_status == COMMISSIONING"
        actor: FacilityPlanner
        preconditions:
          - "every ContainmentZone of the hall has leakage_status == PASS"
          - "hall has >= 1 CoolingUnit with status == IN_SERVICE"
          - "hall has >= 1 Rack with status == POWERED"
          - "for every Busway of the hall, busway.committed_kw <= the COMMISSIONED variant of calculation busway_usable_kw for that busway"
        side_effects:
          - "Hall.status = COMMISSIONING"
          - "for every Busway of the hall: usable_variant = COMMISSIONED and usable_kw recomputed under that variant (derived-field reconciliation; usable_kw drops whenever the upstream PDU measured_derate_factor < 1.00)"
          - "recompute calculation hall_power_ledger; committed_kw and commissioning_reserve_kw are unchanged by the variant switch"
      - from: COMMISSIONING
        to: LIVE
        trigger: "system, evaluated after every CommissioningPackage witness decision"
        actor: system
        preconditions:
          - "hall has >= 1 CommissioningPackage with package_state != SUPERSEDED"
          - "every CommissioningPackage of the hall with package_state != SUPERSEDED has package_state == CERTIFIED"
          - "the set of levels among those packages includes both L4 and L5"
        side_effects:
          - "Hall.status = LIVE"
          - "recompute calculation hall_release_posture"
        note: "The only path to LIVE; POST /halls/{hall_id}/advance-phase never accepts target_status == LIVE."

  - entity: PowerDistributionUnit
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: COMMISSIONED
        trigger: "PATCH /pdus/{pdu_id}"
        actor: ElectricalContractor
        preconditions:
          - "hall.status != LIVE, or an APPROVED MethodOfProcedure covering this PDU's hall is IN_EXECUTION"
        side_effects:
          - "PowerDistributionUnit.measured_derate_factor = request value; status = COMMISSIONED"
          - "for every Busway of this PDU: usable_kw recomputed under the busway's current usable_variant"

  - entity: Busway
    initial_state: INSTALLED
    terminal_states: []
    transitions:
      - from: INSTALLED
        to: ENERGIZED
        trigger: "POST /busways/{busway_id}/energize"
        actor: ElectricalContractor
        preconditions:
          - "hall.status IN {FIT_OUT, COMMISSIONING, LIVE}"
          - "the parent PowerDistributionUnit has status == COMMISSIONED"
        side_effects:
          - "Busway.status = ENERGIZED"
          - "recompute Busway.usable_kw under the variant selected by hall.status"
      - from: ENERGIZED
        to: ISOLATED
        trigger: "system, on POST /mops/{mop_id}/execute where target_resource_type == BUSWAY and target_resource_id == this busway"
        actor: system
        preconditions:
          - "the executing MethodOfProcedure was in status SCHEDULED"
        side_effects:
          - "Busway.status = ISOLATED (cascade A, link 2)"
          - "because the busway is ISOLATED, every RackFeed on it with status == ENERGIZED moves to DERATED (cascade A, link 3)"
      - from: ISOLATED
        to: ENERGIZED
        trigger: "system, on POST /mops/{mop_id}/close or POST /mops/{mop_id}/back-out for the MOP that isolated it"
        actor: system
        preconditions:
          - "MethodOfProcedure.pre_execution_target_state == ENERGIZED"
        side_effects:
          - "Busway.status = ENERGIZED"
          - "because the busway is ENERGIZED again, every RackFeed on it with status == DERATED moves back to ENERGIZED"

  - entity: ContainmentZone
    initial_state: UNTESTED
    terminal_states: []
    transitions:
      - from: UNTESTED
        to: PASS
        trigger: "POST /containment-zones/{zone_id}/leakage-test"
        actor: MechanicalContractor
        preconditions:
          - "hall.status != LIVE, or an APPROVED MethodOfProcedure targeting this zone is IN_EXECUTION"
          - "measured_leakage_pct <= target_leakage_pct AND measured_static_pressure_pa >= round(design_static_pressure_pa * 0.90, 2)"
        side_effects:
          - "measured_leakage_pct / measured_static_pressure_pa stored; test_count += 1; leakage_status = PASS"
          - "recompute calculation hall_cooling_model for the hall"
          - "recompute calculation hall_release_posture; every CommissioningPackage of the hall with witness_status == BLOCKED returns to PENDING once hall.thermal_posture == NOMINAL"
      - from: UNTESTED
        to: FAIL
        trigger: "POST /containment-zones/{zone_id}/leakage-test"
        actor: MechanicalContractor
        preconditions:
          - "measured_leakage_pct > target_leakage_pct OR measured_static_pressure_pa < round(design_static_pressure_pa * 0.90, 2)"
        side_effects:
          - "measured_leakage_pct / measured_static_pressure_pa stored; test_count += 1; leakage_status = FAIL (cascade B, link 1)"
          - "because the hall's worst measured leakage rose, calculation hall_cooling_model is recomputed: cooling_capacity_airflow_kw falls, cooling_margin_kw falls and thermal_posture may become CONSTRAINED or CRITICAL (cascade B, link 2)"
          - "because thermal_posture != NOMINAL, every CommissioningPackage of the hall with level IN {L4, L5} and witness_status == PENDING moves to BLOCKED (cascade B, link 3)"
      - from: FAIL
        to: REMEDIATION
        trigger: "POST /containment-zones/{zone_id}/remediate"
        actor: MechanicalContractor
        preconditions:
          - "leakage_status == FAIL"
        side_effects:
          - "leakage_status = REMEDIATION; measured_leakage_pct and measured_static_pressure_pa cleared to null"
          - "recompute calculation hall_cooling_model (a zone in REMEDIATION is excluded from the worst-leakage selection)"
      - from: REMEDIATION
        to: PASS
        trigger: "POST /containment-zones/{zone_id}/leakage-test"
        actor: MechanicalContractor
        preconditions:
          - "measured_leakage_pct <= target_leakage_pct AND measured_static_pressure_pa >= round(design_static_pressure_pa * 0.90, 2)"
        side_effects:
          - "same side effects as UNTESTED -> PASS"
      - from: REMEDIATION
        to: FAIL
        trigger: "POST /containment-zones/{zone_id}/leakage-test"
        actor: MechanicalContractor
        preconditions:
          - "measured_leakage_pct > target_leakage_pct OR measured_static_pressure_pa < round(design_static_pressure_pa * 0.90, 2)"
        side_effects:
          - "same side effects as UNTESTED -> FAIL; the zone re-enters the FAIL -> REMEDIATION -> FAIL cycle"
        note: "A zone already in PASS is never re-tested; POST leakage-test from PASS is rejected with ERR_INVALID_STATE."

  - entity: CoolingUnit
    initial_state: INSTALLED
    terminal_states: []
    transitions:
      - from: INSTALLED
        to: COMMISSIONED
        trigger: "POST /cooling-units/{unit_id}/commission"
        actor: MechanicalContractor
        preconditions:
          - "hall.status IN {FIT_OUT, COMMISSIONING, LIVE}"
          - "measured_airflow_cfm >= design_airflow_cfm * 0.90"
        side_effects:
          - "measured_airflow_cfm stored; airflow_capacity_kw computed per calculation hall_cooling_model; status = COMMISSIONED"
      - from: COMMISSIONED
        to: IN_SERVICE
        trigger: "POST /cooling-units/{unit_id}/place-in-service"
        actor: MechanicalContractor
        preconditions:
          - "status == COMMISSIONED"
        side_effects:
          - "status = IN_SERVICE"
          - "recompute calculation hall_cooling_model for the hall (the unit now enters both capacity variants)"
      - from: IN_SERVICE
        to: MAINTENANCE
        trigger: "system, on POST /mops/{mop_id}/execute where target_resource_type == COOLING_UNIT and target_resource_id == this unit"
        actor: system
        preconditions:
          - "the executing MethodOfProcedure was in status SCHEDULED"
        side_effects:
          - "status = MAINTENANCE"
          - "because the unit left service, calculation hall_cooling_model is recomputed and thermal_posture may fall"
      - from: MAINTENANCE
        to: IN_SERVICE
        trigger: "system, on POST /mops/{mop_id}/close or POST /mops/{mop_id}/back-out for the MOP that took it out"
        actor: system
        preconditions:
          - "MethodOfProcedure.pre_execution_target_state == IN_SERVICE"
        side_effects:
          - "status = IN_SERVICE; recompute calculation hall_cooling_model"

  - entity: RackFeed
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: ENERGIZED
        trigger: "system, on POST /racks/{rack_id}/power-on for the owning rack"
        actor: system
        preconditions:
          - "the feed's busway has status == ENERGIZED"
        side_effects:
          - "RackFeed.status = ENERGIZED; Rack.energized_feed_count recomputed"
      - from: ENERGIZED
        to: DERATED
        trigger: "system, cascade from Busway ENERGIZED -> ISOLATED"
        actor: system
        preconditions:
          - "the feed's busway moved to ISOLATED in this request"
        side_effects:
          - "RackFeed.status = DERATED; allocated_kw still counts toward Busway.committed_kw and Hall.committed_kw"
          - "because the owning rack lost an energized feed, Rack.energized_feed_count is recomputed and the rack may move to AT_RISK (cascade A, link 4)"
      - from: DERATED
        to: ENERGIZED
        trigger: "system, cascade from Busway ISOLATED -> ENERGIZED"
        actor: system
        preconditions:
          - "the feed's busway moved to ENERGIZED in this request"
        side_effects:
          - "RackFeed.status = ENERGIZED; Rack.energized_feed_count recomputed; the rack returns to pre_risk_status"
      - from: RESERVED
        to: RELEASED
        trigger: "DELETE /rack-feeds/{feed_id}"
        actor: ElectricalContractor
        preconditions:
          - "status == RESERVED"
          - "the owning rack has status IN {PLANNED, INSTALLED}"
        side_effects:
          - "status = RELEASED; released_at = logical clock now (soft delete; the row stays queryable via include_released)"
          - "Busway.committed_kw and Busway.feed_count recomputed; Rack.connected_kw recomputed"
          - "recompute calculation hall_power_ledger: committed_kw falls, commissioning_reserve_kw re-tiers, spare_kw restored"

  - entity: Rack
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: INSTALLED
        trigger: "POST /racks/{rack_id}/install"
        actor: FacilityPlanner
        preconditions:
          - "hall.status IN {FIT_OUT, COMMISSIONING, LIVE}"
        side_effects:
          - "status = INSTALLED; asset_tag stored when supplied"
          - "recompute Hall.custody_fitout_count, Hall.chargeable_kw and Tenant.allocated_kw"
      - from: INSTALLED
        to: POWERED
        trigger: "POST /racks/{rack_id}/power-on"
        actor: ElectricalContractor
        preconditions:
          - "hall.status IN {FIT_OUT, COMMISSIONING, LIVE}"
          - "hall.release_posture != LOCKED"
          - "count of RackFeed for this rack with status == RESERVED equals required_feed_count"
          - "when required_feed_count == 2 the two feeds have distinct feed_side values"
          - "every such feed's busway has status == ENERGIZED"
          - "the rack's ContainmentZone has leakage_status == PASS"
          - "hall.cooling_margin_kw computed with this rack included is >= 0.00"
        side_effects:
          - "every RESERVED feed of the rack moves to ENERGIZED; energized_feed_count recomputed"
          - "status = POWERED; Hall.custody_ops_count += 1 and Hall.custody_fitout_count -= 1"
          - "recompute calculation hall_cooling_model (thermal_load_kw rises)"
      - from: POWERED
        to: AT_RISK
        trigger: "system, cascade from RackFeed ENERGIZED -> DERATED"
        actor: system
        preconditions:
          - "energized_feed_count < required_feed_count after the feed cascade"
        side_effects:
          - "pre_risk_status = POWERED; status = AT_RISK (cascade A, link 4)"
          - "Hall.custody_ops_count -= 1; Hall.custody_fitout_count += 1; Hall.at_risk_rack_count += 1"
          - "because the rack is AT_RISK, its Cage (when cage_id is not null) moves SECURED or RELEASED -> DEGRADED and any ACCEPTED ReleasePacket of that cage moves to SUSPENDED (cascade A, link 5)"
          - "recompute calculation hall_release_posture"
      - from: RELEASED
        to: AT_RISK
        trigger: "system, cascade from RackFeed ENERGIZED -> DERATED"
        actor: system
        preconditions:
          - "energized_feed_count < required_feed_count after the feed cascade"
        side_effects:
          - "pre_risk_status = RELEASED; status = AT_RISK; same link-5 cascade as POWERED -> AT_RISK"
      - from: AT_RISK
        to: POWERED
        trigger: "system, cascade from RackFeed DERATED -> ENERGIZED"
        actor: system
        preconditions:
          - "pre_risk_status == POWERED and energized_feed_count == required_feed_count"
        side_effects:
          - "status = POWERED; pre_risk_status = null; Hall custody counters and at_risk_rack_count restored"
      - from: AT_RISK
        to: RELEASED
        trigger: "system, cascade from RackFeed DERATED -> ENERGIZED"
        actor: system
        preconditions:
          - "pre_risk_status == RELEASED and energized_feed_count == required_feed_count"
        side_effects:
          - "status = RELEASED; pre_risk_status = null; Hall custody counters restored"
      - from: POWERED
        to: RELEASED
        trigger: "system, on POST /release-packets/{packet_id}/accept covering this rack"
        actor: system
        preconditions:
          - "the rack's cage_id equals the accepted packet's cage_id"
        side_effects:
          - "status = RELEASED; custody stays on the operations side of calculation rack_custody_partition"

  - entity: SecurityDevice
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /security-devices/{device_id}/commission"
        actor: SecurityAdministrator
        preconditions:
          - "status == PLANNED"
        side_effects:
          - "status = ACTIVE"
          - "recompute calculation cage_security_coverage for the owning cage (camera_coverage_pct, active_reader_zone_count)"
          - "when the recomputed values satisfy both cage gates and cage.operational_status == FIT_OUT, the cage moves to SECURED"

  - entity: Cage
    initial_state: FIT_OUT
    terminal_states: []
    transitions:
      - from: FIT_OUT
        to: SECURED
        trigger: "system, on POST /security-devices/{device_id}/commission"
        actor: system
        preconditions:
          - "camera_coverage_pct >= required_camera_coverage_pct"
          - "active_reader_zone_count >= required_reader_zone_count"
        side_effects:
          - "operational_status = SECURED"
      - from: SECURED
        to: DEGRADED
        trigger: "system, cascade from Rack POWERED|RELEASED -> AT_RISK"
        actor: system
        preconditions:
          - "the cage has >= 1 Rack with status == AT_RISK after the rack cascade"
        side_effects:
          - "operational_status = DEGRADED (cascade A, link 5)"
      - from: RELEASED
        to: DEGRADED
        trigger: "system, cascade from Rack POWERED|RELEASED -> AT_RISK"
        actor: system
        preconditions:
          - "the cage has >= 1 Rack with status == AT_RISK after the rack cascade"
        side_effects:
          - "operational_status = DEGRADED"
      - from: DEGRADED
        to: SECURED
        trigger: "system, cascade from Rack AT_RISK -> POWERED"
        actor: system
        preconditions:
          - "the cage has 0 Rack with status == AT_RISK and no ACCEPTED ReleasePacket for this cage"
        side_effects:
          - "operational_status = SECURED"
      - from: DEGRADED
        to: RELEASED
        trigger: "system, cascade from Rack AT_RISK -> RELEASED"
        actor: system
        preconditions:
          - "the cage has 0 Rack with status == AT_RISK and a ReleasePacket of this cage returns to ACCEPTED"
        side_effects:
          - "operational_status = RELEASED"
      - from: SECURED
        to: RELEASED
        trigger: "system, on POST /release-packets/{packet_id}/accept"
        actor: system
        preconditions:
          - "the accepted packet's cage_id equals this cage's id"
        side_effects:
          - "operational_status = RELEASED"

  - entity: CommissioningPackage
    initial_state: "script_status = NOT_STARTED x witness_status = PENDING"
    terminal_states: [SUPERSEDED]
    transitions:
      - from: "script_status = NOT_STARTED"
        to: "script_status = SCRIPT_APPROVED"
        trigger: "POST /commissioning-packages/{package_id}/approve-script"
        actor: CommissioningAgent
        preconditions:
          - "hall.status == COMMISSIONING"
          - "package_state != SUPERSEDED"
          - "script_status == NOT_STARTED"
        side_effects:
          - "script_status = SCRIPT_APPROVED; script_revision = request value"
          - "witness_status is untouched (parallel dimension)"
          - "package_state re-derived by calculation package_state_projection"
      - from: "script_status = SCRIPT_APPROVED"
        to: "script_status = EXECUTED"
        trigger: "POST /commissioning-packages/{package_id}/execute-script"
        actor: CommissioningAgent
        preconditions:
          - "script_status == SCRIPT_APPROVED"
          - "hall.thermal_posture == NOMINAL"
          - "when level IN {L4, L5}: the package has >= 1 LoadBankTest with status == COMPLETED, result == PASS and measured_kw >= target_load_kw"
        side_effects:
          - "script_status = EXECUTED; executed_by_user_id = X-User-ID of the caller"
          - "when witness_status == REJECTED it is reset to PENDING (the witness dimension re-opens for the new run)"
          - "package_state re-derived"
      - from: "witness_status = PENDING"
        to: "witness_status = WITNESSED"
        trigger: "POST /commissioning-packages/{package_id}/witness with decision == WITNESSED"
        actor: WitnessAuthority
        preconditions:
          - "script_status == EXECUTED"
          - "hall.thermal_posture == NOMINAL"
          - "X-User-ID of the witness differs from executed_by_user_id (segregation of duties)"
        side_effects:
          - "witness_status = WITNESSED; witnessed_by_user_id = X-User-ID of the caller"
          - "package_state = CERTIFIED"
          - "because a package certified, the hall re-evaluates COMMISSIONING -> LIVE"
      - from: "witness_status = PENDING"
        to: "witness_status = REJECTED"
        trigger: "POST /commissioning-packages/{package_id}/witness with decision == REJECTED"
        actor: WitnessAuthority
        preconditions:
          - "script_status == EXECUTED"
          - "X-User-ID of the witness differs from executed_by_user_id"
        side_effects:
          - "witness_status = REJECTED; package_state = FAILED"
          - "script_status is rolled back EXECUTED -> SCRIPT_APPROVED so the run can be repeated (cycle on the script dimension)"
      - from: "witness_status = PENDING"
        to: "witness_status = BLOCKED"
        trigger: "system, cascade B link 3 from a ContainmentZone leakage FAIL"
        actor: system
        preconditions:
          - "level IN {L4, L5} and hall.thermal_posture != NOMINAL"
        side_effects:
          - "witness_status = BLOCKED; package_state = BLOCKED"
      - from: "witness_status = BLOCKED"
        to: "witness_status = PENDING"
        trigger: "system, on any recompute of calculation hall_cooling_model that returns thermal_posture to NOMINAL"
        actor: system
        preconditions:
          - "hall.thermal_posture == NOMINAL"
        side_effects:
          - "witness_status = PENDING; package_state re-derived"
      - from: "package_state = any of {DRAFT, IN_EXECUTION, CERTIFIED, FAILED, BLOCKED}"
        to: "package_state = SUPERSEDED"
        trigger: "system, on POST /commissioning-packages creating a new package with the same hall_id and level"
        actor: system
        preconditions:
          - "the prior package's package_state != SUPERSEDED"
        side_effects:
          - "package_state = SUPERSEDED; superseded_by_package_id = id of the new package"
          - "the superseded package no longer participates in the hall's COMMISSIONING -> LIVE evaluation"
        note: "Parallel dimensions: script_status and witness_status move independently; package_state is never written directly, it is always the output of calculation package_state_projection."

  - entity: LoadBankTest
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /load-bank-tests/{test_id}/start"
        actor: CommissioningAgent
        preconditions:
          - "logical clock now >= window_start AND logical clock now < window_end"
          - "the package's script_status == SCRIPT_APPROVED"
          - "hall.thermal_posture == NOMINAL"
        side_effects:
          - "status = RUNNING"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /load-bank-tests/{test_id}/complete"
        actor: CommissioningAgent
        preconditions:
          - "status == RUNNING"
        side_effects:
          - "measured_kw and measured_return_delta_t_f stored; result set by calculation load_bank_result"
          - "CommissioningPackage.measured_load_kw recomputed as the maximum measured_kw over COMPLETED tests"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /load-bank-tests/{test_id}/abort"
        actor: CommissioningAgent
        preconditions:
          - "status IN {SCHEDULED, RUNNING}"
        side_effects:
          - "status = ABORTED; abort_reason stored"
          - "the run stops occupying the hall commissioning reserve window used by validation priority 22"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /load-bank-tests/{test_id}/abort"
        actor: CommissioningAgent
        preconditions:
          - "status IN {SCHEDULED, RUNNING}"
        side_effects:
          - "status = ABORTED; abort_reason stored; measured_kw stays null"

  - entity: MethodOfProcedure
    initial_state: DRAFT
    terminal_states: [CLOSED, BACKED_OUT, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /mops/{mop_id}/submit"
        actor: *MOP_AUTHORS
        preconditions:
          - "backout_plan is non-empty"
          - "window_start >= logical clock now"
          - "when hall.status == LIVE and target_resource_type IN {BUSWAY, COOLING_UNIT}: risk_class == HIGH"
        side_effects:
          - "status = UNDER_REVIEW; required_approval_count set by calculation mop_approval_requirement"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /mops/{mop_id}/approvals with decision == APPROVE"
        actor: [ChangeManager, OperationsManager]
        preconditions:
          - "X-User-ID != author_user_id (segregation of duties)"
          - "no earlier APPROVE approval in the current review round carries the same approver_user_id"
          - "when risk_class == HIGH the second APPROVE must come from a different approver_role than the first"
          - "approval_count + 1 == required_approval_count"
        side_effects:
          - "a MopApproval row is appended; approval_count recomputed by calculation mop_approval_requirement"
          - "status = APPROVED"
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /mops/{mop_id}/approvals with decision == APPROVE that does not yet reach the quorum"
        actor: [ChangeManager, OperationsManager]
        preconditions:
          - "X-User-ID != author_user_id"
          - "approval_count + 1 < required_approval_count"
        side_effects:
          - "a MopApproval row is appended; approval_count += 1; status stays UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /mops/{mop_id}/approvals with decision == REQUEST_REVISION"
        actor: [ChangeManager, OperationsManager]
        preconditions:
          - "X-User-ID != author_user_id"
        side_effects:
          - "a MopApproval row is appended; status = REVISION_REQUESTED"
          - "approval_count resets to 0 because the current review round closed (calculation mop_approval_requirement counts only approvals created after the latest REQUEST_REVISION row)"
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /mops/{mop_id}/revise"
        actor: *MOP_AUTHORS
        preconditions:
          - "revision_count < MAX_MOP_REVISIONS"
          - "X-User-ID == author_user_id"
        side_effects:
          - "supplied window_start / window_end / backout_plan / risk_class overwrite the stored values"
          - "revision_count += 1; status = UNDER_REVIEW; required_approval_count re-derived from the (possibly new) risk_class"
        note: "Cycle: UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW, at most MAX_MOP_REVISIONS times."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /mops/{mop_id}/approvals with decision == REJECT"
        actor: [ChangeManager, OperationsManager]
        preconditions:
          - "X-User-ID != author_user_id"
        side_effects:
          - "a MopApproval row is appended; status = REJECTED (terminal)"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /mops/{mop_id}/schedule"
        actor: ChangeManager
        preconditions:
          - "no other MethodOfProcedure with status IN {SCHEDULED, IN_EXECUTION} on the same target_resource_id has a window colliding under the buffered rule of validation priority 21"
          - "when hall.tenant_mode == MULTI_TENANT and risk_class == HIGH: tenant_notified_ids contains every Tenant id that owns >= 1 Cage in the hall"
        side_effects:
          - "status = SCHEDULED; tenant_notified_ids stored"
          - "Hall.open_mop_count recomputed; recompute calculation hall_release_posture"
      - from: SCHEDULED
        to: IN_EXECUTION
        trigger: "POST /mops/{mop_id}/execute"
        actor: *MOP_AUTHORS
        preconditions:
          - "logical clock now >= window_start AND logical clock now < window_end"
          - "X-User-ID == author_user_id"
          - "no other MethodOfProcedure of the same hall has status == IN_EXECUTION"
        side_effects:
          - "status = IN_EXECUTION; executed_at = logical clock now; pre_execution_target_state = current status of the target resource (cascade A, link 1)"
          - "hall.release_posture = LOCKED because open_mop_count now includes an IN_EXECUTION MOP"
          - "when target_resource_type == BUSWAY the target busway moves ENERGIZED -> ISOLATED, which drives the RackFeed / Rack / Cage / ReleasePacket chain (cascade A, links 2-5)"
          - "when target_resource_type == COOLING_UNIT the target unit moves IN_SERVICE -> MAINTENANCE and calculation hall_cooling_model is recomputed"
      - from: IN_EXECUTION
        to: CLOSED
        trigger: "POST /mops/{mop_id}/close"
        actor: *MOP_AUTHORS
        preconditions:
          - "X-User-ID == author_user_id"
        side_effects:
          - "status = CLOSED; closed_at = logical clock now"
          - "the target resource is restored to pre_execution_target_state, which reverses the whole cascade: feeds DERATED -> ENERGIZED, racks AT_RISK -> pre_risk_status, cages DEGRADED -> SECURED or RELEASED, ReleasePackets SUSPENDED -> ACCEPTED"
          - "recompute calculation hall_release_posture and calculation rack_custody_partition"
      - from: IN_EXECUTION
        to: BACKED_OUT
        trigger: "POST /mops/{mop_id}/back-out"
        actor: *MOP_AUTHORS
        preconditions:
          - "X-User-ID == author_user_id"
        side_effects:
          - "status = BACKED_OUT; closed_at = logical clock now"
          - "identical restoration to CLOSED: every cascade-A side effect is compensated so that calculation rack_custody_partition returns to its pre-execute values"
        note: "Branching: IN_EXECUTION forks to CLOSED (work completed) or BACKED_OUT (work abandoned); both restore state, only the terminal status differs."

  - entity: ReleasePacket
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /release-packets/{packet_id}/submit"
        actor: CommissioningAgent
        preconditions:
          - "rack_in_scope_count >= 1"
          - "asset_tag_completion_pct == 100.00"
          - "cage.camera_coverage_pct >= cage.required_camera_coverage_pct AND cage.active_reader_zone_count >= cage.required_reader_zone_count"
        side_effects:
          - "status = SUBMITTED; released_kw and asset_tag_completion_pct frozen for the review"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /release-packets/{packet_id}/accept"
        actor: OperationsManager
        preconditions:
          - "hall.status == LIVE"
          - "hall.release_posture == OPEN"
          - "every Rack of the cage with status == POWERED has energized_feed_count == required_feed_count"
        side_effects:
          - "status = ACCEPTED; accepted_by_user_id = X-User-ID of the caller"
          - "every Rack of the cage with status == POWERED moves to RELEASED"
          - "the Cage moves SECURED -> RELEASED"
          - "recompute calculation rack_custody_partition for the hall"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /release-packets/{packet_id}/reject"
        actor: OperationsManager
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status = REJECTED; rejected_reason stored"
      - from: ACCEPTED
        to: SUSPENDED
        trigger: "system, cascade A link 5 from a Rack of this cage moving to AT_RISK"
        actor: system
        preconditions:
          - "the cage has >= 1 Rack with status == AT_RISK"
        side_effects:
          - "status = SUSPENDED"
      - from: SUSPENDED
        to: ACCEPTED
        trigger: "system, on POST /mops/{mop_id}/close or POST /mops/{mop_id}/back-out restoring the racks"
        actor: system
        preconditions:
          - "the cage has 0 Rack with status == AT_RISK"
        side_effects:
          - "status = ACCEPTED"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system, on POST /release-packets creating a new packet for the same cage_id"
        actor: system
        preconditions:
          - "the prior packet's status IN {ACCEPTED, SUSPENDED, SUBMITTED}"
        side_effects:
          - "prior packet status = SUPERSEDED; the new packet's supersedes_packet_id = prior packet id"
      - from: SUSPENDED
        to: SUPERSEDED
        trigger: "system, on POST /release-packets creating a new packet for the same cage_id"
        actor: system
        preconditions:
          - "the prior packet's status IN {ACCEPTED, SUSPENDED, SUBMITTED}"
        side_effects:
          - "prior packet status = SUPERSEDED"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system, on POST /release-packets creating a new packet for the same cage_id"
        actor: system
        preconditions:
          - "the prior packet's status IN {ACCEPTED, SUSPENDED, SUBMITTED}"
        side_effects:
          - "prior packet status = SUPERSEDED"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on a parent entity's `version`)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: release-packet-create-stale-cage
    parent_entity: Cage
    write_endpoint: "POST /release-packets"
    occ_field: "expected_cage_version"
    description: |
      Creating a ReleasePacket for a Cage whose version has advanced since the client last
      observed it is rejected. Packet creation legitimately supersedes any prior packet of the
      same cage, so a second create is not blocked by any state precondition; the OCC check on
      Cage.version is what makes the writer prove its view of the cage (coverage percentages,
      operational_status, rack membership) is current before the supersede happens.
    error_id: ERR_STALE_CAGE_VERSION
    http_status: 412

  - rule_id: commissioning-package-create-stale-hall
    parent_entity: Hall
    write_endpoint: "POST /commissioning-packages"
    occ_field: "expected_hall_version"
    description: |
      Creating a CommissioningPackage against a Hall whose version has advanced since the client
      last observed it is rejected. A new package for an existing hall and level legitimately
      supersedes the prior one, so no state precondition rejects the second create; the OCC check
      on Hall.version forces the agent to re-read the hall's committed_kw, reserve tier and
      postures before superseding, because any RackFeed reservation or posture recompute bumps
      Hall.version.
    error_id: ERR_STALE_HALL_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: busway_usable_kw
    trigger: "On Busway creation, on POST /busways/{busway_id}/energize, on PATCH /pdus/{pdu_id}, and on the Hall FIT_OUT -> COMMISSIONING transition (which flips usable_variant)"
    algorithm: threshold
    formula: |
      raw_kw    = round(busway.rated_amps * busway.voltage_v * SQRT3 * POWER_FACTOR / 1000, 3)
      topo      = TOPOLOGY_FACTOR[busway.redundancy_topology]      # conditional branch on entity state
      pdu_cap   = round(pdu.rated_kw * CONTINUOUS_LOAD_FACTOR, 3)  # third independent input
      trunk_kw  = raw_kw * CONTINUOUS_LOAD_FACTOR * topo           # UNROUNDED inside the min()
      base_kw   = min(trunk_kw, pdu_cap)                           # nested min over trunk vs upstream PDU
      if variant == DESIGN:        usable_kw = round(base_kw, 2)
      if variant == COMMISSIONED:  usable_kw = round(base_kw * pdu.measured_derate_factor, 2)
      # Rounding order is pinned: min() is taken on unrounded operands, the derate multiplication is
      # applied to the unrounded min(), and exactly one round to 2 dp closes the formula.
    input_set: "The busway's own rated_amps / voltage_v / redundancy_topology plus the parent PDU's rated_kw and measured_derate_factor. Nothing about RackFeed rows enters this formula."
    constants:
      SQRT3: 1.732
      POWER_FACTOR: 0.95
      CONTINUOUS_LOAD_FACTOR: 0.80
      TOPOLOGY_FACTOR_N: 1.00
      TOPOLOGY_FACTOR_N_PLUS_1: 0.90
      TOPOLOGY_FACTOR_TWO_N: 0.50
    precision: "raw_kw and pdu_cap at 3 decimal places, usable_kw at 2 decimal places, round_half_up"
    variants:
      - name: DESIGN
        when: "hall.status IN {PLANNING, FIT_OUT}; Busway.usable_variant == DESIGN"
        difference: "Ignores the PDU's measured derate entirely — design-time reservations are checked against nameplate-derived capacity."
      - name: COMMISSIONED
        when: "hall.status IN {COMMISSIONING, LIVE}; Busway.usable_variant == COMMISSIONED"
        difference: "Multiplies the same base_kw by pdu.measured_derate_factor, so identical inputs yield a strictly smaller usable_kw whenever measured_derate_factor < 1.00. Reservations that were legal under DESIGN can therefore exceed usable_kw after the phase advance, which is why the FIT_OUT -> COMMISSIONING transition re-checks every busway."

  - name: hall_power_ledger
    trigger: "On POST /rack-feeds, on DELETE /rack-feeds/{feed_id}, on Hall phase advance, and on any cascade that changes a RackFeed status"
    algorithm: waterfall_allocation
    formula: |
      # Circular-looking dependency: the reserve tier is keyed on committed_kw while spare_kw is
      # keyed on the reserve. Evaluation order is pinned and never re-entered.
      # Step 1
      committed_kw = round(SUM(feed.allocated_kw
                               FOR feed IN RackFeed
                               WHERE feed.rack.hall_id == hall.id
                                 AND feed.status IN {RESERVED, ENERGIZED, DERATED}), 2)
      # Step 2 — tier lookup keyed on the Step 1 value only
      if committed_kw <= RESERVE_TIER_1_MAX:        commissioning_reserve_kw = RESERVE_TIER_1_KW
      elif committed_kw <= RESERVE_TIER_2_MAX:      commissioning_reserve_kw = RESERVE_TIER_2_KW
      else:                                        commissioning_reserve_kw = RESERVE_TIER_3_KW
      # Step 3
      spare_kw = round(hall.design_kw_capacity - committed_kw - commissioning_reserve_kw, 2)
      # Step 2 is NEVER recomputed from spare_kw; the three fields always satisfy
      # committed_kw + commissioning_reserve_kw + spare_kw == hall.design_kw_capacity
    input_set: "RackFeed rows of the hall with status IN {RESERVED, ENERGIZED, DERATED}; RELEASED feeds are excluded, which is what makes the reserve/release pair conserve the ledger."
    constants:
      RESERVE_TIER_1_MAX: 100.00
      RESERVE_TIER_1_KW: 25.00
      RESERVE_TIER_2_MAX: 250.00
      RESERVE_TIER_2_KW: 50.00
      RESERVE_TIER_3_KW: 75.00
    precision: "2 decimal places, round_half_up; tier comparisons are inclusive on the upper bound (committed_kw == 100.00 stays in tier 1)"

  - name: rack_chargeable_rollup
    trigger: "On POST /racks/{rack_id}/install, on POST /racks/{rack_id}/power-on, on ReleasePacket creation and submit, and on any Rack status cascade"
    algorithm: aggregation
    formula: |
      # Rounding ORDER is pinned: round each rack first, then sum. Summing first and rounding once
      # yields a different result and is wrong.
      per_rack_kw = round(rack.design_kw * RACK_OVERHEAD_FACTOR, 2)     # ROUND_HALF_UP, per rack
      hall.chargeable_kw = round(SUM(per_rack_kw
                                     FOR rack IN Rack
                                     WHERE rack.hall_id == hall.id
                                       AND rack.status IN {INSTALLED, POWERED, AT_RISK, RELEASED}), 2)
      packet.released_kw = round(SUM(per_rack_kw
                                     FOR rack IN Rack
                                     WHERE rack.cage_id == packet.cage_id
                                       AND rack.status IN {POWERED, AT_RISK, RELEASED}), 2)
    input_set: "Racks of the hall with status IN {INSTALLED, POWERED, AT_RISK, RELEASED} for the hall roll-up; racks of the cage with status IN {POWERED, AT_RISK, RELEASED} for the packet roll-up. PLANNED racks never contribute."
    constants:
      RACK_OVERHEAD_FACTOR: 1.045
    precision: "per-rack value rounded to 2 decimal places round_half_up BEFORE summation; the sum is rounded to 2 decimal places again (a no-op when every term is already 2 dp)"

  - name: hall_cooling_model
    trigger: "On POST /cooling-units/{unit_id}/commission, on place-in-service, on POST /containment-zones/{zone_id}/leakage-test, on remediate, on POST /racks/{rack_id}/power-on, on any Rack status cascade, and on any CoolingUnit IN_SERVICE <-> MAINTENANCE cascade"
    algorithm: constraint_propagation
    formula: |
      # ---- demand -------------------------------------------------------------
      thermal_load_kw = round(SUM(rack.design_kw
                                  FOR rack IN Rack
                                  WHERE rack.hall_id == hall.id
                                    AND rack.status IN {POWERED, AT_RISK, RELEASED}) * DIVERSITY_FACTOR, 2)
      # ---- worst containment leakage -----------------------------------------
      tested = [z FOR z IN ContainmentZone WHERE z.hall_id == hall.id AND z.leakage_status IN {PASS, FAIL}]
      leak_fraction = 0.00 if tested is empty else MAX(z.measured_leakage_pct FOR z IN tested) / 100
      # ---- supply, variant 1 --------------------------------------------------
      duty = [u FOR u IN CoolingUnit WHERE u.hall_id == hall.id AND u.status == IN_SERVICE]
      gross_nameplate = SUM(u.rated_sensible_kw FOR u IN duty)
      cooling_capacity_nameplate_kw =
          round(gross_nameplate - (MAX(u.rated_sensible_kw FOR u IN duty) if hall.cooling_redundancy == N_PLUS_1 and duty is non-empty else 0.00), 2)
      # ---- supply, variant 2 --------------------------------------------------
      u.airflow_capacity_kw = round(u.measured_airflow_cfm * (1 - leak_fraction) * u.supply_delta_t_f * AIRFLOW_BTU_COEFF / BTU_PER_KW, 5)
      gross_airflow = SUM(u.airflow_capacity_kw FOR u IN duty)
      cooling_capacity_airflow_kw =
          round(gross_airflow - (MAX(u.airflow_capacity_kw FOR u IN duty) if hall.cooling_redundancy == N_PLUS_1 and duty is non-empty else 0.00), 2)
      # ---- gate ---------------------------------------------------------------
      cooling_capacity_kw = min(cooling_capacity_nameplate_kw, cooling_capacity_airflow_kw)
      cooling_margin_kw   = round(cooling_capacity_kw - thermal_load_kw, 2)
      if cooling_margin_kw >= 0.00:                    thermal_posture = NOMINAL
      elif cooling_margin_kw >= CRITICAL_MARGIN_KW:    thermal_posture = CONSTRAINED
      else:                                            thermal_posture = CRITICAL
      # Evaluation order pinned: demand first from the racks ALREADY in a load-bearing status, then
      # leakage, then both supply variants, then the gate. The candidate rack of a power-on request is
      # added to thermal_load_kw exactly once for the precondition check and the model is not re-entered.
    input_set: "Racks with status IN {POWERED, AT_RISK, RELEASED}; CoolingUnits with status == IN_SERVICE (MAINTENANCE units are excluded); ContainmentZones with leakage_status IN {PASS, FAIL} (UNTESTED and REMEDIATION zones are excluded from the worst-leakage selection)."
    constants:
      DIVERSITY_FACTOR: 0.85
      AIRFLOW_BTU_COEFF: 1.08
      BTU_PER_KW: 3412
      CRITICAL_MARGIN_KW: -25.00
    precision: "per-unit airflow_capacity_kw at 5 decimal places, both capacity variants and the margin at 2 decimal places, round_half_up"
    variants:
      - name: NAMEPLATE_SENSIBLE
        when: "Always computed; published as Hall.cooling_capacity_nameplate_kw"
        difference: "Uses manufacturer sensible ratings and is blind to containment leakage — a leaking hot aisle does not change this number at all."
      - name: AIRFLOW_LIMITED
        when: "Always computed; published as Hall.cooling_capacity_airflow_kw"
        difference: "Converts measured airflow to kW and discounts it by the hall's WORST measured containment leakage, so the same units yield a different capacity; the gate uses min() of the two, so which variant binds flips as leakage changes."

  - name: cage_security_coverage
    trigger: "On POST /security-devices/{device_id}/commission and on ReleasePacket creation"
    algorithm: aggregation
    formula: |
      covered_m = SUM(d.covered_length_m
                      FOR d IN SecurityDevice
                      WHERE d.cage_id == cage.id AND d.device_type == CAMERA AND d.status == ACTIVE)
      camera_coverage_pct = 0.00 if that set is empty
                            else round(min(100.00, covered_m / cage.perimeter_length_m * 100), 2)
      active_reader_zone_count = COUNT(DISTINCT d.reader_zone_label
                                       FOR d IN SecurityDevice
                                       WHERE d.cage_id == cage.id AND d.device_type == CARD_READER AND d.status == ACTIVE)
    input_set: "SecurityDevice rows of the cage with status == ACTIVE only; PLANNED devices contribute nothing, so an uncommissioned camera leaves coverage at 0.00."
    constants: {}
    precision: "camera_coverage_pct at 2 decimal places, round_half_up; the release gate compares with >= so exactly 95.00 against a 95.00 requirement passes"

  - name: asset_tag_completion
    trigger: "On POST /release-packets and on POST /release-packets/{packet_id}/submit"
    algorithm: aggregation
    formula: |
      in_scope = [r FOR r IN Rack WHERE r.cage_id == packet.cage_id AND r.status IN {POWERED, AT_RISK, RELEASED}]
      rack_in_scope_count = COUNT(in_scope)
      tagged = COUNT(r FOR r IN in_scope WHERE r.asset_tag IS NOT NULL AND r.asset_tag != "")
      asset_tag_completion_pct = 0.00 if rack_in_scope_count == 0
                                 else round(tagged / rack_in_scope_count * 100, 2)
    input_set: "Racks of the cage with status IN {POWERED, AT_RISK, RELEASED}. An empty in-scope set is NOT treated as 100 percent complete; submit rejects it with ERR_RELEASE_SCOPE_EMPTY."
    constants: {}
    precision: "2 decimal places, round_half_up; submit requires exactly 100.00"

  - name: package_state_projection
    trigger: "After every write to CommissioningPackage.script_status or witness_status, and on supersede"
    algorithm: projection
    formula: |
      if superseded_by_package_id IS NOT NULL:                          package_state = SUPERSEDED
      elif witness_status == BLOCKED:                                   package_state = BLOCKED
      elif witness_status == REJECTED:                                  package_state = FAILED
      elif script_status == EXECUTED and witness_status == WITNESSED:    package_state = CERTIFIED
      elif script_status IN {SCRIPT_APPROVED, EXECUTED}:                 package_state = IN_EXECUTION
      else:                                                             package_state = DRAFT
    input_set: "Only the package's own two parallel dimensions plus superseded_by_package_id. The order of the branches is the specification: BLOCKED outranks REJECTED, and SUPERSEDED outranks both."
    constants: {}
    precision: "n/a (enumeration)"

  - name: load_bank_result
    trigger: "On POST /load-bank-tests/{test_id}/complete"
    algorithm: threshold
    formula: |
      kw_ok    = measured_kw >= round(test.target_kw * LOADBANK_TOLERANCE, 2)
      delta_ok = measured_return_delta_t_f >= LOADBANK_MIN_RETURN_DELTA_T_F
      result   = PASS if (kw_ok AND delta_ok) else FAIL
    input_set: "The single completing test's own measured values against its own target_kw."
    constants:
      LOADBANK_TOLERANCE: 0.95
      LOADBANK_MIN_RETURN_DELTA_T_F: 8.0
    precision: "threshold computed at 2 decimal places round_half_up; comparison is inclusive (>=)"

  - name: mop_approval_requirement
    trigger: "On POST /mops/{mop_id}/submit, on every POST /mops/{mop_id}/approvals, and on POST /mops/{mop_id}/revise"
    algorithm: aggregation
    formula: |
      required_approval_count = 2 if risk_class == HIGH else 1
      # Current review round = approvals created strictly after the latest REQUEST_REVISION row,
      # ordered by MopApproval.created_at ASC (never by id).
      round_start = created_at of the latest MopApproval of this MOP with decision == REQUEST_REVISION,
                    or the MOP's own created_at when no such row exists
      approval_count = COUNT(a FOR a IN MopApproval
                             WHERE a.mop_id == mop.id AND a.decision == APPROVE
                               AND a.created_at > round_start)
    input_set: "MopApproval rows of this MOP only, filtered to the current review round; REJECT and REQUEST_REVISION rows never count toward the quorum."
    constants:
      MAX_MOP_REVISIONS: 2
    precision: "integer counts; the quorum comparison is equality on approval_count + 1 == required_approval_count for the transition to APPROVED"

  - name: hall_release_posture
    trigger: "After every MOP schedule / execute / close / back-out, every Rack status change, and every recompute of hall_cooling_model"
    algorithm: projection
    formula: |
      if COUNT(m FOR m IN MethodOfProcedure WHERE m.hall_id == hall.id AND m.status == IN_EXECUTION) > 0:
          release_posture = LOCKED
      elif hall.at_risk_rack_count > 0 OR hall.thermal_posture != NOMINAL:
          release_posture = RESTRICTED
      else:
          release_posture = OPEN
      open_mop_count = COUNT(m FOR m IN MethodOfProcedure
                             WHERE m.hall_id == hall.id AND m.status IN {SCHEDULED, IN_EXECUTION})
    input_set: "MethodOfProcedure rows of the hall with status IN {SCHEDULED, IN_EXECUTION}, the hall's at_risk_rack_count and its thermal_posture. Branch order is the specification: LOCKED outranks RESTRICTED."
    constants: {}
    precision: "n/a (enumeration)"

  - name: rack_custody_partition
    trigger: "After every Rack status change, including every cascaded one"
    algorithm: aggregation
    formula: |
      rack_total_count     = COUNT(r FOR r IN Rack WHERE r.hall_id == hall.id)
      custody_ops_count    = COUNT(r WHERE r.status IN {POWERED, RELEASED})
      custody_fitout_count = COUNT(r WHERE r.status IN {PLANNED, INSTALLED, AT_RISK})
      at_risk_rack_count   = COUNT(r WHERE r.status == AT_RISK)
      # Conserved quantity: custody_ops_count + custody_fitout_count == rack_total_count must hold
      # after EVERY request, including mid-cascade recomputes. A MOP execute moves racks from the ops
      # side to the fit-out side; close or back-out moves exactly the same racks back.
    input_set: "Every Rack of the hall; the two custody sets partition the five rack statuses with no overlap and no gap."
    constants: {}
    precision: "integer counts"

  - name: mop_window_collision_set
    trigger: "On POST /mops/{mop_id}/schedule"
    algorithm: interval_merge
    formula: |
      # Half-open windows [window_start, window_end) on ONE target resource, with a symmetric
      # settle buffer applied to both sides.
      buffer = MOP_SETTLE_BUFFER_MIN minutes
      collides(new, other) = (new.window_start < other.window_end + buffer)
                         AND (new.window_end + buffer > other.window_start)
      collision_set = [other FOR other IN MethodOfProcedure
                       WHERE other.id != new.id
                         AND other.target_resource_id == new.target_resource_id
                         AND other.status IN {SCHEDULED, IN_EXECUTION}
                         AND collides(new, other)]
      # A gap of exactly MOP_SETTLE_BUFFER_MIN minutes does NOT collide (strict <).
    input_set: "MethodOfProcedure rows sharing the same target_resource_id with status IN {SCHEDULED, IN_EXECUTION}. DRAFT, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, CLOSED, BACKED_OUT and REJECTED MOPs never occupy a window."
    constants:
      MOP_SETTLE_BUFFER_MIN: 60
    precision: "minute resolution on ISO 8601 UTC instants"

  - name: load_bank_window_occupancy
    trigger: "On POST /load-bank-tests"
    algorithm: interval_merge
    formula: |
      # CLOSED windows [window_start, window_end] on the HALL, with aggregate capacity rather than
      # pairwise exclusion. Touching endpoints DO collide, unlike mop_window_collision_set.
      overlaps(new, other) = (new.window_start <= other.window_end)
                         AND (new.window_end   >= other.window_start)
      peers = [t FOR t IN LoadBankTest
               WHERE t.package.hall_id == new.package.hall_id
                 AND t.status IN {SCHEDULED, RUNNING}
                 AND overlaps(new, t)]
      concurrent_count = COUNT(peers) + 1
      reserve_demand_kw = round(SUM(t.target_kw FOR t IN peers) + new.target_kw, 2)
      # Both gates are inclusive: concurrent_count <= CONCURRENT_LOADBANK_MAX and
      # reserve_demand_kw <= hall.commissioning_reserve_kw.
    input_set: "LoadBankTest rows of the same hall (reached through package.hall_id) with status IN {SCHEDULED, RUNNING}; COMPLETED and ABORTED runs release their slice of the reserve."
    constants:
      CONCURRENT_LOADBANK_MAX: 2
    precision: "2 decimal places round_half_up on reserve_demand_kw; integer count comparison"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "X-User-ID header is present on every endpoint that records or compares an acting identity"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: "POST /commissioning-packages/{package_id}/execute-script, POST /commissioning-packages/{package_id}/witness, POST /mops, POST /mops/{mop_id}/submit, POST /mops/{mop_id}/approvals, POST /mops/{mop_id}/revise, POST /mops/{mop_id}/execute, POST /mops/{mop_id}/close, POST /mops/{mop_id}/back-out, POST /release-packets/{packet_id}/accept"

  - priority: 4
    category: business_constraint
    check: "request body shape: every required field of the §1.5 input is present, enums are in domain, numeric fields obey their §1.1 constraints (> 0 where declared, 2 decimal places on kW fields), datetimes are ISO 8601 UTC, window_end > window_start on every window-bearing payload, and step_pct_sequence is a comma-separated ascending list of integers in 1..100"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: existence
    check: "every templated path segment resolves to an existing row, validated left to right"
    error_id: "ERR_HALL_NOT_FOUND | ERR_TENANT_NOT_FOUND | ERR_PDU_NOT_FOUND | ERR_BUSWAY_NOT_FOUND | ERR_RACK_NOT_FOUND | ERR_RACK_FEED_NOT_FOUND | ERR_COOLING_UNIT_NOT_FOUND | ERR_CONTAINMENT_ZONE_NOT_FOUND | ERR_CAGE_NOT_FOUND | ERR_SECURITY_DEVICE_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_LOAD_BANK_TEST_NOT_FOUND | ERR_MOP_NOT_FOUND | ERR_RELEASE_PACKET_NOT_FOUND (whichever segment fails first)"
    http_status: 404
    applies_to: "all endpoints with a templated path"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (hall_id, tenant_id, pdu_id, busway_id, rack_id, containment_zone_id, cage_id, package_id, supersedes_packet_id)"
    error_id: "the matching ERR_<PARENT>_NOT_FOUND from priority 5"
    http_status: 404
    applies_to: "POST /pdus, POST /busways, POST /racks, POST /rack-feeds, POST /cooling-units, POST /containment-zones, POST /cages, POST /security-devices, POST /commissioning-packages, POST /load-bank-tests, POST /mops, POST /release-packets"

  - priority: 7
    category: business_referential
    check: "MethodOfProcedure.target_resource_id is polymorphic: it must resolve to an existing row of the entity named by target_resource_type (BUSWAY -> Busway, COOLING_UNIT -> CoolingUnit, CONTAINMENT_ZONE -> ContainmentZone, RACK -> Rack) and that row's hall_id must equal the MOP's hall_id"
    error_id: ERR_MOP_TARGET_NOT_FOUND
    http_status: 404
    applies_to: "POST /mops"

  - priority: 8
    category: business_referential
    check: "cross-parent hall consistency: a Rack's containment_zone_id and cage_id must belong to the rack's hall_id; a Busway's hall_id must equal its PDU's hall_id; a RackFeed's busway must belong to the same hall as its rack; a ReleasePacket's cage_id must belong to its hall_id; a LoadBankTest's package must belong to the hall the caller names; a Cage's tenant must be the tenant of every rack the cage already contains"
    error_id: ERR_HALL_MISMATCH
    http_status: 422
    applies_to: "POST /racks, POST /busways, POST /rack-feeds, POST /release-packets, POST /cages"

  - priority: 9
    category: auth
    check: "multi-tenancy isolation: when X-User-Role == TenantRepresentative, X-User-ID must equal the Tenant id that owns the addressed Cage, Rack or ReleasePacket, and tenant-scoped list endpoints are filtered to that tenant"
    error_id: ERR_TENANT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /cages/{cage_id}, GET /cages, GET /racks, GET /racks/{rack_id}, GET /release-packets, GET /release-packets/{packet_id}, GET /halls/{hall_id}/capacity-summary"

  - priority: 10
    category: business_referential
    check: "human-readable identifier uniqueness: Hall.code and Tenant.code are globally unique; Busway.name is unique per pdu_id; ContainmentZone.label and Cage.label are unique per hall_id; SecurityDevice.label is unique per cage_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /halls, POST /tenants, POST /busways, POST /containment-zones, POST /cages, POST /security-devices"

  - priority: 11
    category: business_referential
    check: "white space layout uniqueness: (hall_id, grid_row, grid_col) is unique across Rack — two racks cannot occupy the same floor position"
    error_id: ERR_DUPLICATE_GRID_POSITION
    http_status: 409
    applies_to: "POST /racks"

  - priority: 12
    category: business_referential
    check: "(rack_id, feed_side) is unique across RackFeed rows whose status != RELEASED — a rack takes at most one live A-side and one live B-side feed; a RELEASED feed frees its side for re-reservation"
    error_id: ERR_DUPLICATE_FEED_SIDE
    http_status: 409
    applies_to: "POST /rack-feeds"

  - priority: 13
    category: state
    check: "expected_cage_version equals the addressed Cage's current version (§1.2.1 rule release-packet-create-stale-cage)"
    error_id: ERR_STALE_CAGE_VERSION
    http_status: 412
    applies_to: "POST /release-packets"

  - priority: 14
    category: state
    check: "expected_hall_version equals the addressed Hall's current version (§1.2.1 rule commissioning-package-create-stale-hall)"
    error_id: ERR_STALE_HALL_VERSION
    http_status: 412
    applies_to: "POST /commissioning-packages"

  - priority: 15
    category: state
    check: "the target row is in a from-state that §1.2 declares for the requested transition — includes leakage-test from PASS, remediate from anything but FAIL, energize from ENERGIZED or ISOLATED, place-in-service from INSTALLED, start/complete/abort of a LoadBankTest outside its declared from-state, approve-script from SCRIPT_APPROVED or EXECUTED, witness before execute, witness of a SUPERSEDED package, submit/approve/revise/schedule/execute/close/back-out of a MOP outside its declared from-state, and submit/accept/reject of a ReleasePacket outside its declared from-state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 16
    category: state
    check: "hall phase gate: POST /rack-feeds requires hall.status IN {FIT_OUT, COMMISSIONING}; POST /racks/{rack_id}/install and POST /racks/{rack_id}/power-on require hall.status IN {FIT_OUT, COMMISSIONING, LIVE}; POST /busways/{busway_id}/energize requires hall.status != PLANNING; POST /commissioning-packages and its script actions require hall.status == COMMISSIONING; POST /release-packets/{packet_id}/accept requires hall.status == LIVE; POST /halls/{hall_id}/advance-phase requires target_status to be the immediate successor of hall.status and never LIVE"
    error_id: ERR_HALL_PHASE_INVALID
    http_status: 409
    applies_to: "POST /rack-feeds, POST /racks/{rack_id}/install, POST /racks/{rack_id}/power-on, POST /busways/{busway_id}/energize, POST /commissioning-packages, POST /commissioning-packages/{package_id}/approve-script, POST /release-packets/{packet_id}/accept, POST /halls/{hall_id}/advance-phase"

  - priority: 17
    category: state
    check: "a Busway may only be energized when its parent PowerDistributionUnit has status == COMMISSIONED"
    error_id: ERR_PDU_NOT_COMMISSIONED
    http_status: 409
    applies_to: "POST /busways/{busway_id}/energize"

  - priority: 18
    category: state
    check: "cross-entity busway state: POST /rack-feeds is rejected when the named busway has status == ISOLATED, and POST /racks/{rack_id}/power-on is rejected when ANY of the rack's RESERVED feeds sits on a busway whose status != ENERGIZED"
    error_id: ERR_BUSWAY_NOT_ENERGIZED
    http_status: 409
    applies_to: "POST /rack-feeds, POST /racks/{rack_id}/power-on"

  - priority: 19
    category: state
    check: "cross-entity package state: POST /load-bank-tests and POST /load-bank-tests/{test_id}/start require the parent CommissioningPackage to have script_status == SCRIPT_APPROVED"
    error_id: ERR_SCRIPT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /load-bank-tests, POST /load-bank-tests/{test_id}/start"

  - priority: 20
    category: state
    check: "phased commissioning order: a CommissioningPackage of level L(n) cannot have its script approved until every lower level already created for the hall has package_state == CERTIFIED or SUPERSEDED; in particular L5 requires a CERTIFIED L4"
    error_id: ERR_LEVEL_PREREQ_NOT_MET
    http_status: 409
    applies_to: "POST /commissioning-packages/{package_id}/approve-script"

  - priority: 21
    category: business_temporal
    check: "method-of-procedure window exclusivity on one target: per calculation mop_window_collision_set, no other MethodOfProcedure with status IN {SCHEDULED, IN_EXECUTION} on the same target_resource_id may collide with this MOP's [window_start, window_end) window widened by MOP_SETTLE_BUFFER_MIN on both sides"
    error_id: ERR_MOP_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /mops/{mop_id}/schedule"

  - priority: 22
    category: business_temporal
    check: "load bank concurrency ceiling on the hall: per calculation load_bank_window_occupancy, concurrent_count (SCHEDULED or RUNNING tests of the same hall whose closed windows overlap the requested one, plus this one) must be <= CONCURRENT_LOADBANK_MAX"
    error_id: ERR_LOADBANK_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /load-bank-tests"

  - priority: 23
    category: business_temporal
    check: "execution window: POST /mops/{mop_id}/execute and POST /load-bank-tests/{test_id}/start require logical clock now >= window_start AND logical clock now < window_end; POST /mops/{mop_id}/submit requires window_start >= logical clock now"
    error_id: ERR_OUTSIDE_EXECUTION_WINDOW
    http_status: 409
    applies_to: "POST /mops/{mop_id}/execute, POST /mops/{mop_id}/submit, POST /load-bank-tests/{test_id}/start"

  - priority: 24
    category: business_temporal
    check: "one live change at a time per white space: no other MethodOfProcedure of the same hall may have status == IN_EXECUTION when this one executes"
    error_id: ERR_HALL_MOP_ALREADY_EXECUTING
    http_status: 409
    applies_to: "POST /mops/{mop_id}/execute"

  - priority: 25
    category: business_safety
    check: "live-space change control: when hall.status == LIVE, PATCH /pdus/{pdu_id}, POST /containment-zones/{zone_id}/leakage-test, POST /containment-zones/{zone_id}/remediate and POST /cooling-units/{unit_id}/commission require an APPROVED-then-SCHEDULED MethodOfProcedure with status == IN_EXECUTION whose target_resource_id is that resource (or, for a PDU, one of its busways)"
    error_id: ERR_MOP_REQUIRED
    http_status: 409
    applies_to: "PATCH /pdus/{pdu_id}, POST /containment-zones/{zone_id}/leakage-test, POST /containment-zones/{zone_id}/remediate, POST /cooling-units/{unit_id}/commission"

  - priority: 26
    category: business_safety
    check: "risk classification floor: when hall.status == LIVE and target_resource_type IN {BUSWAY, COOLING_UNIT}, the MOP must carry risk_class == HIGH before it can leave DRAFT"
    error_id: ERR_RISK_CLASS_TOO_LOW
    http_status: 422
    applies_to: "POST /mops/{mop_id}/submit"

  - priority: 27
    category: business_safety
    check: "segregation of duties on commissioning: the witnessing X-User-ID must differ from CommissioningPackage.executed_by_user_id"
    error_id: ERR_WITNESS_SAME_AS_EXECUTOR
    http_status: 422
    applies_to: "POST /commissioning-packages/{package_id}/witness"

  - priority: 28
    category: business_safety
    check: "segregation of duties on change control: the approving X-User-ID must differ from MethodOfProcedure.author_user_id"
    error_id: ERR_APPROVER_IS_AUTHOR
    http_status: 422
    applies_to: "POST /mops/{mop_id}/approvals"

  - priority: 29
    category: business_safety
    check: "quorum integrity: no approver_user_id may appear twice among the APPROVE decisions of the current review round"
    error_id: ERR_DUPLICATE_APPROVER
    http_status: 409
    applies_to: "POST /mops/{mop_id}/approvals"

  - priority: 30
    category: business_safety
    check: "role diversity on HIGH risk MOPs: when risk_class == HIGH, the second APPROVE of the current round must come from a different approver_role than the first (one ChangeManager and one OperationsManager)"
    error_id: ERR_APPROVAL_ROLE_NOT_DISTINCT
    http_status: 422
    applies_to: "POST /mops/{mop_id}/approvals"

  - priority: 31
    category: business_safety
    check: "execution custody: POST /mops/{mop_id}/execute, /revise, /close and /back-out require X-User-ID == MethodOfProcedure.author_user_id"
    error_id: ERR_MOP_EXECUTOR_NOT_AUTHOR
    http_status: 403
    applies_to: "POST /mops/{mop_id}/execute, POST /mops/{mop_id}/revise, POST /mops/{mop_id}/close, POST /mops/{mop_id}/back-out"

  - priority: 32
    category: business_safety
    check: "containment integrity before energisation: the rack's ContainmentZone must have leakage_status == PASS"
    error_id: ERR_CONTAINMENT_NOT_PASSED
    http_status: 409
    applies_to: "POST /racks/{rack_id}/power-on"

  - priority: 33
    category: business_safety
    check: "thermal gate: hall.thermal_posture must be NOMINAL for POST /commissioning-packages/{package_id}/execute-script, POST /commissioning-packages/{package_id}/witness with decision == WITNESSED, and POST /load-bank-tests/{test_id}/start"
    error_id: ERR_THERMAL_POSTURE_NOT_NOMINAL
    http_status: 409
    applies_to: "POST /commissioning-packages/{package_id}/execute-script, POST /commissioning-packages/{package_id}/witness, POST /load-bank-tests/{test_id}/start"

  - priority: 34
    category: business_constraint
    check: "phase prerequisites: PLANNING -> FIT_OUT requires >= 1 PDU on feed_side A, >= 1 PDU on feed_side B, >= 1 Busway and >= 1 ContainmentZone; FIT_OUT -> COMMISSIONING requires every ContainmentZone at leakage_status == PASS, >= 1 CoolingUnit at IN_SERVICE, >= 1 Rack at POWERED, and every Busway's committed_kw <= its COMMISSIONED usable_kw"
    error_id: ERR_PHASE_PREREQ_NOT_MET
    http_status: 409
    applies_to: "POST /halls/{hall_id}/advance-phase"

  - priority: 35
    category: business_constraint
    check: "feed topology completeness: POST /racks/{rack_id}/power-on requires exactly required_feed_count RESERVED feeds, and when required_feed_count == 2 the two feeds must carry distinct feed_side values"
    error_id: ERR_FEED_TOPOLOGY_INCOMPLETE
    http_status: 422
    applies_to: "POST /racks/{rack_id}/power-on"

  - priority: 36
    category: business_constraint
    check: "revision ceiling: POST /mops/{mop_id}/revise requires revision_count < MAX_MOP_REVISIONS (2); the third revision attempt is refused and the MOP stays in REVISION_REQUESTED"
    error_id: ERR_MOP_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /mops/{mop_id}/revise"

  - priority: 37
    category: business_constraint
    check: "concurrent-occupancy notification: when hall.tenant_mode == MULTI_TENANT and risk_class == HIGH, tenant_notified_ids must contain every Tenant id that owns >= 1 Cage in the hall"
    error_id: ERR_TENANT_NOTIFICATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /mops/{mop_id}/schedule"

  - priority: 38
    category: business_constraint
    check: "integrated-systems evidence: a CommissioningPackage of level IN {L4, L5} cannot execute its script until it has >= 1 LoadBankTest with status == COMPLETED, result == PASS and measured_kw >= target_load_kw"
    error_id: ERR_LOADBANK_PREREQ_MISSING
    http_status: 409
    applies_to: "POST /commissioning-packages/{package_id}/execute-script"

  - priority: 39
    category: business_constraint
    check: "release scope non-empty: rack_in_scope_count must be >= 1 (an empty cage is never releasable, and an empty scope is not treated as 100 percent tagged)"
    error_id: ERR_RELEASE_SCOPE_EMPTY
    http_status: 422
    applies_to: "POST /release-packets/{packet_id}/submit"

  - priority: 40
    category: business_constraint
    check: "as-built completeness: asset_tag_completion_pct must equal 100.00 — every in-scope rack carries a non-empty asset_tag"
    error_id: ERR_ASSET_TAGS_INCOMPLETE
    http_status: 422
    applies_to: "POST /release-packets/{packet_id}/submit"

  - priority: 41
    category: business_constraint
    check: "security coverage floor: cage.camera_coverage_pct >= cage.required_camera_coverage_pct AND cage.active_reader_zone_count >= cage.required_reader_zone_count"
    error_id: ERR_CAGE_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /release-packets/{packet_id}/submit"

  - priority: 42
    category: business_constraint
    check: "release posture gate: hall.release_posture must be OPEN to accept a packet, and every POWERED rack of the cage must have energized_feed_count == required_feed_count"
    error_id: ERR_RELEASE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /release-packets/{packet_id}/accept"

  - priority: 43
    category: business_fiscal
    check: "cooling capacity: hall.cooling_margin_kw recomputed with the candidate rack included in thermal_load_kw must be >= 0.00"
    error_id: ERR_COOLING_MARGIN_EXCEEDED
    http_status: 422
    applies_to: "POST /racks/{rack_id}/power-on"

  - priority: 44
    category: business_fiscal
    check: "busway capacity: busway.committed_kw + round(requested_kw, 3) must be <= busway.usable_kw as computed by calculation busway_usable_kw under the busway's current usable_variant"
    error_id: ERR_BUSWAY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /rack-feeds"

  - priority: 45
    category: business_fiscal
    check: "white space capacity: the reservation must leave hall.spare_kw >= 0.00 after calculation hall_power_ledger re-runs (design_kw_capacity - committed_kw - commissioning_reserve_kw)"
    error_id: ERR_HALL_SPARE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /rack-feeds"

  - priority: 46
    category: business_fiscal
    check: "commissioning reserve: per calculation load_bank_window_occupancy, reserve_demand_kw (overlapping SCHEDULED or RUNNING target_kw plus this test's target_kw) must be <= hall.commissioning_reserve_kw"
    error_id: ERR_COMMISSIONING_RESERVE_EXCEEDED
    http_status: 422
    applies_to: "POST /load-bank-tests"

  - priority: 47
    category: business_fiscal
    check: "tenant entitlement: installing a rack must not drive Tenant.allocated_kw above Tenant.contracted_kw"
    error_id: ERR_TENANT_CONTRACT_EXCEEDED
    http_status: 422
    applies_to: "POST /racks/{rack_id}/install"

  - priority: 48
    category: business_fiscal
    check: "branch derate: allocated_kw must be <= round(breaker_amps * busway.voltage_v * SQRT3 * POWER_FACTOR / 1000 * CONTINUOUS_LOAD_FACTOR, 2) — the NEC continuous-load derate applied at the rack branch breaker"
    error_id: ERR_BREAKER_DERATE_EXCEEDED
    http_status: 422
    applies_to: "POST /rack-feeds"

  - priority: 49
    category: business_constraint
    check: "cooling acceptance floor: POST /cooling-units/{unit_id}/commission requires measured_airflow_cfm >= design_airflow_cfm * 0.90"
    error_id: ERR_AIRFLOW_BELOW_DESIGN
    http_status: 422
    applies_to: "POST /cooling-units/{unit_id}/commission"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # ---- test-driving surface --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an absolute ISO 8601 UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default); it MUST NOT fall back to real wall-clock time. Every window, deadline and execution-window rule in this scaffold is evaluated against this clock."
    roles: *STAFF_READ
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "the logical clock used by validations 21, 22, 23 and by every `*_at` system timestamp moves to current_utc"

  # ---- Hall ------------------------------------------------------------------
  - method: POST
    path: "/halls"
    description: "Creates a white space (data hall) in PLANNING with its design electrical capacity and cooling redundancy stance."
    roles: [FacilityPlanner]
    code: 201
    input: [name, code, tenant_mode, design_kw_capacity, gross_area_sqm, cooling_redundancy, planned_rack_count]
    output: Hall
    side_effects:
      - "Hall.status = PLANNING; version = 1"
      - "calculation hall_power_ledger initialises committed_kw = 0.00, commissioning_reserve_kw = 25.00 (tier 1), spare_kw = design_kw_capacity - 25.00"
      - "thermal_posture = NOMINAL, release_posture = OPEN, all counters 0"

  - method: GET
    path: "/halls"
    description: "Lists white spaces with pagination."
    roles: *STAFF_TENANT_READ
    code: 200
    input: ["status?", "tenant_mode?", "page?", "page_size?"]
    output: Hall[]
    side_effects: []

  - method: GET
    path: "/halls/{hall_id}"
    description: "Reads one white space including its power ledger, cooling model outputs and postures."
    roles: *STAFF_TENANT_READ
    code: 200
    input: []
    output: Hall
    side_effects: []

  - method: POST
    path: "/halls/{hall_id}/advance-phase"
    description: "Advances the hall one phase: PLANNING -> FIT_OUT or FIT_OUT -> COMMISSIONING. Never accepts LIVE; the COMMISSIONING -> LIVE transition is system-driven by package certification."
    roles: [FacilityPlanner]
    code: 200
    input: [target_status]
    output: Hall
    side_effects:
      - "validations 34 and 16 gate the transition"
      - "on FIT_OUT -> COMMISSIONING every Busway of the hall flips usable_variant to COMMISSIONED and recomputes usable_kw via calculation busway_usable_kw (derived-field reconciliation)"
      - "recompute calculation hall_power_ledger; increments Hall.version by 1"

  - method: GET
    path: "/halls/{hall_id}/capacity-summary"
    description: "Computed read: the reconciliation view of the white space — power ledger, both cooling capacity variants, custody partition and posture flags in one payload."
    roles: *STAFF_TENANT_READ
    code: 200
    input: []
    output:
      hall_id: string
      status: string
      design_kw_capacity: number
      committed_kw: number
      commissioning_reserve_kw: number
      spare_kw: number
      chargeable_kw: number
      thermal_load_kw: number
      cooling_capacity_nameplate_kw: number
      cooling_capacity_airflow_kw: number
      cooling_capacity_kw: number
      cooling_margin_kw: number
      thermal_posture: string
      release_posture: string
      rack_total_count: integer
      custody_ops_count: integer
      custody_fitout_count: integer
      at_risk_rack_count: integer
      open_mop_count: integer
      worst_leakage_pct: number
    side_effects: []

  # ---- Tenant ----------------------------------------------------------------
  - method: POST
    path: "/tenants"
    description: "Registers a tenant with its contracted kW entitlement."
    roles: [FacilityPlanner]
    code: 201
    input: [name, code, contracted_kw, contract_start_date]
    output: Tenant
    side_effects:
      - "allocated_kw initialised to 0.00"

  - method: GET
    path: "/tenants"
    description: "Lists tenants with pagination."
    roles: *STAFF_READ
    code: 200
    input: ["code?", "page?", "page_size?"]
    output: Tenant[]
    side_effects: []

  - method: GET
    path: "/tenants/{tenant_id}"
    description: "Reads one tenant including allocated_kw."
    roles: *STAFF_TENANT_READ
    code: 200
    input: []
    output: Tenant
    side_effects: []

  # ---- PowerDistributionUnit -------------------------------------------------
  - method: POST
    path: "/pdus"
    description: "Adds a power distribution unit to a hall on feed side A or B."
    roles: [ElectricalContractor]
    code: 201
    input: [hall_id, name, feed_side, rated_kw]
    output: PowerDistributionUnit
    side_effects:
      - "status = PLANNED; measured_derate_factor = 1.00; usable_cap_kw = round(rated_kw * CONTINUOUS_LOAD_FACTOR, 3)"

  - method: GET
    path: "/pdus"
    description: "Lists power distribution units, filterable by hall (FK reverse-reachability for PowerDistributionUnit.hall_id)."
    roles: *STAFF_READ
    code: 200
    input: ["hall_id?", "feed_side?", "status?", "page?", "page_size?"]
    output: PowerDistributionUnit[]
    side_effects: []

  - method: GET
    path: "/pdus/{pdu_id}"
    description: "Reads one power distribution unit."
    roles: *STAFF_READ
    code: 200
    input: []
    output: PowerDistributionUnit
    side_effects: []

  - method: PATCH
    path: "/pdus/{pdu_id}"
    description: "Records the PDU's measured derate factor from acceptance testing and moves it PLANNED -> COMMISSIONED. In a LIVE hall this write requires an IN_EXECUTION method-of-procedure (validation 25)."
    roles: [ElectricalContractor]
    code: 200
    input: [measured_derate_factor]
    output: PowerDistributionUnit
    side_effects:
      - "status = COMMISSIONED"
      - "every Busway of this PDU recomputes usable_kw via calculation busway_usable_kw under its current usable_variant — a derate below 1.00 lowers COMMISSIONED usable_kw only"

  # ---- Busway ----------------------------------------------------------------
  - method: POST
    path: "/busways"
    description: "Adds a busway run under a PDU with its redundancy topology. hall_id and feed_side are copied from the parent PDU."
    roles: [ElectricalContractor]
    code: 201
    input: [pdu_id, name, rated_amps, voltage_v, redundancy_topology]
    output: Busway
    side_effects:
      - "hall_id and feed_side copied from the parent PDU; status = INSTALLED; committed_kw = 0.00; feed_count = 0"
      - "usable_variant selected from hall.status (DESIGN in PLANNING/FIT_OUT, COMMISSIONED in COMMISSIONING/LIVE); raw_kw and usable_kw set by calculation busway_usable_kw"

  - method: GET
    path: "/busways"
    description: "Lists busway runs, filterable by PDU or hall (FK reverse-reachability for Busway.pdu_id and Busway.hall_id)."
    roles: *STAFF_READ
    code: 200
    input: ["pdu_id?", "hall_id?", "status?", "page?", "page_size?"]
    output: Busway[]
    side_effects: []

  - method: GET
    path: "/busways/{busway_id}"
    description: "Reads one busway including raw_kw, usable_kw, usable_variant and committed_kw."
    roles: *STAFF_READ
    code: 200
    input: []
    output: Busway
    side_effects: []

  - method: POST
    path: "/busways/{busway_id}/energize"
    description: "Energises an installed busway once its PDU is commissioned."
    roles: [ElectricalContractor]
    code: 200
    input: []
    output: Busway
    side_effects:
      - "status = INSTALLED -> ENERGIZED"
      - "usable_kw recomputed by calculation busway_usable_kw under the variant selected by hall.status"

  # ---- ContainmentZone -------------------------------------------------------
  - method: POST
    path: "/containment-zones"
    description: "Creates a hot- or cold-aisle containment zone with its leakage target and design static pressure."
    roles: [MechanicalContractor]
    code: 201
    input: [hall_id, label, zone_type, containment_kind, target_leakage_pct, design_static_pressure_pa]
    output: ContainmentZone
    side_effects:
      - "leakage_status = UNTESTED; test_count = 0; measured values null"

  - method: GET
    path: "/containment-zones"
    description: "Lists containment zones, filterable by hall (FK reverse-reachability for ContainmentZone.hall_id)."
    roles: *STAFF_READ
    code: 200
    input: ["hall_id?", "leakage_status?", "zone_type?", "page?", "page_size?"]
    output: ContainmentZone[]
    side_effects: []

  - method: GET
    path: "/containment-zones/{zone_id}"
    description: "Reads one containment zone including its measured leakage and pressure."
    roles: *STAFF_READ
    code: 200
    input: []
    output: ContainmentZone
    side_effects: []

  - method: POST
    path: "/containment-zones/{zone_id}/leakage-test"
    description: "Records a containment leakage test. PASS requires measured_leakage_pct <= target_leakage_pct AND measured_static_pressure_pa >= 90 percent of design; anything else is FAIL. A zone already at PASS cannot be re-tested."
    roles: [MechanicalContractor]
    code: 200
    input: [measured_leakage_pct, measured_static_pressure_pa]
    output: ContainmentZone
    side_effects:
      - "test_count += 1; leakage_status = PASS or FAIL"
      - "recompute calculation hall_cooling_model — the hall's worst measured leakage feeds the AIRFLOW_LIMITED variant (cascade B, links 1-2)"
      - "on FAIL that lowers thermal_posture below NOMINAL, every L4/L5 CommissioningPackage with witness_status == PENDING moves to BLOCKED (cascade B, link 3)"
      - "on PASS that restores thermal_posture to NOMINAL, BLOCKED packages return to PENDING"
      - "recompute calculation hall_release_posture"

  - method: POST
    path: "/containment-zones/{zone_id}/remediate"
    description: "Puts a FAILED containment zone into remediation, clearing its measured values so it drops out of the hall's worst-leakage selection."
    roles: [MechanicalContractor]
    code: 200
    input: ["remediation_note?"]
    output: ContainmentZone
    side_effects:
      - "leakage_status = FAIL -> REMEDIATION; measured_leakage_pct and measured_static_pressure_pa cleared to null"
      - "recompute calculation hall_cooling_model and calculation hall_release_posture"

  # ---- CoolingUnit -----------------------------------------------------------
  - method: POST
    path: "/cooling-units"
    description: "Adds a cooling unit with its sensible rating, design airflow and supply delta-T."
    roles: [MechanicalContractor]
    code: 201
    input: [hall_id, name, rated_sensible_kw, design_airflow_cfm, supply_delta_t_f, redundancy_role]
    output: CoolingUnit
    side_effects:
      - "status = INSTALLED; measured_airflow_cfm null; airflow_capacity_kw = 0.00"

  - method: GET
    path: "/cooling-units"
    description: "Lists cooling units, filterable by hall (FK reverse-reachability for CoolingUnit.hall_id)."
    roles: *STAFF_READ
    code: 200
    input: ["hall_id?", "status?", "redundancy_role?", "page?", "page_size?"]
    output: CoolingUnit[]
    side_effects: []

  - method: GET
    path: "/cooling-units/{unit_id}"
    description: "Reads one cooling unit including measured airflow and its airflow-derived capacity."
    roles: *STAFF_READ
    code: 200
    input: []
    output: CoolingUnit
    side_effects: []

  - method: POST
    path: "/cooling-units/{unit_id}/commission"
    description: "Records measured airflow and commissions the unit. Requires measured_airflow_cfm >= 90 percent of design_airflow_cfm."
    roles: [MechanicalContractor]
    code: 200
    input: [measured_airflow_cfm]
    output: CoolingUnit
    side_effects:
      - "status = INSTALLED -> COMMISSIONED; measured_airflow_cfm stored"
      - "airflow_capacity_kw computed per the AIRFLOW_LIMITED variant of calculation hall_cooling_model"

  - method: POST
    path: "/cooling-units/{unit_id}/place-in-service"
    description: "Places a commissioned unit into duty so it enters both cooling capacity variants."
    roles: [MechanicalContractor]
    code: 200
    input: []
    output: CoolingUnit
    side_effects:
      - "status = COMMISSIONED -> IN_SERVICE"
      - "recompute calculation hall_cooling_model for the hall (N+1 redundancy subtracts the largest duty unit from BOTH variants)"

  # ---- Cage ------------------------------------------------------------------
  - method: POST
    path: "/cages"
    description: "Builds a tenant cage in the white space with its perimeter length and security coverage requirements."
    roles: [SecurityAdministrator]
    code: 201
    input: [hall_id, tenant_id, label, perimeter_length_m, "required_camera_coverage_pct?", "required_reader_zone_count?"]
    output: Cage
    side_effects:
      - "operational_status = FIT_OUT; camera_coverage_pct = 0.00; active_reader_zone_count = 0"
      - "required_camera_coverage_pct defaults to 95.00 and required_reader_zone_count to 2 when omitted"

  - method: GET
    path: "/cages"
    description: "Lists cages, filterable by hall or tenant (FK reverse-reachability for Cage.hall_id and Cage.tenant_id). TenantRepresentative callers see only their own cages."
    roles: *STAFF_TENANT_READ
    code: 200
    input: ["hall_id?", "tenant_id?", "operational_status?", "page?", "page_size?"]
    output: Cage[]
    side_effects: []

  - method: GET
    path: "/cages/{cage_id}"
    description: "Reads one cage including its computed camera coverage, reader zone count and version (the OCC parent for release packet creation)."
    roles: *STAFF_TENANT_READ
    code: 200
    input: []
    output: Cage
    side_effects: []

  # ---- SecurityDevice --------------------------------------------------------
  - method: POST
    path: "/security-devices"
    description: "Plans a camera or card reader on a cage. covered_length_m is required for CAMERA devices; reader_zone_label is required for CARD_READER devices."
    roles: [SecurityAdministrator]
    code: 201
    input: [cage_id, device_type, label, "covered_length_m?", "reader_zone_label?"]
    output: SecurityDevice
    side_effects:
      - "status = PLANNED; the device contributes nothing to calculation cage_security_coverage until commissioned"

  - method: GET
    path: "/security-devices"
    description: "Lists security devices, filterable by cage (FK reverse-reachability for SecurityDevice.cage_id)."
    roles: *STAFF_READ
    code: 200
    input: ["cage_id?", "device_type?", "status?", "page?", "page_size?"]
    output: SecurityDevice[]
    side_effects: []

  - method: GET
    path: "/security-devices/{device_id}"
    description: "Reads one security device."
    roles: *STAFF_READ
    code: 200
    input: []
    output: SecurityDevice
    side_effects: []

  - method: POST
    path: "/security-devices/{device_id}/commission"
    description: "Activates a planned security device."
    roles: [SecurityAdministrator]
    code: 200
    input: []
    output: SecurityDevice
    side_effects:
      - "status = PLANNED -> ACTIVE"
      - "recompute calculation cage_security_coverage for the owning cage (camera_coverage_pct capped at 100.00, active_reader_zone_count over DISTINCT reader_zone_label)"
      - "when both cage gates are satisfied and cage.operational_status == FIT_OUT the cage moves to SECURED; increments Cage.version by 1"

  # ---- Rack ------------------------------------------------------------------
  - method: POST
    path: "/racks"
    description: "Places a rack position in the white space layout at a unique (grid_row, grid_col) inside a containment zone, optionally inside a tenant cage."
    roles: [FacilityPlanner]
    code: 201
    input: [hall_id, containment_zone_id, grid_row, grid_col, design_kw, "u_height?", "required_feed_count?", "cage_id?", "tenant_id?", "asset_tag?"]
    output: Rack
    side_effects:
      - "status = PLANNED; required_feed_count defaults to 2; connected_kw = 0.00; energized_feed_count = 0"
      - "chargeable_kw = round(design_kw * RACK_OVERHEAD_FACTOR, 2) per calculation rack_chargeable_rollup"
      - "recompute Hall.rack_total_count and calculation rack_custody_partition"

  - method: GET
    path: "/racks"
    description: "Lists rack positions, filterable by hall, cage, containment zone or tenant (FK reverse-reachability for all four Rack FKs). TenantRepresentative callers see only their own racks."
    roles: *STAFF_TENANT_READ
    code: 200
    input: ["hall_id?", "cage_id?", "containment_zone_id?", "tenant_id?", "status?", "page?", "page_size?"]
    output: Rack[]
    side_effects: []

  - method: GET
    path: "/racks/{rack_id}"
    description: "Reads one rack position including asset_tag, connected_kw and energized_feed_count."
    roles: *STAFF_TENANT_READ
    code: 200
    input: []
    output: Rack
    side_effects: []

  - method: PATCH
    path: "/racks/{rack_id}"
    description: "As-built asset tagging: writes or corrects the rack's asset_tag at any status."
    roles: [FacilityPlanner]
    code: 200
    input: [asset_tag]
    output: Rack
    side_effects:
      - "asset_tag stored; any DRAFT ReleasePacket of the rack's cage recomputes calculation asset_tag_completion"

  - method: POST
    path: "/racks/{rack_id}/install"
    description: "Marks a planned rack physically installed, which books its design_kw against the tenant's contracted entitlement."
    roles: [FacilityPlanner]
    code: 200
    input: ["asset_tag?"]
    output: Rack
    side_effects:
      - "status = PLANNED -> INSTALLED; asset_tag stored when supplied"
      - "Tenant.allocated_kw += design_kw (validation 47 gates the contracted ceiling)"
      - "recompute calculation rack_chargeable_rollup for the hall and calculation rack_custody_partition"

  - method: POST
    path: "/racks/{rack_id}/power-on"
    description: "Energises an installed rack: every RESERVED feed moves to ENERGIZED and the rack takes operational load. Gated by feed topology, busway state, containment PASS and cooling margin."
    roles: [ElectricalContractor]
    code: 200
    input: []
    output: Rack
    side_effects:
      - "every RESERVED RackFeed of the rack moves to ENERGIZED; energized_feed_count recomputed"
      - "status = INSTALLED -> POWERED; Hall.custody_ops_count += 1, Hall.custody_fitout_count -= 1"
      - "recompute calculation hall_cooling_model (thermal_load_kw rises by design_kw * DIVERSITY_FACTOR) and calculation rack_custody_partition"
      - "increments Hall.version by 1"

  # ---- RackFeed --------------------------------------------------------------
  - method: POST
    path: "/rack-feeds"
    description: "Reserves a rack branch feed on a busway. allocated_kw = round(requested_kw, 3) and is booked against the busway's usable_kw and the hall's power ledger immediately."
    roles: [ElectricalContractor]
    code: 201
    input: [rack_id, busway_id, feed_side, requested_kw, breaker_amps]
    output: RackFeed
    side_effects:
      - "status = RESERVED; allocated_kw = round(requested_kw, 3)"
      - "Busway.committed_kw += allocated_kw; Busway.feed_count += 1; Rack.connected_kw recomputed"
      - "recompute calculation hall_power_ledger: committed_kw rises, commissioning_reserve_kw re-tiers, spare_kw falls"
      - "increments Hall.version by 1"

  - method: GET
    path: "/rack-feeds"
    description: "Lists rack feeds, filterable by rack or busway (FK reverse-reachability for RackFeed.rack_id and RackFeed.busway_id). RELEASED feeds are hidden unless include_released is true."
    roles: *STAFF_READ
    code: 200
    input: ["rack_id?", "busway_id?", "status?", "include_released?", "page?", "page_size?"]
    output: RackFeed[]
    side_effects: []

  - method: GET
    path: "/rack-feeds/{feed_id}"
    description: "Reads one rack feed including allocated_kw and released_at."
    roles: *STAFF_READ
    code: 200
    input: []
    output: RackFeed
    side_effects: []

  - method: DELETE
    path: "/rack-feeds/{feed_id}"
    description: "Releases a reserved feed (soft delete). The row stays queryable with include_released=true and its kW is returned to the ledger."
    roles: [ElectricalContractor]
    code: 200
    input: []
    output: RackFeed
    side_effects:
      - "status = RESERVED -> RELEASED; released_at = logical clock now"
      - "Busway.committed_kw -= allocated_kw; Busway.feed_count -= 1; Rack.connected_kw recomputed"
      - "recompute calculation hall_power_ledger — committed_kw, commissioning_reserve_kw and spare_kw return to their pre-reservation values (compensating invariant)"
      - "increments Hall.version by 1"

  # ---- CommissioningPackage --------------------------------------------------
  - method: POST
    path: "/commissioning-packages"
    description: "Opens a commissioning package at an integrated-systems level (L1..L5) for a hall in COMMISSIONING. Creating a package for a hall+level that already has a live package supersedes the prior one, so the caller must prove a current view of the hall via expected_hall_version."
    roles: [CommissioningAgent]
    code: 201
    input: [hall_id, level, title, target_load_kw, expected_hall_version]
    output: CommissioningPackage
    side_effects:
      - "script_status = NOT_STARTED; witness_status = PENDING; package_state = DRAFT per calculation package_state_projection"
      - "any prior non-SUPERSEDED package of the same hall_id and level moves to SUPERSEDED with superseded_by_package_id set to the new package"
      - "increments Hall.version by 1"

  - method: GET
    path: "/commissioning-packages"
    description: "Lists commissioning packages, filterable by hall (FK reverse-reachability for CommissioningPackage.hall_id)."
    roles: *STAFF_READ
    code: 200
    input: ["hall_id?", "level?", "package_state?", "page?", "page_size?"]
    output: CommissioningPackage[]
    side_effects: []

  - method: GET
    path: "/commissioning-packages/{package_id}"
    description: "Reads one commissioning package with both parallel dimensions (script_status, witness_status), the derived package_state and measured_load_kw."
    roles: *STAFF_READ
    code: 200
    input: []
    output: CommissioningPackage
    side_effects: []

  - method: POST
    path: "/commissioning-packages/{package_id}/approve-script"
    description: "Approves the test script revision, moving the script dimension NOT_STARTED -> SCRIPT_APPROVED. Lower commissioning levels of the hall must already be certified."
    roles: [CommissioningAgent]
    code: 200
    input: [script_revision]
    output: CommissioningPackage
    side_effects:
      - "script_status = SCRIPT_APPROVED; script_revision stored; witness_status untouched"
      - "package_state re-derived by calculation package_state_projection (DRAFT -> IN_EXECUTION)"

  - method: POST
    path: "/commissioning-packages/{package_id}/execute-script"
    description: "Records script execution by the acting commissioning agent. L4 and L5 packages require a passing load bank run at or above target_load_kw."
    roles: [CommissioningAgent]
    code: 200
    input: []
    output: CommissioningPackage
    side_effects:
      - "script_status = SCRIPT_APPROVED -> EXECUTED; executed_by_user_id = X-User-ID"
      - "a witness_status of REJECTED resets to PENDING so the witness dimension re-opens"
      - "package_state re-derived"

  - method: POST
    path: "/commissioning-packages/{package_id}/witness"
    description: "Independent witness decision on an executed package. The witness must not be the executor (segregation of duties). WITNESSED certifies the package and may drive the hall to LIVE; REJECTED fails it and rolls the script dimension back to SCRIPT_APPROVED."
    roles: [WitnessAuthority]
    code: 200
    input: [decision, "witness_note?"]
    output: CommissioningPackage
    side_effects:
      - "witness_status = WITNESSED or REJECTED; witnessed_by_user_id = X-User-ID"
      - "on WITNESSED: package_state = CERTIFIED and the hall re-evaluates COMMISSIONING -> LIVE (requires every non-SUPERSEDED package CERTIFIED and levels including L4 and L5)"
      - "on REJECTED: package_state = FAILED and script_status rolls back EXECUTED -> SCRIPT_APPROVED"
      - "increments Hall.version by 1 when the hall transitions"

  # ---- LoadBankTest ----------------------------------------------------------
  - method: POST
    path: "/load-bank-tests"
    description: "Schedules a load bank run inside a closed window against an approved script. The run books a slice of the hall's commissioning reserve and counts against the hall's concurrent-run ceiling."
    roles: [CommissioningAgent]
    code: 201
    input: [package_id, target_kw, window_start, window_end, step_pct_sequence]
    output: LoadBankTest
    side_effects:
      - "status = SCHEDULED; result null"
      - "validations 22 and 46 evaluate calculation load_bank_window_occupancy over overlapping SCHEDULED/RUNNING runs of the same hall"

  - method: GET
    path: "/load-bank-tests"
    description: "Lists load bank runs, filterable by package (FK reverse-reachability for LoadBankTest.package_id)."
    roles: *STAFF_READ
    code: 200
    input: ["package_id?", "status?", "page?", "page_size?"]
    output: LoadBankTest[]
    side_effects: []

  - method: GET
    path: "/load-bank-tests/{test_id}"
    description: "Reads one load bank run including measured_kw, measured_return_delta_t_f and result."
    roles: *STAFF_READ
    code: 200
    input: []
    output: LoadBankTest
    side_effects: []

  - method: POST
    path: "/load-bank-tests/{test_id}/start"
    description: "Starts a scheduled run; only inside its window, only against an approved script, only while the hall is thermally nominal."
    roles: [CommissioningAgent]
    code: 200
    input: []
    output: LoadBankTest
    side_effects:
      - "status = SCHEDULED -> RUNNING"

  - method: POST
    path: "/load-bank-tests/{test_id}/complete"
    description: "Completes a running load bank run and grades it via calculation load_bank_result (>= 95 percent of target_kw AND return delta-T >= 8.0 F)."
    roles: [CommissioningAgent]
    code: 200
    input: [measured_kw, measured_return_delta_t_f]
    output: LoadBankTest
    side_effects:
      - "status = RUNNING -> COMPLETED; measured values stored; result = PASS or FAIL per calculation load_bank_result"
      - "CommissioningPackage.measured_load_kw = max measured_kw over the package's COMPLETED runs"
      - "the run stops occupying the hall's commissioning reserve window"

  - method: POST
    path: "/load-bank-tests/{test_id}/abort"
    description: "Aborts a scheduled or running load bank run, freeing its slice of the commissioning reserve and its concurrency slot."
    roles: [CommissioningAgent]
    code: 200
    input: [abort_reason]
    output: LoadBankTest
    side_effects:
      - "status = ABORTED; abort_reason stored; measured_kw stays null"
      - "the run no longer counts in calculation load_bank_window_occupancy"

  # ---- MethodOfProcedure -----------------------------------------------------
  - method: POST
    path: "/mops"
    description: "Drafts a method-of-procedure against one target resource in the white space. target_resource_id is polymorphic and validated against target_resource_type."
    roles: *MOP_AUTHORS
    code: 201
    input: [hall_id, target_resource_type, target_resource_id, title, risk_class, backout_plan, window_start, window_end]
    output: MethodOfProcedure
    side_effects:
      - "status = DRAFT; author_user_id = X-User-ID; revision_count = 0; approval_count = 0; required_approval_count = 0"

  - method: GET
    path: "/mops"
    description: "Lists methods of procedure, filterable by hall or target resource (FK reverse-reachability for MethodOfProcedure.hall_id)."
    roles: *STAFF_READ
    code: 200
    input: ["hall_id?", "status?", "target_resource_id?", "risk_class?", "page?", "page_size?"]
    output: MethodOfProcedure[]
    side_effects: []

  - method: GET
    path: "/mops/{mop_id}"
    description: "Reads one method of procedure including approval_count, required_approval_count, revision_count and pre_execution_target_state."
    roles: *STAFF_READ
    code: 200
    input: []
    output: MethodOfProcedure
    side_effects: []

  - method: POST
    path: "/mops/{mop_id}/submit"
    description: "Submits a draft MOP for review. HIGH risk classification is mandatory for busway and cooling work in a LIVE hall."
    roles: *MOP_AUTHORS
    code: 200
    input: []
    output: MethodOfProcedure
    side_effects:
      - "status = DRAFT -> UNDER_REVIEW"
      - "required_approval_count set by calculation mop_approval_requirement (2 for HIGH, else 1)"

  - method: POST
    path: "/mops/{mop_id}/approvals"
    description: "Records one approval decision (APPROVE, REQUEST_REVISION or REJECT) on a MOP under review and returns the decided MOP. The approver may not be the author, may not vote twice in a round, and on HIGH risk MOPs the second APPROVE must come from the other approver role."
    roles: [ChangeManager, OperationsManager]
    code: 200
    input: [decision, "comment?"]
    output: MethodOfProcedure
    side_effects:
      - "a MopApproval row is appended with approver_role = X-User-Role, approver_user_id = X-User-ID and sequence = prior row count + 1"
      - "approval_count recomputed by calculation mop_approval_requirement over the CURRENT review round only"
      - "APPROVE reaching quorum -> status = APPROVED; APPROVE below quorum -> status stays UNDER_REVIEW; REQUEST_REVISION -> status = REVISION_REQUESTED and approval_count resets to 0; REJECT -> status = REJECTED (terminal)"

  - method: GET
    path: "/mops/{id}/approvals"
    description: "Sub-resource listing of the approval trail of a MOP in created_at order (FK reverse-reachability for MopApproval.mop_id; MopApproval is immutable and has no other read path)."
    roles: *STAFF_READ
    code: 200
    input: []
    output: MopApproval[]
    side_effects: []

  - method: POST
    path: "/mops/{mop_id}/revise"
    description: "Author revises a MOP that came back with REQUEST_REVISION and re-enters review. At most MAX_MOP_REVISIONS (2) revisions are permitted."
    roles: *MOP_AUTHORS
    code: 200
    input: ["window_start?", "window_end?", "backout_plan?", "risk_class?"]
    output: MethodOfProcedure
    side_effects:
      - "supplied fields overwrite the stored values; revision_count += 1; status = REVISION_REQUESTED -> UNDER_REVIEW"
      - "required_approval_count re-derived from the possibly-new risk_class; approval_count stays 0 for the fresh round"

  - method: POST
    path: "/mops/{mop_id}/schedule"
    description: "Schedules an approved MOP into its window. The window must not collide (with settle buffer) with another SCHEDULED or IN_EXECUTION MOP on the same target resource, and HIGH risk work in a multi-tenant hall requires every cage-owning tenant to be notified."
    roles: [ChangeManager]
    code: 200
    input: ["tenant_notified_ids?"]
    output: MethodOfProcedure
    side_effects:
      - "status = APPROVED -> SCHEDULED; tenant_notified_ids stored"
      - "Hall.open_mop_count recomputed; recompute calculation hall_release_posture"

  - method: POST
    path: "/mops/{mop_id}/execute"
    description: "Author executes a scheduled MOP inside its window. This is the entry point of the live-space cascade: the target resource is captured in pre_execution_target_state and taken out of service."
    roles: *MOP_AUTHORS
    code: 200
    input: []
    output: MethodOfProcedure
    side_effects:
      - "status = SCHEDULED -> IN_EXECUTION; executed_at = logical clock now; pre_execution_target_state = current status of the target (cascade A, link 1)"
      - "hall.release_posture = LOCKED"
      - "BUSWAY target: ENERGIZED -> ISOLATED, its ENERGIZED feeds -> DERATED, affected racks -> AT_RISK, their cages -> DEGRADED, ACCEPTED release packets -> SUSPENDED (cascade A, links 2-5)"
      - "COOLING_UNIT target: IN_SERVICE -> MAINTENANCE and calculation hall_cooling_model recomputed"
      - "recompute calculation rack_custody_partition and calculation hall_release_posture; increments Hall.version by 1"

  - method: POST
    path: "/mops/{mop_id}/close"
    description: "Author closes an executed MOP as completed, restoring the target resource to pre_execution_target_state and compensating the whole cascade."
    roles: *MOP_AUTHORS
    code: 200
    input: ["closeout_note?"]
    output: MethodOfProcedure
    side_effects:
      - "status = IN_EXECUTION -> CLOSED; closed_at = logical clock now"
      - "target restored to pre_execution_target_state; DERATED feeds -> ENERGIZED; AT_RISK racks -> pre_risk_status; DEGRADED cages -> SECURED or RELEASED; SUSPENDED packets -> ACCEPTED"
      - "recompute calculation rack_custody_partition (counts return to their pre-execute values) and calculation hall_release_posture"

  - method: POST
    path: "/mops/{mop_id}/back-out"
    description: "Author backs out an executed MOP as abandoned. The restoration is identical to close; only the terminal status differs."
    roles: *MOP_AUTHORS
    code: 200
    input: ["backout_note?"]
    output: MethodOfProcedure
    side_effects:
      - "status = IN_EXECUTION -> BACKED_OUT; closed_at = logical clock now"
      - "identical compensation to close: every cascade-A side effect is reversed"
      - "recompute calculation rack_custody_partition and calculation hall_release_posture"

  # ---- ReleasePacket ---------------------------------------------------------
  - method: POST
    path: "/release-packets"
    description: "Opens a capacity-release packet for one cage with its as-built drawing reference. A new packet supersedes any prior live packet of the same cage, so the caller must prove a current view of the cage via expected_cage_version."
    roles: [CommissioningAgent]
    code: 201
    input: [hall_id, cage_id, as_built_drawing_ref, expected_cage_version]
    output: ReleasePacket
    side_effects:
      - "status = DRAFT; released_kw, rack_in_scope_count and asset_tag_completion_pct computed by calculations rack_chargeable_rollup and asset_tag_completion"
      - "any prior packet of the cage in SUBMITTED, ACCEPTED or SUSPENDED moves to SUPERSEDED and supersedes_packet_id is set on the new packet"
      - "increments Cage.version by 1"

  - method: GET
    path: "/release-packets"
    description: "Lists release packets, filterable by hall or cage (FK reverse-reachability for ReleasePacket.hall_id and ReleasePacket.cage_id). TenantRepresentative callers see only their own cages' packets."
    roles: *STAFF_TENANT_READ
    code: 200
    input: ["hall_id?", "cage_id?", "status?", "page?", "page_size?"]
    output: ReleasePacket[]
    side_effects: []

  - method: GET
    path: "/release-packets/{packet_id}"
    description: "Reads one release packet including released_kw, rack_in_scope_count and asset_tag_completion_pct."
    roles: *STAFF_TENANT_READ
    code: 200
    input: []
    output: ReleasePacket
    side_effects: []

  - method: POST
    path: "/release-packets/{packet_id}/submit"
    description: "Submits a release packet for operations acceptance. Requires a non-empty rack scope, 100 percent asset tagging and a cage that meets its camera and reader coverage floors."
    roles: [CommissioningAgent]
    code: 200
    input: []
    output: ReleasePacket
    side_effects:
      - "released_kw and asset_tag_completion_pct recomputed then frozen; status = DRAFT -> SUBMITTED"

  - method: POST
    path: "/release-packets/{packet_id}/accept"
    description: "Operations accepts custody of the cage's racks. Requires a LIVE hall with release_posture OPEN and every POWERED rack of the cage at full feed count."
    roles: [OperationsManager]
    code: 200
    input: []
    output: ReleasePacket
    side_effects:
      - "status = SUBMITTED -> ACCEPTED; accepted_by_user_id = X-User-ID"
      - "every POWERED rack of the cage moves to RELEASED; the cage moves SECURED -> RELEASED"
      - "recompute calculation rack_custody_partition; increments Cage.version by 1"

  - method: POST
    path: "/release-packets/{packet_id}/reject"
    description: "Operations rejects a submitted release packet with a reason; the packet is terminal and a new packet must be opened."
    roles: [OperationsManager]
    code: 200
    input: [rejected_reason]
    output: ReleasePacket
    side_effects:
      - "status = SUBMITTED -> REJECTED; rejected_reason stored"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # ---- auth ------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a role declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the endpoint in §1.5"
  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID header missing on an endpoint that records or compares an acting identity"
  - id: ERR_TENANT_SCOPE_VIOLATION
    http: 403
    condition: "a TenantRepresentative addresses a cage, rack or release packet belonging to another tenant"

  # ---- request shape ---------------------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required field, out-of-domain enum, non-positive kW/amps/area, malformed ISO 8601 instant, window_end <= window_start, or malformed step_pct_sequence"

  # ---- existence -------------------------------------------------------------
  - id: ERR_HALL_NOT_FOUND
    http: 404
    condition: "hall_id in the path or body names no Hall"
  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "tenant_id in the path or body names no Tenant"
  - id: ERR_PDU_NOT_FOUND
    http: 404
    condition: "pdu_id in the path or body names no PowerDistributionUnit"
  - id: ERR_BUSWAY_NOT_FOUND
    http: 404
    condition: "busway_id in the path or body names no Busway"
  - id: ERR_RACK_NOT_FOUND
    http: 404
    condition: "rack_id in the path or body names no Rack"
  - id: ERR_RACK_FEED_NOT_FOUND
    http: 404
    condition: "feed_id names no RackFeed (a RELEASED feed is still found; it is soft-deleted, not gone)"
  - id: ERR_COOLING_UNIT_NOT_FOUND
    http: 404
    condition: "unit_id names no CoolingUnit"
  - id: ERR_CONTAINMENT_ZONE_NOT_FOUND
    http: 404
    condition: "zone_id in the path or containment_zone_id in the body names no ContainmentZone"
  - id: ERR_CAGE_NOT_FOUND
    http: 404
    condition: "cage_id in the path or body names no Cage"
  - id: ERR_SECURITY_DEVICE_NOT_FOUND
    http: 404
    condition: "device_id names no SecurityDevice"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "package_id in the path or body names no CommissioningPackage"
  - id: ERR_LOAD_BANK_TEST_NOT_FOUND
    http: 404
    condition: "test_id names no LoadBankTest"
  - id: ERR_MOP_NOT_FOUND
    http: 404
    condition: "mop_id names no MethodOfProcedure"
  - id: ERR_RELEASE_PACKET_NOT_FOUND
    http: 404
    condition: "packet_id names no ReleasePacket"
  - id: ERR_MOP_TARGET_NOT_FOUND
    http: 404
    condition: "target_resource_id does not resolve to a row of the entity named by target_resource_type, or that row belongs to another hall"

  # ---- referential integrity / uniqueness ------------------------------------
  - id: ERR_HALL_MISMATCH
    http: 422
    condition: "a child's parents disagree about the white space (rack vs zone vs cage, busway vs PDU, feed's busway vs rack, packet vs cage) or a cage's tenant contradicts the tenant of the racks it holds"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Hall.code or Tenant.code already exists globally, or a Busway name / ContainmentZone label / Cage label / SecurityDevice label already exists in its parent scope"
  - id: ERR_DUPLICATE_GRID_POSITION
    http: 409
    condition: "another Rack already occupies (hall_id, grid_row, grid_col)"
  - id: ERR_DUPLICATE_FEED_SIDE
    http: 409
    condition: "the rack already holds a non-RELEASED RackFeed on the requested feed_side"

  # ---- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_CAGE_VERSION
    http: 412
    condition: "expected_cage_version does not equal the Cage's current version on POST /release-packets"
  - id: ERR_STALE_HALL_VERSION
    http: 412
    condition: "expected_hall_version does not equal the Hall's current version on POST /commissioning-packages"

  # ---- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the addressed row is not in a from-state that §1.2 declares for the requested transition (re-testing a PASS containment zone, witnessing before execution, closing a MOP that is not IN_EXECUTION, submitting a packet that is not DRAFT, ...)"
  - id: ERR_HALL_PHASE_INVALID
    http: 409
    condition: "the operation is not permitted in the hall's current phase, or advance-phase names a target that is not the immediate successor (or names LIVE)"
  - id: ERR_PDU_NOT_COMMISSIONED
    http: 409
    condition: "a busway is energized while its parent PDU is still PLANNED"
  - id: ERR_BUSWAY_NOT_ENERGIZED
    http: 409
    condition: "a feed is reserved on an ISOLATED busway, or a rack is powered on while one of its reserved feeds sits on a busway that is not ENERGIZED"
  - id: ERR_SCRIPT_NOT_APPROVED
    http: 409
    condition: "a load bank run is created or started while its package's script_status != SCRIPT_APPROVED"
  - id: ERR_LEVEL_PREREQ_NOT_MET
    http: 409
    condition: "a commissioning package's script is approved while a lower level of the same hall is neither CERTIFIED nor SUPERSEDED"

  # ---- temporal --------------------------------------------------------------
  - id: ERR_MOP_WINDOW_CONFLICT
    http: 409
    condition: "the MOP's buffered window collides with another SCHEDULED or IN_EXECUTION MOP on the same target resource"
  - id: ERR_LOADBANK_CONCURRENCY_EXCEEDED
    http: 409
    condition: "a third load bank run would overlap two already-occupying runs in the same white space"
  - id: ERR_OUTSIDE_EXECUTION_WINDOW
    http: 409
    condition: "the logical clock is outside [window_start, window_end) at execute/start time, or a submitted MOP's window_start is already in the past"
  - id: ERR_HALL_MOP_ALREADY_EXECUTING
    http: 409
    condition: "another MethodOfProcedure of the same hall is already IN_EXECUTION"

  # ---- safety / compliance ---------------------------------------------------
  - id: ERR_MOP_REQUIRED
    http: 409
    condition: "a live-space write (PDU derate, containment leakage test or remediation, cooling commission) is attempted in a LIVE hall without a covering IN_EXECUTION method of procedure"
  - id: ERR_RISK_CLASS_TOO_LOW
    http: 422
    condition: "busway or cooling work in a LIVE hall is submitted with risk_class other than HIGH"
  - id: ERR_WITNESS_SAME_AS_EXECUTOR
    http: 422
    condition: "the witnessing X-User-ID equals the package's executed_by_user_id"
  - id: ERR_APPROVER_IS_AUTHOR
    http: 422
    condition: "the approving X-User-ID equals the MOP's author_user_id"
  - id: ERR_DUPLICATE_APPROVER
    http: 409
    condition: "the same approver_user_id issues a second APPROVE in the same review round"
  - id: ERR_APPROVAL_ROLE_NOT_DISTINCT
    http: 422
    condition: "the second APPROVE on a HIGH risk MOP comes from the same approver_role as the first"
  - id: ERR_MOP_EXECUTOR_NOT_AUTHOR
    http: 403
    condition: "revise, execute, close or back-out is attempted by a user other than the MOP author"
  - id: ERR_CONTAINMENT_NOT_PASSED
    http: 409
    condition: "a rack is powered on while its containment zone's leakage_status != PASS"
  - id: ERR_THERMAL_POSTURE_NOT_NOMINAL
    http: 409
    condition: "script execution, witnessing or a load bank start is attempted while hall.thermal_posture != NOMINAL"

  # ---- constraint ------------------------------------------------------------
  - id: ERR_PHASE_PREREQ_NOT_MET
    http: 409
    condition: "advance-phase is called before the phase's topology / containment / cooling / rack / busway-capacity prerequisites are all satisfied"
  - id: ERR_FEED_TOPOLOGY_INCOMPLETE
    http: 422
    condition: "the rack does not hold exactly required_feed_count RESERVED feeds, or the two feeds share a feed_side"
  - id: ERR_MOP_REVISION_LIMIT_REACHED
    http: 409
    condition: "a third revision of the same MOP is attempted (revision_count == MAX_MOP_REVISIONS)"
  - id: ERR_TENANT_NOTIFICATION_INCOMPLETE
    http: 422
    condition: "a HIGH risk MOP in a MULTI_TENANT hall is scheduled without notifying every cage-owning tenant"
  - id: ERR_LOADBANK_PREREQ_MISSING
    http: 409
    condition: "an L4 or L5 package executes its script without a COMPLETED, PASSing load bank run at or above target_load_kw"
  - id: ERR_RELEASE_SCOPE_EMPTY
    http: 422
    condition: "a release packet is submitted with rack_in_scope_count == 0"
  - id: ERR_ASSET_TAGS_INCOMPLETE
    http: 422
    condition: "a release packet is submitted while asset_tag_completion_pct < 100.00"
  - id: ERR_CAGE_COVERAGE_INSUFFICIENT
    http: 422
    condition: "a release packet is submitted while the cage misses its camera coverage or reader zone floor"
  - id: ERR_RELEASE_POSTURE_BLOCKED
    http: 409
    condition: "a release packet is accepted while hall.release_posture != OPEN or a POWERED rack of the cage is short a feed"
  - id: ERR_AIRFLOW_BELOW_DESIGN
    http: 422
    condition: "a cooling unit is commissioned with measured_airflow_cfm below 90 percent of design_airflow_cfm"

  # ---- capacity / fiscal -----------------------------------------------------
  - id: ERR_COOLING_MARGIN_EXCEEDED
    http: 422
    condition: "powering on the rack would drive hall.cooling_margin_kw below 0.00"
  - id: ERR_BUSWAY_CAPACITY_EXCEEDED
    http: 422
    condition: "the reservation would push Busway.committed_kw above Busway.usable_kw under the busway's current usable_variant"
  - id: ERR_HALL_SPARE_CAPACITY_EXCEEDED
    http: 422
    condition: "the reservation would drive Hall.spare_kw below 0.00 once the reserve tier is re-applied"
  - id: ERR_COMMISSIONING_RESERVE_EXCEEDED
    http: 422
    condition: "overlapping load bank runs would demand more kW than Hall.commissioning_reserve_kw"
  - id: ERR_TENANT_CONTRACT_EXCEEDED
    http: 422
    condition: "installing the rack would push Tenant.allocated_kw above Tenant.contracted_kw"
  - id: ERR_BREAKER_DERATE_EXCEEDED
    http: 422
    condition: "allocated_kw exceeds the 80 percent continuous-load derate of the requested breaker_amps at the busway voltage"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# -----------------------------------------------------------------------------
roles:

  - name: FacilityPlanner
    description: "Owns the white space layout: halls, tenants, rack positions, as-built asset tagging and the hall phase ladder."
    identity: "opaque"
    exclusive_operations:
      - "POST /halls"
      - "POST /tenants"
      - "POST /halls/{hall_id}/advance-phase"
      - "POST /racks"
      - "PATCH /racks/{rack_id}"
      - "POST /racks/{rack_id}/install"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint of the staff read surface"

  - name: ElectricalContractor
    description: "Builds and energises the electrical chain: PDUs, busway runs, rack branch feeds and rack power-on."
    identity: "opaque"
    exclusive_operations:
      - "POST /pdus"
      - "PATCH /pdus/{pdu_id}"
      - "POST /busways"
      - "POST /busways/{busway_id}/energize"
      - "POST /rack-feeds"
      - "DELETE /rack-feeds/{feed_id}"
      - "POST /racks/{rack_id}/power-on"
    shared_operations:
      - "POST /mops"
      - "POST /mops/{mop_id}/submit"
      - "POST /mops/{mop_id}/revise"
      - "POST /mops/{mop_id}/execute"
      - "POST /mops/{mop_id}/close"
      - "POST /mops/{mop_id}/back-out"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint of the staff read surface"

  - name: MechanicalContractor
    description: "Builds and proves the mechanical chain: cooling units, containment zones, leakage testing and remediation."
    identity: "opaque"
    exclusive_operations:
      - "POST /cooling-units"
      - "POST /cooling-units/{unit_id}/commission"
      - "POST /cooling-units/{unit_id}/place-in-service"
      - "POST /containment-zones"
      - "POST /containment-zones/{zone_id}/leakage-test"
      - "POST /containment-zones/{zone_id}/remediate"
    shared_operations:
      - "POST /mops"
      - "POST /mops/{mop_id}/submit"
      - "POST /mops/{mop_id}/revise"
      - "POST /mops/{mop_id}/execute"
      - "POST /mops/{mop_id}/close"
      - "POST /mops/{mop_id}/back-out"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint of the staff read surface"

  - name: CommissioningAgent
    description: "Runs phased commissioning: package levels L1..L5, script approval and execution, load bank runs, and the capacity-release packet up to submission."
    identity: "opaque"
    exclusive_operations:
      - "POST /commissioning-packages"
      - "POST /commissioning-packages/{package_id}/approve-script"
      - "POST /commissioning-packages/{package_id}/execute-script"
      - "POST /load-bank-tests"
      - "POST /load-bank-tests/{test_id}/start"
      - "POST /load-bank-tests/{test_id}/complete"
      - "POST /load-bank-tests/{test_id}/abort"
      - "POST /release-packets"
      - "POST /release-packets/{packet_id}/submit"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint of the staff read surface"

  - name: WitnessAuthority
    description: "Independent third party that witnesses executed commissioning packages. Never executes a script, which is what makes the witness signature meaningful."
    identity: "opaque"
    exclusive_operations:
      - "POST /commissioning-packages/{package_id}/witness"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint of the staff read surface"

  - name: ChangeManager
    description: "Chairs change control: approves methods of procedure and is the only role that may schedule one into a live-space window."
    identity: "opaque"
    exclusive_operations:
      - "POST /mops/{mop_id}/schedule"
    shared_operations:
      - "POST /mops/{mop_id}/approvals"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint of the staff read surface"

  - name: OperationsManager
    description: "Accepts or rejects capacity handover to operations and co-approves methods of procedure."
    identity: "opaque"
    exclusive_operations:
      - "POST /release-packets/{packet_id}/accept"
      - "POST /release-packets/{packet_id}/reject"
    shared_operations:
      - "POST /mops/{mop_id}/approvals"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint of the staff read surface"

  - name: SecurityAdministrator
    description: "Builds the security infrastructure: tenant cages, cameras and card readers, and their commissioning."
    identity: "opaque"
    exclusive_operations:
      - "POST /cages"
      - "POST /security-devices"
      - "POST /security-devices/{device_id}/commission"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint of the staff read surface"

  - name: TenantRepresentative
    description: "Read-only tenant-side observer during concurrent occupancy. X-User-ID is the Tenant id, and every tenant-scoped read is filtered to that tenant (validation 9)."
    identity: "entity_backed:Tenant"
    exclusive_operations: []
    shared_operations:
      - "GET /halls"
      - "GET /halls/{hall_id}"
      - "GET /halls/{hall_id}/capacity-summary"
      - "GET /tenants/{tenant_id}"
      - "GET /racks"
      - "GET /racks/{rack_id}"
      - "GET /cages"
      - "GET /cages/{cage_id}"
      - "GET /release-packets"
      - "GET /release-packets/{packet_id}"

# Segregation-of-duties note (role_model: segregation_of_duties):
#   (1) a CommissioningAgent may execute a script, but the WitnessAuthority who signs it must be a
#       different X-User-ID than executed_by_user_id (validation 27);
#   (2) a MOP author may not approve their own MOP (validation 28), no approver may vote twice in a
#       round (validation 29), and a HIGH risk MOP needs one ChangeManager AND one OperationsManager
#       (validation 30);
#   (3) only the MOP author may revise, execute, close or back out the MOP (validation 31).
#   ChangeManager and OperationsManager are peer approvers on POST /mops/{mop_id}/approvals but have
#   disjoint exclusive surfaces (scheduling vs release acceptance).
