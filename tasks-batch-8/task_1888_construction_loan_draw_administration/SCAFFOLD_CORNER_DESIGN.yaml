        distinguishing_aspect: "The from-line floor is evaluated at APPLY time, not create time: BL-A revised 40000000 with 10000000 occupied (disbursed 9500000 + retained 500000) cannot spare 30500000 (would leave 9500000 < 10000000) -> apply fails with 422 ERR_REALLOCATION_BELOW_FLOOR and the request stays APPROVED."
        test_recipe:
          setup: ["loan L with FUNDED draw on BL-A (disbursed 9500000, retained 500000), BL-B 30000000; reallocation A -> B of 30500000 APPROVED"]
