              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { wo_id: $.data.id }
            - call: "POST /vm/work-orders/${wo_id}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/work-orders/${wo_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/customer-notifications"
              payload: { work_order_id: "${wo_id}", premise_code: "PRM-REFUSE", contact_method: "DOOR_HANGER", unit_count_at_premise: 5 }
              as: CustomerAdvocate
              captures: { cn_bad: $.data.id }
            - call: "POST /vm/customer-notifications/${cn_bad}/notify"
              payload: {}
              as: CustomerAdvocate
            - call: "POST /vm/customer-notifications/${cn_bad}/respond"
              payload: { response: "REFUSED" }
              as: CustomerAdvocate
            - call: "POST /vm/customer-notifications"
              payload: { work_order_id: "${wo_id}", premise_code: "PRM-OK", contact_method: "PHONE", unit_count_at_premise: 5 }
              as: CustomerAdvocate
              captures: { cn_ok: $.data.id }
            - call: "POST /vm/customer-notifications/${cn_ok}/notify"
              payload: {}
              as: CustomerAdvocate
            - call: "POST /vm/customer-notifications/${cn_ok}/respond"
              payload: { response: "ACKNOWLEDGED" }
              as: CustomerAdvocate
            - call: "POST /vm/hazard-trees"
              payload: { circuit_id: "${ckt_id}", species: "SILVER_MAPLE", defect_class: "DEAD", height_ft: 60, offset_ft: 30, work_order_id: "${wo_id}" }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { ht_bad: $.data.id }
            - call: "POST /vm/hazard-trees/${ht_bad}/assess"
              payload: { customer_notification_id: "${cn_bad}" }
              as: CertifiedArborist
              as_user_id: "arborist-b"
            - call: "POST /vm/hazard-trees"
              payload: { circuit_id: "${ckt_id}", species: "SILVER_MAPLE", defect_class: "DEAD", height_ft: 60, offset_ft: 30, work_order_id: "${wo_id}" }
              as: CertifiedArborist
