        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The reviewer role alone is not enough: the determine call fails with ERR_SEGREGATION_OF_DUTIES when the reviewer's X-User-ID equals the application's intake_counselor_id, and succeeds for a different reviewer id."
        test_recipe:
          setup: ["one SUBMITTED application filed by counselor-1"]
          setup_api_calls:
            - { call: "POST /jc/applicants", payload: { full_name: "Sod Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
          trigger:
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "counselor-1", captures: { err: $.data.error_id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1", captures: { st: $.data.status } }
            - { call: "GET /jc/applicants/${a1}/applications", as: EligibilityReviewer, captures: { rev_id: "$.data[0].reviewer_id" } }
          assert:
            - "same X-User-ID as intake: error_id == ERR_SEGREGATION_OF_DUTIES (403)"
            - "different reviewer id: begin_review succeeds, status == UNDER_REVIEW"
            - "GET applications sub-resource lists exactly 1 row whose reviewer_id == reviewer-1 (recorded from the header; intake_counselor_id stays counselor-1)"

      - name: duplicate_open_application_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_APPLICATION]"]
        distinguishing_aspect: "A second application for the same applicant while the first is non-terminal fails with ERR_DUPLICATE_APPLICATION — and because the OCC check (priority 6) precedes it, the test uses a FRESH version to prove the duplicate rule itself fires."
        test_recipe:
          setup: ["applicant with one SUBMITTED application; applicant.version is now 2"]
          setup_api_calls:
            - { call: "POST /jc/applicants", payload: { full_name: "Dup Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
          trigger:
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 2, annual_income_cents: 900000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a1_v2}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { err: $.data.error_id } }
          assert:
