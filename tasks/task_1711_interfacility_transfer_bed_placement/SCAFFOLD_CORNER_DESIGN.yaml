      - name: occupancy_fields_reconcile_on_bed_mutations
        claim_type: derived_field_reconciliation
        grounds: [calculations.facility_occupancy, entities.Facility.fields.occupancy_pct]
        distinguishing_aspect: "Derived facility fields reconcile immediately on each bed mutation: create -> 0.0, occupy 1 of 4 -> 25.0, release -> 0.0; no stale cache across reads."
        test_recipe:
          setup: ["facility with 4 MED_SURG beds"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "MS-01", unit_type: "MED_SURG" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { bed1: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "MS-02", unit_type: "MED_SURG" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "MS-03", unit_type: "MED_SURG" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "MS-04", unit_type: "MED_SURG" }
              as: BedManager
              as_user_id: "${fac_r}"
          trigger:
            - call: "GET /facilities/${fac_r}"
              as: Any
              captures: { occ0: $.data.occupancy_pct, opbeds: $.data.operational_bed_count }
            - call: "PUT /beds/${bed1}"
              payload: { status: "OCCUPIED" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "GET /facilities/${fac_r}"
              as: Any
              captures: { occ25: $.data.occupancy_pct, unavail25: $.data.unavailable_bed_count }
            - call: "PUT /beds/${bed1}"
              payload: { status: "AVAILABLE" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "GET /facilities/${fac_r}"
              as: Any
              captures: { occ_back: $.data.occupancy_pct }
          assert:
            - "after 4 creations: operational_bed_count == 4, occupancy_pct == 0.0"
            - "after occupying 1: unavailable_bed_count == 1, occupancy_pct == 25.0"
            - "after release: occupancy_pct == 0.0 again (recompute on every mutation, no drift)"

