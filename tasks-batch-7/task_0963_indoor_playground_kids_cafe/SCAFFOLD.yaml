response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Config (Admin) ---
  - { method: POST, path: "/membership-plans", description: "Create a membership plan", roles: [Admin], code: 201, input: [name, monthly_fee_cents, included_session_credits, party_discount_pct, cafe_discount_pct, socks_included], output: MembershipPlan, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/membership-plans", description: "List membership plans", roles: [Anonymous, Guardian, FrontDesk, CafeStaff, Manager, Admin], code: 200, input: ["status?", "limit?", "offset?"], output: "MembershipPlan[]", side_effects: [] }
  - { method: PATCH, path: "/membership-plans/{id}", description: "Retire/reactivate a plan", roles: [Admin], code: 200, input: ["status?"], output: MembershipPlan, side_effects: ["bumps MembershipPlan.version"] }
  - { method: POST, path: "/party-packages", description: "Create a party package", roles: [Admin], code: 201, input: [name, duration_minutes, base_price_cents, included_children, extra_child_price_cents, cafe_credit_cents], output: PartyPackage, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/party-packages", description: "List party packages", roles: [Anonymous, Guardian, FrontDesk, CafeStaff, Manager, Admin], code: 200, input: ["status?", "limit?", "offset?"], output: "PartyPackage[]", side_effects: [] }
  - { method: PATCH, path: "/party-packages/{id}", description: "Retire/reactivate a package", roles: [Admin], code: 200, input: ["status?"], output: PartyPackage, side_effects: ["bumps PartyPackage.version"] }
  - { method: POST, path: "/party-rooms", description: "Create a party room", roles: [Admin], code: 201, input: [name, capacity_children], output: PartyRoom, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/party-rooms", description: "List party rooms", roles: [Anonymous, Guardian, FrontDesk, CafeStaff, Manager, Admin], code: 200, input: ["status?", "limit?", "offset?"], output: "PartyRoom[]", side_effects: [] }
  - { method: GET, path: "/party-rooms/{id}", description: "Get one party room", roles: [Anonymous, Guardian, FrontDesk, CafeStaff, Manager, Admin], code: 200, input: [], output: PartyRoom, side_effects: [] }
  - { method: PATCH, path: "/party-rooms/{id}", description: "Set room status (ACTIVE/MAINTENANCE/CLOSED)", roles: [Admin, Manager], code: 200, input: ["status?"], output: PartyRoom, side_effects: ["bumps PartyRoom.version"] }
  - { method: POST, path: "/cafe-menu-items", description: "Create a menu item", roles: [Admin], code: 201, input: [name, price_cents, "allergen_tags?", "is_grip_socks?"], output: CafeMenuItem, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/cafe-menu-items", description: "List menu items", roles: [Anonymous, Guardian, FrontDesk, CafeStaff, Manager, Admin], code: 200, input: ["status?", "limit?", "offset?"], output: "CafeMenuItem[]", side_effects: [] }
  - { method: PATCH, path: "/cafe-menu-items/{id}", description: "Retire/reactivate a menu item", roles: [Admin], code: 200, input: ["status?"], output: CafeMenuItem, side_effects: ["bumps CafeMenuItem.version"] }
  - { method: POST, path: "/staff-members", description: "Create a staff member", roles: [Admin], code: 201, input: [full_name, role], output: StaffMember, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/staff-members/{id}", description: "Get one staff member", roles: [Manager, Admin], code: 200, input: [], output: StaffMember, side_effects: [] }
  - { method: PATCH, path: "/staff-members/{id}", description: "Set staff status (ACTIVE/INACTIVE)", roles: [Admin], code: 200, input: ["status?"], output: StaffMember, side_effects: ["bumps StaffMember.version"] }

  # --- Guardians / children / waivers / membership / loyalty ---
  - { method: POST, path: "/guardians", description: "Self-register a guardian account", roles: [Anonymous], code: 201, input: [full_name, email, phone], output: Guardian, side_effects: ["membership_status=NONE, loyalty_tier=BRONZE, all counters 0, version=1"] }
  - { method: GET, path: "/guardians", description: "List guardians (filtered)", roles: [Manager, Admin], code: 200, input: ["membership_plan_id?", "limit?", "offset?"], output: "Guardian[]", side_effects: [] }
  - { method: GET, path: "/guardians/{id}", description: "Get one guardian with computed credit/loyalty fields", roles: [Guardian, FrontDesk, Manager, Admin], code: 200, input: [], output: Guardian, side_effects: [] }
  - { method: POST, path: "/guardians/{id}/children", description: "Register a child", roles: [Guardian, FrontDesk], code: 201, input: [full_name, birth_date, "allergies?"], output: Child, side_effects: [] }
  - { method: GET, path: "/guardians/{id}/children", description: "List a guardian's children", roles: [Guardian, FrontDesk, Manager], code: 200, input: ["limit?", "offset?"], output: "Child[]", side_effects: [] }
  - { method: GET, path: "/children/{id}", description: "Get one child", roles: [Guardian, FrontDesk, Manager], code: 200, input: [], output: Child, side_effects: [] }
  - { method: GET, path: "/children/{id}/visits", description: "List visits for a child", roles: [Guardian, FrontDesk, Manager], code: 200, input: ["limit?", "offset?"], output: "Visit[]", side_effects: [] }
  - { method: POST, path: "/guardians/{id}/waivers", description: "Sign a new waiver (supersedes prior SIGNED waiver); OCC on Guardian.version", roles: [Guardian, FrontDesk], code: 201, input: [expected_guardian_version], output: Waiver, side_effects: ["prior SIGNED waiver -> SUPERSEDED", "signed_at=now, expires_at=now+365d", "increments Guardian.version by 1"] }
  - { method: GET, path: "/guardians/{id}/waivers", description: "List a guardian's waivers", roles: [Guardian, FrontDesk, Manager], code: 200, input: ["limit?", "offset?"], output: "Waiver[]", side_effects: [] }
  - { method: POST, path: "/guardians/{id}/membership", description: "Enroll or change membership plan", roles: [Guardian, Admin], code: 200, input: [membership_plan_id], output: Guardian, side_effects: ["membership_status=ACTIVE; credits_granted += plan.included_session_credits; bumps Guardian.version"] }
  - { method: POST, path: "/guardians/{id}/membership/cancel", description: "Cancel membership", roles: [Guardian, Admin], code: 200, input: [], output: Guardian, side_effects: ["membership_status=CANCELLED; credits_available forfeited (credits_granted set so available=0); held credits still honored; bumps Guardian.version"] }
  - { method: GET, path: "/guardians/{id}/visits", description: "List a guardian's visits", roles: [Guardian, FrontDesk, Manager], code: 200, input: ["limit?", "offset?"], output: "Visit[]", side_effects: [] }
  - { method: GET, path: "/guardians/{id}/cafe-orders", description: "List a guardian's cafe orders", roles: [Guardian, CafeStaff, Manager], code: 200, input: ["limit?", "offset?"], output: "CafeOrder[]", side_effects: [] }
  - { method: GET, path: "/guardians/{id}/party-bookings", description: "List a guardian's party bookings", roles: [Guardian, FrontDesk, Manager], code: 200, input: ["limit?", "offset?"], output: "PartyBooking[]", side_effects: [] }
  - { method: GET, path: "/guardians/{id}/loyalty-ledger", description: "List loyalty transactions (ledger)", roles: [Guardian, Manager], code: 200, input: ["kind?", "limit?", "offset?"], output: "LoyaltyTransaction[]", side_effects: [] }
  - { method: POST, path: "/guardians/{id}/loyalty-adjustments", description: "Manual loyalty adjustment (signed points)", roles: [Manager], code: 201, input: [points, note], output: LoyaltyTransaction, side_effects: ["kind=ADJUSTMENT; recomputes points_balance and lifetime_points (floored at 0); bumps Guardian.version"] }

  # --- Session slots / visits ---
  - { method: POST, path: "/session-slots", description: "Create a session slot (half-open overlap check per slot_date)", roles: [Manager, Admin], code: 201, input: [slot_date, start_at, end_at, capacity], output: SessionSlot, side_effects: ["status=SCHEDULED; reservation_quota computed"] }
  - { method: GET, path: "/session-slots", description: "List session slots", roles: [Anonymous, Guardian, FrontDesk, CafeStaff, Manager, Admin], code: 200, input: ["slot_date?", "status?", "limit?", "offset?"], output: "SessionSlot[]", side_effects: [] }
  - { method: GET, path: "/session-slots/{id}", description: "Get one slot with live counters", roles: [Anonymous, Guardian, FrontDesk, CafeStaff, Manager, Admin], code: 200, input: [], output: SessionSlot, side_effects: [] }
  - { method: PATCH, path: "/session-slots/{id}", description: "Resize capacity (OCC); reduction may cancel newest RESERVED visits", roles: [Manager], code: 200, input: ["capacity?", expected_session_slot_version], output: SessionSlot, side_effects: ["reservation_quota recomputed; over-quota RESERVED visits cancelled newest-first (created_at DESC, tie quoted_cents DESC) with credit/prepaid compensation; increments SessionSlot.version by 1"] }
  - { method: POST, path: "/session-slots/{id}/open", description: "Open a slot for admissions", roles: [Manager], code: 200, input: [], output: SessionSlot, side_effects: ["status SCHEDULED->OPEN; bumps SessionSlot.version"] }
  - { method: POST, path: "/session-slots/{id}/close", description: "Close a slot (manager or emergency); cascades to visits and guardians", roles: [Manager], code: 200, input: [reason], output: SessionSlot, side_effects: ["full cascade per SessionSlot state machine (visits -> CANCELLED/EVACUATED, credits restored, refunds, +200 compensation points)"] }
  - { method: GET, path: "/session-slots/{id}/visits", description: "List visits on a slot", roles: [FrontDesk, Manager], code: 200, input: ["admission_status?", "limit?", "offset?"], output: "Visit[]", side_effects: [] }
  - { method: POST, path: "/visits", description: "Create a visit: RESERVATION (Guardian) or WALK_IN (FrontDesk; full desk checks, created CHECKED_IN)", roles: [Guardian, FrontDesk, Manager], code: 201, input: [session_slot_id, child_id, guardian_id, visit_type, "booked_duration_minutes?", "use_credit?", "sock_method?", "grip_socks_order_id?"], output: Visit, side_effects: ["RESERVATION: admission_status=RESERVED, quoted_cents computed, reserved_count+1, credit hold if use_credit; WALK_IN: admission_status=CHECKED_IN, checked_in_at=now, checked_in_count+1"] }
  - { method: GET, path: "/visits/{id}", description: "Get one visit", roles: [Guardian, FrontDesk, Manager], code: 200, input: [], output: Visit, side_effects: [] }
  - { method: POST, path: "/visits/{id}/pay", description: "Prepay a reservation at its quoted price", roles: [Guardian, FrontDesk], code: 200, input: [], output: Visit, side_effects: ["payment_status PENDING->PREPAID"] }
  - { method: POST, path: "/visits/{id}/check-in", description: "Check in a reserved visit (waiver + socks + window + slot gates)", roles: [FrontDesk, Manager], code: 200, input: [sock_method, "grip_socks_order_id?"], output: Visit, side_effects: ["admission_status RESERVED->CHECKED_IN; checked_in_at=now; counters recomputed"] }
  - { method: POST, path: "/visits/{id}/check-out", description: "Check out; computes final charge, reconciles payment, earns loyalty", roles: [FrontDesk, Manager], code: 200, input: [], output: Visit, side_effects: ["admission_status->COMPLETED; final_charge_cents; payment -> SETTLED with refund_delta_cents; loyalty EARN for monetary visits; credit consumed for credit visits"] }
  - { method: POST, path: "/visits/{id}/cancel", description: "Cancel a reserved visit", roles: [Guardian, FrontDesk, Manager], code: 200, input: [], output: Visit, side_effects: ["admission_status->CANCELLED; credit hold released; PREPAID -> REFUNDED"] }
  - { method: GET, path: "/visits/{id}/cafe-orders", description: "List cafe orders linked to a visit", roles: [Guardian, CafeStaff, Manager], code: 200, input: ["limit?", "offset?"], output: "CafeOrder[]", side_effects: [] }
  - { method: GET, path: "/visits/{id}/incidents", description: "List incidents linked to a visit", roles: [FrontDesk, Manager], code: 200, input: ["limit?", "offset?"], output: "Incident[]", side_effects: [] }

  # --- Party bookings ---
  - { method: POST, path: "/party-bookings", description: "Create a party booking (HELD); OCC on PartyRoom.version; conflict check incl. 30-min cleanup buffer", roles: [Guardian, FrontDesk], code: 201, input: [party_room_id, party_package_id, guardian_id, start_at, child_count, expected_party_room_version], output: PartyBooking, side_effects: ["status=HELD; end_at/quote/deposit computed; increments PartyRoom.version by 1"] }
  - { method: GET, path: "/party-bookings", description: "List party bookings (filtered)", roles: [Manager, Admin], code: 200, input: ["party_package_id?", "status?", "limit?", "offset?"], output: "PartyBooking[]", side_effects: [] }
  - { method: GET, path: "/party-bookings/{id}", description: "Get one party booking", roles: [Guardian, FrontDesk, Manager], code: 200, input: [], output: PartyBooking, side_effects: [] }
  - { method: POST, path: "/party-bookings/{id}/confirm", description: "Pay deposit and confirm (room ACTIVE + no OVERDUE sanitation)", roles: [Guardian], code: 200, input: [], output: PartyBooking, side_effects: ["status HELD->CONFIRMED; deposit_paid=true"] }
  - { method: POST, path: "/party-bookings/{id}/request-reschedule", description: "Request a new start time (48h cutoff)", roles: [Guardian], code: 200, input: [proposed_start_at], output: PartyBooking, side_effects: ["status CONFIRMED->RESCHEDULE_REQUESTED"] }
  - { method: POST, path: "/party-bookings/{id}/approve-reschedule", description: "Approve reschedule: re-check conflict, re-quote, back to CONFIRMED", roles: [Manager], code: 200, input: [], output: PartyBooking, side_effects: ["start_at=proposed_start_at; end_at recomputed; quote recomputed; status->CONFIRMED"] }
  - { method: POST, path: "/party-bookings/{id}/cancel", description: "Cancel with deposit refund waterfall; cascades to linked cafe orders and loyalty", roles: [Guardian, Manager], code: 200, input: [], output: PartyBooking, side_effects: ["status->CANCELLED; refund_cents per waterfall; linked PLACED/PREPARING CafeOrders -> CANCELLED; redeemed points restored via REVERSAL"] }
  - { method: POST, path: "/party-bookings/{id}/complete", description: "Mark a confirmed party completed after it ran", roles: [Manager], code: 200, input: [], output: PartyBooking, side_effects: ["status->COMPLETED; remaining balance collected"] }
  - { method: GET, path: "/party-bookings/{id}/cafe-orders", description: "List cafe orders linked to a party booking", roles: [Guardian, CafeStaff, Manager], code: 200, input: ["limit?", "offset?"], output: "CafeOrder[]", side_effects: [] }
  - { method: GET, path: "/party-rooms/{id}/party-bookings", description: "List bookings for a room", roles: [FrontDesk, Manager, Admin], code: 200, input: ["status?", "limit?", "offset?"], output: "PartyBooking[]", side_effects: [] }
  - { method: GET, path: "/party-rooms/{id}/sanitation-tasks", description: "List sanitation tasks for a room", roles: [FrontDesk, Manager, Admin], code: 200, input: ["status?", "limit?", "offset?"], output: "SanitationTask[]", side_effects: [] }

  # --- Cafe orders ---
  - { method: POST, path: "/cafe-orders", description: "Place an order (allergen check, per-line rounding, points redemption)", roles: [Guardian, FrontDesk], code: 201, input: [guardian_id, lines, "child_ids?", "visit_id?", "party_booking_id?", "points_to_redeem?"], output: CafeOrder, side_effects: ["status=PLACED; subtotal/total computed; REDEEM transaction if points_to_redeem>0"] }
  - { method: GET, path: "/cafe-orders/{id}", description: "Get one order", roles: [Guardian, CafeStaff, Manager], code: 200, input: [], output: CafeOrder, side_effects: [] }
  - { method: POST, path: "/cafe-orders/{id}/start-preparing", description: "Begin preparation", roles: [CafeStaff, Manager], code: 200, input: [], output: CafeOrder, side_effects: ["status PLACED->PREPARING"] }
  - { method: POST, path: "/cafe-orders/{id}/serve", description: "Serve; grants loyalty points on post-redemption total", roles: [CafeStaff, Manager], code: 200, input: [], output: CafeOrder, side_effects: ["status->SERVED; points_earned computed; EARN transaction"] }
  - { method: POST, path: "/cafe-orders/{id}/cancel", description: "Cancel an unserved order; restores redeemed points", roles: [Guardian, Manager], code: 200, input: [], output: CafeOrder, side_effects: ["status->CANCELLED; REVERSAL (+points_redeemed)"] }

  # --- Sanitation ---
  - { method: POST, path: "/sanitation-tasks", description: "Schedule a sanitation task for a party room", roles: [Manager], code: 201, input: [party_room_id, kind, due_at], output: SanitationTask, side_effects: ["status=SCHEDULED"] }
  - { method: POST, path: "/sanitation-tasks/{id}/start", description: "Start a sanitation task", roles: [FrontDesk, Manager], code: 200, input: [], output: SanitationTask, side_effects: ["status->IN_PROGRESS"] }
  - { method: POST, path: "/sanitation-tasks/{id}/complete", description: "Complete a sanitation task (checklist must pass)", roles: [FrontDesk, Manager], code: 200, input: [checklist_passed], output: SanitationTask, side_effects: ["status->COMPLETED; completed_at=now"] }

  # --- Incidents ---
  - { method: POST, path: "/incidents", description: "Report an incident (LOST_CHILD requires visit_id and gates that visit's check-out)", roles: [FrontDesk, Manager], code: 201, input: [kind, severity, description, "visit_id?"], output: Incident, side_effects: ["status=OPEN; reported_by_staff_id from X-User-ID; LOST_CHILD engages check-out gate"] }
  - { method: GET, path: "/incidents/{id}", description: "Get one incident", roles: [FrontDesk, Manager], code: 200, input: [], output: Incident, side_effects: [] }
  - { method: POST, path: "/incidents/{id}/triage", description: "Triage an open incident", roles: [Manager], code: 200, input: [], output: Incident, side_effects: ["status OPEN->TRIAGED"] }
  - { method: POST, path: "/incidents/{id}/resolve", description: "Resolve (LOST_CHILD requires child_reunited=true)", roles: [Manager], code: 200, input: ["child_reunited?", "resolution_note?"], output: Incident, side_effects: ["status->RESOLVED; resolved_at=now; check-out gate lifted"] }
  - { method: POST, path: "/incidents/{id}/reopen", description: "Reopen a resolved incident (cyclic)", roles: [Manager], code: 200, input: [], output: Incident, side_effects: ["status RESOLVED->TRIAGED; resolved_at cleared; LOST_CHILD gate re-engages"] }
  - { method: POST, path: "/incidents/{id}/close", description: "Close a resolved incident", roles: [Manager], code: 200, input: [], output: Incident, side_effects: ["status->CLOSED"] }

  # --- Ops ---
  - { method: POST, path: "/ops-runs", description: "Ops sweep: no-show marking, HELD expiry, sanitation overdue flags, slot auto-close past end_at, waiver expiry, loyalty tier recompute", roles: [Manager, Admin], code: 200, input: [], output: { no_shows_marked: integer, holds_expired: integer, sanitations_flagged: integer, slots_closed: integer, waivers_expired: integer, tiers_recomputed: integer }, side_effects: ["applies all system transitions declared in §1.2"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [Admin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, staff role/status mismatch, or Guardian acting on another guardian's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, or failed schema check (e.g. checklist_passed false)" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_SLOT_NOT_OPEN, http: 409, condition: "Session slot not OPEN for visit creation or check-in" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 422, condition: "Check-in outside [start-10min, start+15min]" }
  - { id: ERR_DUPLICATE_VISIT, http: 409, condition: "Child already has a visit in {RESERVED, CHECKED_IN} on this slot" }
  - { id: ERR_CHILD_AGE_OUT_OF_RANGE, http: 422, condition: "Child age at slot_date outside 1..12 inclusive" }
  - { id: ERR_WAIVER_INVALID, http: 422, condition: "No current signed waiver (none, SUPERSEDED, or EXPIRED)" }
  - { id: ERR_GRIP_SOCKS_REQUIRED, http: 422, condition: "Grip-sock compliance not resolvable for the declared sock_method" }
  - { id: ERR_RESERVATION_QUOTA_FULL, http: 409, condition: "reserved_count >= reservation_quota for a new RESERVATION" }
  - { id: ERR_SLOT_AT_CAPACITY, http: 409, condition: "reserved_count + checked_in_count >= capacity for a new WALK_IN" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "New slot overlaps a non-CLOSED slot on the same slot_date (half-open; adjacency allowed)" }
  - { id: ERR_CAPACITY_BELOW_OCCUPANCY, http: 422, condition: "Capacity patch below current checked_in_count, or child_count above room capacity_children" }
  - { id: ERR_ROOM_TIME_CONFLICT, http: 409, condition: "Party window incl. 30-min cleanup buffer intersects a non-terminal booking on the room" }
  - { id: ERR_ROOM_INACTIVE, http: 422, condition: "PartyRoom not ACTIVE" }
  - { id: ERR_PACKAGE_RETIRED, http: 422, condition: "PartyPackage not ACTIVE" }
  - { id: ERR_PLAN_RETIRED, http: 422, condition: "MembershipPlan not ACTIVE at enrollment" }
  - { id: ERR_MENU_ITEM_RETIRED, http: 422, condition: "Order line references a non-ACTIVE menu item" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 422, condition: "Order line allergen tags intersect listed children's allergies" }
  - { id: ERR_SANITATION_OVERDUE, http: 422, condition: "OVERDUE SanitationTask exists on the room at confirm time" }
  - { id: ERR_RESCHEDULE_CUTOFF, http: 422, condition: "Reschedule requested inside 48h of start_at" }
  - { id: ERR_CANCEL_CUTOFF, http: 422, condition: "Guardian-initiated visit cancel at/after slot start" }
  - { id: ERR_MEMBERSHIP_REQUIRED, http: 422, condition: "use_credit without an ACTIVE membership" }
  - { id: ERR_INSUFFICIENT_CREDITS, http: 402, condition: "credits_available < 1 for a credit visit" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 402, condition: "points_to_redeem exceeds points_balance" }
  - { id: ERR_REDEMPTION_CAP_EXCEEDED, http: 422, condition: "points_to_redeem exceeds floor(subtotal_cents/2)" }
  - { id: ERR_LOST_CHILD_UNRESOLVED, http: 409, condition: "Check-out blocked by an open LOST_CHILD incident linked to the visit" }
  - { id: ERR_CHILD_NOT_REUNITED, http: 422, condition: "Resolving a LOST_CHILD incident without child_reunited=true" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor; self-registration and public read of config/slots"
    identity: opaque
    exclusive_operations:
      - "POST /guardians"
    shared_operations:
      - "GET /membership-plans, GET /party-packages, GET /party-rooms, GET /party-rooms/{id}, GET /cafe-menu-items, GET /session-slots, GET /session-slots/{id}"
  - name: Guardian
    description: "Customer account; owns children, waivers, visits, bookings, orders"
    identity: "entity_backed:Guardian"
    exclusive_operations:
      - "POST /party-bookings/{id}/confirm, POST /party-bookings/{id}/request-reschedule"
    shared_operations:
      - "own-resource CRUD/actions: children, waivers, membership, visits (create RESERVATION, pay, cancel), party bookings (create, cancel), cafe orders (create, cancel), and all own GET sub-resources; public reads"
  - name: FrontDesk
    description: "Desk staff (StaffMember.role == FRONT_DESK, status ACTIVE)"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "check-in/check-out, walk-in creation, child registration, waiver assist, visit cancel, cafe order placement, incident reporting, sanitation start/complete, read-only operational lists"
  - name: CafeStaff
    description: "Cafe staff (StaffMember.role == CAFE_STAFF, status ACTIVE)"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "POST /cafe-orders/{id}/start-preparing, POST /cafe-orders/{id}/serve, order reads"
  - name: Manager
    description: "Duty manager (StaffMember.role == MANAGER, status ACTIVE); superset of FrontDesk and CafeStaff operations"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "session slot create/patch/open/close, sanitation-tasks create, incident triage/resolve/reopen/close, party approve-reschedule/complete, loyalty adjustments, guardian/party-booking filtered lists"
    shared_operations:
      - "all FrontDesk and CafeStaff shared operations; POST /ops-runs; POST /party-bookings/{id}/cancel; POST /cafe-orders/{id}/cancel; POST /visits cancel/check-in/check-out"
  - name: Admin
    description: "Platform operator; configuration and clock only"
    identity: opaque
    exclusive_operations:
      - "membership plan / party package / party room / menu item / staff create+patch, POST /_clock/set_current_utc"
    shared_operations:
      - "GET /guardians, GET /party-bookings, POST /ops-runs, POST /guardians/{id}/membership(+cancel), POST /session-slots, public reads"
