            - "A second POST /distributions/${dist_id}/void returns ERR_DISTRIBUTION_ALREADY_VOIDED (409) and appends no third tax line."

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: qualify_state_check_precedes_deficiency_readiness_check
        grounds:
          - validations[priority=40]
          - validations[priority=62]
          - errors.ERR_DRAFT_ORDER_NOT_UNDER_REVIEW
          - errors.ERR_QUALIFICATION_DEFICIENCIES_PRESENT
          - calculations.deficiency_evaluation
        distinguishing_aspect: |
          A DEFICIENT draft order that still carries outstanding deficiency codes violates two rules at
          once: the target's own state check at priority 40 (qualify requires UNDER_REVIEW) and the
          cross-entity readiness check at priority 62 (the recomputed deficiency set must be empty).
          The declared order makes the answer ERR_DRAFT_ORDER_NOT_UNDER_REVIEW (409), NOT
          ERR_QUALIFICATION_DEFICIENCIES_PRESENT — the server must not reach into the substance of the
          order before it has established that the order is even eligible for a determination. The
          discriminating half of the test resubmits the same still-deficient order so that only rule 62
          is violated and the OTHER error appears; a naive implementation that checks the content first
          returns ERR_QUALIFICATION_DEFICIENCIES_PRESENT in both cases and is indistinguishable from a
          correct one on the second call alone.
        test_recipe:
          setup:
            - "A PUBLISHED plan requiring model language, max_revisions 3."
            - "A participant not in pay status with a single assignable PRE_TAX_DEFERRAL source of 1000000 and one snapshot on 2026-06-30 at 1000000."
            - "A draft received at clock 2026-09-01 with uses_model_language false, so deficiency_codes == [MISSING_MODEL_LANGUAGE] and status is UNDER_REVIEW."
            - "A deficiency notice issued by analyst u-9001, moving the draft to DEFICIENT while the deficiency itself is still outstanding."
            - "Qualification is always attempted by administrator admin-1, distinct from u-9001, so the priority-38 segregation-of-duties check never fires."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Ordering Plan A", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, review_period_days: 45, segregation_period_days: 548, resubmission_window_days: 60, max_revisions: 3, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Rurik Almqvist", ssn_last4: "5150", date_of_birth: "1976-03-30", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Vega Almqvist", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1978-09-09", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-O1", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "model language missing" }
              as: QdroAnalyst
              as_user_id: "u-9001"
          trigger:
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { both_violated: $.data.error_id }
            - call: "POST /draft-orders/${draft_id}/resubmit"
              payload: { document_reference: "DRO-2663-O1-rev2", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { only_62_violated: $.data.error_id }
          assert:
            - "${both_violated} == \"ERR_DRAFT_ORDER_NOT_UNDER_REVIEW\" with HTTP 409 — priority 40 wins over priority 62 when a DEFICIENT draft with outstanding codes is submitted for qualification."
            - "${only_62_violated} == \"ERR_QUALIFICATION_DEFICIENCIES_PRESENT\" with HTTP 409 — after the resubmission the draft is UNDER_REVIEW again so only the readiness check is violated, and the OTHER error surfaces from the identical request."
            - "GET /draft-orders/${draft_id} still reports status == \"UNDER_REVIEW\", revision_number == 2 and deficiency_codes == [\"MISSING_MODEL_LANGUAGE\"] — neither refused qualification mutated anything."
            - "GET /qdro-cases/${case_id} still reports review_status == \"UNDER_REVIEW\" and segregation_status == \"HELD\"; GET /qdro-cases/${case_id}/alternate-payee-accounts is empty."
            - "GET /segregation-holds with qdro_case_id=${case_id} still reports status == \"HELD\" with hold_amount_cents == 400000 — a refused qualification never fires cascade link L3."

      - name: resubmission_window_check_precedes_revision_cap_check
        grounds:
          - validations[priority=55]
          - validations[priority=58]
          - errors.ERR_RESUBMISSION_WINDOW_CLOSED
          - errors.ERR_MAX_REVISIONS_EXCEEDED
          - entities.Plan.fields.max_revisions
          - entities.DeficiencyNotice.fields.resubmission_deadline_at
        distinguishing_aspect: |
          A fourth resubmission on a plan with max_revisions 3 whose latest notice deadline has also
          passed violates the temporal window rule at priority 55 and the revision cap rule at priority
          58 simultaneously. The declared order returns ERR_RESUBMISSION_WINDOW_CLOSED — lateness is
          reported before over-revision, because a party who is out of time cannot be helped by being
          told they are also out of tries. The pair is separated in time on the SAME draft order: at
          clock 2026-09-20 (deadline 2026-11-19 still open) the identical request returns
          ERR_MAX_REVISIONS_EXCEEDED, and after the clock moves to 2026-11-20 it returns
          ERR_RESUBMISSION_WINDOW_CLOSED. Both errors are 409, so an implementation cannot pass by
