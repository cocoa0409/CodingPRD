              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T12:00:00Z", payment_method: "WALK_IN", expected_room_version: "${room_v1}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_VERSION"

      - name: occ_stale_membership_version_on_credit_booking
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[membership-credit-debit-stale]", "errors[ERR_STALE_VERSION]", entities.Membership.fields.version]
        distinguishing_aspect: "A first CREDIT booking debits the membership (version advances); a second create carrying the pre-debit expected_membership_version -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE PLUS membership 8 credits; first CREDIT booking advances membership version; clock 2026-06-15T12:00:00Z."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "OccM", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "QOccM", duration_minutes: 30, list_price_cents: 3000, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "ROccM" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "TOccM", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "MOccM", email: "occm@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 8, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { mbr_v0: $.data.version }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "CREDIT", membership_id: "${mbr_id}", expected_room_version: "${room_v0}", expected_membership_version: "${mbr_v0}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res1_id: $.data.id, room_v1: $.data.version }
          trigger:
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T12:00:00Z", payment_method: "CREDIT", membership_id: "${mbr_id}", expected_room_version: "${room_v1}", expected_membership_version: "${mbr_v0}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_VERSION"

      - name: strike_expiry_sweep_on_clock_advance
        claim_type: scheduled_actions
        grounds: [state_machines.NoShowStrike.ACTIVE_to_EXPIRED, calculations.active_strike_count, entities.Member.fields.no_show_strike_count]
        distinguishing_aspect: "Advancing the clock past created_at+90 days expires an ACTIVE strike and decrements no_show_strike_count to 0 (scheduled sweep on clock-set)."
        test_recipe:
          setup: ["A member with 1 ACTIVE NO_SHOW strike minted at ~2026-06-16T10:20:00Z."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Exp", state_code: "CA", deposit_required_cents: 1000 }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "QEx", duration_minutes: 15, list_price_cents: 1200 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "REx" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "TEx", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "MEx", email: "exp@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "DEPOSIT", expected_room_version: "${room_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T10:20:00Z" }
              as: StudioAdmin
            - call: "POST /studio/reservations/${res_id}/mark-no-show"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: StudioAdmin
          assert:
            - "Member.${mem_id}.no_show_strike_count == 0"

  # ===========================================================================
