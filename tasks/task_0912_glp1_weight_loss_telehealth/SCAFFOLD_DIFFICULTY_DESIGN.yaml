          setup:
            - "Clock 2026-06-20T00:00:00Z after a CASH patient in CA was enrolled and prescribed on 2026-06-01 at dose_level 1 with units_per_cycle 2."
            - "A COMPOUNDED pharmacy serving CA holds lot L-0004 of 24 units at 0.25 mg, window capacity 6, expiring 2026-12-31."
            - "A check-in scoring 9 has been triaged, so the prescription is HELD and TitrationStep 1 is HELD."
