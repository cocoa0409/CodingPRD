          - calculations.reviewer_assignment_selection
          - state_machines.ReturnEnvelope.transitions.ESCALATED_to_PENDING_REVIEW
        distinguishing_aspect: "After rv1's round-1 NO_MATCH escalates en1, the round-2 selector excludes prior reviewers of that envelope, so the second review is assigned to rvB even though rv1 has the lower open load (0 versus 0 with an earlier created_at)."
