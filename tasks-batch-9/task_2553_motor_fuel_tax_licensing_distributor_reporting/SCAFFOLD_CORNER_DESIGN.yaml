      - name: refrigeration_claim_far_above_the_cap_returns_equipment_class_invalid
        claim_type: triggerability
        grounds:
          - errors[ERR_EQUIPMENT_CLASS_INVALID]
          - validations[priority=411]
          - validations[priority=30]
        distinguishing_aspect: "The reefer rule rejects only absurd entries - more than ten times REEFER_MONTHLY_CAP_GALLONS - so 20000.00 gallons is refused outright while 1600.00 gallons is accepted and merely capped at 1500.00 by the calculation; a PTO claim with no equipment_class fails earlier as a schema fault."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR claimant whose FILED 2026-08 return carries SCH_1 UNDYED_DIESEL 30000.00 gallons, so the tax-paid pool cannot be the limiting factor."
            - "Clock at 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Reefer Cap Fuel Supply LLC", fein: "41-8000001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Reefer Cap Distribution Inc", fein: "41-8000002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "UNDYED_DIESEL", total_gallons: 30000.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 30000.00, document_date: "2026-08-16", bill_of_lading_number: "BOL-RC-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "R. Reefer" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/refund-claims"
              payload: { licensee_id: "${dist_id}", claim_type: "REFRIGERATION_UNIT", period_month: "2026-08", claimed_gallons: 20000.00 }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_EQUIPMENT_CLASS_INVALID (20000.00 exceeds ten times the 1500.00 monthly cap)"
            - "the same claim with claimed_gallons 1600.00 returns HTTP 201 with allowable_gallons == 1500.00 and refund_amount_cents == 46350 (round_half_up(1500.00 * 30.9)), so ordinary over-cap entries are capped rather than refused"
            - "a PTO claim with no equipment_class returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST, since equipment_class is required iff claim_type == PTO"
            - "a PTO claim naming equipment_class REEFER_TRAILER returns HTTP 422 with ERR_EQUIPMENT_CLASS_INVALID, that class being outside PTO_ALLOCATION_PCT"

