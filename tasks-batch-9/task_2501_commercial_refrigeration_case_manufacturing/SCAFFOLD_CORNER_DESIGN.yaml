      - name: charge_limit_check_precedes_certification_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=11]
          - validations[priority=15]
          - errors[ERR_REFRIGERANT_CHARGE_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / charge_limit_safety_outranks_model_not_certified_on_line_add
          rationale: "The named §1.8 instance drives a line add that violates both the priority-11 charge ceiling and the priority-15 certification requirement and asserts that only ERR_REFRIGERANT_CHARGE_LIMIT_EXCEEDED is returned, which is exactly this ordering claim."

      - name: state_check_precedes_rework_limit_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=25]
          - errors[ERR_INVALID_STATE_TRANSITION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_check_outranks_rework_limit_on_completed_unit
          rationale: "The named §1.8 instance posts a FAIL result to a unit that is already COMPLETE and has rework_count 2, and asserts ERR_INVALID_STATE_TRANSITION rather than ERR_REWORK_LIMIT_EXCEEDED."

      - name: energy_test_start_on_stale_design_revision_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=14]
          - errors[ERR_CASE_MODEL_REVISION_STALE]
          - entities.EnergyTest.fields.pinned_design_revision
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / energy_test_start_blocked_by_case_model_design_revision
          rationale: "The named §1.8 instance starts a SCHEDULED test whose pinned_design_revision no longer matches the model after an engineering change and asserts 409 ERR_CASE_MODEL_REVISION_STALE."

      - name: handoff_without_booked_install_booking_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=33]
          - errors[ERR_INSTALL_BOOKING_NOT_READY]
          - state_machines.InstallBooking.transitions
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / shipment_handoff_blocked_by_released_install_booking
          rationale: "The named §1.8 instance releases the only booking of a DELIVERED shipment and asserts that handoff is 409 ERR_INSTALL_BOOKING_NOT_READY even though the contractor identity check at priority 3 still passes."

      - name: chamber_turnaround_buffer_conflict_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=24]
          - errors[ERR_CHAMBER_WINDOW_CONFLICT]
          - calculations.chamber_occupation_interval
        excluded_because:
          difficulty_instance: resource_temporal_overlap / chamber_symmetric_turnaround_buffer_single_occupancy
          rationale: "The named §1.8 instance walks the symmetric turnaround buffer boundary in the same chamber, asserting the rejected overlap and the accepted touching window."

      - name: crew_daily_case_capacity_overflow_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=32]
          - errors[ERR_CREW_DAILY_CAPACITY_EXCEEDED]
          - calculations.install_crew_daily_load
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_aggregate_per_day_case_capacity_overlap
          rationale: "The named §1.8 instance stacks overlapping bookings on one crew and asserts the per-day aggregate that first exceeds daily_case_capacity, returning 409 ERR_CREW_DAILY_CAPACITY_EXCEEDED."

      - name: booking_end_one_day_past_remodel_window_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=30]
          - errors[ERR_BOOKING_OUTSIDE_REMODEL_WINDOW]
          - calculations.install_booking_day_count
        excluded_because:
          difficulty_instance: boundary_precision_check / booking_end_date_exactly_one_day_past_remodel_window_end_accepted
          rationale: "The named §1.8 instance sits on the exclusive-end boundary, asserting that end_date == remodel_window_end + 1 day is accepted while + 2 days is 422 ERR_BOOKING_OUTSIDE_REMODEL_WINDOW."

      - name: measured_energy_at_limit_satisfies_standard
        claim_type: satisfaction_to_pass
        grounds:
          - calculations.energy_limit_daily_kwh
          - calculations.energy_use_index
          - state_machines.EnergyTest.transitions
        excluded_because:
          difficulty_instance: boundary_precision_check / measured_energy_exactly_equal_to_daily_limit_passes
          rationale: "The named §1.8 instance completes a test whose lab-variant consumption is exactly the pinned daily limit and asserts COMPLETED_PASS, which is the satisfaction side of the energy standard check."

  # ==========================================================================
  # SECTION 5 — ENDPOINTS (claim-extraction-guide Table 5)
  # ==========================================================================
  - section: endpoints
    instances:

      - name: case_model_create_then_get_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /case-models]
          - endpoints[GET /case-models/{id}]
          - entities.CaseModel
        distinguishing_aspect: "POST /case-models returns 201 with the persisted design and GET /case-models/{id} returns the identical row, so every declared design input survives the round trip unchanged."
        test_recipe:
          setup:
            - "Refrigerant R-448A exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "GET /case-models/${cm_id}", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
          assert:
            - "First call: HTTP 201, data.model_code == \"MDL-MT-8\", data.status == \"DRAFT\""
            - "Second call: HTTP 200, data.id == ${cm_id}, data.refrigerant_id == ${ref_id}, data.tda_sqft == 26.4, data.charge_grams == 4200, data.line_set_length_ft == 120, data.curtain_layers == 2, data.defrost_cycles_per_day == 4"

      - name: submit_for_test_action_records_submitter_and_bumps_version
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /case-models/{id}/submit-for-test]
          - entities.CaseModel.fields.submitted_by_user_id
          - state_machines.CaseModel.transitions
        distinguishing_aspect: "The action endpoint takes no body yet mutates three things: status MODELED -> SUBMITTED_FOR_TEST, submitted_by_user_id stamped from X-User-ID (eng-001), and version 2 -> 3."
        test_recipe:
          setup:
            - "MDL-MT-8 has run its airflow model, so it is MODELED at version 2 with submitted_by_user_id null."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
