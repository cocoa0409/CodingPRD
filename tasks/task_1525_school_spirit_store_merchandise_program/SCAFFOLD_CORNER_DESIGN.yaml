# =============================================================================
# §1.9 Scaffold Corner Design — task_1525 School Spirit Store
# Breadth coverage of §1.1–§1.7 claims not probed by §1.8.
# =============================================================================
scaffold_corner_design:

  # ============================================================ 1. Entities
  - section: entities
    instances:
      - name: create_program_applies_documented_defaults
        claim_type: defaults
        grounds: [entities.MerchProgram.fields.over_short_tolerance_cents, entities.MerchProgram.fields.exchange_window_days, entities.MerchProgram.fields.pickup_window_days, entities.MerchProgram.fields.register_buffer_minutes, entities.MerchProgram.fields.deposit_floor_cents]
        distinguishing_aspect: "Omitting every defaulted field yields 500/14/7/30/500 exactly; status SETUP; profit counters 0; version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { st: $.data.status, tol: $.data.over_short_tolerance_cents, xw: $.data.exchange_window_days, pw: $.data.pickup_window_days, rb: $.data.register_buffer_minutes, df: $.data.deposit_floor_cents, und: $.data.undistributed_profit_cents, ver: $.data.version } }
          assert:
            - "st == SETUP AND ver == 1 AND und == 0"
            - "tol == 500 AND xw == 14 AND pw == 7 AND rb == 30 AND df == 500"

      - name: get_nonexistent_program_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_PROGRAM_NOT_FOUND (404), not an empty object."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /spirit-store/programs/00000000-0000-0000-0000-000000000000", payload: {}, as: ActivitiesDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PROGRAM_NOT_FOUND"

      - name: list_programs_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints: "GET /spirit-store/programs"]
        distinguishing_aspect: "Three programs listed with limit=2 return exactly 2 items with total_count 3 and has_more true; default limit is 10."
        test_recipe:
          setup: ["Three programs exist"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "P1", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/programs", payload: { name: "P2", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/programs", payload: { name: "P3", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector }
          trigger:
            - { call: "GET /spirit-store/programs", payload: { limit: 2 }, as: ActivitiesDirector }
          assert:
            - "response contains exactly 2 items, total_count == 3, has_more == true"
            - "second page with limit=2, offset=2 returns 1 item and has_more == false"

      - name: variant_starts_with_zero_inventory_and_computed_defaults
        claim_type: computed_fields
        grounds: [entities.ProductVariant.fields.on_hand_qty, entities.ProductVariant.fields.available_qty, entities.ProductVariant.fields.landed_unit_cost_cents, entities.ProductVariant.fields.sellable]
        distinguishing_aspect: "A fresh variant has on_hand 0, reserved 0, available 0, landed 0; sellable is computed true only because program ACTIVE + design APPROVED + no drop."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
          trigger:
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { oh: $.data.on_hand_qty, rs: $.data.reserved_online_qty, av: $.data.available_qty, lc: $.data.landed_unit_cost_cents, se: $.data.sellable } }
          assert:
            - "oh == 0 AND rs == 0 AND av == 0 AND lc == 0"
            - "se == true (program ACTIVE, design APPROVED, drop_id null)"

      - name: design_royalty_pct_out_of_range_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "royalty_pct 1.5 violates the 0..1 inclusive range and is rejected at priority 5 before any state check."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Bad", artwork_ref: "b.png", royalty_pct: 1.5, licensing_fee_cents: 0 }, as: StoreManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: create_vendor_missing_required_name_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=5]", entities.Vendor.fields.name]
        distinguishing_aspect: "POST vendors without name fails schema validation with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", contact_email: "x@co.com" }, as: StoreManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: design_created_in_draft_initial_state
        claim_type: initial_state
        grounds: [state_machines.Design]
        distinguishing_aspect: "A newly created design starts DRAFT with revision_count 0 and version 1 — no transitions have fired."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0.05, licensing_fee_cents: 1000 }, as: StoreManager, captures: { st: $.data.status, rev: $.data.revision_count, ver: $.data.version } }
          assert:
            - "st == DRAFT AND rev == 0 AND ver == 1"

  # ============================================================ 2. State machines
  - section: state_machines
    instances:
      - name: program_close_blocked_with_unresolved_campaign
        claim_type: precondition_enforcement
        grounds: [state_machines.MerchProgram.ACTIVE_to_CLOSED, "errors[ERR_UNRESOLVED_OPERATIONS]"]
        distinguishing_aspect: "CLOSED is refused while any campaign is non-terminal (OPEN here); the same call succeeds once no non-terminal children exist."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED; campaign created and OPEN (goal 5)"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 5, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: CLOSED }, as: ActivitiesDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNRESOLVED_OPERATIONS (OPEN campaign blocks close)"

      - name: drop_open_before_opens_at_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.SeasonalDrop.SCHEDULED_to_OPEN, "errors[ERR_DROP_WINDOW_NOT_STARTED]"]
        distinguishing_aspect: "Opening a drop while the default clock (2026-08-01T00:00:00Z) precedes opens_at (2026-09-01) fails; after clock-set it succeeds."
        test_recipe:
          setup: ["Program ACTIVE; drop SCHEDULED with opens_at 2026-09-01"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector, captures: { pv: $.data.version } }
            - { call: "POST /spirit-store/seasonal-drops", payload: { program_id: "${prog}", name: "Fall", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", expected_program_version: "${pv}" }, as: StoreManager, captures: { drop: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/seasonal-drops/${drop}/transition", payload: { to_state: OPEN }, as: StoreManager, captures: { err: $.data.error_id } }
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/seasonal-drops/${drop}/transition", payload: { to_state: OPEN }, as: StoreManager, captures: { st: $.data.status } }
          assert:
            - "err == ERR_DROP_WINDOW_NOT_STARTED at default clock 2026-08-01"
            - "st == OPEN once clock reaches opens_at exactly (>= semantics)"

      - name: design_approve_from_draft_returns_invalid_transition
        claim_type: invalid_transition
        grounds: [state_machines.Design, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "APPROVED is reachable only from SUBMITTED; from DRAFT the transition rejects with ERR_INVALID_STATE_TRANSITION even with a correct OCC version."
        test_recipe:
          setup: ["Program ACTIVE; design DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: reconciled_event_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EventSale, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "After auto-RECONCILED, a second close-count and a cancel both reject — RECONCILED is terminal."
        test_recipe:
          setup: ["Program ACTIVE; event OPEN with float 10000 and zero sales"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Game", register_location: "GYM-T", starts_at: "2026-09-05T14:00:00Z", ends_at: "2026-09-05T16:00:00Z" }, as: StoreManager, captures: { ev: $.data.id } }
            - { call: "POST /spirit-store/event-sales/${ev}/open-drawer", payload: { opening_float_cents: 10000 }, as: StudentCashier, as_user_id: "cashier-01" }
            - { call: "POST /spirit-store/event-sales/${ev}/close-count", payload: { closing_counted_cents: 10000 }, as: Treasurer, as_user_id: "treas-01", captures: { st: $.data.status } }
          trigger:
            - { call: "POST /spirit-store/event-sales/${ev}/close-count", payload: { closing_counted_cents: 10000 }, as: Treasurer, as_user_id: "treas-01", captures: { err1: $.data.error_id } }
            - { call: "POST /spirit-store/event-sales/${ev}/cancel", payload: {}, as: StoreManager, captures: { err2: $.data.error_id } }
          assert:
            - "st == RECONCILED (over_short 0 within tolerance)"
            - "err1 == ERR_INVALID_STATE_TRANSITION AND err2 == ERR_INVALID_STATE_TRANSITION"

      - name: campaign_auto_closes_when_last_preorder_fulfilled
        claim_type: side_effect_execution
        grounds: [state_machines.PreOrderCampaign.FULFILLING_to_CLOSED, state_machines.PreOrder.PAID_to_FULFILLED]
        distinguishing_aspect: "Bubble-up: fulfilling the last PAID preorder auto-closes the FULFILLING campaign with no explicit close call; stock and program profit move exactly once."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED fee 0 royalty 0; variant M price 2500; vendor quote cost 500 min 1; campaign goal 1 (deposit 0.4 -> deposit 1000, balance 1500); preorder qty 1 PAID; clock past closes_at; locked -> IN_PRODUCTION with auto PO qty 1"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 1, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 1, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var}", customer_user_id: "cust-01", qty: 1 }, as: Customer, as_user_id: "cust-01", captures: { p1: $.data.id } }
            - { call: "POST /spirit-store/preorders/${p1}/pay", payload: { phase: DEPOSIT, amount_cents: 1000 }, as: Customer, as_user_id: "cust-01" }
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/lock", payload: {}, as: StoreManager }
            - { call: "GET /spirit-store/purchase-orders?campaign_id=${camp}", payload: {}, as: StoreManager, captures: { po: "$.data[0].id" } }
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 1 }, as: StoreManager }
          trigger:
            - { call: "POST /spirit-store/preorders/${p1}/pay", payload: { phase: BALANCE, amount_cents: 1500 }, as: Customer, as_user_id: "cust-01" }
            - { call: "POST /spirit-store/preorders/${p1}/fulfill", payload: {}, as: StoreManager, captures: { p_st: $.data.status } }
            - { call: "GET /spirit-store/preorder-campaigns/${camp}", payload: {}, as: StoreManager, captures: { c_st: $.data.status } }
            - { call: "GET /spirit-store/product-variants/${var}", payload: {}, as: StoreManager, captures: { oh: $.data.on_hand_qty } }
            - { call: "GET /spirit-store/programs/${prog}", payload: {}, as: Treasurer, captures: { prof: $.data.undistributed_profit_cents } }
          assert:
            - "p_st == FULFILLED"
            - "c_st == CLOSED (bubble-up on last PAID preorder fulfilled)"
            - "oh == 0 (auto PO delivered 1 unit; fulfill consumed it)"
            - "prof == 2000 (2500 sale - 500 landed cost; fee and royalty 0)"

      - name: preorder_fulfill_before_fulfilling_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PreOrder.PAID_to_FULFILLED, "errors[ERR_CAMPAIGN_NOT_OPEN]"]
        distinguishing_aspect: "Fulfill while the campaign is still IN_PRODUCTION (PO unreceived) rejects with ERR_CAMPAIGN_NOT_OPEN even though the preorder itself is PAID."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED; variant M; vendor APPROVED quote min 1; campaign goal 1 OPEN; preorder qty 1 PAID; clock past closes; locked -> IN_PRODUCTION (PO not received)"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 1, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 1, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var}", customer_user_id: "cust-01", qty: 1 }, as: Customer, as_user_id: "cust-01", captures: { p1: $.data.id } }
            - { call: "POST /spirit-store/preorders/${p1}/pay", payload: { phase: DEPOSIT, amount_cents: 1000 }, as: Customer, as_user_id: "cust-01" }
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/lock", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /spirit-store/preorders/${p1}/fulfill", payload: {}, as: StoreManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CAMPAIGN_NOT_OPEN (campaign IN_PRODUCTION, not FULFILLING)"

      - name: pos_sale_updates_drawer_and_stock
        claim_type: side_effect_execution
        grounds: [state_machines.Order, entities.EventSale.fields.cash_sales_cents, entities.MerchProgram.fields.undistributed_profit_cents]
        distinguishing_aspect: "One CASH POS sale of qty 2 at 2500 moves three places atomically: event.cash_sales_cents 5000, variant.on_hand 25->23, program.undistributed_profit 4000."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED fee 0 royalty 0; variant M price 2500 stocked 25 (landed 500); event OPEN float 10000"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
