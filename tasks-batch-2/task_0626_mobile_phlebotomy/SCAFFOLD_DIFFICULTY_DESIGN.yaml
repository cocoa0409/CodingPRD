  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_window_half_open_no_conflict_at_touch
        grounds:
          - validations[priority=12]
          - entities.Appointment.fields.window_start_utc
          - entities.Appointment.fields.window_end_utc
          - state_machines.LabOrder.ORDERED_to_SCHEDULED
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on the RouteDay resource: a second appointment whose
          window_start_utc EQUALS the first's window_end_utc (09:30) is ACCEPTED (back-to-back, no overlap) —
          the opposite adjacency rule from the closed-interval route-day shift overlap.
        test_recipe:
          setup:
            - "Route day rd with one booked appointment 09:00-09:30 (version advanced to 2); second ORDERED order O2"
          setup_api_calls:
            - call: "POST /test-panels"
