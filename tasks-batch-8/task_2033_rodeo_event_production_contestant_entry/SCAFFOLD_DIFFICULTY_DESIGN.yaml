        distinguishing_aspect: "state-vs-business_temporal pair: the request violates both the ENTRIES_OPEN posture gate (priority 7) and the entries_close_at clock gate (priority 8); the state-category error ERR_RODEO_NOT_OPEN must win."
        test_recipe:
          setup:
            - "Rodeo with one BAREBACK event and one performance, posture DRAW_LOCKED (entries were opened and locked)"
