            - call: "POST /declaration-packages/${dp_id}/units"
              payload: { unit_number: "102", floor_level: 2, heated_square_feet: 900, boundary_note: "interior finish surfaces", base_percentage_interest_bp: 3333 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { u102: "$.data.id" }
            - call: "POST /declaration-packages/${dp_id}/units"
              payload: { unit_number: "103", floor_level: 3, heated_square_feet: 900, boundary_note: "interior finish surfaces", base_percentage_interest_bp: 3333 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { u103: "$.data.id" }
            - call: "POST /units/${u103}/withdraw"
              payload: { withdrawal_reason: "sponsor retains 103" }
