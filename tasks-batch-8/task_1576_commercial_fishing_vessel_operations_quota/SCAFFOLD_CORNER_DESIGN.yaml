          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (http 403); settlement stays CALCULATED"

      - name: rbac_regulator_cannot_create_trip
        claim_type: role_denial
        grounds:
          - roles[FisheriesRegulator]
        distinguishing_aspect: "Regulators manage openings but cannot plan trips; trip creation is VesselOwner/Captain only."
        test_recipe:
          setup: ["one ACTIVE vessel and one opening"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-R6", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
