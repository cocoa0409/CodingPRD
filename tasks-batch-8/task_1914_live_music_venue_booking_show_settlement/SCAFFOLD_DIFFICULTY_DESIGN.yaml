              as: BookingAgent
              as_user_id: "${csc_agent}"
              captures: { csc_s: $.data.id }
            - call: "POST /shows/${csc_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${csc_agent}" }
              as: BookingAgent
              as_user_id: "${csc_agent}"
              captures: { csc_h: $.data.id }
            - call: "GET /shows/${csc_s}"
              payload: {}
              as: VenueManager
              captures: { csc_v0: $.data.version }
            - call: "POST /shows/${csc_s}/date-holds/${csc_h}/confirm"
              payload: { expected_show_version: "${csc_v0}" }
              as: BookingAgent
              as_user_id: "${csc_agent}"
            - call: "POST /shows/${csc_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 50000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 10000, support_budget_cents: 20000, bar_split_pct: 0, merch_split_pct: 0 }
              as: BookingAgent
              as_user_id: "${csc_agent}"
              captures: { csc_o: $.data.id }
            - call: "GET /shows/${csc_s}"
              payload: {}
              as: VenueManager
              captures: { csc_v1: $.data.version }
            - call: "POST /shows/${csc_s}/offers/${csc_o}/accept"
              payload: { expected_show_version: "${csc_v1}" }
              as: VenueManager
            - call: "POST /shows/${csc_s}/ticket-tiers"
              payload: { tier_name: "GA", face_price_cents: 2000, capacity: 200, tier_order: 1 }
              as: Promoter
              captures: { csc_t: $.data.id }
            - call: "GET /shows/${csc_s}"
              payload: {}
              as: Promoter
              captures: { csc_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:01Z" }
              as: VenueManager
            - call: "POST /shows/${csc_s}/on-sale"
              payload: { expected_show_version: "${csc_v2}" }
              as: Promoter
            - call: "POST /shows/${csc_s}/ticket-sales"
              payload: { tier_id: "${csc_t}", quantity: 10 }
              as: Promoter
              captures: { csc_sale: $.data.id }
            - call: "POST /shows/${csc_s}/support-acts"
              payload: { artist_name: "Opener X", agreed_fee_cents: 8000, buyout_fee_cents: 6000 }
              as: Promoter
              captures: { csc_sup: $.data.id }
          trigger:
            - call: "POST /shows/${csc_s}/cancel"
              payload: { reason: "VENUE" }
              as: VenueManager
              captures: { csc_cancel: $.data.id }
          assert:
            - "Show.${csc_s}.status == CANCELLED  # link 1"
            - "TicketSale.${csc_sale}.refund_status == REFUNDED  # link 1 side effect"
            - "Show.${csc_s}.tickets_sold == 0  # recomputed"
            - "Show.${csc_s}.gross_ticket_revenue_cents == 0  # recomputed"
            - "SupportAct.${csc_sup}.status == CANCELLED  # link 2"
            - "A WireTransfer with purpose=SUPPORT_BUYOUT amount=4000 (=0.5×8000) status=INITIATED exists for support ${csc_sup}  # link 3"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_onsale
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DEPOSIT_NOT_CLEARED]
        distinguishing_aspect: |
          Category pair state vs business_safety/business_fiscal: a Show in
          HOLD_PENDING (state violation) that also has insufficient deposit
          (business violation) MUST return ERR_INVALID_STATE (priority 5) not
          ERR_DEPOSIT_NOT_CLEARED (priority 8). Pair: state × business_fiscal.
        test_recipe:
          setup:
            - "Show freshly created (status=HOLD_PENDING), no date hold confirmed, no deposit paid"
            - "Both validations would fail; state check fires first"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "PC", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { pc_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { pc_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${pc_a}", room: "MAIN_ROOM", show_date: "2026-10-20", doors_at_utc: "2026-10-20T19:00:00Z", curfew_at_utc: "2026-10-20T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-10T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${pc_agent}"
              captures: { pc_s: $.data.id, pc_v: $.data.version }
          trigger:
            - call: "POST /shows/${pc_s}/on-sale"
              payload: { expected_show_version: "${pc_v}" }
              as: Promoter
              captures: { pc_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 5 state beats priority 8 business)"
            - "Show.${pc_s}.status remains HOLD_PENDING"

      - name: business_temporal_vs_business_constraint_on_hold_confirm
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_HOLD_EXPIRED]
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint: a hold-confirm
          attempted after hold_expires_at_utc AND where a competing higher-priority
          hold exists — temporal expiry check (priority 9) MUST fire before any
          constraint check. Pair: business_temporal × business_constraint
          (distinct from instance 1's state × business_fiscal).
        test_recipe:
          setup:
            - "Show with a P2 hold placed at T0 (24h TTL)"
            - "Clock advanced past T0+24h so hold is expired; agent also places a competing P1 hold on the same (room, date) after expiry"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "HX", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { hx_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { hx_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${hx_a}", room: "MAIN_ROOM", show_date: "2026-11-01", doors_at_utc: "2026-11-01T19:00:00Z", curfew_at_utc: "2026-11-01T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${hx_agent}"
              captures: { hx_s: $.data.id }
            - call: "POST /shows/${hx_s}/date-holds"
              payload: { priority: "P2", booked_by_agent_id: "${hx_agent}" }
              as: BookingAgent
              as_user_id: "${hx_agent}"
              captures: { hx_h: $.data.id }
            # Advance clock 25 hours so P2 hold expired
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T01:00:01Z" }
              as: VenueManager
            - call: "GET /shows/${hx_s}"
              payload: {}
              as: VenueManager
              captures: { hx_v: $.data.version }
          trigger:
            - call: "POST /shows/${hx_s}/date-holds/${hx_h}/confirm"
              payload: { expected_show_version: "${hx_v}" }
              as: BookingAgent
              as_user_id: "${hx_agent}"
              captures: { hx_err: $.data.error_id }
          assert:
            - "error_id == ERR_HOLD_EXPIRED (temporal check wins)"
            - "DateHold.${hx_h}.status remains ACTIVE in DB (or transitioned to EXPIRED by system); not CONFIRMED"

