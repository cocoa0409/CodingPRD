      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
      assert:
      - the first trigger call fails with error_id ERR_STALE_PROJECT_VERSION and HTTP 412
      - immediately after the refusal Project.${proj_id}.version == 2 (the failed create did not advance it)
      - the re-read reports Project.${proj_id}.version == 2, so ${pv2} == 2
      - the retry with ${pv2} returns HTTP 201 with PurchaseCommitment.${pc_id}.po_number == "PO-2996-0001" (never consumed by the refused call, so the retry is not ERR_DUPLICATE_PO_NUMBER)
      - PurchaseCommitment.${pc_id}.committed_base_cost == 1150000.00 and commitment_status == PENDING
      - MaterialPackage.${pkg_id}.status == BOUGHT_OUT
      - Project.${proj_id}.version == 3
