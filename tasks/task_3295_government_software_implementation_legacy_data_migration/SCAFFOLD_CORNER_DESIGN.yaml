scaffold_corner_design:
- section: entities
  instances:
  - name: agency_create_returns_system_fields_and_active_status
    claim_type: Creation
    grounds:
    - entities.Agency
    - endpoints.POST_/programs/agencies
    distinguishing_aspect: POST /programs/agencies with only agency_code and display_name returns 201 with status ACTIVE, version 1, and system-minted id/created_at/updated_at;
      primary_time_zone defaults to America/Chicago.
    test_recipe:
      setup:
      - Empty database; clock at default 2026-09-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /programs/agencies
        payload:
          agency_code: REV
          display_name: Dept of Revenue
        as: PlatformAdmin
        captures:
          ag_id: $.data.id
      assert:
      - response status 201; response_type object
      - Agency.${ag_id}.status == ACTIVE and version == 1
      - Agency.${ag_id}.primary_time_zone == "America/Chicago" (default applied)
      - id, created_at, updated_at present and non-null
  - name: contract_get_missing_returns_not_found
    claim_type: Not Found
    grounds:
    - entities.ProcurementContract
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET /programs/contracts/{id} with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND.
    test_recipe:
      setup:
      - Empty database; clock set.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /programs/contracts/{id}
        payload: {}
        as: ProcurementOfficer
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_NOT_FOUND with http 404
  - name: migration_record_has_no_version_field_immutable_log
    claim_type: Immutability
    grounds:
    - entities.MigrationRecord
    distinguishing_aspect: "MigrationRecord declares common_fields: false \u2014 records carry id and created_at only, no version/updated_at; there is no update endpoint\
      \ for records, only ingest."
    test_recipe:
      setup:
      - Contract IMPLEMENTATION; batch DEFINED with two records ingested.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /programs/agencies
        payload:
          agency_code: REV
          display_name: Dept of Revenue
        as: PlatformAdmin
        captures:
          ag_id: $.data.id
      - call: POST /programs/contracts
        payload:
          agency_id: ${ag_id}
          solicitation_number: RFP-2026-001
          vendor_name: TylerTech
          contract_value_cents: 500000000
        as: ProcurementOfficer
        captures:
          co_id: $.data.id
          co_v: $.data.version
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: POSTED
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: Q&A_OPEN
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: Q&A_CLOSED
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: EVALUATION
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: AWARD_PENDING
        as: ProcurementOfficer
      - call: GET /programs/contracts/${co_id}
        payload: {}
        as: ProcurementOfficer
        captures:
          co_v5: $.data.version
      - call: POST /programs/contracts/${co_id}/award
        payload:
          expected_contract_version: ${co_v5}
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/phases
        payload:
          sequence_no: 1
          name: ANALYSIS
          planned_start_on: '2026-10-01'
          planned_end_on: '2026-12-31'
        as: ImplementationManager
        captures:
          ph1: $.data.id
      - call: POST /programs/contracts/${co_id}/start-implementation
        payload: {}
        as: ImplementationManager
      - call: POST /programs/contracts/${co_id}/migration-batches
        payload:
          domain: PAYROLL
          source_system_label: LP
          expected_record_count: 2
          expected_net_value_cents: 300
        as: DataMigrationLead
        captures:
          b1: $.data.id
      - call: POST /programs/migration-batches/${b1}/records
        payload:
          records:
          - legacy_primary_key: A1
            field_payload:
              x: 1
            signed_value_cents: 100
          - legacy_primary_key: A2
            field_payload:
              x: 2
            signed_value_cents: 200
        as: DataMigrationLead
      trigger:
      - call: GET /programs/migration-batches/${b1}/records
        payload: {}
        as: DataMigrationLead
      assert:
      - each returned record has id and created_at but no version field
      - "record legacy_primary_key values round-trip exactly (A1, A2) \u2014 historical fidelity"
  - name: staff_default_status_and_function_enum
    claim_type: Type Constraints
    grounds:
    - entities.StaffMember.fields.staff_function
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: staff_function is an enum; an out-of-enum value (e.g. MANAGER) is rejected with ERR_INVALID_REQUEST, and new staff start with status ACTIVE.
    test_recipe:
      setup:
      - Agency exists.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /programs/agencies
        payload:
          agency_code: REV
          display_name: Dept of Revenue
        as: PlatformAdmin
        captures:
          ag_id: $.data.id
      trigger:
      - call: POST /programs/agencies/${ag_id}/staff
        payload:
          full_name: Bad Func
          email: bf@x.gov
          tenure_years: 1
          staff_function: MANAGER
        as: AgencyProjectManager
        captures:
          err: $.data.error_id
      - call: POST /programs/agencies/${ag_id}/staff
        payload:
          full_name: Ok Func
          email: of@x.gov
          tenure_years: 1
          staff_function: TRAINEE
        as: AgencyProjectManager
        captures:
          ok_id: $.data.id
      assert:
      - first create rejected with ERR_INVALID_REQUEST (400)
      - second create succeeds; StaffMember.${ok_id}.status == ACTIVE
  - name: list_endpoint_pagination_envelope
    claim_type: Listing
    grounds:
    - endpoints.GET_/programs/contracts
    - response_envelope
    distinguishing_aspect: GET /programs/contracts returns response_type array with pagination fields limit/offset/total_count/has_more; default limit is 10 and offset
      0.
    test_recipe:
      setup:
      - Agency with two contracts created.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /programs/agencies
        payload:
          agency_code: REV
          display_name: Dept of Revenue
        as: PlatformAdmin
        captures:
          ag_id: $.data.id
      - call: POST /programs/contracts
        payload:
          agency_id: ${ag_id}
          solicitation_number: RFP-2026-001
          vendor_name: TylerTech
          contract_value_cents: 500000000
        as: ProcurementOfficer
        captures:
          co_id: $.data.id
          co_v: $.data.version
      - call: POST /programs/contracts
        payload:
          agency_id: ${ag_id}
          solicitation_number: RFP-2026-002
          vendor_name: OtherVendor
          contract_value_cents: 1000
        as: ProcurementOfficer
      trigger:
      - call: GET /programs/contracts
        payload: {}
        as: ProcurementOfficer
      assert:
      - response_type == array and data contains exactly 2 contracts
      - meta carries api_request_id and api_request_timestamp
      - pagination reports total_count == 2 and has_more == false with default limit 10
- section: state_machines
  instances:
  - name: contract_cancel_from_draft_cascades_nothing_and_locks
    claim_type: invalid_transition
    grounds:
    - state_machines.ProcurementContract.ANY_to_CANCELLED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: A DRAFT contract can be cancelled directly (ANY non-terminal -> CANCELLED), and from terminal CANCELLED every further transition including
      award fails with ERR_INVALID_STATE.
    test_recipe:
      setup:
      - Contract in DRAFT.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /programs/agencies
        payload:
          agency_code: REV
          display_name: Dept of Revenue
        as: PlatformAdmin
        captures:
          ag_id: $.data.id
      - call: POST /programs/contracts
        payload:
          agency_id: ${ag_id}
          solicitation_number: RFP-2026-001
          vendor_name: TylerTech
          contract_value_cents: 500000000
        as: ProcurementOfficer
        captures:
          co_id: $.data.id
          co_v: $.data.version
      trigger:
      - call: POST /programs/contracts/${co_id}/cancel
        payload:
          cancel_reason: funding pulled
        as: ProcurementOfficer
        captures:
          st: $.data.status
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: POSTED
        as: ProcurementOfficer
        captures:
          err: $.data.error_id
      assert:
      - cancel succeeds; ProcurementContract.${co_id}.status == CANCELLED
      - "subsequent transition rejected with ERR_INVALID_STATE (409) \u2014 terminal lockdown"
