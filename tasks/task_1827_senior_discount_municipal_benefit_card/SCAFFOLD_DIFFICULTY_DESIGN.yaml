            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: FraudAnalyst, captures: { card_status: "$.data[0].status" } }
          assert:
            - "UsageTransaction.${t1}.status == POSTED and flagged_by_user_id == null (link 1)"
            - "Cardholder.${ch_id}.fraud_flag_count == 2 (link 2)"
            - "Cardholder.${ch_id}.status == ACTIVE and pre_suspension_status == null (link 3: restored to preserved pre-suspension state)"
            - "BenefitCard.${card_id}.status == ACTIVE (link 4: restoration cascades to cards)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_approve_state_vs_fiscal_priority
        grounds:
          - "validations[priority=4]"
          - "validations[priority=9]"
          - "errors[ERR_CLAIM_NOT_SUBMITTED]"
          - "errors[ERR_FUND_INSUFFICIENT]"
        distinguishing_aspect: |
          Error-category pair {state, business_fiscal}: approving an already-DENIED
          claim violates state (ERR_CLAIM_NOT_SUBMITTED, priority 4) AND the
          recomputed final (150) exceeds the fund's available 100
          (ERR_FUND_INSUFFICIENT, priority 9). The state error must win.
        test_recipe:
          setup:
            - "Cardholder onboarded with ACTIVE card; merchant rate 50 cap 100000; GROCERY offer 10% max 1000; ProgramFund FY2026 allocated only 100"
            - "Clock 2026-08-05T10:00:00Z: three transactions purchase 1000 -> discount 100 each"
            - "Clock 2026-09-01: claim for 2026-08 submitted (provisional 3 x round_half_up(100*0.5) = 150), then DENIED by admin-1"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Prio State", date_of_birth: "1960-01-01", annual_income_cents: 600000, residency_address: "10 Fir St" }, as: Applicant, captures: { app_id: $.data.id } }
