  - rule_id: non_linear_state_machine
    instances:
      - name: permit_parallel_status_dimensions
        grounds:
          - state_machines.GrazingPermit.CURRENT_to_DELINQUENT
          - state_machines.GrazingPermit.DELINQUENT_to_CURRENT
          - state_machines.GrazingBill.ISSUED_to_DELINQUENT
          - entities.GrazingPermit.fields.permit_status
          - entities.GrazingPermit.fields.account_status
        distinguishing_aspect: |
          GrazingPermit carries two genuinely independent state dimensions
          (permit_status x account_status): advancing the clock past a bill's due date moves
          account_status CURRENT -> DELINQUENT while permit_status stays ISSUED, and paying the
          bill moves account_status back to CURRENT with permit_status still untouched — the
          permit's grazing authority never changes state because of money.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs and two 300-AUM pastures"
            - "A permittee with a 400-AUM LAND base property and an ISSUED 300-AUM permit whose term runs to 2030-12-31"
            - "An ISSUED 2026 AOI carrying a PRELIMINARY_USE bill of 54100 cents due 2026-08-31"
            - "Logical clock still at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Two Dimension Allotment", admin_unit_code: "NV-045", acres: 40000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 2 }
