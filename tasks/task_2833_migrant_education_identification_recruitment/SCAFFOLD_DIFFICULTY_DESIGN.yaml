  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cascade_a_coe_approval_walks_four_hops_to_reallocated_plan_hours
        grounds:
          - state_machines.CertificateOfEligibility.SUBMITTED_to_APPROVED
          - state_machines.EligibilityTerm.ACTIVE_to_EXPIRING
          - state_machines.Student.PENDING_DETERMINATION_to_ELIGIBLE
          - calculations.coe_eligibility_window
          - calculations.pfs_priority_score
          - calculations.service_hours_allocation
          - entities.Student.fields.eligibility_expires_on
          - entities.ServicePlan.fields.allocated_hours
        distinguishing_aspect: |
          CASCADE-A is a FOUR-HOP chain rooted at a single approve call whose fourth hop is
          observable only because it changes data no earlier hop touched: certificate APPROVED ->
          new EligibilityTerm ACTIVE -> Student ELIGIBLE with eligibility_expires_on 2029-06-30 ->
          PFS recomputed against the advanced clock (60 -> 42, pfs_flag true -> false) and the
          student's DRAFT plan re-allocated from 120.00 to 75.00 hours.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default for identification and certification"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter"
            - "one ENROLLED Student born 2010-03-20 with school_days_interrupted 10, both placement flags true and credit_deficit 2"
            - "one VERIFIED move dated 2026-06-15, a supporting INITIAL interview, and a SUBMITTED certificate with residency_date 2026-07-01 and qc_hold_exempt true"
            - "while pfs_flag is true (score 60) one DRAFT SUMMER_PROGRAM plan is created, so it is allocated the whole 120.00 PFS budget"
            - "the clock is then advanced to 2027-07-01, pushing the single verified move outside the inclusive 365-day recency window; nothing recomputes until the approve call"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 9, school_days_interrupted: 10, math_below_grade: true, reading_below_grade: true, credit_deficit: 2 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", interview_kind: "INITIAL", conducted_on: "2026-06-20", informant_relationship: "PARENT", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Parent confirms apple harvest work.", corroboration_count: 1 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_a_id: $.data.id }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_id: $.data.id }
            - call: "POST /mep/coes/${coe_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: ServiceCoordinator
              captures: { stu_v: $.data.version, pfs_before: $.data.pfs_score }
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "SUMMER_PROGRAM", delivery_mode: "IN_PERSON", expected_student_version: "${stu_v}" }
              as: ServiceCoordinator
              captures: { plan_id: $.data.id, alloc_before: $.data.allocated_hours }
            - call: "POST /mep/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: StateProgramAdmin
          trigger:
            - call: "POST /mep/coes/${coe_id}/approve"
              payload: {}
              as: StateProgramAdmin
              captures: { coe_status: $.data.status, coe_end: $.data.eligibility_end_on }
          assert:
            - "before the trigger: Student.${stu_id}.pfs_score == 60, pfs_flag == true, and ServicePlan.${plan_id}.allocated_hours == 120.00 with priority_tier == PFS"
            - "hop 1: CertificateOfEligibility.${coe_id}.status == APPROVED, eligibility_start_on == 2026-07-01, eligibility_end_on == 2029-06-30, age_out_capped == false"
            - "hop 2: exactly one EligibilityTerm exists for ${stu_id} with status == ACTIVE, coe_id == ${coe_id}, term_start_on == 2026-07-01 and term_end_on == 2029-06-30"
            - "hop 3: Student.${stu_id}.eligibility_status == ELIGIBLE and Student.${stu_id}.eligibility_expires_on == 2029-06-30"
            - "hop 4: Student.${stu_id}.pfs_score == 42, pfs_variant == INTERRUPTION_WEIGHTED, pfs_flag == false (the 2026-06-15 move now sits outside the 2026-07-02..2027-07-01 recency window)"
            - "hop 4: ServicePlan.${plan_id}.allocated_hours == 75.00, expected_service_hours == 75.00 and priority_tier == NON_PFS"
            - "ServicePlan.${plan_id}.status == DRAFT - the cascade re-allocated the plan without activating it"
            - "Student.${stu_id}.service_status == PLAN_DRAFTED - the service dimension was not moved by the eligibility cascade"

      - name: cascade_b_coe_invalidation_walks_three_hops_and_preserves_earned_hours
        grounds:
          - state_machines.CertificateOfEligibility.APPROVED_to_INVALIDATED
          - state_machines.EligibilityTerm.ACTIVE_to_TERMINATED
          - state_machines.Student.ELIGIBLE_to_TERM_EXPIRED
          - state_machines.ServicePlan.ACTIVE_to_CLOSED
