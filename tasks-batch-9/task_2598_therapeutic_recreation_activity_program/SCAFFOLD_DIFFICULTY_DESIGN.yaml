              captures: { gate_err_id: $.data.error_id }
          assert:
            - "ParticipationRecord.${rec3_id}.outcome == REFUSED"
            - "Resident.${res_id}.refusal_streak == 3"
            - "ActivityPlan.${plan_id}.status == UNDER_REVISION"
            - "ActivityPlan.${plan_id}.review_reason == REFUSAL_PATTERN"
            - "ActivityPlan.${plan_id}.revision_count == 1"
            - "Resident.${res_id}.care_plan_review_due == true"
            - "Resident.${res_id}.enrollment_gate == THERAPIST_REVIEW"
            - "the trailing enrollment on ${s4_id} returns 409 and ${gate_err_id} == \"ERR_ENROLLMENT_GATED\""
            - "ActivitySession.${s4_id}.enrolled_count == 0"
      - name: session_cancel_cascade_depth_three
        depth: 3
        trigger_kind: "cancelling a SCHEDULED session that already carries an enrollment and a confirmed volunteer assignment"
        grounds:
          - state_machines.ActivitySession.SCHEDULED_to_CANCELLED
          - state_machines.ParticipationRecord.PLANNED_to_VOID
          - state_machines.VolunteerAssignment.CONFIRMED_to_WITHDRAWN
          - calculations.volunteer_hours
