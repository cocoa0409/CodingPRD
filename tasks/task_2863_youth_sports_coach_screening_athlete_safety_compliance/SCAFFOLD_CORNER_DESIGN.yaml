              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_rt_id: $.data.id }
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", score_variant: "SELF_ATTESTED", sampled_member_ids: ["${m_rt_id}"] }
              as: ComplianceAuditor
              captures: { audit_rt_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_rt_id}/findings"
              payload: { finding_code: "RECORDS_INCOMPLETE", severity: "MINOR", is_repeat: false }
              as: ComplianceAuditor
              captures: { f_rt_1_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_rt_id}/findings"
              payload: { finding_code: "TRAINING_OVERDUE", severity: "MINOR", is_repeat: false }
              as: ComplianceAuditor
              captures: { f_rt_2_id: $.data.id }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { rt_open_2: $.data.open_finding_count, rt_critical_2: $.data.critical_open_finding_count, rt_posture_2: $.data.compliance_posture }
            - call: "POST /safesport/club-audits/${audit_rt_id}/findings"
              payload: { finding_code: "UNSCREENED_CONTACT", severity: "CRITICAL", member_id: "${m_rt_id}", is_repeat: false }
              as: ComplianceAuditor
              captures: { f_rt_3_id: $.data.id }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { rt_open_3: $.data.open_finding_count, rt_critical_3: $.data.critical_open_finding_count, rt_posture_3: $.data.compliance_posture }
            - call: "POST /safesport/club-audits/${audit_rt_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              captures: { rt_audit_status: $.data.status, rt_total: $.data.finding_total_count }
          trigger:
            - call: "POST /safesport/audit-findings/${f_rt_3_id}/decision"
              payload: { decision: "WAIVED", note: "critical finding waived on documented evidence" }
              as: ComplianceAuditor
              captures: { rt_finding_status: $.data.status }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { rt_open_4: $.data.open_finding_count, rt_critical_4: $.data.critical_open_finding_count, rt_posture_4: $.data.compliance_posture }
            - call: "GET /safesport/club-audits/${audit_rt_id}"
              payload: {}
              as: ComplianceAuditor
              captures: { rt_audit_open: $.data.open_finding_count, rt_audit_waived: $.data.waived_finding_count, rt_audit_total: $.data.finding_total_count }
          assert:
            - "${rt_posture_0} == OPEN"
            - "${rt_open_2} == 2"
            - "${rt_critical_2} == 0"
            - "${rt_posture_2} == OPEN"
            - "${rt_open_3} == 3"
            - "${rt_critical_3} == 1"
            - "${rt_posture_3} == FROZEN"
            - "${rt_posture_3} != RESTRICTED"
            - "${rt_audit_status} == FINDINGS_ISSUED"
            - "${rt_total} == 3"
            - "${rt_finding_status} == WAIVED"
            - "${rt_open_4} == 2"
            - "${rt_critical_4} == 0"
            - "${rt_posture_4} == OPEN"
            - "${rt_audit_open} == 2"
            - "${rt_audit_waived} == 1"
            - "${rt_audit_total} == 3"
      - name: four_hop_measure_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / interim_measure_four_hop_restriction_cascade
          rationale: |
            The cascading_side_effects layer claim - an N-level chain verified end to end with
            ordering sensitivity - is exactly what the difficulty instance proves: measure ->
            member posture -> every ACTIVE CoachAssignment -> each affected Club's three
            counters, across two clubs at once. A separate §1.9 instance would re-walk the same
            four hops with weaker assertions.
      - name: both_score_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / compliance_score_self_attested_vs_registry_verified
          rationale: |
            The dual_variant_calculation layer claim - both variants produce expected results and
            the delta on switch is correct - is fully discharged by the difficulty instance,
            which runs two audits over one identical member sample and pins both scores and the
            Club.compliance_score that the later finalize overwrites.

  - section: consistency_model
    instances:
      - name: derived_fields_and_cascades_are_visible_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /safesport/club-audits/{club_audit_id}/findings].side_effects
          - endpoints[POST /safesport/club-audits/{club_audit_id}/finalize].side_effects
          - calculations.club_compliance_posture
        distinguishing_aspect: |
          The consistency model is immediate, so there is no window in which a denormalized field
          lags: the finding write's own 201 already reports the audit's incremented counters, the
          very next read of the club already shows the FROZEN posture, and the finalize response's
          compliance_score is already equal to the value the club and the audit return on the
          reads that immediately follow it - the same read repeated a second time returns exactly
          the same values, so nothing settles late.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with member m_im, sampled by audit audit_im"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Ines Marek", email: "ines.marek@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1990-10-14", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_im_id: $.data.id }
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", score_variant: "SELF_ATTESTED", sampled_member_ids: ["${m_im_id}"] }
              as: ComplianceAuditor
              captures: { audit_im_id: $.data.id, im_sampled_count: $.data.sampled_member_count, im_open_0: $.data.open_finding_count }
          trigger:
            - call: "POST /safesport/club-audits/${audit_im_id}/findings"
              payload: { finding_code: "UNSCREENED_CONTACT", severity: "CRITICAL", member_id: "${m_im_id}", is_repeat: false }
              as: ComplianceAuditor
              captures: { im_finding_id: $.data.id, im_finding_status: $.data.status }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { im_posture_read_1: $.data.compliance_posture, im_club_critical_1: $.data.critical_open_finding_count }
            - call: "GET /safesport/club-audits/${audit_im_id}"
              payload: {}
              as: ComplianceAuditor
              captures: { im_audit_open_1: $.data.open_finding_count, im_audit_total_1: $.data.finding_total_count }
            - call: "POST /safesport/club-audits/${audit_im_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              captures: { im_score_write: $.data.compliance_score, im_denominator: $.data.denominator_count }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { im_club_score: $.data.compliance_score, im_posture_read_2: $.data.compliance_posture }
            - call: "GET /safesport/club-audits/${audit_im_id}"
              payload: {}
              as: ComplianceAuditor
              captures: { im_score_read: $.data.compliance_score, im_audit_status: $.data.status }
            - call: "GET /safesport/club-audits/${audit_im_id}"
              payload: {}
              as: ComplianceAuditor
              captures: { im_score_read_again: $.data.compliance_score }
          assert:
            - "${im_sampled_count} == 1"
            - "${im_open_0} == 0"
            - "${im_finding_status} == OPEN"
            - "${im_audit_open_1} == 1"
            - "${im_audit_total_1} == 1"
            - "${im_club_critical_1} == 1"
            - "${im_posture_read_1} == FROZEN"
            - "${im_denominator} == 1"
            - "${im_score_write} == ${im_club_score}"
            - "${im_score_write} == ${im_score_read}"
            - "${im_score_read_again} == ${im_score_read}"
            - "${im_audit_status} == FINDINGS_ISSUED"
            - "${im_posture_read_2} == FROZEN"
            - "no waiting, retry or second write is performed between any write and the read that checks it"
