  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: worker_double_booking_closed_interval_overlap_on_hire
        grounds:
          - validations[priority=15]
          - state_machines.Submittal.OFFERED_to_HIRED
          - entities.Assignment.fields.start_date
          - entities.Assignment.fields.planned_end_date
          - errors[ERR_WORKER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Interval semantics = CLOSED-interval overlap (shared endpoints collide):
          a worker with an ACTIVE assignment [2026-01-01, 2026-06-01] cannot be
          hired into [2026-06-01, 2026-09-01] because the endpoints touch
          (2026-06-01 is in both) -> ERR_WORKER_DOUBLE_BOOKED. Resource = the
          worker; distinct from the Timesheet discrete-week-bucket semantics below.
        test_recipe:
          setup:
            - "Worker hired into ACTIVE assignment [2026-01-01, 2026-06-01]; a second OFFERED submittal for the same worker on another opening"
          setup_api_calls:
