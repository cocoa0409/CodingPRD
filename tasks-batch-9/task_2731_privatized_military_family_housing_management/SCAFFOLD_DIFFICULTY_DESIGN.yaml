  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # Two instances over DIFFERENT resource entities with DIFFERENT interval
  # semantics:
  #   8.1  DisplacementLodging nights on one Lease — half-open [start, end)
  #        overlap, where adjacency (previous end == new start) is legal
  #   8.2  HousingUnit occupancy succession — a whole-day MINIMUM GAP after
  #        last_lease_end_date, which is not an overlap test at all
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: lodging_half_open_intervals_allow_adjacency_reject_containment
        grounds:
          - validations[priority=40]
          - entities.DisplacementLodging.fields.start_date
          - entities.DisplacementLodging.fields.end_date
          - endpoints.POST_/displacement-lodgings
          - errors.ERR_LODGING_INTERVAL_OVERLAP
        distinguishing_aspect: |
          The contended resource is the Lease's displacement-lodging calendar and
          the interval semantics are HALF-OPEN [start_date, end_date): a new
          interval starting exactly on an existing interval's end_date is legal
          (zero-length touch), and so is one ending exactly on an existing
          interval's start_date, while a partially straddling interval and a
          fully contained interval are both rejected. Both edges of the same
          existing interval are probed. Instance 8.2 contends over a different
          resource entity (HousingUnit) under different semantics (a whole-day
          minimum gap, where touching is exactly what is forbidden).
        test_recipe:
          setup:
            - "One installation with one 2-bedroom TOWNHOME unit; lease 1 is OCCUPIED / ACTIVE from 2026-09-01 with daily_rent_cents 7172."
            - "The clock stands at 2026-09-20T10:00:00Z and a MOLD HazardCase on the unit has been assessed at 45 affected_area_sqft with a child under six, so it is DISPLACEMENT_ACTIVE and priority 26 is satisfied for every lodging request below."
            - "One AUTHORIZED DisplacementLodging already covers [2026-09-20, 2026-09-30) at nightly_rate_cents 22000 for 4 occupants; the authorised ceiling is 2 + 3 == 5, so priority 39 never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
