      - name: interview_sample_exact_minimum
        grounds:
          - calculations.worker_interview_min_sample
          - "validations[priority=9]"
          - "errors[ERR_INTERVIEW_SAMPLE_TOO_SMALL]"
        distinguishing_aspect: |
          Zero/empty-set-free integer boundary on the interview-count metric via a
          different endpoint: worker_count 100 gives min_sample ceil(sqrt(100)) = 10
          exactly; 9 MUST be rejected and 10 MUST pass (>= semantics), and the failed
          attempt MUST NOT consume the one-record-per-audit slot.
        test_recipe:
          setup:
            - "Supplier ACTIVE; facility US / 100 workers; audit IN_PROGRESS (clock 2026-09-01)"
          setup_api_calls:
