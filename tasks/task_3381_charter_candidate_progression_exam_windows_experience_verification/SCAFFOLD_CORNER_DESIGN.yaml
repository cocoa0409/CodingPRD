              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ELIGIBILITY_NOT_MET"
            - "GET /charter/program-enrollments?candidate_id=${cand_a} returns 0 rows (eligibility rejection creates nothing)"

      - name: c_education_graduation_23_month_boundary
        claim_type: Satisfaction → Pass
        grounds:
          - calculations.enrollment_eligibility_evaluation
          - entities.ProgramEnrollment.fields.graduation_date
        distinguishing_aspect: "The education window is inclusive at 23 months: at clock 2027-01-05 a 2028-12-05 graduation (exactly 23 months between) enrolls with 201 while a 2029-01-05 graduation (24 months) is rejected 422."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidates E and F exist, neither with a completed degree."
          setup_api_calls:
            - *c_clock
            - call: "POST /charter/candidates"
              payload: { email: "e.cand@example.com", full_name: "E Candidate", date_of_birth: "1999-02-02", gov_id_number: "GOV-E-1005" }
              as: ProgramAdmin
              captures: { cand_e: $.data.id }
            - call: "POST /charter/candidates"
              payload: { email: "f.cand@example.com", full_name: "F Candidate", date_of_birth: "1999-03-03", gov_id_number: "GOV-F-1006" }
              as: ProgramAdmin
              captures: { cand_f: $.data.id }
          trigger:
            - call: "POST /charter/candidates/${cand_e}/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: false, graduation_date: "2028-12-05" }
              as: ProgramAdmin
              captures: { enr_e: $.data.id }
            - call: "POST /charter/candidates/${cand_f}/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: false, graduation_date: "2029-01-05" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "E's enrollment is created 201 (months_between 2027-01-05..2028-12-05 == 23 <= EDUCATION_WINDOW_MONTHS 23)"
            - "F's enrollment is 422 ERR_ELIGIBILITY_NOT_MET (24 months > 23)"
            - "enr_e status == PENDING_PAYMENT with lifetime_charges_cents == 35003"

      - name: c_state_vs_fiscal_priority_on_booking
