            - "recognized_recovery_cents == 240000 (EXPECTED_VALUE at HIGH = 2000 bps of 1200000, under the 100000000 contractual cap) — responding does not revalue the claim"
            - "The identical call as ReserveController returns 403 ERR_FORBIDDEN_ROLE; the endpoint is SupplierRep-exclusive"

      - name: corner_same_user_cannot_propose_and_post_one_accrual
        claim_type: Segregation of duties
        grounds:
