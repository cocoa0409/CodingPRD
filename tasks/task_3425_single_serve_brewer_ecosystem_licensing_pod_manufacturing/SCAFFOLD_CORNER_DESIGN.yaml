# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: task_3425_single_serve_brewer_ecosystem_licensing_pod_manufacturing
# Breadth probe over §1.1–§1.7 claims not already exercised by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: brand_create_returns_declared_fields_and_system_fields
        claim_type: Creation
        grounds:
          - "entities.Brand"
          - "endpoints.POST_/brands"
        distinguishing_aspect: "A brand POST returns 201 with the input fields echoed, server-minted id/created_at/updated_at, and version 1 — status fields are never client-supplied because Brand has none."
        test_recipe:
          setup: ["Logical clock at the startup default 2026-09-01T00:00:00Z (no clock-set call). Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /brands"
              payload: { name: "Blue Mesa Coffee", kind: "LICENSED", home_region: "US-SW" }
              as: PlatformAdmin
              captures: { en1_brand: $.data.id }
          assert:
            - "status 201, response_type object"
            - "Brand.${en1_brand}.name == 'Blue Mesa Coffee', kind == LICENSED, home_region == 'US-SW'"
            - "id, created_at, updated_at present; created_at == 2026-09-01T00:00:00Z (logical clock default); version == 1"

      - name: pod_variety_create_applies_defaults_and_initial_state
        claim_type: Defaults
        grounds:
          - "entities.PodVariety.fields.material"
          - "state_machines.PodVariety"
        distinguishing_aspect: "Omitting material yields CONVENTIONAL; the variety starts ACTIVE with velocity_units_90d 0, slow_mover false (age gate), education_notices_sent 0, version 1."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One PLATFORM_OWNED brand."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Defaults Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { en2_brand: $.data.id }
          trigger:
            - call: "POST /pod-varieties"
              payload: { brand_id: "${en2_brand}", name: "Plain Medium", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${en2_brand}"
              captures: { en2_var: $.data.id }
          assert:
            - "status 201; PodVariety.${en2_var}.material == CONVENTIONAL (default applied)"
            - "status == ACTIVE, velocity_units_90d == 0, slow_mover == false, education_notices_sent == 0, version == 1"

      - name: household_create_initializes_computed_fields
        claim_type: Computed Fields
        grounds:
          - "entities.Household.fields.engagement"
          - "entities.Household.fields.installed_brewers"
        distinguishing_aspect: "A freshly created household with zero brewers computes installed_brewers 0, engagement CHURNED, trailing_avg_pods 0.00, expected_monthly_pods 0.00 — client-supplied values for these fields are ignored."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { region: "NE", size: 3 }
              as: PlatformAdmin
              captures: { en3_hh: $.data.id }
          assert:
            - "Household.${en3_hh}.installed_brewers == 0 and engagement == CHURNED"
            - "trailing_avg_pods == 0.00 and expected_monthly_pods == 0.00 (engagement factor 0.0)"

      - name: subsidy_and_margin_computed_at_model_creation
        claim_type: Computed Fields
        grounds:
          - "entities.BrewerModel.fields.subsidy_cents"
          - "calculations.brewer_subsidy_snapshot"
        excluded_because:
          difficulty_instance: combinatorial_formula / subsidy_snapshot_evaluation_order
          rationale: "Snapshot-at-creation and non-retroactivity asserted there, including the base-0 and base-2 literals."

      - name: variety_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - "endpoints.GET_/pod-varieties"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "Three varieties exist; limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row has_more false; brand_id and roast_level filters narrow the set."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Two brands; brand A has varieties V1 (LIGHT), V2 (DARK); brand B has V3 (DARK)."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Page Brand A", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { en5_ba: $.data.id }
            - call: "POST /brands"
              payload: { name: "Page Brand B", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { en5_bb: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${en5_ba}", name: "V1 Light", roast_level: "LIGHT", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${en5_ba}"
            - call: "POST /pod-varieties"
              payload: { brand_id: "${en5_ba}", name: "V2 Dark", roast_level: "DARK", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${en5_ba}"
            - call: "POST /pod-varieties"
              payload: { brand_id: "${en5_bb}", name: "V3 Dark", roast_level: "DARK", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${en5_bb}"
          trigger:
            - call: "GET /pod-varieties"
              payload: { limit: 2, offset: 0 }
              as: CategoryManager
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "GET /pod-varieties {limit: 2, offset: 2}: 1 row, total_count == 3, has_more == false"
            - "GET /pod-varieties {brand_id: ${en5_ba}}: exactly 2 rows"
            - "GET /pod-varieties {roast_level: 'DARK'}: exactly 2 rows (V2, V3)"

      - name: variety_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.GET_/pod-varieties/{id}"
          - "errors.ERR_NOT_FOUND"
          - "validations[priority=4]"
        distinguishing_aspect: "A well-formed but unallocated id on a single-resource GET yields 404 ERR_NOT_FOUND, not 400 and not an empty object."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. No varieties exist."]
          setup_api_calls: []
          trigger:
            - call: "GET /pod-varieties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { en6_err: $.data.error_id }
          assert:
            - "status 404 and error_id == ERR_NOT_FOUND"

      - name: create_variety_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "validations[priority=5]"
          - "errors.ERR_INVALID_REQUEST"
        distinguishing_aspect: "Omitting roast_level (source input, no default) fails with 400 ERR_INVALID_REQUEST; no variety is persisted."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One brand."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Required Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { en7_brand: $.data.id }
          trigger:
            - call: "POST /pod-varieties"
              payload: { brand_id: "${en7_brand}", name: "No Roast", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${en7_brand}"
              captures: { en7_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: create_variety_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=5]"
          - "entities.PodVariety.fields.roast_level"
        distinguishing_aspect: "roast_level 'EXTRA_DARK' is not in {LIGHT, MEDIUM, DARK} and fails 400 before any state or business check runs."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One brand."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Enum Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { en8_brand: $.data.id }
          trigger:
            - call: "POST /pod-varieties"
              payload: { brand_id: "${en8_brand}", name: "Burnt", roast_level: "EXTRA_DARK", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${en8_brand}"
              captures: { en8_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: consumption_record_is_immutable_without_version
        claim_type: Immutability
        grounds:
          - "entities.ConsumptionRecord"
        distinguishing_aspect: "common_fields false: the record carries id and created_at only — no version, no updated_at — and no update/delete endpoint exists for it."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One household."]
          setup_api_calls:
            - call: "POST /households"
              payload: { region: "NW", size: 2 }
              as: PlatformAdmin
              captures: { en9_hh: $.data.id }
          trigger:
            - call: "POST /households/${en9_hh}/consumption-records"
              payload: { period: "2026-08", pods_brewed: 100 }
              as: PlatformAdmin
              captures: { en9_rec: $.data.id }
          assert:
            - "status 201; response data has id and created_at but no version and no updated_at"
            - "period == '2026-08' and pods_brewed == 100"

      - name: quality_audit_is_immutable_without_version
        claim_type: Immutability
        grounds:
          - "entities.QualityAudit"
        distinguishing_aspect: "Audits are append-only evidence: the response carries id/created_at plus the computed result, but no version field, and audits can never be transitioned or edited."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. ACTIVE agreement."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Audit Imm Co", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { en10_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${en10_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { en10_ag: $.data.id }
            - call: "POST /license-agreements/${en10_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
          trigger:
            - call: "POST /license-agreements/${en10_ag}/quality-audits"
              payload: { audited_at: "2026-08-01T00:00:00Z", cup_score: 92, defect_rate_ppm: 40 }
              as: QualityAuditor
              captures: { en10_au: $.data.id }
          assert:
            - "status 201; result == PASS; data carries id and created_at but no version/updated_at"

      - name: record_brews_with_unknown_variety_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=4]"
          - "endpoints.POST_/brewers/{id}/record-brews"
        distinguishing_aspect: "A body-level foreign key (variety_id) that does not resolve is a 404 ERR_NOT_FOUND — existence is validated for body references, not just path segments."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Household with one ACTIVE brewer."]
          setup_api_calls:
            - call: "POST /households"
              payload: { region: "NW", size: 1 }
              as: PlatformAdmin
              captures: { en11_hh: $.data.id }
            - call: "POST /brewer-models"
              payload: { model_code: "K-NF", firmware_compat: "OPEN", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 5000, unit_cost_cents: 4000 }
              as: PlatformAdmin
              captures: { en11_model: $.data.id }
            - call: "POST /households/${en11_hh}/brewers"
              payload: { model_id: "${en11_model}", serial_number: "SN-EN11" }
              as: PlatformAdmin
              captures: { en11_br: $.data.id }
          trigger:
            - call: "POST /brewers/${en11_br}/record-brews"
              payload: { brews: 3, variety_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: PlatformAdmin
              captures: { en11_err: $.data.error_id }
          assert:
            - "status 404, error_id == ERR_NOT_FOUND; brew_count unchanged at 0"

      - name: statement_period_after_clock_month_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=5]"
          - "entities.RoyaltyStatement.fields.period"
        distinguishing_aspect: "A statement for 2026-10 while the logical clock reads 2026-09-01 is a future period and fails 400 ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. ACTIVE agreement."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Future Period Co", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { en12_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${en12_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { en12_ag: $.data.id }
            - call: "POST /license-agreements/${en12_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
          trigger:
            - call: "POST /license-agreements/${en12_ag}/royalty-statements"
              payload: { period: "2026-10", sell_in_units: 10, sell_through_units: 10, unlicensed_share_pct: 0 }
              as: FinanceAnalyst
              captures: { en12_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400) — period may not exceed the clock month 2026-09"

      - name: create_household_with_zero_size_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=5]"
          - "entities.Household.fields.size"
        distinguishing_aspect: "size 0 violates the >= 1 range and fails 400; size 1 succeeds — a zero-quantity edge on an entity field."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { region: "NW", size: 0 }
              as: PlatformAdmin
              captures: { en13_err: $.data.error_id }
            - call: "POST /households"
              payload: { region: "NW", size: 1 }
              as: PlatformAdmin
              captures: { en13_hh: $.data.id }
          assert:
            - "size 0: error_id == ERR_INVALID_REQUEST (400)"
            - "size 1: created 201"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: agreement_created_in_draft_and_run_in_reserved
        claim_type: Initial State
        grounds:
          - "state_machines.LicenseAgreement"
          - "state_machines.ProductionRun"
        distinguishing_aspect: "POST /license-agreements returns status DRAFT (not ACTIVE); POST /production-runs returns status RESERVED with actual_units null — initial states are server-assigned."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Licensed brand; owned variety and line for the run."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Init Co", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { sm1_brand: $.data.id }
            - call: "POST /brands"
              payload: { name: "Init Owned", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { sm1_obrand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${sm1_obrand}", name: "Init Var", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${sm1_obrand}"
              captures: { sm1_var: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Init Plant", kind: "OWNED", region: "US" }
              as: OperationsDirector
              captures: { sm1_fac: $.data.id }
            - call: "POST /facilities/${sm1_fac}/filling-lines"
              payload: { line_code: "L1", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { sm1_line: $.data.id }
          trigger:
            - call: "POST /license-agreements"
              payload: { brand_id: "${sm1_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { sm1_ag: $.data.id, sm1_ag_status: $.data.status }
            - call: "POST /production-runs"
              payload: { line_id: "${sm1_line}", variety_id: "${sm1_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 100 }
              as: ProductionPlanner
              captures: { sm1_run_status: $.data.status, sm1_run_actual: $.data.actual_units }
          assert:
            - "agreement status == DRAFT on creation"
            - "run status == RESERVED and actual_units == null on creation"

      - name: terminated_agreement_accepts_no_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.LicenseAgreement"
          - "errors.ERR_INVALID_STATE"
        distinguishing_aspect: "From TERMINATED every further transition target (ACTIVE, SUSPENDED, TERMINATED again) is rejected 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Agreement ACTIVE then TERMINATED."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Lockdown Co", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { sm2_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${sm2_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { sm2_ag: $.data.id }
            - call: "POST /license-agreements/${sm2_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /license-agreements/${sm2_ag}/transition"
              payload: { target_state: "TERMINATED" }
              as: LicensingManager
          trigger:
            - call: "POST /license-agreements/${sm2_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
              captures: { sm2_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); agreement remains TERMINATED"

      - name: settled_statement_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.RoyaltyStatement"
          - "errors.ERR_INVALID_STATE"
        distinguishing_aspect: "SETTLED -> DISPUTED is rejected; a settled statement can never be reopened."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. ACTIVE agreement; statement ISSUED then SETTLED."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Settle Co", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { sm3_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${sm3_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { sm3_ag: $.data.id }
            - call: "POST /license-agreements/${sm3_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /license-agreements/${sm3_ag}/royalty-statements"
              payload: { period: "2026-08", sell_in_units: 10, sell_through_units: 10, unlicensed_share_pct: 0 }
              as: FinanceAnalyst
              captures: { sm3_st: $.data.id }
            - call: "POST /royalty-statements/${sm3_st}/transition"
              payload: { target_state: "ISSUED" }
              as: FinanceAnalyst
            - call: "POST /royalty-statements/${sm3_st}/transition"
              payload: { target_state: "SETTLED" }
              as: FinanceAnalyst
          trigger:
            - call: "POST /royalty-statements/${sm3_st}/transition"
              payload: { target_state: "DISPUTED", dispute_reason: "too late" }
              as: FinanceAnalyst
              captures: { sm3_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); statement remains SETTLED with dispute_count 0"

      - name: run_cannot_start_outside_its_window
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.ProductionRun.RESERVED_to_IN_PROGRESS"
          - "errors.ERR_INVALID_STATE"
        distinguishing_aspect: "RESERVED -> IN_PROGRESS before window_start (clock 2026-09-01, window opens 2026-09-10) fails 409 — the window gate is on the transition, not on creation."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Run RESERVED for 2026-09-10."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Window Gate", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { sm4_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${sm4_brand}", name: "Gate Var", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${sm4_brand}"
              captures: { sm4_var: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Gate Plant", kind: "OWNED", region: "US" }
              as: OperationsDirector
              captures: { sm4_fac: $.data.id }
            - call: "POST /facilities/${sm4_fac}/filling-lines"
              payload: { line_code: "L1", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { sm4_line: $.data.id }
            - call: "POST /production-runs"
              payload: { line_id: "${sm4_line}", variety_id: "${sm4_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 100 }
              as: ProductionPlanner
              captures: { sm4_run: $.data.id }
          trigger:
            - call: "POST /production-runs/${sm4_run}/transition"
              payload: { target_state: "IN_PROGRESS" }
              as: ProductionPlanner
              captures: { sm4_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409) — window not yet open"
            - "run remains RESERVED"

      - name: plan_cannot_skip_proposal
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.AssortmentPlan"
          - "errors.ERR_INVALID_STATE"
        distinguishing_aspect: "DRAFT -> APPROVED is not a declared transition; the plan must pass through PROPOSED first."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Account and a DRAFT plan with one ACTIVE variety slot."]
          setup_api_calls:
            - call: "POST /brands"
