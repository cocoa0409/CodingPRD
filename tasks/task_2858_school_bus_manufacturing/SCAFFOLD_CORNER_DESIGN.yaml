            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-TX-100", buyer_type: "DISTRICT", buyer_name: "Plano ISD", spec_profile_id: "${tx_id}", unit_count: 1, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 20000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_tx_id: $.data.id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_tx_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_tx_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: SalesEngineer
              as_user_id: "sales-01"
            - call: "POST /bids/${bid_tx_id}/submit"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
            - call: "POST /solicitations/${sol_tx_id}/close"
              payload: {}
              as: ContractsAdmin
