      - name: book_succeeds_with_correct_version
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[book-stale-job]', entities.Job.fields.estimated_total_cents]
        distinguishing_aspect: "POST /jobs/{id}/book with expected_job_version equal to the freshly-read Job.version succeeds, moves the job to BOOKED, and copies the quote total (20700) to estimated_total_cents."
