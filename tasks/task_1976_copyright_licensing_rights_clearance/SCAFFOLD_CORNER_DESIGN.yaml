            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "st == HOLDER_REVIEW"
            - "err == ERR_STALE_VERSION  (sequential duplicate with the pre-mutation version)"

      - name: occ_stale_payment_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[license-payment-stale-license]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Payment B carrying the pre-payment-A license version fails 412; re-reading and re-posting with the fresh version succeeds (the version the client observed MUST come from a server response)."
        test_recipe:
          setup: ["License UNPAID fee 200000, version captured at grant"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "OCC Pay House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "OCC Pay Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-11-10T00:00:00Z", requested_units: 2 }
              as: Requester
              as_user_id: req_c_37
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_c_21
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
          trigger:
            - call: "POST /rights/licenses/${lic_id}/payments"
              payload: { amount_cents: 100000, expected_license_version: "${lic_v}" }
              as: FinancePayer
              as_user_id: fin_c_5
            - call: "POST /rights/licenses/${lic_id}/payments"
              payload: { amount_cents: 100000, expected_license_version: "${lic_v}" }
              as: FinancePayer
              as_user_id: fin_c_5
              captures: { err: "$.data.error_id" }
            - call: "GET /rights/licenses/${lic_id}"
              payload: {}
              as: FinancePayer
              captures: { lic_v_fresh: "$.data.version" }
            - call: "POST /rights/licenses/${lic_id}/payments"
              payload: { amount_cents: 100000, expected_license_version: "${lic_v_fresh}" }
              as: FinancePayer
              as_user_id: fin_c_5
            - call: "GET /rights/licenses/${lic_id}"
              payload: {}
              as: FinancePayer
              captures: { fee_status: "$.data.fee_status" }
          assert:
            - "err == ERR_STALE_VERSION  (second payment reused the pre-mutation version)"
            - "fee_status == PAID  (re-read + retry posts cleanly)"

      - name: occ_stale_reservation_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[reservation-create-stale-license]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A reservation create carrying a license version captured before another reservation consumed pool units fails 412."
        test_recipe:
          setup: ["License ACTIVE unit_limit 5; version captured at grant; reservation R1 of 4 units succeeds; reservation R2 reuses the grant-time version"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "OCC Res House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "OCC Res Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-11-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_c_38
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_c_22
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 4, expected_license_version: "${lic_v}" }
              as: IngestionAgent
          trigger:
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 1, expected_license_version: "${lic_v}" }
              as: IngestionAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_STALE_VERSION  (stale version detected even though 1 unit would still fit)"

      - name: clock_default_is_2026_08_01
        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "Before any set_current_utc call, a takedown filed 'now' gets received_at == 2026-08-01T00:00:00Z — the fixed startup default, not wall-clock time."
        test_recipe:
          setup: ["Asset exists; no clock call has been made"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Clock House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Clock Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
          trigger:
            - call: "POST /rights/assets/${asset_id}/takedown-notices"
              payload: { claimant_name: "Clock Watcher" }
              as: AssetCurator
              captures: { rcv: "$.data.received_at", due: "$.data.counter_notice_due_at" }
          assert:
            - "rcv == 2026-08-01T00:00:00Z  (fixed default logical clock)"
            - "due == 2026-08-11T00:00:00Z  (received + 10 days)"

  # ===========================================================================
  # Section: consistency model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_cascade_in_same_read
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.License]
        distinguishing_aspect: "After the revoke call returns, a subsequent GET shows lifecycle=REVOKED, reservations FORFEITED, and alert CANCELLED — no eventual-consistency lag anywhere in the cascade."
        test_recipe:
          setup: ["License with HELD reservation; UPHELD takedown (filed default clock, lapsed to 2026-08-12)"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Imm House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Imm Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-11-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_c_39
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_c_23
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version", alert_id: "$.data.renewal_alert_id" }
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 2, expected_license_version: "${lic_v}" }
              as: IngestionAgent
              captures: { res_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/takedown-notices"
              payload: { claimant_name: "Immediate" }
              as: AssetCurator
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: AssetCurator
          trigger:
            - call: "POST /rights/licenses/${lic_id}/revoke"
              payload: {}
              as: LegalCertifier
            - call: "GET /rights/licenses/${lic_id}"
              payload: {}
              as: FinancePayer
              captures: { lifecycle: "$.data.lifecycle", reserved: "$.data.units_reserved" }
            - call: "GET /rights/usage-reservations/${res_id}"
              payload: {}
              as: IngestionAgent
              captures: { res_status: "$.data.status" }
            - call: "GET /rights/licenses/${lic_id}/renewal-alerts"
              payload: {}
              as: FinancePayer
              captures: { alert_status: "$.data[0].status" }
          assert:
            - "lifecycle == REVOKED and reserved == 0"
            - "res_status == FORFEITED"
            - "alert_status == CANCELLED  (all cascade effects visible in the immediately following reads)"
