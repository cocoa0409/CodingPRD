    roles: [Organizer]
    code: 200
    input: []
    output: StockLine
    side_effects: ["status -> COMMITTED"]
  - method: POST
    path: "/stock-lines/{id}/deliver"
    description: "COMMITTED -> DELIVERED; records qty_delivered; BACKLIST accrues firm purchase cost"
    roles: [Organizer]
    code: 200
    input: [qty_delivered]
    output: StockLine
    side_effects: ["status -> DELIVERED", "qty_available_for_sale recomputed", "BACKLIST: Fair.firm_purchases_cents += per-line rounded cost"]
  - method: POST
    path: "/stock-lines/{id}/damage"
