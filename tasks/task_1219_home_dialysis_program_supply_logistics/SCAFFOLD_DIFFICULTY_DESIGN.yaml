            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att2: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: ASEPTIC_TECHNIQUE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att3: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: EMERGENCY_RESPONSE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att4: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: SUPPLY_STORAGE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att5: $.data.id } }
            - { call: "POST /api/training-attempts/${att1}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att2}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att3}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att4}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att5}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt1: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt1}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-9", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mach_v: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mach_v}" }, as: BiomedTechnician }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pat_v}" }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "CONCENTRATE_5L", quantity: 300 } ], expected_patient_version: "${pat_v2}" }, as: Patient, as_user_id: "${pat}", captures: { ord: $.data.id } }
            - { call: "POST /api/supply-orders/${ord}/submit", as: Patient, as_user_id: "${pat}" }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: REASSESSMENT, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 25 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt2: $.data.id } }
          trigger:
            - { call: "POST /api/home-assessments/${asmt2}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { cap: $.data.storage_cap_units } }
            - { call: "GET /api/supply-orders/${ord}", as: ProgramAdmin, captures: { ostatus: $.data.order_status } }
            - { call: "GET /api/home-assessments/${asmt1}", as: ProgramAdmin, captures: { a1status: $.data.status } }
          assert:
            - "HomeAssessment.${asmt1}.status == SUPERSEDED   (link 1: accept supersedes the prior ACCEPTED row)"
            - "Patient.${pat}.storage_cap_units == 100        (link 2: min(400, floor(25*4)) recomputed from the new assessment)"
            - "SupplyOrder.${ord}.order_status == CANCELLED   (link 3: on_hand 0 + 300 units > new cap 100 triggers the cap-shrink cascade)"
            - "HomeAssessment.${asmt2}.status == ACCEPTED"

  # ------------------------------------------------------------------ RULE 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_cancelled_order_blocked_posture_state_wins
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.SupplyOrder.DRAFT_to_CANCELLED
          - calculations.posture_derivation
        distinguishing_aspect: |
          Category pair state-vs-business_safety: the order is CANCELLED (state violation,
          ERR_ORDER_INVALID_STATE) and the patient posture is BLOCKED by an open escalation
          (safety violation, ERR_POSTURE_NOT_ORDERABLE); the state error at priority 5 must win
          over the safety error at priority 6.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient; May DRAFT order created then cancelled"
            - "2 zero-consumption logs auto-create a CADENCE review; the review is ESCALATED, so posture recomputes to BLOCKED"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program J", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Ten", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
