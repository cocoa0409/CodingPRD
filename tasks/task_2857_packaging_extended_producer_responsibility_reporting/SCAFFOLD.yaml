scenario: |
  Packaging Extended Producer Responsibility Reporting (consumer brand packaging compliance):
  producer definition analysis determining obligated party by brand ownership and import status,
  packaging material data collection by weight, material type and recyclability by stock keeping
  unit, state program registration, producer responsibility organization membership and fee
  schedules, eco-modulation adjustments rewarding recyclable and reduced packaging, reporting
  periods with data submission, third-party verification and correction windows, exemption
  analysis for small producers and specific product categories, packaging redesign roadmap
  balancing cost, protection and fee reduction, multi-state variance management across differing
  definitions and deadlines
domain_name: packaging-epr-reporting
api_prefix: "/epr"

complexity_profile:
  difficulty_level: expert_plus
  difficulty_rationale: |
    Expert band (§0.4) on entity count, deliberately above it on endpoint/error surface because the
    scenario carries eleven distinct sub-workflows (obligation analysis, SKU material data, state
    registration, PRO membership, fee schedules, eco-modulation, reporting periods, third-party
    verification, correction windows, exemption analysis, multi-state variance). Difficulty is
    carried by coupling density, not by table size: every fee number depends on a state-program
    policy triple (obligation_basis x eco_mod_policy x fee_rounding_order), a version-pinned fee
    schedule, and a tier basis whose inclusion set differs between the PROVISIONAL and FINAL
    variants of the same formula.
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - version_pinning_on_approval
  entity_topology: flat
  entity_topology_note: |
    Peer entities linked by explicit foreign keys; the only nesting in URL paths is for
    append-style sub-resources (skus/{id}/components, state-programs/{id}/reporting-periods,
    reports/{id}/lines). Producer is self-referential via parent_producer_id, which is what makes
    the GROUP_LEVEL exemption variant possible.
  state_machine_shape: cyclic
  state_machine_shape_note: |
    PackagingReport carries two independent state dimensions (submission_status x fee_status) and a
    correction cycle (UNDER_VERIFICATION -> CORRECTION_REQUIRED -> SUBMITTED). Registration cycles
    ACTIVE <-> SUSPENDED, Membership cycles ACTIVE <-> PROBATION, Producer cycles
    OBLIGATION_DETERMINED -> DRAFT on revenue restatement.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  role_model_note: |
    Peer ownership on top of segregation of duties: the ProgramRegulator that assigns a
    VerificationEngagement must not be the IndependentVerifier that performs it, and a producer's
    second-round verifier must differ from the verifier that issued the previous opinion on the
    same report.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Producer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the candidate obligated party.
      - name: parent_producer_id
        type: string
        source: input
        description: "FK -> Producer.id; null for a standalone producer. Non-null marks this row as an affiliate of the referenced parent; the affiliate set is the input set of the GROUP_LEVEL variant of exemption_determination."
        default: null
      - name: brand_owner_flag
        type: boolean
        source: input
        description: True when this party owns the brand under which the packaged product is sold.
      - name: importer_of_record_flag
        type: boolean
        source: input
        description: True when this party is the importer of record for packaged goods entering the state.
      - name: domestic_licensor_flag
        type: boolean
        source: input
        description: True when this party licenses the brand to a domestic packer without owning it.
      - name: annual_gross_revenue_usd
        type: integer
        source: input
        description: Whole-dollar global gross revenue for the trailing fiscal year; input to small-producer exemption analysis.
        constraints: ">= 0"
      - name: contact_email
        type: string
        source: input
        description: Compliance contact address.
      - name: status
        type: enum
        source: system
        description: Determination lifecycle of the producer record.
        default: DRAFT
        constraints: "one of {DRAFT, OBLIGATION_DETERMINED}"
      - name: obligated_party_role
        type: enum
        source: computed
        description: Output of producer_obligation_role; the single obligated-party classification for this row.
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, BRAND_OWNER, IMPORTER, DOMESTIC_LICENSOR, NOT_OBLIGATED}"
      - name: annual_packaging_weight_kg
        type: number
        source: computed
        description: Sum over Sku rows with status == ACTIVE of round_half_up(units_sold_annual_estimate * unit_packaging_weight_grams / 1000, 3); 3 decimal places.
        default: 0
      - name: determination_stale
        type: boolean
        source: computed
        description: True when packaging material data changed after the last determine-obligation run; blocks registration submission.
        default: false
      - name: assessed_fee_balance_cents
        type: integer
        source: computed
        description: Sum of Invoice.total_cents over invoices with status == ISSUED whose report's registration.producer_id equals this Producer.id.
        default: 0

  - name: Sku
    parent: null
    common_fields: true
    fields:
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the producer that reports this stock keeping unit."
      - name: gtin
        type: string
        source: input
        description: Global trade item number; unique per producer.
        constraints: "unique per (producer_id, gtin)"
      - name: name
        type: string
        source: input
        description: Consumer-facing item name.
      - name: product_category
        type: enum
        source: input
        description: Product category used by the category-exemption test.
        constraints: "one of {BEVERAGE, FOOD_DRY, HOUSEHOLD_CHEM, MEDICAL_DEVICE, PERSONAL_CARE}"
      - name: units_sold_annual_estimate
        type: integer
        source: input
        description: Annual unit estimate used only for producer-level tonnage rollup; report lines carry their own units_sold.
        constraints: ">= 0"
      - name: components
        type: array
        source: computed
        description: "Append-only list of packaging components maintained by POST /epr/skus/{id}/components and rewritten by POST /epr/skus/{id}/revise-packaging. Each element: { component_seq: integer, material_type: enum {PLASTIC, PAPER, GLASS, METAL}, unit_weight_grams: number(2dp), recyclability_class: enum {READILY_RECYCLABLE, LIMITED, NOT_RECYCLABLE}, pcr_content_pct: integer 0..100, is_reusable: boolean, status: enum {ACTIVE, SUPERSEDED} }."
        default: []
      - name: unit_packaging_weight_grams
        type: number
        source: computed
        description: Sum of unit_weight_grams over components with status == ACTIVE; 2 decimal places.
        default: 0
      - name: status
        type: enum
        source: system
        description: SKU data-collection lifecycle.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE}"
      - name: revision_count
        type: integer
        source: computed
        description: Number of successful revise-packaging calls applied to this SKU.
        default: 0

  - name: StateProgram
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter state code; unique across StateProgram rows.
        constraints: "unique; 2 uppercase letters"
      - name: obligation_basis
        type: enum
        source: input
        description: Selects the exemption_determination variant this state applies.
        constraints: "one of {ENTITY_LEVEL, GROUP_LEVEL}"
      - name: eco_mod_policy
        type: enum
        source: input
        description: BONUS_MALUS charges both eco-modulation surcharges and discounts; DISCOUNT_ONLY clamps every positive net percentage to zero.
        constraints: "one of {BONUS_MALUS, DISCOUNT_ONLY}"
      - name: fee_rounding_order
        type: enum
        source: input
        description: Pins the rounding order of report_fee_total for this state.
        constraints: "one of {PER_LINE_THEN_SUM, SUM_THEN_ROUND}"
      - name: small_producer_revenue_threshold_usd
        type: integer
        source: input
        description: Strict upper bound on assessed revenue for the small-producer exemption.
        constraints: "> 0"
      - name: small_producer_tonnage_threshold_kg
        type: number
        source: input
        description: Strict upper bound on assessed packaging weight for the small-producer exemption.
        constraints: "> 0"
      - name: exempt_product_categories
        type: array
        source: input
        description: Product categories excluded from fee assessment in this state; array of Sku.product_category enum members (may be empty).
        default: []
      - name: verification_required_threshold_kg
        type: number
        source: input
        description: A report whose total_weight_kg >= this value requires a third-party opinion before FINAL assessment.
        constraints: "> 0"
      - name: registration_deadline
        type: datetime
        source: input
        description: Last instant at which a Registration may be submitted in this state (ISO 8601 UTC, inclusive).

  - name: ReportingPeriod
    parent: null
    common_fields: true
    fields:
      - name: state_program_id
        type: string
        source: input
        description: "FK -> StateProgram.id; the program that owns this period."
      - name: period_label
        type: string
        source: input
        description: Human label such as CA-2026-H2; unique per state_program_id.
        constraints: "unique per (state_program_id, period_label)"
      - name: data_start
        type: string
        source: input
        description: Inclusive first date (YYYY-MM-DD) of the covered sales window.
      - name: data_end
        type: string
        source: input
        description: Exclusive last date (YYYY-MM-DD) of the covered sales window; windows are half-open [data_start, data_end).
      - name: submission_open
        type: datetime
        source: input
        description: First instant at which reports for this period may be submitted (inclusive).
      - name: submission_deadline
        type: datetime
        source: input
        description: Last instant at which reports for this period may be submitted (inclusive).
      - name: correction_window_days
        type: integer
        source: input
        description: Whole days added to the opinion instant to derive PackagingReport.correction_due_at.
        constraints: ">= 1"

  - name: Pro
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Producer responsibility organization name; unique.
        constraints: unique
      - name: contact_email
        type: string
        source: input
        description: PRO operations contact address.

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - name: pro_id
        type: string
        source: input
        description: "FK -> Pro.id; the PRO that publishes this schedule."
      - name: state_program_id
        type: string
        source: input
        description: "FK -> StateProgram.id; the state whose fees this schedule prices."
      - name: effective_from
        type: string
        source: input
        description: Inclusive first date (YYYY-MM-DD) on which this schedule prices reporting periods.
      - name: effective_to
        type: string
        source: input
        description: Inclusive last date (YYYY-MM-DD), or null for an open-ended schedule. Closed windows are [effective_from, effective_to] and MUST NOT touch another closed window of the same (pro_id, state_program_id).
        default: null
      - name: membership_fee_cents
        type: integer
        source: input
        description: Flat annual PRO membership fee before the tonnage surcharge.
        constraints: ">= 0"
      - name: admin_fee_bps_low
        type: integer
        source: input
        description: Administrative fee in basis points applied when Invoice.fee_subtotal_cents < ADMIN_TIER_BREAK_CENTS.
        constraints: "0..2000"
      - name: admin_fee_bps_high
        type: integer
        source: input
        description: Administrative fee in basis points applied when Invoice.fee_subtotal_cents >= ADMIN_TIER_BREAK_CENTS.
        constraints: "0..2000"
      - name: material_rates
        type: array
        source: input
        description: "Tiered per-material rate rows. Each element: { material_type: enum {PLASTIC, PAPER, GLASS, METAL}, tier_min_kg: number, tier_max_kg: number|null, rate_cents_per_kg: number }. Tiers of one material must start at 0 and be contiguous half-open [tier_min_kg, tier_max_kg) with exactly one open-ended top tier (tier_max_kg == null)."
      - name: status
        type: enum
        source: system
        description: Publication lifecycle of the schedule.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED}"

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the registering producer."
      - name: state_program_id
        type: string
        source: input
        description: "FK -> StateProgram.id; the state program registered into."
      - name: status
        type: enum
        source: system
        description: Registration lifecycle in this state.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACTIVE, SUSPENDED, REJECTED, WITHDRAWN}"
      - name: exemption_status
        type: enum
        source: computed
        description: Output of exemption_determination, recomputed on every registration submit.
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, OBLIGATED, EXEMPT_SMALL_PRODUCER, EXEMPT_CATEGORY}"
      - name: exemption_basis_applied
        type: enum
        source: computed
        description: Which variant of exemption_determination produced exemption_status; copied from StateProgram.obligation_basis at submit time.
        default: NONE
        constraints: "one of {NONE, ENTITY_LEVEL, GROUP_LEVEL}"
      - name: assessed_group_revenue_usd
        type: integer
        source: computed
        description: Revenue figure the exemption test actually compared, per exemption_basis_applied.
        default: 0
      - name: assessed_group_weight_kg
        type: number
        source: computed
        description: Packaging weight figure the exemption test actually compared, per exemption_basis_applied; 3 decimal places.
        default: 0
      - name: reported_weight_kg_ytd
        type: number
        source: computed
        description: Sum of PackagingReport.total_weight_kg over reports of this registration whose submission_status is in {SUBMITTED, UNDER_VERIFICATION, VERIFIED, FINALIZED}; 3 decimal places. This is the tier basis input of report_fee_assessment.
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: Output of registration_compliance_posture; gates Membership probation.
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, COMPLIANT, AT_RISK, DELINQUENT}"
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded on the most recent ACTIVE -> SUSPENDED transition; null when never suspended.
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the DRAFT -> SUBMITTED transition.
        default: null

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the state registration this membership covers."
      - name: pro_id
        type: string
        source: input
        description: "FK -> Pro.id; the PRO joined."
      - name: fee_schedule_id
        type: string
        source: input
        description: "FK -> FeeSchedule.id; the schedule the producer elects; pinned by version at approval."
      - name: status
        type: enum
        source: system
        description: Membership lifecycle.
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, PROBATION, REJECTED, TERMINATED}"
      - name: membership_fee_cents
        type: integer
        source: computed
        description: Output of membership_fee_assessment, computed at the PENDING -> ACTIVE transition; 0 while PENDING.
        default: 0
      - name: fee_payment_status
        type: enum
        source: computed
        description: OUTSTANDING until a matching payment is recorded.
        default: OUTSTANDING
        constraints: "one of {OUTSTANDING, PAID}"
      - name: fee_schedule_version_pinned
        type: integer
        source: computed
        description: FeeSchedule.version observed at the PENDING -> ACTIVE transition; report_fee_assessment always prices against fee_schedule_id regardless of later schedule mutations.
        default: null
      - name: decision_reason
        type: string
        source: system
        description: Reason text supplied with a REJECT decision, or the supersede reason on TERMINATED.
        default: null

  - name: PackagingReport
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the registration this report discharges."
      - name: reporting_period_id
        type: string
        source: input
        description: "FK -> ReportingPeriod.id; the period covered."
      - name: submission_status
        type: enum
        source: system
        description: Submission/verification dimension; evolves independently of fee_status.
        default: DRAFT
        constraints: "one of {DRAFT, BLOCKED, SUBMITTED, UNDER_VERIFICATION, VERIFIED, CORRECTION_REQUIRED, FINALIZED, REJECTED}"
      - name: fee_status
        type: enum
        source: system
        description: Fee dimension; evolves independently of submission_status.
        default: UNASSESSED
        constraints: "one of {UNASSESSED, PROVISIONAL, FINAL, INVOICED, VOIDED}"
      - name: total_weight_kg
        type: number
        source: computed
        description: Sum of ReportLine.line_weight_kg over all lines of this report, including fee-exempt lines; 3 decimal places. Recomputed at every submit and resubmit.
        default: 0
      - name: fee_basis_weight_kg
        type: number
        source: computed
        description: Sum of ReportLine.line_weight_kg over lines with fee_exempt == false; 3 decimal places.
        default: 0
      - name: tier_basis_kg
        type: number
        source: computed
        description: The tier-selection basis the last assessment used; PROVISIONAL uses registration.reported_weight_kg_ytd - total_weight_kg, FINAL uses registration.reported_weight_kg_ytd.
        default: 0
      - name: fee_subtotal_cents
        type: integer
        source: computed
        description: Output of report_fee_total for the variant recorded in fee_variant_applied.
        default: 0
      - name: fee_variant_applied
        type: enum
        source: computed
        description: Which report_fee_assessment variant produced fee_subtotal_cents.
        default: NONE
        constraints: "one of {NONE, PROVISIONAL, FINAL}"
      - name: verification_required
        type: boolean
        source: computed
        description: total_weight_kg >= StateProgram.verification_required_threshold_kg, evaluated at each submit/resubmit.
        default: false
      - name: correction_round
        type: integer
        source: computed
        description: Number of completed correction cycles; incremented on every resubmit.
        default: 0
      - name: correction_due_at
        type: datetime
        source: computed
        description: Logical-clock instant of the QUALIFIED/ADVERSE opinion plus ReportingPeriod.correction_window_days days; null when no correction is open.
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProducerComplianceOfficer that performed the most recent submit or resubmit; equals a Producer.id per the entity_backed identity in 1.7.
        default: null
      - name: line_count
        type: integer
        source: computed
        description: Number of ReportLine rows attached to this report.
        default: 0

  - name: ReportLine
    parent: null
    common_fields: true
    fields:
      - name: packaging_report_id
        type: string
        source: input
        description: "FK -> PackagingReport.id; the report this line belongs to."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the reported stock keeping unit; at most one line per (packaging_report_id, sku_id)."
      - name: units_sold
        type: integer
        source: input
        description: Units sold inside the period's data window for this SKU.
        constraints: ">= 0"
      - name: line_weight_kg
        type: number
        source: computed
        description: Sum over the SKU's ACTIVE components of round_half_up(units_sold * unit_weight_grams / 1000, 3); 3 decimal places. Computed when the line is created and recomputed at every submit and resubmit.
        default: 0
      - name: fee_exempt
        type: boolean
        source: computed
        description: True when the SKU's product_category is a member of the state program's exempt_product_categories.
        default: false
      - name: line_fee_exact_cents
        type: number
        source: computed
        description: Unrounded per-line fee carried at 4 decimal places; 0 when fee_exempt.
        default: 0
      - name: line_fee_cents
        type: integer
        source: computed
        description: round_half_up(line_fee_exact_cents, 0). Always stored for display; only the PER_LINE_THEN_SUM state programs sum this field into fee_subtotal_cents.
        default: 0
      - name: eco_mod_detail
        type: array
        source: computed
        description: "Per-material audit rows produced by the last assessment. Each element: { material_type, comp_weight_kg, rate_cents_per_kg, malus_pct, bonus_pct, net_pct, comp_fee_exact_cents }."
        default: []

  - name: VerificationEngagement
    parent: null
    common_fields: true
    fields:
      - name: packaging_report_id
        type: string
        source: input
        description: "FK -> PackagingReport.id; the report under third-party verification."
      - name: verifier_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the IndependentVerifier assigned; not a foreign key to any entity per the opaque identity in 1.7.
      - name: assigned_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ProgramRegulator that created the engagement.
      - name: fieldwork_start
        type: string
        source: input
        description: Inclusive first date (YYYY-MM-DD) of the verifier's fieldwork window.
      - name: fieldwork_end
        type: string
        source: input
        description: Inclusive last date (YYYY-MM-DD) of the verifier's fieldwork window; windows are closed [fieldwork_start, fieldwork_end].
      - name: status
        type: enum
        source: system
        description: Engagement lifecycle.
        default: ASSIGNED
        constraints: "one of {ASSIGNED, IN_PROGRESS, OPINION_ISSUED}"
      - name: opinion
        type: enum
        source: input
        description: Third-party opinion recorded at the IN_PROGRESS -> OPINION_ISSUED transition.
        default: null
        constraints: "one of {UNQUALIFIED, QUALIFIED, ADVERSE} or null"
      - name: findings_note
        type: string
        source: input
        description: Required narrative when opinion is QUALIFIED or ADVERSE.
        default: null
      - name: round_index
        type: integer
        source: computed
        description: PackagingReport.correction_round observed at engagement creation; used by the verifier-rotation rule.
        default: 0
      - name: opinion_issued_at
        type: datetime
        source: system
        description: Logical-clock instant of the opinion.
        default: null

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: packaging_report_id
        type: string
        source: input
        description: "FK -> PackagingReport.id; the FINAL-assessed report being billed."
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership whose pinned fee schedule supplies the administrative basis points."
      - name: fee_subtotal_cents
        type: integer
        source: computed
        description: Copy of PackagingReport.fee_subtotal_cents at issue time.
        default: 0
      - name: admin_fee_bps_applied
        type: integer
        source: computed
        description: Which of the schedule's two basis-point figures the tier selection picked.
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Output of invoice_administrative_fee.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: fee_subtotal_cents + admin_fee_cents.
        default: 0
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle.
        default: ISSUED
        constraints: "one of {ISSUED, VOID}"
      - name: void_reason
        type: string
        source: system
        description: Reason recorded on the ISSUED -> VOID transition.
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Producer
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: OBLIGATION_DETERMINED
        trigger: "POST /epr/producers/{id}/determine-obligation"
        actor: ProgramRegulator
        preconditions:
          - "producer.status == DRAFT"
          - "at least one Sku of this producer has status == ACTIVE, otherwise ERR_PRODUCER_HAS_NO_ACTIVE_SKUS"
        side_effects:
          - "runs calculations.producer_obligation_role; writes obligated_party_role"
          - "recomputes annual_packaging_weight_kg from all Sku rows with status == ACTIVE"
          - "sets determination_stale = false"
          - "increments Producer.version by 1 and refreshes updated_at"
      - from: OBLIGATION_DETERMINED
        to: DRAFT
        trigger: "POST /epr/producers/{id}/restate-revenue"
        actor: ProgramRegulator
        preconditions:
          - "producer.status == OBLIGATION_DETERMINED"
        side_effects:
          - "writes annual_gross_revenue_usd from the request body; resets obligated_party_role = UNDETERMINED and determination_stale = false"
          - "CASCADE hop 1: because the producer left OBLIGATION_DETERMINED, every Registration of this producer whose status is in {SUBMITTED, ACTIVE} moves to SUSPENDED with suspension_reason = 'PRODUCER_REDETERMINATION_REQUIRED' and exemption_status reset to UNDETERMINED"
          - "CASCADE hop 2: because those Registration rows moved to SUSPENDED, every PackagingReport of each suspended registration whose submission_status == DRAFT moves to BLOCKED"
          - "CASCADE hop 3: because those Registration rows moved to SUSPENDED, registration_compliance_posture is recomputed for each and yields DELINQUENT"
          - "increments version on the Producer and on every mutated Registration and PackagingReport"
        note: "Restating revenue is the deliberate revert edge that makes the Producer machine cyclic (DRAFT -> OBLIGATION_DETERMINED -> DRAFT)."
      - from: OBLIGATION_DETERMINED
        to: OBLIGATION_DETERMINED
        trigger: "POST /epr/skus/{id}/activate or POST /epr/skus/{id}/revise-packaging on a Sku of this producer"
        actor: ProducerComplianceOfficer
        preconditions: []
        side_effects:
          - "recomputes annual_packaging_weight_kg"
          - "sets determination_stale = true, which blocks POST /epr/registrations/{id}/submit until determine-obligation runs again"
          - "increments Producer.version by 1"
        note: "Material-data drift does not revert the status; it only marks the determination stale."

  - entity: Sku
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /epr/skus/{id}/activate"
        actor: ProducerComplianceOfficer
        preconditions:
          - "sku.status == DRAFT"
          - "count of components with status == ACTIVE >= 1, otherwise ERR_SKU_HAS_NO_COMPONENTS"
          - "X-User-ID == sku.producer_id"
        side_effects:
          - "recomputes unit_packaging_weight_grams as the sum of ACTIVE component unit_weight_grams"
          - "recomputes Producer.annual_packaging_weight_kg; sets Producer.determination_stale = true when Producer.status == OBLIGATION_DETERMINED"
          - "increments Sku.version and Producer.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /epr/skus/{id}/revise-packaging"
        actor: ProducerComplianceOfficer
        preconditions:
          - "sku.status == ACTIVE"
          - "X-User-ID == sku.producer_id"
          - "the request body supplies at least one replacement component"
        side_effects:
          - "CASCADE hop 1: every element of components with status == ACTIVE moves to SUPERSEDED and the replacement components are appended with status == ACTIVE and continuing component_seq values"
          - "CASCADE hop 2: because the ACTIVE component set changed, unit_packaging_weight_grams is recomputed and revision_count is incremented"
          - "CASCADE hop 3: because Sku.unit_packaging_weight_grams changed, Producer.annual_packaging_weight_kg is recomputed"
          - "CASCADE hop 4: because Producer.annual_packaging_weight_kg changed, Producer.determination_stale is set to true when Producer.status == OBLIGATION_DETERMINED"
          - "increments Sku.version and Producer.version by 1"
        note: "Already-submitted ReportLine weights are NOT retroactively changed; line_weight_kg is recomputed only at submit/resubmit of the owning report."

  - entity: FeeSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /epr/fee-schedules/{id}/publish"
        actor: ProAdministrator
        preconditions:
          - "fee_schedule.status == DRAFT"
          - "X-User-ID == fee_schedule.pro_id"
          - "material_rates is non-empty, otherwise ERR_FEE_SCHEDULE_HAS_NO_RATES"
          - "expected_pro_version == Pro.version, otherwise ERR_STALE_PRO_VERSION"
        side_effects:
          - "status -> PUBLISHED"
          - "if another FeeSchedule of the same (pro_id, state_program_id) has status == PUBLISHED and effective_to == null, that row's effective_to is set to this row's effective_from minus one day and its status moves to SUPERSEDED"
          - "increments Pro.version by 1 (the OCC anchor) and FeeSchedule.version by 1 on both rows touched"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: truncation by a later publish of the same (pro_id, state_program_id)"
        actor: system
        preconditions:
          - "the superseded row has effective_to == null"
        side_effects:
          - "effective_to = newer.effective_from minus one day; increments version by 1"
          - "Membership rows that pinned this schedule keep pricing against it (fee_schedule_version_pinned is not updated), but report_fee_assessment then fails ERR_FEE_SCHEDULE_NOT_EFFECTIVE_FOR_PERIOD when the truncated window no longer covers the period"

  - entity: Registration
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /epr/registrations/{id}/submit"
        actor: ProducerComplianceOfficer
        preconditions:
          - "registration.status == DRAFT"
          - "X-User-ID == registration.producer_id"
          - "producer.status == OBLIGATION_DETERMINED, otherwise ERR_OBLIGATION_NOT_DETERMINED"
          - "producer.determination_stale == false, otherwise ERR_DETERMINATION_STALE"
          - "clock <= state_program.registration_deadline, otherwise ERR_REGISTRATION_DEADLINE_PASSED"
        side_effects:
          - "runs calculations.exemption_determination with the variant named by state_program.obligation_basis; writes exemption_status, exemption_basis_applied, assessed_group_revenue_usd, assessed_group_weight_kg"
          - "sets submitted_at = clock; increments version by 1"
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /epr/registrations/{id}/decide with decision == ACCEPT"
        actor: ProgramRegulator
        preconditions:
          - "registration.status == SUBMITTED"
        side_effects:
          - "runs calculations.registration_compliance_posture; writes compliance_posture, which yields COMPLIANT for a freshly accepted registration that has no report in {DRAFT, BLOCKED} past its submission_deadline and no report in CORRECTION_REQUIRED"
          - "increments version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /epr/registrations/{id}/decide with decision == REJECT"
        actor: ProgramRegulator
        preconditions:
          - "registration.status == SUBMITTED"
          - "the request body supplies reason"
        side_effects:
          - "compliance_posture -> UNDETERMINED; every Membership of this registration whose status is in {PENDING, ACTIVE, PROBATION} moves to TERMINATED with decision_reason = 'REGISTRATION_REJECTED'"
          - "increments version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /epr/registrations/{id}/suspend, or the cascade from POST /epr/producers/{id}/restate-revenue"
        actor: ProgramRegulator
        preconditions:
          - "registration.status == ACTIVE"
        side_effects:
          - "writes suspension_reason; every PackagingReport of this registration whose submission_status == DRAFT moves to BLOCKED"
          - "recomputes compliance_posture, which yields DELINQUENT while the registration is SUSPENDED"
          - "increments version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /epr/registrations/{id}/reinstate"
        actor: ProgramRegulator
        preconditions:
          - "registration.status == SUSPENDED"
          - "producer.status == OBLIGATION_DETERMINED and producer.determination_stale == false, otherwise ERR_DETERMINATION_STALE"
        side_effects:
          - "clears suspension_reason; every PackagingReport of this registration whose submission_status == BLOCKED moves back to DRAFT"
          - "recomputes compliance_posture; when it returns COMPLIANT, every Membership of this registration with status == PROBATION moves back to ACTIVE"
          - "increments version by 1"
        note: "ACTIVE <-> SUSPENDED is the Registration cycle."
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /epr/registrations/{id}/withdraw"
        actor: ProducerComplianceOfficer
        preconditions:
          - "registration.status == ACTIVE"
          - "X-User-ID == registration.producer_id"
          - "no PackagingReport of this registration has submission_status in {SUBMITTED, UNDER_VERIFICATION, CORRECTION_REQUIRED}, otherwise ERR_REGISTRATION_HAS_OPEN_REPORTS"
        side_effects:
          - "every Membership of this registration whose status is in {PENDING, ACTIVE, PROBATION} moves to TERMINATED with decision_reason = 'REGISTRATION_WITHDRAWN'"
          - "compliance_posture -> UNDETERMINED; increments version by 1"

  - entity: Membership
    initial_state: PENDING
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /epr/memberships/{id}/decide with decision == APPROVE"
        actor: ProAdministrator
        preconditions:
          - "membership.status == PENDING"
          - "X-User-ID == membership.pro_id"
          - "fee_schedule.status == PUBLISHED, otherwise ERR_FEE_SCHEDULE_NOT_PUBLISHED"
          - "registration.status in {SUBMITTED, ACTIVE}, otherwise ERR_INVALID_STATE"
        side_effects:
          - "runs calculations.membership_fee_assessment; writes membership_fee_cents and sets fee_payment_status = OUTSTANDING"
          - "pins fee_schedule_version_pinned = fee_schedule.version"
          - "recomputes Registration.compliance_posture; increments Membership.version and Registration.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /epr/memberships/{id}/decide with decision == REJECT"
        actor: ProAdministrator
        preconditions:
          - "membership.status == PENDING"
          - "X-User-ID == membership.pro_id"
          - "the request body supplies reason"
        side_effects:
          - "writes decision_reason; recomputes Registration.compliance_posture; increments Membership.version and Registration.version by 1"
      - from: ACTIVE
        to: PROBATION
        trigger: "system: Registration.compliance_posture recomputed to AT_RISK"
        actor: system
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "increments version by 1; POST /epr/reports/{id}/submit is then rejected with ERR_MEMBERSHIP_NOT_ACTIVE while POST /epr/reports/{id}/resubmit remains allowed"
      - from: PROBATION
        to: ACTIVE
        trigger: "system: Registration.compliance_posture recomputed to COMPLIANT"
        actor: system
        preconditions:
          - "membership.status == PROBATION"
        side_effects:
          - "increments version by 1"
        note: "ACTIVE <-> PROBATION is the Membership cycle."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /epr/memberships (supersede), POST /epr/registrations/{id}/withdraw, or POST /epr/registrations/{id}/decide with decision == REJECT"
        actor: ProducerComplianceOfficer
        preconditions:
          - "membership.status in {PENDING, ACTIVE, PROBATION}"
        side_effects:
          - "writes decision_reason; recomputes Registration.compliance_posture; increments version by 1"
      - from: PROBATION
        to: TERMINATED
        trigger: "POST /epr/memberships (supersede), POST /epr/registrations/{id}/withdraw"
        actor: ProducerComplianceOfficer
        preconditions:
          - "membership.status == PROBATION"
        side_effects:
          - "writes decision_reason; recomputes Registration.compliance_posture; increments version by 1"

  - entity: PackagingReport
    dimension: submission_status
    initial_state: DRAFT
    terminal_states: [FINALIZED, REJECTED]
    note: "PackagingReport carries two independent state dimensions. This entry is the submission_status dimension; the fee_status dimension is the PackagingReport_fee_status machine below. A single request may advance one dimension without touching the other (POST /epr/reports/{id}/assess moves only fee_status; POST /epr/reports/{id}/submit moves only submission_status)."
    transitions:
      - from: DRAFT
        to: BLOCKED
        trigger: "system: the owning Registration moved ACTIVE -> SUSPENDED"
        actor: system
        preconditions:
          - "report.submission_status == DRAFT"
        side_effects:
          - "increments version by 1; POST /epr/reports/{id}/lines is then rejected with ERR_REPORT_NOT_IN_DRAFT"
      - from: BLOCKED
        to: DRAFT
        trigger: "system: the owning Registration moved SUSPENDED -> ACTIVE"
        actor: system
        preconditions:
          - "report.submission_status == BLOCKED"
        side_effects:
          - "increments version by 1"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /epr/reports/{id}/submit"
        actor: ProducerComplianceOfficer
        preconditions:
          - "report.submission_status == DRAFT"
          - "X-User-ID == registration.producer_id"
          - "registration.status == ACTIVE, otherwise ERR_REGISTRATION_NOT_ACTIVE"
          - "registration.exemption_status == OBLIGATED, otherwise ERR_EXEMPT_REGISTRATION_CANNOT_REPORT"
          - "line_count >= 1, otherwise ERR_REPORT_HAS_NO_LINES"
          - "period.submission_open <= clock <= period.submission_deadline, otherwise ERR_SUBMISSION_WINDOW_NOT_OPEN / ERR_SUBMISSION_WINDOW_CLOSED"
          - "a Membership of this registration with status == ACTIVE exists, otherwise ERR_NO_ACTIVE_MEMBERSHIP or ERR_MEMBERSHIP_NOT_ACTIVE"
          - "that membership has fee_payment_status == PAID, otherwise ERR_MEMBERSHIP_FEE_OUTSTANDING"
        side_effects:
          - "recomputes ReportLine.line_weight_kg for every line, then total_weight_kg, fee_basis_weight_kg, line_count and verification_required"
          - "sets submitted_by_user_id = X-User-ID and submitted_at = clock"
          - "LEDGER SYNC: Registration.reported_weight_kg_ytd is recomputed and therefore increases by total_weight_kg"
          - "recomputes Registration.compliance_posture"
          - "increments PackagingReport.version, every ReportLine.version and Registration.version by 1"
      - from: SUBMITTED
        to: UNDER_VERIFICATION
        trigger: "POST /epr/verification-engagements"
        actor: ProgramRegulator
        preconditions:
          - "report.submission_status == SUBMITTED"
        side_effects:
          - "increments version by 1"
      - from: UNDER_VERIFICATION
        to: VERIFIED
        trigger: "POST /epr/verification-engagements/{id}/issue-opinion with opinion == UNQUALIFIED"
        actor: IndependentVerifier
        preconditions:
          - "engagement.status == IN_PROGRESS and engagement.packaging_report_id == report.id"
        side_effects:
          - "increments version by 1; the report becomes eligible for FINAL assessment"
      - from: UNDER_VERIFICATION
        to: CORRECTION_REQUIRED
        trigger: "POST /epr/verification-engagements/{id}/issue-opinion with opinion in {QUALIFIED, ADVERSE}"
        actor: IndependentVerifier
        preconditions:
          - "engagement.status == IN_PROGRESS and engagement.packaging_report_id == report.id"
        side_effects:
          - "CASCADE hop 1 (this transition): correction_due_at = clock + period.correction_window_days days"
          - "CASCADE hop 2: because the report left the counted set {SUBMITTED, UNDER_VERIFICATION, VERIFIED, FINALIZED}, Registration.reported_weight_kg_ytd is recomputed and therefore decreases by total_weight_kg"
          - "CASCADE hop 3: because the report is no longer a valid fee basis, fee_status moves to VOIDED when it is in {PROVISIONAL, FINAL, INVOICED}; if an Invoice of this report has status == ISSUED it moves to VOID with void_reason = 'REPORT_CORRECTION_REQUIRED'"
          - "CASCADE hop 4: because that Invoice moved to VOID, Producer.assessed_fee_balance_cents is recomputed and therefore decreases by that invoice's total_cents"
          - "CASCADE hop 5: because a report of this registration is now CORRECTION_REQUIRED, registration_compliance_posture is recomputed and yields AT_RISK"
          - "CASCADE hop 6: because the posture became AT_RISK, the registration's Membership with status == ACTIVE moves to PROBATION"
          - "increments version on the report, the registration, the producer, the invoice and the membership"
      - from: CORRECTION_REQUIRED
        to: SUBMITTED
        trigger: "POST /epr/reports/{id}/resubmit"
        actor: ProducerComplianceOfficer
        preconditions:
          - "report.submission_status == CORRECTION_REQUIRED"
          - "X-User-ID == registration.producer_id"
          - "clock <= report.correction_due_at, otherwise ERR_CORRECTION_WINDOW_EXPIRED"
          - "registration.status == ACTIVE, otherwise ERR_REGISTRATION_NOT_ACTIVE"
          - "a Membership of this registration with status in {ACTIVE, PROBATION} exists with fee_payment_status == PAID"
          - "line_count >= 1, otherwise ERR_REPORT_HAS_NO_LINES"
        side_effects:
          - "increments correction_round by 1; clears correction_due_at"
          - "recomputes every ReportLine.line_weight_kg, then total_weight_kg, fee_basis_weight_kg and verification_required"
          - "fee_status moves VOIDED -> UNASSESSED (or stays UNASSESSED)"
          - "LEDGER SYNC: Registration.reported_weight_kg_ytd is recomputed and therefore increases by the new total_weight_kg"
          - "recomputes Registration.compliance_posture; when it returns COMPLIANT the registration's PROBATION membership moves back to ACTIVE"
          - "sets submitted_by_user_id = X-User-ID; increments version on the report, its lines, the registration and the membership"
        note: "CORRECTION_REQUIRED -> SUBMITTED is the report correction cycle; a second verification round is possible and is what the verifier-rotation rule guards."
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /epr/reports/{id}/close with decision == FINALIZE"
        actor: ProgramRegulator
        preconditions:
          - "report.submission_status == SUBMITTED"
          - "report.verification_required == false, otherwise ERR_VERIFICATION_REQUIRED"
          - "report.fee_status == INVOICED, otherwise ERR_INVOICE_NOT_ISSUED"
        side_effects:
          - "recomputes Registration.compliance_posture; increments version by 1"
      - from: VERIFIED
        to: FINALIZED
        trigger: "POST /epr/reports/{id}/close with decision == FINALIZE"
        actor: ProgramRegulator
        preconditions:
          - "report.submission_status == VERIFIED"
          - "report.fee_status == INVOICED, otherwise ERR_INVOICE_NOT_ISSUED"
        side_effects:
          - "recomputes Registration.compliance_posture; increments version by 1"
      - from: CORRECTION_REQUIRED
        to: REJECTED
        trigger: "POST /epr/reports/{id}/close with decision == REJECT"
        actor: ProgramRegulator
        preconditions:
          - "report.submission_status == CORRECTION_REQUIRED"
          - "clock > report.correction_due_at, otherwise ERR_CORRECTION_WINDOW_OPEN"
        side_effects:
          - "clears correction_due_at; recomputes Registration.compliance_posture, which yields COMPLIANT once no CORRECTION_REQUIRED report remains and no report is overdue, so the registration's PROBATION membership moves back to ACTIVE"
          - "increments version by 1"

  - entity: PackagingReport_fee_status
    dimension: fee_status
    initial_state: UNASSESSED
    terminal_states: []
    note: "Second, independent dimension of the same PackagingReport row."
    transitions:
      - from: UNASSESSED
        to: PROVISIONAL
        trigger: "POST /epr/reports/{id}/assess with variant == PROVISIONAL"
        actor: ProAdministrator
        preconditions:
          - "report.fee_status == UNASSESSED"
          - "report.submission_status in {SUBMITTED, UNDER_VERIFICATION}, otherwise ERR_INVALID_STATE"
          - "X-User-ID == the pro_id of the registration's membership with status in {ACTIVE, PROBATION}, otherwise ERR_NOT_RESOURCE_OWNER"
          - "the membership's pinned fee schedule covers the period, otherwise ERR_FEE_SCHEDULE_NOT_EFFECTIVE_FOR_PERIOD"
        side_effects:
          - "runs calculations.report_fee_assessment variant PROVISIONAL and calculations.report_fee_total; writes tier_basis_kg, fee_subtotal_cents, fee_variant_applied = PROVISIONAL and every ReportLine fee field"
          - "increments version on the report and on every line; submission_status is untouched"
      - from: UNASSESSED
        to: FINAL
        trigger: "POST /epr/reports/{id}/assess with variant == FINAL"
        actor: ProAdministrator
        preconditions:
          - "report.fee_status == UNASSESSED"
          - "report.submission_status == VERIFIED, or submission_status == SUBMITTED with verification_required == false, otherwise ERR_VERIFICATION_REQUIRED"
          - "X-User-ID == the pro_id of the registration's membership with status in {ACTIVE, PROBATION}"
        side_effects:
          - "runs calculations.report_fee_assessment variant FINAL and calculations.report_fee_total; writes tier_basis_kg, fee_subtotal_cents, fee_variant_applied = FINAL and every ReportLine fee field"
          - "increments version on the report and on every line"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /epr/reports/{id}/assess with variant == FINAL"
        actor: ProAdministrator
        preconditions:
          - "report.fee_status == PROVISIONAL"
          - "report.submission_status == VERIFIED, or submission_status == SUBMITTED with verification_required == false, otherwise ERR_VERIFICATION_REQUIRED"
        side_effects:
          - "re-runs the fee calculation under the FINAL variant, overwriting tier_basis_kg, fee_subtotal_cents and every line fee field"
          - "increments version on the report and on every line"
      - from: FINAL
        to: INVOICED
        trigger: "POST /epr/invoices"
        actor: ProAdministrator
        preconditions:
          - "report.fee_status == FINAL"
        side_effects:
          - "LEDGER SYNC: Producer.assessed_fee_balance_cents is recomputed and therefore increases by the new Invoice.total_cents"
          - "increments version on the report and the producer"
      - from: INVOICED
        to: FINAL
        trigger: "POST /epr/invoices/{id}/void"
        actor: ProAdministrator
        preconditions:
          - "invoice.status == ISSUED and invoice.packaging_report_id == report.id"
        side_effects:
          - "COMPENSATION: Producer.assessed_fee_balance_cents is recomputed and therefore decreases by that invoice's total_cents, restoring the pre-issue value exactly"
          - "report.fee_subtotal_cents and every line fee field are left untouched; increments version on the report and the producer"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "system: the report moved UNDER_VERIFICATION -> CORRECTION_REQUIRED"
        actor: system
        preconditions:
          - "report.fee_status == PROVISIONAL"
        side_effects:
          - "increments version by 1"
      - from: FINAL
        to: VOIDED
        trigger: "system: the report moved UNDER_VERIFICATION -> CORRECTION_REQUIRED"
        actor: system
        preconditions:
          - "report.fee_status == FINAL"
        side_effects:
          - "increments version by 1"
      - from: INVOICED
        to: VOIDED
        trigger: "system: the report moved UNDER_VERIFICATION -> CORRECTION_REQUIRED"
        actor: system
        preconditions:
          - "report.fee_status == INVOICED"
        side_effects:
          - "the report's ISSUED Invoice moves to VOID and Producer.assessed_fee_balance_cents is recomputed downward by its total_cents"
          - "increments version by 1"
      - from: VOIDED
        to: UNASSESSED
        trigger: "POST /epr/reports/{id}/resubmit"
        actor: ProducerComplianceOfficer
        preconditions:
          - "report.fee_status == VOIDED"
        side_effects:
          - "clears fee_subtotal_cents, tier_basis_kg and fee_variant_applied back to their defaults; increments version by 1"

  - entity: VerificationEngagement
    initial_state: ASSIGNED
    terminal_states: [OPINION_ISSUED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /epr/verification-engagements/{id}/start"
        actor: IndependentVerifier
        preconditions:
          - "engagement.status == ASSIGNED"
          - "X-User-ID == engagement.verifier_user_id, otherwise ERR_NOT_ASSIGNED_VERIFIER"
          - "report.submission_status == UNDER_VERIFICATION, otherwise ERR_REPORT_NOT_UNDER_VERIFICATION"
        side_effects:
          - "increments version by 1"
      - from: IN_PROGRESS
        to: OPINION_ISSUED
        trigger: "POST /epr/verification-engagements/{id}/issue-opinion"
        actor: IndependentVerifier
        preconditions:
          - "engagement.status == IN_PROGRESS"
          - "X-User-ID == engagement.verifier_user_id, otherwise ERR_NOT_ASSIGNED_VERIFIER"
          - "opinion in {UNQUALIFIED, QUALIFIED, ADVERSE}; findings_note required when opinion in {QUALIFIED, ADVERSE}, otherwise ERR_FINDINGS_NOTE_REQUIRED"
        side_effects:
          - "writes opinion and opinion_issued_at = clock"
          - "BRANCH UNQUALIFIED: the report moves UNDER_VERIFICATION -> VERIFIED and nothing else changes"
          - "BRANCH QUALIFIED or ADVERSE: the report moves UNDER_VERIFICATION -> CORRECTION_REQUIRED and the six-hop cascade documented on that transition runs"
          - "increments version by 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [VOID]
    transitions:
      - from: ISSUED
        to: VOID
        trigger: "POST /epr/invoices/{id}/void, or the cascade from a QUALIFIED/ADVERSE opinion"
        actor: ProAdministrator
        preconditions:
          - "invoice.status == ISSUED"
          - "X-User-ID == the pro_id of invoice.membership_id, otherwise ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "writes void_reason; Producer.assessed_fee_balance_cents is recomputed downward by total_cents"
          - "report.fee_status moves INVOICED -> FINAL on an operator void, or INVOICED -> VOIDED when the void is part of the correction cascade"
          - "increments version on the invoice, the report and the producer"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: fee-schedule-publish-stale-pro
    parent_entity: Pro
    write_endpoint: "POST /epr/fee-schedules/{id}/publish"
    occ_field: "expected_pro_version"
    description: |
      Publishing a FeeSchedule against a Pro whose version has advanced since the client last
      observed it is rejected. Publication legitimately truncates the PRO's prior open-ended
      PUBLISHED schedule for the same state program, so a publish issued from a stale view of the
      Pro would silently supersede a schedule the client never saw.
    error_id: ERR_STALE_PRO_VERSION
    http_status: 412
  - rule_id: membership-create-stale-registration
    parent_entity: Registration
    write_endpoint: "POST /epr/memberships"
    occ_field: "expected_registration_version"
    description: |
      Creating a Membership against a Registration whose version has advanced since the client last
      observed it is rejected. A new membership legitimately terminates the registration's prior
      ACTIVE or PROBATION membership (a producer may switch PRO mid-year), so a create issued from a
      stale view of the registration would supersede coverage the client never observed.
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: producer_obligation_role
    trigger: "POST /epr/producers/{id}/determine-obligation (Producer DRAFT -> OBLIGATION_DETERMINED)"
    algorithm: threshold
    formula: |
      # Single classification, evaluated as an ordered ladder. The first matching clause wins;
      # later clauses are never evaluated even when their flag is also true.
      if producer.brand_owner_flag == true:            obligated_party_role = BRAND_OWNER
      elif producer.importer_of_record_flag == true:   obligated_party_role = IMPORTER
      elif producer.domestic_licensor_flag == true:    obligated_party_role = DOMESTIC_LICENSOR
      else:                                            obligated_party_role = NOT_OBLIGATED
    input_set: "The Producer row alone; affiliates are NOT consulted here (they enter only through exemption_determination)."
    constants: {}
    precision: "enum output; no numeric rounding"
    variants: []

  - name: producer_annual_packaging_weight
    trigger: "POST /epr/producers/{id}/determine-obligation, POST /epr/skus/{id}/activate, POST /epr/skus/{id}/revise-packaging"
    algorithm: aggregation
    formula: |
      annual_packaging_weight_kg = round_half_up(
        SUM over s in Sku where s.producer_id == producer.id and s.status == ACTIVE of
          round_half_up(s.units_sold_annual_estimate * s.unit_packaging_weight_grams / 1000, 3)
      , 3)
      # Per-SKU rounding to 3 decimals happens FIRST, then the sum; the sum is re-rounded for safety.
      where s.unit_packaging_weight_grams = round_half_up(
              SUM over c in s.components where c.status == ACTIVE of c.unit_weight_grams, 2)
    input_set: "Sku rows of this producer with status == ACTIVE only; DRAFT SKUs and SUPERSEDED components are excluded. Order of summation is Sku.created_at ASC (immaterial to the result, pinned for reproducibility)."
    constants: {}
    precision: "kilograms at 3 decimal places, round_half_up; grams at 2 decimal places, round_half_up"
    variants: []

  - name: exemption_determination
    trigger: "POST /epr/registrations/{id}/submit (Registration DRAFT -> SUBMITTED)"
    algorithm: threshold
    formula: |
      sp = StateProgram of registration.state_program_id
      p  = Producer of registration.producer_id
      # (1) Category exemption is tested FIRST and short-circuits the revenue/tonnage test.
      active_skus = [s in Sku where s.producer_id == p.id and s.status == ACTIVE]
      if len(active_skus) > 0 and every s in active_skus has s.product_category IN sp.exempt_product_categories:
          exemption_status = EXEMPT_CATEGORY
          assessed_group_revenue_usd = 0 ; assessed_group_weight_kg = 0
          exemption_basis_applied = sp.obligation_basis
          return
      # (2) Small-producer test on the assessed figures produced by the selected variant.
      (assessed_revenue, assessed_weight) = variant_figures(sp.obligation_basis, p)
      if assessed_revenue < sp.small_producer_revenue_threshold_usd
         and assessed_weight < sp.small_producer_tonnage_threshold_kg:
          exemption_status = EXEMPT_SMALL_PRODUCER
      else:
          exemption_status = OBLIGATED
      assessed_group_revenue_usd = assessed_revenue
      assessed_group_weight_kg   = assessed_weight
      exemption_basis_applied    = sp.obligation_basis
      # Both comparisons are STRICT `<`: a figure exactly equal to a threshold is NOT exempt.
    input_set: "Producer rows in the affiliate set defined by the variant; Sku rows with status == ACTIVE for the category test."
    constants: {}
    precision: "revenue in whole USD; weight in kilograms at 3 decimal places, round_half_up"
    variants:
      - name: ENTITY_LEVEL
        when: "StateProgram.obligation_basis == ENTITY_LEVEL"
        difference: "assessed_revenue = p.annual_gross_revenue_usd and assessed_weight = p.annual_packaging_weight_kg. Affiliates are ignored entirely, even when p.parent_producer_id is non-null."
      - name: GROUP_LEVEL
        when: "StateProgram.obligation_basis == GROUP_LEVEL"
        difference: "The affiliate set is {p} UNION {q in Producer where q.parent_producer_id == p.id} UNION {r in Producer where p.parent_producer_id is not null and (r.id == p.parent_producer_id or r.parent_producer_id == p.parent_producer_id)}; i.e. the whole one-level group that p belongs to. assessed_revenue = SUM of annual_gross_revenue_usd over the set, assessed_weight = round_half_up(SUM of annual_packaging_weight_kg over the set, 3). Membership of the set does not depend on the affiliates' own registration status. The same producer can therefore be EXEMPT_SMALL_PRODUCER in an ENTITY_LEVEL state and OBLIGATED in a GROUP_LEVEL state on identical data."

  - name: eco_modulation_adjustment
    trigger: "POST /epr/reports/{id}/assess (both variants), evaluated once per ACTIVE component of every non-exempt ReportLine"
    algorithm: weighted_scoring
    formula: |
      malus_pct = { READILY_RECYCLABLE: 0, LIMITED: 20, NOT_RECYCLABLE: 60 }[c.recyclability_class]
      pcr_bonus_pct = min(PCR_BONUS_CAP_PCT, floor(c.pcr_content_pct / 10) * PCR_BONUS_STEP_PCT)
      reuse_bonus_pct = REUSE_BONUS_PCT if c.is_reusable == true else 0
      bonus_pct = pcr_bonus_pct + reuse_bonus_pct
      net_pct = malus_pct - bonus_pct
      net_pct = max(MAX_NET_BONUS_PCT, min(MAX_NET_MALUS_PCT, net_pct))   # clamp to [-30, +60]
      if sp.eco_mod_policy == DISCOUNT_ONLY: net_pct = min(net_pct, 0)    # surcharges waived
      comp_fee_exact_cents = comp_weight_kg * rate_cents_per_kg * (1 + net_pct / 100)
      # Evaluation order is pinned: floor-then-cap the PCR bonus, add the reuse bonus, subtract from
      # the malus, clamp the net, apply the state policy, and only then multiply the money base.
      # Capping before adding the reuse bonus is what allows a net bonus of exactly -40 to be
      # clamped up to -30 while a 100% PCR reusable component never exceeds the floor.
    input_set: "Every component c of the line's Sku with status == ACTIVE. Fee-exempt lines skip this calculation entirely and record line_fee_exact_cents = 0 with eco_mod_detail = []."
    constants:
      PCR_BONUS_STEP_PCT: 5
      PCR_BONUS_CAP_PCT: 25
      REUSE_BONUS_PCT: 15
      MAX_NET_BONUS_PCT: -30
      MAX_NET_MALUS_PCT: 60
      MALUS_READILY_RECYCLABLE_PCT: 0
      MALUS_LIMITED_PCT: 20
      MALUS_NOT_RECYCLABLE_PCT: 60
    precision: "percentages are whole integers; comp_fee_exact_cents is carried at 4 decimal places with no intermediate rounding"
    variants: []

  - name: report_fee_assessment
    trigger: "POST /epr/reports/{id}/assess; the variant is named by the request body's variant field"
    algorithm: tiered_pricing
    formula: |
      reg = Registration of report.registration_id
      sp  = StateProgram of reg.state_program_id
      mem = the Membership of reg with status IN {ACTIVE, PROBATION}
            (eligibility filter: membership.registration_id == reg.id AND status IN {ACTIVE, PROBATION};
             at most one such row exists because POST /epr/memberships terminates the prior one;
             tie-break if the invariant is ever violated: created_at DESC, then version DESC;
             empty candidate set -> ERR_NO_ACTIVE_MEMBERSHIP)
      fs  = FeeSchedule of mem.fee_schedule_id      # version-pinned at approval; status is NOT re-checked
      tier_basis_kg = variant_tier_basis(variant, reg, report)
      for each line L of report (ordered by ReportLine.created_at ASC):
        if L.fee_exempt: L.line_fee_exact_cents = 0 ; L.line_fee_cents = 0 ; continue
        line_exact = 0
        for each ACTIVE component c of L's Sku (ordered by component_seq ASC):
          comp_weight_kg = round_half_up(L.units_sold * c.unit_weight_grams / 1000, 3)
          row = the single element of fs.material_rates with row.material_type == c.material_type
                and row.tier_min_kg <= tier_basis_kg and (row.tier_max_kg is null or tier_basis_kg < row.tier_max_kg)
                # half-open tiers: a basis exactly equal to tier_min_kg selects THAT tier
                # no such material_type in fs.material_rates -> ERR_MATERIAL_RATE_MISSING
          line_exact += eco_modulation_adjustment(c, comp_weight_kg, row.rate_cents_per_kg, sp)
        L.line_fee_exact_cents = round_half_up(line_exact, 4)
        L.line_fee_cents = round_half_up(L.line_fee_exact_cents, 0)
      report.tier_basis_kg = tier_basis_kg
      report.fee_subtotal_cents = report_fee_total(report, sp)
      report.fee_variant_applied = variant
      # ONE rate per material for the whole report: the tier is selected once from tier_basis_kg and
      # applied to every kilogram (average-rate pricing), NOT marginally per tier band.
    input_set: "All ReportLine rows of the report, including fee-exempt ones (they contribute weight but zero fee). The rate rows come from the membership's pinned FeeSchedule, never from the currently effective one."
    constants: {}
    precision: "money at 4 decimal places internally, whole cents on ReportLine.line_fee_cents and PackagingReport.fee_subtotal_cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "request body variant == PROVISIONAL; allowed while submission_status IN {SUBMITTED, UNDER_VERIFICATION}"
        difference: "tier_basis_kg = round_half_up(reg.reported_weight_kg_ytd - report.total_weight_kg, 3) — the year-to-date tonnage EXCLUDING the report being priced, i.e. the tonnage the producer had already reported when this report arrived."
      - name: FINAL
        when: "request body variant == FINAL; allowed once submission_status == VERIFIED, or SUBMITTED with verification_required == false"
        difference: "tier_basis_kg = reg.reported_weight_kg_ytd — the year-to-date tonnage INCLUDING the report being priced. Identical line data therefore selects a different rate tier and produces a different fee_subtotal_cents than PROVISIONAL whenever the report's own weight crosses a tier_min_kg."

  - name: report_fee_total
    trigger: "invoked by report_fee_assessment after every line's line_fee_exact_cents is known"
    algorithm: aggregation
    formula: |
      exact_values = [L.line_fee_exact_cents for L in report lines ordered by ReportLine.created_at ASC]
      if sp.fee_rounding_order == PER_LINE_THEN_SUM:
          fee_subtotal_cents = SUM over L of round_half_up(L.line_fee_exact_cents, 0)
      elif sp.fee_rounding_order == SUM_THEN_ROUND:
          fee_subtotal_cents = round_half_up(SUM over L of L.line_fee_exact_cents, 0)
      # The order is pinned per state program and is observable: two lines whose exact values are
      # 49.500 and 94.500 cents give 50 + 95 = 145 under PER_LINE_THEN_SUM and
      # round_half_up(144.000) = 144 under SUM_THEN_ROUND.
      # ReportLine.line_fee_cents ALWAYS stores round_half_up(line_fee_exact_cents, 0) regardless of
      # the state's order, so under SUM_THEN_ROUND the sum of the stored line values may exceed
      # report.fee_subtotal_cents by up to (line_count / 2) cents. Invoices bill
      # report.fee_subtotal_cents, never the sum of the line values.
    input_set: "Every ReportLine of the report; fee-exempt lines contribute an exact value of 0."
    constants: {}
    precision: "whole cents, round_half_up; the rounding ORDER is the state program's fee_rounding_order"
    variants: []

  - name: invoice_administrative_fee
    trigger: "POST /epr/invoices (PackagingReport fee_status FINAL -> INVOICED)"
    algorithm: threshold
    formula: |
      fee_subtotal_cents = report.fee_subtotal_cents            # step 1: copy the report subtotal
      fs = FeeSchedule of membership.fee_schedule_id
      # step 2: the basis-point tier is selected from fee_subtotal_cents, NOT from total_cents.
      admin_fee_bps_applied = fs.admin_fee_bps_low  if fee_subtotal_cents <  ADMIN_TIER_BREAK_CENTS
                              else fs.admin_fee_bps_high
      # step 3: only now is the money computed.
      admin_fee_cents = round_half_up(fee_subtotal_cents * admin_fee_bps_applied / 10000, 0)
      total_cents = fee_subtotal_cents + admin_fee_cents
      # The dependency LOOKS circular because total_cents is what an operator would call "the
      # invoice amount" and the schedule's two rates are described as low/high brackets of "the
      # invoice". The evaluation order above is the pinned resolution: the bracket is keyed on the
      # pre-administrative subtotal and is NEVER re-derived after total_cents is known, even when
      # adding admin_fee_cents pushes total_cents across ADMIN_TIER_BREAK_CENTS.
    input_set: "The single FINAL-assessed report named in the request and the FeeSchedule pinned by the named Membership."
    constants:
      ADMIN_TIER_BREAK_CENTS: 40000
    precision: "whole cents, round_half_up"
    variants: []

  - name: membership_fee_assessment
    trigger: "POST /epr/memberships/{id}/decide with decision == APPROVE (Membership PENDING -> ACTIVE)"
    algorithm: tiered_pricing
    formula: |
      w = Producer.annual_packaging_weight_kg observed at approval time
      surcharge_units = max(0, ceil((w - MEMBERSHIP_FREE_TONNAGE_KG) / 1000))
      membership_fee_cents = fee_schedule.membership_fee_cents
                             + surcharge_units * MEMBERSHIP_SURCHARGE_PER_1000KG_CENTS
      # ceil is toward +infinity, so w == 500 gives 0 units and w == 500.001 gives 1.
    input_set: "The producer's annual_packaging_weight_kg at the instant of approval; later SKU activations do not retroactively change an approved membership fee."
    constants:
      MEMBERSHIP_FREE_TONNAGE_KG: 500
      MEMBERSHIP_SURCHARGE_PER_1000KG_CENTS: 50000
    precision: "whole cents; surcharge_units is a whole number via ceil"
    variants: []

  - name: registration_compliance_posture
    trigger: "POST /epr/registrations/{id}/submit, /decide, /suspend, /reinstate, /withdraw; POST /epr/memberships; POST /epr/memberships/{id}/decide; POST /epr/reports/{id}/submit, /resubmit, /close; POST /epr/verification-engagements/{id}/issue-opinion"
    algorithm: constraint_propagation
    formula: |
      if reg.status IN {DRAFT, SUBMITTED, REJECTED, WITHDRAWN}: compliance_posture = UNDETERMINED
      elif reg.status == SUSPENDED:                             compliance_posture = DELINQUENT
      else:   # reg.status == ACTIVE, ordered ladder, first match wins
        overdue = EXISTS r in PackagingReport where r.registration_id == reg.id
                    and r.submission_status IN {DRAFT, BLOCKED}
                    and ReportingPeriod(r).submission_deadline < clock
        if overdue:                                             compliance_posture = DELINQUENT
        elif EXISTS r where r.registration_id == reg.id and r.submission_status == CORRECTION_REQUIRED:
                                                                compliance_posture = AT_RISK
        elif EXISTS r where r.registration_id == reg.id and r.fee_status == VOIDED:
                                                                compliance_posture = AT_RISK
        else:                                                   compliance_posture = COMPLIANT
      # Propagation: after writing compliance_posture, the registration's Membership rows are
      # reconciled - AT_RISK moves an ACTIVE membership to PROBATION, and COMPLIANT moves a
      # PROBATION membership back to ACTIVE. DELINQUENT leaves membership status untouched.
    input_set: "All PackagingReport rows of this registration in any status, joined to their ReportingPeriod for the deadline comparison; evaluated against the logical clock at recompute time. The posture is never recomputed by POST /epr/_clock/set_current_utc alone."
    constants: {}
    precision: "enum output"
    variants: []

  - name: reported_weight_ytd_rollup
    trigger: "POST /epr/reports/{id}/submit, POST /epr/reports/{id}/resubmit, POST /epr/reports/{id}/close, and the UNDER_VERIFICATION -> CORRECTION_REQUIRED cascade"
    algorithm: aggregation
    formula: |
      reported_weight_kg_ytd = round_half_up(
        SUM over r in PackagingReport where r.registration_id == reg.id
            and r.submission_status IN {SUBMITTED, UNDER_VERIFICATION, VERIFIED, FINALIZED}
        of r.total_weight_kg
      , 3)
      # CONSERVED QUANTITY (mass): this field is a pure function of the counted set, so any forward
      # transition into the set paired with its compensating transition out of the set restores the
      # previous value exactly. REJECTED, DRAFT, BLOCKED and CORRECTION_REQUIRED reports are outside
      # the set.
    input_set: "Reports of this registration whose submission_status is in the counted set, regardless of reporting period; summation order is PackagingReport.created_at ASC."
    constants: {}
    precision: "kilograms at 3 decimal places, round_half_up"
    variants: []

  - name: producer_fee_balance_rollup
    trigger: "POST /epr/invoices, POST /epr/invoices/{id}/void, and the invoice-void hop of the correction cascade"
    algorithm: aggregation
    formula: |
      assessed_fee_balance_cents = SUM over i in Invoice where i.status == ISSUED
        and Registration(PackagingReport(i.packaging_report_id).registration_id).producer_id == producer.id
        of i.total_cents
      # CONSERVED QUANTITY (money): issuing an invoice and then voiding it must restore the exact
      # pre-issue integer. Because the field is recomputed from the ISSUED set rather than adjusted
      # by deltas, no rounding drift can accumulate across issue/void cycles.
    input_set: "Invoice rows with status == ISSUED only; VOID invoices are excluded. Summation order is Invoice.created_at ASC."
    constants: {}
    precision: "whole cents (integer addition only)"
    variants: []

  - name: redesign_fee_projection
    trigger: "POST /epr/skus/{id}/redesign-projection (non-mutating)"
    algorithm: forward_looking
    formula: |
      units = variant_units(units_basis, sku, request)
      baseline_components = sku.components with status == ACTIVE
      candidate_components = request.candidate_components
      for each set S in {baseline_components, candidate_components}:
        fee(S) = round_half_up( SUM over c in S of
                   eco_modulation_adjustment(c,
                     round_half_up(units * c.unit_weight_grams / 1000, 3),
                     rate_for(c.material_type, request.tier_basis_kg),
                     state_program) , 0)
      baseline_line_fee_cents  = fee(baseline_components)
      projected_line_fee_cents = fee(candidate_components)
      fee_delta_cents = projected_line_fee_cents - baseline_line_fee_cents
      # Forward-looking: the projection prices a component set that is NOT persisted, at the tier
      # the caller supplies, and includes the same eco-modulation policy the state program would
      # apply. Both sides are priced at the SAME units and the SAME tier so the delta isolates the
      # redesign. Nothing is written: the SKU, its revision_count and the producer rollup are
      # unchanged, so calling this endpoint twice returns identical output.
    input_set: "The SKU's ACTIVE components as the baseline and the request's candidate_components as the projection; rate rows come from the named FeeSchedule regardless of its status."
    constants: {}
    precision: "kilograms at 3 decimal places; whole cents on both sides, round_half_up"
    variants:
      - name: BASELINE_UNITS
        when: "request units_basis == BASELINE_UNITS"
        difference: "units = sku.units_sold_annual_estimate; projected_units in the body is ignored."
      - name: PROJECTED_UNITS
        when: "request units_basis == PROJECTED_UNITS"
        difference: "units = request.projected_units, which is required in this mode; the same candidate component set therefore yields a proportionally different fee_delta_cents."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (Ordered by Priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "request body/query shape: required fields present, JSON types correct, enum values in range, integers non-negative where required, limit in [1,100] and offset >= 0, ISO-8601 instants parseable, monetary and weight fields are integers or decimals within their declared precision"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "path-parameter resources exist, validated left-to-right along the path"
    error_id: "per-entity: ERR_PRODUCER_NOT_FOUND, ERR_SKU_NOT_FOUND, ERR_STATE_PROGRAM_NOT_FOUND, ERR_REPORTING_PERIOD_NOT_FOUND, ERR_PRO_NOT_FOUND, ERR_FEE_SCHEDULE_NOT_FOUND, ERR_REGISTRATION_NOT_FOUND, ERR_MEMBERSHIP_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_REPORT_LINE_NOT_FOUND, ERR_ENGAGEMENT_NOT_FOUND, ERR_INVOICE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "body-referenced foreign keys exist, validated in the field order declared by the endpoint's input list"
    error_id: "per-entity ERR_*_NOT_FOUND as above"
    http_status: 404
    applies_to: "all endpoints whose input contains a *_id field"

  - priority: 6
    category: auth
    check: "ownership: a ProducerComplianceOfficer's X-User-ID equals the producer_id reachable from the target resource; a ProAdministrator's X-User-ID equals the pro_id reachable from the target resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all producer-scoped and pro-scoped endpoints"

  - priority: 7
    category: state
    check: "the target resource's own status permits the requested transition per §1.2 (generic fallback when no more specific state error applies)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: state
    check: "the Registration named or reachable from the request has status == ACTIVE"
    error_id: ERR_REGISTRATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /epr/reports, POST /epr/reports/{id}/lines, POST /epr/reports/{id}/submit"

  - priority: 9
    category: state
    check: "the FeeSchedule named in the request has status == PUBLISHED"
    error_id: ERR_FEE_SCHEDULE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /epr/memberships"

  - priority: 10
    category: state
    check: "the PackagingReport has submission_status == DRAFT for line mutations"
    error_id: ERR_REPORT_NOT_IN_DRAFT
    http_status: 409
    applies_to: "POST /epr/reports/{id}/lines, DELETE /epr/report-lines/{id}"

  - priority: 11
    category: state
    check: "the PackagingReport has submission_status == UNDER_VERIFICATION"
    error_id: ERR_REPORT_NOT_UNDER_VERIFICATION
    http_status: 409
    applies_to: "POST /epr/verification-engagements/{id}/start, POST /epr/verification-engagements/{id}/issue-opinion"

  - priority: 12
    category: state
    check: "optimistic concurrency: expected_pro_version equals Pro.version at publish time"
    error_id: ERR_STALE_PRO_VERSION
    http_status: 412
    applies_to: "POST /epr/fee-schedules/{id}/publish"

  - priority: 13
    category: state
    check: "optimistic concurrency: expected_registration_version equals Registration.version at membership-create time"
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412
    applies_to: "POST /epr/memberships"

  - priority: 14
    category: business_safety
    check: "the Producer has status IN {OBLIGATION_DETERMINED, REGISTERED}, i.e. determine-obligation has been run at least once"
    error_id: ERR_OBLIGATION_NOT_DETERMINED
    http_status: 409
    applies_to: "POST /epr/registrations, POST /epr/registrations/{id}/submit"

  - priority: 15
    category: business_safety
    check: "the Producer's obligation determination is current: Producer.determination_stale == false (a restate-revenue or a SKU activation since the last determine-obligation call sets it true)"
    error_id: ERR_DETERMINATION_STALE
    http_status: 409
    applies_to: "POST /epr/registrations/{id}/submit, POST /epr/memberships, POST /epr/reports/{id}/submit"

  - priority: 16
    category: business_safety
    check: "the Producer's obligated_party_role is not NOT_OBLIGATED"
    error_id: ERR_PRODUCER_NOT_OBLIGATED
    http_status: 422
    applies_to: "POST /epr/registrations/{id}/submit"

  - priority: 17
    category: business_safety
    check: "the Registration's exemption_status is not EXEMPT_SMALL_PRODUCER or EXEMPT_CATEGORY"
    error_id: ERR_EXEMPT_REGISTRATION_CANNOT_REPORT
    http_status: 422
    applies_to: "POST /epr/reports"

  - priority: 18
    category: business_safety
    check: "segregation of duties: X-User-ID of the acting IndependentVerifier differs from PackagingReport.submitted_by_user_id, and differs from the assigned_by_user_id of the engagement"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /epr/verification-engagements, POST /epr/verification-engagements/{id}/issue-opinion"

  - priority: 19
    category: business_safety
    check: "verifier rotation: the named verifier_user_id did not issue the opinion on the immediately preceding FINALIZED report of the same registration"
    error_id: ERR_VERIFIER_ROTATION_REQUIRED
    http_status: 422
    applies_to: "POST /epr/verification-engagements"

  - priority: 20
    category: business_safety
    check: "the acting IndependentVerifier's X-User-ID equals VerificationEngagement.verifier_user_id"
    error_id: ERR_NOT_ASSIGNED_VERIFIER
    http_status: 403
    applies_to: "POST /epr/verification-engagements/{id}/start, POST /epr/verification-engagements/{id}/issue-opinion"

  - priority: 21
    category: business_safety
    check: "when PackagingReport.verification_required == true, the report must have submission_status == VERIFIED before a FINAL assessment or a close with decision == FINALIZE"
    error_id: ERR_VERIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /epr/reports/{id}/assess (variant FINAL), POST /epr/reports/{id}/close"

  - priority: 22
    category: business_referential
    check: "the named ReportingPeriod's state_program_id equals the Registration's state_program_id"
    error_id: ERR_PERIOD_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /epr/reports"

  - priority: 23
    category: business_referential
    check: "the named Sku's producer_id equals the Registration's producer_id"
    error_id: ERR_SKU_PRODUCER_MISMATCH
    http_status: 422
    applies_to: "POST /epr/reports/{id}/lines"

  - priority: 24
    category: business_referential
    check: "the named FeeSchedule's pro_id equals the named Pro's id"
    error_id: ERR_FEE_SCHEDULE_PRO_MISMATCH
    http_status: 422
    applies_to: "POST /epr/memberships"

  - priority: 25
    category: business_referential
    check: "the named FeeSchedule's state_program_id equals the Registration's state_program_id"
    error_id: ERR_FEE_SCHEDULE_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /epr/memberships"

  - priority: 26
    category: business_referential
    check: "the named PackagingReport's registration_id equals the named Membership's registration_id"
    error_id: ERR_MEMBERSHIP_REGISTRATION_MISMATCH
    http_status: 422
    applies_to: "POST /epr/invoices"

  - priority: 27
    category: business_referential
    check: "the membership's pinned FeeSchedule contains a material_rates row for every material_type appearing in any ACTIVE component of any non-exempt report line"
    error_id: ERR_MATERIAL_RATE_MISSING
    http_status: 422
    applies_to: "POST /epr/reports/{id}/assess"

  - priority: 28
    category: business_constraint
    check: "no existing Registration for the same (producer_id, state_program_id) pair with status IN {DRAFT, SUBMITTED, ACTIVE, SUSPENDED}"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /epr/registrations"

  - priority: 29
    category: business_constraint
    check: "no existing PackagingReport for the same (registration_id, reporting_period_id) pair with submission_status not in {REJECTED}"
    error_id: ERR_DUPLICATE_REPORT_FOR_PERIOD
    http_status: 409
    applies_to: "POST /epr/reports"

  - priority: 30
    category: business_constraint
    check: "no existing ReportLine for the same (packaging_report_id, sku_id) pair"
    error_id: ERR_DUPLICATE_REPORT_LINE
    http_status: 409
    applies_to: "POST /epr/reports/{id}/lines"

  - priority: 31
    category: business_constraint
    check: "the new ReportingPeriod's half-open data window [data_start, data_end) does not overlap any existing period of the same state program; touching endpoints (previous end == new start) are allowed"
    error_id: ERR_PERIOD_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /epr/state-programs/{id}/reporting-periods"

  - priority: 32
    category: business_constraint
    check: "the new FeeSchedule's closed effective window [effective_from, effective_to] does not overlap or touch any existing schedule of the same (pro_id, state_program_id); a null effective_to means open-ended and blocks every later window"
    error_id: ERR_FEE_SCHEDULE_EFFECTIVE_OVERLAP
    http_status: 409
    applies_to: "POST /epr/fee-schedules"

  - priority: 33
    category: business_constraint
    check: "for each material_type in material_rates, the tier bands are contiguous and non-overlapping: sorted by tier_min_kg the first band starts at 0, each band's tier_max_kg equals the next band's tier_min_kg, and exactly the last band has tier_max_kg == null"
    error_id: ERR_FEE_TIER_DISCONTINUOUS
    http_status: 422
    applies_to: "POST /epr/fee-schedules"

  - priority: 34
    category: business_constraint
    check: "the FeeSchedule has at least one material_rates row"
    error_id: ERR_FEE_SCHEDULE_HAS_NO_RATES
    http_status: 422
    applies_to: "POST /epr/fee-schedules/{id}/publish"

  - priority: 35
    category: business_constraint
    check: "the Sku has at least one ACTIVE component"
    error_id: ERR_SKU_HAS_NO_COMPONENTS
    http_status: 422
    applies_to: "POST /epr/skus/{id}/activate"

  - priority: 36
    category: business_constraint
    check: "the Producer has at least one ACTIVE Sku"
    error_id: ERR_PRODUCER_HAS_NO_ACTIVE_SKUS
    http_status: 422
    applies_to: "POST /epr/producers/{id}/determine-obligation"

  - priority: 37
    category: business_constraint
    check: "the PackagingReport has at least one ReportLine"
    error_id: ERR_REPORT_HAS_NO_LINES
    http_status: 422
    applies_to: "POST /epr/reports/{id}/submit"

  - priority: 38
    category: business_constraint
    check: "no existing VerificationEngagement for the same packaging_report_id with status IN {ASSIGNED, IN_PROGRESS}"
    error_id: ERR_ENGAGEMENT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /epr/verification-engagements"

  - priority: 39
    category: business_constraint
    check: "aggregate verifier capacity: counting engagements of the same verifier_user_id with status IN {ASSIGNED, IN_PROGRESS} whose [fieldwork_start, fieldwork_end] window, expanded by VERIFIER_BUFFER_DAYS = 2 on each side, intersects the requested window, the count must be strictly less than VERIFIER_MAX_CONCURRENT_ENGAGEMENTS = 2"
    error_id: ERR_VERIFIER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /epr/verification-engagements"

  - priority: 40
    category: business_constraint
    check: "the Registration has no PackagingReport with submission_status IN {DRAFT, SUBMITTED, UNDER_VERIFICATION, CORRECTION_REQUIRED}"
    error_id: ERR_REGISTRATION_HAS_OPEN_REPORTS
    http_status: 409
    applies_to: "POST /epr/registrations/{id}/withdraw"

  - priority: 41
    category: business_temporal
    check: "fieldwork_end is strictly after fieldwork_start"
    error_id: ERR_INVALID_FIELDWORK_WINDOW
    http_status: 422
    applies_to: "POST /epr/verification-engagements"

  - priority: 42
    category: business_temporal
    check: "the state program's registration_deadline has not passed at the logical clock"
    error_id: ERR_REGISTRATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /epr/registrations/{id}/submit"

  - priority: 43
    category: business_temporal
    check: "the logical clock is at or after ReportingPeriod.submission_open"
    error_id: ERR_SUBMISSION_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /epr/reports/{id}/submit"

  - priority: 44
    category: business_temporal
    check: "the logical clock is at or before ReportingPeriod.submission_deadline"
    error_id: ERR_SUBMISSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /epr/reports/{id}/submit"

  - priority: 45
    category: business_temporal
    check: "the logical clock is at or before PackagingReport.correction_due_at"
    error_id: ERR_CORRECTION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /epr/reports/{id}/resubmit"

  - priority: 46
    category: business_temporal
    check: "the report's correction window is not still open: correction_due_at is null or has passed at the logical clock"
    error_id: ERR_CORRECTION_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /epr/reports/{id}/close with decision == REJECT"

  - priority: 47
    category: business_temporal
    check: "the membership's pinned FeeSchedule was effective for the report's period: effective_from <= ReportingPeriod.data_start and (effective_to is null or ReportingPeriod.data_start <= effective_to)"
    error_id: ERR_FEE_SCHEDULE_NOT_EFFECTIVE_FOR_PERIOD
    http_status: 422
    applies_to: "POST /epr/reports/{id}/assess"

  - priority: 48
    category: business_fiscal
    check: "the Registration has a Membership with status IN {ACTIVE, PROBATION}"
    error_id: ERR_NO_ACTIVE_MEMBERSHIP
    http_status: 402
    applies_to: "POST /epr/reports/{id}/submit, POST /epr/reports/{id}/assess"

  - priority: 49
    category: business_fiscal
    check: "the Membership has status IN {ACTIVE, PROBATION} (the fee is only assessed at approval, so a PENDING or terminated membership has nothing to pay)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /epr/memberships/{id}/record-fee-payment"

  - priority: 50
    category: business_fiscal
    check: "the paid amount_cents equals the Membership's assessed membership_fee_cents exactly"
    error_id: ERR_MEMBERSHIP_FEE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /epr/memberships/{id}/record-fee-payment"

  - priority: 51
    category: business_fiscal
    check: "the Membership's fee_payment_status == PAID"
    error_id: ERR_MEMBERSHIP_FEE_OUTSTANDING
    http_status: 402
    applies_to: "POST /epr/reports/{id}/submit"

  - priority: 52
    category: business_fiscal
    check: "the Invoice has status == ISSUED"
    error_id: ERR_INVOICE_NOT_ISSUED
    http_status: 409
    applies_to: "POST /epr/invoices/{id}/void"

  - priority: 53
    category: business_fiscal
    check: "an opinion of QUALIFIED or ADVERSE carries a non-empty findings_note"
    error_id: ERR_FINDINGS_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /epr/verification-engagements/{id}/issue-opinion"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Producer ------------------------------------------------------------
  - method: POST
    path: "/epr/producers"
    description: "Onboard a candidate obligated party. Created in DRAFT with obligated_party_role = UNDETERMINED."
    roles: [ProgramRegulator]
    code: 201
    input: [legal_name, "parent_producer_id?", brand_owner_flag, importer_of_record_flag, domestic_licensor_flag, annual_gross_revenue_usd, contact_email]
    output: Producer
    side_effects: ["creates the Producer in DRAFT with version 1"]

  - method: GET
    path: "/epr/producers/{id}"
    description: "Fetch one producer including its computed rollups."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator]
    code: 200
    input: []
    output: Producer
    side_effects: []

  - method: GET
    path: "/epr/producers"
    description: "List producers; parent_producer_id resolves the affiliate set used by the GROUP_LEVEL exemption variant."
    roles: [ProgramRegulator, ProAdministrator]
    code: 200
    input: ["parent_producer_id?", "status?", "obligated_party_role?", "limit?", "offset?"]
    output: Producer[]
    side_effects: []

  - method: POST
    path: "/epr/producers/{id}/determine-obligation"
    description: "Run producer_obligation_role and refresh the tonnage rollup. Moves DRAFT -> OBLIGATION_DETERMINED and clears determination_stale."
    roles: [ProgramRegulator]
    code: 200
    input: []
    output: Producer
    side_effects: ["runs producer_obligation_role", "runs producer_annual_packaging_weight", "sets determination_stale = false", "increments Producer.version"]

  - method: POST
    path: "/epr/producers/{id}/restate-revenue"
    description: "Restate trailing-year revenue. Reverts the producer to DRAFT and runs the three-hop suspension cascade over its registrations and their DRAFT reports."
    roles: [ProgramRegulator]
    code: 200
    input: [annual_gross_revenue_usd, reason]
    output: Producer
    side_effects: ["status -> DRAFT and obligated_party_role -> UNDETERMINED", "CASCADE: SUBMITTED/ACTIVE registrations -> SUSPENDED", "CASCADE: their DRAFT reports -> BLOCKED", "CASCADE: registration_compliance_posture -> DELINQUENT", "increments version on every touched row"]

  # --- Sku -----------------------------------------------------------------
  - method: POST
    path: "/epr/skus"
    description: "Create a stock keeping unit in DRAFT with an empty component list."
    roles: [ProducerComplianceOfficer]
    code: 201
    input: [producer_id, gtin, name, product_category, units_sold_annual_estimate]
    output: Sku
    side_effects: ["creates the Sku in DRAFT"]

  - method: GET
    path: "/epr/skus/{id}"
    description: "Fetch one SKU with its component array and derived unit weight."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: []
    output: Sku
    side_effects: []

  - method: GET
    path: "/epr/skus"
    description: "List SKUs; producer_id is the reverse-reachability filter for Sku.producer_id."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: ["producer_id?", "status?", "product_category?", "limit?", "offset?"]
    output: Sku[]
    side_effects: []

  - method: POST
    path: "/epr/skus/{id}/components"
    description: "Append one packaging component with its material, weight, recyclability class, PCR content and reusability."
    roles: [ProducerComplianceOfficer]
    code: 200
    input: [material_type, unit_weight_grams, recyclability_class, pcr_content_pct, is_reusable]
    output: Sku
    side_effects: ["appends the component with the next component_seq and status ACTIVE", "recomputes unit_packaging_weight_grams", "increments Sku.version"]

  - method: POST
    path: "/epr/skus/{id}/activate"
    description: "Activate the SKU so it counts toward the producer tonnage rollup and may be reported."
    roles: [ProducerComplianceOfficer]
    code: 200
    input: []
    output: Sku
    side_effects: ["status -> ACTIVE", "recomputes Producer.annual_packaging_weight_kg", "sets Producer.determination_stale = true when the producer is OBLIGATION_DETERMINED", "increments Sku.version and Producer.version"]

  - method: POST
    path: "/epr/skus/{id}/revise-packaging"
    description: "Replace the whole ACTIVE component set with a redesigned one; the four-hop cascade re-derives the SKU weight, the producer rollup and the determination-stale flag."
    roles: [ProducerComplianceOfficer]
    code: 200
    input: [components, reason]
    output: Sku
    side_effects: ["CASCADE: ACTIVE components -> SUPERSEDED, replacements appended", "recomputes unit_packaging_weight_grams and increments revision_count", "recomputes Producer.annual_packaging_weight_kg", "sets Producer.determination_stale = true", "increments Sku.version and Producer.version"]

  - method: POST
    path: "/epr/skus/{id}/redesign-projection"
    description: "Non-mutating what-if pricing for a candidate packaging redesign. Returns an object with projected_units, projected_unit_weight_grams, projected_line_weight_kg, baseline_line_fee_cents, projected_line_fee_cents, fee_delta_cents and per-material eco-modulation detail. Writes nothing."
    roles: [ProducerComplianceOfficer, ProgramRegulator]
    code: 200
    input: [state_program_id, fee_schedule_id, tier_basis_kg, units_basis, "projected_units?", candidate_components]
    output: null
    side_effects: ["runs redesign_fee_projection; no persisted state changes and no version increments"]

  # --- StateProgram and ReportingPeriod ------------------------------------
  - method: POST
    path: "/epr/state-programs"
    description: "Register a state EPR program with its obligation basis, eco-modulation policy, fee rounding order, exemption thresholds and registration deadline. The policy triple is what produces multi-state variance."
    roles: [ProgramRegulator]
    code: 201
    input: [state_code, obligation_basis, eco_mod_policy, fee_rounding_order, small_producer_revenue_threshold_usd, small_producer_tonnage_threshold_kg, exempt_product_categories, verification_required_threshold_kg, registration_deadline]
    output: StateProgram
    side_effects: ["creates the StateProgram"]

  - method: GET
    path: "/epr/state-programs/{id}"
    description: "Fetch one state program with its policy triple and thresholds."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: []
    output: StateProgram
    side_effects: []

  - method: GET
    path: "/epr/state-programs"
    description: "List state programs."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: ["state_code?", "obligation_basis?", "limit?", "offset?"]
    output: StateProgram[]
    side_effects: []

  - method: POST
    path: "/epr/state-programs/{id}/reporting-periods"
    description: "Create a reporting period whose half-open data window [data_start, data_end) must not overlap an existing period of the same program; touching windows are allowed."
    roles: [ProgramRegulator]
    code: 201
    input: [period_label, data_start, data_end, submission_open, submission_deadline, correction_window_days]
    output: ReportingPeriod
    side_effects: ["creates the ReportingPeriod"]

  - method: GET
    path: "/epr/state-programs/{id}/reporting-periods"
    description: "Reverse-reachability list of the periods of one state program."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: ["limit?", "offset?"]
    output: ReportingPeriod[]
    side_effects: []

  - method: GET
    path: "/epr/reporting-periods/{id}"
    description: "Fetch one reporting period."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects: []

  # --- Pro and FeeSchedule -------------------------------------------------
  - method: POST
    path: "/epr/pros"
    description: "Register a producer responsibility organisation."
    roles: [ProgramRegulator]
    code: 201
    input: [name, contact_email]
    output: Pro
    side_effects: ["creates the Pro with version 1, the OCC anchor for schedule publication"]

  - method: GET
    path: "/epr/pros/{id}"
    description: "Fetch one PRO; its version is the value clients pin into expected_pro_version."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator]
    code: 200
    input: []
    output: Pro
    side_effects: []

  - method: GET
    path: "/epr/pros"
    description: "List PROs."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: Pro[]
    side_effects: []

  - method: POST
    path: "/epr/fee-schedules"
    description: "Draft a fee schedule for one (pro, state program) pair with its membership fee, the two administrative basis-point brackets and the per-material tier bands."
    roles: [ProAdministrator]
    code: 201
    input: [pro_id, state_program_id, effective_from, "effective_to?", membership_fee_cents, admin_fee_bps_low, admin_fee_bps_high, material_rates]
    output: FeeSchedule
    side_effects: ["creates the FeeSchedule in DRAFT after checking window non-overlap and per-material tier contiguity"]

  - method: GET
    path: "/epr/fee-schedules/{id}"
    description: "Fetch one fee schedule with its material rate bands."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/epr/fee-schedules"
    description: "List fee schedules; pro_id and state_program_id are the reverse-reachability filters."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator]
    code: 200
    input: ["pro_id?", "state_program_id?", "status?", "limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []

  - method: POST
    path: "/epr/fee-schedules/{id}/publish"
    description: "Publish a DRAFT schedule under optimistic concurrency on the owning PRO. Truncates the PRO's prior open-ended published schedule for the same state program."
    roles: [ProAdministrator]
    code: 200
    input: [expected_pro_version]
    output: FeeSchedule
    side_effects: ["status -> PUBLISHED", "prior open-ended PUBLISHED schedule of the same (pro_id, state_program_id) -> SUPERSEDED with effective_to set to the new effective_from minus one day", "increments Pro.version and FeeSchedule.version"]

  # --- Registration --------------------------------------------------------
  - method: POST
    path: "/epr/registrations"
    description: "Open a DRAFT registration of one producer in one state program."
    roles: [ProducerComplianceOfficer]
    code: 201
    input: [producer_id, state_program_id]
    output: Registration
    side_effects: ["creates the Registration in DRAFT with exemption_status UNDETERMINED and compliance_posture UNDETERMINED"]

  - method: GET
    path: "/epr/registrations/{id}"
    description: "Fetch one registration with its exemption verdict, YTD tonnage and compliance posture."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/epr/registrations"
    description: "List registrations; producer_id and state_program_id are the reverse-reachability filters."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: ["producer_id?", "state_program_id?", "status?", "exemption_status?", "compliance_posture?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  - method: POST
    path: "/epr/registrations/{id}/submit"
    description: "Submit the registration. Runs exemption_determination under the state program's obligation_basis variant and records the assessed group figures."
    roles: [ProducerComplianceOfficer]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> SUBMITTED", "runs exemption_determination (ENTITY_LEVEL or GROUP_LEVEL)", "writes exemption_status, exemption_basis_applied, assessed_group_revenue_usd, assessed_group_weight_kg, submitted_at", "increments version"]

  - method: POST
    path: "/epr/registrations/{id}/decide"
    description: "Regulator decision on a SUBMITTED registration; decision is ACCEPT or REJECT. REJECT terminates every membership of the registration."
    roles: [ProgramRegulator]
    code: 200
    input: [decision, "reason?"]
    output: Registration
    side_effects: ["ACCEPT: status -> ACTIVE and registration_compliance_posture runs", "REJECT: status -> REJECTED, memberships -> TERMINATED, compliance_posture -> UNDETERMINED", "increments version on every touched row"]

  - method: POST
    path: "/epr/registrations/{id}/suspend"
    description: "Suspend an ACTIVE registration; DRAFT reports of the registration move to BLOCKED."
    roles: [ProgramRegulator]
    code: 200
    input: [suspension_reason]
    output: Registration
    side_effects: ["status -> SUSPENDED", "DRAFT reports -> BLOCKED", "compliance_posture -> DELINQUENT", "increments version on every touched row"]

  - method: POST
    path: "/epr/registrations/{id}/reinstate"
    description: "Reinstate a SUSPENDED registration; BLOCKED reports return to DRAFT and a PROBATION membership returns to ACTIVE when the posture recomputes to COMPLIANT."
    roles: [ProgramRegulator]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> ACTIVE and suspension_reason cleared", "BLOCKED reports -> DRAFT", "recomputes compliance_posture", "PROBATION membership -> ACTIVE when COMPLIANT", "increments version on every touched row"]

  - method: POST
    path: "/epr/registrations/{id}/withdraw"
    description: "Producer-initiated withdrawal from the state program; refused while any report is open."
    roles: [ProducerComplianceOfficer]
    code: 200
    input: [reason]
    output: Registration
    side_effects: ["status -> WITHDRAWN", "memberships -> TERMINATED", "compliance_posture -> UNDETERMINED", "increments version on every touched row"]

  # --- Membership ----------------------------------------------------------
  - method: POST
    path: "/epr/memberships"
    description: "Apply to join a PRO under a published fee schedule, under optimistic concurrency on the registration. Terminates the registration's prior ACTIVE or PROBATION membership."
    roles: [ProducerComplianceOfficer]
    code: 201
    input: [registration_id, pro_id, fee_schedule_id, expected_registration_version]
    output: Membership
    side_effects: ["creates the Membership in PENDING", "prior ACTIVE or PROBATION membership of the registration -> TERMINATED with decision_reason 'SUPERSEDED_BY_NEW_MEMBERSHIP'", "increments Registration.version"]

  - method: GET
    path: "/epr/memberships/{id}"
    description: "Fetch one membership with its assessed fee, payment status and pinned schedule version."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/epr/memberships"
    description: "List memberships; registration_id, pro_id and fee_schedule_id are the reverse-reachability filters."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator]
    code: 200
    input: ["registration_id?", "pro_id?", "fee_schedule_id?", "status?", "fee_payment_status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  - method: POST
    path: "/epr/memberships/{id}/decide"
    description: "PRO decision on a PENDING membership; decision is APPROVE or REJECT. APPROVE assesses the membership fee and pins the fee schedule version."
    roles: [ProAdministrator]
    code: 200
    input: [decision, "reason?"]
    output: Membership
    side_effects: ["APPROVE: status -> ACTIVE, runs membership_fee_assessment, pins fee_schedule_version_pinned, fee_payment_status -> OUTSTANDING", "REJECT: status -> REJECTED with decision_reason", "recomputes Registration.compliance_posture", "increments Membership.version and Registration.version"]

  - method: POST
    path: "/epr/memberships/{id}/record-fee-payment"
    description: "Record payment of the assessed membership fee; the amount must match membership_fee_cents exactly."
    roles: [ProAdministrator]
    code: 200
    input: [amount_cents]
    output: Membership
    side_effects: ["fee_payment_status -> PAID", "increments version"]

  # --- PackagingReport and ReportLine --------------------------------------
  - method: POST
    path: "/epr/reports"
    description: "Open a DRAFT packaging report for one registration and one reporting period. Refused for an exempt registration."
    roles: [ProducerComplianceOfficer]
    code: 201
    input: [registration_id, reporting_period_id]
    output: PackagingReport
    side_effects: ["creates the PackagingReport with submission_status DRAFT and fee_status UNASSESSED"]

  - method: GET
    path: "/epr/reports/{id}"
    description: "Fetch one report with both state dimensions, the weight rollups, the tier basis and the fee subtotal."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: []
    output: PackagingReport
    side_effects: []

  - method: GET
    path: "/epr/reports"
    description: "List reports; registration_id and reporting_period_id are the reverse-reachability filters."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: ["registration_id?", "reporting_period_id?", "submission_status?", "fee_status?", "limit?", "offset?"]
    output: PackagingReport[]
    side_effects: []

  - method: POST
    path: "/epr/reports/{id}/lines"
    description: "Attach one SKU line to a DRAFT report; line_weight_kg and fee_exempt are derived immediately."
    roles: [ProducerComplianceOfficer]
    code: 201
    input: [sku_id, units_sold]
    output: ReportLine
    side_effects: ["creates the ReportLine and computes line_weight_kg and fee_exempt", "recomputes PackagingReport.total_weight_kg, fee_basis_weight_kg and line_count", "increments PackagingReport.version"]

  - method: GET
    path: "/epr/report-lines/{id}"
    description: "Fetch one report line with its eco-modulation audit detail."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: []
    output: ReportLine
    side_effects: []

  - method: GET
    path: "/epr/report-lines"
    description: "List report lines; packaging_report_id and sku_id are the reverse-reachability filters."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: ["packaging_report_id?", "sku_id?", "fee_exempt?", "limit?", "offset?"]
    output: ReportLine[]
    side_effects: []

  - method: DELETE
    path: "/epr/report-lines/{id}"
    description: "Remove a line from a DRAFT report."
    roles: [ProducerComplianceOfficer]
    code: 204
    input: []
    output: null
    side_effects: ["deletes the ReportLine", "recomputes PackagingReport.total_weight_kg, fee_basis_weight_kg and line_count", "increments PackagingReport.version"]

  - method: POST
    path: "/epr/reports/{id}/submit"
    description: "Submit the report. Recomputes every line weight, derives verification_required from the state threshold and rolls the tonnage into Registration.reported_weight_kg_ytd."
    roles: [ProducerComplianceOfficer]
    code: 200
    input: []
    output: PackagingReport
    side_effects: ["submission_status -> SUBMITTED", "recomputes every ReportLine.line_weight_kg, then total_weight_kg, fee_basis_weight_kg, line_count and verification_required", "sets submitted_by_user_id", "LEDGER SYNC: recomputes Registration.reported_weight_kg_ytd", "recomputes Registration.compliance_posture", "increments version on the report, its lines and the registration"]

  - method: POST
    path: "/epr/reports/{id}/assess"
    description: "Price the report under the variant named in the body (PROVISIONAL or FINAL). Moves only the fee_status dimension."
    roles: [ProAdministrator]
    code: 200
    input: [variant]
    output: PackagingReport
    side_effects: ["runs report_fee_assessment for the named variant, eco_modulation_adjustment per component and report_fee_total", "writes tier_basis_kg, fee_subtotal_cents, fee_variant_applied and every ReportLine fee field", "fee_status -> PROVISIONAL or FINAL", "increments version on the report and every line"]

  - method: GET
    path: "/epr/reports/{id}/fee-breakdown"
    description: "Computed read of the last assessment: returns an object with tier_basis_kg, fee_variant_applied, fee_rounding_order_applied, per-line exact and rounded values and the sum-of-lines reconciliation delta. Writes nothing."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: []
    output: null
    side_effects: []

  - method: POST
    path: "/epr/reports/{id}/resubmit"
    description: "Resubmit a corrected report inside its correction window; increments correction_round and returns the fee dimension to UNASSESSED."
    roles: [ProducerComplianceOfficer]
    code: 200
    input: []
    output: PackagingReport
    side_effects: ["submission_status -> SUBMITTED and correction_round incremented", "clears correction_due_at", "fee_status VOIDED -> UNASSESSED and the fee fields reset", "recomputes line weights, total_weight_kg, fee_basis_weight_kg and verification_required", "LEDGER SYNC: recomputes Registration.reported_weight_kg_ytd", "recomputes compliance_posture and returns a PROBATION membership to ACTIVE when COMPLIANT", "increments version on the report, its lines, the registration and the membership"]

  - method: POST
    path: "/epr/reports/{id}/close"
    description: "Regulator close-out; decision is FINALIZE (from SUBMITTED or VERIFIED, requires an issued invoice) or REJECT (from CORRECTION_REQUIRED once the correction window has expired)."
    roles: [ProgramRegulator]
    code: 200
    input: [decision, "reason?"]
    output: PackagingReport
    side_effects: ["FINALIZE: submission_status -> FINALIZED", "REJECT: submission_status -> REJECTED and correction_due_at cleared", "recomputes Registration.compliance_posture and returns a PROBATION membership to ACTIVE when COMPLIANT", "increments version on every touched row"]

  # --- VerificationEngagement ---------------------------------------------
  - method: POST
    path: "/epr/verification-engagements"
    description: "Assign an independent verifier to a SUBMITTED report for a fieldwork window. Enforces segregation of duties, verifier rotation and buffered aggregate capacity, and moves the report to UNDER_VERIFICATION."
    roles: [ProgramRegulator]
    code: 201
    input: [packaging_report_id, verifier_user_id, fieldwork_start, fieldwork_end]
    output: VerificationEngagement
    side_effects: ["creates the engagement in ASSIGNED with round_index = report.correction_round + 1", "records assigned_by_user_id", "report submission_status SUBMITTED -> UNDER_VERIFICATION", "increments PackagingReport.version"]

  - method: GET
    path: "/epr/verification-engagements/{id}"
    description: "Fetch one engagement with its opinion and findings note."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: []
    output: VerificationEngagement
    side_effects: []

  - method: GET
    path: "/epr/verification-engagements"
    description: "List engagements; packaging_report_id is the reverse-reachability filter and verifier_user_id supports the rotation and capacity checks."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator, IndependentVerifier]
    code: 200
    input: ["packaging_report_id?", "verifier_user_id?", "status?", "opinion?", "limit?", "offset?"]
    output: VerificationEngagement[]
    side_effects: []

  - method: POST
    path: "/epr/verification-engagements/{id}/start"
    description: "The assigned verifier starts fieldwork."
    roles: [IndependentVerifier]
    code: 200
    input: []
    output: VerificationEngagement
    side_effects: ["status -> IN_PROGRESS", "increments version"]

  - method: POST
    path: "/epr/verification-engagements/{id}/issue-opinion"
    description: "Issue the verification opinion. UNQUALIFIED verifies the report; QUALIFIED or ADVERSE opens the correction window and runs the six-hop correction cascade."
    roles: [IndependentVerifier]
    code: 200
    input: [opinion, "findings_note?"]
    output: VerificationEngagement
    side_effects: ["status -> OPINION_ISSUED and opinion_issued_at set", "UNQUALIFIED: report -> VERIFIED", "QUALIFIED/ADVERSE: report -> CORRECTION_REQUIRED, correction_due_at set, YTD tonnage reduced, fee_status -> VOIDED, ISSUED invoice -> VOID, producer balance reduced, posture -> AT_RISK, ACTIVE membership -> PROBATION", "increments version on every touched row"]

  # --- Invoice -------------------------------------------------------------
  - method: POST
    path: "/epr/invoices"
    description: "Issue the fee invoice for a FINAL-assessed report. The administrative basis-point bracket is selected from the report subtotal, never from the invoice total."
    roles: [ProAdministrator]
    code: 201
    input: [packaging_report_id, membership_id]
    output: Invoice
    side_effects: ["runs invoice_administrative_fee and creates the Invoice in ISSUED", "report fee_status FINAL -> INVOICED", "LEDGER SYNC: recomputes Producer.assessed_fee_balance_cents", "increments version on the report and the producer"]

  - method: GET
    path: "/epr/invoices/{id}"
    description: "Fetch one invoice with its bracket, administrative fee and total."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/epr/invoices"
    description: "List invoices; packaging_report_id and membership_id are the reverse-reachability filters."
    roles: [ProgramRegulator, ProducerComplianceOfficer, ProAdministrator]
    code: 200
    input: ["packaging_report_id?", "membership_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/epr/invoices/{id}/void"
    description: "Void an issued invoice; the compensating recompute restores Producer.assessed_fee_balance_cents to its exact pre-issue value and returns the report's fee dimension to FINAL."
    roles: [ProAdministrator]
    code: 200
    input: [void_reason]
    output: Invoice
    side_effects: ["status -> VOID with void_reason", "report fee_status INVOICED -> FINAL", "COMPENSATION: recomputes Producer.assessed_fee_balance_cents", "increments version on the invoice, the report and the producer"]

  # --- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/epr/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window and correction check reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Setting the clock alone mutates no business row and recomputes no compliance posture."
    roles: [ProgramRegulator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock; no business entity is mutated and no version is incremented"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the four declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a ProducerComplianceOfficer acts on a resource whose producer_id differs from X-User-ID, or a ProAdministrator acts on a resource whose pro_id differs from X-User-ID"
  - id: ERR_NOT_ASSIGNED_VERIFIER
    http: 403
    condition: "an IndependentVerifier acts on an engagement whose verifier_user_id differs from X-User-ID"

  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong JSON type, enum value out of range, negative quantity, unparseable ISO-8601 instant, pagination limit outside [1,100] or negative offset"

  # --- existence -----------------------------------------------------------
  - id: ERR_PRODUCER_NOT_FOUND
    http: 404
    condition: "producer id in the path or body matches no Producer"
  - id: ERR_SKU_NOT_FOUND
    http: 404
    condition: "sku id in the path or body matches no Sku"
  - id: ERR_STATE_PROGRAM_NOT_FOUND
    http: 404
    condition: "state_program_id in the path or body matches no StateProgram"
  - id: ERR_REPORTING_PERIOD_NOT_FOUND
    http: 404
    condition: "reporting_period_id in the path or body matches no ReportingPeriod"
  - id: ERR_PRO_NOT_FOUND
    http: 404
    condition: "pro id in the path or body matches no Pro"
  - id: ERR_FEE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "fee_schedule_id in the path or body matches no FeeSchedule"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "registration_id in the path or body matches no Registration"
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "membership id in the path or body matches no Membership"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "report id in the path or body matches no PackagingReport"
  - id: ERR_REPORT_LINE_NOT_FOUND
    http: 404
    condition: "report line id in the path matches no ReportLine"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement id in the path matches no VerificationEngagement"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice id in the path matches no Invoice"

  # --- state ---------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's current state does not permit the requested transition and no more specific state error applies"
  - id: ERR_REGISTRATION_NOT_ACTIVE
    http: 409
    condition: "the registration reached from the request is not ACTIVE"
  - id: ERR_FEE_SCHEDULE_NOT_PUBLISHED
    http: 409
    condition: "the elected fee schedule is DRAFT or SUPERSEDED at membership create or approval"
  - id: ERR_REPORT_NOT_IN_DRAFT
    http: 409
    condition: "a line mutation is attempted on a report whose submission_status is not DRAFT"
  - id: ERR_REPORT_NOT_UNDER_VERIFICATION
    http: 409
    condition: "an engagement action is attempted while its report is not UNDER_VERIFICATION"
  - id: ERR_STALE_PRO_VERSION
    http: 412
    condition: "expected_pro_version does not equal Pro.version at fee-schedule publish"
  - id: ERR_STALE_REGISTRATION_VERSION
    http: 412
    condition: "expected_registration_version does not equal Registration.version at membership create"

  # --- business_safety -----------------------------------------------------
  - id: ERR_OBLIGATION_NOT_DETERMINED
    http: 409
    condition: "the producer is still DRAFT: determine-obligation has never run"
  - id: ERR_DETERMINATION_STALE
    http: 409
    condition: "the producer's determination_stale flag is true because revenue was restated or SKU material data changed after the last determination"
  - id: ERR_PRODUCER_NOT_OBLIGATED
    http: 422
    condition: "the producer's obligated_party_role is NOT_OBLIGATED, so it cannot register as an obligated party"
  - id: ERR_EXEMPT_REGISTRATION_CANNOT_REPORT
    http: 422
    condition: "a report is opened on a registration whose exemption_status is EXEMPT_SMALL_PRODUCER or EXEMPT_CATEGORY"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "the verifier user id equals the report's submitted_by_user_id, or the acting verifier equals the engagement's assigned_by_user_id"
  - id: ERR_VERIFIER_ROTATION_REQUIRED
    http: 422
    condition: "the named verifier issued the opinion on the registration's immediately preceding FINALIZED report"
  - id: ERR_VERIFICATION_REQUIRED
    http: 409
    condition: "a FINAL assessment or a FINALIZE close is attempted on a report with verification_required true that is not VERIFIED"

  # --- business_referential ------------------------------------------------
  - id: ERR_PERIOD_PROGRAM_MISMATCH
    http: 422
    condition: "the named reporting period belongs to a different state program than the registration"
  - id: ERR_SKU_PRODUCER_MISMATCH
    http: 422
    condition: "the named SKU belongs to a different producer than the report's registration"
  - id: ERR_FEE_SCHEDULE_PRO_MISMATCH
    http: 422
    condition: "the elected fee schedule belongs to a different PRO than the one named in the membership request"
  - id: ERR_FEE_SCHEDULE_PROGRAM_MISMATCH
    http: 422
    condition: "the elected fee schedule was published for a different state program than the registration"
  - id: ERR_MEMBERSHIP_REGISTRATION_MISMATCH
    http: 422
    condition: "the named membership covers a different registration than the report being invoiced"
  - id: ERR_MATERIAL_RATE_MISSING
    http: 422
    condition: "the pinned fee schedule has no material_rates row for a material type present in a priced report line"

  # --- business_constraint -------------------------------------------------
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "a live registration already exists for the same (producer, state program) pair"
  - id: ERR_DUPLICATE_REPORT_FOR_PERIOD
    http: 409
    condition: "a non-rejected report already exists for the same (registration, reporting period) pair"
  - id: ERR_DUPLICATE_REPORT_LINE
    http: 409
    condition: "a line for the same SKU already exists on this report"
  - id: ERR_PERIOD_WINDOW_OVERLAP
    http: 409
    condition: "the new period's half-open data window overlaps an existing period of the same program (touching windows are allowed)"
  - id: ERR_FEE_SCHEDULE_EFFECTIVE_OVERLAP
    http: 409
    condition: "the new schedule's closed effective window overlaps or touches an existing window of the same (PRO, state program) pair"
  - id: ERR_FEE_TIER_DISCONTINUOUS
    http: 422
    condition: "a material's tier bands do not start at 0, leave a gap, overlap, or do not end in exactly one open-ended band"
  - id: ERR_FEE_SCHEDULE_HAS_NO_RATES
    http: 422
    condition: "publish is attempted on a schedule with an empty material_rates list"
  - id: ERR_SKU_HAS_NO_COMPONENTS
    http: 422
    condition: "activate is attempted on a SKU with no ACTIVE component"
  - id: ERR_PRODUCER_HAS_NO_ACTIVE_SKUS
    http: 422
    condition: "determine-obligation is attempted on a producer with no ACTIVE SKU"
  - id: ERR_REPORT_HAS_NO_LINES
    http: 422
    condition: "submit or resubmit is attempted on a report with zero lines"
  - id: ERR_ENGAGEMENT_ALREADY_OPEN
    http: 409
    condition: "an ASSIGNED or IN_PROGRESS engagement already exists for this report"
  - id: ERR_VERIFIER_CAPACITY_EXCEEDED
    http: 409
    condition: "the verifier already holds two open engagements whose buffer-expanded fieldwork windows intersect the requested window"
  - id: ERR_REGISTRATION_HAS_OPEN_REPORTS
    http: 409
    condition: "withdraw is attempted while a report of the registration is DRAFT, SUBMITTED, UNDER_VERIFICATION or CORRECTION_REQUIRED"

  # --- business_temporal ---------------------------------------------------
  - id: ERR_INVALID_FIELDWORK_WINDOW
    http: 422
    condition: "fieldwork_end is not strictly after fieldwork_start"
  - id: ERR_REGISTRATION_DEADLINE_PASSED
    http: 422
    condition: "the state program's registration_deadline is before the logical clock at registration submit"
  - id: ERR_SUBMISSION_WINDOW_NOT_OPEN
    http: 422
    condition: "the logical clock is before ReportingPeriod.submission_open"
  - id: ERR_SUBMISSION_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is after ReportingPeriod.submission_deadline"
  - id: ERR_CORRECTION_WINDOW_EXPIRED
    http: 422
    condition: "resubmit is attempted after correction_due_at"
  - id: ERR_CORRECTION_WINDOW_OPEN
    http: 409
    condition: "a REJECT close is attempted while the report's correction window is still open"
  - id: ERR_FEE_SCHEDULE_NOT_EFFECTIVE_FOR_PERIOD
    http: 422
    condition: "the membership's pinned schedule's effective window does not cover the reporting period's data_start"

  # --- business_fiscal -----------------------------------------------------
  - id: ERR_NO_ACTIVE_MEMBERSHIP
    http: 402
    condition: "the registration has no membership in ACTIVE or PROBATION"
  - id: ERR_MEMBERSHIP_NOT_ACTIVE
    http: 409
    condition: "the membership is PENDING, REJECTED or TERMINATED where an ACTIVE or PROBATION membership is required, or is PROBATION where ACTIVE is required at report submit"
  - id: ERR_MEMBERSHIP_FEE_AMOUNT_MISMATCH
    http: 422
    condition: "the recorded payment amount_cents does not equal the assessed membership_fee_cents exactly"
  - id: ERR_MEMBERSHIP_FEE_OUTSTANDING
    http: 402
    condition: "report submit is attempted while the membership's fee_payment_status is OUTSTANDING"
  - id: ERR_INVOICE_NOT_ISSUED
    http: 409
    condition: "void is attempted on an already-VOID invoice, or a FINALIZE close is attempted on a report whose fee_status is not INVOICED"
  - id: ERR_FINDINGS_NOTE_REQUIRED
    http: 422
    condition: "a QUALIFIED or ADVERSE opinion is issued without a non-empty findings_note"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramRegulator
    description: "State agency operator: owns state programs and their reporting periods, onboards producers and PROs, determines the obligated party, decides and suspends registrations, assigns verifiers and closes reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /epr/producers"
      - "POST /epr/producers/{id}/determine-obligation"
      - "POST /epr/producers/{id}/restate-revenue"
      - "POST /epr/state-programs"
      - "POST /epr/state-programs/{id}/reporting-periods"
      - "POST /epr/pros"
      - "POST /epr/registrations/{id}/decide"
      - "POST /epr/registrations/{id}/suspend"
      - "POST /epr/registrations/{id}/reinstate"
      - "POST /epr/reports/{id}/close"
      - "POST /epr/verification-engagements"
      - "POST /epr/_clock/set_current_utc"
    shared_operations:
      - "GET /epr/producers, GET /epr/producers/{id}"
      - "GET /epr/skus, GET /epr/skus/{id}"
      - "GET /epr/state-programs, GET /epr/state-programs/{id}, GET /epr/state-programs/{id}/reporting-periods, GET /epr/reporting-periods/{id}"
      - "GET /epr/pros, GET /epr/pros/{id}"
      - "GET /epr/fee-schedules, GET /epr/fee-schedules/{id}"
      - "GET /epr/registrations, GET /epr/registrations/{id}"
      - "GET /epr/memberships, GET /epr/memberships/{id}"
      - "GET /epr/reports, GET /epr/reports/{id}, GET /epr/reports/{id}/fee-breakdown"
      - "GET /epr/report-lines, GET /epr/report-lines/{id}"
      - "GET /epr/verification-engagements, GET /epr/verification-engagements/{id}"
      - "GET /epr/invoices, GET /epr/invoices/{id}"
      - "POST /epr/skus/{id}/redesign-projection"

  - name: ProducerComplianceOfficer
    description: "Acts for one obligated producer: maintains SKU packaging data, opens and submits state registrations, applies for PRO membership, files and corrects packaging reports, and models redesigns."
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /epr/skus"
      - "POST /epr/skus/{id}/components"
      - "POST /epr/skus/{id}/activate"
      - "POST /epr/skus/{id}/revise-packaging"
      - "POST /epr/registrations"
      - "POST /epr/registrations/{id}/submit"
      - "POST /epr/registrations/{id}/withdraw"
      - "POST /epr/memberships"
      - "POST /epr/reports"
      - "POST /epr/reports/{id}/lines"
      - "DELETE /epr/report-lines/{id}"
      - "POST /epr/reports/{id}/submit"
      - "POST /epr/reports/{id}/resubmit"
    shared_operations:
      - "GET /epr/producers/{id}"
      - "GET /epr/skus, GET /epr/skus/{id}"
      - "GET /epr/state-programs, GET /epr/state-programs/{id}, GET /epr/state-programs/{id}/reporting-periods, GET /epr/reporting-periods/{id}"
      - "GET /epr/pros, GET /epr/pros/{id}"
