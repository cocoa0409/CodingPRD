              captures: { trip_id: $.data.id }
            - call: "POST /network/trips/${trip_id}/dispatch"
              payload: { dispatched_at: "2026-09-01T04:00:00Z" }
              as: CapacityOwnerOperator
              as_user_id: "${bco_id}"
            - call: "POST /network/trips/${trip_id}/complete"
