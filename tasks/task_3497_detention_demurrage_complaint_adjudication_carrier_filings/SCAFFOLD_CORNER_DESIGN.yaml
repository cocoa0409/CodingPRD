  # ===========================================================================
  - section: calculations
    instances:

      - name: calendar_accrual_ceils_one_second_past_free_time_to_a_full_day
        claim_type: Correct Result
        grounds:
          - calculations.invoice_charge_amount
        distinguishing_aspect: "CALENDAR accrual rounds any partial day up: returning the container one second after free_time_end (2026-09-06T00:00:01Z) bills a full day — billable_days 1, amount 5000 — while returning exactly at free_time_end bills 0."
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED tariff (free 2 days, 5000/day); shipper; clock 2026-09-10T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-CEIL-1", charge_basis: "TARIFF", tariff_id: "${t_id}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU9100001", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-06T00:00:01Z", last_accrual_date: "2026-09-06T00:00:01Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_ceil: $.data.id }
          assert:
            - "DemurrageDetentionInvoice.${inv_ceil}.billable_days == 1 and amount_cents == 5000 (delta of 1 second over free_time_end ceils to one full day)"

      - name: working_day_accrual_charges_zero_over_a_weekend_only_window
        claim_type: Correct Result
        grounds:
          - calculations.invoice_charge_amount
        distinguishing_aspect: "WORKING_DAY accrual counts only Monday–Friday dates strictly after date(free_time_end): a free_time_end of Friday 2026-09-04 with return Saturday 2026-09-05 bills 0 days (amount 0), while the same window under the CALENDAR tariff bills 1 day (5000) — the variants diverge even below the one-day line."
        test_recipe:
          setup:
            - "VOCC carrier with TWO published tariffs: DD-COR-1 (CALENDAR) and DD-WD-2 (WORKING_DAY), both free 2 days at 5000/day; shipper; clock 2026-09-10T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - call: "GET /fmc/carriers/${carrier_id}"
              payload: {}
              as: CommissionDocket
              captures: { carrier_v2: $.data.version }
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
