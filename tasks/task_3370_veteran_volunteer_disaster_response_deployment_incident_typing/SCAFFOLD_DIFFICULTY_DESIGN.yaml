# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Veteran Volunteer Disaster Response Deployment & Incident Typing
# 9 rules x 2 instances = 18 instances; every recipe drives empty-DB -> state
# using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: stipend_provisional_vs_final_divergence
        grounds:
          - calculations.deployment_stipend_cents
          - state_machines.Deployment.OFFERED_to_ACCEPTED
          - state_machines.Deployment.ON_SITE_to_DEMOBED
        distinguishing_aspect: |
          Deployment-domain dual variant: identical deployment inputs yield
          stipend_provisional_cents (forward-looking, days = operation.duration_days = 4
          -> 4*6500 + 15000 = 41000) and stipend_final_cents (chronological, actual
          days = ceil(57h/24) = 3 -> 3*6500 + 15000 = 34500); the two variants differ.
        test_recipe:
          setup:
            - "Volunteer Ada Voss DEPLOYABLE with one VERIFIED CHAINSAW cert (expires 2027-03-01) and availability window 2026-09-05..2026-09-30"
            - "Incident TYPED; Operation OPEN with duration_days=4, team_size_required=2, required_capabilities=[CHAINSAW]"
            - "Deployment d1 offered (window 2026-09-10T08:00Z..2026-09-14T08:00Z, needs_lodging=false), ACCEPTED, checked in at 2026-09-10T08:00Z"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Ada Voss", email: "ada@x.org", home_region: "TX-GULF", skills: [CHAINSAW], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Hurricane Helena", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/operations"
              payload: { title: "Helena Tree Ops", hazard_focus: TREE_REMOVAL, team_size_required: 2, duration_days: 4, required_capabilities: [CHAINSAW], start_date: "2026-09-10" }
              as: IncidentCommander
              captures: { op1: $.data.id }
            - call: "PATCH /vdr/operations/${op1}"
              payload: { status: OPEN }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/deployments"
              payload: { volunteer_id: "${v1}", travel_mode: SELF, planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-14T08:00:00Z", needs_lodging: false }
              as: OperationsLead
              captures: { d1: $.data.id }
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ACCEPTED }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: SystemAdmin
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ON_SITE }
              as: OperationsLead
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T17:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: DEMOBED }
              as: OperationsLead
          assert:
            - "Deployment.${d1}.stipend_provisional_cents == 41000"
            - "Deployment.${d1}.stipend_final_cents == 34500"
            - "Deployment.${d1}.stipend_provisional_cents != Deployment.${d1}.stipend_final_cents"
            - "Deployment.${d1}.status == DEMOBED"

      - name: readiness_operational_vs_wellness_adjusted
        grounds:
          - calculations.volunteer_readiness_score
          - entities.Volunteer.fields.operational_readiness_score
          - entities.Volunteer.fields.readiness_score
        distinguishing_aspect: |
          Volunteer-domain dual variant (different entity domain than the stipend
          instance): with VERIFIED CHAINSAW(30) + STRUCTURAL(25) certs and base 10,
          operational_readiness_score = 65; wellness-adjusted readiness_score =
          max(0, 65 - 10 fatigue * 2) = 45 for identical cert data.
        test_recipe:
          setup:
            - "Volunteer Bo Karr DEPLOYABLE with VERIFIED CHAINSAW and STRUCTURAL certs"
            - "Incident TYPED; Operation OPEN (caps [CHAINSAW]); deployment ACCEPTED and ON_SITE at 2026-09-10T08:00Z"
            - "One OPERATIONS duty shift 2026-09-10T08:00Z..18:00Z (10 hours) scheduled"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Bo Karr", email: "bo@x.org", home_region: "TX-GULF", skills: [CHAINSAW, STRUCTURAL], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: STRUCTURAL, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c2: $.data.id }
            - call: "PATCH /vdr/certifications/${c2}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Hurricane Helena", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/operations"
              payload: { title: "Helena Tree Ops", hazard_focus: TREE_REMOVAL, team_size_required: 2, duration_days: 4, required_capabilities: [CHAINSAW], start_date: "2026-09-10" }
              as: IncidentCommander
              captures: { op1: $.data.id }
            - call: "PATCH /vdr/operations/${op1}"
              payload: { status: OPEN }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/deployments"
              payload: { volunteer_id: "${v1}", travel_mode: SELF, planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-14T08:00:00Z", needs_lodging: false }
              as: OperationsLead
              captures: { d1: $.data.id }
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ACCEPTED }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: SystemAdmin
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ON_SITE }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/duty-shifts"
              payload: { deployment_id: "${d1}", kind: OPERATIONS, starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T18:00:00Z" }
              as: OperationsLead
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T19:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /vdr/_ops/run"
              payload: {}
              as: SystemAdmin
          assert:
            - "Volunteer.${v1}.operational_readiness_score == 65"
            - "Volunteer.${v1}.readiness_score == 45"
            - "Volunteer.${v1}.fatigue_hours == 10"
            - "Volunteer.${v1}.readiness_score != Volunteer.${v1}.operational_readiness_score"

  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_conditional_cap_math
        grounds:
          - calculations.work_order_priority_score
          - state_machines.WorkOrder.INTAKE_to_TRIAGED
        distinguishing_aspect: |
          Mode (a) >= 3 inputs with non-linear interaction: TREE_REMOVAL base 50 +
          conditional vulnerable bonus 40 + age boost min(20, floor(48/24)*5)=10, all
          under the outer min(100, ...) cap — vulnerable order hits both caps
          (50+40+10=100 -> P1) while the non-vulnerable twin (50+0+10=60 -> P2) shows
          the branch and tier band divergence at identical wait time.
        test_recipe:
          setup:
            - "Incident ASSESSED at default clock 2026-09-01T00:00:00Z"
            - "wo_vuln: TREE_REMOVAL, vulnerable_resident=true, created at 2026-09-01T00:00:00Z (version 1)"
            - "wo_plain: TREE_REMOVAL, vulnerable_resident=false, created at 2026-09-01T00:00:00Z (version 1)"
            - "Logical clock advanced to 2026-09-03T00:00:00Z (exactly 48h wait)"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/incidents"
              payload: { name: "Hurricane Helena", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/work-orders"
              payload: { requester_name: "Elderly Homeowner", hazard_kind: TREE_REMOVAL, vulnerable_resident: true, municipality_sourced: false }
              as: IntakeCoordinator
              captures: { wo_vuln: $.data.id, wo_vuln_v: $.data.version }
            - call: "POST /vdr/incidents/${i1}/work-orders"
              payload: { requester_name: "Fit Homeowner", hazard_kind: TREE_REMOVAL, vulnerable_resident: false, municipality_sourced: false }
              as: IntakeCoordinator
              captures: { wo_plain: $.data.id, wo_plain_v: $.data.version }
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /vdr/work-orders/${wo_vuln}/triage"
              payload: { expected_work_order_version: "${wo_vuln_v}" }
              as: IntakeCoordinator
            - call: "POST /vdr/work-orders/${wo_plain}/triage"
              payload: { expected_work_order_version: "${wo_plain_v}" }
              as: IntakeCoordinator
          assert:
            - "WorkOrder.${wo_vuln}.priority_score == 100"
            - "WorkOrder.${wo_vuln}.priority_tier == P1"
            - "WorkOrder.${wo_plain}.priority_score == 60"
            - "WorkOrder.${wo_plain}.priority_tier == P2"
            - "WorkOrder.${wo_vuln}.status == TRIAGED and WorkOrder.${wo_plain}.status == TRIAGED"

      - name: lodging_per_night_rounding_order_pinned
        grounds:
          - calculations.fob_lodging_cost_cents
          - entities.FobSite.fields.lodging_cost_cents
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order (different mode than the
          priority-score instance): nightly_rate 1235 with 7% surcharge rounds PER
          NIGHT to 1321 and sums 3 nights to 3963; the forbidden sum-then-round
          order yields 3964, so the fixture separates the two orders by exactly
          one cent.
        test_recipe:
          setup:
            - "Volunteer DEPLOYABLE with VERIFIED CHAINSAW cert; incident TYPED; operation OPEN (caps [CHAINSAW])"
            - "FobSite under the operation: bunks_total=2, nightly_rate_cents=1235"
            - "Deployment d1 (needs_lodging=true) ACCEPTED, checked in 2026-09-10T08:00:00Z, bunk occupied"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Ada Voss", email: "ada@x.org", home_region: "TX-GULF", skills: [CHAINSAW], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Hurricane Helena", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/operations"
              payload: { title: "Helena Tree Ops", hazard_focus: TREE_REMOVAL, team_size_required: 2, duration_days: 4, required_capabilities: [CHAINSAW], start_date: "2026-09-10" }
              as: IncidentCommander
              captures: { op1: $.data.id }
            - call: "PATCH /vdr/operations/${op1}"
              payload: { status: OPEN }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/fob-sites"
              payload: { name: "FOB Alpha", bunks_total: 2, nightly_rate_cents: 1235 }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/deployments"
              payload: { volunteer_id: "${v1}", travel_mode: SELF, planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-14T08:00:00Z", needs_lodging: true }
              as: OperationsLead
              captures: { d1: $.data.id }
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ACCEPTED }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: SystemAdmin
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ON_SITE }
              as: OperationsLead
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T09:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: DEMOBED }
              as: OperationsLead
          assert:
            - "FobSite of operation ${op1}.lodging_cost_cents == 3963"
            - "FobSite of operation ${op1}.lodging_cost_cents != 3964"
            - "FobSite of operation ${op1}.bunks_occupied == 0"
            - "Deployment.${d1}.status == DEMOBED"

  - rule_id: non_linear_state_machine
    instances:
      - name: certification_expiry_renewal_cycle
        grounds:
          - state_machines.Certification.VERIFIED_to_EXPIRED
          - state_machines.Certification.EXPIRED_to_VERIFIED
          - state_machines.Volunteer.DEPLOYABLE_to_VETTED
        distinguishing_aspect: |
          Cyclic machine on Certification (VERIFIED -> EXPIRED -> VERIFIED), driven by
          the logical clock: at current_utc exactly == expires_at the cert survives the
          sweep, one second later it expires; renewal closes the loop with
          renewal_count == 1. Also exercises the Volunteer auto-downgrade side effect
          (DEPLOYABLE -> VETTED when the last VERIFIED cert expires).
        test_recipe:
          setup:
            - "Volunteer Cy Daly DEPLOYABLE with a single VERIFIED CHAINSAW cert expiring 2026-09-05T00:00:00Z"
            - "Logical clock advanced to 2026-09-06T00:00:00Z (strictly past expiry)"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Cy Daly", email: "cy@x.org", home_region: "TX-GULF", skills: [CHAINSAW] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2026-09-05T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/_ops/run"
              payload: {}
              as: SystemAdmin
          trigger:
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED, expires_at: "2027-01-01T00:00:00Z" }
              as: SafetyOfficer
          assert:
            - "Before renewal: Certification.${c1}.status == EXPIRED"
            - "Before renewal: Volunteer.${v1}.readiness_status == VETTED (auto-downgraded)"
            - "After renewal: Certification.${c1}.status == VERIFIED"
            - "Certification.${c1}.renewal_count == 1"
            - "Certification.${c1}.expires_at == 2027-01-01T00:00:00Z"

      - name: work_order_block_unblock_cycle
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_BLOCKED
          - state_machines.WorkOrder.BLOCKED_to_SCHEDULED
          - state_machines.WorkOrder.SCHEDULED_to_IN_PROGRESS
        distinguishing_aspect: |
          Cyclic machine on WorkOrder (different entity than Certification):
          IN_PROGRESS -> BLOCKED -> SCHEDULED -> IN_PROGRESS loop with
          blocked_reason set on block and cleared on unblock, demonstrating the
          revision loop rather than a linear pipeline.
        test_recipe:
          setup:
            - "Incident TYPED; Operation ACTIVE (caps [CHAINSAW, MEDICAL], hazard TREE_REMOVAL, team 2) with v1 CHAINSAW ON_SITE and v2 MEDICAL ACCEPTED"
            - "Work order wo1 (TREE_REMOVAL) TRIAGED then SCHEDULED to the operation then IN_PROGRESS"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Ada Voss", email: "ada@x.org", home_region: "TX-GULF", skills: [CHAINSAW], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Bo Karr", email: "bo@x.org", home_region: "TX-GULF", skills: [MEDICAL], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v2: $.data.id }
            - call: "POST /vdr/volunteers/${v2}/certifications"
              payload: { kind: MEDICAL, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c2: $.data.id }
            - call: "PATCH /vdr/certifications/${c2}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v2}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v2}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Hurricane Helena", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/operations"
