  # =======================================================================
  # Cross-Cutting Complexity Layers
  # =======================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_series_version_on_generate
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[series-generate-stale-series]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential generate calls: the first advances series.version; the second carrying the pre-generate version (${se_v} - 1 after one bump) is rejected ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["A WEEKLY series; one generate already done so the next stale generate must fail."]
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
