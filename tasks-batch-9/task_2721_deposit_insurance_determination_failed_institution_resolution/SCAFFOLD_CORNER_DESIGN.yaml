              as: ClaimsAgent
              as_user_id: "U-AGENT-S"
            - call: "POST /insurance-determinations/${pc_det_id}/submit-review"
              as: ClaimsAgent
              as_user_id: "U-AGENT-S"
            - call: "POST /insurance-determinations/${pc_det_id}/certify"
