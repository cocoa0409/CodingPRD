            - "RedemptionVisit.${visit_id}.count_status == OPEN"
            - "RedemptionVisit.${visit_id}.presented_total == 0"
            - "GET /redemption-visits/${visit_id}/lots returns total_count 0"

      - name: bag_drop_credit_rejected_when_account_flagged
        grounds:
          - validations[priority=21]
          - errors[ERR_ACCOUNT_FLAGGED]
          - state_machines.RedeemerAccount.ACTIVE_to_FLAGGED
          - state_machines.BagDrop.COUNTED_to_CREDITED
        distinguishing_aspect: |
          A BagDrop in status COUNTED can only be CREDITED while its RedeemerAccount is ACTIVE:
          after a manual FLAG the settlement returns ERR_ACCOUNT_FLAGGED (409), the bag stays
          COUNTED and credit_balance_cents stays at the provisional 1200 — here the governing
          entity is the account and the governed transition belongs to BagDrop, the mirror image
          of the label-governs-lot dependency.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; OPEN ProgramPeriod 2026Q3; OPERATIONAL center"
            - "Bag-drop-enrolled account with a DROPPED bag of declared_count 150, provisional credit 1200 posted"
            - "The bag has been counted at exactly 150 containers, so status is COUNTED with variance_pct 0 and no fraud strike"
            - "The account has then been moved to FLAGGED by a program action"
          setup_api_calls:
