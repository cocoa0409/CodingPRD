scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_chargeback_grace_vs_standard_on_chargeback_money
        grounds:
          - calculations.chargeback_assessment
          - entities.Chargeback.fields.assessment_variant
          - entities.Chargeback.fields.gross_assessed_cents
          - state_machines.ComplianceViolation.EVIDENCE_COMPLETE_to_CHARGED
        distinguishing_aspect: |
          Dual-variant logic on the MONETARY domain (Chargeback amounts): identical violation data
          (same TIER_2 requirement, affected_units 400, invoice_value_cents 500000) yields
          gross_assessed_cents 20000 under GRACE_FIRST_OCCURRENCE and 45000 under STANDARD,
          a 25000-cent delta, because GRACE zeroes cost_recovery_cents AND skips the min_fee floor.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "Vendor V-1001 registered, ACTIVE, all exposure counters zero."
            - "RoutingGuide RG-2026-A (scope ALL, effective_from 2026-08-05) PUBLISHED with one TIER_2 requirement PKG-02 (fixed_fee 20000, per_unit 25, handling 3.00, min_fee 45000, cap 400000, min_evidence_count 1)."
            - "Two purchase orders of 1000 units at 500 cents each, each with one shipment fully received on 2026-08-10, so each Shipment.invoice_value_cents == 500000."
            - "The first PKG-02 violation has already been assessed, making the second one a repeat occurrence inside GRACE_LOOKBACK_DAYS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-1001", legal_name: "Acme Supply Co", payment_terms_days: 60 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v1_id: $.data.id }
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-2026-A", title: "Domestic Routing Guide 2026-A", scope_code: "ALL", effective_from: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g1_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g1_id}/requirements"
              payload: { requirement_code: "PKG-02", domain: "PACKAGING", severity_tier: "TIER_2", min_evidence_count: 1, fixed_fee_cents: 20000, per_unit_recovery_cents: 25, handling_pct: 3.00, min_fee_cents: 45000, cap_cents: 400000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r_pkg_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v1_id}", po_number: "PO-1", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { po1_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po1_id}/shipments"
              payload: { asn_number: "ASN-1", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /compliance/shipments/${s1_id}/receive"
              payload: { received_units: 1000 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/shipments/${s1_id}/violations"
              payload: { requirement_id: "${r_pkg_id}", affected_units: 400, affected_cartons: 16, narrative: "Master cartons crushed; inner packs unprotected." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { vio1_id: $.data.id }
            - call: "POST /compliance/violations/${vio1_id}/evidence"
              payload: { kind: "PHOTO", reference_uri: "s3://evidence/pkg-02/asn-1-a.jpg" }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/violations/${vio1_id}/assess"
              payload: { assessment_note: "First PKG-02 occurrence for this vendor." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cb1_id: $.data.id }
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v1_id}", po_number: "PO-2", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { po2_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po2_id}/shipments"
              payload: { asn_number: "ASN-2", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v1_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /compliance/shipments/${s2_id}/receive"
              payload: { received_units: 1000 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/shipments/${s2_id}/violations"
              payload: { requirement_id: "${r_pkg_id}", affected_units: 400, affected_cartons: 16, narrative: "Master cartons crushed again on the follow-up load." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { vio2_id: $.data.id }
            - call: "POST /compliance/violations/${vio2_id}/evidence"
              payload: { kind: "PHOTO", reference_uri: "s3://evidence/pkg-02/asn-2-a.jpg" }
              as: DCInspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /compliance/violations/${vio2_id}/assess"
              payload: { assessment_note: "Repeat PKG-02 inside the 180-day grace lookback." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cb2_id: $.data.id }
          assert:
            - "Chargeback.${cb1_id}.assessment_variant == GRACE_FIRST_OCCURRENCE"
            - "Chargeback.${cb1_id}.fixed_fee_cents == 20000"
            - "Chargeback.${cb1_id}.cost_recovery_cents == 0"
            - "Chargeback.${cb1_id}.gross_assessed_cents == 20000"
            - "Chargeback.${cb2_id}.assessment_variant == STANDARD"
            - "Chargeback.${cb2_id}.fixed_fee_cents == 20000"
            - "Chargeback.${cb2_id}.cost_recovery_cents == 15000"
            - "Chargeback.${cb2_id}.gross_assessed_cents == 45000"
            - "Chargeback.${cb2_id}.outstanding_cents == 45000"
            - "Vendor.${v1_id}.open_chargeback_cents == 65000"
            - "Vendor.${v1_id}.exposure_alert_flag == false"

      - name: dual_variant_otif_order_weighted_vs_unit_weighted_on_vendor_performance
        grounds:
          - calculations.otif_scorecard_measurement
          - entities.Scorecard.fields.fill_rate_pct
          - entities.Scorecard.fields.composite_score
          - state_machines.Scorecard.MEASURED_to_MEASURED
        distinguishing_aspect: |
          Dual-variant logic on the PERFORMANCE domain (Scorecard percentages), a different entity
          domain from the monetary Chargeback instance: the same two purchase orders (100 units with
          90 received, 1000 units with 995 received) yield fill_rate_pct 94.75 / composite_score 67.90
          under ORDER_WEIGHTED and fill_rate_pct 98.64 / composite_score 69.46 under UNIT_WEIGHTED,
          while measured_po_count, on_time_count, in_full_count and otif_count stay variant-invariant.
        test_recipe:
          setup:
            - "Vendor V-2002 registered, no chargebacks at all, so repeat_offender_flag stays false and cap_required stays false."
            - "PO-A: 100 units, must_arrive_by 2026-08-05, first receipt of 90 units exactly on 2026-08-05 (on time, po_fill_pct 90.00)."
            - "PO-B: 1000 units, must_arrive_by 2026-08-06, first receipt of 995 units exactly on 2026-08-06 (on time, po_fill_pct 99.50)."
            - "Scorecard 2026-M08 open over the closed period 2026-08-01 .. 2026-08-31 with the default tolerances (early 2, late 0, fill 2.00) and already measured once under ORDER_WEIGHTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2002", legal_name: "Northwind Textiles", payment_terms_days: 45 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v2_id: $.data.id }
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v2_id}", po_number: "PO-A", ordered_units: 100, unit_cost_cents: 500, ship_window_start: "2026-08-02T00:00:00Z", ship_window_end: "2026-08-04T00:00:00Z", must_arrive_by: "2026-08-05T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { poa_id: $.data.id }
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v2_id}", po_number: "PO-B", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-02T00:00:00Z", ship_window_end: "2026-08-04T00:00:00Z", must_arrive_by: "2026-08-06T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { pob_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${poa_id}/shipments"
              payload: { asn_number: "ASN-A", shipped_units: 100, carton_count: 4 }
              as: Vendor
              as_user_id: "${v2_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${pob_id}/shipments"
              payload: { asn_number: "ASN-B", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v2_id}"
              captures: { sb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/shipments/${sa_id}/receive"
              payload: { received_units: 90 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/shipments/${sb_id}/receive"
              payload: { received_units: 995 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/scorecards"
              payload: { vendor_id: "${v2_id}", period_code: "2026-M08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sc_id: $.data.id }
            - call: "POST /compliance/scorecards/${sc_id}/measure"
              payload: { measurement_variant: "ORDER_WEIGHTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /compliance/scorecards/${sc_id}/measure"
              payload: { measurement_variant: "UNIT_WEIGHTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Scorecard.${sc_id}.measurement_variant == UNIT_WEIGHTED"
            - "Scorecard.${sc_id}.measured_po_count == 2"
            - "Scorecard.${sc_id}.on_time_count == 2"
            - "Scorecard.${sc_id}.in_full_count == 1"
            - "Scorecard.${sc_id}.otif_count == 1"
            - "Scorecard.${sc_id}.on_time_pct == 100.00"
            - "Scorecard.${sc_id}.otif_pct == 50.00"
            - "Scorecard.${sc_id}.fill_rate_pct == 98.64"
            - "Scorecard.${sc_id}.composite_score == 69.46"
            - "The ORDER_WEIGHTED measurement performed in setup had recorded fill_rate_pct == 94.75 and composite_score == 67.90 on the same Scorecard row, so the UNIT_WEIGHTED delta is +3.89 on fill_rate_pct and +1.56 on composite_score"
            - "Scorecard.${sc_id}.status == MEASURED"
            - "Scorecard.${sc_id}.cap_required == false"

  - rule_id: combinatorial_formula
    instances:
      - name: mode_a_nested_min_max_tier1_cap_clamps_assessment
        grounds:
          - calculations.chargeback_assessment
          - entities.RoutingRequirement.fields.cap_cents
          - entities.RoutingRequirement.fields.min_fee_cents
          - entities.Chargeback.fields.cost_recovery_cents
        distinguishing_aspect: |
          MODE (a) - four inputs (fixed_fee_cents, per_unit_recovery_cents x affected_units,
          handling_pct x invoice_value_cents, severity_tier) interacting non-linearly through a
          three-way tier branch nested inside min(max(raw, min_fee), cap): raw is 50000 but
          gross_assessed_cents is clamped to the cap 40000 while the floor 30000 is inert,
          so both nested bounds are exercised in one evaluation.
        test_recipe:
          setup:
            - "Logical clock 2026-08-10T00:00:00Z."
            - "Vendor V-1001 with PUBLISHED guide RG-2026-A carrying TIER_1 requirement LBL-01 (fixed_fee 25000, per_unit 30, handling 2.00, min_fee 30000, cap 40000, min_evidence_count 2)."
            - "One 1000-unit / 500-cent purchase order fully received, so Shipment.invoice_value_cents == 500000."
            - "A LBL-01 violation on 500 affected units with the two required evidence items already captured (status EVIDENCE_COMPLETE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-1001", legal_name: "Acme Supply Co", payment_terms_days: 60 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v1_id: $.data.id }
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-2026-A", title: "Domestic Routing Guide 2026-A", scope_code: "ALL", effective_from: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g1_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g1_id}/requirements"
              payload: { requirement_code: "LBL-01", domain: "LABELING", severity_tier: "TIER_1", min_evidence_count: 2, fixed_fee_cents: 25000, per_unit_recovery_cents: 30, handling_pct: 2.00, min_fee_cents: 30000, cap_cents: 40000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r_lbl_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v1_id}", po_number: "PO-1", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { po1_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po1_id}/shipments"
              payload: { asn_number: "ASN-1", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /compliance/shipments/${s1_id}/receive"
              payload: { received_units: 1000 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/shipments/${s1_id}/violations"
              payload: { requirement_id: "${r_lbl_id}", affected_units: 500, affected_cartons: 20, narrative: "GS1-128 carton labels missing on half the load." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { vio_id: $.data.id }
            - call: "POST /compliance/violations/${vio_id}/evidence"
              payload: { kind: "PHOTO", reference_uri: "s3://evidence/lbl-01/carton-face.jpg" }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/violations/${vio_id}/evidence"
              payload: { kind: "SCAN", reference_uri: "s3://evidence/lbl-01/scan-fail.txt" }
              as: DCInspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /compliance/violations/${vio_id}/assess"
              payload: { assessment_note: "TIER_1 labeling failure; cap applies." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cb_id: $.data.id }
          assert:
            - "Chargeback.${cb_id}.fixed_fee_cents == 25000"
            - "Chargeback.${cb_id}.cost_recovery_cents == 25000"
            - "Chargeback.${cb_id}.gross_assessed_cents == 40000"
            - "Chargeback.${cb_id}.outstanding_cents == 40000"
            - "Chargeback.${cb_id}.assessment_variant == STANDARD"
            - "Vendor.${v1_id}.open_chargeback_cents == 40000"

      - name: mode_b_fill_rate_round_then_average_versus_sum_then_round
        grounds:
          - calculations.otif_scorecard_measurement
          - entities.Scorecard.fields.fill_rate_pct
          - state_machines.Scorecard.MEASURED_to_MEASURED
        distinguishing_aspect: |
          MODE (b) - nested rounding where the ORDER matters, a different mode from the mode (a)
          instance: with three ragged orders (3/2, 7/5, 6/1 units) round-then-average yields
          fill_rate_pct 51.59 while sum-then-round yields 50.00, a 1.59-point divergence that only
          exists because ORDER_WEIGHTED rounds each po_fill_pct to 2 decimals BEFORE averaging.
        test_recipe:
          setup:
            - "Vendor V-3003 with no chargebacks."
            - "Three purchase orders, all received on time inside the period and all well below the fill tolerance: PO-R1 3 ordered / 2 received (66.67%), PO-R2 7 ordered / 5 received (71.43%), PO-R3 6 ordered / 1 received (16.67%)."
            - "Scorecard 2026-M08 measured once under UNIT_WEIGHTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-3003", legal_name: "Ragged Lot Trading", payment_terms_days: 30 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v3_id: $.data.id }
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v3_id}", po_number: "PO-R1", ordered_units: 3, unit_cost_cents: 1000, ship_window_start: "2026-08-02T00:00:00Z", ship_window_end: "2026-08-04T00:00:00Z", must_arrive_by: "2026-08-05T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { por1_id: $.data.id }
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v3_id}", po_number: "PO-R2", ordered_units: 7, unit_cost_cents: 1000, ship_window_start: "2026-08-02T00:00:00Z", ship_window_end: "2026-08-04T00:00:00Z", must_arrive_by: "2026-08-05T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { por2_id: $.data.id }
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v3_id}", po_number: "PO-R3", ordered_units: 6, unit_cost_cents: 1000, ship_window_start: "2026-08-02T00:00:00Z", ship_window_end: "2026-08-04T00:00:00Z", must_arrive_by: "2026-08-05T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { por3_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${por1_id}/shipments"
              payload: { asn_number: "ASN-R1", shipped_units: 3, carton_count: 1 }
              as: Vendor
              as_user_id: "${v3_id}"
              captures: { sr1_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${por2_id}/shipments"
              payload: { asn_number: "ASN-R2", shipped_units: 7, carton_count: 1 }
              as: Vendor
              as_user_id: "${v3_id}"
              captures: { sr2_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${por3_id}/shipments"
              payload: { asn_number: "ASN-R3", shipped_units: 6, carton_count: 1 }
              as: Vendor
              as_user_id: "${v3_id}"
              captures: { sr3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/shipments/${sr1_id}/receive"
              payload: { received_units: 2 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/shipments/${sr2_id}/receive"
              payload: { received_units: 5 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/shipments/${sr3_id}/receive"
              payload: { received_units: 1 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/scorecards"
              payload: { vendor_id: "${v3_id}", period_code: "2026-M08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sc3_id: $.data.id }
            - call: "POST /compliance/scorecards/${sc3_id}/measure"
              payload: { measurement_variant: "UNIT_WEIGHTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /compliance/scorecards/${sc3_id}/measure"
              payload: { measurement_variant: "ORDER_WEIGHTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Scorecard.${sc3_id}.measured_po_count == 3"
            - "Scorecard.${sc3_id}.on_time_count == 3"
            - "Scorecard.${sc3_id}.in_full_count == 0"
            - "Scorecard.${sc3_id}.otif_count == 0"
            - "Scorecard.${sc3_id}.otif_pct == 0.00"
            - "Scorecard.${sc3_id}.fill_rate_pct == 51.59"
            - "Scorecard.${sc3_id}.composite_score == 20.64"
            - "The UNIT_WEIGHTED measurement performed in setup had recorded fill_rate_pct == 50.00 and composite_score == 20.00 on the same Scorecard row"

