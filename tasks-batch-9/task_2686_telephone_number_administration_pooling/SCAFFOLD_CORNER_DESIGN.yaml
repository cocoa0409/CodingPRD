            - "A second attempt with request_type INITIAL and the same expected_rate_center_version ${rc_v} is accepted with HTTP 201, proving the rule is conditional on request_type"

      - name: comment_filed_inside_the_open_window_is_accepted
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=21]", "endpoints[POST /numbering/relief-plans/{plan_id}/comments]"]
        distinguishing_aspect: "At 2026-08-11T00:00:00Z the clock is after comment_window_open_at and strictly before comment_window_close_at, so the comment is stored with HTTP 201 and the plan's weights stay at 0.00 until CLOSE_AND_RECOMMEND runs the tally."
        test_recipe:
          setup: ["NPA 614 was declared in jeopardy and its ReliefPlan opened a 30-day window at 2026-08-01T00:00:00Z, closing 2026-08-31T00:00:00Z. The clock has advanced ten days to 2026-08-11T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/npas/${npa_id}/jeopardy-declarations"
              payload: { reason: "Exhaust projected inside four quarters" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas/${npa_id}/relief-plans"
              payload: { planned_relief_type: "UNDETERMINED", comment_window_days: 30 }
              as: NumberingAdministrator
              captures: { plan_id: "$.data.id" }
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "OPEN_COMMENT" }
              as: NumberingAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/relief-plans/${plan_id}/comments"
