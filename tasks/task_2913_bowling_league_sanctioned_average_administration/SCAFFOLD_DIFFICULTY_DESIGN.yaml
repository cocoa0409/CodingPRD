              payload: { total_weeks: 2, matches: [ { week_number: 1, home_team_id: "${t1_id}", away_team_id: "${t2_id}", lane_pair_id: "${lp1_id}", starts_at: "2026-08-12T01:00:00Z", ends_at: "2026-08-12T03:00:00Z" }, { week_number: 2, home_team_id: "${t2_id}", away_team_id: "${t1_id}", lane_pair_id: "${lp1_id}", starts_at: "2026-08-12T03:00:00Z", ends_at: "2026-08-12T05:00:00Z" } ] }
