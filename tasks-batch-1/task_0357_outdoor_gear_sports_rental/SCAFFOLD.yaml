# =============================================================================
# Scaffold: Outdoor Gear & Sports Rental (kayak / ski / SUP)
# Difficulty target: Expert
# =============================================================================

scenario: |
  357. Outdoor Gear & Sports Rental (kayak/ski/SUP): equipment inventory & size,
  hourly/daily/seasonal rate, reservation & pickup/return window, deposit & damage
  waiver, condition check-out/in, late & loss fee, package/lesson add-on, seasonal
  demand pricing

domain_name: outdoor-gear-rental
api_prefix: /rental

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; reservations/units/customers reference
  # each other by id with no nested URL ownership chain.

  state_machine_shape: parallel
  # Reservation carries two independent dimensions (lifecycle_status x payment_status);
  # GearUnit carries a cyclic condition/availability machine.

  relationship_patterns:
    - one_to_many        # RateCard -> GearUnit; GearType -> GearUnit; Customer -> Reservation
    - many_to_many       # Reservation <-> AddOn via ReservationAddOn junction
    - cross_aggregate    # Reservation references GearUnit, Customer, RateCard across boundaries

  role_model: peer_roles
  # Renter owns own reservations; RentalAgent operates the counter (checkout/checkin);
  # ShopAdmin manages catalog (gear types, rate cards, seasons, add-ons) and clock.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: GearType
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: category, type: enum, source: input, description: "KAYAK | SKI | SUP | SNOWBOARD" }
      - { name: name, type: string, source: input, description: "Human-readable model name" }
      - { name: size_label, type: string, source: input, description: "Size descriptor, e.g. '170cm' or 'L'" }
      - { name: requires_lesson_for_beginner, type: boolean, source: input, default: false, description: "If true, a beginner Renter must include a LESSON add-on to confirm" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether new units may be created under this type" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gear_type_id, type: string, source: input, description: "FK -> GearType.id; rate card applies to this gear type" }
      - { name: hourly_cents, type: integer, source: input, description: "Base hourly rate in cents", constraints: ">= 0" }
      - { name: daily_cents, type: integer, source: input, description: "Base daily rate in cents (cap for a 24h block)", constraints: ">= 0" }
      - { name: seasonal_flat_cents, type: integer, source: input, description: "Base flat seasonal-rental rate in cents for the whole window", constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Refundable security deposit in cents", constraints: ">= 0" }
      - { name: damage_waiver_cents_per_day, type: integer, source: input, description: "Optional damage-waiver fee per rental day in cents", constraints: ">= 0" }
      - { name: late_fee_cents_per_hour, type: integer, source: input, description: "Late fee per started hour beyond grace, in cents", constraints: ">= 0" }
      - { name: loss_fee_cents, type: integer, source: input, description: "Full replacement (loss) fee in cents", constraints: ">= 0" }
      - { name: grace_minutes, type: integer, source: input, default: 15, description: "Grace period after due time before late fees accrue" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether quotes may use this rate card" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: SeasonWindow
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: category, type: enum, source: input, description: "KAYAK | SKI | SUP | SNOWBOARD — season applies to this category" }
      - { name: label, type: string, source: input, description: "Season label, e.g. 'Peak Winter'" }
      - { name: starts_on, type: datetime, source: input, description: "Inclusive UTC start of the demand season (date-time)" }
      - { name: ends_on, type: datetime, source: input, description: "Exclusive UTC end of the demand season (date-time); half-open [starts_on, ends_on)" }
      - { name: demand_multiplier_bp, type: integer, source: input, description: "Demand multiplier in basis points applied to base rate, e.g. 12000 = x1.2", constraints: ">= 1" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as Renter" }
      - { name: full_name, type: string, source: input, description: "Renter full name" }
      - { name: email, type: string, source: input, description: "Renter email (unique)" }
      - { name: skill_level, type: enum, source: input, default: BEGINNER, description: "BEGINNER | INTERMEDIATE | EXPERT" }
      - { name: standing, type: enum, source: computed, description: "GOOD | WATCH | SUSPENDED — derived from strike_points" }
      - { name: strike_points, type: integer, source: computed, description: "Accumulated points from late returns and damage; never negative" }
      - { name: open_loss_balance_cents, type: integer, source: computed, description: "Sum of unsettled loss-fee LedgerEntry amounts owed by this customer" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: kind, type: enum, source: input, description: "LESSON | PACKAGE" }
      - { name: category, type: enum, source: input, description: "KAYAK | SKI | SUP | SNOWBOARD — gear category this add-on attaches to" }
      - { name: name, type: string, source: input, description: "Add-on display name" }
      - { name: price_cents, type: integer, source: input, description: "Flat price in cents for this add-on", constraints: ">= 0" }
      - { name: capacity_per_slot, type: integer, source: input, default: 1, description: "Max concurrent LESSON bookings sharing the same instructor slot; PACKAGE ignores this", constraints: ">= 1" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the add-on can be attached to new reservations" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: GearUnit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; OCC parent for Reservation creation" }
      - { name: gear_type_id, type: string, source: input, description: "FK -> GearType.id; the model this physical unit is" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; pricing applied to rentals of this unit" }
      - { name: asset_tag, type: string, source: input, description: "Physical asset tag (unique)" }
      - { name: condition, type: enum, source: computed, description: "GOOD | WORN | DAMAGED — set by inspection/check-in cascades" }
      - { name: availability, type: enum, source: system, description: "AVAILABLE | RESERVED | CHECKED_OUT | INSPECTING | MAINTENANCE | RETIRED" }
      - { name: active_reservation_id, type: string, source: computed, description: "Denormalized back-pointer to the Reservation.id currently holding/using this unit (not a structural FK); null when AVAILABLE/MAINTENANCE/RETIRED. Discover the reservation via GET /rental/reservations?gear_unit_id=." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation; OCC token for reservation creation" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the renter" }
      - { name: gear_unit_id, type: string, source: input, description: "FK -> GearUnit.id; the reserved physical unit" }
      - { name: rate_card_id, type: string, source: computed, description: "Snapshot of the unit's RateCard.id captured at reservation time (denormalized snapshot, not a structural FK); the structural link is via gear_unit_id -> GearUnit.rate_card_id" }
      - { name: pickup_at, type: datetime, source: input, description: "Requested pickup time (inclusive window start)" }
      - { name: due_at, type: datetime, source: input, description: "Requested return time (exclusive window end); half-open [pickup_at, due_at)" }
      - { name: picked_up_at, type: datetime, source: system, description: "Actual checkout timestamp, null until PICKED_UP" }
      - { name: returned_at, type: datetime, source: system, description: "Actual check-in timestamp, null until RETURNED" }
      - { name: lifecycle_status, type: enum, source: system, description: "QUOTED | CONFIRMED | PICKED_UP | RETURNED | CLOSED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | DEPOSIT_HELD | SETTLED | REFUNDED — independent of lifecycle_status" }
      - { name: quoted_rate_basis, type: enum, source: computed, description: "HOURLY | DAILY | SEASONAL — cheapest tier chosen at quote time" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional grand total at quote time (rental + waiver + add-ons), forward-looking" }
      - { name: deposit_cents, type: integer, source: computed, description: "Deposit snapshotted from rate card at confirm" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final settled total at check-in (actual usage + late + loss), null until RETURNED" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Computed at check-in, 0 until RETURNED" }
      - { name: damage_waiver_opted, type: boolean, source: input, default: false, description: "Whether the renter purchased the damage waiver" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: ReservationAddOn
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the reservation this line attaches to" }
      - { name: addon_id, type: string, source: input, description: "FK -> AddOn.id; the attached add-on" }
      - { name: slot_start_at, type: datetime, source: input, description: "For LESSON: instructor slot start (inclusive); null for PACKAGE" }
      - { name: slot_end_at, type: datetime, source: input, description: "For LESSON: instructor slot end (inclusive boundary); null for PACKAGE; interval is closed [start, end]" }
      - { name: price_cents, type: integer, source: computed, description: "Snapshotted AddOn.price_cents at attach time" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: ConditionReport
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the rental this report belongs to" }
      - { name: gear_unit_id, type: string, source: system, description: "FK -> GearUnit.id; the inspected unit" }
      - { name: phase, type: enum, source: input, description: "CHECKOUT | CHECKIN" }
      - { name: condition_rating, type: enum, source: input, description: "GOOD | WORN | DAMAGED | LOST — assessor rating at this phase" }
      - { name: notes, type: string, source: input, default: "", description: "Free-text inspector notes" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: DamageAssessment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; the rental assessed" }
      - { name: checkin_report_id, type: string, source: system, description: "FK -> ConditionReport.id; the CHECKIN report that triggered this" }
      - { name: outcome, type: enum, source: computed, description: "NONE | DAMAGE | LOSS — derived from checkin rating vs checkout rating and waiver" }
      - { name: charge_cents, type: integer, source: computed, description: "Charged amount: 0 for NONE, damage delta for DAMAGE (waived if opted), loss_fee_cents for LOSS" }
      - { name: waiver_applied, type: boolean, source: computed, description: "True when damage_waiver_opted suppressed a DAMAGE charge" }
      - { name: status, type: enum, source: system, description: "ASSESSED | SETTLED | DISPUTED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the rental this entry settles" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized owner for standing computation" }
      - { name: entry_type, type: enum, source: system, description: "DEPOSIT_HOLD | DEPOSIT_REFUND | RENTAL_CHARGE | LATE_FEE | DAMAGE_FEE | LOSS_FEE" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: holds/charges positive, refunds negative" }
      - { name: settled, type: boolean, source: system, default: false, description: "Whether this entry has been settled/cleared" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; ledger replay order key" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Reservation: lifecycle dimension (parallel with payment_status) ---
  - entity: Reservation
    field: lifecycle_status
    initial_state: QUOTED
    terminal_states: [CLOSED, CANCELLED]
    note: "lifecycle_status and payment_status are independent dimensions on the same row (parallel shape)."
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /rental/reservations/{id}/confirm"
        actor: Renter
        preconditions:
          - "Customer.standing != SUSPENDED (cross-entity: Reservation -> Customer)"
          - "GearType.requires_lesson_for_beginner is false OR Customer.skill_level != BEGINNER OR reservation has at least one LESSON ReservationAddOn (business_safety)"
          - "GearUnit.availability == RESERVED for this reservation"
        side_effects:
          - "deposit_cents snapshotted from RateCard.deposit_cents"
          - "payment_status: UNPAID -> DEPOSIT_HELD"
          - "Creates LedgerEntry(entry_type=DEPOSIT_HOLD, amount_cents=+deposit_cents)"

      - from: CONFIRMED
        to: PICKED_UP
        trigger: "POST /rental/reservations/{id}/checkout"
        actor: RentalAgent
        preconditions:
          - "GearUnit.availability == RESERVED (cross-entity: Reservation -> GearUnit)"
          - "A CHECKOUT ConditionReport exists for this reservation"
          - "Current clock time >= pickup_at minus 0 (not before pickup window opens) is NOT enforced; checkout allowed any time after CONFIRMED"
        side_effects:
          - "picked_up_at = current clock"
          - "GearUnit.availability: RESERVED -> CHECKED_OUT"
          - "GearUnit.active_reservation_id = this reservation id"

      - from: PICKED_UP
        to: RETURNED
        trigger: "POST /rental/reservations/{id}/checkin"
        actor: RentalAgent
        preconditions:
          - "A CHECKIN ConditionReport exists for this reservation (created in the same checkin call)"
        side_effects:
          - "returned_at = current clock"
          - "Computes late_fee_cents (calc: late_fee)"
          - "Computes final_total_cents (calc: final_settlement)"
          - "GearUnit.availability: CHECKED_OUT -> INSPECTING"
          - "Creates DamageAssessment from the CHECKIN ConditionReport (cascade depth-1 link)"

      - from: RETURNED
        to: CLOSED
        trigger: "POST /rental/reservations/{id}/settle"
        actor: RentalAgent
        preconditions:
          - "DamageAssessment.status == ASSESSED (cross-entity: Reservation -> DamageAssessment)"
          - "GearUnit.availability == INSPECTING"
        side_effects:
          - "payment_status: DEPOSIT_HELD -> SETTLED"
          - "Creates LedgerEntry(RENTAL_CHARGE, +rental portion) and any LATE_FEE / DAMAGE_FEE entries"
          - "Releases deposit: creates LedgerEntry(DEPOSIT_REFUND, -deposit_cents) unless deposit absorbed by an open LOSS_FEE"
          - "GearUnit.availability: INSPECTING -> AVAILABLE (if condition != DAMAGED) else INSPECTING -> MAINTENANCE"
          - "GearUnit.active_reservation_id = null"

      - from: [QUOTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /rental/reservations/{id}/cancel"
        actor: "Renter or RentalAgent"
        preconditions:
          - "lifecycle_status in {QUOTED, CONFIRMED} (cannot cancel after pickup)"
        side_effects:
          - "GearUnit.availability: RESERVED -> AVAILABLE (releases the hold)"
          - "GearUnit.active_reservation_id = null"
          - "If payment_status == DEPOSIT_HELD: creates LedgerEntry(DEPOSIT_REFUND, -deposit_cents); payment_status -> REFUNDED"
          - "Compensating-invariant: net money on the reservation ledger returns to 0 (deposit conservation)"

  # --- Reservation: payment dimension (parallel) ---
  - entity: Reservation
    field: payment_status
    initial_state: UNPAID
    terminal_states: [SETTLED, REFUNDED]
    note: "Advances independently of lifecycle_status; confirm holds deposit, settle clears, cancel refunds."
    transitions:
      - from: UNPAID
        to: DEPOSIT_HELD
        trigger: "system (on Reservation confirm)"
        actor: system
        preconditions: ["lifecycle_status transition QUOTED->CONFIRMED succeeded"]
        side_effects: ["LedgerEntry(DEPOSIT_HOLD, +deposit_cents) created"]
      - from: DEPOSIT_HELD
        to: SETTLED
        trigger: "system (on Reservation settle)"
        actor: system
        preconditions: ["lifecycle_status transition RETURNED->CLOSED succeeded"]
        side_effects: ["Charges posted; deposit refunded unless absorbed by LOSS_FEE"]
      - from: DEPOSIT_HELD
        to: REFUNDED
        trigger: "system (on Reservation cancel while DEPOSIT_HELD)"
        actor: system
        preconditions: ["lifecycle_status transition ->CANCELLED succeeded"]
        side_effects: ["LedgerEntry(DEPOSIT_REFUND, -deposit_cents) created"]

  # --- GearUnit: availability/condition machine (cyclic, non-linear) ---
  - entity: GearUnit
    field: availability
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    note: "Cyclic: AVAILABLE -> RESERVED -> CHECKED_OUT -> INSPECTING -> AVAILABLE; plus MAINTENANCE loop and RETIRED sink."
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /rental/reservations (reservation created against this unit)"
        actor: Renter
        preconditions:
          - "GearUnit.availability == AVAILABLE"
          - "expected_gear_unit_version matches GearUnit.version (OCC)"
          - "No overlapping reservation window on this unit (calc: window_overlap)"
        side_effects:
          - "availability: AVAILABLE -> RESERVED"
          - "active_reservation_id = new reservation id"
          - "increments GearUnit.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (reservation cancelled)"
        actor: system
        preconditions: []
        side_effects: ["active_reservation_id = null"]
      - from: RESERVED
        to: CHECKED_OUT
        trigger: "system (reservation checkout)"
        actor: system
        preconditions: ["A CHECKOUT ConditionReport recorded condition_rating"]
        side_effects: ["condition set from CHECKOUT report rating (GOOD|WORN -> GOOD|WORN)"]
      - from: CHECKED_OUT
        to: INSPECTING
        trigger: "system (reservation checkin)"
        actor: system
        preconditions: []
        side_effects: ["condition set from CHECKIN report rating"]
      - from: INSPECTING
        to: AVAILABLE
        trigger: "system (reservation settle, condition not DAMAGED, not LOST)"
        actor: system
        preconditions: ["condition in {GOOD, WORN}"]
        side_effects: ["active_reservation_id = null"]
      - from: INSPECTING
        to: MAINTENANCE
        trigger: "system (reservation settle, condition == DAMAGED)"
        actor: system
        preconditions: ["condition == DAMAGED"]
        side_effects: ["active_reservation_id = null"]
      - from: INSPECTING
        to: RETIRED
        trigger: "system (DamageAssessment outcome == LOSS)"
        actor: system
        preconditions: ["checkin condition_rating == LOST"]
        side_effects:
          - "active_reservation_id = null"
          - "unit permanently removed from rentable inventory"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /rental/gear-units/{id}/repair"
        actor: ShopAdmin
        preconditions: ["availability == MAINTENANCE"]
        side_effects: ["condition: DAMAGED -> WORN"]

  # --- DamageAssessment machine ---
  - entity: DamageAssessment
    field: status
    initial_state: ASSESSED
    terminal_states: [SETTLED]
    transitions:
      - from: ASSESSED
        to: SETTLED
        trigger: "system (on Reservation settle)"
        actor: system
        preconditions: ["parent Reservation reached CLOSED"]
        side_effects: ["DAMAGE_FEE or LOSS_FEE LedgerEntry posted as applicable"]
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /rental/damage-assessments/{id}/dispute"
        actor: Renter
        preconditions:
          - "expected_damage_assessment_version matches (OCC)"
          - "status == ASSESSED"
        side_effects:
          - "increments DamageAssessment.version by 1"
          - "blocks Reservation settle until re-assessed"
      - from: DISPUTED
        to: ASSESSED
        trigger: "POST /rental/damage-assessments/{id}/reassess"
        actor: ShopAdmin
        preconditions:
          - "expected_damage_assessment_version matches (OCC)"
          - "status == DISPUTED"
        side_effects:
          - "increments DamageAssessment.version by 1"
          - "recomputes outcome and charge_cents"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-unit
    parent_entity: GearUnit
    write_endpoint: "POST /rental/reservations"
    occ_field: "expected_gear_unit_version"
    description: |
      Creating a Reservation against a GearUnit whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has already reserved (or otherwise mutated) the
      unit — legitimately moving it AVAILABLE -> RESERVED — so the current
      writer's view of the unit is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispute-stale-assessment
    parent_entity: DamageAssessment
    write_endpoint: "POST /rental/damage-assessments/{id}/dispute"
    occ_field: "expected_damage_assessment_version"
    description: |
      Disputing a DamageAssessment whose version has advanced since the
      client last read it is rejected. Captures the case where a ShopAdmin
      reassessment legitimately superseded the prior assessment and the
      renter's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 1 instance A: provisional rental cost on Reservation ---
  - name: quote_rental_cost
    trigger: "POST /rental/reservations (quote at create) and GET /rental/reservations/{id}/quote"
    algorithm: tiered_pricing
    formula: |
      Let span_hours = ceil((due_at - pickup_at) in minutes / 60).        # started hours
      Let span_days  = ceil((due_at - pickup_at) in minutes / 1440).      # started days
      Let mult_bp = demand_multiplier_bp of the SeasonWindow whose
          [starts_on, ends_on) contains pickup_at and whose category ==
          GearType.category; if none, mult_bp = 10000.
      base_hourly  = hourly_cents        * span_hours
      base_daily   = daily_cents         * span_days
      base_seasonal= seasonal_flat_cents                                   # flat, span-independent
      # Choose cheapest BASE tier (forward-looking, on requested window):
      chosen_base  = min(base_hourly, base_daily, base_seasonal)
      quoted_rate_basis = the tier that produced chosen_base; tie-break order
          HOURLY < DAILY < SEASONAL (cheapest; if equal pick earlier in that order).
      rental_cents = round_half_up(chosen_base * mult_bp / 10000)          # demand multiplier, then round
      waiver_cents = damage_waiver_opted ? damage_waiver_cents_per_day * span_days : 0
      quoted_total_cents = rental_cents + waiver_cents + addons_total_cents (calc: addons_total)
    input_set: "Single reservation's requested [pickup_at, due_at) window and its unit's RateCard; the active SeasonWindow covering pickup_at."
    constants:
      DEFAULT_MULTIPLIER_BP: 10000
    precision: "round_half_up to whole cents; multiplier applied to chosen_base BEFORE rounding"
    variants:
      - name: provisional
        when: "at quote / reserve / confirm, before pickup"
        difference: "Uses requested window [pickup_at, due_at); forward-looking; no late fee."

  # --- Rule 1 instance A (final variant) + Rule 2 mode (a) lives in choose-cheapest ---
  - name: final_settlement
    trigger: "POST /rental/reservations/{id}/checkin (transition PICKED_UP->RETURNED)"
    algorithm: chronological
    formula: |
      actual_hours = ceil((returned_at - picked_up_at) in minutes / 60)
      actual_days  = ceil((returned_at - picked_up_at) in minutes / 1440)
      mult_bp = demand_multiplier_bp of SeasonWindow covering picked_up_at (else 10000)
      base_hourly  = hourly_cents * actual_hours
      base_daily   = daily_cents  * actual_days
      base_seasonal= seasonal_flat_cents
      chosen_base  = min(base_hourly, base_daily, base_seasonal)            # re-chosen on ACTUAL usage
      rental_cents = round_half_up(chosen_base * mult_bp / 10000)
      waiver_cents = damage_waiver_opted ? damage_waiver_cents_per_day * actual_days : 0
      final_total_cents = rental_cents + waiver_cents + addons_total_cents + late_fee_cents + damage_charge_cents
      # damage_charge_cents comes from the DamageAssessment for this reservation (0 if NONE/waived)
    input_set: "Actual usage window [picked_up_at, returned_at); the reservation's snapshotted rate_card; its DamageAssessment.charge_cents; its late_fee_cents."
    precision: "round_half_up to whole cents; rental rounded before adding late/damage"
    variants:
      - name: final
        when: "at check-in, using actual picked_up_at/returned_at"
        difference: "Re-selects the cheapest tier on ACTUAL elapsed usage and adds late_fee + damage_charge; diverges from provisional when actual window != requested window."

  # --- Rule 2 mode (b): nested rounding order on the add-on subtotal ---
  - name: addons_total
    trigger: "reservation quote and final settlement"
    algorithm: aggregation
    formula: |
      # Each attached ReservationAddOn contributes price_cents (already whole cents).
      # A 5% multi-add-on bundle discount applies when a reservation has >= 2 PACKAGE
      # add-ons. Rounding order is PINNED: round each line's post-discount price to whole
      # cents FIRST, THEN sum — NOT sum-then-round.
      bundle = (count of PACKAGE ReservationAddOn on this reservation) >= 2
      addons_total_cents = sum over each ReservationAddOn line of:
          round_half_up( line.price_cents * (bundle ? 0.95 : 1.0) )
      # LESSON lines are never discounted but are still individually rounded then summed.
    input_set: "All ReservationAddOn rows for the reservation; their snapshotted price_cents."
    constants:
      BUNDLE_DISCOUNT_RATE: 0.95
      BUNDLE_MIN_PACKAGES: 2
    precision: "round_half_up PER LINE first, then sum (pinned order; sum-then-round is wrong)"

  # --- Rule 2 mode (c) implicit + late fee threshold ---
  - name: late_fee
    trigger: "POST /rental/reservations/{id}/checkin"
    algorithm: threshold
    formula: |
      grace_end = due_at + grace_minutes (from RateCard).
      if returned_at <= grace_end:        # boundary: <= grace_end is ON TIME (inclusive)
          late_fee_cents = 0
      else:
          late_hours = ceil((returned_at - grace_end) in minutes / 60)   # started hours past grace
          late_fee_cents = late_fee_cents_per_hour * late_hours
      # Evaluation order is pinned: late_fee is computed BEFORE final_settlement reads it,
      # and final_settlement's rental_cents is computed independently (no circular tier
      # discount keyed on the total). final_total = rental + waiver + addons + late + damage.
    input_set: "returned_at, due_at, RateCard.grace_minutes, RateCard.late_fee_cents_per_hour."
    constants: {}
    precision: "whole cents; started-hour ceiling"

  # --- Rule 1 instance B: dual-variant on a DIFFERENT entity domain (Customer) ---
  - name: customer_standing
    trigger: "reservation checkin (provisional) and reservation settle (final); also cancel"
    algorithm: weighted_scoring
    formula: |
      strike_points = sum over the customer's reservations of:
          (late_return ? LATE_STRIKE : 0) +
          (assessment.outcome == DAMAGE ? DAMAGE_STRIKE : 0) +
          (assessment.outcome == LOSS  ? LOSS_STRIKE  : 0)
      open_loss_balance_cents = sum of amount_cents over the customer's
          LedgerEntry rows where entry_type == LOSS_FEE and settled == false.
      standing =
          SUSPENDED if (open_loss_balance_cents > 0) OR strike_points >= SUSPEND_AT
          WATCH     if WATCH_AT <= strike_points < SUSPEND_AT
          GOOD      otherwise
    input_set: "All of a customer's reservations and their DamageAssessments; unsettled LOSS_FEE ledger entries."
    constants:
      LATE_STRIKE: 1
      DAMAGE_STRIKE: 2
      LOSS_STRIKE: 4
      WATCH_AT: 2
      SUSPEND_AT: 4
    precision: "integer points"
    variants:
      - name: provisional
        when: "at check-in, from the just-created DamageAssessment (status ASSESSED)"
        difference: "Counts the in-flight assessment optimistically; LOSS not yet ledgered so open_loss_balance may still be 0."
      - name: final
        when: "at settle, after LOSS_FEE/DAMAGE_FEE ledger entries are posted"
        difference: "open_loss_balance_cents now reflects posted LOSS_FEE, which can flip GOOD/WATCH -> SUSPENDED on the same customer that looked clear at check-in."

  # --- damage assessment outcome/charge ---
  - name: damage_charge
    trigger: "DamageAssessment creation (at checkin) and reassess"
    algorithm: threshold
    formula: |
      # Severity ladder GOOD(0) < WORN(1) < DAMAGED(2) < LOST(3).
      checkout_sev = severity(CHECKOUT report rating)
      checkin_sev  = severity(CHECKIN report rating)
      if checkin_sev == 3 (LOST):
          outcome = LOSS;  charge_cents = loss_fee_cents;  waiver_applied = false
      elif checkin_sev > checkout_sev AND checkin_sev == 2 (DAMAGED):
          outcome = DAMAGE
          if damage_waiver_opted: charge_cents = 0; waiver_applied = true
          else: charge_cents = round_half_up(loss_fee_cents * DAMAGE_FRACTION); waiver_applied = false
      else:
          outcome = NONE; charge_cents = 0; waiver_applied = false
    input_set: "The CHECKOUT and CHECKIN ConditionReport ratings for the reservation; reservation.damage_waiver_opted; RateCard.loss_fee_cents."
    constants:
      DAMAGE_FRACTION: 0.40
    precision: "round_half_up to whole cents"

  # --- Rule 8 instance B helper: lesson slot capacity ---
  - name: lesson_slot_capacity
    trigger: "POST /rental/reservations/{id}/addons (attach LESSON add-on)"
    algorithm: aggregation
    formula: |
      For a LESSON add-on with closed slot interval [slot_start_at, slot_end_at]:
      occupancy = count of existing non-cancelled ReservationAddOn rows for the
          SAME addon_id whose closed interval [slot_start_at, slot_end_at] intersects
          the requested closed interval (touching endpoints DO collide — closed semantics).
      reject with ERR_SLOT_FULL if occupancy + 1 > AddOn.capacity_per_slot.
    input_set: "Existing LESSON ReservationAddOn rows for the same addon_id whose reservation is not CANCELLED."
    precision: "integer count; closed-interval intersection (endpoint touch = overlap)"

  # --- Rule 8 instance A helper: unit window overlap ---
  - name: window_overlap
    trigger: "POST /rental/reservations"
    algorithm: interval_merge
    formula: |
      A new reservation window [pickup_at, due_at) on a GearUnit collides with an
      existing non-terminal reservation (lifecycle in {QUOTED, CONFIRMED, PICKED_UP})
      on the SAME gear_unit_id if the half-open intervals overlap AFTER adding a
      fixed TURNAROUND buffer to each existing window's end:
        existing occupies [e.pickup_at, e.due_at + TURNAROUND_MINUTES).
      Overlap test: new.pickup_at < existing_end_buffered AND e.pickup_at < new.due_at.
      Back-to-back rentals that touch exactly (new.pickup_at == e.due_at) STILL collide
      because of the turnaround buffer (>0).
    input_set: "Non-terminal reservations on the same gear_unit_id."
    constants:
      TURNAROUND_MINUTES: 30
    precision: "minute-resolution half-open interval with additive end buffer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: business_constraint
    check: "Request body is well-formed: required fields present, enum/type valid, pickup_at < due_at, integer cents >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role permitted for this endpoint per RBAC matrix; Renter acting on a reservation must own it (customer_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (confirm, checkout, checkin, settle, cancel, dispute, reassess, repair)"

  - priority: 5
    category: business_referential
    check: "GearUnit must be AVAILABLE to reserve; rate card / gear type must be active; add-on category must match unit's gear type category"
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /rental/reservations, POST /rental/reservations/{id}/addons"

  - priority: 6
    category: business_temporal
    check: "Requested [pickup_at, due_at) must not overlap an existing non-terminal window on the unit (incl. turnaround buffer); pickup_at < due_at"
    error_id: ERR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /rental/reservations"

  - priority: 7
    category: business_temporal
    check: "LESSON add-on slot must not exceed AddOn.capacity_per_slot for an intersecting closed interval"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /rental/reservations/{id}/addons"

  - priority: 8
    category: business_safety
    check: "Beginner Renter on a gear type requiring a lesson must have a LESSON add-on attached before confirm"
    error_id: ERR_LESSON_REQUIRED
    http_status: 422
    applies_to: "POST /rental/reservations/{id}/confirm"

  - priority: 9
    category: business_constraint
    check: "Customer.standing must not be SUSPENDED to confirm a reservation"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    applies_to: "POST /rental/reservations/{id}/confirm"

  - priority: 10
    category: business_fiscal
    check: "OCC: expected_gear_unit_version / expected_damage_assessment_version must match current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rental/reservations, POST /rental/damage-assessments/{id}/dispute"

  - priority: 11
    category: business_constraint
    check: "Cannot settle a reservation while its DamageAssessment is DISPUTED"
    error_id: ERR_ASSESSMENT_DISPUTED
    http_status: 409
    applies_to: "POST /rental/reservations/{id}/settle"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Catalog: GearType ---
  - method: POST
    path: "/rental/gear-types"
    description: "Create a gear type"
    roles: [ShopAdmin]
    code: 201
    input: [category, name, size_label, "requires_lesson_for_beginner?", "active?"]
    output: GearType
    side_effects: ["version=1, active default true"]

  - method: GET
    path: "/rental/gear-types/{id}"
    description: "Get a gear type"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: GearType
    side_effects: []

  - method: GET
    path: "/rental/gear-types"
    description: "List gear types"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: GearType[]
    side_effects: []

  # --- Catalog: RateCard ---
  - method: POST
    path: "/rental/rate-cards"
    description: "Create a rate card for a gear type"
    roles: [ShopAdmin]
    code: 201
    input: [gear_type_id, hourly_cents, daily_cents, seasonal_flat_cents, deposit_cents, damage_waiver_cents_per_day, late_fee_cents_per_hour, loss_fee_cents, "grace_minutes?", "active?"]
    output: RateCard
    side_effects: ["version=1"]

  - method: GET
    path: "/rental/rate-cards/{id}"
    description: "Get a rate card"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: RateCard
    side_effects: []

  - method: GET
    path: "/rental/rate-cards"
    description: "List rate cards, optionally filtered by gear_type_id"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["gear_type_id?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  # --- Catalog: SeasonWindow ---
  - method: POST
    path: "/rental/season-windows"
    description: "Create a seasonal demand window for a category"
    roles: [ShopAdmin]
    code: 201
    input: [category, label, starts_on, ends_on, demand_multiplier_bp]
    output: SeasonWindow
    side_effects: []

  - method: GET
    path: "/rental/season-windows"
    description: "List season windows, optionally filtered by category"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: SeasonWindow[]
    side_effects: []

  # --- Catalog: AddOn ---
  - method: POST
    path: "/rental/addons"
    description: "Create a lesson/package add-on"
    roles: [ShopAdmin]
    code: 201
    input: [kind, category, name, price_cents, "capacity_per_slot?", "active?"]
    output: AddOn
    side_effects: ["version=1"]

  - method: GET
    path: "/rental/addons"
    description: "List add-ons, optionally filtered by category"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/rental/customers"
    description: "Register a customer (renter)"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 201
    input: [full_name, email, "skill_level?"]
    output: Customer
    side_effects: ["standing=GOOD, strike_points=0, open_loss_balance_cents=0, version=1"]

  - method: GET
    path: "/rental/customers/{id}"
    description: "Get a customer with derived standing"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- GearUnit ---
  - method: POST
    path: "/rental/gear-units"
    description: "Create a physical gear unit"
    roles: [ShopAdmin]
    code: 201
    input: [gear_type_id, rate_card_id, asset_tag]
    output: GearUnit
    side_effects: ["availability=AVAILABLE, condition=GOOD, version=1"]

  - method: GET
    path: "/rental/gear-units/{id}"
    description: "Get a gear unit"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: GearUnit
    side_effects: []

  - method: GET
    path: "/rental/gear-units"
    description: "List gear units, optionally filtered by gear_type_id or rate_card_id"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["gear_type_id?", "rate_card_id?", "availability?", "limit?", "offset?"]
    output: GearUnit[]
    side_effects: []

  - method: POST
    path: "/rental/gear-units/{id}/repair"
    description: "Return a unit from MAINTENANCE to AVAILABLE"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: GearUnit
    side_effects: ["availability: MAINTENANCE -> AVAILABLE", "condition: DAMAGED -> WORN", "version +1"]

  # --- Reservation ---
  - method: POST
    path: "/rental/reservations"
    description: "Create (quote) a reservation against an available gear unit"
    roles: [Renter, RentalAgent]
    code: 201
    input: [customer_id, gear_unit_id, pickup_at, due_at, "damage_waiver_opted?", expected_gear_unit_version]
    output: Reservation
    side_effects:
      - "lifecycle_status=QUOTED, payment_status=UNPAID"
      - "rate_card_id snapshotted from the unit"
      - "computes quoted_rate_basis and quoted_total_cents (calc: quote_rental_cost)"
      - "GearUnit.availability: AVAILABLE -> RESERVED; active_reservation_id set"
      - "increments GearUnit.version by 1"

  - method: GET
    path: "/rental/reservations/{id}"
    description: "Get a reservation"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/rental/reservations"
    description: "List reservations, optionally filtered by customer_id or gear_unit_id"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["customer_id?", "gear_unit_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/rental/reservations/{id}/quote"
    description: "Recompute and return the provisional quote for a reservation"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: Reservation
    side_effects: ["recomputes quoted_total_cents (calc: quote_rental_cost)"]

  - method: POST
    path: "/rental/reservations/{id}/addons"
    description: "Attach a lesson/package add-on to a reservation (QUOTED only)"
    roles: [Renter, RentalAgent]
    code: 201
    input: [addon_id, "slot_start_at?", "slot_end_at?"]
    output: ReservationAddOn
    side_effects:
      - "price_cents snapshotted from AddOn"
      - "for LESSON: validates lesson_slot_capacity (calc) on closed slot interval"
      - "recomputes reservation quoted_total_cents (calc: addons_total)"

  - method: GET
    path: "/rental/reservation-addons"
    description: "List reservation add-on lines, filtered by reservation_id or addon_id"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["reservation_id?", "addon_id?", "limit?", "offset?"]
    output: ReservationAddOn[]
    side_effects: []

  - method: POST
    path: "/rental/reservations/{id}/confirm"
    description: "Confirm a quoted reservation (holds deposit)"
    roles: [Renter, RentalAgent]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "lifecycle_status: QUOTED -> CONFIRMED"
      - "deposit_cents snapshotted; payment_status: UNPAID -> DEPOSIT_HELD"
      - "creates LedgerEntry(DEPOSIT_HOLD, +deposit_cents)"

  - method: POST
    path: "/rental/reservations/{id}/checkout"
    description: "Check out the gear (records CHECKOUT condition, starts the rental clock)"
    roles: [RentalAgent]
    code: 200
    input: [condition_rating, "notes?"]
    output: Reservation
    side_effects:
      - "creates CHECKOUT ConditionReport"
      - "lifecycle_status: CONFIRMED -> PICKED_UP; picked_up_at = clock"
      - "GearUnit.availability: RESERVED -> CHECKED_OUT; condition set from rating"

  - method: POST
    path: "/rental/reservations/{id}/checkin"
    description: "Check in the gear (records CHECKIN condition, computes late/final, creates DamageAssessment)"
    roles: [RentalAgent]
    code: 200
    input: [condition_rating, "notes?"]
    output: Reservation
    side_effects:
      - "creates CHECKIN ConditionReport"
      - "lifecycle_status: PICKED_UP -> RETURNED; returned_at = clock"
      - "computes late_fee_cents (calc: late_fee) and final_total_cents (calc: final_settlement)"
      - "creates DamageAssessment (calc: damage_charge); status=ASSESSED"
      - "GearUnit.availability: CHECKED_OUT -> INSPECTING; if rating==LOST GearUnit -> RETIRED"
      - "recomputes Customer.standing (calc: customer_standing, provisional variant)"

  - method: POST
    path: "/rental/reservations/{id}/settle"
    description: "Settle a returned reservation (posts charges, releases/absorbs deposit, closes)"
    roles: [RentalAgent]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "lifecycle_status: RETURNED -> CLOSED; payment_status: DEPOSIT_HELD -> SETTLED"
      - "DamageAssessment: ASSESSED -> SETTLED"
      - "posts RENTAL_CHARGE, LATE_FEE, DAMAGE_FEE/LOSS_FEE LedgerEntry rows"
      - "posts DEPOSIT_REFUND unless absorbed by an open LOSS_FEE"
      - "GearUnit.availability: INSPECTING -> AVAILABLE or MAINTENANCE (if DAMAGED)"
      - "recomputes Customer.standing (calc: customer_standing, final variant)"

  - method: POST
    path: "/rental/reservations/{id}/cancel"
    description: "Cancel a quoted/confirmed reservation (releases unit, refunds deposit)"
    roles: [Renter, RentalAgent]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "lifecycle_status -> CANCELLED"
      - "GearUnit.availability: RESERVED -> AVAILABLE; active_reservation_id=null"
      - "if payment_status==DEPOSIT_HELD: LedgerEntry(DEPOSIT_REFUND, -deposit_cents); payment_status -> REFUNDED"

  # --- ReservationAddOn (single-resource read) ---
  - method: GET
    path: "/rental/reservation-addons/{id}"
    description: "Get a reservation add-on line"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: ReservationAddOn
    side_effects: []

  # --- ConditionReport (reverse-reachability) ---
  - method: GET
    path: "/rental/condition-reports/{id}"
    description: "Get a condition report"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: ConditionReport
    side_effects: []

  - method: GET
    path: "/rental/condition-reports"
    description: "List condition reports filtered by reservation_id or gear_unit_id"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["reservation_id?", "gear_unit_id?", "limit?", "offset?"]
    output: ConditionReport[]
    side_effects: []

  # --- DamageAssessment ---
  - method: GET
    path: "/rental/damage-assessments/{id}"
    description: "Get a damage assessment"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: []

  - method: GET
    path: "/rental/damage-assessments"
    description: "List damage assessments filtered by reservation_id or checkin_report_id"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["reservation_id?", "checkin_report_id?", "limit?", "offset?"]
    output: DamageAssessment[]
    side_effects: []

  - method: POST
    path: "/rental/damage-assessments/{id}/dispute"
    description: "Renter disputes a damage assessment"
    roles: [Renter]
    code: 200
    input: [expected_damage_assessment_version]
    output: DamageAssessment
    side_effects: ["status: ASSESSED -> DISPUTED", "version +1", "blocks settle"]

  - method: POST
    path: "/rental/damage-assessments/{id}/reassess"
    description: "Admin re-assesses a disputed damage assessment"
    roles: [ShopAdmin]
    code: 200
    input: [expected_damage_assessment_version, "override_outcome?"]
    output: DamageAssessment
    side_effects: ["status: DISPUTED -> ASSESSED", "version +1", "recomputes outcome and charge_cents (calc: damage_charge)"]

  # --- LedgerEntry (reverse-reachability) ---
  - method: GET
    path: "/rental/ledger-entries/{id}"
    description: "Get a ledger entry"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/rental/ledger-entries"
    description: "List ledger entries filtered by reservation_id or customer_id"
    roles: [ShopAdmin, RentalAgent, Renter]
    code: 200
    input: ["reservation_id?", "customer_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # --- Test-driving: clock ---
  - method: POST
    path: "/rental/_clock/set"
    description: "Set the server's current UTC clock (test-driving)"
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock used for picked_up_at, returned_at, season selection set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Renter acting on a reservation it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request, missing required field, invalid enum/type, pickup_at >= due_at" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "GearUnit is not AVAILABLE, or gear type / rate card inactive, or add-on category mismatch" }
  - { id: ERR_WINDOW_CONFLICT, http: 409, condition: "Requested reservation window overlaps an existing non-terminal window on the unit (including turnaround buffer)" }
  - { id: ERR_SLOT_FULL, http: 409, condition: "LESSON add-on slot at capacity for an intersecting closed interval" }
  - { id: ERR_LESSON_REQUIRED, http: 422, condition: "Beginner on a lesson-required gear type confirming without a LESSON add-on" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Customer.standing is SUSPENDED; cannot confirm" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent's current version" }
  - { id: ERR_ASSESSMENT_DISPUTED, http: 409, condition: "Cannot settle while the reservation's DamageAssessment is DISPUTED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Operates the catalog and back-office: gear types, rate cards, season windows, add-ons, gear units, repairs, reassessments, and the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /rental/gear-types — create gear type"
      - "POST /rental/rate-cards — create rate card"
      - "POST /rental/season-windows — create season window"
      - "POST /rental/addons — create add-on"
      - "POST /rental/gear-units — create gear unit"
      - "POST /rental/gear-units/{id}/repair — repair a unit"
      - "POST /rental/damage-assessments/{id}/reassess — reassess a disputed assessment"
      - "POST /rental/_clock/set — set the test clock"
    shared_operations:
      - "GET endpoints — read catalog, customers, units, reservations, reports, assessments, ledger"

  - name: RentalAgent
    description: "Runs the rental counter: checkout, check-in, settle, and may create/cancel reservations on a renter's behalf."
    identity: opaque
    exclusive_operations:
      - "POST /rental/reservations/{id}/checkout — check gear out"
      - "POST /rental/reservations/{id}/checkin — check gear in"
      - "POST /rental/reservations/{id}/settle — settle a returned reservation"
    shared_operations:
      - "POST /rental/customers — register a customer (shared with Renter)"
      - "POST /rental/reservations — create a reservation (shared with Renter)"
      - "POST /rental/reservations/{id}/addons — attach add-on (shared with Renter)"
      - "POST /rental/reservations/{id}/confirm — confirm (shared with Renter)"
      - "POST /rental/reservations/{id}/cancel — cancel (shared with Renter)"
      - "GET endpoints"

  - name: Renter
    description: "A customer acting on their own reservations. X-User-ID equals the acting Customer.id; ownership enforced on reservation mutations."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /rental/damage-assessments/{id}/dispute — dispute an assessment on own reservation"
    shared_operations:
      - "POST /rental/customers — register self (shared with RentalAgent)"
      - "POST /rental/reservations — create own reservation (shared with RentalAgent)"
      - "POST /rental/reservations/{id}/addons — attach add-on to own reservation"
      - "POST /rental/reservations/{id}/confirm — confirm own reservation"
      - "POST /rental/reservations/{id}/cancel — cancel own reservation"
      - "GET endpoints (own and catalog)"
