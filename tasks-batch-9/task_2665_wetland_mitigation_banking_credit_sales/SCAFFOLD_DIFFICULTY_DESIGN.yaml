      - name: stewardship_endowment_single_pass_not_fixed_point
        grounds:
          - calculations.stewardship_endowment_requirement
          - endpoints.POST_/mitigation/banks
          - entities.MitigationBank.fields.stewardship_required_cents
          - entities.MitigationBank.fields.annual_stewardship_cost_cents
        distinguishing_aspect: |
          Combinatorial mode (c) — CIRCULAR-LOOKING DEPENDENCY WITH A PINNED SINGLE PASS. The admin fee
          is itself an annual stewardship cost, which invites a fixed-point solve
          x = (4200000 + 0.0150x) / 0.0375 -> 186666667. The pinned order capitalises the fee-free base
          once (ceil(4200000 / 0.0375) = 112000000), derives the fee from that base
          (round(112000000 * 0.0150) = 1680000) and adds it, giving 113680000 — a 64% divergence from
          the fixed point. Unlike the other two instances of this rule, no state machine, sale, or
          rounding-order trap is involved: the trap is the evaluation order of a self-referential
          formula, and it is observable on a single creation call.
        test_recipe:
          setup:
            - "A sponsor only; the endowment requirement is stamped at bank creation and depends on no child entity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
          trigger:
