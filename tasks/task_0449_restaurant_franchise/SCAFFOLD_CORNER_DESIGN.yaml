              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "Buyer", owner_user_id: "u_buyer", is_existing_operator: false }
              as: Franchisor
              captures: { buyer_id: $.data.id }
            - call: "POST /franchise/franchisees/${buyer_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fz_id}", fdd_version: "2026.1", term_end_period_index: 1 }
              as: Franchisor
              captures: { ag_id: $.data.id }
            - call: "POST /franchise/agreements/${ag_id}/execute"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/agreements/${ag_id}/begin-renewal"
              payload: {}
              as: Franchisor
          trigger:
            - call: "POST /franchise/agreements/${ag_id}/transfer"
              payload: { buyer_franchisee_id: "${buyer_id}" }
              as: Franchisor
              captures: { fee: $.data.id }
          assert:
            - "FranchiseAgreement.${ag_id}.status == TRANSFERRED"
            - "transfer_fee_cents in the response == 1500000   # floor 1000000 + training 500000"

