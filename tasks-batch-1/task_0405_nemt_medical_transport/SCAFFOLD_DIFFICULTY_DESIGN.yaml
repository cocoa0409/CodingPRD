            - call: "POST /members"
              payload: { medicaid_id: "M-CE2", full_name: "Cross Two", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerCE2", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Ce2 D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
          trigger:
            - call: "POST /claims"
              payload: { trip_id: "${trip_id}" }
              as: Broker
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "TripRequest.${trip_id}.billing_status == UNBILLED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: will_call_return_blocked_before_outbound_dropped_off
        grounds:
          - state_machines.Leg.PENDING_to_READY
          - validations[priority=10]
          - entities.Leg.fields.direction
        distinguishing_aspect: |
          Sequencing-as-overlap on the Leg resource: a will-call RETURN leg cannot go
          READY while its OUTBOUND leg has not yet reached DROPPED_OFF — the return
          interval may not open until the outbound interval closes (zero-overlap,
          ordered-adjacency semantics). Fails ERR_LEG_SEQUENCE_VIOLATION.
        test_recipe:
          setup:
            - "WHEELCHAIR round-trip will-call trip IN_PROGRESS; OUTBOUND leg only EN_ROUTE (not DROPPED_OFF); RETURN will-call leg PENDING."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-02T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "WHEELCHAIR", base_fare_cents: 2000, loaded_rate_cents_per_mile: 150, dwell_free_minutes: 10, dwell_cents_per_minute: 50 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-RO1", full_name: "Ovr One", mobility_level: "WHEELCHAIR", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "BARIATRIC", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerRO", covered_counties: ["C1"], max_modality: "STRETCHER", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Ro D", vehicle_modality: "WHEELCHAIR", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "WHEELCHAIR", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 10, is_round_trip: true, return_is_will_call: true }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "GET /trips/${trip_id}/legs"
              payload: {}
              as: Coordinator
              captures: { ob_leg_id: "$.data[0].id", rt_leg_id: "$.data[1].id" }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
            - call: "POST /legs/${ob_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /legs/${rt_leg_id}/ready"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_LEG_SEQUENCE_VIOLATION"
            - "Leg.${rt_leg_id}.leg_status == PENDING"

      - name: second_active_assignment_blocked_on_trip
        grounds:
          - validations[priority=11]
          - state_machines.TripRequest.SCHEDULED_to_ASSIGNED
          - entities.Assignment.fields.status
        distinguishing_aspect: |
          Occupation overlap on the TripRequest resource: at most ONE ACTIVE
          Assignment may occupy a trip at a time (aggregate-capacity-of-1 interval
          semantics, vs the ordered-adjacency semantics of the leg sequence). A
          second assign while one is ACTIVE fails ERR_ASSIGNMENT_EXISTS. Different
          resource entity (TripRequest) from the Leg-sequence overlap.
        test_recipe:
          setup:
            - "An AMBULATORY trip already ASSIGNED with one ACTIVE Assignment (trip_status ASSIGNED)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-RO2", full_name: "Ovr Two", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerRO2", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Ro2 D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
              captures: { trip_v_assigned: $.data.version }
          trigger:
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_assigned}", preferred_broker_id: "${brk_id}" }
              as: Broker
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_ASSIGNMENT_EXISTS (state precondition ASSIGNED already failed before; here trip is ASSIGNED so single-active-assignment rule fires)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assign_then_cancel_conserves_driver_availability
        grounds:
          - state_machines.TripRequest.SCHEDULED_to_ASSIGNED
          - state_machines.TripRequest.ASSIGNED_to_CANCELLED
          - state_machines.Driver.AVAILABLE_to_ON_TRIP
          - state_machines.Driver.ON_TRIP_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity = count of AVAILABLE Drivers for the broker. Assign
          (forward) moves the driver AVAILABLE->ON_TRIP; cancel (compensating) moves
          it back. Invariant: AVAILABLE_DRIVER_COUNT(broker) after assign+cancel ==
          before == 1, with zero ACTIVE Assignments remaining.
        test_recipe:
          setup:
            - "ELIGIBLE AMBULATORY member, one broker, one AVAILABLE driver; a SCHEDULED trip."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-CI1", full_name: "Cnsv One", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerCI", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Ci D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
          trigger:
            - call: "POST /trips/${trip_id}/cancel"
              payload: {}
              as: Coordinator
          assert:
            - "Driver.${drv_id}.status == AVAILABLE (conserved: equals pre-assign value)"
            - "TripRequest.${trip_id}.assigned_driver_id == null"
            - "The trip's Assignment.status == RELEASED (no ACTIVE assignment remains)"

      - name: claim_encounter_reconcile_conserves_variance_identity
        grounds:
          - calculations.reconciliation_variance
          - entities.TripRequest.fields.claimed_cost_cents
          - entities.TripRequest.fields.encounter_cost_cents
          - entities.TripRequest.fields.reconciliation_variance_cents
          - state_machines.TripRequest.ENCOUNTERED_to_RECONCILED
        distinguishing_aspect: |
          Conserved quantity = cost identity reconciliation_variance_cents ==
          encounter_cost_cents - claimed_cost_cents. After reconcile this identity
          must hold exactly (7100-7000 == 100). A different conserved quantity
          (a monetary identity) from the driver-availability count invariant.
        test_recipe:
          setup:
            - "COMPLETED WHEELCHAIR round-trip (not will-call): outbound odo 10.0, return odo 10.0 dwell raw 12 (billable 2). claimed 7000c, encounter 7100c."
            - "Claim and encounter both submitted; reconcile under test (variance 100c <= tolerance 500c -> RECONCILED)."
