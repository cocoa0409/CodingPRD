          - state_machines.CrsCycle.OPEN_to_RETROGRADED
          - state_machines.DevelopmentPermit.ISSUED_to_REVOKED
          - calculations.sanction_risk_and_posture
        distinguishing_aspect: |
          Depth 4 on a completely different chain from the inspection cascade: order DEFAULTED
          -> violation ESCALATED -> sanction_risk_points 29 and posture SUSPENDED -> the OPEN
          CrsCycle is RETROGRADED and crs_class forced to 10, while the ESCALATED violation's
          permit is REVOKED in the same call.
