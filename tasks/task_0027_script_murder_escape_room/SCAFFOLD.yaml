# =============================================================================
# Script Murder & Escape Room Reservation System — Scaffold (v1)
# =============================================================================

scenario: |
  Script murder and escape room reservation system: venue management with venue
  profile, multi-venue chain support, business-hour configuration, and room
  inventory; theme room scheduling with theme attributes (difficulty/duration/
  player count/genre), room-to-theme binding rules, schedule generation, and
  maintenance-period blocking; player team matching with private booking,
  public team-up matching, player-preference filtering (gender/age/experience),
  team-formation completion triggering, and match-failure handling; NPC and
  host scheduling with role qualification matching, working-hour limits,
  multi-room parallel coverage, substitute arrangement, and shift handover;
  session reservation and waitlist with available-slot booking, deposit hold,
  cancellation rules, no-show penalty, waitlist queue with priority, and
  automatic promotion on cancellation; review system with post-session rating,
  theme/host/venue dimension scoring, review moderation, anti-spam control,
  and review aggregation; revenue sharing with theme-script author royalty,
  host commission, venue revenue share, refund-induced reversal, and periodic
  settlement; event-driven synchronization with payment, IM, and content
  (script) authorization systems; audit logging for booking changes and review
  moderation.

domain_name: script-murder-escape-room
api_prefix: /venues

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - ops_run_checkpoint
    - waterfall_allocation
    - version_pinning_on_approval
    - selector_policy

  entity_topology: hybrid
  # Hierarchical Venue -> Room -> SessionSlot tree, with cross-cutting
  # peer references from Booking, WaitlistEntry, StaffAssignment, Review,
  # SettlementRun, and AuditLogEntry into the tree (selectors and FK links).

  state_machine_shape: parallel
  # SessionSlot carries two independent state axes (schedule_status x
  # match_status). Review uses branching-with-revert (revision on rejected
  # moderation). Booking is linear with cascading reverts.

  relationship_patterns:
    - one_to_many        # Venue->Room->SessionSlot, SessionSlot->Booking
    - many_to_many       # Theme<->Room (junction RoomThemeBinding stored on Theme.compatible_room_ids), Player<->Booking via team membership
    - cross_aggregate    # SettlementRun aggregates across all venues/themes/staff; AuditLogEntry references any entity polymorphically

  role_model: peer_roles
  # VenueOperator owns Venue/Room/Theme/MaintenanceWindow,
  # Host/NPC own StaffAssignment + Review-host responses,
  # Player owns Booking/Review,
  # PlatformAdmin owns SettlementRun + cross-tenant operations,
  # ContentModerator owns Review moderation,
  # ScriptAuthor owns Theme version registration.

  consistency_model: immediate
  # All cascades execute atomically within a request; settlement and waitlist
  # promotion are explicit endpoint-driven sweeps, not background jobs.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: chain_id, type: string, source: input, description: "Logical chain grouping (free-form string; venues with same chain_id form a chain). Required.", constraints: "non-empty string" }
      - { name: name, type: string, source: input, description: "Display name", constraints: "1..120 chars, unique within chain_id" }
      - { name: timezone, type: string, source: input, description: "IANA timezone, used for parsing business_hours and session local time", default: "Asia/Shanghai" }
      - { name: business_hours, type: object, source: input, description: "{ weekday(0=Mon..6=Sun): {open: 'HH:MM', close: 'HH:MM'} | null }; null means closed that day", constraints: "open < close (same calendar day; overnight hours not modeled in v1)" }
      - { name: deposit_policy_cents, type: integer, source: input, description: "Per-seat deposit hold amount in cents", constraints: "0..1_000_000" }
      - { name: revenue_share_bps, type: integer, source: input, description: "Venue's share of session revenue, in basis points (bps; 1 bp = 0.01%)", constraints: "0..10000; venue_share_bps + author_royalty_bps + host_commission_bps + platform_fee_bps == 10000 enforced at create/update" }
      - { name: author_royalty_bps, type: integer, source: input, description: "Default author royalty bps for sessions at this venue (theme-level override allowed)", constraints: "0..10000" }
      - { name: host_commission_bps, type: integer, source: input, description: "Default host commission bps", constraints: "0..10000" }
      - { name: platform_fee_bps, type: integer, source: input, description: "Platform fee bps (residual)", constraints: "0..10000" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Room
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: venue_id, type: string, source: system, description: "Parent venue id (from URL path)" }
      - { name: name, type: string, source: input, description: "Room name", constraints: "unique within venue_id" }
      - { name: capacity_min, type: integer, source: input, description: "Minimum simultaneous players the room supports", constraints: ">=1" }
      - { name: capacity_max, type: integer, source: input, description: "Maximum simultaneous players", constraints: ">=capacity_min, <=20" }
      - { name: turnover_minutes, type: integer, source: input, description: "Mandatory cleaning/reset gap after a session ends before the next slot may begin in this room", default: 30, constraints: "0..240" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: "ACTIVE", constraints: "ACTIVE | RETIRED" }

  - name: Theme
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: chain_id, type: string, source: input, description: "Owning chain (themes are chain-scoped, not venue-scoped)" }
      - { name: title, type: string, source: input, description: "Theme title", constraints: "unique within chain_id" }
      - { name: genre, type: enum, source: input, description: "Theme genre", constraints: "MYSTERY | HORROR | EMOTIONAL | SCIFI | COMEDY | PUZZLE" }
      - { name: difficulty, type: enum, source: input, description: "Difficulty tier", constraints: "EASY | MEDIUM | HARD | EXPERT" }
      - { name: duration_minutes, type: integer, source: input, description: "Standard playtime per session", constraints: "30..360" }
      - { name: min_players, type: integer, source: input, description: "Minimum players required to launch a session", constraints: ">=1" }
      - { name: max_players, type: integer, source: input, description: "Maximum players accepted", constraints: ">=min_players, <=20" }
      - { name: required_host_qualifications, type: array, source: input, description: "Set of qualification tags a host must hold to run this theme; e.g., ['DM_CERT', 'HORROR_SAFE']" }
      - { name: required_npc_count, type: integer, source: input, description: "How many NPC roles must be filled per session", default: 0, constraints: "0..10" }
      - { name: compatible_room_ids, type: array, source: input, description: "Room ids (within chain_id) where this theme may be staged. Empty array forbidden.", constraints: "len>=1; every id must reference a Room in same chain_id" }
      - { name: base_price_cents, type: integer, source: input, description: "Per-seat price in cents (sessions inherit unless overridden at slot creation)" }
      - { name: author_royalty_bps_override, type: integer, source: input, default: null, description: "If non-null, overrides Venue.author_royalty_bps for sessions of this theme. Sum check (§1.3) is then re-evaluated using overridden value." }
      - { name: current_version, type: integer, source: system, description: "Monotonic theme content version. Increments on POST /themes/{id}/publish-revision.", default: 1 }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED", default: "DRAFT", constraints: "DRAFT | PUBLISHED | RETIRED" }

  - name: MaintenanceWindow
    parent: Room
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: room_id, type: string, source: system, description: "Parent room id" }
      - { name: starts_at, type: datetime, source: input, description: "ISO 8601 UTC; closed-open interval [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "ISO 8601 UTC", constraints: "ends_at > starts_at" }
      - { name: reason, type: string, source: input, description: "Free-form note (e.g., 'prop replacement')" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | CLOSED", default: "SCHEDULED", constraints: "SCHEDULED | ACTIVE | CLOSED" }

  - name: SessionSlot
    parent: Room
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: venue_id, type: string, source: system, description: "Denormalized for query convenience" }
      - { name: room_id, type: string, source: system, description: "Parent room id" }
      - { name: theme_id, type: string, source: input, description: "Theme staged in this slot" }
      - { name: theme_version_pinned, type: integer, source: system, description: "Equals Theme.current_version at time of slot creation; stays pinned even if theme is later revised" }
      - { name: starts_at, type: datetime, source: input, description: "ISO 8601 UTC; closed-open [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: system, description: "Computed: starts_at + theme.duration_minutes (set on slot creation; immutable thereafter)" }
      - { name: price_cents, type: integer, source: input, description: "Per-seat price; defaults to theme.base_price_cents if not provided", default: null }
      - { name: visibility, type: enum, source: input, description: "PRIVATE_ONLY (single team books all seats) | PUBLIC_TEAMUP (matching pool fills seats)", constraints: "PRIVATE_ONLY | PUBLIC_TEAMUP" }
      - { name: required_seats_for_launch, type: integer, source: input, description: "How many seats must be confirmed before match_status auto-advances to MATCHED. Must satisfy theme.min_players <= required_seats_for_launch <= theme.max_players.", default: null }
      - { name: schedule_status, type: enum, source: system, description: "Schedule axis: SCHEDULED | LIVE | COMPLETED | CANCELLED", default: "SCHEDULED" }
      - { name: match_status, type: enum, source: system, description: "Matching axis (independent of schedule axis): OPEN | MATCHED | MATCH_FAILED", default: "OPEN" }
      - { name: confirmed_seat_count, type: integer, source: computed, description: "Sum of seats across Bookings in CONFIRMED status for this slot. Recomputed on Booking transitions." }
      - { name: match_deadline_at, type: datetime, source: system, description: "starts_at - MATCH_CUTOFF_MINUTES; if match_status still OPEN at deadline (POST /_clock/advance triggers re-evaluation), match_status -> MATCH_FAILED and schedule_status -> CANCELLED via cascade" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "Sum of paid_amount_cents across SETTLED Bookings; finalized at session COMPLETED" }
      - { name: net_revenue_cents, type: integer, source: computed, description: "gross_revenue_cents minus refund_total_cents from refunded Bookings; recomputed on cascade" }

  - name: Booking
    parent: SessionSlot
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: slot_id, type: string, source: system, description: "Parent session slot" }
      - { name: lead_player_id, type: string, source: input, description: "Player who initiated the booking" }
      - { name: team_player_ids, type: array, source: input, description: "All player ids included in this booking (lead + companions); lead_player_id MUST appear in this list" }
      - { name: seat_count, type: integer, source: computed, description: "len(team_player_ids); pinned at booking creation" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "seat_count * slot.price_cents at moment of booking creation" }
      - { name: deposit_held_cents, type: integer, source: computed, description: "seat_count * venue.deposit_policy_cents; debited on PENDING_DEPOSIT->CONFIRMED, refunded per cancellation policy" }
      - { name: refund_total_cents, type: integer, source: computed, description: "Total cents refunded so far across this booking; updated on cancellation, no-show, or post-session refund" }
      - { name: cancellation_initiator, type: enum, source: system, description: "Set when status enters CANCELLED: PLAYER | VENUE | SYSTEM_MATCH_FAIL | NO_SHOW", default: null, constraints: "null | PLAYER | VENUE | SYSTEM_MATCH_FAIL | NO_SHOW" }
      - { name: status, type: enum, source: system, description: "PENDING_DEPOSIT | CONFIRMED | CHECKED_IN | SETTLED | CANCELLED | REFUNDED", default: "PENDING_DEPOSIT" }

  - name: WaitlistEntry
    parent: SessionSlot
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: slot_id, type: string, source: system, description: "Slot the player is waiting on" }
      - { name: lead_player_id, type: string, source: input, description: "Requesting player" }
      - { name: requested_seat_count, type: integer, source: input, description: "How many seats this entry would consume on promotion", constraints: ">=1, <=slot.theme.max_players" }
      - { name: priority_class, type: enum, source: input, description: "VIP (Player.tier=VIP at enqueue) | STANDARD; pinned at enqueue time", default: "STANDARD" }
      - { name: enqueued_at, type: datetime, source: system, description: "Server timestamp; tie-breaks within same priority_class (FIFO)" }
      - { name: status, type: enum, source: system, description: "QUEUED | PROMOTED | EXPIRED | CANCELLED", default: "QUEUED" }

  - name: Player
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID — equals X-User-ID when X-User-Role=Player" }
      - { name: display_name, type: string, source: input, description: "Display name" }
      - { name: gender, type: enum, source: input, description: "Used for matching preference filters", constraints: "MALE | FEMALE | UNDISCLOSED" }
      - { name: age, type: integer, source: input, description: "Player age in years", constraints: ">=12, <=99" }
      - { name: experience_level, type: enum, source: input, description: "Self-declared", constraints: "NOVICE | INTERMEDIATE | VETERAN" }
      - { name: tier, type: enum, source: input, description: "Loyalty tier (drives waitlist priority)", default: "STANDARD", constraints: "STANDARD | VIP" }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of NO_SHOW cancellations in the trailing NO_SHOW_WINDOW_DAYS; if >= NO_SHOW_BAN_THRESHOLD, new bookings are rejected", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | BANNED", default: "ACTIVE", constraints: "ACTIVE | BANNED" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID — equals X-User-ID when X-User-Role=Host or NPC" }
      - { name: chain_id, type: string, source: input, description: "Staff is contracted to one chain" }
      - { name: display_name, type: string, source: input, description: "Display name" }
      - { name: roles_held, type: array, source: input, description: "Subset of {HOST, NPC}", constraints: "non-empty subset of {HOST, NPC}" }
      - { name: qualifications, type: array, source: input, description: "Tag set (e.g., 'DM_CERT', 'HORROR_SAFE'); used to satisfy Theme.required_host_qualifications" }
      - { name: max_weekly_minutes, type: integer, source: input, description: "Soft cap on summed assignment minutes per ISO week (Mon..Sun, venue timezone)", default: 2400, constraints: ">0, <=10080" }
      - { name: commission_bps_override, type: integer, source: input, description: "If non-null, overrides Venue.host_commission_bps for this staff member's host shifts", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_LEAVE | TERMINATED", default: "ACTIVE", constraints: "ACTIVE | ON_LEAVE | TERMINATED" }

  - name: StaffAssignment
    parent: SessionSlot
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: slot_id, type: string, source: system, description: "Session being staffed" }
      - { name: staff_member_id, type: string, source: input, description: "Assigned staff" }
      - { name: role_type, type: enum, source: input, description: "HOST | NPC", constraints: "HOST | NPC" }
      - { name: assignment_minutes, type: integer, source: computed, description: "(slot.ends_at - slot.starts_at) in minutes; pinned at assignment creation" }
      - { name: substitute_of_assignment_id, type: string, source: input, description: "If non-null, this assignment replaces a previously HANDED_OFF assignment; that assignment's substitute_of_assignment_id MUST be null (no chained substitution beyond depth 1)", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HANDED_OFF | ACTIVE | COMPLETED | CANCELLED", default: "SCHEDULED" }

  - name: Review
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: booking_id, type: string, source: system, description: "Source booking (review limited to Bookings in SETTLED state)" }
      - { name: author_player_id, type: string, source: system, description: "Equals booking.lead_player_id; one review per (booking, player)" }
      - { name: theme_score, type: integer, source: input, description: "1..5 stars on the theme dimension", constraints: "1..5" }
      - { name: host_score, type: integer, source: input, description: "1..5 stars on the host dimension. May be null if no HOST StaffAssignment was completed for the slot.", constraints: "null | 1..5" }
      - { name: venue_score, type: integer, source: input, description: "1..5 stars on the venue dimension", constraints: "1..5" }
      - { name: comment, type: string, source: input, description: "Free-form text up to 2000 chars" }
      - { name: spam_signal_count, type: integer, source: computed, description: "Number of anti-spam heuristics this review triggers (see §1.3 spam_score). Used by moderation queue ordering." }
      - { name: moderation_round, type: integer, source: computed, description: "Increments each time review re-enters PENDING_MODERATION after a REVISED transition; capped at MAX_MODERATION_ROUNDS", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING_MODERATION | PUBLISHED | REJECTED | REVISED | HIDDEN", default: "PENDING_MODERATION" }

  - name: SettlementRun
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: chain_id, type: string, source: input, description: "Chain being settled" }
      - { name: period_starts_at, type: datetime, source: input, description: "Inclusive lower bound (ISO 8601 UTC); closed-open [period_starts_at, period_ends_at)" }
      - { name: period_ends_at, type: datetime, source: input, description: "Exclusive upper bound", constraints: "period_ends_at > period_starts_at" }
      - { name: included_session_ids, type: array, source: computed, description: "Frozen list of SessionSlot ids whose schedule_status==COMPLETED at sweep time AND slot.ends_at falls in [period_starts_at, period_ends_at). Pinned at sweep run." }
      - { name: gross_total_cents, type: integer, source: computed, description: "Sum of net_revenue_cents over included_session_ids; pinned at run" }
      - { name: venue_payout_cents, type: integer, source: computed, description: "Sum of per-session venue allocation; see §1.3 settlement_allocation" }
      - { name: author_payout_cents, type: integer, source: computed, description: "Sum of per-session author allocation" }
      - { name: host_payout_cents, type: integer, source: computed, description: "Sum of per-session host allocation across that run" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Residual" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | REVERSED", default: "DRAFT" }

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: created_at, type: datetime, source: system, description: "Server timestamp" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID from the request that produced the entry" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role from the request" }
      - { name: subject_entity_type, type: enum, source: system, description: "Polymorphic subject", constraints: "Booking | Review | SettlementRun" }
      - { name: subject_entity_id, type: string, source: system, description: "Subject id" }
      - { name: action, type: enum, source: system, description: "Captured action", constraints: "BOOKING_CREATED | BOOKING_CANCELLED | BOOKING_NO_SHOW_MARKED | BOOKING_REFUNDED | REVIEW_SUBMITTED | REVIEW_PUBLISHED | REVIEW_REJECTED | REVIEW_HIDDEN | SETTLEMENT_FINALIZED | SETTLEMENT_REVERSED" }
      - { name: payload_snapshot, type: object, source: system, description: "Full pre/post snapshot of the subject entity at the moment of action; tamper-evident in v1 only by virtue of being append-only" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Theme (publication lifecycle, with revision branching) ----
  - entity: Theme
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /themes/{themeId}/publish"
        actor: ScriptAuthor
        preconditions:
          - "compatible_room_ids non-empty (ERR_THEME_NO_COMPATIBLE_ROOM)"
          - "min_players <= max_players (ERR_INVALID_REQUEST)"
        side_effects:
          - "Theme.current_version unchanged on first publish; remains 1"

      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /themes/{themeId}/publish-revision"
        actor: ScriptAuthor
        preconditions:
          - "Body field bumps_version=true (else ERR_INVALID_REQUEST)"
        side_effects:
          - "current_version += 1 (existing SessionSlots keep theme_version_pinned at the prior value; new slots pin the new version)"

      - from: [DRAFT, PUBLISHED]
        to: RETIRED
        trigger: "POST /themes/{themeId}/retire"
        actor: ScriptAuthor
        preconditions:
          - "No SessionSlot exists with theme_id == this theme AND schedule_status IN {SCHEDULED, LIVE} (ERR_THEME_HAS_FUTURE_SESSIONS)"
        side_effects: []

  # ---- Venue (lifecycle suspending sessions) ----
  - entity: Venue
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /venues/{venueId}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "All Rooms with status=ACTIVE remain ACTIVE (room status independent), but any SessionSlot with schedule_status=SCHEDULED in this venue auto-CANCELLED via cascade; cascade fires Booking->CANCELLED with cancellation_initiator=VENUE; deposits fully refunded (PRE_LIVE policy, §1.3)."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /venues/{venueId}/resume"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /venues/{venueId}/close"
        actor: PlatformAdmin
        preconditions:
          - "No SessionSlot in this venue with schedule_status IN {SCHEDULED, LIVE} (ERR_VENUE_HAS_OPEN_SESSIONS)"
        side_effects: []

  # ---- SessionSlot — TWO PARALLEL DIMENSIONS (schedule_status + match_status) ----
  - entity: SessionSlot
    initial_state: "schedule_status=SCHEDULED, match_status=OPEN"
    terminal_states: ["schedule_status=COMPLETED", "schedule_status=CANCELLED"]
    note: |
      SessionSlot has TWO independent state axes that evolve in parallel:
        Axis A (schedule_status): SCHEDULED -> LIVE -> COMPLETED, or SCHEDULED -> CANCELLED.
        Axis B (match_status):    OPEN -> MATCHED, or OPEN -> MATCH_FAILED.
      Cross-axis coupling: schedule_status=LIVE requires match_status=MATCHED (else
      ERR_SESSION_NOT_MATCHED). match_status auto-advances to MATCHED inside any
      Booking confirmation cascade once confirmed_seat_count >= required_seats_for_launch.
      match_status=MATCH_FAILED forces schedule_status=CANCELLED via cascade.
    transitions:
      # -- Axis A: schedule lifecycle --
      - from: "schedule_status=SCHEDULED"
        to: "schedule_status=LIVE"
        trigger: "POST /session-slots/{slotId}/start"
        actor: VenueOperator
        preconditions:
          - "match_status == MATCHED (ERR_SESSION_NOT_MATCHED)"
          - "now() in [starts_at - START_GRACE_MINUTES, starts_at + START_GRACE_MINUTES] (ERR_OUTSIDE_START_WINDOW)"
          - "Venue.status == ACTIVE (ERR_VENUE_NOT_ACTIVE)"
          - "All required HOST and NPC StaffAssignments in SCHEDULED or ACTIVE status (ERR_STAFFING_INCOMPLETE)"
        side_effects:
          - "All confirmed Bookings remain CONFIRMED until check-in"
          - "All HOST/NPC StaffAssignments still in SCHEDULED -> ACTIVE"

      - from: "schedule_status=LIVE"
        to: "schedule_status=COMPLETED"
        trigger: "POST /session-slots/{slotId}/complete"
        actor: VenueOperator
        preconditions:
          - "All HOST/NPC StaffAssignments now in ACTIVE or HANDED_OFF status (ERR_STAFFING_INCOMPLETE)"
        side_effects:
          - "All Bookings in CHECKED_IN status -> SETTLED (paid_amount_cents recognized; deposit released back to player)"
          - "All Bookings still in CONFIRMED at this point -> CANCELLED with cancellation_initiator=NO_SHOW (deposit FORFEITED to venue per no_show_penalty §1.3); Player.no_show_strikes incremented"
          - "All ACTIVE StaffAssignments -> COMPLETED"
          - "gross_revenue_cents and net_revenue_cents pinned"
          - "Reviews now permitted on SETTLED Bookings"

      - from: "schedule_status=SCHEDULED"
        to: "schedule_status=CANCELLED"
        trigger: "POST /session-slots/{slotId}/cancel  OR  cascade from Venue.SUSPEND  OR  cascade from match_status->MATCH_FAILED"
        actor: VenueOperator | system
        preconditions: []
        side_effects:
          - "match_status (if still OPEN or MATCHED) -> MATCH_FAILED only when triggered by match-deadline cascade; otherwise unchanged"
          - "All Bookings in PENDING_DEPOSIT or CONFIRMED -> CANCELLED with cancellation_initiator=VENUE (or SYSTEM_MATCH_FAIL when triggered by match-fail). Deposits fully refunded under PRE_LIVE policy (§1.3 cancellation_refund)."
          - "All WaitlistEntries in QUEUED for this slot -> EXPIRED"
          - "All StaffAssignments in SCHEDULED -> CANCELLED"

      # -- Axis B: matching lifecycle --
      - from: "match_status=OPEN"
        to: "match_status=MATCHED"
        trigger: "system (cascade from Booking confirmation when confirmed_seat_count >= required_seats_for_launch)"
        actor: system
        preconditions:
          - "schedule_status == SCHEDULED (cannot match a cancelled slot)"
          - "confirmed_seat_count >= required_seats_for_launch (post-confirmation)"
          - "Slot still within match window: now() < match_deadline_at"
        side_effects: []

      - from: "match_status=OPEN"
        to: "match_status=MATCH_FAILED"
        trigger: "system (clock advance past match_deadline_at while match_status=OPEN; fired by POST /_clock/advance scan)"
        actor: system
        preconditions:
          - "now() >= match_deadline_at"
          - "match_status == OPEN"
        side_effects:
          - "schedule_status SCHEDULED -> CANCELLED via cascade"
          - "All Bookings in PENDING_DEPOSIT or CONFIRMED -> CANCELLED with cancellation_initiator=SYSTEM_MATCH_FAIL; deposits fully refunded"
          - "All WaitlistEntries in QUEUED -> EXPIRED"

  # ---- Booking ----
  - entity: Booking
    initial_state: PENDING_DEPOSIT
    terminal_states: [SETTLED, CANCELLED, REFUNDED]
    transitions:
      - from: PENDING_DEPOSIT
        to: CONFIRMED
        trigger: "POST /bookings/{bookingId}/confirm-deposit  (idempotent on payment-system callback)"
        actor: Player | system
        preconditions:
          - "Slot.schedule_status == SCHEDULED (ERR_SESSION_NOT_OPEN_FOR_CONFIRM)"
          - "Slot.confirmed_seat_count + this booking.seat_count <= theme.max_players (ERR_SLOT_FULL) — re-checked atomically at confirm"
          - "Player.status == ACTIVE (ERR_PLAYER_BANNED) and no_show_strikes < NO_SHOW_BAN_THRESHOLD"
        side_effects:
          - "Slot.confirmed_seat_count += seat_count"
          - "If Slot.confirmed_seat_count >= Slot.required_seats_for_launch AND match_status==OPEN: cascade match_status->MATCHED"
          - "Emit AuditLogEntry(action=BOOKING_CREATED) (note: audit emitted at FIRST entry into CONFIRMED for this booking; idempotent re-confirm does not duplicate)"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{bookingId}/check-in"
        actor: VenueOperator
        preconditions:
          - "Slot.schedule_status == LIVE (ERR_SESSION_NOT_LIVE)"
        side_effects: []

      - from: CHECKED_IN
        to: SETTLED
        trigger: "system (cascade from POST /session-slots/{slotId}/complete)"
        actor: system
        preconditions: []
        side_effects:
          - "deposit_held_cents released back to player wallet (refund_total_cents += 0; deposit is NOT counted as refund)"
          - "Booking contributes paid_amount_cents to Slot.gross_revenue_cents"

      - from: [PENDING_DEPOSIT, CONFIRMED]
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel  OR  cascade from Slot CANCELLED  OR  cascade from Venue SUSPEND/CLOSE  OR  cascade from match_status->MATCH_FAILED  OR  no-show finalization"
        actor: Player | VenueOperator | system
        preconditions:
          - "If actor=Player: Slot.schedule_status IN {SCHEDULED} (ERR_BOOKING_NOT_CANCELLABLE_BY_PLAYER); player cancels disallowed once schedule_status=LIVE"
        side_effects:
          - "cancellation_initiator set per trigger (PLAYER | VENUE | SYSTEM_MATCH_FAIL | NO_SHOW)"
          - "Slot.confirmed_seat_count -= seat_count (if was CONFIRMED)"
          - "If match_status==MATCHED AND Slot.confirmed_seat_count post-decrement < required_seats_for_launch: match_status -> OPEN (DEMOTION; only valid while now() < match_deadline_at; if now() >= match_deadline_at the cascade flips match_status->MATCH_FAILED instead)"
          - "Refund applied per cancellation_refund (§1.3); refund_total_cents updated"
          - "Waitlist promotion sweep runs: top WaitlistEntry by (priority_class VIP first, then enqueued_at ASC) whose requested_seat_count <= newly freed seats is PROMOTED (creates a new Booking in PENDING_DEPOSIT); if no eligible entry, no-op"
          - "Emit AuditLogEntry(action=BOOKING_CANCELLED)"

      - from: SETTLED
        to: REFUNDED
        trigger: "POST /bookings/{bookingId}/refund  (post-session quality refund, e.g., theme malfunction)"
        actor: VenueOperator
        preconditions:
          - "Slot.schedule_status == COMPLETED (ERR_REFUND_REQUIRES_COMPLETED_SESSION)"
          - "Refund amount cents <= paid_amount_cents - refund_total_cents (ERR_REFUND_EXCEEDS_PAID)"
        side_effects:
          - "refund_total_cents += refund_amount_cents"
          - "Slot.net_revenue_cents -= refund_amount_cents"
          - "If a SettlementRun in FINALIZED status already covers Slot.id, that run's status flips to REVERSED (ERR is NOT raised; reversal cascades): venue_payout_cents/author_payout_cents/host_payout_cents/platform_fee_cents recomputed proportionally and a corrective entry is emitted as AuditLogEntry(action=SETTLEMENT_REVERSED)"
          - "Emit AuditLogEntry(action=BOOKING_REFUNDED)"

  # ---- WaitlistEntry ----
  - entity: WaitlistEntry
    initial_state: QUEUED
    terminal_states: [PROMOTED, EXPIRED, CANCELLED]
    transitions:
      - from: QUEUED
        to: PROMOTED
        trigger: "system (cascade from Booking.CANCEL freeing seats)"
        actor: system
        preconditions:
          - "Selected as winner by waitlist_promotion selector (§1.3)"
        side_effects:
          - "A new Booking row created in PENDING_DEPOSIT with seat_count=requested_seat_count and lead_player_id=this.lead_player_id; player has DEPOSIT_HOLD_TTL_MINUTES from this transition to confirm via POST /bookings/{id}/confirm-deposit, otherwise the new Booking is auto-CANCELLED (cascade from clock-advance scan; cancellation_initiator=SYSTEM_MATCH_FAIL note: encoded as SYSTEM_MATCH_FAIL since it is a system-driven non-player cancel) and waitlist promotion sweeps the next eligible entry"

      - from: QUEUED
        to: CANCELLED
        trigger: "POST /waitlist-entries/{entryId}/cancel"
        actor: Player
        preconditions:
          - "X-User-ID == lead_player_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []

      - from: QUEUED
        to: EXPIRED
        trigger: "system (cascade from Slot.CANCELLED or Slot.match_status -> MATCH_FAILED)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- StaffAssignment ----
  - entity: StaffAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (cascade from Slot start)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: HANDED_OFF
        trigger: "POST /staff-assignments/{assignmentId}/handoff  (with body {substitute_staff_member_id})"
        actor: VenueOperator
        preconditions:
          - "this.substitute_of_assignment_id == null (ERR_SUBSTITUTE_DEPTH_EXCEEDED — substitution depth max 1)"
          - "Slot.schedule_status == SCHEDULED (ERR_HANDOFF_AFTER_LIVE)"
          - "Substitute satisfies same role+qualification rules and weekly-minutes cap as original (ERR_STAFF_QUALIFICATION_MISMATCH or ERR_STAFF_WEEKLY_LIMIT_EXCEEDED)"
        side_effects:
          - "Creates a NEW StaffAssignment row in SCHEDULED with substitute_of_assignment_id=this.id"
          - "Original assignment.status -> HANDED_OFF"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (cascade from Slot.complete)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from Slot.CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Review (branching with revert: PENDING -> PUBLISHED | REJECTED -> REVISED -> PENDING) ----
  - entity: Review
    initial_state: PENDING_MODERATION
    terminal_states: [PUBLISHED, HIDDEN]
    transitions:
      - from: PENDING_MODERATION
        to: PUBLISHED
        trigger: "POST /reviews/{reviewId}/moderate  body={decision: APPROVE}"
        actor: ContentModerator
        preconditions:
          - "spam_signal_count < SPAM_SIGNAL_HARD_BLOCK (auto-reject path — see below)"
        side_effects:
          - "Theme.aggregated rating recomputed (see review_aggregate §1.3)"
          - "Emit AuditLogEntry(action=REVIEW_PUBLISHED)"

      - from: PENDING_MODERATION
        to: REJECTED
        trigger: "POST /reviews/{reviewId}/moderate  body={decision: REJECT}  OR  system (when spam_signal_count >= SPAM_SIGNAL_HARD_BLOCK at submission time)"
        actor: ContentModerator | system
        preconditions: []
        side_effects:
          - "Emit AuditLogEntry(action=REVIEW_REJECTED)"

      - from: REJECTED
        to: REVISED
        trigger: "PATCH /reviews/{reviewId}  body={comment, theme_score?, host_score?, venue_score?}"
        actor: Player
        preconditions:
          - "X-User-ID == author_player_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "moderation_round < MAX_MODERATION_ROUNDS (ERR_REVIEW_REVISION_LIMIT)"
        side_effects:
          - "moderation_round += 1"

      - from: REVISED
        to: PENDING_MODERATION
        trigger: "POST /reviews/{reviewId}/resubmit"
        actor: Player
        preconditions:
          - "X-User-ID == author_player_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "spam_signal_count recomputed against new content"

      - from: PUBLISHED
        to: HIDDEN
        trigger: "POST /reviews/{reviewId}/moderate  body={decision: HIDE}"
        actor: ContentModerator
        preconditions: []
        side_effects:
          - "Theme aggregated rating recomputed (review excluded going forward)"
          - "Emit AuditLogEntry(action=REVIEW_HIDDEN)"

  # ---- SettlementRun (linear with reversal) ----
  - entity: SettlementRun
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /settlement-runs/{runId}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "All included sessions have schedule_status==COMPLETED (ERR_SETTLEMENT_HAS_OPEN_SESSIONS)"
          - "venue_share_bps + author_royalty_bps + host_commission_bps + platform_fee_bps == 10000 for every venue covered (ERR_REVENUE_SPLIT_INVALID)"
        side_effects:
          - "All payout fields pinned (immutable hereafter unless REVERSED)"
          - "Emit AuditLogEntry(action=SETTLEMENT_FINALIZED)"

      - from: FINALIZED
        to: REVERSED
        trigger: "system (cascade from Booking SETTLED->REFUNDED for any booking whose slot is in included_session_ids)"
        actor: system
        preconditions: []
        side_effects:
          - "All payout fields recomputed using post-refund net_revenue_cents"
          - "Emit AuditLogEntry(action=SETTLEMENT_REVERSED)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two players race to book the last available seats on a PUBLIC_TEAMUP slot, each requesting >0 seats but together exceeding theme.max_players"
    guarantee: "At most one Booking moves to CONFIRMED such that Slot.confirmed_seat_count never exceeds theme.max_players; the loser is rejected"
    error_id: ERR_SLOT_FULL
    http_status: 409
    serialization: "First-writer-wins on Slot.confirmed_seat_count update; loser observes the post-winner count and is rejected"

  - scenario: "Player cancels a booking while VenueOperator simultaneously starts the session for the same slot"
    guarantee: "Exactly one operation succeeds; the other is rejected"
    error_id: ERR_SESSION_NOT_OPEN_FOR_CANCEL
    http_status: 409
    serialization: "First-writer-wins on Slot.schedule_status; if start wins (LIVE), player cancel sees schedule_status!=SCHEDULED and is rejected"

  - scenario: "Two VenueOperators race to assign the same StaffMember to two overlapping slots within the same chain"
    guarantee: "At most one StaffAssignment is created; the second is rejected because the staff member's interval would overlap"
    error_id: ERR_STAFF_OVERLAP_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on StaffAssignment creation; the loser observes the winning assignment's interval and is rejected"

  - scenario: "Two cancellations free seats simultaneously while a waitlist promotion sweep runs"
    guarantee: "At most one WaitlistEntry is PROMOTED per freed-seat block; double-promotion is prevented"
    error_id: ERR_WAITLIST_ALREADY_PROMOTED
    http_status: 409
    serialization: "First-writer-wins on WaitlistEntry.status; second sweep observing PROMOTED skips and continues to the next eligible entry"

  - scenario: "Refund and settlement-finalize race on the same SettlementRun draft"
    guarantee: "Exactly one wins; if finalize wins first, the refund flips the run to REVERSED via cascade. If refund wins first, finalize sees the revised net_revenue_cents and pins post-refund payouts."
    error_id: ERR_SETTLEMENT_ALREADY_FINALIZED
    http_status: 409
    serialization: "First-writer-wins on SettlementRun.status"

  - scenario: "Two ContentModerators moderate the same review concurrently"
    guarantee: "At most one moderation decision is recorded; the loser is rejected"
    error_id: ERR_REVIEW_ALREADY_MODERATED
    http_status: 409
    serialization: "First-writer-wins on Review.status leaving PENDING_MODERATION"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ----- (1) cancellation_refund — DUAL-VARIANT calculation #1 (Booking domain) -----
  - name: cancellation_refund
    trigger: "Booking PENDING_DEPOSIT|CONFIRMED -> CANCELLED  AND  Booking SETTLED -> REFUNDED"
    algorithm: threshold
    formula: |
      Let T_now  = clock now()
      Let T_start = Slot.starts_at
      Let lead_minutes = (T_start - T_now) in minutes (negative if past)

      Variant A — pre_live_player_cancel (cancellation_initiator == PLAYER, schedule_status was SCHEDULED):
        if lead_minutes >= FREE_CANCEL_LEAD_MINUTES (>= 1440):
          deposit_refund_cents = deposit_held_cents
          paid_refund_cents    = paid_amount_cents
        elif lead_minutes >= LATE_CANCEL_LEAD_MINUTES (>= 120):
          deposit_refund_cents = deposit_held_cents      # deposit fully refunded
          paid_refund_cents    = floor(paid_amount_cents * LATE_CANCEL_PAID_REFUND_BPS / 10000)
        else:  # lead_minutes < 120, including negative
          deposit_refund_cents = 0                       # deposit FORFEITED
          paid_refund_cents    = 0

      Variant B — venue_or_system_cancel (cancellation_initiator IN {VENUE, SYSTEM_MATCH_FAIL}):
        deposit_refund_cents = deposit_held_cents
        paid_refund_cents    = paid_amount_cents          # always 100% regardless of lead_minutes

      Variant C — no_show (cancellation_initiator == NO_SHOW, fired by Slot.complete cascade):
        deposit_refund_cents = 0                          # deposit FORFEITED to venue
        paid_refund_cents    = 0

      Variant D — post_session_quality_refund (Booking SETTLED -> REFUNDED, refund_amount_cents supplied by operator):
        deposit_refund_cents = 0                          # deposit was already released at SETTLED
        paid_refund_cents    = refund_amount_cents        # caller-supplied; capped at paid_amount_cents - existing refund_total_cents (else ERR_REFUND_EXCEEDS_PAID)

      Update: refund_total_cents += deposit_refund_cents + paid_refund_cents
      Update: Slot.net_revenue_cents = Slot.gross_revenue_cents - sum(refund_total_cents over slot's REFUNDED|partially-refunded SETTLED bookings) — recomputed eagerly on each transition.
    input_set: "Bookings whose status transitions into CANCELLED or REFUNDED in this request; lead_minutes computed against the stored Slot.starts_at, never the wall clock at PRD-read time."
    constants:
      FREE_CANCEL_LEAD_MINUTES: 1440        # 24 hours
      LATE_CANCEL_LEAD_MINUTES: 120         # 2 hours
      LATE_CANCEL_PAID_REFUND_BPS: 5000     # 50% of paid_amount_cents
    precision: "integer cents; floor() at the only multiplication site (paid_amount * LATE_CANCEL_PAID_REFUND_BPS / 10000)"
    variants:
      - name: pre_live_player_cancel
        when: "cancellation_initiator == PLAYER, schedule_status was SCHEDULED, lead_minutes determines tier"
        difference: "Three lead-time tiers (>=1440, >=120, <120) producing distinct refund amounts"
      - name: venue_or_system_cancel
        when: "cancellation_initiator IN {VENUE, SYSTEM_MATCH_FAIL}"
        difference: "Always 100% refund of deposit + paid"
      - name: no_show
        when: "cancellation_initiator == NO_SHOW (cascade from Slot.complete on a CONFIRMED booking that never CHECKED_IN)"
        difference: "Zero refund — deposit forfeited, paid forfeited; Player.no_show_strikes incremented"
      - name: post_session_quality_refund
        when: "Operator-driven refund post-completion"
        difference: "Caller supplies refund_amount_cents; cascades to SettlementRun reversal if covered"

  # ----- (2) settlement_allocation — Combinatorial mode (a): tiered + multi-input non-linear -----
  - name: settlement_allocation
    trigger: "POST /settlement-runs/{runId}/finalize  AND  cascade Booking SETTLED -> REFUNDED reversal"
    algorithm: tiered_pricing
    formula: |
      For each session S in included_session_ids (per-session allocation):
        net_S = max(0, S.net_revenue_cents)              # never negative

        # Step 1 — author royalty bps (theme override beats venue default)
        author_bps_S = (S.theme.author_royalty_bps_override
                          if S.theme.author_royalty_bps_override is not null
                          else S.venue.author_royalty_bps)

        # Step 2 — host commission bps with PER-STAFF override (only HOST role; NPCs are NOT paid commission, paid via flat venue payroll out of venue share)
        # Tie-break when multiple HOST StaffAssignments completed: pick the one whose substitute chain ENDS at COMPLETED, by min(assignment.created_at).
        host_assignment = pick HOST StaffAssignment for S where status==COMPLETED, ordered by created_at ASC, take first.
        host_bps_S = (host_assignment.staff_member.commission_bps_override
                          if host_assignment is not null and override is not null
                          else S.venue.host_commission_bps)
        if host_assignment is null:
          host_bps_S = 0   # host cut redistributes to platform_fee in this session

        # Step 3 — venue share is the residual to make tiers sum to 10000 BUT NOT below 0:
        venue_bps_S = max(0, 10000 - author_bps_S - host_bps_S - S.venue.platform_fee_bps)
        if venue_bps_S == 0 AND author_bps_S + host_bps_S + S.venue.platform_fee_bps > 10000:
          REJECT (ERR_REVENUE_SPLIT_INVALID)

        # Step 4 — per-session allocation (round each tier down, give residual to platform)
        author_S = floor(net_S * author_bps_S / 10000)
        host_S   = floor(net_S * host_bps_S   / 10000)
        venue_S  = floor(net_S * venue_bps_S  / 10000)
        platform_S = net_S - author_S - host_S - venue_S   # absorbs rounding residue (always >=0)

      # Step 5 — run totals: sum the per-session pieces (NOT sum-then-allocate)
      gross_total_cents   = sum(S.net_revenue_cents) over included sessions
      author_payout_cents = sum(author_S)
      host_payout_cents   = sum(host_S)
      venue_payout_cents  = sum(venue_S)
      platform_fee_cents  = sum(platform_S)

      Invariant pinned: gross_total_cents == author_payout_cents + host_payout_cents + venue_payout_cents + platform_fee_cents.
    input_set: "All SessionSlots S where S.schedule_status==COMPLETED AND S.ends_at in [period_starts_at, period_ends_at). Frozen into included_session_ids at sweep time."
    constants:
      RESIDUAL_RECIPIENT: platform        # rounding residue goes to platform tier, not venue
    precision: "All BPS multiplications floor()ed; per-session loop pins the rounding boundary so 'sum-then-floor' is forbidden — must be 'floor-then-sum'."
    variants:
      - name: per_session_floor_then_sum
        when: "Default and only valid order for v1"
        difference: "(0.6 cents per session × 1000 sessions = 600 dropped cents) vs sum-then-floor (drops at most 0.99 cents total). The pinned 'per-session floor then sum, residue to platform' rule is what makes the answer well-defined."

  # ----- (3) waitlist_promotion — Selector policy (combinatorial mode (a): formula with non-linear interaction) -----
  - name: waitlist_promotion
    trigger: "Booking PENDING_DEPOSIT|CONFIRMED -> CANCELLED  (any cancel that frees seats)  OR  POST /waitlist-entries/{entryId}/cancel cascading to nothing  OR  promoted booking auto-cancels at TTL"
    algorithm: waterfall_allocation
    formula: |
      Let freed_seats = (number of seats released by the cancellation).
      Candidate set:   E = WaitlistEntry rows where slot_id == cancelled.slot_id AND status == QUEUED.

      Eligibility filter (each entry e in E):
        e.requested_seat_count <= remaining_capacity_after_cancel

      Ranking expression (sort key):
        primary_key   = (priority_class == VIP) ? 0 : 1   (VIP first)
        secondary_key = enqueued_at ASC                    (FIFO within priority class)

      Tie-break:
        If two entries share priority_class AND enqueued_at to the millisecond, break ties by lexicographic ASC of entry.id.

      Selection:
        winner = first(sorted(E_eligible, by primary_key, secondary_key, tie_break))
        If no eligible entry: STOP (no promotion).
        Else: winner.status -> PROMOTED; create Booking(seat_count=winner.requested_seat_count, status=PENDING_DEPOSIT).
        Reduce remaining_capacity_after_cancel -= winner.requested_seat_count.
        Repeat with the remaining entries until no eligible entry remains.

      Empty-pool fallback:
        Promotion sweep is a no-op; cancellation still completes.
    input_set: "WaitlistEntry rows for the affected slot in QUEUED status; ordering pinned as above."
    constants:
      DEPOSIT_HOLD_TTL_MINUTES: 15        # promoted booking must confirm-deposit within 15 minutes or auto-cancel
    precision: "Integer seat count; no rounding."

  # ----- (4) match_quorum — DUAL-VARIANT calculation #2 (SessionSlot domain) -----
  - name: match_quorum
    trigger: "Booking confirmation cascade  AND  Booking cancellation demoting confirmed_seat_count below threshold  AND  POST /_clock/advance scan for match_deadline crossings"
    algorithm: threshold
    formula: |
      Let n = SessionSlot.confirmed_seat_count.
      Let R = SessionSlot.required_seats_for_launch.
      Let D = SessionSlot.match_deadline_at = SessionSlot.starts_at - MATCH_CUTOFF_MINUTES.
      Let now = clock.now().

      Variant A — pre_deadline (now < D):
        if match_status == OPEN     and n >= R:  match_status -> MATCHED
        if match_status == MATCHED  and n <  R:  match_status -> OPEN  (DEMOTION; allowed only while now < D)

      Variant B — at_or_post_deadline (now >= D), evaluated on POST /_clock/advance:
        if match_status == OPEN: match_status -> MATCH_FAILED   (regardless of n; the OPEN state at the deadline is decisive)
        if match_status == MATCHED:  no change (the match locked in pre-deadline; later cancellations do NOT flip it back to OPEN; they instead trigger Slot.cancel)
    input_set: "Single SessionSlot's confirmed_seat_count and required_seats_for_launch; clock from POST /_clock/advance latest tick."
    constants:
      MATCH_CUTOFF_MINUTES: 60            # match_deadline_at = starts_at - 60 min
    precision: "Integer seat count; clock comparison uses ISO 8601 UTC at second granularity."
    variants:
      - name: pre_deadline_quorum
        when: "now < match_deadline_at — match_status can demote OPEN<->MATCHED freely"
        difference: "Confirmation/cancellation each re-evaluate quorum and may flip match_status"
      - name: at_or_post_deadline_lock
        when: "now >= match_deadline_at — only one transition path remains"
        difference: "OPEN->MATCH_FAILED if still OPEN; MATCHED is sticky (no demotion); identical (n,R) inputs as pre-deadline produce a different outcome"

  # ----- (5) review_aggregate — Combinatorial mode (b): nested rounding order matters -----
  - name: review_aggregate
    trigger: "Review PENDING_MODERATION -> PUBLISHED  AND  Review PUBLISHED -> HIDDEN"
    algorithm: aggregation
    formula: |
      For each Theme T and per-dimension d in {theme_score, host_score, venue_score}:
        Source set R_d(T) = Reviews where booking.slot.theme_id == T.id AND status == PUBLISHED AND d_score is not null.

        # Pinned order — PER-REVIEW ROUND, THEN AVERAGE, THEN ROUND.
        # Step 1 — keep each review's d_score as integer 1..5 (already integer; no round)
        # Step 2 — sum_d = sum(d_score for r in R_d(T))
        # Step 3 — count_d = len(R_d(T))
        # Step 4 — if count_d == 0: T.aggregated_d = null
        #          else:           T.aggregated_d = round_half_up(sum_d / count_d * 10) / 10   # one-decimal place

      Pinned order = "sum-then-divide-then-round-to-one-decimal." The forbidden alternative is "round each review's contribution to one decimal first then average," which yields a different number when counts are not powers of 2 (e.g., 3 reviews of {3,4,5}: pinned = round_half_up(12/3 * 10)/10 = 4.0; forbidden interpretation rounds 3.0/3.0+4.0/3.0+5.0/3.0 = 0.999... at each step and accumulates differently).
    input_set: "PUBLISHED reviews only; HIDDEN and PENDING_MODERATION/REJECTED/REVISED reviews are EXCLUDED from aggregates. A HIDE transition removes a review from the source set on next aggregate write; aggregates are recomputed eagerly on every Review state change touching {PUBLISHED, HIDDEN}."
    constants:
      ROUNDING: round_half_up
      DECIMAL_PLACES: 1
    precision: "1 decimal place, round_half_up"

  # ----- (6) spam_score — Combinatorial mode (c): circular-looking dependency, evaluation order pinned -----
  - name: spam_score
    trigger: "POST /reviews (creation)  AND  POST /reviews/{reviewId}/resubmit"
    algorithm: weighted_scoring
    formula: |
      Let count = spam_signal_count (computed in pinned step order; the score depends on author tier which itself depends on prior spam decisions — see Step 4):

      Step 1 — Length signal: comment.length < SHORT_COMMENT_THRESHOLD (50 chars)?  count += 1
      Step 2 — Repetition signal: count of reviews by author_player_id in last 24h with same theme_id  >= REPEAT_REVIEW_THRESHOLD (3)?  count += 1
      Step 3 — Score-spread signal: max(theme_score, venue_score) - min(theme_score, venue_score) >= SCORE_SPREAD_THRESHOLD (3)?  count += 1
      Step 4 — Tier signal: author has a prior REJECTED review whose moderation_round >= 1?  count += 1
                — Note: this step runs on the CURRENT REJECTED count snapshot AS OF the start of this calculation; it does NOT include the review being submitted (avoids self-reference loop).
      Step 5 — Resubmission signal: this is a resubmit AND moderation_round > 0?  count += 1

      Final spam_signal_count = count.
      Auto-decision routing:
        if count >= SPAM_SIGNAL_HARD_BLOCK (4):  Review.status -> REJECTED immediately at submission/resubmit (cascade; no moderator action required)
        elif count >= SPAM_SIGNAL_SOFT (2):     Review enters PENDING_MODERATION with priority flag (ordering only)
        else:                                  Review enters PENDING_MODERATION normally

      Evaluation order is fixed Step1 -> Step5; reordering changes Step 4's snapshot and therefore the final count. The formula has a circular-looking shape because Step 4 reads the count of REJECTED reviews — which itself depends on prior spam_score evaluations — but the pin "snapshot before Step 1" makes the result well-defined.
    input_set: "The single Review being submitted/resubmitted, plus the author's review history at evaluation start."
    constants:
      SHORT_COMMENT_THRESHOLD: 50
      REPEAT_REVIEW_THRESHOLD: 3
      SCORE_SPREAD_THRESHOLD: 3
      SPAM_SIGNAL_SOFT: 2
      SPAM_SIGNAL_HARD_BLOCK: 4
      MAX_MODERATION_ROUNDS: 3

  # ----- (7) staff_weekly_minutes — Aggregation with explicit window/filter (supports validation) -----
  - name: staff_weekly_minutes
    trigger: "POST /staff-assignments  AND  POST /staff-assignments/{id}/handoff"
    algorithm: aggregation
    formula: |
      For each StaffMember S and proposed StaffAssignment A:
        iso_week = ISO week containing A.slot.starts_at, computed in S.chain's representative venue timezone (use the FIRST Venue in the chain by Venue.created_at ASC for tie-break determinism — note: chains rarely span timezones in practice).
        existing_minutes = sum(assignment.assignment_minutes
                                for assignment in S's StaffAssignments
                                where assignment.status IN {SCHEDULED, ACTIVE, COMPLETED}
                                  AND ISO week of assignment.slot.starts_at == iso_week
                                  AND assignment.id != A.id)
        proposed_minutes = A.assignment_minutes
        if existing_minutes + proposed_minutes > S.max_weekly_minutes:
          REJECT with ERR_STAFF_WEEKLY_LIMIT_EXCEEDED
    input_set: "StaffAssignments in SCHEDULED, ACTIVE, or COMPLETED status; HANDED_OFF and CANCELLED EXCLUDED. The HANDED_OFF original assignment's minutes are NOT counted (its substitute already counts)."
    constants:
      ISO_WEEK_TIMEZONE: "Resolved per-chain via first Venue's timezone, then ISO week (Mon..Sun)"
    precision: "Integer minutes."

  # ----- (8) staff_overlap — Interval geometry distinct from session-slot overlap -----
  - name: staff_overlap
    trigger: "POST /staff-assignments  AND  POST /staff-assignments/{id}/handoff"
    algorithm: interval_merge
    formula: |
      Two StaffAssignments A and B for the SAME staff_member_id collide iff:
        max(A.slot.starts_at, B.slot.starts_at) < min(A.slot.ends_at, B.slot.ends_at)         # closed-open intervals; touching is OK (allowed back-to-back)
      No buffer minutes between assignments (a host CAN go directly from one slot to another at the same venue or across venues in the same chain — staffing buffer is NOT modeled in v1).
      Status filter: only count B in {SCHEDULED, ACTIVE} (HANDED_OFF, COMPLETED, CANCELLED do not block).
    input_set: "All StaffAssignments for the proposed staff_member_id"
    constants: {}
    precision: "Second-granularity ISO timestamps."

  # ----- (9) session_slot_overlap — Different interval semantics from staff_overlap -----
  - name: session_slot_overlap
    trigger: "POST /rooms/{roomId}/session-slots  AND  POST /rooms/{roomId}/maintenance-windows"
    algorithm: interval_merge
    formula: |
      For a proposed SessionSlot P at room R with theme T:
        # Compute proposed interval INCLUDING turnover gap AFTER the slot:
        P_start  = P.starts_at
        P_finish = P.ends_at + R.turnover_minutes  (turnover applies as a forward-extending exclusive guard)

      Conflict iff exists existing item X on the same room where X.schedule_status IN {SCHEDULED, LIVE} (for slots) OR X.status IN {SCHEDULED, ACTIVE} (for maintenance), AND:
        X_start  = X.starts_at
        X_finish = (X is SessionSlot) ? X.ends_at + R.turnover_minutes : X.ends_at  # maintenance does not get turnover applied

        max(P_start, X_start) < min(P_finish, X_finish)    # closed-open with turnover-extended end on both sides for slots only

      Result: REJECT with ERR_SLOT_OVERLAP_CONFLICT (slot vs slot or slot vs maintenance) or ERR_MAINTENANCE_OVERLAP_CONFLICT (maintenance vs slot or vs maintenance).

      Differs from staff_overlap because:
        (a) turnover_minutes asymmetric guard is added to the END of slots (and not maintenance), an aggregate-capacity-style edge geometry,
        (b) maintenance-vs-slot uses a one-sided turnover (slot side only), a third hybrid case absent from staff_overlap.
    input_set: "Existing SessionSlots and MaintenanceWindows on the same room"
    constants: {}
    precision: "Second-granularity ISO timestamps."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-segment ids exist (validated left-to-right: venueId, then roomId, then slotId / maintenanceId / bookingId / etc.)"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_THEME_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_WAITLIST_ENTRY_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_STAFF_ASSIGNMENT_NOT_FOUND | ERR_SETTLEMENT_RUN_NOT_FOUND | ERR_PLAYER_NOT_FOUND"
    http_status: 404
    applies_to: all nested-resource endpoints

  - priority: 4
    category: state
    check: "Venue.status==ACTIVE for any mutation under that venue (creating Rooms/Slots/Maintenance/Bookings)"
    error_id: ERR_VENUE_NOT_ACTIVE
    http_status: 409
    applies_to: "venue-scoped mutations"

  - priority: 5
    category: state
    check: "Target resource state allows operation (Slot.schedule_status, Booking.status, Review.status, etc.)"
    error_id: "ERR_SESSION_NOT_OPEN_FOR_CONFIRM | ERR_SESSION_NOT_OPEN_FOR_CANCEL | ERR_SESSION_NOT_LIVE | ERR_SESSION_NOT_MATCHED | ERR_BOOKING_NOT_CANCELLABLE_BY_PLAYER | ERR_REFUND_REQUIRES_COMPLETED_SESSION | ERR_REVIEW_REVISION_LIMIT | ERR_THEME_HAS_FUTURE_SESSIONS | ERR_VENUE_HAS_OPEN_SESSIONS | ERR_HANDOFF_AFTER_LIVE | ERR_SETTLEMENT_HAS_OPEN_SESSIONS | ERR_SETTLEMENT_ALREADY_FINALIZED | ERR_REVIEW_ALREADY_MODERATED | ERR_WAITLIST_ALREADY_PROMOTED"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-entity reference resolvability: Theme.compatible_room_ids must include slot's room_id; StaffMember.chain_id must equal slot's venue.chain_id; SettlementRun.chain_id must match included sessions' venue.chain_id"
    error_id: "ERR_THEME_ROOM_INCOMPATIBLE | ERR_STAFF_CHAIN_MISMATCH | ERR_SETTLEMENT_CHAIN_MISMATCH"
    http_status: 422
    applies_to: "POST /rooms/{id}/session-slots, POST /staff-assignments, POST /settlement-runs"

  - priority: 7
    category: business_safety
    check: "Player banned or strike-count over threshold (Player.no_show_strikes >= NO_SHOW_BAN_THRESHOLD)"
    error_id: ERR_PLAYER_BANNED
    http_status: 403
    applies_to: "POST /session-slots/{id}/bookings, POST /session-slots/{id}/waitlist-entries"

  - priority: 8
    category: business_safety
    check: "Match preferences enforced when slot.visibility==PUBLIC_TEAMUP: incoming player's gender/age/experience must satisfy slot's preference filter (see §1.5 endpoint body)"
    error_id: ERR_MATCH_PREFERENCE_REJECTED
    http_status: 422
    applies_to: "POST /session-slots/{id}/bookings (PUBLIC_TEAMUP slots only)"

  - priority: 9
    category: business_temporal
    check: "session_slot_overlap (§1.3): proposed SessionSlot or MaintenanceWindow must not collide with existing items on the same room (turnover-aware)"
    error_id: "ERR_SLOT_OVERLAP_CONFLICT | ERR_MAINTENANCE_OVERLAP_CONFLICT"
    http_status: 409
    applies_to: "POST /rooms/{id}/session-slots, POST /rooms/{id}/maintenance-windows"

  - priority: 10
    category: business_temporal
    check: "staff_overlap (§1.3): same StaffMember must not have overlapping assignments"
    error_id: ERR_STAFF_OVERLAP_CONFLICT
    http_status: 409
    applies_to: "POST /staff-assignments, POST /staff-assignments/{id}/handoff"

  - priority: 11
    category: business_constraint
    check: "Staff qualification: slot.theme.required_host_qualifications subset_of staff.qualifications (HOST role); for NPC role, slot.theme.required_npc_count must be filled by NPC-eligible staff"
    error_id: ERR_STAFF_QUALIFICATION_MISMATCH
    http_status: 422
    applies_to: "POST /staff-assignments"

  - priority: 12
    category: business_constraint
    check: "staff_weekly_minutes (§1.3): proposed assignment + existing in-status SCHEDULED|ACTIVE|COMPLETED assignments same ISO week <= max_weekly_minutes"
    error_id: ERR_STAFF_WEEKLY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /staff-assignments, POST /staff-assignments/{id}/handoff"

  - priority: 13
    category: business_constraint
    check: "Substitution depth: handoff target must have substitute_of_assignment_id == null (depth 1 only)"
    error_id: ERR_SUBSTITUTE_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /staff-assignments/{id}/handoff"

  - priority: 14
    category: business_constraint
    check: "Slot capacity: new booking would not push confirmed_seat_count above theme.max_players"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /session-slots/{id}/bookings, POST /bookings/{id}/confirm-deposit"

  - priority: 15
    category: business_constraint
    check: "Theme content reference: slot's theme.status==PUBLISHED at slot creation (DRAFT or RETIRED themes cannot back new slots)"
    error_id: ERR_THEME_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /rooms/{id}/session-slots"

  - priority: 16
    category: business_constraint
    check: "Review eligibility: booking.status == SETTLED AND no prior Review by author_player_id for this booking"
    error_id: "ERR_REVIEW_NOT_ELIGIBLE | ERR_REVIEW_DUPLICATE"
    http_status: 422
    applies_to: "POST /bookings/{id}/reviews"

  - priority: 17
    category: business_fiscal
    check: "Revenue split bps sum: venue_share + author_royalty + host_commission + platform_fee == 10000 (also re-checked per-session at settlement when overrides apply)"
    error_id: ERR_REVENUE_SPLIT_INVALID
    http_status: 422
    applies_to: "POST /venues, PATCH /venues/{id}, POST /settlement-runs/{id}/finalize"

  - priority: 18
    category: business_fiscal
    check: "Refund amount cap: refund_amount_cents <= paid_amount_cents - existing refund_total_cents"
    error_id: ERR_REFUND_EXCEEDS_PAID
    http_status: 422
    applies_to: "POST /bookings/{id}/refund"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Venue ----
  - { method: POST,   path: "/venues",                                description: "Create venue",                          roles: [PlatformAdmin],                       code: 201, input: [chain_id, name, "timezone?", business_hours, deposit_policy_cents, revenue_share_bps, author_royalty_bps, host_commission_bps, platform_fee_bps], output: Venue, side_effects: ["Validates revenue split sum == 10000"] }
  - { method: GET,    path: "/venues",                                description: "List venues",                           roles: [PlatformAdmin, VenueOperator, Player], code: 200, input: ["chain_id?", "limit?", "offset?"], output: "Venue[]", side_effects: [] }
  - { method: GET,    path: "/venues/{venueId}",                      description: "Get venue",                             roles: [PlatformAdmin, VenueOperator, Player], code: 200, input: [], output: Venue, side_effects: [] }
  - { method: PATCH,  path: "/venues/{venueId}",                      description: "Update venue (revenue split, hours, deposit policy)", roles: [PlatformAdmin], code: 200, input: ["business_hours?", "deposit_policy_cents?", "revenue_share_bps?", "author_royalty_bps?", "host_commission_bps?", "platform_fee_bps?", "version?"], output: Venue, side_effects: ["Re-validates split sum == 10000"] }
  - { method: POST,   path: "/venues/{venueId}/suspend",              description: "Suspend venue",                         roles: [PlatformAdmin], code: 200, input: [], output: Venue, side_effects: ["Cascade-cancel SCHEDULED slots and PENDING/CONFIRMED bookings under this venue"] }
  - { method: POST,   path: "/venues/{venueId}/resume",               description: "Resume venue",                          roles: [PlatformAdmin], code: 200, input: [], output: Venue, side_effects: [] }
  - { method: POST,   path: "/venues/{venueId}/close",                description: "Close venue (terminal)",                roles: [PlatformAdmin], code: 200, input: [], output: Venue, side_effects: ["Rejects if any open sessions remain"] }

  # ---- Room ----
  - { method: POST,   path: "/venues/{venueId}/rooms",                description: "Create room",                           roles: [VenueOperator],                code: 201, input: [name, capacity_min, capacity_max, "turnover_minutes?"], output: Room, side_effects: [] }
  - { method: GET,    path: "/venues/{venueId}/rooms",                description: "List rooms in venue",                   roles: [PlatformAdmin, VenueOperator, Player], code: 200, input: ["limit?", "offset?"], output: "Room[]", side_effects: [] }
  - { method: GET,    path: "/venues/{venueId}/rooms/{roomId}",       description: "Get room",                              roles: [PlatformAdmin, VenueOperator, Player], code: 200, input: [], output: Room, side_effects: [] }

  # ---- MaintenanceWindow ----
  - { method: POST,   path: "/venues/{venueId}/rooms/{roomId}/maintenance-windows", description: "Create maintenance window", roles: [VenueOperator], code: 201, input: [starts_at, ends_at, "reason?"], output: MaintenanceWindow, side_effects: ["session_slot_overlap check (§1.3) — rejects on overlap with existing slots/maintenance"] }
  - { method: GET,    path: "/venues/{venueId}/rooms/{roomId}/maintenance-windows", description: "List maintenance windows on room", roles: [PlatformAdmin, VenueOperator, Player], code: 200, input: ["limit?", "offset?"], output: "MaintenanceWindow[]", side_effects: [] }

  # ---- Theme ----
  - { method: POST,   path: "/themes",                                description: "Create theme (DRAFT)",                  roles: [ScriptAuthor],                 code: 201, input: [chain_id, title, genre, difficulty, duration_minutes, min_players, max_players, "required_host_qualifications?", "required_npc_count?", compatible_room_ids, base_price_cents, "author_royalty_bps_override?"], output: Theme, side_effects: ["status=DRAFT, current_version=1"] }
  - { method: POST,   path: "/themes/{themeId}/publish",              description: "Publish theme",                         roles: [ScriptAuthor],                 code: 200, input: [], output: Theme, side_effects: ["status -> PUBLISHED"] }
  - { method: POST,   path: "/themes/{themeId}/publish-revision",     description: "Publish a revised version (bumps current_version)", roles: [ScriptAuthor], code: 200, input: [bumps_version], output: Theme, side_effects: ["current_version += 1; existing slots keep prior pinned version"] }
  - { method: POST,   path: "/themes/{themeId}/retire",               description: "Retire theme",                          roles: [ScriptAuthor],                 code: 200, input: [], output: Theme, side_effects: ["Rejects if open sessions reference this theme"] }
  - { method: GET,    path: "/themes/{themeId}",                      description: "Get theme",                             roles: [PlatformAdmin, VenueOperator, ScriptAuthor, Player], code: 200, input: [], output: Theme, side_effects: [] }
  - { method: GET,    path: "/themes",                                description: "List themes",                           roles: [PlatformAdmin, VenueOperator, ScriptAuthor, Player], code: 200, input: ["chain_id?", "limit?", "offset?"], output: "Theme[]", side_effects: [] }

  # ---- SessionSlot ----
  - { method: POST,   path: "/venues/{venueId}/rooms/{roomId}/session-slots", description: "Create session slot", roles: [VenueOperator], code: 201, input: [theme_id, starts_at, "price_cents?", visibility, required_seats_for_launch, "match_preferences?"], output: SessionSlot, side_effects: ["theme_version_pinned set; ends_at computed; schedule_status=SCHEDULED, match_status=OPEN; match_deadline_at = starts_at - 60 min; session_slot_overlap check"] }
  - { method: GET,    path: "/venues/{venueId}/rooms/{roomId}/session-slots", description: "List slots on room", roles: [PlatformAdmin, VenueOperator, Player], code: 200, input: ["limit?", "offset?", "starts_after?", "starts_before?"], output: "SessionSlot[]", side_effects: [] }
  - { method: GET,    path: "/session-slots/{slotId}",                description: "Get slot",                              roles: [PlatformAdmin, VenueOperator, Player], code: 200, input: [], output: SessionSlot, side_effects: [] }
  - { method: POST,   path: "/session-slots/{slotId}/start",          description: "Start session (LIVE)",                  roles: [VenueOperator], code: 200, input: [], output: SessionSlot, side_effects: ["schedule_status -> LIVE; cascading staff ACTIVE"] }
  - { method: POST,   path: "/session-slots/{slotId}/complete",       description: "Complete session",                      roles: [VenueOperator], code: 200, input: [], output: SessionSlot, side_effects: ["Cascade: SETTLED bookings, NO_SHOW for unchecked-in CONFIRMED, staff COMPLETED"] }
  - { method: POST,   path: "/session-slots/{slotId}/cancel",         description: "Operator-cancel a session",             roles: [VenueOperator], code: 200, input: [], output: SessionSlot, side_effects: ["Cascade: bookings CANCELLED with cancellation_initiator=VENUE; waitlist EXPIRED; staff CANCELLED"] }

  # ---- Booking ----
  - { method: POST,   path: "/session-slots/{slotId}/bookings",       description: "Create booking",                        roles: [Player], code: 201, input: [team_player_ids], output: Booking, side_effects: ["seat_count, paid_amount_cents, deposit_held_cents pinned; status=PENDING_DEPOSIT; ERR_PLAYER_BANNED + ERR_MATCH_PREFERENCE_REJECTED + ERR_SLOT_FULL checked"] }
  - { method: POST,   path: "/bookings/{bookingId}/confirm-deposit",  description: "Confirm deposit (idempotent on payment-system callback; same booking_id + same idempotency_key => same response)", roles: [Player, PaymentGateway], code: 200, input: ["idempotency_key?"], output: Booking, side_effects: ["status -> CONFIRMED; cascade match_status if quorum reached"] }
  - { method: POST,   path: "/bookings/{bookingId}/cancel",           description: "Cancel booking (player or operator)",   roles: [Player, VenueOperator], code: 200, input: [], output: Booking, side_effects: ["Refund per cancellation_refund (§1.3); waitlist promotion sweep; possible match demotion; AuditLogEntry"] }
  - { method: POST,   path: "/bookings/{bookingId}/check-in",         description: "Check in players for live session",     roles: [VenueOperator], code: 200, input: [], output: Booking, side_effects: ["status PENDING/CONFIRMED -> CHECKED_IN; requires Slot LIVE"] }
  - { method: POST,   path: "/bookings/{bookingId}/refund",           description: "Post-session refund",                   roles: [VenueOperator], code: 200, input: [refund_amount_cents], output: Booking, side_effects: ["status SETTLED -> REFUNDED; cascade SettlementRun reversal if covered; AuditLogEntry"] }
  - { method: GET,    path: "/bookings/{bookingId}",                  description: "Get booking",                           roles: [Player, VenueOperator, PlatformAdmin], code: 200, input: [], output: Booking, side_effects: [] }

  # ---- WaitlistEntry ----
  - { method: POST,   path: "/session-slots/{slotId}/waitlist-entries", description: "Enqueue on waitlist",                 roles: [Player], code: 201, input: [requested_seat_count], output: WaitlistEntry, side_effects: ["priority_class pinned from Player.tier; enqueued_at = server now"] }
  - { method: POST,   path: "/waitlist-entries/{entryId}/cancel",      description: "Cancel waitlist entry",                roles: [Player], code: 200, input: [], output: WaitlistEntry, side_effects: ["status -> CANCELLED; no refund (no deposit held on waitlist)"] }
  - { method: GET,    path: "/session-slots/{slotId}/waitlist-entries", description: "List waitlist for slot",              roles: [Player, VenueOperator], code: 200, input: ["limit?", "offset?"], output: "WaitlistEntry[]", side_effects: [] }

  # ---- Player ----
  - { method: POST,   path: "/players",                               description: "Register player",                       roles: [Player, PlatformAdmin], code: 201, input: [display_name, gender, age, experience_level, "tier?"], output: Player, side_effects: [] }
  - { method: GET,    path: "/players/{playerId}",                    description: "Get player",                            roles: [Player, VenueOperator, PlatformAdmin], code: 200, input: [], output: Player, side_effects: [] }

  # ---- StaffMember ----
  - { method: POST,   path: "/staff-members",                         description: "Register staff member",                 roles: [PlatformAdmin], code: 201, input: [chain_id, display_name, roles_held, qualifications, "max_weekly_minutes?", "commission_bps_override?"], output: StaffMember, side_effects: [] }
  - { method: GET,    path: "/staff-members/{staffId}",               description: "Get staff member",                      roles: [PlatformAdmin, VenueOperator, Host, NPC], code: 200, input: [], output: StaffMember, side_effects: [] }

  # ---- StaffAssignment ----
  - { method: POST,   path: "/staff-assignments",                     description: "Assign staff to a slot",                roles: [VenueOperator], code: 201, input: [slot_id, staff_member_id, role_type], output: StaffAssignment, side_effects: ["assignment_minutes pinned; full validation cascade (qualification, weekly_minutes, overlap)"] }
  - { method: POST,   path: "/staff-assignments/{assignmentId}/handoff", description: "Hand off to substitute",            roles: [VenueOperator], code: 200, input: [substitute_staff_member_id], output: StaffAssignment, side_effects: ["original -> HANDED_OFF; new SCHEDULED assignment created with substitute_of_assignment_id"] }
  - { method: GET,    path: "/staff-assignments/{assignmentId}",      description: "Get staff assignment",                  roles: [VenueOperator, Host, NPC, PlatformAdmin], code: 200, input: [], output: StaffAssignment, side_effects: [] }

  # ---- Review ----
  - { method: POST,   path: "/bookings/{bookingId}/reviews",          description: "Submit review",                         roles: [Player], code: 201, input: [theme_score, "host_score?", venue_score, comment], output: Review, side_effects: ["spam_score (§1.3) computed; auto-REJECT if >= SPAM_SIGNAL_HARD_BLOCK; AuditLogEntry(action=REVIEW_SUBMITTED)"] }
  - { method: PATCH,  path: "/reviews/{reviewId}",                    description: "Revise rejected review",                roles: [Player], code: 200, input: ["theme_score?", "host_score?", "venue_score?", "comment?"], output: Review, side_effects: ["moderation_round += 1; status -> REVISED"] }
  - { method: POST,   path: "/reviews/{reviewId}/resubmit",           description: "Resubmit revised review",               roles: [Player], code: 200, input: [], output: Review, side_effects: ["status -> PENDING_MODERATION; spam_signal_count recomputed"] }
  - { method: POST,   path: "/reviews/{reviewId}/moderate",           description: "Moderate (APPROVE | REJECT | HIDE)",    roles: [ContentModerator], code: 200, input: [decision], output: Review, side_effects: ["AuditLogEntry; review_aggregate (§1.3) recomputed on APPROVE/HIDE"] }
  - { method: GET,    path: "/reviews/{reviewId}",                    description: "Get review",                            roles: [Player, ContentModerator, PlatformAdmin], code: 200, input: [], output: Review, side_effects: [] }

  # ---- SettlementRun ----
  - { method: POST,   path: "/settlement-runs",                       description: "Create draft run (sweeps included sessions)", roles: [PlatformAdmin], code: 201, input: [chain_id, period_starts_at, period_ends_at], output: SettlementRun, side_effects: ["included_session_ids frozen; all payout fields computed via settlement_allocation (§1.3); status=DRAFT"] }
  - { method: POST,   path: "/settlement-runs/{runId}/finalize",      description: "Finalize run",                          roles: [PlatformAdmin], code: 200, input: [], output: SettlementRun, side_effects: ["status -> FINALIZED; AuditLogEntry"] }
  - { method: GET,    path: "/settlement-runs/{runId}",               description: "Get run",                               roles: [PlatformAdmin], code: 200, input: [], output: SettlementRun, side_effects: [] }

  # ---- AuditLogEntry ----
  - { method: GET,    path: "/audit-log",                             description: "Query audit log",                       roles: [PlatformAdmin], code: 200, input: ["subject_entity_type?", "subject_entity_id?", "actor_user_id?", "limit?", "offset?"], output: "AuditLogEntry[]", side_effects: [] }

  # ---- Test-driving endpoints (testability completeness) ----
  - { method: POST,   path: "/_clock/advance",                        description: "Advance server clock to a target ISO 8601 UTC instant; triggers all time-gated cascades (match_deadline lapses, deposit-hold TTL expirations, post-session no-show finalization is NOT auto-fired here — must be triggered via /complete)", roles: [PlatformAdmin], code: 200, input: [to_timestamp], output: null, side_effects: ["Re-evaluates match_status for slots whose match_deadline_at has been crossed (cascade match_status->MATCH_FAILED for OPEN slots); auto-CANCELLED PROMOTED bookings whose DEPOSIT_HOLD_TTL_MINUTES elapsed without confirm-deposit; subsequent waitlist promotion sweep"] }
  - { method: POST,   path: "/_events/payment-confirmed",             description: "Inbound payment-system event: simulate the gateway confirming deposit hold", roles: [PaymentGateway, PlatformAdmin], code: 200, input: [booking_id, "idempotency_key?"], output: Booking, side_effects: ["Equivalent to POST /bookings/{id}/confirm-deposit; idempotent on idempotency_key"] }
  - { method: POST,   path: "/_events/script-authorization-revoked",  description: "Inbound content-system event: a theme version's authorization was revoked upstream", roles: [PlatformAdmin], code: 200, input: [theme_id, revoked_version], output: Theme, side_effects: ["Any SessionSlot with theme_id and theme_version_pinned == revoked_version that is still in schedule_status=SCHEDULED is auto-CANCELLED via cascade (cancellation_initiator=VENUE for downstream Bookings)"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / request ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,               http: 403, condition: "Role does not have permission for this operation, or actor identity does not own the resource" }
  - { id: ERR_INVALID_REQUEST,                        http: 400, condition: "Generic body / parameter validation failure (missing required field, type mismatch, malformed timestamp, out-of-range integer, invalid enum value)" }
  - { id: ERR_OUTSIDE_START_WINDOW,                   http: 409, condition: "POST /session-slots/{id}/start invoked outside [starts_at - START_GRACE_MINUTES, starts_at + START_GRACE_MINUTES]" }

  # --- Existence (404) ---
  - { id: ERR_VENUE_NOT_FOUND,                        http: 404, condition: "Venue id not found" }
  - { id: ERR_ROOM_NOT_FOUND,                         http: 404, condition: "Room id not found in venue" }
  - { id: ERR_THEME_NOT_FOUND,                        http: 404, condition: "Theme id not found" }
  - { id: ERR_SLOT_NOT_FOUND,                         http: 404, condition: "SessionSlot id not found" }
  - { id: ERR_BOOKING_NOT_FOUND,                      http: 404, condition: "Booking id not found" }
  - { id: ERR_WAITLIST_ENTRY_NOT_FOUND,               http: 404, condition: "WaitlistEntry id not found" }
  - { id: ERR_REVIEW_NOT_FOUND,                       http: 404, condition: "Review id not found" }
  - { id: ERR_STAFF_MEMBER_NOT_FOUND,                 http: 404, condition: "StaffMember id not found" }
  - { id: ERR_STAFF_ASSIGNMENT_NOT_FOUND,             http: 404, condition: "StaffAssignment id not found" }
  - { id: ERR_SETTLEMENT_RUN_NOT_FOUND,               http: 404, condition: "SettlementRun id not found" }
  - { id: ERR_PLAYER_NOT_FOUND,                       http: 404, condition: "Player id not found" }

  # --- State (409) ---
  - { id: ERR_VENUE_NOT_ACTIVE,                       http: 409, condition: "Operation requires Venue.status==ACTIVE" }
  - { id: ERR_VENUE_HAS_OPEN_SESSIONS,                http: 409, condition: "Venue.close blocked because SCHEDULED or LIVE sessions remain" }
  - { id: ERR_THEME_NOT_PUBLISHED,                    http: 409, condition: "Slot creation references a theme not in PUBLISHED status" }
  - { id: ERR_THEME_HAS_FUTURE_SESSIONS,              http: 409, condition: "Theme retire blocked by SCHEDULED/LIVE slots referencing this theme" }
  - { id: ERR_SESSION_NOT_OPEN_FOR_CONFIRM,           http: 409, condition: "Booking confirm requires Slot.schedule_status==SCHEDULED" }
  - { id: ERR_SESSION_NOT_OPEN_FOR_CANCEL,            http: 409, condition: "Player cancel requires Slot.schedule_status==SCHEDULED" }
  - { id: ERR_SESSION_NOT_LIVE,                       http: 409, condition: "Check-in requires Slot.schedule_status==LIVE" }
  - { id: ERR_SESSION_NOT_MATCHED,                    http: 409, condition: "Slot.start requires match_status==MATCHED" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE_BY_PLAYER,      http: 409, condition: "Player attempts to cancel a booking after Slot has progressed past SCHEDULED" }
  - { id: ERR_REFUND_REQUIRES_COMPLETED_SESSION,      http: 409, condition: "Refund requires Slot.schedule_status==COMPLETED and Booking.status==SETTLED" }
  - { id: ERR_REVIEW_REVISION_LIMIT,                  http: 409, condition: "moderation_round has reached MAX_MODERATION_ROUNDS" }
  - { id: ERR_HANDOFF_AFTER_LIVE,                     http: 409, condition: "Handoff requires Slot.schedule_status==SCHEDULED" }
  - { id: ERR_SETTLEMENT_HAS_OPEN_SESSIONS,           http: 409, condition: "Finalize blocked because at least one included session is not COMPLETED" }
  - { id: ERR_SETTLEMENT_ALREADY_FINALIZED,           http: 409, condition: "Finalize on already-FINALIZED run, or DRAFT mutation after finalize" }
  - { id: ERR_REVIEW_ALREADY_MODERATED,               http: 409, condition: "Concurrent moderation: review left PENDING_MODERATION first wins; loser rejected" }
  - { id: ERR_WAITLIST_ALREADY_PROMOTED,              http: 409, condition: "Concurrent promotion: WaitlistEntry already PROMOTED" }
  - { id: ERR_STAFF_OVERLAP_CONFLICT,                 http: 409, condition: "staff_overlap (§1.3): same staff member has overlapping in-status SCHEDULED/ACTIVE assignment" }
  - { id: ERR_SLOT_OVERLAP_CONFLICT,                  http: 409, condition: "session_slot_overlap (§1.3): proposed slot collides with existing slot or maintenance on same room (turnover-aware)" }
  - { id: ERR_MAINTENANCE_OVERLAP_CONFLICT,           http: 409, condition: "session_slot_overlap (§1.3): proposed maintenance window collides with existing slot or maintenance" }
  - { id: ERR_SLOT_FULL,                              http: 409, condition: "Booking would push confirmed_seat_count above theme.max_players" }
  - { id: ERR_PLAYER_BANNED,                          http: 403, condition: "Player.status==BANNED or no_show_strikes >= NO_SHOW_BAN_THRESHOLD" }
  - { id: ERR_MATCH_PREFERENCE_REJECTED,              http: 422, condition: "Player demographics (gender/age/experience) violate slot's match_preferences" }

  # --- Business referential / fiscal (422) ---
  - { id: ERR_THEME_ROOM_INCOMPATIBLE,                http: 422, condition: "Slot creation: theme.compatible_room_ids does not contain the room_id" }
  - { id: ERR_STAFF_CHAIN_MISMATCH,                   http: 422, condition: "Assignment: staff.chain_id != slot.venue.chain_id" }
  - { id: ERR_SETTLEMENT_CHAIN_MISMATCH,              http: 422, condition: "Settlement run swept a session whose venue.chain_id != run.chain_id (would never be true if sweep filter is correct; raised as defensive 422)" }
  - { id: ERR_THEME_NO_COMPATIBLE_ROOM,               http: 422, condition: "Theme publish blocked: compatible_room_ids empty" }
  - { id: ERR_STAFF_QUALIFICATION_MISMATCH,           http: 422, condition: "Assignment: staff lacks required_host_qualifications, or NPC slot assigned to staff without NPC role" }
  - { id: ERR_STAFF_WEEKLY_LIMIT_EXCEEDED,            http: 422, condition: "staff_weekly_minutes (§1.3) sum would exceed max_weekly_minutes" }
  - { id: ERR_SUBSTITUTE_DEPTH_EXCEEDED,              http: 422, condition: "Handoff target already has substitute_of_assignment_id != null (max depth 1)" }
  - { id: ERR_REVIEW_NOT_ELIGIBLE,                    http: 422, condition: "Review submission: booking not in SETTLED status" }
  - { id: ERR_REVIEW_DUPLICATE,                       http: 422, condition: "A review by author_player_id already exists for this booking" }
  - { id: ERR_REVENUE_SPLIT_INVALID,                  http: 422, condition: "Sum of revenue_share_bps + author_royalty_bps + host_commission_bps + platform_fee_bps != 10000 (or per-session sum invalid after override resolution)" }
  - { id: ERR_REFUND_EXCEEDS_PAID,                    http: 422, condition: "refund_amount_cents would push refund_total_cents above paid_amount_cents" }
  - { id: ERR_STAFFING_INCOMPLETE,                    http: 409, condition: "Slot.start blocked: required HOST or NPC roles not all SCHEDULED/ACTIVE" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates across the whole platform; runs settlement, manages venues at the chain level, queries audit log, exercises clock + inbound-event endpoints."
    identity: opaque
    exclusive_operations:
      - "POST /venues — create venue"
      - "PATCH /venues/{venueId} — update revenue split / hours"
      - "POST /venues/{venueId}/suspend"
      - "POST /venues/{venueId}/resume"
      - "POST /venues/{venueId}/close"
      - "POST /staff-members — register staff"
      - "POST /settlement-runs — create draft run"
      - "POST /settlement-runs/{runId}/finalize"
      - "GET  /audit-log"
      - "POST /_clock/advance"
      - "POST /_events/script-authorization-revoked"
    shared_operations:
      - "GET /venues, GET /venues/{id}, GET /rooms, GET /themes, GET /session-slots, GET /bookings, GET /staff-members, GET /staff-assignments, GET /reviews, GET /settlement-runs, GET /players, POST /players (register on behalf), POST /_events/payment-confirmed"

  - name: VenueOperator
    description: "Manages a venue's rooms, maintenance windows, session slots, staff assignments, and on-the-day operations (start/complete/cancel/check-in/refund)."
    identity: entity_backed:Venue
    exclusive_operations:
      - "POST /venues/{venueId}/rooms"
      - "POST /venues/{venueId}/rooms/{roomId}/maintenance-windows"
      - "POST /venues/{venueId}/rooms/{roomId}/session-slots"
      - "POST /session-slots/{slotId}/start"
      - "POST /session-slots/{slotId}/complete"
      - "POST /session-slots/{slotId}/cancel"
      - "POST /bookings/{bookingId}/check-in"
      - "POST /bookings/{bookingId}/refund"
      - "POST /staff-assignments"
      - "POST /staff-assignments/{assignmentId}/handoff"
    shared_operations:
      - "POST /bookings/{bookingId}/cancel  (operator-initiated)"
      - "GET endpoints across own venue's resources"
    note: "Ownership rule: X-User-ID must equal Venue.id of the venue resolved from path or body. For slot/booking actions, the venue is resolved via slot.venue_id or booking.slot.venue_id."

  - name: ScriptAuthor
    description: "Owns Theme records (script content); publishes, revises, retires."
    identity: entity_backed:StaffMember
    note: "ScriptAuthor identity is an entity_backed mapping onto StaffMember rows whose roles_held includes the implicit AUTHOR semantics (in v1, ScriptAuthor authentication is satisfied when X-User-ID equals a StaffMember.id and the staff member belongs to the theme's chain_id). Theme.created_by tracking is omitted in v1; instead, ScriptAuthor must belong to the same chain_id as the Theme."
    exclusive_operations:
      - "POST /themes"
      - "POST /themes/{themeId}/publish"
      - "POST /themes/{themeId}/publish-revision"
      - "POST /themes/{themeId}/retire"
    shared_operations:
      - "GET /themes, GET /themes/{id}"

  - name: Host
    description: "On-shift game master. Authenticated as a StaffMember whose roles_held includes HOST."
    identity: entity_backed:StaffMember
    exclusive_operations: []
    shared_operations:
      - "GET /staff-members/{staffId} (own record)"
      - "GET /staff-assignments/{assignmentId} (where staff_member_id == X-User-ID)"

  - name: NPC
    description: "Non-player character actor. Authenticated as a StaffMember whose roles_held includes NPC."
    identity: entity_backed:StaffMember
    exclusive_operations: []
    shared_operations:
      - "GET /staff-members/{staffId} (own record)"
      - "GET /staff-assignments/{assignmentId} (where staff_member_id == X-User-ID)"

  - name: Player
    description: "End user — books sessions, joins waitlists, submits reviews."
    identity: entity_backed:Player
    exclusive_operations:
      - "POST /session-slots/{slotId}/bookings"
      - "POST /bookings/{bookingId}/confirm-deposit  (when actor=Player; PaymentGateway shares)"
      - "POST /session-slots/{slotId}/waitlist-entries"
      - "POST /waitlist-entries/{entryId}/cancel  (own entry)"
      - "POST /bookings/{bookingId}/cancel  (own booking, schedule_status=SCHEDULED only)"
      - "POST /bookings/{bookingId}/reviews"
      - "PATCH /reviews/{reviewId}  (own review, status=REJECTED)"
      - "POST /reviews/{reviewId}/resubmit  (own review, status=REVISED)"
    shared_operations:
      - "POST /players (self-register)"
      - "GET /players/{playerId}, GET /venues, GET /rooms, GET /themes, GET /session-slots, GET /bookings (own), GET /reviews (own), GET /waitlist-entries (own slot)"

  - name: ContentModerator
    description: "Moderates reviews."
    identity: opaque
    exclusive_operations:
      - "POST /reviews/{reviewId}/moderate"
    shared_operations:
      - "GET /reviews, GET /reviews/{id}"

  - name: PaymentGateway
    description: "Inbound payment system; confirms deposit holds via callbacks."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /bookings/{bookingId}/confirm-deposit  (idempotent)"
      - "POST /_events/payment-confirmed"
