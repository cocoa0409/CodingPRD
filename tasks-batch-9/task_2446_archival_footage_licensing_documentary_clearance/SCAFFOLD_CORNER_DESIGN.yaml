          - errors.ERR_PARTY_ROLE_MISMATCH
        distinguishing_aspect: "RightsHolderRep is entity_backed:Archive, so two independent guards apply to one endpoint: X-User-ID must equal the licence's archive_id (priority 4, checked before anything business-level) and the round's party must match the acting role in BOTH directions (priority 33) — a rep may not post PRODUCER and a supervisor may not post LICENSOR."
        test_recipe:
