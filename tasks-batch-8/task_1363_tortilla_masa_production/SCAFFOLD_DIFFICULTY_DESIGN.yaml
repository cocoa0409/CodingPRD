        distinguishing_aspect: |
          Entity pair RouteStop x PackOrder (different pair from Run x
          Changeover): stop creation requires the pack order SEALED; against a
          merely-PASSED pack order it fails with ERR_PACK_NOT_SEALED, and the
          identical request succeeds after seal.
