            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { wg_v2: $.data.version, mat0: $.data.materials_inventory_count }
            - call: "POST /watch/alerts"
              payload: { watch_group_id: "${wg}", alert_kind: "SAFETY_TIP", audience_scope: "GROUP", scheduled_send_at: "2026-08-09T12:00:00Z", expected_watch_group_version: "${wg_v2}" }
              as: ProgramCoordinator
              captures: { al: $.data.id }
            - call: "POST /watch/alerts/${al}/queue"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T12:00:00Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /watch/alerts/${al}/send"
              payload: {}
              as: ProgramCoordinator
              captures: { rc: $.data.recipient_count }
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { mat1: $.data.materials_inventory_count }
            - call: "POST /watch/alerts/${al}/recall"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { mat2: $.data.materials_inventory_count }
          assert:
            - "mat0 == 100"
            - "rc == 6 (ceil(2.5)+ceil(2.5)) so printed_flyers == ceil(6/10) == 1"
            - "mat1 == 101 (forward action debits the ledger by exactly printed_flyers)"
            - "mat2 == 100 (compensating recall restores the ledger; conserved quantity: materials_inventory_count unchanged across the send+recall pair)"
