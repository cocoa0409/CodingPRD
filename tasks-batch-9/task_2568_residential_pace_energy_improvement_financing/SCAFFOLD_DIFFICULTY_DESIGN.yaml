          setup:
            - "Fixture A on parcel P1 (county 06073, assessed 40000000, senior lien 25000000): solar 3000000/220000/25y + hvac 1200000/100000/18y, financed_principal 4314500, term 20 at 800 bps, level total_due 443441, first_tax_year 2026, due 12-10. Application A1 ends ASSESSED."
