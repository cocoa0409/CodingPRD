      - name: blight_score_nested_caps_and_ceiling
        grounds:
          - calculations.blight_priority_score
          - entities.ParcelAdjacency.fields.shared_boundary_feet
          - entities.Property.fields.current_blight_score
          - state_machines.Property.custody_status.PROSPECT_to_ACQUIRED
        distinguishing_aspect: |
          Mode (a) nested conditionals with min/max in a single expression: every capped term binds
          at once (vacancy 84 months clipped to 60 -> 15.0, 20 complaints clipped to 12, 9
          violations clipped to 15, adjacency bonus 10 because two neighbours are in inventory) for
          an intake score of 96.0, and after two years of holding the 12-point holding cap pushes
          the raw total to 108 which the SCORE_CEILING clips to exactly 100.0 - a different
          combinatorial mode from the multi-stage rounding and the self-referential admin fee.
        test_recipe:
          setup:
            - "One ACTIVE funding source with restriction ANY, authorized 1000000 cents."
            - "Two neighbouring parcels N1 and N2 already ACQUIRED (so they count as inventory neighbours)."
            - "Target parcel T: grade F, structure present, vacancy_months 84, 20 nuisance complaints, 9 open code violations, adjacency edges to both N1 and N2, acquired at the default clock."
            - "The logical clock is then advanced to 2028-08-01T00:00:00Z (731 days held = 24 whole 30-day months)."
