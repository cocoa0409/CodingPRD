              as: StoreManager
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/apply-redemption"
              payload: { points_to_redeem: 6000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_REDEMPTION_EXCEEDS_CAP"
            - "response.status == 422"

      - name: c_redemption_insufficient_points_rejected
        claim_type: Correct Result
        grounds: [calculations.order_pricing, "errors[ERR_INSUFFICIENT_POINTS]", entities.Member.fields.loyalty_points_balance]
        distinguishing_aspect: "Redeeming 100 points on an UNPAID order by a member with 0 points returns ERR_INSUFFICIENT_POINTS (402), isolating the fiscal check (state passes because order is UNPAID)."
        test_recipe:
          setup: ["Member with 0 points; product 10000; UNPAID order."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c19@x.com", full_name: "C Nineteen", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-RM3", name: "RM3", category: "GEAR", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/apply-redemption"
              payload: { points_to_redeem: 100 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_POINTS"
            - "response.status == 402"

