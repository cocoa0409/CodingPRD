  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: submission_parallel_intake_and_settlement_dimensions
        grounds:
          - state_machines.Submission.intake_status=SORTED_to_intake_status=CLOSED
          - state_machines.Submission.settlement_status=STATEMENT_ISSUED_to_settlement_status=HELD
          - state_machines.Submission.settlement_status=HELD_to_settlement_status=STATEMENT_ISSUED
          - entities.Submission.fields.intake_status
          - entities.Submission.fields.settlement_status
        distinguishing_aspect: |
          Shape: PARALLEL. Submission carries two independent state dimensions
          on one row — intake_status (RECEIVED -> COUNT_VERIFIED -> SORTED ->
          CLOSED) and settlement_status (PENDING -> STATEMENT_ISSUED -> PAID
          with a HELD side-cycle). Funding a statement short drives
          settlement_status STATEMENT_ISSUED -> HELD and completing the funding
          drives it back, while intake_status stays pinned at CLOSED through
          both moves; no single combined enum could express the four observed
          (CLOSED, PENDING) / (CLOSED, STATEMENT_ISSUED) / (CLOSED, HELD) /
          (CLOSED, STATEMENT_ISSUED) pairs as a linear chain.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default"
            - "manufacturer 038000 CONTRACT_RATE, retailer on STANDARD tier (TIER_MULTIPLIER 1.00) and NET_30"
            - "submission verified 2, one lot of 2 accepted items at claimed_units 1: gross 100, fee 14"
            - "statement issued (net_payable 114) and SCHEDULED for 2026-08-31"
            - "invoice raised over that statement: billed_face 100, billed_fee 14, clearing 2, total 116, still ISSUED and unfunded"
