            - { call: "POST /sample-kits/${k1}/custody-events", as: CareAgent, as_user_id: "${ag1}", payload: { event_type: CARRIER_PICKUP, occurred_at: "2026-08-01T06:00:00Z", actor_label: "Courier", expected_sample_kit_version: "${kv2}" }, captures: { ev3: "$.data.id", sq3: "$.data.sequence_no" } }
