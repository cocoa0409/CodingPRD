# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Corporate LMS & Compliance Training — 9 rules x >=2 instances (>=18 total)
# Every grounds[] resolves into SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls /
# trigger call resolves to a §1.5 endpoint; every ${var} is captured earlier.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: final_grade_highest_vs_latest_on_enrollment
        grounds:
          - calculations.final_grade
          - entities.Course.fields.grading_policy
          - entities.Enrollment.fields.final_grade
          - state_machines.Enrollment.IN_PROGRESS_to_FAILED
        distinguishing_aspect: "On the Enrollment domain, HIGHEST_SCORE records final_grade=68 (max of 65,68,50) whereas LATEST_ATTEMPT would record 50 (last attempt) — divergent results from identical attempts."
        test_recipe:
          setup:
            - "Clock at 2026-01-01. A LATEST_ATTEMPT course (passing_score 70, max_attempts 3) PUBLISHED; learner enrolled and started; two failing attempts already recorded (65 then 68)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "l1@x.com", full_name: "L One", department: "ENGINEERING", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp1: $.data.id }
            - call: "POST /courses"
              payload: { code: "GR-LATEST", title: "Latest Grading", content_type: "SCORM", passing_score: 70, max_attempts: 3, grading_policy: "LATEST_ATTEMPT" }
              as: ComplianceAdmin
              captures: { c_latest: $.data.id }
            - call: "POST /courses/${c_latest}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp1}", course_id: "${c_latest}", is_required: true, due_in_days: 30 }
              as: ComplianceAdmin
              captures: { enr1: $.data.id }
            - call: "POST /enrollments/${enr1}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp1}"
              captures: { enr1_v2: $.data.version }
            - call: "POST /enrollments/${enr1}/quiz-attempts"
              payload: { score: 65, expected_enrollment_version: "${enr1_v2}" }
              as: Learner
              as_user_id: "${emp1}"
            - call: "GET /enrollments/${enr1}"
              payload: {}
              as: Learner
              as_user_id: "${emp1}"
              captures: { enr1_v_after65: $.data.version }
            - call: "POST /enrollments/${enr1}/quiz-attempts"
              payload: { score: 68, expected_enrollment_version: "${enr1_v_after65}" }
              as: Learner
              as_user_id: "${emp1}"
          trigger:
            - call: "GET /enrollments/${enr1}"
              payload: {}
              as: Learner
              as_user_id: "${emp1}"
              captures: { enr1_v_after68: $.data.version }
            - call: "POST /enrollments/${enr1}/quiz-attempts"
              payload: { score: 50, expected_enrollment_version: "${enr1_v_after68}" }
              as: Learner
              as_user_id: "${emp1}"
          assert:
            - "Enrollment.${enr1}.status == FAILED"
            - "Enrollment.${enr1}.final_grade == 50"
            - "Enrollment.${enr1}.best_score == 68"

      - name: ceu_accrual_standard_vs_score_weighted_on_certificate
        grounds:
          - calculations.ceu_accrual
          - entities.Course.fields.ceu_policy
          - entities.Certificate.fields.ceu_credited
          - state_machines.Enrollment.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "On the Certificate domain, a SCORE_WEIGHTED course with ceu_credits=10 and final_grade=85 credits ceu_credited=7.50 (mult 0.75) whereas STANDARD would credit 10.00 — divergent CEU on a different entity than final_grade."
        test_recipe:
          setup:
            - "Clock at 2026-01-01. SCORE_WEIGHTED course (passing_score 70, ceu_credits 10.00) PUBLISHED; learner enrolled and started."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "l2@x.com", full_name: "L Two", department: "FINANCE", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp2: $.data.id }
            - call: "POST /courses"
              payload: { code: "CEU-W", title: "Weighted CEU", content_type: "XAPI", passing_score: 70, ceu_credits: 10.00, ceu_policy: "SCORE_WEIGHTED" }
              as: ComplianceAdmin
              captures: { c_w: $.data.id }
            - call: "POST /courses/${c_w}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp2}", course_id: "${c_w}", is_required: true, due_in_days: 30 }
              as: ComplianceAdmin
              captures: { enr2: $.data.id }
            - call: "POST /enrollments/${enr2}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp2}"
              captures: { enr2_v2: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr2}/quiz-attempts"
              payload: { score: 85, expected_enrollment_version: "${enr2_v2}" }
              as: Learner
              as_user_id: "${emp2}"
            - call: "GET /certificates"
              payload: { enrollment_id: "${enr2}" }
              as: ComplianceAdmin
              captures: { cert2: "$.data[0].id" }
          assert:
            - "Enrollment.${enr2}.status == COMPLETED"
            - "Enrollment.${enr2}.final_grade == 85"
            - "Certificate.${cert2}.ceu_credited == 7.50"
            - "Employee.${emp2}.total_ceu_earned == 7.50"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: path_progress_rounding_order_pinned_sum_then_round
        grounds:
          - calculations.path_progress_pct
          - entities.PathStep.fields.weight
          - entities.PathEnrollment.fields.progress_pct
        distinguishing_aspect: "Mode (b) nested-rounding: with three equal-weight mandatory steps and two satisfied, sum-then-round yields 66.67 whereas round-then-sum (33.33+33.33) would yield 66.66 — the scaffold pins sum-then-round."
        test_recipe:
          setup:
            - "Clock at 2026-01-01. A PUBLISHED path of 3 equal-weight (weight 1) mandatory steps over 3 PUBLISHED courses; learner path-enrolled; steps 1 and 2 completed, step 3 not started."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "l3@x.com", full_name: "L Three", department: "HR", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp3: $.data.id }
            - call: "POST /courses"
              payload: { code: "P-A", title: "Path A", content_type: "SCORM", passing_score: 50 }
              as: ComplianceAdmin
              captures: { ca: $.data.id }
            - call: "POST /courses/${ca}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /courses"
              payload: { code: "P-B", title: "Path B", content_type: "SCORM", passing_score: 50 }
              as: ComplianceAdmin
              captures: { cb: $.data.id }
            - call: "POST /courses/${cb}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /courses"
              payload: { code: "P-C", title: "Path C", content_type: "SCORM", passing_score: 50 }
              as: ComplianceAdmin
              captures: { cc: $.data.id }
            - call: "POST /courses/${cc}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /learning-paths"
              payload: { code: "LP-3EQ", title: "Three Equal", enforce_sequence: false }
              as: ComplianceAdmin
              captures: { lp3: $.data.id }
            - call: "POST /learning-paths/${lp3}/steps"
              payload: { course_id: "${ca}", sequence_index: 1, is_mandatory: true, weight: 1 }
              as: ComplianceAdmin
            - call: "POST /learning-paths/${lp3}/steps"
              payload: { course_id: "${cb}", sequence_index: 2, is_mandatory: true, weight: 1 }
              as: ComplianceAdmin
            - call: "POST /learning-paths/${lp3}/steps"
              payload: { course_id: "${cc}", sequence_index: 3, is_mandatory: true, weight: 1 }
              as: ComplianceAdmin
            - call: "POST /learning-paths/${lp3}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /path-enrollments"
              payload: { employee_id: "${emp3}", learning_path_id: "${lp3}", due_in_days: 60 }
              as: ComplianceAdmin
              captures: { pe3: $.data.id }
            - call: "GET /enrollments"
              payload: { path_enrollment_id: "${pe3}", course_id: "${ca}" }
              as: ComplianceAdmin
              captures: { pe3_a: "$.data[0].id" }
            - call: "POST /enrollments/${pe3_a}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp3}"
              captures: { pe3_a_v2: $.data.version }
            - call: "POST /enrollments/${pe3_a}/quiz-attempts"
              payload: { score: 90, expected_enrollment_version: "${pe3_a_v2}" }
              as: Learner
              as_user_id: "${emp3}"
            - call: "GET /enrollments"
              payload: { path_enrollment_id: "${pe3}", course_id: "${cb}" }
              as: ComplianceAdmin
              captures: { pe3_b: "$.data[0].id" }
            - call: "POST /enrollments/${pe3_b}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp3}"
              captures: { pe3_b_v2: $.data.version }
            - call: "POST /enrollments/${pe3_b}/quiz-attempts"
              payload: { score: 90, expected_enrollment_version: "${pe3_b_v2}" }
              as: Learner
              as_user_id: "${emp3}"
          trigger:
            - call: "GET /path-enrollments/${pe3}"
              payload: {}
              as: ComplianceAdmin
              captures: { pe3_progress: $.data.progress_pct }
          assert:
            - "PathEnrollment.${pe3}.progress_pct == 66.67"
            - "PathEnrollment.${pe3}.status == IN_PROGRESS"

      - name: compliance_score_nonlinear_three_input_clamp
        grounds:
          - calculations.compliance_score
          - calculations.escalation_tier
          - entities.Employee.fields.compliance_score
          - state_machines.Enrollment.IN_PROGRESS_to_EXPIRED
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: with 2 required enrollments (1 COMPLETED+ACTIVE-cert, 1 EXPIRED at tier 2), base=(1/2)*100=50 minus overdue_pts=(2*5)=10 clamped to [0,100] yields compliance_score=40.00 — combines compliant ratio, per-enrollment escalation tier, and clamp."
        test_recipe:
          setup:
            - "Clock 2026-01-01. Employee with 2 required enrollments on 2 PUBLISHED courses: enr A completed (cert ACTIVE); enr B started but due 2026-01-10; clock advanced to 2026-02-10 (31 days overdue -> would be tier 3) — use due 2026-01-25 so 16 days overdue at 2026-02-10 lands tier 2."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "l4@x.com", full_name: "L Four", department: "SALES", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp4: $.data.id }
            - call: "POST /courses"
              payload: { code: "CMP-A", title: "Comp A", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { cca: $.data.id }
            - call: "POST /courses/${cca}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /courses"
              payload: { code: "CMP-B", title: "Comp B", content_type: "SCORM", passing_score: 70 }
              as: ComplianceAdmin
              captures: { ccb: $.data.id }
            - call: "POST /courses/${ccb}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp4}", course_id: "${cca}", is_required: true, due_in_days: 24 }
              as: ComplianceAdmin
              captures: { enr4a: $.data.id }
            - call: "POST /enrollments/${enr4a}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp4}"
              captures: { enr4a_v2: $.data.version }
            - call: "POST /enrollments/${enr4a}/quiz-attempts"
              payload: { score: 90, expected_enrollment_version: "${enr4a_v2}" }
              as: Learner
              as_user_id: "${emp4}"
            - call: "POST /enrollments"
              payload: { employee_id: "${emp4}", course_id: "${ccb}", is_required: true, due_in_days: 24 }
              as: ComplianceAdmin
              captures: { enr4b: $.data.id }
            - call: "POST /enrollments/${enr4b}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp4}"
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-10T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /escalations/run"
              payload: {}
              as: ComplianceAdmin
          trigger:
            - call: "GET /employees/${emp4}/dashboard"
              payload: {}
              as: ComplianceAdmin
              captures: { emp4_score: $.data.compliance_score }
          assert:
            - "Enrollment.${enr4b}.status == EXPIRED"
            - "Enrollment.${enr4b}.escalation_tier == 2"
            - "Employee.${emp4}.compliance_score == 40.00"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_failed_to_in_progress_retry_cycle
        grounds:
          - state_machines.Enrollment.FAILED_to_IN_PROGRESS
          - state_machines.Enrollment.IN_PROGRESS_to_FAILED
          - entities.Enrollment.fields.attempts_used
        distinguishing_aspect: "Enrollment exhibits a cycle (IN_PROGRESS->FAILED->IN_PROGRESS) on the Enrollment entity: reopen returns a FAILED enrollment to IN_PROGRESS and resets attempts_used to 0."
        test_recipe:
          setup:
            - "Clock 2026-01-01. Course passing_score 70 max_attempts 1 PUBLISHED; learner enrolled, started, one failing attempt -> FAILED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "l5@x.com", full_name: "L Five", department: "OPERATIONS", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp5: $.data.id }
            - call: "POST /courses"
              payload: { code: "RETRY", title: "Retry", content_type: "SCORM", passing_score: 70, max_attempts: 1 }
              as: ComplianceAdmin
              captures: { c5: $.data.id }
            - call: "POST /courses/${c5}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp5}", course_id: "${c5}" }
              as: ComplianceAdmin
              captures: { enr5: $.data.id }
            - call: "POST /enrollments/${enr5}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp5}"
              captures: { enr5_v2: $.data.version }
            - call: "POST /enrollments/${enr5}/quiz-attempts"
              payload: { score: 40, expected_enrollment_version: "${enr5_v2}" }
              as: Learner
              as_user_id: "${emp5}"
          trigger:
            - call: "POST /enrollments/${enr5}/reopen"
              payload: {}
              as: ComplianceAdmin
          assert:
            - "Enrollment.${enr5}.status == IN_PROGRESS"
            - "Enrollment.${enr5}.attempts_used == 0"
            - "Enrollment.${enr5}.final_grade == null"

      - name: certificate_branching_active_to_revoked_vs_expired
        grounds:
          - state_machines.Certificate.ACTIVE_to_REVOKED
          - state_machines.Certificate.ACTIVE_to_EXPIRED
          - entities.Certificate.fields.status
        distinguishing_aspect: "Certificate is a branching (fork) machine on a different entity: from ACTIVE it forks to REVOKED (manual revoke) or EXPIRED (clock); this instance drives the REVOKED branch and asserts CEU compensation, distinct from Enrollment's cycle."
        test_recipe:
          setup:
            - "Clock 2026-01-01. STANDARD course ceu_credits 10 PUBLISHED; learner completes it -> ACTIVE certificate, total_ceu_earned 10.00."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "l6@x.com", full_name: "L Six", department: "ENGINEERING", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp6: $.data.id }
            - call: "POST /courses"
              payload: { code: "REVK", title: "Revoke", content_type: "SCORM", passing_score: 70, ceu_credits: 10.00, ceu_policy: "STANDARD" }
              as: ComplianceAdmin
              captures: { c6: $.data.id }
            - call: "POST /courses/${c6}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp6}", course_id: "${c6}", is_required: true }
              as: ComplianceAdmin
              captures: { enr6: $.data.id }
            - call: "POST /enrollments/${enr6}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp6}"
              captures: { enr6_v2: $.data.version }
            - call: "POST /enrollments/${enr6}/quiz-attempts"
              payload: { score: 88, expected_enrollment_version: "${enr6_v2}" }
              as: Learner
              as_user_id: "${emp6}"
            - call: "GET /certificates"
              payload: { enrollment_id: "${enr6}" }
              as: ComplianceAdmin
              captures: { cert6: "$.data[0].id" }
          trigger:
            - call: "POST /certificates/${cert6}/revoke"
              payload: {}
              as: ComplianceAdmin
          assert:
            - "Certificate.${cert6}.status == REVOKED"
            - "Employee.${emp6}.total_ceu_earned == 0"
            - "Employee.${emp6}.compliant_required_count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: session_terminate_cascade_depth3_session_enrollment_cert_path
        grounds:
          - state_machines.TrackingSession.RUNNING_to_TERMINATED
          - state_machines.Enrollment.IN_PROGRESS_to_COMPLETED
          - state_machines.PathEnrollment.IN_PROGRESS_to_COMPLETED
          - entities.Certificate.fields.ceu_credited
        distinguishing_aspect: "Depth-3 cascade triggered by session terminate: TrackingSession TERMINATE -> promotes QuizAttempt and completes the (sole-step) Enrollment -> issues Certificate -> bubbles the owning PathEnrollment to COMPLETED. Each hop is caused by the previous, not the original action."
        test_recipe:
          setup:
            - "Clock 2026-01-01. Single-mandatory-step PUBLISHED path; learner path-enrolled; the lone child enrollment started; an open RUNNING tracking session with reported_score 90 committed."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "l7@x.com", full_name: "L Seven", department: "HR", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp7: $.data.id }
            - call: "POST /courses"
              payload: { code: "SCO-1", title: "Scorm One", content_type: "SCORM", passing_score: 70, ceu_credits: 4.00, ceu_policy: "STANDARD" }
              as: ComplianceAdmin
              captures: { c7: $.data.id }
            - call: "POST /courses/${c7}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /learning-paths"
              payload: { code: "LP-1", title: "One Step", enforce_sequence: true }
              as: ComplianceAdmin
              captures: { lp7: $.data.id }
            - call: "POST /learning-paths/${lp7}/steps"
              payload: { course_id: "${c7}", sequence_index: 1, is_mandatory: true, weight: 1 }
              as: ComplianceAdmin
            - call: "POST /learning-paths/${lp7}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /path-enrollments"
              payload: { employee_id: "${emp7}", learning_path_id: "${lp7}" }
              as: ComplianceAdmin
              captures: { pe7: $.data.id }
            - call: "GET /enrollments"
              payload: { path_enrollment_id: "${pe7}" }
              as: ComplianceAdmin
              captures: { enr7: "$.data[0].id" }
            - call: "POST /enrollments/${enr7}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp7}"
              captures: { enr7_v2: $.data.version }
            - call: "POST /enrollments/${enr7}/tracking-sessions"
              payload: {}
              as: Learner
              as_user_id: "${emp7}"
              captures: { sess7: $.data.id }
            - call: "PATCH /tracking-sessions/${sess7}/commit"
              payload: { lesson_status: "PASSED", progress_pct: 100, reported_score: 90 }
              as: Learner
              as_user_id: "${emp7}"
          trigger:
            - call: "POST /tracking-sessions/${sess7}/terminate"
              payload: { expected_enrollment_version: "${enr7_v2}" }
              as: Learner
              as_user_id: "${emp7}"
          assert:
            - "TrackingSession.${sess7}.status == TERMINATED"
            - "Enrollment.${enr7}.status == COMPLETED"
            - "Enrollment.${enr7}.final_grade == 90"
            - "PathEnrollment.${pe7}.status == COMPLETED"
            - "PathEnrollment.${pe7}.progress_pct == 100.00"

      - name: clock_recurrence_cascade_depth2_clock_cert_enrollment
        grounds:
          - state_machines.Certificate.ACTIVE_to_EXPIRED
          - state_machines.Enrollment.COMPLETED_to_NOT_STARTED
          - entities.Enrollment.fields.cycle_index
        distinguishing_aspect: "Depth-2 cascade from a different trigger (clock advance + escalations/run): Certificate ACTIVE->EXPIRED -> the linked Enrollment recurrence-resets COMPLETED->NOT_STARTED with cycle_index incremented. Origin differs from the session-terminate cascade."
        test_recipe:
          setup:
            - "Clock 2026-01-01. Recurring course (recurrence_months 12) PUBLISHED; learner completes it -> ACTIVE cert expiring 2027-01-01; clock advanced to 2027-02-01."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /employees"
              payload: { email: "l8@x.com", full_name: "L Eight", department: "FINANCE", job_role: "IC" }
              as: ComplianceAdmin
              captures: { emp8: $.data.id }
            - call: "POST /courses"
              payload: { code: "REC-1", title: "Annual", content_type: "SCORM", passing_score: 70, ceu_credits: 6.00, is_recurring: true, recurrence_months: 12 }
              as: ComplianceAdmin
              captures: { c8: $.data.id }
            - call: "POST /courses/${c8}/publish"
              payload: {}
              as: ComplianceAdmin
            - call: "POST /enrollments"
              payload: { employee_id: "${emp8}", course_id: "${c8}", is_required: true }
              as: ComplianceAdmin
              captures: { enr8: $.data.id }
            - call: "POST /enrollments/${enr8}/start"
              payload: {}
              as: Learner
              as_user_id: "${emp8}"
              captures: { enr8_v2: $.data.version }
            - call: "POST /enrollments/${enr8}/quiz-attempts"
              payload: { score: 80, expected_enrollment_version: "${enr8_v2}" }
              as: Learner
              as_user_id: "${emp8}"
            - call: "GET /certificates"
