            - call: "POST /prt/complaints/${c1_id}/triage"
              payload: { responsibility_determination: "SPONSOR_RESPONSIBLE", determination_rationale: "Sponsor records understated the accrual at the transfer date." }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { c1_triage_count_first: $.data.triage_count }
            - call: "GET /prt/participants/${p1_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
