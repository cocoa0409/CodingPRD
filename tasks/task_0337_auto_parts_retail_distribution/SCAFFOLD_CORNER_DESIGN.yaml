      - name: sm_reorder_receive_overshoot_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ReorderRequest", "validations[priority=13]", "errors[ERR_INVALID_RECEIVE_QTY]"]
        distinguishing_aspect: "Receiving more than qty_ordered on a reorder returns ERR_INVALID_RECEIVE_QTY 409; no stock added."
        test_recipe:
          setup: ["ORDERED reorder with qty_ordered 10"]
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "OVR-1", description: "Overshoot", list_price_cents: 3000, cost_cents: 1200, stockable: true, reorder_point: 2, reorder_qty: 10 }
