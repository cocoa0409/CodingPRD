            - call: "POST /permits/${permit_id}/annual-report"
              payload: { reported_annual_load_lbs: 22000.00, reporting_period_year: 2026 }
              as: Permittee
              as_user_id: "user-permittee-1"
          trigger:
            - call: "POST /permits/${permit_id}/finalize-limits"
