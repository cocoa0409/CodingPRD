      - name: drop_triggers_promotion_invoice_chain
        grounds:
          - state_machines.Enrollment.REGISTERED_to_DROPPED
          - state_machines.Enrollment.WAITLISTED_to_REGISTERED
          - calculations.waitlist_promotion
          - calculations.tuition_allocation
        distinguishing_aspect: |
          Depth-3 cascade originating from the drop trigger (distinct from the
          sibling's cancel trigger): drop of the REGISTERED enrollment mutates
          the offering's seat counters, which itself fires the waitlist
          promotion of another Enrollment (WAITLISTED -> REGISTERED), whose
          own transition creates a fresh Invoice via tuition_allocation —
          each hop caused by the previous link, not by the original drop.
        test_recipe:
