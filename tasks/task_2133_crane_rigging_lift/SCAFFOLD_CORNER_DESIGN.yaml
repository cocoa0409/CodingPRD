# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2133_crane_rigging_lift
# Logical clock starts at 2026-08-01T00:00:00Z on every server boot.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_customer_returns_201_with_system_fields_and_envelope
        claim_type: creation
        grounds: ["entities.Customer", "endpoints.POST./customers"]
        distinguishing_aspect: "POST /customers with account_name only returns 201 with a server-minted UUID id (no type prefix), created_at, updated_at, version 1, credit_hold false, open_receivable_cents 0 and invoice_count 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial" }
              as: Dispatcher
              captures: { cust_id: $.data.id, v: $.data.version, hold: $.data.credit_hold, ar: $.data.open_receivable_cents, ic: $.data.invoice_count, terms: $.data.billing_terms }
          assert:
            - "HTTP 201"
            - "${v} == 1"
            - "${hold} == false"
            - "${ar} == 0 and ${ic} == 0"
            - "${terms} == NET_30 (default applied)"
            - "${cust_id} matches the bare UUID form 8-4-4-4-12 with no `cus_` style prefix"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: get_customer_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds: ["entities.Customer", "endpoints.GET./customers/{id}"]
        distinguishing_aspect: "GET /customers/{id} echoes exactly the row POST created, including the same id and version 1."
        test_recipe:
          setup: ["One customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial", billing_terms: "NET_45" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Dispatcher
              captures: { got_id: $.data.id, got_terms: $.data.billing_terms, got_v: $.data.version }
          assert:
            - "${got_id} == ${cust_id}"
            - "${got_terms} == NET_45"
            - "${got_v} == 1"

      - name: list_cranes_returns_pagination_envelope_fields
        claim_type: listing
        grounds: ["entities.Crane", "endpoints.GET./cranes", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /cranes with limit 1 and offset 0 over two cranes returns response_type array, exactly one element, total_count 2 and has_more true."
        test_recipe:
          setup: ["Two cranes exist."]
          setup_api_calls:
            - call: "POST /cranes"
              payload: { model_code: "RT-150-A", class_tons: 150, gross_weight_lb: 90000, counterweight_lb: 40000, outrigger_pad_area_sqft: 30.0, max_line_pull_lb: 20000, rated_max_wind_mph: 30, annual_inspection_expires_on: "2027-06-30T00:00:00Z", mob_demob_cents: 250000, hourly_rate_cents: 45375 }
              as: Dispatcher
            - call: "POST /cranes"
              payload: { model_code: "RT-150-B", class_tons: 150, gross_weight_lb: 90000, counterweight_lb: 40000, outrigger_pad_area_sqft: 30.0, max_line_pull_lb: 20000, rated_max_wind_mph: 30, annual_inspection_expires_on: "2027-06-30T00:00:00Z", mob_demob_cents: 250000, hourly_rate_cents: 45375 }
              as: Dispatcher
          trigger:
            - call: "GET /cranes"
              payload: { limit: 1, offset: 0 }
              as: Dispatcher
          assert:
            - "response_type == array and data holds exactly 1 Crane"
            - "total_count == 2, has_more == true, limit == 1, offset == 0"

      - name: get_lift_plan_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_LIFT_PLAN_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /lift-plans/{id} with a syntactically valid but unknown UUID returns ERR_LIFT_PLAN_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /lift-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LIFT_PLAN_NOT_FOUND with HTTP 404"
            - "response_type == error"

      - name: create_site_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]", "entities.Site.fields.soil_bearing_capacity_psf"]
        distinguishing_aspect: "POST /sites omitting soil_bearing_capacity_psf returns ERR_INVALID_REQUEST (400) and persists nothing."
        test_recipe:
          setup: ["One customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Bergen Plant 4", jurisdiction_code: "NJ-BERGEN" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /sites?customer_id=${cust_id} returns an empty array with total_count 0"

      - name: personnel_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds: ["entities.Personnel.fields.rigger_level", "entities.Personnel.fields.endorsement_class_tons", "entities.Personnel.fields.pe_license_state"]
        distinguishing_aspect: "Creating an OPERATOR without rigger_level, endorsement_class_tons or pe_license_state yields rigger_level NONE, endorsement_class_tons 0 and pe_license_state null."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /personnel"
              payload: { full_name: "Ray Kolb", role_type: "OPERATOR", certification_number: "NCCCO-88421", certification_expires_on: "2027-03-31T00:00:00Z" }
              as: Dispatcher
              captures: { lvl: $.data.rigger_level, tons: $.data.endorsement_class_tons, pe: $.data.pe_license_state, st: $.data.status, peak: $.data.peak_daily_assigned_hours }
          assert:
            - "${lvl} == NONE"
            - "${tons} == 0"
            - "${pe} == null"
            - "${st} == ACTIVE (clock 2026-08-01 is before the 2027-03-31 expiry)"
            - "${peak} == 0"

      - name: rigging_gear_computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds: ["entities.RiggingGear.fields.status", "entities.RiggingGear.fields.effective_wll_lb", "entities.RiggingGear.fields.committed_assignment_count"]
        distinguishing_aspect: "POST /rigging-gear never accepts status, effective_wll_lb, repair_count or committed_assignment_count from the client; the server always mints status DUE_INSPECTION, effective_wll_lb equal to rated_wll_lb, repair_count 0 and committed_assignment_count 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-9001", gear_type: "SHACKLE", rated_wll_lb: 18000, weight_lb: 60, inspection_interval_days: 30 }
              as: SafetyManager
              captures: { st: $.data.status, ewll: $.data.effective_wll_lb, rc: $.data.repair_count, cac: $.data.committed_assignment_count, lastinsp: $.data.last_inspection_at, due: $.data.next_inspection_due_at }
          assert:
            - "${st} == DUE_INSPECTION"
            - "${ewll} == 18000 and ${rc} == 0"
            - "${cac} == 0"
            - "${lastinsp} == null and ${due} == null"

      - name: create_rigging_gear_with_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]", "entities.RiggingGear.fields.gear_type"]
        distinguishing_aspect: "gear_type outside {SLING, SHACKLE, SPREADER_BAR} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-9002", gear_type: "CHAIN_HOIST", rated_wll_lb: 18000, weight_lb: 60 }
              as: SafetyManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /rigging-gear?gear_type=SLING returns an empty array with total_count 0"

      - name: gear_assignment_leg_count_out_of_range_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=5]", "entities.GearAssignment.fields.leg_count", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "leg_count 5 is outside the declared 1..4 range and is rejected with ERR_INVALID_REQUEST (400) before any state or gear check runs."
        test_recipe:
          setup: ["A SURVEYED plan and a SERVICEABLE sling exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Pier 9 Yard", jurisdiction_code: "NJ-HUDSON", soil_bearing_capacity_psf: 3500 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-9100", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T16:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/site-survey"
              payload: { confirmed_soil_bearing_capacity_psf: 3500, access_notes: "apron", mat_inventory_available: true }
              as: Dispatcher
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-5001", gear_type: "SLING", rated_wll_lb: 30000, weight_lb: 500, inspection_interval_days: 90 }
              as: SafetyManager
              captures: { gear_id: $.data.id }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "PASS", inspector_note: "acceptance" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: Dispatcher
              captures: { gear_v: $.data.version }
          trigger:
            - call: "POST /gear-assignments"
              payload: { lift_plan_id: "${plan_id}", gear_id: "${gear_id}", leg_count: 5, sling_angle_deg: 60, expected_gear_version: "${gear_v}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "RiggingGear.${gear_id}.committed_assignment_count == 0"

      - name: load_chart_entry_is_immutable_and_duplicate_key_rejected
        claim_type: immutability
        grounds: ["entities.LoadChartEntry", "validations[priority=17]", "errors[ERR_DUPLICATE_CHART_ROW]"]
        distinguishing_aspect: "LoadChartEntry declares common_fields false, exposes no update or delete endpoint in §1.5, and a second POST for the same (crane_id, configuration, boom_length_ft, radius_ft) is rejected with ERR_DUPLICATE_CHART_ROW (409) leaving the original gross_capacity_lb untouched."
        test_recipe:
          setup: ["One crane with one MAIN_BOOM/120 ft/40 ft chart row at 100000 lb."]
          setup_api_calls:
            - call: "POST /cranes"
              payload: { model_code: "LTM-1250", class_tons: 275, gross_weight_lb: 190000, counterweight_lb: 100000, outrigger_pad_area_sqft: 40.0, max_line_pull_lb: 20000, rated_max_wind_mph: 30, annual_inspection_expires_on: "2027-06-30T00:00:00Z", mob_demob_cents: 250000, hourly_rate_cents: 45375 }
              as: Dispatcher
              captures: { crane_id: $.data.id }
            - call: "POST /load-chart-entries"
              payload: { crane_id: "${crane_id}", configuration: "MAIN_BOOM", boom_length_ft: 120, radius_ft: 40, gross_capacity_lb: 100000 }
              as: Dispatcher
              captures: { row_id: $.data.id }
          trigger:
            - call: "POST /load-chart-entries"
              payload: { crane_id: "${crane_id}", configuration: "MAIN_BOOM", boom_length_ft: 120, radius_ft: 40, gross_capacity_lb: 88000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_CHART_ROW with HTTP 409"
            - "GET /cranes/${crane_id}/load-chart-entries returns exactly 1 row whose gross_capacity_lb is still 100000"
            - "the LoadChartEntry response body carries id and created_at but no version and no updated_at"

      - name: create_site_with_unknown_customer_returns_customer_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=6]", "errors[ERR_CUSTOMER_NOT_FOUND]", "entities.Site.fields.customer_id"]
        distinguishing_aspect: "The FK in the body is validated: POST /sites with an unknown customer_id returns ERR_CUSTOMER_NOT_FOUND (404), proving flat-topology FK integrity rather than URL nesting."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { customer_id: "00000000-0000-4000-8000-000000000000", address_label: "Nowhere", jurisdiction_code: "NJ-BERGEN", soil_bearing_capacity_psf: 2000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CUSTOMER_NOT_FOUND with HTTP 404"

      - name: list_sites_filtered_by_customer_id_returns_only_that_customers_sites
        claim_type: listing
        grounds: ["entities.Site.fields.customer_id", "endpoints.GET./sites"]
        distinguishing_aspect: "The filtered-list reverse-reachability channel works: with two customers each owning one site, GET /sites?customer_id=<A> returns exactly the one site owned by A."
        test_recipe:
          setup: ["Two customers, each with one site."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Customer A" }
              as: Dispatcher
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { account_name: "Customer B" }
              as: Dispatcher
              captures: { cust_b: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_a}", address_label: "Site A", jurisdiction_code: "NJ-BERGEN", soil_bearing_capacity_psf: 2000 }
              as: Dispatcher
              captures: { site_a: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_b}", address_label: "Site B", jurisdiction_code: "NY-ROCKLAND", soil_bearing_capacity_psf: 2500 }
              as: Dispatcher
              captures: { site_b: $.data.id }
          trigger:
            - call: "GET /sites"
              payload: { customer_id: "${cust_a}" }
              as: Dispatcher
              captures: { first_id: "$.data[0].id" }
          assert:
            - "total_count == 1 and has_more == false"
            - "${first_id} == ${site_a}"
            - "${site_b} does not appear in the result"

      - name: list_gear_inspections_subresource_returns_full_log_for_one_gear
        claim_type: listing
        grounds: ["entities.GearInspection.fields.gear_id", "endpoints.GET./rigging-gear/{id}/inspections"]
        distinguishing_aspect: "The sub-resource reverse-reachability channel works: after a PASS then a FAIL on the same sling, GET /rigging-gear/{id}/inspections returns both rows with resulting_status SERVICEABLE and QUARANTINED respectively."
        test_recipe:
          setup: ["One sling with two inspections recorded against it."]
          setup_api_calls:
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-5001", gear_type: "SLING", rated_wll_lb: 30000, weight_lb: 500, inspection_interval_days: 90 }
              as: SafetyManager
              captures: { gear_id: $.data.id }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "PASS", inspector_note: "acceptance" }
              as: SafetyManager
              captures: { i1_status: $.data.resulting_status }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "FAIL", inspector_note: "broken wires" }
              as: SafetyManager
              captures: { i2_status: $.data.resulting_status }
          trigger:
            - call: "GET /rigging-gear/${gear_id}/inspections"
              payload: {}
              as: SafetyManager
          assert:
            - "total_count == 2"
            - "${i1_status} == SERVICEABLE and ${i2_status} == QUARANTINED"
            - "RiggingGear.${gear_id}.status == QUARANTINED"

      - name: pagination_limit_above_hundred_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=5]", "response_envelope.pagination_defaults", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "limit 101 exceeds the declared max of 100 and is rejected with ERR_INVALID_REQUEST (400) rather than silently clamped."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /cranes"
              payload: { limit: 101, offset: 0 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: new_lift_plan_starts_draft_and_not_mobilized
        claim_type: initial_state
        grounds: ["state_machines.LiftPlan.plan_status.initial_state", "state_machines.LiftPlan.field_status.initial_state", "entities.LiftPlan.fields.lift_class"]
        distinguishing_aspect: "A freshly created LiftPlan starts at plan_status DRAFT AND field_status NOT_MOBILIZED on the same row, with lift_class NOT_CLASSIFIED, bearing_variant NONE, rigging_verified false and every derived capacity field 0."
        test_recipe:
          setup: ["A customer and a site exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Pier 9 Yard", jurisdiction_code: "NJ-HUDSON", soil_bearing_capacity_psf: 3500 }
              as: Dispatcher
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-9200", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T16:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { plan_id: $.data.id, ps: $.data.plan_status, fs: $.data.field_status, cls: $.data.lift_class, bv: $.data.bearing_variant, rv: $.data.rigging_verified, cid: $.data.customer_id, net: $.data.net_capacity_lb }
          assert:
            - "${ps} == DRAFT and ${fs} == NOT_MOBILIZED"
            - "${cls} == NOT_CLASSIFIED and ${bv} == NONE"
            - "${rv} == false and ${net} == 0"
            - "${cid} == ${cust_id}   (copied from Site.customer_id)"

      - name: second_site_survey_on_surveyed_plan_returns_invalid_plan_state
        claim_type: invalid_transition
        grounds: ["state_machines.LiftPlan.DRAFT_to_SURVEYED", "errors[ERR_INVALID_PLAN_STATE]", "validations[priority=9]"]
        distinguishing_aspect: "DRAFT -> SURVEYED is the only declared edge into SURVEYED; repeating the survey from SURVEYED is not idempotent and returns ERR_INVALID_PLAN_STATE (409) without touching Site.soil_bearing_capacity_psf again."
        test_recipe:
          setup: ["A plan has already been surveyed once with confirmed_soil_bearing_capacity_psf 3500."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Pier 9 Yard", jurisdiction_code: "NJ-HUDSON", soil_bearing_capacity_psf: 2000 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-9201", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T16:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/site-survey"
              payload: { confirmed_soil_bearing_capacity_psf: 3500, access_notes: "apron", mat_inventory_available: true }
              as: Dispatcher
              captures: { ps1: $.data.plan_status }
          trigger:
            - call: "POST /lift-plans/${plan_id}/site-survey"
              payload: { confirmed_soil_bearing_capacity_psf: 9999, access_notes: "second pass", mat_inventory_available: false }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${ps1} == SURVEYED"
            - "${err} == ERR_INVALID_PLAN_STATE with HTTP 409"
            - "Site.${site_id}.soil_bearing_capacity_psf == 3500 and Site.${site_id}.mat_inventory_available == true"

      - name: cancelling_an_already_cancelled_plan_returns_invalid_plan_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.LiftPlan.DRAFT_to_CANCELLED", "errors[ERR_INVALID_PLAN_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel is rejected with ERR_INVALID_PLAN_STATE (409) and cancellation_reason keeps the FIRST reason."
        test_recipe:
          setup: ["A DRAFT plan has been cancelled once with reason 'scope withdrawn'."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Pier 9 Yard", jurisdiction_code: "NJ-HUDSON", soil_bearing_capacity_psf: 3500 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-9202", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T16:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/cancel"
              payload: { reason: "scope withdrawn" }
              as: Dispatcher
              captures: { ps1: $.data.plan_status, r1: $.data.cancellation_reason }
          trigger:
            - call: "POST /lift-plans/${plan_id}/cancel"
              payload: { reason: "second attempt" }
              as: LiftDirector
              captures: { err: $.data.error_id }
          assert:
            - "${ps1} == CANCELLED and ${r1} == scope withdrawn"
            - "${err} == ERR_INVALID_PLAN_STATE with HTTP 409"
            - "LiftPlan.${plan_id}.cancellation_reason == scope withdrawn   (unchanged)"

      - name: approving_a_pending_engineering_plan_returns_invalid_plan_state
        claim_type: precondition_enforcement
        grounds: ["state_machines.LiftPlan.CONFIGURED_to_APPROVED", "errors[ERR_INVALID_PLAN_STATE]"]
        distinguishing_aspect: "The LiftDirector shortcut is only wired from CONFIGURED; a CRITICAL plan sitting in PENDING_ENGINEERING cannot be approved without a stamp and returns ERR_INVALID_PLAN_STATE (409)."
        test_recipe:
          setup: ["A CRITICAL plan (utilization_pct 75.00) sits in PENDING_ENGINEERING."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Bergen Plant 4", jurisdiction_code: "NJ-BERGEN", soil_bearing_capacity_psf: 2000 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /cranes"
