              payload: { expected_cart_version: "${ct1_v}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { err_empty_cart: $.data.error_id }
          assert:
            - "HTTP 422 with ${err_empty_cart} == ERR_EMPTY_CART (not 412 — the version matched)"
            - "Cart.${ct1}: status == OPEN, checked_out_at == null, version == ${ct1_v} (unchanged by the rejected write)"
            - "GET /orders?cart_id=${ct1} returns 0 items"

      - name: signoff_by_the_substantiating_officer_rejected_then_allowed_for_another
        claim_type: violation_and_satisfaction
