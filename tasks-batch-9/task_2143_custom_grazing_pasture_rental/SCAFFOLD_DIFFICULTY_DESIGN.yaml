  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: head_count_conserved_across_death_confirm_and_void
        grounds:
          - state_machines.DeathLossReport.REPORTED_to_CONFIRMED
          - state_machines.DeathLossReport.CONFIRMED_to_VOIDED
          - calculations.death_loss_liability
          - entities.Pasture.fields.stocked_head_count
          - entities.CattleLot.fields.confirmed_death_head
        distinguishing_aspect: |
          CONSERVED QUANTITY = LIVE HEAD. The named invariant
          `Pasture.stocked_head_count == sum over lots in {ON_FEED, REMOVAL_SCHEDULED} of
          (head_count_received - confirmed_death_head)` must read exactly 150 both before
          the two CONFIRMs and after the two VOIDs, with zero drift, and the chronological
          liability sweep must re-run so no stale credit_cents survives.
        test_recipe:
          setup:
            - "Contract K1 is ACTIVE with GRAZIER_SHARE_ABOVE_THRESHOLD at 2.0% and head_value_cents 140000."
            - "Lot L1 is ON_FEED with 150 head received, so Pasture.stocked_head_count reads 150."
            - "Two death reports (2 head on 2026-08-20 and 2 head on 2026-09-05) are REPORTED and not yet confirmed."
