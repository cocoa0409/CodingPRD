scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_cost_share_per_line_vs_aggregate
        grounds:
          - calculations.invoice_cost_share
          - entities.AffiliateInvoice.fields.state_share_cents
          - entities.AffiliateInvoice.fields.pricing_variant
        distinguishing_aspect: |
          Fiscal domain (AffiliateInvoice): with share 4925bp, cap 300c and three
          224c items, the pinned PER_LINE variant yields state 330 / local 342
          while the AGGREGATE variant yields state 331 / local 341 on identical
          items — the issued invoice MUST carry the PER_LINE numbers.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Program TN share 4925bp cap 300c. Affiliate Nashville (prefixes 372/370) with ACTIVE agreement 2026-01-01..2028-01-01 and population stat 2026=10000."
            - "Five titles (one per band, window 2026-01..2027-12); five selections for 2026-10, each APPROVED by a second committee member; five print orders qty 6000 confirmed (unit 189c after plate fee)."
            - "Three INFANT-band children (born 2026-05/06/07) registered 2026-09; wave 2026-10 manifested (3 items) and reconciled; one DRAFT invoice exists."
          setup_api_calls:
            - &c_sep
              call: "POST /library/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &prog
              call: "POST /library/state-programs"
              payload: { state_code: "TN", name: "TN Imagination Partnership", funding_share_bp: 4925, max_state_share_per_book_cents: 300 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - &aff_a
              call: "POST /library/affiliates"
              payload: { name: "Nashville Books Together", state_program_id: "${prog_id}", postal_prefixes: ["372", "370"], contact_email: "coord@nbt.org" }
              as: PlatformAdmin
              captures: { aff_a_id: $.data.id, aff_a_v: $.data.version }
            - &agr_a
              call: "POST /library/affiliates/${aff_a_id}/agreements"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", local_fundraising_commitment_cents: 5000000, expected_affiliate_version: "${aff_a_v}" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { agr_a_id: $.data.id }
            - &agr_a_ok
              call: "POST /library/agreements/${agr_a_id}/approve"
              payload: {}
              as: StateProgramOfficer
              as_user_id: "${prog_id}"
            - &pop_a
              call: "POST /library/affiliates/${aff_a_id}/population-stats"
              payload: { effective_year: 2026, eligible_population: 10000 }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
            - &t_inf
              call: "POST /library/titles"
              payload: { title_name: "The Little Engine", author: "W Piper", age_band: "INFANT", available_from_month: "2026-01", available_until_month: "2027-12" }
              as: PlatformAdmin
              captures: { t_inf: $.data.id }
            - &t_tod
