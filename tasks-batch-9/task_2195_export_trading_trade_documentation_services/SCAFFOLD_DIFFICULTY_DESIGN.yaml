        distinguishing_aspect: |
          Depth 3 on the money path DocumentPresentation -> CreditInsurancePolicy ->
          ForeignBuyer, a different chain from the compliance cascade above: one settlement
          call must honour the presentation, release insured_exposure_usd so the policy goes
          utilized 25000.00 -> 0.00 and EXHAUSTED -> ACTIVE, and recompute
          aggregate_exposure_usd to 0.00, while also flipping the credit to UTILISED
