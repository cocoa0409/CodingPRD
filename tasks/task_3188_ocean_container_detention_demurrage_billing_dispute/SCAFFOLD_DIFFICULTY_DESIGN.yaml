            - "wv_50k1_tier == TIER_2_SUPERVISOR and wv_50k1_status == PROPOSED (50001 crosses the boundary; no auto-apply)"
            - "Invoice.${inv_l}.credit_total_cents == 50000 after both calls (only the tier-1 waiver applied)"
  # ===========================================================================
