              payload: { target_status: "APPROVED" }
              as: TmdlAnalyst
            - call: "POST /permits/${permit_id}/finalize-limits"
              payload: {}
              as: PermitWriter
          assert:
            - "before trigger call 1, Permit.${permit_id}.limit_status == INTERIM"
            - "before trigger call 1, Permit.${permit_id}.interim_limit_lbs_yr == 23916.00 and Permit.${permit_id}.final_limit_lbs_yr == 21888.00"
            - "before trigger call 1, Permit.${permit_id}.applicable_limit_lbs_yr == 23916.00 and compliance_status == IN_COMPLIANCE and compliance_gap_lbs == 0.00"
            - "trigger call 1 responds 409 with data.error_id == ERR_TMDL_NOT_APPROVED (TmdlAssessment is DRAFT)"
            - "trigger call 3 responds 409 with data.error_id == ERR_TMDL_NOT_APPROVED (PUBLIC_COMMENT is still not APPROVED)"
            - "after trigger call 3, Permit.${permit_id}.limit_status is still INTERIM and applicable_limit_lbs_yr is still 23916.00"
            - "trigger call 5 responds 200 with data.limit_status == FINAL"
            - "Permit.${permit_id}.applicable_limit_lbs_yr == 21888.00"
            - "Permit.${permit_id}.compliance_gap_lbs == 112.00"
            - "Permit.${permit_id}.compliance_status == SHORTFALL"
            - "Permit.${permit_id}.enforcement_flag == false (the clock date 2026-06-15 is on or before compliance_schedule_end_date 2029-03-01)"
            - "Permit.${permit_id}.reported_annual_load_lbs == 22000.00 (unchanged by finalization)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: practice_period_half_open_adjacency_accepted_and_revoked_project_frees_the_tract
        grounds:
          - validations[priority=15]
          - errors[ERR_PRACTICE_PERIOD_OVERLAP]
          - entities.PracticeProject.fields.effective_start_date
          - entities.PracticeProject.fields.effective_end_date
          - state_machines.PracticeProject.REGISTERED_to_REVOKED
        distinguishing_aspect: |
          Three independent dimensions of one occupancy rule, all on tract-level intervals:
          (a) the interval is HALF-OPEN, so a new project starting exactly on the incumbent's
          end date is accepted while one starting a single day earlier is rejected;
          (b) the key is the (tract_code, practice_type) pair, so an overlapping
          RIPARIAN_BUFFER on the same tract is accepted; and (c) only live statuses occupy the
          tract, so once an incumbent is REVOKED by a failed BASELINE event a fully
          overlapping project on that tract is accepted.
        test_recipe:
          setup:
            - "Watershed SCR with reach R_UP in eligible zone Z1 and producer Bluegrass Farms LLC."
            - "PracticeProject PP-A occupies tract T-101 / COVER_CROP over 2026-01-01..2027-01-01 in status REGISTERED."
            - "PracticeProject PP-Z occupies tract T-500 / COVER_CROP over 2026-01-01..2027-01-01 in status REGISTERED, and is then driven to REVOKED by a BASELINE event with outcome FAIL."
            - "No TMDL is required; project registration is not gated on watershed status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
