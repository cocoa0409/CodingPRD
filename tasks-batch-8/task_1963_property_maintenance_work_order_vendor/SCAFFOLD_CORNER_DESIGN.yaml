              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-02T09:00:00Z", scheduled_end_at: "2026-08-02T11:00:00Z", entry_authorization: "NOTICE_POSTED", notice_posted_at: "2026-08-01T10:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ENTRY_NOTICE_TOO_SHORT, HTTP 422 (23h lead < 24h minimum)"

      - name: vendor_insurance_expired_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_VENDOR_INSURANCE_EXPIRED]"]
        distinguishing_aspect: "A vendor whose insurance_valid_until (2026-08-10) precedes the scheduled_start_at (2026-08-11) cannot be dispatched: ERR_VENDOR_INSURANCE_EXPIRED."
