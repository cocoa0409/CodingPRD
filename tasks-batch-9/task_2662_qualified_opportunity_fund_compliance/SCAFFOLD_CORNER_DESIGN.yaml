            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-04-05T00:00:00Z", unadjusted_cost_basis: 2000000.00, afs_fair_value: 2000000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { good_id: $.data.id, good_qual: $.data.qualification }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { test_b: $.data.id }
            - call: "POST /qof/asset-tests/${test_b}/measure"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { ratio_b: $.data.ratio_pct, res_b: $.data.result, count_b: $.data.included_asset_count }
            - call: "POST /qof/asset-tests/${test_b}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { st_b: $.data.status }
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { streak_2: $.data.consecutive_failed_tests }
            - call: "POST /qof/fund-assets/${good_id}/dispose"
              payload: { proceeds_amount: 2100000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { good_status: $.data.status }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-09-30T00:00:00Z", period_start: "2026-07-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { test_c: $.data.id }
            - call: "POST /qof/asset-tests/${test_c}/measure"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { ratio_c: $.data.ratio_pct, res_c: $.data.result, months_c: $.data.failed_month_count }
            - call: "POST /qof/asset-tests/${test_c}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { st_c: $.data.status }
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { streak_3: $.data.consecutive_failed_tests, cert_3: $.data.certification_status, months_total: $.data.cumulative_penalty_months }
          assert:
            - "Test A: ${ratio_a} == 0.0000 with ${res_a} == FAIL and ${months_a} == 3 (2026-01-01 to 2026-03-31 is 2 whole months plus 1 because day 31 >= day 1); ${st_a} == CERTIFIED_FAIL"
            - "${streak_1} == 1 and ${cert_1} == SELF_CERTIFIED — one fail is below the decertification threshold of 2"
            - "${good_qual} == QUALIFIED (QOZ_BUSINESS_PROPERTY, original_use_in_zone true, not related-party)"
            - "Test B: ${count_b} == 2, ${ratio_b} == 95.2381 == round(2000000 / 2100000 * 100, 4) and ${res_b} == PASS; ${st_b} == CERTIFIED_PASS"
            - "${streak_2} == 0: the CERTIFIED_PASS reset the counter even though compliance_posture stays DEFICIENT (§1.2 declares no DEFICIENT -> COMPLIANT arc)"
            - "${good_status} == DISPOSED at 2026-08-01T00:00:00Z, which is before test C's period_end, so the asset leaves the inclusion set"
            - "Test C: ${ratio_c} == 0.0000 with ${res_c} == FAIL and ${months_c} == 3; ${st_c} == CERTIFIED_FAIL"
            - "${streak_3} == 1, NOT 2: the fail streak restarted from the reset, so ${cert_3} == SELF_CERTIFIED and compliance_posture is DEFICIENT rather than FAILED_FINAL"
            - "${months_total} == 6 == 3 + 3 across the two assessments; the passing test contributed none"

      - name: wcsh_blowout_cascade_layer_corner
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.WorkingCapitalPlan
          - state_machines.QOZBusiness
        excluded_because:
          difficulty_instance: wcsh_blowout_disqualifies_business_chain
          rationale: "That §1.8 transitive_cascade instance walks the full four-level chain (plan BLOWN -> QOZBusiness nqfp_amount and qualification_status -> QOZB_EQUITY FundAsset qualification -> Fund aggregate_qualified_basis and the next asset-test ratio) end to end with ordering asserted at every hop, which is exactly this layer's N-level claim."

      - name: dual_variant_valuation_layer_corner
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.semiannual_asset_test_ratio
        excluded_because:
          difficulty_instance: asset_test_valuation_variant_divergence
          rationale: "That §1.8 dual_variant_calc instance measures the same asset population under APPLICABLE_FINANCIAL_STATEMENT and UNADJUSTED_COST_BASIS, asserts both ratios and the resulting PASS/FAIL divergence with the delta, covering the layer's both-variants-and-delta claim."

  # ---------------------------------------------------------------------------
  # Consistency model: immediate. Every derived rollup must be readable in the
  # response of the request that changed it (or in the very next call), with no
  # lag and no reconciliation pass.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: fund_ledger_and_test_results_are_immediately_readable
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Fund.aggregate_qualified_basis
          - endpoints[POST /qof/asset-tests/{id}/measure]
        distinguishing_aspect: "No step between a write and its derived state: the asset write's own response already carries the asset's qualification, the immediately following fund read shows the four aggregates, measure returns the ratio computed from those aggregates in the same response, and certify's response plus an immediate list read expose the PenaltyAssessment the same request created."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; the fund elects UNADJUSTED_COST_BASIS."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Immediate Ledger QOF", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1", asset_test_valuation_method: "UNADJUSTED_COST_BASIS" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 800000.00, afs_fair_value: 800000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { good_id: $.data.id, good_qual: $.data.qualification }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "NONQUALIFIED_FINANCIAL_PROPERTY", acquisition_date: "2026-01-06T00:00:00Z", unadjusted_cost_basis: 200000.00, afs_fair_value: 200000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { bad_id: $.data.id, bad_qual: $.data.qualification }
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { agg_basis: $.data.aggregate_asset_basis, agg_qual: $.data.aggregate_qualified_basis, agg_afs: $.data.aggregate_afs_value, agg_qafs: $.data.aggregate_qualified_afs_value }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { test_id: $.data.id, method: $.data.valuation_method }
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { num: $.data.qualified_numerator, den: $.data.total_denominator, ratio: $.data.ratio_pct, res: $.data.result, short: $.data.shortfall_amount, months: $.data.failed_month_count }
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { test_status: $.data.status }
            - call: "GET /qof/penalty-assessments?fund_id=${fund_id}&limit=10&offset=0"
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { pen_page: $.data }
          assert:
            - "${good_qual} == QUALIFIED and ${bad_qual} == NONQUALIFIED in the creating responses themselves — no second read is needed to learn the qualification"
            - "${agg_basis} == 1000000.00, ${agg_qual} == 800000.00, ${agg_afs} == 1000000.00 and ${agg_qafs} == 800000.00 on the very next read"
            - "${method} == UNADJUSTED_COST_BASIS, resolved from the fund election at creation time"
            - "${num} == 800000.00, ${den} == 1000000.00, ${ratio} == 80.0000, ${res} == FAIL, ${short} == 100000.00 == round(0.90 * 1000000 - 800000, 2) and ${months} == 6, all in the measure response"
            - "${test_status} == CERTIFIED_FAIL and ${pen_page} already holds exactly one PenaltyAssessment for Fund.${fund_id} with failed_month_count 6, gross_penalty_amount 4000.00 == round(100000 * 0.08 / 12, 2) * 6 and status ASSESSED"
            - "Fund.${fund_id}.cumulative_penalty_months == 6 and consecutive_failed_tests == 1 on the same immediate read"

      - name: inclusion_event_rollups_visible_without_lag
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.DeferralElection.included_amount
          - endpoints[GET /qof/investors/{id}/statement]
        distinguishing_aspect: "A single inclusion event touches three levels (event row, election rollups, investor statement) and all three must agree in the immediately following reads — the statement is a computed read with no cached copy, so there is no window in which included_gain_total lags included_amount."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "No Lag Holdings LLC", taxpayer_type: "PARTNERSHIP", tax_year_end_month: 12, compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 250000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "No Lag QOF", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 200000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elec_id: $.data.id }
          trigger:
            - call: "POST /qof/deferral-elections/${elec_id}/inclusion-events"
              payload: { event_type: "PARTIAL_REDEMPTION", included_fraction: 0.2500 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { ev_id: $.data.id, gross: $.data.gross_inclusion_amount, offset: $.data.basis_offset_amount, net: $.data.net_inclusion_amount, ev_date: $.data.event_date }
            - call: "GET /qof/deferral-elections/${elec_id}"
              as: Investor
              as_user_id: "${inv_id}"
              captures: { inc_amt: $.data.included_amount, inc_frac: $.data.included_fraction_total, remaining: $.data.deferred_remaining, elec_status: $.data.status }
            - call: "GET /qof/investors/${inv_id}/statement"
              as: Investor
              as_user_id: "${inv_id}"
              captures: { stmt_eligible: $.data.eligible_gain_total, stmt_outstanding: $.data.deferred_gain_outstanding, stmt_included: $.data.included_gain_total, stmt_events: $.data.inclusion_event_count }
          assert:
            - "${ev_date} == 2026-08-01T00:00:00Z, ${gross} == 50000.00 == round(200000 * 0.2500, 2), ${offset} == 0.00 (holding_tier UNDER_FIVE) and ${net} == 50000.00"
            - "${inc_amt} == 50000.00, ${inc_frac} == 0.2500, ${remaining} == 150000.00 and ${elec_status} == INCLUDED_PARTIAL on the immediately following read"
            - "${stmt_eligible} == 250000.00, ${stmt_outstanding} == 150000.00, ${stmt_included} == 50000.00 and ${stmt_events} == 1 in the same chain — the statement is recomputed per request, never cached"
            - "EligibleGain.${gain_id}.elected_amount == 200000.00 and unelected_amount == 50000.00 are unaffected by the inclusion event (inclusion does not un-invest the gain)"
