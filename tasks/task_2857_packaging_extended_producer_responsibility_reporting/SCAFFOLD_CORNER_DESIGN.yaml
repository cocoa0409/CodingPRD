            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_id}", effective_from: "2026-01-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 900, material_rates: [{ material_type: "PLASTIC", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 42 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { fs_id: $.data.id }
            - call: "GET /epr/skus/${sku_id}"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { sku_ver_before: $.data.version }
          trigger:
            - call: "POST /epr/skus/${sku_id}/redesign-projection"
              payload: { state_program_id: "${sp_id}", fee_schedule_id: "${fs_id}", tier_basis_kg: 0, units_basis: "BASELINE_UNITS", candidate_components: [{ material_type: "PLASTIC", unit_weight_grams: 60.00, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 30, is_reusable: false }] }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus/${sku_id}/redesign-projection"
              payload: { state_program_id: "${sp_id}", fee_schedule_id: "${fs_id}", tier_basis_kg: 0, units_basis: "BASELINE_UNITS", projected_units: 999999, candidate_components: [{ material_type: "PLASTIC", unit_weight_grams: 60.00, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 30, is_reusable: false }] }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
          assert:
            - "First response: projected_units == 100, projected_unit_weight_grams == 60.00, projected_line_weight_kg == 6.000"
            - "First response: baseline_line_fee_cents == 672, projected_line_fee_cents == 214, fee_delta_cents == -458"
            - "Second response is field-for-field identical to the first: BASELINE_UNITS ignores projected_units == 999999"
            - "Sku.${sku_id}.version == ${sku_ver_before}, unit_packaging_weight_grams == 100.00, revision_count == 0 and exactly one ACTIVE component"
