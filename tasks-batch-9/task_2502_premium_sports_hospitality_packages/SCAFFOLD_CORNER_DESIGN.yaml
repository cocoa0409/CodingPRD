            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 50, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr2: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v2: "$.data.version" } }
          trigger:
            - { call: "POST /release-tranches/${tr1}/confirm", payload: { confirmed_units: 50, expected_rights_deal_version: "${deal_v2}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "GET /allocation-blocks/${blk_c}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { c1_alloc: "$.data.allocated_units", c1_st: "$.data.block_state" } }
            - { call: "GET /allocation-blocks/${blk_i}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { i1_alloc: "$.data.allocated_units", i1_st: "$.data.block_state" } }
            - { call: "GET /allocation-blocks/${blk_t}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { t1_alloc: "$.data.allocated_units", t1_st: "$.data.block_state" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v3: "$.data.version", rel1: "$.data.released_units", un1: "$.data.unallocated_units", st1: "$.data.deal_status" } }
            - { call: "POST /release-tranches/${tr2}/confirm", payload: { confirmed_units: 50, expected_rights_deal_version: "${deal_v3}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "GET /allocation-blocks/${blk_c}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { c2_alloc: "$.data.allocated_units", c2_st: "$.data.block_state" } }
            - { call: "GET /allocation-blocks/${blk_i}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { i2_alloc: "$.data.allocated_units", i2_st: "$.data.block_state" } }
