  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_room_buffer_overlap_rejected
        grounds:
          - validations[priority=11]
          - state_machines.TimeSlot.status.OPEN_to_HELD
          - entities.TimeSlot.fields.block_end_utc
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: |
          Same-room interval semantics INCLUDE the reset buffer: slot A occupies [14:00,15:30) (game 60 +
          buffer 30). A second slot starting 15:15 (< 15:30) overlaps A's BOOKED block window and the grab
          is rejected with ERR_SLOT_OVERLAP. Buffer-inclusive half-open arithmetic.
        test_recipe:
          setup:
            - "Venue open all day; Room game=60 buffer=30; TWO game masters (so staff is never the blocker)."
            - "Slot A 2026-07-01T14:00:00Z BOOKED via a CONFIRMED booking. Slot B 2026-07-01T15:15:00Z OPEN (overlaps A's block window)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Ov1", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
