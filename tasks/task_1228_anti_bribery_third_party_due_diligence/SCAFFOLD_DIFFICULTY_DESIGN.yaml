            - { call: "POST /compliance/third-parties/${tp_id}/red-flags", payload: { severity: "MEDIUM", description: "beneficial ownership opaque" }, as: ComplianceOfficer, as_user_id: "u_co1", captures: { rf_id: $.data.id } }
            - { call: "POST /compliance/red-flags/${rf_id}/disposition", payload: { disposition: "ESCALATE" }, as: ComplianceOfficer, as_user_id: "u_co1" }
