      - name: accepting_an_already_active_contract_twice_returns_409
        claim_type: Idempotency
        grounds:
          - state_machines.GrapeContract.lifecycle.OFFERED_to_ACTIVE
          - validations.priority_20
          - errors[ERR_CONTRACT_STATE_INVALID]
        distinguishing_aspect: |
          Accept is NOT idempotent: the second call must 409 rather than silently
          re-run. That matters because the edge cascade-creates installments — a
          tolerant second accept would duplicate the whole plan. The corner asserts
          both the error AND the absence of a second set of installment rows.
