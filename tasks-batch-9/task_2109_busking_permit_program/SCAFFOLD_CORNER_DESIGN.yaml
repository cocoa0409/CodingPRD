        claim_type: error_triggerable
        grounds: ["errors[ERR_CLOSURE_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / zone_closure_closed_intervals_exhaust_concurrent_capacity
