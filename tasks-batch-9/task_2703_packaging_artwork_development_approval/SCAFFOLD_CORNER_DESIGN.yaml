      - name: a_penalty_landing_exactly_on_seventy_leaves_the_printer_certified
        claim_type: threshold
        grounds:
          - calculations.printer_performance_penalty
          - calculations.printer_performance_penalty.constants.PRINTER_PROBATION_SCORE
          - calculations.printer_performance_penalty.constants.PENALTY_POINTS_PER_1000_UNITS
          - calculations.printer_performance_penalty.constants.ESCAPE_STAGE_PENALTY_POINTS
          - entities.Printer.fields.performance_score
          - entities.Printer.fields.certification_status
          - endpoints[POST /error-escapes/{id}/settle]
        distinguishing_aspect: |
          13000 units at 2.0 points per 1000 is 26.0, plus 4.0 for a PACKING discovery,
          is exactly 30.0 - so the score lands on 70.0, the probation threshold itself.
          The comparison is strict (<), so the printer must stay CERTIFIED and its
          proofs must keep requires_recheck false. An implementation using <= flips a
          fully compliant vendor onto probation at the boundary, and one that divides
          units by 1000 with integer truncation before multiplying still gets 26.0 here
          but would need the cap; the discriminator is the single equality at 70.0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, then 2026-08-20T00:00:00Z for the settlement."
            - "ArtworkVersion v1 of a CARTON / COATED_PAPER / US asset is RELEASED_TO_PRINT against a PROOF_APPROVED proof."
            - "Printer Cascade Print Co starts CERTIFIED with performance_score 100.0, escape_count 0, recovery_balance_cents 0 and recovery_liability_cap_cents 5000000."
            - "ErrorEscape: defect COLOR_OUT_OF_TOLERANCE, discovered_stage PACKING (an EARLY stage, so investigation_fee_cents 60000), units_affected 13000, root_cause_party PRINTER with printer_share_pct 1.00."
            - "The escape is RECOVERY_CLAIMED with provisional_recovery_cents 697000 (546000 reprint + 91000 scrap + 0 freight + 60000 investigation) and liability_cap_applied false."
