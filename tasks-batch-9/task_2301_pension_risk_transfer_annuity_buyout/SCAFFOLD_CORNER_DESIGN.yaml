          assert:
            - "accounting_funded_status_bp == 9200 and settlement_basis_liability_cents == 107000000 (100000000 x 10700 / 10000)"
            - "settlement_funded_status_bp == 8598 and unfunded_settlement_gap_cents == 15000000"
            - "participant_liability_total_cents == 11460000, cumulative_settlement_charge_cents == 0 and deferred_settlement_charge_cents == 0"
            - "${reg_acct_bp} == ${act_acct_bp}, ${reg_settle_liab} == ${act_settle_liab} and ${reg_gap} == ${act_gap} — the read is role-independent"
            - "${v_after} == ${v_before} and the settlement-entry list returns total_count == 0 — two reads persisted nothing"
            - "the response body carries no id and no version field"

      - name: participant_assignment_links_two_entities_or_refuses
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/prt/tranches/{id}/participant-assignments
          - state_machines.ParticipantRecord.IN_PLAN_to_ASSIGNED
          - errors.ERR_PARTICIPANT_PLAN_MISMATCH
          - errors.ERR_PARTICIPANT_ALREADY_ASSIGNED
        distinguishing_aspect: |
          The link endpoint must validate both ends and in the declared order: an
          unknown participant is a 404, a participant of another plan and a
          participant of the wrong cohort both collapse onto the single 409
          ERR_PARTICIPANT_PLAN_MISMATCH, and re-assigning an already-ASSIGNED
          participant is ERR_PARTICIPANT_ALREADY_ASSIGNED because the status check sits
          ahead of the ownership checks. Only the successful link mutates the tranche's
          derived liabilities.
        test_recipe:
          setup:
            - "plan A with a DEFERRED_VESTED and a RETIREE_IN_PAY participant, plan B with a DEFERRED_VESTED participant, and a DRAFT tranche on plan A targeting DEFERRED_VESTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
