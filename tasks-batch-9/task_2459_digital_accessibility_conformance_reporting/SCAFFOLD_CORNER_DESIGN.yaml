              payload: { name: "Train 2026.09", window_start: "2026-09-05", window_end: "2026-09-27", freeze_days: 2, effort_capacity_points: 10, remediation_budget_cents: 100000 }
              as: AccessibilityLead
              captures: { train_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_a}", criterion_id: "${crit_id}", severity: "SERIOUS", summary: "Media library thumbnails expose no accessible name", effort_points: 2, target_remediation_date: "2026-09-25", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_id: $.data.id }
            - call: "POST /known-issues/${iss_id}/triage"
