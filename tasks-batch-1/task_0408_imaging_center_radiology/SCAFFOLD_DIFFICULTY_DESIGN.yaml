  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_with_cleanup_buffer
        grounds:
          - validations[priority=17]
          - entities.Room.fields.cleanup_buffer_minutes
          - state_machines.ImagingExam.transitions.BOOKED
        distinguishing_aspect: |
          Room interval semantics include a trailing cleanup buffer: the room is busy over
          [start, end + cleanup_buffer_minutes). A new booking whose start falls inside the prior
          exam's buffer window is rejected ERR_ROOM_DOUBLE_BOOKED even though [start,end) of the
          two exams do not strictly overlap.
