        excluded_because:
          difficulty_instance: resource_temporal_overlap / maintenance_window_closed_interval_forty_five_minute_buffer
          rationale: "The closed-interval 45-minute buffer check and its ordering ahead of the region-wide concurrency cap are asserted there."

  - section: endpoints
    instances:
      - name: clock_set_endpoint_moves_logical_time_and_stamps_new_rows
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /radio-system/_clock/set_current_utc]
          - entities.SiteEvent.fields.detected_at
        distinguishing_aspect: "The clock endpoint echoes current_utc == 2026-09-15T12:34:56Z and every subsequently system-stamped instant uses it: the SiteEvent created afterwards has detected_at == 2026-09-15T12:34:56Z."
        test_recipe:
          setup:
            - "Empty database; the startup default clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /radio-system/sites"
              payload: { site_code: "CLK-1", name: "Clock One", channel_capacity: 4, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_clk_id: "$.data.id" }
          trigger:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:34:56Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_clk_id}", event_class: "UNPLANNED_OUTAGE", cause: "LINK_FAILURE" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { event_clk_id: "$.data.id" }
          assert:
            - "trigger[0] returns HTTP 200 with data.current_utc == \"2026-09-15T12:34:56Z\""
            - "trigger[1] returns HTTP 201 and SiteEvent.${event_clk_id}.detected_at == \"2026-09-15T12:34:56Z\""
            - "SiteEvent.${event_clk_id}.status == OPEN and Site.${site_clk_id}.status == IN_SERVICE"

      - name: migration_readiness_computed_read_reports_zero_for_empty_scope
        claim_type: computed_read
        grounds:
          - endpoints[GET /radio-system/migration-readiness]
          - calculations.fleet_migration_readiness
        distinguishing_aspect: "With one INVENTORY unit and nothing else, the STRICT scope is empty, so evaluated_unit_count == 0, ready_unit_count == 0 and readiness_pct is exactly 0.0 rather than a division-by-zero or 100.0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; agency MIG owns one INVENTORY unit and no unit is ASSIGNED anywhere."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Migration Empty Agency", agency_code: "MIG01", agency_type: "EMS", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_mig_id: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_mig_id}", serial_number: "MIG0001", radio_id: 35001, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_mig_id}"
              captures: { unit_mig_id: "$.data.id" }
          trigger:
            - call: "GET /radio-system/migration-readiness"
              payload: { agency_id: "${agency_mig_id}" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "GET /radio-system/migration-readiness"
              payload: { agency_id: "${agency_mig_id}", basis: "PLANNED" }
              as: SystemAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger[0] returns HTTP 200 with data.basis == STRICT (the default when the parameter is absent)"
            - "trigger[0] data.evaluated_unit_count == 0, data.ready_unit_count == 0, data.readiness_pct == 0.0"
            - "trigger[1] returns HTTP 200 with data.basis == PLANNED and identical zero counters (an INVENTORY unit is outside both scopes)"
            - "SubscriberUnit.${unit_mig_id}.provision_status == INVENTORY"

      - name: template_revision_supersedes_parent_and_retires_it
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /radio-system/templates/{template_id}/revisions]
          - entities.RadioTemplate.fields.supersedes_template_id
          - entities.RadioTemplate.fields.template_version
        distinguishing_aspect: "The revision endpoint links the two RadioTemplate rows: the child carries supersedes_template_id == parent id and template_version 2 in status DRAFT, while the parent is flipped to RETIRED and its record version increments by 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; template REV-BASE-1 exists and is PUBLISHED."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/templates"
              payload: { template_name: "REV-BASE-1", target_standard: "P25_PHASE1", talkgroup_slot_count: 6 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_rev_parent: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_rev_parent}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "GET /radio-system/templates/${tpl_rev_parent}"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_rev_parent_v: "$.data.version" }
          trigger:
            - call: "POST /radio-system/templates/${tpl_rev_parent}/revisions"
              payload: { template_name: "REV-BASE-2", target_standard: "NG_LMR", talkgroup_slot_count: 6, encryption_required: true, expected_template_version: "${tpl_rev_parent_v}" }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_rev_child: "$.data.id" }
          assert:
            - "trigger[0] returns HTTP 201"
            - "RadioTemplate.${tpl_rev_child}.supersedes_template_id == ${tpl_rev_parent} and template_version == 2 and status == DRAFT"
            - "RadioTemplate.${tpl_rev_child}.target_standard == NG_LMR, encryption_required == true, created_by_user_id == \"fe-1\", deployed_unit_count == 0"
            - "RadioTemplate.${tpl_rev_parent}.status == RETIRED and RadioTemplate.${tpl_rev_parent}.version == ${tpl_rev_parent_v} + 1"
            - "GET /radio-system/templates?supersedes_template_id=${tpl_rev_parent} returns total_count == 1 with the single row id == ${tpl_rev_child}"

      - name: unit_lifecycle_action_endpoint_rejects_unknown_action
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /radio-system/units/{unit_id}/lifecycle]
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "action is a closed set on the lifecycle endpoint, so action REPROGRAM is rejected with HTTP 400 ERR_INVALID_REQUEST (enum membership, priority 7) rather than 409 ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; agency ACT owns one INVENTORY unit."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Action Enum Agency", agency_code: "ACT01", agency_type: "FIRE", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_act_id: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_act_id}", serial_number: "ACT0001", radio_id: 36001, model: "CONTROL_STATION" }
              as: AgencyRadioManager
              as_user_id: "${agency_act_id}"
              captures: { unit_act_id: "$.data.id" }
          trigger:
            - call: "POST /radio-system/units/${unit_act_id}/lifecycle"
              payload: { action: "REPROGRAM" }
              as: AgencyRadioManager
              as_user_id: "${agency_act_id}"
              captures: { action_enum_error_id: "$.data.error_id" }
          assert:
            - "trigger[0] returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "SubscriberUnit.${unit_act_id}.provision_status == INVENTORY and key_status == KEYLESS"
            - "A follow-up call with action ZEROIZE returns HTTP 200 and key_status == ZEROIZED (the endpoint itself is reachable)"

  - section: errors
