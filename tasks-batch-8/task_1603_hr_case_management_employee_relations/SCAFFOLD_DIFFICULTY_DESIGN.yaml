            - call: "POST /er/employees"
              payload: { employee_number: "S-901", full_name: "Subject I", email: "s901@example.com", location_code: "CHI", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-901", full_name: "Inv I1", email: "i901@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "DISCRIMINATION", severity: "HIGH" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "POST /er/cases/${c1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${sub}", scheduled_start: "2026-07-27T09:00:00Z", scheduled_end: "2026-07-27T10:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv1: $.data.id }
            - call: "POST /er/interviews/${iv1}/complete"
              payload: { documentation_text: "Priority case subject interview fully documented with material statements recorded at length." }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/evidence-items"
              payload: { submitted_by_employee_id: "${rep}", evidence_type: "EMAIL", description: "Priority case email evidence." }
              as: Investigator
