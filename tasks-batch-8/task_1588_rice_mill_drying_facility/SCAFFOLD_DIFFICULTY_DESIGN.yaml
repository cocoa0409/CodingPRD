              as: QualityLabTech
              captures: { dry_b: $.data.dry_weight_cwt, chg_b: $.data.drying_charge_cents }
          trigger: []
          assert:
            - "captured dry_a == 363.00 (exactly base moisture: no shrink)"
            - "captured shrink_a == 0 and captured hand_a == 0 and captured chg_a == 0"
            - "captured dry_b == 360.77 (0.1 point: 0.1149425% moisture shrink + 0.5% handling cliff; 363 * 0.9938506 = 360.77)"
            - "captured chg_b == 145 (363.00 * 0.1 * 4 = 145.2, round_half_up)"

