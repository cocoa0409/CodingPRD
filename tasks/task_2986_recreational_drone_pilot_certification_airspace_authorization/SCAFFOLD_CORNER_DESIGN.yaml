            - "${granted} == 400 == min(400, 700, 1200, max(400, 400)) and ${astatus} == \"APPROVED\""
            - "flight creation: HTTP 201, ${fstatus} == \"PLANNED\", ${covering} == \"${polid}\" - the selector ran and priorities 24, 25, 26, 27, 35, 36, 37 all passed"
            - "${result} == \"PASSED\" with ${findings} == [] (an empty array, not null), ${klass} == \"C\" and ${ceiling} == 400 from the authorization rather than BASE_CEILING_FT"
            - "${launched} == \"IN_PROGRESS\" and ${started} == \"2026-10-05T09:00:00Z\""
            - "${after_launch} == \"ACTIVE\" - the authorization was consumed into use by the launch, and the zone's reserved_slot_count is still 1"

      - name: a_restriction_published_after_clearance_blocks_the_launch_until_lifted
        claim_type: temporal_validation
        grounds:
          - validations.priority_22
          - state_machines.TemporaryFlightRestriction
          - endpoints.POST_/drone-ops/tfrs
          - endpoints.POST_/drone-ops/flights/{id}/launch
        distinguishing_aspect: |
          The TFR gate is re-evaluated at launch against the restrictions that exist then, not at
          the moment the flight was cleared. A flight already sitting in PREFLIGHT_CLEARED is
          overtaken by a total-ban restriction published afterwards and must be refused; lifting
          that restriction re-opens the launch. A second restriction whose window starts exactly
          at the flight's planned_end never blocks anything, because the overlap test is
          half-open on both intervals - so the instance separates "a restriction exists on my
          zone" from "a restriction overlaps my window".
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One RECREATIONAL pilot CERTIFIED via TRUST_RECREATIONAL at 100, one REGISTERED 249 g airframe, one uncontrolled class G zone."
            - "One PLANNED RECREATIONAL flight for 2026-09-10T09:00:00Z-10:00:00Z at planned_max_altitude_ft 380, already PREFLIGHT_CLEARED while no restriction existed."
            - "Then TFR-T (touching): 2026-09-10T10:00:00Z .. 12:00:00Z, max_permitted_altitude_ft omitted (total ban)."
            - "Then TFR-O (overlapping): 2026-09-10T09:30:00Z .. 11:00:00Z, max_permitted_altitude_ft omitted (total ban)."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Kip Halloran", email: "kip.halloran@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 100 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Tfr 1", serial_number: "SN-TFR-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-TFR", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-09-10T09:00:00Z", planned_end: "2026-09-10T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 46.60, launch_longitude: -120.51 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id }
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { first_result: $.data.result, first_tfrs: $.data.active_tfr_ids }
            - call: "POST /drone-ops/tfrs"
              payload: { zone_id: "${zid}", reason: "Stadium event overflight ban.", effective_from: "2026-09-10T10:00:00Z", effective_until: "2026-09-10T12:00:00Z" }
              as: AirspaceAuthority
              captures: { tfr_t: $.data.id, tfr_t_cap: $.data.max_permitted_altitude_ft }
            - call: "POST /drone-ops/tfrs"
              payload: { zone_id: "${zid}", reason: "Wildfire suppression aircraft operating.", effective_from: "2026-09-10T09:30:00Z", effective_until: "2026-09-10T11:00:00Z" }
              as: AirspaceAuthority
              captures: { tfr_o: $.data.id }
          trigger:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_id: $.data.error_id }
            - call: "GET /drone-ops/flights/${fid}"
              payload: {}
              as: ComplianceOfficer
              captures: { held: $.data.status }
            - call: "POST /drone-ops/tfrs/${tfr_o}/lift"
              payload: {}
              as: AirspaceAuthority
              captures: { lifted: $.data.status }
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { launched: $.data.status }
            - call: "GET /drone-ops/tfrs/${tfr_t}"
              payload: {}
              as: ComplianceOfficer
              captures: { touching_status: $.data.status }
          assert:
            - "${first_result} == \"PASSED\" and ${first_tfrs} == [] - the clearance was granted before either restriction existed"
            - "${tfr_t_cap} == null - omitting max_permitted_altitude_ft yields a total ban, not 0 and not 2000"
            - "first launch: HTTP 422 with ${err_id} == \"ERR_TFR_ACTIVE\" and ${held} == \"PREFLIGHT_CLEARED\" - the refusal does not consume or cancel the clearance"
            - "${lifted} == \"LIFTED\" and the second launch returns HTTP 200 with ${launched} == \"IN_PROGRESS\""
            - "${touching_status} == \"ACTIVE\" - TFR-T is still live on the same zone and still never blocked the flight, because [10:00, 12:00) does not overlap [09:00, 10:00)"
            - "an implementation testing overlap with closed intervals would refuse the second launch as well"

      - name: authorization_is_demanded_only_where_the_zone_declares_it
        claim_type: conditional_validation
        grounds:
          - validations.priority_24
          - entities.AirspaceZone.fields.requires_authorization
          - endpoints.POST_/drone-ops/flights
        distinguishing_aspect: |
          Priority 24 is conditional on one boolean of a different aggregate: the same flight body,
          minus authorization_id, is legal in a class E zone whose requires_authorization is false
          and illegal in a class C zone whose flag is true. The third call shows the gate is
          satisfiable rather than absolute - the same controlled-zone flight is accepted once it
          cites an APPROVED authorization whose pilot, aircraft and zone all match.
        test_recipe:
          setup:
            - "Logical clock at 2026-11-01T00:00:00Z."
            - "One RECREATIONAL pilot CERTIFIED via TRUST_RECREATIONAL at 100 with one REGISTERED 249 g airframe (max_altitude_ft 900)."
            - "Zone E: class E, class_ceiling_ft 500, requires_authorization false. Zone C: class C, class_ceiling_ft 700, requires_authorization true, max_concurrent_authorizations 2."
            - "An APPROVED authorization on zone C for 2026-11-12T08:00:00Z .. 12:00:00Z at granted_ceiling_ft 400."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Dara Voss", email: "dara.voss@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-11-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 100 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Cond 2", serial_number: "SN-CD2-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-E-CD2", class_code: "E", class_ceiling_ft: 500, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { ze: $.data.id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-C-CD2", class_code: "C", class_ceiling_ft: 700, requires_authorization: true, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zc: $.data.id }
            - call: "GET /drone-ops/airspace-zones/${zc}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { zv: $.data.version }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zc}", requested_ceiling_ft: 400, window_start: "2026-11-12T08:00:00Z", window_end: "2026-11-12T12:00:00Z", expected_zone_version: "${zv}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { aid: $.data.id }
            - call: "POST /drone-ops/airspace-authorizations/${aid}/decide"
              payload: { decision: "APPROVE" }
              as: AirspaceAuthority
              as_user_id: "aa-33"
              captures: { granted: $.data.granted_ceiling_ft }
          trigger:
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${ze}", operation_category: "RECREATIONAL", planned_start: "2026-11-10T09:00:00Z", planned_end: "2026-11-10T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 43.61, launch_longitude: -116.20 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { uncontrolled_flight: $.data.id, uncontrolled_auth: $.data.authorization_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zc}", operation_category: "RECREATIONAL", planned_start: "2026-11-12T09:00:00Z", planned_end: "2026-11-12T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 43.61, launch_longitude: -116.20 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_id: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zc}", authorization_id: "${aid}", operation_category: "RECREATIONAL", planned_start: "2026-11-12T09:00:00Z", planned_end: "2026-11-12T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 43.61, launch_longitude: -116.20 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { controlled_flight: $.data.id, controlled_auth: $.data.authorization_id }
          assert:
            - "${granted} == 400 == min(400, 700, 900, max(400, RECREATIONAL_CAP_FT 400))"
            - "first flight: HTTP 201 with ${uncontrolled_auth} == null - a class E zone with requires_authorization false demands nothing"
            - "second flight: HTTP 422 with ${err_id} == \"ERR_AUTHORIZATION_REQUIRED\" - identical body, controlled zone, no authorization_id"
            - "third flight: HTTP 201 with ${controlled_auth} == \"${aid}\" - the same window is legal once the APPROVED authorization is cited"
            - "${uncontrolled_flight} != ${controlled_flight} and GET /drone-ops/flights?pilot_id=${pid} returns total_count 2, so the refused attempt left no row"
            - "the refusal is not ERR_INVALID_REQUEST: authorization_id is declared optional on the endpoint and only this zone-conditional rule makes it mandatory"

      - name: fiscal_gates_answer_in_priority_order_as_each_is_satisfied
        claim_type: cascading_validation
        grounds:
          - validations.priority_35
          - validations.priority_36
          - calculations.covering_policy_selection
          - endpoints.POST_/drone-ops/flights
        distinguishing_aspect: |
          One unchanged COMMERCIAL flight body is submitted three times while the insurance
          picture is filled in one layer at a time: with no policy at all priority 35 answers,
          with an ACTIVE but unindemnified policy priority 36 answers, and only when an
          indemnified policy exists does the flight succeed. It pins that the checks form an
          ordered chain over the same candidate set rather than one lumped "insurance invalid"
          error, and that the selector's eligibility filter - not its DESC ranking - is what
          excludes the unindemnified policy even though both policies have identical
          remaining_coverage_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-05-01T00:00:00Z, one REGISTERED 249 g airframe, one uncontrolled class G zone."
            - "The pilot starts with no InsurancePolicy at all."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Anders Kwok", email: "anders.kwok@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 78 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Chain 1", serial_number: "SN-CHN-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-CHN", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
          trigger:
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-05-20T09:00:00Z", planned_end: "2026-05-20T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 40.76, launch_longitude: -111.89 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_stage1: $.data.error_id }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Wasatch Indemnity", policy_number: "POL-CHN-01", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-05-01T00:00:00Z", effective_until: "2027-05-01T00:00:00Z", indemnification_clause_accepted: false }
              as: Pilot
              as_user_id: "${pid}"
              captures: { p1: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${p1}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
              captures: { p1_status: $.data.coverage_status }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-05-20T09:00:00Z", planned_end: "2026-05-20T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 40.76, launch_longitude: -111.89 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_stage2: $.data.error_id }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Wasatch Indemnity", policy_number: "POL-CHN-02", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-05-01T00:00:00Z", effective_until: "2027-05-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { p2: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${p2}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-05-20T09:00:00Z", planned_end: "2026-05-20T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 40.76, launch_longitude: -111.89 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id, covering: $.data.covering_policy_id }
          assert:
            - "stage 1: HTTP 402 with ${err_stage1} == \"ERR_INSURANCE_NOT_ACTIVE\" - no ACTIVE policy exists at all"
            - "${p1_status} == \"ACTIVE\" and stage 2: HTTP 402 with ${err_stage2} == \"ERR_INDEMNIFICATION_NOT_ACCEPTED\" - priority 35 is now satisfied, so the next link answers"
            - "neither refusal is ERR_INSURANCE_COVERAGE_INSUFFICIENT: 2000000 is well above MIN_COMMERCIAL_COVERAGE_CENTS, so priority 37 never fires"
            - "stage 3: HTTP 201 with ${covering} == \"${p2}\" - P1 and P2 have identical remaining_coverage_cents 2000000, so only the eligibility predicate can separate them"
            - "the two refusals wrote nothing: GET /drone-ops/flights?pilot_id=${pid} returns total_count 1 with the single row ${fid}"

      - name: two_errors_racing_on_one_launch_resolve_by_priority
        claim_type: priority_ordering
        grounds:
          - validations.priority_13
          - validations.priority_20
        excluded_because:
          difficulty_instance: launch_state_error_precedes_remote_id_safety_error_and_leaves_module_verified
          rationale: "That §1.8 instance builds a request violating both rules at once and asserts the lower-priority error is the one returned, with no side effect from the losing check."

      - name: a_safety_error_outranks_a_fiscal_error_on_one_request
        claim_type: priority_conflict
        grounds:
          - validations.priority_17
          - validations.priority_37
        excluded_because:
          difficulty_instance: authorization_currency_safety_error_precedes_insurance_fiscal_error
          rationale: "The safety-versus-fiscal ordering, and the CERTIFIED -> LAPSED side effect the winning check still performs, are asserted there."

      - name: a_gate_reads_the_state_of_a_different_entity
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_20
          - state_machines.RemoteIdModule
        excluded_because:
          difficulty_instance: flight_launch_depends_on_remote_id_module_state
          rationale: "Launching one flight across every RemoteIdModule state, including the VERIFIED -> EXPIRED demotion the gate itself performs, is that instance's whole subject."

      - name: a_gate_counts_rows_across_a_window
        claim_type: aggregate_validation
        grounds:
          - validations.priority_28
          - calculations.zone_slot_occupancy
        excluded_because:
          difficulty_instance: zone_capacity_half_open_windows_touching_authorizations_do_not_collide
          rationale: "The capacity count over overlapping half-open windows, and the touching window that must not collide, are asserted there."

  - section: endpoints
    instances:
      - name: restriction_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/drone-ops/tfrs
          - endpoints.GET_/drone-ops/tfrs/{id}
          - endpoints.GET_/drone-ops/tfrs
          - endpoints.POST_/drone-ops/tfrs/{id}/lift
        distinguishing_aspect: |
          The CRUD surface this API actually declares: create, read by id and filtered list, with
          every mutation after creation expressed as a named action endpoint - there is no PATCH
          and no DELETE anywhere in §1.5, so a "restriction update" or "restriction delete" route
          must not exist. The two declared list filters are exercised independently and the
          status filter is re-read after the lift action to prove the list reflects the new state.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-01T00:00:00Z."
            - "Two zones: ZONE-G-CRD (class G) and ZONE-D-CRD (class D)."
            - "One restriction on each zone, created in that order."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AirspaceAuthority
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-CRD", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zg: $.data.id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-D-CRD", class_code: "D", class_ceiling_ft: 500, requires_authorization: true, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zd: $.data.id }
          trigger:
            - call: "POST /drone-ops/tfrs"
              payload: { zone_id: "${zg}", reason: "Presidential movement.", effective_from: "2026-02-10T08:00:00Z", effective_until: "2026-02-10T20:00:00Z", max_permitted_altitude_ft: 100 }
              as: AirspaceAuthority
              captures: { t1: $.data.id, t1_status: $.data.status, t1_cap: $.data.max_permitted_altitude_ft, t1_pub: $.data.published_by_user_id }
            - call: "POST /drone-ops/tfrs"
              payload: { zone_id: "${zd}", reason: "Air show rehearsal.", effective_from: "2026-02-11T08:00:00Z", effective_until: "2026-02-11T20:00:00Z" }
              as: AirspaceAuthority
              captures: { t2: $.data.id }
            - call: "GET /drone-ops/tfrs/${t1}"
              payload: {}
              as: ComplianceOfficer
              captures: { read_reason: $.data.reason, read_zone: $.data.zone_id }
            - call: "GET /drone-ops/tfrs?zone_id=${zg}"
              payload: {}
              as: AirspaceAuthority
              captures: { by_zone_first: "$.data[0].id" }
            - call: "GET /drone-ops/tfrs?status=ACTIVE&limit=1&offset=0"
              payload: {}
              as: AirspaceAuthority
              captures: { active_first: "$.data[0].id" }
            - call: "POST /drone-ops/tfrs/${t1}/lift"
              payload: {}
              as: AirspaceAuthority
              captures: { lifted_status: $.data.status }
            - call: "GET /drone-ops/tfrs?status=LIFTED"
              payload: {}
              as: AirspaceAuthority
              captures: { lifted_first: "$.data[0].id" }
          assert:
            - "creation: HTTP 201 with ${t1_status} == \"ACTIVE\", ${t1_cap} == 100 and ${t1_pub} == the creating X-User-ID (system-stamped, not client-supplied)"
            - "read: HTTP 200 with ${read_reason} == \"Presidential movement.\" and ${read_zone} == \"${zg}\" - the read echoes the stored row"
            - "the zone_id filter returns total_count 1 with ${by_zone_first} == \"${t1}\" - the restriction on the other zone is excluded"
            - "the status=ACTIVE page at limit 1 returns 1 row (${active_first} is the earlier-created of the two), total_count 2 and has_more true - total_count spans the filtered set, not the page"
            - "${lifted_status} == \"LIFTED\" and afterwards status=LIFTED returns total_count 1 with ${lifted_first} == \"${t1}\", while GET /drone-ops/tfrs?status=ACTIVE returns total_count 1"
            - "no PATCH /drone-ops/tfrs/{id} and no DELETE /drone-ops/tfrs/{id} exist: §1.5 declares neither, so mutation is only ever through lift"

      - name: currency_projection_reports_without_writing_anything
        claim_type: computed_read
        grounds:
          - endpoints.GET_/drone-ops/pilots/{id}/currency-projection
          - endpoints.POST_/drone-ops/pilots/{id}/currency-review
          - calculations.pilot_currency_expiry
        distinguishing_aspect: |
          The projection endpoint declares an empty side_effects list, so it must report a lapse
          without causing one: read at a clock past the pilot's recency expiry it returns
          lapse_due true while the Pilot row stays CERTIFIED at an unchanged version, and only
          the explicit currency-review action performs the CERTIFIED -> LAPSED transition. The
          same read is taken twice at two clocks to pin days_remaining as a whole-day count of
          the gap to projected_expires_at, and the basis override is shown to change the answer
          without touching the stored currency_basis.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-01-01T00:00:00Z with no flights: base_expiry 2028-01-01T00:00:00Z, recency_expiry 2026-04-01T00:00:00Z, currency_expires_at 2026-04-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Piet Vanne", email: "piet.vanne@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 80 }
              as: ComplianceOfficer
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { v_before: $.data.version, expiry_before: $.data.currency_expires_at, basis_before: $.data.currency_basis }
          trigger:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-22T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /drone-ops/pilots/${pid}/currency-projection"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { basis1: $.data.basis_applied, proj1: $.data.projected_expires_at, days1: $.data.days_remaining, lapse1: $.data.lapse_due }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /drone-ops/pilots/${pid}/currency-projection"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { proj2: $.data.projected_expires_at, lapse2: $.data.lapse_due }
            - call: "GET /drone-ops/pilots/${pid}/currency-projection?basis=RECREATIONAL_BASIS"
              payload: {}
              as: ComplianceOfficer
              captures: { basis3: $.data.basis_applied, proj3: $.data.projected_expires_at, days3: $.data.days_remaining, lapse3: $.data.lapse_due }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { v_after: $.data.version, status_after: $.data.status, expiry_after: $.data.currency_expires_at, basis_after: $.data.currency_basis }
            - call: "POST /drone-ops/pilots/${pid}/currency-review"
              payload: {}
              as: ComplianceOfficer
              captures: { status_reviewed: $.data.status, v_reviewed: $.data.version }
          assert:
            - "${expiry_before} == \"2026-04-01T00:00:00Z\" and ${basis_before} == \"COMMERCIAL_BASIS\" (the pilot has never flown, so the anchor is issued_at)"
            - "first read at 2026-03-22: ${basis1} == \"COMMERCIAL_BASIS\" (defaulted from operator_category), ${proj1} == \"2026-04-01T00:00:00Z\", ${days1} == 10 and ${lapse1} == false"
            - "second read at 2026-04-10: ${proj2} == \"2026-04-01T00:00:00Z\" unchanged and ${lapse2} == true - the projection is now in the past, so days_remaining is not positive"
            - "override read: ${basis3} == \"RECREATIONAL_BASIS\", ${proj3} == \"2028-01-01T00:00:00Z\", ${days3} == 631 and ${lapse3} == false - the certificate alone would still be current"
            - "${v_after} == ${v_before}, ${status_after} == \"CERTIFIED\", ${expiry_after} == \"2026-04-01T00:00:00Z\" and ${basis_after} == \"COMMERCIAL_BASIS\" - three reads wrote nothing at all"
            - "only the explicit action changes state: ${status_reviewed} == \"LAPSED\" with ${v_reviewed} > ${v_before}"

      - name: covering_policy_link_is_navigable_and_propagates_to_the_report
        claim_type: cross_reference_link
        grounds:
          - entities.Flight.fields.covering_policy_id
          - entities.AccidentReport.fields.policy_id
          - endpoints.GET_/drone-ops/flights
          - endpoints.GET_/drone-ops/accident-reports
        distinguishing_aspect: |
          Two system-written foreign keys in a chain: the flight's covering_policy_id, which the
          client never supplies, and the report's policy_id, which is copied from it one hop later
          at filing. Both must be reachable through their declared list filters, so the instance
          fails both if the link is stored but unqueryable and if the report re-runs the selector
          instead of copying the flight's decision.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-07-01T00:00:00Z, one REGISTERED 249 g airframe, one uncontrolled class G zone."
            - "Two ACTIVE indemnified policies effective 2026-07-01 .. 2027-07-01: P_LOW 1500000 cents and P_HIGH 2000000 cents."
            - "One COMMERCIAL flight for 2026-07-05T09:00:00Z-10:00:00Z, flown to completion with incident_occurred true."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Lise Arendt", email: "lise.arendt@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 90 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Link 1", serial_number: "SN-LNK-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-LNK", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Baltic Re", policy_number: "POL-LNK-LOW", coverage_limit_cents: 1500000, deductible_cents: 50000, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-07-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { plow: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${plow}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Baltic Re", policy_number: "POL-LNK-HIGH", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-07-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { phigh: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${phigh}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-07-05T09:00:00Z", planned_end: "2026-07-05T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 55.68, launch_longitude: 12.57 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id, covering: $.data.covering_policy_id }
            - call: "GET /drone-ops/flights?covering_policy_id=${phigh}"
              payload: {}
              as: ComplianceOfficer
              captures: { high_first: "$.data[0].id" }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:05:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/complete"
