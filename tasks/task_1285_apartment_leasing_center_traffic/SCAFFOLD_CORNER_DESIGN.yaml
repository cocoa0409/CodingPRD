  # ===========================================================================
  - section: errors
    instances:
      - name: missing_auth_headers_returns_invalid_context
        claim_type: violation_to_error
        grounds: ["errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]", "validations[priority=1]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role fails priority-1 authentication with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /leasing/properties"
              payload: { name: "NoAuth", code: "NA1" }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "HTTP status == 400"

      - name: offer_mismatch_and_rent_floor_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_FLOORPLAN_MISMATCH]", "errors[ERR_RENT_OVERRIDE_TOO_LOW]"]
        excluded_because:
          difficulty_instance: lease_create_offer_mismatch_beats_rent_floor
          rationale: "Both error ids are exercised and their priority ordering asserted by the named §1.8 instance; ERR_RENT_OVERRIDE_TOO_LOW also fires standalone in rent_override_below_floor_rejected."

      - name: tour_time_conflict_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_TOUR_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: guided_tour_gap_equal_buffer_allowed_one_less_rejected
          rationale: "ERR_TOUR_TIME_CONFLICT is asserted at the exact buffer boundary by the named §1.8 instance."

      - name: not_leasable_and_not_executed_errors
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPLICATION_NOT_LEASABLE]", "errors[ERR_LEASE_NOT_EXECUTED]"]
        excluded_because:
          difficulty_instance: lease_generation_requires_leasable_application
          rationale: "ERR_APPLICATION_NOT_LEASABLE asserted by the named §1.8 instance; ERR_LEASE_NOT_EXECUTED asserted by movein_requires_executed_lease."

