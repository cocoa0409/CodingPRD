scenario: "generate task hard than expert level! 1200. Timber Sale & Forest Management Plan (consulting forester): stand inventory & cruise volume estimate, harvest prescription & silvicultural method, sale offering (lump sum vs per unit) & bidding, contract terms with performance bond, log scaling & payment verification, best-management-practice compliance & inspection, reforestation obligation & survival survey, carbon/conservation alternative valuation"
domain_name: timber-sale-forest-management
api_prefix: /forestry

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: ledger reconciliation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Forester
    parent: null
    common_fields: false
    fields:
      - { name: license_no, type: string, source: input, description: "State consulting-forester license number; unique per forester" }
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Landowner
    parent: null
    common_fields: false
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: tax_id, type: string, source: input, description: "Tax identification number" }

  - name: Buyer
    parent: null
    common_fields: false
    fields:
      - { name: company_name, type: string, source: input, description: "Mill / timber buyer company name" }
      - { name: license_no, type: string, source: input, description: "Timber buyer license number" }
      - { name: prior_defaults, type: integer, source: system, description: "Count of prior contract defaults; incremented when a contract of this buyer reaches TERMINATED", default: 0 }

  - name: Contractor
    parent: null
    common_fields: false
    fields:
      - { name: company_name, type: string, source: input, description: "Logging contractor company name" }
      - { name: license_no, type: string, source: input, description: "Logger license number" }

  - name: ForestTract
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tract name" }
      - { name: county, type: string, source: input, description: "County" }
      - { name: total_acres, type: number, source: input, description: "Gross acres; > 0" }
      - { name: landowner_id, type: string, source: input, description: "FK -> Landowner.id; owning landowner" }
      - { name: forester_id, type: string, source: input, description: "FK -> Forester.id; consulting forester of record" }
      - { name: status, type: enum, source: system, description: "OPEN or ENROLLED_CONSERVATION", default: OPEN, constraints: "enum {OPEN, ENROLLED_CONSERVATION}" }
      - { name: conservation_enrollment_start, type: datetime, source: system, description: "Enrollment window start (date), set on carbon valuation ACCEPTED; null otherwise", default: null }
      - { name: conservation_enrollment_end, type: datetime, source: system, description: "Enrollment window end (date) = start + 20 years; closed-interval bound", default: null }

  - name: Stand
    parent: null
    common_fields: true
    fields:
      - { name: tract_id, type: string, source: input, description: "FK -> ForestTract.id; containing tract" }
      - { name: name, type: string, source: input, description: "Stand label" }
      - { name: acres, type: number, source: input, description: "Stand acres; > 0 and <= tract.total_acres" }
      - { name: primary_species, type: string, source: input, description: "Dominant species code" }
      - { name: certified_cruise_id, type: string, source: system, description: "FK -> InventoryCruise.id; currently CERTIFIED cruise, null until first certification", default: null }

  - name: InventoryCruise
    parent: null
    common_fields: true
    fields:
      - { name: stand_id, type: string, source: input, description: "FK -> Stand.id; cruised stand" }
      - { name: cruise_date, type: string, source: input, description: "Field cruise date YYYY-MM-DD" }
      - { name: plots, type: array, source: input, description: "Tally rows: [{plot_number:int, species:string, volume_bf:number}]; one row per plot per species" }
      - { name: status, type: enum, source: system, description: "Cruise lifecycle", default: DRAFT, constraints: "enum {DRAFT, TALLIED, RECONCILED, CERTIFIED, SUPERSEDED, VOID}" }
      - { name: reconciled_plot_numbers, type: array, source: system, description: "Plot numbers confirmed at reconcile; null until reconciled", default: null }
      - { name: n_plots, type: integer, source: computed, description: "Count of distinct plot_number in plots" }
      - { name: expansion_factor, type: number, source: computed, description: "stand.acres / (PLOT_SIZE_ACRES * n_plots)" }
      - { name: provisional_volume_bf, type: integer, source: computed, description: "Expanded volume over ALL tallied rows (calc cruise_volume_estimate, PROVISIONAL variant)" }
      - { name: certified_volume_bf, type: integer, source: computed, description: "Expanded volume over reconciled plots only, times (1 - sampling_error_pct/100); null until reconcile", default: null }
      - { name: certified_volume_by_species, type: array, source: computed, description: "[{species, volume_bf}] certified breakdown, same adjustment applied per species; null until reconcile", default: null }
      - { name: sampling_error_pct, type: number, source: computed, description: "Population stddev of per-plot totals / mean / sqrt(n) * 100, 2dp round_half_up; null until reconcile", default: null }
      - { name: certified_at, type: datetime, source: system, description: "Timestamp of CERTIFIED transition; null until certified", default: null }

  - name: HarvestPrescription
    parent: null
    common_fields: true
    fields:
      - { name: stand_id, type: string, source: input, description: "FK -> Stand.id; prescribed stand" }
      - { name: cruise_id, type: string, source: input, description: "FK -> InventoryCruise.id; cruise underpinning the prescription (must be CERTIFIED at approve time)" }
      - { name: silvicultural_method, type: enum, source: input, description: "Prescribed method", constraints: "enum {CLEARCUT, SHELTERWOOD, SEED_TREE, SELECTION, COMMERCIAL_THINNING}" }
      - { name: window_start, type: string, source: input, description: "Harvest window start date YYYY-MM-DD" }
      - { name: window_end, type: string, source: input, description: "Harvest window end date YYYY-MM-DD; half-open bound, must be > window_start" }
      - { name: status, type: enum, source: system, description: "Prescription lifecycle with revision loop", default: DRAFT, constraints: "enum {DRAFT, PROPOSED, APPROVED, ACTIVE, COMPLETED, WITHDRAWN}" }

  - name: TimberSale
    parent: null
    common_fields: true
    fields:
      - { name: tract_id, type: string, source: input, description: "FK -> ForestTract.id; sale tract" }
      - { name: stand_id, type: string, source: input, description: "FK -> Stand.id; sale stand; must equal prescription.stand_id" }
      - { name: prescription_id, type: string, source: input, description: "FK -> HarvestPrescription.id; governing prescription" }
      - { name: sale_type, type: enum, source: input, description: "Offering type", constraints: "enum {LUMP_SUM, PER_UNIT}" }
      - { name: scaling_rule, type: enum, source: input, description: "Governing log rule for payment", constraints: "enum {DOYLE, INTERNATIONAL_14}" }
      - { name: advertised_minimum_cents, type: integer, source: input, description: "Advertised minimum acceptable total bid (cents); >= 0" }
      - { name: species_minimum_rates, type: array, source: input, description: "Required iff sale_type=PER_UNIT: [{species, min_rate_cents_per_mbf}]; floor rates per species", default: null }
      - { name: bid_open_at, type: string, source: input, description: "Bid window open ISO datetime; bids accepted when open <= clock < close" }
      - { name: bid_close_at, type: string, source: input, description: "Bid window close ISO datetime; must be > bid_open_at" }
      - { name: harvest_window_start, type: string, source: input, description: "Allowed harvest start date YYYY-MM-DD" }
      - { name: harvest_window_end, type: string, source: input, description: "Allowed harvest end date YYYY-MM-DD; half-open bound" }
      - { name: status, type: enum, source: system, description: "Sale lifecycle with reoffer loop", default: DRAFT, constraints: "enum {DRAFT, OFFERED, BIDDING_OPEN, BIDDING_CLOSED, AWARDED, NO_SALE, CANCELLED}" }
      - { name: winning_bid_id, type: string, source: computed, description: "id of the winning Bid computed at close-bidding by bid_evaluation; null if no qualifying bid", default: null }
      - { name: awarded_value_cents, type: integer, source: computed, description: "Winning bid_total_cents, set at award; null until awarded", default: null }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> TimberSale.id; target sale" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; taken from X-User-ID of the acting Buyer" }
      - { name: deposit_cents, type: integer, source: input, description: "Bid deposit (cents); >= 0" }
      - { name: lump_sum_amount_cents, type: integer, source: input, description: "Required iff sale LUMP_SUM: total offer cents; must be null for PER_UNIT", default: null }
      - { name: species_rates, type: array, source: input, description: "Required iff sale PER_UNIT: [{species, rate_cents_per_mbf}] covering every advertised species; must be null for LUMP_SUM", default: null }
      - { name: bid_total_cents, type: integer, source: computed, description: "LUMP_SUM: lump_sum_amount_cents. PER_UNIT: sum over species of round_half_up(rate * certified_volume_by_species.bf / 1000), per-species rounded then summed" }
      - { name: submitted_at, type: datetime, source: system, description: "Server clock timestamp of submission" }
      - { name: status, type: enum, source: system, description: "Bid lifecycle; resubmission by same buyer supersedes prior SUBMITTED bid", default: SUBMITTED, constraints: "enum {SUBMITTED, SUPERSEDED, WITHDRAWN, DISQUALIFIED, WINNING, LOST}" }

  - name: HarvestContract
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: system, description: "FK -> TimberSale.id; originating sale" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; winning buyer" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; assigned logging contractor; null until assigned", default: null }
      - { name: status, type: enum, source: system, description: "Contract lifecycle with suspend and default/cure loops", default: PENDING_BOND, constraints: "enum {PENDING_BOND, ACTIVE, HARVESTING, SUSPENDED, HARVEST_COMPLETE, DEFAULTED, TERMINATED, CLOSED}" }
      - { name: awarded_value_cents, type: integer, source: system, description: "Copied from sale at award" }
      - { name: governing_scaling_rule, type: enum, source: system, description: "Copied from sale.scaling_rule at award", constraints: "enum {DOYLE, INTERNATIONAL_14}" }
      - { name: required_bond_amount_cents, type: integer, source: computed, description: "calc performance_bond_amount at award" }
      - { name: cumulative_verified_bf, type: integer, source: computed, description: "Sum of bf_governing over tickets with status VERIFIED", default: 0 }
      - { name: verified_volume_by_species, type: array, source: computed, description: "[{species, volume_bf}] over VERIFIED tickets", default: [] }
      - { name: billed_total_cents, type: integer, source: system, description: "Sum of gross_cents over settlements in {DRAFT, APPROVED, PAID, REFUNDED} (excludes VOID)", default: 0 }
      - { name: disbursed_total_cents, type: integer, source: system, description: "Sum of net_cents over PAID settlements plus holdback releases", default: 0 }
      - { name: refunded_total_cents, type: integer, source: system, description: "Sum of net_cents over REFUNDED settlements", default: 0 }
      - { name: holdback_balance_cents, type: integer, source: system, description: "Retained reforestation holdback not yet released", default: 0 }
      - { name: consulting_fee_total_cents, type: integer, source: system, description: "Sum of fee_cents over non-VOID settlements", default: 0 }
      - { name: open_major_findings_count, type: integer, source: computed, description: "Count of inspections in NONCOMPLIANT with severity MAJOR on this contract", default: 0 }
      - { name: defaulted_at, type: datetime, source: system, description: "Timestamp of DEFAULTED transition; null if never defaulted", default: null }
      - { name: harvest_completed_at, type: datetime, source: system, description: "Timestamp of HARVEST_COMPLETE transition; null until then", default: null }

  - name: PerformanceBond
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> HarvestContract.id; bonded contract (1:1)" }
      - { name: amount_cents, type: integer, source: input, description: "Posted amount; must equal contract.required_bond_amount_cents" }
      - { name: status, type: enum, source: system, description: "Bond lifecycle with claim loop", default: POSTED, constraints: "enum {POSTED, FORFEIT_CLAIMED, FORFEITED, RELEASED}" }
      - { name: reforestation_hold_cents, type: integer, source: computed, description: "min(amount_cents, stand.acres * per-acre hold constant); recomputed upward on REPLANT_REQUIRED" }
      - { name: admin_fee_cents, type: integer, source: system, description: "Waterfall bucket 1 on FORFEITED", default: 0 }
      - { name: remediation_offset_cents, type: integer, source: system, description: "Waterfall bucket 2 on FORFEITED", default: 0 }
      - { name: shortfall_offset_cents, type: integer, source: system, description: "Waterfall bucket 3 on FORFEITED", default: 0 }
      - { name: refunded_cents, type: integer, source: system, description: "Waterfall remainder bucket 4 returned to buyer", default: 0 }
      - { name: released_cents, type: integer, source: system, description: "Amount returned on RELEASED", default: 0 }

  - name: ScaleTicket
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> HarvestContract.id; scaled under contract" }
      - { name: scaled_date, type: string, source: input, description: "Date scaled YYYY-MM-DD" }
      - { name: species, type: string, source: input, description: "Species code" }
      - { name: small_end_diameter_in, type: number, source: input, description: "Small-end diameter inches; > 0" }
      - { name: length_ft, type: number, source: input, description: "Log length feet; > 0" }
      - { name: log_count, type: integer, source: input, description: "Number of identical logs on the ticket; >= 1" }
      - { name: bf_doyle, type: integer, source: computed, description: "floor(((D-4)/4)^2 * L) * log_count" }
      - { name: bf_international, type: integer, source: computed, description: "round_half_up((0.79*D^2 - 2*D - 4) * L/16) * log_count" }
      - { name: bf_governing, type: integer, source: computed, description: "bf per contract.governing_scaling_rule" }
      - { name: status, type: enum, source: system, description: "Ticket lifecycle with dispute loop", default: DRAFT, constraints: "enum {DRAFT, VERIFIED, DISPUTED, VOID}" }
      - { name: flagged_for_review, type: boolean, source: system, description: "Set true on DRAFT tickets by stop-work cascade; cleared on verify", default: false }
      - { name: recorded_by_id, type: string, source: system, description: "X-User-ID of creator" }
      - { name: verified_by_id, type: string, source: system, description: "X-User-ID of verifying forester; null until verified", default: null }
      - { name: verified_at, type: datetime, source: system, description: "Verification timestamp; null until verified", default: null }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> HarvestContract.id; settled contract" }
      - { name: kind, type: enum, source: input, description: "PER_UNIT_PERIOD or LUMP_MILESTONE; must match contract sale_type", constraints: "enum {PER_UNIT_PERIOD, LUMP_MILESTONE}" }
      - { name: period_start, type: string, source: input, description: "Required iff PER_UNIT_PERIOD: period start date; half-open [start, end)", default: null }
      - { name: period_end, type: string, source: input, description: "Required iff PER_UNIT_PERIOD: period end date; > period_start", default: null }
      - { name: milestone, type: enum, source: input, description: "Required iff LUMP_MILESTONE", default: null, constraints: "enum {MOBILIZATION, MIDPOINT, COMPLETION}" }
      - { name: ticket_ids, type: array, source: system, description: "VERIFIED tickets swept into a PER_UNIT_PERIOD settlement", default: [] }
      - { name: gross_cents, type: integer, source: computed, description: "calc settlement_amounts" }
      - { name: holdback_cents, type: integer, source: computed, description: "PER_UNIT_PERIOD: round_half_up(gross * HOLDBACK_PCT/100); LUMP_MILESTONE: 0" }
      - { name: fee_cents, type: integer, source: computed, description: "calc consulting_fee (tier keyed on cumulative billed INCLUDING this gross)" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - holdback_cents - fee_cents" }
      - { name: status, type: enum, source: system, description: "Settlement lifecycle", default: DRAFT, constraints: "enum {DRAFT, APPROVED, PAID, REFUNDED, VOID}" }
      - { name: due_date, type: string, source: computed, description: "approved date + PAYMENT_TERMS_DAYS; null until approved", default: null }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "calc late_payment_interest, evaluated on read when APPROVED and clock past due_date", default: 0 }

  - name: BMPInspection
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> HarvestContract.id; inspected contract" }
      - { name: inspection_type, type: enum, source: input, description: "Inspection type", constraints: "enum {PRE_HARVEST, ACTIVE_HARVEST, CLOSEOUT}" }
      - { name: scheduled_date, type: string, source: input, description: "Scheduled date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "Inspection lifecycle", default: SCHEDULED, constraints: "enum {SCHEDULED, CONDUCTED, COMPLIANT, NONCOMPLIANT, CORRECTIVE_VERIFIED}" }
      - { name: severity, type: enum, source: input, description: "Required iff close outcome NONCOMPLIANT", default: null, constraints: "enum {MINOR, MAJOR}" }
      - { name: remediation_cost_estimate_cents, type: integer, source: input, description: "Optional remediation estimate recorded at close", default: 0 }
      - { name: findings, type: string, source: input, description: "Free-text findings", default: "" }

  - name: ReforestationObligation
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> HarvestContract.id; created at HARVEST_COMPLETE (1:1)" }
      - { name: status, type: enum, source: system, description: "Obligation lifecycle with replant loop", default: IMPOSED, constraints: "enum {IMPOSED, PLANTED, SURVEYED, SATISFIED, REPLANT_REQUIRED, DELINQUENT}" }
      - { name: plant_by_date, type: string, source: computed, description: "harvest_completed date + PLANTING_WINDOW_DAYS; reset to latest survey_date + PLANTING_WINDOW_DAYS on REPLANT_REQUIRED" }
      - { name: current_planted_count, type: integer, source: system, description: "Seedlings from the MOST RECENT planting record", default: 0 }
      - { name: planted_date, type: string, source: system, description: "Date of most recent planting; null until planted", default: null }

  - name: SurvivalSurvey
    parent: null
    common_fields: true
    fields:
      - { name: obligation_id, type: string, source: system, description: "FK -> ReforestationObligation.id; surveyed obligation" }
      - { name: survey_date, type: string, source: input, description: "Survey date YYYY-MM-DD; must be >= planted_date + SURVEY_MIN_DAYS_AFTER_PLANTING" }
      - { name: live_seedlings_count, type: integer, source: input, description: "Live seedlings counted; >= 0" }
      - { name: survival_pct, type: number, source: computed, description: "round_half_up(live / current_planted_count * 100, 2) at finalize; null until finalized", default: null }
      - { name: result, type: enum, source: computed, description: "PASS iff survival_pct >= REQUIRED_SURVIVAL_PCT (>= comparison; exact 85.00 passes)", default: null, constraints: "enum {PASS, FAIL}" }
      - { name: status, type: enum, source: system, description: "Survey lifecycle", default: RECORDED, constraints: "enum {RECORDED, FINALIZED, VOID}" }

  - name: CarbonValuation
    parent: null
    common_fields: true
    fields:
      - { name: tract_id, type: string, source: input, description: "FK -> ForestTract.id; valued tract" }
      - { name: annual_credits_tco2e, type: number, source: input, description: "Annual carbon credits; > 0" }
      - { name: baseline_credits_tco2e, type: number, source: input, description: "Business-as-usual baseline credits; >= 0 and < annual_credits_tco2e" }
      - { name: price_cents_per_tco2e, type: integer, source: input, description: "Credit price cents; > 0" }
      - { name: estimated_timber_net_cents, type: integer, source: input, description: "Forester-estimated net timber proceeds for comparison; >= 0" }
      - { name: enrollment_start, type: string, source: input, description: "Proposed enrollment start date YYYY-MM-DD" }
      - { name: enrollment_end, type: string, source: computed, description: "enrollment_start + CREDIT_YEARS years" }
      - { name: gross_npv_cents, type: integer, source: computed, description: "calc carbon_valuation_npv, GROSS variant" }
      - { name: net_npv_cents, type: integer, source: computed, description: "calc carbon_valuation_npv, NET variant (annual minus baseline)" }
      - { name: recommendation, type: enum, source: computed, description: "CONSERVATION_FAVORED iff net_npv_cents >= round_half_up(estimated_timber_net_cents * CONSERVATION_PREMIUM), else TIMBER_FAVORED", constraints: "enum {CONSERVATION_FAVORED, TIMBER_FAVORED}" }
      - { name: status, type: enum, source: system, description: "Valuation lifecycle; a new valuation supersedes a prior VALUED one", default: VALUED, constraints: "enum {VALUED, ACCEPTED, REJECTED, SUPERSEDED}" }

state_machines:
  - entity: InventoryCruise
    initial_state: DRAFT
    terminal_states: [CERTIFIED, SUPERSEDED, VOID]
    transitions:
      - from: DRAFT
        to: TALLIED
        trigger: "POST /forestry/cruises/{id}/finalize-tally"
        actor: Forester
        preconditions: ["cruise.status == DRAFT", "n_plots >= 1"]
        side_effects: ["increments InventoryCruise.version by 1"]
      - from: TALLIED
        to: RECONCILED
        trigger: "POST /forestry/cruises/{id}/reconcile"
        actor: Forester
        preconditions: ["cruise.status == TALLIED", "reconciled_plot_numbers non-empty and every element exists in plots"]
        side_effects: ["recompute provisional_volume_bf, certified_volume_bf, certified_volume_by_species, sampling_error_pct (calc cruise_volume_estimate)", "increments InventoryCruise.version by 1"]
      - from: RECONCILED
        to: TALLIED
        trigger: "POST /forestry/cruises/{id}/reopen"
        actor: Forester
        preconditions: ["cruise.status == RECONCILED"]
        side_effects: ["clear reconciled_plot_numbers, certified_volume_bf, certified_volume_by_species, sampling_error_pct to null", "increments InventoryCruise.version by 1"]
        note: "Revision loop: failed or audited reconciliations return to TALLIED."
      - from: RECONCILED
        to: CERTIFIED
        trigger: "POST /forestry/cruises/{id}/certify"
        actor: Forester
        preconditions: ["cruise.status == RECONCILED", "len(reconciled_plot_numbers) >= MIN_RECONCILED_PLOTS", "sampling_error_pct <= MAX_SAMPLING_ERROR_PCT", "expected_stand_version == stand.version (OCC)"]
        side_effects: ["certified_at := clock", "prior CERTIFIED cruise on same stand -> SUPERSEDED", "stand.certified_cruise_id := this cruise", "increments InventoryCruise.version by 1", "increments Stand.version by 1"]
      - from: DRAFT
        to: VOID
        trigger: "POST /forestry/cruises/{id}/void"
        actor: Forester
        preconditions: ["cruise.status in {DRAFT, TALLIED}"]
        side_effects: ["increments InventoryCruise.version by 1"]
      - from: TALLIED
        to: VOID
        trigger: "POST /forestry/cruises/{id}/void"
        actor: Forester
        preconditions: ["cruise.status in {DRAFT, TALLIED}"]
        side_effects: ["increments InventoryCruise.version by 1"]

  - entity: HarvestPrescription
    initial_state: DRAFT
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /forestry/prescriptions/{id}/propose"
        actor: Forester
        preconditions: ["prescription.status == DRAFT"]
        side_effects: ["increments HarvestPrescription.version by 1"]
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /forestry/prescriptions/{id}/approve"
        actor: Landowner
        preconditions: ["prescription.status == PROPOSED", "acting landowner owns prescription stand's tract (stand.tract_id -> tract.landowner_id == X-User-ID)", "prescription.cruise_id cruise status == CERTIFIED"]
        side_effects: ["increments HarvestPrescription.version by 1"]
      - from: APPROVED
        to: PROPOSED
        trigger: "POST /forestry/prescriptions/{id}/revise"
        actor: Forester
        preconditions: ["prescription.status == APPROVED"]
        side_effects: ["apply window_start/window_end/silvicultural_method updates if supplied", "increments HarvestPrescription.version by 1"]
        note: "Revision loop: APPROVED -> PROPOSED -> APPROVED cycles are unbounded."
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /forestry/prescriptions/{id}/activate"
        actor: Forester
        preconditions: ["prescription.status == APPROVED", "no other ACTIVE prescription on same stand whose [window_start, window_end) overlaps this one (half-open; touching endpoints do NOT overlap)"]
        side_effects: ["increments HarvestPrescription.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /forestry/prescriptions/{id}/complete"
        actor: Forester
        preconditions: ["prescription.status == ACTIVE"]
        side_effects: ["increments HarvestPrescription.version by 1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /forestry/prescriptions/{id}/withdraw"
        actor: Forester
        preconditions: ["prescription.status in {DRAFT, PROPOSED, APPROVED}"]
        side_effects: ["increments HarvestPrescription.version by 1"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /forestry/prescriptions/{id}/withdraw"
        actor: Forester
        preconditions: ["prescription.status in {DRAFT, PROPOSED, APPROVED}"]
        side_effects: ["increments HarvestPrescription.version by 1"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /forestry/prescriptions/{id}/withdraw"
        actor: Forester
        preconditions: ["prescription.status in {DRAFT, PROPOSED, APPROVED}"]
        side_effects: ["increments HarvestPrescription.version by 1"]

  - entity: TimberSale
    initial_state: DRAFT
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /forestry/sales/{id}/offer"
        actor: Forester
        preconditions: ["sale.status == DRAFT", "prescription.status == APPROVED", "prescription.cruise status == CERTIFIED", "cruise certified_at within CRUISE_MAX_AGE_MONTHS of clock", "no conservation enrollment window on sale.tract_id overlapping [harvest_window_start, harvest_window_end] (closed-interval day semantics: harvest_start <= enrollment_end AND enrollment_start <= harvest_end)"]
        side_effects: ["increments TimberSale.version by 1"]
      - from: OFFERED
        to: BIDDING_OPEN
        trigger: "POST /forestry/sales/{id}/open-bidding"
        actor: Forester
        preconditions: ["sale.status == OFFERED"]
        side_effects: ["increments TimberSale.version by 1"]
      - from: BIDDING_OPEN
        to: BIDDING_CLOSED
        trigger: "POST /forestry/sales/{id}/close-bidding"
        actor: Forester
        preconditions: ["sale.status == BIDDING_OPEN", "clock >= bid_close_at"]
        side_effects: ["evaluate bids (calc bid_evaluation): SUBMITTED bids with bid_total_cents < advertised_minimum_cents -> DISQUALIFIED; winning_bid_id := highest bid_total_cents among remaining SUBMITTED, tie-break deposit_cents DESC then submitted_at ASC then buyer.created_at ASC; null if none qualify", "increments TimberSale.version by 1", "increments evaluated Bid.version by 1 each"]
      - from: BIDDING_CLOSED
        to: AWARDED
        trigger: "POST /forestry/sales/{id}/award"
        actor: Forester
        preconditions: ["sale.status == BIDDING_CLOSED", "winning_bid_id not null", "payload bid_id == winning_bid_id"]
        side_effects: ["awarded_value_cents := winning bid_total_cents", "winning bid -> WINNING; all other SUBMITTED bids -> LOST", "create HarvestContract (status PENDING_BOND, buyer_id := winning buyer, awarded_value_cents, governing_scaling_rule, required_bond_amount_cents via calc performance_bond_amount)", "increments TimberSale.version by 1"]
      - from: BIDDING_CLOSED
        to: NO_SALE
        trigger: "POST /forestry/sales/{id}/no-sale"
        actor: Forester
        preconditions: ["sale.status == BIDDING_CLOSED", "winning_bid_id is null"]
        side_effects: ["all SUBMITTED bids -> LOST", "increments TimberSale.version by 1"]
      - from: NO_SALE
        to: OFFERED
        trigger: "POST /forestry/sales/{id}/reoffer"
        actor: Forester
        preconditions: ["sale.status == NO_SALE", "new bid_close_at > new bid_open_at", "closed-interval enrollment overlap re-checked"]
        side_effects: ["bid_open_at/bid_close_at/advertised_minimum_cents updated from payload", "increments TimberSale.version by 1"]
        note: "Reoffer loop: NO_SALE -> OFFERED is cyclic."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /forestry/sales/{id}/cancel or carbon-accept cascade"
        actor: Forester | Landowner | system
        preconditions: ["sale.status in {DRAFT, OFFERED, BIDDING_OPEN, BIDDING_CLOSED, NO_SALE}"]
        side_effects: ["SUBMITTED bids on this sale -> WITHDRAWN", "increments TimberSale.version by 1"]
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /forestry/sales/{id}/cancel or carbon-accept cascade"
        actor: Forester | Landowner | system
        preconditions: ["sale.status in {DRAFT, OFFERED, BIDDING_OPEN, BIDDING_CLOSED, NO_SALE}"]
        side_effects: ["SUBMITTED bids on this sale -> WITHDRAWN", "increments TimberSale.version by 1"]
      - from: BIDDING_OPEN
        to: CANCELLED
        trigger: "POST /forestry/sales/{id}/cancel or carbon-accept cascade"
        actor: Forester | Landowner | system
        preconditions: ["sale.status in {DRAFT, OFFERED, BIDDING_OPEN, BIDDING_CLOSED, NO_SALE}"]
        side_effects: ["SUBMITTED bids on this sale -> WITHDRAWN", "increments TimberSale.version by 1"]
      - from: BIDDING_CLOSED
        to: CANCELLED
        trigger: "POST /forestry/sales/{id}/cancel or carbon-accept cascade"
        actor: Forester | Landowner | system
        preconditions: ["sale.status in {DRAFT, OFFERED, BIDDING_OPEN, BIDDING_CLOSED, NO_SALE}"]
        side_effects: ["SUBMITTED bids on this sale -> WITHDRAWN", "increments TimberSale.version by 1"]
      - from: NO_SALE
        to: CANCELLED
        trigger: "POST /forestry/sales/{id}/cancel or carbon-accept cascade"
        actor: Forester | Landowner | system
        preconditions: ["sale.status in {DRAFT, OFFERED, BIDDING_OPEN, BIDDING_CLOSED, NO_SALE}"]
        side_effects: ["increments TimberSale.version by 1"]

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN, DISQUALIFIED, WINNING, LOST, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /forestry/bids/{id}/withdraw"
        actor: Buyer
        preconditions: ["bid.status == SUBMITTED", "bid.buyer_id == X-User-ID", "sale.status == BIDDING_OPEN", "clock < sale.bid_close_at"]
        side_effects: ["increments Bid.version by 1"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /forestry/sales/{sale_id}/bids by the same buyer (system supersede)"
        actor: system
        preconditions: ["same buyer already has a SUBMITTED bid on this sale"]
        side_effects: ["prior SUBMITTED bid -> SUPERSEDED; new bid becomes the sole SUBMITTED bid", "increments both Bid.version values by 1"]
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "POST /forestry/sales/{id}/close-bidding (system evaluation)"
        actor: system
        preconditions: ["bid_total_cents < sale.advertised_minimum_cents"]
        side_effects: ["increments Bid.version by 1"]
      - from: SUBMITTED
        to: WINNING
        trigger: "POST /forestry/sales/{id}/award (system)"
        actor: system
        preconditions: ["bid.id == sale.winning_bid_id"]
        side_effects: ["increments Bid.version by 1"]
      - from: SUBMITTED
        to: LOST
        trigger: "POST /forestry/sales/{id}/award or no-sale (system)"
        actor: system
        preconditions: ["bid.id != sale.winning_bid_id"]
        side_effects: ["increments Bid.version by 1"]

  - entity: HarvestContract
    initial_state: PENDING_BOND
    terminal_states: [TERMINATED, CLOSED]
    transitions:
      - from: PENDING_BOND
        to: ACTIVE
        trigger: "POST /forestry/contracts/{id}/bond"
        actor: Buyer
        preconditions: ["contract.status == PENDING_BOND", "contract.buyer_id == X-User-ID", "amount_cents == required_bond_amount_cents"]
        side_effects: ["create PerformanceBond (POSTED, amount_cents, reforestation_hold_cents := min(amount, stand.acres * REFORESTATION_HOLD_PER_ACRE_CENTS))", "increments HarvestContract.version by 1"]
      - from: PENDING_BOND
        to: PENDING_BOND
        trigger: "POST /forestry/contracts/{id}/assign-contractor"
        actor: Buyer
        preconditions: ["contract.status in {PENDING_BOND, ACTIVE}", "contract.buyer_id == X-User-ID", "contractor exists"]
        side_effects: ["contractor_id := payload contractor_id", "increments HarvestContract.version by 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /forestry/contracts/{id}/assign-contractor"
        actor: Buyer
        preconditions: ["contract.status in {PENDING_BOND, ACTIVE}", "contract.buyer_id == X-User-ID", "contractor exists"]
        side_effects: ["contractor_id := payload contractor_id", "increments HarvestContract.version by 1"]
      - from: ACTIVE
        to: HARVESTING
        trigger: "POST /forestry/contracts/{id}/start-harvest"
        actor: Contractor
        preconditions: ["contract.status == ACTIVE", "contract.contractor_id == X-User-ID", "open_major_findings_count == 0", "clock date within [sale.harvest_window_start, sale.harvest_window_end)", "clock date within [prescription.window_start, prescription.window_end)", "prescription.status in {APPROVED, ACTIVE}"]
        side_effects: ["increments HarvestContract.version by 1"]
      - from: HARVESTING
        to: SUSPENDED
        trigger: "POST /forestry/contracts/{id}/suspend or inspection stop-work cascade"
        actor: Forester | system
        preconditions: ["contract.status == HARVESTING"]
        side_effects: ["cascade link 2: every ScaleTicket of this contract in {DRAFT, VERIFIED} gets flagged_for_review := true", "cascade link 3: every Settlement of this contract in DRAFT whose ticket_ids intersect the newly flagged tickets -> VOID (with billed/holdback/fee reversal)", "increments HarvestContract.version by 1"]
      - from: SUSPENDED
        to: HARVESTING
        trigger: "POST /forestry/contracts/{id}/resume"
        actor: Forester
        preconditions: ["contract.status == SUSPENDED", "open_major_findings_count == 0"]
        side_effects: ["increments HarvestContract.version by 1"]
      - from: HARVESTING
        to: HARVEST_COMPLETE
        trigger: "POST /forestry/contracts/{id}/complete-harvest"
        actor: Contractor
        preconditions: ["contract.status == HARVESTING", "contract.contractor_id == X-User-ID", "open_major_findings_count == 0"]
        side_effects: ["harvest_completed_at := clock", "create ReforestationObligation (IMPOSED, plant_by_date := clock date + PLANTING_WINDOW_DAYS)", "increments HarvestContract.version by 1"]
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /forestry/contracts/{id}/declare-default"
        actor: Forester
        preconditions: ["contract.status in {ACTIVE, HARVESTING, SUSPENDED}"]
        side_effects: ["defaulted_at := clock", "bond POSTED -> FORFEIT_CLAIMED (auto-claim)", "increments HarvestContract.version by 1"]
      - from: HARVESTING
        to: DEFAULTED
        trigger: "POST /forestry/contracts/{id}/declare-default"
        actor: Forester
        preconditions: ["contract.status in {ACTIVE, HARVESTING, SUSPENDED}"]
        side_effects: ["defaulted_at := clock", "bond POSTED -> FORFEIT_CLAIMED (auto-claim)", "increments HarvestContract.version by 1"]
      - from: SUSPENDED
        to: DEFAULTED
        trigger: "POST /forestry/contracts/{id}/declare-default"
        actor: Forester
        preconditions: ["contract.status in {ACTIVE, HARVESTING, SUSPENDED}"]
        side_effects: ["defaulted_at := clock", "bond POSTED -> FORFEIT_CLAIMED (auto-claim)", "increments HarvestContract.version by 1"]
      - from: DEFAULTED
        to: HARVESTING
        trigger: "POST /forestry/contracts/{id}/cure"
        actor: Buyer
        preconditions: ["contract.status == DEFAULTED", "contract.buyer_id == X-User-ID", "clock <= defaulted_at + CURE_PERIOD_DAYS", "bond.status == FORFEIT_CLAIMED"]
        side_effects: ["bond FORFEIT_CLAIMED -> POSTED (claim auto-denied)", "increments HarvestContract.version by 1", "increments PerformanceBond.version by 1"]
        note: "Default/cure loop."
      - from: DEFAULTED
        to: TERMINATED
        trigger: "POST /forestry/contracts/{id}/terminate"
        actor: Forester
        preconditions: ["contract.status == DEFAULTED", "bond.status == FORFEITED"]
        side_effects: ["buyer.prior_defaults += 1", "increments HarvestContract.version by 1"]
      - from: HARVEST_COMPLETE
        to: CLOSED
        trigger: "POST /forestry/contracts/{id}/close"
        actor: Forester
        preconditions: ["contract.status == HARVEST_COMPLETE", "all settlements in {PAID, REFUNDED, VOID}", "bond.status == RELEASED", "reforestation obligation status == SATISFIED"]
        side_effects: ["increments HarvestContract.version by 1"]

  - entity: PerformanceBond
    initial_state: POSTED
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: POSTED
        to: FORFEIT_CLAIMED
        trigger: "POST /forestry/bonds/{id}/claim-forfeiture or declare-default auto-claim or declare-delinquent auto-claim"
        actor: Forester | system
        preconditions: ["bond.status == POSTED"]
        side_effects: ["increments PerformanceBond.version by 1"]
      - from: FORFEIT_CLAIMED
        to: POSTED
        trigger: "POST /forestry/bonds/{id}/adjudicate decision DENIED, or contract cure"
        actor: PlatformAdmin | system
        preconditions: ["bond.status == FORFEIT_CLAIMED"]
        side_effects: ["increments PerformanceBond.version by 1"]
        note: "Claim loop: claim denied returns bond to POSTED."
      - from: FORFEIT_CLAIMED
        to: FORFEITED
        trigger: "POST /forestry/bonds/{id}/adjudicate decision UPHELD"
        actor: PlatformAdmin
        preconditions: ["bond.status == FORFEIT_CLAIMED"]
        side_effects: ["run calc forfeiture_waterfall: admin_fee_cents, remediation_offset_cents, shortfall_offset_cents, refunded_cents; buckets sum == amount_cents", "increments PerformanceBond.version by 1"]
      - from: POSTED
        to: RELEASED
        trigger: "POST /forestry/bonds/{id}/release"
        actor: Forester
        preconditions: ["bond.status == POSTED", "contract.status in {HARVEST_COMPLETE, CLOSED}", "reforestation obligation status == SATISFIED"]
        side_effects: ["released_cents := amount_cents", "increments PerformanceBond.version by 1"]

  - entity: ScaleTicket
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /forestry/scale-tickets/{id}/verify"
        actor: Forester
        preconditions: ["ticket.status == DRAFT", "contract.status == HARVESTING", "verified_by X-User-ID != ticket.recorded_by_id (segregation of duties)"]
        side_effects: ["verified_at := clock; verified_by_id := X-User-ID; flagged_for_review := false", "recompute contract.cumulative_verified_bf and verified_volume_by_species", "increments ScaleTicket.version by 1", "increments HarvestContract.version by 1"]
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /forestry/scale-tickets/{id}/dispute"
        actor: Landowner | Buyer
        preconditions: ["ticket.status == VERIFIED", "clock <= verified_at + DISPUTE_WINDOW_DAYS", "Landowner actor must own tract; Buyer actor must be contract buyer"]
        side_effects: ["recompute contract.cumulative_verified_bf and verified_volume_by_species (DISPUTED excluded)", "increments ScaleTicket.version by 1"]
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /forestry/scale-tickets/{id}/resolve resolution ACCEPT"
        actor: Forester
        preconditions: ["ticket.status == DISPUTED"]
        side_effects: ["recompute contract.cumulative_verified_bf and verified_volume_by_species (ticket re-included)", "increments ScaleTicket.version by 1"]
        note: "Dispute loop VERIFIED -> DISPUTED -> VERIFIED."
      - from: DISPUTED
        to: VOID
        trigger: "POST /forestry/scale-tickets/{id}/resolve resolution VOID"
        actor: Forester
        preconditions: ["ticket.status == DISPUTED"]
        side_effects: ["increments ScaleTicket.version by 1"]
      - from: DRAFT
        to: VOID
        trigger: "POST /forestry/scale-tickets/{id}/void"
        actor: Forester
        preconditions: ["ticket.status == DRAFT"]
        side_effects: ["increments ScaleTicket.version by 1"]

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID, REFUNDED, VOID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /forestry/settlements/{id}/approve"
        actor: Landowner
        preconditions: ["settlement.status == DRAFT", "acting landowner owns contract tract"]
        side_effects: ["due_date := clock date + PAYMENT_TERMS_DAYS", "increments Settlement.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /forestry/settlements/{id}/disburse"
        actor: Forester
        preconditions: ["settlement.status == APPROVED"]
        side_effects: ["contract.disbursed_total_cents += net_cents", "increments Settlement.version by 1", "increments HarvestContract.version by 1"]
      - from: PAID
        to: REFUNDED
        trigger: "POST /forestry/settlements/{id}/refund"
        actor: Forester
        preconditions: ["settlement.status == PAID"]
        side_effects: ["contract.disbursed_total_cents -= net_cents", "contract.refunded_total_cents += net_cents", "increments Settlement.version by 1", "increments HarvestContract.version by 1"]
        note: "Compensating action: conserves disbursed_total + refunded_total."
      - from: DRAFT
        to: VOID
        trigger: "POST /forestry/settlements/{id}/void or stop-work cascade"
        actor: Forester | system
        preconditions: ["settlement.status == DRAFT"]
        side_effects: ["contract.billed_total_cents -= gross_cents", "contract.holdback_balance_cents -= holdback_cents", "contract.consulting_fee_total_cents -= fee_cents", "increments Settlement.version by 1", "increments HarvestContract.version by 1"]

  - entity: BMPInspection
    initial_state: SCHEDULED
    terminal_states: [COMPLIANT, CORRECTIVE_VERIFIED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /forestry/inspections/{id}/conduct"
        actor: AgencyInspector
        preconditions: ["inspection.status == SCHEDULED"]
        side_effects: ["increments BMPInspection.version by 1"]
      - from: CONDUCTED
        to: COMPLIANT
        trigger: "POST /forestry/inspections/{id}/close outcome COMPLIANT"
        actor: AgencyInspector
        preconditions: ["inspection.status == CONDUCTED"]
        side_effects: ["increments BMPInspection.version by 1"]
      - from: CONDUCTED
        to: NONCOMPLIANT
        trigger: "POST /forestry/inspections/{id}/close outcome NONCOMPLIANT"
        actor: AgencyInspector
        preconditions: ["inspection.status == CONDUCTED", "severity present"]
        side_effects: ["if severity == MAJOR and contract.status == HARVESTING: cascade link 1 contract -> SUSPENDED (which itself flags DRAFT and VERIFIED tickets and voids affected DRAFT settlements)", "recompute contract.open_major_findings_count", "increments BMPInspection.version by 1"]
      - from: NONCOMPLIANT
        to: CORRECTIVE_VERIFIED
        trigger: "POST /forestry/inspections/{id}/verify-corrective"
        actor: AgencyInspector
        preconditions: ["inspection.status == NONCOMPLIANT"]
        side_effects: ["recompute contract.open_major_findings_count", "increments BMPInspection.version by 1"]
        note: "Contract stays SUSPENDED until POST /contracts/{id}/resume."

  - entity: ReforestationObligation
    initial_state: IMPOSED
    terminal_states: [SATISFIED]
    transitions:
      - from: IMPOSED
        to: PLANTED
        trigger: "POST /forestry/obligations/{id}/record-planting"
        actor: Contractor
        preconditions: ["obligation.status in {IMPOSED, REPLANT_REQUIRED}", "clock date <= plant_by_date", "contract.contractor_id == X-User-ID"]
        side_effects: ["current_planted_count := seedlings_planted; planted_date := payload planted_date", "increments ReforestationObligation.version by 1"]
      - from: REPLANT_REQUIRED
        to: PLANTED
        trigger: "POST /forestry/obligations/{id}/record-planting"
        actor: Contractor
        preconditions: ["obligation.status in {IMPOSED, REPLANT_REQUIRED}", "clock date <= plant_by_date", "contract.contractor_id == X-User-ID"]
        side_effects: ["current_planted_count := seedlings_planted; planted_date := payload planted_date", "increments ReforestationObligation.version by 1"]
        note: "Replant loop REPLANT_REQUIRED -> PLANTED."
      - from: PLANTED
        to: SURVEYED
        trigger: "POST /forestry/obligations/{id}/surveys (creates survey RECORDED)"
        actor: Forester
        preconditions: ["obligation.status == PLANTED", "survey_date >= planted_date + SURVEY_MIN_DAYS_AFTER_PLANTING"]
        side_effects: ["create SurvivalSurvey RECORDED", "increments ReforestationObligation.version by 1"]
      - from: SURVEYED
        to: SATISFIED
        trigger: "POST /forestry/surveys/{id}/finalize with result PASS (system)"
        actor: system
        preconditions: ["survival_pct >= REQUIRED_SURVIVAL_PCT"]
        side_effects: ["increments ReforestationObligation.version by 1"]
      - from: SURVEYED
        to: REPLANT_REQUIRED
        trigger: "POST /forestry/surveys/{id}/finalize with result FAIL (system)"
        actor: system
        preconditions: ["survival_pct < REQUIRED_SURVIVAL_PCT"]
        side_effects: ["plant_by_date := survey_date + PLANTING_WINDOW_DAYS", "cascade link 2: bond.reforestation_hold_cents := min(bond.amount_cents, stand.acres * REPLANT_HOLD_PER_ACRE_CENTS)", "increments ReforestationObligation.version by 1", "increments PerformanceBond.version by 1"]
      - from: IMPOSED
        to: DELINQUENT
        trigger: "POST /forestry/obligations/{id}/declare-delinquent"
        actor: Forester
        preconditions: ["obligation.status == IMPOSED", "clock date > plant_by_date"]
        side_effects: ["bond POSTED -> FORFEIT_CLAIMED (auto-claim) if bond POSTED", "increments ReforestationObligation.version by 1"]

  - entity: SurvivalSurvey
    initial_state: RECORDED
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: RECORDED
        to: FINALIZED
        trigger: "POST /forestry/surveys/{id}/finalize"
        actor: Forester
        preconditions: ["survey.status == RECORDED", "obligation.status == SURVEYED", "current_planted_count > 0"]
        side_effects: ["compute survival_pct and result (calc survival_rate_assessment)", "obligation SURVEYED -> SATISFIED (PASS) or REPLANT_REQUIRED (FAIL, cascades to bond hold)", "increments SurvivalSurvey.version by 1"]
      - from: RECORDED
        to: VOID
        trigger: "POST /forestry/surveys/{id}/void"
        actor: Forester
        preconditions: ["survey.status == RECORDED"]
        side_effects: ["obligation SURVEYED -> PLANTED", "increments SurvivalSurvey.version by 1"]

  - entity: ForestTract
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ENROLLED_CONSERVATION
        trigger: "POST /forestry/carbon-valuations/{id}/accept (system)"
        actor: system
        preconditions: ["tract.status == OPEN"]
        side_effects: ["conservation_enrollment_start := valuation.enrollment_start; conservation_enrollment_end := valuation.enrollment_end", "every sale of this tract in {DRAFT, OFFERED, BIDDING_OPEN, BIDDING_CLOSED, NO_SALE} -> CANCELLED (SUBMITTED bids -> WITHDRAWN)", "increments ForestTract.version by 1"]

  - entity: CarbonValuation
    initial_state: VALUED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: VALUED
        to: ACCEPTED
        trigger: "POST /forestry/carbon-valuations/{id}/accept"
        actor: Landowner
        preconditions: ["valuation.status == VALUED", "acting landowner owns tract", "no contract on any sale of this tract in {PENDING_BOND, ACTIVE, HARVESTING, SUSPENDED, HARVEST_COMPLETE, DEFAULTED}"]
        side_effects: ["tract OPEN -> ENROLLED_CONSERVATION (see ForestTract machine)", "increments CarbonValuation.version by 1"]
      - from: VALUED
        to: REJECTED
        trigger: "POST /forestry/carbon-valuations/{id}/reject"
        actor: Landowner
        preconditions: ["valuation.status == VALUED", "acting landowner owns tract"]
        side_effects: ["increments CarbonValuation.version by 1"]
      - from: VALUED
        to: SUPERSEDED
        trigger: "POST /forestry/carbon-valuations on same tract (system supersede)"
        actor: system
        preconditions: ["a VALUED valuation exists on the tract"]
        side_effects: ["prior VALUED valuation -> SUPERSEDED", "increments both CarbonValuation.version values by 1"]

concurrency_rules:
  - rule_id: cruise-certify-stale-stand
    parent_entity: Stand
    write_endpoint: "POST /forestry/cruises/{id}/certify"
    occ_field: expected_stand_version
    description: |
      Certifying a cruise supersedes whichever cruise the stand currently
      certifies; a client certifying against a stand version it read before
      another certification advanced the stand has a stale view and is
      rejected. Rule stated in OCC terms: expected_stand_version must equal
      the stand's current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bid-create-stale-sale
    parent_entity: TimberSale
    write_endpoint: "POST /forestry/sales/{sale_id}/bids"
    occ_field: expected_sale_version
    description: |
      A buyer's new bid legitimately supersedes that buyer's prior SUBMITTED
      bid; a client submitting against a sale version advanced by another
      accepted bid (which bumps sale.version) has a stale view of the bid
      book and is rejected. Rule stated in OCC terms: expected_sale_version
      must equal the sale's current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: valuation-create-stale-tract
    parent_entity: ForestTract
    write_endpoint: "POST /forestry/carbon-valuations"
    occ_field: expected_tract_version
    description: |
      Creating a carbon valuation supersedes the tract's VALUED valuation; a
      client valuing against a tract version advanced by another accepted
      valuation has a stale view and is rejected. Rule stated in OCC terms:
      expected_tract_version must equal the tract's current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: cruise_volume_estimate
    trigger: "on POST /cruises/{id}/reconcile"
    algorithm: aggregation
    formula: |
      plot_total(p) = sum of volume_bf over rows with that plot_number
      expansion_factor = stand.acres / (PLOT_SIZE_ACRES * n_plots)
      PROVISIONAL: provisional_volume_bf = round_half_up(sum(plot_total over ALL plots) * expansion_factor)
      CERTIFIED: let R = reconciled_plot_numbers; base = sum(plot_total over R) * expansion_factor
      sampling_error_pct = round_half_up( population_stddev(plot_total over R) / mean(plot_total over R) / sqrt(len(R)) * 100 , 2)
      certified_volume_bf = round_half_up(base * (1 - sampling_error_pct/100))
      certified_volume_by_species[s] = round_half_up( (sum over R rows of species s) * expansion_factor * (1 - sampling_error_pct/100) )
    input_set: "plots rows of THIS cruise; PROVISIONAL uses all rows regardless of reconciliation, CERTIFIED uses only rows whose plot_number is in reconciled_plot_numbers"
    constants:
      PLOT_SIZE_ACRES: 0.2
      MIN_RECONCILED_PLOTS: 5
      MAX_SAMPLING_ERROR_PCT: 10.00
      CRUISE_MAX_AGE_MONTHS: 24
    precision: "volume_bf integer round_half_up; sampling_error_pct 2 decimal places round_half_up and APPLIED as the rounded value"
    variants:
      - name: PROVISIONAL
        when: "always computed at reconcile; the advertised rough estimate"
        difference: "includes ALL tallied plots and applies NO sampling-error deduction"
      - name: CERTIFIED
        when: "computed at reconcile; basis for sale volumes and bid evaluation"
        difference: "reconciled plots only, multiplied by (1 - sampling_error_pct/100); identical tallies therefore yield a strictly smaller certified volume whenever sampling_error_pct > 0"

  - name: log_scale_board_feet
    trigger: "on POST /scale-tickets (computed at creation, immutable thereafter)"
    algorithm: aggregation
    formula: |
      D = small_end_diameter_in, L = length_ft
      bf_doyle = floor(((D - 4) / 4)^2 * L) * log_count          # per-log floor THEN multiply
      bf_international = round_half_up((0.79*D^2 - 2*D - 4) * L / 16) * log_count   # per-log round THEN multiply
      bf_governing = bf_doyle if contract.governing_scaling_rule == DOYLE else bf_international
    input_set: "the single ticket being created; contract.governing_scaling_rule selects bf_governing"
    constants: {}
    precision: "per-log values rounded (floor for Doyle, round_half_up for International) BEFORE multiplying by log_count"
    variants:
      - name: DOYLE
        when: "contract.governing_scaling_rule == DOYLE"
        difference: "floor((D-4)/4)^2 * L per log; undercounts small logs relative to International"
      - name: INTERNATIONAL_14
        when: "contract.governing_scaling_rule == INTERNATIONAL_14"
        difference: "(0.79*D^2 - 2D - 4) * L/16 per log; identical log dimensions yield a different bf than Doyle"

  - name: performance_bond_amount
    trigger: "on POST /sales/{id}/award (stored on contract.required_bond_amount_cents)"
    algorithm: tiered_pricing
    formula: |
      tier_pct = 10% if awarded_value_cents <= 10_000_000
                 7% if awarded_value_cents <= 50_000_000
                 5% otherwise
      amount = round_half_up(awarded_value_cents * tier_pct * (1 + 0.25 * buyer.prior_defaults))
      required_bond_amount_cents = min(BOND_CAP_CENTS, max(BOND_FLOOR_CENTS, amount))
    input_set: "awarded_value_cents of the new contract; prior_defaults of the winning Buyer at award time"
    constants:
      BOND_FLOOR_CENTS: 500000
      BOND_CAP_CENTS: 10000000
      BOND_TIER1_MAX_CENTS: 10000000
      BOND_TIER2_MAX_CENTS: 50000000
      BOND_DEFAULT_SURCHARGE_PER_DEFAULT: 0.25
    precision: "integer cents, round_half_up before clamping"

  - name: bid_evaluation
    trigger: "on POST /sales/{id}/close-bidding and implicitly per bid creation for bid_total_cents"
    algorithm: weighted_scoring
    formula: |
      PER_UNIT bid_total_cents = sum over advertised species s of
          round_half_up(species_rates[s].rate_cents_per_mbf * certified_volume_by_species[s].volume_bf / 1000)
        (per-species round_half_up THEN sum; cruise = sale.prescription.cruise, must be CERTIFIED)
      LUMP_SUM bid_total_cents = lump_sum_amount_cents
      qualifying = SUBMITTED bids with bid_total_cents >= advertised_minimum_cents (>=: exactly equal QUALIFIES)
      winner = max by (bid_total_cents DESC, deposit_cents DESC, submitted_at ASC, buyer.created_at ASC)
    input_set: "bids of the sale with status SUBMITTED at close-bidding; excludes WITHDRAWN/SUPERSEDED"
    constants: {}
    precision: "integer cents; per-species rounding before summation"
    variants: []

  - name: settlement_amounts
    trigger: "on POST /settlements"
    algorithm: tiered_pricing
    formula: |
      PER_UNIT_PERIOD:
        eligible tickets = contract tickets with status VERIFIED, scaled_date in [period_start, period_end),
                           and id not in any non-VOID settlement's ticket_ids
        gross_cents = sum over eligible tickets of round_half_up(contract_rate_for(ticket.species) * ticket.bf_governing / 1000)
          -- RATE = winning bid species_rates[species]; ROUNDING ORDER PINNED: round each ticket line THEN sum
        holdback_cents = round_half_up(gross_cents * HOLDBACK_PCT / 100)
      LUMP_MILESTONE:
        MOBILIZATION: gross = round_half_up(awarded_value_cents * 0.40); requires contract.status == HARVESTING
        MIDPOINT:     gross = round_half_up(awarded_value_cents * 0.40); requires cumulative_verified_bf >= round_half_up(certified_total * 0.50)
        COMPLETION:   gross = awarded_value_cents - MOBILIZATION.gross - MIDPOINT.gross; requires contract.status == HARVEST_COMPLETE
        holdback_cents = 0
      fee_cents = consulting_fee(this gross); net_cents = gross_cents - holdback_cents - fee_cents
    input_set: "PER_UNIT_PERIOD: VERIFIED, in-period, unsettled tickets of the contract; LUMP_MILESTONE: awarded value and milestone sequence (each milestone usable once, in order MOBILIZATION -> MIDPOINT -> COMPLETION)"
    constants:
      HOLDBACK_PCT: 10
    precision: "integer cents; round_half_up per ticket line before summation (NOT sum-then-round)"
    variants:
      - name: PER_UNIT_PERIOD
        when: "contract sale_type == PER_UNIT"
        difference: "payment driven by actual VERIFIED scaled volume times bid rates; total depends on logs delivered"
      - name: LUMP_MILESTONE
        when: "contract sale_type == LUMP_SUM"
        difference: "payment fixed at 40/40/remainder of awarded value regardless of actual scaled volume; identical harvests yield different totals and timing under the two variants"

  - name: consulting_fee
    trigger: "inside settlement_amounts at POST /settlements"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER PINNED (circular-looking, resolved):
        1. tentative_billed = contract.billed_total_cents + this settlement's gross_cents
        2. tier selected by tentative_billed (cumulative GROSS, pre-fee):
             <= 5_000_000  -> 8.0%
             <= 20_000_000 -> 6.5%
             else          -> 5.0%
        3. fee_cents = round_half_up(this gross_cents * tier_pct)
        4. net_cents = gross_cents - holdback_cents - fee_cents
      The tier NEVER depends on net or post-fee values.
    input_set: "contract.billed_total_cents before this settlement plus this settlement's gross"
    constants:
      FEE_TIER1_MAX_CENTS: 5000000
      FEE_TIER2_MAX_CENTS: 20000000
      FEE_TIER1_PCT: 8.0
      FEE_TIER2_PCT: 6.5
      FEE_TIER3_PCT: 5.0
    precision: "integer cents round_half_up"

  - name: late_payment_interest
    trigger: "on GET /settlements/{id} and list reads, when status == APPROVED and clock date > due_date"
    algorithm: chronological
    formula: |
      days_late = clock_date - due_date (whole days; negative -> 0)
      accrued_interest_cents = floor(net_cents * LATE_INTEREST_PCT_PER_30D / 100 * floor(days_late / 30))
      (simple interest on net only; no compounding; 29 days late accrues 0)
    input_set: "the settlement itself; logical clock"
    constants:
      PAYMENT_TERMS_DAYS: 30
      LATE_INTEREST_PCT_PER_30D: 1.5
    precision: "integer cents, floor"

  - name: survival_rate_assessment
    trigger: "on POST /surveys/{id}/finalize"
    algorithm: threshold
    formula: |
      survival_pct = round_half_up(live_seedlings_count / obligation.current_planted_count * 100, 2)
      result = PASS if survival_pct >= REQUIRED_SURVIVAL_PCT else FAIL   # exactly 85.00 PASSES
    input_set: "the survey's live_seedlings_count and the obligation's current_planted_count (most recent planting)"
    constants:
      REQUIRED_SURVIVAL_PCT: 85.00
      SURVEY_MIN_DAYS_AFTER_PLANTING: 365
      PLANTING_WINDOW_DAYS: 365
    precision: "2 decimal places round_half_up before the >= comparison"

  - name: carbon_valuation_npv
    trigger: "on POST /carbon-valuations (both variants computed at creation)"
    algorithm: decay_function
    formula: |
      annuity = (1 - (1 + DISCOUNT_RATE)^(-CREDIT_YEARS)) / DISCOUNT_RATE   # full precision, no intermediate rounding
      gross_npv_cents = round_half_up(annual_credits_tco2e * price_cents_per_tco2e * annuity)
      net_npv_cents   = round_half_up((annual_credits_tco2e - baseline_credits_tco2e) * price_cents_per_tco2e * annuity)
      enrollment_end  = enrollment_start + CREDIT_YEARS years (same month-day)
      recommendation  = CONSERVATION_FAVORED if net_npv_cents >= round_half_up(estimated_timber_net_cents * CONSERVATION_PREMIUM) else TIMBER_FAVORED
    input_set: "the valuation's own input fields"
    constants:
      DISCOUNT_RATE: 0.05
      CREDIT_YEARS: 20
      CONSERVATION_PREMIUM: 1.10
    precision: "integer cents round_half_up on final NPV only"
    variants:
      - name: GROSS
        when: "reported as gross_npv_cents"
        difference: "uses full annual_credits_tco2e"
      - name: NET
        when: "reported as net_npv_cents and drives recommendation"
        difference: "deducts baseline_credits_tco2e; identical inputs yield a strictly smaller NPV whenever baseline > 0"

  - name: forfeiture_waterfall
    trigger: "on POST /bonds/{id}/adjudicate decision UPHELD"
    algorithm: waterfall_allocation
    formula: |
      remaining = bond.amount_cents
      admin_fee_cents         = min(ADMIN_FEE_CENTS, remaining);               remaining -= admin_fee_cents
      remediation_offset_cents = min(payload.remediation_cost_cents, remaining); remaining -= remediation_offset_cents
      shortfall_offset_cents  = min(payload.resale_shortfall_cents, remaining);  remaining -= shortfall_offset_cents
      refunded_cents          = remaining
      INVARIANT: admin_fee_cents + remediation_offset_cents + shortfall_offset_cents + refunded_cents == amount_cents
    input_set: "bond amount; adjudicate payload remediation_cost_cents and resale_shortfall_cents"
    constants:
      ADMIN_FEE_CENTS: 250000
    precision: "integer cents; buckets filled in fixed order; remainder always lands in refunded_cents so the conservation invariant holds exactly"

  - name: reforestation_hold_amount
    trigger: "on POST /contracts/{id}/bond (initial) and on obligation -> REPLANT_REQUIRED (recompute)"
    algorithm: threshold
    formula: |
      initial: reforestation_hold_cents = min(bond.amount_cents, stand.acres * REFORESTATION_HOLD_PER_ACRE_CENTS)
      on REPLANT_REQUIRED: reforestation_hold_cents = min(bond.amount_cents, stand.acres * REPLANT_HOLD_PER_ACRE_CENTS)
    input_set: "bond amount; stand acres of the contract's sale stand"
    constants:
      REFORESTATION_HOLD_PER_ACRE_CENTS: 35000
      REPLANT_HOLD_PER_ACRE_CENTS: 45000
    precision: "integer cents"

  - name: overrun_allowance_check
    trigger: "on POST /scale-tickets"
    algorithm: threshold
    formula: |
      allowance_bf = round_half_up(certified_volume_by_species[ticket.species].volume_bf * OVERRUN_ALLOWANCE_PCT / 100)
      cumulative_bf = sum of bf_governing over contract tickets of that species with status in {DRAFT, VERIFIED, DISPUTED} (VOID excluded)
      REJECT if cumulative_bf + new ticket bf_governing > allowance_bf   # exactly equal is ALLOWED
    input_set: "certified cruise species volumes of the contract's prescription; contract tickets not VOID"
    constants:
      OVERRUN_ALLOWANCE_PCT: 110.00
    precision: "integer bf; boundary is strict-greater rejection"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ownership: Landowner acts only on own tracts (tract.landowner_id == X-User-ID); Buyer acts only on own bids/contracts; Contractor acts only on assigned contracts", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "ownership-scoped endpoints" }
  - { priority: 4, category: existence, check: "path and body referenced resources exist, validated left-to-right (tract, stand, cruise, prescription, sale, bid, contract, bond, ticket, settlement, inspection, obligation, survey, valuation, party)", error_id: ERR_TRACT_NOT_FOUND, http_status: 404, applies_to: "all", note: "per-entity 404 ids: ERR_PARTY_NOT_FOUND, ERR_TRACT_NOT_FOUND, ERR_STAND_NOT_FOUND, ERR_CRUISE_NOT_FOUND, ERR_PRESCRIPTION_NOT_FOUND, ERR_SALE_NOT_FOUND, ERR_BID_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_BOND_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_OBLIGATION_NOT_FOUND, ERR_SURVEY_NOT_FOUND, ERR_VALUATION_NOT_FOUND" }
  - { priority: 5, category: existence, check: "request schema: required fields present, types valid, enum values in declared sets, dates well-formed, amounts non-negative where declared; unknown fields rejected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "state-machine precondition: transition valid from current state (generic)", error_id: ERR_INVALID_TRANSITION, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "terminal-state lockdown: no transition from a terminal state", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "ticket create/verify/settlement ops require contract HARVESTING (not SUSPENDED or other)", error_id: ERR_CONTRACT_SUSPENDED, http_status: 409, applies_to: "POST /forestry/scale-tickets, POST /scale-tickets/{id}/verify" }
  - { priority: 9, category: state, check: "bids only while sale.status == BIDDING_OPEN", error_id: ERR_SALE_NOT_OPEN_FOR_BIDDING, http_status: 409, applies_to: "POST /forestry/sales/{sale_id}/bids, POST /bids/{id}/withdraw" }
  - { priority: 10, category: state, check: "award payload bid_id must equal computed winning_bid_id", error_id: ERR_NOT_WINNING_BID, http_status: 409, applies_to: "POST /forestry/sales/{id}/award" }
  - { priority: 11, category: business_safety, check: "no open MAJOR BMP finding on the contract (open_major_findings_count == 0)", error_id: ERR_OPEN_MAJOR_FINDING, http_status: 409, applies_to: "POST /forestry/contracts/{id}/start-harvest, POST /contracts/{id}/resume, POST /contracts/{id}/complete-harvest" }
  - { priority: 12, category: business_safety, check: "no conservation enrollment window overlaps sale harvest window (closed-interval day semantics) and tract.status == OPEN", error_id: ERR_CONSERVATION_ENROLLMENT_CONFLICT, http_status: 409, applies_to: "POST /forestry/sales/{id}/offer, POST /sales/{id}/reoffer, POST /carbon-valuations" }
  - { priority: 13, category: business_safety, check: "carbon valuation accept blocked while any contract on tract is non-terminal", error_id: ERR_ACTIVE_CONTRACT_BLOCKS_CONSERVATION, http_status: 409, applies_to: "POST /forestry/carbon-valuations/{id}/accept" }
  - { priority: 14, category: business_constraint, check: "prescription activate: no overlapping ACTIVE prescription on same stand (half-open [start,end); touching endpoints allowed)", error_id: ERR_STAND_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /forestry/prescriptions/{id}/activate" }
  - { priority: 15, category: business_constraint, check: "sale offer: prescription APPROVED", error_id: ERR_PRESCRIPTION_NOT_APPROVED, http_status: 409, applies_to: "POST /forestry/sales/{id}/offer" }
  - { priority: 16, category: business_constraint, check: "sale offer: underpinning cruise CERTIFIED; prescription approve: cruise CERTIFIED", error_id: ERR_CRUISE_NOT_CERTIFIED, http_status: 409, applies_to: "POST /forestry/sales/{id}/offer, POST /prescriptions/{id}/approve" }
  - { priority: 17, category: business_constraint, check: "sale offer: cruise certified_at within CRUISE_MAX_AGE_MONTHS of clock", error_id: ERR_CRUISE_EXPIRED, http_status: 422, applies_to: "POST /forestry/sales/{id}/offer" }
  - { priority: 18, category: business_constraint, check: "certify: len(reconciled_plot_numbers) >= MIN_RECONCILED_PLOTS", error_id: ERR_MIN_PLOTS_NOT_MET, http_status: 422, applies_to: "POST /forestry/cruises/{id}/certify" }
  - { priority: 19, category: business_constraint, check: "certify: sampling_error_pct <= MAX_SAMPLING_ERROR_PCT (checked after min-plots)", error_id: ERR_SAMPLING_ERROR_TOO_HIGH, http_status: 422, applies_to: "POST /forestry/cruises/{id}/certify" }
  - { priority: 20, category: business_constraint, check: "segregation of duties: ticket verifier X-User-ID != ticket.recorded_by_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /forestry/scale-tickets/{id}/verify" }
  - { priority: 21, category: business_constraint, check: "sale.stand_id must equal prescription.stand_id and sale.tract_id must equal stand.tract_id", error_id: ERR_SALE_PRESCRIPTION_STAND_MISMATCH, http_status: 422, applies_to: "POST /forestry/sales" }
  - { priority: 22, category: business_constraint, check: "PER_UNIT sale requires species_minimum_rates; bid species_rates must cover every advertised species (and LUMP_SUM fields mutually exclusive)", error_id: ERR_SPECIES_RATE_MISSING, http_status: 422, applies_to: "POST /forestry/sales, POST /sales/{sale_id}/bids" }
  - { priority: 23, category: business_temporal, check: "bid accepted only when bid_open_at <= clock < bid_close_at", error_id: ERR_BID_WINDOW_NOT_OPEN, http_status: 409, applies_to: "POST /forestry/sales/{sale_id}/bids" }
  - { priority: 24, category: business_temporal, check: "start-harvest: clock date within sale harvest window AND prescription window (both half-open)", error_id: ERR_SEASON_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /forestry/contracts/{id}/start-harvest" }
  - { priority: 25, category: business_temporal, check: "survey_date >= planted_date + SURVEY_MIN_DAYS_AFTER_PLANTING", error_id: ERR_SURVEY_TOO_EARLY, http_status: 422, applies_to: "POST /forestry/obligations/{id}/surveys" }
  - { priority: 26, category: business_temporal, check: "record-planting: clock date <= plant_by_date", error_id: ERR_PLANTING_DEADLINE_PASSED, http_status: 422, applies_to: "POST /forestry/obligations/{id}/record-planting" }
  - { priority: 27, category: business_temporal, check: "dispute: clock <= verified_at + DISPUTE_WINDOW_DAYS", error_id: ERR_DISPUTE_WINDOW_PASSED, http_status: 422, applies_to: "POST /forestry/scale-tickets/{id}/dispute" }
  - { priority: 28, category: business_temporal, check: "cure: clock <= defaulted_at + CURE_PERIOD_DAYS", error_id: ERR_CURE_PERIOD_EXPIRED, http_status: 422, applies_to: "POST /forestry/contracts/{id}/cure" }
  - { priority: 29, category: business_temporal, check: "settlement periods on one contract must not overlap (half-open [start,end))", error_id: ERR_SETTLEMENT_PERIOD_OVERLAP, http_status: 422, applies_to: "POST /forestry/settlements" }
  - { priority: 30, category: business_fiscal, check: "PER_UNIT bid: each species rate >= species_minimum_rates floor", error_id: ERR_BID_BELOW_MINIMUM, http_status: 422, applies_to: "POST /forestry/sales/{sale_id}/bids" }
  - { priority: 31, category: business_fiscal, check: "ticket create: cumulative bf per species + new bf_governing <= round_half_up(certified species bf * 110%) (equal allowed)", error_id: ERR_VOLUME_ALLOWANCE_EXCEEDED, http_status: 422, applies_to: "POST /forestry/scale-tickets" }
  - { priority: 32, category: business_fiscal, check: "bond posting amount must equal required_bond_amount_cents exactly", error_id: ERR_BOND_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /forestry/contracts/{id}/bond" }
  - { priority: 33, category: business_fiscal, check: "PER_UNIT settlement period must contain at least one eligible VERIFIED ticket", error_id: ERR_SETTLEMENT_PERIOD_EMPTY, http_status: 422, applies_to: "POST /forestry/settlements" }
  - { priority: 34, category: business_fiscal, check: "bond release blocked unless obligation SATISFIED (hold outstanding)", error_id: ERR_BOND_HOLD_OUTSTANDING, http_status: 409, applies_to: "POST /forestry/bonds/{id}/release, POST /contracts/{id}/close" }
  - { priority: 35, category: business_fiscal, check: "contract close blocked unless all settlements in {PAID, REFUNDED, VOID}", error_id: ERR_UNPAID_SETTLEMENTS, http_status: 409, applies_to: "POST /forestry/contracts/{id}/close" }
  - { priority: 36, category: business_fiscal, check: "contract close or holdback release blocked unless obligation SATISFIED", error_id: ERR_REFORESTATION_UNSATISFIED, http_status: 409, applies_to: "POST /forestry/contracts/{id}/close, POST /contracts/{id}/release-holdback" }
  - { priority: 37, category: business_constraint, check: "OCC: expected_<parent>_version must equal parent's current version on OCC-guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /forestry/cruises/{id}/certify, POST /sales/{sale_id}/bids, POST /carbon-valuations" }


endpoints:
  # --- registry ---
  - { method: POST, path: "/forestry/foresters", description: "Register a consulting forester", roles: [PlatformAdmin], code: 201, input: [license_no, full_name, email], output: Forester, side_effects: [] }
