# =============================================================================
# §1.9 Scaffold Corner Design — Junk Removal & Hauling (Expert)
# Breadth probe: every testable claim §1.1-§1.7 declares that §1.8 does not
# already cover. Stubs (excluded_because) point at the §1.8 instance covering them.
# Canonical std_policy as defined in SCAFFOLD_DIFFICULTY_DESIGN.yaml header.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_hauljob_returns_201_with_draft_and_pinned_policy
        claim_type: Creation
        grounds:
          - entities.HaulJob
          - endpoints
        distinguishing_aspect: "POST /haul-jobs with required fields returns 201, status=DRAFT, pricing_policy_id set to the ACTIVE policy id."
        test_recipe:
          setup: ["One ACTIVE std_policy and one customer exist."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "1 A St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
          assert:
            - "response.status == 201"
            - "HaulJob.${job_id}.status == DRAFT"
            - "HaulJob.${job_id}.pricing_policy_id == ${policy_id}"

      - name: create_hauljob_missing_service_type_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.HaulJob.fields.service_type
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /haul-jobs omitting required service_type returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["ACTIVE std_policy and a customer exist."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", address: "2 A St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_hauljob_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.HaulJob
          - "errors[ERR_JOB_NOT_FOUND]"
        distinguishing_aspect: "GET /haul-jobs/{jobId} for a random UUID returns ERR_JOB_NOT_FOUND (404)."
        test_recipe:
          setup: ["No jobs created."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
          trigger:
            - call: "GET /haul-jobs/00000000-0000-4000-8000-000000000000"
              payload: { }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_JOB_NOT_FOUND"

      - name: create_hauljob_with_no_active_policy_returns_no_active_policy
        claim_type: Type Constraints
        grounds:
          - "errors[ERR_NO_ACTIVE_POLICY]"
          - entities.HaulJob.fields.pricing_policy_id
        distinguishing_aspect: "POST /haul-jobs when no PricingPolicy is ACTIVE returns ERR_NO_ACTIVE_POLICY (409)."
        test_recipe:
          setup: ["A customer exists but NO pricing policy has been created (so none ACTIVE)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C3" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "3 A St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_ACTIVE_POLICY"

      - name: create_jobitem_invalid_quantity_zero_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.JobItem.fields.quantity
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /haul-jobs/{jobId}/items with quantity 0 violates quantity>=1 and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["ACTIVE std_policy; a DRAFT job."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C4" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "4 A St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /haul-jobs/${job_id}/items"
              payload: { category: "MATTRESS", quantity: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: computed_outstanding_balance_starts_zero
        claim_type: Computed Fields
        grounds:
          - entities.Customer.fields.outstanding_balance_cents
        distinguishing_aspect: "A freshly created Customer has computed outstanding_balance_cents == 0 regardless of any input value."
        test_recipe:
          setup: ["No prior state."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
          trigger:
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C5" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Customer.${cust_id}.outstanding_balance_cents == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: dispatch_from_draft_job_returns_job_not_estimated
        claim_type: Invalid Transitions
        grounds:
          - state_machines.HaulJob.ESTIMATED_to_SCHEDULED
          - "errors[ERR_JOB_NOT_ESTIMATED]"
        distinguishing_aspect: "POST /dispatches against a DRAFT (never-estimated) job returns ERR_JOB_NOT_ESTIMATED (409); no dispatch created."
        test_recipe:
          setup: ["ACTIVE std_policy; a DRAFT job; an ON_DUTY crew; an IN_SERVICE truck."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "d1@x.com", full_name: "D1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew D1", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z" }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "TD1" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "5 A St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v: $.data.version }
          trigger:
            - call: "POST /dispatches"
              payload: { haul_job_id: "${job_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T10:00:00.000Z", expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_JOB_NOT_ESTIMATED"

      - name: cancel_completed_job_returns_not_cancellable
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.HaulJob.terminal_states
          - "errors[ERR_JOB_NOT_CANCELLABLE]"
        distinguishing_aspect: "POST /haul-jobs/{jobId}/cancel on a COMPLETED (terminal) job returns ERR_JOB_NOT_CANCELLABLE (409)."
