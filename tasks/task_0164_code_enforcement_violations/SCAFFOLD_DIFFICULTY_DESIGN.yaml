  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: notice_issue_requires_inspection_violation_found
        grounds:
          - state_machines.ViolationNotice.DRAFT_to_ISSUED
          - validations[priority=7]
          - entities.Inspection.fields.outcome
          - errors[ERR_NO_SUBSTANTIATION]
        distinguishing_aspect: |
          ViolationNotice DRAFT->ISSUED is gated on the referenced Inspection's outcome being
          VIOLATION_FOUND; an inspection with outcome NO_VIOLATION blocks issuance with
          ERR_NO_SUBSTANTIATION. Pair = ViolationNotice -> Inspection (distinct from the
          AbatementOrder -> Property pair).
        test_recipe:
          setup:
            - "An INITIAL inspection submitted with outcome NO_VIOLATION on a fresh case."
            - "Notice issuance is attempted citing that non-substantiating inspection."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
