    claim_type: weighted_scoring
    grounds:
    - calculations.crm_documentation_coverage
    excluded_because:
      difficulty_instance: crm_coverage_rounds_each_family_before_the_weighted_mean
      rationale: The pinned per-family-then-mean order is asserted there against the forbidden single-ratio alternative on
        inputs where the two disagree.
