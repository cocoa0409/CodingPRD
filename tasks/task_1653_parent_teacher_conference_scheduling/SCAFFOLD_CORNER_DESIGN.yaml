            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id", s3: "$.data[3].id", s4: "$.data[4].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G", email: "g@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S1", grade_level: 3 }, as: FrontOfficeStaff, captures: { st1: $.data.id } }
