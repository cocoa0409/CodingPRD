            - "the captured ${verified} == VERIFIED because paired_channel_count equals motorized_channel_count, and InstallJob.${j1}.hub_platform == ALEXA"
            - "the whole exchange left the install dimension alone: InstallJob.${j1}.install_status == SCHEDULED throughout"

      - name: the_version_check_outranks_both_the_quote_state_and_the_prior_placement
        claim_type: Violation → Error
        grounds:
          - validations.priority_12_ERR_STALE_QUOTE_VERSION
          - validations.priority_18_ERR_QUOTE_NOT_ACCEPTED
          - validations.priority_26_ERR_OPENING_ALREADY_ORDERED
        distinguishing_aspect: "The same placement request is refused three times for three reasons, and the version check wins twice: once over the quote's state (a PRESENTED quote presented with a stale version answers 412, not the 409 its state deserves) and once over prior placement (replaying a successful placement with its now-stale version answers 412, not ERR_OPENING_ALREADY_ORDERED). The middle call proves the state error is genuinely reachable when the version is right."
        test_recipe:
          setup:
            - "One ACTIVE territory, one designer, one vendor supporting CORDED with concurrent_capacity 5."
            - "One SCHEDULED consultation with a single LT-SHEER / CORDED opening (list price 4960)."
            - "Quote Q1 created (version captured while DRAFT) and then PRESENTED (version captured again)."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/vendors"
              payload: { name: "Ridgeline Shade Works", base_lead_time_days: 10, motorization_extra_days: 3, cutoff_hour_utc: 15, remake_policy: "SHARED_50_50", concurrent_capacity: 5, supported_lift_systems: ["CORDED"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { v1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Den window", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv1: $.data.version }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv1}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q1: $.data.id, qv_draft: $.data.version }
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
              captures: { qv_presented: $.data.version }
          trigger:
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}"], expected_quote_version: "${qv_draft}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_stale_1: $.data.error_id }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}"], expected_quote_version: "${qv_presented}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_state: $.data.error_id }
            - call: "POST /blinds/quotes/${q1}/accept"
              as: Designer
              as_user_id: "${d1}"
              captures: { qv_accepted: $.data.version }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}"], expected_quote_version: "${qv_accepted}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord1: $.data.id, cost: $.data.order_cost_cents }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}"], expected_quote_version: "${qv_accepted}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_stale_2: $.data.error_id }
          assert:
            - "the captured ${err_stale_1} == ERR_STALE_QUOTE_VERSION (412): the presentation bumped the version, and the stale figure is reported even though this PRESENTED quote could not have been placed against anyway"
            - "the captured ${err_state} == ERR_QUOTE_NOT_ACCEPTED (409) with the CURRENT version - the state error is reachable, so the first call really did stop one rung earlier"
            - "the accepted placement returns 201 with the captured ${cost} == 2083 (round_half_up(4960 x 0.42) = 2083.2 -> 2083)"
            - "the captured ${err_stale_2} == ERR_STALE_QUOTE_VERSION (412), NOT ERR_OPENING_ALREADY_ORDERED - the successful placement bumped Quote.${q1}.version, so the replay never reaches the membership and placement checks"
            - "exactly one order exists: GET /blinds/vendor-orders?quote_id=${q1} returns total_count 1 and Territory.${t1}.open_order_exposure_cents == 2083"
            - "the three refusals left the version alone: Quote.${q1}.version equals ${qv_accepted} + 1 after the whole sequence - one bump for the accept, one for the placement, none for the failures"

