              as: AgencyRadioManager
              as_user_id: "${agency_dur_id}"
              captures: { tg_dur_a: "$.data.id" }
            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_dur_id}", home_site_id: "${site_dur_id}", alias: "DUR-B", tg_decimal_id: 1302, kind: "INTEROP", encryption_mode: "CLEAR" }
              as: AgencyRadioManager
              as_user_id: "${agency_dur_id}"
              captures: { tg_dur_b: "$.data.id" }
            - call: "POST /radio-system/interop-patches"
              payload: { source_talkgroup_id: "${tg_dur_a}", target_talkgroup_id: "${tg_dur_b}", requesting_agency_id: "${agency_dur_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: Dispatcher
              as_user_id: "${agency_dur_id}"
              captures: { patch_dur_id: "$.data.id" }
            - call: "POST /radio-system/interop-patches/${patch_dur_id}/decision"
