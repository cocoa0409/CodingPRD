              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/execute"
              payload: {}
              as: Recordkeeper
              as_user_id: "rk-1"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/unwind"
              payload: { reason: "chair attempting to erase the mapping" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/unwind"
              payload: { reason: "participant data reconciliation failed post-conversion" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "trigger call 1 returned 403 ERR_ROLE_NOT_PERMITTED: notice-issue is Recordkeeper-exclusive, and the chair who approved this very proposal cannot serve the participant notice. notice_delivered_at is still null"
            - "trigger call 2 returned 403 ERR_ROLE_NOT_PERMITTED — reverse is PlanSponsorAdmin-exclusive — ahead of the DRAFT-state rejection the run would otherwise give"
            - "trigger call 3 returned 403 ERR_ROLE_NOT_PERMITTED — reopen is PlanSponsorAdmin-exclusive — ahead of the DRAFT-state rejection the review would otherwise give"
            - "trigger call 4 returned 403 ERR_ROLE_NOT_PERMITTED: rescind-approval is chair-exclusive, so the recordkeeper who will execute the mapping cannot cancel the authority for it either. The triangle is closed in both directions"
            - "trigger call 5, the identical notice-issue under the Recordkeeper role, returned 200: status APPROVED -> NOTICE_ISSUED with notice_delivered_at == 2026-08-01T00:00:00Z, which proves calls 1 and 4 failed on identity rather than on state"
            - "trigger call 7 returned 403 ERR_ROLE_NOT_PERMITTED for the chair inside a perfectly valid execution window, and trigger call 8 returned 200 for the recordkeeper on the same instant: status NOTICE_ISSUED -> EXECUTED, slot ${slot_lc_id} back to ACTIVE with current_fund_id == ${fund_lc_b_id}"
            - "trigger call 9 returned 403 ERR_ROLE_NOT_PERMITTED: unwind is PlanSponsorAdmin-exclusive, so neither the approver nor the executor can erase an executed mapping"
            - "trigger call 10 returned 200 under PlanSponsorAdmin, still inside the blackout window (2026-09-02 < 2026-09-15): status EXECUTED -> UNWOUND, Fund.${fund_lc_a_id} restored to menu_status ACTIVE with credit_accrual_status ACCRUING, Fund.${fund_lc_b_id} back to CANDIDATE, slot.current_fund_id == ${fund_lc_a_id}"
            - "counting distinct X-User-IDs across the authorise / notice / execute / undo legs of this one proposal gives four (${mem_chair_id}, rk-1, rk-1, psa-ops) spread over three roles, and no single role appears on both the authorising leg and either the executing or the undoing leg"
            - "Plan.fee_disclosure_status went COMPLIANT -> RESTATEMENT_REQUIRED on the execute and back to COMPLIANT on the unwind, since no other EXECUTED proposal on the plan is inside a blackout window"

      - name: the_auditor_can_read_the_entire_fiduciary_record_and_move_the_clock_but_can_write_nothing
