  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_create_blocked_by_concept_line_state
        grounds:
          - state_machines.ProductLine
          - validations[priority=7]
          - errors.ERR_LINE_NOT_ORDERABLE
        distinguishing_aspect: |
          Entity pair SupplyOrder x ProductLine: an order cannot even be drafted
          while the line's lifecycle is CONCEPT — the line's state gates the
          order's creation. Distinct pair from the appointment x order
          instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1, line Alder 89900 left in CONCEPT (never advanced), licensee Summit ACTIVE, cycle week 2026-09-07 OPEN."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_licensee
            - *a_licensee_active
            - *a_cycle1
          trigger:
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "ProductLine.${pl1}.lifecycle == CONCEPT (never advanced)"
            - "order create is 409 with error_id == ERR_LINE_NOT_ORDERABLE because the line is not in {ACTIVE, CLEARANCE}"
            - "no SupplyOrder is persisted (GET /api/orders?licensee_id=${l1} returns an empty array)"

      - name: appointment_create_blocked_by_order_not_picked
        grounds:
          - state_machines.SupplyOrder
          - state_machines.DeliveryAppointment
          - errors.ERR_ORDER_NOT_PICKED
        distinguishing_aspect: |
          Entity pair DeliveryAppointment x SupplyOrder: an appointment cannot
          be booked while the order's fulfillment axis is still PENDING — the
          order must first cross PENDING -> PICKED, which itself requires
          allocation ALLOCATED. Distinct pair from the order x line instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full home-delivery setup (factory, ACTIVE line, ACTIVE licensee with T-SEA, DC-KENT, OPEN cycle); home order submitted and cycle run (ALLOCATED) but NEVER picked."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_line_active
            - *a_licensee
            - *a_licensee_active
            - *a_terr_sea
            - *a_assign_sea
            - *a_dc
            - *a_cycle1
            - *a_hd_order
            - *a_submit_o1
            - *a_run_c1
          trigger:
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z", crew_units: 1 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "SupplyOrder.${o1}.fulfillment_state == PENDING (run happened, pick never did)"
            - "appointment create is 409 with error_id == ERR_ORDER_NOT_PICKED"
            - "GET /api/delivery-appointments?supply_order_id=${o1} returns an empty array"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_crew_aggregate_overlap_with_half_open_adjacency
        grounds:
          - calculations.delivery_capacity_check
          - errors.ERR_DELIVERY_CAPACITY_EXCEEDED
          - entities.DistributionCenter.fields.daily_crew_units
        distinguishing_aspect: |
          Interval semantics = AGGREGATE CAPACITY over half-open windows on the
          DistributionCenter resource: overlaps are allowed while the concurrent
          crew sum stays <= 6, and an appointment starting exactly when another
          ends does not overlap (adjacency free). Distinct semantics and
          resource from the cycle-week strict-exclusion instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1 (cap 100), line Alder ACTIVE, licensee Summit ACTIVE with T-SEA, DC-KENT crew 6, cycle OPEN; three home-delivery orders submitted, run, PICKED."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_line_active
            - *a_licensee
            - *a_licensee_active
            - *a_terr_sea
            - *a_assign_sea
            - *a_dc
            - *a_cycle1
            - *a_hd_order
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: HOME_DELIVERY }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o2: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: HOME_DELIVERY }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o3: $.data.id }
            - *a_submit_o1
            - call: "POST /api/orders/${o2}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/orders/${o3}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - *a_run_c1
            - *a_pick_o1
            - call: "POST /api/orders/${o2}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${o3}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z", crew_units: 4 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { apA: $.data.id }
            - call: "POST /api/delivery-appointments/${apA}/transition"
              payload: { to_state: CONFIRMED }
              as: LogisticsCoordinator
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o2}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T12:00:00Z", window_end: "2026-09-10T15:00:00Z", crew_units: 2 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { apB: $.data.id }
            - call: "POST /api/delivery-appointments/${apB}/transition"
              payload: { to_state: CONFIRMED }
              as: LogisticsCoordinator
              captures: { apB_status: $.data.status }
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o3}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T10:00:00Z", window_end: "2026-09-10T13:00:00Z", crew_units: 3 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "AP-A (crew 4, 09:00-12:00) CONFIRMED"
            - "AP-B (crew 2, 12:00-15:00) CONFIRMED — window_start == AP-A's window_end is adjacency, NOT overlap (half-open semantics)"
            - "AP-C (crew 3, 10:00-13:00) is 409 ERR_DELIVERY_CAPACITY_EXCEEDED — during 10:00-12:00 the concurrent sum would be 4+3 = 7 > 6"

      - name: cycle_week_strict_exclusion_with_adjacency_allowed
        grounds:
          - errors.ERR_CYCLE_WEEK_OVERLAP
          - entities.AllocationCycle.fields.week_start
          - validations[priority=9]
        distinguishing_aspect: |
          Interval semantics = STRICT EXCLUSION on the Factory resource: a
          factory's cycle weeks are half-open [week_start, +7d) windows that may
          never overlap, but a cycle starting exactly at the previous cycle's
          end is accepted. Adjacency-permitted exclusion differs from the
          crew-capacity aggregate semantics.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1; cycle C1 week 2026-09-07 (occupies [2026-09-07, 2026-09-14))."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_cycle1
          trigger:
            - call: "POST /api/allocation-cycles"
              payload: { factory_id: "${f1}", week_start: "2026-09-10T00:00:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /api/allocation-cycles"
              payload: { factory_id: "${f1}", week_start: "2026-09-14T00:00:00Z" }
              as: ProductionPlanner
              captures: { c3: $.data.id, c3_cap: $.data.capacity_units }
          assert:
            - "week_start 2026-09-10 inside C1's window is 409 ERR_CYCLE_WEEK_OVERLAP"
            - "week_start 2026-09-14 (exactly C1's end) succeeds with 201 — adjacency is allowed"
            - "the adjacent cycle carries capacity_units == 100 (factory ACTIVE, no halving)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cycle_capacity_conserved_across_submit_and_cancel
        grounds:
          - entities.AllocationCycle.fields.available_units
          - state_machines.SupplyOrder.RESERVED_to_DROPPED
          - calculations.capacity_waterfall
        distinguishing_aspect: |
          Conserved quantity = FACTORY PRODUCTION UNITS: capacity_units ==
          licensee_reserved_units + wholesale_reserved_units + available_units
          holds before, during, and after a submit (RESERVE) paired with its
          compensating CANCEL. Distinct quantity from the crew-units invariant.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1 (cap 100), line Alder ACTIVE, licensee Summit ACTIVE, cycle week 2026-09-07 OPEN."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_line_active
            - *a_licensee
            - *a_licensee_active
            - *a_cycle1
            - call: "GET /api/allocation-cycles/${c1}"
              payload: {}
              as: ProductionPlanner
              captures: { c1_lic0: $.data.licensee_reserved_units, c1_ws0: $.data.wholesale_reserved_units, c1_av0: $.data.available_units }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 5, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o_c: $.data.id }
            - call: "POST /api/orders/${o_c}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "GET /api/allocation-cycles/${c1}"
              payload: {}
              as: ProductionPlanner
              captures: { c1_lic1: $.data.licensee_reserved_units, c1_av1: $.data.available_units }
          trigger:
            - call: "POST /api/orders/${o_c}/transition"
              payload: { action: CANCEL, reason: "duplicate" }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "GET /api/allocation-cycles/${c1}"
              payload: {}
              as: ProductionPlanner
              captures: { c1_lic2: $.data.licensee_reserved_units, c1_ws2: $.data.wholesale_reserved_units, c1_av2: $.data.available_units }
          assert:
            - "at create: licensee_reserved 0 + wholesale_reserved 0 + available 100 == capacity_units 100"
            - "after SUBMIT: licensee_reserved_units == 5 and available_units == 95 (5 + 0 + 95 == 100 conserved)"
            - "after CANCEL: licensee_reserved_units == 0 and available_units == 100 (invariant restored exactly, no drift)"

      - name: crew_units_conserved_across_confirm_and_cancel
        grounds:
          - calculations.delivery_capacity_check
          - state_machines.DeliveryAppointment.CONFIRMED_to_CANCELLED
          - state_machines.DeliveryAppointment.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Conserved quantity = DC CREW UNITS on a window: a CONFIRMED
          appointment's crew holding plus the remaining bookable crew equals
          daily_crew_units; cancelling the CONFIRMED appointment restores the
          full 6, proven behaviorally by a crew-4 booking failing before the
          cancel and succeeding after. Distinct quantity from production units.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1, line Alder ACTIVE, licensee Summit ACTIVE with T-SEA, DC-KENT crew 6, cycle OPEN; two home-delivery orders submitted, run, PICKED."
            - "AP1 (crew 3, 2026-09-10 09:00-12:00) and AP2 (crew 4, same window) both created while REQUESTED (no capacity held)."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_line_active
            - *a_licensee
            - *a_licensee_active
            - *a_terr_sea
            - *a_assign_sea
            - *a_dc
            - *a_cycle1
            - *a_hd_order
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 1, delivery_mode: HOME_DELIVERY }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o2: $.data.id }
            - *a_submit_o1
            - call: "POST /api/orders/${o2}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - *a_run_c1
            - *a_pick_o1
            - call: "POST /api/orders/${o2}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z", crew_units: 3 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { ap1: $.data.id }
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o2}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z", crew_units: 4 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { ap2: $.data.id }
          trigger:
            - call: "POST /api/delivery-appointments/${ap1}/transition"
              payload: { to_state: CONFIRMED }
              as: LogisticsCoordinator
              captures: { ap1_status: $.data.status }
            - call: "POST /api/delivery-appointments/${ap2}/transition"
              payload: { to_state: CONFIRMED }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/delivery-appointments/${ap1}/transition"
              payload: { to_state: CANCELLED }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/delivery-appointments/${ap2}/transition"
              payload: { to_state: CONFIRMED }
              as: LogisticsCoordinator
              captures: { ap2_status: $.data.status }
            - call: "GET /api/orders/${o1}"
              payload: {}
              as: PlatformAdmin
              captures: { o1_ful: $.data.fulfillment_state }
          assert:
            - "AP1 CONFIRMED (3 crew <= 6)"
            - "AP2 first CONFIRM is 409 ERR_DELIVERY_CAPACITY_EXCEEDED (3 held + 4 requested = 7 > 6)"
            - "after AP1 CANCELLED, AP2 CONFIRM succeeds — the released 3 units restore the bookable pool to exactly 6"
            - "SupplyOrder.${o1}.fulfillment_state == PICKED after AP1's cancellation (SHIPPED -> PICKED compensation)"
