  - rule_id: resource_temporal_overlap
    instances:
      - name: clinician_assignment_half_open_adjacency_legal_overlap_rejected
        grounds:
          - validations[priority=49]
          - errors[ERR_CLINICIAN_DOUBLE_BOOKED]
          - entities.StaffingAssignment.fields.starts_at
          - entities.StaffingAssignment.fields.ends_at
        distinguishing_aspect: |
          Resource = Clinician, interval semantics = HALF-OPEN [starts_at, ends_at): the
          08:00–12:00 and 12:00–16:00 pair touch at a single instant and BOTH succeed, while
          11:00–15:00 strictly overlaps the first and is rejected. Endpoint exclusivity is
          per-clinician, so the same intervals are legal for a second clinician.
        test_recipe:
          setup:
            - "CA StateRule exists; one CA clinic; Dr Owen supervises clinicians O1 and O2, both CA-licensed."
            - "No staffing assignments exist yet; the clock stays at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 15", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { clinic_o_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Owen", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { phys_o_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP O One", credential: "NP", license_state_code: "CA", home_clinic_id: "${clinic_o_id}", supervising_physician_id: "${phys_o_id}" }
              as: ClinicAdmin
              captures: { clin_o1_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP O Two", credential: "NP", license_state_code: "CA", home_clinic_id: "${clinic_o_id}", supervising_physician_id: "${phys_o_id}" }
              as: ClinicAdmin
              captures: { clin_o2_id: $.data.id }
          trigger:
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_o_id}", clinician_id: "${clin_o1_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T08:00:00Z", ends_at: "2026-08-01T12:00:00Z", pinned_supervising_physician_id: "${phys_o_id}" }
              as: ClinicAdmin
              captures: { asg_morning_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_o_id}", clinician_id: "${clin_o1_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T12:00:00Z", ends_at: "2026-08-01T16:00:00Z", pinned_supervising_physician_id: "${phys_o_id}" }
              as: ClinicAdmin
              captures: { asg_afternoon_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_o_id}", clinician_id: "${clin_o1_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T11:00:00Z", ends_at: "2026-08-01T15:00:00Z", pinned_supervising_physician_id: "${phys_o_id}" }
              as: ClinicAdmin
              captures: { err6: $.data.error_id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_o_id}", clinician_id: "${clin_o2_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T11:00:00Z", ends_at: "2026-08-01T15:00:00Z", pinned_supervising_physician_id: "${phys_o_id}" }
              as: ClinicAdmin
              captures: { asg_other_id: $.data.id }
          assert:
            - "StaffingAssignment.${asg_morning_id}.status == ACTIVE"
            - "StaffingAssignment.${asg_afternoon_id}.status == SCHEDULED   # adjacency at 12:00 is legal on a half-open interval"
            - "${err6} == ERR_CLINICIAN_DOUBLE_BOOKED"
            - "HTTP status == 409 for the third call"
            - "StaffingAssignment.${asg_other_id}.status == ACTIVE   # exclusivity is per-clinician, not per-clinic"
            - "Clinician.${clin_o1_id}.active_assignment_count == 2   # the rejected interval added nothing"
            - "Physician.${phys_o_id}.current_supervised_count == 2   # distinct clinicians, not assignments"

      - name: appointment_thirty_minute_buffer_versus_hourly_slot_cap
        grounds:
          - validations[priority=47]
          - validations[priority=59]
          - errors[ERR_APPOINTMENT_SLOT_CONFLICT]
          - errors[ERR_HOURLY_SLOT_CAPACITY_EXCEEDED]
          - entities.Clinic.fields.appointment_slots_per_hour
        distinguishing_aspect: |
          A DIFFERENT resource (Clinic slots) with DIFFERENT interval semantics: instead of a
          half-open interval this is a point time plus a 30-minute pairwise BUFFER, layered over
          an hourly AGGREGATE cap of 1. 09:35 clears the buffer (35 >= 30) yet trips the cap, while
          10:25 trips the buffer (25 < 30) and, because priority 47 precedes priority 59, reports
          the buffer error even though the 10:00 hour is also full.
        test_recipe:
          setup:
            - "CA StateRule and SORE_THROAT protocol exist."
            - "A CA clinic with appointment_slots_per_hour 1 is OPEN with one ACTIVE clinician."
            - "Four adult patients exist; the clock stays at the 2026-08-01T00:00:00Z default so every scheduled_at is in the future."
