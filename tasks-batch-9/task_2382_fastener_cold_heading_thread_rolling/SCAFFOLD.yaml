  - { id: ERR_VALIDATION, http: 400, condition: "Schema violation: missing required field, unknown enum value, out-of-range number, malformed datetime, window end not after start, or paging parameter out of range" }
  - { id: ERR_PART_SPEC_NOT_FOUND, http: 404, condition: "part_spec_id in path or body does not resolve" }
  - { id: ERR_STEEL_HEAT_NOT_FOUND, http: 404, condition: "steel_heat_id in path or body does not resolve" }
