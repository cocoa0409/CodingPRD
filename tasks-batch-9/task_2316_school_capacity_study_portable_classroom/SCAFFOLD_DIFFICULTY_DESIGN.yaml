            payload: { school_id: "${study_school_id}", school_year: "2027-28", grade_level: 6, projected_students: 20, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${study_school_id}", school_year: "2027-28", grade_level: 7, projected_students: 20, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${study_school_id}", school_year: "2027-28", grade_level: 8, projected_students: 20, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/capital-budgets"
            payload: { fiscal_year: "2027-28", authorized_cents: 500000000 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { budget_id: id }
          - call: "POST /facilities/placement-sites"
            payload: { school_id: "${other_school_id}", pad_code: "PAD-SMALL", pad_length_ft: 42, pad_width_ft: 34, distance_to_fire_lane_ft: 40, electrical_drop_available_kw: 20, sewer_connection_available: false, ada_path_of_travel_compliant: true }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { wrong_small_site_id: id }
          - call: "POST /facilities/placement-sites"
            payload: { school_id: "${other_school_id}", pad_code: "PAD-BIG", pad_length_ft: 60, pad_width_ft: 34, distance_to_fire_lane_ft: 40, electrical_drop_available_kw: 20, sewer_connection_available: false, ada_path_of_travel_compliant: true }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { wrong_big_site_id: id }
          - call: "POST /facilities/placement-sites"
            payload: { school_id: "${study_school_id}", pad_code: "PAD-SMALL", pad_length_ft: 42, pad_width_ft: 34, distance_to_fire_lane_ft: 40, electrical_drop_available_kw: 20, sewer_connection_available: false, ada_path_of_travel_compliant: true }
            as: DistrictAdmin
