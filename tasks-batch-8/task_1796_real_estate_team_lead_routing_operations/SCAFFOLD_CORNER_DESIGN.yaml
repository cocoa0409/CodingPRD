      - name: approve_approved_deal_returns_deal_not_approvable
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEAL_NOT_APPROVABLE]", state_machines.Deal]
        distinguishing_aspect: "Approval is only valid from PENDING or DISPUTED: a second approval of an APPROVED deal fails with ERR_DEAL_NOT_APPROVABLE and does not re-run the closure cascade."
