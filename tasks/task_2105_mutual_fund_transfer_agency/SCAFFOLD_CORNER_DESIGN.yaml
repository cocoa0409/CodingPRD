  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_account_version_blocks_a_second_systematic_plan_creation
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-create-stale-account]"
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - "validations[priority=70]"
        distinguishing_aspect: "Creating the first plan advances ShareholderAccount.version, so a second create still carrying the version observed at activation is refused with 412 ERR_STALE_ACCOUNT_VERSION and the first plan remains the only plan on the account."
        test_recipe:
          setup:
            - "One share class and one ACTIVE DIRECT/CA account whose version was captured at activation."
            - "One ACTIVE SYSTEMATIC_INVESTMENT plan already created with that captured version."
          setup_api_calls:
