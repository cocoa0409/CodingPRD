            - "VcpEnrollment.${enr_id}.status == REMEDY_APPROVED"
            - "RemedialActionPlan.${planB_id}.status == WITHDRAWN"
            - "RemedialActionPlan.${planA_id}.pinned_cleanup_goal_versions has 2 entries, ordered by the goals' created_at ASC"

  # ===========================================================================
  # Rule 4 — Transitive cascades: two chains of different depth, fired by two
  #          different triggers, each link caused by the previous one
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: monitoring_exceedance_impairs_control_revokes_letter_rescinds_awards
        grounds:
          - state_machines.MonitoringEvent.SCHEDULED_to_REPORTED
          - state_machines.SiteControl.OPERATING_to_IMPAIRED
          - state_machines.Site.OPEN_to_RESTRICTED
          - state_machines.NoFurtherActionLetter.ACCEPTED_BY_LENDER_to_REVOKED
          - state_machines.FundingAward.AWARDED_to_RESCINDED
          - calculations.goal_attainment_streak
          - calculations.site_cleanup_posture
          - calculations.funding_assembly_waterfall
        distinguishing_aspect: |
          Depth-5 chain fired by a single monitoring result: result_status
          EXCEEDANCE (L1) -> CleanupGoal streak reset (L2) -> SiteControl
          OPERATING -> IMPAIRED (L2) -> Site.impaired_control_count 0 -> 1 and
          cleanup_posture OPEN -> RESTRICTED (L3) -> NoFurtherActionLetter
          ACCEPTED_BY_LENDER -> REVOKED with revocation_reason CONTROL_FAILURE
          (L4) -> both AWARDED FundingAwards RESCINDED with allocated_cents 0 and
          unfunded_gap_cents back to the whole need (L5). Each link is caused by
          the previous one, and the conditional link is observable: the
          COMPLETION_REVIEW -> IMPLEMENTATION revert does NOT fire because the
          enrollment is already CLOSED, so reverted_completion_count stays 0.
          Trigger = a monitoring result filing.
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED enrollment; plan A approved with its VAPOR_MITIGATION control, cost-cap policy bound (total_funding_need_cents 118043177)."
            - "Two AWARDED funding awards: a priority-1 GRANT (allocated 23842210) and a priority-2 TAX_CREDIT (allocated 22636409), leaving unfunded_gap_cents 71564558."
            - "Clock 2027-01-15: the control is certified PASS, so it is OPERATING and the enrollment is in IMPLEMENTATION."
            - "Eight SAMPLING monitoring events, four per cleanup goal, all reported COMPLIANT at clock 2027-06-01, so both goals reach compliant_streak 4 and attainment_status ATTAINED."
            - "Completion requested, letter created with requested_scope RESTRICTED_WITH_CONTROLS, issued by reviewer-gamma (enrollment CLOSED) and accepted by the lender."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_insurer
            - *k_lab
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_clock_dec
            - *k_p2
            - *k_p2fa
            - *k_p2fb
            - *k_p2fc
            - *k_p2sub
            - *k_p2app
            - *k_g1
            - *k_g2
            - *k_enr
            - *k_elig
            - *k_planA
            - *k_ctlA
            - *k_planAsub
            - *k_planAtech
            - *k_planApcc
            - *k_planAapp
            - *k_quoteA
            - *k_bindA
            - &k_w1
              call: "POST /funding-awards"
              payload:
                site_id: "${site_id}"
