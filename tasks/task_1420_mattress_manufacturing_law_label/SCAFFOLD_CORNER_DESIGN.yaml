            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["UNDER PENALTY OF LAW THIS TAG NOT TO BE REMOVED"], prop65_warning_required: false }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp_id: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp_id}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 1000, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "CA", quantity: 1, unit_price_cents: 200000, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o1: $.data.id } }
            - { call: "POST /plant/production-orders/${o1}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o1}/start-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o1}/complete-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o1}/qc-pass", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "CA", quantity: 1, unit_price_cents: 200000, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o2: $.data.id } }
