            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-09-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_b: "$.data.id" } }
          trigger:
            - { call: "POST /mill/grade-runs", payload: { flooring_lot_id: "${lot_id}", inspector_ruleset: "NHLA", expected_lot_version: "${lot_v2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_b}/load", payload: {}, as: GradeInspector }
            - { call: "POST /mill/grade-runs", payload: { flooring_lot_id: "${lot_id}", inspector_ruleset: "NHLA", expected_lot_version: "${lot_v2}" }, as: GradeInspector }
          assert:
            - "KilnOperator opening a grade run: status 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\"; GET /mill/grade-runs?flooring_lot_id={lot_id} returns total_count 0 and GET /mill/flooring-lots/{lot_id} still shows the same version."
            - "GradeInspector loading a charge: status 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\"; GET /mill/kiln-charges/{charge_b} still shows status \"SCHEDULED\"."
            - "GradeInspector opening the grade run: status 201 with data.status == \"DRAFT\" and data.inspector_ruleset == \"NHLA\"."
            - "The lot version incremented only on the permitted call, so the rejected attempt did not consume the optimistic-concurrency token."

      - name: green_receipt_create_shared_by_procurement_clerk_and_mill_admin
        claim_type: shared_operation_allowed
        grounds: ["rbac.roles[ProcurementClerk].shared_operations", "rbac.roles[MillAdmin].shared_operations", "endpoints[POST /mill/green-receipts]"]
        distinguishing_aspect: "Both role holders write to the same collection with identical semantics, and each can accept the other's receipt - the shared operation is not scoped to the creating role."
        test_recipe:
          setup: ["One RED_OAK species profile."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r_clerk: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Valley Sawmill", received_board_feet: 3000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: MillAdmin, captures: { r_admin: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r_clerk}/accept", payload: { accepted_board_feet: 5800 }, as: MillAdmin }
            - { call: "POST /mill/green-receipts/${r_admin}/accept", payload: { accepted_board_feet: 2900 }, as: ProcurementClerk }
          assert:
            - "Clerk create: status 201 with data.status == \"RECEIVED\"."
            - "Admin create: status 201 with data.status == \"RECEIVED\"."
            - "Admin accepting the clerk's receipt: status 200 with data.accepted_board_feet == 5800 and data.status == \"ACCEPTED\"."
            - "Clerk accepting the admin's receipt: status 200 with data.accepted_board_feet == 2900 and data.status == \"ACCEPTED\"."
            - "GET /mill/green-receipts?status=ACCEPTED returns total_count 2."

      - name: claim_submitter_cannot_adjudicate_its_own_claim
        claim_type: segregation_of_duties
        grounds: ["rbac.segregation_of_duties", "validations[priority 14]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The 403 is keyed on X-User-ID rather than X-Role: the same WarrantyAdjudicator role succeeds once a different user id makes the call, and the check fires at priority 14 before any claim-state or reserve rule."
        test_recipe:
          setup: ["A SOLID RED_OAK line (material 895 c/sf, funded 600000) with one SUBMITTED 240 sq ft claim filed by user u_intake. Logical clock 2026-08-20."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 240, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake" }
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 240, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          assert:
            - "Submitter adjudicating: status 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\"."
            - "The claim still shows adjudication_status \"SUBMITTED\", adjudicated_by_user_id == null and adjudicated_liability_cents == null; the line still shows warranty_committed_cents == 0."
            - "A different user id with the same role: status 200 with data.adjudication_status == \"APPROVED\", data.adjudicated_by_user_id == \"u_adjudicator\" and data.adjudicated_liability_cents == 173113."
            - "data.submitted_by_user_id remains \"u_intake\" on the approved claim."

  - section: cross-cutting complexity layers
    instances:
      - name: stale_species_profile_version_rejected_then_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[drying-schedule-supersede-stale-species-profile]", "validations[priority 12]", "errors[ERR_STALE_SPECIES_PROFILE_VERSION]"]
        distinguishing_aspect: "Every successful schedule create bumps SpeciesProfile.version, so a caller replaying the version it read before its own first write is refused with 412 and must re-read - the version is a token consumed per write, not per session."
        test_recipe:
          setup: ["One RED_OAK species profile at version 1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v1: "$.data.version" } }
          trigger:
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v1}" }, as: MillAdmin }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-125", thickness_in: 1.25, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v1}" }, as: MillAdmin }
            - { call: "GET /mill/species-profiles/${species_id}", payload: {}, as: MillAdmin, captures: { species_v2: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-125", thickness_in: 1.25, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v2}" }, as: MillAdmin }
          assert:
            - "First create: status 201 with data.planned_dry_hours == 265.0; GET /mill/species-profiles/{species_id} now reports version 2."
            - "Replayed version 1: status 412 with data.error_id == \"ERR_STALE_SPECIES_PROFILE_VERSION\"; GET /mill/drying-schedules?species_profile_id={species_id} still returns total_count 1 and the profile version is still 2."
            - "Re-read version 2 create: status 201 with data.schedule_code == \"RO-125\" and data.planned_dry_hours == 384.25 rounded per the formula to 384.3."
            - "The profile version is 3 after the second successful create - the refused attempt did not increment it."

      - name: stale_lot_version_rejected_on_grade_run_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[grade-run-create-stale-lot]", "validations[priority 13]", "errors[ERR_STALE_LOT_VERSION]"]
        distinguishing_aspect: "The lot version read at milling completion is invalidated by the first grade run, so a second inspector holding the milling-time version is refused with 412 while the OCC check at priority 13 precedes the lot-state check at priority 18."
        test_recipe:
          setup: ["A MILLED RED_OAK lot whose version was captured at complete_milling."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk, captures: { r2: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r2}/accept", payload: { accepted_board_feet: 3900 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/start_drying", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/begin_conditioning", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 6.4, core_moisture_pct: 8.2 }, as: KilnOperator }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots", payload: { product_line_id: "${line_id}", kiln_charge_id: "${charge_a}", input_dry_bf: 6000 }, as: MillSupervisor, captures: { lot_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots/${lot_id}/complete_milling", payload: { actual_milled_width_in: 3.190, net_flooring_bf: 4680, shorts_bf: 180, sawdust_tons: 1.20, shavings_tons: 0.80 }, as: MillSupervisor, captures: { lot_v2: "$.data.version" } }
          trigger:
            - { call: "POST /mill/grade-runs", payload: { flooring_lot_id: "${lot_id}", inspector_ruleset: "NHLA", expected_lot_version: "${lot_v2}" }, as: GradeInspector, captures: { run1: "$.data.id" } }
            - { call: "POST /mill/grade-runs", payload: { flooring_lot_id: "${lot_id}", inspector_ruleset: "MILL_CHARACTER", expected_lot_version: "${lot_v2}" }, as: GradeInspector }
            - { call: "GET /mill/flooring-lots/${lot_id}", payload: {}, as: GradeInspector, captures: { lot_v3: "$.data.version" } }
            - { call: "POST /mill/grade-runs", payload: { flooring_lot_id: "${lot_id}", inspector_ruleset: "MILL_CHARACTER", expected_lot_version: "${lot_v3}" }, as: GradeInspector }
          assert:
            - "First run: status 201 with data.status == \"DRAFT\"; the lot version has advanced past the captured milling version."
            - "Replayed milling version: status 412 with data.error_id == \"ERR_STALE_LOT_VERSION\"; GET /mill/grade-runs?flooring_lot_id={lot_id} still returns total_count 1."
            - "Re-read version: status 201 with data.inspector_ruleset == \"MILL_CHARACTER\" - two DRAFT runs may coexist on one lot."
            - "The lot advanced exactly two versions across the three attempts, so the 412 consumed nothing."

      - name: warranty_posture_flips_exactly_at_the_five_hundred_thousand_floor
        claim_type: rate_threshold_triggers
        grounds: ["calculations.product_line_posture", "endpoints[POST /mill/product-lines/{product_line_id}/fund_warranty]"]
        distinguishing_aspect: "A balance of 499999 cents is still RESTRICTED and a single additional cent taking it to exactly 500000 flips the line to OPEN, so the floor is inclusive on the OPEN side."
        test_recipe:
          setup: ["A SOLID RED_OAK line funded with only 300000 cents."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 300000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
          trigger:
            - { call: "GET /mill/product-lines/${line_id}", payload: {}, as: MillAdmin }
            - { call: "POST /mill/product-lines/${line_id}/fund_warranty", payload: { amount_cents: 199999 }, as: MillAdmin }
            - { call: "POST /mill/product-lines/${line_id}/fund_warranty", payload: { amount_cents: 1 }, as: MillAdmin }
          assert:
            - "Initial read: status 200 with data.warranty_balance_cents == 300000, data.warranty_committed_cents == 0 and data.posture == \"RESTRICTED\"."
            - "After 199999: status 200 with data.warranty_funded_total_cents == 499999, data.warranty_balance_cents == 499999 and data.posture == \"RESTRICTED\"."
            - "After 1 more cent: status 200 with data.warranty_funded_total_cents == 500000, data.warranty_balance_cents == 500000 and data.posture == \"OPEN\"."
            - "data.freeze_override is null throughout - the posture change came from the reserve, not from an administrative freeze."

