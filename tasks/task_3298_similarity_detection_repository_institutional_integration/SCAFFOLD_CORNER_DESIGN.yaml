scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, computed fields, immutability,
  # system-field handling.
  # ===========================================================================
  - section: entities
    instances:
      - name: institution_created_with_defaults
        claim_type: defaults
        grounds: [entities.Institution]
        distinguishing_aspect: "Omitting all optional fields applies defaults: repository_participation=INSTITUTION_ONLY, cross_institution_comparison_enabled=false, ai_detection_enabled=true, data_residency_locked=false, comparable_submission_count=0, version=1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Def U", residency_region: "EU" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
          trigger:
            - { call: "GET /integrity/institutions/${inst_id}", payload: {}, as: PlatformAdmin }
          assert:
            - "repository_participation == INSTITUTION_ONLY"
            - "cross_institution_comparison_enabled == false and ai_detection_enabled == true and data_residency_locked == false"
            - "comparable_submission_count == 0 and version == 1 and id is a prefix-free UUID"
      - name: match_fragment_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.MatchFragment]
        distinguishing_aspect: "common_fields: false — MatchFragment carries id and created_at only: response has no version/updated_at keys, and no update endpoint exists."
        test_recipe:
          setup:
            - "US institution with ACTIVE integration, instructor, GRANTED student, assignment, one submission and one ACTIVE source"
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Imm U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c1" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic1@x.edu", full_name: "P C1" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc1", email: "sc1@x.edu", full_name: "S C1", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Imm", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "immutable fragment body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "INTERNET", uri: "https://src/imm", region: "US" }, as: PlatformAdmin, captures: { src1: $.data.id } }
          trigger:
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 5, match_category: "DIRECT_QUOTE", offset_start: 0 }, as: PlatformAdmin, captures: { frag: $.data } }
          assert:
            - "fragment response has id and created_at but NO version or updated_at keys"
            - "weighted_words == 5 computed at injection (source: computed field present)"
      - name: submission_word_count_computed_not_input
        claim_type: computed_field
        grounds: [entities.Submission.fields.word_count]
        distinguishing_aspect: "word_count is source: computed — a client-supplied word_count key is not in the endpoint input schema and the server computes from tokenization."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, GRANTED student, assignment"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Comp U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c2" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic2@x.edu", full_name: "P C2" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc2", email: "sc2@x.edu", full_name: "S C2", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Comp", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "one two  three\nfour" }, as: Student, as_user_id: "${stu_id}", captures: { wc: $.data.word_count } }
          assert:
            - "word_count == 4 (whitespace-separated tokens; runs of spaces and newlines collapse)"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown,
  # idempotency, parallel dimensions, conditional cascade, auto-transitions.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: process_superseded_submission_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Submission]
        distinguishing_aspect: "SUPERSEDED is terminal: process on a superseded submission is rejected with ERR_INVALID_SUBMISSION_STATE; no report is created."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, GRANTED student, assignment; submission s1 processed to REPORT_READY then superseded by s2"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Term U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c3" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic3@x.edu", full_name: "P C3" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc3", email: "sc3@x.edu", full_name: "S C3", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Term", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "first version" }, as: Student, as_user_id: "${stu_id}", captures: { sub1: $.data.id } }
            - { call: "POST /integrity/submissions/${sub1}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "second version", supersedes_submission_id: "${sub1}" }, as: Student, as_user_id: "${stu_id}" }
          trigger:
            - { call: "POST /integrity/submissions/${sub1}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_SUBMISSION_STATE (409)"
            - "GET /integrity/submissions/${sub1} still shows pipeline_state == SUPERSEDED"
      - name: finalize_already_finalized_rejected
        claim_type: idempotency
        grounds: [state_machines.SimilarityReport.DRAFT_to_FINALIZED]
        distinguishing_aspect: "Finalizing an already-FINALIZED report is not in the transition table: second finalize returns ERR_INVALID_SUBMISSION_STATE and does not bump version or re-release grades."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, GRANTED student, assignment, processed submission with FINALIZED report"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Idem U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c4" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic4@x.edu", full_name: "P C4" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc4", email: "sc4@x.edu", full_name: "S C4", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Idem", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "idem body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { rep_id: "$.data[0].id" } }
            - { call: "POST /integrity/similarity-reports/${rep_id}/finalize", payload: { instructor_interpretation: "NOT_MISCONDUCT" }, as: Instructor, as_user_id: "${instr_id}" }
          trigger:
            - { call: "POST /integrity/similarity-reports/${rep_id}/finalize", payload: { instructor_interpretation: "POSSIBLE_MISCONDUCT" }, as: Instructor, as_user_id: "${instr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_SUBMISSION_STATE (409)"
            - "GET /integrity/submissions/${sub_id}/similarity-reports: interpretation remains NOT_MISCONDUCT (the second payload did not overwrite it)"
      - name: assignment_parallel_dimensions_evolve_independently
        claim_type: valid_transition
        grounds: [state_machines.Assignment]
        distinguishing_aspect: "Parallel dimensions: releasing report_visibility does not affect accepting_state, and the due_at auto-close does not reset report_visibility — the two axes are independent on the same entity."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, assignment due 2027-01-01 with report_visibility released while still OPEN; clock then advanced past due"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Par U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c5" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic5@x.edu", full_name: "P C5" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Par", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id, asg_v: $.data.version } }
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v}", report_visibility: "RELEASED" }, as: Instructor, as_user_id: "${instr_id}", captures: { vis: $.data.report_visibility, acc: $.data.accepting_state } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /integrity/assignments/${asg_id}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { vis2: $.data.report_visibility, acc2: $.data.accepting_state } }
          assert:
            - "after PATCH: report_visibility == RELEASED while accepting_state == OPEN (independent axes)"
            - "after clock advance + read: accepting_state == CLOSED (lazy auto-close) while report_visibility remains RELEASED"
      - name: suspend_integration_conditional_cascade_only_open_assignments
        claim_type: conditional_cascade
        grounds: [state_machines.LmsIntegration.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Conditional cascade: suspend flips only OPEN assignments to CLOSED; an already auto-closed assignment is untouched (its version does not bump)."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor; assignment A_open due 2027-06-01 and assignment A_closed due 2026-09-02 with clock at 2026-09-05 (A_closed lazy-closed by a read)"]
          setup_api_calls:
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/institutions", payload: { name: "Cond U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c6" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic6@x.edu", full_name: "P C6" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "A_open", due_at: "2027-06-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { a_open: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "A_closed", due_at: "2026-09-02T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { a_closed: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /integrity/assignments/${a_closed}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { closed_v: $.data.version, closed_acc: $.data.accepting_state } }
          trigger:
            - { call: "POST /integrity/lms-integrations/${integ_id}/suspend", payload: {}, as: PlatformAdmin }
            - { call: "GET /integrity/assignments/${a_open}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { open_acc: $.data.accepting_state } }
            - { call: "GET /integrity/assignments/${a_closed}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { closed_v2: $.data.version } }
          assert:
            - "before suspend: A_closed accepting_state == CLOSED (lazy auto-close fired on the read)"
            - "after suspend: A_open accepting_state == CLOSED (cascade hit the OPEN assignment)"
            - "A_closed version unchanged by the cascade (conditional: already-CLOSED assignments untouched)"
      - name: retention_policy_lazy_expiry
        claim_type: valid_transition
        grounds: [state_machines.DataRetentionPolicy.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "System auto-transition: a policy whose retention_end has passed reads as EXPIRED, and run-purge on it is rejected with ERR_POLICY_EXPIRED."
        test_recipe:
          setup: ["US institution with ACTIVE policy window [2026-01-01, 2026-02-01); clock at 2026-03-01"]
          setup_api_calls:
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/institutions", payload: { name: "Exp U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "US", applies_to: "SUBMISSIONS", retention_start: "2026-01-01T00:00:00Z", retention_end: "2026-02-01T00:00:00Z" }, as: PlatformAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /integrity/retention-policies/${pol_id}/run-purge", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /integrity/institutions/${inst_id}/retention-policies", payload: {}, as: PlatformAdmin, captures: { pst: "$.data[0].policy_state" } }
          assert:
            - "run-purge rejected: error_id == ERR_POLICY_EXPIRED (409)"
            - "policy list shows policy_state == EXPIRED (lazy transition applied on read)"

  # ===========================================================================
  # Section: calculations — precision, input-set filtering, constants,
  # suppression gate, band boundaries.
  # ===========================================================================
  - section: calculations
    instances:
      - name: score_clamps_at_10000_bps
        claim_type: precision
        grounds: [calculations.similarity_score]
        distinguishing_aspect: "The min(1, ...) clamp: matched words exceeding word_count cannot push the score past 10000 bps."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, GRANTED student, assignment; 10-word submission with one DIRECT_QUOTE fragment of 50 words @0"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Clamp U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c7" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic7@x.edu", full_name: "P C7" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc7", email: "sc7@x.edu", full_name: "S C7", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Clamp", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "tiny body of exactly ten whitespace separated words here ok" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "INTERNET", uri: "https://src/cl", region: "US" }, as: PlatformAdmin, captures: { src1: $.data.id } }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 50, match_category: "DIRECT_QUOTE", offset_start: 0 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { raw_bps: "$.data[0].raw_score_bps" } }
          assert:
            - "word_count == 10; matched 50 > 10 but raw_score_bps == 10000 (clamped), not 50000"
      - name: ai_assessment_suppressed_when_policy_disabled
        claim_type: input_set_filtering
        grounds: [calculations.ai_confidence_score, entities.Institution.fields.ai_detection_enabled]
        distinguishing_aspect: "Institution policy flag gates the assessment: ai_detection_enabled=false -> SUPPRESSED with null scores even for a long submission with full signals (conditional feature flag layer)."
        test_recipe:
          setup: ["EU institution created with ai_detection_enabled=false, ACTIVE integration, instructor, GRANTED student, assignment, 300-word submission with full AI signals"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "NoAI U", residency_region: "EU", ai_detection_enabled: false }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "MOODLE", external_key: "c8" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic8@x.edu", full_name: "P C8" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc8", email: "sc8@x.edu", full_name: "S C8", home_region: "EU" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "NoAI", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_300_WORDS: exactly 300 whitespace-separated tokens>", ai_burstiness: 0.9, ai_perplexity: 0.9, ai_stylometry: 0.9 }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/ai-writing-assessments", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { st: "$.data[0].assessment_state", bps: "$.data[0].ai_score_bps" } }
          assert:
            - "assessment_state == SUPPRESSED despite 300 words and full signals — the institution policy flag dominates"
            - "ai_score_bps, confidence_band, conservative_score_bps are all null"
      - name: ai_confidence_band_high_boundary
        claim_type: constants_applied
        grounds: [calculations.ai_confidence_score]
        distinguishing_aspect: "Band boundary precision: spread exactly 0.15 is HIGH (<=), spread 0.31 is LOW (> 0.30); pinned constants BAND_HIGH_MAX_SPREAD and BAND_MEDIUM_MAX_SPREAD."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, GRANTED student, assignment; two submissions each with 250 words: subA signals (0.50, 0.55, 0.65) spread 0.15; subB signals (0.10, 0.20, 0.41) spread 0.31"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Band U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c9" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic9@x.edu", full_name: "P C9" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc9", email: "sc9@x.edu", full_name: "S C9", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Band", due_at: "2027-01-01T00:00:00Z", max_submissions_per_student: 5 }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_250_WORDS>", ai_burstiness: 0.50, ai_perplexity: 0.55, ai_stylometry: 0.65 }, as: Student, as_user_id: "${stu_id}", captures: { sub_a: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_250_WORDS_VARIANT>", ai_burstiness: 0.10, ai_perplexity: 0.20, ai_stylometry: 0.41 }, as: Student, as_user_id: "${stu_id}", captures: { sub_b: $.data.id } }
          trigger:
            - { call: "POST /integrity/submissions/${sub_a}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "POST /integrity/submissions/${sub_b}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_a}/ai-writing-assessments", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { band_a: "$.data[0].confidence_band", bps_a: "$.data[0].ai_score_bps", cons_a: "$.data[0].conservative_score_bps" } }
            - { call: "GET /integrity/submissions/${sub_b}/ai-writing-assessments", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { band_b: "$.data[0].confidence_band", bps_b: "$.data[0].ai_score_bps", cons_b: "$.data[0].conservative_score_bps" } }
          assert:
            - "subA: spread 0.65-0.50 == 0.15 <= 0.15 -> HIGH; ai_score_bps == round_half_up(10000*(0.50*0.5+0.55*0.3+0.65*0.2)) == 5450; conservative == 5450-500 == 4950"
            - "subB: spread 0.41-0.10 == 0.31 > 0.30 -> LOW; ai_score_bps == round_half_up(10000*(0.10*0.5+0.20*0.3+0.41*0.2)) == 1930; conservative == max(0, 1930-2500) == 0 (floor at 0)"
      - name: excluded_fragments_never_reenter_scores
        claim_type: input_set_filtering
        grounds: [calculations.similarity_score, entities.MatchFragment.fields.excluded]
        distinguishing_aspect: "Input-set filtering after retraction: regenerating a report after source retract computes scores over the surviving (non-excluded) fragments only — the retracted source contributes 0."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, GRANTED student, assignment; 100-word submission with DIRECT_QUOTE 10w on source S1 and PARAPHRASE 25w @50 on source S2; processed once, then S1 retracted"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Filt U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c10" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic10@x.edu", full_name: "P C10" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc10", email: "sc10@x.edu", full_name: "S C10", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Filt", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "<BODY_100_WORDS>" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "INTERNET", uri: "https://src/f1", region: "US" }, as: PlatformAdmin, captures: { src1: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "PUBLICATION", uri: "https://src/f2", region: "US" }, as: PlatformAdmin, captures: { src2: $.data.id } }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 10, match_category: "DIRECT_QUOTE", offset_start: 0 }, as: PlatformAdmin }
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src2}", matched_word_count: 25, match_category: "PARAPHRASE", offset_start: 50 }, as: PlatformAdmin }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "POST /integrity/source-documents/${src1}/retract", payload: {}, as: InstitutionalAdmin }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { raw_bps: "$.data[0].raw_score_bps", rep_state: "$.data[0].report_state" } }
          assert:
            - "before retract the raw sum was 10 + round_half_up(25*0.8)=20 -> 30 -> 3000 bps; after retract + regen the excluded fragment contributes 0: raw_score_bps == round_half_up(10000*20/100) == 2000"
            - "report_state == DRAFT after regeneration (STALE cleared)"

  # ===========================================================================
  # Section: validations — error triggers not exercised by §1.8 dual-failure
  # pairs, plus OCC stale-version checks per concurrency rule.
  # ===========================================================================
  - section: validations
    instances:
      - name: intake_strict_consent_missing_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]"]
        distinguishing_aspect: "STRICT consent enforcement: a NOT_GIVEN student is rejected at intake with ERR_CONSENT_MISSING even when everything else is valid (consent handling requirement)."
        test_recipe:
          setup: ["US institution, STRICT ACTIVE integration, instructor, assignment, student with consent_status == NOT_GIVEN"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Cons U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c11" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic11@x.edu", full_name: "P C11" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc11", email: "sc11@x.edu", full_name: "S C11", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Cons", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "no consent given" }, as: Student, as_user_id: "${stu_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONSENT_MISSING (422); no submission persisted (GET /integrity/assignments/${asg_id}/submissions returns [])"
      - name: intake_lenient_allows_not_given_but_rejects_withdrawn
        claim_type: conditional_validation
        grounds: ["validations[priority=9]", entities.LmsIntegration.fields.consent_enforcement]
        distinguishing_aspect: "LENIENT enforcement flips the gate: NOT_GIVEN passes intake, WITHDRAWN fails — the rule changes with the integration's configuration flag."
        test_recipe:
          setup: ["US institution, LENIENT ACTIVE integration, instructor, assignment; student NG (NOT_GIVEN) and student WD (consent GRANTED then WITHDRAWN)"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Len U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c12", consent_enforcement: "LENIENT" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic12@x.edu", full_name: "P C12" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sng", email: "sng@x.edu", full_name: "S NG", home_region: "US" }, as: PlatformAdmin, captures: { stu_ng: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "swd", email: "swd@x.edu", full_name: "S WD", home_region: "US" }, as: PlatformAdmin, captures: { stu_wd: $.data.id, stu_wd_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_wd}/consents", payload: { expected_student_version: "${stu_wd_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_wd}", captures: { stu_wd_v2: $.data.version } }
            - { call: "POST /integrity/students/${stu_wd}/consents", payload: { expected_student_version: "${stu_wd_v2}", consent_action: "WITHDRAW" }, as: Student, as_user_id: "${stu_wd}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Len", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_ng}", content_text: "lenient not given" }, as: Student, as_user_id: "${stu_ng}", captures: { ok_sub: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_wd}", content_text: "lenient withdrawn" }, as: Student, as_user_id: "${stu_wd}", captures: { err: $.data.error_id } }
          assert:
            - "NOT_GIVEN under LENIENT: 201, submission created"
            - "WITHDRAWN under LENIENT: error_id == ERR_CONSENT_MISSING (422)"
      - name: residency_violation_when_locked
        claim_type: violation_to_error
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "International data residency: a student whose home_region differs from the locked institution region cannot submit (student record obligation)."
        test_recipe:
          setup: ["EU institution with data_residency_locked=true, ACTIVE integration, instructor, assignment, GRANTED student with home_region=US"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Res U", residency_region: "EU", data_residency_locked: true }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c13" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic13@x.edu", full_name: "P C13" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc13", email: "sc13@x.edu", full_name: "S C13", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Res", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "cross region student" }, as: Student, as_user_id: "${stu_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RESIDENCY_VIOLATION (422) — home_region US != locked residency_region EU"
      - name: residency_region_patch_locked_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "concurrency_rules[institution-policy-stale-version]"]
        distinguishing_aspect: "Residency immutability: PATCH changing residency_region on a locked institution fails with ERR_RESIDENCY_LOCKED even with the correct OCC version."
        test_recipe:
          setup: ["US institution with data_residency_locked=true"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Lock U", residency_region: "US", data_residency_locked: true }, as: PlatformAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
          trigger:
            - { call: "PATCH /integrity/institutions/${inst_id}", payload: { expected_institution_version: "${inst_v}", residency_region: "EU" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RESIDENCY_LOCKED (409)"
            - "GET /integrity/institutions/${inst_id}: residency_region still US and version unchanged"
      - name: threshold_out_of_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]"]
        distinguishing_aspect: "small_match_threshold_words outside 1..32 is rejected on assignment PATCH; the boundary values 1 and 32 are valid."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, assignment"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Thr U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c14" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic14@x.edu", full_name: "P C14" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Thr", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id, asg_v: $.data.version } }
          trigger:
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v}", small_match_threshold_words: 33 }, as: Instructor, as_user_id: "${instr_id}", captures: { err: $.data.error_id } }
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v}", small_match_threshold_words: 32 }, as: Instructor, as_user_id: "${instr_id}", captures: { ok_thr: $.data.small_match_threshold_words } }
          assert:
            - "33 -> error_id == ERR_THRESHOLD_OUT_OF_RANGE (422), version unchanged"
            - "32 (upper boundary) accepted: small_match_threshold_words == 32"
      - name: submission_quota_limit_reached
        claim_type: aggregate_validation
        grounds: ["validations[priority=16]", entities.Assignment.fields.max_submissions_per_student]
        distinguishing_aspect: "Aggregate quota: individually valid submissions collectively exceed max_submissions_per_student=2 — the third intake fails with ERR_SUBMISSION_LIMIT_REACHED; SUPERSEDED submissions do not consume quota."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, assignment with max_submissions_per_student=2, GRANTED student with two live submissions"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Quota U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c15" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic15@x.edu", full_name: "P C15" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc15", email: "sc15@x.edu", full_name: "S C15", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Quota", due_at: "2027-01-01T00:00:00Z", max_submissions_per_student: 2 }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "quota one" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "quota two" }, as: Student, as_user_id: "${stu_id}" }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "quota three" }, as: Student, as_user_id: "${stu_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUBMISSION_LIMIT_REACHED (422) — 2 non-SUPERSEDED submissions already consume the quota of 2"
      - name: assignment_patch_stale_version_occ
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[assignment-settings-stale-version]"]
        distinguishing_aspect: "OCC: a PATCH carrying the pre-update version after a successful update is rejected with ERR_STALE_VERSION (412); replayed with the fresh version it succeeds."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, assignment at version 1"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Occ U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c16" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic16@x.edu", full_name: "P C16" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Occ", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id, asg_v: $.data.version } }
          trigger:
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v}", exclude_quotes: true }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_v2: $.data.version } }
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v2} - 1", exclude_bibliography: true }, as: Instructor, as_user_id: "${instr_id}", captures: { err: $.data.error_id } }
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v2}", exclude_bibliography: true }, as: Instructor, as_user_id: "${instr_id}", captures: { ok_excl: $.data.exclude_bibliography } }
          assert:
            - "first PATCH succeeds: version 1 -> 2"
            - "second PATCH with stale version 1: error_id == ERR_STALE_VERSION (412)"
            - "third PATCH with fresh version 2 succeeds: exclude_bibliography == true"
      - name: cross_region_comparison_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "Injecting a fragment against a source whose region differs from the submission's institution region (and is not a GLOBAL_SHARED repository source) fails with ERR_CROSS_REGION_COMPARISON — data residency gates the comparison corpus."
        test_recipe:
          setup: ["EU institution, ACTIVE integration, instructor, GRANTED EU student, assignment, submission; one ACTIVE INTERNET source in region US"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "XReg U", residency_region: "EU" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c17" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic17@x.edu", full_name: "P C17" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc17", email: "sc17@x.edu", full_name: "S C17", home_region: "EU" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "XReg", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "cross region body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "INTERNET", uri: "https://src/us1", region: "US" }, as: PlatformAdmin, captures: { src_us: $.data.id } }
          trigger:
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src_us}", matched_word_count: 3, match_category: "DIRECT_QUOTE", offset_start: 0 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CROSS_REGION_COMPARISON (422) — EU submission vs US INTERNET source without GLOBAL_SHARED repository scope"
            - "GET /integrity/submissions/${sub_id}/match-fragments returns [] (nothing persisted)"
      - name: inject_against_retracted_source_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=23]"]
        distinguishing_aspect: "A RETRACTED source cannot accept new fragments: ERR_SOURCE_RETRACTED."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, GRANTED student, assignment, submission; source retracted before injection"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Ret U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c18" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic18@x.edu", full_name: "P C18" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc18", email: "sc18@x.edu", full_name: "S C18", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Ret", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "retract source body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "PUBLICATION", uri: "https://src/ret", region: "US" }, as: PlatformAdmin, captures: { src1: $.data.id } }
            - { call: "POST /integrity/source-documents/${src1}/retract", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /integrity/_matches/inject", payload: { submission_id: "${sub_id}", source_document_id: "${src1}", matched_word_count: 4, match_category: "PARAPHRASE", offset_start: 0 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOURCE_RETRACTED (409)"
      - name: finalize_stale_report_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]"]
        distinguishing_aspect: "A STALE report cannot be finalized — ERR_REPORT_STALE; the instructor must regenerate (process) first, then finalize succeeds."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, GRANTED student, assignment; processed submission whose report went STALE via an exclusion-settings PATCH"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Stale U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c19" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic19@x.edu", full_name: "P C19" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc19", email: "sc19@x.edu", full_name: "S C19", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Stale", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "stale body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { rep_id: "$.data[0].id" } }
            - { call: "GET /integrity/assignments/${asg_id}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { asg_v: $.data.version } }
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v}", exclude_quotes: true }, as: Instructor, as_user_id: "${instr_id}" }
          trigger:
            - { call: "POST /integrity/similarity-reports/${rep_id}/finalize", payload: { instructor_interpretation: "NOT_MISCONDUCT" }, as: Instructor, as_user_id: "${instr_id}", captures: { err: $.data.error_id } }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "POST /integrity/similarity-reports/${rep_id}/finalize", payload: { instructor_interpretation: "NOT_MISCONDUCT" }, as: Instructor, as_user_id: "${instr_id}", captures: { fin_state: $.data.report_state } }
          assert:
            - "on STALE report: error_id == ERR_REPORT_STALE (409)"
            - "after process re-run (STALE -> DRAFT with refreshed snapshot): finalize succeeds, report_state == FINALIZED"
      - name: invalid_retention_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]"]
        distinguishing_aspect: "retention_start >= retention_end is rejected; a policy region different from the institution region is rejected with the same error."
        test_recipe:
          setup: ["US institution"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Win U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "US", applies_to: "BOTH", retention_start: "2026-06-01T00:00:00Z", retention_end: "2026-01-01T00:00:00Z" }, as: PlatformAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "EU", applies_to: "BOTH", retention_start: "2026-01-01T00:00:00Z", retention_end: "2026-06-01T00:00:00Z" }, as: PlatformAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "start >= end -> error_id == ERR_INVALID_RETENTION_WINDOW (422)"
            - "region EU on a US institution -> error_id == ERR_INVALID_RETENTION_WINDOW (422)"
            - "GET /integrity/institutions/${inst_id}/retention-policies returns []"
      - name: manual_student_repository_source_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]"]
        distinguishing_aspect: "STUDENT_REPOSITORY sources are system-created per deposit only; manual creation is a 400 ERR_VALIDATION."
        test_recipe:
          setup: ["US institution"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Man U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/institutions/${inst_id}/source-documents", payload: { source_type: "STUDENT_REPOSITORY", uri: "repo://x", region: "US" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (400)"
      - name: missing_required_field_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]"]
        distinguishing_aspect: "Missing required field (title) on assignment creation -> ERR_VALIDATION 400; envelope shape per §1.0."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Req U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c20" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic20@x.edu", full_name: "P C20" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (400) — title missing"
      - name: not_found_on_unknown_ids
        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "Non-existent UUID path ids produce ERR_NOT_FOUND 404, validated left-to-right."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "NF U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
          trigger:
            - { call: "GET /integrity/institutions/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

  # ===========================================================================
  # Section: endpoints — response envelope, pagination, computed reads.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape
        claim_type: envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, data; list responses carry limit/offset/total_count/has_more with defaults limit=10, offset=0."
        test_recipe:
          setup: ["US institution with two students"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Env U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "e1", email: "e1@x.edu", full_name: "E One", home_region: "US" }, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "e2", email: "e2@x.edu", full_name: "E Two", home_region: "US" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /integrity/institutions/${inst_id}/students", payload: {}, as: PlatformAdmin }
          assert:
            - "response_type == 'array'; meta.api_request_id present; total_count == 2, limit == 10, offset == 0, has_more == false"
      - name: clock_default_is_fixed_epoch
        claim_type: computed_read
        grounds: [endpoints."POST /integrity/_clock/set_current_utc"]
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z — never wall-clock time (run-time independence)."
        test_recipe:
          setup: ["empty database; no clock call made"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Clock U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "US", applies_to: "SUBMISSIONS", retention_start: "2027-01-01T00:00:00Z", retention_end: "2027-06-01T00:00:00Z" }, as: PlatformAdmin, captures: { pol_id: $.data.id } }
          trigger:
            - { call: "GET /integrity/institutions/${inst_id}/retention-policies", payload: {}, as: PlatformAdmin, captures: { pst: "$.data[0].policy_state" } }
          assert:
            - "policy_state == ACTIVE: the default clock (2026-09-01T00:00:00Z) precedes retention_end 2027-06-01, so no lazy expiry fired — regardless of the wall-clock date the test runs on"

  # ===========================================================================
  # Section: errors — coverage of error ids not exercised elsewhere.
  # ===========================================================================
  - section: errors
    instances:
      - name: error_catalog_coverage_stubs
        claim_type: violation_to_error
        grounds: [errors]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / assignment_creation_requires_integration_active; grade_entry_requires_similarity_report; priority_pair_validation_conflict / intake_closed_and_consent_missing_state_wins; content_invalid_and_bad_supersede_constraint_wins; resource_temporal_overlap / retention_policy_window_overlap_adjacency_allowed; purge_grace_closed_interval_conflict; compensating_invariant instances"
          rationale: "ERR_INTEGRATION_NOT_ACTIVE, ERR_GRADE_REQUIRES_REPORT, ERR_ASSIGNMENT_CLOSED, ERR_CONSENT_MISSING (STRICT dual-failure), ERR_CONTENT_INVALID, ERR_INVALID_SUPERSEDE_TARGET, ERR_RETENTION_WINDOW_OVERLAP, ERR_PURGE_GRACE_CONFLICT are asserted as failure paths of named §1.8 instances; ERR_RESIDENCY_VIOLATION, ERR_RESIDENCY_LOCKED, ERR_THRESHOLD_OUT_OF_RANGE, ERR_SUBMISSION_LIMIT_REACHED, ERR_STALE_VERSION, ERR_CROSS_REGION_COMPARISON, ERR_SOURCE_RETRACTED, ERR_REPORT_STALE, ERR_INVALID_RETENTION_WINDOW, ERR_INVALID_SUBMISSION_STATE, ERR_VALIDATION, ERR_NOT_FOUND, ERR_POLICY_EXPIRED are covered by corner instances above; ERR_UNAUTHENTICATED/ERR_FORBIDDEN are covered by the RBAC section below."

  # ===========================================================================
  # Section: rbac — role denials, ownership, student conditional visibility.
  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=1]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID are rejected with ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["US institution exists"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Auth U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
          trigger:
            - { call: "GET /integrity/institutions/${inst_id}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (401) — Anonymous is not a declared role; treated as missing/unknown role header"
      - name: instructor_cannot_patch_other_instructors_assignment
        claim_type: rbac_denial
        grounds: ["validations[priority=2]", roles.Instructor]
        distinguishing_aspect: "Ownership check: an Instructor whose id != assignment.instructor_id is denied with ERR_FORBIDDEN even though the role is allowed for PATCH."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructors A and B, assignment owned by A"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Own U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c21" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ia@x.edu", full_name: "Instr A" }, as: PlatformAdmin, captures: { instr_a: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ib@x.edu", full_name: "Instr B" }, as: PlatformAdmin, captures: { instr_b: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_a}", title: "Owned by A", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_a}", captures: { asg_id: $.data.id, asg_v: $.data.version } }
          trigger:
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v}", exclude_quotes: true }, as: Instructor, as_user_id: "${instr_b}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (403) — role permitted, ownership failed"
            - "assignment unchanged: exclude_quotes still false"
      - name: student_report_gated_by_visibility
        claim_type: conditional_validation
        grounds: [roles.Student, entities.Assignment.fields.report_visibility]
        distinguishing_aspect: "Student may read own similarity report only when assignment.report_visibility == RELEASED; HIDDEN yields ERR_FORBIDDEN — instructor-facing interpretation stays hidden until released."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, GRANTED student, processed submission; assignment visibility HIDDEN"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Vis U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c22" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic22@x.edu", full_name: "P C22" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc22", email: "sc22@x.edu", full_name: "S C22", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Vis", due_at: "2027-01-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id, asg_v: $.data.version } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "visibility body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
          trigger:
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Student, as_user_id: "${stu_id}", captures: { err: $.data.error_id } }
            - { call: "GET /integrity/assignments/${asg_id}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { asg_v2: $.data.version } }
            - { call: "PATCH /integrity/assignments/${asg_id}", payload: { expected_assignment_version: "${asg_v2}", report_visibility: "RELEASED" }, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/similarity-reports", payload: {}, as: Student, as_user_id: "${stu_id}", captures: { ok_state: "$.data[0].report_state" } }
          assert:
            - "HIDDEN: error_id == ERR_FORBIDDEN (403)"
            - "RELEASED: student read succeeds and returns exactly 1 report"
      - name: student_cannot_submit_for_other_student
        claim_type: rbac_denial
        grounds: [roles.Student, "validations[priority=2]"]
        distinguishing_aspect: "Intake ownership: payload student_id != X-User-ID -> ERR_FORBIDDEN before any consent check."
        test_recipe:
          setup: ["US institution, ACTIVE integration, instructor, assignment, GRANTED students A and B"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "OwnS U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c23" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic23@x.edu", full_name: "P C23" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "osa", email: "osa@x.edu", full_name: "S A", home_region: "US" }, as: PlatformAdmin, captures: { stu_a: $.data.id, stu_a_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_a}/consents", payload: { expected_student_version: "${stu_a_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_a}" }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "osb", email: "osb@x.edu", full_name: "S B", home_region: "US" }, as: PlatformAdmin, captures: { stu_b: $.data.id, stu_b_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_b}/consents", payload: { expected_student_version: "${stu_b_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_b}" }
