              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /va/calls/${call_id}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { h: $.data.handling_status }
          assert:
            - "Call.${call_id}.handling_status after answer == \"OVERFLOW\" (no ES-capable candidate; empty-pool fallback, no error)"
            - "Call.${call_id}.answered_by_receptionist_id is null"

      # ---- open dispute blocks period close
