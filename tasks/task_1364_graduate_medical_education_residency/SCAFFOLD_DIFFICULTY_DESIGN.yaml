            - "duty-hour-summary rolling_4wk_avg_projected == 80.75 (SUBMITTED 3.00h log included)"
            - "duty-hour-summary official_hours == 80.00 for week 2026-08-24"
            - "GET duty-hour-violations?resident_id returns total_count == 0 (no HOURS_80_AVG violation: official average 80.00 is not > 80.00)"
            - "MoonlightingRequest.${mr}.status == SUBMITTED (approval failed, no state change)"

      - name: complement_headcount_vs_funded_census_divergence
        grounds:
          - calculations.complement_fill
          - calculations.effective_funded_positions
          - state_machines.Resident.INCOMING_to_ACTIVE
          - errors[ERR_COMPLEMENT_EXCEEDED]
        distinguishing_aspect: |
          Fiscal/complement domain variant split: with one ACTIVE and one
          ON_LEAVE resident the headcount variant reads filled_headcount == 2
          (ON_LEAVE counts 1.0) while the funded-census variant reads
          filled_funded_census == 1.5 (ON_LEAVE counts 0.5) for the identical
          roster; the third activation is rejected by the headcount-variant
          complement cap even though the census-variant funding check still has
          headroom. Different entity domain (fiscal allocation) than the
          duty-hour variant instance.
        test_recipe:
          setup:
            - "Program with ACTIVE year and APPROVED complement: approved_positions 2, budget 100000000, stipend 6000000 (resident_year_stipend 5999994, effective_funded_positions 2)"
            - "Resident A ACTIVE, resident B ON_LEAVE (activated then placed on leave)"
            - "Resident C INCOMING"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Valley Surgery", specialty: "GENERAL_SURGERY", acgme_program_code: "440-00-0002" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "A One", email: "a@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resA: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${resA}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "B Two", email: "b@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resB: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${resB}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/residents/${resB}/place-on-leave", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "C Three", email: "c@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resC: "$.data.id" } }
          trigger:
            - { call: "GET /residency-programs/complement-approvals/${comp}", payload: {}, as: ProgramDirector, captures: { head: "$.data.filled_headcount", cens: "$.data.filled_funded_census" } }
            - { call: "POST /residency-programs/residents/${resC}/activate", payload: {}, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "ComplementApproval.${comp}.filled_headcount == 2 (headcount variant: ON_LEAVE counts 1)"
            - "ComplementApproval.${comp}.filled_funded_census == 1.5 (funded-census variant: ON_LEAVE counts 0.5)"
            - "C's activate is rejected with error_id ERR_COMPLEMENT_EXCEEDED (headcount gate: 2 + 1 > 2)"
            - "The funding gate would NOT have rejected (census 1.5 + 1.0 = 2.5 x 5999994 = 14999985 <= 100000000): the two variants gate differently on identical data"
            - "Resident.${resC}.lifecycle_status == INCOMING"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (three different modes: b, c, a)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: stipend_round_per_block_then_sum_order
        grounds:
          - calculations.resident_year_stipend
          - calculations.effective_funded_positions
          - state_machines.Resident.INCOMING_to_ACTIVE
          - errors[ERR_FUNDING_CAP_EXCEEDED]
        distinguishing_aspect: |
          Mode (b) nested rounding: resident_year_stipend_cents pins
          round-per-block-then-multiply — blended 6,500,007/13 = 500,000.538
          rounds to 500,001 per block, x13 = 6,500,013 (the reverse order would
          keep 6,500,007). With budget 13,000,020 the pinned order yields
          effective_funded_positions == 1 and rejects the second activation
          (2 x 6,500,013 = 13,000,026 > 13,000,020), while the unpinned order
          would yield floor(13,000,020 / 6,500,007) == 2 and accept it.
        test_recipe:
          setup:
            - "Program with ACTIVE year and APPROVED complement: approved_positions 4, annual_funding_budget_cents 13000020, blended_stipend_cents 6500007"
            - "Residents A and B INCOMING"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Peds GME", specialty: "PEDIATRICS", acgme_program_code: "320-00-0003" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 4, annual_funding_budget_cents: 13000020, blended_stipend_cents: 6500007 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "A One", email: "a@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resA: "$.data.id" } }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "B Two", email: "b@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resB: "$.data.id" } }
          trigger:
            - { call: "GET /residency-programs/complement-approvals/${comp}", payload: {}, as: ProgramDirector, captures: { eff: "$.data.effective_funded_positions", yc: "$.data.resident_year_stipend_cents" } }
            - { call: "POST /residency-programs/residents/${resA}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/residents/${resB}/activate", payload: {}, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "ComplementApproval.${comp}.resident_year_stipend_cents == 6500013 (round_half_up(6500007/13) = 500001 per block, x 13)"
            - "ComplementApproval.${comp}.effective_funded_positions == 1 (min(4, floor(13000020 / 6500013)))"
            - "A's activate succeeds (round_half_up(1.0 x 6500013) = 6500013 <= 13000020)"
            - "B's activate is rejected with error_id ERR_FUNDING_CAP_EXCEEDED (round_half_up(2.0 x 6500013) = 13000026 > 13000020)"
            - "Resident.${resA}.lifecycle_status == ACTIVE; Resident.${resB}.lifecycle_status == INCOMING"

      - name: moonlighting_headroom_candidate_evaluation_order
        grounds:
          - calculations.moonlighting_headroom_check
          - calculations.official_weekly_duty_hours
          - state_machines.MoonlightingRequest.SUBMITTED_to_APPROVED
          - errors[ERR_PROJECTED_HOURS_EXCEED_80]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          candidate request is EXCLUDED from the rolling projected base and added
          exactly once afterward. R1 (1.00 h/wk spanning two window weeks) passes
          at exactly 79.00 + 1.00 == 80.00; once R1 is APPROVED it feeds the base
          (316 + 2.00 attributed) / 4 = 79.50, so R2 (1.00 h/wk) computes
          79.50 + 1.00 = 80.50 > 80.00 and is rejected. An implementation that
          forgets R1's contribution, or double-counts the candidate, gets both
          outcomes wrong.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident R ACTIVE"
            - "16 ATTESTED 19.75h logs, 4 per ISO week over 2026-08-03..2026-08-28 (total 316.00h, rolling projected base 79.00)"
            - "Clock at 2026-08-28T12:00:00Z (window weeks Aug 3..Aug 30)"
            - "R1 SUBMITTED: [2026-08-17, 2026-09-01) 1.00 h/wk (overlaps the window weeks of Aug 17 and Aug 24 by 7 days each -> attributes 1.00 per week)"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "EM Residency", specialty: "EMERGENCY_MEDICINE", acgme_program_code: "110-00-0004" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 4, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-28T12:00:00Z" }, as: ProgramCoordinator }
