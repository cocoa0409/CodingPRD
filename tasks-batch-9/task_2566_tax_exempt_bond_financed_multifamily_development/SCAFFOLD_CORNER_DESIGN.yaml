            - "CapPool.${pool_id}.committed_cents == 250000000 and awardable_cents == 350000000, unaffected by the refusals"

      - name: higher_priority_error_wins_when_two_rules_are_violated_together
        claim_type: priority_conflict
        grounds:
          - validations[priority=70]
          - validations[priority=81]
          - validations[priority=100]
          - validations[priority=112]
        excluded_because:
          difficulty_instance: stale_cap_pool_version_outranks_the_already_awarded_allocation_state
          rationale: |
            All four priority-pair conflicts are already built in §1.8: OCC at
            priority 70 outranks the state check at 81 in the cited instance,
            state outranks the undrawn shortfall in
            refunding_a_funded_draw_reports_state_not_the_undrawn_shortfall, the
            period conflict at 100 outranks the shortfall at 112 in
            overlapping_and_overdrawn_draw_reports_the_period_conflict_not_the_shortfall,
            and role authorization outranks existence in
            wrong_role_on_a_missing_allocation_is_rejected_on_role_before_existence.
            A further pairing here would add no new ordering.

  - section: endpoints
    instances:
      - name: investor_create_then_read_round_trips_and_exposes_no_update_endpoint
        claim_type: standard_crud
        grounds:
          - endpoints[POST /investors]
          - endpoints[GET /investors/{id}]
          - endpoints[GET /investor-deliveries]
          - entities.Investor.fields.investor_type
          - entities.Investor.fields.total_credit_accepted_cents
          - roles.HfaAllocationOfficer
        distinguishing_aspect: |
          Investor is the one entity whose whole surface is create-plus-read: the
          catalogue declares POST /investors and GET /investors/{id} but no PATCH
          and no DELETE, and the only mutable thing about the row -
          total_credit_accepted_cents - is derived from deliveries rather than
          written. The read-back therefore has to show 0 accepted credit and
          version 1 on a brand-new investor, and the delivery list scoped to that
          investor has to come back empty rather than 404.
        test_recipe:
          setup:
            - "An empty system at the default logical clock; no investors registered."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /investors"
              payload: { name: "Cascade Credit Fund", tax_id: "91-2000002", investor_type: "SYNDICATOR" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { inv_id: $.data.id, inv_version: $.data.version }
            - call: "GET /investors/${inv_id}"
              payload: {}
              as: Investor
              as_user_id: "${inv_id}"
              captures: { read_name: $.data.name, read_type: $.data.investor_type, read_total: $.data.total_credit_accepted_cents }
            - call: "GET /investor-deliveries"
              payload: { investor_id: "${inv_id}" }
              as: Investor
              as_user_id: "${inv_id}"
          assert:
            - "the create returns HTTP 201 with a non-null id and captured inv_version == 1"
            - "the read returns HTTP 200 with captured read_name == 'Cascade Credit Fund', read_type == 'SYNDICATOR' and read_total == 0"
            - "Investor.${inv_id}.tax_id == '91-2000002' and created_at == updated_at == '2026-08-01T00:00:00Z' (the logical-clock default)"
            - "the delivery list returns HTTP 200 with data [] and total_count 0 and has_more false"
            - "the endpoint catalogue declares no PATCH or DELETE for /investors/{id}: the row is only mutated indirectly through deliveries"
            - "the sponsor created in setup is untouched: Developer.${dev_id}.active_project_count == 0"

      - name: project_read_after_issuance_exposes_the_provisional_ratio_and_the_status_filter
        claim_type: computed_read
        grounds:
          - endpoints[GET /projects/{id}]
          - endpoints[GET /projects]
          - calculations.fifty_percent_aggregate_basis_test
          - entities.Project.fields.provisional_fifty_percent_ratio_bps
          - entities.Project.fields.final_fifty_percent_ratio_bps
          - entities.Project.fields.automatic_credit_triggered
