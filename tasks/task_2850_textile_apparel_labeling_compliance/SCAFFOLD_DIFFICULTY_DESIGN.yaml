              as: LabelingApprover
              as_user_id: "user-appr-1"
              captures: { l1_ver: $.data.version }
            - call: "POST /labeling/label-specs/${l1_id}/hangtags"
              payload: { market_codes: ["US"], languages: ["en"], marketing_claims: [], fiber_content_text: "60.0% COTTON, 37.0% POLYESTER, 3.0% OTHER FIBER", origin_text: "Made in VN", expected_parent_label_spec_version: "${l1_ver}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "TRIM", country_code: "TR", value_added_usd: 0.40, weight_grams: 10.0, is_ornamentation: true }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { trim_depth: $.data.depth }
          assert:
            - "${trim_depth} == 0 (a TRIM node is always a root)"
            - "OriginDetermination.${od_id}.state == \"VOID\""
            - "Style.${style_id}.origin_state == \"ORIGIN_UNDETERMINED\""
            - "Style.${style_id}.substantiation_state == \"FIBER_SUBSTANTIATED\""
            - "LabelSpec.${l1_id}.state == \"WITHDRAWN\" and LabelSpec.${l1_id}.withdrawn_reason == \"AUTO_ORIGIN_VOIDED\""
            - "LabelSpec.${h1_id}.state == \"WITHDRAWN\" and LabelSpec.${h1_id}.withdrawn_reason == \"AUTO_PARENT_WITHDRAWN\""
            - "Style.${style_id}.label_readiness == \"BLOCKED\""
            - "A subsequent POST /labeling/label-specs/${l1_id}/withdraw returns ERR_LABEL_STATE_INVALID (422 is not used here; WITHDRAWN is terminal so the state gate at priority 45 answers 409)"

      - name: verifying_one_finding_cascades_finding_to_audit_rollup_to_brand_posture
        grounds:
          - endpoints[POST /labeling/audit-findings/{id}/verify]
          - calculations.audit_rollup
          - calculations.brand_posture
          - calculations.finding_severity
          - entities.Brand.fields.posture
          - entities.Brand.fields.critical_audit_finding_count
        distinguishing_aspect: |
          A verify on one finding walks three entity levels - AuditFinding REMEDIATED -> CLOSED, then the parent audit's critical_finding_count 3 -> 2 (the CLOSED finding leaves the {OPEN, REMEDIATED} filter), then the audited brand's posture RESTRICTED -> OPEN because the audit no longer meets the inclusive threshold of 3 - and the intermediate disposition call must NOT move the posture, because a REMEDIATED finding is still counted.
        test_recipe:
          setup:
            - "Brand Northline Apparel Co owns style S1."
            - "Audit A1 carries three CRITICAL findings: F1 FIBER_CONTENT_MISSTATED (100 units), F2 ORIGIN_MISSTATED (100 units) and F3 CARE_UNSUBSTANTIATED with 5000 units, which finding_severity escalates MAJOR -> CRITICAL."
            - "A1 is therefore IN_REVIEW with critical_finding_count 3, and the brand posture is RESTRICTED."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/compliance-audits"
              payload: { brand_id: "${brand_id}", scope: "STYLE_DOSSIER", audit_window_from: "2026-01-01T00:00:00Z", audit_window_to: "2026-12-31T00:00:00Z" }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { audit_id: $.data.id }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${style_id}", finding_code: "FIBER_CONTENT_MISSTATED", units_affected: 100 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f1_id: $.data.id }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${style_id}", finding_code: "ORIGIN_MISSTATED", units_affected: 100 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f2_id: $.data.id }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${style_id}", finding_code: "CARE_UNSUBSTANTIATED", units_affected: 5000 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f3_id: $.data.id, f3_severity: $.data.severity }
            - call: "GET /labeling/brands/${brand_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { posture_before: $.data.posture, crit_before: $.data.critical_audit_finding_count }
          trigger:
            - call: "POST /labeling/audit-findings/${f3_id}/disposition"
              payload: { units_relabeled: 0, units_destroyed: 5000, units_released: 0 }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
            - call: "GET /labeling/brands/${brand_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { posture_mid: $.data.posture, crit_mid: $.data.critical_audit_finding_count }
            - call: "POST /labeling/audit-findings/${f3_id}/verify"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f3_state_after: $.data.state }
            - call: "GET /labeling/brands/${brand_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { posture_after: $.data.posture, crit_after: $.data.critical_audit_finding_count }
          assert:
            - "${f3_severity} == \"CRITICAL\""
            - "${posture_before} == \"RESTRICTED\" and ${crit_before} == 3"
            - "${posture_mid} == \"RESTRICTED\" and ${crit_mid} == 3"
            - "${f3_state_after} == \"CLOSED\""
            - "${posture_after} == \"OPEN\" and ${crit_after} == 2"
            - "ComplianceAudit.${audit_id}.state == \"IN_REVIEW\" and ComplianceAudit.${audit_id}.open_finding_count == 2"
            - "ComplianceAudit.${audit_id}.critical_finding_count == 2"
            - "ComplianceAudit.${audit_id}.units_in_scope == 5200 (units_in_scope has no state filter, so verification cannot move it)"
            - "Brand.${brand_id}.outstanding_penalty_usd == 0.00 (the audit chain never touches the penalty ledger)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_answers_state_then_segregation_then_durability_in_priority_order
        grounds:
          - validations[priority=45]
          - validations[priority=50]
          - validations[priority=95]
          - errors.ERR_LABEL_STATE_INVALID
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_DURABILITY_INSUFFICIENT
        distinguishing_aspect: |
          One label violates three rules at once - it is still in DRAFT (priority 45), it would be approved by its own author (priority 50), and its durability rating 30 is below the required 32 (priority 95) - so the same approve call must answer ERR_LABEL_STATE_INVALID 409 first, then ERR_SEGREGATION_OF_DUTIES 403 once submitted, and only then ERR_DURABILITY_INSUFFICIENT 422 once a different approver acts; an implementation that evaluates business rules before the state or authorization gate returns 422 on the very first call.
        test_recipe:
          setup:
            - "Markets US (min_durability_cycles 20) and CA (min_durability_cycles 25) are registered."
            - "Brand Northline Apparel Co owns style S1, a KNIT_TOP (factor 1.25) targeting [US, CA], with fiber and care evidence PASSED and an ISSUED determination naming VN; legibility_cycles is 40, so the only deficient input is the label's own rating."
            - "Permanent label L1 is authored by user-spec-1 with durability_cycles_rating 30 and is left in DRAFT."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
