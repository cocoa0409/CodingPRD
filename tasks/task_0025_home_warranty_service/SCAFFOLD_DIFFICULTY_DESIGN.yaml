          assert:
            - "ClaimTicket.${c2}.is_return_visit == false (boundary: T = L + 30*86400 exactly; condition T < L + W*86400 is strict, so closed at upper end)"
            - "ClaimTicket.${c2}.service_fee_charged_cents == 7500 (SF NOT waived at the exact boundary)"

      - name: max_covered_items_boundary_exact_count
        grounds:
          - validations[priority=9]
          - errors[ERR_ITEM_LIMIT_EXCEEDED]
          - entities.ContractPackage.fields.max_covered_items
        distinguishing_aspect: |
          Boundary metric: count of CoveredItems on a Contract. Endpoint:
