          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {entry_ver: $.data.version}
        assert:
        - the create response carries MeetingEvent.${ev_id}.version == 1 and the GET returns the same 1
        - after lock-requirements MeetingEvent.${ev_id}.version == 2 and status == REQUIREMENTS_LOCKED
        - after the shortlist-entry creation MeetingEvent.${ev_id}.version == 3 (a child write that bumps the parent) and shortlisted_venue_count == 0
        - after the shortlist promotion MeetingEvent.${ev_id}.version == 4 and shortlisted_venue_count == 1
