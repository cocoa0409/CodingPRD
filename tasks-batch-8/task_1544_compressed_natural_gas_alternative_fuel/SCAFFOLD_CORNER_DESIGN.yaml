      - name: backup_draw_exact_capacity_then_exceeded
        claim_type: precision
        grounds: [calculations.backup_capacity_check, "errors[ERR_BACKUP_DRAW_EXCEEDED]", entities.BackupFuelingArrangement.fields.used_gge]
        distinguishing_aspect: "Draws 600 then 400 against committed_gge 1000 succeed (used == committed, equality allowed); a further 0.001 draw is rejected."
        test_recipe:
          setup: ["Station; ACTIVATED backup arrangement committed 1000 (availability spans default clock)"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Draw", station_code: "ST-DRAW", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/backup-arrangements", payload: { station_id: "${st_id}", partner_station_code: "ST-PD", available_from: "2026-07-01T00:00:00Z", available_until: "2026-09-01T00:00:00Z", committed_gge: 1000 }, as: StationManager, captures: { ba_id: $.data.id } }
            - { call: "POST /cng/backup-arrangements/${ba_id}/activate", payload: {}, as: StationManager }
          trigger:
            - { call: "POST /cng/backup-arrangements/${ba_id}/record-draw", payload: { gge_amount: 600.0 }, as: StationManager, captures: { u1: $.data.used_gge } }
            - { call: "POST /cng/backup-arrangements/${ba_id}/record-draw", payload: { gge_amount: 400.0 }, as: StationManager, captures: { u2: $.data.used_gge } }
            - { call: "POST /cng/backup-arrangements/${ba_id}/record-draw", payload: { gge_amount: 0.001 }, as: StationManager, captures: { err: $.data.error_id } }
          assert:
