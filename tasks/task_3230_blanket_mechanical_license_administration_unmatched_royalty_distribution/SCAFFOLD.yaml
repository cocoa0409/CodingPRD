    roles: [MLCAdministrator]
    code: 200
    input: [accepted_rate_schedule_version]
    output: UsageReport
    side_effects: ["status -> ACCEPTED", "payment_due_at stamped", "lines -> MATCHED (postings queued) or UNMATCHED (HELD accrual spawned)", "matched/unmatched split frozen", "audit_credits += 1", "increments ServiceProvider.version by 1"]

  - method: POST
    path: "/mlc/service-providers/{id}/usage-reports/{reportId}/reject"
