      - name: logging_a_completion_twice_on_a_single_count_obligation_is_rejected
        claim_type: idempotency
        grounds: ["state_machines.Obligation", "errors[ERR_OBLIGATION_NOT_PENDING]", "endpoints[POST /obligations/{id}/progress]"]
        distinguishing_aspect: "OPEN_STUDIO is provisioned with required_count 1, so a SINGLE LOG_COMPLETION drives PENDING -> SATISFIED; the second identical call is therefore a repeat of a trigger whose target state is terminal and must 409 rather than push completed_count to 2. The COMMUNITY_WORKSHOP row (required_count 2 for an 8-week session) proves the repeat is only rejected once the count is actually met."
        test_recipe:
          setup: ["A scheduled 8-week residency, which provisions four obligation rows: OPEN_STUDIO 1, EXHIBITION 1, ARTIST_TALK 1 and COMMUNITY_WORKSHOP floor(8/4) = 2."]
          setup_api_calls:
