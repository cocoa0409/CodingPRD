        distinguishing_aspect: "Activation must move the agreement to ACTIVE, bump version to 2, keep funding_posture OPEN (accepted_value_cents is still 0) and promote only the dependency-free milestone M1 to IN_DEVELOPMENT while the dependent M2 stays DEFINED."
