# =====================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Task 2732 — Airline Schedule Filing & Slot Compliance
#
# Section names and claim_type values are taken ONLY from
# references/claim-extraction-guide.md (nine sections; per-section rows).
# Every instance either carries a full test_recipe or an excluded_because
# stub naming a real instance of SCAFFOLD_DIFFICULTY_DESIGN.yaml.
#
# Fixture conventions are identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   users        usr-admin-1 (SystemAdmin), usr-coord-1 (SlotCoordinator),
#                usr-comp-1 (ComplianceOfficer), usr-file-1 (FilingAgent);
#                NetworkPlanner/PartnerCarrier act as their Carrier id.
#   clock        default 2026-08-01T00:00:00Z unless a call moves it.
#   season W26   2026-10-25 .. 2027-03-27, return deadline 2026-09-15,
#                filing change window close 2026-10-11.
#   stations     FRA LEVEL_3_COORDINATED gate_count 2 maintenance_capable true
#                MUC LEVEL_2_FACILITATED gate_count 3 maintenance_capable true
#                TXL LEVEL_2_FACILITATED gate_count 2 curfew 1380/330
#                LIS (PT) LEVEL_2_FACILITATED utc_offset 0 curfew 1380/330
# =====================================================================
scaffold_corner_design:

  # ===================================================================
  # SECTION 1 — entities  (§1.1, entity_topology: flat)
  # ===================================================================
  - section: entities
    instances:

      - name: carrier_creation_returns_declared_defaults_and_version_one
        claim_type: creation
        grounds:
          - entities.Carrier
          - endpoints.POST_carriers
        distinguishing_aspect: |
          POST /carriers with only the four input fields must return 201 with the system field status
          defaulted to ACTIVE, the computed field held_series_count at 0, is_home_carrier honoured as
          supplied, and the four common_fields present with version == 1. A response that omits
          held_series_count or starts version at 0 fails.
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { carrier_id: "$.data.id" }
          assert:
            - "HTTP 201; response_type == \"object\" and meta carries api_request_id and api_request_timestamp"
            - "Carrier.${carrier_id}.iata_code == \"HX\", icao_code == \"HXA\", country_code == \"DE\", is_home_carrier == true"
            - "Carrier.${carrier_id}.status == \"ACTIVE\" and held_series_count == 0"
            - "Carrier.${carrier_id}.version == 1 and created_at == updated_at"

      - name: station_retrieval_returns_the_stored_operating_configuration
        claim_type: retrieval
        grounds:
          - entities.Station
          - endpoints.GET_stations_station_id
        distinguishing_aspect: |
          GET /stations/{station_id} must echo every stored operating parameter, including the two
          curfew boundaries and the three connect/turn overrides. This is the read path the whole
          curfew and MCT surface depends on, so a station whose utc_offset_minutes or curfew fields are
          dropped on read makes every downstream compliance claim untestable.
        test_recipe:
          setup:
            - "One station TXL created with explicit non-default curfew and turn override values."
          setup_api_calls:
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, curfew_start_local_minutes: 1380, curfew_end_local_minutes: 330, min_connect_domestic_minutes: 40, min_connect_international_minutes: 75, min_turn_override_minutes: 50, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
          trigger:
            - call: "GET /stations/${txl_id}"
              payload: {}
              as: NetworkPlanner
              as_user_id: "usr-planner-any"
          assert:
            - "HTTP 200; Station.${txl_id}.iata_code == \"TXL\", coordination_level == \"LEVEL_2_FACILITATED\", utc_offset_minutes == 120, gate_count == 2"
            - "curfew_start_local_minutes == 1380 and curfew_end_local_minutes == 330"
            - "min_connect_domestic_minutes == 40, min_connect_international_minutes == 75, min_turn_override_minutes == 50, maintenance_capable == false"

      - name: flight_leg_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_flight_legs
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /flight-legs with limit 1 over a two-leg version must report total_count 2 and
          has_more true while returning exactly one row, and the same query at offset 1 must report
          has_more false. An implementation that reports total_count as the page size, or has_more from
          the page length alone, fails one of the two calls.
        test_recipe:
          setup:
            - "Home carrier HX, FRA and MUC stations, Season W26 OPEN, ScheduleVersion W26-P1 with exactly two FRA->MUC legs on 2026-11-02 and 2026-11-09, both DRAFT."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-P1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg1_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX102", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-09T08:00:00Z", arr_utc: "2026-11-09T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg2_id: "$.data.id" }
          trigger:
            - call: "GET /flight-legs"
              payload: { schedule_version_id: "${sv_id}", limit: 1, offset: 0 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "GET /flight-legs"
              payload: { schedule_version_id: "${sv_id}", limit: 1, offset: 1 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 -> HTTP 200 with response_type == \"array\", exactly 1 element in data, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "trigger call 2 -> exactly 1 element in data, total_count == 2, has_more == false, offset == 1"
            - "the two calls return different FlightLeg ids, together covering {${leg1_id}, ${leg2_id}}"

      - name: aircraft_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "errors.ERR_AIRCRAFT_NOT_FOUND"
          - endpoints.GET_aircraft_aircraft_id
        distinguishing_aspect: |
          A well-formed UUID that matches no Aircraft row must produce ERR_AIRCRAFT_NOT_FOUND with
          HTTP 404 and the error envelope shape, not 200 with a null body and not 500. The existence
          ladder sits at priority 9, above every business rule, so this must hold on an empty database.
        test_recipe:
          setup:
            - "Empty database; no Aircraft row exists."
          setup_api_calls: []
          trigger:
            - call: "GET /aircraft/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkPlanner
              as_user_id: "usr-planner-any"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_AIRCRAFT_NOT_FOUND\""
            - "data.message is a non-empty string and no Aircraft row is created"

      - name: season_creation_without_slot_return_deadline_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Season
          - "validations.priority_4_ERR_INVALID_REQUEST"
        distinguishing_aspect: |
          slot_return_deadline_utc is declared source input with no default, so omitting it must fail
          the priority 4 request-shape rule with ERR_INVALID_REQUEST (400) rather than defaulting the
          deadline to null and silently disabling the use-it-or-lose-it return window.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /seasons returns total_count == 0 — no partial Season row exists"

      - name: omitted_optional_inputs_apply_the_declared_entity_defaults
        claim_type: defaults
        grounds:
          - entities.Aircraft.fields.status
          - entities.ScheduleVersion.fields.filing_charge_budget_cents
          - entities.Station.fields.min_connect_domestic_minutes
        distinguishing_aspect: |
          Three defaults are asserted in one chain from three different entities: Station's
          min_connect_domestic_minutes 35 / min_connect_international_minutes 60 /
          min_turn_override_minutes 0 / maintenance_capable false, Aircraft's status IN_SERVICE and
          maintenance_check_required false, and ScheduleVersion's filing_charge_budget_cents 100000.
          Defaulting the aircraft to MAINTENANCE_GROUNDED or the budget to 0 would make every
          assignment or transmit in the suite fail for the wrong reason.
        test_recipe:
          setup:
            - "Home carrier HX and Season W26 OPEN exist; every optional input is omitted from the station, aircraft and schedule-version calls."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
          trigger:
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3 }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXD", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { ac_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-D1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
          assert:
            - "Station.${muc_id}.min_connect_domestic_minutes == 35, min_connect_international_minutes == 60, min_turn_override_minutes == 0, maintenance_capable == false, curfew_start_local_minutes == null, curfew_end_local_minutes == null"
            - "Aircraft.${ac_id}.status == \"IN_SERVICE\", maintenance_check_required == false, assigned_leg_count == 0, maintenance_opportunity_minutes == 0, cumulative_ground_minutes == 0, rotation_feasibility_status == \"UNCHECKED\""
            - "ScheduleVersion.${sv_id}.filing_charge_budget_cents == 100000, filing_status == \"DRAFT\", compliance_state == \"CLEAN\", filing_charge_accrued_cents == 0, leg_count == 0, schedule_compliance_score == 100.00"
            - "ScheduleVersion.${sv_id}.supersedes_version_id == null and validated_by_user_id == null"

      - name: flight_leg_block_minutes_and_is_international_computed_with_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.FlightLeg.fields.block_minutes
          - entities.FlightLeg.fields.is_international
          - calculations.mct_shortfall_minutes
        distinguishing_aspect: |
          block_minutes and is_international are source computed: block_minutes must equal the whole
          minutes between dep_utc and arr_utc (150 for 09:30Z -> 12:00Z) and is_international must be
          derived from the two stations' country_code inequality (DE vs PT -> true), regardless of any
          client-supplied value for those keys, which must be ignored rather than stored or rejected.
        test_recipe:
          setup:
            - "Home carrier HX; MUC (DE) and LIS (PT) stations; RouteAuthority DE->PT ACTIVE with weekly_frequency_cap 14; Season W26 OPEN; ScheduleVersion W26-C1 in DRAFT."
            - "LIS has no curfew configured in this fixture, so the 12:00Z arrival is unconstrained."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "LIS", country_code: "PT", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 0, gate_count: 2, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { lis_id: "$.data.id" }
            - call: "POST /route-authorities"
              payload: { carrier_id: "${home_carrier_id}", origin_country_code: "DE", dest_country_code: "PT", freedom_type: "THIRD_FOURTH", weekly_frequency_cap: 14, granted_from_utc: "2026-01-01T00:00:00Z", granted_until_utc: "2027-12-31T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { ra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-C1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX440", origin_station_id: "${muc_id}", dest_station_id: "${lis_id}", dep_utc: "2026-11-03T09:30:00Z", arr_utc: "2026-11-03T12:00:00Z", fleet_type_code: "A320", block_minutes: 999, is_international: false, mct_shortfall_minutes: 42 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg_id: "$.data.id" }
          assert:
            - "HTTP 201; FlightLeg.${leg_id}.block_minutes == 150 (not 999) and is_international == true (not false)"
            - "FlightLeg.${leg_id}.mct_shortfall_minutes == 0 (not 42) and connect_minutes == null because connects_from_leg_id was not supplied"
            - "FlightLeg.${leg_id}.status == \"DRAFT\", assigned_aircraft_id == null, departure_slot_holding_id == null, arrival_slot_holding_id == null, open_obligation_count == 0"
            - "ScheduleVersion.${sv_id}.leg_count == 1 and unslotted_leg_count == 1"

      - name: carrier_status_and_identity_are_server_minted_with_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Carrier.fields.status
          - entities.Carrier.common_fields
        distinguishing_aspect: |
          id, created_at, updated_at, version and the system field status are all server-minted. A
          create request that supplies id, version and status must still receive a fresh server UUID,
          version 1 and status ACTIVE. An implementation that honours a client-supplied status can be
          driven straight into SUSPENDED and bypass the whole suspension cascade.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { iata_code: "PT", icao_code: "PTA", country_code: "PT", is_home_carrier: false, id: "11111111-1111-4111-8111-111111111111", version: 77, status: "SUSPENDED", held_series_count: 9 }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { carrier_id: "$.data.id" }
          assert:
            - "HTTP 201; Carrier.${carrier_id}.status == \"ACTIVE\" (not SUSPENDED) and held_series_count == 0 (not 9)"
            - "the returned id is a server-minted UUID and is NOT \"11111111-1111-4111-8111-111111111111\""
            - "Carrier.${carrier_id}.version == 1 (not 77) and created_at is a server timestamp"

      - name: station_coordination_level_outside_the_enum_returns_invalid_enum_request
        claim_type: type_constraints
        grounds:
          - entities.Station.fields.coordination_level
          - "validations.priority_4_ERR_INVALID_REQUEST"
        distinguishing_aspect: |
          coordination_level is constrained to the three IATA levels. A value such as
          "LEVEL_4_SUPERCOORDINATED" must be rejected at priority 4 with ERR_INVALID_REQUEST (400)
          before any business rule runs, because slot existence (priority 57) is keyed on this enum and
          an unknown level would silently disable the slot regime at that station.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /stations"
              payload: { iata_code: "ZZZ", country_code: "DE", coordination_level: "LEVEL_4_SUPERCOORDINATED", utc_offset_minutes: 120, gate_count: 2 }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /stations returns total_count == 0"

      - name: slot_holding_days_of_week_with_repeated_digit_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.SlotHolding.fields.days_of_week
          - "validations.priority_4_ERR_INVALID_REQUEST"
        distinguishing_aspect: |
          days_of_week must be a non-empty string of DISTINCT digits 1-7. "11" would inflate
          planned_operations to 2 per week for a single weekday and quietly corrupt every utilisation
          percentage, so it must be rejected at priority 4 rather than normalised.
        test_recipe:
          setup:
            - "Home carrier HX, FRA LEVEL_3_COORDINATED, Season W26 OPEN."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
          trigger:
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "11", series_weeks: 5 }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /slot-holdings?station_id=${fra_id} returns total_count == 0 and Season.${season_id}.held_series_count == 0"

      - name: slot_utilization_record_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.SlotUtilizationRecord
          - endpoints.POST_slot_utilization_records
        distinguishing_aspect: |
          SlotUtilizationRecord is declared common_fields false, so it carries only id and created_at:
          no version, no updated_at, and §1.5 exposes no PATCH or delete for it. The operating history
          that use-it-or-lose-it decisions rest on is therefore append-only, and the same
          (holding, date) can only be corrected by adding a further record, never by editing one.
        test_recipe:
          setup:
            - "Home carrier HX, FRA LEVEL_3_COORDINATED, Season W26 OPEN, one FRA DEPARTURE holding at 2026-11-02T08:00:00Z days_of_week \"1\" series_weeks 5."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
