              captures: { bids_listed: $.data }
          assert:
            - "the 201 body already carries every derived field: offered_joint_strength_kn 58.0 (no rollover reinforcement offered, so no joint bonus), nominal_range_mi 147 and derated_route_range_mi 73.0 on MOUNTAIN terrain"
            - "spec_compliance_status is NONCONFORMING in the same 201 body, with unmet_mandatory_items naming all four mandatory shortfalls: emergency exits 6 < 7, missing rollover protection, joint strength 58.0 < 62.0 and route range 73.0 < 120.0"
            - "exception_count is 0 even so — every exceptable item (seats 78 >= 78, CROSSVIEW_HEATED mirrors, belts, eight-lamp system, crossing arm) is satisfied, so a nonconforming bid is not automatically an exception-carrying bid"
            - "the GET by a different role returns identical values for all seven fields and version is still 1"
            - "the list read returns the same single bid with the same computed fields — there is no lag window in which a derived field is null or stale"

      - name: transition_side_effects_are_visible_to_the_immediately_following_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /build-slots/{id}/commit]
          - calculations.line_capacity_ledger
          - state_machines.BusUnit
        distinguishing_aspect: |
          A single commit writes to three different aggregates — the slot, the bus unit and the production
          line — plus the owning order's posture, and every one of them is readable in the very next request
          with no refresh, retry or reconciliation step. The action's own response body and the subsequent
          per-entity reads agree exactly, which is the observable difference between this immediate model and
          an eventual one where committed_slot_days would lag.
        test_recipe:
          setup:
            - "TX 1-unit order with one minted unit and line L-A1 (capacity 30) at version 1"
            - "Clock at 2026-09-01T00:00:00Z; promised_delivery_date 2026-12-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "DSL-100", compatible_bus_model_id: "${model_c_id}", propulsion_type: "DIESEL", option_price_cents: 1250000, cold_weather_derate_pct: 0.03, reserve_floor_pct: 0.05, fuel_capacity_gal: 100.0, rated_mpg: 7.2 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_dsl_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "TX", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 400.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW", terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /state-spec-profiles/${tx_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-TX-127", buyer_type: "DISTRICT", buyer_name: "Plano ISD", spec_profile_id: "${tx_id}", unit_count: 1, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 40000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_id: $.data.id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_id: $.data.id }
            - call: "POST /bids/${bid_id}/submit"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
            - call: "POST /solicitations/${sol_id}/close"
              payload: {}
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /bids/${bid_id}/award"
              payload: { promised_delivery_date: "2026-12-01" }
              as: ContractsAdmin
              as_user_id: "contracts-02"
              captures: { order_id: $.data.id }
            - call: "POST /contract-orders/${order_id}/units"
              payload: { vin: "1TXDSL0000001201" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { unit_id: $.data.id }
            - call: "POST /production-lines"
              payload: { line_code: "L-A1", plant_code: "PLANT-A", supported_body_classes: ["TYPE_C", "TYPE_D"], horizon_slot_day_capacity: 30, changeover_buffer_days: 3 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { line_id: $.data.id, line_v1: $.data.version }
            - call: "POST /build-slots"
              payload: { expected_production_line_version: "${line_v1}", production_line_id: "${line_id}", bus_unit_id: "${unit_id}", start_date: "2026-09-07", end_date: "2026-09-14" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { slot_id: $.data.id, slot_days: $.data.slot_days }
          trigger:
            - call: "POST /build-slots/${slot_id}/commit"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { commit_status: $.data.status, commit_days: $.data.slot_days }
            - call: "GET /bus-units/${unit_id}"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { unit_phase: $.data.production_status, unit_cert: $.data.certification_status }
            - call: "GET /production-lines/${line_id}"
              payload: {}
              as: QualityInspector
              as_user_id: "qc-01"
              captures: { line_days: $.data.committed_slot_days, line_version: $.data.version, line_status: $.data.status }
            - call: "GET /contract-orders/${order_id}"
              payload: {}
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { order_at_risk: $.data.at_risk_unit_count, order_posture: $.data.delivery_posture }
            - call: "GET /build-slots"
              payload: { production_line_id: "${line_id}", status: "COMMITTED" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { committed_slots: $.data }
          assert:
            - "the commit response itself returns status COMMITTED with slot_days 7"
            - "the immediately following unit read shows production_status SLOTTED with certification_status still PENDING — the parallel dimension is untouched"
            - "the line read, performed by a different role, already shows committed_slot_days 7 and an incremented version — no eventual-consistency lag"
            - "the order read shows at_risk_unit_count 0 (the unit is no longer PLANNED) and delivery_posture ON_TRACK, recomputed during the commit rather than on a later sweep"
            - "the filtered slot list returns exactly the one COMMITTED slot with total_count 1"
