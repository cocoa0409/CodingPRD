              as: FacilityPlanner
            - call: "POST /dough-ops/cafe-orders"
              payload: { cafe_id: "${c1_id}", dough_type_id: "${cxl_id}", production_date: "2026-09-11", quantity: 180, expected_cafe_version: "${c1_v}" }
