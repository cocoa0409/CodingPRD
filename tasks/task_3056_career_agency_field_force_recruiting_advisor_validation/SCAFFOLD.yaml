    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: OrphanPolicyAssignment
    side_effects: ["status → ASSIGNED with the selected advisor, or REJECTED with NO_ELIGIBLE_ADVISOR when the pool is empty", "policy.writing_advisor_id updated and policy.orphaned cleared on success", "receiving advisor's team production and sponsors' overrides recomputed"]
  - method: POST
    path: "/agency/orphan-policy-assignments/{id}/reopen"
    description: "Return a rejected orphan assignment to pending for retry"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: OrphanPolicyAssignment
    side_effects: ["status → PENDING", "rejection_reason cleared"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role is absent, blank, or names an unknown role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "The acting role does not hold this operation" }

  # --- Not Found ---
  - { id: ERR_DISTRICT_OFFICE_NOT_FOUND, http: 404, condition: "No DistrictOffice exists with the supplied id" }
  - { id: ERR_ADVISOR_NOT_FOUND, http: 404, condition: "No Advisor exists with the supplied id" }
  - { id: ERR_CANDIDATE_NOT_FOUND, http: 404, condition: "No RecruitingCandidate exists with the supplied id" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "No SelectionAssessment exists with the supplied id" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "No EmploymentContract exists with the supplied id" }
  - { id: ERR_VALIDATION_PERIOD_NOT_FOUND, http: 404, condition: "No ValidationPeriod exists with the supplied id" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "No ProductLicense exists with the supplied id" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "No SecuritiesRegistration exists with the supplied id" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "No CarrierAppointment exists with the supplied id" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "No Policy exists with the supplied id" }
  - { id: ERR_JOINT_CASE_NOT_FOUND, http: 404, condition: "No JointWorkCase exists with the supplied id" }
  - { id: ERR_CREDIT_NOT_FOUND, http: 404, condition: "No CommissionCredit exists with the supplied id" }
  - { id: ERR_PERSISTENCY_NOT_FOUND, http: 404, condition: "No PersistencyRecord exists with the supplied id" }
  - { id: ERR_ORPHAN_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No OrphanPolicyAssignment exists with the supplied id" }

  # --- Generic validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required body field is missing, a field value is the wrong type, or an enum member is out of range" }

  # --- State machine ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is in a state from which the requested transition is not declared" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "The target resource is in a terminal state and admits no further transition" }
  - { id: ERR_CAMPUS_NAME_REQUIRED, http: 400, condition: "A CAMPUS-source candidate is screened without campus_name" }
  - { id: ERR_ASSESSMENT_NOT_PASSED, http: 409, condition: "advance-to-interview is attempted while the candidate's latest SCORED assessment has outcome FAIL" }
  - { id: ERR_ASSESSMENT_INCOMPLETE_SCORES, http: 400, condition: "competency_scores does not carry exactly the four keys MARKET_KNOWLEDGE, RELATIONSHIP, RESILIENCE, ETHICS" }
  - { id: ERR_NO_OPEN_VALIDATION_WINDOW, http: 409, condition: "evaluate is called on a contract with no OPEN ValidationPeriod" }
  - { id: ERR_EXTENSION_LIMIT_REACHED, http: 409, condition: "extend is attempted on a window whose extension_count has reached MAX_EXTENSIONS" }
  - { id: ERR_OFFICE_HAS_LIVE_ADVISORS, http: 409, condition: "A district office is closed while advisors with live contract_status remain assigned to it" }

  # --- Licensing / compliance (business_safety) ---
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "The referenced ProductLicense is not ACTIVE, or the logical clock has reached its expires_at" }
  - { id: ERR_REGISTRATION_NOT_ACTIVE, http: 409, condition: "The advisor's securities registration is not ACTIVE for a product line that requires one" }
  - { id: ERR_APPOINTMENT_NOT_APPROVED, http: 409, condition: "The advisor holds no APPROVED carrier appointment for the product line being written" }
  - { id: ERR_PREREQUISITE_REGISTRATION_NOT_ACTIVE, http: 409, condition: "A registration with a prerequisite_registration_id is activated before that prerequisite is ACTIVE" }
  - { id: ERR_TERMINATED_ADVISOR, http: 409, condition: "A business-writing or licensing operation targets an advisor whose contract_status is TERMINATED" }
  - { id: ERR_LICENSE_INTERVAL_OVERLAP, http: 409, condition: "A new ProductLicense half-open interval overlaps an existing one for the same advisor and product_line" }
  - { id: ERR_REGISTRATION_INTERVAL_OVERLAP, http: 409, condition: "A new SecuritiesRegistration CLOSED [effective_date, expires_at] interval shares any instant, including a single boundary instant, with an existing one for the same advisor and registration_type" }
  - { id: ERR_PERSISTENCY_WINDOW_OVERLAP, http: 409, condition: "A PersistencyRecord CLOSED [measurement_start, measurement_end] window shares any instant, including a single boundary instant, with another measurement window of the same advisor" }

  # --- Posture / allocation (business_constraint) ---
  - { id: ERR_VALIDATION_POSTURE_BLOCKS_PAYOUT, http: 409, condition: "Commission payout is attempted while the advisor's validation_posture is AT_RISK or FAILED_POSTURE" }
  - { id: ERR_JOINT_WORK_POSTURE_INELIGIBLE, http: 409, condition: "A joint work case is submitted while either advisor's validation_posture is AT_RISK or FAILED_POSTURE" }
  - { id: ERR_SPLIT_PCT_INVALID, http: 400, condition: "split_pct_lead is not strictly greater than 0 and less than or equal to 1" }
  - { id: ERR_SELF_JOINT_CASE, http: 400, condition: "lead_advisor_id equals support_advisor_id on a joint work case" }
  - { id: ERR_JOINT_CASE_OPEN_EXISTS, http: 409, condition: "A second JointWorkCase is opened or submitted for a policy that already has one in status OPEN or SUBMITTED" }
  - { id: ERR_SPONSORING_CYCLE_DETECTED, http: 409, condition: "Assigning sponsoring_advisor_id would make the advisor's sponsoring chain reach itself" }
  - { id: ERR_NO_ELIGIBLE_ADVISOR, http: 422, condition: "The orphan reassignment selector resolves an empty eligible pool" }

  # --- Fiscal ---
  - { id: ERR_ALLOWANCE_CAP_EXCEEDED, http: 402, condition: "The computed training allowance draw would push training_allowance_paid_cents beyond training_allowance_total_cents" }
  - { id: ERR_CHARGEBACK_BALANCE_BLOCKS_NEW_BUSINESS, http: 402, condition: "A new policy or joint case is written while the advisor's chargeback_balance_cents exceeds CHARGEBACK_BLOCK_CENTS" }
  - { id: ERR_RECOVERY_EXCEEDS_ASSESSED, http: 400, condition: "A chargeback recovery amount exceeds chargeback_assessed_cents minus recovered_cents" }

  # --- Referential / temporal ---
  - { id: ERR_DUPLICATE_NATURAL_KEY, http: 409, condition: "A uniqueness constraint on a natural key (policy_number, advisor email, office_code, crd_number, license_number) is violated" }
  - { id: ERR_VALIDATION_WINDOW_INVALID, http: 409, condition: "A validation window has start_date not strictly before end_date, or falls outside the contract's live span" }
  - { id: ERR_VALIDATION_WINDOW_OVERLAP, http: 409, condition: "A ValidationPeriod half-open [start_date, end_date) window touches or overlaps an existing OPEN or EXTENDED window of the same contract" }
  - { id: ERR_PERSISTENCY_WINDOW_OVERLAP, http: 409, condition: "A PersistencyRecord CLOSED [measurement_start, measurement_end] window shares any instant, including a single boundary instant, with another measurement window of the same advisor" }
  - { id: ERR_REINSTATEMENT_WINDOW_CLOSED, http: 409, condition: "Reinstatement is attempted more than REINSTATEMENT_WINDOW_DAYS after the lapse date" }

  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "The expected_<parent>_version supplied by the client no longer matches the parent's current version" }

  # --- Pagination ---
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit is outside [1, 100] or offset is negative" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Home-office operator who drives the logical clock; holds no business operations beyond clock control"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations: []

  - name: ManagingDirector
    description: "Top of the field hierarchy; contracts, validates, terminates and controls money movement"
    identity: entity_backed:Advisor
    exclusive_operations:
      - "POST /employment-contracts — contract a candidate"
      - "POST /validation-periods — open a validation window"
      - "POST /validation-periods/{id}/evaluate — evaluate a window"
      - "POST /validation-periods/{id}/extend — extend a window"
      - "POST /training-allowance-draws — draw a training allowance instalment"
      - "POST /advisors/{id}/terminate — terminate an advisor"
      - "POST /district-offices — create a district office"
      - "POST /district-offices/{id}/suspend, /reactivate, /close"
      - "POST /policies — write a policy"
      - "POST /policies/{id}/activate, /lapse, /reinstate, /surrender, /terminate"
      - "POST /commission-credits/{id}/pay, /void, /recover"
      - "POST /persistency-records, /{id}/resolve-dispute, /{id}/finalize"
      - "POST /joint-work-cases/{id}/close"
      - "POST /orphan-policy-assignments/{id}/assign, /{id}/reopen"
    shared_operations:
      - "POST /joint-work-cases/{id}/void — shared with FinancialRep"

  - name: DistrictDirector
    description: "Mid-level field leader; recruits, offers, remediates at-risk advisors and reads the whole office"
    identity: entity_backed:Advisor
    exclusive_operations:
      - "POST /recruiting-candidates/{id}/extend-offer — extend an offer"
      - "POST /recruiting-candidates/{id}/reject — reject a candidate"
      - "POST /advisors/{id}/remediate — remediate an at-risk advisor"
    shared_operations:
      - "GET reads on office, advisors, candidates, policies and credits"

  - name: FinancialRep
    description: "Producing representative; opens and submits joint work cases and disputes persistency measurements"
    identity: entity_backed:Advisor
    exclusive_operations:
      - "POST /joint-work-cases — open a joint work case"
      - "POST /joint-work-cases/{id}/submit — submit a joint work case"
      - "POST /joint-work-cases/{id}/reopen — reopen a voided joint case"
      - "POST /persistency-records/{id}/dispute — dispute a measurement"
    shared_operations:
      - "POST /joint-work-cases/{id}/void — shared with ManagingDirector"
      - "GET reads on own advisor, policies, credits and joint cases"

  - name: RecruitingOfficer
    description: "Recruiting operations specialist who drives the pipeline stages and the assessment scoring"
    identity: opaque
    exclusive_operations:
      - "POST /recruiting-candidates — create a pipeline entry"
      - "POST /recruiting-candidates/{id}/screen"
      - "POST /recruiting-candidates/{id}/schedule-assessment"
      - "POST /recruiting-candidates/{id}/advance-to-interview"
      - "POST /recruiting-candidates/{id}/accept-offer, /decline-offer, /reengage"
      - "POST /selection-assessments/{id}/score, /supersede, /invalidate"
    shared_operations: []

  - name: LicensingCoordinator
    description: "Licensing and appointments specialist who sequences insurance, securities and carrier registrations"
    identity: opaque
    exclusive_operations:
      - "POST /product-licenses, /{id}/activate, /{id}/renew"
      - "POST /securities-registrations, /{id}/activate"
      - "POST /carrier-appointments, /{id}/approve, /{id}/reject"
    shared_operations: []

  - name: Any
    description: "Read-only surface shared across every authenticated role"
    identity: opaque
    shared_operations:
      - "Every GET endpoint in §1.5 (every GET endpoint lists Any in its roles)"
    note: "Any is the read-only projection of every authenticated role, so a test may read as Any regardless of which role it used to drive the writes. It carries no write operation."