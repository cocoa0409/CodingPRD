      - name: corner_val_coverage_window_must_be_ordered_and_inside_the_reporting_year
        claim_type: Violation -> Error
        grounds:
          - validations[priority=23]
          - errors[ERR_INVALID_COVERAGE_WINDOW]
          - endpoints[POST /ir/reporting-cycles/{cycle_id}/frozen-files]
        distinguishing_aspect: |
          One error id covers two independent defects: an inverted window (start after end) and a
          well-ordered window that falls outside the collection_year's reporting span
          [2026-07-01, 2027-06-30]. Neither attempt touches ReportingCycle.version, so the
          following well-formed registration still succeeds with the original expected version.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 (collection_year 2027) is OPEN at version 1 with no extracts."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
          trigger:
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-10-15", coverage_end_date: "2026-09-01", checksum: "c1d2e3f4a5b60151", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { err1: $.data.error_id }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-06-01", coverage_end_date: "2026-08-01", checksum: "c1d2e3f4a5b60152", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { err2: $.data.error_id }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60153", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
          assert:
            - "First call: HTTP status == 422 and response.error_id == \"ERR_INVALID_COVERAGE_WINDOW\" (start after end)"
            - "Second call: HTTP status == 422 and response.error_id == \"ERR_INVALID_COVERAGE_WINDOW\" (2026-06-01 precedes the reporting year floor 2026-07-01)"
            - "ReportingCycle.${cyc}.version == 1, frozen_file_count == 0, active_record_count == 0 after both refusals"
            - "Third call: HTTP status == 201, FrozenFile.${ff1}.status == ACTIVE, ReportingCycle.${cyc}.version == 2 and frozen_file_count == 1"

      - name: corner_val_publication_effective_window_must_be_strictly_positive
        claim_type: Violation -> Error
        grounds:
          - validations[priority=24]
          - errors[ERR_INVALID_EFFECTIVE_WINDOW]
          - entities.DashboardPublication.fields.effective_to
        distinguishing_aspect: |
          Because the window is HALF-OPEN, effective_to equal to effective_from would publish
          nothing at all, so equality is rejected while any later instant is accepted — the
          opposite of the CLOSED coverage windows on FrozenFile, where a shared boundary is an
          overlap.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is FROZEN with a CERTIFIED ENROLLMENT component."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60154", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the enrollment component as reported to the federal collection." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/reporting-cycles/${cyc}/freeze"
              payload: {}
              as: IRDirector
          trigger:
            - call: "POST /ir/publications"
              payload: { component_id: "${comp}", metric_key: "TOTAL_HEADCOUNT_FALL", published_value: 1000.0, effective_from: "2026-11-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
            - call: "POST /ir/publications"
              payload: { component_id: "${comp}", metric_key: "TOTAL_HEADCOUNT_FALL", published_value: 1000.0, effective_from: "2026-11-01T00:00:00Z", effective_to: "2026-11-02T00:00:00Z" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id }
          assert:
            - "First call: HTTP status == 422 and response.error_id == \"ERR_INVALID_EFFECTIVE_WINDOW\""
            - "GET /ir/publications?component_id=${comp} -> total_count == 0 after the refusal"
            - "Second call: HTTP status == 201, DashboardPublication.${pub}.effective_to == \"2026-11-02T00:00:00Z\", publication_status == PUBLISHED, original_value == 1000.0, version == 1"

      - name: corner_val_priority_six_outranks_priority_twenty_seven
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: frozen_cycle_state_error_outranks_duplicate_metric_key_conflict
          rationale: |
            That §1.8 instance is precisely the Priority-conflict pattern for this pair: one call
            violates the frozen-posture guard (priority 6) and the duplicate (component_id,
            metric_key) uniqueness rule (priority 27) at once and must return ERR_CYCLE_FROZEN.

      - name: corner_val_priority_thirteen_outranks_priority_twenty_two
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: segregation_of_duties_outranks_collection_deadline_passed_on_certify
          rationale: |
            The other cross-category priority conflict on certify - same user preparing and
            certifying (priority 13) while the collection deadline has also passed (priority 22) -
            is the whole subject of that §1.8 instance.

      - name: corner_val_closed_coverage_windows_reject_a_shared_boundary
        claim_type: Violation -> Error
        excluded_because:
          difficulty_instance: frozen_file_closed_coverage_windows_reject_shared_end_date
          rationale: |
            The priority-25 ERR_COVERAGE_WINDOW_OVERLAP claim, including the CLOSED-interval
            boundary case where one window's end equals the next window's start, is exactly that
            §1.8 instance's contrast pair.

      - name: corner_val_publication_windows_reject_a_true_overlap
        claim_type: Violation -> Error
        excluded_because:
          difficulty_instance: publication_half_open_windows_allow_shared_boundary_instant
          rationale: |
            The priority-26 ERR_PUBLICATION_WINDOW_OVERLAP claim is covered there together with its
            HALF-OPEN counterexample: a shared boundary instant is accepted while a genuinely
            straddling window is refused.

  - section: endpoints
    instances:
      - name: corner_ep_clock_endpoint_is_authoritative_and_not_monotonic
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.ReportingCycle.fields.created_at
          - entities.FrozenFile.fields.snapshot_taken_at
        distinguishing_aspect: |
          The logical clock is the only time source and it may be moved backwards: after stamping a
          cycle at 2026-12-15T08:30:00Z the clock is reset to 2026-11-01T00:00:00Z and the extract
          registered afterwards carries the EARLIER snapshot_taken_at, proving nothing derives
          timestamps from wall time.
        test_recipe:
          setup:
            - "Empty database; the logical clock starts at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T08:30:00Z" }
              as: DisclosureOfficer
              captures: { t1: $.data.current_utc }
          trigger:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: IRAnalyst
              captures: { t2: $.data.current_utc }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60155", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
          assert:
            - "The clock call is shared by all five roles: HTTP status == 200 with data.current_utc == \"2026-12-15T08:30:00.000Z\" for the DisclosureOfficer call"
            - "ReportingCycle.${cyc}.created_at == \"2026-12-15T08:30:00.000Z\" and updated_at == \"2026-12-15T08:30:00.000Z\""
            - "Second clock call: data.current_utc == \"2026-11-01T00:00:00.000Z\" (the clock moved backwards and the call still returns 200)"
            - "FrozenFile.${ff1}.snapshot_taken_at == \"2026-11-01T00:00:00.000Z\", i.e. strictly earlier than its parent cycle's created_at"

      - name: corner_ep_rate_summary_is_a_computed_read_that_matches_the_stored_variants
        claim_type: Computed read
        grounds:
          - endpoints[GET /ir/cohorts/{cohort_id}/rate-summary]
          - calculations.cohort_rate_variants
          - entities.CohortDefinition.fields.federal_rate_pct
        distinguishing_aspect: |
          The summary is derived, not stored: it exposes rate_divergence_pp (16.7), which lives on
          no entity, while every other field equals the cohort row — federal 66.7 from 2/3 and
          ranking 50.0 from 2/4 on the same four-student roster with one approved exclusion.
        test_recipe:
          setup:
            - "A DRAFT GRAD_RATE_150 cohort for FALL2020 holds S001 COMPLETED_150, S002 COMPLETED_150, S003 STILL_ENROLLED and S004 NO_LONGER_ENROLLED; S004's DECEASED exclusion is APPROVED."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
