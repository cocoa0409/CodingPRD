            - "http_status == 422"

  # ============================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: client_credit_conserved_debit_matches_project_price
        grounds:
          - state_machines.Project.REVISION_to_APPROVED
          - calculations.quote_final
        distinguishing_aspect: |
          Conserved quantity = Client.account_credit_cents + Project.final_price_cents.
          Forward action: round APPROVED → client debited by final_price_cents,
          project gains final_price_cents. Sum remains equal to the pre-approval
          credit balance. Compensating action: StudioManager POSTs a credit-adjustment
          of +final_price_cents (refund), restoring credit; sum unchanged.
        test_recipe:
          setup:
            - "Client.account_credit_cents = 100000"
            - "Project fully progressed to REVISION with round SUBMITTED; expected final_price = 80000 (STANDARD, no extras)"
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "STAFF", hourly_rate_cents: 80000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
