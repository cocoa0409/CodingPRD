      - name: arbitrage_yield_uses_only_the_deals_own_tranches
        claim_type: input_set_filtering
        grounds:
          - calculations.arbitrage_yield_and_restriction.input_set
          - endpoints[POST /bond-offerings/deals/{id}/yield-restriction-analysis]
        distinguishing_aspect: |
          The bond-year weighting is scoped to ONE deal. A second deal of the same issuer holds
          a 12.000-yield tranche; the analysis on deal A must still return 4.0833, which is the
          50,000 / 100,000 bond-year weighting of its own two tranches only. An implementation
          that weights across the issuer, or across all deals, lands far away from 4.0833, and
          the read-only endpoint makes the check possible before the deal is ever priced.
        test_recipe:
          setup:
            - "Issuer Fairhaven has deal A (T1 5,000,000 yield 4.250 20 periods; T2 5,000,000 yield 4.000 40 periods) and deal B (one 5,000,000 tranche at yield 12.000)."
            - "Neither deal has been priced, so Deal.arbitrage_yield_pct is still null on both."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_a_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_a_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { a_t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_a_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { a_t2_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026B", tax_status: "TAXABLE", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_b_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_b_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 12.000, yield_pct: 12.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { b_t1_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_a_id}/yield-restriction-analysis"
              payload: { projected_investment_yield_pct: 4.600, unspent_proceeds_usd: 5000000, investment_days: 180 }
              as: ComplianceOfficer
          assert:
            - "HTTP 200"
            - "response.data.deal_id == ${deal_a_id}"
            - "response.data.arbitrage_yield_pct == 4.0833, i.e. deal B's 12.000-yield tranche is not in the input set"
            - "response.data.permitted_investment_yield_pct == 4.2083"
            - "the same analysis on ${deal_b_id} returns arbitrage_yield_pct 12.0000, confirming the two input sets are disjoint"
            - "Deal.${deal_a_id}.arbitrage_yield_pct is still null: the analysis stores nothing"

      - name: permitted_investment_yield_adds_the_one_eighth_allowance
        claim_type: constants_applied
        grounds:
          - calculations.arbitrage_yield_and_restriction.constants
          - endpoints[POST /bond-offerings/deals/{id}/yield-restriction-analysis]
        distinguishing_aspect: |
          Three constants must all be right in one response: ONE_EIGHTH_ALLOWANCE_PCT 0.125
          (4.0833 -> 4.2083), ARBITRAGE_DAY_COUNT_BASIS 360 (not 365) and the 2-decimal
          rounding of the excess. At a projected 4.600 on 5,000,000 for 180 days the excess is
          9,792.50; a 365-day basis gives 9,658.36 and a forgotten allowance gives 40,275.00.
        test_recipe:
          setup:
            - "A DRAFT deal of 10,000,000 carries the standard two-tranche schedule (bond years 50,000 and 100,000)."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/yield-restriction-analysis"
              payload: { projected_investment_yield_pct: 4.600, unspent_proceeds_usd: 5000000, investment_days: 180 }
              as: ComplianceOfficer
          assert:
            - "HTTP 200"
            - "response.data.arbitrage_yield_pct == 4.0833 with 4 decimal places"
            - "response.data.permitted_investment_yield_pct == 4.2083 == 4.0833 + 0.125"
            - "response.data.projected_investment_yield_pct == 4.600 echoed back"
            - "response.data.yield_restriction_applies == true"
            - "response.data.excess_earnings_usd == 9792.50, i.e. 5000000 * 0.00517 * 180 / 360 on the 360-day basis"

      - name: disclosure_risk_score_sums_weights_and_clamps_at_one_hundred
        claim_type: weighted_scoring
        grounds:
          - calculations.issuer_disclosure_risk_score
          - entities.Issuer.fields.disclosure_risk_score
        distinguishing_aspect: |
          Four issuers created in one pass pin every term of the weighted sum separately: STATE
          with a clean record scores 0 (the surcharge table has a genuine zero row), CITY clean
          scores 5 (surcharge only), AUTHORITY with 3 late event notices scores 39 (15 + 24,
          which exercises the 8-point weight three times), and AUTHORITY with 5 late annual
          filings, 5 late notices and a material event has raw 140 and must be CLAMPED to 100.
          An unclamped implementation reports 140; one that treats prior_late_event_notices with
          the 12-point annual weight reports 51 for the third issuer.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /bond-offerings/issuers"
              payload: { name: "State of Ohio", state_code: "OH", entity_type: "STATE" }
              as: ComplianceOfficer
              captures: { i_state_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { i_city_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "Fairhaven Port Authority", state_code: "OH", entity_type: "AUTHORITY", prior_late_annual_filings: 0, prior_late_event_notices: 3, has_prior_material_event: false }
              as: ComplianceOfficer
              captures: { i_auth39_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "Lakeside Water Authority", state_code: "OH", entity_type: "AUTHORITY", prior_late_annual_filings: 5, prior_late_event_notices: 5, has_prior_material_event: true }
              as: ComplianceOfficer
              captures: { i_auth100_id: $.data.id }
          assert:
            - "all four: HTTP 201"
            - "Issuer.${i_state_id}.disclosure_risk_score == 0"
            - "Issuer.${i_city_id}.disclosure_risk_score == 5"
            - "Issuer.${i_auth39_id}.disclosure_risk_score == 39"
            - "Issuer.${i_auth100_id}.disclosure_risk_score == 100, clamped down from a raw 140"
            - "every score is an integer, never a float"

      - name: committing_an_enhancement_propagates_the_premium_down_and_up
        claim_type: constraint_propagation
        grounds:
          - state_machines.CreditEnhancement.PROPOSED_to_COMMITTED
          - calculations.credit_enhancement_premium_and_net_proceeds.steps_4_and_5
        distinguishing_aspect: |
          One commit propagates in two directions and stops: DOWN to the listed tranche
          (is_insured true, rating_basis ENHANCED) and UP to Deal.credit_enhancement_premium_usd
          33,750.00, derived from insured debt service 7,500,000.00 at 45 bps. The uninsured
          tranche T2 must stay is_insured false with rating_basis UNDERLYING even though it
          belongs to the same deal, and because the deal is only STRUCTURING,
          net_proceeds_to_issuer_usd must remain null rather than being computed early.
        test_recipe:
          setup:
            - "A STRUCTURING deal of 10,000,000 carries T1 (5,000,000, coupon 5.000, 20 periods) and T2 (5,000,000, coupon 5.000, 40 periods) and one PROPOSED bond-insurance enhancement at 45 bps covering T1 only."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/submit-structure"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/credit-enhancements"
              payload: { provider_name: "Keystone Assurance", enhancement_type: "BOND_INSURANCE", enhanced_rating: "AA", premium_bps: 45, insured_tranche_ids: ["${t1_id}"] }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { ce_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/credit-enhancements/${ce_id}/commit"
              payload: {}
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
          assert:
            - "HTTP 200 and CreditEnhancement.${ce_id}.status == COMMITTED"
            - "CreditEnhancement.${ce_id}.insured_debt_service_usd == 7500000.00"
            - "CreditEnhancement.${ce_id}.premium_usd == 33750.00"
            - "Deal.${deal_id}.credit_enhancement_premium_usd == 33750.00"
            - "MaturityTranche.${t1_id}.is_insured == true and rating_basis == ENHANCED"
            - "MaturityTranche.${t2_id}.is_insured == false and rating_basis == UNDERLYING"
            - "Deal.${deal_id}.net_proceeds_to_issuer_usd is still null and issue_price_total_usd is still null because the deal is not PRICED"
            - "the propagation reaches a fixed point: a GET of the deal and both tranches after the call shows no further movement"

      - name: deal_issue_price_total_rounds_per_tranche_then_sums
        claim_type: correct_result
        grounds:
          - calculations.deal_issue_price_total
        distinguishing_aspect: |
          Per-tranche proceeds 5,302,900.00 and 5,408,800.00 must sum to 10,711,700.00.
        excluded_because:
          difficulty_instance: gross_spread_negotiated_versus_competitive_divergence
          rationale: |
            That difficulty instance prices the same two-tranche schedule and asserts
            issue_price_total_usd 10711700.00 on both branches, which is exactly this claim.

      - name: gross_spread_rounds_each_tranche_before_summing
        claim_type: precision
        grounds:
          - calculations.gross_spread_disclosure.precision
        distinguishing_aspect: |
          Rounding per tranche and then summing differs from summing bonds and rounding once.
        excluded_because:
          difficulty_instance: gross_spread_round_per_tranche_then_sum
          rationale: |
            That difficulty instance is built specifically around the pinned order, using
            per-bond components whose product has more than 2 decimals so the two orders
            diverge. Repeating it here would add nothing.

      - name: reoffering_price_selects_the_lower_of_the_two_variants
        claim_type: variant_selection
        grounds:
          - calculations.tranche_reoffering_price.formula
        distinguishing_aspect: |
          Yield-to-worst picks the strictly lower variant, with an exact tie resolving to
          to-maturity and is_priced_to_call false.
        excluded_because:
          difficulty_instance: tranche_yield_to_worst_variant_divergence
          rationale: |
            That difficulty instance already covers the premium-called, discount-to-maturity and
            exact-tie cases together with is_priced_to_call in each, which is the whole selection
            rule.

      - name: gross_spread_basis_chooses_between_the_two_variants
        claim_type: variant_divergence
        grounds:
          - calculations.gross_spread_disclosure.variants
        distinguishing_aspect: |
          The same par and schedule yields 87,500.00 on the negotiated basis and 111,700.00 on
          the competitive basis.
        excluded_because:
          difficulty_instance: gross_spread_negotiated_versus_competitive_divergence
          rationale: |
            That difficulty instance runs both bases over identical tranche data and asserts the
            delta, which is precisely the divergence claim.

      - name: net_proceeds_reconcile_when_the_enhancement_is_withdrawn
        claim_type: reconciliation
        grounds:
          - calculations.credit_enhancement_premium_and_net_proceeds.invariant
        distinguishing_aspect: |
          Withdrawing a committed enhancement after pricing must move net proceeds from
          10,590,450.00 to 10,624,200.00 with the money identity intact.
        excluded_because:
          difficulty_instance: enhancement_withdraw_conserves_issue_price_identity
          rationale: |
            That difficulty instance asserts the identity issue_price_total_usd ==
            net_proceeds_to_issuer_usd + gross_spread_total_usd + credit_enhancement_premium_usd
            before and after the withdrawal, including the exact delta, so the reconciliation is
            already pinned.

      - name: yield_restriction_threshold_at_the_permitted_yield
        claim_type: threshold
        grounds:
          - calculations.arbitrage_yield_and_restriction.formula
        distinguishing_aspect: |
          The comparison is strict, so a projected yield exactly equal to the permitted yield
          does not restrict.
        excluded_because:
          difficulty_instance: arbitrage_allowance_strictly_above_permitted_yield
          rationale: |
            That difficulty instance walks the three points around 4.2083 (just below, exactly
            at, just above) and asserts yield_restriction_applies plus excess_earnings_usd at
            each, which is the complete boundary claim.

      - name: waterfall_starves_the_lower_tier_and_places_the_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.order_allotment_waterfall.worked_examples[tier 2 pro-rated, tier 3 starved]
        distinguishing_aspect: |
          Tier 1 fills wholly, tier 2 pro-rates with a floored 5,000 remainder to the earlier
          order, and tier 3 receives nothing.
        excluded_because:
          difficulty_instance: order_period_reopen_conserves_tranche_par
          rationale: |
            That difficulty instance builds the identical four-order book and asserts the
            2,005,000 / 1,715,000 / 1,280,000 / 0 allotments including the remainder placement
            before compensating them away, so the starvation and remainder claims are already
            covered there.

  # ===========================================================================
  # SECTION 4 - VALIDATIONS
  # ===========================================================================
  - section: validations
    instances:

      - name: pagination_parameters_outside_their_bounds_rejected
        claim_type: violation_to_error
        grounds:
          - validations[pagination-params-valid] (priority 6, category schema)
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: |
          The bounds are limit in [1, 100] and offset >= 0, so limit 0, limit 101 and offset -1
          are all 422 ERR_INVALID_PAGINATION while limit 1 and limit 100 succeed - a clamping
          implementation that silently coerces out-of-range values returns 200 for all five.
        test_recipe:
          setup:
            - "One issuer exists so the list endpoint has something to page over."
          setup_api_calls:
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /bond-offerings/issuers"
              payload: { limit: 0 }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/issuers"
              payload: { limit: 101 }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/issuers"
              payload: { offset: -1 }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/issuers"
              payload: { limit: 1 }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/issuers"
              payload: { limit: 100 }
              as: ComplianceOfficer
          assert:
            - "first three calls: HTTP 422 with data.error_id == 'ERR_INVALID_PAGINATION'"
            - "fourth and fifth calls: HTTP 200 with limit 1 and limit 100 echoed in the envelope"

      - name: duplicate_msrb_registration_id_rejected
        claim_type: violation_to_error
        grounds:
          - validations[natural-keys-unique] (priority 15, category business_constraint)
          - errors[ERR_DUPLICATE_MSRB_REGISTRATION]
        distinguishing_aspect: |
          msrb_registration_id is GLOBALLY unique, not per firm_type, so re-using AU0001 for a
          municipal advisor is still a 422 - an implementation that scopes the key by firm_type
          accepts it.
        test_recipe:
          setup:
            - "One underwriting firm holds msrb_registration_id AU0001."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw_firm_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Advisory", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
          assert:
            - "HTTP 422 with data.error_id == 'ERR_DUPLICATE_MSRB_REGISTRATION'"
            - "GET /bond-offerings/firms returns exactly 1 row with total_count == 1"

      - name: duplicate_series_designation_is_scoped_to_the_issuer
        claim_type: violation_to_error
        grounds:
          - validations[natural-keys-unique] (priority 15, category business_constraint)
          - errors[ERR_DUPLICATE_SERIES_DESIGNATION]
        distinguishing_aspect: |
          series_designation is unique WITHIN issuer_id, so 'Series 2026A' is refused on the same
          issuer (422) and accepted on a second issuer (201) in the same test. A globally unique
          key rejects both; an unenforced key accepts both.
        test_recipe:
          setup:
            - "Issuer Fairhaven already has a deal designated Series 2026A; a second issuer, Ashbury, has none."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Ashbury", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer2_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAXABLE", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 7000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer2_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal2_id: $.data.id }
          assert:
            - "first call: HTTP 422 with data.error_id == 'ERR_DUPLICATE_SERIES_DESIGNATION'"
            - "second call: HTTP 201 and Deal.${deal2_id}.series_designation == 'Series 2026A'"

      - name: aligned_maturity_and_call_dates_are_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[maturity-dates-aligned] (priority 14, category business_temporal)
          - validations[call-feature-coherent] (priority 15, category business_constraint)
        distinguishing_aspect: |
          The positive side of the two date rules: with dated_date 2026-08-01, a maturity on
          2046-08-01 (40 periods) whose first_call_date is 2036-08-01 (20 periods) and whose
          call_price_pct is exactly the 103.000 upper bound must be ACCEPTED with 201. An
          over-eager alignment check that requires annual (rather than semiannual)
          anniversaries, or an exclusive [100, 103) call-price bound, wrongly rejects this.
        test_recipe:
          setup:
            - "A DRAFT deal dated 2026-08-01."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2027-02-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 3.000, yield_pct: 3.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 103.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t2_id: $.data.id }
          assert:
            - "both calls: HTTP 201, no error"
            - "MaturityTranche.${t1_id}.periods_to_maturity == 1, i.e. a single semiannual period is aligned"
            - "MaturityTranche.${t2_id}.periods_to_maturity == 40 and periods_to_call == 20"
            - "MaturityTranche.${t2_id}.call_price_pct == 103.000, the inclusive upper bound"

      - name: municipal_advisor_firm_may_not_sit_on_the_syndicate
        claim_type: violation_to_error
        grounds:
          - validations[ma-underwriter-conflict] (priority 12, category business_safety)
          - errors[ERR_MA_UNDERWRITER_CONFLICT]
        distinguishing_aspect: |
          MSRB Rule G-23 blocks the advisor firm in ANY member_role, so adding it even as a
          SELLING_GROUP member is a 422 ERR_MA_UNDERWRITER_CONFLICT - not
          ERR_ROLE_IDENTITY_MISMATCH and not a firm-type error - and the rule is symmetric: a
          deal may not name as advisor a firm that already holds a seat.
        test_recipe:
          setup:
            - "A DRAFT deal is advised by the DUAL_REGISTERED firm DR0001; a separate underwriter AU0001 already holds a SENIOR_MANAGER seat on another deal of the same issuer."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Delta Dual Registered", firm_type: "DUAL_REGISTERED", msrb_registration_id: "DR0001" }
              as: ComplianceOfficer
              captures: { dr_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${dr_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${dr_firm_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/syndicate-members"
              payload: { firm_id: "${dr_firm_id}", member_role: "SELLING_GROUP", liability_pct: 10.0000, takedown_share_pct: 10.0000, priority_rank: 3 }
              as: MunicipalAdvisor
              as_user_id: "${dr_firm_id}"
          assert:
            - "HTTP 422 with data.error_id == 'ERR_MA_UNDERWRITER_CONFLICT'"
            - "GET /bond-offerings/deals/${deal_id}/syndicate-members returns 0 rows with total_count == 0"
            - "the firm is DUAL_REGISTERED, so nothing about its firm_type caused the refusal"

      - name: suspended_firm_may_not_be_engaged_as_municipal_advisor
        claim_type: violation_to_error
        grounds:
          - validations[firm-not-suspended] (priority 12, category business_safety)
          - errors[ERR_FIRM_SUSPENDED]
        distinguishing_aspect: |
          The suspension check fires at deal creation on municipal_advisor_firm_id, and it must
          rank behind body-reference existence (priority 7) but ahead of any state or fiscal
          rule: a suspended but EXISTING firm gives 422 ERR_FIRM_SUSPENDED, while a
          non-existent firm id gives 404 ERR_FIRM_NOT_FOUND.
        test_recipe:
          setup:
            - "Firm MA0002 is registered with is_suspended true; firm MA0001 is not suspended."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Suspended Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0002", is_suspended: true }
              as: ComplianceOfficer
              captures: { bad_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${bad_firm_id}" }
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026B", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "00000000-0000-4000-8000-000000000000" }
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
          assert:
            - "first call: HTTP 422 with data.error_id == 'ERR_FIRM_SUSPENDED'"
            - "second call: HTTP 404 with data.error_id == 'ERR_FIRM_NOT_FOUND', proving existence is checked before suspension"
            - "GET /bond-offerings/deals returns 0 rows"

      - name: competitive_designation_requires_an_engaged_municipal_advisor
        claim_type: cross_entity_validation
        grounds:
          - validations[ma-engagement-required-for-competitive] (priority 12, category business_safety)
          - errors[ERR_MA_ENGAGEMENT_REQUIRED]
        distinguishing_aspect: |
          MSRB independence: the advisor slot must be filled by a firm whose firm_type actually
          admits the advisory role. A deal advised by an UNDERWRITER-only firm is refused with
          ERR_MA_ENGAGEMENT_REQUIRED at designate-sale-method, and the identical call on a deal
          advised by a MUNICIPAL_ADVISOR firm succeeds - so the validity of the operation depends
          entirely on the state of a different entity.
        test_recipe:
          setup:
            - "Deal X is advised by the UNDERWRITER-only firm AU0001; deal Y is advised by the MUNICIPAL_ADVISOR firm MA0001. Both are STRUCTURING with no syndicate."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
