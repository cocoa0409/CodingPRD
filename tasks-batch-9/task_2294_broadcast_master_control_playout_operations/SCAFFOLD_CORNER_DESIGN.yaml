        grounds: "§1.4 priorities 60 (ERR_ITEM_PLAYLIST_MISMATCH), 61 (ERR_FAULT_TARGET_MISMATCH, 'RF_POWER_FAULT and LOSS_OF_SIGNAL require transmitter_id'), 62 (ERR_OPERATOR_ROLE_CLASS_INVALID), 65 (ERR_ORDER_NOT_PREEMPTIBLE, 'a GUARANTEED spot is preempted only when the request carries force_preempt_guaranteed == true, and then it accrues full credit')"
