            - "PeriodReport.${pr1_id}.total_service_hours != 2.5"
            - "PeriodReport.${pr1_id}.rider_count == 1"
            - "PeriodReport.${pr1_id}.veteran_rider_count == 1"
            - "PeriodReport.${pr1_id}.total_charged_cents == 22500"
            - "PeriodReport.${pr1_id}.private_pay_cents == 22500"
