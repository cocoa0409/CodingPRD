            - "JointDevelopmentAgreement.${jda_a}.federal_approval_status == FTA_APPROVED"
            - "JointDevelopmentAgreement.${jda_a}.board_resolution_number == R-2026-118"
            - "JointDevelopmentAgreement.${jda_a}.annual_revenue_to_agency_cents == 2420800"
            - "JointDevelopmentAgreement.${jda_a}.consideration_value_cents == 48416000"
            - "JointDevelopmentAgreement.${jda_a}.capital_credit_cents == 299200"
            - "FederalDispositionRequest.${fdr_a}.determination == APPROVED_WITH_CONDITIONS"
            - "AgencySite.${site_a}.status == UNDER_AGREEMENT"

      - name: site_status_cycles_assessed_inventoried_assessed
        grounds:
          - state_machines.AgencySite.ASSESSED_to_INVENTORIED
          - state_machines.AgencySite.INVENTORIED_to_ASSESSED
          - state_machines.ReadinessAssessment.CERTIFIED_to_SUPERSEDED
          - calculations.readiness_composite_score
        distinguishing_aspect: |
          The non-linearity here is a cycle on a different entity — AgencySite returns
          ASSESSED -> INVENTORIED -> ASSESSED, clearing readiness_composite_score to null on the way back
          and re-deriving it as 73.00 from the second assessment, while the first certified assessment is
          left SUPERSEDED rather than re-scored.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "AgencySite with federal_interest_pct 2.5 carrying one CERTIFIED assessment (composite 70.00, tier READY), so the site sits in ASSESSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-A-006", name: "Fir Street Layover Lot", address_line: "77 Fir St", parcel_area_sqft: 52000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_1: $.data.id }
            - call: "POST /jda/assessments/${asmt_1}/certify"
              payload: { }
              as: RealEstateOfficer
          trigger:
            - call: "POST /jda/sites/${site_a}/reopen-inventory"
              payload: { reason: "Encumbrance cleared; retake the readiness screen." }
              as: RealEstateOfficer
              captures: { status_after_reopen: $.data.status, score_after_reopen: $.data.readiness_composite_score, tier_after_reopen: $.data.readiness_tier }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 0 }
              as: RealEstateOfficer
              captures: { asmt_2: $.data.id }
            - call: "POST /jda/assessments/${asmt_2}/certify"
              payload: { }
              as: RealEstateOfficer
              captures: { score_2: $.data.composite_score, tier_2: $.data.tier }
          assert:
            - "${status_after_reopen} == INVENTORIED"
            - "${score_after_reopen} == null"
            - "${tier_after_reopen} == null"
            - "ReadinessAssessment.${asmt_1}.status == SUPERSEDED"
            - "ReadinessAssessment.${asmt_1}.composite_score == 70.00"
            - "${score_2} == 73.00"
            - "${tier_2} == READY"
            - "ReadinessAssessment.${asmt_2}.variant_applied == CERTIFIED"
            - "AgencySite.${site_a}.status == ASSESSED"
            - "AgencySite.${site_a}.readiness_composite_score == 73.00"
            - "AgencySite.${site_a}.readiness_tier == READY"

  - rule_id: transitive_cascade
    instances:
      - name: award_cascade_site_to_sibling_solicitation_to_its_proposals
        grounds:
          - state_machines.Solicitation.CLOSED_to_AWARDED
          - state_machines.AgencySite.SOLICITATION_READY_to_UNDER_AGREEMENT
          - state_machines.Solicitation.ISSUED_to_CANCELLED
          - state_machines.Proposal.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Depth-3 chain whose trigger is the award transition: awarding solicitation A moves the AgencySite to
          UNDER_AGREEMENT (hop 1); because the site is now UNDER_AGREEMENT the sibling ISSUED solicitation B is
          CANCELLED (hop 2); because B is CANCELLED its own SUBMITTED proposal is REJECTED (hop 3) — each link
          is caused by the previous link, not directly by the award call.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "One AgencySite certified READY and SOLICITATION_READY"
            - "Two prequalified CLEAR developers"
            - "Two solicitations on that site, both ISSUED, each carrying one SUBMITTED proposal"
            - "Solicitation A closed so its single proposal is ranked 1; solicitation B is left ISSUED"
