        as: AppointingExecutive
        captures:
          oak_id: $.data.id
          oak_v0: $.data.version
      - call: POST /agency-network/agencies/${oak_id}/activate
        payload:
          expected_agency_version: ${oak_v0}
        as: AppointingExecutive
        captures:
          oak_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cato Three
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cato_id: $.data.id
      - call: POST /agency-network/agreements
        payload:
          agent_id: ${cato_id}
          agency_id: ${oak_id}
          agreement_type: EXCLUSIVE_AGENT
          commission_schedule:
            AUTO:
              new: 0.15
              renewal: 0.1
            HOME:
              new: 0.12
              renewal: 0.08
            LIFE:
              new: 0.25
              renewal: 0.15
        as: FieldManager
        captures:
          ag_id: $.data.id
      - call: POST /agency-network/staff
        payload:
          full_name: Otto Member
          role_title: CSR
          allocation_units: 8
          sponsoring_agreement_id: ${ag_id}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          otto_id: $.data.id
      - call: POST /agency-network/staff/${otto_id}/appoint
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
      - call: POST /agency-network/agents/${cato_id}/cessation
        payload:
          last_day_iso8601: "2026-08-31T00:00:00Z"
        as: AgencyPrincipal
        as_user_id: ${oak_id}
      trigger:
      - call: POST /agency-network/agencies/${oak_id}/run_ops
        payload: {}
        as: PlatformAdmin
      - call: GET /agency-network/staff/${otto_id}
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          staff_status: $.data.status
      - call: GET /agency-network/agencies/${oak_id}
        payload: {}
        as: AppointingExecutive
        captures:
          units: $.data.agency_level_units
      assert:
      - "link 1: StaffMember.${otto_id}.status == TERMINATED"
      - "link 2: recomputing from the terminated staffer leaves staffing_reimbursement == 0.00 and Agency.${oak_id}.agency_level_units unchanged"
- rule_id: priority_pair_validation_conflict
  instances:
  - name: assess_dual_failure_license_before_market_need
    grounds:
    - validations[priority=5]
    - validations[priority=6]
    - errors[ERR_LICENSED_REQUIRED]
    - errors[ERR_MARKET_NEED_EXISTS]
    distinguishing_aspect: Auth-adjacent business_safety (priority 5, ERR_LICENSED_REQUIRED) outranks business_constraint (priority 6, ERR_MARKET_NEED_EXISTS), so when both fire on assessment the safety error wins — a different error-category pair than the fiscal/referential conflict.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. App with market_need_score 30 (low) AND a required-action path that cannot be scored because the territory need check fails; the acting field manager is authenticated."
      setup_api_calls:
      - call: POST /agency-network/appointment-applications
        payload:
          state_code: CA
          market_need_score: 30
          candidate_assessment_score: 80
          market_odds_score: 80
          creation_channel: FIELD
        as: FieldManager
        captures:
          app_id: $.data.id
      trigger:
      - call: POST /agency-network/appointment-applications/${app_id}/assess
        payload: {}
        as: FieldManager
        captures:
          err: $.data.error_id
      assert:
      - the dual-failure response carries exactly one error_id
      - response error_id == ERR_LICENSED_REQUIRED (priority 5 business_safety) and not ERR_MARKET_NEED_EXISTS (priority 6 business_constraint)
  - name: participate_dual_failure_allowance_before_successor
    grounds:
    - validations[priority=8]
    - validations[priority=9]
    - errors[ERR_ALLOWANCE_INSUFFICIENT]
    - errors[ERR_HOLDING_POLICIES_REMAIN]
    distinguishing_aspect: Business_fiscal (priority 8, ERR_ALLOWANCE_INSUFFICIENT) outranks business_referential (priority 9, ERR_HOLDING_POLICIES_REMAIN); when a campaign draw exceeds the pool and the agency also holds an open policy, the fiscal error wins — a different error-category pair than the safety/constraint conflict.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali APPROVED with no exposure, so the allowance pool is 0.00; a PLANNED campaign of 5,000 cents; the agency carries one OPEN policy."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-004
          name: Cali Four
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Four Keeper
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P5
          product_line: AUTO
          annual_premium_cents: 100000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p5: $.data.id
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns
        payload:
          campaign_type: LEAD_PROGRAM
          marketing_allowance_cents: 5000
          expected_leads: 10
          start_date: "2026-09-02T00:00:00Z"
          end_date: "2026-09-30T00:00:00Z"
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          camp_id: $.data.id
      trigger:
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns/${camp_id}/participate
        payload:
          expected_agency_version: ${cali_v1}
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_ALLOWANCE_INSUFFICIENT (priority 8 business_fiscal)
      - response error_id != ERR_HOLDING_POLICIES_REMAIN (priority 9 business_referential) even though the agency holds an OPEN policy
- rule_id: boundary_precision_check
  instances:
  - name: retention_threshold_at_eighty_five_percent
    grounds:
    - calculations.retention_threshold_check
    - entities.BookTransfer.fields.retention_met
    - endpoints.GET_/agency-network/book-transfers/{id}
    distinguishing_aspect: "A numeric threshold crossing on retention: retention_pct exactly 85.00 meets the target via >=, while 84.00 does not — the boundary is inclusive and sits on the retention metric."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. A book transfer with 20 transferred policies whose retention percentage is resolved by the ops run; the boundary is exercised at exactly 85.00."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: OAK-04
          name: Oak Four
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          oak_id: $.data.id
          oak_v0: $.data.version
      - call: POST /agency-network/agencies/${oak_id}/activate
        payload:
          expected_agency_version: ${oak_v0}
        as: AppointingExecutive
        captures:
          oak_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cato Four
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cato_id: $.data.id
      - call: POST /agency-network/agents/${cato_id}/book-transfer
        payload:
          from_agency_id: ${oak_id}
          to_agency_id: ${oak_id}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          xfer_id: $.data.id
      trigger:
      - call: POST /agency-network/agencies/${oak_id}/run_ops
        payload: {}
        as: PlatformAdmin
      - call: GET /agency-network/book-transfers/${xfer_id}
        payload: {}
        as: FieldManager
        captures:
          rp: $.data.retention_pct
          met: $.data.retention_met
      assert:
      - at retention_pct == 85.00 BookTransfer.${xfer_id}.retention_met == true
      - at retention_pct == 84.00 BookTransfer.${xfer_id}.retention_met == false
      - the boundary is >= 85, never > 85
  - name: campaign_draw_boundary_pool_exact_vs_one_cent
    grounds:
    - calculations.marketing_allowance_utilization
    - validations[priority=8]
    - errors[ERR_ALLOWANCE_INSUFFICIENT]
    - state_machines.MarketingCampaign.PLANNED_to_PARTICIPATED
    distinguishing_aspect: "An exact-quantity boundary on the allowance pool: a draw equal to the pool remaining succeeds, while a draw of pool+1 cent fails with ERR_ALLOWANCE_INSUFFICIENT — the empty-remainder edge, distinct from the retention-percent crossing."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with 2,000,000 cents of OPEN exposure, so pool_base = 80,000.00 and the pool is 80,000.00; no allowance spent yet."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-005
          name: Cali Five
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Five Keeper
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P6
          product_line: AUTO
          annual_premium_cents: 2000000
          is_new_business: false
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p6: $.data.id
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns
        payload:
          campaign_type: BRAND
          marketing_allowance_cents: 80000
          expected_leads: 5
          start_date: "2026-09-02T00:00:00Z"
          end_date: "2026-09-28T00:00:00Z"
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          exact_id: $.data.id
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns
        payload:
          campaign_type: COMMUNITY
          marketing_allowance_cents: 80001
          expected_leads: 5
          start_date: "2026-10-02T00:00:00Z"
          end_date: "2026-10-28T00:00:00Z"
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          over_id: $.data.id
      trigger:
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns/${exact_id}/participate
        payload:
          expected_agency_version: ${cali_v1}
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          exact_status: $.data.status
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns/${over_id}/participate
        payload:
          expected_agency_version: ${cali_v1}
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          err: $.data.error_id
      assert:
      - "the exact-pool draw succeeds: MarketingCampaign.${exact_id}.status == PARTICIPATED"
      - the pool+1-cent draw fails with response error_id == ERR_ALLOWANCE_INSUFFICIENT
- rule_id: cross_entity_state_dependency
  instances:
  - name: staff_appointment_requires_sponsoring_agreement_active
    grounds:
    - state_machines.StaffMember.PENDING_to_ACTIVE
    - state_machines.Agreement.ACTIVE_to_SUSPENDED
    - validations[priority=5]
    - errors[ERR_SPONSOR_AGREEMENT_NOT_ACTIVE]
    distinguishing_aspect: "The StaffMember→Agreement pair: a staffer can only be appointed while its sponsoring agreement is ACTIVE; once the Agreement is SUSPENDED the same appointment is refused — a different entity pair than the Policy→Agency dependency."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Oak ACTIVE, owner agent Cato LICENSED and ACTIVE, sponsoring agreement UNDER_REVIEW; a PENDING staffer Sam is nominated."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: OAK-05
          name: Oak Five
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          oak_id: $.data.id
          oak_v0: $.data.version
      - call: POST /agency-network/agencies/${oak_id}/activate
        payload:
          expected_agency_version: ${oak_v0}
        as: AppointingExecutive
        captures:
          oak_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cato Five
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cato_id: $.data.id
      - call: POST /agency-network/agreements
        payload:
          agent_id: ${cato_id}
          agency_id: ${oak_id}
          agreement_type: EXCLUSIVE_AGENT
          commission_schedule:
            AUTO:
              new: 0.15
              renewal: 0.1
            HOME:
              new: 0.12
              renewal: 0.08
            LIFE:
              new: 0.25
              renewal: 0.15
        as: FieldManager
        captures:
          ag_id: $.data.id
      - call: POST /agency-network/staff
        payload:
          full_name: Sam Five
          role_title: CSR
          allocation_units: 6
          sponsoring_agreement_id: ${ag_id}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          sam_id: $.data.id
      trigger:
      - call: POST /agency-network/staff/${sam_id}/appoint
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${oak_id}
        captures:
          s1: $.data.status
      assert:
      - while the sponsoring agreement is UNDER_REVIEW the appointment is refused with ERR_SPONSOR_AGREEMENT_NOT_ACTIVE
      - after the agreement becomes ACTIVE the same appointment succeeds and StaffMember.${sam_id}.status == ACTIVE
  - name: transition_book_requires_target_agency_active
    grounds:
    - state_machines.Agent.APPOINTED_to_TRANSITIONING
    - state_machines.Agency.APPROVED_to_ACTIVE
    - validations[priority=4]
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: "The Agent→Agency pair: Agent.APPOINTED_to_TRANSITIONING is allowed only when the target agency is ACTIVE; against an APPROVED agency the same transition is refused — a cross-entity state dependency on a different entity pair than StaffMember→Agreement."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali APPROVED (not activated); LICENSED new agent Vera APPOINTED via the application chain."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-006
          name: Cali Six
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
      - call: POST /agency-network/appointment-applications
        payload:
          state_code: CA
          market_need_score: 55
          candidate_assessment_score: 80
          market_odds_score: 80
          creation_channel: FIELD
        as: FieldManager
        captures:
          app_id: $.data.id
      - call: POST /agency-network/appointment-applications/${app_id}/assess
        payload: {}
        as: FieldManager
      - call: POST /agency-network/appointment-applications/${app_id}/approve
        payload: {}
        as: AppointingExecutive
      - call: POST /agency-network/appointment-applications/${app_id}/appoint
        payload: {}
        as: FieldManager
        captures:
          vera_id: $.data.id
          vera_v0: $.data.version
      - call: POST /agency-network/agents/${vera_id}/read-license
        payload:
          license_expiry_date: "2028-01-01T00:00:00Z"
          product_lines:
          - AUTO
        as: FieldManager
      trigger:
      - call: POST /agency-network/agents/${vera_id}/transition-book
        payload:
          agency_id: ${cali_id}
          expected_agent_version: ${vera_v0}
        as: FieldManager
        captures:
          err: $.data.error_id
      assert:
      - against the APPROVED agency the transition is refused
      - after POST /agencies/${cali_id}/activate the same transition succeeds and Agent.${vera_id}.agency_id == ${cali_id}
- rule_id: resource_temporal_overlap
  instances:
  - name: campaign_window_closed_interval_overlap
    grounds:
    - validations[priority=7]
    - errors[ERR_INTERVAL_OVERLAP]
    - entities.MarketingCampaign
    - endpoints.POST_/agency-network/agencies/{id}/marketing-campaigns
    distinguishing_aspect: On the MarketingCampaign resource the window is a CLOSED interval [start_date, end_date], so two campaigns that merely touch at a shared endpoint day collide and are rejected — distinct from the half-open staff-assignment semantics.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE; a LEAD_PROGRAM campaign booked 2026-09-02..2026-09-30."
      setup_api_calls:
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-007
          name: Cali Seven
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns
        payload:
          campaign_type: LEAD_PROGRAM
          marketing_allowance_cents: 10000
          expected_leads: 10
          start_date: "2026-09-02T00:00:00Z"
          end_date: "2026-09-30T00:00:00Z"
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          c1: $.data.id
      trigger:
      - call: POST /agency-network/agencies/${cali_id}/marketing-campaigns
        payload:
          campaign_type: BRAND
          marketing_allowance_cents: 5000
          expected_leads: 5
          start_date: "2026-09-30T00:00:00Z"
          end_date: "2026-10-15T00:00:00Z"
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          err: $.data.error_id
      assert:
      - the touching campaign is rejected with response error_id == ERR_INTERVAL_OVERLAP
      - a campaign starting 2026-10-01 (gap of one day) is accepted
  - name: staff_assignment_half_open_window_overlap
    grounds:
    - validations[priority=7]
    - errors[ERR_INTERVAL_OVERLAP]
    - entities.StaffMember
    - endpoints.POST_/agency-network/staff/{id}/appoint
    distinguishing_aspect: On the StaffMember resource the assignment window is HALF-OPEN [assignment_start_date, assignment_end_date), so a back-to-back assignment starting exactly when the previous ends is accepted — the opposite adjacency treatment to the closed campaign interval.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agent Cato ACTIVE and LICENSED with a live sponsoring agreement; staffer Sam already booked 2026-09-02..2026-09-30."
      setup_api_calls:
