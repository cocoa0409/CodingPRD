# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Subscription Box. Breadth probe over SCAFFOLD.yaml §1.1–§1.7 per the
# claim-extraction-guide taxonomy. §1.8 already covers the deep reasoning corners;
# excluded_because: stubs reference §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_plan_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.SubscriptionPlan, endpoints]
        distinguishing_aspect: "POST /plans with all required fields returns 201; response carries server-minted id, created_at, version==1, status==ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /plans"
              payload: { name: "Basic", cadence: "MONTHLY", period_price_cents: 5000, box_item_count: 2 }
              as: CurationAdmin
              captures: { plan_id: $.data.id, ver: $.data.version, st: $.data.status }
          assert:
            - "response code == 201"
            - "SubscriptionPlan.${plan_id}.version == 1"
            - "SubscriptionPlan.${plan_id}.status == ACTIVE"
            - "SubscriptionPlan.${plan_id}.prepaid_terms_offered == [] (default)"

      - name: get_plan_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.SubscriptionPlan, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /plans/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "GET /plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: create_subscriber_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Subscriber, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /subscribers omitting full_name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /subscribers"
              payload: { email: "missing@x.com" }
              as: Subscriber
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: create_plan_invalid_cadence_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.SubscriptionPlan.fields.cadence, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /plans with cadence='WEEKLY' (not in {MONTHLY,QUARTERLY}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /plans"
              payload: { name: "Bad", cadence: "WEEKLY", period_price_cents: 5000, box_item_count: 1 }
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: subscriber_wallet_balance_computed_zero_on_create
        claim_type: Computed Fields
        grounds: [entities.Subscriber.fields.wallet_balance_cents, calculations.wallet_balance]
        distinguishing_aspect: "A freshly created Subscriber has wallet_balance_cents == 0 (no WalletEntry yet); any client-supplied value is ignored."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /subscribers"
              payload: { email: "wb@x.com", full_name: "WB S" }
              as: Subscriber
              captures: { acct: $.data.id, bal: $.data.wallet_balance_cents }
          assert:
            - "Subscriber.${acct}.wallet_balance_cents == 0"

      - name: list_plans_pagination_envelope_total_count_has_more
        claim_type: Listing
        grounds: [entities.SubscriptionPlan, endpoints]
        distinguishing_aspect: "GET /plans?limit=1 returns one item with total_count==2 and has_more==true after two plans created."
        test_recipe:
          setup: ["Two plans created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "P1", cadence: "MONTHLY", period_price_cents: 5000, box_item_count: 1 }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "P2", cadence: "QUARTERLY", period_price_cents: 9000, box_item_count: 3 }
              as: CurationAdmin
          trigger:
            - call: "GET /plans?limit=1&offset=0"
              payload: {}
              as: CurationAdmin
          assert:
            - "response meta envelope present (api_request_id, api_request_timestamp); response_type == array"
            - "pagination total_count == 2 and has_more == true and returned data length == 1"

      - name: duplicate_email_rejected
        claim_type: Type Constraints
        grounds: [entities.Subscriber.fields.email, "validations[priority=7]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second Subscriber with an existing email returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["One subscriber dup@x.com exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /subscribers"
              payload: { email: "dup@x.com", full_name: "First" }
              as: Subscriber
          trigger:
            - call: "POST /subscribers"
              payload: { email: "dup@x.com", full_name: "Second" }
              as: Subscriber
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_EMAIL (409)"

      - name: duplicate_sku_rejected
        claim_type: Type Constraints
        grounds: [entities.Product.fields.sku, "validations[priority=7]", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Creating a second Product with an existing sku returns ERR_DUPLICATE_SKU (409)."
        test_recipe:
          setup: ["One product sku=DUP exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /products"
              payload: { sku: "DUP", name: "First", on_hand_qty: 5 }
              as: CurationAdmin
          trigger:
            - call: "POST /products"
              payload: { sku: "DUP", name: "Second", on_hand_qty: 3 }
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_SKU (409)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pause_then_resume_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.Subscription.ACTIVE_to_PAUSED, state_machines.Subscription.PAUSED_to_ACTIVE]
        distinguishing_aspect: "An ACTIVE subscription paused until a future instant resumes via POST /resume back to ACTIVE with paused_until cleared."
        test_recipe:
          setup: ["Subscriber S with ACTIVE subscription, then paused until 2026-08-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "RP", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "rp@x.com", full_name: "RP S" }
              as: Subscriber
              captures: { acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/pause"
              payload: { paused_until: "2026-08-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acct}"
          trigger:
            - call: "POST /subscriptions/${s_id}/resume"
              payload: {}
              as: Subscriber
              as_user_id: "${acct}"
              captures: { life: $.data.lifecycle_status }
          assert:
            - "Subscription.${s_id}.lifecycle_status == ACTIVE"
            - "Subscription.${s_id}.paused_until == null"

      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Immediate-cancelling a subscription already in CANCELLED returns ERR_INVALID_STATE (409); no second refund issued."
        test_recipe:
          setup: ["Subscriber S already immediate-cancelled (CANCELLED, pay-as-you-go, refund 0)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "CC", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "cc@x.com", full_name: "CC S" }
              as: Subscriber
              captures: { acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/cancel"
              payload: { effective: "IMMEDIATE" }
              as: Subscriber
              as_user_id: "${acct}"
          trigger:
            - call: "POST /subscriptions/${s_id}/cancel"
              payload: { effective: "IMMEDIATE" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: dispatch_shipment_before_packed_irrelevant_terminal_delivered_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Shipment.DISPATCHED_to_DELIVERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once a Shipment is DELIVERED (terminal), POST /shipments/{id}/dispatch returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A shipment driven to DELIVERED via ship->dispatch->deliver."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "SH", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SHP", name: "SH P", on_hand_qty: 5 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "sh@x.com", full_name: "SH S" }
              as: Subscriber
              captures: { acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { box_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-10T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave_ver}" }
              as: CurationAdmin
              captures: { alloc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /waves/${wave_id}/lock"
              payload: {}
              as: CurationAdmin
            - call: "POST /waves/${wave_id}/ship"
              payload: {}
              as: CurationAdmin
            - call: "GET /shipments?allocation_id=${alloc_id}"
              payload: {}
              as: CurationAdmin
              captures: { ship_id: "$.data[0].id" }
            - call: "POST /shipments/${ship_id}/dispatch"
              payload: {}
              as: CurationAdmin
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: CurationAdmin
          trigger:
            - call: "POST /shipments/${ship_id}/dispatch"
              payload: {}
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409) — DELIVERED is terminal"

      - name: pause_limit_reached_after_three_pauses
        claim_type: Precondition Enforcement
        grounds: [state_machines.Subscription.ACTIVE_to_PAUSED, "validations[priority=8]", "errors[ERR_PAUSE_LIMIT_REACHED]"]
        distinguishing_aspect: "A 4th pause in the same term (after pause_count_in_term reaches 3 via three pause/resume cycles) returns ERR_PAUSE_LIMIT_REACHED (422)."
        test_recipe:
          setup: ["Subscriber S paused-and-resumed three times (pause_count_in_term==3), now ACTIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "PL", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "pl@x.com", full_name: "PL S" }
              as: Subscriber
              captures: { acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/pause"
              payload: { paused_until: "2026-07-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acct}"
            - call: "POST /subscriptions/${s_id}/resume"
              payload: {}
              as: Subscriber
              as_user_id: "${acct}"
            - call: "POST /subscriptions/${s_id}/pause"
              payload: { paused_until: "2026-07-02T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acct}"
            - call: "POST /subscriptions/${s_id}/resume"
              payload: {}
              as: Subscriber
              as_user_id: "${acct}"
            - call: "POST /subscriptions/${s_id}/pause"
              payload: { paused_until: "2026-07-03T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acct}"
            - call: "POST /subscriptions/${s_id}/resume"
              payload: {}
              as: Subscriber
              as_user_id: "${acct}"
          trigger:
            - call: "POST /subscriptions/${s_id}/pause"
              payload: { paused_until: "2026-07-04T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAUSE_LIMIT_REACHED (422)"

      - name: pause_invalid_resume_date_in_past_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Subscription.ACTIVE_to_PAUSED, "validations[priority=9]", "errors[ERR_INVALID_RESUME_DATE]"]
        distinguishing_aspect: "Pause with paused_until at-or-before the current clock returns ERR_INVALID_RESUME_DATE (422)."
        test_recipe:
          setup: ["Subscriber S ACTIVE, clock at 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "IR", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "ir@x.com", full_name: "IR S" }
              as: Subscriber
              captures: { acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${s_id}/pause"
              payload: { paused_until: "2026-05-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_RESUME_DATE (422)"

      - name: wave_lock_before_cutoff_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ShippingWave.OPEN_to_LOCKED, "validations[priority=9]", "errors[ERR_CUTOFF_NOT_REACHED]"]
        distinguishing_aspect: "Locking a wave while clock < cutoff_at returns ERR_CUTOFF_NOT_REACHED (422)."
        test_recipe:
          setup: ["Wave cutoff 2026-06-10, clock at 2026-06-05 (before cutoff)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-10T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 5 }
              as: CurationAdmin
              captures: { wave_id: $.data.id }
          trigger:
            - call: "POST /waves/${wave_id}/lock"
              payload: {}
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CUTOFF_NOT_REACHED (422)"
            - "ShippingWave.${wave_id}.status == OPEN (unchanged)"

      - name: gift_subscription_expires_on_last_prepaid_draw
        claim_type: Side Effect Execution
        grounds: [state_machines.Subscription.ACTIVE_to_EXPIRED, entities.Subscription.fields.is_gift, endpoints]
        distinguishing_aspect: "A 1-period gift subscription, when its last prepaid period is drawn at a renewal run, transitions lifecycle ACTIVE->EXPIRED with next_renewal_at cleared."
        test_recipe:
          setup: ["Gift subscription (term 1, is_gift=true, PREPAID, prepaid_periods_remaining=1). Clock advanced to the renewal date and renewal run for it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "GX", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "gxg@x.com", full_name: "GX Gifter" }
              as: Subscriber
              captures: { gifter: $.data.id }
            - call: "POST /gift-grants"
              payload: { plan_id: "${plan_id}", gifter_subscriber_id: "${gifter}", term_periods: 1, recipient_email: "gxr@x.com" }
              as: Subscriber
              as_user_id: "${gifter}"
              captures: { code: $.data.redemption_code }
            - call: "POST /subscribers"
              payload: { email: "gxr@x.com", full_name: "GX Rec" }
              as: Subscriber
              captures: { rec: $.data.id }
            - call: "POST /gift-grants/redeem"
              payload: { redemption_code: "${code}", subscriber_id: "${rec}" }
              as: Subscriber
              as_user_id: "${rec}"
              captures: { gsub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /_renewal/run"
              payload: { subscription_id: "${gsub_id}" }
              as: CurationAdmin
          assert:
            - "Subscription.${gsub_id}.lifecycle_status == EXPIRED"
            - "Subscription.${gsub_id}.prepaid_periods_remaining == 0"

      - name: renewal_charge_failed_moves_billing_to_past_due
        claim_type: Side Effect Execution
        grounds: [state_machines.Subscription.CURRENT_to_PAST_DUE, state_machines.BillingCycle.PENDING_to_FAILED, entities.Subscription.fields.billing_status]
        distinguishing_aspect: "A renewal run with charge_outcome=FAILED on a CURRENT pay-as-you-go subscription moves billing_status CURRENT->PAST_DUE."
        test_recipe:
          setup: ["Subscriber S ACTIVE/CURRENT, clock advanced to renewal, renewal run with FAILED outcome."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "PD", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "pd@x.com", full_name: "PD S" }
              as: Subscriber
              captures: { acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${acct}"
              captures: { s_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /_renewal/run"
              payload: { subscription_id: "${s_id}", charge_outcome: "FAILED" }
              as: CurationAdmin
          assert:
            - "Subscription.${s_id}.billing_status == PAST_DUE"

      - name: retry_charge_recovers_past_due_to_current
        claim_type: Valid Transition
        grounds: [state_machines.Subscription.PAST_DUE_to_CURRENT, endpoints]
        distinguishing_aspect: "POST /subscriptions/{id}/retry-charge with outcome=PAID on a PAST_DUE subscription moves billing_status PAST_DUE->CURRENT."
        test_recipe:
          setup: ["Subscriber S in billing_status PAST_DUE after a failed renewal."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "RT", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
