  - section: calculations
    instances:
      - name: deadline_classification_inclusive_boundaries
        claim_type: correct_result
        grounds:
          - calculations.deadline_classification
          - entities.SeniorRecord.fields.deadline_classification
        distinguishing_aspect: "Day-granularity inclusive upper bounds: submitted_at exactly on the state deadline classifies ON_TRACK_STATE, one day after is STATE_MISSED_FEDERAL_OPEN, after the federal deadline is LATE, and no qualifying event is NOT_SUBMITTED."
        test_recipe:
          setup:
            - "Campaign OPEN (state 2027-04-15, federal 2028-06-30); school ENROLLED"
            - "4 seniors AUTO_CONFIRMED-matched with STATUS_DETAIL consent; aid initial statuses SUBMITTED with effective_date 2027-04-15 / 2027-04-16 / 2028-07-01, and STARTED (never submitted)"
