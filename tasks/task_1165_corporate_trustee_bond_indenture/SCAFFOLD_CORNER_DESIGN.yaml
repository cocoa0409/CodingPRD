            - "at 2026-05-01: error_id == ERR_NOT_YET_EFFECTIVE; appointment stays ACCEPTED"
            - "at 2026-09-01 (equality): TrusteeAppointment.${appt}.status == EFFECTIVE"
            - "Indenture.${ind}.current_trustee_ref == trustee-beta"
            - "FeeInvoice.${inv}.status == VOID (cascade link 2)"

      - name: extraordinary_invoice_without_basis_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NO_EXTRAORDINARY_BASIS]"]
        distinguishing_aspect: "EXTRAORDINARY_SERVICE on an indenture whose DefaultCases never left ALLEGED fails ERR_NO_EXTRAORDINARY_BASIS; ANNUAL_ADMIN on the same indenture succeeds at 2500000."
        test_recipe:
          setup: ["active indenture; one ALLEGED (never confirmed) default case declared 2026-05-02"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /fee-invoices", payload: { indenture_id: "${ind}", invoice_type: "EXTRAORDINARY_SERVICE", service_period_start: "2026-05-01", service_period_end: "2026-05-31", extraordinary_hours: 5, description: "no basis" }, as: TrustOfficer, as_user_id: "officer-1", captures: { err: $.data.error_id } }
            - { call: "POST /fee-invoices", payload: { indenture_id: "${ind}", invoice_type: "ANNUAL_ADMIN", service_period_start: "2026-01-01", service_period_end: "2026-12-31", description: "annual ok" }, as: TrustOfficer, as_user_id: "officer-1", captures: { inv: $.data.id } }
          assert:
            - "EXTRAORDINARY_SERVICE: error_id == ERR_NO_EXTRAORDINARY_BASIS (case only ALLEGED)"
            - "ANNUAL_ADMIN: created with amount_cents == 2500000"

      - name: direction_lapses_via_clock_sweep
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_DIRECTION_LAPSED]", "state_machines.NoteholderDirection"]
        distinguishing_aspect: "Clock sweep past expires_at flips CIRCULATING -> LAPSED; a subsequent endorsement fails ERR_DIRECTION_LAPSED."
        test_recipe:
          setup: ["active indenture, tranche, position A; CONFIRMED default; direction expiring 2026-06-30T00:00:00Z; clock advanced past expiry"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v: $.data.version } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "WAIVE_DEFAULT", expires_at: "2026-06-30T00:00:00Z", expected_default_case_version: "${dc_v}" }, as: TrustOfficer, captures: { dir: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /directions/${dir}/endorsements", payload: { noteholder_account_id: "${nha}" }, as: Noteholder, as_user_id: "${nha}", captures: { err: $.data.error_id } }
          assert:
            - "NoteholderDirection.${dir}.status == LAPSED (system sweep)"
            - "endorsement after lapse: error_id == ERR_DIRECTION_LAPSED"

      - name: obligation_late_then_breached_sweep_states
        claim_type: side_effect_execution
        grounds: ["state_machines.CovenantObligation", "entities.Indenture.fields.covenant_posture"]
        distinguishing_aspect: "Sweep granularity: at due+1 day the obligation is LATE with posture GRACE and NO default case; at due+grace+1 it is BREACHED with posture BREACH and an auto-created ALLEGED DefaultCase."
        test_recipe:
          setup: ["active indenture; QUARTERLY FINANCIAL_REPORT obligation anchor 2026-06-30 grace 10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /covenant-obligations", payload: { indenture_id: "${ind}", covenant_type: "FINANCIAL_REPORT", frequency: "QUARTERLY", period_anchor_date: "2026-06-30", grace_period_days: 10 }, as: TrustOfficer, captures: { ob: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /covenant-obligations/${ob}", payload: {}, as: TrustOfficer, captures: { st_late: $.data.status } }
            - { call: "GET /default-cases?indenture_id=${ind}", payload: {}, as: TrustOfficer }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-11T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /default-cases?indenture_id=${ind}", payload: {}, as: TrustOfficer, captures: { auto_case: "$.data[0].id" } }
          assert:
            - "at 2026-07-01: obligation LATE, Indenture.covenant_posture == GRACE, zero DefaultCase rows exist"
            - "at 2026-07-11: obligation BREACHED, posture == BREACH"
            - "exactly one DefaultCase auto-created: status ALLEGED, default_type COVENANT_BREACH, source_ref == ${ob}"

      - name: coverage_below_minimum_clean_trigger
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_COVERAGE_BELOW_MINIMUM]"]
        distinguishing_aspect: "With no default outstanding, a VERIFIED substitution whose post_release_coverage_bps == 12445 < 12500 is rejected with ERR_COVERAGE_BELOW_MINIMUM at decide."
        test_recipe:
          setup: ["active indenture, position 1000000000; C1 SECURITIES 800000000; C2 REAL_ESTATE 500000000; VERIFIED substitution with substitute 460000000 (coverage 12445)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 1000000000 }, as: PlatformAdmin }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C1", collateral_type: "SECURITIES", appraised_value_cents: 800000000, valuation_date: "2026-04-01" }, as: TrustOfficer }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C2", collateral_type: "REAL_ESTATE", appraised_value_cents: 500000000, valuation_date: "2026-04-01" }, as: TrustOfficer, captures: { c2: $.data.id, c2_v: $.data.version } }
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "SUBSTITUTION", substitute_description: "sub", substitute_collateral_type: "SECURITIES", substitute_appraised_value_cents: 460000000, substitute_valuation_date: "2026-04-15", expected_collateral_item_version: "${c2_v}" }, as: Issuer, as_user_id: "issuer-1", captures: { rr: $.data.id } }
            - { call: "POST /collateral-release-requests/${rr}/verify", payload: {}, as: TrustOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /collateral-release-requests/${rr}/decide", payload: { decision: "APPROVE" }, as: TrustManager, as_user_id: "manager-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_COVERAGE_BELOW_MINIMUM (post_release_coverage_bps 12445 < 12500, no default lock present)"

      - name: endorsement_without_eligible_position_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_NO_ELIGIBLE_POSITION]"]
        distinguishing_aspect: "A noteholder with zero ACTIVE principal endorsing a valid in-window direction fails ERR_NO_ELIGIBLE_POSITION."
        test_recipe:
          setup: ["active indenture, tranche, position A 400000000; holder D with no positions; CONFIRMED default; CIRCULATING direction in window"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-D", legal_name: "Holder D", contact_email: "d@x.com" }, as: PlatformAdmin, captures: { nhd: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v: $.data.version } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "ACCELERATE", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v}" }, as: TrustOfficer, captures: { dir: $.data.id } }
          trigger:
            - { call: "POST /directions/${dir}/endorsements", payload: { noteholder_account_id: "${nhd}" }, as: Noteholder, as_user_id: "${nhd}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_ELIGIBLE_POSITION"

