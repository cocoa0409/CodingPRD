              captures: { cap_recomputed: $.data.forward_capacity_grams, tier_recomputed: $.data.load_plan_tier }
          assert:
            - "after the first load ${cap_mid} == 50000 and ${tier_mid} == UNDER_CAPACITY"
            - "after both loads ${cap_final} == 0 while ${tier_final} == RESERVE_TIER — the label comes from the RAW -5000, not from the floored 0"
            - "Buildup.${bd_id}.rated_weight_grams == 105000, status == WEIGHT_BREACH and load_plan_tier == RESERVE_TIER (105000 - 70000 == 35000 > 25000)"
            - "the manual override ${tier_override} == AT_CAPACITY"
            - "after the unload the recompute discards the override: ${tier_recomputed} == UNDER_CAPACITY and ${cap_recomputed} == 45000"
            - "LoadMove.${move_id}.load_plan_tier != AT_CAPACITY at the end"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: package_commitment_cyclic_decision_loop_down_up_down
        grounds:
          - state_machines.Package.transitions.COMMITTED_to_DOWNGRADED
          - state_machines.Package.transitions.DOWNGRADED_to_COMMITTED
          - state_machines.Package.transitions.COMMITTED_to_REROUTED
          - state_machines.Package.transitions.REROUTED_to_COMMITTED
          - endpoints.POST_/airhub/packages/{package_id}/downgrade-commitment
        distinguishing_aspect: "On the Package entity the commitment axis is a CYCLE rather than a pipeline: COMMITTED -> DOWNGRADED -> COMMITTED -> REROUTED -> COMMITTED revisits COMMITTED twice at two different hub minutes through two different triggers, and final_commitment_minutes is overwritten by every decision."
        test_recipe:
          setup:
            - "Clock 1500, then advanced to 1540. SDF hub with alternate IND, BANK_A with N701UP landed and unloaded, shift N-A, Package P (NEXT_DAY_AIR GENERAL, 20000 g) live on N701UP."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-C-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_c: $.data.id, pkg_c_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:40:00Z" }
              as: HubOpsManager
          trigger:
            - call: "POST /airhub/packages/${pkg_c}/downgrade-commitment"
              payload: { expected_package_version: "${pkg_c_v1}" }
              as: CommitmentController
              captures: { after_down_status: $.data.commitment_status, after_down_final: $.data.final_commitment_minutes }
            - call: "GET /airhub/packages/${pkg_c}/failures"
              payload: {}
              as: RefundAdjuster
              captures: { fail_c: "$.data[0].id" }
            - call: "POST /airhub/failures/${fail_c}/void"
              payload: {}
              as: RefundAdjuster
            - call: "GET /airhub/packages/${pkg_c}"
              payload: {}
              as: CommitmentController
              captures: { after_void_status: $.data.commitment_status, after_void_final: $.data.final_commitment_minutes }
            - call: "POST /airhub/hubs/${hub_id}/declare-contingency"
              payload: {}
              as: WeatherOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T02:40:00Z" }
              as: HubOpsManager
            - call: "POST /airhub/packages/${pkg_c}/diverge"
              payload: {}
              as: CommitmentController
              captures: { after_reroute_status: $.data.commitment_status, after_reroute_final: $.data.final_commitment_minutes }
            - call: "POST /airhub/hubs/${hub_id}/clear-contingency"
              payload: {}
              as: HubOpsManager
            - call: "POST /airhub/packages/${pkg_c}/clear-reroute"
              payload: {}
              as: CommitmentController
              captures: { after_clear_status: $.data.commitment_status, after_clear_final: $.data.final_commitment_minutes }
          assert:
            - "step 1 DOWNGRADED: ${after_down_status} == DOWNGRADED and ${after_down_final} == 1920 (cutoff 1560 + 360)"
            - "step 2 the compensating void returns the package to COMMITTED: ${after_void_status} == COMMITTED and ${after_void_final} is null — the FIRST revisit of the initial state"
            - "step 3 REROUTED: ${after_reroute_status} == REROUTED and ${after_reroute_final} == 1800 (cutoff 1560 + 240)"
            - "step 4 COMMITTED again: ${after_clear_status} == COMMITTED and ${after_clear_final} is null — the SECOND revisit"
            - "Package.${pkg_c}.commitment_status == COMMITTED, so the four-step loop closed with no drift"
            - "the axis is a cycle: COMMITTED is reached at creation, at step 2 and at step 4, so it is not a forward-only pipeline"

      - name: sort_lane_branching_reopen_saturation_fork_join
        grounds:
          - state_machines.SortLane.transitions.AVAILABLE_to_CLOSED
          - state_machines.SortLane.transitions.CLOSED_to_AVAILABLE
          - state_machines.SortLane.transitions.AVAILABLE_to_SATURATED
          - endpoints.POST_/airhub/lanes/{lane_id}/close
        distinguishing_aspect: "On the SortLane entity the machine forks over two independent occupancy axes: AVAILABLE forks to CLOSED by operator decision and to SATURATED by an automatic capacity recompute, so CLOSED -> AVAILABLE -> SATURATED reaches AVAILABLE twice and takes a different exit each time."
        test_recipe:
          setup:
            - "Clock 1410. SDF hub with lanes P-01 and P-02 (both PRIMARY GENERAL, capacity 60000), BANK_A with N701UP landed and unloaded, shift N-A, one 40000-gram and one 20000-gram GENERAL package aboard, both inducted, and P-02 closed."
          setup_api_calls:
            - *k_clock
