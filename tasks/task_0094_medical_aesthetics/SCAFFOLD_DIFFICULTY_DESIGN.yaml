scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1: Dual-variant calculations across different entity domains (≥2)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: plan_total_provisional_vs_final_on_treatment_plan
        grounds:
          - calculations.plan_total_provisional
          - calculations.plan_total_final
          - state_machines.TreatmentPlan.SUBMITTED_to_APPROVED
          - entities.TreatmentPlan.fields.provisional_total_cents
          - entities.TreatmentPlan.fields.final_total_cents
        distinguishing_aspect: |
          Both calculations operate on the SAME TreatmentPlan items but produce different
          totals: provisional reads live Project.pricing_tiers with no promo, while final
          applies the >=3-item 5% promo and locks Project.version into locked_project_versions.
          This dual-variant lives on the TreatmentPlan entity domain.
        test_recipe:
          setup:
            - "Create three ON_SHELF projects P1, P2, P3 (LOW risk, non-SURGICAL) each with tier T0 base_price_cents=100000."
            - "Create Customer C (age 30, empty contraindications, signed consent)."
            - "Consultant POSTs /aesthetics/plans with items=[P1/T0/1, P2/T0/1, P3/T0/1] → DRAFT plan."
          trigger:
            - "Read TreatmentPlan.provisional_total_cents on DRAFT."
            - "POST /plans/{id}/submit then POST /plans/{id}/sign-consent then POST /plans/{id}/approve."
            - "Read TreatmentPlan.final_total_cents after APPROVED."
          assert:
            - "TreatmentPlan.provisional_total_cents == 300000 (3 × 100000, no promo at provisional stage)."
            - "TreatmentPlan.final_total_cents == 285000 (3 × (100000 - 5% promo = 95000))."
            - "TreatmentPlan.provisional_total_cents != TreatmentPlan.final_total_cents on identical items."
            - "TreatmentPlan.locked_project_versions is a non-null map containing each item's project_id."

      - name: customer_risk_base_vs_ae_amplified_on_customer
        grounds:
          - calculations.customer_risk_score
          - state_machines.AdverseEvent.OPEN_to_ESCALATED
          - entities.Customer.fields.risk_score
          - entities.Customer.fields.adverse_event_count
        distinguishing_aspect: |
          Two variants of customer_risk_score on the Customer entity (different domain from
          TreatmentPlan above): 'base' uses ae_factor==1.0 when adverse_event_count==0,
          'ae_amplified' applies (1 + 0.25 * adverse_event_count) when at least one AE
          has been escalated. Same declarative inputs produce different scores.
        test_recipe:
          setup:
            - "Create Customer C with health_declaration.is_pregnant=true and allergies=['LIDOCAINE','PENICILLIN'] (base=30 + 5*2 = 40)."
          trigger:
            - "Read Customer.risk_score."
            - "File an AE with severity=SEVERE on a completed appointment of C (auto-escalates, increments adverse_event_count to 1)."
            - "Read Customer.risk_score again."
          assert:
            - "Customer.risk_score == 40.0 before AE."
            - "Customer.risk_score == 50.0 after one SEVERE AE escalation (40 * 1.25)."
            - "Customer.adverse_event_count == 1 after escalation."

  # ===========================================================================
  # Rule 2: Combinatorial formulas across different modes (≥2)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: installment_schedule_tiered_rate_mode_a
        grounds:
          - calculations.installment_schedule
          - state_machines.InstallmentPlan.PENDING_KYC_to_ACTIVE
          - entities.InstallmentPlan.fields.schedule
        distinguishing_aspect: |
          Mode (a) — non-linear interaction across ≥3 inputs (principal, term, APR-tier,
          activated_at). Term-based APR tier selection {3→0bps, 6→600, 12→1200, 24→1800}
          combined with annuity formula and balance carry-over means a small change in
          term_months changes both the rate AND the per-period principal/interest split.
        test_recipe:
          setup:
            - "Create Customer C with kyc_status=VERIFIED, credit_score=750."
            - "Create APPROVED TreatmentPlan with final_total_cents=30000."
            - "POST /aesthetics/installments with downpayment_cents=0, term_months=6, finance_partner_id=FP1."
          trigger:
            - "POST /aesthetics/installments/{id}/activate."
          assert:
            - "InstallmentPlan.apr_bps == 600."
            - "len(InstallmentPlan.schedule) == 6."
            - "InstallmentPlan.schedule[0].principal_cents == 4938 and InstallmentPlan.schedule[0].interest_cents == 150 and InstallmentPlan.schedule[0].total_cents == 5088."
            - "InstallmentPlan.schedule[5].principal_cents == 5061 (final period absorbs residual)."
            - "sum(InstallmentPlan.schedule[i].principal_cents for i in 0..5) == 30000."

      - name: prep_lead_time_nested_rounding_mode_b
        grounds:
          - calculations.prep_lead_time
          - entities.Appointment.fields.prep_window_start
          - entities.Project.fields.bom
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The locked rule is
          'per-sku ceil_to_5 FIRST, then MAX' which produces different prep_lead_minutes
          from 'SUM raw then ceil_to_5' or 'MAX raw then ceil_to_5'. The scaffold pins
          per-sku-ceil-then-max as the authoritative order.
        test_recipe:
          setup:
            - "Create SURGICAL project P with bom=[{sku=DRUG_X, quantity=3}, {sku=CONSUMABLE_Y, quantity=2}] and qualified doctor D."
            - "DRUG_X is kind=DRUG (prep=4/unit); CONSUMABLE_Y is kind=CONSUMABLE (prep=2/unit)."
            - "Create APPROVED plan containing P × 1; KYC-verified customer, signed consent."
          trigger:
            - "POST /aesthetics/appointments with scheduled_start=T."
          assert:
            - "Per-sku raw: DRUG_X = 3*4=12, ceil_5=15; CONSUMABLE_Y = 2*2=4, ceil_5=5."
            - "Max(15,5)=15 + SURGICAL_PAD(30) = 45 minutes."
            - "Appointment.prep_window_start == T - 45 minutes (NOT T - 25 from sum-then-ceil_5(16)→20+30, NOT T - 45 by coincidence — assertion is that the chosen formula yields exactly 45)."

  # ===========================================================================
  # Rule 3: Non-linear state-machine shape on different entities (≥2)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: treatment_plan_revision_cycle_with_branching_approval
        grounds:
          - state_machines.TreatmentPlan.SUBMITTED_to_DRAFT
          - state_machines.TreatmentPlan.SUBMITTED_to_APPROVED
          - state_machines.TreatmentPlan.SUBMITTED_to_REJECTED
          - state_machines.TreatmentPlan.DRAFT_to_DRAFT
          - entities.TreatmentPlan.fields.plan_version
        distinguishing_aspect: |
          TreatmentPlan exhibits both a CYCLE (SUBMITTED→DRAFT→SUBMITTED revision loop,
          plus DRAFT→DRAFT self-edit that bumps plan_version) AND a BRANCH at SUBMITTED
          (→APPROVED via attending OR via senior countersign, OR →REJECTED). It is non-linear
          on the TreatmentPlan entity.
        test_recipe:
          setup:
            - "Create DRAFT plan."
          trigger:
            - "PATCH /plans/{id} (DRAFT→DRAFT) — observe plan_version increment."
            - "POST /plans/{id}/submit (DRAFT→SUBMITTED)."
            - "POST /plans/{id}/return-to-draft (SUBMITTED→DRAFT)."
            - "POST /plans/{id}/submit (DRAFT→SUBMITTED again)."
          assert:
            - "After PATCH, TreatmentPlan.plan_version == 2 (incremented from initial 1)."
            - "TreatmentPlan.status transitions: DRAFT → DRAFT → SUBMITTED → DRAFT → SUBMITTED (cycle observed)."
            - "TreatmentPlan.informed_consent_signed_at is null after return-to-draft (cleared)."

      - name: appointment_branching_to_terminals
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CHECKED_IN
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - state_machines.Appointment.SCHEDULED_to_SCHEDULED
        distinguishing_aspect: |
          Appointment (a DIFFERENT entity from TreatmentPlan) has branching from SCHEDULED
          to three distinct terminals (CHECKED_IN→...→COMPLETED, CANCELLED, NO_SHOW) plus a
          SCHEDULED→SCHEDULED reschedule self-loop — branching shape on a different entity.
        test_recipe:
          setup:
            - "Create three appointments A1, A2, A3 under APPROVED plans with disjoint resources."
          trigger:
            - "A1: POST /appointments/{A1}/reschedule (SCHEDULED→SCHEDULED, reschedule_count++)."
            - "A2: POST /appointments/{A2}/cancel (SCHEDULED→CANCELLED)."
            - "A3: POST /_clock/advance to scheduled_end+60min (SCHEDULED→NO_SHOW)."
          assert:
            - "A1.reschedule_count == 1 and A1.status == 'SCHEDULED'."
            - "A2.status == 'CANCELLED'."
            - "A3.status == 'NO_SHOW' after clock advance past scheduled_end + 60 minutes."

  # ===========================================================================
  # Rule 4: Transitive cascade chains from different triggers (≥2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: plan_cancel_cascade_depth_3
        grounds:
          - state_machines.TreatmentPlan.APPROVED_to_CANCELLED
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - state_machines.InstallmentPlan.ACTIVE_to_REFUNDED
          - entities.PaymentEvent.fields.kind
          - entities.SyncEvent.fields.topic
        distinguishing_aspect: |
          Depth-3 chain originating at TreatmentPlan.cancel: (1) Plan.cancel causes
          (2) Appointment.cancel for each non-terminal appointment, which itself causes
          (3) the InstallmentPlan transition to REFUNDED + a PaymentEvent kind=REFUND +
          a SyncEvent topic=FINANCE_PARTNER kind=REFUND_INITIATED. Each link is caused
          by the previous link, not directly by the plan-cancel call.
        test_recipe:
          setup:
            - "Approved plan with one SCHEDULED appointment and an ACTIVE InstallmentPlan; one installment paid (paid_amount_cents > 0)."
          trigger:
            - "POST /aesthetics/plans/{id}/cancel."
          assert:
            - "TreatmentPlan.status == 'CANCELLED'."
            - "Appointment.status == 'CANCELLED' (caused by plan-cancel cascade)."
            - "InstallmentPlan.status == 'REFUNDED' (caused by plan-cancel cascade)."
            - "Exactly one PaymentEvent with kind == 'REFUND' and amount_cents == InstallmentPlan.paid_amount_cents BEFORE the cancel was recorded."
            - "Exactly one SyncEvent with topic=='FINANCE_PARTNER' and kind=='REFUND_INITIATED' emitted."

      - name: adverse_event_escalation_cascade_depth_2
        grounds:
          - state_machines.AdverseEvent.OPEN_to_ESCALATED
          - calculations.customer_risk_score
          - entities.Customer.fields.adverse_event_count
          - entities.Customer.fields.risk_score
        distinguishing_aspect: |
          Depth-2 chain triggered by AE escalation (DIFFERENT trigger from plan cancel):
          (1) AdverseEvent.OPEN→ESCALATED causes (2) Customer.adverse_event_count++ which
          itself causes recomputation of Customer.risk_score via the customer_risk_score
          calculation. The risk_score update is a consequence of the count update, not
          a direct side effect of the escalate call.
        test_recipe:
          setup:
            - "Customer C with health_declaration.is_pregnant=true, allergies=['LIDOCAINE','PENICILLIN'] (base=40, risk_score=40.0, adverse_event_count=0)."
            - "Completed appointment for C with an OPEN AdverseEvent of severity=MODERATE."
          trigger:
            - "POST /aesthetics/adverse-events/{id}/escalate."
          assert:
            - "AdverseEvent.status == 'ESCALATED'."
            - "Customer.adverse_event_count == 1 (consequence of escalate)."
            - "Customer.risk_score == 50.0 (consequence of adverse_event_count change, 40 * 1.25)."

  # ===========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs (≥2)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_priority
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors.ERR_INVALID_STATE
          - errors.ERR_CONSENT_NOT_SIGNED
        distinguishing_aspect: |
          Pair (state, business_safety). When a plan is already APPROVED AND consent
          was never signed AND someone calls /approve, BOTH would fail. Priority 5 (state:
          ERR_INVALID_STATE) wins over priority 11 (business_safety: ERR_CONSENT_NOT_SIGNED).
          Categories are state vs business_safety.
        test_recipe:
          setup:
            - "Create an APPROVED plan that somehow had consent skipped (force by approving via test-only path is not possible; instead use a SUBMITTED plan, sign consent, approve to APPROVED, then try approving again)."
            - "Better setup: SUBMITTED plan WITHOUT signed consent → call /approve (this triggers consent error). Then manually flip state by approving via countersign or other route is not feasible — use the simpler dual-failure: a CANCELLED plan that never had consent signed."
            - "Concrete setup: SUBMITTED plan with informed_consent_signed_at = null, then POST /plans/{id}/cancel… cancellation requires APPROVED, so instead: take a REJECTED plan with no consent and call /approve."
            - "Final setup: a TreatmentPlan in REJECTED status with informed_consent_signed_at = null."
          trigger:
            - "POST /aesthetics/plans/{id}/approve."
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (priority 5 wins over priority 11)."
            - "Response http_status == 409."

      - name: business_referential_vs_business_temporal_priority
        grounds:
          - validations[priority=12]
          - validations[priority=16]
          - errors.ERR_DOCTOR_NOT_QUALIFIED
          - errors.ERR_DOCTOR_CONFLICT
        distinguishing_aspect: |
          Pair (business_referential, business_temporal). When creating an Appointment
          with a doctor who is BOTH unqualified for the project AND double-booked,
          priority 12 (business_referential: ERR_DOCTOR_NOT_QUALIFIED) wins over priority
          16 (business_temporal: ERR_DOCTOR_CONFLICT). Categories are
          business_referential vs business_temporal (different from instance 1's pair).
        test_recipe:
          setup:
            - "Two doctors D1 (qualified for P) and D2 (NOT qualified for P)."
            - "Existing appointment A0 booking D2 over [9:00, 10:00)."
            - "APPROVED plan with attending=D1, item=P×1."
          trigger:
            - "POST /aesthetics/appointments with doctor_id=D2 and scheduled_start=9:30 (induces both ERR_DOCTOR_NOT_QUALIFIED and ERR_DOCTOR_CONFLICT)."
          assert:
            - "Response error_id == 'ERR_DOCTOR_NOT_QUALIFIED' (priority 12 wins over priority 16)."
            - "Response http_status == 422."

  # ===========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints (≥2)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reschedule_count_strict_less_than_3
        grounds:
          - validations[priority=22]
          - entities.Appointment.fields.reschedule_count
          - errors.ERR_RESCHEDULE_LIMIT
        distinguishing_aspect: |
          Numeric-threshold boundary on Appointment.reschedule_count via the
          /appointments/{id}/reschedule endpoint. Allowed when count == 2 (becomes 3
          after this call); rejected ERR_RESCHEDULE_LIMIT when count == 3 prior to call.
          The boundary is '< 3', not '<= 3'.
        test_recipe:
          setup:
            - "Appointment A with reschedule_count = 2."
          trigger:
            - "POST /aesthetics/appointments/{A}/reschedule (succeeds, count becomes 3)."
            - "POST /aesthetics/appointments/{A}/reschedule again."
          assert:
            - "First call succeeds, returns Appointment.reschedule_count == 3."
            - "Second call returns error_id == 'ERR_RESCHEDULE_LIMIT' http_status 422."

      - name: plan_items_zero_or_eleven_empty_set_boundary
        grounds:
          - validations[priority=23]
          - entities.TreatmentPlan.fields.items
          - errors.ERR_PLAN_ITEMS_OUT_OF_RANGE
        distinguishing_aspect: |
          Empty-collection / zero-count boundary on a DIFFERENT endpoint (POST /plans
          and PATCH /plans/{id}) and a DIFFERENT metric (collection length, not numeric
          counter). items length must be in [1, 10]; length==0 and length==11 both fail.
        test_recipe:
          setup:
            - "Authenticated Consultant; existing customer."
          trigger:
            - "POST /aesthetics/plans with items=[] (empty)."
            - "POST /aesthetics/plans with items=[11 items]."
          assert:
            - "First call: error_id == 'ERR_PLAN_ITEMS_OUT_OF_RANGE' http_status 422."
            - "Second call: error_id == 'ERR_PLAN_ITEMS_OUT_OF_RANGE' http_status 422."
            - "items=[exactly 1 item] succeeds with 201."

  # ===========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs (≥2)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_submit_requires_project_on_shelf
        grounds:
          - state_machines.TreatmentPlan.DRAFT_to_SUBMITTED
          - state_machines.Project.UNDER_REVIEW_to_ON_SHELF
          - validations[priority=13]
          - errors.ERR_PROJECT_NOT_ON_SHELF
        distinguishing_aspect: |
          Entity pair (TreatmentPlan, Project). TreatmentPlan.DRAFT→SUBMITTED valid only
          if EVERY items[].project_id has Project.status==ON_SHELF. Different from instance 2
          (Appointment/TreatmentPlan).
        test_recipe:
          setup:
            - "Project P in UNDER_REVIEW (not yet ON_SHELF)."
            - "DRAFT TreatmentPlan with items=[P/T0/1]."
          trigger:
            - "POST /aesthetics/plans/{id}/submit."
          assert:
            - "Response error_id == 'ERR_PROJECT_NOT_ON_SHELF' http_status 422."
            - "After approving P (UNDER_REVIEW→ON_SHELF), the same submit succeeds and plan transitions to SUBMITTED."

      - name: appointment_create_requires_plan_approved_with_unstale_snapshot
        grounds:
          - validations[priority=24]
          - state_machines.TreatmentPlan.SUBMITTED_to_APPROVED
          - entities.TreatmentPlan.fields.locked_project_versions
          - entities.Project.fields.version
          - errors.ERR_PLAN_STALE_REFERENCE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Entity pair (Appointment, TreatmentPlan) with a Project version dependency.
          Appointment create is only valid when parent TreatmentPlan.status==APPROVED AND
          Project.version of every item still equals locked_project_versions snapshot.
          Different pair from instance 1 (TreatmentPlan/Project at submission).
        test_recipe:
          setup:
            - "Plan approved with locked_project_versions = {P.id: 1}."
            - "Take P off-shelf is forbidden here; instead PATCH P (still in UNDER_REVIEW→…) — but APPROVED locks status; so the test mutates the project pre-approval. Simpler: take P off-shelf is blocked, so the scaffold permits PATCH /projects/{id} on DRAFT only. To force drift, the test takes P off-shelf, returns to shelf (each step bumps Project.version)."
            - "Concretely: after plan APPROVED, MedicalDirector POSTs /projects/{P}/take-off-shelf (Project.version increments) then /projects/{P}/return-to-shelf (increments again)."
          trigger:
            - "Consultant POSTs /aesthetics/appointments under the APPROVED plan."
          assert:
            - "Response error_id == 'ERR_PLAN_STALE_REFERENCE' http_status 409."
            - "If plan is instead in CANCELLED status, error is ERR_INVALID_STATE (priority 5) showing the state side of the dependency."

  # ===========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics (≥2)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_with_sterilization_gap
        grounds:
          - validations[priority=18]
          - calculations.appointment_conflict_check
          - errors.ERR_ROOM_CONFLICT
          - entities.Room
        distinguishing_aspect: |
          Room overlap uses an EXTENDED interval [prep_window_start, scheduled_end + 15min)
          — i.e., adjacency at the room's scheduled_end is forbidden up to +15 minutes due
          to the sterilization gap. Semantics: half-open + post-end pad. Distinct from
          anesthesia which has no prep and no gap.
        test_recipe:
          setup:
            - "Room R, non-SURGICAL project P with category=NON_SURGICAL (so anesthesia must be null, no SURGICAL_PAD)."
            - "BOM is one CONSUMABLE with quantity=1 → per-sku raw=2, ceil_to_5=5 → prep_lead_minutes=5 (no SURGICAL_PAD)."
            - "Project duration_minutes=30."
            - "Existing Appointment A0 on R: scheduled_start=10:00, scheduled_end=10:30, prep_window_start=09:55. Room-extended occupation = [09:55, 10:45)."
          trigger:
            - "POST /appointments to create A1 on R with scheduled_start=10:40 (prep_window=10:35, scheduled_end=11:10)."
            - "POST /appointments to create A2 on R with scheduled_start=10:50 (prep_window=10:45, scheduled_end=11:20)."
          assert:
            - "A1 creation returns error_id == 'ERR_ROOM_CONFLICT' http_status 409 because 10:35 < 10:45 (gap-extended end of A0)."
            - "A2 creation returns 201 because 10:45 is NOT < 10:45 (half-open boundary)."

      - name: anesthesia_overlap_no_prep_no_gap
        grounds:
          - validations[priority=20]
          - calculations.appointment_conflict_check
          - errors.ERR_ANESTHESIA_CONFLICT
        distinguishing_aspect: |
          Anesthesia overlap uses the [scheduled_start, scheduled_end) interval (NO prep
          window AND NO sterilization gap) — different interval semantics from Room.
          Tests the case where a resource overlap on doctor/nurse/room (which include
          prep) would succeed but anesthesia (which does not) detects a tighter conflict.
        test_recipe:
          setup:
            - "SURGICAL project P; anesthesia resource AR1."
            - "Existing A0 with anesthesia=AR1, scheduled_start=10:00, scheduled_end=10:30, prep_window=09:30."
            - "All other resources (doctor, nurse, room, equipment) are unique to A0."
          trigger:
            - "Create A1 also using AR1 with scheduled_start=10:30 (adjacent, no overlap because anesthesia interval is half-open and there's no gap)."
            - "Create A2 also using AR1 with scheduled_start=10:25 (overlaps by 5 minutes)."
          assert:
            - "A1 creation succeeds (10:30 not < 10:30)."
            - "A2 creation returns error_id == 'ERR_ANESTHESIA_CONFLICT' http_status 409."
            - "Anesthesia interval does NOT include prep_window_start: a competing appointment whose prep window overlaps A0's prep window but whose scheduled_start >= 10:30 must not produce ERR_ANESTHESIA_CONFLICT."

  # ===========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities (≥2)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cash_flow_invariant_on_plan_cancel_refund
        grounds:
          - state_machines.TreatmentPlan.APPROVED_to_CANCELLED
          - state_machines.InstallmentPlan.ACTIVE_to_REFUNDED
          - entities.PaymentEvent.fields.kind
          - entities.PaymentEvent.fields.amount_cents
          - entities.InstallmentPlan.fields.paid_amount_cents
        distinguishing_aspect: |
          Conserved quantity: net customer cash outflow. Forward action is INSTALLMENT_PAID
          (customer pays X); compensating action is REFUND on plan cancel (institution refunds X).
          Invariant pinned as a formula:
            net_customer_outflow_cents
              = sum(PaymentEvent.amount_cents for kind=INSTALLMENT_PAID under this plan)
              - sum(PaymentEvent.amount_cents for kind=REFUND   under this plan)
          After a plan-cancel that triggers a full refund, net_customer_outflow_cents == 0.
        test_recipe:
          setup:
            - "APPROVED plan with InstallmentPlan ACTIVE, term_months=3 (0% APR), monthly_total=10000."
            - "Customer pays one installment → PaymentEvent INSTALLMENT_PAID amount=10000 → paid_amount_cents=10000."
          trigger:
            - "POST /aesthetics/plans/{id}/cancel."
          assert:
            - "After cancel: a PaymentEvent with kind=='REFUND' and amount_cents==10000 exists."
            - "Sum(PaymentEvent.amount_cents for kind='INSTALLMENT_PAID' under this plan) - Sum(PaymentEvent.amount_cents for kind='REFUND' under this plan) == 0 (net customer outflow restored to zero)."
            - "InstallmentPlan.status == 'REFUNDED'."

      - name: project_inventory_invariant_on_off_shelf_return
        grounds:
          - state_machines.Project.ON_SHELF_to_OFF_SHELF
          - state_machines.Project.OFF_SHELF_to_ON_SHELF
          - entities.Project.fields.status
        distinguishing_aspect: |
          Conserved quantity (DIFFERENT type from cash): number of ON_SHELF projects in
          the catalog before-and-after a forward+compensating pair. Forward action is
          take-off-shelf (decrements the count by 1); compensating action is
          return-to-shelf (increments by 1). The invariant is the count of Project rows
          with status=ON_SHELF, pinned as the formula:
            on_shelf_count = COUNT(Project WHERE status = 'ON_SHELF')
          After the full pair, on_shelf_count is unchanged.
        test_recipe:
          setup:
            - "Three projects P1, P2, P3 all ON_SHELF; on_shelf_count_initial = 3."
          trigger:
            - "POST /aesthetics/projects/{P2}/take-off-shelf."
            - "Snapshot on_shelf_count_intermediate."
            - "POST /aesthetics/projects/{P2}/return-to-shelf."
          assert:
            - "on_shelf_count_intermediate == 2 (decremented after take-off-shelf)."
            - "After return-to-shelf, COUNT(Project WHERE status='ON_SHELF') == 3 (equal to on_shelf_count_initial)."
            - "Project P2.status == 'ON_SHELF' after the compensating action."
