# =============================================================================
# PRD Benchmark Seed Tables — Vacation Bible School & Seasonal Program Registration
# =============================================================================

scenario: |
  2018. Vacation Bible School & Seasonal Program Registration (congregation VBS program): registration with age/grade grouping & capacity, volunteer recruitment, screening & role assignment, curriculum kit ordering & supply distribution, daily check-in/check-out security tags, allergy & medical need accommodation, snack/craft supply logistics, family communication & closing program, next-year retention list

domain_name: vacation-bible-school
api_prefix: /vbs

complexity_profile:
  primary_archetype: quota_allocation        # finite classroom seats: reserved, committed, released, waitlist waterfall
  secondary_archetype: compliance_audit      # volunteer screening, two-adult rule, allergen safety gates, tag-audited pickup
  complexity_layers:
    - optimistic_concurrency                 # OCC on Classroom.version / Child.version / Program.version
    - cascading_side_effects                 # cancel -> seat flip -> waitlist promotion; clearance -> auto-confirm -> staffing recompute
    - rate_threshold_triggers                # capacity fill, staffing ratio thresholds, retention tier breakpoints
    - derived_field_reconciliation           # enrolled_count, reserved_quantity, budget_remaining recomputed from source rows
  entity_topology: flat                      # peer entities joined by foreign keys; only computed-read/action paths nest
  state_machine_shape: branching             # Registration forks ENROLLED|WAITLISTED at creation, OFFERED fans out to 3 terminals; ScreeningCheck cyclic
  relationship_patterns:
    - one_to_many                            # Program->Classroom, Family->Child, Volunteer->ScreeningCheck
    - many_to_many                           # Registration (Child x Classroom), RoleAssignment (Volunteer x Classroom)
    - cross_aggregate                        # SupplyDistribution spans SupplyItem x Classroom x ProgramDay
  role_model: segregation_of_duties          # screener != assigner; parent != check-in staff; self-review forbidden
  consistency_model: immediate               # every mutation + cascade visible in the same request's response/read-after-write

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (17 entities)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: program_year, type: integer, source: input, description: "Calendar year of the program" }
      - { name: start_date, type: string, source: input, description: "ISO date of first program day; inclusive range start for overlap checks" }
      - { name: end_date, type: string, source: input, description: "ISO date of last program day; must be >= start_date; inclusive range end" }
      - { name: registration_opens_at, type: datetime, source: input, description: "Registration window open instant (inclusive), evaluated against the logical clock" }
      - { name: registration_closes_at, type: datetime, source: input, description: "Registration window close instant (inclusive); must be > registration_opens_at" }
      - { name: supply_budget_cents, type: integer, source: input, description: "Total curriculum-kit budget in cents; >= 0" }
      - { name: child_staff_ratio, type: integer, source: input, default: 8, description: "Max enrolled children per confirmed cleared adult; >= 1" }
      - { name: waitlist_offer_ttl_hours, type: integer, source: input, default: 48, description: "Hours a waitlist offer stays open before expiry; >= 1" }
      - { name: pickup_cutoff_time, type: string, source: input, default: "12:00", description: "HH:MM 24h pickup deadline on each program day; checkout strictly after is late" }
      - { name: status, type: enum, source: system, description: "DRAFT | REGISTRATION_OPEN | REGISTRATION_CLOSED | IN_SESSION | COMPLETED | ARCHIVED" }
      - { name: current_day_index, type: integer, source: system, default: 0, description: "day_index of the currently OPEN day; 0 when no day is open" }
      - { name: enrolled_total, type: integer, source: computed, description: "Count of Registrations with status ENROLLED across classrooms of this program with status != CLOSED" }
      - { name: waitlist_total, type: integer, source: computed, description: "Count of Registrations with status WAITLISTED across classrooms of this program" }

  - name: Classroom
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: name, type: string, source: input, description: "Classroom display name" }
      - { name: age_min, type: integer, source: input, description: "Minimum age (whole years at program start_date), inclusive; >= 0" }
      - { name: age_max, type: integer, source: input, description: "Maximum age (whole years at program start_date), inclusive; >= age_min" }
      - { name: capacity, type: integer, source: input, description: "Maximum simultaneous seat occupants (ENROLLED + OFFERED); >= 1" }
      - { name: status, type: enum, source: system, description: "SETUP | ACCEPTING | FULL | CLOSED" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Registrations in this classroom with status ENROLLED" }
      - { name: offered_count, type: integer, source: computed, description: "Count of Registrations in this classroom with status OFFERED (seat reserved)" }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of Registrations in this classroom with status WAITLISTED" }
      - { name: open_seats, type: integer, source: computed, description: "capacity - enrolled_count - offered_count" }
      - { name: required_adults, type: integer, source: computed, description: "0 when enrolled_count == 0; else max(2, ceil(enrolled_count / program.child_staff_ratio))" }
      - { name: confirmed_adult_count, type: integer, source: computed, description: "Count of CONFIRMED RoleAssignments with role in {LEAD_TEACHER, ASSISTANT_TEACHER} whose Volunteer has status CLEARED and is_minor == false" }
      - { name: staffing_status, type: enum, source: computed, description: "ADEQUATE when confirmed_adult_count >= required_adults; UNSTAFFED when confirmed_adult_count == 0 and required_adults > 0; else UNDERSTAFFED" }

  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: household_name, type: string, source: input, description: "Household display name" }
      - { name: primary_contact_name, type: string, source: input, description: "Primary contact full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across all families (including ARCHIVED)" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: preferred_contact, type: enum, source: input, default: EMAIL, description: "EMAIL | PHONE | TEXT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED (soft delete)" }

  - name: Child
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; owning household" }
      - { name: first_name, type: string, source: input, description: "Child first name" }
      - { name: last_name, type: string, source: input, description: "Child last name" }
      - { name: birth_date, type: string, source: input, description: "ISO date of birth" }
      - { name: grade_completed, type: enum, source: input, description: "PRE_K | KINDERGARTEN | GRADE_1 | GRADE_2 | GRADE_3 | GRADE_4 | GRADE_5 | GRADE_6" }
      - { name: has_special_needs, type: boolean, source: input, default: false, description: "When true, an APPROVED AccommodationPlan is required before check-in" }
      - { name: allergy_summary, type: string, source: input, default: "", description: "Free-text allergy note; structured allergens live on AccommodationPlan" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id" }
      - { name: classroom_id, type: string, source: input, description: "FK -> Classroom.id; requested classroom" }
      - { name: status, type: enum, source: system, description: "ENROLLED | WAITLISTED | OFFERED | CANCELLED | DECLINED | EXPIRED" }
      - { name: age_at_registration, type: integer, source: computed, description: "Child age in whole years on program start_date; birthday exactly on start_date counts as turned" }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based rank among WAITLISTED registrations of the same classroom ordered by created_at ASC; null when not WAITLISTED" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Set at promotion: promotion instant + program.waitlist_offer_ttl_hours; null otherwise" }
      - { name: enrolled_at, type: datetime, source: system, description: "Instant the registration entered ENROLLED; null until then" }
      - { name: cancellation_reason, type: enum, source: system, description: "FAMILY_REQUEST | ADMIN | CLASSROOM_CLOSED; null unless CANCELLED" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program served" }
      - { name: full_name, type: string, source: input, description: "Volunteer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: birth_date, type: string, source: input, description: "ISO date of birth" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; optional link used for retention volunteer bonus; null allowed", default: null }
      - { name: is_minor, type: boolean, source: computed, description: "true when age at program start_date is strictly < 18" }
      - { name: status, type: enum, source: system, description: "APPLIED | SCREENING | CLEARED | REJECTED" }

  - name: ScreeningCheck
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: check_type, type: enum, source: input, description: "BACKGROUND | REFERENCE | SAFE_MINISTRY_TRAINING" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CLEARED | REJECTED | INFO_REQUESTED" }
      - { name: decision_notes, type: string, source: system, description: "Notes supplied at decide time; null until decided" }
      - { name: response_notes, type: string, source: system, description: "Notes supplied at resubmit time; null until resubmitted" }
      - { name: resubmission_count, type: integer, source: system, default: 0, description: "Number of INFO_REQUESTED -> SUBMITTED cycles this check has undergone" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the SafetyOfficer who last decided; null until decided" }
      - { name: decided_at, type: datetime, source: system, description: "Instant of the last decision; null until decided" }

  - name: RoleAssignment
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: classroom_id, type: string, source: input, description: "FK -> Classroom.id" }
      - { name: role, type: enum, source: input, description: "LEAD_TEACHER | ASSISTANT_TEACHER | SNACK_COORDINATOR | CRAFT_LEADER | CHECKIN_DESK" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | RELEASED" }
      - { name: confirmed_at, type: datetime, source: system, description: "Instant of CONFIRMED transition; null until confirmed" }
      - { name: released_at, type: datetime, source: system, description: "Instant of RELEASED transition; null until released" }

  - name: AccommodationPlan
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id" }
      - { name: severity, type: enum, source: input, description: "FOOD_ALLERGY | ENVIRONMENTAL_ALLERGY | MEDICATION_ADMIN | MOBILITY | BEHAVIORAL" }
      - { name: allergens, type: array, source: input, description: "Array of PEANUT | TREE_NUT | MILK | EGG | GLUTEN | SOY | SESAME | OTHER; required and non-empty iff severity == FOOD_ALLERGY, forbidden otherwise" }
      - { name: instructions, type: string, source: input, description: "Care instructions" }
      - { name: requires_epinephrine, type: boolean, source: input, default: false, description: "Whether an epinephrine kit must travel with the child" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | NEEDS_REVISION | SUPERSEDED" }
      - { name: revision_notes, type: string, source: system, description: "Notes supplied when revision was requested; null otherwise" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the SafetyOfficer who last reviewed; null until reviewed" }

  - name: SupplyOrder
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: kit_name, type: string, source: input, description: "Curriculum kit name" }
      - { name: vendor, type: string, source: input, description: "Vendor name" }
      - { name: quantity, type: integer, source: input, description: "Kits ordered; >= 1" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Cost per kit in cents; >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | CANCELLED" }
      - { name: total_cost_cents, type: integer, source: computed, description: "quantity * unit_cost_cents (integer arithmetic, no rounding)" }
      - { name: recommended_provisional, type: integer, source: computed, description: "ceil(program.enrolled_total * 1.10); planning variant" }
      - { name: required_final, type: integer, source: computed, description: "ceil(program.enrolled_total * 1.10) + count of program classrooms with status != CLOSED; submit-time validation variant" }

  - name: SupplyItem
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Item name" }
      - { name: category, type: enum, source: input, description: "SNACK | CRAFT" }
      - { name: unit, type: string, source: input, description: "Stocking unit label (pack, box, bottle)" }
      - { name: quantity_on_hand, type: integer, source: input, description: "Physical units on hand; >= 0; set at creation, thereafter mutated only by restock (+) and distribution issue (-)" }
      - { name: reserved_quantity, type: integer, source: computed, description: "Sum of quantity over this item's SupplyDistributions with status PLANNED" }
      - { name: available_quantity, type: integer, source: computed, description: "quantity_on_hand - reserved_quantity" }
      - { name: allergen_tags, type: array, source: input, default: [], description: "Subset of the allergen enum; meaningful for SNACK items" }
      - { name: restock_threshold, type: integer, source: input, default: 0, description: "Advisory low-water mark; >= 0" }

  - name: SupplyDistribution
    parent: null
    common_fields: true
    fields:
      - { name: supply_item_id, type: string, source: input, description: "FK -> SupplyItem.id" }
      - { name: classroom_id, type: string, source: input, description: "FK -> Classroom.id" }
      - { name: program_day_id, type: string, source: input, description: "FK -> ProgramDay.id" }
      - { name: quantity, type: integer, source: input, description: "Units distributed; >= 1" }
      - { name: status, type: enum, source: system, description: "PLANNED | ISSUED | CANCELLED" }
      - { name: issued_at, type: datetime, source: system, description: "Instant of issue; null until ISSUED" }

  - name: ProgramDay
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: day_index, type: integer, source: system, description: "1-based sequence assigned at creation in append order" }
      - { name: date, type: string, source: input, description: "ISO date; must be program start_date for the first day, else exactly previous day + 1 calendar day; within [start_date, end_date]" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED" }
      - { name: checked_in_count, type: integer, source: computed, description: "AttendanceRecords of this day with status CHECKED_IN or CHECKED_OUT" }
      - { name: checked_out_count, type: integer, source: computed, description: "AttendanceRecords of this day with status CHECKED_OUT" }
      - { name: absent_count, type: integer, source: computed, description: "AttendanceRecords of this day with status ABSENT" }

  - name: SecurityTag
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: system, description: "FK -> Child.id; set from the check-in context" }
      - { name: program_day_id, type: string, source: system, description: "FK -> ProgramDay.id; set from the check-in context" }
      - { name: tag_code, type: string, source: system, description: "6-digit zero-padded code; assigned deterministically per program_day in issuance order starting at 000001; reprints take the next sequence value; unique among non-VOIDED tags of the same program_day" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | VOIDED" }
      - { name: void_reason, type: enum, source: system, description: "REPRINT; null unless VOIDED (day close never voids tags because close is blocked while any child is CHECKED_IN, and a tag exists only for CHECKED_IN children)" }
      - { name: issued_at, type: datetime, source: system, description: "Instant of issuance" }
      - { name: redeemed_at, type: datetime, source: system, description: "Instant of redemption; null unless REDEEMED" }

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: system, description: "FK -> Child.id" }
      - { name: program_day_id, type: string, source: system, description: "FK -> ProgramDay.id" }
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; the ENROLLED registration backing this record" }
      - { name: status, type: enum, source: system, description: "NOT_ARRIVED | CHECKED_IN | CHECKED_OUT | ABSENT" }
      - { name: tag_code, type: string, source: system, description: "Code of the currently active (ISSUED) SecurityTag for this record; null before check-in" }
      - { name: checked_in_at, type: datetime, source: system, description: "Instant of check-in; null until CHECKED_IN" }
      - { name: checked_out_at, type: datetime, source: system, description: "Instant of check-out; null until CHECKED_OUT" }
      - { name: checked_in_by, type: string, source: system, description: "X-User-ID of the CheckInStaff who checked the child in" }
      - { name: checked_out_by, type: string, source: system, description: "X-User-ID of the CheckInStaff who checked the child out" }
      - { name: pickup_person, type: string, source: system, description: "Name of the authorized pickup adult presented at check-out" }
      - { name: late_pickup, type: boolean, source: computed, description: "true iff checked_out_at is strictly after program_day.date + program.pickup_cutoff_time; equality is NOT late" }

  - name: FamilyMessage
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: subject, type: string, source: input, description: "Message subject" }
      - { name: body, type: string, source: input, description: "Message body" }
      - { name: audience, type: enum, source: input, description: "ALL_FAMILIES | CLASSROOM | ALLERGY_ALERT | VOLUNTEERS" }
      - { name: classroom_id, type: string, source: input, description: "FK -> Classroom.id; required iff audience == CLASSROOM, forbidden otherwise", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | CANCELLED" }
      - { name: recipient_count, type: integer, source: computed, description: "Distinct recipient count resolved at send per audience rule; 0 until SENT" }
      - { name: sent_at, type: datetime, source: system, description: "Instant of send; null until SENT" }

  - name: RetentionEntry
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; set by retention generation" }
      - { name: child_id, type: string, source: system, description: "FK -> Child.id; set by retention generation" }
      - { name: attended_days, type: integer, source: computed, description: "Count of the child's AttendanceRecords in this program with status CHECKED_OUT" }
      - { name: attendance_rate, type: number, source: computed, description: "round_half_up(attended_days / total program days, 4 decimal places)" }
      - { name: family_volunteer_bonus, type: boolean, source: computed, description: "true iff some Volunteer with family_id == child.family_id has a RoleAssignment that reached CONFIRMED (status CONFIRMED or RELEASED)" }
      - { name: priority_tier, type: enum, source: computed, description: "A when attendance_rate >= 0.80 or (>= 0.60 and bonus); else B when attendance_rate >= 0.50 or bonus; else C" }
      - { name: status, type: enum, source: system, description: "LISTED | INVITED | RESPONDED_YES | RESPONDED_NO" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /vbs/programs/{program_id}/open-registration"
        actor: ProgramDirector
        preconditions:
          - "program.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "Every Classroom of this program with status SETUP flips to ACCEPTING (increments each such Classroom.version by 1)"
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /vbs/programs/{program_id}/close-registration"
        actor: ProgramDirector
        preconditions:
          - "program.status == REGISTRATION_OPEN (ERR_INVALID_STATE)"
        side_effects: []
      - from: REGISTRATION_CLOSED
        to: IN_SESSION
        trigger: "POST /vbs/programs/{program_id}/start-session"
        actor: ProgramDirector
        preconditions:
          - "program.status == REGISTRATION_CLOSED (ERR_INVALID_STATE)"
          - "At least one ProgramDay exists for this program (ERR_NO_PROGRAM_DAYS)"
        side_effects: []
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /vbs/programs/{program_id}/complete"
        actor: ProgramDirector
        preconditions:
          - "program.status == IN_SESSION (ERR_INVALID_STATE)"
          - "Every ProgramDay of this program has status CLOSED (ERR_DAYS_STILL_OPEN)"
        side_effects: []
      - from: COMPLETED
        to: ARCHIVED
        trigger: "POST /vbs/programs/{program_id}/archive"
        actor: ProgramDirector
        preconditions:
          - "program.status == COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "Program becomes read-only; all write endpoints targeting it or its children return ERR_INVALID_STATE"

  - entity: Classroom
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: ACCEPTING
        trigger: "system (when owning Program transitions DRAFT -> REGISTRATION_OPEN); classrooms created while program is already REGISTRATION_OPEN are born ACCEPTING"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTING
        to: FULL
        trigger: "system (when open_seats reaches 0 after a registration enrolls)"
        actor: system
        preconditions:
          - "open_seats == 0"
        side_effects:
          - "increments Classroom.version by 1"
      - from: FULL
        to: ACCEPTING
        trigger: "system (when open_seats rises above 0 after a cancellation or capacity increase)"
        actor: system
        preconditions:
          - "open_seats >= 1"
        side_effects:
          - "increments Classroom.version by 1"
          - "Immediately runs the waitlist promotion loop (calculation waitlist_promotion_loop)"
      - from: ACCEPTING
        to: CLOSED
        trigger: "POST /vbs/classrooms/{classroom_id}/close"
        actor: RegistrationCoordinator
        preconditions:
          - "classroom.enrolled_count == 0 (ERR_CLASSROOM_NOT_EMPTY)"
        side_effects:
          - "Every Registration of this classroom with status WAITLISTED or OFFERED transitions to CANCELLED with cancellation_reason CLASSROOM_CLOSED"
          - "PROPOSED RoleAssignments of this classroom are unaffected; CONFIRMED RoleAssignments transition to RELEASED"
      - from: FULL
        to: CLOSED
        trigger: "POST /vbs/classrooms/{classroom_id}/close"
        actor: RegistrationCoordinator
        preconditions:
          - "classroom.enrolled_count == 0 (ERR_CLASSROOM_NOT_EMPTY) — unreachable when FULL unless capacity was edited; same handling"
        side_effects:
          - "Same as ACCEPTING -> CLOSED"
      - from: SETUP
        to: CLOSED
        trigger: "POST /vbs/classrooms/{classroom_id}/close"
        actor: RegistrationCoordinator
        preconditions:
          - "classroom.enrolled_count == 0 (ERR_CLASSROOM_NOT_EMPTY)"
        side_effects:
          - "Same as ACCEPTING -> CLOSED"

  - entity: Registration
    initial_state: ENROLLED
    terminal_states: [CANCELLED, DECLINED, EXPIRED]
    transitions:
      - from: "(create)"
        to: ENROLLED
        trigger: "POST /vbs/registrations when classroom.open_seats >= 1"
        actor: Parent | RegistrationCoordinator
        preconditions:
          - "Full creation validation chain (see validations P0-P10)"
        side_effects:
          - "enrolled_at set to now; if open_seats becomes 0 the classroom flips ACCEPTING -> FULL"
          - "If the owning program is IN_SESSION and a ProgramDay is currently OPEN, create an AttendanceRecord(status NOT_ARRIVED) for (child, that day)"
      - from: "(create)"
        to: WAITLISTED
        trigger: "POST /vbs/registrations when classroom.open_seats == 0"
        actor: Parent | RegistrationCoordinator
        preconditions:
          - "Full creation validation chain (see validations P0-P10)"
        side_effects:
          - "waitlist_position assigned per waitlist_position_ordering"
      - from: WAITLISTED
        to: OFFERED
        trigger: "system (waitlist promotion loop after a seat frees, an offer is declined/expired, or POST /vbs/programs/{program_id}/sweep-expired-offers)"
        actor: system
        preconditions:
          - "classroom.open_seats >= 1 and this registration has the smallest waitlist_position in the classroom"
        side_effects:
          - "offer_expires_at = now + program.waitlist_offer_ttl_hours"
          - "waitlist_position set to null; remaining WAITLISTED positions recompute"
      - from: OFFERED
        to: ENROLLED
        trigger: "POST /vbs/registrations/{registration_id}/accept"
        actor: Parent
        preconditions:
          - "registration.status == OFFERED (ERR_INVALID_STATE)"
          - "now < offer_expires_at (ERR_OFFER_EXPIRED — on failure the registration transitions to EXPIRED and the promotion loop runs for the classroom)"
          - "classroom.enrolled_count < classroom.capacity (ERR_CLASSROOM_FULL — the OFFERED reservation survives a capacity shrink, so accept re-checks)"
        side_effects:
          - "enrolled_at set to now; offer_expires_at cleared"
          - "If the owning program is IN_SESSION and a ProgramDay is currently OPEN, create an AttendanceRecord(status NOT_ARRIVED) for (child, that day)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /vbs/registrations/{registration_id}/decline"
        actor: Parent
        preconditions:
          - "registration.status == OFFERED (ERR_INVALID_STATE)"
        side_effects:
          - "Runs the waitlist promotion loop for the classroom (freed reservation)"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (POST /vbs/programs/{program_id}/sweep-expired-offers flips every OFFERED registration whose offer_expires_at <= now; also applied inline on a late accept)"
        actor: system
        preconditions:
          - "offer_expires_at <= now"
        side_effects:
          - "Runs the waitlist promotion loop for the classroom (freed reservation)"
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /vbs/registrations/{registration_id}/cancel; also cascaded by family archive"
        actor: Parent | RegistrationCoordinator | system
        preconditions:
          - "registration.status == ENROLLED (ERR_INVALID_STATE)"
        side_effects:
          - "cancellation_reason set (FAMILY_REQUEST for Parent, ADMIN for coordinator/system cascades)"
          - "classroom enrolled_count drops by 1; if the classroom was FULL it flips FULL -> ACCEPTING, which runs the waitlist promotion loop"
          - "AttendanceRecords for this registration with status NOT_ARRIVED on days with status SCHEDULED or OPEN are deleted (the child is no longer expected)"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /vbs/registrations/{registration_id}/cancel; also cascaded by family archive or classroom close"
        actor: Parent | RegistrationCoordinator | system
        preconditions:
          - "registration.status == WAITLISTED (ERR_INVALID_STATE)"
        side_effects:
          - "Remaining WAITLISTED positions of the classroom recompute"

  - entity: Family
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /vbs/families/{family_id}/archive"
        actor: RegistrationCoordinator
        preconditions:
          - "family.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "For every Child of this family: every Registration with status in {ENROLLED, WAITLISTED, OFFERED} transitions to CANCELLED with cancellation_reason ADMIN"
          - "Each ENROLLED cancellation runs its normal cascade (seat flip + waitlist promotion loop)"

  - entity: Volunteer
    initial_state: APPLIED
    terminal_states: [REJECTED]
    transitions:
      - from: APPLIED
        to: SCREENING
        trigger: "system (when the volunteer's first ScreeningCheck is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCREENING
        to: CLEARED
        trigger: "system (when the volunteer holds a CLEARED ScreeningCheck for every type in {BACKGROUND, REFERENCE, SAFE_MINISTRY_TRAINING})"
        actor: system
        preconditions: []
        side_effects:
          - "Every RoleAssignment of this volunteer with status PROPOSED auto-transitions to CONFIRMED, EXCEPT any that would violate the one-LEAD_TEACHER-per-classroom or child-facing double-booking rules — those stay PROPOSED"
          - "Each auto-confirm sets confirmed_at and recomputes the classroom's confirmed_adult_count and staffing_status"
      - from: SCREENING
        to: REJECTED
        trigger: "system (when any ScreeningCheck of this volunteer transitions to REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "All other ScreeningChecks of this volunteer still SUBMITTED or INFO_REQUESTED remain unchanged"

  - entity: ScreeningCheck
    initial_state: SUBMITTED
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /vbs/screening-checks/{check_id}/decide with decision CLEARED"
        actor: SafetyOfficer
        preconditions:
          - "check.status == SUBMITTED (ERR_INVALID_STATE)"
          - "X-User-ID != check.volunteer_id (ERR_SELF_REVIEW_FORBIDDEN)"
        side_effects:
          - "reviewer_id, decision_notes, decided_at set"
          - "Volunteer status recompute: SCREENING -> CLEARED when all three required types are CLEARED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vbs/screening-checks/{check_id}/decide with decision REJECTED"
        actor: SafetyOfficer
        preconditions:
          - "check.status == SUBMITTED (ERR_INVALID_STATE)"
          - "X-User-ID != check.volunteer_id (ERR_SELF_REVIEW_FORBIDDEN)"
        side_effects:
          - "reviewer_id, decision_notes, decided_at set"
          - "Volunteer status recompute: SCREENING -> REJECTED"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /vbs/screening-checks/{check_id}/decide with decision INFO_REQUESTED"
        actor: SafetyOfficer
        preconditions:
          - "check.status == SUBMITTED (ERR_INVALID_STATE)"
          - "X-User-ID != check.volunteer_id (ERR_SELF_REVIEW_FORBIDDEN)"
        side_effects:
          - "reviewer_id, decision_notes, decided_at set"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /vbs/screening-checks/{check_id}/resubmit"
        actor: Volunteer
        preconditions:
          - "check.status == INFO_REQUESTED (ERR_INVALID_STATE)"
          - "X-User-ID == check.volunteer_id (ERR_FORBIDDEN)"
        side_effects:
          - "resubmission_count += 1; response_notes set"

  - entity: RoleAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /vbs/role-assignments/{assignment_id}/confirm; or system auto-confirm when the volunteer transitions to CLEARED"
        actor: VolunteerCoordinator | system
        preconditions:
          - "assignment.status == PROPOSED (ERR_INVALID_STATE)"
          - "volunteer.status == CLEARED (ERR_VOLUNTEER_NOT_CLEARED)"
          - "If role == LEAD_TEACHER: no other CONFIRMED LEAD_TEACHER assignment exists in this classroom (ERR_LEAD_TEACHER_TAKEN); auto-confirm skips instead of erroring"
          - "If role in {LEAD_TEACHER, ASSISTANT_TEACHER}: volunteer holds no other CONFIRMED child-facing assignment in any other classroom of the same program (ERR_VOLUNTEER_DOUBLE_BOOKED); auto-confirm skips instead of erroring"
        side_effects:
          - "confirmed_at set; classroom confirmed_adult_count and staffing_status recompute"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /vbs/role-assignments/{assignment_id}/release; also cascaded by classroom close"
        actor: VolunteerCoordinator | system
        preconditions:
          - "assignment.status == CONFIRMED (ERR_INVALID_STATE)"
        side_effects:
          - "released_at set; classroom confirmed_adult_count and staffing_status recompute"

  - entity: AccommodationPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vbs/accommodation-plans/{plan_id}/submit"
        actor: Parent
        preconditions:
          - "plan.status in {DRAFT, NEEDS_REVISION} (ERR_INVALID_STATE)"
        side_effects: []
      - from: NEEDS_REVISION
        to: SUBMITTED
        trigger: "POST /vbs/accommodation-plans/{plan_id}/submit"
        actor: Parent
        preconditions:
          - "plan.status in {DRAFT, NEEDS_REVISION} (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vbs/accommodation-plans/{plan_id}/approve (OCC: expected_child_version)"
        actor: SafetyOfficer
        preconditions:
          - "plan.status == SUBMITTED (ERR_INVALID_STATE)"
          - "expected_child_version == child.version (ERR_STALE_VERSION)"
        side_effects:
          - "reviewed_by set"
          - "Every OTHER AccommodationPlan of the same child with status APPROVED transitions to SUPERSEDED"
          - "increments Child.version by 1 (the supersede mutates the child's plan set)"
      - from: SUBMITTED
        to: NEEDS_REVISION
        trigger: "POST /vbs/accommodation-plans/{plan_id}/request-revision"
        actor: SafetyOfficer
        preconditions:
          - "plan.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "revision_notes, reviewed_by set"

  - entity: SupplyOrder
    initial_state: DRAFT
    terminal_states: [APPROVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vbs/supply-orders/{order_id}/submit"
        actor: ProgramDirector
        preconditions:
          - "order.status == DRAFT (ERR_INVALID_STATE)"
          - "quantity >= required_final at submit time (ERR_KIT_QUANTITY_SHORT)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /vbs/supply-orders/{order_id}/return-for-revision"
        actor: ProgramDirector
        preconditions:
          - "order.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vbs/supply-orders/{order_id}/approve"
        actor: ProgramDirector
        preconditions:
          - "order.status == SUBMITTED (ERR_INVALID_STATE)"
          - "total_cost_cents <= program budget_remaining_cents at approval time (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "budget_remaining_cents decreases by total_cost_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /vbs/supply-orders/{order_id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "order.status in {DRAFT, SUBMITTED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /vbs/supply-orders/{order_id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "order.status in {DRAFT, SUBMITTED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: SupplyDistribution
    initial_state: PLANNED
    terminal_states: [ISSUED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ISSUED
        trigger: "POST /vbs/supply-distributions/{distribution_id}/issue"
        actor: ProgramDirector | RegistrationCoordinator
        preconditions:
          - "distribution.status == PLANNED (ERR_INVALID_STATE)"
        side_effects:
          - "supply_item.quantity_on_hand -= quantity; reserved_quantity -= quantity; issued_at set"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /vbs/supply-distributions/{distribution_id}/cancel"
        actor: ProgramDirector | RegistrationCoordinator
        preconditions:
          - "distribution.status == PLANNED (ERR_INVALID_STATE)"
        side_effects:
          - "reserved_quantity -= quantity; quantity_on_hand unchanged"

  - entity: ProgramDay
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /vbs/days/{day_id}/open"
        actor: ProgramDirector
        preconditions:
          - "day.status == SCHEDULED (ERR_INVALID_STATE)"
          - "program.status == IN_SESSION (ERR_INVALID_STATE)"
          - "day.date == current logical date (ERR_DAY_NOT_TODAY)"
          - "Every Classroom of the program with enrolled_count > 0 has staffing_status == ADEQUATE (ERR_STAFFING_INADEQUATE)"
        side_effects:
          - "program.current_day_index = day.day_index"
          - "For every Registration of the program with status ENROLLED: create AttendanceRecord(status NOT_ARRIVED) for (registration.child_id, this day)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /vbs/days/{day_id}/close"
        actor: ProgramDirector
        preconditions:
          - "day.status == OPEN (ERR_INVALID_STATE)"
          - "No AttendanceRecord of this day has status CHECKED_IN (ERR_CHILDREN_ON_SITE)"
        side_effects:
          - "Every AttendanceRecord of this day with status NOT_ARRIVED transitions to ABSENT"
          - "program.current_day_index reset to 0"

  - entity: AttendanceRecord
    initial_state: NOT_ARRIVED
    terminal_states: [CHECKED_OUT, ABSENT]
    transitions:
      - from: NOT_ARRIVED
        to: CHECKED_IN
        trigger: "POST /vbs/attendance/check-in"
        actor: CheckInStaff
        preconditions:
          - "SAFETY (priority 5): if child.has_special_needs, the child holds an AccommodationPlan with status APPROVED (ERR_ACCOMMODATION_NOT_APPROVED)"
          - "program_day.status == OPEN (ERR_INVALID_STATE)"
          - "record.status == NOT_ARRIVED (ERR_INVALID_STATE); when no AttendanceRecord exists for (child, day) on an OPEN day, the enrollment check below decides the error"
          - "child holds a Registration with status ENROLLED for the day's program (ERR_NOT_ENROLLED)"
        side_effects:
          - "checked_in_at, checked_in_by set"
          - "A SecurityTag(status ISSUED) is created for (child, day) with a fresh tag_code; record.tag_code set to that code"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /vbs/attendance/check-out"
        actor: CheckInStaff
        preconditions:
          - "record.status == CHECKED_IN (ERR_INVALID_STATE)"
          - "payload tag_code equals the code of a SecurityTag for (child, day): if it matches a VOIDED or REDEEMED tag -> ERR_TAG_NOT_ACTIVE; if it matches no tag -> ERR_TAG_MISMATCH"
        side_effects:
          - "checked_out_at, checked_out_by, pickup_person set; late_pickup computed"
          - "The matching SecurityTag transitions ISSUED -> REDEEMED (redeemed_at set)"
      - from: NOT_ARRIVED
        to: ABSENT
        trigger: "system (when the owning ProgramDay closes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SecurityTag
    initial_state: ISSUED
    terminal_states: [REDEEMED, VOIDED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "system (successful check-out presenting this tag's code)"
        actor: system
        preconditions: []
        side_effects:
          - "redeemed_at set"
      - from: ISSUED
        to: VOIDED
        trigger: "system (POST /vbs/attendance/reprint-tag with void_reason REPRINT; or day close with void_reason DAY_CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "On REPRINT: a replacement SecurityTag(status ISSUED, new tag_code) is created for the same (child, day) and the AttendanceRecord.tag_code is updated"

  - entity: FamilyMessage
    initial_state: DRAFT
    terminal_states: [SENT, CANCELLED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /vbs/messages/{message_id}/send"
        actor: ProgramDirector
        preconditions:
          - "message.status == DRAFT (ERR_INVALID_STATE)"
          - "If audience == CLASSROOM then classroom_id must be present (ERR_INVALID_REQUEST)"
        side_effects:
          - "recipient_count computed per recipient_count_resolution; sent_at set"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /vbs/messages/{message_id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "message.status == DRAFT (ERR_INVALID_STATE)"
        side_effects: []

  - entity: RetentionEntry
    initial_state: LISTED
    terminal_states: [RESPONDED_YES, RESPONDED_NO]
    transitions:
      - from: LISTED
        to: INVITED
        trigger: "POST /vbs/retention-entries/{entry_id}/invite"
        actor: ProgramDirector
        preconditions:
          - "entry.status == LISTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: INVITED
        to: RESPONDED_YES
        trigger: "POST /vbs/retention-entries/{entry_id}/record-response with outcome YES"
        actor: ProgramDirector
        preconditions:
          - "entry.status == INVITED (ERR_INVALID_STATE)"
        side_effects: []
      - from: INVITED
        to: RESPONDED_NO
        trigger: "POST /vbs/retention-entries/{entry_id}/record-response with outcome NO"
        actor: ProgramDirector
        preconditions:
          - "entry.status == INVITED (ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; all three pass the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: classroom-config-stale-update
    parent_entity: Classroom
    write_endpoint: "PATCH /vbs/classrooms/{classroom_id}"
    occ_field: expected_classroom_version
    description: |
      Patching a Classroom's capacity or age band against a version the client
      observed earlier is rejected when the classroom's version has advanced
      since (e.g., a status flip ACCEPTING->FULL or a prior patch). Under the
      product semantics a config edit does not inspect any state field that a
      prior edit changed, so a sequential second edit would otherwise silently
      succeed on a stale view; OCC on Classroom.version resolves it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-approve-stale-child
    parent_entity: Child
    write_endpoint: "POST /vbs/accommodation-plans/{plan_id}/approve"
    occ_field: expected_child_version
    description: |
      Approving an AccommodationPlan supersedes the child's currently APPROVED
      plan. Approving with an expected_child_version older than the child's
      current version means another approve has landed since the client last
      read the child, so the client's supersede target is stale; the request
      is rejected. A sequential second approve is legitimate under the product
      semantics (the newer plan wins), so the stale-view case is resolved by
      OCC on Child.version rather than by any state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: offer-sweep-stale-program
    parent_entity: Program
    write_endpoint: "POST /vbs/programs/{program_id}/sweep-expired-offers"
    occ_field: expected_program_version
    description: |
      Sweeping expired waitlist offers against a program version the client
      observed earlier is rejected when the program's version has advanced
      since. A sweep that finds nothing to expire is a legitimate no-op under
      the product semantics, so a sequential second sweep would succeed even
      on a stale view; OCC on Program.version resolves it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: age_at_registration
    trigger: "registration creation (POST /vbs/registrations); also volunteer is_minor derivation against the same program start_date"
    algorithm: chronological
    formula: |
      age = program.start_date.year - child.birth_date.year
      if (program.start_date.month, program.start_date.day) < (child.birth_date.month, child.birth_date.day):
          age -= 1
      # A birthday exactly on start_date counts as TURNED (no decrement).
      # Eligibility: classroom.age_min <= age <= classroom.age_max (both inclusive).
    input_set: "the Child being registered and the Program owning the requested Classroom"
    constants: {}
    precision: "whole years (integer); calendar-month/day comparison, no day-count approximation"

  - name: required_adults_and_staffing
    trigger: "recomputed whenever a classroom's enrolled_count changes or a RoleAssignment transitions"
    algorithm: threshold
    formula: |
      if enrolled_count == 0:
          required_adults = 0
      else:
          required_adults = max(2, ceil(enrolled_count / program.child_staff_ratio))
      confirmed_adult_count = count of RoleAssignment where
          status == CONFIRMED
          and role in {LEAD_TEACHER, ASSISTANT_TEACHER}
          and volunteer.status == CLEARED
          and volunteer.is_minor == false
      if required_adults == 0 or confirmed_adult_count >= required_adults:
          staffing_status = ADEQUATE
      elif confirmed_adult_count == 0:
          staffing_status = UNSTAFFED
      else:
          staffing_status = UNDERSTAFFED
    input_set: "Registrations of the classroom with status ENROLLED; RoleAssignments of the classroom with status CONFIRMED joined to their Volunteer"
    constants:
      TWO_ADULT_MINIMUM: 2
    precision: "integer arithmetic; ceil rounds up to the next whole adult"

  - name: open_seats
    trigger: "recomputed whenever a Registration of the classroom changes status or capacity changes"
    algorithm: aggregation
    formula: |
      open_seats = capacity
                 - count(Registrations where status == ENROLLED)
                 - count(Registrations where status == OFFERED)
      # OFFERED reservations consume seats. WAITLISTED consume none.
    input_set: "Registrations of the classroom with status in {ENROLLED, OFFERED}"
    constants: {}
    precision: "integer"

  - name: waitlist_promotion_loop
    trigger: "classroom flips FULL -> ACCEPTING; an OFFERED registration is DECLINED or EXPIRED; POST /vbs/programs/{program_id}/sweep-expired-offers"
    algorithm: waterfall_allocation
    formula: |
      loop:
          open_seats = open_seats(classroom)          # recompute AFTER every promotion
          if open_seats < 1: stop
          head = WAITLISTED registration of the classroom with smallest created_at
          if none: stop
          head -> OFFERED; offer_expires_at = now + program.waitlist_offer_ttl_hours
          # the new OFFERED consumes a seat, so the next iteration's open_seats is one lower
      # Evaluation order is pinned: promote exactly one, recompute, repeat.
      # Sweep ordering across classrooms: classroom.created_at ASC.
    input_set: "Registrations of the classroom with status WAITLISTED, ordered by created_at ASC (server-assigned monotonic timestamps; no id-based tie-break)"
    constants: {}
    precision: "integer seats; one promotion per iteration"

  - name: kit_recommendation
    trigger: "SupplyOrder read / supply-plan read (both variants); submit validation uses the final variant"
    algorithm: threshold
    formula: |
      base = ceil(program.enrolled_total * KIT_BUFFER_MULT)
      provisional = base
      final = base + count(Classrooms of program where status != CLOSED)
    input_set: "program.enrolled_total (ENROLLED registrations across non-CLOSED classrooms); classroom count excludes CLOSED"
    constants:
      KIT_BUFFER_MULT: 1.10
    precision: "ceil to whole kits after multiplying by 1.10 (e.g., enrolled 5 -> ceil(5.5) = 6)"
    variants:
      - name: provisional
        when: "planning reads: SupplyOrder.recommended_provisional and supply-plan.kit_quantity_provisional"
        difference: "excludes the per-classroom teacher-kit allowance (no +classroom_count term)"
      - name: final
        when: "submit validation (ERR_KIT_QUANTITY_SHORT) and supply-plan.kit_quantity_final"
        difference: "adds one kit per non-CLOSED classroom; for identical enrollment data final > provisional whenever at least one non-CLOSED classroom exists"

  - name: craft_pack_allocation
    trigger: "GET /vbs/programs/{program_id}/supply-plan"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED: round per classroom FIRST, then sum.
      for each Classroom of the program where status != CLOSED:
          units_c = enrolled_count(classroom) * CRAFT_UNITS_PER_CHILD
          packs_c = ceil(units_c / CRAFT_PACK_SIZE)          # per-classroom ceil
      craft_packs_required = sum(packs_c)                    # THEN sum
      # Divergence example: two classrooms with enrolled 4 each -> ceil(12/10)+ceil(12/10) = 2+2 = 4,
      # whereas summing first would give ceil(24/10) = 3.
    input_set: "Classrooms of the program with status != CLOSED and their ENROLLED registrations"
    constants:
      CRAFT_UNITS_PER_CHILD: 3
      CRAFT_PACK_SIZE: 10
    precision: "ceil to whole packs per classroom; integer sum"

  - name: budget_remaining
    trigger: "SupplyOrder approve validation; GET supply-plan"
    algorithm: aggregation
    formula: |
      budget_remaining_cents = program.supply_budget_cents
          - sum(order.total_cost_cents for orders of the program with status == APPROVED)
      # DRAFT, SUBMITTED and CANCELLED orders do NOT consume budget.
      # total_cost_cents = quantity * unit_cost_cents (integer, no rounding).
    input_set: "SupplyOrders of the program with status APPROVED only"
    constants: {}
    precision: "integer cents"

  - name: attendance_rate
    trigger: "attendance-summary read (provisional variant); retention generation (final variant)"
    algorithm: aggregation
    formula: |
      attended_days = count(AttendanceRecord where child_id == child and program_day in program and status == CHECKED_OUT)
      days_closed   = count(ProgramDay of program where status == CLOSED)
      total_days    = count(ProgramDay of program)           # all days, any status
      provisional_rate       = days_closed == 0 ? 0.0 : round_half_up(attended_days / days_closed, 4)
      projected_final_rate   = total_days  == 0 ? 0.0 : round_half_up(attended_days / total_days, 4)
    input_set: "AttendanceRecords of the child in this program with status CHECKED_OUT; ProgramDays of the program"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "mid-program progress reads (GET attendance-summaries): divides by days CLOSED so far"
        difference: "denominator is days_closed; mid-program with perfect attendance yields 1.0000"
      - name: final
        when: "retention generation at program COMPLETED: divides by total program days"
        difference: "denominator is total_days; for identical attendance data mid-program final < provisional whenever unclosed days remain"

  - name: priority_tier
    trigger: "retention generation (POST /vbs/programs/{program_id}/retention-list/generate)"
    algorithm: threshold
    formula: |
      rate = attendance_rate (final variant, 4dp round_half_up)
      bonus = family_volunteer_bonus
      if rate >= 0.80 or (rate >= 0.60 and bonus):  tier = A
      elif rate >= 0.50 or bonus:                   tier = B
      else:                                          tier = C
    input_set: "the child's AttendanceRecords (CHECKED_OUT) and Volunteers with family_id == child.family_id holding an assignment that reached CONFIRMED"
    constants:
      TIER_A_RATE: 0.80
      TIER_A_BONUS_RATE: 0.60
      TIER_B_RATE: 0.50
    precision: "comparisons are >= against the 4-decimal rounded rate (0.8000 qualifies for A; 0.7999 does not)"

  - name: allergen_safety_check
    trigger: "SupplyDistribution creation (POST /vbs/supply-distributions)"
    algorithm: constraint_propagation
    formula: |
      blocked_allergens = union of allergens over AccommodationPlans where
          plan.child has an ENROLLED Registration in the target classroom
          and plan.status == APPROVED
          and plan.severity == FOOD_ALLERGY
      if intersect(item.allergen_tags, blocked_allergens) != {}: reject ERR_ALLERGEN_CONFLICT
    input_set: "APPROVED FOOD_ALLERGY AccommodationPlans of children ENROLLED in the target classroom; the SupplyItem's allergen_tags"
    constants: {}
    precision: "set intersection; empty intersection passes"

  - name: recipient_count_resolution
    trigger: "FamilyMessage send (POST /vbs/messages/{message_id}/send)"
    algorithm: aggregation
    formula: |
      ALL_FAMILIES:   count of DISTINCT families with >= 1 child holding a Registration with status in
                      {ENROLLED, WAITLISTED, OFFERED} in this program
      CLASSROOM:      same rule restricted to registrations in message.classroom_id
      ALLERGY_ALERT:  count of DISTINCT families with >= 1 child holding an APPROVED FOOD_ALLERGY
                      AccommodationPlan and an ENROLLED registration in this program
      VOLUNTEERS:     count of Volunteers of this program with status == CLEARED
      # One recipient per family no matter how many qualifying children it has (dedup by family).
    input_set: "per audience as above; only the statuses listed are included"
    constants: {}
    precision: "integer count after family-level dedup"

  - name: late_pickup
    trigger: "check-out (POST /vbs/attendance/check-out)"
    algorithm: threshold
    formula: |
      cutoff = program_day.date + "T" + program.pickup_cutoff_time + ":00Z"
      late_pickup = checked_out_at > cutoff      # strictly greater; checkout exactly AT the cutoff is NOT late
    input_set: "the AttendanceRecord, its ProgramDay, the owning Program"
    constants: {}
    precision: "second precision on the logical clock; strict >"

  - name: waitlist_position_ordering
    trigger: "registration enters WAITLISTED; any WAITLISTED registration leaves the queue"
    algorithm: chronological
    formula: |
      waitlist_position = 1-based rank of the registration among WAITLISTED registrations
      of the same classroom ordered by created_at ASC (server-assigned monotonic timestamps).
      # created_at is the only ordering key; entity id is never used as a tie-break.
    input_set: "Registrations of the classroom with status WAITLISTED"
    constants: {}
    precision: "integer rank, dense from 1"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 0
    category: existence
    check: "Request body is well-formed: all required fields present, no undeclared fields, enums/ints/dates parse, conditional fields satisfied (allergens required iff severity == FOOD_ALLERGY; classroom_id required iff audience == CLASSROOM), age_min <= age_max, capacity >= 1, quantity >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The role is listed for the endpoint; ownership rules hold (Parent: target child/registration/plan belongs to X-User-ID's family; Volunteer: target check belongs to X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path and body references exist, validated left-to-right (program, then classroom/day/item, then child/volunteer/registration/plan/order/message/entry)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /vbs/classrooms/{id}; POST /vbs/accommodation-plans/{id}/approve; POST /vbs/programs/{id}/sweep-expired-offers"
  - priority: 5
    category: business_safety
    check: "Child-safety gates: screening self-review forbidden (ERR_SELF_REVIEW_FORBIDDEN, 403); special-needs check-in requires an APPROVED AccommodationPlan (ERR_ACCOMMODATION_NOT_APPROVED); snack distribution must not conflict with enrolled children's approved allergens (ERR_ALLERGEN_CONFLICT); day open requires ADEQUATE staffing in every enrolled classroom (ERR_STAFFING_INADEQUATE); day close forbidden while children remain CHECKED_IN (ERR_CHILDREN_ON_SITE)"
    error_id: ERR_SAFETY_FAMILY
    http_status: 409
    applies_to: "screening decide; attendance check-in; supply-distribution create; day open/close"
  - priority: 6
    category: state
    check: "Target resource is in a state that permits the operation (program lifecycle, classroom ACCEPTING/FULL for registration, registration OFFERED for accept/decline, check SUBMITTED for decide, order DRAFT/SUBMITTED gates, day SCHEDULED/OPEN gates, record NOT_ARRIVED/CHECKED_IN gates, message DRAFT, entry LISTED/INVITED, family ACTIVE for archive)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_temporal
    check: "Clock-relative rules, evaluated within this priority in the following order: (i) registration only while program.status == REGISTRATION_OPEN and registration_opens_at <= now <= registration_closes_at (ERR_REGISTRATION_WINDOW_CLOSED); (ii) accept only while now < offer_expires_at (ERR_OFFER_EXPIRED); (iii) day open only when day.date == current date (ERR_DAY_NOT_TODAY); (iv) new program date range must not intersect any non-ARCHIVED program's [start_date, end_date] inclusive (ERR_PROGRAM_DATE_OVERLAP); (v) new program day must lie within [start_date, end_date] (ERR_DAY_OUT_OF_RANGE); (vi) new program day must be start_date (first) or exactly previous day + 1 calendar day (ERR_DAY_NOT_SEQUENTIAL). Note (v) outranks (vi): an out-of-range date reports ERR_DAY_OUT_OF_RANGE even when it also breaks adjacency."
    error_id: ERR_TEMPORAL_FAMILY
    http_status: 409
    applies_to: "registration create/accept; day create/open; program create"
  - priority: 8
    category: business_constraint
    check: "Constraint rules: age band inclusive (ERR_AGE_OUT_OF_RANGE, 422); one active registration per child per program (ERR_DUPLICATE_REGISTRATION); family email unique (ERR_DUPLICATE_EMAIL); one active ScreeningCheck per volunteer per type (ERR_DUPLICATE_CHECK); one active assignment per volunteer per classroom (ERR_DUPLICATE_ASSIGNMENT); one CONFIRMED LEAD_TEACHER per classroom (ERR_LEAD_TEACHER_TAKEN); child-facing double-booking across classrooms forbidden (ERR_VOLUNTEER_DOUBLE_BOOKED); minors may not hold LEAD_TEACHER (ERR_MINOR_ROLE_FORBIDDEN, 422); classroom close requires zero enrolled (ERR_CLASSROOM_NOT_EMPTY); capacity may not shrink below enrolled_count (ERR_CAPACITY_BELOW_ENROLLED); start-session requires >= 1 day (ERR_NO_PROGRAM_DAYS); complete requires all days CLOSED (ERR_DAYS_STILL_OPEN); retention regeneration without force (ERR_RETENTION_EXISTS); check-out tag code matches an ISSUED tag (ERR_TAG_MISMATCH / ERR_TAG_NOT_ACTIVE); check-in requires an ENROLLED registration (ERR_NOT_ENROLLED); accept requires enrolled_count < capacity (ERR_CLASSROOM_FULL)"
    error_id: ERR_CONSTRAINT_FAMILY
    http_status: 409
    applies_to: "per-rule endpoints as listed"
  - priority: 9
    category: business_referential
    check: "Cross-entity state references: family must be ACTIVE to create children or registrations (ERR_FAMILY_ARCHIVED); volunteer must be CLEARED to confirm an assignment (ERR_VOLUNTEER_NOT_CLEARED); distribution's item, classroom and day must all belong to the same program (ERR_CROSS_PROGRAM_REFERENCE)"
    error_id: ERR_REFERENTIAL_FAMILY
    http_status: 409
    applies_to: "child/registration create; assignment confirm; distribution create"
  - priority: 10
    category: business_fiscal
    check: "Fiscal/stock rules, evaluated last: order submit quantity >= required_final (ERR_KIT_QUANTITY_SHORT); order approve total_cost_cents <= budget_remaining_cents (ERR_BUDGET_EXCEEDED, 402); distribution quantity <= item.available_quantity (ERR_INSUFFICIENT_STOCK)"
    error_id: ERR_FISCAL_FAMILY
    http_status: 402
    applies_to: "supply-order submit/approve; distribution create"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Program lifecycle ---
  - { method: POST, path: "/vbs/programs", description: "Create a program (DRAFT). Date range must not overlap any non-ARCHIVED program (inclusive bounds).", roles: [ProgramDirector], code: 201, input: [name, program_year, start_date, end_date, registration_opens_at, registration_closes_at, supply_budget_cents, "child_staff_ratio?", "waitlist_offer_ttl_hours?", "pickup_cutoff_time?"], output: Program, side_effects: ["status=DRAFT, current_day_index=0, version=1"] }
  - { method: GET, path: "/vbs/programs", description: "List programs with pagination. Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator, VolunteerCoordinator, SafetyOfficer, CheckInStaff], code: 200, input: ["status?", "limit?", "offset?"], output: "Program[]", side_effects: [] }
  - { method: GET, path: "/vbs/programs/{program_id}", description: "Get one program", roles: [ProgramDirector, RegistrationCoordinator, VolunteerCoordinator, SafetyOfficer, CheckInStaff, Parent, Volunteer], code: 200, input: [], output: Program, side_effects: [] }
  - { method: POST, path: "/vbs/programs/{program_id}/open-registration", description: "DRAFT -> REGISTRATION_OPEN; flips SETUP classrooms to ACCEPTING", roles: [ProgramDirector], code: 200, input: [], output: Program, side_effects: ["SETUP classrooms -> ACCEPTING (each bumps Classroom.version)", "increments Program.version by 1"] }
  - { method: POST, path: "/vbs/programs/{program_id}/close-registration", description: "REGISTRATION_OPEN -> REGISTRATION_CLOSED", roles: [ProgramDirector], code: 200, input: [], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/vbs/programs/{program_id}/start-session", description: "REGISTRATION_CLOSED -> IN_SESSION; requires >= 1 ProgramDay", roles: [ProgramDirector], code: 200, input: [], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/vbs/programs/{program_id}/complete", description: "IN_SESSION -> COMPLETED; requires all days CLOSED", roles: [ProgramDirector], code: 200, input: [], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/vbs/programs/{program_id}/archive", description: "COMPLETED -> ARCHIVED; program becomes read-only", roles: [ProgramDirector], code: 200, input: [], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/vbs/programs/{program_id}/sweep-expired-offers", description: "Ops-run sweep: flip every OFFERED registration with offer_expires_at <= now to EXPIRED and run the waitlist promotion loop per affected classroom (classroom order: created_at ASC). OCC-guarded.", roles: [RegistrationCoordinator], code: 200, input: [expected_program_version], output: Program, side_effects: ["OFFERED with offer_expires_at <= now -> EXPIRED", "waitlist promotion loop per affected classroom", "increments Program.version by 1"] }
  - { method: GET, path: "/vbs/programs/{program_id}/supply-plan", description: "Computed read: kit recommendation (both variants), craft packs (per-classroom-rounded then summed), budget remaining", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: [], output: { enrolled_total: integer, classroom_count: integer, kit_quantity_provisional: integer, kit_quantity_final: integer, craft_packs_required: integer, craft_packs_per_classroom: array, budget_remaining_cents: integer }, side_effects: [] }
  - { method: GET, path: "/vbs/programs/{program_id}/attendance-summaries/{child_id}", description: "Computed read: attendance counters and both rate variants for one child", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer, Parent], code: 200, input: [], output: { attended_days: integer, days_closed: integer, total_days: integer, provisional_rate: number, projected_final_rate: number }, side_effects: [] }

  # --- Classroom ---
  - { method: POST, path: "/vbs/classrooms", description: "Create a classroom. Initial status ACCEPTING when the program is REGISTRATION_OPEN, else SETUP. Program must be DRAFT or REGISTRATION_OPEN.", roles: [RegistrationCoordinator], code: 201, input: [program_id, name, age_min, age_max, capacity], output: Classroom, side_effects: ["status SETUP or ACCEPTING per program status"] }
  - { method: GET, path: "/vbs/classrooms/{classroom_id}", description: "Get one classroom", roles: [ProgramDirector, RegistrationCoordinator, VolunteerCoordinator, SafetyOfficer, CheckInStaff, Parent, Volunteer], code: 200, input: [], output: Classroom, side_effects: [] }
  - { method: GET, path: "/vbs/classrooms", description: "List classrooms (reverse-reachability for Classroom.program_id). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator, VolunteerCoordinator, SafetyOfficer, CheckInStaff, Parent], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Classroom[]", side_effects: [] }
  - { method: PATCH, path: "/vbs/classrooms/{classroom_id}", description: "Edit capacity/age band. OCC-guarded. Program must be DRAFT, REGISTRATION_OPEN or REGISTRATION_CLOSED. capacity >= enrolled_count.", roles: [RegistrationCoordinator], code: 200, input: ["capacity?", "age_min?", "age_max?", expected_classroom_version], output: Classroom, side_effects: ["increments Classroom.version by 1", "if open_seats rises above 0 while FULL: flips to ACCEPTING and runs the promotion loop"] }
  - { method: POST, path: "/vbs/classrooms/{classroom_id}/close", description: "Close a classroom; requires enrolled_count == 0; cancels WAITLISTED/OFFERED registrations (CLASSROOM_CLOSED) and releases CONFIRMED assignments", roles: [RegistrationCoordinator], code: 200, input: [], output: Classroom, side_effects: ["status -> CLOSED", "WAITLISTED/OFFERED registrations -> CANCELLED (CLASSROOM_CLOSED)", "CONFIRMED RoleAssignments -> RELEASED", "increments Classroom.version by 1"] }

  # --- Family ---
  - { method: POST, path: "/vbs/families", description: "Self-register a household", roles: [Anonymous], code: 201, input: [household_name, primary_contact_name, email, phone, "preferred_contact?"], output: Family, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/vbs/families/{family_id}", description: "Get one family (Parent restricted to own family_id == X-User-ID)", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer, Parent], code: 200, input: [], output: Family, side_effects: [] }
  - { method: GET, path: "/vbs/families", description: "List families; ARCHIVED excluded unless include_archived=true (soft-delete filter). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: ["email?", "include_archived?", "limit?", "offset?"], output: "Family[]", side_effects: [] }
  - { method: POST, path: "/vbs/families/{family_id}/archive", description: "Soft-delete a family; cascades CANCELLED(ADMIN) to all non-terminal registrations of its children", roles: [RegistrationCoordinator], code: 200, input: [], output: Family, side_effects: ["status -> ARCHIVED", "children's ENROLLED/WAITLISTED/OFFERED registrations -> CANCELLED(ADMIN)", "each ENROLLED cancellation runs the seat-flip + promotion cascade", "increments Family.version by 1"] }

  # --- Child ---
  - { method: POST, path: "/vbs/children", description: "Register a child into a family (Parent: family_id must equal X-User-ID)", roles: [Parent, RegistrationCoordinator], code: 201, input: [family_id, first_name, last_name, birth_date, grade_completed, "has_special_needs?", "allergy_summary?"], output: Child, side_effects: [] }
  - { method: GET, path: "/vbs/children/{child_id}", description: "Get one child (Parent restricted to own)", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer, CheckInStaff, Parent], code: 200, input: [], output: Child, side_effects: [] }
  - { method: GET, path: "/vbs/children", description: "List children (reverse-reachability for Child.family_id); Parent sees only own family. Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer, CheckInStaff, Parent], code: 200, input: ["family_id?", "limit?", "offset?"], output: "Child[]", side_effects: [] }

  # --- Registration ---
  - { method: POST, path: "/vbs/registrations", description: "Create a registration; forks to ENROLLED (open_seats >= 1) or WAITLISTED (open_seats == 0)", roles: [Parent, RegistrationCoordinator], code: 201, input: [child_id, classroom_id], output: Registration, side_effects: ["status ENROLLED or WAITLISTED per open_seats", "on ENROLLED: enrolled_at set, possible ACCEPTING -> FULL flip", "on ENROLLED while a day is OPEN: AttendanceRecord(NOT_ARRIVED) created"] }
  - { method: GET, path: "/vbs/registrations/{registration_id}", description: "Get one registration (Parent restricted to own)", roles: [ProgramDirector, RegistrationCoordinator, Parent], code: 200, input: [], output: Registration, side_effects: [] }
  - { method: GET, path: "/vbs/registrations", description: "List registrations (reverse-reachability for child_id and classroom_id FKs); Parent sees only own family. Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator, Parent], code: 200, input: ["child_id?", "classroom_id?", "status?", "limit?", "offset?"], output: "Registration[]", side_effects: [] }
  - { method: POST, path: "/vbs/registrations/{registration_id}/cancel", description: "Cancel an ENROLLED or WAITLISTED registration; ENROLLED cancellation runs the seat-flip + promotion cascade", roles: [Parent, RegistrationCoordinator], code: 200, input: [], output: Registration, side_effects: ["status -> CANCELLED (FAMILY_REQUEST for Parent, ADMIN for coordinator)", "ENROLLED: enrolled_count -1, FULL -> ACCEPTING flip, promotion loop, future NOT_ARRIVED records deleted"] }
  - { method: POST, path: "/vbs/registrations/{registration_id}/accept", description: "Accept a waitlist offer; strict expiry (now < offer_expires_at); capacity re-check", roles: [Parent], code: 200, input: [], output: Registration, side_effects: ["OFFERED -> ENROLLED", "on expired offer: registration -> EXPIRED, ERR_OFFER_EXPIRED returned, promotion loop runs", "on ENROLLED while a day is OPEN: AttendanceRecord(NOT_ARRIVED) created"] }
  - { method: POST, path: "/vbs/registrations/{registration_id}/decline", description: "Decline a waitlist offer; frees the reservation and runs the promotion loop", roles: [Parent], code: 200, input: [], output: Registration, side_effects: ["OFFERED -> DECLINED", "promotion loop runs for the classroom"] }

  # --- Volunteer ---
  - { method: POST, path: "/vbs/volunteers", description: "Self-apply as a volunteer for a program", roles: [Anonymous], code: 201, input: [program_id, full_name, email, phone, birth_date, "family_id?"], output: Volunteer, side_effects: ["status=APPLIED", "is_minor computed from program start_date"] }
  - { method: GET, path: "/vbs/volunteers/{volunteer_id}", description: "Get one volunteer (Volunteer restricted to own id)", roles: [ProgramDirector, RegistrationCoordinator, VolunteerCoordinator, SafetyOfficer, Volunteer], code: 200, input: [], output: Volunteer, side_effects: [] }
  - { method: GET, path: "/vbs/volunteers", description: "List volunteers (reverse-reachability for program_id and family_id FKs). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator, VolunteerCoordinator, SafetyOfficer], code: 200, input: ["program_id?", "family_id?", "status?", "limit?", "offset?"], output: "Volunteer[]", side_effects: [] }

  # --- ScreeningCheck ---
  - { method: POST, path: "/vbs/screening-checks", description: "Submit a screening check (Volunteer: volunteer_id must equal X-User-ID). One active (SUBMITTED/INFO_REQUESTED/CLEARED) check per type per volunteer.", roles: [Volunteer, VolunteerCoordinator], code: 201, input: [volunteer_id, check_type], output: ScreeningCheck, side_effects: ["status=SUBMITTED", "volunteer APPLIED -> SCREENING on first check"] }
  - { method: POST, path: "/vbs/screening-checks/{check_id}/decide", description: "SafetyOfficer decides a SUBMITTED check; self-review forbidden", roles: [SafetyOfficer], code: 200, input: [decision, "decision_notes?"], output: ScreeningCheck, side_effects: ["status -> decision", "reviewer_id/decided_at set", "volunteer status recompute (CLEARED when all 3 types CLEARED; REJECTED on any REJECTED)", "on volunteer CLEARED: PROPOSED assignments auto-confirm"] }
  - { method: POST, path: "/vbs/screening-checks/{check_id}/resubmit", description: "Volunteer resubmits an INFO_REQUESTED check (self only)", roles: [Volunteer], code: 200, input: ["response_notes?"], output: ScreeningCheck, side_effects: ["INFO_REQUESTED -> SUBMITTED", "resubmission_count += 1"] }
  - { method: GET, path: "/vbs/screening-checks/{check_id}", description: "Get one screening check (Volunteer restricted to own)", roles: [VolunteerCoordinator, SafetyOfficer, Volunteer], code: 200, input: [], output: ScreeningCheck, side_effects: [] }
  - { method: GET, path: "/vbs/screening-checks", description: "List screening checks (reverse-reachability for volunteer_id FK). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [VolunteerCoordinator, SafetyOfficer], code: 200, input: ["volunteer_id?", "status?", "limit?", "offset?"], output: "ScreeningCheck[]", side_effects: [] }

  # --- RoleAssignment ---
  - { method: POST, path: "/vbs/role-assignments", description: "Propose a role assignment (PROPOSED). Minor volunteers may not be proposed as LEAD_TEACHER. One active assignment per volunteer per classroom.", roles: [VolunteerCoordinator, Volunteer], code: 201, input: [volunteer_id, classroom_id, role], output: RoleAssignment, side_effects: ["status=PROPOSED"] }
  - { method: POST, path: "/vbs/role-assignments/{assignment_id}/confirm", description: "Confirm a PROPOSED assignment; requires volunteer CLEARED, lead-uniqueness, no child-facing double-booking", roles: [VolunteerCoordinator], code: 200, input: [], output: RoleAssignment, side_effects: ["PROPOSED -> CONFIRMED", "confirmed_at set", "classroom confirmed_adult_count / staffing_status recompute"] }
  - { method: POST, path: "/vbs/role-assignments/{assignment_id}/release", description: "Release a CONFIRMED assignment (compensating action)", roles: [VolunteerCoordinator], code: 200, input: [], output: RoleAssignment, side_effects: ["CONFIRMED -> RELEASED", "released_at set", "classroom confirmed_adult_count / staffing_status recompute"] }
  - { method: GET, path: "/vbs/role-assignments/{assignment_id}", description: "Get one role assignment", roles: [ProgramDirector, VolunteerCoordinator, SafetyOfficer, Volunteer], code: 200, input: [], output: RoleAssignment, side_effects: [] }
  - { method: GET, path: "/vbs/role-assignments", description: "List role assignments (reverse-reachability for volunteer_id and classroom_id FKs). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, VolunteerCoordinator, SafetyOfficer], code: 200, input: ["volunteer_id?", "classroom_id?", "status?", "limit?", "offset?"], output: "RoleAssignment[]", side_effects: [] }

  # --- AccommodationPlan ---
  - { method: POST, path: "/vbs/accommodation-plans", description: "Create an accommodation plan (DRAFT). allergens required iff severity == FOOD_ALLERGY.", roles: [Parent, SafetyOfficer], code: 201, input: [child_id, severity, "allergens?", instructions, "requires_epinephrine?"], output: AccommodationPlan, side_effects: ["status=DRAFT"] }
  - { method: POST, path: "/vbs/accommodation-plans/{plan_id}/submit", description: "DRAFT or NEEDS_REVISION -> SUBMITTED", roles: [Parent], code: 200, input: [], output: AccommodationPlan, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/vbs/accommodation-plans/{plan_id}/approve", description: "SUBMITTED -> APPROVED; supersedes any other APPROVED plan of the same child. OCC-guarded on Child.version.", roles: [SafetyOfficer], code: 200, input: [expected_child_version], output: AccommodationPlan, side_effects: ["status -> APPROVED", "other APPROVED plans of the child -> SUPERSEDED", "increments Child.version by 1"] }
  - { method: POST, path: "/vbs/accommodation-plans/{plan_id}/request-revision", description: "SUBMITTED -> NEEDS_REVISION", roles: [SafetyOfficer], code: 200, input: [revision_notes], output: AccommodationPlan, side_effects: ["status -> NEEDS_REVISION", "revision_notes/reviewed_by set"] }
  - { method: GET, path: "/vbs/accommodation-plans/{plan_id}", description: "Get one plan (Parent restricted to own child)", roles: [SafetyOfficer, Parent, CheckInStaff], code: 200, input: [], output: AccommodationPlan, side_effects: [] }
  - { method: GET, path: "/vbs/accommodation-plans", description: "List plans (reverse-reachability for child_id FK); Parent restricted to own. Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [SafetyOfficer, CheckInStaff, Parent], code: 200, input: ["child_id?", "status?", "limit?", "offset?"], output: "AccommodationPlan[]", side_effects: [] }

  # --- SupplyOrder ---
  - { method: POST, path: "/vbs/supply-orders", description: "Create a kit order (DRAFT)", roles: [ProgramDirector], code: 201, input: [program_id, kit_name, vendor, quantity, unit_cost_cents], output: SupplyOrder, side_effects: ["status=DRAFT"] }
  - { method: PATCH, path: "/vbs/supply-orders/{order_id}", description: "Edit a DRAFT order", roles: [ProgramDirector], code: 200, input: ["kit_name?", "vendor?", "quantity?", "unit_cost_cents?"], output: SupplyOrder, side_effects: ["increments SupplyOrder.version by 1"] }
  - { method: POST, path: "/vbs/supply-orders/{order_id}/submit", description: "DRAFT -> SUBMITTED; quantity must be >= required_final (kit_recommendation final variant)", roles: [ProgramDirector], code: 200, input: [], output: SupplyOrder, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/vbs/supply-orders/{order_id}/return-for-revision", description: "SUBMITTED -> DRAFT (revision loop)", roles: [ProgramDirector], code: 200, input: [], output: SupplyOrder, side_effects: ["status -> DRAFT"] }
  - { method: POST, path: "/vbs/supply-orders/{order_id}/approve", description: "SUBMITTED -> APPROVED; total_cost_cents must fit budget_remaining_cents", roles: [ProgramDirector], code: 200, input: [], output: SupplyOrder, side_effects: ["status -> APPROVED", "budget_remaining_cents -= total_cost_cents"] }
  - { method: POST, path: "/vbs/supply-orders/{order_id}/cancel", description: "DRAFT or SUBMITTED -> CANCELLED", roles: [ProgramDirector], code: 200, input: [], output: SupplyOrder, side_effects: ["status -> CANCELLED"] }
  - { method: GET, path: "/vbs/supply-orders/{order_id}", description: "Get one order", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: [], output: SupplyOrder, side_effects: [] }
  - { method: GET, path: "/vbs/supply-orders", description: "List orders (reverse-reachability for program_id FK). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "SupplyOrder[]", side_effects: [] }

  # --- SupplyItem ---
  - { method: POST, path: "/vbs/supply-items", description: "Create a stock item", roles: [ProgramDirector], code: 201, input: [program_id, name, category, unit, quantity_on_hand, "allergen_tags?", "restock_threshold?"], output: SupplyItem, side_effects: ["reserved_quantity=0"] }
  - { method: GET, path: "/vbs/supply-items/{item_id}", description: "Get one item", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer], code: 200, input: [], output: SupplyItem, side_effects: [] }
  - { method: GET, path: "/vbs/supply-items", description: "List items (reverse-reachability for program_id FK). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer], code: 200, input: ["program_id?", "category?", "limit?", "offset?"], output: "SupplyItem[]", side_effects: [] }
  - { method: POST, path: "/vbs/supply-items/{item_id}/restock", description: "Add stock: quantity_on_hand += additional_quantity", roles: [ProgramDirector], code: 200, input: [additional_quantity], output: SupplyItem, side_effects: ["quantity_on_hand += additional_quantity", "increments SupplyItem.version by 1"] }

  # --- SupplyDistribution ---
  - { method: POST, path: "/vbs/supply-distributions", description: "Plan a distribution (PLANNED): reserves stock; SNACK items are allergen-checked against the classroom's enrolled children; item/classroom/day must share one program; day must be SCHEDULED or OPEN", roles: [ProgramDirector, RegistrationCoordinator], code: 201, input: [supply_item_id, classroom_id, program_day_id, quantity], output: SupplyDistribution, side_effects: ["reserved_quantity += quantity"] }
  - { method: POST, path: "/vbs/supply-distributions/{distribution_id}/issue", description: "PLANNED -> ISSUED: on_hand -= q, reserved -= q", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: [], output: SupplyDistribution, side_effects: ["quantity_on_hand -= quantity", "reserved_quantity -= quantity", "issued_at set"] }
  - { method: POST, path: "/vbs/supply-distributions/{distribution_id}/cancel", description: "PLANNED -> CANCELLED: reserved -= q (compensating action)", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: [], output: SupplyDistribution, side_effects: ["reserved_quantity -= quantity"] }
  - { method: GET, path: "/vbs/supply-distributions/{distribution_id}", description: "Get one distribution", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer], code: 200, input: [], output: SupplyDistribution, side_effects: [] }
  - { method: GET, path: "/vbs/supply-distributions", description: "List distributions (reverse-reachability for supply_item_id, classroom_id, program_day_id FKs). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer], code: 200, input: ["supply_item_id?", "classroom_id?", "program_day_id?", "status?", "limit?", "offset?"], output: "SupplyDistribution[]", side_effects: [] }

  # --- ProgramDay ---
  - { method: POST, path: "/vbs/days", description: "Append a program day: first day must equal start_date, each next exactly previous + 1 calendar day, all within [start_date, end_date]; allowed while program is DRAFT/REGISTRATION_OPEN/REGISTRATION_CLOSED", roles: [ProgramDirector], code: 201, input: [program_id, date], output: ProgramDay, side_effects: ["day_index = existing day count + 1", "status=SCHEDULED"] }
  - { method: POST, path: "/vbs/days/{day_id}/open", description: "SCHEDULED -> OPEN: gates on IN_SESSION program, today's date, and ADEQUATE staffing in every enrolled classroom; auto-creates NOT_ARRIVED AttendanceRecords for every ENROLLED registration", roles: [ProgramDirector], code: 200, input: [], output: ProgramDay, side_effects: ["status -> OPEN", "AttendanceRecord(NOT_ARRIVED) per ENROLLED registration", "program.current_day_index = day_index"] }
  - { method: POST, path: "/vbs/days/{day_id}/close", description: "OPEN -> CLOSED: forbidden while any child is CHECKED_IN; NOT_ARRIVED -> ABSENT; ISSUED tags -> VOIDED(DAY_CLOSED)", roles: [ProgramDirector], code: 200, input: [], output: ProgramDay, side_effects: ["NOT_ARRIVED records -> ABSENT", "ISSUED tags -> VOIDED(DAY_CLOSED)", "program.current_day_index = 0"] }
  - { method: GET, path: "/vbs/days/{day_id}", description: "Get one program day", roles: [ProgramDirector, RegistrationCoordinator, VolunteerCoordinator, SafetyOfficer, CheckInStaff], code: 200, input: [], output: ProgramDay, side_effects: [] }
  - { method: GET, path: "/vbs/days", description: "List program days (reverse-reachability for program_id FK). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator, VolunteerCoordinator, SafetyOfficer, CheckInStaff], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "ProgramDay[]", side_effects: [] }

  # --- Attendance & SecurityTag ---
  - { method: POST, path: "/vbs/attendance/check-in", description: "Check a child into an OPEN day; safety gate on APPROVED accommodation plan; issues a SecurityTag", roles: [CheckInStaff], code: 201, input: [child_id, program_day_id], output: AttendanceRecord, side_effects: ["NOT_ARRIVED -> CHECKED_IN", "SecurityTag(ISSUED, fresh tag_code) created", "record.tag_code set"] }
  - { method: POST, path: "/vbs/attendance/check-out", description: "Check a child out with the active tag code; computes late_pickup", roles: [CheckInStaff], code: 200, input: [child_id, program_day_id, tag_code, pickup_person], output: AttendanceRecord, side_effects: ["CHECKED_IN -> CHECKED_OUT", "matching tag -> REDEEMED", "late_pickup computed"] }
  - { method: POST, path: "/vbs/attendance/reprint-tag", description: "Void the active tag (REPRINT) and issue a replacement for a CHECKED_IN child", roles: [CheckInStaff], code: 200, input: [child_id, program_day_id], output: AttendanceRecord, side_effects: ["active tag -> VOIDED(REPRINT)", "new SecurityTag(ISSUED) created", "record.tag_code updated"] }
  - { method: GET, path: "/vbs/attendance/{record_id}", description: "Get one attendance record", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer, CheckInStaff, Parent], code: 200, input: [], output: AttendanceRecord, side_effects: [] }
  - { method: GET, path: "/vbs/attendance", description: "List attendance records (reverse-reachability for child_id, program_day_id, registration_id FKs). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator, SafetyOfficer, CheckInStaff], code: 200, input: ["child_id?", "program_day_id?", "registration_id?", "status?", "limit?", "offset?"], output: "AttendanceRecord[]", side_effects: [] }
  - { method: GET, path: "/vbs/security-tags/{tag_id}", description: "Get one security tag", roles: [ProgramDirector, SafetyOfficer, CheckInStaff], code: 200, input: [], output: SecurityTag, side_effects: [] }
  - { method: GET, path: "/vbs/security-tags", description: "List security tags (reverse-reachability for child_id and program_day_id FKs). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, SafetyOfficer, CheckInStaff], code: 200, input: ["child_id?", "program_day_id?", "status?", "limit?", "offset?"], output: "SecurityTag[]", side_effects: [] }

  # --- FamilyMessage ---
  - { method: POST, path: "/vbs/messages", description: "Draft a family message; classroom_id required iff audience == CLASSROOM", roles: [ProgramDirector], code: 201, input: [program_id, subject, body, audience, "classroom_id?"], output: FamilyMessage, side_effects: ["status=DRAFT"] }
  - { method: POST, path: "/vbs/messages/{message_id}/send", description: "DRAFT -> SENT; resolves and stores recipient_count", roles: [ProgramDirector], code: 200, input: [], output: FamilyMessage, side_effects: ["status -> SENT", "recipient_count computed", "sent_at set"] }
  - { method: POST, path: "/vbs/messages/{message_id}/cancel", description: "DRAFT -> CANCELLED", roles: [ProgramDirector], code: 200, input: [], output: FamilyMessage, side_effects: ["status -> CANCELLED"] }
  - { method: GET, path: "/vbs/messages/{message_id}", description: "Get one message", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: [], output: FamilyMessage, side_effects: [] }
  - { method: GET, path: "/vbs/messages", description: "List messages (reverse-reachability for program_id and classroom_id FKs). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: ["program_id?", "classroom_id?", "status?", "limit?", "offset?"], output: "FamilyMessage[]", side_effects: [] }

  # --- RetentionEntry ---
  - { method: POST, path: "/vbs/programs/{program_id}/retention-list/generate", description: "Ops-run at program COMPLETED: create a RetentionEntry per child with >= 1 CHECKED_OUT day. Re-running without force is rejected; force=true regenerates LISTED/INVITED entries and preserves RESPONDED_* ones.", roles: [ProgramDirector], code: 201, input: ["force?"], output: { created_count: integer, regenerated: boolean }, side_effects: ["one RetentionEntry per qualifying child (status LISTED)", "attendance_rate / family_volunteer_bonus / priority_tier computed per entry"] }
  - { method: GET, path: "/vbs/retention-entries/{entry_id}", description: "Get one retention entry", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: [], output: RetentionEntry, side_effects: [] }
  - { method: GET, path: "/vbs/retention-entries", description: "List retention entries (reverse-reachability for program_id and child_id FKs). Default list sort: created_at ASC (server-assigned monotonic timestamps; id is never used for ordering).", roles: [ProgramDirector, RegistrationCoordinator], code: 200, input: ["program_id?", "child_id?", "priority_tier?", "status?", "limit?", "offset?"], output: "RetentionEntry[]", side_effects: [] }
  - { method: POST, path: "/vbs/retention-entries/{entry_id}/invite", description: "LISTED -> INVITED", roles: [ProgramDirector], code: 200, input: [], output: RetentionEntry, side_effects: ["status -> INVITED"] }
  - { method: POST, path: "/vbs/retention-entries/{entry_id}/record-response", description: "INVITED -> RESPONDED_YES | RESPONDED_NO", roles: [ProgramDirector], code: 200, input: [outcome], output: RetentionEntry, side_effects: ["status -> RESPONDED_YES or RESPONDED_NO"] }

  # --- Logical clock (test-driving endpoint) ---
  - { method: POST, path: "/vbs/_clock/set_current_utc", description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads the default and never falls back to wall-clock time. All window/expiry/day-date/late-pickup rules read this clock.", roles: [ProgramDirector], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced to to_iso8601"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, undeclared field, unparsable enum/int/date, violated conditional field rule (allergens iff FOOD_ALLERGY; classroom_id iff audience CLASSROOM), age_min > age_max, capacity < 1, quantity < 1, end_date < start_date, registration_closes_at <= registration_opens_at" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on the endpoint, or ownership rule violated (Parent acting on another family's child/registration/plan; Volunteer acting on another volunteer's check)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist (checked left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SELF_REVIEW_FORBIDDEN, http: 403, condition: "SafetyOfficer's X-User-ID equals the screening check's volunteer_id (segregation of duties)" }
  - { id: ERR_ACCOMMODATION_NOT_APPROVED, http: 409, condition: "Check-in of a child with has_special_needs == true who holds no APPROVED AccommodationPlan" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 409, condition: "SNACK distribution whose item allergen_tags intersect the union of APPROVED FOOD_ALLERGY plan allergens of children ENROLLED in the target classroom" }
  - { id: ERR_STAFFING_INADEQUATE, http: 409, condition: "Day open while any classroom with enrolled_count > 0 has staffing_status != ADEQUATE" }
  - { id: ERR_CHILDREN_ON_SITE, http: 409, condition: "Day close while any AttendanceRecord of the day has status CHECKED_IN" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state that does not permit the operation (includes all terminal-state lockdowns)" }
  - { id: ERR_REGISTRATION_WINDOW_CLOSED, http: 409, condition: "Registration attempted outside [registration_opens_at, registration_closes_at] on the logical clock" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Accept attempted with now >= offer_expires_at; registration flips to EXPIRED and the promotion loop runs" }
  - { id: ERR_PROGRAM_DATE_OVERLAP, http: 409, condition: "New program's inclusive [start_date, end_date] intersects another non-ARCHIVED program's inclusive range" }
  - { id: ERR_DAY_NOT_SEQUENTIAL, http: 409, condition: "New program day is not start_date (first day) or exactly previous day + 1 calendar day" }
  - { id: ERR_DAY_OUT_OF_RANGE, http: 409, condition: "New program day date lies outside [start_date, end_date]" }
  - { id: ERR_DAY_NOT_TODAY, http: 409, condition: "Day open attempted when day.date != current logical date" }
  - { id: ERR_AGE_OUT_OF_RANGE, http: 422, condition: "age_at_registration falls outside [age_min, age_max] (inclusive) of the requested classroom" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Child already holds a registration with status in {ENROLLED, WAITLISTED, OFFERED} in the same program" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Family email already in use (including by an ARCHIVED family)" }
  - { id: ERR_DUPLICATE_CHECK, http: 409, condition: "Volunteer already holds a ScreeningCheck of the same type with status in {SUBMITTED, INFO_REQUESTED, CLEARED}" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "Volunteer already holds a PROPOSED or CONFIRMED assignment in the same classroom" }
  - { id: ERR_LEAD_TEACHER_TAKEN, http: 409, condition: "Confirm would create a second CONFIRMED LEAD_TEACHER in the classroom" }
  - { id: ERR_VOLUNTEER_DOUBLE_BOOKED, http: 409, condition: "Confirm would give the volunteer CONFIRMED child-facing assignments (LEAD_TEACHER/ASSISTANT_TEACHER) in two classrooms of the same program" }
  - { id: ERR_MINOR_ROLE_FORBIDDEN, http: 422, condition: "LEAD_TEACHER assignment proposed for a volunteer with is_minor == true" }
  - { id: ERR_CLASSROOM_NOT_EMPTY, http: 409, condition: "Classroom close with enrolled_count > 0" }
  - { id: ERR_CAPACITY_BELOW_ENROLLED, http: 409, condition: "PATCH capacity below the classroom's current enrolled_count" }
  - { id: ERR_CLASSROOM_FULL, http: 409, condition: "Accept of an OFFERED registration when enrolled_count == capacity (capacity shrank after the offer was made)" }
  - { id: ERR_NO_PROGRAM_DAYS, http: 409, condition: "start-session with zero ProgramDays" }
  - { id: ERR_DAYS_STILL_OPEN, http: 409, condition: "Program complete while any ProgramDay has status != CLOSED" }
  - { id: ERR_RETENTION_EXISTS, http: 409, condition: "Retention generation when entries already exist and force is not true" }
  - { id: ERR_TAG_MISMATCH, http: 409, condition: "Check-out tag_code matches no SecurityTag for (child, day)" }
  - { id: ERR_TAG_NOT_ACTIVE, http: 409, condition: "Check-out tag_code matches a VOIDED or REDEEMED SecurityTag for (child, day)" }
  - { id: ERR_NOT_ENROLLED, http: 409, condition: "Check-in of a child without an ENROLLED registration for the day's program" }
  - { id: ERR_FAMILY_ARCHIVED, http: 409, condition: "Create child or registration against a family with status ARCHIVED" }
  - { id: ERR_VOLUNTEER_NOT_CLEARED, http: 409, condition: "Confirm an assignment whose volunteer status != CLEARED" }
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http: 409, condition: "SupplyDistribution whose item, classroom and program day do not all belong to the same program" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "Order approve with total_cost_cents > budget_remaining_cents" }
  - { id: ERR_KIT_QUANTITY_SHORT, http: 409, condition: "Order submit with quantity < required_final (kit_recommendation final variant)" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Distribution quantity > item.available_quantity at creation" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; self-service intake only"
    identity: opaque
    exclusive_operations:
      - "POST /vbs/families (household self-registration)"
      - "POST /vbs/volunteers (volunteer self-application)"
    shared_operations: []
  - name: Parent
    description: "Family contact managing their own household's children, registrations and accommodation plans"
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /vbs/registrations/{id}/accept and /decline (only the offered family may respond)"
      - "POST /vbs/accommodation-plans/{id}/submit (only the owning family submits)"
    shared_operations:
      - "POST /vbs/children (own family_id == X-User-ID; shared with RegistrationCoordinator)"
      - "POST /vbs/registrations and /cancel (own children; shared with RegistrationCoordinator)"
      - "POST /vbs/accommodation-plans (own children; shared with SafetyOfficer)"
      - "GET reads restricted to own-family resources"
  - name: Volunteer
    description: "Prospective or cleared helper managing their own screening and role applications"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /vbs/screening-checks/{id}/resubmit (only the owning volunteer resubmits)"
    shared_operations:
      - "POST /vbs/screening-checks (own volunteer_id == X-User-ID; shared with VolunteerCoordinator on behalf)"
      - "POST /vbs/role-assignments (own volunteer_id; shared with VolunteerCoordinator)"
      - "GET reads restricted to own volunteer/screening records"
  - name: CheckInStaff
    description: "Front-desk operator running daily drop-off and pick-up; cannot register children or decide screenings"
    identity: opaque
    exclusive_operations:
      - "POST /vbs/attendance/check-in"
      - "POST /vbs/attendance/check-out"
      - "POST /vbs/attendance/reprint-tag"
    shared_operations:
      - "GET reads on programs, classrooms, children, days, attendance, security tags, accommodation plans"
  - name: RegistrationCoordinator
    description: "Registrar owning classrooms, families and the waitlist; cannot decide screenings or confirm assignments (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /vbs/classrooms, PATCH /vbs/classrooms/{id}, POST /vbs/classrooms/{id}/close"
      - "POST /vbs/families/{id}/archive"
      - "POST /vbs/programs/{id}/sweep-expired-offers"
    shared_operations:
      - "POST /vbs/children and /vbs/registrations and /cancel (any family; shared with Parent for own)"
      - "POST /vbs/supply-distributions + issue/cancel (shared with ProgramDirector)"
      - "GET reads across operational resources"
  - name: VolunteerCoordinator
    description: "Volunteer scheduler confirming role assignments; cannot decide screenings (segregation of duties: assigner != screener)"
    identity: opaque
    exclusive_operations:
      - "POST /vbs/role-assignments/{id}/confirm"
      - "POST /vbs/role-assignments/{id}/release"
    shared_operations:
      - "POST /vbs/screening-checks on behalf of a volunteer (shared with Volunteer self)"
      - "POST /vbs/role-assignments (shared with Volunteer self)"
      - "GET reads on volunteers, screening checks, assignments"
  - name: SafetyOfficer
    description: "Child-safety reviewer owning screening decisions and accommodation approvals; cannot confirm assignments (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /vbs/screening-checks/{id}/decide (subject to ERR_SELF_REVIEW_FORBIDDEN)"
      - "POST /vbs/accommodation-plans/{id}/approve and /request-revision"
    shared_operations:
      - "POST /vbs/accommodation-plans (shared with Parent)"
      - "GET reads across safety-relevant resources"
  - name: ProgramDirector
    description: "Program administrator owning the lifecycle, calendar, supply budget, messaging, retention list and the logical clock"
    identity: opaque
    exclusive_operations:
      - "Program lifecycle: open-registration, close-registration, start-session, complete, archive"
      - "POST /vbs/days, POST /vbs/days/{id}/open, POST /vbs/days/{id}/close"
      - "Supply orders: create, patch, submit, return-for-revision, approve, cancel"
      - "Supply items: create, restock"
      - "Messages: create, send, cancel"
      - "Retention: generate, invite, record-response"
      - "POST /vbs/_clock/set_current_utc"
    shared_operations:
      - "POST /vbs/supply-distributions + issue/cancel (shared with RegistrationCoordinator)"
      - "GET reads across all resources"
