      "percentage_interest_bp := base_percentage_interest_bp until the next reallocation",
      "DeclarationPackage.status PLAT_CERTIFIED -> DRAFT when the package was already certified",
      "ConversionProject.included_unit_count recomputed", "version := 1"]
  - method: GET
    path: "/declaration-packages/{id}/units"
    description: "Sub-resource list giving FK reverse reachability for Unit.declaration_package_id,
      filterable by declaration_status and sale_status, ordered by created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, LicensedEngineer, PlatformAdmin]
    code: 200
    input: ["declaration_status?", "sale_status?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []
  - method: GET
    path: "/units"
    description: "Filtered list giving FK reverse reachability for Unit.conversion_project_id (and
      declaration_package_id), filterable by declaration_status and sale_status, ordered by
      created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, EscrowAgent, PlatformAdmin,
            Purchaser, TenantOccupant]
    code: 200
    input: ["conversion_project_id?", "declaration_package_id?", "declaration_status?", "sale_status?",
            "limit?", "offset?"]
    output: Unit[]
    side_effects: []
  - method: GET
    path: "/units/{id}"
    description: "Returns one unit with base_percentage_interest_bp, the currently derived
      percentage_interest_bp, both assessment amounts, declaration_status, sale_status and version."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, EscrowAgent, PlatformAdmin,
            Purchaser, TenantOccupant]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: PATCH
    path: "/units/{id}"
    description: "Adjustment endpoint for a unit's boundary_note, heated_square_feet and immutable
      economic base base_percentage_interest_bp while the unit is UNSOLD. Changing
      base_percentage_interest_bp reverts a certified plat to DRAFT so the allocation must be
      re-derived."
    roles: [ConverterSponsor, LicensedEngineer]
    code: 200
    input: ["boundary_note?", "heated_square_feet?", "floor_level?", "base_percentage_interest_bp?"]
    output: Unit
    side_effects: ["DeclarationPackage.status PLAT_CERTIFIED -> DRAFT when
        base_percentage_interest_bp changed", "version += 1"]
  - method: POST
    path: "/units/{id}/withdraw"
    description: "Withdraws a unit from the conversion: declaration_status INCLUDED -> WITHDRAWN.
      Fires the withdrawal cascade - live purchase agreements on the unit are voided, their escrow
      refunded, affected closing batches fall back to THRESHOLD_SHORT, and the percentage interest
      allocation is swept so the remaining INCLUDED units still total exactly 10000 basis points."
    roles: [ConverterSponsor]
    code: 200
    input: ["withdrawal_reason?"]
    output: Unit
    side_effects: ["declaration_status := WITHDRAWN",
      "PurchaseAgreement.contract_status SIGNED or HARD -> VOID for agreements on this unit",
      "PurchaseAgreement.escrow_status FUNDED -> REFUNDED for those agreements",
      "ConversionProject.escrow_balance_cents decreased and escrow_refunded_cents increased",
      "ClosingBatch.status THRESHOLD_MET or RELEASED -> THRESHOLD_SHORT where a voided agreement was
        assigned", "DeclarationPackage.status PLAT_CERTIFIED -> DRAFT",
      "percentage_interest_bp re-swept over the remaining INCLUDED units",
      "ConversionProject.included_unit_count and bp_conservation_total recomputed",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: POST
    path: "/units/{id}/reinstate"
    description: "Reinstates a withdrawn unit: declaration_status WITHDRAWN -> INCLUDED. The
      percentage interest sweep is exactly compensating - reinstating the same unit set restores
      byte-identical percentage_interest_bp values, and voided agreements are NOT revived."
    roles: [ConverterSponsor]
    code: 200
    input: []
    output: Unit
    side_effects: ["declaration_status := INCLUDED",
      "DeclarationPackage.status PLAT_CERTIFIED -> DRAFT",
      "percentage_interest_bp re-swept over the enlarged INCLUDED set",
      "ConversionProject.included_unit_count and bp_conservation_total recomputed",
      "version += 1"]
  - method: GET
    path: "/declaration-packages/{id}/assessment-allocation"
    description: "Computed read returning the INCLUDED units with their percentage_interest_bp,
      unit_annual_assessment_cents and unit_monthly_assessment_cents as produced by
      calculations.unit_assessment_allocation, including which unit absorbed the rounding residual."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, PlatformAdmin]
    code: 200
    input: []
    output: Unit[]
    side_effects: []

  # ---------------- PublicOfferingStatement ----------------
  - method: POST
    path: "/conversion-projects/{id}/public-offering-statements"
    description: "Creates the public offering statement in status DRAFT, linked to the project's
      declaration package, adopted reserve study and adopted initial budget, and synthesizes the
      nine statutory POSSection rows in content_status DRAFTED. Reverse reachability for
      PublicOfferingStatement.conversion_project_id is
