# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Retirement Plan Audit & Form 5500 (ERISA). 9 rules x 2 instances = 18.
# All instances ground in SCAFFOLD.yaml §1.1–§1.7 and are executable from
# empty-DB via the declared setup_api_calls chains.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two calculations, DIFFERENT entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: participant_count_standard_vs_80120_election
        grounds:
          - calculations.participant_count_determination
          - entities.Engagement.fields.use_80120_election
          - entities.Engagement.fields.audit_required
        distinguishing_aspect: |
          Identical 110-participant census evaluated under the STANDARD variant
          (engagement 1) yields Schedule H + audit_required, while the
          EIGHTY_120_ELECTION variant (engagement 2, eligible: prior-year
          Schedule I and 80 <= 110 <= 120) yields Schedule I + no audit AND a
          different remittance_standard_days (3 vs 7) — participant-count
          domain, distinct from the interest-accrual domain of the sibling
          instance.
        test_recipe:
          setup:
            - "Two engagements, same sponsor, plans 001/002, PY2025, prior_year_schedule_type=I; plan 002 elects the 80-120 rule"
            - "Each engagement has 110 ACTIVE eligible participants (uniform template)"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "001", plan_name: "Acme 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I", use_80120_election: false }
              as: SponsorAdmin
              captures: { eng1: $.data.id }
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "002", plan_name: "Acme 401(k) Plan B", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I", use_80120_election: true }
              as: SponsorAdmin
              captures: { eng2: $.data.id }
            - call: "POST /plan-audit/participants/bulk-import"
              payload: { engagement_id: "${eng1}", count: 110, external_ref_prefix: "E1P", template: { eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 0, opening_balance_cents: 5000000 } }
              as: SponsorAdmin
            - call: "POST /plan-audit/participants/bulk-import"
              payload: { engagement_id: "${eng2}", count: 110, external_ref_prefix: "E2P", template: { eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 0, opening_balance_cents: 5000000 } }
              as: SponsorAdmin
          trigger:
            - call: "POST /plan-audit/engagements/${eng1}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng2}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
          assert:
            - "Engagement.${eng1}.participant_count_beginning == 110"
            - "Engagement.${eng1}.audit_required == true"
            - "Engagement.${eng1}.required_schedule_type == \"H\""
            - "Engagement.${eng1}.remittance_standard_days == 3"
            - "Engagement.${eng2}.participant_count_beginning == 110"
            - "Engagement.${eng2}.audit_required == false"
            - "Engagement.${eng2}.required_schedule_type == \"I\""
            - "Engagement.${eng2}.remittance_standard_days == 7"

      - name: lost_earnings_vfcp_vs_epcrs
        grounds:
          - calculations.lost_earnings_on_late_deposit
          - entities.CorrectiveAction.fields.earnings_variant
          - entities.CorrectiveAction.fields.earnings_cents
        distinguishing_aspect: |
          Same late deposit (principal 200000c, payroll 2026-01-15, deposit
          2026-01-29, correction 2026-03-31) yields earnings_cents 3288 under
          the VFCP variant (8.0% underpayment rate) vs 2055 under the EPCRS
          variant (5.0% plan rate) — money/interest domain on CorrectiveAction,
          distinct from the participant-count domain of the sibling instance.
        test_recipe:
          setup:
            - "Small-plan engagement (1 participant -> Schedule I, 7-business-day standard), PY2025"
            - "One ELECTIVE_DEFERRAL contribution of 200000c, payroll 2026-01-15, deposited 2026-01-29 (10 business days -> LATE)"
            - "Logical clock at 2026-03-31; assessment confirmed and finding acknowledged"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "003", plan_name: "Beta 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 200000, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/engagements/${eng}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "ELECTIVE_DEFERRAL", payroll_date: "2026-01-15", deposit_date: "2026-01-29", amount_cents: 200000 }
              as: SponsorAdmin
              captures: { c1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-31T00:00:00Z" }
              as: System
            - call: "POST /plan-audit/engagements/${eng}/late-deposit-scan"
              payload: {}
              as: TPASpecialist
            - call: "GET /plan-audit/late-contribution-assessments"
              payload: { engagement_id: "${eng}" }
              as: Any
              captures: { asm: "$.data[0].id" }
            - call: "POST /plan-audit/late-contribution-assessments/${asm}/confirm"
              payload: {}
              as: PlanAuditor
            - call: "GET /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "LATE_REMITTANCE" }
              as: Any
              captures: { f1: "$.data[0].id" }
            - call: "POST /plan-audit/findings/${f1}/acknowledge"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
          trigger:
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "LOST_EARNINGS_DEPOSIT", principal_cents: 200000, planned_execution_date: "2026-03-31", assessment_id: "${asm}", earnings_variant: "VFCP" }
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
              captures: { ca_vfcp: $.data.id }
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "LOST_EARNINGS_DEPOSIT", principal_cents: 200000, planned_execution_date: "2026-03-31", assessment_id: "${asm}", earnings_variant: "EPCRS" }
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
              captures: { ca_epcrs: $.data.id }
          assert:
            - "CorrectiveAction.${ca_vfcp}.earnings_cents == 3288"
            - "CorrectiveAction.${ca_vfcp}.total_amount_cents == 203288"
            - "CorrectiveAction.${ca_epcrs}.earnings_cents == 2055"
            - "CorrectiveAction.${ca_epcrs}.total_amount_cents == 202055"
            - "LateContributionAssessment.${asm}.lost_earnings_vfcp_cents == 3288"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (a) and (b) — DIFFERENT modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: adp_test_tiered_min_max
        grounds:
          - calculations.adp_test
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with nested min/max and boundary-inclusive
          branch: nhce_avg 1.80 yields max_allowed = max(2.25, min(3.60, 3.80))
          = 3.60, and hce_avg exactly 3.60 PASSES because the comparison is <=.
        test_recipe:
          setup:
            - "Engagement PY2025 with 2 NHCE (ADR 2.00 and 1.60) and 2 HCE (ADR 4.00 and 3.20), all ACTIVE eligible, compensation 10000000c each"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "004", plan_name: "Gamma 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "H" }
              as: SponsorAdmin
              captures: { eng: $.data.id, eng_v: $.data.version }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "N-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 200000, opening_balance_cents: 0 }
              as: SponsorAdmin
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "N-002", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 160000, opening_balance_cents: 0 }
              as: SponsorAdmin
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "H-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: true, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 400000, opening_balance_cents: 0 }
              as: SponsorAdmin
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "H-002", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: true, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 320000, opening_balance_cents: 0 }
              as: SponsorAdmin
          trigger:
            - call: "POST /plan-audit/test-results"
              payload: { engagement_id: "${eng}", test_type: "ADP", expected_engagement_version: "${eng_v}" }
              as: TPASpecialist
              captures: { tr: $.data.id }
          assert:
            - "NondiscriminationTestResult.${tr}.nhce_avg_pct == 1.80"
            - "NondiscriminationTestResult.${tr}.hce_avg_pct == 3.60"
            - "NondiscriminationTestResult.${tr}.max_allowed_hce_pct == 3.60"
            - "NondiscriminationTestResult.${tr}.result == \"PASS\""
            - "NondiscriminationTestResult.${tr}.excess_contribution_cents == 0"
            - "NondiscriminationTestResult.${tr}.status == \"COMPUTED\""

      - name: lost_earnings_per_segment_rounding
        grounds:
          - calculations.lost_earnings_on_late_deposit
        distinguishing_aspect: |
          Mode (b) — nested rounding order: principal 100000c at 8.0% accrues
          219.178c over the 10-day late segment and 438.356c over the 20-day
          post-deposit segment; the scaffold pins round-per-segment-then-sum
          (219 + 438 = 657), whereas sum-then-round would give
          round(657.534) = 658 — a different cent total, exercised here on the
          interest formula, not on a tiered min/max formula.
        test_recipe:
          setup:
            - "Small-plan engagement (1 participant -> 7-business-day standard), PY2025"
            - "One ELECTIVE_DEFERRAL of 100000c, payroll 2026-01-05 (Mon), deposited 2026-01-15 (8 business days -> LATE)"
            - "Logical clock 2026-02-04 (20 days after deposit); assessment confirmed; finding acknowledged"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "005", plan_name: "Delta 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 100000, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/engagements/${eng}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "ELECTIVE_DEFERRAL", payroll_date: "2026-01-05", deposit_date: "2026-01-15", amount_cents: 100000 }
              as: SponsorAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-04T00:00:00Z" }
              as: System
            - call: "POST /plan-audit/engagements/${eng}/late-deposit-scan"
              payload: {}
              as: TPASpecialist
            - call: "GET /plan-audit/late-contribution-assessments"
              payload: { engagement_id: "${eng}" }
              as: Any
              captures: { asm: "$.data[0].id" }
            - call: "POST /plan-audit/late-contribution-assessments/${asm}/confirm"
              payload: {}
              as: PlanAuditor
            - call: "GET /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "LATE_REMITTANCE" }
              as: Any
              captures: { f1: "$.data[0].id" }
            - call: "POST /plan-audit/findings/${f1}/acknowledge"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
          trigger:
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "LOST_EARNINGS_DEPOSIT", principal_cents: 100000, planned_execution_date: "2026-02-04", assessment_id: "${asm}", earnings_variant: "VFCP" }
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
              captures: { ca: $.data.id }
          assert:
            - "CorrectiveAction.${ca}.earnings_cents == 657"
            - "CorrectiveAction.${ca}.earnings_cents != 658"
            - "CorrectiveAction.${ca}.total_amount_cents == 100657"
            - "LateContributionAssessment.${asm}.lost_earnings_vfcp_cents == 657"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (two DIFFERENT entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: filing_reject_reopen_amend_cycle
        grounds:
          - state_machines.Form5500Filing.FILED_to_REJECTED
          - state_machines.Form5500Filing.REJECTED_to_DRAFT
          - state_machines.Form5500Filing.ACCEPTED_to_AMENDED_DRAFT
        distinguishing_aspect: |
          Form5500Filing is branching + cyclic: FILED forks to ACCEPTED or
          REJECTED, REJECTED loops back to DRAFT, and ACCEPTED loops into the
          AMENDED_DRAFT amendment cycle that re-joins FILED — a non-linear
          machine on the filing entity, distinct from the Contribution
          parallel-dimension machine of the sibling instance.
        test_recipe:
          setup:
            - "Small-plan engagement (1 participant) walked to REPORT_ISSUED; filing assembled with one verified Schedule I entry and marked READY_TO_FILE; logical clock 2026-07-15 (before original due date 2026-07-31)"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "006", plan_name: "Epsilon 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng}/activate"
              payload: {}
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/begin_testing"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng}/begin_fieldwork"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/engagements/${eng}/issue_report"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/filings"
              payload: { engagement_id: "${eng}" }
              as: TPASpecialist
              as_user_id: "u-tpa-1"
              captures: { fil: $.data.id }
            - call: "POST /plan-audit/schedule-entries"
              payload: { filing_id: "${fil}", schedule_type: "I", line_item: "I-1 total assets", amount_cents: 0 }
              as: TPASpecialist
              captures: { se: $.data.id }
            - call: "POST /plan-audit/schedule-entries/${se}/verify"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/filings/${fil}/mark_schedules_complete"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/filings/${fil}/mark_ready"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: System
            - call: "POST /plan-audit/filings/${fil}/submit"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /plan-audit/filings/${fil}/record_disposition"
              payload: { outcome: "REJECTED", rejection_reason: "EFAST2 schema error" }
              as: System
            - call: "POST /plan-audit/filings/${fil}/reopen"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/filings/${fil}/mark_schedules_complete"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/filings/${fil}/mark_ready"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /plan-audit/filings/${fil}/submit"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /plan-audit/filings/${fil}/record_disposition"
              payload: { outcome: "ACCEPTED" }
              as: System
            - call: "GET /plan-audit/filings/${fil}"
              payload: {}
              as: Any
              captures: { fil_v: $.data.version }
            - call: "POST /plan-audit/filings/${fil}/amendments"
              payload: { expected_filing_version: "${fil_v}", amendment_reason: "Schedule C omission" }
              as: TPASpecialist
            - call: "POST /plan-audit/filings/${fil}/mark_schedules_complete"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/filings/${fil}/mark_ready"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /plan-audit/filings/${fil}/submit"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /plan-audit/filings/${fil}/record_disposition"
              payload: { outcome: "ACCEPTED" }
              as: System
          assert:
            - "Form5500Filing.${fil}.status == \"ACCEPTED\""
            - "Form5500Filing.${fil}.is_amendment == true"
            - "Form5500Filing.${fil}.is_late == false"
            - "Form5500Filing.${fil}.penalty_cents == 0"
            - "Form5500Filing.${fil}.original_due_date == \"2026-07-31\""

      - name: contribution_parallel_state_dimensions
        grounds:
          - state_machines.Contribution
          - entities.Contribution.fields.match_status
          - entities.Contribution.fields.timeliness_status
        distinguishing_aspect: |
          Contribution carries two independent parallel state dimensions:
          matching (UNMATCHED -> MATCHED -> UNMATCHED) flips without touching
          timeliness, and the late-deposit scan flips timeliness
          (PENDING -> LATE) without touching match_status; correction moves
          timeliness LATE -> CORRECTED while match stays UNMATCHED — parallel
          dimensions on one entity, distinct from the filing machine.
        test_recipe:
          setup:
            - "Small-plan engagement PY2025; participant with opening_balance 1000000c; trust statement covering [2025-01-01, 2025-12-31] reporting 500000c; contribution of 500000c payroll 2025-06-16 deposited 2025-06-30 (10 business days -> LATE, severity MEDIUM)"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "007", plan_name: "Zeta 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 500000, opening_balance_cents: 1000000 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/engagements/${eng}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/trust-statements"
              payload: { engagement_id: "${eng}", period_start: "2025-01-01", period_end: "2025-12-31", custodian: "National Trust Co", certification: "CERTIFIED", reported_deposit_total_cents: 500000 }
              as: SponsorAdmin
              captures: { ts: $.data.id }
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "ELECTIVE_DEFERRAL", payroll_date: "2025-06-16", deposit_date: "2025-06-30", amount_cents: 500000 }
              as: SponsorAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /plan-audit/contributions/${c1}/match"
              payload: { trust_statement_id: "${ts}" }
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/late-deposit-scan"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/contributions/${c1}/unmatch"
              payload: {}
              as: SponsorAdmin
            - call: "GET /plan-audit/late-contribution-assessments"
              payload: { engagement_id: "${eng}" }
              as: Any
              captures: { asm: "$.data[0].id" }
            - call: "POST /plan-audit/late-contribution-assessments/${asm}/confirm"
              payload: {}
              as: PlanAuditor
            - call: "GET /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "LATE_REMITTANCE" }
              as: Any
              captures: { f1: "$.data[0].id" }
            - call: "POST /plan-audit/findings/${f1}/acknowledge"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
            - call: "POST /plan-audit/corrective-actions"
