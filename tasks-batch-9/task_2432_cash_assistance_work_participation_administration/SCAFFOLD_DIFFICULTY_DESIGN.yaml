          (priority 60) are both true on the same approve call and the response is
          ERR_TIME_LIMIT_EXHAUSTED, a different error-category pair than the
          cross_entity_state versus business_fiscal pair of the authorize instance.
        test_recipe:
          setup:
            - "A SINGLE_PARENT household of size 3 has a prior assistance record of 24 state months and 24 federal months, so state_clock_months_used is already 24."
