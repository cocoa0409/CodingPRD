              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 0, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${t1}", transferee_partner_id: "${t2}", pct_bps: 1000, effective_date: "2025-06-01", settlement_date: "2025-06-10" }
              as: FundTaxAdmin
              captures: { tr: "$.data.id" }
            - call: "POST /funds/transfers/${tr}/confirm"
              payload: {}
              as: FundTaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: FundTaxAdmin
          trigger:
            - call: "POST /funds/transfers/${tr}/settle"
              payload: {}
              as: FundTaxAdmin
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_TAX_YEAR_WINDOW_CLOSED (409); OwnershipTransfer.${tr}.status remains CONFIRMED"

      - name: lock_provisional_run_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AllocationRun, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "run_kind gates the lock transition: a COMPUTED PROVISIONAL run cannot be locked even when the tax year is BOOKS_CLOSED."
        test_recipe:
          setup: ["fund with partner; TaxYear 2025 BOOKS_CLOSED; one COMPUTED PROVISIONAL run"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund V21", ein: "22-4000022", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
