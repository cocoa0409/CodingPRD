  - rule_id: resource_temporal_overlap
    instances:
      - name: availability_window_half_open_adjacency_versus_one_second_overlap
        grounds:
          - validations.availability_window_overlap
          - entities.AvailabilityWindow.fields.starts_at
          - entities.AvailabilityWindow.fields.ends_at
          - entities.AvailabilityWindow.fields.status
        distinguishing_aspect: |
          This instance isolates the FIRST of the three coexisting window semantics: AvailabilityWindow
          overlap is judged on HALF-OPEN geometry [starts_at, ends_at). Rejection requires
          new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at - both comparisons
          strict - so a window that merely TOUCHES an existing window at a single instant is legal on
          either side (new.starts_at == existing.ends_at, and new.ends_at == existing.starts_at), while
          a single second of genuine intersection is refused. No buffer and no aggregate-hour cap
          participate here, which is what separates this instance from the 72h milestone buffer
          instance and from the rolling 14-day saturation instance. Trigger calls are indexed by their
          position in the trigger list, so responses[0] is the first trigger call.
        test_recipe:
          setup:
            - "Cycle 2026-Q1 open [2026-01-01T00:00:00Z, 2026-04-01T00:00:00Z) with 10 slots; LARGE partner (annual_budget_usd 12000000.00); SENIOR volunteer at 150.00/h, vetted with LEGAL_CONTRACTS proficiency 4 verified."
            - "Exactly one existing HARD availability window [2026-01-05T00:00:00Z, 2026-03-01T00:00:00Z) offering 300.00 hours."
            - "Logical clock at 2026-01-10T00:00:00Z."
