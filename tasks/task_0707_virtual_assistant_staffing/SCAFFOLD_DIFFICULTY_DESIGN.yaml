        distinguishing_aspect: |
          sla_due uses a STRICT '>' boundary: a task ASSIGNED at 2026-03-01T00:00:00Z under the
          STANDARD policy (resolution_hours=24) has resolution_due_iso 2026-03-02T00:00:00Z; with
