        claim_type: Input Set Filtering
        grounds:
          - calculations.actual_labor_minutes
          - entities.TimeEntry.fields.status
          - entities.Visit.fields.actual_labor_min
        distinguishing_aspect: "actual_labor_minutes sums only COMPLETED entries; a visit with one COMPLETED 60-min entry and one VOIDED entry yields actual_labor_min == 60 (VOIDED excluded)."
