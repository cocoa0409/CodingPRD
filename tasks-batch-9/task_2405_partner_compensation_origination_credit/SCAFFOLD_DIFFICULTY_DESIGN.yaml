              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${m1v2}" }
              as: CreditArbiter
              as_user_id: "${parb}"
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-X2", client_display_name: "Second Sunset LLC", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-02-01", billing_attorney_id: "${s1}", responsible_attorney_id: "${s1}" }
              as: CycleAdmin
              captures: { m2: "$.data.id", m2v: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m2}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Originated Second Sunset LLC." }
              as: Partner
              as_user_id: "${s1}"
              captures: { cl2: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl2}/submit"
              payload: {}
              as: Partner
              as_user_id: "${s1}"
            - call: "POST /comp/credit-claims/${cl2}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${m2v}" }
              as: CreditArbiter
              as_user_id: "${parb}"
            - call: "POST /comp/partners/${pa}/notice-of-departure"
              payload: { departure_effective_on: "2026-12-31" }
              as: CycleAdmin
            - call: "POST /comp/partners/${s1}/notice-of-departure"
              payload: { departure_effective_on: "2026-11-30" }
              as: CycleAdmin
            - call: "GET /comp/credit-transitions"
              payload: { departing_partner_id: "${pa}", matter_id: "${m1}" }
              as: CycleAdmin
              captures: { tr: "$.data[0].id", tr_state: "$.data[0].state", tr_pct: "$.data[0].transferred_pct" }
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v3: "$.data.version" }
          trigger:
            - call: "POST /comp/credit-transitions/${tr}/effectuate"
              payload: { successor_partner_id: "${s1}", effective_on: "2026-09-01", expected_matter_version: "${m1v3}" }
              as: CycleAdmin
              captures: { err_succ: "$.data.error_id" }
            - call: "POST /comp/credit-transitions/${tr}/effectuate"
              payload: { successor_partner_id: "${s2}", effective_on: "2026-09-01", expected_matter_version: "${m1v3}" }
              as: CycleAdmin
          assert:
            - "${tr_state} == PROPOSED and ${tr_pct} == 100.00"
            - "${err_succ} == ERR_SUCCESSOR_NOT_ELIGIBLE with HTTP 409"
            - "at the time of the refused call Partner.${s1}.status == NOTICE_GIVEN (S1 still holds a PROPOSED transition on ${m2}) and Partner.${s2}.status == ACTIVE"
            - "at the time of the refused call Partner.${pa}.status == NOTICE_GIVEN, so the departing-partner precondition was satisfied and only the successor check can have failed"
            - "CreditTransition.${tr}.state == PROPOSED and successor_partner_id is null after the refused call"
            - "Matter.${m1}.version == ${m1v3} after the refused call, so the same expected_matter_version is still current for the retry"
            - "the second call returns HTTP 200, CreditTransition.${tr}.state == EFFECTIVE, successor_partner_id == ${s2} and effective_on == 2026-09-01"
            - "the ORIGINATING allocation of ${pa} on ${m1} is TRANSFERRED with credit_through 2026-09-01, and a new ORIGINATING allocation for ${s2} runs [2026-09-01, null) at credit_pct 100.00 with source TRANSITION"
            - "Matter.${m1}.origination_pct_assigned == 100.00 after the transfer"
            - "after the successful effectuate Partner.${pa}.status == DEPARTED, because ${tr} was A's only PROPOSED transition, while Partner.${s1}.status is still NOTICE_GIVEN"

  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: originating_credit_aggregate_capacity_over_open_ended_windows
        grounds:
          - validations[priority=120]
          - errors[ERR_CREDIT_INTERVAL_OVERSUBSCRIBED]
          - entities.CreditAllocation.fields.credit_from
          - entities.CreditAllocation.fields.credit_through
          - entities.Matter.fields.origination_pct_assigned
          - state_machines.CreditAllocation.ACTIVE_to_TRANSFERRED
        distinguishing_aspect: |
          Resource entity: Matter, holding an aggregate 100.00 percentage-point origination
          capacity. Interval semantics: half-open [credit_from, credit_through) with an
          open-ended null upper bound. Two 100.00 allocations that meet exactly at
          2026-09-01 are adjacent, not overlapping, so they coexist legally, while a mere
          30.00 allocation whose window genuinely overlaps an existing 100.00 one is
          refused - the capacity test is over overlapping windows, never over row counts
          or over the lifetime total.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner A (FORMULA) holds ORIGINATING 100.00 on OPEN Matter M over the open-ended window [2026-01-15, null) after an ALLOCATE adjudication."
            - "Partner B (FORMULA) has a separate SUBMITTED NEW_CLIENT claim on the same Matter M for 30.00, awaiting adjudication."
            - "Partner ARB is the is_credit_arbiter; Partner ARB holds no credit."
            - "Matter.origination_pct_assigned is 100.00, i.e. the whole capacity is consumed for every instant from 2026-01-15 onwards."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ben Counter", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2011 }
              as: CycleAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rex Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true }
              as: CycleAdmin
              captures: { parb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-W1", client_display_name: "Window Works", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id", m1v: "$.data.version" }
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 400000, collected_delta_cents: 400000, direct_cost_delta_cents: 0, expected_matter_version: "${m1v}" }
              as: CycleAdmin
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m1}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Sole originator of Window Works." }
              as: Partner
              as_user_id: "${pa}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v2: "$.data.version" }
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${m1v2}" }
              as: CreditArbiter
              as_user_id: "${parb}"
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m1}", claim_basis: "NEW_CLIENT", requested_pct: 30.00, narrative: "I made the introduction that produced this client." }
              as: Partner
              as_user_id: "${pb}"
              captures: { cl2: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl2}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pb}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v3: "$.data.version", opa_before: "$.data.origination_pct_assigned" }
          trigger:
            - call: "POST /comp/credit-claims/${cl2}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 30.00, expected_matter_version: "${m1v3}" }
              as: CreditArbiter
              as_user_id: "${parb}"
              captures: { err_over: "$.data.error_id" }
            - call: "POST /comp/partners/${pa}/notice-of-departure"
              payload: { departure_effective_on: "2026-12-31" }
              as: CycleAdmin
            - call: "GET /comp/credit-transitions"
              payload: { departing_partner_id: "${pa}", matter_id: "${m1}" }
              as: CycleAdmin
              captures: { tr: "$.data[0].id" }
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v4: "$.data.version" }
            - call: "POST /comp/credit-transitions/${tr}/effectuate"
              payload: { successor_partner_id: "${pb}", effective_on: "2026-09-01", expected_matter_version: "${m1v4}" }
              as: CycleAdmin
          assert:
            - "${opa_before} == 100.00"
            - "${err_over} == ERR_CREDIT_INTERVAL_OVERSUBSCRIBED with HTTP 409"
            - "CreditClaim.${cl2}.state == SUBMITTED after the refused adjudication and no ORIGINATING allocation exists for ${pb} on ${m1} at that point"
            - "Matter.${m1}.origination_pct_assigned == 100.00 after the refused adjudication, i.e. the 30.00 was never partially applied"
            - "the effectuate call returns HTTP 200 even though the two ORIGINATING rows are 100.00 each, because their windows only touch"
            - "the ORIGINATING allocation of ${pa} on ${m1} is TRANSFERRED with credit_from 2026-01-15 and credit_through 2026-09-01"
            - "the ORIGINATING allocation of ${pb} on ${m1} is ACTIVE with credit_from 2026-09-01, credit_through null and credit_pct 100.00"
            - "the earlier row's credit_through equals the later row's credit_from exactly, and under half-open semantics no instant is covered by both"
            - "Matter.${m1}.origination_pct_assigned == 100.00 after the transfer, never 200.00"
            - "at no point does the sum of credit_pct over ORIGINATING rows whose windows overlap exceed 100.00"

      - name: draw_period_bucket_equality_ignores_interval_geometry
        grounds:
          - validations[priority=120]
          - errors[ERR_DRAW_PERIOD_ALREADY_PAID]
          - entities.DrawPayment.fields.period_year
          - entities.DrawPayment.fields.period_month
          - entities.DrawPayment.fields.reversed
          - endpoints[POST /comp/awards/{id}/draw-run]
          - state_machines.CompensationCycle.AWARDS_PUBLISHED_to_DELIBERATION
        distinguishing_aspect: |
          A different resource entity (CompensationAward, not Matter) under deliberately
          different interval semantics: the contended resource is a discrete
          (period_year, period_month) bucket, so there is no geometry to compare at all -
          adjacency, containment and partial overlap are all meaningless and only exact
          bucket equality collides. The occupancy is additionally conditional on
          reversed == false, so a reopen frees the 2026-01 bucket for reuse, which no
          uniqueness-index implementation over (award, year, month) can reproduce.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Cycle fiscal_year 2026 with distributable_pool_cents 100000000, discretionary_pool_pct 0.2000 and draw_pct 0.8000 has been advanced to AWARDS_PUBLISHED."
            - "Partner SUBJ is DISCRETIONARY with evaluation_required true; CM1 and CM2 are committee members with evaluation_required false."
            - "SUBJ's award is PUBLISHED with target_award_cents 20000000 and draw_schedule_monthly_cents 1333333, and its 2026-01 draw has already been paid."
            - "Exactly one DrawPayment exists on the award: kind SCHEDULED_DRAW, 2026-01, amount_cents 1333333, reversed false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
