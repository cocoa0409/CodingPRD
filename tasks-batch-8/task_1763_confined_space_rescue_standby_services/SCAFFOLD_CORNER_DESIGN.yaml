      - name: corner_personnel_already_on_duty
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_PERSONNEL_ALREADY_ON_DUTY]"]
        distinguishing_aspect: "A worker ON_DUTY on one permit cannot check in on another permit the next day (no check-out happened): the ON_DUTY status persists across the midnight boundary and blocks the second check-in."
        test_recipe:
          setup:
            - "Two ACTIVE permits on two spaces (P1 activated day1 05:30, P2 activated day1 05:30 with planned window spanning into day2)"
            - "att1 has shift1 on P1 (day1 06:00-17:00) and shift2 on P2 (day2 06:00-12:00, rest gap 13h satisfied)"
            - "att1 checked into shift1 at day1 06:00 and never checked out; clock advanced to day2 06:00"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
