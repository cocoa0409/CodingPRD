# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: AP/IB Program Coordination & Exam Ordering
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml
# §1.1-§1.7. All monetary/date literals were computed by executing the declared
# formulas (round_half_up, 730-day validity, 900bp rebate).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: ExamOrder vs Student)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_invoice_estimate_vs_final_divergence
        grounds:
          - calculations.order_invoice
          - state_machines.ExamOrder.LOCKED_to_RECONCILED
        distinguishing_aspect: |
          ExamOrder-domain dual variant: the forward-looking estimate (live
          registrations, no unused penalty) and the chronological final (frozen
          submit-time lines replayed against SAT outcomes) diverge by exactly the
          one no-show's unused penalty: 29400 vs 30900 on identical registration
          data. The second Rule-1 instance sits on a different entity domain
          (Student money, not ExamOrder invoice).
        test_recipe:
          setup:
            - "Cycle (fee constants: late 4000, unused penalty 1500, reduction 3600, rebate 900bp) is OPEN"
            - "Course AP_CALC_BC fee 9800 with an AUTHORIZED teacher (course ACTIVE)"
            - "Three students registered on time (clock at default 2026-08-01, before registration deadline); no subsidies"
            - "Order submitted on time (clock 2026-11-10T00:00:00Z <= order deadline): estimate frozen at 3 x 9800 = 29400"
            - "Session administered with r1, r2 present (SAT) and r3 absent (NO_SHOW)"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Instructor", email: "inst@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu B", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s2: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu C", grade_level: 12, subgroup_code: "FRL" }
              as: ApCoordinator
              captures: { s3: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s2}", course_id: "${co}" }
              as: Student
              as_user_id: "${s2}"
              captures: { r2: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s3}", course_id: "${co}" }
              as: Student
              as_user_id: "${s3}"
              captures: { r3: $.data.id }
            - call: "POST /exam-orders"
              payload: { cycle_id: "${cy}" }
              as: ApCoordinator
              captures: { ord: $.data.id }
            - call: "POST /exam-orders/${ord}/submit"
              as: ApCoordinator
            - call: "POST /exam-sessions"
              payload: { course_id: "${co}", room_name: "GYM", room_capacity: 10, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
              captures: { se: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-05T12:00:00Z" }
              as: ApCoordinator
            - call: "POST /exam-sessions/${se}/administer"
              payload: { present_registration_ids: ["${r1}", "${r2}"] }
              as: ApCoordinator
            - call: "POST /exam-orders/${ord}/lock"
              as: ApCoordinator
          trigger:
            - call: "POST /exam-orders/${ord}/reconcile"
              as: ApCoordinator
            - call: "GET /exam-orders/${ord}"
              as: ApCoordinator
          assert:
            - "ExamOrder.${ord}.estimate_total_cents == 29400 (frozen at submit: 3 x 9800, no late, no subsidy)"
            - "ExamOrder.${ord}.final_total_cents == 30900 (29400 + 1 unused x 1500; r3 NO_SHOW makes 1 exam unused)"
            - "ExamOrder.${ord}.estimate_total_cents != ExamOrder.${ord}.final_total_cents (forward-looking vs chronological variants diverge on identical registration data)"

      - name: student_balance_provisional_vs_projected_divergence
        grounds:
          - calculations.student_balance
          - entities.Student.fields.balance_cents
          - entities.Student.fields.projected_balance_cents
        distinguishing_aspect: |
          Student-domain dual variant: with an undecided (SUBMITTED) fee-reduction
          application, the pessimistic provisional balance bills full price (9800)
          while the optimistic projected balance books the subsidy (6200) — same
          registration, same fee data, two valid readings. Entity domain (Student
          account) differs from the ExamOrder-invoice instance.
        test_recipe:
          setup:
            - "Cycle OPEN; course fee 9800; student s1 registered on time (net 9800, no subsidy yet)"
            - "s1 has a SUBMITTED fee-reduction application for the cycle (not yet decided)"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "FRL" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /fee-reduction-applications"
              payload: { student_id: "${s1}", cycle_id: "${cy}", eligibility_basis: "FREE_LUNCH", annual_income_cents: 3000000 }
              as: Student
              as_user_id: "${s1}"
          trigger:
            - call: "GET /students/${s1}/statement"
              as: ApCoordinator
          assert:
            - "statement.balance_cents == 9800 (provisional: SUBMITTED application contributes no subsidy)"
            - "statement.projected_balance_cents == 6200 (projected: 9800 - min(3600, 9800))"
            - "statement.balance_cents != statement.projected_balance_cents (variants diverge while the application is undecided)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) multi-input branches vs mode (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: order_invoice_multibranch_mode_a
        grounds:
          - calculations.order_invoice
          - calculations.registration_net_fee
        distinguishing_aspect: |
          Mode (a): the invoice estimate combines >= 3 inputs with conditional
          branches — per-course ordered counts x fees, a whole-order late branch
          (submitted after deadline bills 4000 per ordered exam), and a subsidy
          component that itself nests a min() per registration — yielding
          3 x 9800 + 3 x 4000 - 3600 = 37800. Its mode differs from the
          rounding-order instance (mode b).
        test_recipe:
          setup:
            - "Cycle OPEN (late fee 4000, reduction 3600); course fee 9800"
            - "Student A registered on time, no subsidy; student C registered on time with APPROVED application (subsidy 3600)"
            - "Student B registered late (clock 2026-11-10T00:00:00Z, after the 2026-11-01T12:00:00Z registration deadline)"
            - "Order submitted late (clock 2026-11-20T00:00:00Z, after the 2026-11-15T12:00:00Z order deadline)"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { sA: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu B", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { sB: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu C", grade_level: 12, subgroup_code: "FRL" }
              as: ApCoordinator
              captures: { sC: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${sA}", course_id: "${co}" }
              as: Student
              as_user_id: "${sA}"
            - call: "POST /registrations"
              payload: { student_id: "${sC}", course_id: "${co}" }
              as: Student
              as_user_id: "${sC}"
              captures: { rC: $.data.id }
            - call: "POST /fee-reduction-applications"
              payload: { student_id: "${sC}", cycle_id: "${cy}", eligibility_basis: "REDUCED_LUNCH", annual_income_cents: 4200000 }
              as: Student
              as_user_id: "${sC}"
              captures: { fraC: $.data.id }
            - call: "POST /fee-reduction-applications/${fraC}/approve"
              as: ApCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T00:00:00Z" }
              as: ApCoordinator
            - call: "POST /registrations"
              payload: { student_id: "${sB}", course_id: "${co}" }
              as: Student
              as_user_id: "${sB}"
              captures: { rB: $.data.id }
            - call: "POST /exam-orders"
              payload: { cycle_id: "${cy}" }
              as: ApCoordinator
              captures: { ord: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-20T00:00:00Z" }
              as: ApCoordinator
          trigger:
            - call: "POST /exam-orders/${ord}/submit"
              as: ApCoordinator
          assert:
            - "ExamRegistration.${rB}.is_late == true and late_fee_applied_cents == 4000 (student-bill late branch)"
            - "ExamRegistration.${rC}.subsidy_cents == 3600 and net_fee_cents == 6200 (subsidy branch, min(3600, 9800))"
            - "ExamOrder.${ord}.submitted_late == true (whole-order late branch)"
            - "ExamOrder.${ord}.estimate_total_cents == 37800 (3 x 9800 + 3 x 4000 late-order component - 3600 subsidy component)"

      - name: rebate_per_line_rounding_mode_b
        grounds:
          - calculations.school_rebate
          - entities.ExamCycle.fields.rebate_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-registration-then-sum, so three net fees of 1050 at 900bp
          yield 3 x round_half_up(94.5) = 285, whereas the rejected
          sum-then-round order would yield round_half_up(283.5) = 284. Distinct
          mode from the multi-input branching instance (mode a).
        test_recipe:
          setup:
            - "Cycle OPEN with rebate_rate_bp 900; course fee 1050"
            - "Three students each registered once, on time, no subsidies (net 1050 each)"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_MICRO", program: "AP", exam_fee_cents: 1050, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 10, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu B", grade_level: 10, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s2: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu C", grade_level: 11, subgroup_code: "ELL" }
              as: ApCoordinator
              captures: { s3: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /registrations"
              payload: { student_id: "${s2}", course_id: "${co}" }
              as: Student
              as_user_id: "${s2}"
            - call: "POST /registrations"
              payload: { student_id: "${s3}", course_id: "${co}" }
              as: Student
              as_user_id: "${s3}"
          trigger:
            - call: "GET /exam-cycles/${cy}"
              as: ApCoordinator
          assert:
            - "ExamCycle.${cy}.rebate_cents == 285 (3 x round_half_up(1050 x 900 / 10000) = 3 x 95; sum-then-round would give 284 and is the REJECTED order)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cyclic TeacherAuthorization vs parallel-dimension ExamRegistration)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: teacher_authorization_expiry_retrain_cycle
        grounds:
          - state_machines.TeacherAuthorization.PENDING_TRAINING_to_AUTHORIZED
          - state_machines.TeacherAuthorization.AUTHORIZED_to_EXPIRED
          - state_machines.TeacherAuthorization.EXPIRED_to_AUTHORIZED
          - calculations.authorization_expiry
        distinguishing_aspect: |
          Cyclic machine on TeacherAuthorization: PENDING_TRAINING → AUTHORIZED →
          EXPIRED (inclusive >= boundary at authorized_until) → AUTHORIZED again
          via retraining, with authorized_until recomputed (+730 days) on each
          loop. The second Rule-3 instance is a parallel-dimensions machine on a
          different entity (ExamRegistration).
        test_recipe:
          setup:
            - "Cycle OPEN; course exists; teacher t1 has a TeacherAuthorization created by the coordinator"
            - "Training completed at logical 2026-09-01T00:00:00Z → authorized_until 2028-08-31T00:00:00Z"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Instructor", email: "inst@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ApCoordinator
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
          trigger:
            - call: "GET /teacher-authorizations/${ta1}"
              as: ApCoordinator
              captures: { ta_until_1: $.data.authorized_until }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-30T00:00:00Z" }
              as: ApCoordinator
            - call: "GET /teacher-authorizations/${ta1}"
              as: ApCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-31T00:00:00Z" }
              as: ApCoordinator
            - call: "GET /teacher-authorizations/${ta1}"
              as: ApCoordinator
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "GET /teacher-authorizations/${ta1}"
              as: ApCoordinator
            - call: "GET /courses/${co}"
              as: ApCoordinator
          assert:
            - "After first complete-training: TeacherAuthorization.${ta1}.status == AUTHORIZED and authorized_until == 2028-08-31T00:00:00Z (2026-09-01 + 730 days)"
            - "At clock 2028-08-30T00:00:00Z: status still AUTHORIZED (day before the inclusive boundary)"
            - "At clock 2028-08-31T00:00:00Z: status == EXPIRED (>= boundary counts as expired) and Course.${co}.status == SUSPENDED and authorized_teacher_count == 0"
            - "After retraining at 2028-08-31: status == AUTHORIZED again and authorized_until == 2030-08-31T00:00:00Z (2028-08-31 + 730 days) and Course.${co}.status == ACTIVE (cycle closed)"

      - name: registration_parallel_dimensions_independent
        grounds:
          - state_machines.ExamRegistration.REGISTERED_to_SAT
          - state_machines.ExamRegistration.REGISTERED_to_NO_SHOW
          - state_machines.ExamRegistration.PENDING_to_RELEASED
          - state_machines.ExamRegistration.RELEASED_to_POSTED
        distinguishing_aspect: |
          Parallel state dimensions on ExamRegistration: registration_status and
          score_status evolve independently — r1 walks SAT x PENDING → SAT x
          RELEASED → SAT x POSTED while r2 sits at NO_SHOW x NO_SCORE, proving
          neither dimension collapses into the other. A different entity and a
          different non-linear shape than the TeacherAuthorization cycle.
        test_recipe:
          setup:
            - "Cycle OPEN; course ACTIVE (authorized teacher); students s1, s2 registered (r1, r2)"
            - "Session administered with only r1 present; clock then moved to score release day"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Instructor", email: "inst@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu B", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s2: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s2}", course_id: "${co}" }
              as: Student
              as_user_id: "${s2}"
              captures: { r2: $.data.id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${co}", room_name: "GYM", room_capacity: 10, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
              captures: { se: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-05T12:00:00Z" }
              as: ApCoordinator
            - call: "POST /exam-sessions/${se}/administer"
              payload: { present_registration_ids: ["${r1}"] }
              as: ApCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-05T12:00:00Z" }
              as: ApCoordinator
          trigger:
            - call: "POST /exam-cycles/${cy}/release-scores"
              payload: { scores: [{ registration_id: "${r1}", score: 4 }] }
              as: Registrar
            - call: "POST /registrations/${r1}/post-to-transcript"
              as: Registrar
            - call: "GET /registrations/${r1}"
              as: ApCoordinator
            - call: "GET /registrations/${r2}"
              as: ApCoordinator
          assert:
            - "ExamRegistration.${r1}.registration_status == SAT and score_status == POSTED (both dimensions advanced independently)"
            - "ExamRegistration.${r1}.score == 4"
            - "ExamRegistration.${r2}.registration_status == NO_SHOW and score_status == NO_SCORE (untouched by r1's release/posting)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (clock-sweep chain depth 3 vs fee-approval chain depth 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: clock_sweep_expiry_cascade_depth3
        grounds:
          - state_machines.TeacherAuthorization.AUTHORIZED_to_EXPIRED
          - state_machines.Course.ACTIVE_to_SUSPENDED
          - state_machines.ExamSession.SCHEDULED_to_CANCELLED
          - state_machines.ProctorAssignment.ASSIGNED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 chain from the clock-sweep trigger: TA expiry mutates Course
          (count 1→0 → SUSPENDED); the course suspension itself cancels the
          SCHEDULED session; the session cancellation itself releases the
          proctor. Each link is caused by the previous link, not by the clock
          directly. Trigger differs from the fee-approval cascade.
        test_recipe:
          setup:
            - "Cycle OPEN; course ACTIVE via teacher t1's AUTHORIZED record (training completed 2026-09-01, authorized_until 2028-08-31T00:00:00Z)"
            - "One student registered; session SCHEDULED (room LAB, capacity 5); teacher t2 (no authorization in the course) ASSIGNED as proctor"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Instructor", email: "inst@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Proctor", email: "proc@x.edu" }
              as: ApCoordinator
              captures: { t2: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ApCoordinator
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /exam-sessions"
              payload: { course_id: "${co}", room_name: "LAB", room_capacity: 5, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
              captures: { se: $.data.id }
            - call: "POST /proctor-assignments"
              payload: { session_id: "${se}", teacher_id: "${t2}" }
              as: ApCoordinator
              captures: { pa: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-31T00:00:00Z" }
              as: ApCoordinator
            - call: "GET /teacher-authorizations/${ta1}"
              as: ApCoordinator
            - call: "GET /courses/${co}"
              as: ApCoordinator
            - call: "GET /exam-sessions/${se}"
              as: ApCoordinator
            - call: "GET /proctor-assignments/${pa}"
              as: ApCoordinator
          assert:
            - "TeacherAuthorization.${ta1}.status == EXPIRED (cascade origin: clock >= authorized_until)"
            - "Course.${co}.authorized_teacher_count == 0 and status == SUSPENDED (link 1: expiry mutated the course)"
            - "ExamSession.${se}.status == CANCELLED (link 2: course suspension cancelled the SCHEDULED session)"
            - "ProctorAssignment.${pa}.status == RELEASED (link 3: session cancellation released the proctor)"

      - name: fee_approval_cascade_depth2
        grounds:
          - state_machines.FeeReductionApplication.SUBMITTED_to_APPROVED
          - calculations.registration_net_fee
          - calculations.student_balance
          - calculations.school_rebate
        distinguishing_aspect: |
          Depth-2 chain from the approve trigger: approval mutates each
          registration's subsidy_cents/net_fee_cents (link 1); that registration
          mutation itself recomputes the student's balance and the cycle's rebate
          (link 2). Different triggering transition than the clock-sweep cascade,
          and a fan-out at link 2 (Student money + ExamCycle rebate) caused by
          link 1's registration mutation.
        test_recipe:
          setup:
            - "Cycle OPEN (reduction 3600, rebate 900bp); two courses co1, co2 both fee 9800"
            - "Student s1 registered in both courses on time (balance 19600, rebate 2 x 882 = 1764)"
            - "s1's fee-reduction application is SUBMITTED"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co1: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_BIOLOGY", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co2: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "FRL" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co1}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co2}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r2: $.data.id }
            - call: "POST /fee-reduction-applications"
              payload: { student_id: "${s1}", cycle_id: "${cy}", eligibility_basis: "FREE_LUNCH", annual_income_cents: 2800000 }
              as: Student
              as_user_id: "${s1}"
              captures: { fra: $.data.id }
          trigger:
            - call: "POST /fee-reduction-applications/${fra}/approve"
              as: ApCoordinator
            - call: "GET /registrations/${r1}"
              as: ApCoordinator
            - call: "GET /students/${s1}/statement"
              as: ApCoordinator
            - call: "GET /exam-cycles/${cy}"
              as: ApCoordinator
          assert:
            - "ExamRegistration.${r1}.subsidy_cents == 3600 and net_fee_cents == 6200 (link 1: registration mutated by the approval)"
            - "statement.balance_cents == 12400 (link 2: 2 x 6200; registration mutation recomputed the student balance)"
            - "ExamCycle.${cy}.rebate_cents == 1116 (link 2: 2 x round_half_up(6200 x 0.09) = 2 x 558; registration mutation recomputed the rebate)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state-vs-constraint vs safety-vs-temporal)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_constraint_on_order_patch
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NEGATIVE_QUANTITY]
        distinguishing_aspect: |
          Error-category pair (state, business_constraint): a PATCH on an already
          SUBMITTED order whose adjustment delta would also drive ordered_count
          below 0 fails two rules; the priority-6 state check wins, so the
          response is ERR_INVALID_STATE (409), never ERR_NEGATIVE_QUANTITY.
        test_recipe:
          setup:
            - "Cycle OPEN; course fee 9800; one registration; order created and already SUBMITTED on time"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /exam-orders"
              payload: { cycle_id: "${cy}" }
              as: ApCoordinator
              captures: { ord: $.data.id }
            - call: "POST /exam-orders/${ord}/submit"
              as: ApCoordinator
            - call: "GET /exam-orders/${ord}"
              as: ApCoordinator
              captures: { ord_v: $.data.version }
          trigger:
            - call: "PATCH /exam-orders/${ord}"
              payload: { expected_exam_order_version: "${ord_v}", adjustments: [{ course_id: "${co}", delta: -5 }] }
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409): the priority-6 state check (PATCH requires DRAFT) beats the priority-9 constraint check (ordered_count 1 - 5 = -4 < 0)"
            - "ExamOrder.${ord}.status remains SUBMITTED and version unchanged (rejected request mutates nothing)"

      - name: proctor_safety_beats_temporal_overlap
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_PROCTOR_SUBJECT_CONFLICT]
          - errors[ERR_PROCTOR_OVERLAP]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_temporal): one proctor
          assignment request violates both the subject-conflict ban (teacher is
          AUTHORIZED in the session's course) and the 30-minute buffered-overlap
          rule; the priority-7 safety check wins, so the response is
          ERR_PROCTOR_SUBJECT_CONFLICT, never ERR_PROCTOR_OVERLAP. Different
          category pair than the state-vs-constraint instance.
        test_recipe:
          setup:
            - "Cycle OPEN; courses coX (AP_CALC_BC) and coY (AP_BIOLOGY) both ACTIVE (t1 authorized in coX, t2 authorized in coY)"
            - "Session sX for coX 2027-05-05 09:00-11:00 room A; session sY for coY 2027-05-05 10:00-12:00 room B"
            - "t1 already ASSIGNED to sY (legal: t1 is not authorized in coY)"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { coX: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_BIOLOGY", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { coY: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T One", email: "t1@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Two", email: "t2@x.edu" }
              as: ApCoordinator
              captures: { t2: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${coX}" }
              as: ApCoordinator
              captures: { taX: $.data.id }
            - call: "POST /teacher-authorizations/${taX}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t2}", course_id: "${coY}" }
              as: ApCoordinator
              captures: { taY: $.data.id }
            - call: "POST /teacher-authorizations/${taY}/complete-training"
              as: Teacher
              as_user_id: "${t2}"
            - call: "POST /exam-sessions"
              payload: { course_id: "${coX}", room_name: "ROOMA", room_capacity: 5, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
              captures: { sX: $.data.id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${coY}", room_name: "ROOMB", room_capacity: 5, start_at: "2027-05-05T10:00:00Z", end_at: "2027-05-05T12:00:00Z" }
              as: ApCoordinator
              captures: { sY: $.data.id }
            - call: "POST /proctor-assignments"
              payload: { session_id: "${sY}", teacher_id: "${t1}" }
              as: ApCoordinator
          trigger:
            - call: "POST /proctor-assignments"
              payload: { session_id: "${sX}", teacher_id: "${t1}" }
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROCTOR_SUBJECT_CONFLICT (http 422): priority-7 safety beats priority-8 temporal even though the buffered overlap with sY (10:00-11:00) also holds"
            - "No new ProctorAssignment row exists for (${sX}, ${t1}): GET /proctor-assignments?session_id=${sX}&teacher_id=${t1} returns an empty array"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (timestamp == vs > on submit vs integer seat equality)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: order_submit_deadline_exact_equality_not_late
        grounds:
          - calculations.order_invoice
          - entities.ExamCycle.fields.order_deadline_at
          - entities.ExamOrder.fields.submitted_late
        distinguishing_aspect: |
          Timestamp boundary on POST /exam-orders/{id}/submit: submitted exactly
          AT order_deadline_at is on time (late requires strictly after), while
          one second later bills the 4000 late fee per ordered exam. Metric
          (submission timestamp) and endpoint differ from the seat-count
          boundary instance.
        test_recipe:
          setup:
            - "Two identical cycles A and B, both OPEN, each with one course (fee 9800), one registration, one DRAFT order"
            - "Logical clock will be pinned to the exact deadline for A and one second past for B"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-A", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cyA: $.data.id }
            - call: "POST /exam-cycles/${cyA}/open"
