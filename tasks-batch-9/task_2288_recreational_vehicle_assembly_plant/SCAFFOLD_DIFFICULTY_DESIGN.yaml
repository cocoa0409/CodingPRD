            - "after the first trigger call the order is CURTAILED with curtailment_due_cents 1451045 (14510453 * 1000/10000 rounded half up)"
            - "after the second trigger call UnitOrder.${ord_id}.financing_status == FLOOR_PLAN_FUNDED and curtailment_paid_cents == 1451045 and curtailment_due_cents == 0"
