  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_evaluation_create_success_increments_patient_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[evaluation-create-stale-patient]", "entities.Patient.fields.version"]
        distinguishing_aspect: "Creating an evaluation with expected_patient_version equal to the current Patient.version (1) succeeds and advances Patient.version to 2."
        test_recipe:
          setup: ["A freshly created patient (version 1)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Clinician
              captures: { pat_v_after: $.data.version }
          assert:
            - "Response 201; Evaluation.${eval_id} created; Patient.${pat_id}.version == 2 after the create"

      - name: occ_evaluation_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[evaluation-create-stale-patient]"]
        distinguishing_aspect: "After one evaluation create advances Patient.version to 2, a second create still carrying expected_patient_version 1 (the stale value) is rejected with 412 ERR_STALE_PATIENT_VERSION."
        test_recipe:
          setup: ["A patient; one evaluation already created (Patient.version now 2), client still holds version 1."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval1_id: $.data.id }
          trigger:
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "RIGHT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Response 412 with data.error_id == ERR_STALE_PATIENT_VERSION (expected_patient_version 1 != current 2)"

      - name: occ_garment_order_stale_version_covered
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[garment-order-create-stale-patient]"]
        distinguishing_aspect: "The garment-order OCC guard mirrors the evaluation one on Patient.version."
        test_recipe:
          setup: ["A patient with a FINALIZED eval; Patient.version has advanced, client holds a stale version."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
          trigger:
            - call: "POST /garment-orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", quantity: 1, expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Response 412 with data.error_id == ERR_STALE_PATIENT_VERSION (client's expected_patient_version 1 != current 2 after the eval create)"

      - name: cascade_visit_ledger_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Authorization.APPROVED_to_EXHAUSTED]
        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_session_complete_exhaust_hold"
          rationale: "The depth-3 session->auth->plan cascade is asserted by the named §1.8 instance."

