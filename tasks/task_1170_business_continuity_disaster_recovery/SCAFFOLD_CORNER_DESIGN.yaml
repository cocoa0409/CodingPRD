              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/submit"
              payload: {}
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/approve"
              payload: {}
              as: PlanApprover
              as_user_id: "${c1_id}"
            - call: "POST /resilience/exercises"
              payload: { process_id: "${p_id}", plan_id: "${plan_id}", exercise_type: "TABLETOP", scheduled_start: "2026-05-01T09:00:00Z", scheduled_end: "2026-05-01T11:00:00Z" }
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
              captures: { ex_id: $.data.id }
            - call: "POST /resilience/exercises/${ex_id}/start"
              payload: {}
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
            - call: "POST /resilience/exercises/${ex_id}/complete"
              payload: { completion_outcome: "MET", achieved_rto_hours: 8, achieved_rpo_hours: 2 }
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
              captures: { ex_status: $.data.status, ex_result: $.data.result }
          trigger:
            - call: "POST /resilience/exercises/${ex_id}/cancel"
              payload: {}
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "setup capture ex_status == COMPLETED and ex_result == MET"
            - "trigger capture err == ERR_INVALID_STATE"
            - "GET /resilience/exercises/${ex_id} still COMPLETED with result MET"
      - name: finding_verify_closes_remediation_gap_stub
        claim_type: side_effect_execution
        grounds: [state_machines.Finding.REMEDIATING_to_VERIFIED]
        excluded_because:
          difficulty_instance: finding_verify_closes_gap_backlog_invariant
          rationale: "The verify -> gap-close side effect is asserted end-to-end in the named §1.8 instance."
      - name: activation_fanout_counts_and_auto_bubble
        grounds: [state_machines.Activation.ACTIVE_to_ALL_NOTIFIED, calculations.activation_ack_coverage]
        distinguishing_aspect: "Fan-out creates exactly one Notification per active node of TREE_<process.name> (inactive nodes excluded), notified_count == expected_notifications, and the activation auto-moves ACTIVE -> ALL_NOTIFIED."
        test_recipe:
          setup:
            - "Clock 2026-06-01; contacts C1, C2; process named FanoutProc ACTIVE with APPROVED BIA rto 8/rpo 2 and APPROVED plan"
