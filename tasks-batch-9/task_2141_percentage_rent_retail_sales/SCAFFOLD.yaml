scenario: |
  desgin task harder than expert level.!!!!2141. Percentage Rent & Retail Sales Reporting (shopping center owner): sales reporting requirement & submission deadline by tenant, breakpoint (natural/artificial) calculation & percentage rent billing, exclusion definitions & audit of reported sales, co-tenancy clause monitoring & rent relief triggers, kick-out clause sales thresholds, delinquent sales report enforcement & estimate billing, year-end reconciliation & true-up, retail sales trend reporting to ownership
domain_name: percentage-rent-retail-sales
api_prefix: "/retail"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: graph
  # ShoppingCenter, Tenant and Lease form a cross-referencing mesh (a Tenant may
  # hold many Leases in the same or different Centers); PercentageRentCharge is
  # self-referential via `supersedes_charge_id`; CoTenancyEvent joins a
  # CoTenancyClause (lease-side) to a Tenant (center-side) that is NOT the
  # clause's own tenant, so co-tenancy propagation crosses aggregate boundaries.
  state_machine_shape: parallel
  # PercentageRentCharge carries two independent axes (billing_status x
  # collection_status); SalesReport is cyclic (audit -> dispute -> amend ->
  # resubmit -> audit); CoTenancyEvent and KickOutClause are branching;
  # LeaseYear is cyclic (RECONCILED -> RECONCILING reopen).
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ShoppingCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the shopping center.
      - name: code
        type: string
        source: input
        description: Short center code, unique across all ShoppingCenter rows.
        constraints: "1-16 chars; unique"
      - name: total_gla_sqft
        type: integer
        source: input
        description: Total gross leasable area of the center in square feet.
        constraints: "> 0"
      - name: anchor_gla_sqft
        type: integer
        source: input
        description: Portion of total_gla_sqft attributed to anchor boxes.
        constraints: ">= 0 and <= total_gla_sqft"
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: Calendar month (1-12) on which the center's reporting year opens.
        default: 1
        constraints: "1..12"
      - name: occupied_gla_sqft
        type: integer
        source: computed
        description: "Sum of Lease.leased_sqft over leases of this center whose status IN {ACTIVE, RELIEF_ACTIVE, TERMINATION_PENDING}. Recomputed by calculations.occupancy_and_co_tenancy_monitor."
      - name: occupancy_bps
        type: integer
        source: computed
        description: "floor(occupied_gla_sqft * 10000 / total_gla_sqft); 0 when total_gla_sqft == 0."
      - name: open_anchor_count
        type: integer
        source: computed
        description: "Count of Tenant rows of this center with is_anchor == true AND status == OPERATING."

  - name: Tenant
    parent: ShoppingCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> ShoppingCenter.id; the center this tenant occupies space in."
      - name: legal_name
        type: string
        source: input
        description: Legal entity name on the lease.
      - name: trade_name
        type: string
        source: input
        description: Banner / dba name used in trend reporting.
      - name: category
        type: enum
        source: input
        description: Merchandising category driving anchor classification.
        constraints: "ANCHOR | JUNIOR_ANCHOR | INLINE | FOOD | KIOSK"
      - name: gla_sqft
        type: integer
        source: input
        description: Square footage occupied by this tenant across the center.
        constraints: "> 0"
      - name: is_anchor
        type: boolean
        source: computed
        description: "true iff category IN {ANCHOR, JUNIOR_ANCHOR}."
      - name: status
        type: enum
        source: system
        description: Operating status driving co-tenancy monitoring.
        default: PROSPECT
        constraints: "PROSPECT | OPERATING | DARK | VACATED"

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> ShoppingCenter.id; center the demised premises sit in."
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; tenant of record. Must belong to the same center_id."
      - name: suite_code
        type: string
        source: input
        description: Suite / unit identifier within the center.
      - name: leased_sqft
        type: integer
        source: input
        description: Demised square footage counted toward center occupancy.
        constraints: "> 0"
      - name: annual_base_rent_cents
        type: integer
        source: input
        description: Contract annual minimum rent in whole cents.
        constraints: "> 0"
      - name: percentage_rate_bps
        type: integer
        source: input
        description: Percentage-rent rate in basis points (600 = 6.00%).
        constraints: "1..10000"
      - name: breakpoint_type
        type: enum
        source: input
        description: Whether the breakpoint is derived from base rent or contractually stated.
        constraints: "NATURAL | ARTIFICIAL"
      - name: artificial_breakpoint_cents
        type: integer
        source: input
        description: Stated annual breakpoint in cents; required when breakpoint_type == ARTIFICIAL, must be null otherwise.
        default: null
        constraints: "> 0 when present"
      - name: natural_breakpoint_cents
        type: integer
        source: computed
        description: "round_half_up(annual_base_rent_cents * 10000 / percentage_rate_bps)."
      - name: effective_breakpoint_cents
        type: integer
        source: computed
        description: "artificial_breakpoint_cents when breakpoint_type == ARTIFICIAL, else natural_breakpoint_cents."
      - name: billing_mode
        type: enum
        source: input
        description: Selects the percentage_rent_charge variant used at report acceptance.
        constraints: "CUMULATIVE_YTD | PERIOD_STANDALONE"
      - name: reporting_frequency
        type: enum
        source: input
        description: Cadence at which sales reports are required.
        constraints: "MONTHLY | QUARTERLY"
      - name: reporting_deadline_days
        type: integer
        source: input
        description: Whole days after a reporting period ends by which the tenant must submit.
        constraints: "0..60"
      - name: exclusion_profile
        type: enum
        source: input
        description: Selects the per-code exclusion cap table applied by calculations.net_reported_sales.
        constraints: "STANDARD | RESTRICTIVE"
      - name: status
        type: enum
        source: system
        description: Lease lifecycle state.
        default: DRAFT
        constraints: "DRAFT | ACTIVE | RELIEF_ACTIVE | TERMINATION_PENDING | TERMINATED"
      - name: co_tenancy_status
        type: enum
        source: computed
        description: Derived co-tenancy posture maintained by the CoTenancyEvent cascade.
        default: COMPLIANT
        constraints: "COMPLIANT | VIOLATION_OPEN | RELIEF_ACTIVE"
      - name: effective_monthly_rent_cents
        type: integer
        source: computed
        description: "round_half_up(annual_base_rent_cents / 12) while co_tenancy_status != RELIEF_ACTIVE; otherwise the output of calculations.co_tenancy_relief."
      - name: relief_monthly_credit_cents
        type: integer
        source: computed
        description: "round_half_up(annual_base_rent_cents / 12) - effective_monthly_rent_cents; 0 when no relief is active."
        default: 0
      - name: relief_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CenterAdmin who activated the most recent co-tenancy relief on this lease; null until relief is activated.
        default: null
      - name: waiver_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CenterAdmin who waived a kick-out right on this lease; null until a waiver is recorded.
        default: null
      - name: delinquency_strikes
        type: integer
        source: system
        description: Count of estimate billings issued against this lease's reports.
        default: 0
      - name: ytd_occupancy_cost_cents
        type: integer
        source: computed
        description: Output of calculations.occupancy_cost_ratio for the lease's highest-year_index LeaseYear.
        default: 0
      - name: occupancy_cost_ratio_bps
        type: integer
        source: computed
        description: Output of calculations.occupancy_cost_ratio in basis points of cumulative net sales.
        default: 0
      - name: watchlist_status
        type: enum
        source: computed
        description: "WATCHLIST when occupancy_cost_ratio_bps >= OCR_WATCHLIST_BPS or delinquency_strikes >= DELINQUENCY_STRIKE_LIMIT, else NORMAL."
        default: NORMAL
        constraints: "NORMAL | WATCHLIST"

  - name: LeaseYear
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; lease this reporting year belongs to."
      - name: year_index
        type: integer
        source: input
        description: 1-based ordinal of the reporting year within the lease term; unique per lease_id.
        constraints: ">= 1"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive UTC start of the reporting year (half-open interval start).
      - name: period_end
        type: datetime
        source: input
        description: Exclusive UTC end of the reporting year (half-open interval end); must be > period_start.
      - name: breakpoint_cents
        type: integer
        source: computed
        description: Snapshot of Lease.effective_breakpoint_cents taken at LeaseYear creation; later lease amendments do NOT change it.
      - name: percentage_rate_bps_snapshot
        type: integer
        source: computed
        description: Snapshot of Lease.percentage_rate_bps taken at LeaseYear creation.
      - name: billing_mode_snapshot
        type: enum
        source: computed
        description: Snapshot of Lease.billing_mode taken at LeaseYear creation.
        constraints: "CUMULATIVE_YTD | PERIOD_STANDALONE"
      - name: cumulative_net_sales_cents
        type: integer
        source: computed
        description: "Sum of SalesReport.net_sales_cents over reports of this lease year whose status IN COUNTED_REPORT_STATUSES."
        default: 0
      - name: cumulative_billed_cents
        type: integer
        source: computed
        description: "Sum of PercentageRentCharge.amount_cents over charges of this lease year whose billing_status == ISSUED."
        default: 0
      - name: true_up_delta_cents
        type: integer
        source: computed
        description: Output of calculations.annual_true_up, written at RECONCILING -> RECONCILED; null before reconciliation.
        default: null
      - name: open_audit_count
        type: integer
        source: computed
        description: "Count of SalesAudit rows targeting reports of this lease year whose status IN {OPEN, FINDINGS_ISSUED}."
        default: 0
      - name: status
        type: enum
        source: system
        description: Reconciliation lifecycle state of the reporting year.
        default: OPEN
        constraints: "OPEN | RECONCILING | RECONCILED | CLOSED"

  - name: SalesReport
    parent: LeaseYear
    common_fields: true
    fields:
      - name: lease_year_id
        type: string
        source: input
        description: "FK -> LeaseYear.id; reporting year this period belongs to."
      - name: period_start
        type: datetime
        source: input
        description: Inclusive UTC start of the reporting period (half-open interval start).
      - name: period_end
        type: datetime
        source: input
        description: Exclusive UTC end of the reporting period (half-open interval end); must be > period_start.
      - name: due_at
        type: datetime
        source: computed
        description: "period_end + Lease.reporting_deadline_days whole days, in UTC."
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent successful submit; null while PENDING.
        default: null
      - name: gross_sales_cents
        type: integer
        source: input
        description: Gross retail sales for the period in cents, as most recently submitted, estimated, or audit-adjusted.
        default: null
        constraints: ">= 0"
      - name: allowed_exclusions_cents
        type: integer
        source: computed
        description: Output of calculations.net_reported_sales after per-code and aggregate capping.
        default: 0
      - name: net_sales_cents
        type: integer
        source: computed
        description: "gross_sales_cents - allowed_exclusions_cents."
        default: 0
      - name: source
        type: enum
        source: system
        description: Provenance of the current gross_sales_cents value.
        default: TENANT_REPORTED
        constraints: "TENANT_REPORTED | LANDLORD_ESTIMATE | AUDIT_ADJUSTED"
      - name: amendment_round
        type: integer
        source: system
        description: Number of completed dispute-amend cycles on this report.
        default: 0
        constraints: "0..MAX_AMENDMENT_ROUNDS"
      - name: is_delinquent
        type: boolean
        source: computed
        description: "true iff (status == PENDING AND logical clock now > due_at) OR source == LANDLORD_ESTIMATE."
        default: false
      - name: status
        type: enum
        source: system
        description: Reporting lifecycle state.
        default: PENDING
        constraints: "PENDING | SUBMITTED | ACCEPTED | UNDER_AUDIT | DISPUTED | AMENDED | ADJUSTED | ESTIMATED | VOID"

  - name: SalesExclusion
    parent: SalesReport
    common_fields: true
    fields:
      - name: sales_report_id
        type: string
        source: input
        description: "FK -> SalesReport.id; report this exclusion line belongs to."
      - name: code
        type: enum
        source: input
        description: Exclusion category claimed by the tenant.
        constraints: "RETURNS_AND_ALLOWANCES | SALES_TAX | GIFT_CARD_ISSUANCE | INTERCOMPANY_TRANSFER | EMPLOYEE_DISCOUNT | ONLINE_SHIP_FROM_STORE | VENDING_AND_SERVICE"
      - name: claimed_cents
        type: integer
        source: input
        description: Amount the tenant claims to exclude from gross sales.
        constraints: ">= 0"
      - name: allowed_cents
        type: integer
        source: computed
        description: Amount actually excluded after per-code capping and aggregate waterfall trimming.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Outcome of capping for this line.
        default: CLAIMED
        constraints: "CLAIMED | ALLOWED | PARTIALLY_ALLOWED | DISALLOWED"

  - name: PercentageRentCharge
    parent: LeaseYear
    common_fields: true
    fields:
      - name: lease_year_id
        type: string
        source: system
        description: "FK -> LeaseYear.id; reporting year this charge belongs to."
      - name: sales_report_id
        type: string
        source: system
        description: "FK -> SalesReport.id; report that produced this charge; null for TRUE_UP and CREDIT charges emitted by reconciliation."
        default: null
      - name: supersedes_charge_id
        type: string
        source: system
        description: "FK -> PercentageRentCharge.id; the earlier charge this one replaces (set when a late actual replaces an estimate); null otherwise."
        default: null
      - name: charge_type
        type: enum
        source: system
        description: Origin of the charge.
        constraints: "PERIODIC | ESTIMATE | TRUE_UP | CREDIT"
      - name: amount_cents
        type: integer
        source: computed
        description: Output of calculations.percentage_rent_charge or calculations.annual_true_up; negative for CREDIT.
      - name: billing_status
        type: enum
        source: system
        description: Billing dimension of the parallel state machine.
        default: DRAFT
        constraints: "DRAFT | ISSUED | VOID"
      - name: collection_status
        type: enum
        source: system
        description: Collection dimension of the parallel state machine; evolves independently of billing_status.
        default: UNPAID
        constraints: "UNPAID | PARTIAL | PAID | WRITTEN_OFF"
      - name: paid_cents
        type: integer
        source: system
        description: Cumulative payments applied to this charge.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant at which billing_status became ISSUED; null while DRAFT.
        default: null

  - name: CoTenancyClause
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; lease whose rent this clause protects."
      - name: required_open_anchor_count
        type: integer
        source: input
        description: Minimum number of OPERATING anchor tenants required in the center.
        constraints: ">= 0"
      - name: required_occupancy_bps
        type: integer
        source: input
        description: Minimum center occupancy in basis points required by the clause.
        constraints: "0..10000"
      - name: cure_period_days
        type: integer
        source: input
        description: Whole days the landlord has to cure a violation before relief may be activated.
        constraints: ">= 0"
      - name: relief_type
        type: enum
        source: input
        description: Selects the calculations.co_tenancy_relief variant.
        constraints: "RENT_REDUCTION | ALTERNATIVE_SALES_RENT"
      - name: relief_pct_bps
        type: integer
        source: input
        description: Basis points used by both relief variants (reduction share of base rent, or share of trailing sales).
        constraints: "1..10000"
      - name: termination_right_after_days
        type: integer
        source: input
        description: Whole days of continuous active relief after which the tenant may elect termination.
        constraints: ">= 0"
      - name: monitoring_status
        type: enum
        source: computed
        description: Output of calculations.occupancy_and_co_tenancy_monitor for this clause.
        default: SATISFIED
        constraints: "SATISFIED | VIOLATED"

  - name: CoTenancyEvent
    parent: CoTenancyClause
    common_fields: true
    fields:
      - name: clause_id
        type: string
        source: system
        description: "FK -> CoTenancyClause.id; clause whose test failed."
      - name: trigger_tenant_id
        type: string
        source: system
        description: "FK -> Tenant.id; anchor tenant whose departure opened this event; null for OCCUPANCY_BELOW_FLOOR events."
        default: null
      - name: event_type
        type: enum
        source: system
        description: Which leg of the co-tenancy test failed.
        constraints: "ANCHOR_WENT_DARK | OCCUPANCY_BELOW_FLOOR"
      - name: observed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the violation was detected.
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "observed_at + CoTenancyClause.cure_period_days whole days."
      - name: relief_started_at
        type: datetime
        source: system
        description: Logical-clock instant at which status became RELIEF_ACTIVE; null before that.
        default: null
      - name: relief_ended_at
        type: datetime
        source: system
        description: Logical-clock instant at which status left RELIEF_ACTIVE; null before that.
        default: null
      - name: status
        type: enum
        source: system
        description: Branching lifecycle of the co-tenancy violation.
        default: OPEN
        constraints: "OPEN | CURE_PENDING | RELIEF_ACTIVE | CURED | TERMINATION_ELECTED"

  - name: KickOutClause
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; lease carrying the kick-out right."
      - name: measurement_year_index
        type: integer
        source: input
        description: LeaseYear.year_index whose reconciled cumulative net sales are tested against the threshold.
        constraints: ">= 1"
      - name: threshold_sales_cents
        type: integer
        source: input
        description: Annual net sales floor; falling strictly below it arms the tenant's termination election.
        constraints: "> 0"
      - name: election_window_days
        type: integer
        source: input
        description: Whole days after trigger during which the tenant may exercise.
        constraints: "> 0"
      - name: triggered_at
        type: datetime
        source: system
        description: Logical-clock instant at which the clause became TRIGGERED; null while ARMED.
        default: null
      - name: election_deadline_at
        type: datetime
        source: computed
        description: "triggered_at + election_window_days whole days; null while ARMED."
        default: null
      - name: waiver_consideration_cents
        type: integer
        source: input
        description: Cash consideration recorded when the landlord waives the kick-out right.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Branching lifecycle of the kick-out right.
        default: ARMED
        constraints: "ARMED | TRIGGERED | WAIVED | EXERCISED | EXPIRED"

  - name: SalesAudit
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: system
        description: "FK -> Lease.id; lease under audit, resolved from the target report's lease year."
      - name: sales_report_id
        type: string
        source: input
        description: "FK -> SalesReport.id; the single report under examination."
      - name: audit_window_start
        type: datetime
        source: input
        description: Inclusive UTC start of the on-site audit window (closed interval start).
      - name: audit_window_end
        type: datetime
        source: input
        description: Inclusive UTC end of the on-site audit window (closed interval end); must be >= audit_window_start.
      - name: proposed_adjustment_cents
        type: integer
        source: input
        description: Gross-sales adjustment proposed at findings; may be negative.
        default: null
      - name: settled_adjustment_cents
        type: integer
        source: input
        description: Gross-sales adjustment actually applied at settlement; may be negative.
        default: null
      - name: auditor_user_id
        type: string
        source: system
        description: X-User-ID of the Auditor who opened the audit.
      - name: status
        type: enum
        source: system
        description: Audit lifecycle state.
        default: OPEN
        constraints: "OPEN | FINDINGS_ISSUED | SETTLED | RESCINDED"

  - name: ReportingLedgerEntry
    parent: LeaseYear
    common_fields: false
    fields:
      - name: lease_year_id
        type: string
        source: system
        description: "FK -> LeaseYear.id; reporting year whose running totals this entry moves."
      - name: entry_type
        type: enum
        source: system
        description: Which cascade appended this entry.
        constraints: "REPORT_ACCEPTED | REPORT_WITHDRAWN | ESTIMATE_ISSUED | ESTIMATE_VOIDED | PERIODIC_CHARGE_ISSUED | TRUE_UP_ISSUED | CREDIT_ISSUED | AUDIT_ADJUSTMENT | AUDIT_RESCINDED"
      - name: delta_net_sales_cents
        type: integer
        source: system
        description: Signed change applied to LeaseYear.cumulative_net_sales_cents by this event.
        default: 0
      - name: delta_billed_cents
        type: integer
        source: system
        description: Signed change applied to LeaseYear.cumulative_billed_cents by this event.
        default: 0
      - name: note
        type: string
        source: system
        description: Free-text provenance note (entity name and action that produced the entry).

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tenant
    initial_state: PROSPECT
    terminal_states: [VACATED]
    transitions:
      - from: PROSPECT
        to: OPERATING
        trigger: "POST /retail/tenants/{id}/status with to_status=OPERATING"
        actor: CenterAdmin
        preconditions: ["Tenant.status == PROSPECT"]
        side_effects:
          - "Run calculations.occupancy_and_co_tenancy_monitor for Tenant.center_id (may raise ShoppingCenter.open_anchor_count and ShoppingCenter.occupancy_bps)."
      - from: OPERATING
        to: DARK
        trigger: "POST /retail/tenants/{id}/status with to_status=DARK"
        actor: CenterAdmin
        preconditions: ["Tenant.status == OPERATING"]
        side_effects:
          - "Cascade L2: ShoppingCenter.open_anchor_count is recomputed by calculations.occupancy_and_co_tenancy_monitor and drops by 1 when Tenant.is_anchor == true."
          - "Cascade L3 (caused by L2): every CoTenancyClause on a Lease of this center whose lease.status IN {ACTIVE, RELIEF_ACTIVE} re-evaluates; a clause whose required_open_anchor_count now exceeds ShoppingCenter.open_anchor_count flips monitoring_status SATISFIED -> VIOLATED and, when it has no CoTenancyEvent in {OPEN, CURE_PENDING, RELIEF_ACTIVE}, a CoTenancyEvent is created with status=OPEN, event_type=ANCHOR_WENT_DARK, trigger_tenant_id = this tenant, observed_at = logical clock now, cure_deadline_at = observed_at + clause.cure_period_days days."
          - "Cascade L4 (caused by L3): each Lease that just received a new CoTenancyEvent sets co_tenancy_status COMPLIANT -> VIOLATION_OPEN."
      - from: DARK
        to: OPERATING
        trigger: "POST /retail/tenants/{id}/status with to_status=OPERATING"
        actor: CenterAdmin
        preconditions: ["Tenant.status == DARK"]
        side_effects:
          - "Run calculations.occupancy_and_co_tenancy_monitor; clauses whose tests now pass flip monitoring_status VIOLATED -> SATISFIED (their open CoTenancyEvent rows are NOT auto-cured; a LeaseAdministrator must call the cure endpoint)."
        note: "Reopening a dark anchor is the revert leg that makes the Tenant machine non-linear."
      - from: OPERATING
        to: VACATED
        trigger: "POST /retail/tenants/{id}/status with to_status=VACATED"
        actor: CenterAdmin
        preconditions: ["Tenant.status == OPERATING"]
        side_effects:
          - "Same L2/L3/L4 cascade as OPERATING -> DARK."
      - from: DARK
        to: VACATED
        trigger: "POST /retail/tenants/{id}/status with to_status=VACATED"
        actor: CenterAdmin
        preconditions: ["Tenant.status == DARK"]
        side_effects:
          - "Run calculations.occupancy_and_co_tenancy_monitor (open_anchor_count already excludes DARK tenants, so no further co-tenancy event is created)."

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /retail/leases/{id}/activate"
        actor: LeaseAdministrator
        preconditions:
          - "Lease.status == DRAFT"
          - "Tenant.status IN {PROSPECT, OPERATING} for Lease.tenant_id"
        side_effects:
          - "Set Lease.effective_monthly_rent_cents = round_half_up(annual_base_rent_cents / 12) and relief_monthly_credit_cents = 0."
          - "Run calculations.occupancy_and_co_tenancy_monitor for Lease.center_id (ShoppingCenter.occupied_gla_sqft and occupancy_bps increase)."
      - from: ACTIVE
        to: RELIEF_ACTIVE
        trigger: "system: CoTenancyEvent CURE_PENDING -> RELIEF_ACTIVE"
        actor: system
        preconditions: ["Lease.status == ACTIVE"]
        side_effects:
          - "Set Lease.co_tenancy_status = RELIEF_ACTIVE."
          - "Write calculations.co_tenancy_relief output into Lease.effective_monthly_rent_cents and Lease.relief_monthly_credit_cents."
          - "Record Lease.relief_approved_by_user_id = X-User-ID of the acting CenterAdmin."
      - from: RELIEF_ACTIVE
        to: ACTIVE
        trigger: "system: CoTenancyEvent RELIEF_ACTIVE -> CURED"
        actor: system
        preconditions: ["Lease.status == RELIEF_ACTIVE"]
        side_effects:
          - "Set Lease.co_tenancy_status = COMPLIANT."
          - "Restore Lease.effective_monthly_rent_cents = round_half_up(annual_base_rent_cents / 12) and Lease.relief_monthly_credit_cents = 0."
        note: "ACTIVE <-> RELIEF_ACTIVE is a genuine cycle on the Lease machine."
      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "system: KickOutClause TRIGGERED -> EXERCISED, or CoTenancyEvent RELIEF_ACTIVE -> TERMINATION_ELECTED"
        actor: system
        preconditions: ["Lease.status == ACTIVE"]
        side_effects:
          - "Lease stops counting toward ShoppingCenter.open_anchor_count changes but still counts in occupied_gla_sqft until TERMINATED."
      - from: RELIEF_ACTIVE
        to: TERMINATION_PENDING
        trigger: "system: CoTenancyEvent RELIEF_ACTIVE -> TERMINATION_ELECTED"
        actor: system
        preconditions: ["Lease.status == RELIEF_ACTIVE"]
        side_effects:
          - "Set Lease.co_tenancy_status = VIOLATION_OPEN."
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "POST /retail/leases/{id}/terminate"
        actor: CenterAdmin
        preconditions:
          - "Lease.status == TERMINATION_PENDING"
          - "No LeaseYear of this lease has status IN {OPEN, RECONCILING}"
        side_effects:
          - "Run calculations.occupancy_and_co_tenancy_monitor for Lease.center_id (occupied_gla_sqft drops by Lease.leased_sqft)."

  - entity: LeaseYear
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RECONCILING
        trigger: "POST /retail/lease-years/{id}/close-period"
        actor: LeaseAdministrator
        preconditions: ["LeaseYear.status == OPEN"]
        side_effects:
          - "Freeze new SalesReport creation and tenant submission for this lease year (see validations priority 5)."
      - from: RECONCILING
        to: OPEN
        trigger: "POST /retail/lease-years/{id}/reopen"
        actor: LeaseAdministrator
        preconditions: ["LeaseYear.status == RECONCILING"]
        side_effects:
          - "Sales report creation and submission become available again."
      - from: RECONCILING
        to: RECONCILED
        trigger: "POST /retail/lease-years/{id}/reconcile"
        actor: LeaseAdministrator
        preconditions:
          - "LeaseYear.status == RECONCILING"
          - "LeaseYear.open_audit_count == 0"
          - "No SalesReport of this lease year has status IN {PENDING, SUBMITTED, UNDER_AUDIT, DISPUTED, AMENDED}"
        side_effects:
          - "Run calculations.annual_true_up and write LeaseYear.true_up_delta_cents."
          - "When true_up_delta_cents > 0, create PercentageRentCharge(charge_type=TRUE_UP, billing_status=DRAFT, collection_status=UNPAID, amount_cents=true_up_delta_cents, sales_report_id=null)."
          - "When true_up_delta_cents < 0, create PercentageRentCharge(charge_type=CREDIT, billing_status=DRAFT, collection_status=UNPAID, amount_cents=true_up_delta_cents, sales_report_id=null)."
          - "When true_up_delta_cents == 0, create no charge."
          - "Run calculations.kick_out_evaluation for every KickOutClause of this lease whose measurement_year_index == LeaseYear.year_index and whose status == ARMED."
      - from: RECONCILED
        to: RECONCILING
        trigger: "POST /retail/lease-years/{id}/reopen"
        actor: LeaseAdministrator
        preconditions: ["LeaseYear.status == RECONCILED"]
        side_effects:
          - "Set LeaseYear.true_up_delta_cents = null."
          - "KickOutClause rows already TRIGGERED keep their status, triggered_at and election_deadline_at (reopening never re-arms a triggered right)."
        note: "RECONCILED -> RECONCILING is the reopen cycle used when a late audit lands after year end."
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /retail/lease-years/{id}/close"
        actor: CenterAdmin
        preconditions:
          - "LeaseYear.status == RECONCILED"
          - "Every PercentageRentCharge of this lease year has billing_status IN {ISSUED, VOID}"
        side_effects:
          - "Lease year becomes immutable; every mutating endpoint scoped to it rejects with ERR_LEASE_YEAR_STATE_INVALID."

  - entity: SalesReport
    initial_state: PENDING
    terminal_states: [VOID]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /retail/sales-reports/{id}/submit"
        actor: TenantUser
        preconditions:
          - "SalesReport.status == PENDING"
          - "LeaseYear.status == OPEN"
          - "X-User-ID == Lease.tenant_id of the report's lease"
        side_effects:
          - "Set gross_sales_cents from the payload, source = TENANT_REPORTED, submitted_at = logical clock now."
          - "Replace all SalesExclusion rows of this report with the payload's exclusions (status CLAIMED)."
          - "Run calculations.net_reported_sales and write SalesReport.allowed_exclusions_cents, SalesReport.net_sales_cents and each SalesExclusion.allowed_cents / status."
      - from: ESTIMATED
        to: SUBMITTED
        trigger: "POST /retail/sales-reports/{id}/submit (late actual replaces the landlord estimate)"
        actor: TenantUser
        preconditions:
          - "SalesReport.status == ESTIMATED"
          - "LeaseYear.status == OPEN"
          - "X-User-ID == Lease.tenant_id of the report's lease"
        side_effects:
          - "Cascade L1: report leaves COUNTED_REPORT_STATUSES; set gross_sales_cents from payload, source = TENANT_REPORTED, submitted_at = logical clock now, and rebuild SalesExclusion rows, then run calculations.net_reported_sales."
          - "Cascade L2 (caused by L1): LeaseYear.cumulative_net_sales_cents decreases by the estimate's former net_sales_cents and a ReportingLedgerEntry(entry_type=REPORT_WITHDRAWN, delta_net_sales_cents = -former_net_sales_cents, delta_billed_cents = 0) is appended."
          - "Cascade L3 (caused by L2): every PercentageRentCharge with sales_report_id == this report, charge_type == ESTIMATE and billing_status == ISSUED flips to VOID; LeaseYear.cumulative_billed_cents decreases by that charge's amount_cents and a ReportingLedgerEntry(entry_type=ESTIMATE_VOIDED, delta_billed_cents = -amount_cents, delta_net_sales_cents = 0) is appended."
      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /retail/sales-reports/{id}/submit (resubmission after amendment)"
        actor: TenantUser
        preconditions:
          - "SalesReport.status == AMENDED"
          - "LeaseYear.status IN {OPEN, RECONCILING}"
          - "X-User-ID == Lease.tenant_id of the report's lease"
        side_effects:
          - "Set gross_sales_cents from payload, source = TENANT_REPORTED, submitted_at = logical clock now, rebuild SalesExclusion rows and run calculations.net_reported_sales."
        note: "This edge closes the SalesReport cycle ACCEPTED -> UNDER_AUDIT -> DISPUTED -> AMENDED -> SUBMITTED -> ACCEPTED."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /retail/sales-reports/{id}/accept"
        actor: LeaseAdministrator
        preconditions:
          - "SalesReport.status == SUBMITTED"
          - "LeaseYear.status IN {OPEN, RECONCILING}"
        side_effects:
          - "Cascade L1: report enters COUNTED_REPORT_STATUSES."
          - "Cascade L2 (caused by L1): LeaseYear.cumulative_net_sales_cents increases by SalesReport.net_sales_cents and a ReportingLedgerEntry(entry_type=REPORT_ACCEPTED, delta_net_sales_cents = +net_sales_cents, delta_billed_cents = 0) is appended."
          - "Cascade L3 (caused by L2): calculations.percentage_rent_charge runs against the new cumulative; when its amount != 0 a PercentageRentCharge(charge_type=PERIODIC, billing_status=ISSUED, issued_at = logical clock now, collection_status=UNPAID, sales_report_id = this report) is created, LeaseYear.cumulative_billed_cents moves by amount_cents and a ReportingLedgerEntry(entry_type=PERIODIC_CHARGE_ISSUED when amount > 0 else CREDIT_ISSUED, delta_billed_cents = amount_cents) is appended. When amount == 0 no charge and no billing ledger entry are created."
          - "Cascade L4 (caused by L3): calculations.occupancy_cost_ratio re-runs and rewrites Lease.ytd_occupancy_cost_cents and Lease.occupancy_cost_ratio_bps."
          - "Cascade L5 (caused by L4): Lease.watchlist_status flips NORMAL -> WATCHLIST when the recomputed occupancy_cost_ratio_bps >= OCR_WATCHLIST_BPS."
      - from: PENDING
        to: ESTIMATED
        trigger: "POST /retail/sales-reports/{id}/estimate-bill"
        actor: LeaseAdministrator
        preconditions:
          - "SalesReport.status == PENDING"
          - "LeaseYear.status IN {OPEN, RECONCILING}"
          - "logical clock now > SalesReport.due_at (strictly greater)"
          - "payload.expected_lease_year_version == LeaseYear.version"
        side_effects:
          - "Run calculations.delinquency_estimate; write gross_sales_cents, allowed_exclusions_cents = 0, net_sales_cents, source = LANDLORD_ESTIMATE."
          - "LeaseYear.cumulative_net_sales_cents increases by net_sales_cents; append ReportingLedgerEntry(entry_type=ESTIMATE_ISSUED, delta_net_sales_cents = +net_sales_cents)."
          - "Run calculations.percentage_rent_charge; when amount != 0 create PercentageRentCharge(charge_type=ESTIMATE, billing_status=ISSUED, issued_at = logical clock now, sales_report_id = this report), move LeaseYear.cumulative_billed_cents and append ReportingLedgerEntry(entry_type=ESTIMATE_ISSUED, delta_billed_cents = amount_cents)."
          - "Increment Lease.delinquency_strikes by 1 and re-run calculations.occupancy_cost_ratio (delinquency_strikes >= DELINQUENCY_STRIKE_LIMIT forces Lease.watchlist_status = WATCHLIST)."
          - "Increment LeaseYear.version by 1."
      - from: ACCEPTED
        to: UNDER_AUDIT
        trigger: "POST /retail/audits"
        actor: Auditor
        preconditions:
          - "SalesReport.status == ACCEPTED"
          - "No SalesAudit on the same Lease whose [audit_window_start, audit_window_end] closed interval, expanded by AUDIT_COOLDOWN_DAYS on both sides, contains the requested window"
        side_effects:
          - "Create SalesAudit(status=OPEN, auditor_user_id = X-User-ID, lease_id resolved from the report's lease year)."
          - "Increment LeaseYear.open_audit_count by 1. UNDER_AUDIT is in COUNTED_REPORT_STATUSES, so LeaseYear.cumulative_net_sales_cents is unchanged."
      - from: UNDER_AUDIT
        to: DISPUTED
        trigger: "POST /retail/sales-reports/{id}/dispute"
        actor: TenantUser
        preconditions:
          - "SalesReport.status == UNDER_AUDIT"
          - "The report's SalesAudit has status == FINDINGS_ISSUED"
          - "SalesReport.amendment_round < MAX_AMENDMENT_ROUNDS"
          - "X-User-ID == Lease.tenant_id of the report's lease"
        side_effects:
          - "No change to LeaseYear.cumulative_net_sales_cents (DISPUTED is in COUNTED_REPORT_STATUSES)."
      - from: DISPUTED
        to: AMENDED
        trigger: "POST /retail/sales-reports/{id}/amend"
        actor: TenantUser
        preconditions:
          - "SalesReport.status == DISPUTED"
          - "SalesReport.amendment_round < MAX_AMENDMENT_ROUNDS"
          - "X-User-ID == Lease.tenant_id of the report's lease"
        side_effects:
          - "Increment SalesReport.amendment_round by 1."
          - "Report leaves COUNTED_REPORT_STATUSES: LeaseYear.cumulative_net_sales_cents decreases by net_sales_cents and a ReportingLedgerEntry(entry_type=REPORT_WITHDRAWN, delta_net_sales_cents = -net_sales_cents) is appended."
          - "Reset every SalesExclusion of the report to status CLAIMED with allowed_cents = 0."
          - "The report's SalesAudit flips FINDINGS_ISSUED -> RESCINDED and LeaseYear.open_audit_count decreases by 1."
      - from: UNDER_AUDIT
        to: ADJUSTED
        trigger: "POST /retail/audits/{id}/settle"
        actor: Auditor
        preconditions:
          - "SalesReport.status == UNDER_AUDIT"
          - "SalesAudit.status == FINDINGS_ISSUED"
        side_effects:
          - "Cascade L1: SalesAudit FINDINGS_ISSUED -> SETTLED with settled_adjustment_cents from the payload; LeaseYear.open_audit_count decreases by 1."
          - "Cascade L2 (caused by L1): SalesReport.gross_sales_cents increases by settled_adjustment_cents, source = AUDIT_ADJUSTED, calculations.net_reported_sales re-runs over the existing SalesExclusion rows and rewrites allowed_exclusions_cents and net_sales_cents."
          - "Cascade L3 (caused by L2): LeaseYear.cumulative_net_sales_cents moves by (new net_sales_cents - old net_sales_cents) and a ReportingLedgerEntry(entry_type=AUDIT_ADJUSTMENT, delta_net_sales_cents = that difference) is appended."
          - "Cascade L4 (caused by L3): calculations.percentage_rent_charge re-runs on the new cumulative; when its amount != 0 a supplemental PercentageRentCharge(charge_type=PERIODIC when amount > 0 else CREDIT, billing_status=ISSUED, sales_report_id = this report) is created and LeaseYear.cumulative_billed_cents moves by amount_cents with a matching ReportingLedgerEntry(entry_type=PERIODIC_CHARGE_ISSUED when amount > 0 else CREDIT_ISSUED, delta_billed_cents = amount_cents)."
      - from: ADJUSTED
        to: ACCEPTED
        trigger: "POST /retail/audits/{id}/rescind"
        actor: Auditor
        preconditions:
          - "SalesReport.status == ADJUSTED"
          - "SalesAudit.status == SETTLED"
        side_effects:
          - "Compensation: SalesReport.gross_sales_cents decreases by SalesAudit.settled_adjustment_cents, source = TENANT_REPORTED, calculations.net_reported_sales re-runs."
          - "LeaseYear.cumulative_net_sales_cents moves by (new net_sales_cents - old net_sales_cents) and a ReportingLedgerEntry(entry_type=AUDIT_RESCINDED) records the reversal."
          - "Every PercentageRentCharge created by the settlement (sales_report_id == this report AND issued_at >= SalesAudit.updated_at at settlement) flips ISSUED -> VOID, LeaseYear.cumulative_billed_cents is reduced by its amount_cents and a matching ReportingLedgerEntry(entry_type=AUDIT_RESCINDED, delta_billed_cents = -amount_cents) is appended."
      - from: UNDER_AUDIT
        to: ACCEPTED
        trigger: "POST /retail/audits/{id}/rescind (audit abandoned before settlement)"
        actor: Auditor
        preconditions:
          - "SalesReport.status == UNDER_AUDIT"
          - "SalesAudit.status IN {OPEN, FINDINGS_ISSUED}"
        side_effects:
          - "SalesAudit -> RESCINDED; LeaseYear.open_audit_count decreases by 1; no sales or billing figures move."
      - from: PENDING
        to: VOID
        trigger: "system: LeaseYear RECONCILED -> CLOSED with a PENDING report still present"
        actor: system
        preconditions: ["SalesReport.status == PENDING"]
        side_effects:
          - "Report is frozen out of every calculation input set."
        note: "Only reachable when the reconcile preconditions were satisfied by voiding, i.e. never in the normal flow; retained so PENDING has a terminal escape."

  - entity: SalesExclusion
    initial_state: CLAIMED
    terminal_states: []
    transitions:
      - from: CLAIMED
        to: ALLOWED
        trigger: "system: calculations.net_reported_sales when allowed_cents == claimed_cents"
        actor: system
        preconditions: ["allowed_cents == claimed_cents"]
        side_effects: ["No further change; line is fully excluded from gross sales."]
      - from: CLAIMED
        to: PARTIALLY_ALLOWED
        trigger: "system: calculations.net_reported_sales when 0 < allowed_cents < claimed_cents"
        actor: system
        preconditions: ["0 < allowed_cents < claimed_cents"]
        side_effects: ["Only allowed_cents is removed from gross sales."]
      - from: CLAIMED
        to: DISALLOWED
        trigger: "system: calculations.net_reported_sales when allowed_cents == 0 and claimed_cents > 0"
        actor: system
        preconditions: ["allowed_cents == 0", "claimed_cents > 0"]
        side_effects: ["Line contributes nothing to allowed_exclusions_cents."]
      - from: ALLOWED
        to: CLAIMED
        trigger: "system: SalesReport DISPUTED -> AMENDED, or a fresh submit that rebuilds the exclusion set"
        actor: system
        preconditions: ["Owning SalesReport is transitioning to AMENDED or being resubmitted"]
        side_effects: ["allowed_cents reset to 0 pending the next calculations.net_reported_sales run."]
      - from: PARTIALLY_ALLOWED
        to: CLAIMED
        trigger: "system: SalesReport DISPUTED -> AMENDED, or a fresh submit that rebuilds the exclusion set"
        actor: system
        preconditions: ["Owning SalesReport is transitioning to AMENDED or being resubmitted"]
        side_effects: ["allowed_cents reset to 0."]
      - from: DISALLOWED
        to: CLAIMED
        trigger: "system: SalesReport DISPUTED -> AMENDED, or a fresh submit that rebuilds the exclusion set"
        actor: system
        preconditions: ["Owning SalesReport is transitioning to AMENDED or being resubmitted"]
        side_effects: ["allowed_cents reset to 0."]

  - entity: PercentageRentCharge
    dimension: billing_status
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /retail/charges/{id}/issue"
        actor: LeaseAdministrator
        preconditions:
          - "PercentageRentCharge.billing_status == DRAFT"
          - "LeaseYear.status != CLOSED"
        side_effects:
          - "Set issued_at = logical clock now."
          - "LeaseYear.cumulative_billed_cents increases by amount_cents and a ReportingLedgerEntry(entry_type = TRUE_UP_ISSUED when amount_cents > 0 else CREDIT_ISSUED, delta_billed_cents = amount_cents) is appended."
        note: "collection_status is untouched by this axis; a DRAFT charge already carries collection_status UNPAID."
      - from: ISSUED
        to: VOID
        trigger: "POST /retail/charges/{id}/void"
        actor: LeaseAdministrator
        preconditions:
          - "PercentageRentCharge.billing_status == ISSUED"
          - "PercentageRentCharge.collection_status IN {UNPAID, PARTIAL}"
          - "LeaseYear.status != CLOSED"
        side_effects:
          - "LeaseYear.cumulative_billed_cents decreases by amount_cents and a ReportingLedgerEntry(delta_billed_cents = -amount_cents) is appended."
      - from: DRAFT
        to: VOID
        trigger: "POST /retail/charges/{id}/void"
        actor: LeaseAdministrator
        preconditions:
          - "PercentageRentCharge.billing_status == DRAFT"
          - "LeaseYear.status != CLOSED"
        side_effects:
          - "No ledger movement: a DRAFT charge never entered LeaseYear.cumulative_billed_cents."

  - entity: PercentageRentCharge
    dimension: collection_status
    initial_state: UNPAID
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: UNPAID
        to: PARTIAL
        trigger: "POST /retail/charges/{id}/payments with 0 < amount_cents < amount_cents outstanding"
        actor: TenantUser
        preconditions:
          - "PercentageRentCharge.billing_status == ISSUED"
          - "0 < payload.amount_cents < (amount_cents - paid_cents)"
        side_effects:
          - "paid_cents increases by payload.amount_cents. billing_status is untouched: the two axes advance independently."
      - from: PARTIAL
        to: PAID
        trigger: "POST /retail/charges/{id}/payments settling the balance"
        actor: TenantUser
        preconditions:
          - "PercentageRentCharge.billing_status == ISSUED"
          - "payload.amount_cents == (amount_cents - paid_cents)"
        side_effects:
          - "paid_cents == amount_cents."
      - from: UNPAID
        to: PAID
        trigger: "POST /retail/charges/{id}/payments settling the whole charge in one call"
        actor: TenantUser
        preconditions:
          - "PercentageRentCharge.billing_status == ISSUED"
          - "payload.amount_cents == amount_cents"
        side_effects:
          - "paid_cents == amount_cents."
      - from: UNPAID
        to: WRITTEN_OFF
        trigger: "POST /retail/charges/{id}/void"
        actor: LeaseAdministrator
        preconditions:
          - "PercentageRentCharge.collection_status == UNPAID"
        side_effects:
          - "Voiding the billing axis drives the collection axis to WRITTEN_OFF in the same request."
      - from: PARTIAL
        to: WRITTEN_OFF
        trigger: "POST /retail/charges/{id}/void"
        actor: LeaseAdministrator
        preconditions:
          - "PercentageRentCharge.collection_status == PARTIAL"
        side_effects:
          - "paid_cents is retained on the row as a tenant credit; no refund entity is created."

  - entity: CoTenancyEvent
    initial_state: OPEN
    terminal_states: [CURED, TERMINATION_ELECTED]
    transitions:
      - from: OPEN
        to: CURE_PENDING
        trigger: "POST /retail/co-tenancy-events/{id}/acknowledge"
        actor: LeaseAdministrator
        preconditions: ["CoTenancyEvent.status == OPEN"]
        side_effects:
          - "No rent change; the cure clock declared at creation (cure_deadline_at) continues to run."
      - from: CURE_PENDING
        to: RELIEF_ACTIVE
        trigger: "POST /retail/co-tenancy-events/{id}/activate-relief"
        actor: CenterAdmin
        preconditions:
          - "CoTenancyEvent.status == CURE_PENDING"
          - "logical clock now >= CoTenancyEvent.cure_deadline_at"
          - "CoTenancyClause.monitoring_status == VIOLATED"
          - "Lease.status == ACTIVE"
        side_effects:
          - "Set relief_started_at = logical clock now."
          - "Run calculations.co_tenancy_relief and write Lease.effective_monthly_rent_cents / Lease.relief_monthly_credit_cents."
          - "Lease ACTIVE -> RELIEF_ACTIVE and Lease.co_tenancy_status = RELIEF_ACTIVE; Lease.relief_approved_by_user_id = X-User-ID."
      - from: CURE_PENDING
        to: CURED
        trigger: "POST /retail/co-tenancy-events/{id}/cure"
        actor: LeaseAdministrator
        preconditions:
          - "CoTenancyEvent.status == CURE_PENDING"
          - "CoTenancyClause.monitoring_status == SATISFIED"
        side_effects:
          - "Lease.co_tenancy_status = COMPLIANT. Lease.status is untouched (relief was never activated)."
        note: "This is the branch that skips relief entirely."
      - from: RELIEF_ACTIVE
        to: CURED
        trigger: "POST /retail/co-tenancy-events/{id}/cure"
        actor: LeaseAdministrator
        preconditions:
          - "CoTenancyEvent.status == RELIEF_ACTIVE"
          - "CoTenancyClause.monitoring_status == SATISFIED"
        side_effects:
          - "Set relief_ended_at = logical clock now."
          - "Lease RELIEF_ACTIVE -> ACTIVE, Lease.co_tenancy_status = COMPLIANT, Lease.effective_monthly_rent_cents restored to round_half_up(annual_base_rent_cents / 12), Lease.relief_monthly_credit_cents = 0."
      - from: RELIEF_ACTIVE
        to: TERMINATION_ELECTED
        trigger: "POST /retail/co-tenancy-events/{id}/elect-termination"
        actor: TenantUser
        preconditions:
          - "CoTenancyEvent.status == RELIEF_ACTIVE"
          - "logical clock now >= relief_started_at + CoTenancyClause.termination_right_after_days days"
          - "X-User-ID == Lease.tenant_id of the clause's lease"
        side_effects:
          - "Set relief_ended_at = logical clock now."
          - "Lease RELIEF_ACTIVE -> TERMINATION_PENDING and Lease.co_tenancy_status = VIOLATION_OPEN."

  - entity: KickOutClause
    initial_state: ARMED
    terminal_states: [WAIVED, EXERCISED, EXPIRED]
    transitions:
      - from: ARMED
        to: TRIGGERED
        trigger: "system: calculations.kick_out_evaluation at LeaseYear RECONCILING -> RECONCILED"
        actor: system
        preconditions:
          - "KickOutClause.status == ARMED"
          - "LeaseYear.year_index == KickOutClause.measurement_year_index"
          - "LeaseYear.cumulative_net_sales_cents < KickOutClause.threshold_sales_cents (strictly less)"
        side_effects:
          - "Set triggered_at = logical clock now and election_deadline_at = triggered_at + election_window_days days."
      - from: ARMED
        to: EXPIRED
        trigger: "system: calculations.kick_out_evaluation at LeaseYear RECONCILING -> RECONCILED"
        actor: system
        preconditions:
          - "KickOutClause.status == ARMED"
          - "LeaseYear.year_index == KickOutClause.measurement_year_index"
          - "LeaseYear.cumulative_net_sales_cents >= KickOutClause.threshold_sales_cents"
        side_effects:
          - "triggered_at and election_deadline_at stay null; the tenant never gains an election."
      - from: TRIGGERED
        to: EXERCISED
        trigger: "POST /retail/kick-out-clauses/{id}/exercise"
        actor: TenantUser
        preconditions:
          - "KickOutClause.status == TRIGGERED"
          - "The measurement LeaseYear (same lease_id, year_index == measurement_year_index) has status == RECONCILED"
          - "logical clock now <= election_deadline_at"
          - "Lease.status == ACTIVE (a lease already in RELIEF_ACTIVE cannot be kicked out)"
          - "X-User-ID == Lease.tenant_id"
        side_effects:
          - "Lease ACTIVE -> TERMINATION_PENDING."
      - from: TRIGGERED
        to: WAIVED
        trigger: "POST /retail/kick-out-clauses/{id}/waive"
        actor: CenterAdmin
        preconditions:
          - "KickOutClause.status == TRIGGERED"
          - "X-User-ID != Lease.relief_approved_by_user_id (segregation of duties)"
        side_effects:
          - "Record waiver_consideration_cents and Lease.waiver_approved_by_user_id = X-User-ID."
      - from: TRIGGERED
        to: EXPIRED
        trigger: "POST /retail/kick-out-clauses/{id}/waive after the election window closed"
        actor: CenterAdmin
        preconditions:
          - "KickOutClause.status == TRIGGERED"
          - "logical clock now > election_deadline_at"
        side_effects:
          - "The clause lapses without consideration; waiver_consideration_cents stays 0."

  - entity: SalesAudit
    initial_state: OPEN
    terminal_states: [RESCINDED]
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /retail/audits/{id}/findings"
        actor: Auditor
        preconditions:
          - "SalesAudit.status == OPEN"
          - "SalesReport.status == UNDER_AUDIT"
        side_effects:
          - "Record proposed_adjustment_cents. No sales or billing figures move yet."
      - from: FINDINGS_ISSUED
        to: SETTLED
        trigger: "POST /retail/audits/{id}/settle"
        actor: Auditor
        preconditions:
          - "SalesAudit.status == FINDINGS_ISSUED"
          - "SalesReport.status == UNDER_AUDIT"
        side_effects:
          - "Drives the SalesReport UNDER_AUDIT -> ADJUSTED cascade (see the SalesReport machine)."
      - from: SETTLED
        to: RESCINDED
        trigger: "POST /retail/audits/{id}/rescind"
        actor: Auditor
        preconditions:
          - "SalesAudit.status == SETTLED"
          - "LeaseYear.status IN {OPEN, RECONCILING}"
        side_effects:
          - "Drives the SalesReport ADJUSTED -> ACCEPTED compensation cascade."
      - from: OPEN
        to: RESCINDED
        trigger: "POST /retail/audits/{id}/rescind"
        actor: Auditor
        preconditions: ["SalesAudit.status == OPEN"]
        side_effects:
          - "SalesReport UNDER_AUDIT -> ACCEPTED; LeaseYear.open_audit_count decreases by 1."
      - from: FINDINGS_ISSUED
        to: RESCINDED
        trigger: "POST /retail/audits/{id}/rescind, or system when the tenant amends a disputed report"
        actor: Auditor
        preconditions: ["SalesAudit.status == FINDINGS_ISSUED"]
        side_effects:
          - "LeaseYear.open_audit_count decreases by 1; the report follows its own machine (UNDER_AUDIT -> ACCEPTED on rescind, DISPUTED -> AMENDED on tenant amendment)."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: estimate-bill-stale-lease-year
    parent_entity: LeaseYear
    write_endpoint: "POST /retail/sales-reports/{id}/estimate-bill"
    occ_field: "expected_lease_year_version"
    description: |
      Issuing a landlord estimate against a LeaseYear whose version has advanced
      since the client last observed it is rejected. Re-estimating a delinquent
      period is legitimate under calculations.delinquency_estimate (a second
      estimate supersedes the first once history changes), so the operation
      cannot be excluded by a state precondition alone; the stale-version check
      is what stops an estimate computed from an out-of-date lookback window
      from being posted.
    error_id: ERR_STALE_LEASE_YEAR_VERSION
    http_status: 412

  - rule_id: lease-amendment-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /retail/leases/{id}/amendments"
    occ_field: "expected_lease_version"
    description: |
      Recording a lease amendment against a Lease whose version has advanced
      since the client last observed it is rejected. A new amendment legitimately
      supersedes the prior economic terms, so a second amendment carrying an
      out-of-date view of percentage_rate_bps or breakpoint_type would silently
      undo the first; the stale-version check makes that rejectable.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_reported_sales
    trigger: "SalesReport PENDING/ESTIMATED/AMENDED -> SUBMITTED, and SalesReport UNDER_AUDIT -> ADJUSTED, and SalesReport ADJUSTED -> ACCEPTED"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - per-line capping (order: SalesExclusion.created_at ASC)
      for e in exclusions(report) ordered by created_at ASC:
          cap_bps  = EXCLUSION_CAP_BPS[lease.exclusion_profile][e.code]
          hard_cap = EXCLUSION_HARD_CAP_CENTS[e.code]            # null when uncapped
          pct_cap  = floor(report.gross_sales_cents * cap_bps / 10000)
          raw_cap  = pct_cap if hard_cap is null else min(pct_cap, hard_cap)
          e.allowed_cents = max(0, min(e.claimed_cents, raw_cap))

      # STEP 2 - aggregate cap, trimmed by a waterfall (NOT pro-rated)
      allowed_total  = sum(e.allowed_cents)
      aggregate_cap  = floor(report.gross_sales_cents * AGGREGATE_EXCLUSION_CAP_BPS / 10000)
      if allowed_total > aggregate_cap:
          overage = allowed_total - aggregate_cap
          for e in exclusions ordered by (allowed_cents DESC, created_at ASC):
              take = min(e.allowed_cents, overage)
              e.allowed_cents = e.allowed_cents - take
              overage = overage - take
              if overage == 0: break

      # STEP 3 - line statuses, then report totals
      for e in exclusions:
          e.status = ALLOWED            if e.allowed_cents == e.claimed_cents
                     else DISALLOWED    if e.allowed_cents == 0
                     else PARTIALLY_ALLOWED
      report.allowed_exclusions_cents = sum(e.allowed_cents)
      report.net_sales_cents          = report.gross_sales_cents - report.allowed_exclusions_cents
    input_set: "Every SalesExclusion row attached to the report, regardless of status. Reports with no exclusion rows yield allowed_exclusions_cents = 0 and net_sales_cents = gross_sales_cents."
    constants:
      AGGREGATE_EXCLUSION_CAP_BPS: 1500
      EXCLUSION_CAP_BPS:
        STANDARD:
          RETURNS_AND_ALLOWANCES: 1200
          SALES_TAX: 10000
          GIFT_CARD_ISSUANCE: 500
          INTERCOMPANY_TRANSFER: 10000
          EMPLOYEE_DISCOUNT: 300
          ONLINE_SHIP_FROM_STORE: 10000
          VENDING_AND_SERVICE: 200
        RESTRICTIVE:
          RETURNS_AND_ALLOWANCES: 800
          SALES_TAX: 10000
          GIFT_CARD_ISSUANCE: 0
          INTERCOMPANY_TRANSFER: 10000
          EMPLOYEE_DISCOUNT: 100
          ONLINE_SHIP_FROM_STORE: 0
          VENDING_AND_SERVICE: 200
      EXCLUSION_HARD_CAP_CENTS:
        GIFT_CARD_ISSUANCE: 500000
        EMPLOYEE_DISCOUNT: 250000
    precision: "Whole cents throughout; every intermediate cap uses floor(), never round()."

  - name: percentage_rent_charge
    trigger: "SalesReport SUBMITTED -> ACCEPTED, SalesReport PENDING -> ESTIMATED, SalesReport UNDER_AUDIT -> ADJUSTED, SalesReport ADJUSTED -> ACCEPTED"
    algorithm: threshold
    formula: |
      ly = lease_year(report)
      # variant selection is pinned by LeaseYear.billing_mode_snapshot (NOT by the
      # lease's current billing_mode, which a later amendment may have changed)
      if ly.billing_mode_snapshot == CUMULATIVE_YTD:
          prior_net    = sum(r.net_sales_cents for r in reports(ly)
                             if r.status in COUNTED_REPORT_STATUSES and r.id != report.id)
          cum_net      = prior_net + report.net_sales_cents
          excess       = max(0, cum_net - ly.breakpoint_cents)
          gross_due    = round_half_up(excess * ly.percentage_rate_bps_snapshot / 10000)
          prior_billed = sum(c.amount_cents for c in charges(ly) if c.billing_status == ISSUED)
          amount       = gross_due - prior_billed
      else:  # PERIOD_STANDALONE
          period_months     = 1 if lease.reporting_frequency == MONTHLY else 3
          period_breakpoint = round_half_up(ly.breakpoint_cents * period_months / 12)
          excess            = max(0, report.net_sales_cents - period_breakpoint)
          amount            = round_half_up(excess * ly.percentage_rate_bps_snapshot / 10000)
      # a zero amount produces NO charge row and NO billing ledger entry
      return amount
    input_set: "COUNTED_REPORT_STATUSES = {ACCEPTED, UNDER_AUDIT, DISPUTED, ADJUSTED, ESTIMATED}. Reports in PENDING, SUBMITTED, AMENDED or VOID are excluded from prior_net. Charges are included in prior_billed only while billing_status == ISSUED."
    constants:
      COUNTED_REPORT_STATUSES: [ACCEPTED, UNDER_AUDIT, DISPUTED, ADJUSTED, ESTIMATED]
    precision: "Whole cents, round_half_up applied exactly once per branch."
    variants:
      - name: cumulative_ytd
        when: "LeaseYear.billing_mode_snapshot == CUMULATIVE_YTD"
        difference: "Recomputes the whole year's percentage rent against the ANNUAL breakpoint on every acceptance and bills only the delta versus charges already ISSUED. Sales below the annual breakpoint produce zero rent no matter how they are spread across periods."
      - name: period_standalone
        when: "LeaseYear.billing_mode_snapshot == PERIOD_STANDALONE"
        difference: "Each period is billed against a pro-rated breakpoint (breakpoint_cents * period_months / 12) with no credit for prior periods, so identical sales produce strictly more rent whenever any period runs above its pro-rata share."

  - name: annual_true_up
    trigger: "LeaseYear RECONCILING -> RECONCILED"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER - this is the whole point of the true-up:
      #   (i)  the ANNUAL recompute is SUM-THEN-ROUND: per-period net sales are
      #        summed as exact integer cents and round_half_up is applied ONCE.
      #   (ii) periodic billing is ROUND-PER-PERIOD-THEN-SUM: each
      #        percentage_rent_charge already rounded its own period.
      # The true-up materialises exactly the difference between the two orders.
      annual_net_cents = sum(r.net_sales_cents for r in reports(ly)
                             if r.status in COUNTED_REPORT_STATUSES)      # exact, unrounded
      annual_excess    = max(0, annual_net_cents - ly.breakpoint_cents)
      annual_due_cents = round_half_up(annual_excess * ly.percentage_rate_bps_snapshot / 10000)
      billed_cents     = sum(c.amount_cents for c in charges(ly) if c.billing_status == ISSUED)
      true_up_delta_cents = annual_due_cents - billed_cents
      # delta > 0 -> TRUE_UP charge (DRAFT); delta < 0 -> CREDIT charge (DRAFT); delta == 0 -> no charge
    input_set: "Reports of the lease year with status IN COUNTED_REPORT_STATUSES; charges of the lease year with billing_status == ISSUED (VOID and DRAFT charges are excluded from billed_cents)."
    constants:
      COUNTED_REPORT_STATUSES: [ACCEPTED, UNDER_AUDIT, DISPUTED, ADJUSTED, ESTIMATED]
    precision: "round_half_up applied exactly once, to annual_excess * rate / 10000, after the exact-cent summation."
    variants:
      - name: cumulative_ytd_year
        when: "LeaseYear.billing_mode_snapshot == CUMULATIVE_YTD"
        difference: "billed_cents already equals the rounded annual due after the last acceptance, so true_up_delta_cents is 0 unless a charge was voided or an audit moved sales after the last acceptance."
      - name: period_standalone_year
        when: "LeaseYear.billing_mode_snapshot == PERIOD_STANDALONE"
        difference: "billed_cents is the sum of per-period rounded amounts computed against pro-rated breakpoints, so the delta captures both the pro-rata-vs-annual breakpoint difference and the accumulated per-period rounding residue."

  - name: delinquency_estimate
    trigger: "SalesReport PENDING -> ESTIMATED via POST /retail/sales-reports/{id}/estimate-bill"
    algorithm: chronological
    formula: |
      # PINNED EVALUATION ORDER (the dependency only looks circular):
      #   (1) build the lookback window from state as it stands BEFORE this
      #       estimate is posted, and EXCLUDE every report whose source ==
      #       LANDLORD_ESTIMATE - estimates never seed later estimates;
      #   (2) derive estimated_gross from that window;
      #   (3) only then run percentage_rent_charge against the cumulative that
      #       now includes step (2).
      history = [r for r in reports(ly)
                 if r.source == TENANT_REPORTED
                 and r.status in {ACCEPTED, ADJUSTED}
                 and r.period_end <= report.period_start]
      history = sort(history, key = period_end DESC, tie_break = created_at DESC)
      window  = history[0 : ESTIMATE_LOOKBACK_PERIODS]
      periods_per_year = 12 if lease.reporting_frequency == MONTHLY else 4
      if len(window) == 0:
          estimated_gross = round_half_up(ly.breakpoint_cents / periods_per_year
                                          * ESTIMATE_NO_HISTORY_FACTOR_BPS / 10000)
      else:
          base            = round_half_up(sum(w.gross_sales_cents for w in window) / len(window))
          estimated_gross = round_half_up(base * ESTIMATE_UPLIFT_BPS / 10000)
      report.gross_sales_cents        = estimated_gross
      report.allowed_exclusions_cents = 0        # an estimate carries no exclusions
      report.net_sales_cents          = estimated_gross
    input_set: "Only SalesReport rows of the SAME LeaseYear with source == TENANT_REPORTED, status IN {ACCEPTED, ADJUSTED} and period_end <= the delinquent report's period_start. LANDLORD_ESTIMATE reports are excluded at every depth, so a run of consecutive estimates never compounds."
    constants:
      ESTIMATE_LOOKBACK_PERIODS: 3
      ESTIMATE_UPLIFT_BPS: 11000
      ESTIMATE_NO_HISTORY_FACTOR_BPS: 8000
    precision: "Whole cents; round_half_up on the window average, then round_half_up on the uplift - in that order."

  - name: co_tenancy_relief
    trigger: "CoTenancyEvent CURE_PENDING -> RELIEF_ACTIVE"
    algorithm: weighted_scoring
    formula: |
      base_monthly = round_half_up(lease.annual_base_rent_cents / 12)
      if clause.relief_type == RENT_REDUCTION:
          relief_monthly = round_half_up(base_monthly * clause.relief_pct_bps / 10000)
          effective      = base_monthly - relief_monthly
      else:  # ALTERNATIVE_SALES_RENT
          window = [r for r in reports(all lease years of this lease)
                    if r.status in {ACCEPTED, ADJUSTED}]
          window = sort(window, key = period_end DESC, tie_break = created_at DESC)[0:3]
          if len(window) == 0:
              # empty-window fallback: behave as RENT_REDUCTION at the default rate
              relief_monthly = round_half_up(base_monthly * CO_TENANCY_DEFAULT_RELIEF_BPS / 10000)
              effective      = base_monthly - relief_monthly
          else:
              avg_net   = round_half_up(sum(w.net_sales_cents for w in window) / len(window))
              alt_rent  = round_half_up(avg_net * clause.relief_pct_bps / 10000)
              effective = min(base_monthly, alt_rent)
      lease.effective_monthly_rent_cents = effective
      lease.relief_monthly_credit_cents  = base_monthly - effective
    input_set: "SalesReport rows across every LeaseYear of the lease with status IN {ACCEPTED, ADJUSTED}; ESTIMATED and UNDER_AUDIT reports are excluded so a landlord estimate can never inflate an alternative-rent floor."
    constants:
      CO_TENANCY_DEFAULT_RELIEF_BPS: 5000
      ALTERNATIVE_RENT_LOOKBACK_PERIODS: 3
    precision: "Whole cents, round_half_up at each named step in the order written."
    variants:
      - name: rent_reduction
        when: "CoTenancyClause.relief_type == RENT_REDUCTION"
        difference: "Relief is a fixed share of contract base rent and is completely independent of the tenant's sales, so it is bounded by base_monthly * relief_pct_bps / 10000."
      - name: alternative_sales_rent
        when: "CoTenancyClause.relief_type == ALTERNATIVE_SALES_RENT"
        difference: "Relief is whatever it takes to bring rent down to relief_pct_bps of trailing average net sales, so for the SAME lease, SAME relief_pct_bps and SAME sales history it yields a different effective_monthly_rent_cents than rent_reduction - and no relief at all when sales are strong enough that alt_rent >= base_monthly."

  - name: occupancy_and_co_tenancy_monitor
    trigger: "Tenant status transitions, Lease DRAFT -> ACTIVE, Lease TERMINATION_PENDING -> TERMINATED"
    algorithm: constraint_propagation
    formula: |
      center.open_anchor_count  = count(t for t in tenants(center)
                                        if t.is_anchor == true and t.status == OPERATING)
      center.occupied_gla_sqft  = sum(l.leased_sqft for l in leases(center)
                                      if l.status in {ACTIVE, RELIEF_ACTIVE, TERMINATION_PENDING})
      center.occupancy_bps      = 0 if center.total_gla_sqft == 0
                                  else floor(center.occupied_gla_sqft * 10000 / center.total_gla_sqft)
      for clause in [c for c in co_tenancy_clauses(center)
                     if c.lease.status in {ACTIVE, RELIEF_ACTIVE}] ordered by created_at ASC:
          violated = (center.open_anchor_count < clause.required_open_anchor_count) \
                     or (center.occupancy_bps < clause.required_occupancy_bps)
          clause.monitoring_status = VIOLATED if violated else SATISFIED
          if violated and no CoTenancyEvent(clause) has status in {OPEN, CURE_PENDING, RELIEF_ACTIVE}:
              create CoTenancyEvent(
                  status           = OPEN,
                  event_type       = ANCHOR_WENT_DARK if center.open_anchor_count < clause.required_open_anchor_count
                                     else OCCUPANCY_BELOW_FLOOR,
                  trigger_tenant_id = the tenant whose status change caused this run when
                                      it is_anchor, else null,
                  observed_at      = logical clock now,
                  cure_deadline_at = observed_at + clause.cure_period_days days)
              clause.lease.co_tenancy_status = VIOLATION_OPEN
    input_set: "All Tenant rows of the center (any status) for the anchor count, all Lease rows of the center for occupancy, and every CoTenancyClause whose lease.status IN {ACTIVE, RELIEF_ACTIVE}."
    constants: {}
    precision: "Integer basis points via floor(); both comparisons are STRICTLY LESS THAN, so occupancy_bps == required_occupancy_bps and open_anchor_count == required_open_anchor_count are both SATISFIED."

  - name: occupancy_cost_ratio
    trigger: "PercentageRentCharge billing_status changes to ISSUED or VOID, SalesReport SUBMITTED -> ACCEPTED, SalesReport PENDING -> ESTIMATED"
    algorithm: aggregation
    formula: |
      ly = the LeaseYear of this lease with the highest year_index whose status != CLOSED
      elapsed_periods  = count(r for r in reports(ly) if r.status in COUNTED_REPORT_STATUSES)
      periods_per_year = 12 if lease.reporting_frequency == MONTHLY else 4
      lease.ytd_occupancy_cost_cents = round_half_up(lease.annual_base_rent_cents
                                                     * elapsed_periods / periods_per_year)
                                       + ly.cumulative_billed_cents
      lease.occupancy_cost_ratio_bps = 0 if ly.cumulative_net_sales_cents == 0
                                       else floor(lease.ytd_occupancy_cost_cents * 10000
                                                  / ly.cumulative_net_sales_cents)
      lease.watchlist_status = WATCHLIST if (lease.occupancy_cost_ratio_bps >= OCR_WATCHLIST_BPS
                                             or lease.delinquency_strikes >= DELINQUENCY_STRIKE_LIMIT)
                               else NORMAL
    input_set: "The single highest-year_index non-CLOSED LeaseYear of the lease; reports counted are those in COUNTED_REPORT_STATUSES; billed cents come from LeaseYear.cumulative_billed_cents."
    constants:
      OCR_WATCHLIST_BPS: 1500
      DELINQUENCY_STRIKE_LIMIT: 3
      COUNTED_REPORT_STATUSES: [ACCEPTED, UNDER_AUDIT, DISPUTED, ADJUSTED, ESTIMATED]
    precision: "floor() on the basis-point ratio; round_half_up on the pro-rated base rent."

  - name: kick_out_evaluation
    trigger: "LeaseYear RECONCILING -> RECONCILED"
    algorithm: threshold
    formula: |
      for k in [c for c in kick_out_clauses(lease)
                if c.status == ARMED and c.measurement_year_index == ly.year_index]
               ordered by created_at ASC:
          if ly.cumulative_net_sales_cents < k.threshold_sales_cents:      # STRICTLY less
              k.status              = TRIGGERED
              k.triggered_at        = logical clock now
              k.election_deadline_at = k.triggered_at + k.election_window_days days
          else:
              k.status = EXPIRED
    input_set: "KickOutClause rows of this lease with status == ARMED whose measurement_year_index equals the reconciling LeaseYear.year_index. Clauses for other years are untouched."
    constants: {}
    precision: "Integer cents; the comparison is STRICTLY LESS THAN, so cumulative_net_sales_cents == threshold_sales_cents lands on EXPIRED."

  - name: reporting_interval_conflicts
    trigger: "POST /retail/lease-years/{id}/sales-reports and POST /retail/audits"
    algorithm: interval_merge
    formula: |
      # (A) SalesReport periods on a LeaseYear - HALF-OPEN [start, end), NO buffer.
      #     Touching endpoints do NOT collide: new.period_start == r.period_end is fine.
      conflict_report = exists r in reports(ly)
                        where r.status != VOID
                          and new.period_start <  r.period_end
                          and r.period_start   <  new.period_end

      # (B) SalesAudit windows on a Lease - CLOSED [start, end], expanded by
      #     AUDIT_COOLDOWN_DAYS on BOTH sides. Touching the expanded edge DOES
      #     collide (<=), so adjacency is forbidden here and permitted in (A).
      conflict_audit  = exists a in audits(lease)
                        where a.status != RESCINDED
                          and new.audit_window_start <= a.audit_window_end   + AUDIT_COOLDOWN_DAYS days
                          and a.audit_window_start   -  AUDIT_COOLDOWN_DAYS days <= new.audit_window_end
    input_set: "(A) every SalesReport of the target LeaseYear whose status != VOID. (B) every SalesAudit of the target report's Lease whose status != RESCINDED, including SETTLED ones."
    constants:
      AUDIT_COOLDOWN_DAYS: 30
      MAX_AMENDMENT_ROUNDS: 2
    precision: "Whole-day arithmetic in UTC; comparisons are strict (<) for the half-open report rule and inclusive (<=) for the buffered closed audit rule."

  - name: center_sales_trend
    trigger: "GET /retail/centers/{id}/sales-trend"
    algorithm: aggregation
    formula: |
      comp_set = [l for l in leases(center)
                  if l.status in {ACTIVE, RELIEF_ACTIVE, TERMINATION_PENDING}
                  and exists LeaseYear(l, year_index = N)   with status == RECONCILED
                  and exists LeaseYear(l, year_index = N-1) with status == RECONCILED]
                 ordered by created_at ASC
      tenant_count    = len(comp_set)
      comp_sqft       = sum(l.leased_sqft for l in comp_set)
      current_net     = sum(LeaseYear(l, N).cumulative_net_sales_cents   for l in comp_set)
      prior_net       = sum(LeaseYear(l, N-1).cumulative_net_sales_cents for l in comp_set)
      percentage_rent = sum(LeaseYear(l, N).cumulative_billed_cents      for l in comp_set)
      occupancy_cost  = sum(round_half_up(l.annual_base_rent_cents) for l in comp_set) + percentage_rent
      comp_growth_bps          = 0 if prior_net == 0
                                 else round_half_up((current_net - prior_net) * 10000 / prior_net)
      sales_psf_cents          = 0 if comp_sqft == 0 else floor(current_net / comp_sqft)
      occupancy_cost_ratio_bps = 0 if current_net == 0
                                 else floor(occupancy_cost * 10000 / current_net)
    input_set: "Only leases with BOTH year N and year N-1 RECONCILED enter the comparable set; a center with no such lease returns tenant_count 0 and every metric 0 with HTTP 200 (never an error)."
    constants: {}
    precision: "round_half_up on comp_growth_bps (which may be negative; round_half_up on a negative value rounds away from zero at .5), floor() on the two ratio metrics."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the roles declared in section 1.7; X-User-ID header present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource named in the path exists, validated left to right; then every id referenced in the body exists."
    error_id: "ERR_CENTER_NOT_FOUND | ERR_TENANT_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_LEASE_YEAR_NOT_FOUND | ERR_SALES_REPORT_NOT_FOUND | ERR_CHARGE_NOT_FOUND | ERR_CO_TENANCY_CLAUSE_NOT_FOUND | ERR_CO_TENANCY_EVENT_NOT_FOUND | ERR_KICK_OUT_CLAUSE_NOT_FOUND | ERR_AUDIT_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "When the acting role is TenantUser, X-User-ID must equal the Lease.tenant_id reached from the target resource (report -> lease year -> lease; charge -> lease year -> lease; clause/event -> lease)."
    error_id: ERR_NOT_LEASE_TENANT
    http_status: 403
    applies_to: "POST /retail/sales-reports/{id}/submit, POST /retail/sales-reports/{id}/dispute, POST /retail/sales-reports/{id}/amend, POST /retail/charges/{id}/payments, POST /retail/co-tenancy-events/{id}/elect-termination, POST /retail/kick-out-clauses/{id}/exercise"

  - priority: 5
    category: state
    check: "Request body is well formed: every required field present, enum members valid, integers within their declared ranges, period_end > period_start, audit_window_end >= audit_window_start."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "The target entity is in a from-state that the requested transition declares in section 1.2, including the owning LeaseYear's own status gate (submission and report creation require LeaseYear.status == OPEN; acceptance, estimate billing and audit actions require LeaseYear.status IN {OPEN, RECONCILING}; every mutation is refused once LeaseYear.status == CLOSED)."
    error_id: "ERR_TENANT_STATE_INVALID | ERR_LEASE_STATE_INVALID | ERR_LEASE_YEAR_STATE_INVALID | ERR_REPORT_STATE_INVALID | ERR_CHARGE_STATE_INVALID | ERR_CO_TENANCY_EVENT_STATE_INVALID | ERR_KICK_OUT_STATE_INVALID | ERR_AUDIT_STATE_INVALID"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 7
    category: state
    check: "For endpoints declaring an OCC field, payload.expected_<parent>_version equals the parent's current version."
    error_id: "ERR_STALE_LEASE_YEAR_VERSION | ERR_STALE_LEASE_VERSION"
    http_status: 412
    applies_to: "POST /retail/sales-reports/{id}/estimate-bill, POST /retail/leases/{id}/amendments"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the CenterAdmin waiving a kick-out right must not be the CenterAdmin who activated co-tenancy relief on the same lease (X-User-ID != Lease.relief_approved_by_user_id)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /retail/kick-out-clauses/{id}/waive"

  - priority: 9
    category: business_safety
    check: "A LeaseYear cannot be reconciled while any SalesAudit targeting one of its reports has status IN {OPEN, FINDINGS_ISSUED} (LeaseYear.open_audit_count > 0)."
    error_id: ERR_OPEN_AUDIT_BLOCKS_RECONCILE
    http_status: 409
    applies_to: "POST /retail/lease-years/{id}/reconcile"

  - priority: 10
    category: business_referential
    check: "Cross-entity referential preconditions: Lease.tenant_id must belong to Lease.center_id (ERR_CENTER_MISMATCH); a LeaseYear.year_index must be unique per lease (ERR_DUPLICATE_LEASE_YEAR_INDEX); reconciling requires every SalesReport of the lease year to be out of {PENDING, SUBMITTED, UNDER_AUDIT, DISPUTED, AMENDED} (ERR_UNACCEPTED_REPORTS_BLOCK_RECONCILE); exercising a kick-out requires the measurement LeaseYear to be RECONCILED (ERR_KICK_OUT_MEASUREMENT_YEAR_NOT_RECONCILED); exercising a kick-out is refused while Lease.status == RELIEF_ACTIVE (ERR_RELIEF_ACTIVE_BLOCKS_EXERCISE)."
    error_id: "ERR_CENTER_MISMATCH | ERR_DUPLICATE_LEASE_YEAR_INDEX | ERR_UNACCEPTED_REPORTS_BLOCK_RECONCILE | ERR_KICK_OUT_MEASUREMENT_YEAR_NOT_RECONCILED | ERR_RELIEF_ACTIVE_BLOCKS_EXERCISE"
    http_status: 409
    applies_to: "POST /retail/leases, POST /retail/leases/{id}/lease-years, POST /retail/lease-years/{id}/reconcile, POST /retail/kick-out-clauses/{id}/exercise"

  - priority: 11
    category: business_temporal
    check: "Interval and clock rules: a new SalesReport period must not overlap a non-VOID report of the same lease year under half-open [start, end) semantics, where touching endpoints do NOT overlap (ERR_REPORTING_PERIOD_OVERLAP); a new SalesAudit window must not fall inside any existing non-RESCINDED audit window on the same lease expanded by AUDIT_COOLDOWN_DAYS = 30 on both sides under closed [start, end] semantics, where touching the expanded edge DOES conflict (ERR_AUDIT_WINDOW_CONFLICT); estimate billing requires logical-clock now > SalesReport.due_at strictly (ERR_REPORT_NOT_DELINQUENT); relief activation requires now >= cure_deadline_at (ERR_CURE_PERIOD_NOT_ELAPSED); kick-out exercise requires now <= election_deadline_at (ERR_KICK_OUT_ELECTION_WINDOW_CLOSED); termination election requires now >= relief_started_at + termination_right_after_days (ERR_TERMINATION_RIGHT_NOT_RIPE)."
    error_id: "ERR_REPORTING_PERIOD_OVERLAP | ERR_AUDIT_WINDOW_CONFLICT | ERR_REPORT_NOT_DELINQUENT | ERR_CURE_PERIOD_NOT_ELAPSED | ERR_KICK_OUT_ELECTION_WINDOW_CLOSED | ERR_TERMINATION_RIGHT_NOT_RIPE"
    http_status: 409
    applies_to: "POST /retail/lease-years/{id}/sales-reports, POST /retail/audits, POST /retail/sales-reports/{id}/estimate-bill, POST /retail/co-tenancy-events/{id}/activate-relief, POST /retail/kick-out-clauses/{id}/exercise, POST /retail/co-tenancy-events/{id}/elect-termination"

  - priority: 12
    category: business_constraint
    check: "Domain shape rules: breakpoint_type == ARTIFICIAL requires artificial_breakpoint_cents > 0 and NATURAL forbids it (ERR_BREAKPOINT_CONFIG_INVALID); a SalesReport period must lie inside [LeaseYear.period_start, LeaseYear.period_end] (ERR_PERIOD_OUTSIDE_LEASE_YEAR); an exclusion whose code maps to cap_bps == 0 under the lease's exclusion_profile may not be claimed with claimed_cents > 0 (ERR_EXCLUSION_CODE_NOT_PERMITTED); dispute and amend are refused once amendment_round == MAX_AMENDMENT_ROUNDS (ERR_AMENDMENT_LIMIT_EXCEEDED)."
    error_id: "ERR_BREAKPOINT_CONFIG_INVALID | ERR_PERIOD_OUTSIDE_LEASE_YEAR | ERR_EXCLUSION_CODE_NOT_PERMITTED | ERR_AMENDMENT_LIMIT_EXCEEDED"
    http_status: 422
    applies_to: "POST /retail/leases, POST /retail/leases/{id}/amendments, POST /retail/lease-years/{id}/sales-reports, POST /retail/sales-reports/{id}/submit, POST /retail/sales-reports/{id}/dispute, POST /retail/sales-reports/{id}/amend"

  - priority: 13
    category: business_fiscal
    check: "Money rules applied last: a payment may not exceed the charge's outstanding balance (payload.amount_cents <= amount_cents - paid_cents) and must be strictly positive."
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /retail/charges/{id}/payments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/retail/centers"
    description: "Register a shopping center."
    roles: [CenterAdmin]
    code: 201
    input: ["name", "code", "total_gla_sqft", "anchor_gla_sqft", "fiscal_year_start_month?"]
    output: ShoppingCenter
    side_effects: ["occupied_gla_sqft, occupancy_bps and open_anchor_count initialise to 0."]

  - method: GET
    path: "/retail/centers/{id}"
    description: "Read a shopping center with its derived occupancy metrics."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst]
    code: 200
    input: []
    output: ShoppingCenter
    side_effects: []

  - method: GET
    path: "/retail/centers/{id}/sales-trend"
    description: "Ownership trend report for reporting year `year_index` computed by calculations.center_sales_trend."
    roles: [OwnershipAnalyst]
    code: 200
    input: ["year_index"]
    output: { tenant_count: integer, comp_sqft: integer, current_net_sales_cents: integer, prior_net_sales_cents: integer, comp_growth_bps: integer, percentage_rent_cents: integer, sales_psf_cents: integer, occupancy_cost_ratio_bps: integer }
    side_effects: []

  - method: POST
    path: "/retail/tenants"
    description: "Register a tenant in a center."
    roles: [CenterAdmin, LeaseAdministrator]
    code: 201
    input: ["center_id", "legal_name", "trade_name", "category", "gla_sqft"]
    output: Tenant
    side_effects: ["Tenant.status initialises to PROSPECT; is_anchor derived from category."]

  - method: GET
    path: "/retail/tenants/{id}"
    description: "Read a tenant."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst, TenantUser]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  - method: GET
    path: "/retail/tenants"
    description: "List tenants, filterable by center and status."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst]
    code: 200
    input: ["center_id?", "status?", "category?", "limit?", "offset?"]
    output: Tenant[]
    side_effects: []

  - method: POST
    path: "/retail/tenants/{id}/status"
    description: "Move a tenant along its operating-status machine."
    roles: [CenterAdmin, LeaseAdministrator]
    code: 200
    input: ["to_status"]
    output: Tenant
    side_effects:
      - "Runs calculations.occupancy_and_co_tenancy_monitor for the tenant's center."
      - "May create CoTenancyEvent rows and flip CoTenancyClause.monitoring_status and Lease.co_tenancy_status."

  - method: POST
    path: "/retail/leases"
    description: "Create a lease in DRAFT with its percentage-rent economics."
    roles: [CenterAdmin, LeaseAdministrator]
    code: 201
    input: ["center_id", "tenant_id", "suite_code", "leased_sqft", "annual_base_rent_cents", "percentage_rate_bps", "breakpoint_type", "artificial_breakpoint_cents?", "billing_mode", "reporting_frequency", "reporting_deadline_days", "exclusion_profile"]
    output: Lease
    side_effects: ["Computes natural_breakpoint_cents and effective_breakpoint_cents."]

  - method: GET
    path: "/retail/leases/{id}"
    description: "Read a lease with its derived breakpoint, relief and watchlist fields."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst, TenantUser]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/retail/leases"
    description: "List leases, filterable by center, tenant, status and watchlist posture."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst]
    code: 200
    input: ["center_id?", "tenant_id?", "status?", "watchlist_status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []

  - method: POST
    path: "/retail/leases/{id}/activate"
    description: "Commence the lease (DRAFT -> ACTIVE)."
    roles: [CenterAdmin, LeaseAdministrator]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "Sets effective_monthly_rent_cents; runs calculations.occupancy_and_co_tenancy_monitor."
      - "increments Lease.version by 1"

  - method: POST
    path: "/retail/leases/{id}/amendments"
    description: "Record an economic amendment to the lease under optimistic concurrency on Lease.version."
    roles: [CenterAdmin]
    code: 200
    input: ["expected_lease_version", "percentage_rate_bps?", "annual_base_rent_cents?", "breakpoint_type?", "artificial_breakpoint_cents?", "billing_mode?", "exclusion_profile?"]
    output: Lease
    side_effects:
      - "Recomputes natural_breakpoint_cents and effective_breakpoint_cents."
      - "Existing LeaseYear snapshots (breakpoint_cents, percentage_rate_bps_snapshot, billing_mode_snapshot) are NOT rewritten."
      - "increments Lease.version by 1"

  - method: POST
    path: "/retail/leases/{id}/terminate"
    description: "Complete a pending termination (TERMINATION_PENDING -> TERMINATED)."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Lease
    side_effects: ["Runs calculations.occupancy_and_co_tenancy_monitor; occupied_gla_sqft drops."]

  - method: POST
    path: "/retail/leases/{id}/lease-years"
    description: "Open a reporting year and pin its breakpoint, rate and billing-mode snapshots."
    roles: [LeaseAdministrator]
    code: 201
    input: ["year_index", "period_start", "period_end"]
    output: LeaseYear
    side_effects: ["Copies Lease.effective_breakpoint_cents, percentage_rate_bps and billing_mode into the LeaseYear snapshot fields."]

  - method: GET
    path: "/retail/lease-years/{id}"
    description: "Read a reporting year with its running totals."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst, TenantUser]
    code: 200
    input: []
    output: LeaseYear
    side_effects: []

  - method: GET
    path: "/retail/lease-years"
    description: "List reporting years, filterable by lease, status and year index."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst, TenantUser]
    code: 200
    input: ["lease_id?", "status?", "year_index?", "limit?", "offset?"]
    output: LeaseYear[]
    side_effects: []

  - method: GET
    path: "/retail/lease-years/{id}/ledger-entries"
    description: "Append-only audit trail of every movement applied to the reporting year's running totals, oldest first."
    roles: [CenterAdmin, LeaseAdministrator, Auditor]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: ReportingLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/retail/lease-years/{id}/close-period"
    description: "Freeze the reporting year for reconciliation (OPEN -> RECONCILING)."
    roles: [LeaseAdministrator]
    code: 200
    input: []
    output: LeaseYear
    side_effects: ["Blocks new SalesReport creation and PENDING submission."]

  - method: POST
    path: "/retail/lease-years/{id}/reconcile"
    description: "Run the year-end true-up (RECONCILING -> RECONCILED)."
    roles: [LeaseAdministrator]
    code: 200
    input: []
    output: LeaseYear
    side_effects:
      - "Runs calculations.annual_true_up and writes true_up_delta_cents."
      - "Creates a DRAFT TRUE_UP or CREDIT PercentageRentCharge when the delta is non-zero."
      - "Runs calculations.kick_out_evaluation for matching ARMED KickOutClause rows."

  - method: POST
    path: "/retail/lease-years/{id}/reopen"
    description: "Reopen a frozen or reconciled year (RECONCILING -> OPEN, or RECONCILED -> RECONCILING)."
    roles: [LeaseAdministrator]
    code: 200
    input: ["reason"]
    output: LeaseYear
    side_effects: ["Clears true_up_delta_cents when leaving RECONCILED; already-TRIGGERED kick-out clauses keep their status."]

  - method: POST
    path: "/retail/lease-years/{id}/close"
    description: "Permanently close a reconciled year (RECONCILED -> CLOSED)."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: LeaseYear
    side_effects: ["Every mutating endpoint scoped to the year now rejects with ERR_LEASE_YEAR_STATE_INVALID."]

  - method: POST
    path: "/retail/lease-years/{id}/sales-reports"
    description: "Schedule a reporting period; the report is created PENDING with its due_at derived from the lease deadline."
    roles: [LeaseAdministrator]
    code: 201
    input: ["period_start", "period_end"]
    output: SalesReport
    side_effects: ["Computes due_at = period_end + Lease.reporting_deadline_days days."]

  - method: GET
    path: "/retail/sales-reports/{id}"
    description: "Read a sales report with its computed exclusion and net-sales figures."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst, TenantUser]
    code: 200
    input: []
    output: SalesReport
    side_effects: []

  - method: GET
    path: "/retail/sales-reports"
    description: "List sales reports, filterable by lease year, status, source and delinquency."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst, TenantUser]
    code: 200
    input: ["lease_year_id?", "status?", "source?", "is_delinquent?", "limit?", "offset?"]
    output: SalesReport[]
    side_effects: []

  - method: GET
    path: "/retail/sales-reports/{id}/exclusions"
    description: "List the exclusion lines of a report with their capped allowances, oldest first."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, TenantUser]
    code: 200
    input: ["code?", "status?", "limit?", "offset?"]
    output: SalesExclusion[]
    side_effects: []

  - method: POST
    path: "/retail/sales-reports/{id}/submit"
    description: "Tenant files gross sales and exclusion lines for the period (PENDING, ESTIMATED or AMENDED -> SUBMITTED)."
    roles: [TenantUser]
    code: 200
    input: ["gross_sales_cents", "exclusions?"]
    output: SalesReport
    side_effects:
      - "Rebuilds SalesExclusion rows from the payload and runs calculations.net_reported_sales."
      - "From ESTIMATED: withdraws the estimate from the year's cumulative sales and voids the ESTIMATE charge."

  - method: POST
    path: "/retail/sales-reports/{id}/accept"
    description: "Landlord accepts the reported sales (SUBMITTED -> ACCEPTED) and bills percentage rent."
    roles: [LeaseAdministrator]
    code: 200
    input: []
    output: SalesReport
    side_effects:
      - "LeaseYear.cumulative_net_sales_cents increases; ReportingLedgerEntry appended."
      - "Runs calculations.percentage_rent_charge and may create an ISSUED PERIODIC charge."
      - "Runs calculations.occupancy_cost_ratio and may flip Lease.watchlist_status."

  - method: POST
    path: "/retail/sales-reports/{id}/estimate-bill"
    description: "Estimate-bill a delinquent period (PENDING -> ESTIMATED) under optimistic concurrency on LeaseYear.version."
    roles: [LeaseAdministrator]
    code: 200
    input: ["expected_lease_year_version"]
    output: SalesReport
    side_effects:
      - "Runs calculations.delinquency_estimate then calculations.percentage_rent_charge."
      - "Increments Lease.delinquency_strikes by 1."
      - "increments LeaseYear.version by 1"

  - method: POST
    path: "/retail/sales-reports/{id}/dispute"
    description: "Tenant disputes audit findings (UNDER_AUDIT -> DISPUTED)."
    roles: [TenantUser]
    code: 200
    input: ["reason"]
    output: SalesReport
    side_effects: ["No movement in the year's running totals."]

  - method: POST
    path: "/retail/sales-reports/{id}/amend"
    description: "Tenant withdraws a disputed report for amendment (DISPUTED -> AMENDED)."
    roles: [TenantUser]
    code: 200
    input: ["reason"]
    output: SalesReport
    side_effects:
      - "Increments amendment_round; withdraws the report from the year's cumulative sales."
      - "Rescinds the open SalesAudit and resets every SalesExclusion to CLAIMED."

  - method: GET
    path: "/retail/charges/{id}"
    description: "Read a percentage-rent charge with both of its status axes."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst, TenantUser]
    code: 200
    input: []
    output: PercentageRentCharge
    side_effects: []

  - method: GET
    path: "/retail/charges"
    description: "List charges, filterable by lease year, report, superseded charge, type and both status axes."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst, TenantUser]
    code: 200
    input: ["lease_year_id?", "sales_report_id?", "supersedes_charge_id?", "charge_type?", "billing_status?", "collection_status?", "limit?", "offset?"]
    output: PercentageRentCharge[]
    side_effects: []

  - method: POST
    path: "/retail/charges/{id}/issue"
    description: "Issue a DRAFT charge (billing axis DRAFT -> ISSUED)."
    roles: [LeaseAdministrator]
    code: 200
    input: []
    output: PercentageRentCharge
    side_effects: ["LeaseYear.cumulative_billed_cents moves by amount_cents; ReportingLedgerEntry appended."]

  - method: POST
    path: "/retail/charges/{id}/void"
    description: "Void a charge (billing axis -> VOID, collection axis -> WRITTEN_OFF)."
    roles: [LeaseAdministrator]
    code: 200
    input: ["reason"]
    output: PercentageRentCharge
    side_effects: ["When the charge was ISSUED, LeaseYear.cumulative_billed_cents is reduced by amount_cents and a ReportingLedgerEntry is appended."]

  - method: POST
    path: "/retail/charges/{id}/payments"
    description: "Apply a payment to an issued charge (collection axis only)."
    roles: [LeaseAdministrator, TenantUser]
    code: 200
    input: ["amount_cents"]
    output: PercentageRentCharge
    side_effects: ["paid_cents increases; collection_status advances; billing_status is untouched."]

  - method: POST
    path: "/retail/leases/{id}/co-tenancy-clauses"
    description: "Attach a co-tenancy clause to a lease."
    roles: [CenterAdmin]
    code: 201
    input: ["required_open_anchor_count", "required_occupancy_bps", "cure_period_days", "relief_type", "relief_pct_bps", "termination_right_after_days"]
    output: CoTenancyClause
    side_effects: ["Runs calculations.occupancy_and_co_tenancy_monitor immediately, so a clause created into an already-violating center opens a CoTenancyEvent on creation."]

  - method: GET
    path: "/retail/co-tenancy-clauses/{id}"
    description: "Read a co-tenancy clause with its monitoring posture."
    roles: [CenterAdmin, LeaseAdministrator, OwnershipAnalyst, TenantUser]
    code: 200
    input: []
    output: CoTenancyClause
    side_effects: []

  - method: GET
    path: "/retail/co-tenancy-clauses"
    description: "List co-tenancy clauses, filterable by lease and monitoring posture."
    roles: [CenterAdmin, LeaseAdministrator, OwnershipAnalyst, TenantUser]
    code: 200
    input: ["lease_id?", "monitoring_status?", "relief_type?", "limit?", "offset?"]
    output: CoTenancyClause[]
    side_effects: []

  - method: GET
    path: "/retail/co-tenancy-events/{id}"
    description: "Read a co-tenancy violation event."
    roles: [CenterAdmin, LeaseAdministrator, OwnershipAnalyst, TenantUser]
    code: 200
    input: []
    output: CoTenancyEvent
    side_effects: []

  - method: GET
    path: "/retail/co-tenancy-events"
    description: "List co-tenancy events, filterable by clause, triggering tenant, type and status."
    roles: [CenterAdmin, LeaseAdministrator, OwnershipAnalyst, TenantUser]
    code: 200
    input: ["clause_id?", "trigger_tenant_id?", "event_type?", "status?", "limit?", "offset?"]
    output: CoTenancyEvent[]
    side_effects: []

  - method: POST
    path: "/retail/co-tenancy-events/{id}/acknowledge"
    description: "Landlord acknowledges the violation and starts the documented cure (OPEN -> CURE_PENDING)."
    roles: [LeaseAdministrator]
    code: 200
    input: []
    output: CoTenancyEvent
    side_effects: []

  - method: POST
    path: "/retail/co-tenancy-events/{id}/activate-relief"
    description: "Activate rent relief after the cure period lapses (CURE_PENDING -> RELIEF_ACTIVE)."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: CoTenancyEvent
    side_effects:
      - "Runs calculations.co_tenancy_relief and rewrites Lease.effective_monthly_rent_cents / relief_monthly_credit_cents."
      - "Lease ACTIVE -> RELIEF_ACTIVE; records Lease.relief_approved_by_user_id = X-User-ID."

  - method: POST
    path: "/retail/co-tenancy-events/{id}/cure"
    description: "Close a co-tenancy violation once the clause test passes again (CURE_PENDING or RELIEF_ACTIVE -> CURED)."
    roles: [LeaseAdministrator]
    code: 200
    input: []
    output: CoTenancyEvent
    side_effects: ["From RELIEF_ACTIVE: Lease -> ACTIVE and base rent is restored."]

  - method: POST
    path: "/retail/co-tenancy-events/{id}/elect-termination"
    description: "Tenant elects to terminate after continuous relief (RELIEF_ACTIVE -> TERMINATION_ELECTED)."
    roles: [TenantUser]
    code: 200
    input: []
    output: CoTenancyEvent
    side_effects: ["Lease -> TERMINATION_PENDING."]

  - method: POST
    path: "/retail/leases/{id}/kick-out-clauses"
    description: "Attach a kick-out (sales-threshold) clause to a lease."
    roles: [CenterAdmin]
    code: 201
    input: ["measurement_year_index", "threshold_sales_cents", "election_window_days"]
    output: KickOutClause
    side_effects: ["Clause is created ARMED with triggered_at and election_deadline_at null."]

  - method: GET
    path: "/retail/kick-out-clauses/{id}"
    description: "Read a kick-out clause."
    roles: [CenterAdmin, LeaseAdministrator, OwnershipAnalyst, TenantUser]
    code: 200
    input: []
    output: KickOutClause
    side_effects: []

  - method: GET
    path: "/retail/kick-out-clauses"
    description: "List kick-out clauses, filterable by lease and status."
    roles: [CenterAdmin, LeaseAdministrator, OwnershipAnalyst, TenantUser]
    code: 200
    input: ["lease_id?", "status?", "measurement_year_index?", "limit?", "offset?"]
    output: KickOutClause[]
    side_effects: []

  - method: POST
    path: "/retail/kick-out-clauses/{id}/exercise"
    description: "Tenant exercises a triggered kick-out right (TRIGGERED -> EXERCISED)."
    roles: [TenantUser]
    code: 200
    input: []
    output: KickOutClause
    side_effects: ["Lease ACTIVE -> TERMINATION_PENDING."]

  - method: POST
    path: "/retail/kick-out-clauses/{id}/waive"
    description: "Landlord buys out or lets lapse a triggered kick-out right (TRIGGERED -> WAIVED, or -> EXPIRED once the window closed)."
    roles: [CenterAdmin]
    code: 200
    input: ["waiver_consideration_cents?"]
    output: KickOutClause
    side_effects: ["Records Lease.waiver_approved_by_user_id = X-User-ID when the outcome is WAIVED."]

  - method: POST
    path: "/retail/audits"
    description: "Open an audit against an accepted sales report."
    roles: [Auditor]
    code: 201
    input: ["sales_report_id", "audit_window_start", "audit_window_end"]
    output: SalesAudit
    side_effects:
      - "SalesReport ACCEPTED -> UNDER_AUDIT; LeaseYear.open_audit_count increases by 1."
      - "Resolves lease_id from the report's lease year and records auditor_user_id = X-User-ID."

  - method: GET
    path: "/retail/audits/{id}"
    description: "Read an audit."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, TenantUser]
    code: 200
    input: []
    output: SalesAudit
    side_effects: []

  - method: GET
    path: "/retail/audits"
    description: "List audits, filterable by lease, report and status."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, TenantUser]
    code: 200
    input: ["lease_id?", "sales_report_id?", "status?", "limit?", "offset?"]
    output: SalesAudit[]
    side_effects: []

  - method: POST
    path: "/retail/audits/{id}/findings"
    description: "Issue audit findings (OPEN -> FINDINGS_ISSUED)."
    roles: [Auditor]
    code: 200
    input: ["proposed_adjustment_cents"]
    output: SalesAudit
    side_effects: ["No sales or billing figures move."]

  - method: POST
    path: "/retail/audits/{id}/settle"
    description: "Settle the audit and apply the adjustment (FINDINGS_ISSUED -> SETTLED)."
    roles: [Auditor]
    code: 200
    input: ["settled_adjustment_cents"]
    output: SalesAudit
    side_effects:
      - "SalesReport UNDER_AUDIT -> ADJUSTED with gross_sales_cents moved by settled_adjustment_cents."
      - "Re-runs calculations.net_reported_sales and calculations.percentage_rent_charge; may create a supplemental ISSUED charge."

  - method: POST
    path: "/retail/audits/{id}/rescind"
    description: "Rescind an audit, compensating a settlement if one was applied (OPEN, FINDINGS_ISSUED or SETTLED -> RESCINDED)."
    roles: [Auditor]
    code: 200
    input: ["reason"]
    output: SalesAudit
    side_effects:
      - "From SETTLED: reverses the gross-sales adjustment, restores LeaseYear.cumulative_net_sales_cents and voids the charge the settlement created."
      - "LeaseYear.open_audit_count decreases by 1 when leaving OPEN or FINDINGS_ISSUED."

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [CenterAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["All deadline, cure-period and election-window comparisons use this clock."]

  - method: GET
    path: "/_clock"
    description: "Read the server's logical UTC clock (defaults to 2026-08-01T00:00:00Z)."
    roles: [CenterAdmin, LeaseAdministrator, Auditor, OwnershipAnalyst, TenantUser]
    code: 200
    input: []
    output: { current_utc: string }
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming an unknown role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role is not listed in the endpoint's roles."
  - id: ERR_NOT_LEASE_TENANT
    http: 403
    condition: "TenantUser's X-User-ID does not equal the Lease.tenant_id reached from the target resource."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The CenterAdmin waiving a kick-out right is the same X-User-ID recorded in Lease.relief_approved_by_user_id."
  - id: ERR_CENTER_NOT_FOUND
    http: 404
    condition: "No ShoppingCenter with the given id."
  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "No Tenant with the given id."
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "No Lease with the given id."
  - id: ERR_LEASE_YEAR_NOT_FOUND
    http: 404
    condition: "No LeaseYear with the given id."
  - id: ERR_SALES_REPORT_NOT_FOUND
    http: 404
    condition: "No SalesReport with the given id."
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "No PercentageRentCharge with the given id."
  - id: ERR_CO_TENANCY_CLAUSE_NOT_FOUND
    http: 404
    condition: "No CoTenancyClause with the given id."
  - id: ERR_CO_TENANCY_EVENT_NOT_FOUND
    http: 404
    condition: "No CoTenancyEvent with the given id."
  - id: ERR_KICK_OUT_CLAUSE_NOT_FOUND
    http: 404
    condition: "No KickOutClause with the given id."
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "No SalesAudit with the given id."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, unknown enum member, out-of-range integer, or period_end <= period_start / audit_window_end < audit_window_start."
  - id: ERR_TENANT_STATE_INVALID
    http: 409
    condition: "Requested Tenant.status transition is not declared from the tenant's current status."
  - id: ERR_LEASE_STATE_INVALID
    http: 409
    condition: "Lease is not in a from-state that permits the requested operation."
  - id: ERR_LEASE_YEAR_STATE_INVALID
    http: 409
    condition: "LeaseYear is not in a status that permits the requested operation (including any mutation once CLOSED)."
  - id: ERR_REPORT_STATE_INVALID
    http: 409
    condition: "SalesReport is not in a from-state that permits the requested transition."
  - id: ERR_CHARGE_STATE_INVALID
    http: 409
    condition: "PercentageRentCharge billing_status or collection_status does not permit the requested operation."
  - id: ERR_CO_TENANCY_EVENT_STATE_INVALID
    http: 409
    condition: "CoTenancyEvent is not in a from-state that permits the requested transition, or its clause is no longer VIOLATED when relief activation is attempted."
  - id: ERR_KICK_OUT_STATE_INVALID
    http: 409
    condition: "KickOutClause is not TRIGGERED when exercise or waiver is attempted."
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "SalesAudit is not in a from-state that permits findings, settlement or rescission."
  - id: ERR_STALE_LEASE_YEAR_VERSION
    http: 412
    condition: "payload.expected_lease_year_version does not equal the LeaseYear's current version."
  - id: ERR_STALE_LEASE_VERSION
    http: 412
    condition: "payload.expected_lease_version does not equal the Lease's current version."
  - id: ERR_OPEN_AUDIT_BLOCKS_RECONCILE
    http: 409
    condition: "Reconcile attempted while LeaseYear.open_audit_count > 0."
  - id: ERR_UNACCEPTED_REPORTS_BLOCK_RECONCILE
    http: 409
    condition: "Reconcile attempted while a SalesReport of the year is in {PENDING, SUBMITTED, UNDER_AUDIT, DISPUTED, AMENDED}."
  - id: ERR_CENTER_MISMATCH
    http: 409
    condition: "Lease.tenant_id names a Tenant whose center_id differs from the lease's center_id."
  - id: ERR_DUPLICATE_LEASE_YEAR_INDEX
    http: 409
    condition: "A LeaseYear with the same year_index already exists on this lease."
  - id: ERR_KICK_OUT_MEASUREMENT_YEAR_NOT_RECONCILED
    http: 409
    condition: "Kick-out exercise attempted while the measurement LeaseYear.status != RECONCILED."
  - id: ERR_RELIEF_ACTIVE_BLOCKS_EXERCISE
    http: 409
    condition: "Kick-out exercise attempted while Lease.status == RELIEF_ACTIVE."
  - id: ERR_REPORTING_PERIOD_OVERLAP
    http: 409
    condition: "A new report period overlaps a non-VOID report of the same lease year under half-open [start, end) semantics."
  - id: ERR_AUDIT_WINDOW_CONFLICT
    http: 409
    condition: "A new audit window collides with an existing non-RESCINDED audit window on the same lease after expanding that window by AUDIT_COOLDOWN_DAYS = 30 on both sides (closed-interval semantics)."
  - id: ERR_REPORT_NOT_DELINQUENT
    http: 409
    condition: "Estimate billing attempted while logical clock now <= SalesReport.due_at."
  - id: ERR_CURE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "Relief activation attempted while logical clock now < CoTenancyEvent.cure_deadline_at."
  - id: ERR_KICK_OUT_ELECTION_WINDOW_CLOSED
    http: 409
    condition: "Kick-out exercise attempted while logical clock now > KickOutClause.election_deadline_at."
  - id: ERR_TERMINATION_RIGHT_NOT_RIPE
    http: 409
    condition: "Termination election attempted before relief_started_at + CoTenancyClause.termination_right_after_days days."
  - id: ERR_BREAKPOINT_CONFIG_INVALID
    http: 422
    condition: "breakpoint_type == ARTIFICIAL without a positive artificial_breakpoint_cents, or breakpoint_type == NATURAL with artificial_breakpoint_cents supplied."
  - id: ERR_PERIOD_OUTSIDE_LEASE_YEAR
    http: 422
    condition: "A report period falls partly or wholly outside [LeaseYear.period_start, LeaseYear.period_end]."
  - id: ERR_EXCLUSION_CODE_NOT_PERMITTED
    http: 422
    condition: "An exclusion line claims claimed_cents > 0 for a code whose cap_bps is 0 under the lease's exclusion_profile."
  - id: ERR_AMENDMENT_LIMIT_EXCEEDED
    http: 422
    condition: "Dispute or amend attempted when SalesReport.amendment_round has already reached MAX_AMENDMENT_ROUNDS (2)."
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "Payment amount_cents is <= 0 or greater than (PercentageRentCharge.amount_cents - paid_cents)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CenterAdmin
    description: "Owner-side administrator: center setup, lease economics and amendments, clause attachment, relief activation, kick-out waiver, year closure, logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /retail/centers"
      - "POST /retail/leases/{id}/amendments"
      - "POST /retail/leases/{id}/terminate"
      - "POST /retail/lease-years/{id}/close"
      - "POST /retail/leases/{id}/co-tenancy-clauses"
      - "POST /retail/leases/{id}/kick-out-clauses"
      - "POST /retail/co-tenancy-events/{id}/activate-relief"
      - "POST /retail/kick-out-clauses/{id}/waive"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /retail/tenants (with LeaseAdministrator)"
      - "POST /retail/tenants/{id}/status (with LeaseAdministrator)"
      - "POST /retail/leases (with LeaseAdministrator)"
      - "POST /retail/leases/{id}/activate (with LeaseAdministrator)"
      - "All GET reads except GET /retail/centers/{id}/sales-trend"

  - name: LeaseAdministrator
    description: "Lease administration desk: opens reporting years, schedules and accepts sales reports, estimate-bills delinquents, issues and voids charges, runs reconciliation, works co-tenancy events."
    identity: opaque
    exclusive_operations:
      - "POST /retail/leases/{id}/lease-years"
      - "POST /retail/lease-years/{id}/sales-reports"
      - "POST /retail/lease-years/{id}/close-period"
      - "POST /retail/lease-years/{id}/reconcile"
      - "POST /retail/lease-years/{id}/reopen"
      - "POST /retail/sales-reports/{id}/accept"
      - "POST /retail/sales-reports/{id}/estimate-bill"
      - "POST /retail/charges/{id}/issue"
      - "POST /retail/charges/{id}/void"
      - "POST /retail/co-tenancy-events/{id}/acknowledge"
      - "POST /retail/co-tenancy-events/{id}/cure"
    shared_operations:
      - "POST /retail/tenants (with CenterAdmin)"
      - "POST /retail/tenants/{id}/status (with CenterAdmin)"
      - "POST /retail/leases (with CenterAdmin)"
      - "POST /retail/leases/{id}/activate (with CenterAdmin)"
      - "POST /retail/charges/{id}/payments (with TenantUser)"
      - "All GET reads except GET /retail/centers/{id}/sales-trend"

  - name: TenantUser
    description: "Retail tenant acting as itself; X-User-ID is the Tenant.id of the tenant on the lease."
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /retail/sales-reports/{id}/submit"
      - "POST /retail/sales-reports/{id}/dispute"
      - "POST /retail/sales-reports/{id}/amend"
      - "POST /retail/co-tenancy-events/{id}/elect-termination"
      - "POST /retail/kick-out-clauses/{id}/exercise"
    shared_operations:
      - "POST /retail/charges/{id}/payments (with LeaseAdministrator)"
      - "GET reads scoped to its own leases, reports, charges and clauses"

  - name: Auditor
    description: "Independent sales auditor: opens audits, issues findings, settles and rescinds them."
    identity: opaque
    exclusive_operations:
      - "POST /retail/audits"
      - "POST /retail/audits/{id}/findings"
      - "POST /retail/audits/{id}/settle"
      - "POST /retail/audits/{id}/rescind"
    shared_operations:
      - "GET reads on centers, tenants, leases, lease years, reports, exclusions, charges, ledger entries and audits"

  - name: OwnershipAnalyst
    description: "Ownership-side analyst; reads portfolio data and is the only role permitted to pull the sales trend report."
    identity: opaque
    exclusive_operations:
      - "GET /retail/centers/{id}/sales-trend"
    shared_operations:
      - "GET reads on centers, tenants, leases, lease years, reports, charges, clauses and events"
