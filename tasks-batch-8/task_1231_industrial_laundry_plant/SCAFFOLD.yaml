# =============================================================================
# Task 1231 — Industrial Laundry Plant (healthcare/hospitality linens)
# =============================================================================

scenario: |
  1231. Industrial Laundry Plant (healthcare/hospitality linens): route stop &
  soiled pickup weight, sort/classification & reject (stain/tear) rate, wash
  formula by classification & hygienically-clean testing, ironer/folder
  throughput & linen loss, customer par level & rental vs COG billing, garment
  tracking chip & lost-item charge, delivery discrepancy credit, energy/water
  utility surcharge

domain_name: industrial-laundry-plant
api_prefix: ""

# =============================================================================
# Complexity profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Response envelope (§1.0 — FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant name" }
      - { name: reject_rate_alert_pct, type: number, source: input, description: "Reject rate percent at/above which a SortBatch raises alert (>= comparison, e.g. 8.0 means 8.0%)" }
      - { name: par_shortage_alert_pieces, type: integer, source: input, description: "Pieces of par shortfall at which a Delivery raises shortage alert (>= comparison)" }
      - { name: utility_baseline_kwh_per_lb, type: number, source: input, description: "Baseline kWh per lb of clean linen for utility surcharge" }
      - { name: utility_baseline_gal_per_lb, type: number, source: input, description: "Baseline gallons per lb of clean linen for utility surcharge" }

  - name: Customer
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: name, type: string, source: input, description: "Customer name" }
      - { name: customer_kind, type: enum, source: input, description: "HEALTHCARE | HOSPITALITY", constraints: "HEALTHCARE | HOSPITALITY" }
      - { name: billing_mode, type: enum, source: input, description: "RENTAL | COG — COG = customer-owned goods, billed per lb washed; RENTAL = plant owns linen, billed per piece-day", constraints: "RENTAL | COG" }
      - { name: chip_tracking_enabled, type: boolean, source: input, description: "Whether garments for this customer carry RFID chips" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding invoice balance before new deliveries are blocked" }
      - { name: account_balance_cents, type: integer, source: computed, default: 0, description: "Sum of unpaid invoice totals minus credits; positive = customer owes plant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE | SUSPENDED" }

  - name: LinenCategory
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: code, type: string, source: input, description: "Category code, e.g. SHEET_KING, TOWEL_BATH, GOWN_ISO; unique per plant" }
      - { name: piece_weight_lb, type: number, source: input, description: "Average piece weight in pounds" }
      - { name: wash_formula_code, type: enum, source: input, description: "Formula identifier for washing", constraints: "WF_STANDARD | WF_THERMAL_DISINFECT | WF_CHEM_DISINFECT | WF_HEAVY_SOIL" }
      - { name: hygienic_test_required, type: boolean, source: input, description: "Whether wash loads of this category must pass hygienic testing" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Charge to customer when a piece of this category is lost (rental) or condemned (COG)" }
      - { name: cog_wash_rate_cents_per_lb, type: integer, source: input, description: "COG wash rate, cents per lb, standard tier" }

  - name: CustomerParLevel
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: category_id, type: string, source: input, description: "FK -> LinenCategory.id" }
      - { name: par_pieces, type: integer, source: input, description: "Required number of pieces at customer site" }
      - { name: current_on_site_pieces, type: integer, source: computed, default: 0, description: "Pieces currently at customer site (derived from deliveries and soiled pickups)" }

  - name: Route
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id" }
      - { name: service_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the route runs" }
      - { name: driver_name, type: string, source: input, description: "Assigned driver name" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | COMPLETED | RECONCILED", constraints: "PLANNED | DISPATCHED | COMPLETED | RECONCILED" }

  - name: RouteStop
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: sequence_index, type: integer, source: input, description: "Order of stop within route; >= 1" }
      - { name: declared_soiled_weight_lb, type: number, source: input, description: "Customer-declared soiled weight at stop" }
      - { name: actual_soiled_weight_lb, type: number, source: computed, description: "Sum of received cart scale weights" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ARRIVED | PICKED_UP | DELIVERED | CLOSED | DISPUTED", constraints: "SCHEDULED | ARRIVED | PICKED_UP | DELIVERED | CLOSED | DISPUTED" }

  - name: SoiledCart
    parent: RouteStop
    common_fields: true
    fields:
      - { name: stop_id, type: string, source: system, description: "FK -> RouteStop.id" }
      - { name: cart_tag, type: string, source: input, description: "Physical cart tag identifier; unique per stop" }
      - { name: scale_weight_lb, type: number, source: input, description: "Scale weight at plant receiving gate" }
      - { name: status, type: enum, source: system, description: "DECLARED | RECEIVED | SORTED | VOIDED", constraints: "DECLARED | RECEIVED | SORTED | VOIDED" }

  - name: SortBatch
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id" }
      - { name: stop_id, type: string, source: input, description: "FK -> RouteStop.id — the stop whose carts are being sorted" }
      - { name: total_sorted_pieces, type: integer, source: computed, default: 0, description: "Total SortItem rows posted (accepted + rejected)" }
      - { name: accepted_pieces, type: integer, source: computed, default: 0, description: "SortItems with disposition ACCEPTED" }
      - { name: rejected_pieces, type: integer, source: computed, default: 0, description: "SortItems with disposition REJECTED" }
      - { name: reject_rate_pct, type: number, source: computed, default: 0, description: "= rejected_pieces / total_sorted_pieces * 100, half-up to 2 decimals; 0 when total_sorted_pieces == 0" }
      - { name: alert_raised, type: boolean, source: computed, default: false, description: "true iff reject_rate_pct >= plant.reject_rate_alert_pct at lock time" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | POSTED | VOIDED", constraints: "OPEN | LOCKED | POSTED | VOIDED" }

  - name: SortItem
    parent: SortBatch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> SortBatch.id" }
      - { name: category_id, type: string, source: input, description: "FK -> LinenCategory.id" }
      - { name: pieces, type: integer, source: input, description: "Number of pieces in this classification row; >= 1" }
      - { name: disposition, type: enum, source: input, description: "ACCEPTED | REJECTED", constraints: "ACCEPTED | REJECTED" }
      - { name: reject_reason, type: enum, source: input, description: "STAIN | TEAR | CONTAMINATION — required iff disposition=REJECTED, forbidden otherwise", constraints: "STAIN | TEAR | CONTAMINATION" }

  - name: WashLoad
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id" }
      - { name: batch_id, type: string, source: input, description: "FK -> SortBatch.id — the sort batch whose accepted pieces feed this load" }
      - { name: category_id, type: string, source: input, description: "FK -> LinenCategory.id — single category per load" }
      - { name: machine_id, type: string, source: input, description: "Identifier of the washing machine resource" }
      - { name: scheduled_start, type: string, source: input, description: "ISO 8601 datetime the load occupies the machine (start)" }
      - { name: scheduled_end, type: string, source: input, description: "ISO 8601 datetime the load releases the machine (end); must be > scheduled_start" }
      - { name: formula_code, type: enum, source: system, description: "Resolved formula; initially LinenCategory.wash_formula_code; may be escalated on rewash", constraints: "WF_STANDARD | WF_THERMAL_DISINFECT | WF_CHEM_DISINFECT | WF_HEAVY_SOIL" }
      - { name: rewash_count, type: integer, source: system, default: 0, description: "Number of times this load has been rewashed (incremented on each REWASH)" }
      - { name: hygienic_test_result, type: enum, source: system, description: "PENDING | PASS | FAIL", constraints: "PENDING | PASS | FAIL" }
      - { name: clean_weight_lb, type: number, source: computed, description: "Accepted pieces * LinenCategory.piece_weight_lb, 2-decimal half-up" }
      - { name: status, type: enum, source: system, description: "STAGED | RUNNING | AWAITING_TEST | TESTED_PASS | TESTED_FAIL | REWASH_PENDING | FINISHED | CANCELLED", constraints: "STAGED | RUNNING | AWAITING_TEST | TESTED_PASS | TESTED_FAIL | REWASH_PENDING | FINISHED | CANCELLED" }

  - name: FinishRun
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id" }
      - { name: wash_load_id, type: string, source: input, description: "FK -> WashLoad.id — the load being finished" }
      - { name: line_id, type: string, source: input, description: "Identifier of the ironer/folder line resource" }
      - { name: scheduled_start, type: string, source: input, description: "ISO 8601 datetime the run occupies the line (start)" }
      - { name: scheduled_end, type: string, source: input, description: "ISO 8601 datetime the run releases the line (end); must be > scheduled_start" }
      - { name: pieces_in, type: integer, source: computed, description: "Wash load accepted pieces at the time this run is created" }
      - { name: pieces_out, type: integer, source: input, description: "Pieces successfully finished (set on tally)" }
      - { name: linen_loss_pieces, type: integer, source: computed, description: "= pieces_in - pieces_out at tally; must be >= 0" }
      - { name: throughput_pieces_per_hour, type: number, source: computed, description: "= pieces_out / ((scheduled_end - scheduled_start) in hours), 2-decimal half-up, set at tally" }
      - { name: status, type: enum, source: system, description: "QUEUED | TALLIED | POSTED | VOIDED", constraints: "QUEUED | TALLIED | POSTED | VOIDED" }

  - name: Garment
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: category_id, type: string, source: input, description: "FK -> LinenCategory.id" }
      - { name: chip_code, type: string, source: input, description: "RFID chip code; globally unique" }
      - { name: state, type: enum, source: system, description: "AT_CUSTOMER | IN_TRANSIT_SOILED | SOILED_RECEIVED | WASHING | CLEAN_STOCK | LOADED_OUT | LOST", constraints: "AT_CUSTOMER | IN_TRANSIT_SOILED | SOILED_RECEIVED | WASHING | CLEAN_STOCK | LOADED_OUT | LOST" }
      - { name: lost_at, type: string, source: system, description: "ISO 8601 timestamp when marked LOST; null otherwise" }

  - name: Delivery
    parent: RouteStop
    common_fields: true
    fields:
      - { name: stop_id, type: string, source: system, description: "FK -> RouteStop.id" }
      - { name: category_id, type: string, source: input, description: "FK -> LinenCategory.id — one delivery row per category per stop" }
      - { name: pieces_promised, type: integer, source: input, description: "Pieces the plant promised to deliver" }
      - { name: pieces_delivered, type: integer, source: input, description: "Pieces physically delivered (recorded by driver at drop-off)" }
      - { name: shortfall_pieces, type: integer, source: computed, description: "= max(0, pieces_promised - pieces_delivered)" }
      - { name: overage_pieces, type: integer, source: computed, description: "= max(0, pieces_delivered - pieces_promised)" }
      - { name: status, type: enum, source: system, description: "MANIFESTED | DELIVERED | CONFIRMED | DISPUTED | SETTLED", constraints: "MANIFESTED | DELIVERED | CONFIRMED | DISPUTED | SETTLED" }

  - name: Discrepancy
    parent: Delivery
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: system, description: "FK -> Delivery.id" }
      - { name: claimed_shortfall_pieces, type: integer, source: input, description: "Customer-claimed shortage; >= 1" }
      - { name: approved_shortfall_pieces, type: integer, source: computed, description: "Approved shortage after review; <= claimed_shortfall_pieces" }
      - { name: credit_cents, type: integer, source: computed, description: "Credit = approved_shortfall_pieces * LinenCategory.replacement_cost_cents * CREDIT_RATE_PCT / 100, rounded half-up to whole cents" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | REJECTED | CREDITED", constraints: "FILED | UNDER_REVIEW | APPROVED | REJECTED | CREDITED" }

  - name: Invoice
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: billing_period_start, type: string, source: input, description: "ISO date, inclusive" }
      - { name: billing_period_end, type: string, source: input, description: "ISO date, exclusive; must be > billing_period_start" }
      - { name: linen_charges_cents, type: integer, source: computed, default: 0, description: "Sum of rental or COG line charges, whole cents" }
      - { name: lost_item_charges_cents, type: integer, source: computed, default: 0, description: "Sum of lost-garment charges, whole cents" }
      - { name: utility_surcharge_cents, type: integer, source: computed, default: 0, description: "Utility surcharge, whole cents" }
      - { name: credits_cents, type: integer, source: computed, default: 0, description: "Sum of discrepancy credits applied, whole cents" }
      - { name: total_due_cents, type: integer, source: computed, description: "= linen_charges_cents + lost_item_charges_cents + utility_surcharge_cents - credits_cents; floor 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID", constraints: "DRAFT | ISSUED | PAID | VOID" }

  - name: UtilityReading
    parent: Plant
    common_fields: false
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id" }
      - { name: period_month, type: string, source: input, description: "YYYY-MM the reading covers; unique per plant" }
      - { name: kwh_used, type: number, source: input, description: "Total kWh consumed in the month" }
      - { name: gallons_used, type: number, source: input, description: "Total gallons of water consumed in the month" }
      - { name: clean_lbs_processed, type: number, source: input, description: "Total lbs of clean linen produced in the month" }
      - { name: kwh_rate_cents, type: integer, source: input, description: "Utility rate for the month, cents per kWh" }
      - { name: gallon_rate_cents, type: integer, source: input, description: "Water rate for the month, cents per gallon" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{id}/suspend"
        actor: PlantAdmin
        preconditions: []
        side_effects: ["invoice issue for this customer is blocked while SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customers/{id}/resume"
        actor: PlantAdmin
        preconditions: []
        side_effects: []

  - entity: Route
    initial_state: PLANNED
    terminal_states: [RECONCILED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: RouteDriver
        preconditions:
          - "Route has at least one RouteStop in SCHEDULED state (ERR_ROUTE_HAS_NO_STOPS)"
        side_effects: []
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /routes/{id}/complete"
        actor: RouteDriver
        preconditions:
          - "Every RouteStop of the route is in {PICKED_UP, DELIVERED, CLOSED, DISPUTED} (ERR_ROUTE_STOPS_OPEN)"
        side_effects: []
      - from: COMPLETED
        to: RECONCILED
        trigger: "POST /routes/{id}/reconcile"
        actor: RouteDriver
        preconditions:
          - "Every RouteStop is in {CLOSED, DISPUTED} (ERR_ROUTE_STOPS_UNRESOLVED)"
          - "No Discrepancy on any Delivery of any stop of the route is in {FILED, UNDER_REVIEW, APPROVED} (ERR_ROUTE_DISCREPANCIES_OPEN)"
        side_effects: []

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /stops/{id}/arrive"
        actor: RouteDriver
        preconditions:
          - "Parent Route is in DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
        side_effects: []
      - from: ARRIVED
        to: PICKED_UP
        trigger: "POST /stops/{id}/pickup"
        actor: RouteDriver
        preconditions:
          - "payload.carts is non-empty (ERR_EMPTY_PICKUP)"
          - "each cart_tag unique within the stop (ERR_DUPLICATE_CART_TAG)"
        side_effects:
          - "For each payload cart, create SoiledCart(status=DECLARED, scale_weight_lb from payload)"
          - "For chip-tracking customers: every Garment of this customer in AT_CUSTOMER transitions to IN_TRANSIT_SOILED"
      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /stops/{id}/deliveries (creates Delivery in MANIFESTED) followed by POST /deliveries/{id}/mark-delivered"
        actor: RouteDriver
        preconditions:
          - "All SoiledCarts of the stop are in {RECEIVED, SORTED, VOIDED} (ERR_CARTS_PENDING)"
        side_effects:
          - "Stop transitions to DELIVERED when the last Delivery of the stop transitions out of MANIFESTED"
      - from: DELIVERED
        to: CLOSED
        trigger: "system (automatic when every Delivery of the stop is in {CONFIRMED, SETTLED})"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: DISPUTED
        trigger: "system (automatic when any Delivery of the stop enters DISPUTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: CLOSED
        trigger: "system (automatic when every Delivery of the stop is in {CONFIRMED, SETTLED} and at least one Delivery was SETTLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SoiledCart
    initial_state: DECLARED
    terminal_states: [SORTED, VOIDED]
    transitions:
      - from: DECLARED
        to: RECEIVED
        trigger: "POST /carts/{id}/receive"
        actor: PlantOperator
        preconditions:
          - "Parent RouteStop is in {PICKED_UP, DELIVERED, DISPUTED} (ERR_STOP_NOT_PICKED_UP)"
        side_effects:
          - "RouteStop.actual_soiled_weight_lb recomputed = sum of scale_weight_lb over carts in {RECEIVED, SORTED}"
          - "For chip-tracking customers: Garments of this customer in IN_TRANSIT_SOILED transition to SOILED_RECEIVED"
      - from: RECEIVED
        to: SORTED
        trigger: "system (automatic when a SortBatch containing this cart's stop transitions to POSTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DECLARED
        to: VOIDED
        trigger: "POST /carts/{id}/void"
        actor: PlantOperator
        preconditions:
          - "Cart is in DECLARED (ERR_CART_NOT_VOIDABLE)"
        side_effects: []

  - entity: SortBatch
    initial_state: OPEN
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /sort-batches/{id}/lock"
        actor: PlantOperator
        preconditions:
          - "total_sorted_pieces >= 1 (ERR_EMPTY_SORT_BATCH)"
          - "Parent RouteStop is in {PICKED_UP, DELIVERED, DISPUTED} (ERR_STOP_NOT_PICKED_UP)"
        side_effects:
          - "reject_rate_pct recomputed; alert_raised = (reject_rate_pct >= plant.reject_rate_alert_pct)"
      - from: LOCKED
        to: POSTED
        trigger: "POST /sort-batches/{id}/post"
        actor: PlantOperator
        preconditions: []
        side_effects:
          - "Every SoiledCart of the stop in RECEIVED transitions to SORTED"
          - "CustomerParLevel.current_on_site_pieces decremented by accepted pieces per category (soiled leaves site)"
      - from: OPEN
        to: VOIDED
        trigger: "POST /sort-batches/{id}/void"
        actor: PlantOperator
        preconditions:
          - "No WashLoad exists for this batch (ERR_BATCH_HAS_WASH_LOADS)"
        side_effects:
          - "All SortItems of the batch are discarded (counts zeroed on batch)"
      - from: LOCKED
        to: OPEN
        trigger: "POST /sort-batches/{id}/unlock"
        actor: PlantOperator
        preconditions:
          - "No WashLoad exists for this batch (ERR_BATCH_HAS_WASH_LOADS)"
        side_effects:
          - "alert_raised reset to false; reject_rate_pct reset to 0"

  - entity: WashLoad
    initial_state: STAGED
    terminal_states: [FINISHED, CANCELLED]
    transitions:
      - from: STAGED
        to: RUNNING
        trigger: "POST /wash-loads/{id}/start"
        actor: PlantOperator
        preconditions:
          - "SortBatch is in {LOCKED, POSTED} (ERR_BATCH_NOT_LOCKED)"
          - "No other WashLoad on the same machine_id has status in {STAGED, RUNNING, AWAITING_TEST, REWASH_PENDING} with overlapping half-open interval [scheduled_start, scheduled_end) (ERR_MACHINE_TIME_OVERLAP)"
        side_effects: []
      - from: RUNNING
        to: AWAITING_TEST
        trigger: "POST /wash-loads/{id}/finish-cycle"
        actor: PlantOperator
        preconditions: []
        side_effects: []
      - from: AWAITING_TEST
        to: TESTED_PASS
        trigger: "POST /wash-loads/{id}/record-test with outcome=PASS"
        actor: PlantOperator
        preconditions:
          - "LinenCategory.hygienic_test_required must be true, otherwise load skips testing (use /bypass-test) (ERR_TEST_NOT_REQUIRED)"
        side_effects: []
      - from: AWAITING_TEST
        to: TESTED_FAIL
        trigger: "POST /wash-loads/{id}/record-test with outcome=FAIL"
        actor: PlantOperator
        preconditions:
          - "LinenCategory.hygienic_test_required must be true (ERR_TEST_NOT_REQUIRED)"
        side_effects:
          - "If category is healthcare-critical (customer_kind=HEALTHCARE on the originating stop's customer), plant.status remains OPEN but an alert flag on the load is set (rewash_required semantics carried by state REWASH_PENDING)"
      - from: TESTED_FAIL
        to: REWASH_PENDING
        trigger: "POST /wash-loads/{id}/request-rewash"
        actor: PlantOperator
        preconditions:
          - "rewash_count < MAX_REWASH_COUNT (ERR_REWASH_LIMIT_REACHED)"
        side_effects:
          - "rewash_count += 1"
          - "formula_code escalated one level: WF_STANDARD→WF_HEAVY_SOIL, WF_CHEM_DISINFECT→WF_THERMAL_DISINFECT, others unchanged"
      - from: REWASH_PENDING
        to: RUNNING
        trigger: "POST /wash-loads/{id}/start"
        actor: PlantOperator
        preconditions:
          - "Same machine overlap rule as STAGED→RUNNING (ERR_MACHINE_TIME_OVERLAP)"
        side_effects: []
      - from: TESTED_PASS
        to: FINISHED
        trigger: "POST /wash-loads/{id}/unload"
        actor: PlantOperator
        preconditions: []
        side_effects:
          - "clean_weight_lb computed"
          - "For chip-tracking customers: Garments of this load's category/customer in WASHING transition to CLEAN_STOCK"
      - from: AWAITING_TEST
        to: TESTED_PASS
        trigger: "POST /wash-loads/{id}/bypass-test"
        actor: PlantOperator
        preconditions:
          - "LinenCategory.hygienic_test_required must be false (ERR_TEST_REQUIRED)"
        side_effects: []
      - from: STAGED
        to: CANCELLED
        trigger: "POST /wash-loads/{id}/cancel"
        actor: PlantOperator
        preconditions: []
        side_effects: []
      - from: REWASH_PENDING
        to: CANCELLED
        trigger: "POST /wash-loads/{id}/cancel"
        actor: PlantOperator
        preconditions: []
        side_effects: []

  - entity: FinishRun
    initial_state: QUEUED
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: QUEUED
        to: TALLIED
        trigger: "POST /finish-runs/{id}/tally"
        actor: PlantOperator
        preconditions:
          - "payload.pieces_out <= pieces_in (ERR_TALLY_EXCEEDS_INPUT)"
          - "No other FinishRun on the same line_id has status in {QUEUED, TALLIED} whose closed interval [scheduled_start - BUFFER_MINUTES, scheduled_end + BUFFER_MINUTES] intersects this run's buffered interval (ERR_LINE_TIME_OVERLAP)"
        side_effects:
          - "linen_loss_pieces = pieces_in - pieces_out"
          - "throughput_pieces_per_hour computed"
      - from: TALLIED
        to: POSTED
        trigger: "POST /finish-runs/{id}/post"
        actor: PlantOperator
        preconditions: []
        side_effects:
          - "pieces_out added to clean stock for (customer of originating stop, category)"
          - "CustomerParLevel.current_on_site_pieces is NOT modified here (modification happens on Delivery.mark-delivered)"
          - "linen_loss_pieces accumulate on Plant-level loss ledger (computed read)"
      - from: QUEUED
        to: VOIDED
        trigger: "POST /finish-runs/{id}/void"
        actor: PlantOperator
        preconditions: []
        side_effects: []

  - entity: Garment
    initial_state: AT_CUSTOMER
    terminal_states: [LOST]
    transitions:
      - from: AT_CUSTOMER
        to: IN_TRANSIT_SOILED
        trigger: "system (cascade from RouteStop pickup for chip-tracking customer)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT_SOILED
        to: SOILED_RECEIVED
        trigger: "system (cascade from SoiledCart receive)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SOILED_RECEIVED
        to: WASHING
        trigger: "system (cascade when a WashLoad containing this garment's category for this customer transitions STAGED→RUNNING or REWASH_PENDING→RUNNING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WASHING
        to: CLEAN_STOCK
        trigger: "system (cascade from WashLoad unload)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEAN_STOCK
        to: LOADED_OUT
        trigger: "POST /garments/{id}/load-out"
        actor: PlantOperator
        preconditions: []
        side_effects: []
      - from: LOADED_OUT
        to: AT_CUSTOMER
        trigger: "system (cascade when a Delivery containing this garment's category for this customer transitions to DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_CUSTOMER
        to: LOST
        trigger: "POST /garments/{id}/mark-lost"
        actor: CustomerServiceRep
        preconditions:
          - "Customer.chip_tracking_enabled is true (ERR_CHIP_TRACKING_DISABLED)"
        side_effects:
          - "lost_at stamped"
          - "A lost-item charge of LinenCategory.replacement_cost_cents is queued onto the customer's next DRAFT Invoice.lost_item_charges_cents"
      - from: IN_TRANSIT_SOILED
        to: LOST
        trigger: "POST /garments/{id}/mark-lost"
        actor: CustomerServiceRep
        preconditions:
          - "Customer.chip_tracking_enabled is true (ERR_CHIP_TRACKING_DISABLED)"
        side_effects:
          - "lost_at stamped"
          - "Lost-item charge queued as above"
      - from: LOADED_OUT
        to: LOST
        trigger: "POST /garments/{id}/mark-lost"
        actor: CustomerServiceRep
        preconditions:
          - "Customer.chip_tracking_enabled is true (ERR_CHIP_TRACKING_DISABLED)"
        side_effects:
          - "lost_at stamped"
          - "Lost-item charge queued as above"

  - entity: Delivery
    initial_state: MANIFESTED
    terminal_states: [CONFIRMED, SETTLED]
    transitions:
      - from: MANIFESTED
        to: DELIVERED
        trigger: "POST /deliveries/{id}/mark-delivered"
        actor: RouteDriver
        preconditions:
          - "Parent RouteStop is in PICKED_UP (ERR_STOP_NOT_PICKED_UP)"
          - "Customer.account_balance_cents <= Customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "pieces_delivered recorded from payload"
          - "shortfall_pieces / overage_pieces computed"
          - "CustomerParLevel.current_on_site_pieces incremented by pieces_delivered for this category"
          - "For chip-tracking customers: Garments of this customer/category in LOADED_OUT transition to AT_CUSTOMER (up to pieces_delivered garments, chosen by earliest garment.created_at; tie-break: chip_code ASC — chip_code is a deterministic business key, not a random UUID)"
          - "If this is the last MANIFESTED Delivery of the stop, parent RouteStop → DELIVERED"
      - from: DELIVERED
        to: CONFIRMED
        trigger: "POST /deliveries/{id}/confirm"
        actor: CustomerContact
        preconditions:
          - "Acting CustomerContact must own the Customer on the parent stop (ERR_FORBIDDEN)"
        side_effects:
          - "If every Delivery of the stop now in {CONFIRMED, SETTLED}: RouteStop → CLOSED"
      - from: DELIVERED
        to: DISPUTED
        trigger: "POST /deliveries/{id}/disputes"
        actor: CustomerContact
        preconditions:
          - "Acting CustomerContact must own the Customer on the parent stop (ERR_FORBIDDEN)"
          - "shortfall_pieces >= 1 (ERR_NO_SHORTAGE)"
        side_effects:
          - "Creates Discrepancy(status=FILED, claimed_shortfall_pieces from payload)"
          - "Parent RouteStop → DISPUTED if not already"
      - from: DISPUTED
        to: SETTLED
        trigger: "system (automatic when all Discrepancies of the Delivery reach {CREDITED, REJECTED})"
        actor: system
        preconditions: []
        side_effects:
          - "If every Delivery of the stop now in {CONFIRMED, SETTLED}: RouteStop → CLOSED"

  - entity: Discrepancy
    initial_state: FILED
    terminal_states: [REJECTED, CREDITED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /discrepancies/{id}/start-review"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /discrepancies/{id}/approve"
        actor: CustomerServiceRep
        preconditions:
          - "payload.approved_shortfall_pieces >= 1 and <= claimed_shortfall_pieces and <= parent Delivery.shortfall_pieces (ERR_INVALID_APPROVED_QUANTITY)"
        side_effects:
          - "credit_cents computed"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /discrepancies/{id}/reject"
        actor: CustomerServiceRep
        preconditions: []
        side_effects:
          - "If all Discrepancies of the parent Delivery are terminal: Delivery → SETTLED"
      - from: APPROVED
        to: CREDITED
        trigger: "POST /discrepancies/{id}/apply-credit"
        actor: BillingClerk
        preconditions:
          - "Target Invoice (payload.invoice_id) belongs to the same Customer as the Discrepancy's Delivery's stop (ERR_INVOICE_CUSTOMER_MISMATCH)"
          - "Target Invoice.status is DRAFT (ERR_INVOICE_NOT_DRAFT)"
        side_effects:
          - "Invoice.credits_cents += credit_cents"
          - "Invoice.total_due_cents recomputed"
          - "Customer.account_balance_cents -= credit_cents"
          - "If all Discrepancies of the parent Delivery are terminal: Delivery → SETTLED"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "Customer.status is ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "Customer.account_balance_cents + Invoice.total_due_cents <= Customer.credit_limit_cents OR total_due_cents == 0 (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Customer.account_balance_cents += total_due_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/mark-paid"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "Customer.account_balance_cents -= total_due_cents"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "No Discrepancy in CREDITED references this invoice (ERR_INVOICE_HAS_CREDITS)"
        side_effects:
          - "Any pending lost-item charge queue entries targeted at this invoice are released back to the unbilled queue"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: invoice-issue-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /invoices/{id}/issue"
    occ_field: "expected_customer_version"
    description: |
      Issuing an Invoice against a Customer whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just posted a utility surcharge or applied a credit
      (both of which mutate Customer.account_balance_cents and bump
      Customer.version), so the issuer's view of the credit-limit headroom is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: delivery-mark-delivered-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /deliveries/{id}/mark-delivered"
    occ_field: "expected_customer_version"
    description: |
      Marking a Delivery delivered against a Customer whose version has
      advanced since the driver last observed the customer is rejected, since
      account_balance_cents (and therefore the credit-limit precondition) may
      have changed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pickup_weight_variance
    trigger: "SoiledCart receive (each cart receive recomputes)"
    algorithm: aggregation
    formula: |
      actual_soiled_weight_lb(stop) = sum(scale_weight_lb for carts of stop with status in {RECEIVED, SORTED})
      variance_lb = actual_soiled_weight_lb - declared_soiled_weight_lb
      variance_pct = if declared_soiled_weight_lb > 0 then variance_lb / declared_soiled_weight_lb * 100 else 0
    input_set: "SoiledCarts of one RouteStop in {RECEIVED, SORTED}; DECLARED and VOIDED excluded"
    precision: "2 decimal places, round_half_up"

  - name: reject_rate
    trigger: "SortBatch lock"
    algorithm: aggregation
    formula: |
      if total_sorted_pieces == 0: reject_rate_pct = 0
      else: reject_rate_pct = round_half_up(rejected_pieces / total_sorted_pieces * 100, 2)
      alert_raised = (reject_rate_pct >= plant.reject_rate_alert_pct)
    input_set: "All SortItems of the batch (both ACCEPTED and REJECTED)"
    precision: "2 decimal places, round_half_up"
    constants:
      COMPARISON: "gte (>=) — a rate exactly equal to the threshold raises the alert"

  - name: clean_weight_lb
    trigger: "WashLoad unload"
    algorithm: aggregation
    formula: |
      accepted = sum(SortItem.pieces for batch items with disposition=ACCEPTED and category_id == load.category_id)
      clean_weight_lb = round_half_up(accepted * LinenCategory.piece_weight_lb, 2)
    input_set: "SortItems of the load's batch with disposition=ACCEPTED and matching category"
    precision: "2 decimal places, round_half_up"

  - name: finish_throughput
    trigger: "FinishRun tally"
    algorithm: aggregation
    formula: |
      linen_loss_pieces = pieces_in - pieces_out   (>= 0 enforced)
      hours = (scheduled_end - scheduled_start) in seconds / 3600
      throughput_pieces_per_hour = if hours > 0 then round_half_up(pieces_out / hours, 2) else 0
    precision: "2 decimal places, round_half_up"

  - name: par_shortfall
    trigger: "Delivery mark-delivered"
    algorithm: aggregation
    formula: |
      For the (customer, category) of the delivery:
        new_on_site = CustomerParLevel.current_on_site_pieces + pieces_delivered
        par_shortfall_pieces = max(0, CustomerParLevel.par_pieces - new_on_site)
      A par-shortage alert is raised iff par_shortfall_pieces >= plant.par_shortage_alert_pieces
      AND par_shortage_alert_pieces > 0. (A zero-threshold plant suppresses alerts entirely.)
    input_set: "The single (customer, category) par row affected"
    constants:
      COMPARISON: "gte (>=)"

  - name: cog_linen_charge
    trigger: "Invoice generation for a COG customer"
    algorithm: tiered_pricing
    formula: |
      For each LinenCategory, for the billing period [billing_period_start, billing_period_end):
        lbs = sum over WashLoads (status=FINISHED, unloaded_at in period, originating customer = this customer,
              category = this category) of clean_weight_lb
        gross_cents_cat = round_half_up(lbs * LinenCategory.cog_wash_rate_cents_per_lb, 0)
      volume_lbs_total = sum of lbs over all categories
      discount_pct = TIERED(volume_lbs_total):
        if volume_lbs_total >= TIER2_LBS: TIER2_PCT
        elif volume_lbs_total >= TIER1_LBS: TIER1_PCT
        else: 0
      # ROUNDING ORDER IS PINNED: discount is applied per category on the already-rounded
      # gross_cents_cat, THEN summed. (Alternative "sum then discount" is forbidden.)
      net_cents_cat = round_half_up(gross_cents_cat * (100 - discount_pct) / 100, 0)
      linen_charges_cents = sum(net_cents_cat)
    input_set: "WashLoads with status=FINISHED and unload timestamp within [start, end) for this customer"
    constants:
      TIER1_LBS: 5000
      TIER1_PCT: 3
      TIER2_LBS: 20000
      TIER2_PCT: 7
    precision: "whole cents, round_half_up at each pinned step"
    variants:
      - name: cog_actual
        when: "billing customer.billing_mode == COG"
        difference: "uses realized clean_weight_lb from FINISHED loads"
      - name: cog_estimated
        when: "preview endpoint GET /customers/{id}/billing-preview"
        difference: "includes additionally loads in {STAGED, RUNNING, AWAITING_TEST, TESTED_PASS, REWASH_PENDING} using projected clean_weight_lb (= accepted pieces * piece_weight_lb), so preview total >= actual total"

  - name: rental_linen_charge
    trigger: "Invoice generation for a RENTAL customer"
    algorithm: forward_looking
    formula: |
      days = (billing_period_end - billing_period_start) in whole days
      For each CustomerParLevel row of the customer:
        daily_cents = LinenCategory.replacement_cost_cents * RENTAL_RATE_PCT / 100
        line_cents_cat = round_half_up(par_pieces * daily_cents * days, 0)
      linen_charges_cents = sum(line_cents_cat)
    input_set: "CustomerParLevel rows of the customer (par_pieces as of invoice generation)"
    constants:
      RENTAL_RATE_PCT: 2   # 2% of replacement cost per piece-day
    precision: "whole cents, round_half_up"
    variants:
      - name: rental_actual
        when: "billing customer.billing_mode == RENTAL"
        difference: "uses current par_pieces snapshot"
      - name: rental_whatif
        when: "preview endpoint with payload.override_par_pieces"
        difference: "uses overridden par_pieces for projection without persisting"

  - name: utility_surcharge
    trigger: "Invoice generation (estimated variant) and POST /plants/{id}/utility-readings (actual variant + true-up)"
    algorithm: tiered_pricing
    formula: |
      # ACTUAL variant: reading exists for the period's month
      actual_kwh_cost_cents    = reading.kwh_used * reading.kwh_rate_cents
      actual_water_cost_cents  = reading.gallons_used * reading.gallon_rate_cents
      actual_total_cents       = actual_kwh_cost_cents + actual_water_cost_cents
      baseline_kwh  = reading.clean_lbs_processed * plant.utility_baseline_kwh_per_lb
      baseline_gal  = reading.clean_lbs_processed * plant.utility_baseline_gal_per_lb
      baseline_cost_cents = round_half_up(baseline_kwh * reading.kwh_rate_cents + baseline_gal * reading.gallon_rate_cents, 0)
      excess_cents = max(0, actual_total_cents - baseline_cost_cents)
      # Tiered pass-through of the excess, allocated to this invoice by customer share:
      share_pct = round_half_up(customer_period_clean_lbs / plant_period_clean_lbs * 100, 4)
      tiered_excess = min(excess_cents, TIER_A_CAP) * TIER_A_PCT/100
                    + max(0, min(excess_cents, TIER_B_CAP) - TIER_A_CAP) * TIER_B_PCT/100
                    + max(0, excess_cents - TIER_B_CAP) * TIER_C_PCT/100
      surcharge_cents_actual = round_half_up(tiered_excess * share_pct / 100, 0)
    input_set: "UtilityReading of the plant for the invoice month; customer clean lbs = sum of clean_weight_lb over the customer's FINISHED WashLoads in the month; plant clean lbs = reading.clean_lbs_processed"
    constants:
      TIER_A_CAP: 100000   # cents
      TIER_A_PCT: 50
      TIER_B_CAP: 500000
      TIER_B_PCT: 75
      TIER_C_PCT: 100
    precision: "whole cents, round_half_up"
    variants:
      - name: estimated
        when: "no UtilityReading posted yet for the invoice month"
        difference: |
          surcharge_cents_estimated = round_half_up(avg_tiered_excess * share_pct / 100, 0), where
          avg_tiered_excess = round_half_up(mean of tiered_excess over the trailing window, 0);
          trailing window = the 3 calendar months immediately preceding the invoice month that have
          UtilityReadings (fewer than 3 → average over available; none → surcharge = 0); and
          share_pct = round_half_up(customer_period_clean_lbs / plant_ref_clean_lbs * 100, 4) with
          customer_period_clean_lbs = sum of clean_weight_lb over the customer's FINISHED WashLoads
          whose unload falls in the invoice month, and plant_ref_clean_lbs = clean_lbs_processed of
          the most recent UtilityReading in the trailing window (the latest month with a reading).
      - name: actual
        when: "UtilityReading exists for the invoice month"
        difference: "computed from that month's actuals; an invoice generated in estimated mode is trued-up when the reading posts (delta applied to the next DRAFT invoice; if none, a new DRAFT invoice is created holding only the delta)"

  - name: rewash_escalation
    trigger: "WashLoad request-rewash"
    algorithm: threshold
    formula: |
      if rewash_count >= MAX_REWASH_COUNT: reject with ERR_REWASH_LIMIT_REACHED
      rewash_count += 1
      formula escalation ladder: WF_STANDARD → WF_HEAVY_SOIL;
        WF_CHEM_DISINFECT → WF_THERMAL_DISINFECT;
        WF_THERMAL_DISINFECT → WF_THERMAL_DISINFECT (top);
        WF_HEAVY_SOIL → WF_HEAVY_SOIL (top)
    constants:
      MAX_REWASH_COUNT: 2

  - name: lost_item_charge
    trigger: "Garment mark-lost"
    algorithm: aggregation
    formula: |
      charge_cents = LinenCategory.replacement_cost_cents   # per garment
      Queued onto the customer's next DRAFT invoice's lost_item_charges_cents.
      If no DRAFT invoice exists for the customer, the charge waits in an unbilled
      queue; when the next invoice is generated, all queued charges are summed in.
    input_set: "Single garment"

  - name: discrepancy_credit
    trigger: "Discrepancy approve"
    algorithm: aggregation
    formula: |
      credit_cents = round_half_up(approved_shortfall_pieces * LinenCategory.replacement_cost_cents * CREDIT_RATE_PCT / 100, 0)
    input_set: "Single discrepancy"
    constants:
      CREDIT_RATE_PCT: 60   # credit at 60% of replacement cost, not 100%
    precision: "whole cents, round_half_up"

  - name: invoice_total
    trigger: "Invoice generation; every credit application; lost-item queue drain"
    algorithm: aggregation
    formula: |
      total_due_cents = max(0, linen_charges_cents + lost_item_charges_cents + utility_surcharge_cents - credits_cents)
    precision: "whole cents"

  - name: finish_line_buffered_overlap
    trigger: "FinishRun tally"
    algorithm: interval_merge
    formula: |
      BUFFER_MINUTES = 10
      this_interval = [scheduled_start - BUFFER_MINUTES, scheduled_end + BUFFER_MINUTES]   # closed
      conflict exists iff another FinishRun on same line_id with status in {QUEUED, TALLIED}
      has its own buffered closed interval intersecting this_interval
      (closed intervals intersect iff a.start <= b.end AND b.start <= a.end)
    constants:
      BUFFER_MINUTES: 10

  - name: wash_machine_overlap
    trigger: "WashLoad start (STAGED→RUNNING or REWASH_PENDING→RUNNING)"
    algorithm: interval_merge
    formula: |
      Half-open interval [scheduled_start, scheduled_end).
      conflict exists iff another WashLoad on same machine_id with status in
      {STAGED, RUNNING, AWAITING_TEST, REWASH_PENDING} satisfies
      other.start < this.end AND this.start < other.end
      # Adjacent loads (other.end == this.start) are ALLOWED under half-open semantics.
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: existence
    check: "Request body schema: required fields present, types correct, quantities non-negative, pieces >= 1, reject_reason present iff disposition=REJECTED, billing_period_end > billing_period_start, enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (plant, then nested resources)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: existence
    check: "Body-referenced entity ids exist (customer_id, category_id, batch_id, invoice_id, etc.)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "all creation endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Hygienic test required by LinenCategory must be recorded before unload; bypass only when not required"
    error_id: ERR_TEST_REQUIRED
    http_status: 422
    applies_to: "POST /wash-loads/{id}/bypass-test, POST /wash-loads/{id}/unload"

  - priority: 7
    category: business_referential
    check: "WashLoad.category_id must match a category present with disposition=ACCEPTED in the linked SortBatch"
    error_id: ERR_CATEGORY_NOT_IN_BATCH
    http_status: 422
    applies_to: "POST /wash-loads"

  - priority: 8
    category: business_temporal
    check: "Wash machine half-open overlap; finish-line buffered closed-interval overlap; scheduled_end > scheduled_start"
    error_id: "ERR_MACHINE_TIME_OVERLAP | ERR_LINE_TIME_OVERLAP | ERR_INVALID_TIME_RANGE"
    http_status: 409
    applies_to: "POST /wash-loads, POST /wash-loads/{id}/start, POST /finish-runs, POST /finish-runs/{id}/tally"

  - priority: 9
    category: business_constraint
    check: "Uniqueness: (stop_id, cart_tag) unique; chip_code globally unique; (plant_id, period_month) unique on UtilityReading; (customer_id, category_id) unique on CustomerParLevel"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "creation endpoints for SoiledCart (via pickup), Garment, UtilityReading, CustomerParLevel (via PUT)"

  - priority: 10
    category: business_fiscal
    check: "Customer credit limit must not be exceeded by delivery or invoice issue"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /deliveries/{id}/mark-delivered, POST /invoices/{id}/issue"

  - priority: 11
    category: business_fiscal
    check: "Discrepancy credit target invoice in DRAFT and owned by the same customer"
    error_id: "ERR_INVOICE_NOT_DRAFT | ERR_INVOICE_CUSTOMER_MISMATCH"
    http_status: 409
    applies_to: "POST /discrepancies/{id}/apply-credit"

  - priority: 12
    category: business_constraint
    check: "OCC expected_*_version matches the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints listed in §1.2.1 concurrency_rules"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical server clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Plant ---
  - method: POST
    path: "/plants"
    description: "Create a plant"
    roles: [PlantAdmin]
    code: 201
    input: [name, reject_rate_alert_pct, par_shortage_alert_pieces, utility_baseline_kwh_per_lb, utility_baseline_gal_per_lb]
    output: Plant
    side_effects: []

  - method: GET
    path: "/plants/{id}"
    description: "Get a plant"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: []
    output: Plant
    side_effects: []

  # --- LinenCategory ---
  - method: POST
    path: "/plants/{id}/linen-categories"
    description: "Create a linen category under a plant"
    roles: [PlantAdmin]
    code: 201
    input: [code, piece_weight_lb, wash_formula_code, hygienic_test_required, replacement_cost_cents, cog_wash_rate_cents_per_lb]
    output: LinenCategory
    side_effects: []

  - method: GET
    path: "/plants/{id}/linen-categories"
    description: "List categories of a plant (reverse-reachability for LinenCategory.plant_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "LinenCategory[]"
    side_effects: []

  - method: GET
    path: "/linen-categories/{id}"
    description: "Get one category"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: []
    output: LinenCategory
    side_effects: []

  - method: GET
    path: "/linen-categories/{id}/par-levels"
    description: "List par levels referencing this category (reverse-reachability for CustomerParLevel.category_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "CustomerParLevel[]"
    side_effects: []

  - method: GET
    path: "/linen-categories/{id}/sort-items"
    description: "List sort items of this category (reverse-reachability for SortItem.category_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "SortItem[]"
    side_effects: []

  - method: GET
    path: "/linen-categories/{id}/wash-loads"
    description: "List wash loads of this category (reverse-reachability for WashLoad.category_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "WashLoad[]"
    side_effects: []

  - method: GET
    path: "/linen-categories/{id}/garments"
    description: "List garments of this category (reverse-reachability for Garment.category_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Garment[]"
    side_effects: []

  - method: GET
    path: "/linen-categories/{id}/deliveries"
    description: "List deliveries of this category (reverse-reachability for Delivery.category_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Delivery[]"
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/plants/{id}/customers"
    description: "Create a customer under a plant"
    roles: [PlantAdmin]
    code: 201
    input: [name, customer_kind, billing_mode, chip_tracking_enabled, credit_limit_cents]
    output: Customer
    side_effects: ["status=ACTIVE, account_balance_cents=0"]

  - method: GET
    path: "/plants/{id}/customers"
    description: "List customers of a plant (reverse-reachability for Customer.plant_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "billing_mode?", "status?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{id}/suspend"
    description: "Suspend a customer (blocks invoice issue)"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/customers/{id}/resume"
    description: "Resume a suspended customer"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → ACTIVE"]

  - method: GET
    path: "/customers/{id}/stops"
    description: "List route stops of this customer (reverse-reachability for RouteStop.customer_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []

  - method: GET
    path: "/customers/{id}/garments"
    description: "List garments of this customer (reverse-reachability for Garment.customer_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: ["limit?", "offset?", "state?"]
    output: "Garment[]"
    side_effects: []

  # --- CustomerParLevel ---
  - method: PUT
    path: "/customers/{id}/par-levels/{categoryId}"
    description: "Upsert the par level for (customer, category)"
    roles: [PlantAdmin]
    code: 200
    input: [par_pieces]
    output: CustomerParLevel
    side_effects: ["creates row if absent with current_on_site_pieces=0; increments Customer.version by 0 (par row has own version)"]

  - method: GET
    path: "/customers/{id}/par-levels"
    description: "List par levels of a customer (reverse-reachability for CustomerParLevel.customer_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "CustomerParLevel[]"
    side_effects: []

  # --- Route ---
  - method: POST
    path: "/plants/{id}/routes"
    description: "Create a route under a plant"
    roles: [RouteDriver]
    code: 201
    input: [service_date, driver_name]
    output: Route
    side_effects: ["status=PLANNED"]

  - method: GET
    path: "/plants/{id}/routes"
    description: "List routes of a plant (reverse-reachability for Route.plant_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "service_date?"]
    output: "Route[]"
    side_effects: []

  - method: GET
    path: "/routes/{id}"
    description: "Get a route"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: "/routes/{id}/dispatch"
    description: "Dispatch a route"
    roles: [RouteDriver]
    code: 200
    input: []
    output: Route
    side_effects: ["status → DISPATCHED"]

  - method: POST
    path: "/routes/{id}/complete"
    description: "Complete a route"
    roles: [RouteDriver]
    code: 200
    input: []
    output: Route
    side_effects: ["status → COMPLETED"]

  - method: POST
    path: "/routes/{id}/reconcile"
    description: "Reconcile a route"
    roles: [RouteDriver]
    code: 200
    input: []
    output: Route
    side_effects: ["status → RECONCILED"]

  # --- RouteStop ---
  - method: POST
    path: "/routes/{id}/stops"
    description: "Add a stop to a route"
    roles: [RouteDriver]
    code: 201
    input: [customer_id, sequence_index, declared_soiled_weight_lb]
    output: RouteStop
    side_effects: ["status=SCHEDULED, actual_soiled_weight_lb=0"]

  - method: GET
    path: "/routes/{id}/stops"
    description: "List stops of a route (reverse-reachability for RouteStop.route_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []

  - method: GET
    path: "/stops/{id}"
    description: "Get a stop"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: POST
    path: "/stops/{id}/arrive"
    description: "Mark stop arrived"
    roles: [RouteDriver]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status → ARRIVED"]

  - method: POST
    path: "/stops/{id}/pickup"
    description: "Record soiled pickup at a stop; creates SoiledCarts"
    roles: [RouteDriver]
    code: 200
    input: [carts]
    output: RouteStop
    side_effects:
      - "status → PICKED_UP"
      - "creates one SoiledCart per entry of payload.carts (each entry: {cart_tag, scale_weight_lb})"
      - "chip-tracking cascade: Garments AT_CUSTOMER → IN_TRANSIT_SOILED"

  # --- SoiledCart ---
  - method: GET
    path: "/stops/{id}/carts"
    description: "List carts of a stop (reverse-reachability for SoiledCart.stop_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "SoiledCart[]"
    side_effects: []

  - method: GET
    path: "/carts/{id}"
    description: "Get a cart"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: []
    output: SoiledCart
    side_effects: []

  - method: POST
    path: "/carts/{id}/receive"
    description: "Receive a cart at the plant gate"
    roles: [PlantOperator]
    code: 200
    input: []
    output: SoiledCart
    side_effects:
      - "status → RECEIVED"
      - "recompute RouteStop.actual_soiled_weight_lb"
      - "chip-tracking cascade: Garments IN_TRANSIT_SOILED → SOILED_RECEIVED"

  - method: POST
    path: "/carts/{id}/void"
    description: "Void a DECLARED cart"
    roles: [PlantOperator]
    code: 200
    input: []
    output: SoiledCart
    side_effects: ["status → VOIDED"]

  # --- SortBatch / SortItem ---
  - method: POST
    path: "/sort-batches"
    description: "Open a sort batch for a stop"
    roles: [PlantOperator]
    code: 201
    input: [stop_id]
    output: SortBatch
    side_effects: ["status=OPEN, counters=0"]

  - method: GET
    path: "/sort-batches/{id}"
    description: "Get a sort batch"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: []
    output: SortBatch
    side_effects: []

  - method: GET
    path: "/plants/{id}/sort-batches"
    description: "List sort batches of a plant (reverse-reachability for SortBatch.plant_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "SortBatch[]"
    side_effects: []

  - method: GET
    path: "/stops/{id}/sort-batches"
    description: "List sort batches of a stop (reverse-reachability for SortBatch.stop_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "SortBatch[]"
    side_effects: []

  - method: GET
    path: "/sort-batches/{id}/items"
    description: "List sort items of a batch (reverse-reachability for SortItem.batch_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "SortItem[]"
    side_effects: []

  - method: POST
    path: "/sort-batches/{id}/items"
    description: "Add a classification row to a sort batch"
    roles: [PlantOperator]
    code: 201
    input: [category_id, pieces, disposition, "reject_reason?"]
    output: SortItem
    side_effects: ["batch counters recomputed"]

  - method: POST
    path: "/sort-batches/{id}/lock"
    description: "Lock a batch; computes reject rate and alert"
    roles: [PlantOperator]
    code: 200
    input: []
    output: SortBatch
    side_effects: ["status → LOCKED; reject_rate_pct, alert_raised computed"]

  - method: POST
    path: "/sort-batches/{id}/unlock"
    description: "Unlock a batch (revert LOCKED → OPEN)"
    roles: [PlantOperator]
    code: 200
    input: []
    output: SortBatch
    side_effects: ["status → OPEN; alert_raised=false; reject_rate_pct=0"]

  - method: POST
    path: "/sort-batches/{id}/post"
    description: "Post a locked batch"
    roles: [PlantOperator]
    code: 200
    input: []
    output: SortBatch
    side_effects:
      - "status → POSTED"
      - "carts RECEIVED → SORTED"
      - "CustomerParLevel.current_on_site_pieces decremented per accepted category"

  - method: POST
    path: "/sort-batches/{id}/void"
    description: "Void an open batch"
    roles: [PlantOperator]
    code: 200
    input: []
    output: SortBatch
    side_effects: ["status → VOIDED; items discarded"]

  # --- WashLoad ---
  - method: POST
    path: "/wash-loads"
    description: "Stage a wash load from a sort batch"
    roles: [PlantOperator]
    code: 201
    input: [batch_id, category_id, machine_id, scheduled_start, scheduled_end]
    output: WashLoad
    side_effects: ["status=STAGED; formula_code resolved from category; hygienic_test_result=PENDING"]

  - method: GET
    path: "/wash-loads/{id}"
    description: "Get a wash load"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: []
    output: WashLoad
    side_effects: []

  - method: GET
    path: "/plants/{id}/wash-loads"
    description: "List wash loads of a plant (reverse-reachability for WashLoad.plant_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "machine_id?", "status?", "category_id?"]
    output: "WashLoad[]"
    side_effects: []

  - method: GET
    path: "/sort-batches/{id}/wash-loads"
    description: "List wash loads of a sort batch (reverse-reachability for WashLoad.batch_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "WashLoad[]"
    side_effects: []

  - method: POST
    path: "/wash-loads/{id}/start"
    description: "Start a load (from STAGED or REWASH_PENDING)"
    roles: [PlantOperator]
    code: 200
    input: []
    output: WashLoad
    side_effects: ["status → RUNNING; machine overlap validated; chip cascade: SOILED_RECEIVED → WASHING"]

  - method: POST
    path: "/wash-loads/{id}/finish-cycle"
    description: "Finish the mechanical wash cycle"
    roles: [PlantOperator]
    code: 200
    input: []
    output: WashLoad
    side_effects: ["status → AWAITING_TEST"]

  - method: POST
    path: "/wash-loads/{id}/record-test"
    description: "Record hygienic test outcome"
    roles: [PlantOperator]
    code: 200
    input: [outcome]
    output: WashLoad
    side_effects: ["hygienic_test_result set; status → TESTED_PASS or TESTED_FAIL"]

  - method: POST
    path: "/wash-loads/{id}/bypass-test"
    description: "Bypass hygienic test (only when category does not require it)"
    roles: [PlantOperator]
    code: 200
    input: []
    output: WashLoad
    side_effects: ["status → TESTED_PASS"]

  - method: POST
    path: "/wash-loads/{id}/request-rewash"
    description: "Escalate a failed load into rewash"
    roles: [PlantOperator]
    code: 200
    input: []
    output: WashLoad
    side_effects: ["status → REWASH_PENDING; rewash_count += 1; formula escalated"]

  - method: POST
    path: "/wash-loads/{id}/unload"
    description: "Unload a passed load"
    roles: [PlantOperator]
    code: 200
    input: []
    output: WashLoad
    side_effects: ["status → FINISHED; clean_weight_lb computed; chip cascade: WASHING → CLEAN_STOCK"]

  - method: POST
    path: "/wash-loads/{id}/cancel"
    description: "Cancel a STAGED or REWASH_PENDING load"
    roles: [PlantOperator]
    code: 200
    input: []
    output: WashLoad
    side_effects: ["status → CANCELLED"]

  # --- FinishRun ---
  - method: POST
    path: "/finish-runs"
    description: "Queue a finish run for a finished wash load"
    roles: [PlantOperator]
    code: 201
    input: [wash_load_id, line_id, scheduled_start, scheduled_end]
    output: FinishRun
    side_effects: ["status=QUEUED; pieces_in captured from load"]

  - method: GET
    path: "/finish-runs/{id}"
    description: "Get a finish run"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: []
    output: FinishRun
    side_effects: []

  - method: GET
    path: "/plants/{id}/finish-runs"
    description: "List finish runs of a plant (reverse-reachability for FinishRun.plant_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "line_id?", "status?"]
    output: "FinishRun[]"
    side_effects: []

  - method: GET
    path: "/wash-loads/{id}/finish-runs"
    description: "List finish runs of a wash load (reverse-reachability for FinishRun.wash_load_id)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "FinishRun[]"
    side_effects: []

  - method: POST
    path: "/finish-runs/{id}/tally"
    description: "Tally a finish run with pieces_out"
    roles: [PlantOperator]
    code: 200
    input: [pieces_out]
    output: FinishRun
    side_effects: ["status → TALLIED; linen_loss_pieces and throughput computed; line buffered-overlap validated"]

  - method: POST
    path: "/finish-runs/{id}/post"
    description: "Post a tallied finish run to clean stock"
    roles: [PlantOperator]
    code: 200
    input: []
    output: FinishRun
    side_effects: ["status → POSTED; clean stock increased"]

  - method: POST
    path: "/finish-runs/{id}/void"
    description: "Void a queued finish run"
    roles: [PlantOperator]
    code: 200
    input: []
    output: FinishRun
    side_effects: ["status → VOIDED"]

  # --- Garment ---
  - method: POST
    path: "/garments/register"
    description: "Register a chip-tracked garment"
    roles: [PlantAdmin]
    code: 201
    input: [customer_id, category_id, chip_code]
    output: Garment
    side_effects: ["state=AT_CUSTOMER"]

  - method: GET
    path: "/garments/{id}"
    description: "Get a garment"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: []
    output: Garment
    side_effects: []

  - method: POST
    path: "/garments/{id}/load-out"
    description: "Load a clean garment onto an outgoing truck"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Garment
    side_effects: ["state → LOADED_OUT"]

  - method: POST
    path: "/garments/{id}/mark-lost"
    description: "Mark a garment lost; queues a lost-item charge"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: Garment
    side_effects: ["state → LOST; lost_at stamped; lost-item charge queued"]

  # --- Delivery ---
  - method: POST
    path: "/stops/{id}/deliveries"
    description: "Manifest a delivery (one row per category) at a stop"
    roles: [RouteDriver]
    code: 201
    input: [category_id, pieces_promised]
    output: Delivery
    side_effects: ["status=MANIFESTED"]

  - method: GET
    path: "/stops/{id}/deliveries"
    description: "List deliveries of a stop (reverse-reachability for Delivery.stop_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "Delivery[]"
    side_effects: []

  - method: GET
    path: "/deliveries/{id}"
    description: "Get a delivery"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: POST
    path: "/deliveries/{id}/mark-delivered"
    description: "Record physical delivery with pieces_delivered; OCC on Customer.version"
    roles: [RouteDriver]
    code: 200
    input: [pieces_delivered, expected_customer_version]
    output: Delivery
    side_effects:
      - "status → DELIVERED"
      - "shortfall/overage computed; par on-site incremented"
      - "chip cascade: LOADED_OUT → AT_CUSTOMER"
      - "increments Customer.version by 1"
      - "when last MANIFESTED delivery of stop resolves: RouteStop → DELIVERED"

  - method: POST
    path: "/deliveries/{id}/confirm"
    description: "Customer confirms receipt"
    roles: [CustomerContact]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status → CONFIRMED; stop may auto-close"]

  - method: POST
    path: "/deliveries/{id}/disputes"
    description: "Customer files a shortage dispute; creates a Discrepancy"
    roles: [CustomerContact]
    code: 201
    input: [claimed_shortfall_pieces]
    output: Discrepancy
    side_effects: ["Delivery → DISPUTED; RouteStop → DISPUTED"]

  # --- Discrepancy ---
  - method: GET
    path: "/deliveries/{id}/disputes"
    description: "List discrepancies of a delivery (reverse-reachability for Discrepancy.delivery_id)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "Discrepancy[]"
    side_effects: []

  - method: GET
    path: "/discrepancies/{id}"
    description: "Get a discrepancy"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: []
    output: Discrepancy
    side_effects: []

  - method: POST
    path: "/discrepancies/{id}/start-review"
    description: "Move a filed discrepancy into review"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: Discrepancy
    side_effects: ["status → UNDER_REVIEW"]

  - method: POST
    path: "/discrepancies/{id}/approve"
    description: "Approve a discrepancy with an approved shortfall"
    roles: [CustomerServiceRep]
    code: 200
    input: [approved_shortfall_pieces]
    output: Discrepancy
    side_effects: ["status → APPROVED; credit_cents computed"]

  - method: POST
    path: "/discrepancies/{id}/reject"
    description: "Reject a discrepancy"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: Discrepancy
    side_effects: ["status → REJECTED; delivery may settle"]

  - method: POST
    path: "/discrepancies/{id}/apply-credit"
    description: "Apply an approved credit to a DRAFT invoice"
    roles: [BillingClerk]
    code: 200
    input: [invoice_id]
    output: Discrepancy
    side_effects:
      - "status → CREDITED"
      - "Invoice.credits_cents += credit_cents; total_due recomputed"
      - "Customer.account_balance_cents -= credit_cents; increments Customer.version by 1"
      - "delivery may settle"

  # --- Invoice ---
  - method: POST
    path: "/customers/{id}/invoices/generate"
    description: "Generate a DRAFT invoice for a billing period"
    roles: [BillingClerk]
    code: 201
    input: [billing_period_start, billing_period_end]
    output: Invoice
    side_effects:
      - "computes linen_charges_cents (COG or RENTAL by customer.billing_mode)"
      - "computes utility_surcharge_cents (actual if reading exists, else estimated)"
      - "drains queued lost-item charges into lost_item_charges_cents"
      - "computes total_due_cents"
      - "status=DRAFT"

  - method: GET
    path: "/customers/{id}/invoices"
    description: "List invoices of a customer (reverse-reachability for Invoice.customer_id)"
    roles: [PlantAdmin, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [PlantAdmin, CustomerServiceRep, BillingClerk, CustomerContact]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a DRAFT invoice; OCC on Customer.version"
    roles: [BillingClerk]
    code: 200
    input: [expected_customer_version]
    output: Invoice
    side_effects:
      - "status → ISSUED"
      - "Customer.account_balance_cents += total_due_cents; increments Customer.version by 1"

  - method: POST
    path: "/invoices/{id}/mark-paid"
    description: "Mark an issued invoice paid"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → PAID; Customer.account_balance_cents -= total_due_cents; increments Customer.version by 1"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void a DRAFT invoice"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → VOID; releases queued lost-item charges"]

  # --- Billing preview (computed read) ---
  - method: GET
    path: "/customers/{id}/billing-preview"
    description: "Computed preview of what an invoice for the period would contain (COG estimated variant or RENTAL whatif variant); never persists. Period bounds are passed as query parameters."
    roles: [PlantAdmin, CustomerServiceRep, BillingClerk]
    code: 200
    input: [billing_period_start, billing_period_end, "override_par_pieces?"]
    output: "{ linen_charges_cents: integer, lost_item_charges_cents: integer, utility_surcharge_cents: integer, credits_cents: integer, total_due_cents: integer }"
    side_effects: []

  # --- UtilityReading ---
  - method: POST
    path: "/plants/{id}/utility-readings"
    description: "Post a monthly utility reading (immutable)"
    roles: [BillingClerk]
    code: 201
    input: [period_month, kwh_used, gallons_used, clean_lbs_processed, kwh_rate_cents, gallon_rate_cents]
    output: UtilityReading
    side_effects:
      - "trues-up any invoice of the month generated with the estimated surcharge variant: delta applied to next DRAFT invoice (or a new DRAFT delta-only invoice)"

  - method: GET
    path: "/plants/{id}/utility-readings"
    description: "List utility readings of a plant (reverse-reachability for UtilityReading.plant_id)"
    roles: [PlantAdmin, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "period_month?"]
    output: "UtilityReading[]"
    side_effects: []

  - method: GET
    path: "/utility-readings/{id}"
    description: "Get a utility reading"
    roles: [PlantAdmin, BillingClerk]
    code: 200
    input: []
    output: UtilityReading
    side_effects: []

  # --- Garments filtered list (multi-FK) ---
  - method: GET
    path: "/garments"
    description: "List garments (filterable; supplements sub-resource GETs)"
    roles: [PlantAdmin, PlantOperator, RouteDriver, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "category_id?", "state?", "chip_code?"]
    output: "Garment[]"
    side_effects: []

  # --- Customer reverse-reachability extras ---
  - method: GET
    path: "/sort-items"
    description: "List sort items (filtered-list form; batch_id? filter supplements sub-resource GET)"
    roles: [PlantAdmin, PlantOperator, CustomerServiceRep, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "batch_id?", "category_id?"]
    output: "SortItem[]"
    side_effects: []


# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-ID / X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.7" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed role attempted to act on a resource it does not own (CustomerContact on another customer's delivery)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id not found" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 404, condition: "Body-referenced id not found" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing required field, wrong type, negative quantity, pieces < 1, reject_reason present on ACCEPTED or absent on REJECTED, billing_period_end <= billing_period_start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure on a state-transition endpoint" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_ROUTE_HAS_NO_STOPS, http: 409, condition: "Dispatch requires at least one SCHEDULED stop" }
  - { id: ERR_ROUTE_STOPS_OPEN, http: 409, condition: "Complete requires all stops in {PICKED_UP, DELIVERED, CLOSED, DISPUTED}" }
  - { id: ERR_ROUTE_STOPS_UNRESOLVED, http: 409, condition: "Reconcile requires all stops in {CLOSED, DISPUTED}" }
  - { id: ERR_ROUTE_DISCREPANCIES_OPEN, http: 409, condition: "Reconcile requires no discrepancies in {FILED, UNDER_REVIEW, APPROVED}" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Stop arrive requires parent route DISPATCHED" }
  - { id: ERR_EMPTY_PICKUP, http: 422, condition: "Pickup payload.carts must be non-empty" }
  - { id: ERR_DUPLICATE_CART_TAG, http: 409, condition: "cart_tag duplicated within the stop" }
  - { id: ERR_CARTS_PENDING, http: 409, condition: "Delivery requires all carts in {RECEIVED, SORTED, VOIDED}" }
  - { id: ERR_STOP_NOT_PICKED_UP, http: 409, condition: "Operation requires stop in PICKED_UP (or later)" }
  - { id: ERR_CART_NOT_VOIDABLE, http: 409, condition: "Only DECLARED carts may be voided" }
  - { id: ERR_EMPTY_SORT_BATCH, http: 422, condition: "Lock requires total_sorted_pieces >= 1" }
  - { id: ERR_BATCH_HAS_WASH_LOADS, http: 409, condition: "Void/unlock blocked while a WashLoad references the batch" }
  - { id: ERR_BATCH_NOT_LOCKED, http: 409, condition: "WashLoad start requires batch in {LOCKED, POSTED}" }
  - { id: ERR_CATEGORY_NOT_IN_BATCH, http: 422, condition: "No ACCEPTED SortItem of this category exists in the batch" }
  - { id: ERR_MACHINE_TIME_OVERLAP, http: 409, condition: "Half-open machine interval overlaps another active load on the same machine" }
  - { id: ERR_LINE_TIME_OVERLAP, http: 409, condition: "Buffered closed line interval overlaps another active run on the same line" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "scheduled_end must be > scheduled_start" }
  - { id: ERR_TEST_REQUIRED, http: 422, condition: "Category requires hygienic test; bypass forbidden" }
  - { id: ERR_TEST_NOT_REQUIRED, http: 422, condition: "Category does not require hygienic test; record-test forbidden" }
  - { id: ERR_REWASH_LIMIT_REACHED, http: 409, condition: "rewash_count would exceed MAX_REWASH_COUNT (2)" }
  - { id: ERR_TALLY_EXCEEDS_INPUT, http: 422, condition: "pieces_out > pieces_in" }
  - { id: ERR_CHIP_TRACKING_DISABLED, http: 422, condition: "mark-lost requires customer.chip_tracking_enabled" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation (chip_code, (plant, period_month), (customer, category) par, (stop, cart_tag))" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Operation would push customer past credit_limit_cents" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Invoice issue requires customer ACTIVE" }
  - { id: ERR_NO_SHORTAGE, http: 422, condition: "Dispute requires shortfall_pieces >= 1 on the delivery" }
  - { id: ERR_INVALID_APPROVED_QUANTITY, http: 422, condition: "approved_shortfall_pieces out of [1, min(claimed, delivery.shortfall_pieces)]" }
  - { id: ERR_INVOICE_NOT_DRAFT, http: 409, condition: "Credit target invoice must be DRAFT" }
  - { id: ERR_INVOICE_CUSTOMER_MISMATCH, http: 409, condition: "Credit target invoice belongs to a different customer" }
  - { id: ERR_INVOICE_HAS_CREDITS, http: 409, condition: "Void blocked: invoice has CREDITED discrepancies" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant administrator; configures plant, categories, customers, garments"
    identity: opaque
    exclusive_operations:
      - "POST /plants"
      - "POST /plants/{id}/linen-categories"
      - "POST /plants/{id}/customers"
      - "PUT /customers/{id}/par-levels/{categoryId}"
      - "POST /garments/register"
      - "POST /customers/{id}/suspend"
      - "POST /customers/{id}/resume"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: RouteDriver
    description: "Route driver; manages routes, stops, pickups, deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /plants/{id}/routes"
      - "POST /routes/{id}/dispatch|complete|reconcile"
      - "POST /routes/{id}/stops"
      - "POST /stops/{id}/arrive|pickup"
      - "POST /stops/{id}/deliveries"
      - "POST /deliveries/{id}/mark-delivered"
    shared_operations:
      - "GET endpoints on routes, stops, carts, deliveries, garments, customers"

  - name: PlantOperator
    description: "Plant floor operator; sorting, washing, finishing"
    identity: opaque
    exclusive_operations:
      - "POST /carts/{id}/receive|void"
      - "POST /sort-batches and /sort-batches/{id}/items, /lock, /unlock, /post, /void"
      - "POST /wash-loads and lifecycle actions"
      - "POST /finish-runs and /tally, /post, /void"
      - "POST /garments/{id}/load-out"
    shared_operations:
      - "GET endpoints on plant-floor resources"

  - name: CustomerServiceRep
    description: "CSR; handles discrepancies, lost garments"
    identity: opaque
    exclusive_operations:
      - "POST /discrepancies/{id}/start-review|approve|reject"
      - "POST /garments/{id}/mark-lost"
    shared_operations:
      - "GET endpoints"

  - name: BillingClerk
    description: "Billing clerk; invoices, credits, utility readings"
    identity: opaque
    exclusive_operations:
      - "POST /customers/{id}/invoices/generate"
      - "POST /invoices/{id}/issue|mark-paid|void"
      - "POST /discrepancies/{id}/apply-credit"
      - "POST /plants/{id}/utility-readings"
      - "GET /customers/{id}/billing-preview"
    shared_operations:
      - "GET endpoints on invoices, customers, utility readings"

  - name: CustomerContact
    description: "Customer-side contact; views own data, confirms or disputes deliveries"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /deliveries/{id}/confirm"
      - "POST /deliveries/{id}/disputes"
    shared_operations:
      - "GET endpoints on own customer's data (ownership enforced; cross-customer reads → ERR_FORBIDDEN)"
