      - name: election_submitted_exactly_on_window_close_date_is_accepted
        grounds:
          - calculations.end_of_term_election_pricing
          - validations[priority=11].election_window_open
          - errors[ERR_ELECTION_WINDOW_CLOSED]
          - state_machines.SolarAgreement.ACTIVE_to_END_OF_TERM_PENDING
        distinguishing_aspect: |
          A 10-year agreement starting 2016-09-01 ends 2026-08-31, so the election
          window is 2026-03-04 through 2026-08-01 with BOTH endpoints inclusive. All
          four boundary days are probed: 2026-03-03 rejected, 2026-03-04 accepted,
          2026-08-01 accepted, 2026-08-02 rejected. An implementation using strict
          inequality, or forgetting that contract_end_date is the day BEFORE the
          anniversary, fails at least one of the four.
        test_recipe:
          setup:
            - "Clock starts at 2026-03-03T00:00:00Z and is walked forward across the four boundary days."
            - "Three ACTIVE PPA agreements with identical terms: start 2016-09-01, term_years 10, escalator 0.029, base rate 14750, 9600 kWh, band 0.05, 7.20 kW; contract_end_date 2026-08-31, window 2026-03-04..2026-08-01."
            - "elapsed_full_years is 9 on every one of the four probe dates, so residual_pct is 0.5950 throughout and price differences cannot be blamed on the decay curve."
