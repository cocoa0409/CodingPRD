scenario: "919. Transitional Care & Readmission Program: discharge referral & risk score, 48-hour follow-up call & TCM visit, medication reconciliation, appointment & barrier resolution, red-flag & escalation, 30-day tracking & readmission, TCM-code billing, handoff"
domain_name: "transitional-care-readmission"
api_prefix: "/tcm"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Depth-over-breadth build. The intake gauntlet, the risk-tier fork, the
    business-day contact ladder, the parallel-axis TCM visit, the med-rec
    conservation invariant, the typed-barrier SLA sweep, the bounded red-flag
    promotion loop, the 30-day readmission classifier, the TCM claim
    denial/appeal loop, the OCC handoff with a workload cap, and a single
    global record-freeze rung all interlock on one CareEpisode aggregate.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Declared domain constants. EVERY named threshold, window, cap, buffer, rate
# and SLA used anywhere in this scaffold has its literal value here. Nothing
# downstream may invent a value.
# ---------------------------------------------------------------------------
domain_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- Intake gauntlet ---
  ELIGIBLE_DISPOSITIONS: ["HOME", "HOME_HEALTH", "SNF_SHORT_TERM", "ASSISTED_LIVING"]
  INELIGIBLE_DISPOSITIONS: ["HOSPICE", "LTACH", "EXPIRED", "AMA"]
  INTAKE_WINDOW_DAYS: 2
  OPEN_EPISODE_STATUSES: ["INTAKE", "ACTIVE", "SERVICE_PERIOD_CLOSED"]

  # --- Risk scoring ---
  LOS_INPATIENT_POINTS_PER_DAY: 1.5
  LOS_INPATIENT_POINT_CAP: 12
  LOS_OBSERVATION_HOURS_PER_POINT: 12.0
  LOS_OBSERVATION_POINT_CAP: 6
  ACUITY_POINTS_ELECTIVE: 0
  ACUITY_POINTS_URGENT: 6
  ACUITY_POINTS_EMERGENT: 10
  COMORBIDITY_POINTS_PER_CONDITION: 2.5
  COMORBIDITY_POINT_CAP: 20
  UTILIZATION_POINTS_PER_ED_VISIT: 3
  UTILIZATION_POINTS_PER_ADMISSION: 5
  UTILIZATION_POINT_CAP: 24
  SOCIAL_POINTS_PER_FLAG: 2.5
  SOCIAL_POINT_CAP: 10
  RISK_SCORE_CAP: 60
  RISK_TIER_MODERATE_FLOOR: 18
  RISK_TIER_HIGH_FLOOR: 32
  RISK_TIER_SEVERE_FLOOR: 45

  # --- Tier-driven program parameters ---
  CONTACT_SLA_BUSINESS_DAYS_LOW: 2
  CONTACT_SLA_BUSINESS_DAYS_MODERATE: 2
  CONTACT_SLA_BUSINESS_DAYS_HIGH: 2
  CONTACT_SLA_BUSINESS_DAYS_SEVERE: 1
  REQUIRED_COMPLEXITY_LOW: "MODERATE_COMPLEXITY"
  REQUIRED_COMPLEXITY_MODERATE: "MODERATE_COMPLEXITY"
  REQUIRED_COMPLEXITY_HIGH: "HIGH_COMPLEXITY"
  REQUIRED_COMPLEXITY_SEVERE: "HIGH_COMPLEXITY"

  # --- Interactive contact ladder ---
  MAX_CONTACT_ATTEMPTS: 4
  CONTACT_MODALITY_LADDER: ["PHONE", "PHONE", "SECURE_MESSAGE", "HOME_VISIT"]
  CONTACT_ATTEMPT_COOLDOWN_MINUTES: 240
  END_OF_DAY_TIME_SUFFIX: "T23:59:59.999Z"
  BUSINESS_WEEKDAYS: ["MON", "TUE", "WED", "THU", "FRI"]
  HOURS_PER_SLA_DAY_CALENDAR_VARIANT: 24

  # --- TCM face-to-face visit ---
  VISIT_DUE_DAYS_MODERATE_COMPLEXITY: 14
  VISIT_DUE_DAYS_HIGH_COMPLEXITY: 7
  VISIT_TURNAROUND_BUFFER_MINUTES: 20
  MODERATE_REQUIRED_ELEMENTS: ["MED_REC_REVIEWED", "DISCHARGE_SUMMARY_REVIEWED", "PATIENT_EDUCATION"]
  HIGH_REQUIRED_ELEMENTS: ["MED_REC_REVIEWED", "DISCHARGE_SUMMARY_REVIEWED", "PATIENT_EDUCATION", "HIGH_COMPLEXITY_MDM", "COMMUNITY_SERVICE_REFERRAL"]

  # --- Medication reconciliation ---
  BLOCKING_DISCREPANCY_SEVERITIES: ["HIGH", "CRITICAL"]
  DEFERRABLE_DISCREPANCY_SEVERITIES: ["LOW", "MODERATE"]

  # --- Typed barriers ---
  BARRIER_SLA_HOURS_TRANSPORTATION: 48
  BARRIER_SLA_HOURS_INSURANCE_AUTH: 72
  BARRIER_SLA_HOURS_LANGUAGE: 24
  BARRIER_SLA_HOURS_CAREGIVER_AVAILABILITY: 96
  BARRIER_SLA_HOURS_PHARMACY_ACCESS: 36
  BARRIER_BLOCKING_TYPES: ["TRANSPORTATION", "INSURANCE_AUTH", "PHARMACY_ACCESS"]
  BARRIER_NONBLOCKING_TYPES: ["LANGUAGE", "CAREGIVER_AVAILABILITY"]
  BARRIER_OWNER_ROLE_TRANSPORTATION: "CareNavigator"
  BARRIER_OWNER_ROLE_INSURANCE_AUTH: "BillingSpecialist"
  BARRIER_OWNER_ROLE_LANGUAGE: "CareNavigator"
  BARRIER_OWNER_ROLE_CAREGIVER_AVAILABILITY: "CareNavigator"
  BARRIER_OWNER_ROLE_PHARMACY_ACCESS: "Clinician"
  BARRIER_ESCALATION_RED_FLAG_TIER: "TIER_2"

  # --- Red-flag escalation ---
  REDFLAG_ACK_SLA_MINUTES_TIER_1: 30
  REDFLAG_ACK_SLA_MINUTES_TIER_2: 120
  REDFLAG_ACK_SLA_MINUTES_TIER_3: 480
  REDFLAG_ACK_SLA_MINUTES: { TIER_1: 30, TIER_2: 120, TIER_3: 480 }
  REDFLAG_ROUTING_ROLE_TIER_1: "Clinician"
  REDFLAG_ROUTING_ROLE_TIER_2: "CareNavigator"
  REDFLAG_ROUTING_ROLE_TIER_3: "CareNavigator"
  REDFLAG_ROUTING_ROLE: { TIER_1: "Clinician", TIER_2: "CareNavigator", TIER_3: "CareNavigator" }
  MAX_REDFLAG_PROMOTIONS: 2
  CONTACT_REFUSED_RED_FLAG_TIER: "TIER_3"
  VISIT_WINDOW_AT_RISK_RED_FLAG_TIER: "TIER_2"

  # --- 30-day tracking / readmission ---
  READMISSION_WINDOW_DAYS: 30
  READMISSION_COUNTING_CLASSES: ["UNPLANNED_INPATIENT"]
  READMISSION_EXCLUDED_CLASSES: ["PLANNED_INPATIENT", "OBSERVATION_ONLY", "ED_TREAT_AND_RELEASE"]
  READMISSION_VOIDING_CLASSES: ["UNPLANNED_INPATIENT"]
  READMISSION_FLAGGING_CLASSES: ["PLANNED_INPATIENT", "OBSERVATION_ONLY"]
  READMISSION_INERT_CLASSES: ["ED_TREAT_AND_RELEASE"]

  # --- TCM billing ---
  SERVICE_PERIOD_DAYS: 30
  TCM_MODERATE_CODE: "99495"
  TCM_HIGH_CODE: "99496"
  TCM_MODERATE_BASE_RATE_CENTS: 20450
  TCM_HIGH_BASE_RATE_CENTS: 27680
  WITHHOLD_TIER_THRESHOLD_CENTS: 20000
  WITHHOLD_PCT_ABOVE_THRESHOLD: 0.03
  WITHHOLD_PCT_BELOW_THRESHOLD: 0.01
  MAX_CLAIM_APPEALS: 2
  NON_TERMINAL_CLAIM_STATUSES: ["PREPARED", "SUBMITTED", "DENIED", "APPEALED"]
  TERMINAL_CLAIM_STATUSES: ["PAID", "DENIED_FINAL", "VOIDED"]

  # --- Handoff / workload ---
  HANDOFF_RESPONSE_WINDOW_HOURS: 24
  NAVIGATOR_DEFAULT_ACTIVE_EPISODE_CAP: 5
  WORKLOAD_WEIGHT_LOW: 1
  WORKLOAD_WEIGHT_MODERATE: 1
  WORKLOAD_WEIGHT_HIGH: 2
  WORKLOAD_WEIGHT_SEVERE: 3

  # --- Global write gate ---
  FROZEN_EPISODE_STATUSES: ["BILLED", "CLOSED_READMITTED", "ADMIN_CLOSED"]
  FREEZE_EXEMPT_ENDPOINTS: ["POST /tcm/episodes/{episode_id}/readmissions", "POST /tcm/readmissions/{readmission_id}/retract", "POST /_clock/set_current_utc"]

  # --- Rounding ---
  MONEY_ROUNDING: "round_half_up to whole cents"
  POINTS_ROUNDING: "round_half_up to whole points, applied per component BEFORE summation"

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: external_mrn
        type: string
        source: input
        description: "Medical record number from the discharging health system."
        constraints: "Non-empty; unique across Patient."
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "Birth date in YYYY-MM-DD form."
      - name: primary_language
        type: string
        source: input
        description: "ISO-639-1 language code used for outreach."
        default: "EN"
      - name: open_episode_count
        type: integer
        source: computed
        description: "Count of CareEpisode rows with patient_id equal to this Patient.id and status IN {INTAKE, ACTIVE, SERVICE_PERIOD_CLOSED}."
        default: 0
      - name: lifetime_episode_count
        type: integer
        source: computed
        description: "Count of all CareEpisode rows with patient_id equal to this Patient.id, any status."
        default: 0
      - name: lifetime_readmission_count
        type: integer
        source: computed
        description: "Count of ReadmissionEvent rows with status RECORDED and counts_toward_rate true across all of this patient's episodes."
        default: 0

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Discharging facility name."
      - name: facility_type
        type: enum
        source: input
        description: "Kind of discharging facility."
        constraints: "One of ACUTE_HOSPITAL, CRITICAL_ACCESS, REHAB, LTACH_FACILITY."
      - name: network_status
        type: enum
        source: input
        description: "Whether the program has a transitional-care agreement with this facility."
        constraints: "One of IN_NETWORK, OUT_OF_NETWORK."

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Payer / health plan name."
      - name: tcm_covered
        type: boolean
        source: input
        description: "True when this payer reimburses TCM codes 99495/99496."
      - name: tcm_rate_multiplier
        type: number
        source: input
        description: "Multiplier applied to the TCM base rate to produce allowed_cents."
        default: 1.0
        constraints: "Greater than 0 and at most 2.0."
      - name: coinsurance_rate
        type: number
        source: input
        description: "Patient coinsurance fraction applied to allowed_cents."
        default: 0.2
        constraints: "Between 0 and 0.5 inclusive."
      - name: contact_deadline_basis
        type: enum
        source: input
        description: "Selects which variant of the follow-up contact deadline calculation applies."
        default: "BUSINESS_DAYS"
        constraints: "One of BUSINESS_DAYS, CALENDAR_HOURS."

  - name: Navigator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Transitional-care navigator name."
      - name: active_episode_cap
        type: integer
        source: input
        description: "Maximum workload_score this navigator may carry."
        default: 5
        constraints: "Integer between 1 and 40 inclusive."
      - name: cap_policy
        type: enum
        source: input
        description: "Selects which variant of the workload calculation this navigator's cap is measured with."
        default: "COUNT"
        constraints: "One of COUNT, WEIGHTED."
      - name: active_episode_count
        type: integer
        source: computed
        description: "Count of CareEpisode rows with navigator_id equal to this Navigator.id and status IN {INTAKE, ACTIVE, SERVICE_PERIOD_CLOSED}."
        default: 0
      - name: workload_score
        type: number
        source: computed
        description: "Result of calculations.navigator_workload_score for this navigator under its cap_policy."
        default: 0
      - name: availability_status
        type: enum
        source: computed
        description: "AVAILABLE when workload_score is strictly less than active_episode_cap, otherwise AT_CAP."
        constraints: "One of AVAILABLE, AT_CAP."

  - name: DischargeReferral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the discharged patient this referral concerns."
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the discharging facility."
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the plan responsible for the TCM service."
      - name: discharge_date
        type: string
        source: input
        description: "Calendar date of discharge in YYYY-MM-DD form; day 0 of every downstream window."
      - name: discharge_datetime
        type: datetime
        source: input
        description: "Exact UTC instant of discharge; used only by the CALENDAR_HOURS contact-deadline variant."
      - name: discharge_disposition
        type: enum
        source: input
        description: "Where the patient went at discharge."
        constraints: "One of HOME, HOME_HEALTH, SNF_SHORT_TERM, ASSISTED_LIVING, HOSPICE, LTACH, EXPIRED, AMA."
      - name: stay_type
        type: enum
        source: input
        description: "Selects which variant of the length-of-stay risk component applies."
        constraints: "One of INPATIENT, OBSERVATION."
      - name: length_of_stay_days
        type: integer
        source: input
        description: "Whole days of inpatient stay. Required when stay_type is INPATIENT, ignored otherwise."
        constraints: "Integer between 0 and 90 inclusive when supplied."
      - name: length_of_stay_hours
        type: integer
        source: input
        description: "Whole hours of observation stay. Required when stay_type is OBSERVATION, ignored otherwise."
        constraints: "Integer between 0 and 240 inclusive when supplied."
      - name: admission_acuity
        type: enum
        source: input
        description: "Acuity of the index admission."
        constraints: "One of ELECTIVE, URGENT, EMERGENT."
      - name: comorbidity_count
        type: integer
        source: input
        description: "Number of active chronic conditions on the discharge problem list."
        constraints: "Integer between 0 and 30 inclusive."
      - name: prior_ed_visits_6mo
        type: integer
        source: input
        description: "Emergency-department visits in the six months before discharge."
        constraints: "Integer between 0 and 30 inclusive."
      - name: prior_admissions_6mo
        type: integer
        source: input
        description: "Inpatient admissions in the six months before discharge."
        constraints: "Integer between 0 and 30 inclusive."
      - name: social_risk_flags_count
        type: integer
        source: input
        description: "Number of documented social-risk flags such as housing instability or food insecurity."
        constraints: "Integer between 0 and 12 inclusive."
      - name: referred_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the referral row was created."
      - name: status
        type: enum
        source: computed
        description: "Referral lifecycle state."
        default: "RECEIVED"
        constraints: "One of RECEIVED, ACCEPTED, DENIED, WITHDRAWN."
      - name: closure_reason_code
        type: enum
        source: input
        description: "Reason recorded when the referral is closed without an episode."
        constraints: "One of NOT_ELIGIBLE, DUPLICATE, PATIENT_DECLINED, OTHER; null while status is RECEIVED or ACCEPTED."
      - name: created_episode_id
        type: string
        source: computed
        description: "Id of the CareEpisode minted by the ACCEPT transition, or null. Inverse of CareEpisode.referral_id; discoverable via GET /tcm/episodes with referral_id."

  - name: CareEpisode
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: system
        description: "FK -> DischargeReferral.id; the accepted referral that opened this episode."
      - name: patient_id
        type: string
        source: system
        description: "FK -> Patient.id; copied from the referral."
      - name: payer_id
        type: string
        source: system
        description: "FK -> Payer.id; copied from the referral and pinned for the whole episode."
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; copied from the referral."
      - name: navigator_id
        type: string
        source: input
        description: "FK -> Navigator.id; the navigator currently accountable for this episode."
      - name: discharge_date
        type: string
        source: system
        description: "Copied from the referral; day 0 of the service period and of the readmission window."
      - name: discharge_datetime
        type: datetime
        source: system
        description: "Copied from the referral."
      - name: status
        type: enum
        source: computed
        description: "Primary episode lifecycle axis."
        default: "INTAKE"
        constraints: "One of INTAKE, ACTIVE, SERVICE_PERIOD_CLOSED, BILLED, CLOSED_READMITTED, ADMIN_CLOSED."
      - name: record_posture
        type: enum
        source: computed
        description: "Independent write-gate axis. FROZEN blocks every non-exempt mutation on this episode and on all of its children."
        default: "OPEN"
        constraints: "One of OPEN, FROZEN."
      - name: pre_readmission_status
        type: enum
        source: computed
        description: "Value of status immediately before an UNPLANNED_INPATIENT readmission forced CLOSED_READMITTED; restored on retraction; null otherwise."
        constraints: "One of ACTIVE, SERVICE_PERIOD_CLOSED, or null."
      - name: risk_score
        type: integer
        source: computed
        description: "risk_score of the RiskAssessment with is_current true for this episode."
      - name: risk_tier
        type: enum
        source: computed
        description: "risk_tier of the RiskAssessment with is_current true for this episode."
        constraints: "One of LOW, MODERATE, HIGH, SEVERE."
      - name: current_risk_assessment_id
        type: string
        source: computed
        description: "Id of the RiskAssessment with is_current true for this episode. Inverse of RiskAssessment.episode_id; discoverable via GET /tcm/risk-assessments with episode_id."
      - name: contact_sla_business_days
        type: integer
        source: computed
        description: "Tier-derived follow-up SLA length; 1 for SEVERE, 2 for LOW, MODERATE and HIGH."
      - name: contact_deadline_at
        type: datetime
        source: computed
        description: "Result of calculations.contact_deadline_at under the payer's contact_deadline_basis."
      - name: contact_status
        type: enum
        source: computed
        description: "Interactive-contact axis."
        default: "NOT_STARTED"
        constraints: "One of NOT_STARTED, IN_PROGRESS, SUCCESSFUL, REFUSED."
      - name: contact_attempt_count
        type: integer
        source: computed
        description: "Number of ContactAttempt rows created for this episode, regardless of disposition."
        default: 0
      - name: successful_contact_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the CONNECTED disposition, or null."
      - name: contact_timely
        type: boolean
        source: computed
        description: "True when successful_contact_at is non-null and less than or equal to contact_deadline_at."
        default: false
      - name: required_visit_complexity
        type: enum
        source: computed
        description: "Tier-derived service tier the face-to-face visit must satisfy."
        constraints: "One of MODERATE_COMPLEXITY, HIGH_COMPLEXITY."
      - name: visit_due_date
        type: string
        source: computed
        description: "Result of calculations.visit_due_date in YYYY-MM-DD form."
      - name: visit_completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the face-to-face visit reached encounter_status COMPLETED, or null."
      - name: visit_timely
        type: boolean
        source: computed
        description: "True when visit_completed_at is non-null and on or before visit_due_date end-of-day."
        default: false
      - name: medrec_complete
        type: boolean
        source: computed
        description: "True when this episode's MedReconciliation has status COMPLETED."
        default: false
      - name: service_period_end_date
        type: string
        source: computed
        description: "discharge_date plus 29 days, in YYYY-MM-DD form."
      - name: readmission_window_end_date
        type: string
        source: computed
        description: "discharge_date plus 30 days, in YYYY-MM-DD form."
      - name: readmission_event_count
        type: integer
        source: computed
        description: "Total ReadmissionEvent rows for this episode in any status."
        default: 0
      - name: counted_readmission_count
        type: integer
        source: computed
        description: "ReadmissionEvent rows for this episode with status RECORDED and counts_toward_rate true."
        default: 0
      - name: excluded_readmission_count
        type: integer
        source: computed
        description: "ReadmissionEvent rows for this episode with status RECORDED and counts_toward_rate false."
        default: 0
      - name: retracted_readmission_count
        type: integer
        source: computed
        description: "ReadmissionEvent rows for this episode with status RETRACTED."
        default: 0
      - name: open_red_flag_count
        type: integer
        source: computed
        description: "RedFlag rows for this episode with status IN {RAISED, ACKNOWLEDGED}."
        default: 0
      - name: escalation_state
        type: enum
        source: computed
        description: "ACTIVE while open_red_flag_count is greater than 0, otherwise NONE."
        default: "NONE"
        constraints: "One of NONE, ACTIVE."
      - name: billing_eligible
        type: boolean
        source: computed
        description: "False once an UNPLANNED_INPATIENT ReadmissionEvent is RECORDED for this episode; true otherwise."
        default: true
      - name: recoupment_required
        type: boolean
        source: computed
        description: "True when an UNPLANNED_INPATIENT readmission is recorded while this episode's claim is already PAID."
        default: false
      - name: claim_id
        type: string
        source: computed
        description: "Id of the single TcmClaim prepared for this episode, or null. Inverse of TcmClaim.episode_id; discoverable via GET /tcm/claims with episode_id."

  - name: RiskAssessment
    parent: CareEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> CareEpisode.id; the episode this assessment scores."
      - name: supersedes_id
        type: string
        source: computed
        description: "FK -> RiskAssessment.id; the prior current assessment this row replaced, or null for the first assessment of an episode."
      - name: stay_type
        type: enum
        source: computed
        description: "Copied from the episode's referral; never re-supplied on re-assessment."
        constraints: "One of INPATIENT, OBSERVATION."
      - name: length_of_stay_days
        type: integer
        source: computed
        description: "Copied from the episode's referral."
      - name: length_of_stay_hours
        type: integer
        source: computed
        description: "Copied from the episode's referral."
      - name: admission_acuity
        type: enum
        source: computed
        description: "Copied from the episode's referral."
        constraints: "One of ELECTIVE, URGENT, EMERGENT."
      - name: comorbidity_count
        type: integer
        source: input
        description: "Chronic-condition count used by this assessment."
        constraints: "Integer between 0 and 30 inclusive."
      - name: prior_ed_visits_6mo
        type: integer
        source: input
        description: "Six-month ED utilization used by this assessment."
        constraints: "Integer between 0 and 30 inclusive."
      - name: prior_admissions_6mo
        type: integer
        source: input
        description: "Six-month admission utilization used by this assessment."
        constraints: "Integer between 0 and 30 inclusive."
      - name: social_risk_flags_count
        type: integer
        source: input
        description: "Social-risk flag count used by this assessment."
        constraints: "Integer between 0 and 12 inclusive."
      - name: los_variant
        type: enum
        source: computed
        description: "Which length-of-stay formula produced los_points."
        constraints: "One of INPATIENT_DAYS, OBSERVATION_HOURS."
      - name: los_points
        type: integer
        source: computed
        description: "Rounded length-of-stay component."
      - name: acuity_points
        type: integer
        source: computed
        description: "Acuity component."
      - name: comorbidity_points
        type: integer
        source: computed
        description: "Rounded comorbidity component."
      - name: utilization_points
        type: integer
        source: computed
        description: "Capped prior-utilization component."
      - name: social_modifier_points
        type: integer
        source: computed
        description: "Rounded social/barrier modifier component."
      - name: risk_score
        type: integer
        source: computed
        description: "Sum of the five rounded components, capped at RISK_SCORE_CAP."
      - name: risk_tier
        type: enum
        source: computed
        description: "Band of risk_score."
        constraints: "One of LOW, MODERATE, HIGH, SEVERE."
      - name: is_current
        type: boolean
        source: computed
        description: "True for exactly one RiskAssessment per episode - the most recently created one."
        default: true
      - name: assessed_at
        type: datetime
        source: system
        description: "Logical-clock instant this assessment was computed."

  - name: ContactAttempt
    parent: CareEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> CareEpisode.id; the episode being contacted."
      - name: attempt_number
        type: integer
        source: computed
        description: "One-based ordinal of this attempt within the episode."
      - name: modality
        type: enum
        source: input
        description: "Outreach channel used; must equal CONTACT_MODALITY_LADDER at index attempt_number minus 1."
        constraints: "One of PHONE, SECURE_MESSAGE, HOME_VISIT."
      - name: attempt_status
        type: enum
        source: computed
        description: "Attempt lifecycle; LOGGED until a disposition is recorded."
        default: "LOGGED"
        constraints: "One of LOGGED, CONNECTED, NO_ANSWER, VOICEMAIL, REFUSED."
      - name: attempted_at
        type: datetime
        source: system
        description: "Logical-clock instant the attempt row was created; drives the cooldown check."
      - name: disposition_at
        type: datetime
        source: computed
        description: "Logical-clock instant the disposition was recorded, or null."
      - name: notes
        type: string
        source: input
        description: "Free-text outreach note."
        default: ""

  - name: TcmVisit
    parent: CareEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> CareEpisode.id; the episode this face-to-face visit serves."
      - name: navigator_id
        type: string
        source: input
        description: "FK -> Navigator.id; the navigator whose calendar this visit occupies."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Start of the booked slot; half-open interval start."
      - name: scheduled_end
        type: datetime
        source: input
        description: "End of the booked slot; half-open interval end, must be strictly after scheduled_start."
      - name: encounter_status
        type: enum
        source: computed
        description: "Encounter axis; advances independently of documentation_status."
        default: "SCHEDULED"
        constraints: "One of SCHEDULED, COMPLETED, NO_SHOW, CANCELLED."
      - name: documentation_status
        type: enum
        source: computed
        description: "Documentation axis; advances independently of encounter_status."
        default: "DRAFT"
        constraints: "One of DRAFT, ATTESTED, AMENDED."
      - name: confirmation_status
        type: enum
        source: computed
        description: "Whether the appointment has been confirmed with the patient; reverts to UNCONFIRMED when a blocking barrier escalates."
        default: "UNCONFIRMED"
        constraints: "One of UNCONFIRMED, CONFIRMED."
      - name: required_complexity
        type: enum
        source: computed
        description: "Mirror of the episode's required_visit_complexity at the moment this visit was last recomputed."
        constraints: "One of MODERATE_COMPLEXITY, HIGH_COMPLEXITY."
      - name: achieved_complexity
        type: enum
        source: computed
        description: "HIGH_COMPLEXITY when documented_elements contains every member of HIGH_REQUIRED_ELEMENTS, otherwise MODERATE_COMPLEXITY; null before attestation."
        constraints: "One of MODERATE_COMPLEXITY, HIGH_COMPLEXITY, or null."
      - name: visit_due_date
        type: string
        source: computed
        description: "Mirror of the episode's visit_due_date in YYYY-MM-DD form."
      - name: deadline_status
        type: enum
        source: computed
        description: "Timeliness marker recomputed on every schedule, reschedule, completion and risk re-assessment."
        default: "SCHEDULED_IN_WINDOW"
        constraints: "One of SCHEDULED_IN_WINDOW, SCHEDULED_LATE, MET, MISSED."
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the COMPLETED transition, or null."
      - name: documented_elements
        type: array
        source: input
        description: "Service elements documented at completion; members of the union of MODERATE_REQUIRED_ELEMENTS and HIGH_REQUIRED_ELEMENTS."
        default: []
      - name: attested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Clinician who attested, or null."
      - name: attested_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent attestation, or null."
      - name: amendment_count
        type: integer
        source: computed
        description: "Number of times the attested documentation has been amended."
        default: 0

  - name: MedReconciliation
    parent: CareEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> CareEpisode.id; at most one MedReconciliation exists per episode."
      - name: status
        type: enum
        source: computed
        description: "Reconciliation lifecycle."
        default: "OPEN"
        constraints: "One of OPEN, IN_REVIEW, COMPLETED."
      - name: discrepancy_count
        type: integer
        source: computed
        description: "Total MedDiscrepancy rows attached to this reconciliation."
        default: 0
      - name: resolved_count
        type: integer
        source: computed
        description: "MedDiscrepancy rows with status RESOLVED."
        default: 0
      - name: unresolved_count
        type: integer
        source: computed
        description: "MedDiscrepancy rows with status UNRESOLVED."
        default: 0
      - name: deferred_count
        type: integer
        source: computed
        description: "MedDiscrepancy rows with status DEFERRED."
        default: 0
      - name: blocking_unresolved_count
        type: integer
        source: computed
        description: "MedDiscrepancy rows with status UNRESOLVED and severity IN {HIGH, CRITICAL}."
        default: 0
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent COMPLETED transition, or null."
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of times this reconciliation has been reopened after completion."
        default: 0
      - name: performed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Clinician who created the reconciliation."

  - name: MedDiscrepancy
    parent: MedReconciliation
    common_fields: true
    fields:
      - name: med_reconciliation_id
        type: string
        source: system
        description: "FK -> MedReconciliation.id; the reconciliation this line item belongs to."
      - name: medication_name
        type: string
        source: input
        description: "Drug involved in the discrepancy."
      - name: discrepancy_type
        type: enum
        source: input
        description: "Nature of the discrepancy."
        constraints: "One of OMISSION, DUPLICATION, DOSE_MISMATCH, INTERACTION, ALLERGY_CONFLICT."
      - name: severity
        type: enum
        source: input
        description: "Clinical severity; HIGH and CRITICAL are blocking and non-deferrable."
        constraints: "One of LOW, MODERATE, HIGH, CRITICAL."
      - name: status
        type: enum
        source: computed
        description: "Line-item disposition."
        default: "UNRESOLVED"
        constraints: "One of UNRESOLVED, RESOLVED, DEFERRED."
      - name: resolution_note
        type: string
        source: input
        description: "Note recorded with the disposition, or null."
      - name: disposition_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent disposition, or null."

  - name: Barrier
    parent: CareEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> CareEpisode.id; the episode this barrier obstructs."
      - name: barrier_type
        type: enum
        source: input
        description: "Typed barrier; fixes sla_hours, owner_role and blocking_class."
        constraints: "One of TRANSPORTATION, INSURANCE_AUTH, LANGUAGE, CAREGIVER_AVAILABILITY, PHARMACY_ACCESS."
      - name: blocking_class
        type: boolean
        source: computed
        description: "True when barrier_type is in BARRIER_BLOCKING_TYPES."
      - name: owner_role
        type: enum
        source: computed
        description: "Role required to close this barrier with outcome RESOLVED."
        constraints: "One of CareNavigator, BillingSpecialist, Clinician."
      - name: sla_hours
        type: integer
        source: computed
        description: "Type-derived resolution SLA in whole hours."
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the barrier was raised."
      - name: sla_due_at
        type: datetime
        source: computed
        description: "opened_at plus sla_hours hours."
      - name: status
        type: enum
        source: computed
        description: "Barrier lifecycle."
        default: "OPEN"
        constraints: "One of OPEN, ESCALATED, RESOLVED, WAIVED, CLOSED_ADMINISTRATIVE."
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the barrier left OPEN or ESCALATED, or null."
      - name: description
        type: string
        source: input
        description: "Free-text description of the obstruction."
        default: ""
      - name: escalated_red_flag_id
        type: string
        source: computed
        description: "Id of the RedFlag spawned by SLA escalation, or null. Inverse of RedFlag.source_barrier_id; discoverable via GET /tcm/red-flags with source_barrier_id."

  - name: RedFlag
    parent: CareEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> CareEpisode.id; the episode this escalation belongs to."
      - name: source_barrier_id
        type: string
        source: computed
        description: "FK -> Barrier.id; the barrier whose SLA breach spawned this red flag, or null for clinician-raised flags."
      - name: category
        type: enum
        source: input
        description: "What raised the flag."
        constraints: "One of CLINICAL_SYMPTOM, MEDICATION_ISSUE, BARRIER_SLA_BREACH, CONTACT_REFUSED, VISIT_WINDOW_AT_RISK."
      - name: initial_tier
        type: enum
        source: input
        description: "Severity tier at the moment the flag was raised."
        constraints: "One of TIER_1, TIER_2, TIER_3."
      - name: tier
        type: enum
        source: computed
        description: "Current severity tier after any auto-promotions."
        constraints: "One of TIER_1, TIER_2, TIER_3."
      - name: promotion_count
        type: integer
        source: computed
        description: "Number of auto-promotions applied; never exceeds MAX_REDFLAG_PROMOTIONS."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Escalation lifecycle."
        default: "RAISED"
        constraints: "One of RAISED, ACKNOWLEDGED, RESOLVED, BREACHED, CLOSED_ADMINISTRATIVE."
      - name: raised_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who raised the flag; may not resolve it."
      - name: raised_at
        type: datetime
        source: system
        description: "Logical-clock instant the flag was raised."
      - name: ack_due_at
        type: datetime
        source: computed
        description: "Acknowledgement deadline for the current tier; reset on every promotion."
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the acknowledging actor, or null."
      - name: acknowledged_at
        type: datetime
        source: computed
        description: "Logical-clock instant of acknowledgement, or null."
      - name: resolution_outcome
        type: enum
        source: input
        description: "Clinical disposition recorded at resolution, or null."
        constraints: "One of RESOLVED_AT_HOME, RESOLVED_URGENT_CARE, SENT_TO_ED."
      - name: spawned_readmission_id
        type: string
        source: computed
        description: "Id of the ReadmissionEvent created by a SENT_TO_ED resolution, or null. Inverse of ReadmissionEvent.source_red_flag_id; discoverable via GET /tcm/readmissions with source_red_flag_id."
      - name: ed_event_suppressed
        type: boolean
        source: computed
        description: "True when a SENT_TO_ED resolution fell outside the 30-day window so no ReadmissionEvent was created."
        default: false

  - name: ReadmissionEvent
    parent: CareEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> CareEpisode.id; the index episode whose window this event lands in."
      - name: source_red_flag_id
        type: string
        source: computed
        description: "FK -> RedFlag.id; the red flag whose SENT_TO_ED resolution spawned this event, or null for directly recorded events."
      - name: readmission_date
        type: string
        source: input
        description: "Calendar date of the readmission in YYYY-MM-DD form."
      - name: day_index
        type: integer
        source: computed
        description: "readmission_date minus the episode's discharge_date, in whole days; must be between 1 and 30 inclusive."
      - name: classification
        type: enum
        source: input
        description: "Class of the readmission; each class has a different effect on the episode and the claim."
        constraints: "One of UNPLANNED_INPATIENT, PLANNED_INPATIENT, OBSERVATION_ONLY, ED_TREAT_AND_RELEASE."
      - name: counts_toward_rate
        type: boolean
        source: computed
        description: "True only when classification is UNPLANNED_INPATIENT."
      - name: status
        type: enum
        source: computed
        description: "Event lifecycle."
        default: "RECORDED"
        constraints: "One of RECORDED, RETRACTED."
      - name: retraction_reason
        type: string
        source: input
        description: "Reason recorded when the event is retracted, or null."
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProgramAdmin who recorded the event, or the string SYSTEM for red-flag-spawned events."

  - name: TcmClaim
    parent: CareEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> CareEpisode.id; at most one TcmClaim exists per episode."
      - name: patient_id
        type: string
        source: system
        description: "FK -> Patient.id; copied from the episode, used for the per-patient per-service-period uniqueness check."
      - name: visit_id
        type: string
        source: system
        description: "FK -> TcmVisit.id; the attested face-to-face visit the claim bills."
      - name: payer_id
        type: string
        source: system
        description: "FK -> Payer.id; copied from the episode."
      - name: service_period_start_date
        type: string
        source: computed
        description: "Equal to the episode's discharge_date."
      - name: service_period_end_date
        type: string
        source: computed
        description: "Equal to the episode's service_period_end_date."
      - name: payable_code
        type: enum
        source: computed
        description: "TCM CPT code selected by the complexity fork and the timeliness facts."
        constraints: "One of the strings 99495, 99496."
      - name: payable_variant
        type: enum
        source: computed
        description: "FULL when the high-complexity criteria were met end to end; DOWNGRADED when the claim fell back to the moderate code."
        constraints: "One of FULL, DOWNGRADED."
      - name: base_rate_cents
        type: integer
        source: computed
        description: "Base rate for payable_code before payer adjustment."
      - name: allowed_cents
        type: integer
        source: computed
        description: "base_rate_cents multiplied by the payer's tcm_rate_multiplier, rounded to whole cents."
      - name: coinsurance_cents
        type: integer
        source: computed
        description: "allowed_cents multiplied by the payer's coinsurance_rate, rounded to whole cents."
      - name: net_before_withhold_cents
        type: integer
        source: computed
        description: "allowed_cents minus coinsurance_cents."
      - name: withhold_pct
        type: number
        source: computed
        description: "Quality withhold fraction selected by the tier net_before_withhold_cents falls in."
      - name: withhold_cents
        type: integer
        source: computed
        description: "net_before_withhold_cents multiplied by withhold_pct, rounded to whole cents."
      - name: net_payable_cents
        type: integer
        source: computed
        description: "net_before_withhold_cents minus withhold_cents; zero once the claim is VOIDED."
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle including the bounded denial and appeal loop."
        default: "PREPARED"
        constraints: "One of PREPARED, SUBMITTED, PAID, DENIED, APPEALED, DENIED_FINAL, VOIDED."
      - name: appeal_count
        type: integer
        source: computed
        description: "Number of appeals filed; never exceeds MAX_CLAIM_APPEALS."
        default: 0
      - name: denial_reason_code
        type: enum
        source: input
        description: "Reason supplied by the payer on a DENIED adjudication, or null."
        constraints: "One of MISSING_DOCUMENTATION, NOT_COVERED, DUPLICATE_SERVICE, TIMELY_FILING."
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BillingSpecialist who prepared the claim; may not submit it."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BillingSpecialist who submitted the claim, or null."
      - name: readmission_flagged
        type: boolean
        source: computed
        description: "True when a PLANNED_INPATIENT or OBSERVATION_ONLY readmission was recorded in this episode's window."
        default: false
      - name: paid_at
        type: datetime
        source: computed
        description: "Logical-clock instant the claim reached PAID, or null."

  - name: HandoffRequest
    parent: CareEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> CareEpisode.id; the episode whose accountability is being transferred."
      - name: from_navigator_id
        type: string
        source: system
        description: "FK -> Navigator.id; the episode's navigator at the moment the handoff was proposed."
      - name: to_navigator_id
        type: string
        source: input
        description: "FK -> Navigator.id; the proposed receiving navigator."
      - name: handoff_type
        type: enum
        source: input
        description: "Destination class; only INTERNAL_NAVIGATOR is subject to the receiving navigator's workload cap."
        constraints: "One of INTERNAL_NAVIGATOR, COMMUNITY_PROGRAM, PCP_PROGRAM."
      - name: status
        type: enum
        source: computed
        description: "Handshake lifecycle."
        default: "PROPOSED"
        constraints: "One of PROPOSED, ACCEPTED, DECLINED, EXPIRED, SUPERSEDED."
      - name: proposed_at
        type: datetime
        source: system
        description: "Logical-clock instant the handoff was proposed."
      - name: expires_at
        type: datetime
        source: computed
        description: "proposed_at plus HANDOFF_RESPONSE_WINDOW_HOURS hours."
      - name: responded_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the accept or decline, or null."
      - name: decline_reason
        type: string
        source: input
        description: "Reason recorded on a DECLINE response, or null."
      - name: superseded_by_id
        type: string
        source: computed
        description: "Id of the newer HandoffRequest that superseded this one, or null. Inverse relationship inside HandoffRequest; discoverable via GET /tcm/handoffs with episode_id."

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: DischargeReferral
    axis: status
    shape: branching
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, DENIED, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /tcm/referrals/{referral_id}/accept"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status == RECEIVED"
          - "referral.discharge_disposition IN ELIGIBLE_DISPOSITIONS"
          - "referral.referred_at date is on or before discharge_date plus INTAKE_WINDOW_DAYS days"
          - "Patient.open_episode_count == 0 for referral.patient_id"
          - "Payer.tcm_covered == true for referral.payer_id"
          - "Facility.network_status == IN_NETWORK for referral.facility_id"
          - "Navigator supplied in the request body exists"
        side_effects:
          - "Creates one CareEpisode in status INTAKE and record_posture OPEN, copying patient_id, payer_id, facility_id, discharge_date and discharge_datetime from the referral."
          - "Creates the episode's first RiskAssessment with is_current true and supersedes_id null, running calculations.readmission_risk_score."
          - "Sets CareEpisode.risk_score, risk_tier, current_risk_assessment_id from that assessment."
          - "Sets CareEpisode.contact_sla_business_days, contact_deadline_at (calculations.contact_deadline_at), required_visit_complexity and visit_due_date (calculations.visit_due_date)."
          - "Sets CareEpisode.service_period_end_date to discharge_date plus 29 days and readmission_window_end_date to discharge_date plus 30 days."
          - "Sets referral.created_episode_id to the new episode id."
          - "Increments Patient.open_episode_count and Patient.lifetime_episode_count by 1."
          - "Increments Navigator.active_episode_count by 1 and recomputes Navigator.workload_score and availability_status."
      - from: RECEIVED
        to: DENIED
        trigger: "POST /tcm/referrals/{referral_id}/close with outcome DENIED"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status == RECEIVED"
        side_effects:
          - "Sets referral.closure_reason_code from the request body."
          - "No CareEpisode is created; Patient counters are untouched."
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /tcm/referrals/{referral_id}/close with outcome WITHDRAWN"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status == RECEIVED"
        side_effects:
          - "Sets referral.closure_reason_code from the request body."
          - "No CareEpisode is created; Patient counters are untouched."
        note: "DENIED and WITHDRAWN diverge only in the recorded status; both are terminal and neither mints an episode."

  - entity: CareEpisode
    axis: status
    shape: branching
    initial_state: INTAKE
    terminal_states: [BILLED, CLOSED_READMITTED, ADMIN_CLOSED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /tcm/episodes/{episode_id}/contact-attempts (system transition fired by the first attempt)"
        actor: system
        preconditions:
          - "episode.status == INTAKE"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets episode.contact_status to IN_PROGRESS."
          - "Sets episode.contact_attempt_count to 1."
      - from: ACTIVE
        to: SERVICE_PERIOD_CLOSED
        trigger: "POST /tcm/episodes/{episode_id}/close-service-period"
        actor: ProgramAdmin
        preconditions:
          - "episode.status == ACTIVE"
          - "episode.record_posture == OPEN"
          - "current_utc is strictly after service_period_end_date end-of-day"
        side_effects:
          - "Freezes episode.contact_timely, visit_timely and medrec_complete at their current values."
          - "Makes claim preparation and submission legal for this episode."
      - from: SERVICE_PERIOD_CLOSED
        to: BILLED
        trigger: "POST /tcm/claims/{claim_id}/adjudicate with outcome PAID (system transition)"
        actor: system
        preconditions:
          - "episode.status == SERVICE_PERIOD_CLOSED"
          - "the episode's TcmClaim reached status PAID"
        side_effects:
          - "Sets TcmClaim.paid_at to current_utc."
          - "Triggers the record_posture freeze evaluation."
      - from: ACTIVE
        to: CLOSED_READMITTED
        trigger: "POST /tcm/episodes/{episode_id}/readmissions with classification UNPLANNED_INPATIENT (system transition)"
        actor: system
        preconditions:
          - "episode.status == ACTIVE"
          - "the new ReadmissionEvent has classification UNPLANNED_INPATIENT and status RECORDED"
        side_effects:
          - "Stores the pre-transition status in episode.pre_readmission_status."
          - "Sets episode.billing_eligible to false."
          - "CASCADE hop 3: any TcmClaim for this episode whose status is in NON_TERMINAL_CLAIM_STATUSES transitions to VOIDED."
          - "Decrements Navigator.active_episode_count by 1 and recomputes workload_score and availability_status."
          - "Decrements Patient.open_episode_count by 1."
      - from: SERVICE_PERIOD_CLOSED
        to: CLOSED_READMITTED
        trigger: "POST /tcm/episodes/{episode_id}/readmissions with classification UNPLANNED_INPATIENT (system transition)"
        actor: system
        preconditions:
          - "episode.status == SERVICE_PERIOD_CLOSED"
          - "the new ReadmissionEvent has classification UNPLANNED_INPATIENT and status RECORDED"
        side_effects:
          - "Stores SERVICE_PERIOD_CLOSED in episode.pre_readmission_status."
          - "Sets episode.billing_eligible to false."
          - "CASCADE hop 3: any TcmClaim for this episode whose status is in NON_TERMINAL_CLAIM_STATUSES transitions to VOIDED."
          - "Decrements Navigator.active_episode_count by 1 and Patient.open_episode_count by 1."
      - from: CLOSED_READMITTED
        to: ACTIVE
        trigger: "POST /tcm/readmissions/{readmission_id}/retract (system transition)"
        actor: system
        preconditions:
          - "episode.status == CLOSED_READMITTED"
          - "the retracted event is the one whose pre_readmission_status was stored and equals ACTIVE"
        side_effects:
          - "Restores episode.status from pre_readmission_status and clears pre_readmission_status."
          - "Sets episode.billing_eligible back to true."
          - "Increments Navigator.active_episode_count by 1 and Patient.open_episode_count by 1."
          - "The VOIDED TcmClaim is NOT reinstated; a replacement claim must be prepared."
      - from: CLOSED_READMITTED
        to: SERVICE_PERIOD_CLOSED
        trigger: "POST /tcm/readmissions/{readmission_id}/retract (system transition)"
        actor: system
        preconditions:
          - "episode.status == CLOSED_READMITTED"
          - "the retracted event is the one whose pre_readmission_status was stored and equals SERVICE_PERIOD_CLOSED"
        side_effects:
          - "Restores episode.status to SERVICE_PERIOD_CLOSED and clears pre_readmission_status."
          - "Sets episode.billing_eligible back to true."
          - "Increments Navigator.active_episode_count by 1 and Patient.open_episode_count by 1."
      - from: INTAKE
        to: ADMIN_CLOSED
        trigger: "POST /tcm/episodes/{episode_id}/admin-close"
        actor: ProgramAdmin
        preconditions:
          - "episode.status IN {INTAKE, ACTIVE, SERVICE_PERIOD_CLOSED}"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Any TcmClaim in NON_TERMINAL_CLAIM_STATUSES transitions to VOIDED."
          - "Decrements Navigator.active_episode_count by 1 and Patient.open_episode_count by 1."
      - from: ACTIVE
        to: ADMIN_CLOSED
        trigger: "POST /tcm/episodes/{episode_id}/admin-close"
        actor: ProgramAdmin
        preconditions:
          - "episode.status IN {INTAKE, ACTIVE, SERVICE_PERIOD_CLOSED}"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Any TcmClaim in NON_TERMINAL_CLAIM_STATUSES transitions to VOIDED."
          - "Decrements Navigator.active_episode_count by 1 and Patient.open_episode_count by 1."
      - from: SERVICE_PERIOD_CLOSED
        to: ADMIN_CLOSED
        trigger: "POST /tcm/episodes/{episode_id}/admin-close"
        actor: ProgramAdmin
        preconditions:
          - "episode.status IN {INTAKE, ACTIVE, SERVICE_PERIOD_CLOSED}"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Any TcmClaim in NON_TERMINAL_CLAIM_STATUSES transitions to VOIDED."
          - "Decrements Navigator.active_episode_count by 1 and Patient.open_episode_count by 1."

  - entity: CareEpisode
    axis: record_posture
    shape: parallel
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "System re-evaluation run after every mutation that changes episode.status or any TcmClaim.status for this episode"
        actor: system
        preconditions:
          - "episode.status IN FROZEN_EPISODE_STATUSES"
          - "the episode has no TcmClaim whose status is in NON_TERMINAL_CLAIM_STATUSES"
        side_effects:
          - "CASCADE hop 5: every HandoffRequest for this episode with status PROPOSED transitions to SUPERSEDED with superseded_by_id null."
          - "CASCADE hop 5: every RedFlag for this episode with status IN {RAISED, ACKNOWLEDGED} transitions to CLOSED_ADMINISTRATIVE and episode.open_red_flag_count drops to 0 with escalation_state NONE."
          - "CASCADE hop 5: every Barrier for this episode with status IN {OPEN, ESCALATED} transitions to CLOSED_ADMINISTRATIVE with closed_at set to current_utc."
          - "Every subsequent non-exempt mutation on this episode or any of its children is rejected with ERR_EPISODE_RECORDS_FROZEN."
        note: "record_posture advances independently of status. An episode can sit in BILLED or CLOSED_READMITTED with record_posture still OPEN while a claim remains in PREPARED, SUBMITTED, DENIED or APPEALED."
      - from: FROZEN
        to: OPEN
        trigger: "System re-evaluation run after POST /tcm/readmissions/{readmission_id}/retract, the only mutation that can move status back out of FROZEN_EPISODE_STATUSES"
        actor: system
        preconditions:
          - "episode.status NOT IN FROZEN_EPISODE_STATUSES after the retraction restored it from pre_readmission_status"
        side_effects:
          - "Mutations on the episode and its children are accepted again."
          - "Children already moved to SUPERSEDED or CLOSED_ADMINISTRATIVE by the freeze cascade are NOT restored; those states are terminal."
        note: "Reachable only from CLOSED_READMITTED. BILLED and ADMIN_CLOSED are terminal on the status axis, so a freeze reached through either of them is permanent."

  - entity: ContactAttempt
    axis: attempt_status
    shape: branching
    initial_state: LOGGED
    terminal_states: [CONNECTED, NO_ANSWER, VOICEMAIL, REFUSED]
    transitions:
      - from: LOGGED
        to: CONNECTED
        trigger: "POST /tcm/contact-attempts/{contact_attempt_id}/disposition with outcome CONNECTED"
        actor: CareNavigator
        preconditions:
          - "attempt.attempt_status == LOGGED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets episode.contact_status to SUCCESSFUL and episode.successful_contact_at to current_utc."
          - "Recomputes episode.contact_timely as successful_contact_at less than or equal to contact_deadline_at."
          - "Unblocks POST /tcm/visits/{visit_id}/complete for this episode."
      - from: LOGGED
        to: NO_ANSWER
        trigger: "POST /tcm/contact-attempts/{contact_attempt_id}/disposition with outcome NO_ANSWER"
        actor: CareNavigator
        preconditions:
          - "attempt.attempt_status == LOGGED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Leaves episode.contact_status at IN_PROGRESS; the next attempt must use CONTACT_MODALITY_LADDER at index attempt_number."
      - from: LOGGED
        to: VOICEMAIL
        trigger: "POST /tcm/contact-attempts/{contact_attempt_id}/disposition with outcome VOICEMAIL"
        actor: CareNavigator
        preconditions:
          - "attempt.attempt_status == LOGGED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Leaves episode.contact_status at IN_PROGRESS; the next attempt must use CONTACT_MODALITY_LADDER at index attempt_number."
      - from: LOGGED
        to: REFUSED
        trigger: "POST /tcm/contact-attempts/{contact_attempt_id}/disposition with outcome REFUSED"
        actor: CareNavigator
        preconditions:
          - "attempt.attempt_status == LOGGED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets episode.contact_status to REFUSED; no further ContactAttempt may be created for the episode."
          - "Creates a RedFlag with category CONTACT_REFUSED, initial_tier TIER_3, tier TIER_3, status RAISED, raised_by_user_id SYSTEM and ack_due_at current_utc plus 480 minutes."
          - "Increments episode.open_red_flag_count by 1 and sets episode.escalation_state to ACTIVE."
        note: "Divergent side-effect sets per branch make this a true fork, not a linear pipeline."

  - entity: TcmVisit
    axis: encounter_status
    shape: cyclic
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /tcm/visits/{visit_id}/complete"
        actor: Clinician
        preconditions:
          - "visit.encounter_status == SCHEDULED"
          - "visit.confirmation_status == CONFIRMED"
          - "episode.contact_status == SUCCESSFUL"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets visit.completed_at and episode.visit_completed_at to current_utc."
          - "Stores documented_elements from the request body."
          - "Sets visit.deadline_status to MET when current_utc is on or before visit_due_date end-of-day, otherwise MISSED."
          - "Recomputes episode.visit_timely."
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /tcm/visits/{visit_id}/close-encounter with outcome NO_SHOW"
        actor: CareNavigator
        preconditions:
          - "visit.encounter_status == SCHEDULED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Releases the navigator calendar interval so a replacement slot may reuse it."
          - "Sets visit.deadline_status to MISSED when current_utc is strictly after visit_due_date end-of-day."
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /tcm/visits/{visit_id}/reschedule"
        actor: CareNavigator
        preconditions:
          - "visit.encounter_status == NO_SHOW"
          - "episode.record_posture == OPEN"
          - "the new interval clears the navigator double-booking rule"
        side_effects:
          - "Replaces scheduled_start and scheduled_end, resets confirmation_status to UNCONFIRMED."
          - "Recomputes deadline_status as SCHEDULED_IN_WINDOW or SCHEDULED_LATE against visit_due_date."
        note: "The NO_SHOW to SCHEDULED edge is the cycle; a visit may bounce between them any number of times while the episode stays OPEN."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tcm/visits/{visit_id}/close-encounter with outcome CANCELLED"
        actor: CareNavigator
        preconditions:
          - "visit.encounter_status == SCHEDULED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Releases the navigator calendar interval permanently; CANCELLED is terminal on this axis."
      - from: NO_SHOW
        to: CANCELLED
        trigger: "POST /tcm/visits/{visit_id}/close-encounter with outcome CANCELLED"
        actor: CareNavigator
        preconditions:
          - "visit.encounter_status == NO_SHOW"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Releases the navigator calendar interval permanently."

  - entity: TcmVisit
    axis: documentation_status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ATTESTED
        trigger: "POST /tcm/visits/{visit_id}/attest"
        actor: Clinician
        preconditions:
          - "visit.encounter_status == COMPLETED"
          - "visit.documentation_status == DRAFT"
          - "episode.record_posture == OPEN"
          - "the episode's MedReconciliation has status COMPLETED"
          - "the episode's MedReconciliation has blocking_unresolved_count == 0"
          - "visit.documented_elements contains every member of MODERATE_REQUIRED_ELEMENTS"
        side_effects:
          - "Sets visit.attested_by_user_id to X-User-ID and visit.attested_at to current_utc."
          - "Sets visit.achieved_complexity to HIGH_COMPLEXITY when documented_elements covers HIGH_REQUIRED_ELEMENTS, otherwise MODERATE_COMPLEXITY."
      - from: ATTESTED
        to: AMENDED
        trigger: "POST /tcm/visits/{visit_id}/amend"
        actor: Clinician
        preconditions:
          - "visit.documentation_status IN {ATTESTED, AMENDED}"
          - "episode.record_posture == OPEN"
          - "the request carries expected_visit_version equal to the visit's current version"
        side_effects:
          - "Replaces documented_elements, increments amendment_count by 1, recomputes achieved_complexity."
          - "Increments TcmVisit.version by 1."
      - from: AMENDED
        to: ATTESTED
        trigger: "POST /tcm/visits/{visit_id}/attest"
        actor: Clinician
        preconditions:
          - "visit.documentation_status == AMENDED"
          - "episode.record_posture == OPEN"
          - "the episode's MedReconciliation has status COMPLETED and blocking_unresolved_count == 0"
          - "visit.documented_elements contains every member of MODERATE_REQUIRED_ELEMENTS"
        side_effects:
          - "Re-stamps attested_by_user_id and attested_at, recomputes achieved_complexity."
        note: "ATTESTED to AMENDED to ATTESTED is the revision cycle; it runs independently of encounter_status, which is already terminal at COMPLETED."

  - entity: MedReconciliation
    axis: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /tcm/med-reconciliations/{med_reconciliation_id}/discrepancies (system transition on the first line item)"
        actor: system
        preconditions:
          - "reconciliation.status == OPEN"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets discrepancy_count to 1 and unresolved_count to 1, preserving discrepancy_count == resolved_count + unresolved_count + deferred_count."
          - "Increments MedReconciliation.version by 1."
      - from: OPEN
        to: COMPLETED
        trigger: "POST /tcm/med-reconciliations/{med_reconciliation_id}/complete"
        actor: Clinician
        preconditions:
          - "reconciliation.status == OPEN"
          - "reconciliation.discrepancy_count == 0"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets completed_at to current_utc and episode.medrec_complete to true."
        note: "Empty-set boundary - a reconciliation with zero line items completes directly from OPEN."
      - from: IN_REVIEW
        to: COMPLETED
        trigger: "POST /tcm/med-reconciliations/{med_reconciliation_id}/complete"
        actor: Clinician
        preconditions:
          - "reconciliation.status == IN_REVIEW"
          - "reconciliation.blocking_unresolved_count == 0"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets completed_at to current_utc and episode.medrec_complete to true."
          - "Unblocks POST /tcm/visits/{visit_id}/attest for this episode."
      - from: COMPLETED
        to: IN_REVIEW
        trigger: "POST /tcm/med-reconciliations/{med_reconciliation_id}/reopen"
        actor: Clinician
        preconditions:
          - "reconciliation.status == COMPLETED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Increments reopen_count by 1, clears completed_at, sets episode.medrec_complete to false."
          - "Re-blocks POST /tcm/visits/{visit_id}/attest until the reconciliation is completed again."
        note: "COMPLETED to IN_REVIEW to COMPLETED is the revision cycle."

  - entity: MedDiscrepancy
    axis: status
    shape: cyclic
    initial_state: UNRESOLVED
    terminal_states: []
    transitions:
      - from: UNRESOLVED
        to: RESOLVED
        trigger: "POST /tcm/discrepancies/{discrepancy_id}/disposition with disposition RESOLVED"
        actor: Clinician
        preconditions:
          - "discrepancy.status == UNRESOLVED"
          - "the parent reconciliation status is OPEN or IN_REVIEW"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Decrements parent.unresolved_count by 1 and increments parent.resolved_count by 1, preserving the conservation identity."
          - "Recomputes parent.blocking_unresolved_count."
      - from: UNRESOLVED
        to: DEFERRED
        trigger: "POST /tcm/discrepancies/{discrepancy_id}/disposition with disposition DEFERRED"
        actor: Clinician
        preconditions:
          - "discrepancy.status == UNRESOLVED"
          - "discrepancy.severity IN DEFERRABLE_DISCREPANCY_SEVERITIES"
          - "the parent reconciliation status is OPEN or IN_REVIEW"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Decrements parent.unresolved_count by 1 and increments parent.deferred_count by 1, preserving the conservation identity."
      - from: RESOLVED
        to: UNRESOLVED
        trigger: "POST /tcm/discrepancies/{discrepancy_id}/reopen"
        actor: Clinician
        preconditions:
          - "discrepancy.status == RESOLVED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Decrements parent.resolved_count by 1 and increments parent.unresolved_count by 1, preserving the conservation identity."
          - "Recomputes parent.blocking_unresolved_count; a HIGH or CRITICAL line item re-blocks attestation."
      - from: DEFERRED
        to: UNRESOLVED
        trigger: "POST /tcm/discrepancies/{discrepancy_id}/reopen"
        actor: Clinician
        preconditions:
          - "discrepancy.status == DEFERRED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Decrements parent.deferred_count by 1 and increments parent.unresolved_count by 1, preserving the conservation identity."

  - entity: Barrier
    axis: status
    shape: branching
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED, CLOSED_ADMINISTRATIVE]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /tcm/episodes/{episode_id}/sla-sweep, phase 1"
        actor: system
        preconditions:
          - "barrier.status == OPEN"
          - "barrier.blocking_class == true"
          - "current_utc is strictly after barrier.sla_due_at"
          - "episode.record_posture == OPEN"
        side_effects:
          - "CASCADE hop 2: creates a RedFlag with category BARRIER_SLA_BREACH, initial_tier TIER_2, tier TIER_2, status RAISED, source_barrier_id set to this barrier, raised_by_user_id SYSTEM and ack_due_at current_utc plus 120 minutes; stores its id in barrier.escalated_red_flag_id."
          - "Reverts every TcmVisit of this episode with encounter_status SCHEDULED and confirmation_status CONFIRMED back to confirmation_status UNCONFIRMED."
        note: "Non-blocking barrier types never escalate; they simply stay OPEN past sla_due_at."
      - from: OPEN
        to: RESOLVED
        trigger: "POST /tcm/barriers/{barrier_id}/close with outcome RESOLVED"
        actor: CareNavigator
        preconditions:
          - "barrier.status IN {OPEN, ESCALATED}"
          - "the acting X-User-Role equals barrier.owner_role"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets closed_at to current_utc; unblocks POST /tcm/visits/{visit_id}/confirm once no blocking barrier remains OPEN or ESCALATED."
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /tcm/barriers/{barrier_id}/close with outcome RESOLVED"
        actor: CareNavigator
        preconditions:
          - "barrier.status IN {OPEN, ESCALATED}"
          - "the acting X-User-Role equals barrier.owner_role"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets closed_at to current_utc. The RedFlag spawned by the escalation is NOT auto-resolved; it keeps its own acknowledgement clock."
      - from: OPEN
        to: WAIVED
        trigger: "POST /tcm/barriers/{barrier_id}/close with outcome WAIVED"
        actor: ProgramAdmin
        preconditions:
          - "barrier.status IN {OPEN, ESCALATED}"
          - "the acting X-User-Role is ProgramAdmin"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets closed_at to current_utc; the barrier stops blocking visit confirmation."
      - from: ESCALATED
        to: WAIVED
        trigger: "POST /tcm/barriers/{barrier_id}/close with outcome WAIVED"
        actor: ProgramAdmin
        preconditions:
          - "barrier.status IN {OPEN, ESCALATED}"
          - "the acting X-User-Role is ProgramAdmin"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets closed_at to current_utc."
      - from: OPEN
        to: CLOSED_ADMINISTRATIVE
        trigger: "CareEpisode record_posture OPEN to FROZEN cascade"
        actor: system
        preconditions:
          - "barrier.status IN {OPEN, ESCALATED}"
          - "the parent episode's record_posture just became FROZEN"
        side_effects:
          - "Sets closed_at to current_utc."
      - from: ESCALATED
        to: CLOSED_ADMINISTRATIVE
        trigger: "CareEpisode record_posture OPEN to FROZEN cascade"
        actor: system
        preconditions:
          - "barrier.status IN {OPEN, ESCALATED}"
          - "the parent episode's record_posture just became FROZEN"
        side_effects:
          - "Sets closed_at to current_utc."

  - entity: RedFlag
    axis: status
    shape: cyclic
    initial_state: RAISED
    terminal_states: [RESOLVED, BREACHED, CLOSED_ADMINISTRATIVE]
    transitions:
      - from: RAISED
        to: RAISED
        trigger: "POST /tcm/episodes/{episode_id}/sla-sweep, phase 2 (auto-promotion)"
        actor: system
        preconditions:
          - "red_flag.status == RAISED"
          - "current_utc is strictly after red_flag.ack_due_at"
          - "red_flag.tier != TIER_1"
          - "red_flag.promotion_count < MAX_REDFLAG_PROMOTIONS"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Promotes tier one step along TIER_3 to TIER_2 to TIER_1."
          - "Increments promotion_count by 1."
          - "Resets ack_due_at to current_utc plus the new tier's REDFLAG_ACK_SLA_MINUTES."
          - "Changes the role required to acknowledge to the new tier's REDFLAG_ROUTING_ROLE."
        note: "Self-loop bounded twice over - by tier reaching TIER_1 and by MAX_REDFLAG_PROMOTIONS."
      - from: RAISED
        to: BREACHED
        trigger: "POST /tcm/episodes/{episode_id}/sla-sweep, phase 2 (bound reached)"
        actor: system
        preconditions:
          - "red_flag.status == RAISED"
          - "current_utc is strictly after red_flag.ack_due_at"
          - "red_flag.tier == TIER_1 OR red_flag.promotion_count == MAX_REDFLAG_PROMOTIONS"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Decrements episode.open_red_flag_count by 1; sets episode.escalation_state to NONE when the counter reaches 0."
      - from: RAISED
        to: ACKNOWLEDGED
        trigger: "POST /tcm/red-flags/{red_flag_id}/acknowledge"
        actor: CareNavigator
        preconditions:
          - "red_flag.status == RAISED"
          - "the acting X-User-Role equals REDFLAG_ROUTING_ROLE for red_flag.tier"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets acknowledged_by_user_id to X-User-ID and acknowledged_at to current_utc."
          - "Stops the promotion clock; the flag can no longer be promoted or breached."
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /tcm/red-flags/{red_flag_id}/resolve"
        actor: Clinician
        preconditions:
          - "red_flag.status == ACKNOWLEDGED"
          - "X-User-ID != red_flag.raised_by_user_id"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Stores resolution_outcome from the request body."
          - "Decrements episode.open_red_flag_count by 1; sets escalation_state to NONE when the counter reaches 0."
          - "When resolution_outcome is SENT_TO_ED and the current date lies between discharge_date plus 1 and readmission_window_end_date inclusive, creates a ReadmissionEvent with classification ED_TREAT_AND_RELEASE, source_red_flag_id set to this flag, readmission_date equal to the current date, recorded_by_user_id SYSTEM; stores its id in spawned_readmission_id."
          - "When resolution_outcome is SENT_TO_ED and the current date is outside that window, creates no event and sets ed_event_suppressed to true."
      - from: RAISED
        to: CLOSED_ADMINISTRATIVE
        trigger: "CareEpisode record_posture OPEN to FROZEN cascade"
        actor: system
        preconditions:
          - "red_flag.status IN {RAISED, ACKNOWLEDGED}"
          - "the parent episode's record_posture just became FROZEN"
        side_effects:
          - "Decrements episode.open_red_flag_count by 1; escalation_state becomes NONE when the counter reaches 0."
      - from: ACKNOWLEDGED
        to: CLOSED_ADMINISTRATIVE
        trigger: "CareEpisode record_posture OPEN to FROZEN cascade"
        actor: system
        preconditions:
          - "red_flag.status IN {RAISED, ACKNOWLEDGED}"
          - "the parent episode's record_posture just became FROZEN"
        side_effects:
          - "Decrements episode.open_red_flag_count by 1; escalation_state becomes NONE when the counter reaches 0."

  - entity: ReadmissionEvent
    axis: status
    shape: branching
    initial_state: RECORDED
    terminal_states: [RETRACTED]
    transitions:
      - from: RECORDED
        to: RETRACTED
        trigger: "POST /tcm/readmissions/{readmission_id}/retract"
        actor: ProgramAdmin
        preconditions:
          - "event.status == RECORDED"
        side_effects:
          - "Decrements episode.counted_readmission_count by 1 when counts_toward_rate is true, otherwise decrements excluded_readmission_count by 1."
          - "Increments episode.retracted_readmission_count by 1, leaving readmission_event_count unchanged and preserving readmission_event_count == counted_readmission_count + excluded_readmission_count + retracted_readmission_count."
          - "Decrements Patient.lifetime_readmission_count by 1 when counts_toward_rate is true."
          - "When classification is UNPLANNED_INPATIENT, restores episode.status from pre_readmission_status and sets billing_eligible back to true."
          - "When classification is PLANNED_INPATIENT or OBSERVATION_ONLY and no other RECORDED event of those classes remains, sets the episode's TcmClaim.readmission_flagged back to false."

  - entity: TcmClaim
    axis: status
    shape: cyclic
    initial_state: PREPARED
    terminal_states: [PAID, DENIED_FINAL, VOIDED]
    transitions:
      - from: PREPARED
        to: SUBMITTED
        trigger: "POST /tcm/claims/{claim_id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == PREPARED"
          - "episode.status == SERVICE_PERIOD_CLOSED"
          - "episode.record_posture == OPEN"
          - "episode.billing_eligible == true"
          - "episode.contact_timely == true"
          - "episode.medrec_complete == true"
          - "X-User-ID != claim.prepared_by_user_id"
        side_effects:
          - "Sets submitted_by_user_id to X-User-ID."
      - from: SUBMITTED
        to: PAID
        trigger: "POST /tcm/claims/{claim_id}/adjudicate with outcome PAID"
        actor: ProgramAdmin
        preconditions:
          - "claim.status IN {SUBMITTED, APPEALED}"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets paid_at to current_utc."
          - "Transitions episode.status from SERVICE_PERIOD_CLOSED to BILLED."
          - "Triggers the record_posture freeze evaluation, which now succeeds because no non-terminal claim remains."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /tcm/claims/{claim_id}/adjudicate with outcome DENIED"
        actor: ProgramAdmin
        preconditions:
          - "claim.status IN {SUBMITTED, APPEALED}"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Stores denial_reason_code from the request body. appeal_count is left untouched."
      - from: DENIED
        to: APPEALED
        trigger: "POST /tcm/claims/{claim_id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == DENIED"
          - "claim.appeal_count < MAX_CLAIM_APPEALS"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Increments appeal_count by 1; net_payable_cents is NOT recomputed, so an appeal never double-counts the withhold."
      - from: APPEALED
        to: PAID
        trigger: "POST /tcm/claims/{claim_id}/adjudicate with outcome PAID"
        actor: ProgramAdmin
        preconditions:
          - "claim.status IN {SUBMITTED, APPEALED}"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets paid_at to current_utc and transitions episode.status to BILLED."
      - from: APPEALED
        to: DENIED
        trigger: "POST /tcm/claims/{claim_id}/adjudicate with outcome DENIED"
        actor: ProgramAdmin
        preconditions:
          - "claim.status == APPEALED"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Stores denial_reason_code; the claim may be appealed again while appeal_count is below MAX_CLAIM_APPEALS."
      - from: DENIED
        to: DENIED_FINAL
        trigger: "POST /tcm/claims/{claim_id}/appeal filed when the appeal bound is already exhausted"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == DENIED"
          - "claim.appeal_count == MAX_CLAIM_APPEALS"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Sets net_payable_cents to 0."
          - "The request itself is rejected with ERR_APPEAL_LIMIT_REACHED after the status flip is persisted."
          - "Triggers the record_posture freeze evaluation; the episode freezes only if its status is already in FROZEN_EPISODE_STATUSES, which SERVICE_PERIOD_CLOSED is not."
        note: "DENIED to APPEALED to DENIED is the bounded loop, traversable exactly twice; the third appeal attempt closes the claim as DENIED_FINAL and is itself rejected."
      - from: PREPARED
        to: VOIDED
        trigger: "POST /tcm/claims/{claim_id}/void, or the CareEpisode CLOSED_READMITTED / ADMIN_CLOSED cascade"
        actor: ProgramAdmin
        preconditions:
          - "claim.status IN NON_TERMINAL_CLAIM_STATUSES"
        side_effects:
          - "Sets net_payable_cents to 0."
          - "CASCADE hop 4: triggers the record_posture freeze evaluation, which now succeeds when episode.status is in FROZEN_EPISODE_STATUSES."
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /tcm/claims/{claim_id}/void, or the CareEpisode CLOSED_READMITTED / ADMIN_CLOSED cascade"
        actor: ProgramAdmin
        preconditions:
          - "claim.status IN NON_TERMINAL_CLAIM_STATUSES"
        side_effects:
          - "Sets net_payable_cents to 0."
          - "CASCADE hop 4: triggers the record_posture freeze evaluation."
      - from: DENIED
        to: VOIDED
        trigger: "POST /tcm/claims/{claim_id}/void, or the CareEpisode CLOSED_READMITTED / ADMIN_CLOSED cascade"
        actor: ProgramAdmin
        preconditions:
          - "claim.status IN NON_TERMINAL_CLAIM_STATUSES"
        side_effects:
          - "Sets net_payable_cents to 0 and triggers the freeze evaluation."
      - from: APPEALED
        to: VOIDED
        trigger: "POST /tcm/claims/{claim_id}/void, or the CareEpisode CLOSED_READMITTED / ADMIN_CLOSED cascade"
        actor: ProgramAdmin
        preconditions:
          - "claim.status IN NON_TERMINAL_CLAIM_STATUSES"
        side_effects:
          - "Sets net_payable_cents to 0 and triggers the freeze evaluation."

  - entity: HandoffRequest
    axis: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /tcm/handoffs/{handoff_id}/respond with response ACCEPT"
        actor: CareNavigator
        preconditions:
          - "handoff.status == PROPOSED"
          - "current_utc is on or before handoff.expires_at"
          - "X-User-ID == handoff.to_navigator_id"
          - "episode.record_posture == OPEN"
          - "when handoff_type == INTERNAL_NAVIGATOR, the receiving navigator's workload_score plus the episode's incoming weight is less than or equal to active_episode_cap"
        side_effects:
          - "Sets episode.navigator_id to to_navigator_id."
          - "Decrements the from-navigator's active_episode_count by 1 and increments the to-navigator's by 1; both workload_score and availability_status are recomputed, keeping the sum of active_episode_count across navigators equal to the number of episodes with status IN OPEN_EPISODE_STATUSES."
          - "Sets responded_at to current_utc."
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /tcm/handoffs/{handoff_id}/respond with response DECLINE"
        actor: CareNavigator
        preconditions:
          - "handoff.status == PROPOSED"
          - "current_utc is on or before handoff.expires_at"
          - "X-User-ID == handoff.to_navigator_id"
          - "episode.record_posture == OPEN"
        side_effects:
          - "Stores decline_reason and responded_at; episode.navigator_id is unchanged and no workload counters move."
      - from: PROPOSED
        to: EXPIRED
        trigger: "POST /tcm/episodes/{episode_id}/sla-sweep, phase 3; or a respond call made after expires_at"
        actor: system
        preconditions:
          - "handoff.status == PROPOSED"
          - "current_utc is strictly after handoff.expires_at"
        side_effects:
          - "Leaves episode.navigator_id unchanged."
          - "A respond call that triggers this transition is still rejected with ERR_HANDOFF_EXPIRED after the status flip is persisted."
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /tcm/episodes/{episode_id}/handoffs (a newer proposal), or the record_posture freeze cascade"
        actor: system
        preconditions:
          - "handoff.status == PROPOSED"
        side_effects:
          - "Sets superseded_by_id to the newer HandoffRequest id when a newer proposal caused it, or leaves it null when the freeze cascade caused it."

# ===========================================================================
# 1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: handoff-create-stale-episode
    parent_entity: CareEpisode
    write_endpoint: "POST /tcm/episodes/{episode_id}/handoffs"
    occ_field: "expected_episode_version"
    description: |
      Proposing a HandoffRequest against a CareEpisode whose version has
      advanced since the client last observed it is rejected. A new proposal
      legitimately supersedes any prior PROPOSED handoff on the same episode,
      so a writer working from a stale view of the episode would silently
      cancel a handoff it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: discrepancy-create-stale-medrec
    parent_entity: MedReconciliation
    write_endpoint: "POST /tcm/med-reconciliations/{med_reconciliation_id}/discrepancies"
    occ_field: "expected_med_reconciliation_version"
    description: |
      Adding a MedDiscrepancy to a MedReconciliation whose version has advanced
      since the client last observed it is rejected. Every disposition and
      reopen shifts the resolved/unresolved/deferred counters, so a writer with
      a stale view would append a line item against a conservation state it has
      not seen.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: visit-amend-stale-visit
    parent_entity: TcmVisit
    write_endpoint: "POST /tcm/visits/{visit_id}/amend"
    occ_field: "expected_visit_version"
    description: |
      Amending attested visit documentation whose version has advanced since
      the client last observed it is rejected. An amendment legitimately
      replaces the previously attested element set, so an amendment written
      from a stale view would discard an attestation the writer never read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: readmission_risk_score
    trigger: "POST /tcm/referrals/{referral_id}/accept and POST /tcm/episodes/{episode_id}/risk-assessments; writes RiskAssessment.los_points, acuity_points, comorbidity_points, utilization_points, social_modifier_points, risk_score and CareEpisode.risk_score"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 - length-of-stay component (DUAL VARIANT, selected by stay_type)
      if stay_type == "INPATIENT":
          los_variant = "INPATIENT_DAYS"
          los_points  = min(12, round_half_up(length_of_stay_days * 1.5))
      else:  # stay_type == "OBSERVATION"
          los_variant = "OBSERVATION_HOURS"
          los_points  = min(6, round_half_up(length_of_stay_hours / 12.0))

      # STEP 2 - acuity component (exact table lookup, no rounding)
      acuity_points = {"ELECTIVE": 0, "URGENT": 6, "EMERGENT": 10}[admission_acuity]

      # STEP 3 - comorbidity component
      comorbidity_points = min(20, round_half_up(comorbidity_count * 2.5))

      # STEP 4 - prior-utilization component
      utilization_points = min(24, prior_ed_visits_6mo * 3 + prior_admissions_6mo * 5)

      # STEP 5 - social / barrier modifier
      social_modifier_points = min(10, round_half_up(social_risk_flags_count * 2.5))

      # STEP 6 - ROUNDING ORDER IS PINNED: each of the five components is
      # rounded to a whole number in steps 1-5 BEFORE the sum is taken. The
      # alternative order (sum the raw products, then round once) is WRONG and
      # yields a different risk_score for the same inputs.
      risk_score = min(60, los_points + acuity_points + comorbidity_points
                            + utilization_points + social_modifier_points)
    input_set: "The RiskAssessment row being created. stay_type, length_of_stay_days, length_of_stay_hours and admission_acuity are always copied from the episode's DischargeReferral and are never re-supplied; comorbidity_count, prior_ed_visits_6mo, prior_admissions_6mo and social_risk_flags_count come from the referral on the first assessment and from the request body on every re-assessment."
    constants:
      LOS_INPATIENT_POINTS_PER_DAY: 1.5
      LOS_INPATIENT_POINT_CAP: 12
      LOS_OBSERVATION_HOURS_PER_POINT: 12.0
      LOS_OBSERVATION_POINT_CAP: 6
      ACUITY_POINTS_ELECTIVE: 0
      ACUITY_POINTS_URGENT: 6
      ACUITY_POINTS_EMERGENT: 10
      COMORBIDITY_POINTS_PER_CONDITION: 2.5
      COMORBIDITY_POINT_CAP: 20
      UTILIZATION_POINTS_PER_ED_VISIT: 3
      UTILIZATION_POINTS_PER_ADMISSION: 5
      UTILIZATION_POINT_CAP: 24
      SOCIAL_POINTS_PER_FLAG: 2.5
      SOCIAL_POINT_CAP: 10
      RISK_SCORE_CAP: 60
    precision: "Whole points, round_half_up, applied per component before summation."
    variants:
      - name: inpatient_days
        when: "referral.stay_type == INPATIENT"
        difference: "los_points = min(12, round_half_up(length_of_stay_days * 1.5)); length_of_stay_hours is ignored."
      - name: observation_hours
        when: "referral.stay_type == OBSERVATION"
        difference: "los_points = min(6, round_half_up(length_of_stay_hours / 12.0)); length_of_stay_days is ignored. The cap is half the inpatient cap, so a long observation stay can never out-score a long inpatient stay on this component."

  - name: risk_tier_assignment
    trigger: "Runs immediately after readmission_risk_score; writes RiskAssessment.risk_tier and CareEpisode.risk_tier"
    algorithm: threshold
    formula: |
      if risk_score >= 45: risk_tier = "SEVERE"
      elif risk_score >= 32: risk_tier = "HIGH"
      elif risk_score >= 18: risk_tier = "MODERATE"
      else: risk_tier = "LOW"
      # Every floor is INCLUSIVE and every ceiling is EXCLUSIVE:
      # 17 -> LOW, 18 -> MODERATE, 31 -> MODERATE, 32 -> HIGH,
      # 44 -> HIGH, 45 -> SEVERE.
    input_set: "The risk_score just computed for this RiskAssessment."
    constants:
      RISK_TIER_MODERATE_FLOOR: 18
      RISK_TIER_HIGH_FLOOR: 32
      RISK_TIER_SEVERE_FLOOR: 45
    precision: "Integer comparison; no rounding."

  - name: tier_program_parameters
    trigger: "Runs immediately after risk_tier_assignment; writes CareEpisode.contact_sla_business_days and CareEpisode.required_visit_complexity"
    algorithm: threshold
    formula: |
      contact_sla_business_days = {"LOW": 2, "MODERATE": 2, "HIGH": 2, "SEVERE": 1}[risk_tier]
      required_visit_complexity = {"LOW":      "MODERATE_COMPLEXITY",
                                   "MODERATE": "MODERATE_COMPLEXITY",
                                   "HIGH":     "HIGH_COMPLEXITY",
                                   "SEVERE":   "HIGH_COMPLEXITY"}[risk_tier]
    input_set: "CareEpisode.risk_tier as set by risk_tier_assignment."
    constants:
      CONTACT_SLA_BUSINESS_DAYS_LOW: 2
      CONTACT_SLA_BUSINESS_DAYS_MODERATE: 2
      CONTACT_SLA_BUSINESS_DAYS_HIGH: 2
      CONTACT_SLA_BUSINESS_DAYS_SEVERE: 1
      REQUIRED_COMPLEXITY_LOW: "MODERATE_COMPLEXITY"
      REQUIRED_COMPLEXITY_MODERATE: "MODERATE_COMPLEXITY"
      REQUIRED_COMPLEXITY_HIGH: "HIGH_COMPLEXITY"
      REQUIRED_COMPLEXITY_SEVERE: "HIGH_COMPLEXITY"
    precision: "Exact table lookup."

  - name: contact_deadline_at
    trigger: "Runs after tier_program_parameters on POST /tcm/referrals/{referral_id}/accept, on POST /tcm/episodes/{episode_id}/risk-assessments and whenever POST /tcm/holidays changes the holiday set; writes CareEpisode.contact_deadline_at"
    algorithm: interval_merge
    formula: |
      N = episode.contact_sla_business_days

      # VARIANT A - payer.contact_deadline_basis == "BUSINESS_DAYS" (default)
      #   Walk forward from discharge_date one calendar day at a time. A day
      #   counts only when its weekday is MON..FRI and its date is not in the
      #   declared holiday_dates set. discharge_date itself is day 0 and never
      #   counts, even when it is a business day.
      d = discharge_date
      remaining = N
      while remaining > 0:
          d = d + 1 calendar day
          if weekday(d) in ["MON","TUE","WED","THU","FRI"] and d not in holiday_dates:
              remaining = remaining - 1
      contact_deadline_at = d + "T23:59:59.999Z"

      # VARIANT B - payer.contact_deadline_basis == "CALENDAR_HOURS"
      #   No weekend or holiday skipping at all; the SLA is read as N * 24
      #   wall-clock hours measured from the exact discharge instant.
      contact_deadline_at = discharge_datetime + (N * 24) hours
    input_set: "The episode's payer contact_deadline_basis, the episode's discharge_date and discharge_datetime, the episode's contact_sla_business_days, and the program-wide holiday_dates set declared through POST /tcm/holidays."
    constants:
      BUSINESS_WEEKDAYS: ["MON", "TUE", "WED", "THU", "FRI"]
      END_OF_DAY_TIME_SUFFIX: "T23:59:59.999Z"
      HOURS_PER_SLA_DAY_CALENDAR_VARIANT: 24
    precision: "Millisecond-precision ISO 8601 UTC with three fractional digits."
    variants:
      - name: business_days_basis
        when: "payer.contact_deadline_basis == BUSINESS_DAYS"
        difference: "Weekend days and declared holidays are skipped and the deadline always lands at 23:59:59.999Z on a business date. For a Friday 2026-05-01 discharge with N=2 the deadline is 2026-05-05T23:59:59.999Z."
      - name: calendar_hours_basis
        when: "payer.contact_deadline_basis == CALENDAR_HOURS"
        difference: "N * 24 wall-clock hours from discharge_datetime, landing mid-day and ignoring weekends and holidays entirely. For a 2026-05-01T14:00:00Z discharge with N=2 the deadline is 2026-05-03T14:00:00.000Z, two days earlier than variant A."

  - name: visit_due_date
    trigger: "Runs after tier_program_parameters and on every POST /tcm/episodes/{episode_id}/risk-assessments; writes CareEpisode.visit_due_date and TcmVisit.visit_due_date"
    algorithm: threshold
    formula: |
      if required_visit_complexity == "HIGH_COMPLEXITY":
          visit_due_date = discharge_date + 7 calendar days
      else:
          visit_due_date = discharge_date + 14 calendar days
      visit_deadline_instant = visit_due_date + "T23:59:59.999Z"
      # Calendar days, not business days. discharge_date is day 0; a
      # HIGH_COMPLEXITY episode discharged 2026-05-01 is due 2026-05-08.
    input_set: "CareEpisode.required_visit_complexity and CareEpisode.discharge_date."
    constants:
      VISIT_DUE_DAYS_HIGH_COMPLEXITY: 7
      VISIT_DUE_DAYS_MODERATE_COMPLEXITY: 14
      END_OF_DAY_TIME_SUFFIX: "T23:59:59.999Z"
    precision: "Whole calendar days."
    variants:
      - name: high_complexity_seven_day
        when: "episode.required_visit_complexity == HIGH_COMPLEXITY (risk_tier HIGH or SEVERE)"
        difference: "Seven calendar days from discharge_date."
      - name: moderate_complexity_fourteen_day
        when: "episode.required_visit_complexity == MODERATE_COMPLEXITY (risk_tier LOW or MODERATE)"
        difference: "Fourteen calendar days from discharge_date - exactly twice the window for the same discharge_date."

  - name: visit_deadline_status
    trigger: "POST /tcm/episodes/{episode_id}/visits, POST /tcm/visits/{visit_id}/reschedule, POST /tcm/visits/{visit_id}/complete, POST /tcm/visits/{visit_id}/close-encounter and POST /tcm/episodes/{episode_id}/risk-assessments; writes TcmVisit.deadline_status"
    algorithm: threshold
    formula: |
      deadline = visit_due_date + "T23:59:59.999Z"
      if encounter_status == "COMPLETED":
          deadline_status = "MET" if completed_at <= deadline else "MISSED"
      elif encounter_status in ("NO_SHOW", "CANCELLED"):
          deadline_status = "MISSED" if current_utc > deadline else previous deadline_status
      else:  # SCHEDULED
          deadline_status = "SCHEDULED_IN_WINDOW" if scheduled_start <= deadline else "SCHEDULED_LATE"
    input_set: "The TcmVisit row and its episode's visit_due_date."
    constants:
      END_OF_DAY_TIME_SUFFIX: "T23:59:59.999Z"
    precision: "Millisecond comparison."

  - name: visit_slot_conflict_detection
    trigger: "POST /tcm/episodes/{episode_id}/visits and POST /tcm/visits/{visit_id}/reschedule"
    algorithm: interval_merge
    formula: |
      candidates = TcmVisit rows where navigator_id == request.navigator_id
                   and encounter_status == "SCHEDULED"
                   and id != the visit being rescheduled
      # Half-open new interval [new_start, new_end). A TRAILING-ONLY buffer of
      # 20 minutes is appended to each existing visit's end; there is NO
      # leading buffer before an existing visit's start.
      conflict = any candidate c such that
          new_start < (c.scheduled_end + 20 minutes) and c.scheduled_start < new_end
      # Boundaries: new_start exactly at c.scheduled_end + 20 minutes -> NO
      # conflict. new_start at c.scheduled_end + 19 minutes -> conflict.
      # new_end exactly at c.scheduled_start -> NO conflict (asymmetric).
    input_set: "SCHEDULED TcmVisit rows for the same navigator_id across all episodes; COMPLETED, NO_SHOW and CANCELLED visits never occupy the calendar."
    constants:
      VISIT_TURNAROUND_BUFFER_MINUTES: 20
    precision: "Minute-precision comparison on ISO 8601 UTC instants."

  - name: contact_attempt_cooldown
    trigger: "POST /tcm/episodes/{episode_id}/contact-attempts"
    algorithm: threshold
    formula: |
      prev = the ContactAttempt for this episode with the greatest attempt_number
             (attempt_number is unique per episode, so no tie-break is needed)
      if prev is null:
          allowed = true
      else:
          allowed = (current_utc - prev.attempted_at) >= 240 minutes
      # Point occupancy with a symmetric forward cooldown; the boundary is
      # INCLUSIVE, so exactly 240 minutes after the previous attempt is allowed
      # and 239 minutes is rejected.
    input_set: "All ContactAttempt rows for this episode in any attempt_status."
    constants:
      CONTACT_ATTEMPT_COOLDOWN_MINUTES: 240
    precision: "Minute-precision comparison."

  - name: contact_modality_ladder_position
    trigger: "POST /tcm/episodes/{episode_id}/contact-attempts"
    algorithm: chronological
    formula: |
      attempt_number = episode.contact_attempt_count + 1
      if attempt_number > 4: reject with ERR_CONTACT_ATTEMPT_LIMIT
      required_modality = ["PHONE", "PHONE", "SECURE_MESSAGE", "HOME_VISIT"][attempt_number - 1]
      if request.modality != required_modality: reject with ERR_MODALITY_OUT_OF_SEQUENCE
    input_set: "CareEpisode.contact_attempt_count, which counts every ContactAttempt row created for the episode regardless of its disposition."
    constants:
      MAX_CONTACT_ATTEMPTS: 4
      CONTACT_MODALITY_LADDER: ["PHONE", "PHONE", "SECURE_MESSAGE", "HOME_VISIT"]
    precision: "Exact index lookup."

  - name: medrec_conservation_counters
    trigger: "POST /tcm/med-reconciliations/{med_reconciliation_id}/discrepancies, POST /tcm/discrepancies/{discrepancy_id}/disposition and POST /tcm/discrepancies/{discrepancy_id}/reopen; writes MedReconciliation.discrepancy_count, resolved_count, unresolved_count, deferred_count and blocking_unresolved_count"
    algorithm: aggregation
    formula: |
      discrepancy_count        = count(MedDiscrepancy where med_reconciliation_id == R.id)
      resolved_count           = count(... and status == "RESOLVED")
      unresolved_count         = count(... and status == "UNRESOLVED")
      deferred_count           = count(... and status == "DEFERRED")
      blocking_unresolved_count = count(... and status == "UNRESOLVED"
                                            and severity in ["HIGH", "CRITICAL"])

      # CONSERVATION INVARIANT 1 - must hold after every single mutation:
      #   discrepancy_count == resolved_count + unresolved_count + deferred_count
      # A disposition moves one unit between buckets; a reopen moves it back.
      # Neither creates nor destroys a unit, so the total never drifts.
    input_set: "Every MedDiscrepancy row whose med_reconciliation_id equals this reconciliation, in any status. Discrepancies are never deleted."
    constants:
      BLOCKING_DISCREPANCY_SEVERITIES: ["HIGH", "CRITICAL"]
    precision: "Exact integer counts."

  - name: barrier_sla_due_at
    trigger: "POST /tcm/episodes/{episode_id}/barriers; writes Barrier.sla_hours, blocking_class, owner_role and sla_due_at"
    algorithm: threshold
    formula: |
      sla_hours = {"TRANSPORTATION": 48, "INSURANCE_AUTH": 72, "LANGUAGE": 24,
                   "CAREGIVER_AVAILABILITY": 96, "PHARMACY_ACCESS": 36}[barrier_type]
      blocking_class = barrier_type in ["TRANSPORTATION", "INSURANCE_AUTH", "PHARMACY_ACCESS"]
      owner_role = {"TRANSPORTATION": "CareNavigator", "INSURANCE_AUTH": "BillingSpecialist",
                    "LANGUAGE": "CareNavigator", "CAREGIVER_AVAILABILITY": "CareNavigator",
                    "PHARMACY_ACCESS": "Clinician"}[barrier_type]
      sla_due_at = opened_at + sla_hours hours
      # Breach test used by the sweep is STRICT: current_utc > sla_due_at.
      # Exactly at sla_due_at the barrier is NOT breached.
    input_set: "The Barrier row being created and the logical clock at creation time."
    constants:
      BARRIER_SLA_HOURS_TRANSPORTATION: 48
      BARRIER_SLA_HOURS_INSURANCE_AUTH: 72
      BARRIER_SLA_HOURS_LANGUAGE: 24
      BARRIER_SLA_HOURS_CAREGIVER_AVAILABILITY: 96
      BARRIER_SLA_HOURS_PHARMACY_ACCESS: 36
    precision: "Whole hours added to a millisecond-precision instant."

  - name: redflag_ack_clock_and_promotion
    trigger: "POST /tcm/episodes/{episode_id}/red-flags (initial) and POST /tcm/episodes/{episode_id}/sla-sweep phase 2 (promotion); writes RedFlag.ack_due_at, tier and promotion_count"
    algorithm: decay_function
    formula: |
      ack_sla_minutes = {"TIER_1": 30, "TIER_2": 120, "TIER_3": 480}[tier]
      on raise:      ack_due_at = raised_at + ack_sla_minutes minutes
      on promotion:  tier = {"TIER_3": "TIER_2", "TIER_2": "TIER_1"}[tier]
                     promotion_count = promotion_count + 1
                     ack_due_at = current_utc + {"TIER_1": 30, "TIER_2": 120}[tier] minutes
      # Breach test is STRICT: current_utc > ack_due_at.
      # Bound: promotion stops when tier == "TIER_1" or promotion_count == 2;
      # the flag then goes to BREACHED instead of promoting again. A flag
      # raised at TIER_3 therefore promotes at most twice (TIER_3 -> TIER_2 ->
      # TIER_1) and a flag raised at TIER_2 promotes at most once.
      routing_role = {"TIER_1": "Clinician", "TIER_2": "CareNavigator",
                      "TIER_3": "CareNavigator"}[tier]
    input_set: "The RedFlag row and the logical clock at sweep time. Only flags with status RAISED are processed; ACKNOWLEDGED flags are immune."
    constants:
      REDFLAG_ACK_SLA_MINUTES_TIER_1: 30
      REDFLAG_ACK_SLA_MINUTES_TIER_2: 120
      REDFLAG_ACK_SLA_MINUTES_TIER_3: 480
      MAX_REDFLAG_PROMOTIONS: 2
    precision: "Whole minutes added to a millisecond-precision instant."

  - name: readmission_window_and_effect
    trigger: "POST /tcm/episodes/{episode_id}/readmissions; writes ReadmissionEvent.day_index, counts_toward_rate and the episode/claim side effects"
    algorithm: threshold
    formula: |
      day_index = readmission_date - episode.discharge_date, in whole calendar days
      # Window is HALF-OPEN AT THE LEFT and CLOSED AT THE RIGHT:
      #   day_index == 0  -> ERR_READMISSION_OUT_OF_WINDOW (same-day, excluded)
      #   1 <= day_index <= 30 -> in window
      #   day_index == 31 -> ERR_READMISSION_OUT_OF_WINDOW
      #   day_index < 0   -> ERR_READMISSION_OUT_OF_WINDOW
      counts_toward_rate = (classification == "UNPLANNED_INPATIENT")

      effect by classification:
        UNPLANNED_INPATIENT:
            episode.billing_eligible = false
            if episode.status in ("ACTIVE", "SERVICE_PERIOD_CLOSED"):
                episode.pre_readmission_status = episode.status
                episode.status = "CLOSED_READMITTED"
            if the episode's claim status in ["PREPARED","SUBMITTED","DENIED","APPEALED"]:
                claim.status = "VOIDED"; claim.net_payable_cents = 0
            if the episode's claim status == "PAID":
                episode.recoupment_required = true   # claim is NOT voided
            episode.counted_readmission_count += 1
        PLANNED_INPATIENT, OBSERVATION_ONLY:
            episode.status unchanged; billing_eligible stays true
            if a claim exists: claim.readmission_flagged = true
            episode.excluded_readmission_count += 1
        ED_TREAT_AND_RELEASE:
            fully inert - no episode status change, no claim change,
            no flag; only the event row and the counters move
            episode.excluded_readmission_count += 1

      # CONSERVATION INVARIANT 2 - must hold after every mutation:
      #   episode.readmission_event_count ==
      #       counted_readmission_count + excluded_readmission_count
      #       + retracted_readmission_count
    input_set: "All ReadmissionEvent rows for this episode in any status, plus the episode's single TcmClaim when one exists."
    constants:
      READMISSION_WINDOW_DAYS: 30
      READMISSION_COUNTING_CLASSES: ["UNPLANNED_INPATIENT"]
      READMISSION_VOIDING_CLASSES: ["UNPLANNED_INPATIENT"]
      READMISSION_FLAGGING_CLASSES: ["PLANNED_INPATIENT", "OBSERVATION_ONLY"]
      READMISSION_INERT_CLASSES: ["ED_TREAT_AND_RELEASE"]
    precision: "Whole calendar days."

  - name: service_period_bounds
    trigger: "POST /tcm/referrals/{referral_id}/accept; writes CareEpisode.service_period_end_date and readmission_window_end_date"
    algorithm: threshold
    formula: |
      service_period_start_date  = discharge_date                 # day 0
      service_period_end_date    = discharge_date + 29 days       # 30 calendar days inclusive
      readmission_window_end_date = discharge_date + 30 days      # tracking window right edge
      # POST /tcm/episodes/{episode_id}/close-service-period requires
      #   current_utc > service_period_end_date + "T23:59:59.999Z"
      # so the earliest legal close instant is discharge_date + 30 days at
      # 00:00:00.000Z. Note the deliberate one-day offset: the readmission
      # window is still open on the day the service period first becomes
      # closable.
    input_set: "CareEpisode.discharge_date."
    constants:
      SERVICE_PERIOD_DAYS: 30
      READMISSION_WINDOW_DAYS: 30
      END_OF_DAY_TIME_SUFFIX: "T23:59:59.999Z"
    precision: "Whole calendar days."

  - name: tcm_claim_code_selection
    trigger: "POST /tcm/episodes/{episode_id}/claims; writes TcmClaim.payable_code, payable_variant and base_rate_cents"
    algorithm: threshold
    formula: |
      high_deadline     = discharge_date + 7 days  + "T23:59:59.999Z"
      moderate_deadline = discharge_date + 14 days + "T23:59:59.999Z"
      required = episode.required_visit_complexity
      achieved = visit.achieved_complexity          # set at attestation

      if required == "HIGH_COMPLEXITY" and achieved == "HIGH_COMPLEXITY" \
         and visit.completed_at <= high_deadline:
          payable_code = "99496"
      elif visit.completed_at <= moderate_deadline:
          payable_code = "99495"
      else:
          reject with ERR_VISIT_WINDOW_MISSED

      # No upgrade above the tier the episode required: a MODERATE_COMPLEXITY
      # episode whose visit happened on day 3 with the full high-complexity
      # element set still bills 99495.
      payable_variant = "DOWNGRADED" if (required == "HIGH_COMPLEXITY"
                                         and payable_code == "99495") else "FULL"
      base_rate_cents = 27680 if payable_code == "99496" else 20450
    input_set: "The episode's single ATTESTED or AMENDED TcmVisit with encounter_status COMPLETED, plus the episode's required_visit_complexity and discharge_date."
    constants:
      TCM_HIGH_CODE: "99496"
      TCM_MODERATE_CODE: "99495"
      TCM_HIGH_BASE_RATE_CENTS: 27680
      TCM_MODERATE_BASE_RATE_CENTS: 20450
      VISIT_DUE_DAYS_HIGH_COMPLEXITY: 7
      VISIT_DUE_DAYS_MODERATE_COMPLEXITY: 14
    precision: "Whole cents."
    variants:
      - name: full_high_complexity
        when: "required == HIGH_COMPLEXITY, achieved == HIGH_COMPLEXITY and the visit landed on or before discharge_date + 7 days"
        difference: "payable_code 99496 at base 27680 cents, payable_variant FULL."
      - name: downgraded_to_moderate
        when: "required == HIGH_COMPLEXITY but the visit landed after discharge_date + 7 days, or the high element set was not documented"
        difference: "payable_code 99495 at base 20450 cents, payable_variant DOWNGRADED - the same episode, same visit and same payer produce a different code and a different rate purely on the timing/element fork."

  - name: tcm_claim_net_payable
    trigger: "POST /tcm/episodes/{episode_id}/claims, immediately after tcm_claim_code_selection; writes allowed_cents, coinsurance_cents, net_before_withhold_cents, withhold_pct, withhold_cents and net_payable_cents"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The withhold percentage depends on a figure
      # that only exists after the coinsurance deduction, so the steps cannot be
      # reordered or collapsed into a single expression.
      # STEP 1
      allowed_cents = round_half_up(base_rate_cents * payer.tcm_rate_multiplier)
      # STEP 2 - coinsurance is taken from the ALREADY-ROUNDED allowed_cents,
      #          never from the raw product of step 1.
      coinsurance_cents = round_half_up(allowed_cents * payer.coinsurance_rate)
      # STEP 3
      net_before_withhold_cents = allowed_cents - coinsurance_cents
      # STEP 4 - the withhold tier is keyed on the step-3 figure.
      withhold_pct = 0.03 if net_before_withhold_cents >= 20000 else 0.01
      # STEP 5
      withhold_cents = round_half_up(net_before_withhold_cents * withhold_pct)
      # STEP 6
      net_payable_cents = net_before_withhold_cents - withhold_cents
      # Worked example, payer multiplier 1.0 and coinsurance 0.20:
      #   99496 -> 27680, 5536, 22144, 0.03, 664, 21480
      #   99495 -> 20450, 4090, 16360, 0.01, 164, 16196
      # The withhold TIER itself flips between the two codes.
    input_set: "base_rate_cents from tcm_claim_code_selection and the episode's pinned Payer row."
    constants:
      WITHHOLD_TIER_THRESHOLD_CENTS: 20000
      WITHHOLD_PCT_ABOVE_THRESHOLD: 0.03
      WITHHOLD_PCT_BELOW_THRESHOLD: 0.01
    precision: "Whole cents, round_half_up, applied at each of steps 1, 2 and 5."
    variants:
      - name: high_code_high_withhold
        when: "net_before_withhold_cents >= 20000"
        difference: "3 percent quality withhold."
      - name: moderate_code_low_withhold
        when: "net_before_withhold_cents < 20000"
        difference: "1 percent quality withhold - the same payer and the same rounding rules produce a different withhold rate purely because the code fork moved the net across 20000 cents."

  - name: navigator_workload_score
    trigger: "Every mutation that changes a CareEpisode's navigator_id, status or risk_tier; writes Navigator.active_episode_count, workload_score and availability_status"
    algorithm: aggregation
    formula: |
      active = CareEpisode rows where navigator_id == N.id
               and status in ["INTAKE", "ACTIVE", "SERVICE_PERIOD_CLOSED"]
      active_episode_count = count(active)

      # DUAL VARIANT selected by the navigator's own cap_policy
      if N.cap_policy == "COUNT":
          workload_score  = active_episode_count
          incoming_weight = 1
      else:  # "WEIGHTED"
          weight = {"LOW": 1, "MODERATE": 1, "HIGH": 2, "SEVERE": 3}
          workload_score  = sum(weight[e.risk_tier] for e in active)
          incoming_weight = weight[handed_off_episode.risk_tier]

      availability_status = "AVAILABLE" if workload_score < N.active_episode_cap else "AT_CAP"
      # Handoff accept gate: workload_score + incoming_weight <= active_episode_cap
      # (INCLUSIVE - landing exactly on the cap is allowed).

      # CONSERVATION INVARIANT 3:
      #   sum over all navigators of active_episode_count ==
      #   count of CareEpisode rows with status in
      #   ["INTAKE","ACTIVE","SERVICE_PERIOD_CLOSED"]
      # An accepted handoff decrements one navigator and increments another in
      # the same request, so the global total never drifts.
    input_set: "CareEpisode rows with status in OPEN_EPISODE_STATUSES grouped by navigator_id. Episodes in BILLED, CLOSED_READMITTED or ADMIN_CLOSED never contribute."
    constants:
      WORKLOAD_WEIGHT_LOW: 1
      WORKLOAD_WEIGHT_MODERATE: 1
      WORKLOAD_WEIGHT_HIGH: 2
      WORKLOAD_WEIGHT_SEVERE: 3
      NAVIGATOR_DEFAULT_ACTIVE_EPISODE_CAP: 5
    precision: "Exact integer arithmetic."
    variants:
      - name: count_policy
        when: "navigator.cap_policy == COUNT"
        difference: "Every open episode weighs exactly 1 regardless of risk_tier; a navigator with cap 2 can hold two SEVERE episodes."
      - name: weighted_policy
        when: "navigator.cap_policy == WEIGHTED"
        difference: "Each open episode weighs 1, 1, 2 or 3 by risk_tier; the same two SEVERE episodes score 6 and a navigator with cap 2 cannot hold even one of them plus anything else."

  - name: episode_compliance_flags
    trigger: "POST /tcm/contact-attempts/{contact_attempt_id}/disposition, POST /tcm/visits/{visit_id}/complete, POST /tcm/med-reconciliations/{med_reconciliation_id}/complete, POST /tcm/med-reconciliations/{med_reconciliation_id}/reopen and POST /tcm/episodes/{episode_id}/risk-assessments; writes CareEpisode.contact_timely, visit_timely and medrec_complete"
    algorithm: aggregation
    formula: |
      contact_timely  = successful_contact_at is not null
                        and successful_contact_at <= contact_deadline_at
      visit_timely    = visit_completed_at is not null
                        and visit_completed_at <= visit_due_date + "T23:59:59.999Z"
      medrec_complete = the episode's MedReconciliation exists
                        and its status == "COMPLETED"
      # All three comparisons are INCLUSIVE at the deadline instant.
      # Once POST /tcm/episodes/{episode_id}/close-service-period runs, these
      # three flags are frozen at their then-current values and no later
      # mutation changes them.
    input_set: "The episode's own timestamp fields plus the single MedReconciliation row for the episode."
    constants:
      END_OF_DAY_TIME_SUFFIX: "T23:59:59.999Z"
    precision: "Millisecond comparison."

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The value of X-User-Role appears in the endpoint's declared roles list in section 1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Every field marked required in the endpoint's input is present, has the declared JSON type, and satisfies its numeric or string-format constraint. Unknown body fields are ignored. Includes stay_type-conditional requiredness on POST /tcm/referrals - length_of_stay_days is required when stay_type is INPATIENT, length_of_stay_hours is required when stay_type is OBSERVATION."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints that accept a request body"

  - priority: 4
    category: business_constraint
    check: "Every supplied enum-typed body field carries a declared member value. The complete list of enum-typed body fields is - discharge_disposition, stay_type, admission_acuity (POST /tcm/referrals); outcome (POST /tcm/referrals/{referral_id}/close, POST /tcm/visits/{visit_id}/close-encounter, POST /tcm/barriers/{barrier_id}/close); facility_type, network_status (POST /tcm/facilities); contact_deadline_basis (POST /tcm/payers); cap_policy (POST /tcm/navigators); modality (POST /tcm/episodes/{episode_id}/contact-attempts); outcome (POST /tcm/contact-attempts/{contact_attempt_id}/disposition); documented_elements members (POST /tcm/visits/{visit_id}/complete and POST /tcm/visits/{visit_id}/amend); discrepancy_type, severity (POST /tcm/med-reconciliations/{med_reconciliation_id}/discrepancies); disposition (POST /tcm/discrepancies/{discrepancy_id}/disposition); barrier_type (POST /tcm/episodes/{episode_id}/barriers); category, initial_tier (POST /tcm/episodes/{episode_id}/red-flags); resolution_outcome (POST /tcm/red-flags/{red_flag_id}/resolve); classification (POST /tcm/episodes/{episode_id}/readmissions); handoff_type (POST /tcm/episodes/{episode_id}/handoffs); response (POST /tcm/handoffs/{handoff_id}/respond); outcome, denial_reason_code (POST /tcm/claims/{claim_id}/adjudicate). No other field routes to this error."
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "endpoints listed in the check"

  - priority: 5
    category: existence
    check: "The {episode_id} path segment resolves to an existing CareEpisode."
    error_id: ERR_EPISODE_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {episode_id}"

  - priority: 6
    category: existence
    check: "Every other path id and every body-supplied foreign key resolves to an existing row, validated left-to-right through the path and then in body field declaration order - patient_id, facility_id, payer_id, navigator_id, referral_id, risk_assessment_id, contact_attempt_id, visit_id, med_reconciliation_id, discrepancy_id, barrier_id, red_flag_id, readmission_id, claim_id, handoff_id, to_navigator_id."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 7
    category: business_referential
    check: "A body-supplied reference belongs to the parent named in the path. Loci - POST /tcm/episodes/{episode_id}/claims rejects a visit_id whose TcmVisit.episode_id differs from {episode_id}; POST /tcm/episodes/{episode_id}/handoffs rejects a to_navigator_id equal to the episode's current navigator_id."
    error_id: ERR_ENTITY_LINK_MISMATCH
    http_status: 409
    applies_to: "POST /tcm/episodes/{episode_id}/claims, POST /tcm/episodes/{episode_id}/handoffs"

  - priority: 8
    category: business_referential
    check: "When X-User-Role is CareNavigator, X-User-ID equals the navigator_id of the CareEpisode the target resource belongs to."
    error_id: ERR_NOT_EPISODE_OWNER
    http_status: 403
    applies_to: "every mutating endpoint whose roles include CareNavigator - POST /tcm/episodes/{episode_id}/risk-assessments, POST /tcm/episodes/{episode_id}/contact-attempts, POST /tcm/contact-attempts/{contact_attempt_id}/disposition, POST /tcm/episodes/{episode_id}/visits, POST /tcm/visits/{visit_id}/confirm, POST /tcm/visits/{visit_id}/close-encounter, POST /tcm/visits/{visit_id}/reschedule, POST /tcm/episodes/{episode_id}/barriers, POST /tcm/episodes/{episode_id}/red-flags, POST /tcm/episodes/{episode_id}/handoffs"

  - priority: 9
    category: business_safety
    check: "GLOBAL WRITE GATE. The CareEpisode that owns the target resource has record_posture OPEN. A FROZEN episode rejects every mutation on itself and on every RiskAssessment, ContactAttempt, TcmVisit, MedReconciliation, MedDiscrepancy, Barrier, RedFlag, HandoffRequest and TcmClaim beneath it. Exempt endpoints - POST /tcm/episodes/{episode_id}/readmissions, POST /tcm/readmissions/{readmission_id}/retract, POST /_clock/set_current_utc, and every GET."
    error_id: ERR_EPISODE_RECORDS_FROZEN
    http_status: 409
    applies_to: "every non-exempt mutating endpoint under an episode"

  - priority: 10
    category: state
    check: "The target resource is in a state from which the requested transition is declared in section 1.2. Explicit carve-out - on POST /tcm/episodes/{episode_id}/claims the episode-status precondition is NOT evaluated here; it is evaluated at priority 26 as ERR_SERVICE_PERIOD_OPEN."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints except the claim-preparation episode-status check"

  - priority: 11
    category: business_constraint
    check: "The supplied expected_<parent>_version equals the parent entity's current version. Applies to POST /tcm/episodes/{episode_id}/handoffs (expected_episode_version against CareEpisode.version), POST /tcm/med-reconciliations/{med_reconciliation_id}/discrepancies (expected_med_reconciliation_version against MedReconciliation.version) and POST /tcm/visits/{visit_id}/amend (expected_visit_version against TcmVisit.version)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /tcm/episodes/{episode_id}/handoffs, POST /tcm/med-reconciliations/{med_reconciliation_id}/discrepancies, POST /tcm/visits/{visit_id}/amend"

  - priority: 12
    category: business_safety
    check: "Segregation of duties. On POST /tcm/claims/{claim_id}/submit, X-User-ID must differ from claim.prepared_by_user_id. On POST /tcm/red-flags/{red_flag_id}/resolve, X-User-ID must differ from red_flag.raised_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /tcm/claims/{claim_id}/submit, POST /tcm/red-flags/{red_flag_id}/resolve"

  - priority: 13
    category: business_safety
    check: "INTAKE GAUNTLET RUNG 1. referral.discharge_disposition is a member of ELIGIBLE_DISPOSITIONS - HOME, HOME_HEALTH, SNF_SHORT_TERM, ASSISTED_LIVING."
    error_id: ERR_DISPOSITION_INELIGIBLE
    http_status: 422
    applies_to: "POST /tcm/referrals/{referral_id}/accept"

  - priority: 14
    category: business_temporal
    check: "INTAKE GAUNTLET RUNG 2. The calendar date of referral.referred_at is on or before referral.discharge_date plus INTAKE_WINDOW_DAYS (2) days."
    error_id: ERR_INTAKE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /tcm/referrals/{referral_id}/accept"

  - priority: 15
    category: business_constraint
    check: "INTAKE GAUNTLET RUNG 3. Patient.open_episode_count for referral.patient_id equals 0."
    error_id: ERR_EPISODE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /tcm/referrals/{referral_id}/accept"

  - priority: 16
    category: business_fiscal
    check: "INTAKE GAUNTLET RUNG 4. Payer.tcm_covered is true for referral.payer_id."
    error_id: ERR_PAYER_NOT_COVERED
    http_status: 422
    applies_to: "POST /tcm/referrals/{referral_id}/accept"

  - priority: 17
    category: business_referential
    check: "INTAKE GAUNTLET RUNG 5. Facility.network_status is IN_NETWORK for referral.facility_id."
    error_id: ERR_FACILITY_OUT_OF_NETWORK
    http_status: 422
    applies_to: "POST /tcm/referrals/{referral_id}/accept"

  - priority: 18
    category: business_constraint
    check: "episode.contact_attempt_count is strictly less than MAX_CONTACT_ATTEMPTS (4)."
    error_id: ERR_CONTACT_ATTEMPT_LIMIT
    http_status: 422
    applies_to: "POST /tcm/episodes/{episode_id}/contact-attempts"

  - priority: 19
    category: business_temporal
    check: "Resource temporal-overlap rules. (i) On POST /tcm/episodes/{episode_id}/visits and POST /tcm/visits/{visit_id}/reschedule, the requested half-open interval must not collide with any SCHEDULED TcmVisit of the same navigator_id under calculations.visit_slot_conflict_detection - a 20-minute trailing-only buffer on each existing visit's end. (ii) On POST /tcm/episodes/{episode_id}/contact-attempts, at least CONTACT_ATTEMPT_COOLDOWN_MINUTES (240) minutes must have elapsed since the previous attempt's attempted_at, inclusive at exactly 240."
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /tcm/episodes/{episode_id}/visits, POST /tcm/visits/{visit_id}/reschedule, POST /tcm/episodes/{episode_id}/contact-attempts"

  - priority: 20
    category: business_constraint
    check: "The supplied modality equals CONTACT_MODALITY_LADDER at index (episode.contact_attempt_count) - PHONE, PHONE, SECURE_MESSAGE, HOME_VISIT for attempts 1 through 4."
    error_id: ERR_MODALITY_OUT_OF_SEQUENCE
    http_status: 422
    applies_to: "POST /tcm/episodes/{episode_id}/contact-attempts"

  - priority: 21
    category: business_constraint
    check: "The episode has no Barrier with blocking_class true and status IN {OPEN, ESCALATED}."
    error_id: ERR_BLOCKING_BARRIER_OPEN
    http_status: 422
    applies_to: "POST /tcm/visits/{visit_id}/confirm"

  - priority: 22
    category: business_safety
    check: "The episode has a MedReconciliation and its status is COMPLETED. On POST /tcm/visits/{visit_id}/attest the reconciliation must also have been completed no later than the visit's completed_at instant."
    error_id: ERR_MEDREC_NOT_COMPLETE
    http_status: 422
    applies_to: "POST /tcm/visits/{visit_id}/attest, POST /tcm/claims/{claim_id}/submit"

  - priority: 23
    category: business_safety
    check: "The episode's MedReconciliation has blocking_unresolved_count equal to 0 - no MedDiscrepancy with severity HIGH or CRITICAL sits in status UNRESOLVED."
    error_id: ERR_BLOCKING_DISCREPANCY_UNRESOLVED
    http_status: 422
    applies_to: "POST /tcm/visits/{visit_id}/attest, POST /tcm/med-reconciliations/{med_reconciliation_id}/complete"

  - priority: 24
    category: business_safety
    check: "A discrepancy may be deferred only when its severity is LOW or MODERATE."
    error_id: ERR_DEFERRAL_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /tcm/discrepancies/{discrepancy_id}/disposition with disposition DEFERRED"

  - priority: 25
    category: business_safety
    check: "visit.documented_elements contains every member of MODERATE_REQUIRED_ELEMENTS - MED_REC_REVIEWED, DISCHARGE_SUMMARY_REVIEWED, PATIENT_EDUCATION."
    error_id: ERR_REQUIRED_ELEMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /tcm/visits/{visit_id}/attest"

  - priority: 26
    category: business_temporal
    check: "Service-period gate. On POST /tcm/episodes/{episode_id}/close-service-period, current_utc must be strictly after service_period_end_date end-of-day. On POST /tcm/episodes/{episode_id}/claims, episode.status must equal SERVICE_PERIOD_CLOSED."
    error_id: ERR_SERVICE_PERIOD_OPEN
    http_status: 422
    applies_to: "POST /tcm/episodes/{episode_id}/close-service-period, POST /tcm/episodes/{episode_id}/claims"

  - priority: 27
    category: business_temporal
    check: "day_index computed as readmission_date minus episode.discharge_date is between 1 and 30 inclusive. Day 0 (same-day) and day 31 are both out of window."
    error_id: ERR_READMISSION_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /tcm/episodes/{episode_id}/readmissions"

  - priority: 28
    category: business_referential
    check: "The episode has a TcmVisit with encounter_status COMPLETED and documentation_status IN {ATTESTED, AMENDED}; without one there is no billable service."
    error_id: ERR_CLAIM_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /tcm/episodes/{episode_id}/claims"

  - priority: 29
    category: business_temporal
    check: "visit.completed_at is on or before discharge_date plus VISIT_DUE_DAYS_MODERATE_COMPLEXITY (14) days end-of-day. A visit later than that cannot be billed under either TCM code."
    error_id: ERR_VISIT_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /tcm/episodes/{episode_id}/claims"

  - priority: 30
    category: business_fiscal
    check: "episode.contact_timely is true - the interactive contact succeeded on or before contact_deadline_at."
    error_id: ERR_CONTACT_NOT_TIMELY
    http_status: 422
    applies_to: "POST /tcm/claims/{claim_id}/submit"

  - priority: 31
    category: business_constraint
    check: "No other TcmClaim exists with the same patient_id whose service period overlaps this episode's service period and whose status is not VOIDED. Exactly one billable TCM claim per patient per service period."
    error_id: ERR_DUPLICATE_TCM_CLAIM
    http_status: 409
    applies_to: "POST /tcm/episodes/{episode_id}/claims"

  - priority: 32
    category: business_constraint
    check: "claim.appeal_count is strictly less than MAX_CLAIM_APPEALS (2). When the bound is already exhausted the claim row is first flipped from DENIED to DENIED_FINAL with net_payable_cents zeroed, and the request is then rejected."
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /tcm/claims/{claim_id}/appeal"

  - priority: 33
    category: business_temporal
    check: "current_utc is on or before handoff.expires_at (proposed_at plus 24 hours). The handoff row is flipped to EXPIRED before the rejection is returned."
    error_id: ERR_HANDOFF_EXPIRED
    http_status: 409
    applies_to: "POST /tcm/handoffs/{handoff_id}/respond"

  - priority: 34
    category: business_constraint
    check: "For handoff_type INTERNAL_NAVIGATOR, the receiving navigator's workload_score plus the incoming episode's weight is less than or equal to its active_episode_cap. COMMUNITY_PROGRAM and PCP_PROGRAM handoffs bypass this rung entirely."
    error_id: ERR_NAVIGATOR_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /tcm/handoffs/{handoff_id}/respond with response ACCEPT"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- clock and program configuration -------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time. Every deadline, SLA and window in this API is evaluated against this logical clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Advances or rewinds current_utc; no entity is mutated."]

  - method: POST
    path: "/tcm/holidays"
    description: "Replaces the program-wide holiday date set used by the BUSINESS_DAYS contact-deadline variant."
    roles: [ProgramAdmin]
    code: 200
    input: [holiday_dates]
    output: { holiday_dates: array }
    side_effects:
      - "Recomputes CareEpisode.contact_deadline_at (calculations.contact_deadline_at) for every episode whose payer contact_deadline_basis is BUSINESS_DAYS and whose record_posture is OPEN."
      - "Recomputes CareEpisode.contact_timely for those episodes."

  - method: POST
    path: "/tcm/patients"
    description: "Registers a patient."
    roles: [ProgramAdmin, IntakeCoordinator]
    code: 201
    input: [external_mrn, full_name, date_of_birth, "primary_language?"]
    output: Patient
    side_effects: ["Initializes open_episode_count, lifetime_episode_count and lifetime_readmission_count to 0."]

  - method: GET
    path: "/tcm/patients/{patient_id}"
    description: "Reads one patient including its live episode counters."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/tcm/facilities"
    description: "Registers a discharging facility and its network status."
    roles: [ProgramAdmin]
    code: 201
    input: [name, facility_type, network_status]
    output: Facility
    side_effects: []

  - method: GET
    path: "/tcm/facilities/{facility_id}"
    description: "Reads one facility."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/tcm/payers"
    description: "Registers a payer with its TCM coverage flag, rate multiplier, coinsurance rate and contact-deadline basis."
    roles: [ProgramAdmin]
    code: 201
    input: [name, tcm_covered, "tcm_rate_multiplier?", "coinsurance_rate?", "contact_deadline_basis?"]
    output: Payer
    side_effects: ["Defaults tcm_rate_multiplier to 1.0, coinsurance_rate to 0.2 and contact_deadline_basis to BUSINESS_DAYS when omitted."]

  - method: GET
    path: "/tcm/payers/{payer_id}"
    description: "Reads one payer."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: Payer
    side_effects: []

  - method: POST
    path: "/tcm/navigators"
    description: "Registers a transitional-care navigator with its workload cap and cap policy."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, "active_episode_cap?", "cap_policy?"]
    output: Navigator
    side_effects: ["Defaults active_episode_cap to 5 and cap_policy to COUNT; initializes active_episode_count and workload_score to 0 and availability_status to AVAILABLE."]

  - method: GET
    path: "/tcm/navigators/{navigator_id}"
    description: "Reads one navigator including its live workload_score and availability_status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: Navigator
    side_effects: []

  # ---- discharge referral intake -------------------------------------------
  - method: POST
    path: "/tcm/referrals"
    description: "Records a discharge referral. Creation performs no eligibility screening; the ordered intake gauntlet runs at accept time."
    roles: [IntakeCoordinator]
    code: 201
    input: [patient_id, facility_id, payer_id, discharge_date, discharge_datetime, discharge_disposition, stay_type, "length_of_stay_days?", "length_of_stay_hours?", admission_acuity, comorbidity_count, prior_ed_visits_6mo, prior_admissions_6mo, social_risk_flags_count]
    output: DischargeReferral
    side_effects: ["Stamps referred_at with current_utc and status RECEIVED."]

  - method: GET
    path: "/tcm/referrals/{referral_id}"
    description: "Reads one discharge referral."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: DischargeReferral
    side_effects: []

  - method: GET
    path: "/tcm/referrals"
    description: "Lists discharge referrals, filterable by patient, facility, payer and status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["patient_id?", "facility_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: DischargeReferral[]
    side_effects: []

  - method: POST
    path: "/tcm/referrals/{referral_id}/accept"
    description: "Runs the ordered intake gauntlet and, on success, mints the CareEpisode, its first RiskAssessment and every tier-derived deadline."
    roles: [IntakeCoordinator]
    code: 200
    input: [navigator_id]
    output: DischargeReferral
    side_effects:
      - "Creates one CareEpisode in INTAKE with record_posture OPEN and sets referral.created_episode_id."
      - "Creates the episode's first RiskAssessment (calculations.readmission_risk_score, risk_tier_assignment)."
      - "Sets episode contact_sla_business_days and required_visit_complexity (calculations.tier_program_parameters), contact_deadline_at (calculations.contact_deadline_at), visit_due_date (calculations.visit_due_date) and both period bounds (calculations.service_period_bounds)."
      - "Increments Patient.open_episode_count and Patient.lifetime_episode_count."
      - "Increments Navigator.active_episode_count and recomputes workload_score and availability_status (calculations.navigator_workload_score)."

  - method: POST
    path: "/tcm/referrals/{referral_id}/close"
    description: "Closes a referral without opening an episode, as DENIED or WITHDRAWN."
    roles: [IntakeCoordinator]
    code: 200
    input: [outcome, closure_reason_code]
    output: DischargeReferral
    side_effects: ["Sets status to DENIED or WITHDRAWN and stores closure_reason_code. No CareEpisode is created."]

  # ---- care episode --------------------------------------------------------
  - method: GET
    path: "/tcm/episodes/{episode_id}"
    description: "Reads one care episode with every derived field, both status axes and all four readmission counters."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: CareEpisode
    side_effects: []

  - method: GET
    path: "/tcm/episodes"
    description: "Lists care episodes, filterable by patient, navigator, referral, payer, facility and status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["patient_id?", "navigator_id?", "referral_id?", "payer_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: CareEpisode[]
    side_effects: []

  - method: POST
    path: "/tcm/episodes/{episode_id}/close-service-period"
    description: "Closes the 30-day TCM service period, freezing the three compliance flags and unlocking claim preparation."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CareEpisode
    side_effects:
      - "Transitions status ACTIVE to SERVICE_PERIOD_CLOSED."
      - "Freezes contact_timely, visit_timely and medrec_complete at their current values."

  - method: POST
    path: "/tcm/episodes/{episode_id}/admin-close"
    description: "Administratively closes an episode, voiding any non-terminal claim and releasing navigator and patient counters."
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: CareEpisode
    side_effects:
      - "Transitions status to ADMIN_CLOSED."
      - "Voids any TcmClaim in PREPARED, SUBMITTED, DENIED or APPEALED and zeroes its net_payable_cents."
      - "Triggers the record_posture freeze evaluation and its three-branch cascade."
      - "Decrements Navigator.active_episode_count and Patient.open_episode_count."

  - method: POST
    path: "/tcm/episodes/{episode_id}/sla-sweep"
    description: "Ops-run checkpoint. Phase 1 escalates breached blocking barriers, phase 2 promotes or breaches unacknowledged red flags, phase 3 expires stale handoff proposals. A red flag created by phase 1 is NEVER processed by phase 2 in the same sweep."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { barriers_escalated: integer, red_flags_created: integer, red_flags_promoted: integer, red_flags_breached: integer, handoffs_expired: integer }
    side_effects:
      - "Phase 1 - each OPEN blocking Barrier past sla_due_at becomes ESCALATED and spawns a TIER_2 RedFlag, and reverts CONFIRMED scheduled visits to UNCONFIRMED."
      - "Phase 2 - each RAISED RedFlag past ack_due_at either promotes one tier (calculations.redflag_ack_clock_and_promotion) or becomes BREACHED when its bound is reached."
      - "Phase 3 - each PROPOSED HandoffRequest past expires_at becomes EXPIRED."
      - "Recomputes episode.open_red_flag_count and escalation_state."

  # ---- risk assessment -----------------------------------------------------
  - method: POST
    path: "/tcm/episodes/{episode_id}/risk-assessments"
    description: "Re-scores the episode with updated comorbidity, utilization and social inputs, superseding the prior assessment and re-deriving every tier-driven deadline."
    roles: [CareNavigator]
    code: 201
    input: [comorbidity_count, prior_ed_visits_6mo, prior_admissions_6mo, social_risk_flags_count]
    output: RiskAssessment
    side_effects:
      - "CASCADE hop 1 - creates a RiskAssessment with is_current true and supersedes_id set to the prior current assessment, which flips is_current to false."
      - "CASCADE hop 2 - updates CareEpisode.risk_score, risk_tier, current_risk_assessment_id, contact_sla_business_days, required_visit_complexity, contact_deadline_at and visit_due_date."
      - "CASCADE hop 3 - updates every non-terminal TcmVisit's required_complexity, visit_due_date and deadline_status; a SCHEDULED visit whose scheduled_start now sits past the new due date flips to SCHEDULED_LATE."
      - "CASCADE hop 4 - each visit that flipped to SCHEDULED_LATE spawns a RedFlag with category VISIT_WINDOW_AT_RISK and initial_tier TIER_2, incrementing episode.open_red_flag_count and setting escalation_state to ACTIVE."
      - "Recomputes contact_timely (calculations.episode_compliance_flags)."

  - method: GET
    path: "/tcm/risk-assessments/{risk_assessment_id}"
    description: "Reads one risk assessment with its five component scores."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: []

  - method: GET
    path: "/tcm/risk-assessments"
    description: "Lists risk assessments, filterable by episode, superseded predecessor and currency."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["episode_id?", "supersedes_id?", "is_current?", "limit?", "offset?"]
    output: RiskAssessment[]
    side_effects: []

  # ---- interactive contact -------------------------------------------------
  - method: POST
    path: "/tcm/episodes/{episode_id}/contact-attempts"
    description: "Logs a follow-up outreach attempt. Enforces the four-attempt cap, the modality ladder and the 240-minute cooldown."
    roles: [CareNavigator]
    code: 201
    input: [modality, "notes?"]
    output: ContactAttempt
    side_effects:
      - "Assigns attempt_number as episode.contact_attempt_count plus 1 and stamps attempted_at with current_utc."
      - "Increments episode.contact_attempt_count."
      - "Transitions episode.status INTAKE to ACTIVE and contact_status NOT_STARTED to IN_PROGRESS on the first attempt."

  - method: GET
    path: "/tcm/contact-attempts/{contact_attempt_id}"
    description: "Reads one contact attempt."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: ContactAttempt
    side_effects: []

  - method: GET
    path: "/tcm/contact-attempts"
    description: "Lists contact attempts, filterable by episode and attempt status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["episode_id?", "attempt_status?", "limit?", "offset?"]
    output: ContactAttempt[]
    side_effects: []

  - method: POST
    path: "/tcm/contact-attempts/{contact_attempt_id}/disposition"
    description: "Records the outcome of a logged attempt. CONNECTED is the only outcome that establishes successful interactive contact."
    roles: [CareNavigator]
    code: 200
    input: [outcome]
    output: ContactAttempt
    side_effects:
      - "CONNECTED sets episode.contact_status SUCCESSFUL, successful_contact_at and recomputes contact_timely."
      - "REFUSED sets episode.contact_status REFUSED and spawns a TIER_3 RedFlag with category CONTACT_REFUSED."
      - "NO_ANSWER and VOICEMAIL leave contact_status at IN_PROGRESS."

  # ---- TCM face-to-face visit ---------------------------------------------
  - method: POST
    path: "/tcm/episodes/{episode_id}/visits"
    description: "Books the TCM face-to-face slot on a navigator's calendar. Rejects intervals colliding with an existing SCHEDULED visit of the same navigator under the 20-minute trailing buffer."
    roles: [CareNavigator]
    code: 201
    input: [navigator_id, scheduled_start, scheduled_end]
    output: TcmVisit
    side_effects:
      - "Copies required_complexity and visit_due_date from the episode."
      - "Sets encounter_status SCHEDULED, documentation_status DRAFT, confirmation_status UNCONFIRMED."
      - "Sets deadline_status via calculations.visit_deadline_status."

  - method: GET
    path: "/tcm/visits/{visit_id}"
    description: "Reads one visit with both of its independent status axes."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: TcmVisit
    side_effects: []

  - method: GET
    path: "/tcm/visits"
    description: "Lists visits, filterable by episode, navigator and either status axis."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["episode_id?", "navigator_id?", "encounter_status?", "documentation_status?", "limit?", "offset?"]
    output: TcmVisit[]
    side_effects: []

  - method: POST
    path: "/tcm/visits/{visit_id}/confirm"
    description: "Confirms the appointment with the patient. Suppressed while any blocking barrier on the episode is OPEN or ESCALATED."
    roles: [CareNavigator]
    code: 200
    input: []
    output: TcmVisit
    side_effects: ["Sets confirmation_status to CONFIRMED."]

  - method: POST
    path: "/tcm/visits/{visit_id}/complete"
    description: "Records the completed face-to-face encounter and the documented service elements. Requires a confirmed appointment and successful interactive contact."
    roles: [Clinician]
    code: 200
    input: [documented_elements]
    output: TcmVisit
    side_effects:
      - "Sets encounter_status COMPLETED, completed_at and episode.visit_completed_at to current_utc."
      - "Sets deadline_status to MET or MISSED via calculations.visit_deadline_status."
      - "Recomputes episode.visit_timely via calculations.episode_compliance_flags."

  - method: POST
    path: "/tcm/visits/{visit_id}/close-encounter"
    description: "Closes a scheduled encounter as NO_SHOW or CANCELLED, releasing the navigator calendar interval."
    roles: [CareNavigator]
    code: 200
    input: [outcome]
    output: TcmVisit
    side_effects:
      - "Sets encounter_status to NO_SHOW or CANCELLED."
      - "Recomputes deadline_status; past the due instant it becomes MISSED."

  - method: POST
    path: "/tcm/visits/{visit_id}/reschedule"
    description: "Re-books a NO_SHOW visit into a new slot, re-running the double-booking check and resetting confirmation."
    roles: [CareNavigator]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: TcmVisit
    side_effects:
      - "Sets encounter_status back to SCHEDULED and confirmation_status back to UNCONFIRMED."
      - "Recomputes deadline_status as SCHEDULED_IN_WINDOW or SCHEDULED_LATE."

  - method: POST
    path: "/tcm/visits/{visit_id}/attest"
    description: "Attests the visit documentation. Gated on a COMPLETED reconciliation with no blocking unresolved discrepancy and on the moderate required-element set."
    roles: [Clinician]
    code: 200
    input: []
    output: TcmVisit
    side_effects:
      - "Sets documentation_status to ATTESTED, attested_by_user_id to X-User-ID and attested_at to current_utc."
      - "Sets achieved_complexity to HIGH_COMPLEXITY when documented_elements covers HIGH_REQUIRED_ELEMENTS, otherwise MODERATE_COMPLEXITY."

  - method: POST
    path: "/tcm/visits/{visit_id}/amend"
    description: "Replaces the attested element set under an optimistic-concurrency check on the visit's own version."
    roles: [Clinician]
    code: 200
    input: [documented_elements, expected_visit_version]
    output: TcmVisit
    side_effects:
      - "Sets documentation_status to AMENDED, replaces documented_elements, increments amendment_count."
      - "Recomputes achieved_complexity."
      - "Increments TcmVisit.version by 1."

  # ---- medication reconciliation ------------------------------------------
  - method: POST
    path: "/tcm/episodes/{episode_id}/med-reconciliations"
    description: "Opens the episode's single medication reconciliation. A second attempt for the same episode is rejected."
    roles: [Clinician]
    code: 201
    input: []
    output: MedReconciliation
    side_effects: ["Sets status OPEN, all four counters to 0 and performed_by_user_id to X-User-ID."]

  - method: GET
    path: "/tcm/med-reconciliations/{med_reconciliation_id}"
    description: "Reads one reconciliation with its conservation counters."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: MedReconciliation
    side_effects: []

  - method: GET
    path: "/tcm/med-reconciliations"
    description: "Lists reconciliations, filterable by episode and status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["episode_id?", "status?", "limit?", "offset?"]
    output: MedReconciliation[]
    side_effects: []

  - method: POST
    path: "/tcm/med-reconciliations/{med_reconciliation_id}/discrepancies"
    description: "Appends a discrepancy line item under an optimistic-concurrency check on the reconciliation's version."
    roles: [Clinician]
    code: 201
    input: [medication_name, discrepancy_type, severity, expected_med_reconciliation_version]
    output: MedDiscrepancy
    side_effects:
      - "Creates the line item in UNRESOLVED."
      - "Increments MedReconciliation.discrepancy_count and unresolved_count, and blocking_unresolved_count when severity is HIGH or CRITICAL."
      - "Transitions MedReconciliation OPEN to IN_REVIEW on the first line item."
      - "Increments MedReconciliation.version by 1."

  - method: GET
    path: "/tcm/discrepancies/{discrepancy_id}"
    description: "Reads one discrepancy line item."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: MedDiscrepancy
    side_effects: []

  - method: GET
    path: "/tcm/discrepancies"
    description: "Lists discrepancy line items, filterable by reconciliation, severity and status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["med_reconciliation_id?", "severity?", "status?", "limit?", "offset?"]
    output: MedDiscrepancy[]
    side_effects: []

  - method: POST
    path: "/tcm/discrepancies/{discrepancy_id}/disposition"
    description: "Moves an UNRESOLVED line item to RESOLVED or DEFERRED. HIGH and CRITICAL line items may not be deferred."
    roles: [Clinician]
    code: 200
    input: [disposition, "resolution_note?"]
    output: MedDiscrepancy
    side_effects:
      - "Moves one unit between the parent's unresolved_count and either resolved_count or deferred_count, preserving discrepancy_count == resolved_count + unresolved_count + deferred_count."
      - "Recomputes blocking_unresolved_count."

  - method: POST
    path: "/tcm/discrepancies/{discrepancy_id}/reopen"
    description: "Returns a RESOLVED or DEFERRED line item to UNRESOLVED. Permitted while the parent reconciliation is OPEN, IN_REVIEW or COMPLETED, and never changes the parent's status."
    roles: [Clinician]
    code: 200
    input: []
    output: MedDiscrepancy
    side_effects:
      - "Moves one unit back into the parent's unresolved_count, preserving the conservation identity."
      - "Recomputes blocking_unresolved_count; a HIGH or CRITICAL item re-blocks attestation even though the reconciliation still reads COMPLETED."

  - method: POST
    path: "/tcm/med-reconciliations/{med_reconciliation_id}/complete"
    description: "Completes the reconciliation. Allowed from OPEN with zero line items or from IN_REVIEW with no blocking unresolved item."
    roles: [Clinician]
    code: 200
    input: []
    output: MedReconciliation
    side_effects:
      - "Sets status COMPLETED and completed_at to current_utc."
      - "Sets episode.medrec_complete to true."

  - method: POST
    path: "/tcm/med-reconciliations/{med_reconciliation_id}/reopen"
    description: "Reopens a COMPLETED reconciliation back to IN_REVIEW."
    roles: [Clinician]
    code: 200
    input: []
    output: MedReconciliation
    side_effects:
      - "Sets status IN_REVIEW, clears completed_at, increments reopen_count."
      - "Sets episode.medrec_complete to false."

  # ---- typed barriers ------------------------------------------------------
  - method: POST
    path: "/tcm/episodes/{episode_id}/barriers"
    description: "Raises a typed barrier. The type fixes the SLA hours, the owning role and whether the barrier blocks appointment confirmation."
    roles: [CareNavigator]
    code: 201
    input: [barrier_type, "description?"]
    output: Barrier
    side_effects:
      - "Derives blocking_class, owner_role, sla_hours and sla_due_at via calculations.barrier_sla_due_at."
      - "Stamps opened_at with current_utc and sets status OPEN."

  - method: GET
    path: "/tcm/barriers/{barrier_id}"
    description: "Reads one barrier."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: Barrier
    side_effects: []

  - method: GET
    path: "/tcm/barriers"
    description: "Lists barriers, filterable by episode, type and status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["episode_id?", "barrier_type?", "status?", "limit?", "offset?"]
    output: Barrier[]
    side_effects: []

  - method: POST
    path: "/tcm/barriers/{barrier_id}/close"
    description: "Closes a barrier as RESOLVED by its owning role, or as WAIVED by a ProgramAdmin."
    roles: [CareNavigator, BillingSpecialist, Clinician, ProgramAdmin]
    code: 200
    input: [outcome]
    output: Barrier
    side_effects:
      - "Sets status to RESOLVED or WAIVED and closed_at to current_utc."
      - "A RedFlag already spawned by an escalation is left untouched and keeps its own acknowledgement clock."

  # ---- red flags -----------------------------------------------------------
  - method: POST
    path: "/tcm/episodes/{episode_id}/red-flags"
    description: "Raises a clinical red flag at a chosen severity tier, starting that tier's acknowledgement clock."
    roles: [CareNavigator, Clinician]
    code: 201
    input: [category, initial_tier]
    output: RedFlag
    side_effects:
      - "Sets tier to initial_tier, promotion_count 0, status RAISED, raised_by_user_id to X-User-ID and raised_at to current_utc."
      - "Sets ack_due_at via calculations.redflag_ack_clock_and_promotion."
      - "Increments episode.open_red_flag_count and sets escalation_state ACTIVE."

  - method: GET
    path: "/tcm/red-flags/{red_flag_id}"
    description: "Reads one red flag with its current tier and promotion count."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: RedFlag
    side_effects: []

  - method: GET
    path: "/tcm/red-flags"
    description: "Lists red flags, filterable by episode, spawning barrier, tier and status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["episode_id?", "source_barrier_id?", "tier?", "status?", "limit?", "offset?"]
    output: RedFlag[]
    side_effects: []

  - method: POST
    path: "/tcm/red-flags/{red_flag_id}/acknowledge"
    description: "Acknowledges a RAISED red flag. Only the routing role for the flag's CURRENT tier may acknowledge it."
    roles: [CareNavigator, Clinician]
    code: 200
    input: []
    output: RedFlag
    side_effects:
      - "Sets status ACKNOWLEDGED, acknowledged_by_user_id to X-User-ID and acknowledged_at to current_utc."
      - "Stops the promotion clock permanently for this flag."

  - method: POST
    path: "/tcm/red-flags/{red_flag_id}/resolve"
    description: "Resolves an ACKNOWLEDGED red flag with a clinical outcome. The resolver may not be the actor who raised it."
    roles: [CareNavigator, Clinician]
    code: 200
    input: [resolution_outcome]
    output: RedFlag
    side_effects:
      - "Sets status RESOLVED and stores resolution_outcome."
      - "Decrements episode.open_red_flag_count; escalation_state returns to NONE at 0."
      - "resolution_outcome SENT_TO_ED creates an ED_TREAT_AND_RELEASE ReadmissionEvent dated the current date when that date lies inside the 30-day window, otherwise sets ed_event_suppressed true."

  # ---- 30-day readmission tracking ----------------------------------------
  - method: POST
    path: "/tcm/episodes/{episode_id}/readmissions"
    description: "Records a readmission inside the 30-day tracking window. Exempt from the record-freeze gate so post-billing readmissions can still be tracked."
    roles: [ProgramAdmin]
    code: 201
    input: [readmission_date, classification]
    output: ReadmissionEvent
    side_effects:
      - "CASCADE hop 1 - creates the event, sets day_index and counts_toward_rate, bumps episode.readmission_event_count and either counted_readmission_count or excluded_readmission_count."
      - "CASCADE hop 2 - UNPLANNED_INPATIENT drives episode.status to CLOSED_READMITTED and billing_eligible to false."
      - "CASCADE hop 3 - the CLOSED_READMITTED transition voids any non-terminal TcmClaim; a PAID claim instead sets episode.recoupment_required."
      - "CASCADE hop 4 - the claim reaching a terminal status drives record_posture OPEN to FROZEN."
      - "CASCADE hop 5 - the freeze supersedes PROPOSED handoffs and closes open barriers and red flags administratively."
      - "PLANNED_INPATIENT and OBSERVATION_ONLY only set TcmClaim.readmission_flagged; ED_TREAT_AND_RELEASE is fully inert."

  - method: GET
    path: "/tcm/readmissions/{readmission_id}"
    description: "Reads one readmission event."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: ReadmissionEvent
    side_effects: []

  - method: GET
    path: "/tcm/readmissions"
    description: "Lists readmission events, filterable by episode, spawning red flag, classification and status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["episode_id?", "source_red_flag_id?", "classification?", "status?", "limit?", "offset?"]
    output: ReadmissionEvent[]
    side_effects: []

  - method: POST
    path: "/tcm/readmissions/{readmission_id}/retract"
    description: "Retracts a recorded readmission, compensating every counter it moved. Exempt from the record-freeze gate."
    roles: [ProgramAdmin]
    code: 200
    input: [retraction_reason]
    output: ReadmissionEvent
    side_effects:
      - "Moves one unit from counted_readmission_count or excluded_readmission_count into retracted_readmission_count, leaving readmission_event_count unchanged."
      - "Restores episode.status from pre_readmission_status and billing_eligible to true for an UNPLANNED_INPATIENT event."
      - "Clears TcmClaim.readmission_flagged when no other flagging event remains."
      - "The VOIDED claim is not reinstated."

  # ---- TCM-code billing ----------------------------------------------------
  - method: POST
    path: "/tcm/episodes/{episode_id}/claims"
    description: "Prepares the episode's single TCM claim, deriving the payable code, variant and every money field. Legal only once the service period is closed."
    roles: [BillingSpecialist]
    code: 201
    input: [visit_id]
    output: TcmClaim
    side_effects:
      - "Runs calculations.tcm_claim_code_selection then calculations.tcm_claim_net_payable."
      - "Sets prepared_by_user_id to X-User-ID and status PREPARED."
      - "Sets episode.claim_id."

  - method: GET
    path: "/tcm/claims/{claim_id}"
    description: "Reads one claim with its full money breakdown."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: TcmClaim
    side_effects: []

  - method: GET
    path: "/tcm/claims"
    description: "Lists claims, filterable by episode, patient, visit, payer and status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["episode_id?", "patient_id?", "visit_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: TcmClaim[]
    side_effects: []

  - method: POST
    path: "/tcm/claims/{claim_id}/submit"
    description: "Submits a prepared claim to the payer. The submitter must not be the preparer."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: TcmClaim
    side_effects: ["Sets status SUBMITTED and submitted_by_user_id to X-User-ID."]

  - method: POST
    path: "/tcm/claims/{claim_id}/adjudicate"
    description: "Records the payer's response on a SUBMITTED or APPEALED claim."
    roles: [ProgramAdmin]
    code: 200
    input: [outcome, "denial_reason_code?"]
    output: TcmClaim
    side_effects:
      - "PAID sets paid_at, drives episode.status SERVICE_PERIOD_CLOSED to BILLED and triggers the freeze evaluation."
      - "DENIED from SUBMITTED or from APPEALED sets status DENIED and stores denial_reason_code; appeal_count is never touched here."

  - method: POST
    path: "/tcm/claims/{claim_id}/appeal"
    description: "Appeals a DENIED claim. Bounded at two appeals; the money fields are never recomputed so the withhold is never double-counted. A third attempt closes the claim as DENIED_FINAL and is itself rejected with ERR_APPEAL_LIMIT_REACHED."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: TcmClaim
    side_effects:
      - "With appeal_count below 2, sets status APPEALED and increments appeal_count by 1."
      - "With appeal_count already equal to 2, sets status DENIED_FINAL and net_payable_cents to 0, triggers the freeze evaluation, and returns ERR_APPEAL_LIMIT_REACHED."

  - method: POST
    path: "/tcm/claims/{claim_id}/void"
    description: "Voids a non-terminal claim."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: TcmClaim
    side_effects:
      - "Sets status VOIDED and net_payable_cents to 0."
      - "Triggers the record_posture freeze evaluation."

  # ---- care-team handoff ---------------------------------------------------
  - method: POST
    path: "/tcm/episodes/{episode_id}/handoffs"
    description: "Proposes transfer of episode accountability under an optimistic-concurrency check on the episode's version. A new proposal supersedes any PROPOSED predecessor."
    roles: [CareNavigator]
    code: 201
    input: [to_navigator_id, handoff_type, expected_episode_version]
    output: HandoffRequest
    side_effects:
      - "Sets from_navigator_id to the episode's current navigator_id, status PROPOSED, proposed_at to current_utc and expires_at to proposed_at plus 24 hours."
      - "Transitions any PROPOSED HandoffRequest of this episode to SUPERSEDED with superseded_by_id set to the new row."
      - "Increments CareEpisode.version by 1."

  - method: GET
    path: "/tcm/handoffs/{handoff_id}"
    description: "Reads one handoff request."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: []
    output: HandoffRequest
    side_effects: []

  - method: GET
    path: "/tcm/handoffs"
    description: "Lists handoff requests, filterable by episode, sending navigator, receiving navigator and status."
    roles: [ProgramAdmin, IntakeCoordinator, CareNavigator, Clinician, BillingSpecialist]
    code: 200
    input: ["episode_id?", "from_navigator_id?", "to_navigator_id?", "status?", "limit?", "offset?"]
    output: HandoffRequest[]
    side_effects: []

  - method: POST
    path: "/tcm/handoffs/{handoff_id}/respond"
    description: "Accepts or declines a proposed handoff. Only the receiving navigator may respond, only before expiry, and an INTERNAL_NAVIGATOR acceptance is subject to the receiver's workload cap."
    roles: [CareNavigator]
    code: 200
    input: [response, "decline_reason?"]
    output: HandoffRequest
    side_effects:
      - "ACCEPT sets status ACCEPTED, moves episode.navigator_id, decrements the sender's active_episode_count and increments the receiver's, and recomputes both workload_score and availability_status."
      - "DECLINE sets status DECLINED and stores decline_reason; no counter moves."
      - "A response after expires_at flips the row to EXPIRED and is rejected."

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed for the endpoint, or a barrier close with outcome RESOLVED is attempted by a role other than the barrier's owner_role, or a barrier close with outcome WAIVED is attempted by a role other than ProgramAdmin, or a red-flag acknowledgement is attempted by a role other than the routing role for the flag's current tier."
  - id: ERR_VALIDATION
    http: 400
    condition: "A required body field is absent, has the wrong JSON type, or violates its declared numeric or format constraint; includes stay_type-conditional requiredness of length_of_stay_days and length_of_stay_hours, and scheduled_end not strictly after scheduled_start."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "An enum-typed body field named in validation priority 4 carries a value outside its declared member list."
  - id: ERR_EPISODE_NOT_FOUND
    http: 404
    condition: "The {episode_id} path segment does not resolve to a CareEpisode."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Any other path id or body-supplied foreign key does not resolve to an existing row."
  - id: ERR_ENTITY_LINK_MISMATCH
    http: 409
    condition: "A claim preparation supplies a visit_id belonging to a different episode, or a handoff proposal names the episode's current navigator as the receiver."
  - id: ERR_NOT_EPISODE_OWNER
    http: 403
    condition: "A CareNavigator acts on a resource whose episode has a different navigator_id than the acting X-User-ID."
  - id: ERR_EPISODE_RECORDS_FROZEN
    http: 409
    condition: "A non-exempt mutation targets an episode, or any child of an episode, whose record_posture is FROZEN."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared; includes opening a second MedReconciliation for an episode, logging a contact attempt while an earlier attempt is still LOGGED or while contact_status is SUCCESSFUL or REFUSED, and completing a visit whose episode contact_status is not SUCCESSFUL."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_episode_version, expected_med_reconciliation_version or expected_visit_version does not equal the parent's current version."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A claim is submitted by the same X-User-ID that prepared it, or a red flag is resolved by the same X-User-ID that raised it."
  - id: ERR_DISPOSITION_INELIGIBLE
    http: 422
    condition: "Intake gauntlet rung 1 - the referral's discharge_disposition is not one of HOME, HOME_HEALTH, SNF_SHORT_TERM, ASSISTED_LIVING."
  - id: ERR_INTAKE_WINDOW_EXPIRED
    http: 422
    condition: "Intake gauntlet rung 2 - the referral was recorded more than 2 calendar days after the discharge date."
  - id: ERR_EPISODE_ALREADY_OPEN
    http: 409
    condition: "Intake gauntlet rung 3 - the patient already has a CareEpisode in INTAKE, ACTIVE or SERVICE_PERIOD_CLOSED."
  - id: ERR_PAYER_NOT_COVERED
    http: 422
    condition: "Intake gauntlet rung 4 - the referral's payer has tcm_covered false."
  - id: ERR_FACILITY_OUT_OF_NETWORK
    http: 422
    condition: "Intake gauntlet rung 5 - the referral's facility has network_status OUT_OF_NETWORK."
  - id: ERR_CONTACT_ATTEMPT_LIMIT
    http: 422
    condition: "A fifth contact attempt is logged for an episode that already has 4."
  - id: ERR_SCHEDULE_CONFLICT
    http: 409
    condition: "A visit interval collides with an existing SCHEDULED visit of the same navigator under the 20-minute trailing buffer, or a contact attempt is logged fewer than 240 minutes after the previous attempt."
  - id: ERR_MODALITY_OUT_OF_SEQUENCE
    http: 422
    condition: "The supplied modality does not match the ladder position for the attempt number."
  - id: ERR_BLOCKING_BARRIER_OPEN
    http: 422
    condition: "Appointment confirmation is attempted while a blocking-class barrier on the episode is OPEN or ESCALATED."
  - id: ERR_MEDREC_NOT_COMPLETE
    http: 422
    condition: "Attestation or claim submission is attempted while the episode's medication reconciliation is absent or not COMPLETED, or was completed after the visit's completed_at instant."
  - id: ERR_BLOCKING_DISCREPANCY_UNRESOLVED
    http: 422
    condition: "Attestation or reconciliation completion is attempted while a HIGH or CRITICAL discrepancy sits in UNRESOLVED."
  - id: ERR_DEFERRAL_NOT_PERMITTED
    http: 422
    condition: "A discrepancy with severity HIGH or CRITICAL is dispositioned as DEFERRED."
  - id: ERR_REQUIRED_ELEMENTS_INCOMPLETE
    http: 422
    condition: "Attestation is attempted while documented_elements is missing a member of MODERATE_REQUIRED_ELEMENTS."
  - id: ERR_SERVICE_PERIOD_OPEN
    http: 422
    condition: "The service period is closed before its end-of-day instant has passed, or a claim is prepared while the episode is not in SERVICE_PERIOD_CLOSED."
  - id: ERR_READMISSION_OUT_OF_WINDOW
    http: 422
    condition: "The readmission's day_index is not between 1 and 30 inclusive."
  - id: ERR_CLAIM_NOT_BILLABLE
    http: 422
    condition: "Claim preparation is attempted for an episode with no COMPLETED visit whose documentation_status is ATTESTED or AMENDED."
  - id: ERR_VISIT_WINDOW_MISSED
    http: 422
    condition: "Claim preparation is attempted for a visit completed after discharge_date plus 14 days end-of-day, which no TCM code covers."
  - id: ERR_CONTACT_NOT_TIMELY
    http: 422
    condition: "Claim submission is attempted while episode.contact_timely is false."
  - id: ERR_DUPLICATE_TCM_CLAIM
    http: 409
    condition: "A second non-VOIDED TcmClaim would exist for the same patient over an overlapping service period."
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 422
    condition: "A third appeal is filed on a claim whose appeal_count already equals 2; the claim is closed as DENIED_FINAL before the rejection is returned."
  - id: ERR_HANDOFF_EXPIRED
    http: 409
    condition: "A handoff response arrives after the proposal's 24-hour expiry."
  - id: ERR_NAVIGATOR_CAP_EXCEEDED
    http: 409
    condition: "An INTERNAL_NAVIGATOR handoff acceptance would push the receiving navigator's workload_score above its active_episode_cap."

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: ProgramAdmin
    description: "Program operations. Owns configuration, the logical clock, the SLA sweep, service-period closure, administrative closure, readmission recording and retraction, claim adjudication, claim voiding and barrier waivers."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /tcm/holidays"
      - "POST /tcm/facilities"
      - "POST /tcm/payers"
      - "POST /tcm/navigators"
      - "POST /tcm/episodes/{episode_id}/close-service-period"
      - "POST /tcm/episodes/{episode_id}/admin-close"
      - "POST /tcm/episodes/{episode_id}/sla-sweep"
      - "POST /tcm/episodes/{episode_id}/readmissions"
      - "POST /tcm/readmissions/{readmission_id}/retract"
      - "POST /tcm/claims/{claim_id}/adjudicate"
      - "POST /tcm/claims/{claim_id}/void"
      - "closing a Barrier with outcome WAIVED"
    shared_operations:
      - "POST /tcm/patients"
      - "POST /tcm/barriers/{barrier_id}/close"
      - "every GET endpoint"

  - name: IntakeCoordinator
    description: "Discharge-referral intake desk. Records referrals and runs the accept or close decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /tcm/referrals"
      - "POST /tcm/referrals/{referral_id}/accept"
      - "POST /tcm/referrals/{referral_id}/close"
    shared_operations:
      - "POST /tcm/patients"
      - "every GET endpoint"

  - name: CareNavigator
    description: "Transitional-care navigator. Owns outreach, scheduling, barriers, re-assessment and handoff for the episodes assigned to them. X-User-ID must equal the episode's navigator_id."
    identity: "entity_backed:Navigator"
    exclusive_operations:
      - "POST /tcm/episodes/{episode_id}/risk-assessments"
      - "POST /tcm/episodes/{episode_id}/contact-attempts"
      - "POST /tcm/contact-attempts/{contact_attempt_id}/disposition"
      - "POST /tcm/episodes/{episode_id}/visits"
      - "POST /tcm/visits/{visit_id}/confirm"
      - "POST /tcm/visits/{visit_id}/close-encounter"
      - "POST /tcm/visits/{visit_id}/reschedule"
      - "POST /tcm/episodes/{episode_id}/barriers"
      - "POST /tcm/episodes/{episode_id}/handoffs"
      - "POST /tcm/handoffs/{handoff_id}/respond"
    shared_operations:
      - "POST /tcm/episodes/{episode_id}/red-flags"
      - "POST /tcm/red-flags/{red_flag_id}/acknowledge"
      - "POST /tcm/red-flags/{red_flag_id}/resolve"
      - "POST /tcm/barriers/{barrier_id}/close"
      - "every GET endpoint"

  - name: Clinician
    description: "Treating clinician or pharmacist. Owns the face-to-face encounter record, its attestation and amendment, and the whole medication-reconciliation surface."
    identity: "opaque"
    exclusive_operations:
      - "POST /tcm/visits/{visit_id}/complete"
      - "POST /tcm/visits/{visit_id}/attest"
      - "POST /tcm/visits/{visit_id}/amend"
      - "POST /tcm/episodes/{episode_id}/med-reconciliations"
      - "POST /tcm/med-reconciliations/{med_reconciliation_id}/discrepancies"
      - "POST /tcm/med-reconciliations/{med_reconciliation_id}/complete"
      - "POST /tcm/med-reconciliations/{med_reconciliation_id}/reopen"
      - "POST /tcm/discrepancies/{discrepancy_id}/disposition"
      - "POST /tcm/discrepancies/{discrepancy_id}/reopen"
    shared_operations:
      - "POST /tcm/episodes/{episode_id}/red-flags"
      - "POST /tcm/red-flags/{red_flag_id}/acknowledge"
      - "POST /tcm/red-flags/{red_flag_id}/resolve"
      - "POST /tcm/barriers/{barrier_id}/close"
      - "every GET endpoint"

  - name: BillingSpecialist
    description: "Revenue-cycle staff. Prepares, submits and appeals the TCM claim, and owns INSURANCE_AUTH barriers. Segregation of duties forbids the same X-User-ID from both preparing and submitting a claim."
    identity: "opaque"
    exclusive_operations:
      - "POST /tcm/episodes/{episode_id}/claims"
      - "POST /tcm/claims/{claim_id}/submit"
      - "POST /tcm/claims/{claim_id}/appeal"
    shared_operations:
      - "POST /tcm/barriers/{barrier_id}/close"
      - "every GET endpoint"
