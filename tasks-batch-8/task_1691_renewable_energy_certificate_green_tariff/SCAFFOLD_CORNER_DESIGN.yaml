scaffold_corner_design:
  - section: entities
    instances:
      - name: generator_create_applies_defaults
        claim_type: creation
        grounds: ["entities.Generator"]
        distinguishing_aspect: "POST /generators returns 201 with server-minted UUID id, status REGISTERED, all computed counters zeroed (cumulative_accepted_kwh 0, carryover_kwh 0, lifetime_minted_mwh 0, next_serial 1), version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
          assert:
            - "Generator.${g}.status == REGISTERED (initial state)"
            - "Generator.${g}.cumulative_accepted_kwh == 0 and carryover_kwh == 0 and lifetime_minted_mwh == 0 and next_serial == 1"
            - "Generator.${g}.version == 1 and created_at == updated_at"

      - name: generator_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Generator.fields.region_code", "validations[priority=3]"]
        distinguishing_aspect: "Omitting required region_code fails with ERR_VALIDATION 400 before any existence or state check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and HTTP status == 400"

      - name: generator_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Generator", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /greenpower/generators/00000000-0000-0000-0000-000000000000"
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: certificate_region_snapshot_immune_to_generator_patch
        claim_type: computed_fields
        grounds: ["entities.Certificate.fields.region_code", "entities.Certificate.fields.technology"]
        distinguishing_aspect: "Certificate.region_code/technology are mint-time snapshots: PATCHing the generator's region_code afterwards leaves existing certificates unchanged while the generator row shows the new region."
        test_recipe:
          setup: ["Generator ACTIVE (region CAISO) with one minted certificate"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c: "$.data[0].id" }
            - call: "GET /greenpower/generators/${g}"
              as: RegistryAdmin
              captures: { gv: $.data.version }
          trigger:
            - call: "PATCH /greenpower/generators/${g}"
              payload: { expected_generator_version: "${gv}", region_code: "ERCOT" }
              as: RegistryAdmin
          assert:
            - "Generator.${g}.region_code == ERCOT after patch"
            - "Certificate.${c}.region_code == CAISO (snapshot immutable)"
            - "Certificate.${c}.vintage_month == 2026-07 and technology == SOLAR (snapshots)"

      - name: retirement_immutable_event_entity
        claim_type: immutability
        grounds: ["entities.Retirement"]
        distinguishing_aspect: "Retirement has common_fields false: the GET response carries id and created_at but no updated_at/version, and there is no update endpoint — the row is append-only evidence."
        test_recipe:
          setup: ["VOLUNTARY program; 1-MWh certificate minted and retired"]
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c: "$.data[0].id" }
          trigger:
            - call: "POST /greenpower/retirements"
              payload: { certificate_id: "${c}", purpose: "VOLUNTARY_PROGRAM", program_id: "${p}" }
              as: ProgramManager
              captures: { ret: $.data.id }
          assert:
            - "Retirement.${ret} response has id and created_at but no version and no updated_at field"
            - "Retirement.${ret}.quantity_mwh == 1 and vintage_month == 2026-07 and region_code == CAISO and technology == SOLAR (snapshots)"
            - "Retirement.${ret}.account_id == the generator's GENERATOR account id (holder at retirement time)"

      - name: meter_reading_list_pagination_and_filter
        claim_type: listing
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "Filtered list honors limit/offset/total_count/has_more: 3 readings for the generator page as 2+1 with has_more flipping false on the last page; an unrelated generator's readings are excluded by the filter."
        test_recipe:
          setup: ["Generator g with three non-overlapping July readings; generator g2 with one reading"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-05T00:00:00Z", metered_kwh: 10 }
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-05T00:00:00Z", period_end: "2026-07-10T00:00:00Z", metered_kwh: 10 }
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-10T00:00:00Z", period_end: "2026-07-15T00:00:00Z", metered_kwh: 10 }
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Other Wind", facility_code: "OW1", technology: "WIND", nameplate_capacity_kw: 3000, region_code: "ERCOT", commissioning_date: "2021-01-01" }
              as: RegistryAdmin
              captures: { g2: $.data.id }
            - call: "POST /greenpower/generators/${g2}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g2}"
            - call: "POST /greenpower/generators/${g2}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g2}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-05T00:00:00Z", metered_kwh: 10 }
              as: GeneratorOperator
              as_user_id: "${g2}"
          trigger:
            - call: "GET /greenpower/meter-readings?generator_id=${g}&limit=2&offset=0"
              as: RegistryAdmin
            - call: "GET /greenpower/meter-readings?generator_id=${g}&limit=2&offset=2"
              as: RegistryAdmin
          assert:
            - "page 1: response.meta.api_request_id present; response_type == 'array'; data length == 2; total_count == 3; has_more == true"
            - "page 2: data length == 1; total_count == 3; has_more == false"
            - "every returned reading has generator_id == ${g} (g2's reading excluded by the filter)"

      - name: generator_verify_auto_creates_generator_account
        claim_type: side_effect_execution
        grounds: ["state_machines.Generator.VERIFICATION_to_ACTIVE", "entities.Account"]
        distinguishing_aspect: "The verify transition synthesizes exactly one GENERATOR Account wired to the generator; it is discoverable only through the reverse-reachability GET /accounts?generator_id=."
        test_recipe:
          setup: ["Generator in VERIFICATION"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
          trigger:
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/accounts?generator_id=${g}"
              as: RegistryAdmin
              captures: { gacc: "$.data[0].id" }
          assert:
            - "GET /greenpower/accounts?generator_id=${g} returns exactly 1 account with account_type == GENERATOR and status == ACTIVE"
            - "Account.${gacc}.owner_name == 'Sierra Solar' and failure_strikes == 0 and active_holdings_mwh == 0"

      - name: body_fk_reference_not_found_returns_404
        claim_type: parent_relationships
        grounds: ["validations[priority=4]", "entities.MeterReading.fields.generator_id"]
        distinguishing_aspect: "A body FK (generator_id) pointing at a non-existent generator yields ERR_NOT_FOUND 404 even though the path itself has no id — flat-topology referential integrity."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "00000000-0000-0000-0000-000000000000", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

  - section: state_machines
    instances:
      - name: generator_terminal_lockdown_decommissioned
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Generator", "errors[ERR_INVALID_GENERATOR_STATE]"]
        distinguishing_aspect: "From DECOMMISSIONED every lifecycle action (suspend, reinstate, submit-verification, verify) is rejected with ERR_INVALID_GENERATOR_STATE; the generator remains readable."
        test_recipe:
          setup: ["Generator decommissioned (ACTIVE -> DECOMMISSIONED)"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/decommission"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/generators/${g}/suspend"
              payload: {}
              as: RegistryAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { err2: $.data.error_id }
            - call: "GET /greenpower/generators/${g}"
              as: RegistryAdmin
          assert:
            - "err1 == ERR_INVALID_GENERATOR_STATE and err2 == ERR_INVALID_GENERATOR_STATE"
            - "Generator.${g}.status still == DECOMMISSIONED (terminal lockdown)"

      - name: reading_voided_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.MeterReading", "errors[ERR_INVALID_READING_STATE]"]
        distinguishing_aspect: "A VOIDED reading rejects attest/reject/resubmit/void with ERR_INVALID_READING_STATE — the terminal state has no outbound transitions."
        test_recipe:
          setup: ["Reading accepted then voided (pre-mint)"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings/${r1}/void"
              payload: { reason: "meter misread" }
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_READING_STATE (VOIDED is terminal)"
            - "MeterReading.${r1}.status == VOIDED and Generator.${g}.cumulative_accepted_kwh == 0 (void already debited)"

      - name: certificate_double_retirement_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Certificate", "errors[ERR_CERTIFICATE_NOT_ACTIVE]"]
        distinguishing_aspect: "Retiring an already-RETIRED certificate fails with ERR_CERTIFICATE_NOT_ACTIVE and creates no second Retirement row — the physical double-counting guard; revoking a RETIRED certificate fails identically."
        test_recipe:
          setup: ["VOLUNTARY program; certificate retired once"]
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c: "$.data[0].id" }
            - call: "POST /greenpower/retirements"
              payload: { certificate_id: "${c}", purpose: "VOLUNTARY_PROGRAM", program_id: "${p}" }
              as: ProgramManager
          trigger:
            - call: "POST /greenpower/retirements"
              payload: { certificate_id: "${c}", purpose: "VOLUNTARY_PROGRAM", program_id: "${p}" }
              as: ProgramManager
              captures: { err1: $.data.error_id }
            - call: "POST /greenpower/certificates/${c}/revoke"
              payload: { reason: "too late" }
              as: RegistryAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_CERTIFICATE_NOT_ACTIVE (second retirement blocked)"
            - "err2 == ERR_CERTIFICATE_NOT_ACTIVE (revoke of RETIRED blocked)"
            - "GET /greenpower/retirements?certificate_id=${c} returns exactly 1 row"

      - name: trade_accept_after_certificate_retired_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Trade.PROPOSED_to_ACCEPTED", "errors[ERR_CERTIFICATE_NOT_ACTIVE]"]
        distinguishing_aspect: "Adversarial ordering: a trade proposed while the certificate was ACTIVE cannot be accepted after the certificate is retired — accept re-validates item status and fails with ERR_CERTIFICATE_NOT_ACTIVE, taking no locks."
        test_recipe:
          setup: ["1-MWh certificate in b1; trade PROPOSED; certificate then retired to a voluntary program"]
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c: "$.data[0].id" }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker One" }
              as: RegistryAdmin
              captures: { b1: $.data.id }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker Two" }
              as: RegistryAdmin
              captures: { b2: $.data.id }
            - call: "POST /greenpower/certificates/${c}/transfer"
              payload: { to_account_id: "${b1}" }
              as: RegistryAdmin
            - call: "POST /greenpower/trades"
              payload: { from_account_id: "${b1}", to_account_id: "${b2}", items: [{certificate_id: "${c}", quantity_mwh: 1}], unit_price_cents_per_mwh: 300, settlement_mode: "GROSS" }
              as: BrokerTrader
              as_user_id: "${b1}"
              captures: { t: $.data.id }
            - call: "POST /greenpower/retirements"
              payload: { certificate_id: "${c}", purpose: "VOLUNTARY_PROGRAM", program_id: "${p}" }
              as: ProgramManager
          trigger:
            - call: "POST /greenpower/trades/${t}/accept"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CERTIFICATE_NOT_ACTIVE (item retired between propose and accept)"
            - "Trade.${t}.status remains PROPOSED"
      - name: trade_settle_twice_and_cancel_accepted_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Trade", "errors[ERR_TRADE_STATE_INVALID]"]
        distinguishing_aspect: "From terminal SETTLED no further transition exists (second settle -> ERR_TRADE_STATE_INVALID), and cancel is only defined from PROPOSED (cancel on ACCEPTED -> ERR_TRADE_STATE_INVALID)."
        test_recipe:
          setup: ["1-MWh certificate in b1; trade settled"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
