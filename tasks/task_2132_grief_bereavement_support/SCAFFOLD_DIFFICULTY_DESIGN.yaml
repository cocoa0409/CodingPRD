# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml §1.1-§1.7 against the nine §0.5 Difficulty Rules.
# Every literal in an `assert:` line below was computed against the pinned formulas
# and constants in SCAFFOLD.yaml §1.3.
scaffold_difficulty_design:

  # ===================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: funding_provisional_projected_vs_settled_actual_on_cohort_money
        grounds:
          - calculations.funding_allocation_amount
          - calculations.program_cost_total
          - entities.FundingAllocation.fields.provisional_cents
          - entities.FundingAllocation.fields.settled_cents
          - entities.FundingAllocation.fields.basis
          - state_machines.FundingAllocation.COMMITTED_to_SETTLED
          - state_machines.Cohort.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          This instance is dual-variant on MONEY attached to a Cohort: the same cohort
          row yields provisional_cents 134400 from the forward-looking seat projection
          and settled_cents 50400 from the chronological attendance replay, a delta of
          84000 cents on identical cohort data.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20 and turnover_buffer_minutes 30."
            - "GrantAward with awarded_cents 5000000, allowed_categories [GROUP_PROGRAM], period 2026-01-01..2026-12-31, indirect_rate_bps 1200, version 1."
            - "Cohort 'Tuesday Illness Group' (ANTICIPATED_ILLNESS, seats_total 4, min_viable_enrollment 1, TUE 600 for 90 minutes, series_start_date 2026-09-08, sessions_total 8, direct_cost_cents 240000) -> admin_fee_cents 28800, program_cost_total_cents 268800; moved to OPEN_ENROLLMENT."
            - "Two accepted Participants, each with one NEEDS Assessment, so both are ASSESSED and enrollable."
            - "Participant A enrolled and CONFIRMED (seats_filled 1); Participant B enrolled and left HELD (seats_held 1) -> projected_participants 2."
            - "A GROUP_PROGRAM FundingAllocation created at that moment: provisional_cents 134400, basis PROJECTED_ENROLLMENT, GrantAward.committed_cents 134400, available_cents 4865600."
            - "Cohort launched: seats_filled 1 >= min_viable_enrollment 1 so it goes RUNNING, A's enrollment becomes ATTENDING and B's HELD enrollment becomes EXPIRED."
            - "Six sessions of attendance logged against A's enrollment."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/grant-awards"
              payload: { funder_name: "Hollis Foundation", award_reference: "HF-2026-DV1", awarded_cents: 5000000, allowed_categories: ["GROUP_PROGRAM"], period_start: "2026-01-01", period_end: "2026-12-31", indirect_rate_bps: 1200 }
              as: ProgramDirector
              captures: { g_id: $.data.id, g_v1: $.data.version }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Tuesday Illness Group", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 240000 }
              as: ProgramDirector
              captures: { c_id: $.data.id }
            - call: "POST /bereavement/cohorts/${c_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
              captures: { c_v_open: $.data.version }
            - call: "POST /bereavement/referrals"
              payload: { source_type: "HOSPICE", source_org_name: "Riverside Hospice", decedent_name: "Ann Vance", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Ben Vance", contact_email: "ben.vance@example.org" }
              as: ReferralSource
              captures: { ref_a_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_a_id}/screen"
              payload: { eligibility_note: "in service area" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_a_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_a_id: $.data.id }
            - call: "POST /bereavement/participants/${p_a_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 20, isolation_index: 8, functional_impairment: 8, suicidality_flag: false }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals"
              payload: { source_type: "FUNERAL_HOME", source_org_name: "Calder Funeral Home", decedent_name: "Carl Otis", date_of_death: "2026-06-02", relationship_to_deceased: "CHILD", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Dana Otis", contact_email: "dana.otis@example.org" }
              as: ReferralSource
              captures: { ref_b_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_b_id}/screen"
              payload: { eligibility_note: "in service area" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_b_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_b_id: $.data.id }
            - call: "POST /bereavement/participants/${p_b_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 20, isolation_index: 8, functional_impairment: 8, suicidality_flag: false }
              as: IntakeCoordinator
            - call: "POST /bereavement/enrollments"
              payload: { participant_id: "${p_a_id}", cohort_id: "${c_id}", expected_cohort_version: "${c_v_open}" }
              as: IntakeCoordinator
              captures: { e_a_id: $.data.id }
            - call: "GET /bereavement/cohorts/${c_id}"
              payload: {}
              as: ProgramDirector
              captures: { c_v_after_a: $.data.version }
            - call: "POST /bereavement/enrollments"
              payload: { participant_id: "${p_b_id}", cohort_id: "${c_id}", expected_cohort_version: "${c_v_after_a}" }
              as: IntakeCoordinator
              captures: { e_b_id: $.data.id }
            - call: "POST /bereavement/enrollments/${e_a_id}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /bereavement/funding-allocations"
              payload: { grant_award_id: "${g_id}", category: "GROUP_PROGRAM", cohort_id: "${c_id}", expected_grant_award_version: "${g_v1}" }
              as: ProgramDirector
              captures: { alloc_id: $.data.id, prov_cents: $.data.provisional_cents }
            - call: "POST /bereavement/cohorts/${c_id}/launch"
              payload: {}
              as: ProgramDirector
            - call: "POST /bereavement/enrollments/${e_a_id}/attendance"
              payload: { sessions_delta: 6 }
              as: IntakeCoordinator
          trigger:
            - call: "POST /bereavement/cohorts/${c_id}/complete"
              payload: {}
              as: ProgramDirector
          assert:
            - "FundingAllocation.${alloc_id}.provisional_cents == 134400"
            - "FundingAllocation.${alloc_id}.settled_cents == 50400"
            - "FundingAllocation.${alloc_id}.provisional_cents != FundingAllocation.${alloc_id}.settled_cents"
            - "FundingAllocation.${alloc_id}.status == SETTLED"
            - "FundingAllocation.${alloc_id}.basis == ACTUAL_ATTENDANCE"
            - "Cohort.${c_id}.status == COMPLETED"
            - "Cohort.${c_id}.program_cost_total_cents == 268800"
            - "Enrollment.${e_a_id}.status == COMPLETED"
            - "Enrollment.${e_a_id}.attendance_ratio == 0.75"
            - "Enrollment.${e_b_id}.status == EXPIRED"
            - "Enrollment.${e_b_id}.sessions_attended == 0"
            - "GrantAward.${g_id}.committed_cents == 0"
            - "GrantAward.${g_id}.spent_cents == 50400"
            - "GrantAward.${g_id}.available_cents == 4949600"
            - "Participant.${p_a_id}.sessions_attended_total == 6"
            - "Participant.${p_a_id}.service_status == MAINTENANCE"

      - name: outcome_raw_delta_vs_attendance_adjusted_delta_on_participant_scores
        grounds:
          - calculations.participant_outcome_delta
          - entities.Participant.fields.baseline_score
          - entities.Participant.fields.latest_score
          - entities.Participant.fields.sessions_attended_total
          - entities.Assessment.fields.normalized_score
          - validations[priority=15]
        distinguishing_aspect: |
          This instance is dual-variant on CLINICAL SCORING attached to a Participant,
          a different entity domain from the cohort-money instance: identical BASELINE
          70.00 and EXIT 45.00 rows yield raw_delta -25.00 and
          attendance_adjusted_delta -16.80 because the regression-to-the-mean
          correction is subtracted before the attendance weight is applied.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One accepted Participant who has never enrolled, so sessions_attended_total is 0."
            - "A BASELINE Assessment with grief_severity 32, isolation_index 12, functional_impairment 12 -> raw_total 56, normalized_score 70.00."
            - "An EXIT Assessment with grief_severity 20, isolation_index 8, functional_impairment 8 -> raw_total 36, normalized_score 45.00."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Elin Roos", date_of_death: "2026-05-20", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Finn Roos", contact_email: "finn.roos@example.org" }
              as: ReferralSource
              captures: { ref_o_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_o_id}/screen"
              payload: { eligibility_note: "self referral accepted" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_o_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_o_id: $.data.id }
            - call: "POST /bereavement/participants/${p_o_id}/assessments"
              payload: { kind: "BASELINE", instrument: "PG13", grief_severity: 32, isolation_index: 12, functional_impairment: 12, suicidality_flag: false }
              as: IntakeCoordinator
              captures: { base_norm: $.data.normalized_score }
            - call: "POST /bereavement/participants/${p_o_id}/assessments"
              payload: { kind: "EXIT", instrument: "PG13", grief_severity: 20, isolation_index: 8, functional_impairment: 8, suicidality_flag: false }
              as: IntakeCoordinator
              captures: { exit_norm: $.data.normalized_score }
          trigger:
            - call: "GET /bereavement/participants/${p_o_id}/outcome-summary"
              payload: {}
              as: IntakeCoordinator
              captures: { raw_d: $.data.raw_delta, adj_d: $.data.attendance_adjusted_delta }
          assert:
            - "outcome_summary.baseline_score == 70.00"
            - "outcome_summary.latest_score == 45.00"
            - "outcome_summary.raw_delta == -25.00"
            - "outcome_summary.rtm_correction == 3.00"
            - "outcome_summary.attendance_ratio_capped == 0"
            - "outcome_summary.attendance_adjusted_delta == -16.80"
            - "outcome_summary.raw_delta != outcome_summary.attendance_adjusted_delta"
            - "outcome_summary.sessions_attended_total == 0"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: grant_report_indirect_rounded_per_line_then_summed
        grounds:
          - calculations.grant_report_totals
          - calculations.program_cost_total
          - calculations.funding_allocation_amount
          - entities.GrantReport.fields.indirect_total_cents
          - entities.GrantReport.fields.reported_total_cents
          - entities.GrantAward.fields.indirect_rate_bps
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order changes the cents. Three lines of
          11446 cents at 1200 bps give indirect_total_cents 4122 under the pinned
          "round each line then sum" order and 4121 under the rejected "sum then
          round" order; the scaffold pins 4122 and reported_total_cents 38460.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Hall A' with capacity 60 and turnover_buffer_minutes 30."
            - "GrantAward with awarded_cents 500000, allowed_categories [REMEMBRANCE_EVENT], period 2026-01-01..2026-12-31, indirect_rate_bps 1200."
            - "Three RemembranceEvents on three different dates, each with direct_cost_cents 10220 -> admin_fee_cents 1226 and program_cost_total_cents 11446."
            - "One REMEMBRANCE_EVENT FundingAllocation per event, each COMMITTED with provisional_cents 11446, created on 2026-09-01; GrantAward.committed_cents 34338 and available_cents 465662."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Hall A", capacity: 60, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/grant-awards"
              payload: { funder_name: "Hollis Foundation", award_reference: "HF-2026-RND", awarded_cents: 500000, allowed_categories: ["REMEMBRANCE_EVENT"], period_start: "2026-01-01", period_end: "2026-12-31", indirect_rate_bps: 1200 }
              as: ProgramDirector
              captures: { g_id: $.data.id, g_v1: $.data.version }
            - call: "POST /bereavement/remembrance-events"
              payload: { title: "October Remembrance I", meeting_space_id: "${sp_id}", event_date: "2026-10-05", start_minute_utc: 600, duration_minutes: 60, expected_attendance: 20, direct_cost_cents: 10220 }
              as: ProgramDirector
              captures: { ev1_id: $.data.id, ev1_total: $.data.program_cost_total_cents }
            - call: "POST /bereavement/remembrance-events"
              payload: { title: "October Remembrance II", meeting_space_id: "${sp_id}", event_date: "2026-10-06", start_minute_utc: 600, duration_minutes: 60, expected_attendance: 20, direct_cost_cents: 10220 }
              as: ProgramDirector
              captures: { ev2_id: $.data.id }
            - call: "POST /bereavement/remembrance-events"
              payload: { title: "October Remembrance III", meeting_space_id: "${sp_id}", event_date: "2026-10-07", start_minute_utc: 600, duration_minutes: 60, expected_attendance: 20, direct_cost_cents: 10220 }
              as: ProgramDirector
              captures: { ev3_id: $.data.id }
            - call: "POST /bereavement/funding-allocations"
              payload: { grant_award_id: "${g_id}", category: "REMEMBRANCE_EVENT", event_id: "${ev1_id}", expected_grant_award_version: "${g_v1}" }
              as: ProgramDirector
              captures: { alloc1_id: $.data.id }
            - call: "GET /bereavement/grant-awards/${g_id}"
              payload: {}
              as: ProgramDirector
              captures: { g_v2: $.data.version }
            - call: "POST /bereavement/funding-allocations"
              payload: { grant_award_id: "${g_id}", category: "REMEMBRANCE_EVENT", event_id: "${ev2_id}", expected_grant_award_version: "${g_v2}" }
              as: ProgramDirector
              captures: { alloc2_id: $.data.id }
            - call: "GET /bereavement/grant-awards/${g_id}"
              payload: {}
              as: ProgramDirector
              captures: { g_v3: $.data.version }
            - call: "POST /bereavement/funding-allocations"
              payload: { grant_award_id: "${g_id}", category: "REMEMBRANCE_EVENT", event_id: "${ev3_id}", expected_grant_award_version: "${g_v3}" }
              as: ProgramDirector
              captures: { alloc3_id: $.data.id }
          trigger:
            - call: "POST /bereavement/grant-reports"
              payload: { grant_award_id: "${g_id}", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: ProgramDirector
              captures: { rpt_id: $.data.id, ind_total: $.data.indirect_total_cents }
          assert:
            - "GrantReport.${rpt_id}.line_count == 3"
            - "GrantReport.${rpt_id}.direct_total_cents == 34338"
            - "GrantReport.${rpt_id}.indirect_total_cents == 4122"
            - "GrantReport.${rpt_id}.indirect_total_cents != 4121"
            - "GrantReport.${rpt_id}.reported_total_cents == 38460"
            - "GrantReport.${rpt_id}.participants_served == 0"
            - "GrantReport.${rpt_id}.status == DRAFT"
            - "FundingAllocation.${alloc1_id}.provisional_cents == 11446"
            - "GrantAward.${g_id}.committed_cents == 34338"
            - "GrantAward.${g_id}.available_cents == 465662"

      - name: program_cost_indirect_tier_keyed_on_direct_cost_not_on_total
        grounds:
          - calculations.program_cost_total
          - entities.Cohort.fields.admin_fee_cents
          - entities.Cohort.fields.program_cost_total_cents
          - entities.RemembranceEvent.fields.admin_fee_cents
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency with a pinned single-pass
          evaluation order. direct_cost_cents 240000 selects the 1200 bps band from
          the DIRECT cost alone and yields admin_fee_cents 28800 with
          program_cost_total_cents 268800; keying the band off the resulting total
          268800 would pick 1000 bps and produce 26880 / 266880 instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20 and turnover_buffer_minutes 30."
            - "No cohorts or events exist yet, so no space-time conflict can interfere."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /bereavement/cohorts"
              payload: { name: "Tier Boundary Below", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 240000 }
              as: ProgramDirector
              captures: { c_lo_id: $.data.id, fee_lo: $.data.admin_fee_cents }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Tier Boundary At", loss_type: "SUDDEN_DEATH", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "WED", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-09", sessions_total: 8, direct_cost_cents: 250000 }
              as: ProgramDirector
              captures: { c_hi_id: $.data.id, fee_hi: $.data.admin_fee_cents }
          assert:
            - "Cohort.${c_lo_id}.admin_fee_cents == 28800"
            - "Cohort.${c_lo_id}.program_cost_total_cents == 268800"
            - "Cohort.${c_lo_id}.admin_fee_cents != 26880"
            - "Cohort.${c_lo_id}.program_cost_total_cents != 266880"
            - "Cohort.${c_hi_id}.admin_fee_cents == 25000"
            - "Cohort.${c_hi_id}.program_cost_total_cents == 275000"
            - "Cohort.${c_lo_id}.series_end_date == 2026-10-27"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: cohort_open_enrollment_undersubscribed_reopen_running_cycle
        grounds:
          - state_machines.Cohort.OPEN_ENROLLMENT_to_UNDERSUBSCRIBED
          - state_machines.Cohort.UNDERSUBSCRIBED_to_OPEN_ENROLLMENT
          - state_machines.Cohort.OPEN_ENROLLMENT_to_RUNNING
          - state_machines.Enrollment.CONFIRMED_to_ATTENDING
          - entities.Cohort.fields.min_viable_enrollment
        distinguishing_aspect: |
          The Cohort machine is cyclic AND branching on one entity: launch forks on
          the seats_filled >= min_viable_enrollment boundary into two branches with
          different side-effect sets, and the UNDERSUBSCRIBED branch loops back to
          OPEN_ENROLLMENT so the very same cohort row reaches RUNNING on a second pass.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20 and turnover_buffer_minutes 30."
            - "Cohort with seats_total 4 and min_viable_enrollment 2, moved to OPEN_ENROLLMENT."
            - "Two accepted Participants, each with a NEEDS Assessment."
            - "Participant A enrolled and CONFIRMED, so seats_filled is 1 - one short of the viability floor."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Cycle Group", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 2, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 240000 }
              as: ProgramDirector
              captures: { c_id: $.data.id }
            - call: "POST /bereavement/cohorts/${c_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
              captures: { c_v_open1: $.data.version }
            - call: "POST /bereavement/referrals"
              payload: { source_type: "HOSPICE", source_org_name: "Riverside Hospice", decedent_name: "Ann Vance", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Ben Vance", contact_email: "ben.vance@example.org" }
              as: ReferralSource
              captures: { ref_a_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_a_id}/screen"
              payload: { eligibility_note: "in service area" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_a_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_a_id: $.data.id }
            - call: "POST /bereavement/participants/${p_a_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 20, isolation_index: 8, functional_impairment: 8, suicidality_flag: false }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals"
              payload: { source_type: "FUNERAL_HOME", source_org_name: "Calder Funeral Home", decedent_name: "Carl Otis", date_of_death: "2026-06-02", relationship_to_deceased: "CHILD", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Dana Otis", contact_email: "dana.otis@example.org" }
              as: ReferralSource
              captures: { ref_b_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_b_id}/screen"
              payload: { eligibility_note: "in service area" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_b_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_b_id: $.data.id }
            - call: "POST /bereavement/participants/${p_b_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 20, isolation_index: 8, functional_impairment: 8, suicidality_flag: false }
              as: IntakeCoordinator
            - call: "POST /bereavement/enrollments"
              payload: { participant_id: "${p_a_id}", cohort_id: "${c_id}", expected_cohort_version: "${c_v_open1}" }
