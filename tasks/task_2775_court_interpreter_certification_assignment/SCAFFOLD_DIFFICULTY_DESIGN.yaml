# =============================================================================
# §1.8  SCAFFOLD DIFFICULTY DESIGN — Task 2775
# Court Interpreter Certification & Assignment (state court interpreter program)
#
# 9 rule_ids x 2 instances = 18 instances. Every `grounds:` ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every `${var}` is bound by an earlier `captures:`;
# every numeric assert is a literal computed by executing the §1.3 formulas.
# The logical clock starts at its fixed default 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: provisional_then_final_assignment_pay_diverges_on_served_window
        grounds:
          - calculations.assignment_pay
          - entities.PayClaim.fields.provisional_total_cents
          - entities.PayClaim.fields.final_total_cents
          - entities.PayClaim.fields.billable_hours
          - entities.Courthouse.fields.encumbered_pay_cents
          - entities.Courthouse.fields.obligated_pay_cents
          - state_machines.PayClaim.ENCUMBERED_to_FINALIZED
        distinguishing_aspect: |
          The PROVISIONAL variant bills the SCHEDULED window (2.00 h -> 17500) while
          the FINAL variant bills the CHECK-IN-to-ACTUAL-END window (3.1667 h rounded
          up to 3.25 h -> 28438) from the same assignment row, so the same PayClaim
          moves from 22050 to 32988 and the same amount migrates from the courthouse's
          encumbered_pay_cents to its obligated_pay_cents.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Language spa (DESIGNATED, oral exam offered); courthouse CH_MAIN in county CAS with a 5,000,000-cent pay budget; one rate schedule effective from 2026-01-01."
            - "Interpreter Ana Reyes on the roster with ethics training complete and an ACTIVE CERTIFIED spa credential."
            - "Hearing H1 at CH_MAIN, spa, TRIAL, in custody, 2026-09-10T09:00-11:00Z, IN_PERSON; priority_score 65, priority_class B."
            - "Assignment A1 for Ana on H1 with estimated_one_way_miles 33.7, CONFIRMED, so its PayClaim sits in ENCUMBERED at 22050 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true, telephonic_vendor_available: false }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000, status: "OPEN" }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
            - call: "POST /rate-schedules"
              payload: { effective_from: "2026-01-01", master_hourly_cents: 10500, certified_hourly_cents: 8750, registered_hourly_cents: 6500, provisional_hourly_cents: 4900, minimum_call_hours: 2.0, travel_mileage_rate_cents: 67.5, travel_free_radius_miles: 30.0, remote_rate_multiplier: 0.90, late_cancellation_hours: 48, late_cancellation_pay_hours: 2.0, rare_premium_low_pct: 0.10, rare_premium_high_pct: 0.15, rare_premium_bracket_cents: 30000 }
              as: ProgramAdmin
              captures: { rs1: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS", accepts_in_person: true, accepts_remote: true }
              as: CredentialingOfficer
              captures: { i1: "$.data.id" }
            - call: "POST /interpreters/${i1}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
              captures: { i1_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i1}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${i1_v2}" }
              as: CredentialingOfficer
              captures: { cred1: "$.data.id" }
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "ORAL", score: 74, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-0001", hearing_type: "TRIAL", in_custody: true, scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T11:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h1: "$.data.id", h1_v: "$.data.version" }
            - call: "POST /assignments"
              payload: { hearing_id: "${h1}", interpreter_id: "${i1}", delivery_mode: "IN_PERSON", estimated_one_way_miles: 33.7, expected_hearing_version: "${h1_v}" }
              as: SchedulingCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /assignments/${a1}/confirm"
              payload: {}
              as: Interpreter
              as_user_id: "${i1}"
            - call: "GET /pay-claims"
              payload: { assignment_id: "${a1}" }
              as: FiscalOfficer
              captures: { pc1: "$.data[0].id", pc1_prov: "$.data[0].provisional_total_cents" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assignments/${a1}/check-in"
              payload: {}
              as: Interpreter
              as_user_id: "${i1}"
            - call: "POST /assignments/${a1}/complete"
              payload: { actual_end_utc: "2026-09-10T12:10:00.000Z", one_way_miles: 33.7 }
              as: Interpreter
              as_user_id: "${i1}"
          assert:
            - "PayClaim.${pc1}.provisional_total_cents == 22050"
            - "PayClaim.${pc1}.final_total_cents == 32988"
            - "PayClaim.${pc1}.billable_hours == 3.25"
            - "PayClaim.${pc1}.service_cents == 28438"
            - "PayClaim.${pc1}.rare_premium_cents == 0"
            - "PayClaim.${pc1}.travel_cents == 4550"
            - "PayClaim.${pc1}.variant == FINAL"
            - "PayClaim.${pc1}.status == FINALIZED"
            - "PayClaim.${pc1}.final_total_cents - PayClaim.${pc1}.provisional_total_cents == 10938"
            - "Assignment.${a1}.service_status == COMPLETED"
            - "Hearing.${h1}.status == SERVED"
            - "Courthouse.${ch_main}.encumbered_pay_cents == 0"
            - "Courthouse.${ch_main}.obligated_pay_cents == 32988"
            - "Courthouse.${ch_main}.available_pay_cents == 4967012"
            - "Interpreter.${i1}.pending_pay_cents == 32988"
            - "Interpreter.${i1}.paid_pay_cents == 0"

      - name: rolling_twelve_month_and_lifetime_quality_scores_diverge_on_same_rows
        grounds:
          - calculations.interpreter_quality_score
          - entities.Interpreter.fields.rolling_12_month_score
          - entities.Interpreter.fields.lifetime_score
          - entities.Interpreter.fields.complaint_points
          - entities.DisciplinaryAction.fields.points
          - endpoints["GET /interpreters/{id}/quality-score"]
        distinguishing_aspect: |
          Two substantiated sanctions on one interpreter — a PROBATION dated 2026-08-01
          and a LETTER dated 2027-08-02 — are read by both variants, but the 365-day
          lookback of ROLLING_12_MONTH sees only the 5-point LETTER (score 80) while
          LIFETIME adds OLDER_WEIGHT*10 for the out-of-window PROBATION (score 60);
          complaint_points is 15 under both.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Interpreter Ana Reyes enrolled (no credential needed — the quality score is roster-level)."
            - "Complaint C_OLD filed, reviewed by a second QualityReviewer, then adjudicated SUBSTANTIATED with a PROBATION sanction on 2026-08-01 (10 points)."
            - "Clock advanced to 2027-08-02T00:00:00Z, more than 365 days later."
            - "Complaint C_NEW filed, reviewed by a second QualityReviewer, then adjudicated SUBSTANTIATED with a LETTER sanction on 2027-08-02 (5 points)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS", accepts_in_person: true, accepts_remote: true }
              as: CredentialingOfficer
              captures: { i1: "$.data.id" }
            - call: "POST /complaints"
              payload: { interpreter_id: "${i1}", category: "PROFESSIONALISM", severity: "MAJOR", narrative: "Repeated late arrival to the arraignment calendar." }
              as: QualityReviewer
              as_user_id: "qr-001"
              captures: { c_old: "$.data.id" }
            - call: "POST /complaints/${c_old}/review"
              payload: { recommendation: "SUBSTANTIATE", findings: "Court logs confirm three late starts." }
              as: QualityReviewer
              as_user_id: "qr-002"
            - call: "POST /complaints/${c_old}/adjudicate"
              payload: { disposition: "SUBSTANTIATED", sanction_type: "PROBATION", suspension_days: 180 }
              as: ProgramAdmin
              as_user_id: "pa-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /complaints"
              payload: { interpreter_id: "${i1}", category: "ACCURACY", severity: "MINOR", narrative: "Omitted a qualifier during a plea colloquy." }
              as: QualityReviewer
              as_user_id: "qr-001"
              captures: { c_new: "$.data.id" }
            - call: "POST /complaints/${c_new}/review"
              payload: { recommendation: "SUBSTANTIATE", findings: "Recording review confirms one omission." }
              as: QualityReviewer
              as_user_id: "qr-002"
            - call: "POST /complaints/${c_new}/adjudicate"
              payload: { disposition: "SUBSTANTIATED", sanction_type: "LETTER", suspension_days: 30 }
              as: ProgramAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "GET /interpreters/${i1}/quality-score"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr-003"
              captures: { rolling: "$.data.rolling_12_month_score", lifetime: "$.data.lifetime_score", recent: "$.data.recent_points", older: "$.data.older_points" }
          assert:
            - "${rolling} == 80"
            - "${lifetime} == 60"
            - "${recent} == 5"
            - "${older} == 10"
            - "Interpreter.${i1}.rolling_12_month_score == 80"
            - "Interpreter.${i1}.lifetime_score == 60"
            - "Interpreter.${i1}.complaint_points == 15"
            - "Interpreter.${i1}.roster_status == APPLICANT"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: hearing_priority_score_five_factor_combination_and_rare_tier_override
        grounds:
          - calculations.hearing_priority_score
          - calculations.required_min_tier
          - entities.Hearing.fields.priority_score
          - entities.Hearing.fields.priority_class
          - entities.Hearing.fields.lead_time_days
          - endpoints["GET /hearings/{id}/eligible-interpreters"]
        distinguishing_aspect: |
          One score combines five independent inputs (hearing_type weight, custody
          bonus, language rarity bonus, a clamped urgency term over lead_time_days,
          and a clamp of the sum at 100) so that four hearings created in the same
          call sequence land on 80/A (exactly at the class floor), 90/A, 65/B and
          10/C; and the RARE branch of required_min_tier then overrides the class-A
          CERTIFIED requirement down to PROVISIONAL for the 90/A hearing only.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Languages spa (DESIGNATED), kor (NON_DESIGNATED) and mix (RARE, no oral exam, telephonic vendor available)."
            - "Courthouse CH_MAIN in county CAS."
            - "Interpreter Bo Lim with ethics training complete and an ACTIVE PROVISIONAL mix credential (the rare-language provisional qualification path, no examination)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true, telephonic_vendor_available: false }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /languages"
              payload: { code: "kor", name: "Korean", tier_class: "NON_DESIGNATED", oral_exam_available: true, telephonic_vendor_available: false }
              as: ProgramAdmin
              captures: { lang_kor: "$.data.id" }
            - call: "POST /languages"
              payload: { code: "mix", name: "Mixteco Bajo", tier_class: "RARE", oral_exam_available: false, telephonic_vendor_available: true }
              as: ProgramAdmin
              captures: { lang_mix: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000, status: "OPEN" }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Bo Lim", email: "bo.lim@courts.example.gov", home_county_code: "CAS", accepts_in_person: true, accepts_remote: true }
              as: CredentialingOfficer
              captures: { i5: "$.data.id" }
            - call: "POST /interpreters/${i5}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
              captures: { i5_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i5}", language_id: "${lang_mix}", target_tier: "PROVISIONAL", expected_interpreter_version: "${i5_v2}" }
              as: CredentialingOfficer
              captures: { cred5: "$.data.id", cred5_status: "$.data.status" }
            - call: "POST /credentials/${cred5}/advance"
              payload: {}
              as: CredentialingOfficer
          trigger:
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_kor}", case_number: "CR-2026-0080", hearing_type: "TRIAL", in_custody: true, scheduled_start: "2026-08-06T09:00:00.000Z", scheduled_end: "2026-08-06T11:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { hp1: "$.data.id", hp1_score: "$.data.priority_score", hp1_class: "$.data.priority_class", hp1_lead: "$.data.lead_time_days" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_mix}", case_number: "CR-2026-0090", hearing_type: "ARRAIGNMENT", in_custody: true, scheduled_start: "2026-09-11T08:30:00.000Z", scheduled_end: "2026-09-11T09:30:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { hp2: "$.data.id", hp2_score: "$.data.priority_score", hp2_class: "$.data.priority_class", hp2_lead: "$.data.lead_time_days" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-0065", hearing_type: "TRIAL", in_custody: true, scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T11:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { hp3: "$.data.id", hp3_score: "$.data.priority_score", hp3_class: "$.data.priority_class" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CV-2026-0010", hearing_type: "CIVIL_MOTION", in_custody: false, scheduled_start: "2026-09-11T08:30:00.000Z", scheduled_end: "2026-09-11T09:30:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { hp4: "$.data.id", hp4_score: "$.data.priority_score", hp4_class: "$.data.priority_class" }
            - call: "GET /hearings/${hp2}/eligible-interpreters"
              payload: { limit: 10, offset: 0 }
              as: SchedulingCoordinator
              captures: { elig0_id: "$.data[0].id" }
          assert:
            - "${cred5_status} == PENDING_ETHICS"
            - "Credential.${cred5}.tier == PROVISIONAL"
            - "Credential.${cred5}.expires_on == 2027-08-01"
            - "${hp1_lead} == 5 and ${hp1_score} == 80 and ${hp1_class} == A"
            - "${hp2_lead} == 41 and ${hp2_score} == 90 and ${hp2_class} == A"
            - "${hp3_score} == 65 and ${hp3_class} == B"
            - "${hp4_score} == 10 and ${hp4_class} == C"
            - "${elig0_id} == ${i5}"
            - "GET /hearings/${hp2}/eligible-interpreters returns total_count == 1 — a PROVISIONAL credential satisfies a priority-class-A hearing because Language.tier_class == RARE overrides the CERTIFIED requirement"

      - name: rare_premium_bracket_keyed_on_rounded_service_component_only
        grounds:
          - calculations.assignment_pay
          - entities.PayClaim.fields.rare_premium_cents
          - entities.PayClaim.fields.service_cents
          - entities.PayClaim.fields.travel_cents
          - entities.RateSchedule.fields.rare_premium_bracket_cents
        distinguishing_aspect: |
          Step order inside one formula decides the answer: the rare-language premium
          bracket is keyed on the ROUNDED service component (29400 < 30000 -> 10 pct
          -> 2940), not on the running total including travel (29400 + 5400 = 34800
          >= 30000 -> 15 pct -> 5220), so the FINAL claim is 37740 and not 40020,
          while each of the three components is rounded to whole cents before the sum.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Language mix (RARE, no oral exam, telephonic vendor available); courthouse CH_MAIN; rate schedule effective 2026-01-01 with rare_premium_bracket_cents 30000, low 0.10 and high 0.15."
            - "Interpreter Bo Lim with ethics training complete and an ACTIVE PROVISIONAL mix credential."
            - "Hearing H2 at CH_MAIN, mix, MOTION, not in custody, 2026-09-11T08:30-13:30Z, IN_PERSON, priority_score 35, priority_class C."
            - "Assignment A2 for Bo on H2 with estimated_one_way_miles 40.0, CONFIRMED, PayClaim ENCUMBERED at 32350 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /languages"
              payload: { code: "mix", name: "Mixteco Bajo", tier_class: "RARE", oral_exam_available: false, telephonic_vendor_available: true }
              as: ProgramAdmin
              captures: { lang_mix: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000, status: "OPEN" }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
            - call: "POST /rate-schedules"
              payload: { effective_from: "2026-01-01", master_hourly_cents: 10500, certified_hourly_cents: 8750, registered_hourly_cents: 6500, provisional_hourly_cents: 4900, minimum_call_hours: 2.0, travel_mileage_rate_cents: 67.5, travel_free_radius_miles: 30.0, remote_rate_multiplier: 0.90, late_cancellation_hours: 48, late_cancellation_pay_hours: 2.0, rare_premium_low_pct: 0.10, rare_premium_high_pct: 0.15, rare_premium_bracket_cents: 30000 }
              as: ProgramAdmin
              captures: { rs1: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Bo Lim", email: "bo.lim@courts.example.gov", home_county_code: "CAS", accepts_in_person: true, accepts_remote: true }
              as: CredentialingOfficer
              captures: { i5: "$.data.id" }
            - call: "POST /interpreters/${i5}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
              captures: { i5_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i5}", language_id: "${lang_mix}", target_tier: "PROVISIONAL", expected_interpreter_version: "${i5_v2}" }
              as: CredentialingOfficer
              captures: { cred5: "$.data.id" }
            - call: "POST /credentials/${cred5}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_mix}", case_number: "CR-2026-0091", hearing_type: "MOTION", in_custody: false, scheduled_start: "2026-09-11T08:30:00.000Z", scheduled_end: "2026-09-11T13:30:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h2: "$.data.id", h2_v: "$.data.version" }
            - call: "POST /assignments"
              payload: { hearing_id: "${h2}", interpreter_id: "${i5}", delivery_mode: "IN_PERSON", estimated_one_way_miles: 40.0, expected_hearing_version: "${h2_v}" }
              as: SchedulingCoordinator
              captures: { a2: "$.data.id", a2_tier: "$.data.credential_tier_snapshot" }
            - call: "POST /assignments/${a2}/confirm"
              payload: {}
              as: Interpreter
              as_user_id: "${i5}"
            - call: "GET /pay-claims"
              payload: { assignment_id: "${a2}" }
              as: FiscalOfficer
              captures: { pc2: "$.data[0].id", pc2_prov: "$.data[0].provisional_total_cents", pc2_prov_prem: "$.data[0].rare_premium_cents" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T08:30:00Z" }
              as: ProgramAdmin
            - call: "POST /assignments/${a2}/check-in"
              payload: {}
              as: Interpreter
              as_user_id: "${i5}"
            - call: "POST /assignments/${a2}/complete"
              payload: { actual_end_utc: "2026-09-11T14:25:00.000Z", one_way_miles: 40.0 }
              as: Interpreter
              as_user_id: "${i5}"
          assert:
            - "${a2_tier} == PROVISIONAL"
            - "${pc2_prov} == 32350"
            - "${pc2_prov_prem} == 2450"
            - "PayClaim.${pc2}.billable_hours == 6.0"
            - "PayClaim.${pc2}.service_cents == 29400"
            - "PayClaim.${pc2}.rare_premium_cents == 2940"
            - "PayClaim.${pc2}.travel_cents == 5400"
            - "PayClaim.${pc2}.final_total_cents == 37740"
            - "PayClaim.${pc2}.final_total_cents != 40020"
            - "Courthouse.${ch_main}.obligated_pay_cents == 37740"
            - "Courthouse.${ch_main}.encumbered_pay_cents == 0"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: credential_active_lapsed_active_cycle_then_early_renewal_self_loop
        grounds:
          - state_machines.Credential.ACTIVE_to_LAPSED
          - state_machines.Credential.LAPSED_to_ACTIVE
          - state_machines.Credential.ACTIVE_to_ACTIVE
          - state_machines.Interpreter.ACTIVE_to_INACTIVE
          - state_machines.Interpreter.INACTIVE_to_ACTIVE
          - entities.Credential.fields.expires_on
          - entities.Credential.fields.grace_through
          - entities.Credential.fields.renewal_count
          - endpoints["POST /ops/daily-sweep"]
        distinguishing_aspect: |
          The same credential re-enters a state it already left: ACTIVE -> LAPSED
          (sweep) -> ACTIVE (grace renewal, cycle rebased on the clock to 2030-08-01)
          -> ACTIVE again through the self-loop (cycle rebased on the previous
          expires_on to 2032-07-31), and the holder's roster status follows the loop
          ACTIVE -> INACTIVE -> ACTIVE without ever touching a terminal state.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Language spa (DESIGNATED, oral exam offered)."
            - "Interpreter Ana Reyes with ethics training complete and an ACTIVE CERTIFIED spa credential issued 2026-08-01, expires_on 2028-07-31, grace_through 2028-10-29; roster_status ACTIVE."
            - "Clock advanced to 2028-08-01T00:00:00Z, one day past expires_on and inside the 90-day grace window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true, telephonic_vendor_available: false }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS", accepts_in_person: true, accepts_remote: true }
              as: CredentialingOfficer
              captures: { i1: "$.data.id" }
            - call: "POST /interpreters/${i1}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
              captures: { i1_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i1}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${i1_v2}" }
              as: CredentialingOfficer
              captures: { cred1: "$.data.id" }
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "ORAL", score: 74, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/advance"
              payload: {}
              as: CredentialingOfficer
              captures: { cred1_expires: "$.data.expires_on", cred1_grace: "$.data.grace_through" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { swept_lapsed: "$.data.lapsed_credential_ids", swept_downgraded: "$.data.downgraded_interpreter_ids" }
            - call: "POST /credentials/${cred1}/renew"
              payload: { cycle_credit_hours: 16 }
              as: CredentialingOfficer
              captures: { renew1_status: "$.data.status", renew1_expires: "$.data.expires_on", renew1_count: "$.data.renewal_count" }
            - call: "POST /credentials/${cred1}/renew"
              payload: { cycle_credit_hours: 20 }
              as: CredentialingOfficer
              captures: { renew2_status: "$.data.status", renew2_expires: "$.data.expires_on", renew2_grace: "$.data.grace_through", renew2_count: "$.data.renewal_count" }
          assert:
            - "${cred1_expires} == 2028-07-31 and ${cred1_grace} == 2028-10-29"
            - "${swept_lapsed} contains ${cred1}"
            - "${swept_downgraded} contains ${i1}"
            - "${renew1_status} == ACTIVE"
            - "${renew1_expires} == 2030-08-01"
            - "${renew1_count} == 1"
            - "${renew2_status} == ACTIVE"
            - "${renew2_expires} == 2032-07-31"
            - "${renew2_grace} == 2032-10-29"
            - "${renew2_count} == 2"
            - "Credential.${cred1}.cycle_credit_hours == 20.0"
            - "Credential.${cred1}.tier == CERTIFIED"
            - "Interpreter.${i1}.roster_status == ACTIVE"
            - "Interpreter.${i1}.credential_tier == CERTIFIED"
            - "Language.${lang_spa}.active_credentialed_count == 1"

      - name: assignment_service_and_compliance_dimensions_advance_independently
        grounds:
          - state_machines.Assignment.CONFIRMED_to_CHECKED_IN
          - state_machines.Assignment.CHECKED_IN_to_COMPLETED
          - state_machines.Assignment.CLEAR_to_UNDER_QUALITY_REVIEW
          - state_machines.Assignment.UNDER_QUALITY_REVIEW_to_SUBSTANTIATED_DEFECT
          - entities.Assignment.fields.service_status
          - entities.Assignment.fields.compliance_status
        distinguishing_aspect: |
          One Assignment row carries two independent state dimensions: the service
          dimension runs CONFIRMED -> CHECKED_IN -> COMPLETED while the compliance
          dimension independently runs CLEAR -> UNDER_QUALITY_REVIEW ->
          SUBSTANTIATED_DEFECT, and neither dimension gates or reorders the other —
          the assignment reaches COMPLETED while still UNDER_QUALITY_REVIEW.
