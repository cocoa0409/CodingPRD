  - section: calculations
    instances:

      - name: progress_report_delta_between_two_finalized_batteries
        claim_type: Correct Result
        claim: "progress_report_delta reports the current and previous composite percentiles from the two FINALIZED PERFORMANCE_BATTERY sessions and their signed delta, together with the normative cohort label and next_test_due_on"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
