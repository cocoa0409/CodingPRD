      - name: agency_read_with_an_unknown_id_returns_agency_not_found
        claim_type: error_triggerable
        grounds: ["errors[ERR_AGENCY_NOT_FOUND]", "endpoints[GET /agencies/{id}]", "validations[priority=7]"]
        distinguishing_aspect: "A well-formed UUID naming no Agency row yields 404 ERR_AGENCY_NOT_FOUND rather than an empty 200 or a 400."
        test_recipe:
          setup:
            - "the clock is pinned; no Agency rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /agencies/6c1f9d2b-3a44-4f18-8e07-91b2d5c7a604"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP 404, response_type == \"error\", data.error_id == \"ERR_AGENCY_NOT_FOUND\""

