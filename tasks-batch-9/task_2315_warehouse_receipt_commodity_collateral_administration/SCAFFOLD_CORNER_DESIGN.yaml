            - *b_wh
          trigger:
            - *b_lic
          assert:
            - "HTTP 200"
            - "Warehouse.${wh_id}.license_state == LICENSED"
            - "Warehouse.${wh_id}.licensed_by_user_id == reg-001"
            - "Warehouse.${wh_id}.license_effective_date == 2026-08-01"
            - "Warehouse.${wh_id}.license_expiry_date == 2027-07-31"
            - "Warehouse.${wh_id}.operational_posture == OPEN"
            - "Warehouse.${wh_id}.version == 2"

