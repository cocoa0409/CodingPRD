              payload: { full_name: "Wes Corbin", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${lc_id}"
            - call: "POST /nonprofits/organizations/${lc_id}/leadership-members"
              payload: { full_name: "Xiu Lan", office_title: "Secretary", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${lc_id}"
            - call: "POST /nonprofits/organizations/${lc_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 1 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/organizations/${o_id}/grants"
              payload: { funder_organization_id: "${k_id}", funder_name_raw: "Kestrel Giving Fund", recipient_name_raw: "Willow Creek Collective", recipient_ein: "900100200", amount_cents: 1000000, fiscal_year: 2025, subject_code: "B82" }
