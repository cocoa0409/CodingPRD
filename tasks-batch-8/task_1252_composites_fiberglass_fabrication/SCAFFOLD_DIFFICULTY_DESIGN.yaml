            - { call: "POST /molds", payload: { mold_code: "MOLD-E1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold1: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-E2", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold2: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-E3", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold3: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /cure-equipment", payload: { equipment_code: "OVEN-CAP", kind: "OVEN", max_parts_per_cycle: 3, turnaround_minutes: 0, max_temperature_c: 200, max_pressure_bar: 0 }, as: ShopManager, captures: { oven_id: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-A1", part_number: "PN-100", mold_id: "${mold1}", ply_book_id: "${pb_id}", quantity: 2, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_a: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-B1", part_number: "PN-100", mold_id: "${mold2}", ply_book_id: "${pb_id}", quantity: 2, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_b: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-C1", part_number: "PN-100", mold_id: "${mold3}", ply_book_id: "${pb_id}", quantity: 2, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_c: $.data.id } }
            - { call: "POST /work-orders/${wo_a}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_b}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_c}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-E1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_a}", resin_batch_id: "${batch_id}", resin_used_g: 100 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_b}", resin_batch_id: "${batch_id}", resin_used_g: 100 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_c}", resin_batch_id: "${batch_id}", resin_used_g: 100 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_a}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_b}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_c}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
          trigger:
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_a}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T14:00:00Z" }, as: CureTechnician, captures: { cc_a: $.data.id, cc_a_status: $.data.status } }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_b}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T14:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }, as: CureTechnician, captures: { cc_b: $.data.id, cc_b_status: $.data.status } }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_c}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T13:00:00Z", scheduled_end: "2026-06-01T15:00:00Z" }, as: CureTechnician, captures: { err_c: $.data.error_id } }
          assert:
            - "cc_a_status == SCHEDULED (2 of 3 parts in [12:00,14:00))"
            - "cc_b_status == SCHEDULED (half-open adjacency at 14:00 is NOT an overlap; aggregate capacity untouched)"
            - "err_c == ERR_EQUIPMENT_CAPACITY_EXCEEDED (straddling window overlaps both: 2+2+2 = 6 > 3)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: resin_mass_conservation_across_void
        grounds:
          - state_machines.LayupSession.ACTIVE_to_VOIDED
          - entities.ResinBatch.fields.remaining_mass_g
          - entities.ResinBatch.fields.consumed_mass_g
        distinguishing_aspect: |
          Conserved quantity = mixed resin mass (grams):
          total_mass_g == consumed_mass_g + remaining_mass_g + quenched_mass_g
          at every step; a 300 g session followed by its void returns the batch
          to consumed 0 / remaining 1020 / status MIXED with zero drift.
          Companion invariant conserves a different quantity (styrene allowance
          kilograms on the permit).
        test_recipe:
          setup:
            - "Clock T0; permit; approved PN-100; PRODUCTION mold; WO-V1 in LAYUP_IN_PROGRESS; batch BATCH-V1 with total_mass_g 1020 (1000 resin + 20 catalyst)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-V1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-V1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-V1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 300 }, as: Laminator, as_user_id: "op-lam-1", captures: { sess: $.data.id } }
            - { call: "GET /resin-batches/${batch_id}", payload: {}, as: Laminator, as_user_id: "op-lam-1", captures: { consumed_mid: $.data.consumed_mass_g, remaining_mid: $.data.remaining_mass_g, status_mid: $.data.status } }
            - { call: "POST /layup-sessions/${sess}/void", payload: {}, as: ShopManager }
            - { call: "GET /resin-batches/${batch_id}", payload: {}, as: Laminator, as_user_id: "op-lam-1", captures: { consumed_end: $.data.consumed_mass_g, remaining_end: $.data.remaining_mass_g, quenched_end: $.data.quenched_mass_g, status_end: $.data.status } }
          assert:
            - "consumed_mid == 300.0 and remaining_mid == 720.0 and status_mid == PARTIALLY_CONSUMED (1020 == 300 + 720 + 0)"
            - "consumed_end == 0.0 and remaining_end == 1020.0 and quenched_end == 0 and status_end == MIXED (void restored the invariant exactly)"

      - name: emission_ledger_void_restores_exactly
        grounds:
          - state_machines.LayupSession.ACTIVE_to_VOIDED
          - calculations.styrene_emission_kg
          - entities.EmissionPermit.fields.styrene_used_kg
        distinguishing_aspect: |
          Conserved quantity = styrene allowance (kilograms) on the permit:
          styrene_used_kg == sum of stored session emissions over ACTIVE
          sessions; voiding subtracts the session's STORED styrene_emitted_kg
          (never a recomputation), returning the ledger to 0.0000 exactly.
          Companion invariant conserves a different quantity (resin mass in
          grams).
        test_recipe:
          setup:
            - "Clock T0; permit PER-V2 quota 50 kg; approved PN-100; PRODUCTION mold; WO-V2 in LAYUP_IN_PROGRESS; batch BATCH-V2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-V2", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer, captures: { per_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-V2", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-V2", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-V2", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 250 }, as: Laminator, as_user_id: "op-lam-1", captures: { sess: $.data.id, sess_emit: $.data.styrene_emitted_kg, sess_permit: $.data.permit_id } }
            - { call: "GET /emission-permits/${per_id}", payload: {}, as: EHSOfficer, captures: { used_mid: $.data.styrene_used_kg } }
            - { call: "POST /layup-sessions/${sess}/void", payload: {}, as: ShopManager, captures: { sess_status: $.data.status } }
            - { call: "GET /emission-permits/${per_id}", payload: {}, as: EHSOfficer, captures: { used_end: $.data.styrene_used_kg, per_status: $.data.status } }
          assert:
            - "sess_emit == 0.0088 and sess_permit == ${per_id} (selector posted to the covering ACTIVE permit)"
            - "used_mid == 0.0088 (forward action added the stored emission)"
            - "used_end == 0.0 and per_status == ACTIVE (compensation subtracted exactly the stored value; no drift)"
            - "sess_status == VOIDED"
