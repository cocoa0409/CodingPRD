# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of §1.1-§1.7)
# crypto-exchange-wallet — sections/claim_types drawn from claim-extraction-guide.
# Every setup_api_calls chain drives empty-DB -> precondition with §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: account_create_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with email/full_name/residence_country returns 201 with kyc_tier==TIER_0, kyc_status==UNVERIFIED, account_status==ACTIVE, version==1, cost_basis_method default FIFO."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "new@x.com", full_name: "New User", residence_country: "US" }
              as: Anonymous
              captures: { acc_id: $.data.id }
          assert:
            - "Response status 201"
            - "data.kyc_tier == TIER_0 and data.kyc_status == UNVERIFIED and data.account_status == ACTIVE and data.version == 1 and data.cost_basis_method == FIFO"

      - name: account_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Account.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts without email returns 422 ERR_INVALID_REQUEST (email is source:input with no default)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { full_name: "No Email", residence_country: "US" }
              as: Anonymous
          assert:
            - "Response status 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: account_default_cost_basis_method_applied
        claim_type: Defaults
        grounds: [entities.Account.fields.cost_basis_method]
        distinguishing_aspect: "Omitting cost_basis_method yields default FIFO on the created Account."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "dflt@x.com", full_name: "Default CB", residence_country: "GB" }
              as: Anonymous
          assert:
            - "data.cost_basis_method == FIFO"

      - name: account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Operator
          assert:
            - "Response status 404 and data.error_id == ERR_NOT_FOUND"

      - name: account_computed_fee_tier_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Account.fields.fee_tier, entities.Account.fields.taker_volume_30d_usd]
        distinguishing_aspect: "fee_tier and taker_volume_30d_usd are source:computed; a freshly created account with no trades reads taker_volume_30d_usd==0 and fee_tier==TIER_BASE regardless of any input."
        test_recipe:
          setup: ["TIER_BASE fee schedule exists so fee_tier can resolve"]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_name: "TIER_BASE", min_taker_volume_30d_usd: 0, maker_fee_bps: 10, taker_fee_bps: 30 }
              as: Operator
          trigger:
            - call: "POST /accounts"
              payload: { email: "comp@x.com", full_name: "Comp", residence_country: "US" }
              as: Anonymous
              captures: { acc_cp: $.data.id }
            - call: "GET /accounts/${acc_cp}"
              payload: {}
              as: Operator
          assert:
            - "data.taker_volume_30d_usd == 0 and data.fee_tier == TIER_BASE"

      - name: assetconfig_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.AssetConfig]
        distinguishing_aspect: "AssetConfig has common_fields:false — its create response carries id and created_at but no version field, and only spot_price_usd is mutable via PATCH (no general update)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
              captures: { btc_id: $.data.id }
            - call: "PATCH /assets/${btc_id}"
              payload: { spot_price_usd: 41000 }
              as: Operator
          assert:
            - "Create response has data.id and data.created_at but no data.version field"
            - "PATCH returns 200 with data.spot_price_usd == 41000"

      - name: balance_listing_pagination_envelope
        claim_type: Listing
        grounds: [entities.Balance, response_envelope]
        distinguishing_aspect: "GET /balances returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["one account with a credited USD balance"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { symbol: "USD", decimals: 2, required_confirmations: 0, is_fiat: true, min_withdrawal_amount: 1, network_fee: 0, spot_price_usd: 1 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "bal@x.com", full_name: "Bal", residence_country: "US" }
              as: Anonymous
              captures: { acc_bl: $.data.id }
            - call: "POST /deposits"
              payload: { account_id: "${acc_bl}", asset: "USD", amount: 100, unit_cost_usd: 1 }
              as: Operator
              captures: { dep_bl: $.data.id }
            - call: "POST /deposits/${dep_bl}/confirmations"
              payload: { delta: 0 }
              as: Operator
          trigger:
            - call: "GET /balances"
              payload: { account_id: "${acc_bl}" }
              as: Trader
              as_user_id: "${acc_bl}"
          assert:
            - "response_type == array; meta.total_count == 1 and has_more == false"
            - "the USD Balance has available_amount == 100"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: kyc_decision_on_non_pending_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Account.PENDING_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /accounts/{id}/kyc-decisions on an account whose kyc_status is UNVERIFIED (never applied) fails with ERR_INVALID_STATE (no PENDING from-state)."
        test_recipe:
          setup: ["a brand-new UNVERIFIED account"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "kd@x.com", full_name: "KD", residence_country: "US" }
              as: Anonymous
              captures: { acc_kd: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_kd}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
          assert:
            - "Response status 409 and data.error_id == ERR_INVALID_STATE"

      - name: deposit_orphan_from_credited_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Deposit.DETECTED_to_ORPHANED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /deposits/{id}/orphan on a CREDITED deposit fails with ERR_INVALID_STATE (orphan only from DETECTED)."
        test_recipe:
          setup: ["a CREDITED fiat USD deposit"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { symbol: "USD", decimals: 2, required_confirmations: 0, is_fiat: true, min_withdrawal_amount: 1, network_fee: 0, spot_price_usd: 1 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "do@x.com", full_name: "DO", residence_country: "US" }
              as: Anonymous
              captures: { acc_do: $.data.id }
            - call: "POST /deposits"
              payload: { account_id: "${acc_do}", asset: "USD", amount: 50, unit_cost_usd: 1 }
              as: Operator
              captures: { dep_do: $.data.id }
            - call: "POST /deposits/${dep_do}/confirmations"
              payload: { delta: 0 }
              as: Operator
          trigger:
            - call: "POST /deposits/${dep_do}/orphan"
              payload: {}
              as: Operator
          assert:
            - "Response status 409 and data.error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_order_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Order.OPEN_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second DELETE /orders/{id} on an already-CANCELLED order fails with ERR_INVALID_STATE; no balances move twice."
        test_recipe:
          setup: ["USD/BTC; account TIER_1 with 50000 USD; one OPEN BUY LIMIT, then cancelled once"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { symbol: "USD", decimals: 2, required_confirmations: 0, is_fiat: true, min_withdrawal_amount: 1, network_fee: 0, spot_price_usd: 1 }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
            - call: "POST /fee-schedules"
              payload: { tier_name: "TIER_BASE", min_taker_volume_30d_usd: 0, maker_fee_bps: 10, taker_fee_bps: 30 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "cc@x.com", full_name: "CC", residence_country: "US" }
              as: Anonymous
              captures: { acc_cc: $.data.id }
            - call: "POST /accounts/${acc_cc}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_cc}"
            - call: "POST /accounts/${acc_cc}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_cc}", asset: "USD", amount: 50000, unit_cost_usd: 1 }
              as: Operator
              captures: { dep_cc: $.data.id }
            - call: "POST /deposits/${dep_cc}/confirmations"
              payload: { delta: 0 }
              as: Operator
            - call: "GET /accounts/${acc_cc}"
              payload: {}
              as: Trader
              as_user_id: "${acc_cc}"
              captures: { v_cc: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_cc}", base_asset: "BTC", quote_asset: "USD", side: "BUY", order_type: "LIMIT", quantity: 1.0, limit_price: 40000, time_in_force: "GTC", expected_account_version: "${v_cc}" }
              as: Trader
              as_user_id: "${acc_cc}"
              captures: { oid_cc: $.data.id }
            - call: "DELETE /orders/${oid_cc}"
              payload: {}
              as: Trader
              as_user_id: "${acc_cc}"
          trigger:
            - call: "DELETE /orders/${oid_cc}"
              payload: {}
              as: Trader
              as_user_id: "${acc_cc}"
          assert:
            - "Response status 409 and data.error_id == ERR_INVALID_STATE"

      - name: withdrawal_terminal_completed_lockdown
        claim_type: terminal_state
        grounds: [state_machines.Withdrawal.BROADCAST_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal COMPLETED a withdrawal cannot be broadcast again; POST /withdrawals/{id}/broadcast fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["a COMPLETED BTC withdrawal of 0.01 (notional 400, below travel rule), TIER_1 account"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "wt@x.com", full_name: "WT", residence_country: "US" }
              as: Anonymous
              captures: { acc_wt: $.data.id }
            - call: "POST /accounts/${acc_wt}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_wt}"
            - call: "POST /accounts/${acc_wt}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_wt}", asset: "BTC", amount: 1.0, unit_cost_usd: 30000 }
              as: Operator
              captures: { dep_wt: $.data.id }
            - call: "POST /deposits/${dep_wt}/confirmations"
              payload: { delta: 1 }
              as: Operator
            - call: "GET /accounts/${acc_wt}"
              payload: {}
              as: Trader
              as_user_id: "${acc_wt}"
              captures: { v_wt: $.data.version }
            - call: "POST /withdrawal-addresses"
              payload: { account_id: "${acc_wt}", asset: "BTC", chain_address: "0xWT", label: "out", expected_account_version: "${v_wt}" }
              as: Trader
              as_user_id: "${acc_wt}"
              captures: { addr_wt: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-02T01:00:00Z" }
              as: Operator
            - call: "POST /withdrawal-addresses/${addr_wt}/activate"
              payload: {}
              as: Trader
              as_user_id: "${acc_wt}"
            - call: "POST /withdrawals"
              payload: { account_id: "${acc_wt}", withdrawal_address_id: "${addr_wt}", amount: 0.01 }
              as: Trader
              as_user_id: "${acc_wt}"
              captures: { wd_wt: $.data.id }
            - call: "POST /withdrawals/${wd_wt}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-21"
            - call: "POST /withdrawals/${wd_wt}/screen-result"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-21"
            - call: "POST /withdrawals/${wd_wt}/broadcast"
              payload: {}
              as: Operator
            - call: "POST /withdrawals/${wd_wt}/confirm-onchain"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /withdrawals/${wd_wt}/broadcast"
              payload: {}
              as: Operator
          assert:
            - "Response status 409 and data.error_id == ERR_INVALID_STATE"

      - name: address_activate_before_hold_elapsed_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.WithdrawalAddress.PENDING_HOLD_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a PENDING_HOLD address before current_clock reaches activates_at fails with ERR_INVALID_STATE (24h hold precondition unmet)."
        test_recipe:
          setup: ["account TIER_0; a PENDING_HOLD BTC address added 1h ago"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "ah@x.com", full_name: "AH", residence_country: "US" }
              as: Anonymous
              captures: { acc_ah: $.data.id }
            - call: "GET /accounts/${acc_ah}"
              payload: {}
              as: Trader
              as_user_id: "${acc_ah}"
              captures: { v_ah: $.data.version }
            - call: "POST /withdrawal-addresses"
              payload: { account_id: "${acc_ah}", asset: "BTC", chain_address: "0xAH", label: "out", expected_account_version: "${v_ah}" }
              as: Trader
              as_user_id: "${acc_ah}"
              captures: { addr_ah: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T01:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /withdrawal-addresses/${addr_ah}/activate"
              payload: {}
              as: Trader
              as_user_id: "${acc_ah}"
          assert:
            - "Response status 409 and data.error_id == ERR_INVALID_STATE (only 1h of the 24h hold elapsed)"

      - name: staking_release_before_cooldown_returns_nothing_to_claim
        claim_type: precondition_enforcement
        grounds: [state_machines.StakingPosition.UNBONDING_to_CLOSED, "validations[priority=19]", "errors[ERR_NOTHING_TO_CLAIM]"]
        distinguishing_aspect: "POST /staking-positions/{id}/release before unbond_available_at fails with ERR_NOTHING_TO_CLAIM (clock < cooldown end)."
        test_recipe:
          setup: ["ETH; account TIER_1 holds 100 ETH; one UNBONDING position with cooldown ending in 7 days"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "ETH", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.001, network_fee: 0.001, spot_price_usd: 2000 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "sr@x.com", full_name: "SR", residence_country: "US" }
              as: Anonymous
              captures: { acc_sr: $.data.id }
            - call: "POST /accounts/${acc_sr}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_sr}"
            - call: "POST /accounts/${acc_sr}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_sr}", asset: "ETH", amount: 100, unit_cost_usd: 1800 }
              as: Operator
              captures: { dep_sr: $.data.id }
            - call: "POST /deposits/${dep_sr}/confirmations"
              payload: { delta: 1 }
              as: Operator
            - call: "POST /staking-positions"
              payload: { account_id: "${acc_sr}", asset: "ETH", principal_amount: 100, apr_bps: 500 }
              as: Trader
              as_user_id: "${acc_sr}"
              captures: { pos_sr: $.data.id }
            - call: "POST /staking-positions/${pos_sr}/unbond"
              payload: {}
              as: Trader
              as_user_id: "${acc_sr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-03T00:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /staking-positions/${pos_sr}/release"
              payload: {}
              as: Trader
              as_user_id: "${acc_sr}"
          assert:
            - "Response status 409 and data.error_id == ERR_NOTHING_TO_CLAIM (clock 2027-07-03 < unbond_available_at 2027-07-08)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: staking_half_year_reward_correct
        claim_type: correct_result
        grounds: [calculations.staking_reward_accrual, entities.StakingPosition.fields.accrued_rewards]
        distinguishing_aspect: "100 ETH @ 500 bps accrued over exactly half a year credits 2.50000000 ETH to available on claim (100 * 0.05 * 0.5)."
        test_recipe:
          setup: ["ETH; account TIER_1 holds 100 ETH; one ACTIVE position staked at 2027-08-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "ETH", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.001, network_fee: 0.001, spot_price_usd: 2000 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "sh@x.com", full_name: "SH", residence_country: "US" }
              as: Anonymous
              captures: { acc_sh: $.data.id }
            - call: "POST /accounts/${acc_sh}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_sh}"
            - call: "POST /accounts/${acc_sh}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_sh}", asset: "ETH", amount: 100, unit_cost_usd: 1800 }
              as: Operator
              captures: { dep_sh: $.data.id }
            - call: "POST /deposits/${dep_sh}/confirmations"
              payload: { delta: 1 }
              as: Operator
            - call: "POST /staking-positions"
              payload: { account_id: "${acc_sh}", asset: "ETH", principal_amount: 100, apr_bps: 500 }
              as: Trader
              as_user_id: "${acc_sh}"
              captures: { pos_sh: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-30T12:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /staking-positions/${pos_sh}/claim"
              payload: {}
              as: Trader
              as_user_id: "${acc_sh}"
            - call: "GET /balances"
              payload: { account_id: "${acc_sh}", asset: "ETH" }
              as: Trader
              as_user_id: "${acc_sh}"
          assert:
            - "Elapsed 2027-08-01..2028-01-30T12:00 == 15768000s == 0.5y; claim credits 2.50000000 ETH; ETH available_amount == 2.5 (principal still held)"

      - name: deposit_creates_lot_with_correct_unit_cost
        claim_type: correct_result
        grounds: [calculations.realized_gain_on_disposal, entities.CostBasisLot.fields.unit_cost_usd, state_machines.Deposit.CONFIRMING_to_CREDITED]
        distinguishing_aspect: "A CREDITED 2.0 BTC deposit at unit_cost 35000 creates exactly one OPEN CostBasisLot with original_quantity==2.0, remaining_quantity==2.0, unit_cost_usd==35000."
        test_recipe:
          setup: ["BTC required_confirmations 2; one account; deposit 2 BTC pending"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 2, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "dl@x.com", full_name: "DL", residence_country: "US" }
              as: Anonymous
              captures: { acc_dl: $.data.id }
            - call: "POST /deposits"
              payload: { account_id: "${acc_dl}", asset: "BTC", amount: 2.0, unit_cost_usd: 35000 }
              as: Operator
              captures: { dep_dl: $.data.id }
          trigger:
            - call: "POST /deposits/${dep_dl}/confirmations"
              payload: { delta: 2 }
              as: Operator
            - call: "GET /cost-basis-lots"
              payload: { account_id: "${acc_dl}", asset: "BTC" }
              as: Trader
              as_user_id: "${acc_dl}"
          assert:
            - "Exactly one CostBasisLot exists: origin_type==DEPOSIT, status==OPEN, original_quantity==2.0, remaining_quantity==2.0, unit_cost_usd==35000"

      - name: daily_withdrawal_limit_aggregate_blocks_second
        claim_type: correct_result
        grounds: [calculations.daily_withdrawal_usd_used, "validations[priority=16]", "errors[ERR_DAILY_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "TIER_1 ceiling 1000 USD: first 0.02 BTC (800) succeeds; a same-day second 0.02 BTC (800) makes 1600 > 1000 and is rejected ERR_DAILY_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["BTC spot 40000; account TIER_1 holds 1 BTC; ACTIVE address; one SUBMITTED 0.02 BTC withdrawal today"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T08:00:00Z" }
              as: Operator
            - call: "POST /assets"
