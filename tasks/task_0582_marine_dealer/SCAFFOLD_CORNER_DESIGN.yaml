  # ==========================================================================
  - section: cross_cutting
    instances:
      - name: floorplan_create_stale_unit_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[floorplan-supersede-stale-unit]", "errors[ERR_STALE_UNIT_VERSION]"]
        distinguishing_aspect: "After a first floor-plan create bumps Unit.version, a second create carrying the original expected_unit_version returns ERR_STALE_UNIT_VERSION (412)."
        test_recipe:
          setup: ["A Unit at version 1 with one ACTIVE FloorPlan already created (Unit now at version 2)."]
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINOCC000001", make: "Grady-White", model: "236", model_year: 2024, unit_type: "BOAT", length_ft: 23, cost_cents: 6000000, list_price_cents: 7200000, acquisition_type: "FLOOR_PLAN" }
              as: Manager
              captures: { u_id: $.data.id, u_v: $.data.version }
            - call: "POST /floor-plans"
              payload: { unit_id: "${u_id}", lender_name: "Marine Credit", principal_cents: 6000000, apr_bps: 900, advanced_at: "2026-04-01T00:00:00Z", curtailment_pct_bps: 1000, expected_unit_version: "${u_v}" }
              as: Manager
          trigger:
            - call: "POST /floor-plans"
              payload: { unit_id: "${u_id}", lender_name: "Marine Credit", principal_cents: 5500000, apr_bps: 880, advanced_at: "2026-04-15T00:00:00Z", curtailment_pct_bps: 1000, expected_unit_version: "${u_v}" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_UNIT_VERSION"

      - name: floorplan_create_supersedes_prior_and_bumps_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[floorplan-supersede-stale-unit]", state_machines.FloorPlan.ACTIVE_to_SUPERSEDED, entities.Unit.fields.version]
        distinguishing_aspect: "A floor-plan create with the current expected_unit_version succeeds, supersedes the prior plan, and increments Unit.version to 2."
        test_recipe:
          setup: ["A Unit at version 1 with one ACTIVE FloorPlan (fp_a)."]
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINOCCOK0001", make: "Grady-White", model: "251", model_year: 2024, unit_type: "BOAT", length_ft: 25, cost_cents: 6300000, list_price_cents: 7600000, acquisition_type: "FLOOR_PLAN" }
              as: Manager
              captures: { u_id: $.data.id, u_v: $.data.version }
            - call: "POST /floor-plans"
              payload: { unit_id: "${u_id}", lender_name: "Marine Credit", principal_cents: 6300000, apr_bps: 900, advanced_at: "2026-04-01T00:00:00Z", curtailment_pct_bps: 1000, expected_unit_version: "${u_v}" }
              as: Manager
              captures: { fp_a_id: $.data.id }
          trigger:
            - call: "GET /units/${u_id}"
              payload: {}
              as: Manager
          assert:
            - "FloorPlan.${fp_a_id}.status == ACTIVE"
            - "Unit.${u_id}.version == 2"

      - name: floor_plan_balance_reconciles_after_curtail
        claim_type: derived_field_reconciliation
        grounds: [entities.Unit.fields.floor_plan_balance_cents, calculations.unit_aging, state_machines.FloorPlan.ACTIVE_to_CURTAILED]
        distinguishing_aspect: "Unit.floor_plan_balance_cents equals the plan outstanding (8000000), then reconciles to 7900000 after a 100000 curtailment."
        test_recipe:
          setup: ["Clock 2026-06-01; Unit with a due FloorPlan (advanced 2026-03-01, outstanding 8000000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
            - call: "POST /units"
              payload: { hin: "HINBAL000001", make: "Sea Ray", model: "SLX4", model_year: 2024, unit_type: "BOAT", length_ft: 30, cost_cents: 7200000, list_price_cents: 8900000, acquisition_type: "FLOOR_PLAN" }
              as: Manager
              captures: { u_id: $.data.id, u_v: $.data.version }
            - call: "POST /floor-plans"
              payload: { unit_id: "${u_id}", lender_name: "Marine Credit", principal_cents: 8000000, apr_bps: 900, advanced_at: "2026-03-01T00:00:00Z", curtailment_pct_bps: 1000, expected_unit_version: "${u_v}" }
              as: Manager
              captures: { fp_id: $.data.id }
          trigger:
            - call: "POST /floor-plans/${fp_id}/curtail"
              payload: { payment_cents: 100000 }
              as: Manager
          assert:
            - "FloorPlan.${fp_id}.outstanding_principal_cents == 7900000"
            - "Unit.${u_id}.floor_plan_balance_cents == 7900000"

