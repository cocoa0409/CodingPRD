      - name: spa_chlorine_limits_are_stricter_than_pool_limits
        claim_type: Input Set Filtering
        grounds: [calculations.water_reading_classification, entities.Facility.fields.water_type]
        distinguishing_aspect: "The limit set is selected by the parent facility's water_type: 1.5 ppm is IN_RANGE for a pool but OUT_OF_RANGE for a spa (minimum 2.0), and 0.9 ppm is IMMINENT_HAZARD for a spa (floor 1.0) while it would only be OUT_OF_RANGE for a pool."
