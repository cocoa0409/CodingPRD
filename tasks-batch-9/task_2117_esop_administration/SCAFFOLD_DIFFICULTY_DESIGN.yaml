  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: valuation_coverage_half_open_overlap_on_plan
        grounds:
          - validations[priority=15]
          - entities.Valuation.fields.effective_from_date
          - entities.Valuation.fields.effective_to_date
          - errors[ERR_VALUATION_PERIOD_OVERLAP]
        distinguishing_aspect: |
          The interval semantics here are half-open [from, to) on the EsopPlan resource, so
          adjacency is legal: a second appraisal covering 2026-06-01 to 2026-12-01 collides
          with the incumbent 2026-01-01 to 2027-01-01 and is refused, while one covering
          2027-01-01 to 2028-01-01 touches the incumbent's exclusive end and is admitted.
        test_recipe:
          setup:
            - "One OPEN plan with a single SUBMITTED valuation covering [2026-01-01, 2027-01-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Interval Plan", sponsor_name: "Northgate Tooling Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
