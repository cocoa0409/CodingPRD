        distinguishing_aspect: "Inspection with outcome=PASS but measured_soc deviating > ±2.0 from declared returns ERR_SOC_OUT_OF_TOLERANCE."
        test_recipe:
          setup: ["program; lot in QUARANTINE with receiving_soc_percent=40.0"]
