# =============================================================================
# SCAFFOLD.yaml — task_3383_volunteer_delivered_classroom_program_scheduling_curriculum_kits
# Volunteer-Delivered Classroom Program Scheduling & Curriculum Kits
# =============================================================================

scenario: |
  Volunteer-Delivered Classroom Program Scheduling & Curriculum Kits (Junior Achievement): school partnership agreements scheduling program delivery into classroom time with teacher coordination, volunteer recruitment from corporate partners with background screening and training completion, curriculum kit assembly and distribution matched to grade level and session count, session scheduling across multiple consecutive classroom visits with volunteer substitution when a volunteer cannot attend, capstone experiences at simulated town and finance park facilities with student rotation and role assignment, corporate sponsorship tied to volunteer participation and program funding with recognition, student outcome surveys and program evaluation reporting to funders, area office territory and school district relationship management

domain_name: volunteer-classroom-programs
api_prefix: /ja-programs

complexity_profile:
  primary_archetype: "Quota / allocation (curriculum-kit inventory: assemble, reserve, distribute, reconcile, write-off over a finite physical pool)"
  secondary_archetype: "Temporal windowing (volunteer session overlap, facility buffered capacity, weekly cadence windows)"
  complexity_layers:
    - optimistic_concurrency      # OCC on PartnershipAgreement.version (delivery create) and ClassroomDelivery.version (substitute)
    - cascading_side_effects      # partner exit -> volunteer departure -> session NEEDS_SUBSTITUTE -> delivery blocked; district churn -> agreement terminate -> delivery cancel -> kit release
    - dual_variant_calculation    # evaluation metrics PROVISIONAL vs FINAL; recognition tier EARNED vs PROJECTED
    - scheduled_deferred_actions  # logical clock sweeps: screening/training expiry, session auto-NO_SHOW after delivery window
  entity_topology: flat           # all resources top-level under /ja-programs; FK references in bodies
  state_machine_shape: parallel   # Volunteer (screening x training x engagement) and ClassroomDelivery (status x kit_status) carry independent state dimensions; Agreement is cyclic, Session has self-loops
  relationship_patterns:
    - one_to_many                 # AreaOffice->District->School; Partner->Volunteer; Agreement->Delivery->Session
    - cross_aggregate             # Session -> Volunteer; Delivery -> KitInventory resolution via school->district->office chain
  role_model: peer_roles          # AreaDirector / PartnershipManager / ProgramCoordinator / LogisticsCoordinator own disjoint surfaces; Funder read-only
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: AreaOffice
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Area office display name" }
      - { name: region_code, type: string, source: input, description: "Short territory code, e.g. METRO-NORTH" }
      - { name: max_districts, type: integer, source: input, description: "Territory capacity: maximum number of non-CHURNED districts this office may manage" }

  - name: SchoolDistrict
    parent: AreaOffice
    common_fields: true
    fields:
      - { name: area_office_id, type: string, source: input, description: "FK -> AreaOffice.id; managing office" }
      - { name: name, type: string, source: input, description: "District name" }
      - { name: relationship_status, type: enum, source: system, description: "PROSPECT | PARTNER | AT_RISK | CHURNED", default: PROSPECT, constraints: "enum lifecycle; see state_machines.SchoolDistrict" }

  - name: School
    parent: SchoolDistrict
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> SchoolDistrict.id; owning district" }
      - { name: name, type: string, source: input, description: "School name" }
      - { name: grade_band_low, type: integer, source: input, description: "Lowest grade served (1-12)" }
      - { name: grade_band_high, type: integer, source: input, description: "Highest grade served (>= grade_band_low)" }
      - { name: instructional_days, type: array, source: input, description: "Weekdays on which sessions may run; members of MON|TUE|WED|THU|FRI" }

  - name: CorporatePartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner organization name" }
      - { name: industry, type: string, source: input, description: "Industry label" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | SUSPENDED | EXITED", default: PROSPECT }

  - name: Volunteer
    parent: CorporatePartner
    common_fields: true
    fields:
      - { name: corporate_partner_id, type: string, source: input, description: "FK -> CorporatePartner.id; recruiting partner" }
      - { name: full_name, type: string, source: input, description: "Volunteer name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: screening_status, type: enum, source: system, description: "INITIATED | CLEARED | FLAGGED | EXPIRED", default: INITIATED, constraints: "parallel state dimension 1" }
      - { name: screening_expires_on, type: datetime, source: system, description: "Set to clearance time + 365 days on CLEAR; null otherwise" }
      - { name: training_status, type: enum, source: system, description: "NOT_STARTED | IN_PROGRESS | COMPLETED | EXPIRED", default: NOT_STARTED, constraints: "parallel state dimension 2" }
      - { name: training_expires_on, type: datetime, source: system, description: "Set to completion time + 365 days on COMPLETE; null otherwise" }
      - { name: engagement_status, type: enum, source: system, description: "ACTIVE | DEPARTED", default: ACTIVE, constraints: "parallel state dimension 3" }
      - { name: hours_contributed, type: number, source: computed, description: "Sum of session_hours over DELIVERED sessions assigned to this volunteer; per-session rounding then sum (see calculations.volunteer_hours)", default: 0 }
      - { name: eligible, type: boolean, source: computed, description: "true iff screening_status==CLEARED AND training_status==COMPLETED AND engagement_status==ACTIVE AND partner status==ACTIVE" }

  - name: ProgramCatalog
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique program code, e.g. JA-OUR-CITY" }
      - { name: title, type: string, source: input, description: "Program title" }
      - { name: grade_band_low, type: integer, source: input, description: "Lowest grade this program targets" }
      - { name: grade_band_high, type: integer, source: input, description: "Highest grade this program targets" }
      - { name: session_count, type: integer, source: input, description: "Number of consecutive classroom sessions the program requires (4-7)" }
      - { name: minutes_per_session, type: integer, source: input, description: "Advisory length of each session in minutes" }
      - { name: capstone_required, type: boolean, source: input, description: "Whether deliveries must end with a capstone facility event" }
      - { name: capstone_facility, type: enum, source: input, description: "SIMULATED_TOWN | FINANCE_PARK | NONE; must be NONE iff capstone_required is false" }
      - { name: min_students, type: integer, source: input, description: "Minimum enrolled_count for a delivery" }
      - { name: max_students, type: integer, source: input, description: "Maximum enrolled_count for a delivery" }

  - name: PartnershipAgreement
    parent: School
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; partner school" }
      - { name: program_catalog_id, type: string, source: input, description: "FK -> ProgramCatalog.id; program to deliver" }
      - { name: sponsor_partner_id, type: string, source: input, description: "FK -> CorporatePartner.id; funding and volunteer sponsor" }
      - { name: school_year, type: string, source: input, description: "Academic year label, e.g. 2026-2027" }
      - { name: funding_pledged_cents, type: integer, source: input, description: "Sponsor funding pledge in cents" }
      - { name: funding_received_cents, type: integer, source: system, description: "Funding recorded so far via RECORD_FUNDING; never exceeds funding_pledged_cents", default: 0 }
      - { name: pending_program_catalog_id, type: string, source: system, description: "Proposed replacement program while AMENDMENT_PENDING; null otherwise" }
      - { name: pending_funding_pledged_cents, type: integer, source: system, description: "Proposed replacement pledge while AMENDMENT_PENDING; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | ACTIVE | AMENDMENT_PENDING | COMPLETED | TERMINATED | WITHDRAWN", default: DRAFT }
      - { name: sponsor_volunteer_hours, type: number, source: computed, description: "Sum of session_hours over DELIVERED sessions (any delivery of this agreement) whose assigned volunteer belongs to sponsor_partner_id", default: 0 }
      - { name: recognition_tier, type: enum, source: computed, description: "NONE | BRONZE | SILVER | GOLD; EARNED variant of calculations.recognition_tier, recomputed on funding record and on every DELIVERED session", default: NONE }
      - { name: deliveries_completed_count, type: integer, source: computed, description: "Count of deliveries of this agreement in status COMPLETED", default: 0 }

  - name: ClassroomDelivery
    parent: PartnershipAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> PartnershipAgreement.id; funding/program context" }
      - { name: program_catalog_id, type: string, source: system, description: "FK -> ProgramCatalog.id; snapshot of the agreement's program at creation (later amendments do not retro-change existing deliveries)" }
      - { name: lead_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; default session volunteer" }
      - { name: classroom_label, type: string, source: input, description: "Classroom identifier, e.g. 'Room 12 - Ms. Alvarez'" }
      - { name: teacher_email, type: string, source: input, description: "Coordinating teacher contact" }
      - { name: teacher_confirmed, type: boolean, source: system, description: "Set true by CONFIRM_TEACHER action; required before SCHEDULE", default: false }
      - { name: enrolled_count, type: integer, source: input, description: "Planned roster size; drives required_kits and facility capacity accounting" }
      - { name: required_kits, type: integer, source: computed, description: "Kit requirement per calculations.required_kits; computed at creation and immutable thereafter" }
      - { name: status, type: enum, source: system, description: "DRAFT | PLANNED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", default: DRAFT, constraints: "parallel state dimension 1" }
      - { name: kit_status, type: enum, source: system, description: "NONE | RESERVED | DISTRIBUTED | RECONCILED | RELEASED", default: NONE, constraints: "parallel state dimension 2" }
      - { name: kits_consumed, type: integer, source: system, description: "Kits consumed reported at RECONCILE_KITS", default: 0 }
      - { name: sessions_delivered_count, type: integer, source: computed, description: "Count of sessions of this delivery in DELIVERED", default: 0 }
      - { name: sessions_blocked_count, type: integer, source: computed, description: "Count of sessions of this delivery in NEEDS_SUBSTITUTE", default: 0 }

  - name: DeliverySession
    parent: ClassroomDelivery
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: input, description: "FK -> ClassroomDelivery.id; owning delivery" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; assigned volunteer (changed by SUBSTITUTE)" }
      - { name: sequence_no, type: integer, source: system, description: "1-based creation order within the delivery (max existing sequence_no + 1)" }
      - { name: scheduled_date, type: string, source: input, description: "Session date, ISO YYYY-MM-DD" }
      - { name: start_minutes, type: integer, source: input, description: "Minutes after midnight, session start (0-1439)" }
      - { name: end_minutes, type: integer, source: input, description: "Minutes after midnight, session end; must be > start_minutes and <= 1440" }
      - { name: duration_minutes, type: integer, source: computed, description: "end_minutes - start_minutes" }
      - { name: status, type: enum, source: system, description: "TENTATIVE | SCHEDULED | NEEDS_SUBSTITUTE | DELIVERED | NO_SHOW | CANCELLED", default: TENTATIVE }

  - name: KitInventory
    parent: AreaOffice
    common_fields: true
    fields:
      - { name: area_office_id, type: string, source: input, description: "FK -> AreaOffice.id; warehouse office" }
      - { name: program_catalog_id, type: string, source: input, description: "FK -> ProgramCatalog.id; program this stock serves" }
      - { name: assembled_count, type: integer, source: system, description: "Lifetime kits assembled via ASSEMBLE", default: 0 }
      - { name: available_count, type: integer, source: system, description: "Kits on shelf, unreserved", default: 0 }
      - { name: reserved_count, type: integer, source: system, description: "Kits reserved by deliveries", default: 0 }
      - { name: distributed_count, type: integer, source: system, description: "Kits handed out, not yet reconciled", default: 0 }
      - { name: written_off_count, type: integer, source: system, description: "Damaged/destroyed kits via WRITE_OFF", default: 0 }
      - { name: consumed_count, type: integer, source: system, description: "Kits consumed in classrooms via RECONCILE_KITS", default: 0 }
    constraints: "Unique per (area_office_id, program_catalog_id). Invariant: assembled_count == available_count + reserved_count + distributed_count + written_off_count + consumed_count at all times."

  - name: CapstoneEvent
    parent: ClassroomDelivery
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: input, description: "FK -> ClassroomDelivery.id; the delivery this capstone culminates" }
      - { name: facility, type: enum, source: input, description: "SIMULATED_TOWN | FINANCE_PARK; must equal the delivery program's capstone_facility" }
      - { name: event_date, type: string, source: input, description: "Event date, ISO YYYY-MM-DD; must be >= logical clock date" }
      - { name: start_minutes, type: integer, source: input, description: "Minutes after midnight, event start" }
      - { name: end_minutes, type: integer, source: input, description: "Minutes after midnight, event end (> start_minutes)" }
      - { name: rotation_slot_count, type: integer, source: input, description: "Number of rotation groups students are split into (>= 1)" }
      - { name: status, type: enum, source: system, description: "PLANNED | READY | ROLES_ASSIGNED | COMPLETED | CANCELLED", default: PLANNED }
      - { name: assigned_student_count, type: integer, source: computed, description: "Roster students carrying a capstone role for this event", default: 0 }
    constraints: "At most one non-CANCELLED CapstoneEvent per delivery."

  - name: StudentParticipant
    parent: ClassroomDelivery
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: input, description: "FK -> ClassroomDelivery.id; roster membership" }
      - { name: capstone_event_id, type: string, source: system, description: "FK -> CapstoneEvent.id; null until ASSIGN_ROLES assigns this student" }
      - { name: full_name, type: string, source: input, description: "Student name" }
      - { name: external_ref, type: string, source: input, description: "School-side student reference" }
      - { name: rotation_group, type: integer, source: system, description: "Rotation group assigned at ASSIGN_ROLES (1..rotation_slot_count); null before" }
      - { name: capstone_role, type: string, source: system, description: "Facility role assigned at ASSIGN_ROLES; null before" }
      - { name: pre_score, type: integer, source: system, description: "Pre-program survey score 0-100; null before SUBMIT_PRE" }
      - { name: post_score, type: integer, source: system, description: "Post-program survey score 0-100; null before SUBMIT_POST" }
      - { name: survey_status, type: enum, source: system, description: "NONE | PRE_SUBMITTED | PAIRED | VALIDATED | EXCLUDED", default: NONE }

# =============================================================================
# Table 2: State Machine Table (8 machines)
# =============================================================================
state_machines:
  - entity: SchoolDistrict
    field: relationship_status
    initial_state: PROSPECT
    terminal_states: [CHURNED]
    transitions:
      - from: PROSPECT
        to: PARTNER
        trigger: "POST /ja-programs/districts/{district_id}/transition (action=ACTIVATE)"
        actor: AreaDirector
        preconditions: []
        side_effects: []
      - from: PARTNER
        to: AT_RISK
        trigger: "POST /ja-programs/districts/{district_id}/transition (action=FLAG_RISK)"
        actor: AreaDirector
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: PARTNER
        trigger: "POST /ja-programs/districts/{district_id}/transition (action=RESTORE)"
        actor: AreaDirector
        preconditions: []
        side_effects: []
      - from: PARTNER
        to: CHURNED
        trigger: "POST /ja-programs/districts/{district_id}/transition (action=CHURN)"
        actor: AreaDirector
        preconditions: []
        side_effects:
          - "Every PartnershipAgreement whose school's district_id == this district and whose status is PROPOSED, ACTIVE, or AMENDMENT_PENDING transitions to TERMINATED"
          - "Each so-terminated agreement then runs its own TERMINATED cascade (deliveries CANCELLED, sessions CANCELLED, kits released) — see PartnershipAgreement.TERMINATE"
      - from: AT_RISK
        to: CHURNED
        trigger: "POST /ja-programs/districts/{district_id}/transition (action=CHURN)"
        actor: AreaDirector
        preconditions: []
        side_effects:
          - "Same agreement cascade as PARTNER -> CHURNED"
    note: "Branching with revert (AT_RISK <-> PARTNER). CHURNED is terminal. AT_RISK blocks NEW agreement ACTIVATE/PROPOSE at schools in the district but does not cascade; CHURNED does cascade."

  - entity: CorporatePartner
    field: status
    initial_state: PROSPECT
    terminal_states: [EXITED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /ja-programs/corporate-partners/{partner_id}/transition (action=ACTIVATE)"
        actor: PartnershipManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ja-programs/corporate-partners/{partner_id}/transition (action=SUSPEND)"
        actor: PartnershipManager
        preconditions: []
        side_effects:
          - "No state cascade to volunteers; suspension gates NEW eligibility (volunteers of a non-ACTIVE partner are not eligible) without touching existing SCHEDULED sessions"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /ja-programs/corporate-partners/{partner_id}/transition (action=REINSTATE)"
        actor: PartnershipManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXITED
        trigger: "POST /ja-programs/corporate-partners/{partner_id}/transition (action=EXIT)"
        actor: PartnershipManager
        preconditions: []
        side_effects:
          - "Cascade link 1: every Volunteer with corporate_partner_id == this partner and engagement_status == ACTIVE transitions to DEPARTED"
          - "Cascade link 2 (caused by link 1): each DEPARTED volunteer's sessions in SCHEDULED transition to NEEDS_SUBSTITUTE"
          - "Cascade link 3 (caused by link 2): each affected ClassroomDelivery recomputes sessions_blocked_count (bumping delivery.version)"
      - from: SUSPENDED
        to: EXITED
        trigger: "POST /ja-programs/corporate-partners/{partner_id}/transition (action=EXIT)"
        actor: PartnershipManager
        preconditions: []
        side_effects:
          - "Same three-link cascade as ACTIVE -> EXITED"

  - entity: Volunteer
    initial_state: "screening_status=INITIATED, training_status=NOT_STARTED, engagement_status=ACTIVE (three parallel dimensions)"
    terminal_states: ["engagement_status=DEPARTED (other dimensions may still move)"]
    transitions:
      - from: "screening INITIATED"
        to: "screening CLEARED"
        trigger: "POST /ja-programs/volunteers/{volunteer_id}/credential-events (kind=SCREENING, event=CLEAR)"
        actor: PartnershipManager
        preconditions: []
        side_effects: ["screening_expires_on := logical clock now + 365 days"]
      - from: "screening INITIATED"
        to: "screening FLAGGED"
        trigger: "POST /ja-programs/volunteers/{volunteer_id}/credential-events (kind=SCREENING, event=FLAG)"
        actor: PartnershipManager
        preconditions: []
        side_effects: []
      - from: "screening FLAGGED"
        to: "screening INITIATED"
        trigger: "POST /ja-programs/volunteers/{volunteer_id}/credential-events (kind=SCREENING, event=REINITIATE)"
        actor: PartnershipManager
        preconditions: []
        side_effects: ["screening_expires_on := null"]
      - from: "screening EXPIRED"
        to: "screening INITIATED"
        trigger: "POST /ja-programs/volunteers/{volunteer_id}/credential-events (kind=SCREENING, event=REINITIATE)"
        actor: PartnershipManager
        preconditions: []
        side_effects: ["screening_expires_on := null"]
      - from: "screening CLEARED"
        to: "screening EXPIRED"
        trigger: "system (POST /ja-programs/_clock/set_current_utc sweep: clock now > screening_expires_on)"
        actor: system
        preconditions: ["screening_expires_on is not null", "clock now > screening_expires_on"]
        side_effects:
          - "This volunteer's sessions in SCHEDULED transition to NEEDS_SUBSTITUTE (and their deliveries recompute sessions_blocked_count)"
      - from: "training NOT_STARTED"
        to: "training IN_PROGRESS"
        trigger: "POST /ja-programs/volunteers/{volunteer_id}/credential-events (kind=TRAINING, event=BEGIN)"
        actor: PartnershipManager
        preconditions: []
        side_effects: []
      - from: "training IN_PROGRESS"
        to: "training COMPLETED"
        trigger: "POST /ja-programs/volunteers/{volunteer_id}/credential-events (kind=TRAINING, event=COMPLETE)"
        actor: PartnershipManager
        preconditions: []
        side_effects: ["training_expires_on := logical clock now + 365 days"]
      - from: "training COMPLETED"
        to: "training EXPIRED"
        trigger: "system (POST /ja-programs/_clock/set_current_utc sweep: clock now > training_expires_on)"
        actor: system
        preconditions: ["training_expires_on is not null", "clock now > training_expires_on"]
        side_effects:
          - "This volunteer's sessions in SCHEDULED transition to NEEDS_SUBSTITUTE (and their deliveries recompute sessions_blocked_count)"
      - from: "training EXPIRED"
        to: "training IN_PROGRESS"
        trigger: "POST /ja-programs/volunteers/{volunteer_id}/credential-events (kind=TRAINING, event=BEGIN)"
        actor: PartnershipManager
        preconditions: []
        side_effects: []
      - from: "engagement ACTIVE"
        to: "engagement DEPARTED"
        trigger: "POST /ja-programs/volunteers/{volunteer_id}/credential-events (kind=ENGAGEMENT, event=DEPART) or system (partner EXIT cascade)"
        actor: "PartnershipManager or system"
        preconditions: []
        side_effects:
          - "This volunteer's sessions in SCHEDULED transition to NEEDS_SUBSTITUTE (and their deliveries recompute sessions_blocked_count)"
    note: "Parallel dimensions: a TRAINING BEGIN/COMPLETE is legal while screening is FLAGGED, etc. eligibility = CLEARED x COMPLETED x ACTIVE x partner ACTIVE."

  - entity: PartnershipAgreement
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=PROPOSE)"
        actor: AreaDirector
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=ACTIVATE)"
        actor: AreaDirector
        preconditions:
          - "District of school_id has relationship_status == PARTNER (ERR_DISTRICT_NOT_PARTNER)"
          - "Sponsor partner has status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
          - "funding_pledged_cents >= funding floor for program (ERR_FUNDING_BELOW_FLOOR; see calculations.funding_floor)"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=WITHDRAW)"
        actor: AreaDirector
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=WITHDRAW)"
        actor: AreaDirector
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=PROPOSE_AMENDMENT, new_program_catalog_id?, new_funding_pledged_cents?)"
        actor: AreaDirector
        preconditions:
          - "At least one of new_program_catalog_id / new_funding_pledged_cents is present (ERR_VALIDATION otherwise)"
        side_effects:
          - "pending_program_catalog_id := new_program_catalog_id (or unchanged-null if absent)"
          - "pending_funding_pledged_cents := new_funding_pledged_cents (or unchanged-null if absent)"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=RATIFY_AMENDMENT)"
        actor: AreaDirector
        preconditions:
          - "Effective post-amendment pledge (pending_funding_pledged_cents if set else funding_pledged_cents) >= funding floor of effective post-amendment program (ERR_FUNDING_BELOW_FLOOR)"
        side_effects:
          - "program_catalog_id := pending_program_catalog_id if set; funding_pledged_cents := pending_funding_pledged_cents if set"
          - "If funding_pledged_cents decreases below funding_received_cents, rejected with ERR_FUNDING_EXCEEDS_PLEDGE instead"
          - "pending_* fields cleared to null; existing deliveries keep their snapshotted program_catalog_id"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=REJECT_AMENDMENT)"
        actor: AreaDirector
        preconditions: []
        side_effects: ["pending_* fields cleared to null; program_catalog_id and funding_pledged_cents unchanged"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=RECORD_FUNDING, amount_cents)"
        actor: AreaDirector
        preconditions:
          - "amount_cents >= 1 (ERR_VALIDATION)"
          - "funding_received_cents + amount_cents <= funding_pledged_cents (ERR_FUNDING_EXCEEDS_PLEDGE)"
        side_effects:
          - "funding_received_cents += amount_cents"
          - "recognition_tier recomputed (EARNED variant)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=COMPLETE)"
        actor: AreaDirector
        preconditions:
          - "Every delivery of this agreement is in COMPLETED or CANCELLED, and at least one is COMPLETED (ERR_INVALID_STATE)"
        side_effects: ["recognition_tier recomputed (EARNED variant, final)"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=TERMINATE) or system (district CHURN cascade)"
        actor: "AreaDirector or system"
        preconditions: []
        side_effects:
          - "Every delivery of this agreement in DRAFT, PLANNED, SCHEDULED, or IN_PROGRESS transitions to CANCELLED, running the delivery CANCEL cascade (sessions CANCELLED, kits released, capstone CANCELLED)"
      - from: AMENDMENT_PENDING
        to: TERMINATED
        trigger: "POST /ja-programs/partnership-agreements/{agreement_id}/transition (action=TERMINATE) or system (district CHURN cascade)"
        actor: "AreaDirector or system"
        preconditions: []
        side_effects: ["Same delivery cascade as ACTIVE -> TERMINATED"]
    note: "Cyclic: ACTIVE -> AMENDMENT_PENDING -> ACTIVE via RATIFY or REJECT. RECORD_FUNDING is a self-loop on ACTIVE."

  - entity: ClassroomDelivery
    initial_state: "status=DRAFT, kit_status=NONE (two parallel dimensions)"
    terminal_states: ["status COMPLETED", "status CANCELLED"]
    transitions:
      - from: "status DRAFT"
        to: "status PLANNED"
        trigger: "POST /ja-programs/deliveries/{delivery_id}/transition (action=PLAN)"
        actor: ProgramCoordinator
        preconditions:
          - "agreement status == ACTIVE (ERR_INVALID_STATE)"
          - "program.min_students <= enrolled_count <= program.max_students (ERR_ENROLLMENT_OUT_OF_RANGE)"
          - "school grade band overlaps program grade band: school.grade_band_low <= program.grade_band_high AND program.grade_band_low <= school.grade_band_high (ERR_PROGRAM_GRADE_MISMATCH)"
          - "lead volunteer eligible (ERR_VOLUNTEER_INELIGIBLE)"
        side_effects: []
      - from: "status PLANNED"
        to: "status PLANNED"
        trigger: "POST /ja-programs/deliveries/{delivery_id}/transition (action=CONFIRM_TEACHER)"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["teacher_confirmed := true"]
      - from: "status PLANNED"
        to: "status SCHEDULED"
        trigger: "POST /ja-programs/deliveries/{delivery_id}/transition (action=SCHEDULE)"
        actor: ProgramCoordinator
        preconditions:
          - "teacher_confirmed == true (ERR_TEACHER_NOT_CONFIRMED)"
          - "count of sessions of this delivery in SCHEDULED == program.session_count (ERR_SESSIONS_INCOMPLETE)"
          - "kit_status == RESERVED or DISTRIBUTED (ERR_KITS_NOT_RESERVED)"
          - "cadence holds across the SCHEDULED sessions (see calculations.session_cadence; ERR_CADENCE_VIOLATION)"
        side_effects: []
      - from: "status SCHEDULED"
        to: "status IN_PROGRESS"
        trigger: "system (first session of this delivery reaches DELIVERED via RECORD_DELIVERY)"
        actor: system
        preconditions: []
        side_effects: ["sessions_delivered_count recomputed"]
      - from: "status IN_PROGRESS"
        to: "status COMPLETED"
        trigger: "POST /ja-programs/deliveries/{delivery_id}/transition (action=COMPLETE)"
        actor: ProgramCoordinator
        preconditions:
          - "Every session of this delivery is DELIVERED (ERR_SESSIONS_INCOMPLETE)"
          - "If program.capstone_required: the delivery's capstone event is COMPLETED (ERR_CAPSTONE_REQUIRED)"
        side_effects: ["agreement.deliveries_completed_count recomputed"]
      - from: "status DRAFT | PLANNED | SCHEDULED | IN_PROGRESS"
        to: "status CANCELLED"
        trigger: "POST /ja-programs/deliveries/{delivery_id}/transition (action=CANCEL) or system (agreement TERMINATED cascade)"
        actor: "ProgramCoordinator or system"
        preconditions: []
        side_effects:
          - "Sessions of this delivery in TENTATIVE, SCHEDULED, NEEDS_SUBSTITUTE, or NO_SHOW transition to CANCELLED"
          - "kit_status RESERVED -> RELEASED: inventory.reserved_count -= required_kits, inventory.available_count += required_kits"
          - "kit_status DISTRIBUTED -> RELEASED: inventory.distributed_count -= required_kits, inventory.available_count += required_kits (full return, none consumed)"
          - "Non-terminal CapstoneEvent of this delivery -> CANCELLED (students' capstone fields cleared)"
      - from: "kit_status NONE"
        to: "kit_status RESERVED"
        trigger: "POST /ja-programs/deliveries/{delivery_id}/transition (action=RESERVE_KITS)"
        actor: ProgramCoordinator
        preconditions:
          - "status == PLANNED (ERR_INVALID_STATE)"
          - "KitInventory row exists for (area office of the delivery's school via district, program_catalog_id snapshot) and available_count >= required_kits (ERR_KIT_SHORTAGE; a missing inventory row is treated as zero stock)"
        side_effects:
          - "inventory.available_count -= required_kits; inventory.reserved_count += required_kits (inventory.version bumps)"
      - from: "kit_status RESERVED"
        to: "kit_status DISTRIBUTED"
        trigger: "POST /ja-programs/deliveries/{delivery_id}/transition (action=DISTRIBUTE_KITS)"
        actor: ProgramCoordinator
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects:
          - "inventory.reserved_count -= required_kits; inventory.distributed_count += required_kits"
      - from: "kit_status DISTRIBUTED"
        to: "kit_status RECONCILED"
        trigger: "POST /ja-programs/deliveries/{delivery_id}/transition (action=RECONCILE_KITS, kits_consumed)"
        actor: ProgramCoordinator
        preconditions:
          - "status == COMPLETED (ERR_INVALID_STATE)"
          - "0 <= kits_consumed <= required_kits (ERR_VALIDATION)"
        side_effects:
          - "kits_consumed recorded on delivery"
          - "inventory.distributed_count -= required_kits; inventory.consumed_count += kits_consumed; inventory.available_count += (required_kits - kits_consumed)"
    note: "Parallel dimensions: status and kit_status advance independently except where a precondition crosses them. RESERVE before SCHEDULE, DISTRIBUTE after SCHEDULE, RECONCILE after COMPLETE."

  - entity: DeliverySession
    field: status
    initial_state: TENTATIVE
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: TENTATIVE
        to: SCHEDULED
        trigger: "POST /ja-programs/sessions/{session_id}/transition (action=CONFIRM)"
        actor: ProgramCoordinator
        preconditions:
          - "delivery.status == PLANNED (ERR_INVALID_STATE)"
          - "volunteer eligible (ERR_VOLUNTEER_INELIGIBLE)"
          - "scheduled_date >= logical clock date (ERR_SESSION_DATE_INVALID)"
          - "weekday(scheduled_date) is in the delivery school's instructional_days (ERR_SESSION_DATE_INVALID)"
          - "No half-open time overlap with any other SCHEDULED session of the same volunteer on the same date: overlap iff cand.start < other.end AND other.start < cand.end (ERR_SESSION_OVERLAP; back-to-back is allowed)"
          - "Cadence per calculations.session_cadence: inserting the candidate date among the delivery's SCHEDULED sessions, the gap to its immediate date-neighbor(s) must be within [3, 14] days inclusive (ERR_CADENCE_VIOLATION)"
        side_effects: []
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /ja-programs/sessions/{session_id}/transition (action=RESCHEDULE, new_date, new_start_minutes, new_end_minutes)"
        actor: ProgramCoordinator
        preconditions: ["Same date/overlap/cadence checks as CONFIRM, evaluated against the new values"]
        side_effects: ["scheduled_date/start_minutes/end_minutes replaced; duration_minutes recomputed"]
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /ja-programs/sessions/{session_id}/transition (action=RESCHEDULE, new_date, new_start_minutes, new_end_minutes)"
        actor: ProgramCoordinator
        preconditions: ["Same date/overlap/cadence checks as CONFIRM, evaluated against the new values"]
        side_effects: ["scheduled_date/start_minutes/end_minutes replaced; duration_minutes recomputed"]
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /ja-programs/sessions/{session_id}/transition (action=RECORD_DELIVERY)"
        actor: ProgramCoordinator
        preconditions:
          - "delivery.status in {SCHEDULED, IN_PROGRESS} (ERR_INVALID_STATE)"
          - "logical clock date is within [scheduled_date, scheduled_date + 7 days] inclusive (ERR_SESSION_DATE_INVALID)"
        side_effects:
          - "volunteer.hours_contributed += session_hours(duration_minutes) per calculations.volunteer_hours"
          - "agreement.sponsor_volunteer_hours recomputed; agreement.recognition_tier recomputed (EARNED)"
          - "delivery.sessions_delivered_count recomputed"
          - "If delivery.status == SCHEDULED: delivery -> IN_PROGRESS (bubble-up)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /ja-programs/sessions/{session_id}/transition (action=RECORD_NO_SHOW) or system (clock sweep: now > scheduled_date + 7 days)"
        actor: "ProgramCoordinator or system"
        preconditions:
          - "manual: delivery.status in {SCHEDULED, IN_PROGRESS} (ERR_INVALID_STATE)"
          - "manual: logical clock date >= scheduled_date (ERR_SESSION_DATE_INVALID)"
        side_effects: ["No hours credited"]
      - from: SCHEDULED
        to: NEEDS_SUBSTITUTE
        trigger: "system (assigned volunteer becomes ineligible: screening EXPIRED, training EXPIRED, or engagement DEPARTED)"
        actor: system
        preconditions: []
        side_effects: ["delivery.sessions_blocked_count recomputed (delivery.version bumps)"]
      - from: "SCHEDULED | NEEDS_SUBSTITUTE"
        to: SCHEDULED
        trigger: "POST /ja-programs/sessions/{session_id}/substitute"
        actor: ProgramCoordinator
        preconditions:
          - "expected_delivery_version == delivery.version (ERR_STALE_DELIVERY_VERSION)"
          - "new_volunteer_id != current volunteer_id (ERR_VALIDATION)"
          - "new volunteer eligible (ERR_VOLUNTEER_INELIGIBLE)"
          - "No half-open overlap for the new volunteer at the existing date/time (ERR_SESSION_OVERLAP)"
        side_effects:
          - "volunteer_id := new_volunteer_id"
          - "delivery.sessions_blocked_count recomputed; increments ClassroomDelivery.version by 1"
      - from: "TENTATIVE | SCHEDULED | NEEDS_SUBSTITUTE | NO_SHOW"
        to: CANCELLED
        trigger: "POST /ja-programs/sessions/{session_id}/transition (action=CANCEL) or system (delivery CANCEL cascade)"
        actor: "ProgramCoordinator or system"
        preconditions: []
        side_effects: []
    note: "Self-loops (RESCHEDULE) and a NO_SHOW -> SCHEDULED recovery path make this machine non-linear. NEEDS_SUBSTITUTE is entered only by system cascade."

  - entity: CapstoneEvent
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: READY
        trigger: "POST /ja-programs/capstone-events/{capstone_id}/transition (action=CONFIRM)"
        actor: ProgramCoordinator
        preconditions:
          - "Facility buffered-capacity check passes (see calculations.facility_capacity; ERR_FACILITY_CAPACITY_EXCEEDED)"
        side_effects: []
      - from: READY
        to: ROLES_ASSIGNED
        trigger: "POST /ja-programs/capstone-events/{capstone_id}/transition (action=ASSIGN_ROLES, assignments)"
        actor: ProgramCoordinator
        preconditions:
          - "count of the delivery's roster students == delivery.enrolled_count (ERR_ROLE_ASSIGNMENT_INVALID)"
          - "assignments covers every roster student exactly once (ERR_ROLE_ASSIGNMENT_INVALID)"
          - "each assignment.role is in the facility role catalog and each rotation_group is in 1..rotation_slot_count (ERR_ROLE_ASSIGNMENT_INVALID)"
        side_effects:
          - "each assigned student: capstone_event_id := this event, rotation_group and capstone_role set"
          - "assigned_student_count := roster size"
      - from: ROLES_ASSIGNED
        to: COMPLETED
        trigger: "POST /ja-programs/capstone-events/{capstone_id}/transition (action=COMPLETE)"
        actor: ProgramCoordinator
        preconditions:
          - "Every session of the delivery is DELIVERED (ERR_SESSIONS_INCOMPLETE) — capstone is the culminating event"
        side_effects: []
      - from: "PLANNED | READY | ROLES_ASSIGNED"
        to: CANCELLED
        trigger: "POST /ja-programs/capstone-events/{capstone_id}/transition (action=CANCEL) or system (delivery CANCEL cascade)"
        actor: "ProgramCoordinator or system"
        preconditions: []
        side_effects: ["Students' capstone_event_id, rotation_group, capstone_role cleared to null; assigned_student_count := 0"]
    note: "CONFIRM before ASSIGN_ROLES: capacity is reserved against enrolled_count before the roster is locked into roles."

  - entity: StudentParticipant
    field: survey_status
    initial_state: NONE
    terminal_states: [VALIDATED, EXCLUDED]
    transitions:
      - from: NONE
        to: PRE_SUBMITTED
        trigger: "POST /ja-programs/students/{student_id}/transition (action=SUBMIT_PRE, score)"
        actor: ProgramCoordinator
        preconditions:
          - "delivery.status in {PLANNED, SCHEDULED, IN_PROGRESS} (ERR_INVALID_STATE)"
          - "0 <= score <= 100 (ERR_SURVEY_SCORE_OUT_OF_RANGE)"
        side_effects: ["pre_score := score"]
      - from: PRE_SUBMITTED
        to: PAIRED
        trigger: "POST /ja-programs/students/{student_id}/transition (action=SUBMIT_POST, score)"
        actor: ProgramCoordinator
        preconditions:
          - "delivery.status == COMPLETED (ERR_INVALID_STATE)"
          - "0 <= score <= 100 (ERR_SURVEY_SCORE_OUT_OF_RANGE)"
        side_effects: ["post_score := score"]
      - from: PAIRED
        to: VALIDATED
        trigger: "POST /ja-programs/students/{student_id}/transition (action=VALIDATE)"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
      - from: PRE_SUBMITTED
        to: EXCLUDED
        trigger: "POST /ja-programs/students/{student_id}/transition (action=EXCLUDE)"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
      - from: PAIRED
        to: EXCLUDED
        trigger: "POST /ja-programs/students/{student_id}/transition (action=EXCLUDE)"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: delivery-create-stale-agreement
    parent_entity: PartnershipAgreement
    write_endpoint: "POST /ja-programs/deliveries"
    occ_field: expected_agreement_version
    description: |
      Creating a ClassroomDelivery against a PartnershipAgreement whose version has
      advanced since the client last observed it is rejected. This captures the case
      where the agreement has just been amended (changing program or funding terms) or
      another delivery has just been created under it; the client's view of the
      agreement's terms is stale, so the new delivery would be built on superseded terms.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: session-substitute-stale-delivery
    parent_entity: ClassroomDelivery
    write_endpoint: "POST /ja-programs/sessions/{session_id}/substitute"
    occ_field: expected_delivery_version
    description: |
      Substituting the volunteer of a session whose parent ClassroomDelivery has a
      version newer than the client last observed is rejected. This captures the case
      where a cascade (volunteer departure, screening expiry) or another substitution
      has just mutated the delivery's session roster; the client's view of which
      sessions are blocked is stale.
    error_id: ERR_STALE_DELIVERY_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: required_kits
    trigger: "ClassroomDelivery creation (snapshot); stored on delivery.required_kits"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: round PER SESSION first, then sum. Never sum-then-round.
      per_session_packs = ceil(enrolled_count * SESSION_PACK_RATIO)          # one value, identical for each session
      required_kits = BASE_KITS + program.session_count * per_session_packs
      # Example: enrolled_count=27, session_count=5 -> 3 + 5*ceil(5.4) = 3 + 5*6 = 33.
      # The forbidden sum-then-round order would give 3 + ceil(27.0) = 30. The two differ; per-session-then-sum is law.
    input_set: "The delivery's enrolled_count and its snapshotted program's session_count"
    constants:
      BASE_KITS: 3
      SESSION_PACK_RATIO: 0.20
    precision: "integer result; ceil applied per session before summation"

  - name: recognition_tier
    trigger: "Recomputed on agreement RECORD_FUNDING, on every session RECORD_DELIVERY affecting sponsor_volunteer_hours, and on evaluation reads (both variants)"
    algorithm: threshold
    formula: |
      # Inputs: hours (variant-dependent), funding_received_cents, tier precedence GOLD > SILVER > BRONZE > NONE.
      if hours >= GOLD_HOURS and funding_received_cents >= GOLD_FUNDING_CENTS: tier = GOLD
      elif (hours >= SILVER_HOURS and funding_received_cents >= SILVER_FUNDING_CENTS) or hours >= SILVER_HOURS_ONLY: tier = SILVER
      elif (hours >= BRONZE_HOURS and funding_received_cents >= BRONZE_FUNDING_CENTS) or funding_received_cents >= GOLD_FUNDING_CENTS: tier = BRONZE
      else: tier = NONE
      # Nested AND/OR conditions plus ordered tier selection: a funding-only path exists to BRONZE
      # (funding >= GOLD_FUNDING_CENTS), but GOLD itself always requires hours >= GOLD_HOURS.
    input_set: "agreement.funding_received_cents; sponsor volunteer hours over this agreement's deliveries' sessions (variant-dependent status filter)"
    constants:
      GOLD_HOURS: 40
      GOLD_FUNDING_CENTS: 2000000
      SILVER_HOURS: 25
      SILVER_FUNDING_CENTS: 1000000
      SILVER_HOURS_ONLY: 60
      BRONZE_HOURS: 10
      BRONZE_FUNDING_CENTS: 500000
    precision: "hours compared exactly after per-session rounding (see volunteer_hours)"
    variants:
      - name: EARNED
        when: "persisted on agreement.recognition_tier; also returned by the evaluation endpoint"
        difference: "hours count DELIVERED sessions only"
      - name: PROJECTED
        when: "returned by the evaluation endpoint only (never persisted)"
        difference: "hours count sessions in TENTATIVE, SCHEDULED, NEEDS_SUBSTITUTE, and DELIVERED (all non-terminal, non-cancelled)"

  - name: evaluation_metrics
    trigger: "GET /ja-programs/partnership-agreements/{agreement_id}/evaluation?variant=..."
    algorithm: aggregation
    formula: |
      students_included = count of roster students (across all deliveries of the agreement)
                          whose survey_status is in the variant's inclusion set
      students_paired   = included students with pre_score and post_score both present
      avg_growth_score  = round_half_up(mean(post_score - pre_score over students_paired), 1); null if students_paired == 0
      sessions_delivered = count of sessions (all deliveries of the agreement) in DELIVERED
      sessions_scheduled = count of sessions in TENTATIVE, SCHEDULED, or NEEDS_SUBSTITUTE
      session_pool      = DELIVERED only (FINAL) | DELIVERED + TENTATIVE + SCHEDULED + NEEDS_SUBSTITUTE (PROVISIONAL)
      total_volunteer_hours   = sum of session_hours over session_pool
      sponsor_volunteer_hours = same but only sessions whose volunteer.corporate_partner_id == agreement.sponsor_partner_id
      completion_rate_pct = round_half_up(sessions_delivered * 100 / program.session_count_total, 1)
                          where session_count_total = sum of session_count over the agreement's deliveries' snapshotted programs
    input_set: "All deliveries of the agreement, their sessions, and their roster students; variant selects the inclusion sets"
    constants: {}
    precision: "avg_growth_score 1 decimal round_half_up; hours 2 decimals; completion_rate_pct 1 decimal round_half_up"
    variants:
      - name: PROVISIONAL
        when: "default variant"
        difference: "students included with survey_status in {PRE_SUBMITTED, PAIRED, VALIDATED}; hours include TENTATIVE/SCHEDULED/NEEDS_SUBSTITUTE/DELIVERED sessions"
      - name: FINAL
        when: "variant=FINAL"
        difference: "students included with survey_status == VALIDATED only; hours count DELIVERED sessions only"

  - name: volunteer_hours
    trigger: "Session RECORD_DELIVERY; volunteer.hours_contributed and agreement.sponsor_volunteer_hours recomputation"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: round each session FIRST, then sum.
      session_hours = round_half_up(duration_minutes / 60, 2)     # per session, e.g. 90 min -> 1.5, 45 min -> 0.75
      volunteer.hours_contributed = sum of session_hours over DELIVERED sessions assigned to that volunteer
      agreement.sponsor_volunteer_hours = sum of session_hours over DELIVERED sessions (any delivery of the agreement)
                                          whose assigned volunteer.corporate_partner_id == agreement.sponsor_partner_id
    input_set: "Sessions in DELIVERED only; NO_SHOW and CANCELLED contribute nothing"
    constants: {}
    precision: "per-session value rounded to 2 decimals round_half_up BEFORE summation"

  - name: funding_floor
    trigger: "Agreement ACTIVATE and RATIFY_AMENDMENT"
    algorithm: threshold
    formula: |
      floor_cents = FUNDING_BASE_CENTS + program.session_count * FUNDING_PER_SESSION_CENTS
      # e.g. session_count=5 -> 75000 + 125000 = 200000; session_count=4 -> 175000
      ACTIVATE requires funding_pledged_cents >= floor_cents of the agreement's program
      RATIFY_AMENDMENT requires effective pledge >= floor of the effective (possibly amended) program
    input_set: "agreement pledge (or pending pledge) and the (possibly amended) program's session_count"
    constants:
      FUNDING_BASE_CENTS: 75000
      FUNDING_PER_SESSION_CENTS: 25000
    precision: "integer cents; boundary is inclusive (== floor passes)"

  - name: session_cadence
    trigger: "Session CONFIRM / RESCHEDULE; delivery SCHEDULE (full re-check)"
    algorithm: chronological
    formula: |
      # Order-sensitive: sort the delivery's SCHEDULED sessions by scheduled_date ascending
      # (tie-break: created_at ascending — two sessions on the same date are already a violation,
      #  so the tie-break only fixes iteration determinism, never the verdict).
      # Cadence governs CONSECUTIVE visits: only ADJACENT pairs in the sorted order are checked.
      sorted_sessions = sort SCHEDULED sessions of the delivery by (scheduled_date ASC, created_at ASC)
      for each adjacent pair (prev, next) in sorted_sessions:
          3 <= days_between(prev.scheduled_date, next.scheduled_date) <= 14
      At CONFIRM/RESCHEDULE time: insert the candidate's date into the sorted SCHEDULED set and
      check only the gap to its immediate predecessor and immediate successor (whichever exist).
      At delivery SCHEDULE time the full adjacent-pair check runs over the SCHEDULED set.
    input_set: "Sessions of the delivery in SCHEDULED only (TENTATIVE sessions are unordered placeholders and are excluded)"
    constants:
      MIN_SESSION_GAP_DAYS: 3
      MAX_SESSION_GAP_DAYS: 14
    precision: "whole days; both bounds inclusive"

  - name: facility_capacity
    trigger: "CapstoneEvent CONFIRM"
    algorithm: interval_merge
    formula: |
      # Buffered half-open overlap with aggregate capacity. For candidate event E at facility F on date d:
      #   effective interval of an event = [start_minutes, end_minutes + TURNOVER_BUFFER_MINUTES)
      #   E' conflicts with E iff same facility, same event_date, status in {READY, ROLES_ASSIGNED, COMPLETED},
      #   and effective(E) intersects effective(E'): E'.start < E.end + 30 AND E.start < E'.end + 30
      #   (so an event starting exactly at another's end+30 does NOT conflict; end+buffer adjacency is allowed)
      #   total_enrollment = E.delivery.enrolled_count + sum of conflicting E'.delivery.enrolled_count
      #   require total_enrollment <= FACILITY_CAPACITY[F] (== capacity is allowed; > capacity rejected)
    input_set: "CapstoneEvents at the same facility on the same date with status in {READY, ROLES_ASSIGNED, COMPLETED}"
    constants:
      TOWN_CAPACITY: 60        # facility SIMULATED_TOWN
      PARK_CAPACITY: 90        # facility FINANCE_PARK
      TURNOVER_BUFFER_MINUTES: 30
    precision: "integer seat counts; boundary inclusive (== capacity passes)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role name recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, no undeclared fields, enum/action values recognized, scalar ranges sane (minutes, dates parseable)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Referenced resource ids exist (path ids left-to-right, then body FKs in declared input order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "OCC precondition: expected_agreement_version == agreement.version on POST /deliveries; expected_delivery_version == delivery.version on POST /sessions/{id}/substitute"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /ja-programs/deliveries; POST /ja-programs/sessions/{session_id}/substitute"
    note: "The substitute endpoint reports ERR_STALE_DELIVERY_VERSION (same priority slot, different error_id)."
  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition/action is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints and state-gated creates"
  - priority: 7
    category: business_safety
    check: "Volunteer eligibility for assignment: screening CLEARED and unexpired, training COMPLETED and unexpired, engagement ACTIVE, partner ACTIVE"
    error_id: ERR_VOLUNTEER_INELIGIBLE
    http_status: 409
    applies_to: "delivery PLAN; session CONFIRM; session SUBSTITUTE"
  - priority: 8
    category: business_referential
    check: "Cross-entity state gates: district PARTNER for agreement ACTIVATE; sponsor ACTIVE for agreement ACTIVATE"
    error_id: ERR_DISTRICT_NOT_PARTNER
    http_status: 409
    applies_to: "agreement ACTIVATE"
    note: "Sponsor gate reports ERR_SPONSOR_NOT_ACTIVE at the same priority slot; district is checked first because the school FK precedes the sponsor FK in the agreement's declared input order."
  - priority: 9
    category: business_temporal
    check: "Temporal rules: session date not in past / instructional-day membership / delivery window; volunteer half-open overlap; cadence gaps; facility buffered capacity"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "session CONFIRM/RESCHEDULE/SUBSTITUTE; session RECORD_DELIVERY/RECORD_NO_SHOW; capstone create/CONFIRM"
    note: "Sub-order inside this tier: ERR_SESSION_DATE_INVALID (422) before ERR_SESSION_OVERLAP (409) before ERR_CADENCE_VIOLATION (422); capstone checks report ERR_FACILITY_CAPACITY_EXCEEDED (422)."
  - priority: 10
    category: business_constraint
    check: "Constraint rules: enrollment within program min/max; grade-band overlap; territory district cap; unique kit inventory per (office, program); single non-cancelled capstone per delivery; kit stock sufficiency; write-off within available; role-assignment completeness; survey score range; teacher-confirmed and kit-reserved scheduling gates"
    error_id: ERR_ENROLLMENT_OUT_OF_RANGE
    http_status: 422
    applies_to: "delivery PLAN; district create; kit inventory create/WRITE_OFF; capstone create/ASSIGN_ROLES; student SUBMIT_*; delivery SCHEDULE"
    note: "Representative error_id shown; per-rule ids: ERR_PROGRAM_GRADE_MISMATCH, ERR_TERRITORY_LIMIT_REACHED, ERR_DUPLICATE_INVENTORY (409), ERR_DUPLICATE_CAPSTONE (409), ERR_KIT_SHORTAGE, ERR_WRITE_OFF_EXCEEDS_AVAILABLE, ERR_ROLE_ASSIGNMENT_INVALID, ERR_SURVEY_SCORE_OUT_OF_RANGE, ERR_TEACHER_NOT_CONFIRMED (409), ERR_KITS_NOT_RESERVED (409), ERR_SESSIONS_INCOMPLETE (409), ERR_CAPSTONE_REQUIRED (409)."
  - priority: 11
    category: business_fiscal
    check: "Funding floor at ACTIVATE/RATIFY; funding received never exceeds pledge"
    error_id: ERR_FUNDING_BELOW_FLOOR
    http_status: 422
    applies_to: "agreement ACTIVATE, RATIFY_AMENDMENT, RECORD_FUNDING"
    note: "ERR_FUNDING_EXCEEDS_PLEDGE shares this priority slot for RECORD_FUNDING/RATIFY_AMENDMENT."

# =============================================================================
# Section 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

