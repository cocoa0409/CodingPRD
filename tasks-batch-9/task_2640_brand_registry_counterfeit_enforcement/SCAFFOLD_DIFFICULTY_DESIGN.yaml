            - "Takedown submitted 2026-08-10T09:00:00Z on an AMZ enrollment, so decision_due_at was 2026-08-17T09:00:00Z"
            - "The marketplace REJECTED the notice on 2026-08-12T09:00:00Z, returning the listing to CLAIM_OPEN"
            - "A second, distinct evidence package on the same claim is SEALED at completeness 0.8500"
