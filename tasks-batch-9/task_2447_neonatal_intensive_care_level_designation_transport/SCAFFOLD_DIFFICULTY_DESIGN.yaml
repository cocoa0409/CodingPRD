            - "TransportRun.${run_y1}.status == STABILIZING with stabilization_score == 92 and stabilization_bundle_complete == true"
            - "Referral.${ref_y1}.status == WITHDRAWN with decision_reason == FAMILY_CHOICE"
            - "BedReservation.${res_y1}.status == RELEASED with released_reason == REFERRAL_WITHDRAWN"
