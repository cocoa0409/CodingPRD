            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://m1.pdf" }, as: PrepressOperator, captures: { proof: $.data.id } }
            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /presses", payload: { name: "W1", press_type: "WEB", rated_impressions_per_hour: 10000, make_ready_minutes_base: 45, washup_buffer_minutes: 30 }, as: PlantManager, captures: { press: $.data.id, pv: $.data.version } }
            - { call: "POST /press-runs", payload: { press_id: "${press}", job_id: "${job}", run_quantity: 10002, scheduled_start: "2026-08-10T08:00:00Z", expected_press_version: "${pv}" }, as: PressScheduler, captures: { run: $.data.id } }
            - { call: "POST /press-runs/${run}/complete", payload: { gross_impressions: 10002, sheets_used: 10600, waste_sheets: 300 }, as: PressScheduler }
            - { call: "POST /bindery-tickets", payload: { job_id: "${job}", operation: "FOLD", sequence_no: 1 }, as: PlantManager, captures: { bt: $.data.id } }
            - { call: "POST /bindery-tickets/${bt}/complete", payload: { pieces_completed: 10502 }, as: PlantManager }
            - { call: "POST /mail-drops", payload: { job_id: "${job}", drop_date: "2026-08-25", destination_entry: "NONE", piece_weight_oz: 3.5, zip_counts: [ { zip5: "90210", pieces: 5200 }, { zip5: "90401", pieces: 5000 }, { zip5: "10001", pieces: 302 } ] }, as: MailSpecialist, captures: { drop: $.data.id } }
            - { call: "POST /mail-drops/${drop}/presort", payload: {}, as: MailSpecialist }
            - { call: "POST /mail-drops/${drop}/drop", payload: {}, as: MailSpecialist }
            - { call: "POST /invoices", payload: { job_id: "${job}" }, as: PlantManager, captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/issue", payload: {}, as: PlantManager }
            - { call: "POST /reprint-claims", payload: { job_id: "${job}", claimed_defect: "MISREGISTER", defect_qty: 10502 }, as: Customer, as_user_id: "${cust}", captures: { claim: $.data.id } }
