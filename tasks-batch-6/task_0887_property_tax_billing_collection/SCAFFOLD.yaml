# =============================================================================
# PRD Benchmark Scaffold — Property-Tax Billing & Collection (county treasurer)
# Difficulty: Expert
# =============================================================================

scenario: |
  Property-Tax Billing & Collection (county treasurer): levy & bill calculation,
  installment & due-date, escrow/mortgage-company file, payment posting & partial,
  delinquency & interest/penalty, tax-sale/lien referral, refund & overpayment,
  exemption/abatement application

domain_name: property-tax-billing
api_prefix: /property-tax

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths. All
  # collections live directly under /property-tax so every FK is discovered
  # by a filtered-list or sub-resource GET.

  state_machine_shape: parallel
  # TaxBill carries two independent axes (collection_status × sale_status);
  # TaxReliefApplication is cyclic (UNDER_REVIEW <-> INFO_REQUESTED);
  # TaxSaleReferral is a fork (REFERRED -> {REDEEMED, SOLD}).

  relationship_patterns:
    - one_to_many        # Parcel 1..* TaxBill; TaxBill 1..* Installment / LedgerEntry
    - cross_aggregate    # Payment/Refund/Referral reference TaxBill across aggregates

  role_model: segregation_of_duties
  # Cashier posts money, Treasurer authorizes reversals/refunds/sales; a refund
  # requester may not approve their own refund; a referral opener may not sell.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TaxYear
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: year, type: integer, source: input, description: "Levy year, e.g. 2025", constraints: "unique across TaxYear; >= 2000" }
      - { name: millage_rate, type: number, source: input, description: "Mills per 1000 of assessed value used to compute gross tax" }
      - { name: first_installment_due_date, type: datetime, source: input, description: "ISO8601 UTC date the first installment is due (day granularity)" }
      - { name: second_installment_due_date, type: datetime, source: input, description: "ISO8601 UTC date the second installment is due; MUST be strictly after first_installment_due_date" }

  - name: EscrowAgent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Mortgage servicer / escrow company legal name" }
      - { name: servicer_code, type: string, source: input, description: "Short unique servicer code", constraints: "unique across EscrowAgent" }

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: parcel_number, type: string, source: input, description: "Assessor parcel number (APN)", constraints: "unique across Parcel" }
      - { name: owner_name, type: string, source: input, description: "Owner of record" }
      - { name: situs_address, type: string, source: input, description: "Property street address" }
      - { name: assessed_value_cents, type: integer, source: input, description: "Certified assessed value in whole cents", constraints: ">= 0" }
      - { name: property_class, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL | AGRICULTURAL | INDUSTRIAL" }
      - { name: homestead, type: boolean, source: input, default: false, description: "Owner-occupied homestead flag" }
      - { name: escrow_agent_id, type: string, source: input, description: "FK -> EscrowAgent.id; mortgage escrow servicer paying on behalf of this parcel; null when self-pay", constraints: "nullable" }

  - name: TaxBill
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the parcel being billed" }
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id; the levy year" }
      - { name: gross_tax_cents, type: integer, source: computed, description: "round_half_up(Parcel.assessed_value_cents * TaxYear.millage_rate / 1000); see calc bill_levy" }
      - { name: exemption_credit_cents, type: integer, source: computed, description: "Sum of approved EXEMPTION relief credits applied at issuance; see calc relief_credit" }
      - { name: net_tax_cents, type: integer, source: computed, description: "max(0, gross_tax_cents - exemption_credit_cents); the amount split into installments" }
      - { name: abatement_credit_cents, type: integer, source: computed, description: "Sum of ABATEMENT LedgerEntry.amount_cents (absolute) posted after issuance" }
      - { name: total_charged_cents, type: integer, source: computed, description: "Sum of positive LedgerEntry.amount_cents (CHARGE + PENALTY + INTEREST) for this bill" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Absolute sum of PAYMENT LedgerEntry.amount_cents minus REVERSAL entries for this bill" }
      - { name: total_applied_cents, type: integer, source: computed, description: "Cash the county retains = total_paid_cents - sum(APPROVED Refund.amount_cents for this bill); see invariant cash_conservation" }
      - { name: balance_cents, type: integer, source: computed, description: "Sum of ALL LedgerEntry.amount_cents for this bill (charges positive; payments/abatements negative; reversals/refunds positive); see calc bill_balance" }
      - { name: overpayment_cents, type: integer, source: computed, description: "max(0, -balance_cents) net of already-APPROVED refunds; funds eligible for refund" }
      - { name: delinquent_principal_cents, type: integer, source: computed, description: "Sum of unpaid principal_due_cents over Installments whose status = DELINQUENT" }
      - { name: collection_status, type: enum, source: computed, description: "CURRENT | PARTIALLY_PAID | PAID | DELINQUENT — bubbles up from Installment statuses (see SM TaxBill.collection_status)" }
      - { name: sale_status, type: enum, source: computed, description: "NONE | IN_TAX_SALE | REDEEMED | SOLD — driven by TaxSaleReferral (see SM TaxBill.sale_status)" }

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - { name: bill_id, type: string, source: system, description: "FK -> TaxBill.id; parent bill (set when bill is issued)" }
      - { name: sequence, type: integer, source: system, description: "1 or 2 — installment ordinal" }
      - { name: principal_due_cents, type: integer, source: system, description: "Principal portion for this installment; see calc installment_split" }
      - { name: due_date, type: datetime, source: system, description: "ISO8601 UTC date this installment is due (copied from TaxYear)" }
      - { name: penalty_cents, type: integer, source: computed, description: "One-time delinquency penalty materialized to the ledger once past due; see calc delinquency_charges" }
      - { name: interest_cents, type: integer, source: computed, description: "Whole-month statutory interest materialized to the ledger through the current clock; see calc delinquency_charges" }
      - { name: paid_cents, type: integer, source: computed, description: "Payments allocated to this installment net of reversals" }
      - { name: balance_cents, type: integer, source: computed, description: "principal_due_cents + penalty_cents + interest_cents - paid_cents" }
      - { name: status, type: enum, source: computed, description: "PENDING | PARTIALLY_PAID | PAID | DELINQUENT (see SM Installment.status)" }

  - name: TaxReliefApplication
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the parcel seeking relief" }
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id; the levy year the relief applies to" }
      - { name: relief_class, type: enum, source: input, description: "EXEMPTION (reduces gross before issuance) | ABATEMENT (post-issuance credit)" }
      - { name: relief_type, type: enum, source: input, description: "HOMESTEAD | SENIOR | HARDSHIP | DISABLED_VETERAN" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Relief amount requested in cents", constraints: "> 0" }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 UTC date the relief period begins (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "ISO8601 UTC date the relief period ends (inclusive); MUST be >= effective_from" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED (see SM TaxReliefApplication.status)" }
      - { name: approved_credit_cents, type: integer, source: computed, description: "Actual credit granted at approval; see calc relief_credit" }
      - { name: info_request_count, type: integer, source: computed, description: "Number of INFO_REQUESTED cycles this application has been through" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ReliefOfficer who approved/denied; null until decided", constraints: "nullable" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: bill_id, type: string, source: input, description: "FK -> TaxBill.id; the bill being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Tendered amount in cents", constraints: "> 0" }
      - { name: tender_type, type: enum, source: input, description: "CASH | CHECK | ACH | CARD" }
      - { name: source, type: enum, source: input, description: "COUNTER | ESCROW | ONLINE" }
      - { name: escrow_agent_id, type: string, source: input, description: "FK -> EscrowAgent.id; required when source = ESCROW (mortgage-company file); null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED (see SM Payment.status)" }
      - { name: allocation, type: array, source: computed, description: "Per-installment breakdown [{sequence, penalty_cents, interest_cents, principal_cents}] produced by calc payment_allocation" }
      - { name: overpayment_applied_cents, type: integer, source: computed, description: "Portion of this payment that exceeded the total balance and became bill overpayment" }
      - { name: posted_by_user_id, type: string, source: system, description: "X-User-ID that posted the payment" }
      - { name: reversed_by_user_id, type: string, source: system, description: "X-User-ID that reversed the payment; null while POSTED", constraints: "nullable" }

  - name: LedgerEntry
    parent: null
    common_fields: false          # append-only event: id + created_at only, no version, no update
    fields:
      - { name: bill_id, type: string, source: system, description: "FK -> TaxBill.id; the bill this entry posts against" }
      - { name: installment_sequence, type: integer, source: system, description: "1 or 2 when the entry targets a specific installment; null for bill-level entries (ABATEMENT, REFUND)", constraints: "nullable" }
      - { name: entry_type, type: enum, source: system, description: "CHARGE | PENALTY | INTEREST | PAYMENT | REVERSAL | ABATEMENT | REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents. CHARGE/PENALTY/INTEREST > 0; PAYMENT/ABATEMENT < 0; REVERSAL/REFUND > 0" }
      - { name: memo, type: string, source: system, description: "Human-readable origin note (e.g. 'penalty 5% installment 2')" }

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: bill_id, type: string, source: input, description: "FK -> TaxBill.id; the overpaid bill" }
      - { name: amount_cents, type: integer, source: input, description: "Requested refund amount in cents", constraints: "> 0" }
      - { name: mode, type: enum, source: input, description: "GROSS_OVERPAYMENT (refund full overpayment) | NET_OF_DELINQUENCY (overpayment minus this parcel's other delinquent balances); see calc refund_available" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED (see SM Refund.status)" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Amount actually approved; <= requested and <= available; see calc refund_available" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID that filed the refund request (used for four-eyes SoD)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the Treasurer who approved/denied; null until decided", constraints: "nullable" }

  - name: TaxSaleReferral
    parent: null
    common_fields: true
    fields:
      - { name: bill_id, type: string, source: input, description: "FK -> TaxBill.id; the delinquent bill referred to tax sale" }
      - { name: referral_date, type: datetime, source: system, description: "Logical clock instant when the referral was opened" }
      - { name: redemption_deadline, type: datetime, source: computed, description: "referral_date + REDEMPTION_PERIOD_DAYS (=365); owner may redeem strictly before this instant" }
      - { name: delinquent_principal_at_referral_cents, type: integer, source: system, description: "Snapshot of TaxBill.delinquent_principal_cents at referral time" }
      - { name: status, type: enum, source: system, description: "REFERRED | REDEEMED | SOLD (see SM TaxSaleReferral.status)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the CollectionsOfficer who opened the referral (used for SoD on sale)" }
      - { name: sold_by_user_id, type: string, source: system, description: "X-User-ID of the Treasurer who executed the sale; null unless SOLD", constraints: "nullable" }
      - { name: sale_price_cents, type: integer, source: input, description: "Winning bid recorded at sale; null unless SOLD", constraints: "nullable" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- TaxBill: parallel dimension 1 — collection_status (bubbles up from Installments) -----
  - entity: TaxBill
    field: collection_status
    initial_state: CURRENT
    terminal_states: []           # can move in any direction as installments change
    transitions:
      - from: CURRENT
        to: PARTIALLY_PAID
        trigger: "POST /property-tax/payments (partial) — some but not all installments cleared"
        actor: system
        preconditions: ["at least one Installment moved to PAID/PARTIALLY_PAID but a positive balance_cents remains"]
        side_effects: ["recompute total_paid_cents, balance_cents from ledger"]
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /property-tax/_clock/set_current_utc — clock advances past an unpaid Installment.due_date"
        actor: system
        preconditions: ["some Installment now has status = DELINQUENT"]
        side_effects: ["for each newly delinquent installment, cascade posts PENALTY then INTEREST LedgerEntry (see Installment.PENDING->DELINQUENT)"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /property-tax/payments — final allocation clears balance_cents to 0"
        actor: system
        preconditions: ["balance_cents == 0 and all Installments PAID"]
        side_effects: ["if an open TaxSaleReferral exists it is auto-redeemed (cascade — see Payment.POSTED side_effects)"]
      - from: DELINQUENT
        to: PAID
        trigger: "POST /property-tax/payments — payment clears principal + penalty + interest"
        actor: system
        preconditions: ["balance_cents == 0 and no Installment remains DELINQUENT"]
        side_effects: ["auto-redeem any REFERRED TaxSaleReferral for this bill (cascade)"]
      - from: DELINQUENT
        to: PARTIALLY_PAID
        trigger: "POST /property-tax/payments — payment reduces but does not clear delinquency"
        actor: system
        preconditions: ["balance_cents > 0 and no Installment remains DELINQUENT"]
        side_effects: ["recompute delinquent_principal_cents"]
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /property-tax/payments/{id}/reverse — reversal reopens a positive balance"
        actor: system
        preconditions: ["balance_cents > 0 after REVERSAL entries; no installment past due at current clock"]
        side_effects: ["compensation: REVERSAL LedgerEntry restores balance"]
      - from: PAID
        to: DELINQUENT
        trigger: "POST /property-tax/payments/{id}/reverse — reversal reopens balance on a past-due installment"
        actor: system
        preconditions: ["balance_cents > 0 and an installment is past due at current clock"]
        side_effects: ["re-materialize penalty/interest for the reopened installment"]

  # ----- TaxBill: parallel dimension 2 — sale_status (driven by TaxSaleReferral) -----
  - entity: TaxBill
    field: sale_status
    initial_state: NONE
    terminal_states: [SOLD]
    transitions:
      - from: NONE
        to: IN_TAX_SALE
        trigger: "POST /property-tax/tax-sale-referrals"
        actor: CollectionsOfficer
        preconditions:
          - "collection_status == DELINQUENT"
          - "delinquent_principal_cents >= LIEN_REFERRAL_THRESHOLD_CENTS (=50000) (ERR_BELOW_REFERRAL_THRESHOLD)"
          - "expected_bill_version matches TaxBill.version (ERR_STALE_VERSION)"
        side_effects: ["create TaxSaleReferral(status=REFERRED); increments TaxBill.version by 1"]
      - from: IN_TAX_SALE
        to: REDEEMED
        trigger: "POST /property-tax/tax-sale-referrals/{id}/redeem  OR  cascade from full payment"
        actor: CollectionsOfficer
        preconditions: ["referral.status == REFERRED", "current clock < redemption_deadline (ERR_REDEMPTION_EXPIRED)"]
        side_effects: ["referral.status = REDEEMED"]
      - from: IN_TAX_SALE
        to: SOLD
        trigger: "POST /property-tax/tax-sale-referrals/{id}/sell"
        actor: Treasurer
        preconditions:
          - "referral.status == REFERRED"
          - "current clock >= redemption_deadline (ERR_REDEMPTION_NOT_EXPIRED)"
          - "X-User-ID != referral.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["referral.status = SOLD; sold_by_user_id set; sale_price_cents recorded"]

  # ----- Installment -----
  - entity: Installment
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: DELINQUENT
        trigger: "POST /property-tax/_clock/set_current_utc — current clock date > due_date and balance_cents > 0"
        actor: system
        preconditions: ["current clock calendar date strictly after due_date"]
        side_effects:
          - "post PENALTY LedgerEntry once = round_half_up(principal_due_cents * PENALTY_RATE)"
          - "post INTEREST LedgerEntry for each newly-crossed monthly anniversary = round_half_up(principal_due_cents * INTEREST_RATE_MONTHLY) per month"
          - "bubble up: TaxBill.collection_status -> DELINQUENT; recompute delinquent_principal_cents"
      - from: PENDING
        to: PARTIALLY_PAID
        trigger: "POST /property-tax/payments — partial principal allocation"
        actor: system
        preconditions: ["0 < paid_cents < principal_due_cents"]
        side_effects: ["post PAYMENT LedgerEntry; recompute balance"]
      - from: PENDING
        to: PAID
        trigger: "POST /property-tax/payments — full allocation"
        actor: system
        preconditions: ["balance_cents == 0"]
        side_effects: ["post PAYMENT LedgerEntry; bubble up bill collection_status"]
      - from: DELINQUENT
        to: PAID
        trigger: "POST /property-tax/payments — payment covers penalty + interest + principal"
        actor: system
        preconditions: ["balance_cents == 0 (waterfall penalty->interest->principal, see calc payment_allocation)"]
        side_effects: ["post PAYMENT LedgerEntry(s); bubble up; may cascade referral redemption"]
      - from: DELINQUENT
        to: PARTIALLY_PAID
        trigger: "POST /property-tax/payments — payment reduces delinquent balance without clearing it"
        actor: system
        preconditions: ["balance_cents > 0 after allocation"]
        side_effects: ["post PAYMENT LedgerEntry; recompute"]
      - from: PAID
        to: DELINQUENT
        trigger: "POST /property-tax/payments/{id}/reverse — reversal reopens balance on a past-due installment"
        actor: system
        preconditions: ["balance_cents > 0 after REVERSAL and current clock date > due_date"]
        side_effects: ["compensation; re-materialize penalty/interest if not already present"]
      - from: PAID
        to: PENDING
        trigger: "POST /property-tax/payments/{id}/reverse — reversal reopens balance while not yet past due"
        actor: system
        preconditions: ["balance_cents > 0 after REVERSAL and current clock date <= due_date"]
        side_effects: ["compensation"]

  # ----- TaxReliefApplication (cyclic: UNDER_REVIEW <-> INFO_REQUESTED) -----
  - entity: TaxReliefApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /property-tax/relief-applications/{id}/review"
        actor: ReliefOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /property-tax/relief-applications/{id}/request-info"
        actor: ReliefOfficer
        preconditions: []
        side_effects: ["info_request_count += 1"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /property-tax/relief-applications/{id}/resubmit"
        actor: Taxpayer
        preconditions: ["acting Taxpayer owns the parcel (X-User-ID == parcel_id) OR actor is Cashier"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /property-tax/relief-applications/{id}/decide (decision=APPROVE)"
        actor: ReliefOfficer
        preconditions:
          - "no OTHER active/approved TaxReliefApplication for the same parcel with an overlapping effective interval (ERR_RELIEF_PERIOD_OVERLAP)"
          - "for ABATEMENT: target TaxBill.collection_status != PAID (ERR_INVALID_STATE, cross-entity)"
        side_effects:
          - "compute approved_credit_cents via calc relief_credit"
          - "EXEMPTION: reduces TaxBill.exemption_credit_cents at issuance"
          - "ABATEMENT cascade: post ABATEMENT LedgerEntry(s) across UNPAID installments -> installment balances recompute -> an installment reaching balance 0 becomes PAID"
          - "decided_by_user_id set"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /property-tax/relief-applications/{id}/decide (decision=DENY)"
        actor: ReliefOfficer
        preconditions: []
        side_effects: ["decided_by_user_id set; no credit applied"]

  # ----- Payment (branching: POSTED -> REVERSED) -----
  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: POSTED
        trigger: "POST /property-tax/payments (creation)"
        actor: Cashier
        preconditions:
          - "TaxBill.collection_status != PAID (ERR_BILL_ALREADY_PAID, cross-entity)"
          - "amount_cents > 0 (ERR_ZERO_AMOUNT)"
          - "source == ESCROW implies escrow_agent_id present (ERR_ESCROW_AGENT_REQUIRED)"
        side_effects:
          - "waterfall allocation across installments (calc payment_allocation); post PAYMENT LedgerEntry(s)"
          - "increments TaxBill.version by 1"
          - "cascade: if bill balance reaches 0 and a REFERRED TaxSaleReferral exists -> referral REDEEMED and sale_status REDEEMED"
      - from: POSTED
        to: REVERSED
        trigger: "POST /property-tax/payments/{id}/reverse"
        actor: Treasurer
        preconditions: ["status == POSTED (ERR_PAYMENT_ALREADY_REVERSED)"]
        side_effects:
          - "compensation: post REVERSAL LedgerEntry(s) equal and opposite to this payment's PAYMENT entries"
          - "increments TaxBill.version by 1; recompute installment/bill statuses (may return to DELINQUENT)"
          - "reversed_by_user_id set"

  # ----- Refund (REQUESTED -> APPROVED / DENIED) -----
  - entity: Refund
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /property-tax/refunds/{id}/decide (decision=APPROVE)"
        actor: Treasurer
        preconditions:
          - "X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "approved_amount_cents <= TaxBill.overpayment_cents (ERR_OVERPAYMENT_UNAVAILABLE)"
        side_effects:
          - "post REFUND LedgerEntry(+approved_amount_cents) reducing overpayment; recompute total_applied_cents"
          - "increments TaxBill.version by 1; decided_by_user_id set"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /property-tax/refunds/{id}/decide (decision=DENY)"
        actor: Treasurer
        preconditions: ["X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["decided_by_user_id set; no ledger change"]

  # ----- TaxSaleReferral (fork: REFERRED -> {REDEEMED, SOLD}) -----
  - entity: TaxSaleReferral
    initial_state: REFERRED
    terminal_states: [REDEEMED, SOLD]
    transitions:
      - from: REFERRED
        to: REDEEMED
        trigger: "POST /property-tax/tax-sale-referrals/{id}/redeem"
        actor: CollectionsOfficer
        preconditions: ["current clock < redemption_deadline (ERR_REDEMPTION_EXPIRED)"]
        side_effects: ["TaxBill.sale_status = REDEEMED"]
      - from: REFERRED
        to: SOLD
        trigger: "POST /property-tax/tax-sale-referrals/{id}/sell"
        actor: Treasurer
        preconditions:
          - "current clock >= redemption_deadline (ERR_REDEMPTION_NOT_EXPIRED)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["TaxBill.sale_status = SOLD; sold_by_user_id + sale_price_cents recorded"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on TaxBill.version — CREATE-with-supersede)
# =============================================================================
concurrency_rules:
  - rule_id: refund-create-stale-bill
    parent_entity: TaxBill
    write_endpoint: "POST /property-tax/refunds"
    occ_field: "expected_bill_version"
    description: |
      Filing a Refund carries the overpayment the client last observed on the
      bill. If the bill's version has advanced since then (another payment or
      reversal changed the overpayment), the request is rejected as stale so
      the refund is never computed from an outdated overpayment figure.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: referral-create-stale-bill
    parent_entity: TaxBill
    write_endpoint: "POST /property-tax/tax-sale-referrals"
    occ_field: "expected_bill_version"
    description: |
      Opening a TaxSaleReferral snapshots the delinquent principal. If the
      bill's version has advanced since the client read it (a payment reduced
      the delinquency below threshold), the create is rejected as stale rather
      than referring a bill that is no longer eligible.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bill_levy
    trigger: "POST /property-tax/tax-bills (issuance)"
    algorithm: threshold
    formula: |
      gross_tax_cents = round_half_up(Parcel.assessed_value_cents * TaxYear.millage_rate / 1000)
      exemption_credit_cents = sum over APPROVED EXEMPTION TaxReliefApplication(parcel, tax_year) of approved_credit_cents,
                               capped so net_tax_cents >= 0
      net_tax_cents = max(0, gross_tax_cents - exemption_credit_cents)
    input_set: "The parcel's assessed_value_cents, the tax year's millage_rate, and only APPROVED EXEMPTION relief for that (parcel, tax_year)."
    constants: {}
    precision: "integer cents, round_half_up at the divide-by-1000 step"

  - name: installment_split
    trigger: "POST /property-tax/tax-bills (issuance), after bill_levy"
    algorithm: waterfall_allocation
    formula: |
      # ROUNDING ORDER IS PINNED: floor per installment, remainder to the LAST installment.
      INSTALLMENT_COUNT = 2
      base = net_tax_cents // INSTALLMENT_COUNT            # integer floor
      installment[1].principal_due_cents = base
      installment[2].principal_due_cents = net_tax_cents - base   # last absorbs the remainder
      installment[1].due_date = TaxYear.first_installment_due_date
      installment[2].due_date = TaxYear.second_installment_due_date
    input_set: "net_tax_cents from bill_levy."
    constants: { INSTALLMENT_COUNT: 2 }
    precision: "integer cents; floor per installment then remainder to last (NOT sum-then-round)"

  - name: delinquency_charges
    trigger: "POST /property-tax/_clock/set_current_utc; recomputed on any Installment/TaxBill read"
    algorithm: threshold
    formula: |
      # Nonlinear over >=3 inputs (principal, penalty_rate, interest_rate, months) with a cap.
      is_delinquent = (current_clock_date > due_date) and (principal_due_cents - paid_principal_cents > 0)
      penalty_cents = is_delinquent ? round_half_up(principal_due_cents * PENALTY_RATE) : 0    # once only
      months_elapsed = count of monthly anniversaries of due_date with anniversary_date <= current_clock_date
                       (a month whose day-of-month is smaller than due_date's uses the month's last day)
      interest_cents = round_half_up(principal_due_cents * INTEREST_RATE_MONTHLY) * months_elapsed
      delinquency_total = min(principal_due_cents, penalty_cents + interest_cents)   # capped at 100% of principal
    input_set: "Per DELINQUENT installment: its unpaid principal, the two rates, and whole months since due."
    constants: { PENALTY_RATE: 0.05, INTEREST_RATE_MONTHLY: 0.01 }
    precision: "integer cents, round_half_up; penalty applied exactly once, interest per whole month"

  - name: payoff_interest
    trigger: "GET /property-tax/tax-bills/{id}/payoff"
    algorithm: forward_looking
    formula: |
      principal_balance = sum of unpaid principal_due_cents on the bill's installments
      penalty_total     = sum of installment penalty_cents (already materialized)
      payoff_total_cents = principal_balance + penalty_total + interest_component
    input_set: "The bill's unpaid installments as of the requested as_of_date."
    constants: { INTEREST_RATE_MONTHLY: 0.01, DAYS_PER_YEAR: 365 }
    precision: "integer cents, round_half_up"
    variants:
      - name: LEDGER_AS_OF
        when: "mode = LEDGER_AS_OF (default); as_of_date ignored"
        difference: "interest_component = whole-month INTEREST already materialized to the ledger through the current clock (matches delinquency_charges)"
      - name: PAYOFF_QUOTE
        when: "mode = PAYOFF_QUOTE with a future as_of_date"
        difference: "interest_component = round_half_up(principal_balance * INTEREST_RATE_MONTHLY * 12 / DAYS_PER_YEAR * days_from_due_date_to_as_of_date) — per-diem projection, NOT whole-month"

  - name: relief_credit
    trigger: "POST /property-tax/relief-applications/{id}/decide (decision=APPROVE)"
    algorithm: waterfall_allocation
    formula: |
      base = min(claimed_amount_cents, applicable_ceiling)
    input_set: "The application's claimed_amount_cents and, for ABATEMENT, the bill's UNPAID installment balances."
    constants: {}
    precision: "integer cents"
    variants:
      - name: EXEMPTION
        when: "relief_class = EXEMPTION (applied before/at bill issuance)"
        difference: "applicable_ceiling = gross_tax_cents; approved_credit reduces gross for the WHOLE year (both installments shrink via installment_split); a bill issued after approval reflects it in net_tax_cents"
      - name: ABATEMENT
        when: "relief_class = ABATEMENT (applied after issuance)"
        difference: "applicable_ceiling = sum of UNPAID installment balances; approved_credit is distributed as ABATEMENT LedgerEntry(s) across UNPAID installments in ASCENDING sequence order (already-PAID installments get nothing), so identical claimed_amount yields a different net effect than EXEMPTION"

  - name: payment_allocation
    trigger: "POST /property-tax/payments"
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_cents
      for installment in bill.installments sorted by due_date ASC, then sequence ASC:   # deterministic, no id
        for bucket in [penalty_cents, interest_cents, principal_remaining]:             # within-installment order pinned
          pay = min(remaining, bucket_outstanding)
          allocate pay; remaining -= pay
      overpayment_applied_cents = remaining   # leftover becomes bill overpayment (credit)
      post PAYMENT LedgerEntry(s) with negative amount_cents
    input_set: "All installments of the bill; ordered by due_date ASC then sequence ASC (created_at tie-break, never id)."
    constants: {}
    precision: "integer cents"

  - name: bill_balance
    trigger: "any LedgerEntry insert (charge, payment, penalty, interest, abatement, reversal, refund)"
    algorithm: aggregation
    formula: |
      balance_cents        = sum(LedgerEntry.amount_cents for bill_id)          # invariant: ledger_balance_conservation
      total_charged_cents  = sum(amount_cents where entry_type in {CHARGE,PENALTY,INTEREST})
      total_paid_cents     = -sum(amount_cents where entry_type == PAYMENT) - sum(amount_cents where entry_type == REVERSAL)
      overpayment_cents    = max(0, -balance_cents)
    input_set: "All LedgerEntry rows for the bill (append-only; none excluded)."
    constants: {}
    precision: "integer cents"

  - name: refund_available
    trigger: "POST /property-tax/refunds and POST /property-tax/refunds/{id}/decide"
    algorithm: aggregation
    formula: |
      available = overpayment_cents (mode GROSS_OVERPAYMENT)
                  or max(0, overpayment_cents - other_delinquent_principal_on_parcel) (mode NET_OF_DELINQUENCY)
      approved_amount_cents = min(requested amount_cents, available)
    input_set: "Bill overpayment_cents; for NET_OF_DELINQUENCY, the parcel's OTHER bills' delinquent_principal_cents."
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body id (bill_id, parcel_id, tax_year_id, escrow_agent_id, referral/refund/application id) resolves to a live resource, validated left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_safety
    check: "Four-eyes segregation of duties: the acting X-User-ID must differ from the recorded originator (Refund.requested_by_user_id on decide; TaxSaleReferral.created_by_user_id on sell)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /property-tax/refunds/{id}/decide, POST /property-tax/tax-sale-referrals/{id}/sell"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum members valid; amount_cents > 0 (ERR_ZERO_AMOUNT); source=ESCROW requires escrow_agent_id (ERR_ESCROW_AGENT_REQUIRED)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST"

  - priority: 5b
    category: business_constraint
    check: "Enum field carries a value outside its declared domain"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all POST"

  - priority: 6
    category: state
    check: "Target resource is in a legal state for the transition (bill not PAID for payment; payment POSTED for reverse; application UNDER_REVIEW for decide; referral REFERRED for redeem/sell; refund REQUESTED for decide)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_constraint
    check: "Optimistic concurrency: expected_bill_version equals current TaxBill.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /property-tax/refunds, POST /property-tax/tax-sale-referrals"

  - priority: 8
    category: business_referential
    check: "Uniqueness: at most one TaxBill per (parcel_id, tax_year_id) (ERR_DUPLICATE_BILL); parcel_number / servicer_code / TaxYear.year unique"
    error_id: ERR_DUPLICATE_BILL
    http_status: 409
    applies_to: "POST /property-tax/tax-bills"

  - priority: 9
    category: business_temporal
    check: "Approving an EXEMPTION/ABATEMENT whose [effective_from, effective_to] closed interval overlaps another active/approved application on the same parcel (touching endpoints count as overlap)"
    error_id: ERR_RELIEF_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /property-tax/relief-applications/{id}/decide"

  - priority: 10
    category: business_temporal
    check: "Opening a referral whose half-open [referral_date, redemption_deadline) window overlaps a non-terminal referral on the same parcel (adjacency at the deadline is allowed)"
    error_id: ERR_REFERRAL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /property-tax/tax-sale-referrals"

  - priority: 11
    category: state
    check: "Referral requires the bill's collection to be delinquent (bill DELINQUENT and an Installment in DELINQUENT)"
    error_id: ERR_NOT_DELINQUENT
    http_status: 409
    applies_to: "POST /property-tax/tax-sale-referrals"

  - priority: 12
    category: business_fiscal
    check: "Referral requires delinquent_principal_cents >= LIEN_REFERRAL_THRESHOLD_CENTS"
    error_id: ERR_BELOW_REFERRAL_THRESHOLD
    http_status: 409
    applies_to: "POST /property-tax/tax-sale-referrals"

  - priority: 13
    category: business_temporal
    check: "redeem requires current clock < redemption_deadline; sell requires current clock >= redemption_deadline"
    error_id: ERR_REDEMPTION_EXPIRED
    http_status: 409
    applies_to: "POST /property-tax/tax-sale-referrals/{id}/redeem, POST /property-tax/tax-sale-referrals/{id}/sell"

  - priority: 14
    category: business_fiscal
    check: "Refund approved_amount_cents must not exceed the bill's available overpayment"
    error_id: ERR_OVERPAYMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /property-tax/refunds/{id}/decide"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- TaxYear -----
  - method: POST
    path: "/property-tax/tax-years"
    description: "Create (certify) a levy year with millage and installment due dates"
    roles: [Treasurer]
    code: 201
    input: [year, millage_rate, first_installment_due_date, second_installment_due_date]
    output: TaxYear
    side_effects: []

  - method: GET
    path: "/property-tax/tax-years/{id}"
    description: "Fetch a tax year"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: []
    output: TaxYear
    side_effects: []

  # ----- EscrowAgent -----
  - method: POST
    path: "/property-tax/escrow-agents"
    description: "Register a mortgage servicer / escrow company"
    roles: [Treasurer]
    code: 201
    input: [name, servicer_code]
    output: EscrowAgent
    side_effects: []

  # ----- Parcel -----
  - method: POST
    path: "/property-tax/parcels"
    description: "Create a taxable parcel"
    roles: [Cashier, Treasurer]
    code: 201
    input: [parcel_number, owner_name, situs_address, assessed_value_cents, property_class, "homestead?", "escrow_agent_id?"]
    output: Parcel
    side_effects: []

  - method: GET
    path: "/property-tax/parcels/{id}"
    description: "Fetch a parcel"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: GET
    path: "/property-tax/parcels"
    description: "List parcels; filter by escrow_agent_id (reverse-reachability for Parcel.escrow_agent_id)"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: ["escrow_agent_id?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  # ----- TaxBill -----
  - method: POST
    path: "/property-tax/tax-bills"
    description: "Issue a bill for a parcel + tax year; runs bill_levy + installment_split"
    roles: [Treasurer]
    code: 201
    input: [parcel_id, tax_year_id]
    output: TaxBill
    side_effects:
      - "compute gross_tax_cents, exemption_credit_cents, net_tax_cents (calc bill_levy)"
      - "create 2 Installments (calc installment_split); post 2 CHARGE LedgerEntry"
      - "collection_status = CURRENT; sale_status = NONE"

  - method: GET
    path: "/property-tax/tax-bills/{id}"
    description: "Fetch a bill with computed balances and both status axes"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: []
    output: TaxBill
    side_effects: []

  - method: GET
    path: "/property-tax/tax-bills"
    description: "List bills; filter by parcel_id / tax_year_id (reverse-reachability for TaxBill.parcel_id and TaxBill.tax_year_id)"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: ["parcel_id?", "tax_year_id?", "limit?", "offset?"]
    output: TaxBill[]
    side_effects: []

  - method: GET
    path: "/property-tax/tax-bills/{id}/payoff"
    description: "Computed payoff quote; mode selects LEDGER_AS_OF (default) or PAYOFF_QUOTE (calc payoff_interest)"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: ["mode?", "as_of_date?"]
    output: { mode: string, as_of_date: string, principal_balance_cents: integer, penalty_cents: integer, interest_cents: integer, payoff_total_cents: integer }
    side_effects: []

  - method: GET
    path: "/property-tax/tax-bills/{id}/ledger-entries"
    description: "Append-only ledger for a bill (reverse-reachability for LedgerEntry.bill_id)"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ----- Installment -----
  - method: GET
    path: "/property-tax/installments/{id}"
    description: "Fetch an installment with materialized penalty/interest as of current clock"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: []
    output: Installment
    side_effects: []

  - method: GET
    path: "/property-tax/installments"
    description: "List installments; filter by bill_id (reverse-reachability for Installment.bill_id)"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: ["bill_id?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []

  # ----- TaxReliefApplication -----
  - method: POST
    path: "/property-tax/relief-applications"
    description: "Submit an exemption or abatement application"
    roles: [Taxpayer, Cashier]
    code: 201
    input: [parcel_id, tax_year_id, relief_class, relief_type, claimed_amount_cents, effective_from, effective_to]
    output: TaxReliefApplication
    side_effects: ["status = SUBMITTED; info_request_count = 0"]

  - method: GET
    path: "/property-tax/relief-applications/{id}"
    description: "Fetch a relief application"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: []
    output: TaxReliefApplication
    side_effects: []

  - method: GET
    path: "/property-tax/relief-applications"
    description: "List relief applications; filter by parcel_id / tax_year_id (reverse-reachability for both FKs)"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: ["parcel_id?", "tax_year_id?", "limit?", "offset?"]
    output: TaxReliefApplication[]
    side_effects: []

  - method: POST
    path: "/property-tax/relief-applications/{id}/review"
    description: "Move SUBMITTED -> UNDER_REVIEW"
    roles: [ReliefOfficer]
    code: 200
    input: []
    output: TaxReliefApplication
    side_effects: ["status = UNDER_REVIEW"]

  - method: POST
    path: "/property-tax/relief-applications/{id}/request-info"
    description: "Move UNDER_REVIEW -> INFO_REQUESTED"
    roles: [ReliefOfficer]
    code: 200
    input: []
    output: TaxReliefApplication
    side_effects: ["status = INFO_REQUESTED; info_request_count += 1"]

  - method: POST
    path: "/property-tax/relief-applications/{id}/resubmit"
    description: "Move INFO_REQUESTED -> UNDER_REVIEW (cycle)"
    roles: [Taxpayer, Cashier]
    code: 200
    input: []
    output: TaxReliefApplication
    side_effects: ["status = UNDER_REVIEW"]

  - method: POST
    path: "/property-tax/relief-applications/{id}/decide"
    description: "Approve or deny; APPROVE runs calc relief_credit and (ABATEMENT) cascades ledger entries"
    roles: [ReliefOfficer]
    code: 200
    input: [decision]
    output: TaxReliefApplication
    side_effects:
      - "APPROVE: compute approved_credit_cents; EXEMPTION marks credit for issuance; ABATEMENT posts ABATEMENT LedgerEntry across UNPAID installments (cascade -> installment PAID)"
      - "decided_by_user_id set"

  # ----- Payment -----
  - method: POST
    path: "/property-tax/payments"
    description: "Post a payment (partial allowed); waterfall allocation across installments"
    roles: [Cashier, Taxpayer]
    code: 201
    input: [bill_id, amount_cents, tender_type, source, "escrow_agent_id?"]
    output: Payment
    side_effects:
      - "calc payment_allocation; post PAYMENT LedgerEntry(s); increments TaxBill.version by 1"
      - "bubble up installment/bill statuses; cascade referral redemption if balance clears"

  - method: GET
    path: "/property-tax/payments/{id}"
    description: "Fetch a payment with its allocation"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/property-tax/payments"
    description: "List payments; filter by bill_id / escrow_agent_id (reverse-reachability for Payment.bill_id and Payment.escrow_agent_id)"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: ["bill_id?", "escrow_agent_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/property-tax/payments/{id}/reverse"
    description: "Reverse a POSTED payment (compensation); Treasurer only"
    roles: [Treasurer]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "post REVERSAL LedgerEntry(s); increments TaxBill.version by 1; recompute statuses"
      - "reversed_by_user_id set"

  # ----- Refund -----
  - method: POST
    path: "/property-tax/refunds"
    description: "File a refund request against an overpaid bill (OCC on TaxBill.version)"
    roles: [Taxpayer, Cashier, Treasurer]
    code: 201
    input: [bill_id, amount_cents, mode, expected_bill_version]
    output: Refund
    side_effects: ["status = REQUESTED; requested_by_user_id set; increments TaxBill.version by 1"]

  - method: GET
    path: "/property-tax/refunds/{id}"
    description: "Fetch a refund"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: []
    output: Refund
    side_effects: []

  - method: GET
    path: "/property-tax/refunds"
    description: "List refunds; filter by bill_id (reverse-reachability for Refund.bill_id)"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: ["bill_id?", "limit?", "offset?"]
    output: Refund[]
    side_effects: []

  - method: POST
    path: "/property-tax/refunds/{id}/decide"
    description: "Approve or deny a refund (four-eyes SoD, overpayment check on approve)"
    roles: [Treasurer]
    code: 200
    input: [decision]
    output: Refund
    side_effects:
      - "APPROVE: compute approved_amount_cents (calc refund_available); post REFUND LedgerEntry; increments TaxBill.version by 1"
      - "decided_by_user_id set"

  # ----- TaxSaleReferral -----
  - method: POST
    path: "/property-tax/tax-sale-referrals"
    description: "Refer a delinquent bill to tax sale (OCC on TaxBill.version)"
    roles: [CollectionsOfficer]
    code: 201
    input: [bill_id, expected_bill_version]
    output: TaxSaleReferral
    side_effects:
      - "status = REFERRED; redemption_deadline = referral_date + REDEMPTION_PERIOD_DAYS (=365); snapshot delinquent principal"
      - "TaxBill.sale_status = IN_TAX_SALE; increments TaxBill.version by 1; created_by_user_id set"

  - method: GET
    path: "/property-tax/tax-sale-referrals/{id}"
    description: "Fetch a referral"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: []
    output: TaxSaleReferral
    side_effects: []

  - method: GET
    path: "/property-tax/tax-sale-referrals"
    description: "List referrals; filter by bill_id (reverse-reachability for TaxSaleReferral.bill_id)"
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer, Taxpayer]
    code: 200
    input: ["bill_id?", "limit?", "offset?"]
    output: TaxSaleReferral[]
    side_effects: []

  - method: POST
    path: "/property-tax/tax-sale-referrals/{id}/redeem"
    description: "Redeem a referral before the redemption deadline"
    roles: [CollectionsOfficer, Treasurer]
    code: 200
    input: []
    output: TaxSaleReferral
    side_effects: ["status = REDEEMED; TaxBill.sale_status = REDEEMED"]

  - method: POST
    path: "/property-tax/tax-sale-referrals/{id}/sell"
    description: "Execute the tax sale after redemption expires (SoD: seller != opener)"
    roles: [Treasurer]
    code: 200
    input: ["sale_price_cents?"]
    output: TaxSaleReferral
    side_effects: ["status = SOLD; TaxBill.sale_status = SOLD; sold_by_user_id + sale_price_cents recorded"]

  # ----- Logical clock (test-driving) -----
  - method: POST
    path: "/property-tax/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and MUST NOT use wall-clock time. Advancing the clock materializes penalty/interest for newly-delinquent installments."
    roles: [Treasurer, Cashier, CollectionsOfficer, ReliefOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "for each installment now past due with balance > 0: PENDING -> DELINQUENT; post PENALTY once + INTEREST per newly-crossed month; bubble up bill collection_status"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/mistyped required field, or amount/date constraint violated" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field value outside its declared domain" }
  - { id: ERR_ZERO_AMOUNT, http: 422, condition: "amount_cents <= 0 on a payment or refund" }
  - { id: ERR_ESCROW_AGENT_REQUIRED, http: 422, condition: "Payment source = ESCROW but escrow_agent_id omitted" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition attempted from an illegal current state (or ABATEMENT on a PAID bill)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_bill_version does not match current TaxBill.version" }
  - { id: ERR_DUPLICATE_BILL, http: 409, condition: "A TaxBill already exists for this (parcel_id, tax_year_id)" }
  - { id: ERR_PAYMENT_ALREADY_REVERSED, http: 409, condition: "Reverse attempted on a payment already REVERSED" }
  - { id: ERR_BILL_ALREADY_PAID, http: 409, condition: "Payment posted to a bill whose collection_status is PAID" }
  - { id: ERR_RELIEF_ALREADY_DECIDED, http: 409, condition: "review/request-info/resubmit/decide on an APPROVED or DENIED application" }
  - { id: ERR_RELIEF_PERIOD_OVERLAP, http: 409, condition: "Approving relief whose effective interval overlaps another active/approved application on the parcel" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Acting user is the recorded originator (refund requester approving; referral opener selling)" }
  - { id: ERR_NOT_DELINQUENT, http: 409, condition: "Referral opened on a bill that is not DELINQUENT" }
  - { id: ERR_BELOW_REFERRAL_THRESHOLD, http: 409, condition: "delinquent_principal_cents below LIEN_REFERRAL_THRESHOLD_CENTS" }
  - { id: ERR_REFERRAL_WINDOW_OVERLAP, http: 409, condition: "Referral window overlaps a non-terminal referral on the same parcel" }
  - { id: ERR_REDEMPTION_EXPIRED, http: 409, condition: "Redeem attempted at/after redemption_deadline" }
  - { id: ERR_REDEMPTION_NOT_EXPIRED, http: 409, condition: "Sell attempted before redemption_deadline" }
  - { id: ERR_OVERPAYMENT_UNAVAILABLE, http: 409, condition: "Refund approval would exceed the bill's available overpayment" }
  - { id: ERR_REFUND_ALREADY_DECIDED, http: 409, condition: "decide on a refund already APPROVED or DENIED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Treasurer
    description: "County treasurer / supervisor: certifies tax years, issues bills, reverses payments, approves refunds, executes tax sales"
    identity: opaque
    exclusive_operations:
      - "POST /property-tax/tax-years — certify a levy year"
      - "POST /property-tax/escrow-agents — register a servicer"
      - "POST /property-tax/tax-bills — issue a bill"
      - "POST /property-tax/payments/{id}/reverse — reverse a payment"
      - "POST /property-tax/refunds/{id}/decide — approve/deny refunds"
      - "POST /property-tax/tax-sale-referrals/{id}/sell — execute a tax sale"
    shared_operations:
      - "POST /property-tax/parcels — create parcels (with Cashier)"
      - "POST /property-tax/refunds — file a refund (with Taxpayer, Cashier)"
      - "POST /property-tax/tax-sale-referrals/{id}/redeem — redeem (with CollectionsOfficer)"
      - "GET reads across the domain"

  - name: Cashier
    description: "Front-counter clerk: creates parcels, posts payments (counter/escrow files), files relief applications and refunds"
    identity: opaque
    exclusive_operations:
      - "POST /property-tax/payments — post a payment"
    shared_operations:
      - "POST /property-tax/parcels — create parcels (with Treasurer)"
      - "POST /property-tax/relief-applications — submit relief (with Taxpayer)"
      - "POST /property-tax/relief-applications/{id}/resubmit — resubmit (with Taxpayer)"
      - "POST /property-tax/refunds — file a refund (with Taxpayer, Treasurer)"
      - "GET reads across the domain"

  - name: CollectionsOfficer
    description: "Delinquency & tax-sale desk: opens referrals, redeems them"
    identity: opaque
    exclusive_operations:
      - "POST /property-tax/tax-sale-referrals — open a referral"
    shared_operations:
      - "POST /property-tax/tax-sale-referrals/{id}/redeem — redeem (with Treasurer)"
      - "GET reads across the domain"

  - name: ReliefOfficer
    description: "Assessor's relief reviewer: reviews, requests info, approves/denies exemption & abatement applications"
    identity: opaque
    exclusive_operations:
      - "POST /property-tax/relief-applications/{id}/review"
      - "POST /property-tax/relief-applications/{id}/request-info"
      - "POST /property-tax/relief-applications/{id}/decide"
    shared_operations:
      - "GET reads across the domain"

  - name: Taxpayer
    description: "Property owner acting on their own parcel: files relief applications, resubmits, files refunds, pays online, reads own records"
    identity: "entity_backed:Parcel"
    exclusive_operations: []
    shared_operations:
      - "POST /property-tax/relief-applications — submit relief for own parcel (X-User-ID == parcel_id)"
      - "POST /property-tax/relief-applications/{id}/resubmit — resubmit own application"
      - "POST /property-tax/payments — pay own bill online"
      - "POST /property-tax/refunds — file a refund on own overpaid bill"
      - "GET reads for own parcel's records"
