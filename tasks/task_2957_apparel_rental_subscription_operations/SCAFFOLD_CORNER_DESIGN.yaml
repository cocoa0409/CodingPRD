        distinguishing_aspect: >-
          REPAIR_ATTEMPT_CAP is 2 and a re-inspection clears repair_completed_at without resetting
          repair_attempts, so the re-opened repair leg starts already at the cap: the next repair-completion is a
          409 ERR_REPAIR_ATTEMPTS_EXHAUSTED rather than a third attempt or a CONDEMNED_HOLD escalation. Reaching
          the cap through one FAILED plus one ACCEPTED attempt is what makes this distinct from the FAILED-at-cap
          path, which condemns the unit instead of returning an error.
