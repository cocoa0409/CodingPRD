              as: QualityInspector
              as_user_id: "insp-1"

            - call: "POST /mfg/tank-lots/${tl_id}/foam"
              payload: { foam_density_kg_m3: 32.0, foam_thickness_mm: 50 }
              as: PlantOperator
            - call: "POST /mfg/tank-lots/${tl_id}/jacket"
              payload: {}
              as: PlantOperator
            - call: "POST /mfg/tank-lots/${tl_id}/release"
              payload: {}
              as: PlantOperator

            - call: "POST /mfg/heater-units"
              payload: { tank_lot_id: "${tl_id}", gas_control_lot_id: "${cl_gas_id}", safety_valve_lot_id: "${cl_tp_id}" }
              as: PlantOperator
              captures: { u1_id: $.data.id }
            - call: "POST /mfg/heater-units/${u1_id}/assemble"
              payload: {}
              as: PlantOperator
            - call: "POST /mfg/heater-units/${u1_id}/label"
              payload: {}
              as: PlantOperator
            - call: "POST /mfg/heater-units/${u1_id}/ship"
              payload: { install_water_hardness_gpg: 12.0, distribution_channel: "TRADE" }
              as: PlantOperator

            - call: "POST /mfg/_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T06:00:00Z" }
              as: PlantAdmin

            - call: "POST /mfg/heater-units"
              payload: { tank_lot_id: "${tl_id}", gas_control_lot_id: "${cl_gas_id}", safety_valve_lot_id: "${cl_tp_id}" }
              as: PlantOperator
              captures: { u2_id: $.data.id }
