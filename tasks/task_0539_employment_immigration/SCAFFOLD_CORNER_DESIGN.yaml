  # ===========================================================================
  # Section 6 — Errors (coverage stubs for errors exercised by §1.8 depth instances)
  # NOTE: ERR_RFE_EXPIRED is not independently triggerable through the RFE-response
  # precondition: the /_clock/set_current_utc side effect auto-DENIES any RFE_ISSUED
  # petition whose due date is strictly passed, so the clock can never carry a still
  # RFE_ISSUED petition beyond rfe_due_date. Its boundary and the auto-deny are covered
  # by validations.rfe_response_exactly_at_due_date_boundary_succeeds and
  # state_machines.rfe_past_due_auto_denies_petition_on_clock_advance above.
  # ===========================================================================
  - section: errors
    instances:
      - name: error_lca_not_certified_on_petition_submit
        claim_type: Violation → Error
        grounds:
          - errors[ERR_LCA_NOT_CERTIFIED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / h1b_submit_requires_lca_certified
          rationale: "ERR_LCA_NOT_CERTIFIED is the asserted failure path of the named §1.8 instance."

      - name: error_perm_not_certified_on_i140_submit
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PERM_NOT_CERTIFIED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / i140_submit_requires_perm_certified
          rationale: "ERR_PERM_NOT_CERTIFIED is the asserted failure path of the named §1.8 instance."

      - name: error_recruitment_too_short_on_quiet_period
        claim_type: Violation → Error
        grounds:
          - errors[ERR_RECRUITMENT_TOO_SHORT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / quiet_period_temporal_beats_recruitment_constraint
          rationale: "ERR_RECRUITMENT_TOO_SHORT is the winning error asserted by the named §1.8 instance."

      - name: error_recruitment_step_overlap_on_create
        claim_type: Violation → Error
        grounds:
          - errors[ERR_RECRUITMENT_STEP_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / recruitment_step_closed_interval_adjacency_conflicts
          rationale: "ERR_RECRUITMENT_STEP_OVERLAP is the asserted result of the named §1.8 instance."

      - name: error_invalid_state_on_resubmit_after_cascade_deny
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / petition_submit_state_beats_referential
          rationale: "ERR_INVALID_STATE is the winning error asserted by the named §1.8 instance (also covered by state_machine instances above)."

