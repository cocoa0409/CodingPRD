          - errors[ERR_DUPLICATE_BARCODE]
          - entities.Seat.fields.barcode_token
        distinguishing_aspect: |
          Interval semantics = POINT occupancy on the Seat resource: a barcode_token occupies a
          single identity slot; adding a second seat with the same barcode_token while the first is
          non-VOID collides (ERR_DUPLICATE_BARCODE). Adjacency = exact-equality collision, no buffer.
