          rationale: "The FULL -> OPEN revert with filled_count 2 -> 1 is asserted mid-chain in that §1.9-companion difficulty instance."

  # ---------------------------------------------------------------------------
  # Calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: rejected_entries_excluded_from_all_totals
        claim_type: input_set_filtering
        grounds: [calculations.credit_totals]
        distinguishing_aspect: "REJECTED entries count toward NEITHER provisional NOR official totals: with APPROVED 5.0, REJECTED 7.0, PENDING 3.0 the record shows provisional 8.0 and official 5.0."
        test_recipe:
          setup: ["cycle 2026 OPEN; volunteer ACTIVE with PENDING record; entries 5.0 APPROVED, 7.0 REJECTED, 3.0 PENDING"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
