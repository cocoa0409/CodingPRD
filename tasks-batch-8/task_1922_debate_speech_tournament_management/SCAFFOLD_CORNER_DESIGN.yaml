      - name: pairing_infeasible_all_same_school_rejected
        claim_type: violation_to_error
        grounds: ["calculations.pairing_generation", "errors[ERR_PAIRING_INFEASIBLE]"]
        distinguishing_aspect: "With all 4 competing entries from one school, the same-school hard constraint admits no complete arrangement: generate-pairings persists nothing and fails with ERR_PAIRING_INFEASIBLE (409); the round stays SCHEDULED."
        test_recipe:
          setup: ["school Alpha with 4 confirmed CX entries and 2 committed 4-round judges (obligation 8 covered); school Beta with no entries; locked; round 1 scheduled; prelims active"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "PI", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 4 }, as: TournamentDirector, captures: { t: $.data.id } }
