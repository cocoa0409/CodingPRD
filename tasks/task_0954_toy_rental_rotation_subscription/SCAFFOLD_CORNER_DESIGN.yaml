  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: pause_allowance_boundary_60_days
        claim_type: boundary_edge
        grounds: [calculations.pause_allowance, "errors[ERR_PAUSE_ALLOWANCE_EXCEEDED]"]
        distinguishing_aspect: "Threshold boundary: cumulative 60 paused days per rolling 365 days is legal (<=); the 61st day fails ERR_PAUSE_ALLOWANCE_EXCEEDED."
        test_recipe:
          setup: ["Plan STD; member M; subscription ACTIVE; two consumed 30-day windows already recorded (total 60)"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.pa60@x.com", full_name: "PA Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/pause"
              payload: { start_date: "2026-05-01", duration_days: 30 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/subscriptions/${s_id}/resume"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/subscriptions/${s_id}/pause"
              payload: { start_date: "2026-05-31", duration_days: 30 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/subscriptions/${s_id}/resume"
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /toy-rental/subscriptions/${s_id}/pause"
              payload: { start_date: "2026-07-01", duration_days: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "After two 30-day windows: Subscription.${s_id}.paused_days_used_365d == 60 (both resumes consumed exactly 30 days)"
            - "A further 1-day pause is rejected: err == ERR_PAUSE_ALLOWANCE_EXCEEDED (HTTP 422) because 60 + 1 > 60"

