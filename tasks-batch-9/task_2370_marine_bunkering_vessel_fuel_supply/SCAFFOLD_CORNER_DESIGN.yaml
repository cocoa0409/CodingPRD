  - section: rbac
    instances:
      - name: missing_or_unknown_role_header_returns_401
        claim_type: unauthorized_access
        grounds:
          - validations[priority 1].ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication is checked before anything else and covers two distinct shapes: no X-User-Role/X-User-ID headers at all, and a syntactically fine but unknown role name - both are 401 ERR_UNAUTHENTICATED, never 403 and never 422, even when the payload itself is also invalid."
        test_recipe:
          setup:
            - "Clock set to 2026-08-05T00:00:00Z; one Port exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100, notice_lead_hours: 24, concurrent_ops_capacity: 2 }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
          trigger:
            - call: "GET /ports/${port_id}"
              payload: {}
              as: NONE
            - call: "GET /ports/${port_id}"
              payload: {}
              as: HarbourMaster
            - call: "POST /ports"
              payload: { name: "No Code Port" }
              as: NONE
          assert:
            - "Trigger 1 (no X-User-Role and no X-User-ID header) returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "Trigger 2 (X-User-Role: HarbourMaster, which is not one of the seven declared roles) returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "Trigger 3 returns HTTP 401 with error_id ERR_UNAUTHENTICATED, not 422 ERR_INVALID_REQUEST, even though port_code is missing (priority 1 precedes priority 16)"
            - "GET /ports with valid headers still returns total_count == 1 (no port was created by trigger 3)"

