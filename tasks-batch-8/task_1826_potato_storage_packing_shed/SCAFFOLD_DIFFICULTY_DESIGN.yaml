  - rule_id: resource_temporal_overlap
    instances:
      - name: pack_line_variety_buffer_overlap
        grounds:
          - state_machines.PackOrder.ALLOCATED_to_PACKING
          - errors[ERR_LINE_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource: the shed's pack line. Interval semantics: conditional sanitation buffer —
          same-variety runs may abut half-open (10:00 start after 10:00 end OK), a different-variety
          run must leave a 1-hour buffer (10:30 start after a 10:00 end conflicts; 12:00 start after
          an 11:00 different-variety end is exactly the buffer boundary and passes).
        test_recipe:
          setup:
            - "Shed with two bins: B1 holds RUSSET_BURBANK lot 1000.00 (assessed 70/20/10, f 0.9); B2 holds YUKON_GOLD lot 500.00 (no assessment, default 0.75)"
            - "RB contract committed 300.00 @ 2000; YG contract committed 200.00 @ 2200; orders O1 RB 100, O2 RB 100, O3 YG 100 all allocated"
            - "fresh PASS wash check at 2026-08-10T00:00:00Z; clock 2026-08-10T07:00:00Z"
