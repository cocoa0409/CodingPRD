# =============================================================================
# §1.9 Scaffold Corner Design — Breadth Coverage Index
# task_2520_cosmetics_facility_registration_product_listing
#
# Walk of references/claim-extraction-guide.md (nine sections; the guide's rows
# are the claim_type values) against SCAFFOLD.yaml §1.1-§1.7. Every corner the
# nine §0.5 Difficulty Rules already probe is an `excluded_because:` stub naming
# the covering instance in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
#
# Conventions (identical to §1.8 so the two files compose):
#   * the logical clock starts at 2026-08-01T00:00:00Z (mandatory startup
#     default of POST /cosmetics/_clock/set_current_utc); a facility approved
#     before any clock move owns the INITIAL period 2026-08-01 .. 2028-07-31
#     with renewal_window_open_date 2028-05-02 and grace_end_date 2028-09-29.
#   * FacilityRegistrant calls carry as_user_id = the Facility.id;
#     ResponsiblePersonAgent calls carry as_user_id = the ResponsiblePerson.id
#     (validations[priority=13]); opaque roles carry pinned audit ids
#     (RVW-1/RVW-2 reviewers, OFF-1/OFF-2 officers, OPS-1 operator).
#   * the "standard ladder" referenced in several setups is the 13-call chain
#     facility -> submit -> APPROVE -> responsible person -> listing ->
#     ingredient -> substantiation -> 2 review items -> submit -> FULL
#     review-decision (40.00 + 25.00 = 65.00 ADEQUATE) -> listing submit ->
#     listing-decision LIST. It is written out in full wherever it is used.
#   * every numeric assert was computed by executing the relevant
#     calculations[].formula with Decimal/ROUND_HALF_UP before being written.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: facility_create_returns_draft_status_and_every_declared_default
        claim_type: creation
        grounds:
          - endpoints[POST /cosmetics/facilities]
          - entities.Facility.fields.registration_status
          - entities.Facility.fields.compliance_posture
          - entities.Facility.fields.abbreviated_renewal_eligible
          - state_machines.Facility.initial_state
        distinguishing_aspect: |
          A create with exactly the five declared required inputs returns 201 and every
          server-side default verbatim: registration_status DRAFT, compliance_posture OPEN,
          serious_event_points 0.00, registration_cycle_count 0, listed_product_count 0,
          abbreviated_renewal_eligible true, facility_fei null, gmp_readiness_score null,
          version 1 — no period fields are populated before approval.
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id, fac_v: $.data.version }
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "Facility.facility_name == \"Aster Labs Newark\" and Facility.facility_type == \"MANUFACTURER\""
            - "Facility.registration_status == \"DRAFT\""
            - "Facility.compliance_posture == \"OPEN\""
            - "Facility.serious_event_points == 0.00"
            - "Facility.registration_cycle_count == 0"
            - "Facility.listed_product_count == 0 and Facility.open_serious_event_count == 0"
            - "Facility.abbreviated_renewal_eligible == true"
            - "Facility.facility_fei is null and Facility.gmp_readiness_score is null and Facility.last_inspection_outcome is null"
            - "Facility.current_period_start, current_period_end, renewal_window_open_date and grace_end_date are all null"
            - "Facility.version == 1 and Facility.id is a UUID with no type prefix"

      - name: facility_retrieval_returns_the_stored_snapshot_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /cosmetics/facilities/{id}]
          - response_envelope.success
        distinguishing_aspect: |
          GET /cosmetics/facilities/{id} echoes exactly what the create call persisted — same id,
          same version 1, still DRAFT — and performs no mutation of its own (version does not
          advance across two consecutive reads).
        test_recipe:
          setup:
            - "one DRAFT facility created and never mutated"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { read_v: $.data.version }
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
          assert:
            - "HTTP 200 on both reads and meta.api_request_id is present on each"
            - "Facility.id == ${fac_id} on both reads"
            - "Facility.registration_status == \"DRAFT\" and Facility.version == 1 on both reads"
            - "the second read returns byte-identical business fields to the first (a GET is not a mutation)"

      - name: facility_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /cosmetics/facilities]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three DRAFT facilities present, limit=2/offset=0 returns 2 rows with total_count 3
          and has_more true; offset=2 returns the remaining 1 row with has_more false; and the
          registration_status filter narrows the same collection to the same 3 rows.
        test_recipe:
          setup:
            - "three DRAFT facilities, created in ascending created_at order"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac1_id: $.data.id }
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Borel Cosmetics Reno", owner_operator_name: "Borel Group", facility_type: "PROCESSOR", country_code: "US", state_or_province: "NV" }
              as: FacilityRegistrant
              captures: { fac2_id: $.data.id }
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Cyan Fill Tampa", owner_operator_name: "Cyan Fill LLC", facility_type: "BOTH", country_code: "US", state_or_province: "FL" }
              as: FacilityRegistrant
              captures: { fac3_id: $.data.id }
          trigger:
            - call: "GET /cosmetics/facilities"
              payload: { limit: 2, offset: 0 }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /cosmetics/facilities"
              payload: { limit: 2, offset: 2 }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "GET /cosmetics/facilities"
              payload: { registration_status: "DRAFT" }
              as: SystemOperator
              as_user_id: "OPS-1"
          assert:
            - "first page: response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: len(data) == 1, total_count == 3, has_more == false"
            - "the two pages together contain ${fac1_id}, ${fac2_id} and ${fac3_id} exactly once each"
            - "the registration_status == \"DRAFT\" query returns total_count == 3 with the default limit 10 and has_more == false"

      - name: facility_get_with_unknown_uuid_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_FACILITY_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          A well-formed UUID that matches no Facility row returns ERR_FACILITY_NOT_FOUND (404)
          from validations[priority=3], ahead of any business rule — and the same unknown id on a
          nested facility route (registration-periods) resolves to the same error.
        test_recipe:
          setup:
            - "empty database; no facility with the probed id exists"
          setup_api_calls: []
          trigger:
            - call: "GET /cosmetics/facilities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { err1: $.data.error_id }
            - call: "GET /cosmetics/facilities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/registration-periods"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { err2: $.data.error_id }
          assert:
            - "both calls return HTTP 404 with response_type == \"error\""
            - "${err1} == \"ERR_FACILITY_NOT_FOUND\" and ${err2} == \"ERR_FACILITY_NOT_FOUND\""
            - "no Facility row is created by either call"

      - name: listing_create_without_product_form_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=14]
          - endpoints[POST /cosmetics/listings]
        distinguishing_aspect: |
          product_form has source: input with no default, so omitting it fails the schema check at
          validations[priority=14] with ERR_INVALID_REQUEST (400) — before the category-registry
          check at priority 15 and before any listing row is written.
        test_recipe:
          setup:
            - "one REGISTERED facility and one ResponsiblePerson, so only the missing field can fail"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == \"ERR_INVALID_REQUEST\""
            - "GET /cosmetics/listings?facility_id=${fac_id} returns total_count == 0 — nothing was persisted"

      - name: listing_create_with_out_of_range_product_form_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.ProductListing.fields.product_form
          - validations[priority=14]
        distinguishing_aspect: |
          product_form is an enum of exactly {LEAVE_ON, RINSE_OFF}; the out-of-range value
          "SPRAY_ON" is rejected as a schema violation (ERR_INVALID_REQUEST, 400) and NOT as a
          category error, distinguishing the enum gate at priority 14 from the registry gate at
          priority 15.
        test_recipe:
          setup:
            - "one REGISTERED facility and one ResponsiblePerson (same setup as the missing-field corner)"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "SPRAY_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == \"ERR_INVALID_REQUEST\" (not ERR_UNKNOWN_CATEGORY_CODE)"
            - "no ProductListing row exists for ${fac_id}"

      - name: responsible_person_create_applies_cap_default_and_dormant_status
        claim_type: defaults
        grounds:
          - endpoints[POST /cosmetics/responsible-persons]
          - entities.ResponsiblePerson.fields.designation_cap
          - entities.ResponsiblePerson.fields.status
        distinguishing_aspect: |
          Omitting the optional designation_cap yields exactly 25, active_designation_count 0 and
          status DORMANT (a person holding no listing is never ACTIVE); a second person created
          WITH designation_cap 1 keeps the supplied value, proving the default is a default and
          not a constant.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp1_id: $.data.id }
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Borel Label Services", us_address_line: "88 Sierra Way, Reno NV 89501", contact_phone: "+1-202-555-0166", contact_email: "rp@borel.example", designation_cap: 1 }
              as: ResponsiblePersonAgent
              captures: { rp2_id: $.data.id }
          assert:
            - "HTTP 201 on both calls"
            - "person 1: designation_cap == 25, active_designation_count == 0, status == \"DORMANT\", version == 1"
            - "person 2: designation_cap == 1, active_designation_count == 0, status == \"DORMANT\""
            - "GET /cosmetics/responsible-persons/${rp1_id} returns the same three values"

      - name: listing_create_applies_every_declared_default_on_a_bare_payload
        claim_type: defaults
        grounds:
          - endpoints[POST /cosmetics/listings]
          - entities.ProductListing.fields.listing_status
          - entities.ProductListing.fields.safety_status
          - entities.ProductListing.fields.allergen_disclosure_complete
          - entities.ProductListing.fields.marketable
        distinguishing_aspect: |
          A listing created with only its required inputs defaults professional_use_only false,
          professional_use_statement_present false and lot_authorized_units 0, and computes
          listing_status DRAFT, safety_status UNSUBSTANTIATED, allergen_disclosure_complete true
          (the vacuous zero-ingredient set), undisclosed_allergen_count 0, open_recall_count 0,
          distributed_units_total 0 and marketable false with listing_number still null.
        test_recipe:
          setup:
            - "one REGISTERED facility and one ResponsiblePerson"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
          assert:
            - "HTTP 201; ProductListing.listing_status == \"DRAFT\" and safety_status == \"UNSUBSTANTIATED\""
            - "ProductListing.professional_use_only == false and professional_use_statement_present == false"
            - "ProductListing.lot_authorized_units == 0"
            - "ProductListing.allergen_disclosure_complete == true and undisclosed_allergen_count == 0"
            - "ProductListing.distributed_units_total == 0 and open_recall_count == 0"
            - "ProductListing.marketable == false and listing_number is null"
            - "Facility.listed_product_count is still 0 and ResponsiblePerson.active_designation_count is still 0 — a DRAFT listing occupies no designation slot"

      - name: ingredient_disclosure_required_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - calculations.allergen_disclosure_completeness
          - entities.ProductIngredient.fields.disclosure_required
          - entities.ProductListing.fields.undisclosed_allergen_count
        distinguishing_aspect: |
          disclosure_required is source: computed and is derived from
          is_fragrance_allergen AND concentration_pct >= 0.001 (LEAVE_ON) AND the listing not being
          professional-use-only: an allergen at 0.0020 gets disclosure_required true and drives
          undisclosed_allergen_count to 1, while a non-allergen preservative at 0.5000 gets false
          — neither value is taken from the request.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, one DRAFT consumer LEAVE_ON listing (category 07A)"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/listings/${lst_id}/ingredients"
              payload: { inci_name: "LINALOOL", function_code: "FRAGRANCE", concentration_pct: 0.0020, is_fragrance_allergen: true, label_disclosed: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ing_allergen_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/ingredients"
              payload: { inci_name: "PHENOXYETHANOL", function_code: "PRESERVATIVE", concentration_pct: 0.5000, is_fragrance_allergen: false, label_disclosed: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ing_preservative_id: $.data.id }
          assert:
            - "the LINALOOL row returns disclosure_required == true (0.0020 >= 0.001 on a LEAVE_ON consumer listing)"
            - "the PHENOXYETHANOL row returns disclosure_required == false despite the far higher 0.5000 concentration"
            - "GET /cosmetics/listings/${lst_id} shows undisclosed_allergen_count == 1 and allergen_disclosure_complete == false"
            - "GET /cosmetics/listings/${lst_id}/ingredients?is_fragrance_allergen=true returns exactly one row, ${ing_allergen_id}"

      - name: facility_fei_minted_in_ascending_approval_order
        claim_type: system_fields
        grounds:
          - state_machines.Facility.PENDING_REVIEW_to_REGISTERED
          - entities.Facility.fields.facility_fei
          - entities.Facility.fields.registration_cycle_count
        distinguishing_aspect: |
          facility_fei is source: system and is minted only at approval: the first approved facility
          receives FEI-000001 and the second FEI-000002 (six-digit zero-padded ordinal over
          approved facilities in ascending created_at order), while registration_cycle_count moves
          0 -> 1 on the same transition and the four period fields appear for the first time.
        test_recipe:
          setup:
            - "two facilities created in ascending created_at order and approved in that same order"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac1_id: $.data.id }
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Borel Cosmetics Reno", owner_operator_name: "Borel Group", facility_type: "PROCESSOR", country_code: "US", state_or_province: "NV" }
              as: FacilityRegistrant
              captures: { fac2_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac1_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac1_id}"
            - call: "POST /cosmetics/facilities/${fac2_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac2_id}"
          trigger:
            - call: "POST /cosmetics/facilities/${fac1_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { fei1: $.data.facility_fei }
            - call: "POST /cosmetics/facilities/${fac2_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { fei2: $.data.facility_fei }
          assert:
            - "${fei1} == \"FEI-000001\" and ${fei2} == \"FEI-000002\""
            - "both facilities: registration_status == \"REGISTERED\", registration_cycle_count == 1, compliance_posture == \"OPEN\""
            - "both facilities: current_period_start == \"2026-08-01\", current_period_end == \"2028-07-31\", renewal_window_open_date == \"2028-05-02\", grace_end_date == \"2028-09-29\""
            - "GET /cosmetics/facilities/${fac1_id}/registration-periods returns exactly one row with period_kind == \"INITIAL\", sequence_index == 1, status == \"ACTIVE\""

      - name: ledger_entry_is_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ComplianceLedgerEntry
          - endpoints[GET /cosmetics/facilities/{id}/ledger-entries]
        distinguishing_aspect: |
          ComplianceLedgerEntry declares common_fields: false — it therefore exposes only id and
          created_at (no version, no updated_at), has no create/update/delete endpoint of its own,
          and is only ever appended by transitions: the approval of a facility leaves exactly one
          STATE_TRANSITION row at sequence_no 1.
        test_recipe:
          setup:
            - "one REGISTERED facility (approval appends its first ledger row)"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
