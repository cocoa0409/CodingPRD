# =============================================================================
# Task 0904 — Smoking-Cessation & Quitline Program (Expert)
# Seed tables §1.0–§1.7. §1.8/§1.9 live in sibling files.
# =============================================================================

scenario: |
  904. Smoking-Cessation & Quitline Program: enrollment & readiness assessment,
  coaching-call schedule & protocol, NRT/medication shipment & eligibility,
  quit-date & relapse tracking, provider/benefit referral, incentive & employer
  program, follow-up (7/30-day) outcome, reporting

domain_name: smoking-cessation-quitline
# Multiple peer top-level collections (employer-programs, coaches, participants,
# enrollments, and their nested resources). Empty api_prefix => every collection
# root is `/<segment>/{id}`, which keeps FK reverse-reachability derivable.
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  # Tree spine Participant -> Enrollment -> {assessments, quit-attempts, calls,
  # shipments, awards, outcomes, referrals} with cross-cutting FKs to the peer
  # resources EmployerProgram (budget sponsor) and Coach (schedulable resource).

  state_machine_shape: cyclic
  # QuitAttempt is cyclic (RELAPSED -> COMMITTED recommit loop); Enrollment and
  # CoachingCall are branching; NRTShipment is linear-with-revert.

  relationship_patterns:
    - one_to_many          # Enrollment has many quit-attempts / calls / shipments / awards
    - cross_aggregate      # CoachingCall -> Coach; Participant -> EmployerProgram

  role_model: peer_roles
  # ProgramAdmin owns programs/coaches/reports; CaseManager owns the clinical
  # enrollment workflow; Participant is entity-backed self-service (read + own
  # readiness/quit-date submission).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: EmployerProgram
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Sponsor program name" }
      - { name: budget_total_cents, type: integer, source: input, description: "Total incentive budget in cents", constraints: ">= 0" }
      - { name: budget_remaining_cents, type: integer, source: computed, description: "= budget_total_cents - sum(IncentiveAward.amount_cents where status IN {EARNED, PAID} over enrollments of participants whose employer_program_id == this program)" }
      - { name: coaching_protocol, type: enum, source: input, description: "STANDARD | INTENSIVE — default coaching cadence", default: STANDARD, constraints: "STANDARD | INTENSIVE" }
      - { name: nrt_courses_allotted, type: integer, source: input, description: "Per-participant NRT course allotment inherited by sponsored enrollments", default: 3, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED", default: ACTIVE, constraints: "ACTIVE | CLOSED" }

  - name: Coach
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Coach full name" }
      - { name: languages, type: array, source: input, description: "ISO-639 language codes the coach can counsel in, e.g. [EN, ES]" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant full name" }
      - { name: email, type: string, source: input, description: "Participant email" }
      - { name: primary_language, type: string, source: input, description: "ISO-639 language code, e.g. EN" }
      - { name: cigarettes_per_day, type: integer, source: input, description: "Baseline cigarettes/day; drives readiness dependence penalty and NRT dosing", constraints: ">= 0" }
      - { name: employer_program_id, type: string, source: input, description: "FK -> EmployerProgram.id; null for self-pay participants" }

  - name: Enrollment
    parent: Participant
    common_fields: true          # version => OCC-eligible where needed
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: status, type: enum, source: system, description: "PENDING_ASSESSMENT | ACTIVE | DISENROLLED | COMPLETED | DECLINED", default: PENDING_ASSESSMENT, constraints: "PENDING_ASSESSMENT | ACTIVE | DISENROLLED | COMPLETED | DECLINED" }
      - { name: readiness_score, type: integer, source: computed, description: "readiness_score of the latest ReadinessAssessment; null before first assessment" }
      - { name: readiness_result, type: enum, source: computed, description: "PASS | FAIL of the latest ReadinessAssessment; null before first assessment", constraints: "PASS | FAIL" }
      - { name: nrt_courses_allotted, type: integer, source: system, description: "Copied from sponsor EmployerProgram.nrt_courses_allotted at creation, else DEFAULT_SELF_PAY_NRT_COURSES" }
      - { name: nrt_courses_used, type: integer, source: computed, description: "Count of this enrollment's NRTShipment rows in status DELIVERED" }
      - { name: nrt_courses_remaining, type: integer, source: computed, description: "= nrt_courses_allotted - nrt_courses_used" }
      - { name: nrt_eligibility, type: enum, source: computed, description: "ELIGIBLE | EXHAUSTED — EXHAUSTED iff nrt_courses_used >= nrt_courses_allotted", constraints: "ELIGIBLE | EXHAUSTED" }
      - { name: incentive_earned_cents, type: integer, source: computed, description: "Sum of this enrollment's IncentiveAward.amount_cents where status IN {EARNED, PAID}" }
      - { name: completed_calls, type: integer, source: computed, description: "Count of this enrollment's CoachingCall rows in status COMPLETED" }
      - { name: protocol_complete, type: boolean, source: computed, description: "true iff completed_calls >= PROTOCOL_CALL_TARGET" }

  - name: ReadinessAssessment
    parent: Enrollment
    common_fields: false         # id, created_at only (append-only event)
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: motivation_score, type: integer, source: input, description: "Motivation to quit, 1-10", constraints: "1..10" }
      - { name: confidence_score, type: integer, source: input, description: "Confidence to quit, 1-10", constraints: "1..10" }
      - { name: prior_quit_attempts, type: integer, source: input, description: "Number of prior lifetime quit attempts", constraints: ">= 0" }
      - { name: cigarettes_per_day, type: integer, source: system, description: "Snapshot of Participant.cigarettes_per_day at assessment time" }
      - { name: readiness_score, type: integer, source: computed, description: "See readiness_score calculation" }
      - { name: result, type: enum, source: computed, description: "PASS iff readiness_score >= READINESS_PASS_THRESHOLD else FAIL", constraints: "PASS | FAIL" }

  - name: QuitAttempt
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: quit_date, type: datetime, source: input, description: "Target quit date/time (ISO 8601 UTC)" }
      - { name: method, type: enum, source: input, description: "COLD_TURKEY | NRT_ASSISTED | MEDICATION | GRADUAL_REDUCTION", constraints: "COLD_TURKEY | NRT_ASSISTED | MEDICATION | GRADUAL_REDUCTION" }
      - { name: status, type: enum, source: system, description: "COMMITTED | QUIT_ACHIEVED | RELAPSED | ABANDONED", default: COMMITTED, constraints: "COMMITTED | QUIT_ACHIEVED | RELAPSED | ABANDONED" }
      - { name: attempt_number, type: integer, source: system, description: "1-based ordinal among the enrollment's quit attempts (creation order)" }

  - name: CoachingCall
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Call start (ISO 8601 UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Call length in minutes", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELED", default: SCHEDULED, constraints: "SCHEDULED | COMPLETED | NO_SHOW | CANCELED" }

  - name: NRTShipment
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: medication_type, type: enum, source: input, description: "PATCH | GUM | LOZENGE | VARENICLINE | BUPROPION", constraints: "PATCH | GUM | LOZENGE | VARENICLINE | BUPROPION" }
      - { name: course_start_date, type: datetime, source: input, description: "Course start date (ISO 8601 UTC, date-granular)" }
      - { name: course_end_date, type: datetime, source: input, description: "Course end date, inclusive (ISO 8601 UTC, date-granular)" }
      - { name: weeks_supply, type: integer, source: computed, description: "See nrt_course_quantity calculation" }
      - { name: dose_mg, type: integer, source: computed, description: "Patch dose in mg (PATCH only); null otherwise" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | SHIPPED | DELIVERED | CANCELED | RETURNED", default: REQUESTED, constraints: "REQUESTED | APPROVED | SHIPPED | DELIVERED | CANCELED | RETURNED" }

  - name: IncentiveAward
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: milestone_type, type: enum, source: input, description: "ENROLLMENT | QUIT_DATE_SET | SEVEN_DAY_ABSTINENT | THIRTY_DAY_ABSTINENT | PROTOCOL_COMPLETE | DISCRETIONARY", constraints: "ENROLLMENT | QUIT_DATE_SET | SEVEN_DAY_ABSTINENT | THIRTY_DAY_ABSTINENT | PROTOCOL_COMPLETE | DISCRETIONARY" }
      - { name: amount_cents, type: integer, source: input, description: "Award amount in cents; system milestones use INCENTIVE_AMOUNTS, DISCRETIONARY supplied by CaseManager", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "EARNED | PAID | FORFEITED", default: EARNED, constraints: "EARNED | PAID | FORFEITED" }
      - { name: source, type: enum, source: system, description: "SYSTEM (milestone side-effect) | MANUAL (case-manager POST)", constraints: "SYSTEM | MANUAL" }

  - name: FollowUpOutcome
    parent: Enrollment
    common_fields: false         # id, created_at only (append-only event)
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: day, type: integer, source: input, description: "Follow-up milestone day: 7 or 30", constraints: "7 | 30" }
      - { name: abstinent, type: boolean, source: input, description: "Self-reported point-prevalence abstinence at this milestone" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock time at recording" }

  - name: Referral
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: referral_type, type: enum, source: input, description: "PROVIDER | BENEFIT | PHARMACY", constraints: "PROVIDER | BENEFIT | PHARMACY" }
      - { name: target_name, type: string, source: input, description: "Name of the referred provider/benefit/pharmacy" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN, constraints: "OPEN | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Enrollment
  - entity: Enrollment
    initial_state: PENDING_ASSESSMENT
    terminal_states: [DISENROLLED, COMPLETED, DECLINED]
    transitions:
      - from: PENDING_ASSESSMENT
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: CaseManager
        preconditions:
          - "latest ReadinessAssessment exists and result == PASS (else ERR_READINESS_NOT_MET)"
        side_effects:
          - "If participant.employer_program_id is set: create SYSTEM IncentiveAward{milestone_type=ENROLLMENT, amount_cents=INCENTIVE_AMOUNTS.ENROLLMENT, status=EARNED}"
          - "That award debits EmployerProgram.budget_remaining_cents by INCENTIVE_AMOUNTS.ENROLLMENT and increments EmployerProgram.version by 1"
          - "recompute Enrollment.incentive_earned_cents"

      - from: PENDING_ASSESSMENT
        to: DECLINED
        trigger: "POST /enrollments/{id}/disenroll"
        actor: CaseManager
        preconditions: []
        side_effects: []
        note: "Disenroll before activation just declines; no children exist to cascade."

      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /enrollments/{id}/disenroll"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "CASCADE L1->L2: every QuitAttempt in {COMMITTED, QUIT_ACHIEVED, RELAPSED} -> ABANDONED"
          - "CASCADE L2->L3: each ABANDONED QuitAttempt forfeits this enrollment's EARNED IncentiveAward rows whose milestone_type IN {QUIT_DATE_SET, SEVEN_DAY_ABSTINENT, THIRTY_DAY_ABSTINENT} -> FORFEITED"
          - "CASCADE L3->L4: each FORFEITED award credits EmployerProgram.budget_remaining_cents by its amount_cents and increments EmployerProgram.version by 1"
          - "FAN-OUT: every CoachingCall in SCHEDULED -> CANCELED (releases the coach time slot)"
          - "FAN-OUT: every NRTShipment in {REQUESTED, APPROVED, SHIPPED} -> CANCELED (restores nrt_courses_remaining for non-DELIVERED)"
          - "FAN-OUT: every Referral in OPEN -> CLOSED"
          - "recompute Enrollment.incentive_earned_cents, nrt_courses_used"

      - from: ACTIVE
        to: COMPLETED
        trigger: "System side effect of POST /enrollments/{id}/follow-up-outcomes with day=30, abstinent=true"
        actor: system
        preconditions:
          - "enrollment has a QuitAttempt in QUIT_ACHIEVED (7-day already achieved for continuous abstinence)"
        side_effects:
          - "create SYSTEM IncentiveAward{milestone_type=THIRTY_DAY_ABSTINENT, amount_cents=INCENTIVE_AMOUNTS.THIRTY_DAY_ABSTINENT, status=EARNED} (debits budget, bumps EmployerProgram.version) when sponsored"
          - "every EARNED IncentiveAward on this enrollment -> PAID (amount stays committed; incentive_earned_cents unchanged)"
          - "every Referral in OPEN -> CLOSED"

  # ---------------------------------------------------------------- QuitAttempt (cyclic)
  - entity: QuitAttempt
    initial_state: COMMITTED
    terminal_states: [ABANDONED]
    transitions:
      - from: COMMITTED
        to: QUIT_ACHIEVED
        trigger: "System side effect of POST /enrollments/{id}/follow-up-outcomes with day=7, abstinent=true"
        actor: system
        preconditions:
          - "this is the highest-attempt_number QuitAttempt in COMMITTED for the enrollment"
        side_effects:
          - "create SYSTEM IncentiveAward{milestone_type=SEVEN_DAY_ABSTINENT, amount_cents=INCENTIVE_AMOUNTS.SEVEN_DAY_ABSTINENT, status=EARNED} (debits budget, bumps EmployerProgram.version) when sponsored"

      - from: COMMITTED
        to: RELAPSED
        trigger: "POST /quit-attempts/{id}/transition (to_status=RELAPSED) OR system side effect of a day=7/30 outcome with abstinent=false"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "forfeit this enrollment's EARNED IncentiveAward rows whose milestone_type IN {SEVEN_DAY_ABSTINENT, THIRTY_DAY_ABSTINENT} -> FORFEITED (credits budget, bumps EmployerProgram.version)"

      - from: QUIT_ACHIEVED
        to: RELAPSED
        trigger: "POST /quit-attempts/{id}/transition (to_status=RELAPSED) OR system side effect of a day=30 outcome with abstinent=false"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "forfeit this enrollment's EARNED IncentiveAward rows whose milestone_type IN {SEVEN_DAY_ABSTINENT, THIRTY_DAY_ABSTINENT} -> FORFEITED (credits budget, bumps EmployerProgram.version)"

      - from: RELAPSED
        to: COMMITTED
        trigger: "POST /quit-attempts/{id}/transition (to_status=COMMITTED, new quit_date)"
        actor: CaseManager
        preconditions:
          - "enrollment.status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "new quit_date provided in request"
        side_effects:
          - "quit_date updated to the recommit value"
        note: "Cyclic RELAPSED -> COMMITTED recommit loop on the same QuitAttempt."

      - from: COMMITTED
        to: ABANDONED
        trigger: "System side effect of Enrollment ACTIVE -> DISENROLLED"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUIT_ACHIEVED
        to: ABANDONED
        trigger: "System side effect of Enrollment ACTIVE -> DISENROLLED"
        actor: system
        preconditions: []
        side_effects: []

      - from: RELAPSED
        to: ABANDONED
        trigger: "System side effect of Enrollment ACTIVE -> DISENROLLED"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------- CoachingCall (branching)
  - entity: CoachingCall
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /coaching-calls/{id}/transition (to_status=COMPLETED)"
        actor: CaseManager
        preconditions:
          - "enrollment.status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "recompute Enrollment.completed_calls and protocol_complete"
          - "if completed_calls transitions to exactly PROTOCOL_CALL_TARGET and no PROTOCOL_COMPLETE award exists: create SYSTEM IncentiveAward{milestone_type=PROTOCOL_COMPLETE, amount_cents=INCENTIVE_AMOUNTS.PROTOCOL_COMPLETE, status=EARNED} (debits budget, bumps EmployerProgram.version) when sponsored"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /coaching-calls/{id}/transition (to_status=NO_SHOW)"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "releases the coach time slot (no incentive, completed_calls unaffected)"

      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /coaching-calls/{id}/transition (to_status=CANCELED) OR system side effect of Enrollment ACTIVE -> DISENROLLED"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "releases the coach time slot"

  # ---------------------------------------------------------------- NRTShipment (linear + revert)
  - entity: NRTShipment
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELED, RETURNED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /nrt-shipments/{id}/transition (to_status=APPROVED)"
        actor: CaseManager
        preconditions:
          - "enrollment.status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "enrollment has a QuitAttempt in {COMMITTED, QUIT_ACHIEVED} (else ERR_NO_COMMITTED_QUIT_ATTEMPT)"
        side_effects: []

      - from: APPROVED
        to: SHIPPED
        trigger: "POST /nrt-shipments/{id}/transition (to_status=SHIPPED)"
        actor: CaseManager
        preconditions: []
        side_effects: []

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /nrt-shipments/{id}/transition (to_status=DELIVERED)"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "CASCADE L1->L2: recompute Enrollment.nrt_courses_used (now includes this row) and nrt_courses_remaining"
          - "CASCADE L2->L3: recompute Enrollment.nrt_eligibility; flips to EXHAUSTED iff nrt_courses_used >= nrt_courses_allotted"

      - from: REQUESTED
        to: CANCELED
        trigger: "POST /nrt-shipments/{id}/transition (to_status=CANCELED) OR system side effect of disenroll"
        actor: CaseManager
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: CANCELED
        trigger: "POST /nrt-shipments/{id}/transition (to_status=CANCELED) OR system side effect of disenroll"
        actor: CaseManager
        preconditions: []
        side_effects: []

      - from: SHIPPED
        to: CANCELED
        trigger: "POST /nrt-shipments/{id}/transition (to_status=CANCELED) OR system side effect of disenroll"
        actor: CaseManager
        preconditions: []
        side_effects: []

      - from: DELIVERED
        to: RETURNED
        trigger: "POST /nrt-shipments/{id}/transition (to_status=RETURNED)"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "recompute Enrollment.nrt_courses_used (drops this row) and nrt_courses_remaining"
          - "recompute Enrollment.nrt_eligibility; flips back to ELIGIBLE iff nrt_courses_used < nrt_courses_allotted"

  # ---------------------------------------------------------------- EmployerProgram
  - entity: EmployerProgram
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /employer-programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "expected_employer_program_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "increments EmployerProgram.version by 1"
          - "subsequent manual IncentiveAward POSTs against this program's participants are rejected with ERR_PROGRAM_CLOSED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: manual-award-stale-program
    parent_entity: EmployerProgram
    write_endpoint: "POST /enrollments/{id}/incentive-awards"
    occ_field: "expected_employer_program_version"
    description: |
      Recording a manual IncentiveAward debits the sponsor EmployerProgram's
      shared budget_remaining_cents. When the program's version has advanced
      since the client last observed it — because another award (system
      milestone or manual) has already debited the same budget — the write is
      rejected as stale. A strictly-sequential second write would otherwise
      legitimately succeed (budget could still cover it), so this is a genuine
      lost-update conflict resolved by OCC on EmployerProgram.version, not a
      state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: readiness_score
    trigger: "POST /enrollments/{id}/readiness-assessments"
    algorithm: weighted_scoring
    formula: |
      prior_bonus =
        0 if prior_quit_attempts == 0
        1 if 1 <= prior_quit_attempts <= 2
        2 if prior_quit_attempts >= 3
      dependence_penalty =
        0 if cigarettes_per_day <= 10
        1 if 11 <= cigarettes_per_day <= 20
        2 if cigarettes_per_day >= 21
      readiness_score = motivation_score + confidence_score + prior_bonus - dependence_penalty
      result = PASS if readiness_score >= READINESS_PASS_THRESHOLD else FAIL
    input_set: "The single POSTed assessment; cigarettes_per_day snapshotted from Participant."
    constants:
      READINESS_PASS_THRESHOLD: 12
    precision: "integer points; no rounding"

  - name: nrt_course_quantity
    trigger: "POST /enrollments/{id}/nrt-shipments"
    algorithm: tiered_pricing
    formula: |
      weeks_supply =
        12 if cigarettes_per_day >= 21
        10 if 11 <= cigarettes_per_day <= 20
        8  if cigarettes_per_day <= 10
      dose_mg =
        (21 if cigarettes_per_day >= 11 else 14) when medication_type == PATCH
        null otherwise
    input_set: "Participant.cigarettes_per_day and the shipment's medication_type."
    constants: {}
    precision: "integer weeks / mg"

  - name: incentive_payout
    trigger: "GET /enrollments/{id}/incentive-summary"
    algorithm: aggregation
    formula: |
      provisional_earned_cents = sum(a.amount_cents for a in awards
                                     if a.status IN {EARNED, PAID})
      final_payout_cents:
        variant PROVISIONAL: = provisional_earned_cents
        variant FINAL:       = provisional_earned_cents + completion_bonus_cents
    input_set: "All IncentiveAward rows of the enrollment; FORFEITED excluded."
    constants:
      INCENTIVE_AMOUNTS: { ENROLLMENT: 1000, QUIT_DATE_SET: 1500, SEVEN_DAY_ABSTINENT: 2500, THIRTY_DAY_ABSTINENT: 5000, PROTOCOL_COMPLETE: 2000 }
      PROTOCOL_CALL_TARGET: 4
      DEFAULT_SELF_PAY_NRT_COURSES: 2
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "enrollment.status != COMPLETED — bonus not yet realized"
        difference: "final_payout_cents == provisional_earned_cents (no completion bonus)"
      - name: FINAL
        when: "enrollment.status == COMPLETED (30-day continuous abstinence reached)"
        difference: "final_payout_cents == provisional_earned_cents + completion_bonus_cents"

  - name: incentive_completion_bonus
    trigger: "GET /enrollments/{id}/incentive-summary"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round EACH award's bonus to the nearest cent
      # (half up) FIRST, THEN sum. This is NOT round(sum(amount_cents)*RATE).
      completion_bonus_cents = sum(
        round_half_up(a.amount_cents * COMPLETION_BONUS_RATE)
        for a in awards if a.status IN {EARNED, PAID}
      )
    input_set: "Non-forfeited IncentiveAward rows of a COMPLETED enrollment."
    constants:
      COMPLETION_BONUS_RATE: 0.075
    precision: "integer cents, round_half_up applied per-award before summation"

  - name: coaching_schedule_window
    trigger: "POST /enrollments/{id}/coaching-calls"
    algorithm: interval_merge
    formula: |
      # Half-open minute intervals per coach: call occupies [scheduled_start,
      # scheduled_start + duration_minutes). A new call is rejected if, for the
      # same coach and any CoachingCall in {SCHEDULED, COMPLETED, NO_SHOW}, the
      # gap between the two intervals is < COACH_BUFFER_MINUTES (adjacency within
      # buffer counts as a conflict) -> ERR_COACH_DOUBLE_BOOKED.
      # Lead time: scheduled_start must be >= clock_now + SCHEDULE_MIN_LEAD_MINUTES
      # else ERR_SCHEDULE_WINDOW_INVALID.
      conflict = exists other call C (same coach, status in {SCHEDULED, COMPLETED, NO_SHOW}) s.t.
        max(new.start, C.start) < min(new.end, C.end) + COACH_BUFFER_MINUTES
        AND min(new.end, C.end) + COACH_BUFFER_MINUTES > max(new.start, C.start)
        i.e. the buffered intervals overlap.
    input_set: "The coach's non-canceled CoachingCall rows plus the requested slot."
    constants:
      COACH_BUFFER_MINUTES: 15
      SCHEDULE_MIN_LEAD_MINUTES: 60
    precision: "minute granularity"

  - name: abstinence_outcome_rate
    trigger: "GET /employer-programs/{id}/outcome-report"
    algorithm: aggregation
    formula: |
      cohort = { E : E is an Enrollment of a Participant whose employer_program_id == program.id
                     AND E has >= 1 QuitAttempt whose quit_date is set
                     AND clock_now >= (that QuitAttempt.quit_date + 30 days) }
      n = |cohort|
      if n == 0:
        point_prevalence_7day_rate = 0.0
        continuous_30day_rate      = 0.0
      else:
        seven = count(E in cohort with a FollowUpOutcome(day=7, abstinent=true))
        cont  = count(E in cohort with a FollowUpOutcome(day=7, abstinent=true)
                                    AND a FollowUpOutcome(day=30, abstinent=true))
        point_prevalence_7day_rate = round_half_up(100.0 * seven / n, 1)
        continuous_30day_rate      = round_half_up(100.0 * cont  / n, 1)
    input_set: "Program cohort as defined; both variants share the same denominator n."
    constants: {}
    precision: "percentage, 1 decimal place, round_half_up"
    variants:
      - name: POINT_PREVALENCE_7DAY
        when: "counts any enrollment abstinent at the 7-day milestone"
        difference: "numerator = 7-day-abstinent count"
      - name: CONTINUOUS_30DAY
        when: "counts only enrollments abstinent at BOTH 7-day and 30-day"
        difference: "numerator = continuous-abstinence count (<= 7-day count)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed Participant may only act on resources it owns"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right in the path)"
    error_id: "ERR_*_NOT_FOUND (per resource)"
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state that admits the requested transition (includes Enrollment must be ACTIVE for coaching/NRT/award/referral operations)"
    error_id: "ERR_INVALID_STATE / ERR_ENROLLMENT_NOT_ACTIVE"
    http_status: 409
    applies_to: "all state transitions and enrollment-scoped mutations"

  - priority: 5
    category: state
    check: "OCC: expected_employer_program_version equals current EmployerProgram.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments/{id}/incentive-awards, POST /employer-programs/{id}/close"

  - priority: 6
    category: business_referential
    check: "Cross-entity reference legality: coach.languages contains participant.primary_language; NRT requires an existing COMMITTED/QUIT_ACHIEVED QuitAttempt; program not CLOSED for manual awards"
    error_id: "ERR_COACH_LANGUAGE_MISMATCH / ERR_NO_COMMITTED_QUIT_ATTEMPT / ERR_PROGRAM_CLOSED"
    http_status: 409
    applies_to: "POST coaching-calls, POST nrt-shipments (APPROVED), POST incentive-awards"

  - priority: 7
    category: business_temporal
    check: "Temporal legality: coaching-call scheduled_start >= clock_now + SCHEDULE_MIN_LEAD_MINUTES and no coach overlap within COACH_BUFFER_MINUTES; NRT course date interval must not overlap an existing course; follow-up window (quit_date + day) must be open"
    error_id: "ERR_SCHEDULE_WINDOW_INVALID / ERR_COACH_DOUBLE_BOOKED / ERR_NRT_COURSE_OVERLAP / ERR_FOLLOWUP_WINDOW_NOT_OPEN"
    http_status: 409
    applies_to: "POST coaching-calls, POST nrt-shipments, POST follow-up-outcomes"

  - priority: 8
    category: business_constraint
    check: "Constraint satisfaction: readiness result must be PASS to activate; NRT allotment not exhausted; at most one FollowUpOutcome per (enrollment, day)"
    error_id: "ERR_READINESS_NOT_MET / ERR_NRT_EXHAUSTED / ERR_DUPLICATE_FOLLOWUP"
    http_status: 422
    applies_to: "POST activate, POST nrt-shipments, POST follow-up-outcomes"

  - priority: 9
    category: business_fiscal
    check: "Sponsor EmployerProgram.budget_remaining_cents must cover the award amount_cents"
    error_id: ERR_PROGRAM_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /enrollments/{id}/incentive-awards"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced/rewound to the given instant"]

  # ---- EmployerProgram ----
  - method: POST
    path: "/employer-programs"
    description: "Create an employer-sponsored incentive program"
    roles: [ProgramAdmin]
    code: 201
    input: [name, budget_total_cents, "coaching_protocol?", "nrt_courses_allotted?"]
    output: EmployerProgram
    side_effects: ["status=ACTIVE; budget_remaining_cents=budget_total_cents; version=1"]

  - method: GET
    path: "/employer-programs/{id}"
    description: "Get an employer program"
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: []
    output: EmployerProgram
    side_effects: []

  - method: POST
    path: "/employer-programs/{id}/close"
    description: "Close a program (OCC-guarded)"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_employer_program_version]
    output: EmployerProgram
    side_effects: ["status=CLOSED", "increments EmployerProgram.version by 1"]

  - method: GET
    path: "/employer-programs/{id}/participants"
    description: "List participants sponsored by this program (reverse FK Participant.employer_program_id)"
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: GET
    path: "/employer-programs/{id}/outcome-report"
    description: "Program outcome report: cohort size + point-prevalence(7d) and continuous(30d) abstinence rates"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ cohort_size: integer, point_prevalence_7day_rate: number, continuous_30day_rate: number }"
    side_effects: []

  # ---- Coach ----
  - method: POST
    path: "/coaches"
    description: "Create a coach"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, languages]
    output: Coach
    side_effects: []

  - method: GET
    path: "/coaches/{id}"
    description: "Get a coach"
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: []
    output: Coach
    side_effects: []

  - method: GET
    path: "/coaches/{id}/coaching-calls"
    description: "List calls booked with this coach (reverse FK CoachingCall.coach_id)"
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: ["limit?", "offset?"]
    output: CoachingCall[]
    side_effects: []

  # ---- Participant ----
  - method: POST
    path: "/participants"
    description: "Register a participant"
    roles: [ProgramAdmin, CaseManager]
    code: 201
    input: [full_name, email, primary_language, cigarettes_per_day, "employer_program_id?"]
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants/{id}"
    description: "Get a participant (Participant may read only itself)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants/{id}/enrollments"
    description: "List a participant's enrollments (reverse FK Enrollment.participant_id)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # ---- Enrollment ----
  - method: POST
    path: "/participants/{id}/enrollments"
    description: "Create an enrollment for a participant"
    roles: [CaseManager]
    code: 201
    input: []
    output: Enrollment
    side_effects: ["status=PENDING_ASSESSMENT; nrt_courses_allotted inherited from sponsor program or DEFAULT_SELF_PAY_NRT_COURSES; nrt_courses_used=0; nrt_eligibility=ELIGIBLE"]

  - method: GET
    path: "/enrollments/{id}"
    description: "Get an enrollment (Participant may read only its own)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/activate"
    description: "Activate an enrollment (requires latest readiness PASS)"
    roles: [CaseManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["PENDING_ASSESSMENT -> ACTIVE", "ENROLLMENT milestone award when sponsored (debits budget, bumps program version)"]

  - method: POST
    path: "/enrollments/{id}/disenroll"
    description: "Disenroll an enrollment; cascades over quit-attempts, awards, calls, shipments, referrals"
    roles: [CaseManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["ACTIVE -> DISENROLLED (full cascade) or PENDING_ASSESSMENT -> DECLINED"]

  # ---- ReadinessAssessment ----
  - method: POST
    path: "/enrollments/{id}/readiness-assessments"
    description: "Submit a readiness assessment; computes readiness_score and result"
    roles: [CaseManager, Participant]
    code: 201
    input: [motivation_score, confidence_score, prior_quit_attempts]
    output: ReadinessAssessment
    side_effects: ["compute readiness_score + result", "refresh Enrollment.readiness_score / readiness_result"]

  - method: GET
    path: "/enrollments/{id}/readiness-assessments"
    description: "List an enrollment's readiness assessments (reverse FK)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: ReadinessAssessment[]
    side_effects: []

  # ---- QuitAttempt ----
  - method: POST
    path: "/enrollments/{id}/quit-attempts"
    description: "Set a quit date (create a quit attempt); enrollment must be ACTIVE"
    roles: [CaseManager, Participant]
    code: 201
    input: [quit_date, method]
    output: QuitAttempt
    side_effects: ["status=COMMITTED; attempt_number assigned", "first attempt awards QUIT_DATE_SET milestone when sponsored (debits budget, bumps program version)"]

  - method: GET
    path: "/enrollments/{id}/quit-attempts"
    description: "List an enrollment's quit attempts (reverse FK)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: QuitAttempt[]
    side_effects: []

  - method: POST
    path: "/quit-attempts/{id}/transition"
    description: "Transition a quit attempt (RELAPSED, or RELAPSED->COMMITTED recommit)"
    roles: [CaseManager]
    code: 200
    input: [to_status, "quit_date?"]
    output: QuitAttempt
    side_effects: ["state transition per QuitAttempt machine, including relapse forfeitures"]

  # ---- CoachingCall ----
  - method: POST
    path: "/enrollments/{id}/coaching-calls"
    description: "Schedule a coaching call with a coach"
    roles: [CaseManager]
    code: 201
    input: [coach_id, scheduled_start, duration_minutes]
    output: CoachingCall
    side_effects: ["status=SCHEDULED; reserves the coach time slot"]

  - method: GET
    path: "/enrollments/{id}/coaching-calls"
    description: "List an enrollment's coaching calls (reverse FK)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: CoachingCall[]
    side_effects: []

  - method: POST
    path: "/coaching-calls/{id}/transition"
    description: "Transition a coaching call (COMPLETED / NO_SHOW / CANCELED)"
    roles: [CaseManager]
    code: 200
    input: [to_status]
    output: CoachingCall
    side_effects: ["state transition per CoachingCall machine; COMPLETED may award PROTOCOL_COMPLETE"]

  # ---- NRTShipment ----
  - method: POST
    path: "/enrollments/{id}/nrt-shipments"
    description: "Request an NRT/medication shipment; computes weeks_supply/dose"
    roles: [CaseManager]
    code: 201
    input: [medication_type, course_start_date, course_end_date]
    output: NRTShipment
    side_effects: ["status=REQUESTED; compute weeks_supply + dose_mg"]

  - method: GET
    path: "/enrollments/{id}/nrt-shipments"
    description: "List an enrollment's NRT shipments (reverse FK)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: NRTShipment[]
    side_effects: []

  - method: POST
    path: "/nrt-shipments/{id}/transition"
    description: "Transition a shipment (APPROVED/SHIPPED/DELIVERED/CANCELED/RETURNED)"
    roles: [CaseManager]
    code: 200
    input: [to_status]
    output: NRTShipment
    side_effects: ["state transition per NRTShipment machine; DELIVERED/RETURNED reconcile enrollment NRT counters"]

  # ---- IncentiveAward ----
  - method: POST
    path: "/enrollments/{id}/incentive-awards"
    description: "Record a manual/discretionary incentive award (OCC-guarded on sponsor program budget)"
    roles: [CaseManager]
    code: 201
    input: [milestone_type, amount_cents, expected_employer_program_version]
    output: IncentiveAward
    side_effects: ["create IncentiveAward{status=EARNED, source=MANUAL}", "debits EmployerProgram.budget_remaining_cents by amount_cents", "increments EmployerProgram.version by 1"]

  - method: GET
    path: "/enrollments/{id}/incentive-awards"
    description: "List an enrollment's incentive awards (reverse FK)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: IncentiveAward[]
    side_effects: []

  - method: GET
    path: "/enrollments/{id}/incentive-summary"
    description: "Computed incentive summary: provisional earned, completion bonus, final payout"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: []
    output: "{ provisional_earned_cents: integer, completion_bonus_cents: integer, final_payout_cents: integer }"
    side_effects: []

  # ---- Referral ----
  - method: POST
    path: "/enrollments/{id}/referrals"
    description: "Create a provider/benefit/pharmacy referral; enrollment must be ACTIVE"
    roles: [CaseManager]
    code: 201
    input: [referral_type, target_name]
    output: Referral
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/enrollments/{id}/referrals"
    description: "List an enrollment's referrals (reverse FK)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: Referral[]
    side_effects: []

  # ---- FollowUpOutcome ----
  - method: POST
    path: "/enrollments/{id}/follow-up-outcomes"
    description: "Record a 7-day or 30-day follow-up outcome; drives quit-attempt + enrollment transitions"
    roles: [CaseManager]
    code: 201
    input: [day, abstinent]
    output: FollowUpOutcome
    side_effects: ["day=7 abstinent=true -> QuitAttempt QUIT_ACHIEVED + SEVEN_DAY award", "day=30 abstinent=true -> THIRTY_DAY award + Enrollment COMPLETED (EARNED->PAID)", "abstinent=false -> QuitAttempt RELAPSED (forfeit)"]

  - method: GET
    path: "/enrollments/{id}/follow-up-outcomes"
    description: "List an enrollment's follow-up outcomes (reverse FK)"
    roles: [ProgramAdmin, CaseManager, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: FollowUpOutcome[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Participant acting on a resource it does not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or out-of-range/invalid enum value" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "Participant id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_EMPLOYER_PROGRAM_NOT_FOUND, http: 404, condition: "EmployerProgram id does not exist (or participant is self-pay for a manual award)" }
  - { id: ERR_COACH_NOT_FOUND, http: 404, condition: "Coach id does not exist" }
  - { id: ERR_QUIT_ATTEMPT_NOT_FOUND, http: 404, condition: "QuitAttempt id does not exist" }
  - { id: ERR_COACHING_CALL_NOT_FOUND, http: 404, condition: "CoachingCall id does not exist" }
  - { id: ERR_NRT_SHIPMENT_NOT_FOUND, http: 404, condition: "NRTShipment id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the enrollment to be ACTIVE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_employer_program_version does not match current EmployerProgram.version" }
  - { id: ERR_READINESS_NOT_MET, http: 422, condition: "Activation attempted while latest readiness result is FAIL (readiness_score < READINESS_PASS_THRESHOLD)" }
  - { id: ERR_COACH_LANGUAGE_MISMATCH, http: 409, condition: "Coach.languages does not contain participant.primary_language" }
  - { id: ERR_NO_COMMITTED_QUIT_ATTEMPT, http: 409, condition: "NRT approval requires a QuitAttempt in COMMITTED or QUIT_ACHIEVED" }
  - { id: ERR_PROGRAM_CLOSED, http: 409, condition: "Manual award against a CLOSED employer program" }
  - { id: ERR_SCHEDULE_WINDOW_INVALID, http: 409, condition: "Coaching call scheduled_start is in the past or within SCHEDULE_MIN_LEAD_MINUTES of now" }
  - { id: ERR_COACH_DOUBLE_BOOKED, http: 409, condition: "Coach has an overlapping call within COACH_BUFFER_MINUTES of the requested slot" }
  - { id: ERR_NRT_COURSE_OVERLAP, http: 409, condition: "New NRT course date interval overlaps an existing non-canceled course for the enrollment" }
  - { id: ERR_FOLLOWUP_WINDOW_NOT_OPEN, http: 409, condition: "clock_now is before quit_date + day for the requested follow-up milestone" }
  - { id: ERR_NRT_EXHAUSTED, http: 422, condition: "Enrollment nrt_courses_used >= nrt_courses_allotted" }
  - { id: ERR_DUPLICATE_FOLLOWUP, http: 422, condition: "A FollowUpOutcome for this (enrollment, day) already exists" }
  - { id: ERR_PROGRAM_BUDGET_EXCEEDED, http: 402, condition: "Award amount_cents exceeds sponsor program budget_remaining_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Operates employer programs, coaches, the logical clock, and outcome reporting."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /employer-programs — create program"
      - "POST /employer-programs/{id}/close — close program"
      - "POST /coaches — create coach"
      - "GET /employer-programs/{id}/outcome-report — outcome report"
    shared_operations:
      - "GET /employer-programs/{id}"
      - "GET /employer-programs/{id}/participants"
      - "GET /coaches/{id}"
      - "GET /coaches/{id}/coaching-calls"
      - "GET /participants/{id}"
      - "GET /participants/{id}/enrollments"
      - "GET /enrollments/{id}"
      - "GET /enrollments/{id}/* list endpoints"

  - name: CaseManager
    description: "Owns the clinical enrollment workflow: enrollments, assessments, quit attempts, coaching calls, NRT shipments, incentive awards, referrals, follow-up outcomes."
    identity: opaque
    exclusive_operations:
      - "POST /participants — register participant"
      - "POST /participants/{id}/enrollments — create enrollment"
      - "POST /enrollments/{id}/activate"
      - "POST /enrollments/{id}/disenroll"
      - "POST /quit-attempts/{id}/transition"
      - "POST /enrollments/{id}/coaching-calls"
      - "POST /coaching-calls/{id}/transition"
      - "POST /enrollments/{id}/nrt-shipments"
      - "POST /nrt-shipments/{id}/transition"
      - "POST /enrollments/{id}/incentive-awards"
      - "POST /enrollments/{id}/referrals"
      - "POST /enrollments/{id}/follow-up-outcomes"
    shared_operations:
      - "POST /enrollments/{id}/readiness-assessments (shared with Participant on own enrollment)"
      - "POST /enrollments/{id}/quit-attempts (shared with Participant on own enrollment)"
      - "GET /employer-programs/{id}"
      - "GET /coaches/{id}"
      - "GET /participants/{id}"
      - "GET /participants/{id}/enrollments"
      - "GET /enrollments/{id} and all /enrollments/{id}/* list endpoints"
      - "GET /coaches/{id}/coaching-calls"

  - name: Participant
    description: "Entity-backed self-service participant: reads own resources and submits own readiness assessments and quit dates."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "GET /participants/{id} (own only)"
      - "GET /participants/{id}/enrollments (own only)"
      - "GET /enrollments/{id} (own only) and its /enrollments/{id}/* list endpoints"
      - "POST /enrollments/{id}/readiness-assessments (own only)"
      - "POST /enrollments/{id}/quit-attempts (own only)"
