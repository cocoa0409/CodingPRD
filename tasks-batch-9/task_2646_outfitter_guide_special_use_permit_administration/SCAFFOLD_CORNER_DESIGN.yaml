      - name: pinned_cross_tier_conflicts_return_the_higher_tier_error
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: suspended_permit_beats_service_day_overage
          rationale: |
            The three pinned cross-tier conflicts of §1.2 (state over fiscal, safety over constraint,
            temporal over fiscal) are exactly the error-precedence corner, and the §1.8 error-priority
            instances drive all three: a report against a SUSPENDED permit that also blows the season
            day cap, an expired first-aid certificate against a full roster, and an out-of-season
            period against an over-cap deduction. Repeating them here would duplicate their chains
            call for call.

