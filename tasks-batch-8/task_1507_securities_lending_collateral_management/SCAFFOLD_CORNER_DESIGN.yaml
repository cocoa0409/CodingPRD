# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Securities Lending & Collateral Management. Enumerates every testable claim
# of §1.1–§1.7 not already covered by §1.8. Clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: security_creation_applies_haircut_defaults
        claim_type: creation
        grounds: [entities.Security.fields.haircut_bps, entities.Security.fields.status]
        distinguishing_aspect: "Creating a GOV_BOND derives haircut_bps 200 and status LENDABLE; EQUITY derives 1000 — computed fields, not inputs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "GOV1", asset_class: "GOV_BOND", price_cents: 10000 }, as: DeskAdmin, captures: { g_hc: $.data.haircut_bps, g_st: $.data.status } }
            - { call: "POST /api/securities", payload: { symbol: "EQ1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { e_hc: $.data.haircut_bps, e_ver: $.data.version } }
          assert:
            - "${g_hc} == 200 and ${g_st} == LENDABLE"
            - "${e_hc} == 1000 and ${e_ver} == 1"

      - name: security_create_missing_required_price_returns_validation
        claim_type: required_fields
        grounds: [entities.Security.fields.price_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "price_cents is source:input with no default; omitting it yields ERR_VALIDATION (400) before anything else."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/securities", payload: { symbol: "BAD1", asset_class: "EQUITY" }, as: DeskAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: loan_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed but nonexistent loan id yields ERR_NOT_FOUND (404), not a state or auth error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/loans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DeskTrader, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: security_create_invalid_enum_returns_validation
        claim_type: type_constraints
        grounds: [entities.Security.fields.asset_class, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "asset_class outside {EQUITY, GOV_BOND, CORP_BOND} is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/securities", payload: { symbol: "CRP1", asset_class: "CRYPTO", price_cents: 100 }, as: DeskAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: position_create_rejects_computed_bucket_input
        claim_type: computed_fields
        grounds: [entities.LendablePosition.fields.quantity_available, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "quantity_available is source:computed; sending it in the create payload is rejected as an unknown field."
        test_recipe:
          setup: ["security and owner exist"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "CMP1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Cmp", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
          trigger:
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 5000, min_fee_bps: 25, quantity_available: 5000 }, as: OwnerRep, as_user_id: "${own}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION (computed field may not be supplied)"

      - name: ledger_entry_is_immutable_without_version
        claim_type: immutability
        grounds: [entities.RevenueLedgerEntry]
        distinguishing_aspect: "RevenueLedgerEntry has common_fields: false — reads expose id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["one BOOKED SECURITIES loan with one MTM run, producing a provisional ledger entry"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "IMM1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Imm", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Imm", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 50000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
          trigger:
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=FEE_ACCRUAL_PROVISIONAL", as: OpsSettler, captures: { eid: "$.data[0].id", amt: "$.data[0].amount_cents" } }
          assert:
            - "${amt} == 347 (50000 x 1000 x 25 / 10000 / 360 = 347.22 -> 347)"
            - "The fetched entry object contains keys id, created_at, loan_id, owner_id, entry_type, amount_cents, accrual_date, period, note — and no version or updated_at key"

      - name: loans_list_paginates_with_envelope_defaults
        claim_type: listing_pagination
        grounds: [response_envelope.pagination_defaults, endpoints]
        distinguishing_aspect: "With 12 proposals on one position, the default page returns 10 rows with total_count 12 and has_more true; offset=10 returns the remaining 2."
        test_recipe:
          setup: ["security, owner, borrower, position 100000 sh; twelve direct proposals of 100 sh each"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "PAG1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Pag", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Pag", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
          trigger:
            - { call: "GET /api/loans?position_id=${pos}", as: DeskTrader }
            - { call: "GET /api/loans?position_id=${pos}&offset=10", as: DeskTrader }
          assert:
            - "Page 1: response_type == array, exactly 10 Loan objects, meta-envelope pagination shows total_count == 12, has_more == true (limit default 10)"
            - "Page 2 (offset=10): exactly 2 Loan objects, has_more == false, total_count == 12"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: borrower_accept_on_countered_proposal_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Loan.PROPOSED_to_BOOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "accept exists only from PROPOSED; after the borrower counters (COUNTERED), the borrower cannot accept their own counter — the desk must confirm."
        test_recipe:
          setup: ["loan PROPOSED, borrower counters -> COUNTERED"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SM1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sm1", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sm1", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/counter", payload: { rate_bps: 20 }, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (accept is undefined from COUNTERED)"
            - "Loan.${loan}.status remains COUNTERED"

      - name: desk_confirm_on_proposed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Loan.COUNTERED_to_BOOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "confirm exists only from COUNTERED; the desk cannot confirm its own un-answered proposal — symmetric role gating of the negotiation loop."
        test_recipe:
          setup: ["loan PROPOSED (desk proposed, awaiting borrower)"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SM2", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sm2", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sm2", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
          trigger:
            - { call: "POST /api/loans/${loan}/confirm", payload: {}, as: DeskTrader, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (confirm is undefined from PROPOSED)"

      - name: settled_loan_rejects_amendment_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Loan, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SETTLED is terminal: amendments on a settled loan are rejected with ERR_INVALID_STATE even with the current version."
        test_recipe:
          setup: ["loan qty 500 BOOKED then fully returned -> SETTLED"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SM3", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sm3", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sm3", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 500, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/returns", payload: { quantity: 500 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "GET /api/loans/${loan}", as: DeskTrader, captures: { v: $.data.version } }
          trigger:
            - { call: "POST /api/loans/${loan}/amendments", payload: { expected_loan_version: "${v}", rate_bps: 30 }, as: DeskTrader, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (state precondition fires before the OCC check would pass)"

      - name: margin_call_open_escalated_cured_lifecycle
        claim_type: valid_transition
        grounds: [state_machines.MarginCall, calculations.margin_deficit_and_call_issuance, entities.Loan.fields.margin_status]
        distinguishing_aspect: "Full call lifecycle driven by price and clock: deficit appears at MTM (OPEN, due next day), escalation when the clock passes due_date, automatic cure when a top-up pledge restores coverage; amendment is blocked while CALL_OPEN."
        test_recipe:
          setup:
            - "EQUITY @ 1000c; CASH loan qty 1000 BOOKED, pledged exactly 1,020,000c"
            - "Price moved to 1100c (required becomes 1,122,000c, deficit 102,000c)"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SM4", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sm4", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sm4", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/securities/${sec}/price", payload: { price_cents: 1100 }, as: DeskAdmin }
          trigger:
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler, captures: { issued: $.data.margin_calls_issued } }
            - { call: "GET /api/margin-calls?loan_id=${loan}", as: OpsSettler, captures: { mc: "$.data[0].id", mc_due: "$.data[0].due_date", mc_amt: "$.data[0].amount_due_cents" } }
            - { call: "GET /api/loans/${loan}", as: OpsSettler, captures: { mstat1: $.data.margin_status, v_blocked: $.data.version } }
            - { call: "POST /api/loans/${loan}/amendments", payload: { expected_loan_version: "${v_blocked}", rate_bps: 5 }, as: DeskTrader, captures: { amend_err: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler, captures: { escalated: $.data.margin_calls_escalated } }
            - { call: "GET /api/margin-calls/${mc}", as: OpsSettler, captures: { mc_st2: $.data.status } }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 102000 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "GET /api/margin-calls/${mc}", as: OpsSettler, captures: { mc_st3: $.data.status } }
            - { call: "GET /api/loans/${loan}", as: OpsSettler, captures: { mstat2: $.data.margin_status } }
          assert:
            - "${issued} == 1 and ${mc_amt} == 102000 and ${mc_due} == 2026-08-02"
            - "${mstat1} == CALL_OPEN"
            - "${amend_err} == ERR_MARGIN_CALL_OUTSTANDING (amendment gated while a call is open)"
            - "${escalated} == 1 and ${mc_st2} == ESCALATED (clock 2026-08-03 > due 2026-08-02)"
            - "${mc_st3} == CURED (top-up restored posted 1,122,000 >= required 1,122,000; full-deficit cure only)"
            - "${mstat2} == CURRENT"

      - name: recall_extend_only_once
        claim_type: invalid_transition
        grounds: [state_machines.Recall.ISSUED_to_EXTENDED, "errors[ERR_RECALL_ALREADY_EXTENDED]"]
        distinguishing_aspect: "extended_once flips on the first extension; a second extend is rejected."
        test_recipe:
          setup: ["BOOKED loan qty 1000; recall issued 2026-08-01 with deadline 2026-08-03"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SM5", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sm5", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sm5", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/recalls", payload: { quantity: 1000, reason: "SALE", deadline_date: "2026-08-03" }, as: OwnerRep, as_user_id: "${own}", captures: { rec: $.data.id } }
          trigger:
            - { call: "POST /api/recalls/${rec}/extend", payload: { new_deadline_date: "2026-08-05" }, as: OwnerRep, as_user_id: "${own}", captures: { st: $.data.status, ext: $.data.extended_once, dl: $.data.deadline_date } }
            - { call: "POST /api/recalls/${rec}/extend", payload: { new_deadline_date: "2026-08-07" }, as: OwnerRep, as_user_id: "${own}", captures: { err: $.data.error_id } }
          assert:
            - "${st} == EXTENDED and ${ext} == true and ${dl} == 2026-08-05"
            - "${err} == ERR_RECALL_ALREADY_EXTENDED"

      - name: recall_cancel_rejected_after_partial_delivery
        claim_type: precondition_enforcement
        grounds: [state_machines.Recall.ISSUED_to_CANCELLED, "errors[ERR_RECALL_PARTIALLY_DELIVERED]"]
        distinguishing_aspect: "delivered_quantity > 0 locks the recall: cancel is rejected once any shares have come back."
        test_recipe:
          setup: ["BOOKED loan qty 1000; recall issued (deadline 2026-08-10); partial return of 400"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SM6", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sm6", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sm6", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
