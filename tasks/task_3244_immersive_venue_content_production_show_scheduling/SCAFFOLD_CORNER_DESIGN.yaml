scaffold_corner_design:
  # ================================================================= Entities
  - section: entities
    instances:
      - name: production_create_persists_input_fields_and_defaults
        claim_type: creation
        grounds: [entities.Production]
        distinguishing_aspect: "POST /productions with all required inputs returns 201 with status DRAFT and gain_cents 0; omitted fields are not client-settable."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venue/productions"
              payload: { title: "T1", production_type: "ORIGINAL", base_price_cents: 5000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { p1_id: $.data.id, p1_status: $.data.status, p1_gain: $.data.gain_cents, p1_ver: $.data.version }
          assert:
            - "Production.${p1_id}.status == DRAFT"
            - "Production.${p1_id}.gain_cents == 0"
            - "Production.${p1_id}.version == 1"

      - name: get_missing_production_returns_not_found
        claim_type: not_found
        grounds: ["entities.Production", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /productions/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /venue/productions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProductionDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: list_productions_paginates_with_envelope_fields
        claim_type: listing
        grounds: [entities.Production, response_envelope]
        distinguishing_aspect: "GET /productions returns data array plus limit/offset/total_count/has_more pagination fields; default limit 10."
        test_recipe:
          setup: ["Two productions exist."]
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "L1", production_type: "ORIGINAL", base_price_cents: 5000, is_haptic_capable: false }
              as: ProductionDirector
            - call: "POST /venue/productions"
              payload: { title: "L2", production_type: "RESIDENCY", base_price_cents: 6000, is_haptic_capable: false }
              as: ProductionDirector
          trigger:
            - call: "GET /venue/productions"
              payload: { limit: 1, offset: 0 }
              as: ProductionDirector
          assert:
            - "response data array length == 1"
            - "total_count == 2"
            - "has_more == true"

      - name: booking_default_seat_kind_is_standard
        claim_type: defaults
        grounds: [entities.Booking.fields.seat_kind]
        distinguishing_aspect: "Omitting seat_kind on booking creation defaults to STANDARD."
        test_recipe:
          setup:
            - "Production P ACTIVE with APPROVED asset; Show S REHEARSAL."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "DK", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { dk_p: $.data.id }
            - call: "POST /venue/productions/${dk_p}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${dk_p}", title: "DKA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { dk_a: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${dk_a}"] }
              as: ContentProducer
              captures: { dk_b: $.data.id }
            - call: "POST /venue/render-batches/${dk_b}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${dk_b}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${dk_a}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${dk_p}", show_format: "FILM", start_time: "2026-09-03T19:00:00Z", length_minutes: 90 }
              as: VenueScheduler
              captures: { dk_s: $.data.id }
            - call: "POST /venue/shows/${dk_s}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
          trigger:
            - call: "POST /venue/shows/${dk_s}/bookings"
              payload: { zone: "MAIN", seats: 1 }
              as: Guest
              captures: { dk_bk: $.data.id, dk_kind: $.data.seat_kind }
          assert:
            - "Booking.${dk_bk}.seat_kind == STANDARD"

      - name: sponsor_active_campaign_count_is_computed
        claim_type: computed_fields
        grounds: [entities.Sponsor.fields.active_campaign_count]
        distinguishing_aspect: "Client-supplied active_campaign_count on sponsor create is ignored; the field is computed and starts at 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venue/sponsors"
              payload: { name: "INITECH", brand_tier: "STANDARD" }
              as: SponsorshipManager
              captures: { is_id: $.data.id, is_count: $.data.active_campaign_count }
          assert:
            - "Sponsor.${is_id}.active_campaign_count == 0"

  # ================================================================= State machines
  - section: state_machines
    instances:
      - name: production_retire_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.Production, state_machines.Production.DRAFT_to_RETIRED]
        distinguishing_aspect: "A RETIRED production rejects further activate/deactivate/retire with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Production P in DRAFT, then RETIRED."]
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "RT", production_type: "ORIGINAL", base_price_cents: 5000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { rt_id: $.data.id }
            - call: "POST /venue/productions/${rt_id}/retire"
              payload: {}
              as: ProductionDirector
          trigger:
            - call: "POST /venue/productions/${rt_id}/activate"
              payload: {}
              as: ProductionDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: deactivate_rejected_with_confirmed_show
        claim_type: precondition_enforcement
        grounds: ["state_machines.Production.ACTIVE_to_DARK", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACTIVE -> DARK is rejected while any CONFIRMED show exists on the production."
        test_recipe:
          setup:
            - "Production P ACTIVE with APPROVED asset; Show S CONFIRMED."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "DP2", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { dp2_id: $.data.id }
            - call: "POST /venue/productions/${dp2_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${dp2_id}", title: "DA2", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { da2_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${da2_id}"] }
              as: ContentProducer
              captures: { db2_id: $.data.id }
            - call: "POST /venue/render-batches/${db2_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${db2_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${da2_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${dp2_id}", show_format: "FILM", start_time: "2026-09-03T19:00:00Z", length_minutes: 90 }
              as: VenueScheduler
              captures: { ds2_id: $.data.id }
            - call: "POST /venue/shows/${ds2_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
            - call: "GET /venue/productions/${dp2_id}"
              payload: {}
              as: ProductionDirector
              captures: { dp2_v: $.data.version }
            - call: "POST /venue/shows/${ds2_id}/confirm"
              payload: { expected_production_version: "${dp2_v}" }
              as: VenueScheduler
          trigger:
            - call: "POST /venue/productions/${dp2_id}/deactivate"
              payload: {}
              as: ProductionDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Production.${dp2_id}.status remains ACTIVE"

      - name: second_production_activation_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Production.DRAFT_to_ACTIVE", "errors[ERR_PRODUCTION_ALREADY_ACTIVE]"]
        distinguishing_aspect: "Activating a second production while another is ACTIVE returns ERR_PRODUCTION_ALREADY_ACTIVE."
        test_recipe:
          setup: ["Production A ACTIVE; Production B DRAFT."]
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "A", production_type: "ORIGINAL", base_price_cents: 5000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { pa_id: $.data.id }
            - call: "POST /venue/productions/${pa_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/productions"
              payload: { title: "B", production_type: "RESIDENCY", base_price_cents: 6000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { pb_id: $.data.id }
          trigger:
            - call: "POST /venue/productions/${pb_id}/activate"
              payload: {}
              as: ProductionDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_PRODUCTION_ALREADY_ACTIVE"
            - "Production.${pb_id}.status remains DRAFT"

      - name: qc_approve_rejected_when_asset_not_in_qc
        claim_type: invalid_transition
        grounds: ["state_machines.Asset.QC_to_APPROVED", "errors[ERR_ASSET_NOT_IN_QC]"]
        distinguishing_aspect: "QC approve on a CAPTURED asset (never rendered) returns ERR_ASSET_NOT_IN_QC."
        test_recipe:
          setup: ["Production P DRAFT; Asset A CAPTURED."]
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "QP2", production_type: "ORIGINAL", base_price_cents: 5000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { qp2_id: $.data.id }
            - call: "POST /venue/assets"
              payload: { production_id: "${qp2_id}", title: "QA2", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { qa2_id: $.data.id }
          trigger:
            - call: "POST /venue/assets/${qa2_id}/qc/approve"
              payload: {}
              as: ContentProducer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_ASSET_NOT_IN_QC"

      - name: booking_confirm_after_hold_expiry
        claim_type: precondition_enforcement
        grounds: ["state_machines.Booking.HELD_to_CONFIRMED", "errors[ERR_BOOKING_HOLD_EXPIRED]"]
        distinguishing_aspect: "Confirming a HELD booking after the logical clock passes the 15-minute hold window returns ERR_BOOKING_HOLD_EXPIRED."
        test_recipe:
          setup:
            - "Production P ACTIVE with APPROVED asset; Show S REHEARSAL; booking BK HELD at 03:00; clock advanced to 03:20 (past 15-minute hold)."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "HP", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { hp_id: $.data.id }
            - call: "POST /venue/productions/${hp_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${hp_id}", title: "HA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { ha_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${ha_id}"] }
              as: ContentProducer
              captures: { hb_id: $.data.id }
            - call: "POST /venue/render-batches/${hb_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${hb_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${ha_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${hp_id}", show_format: "FILM", start_time: "2026-09-03T19:00:00Z", length_minutes: 90 }
              as: VenueScheduler
              captures: { hs_id: $.data.id }
            - call: "POST /venue/shows/${hs_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
            - call: "POST /venue/shows/${hs_id}/bookings"
              payload: { zone: "MAIN", seats: 1 }
              as: Guest
              captures: { hbk_id: $.data.id }
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:20:00Z" }
              as: ProductionDirector
          trigger:
            - call: "POST /venue/bookings/${hbk_id}/confirm"
              payload: {}
              as: Guest
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_BOOKING_HOLD_EXPIRED"

      - name: asset_archive_only_from_approved
        claim_type: invalid_transition
        grounds: ["state_machines.Asset.APPROVED_to_ARCHIVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Archiving a CAPTURED asset returns ERR_INVALID_STATE; only APPROVED assets can be archived."
        test_recipe:
          setup: ["Production P; Asset A CAPTURED."]
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "AR", production_type: "ORIGINAL", base_price_cents: 5000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { ar_p: $.data.id }
            - call: "POST /venue/assets"
              payload: { production_id: "${ar_p}", title: "ARA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { ar_a: $.data.id }
          trigger:
            - call: "POST /venue/assets/${ar_a}/archive"
              payload: {}
              as: ContentProducer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

  # ================================================================= Calculations
  - section: calculations
    instances:
      - name: render_time_sums_base_rush_and_premium_sponsor_adjust
        claim_type: correct_result
        grounds: [calculations.calc_render_time]
        distinguishing_aspect: "RUSH batch with 2 assets while one PREMIUM-tier campaign is ACTIVE: render_minutes = 90 + 2x45 + 1x30 = 210; batch_cost_cents = 210000."
        test_recipe:
          setup:
            - "Sponsor SP PREMIUM with ACTIVE campaign covering the dispatch instant."
            - "Production P with two CAPTURED assets; batch B RUSH containing both."
          setup_api_calls:
            - call: "POST /venue/sponsors"
              payload: { name: "PREM", brand_tier: "PREMIUM" }
              as: SponsorshipManager
              captures: { rsp_id: $.data.id, rsp_v: $.data.version }
            - call: "POST /venue/campaigns"
              payload: { sponsor_id: "${rsp_id}", start_time: "2026-08-31T00:00:00Z", end_time: "2026-09-30T00:00:00Z", exterior_slots: 1, spot_seconds: 30, contracted_impressions: 5000 }
              as: SponsorshipManager
              captures: { rc_id: $.data.id }
            - call: "POST /venue/campaigns/${rc_id}/activate"
              payload: { expected_sponsor_version: "${rsp_v}" }
              as: SponsorshipManager
            - call: "POST /venue/productions"
              payload: { title: "RP2", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { rp2_id: $.data.id }
            - call: "POST /venue/assets"
              payload: { production_id: "${rp2_id}", title: "R1", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { ra1: $.data.id }
            - call: "POST /venue/assets"
              payload: { production_id: "${rp2_id}", title: "R2", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 3 }
              as: ContentProducer
              captures: { ra2: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "RUSH", asset_ids: ["${ra1}", "${ra2}"] }
              as: ContentProducer
              captures: { rbt_id: $.data.id }
          trigger:
            - call: "POST /venue/render-batches/${rbt_id}/dispatch"
              payload: {}
              as: ContentProducer
              captures: { rmin: $.data.render_minutes, rcost: $.data.batch_cost_cents }
          assert:
            - "RenderBatch.${rbt_id}.render_minutes == 210"
            - "RenderBatch.${rbt_id}.batch_cost_cents == 210000"

      - name: impressions_accrued_on_show_completion
        claim_type: correct_result
        grounds: [calculations.calc_impressions]
        distinguishing_aspect: "An ACTIVE campaign (2 slots, 30s spots) overlapping a 120-minute show accrues 2 x 120 x 30 / 60 = 120 delivered_impressions at show completion."
        test_recipe:
          setup:
            - "Production P ACTIVE with APPROVED asset; Show S CONFIRMED for 2026-09-01T10:00 + 120 min."
            - "Sponsor STANDARD campaign ACTIVE with flight covering the show window; delivered_impressions == 0."
          setup_api_calls:
            - call: "POST /venue/sponsors"
              payload: { name: "IMP", brand_tier: "STANDARD" }
              as: SponsorshipManager
              captures: { imp_sp: $.data.id, imp_spv: $.data.version }
            - call: "POST /venue/campaigns"
              payload: { sponsor_id: "${imp_sp}", start_time: "2026-08-31T00:00:00Z", end_time: "2026-09-30T00:00:00Z", exterior_slots: 2, spot_seconds: 30, contracted_impressions: 10000 }
              as: SponsorshipManager
              captures: { imp_c: $.data.id }
            - call: "POST /venue/campaigns/${imp_c}/activate"
              payload: { expected_sponsor_version: "${imp_spv}" }
              as: SponsorshipManager
            - call: "POST /venue/productions"
              payload: { title: "IP2", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { ip2_id: $.data.id }
            - call: "POST /venue/productions/${ip2_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${ip2_id}", title: "IA2", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { ia2: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${ia2}"] }
              as: ContentProducer
              captures: { ib2: $.data.id }
            - call: "POST /venue/render-batches/${ib2}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${ib2}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${ia2}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${ip2_id}", show_format: "FILM", start_time: "2026-09-01T10:00:00Z", length_minutes: 120 }
              as: VenueScheduler
              captures: { is2: $.data.id }
            - call: "POST /venue/shows/${is2}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
            - call: "GET /venue/productions/${ip2_id}"
              payload: {}
              as: ProductionDirector
              captures: { ip2_v: $.data.version }
            - call: "POST /venue/shows/${is2}/confirm"
              payload: { expected_production_version: "${ip2_v}" }
              as: VenueScheduler
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:00:00Z" }
              as: ProductionDirector
          trigger:
            - call: "POST /venue/shows/${is2}/complete"
              payload: {}
              as: VenueScheduler
            - call: "GET /venue/campaigns/${imp_c}"
              payload: {}
              as: SponsorshipManager
              captures: { imp_del: $.data.delivered_impressions }
          assert:
            - "Campaign.${imp_c}.delivered_impressions == 120"

      - name: campaign_under_delivery_make_good_credits
        claim_type: correct_result
        grounds: [calculations.calc_impressions]
        distinguishing_aspect: "Campaign completing with contracted 10000 and delivered 0 yields under_delivery 10000 and make_good_credits 20000 when the clock passes end_time."
        test_recipe:
          setup: ["Sponsor with ACTIVE campaign (contracted 10000, no shows completed during flight); clock advanced past end_time."]
          setup_api_calls:
            - call: "POST /venue/sponsors"
              payload: { name: "UD", brand_tier: "STANDARD" }
              as: SponsorshipManager
              captures: { ud_sp: $.data.id, ud_spv: $.data.version }
            - call: "POST /venue/campaigns"
              payload: { sponsor_id: "${ud_sp}", start_time: "2026-08-31T00:00:00Z", end_time: "2026-09-02T00:00:00Z", exterior_slots: 1, spot_seconds: 30, contracted_impressions: 10000 }
              as: SponsorshipManager
              captures: { ud_c: $.data.id }
            - call: "POST /venue/campaigns/${ud_c}/activate"
              payload: { expected_sponsor_version: "${ud_spv}" }
              as: SponsorshipManager
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T01:00:00Z" }
              as: ProductionDirector
          trigger:
            - call: "GET /venue/campaigns/${ud_c}"
              payload: {}
              as: SponsorshipManager
              captures: { ud_status: $.data.status, ud_under: $.data.under_delivery, ud_mg: $.data.make_good_credits }
          assert:
            - "Campaign.${ud_c}.status == COMPLETED"
            - "Campaign.${ud_c}.under_delivery == 10000"
            - "Campaign.${ud_c}.make_good_credits == 20000"

  # ================================================================= Validations
  - section: validations
    instances:
      - name: apex_wheelchair_booking_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ACCESSIBILITY_ZONE]"]
        distinguishing_aspect: "WHEELCHAIR seat_kind in APEX zone is rejected with ERR_ACCESSIBILITY_ZONE; MAIN wheelchair booking succeeds."
        test_recipe:
          setup:
            - "Production P ACTIVE with APPROVED asset; Show S REHEARSAL."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "AX", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { ax_p: $.data.id }
            - call: "POST /venue/productions/${ax_p}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${ax_p}", title: "AXA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { ax_a: $.data.id }
