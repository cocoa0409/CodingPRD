              as: PlantAdmin
          trigger:
            - call: POST /submittal-drawings/00000000-0000-4000-8000-0000000000bb/submit
              payload: {}
              as: DesignEngineer
          assert:
            - "HTTP 404 with data.error_id == \"ERR_DRAWING_NOT_FOUND\"."
            - "response_type == \"error\"."

      - name: release_quarantine_on_active_component_returns_invalid_state_transition
        claim_type: conditional_action
        grounds:
          - endpoints[release_component_quarantine]
          - state_machines.LongLeadComponent.transitions.QUARANTINED_to_ACTIVE
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "release-quarantine is only meaningful from QUARANTINED; invoking it on an ACTIVE component must fail with ERR_INVALID_STATE_TRANSITION (409) and leave quarantine_reason null - it is not an idempotent no-op."
        test_recipe:
