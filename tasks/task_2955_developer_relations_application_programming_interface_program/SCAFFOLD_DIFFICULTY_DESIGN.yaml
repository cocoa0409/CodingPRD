  - rule_id: compensating_invariant
    instances:
      - name: suspend_reinstate_conserves_sustained_rpm_pool
        grounds:
          - state_machines.QuotaAssignment.ACTIVE_to_SUSPENDED
          - state_machines.QuotaAssignment.SUSPENDED_to_ACTIVE
          - entities.ApiProduct.fields.allocated_sustained_rpm
          - entities.ApiProduct.fields.available_monthly_calls
          - validations.priority_12_assignment_not_active
        distinguishing_aspect: |
          A round trip that must leave both product ledgers byte-identical to their pre-suspension
          values: allocated_sustained_rpm 3000 -> 0 -> 3000 and allocated_monthly_calls 500000 -> 0
          -> 500000, with the assignment's own sustained_rpm, burst_rpm and burst_credit_balance
          never mutated by either move. The refused second suspend proves the release is not applied
          twice, which is the failure mode a naive decrement/increment pair produces.
        test_recipe:
          setup:
            - "the canonical ACTIVE PARTNER entitlement on ApiProduct P1 holds sustained_rpm 3000, burst_rpm 9000, burst_credit_balance 90000 and monthly_call_allowance 500000"
            - "P1's pools are 20000 sustained rpm and 50000000 monthly calls, so available reads 17000 / 49500000 before the round trip"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
