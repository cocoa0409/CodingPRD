              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_cab_id}", task_name: "Cabinet install", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z", driving_allowance_item_id: "${ai_cab_id}" }
              as: ProjectManager
