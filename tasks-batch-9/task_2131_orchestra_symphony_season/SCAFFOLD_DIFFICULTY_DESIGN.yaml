              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall", changeover_buffer_minutes: 60 }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1, min_renewal_priority_score: 480 }
              as: ArtisticAdmin
              captures: { sec_orch: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 105 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${s1}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${s1}/advance"
              payload: { target_status: "SINGLE_ON_SALE" }
              as: ArtisticAdmin
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Noel Vance", email: "noel@patron.test" }
              as: BoxOfficeAgent
              captures: { pN: "$.data.id" }
            - call: "GET /orchestra/concerts/${c1}"
              payload: {}
              as: BoxOfficeAgent
              captures: { c1_v: "$.data.version" }
            - call: "POST /orchestra/ticket-orders"
              payload: { concert_id: "${c1}", patron_id: "${pN}", seat_section_id: "${sec_orch}", seat_count: 2, expected_concert_version: "${c1_v}" }
              as: BoxOfficeAgent
              captures: { o1: "$.data.id" }
            - call: "POST /orchestra/ticket-orders/${o1}/pay"
              payload: { use_credit: false }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /orchestra/concerts/${c1}/cancel"
              payload: { reason: "orchestra strike" }
              as: ArtisticAdmin
          assert:
            - "TicketOrder.${o1}.quoted_unit_price_cents == 8100"
            - "TicketOrder.${o1}.status == REFUNDED"
            - "TicketOrder.${o1}.amount_paid_cents == 16200"
            - "TicketOrder.${o1}.credit_applied_cents == 0"
            - "Patron.${pN}.credit_balance_cents == 16200"
            - "Patron.${pN}.lifetime_cash_in_cents == 16200"
            - "Patron.${pN}.lifetime_cash_in_cents == Patron.${pN}.credit_balance_cents + 0  (no PAID orders remain)"
            - "Concert.${c1}.section_inventory[seat_section_id=${sec_orch}].sold_count == 0"
            - "Concert.${c1}.section_inventory[seat_section_id=${sec_orch}].available_count == 100"
