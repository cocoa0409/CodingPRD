      - name: inspection_windows_closed_interval_with_cooldown_exempt_reinspection
        grounds:
          - validations.priority_67.ERR_INSPECTION_WINDOW_OVERLAP
          - validations.priority_68.ERR_INSPECTION_WINDOW_COOLDOWN
          - validations.priority_74.ERR_REINSPECTION_PARENT_REQUIRED
          - entities.Inspection.fields.window_start_at
          - entities.Inspection.fields.window_end_at
          - endpoints.POST_/cosmetology/inspections
        distinguishing_aspect: |
          A different resource (an Establishment's inspection calendar) with the OPPOSITE interval
          semantics to the booth-rental instance: CLOSED [window_start_at, window_end_at], so
          touching endpoints collide here where they were legal there, plus a symmetric 24-hour
          buffer that ROUTINE windows must clear and REINSPECTION windows are exempt from. The same
          requested window is therefore refused as ROUTINE and accepted as REINSPECTION, while a
          REINSPECTION that merely touches an existing window is still refused - proving the
          exemption covers the buffer only, not the overlap check.
        test_recipe:
          setup:
            - "One MAJOR violation code IMP-200 (base_points 6.0) is published."
            - "One establishment 'Harbor Salon' has a FINALIZED ROUTINE inspection over 2026-08-02T09:00:00Z-17:00:00Z with a single IMP-200 finding observed once and not corrected on site, so its final_adjusted_score is 15.00 and final_outcome is CONDITIONAL_PASS - a legal reinspection parent, and terminal so it does not itself occupy the calendar."
            - "A second ROUTINE inspection over 2026-08-10T09:00:00Z-17:00:00Z is SCHEDULED, so it is non-terminal and does occupy the calendar."
