            - { call: "POST /pathogen-samples/${sample_id}/report-result", payload: { result: "NEGATIVE" }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /production-days/${day_id}/finished-lots", payload: { source_lot_id: "${lot_id}", label_approval_id: "${label_id}", units_produced: 10, unit_weight_lbs: 5.0, shelf_life_days: 10 }, as: ProductionManager, captures: { fl_id: $.data.id } }
