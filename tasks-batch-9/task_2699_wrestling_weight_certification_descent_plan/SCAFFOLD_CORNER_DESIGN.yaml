            - "GET /wrestlers/${wrestler_c} echoes minimum_certified_weight_lbs 113.0, min_weight_class_lbs 113, lean_body_weight_lbs 105.1 and alpha_weight_lbs 121.0"

      - name: audit_scoring_input_set_filtered_by_min_sample_count
        claim_type: input_set_filtering
        grounds:
          - calculations.audit_discrepancy_score.input_set
          - entities.Season.fields.audit_min_sample_count
