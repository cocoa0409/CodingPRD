# =============================================================================
# Task 0487 — Guardianship & Conservatorship (Expert)
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth probe: walks references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1–§1.7. Corners already exercised by a §1.8 difficulty instance are emitted
# as excluded_because: stubs (no test_recipe); the rest carry full structured
# recipes whose setup_api_calls drive empty-DB -> precondition using only §1.5.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_protected_person_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.ProtectedPerson.fields.full_name
          - entities.ProtectedPerson.fields.capacity_status
        distinguishing_aspect: "POST /gc/protected-persons with all required fields -> 201; capacity_status defaults PRESUMED_COMPETENT, active_case_id null, id/created_at server-minted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "New Ward", date_of_birth: "1950-01-01", annual_income_cents: 100000, liquid_estate_cents: 200000 }
              as: CourtClerk
              captures: { pid: $.data.id, cap: $.data.capacity_status }
          assert:
            - "response.status == 201"
            - "ProtectedPerson.${pid}.capacity_status == PRESUMED_COMPETENT"
            - "ProtectedPerson.${pid}.active_case_id == null"

      - name: get_case_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.GuardianshipCase, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /gc/cases/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /gc/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_case_missing_case_type_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.GuardianshipCase.fields.case_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /gc/cases without case_type -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a protected person exists"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "P", date_of_birth: "1950-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}" }
              as: CourtClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_case_bad_enum_case_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.GuardianshipCase.fields.case_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /gc/cases with case_type=FOO (not in GUARDIANSHIP|CONSERVATORSHIP|PLENARY) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a protected person exists"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "P", date_of_birth: "1950-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "FOO" }
              as: CourtClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_case_bad_person_fk_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: [entities.GuardianshipCase.fields.protected_person_id, "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /gc/cases with a non-existent protected_person_id -> ERR_REFERENCE_NOT_FOUND (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /gc/cases"
              payload: { protected_person_id: "00000000-0000-4000-8000-000000000000", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: list_protected_persons_paginated_envelope
        claim_type: Listing
        grounds: [entities.ProtectedPerson]
        distinguishing_aspect: "GET /gc/protected-persons returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["two protected persons exist"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "P1", date_of_birth: "1950-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
            - call: "POST /gc/protected-persons"
              payload: { full_name: "P2", date_of_birth: "1951-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
          trigger:
            - call: "GET /gc/protected-persons?limit=1&offset=0"
              payload: {}
              as: CourtClerk
          assert:
            - "response.response_type == array"
            - "meta total_count >= 2 and has_more == true"

      - name: computed_total_estate_cents_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Inventory.fields.total_estate_cents]
        distinguishing_aspect: "Inventory.total_estate_cents == real+liquid+tangible (3,000,000) regardless of any client-supplied value; computed from the three input fields."
        test_recipe:
          setup: ["a CONSERVATORSHIP case ACTIVE with a qualified fiduciary"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Inv P", date_of_birth: "1949-01-01", annual_income_cents: 0, liquid_estate_cents: 8000000 }
              as: CourtClerk
              captures: { pid: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "F", fiduciary_kind: "PROFESSIONAL" }
              as: CourtClerk
              captures: { fid: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "CONSERVATORSHIP" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${cid}", nominated_fiduciary_id: "${fid}", requested_authority: "ESTATE", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet: $.data.id }
            - call: "POST /gc/petitions/${pet}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet}", finding: "INCAPACITATED", recommended_scope: "ESTATE" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { ev: $.data.id }
            - call: "POST /gc/evaluations/${ev}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
            - call: "POST /gc/petitions/${pet}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments"
              payload: { case_id: "${cid}", fiduciary_id: "${fid}" }
              as: Judge
              as_user_id: "judge-1"
              captures: { apt: $.data.id }
            - call: "GET /gc/bonds?appointment_id=${apt}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { bd: "$.data[0].id" }
            - call: "POST /gc/bonds/${bd}/post"
              payload: { posted_amount_cents: 10000000, surety_name: "Acme" }
              as: Fiduciary
              as_user_id: "${fid}"
            - call: "POST /gc/bonds/${bd}/approve"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments/${apt}/qualify"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
          trigger:
            - call: "POST /gc/inventories"
              payload: { case_id: "${cid}", real_property_cents: 1000000, liquid_assets_cents: 1500000, tangible_property_cents: 500000 }
              as: Fiduciary
              as_user_id: "${fid}"
              captures: { inv: $.data.id, tot: $.data.total_estate_cents }
          assert:
            - "Inventory.${inv}.total_estate_cents == 3000000"

      - name: person_one_active_case_uniqueness
        claim_type: Type Constraints
        grounds: [entities.ProtectedPerson.fields.active_case_id, "validations[priority=10]", "errors[ERR_PERSON_HAS_ACTIVE_CASE]"]
        distinguishing_aspect: "Opening a second case for a person whose active_case_id is already set -> ERR_PERSON_HAS_ACTIVE_CASE (409)."
        test_recipe:
          setup: ["a person with one open (DRAFT) case"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Uniq P", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { pid: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "CONSERVATORSHIP" }
              as: CourtClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_PERSON_HAS_ACTIVE_CASE"

      - name: requires_bond_true_for_conservatorship
        claim_type: Computed Fields
        grounds: [entities.GuardianshipCase.fields.requires_bond, entities.GuardianshipCase.fields.case_type]
        distinguishing_aspect: "A CONSERVATORSHIP case has requires_bond == true while a GUARDIANSHIP case has requires_bond == false, computed from case_type."
        test_recipe:
          setup: ["two persons exist"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Cb1", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { p1: $.data.id }
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Cb2", date_of_birth: "1948-02-02", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${p1}", case_type: "CONSERVATORSHIP" }
              as: CourtClerk
              captures: { c1: $.data.id, rb1: $.data.requires_bond }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${p2}", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { c2: $.data.id, rb2: $.data.requires_bond }
          assert:
            - "GuardianshipCase.${c1}.requires_bond == true"
            - "GuardianshipCase.${c2}.requires_bond == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_state_case_is_draft
        claim_type: Initial State
        grounds: [state_machines.GuardianshipCase, entities.GuardianshipCase.fields.status]
        distinguishing_aspect: "A freshly created case has status == DRAFT and protection_posture == GREEN."
        test_recipe:
          setup: ["a person exists"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Is", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { cid: $.data.id, st: $.data.status, posture: $.data.protection_posture }
          assert:
            - "GuardianshipCase.${cid}.status == DRAFT"
            - "GuardianshipCase.${cid}.protection_posture == GREEN"

      - name: invalid_transition_order_evaluation_from_filed
        claim_type: Invalid Transitions
        grounds: [state_machines.Petition.PROBABLE_CAUSE_to_EVALUATION_ORDERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "order-evaluation on a petition still in FILED (probable cause not found) -> ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["a petition in FILED status"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Iv", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { pid: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "F", fiduciary_kind: "FAMILY" }
              as: CourtClerk
              captures: { fid: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${cid}", nominated_fiduciary_id: "${fid}", requested_authority: "PERSON", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet: $.data.id }
          trigger:
            - call: "POST /gc/petitions/${pet}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: terminal_state_lockdown_dismissed_petition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Petition, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DISMISSED petition is terminal: a subsequent grant -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a petition DISMISSED from PROBABLE_CAUSE"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Tl", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { pid: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "F", fiduciary_kind: "FAMILY" }
              as: CourtClerk
              captures: { fid: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${cid}", nominated_fiduciary_id: "${fid}", requested_authority: "PERSON", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet: $.data.id }
            - call: "POST /gc/petitions/${pet}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet}/dismiss"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
          trigger:
            - call: "POST /gc/petitions/${pet}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: guarded_grant_blocked_by_competent_finding
        claim_type: guarded transitions
        grounds: [state_machines.Petition.READY_FOR_HEARING_to_GRANTED, "validations[priority=12]", "errors[ERR_EVALUATION_FINDS_COMPETENT]"]
        distinguishing_aspect: "grant on a READY_FOR_HEARING petition whose filed evaluation finding == COMPETENT -> ERR_EVALUATION_FINDS_COMPETENT (409)."
        test_recipe:
          setup: ["a petition READY_FOR_HEARING whose evaluation finding is COMPETENT"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Cmp", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { pid: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "F", fiduciary_kind: "FAMILY" }
              as: CourtClerk
              captures: { fid: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${cid}", nominated_fiduciary_id: "${fid}", requested_authority: "PERSON", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet: $.data.id }
            - call: "POST /gc/petitions/${pet}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet}", finding: "COMPETENT", recommended_scope: "NONE" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { ev: $.data.id }
            - call: "POST /gc/evaluations/${ev}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /gc/petitions/${pet}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_EVALUATION_FINDS_COMPETENT"

      - name: scope_exceeds_recommendation_on_grant
        claim_type: guarded transitions
        grounds: [state_machines.Petition.READY_FOR_HEARING_to_GRANTED, "validations[priority=13]", "errors[ERR_SCOPE_EXCEEDS_RECOMMENDATION]"]
        distinguishing_aspect: "grant where requested_authority BOTH exceeds evaluation recommended_scope PERSON -> ERR_SCOPE_EXCEEDS_RECOMMENDATION (409)."
        test_recipe:
          setup: ["a PLENARY case petition requesting BOTH, with a filed evaluation recommending only PERSON"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Scope", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 8000000 }
              as: CourtClerk
              captures: { pid: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "F", fiduciary_kind: "PROFESSIONAL" }
              as: CourtClerk
              captures: { fid: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "PLENARY" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${cid}", nominated_fiduciary_id: "${fid}", requested_authority: "BOTH", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet: $.data.id }
            - call: "POST /gc/petitions/${pet}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet}", finding: "PARTIALLY_INCAPACITATED", recommended_scope: "PERSON" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { ev: $.data.id }
            - call: "POST /gc/evaluations/${ev}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /gc/petitions/${pet}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_SCOPE_EXCEEDS_RECOMMENDATION"

      - name: evaluation_file_before_ordered_returns_not_ordered
        claim_type: Precondition Enforcement
        grounds: [state_machines.CapacityEvaluation.DRAFT_to_FILED, "validations[priority=11]", "errors[ERR_EVALUATION_NOT_ORDERED]"]
        distinguishing_aspect: "Filing an evaluation while the parent petition is only PROBABLE_CAUSE (not EVALUATION_ORDERED) -> ERR_EVALUATION_NOT_ORDERED (409). Note: an evaluation can be drafted any time but only filed once ordered."
        test_recipe:
          setup: ["a petition at PROBABLE_CAUSE with a DRAFT evaluation"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Eo", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 0 }
              as: CourtClerk
              captures: { pid: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "F", fiduciary_kind: "FAMILY" }
              as: CourtClerk
              captures: { fid: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${cid}", nominated_fiduciary_id: "${fid}", requested_authority: "PERSON", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet: $.data.id }
            - call: "POST /gc/petitions/${pet}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet}", finding: "INCAPACITATED", recommended_scope: "PERSON" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /gc/evaluations/${ev}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_EVALUATION_NOT_ORDERED"

      - name: suspend_freezes_account_then_disburse_blocked
        claim_type: Cross-entity
        grounds: [state_machines.Appointment.ACTIVE_to_SUSPENDED, entities.RestrictedAccount.fields.status, "errors[ERR_ACCOUNT_FROZEN]"]
        distinguishing_aspect: "Suspending the fiduciary FROZENs the restricted account; a subsequent disburse of an APPROVED expenditure -> ERR_ACCOUNT_FROZEN (409)."
        test_recipe:
          setup: ["CONSERVATORSHIP case ACTIVE, account funded 5,000,000, APPROVED budget care cap 5,000,000, one CARE expenditure 500,000 APPROVED (auto), then fiduciary suspended"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Frz", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 8000000 }
              as: CourtClerk
              captures: { pid: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "F", fiduciary_kind: "PROFESSIONAL" }
              as: CourtClerk
              captures: { fid: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "CONSERVATORSHIP" }
