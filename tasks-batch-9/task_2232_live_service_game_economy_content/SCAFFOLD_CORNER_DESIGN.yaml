              captures: { season_v1: $.data.version }
            - call: "POST /offers/${short_id}/publish"
              payload: { expected_season_version: "${season_v1}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "LONG_PACK", price_tier: "T1", list_price_minor: 900, line_items: [{ sku: "LONG_COINS", base_price_minor: 900, declared_value_minor: 1200, granted_currency_code: "SOFT_COIN", granted_amount_minor: 1200 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { long_id: $.data.id }
            - call: "POST /offers/${long_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers/${long_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
