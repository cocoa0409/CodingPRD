scaffold_corner_design:

  # =======================================================================
  # Section 1 — Entities
  # =======================================================================
  - section: entities
    instances:
      - name: corner_create_party_returns_201_with_server_minted_common_fields
        claim_type: Creation
        grounds: ["entities.Party", "endpoints.POST /sale-barn/parties"]
        distinguishing_aspect: "POST /sale-barn/parties with every required field returns 201, a server-minted UUID id with no type prefix, created_at, updated_at, version == 1 and status defaulted to ACTIVE."
        test_recipe:
          setup: ["Empty database; logical clock at its 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
          trigger:
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { p_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Party.${p_id}.status == ACTIVE"
            - "Party.${p_id}.version == 1"
            - "Party.${p_id}.legal_name == Rocking R Ranch"
            - "the response id is a bare UUID with no type prefix"
            - "the envelope carries meta.api_request_id and meta.api_request_timestamp and response_type == object"

      - name: corner_get_sale_day_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds: ["entities.SaleDay", "endpoints.GET /sale-barn/sale-days/{id}"]
        distinguishing_aspect: "GET /sale-barn/sale-days/{id} echoes the stored sale day, with SCHEDULED status, next_ring_order 10 and reopen_count 0."
        test_recipe:
          setup: ["One sale day created 2026-06-01 at BARN-1 in NE."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sd_id: "$.data.id" }
          trigger:
            - call: "GET /sale-barn/sale-days/${sd_id}"
              payload: {}
              as: SettlementClerk
          assert:
            - "HTTP status == 200"
            - "SaleDay.${sd_id}.status == SCHEDULED"
            - "SaleDay.${sd_id}.next_ring_order == 10"
            - "SaleDay.${sd_id}.reopen_count == 0"
            - "SaleDay.${sd_id}.barn_state_code == NE"

      - name: corner_list_lots_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["entities.Lot", "endpoints.GET /sale-barn/lots", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /sale-barn/lots?consignment_id=X&limit=2&offset=0 returns 2 of 3 lots with total_count 3 and has_more true; offset 2 returns the last one with has_more false."
        test_recipe:
          setup: ["One checked-in consignment of 17 head sorted into three lots of 10, 2 and 5 head."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sd_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sd_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 17, weigh_basis: "PENCIL_SHRINK" }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 2, livestock_class: "CALF", bid_basis: "PER_HEAD", opening_bid: 40.00, reserve_price: 45.00 }
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 5, livestock_class: "FEEDER_HEIFER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
          trigger:
            - call: "GET /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", limit: 2, offset: 0 }
              as: YardOperator
            - call: "GET /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", limit: 2, offset: 2 }
              as: YardOperator
          assert:
            - "The first trigger call returns response_type == array with 2 elements, total_count == 3 and has_more == true"
            - "The second trigger call returns 1 element, total_count == 3 and has_more == false"

      - name: corner_get_lot_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET /sale-barn/lots/{id} with a syntactically valid but unknown UUID returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
          trigger:
            - call: "GET /sale-barn/lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: YardOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_RESOURCE_NOT_FOUND"
            - "response_type == error"

      - name: corner_create_consignment_missing_weigh_basis_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=4]", "endpoints.POST /sale-barn/consignments"]
        distinguishing_aspect: "Omitting the required weigh_basis field on POST /sale-barn/consignments returns 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup: ["One ACTIVE consignor party and one sale day in CHECK_IN_OPEN."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sd_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
          trigger:
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sd_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /sale-barn/consignments?sale_day_id=${sd_id} returns total_count == 0"

      - name: corner_consignment_optional_fields_take_declared_defaults
        claim_type: Defaults
        grounds: ["entities.Consignment.fields.pencil_shrink_pct", "entities.Consignment.fields.yardage_basis", "entities.Consignment.fields.commission_basis", "entities.Consignment.fields.ration_type", "entities.Consignment.fields.hold_until_funds"]
        distinguishing_aspect: "Creating a consignment with only the five required fields defaults pencil_shrink_pct 0.03, yardage_basis PER_HEAD_DAY, commission_basis TIERED_VALUE, ration_type NONE, days_on_feed 0, advances_amount 0 and hold_until_funds false."
        test_recipe:
          setup: ["One ACTIVE consignor party and one sale day in CHECK_IN_OPEN."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sd_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
          trigger:
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sd_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK" }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
          assert:
            - "Consignment.${cons_id}.pencil_shrink_pct == 0.03"
            - "Consignment.${cons_id}.yardage_basis == PER_HEAD_DAY"
            - "Consignment.${cons_id}.commission_basis == TIERED_VALUE"
            - "Consignment.${cons_id}.ration_type == NONE"
            - "Consignment.${cons_id}.days_on_feed == 0"
            - "Consignment.${cons_id}.advances_amount == 0"
            - "Consignment.${cons_id}.hold_until_funds == false"
            - "Consignment.${cons_id}.status == INTAKE"
            - "Consignment.${cons_id}.head_unassigned == 10 and head_in_lots == 0 and head_balance_ok == true"

      - name: corner_lot_weight_fields_are_computed_and_null_before_capture
        claim_type: Computed Fields
        grounds: ["entities.Lot.fields.settle_weight_lb", "entities.Lot.fields.weight_class", "calculations.lot_avg_weight"]
        distinguishing_aspect: "A freshly created lot reports settle_weight_lb null, avg_weight_lb null and weight_class NONE; these are computed from the governing weigh ticket and can never be supplied by the client, since POST /sale-barn/lots declares no weight input."
        test_recipe:
          setup: ["One checked-in consignment of 10 head."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sd_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sd_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK" }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_id}/check-in"
              payload: {}
              as: YardOperator
          trigger:
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_id: "$.data.id" }
          assert:
            - "Lot.${lot_id}.settle_weight_lb is null"
            - "Lot.${lot_id}.avg_weight_lb is null"
            - "Lot.${lot_id}.weight_class == NONE"
            - "Lot.${lot_id}.sale_status == DRAFT and custody_status == BARN"
            - "Lot.${lot_id}.sale_day_id == ${sd_id} (copied from the parent consignment, not supplied)"
            - "Lot.${lot_id}.rering_count == 0 and quarantine_hold == false"
            - "Consignment.${cons_id}.head_unassigned == 0 and status == SORTED"

      - name: corner_create_lot_with_invalid_livestock_class_returns_invalid_enum
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_ENUM]", "validations[priority=5]", "entities.Lot.fields.livestock_class"]
        distinguishing_aspect: "livestock_class is on rung 5's closed iff-list, so a value outside {FEEDER_STEER, FEEDER_HEIFER, BREEDING_BULL, BREEDING_FEMALE, CULL_COW, CALF} returns 400 ERR_INVALID_ENUM, not ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One checked-in consignment of 10 head."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sd_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sd_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK" }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_id}/check-in"
              payload: {}
              as: YardOperator
          trigger:
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "WAGYU_PRIME", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_ENUM"
            - "GET /sale-barn/lots?consignment_id=${cons_id} returns total_count == 0"

      - name: corner_create_consignment_with_zero_head_received_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=6]", "entities.Consignment.fields.head_received"]
        distinguishing_aspect: "head_received carries the constraint integer >= 1, so 0 is refused by rung 6 with ERR_INVALID_REQUEST — a numeric-range violation, distinct from the enum route at rung 5."
        test_recipe:
          setup: ["One ACTIVE consignor party and one sale day in CHECK_IN_OPEN."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sd_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
          trigger:
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sd_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 0, weigh_basis: "PENCIL_SHRINK" }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: corner_create_lot_with_unknown_consignment_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_REFERENCE_NOT_FOUND]", "validations[priority=7]"]
        distinguishing_aspect: "A body-supplied FK that does not resolve returns 404 ERR_REFERENCE_NOT_FOUND (rung 7), distinct from a path id that does not resolve (rung 3, ERR_RESOURCE_NOT_FOUND)."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
          trigger:
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "00000000-0000-4000-8000-000000000001", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_REFERENCE_NOT_FOUND"

      - name: corner_charge_line_is_append_only_with_no_version_field
        claim_type: Immutability
        grounds: ["entities.ChargeLine", "endpoints.GET /sale-barn/charge-lines"]
        distinguishing_aspect: "ChargeLine declares common_fields false, so its rows carry only id and created_at — no updated_at and no version — and §1.5 exposes no create, update or delete endpoint for them; they only ever appear through the close cascade."
        test_recipe:
          setup: ["A closed sale day with one settled consignment (reuse the five-hop close chain: one 15-head consignment, a 10-head lot sold at 182.50 $/cwt, closed 2026-06-02T10:00:00Z)."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sd_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sd_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK" }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "RINGING" }
              as: BarnAdmin
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "BIDDING_CLOSED" }
              as: BarnAdmin
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/sale-days/${sd_id}/close"
              payload: {}
              as: SettlementClerk
          trigger:
            - call: "GET /sale-barn/charge-lines"
              payload: { sale_day_id: "${sd_id}" }
              as: SettlementClerk
              captures: { cl_id: "$.data[0].id" }
            - call: "GET /sale-barn/charge-lines/${cl_id}"
              payload: {}
              as: SettlementClerk
          assert:
            - "GET /sale-barn/charge-lines?sale_day_id=${sd_id} returns total_count == 7 (the seven seller-side lines; no buyer invoice exists because nothing sold)"
            - "each returned ChargeLine carries id and created_at and carries neither updated_at nor version"
            - "the YARDAGE line has side == SELLER, revenue_class == BARN_REVENUE, head == 10, days == 1 and unit_rate == 1.75"
            - "the CHECKOFF_STATE line has revenue_class == STATUTORY_REMITTANCE and amount == 0.00"

  # =======================================================================
  # Section 2 — State Machines
  # =======================================================================
  - section: state_machines
    instances:
      - name: corner_enter_ring_from_draft_lot_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Lot.READY_to_IN_RING", "validations[priority=16]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "READY is the only from-state for enter-ring, so calling it on a DRAFT lot returns 409 ERR_INVALID_STATE and leaves sale_status DRAFT."
        test_recipe:
          setup: ["Sale day in RINGING; one checked-in consignment of 10 head with one DRAFT lot that was never penned."]
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sd_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sd_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
