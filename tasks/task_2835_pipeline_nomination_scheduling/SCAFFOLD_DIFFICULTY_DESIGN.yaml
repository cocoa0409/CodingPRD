      - name: per_ticket_rounding_before_summation_pins_tariff_charge
        grounds:
          - calculations.tariff_charge
          - calculations.imbalance_charge
          - entities.Tariff.fields.tier1_min_bbl
          - entities.Tariff.fields.tier1_rate_usd_per_bbl
          - entities.ImbalanceSettlement.fields.tariff_charge_usd
        distinguishing_aspect: |
          Mode (b) — the result is decided by rounding order and tier selection, not by branching:
          the two billable lines are 29901 x 1.705 = 50981.205 and 26001 x 1.705 = 44331.705, so
          rounding each line half-up before summing yields exactly 95312.92 USD while summing the
          unrounded products and rounding once yields 95312.91 USD; both lines also sit above
          tier1_min_bbl (25000) and below tier2_min_bbl (45000), pinning the 1.705 rate.
