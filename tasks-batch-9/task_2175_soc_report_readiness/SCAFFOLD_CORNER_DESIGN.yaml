              as_user_id: "aud-1"
            - call: "POST /soc/system-descriptions/${sd}/lock-boundary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "U-01", title: "Unmapped control", frequency: "MONTHLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 10 }
