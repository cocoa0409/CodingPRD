              as: SlatePlanner
              captures: { t2: $.data.id }
            - call: "POST /slate/titles/${t2}/approve"
              payload: { expected_season_version: "${sv2}" }
              as: SlatePlanner
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage A", blackout_windows: [] }
              as: ProductionManager
              captures: { loc_a: $.data.id }
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage B", blackout_windows: [] }
              as: ProductionManager
              captures: { loc_b: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t1}", location_id: "${loc_a}", shoot_start: "2027-03-01T00:00:00Z", shoot_end: "2027-03-21T00:00:00Z", shoot_days: 20 }
              as: ProductionManager
          trigger:
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t2}", location_id: "${loc_b}", shoot_start: "2027-04-01T00:00:00Z", shoot_end: "2027-04-11T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { slot_ok: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t2}", location_id: "${loc_b}", shoot_start: "2027-05-01T00:00:00Z", shoot_end: "2027-05-02T00:00:00Z", shoot_days: 1 }
              as: ProductionManager
              captures: { err: $.data.error_id }
          assert:
