            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Inv One", email: "i1@uni.edu", department_id: "${dept_id}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv1: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Inv Two", email: "i2@uni.edu", department_id: "${dept_id}", appointment_type: "STAFF" }, as: SystemAdmin, captures: { inv2: "$.data.id" } }
            - { call: "POST /tlo/disclosures", payload: { title: "Assay Kit", description: "Novel assay", funding_source: "NON_FEDERAL" }, as: Inventor, as_user_id: "${inv1}", captures: { disc_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv1}", share_bp: 6000 }, as: TechTransferOfficer, captures: { e1: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv2}", share_bp: 4000 }, as: TechTransferOfficer, captures: { e2: "$.data.id" } }
            - { call: "POST /tlo/disclosure-entries/${e1}/confirm", payload: {}, as: Inventor, as_user_id: "${inv1}" }
            - { call: "POST /tlo/disclosure-entries/${e2}/confirm", payload: {}, as: Inventor, as_user_id: "${inv2}" }
          trigger:
            - { call: "POST /tlo/disclosure-entries/${e2}/dispute", payload: { reason: "Contribution underestimated" }, as: Inventor, as_user_id: "${inv2}", captures: { disp1: "$.data.id" } }
            - { call: "POST /tlo/inventorship-disputes/${disp1}/resolve", payload: { resolution_notes: "Adjust to equal", adjusted_shares: [ { entry_id: "${e1}", share_bp: 5000 }, { entry_id: "${e2}", share_bp: 5000 } ] }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosure-entries/${e1}/confirm", payload: {}, as: Inventor, as_user_id: "${inv1}" }
            - { call: "POST /tlo/disclosure-entries/${e2}/confirm", payload: {}, as: Inventor, as_user_id: "${inv2}" }
            - { call: "POST /tlo/disclosure-entries/${e1}/dispute", payload: { reason: "Restore original split" }, as: Inventor, as_user_id: "${inv1}", captures: { disp2: "$.data.id" } }
            - { call: "POST /tlo/inventorship-disputes/${disp2}/resolve", payload: { resolution_notes: "Restore", adjusted_shares: [ { entry_id: "${e1}", share_bp: 6000 }, { entry_id: "${e2}", share_bp: 4000 } ] }, as: TechTransferOfficer }
            - { call: "GET /tlo/disclosures/${disc_id}/inventors", payload: {}, as: Any }
          assert:
            - "After first resolve: e1.share_bp == 5000 and e2.share_bp == 5000; sum == 10000 (conserved)"
            - "Both entries reset to PENDING after each resolve (re-confirmation required)"
            - "After second resolve: e1.share_bp == 6000 and e2.share_bp == 4000 — original vector restored exactly"
            - "Disclosure status returned to INVENTORSHIP_REVIEW after each resolve"
