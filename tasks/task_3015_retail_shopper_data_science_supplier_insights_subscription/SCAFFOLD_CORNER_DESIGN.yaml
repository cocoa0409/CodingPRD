      - name: bulk_ingest_partial_rejection
        claim_type: bulk_operations
        grounds: [endpoints, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Bulk ingest is best-effort: valid households persist, invalid ones are reported per-item; no rollback of the valid items."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "ok1", category_codes: ["SNACKS"] }
                  - { household_ref: "ok2", category_codes: ["DAIRY"] }
                  - { recency_days: 5 }
              as: RetailerAdmin
              captures: { n_ok: $.data.ingested_count }
          assert:
            - "ingested_count == 2"
            - "rejected has exactly 1 entry referencing index 2 (missing household_ref) with error_id ERR_INVALID_REQUEST"
            - "the two valid households are queryable in later computations (no rollback)"

