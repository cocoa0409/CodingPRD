  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bed_single_occupancy_confirm_into_taken_bed
        grounds:
          - state_machines.Bed.CLEAN_to_OCCUPIED
          - validations[priority=13]
          - errors[ERR_BED_NOT_AVAILABLE]
          - state_machines.BedRequest.ASSIGNED_to_CONFIRMED
        distinguishing_aspect: |
          Exclusive point-occupancy semantics on a Bed: two BedRequests are both ASSIGNED to the same CLEAN
          bed B1; the first confirm takes it OCCUPIED, so the second confirm collides with the now-occupied
          bed and is rejected ERR_BED_NOT_AVAILABLE. The 'interval' is the patient's stay — a single bed
          tolerates zero overlapping occupants.
        test_recipe:
          setup:
            - "One CLEAN bed B1; two encounters E1, E2 each with a BedRequest ASSIGNED to B1."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-04T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "MS9", unit_type: "MEDSURG", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u1: $.data.id }
