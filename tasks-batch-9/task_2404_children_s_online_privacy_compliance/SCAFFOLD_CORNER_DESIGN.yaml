              payload: { to_status: "VERIFYING", verification_method: "SIGNED_FORM_RETURN" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests/${pr1}/status"
              payload: { to_status: "VERIFIED" }
              as: ComplianceOfficer
              captures: { err_clause_1: $.data.error_id }
            - call: "POST /parental-rights-requests"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_c2}", right_type: "REVIEW", requester_email: "stranger@x.test" }
              as: Parent
              as_user_id: "${consent_c2}"
              captures: { pr2: $.data.id }
            - call: "POST /parental-rights-requests/${pr2}/status"
              payload: { to_status: "VERIFYING", verification_method: "SIGNED_FORM_RETURN" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests/${pr2}/status"
              payload: { to_status: "VERIFIED" }
              as: ComplianceOfficer
              captures: { err_clause_5: $.data.error_id }
            - call: "POST /parental-rights-requests"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_c3}", right_type: "REVIEW", requester_email: "guardian.dd@x.test" }
              as: Parent
              as_user_id: "${consent_c3}"
              captures: { pr3: $.data.id }
            - call: "POST /parental-rights-requests/${pr3}/status"
              payload: { to_status: "VERIFYING", verification_method: "EMAIL_PLUS" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests/${pr3}/status"
              payload: { to_status: "VERIFIED" }
              as: ComplianceOfficer
              captures: { err_clause_4: $.data.error_id }
            - call: "POST /parental-rights-requests/${pr3}/status"
              payload: { to_status: "VERIFICATION_FAILED" }
              as: ComplianceOfficer
              captures: { pr3_attempts: $.data.verification_attempt_count }
            - call: "POST /parental-rights-requests/${pr3}/status"
              payload: { to_status: "SUBMITTED" }
              as: Parent
              as_user_id: "${consent_c3}"
            - call: "POST /parental-rights-requests/${pr3}/status"
              payload: { to_status: "VERIFYING", verification_method: "GOVT_ID_MATCH" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests/${pr3}/status"
              payload: { to_status: "VERIFIED" }
              as: ComplianceOfficer
              captures: { pr3_status: $.data.status }
            - call: "POST /parental-rights-requests/${pr3}/status"
              payload: { to_status: "FULFILLED", scope_mode: "PARENT_CONSENT_SCOPE" }
              as: ComplianceOfficer
              captures: { pr3_final: $.data.status, pr3_scope: $.data.in_scope_record_count }
          assert:
            - "${c1_delivered} == null and ${err_clause_1} == ERR_DIRECT_NOTICE_NOT_DELIVERED with HTTP 422 (clause 1 wins even though the email matched and the method tier was sufficient)"
            - "${err_clause_5} == ERR_REQUESTER_EMAIL_MISMATCH with HTTP 422 for a fully-granted consent with a matching-tier method"
            - "${err_clause_4} == ERR_RIGHTS_VERIFICATION_TIER_INSUFFICIENT with HTTP 422 (EMAIL_PLUS tier 1 < CREDIT_CARD_TRANSACTION tier 3), and it is reported BEFORE the email clause because clause 4 precedes clause 5"
            - "${pr3_attempts} == 1 and ${pr3_status} == VERIFIED after re-verifying with GOVT_ID_MATCH at tier 3"
            - "${pr3_final} == FULFILLED with ${pr3_scope} == 0 (a REVIEW right over a consent with no collected records)"
            - "ParentalRightsRequest.${pr1}.status == VERIFYING and ParentalRightsRequest.${pr2}.status == VERIFYING (refused transitions left both where they were)"

      - name: fulfilment_attempted_before_verification_reports_a_dedicated_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=70]
          - errors[ERR_RIGHTS_REQUEST_NOT_VERIFIED]
          - errors[ERR_INVALID_REQUEST]
          - state_machines.ParentalRightsRequest.VERIFIED_to_FULFILLED
        distinguishing_aspect: "Fulfilment from any status other than VERIFIED returns the dedicated ERR_RIGHTS_REQUEST_NOT_VERIFIED (409) rather than the generic ERR_INVALID_STATE — from SUBMITTED and from VERIFYING alike — while a VERIFIED request missing scope_mode is a 422 ERR_INVALID_REQUEST, and a second fulfilment of the now-terminal request is ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; MIXED_AUDIENCE service with a PUBLISHED notice and consent GRANTED via SIGNED_FORM_RETURN for guardian.ee@x.test / child-617."
            - "One DELETE rights request submitted by the parent and left in SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Fulfilment Gate Kids", operator_organization: "Fulfilment Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.ee@x.test", child_pseudonym: "child-617", intended_uses: ["PARTICIPATION_CORE"], consent_method: "SIGNED_FORM_RETURN", expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { consent_id: $.data.id }
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "PENDING_VERIFICATION" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "FORM-EE-1" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_id}", right_type: "DELETE", requester_email: "guardian.ee@x.test" }
              as: Parent
              as_user_id: "${consent_id}"
              captures: { pr_id: $.data.id, pr_status: $.data.status }
          trigger:
            - call: "POST /parental-rights-requests/${pr_id}/status"
              payload: { to_status: "FULFILLED", scope_mode: "PARENT_CONSENT_SCOPE" }
              as: ComplianceOfficer
              captures: { err_from_submitted: $.data.error_id }
            - call: "POST /parental-rights-requests/${pr_id}/status"
              payload: { to_status: "VERIFYING", verification_method: "SIGNED_FORM_RETURN" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests/${pr_id}/status"
              payload: { to_status: "FULFILLED", scope_mode: "PARENT_CONSENT_SCOPE" }
              as: ComplianceOfficer
              captures: { err_from_verifying: $.data.error_id }
            - call: "POST /parental-rights-requests/${pr_id}/status"
              payload: { to_status: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests/${pr_id}/status"
              payload: { to_status: "FULFILLED" }
              as: ComplianceOfficer
              captures: { err_missing_scope: $.data.error_id }
            - call: "POST /parental-rights-requests/${pr_id}/status"
              payload: { to_status: "FULFILLED", scope_mode: "PARENT_CONSENT_SCOPE" }
              as: ComplianceOfficer
              captures: { fulfilled_status: $.data.status, scope_count: $.data.in_scope_record_count, fulfilled_at: $.data.fulfilled_at }
            - call: "POST /parental-rights-requests/${pr_id}/status"
              payload: { to_status: "FULFILLED", scope_mode: "PARENT_CONSENT_SCOPE" }
