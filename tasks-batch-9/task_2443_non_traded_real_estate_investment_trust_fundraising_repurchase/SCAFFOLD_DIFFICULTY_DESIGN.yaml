          - entities.Subscription.fields.dealer_manager_fee_cents
          - entities.Subscription.fields.net_invested_cents
          - entities.ShareClass.fields.upfront_selling_commission_bps
          - errors[ERR_COMMISSION_CAP_EXCEEDED]
        distinguishing_aspect: |
          The two load lines are rounded independently and only then summed, so a
          gross of 250200 cents at 275 + 25 bps yields 6881 + 626 = 7507 and a
          net_invested_cents of 242693, whereas collapsing the rate to a single
          300 bps line and rounding once yields 7506 and 242694 — a one-cent
          divergence that also shifts shares_issued_e4 by 10 e4 units.
        test_recipe:
          setup:
            - "Offering 'Ridgeline Value REIT' EFFECTIVE, escrow COLLECTING, initial price 1000 cents."
