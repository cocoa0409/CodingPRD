      - name: pool_finalize_from_draft_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.RoyaltyPool.CALCULATED_to_FINALIZED
          - validations.priority_10
          - errors.ERR_INVALID_POOL_STATE
        distinguishing_aspect: |
          finalize is legal only from CALCULATED, so a DRAFT pool cannot be finalized even though
          the pool row is otherwise complete — and the failure is the pool-state error at priority
          10, not the period-state error at 14 (the period never gets consulted).
        test_recipe:
          setup:
            - "One OPEN period and one DRAFT pool. No rate schedule and no usage exist."
          setup_api_calls:
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL", subscriber_count: 1000, gross_revenue_cents: 1428570 }
              as: RoyaltyAdmin
              captures: { pl: "$.data.id", st0: "$.data.status" }
          trigger:
            - name: finalize_from_draft_rejected
              call: "POST /royalties/pools/${pl}/finalize"
              payload: {}
              as: RoyaltyAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /royalties/pools/${pl}"
              payload: {}
              as: RoyaltyAdmin
              captures: { st1: "$.data.status", dist: "$.data.distributable_cents", basis: "$.data.allocation_basis", rate: "$.data.applied_rate_schedule_id" }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_POOL_STATE."
            - "The pool is still DRAFT with distributable_cents 0, allocation_basis null, applied_rate_schedule_id null and residual_payee_holder_id null — no partial finalize."

      - name: period_close_from_open_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AccountingPeriod.DISTRIBUTED_to_CLOSED
          - validations.priority_14
          - errors.ERR_INVALID_PERIOD_STATE
        distinguishing_aspect: |
          close is reachable only from DISTRIBUTED; from OPEN the period-state rule at priority 14
          fires before the temporal rule, the holding rule at 32 and the open-claims rule at 33 —
          so an OPEN period past its claim window still returns ERR_INVALID_PERIOD_STATE.
        test_recipe:
          setup:
