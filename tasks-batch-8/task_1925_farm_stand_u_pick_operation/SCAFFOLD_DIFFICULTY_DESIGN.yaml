          assert:
            - "error_id == ERR_SESSION_NOT_ACTIVE (state, priority 97) — NOT ERR_PAYMENT_AMOUNT_INVALID (fiscal, priority 110)"
            - "HTTP status == 409"

      - name: safety_beats_constraint_on_stale_waiver_full_window
        grounds:
          - validations[priority=72]
          - validations[priority=90]
          - errors[ERR_WAIVER_STALE]
          - errors[ERR_WINDOW_CAPACITY_FULL]
