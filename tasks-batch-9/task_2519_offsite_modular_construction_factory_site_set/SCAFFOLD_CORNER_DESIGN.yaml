      - name: delivering_an_already_delivered_shipment_twice_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines[Shipment.status]
          - validations[priority=52]
          - endpoints[POST /modular/shipments/{shipmentId}/deliver]
        distinguishing_aspect: |
          The deliver action is not idempotent by design: the second call must fail rather than
          re-stamp delivered_at or re-run the DRAFT-draw basis recomputation, which would double
          count the module in a MILESTONE_SET basis.
