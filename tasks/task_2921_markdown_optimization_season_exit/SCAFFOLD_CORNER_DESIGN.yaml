              payload: { sku: "G-7007", season_id: "${season2_id}", category: "FOOTWEAR", cluster_code: "CL-W9", vendor_code: "VN-200", first_receipt_date: "2026-08-20", original_retail_cents: 8999, unit_cost_cents: 4000, units_received_total: 300 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_g_id: $.data.id }
            - call: "POST /seasons/${season2_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /items/${item_g_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 30, ticket_price_cents: 8999 }
              as: PricingAnalyst
            - call: "POST /items/${item_g_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 28, ticket_price_cents: 8999 }
              as: PricingAnalyst
            - call: "POST /items/${item_g_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 41, ticket_price_cents: 8099 }
              as: PricingAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "POST /elasticity-estimates"
              payload: { item_id: "${item_g_id}", method: "OWN_HISTORY" }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_history: $.data.error_id }
            - call: "POST /elasticity-estimates"
