            - "exactly 1 Invoice row exists, with invoice_number 'OK-1' and face_amount_cents 100000"
            - "BuyerProgram.${program_id}.eligible_invoice_count == 1"

  - section: state_machines
    instances:
      - name: program_open_moves_draft_to_open_and_zeroes_the_analytics_block
        claim_type: valid_transition
        grounds:
          - state_machines.BuyerProgram.DRAFT_to_OPEN
          - "endpoints[POST /buyer-programs/{id}/open]"
          - calculations.program_adoption_rate
        distinguishing_aspect: |
          The open edge does more than flip status: it runs program_adoption_rate on an empty invoice
          set, which by the eligible == 0 branch writes adoption_rate_pct exactly 0.00 with
          rate_posture DISCOVERY, and bumps version 1 -> 2.
        test_recipe:
          setup:
            - "One ACTIVE Buyer owning one DRAFT SUPPLIER_NAMED programme with no invoices"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Open Edge Buyer", tax_id: "311112223", credit_limit_cents: 9000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Open Edge Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
          trigger:
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
          assert:
            - "HTTP 200 and BuyerProgram.${program_id}.status == OPEN"
            - "BuyerProgram.${program_id}.eligible_invoice_count == 0 and adopted_invoice_count == 0"
            - "BuyerProgram.${program_id}.adoption_rate_pct == 0.00"
            - "BuyerProgram.${program_id}.rate_posture == DISCOVERY"
            - "BuyerProgram.${program_id}.version == 2"
            - "Buyer.${buyer_id}.status == ACTIVE"

      - name: reopening_a_closed_program_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BuyerProgram.terminal_states
          - "validations[priority=10]"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: |
          CLOSED is the only terminal BuyerProgram state, so a re-open attempt reports
          ERR_ALREADY_TERMINAL (409) rather than the wrong-source-state ERR_INVALID_STATE, and the
          close cascade's hop 3 has already flipped the sole owning Buyer to SUSPENDED - a state the
          re-open attempt must not undo.
        test_recipe:
          setup:
            - "One Buyer whose only programme was opened and then closed, so the buyer is SUSPENDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Terminal Lock Buyer", tax_id: "312223334", credit_limit_cents: 9000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Terminal Lock Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /buyer-programs/${program_id}/status"
              payload: { action: "CLOSE" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { closed_version: "$.data.version" }
          trigger:
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
          assert:
            - "HTTP 409 and data.error_id == ERR_ALREADY_TERMINAL"
            - "BuyerProgram.${program_id}.status == CLOSED"
            - "BuyerProgram.${program_id}.version == ${closed_version} (unchanged by the rejected call)"
            - "Buyer.${buyer_id}.status == SUSPENDED"

      - name: opening_an_already_open_program_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.BuyerProgram.DRAFT_to_OPEN
          - "validations[priority=11]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          The second identical open is NOT idempotent and NOT ERR_ALREADY_TERMINAL: OPEN is a live
          non-terminal state that is simply the wrong source for this edge, so priority 11 fires and
          the version stays at 2 rather than advancing to 3.
        test_recipe:
          setup:
            - "One Buyer with one programme already OPEN (version 2)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Double Open Buyer", tax_id: "313334445", credit_limit_cents: 9000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Double Open Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
          trigger:
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
          assert:
            - "HTTP 409 and data.error_id == ERR_INVALID_STATE"
            - "BuyerProgram.${program_id}.status == OPEN and version == 2"

      - name: idv_adjudication_before_onboarding_submit_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Supplier.VERIFYING_to_VERIFYING
          - "endpoints[POST /suppliers/{id}/idv/adjudicate]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          From onboarding_status DRAFT the adjudicate trigger is not in the transition list at all -
          the identity axis has not been forked yet (idv_status NOT_STARTED, not PENDING) - so the
          call is rejected with ERR_INVALID_STATE and identity_score stays 0.
        test_recipe:
          setup:
            - "One Supplier freshly created and never submitted (onboarding_status DRAFT, idv_status NOT_STARTED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /suppliers"
              payload: { legal_name: "Premature Adjudication Ltd", tax_id_last4: "3344", remittance_email: "ar@premature.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
          trigger:
            - call: "POST /suppliers/${supplier_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 95 }
              as: PlatformOps
          assert:
            - "HTTP 409 and data.error_id == ERR_INVALID_STATE"
            - "Supplier.${supplier_id}.onboarding_status == DRAFT"
            - "Supplier.${supplier_id}.idv_status == NOT_STARTED"
            - "Supplier.${supplier_id}.identity_score == 0 and idv_verified_at is null"
            - "Supplier.${supplier_id}.version == 1"

      - name: freshly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.BuyerProgram.initial_state
          - state_machines.Supplier.initial_state
          - state_machines.BankAccount.initial_state
          - state_machines.AuctionSession.initial_state
          - state_machines.Funder.initial_state
          - state_machines.FunderCommitment.initial_state
          - state_machines.Invoice.initial_state
        distinguishing_aspect: |
          Seven collections are created in one chain and each must land on its own declared initial
          state - and specifically NOT on a neighbour's: BankAccount opens in MICRO_DEPOSIT_SENT
          (never NOT_STARTED, which is the Supplier bank axis), AuctionSession in SCHEDULED (never
          LIVE, even though its opens_at is already in the future), Invoice in ELIGIBLE.
        test_recipe:
          setup:
            - "One ACTIVE Buyer and the logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
