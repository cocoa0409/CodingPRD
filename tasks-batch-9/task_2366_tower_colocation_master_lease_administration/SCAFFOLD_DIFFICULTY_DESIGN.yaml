        entity_pair: [SiteAmendment, GroundLease]
        dependency: "SiteAmendment execution requires the tower's GroundLease to be in status ACTIVE (validations priority 13)"
        expected_error: ERR_GROUND_LEASE_NOT_ACTIVE
        expected_status: 409
        grounds:
          - validations.priority_13
          - state_machines.GroundLease.ACTIVE_to_EXPIRED
          - state_machines.SiteAmendment.axis_execution_status.DRAFT_to_EXECUTED
        distinguishing_aspect: |
          The amendment itself is flawless — DRAFT, cleared by a PASS analysis, inside capacity and
          ground space, within its own term. It is blocked purely by the state of a THIRD entity it
          does not reference in its own body: the tower's ground lease, which the clock sweep moved
