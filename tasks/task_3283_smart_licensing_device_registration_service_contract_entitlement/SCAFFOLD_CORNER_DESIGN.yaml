scaffold_corner_design:
  - section: entities
    instances:
      - name: smart_account_creation_defaults
        claim_type: defaults
        grounds:
          - "entities.SmartAccount.fields.status"
          - "entities.SmartAccount.fields.compliance_posture"
        distinguishing_aspect: "Created account starts status ACTIVE and computed posture COMPLIANT with version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C1", display_name: "Corner One" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
          trigger:
            - call: "GET /api/smart-accounts/${sa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status, post: $.data.compliance_posture, ver: $.data.version }
          assert:
            - "st == ACTIVE"
            - "post == COMPLIANT"
            - "ver == 1"
      - name: duplicate_serial_number_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "Second device with the same serial_number is rejected ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Account + VA + device SN-C2 exists"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C2", display_name: "Corner Two" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C2", product_family: "PF-C2" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C2", product_family: "PF-C2" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_DUPLICATE"
      - name: virtual_account_name_scoped_uniqueness
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
        distinguishing_aspect: "Same VA name allowed across different smart accounts but rejected within one account."
        test_recipe:
          setup: ["Accounts SA-A and SA-B; SA-A has VA named SEG"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C3A", display_name: "Corner Three A" }
              as: PlatformAdmin
              captures: { sa_a: $.data.id }
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C3B", display_name: "Corner Three B" }
              as: PlatformAdmin
              captures: { sa_b: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_a}", name: "SEG" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_a}", name: "SEG" }
              as: PlatformAdmin
              captures: { err_dup: $.data.error_id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_b}", name: "SEG" }
              as: PlatformAdmin
              captures: { ok_name: $.data.name }
          assert:
            - "err_dup == ERR_DUPLICATE"
            - "ok_name == SEG (cross-account reuse allowed)"
  - section: entities
    instances:
      - name: missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /api/license-pools missing purchased_quantity -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Account + VA exist"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C4", display_name: "Corner Four" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
          trigger:
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "X", license_model: "PERPETUAL" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "err == ERR_INVALID_REQUEST"
      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds:
          - "entities.LicensePool.fields.license_model"
          - "validations[priority=4]"
        distinguishing_aspect: "license_model 'TRIAL' outside {PERPETUAL, SUBSCRIPTION} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Account + VA exist"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C5", display_name: "Corner Five" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
          trigger:
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "X", license_model: "TRIAL", purchased_quantity: 5 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "err == ERR_INVALID_REQUEST"
      - name: usage_report_immutability
        claim_type: immutability
        grounds:
          - "entities.UsageReport"
        distinguishing_aspect: "UsageReport has common_fields false (no version field, no update endpoint); response carries id and created_at only plus declared fields."
        test_recipe:
          setup: ["Registered device with pool"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C6", display_name: "Corner Six" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "LIC-C6", license_model: "PERPETUAL", feature_tier: "ESSENTIALS", purchased_quantity: 10 }
              as: PlatformAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C6", product_family: "PF-C6" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/devices/${dev_id}/usage-reports"
              payload: { reported_at: "2026-09-02T00:00:00Z", lines: [ { license_pool_id: "${pool_id}", quantity: 1 } ] }
              as: PlatformAdmin
              captures: { rep: $.data }
          assert:
            - "rep has no 'version' key"
            - "rep.status == ACCEPTED"
      - name: get_nonexistent_device_404
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with random UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/devices/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "err == ERR_NOT_FOUND"
  - section: state_machines
    instances:
      - name: transfer_invalid_from_executed
        claim_type: invalid_transition
        grounds:
          - "state_machines.LicenseTransferRequest"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Approving an already-EXECUTED transfer -> ERR_INVALID_STATE; no side effects fire (pools unchanged)."
        test_recipe:
          setup: ["Executed transfer exists (VA1 pool 10 -> VA2 5)"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C7", display_name: "Corner Seven" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va1: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA2" }
              as: PlatformAdmin
              captures: { va2: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va1}", sku: "LIC-C7", license_model: "PERPETUAL", feature_tier: "ESSENTIALS", purchased_quantity: 10 }
              as: PlatformAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /api/license-transfer-requests"
              payload: { source_pool_id: "${pool_id}", target_virtual_account_id: "${va2}", quantity: 5, reason: "ACCOUNT_REORG" }
              as: PlatformAdmin
              captures: { tr_id: $.data.id, tr_ver: $.data.version }
            - call: "POST /api/license-transfer-requests/${tr_id}/approve"
              payload: { expected_transfer_version: "${tr_ver}" }
              as: PlatformAdmin
            - call: "POST /api/license-transfer-requests/${tr_id}/execute"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/license-transfer-requests/${tr_id}/approve"
              payload: { expected_transfer_version: "${tr_ver}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /api/license-pools/${pool_id}"
              payload: {}
              as: PlatformAdmin
              captures: { src_qty: $.data.purchased_quantity }
          assert:
            - "HTTP status == 409"
            - "err == ERR_INVALID_STATE"
            - "src_qty == 5 (unchanged by the failed approve)"
      - name: rma_terminal_lockdown_cancelled
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.RmaCase"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From CANCELLED (terminal) every action endpoint -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["RMA opened then cancelled on DEPOT_RETURN contract"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C8", display_name: "Corner Eight" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C8", product_family: "PF-C8" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/service-contracts"
              payload: { smart_account_id: "${sa_id}", contract_number: "C-C8", service_level: "DEPOT_RETURN", support_tier: "FULL", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contract-coverages"
              payload: { service_contract_id: "${ctr_id}", device_id: "${dev_id}" }
              as: PlatformAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /api/rma-cases"
              payload: { contract_coverage_id: "${cov_id}", failure_description: "x" }
              as: PlatformAdmin
              captures: { rma_id: $.data.id }
            - call: "POST /api/rma-cases/${rma_id}/cancel"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/rma-cases/${rma_id}/receive-defective"
              payload: {}
              as: LogisticsAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_INVALID_STATE"
      - name: rma_depot_ship_before_receive_branch_violation
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_RMA_BRANCH_VIOLATION]"
        distinguishing_aspect: "On DEPOT_RETURN, ship-replacement from OPENED -> ERR_RMA_BRANCH_VIOLATION (must receive defective first)."
        test_recipe:
          setup: ["DEPOT_RETURN RMA in OPENED"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C9", display_name: "Corner Nine" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C9", product_family: "PF-C9" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/service-contracts"
              payload: { smart_account_id: "${sa_id}", contract_number: "C-C9", service_level: "DEPOT_RETURN", support_tier: "FULL", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contract-coverages"
              payload: { service_contract_id: "${ctr_id}", device_id: "${dev_id}" }
              as: PlatformAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /api/rma-cases"
              payload: { contract_coverage_id: "${cov_id}", failure_description: "x" }
              as: PlatformAdmin
              captures: { rma_id: $.data.id }
          trigger:
            - call: "POST /api/rma-cases/${rma_id}/ship-replacement"
              payload: {}
              as: LogisticsAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_RMA_BRANCH_VIOLATION"
  - section: state_machines
    instances:
      - name: account_close_blocked_by_registered_device
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.SmartAccount.ACTIVE_to_CLOSED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Closing an account that still has a REGISTERED device fails ERR_INVALID_STATE; account stays ACTIVE."
        test_recipe:
          setup: ["Account with REGISTERED device"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C10", display_name: "Corner Ten" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C10", product_family: "PF-C10" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/smart-accounts/${sa_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_INVALID_STATE"
            - "SmartAccount.${sa_id}.status == ACTIVE"
      - name: virtual_account_archive_blocked_by_pending_device
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.VirtualAccount.ACTIVE_to_ARCHIVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Archiving a VA that still has a PENDING device fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["VA with a PENDING (never activated) device"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C11", display_name: "Corner Eleven" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C11", product_family: "PF-C11" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/virtual-accounts/${va_id}/archive"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_INVALID_STATE"
  - section: calculations
    instances:
      - name: subscription_expiry_zeroes_effective_purchased
        claim_type: correct_result
        grounds:
          - "calculations.pool_consumed_quantity"
        distinguishing_aspect: "After subscription_expires_at, effective purchased is 0: an idle SUBSCRIPTION pool (consumed 0) stays COMPLIANT, but a pool with 1 active assignment flips to IN_GRACE at expiry."
        test_recipe:
          setup: ["SUBSCRIPTION pool purchased 5 expiring 2026-09-10, with assignment quantity 1"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C12", display_name: "Corner Twelve" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "SUB-C12", license_model: "SUBSCRIPTION", feature_tier: "ESSENTIALS", purchased_quantity: 5, subscription_expires_at: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C12", product_family: "PF-C12" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/license-assignments"
              payload: { device_id: "${dev_id}", license_pool_id: "${pool_id}", quantity: 1 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/license-pools/${pool_id}"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.compliance_state, gd: $.data.grace_deadline }
          assert:
            - "st == IN_GRACE (consumed 1 > effective purchased 0 at expiry)"
            - "gd == 2026-12-09T00:00:00Z (expiry + 90 days)"
  - section: validations
    instances:
      - name: end_of_support_blocks_coverage_not_activation
        claim_type: conditional_validation
        grounds:
          - "validations[priority=8]"
          - "validations[priority=10]"
          - "errors[ERR_PRODUCT_END_OF_SUPPORT]"
        distinguishing_aspect: "END_OF_SUPPORT milestone blocks coverage attachment (ERR_PRODUCT_END_OF_SUPPORT) but does NOT block device activation; END_OF_LIFE blocks activation. Conditional by milestone_type."
        test_recipe:
          setup: ["END_OF_SUPPORT milestone for PF-C13 effective 2026-09-01; device PF-C13 REGISTERED; active contract in window"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C13", display_name: "Corner Thirteen" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/lifecycle-milestones"
              payload: { product_family: "PF-C13", milestone_type: "END_OF_SUPPORT", effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C13", product_family: "PF-C13" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { dev_state: $.data.registration_state }
            - call: "POST /api/service-contracts"
              payload: { smart_account_id: "${sa_id}", contract_number: "C-C13", service_level: "ADVANCE_NBD", support_tier: "FULL", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "POST /api/contract-coverages"
              payload: { service_contract_id: "${ctr_id}", device_id: "${dev_id}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "dev_state == REGISTERED (activation NOT blocked by END_OF_SUPPORT)"
            - "HTTP status == 422"
            - "err == ERR_PRODUCT_END_OF_SUPPORT"
      - name: software_only_contract_blocks_rma
        claim_type: conditional_validation
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_NO_ACTIVE_COVERAGE]"
        distinguishing_aspect: "Contract with support_tier SOFTWARE_ONLY never authorizes RMA even with ACTIVE coverage in window."
        test_recipe:
          setup: ["Device with ACTIVE coverage on a SOFTWARE_ONLY contract"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C14", display_name: "Corner Fourteen" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-C14", product_family: "PF-C14" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/service-contracts"
              payload: { smart_account_id: "${sa_id}", contract_number: "C-C14", service_level: "DEPOT_RETURN", support_tier: "SOFTWARE_ONLY", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contract-coverages"
              payload: { service_contract_id: "${ctr_id}", device_id: "${dev_id}" }
              as: PlatformAdmin
              captures: { cov_id: $.data.id }
          trigger:
            - call: "POST /api/rma-cases"
              payload: { contract_coverage_id: "${cov_id}", failure_description: "x" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "err == ERR_NO_ACTIVE_COVERAGE"
      - name: insufficient_transferable_at_create
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_INSUFFICIENT_TRANSFERABLE]"
        distinguishing_aspect: "Transfer of 9 units from a pool purchased 10 with consumed 2 (transferable 8) -> ERR_INSUFFICIENT_TRANSFERABLE."
        test_recipe:
          setup: ["Pool purchased 10, assignment quantity 2; VA2 exists"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C15", display_name: "Corner Fifteen" }
