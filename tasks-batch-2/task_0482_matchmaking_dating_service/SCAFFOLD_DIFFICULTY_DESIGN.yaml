  - rule_id: resource_temporal_overlap
    instances:
      - name: date_event_half_open_overlap_on_member_calendar
        grounds:
          - validations[priority=8]
          - errors[ERR_DATE_OVERLAP]
          - entities.DateEvent.fields.start_at
          - entities.DateEvent.fields.end_at
        distinguishing_aspect: |
          On the Member's date calendar, intervals are half-open [start,end): a new DateEvent [20:00,22:00)
          touching an existing [18:00,20:00) is ALLOWED (no overlap), but [19:00,21:00) collides
          (ERR_DATE_OVERLAP). Half-open/touch-allowed semantics.
        test_recipe:
          setup:
