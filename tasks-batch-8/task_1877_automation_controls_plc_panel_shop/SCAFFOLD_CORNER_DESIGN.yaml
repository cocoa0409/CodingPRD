              as: ProjectManager
          trigger:
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_ch}", job_number: "J-CH2", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { err_ch: "$.data.error_id" }
          assert:
            - "Job.${j_ch} created while credit_hold == false"
            - "second create rejected with ERR_CREDIT_HOLD http 402"

      - name: component_inactive_blocks_new_bom_line
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_COMPONENT_INACTIVE]"]
        distinguishing_aspect: "A component PATCHed active == false cannot be added to a new BOM line (ERR_COMPONENT_INACTIVE) but the component row itself remains GET-able."
        test_recipe:
          setup: ["inactive component CI-1 and a panel in DESIGN"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "IA Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_ia: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_ia}", job_number: "J-IA1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_ia: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_ia}/panels"
              payload: { panel_tag: "P-IA1", enclosure_rating: "NEMA_1", design_engineer_id: "de-ia" }
              as: DesignEngineer
              captures: { p_ia: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "CI-1", component_class: "CONTACTOR", unit_cost_cents: 8000, lead_time_days: 5, sccr_ka: 10, heat_dissipation_w: 20 }
              as: QAManager
              captures: { comp_ia: "$.data.id" }
            - call: "PATCH /panel-shop/components/${comp_ia}"
              payload: { active: false }
              as: QAManager
          trigger:
            - call: "POST /panel-shop/panels/${p_ia}/components"
              payload: { component_id: "${comp_ia}", quantity: 1 }
              as: DesignEngineer
              captures: { err_ia: "$.data.error_id" }
            - call: "GET /panel-shop/components/${comp_ia}"
              payload: {}
              as: QAManager
          assert:
            - "BOM add rejected with ERR_COMPONENT_INACTIVE http 422"
            - "GET still returns Component.${comp_ia} with active == false (readable for audit)"

      - name: substitution_downrated_sccr_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SUBSTITUTION_DOWNRATED]"]
        distinguishing_aspect: "Approving a substitution whose proposed sccr_ka (5) is lower than the original (10) is rejected with ERR_SUBSTITUTION_DOWNRATED; an equal-or-higher proposal on a second request is approved."
        test_recipe:
          setup: ["panel DESIGN with original POWER_SUPPLY sccr 10; two proposed components: PS-LOW (5) and PS-HI (22); two substitution requests"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
