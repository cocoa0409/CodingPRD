      - name: both_interest_variants_disagree_on_one_case
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers[dual_variant_calculation]"
          - "calculations.arrears_interest_accrual.variants"
        excluded_because:
          difficulty_instance: interest_variant_divergence_on_case_ledger
          rationale: >
            The dual-variant layer IS the statutory_per_charge versus
            aggregate_month_end split, and the §1.8 instance already drives both
            variants over the same charge set to a divergent pair (1125 against 1875)
            and pins which consumer reads which. A §1.9 instance could only restate it
            with different amounts; the ledger endpoint instance in the endpoints
            section already covers the read-side surface.

      - name: one_write_moves_four_entities
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers[cascading_side_effects]"
          - "state_machines.SupportOrder.ENTERED -> VACATED"
        excluded_because:
          difficulty_instance: order_vacatur_three_level_cascade_to_employer_counter
          rationale: >
            The cascade layer's corner is depth, and the §1.8 instance already walks
            the deepest chain the API has - order vacatur to IWO termination to
            Employer.active_iwo_count to the enforcement release - with a before-and-
            after count on every level. The state_machines section covers the
            shallower cascade_down and bubble_up rows separately, so a second layer-
            level instance would add no new failure mode.

  # ====================================================================
  # Table 9 - Consistency model. §1.0 declares consistency_model: immediate,
  # so the only claim row is immediate: every write is fully applied before
  # its response is written, and there is no queue, no 202 and no convergence
  # window anywhere in the API.
  # ====================================================================
  - section: consistency_model
    instances:

      - name: every_write_is_readable_immediately_with_no_convergence_window
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints[POST /child-support/cases/{case_id}/payments]"
          - "calculations.payment_allocation_waterfall"
          - "calculations.payment_distribution_split"
          - "entities.SupportCase.fields.arrears_principal_cents"
          - "entities.ObligationCharge.fields.unpaid_balance_cents"
          - "endpoints[GET /child-support/cases/{case_id}/ledger]"
        distinguishing_aspect: >
          The write response itself already carries the fully recomputed derived
          state, and four different read surfaces - the parent entity, the child
          entity, the collection index and the computed ledger - agree with it on
          the very next request, with no 202, no job id, no pending flag and no
          retry. Repeating each read returns byte-identical figures, so there is no
          window in which a caller could observe the payment applied to the charge
          but not yet reflected in the case aggregate.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD; ENTERED order at monthly_obligation_cents 75000; one CURRENT_SUPPORT charge of 75000 for 2026-08-01..2026-09-01 due 2026-08-15."
            - "The case is not TANF, so payment_distribution_split disburses current + medical + arrears to the CP and retains only interest and genetic cost."
            - "A 30000 DIRECT_PAY at 2026-08-01 falls in waterfall bucket 1 because the CURRENT_SUPPORT period is half-open and contains the received_at date."
            - "No month end lies strictly before 2026-08-01 with a charge due on or before it, and the single charge is due 2026-08-15, so both interest variants are 0."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Beatrix Lindqvist", ssn_last4: "6264", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpc1: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Emil Lindqvist", ssn_last4: "6265", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpc1: "$.data.id" }
            - call: "POST /child-support/participants/${ncpc1}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpc1}", noncustodial_party_id: "${ncpc1}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casec1: "$.data.id" }
            - call: "POST /child-support/cases/${casec1}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casec1}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderc1: "$.data.id" }
            - call: "POST /child-support/orders/${orderc1}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { gc1: "$.data.guideline_monthly_cents" }
            - call: "POST /child-support/orders/${orderc1}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monc1: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${orderc1}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
              captures: { chc1: "$.data.id" }
            - call: "GET /child-support/cases/${casec1}"
              as: FinanceOfficer
              captures: { v_pre: "$.data.version", arr_pre: "$.data.arrears_principal_cents", col_pre: "$.data.total_collected_principal_cents" }
          trigger:
            - call: "POST /child-support/cases/${casec1}/payments"
              payload: { source: "DIRECT_PAY", amount_cents: 30000 }
              as: FinanceOfficer
              captures: { pay: "$.data.id", p_cur: "$.data.applied_current_cents", p_arr: "$.data.applied_arrears_cents", p_int: "$.data.applied_interest_cents", p_unapp: "$.data.unapplied_credit_cents", p_disb: "$.data.disbursed_to_cp_cents", p_ret: "$.data.retained_by_state_cents" }
            - call: "GET /child-support/cases/${casec1}"
              as: FinanceOfficer
              captures: { v_post: "$.data.version", arr_post: "$.data.arrears_principal_cents", col_post: "$.data.total_collected_principal_cents", recv_post: "$.data.interest_receivable_cents" }
            - call: "GET /child-support/charges/${chc1}"
              as: FinanceOfficer
              captures: { ch_paid: "$.data.paid_cents", ch_bal: "$.data.unpaid_balance_cents", ch_st: "$.data.status" }
            - call: "GET /child-support/payments"
              payload: { case_id: "${casec1}" }
              as: FinanceOfficer
              captures: { pay_total: "$.meta.total_count" }
            - call: "GET /child-support/payments/${pay}"
              as: FinanceOfficer
              captures: { r_cur: "$.data.applied_current_cents", r_disb: "$.data.disbursed_to_cp_cents" }
            - call: "GET /child-support/cases/${casec1}/ledger"
              as: FinanceOfficer
            - call: "GET /child-support/cases/${casec1}"
              as: FinanceOfficer
              captures: { v_again: "$.data.version", arr_again: "$.data.arrears_principal_cents" }
            - call: "GET /child-support/charges/${chc1}"
              as: FinanceOfficer
              captures: { ch_bal_again: "$.data.unpaid_balance_cents" }
          assert:
            - "${monc1} == 75000 and ${arr_pre} == 75000 and ${col_pre} == 0"
            - "HTTP 201 (never 202) and ${p_cur} == 30000 and ${p_arr} == 0 and ${p_int} == 0 and ${p_unapp} == 0  # bucket 1 absorbs the whole payment"
            - "${p_disb} == 30000 and ${p_ret} == 0  # non-TANF split, computed inside the same request"
            - "${arr_post} == 45000 and ${col_post} == 30000 and ${recv_post} == 0 and ${v_post} == ${v_pre} + 1  # the parent aggregate is already recomputed on the next read, one version later"
            - "${ch_paid} == 30000 and ${ch_bal} == 45000 and ${ch_st} == OPEN  # the child row moved in the same transaction"
            - "${pay_total} == 1 and ${r_cur} == 30000 and ${r_disb} == 30000  # the collection index and the row read agree with the write response"
            - "trigger[5] HTTP 200 body: data.arrears_principal_cents == 45000 and data.statutory_interest_cents == 0 and data.aggregate_interest_cents == 0 and data.unapplied_credit_cents == 0  # the computed ledger is derived on read, so it cannot lag either"
            - "${v_again} == ${v_post} and ${arr_again} == ${arr_post} and ${ch_bal_again} == ${ch_bal}  # re-reading changes nothing, so there is no convergence window and no read-repair"
            - "no response in this chain carries a job id, a pending status, an eventual-consistency header or a retry-after directive"

