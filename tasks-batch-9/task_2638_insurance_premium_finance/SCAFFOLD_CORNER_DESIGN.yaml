  # ---------------------------------------------------------------------------
  # §1.9 — Table 6 (Errors): every code in the §1.6 catalog must be reachable.
  # The six auth codes (ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED_ROLE,
  # ERR_NOT_RESOURCE_OWNER, ERR_VERIFIER_NOT_AUTHORIZED and the two segregation-
  # of-duties codes) are triggered in the rbac section below; the two 412
  # stale-version codes are triggered in the optimistic_concurrency layer. The
  # instances here close the remaining gaps, and the last assert of each one
  # names the codes it is responsible for.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: error_triggerable_not_found_family_names_the_exact_dangling_reference
        claim_type: error_triggerable
        grounds:
          - validations.priority_3_ERR_AGREEMENT_NOT_FOUND
          - validations.priority_4_ERR_INSURED_NOT_FOUND
          - errors.ERR_LICENSE_NOT_FOUND
        distinguishing_aspect: |
          There are twelve distinct 404s in the catalog and a single generic "not found" would satisfy
          none of them. Every path-parameter endpoint family is probed with a syntactically valid but
          unknown id, and each must answer with the code for ITS OWN entity. Two ordering rules are
          asserted on top of mere reachability: within the path the LEFTMOST missing segment decides
          (a ghost state rule with a licenses sub-path reports the rule, not the license), and within
          the body the DECLARED field order decides (all three foreign keys bogus at once reports the
          insured, because insured_id is validated first).
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and one real StateRateRule, License, Insured, ProducerAgent and Insurer exist"
            - "every probe below uses a well-formed UUID that matches no row"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { nf_rule: "$.data.id" }
            - call: "POST /state-rate-rules/${nf_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { nf_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { nf_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { nf_insurer: "$.data.id" }
          trigger:
            - call: "GET /state-rate-rules/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: ComplianceOfficer
              captures: { nf_e_rule: "$.data.error_id" }
            - call: "POST /state-rate-rules/00000000-0000-0000-0000-0000000000a1/licenses"
              payload: { license_number: "PFC-XX-999", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { nf_e_rule_left: "$.data.error_id" }
            - call: "POST /licenses/00000000-0000-0000-0000-0000000000a2/suspend"
              payload: {}
