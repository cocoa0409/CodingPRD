    description: "List cycles of a mine"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["limit?", "offset?"]
    output: "InspectionCycle[]"
    side_effects: []
  - method: POST
    path: "/msha/inspection-cycles/{cycleId}/close"
