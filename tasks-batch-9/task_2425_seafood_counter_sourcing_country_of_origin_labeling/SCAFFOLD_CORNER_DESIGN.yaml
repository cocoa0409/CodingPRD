      - name: certification_claim_refused_once_the_window_has_lapsed
        claim_type: temporal_validation
        grounds:
          - validations[priority=42]
          - errors.ERR_CERTIFICATION_EXPIRED
          - state_machines.SustainabilityCertification.ACTIVE_to_EXPIRED
          - entities.SustainabilityCertification.fields.valid_until
        distinguishing_aspect: |
          A certification that was legitimately ACTIVE when reviewed stays ACTIVE in storage
          after the clock passes valid_until -- nothing sweeps it automatically -- so the
          window must be re-checked at claim time: the case label is refused with
          ERR_CERTIFICATION_EXPIRED even though status is still ACTIVE, and the explicit SWEEP
          enforcement is what finally moves it to EXPIRED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z, later advanced to 2026-08-02T09:00:00Z"
            - "Atlantic Cod SupplierLot cased into slot 1"
            - "SustainabilityCertification valid 2026-07-01T00:00:00Z through 2026-08-02T00:00:00Z, approved to ACTIVE while the clock is inside the window"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
