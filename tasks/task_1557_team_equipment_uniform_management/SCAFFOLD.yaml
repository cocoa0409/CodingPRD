scenario: |
  Team Equipment & Uniform Management (team equipment manager): equipment inventory by player & size/spec, uniform ordering, numbering & alternate-kit rotation, laundry & turnaround between events, helmet/protective gear reconditioning & certification cycle, sideline/game-day setup checklist, loss/damage accountability & reorder lead time, supplier contract & product allocation, end-of-season inventory & memorabilia disposition

domain_name: team-equipment-uniform-management
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation        # finite size/spec pools, contract allocation caps, reservations
  secondary_archetype: compliance_audit      # reconditioning & certification cycle, loss/damage accountability
  complexity_layers:
    - optimistic_concurrency                 # OCC on InventoryPool.version and SupplierContract.version
    - cascading_side_effects                 # event-complete -> laundry -> reorder -> contract commit chains
    - dual_variant_calculation               # damage fee variants; on-hand vs forward-looking reorder
    - rate_threshold_triggers                # reorder point crossing, rotation caps, vendor capacity
  entity_topology: flat                      # peer entities linked by FK references; no nested create paths
  state_machine_shape: cyclic                # gear issue/return/recondition loops; claim assess/reopen loop
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles                     # EquipmentManager vs TeamAdmin vs LaundryVendor own distinct ops
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Player
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Player's full legal name" }
      - { name: position_group, type: enum, source: input, description: "OFFENSE | DEFENSE | SPECIAL_TEAMS" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | RELEASED" }

  - name: InventoryPool
    parent: null
    common_fields: true
    fields:
      - { name: season_label, type: string, source: input, description: "Season identifier, e.g. 2026-FALL" }
      - { name: garment_type, type: enum, source: input, description: "GAME_JERSEY | GAME_PANTS | PRACTICE_JERSEY | PRACTICE_PANTS | SOCKS" }
      - { name: size_code, type: string, source: input, description: "Size/spec code, e.g. M, 34, 2XL" }
      - { name: stock_on_hand, type: integer, source: input, description: "Physical units on hand at creation; afterwards only mutated by system flows", constraints: ">= 0" }
      - { name: reserved_quantity, type: integer, source: computed, default: 0, description: "Units reserved by KitAssignments in status RESERVED" }
      - { name: in_laundry_quantity, type: integer, source: computed, default: 0, description: "Units currently out in an event laundry cycle (COLLECTING or IN_WASH)" }
      - { name: available_quantity, type: integer, source: computed, description: "stock_on_hand - reserved_quantity - in_laundry_quantity" }
      - { name: reorder_point, type: integer, source: input, description: "Reorder threshold; crossing fires reorder_threshold_check", constraints: ">= 0" }
      - { name: reorder_batch_size, type: integer, source: input, description: "Fixed batch added to reorder quantity", constraints: "> 0" }
      - { name: reorder_blocked, type: boolean, source: computed, default: false, description: "True when a threshold crossing could not produce a reorder order (no contract or zero clampable quantity)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED (closed by disposition execution)" }

  - name: SupplierContract
    parent: null
    common_fields: true
    fields:
      - { name: vendor_name, type: string, source: input, description: "Supplier name" }
      - { name: season_label, type: string, source: input, description: "Season this contract covers" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | CLOSED" }
      - { name: start_on, type: string, source: input, description: "Contract start date YYYY-MM-DD" }
      - { name: end_on, type: string, source: input, description: "Contract end date YYYY-MM-DD" }
      - { name: allocation_caps, type: array, source: input, description: "Array of {garment_type, max_units}; product allocation caps per garment type" }
      - { name: units_committed, type: array, source: computed, description: "Array of {garment_type, committed_units}; sum of line quantities over KitOrders in SUBMITTED/PARTIALLY_RECEIVED/RECEIVED (outstanding part only for CANCELLED releases)" }
      - { name: default_lead_time_days, type: integer, source: input, description: "Supplier reorder lead time in days", constraints: "> 0" }
      - { name: contract_rebate_pct, type: number, source: input, default: 0, description: "Contract-level rebate fraction applied to order subtotal, 0..1" }

  - name: KitOrder
    parent: null
    common_fields: true
    fields:
      - { name: supplier_contract_id, type: string, source: input, description: "FK -> SupplierContract.id" }
      - { name: source, type: enum, source: system, description: "MANUAL (manager-created) | AUTO_REORDER (system-created by reorder_threshold_check)" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | PARTIALLY_RECEIVED | RECEIVED | CANCELLED" }
      - { name: lines, type: array, source: input, description: "Array of {garment_type, size_code, quantity, unit_price_cents, line_discount_pct? (default 0)}" }
      - { name: received_lines, type: array, source: system, description: "Array of {garment_type, size_code, received_quantity}, accumulated by receive calls" }
      - { name: expected_delivery_on, type: string, source: computed, description: "Submission date (logical clock) + supplier contract default_lead_time_days" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line totals (per-line rounding, see order_total_cents)" }
      - { name: total_cents, type: integer, source: computed, description: "Subtotal after contract rebate (see order_total_cents)" }

  - name: KitAssignment
    parent: null
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id" }
      - { name: season_label, type: string, source: input, description: "Season this kit is issued for" }
      - { name: jersey_number, type: integer, source: input, description: "Uniform number, unique per season among assignments in RESERVED or ISSUED", constraints: "0..99" }
      - { name: jersey_pool_id, type: string, source: input, description: "FK -> InventoryPool.id; pool the jersey unit is reserved from" }
      - { name: pants_pool_id, type: string, source: input, description: "FK -> InventoryPool.id; pool the pants unit is reserved from" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | ISSUED | RETURNED | RELEASED | LOST" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issue; null until ISSUED" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp when a terminal state is reached" }

  - name: GearItem
    parent: null
    common_fields: true
    fields:
      - { name: asset_tag, type: string, source: input, description: "Unique serialized asset tag" }
      - { name: item_type, type: enum, source: input, description: "HELMET | SHOULDER_PADS | GIRDLE_PADS | KNEE_BRACE" }
      - { name: size_spec, type: string, source: input, description: "Size/spec descriptor, e.g. HELMET-L" }
      - { name: condition_grade, type: enum, source: input, default: "A", description: "A | B | C | F (F = failed, not issuable)" }
      - { name: certification_expires_on, type: datetime, source: input, description: "Certification expiry (required and enforced for HELMET/SHOULDER_PADS at issue); null = uncertified" }
      - { name: acquired_on, type: string, source: input, description: "Acquisition date YYYY-MM-DD; drives age factor in damage fee" }
      - { name: status, type: enum, source: system, default: "IN_STOCK", description: "IN_STOCK | ISSUED | OUT_FOR_RECONDITIONING | RETIRED" }
      - { name: current_holder_id, type: string, source: system, description: "FK -> Player.id; null when not ISSUED" }

  - name: ReconditioningJob
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> GearItem.id" }
      - { name: provider_name, type: string, source: input, description: "Reconditioning vendor name" }
      - { name: sent_on, type: string, source: input, description: "Date item was sent out YYYY-MM-DD" }
      - { name: due_back_on, type: string, source: computed, description: "sent_on + RECONDITIONING_SLA_DAYS (45)" }
      - { name: status, type: enum, source: system, default: "OUT", description: "OUT | PASSED | FAILED" }
      - { name: result_grade, type: enum, source: system, description: "A | B | C recorded on PASS; null otherwise" }
      - { name: result_recorded_on, type: string, source: system, description: "Logical-clock date of record-result; null until terminal" }
      - { name: certification_valid_until, type: string, source: computed, description: "result_recorded_on + CERT_VALIDITY_DAYS (365); set only on PASSED" }

  - name: GameEvent
    parent: null
    common_fields: true
    fields:
      - { name: season_label, type: string, source: input, description: "Season the event belongs to" }
      - { name: opponent_name, type: string, source: input, description: "Opponent team name" }
      - { name: kickoff_at, type: datetime, source: input, description: "Scheduled kickoff (ISO 8601 UTC)" }
      - { name: designated_kit, type: enum, source: input, description: "HOME | AWAY | ALTERNATE (ALTERNATE capped per season)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | KIT_LOCKED | COMPLETED | CANCELLED" }
      - { name: checklist, type: array, source: input, description: "Sideline/game-day setup checklist seeded at creation: array of {item_ref, label, required}; each item gains status PENDING -> DONE | NA" }
      - { name: laundry_status, type: enum, source: system, default: "NOT_STARTED", description: "NOT_STARTED | COLLECTING | IN_WASH | READY | CLOSED (parallel state dimension)" }
      - { name: laundry_load, type: array, source: system, description: "Array of {pool_id, quantity} recorded at completion" }
      - { name: laundry_due_at, type: datetime, source: computed, description: "kickoff_at + LAUNDRY_TURNAROUND_HOURS (48); null until COMPLETED with non-empty load" }
      - { name: laundry_overdue, type: boolean, source: computed, description: "true when now > laundry_due_at and laundry_status in {COLLECTING, IN_WASH}" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; accountable player" }
      - { name: claim_type, type: enum, source: input, description: "LOST | DAMAGED" }
      - { name: kit_assignment_id, type: string, source: input, description: "FK -> KitAssignment.id; exactly one of kit_assignment_id / gear_item_id must be set" }
      - { name: gear_item_id, type: string, source: input, description: "FK -> GearItem.id; exactly one of kit_assignment_id / gear_item_id must be set" }
      - { name: base_value_cents, type: integer, source: input, description: "Manager-entered replacement value of the subject", constraints: "> 0" }
      - { name: description, type: string, source: input, description: "Free-text description of the loss/damage" }
      - { name: status, type: enum, source: system, default: "REPORTED", description: "REPORTED | ASSESSED | SETTLED | WAIVED" }
      - { name: condition_grade, type: enum, source: system, description: "Grade recorded at assessment: A | B | C | F" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Fee estimate at report time (REPLACEMENT variant of damage_fee_cents)" }
      - { name: assessed_fee_cents, type: integer, source: computed, description: "Fee computed at assessment (variant per claim_type); null until ASSESSED" }
      - { name: final_fee_cents, type: integer, source: computed, description: "assessed_fee_cents on settle; 0 on waive; null until terminal" }

  - name: DispositionCase
    parent: null
    common_fields: true
    fields:
      - { name: season_label, type: string, source: input, description: "Season whose inventory is being dispositioned" }
      - { name: garment_type, type: enum, source: input, description: "GAME_JERSEY | GAME_PANTS | PRACTICE_JERSEY | PRACTICE_PANTS | SOCKS" }
      - { name: size_code, type: string, source: input, description: "Optional size filter; omitted = all sizes of the garment type" }
      - { name: method, type: enum, source: input, description: "RETURN_TO_STOCK | DONATE | MEMORABILIA_SALE | DISCARD" }
      - { name: unit_price_cents, type: integer, source: input, description: "Required for MEMORABILIA_SALE; per-unit memorabilia price" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | APPROVED | REJECTED | EXECUTED" }
      - { name: affected_pool_ids, type: array, source: computed, description: "Pool ids matching (season_label, garment_type, size_code?) with status ACTIVE; snapshotted at approval" }
      - { name: units_disposed, type: integer, source: computed, description: "Total stock_on_hand written off at execution (0 for RETURN_TO_STOCK)" }
      - { name: proceeds_cents, type: integer, source: computed, description: "units_disposed x unit_price_cents for MEMORABILIA_SALE; 0 otherwise" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Player
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /players/{playerId} with status=SUSPENDED"
        actor: EquipmentManager
        preconditions: ["player.status == ACTIVE (ERR_INVALID_STATE otherwise)"]
        side_effects: ["increments Player.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /players/{playerId} with status=ACTIVE"
        actor: EquipmentManager
        preconditions: ["player.status == SUSPENDED"]
        side_effects: ["increments Player.version by 1"]
      - from: ACTIVE
        to: RELEASED
        trigger: "PATCH /players/{playerId} with status=RELEASED"
        actor: EquipmentManager
        preconditions: ["player has no KitAssignment in ISSUED status (ERR_PLAYER_HAS_ISSUED_KITS)"]
        side_effects: ["KitAssignments of this player in RESERVED -> RELEASED (pool reservations restored)"]
      - from: SUSPENDED
        to: RELEASED
        trigger: "PATCH /players/{playerId} with status=RELEASED"
        actor: EquipmentManager
        preconditions: ["player has no KitAssignment in ISSUED status (ERR_PLAYER_HAS_ISSUED_KITS)"]
        side_effects: ["KitAssignments of this player in RESERVED -> RELEASED (pool reservations restored)"]

  - entity: InventoryPool
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system (disposition execution with method DONATE | MEMORABILIA_SALE | DISCARD)"
        actor: system
        preconditions: ["pool.reserved_quantity == 0", "pool.in_laundry_quantity == 0"]
        side_effects: ["stock_on_hand written off to 0 (counted into DispositionCase.units_disposed)"]
      # Value mutations (reserve/issue/return/laundry/adjust/receive) do not change
      # status but always run pool_availability_reconciliation + reorder_threshold_check
      # and increment InventoryPool.version by 1.

  - entity: SupplierContract
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /supplier-contracts/{contractId}/activate"
        actor: TeamAdmin
        preconditions: ["contract.status == DRAFT (ERR_CONTRACT_NOT_ACTIVE family)", "allocation_caps non-empty", "start_on <= end_on"]
        side_effects: ["increments SupplierContract.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /supplier-contracts/{contractId}/close"
        actor: TeamAdmin
        preconditions: ["contract.status == ACTIVE", "no KitOrder for this contract in SUBMITTED or PARTIALLY_RECEIVED (ERR_OPEN_ORDERS_EXIST)"]
        side_effects: ["increments SupplierContract.version by 1"]
      # Amendments (POST .../amendments) keep status ACTIVE; they OCC-check
      # expected_supplier_contract_version and increment SupplierContract.version by 1.

  - entity: KitOrder
    initial_state: SUBMITTED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: PARTIALLY_RECEIVED
        trigger: "POST /kit-orders/{orderId}/receive (any line still outstanding afterwards)"
        actor: EquipmentManager
        preconditions: ["order.status in {SUBMITTED, PARTIALLY_RECEIVED} (ERR_ORDER_NOT_OPEN)", "per line received_quantity <= ordered - already received (ERR_RECEIVE_EXCEEDS_OUTSTANDING)"]
        side_effects: ["per received line: matching InventoryPool.stock_on_hand += received_quantity", "pool_availability_reconciliation + reorder_threshold_check per touched pool (increase direction: may clear reorder_blocked)", "units_committed unchanged", "increments KitOrder.version by 1"]
      - from: SUBMITTED
        to: RECEIVED
        trigger: "POST /kit-orders/{orderId}/receive (all lines fully received)"
        actor: EquipmentManager
        preconditions: ["same as partial receive"]
        side_effects: ["same as partial receive"]
      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "POST /kit-orders/{orderId}/receive (completes remaining quantities)"
        actor: EquipmentManager
        preconditions: ["same as partial receive"]
        side_effects: ["same as partial receive"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /kit-orders/{orderId}/cancel"
        actor: EquipmentManager
        preconditions: ["order.status in {SUBMITTED, PARTIALLY_RECEIVED} (ERR_ORDER_NOT_OPEN)"]
        side_effects: ["units_committed[garment_type] -= sum of outstanding (ordered - received) quantities per garment_type", "increments KitOrder.version by 1"]
      - from: PARTIALLY_RECEIVED
        to: CANCELLED
        trigger: "POST /kit-orders/{orderId}/cancel"
        actor: EquipmentManager
        preconditions: ["order.status in {SUBMITTED, PARTIALLY_RECEIVED}"]
        side_effects: ["same as SUBMITTED -> CANCELLED (outstanding quantities only)"]

  - entity: KitAssignment
    initial_state: RESERVED
    terminal_states: [RETURNED, RELEASED, LOST]
    transitions:
      - from: RESERVED
        to: ISSUED
        trigger: "POST /kit-assignments/{assignmentId}/issue"
        actor: EquipmentManager
        preconditions: ["kit.status == RESERVED (ERR_KIT_NOT_RESERVED)", "player.status == ACTIVE (ERR_PLAYER_NOT_ACTIVE)", "both pools status == ACTIVE (ERR_POOL_CLOSED)"]
        side_effects: ["jersey_pool: reserved_quantity -= 1, stock_on_hand -= 1", "pants_pool: reserved_quantity -= 1, stock_on_hand -= 1", "pool_availability_reconciliation + reorder_threshold_check on both pools (decrease direction)", "issued_at = logical clock", "increments KitAssignment.version by 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /kit-assignments/{assignmentId}/release"
        actor: EquipmentManager
        preconditions: ["kit.status == RESERVED (ERR_KIT_NOT_RESERVED)"]
        side_effects: ["jersey_pool: reserved_quantity -= 1", "pants_pool: reserved_quantity -= 1", "reconciliation + threshold check (increase direction: may clear reorder_blocked)", "closed_at = logical clock", "jersey_number freed for the season", "increments KitAssignment.version by 1"]
      - from: ISSUED
        to: RETURNED
        trigger: "POST /kit-assignments/{assignmentId}/return"
        actor: EquipmentManager
        preconditions: ["kit.status == ISSUED (ERR_KIT_NOT_ISSUED)"]
        side_effects: ["jersey_pool: stock_on_hand += 1", "pants_pool: stock_on_hand += 1", "reconciliation + threshold check (increase direction: may clear reorder_blocked)", "closed_at = logical clock", "jersey_number freed", "increments KitAssignment.version by 1"]
      - from: ISSUED
        to: LOST
        trigger: "system (DamageClaim with claim_type=LOST on this kit is settled or waived)"
        actor: system
        preconditions: []
        side_effects: ["closed_at = logical clock", "jersey_number freed", "garments not returned to any pool (already written out of stock at issue)"]
      - from: ISSUED
        to: RETURNED
        trigger: "system (DamageClaim with claim_type=DAMAGED on this kit is settled or waived)"
        actor: system
        preconditions: []
        side_effects: ["same pool restock cascade as manager return (increase direction may clear reorder_blocked)"]

  - entity: GearItem
    initial_state: IN_STOCK
    terminal_states: [RETIRED]
    transitions:
      - from: IN_STOCK
        to: ISSUED
        trigger: "POST /gear-items/{itemId}/issue"
        actor: EquipmentManager
        preconditions: ["item.status == IN_STOCK (ERR_GEAR_NOT_IN_STOCK)", "player.status == ACTIVE (ERR_PLAYER_NOT_ACTIVE)", "for HELMET/SHOULDER_PADS: certification_expires_on non-null and strictly greater than logical clock now (ERR_GEAR_CERTIFICATION_EXPIRED)", "condition_grade != F (ERR_GEAR_CONDITION_NOT_ISSUABLE)", "player holds no other ISSUED GearItem with same item_type (ERR_PLAYER_GEAR_LIMIT_REACHED)"]
        side_effects: ["current_holder_id = player_id", "increments GearItem.version by 1"]
      - from: ISSUED
        to: IN_STOCK
        trigger: "POST /gear-items/{itemId}/return"
        actor: EquipmentManager
        preconditions: ["item.status == ISSUED (ERR_GEAR_NOT_ISSUED)"]
        side_effects: ["current_holder_id = null", "increments GearItem.version by 1"]
      - from: IN_STOCK
        to: OUT_FOR_RECONDITIONING
        trigger: "system (POST /reconditioning-jobs for this item)"
        actor: system
        preconditions: ["item.status == IN_STOCK (ERR_GEAR_NOT_IN_STOCK)"]
        side_effects: []
      - from: OUT_FOR_RECONDITIONING
        to: IN_STOCK
        trigger: "system (POST /reconditioning-jobs/{jobId}/record-result)"
        actor: system
        preconditions: []
        side_effects: ["PASS: condition_grade = job.result_grade, certification_expires_on = job.certification_valid_until", "FAIL: condition_grade = F, certification_expires_on unchanged"]
      - from: IN_STOCK
        to: RETIRED
        trigger: "POST /gear-items/{itemId}/retire"
        actor: EquipmentManager
        preconditions: ["item.status == IN_STOCK (ERR_GEAR_NOT_IN_STOCK)"]
        side_effects: ["increments GearItem.version by 1"]
      - from: ISSUED
        to: RETIRED
        trigger: "system (DamageClaim with claim_type=LOST on this item is settled or waived)"
        actor: system
        preconditions: []
        side_effects: ["current_holder_id = null"]

  - entity: ReconditioningJob
    initial_state: OUT
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: OUT
        to: PASSED
        trigger: "POST /reconditioning-jobs/{jobId}/record-result with outcome=PASSED"
        actor: EquipmentManager
        preconditions: ["job.status == OUT (ERR_JOB_NOT_OPEN)", "result_grade present and in {A, B, C}"]
        side_effects: ["result_recorded_on = logical clock date (YYYY-MM-DD)", "certification_valid_until = result_recorded_on + 365 days (date)", "GearItem -> IN_STOCK with condition_grade = result_grade and certification_expires_on = certification_valid_until mapped to a datetime at 00:00:00Z UTC", "increments ReconditioningJob.version by 1"]
      - from: OUT
        to: FAILED
        trigger: "POST /reconditioning-jobs/{jobId}/record-result with outcome=FAILED"
        actor: EquipmentManager
        preconditions: ["job.status == OUT (ERR_JOB_NOT_OPEN)"]
        side_effects: ["result_recorded_on = logical clock date", "GearItem -> IN_STOCK with condition_grade = F", "increments ReconditioningJob.version by 1"]

  - entity: GameEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Two parallel state dimensions: status (lifecycle) x laundry_status (turnaround cycle, NOT_STARTED | COLLECTING | IN_WASH | READY | CLOSED)."
    transitions:
      - from: SCHEDULED
        to: KIT_LOCKED
        trigger: "POST /game-events/{eventId}/lock-kit"
        actor: EquipmentManager
        preconditions: ["event.status == SCHEDULED (ERR_EVENT_NOT_SCHEDULED)", "laundry turnaround gate: no other GameEvent with same season_label has status == COMPLETED and laundry_status in {COLLECTING, IN_WASH} (ERR_LAUNDRY_NOT_READY)"]
        side_effects: ["increments GameEvent.version by 1"]
      - from: KIT_LOCKED
        to: COMPLETED
        trigger: "POST /game-events/{eventId}/complete"
        actor: EquipmentManager
        preconditions: ["event.status == KIT_LOCKED (ERR_EVENT_NOT_LOCKED)", "every checklist item with required=true has status != PENDING (ERR_CHECKLIST_INCOMPLETE)", "per laundry_load line: pool exists (ERR_POOL_NOT_FOUND), pool.status == ACTIVE (ERR_POOL_CLOSED), pool.available_quantity >= quantity (ERR_POOL_INSUFFICIENT_STOCK)"]
        side_effects: ["per laundry_load line: pool.stock_on_hand -= quantity, pool.in_laundry_quantity += quantity", "laundry_status = COLLECTING if laundry_load non-empty else stays NOT_STARTED", "laundry_due_at = kickoff_at + 48h when load non-empty", "pool_availability_reconciliation + reorder_threshold_check per touched pool (decrease direction: may create AUTO_REORDER KitOrder, which itself increments SupplierContract units_committed)", "increments GameEvent.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /game-events/{eventId}/cancel"
        actor: EquipmentManager
        preconditions: ["event.status in {SCHEDULED, KIT_LOCKED} (ERR_EVENT_NOT_SCHEDULED)"]
        side_effects: ["all checklist items still PENDING -> NA", "ALTERNATE designation no longer counts toward the season rotation cap", "increments GameEvent.version by 1"]
      - from: KIT_LOCKED
        to: CANCELLED
        trigger: "POST /game-events/{eventId}/cancel"
        actor: EquipmentManager
        preconditions: ["event.status in {SCHEDULED, KIT_LOCKED}"]
        side_effects: ["same as SCHEDULED -> CANCELLED"]
      # laundry_status dimension (parallel):
      #   NOT_STARTED -> COLLECTING: system, on complete with non-empty load
      #   COLLECTING -> IN_WASH -> READY -> CLOSED: POST /game-events/{eventId}/laundry-advance
      #     actor LaundryVendor or EquipmentManager; one step per call;
      #     invalid from NOT_STARTED or CLOSED (ERR_LAUNDRY_INVALID_TRANSITION);
      #     READY transition side effect: per load line pool.in_laundry_quantity -= q,
      #     pool.stock_on_hand += q, reconciliation + threshold check (increase direction).

  - entity: DamageClaim
    initial_state: REPORTED
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "POST /damage-claims/{claimId}/assess"
        actor: EquipmentManager
        preconditions: ["claim.status == REPORTED (ERR_CLAIM_NOT_REPORTED)"]
        side_effects: ["condition_grade = input grade", "assessed_fee_cents = damage_fee_cents(variant per claim_type)", "increments DamageClaim.version by 1"]
      - from: ASSESSED
        to: REPORTED
        trigger: "POST /damage-claims/{claimId}/reopen"
        actor: TeamAdmin
        preconditions: ["claim.status == ASSESSED (ERR_CLAIM_NOT_ASSESSED)"]
        side_effects: ["assessed_fee_cents reset to null", "condition_grade reset to null", "increments DamageClaim.version by 1"]
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /damage-claims/{claimId}/settle"
        actor: EquipmentManager
        preconditions: ["claim.status == ASSESSED (ERR_CLAIM_NOT_ASSESSED)"]
        side_effects: ["final_fee_cents = assessed_fee_cents", "subject mutation: LOST kit -> KitAssignment LOST; LOST gear -> GearItem RETIRED; DAMAGED kit -> KitAssignment RETURNED with pool restock cascade; DAMAGED gear -> GearItem IN_STOCK with condition_grade = assessed grade", "increments DamageClaim.version by 1"]
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /damage-claims/{claimId}/waive"
        actor: TeamAdmin
        preconditions: ["claim.status == ASSESSED (ERR_CLAIM_NOT_ASSESSED)"]
        side_effects: ["final_fee_cents = 0", "same subject mutations as SETTLED", "increments DamageClaim.version by 1"]

  - entity: DispositionCase
    initial_state: PROPOSED
    terminal_states: [REJECTED, EXECUTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /disposition-cases/{caseId}/approve"
        actor: TeamAdmin
        preconditions: ["case.status == PROPOSED (ERR_DISPOSITION_NOT_PROPOSED)", "method == MEMORABILIA_SALE requires unit_price_cents present at creation (ERR_INVALID_REQUEST)"]
        side_effects: ["affected_pool_ids snapshotted = pools with status ACTIVE matching (season_label, garment_type, optional size_code)", "increments DispositionCase.version by 1"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /disposition-cases/{caseId}/reject"
        actor: TeamAdmin
        preconditions: ["case.status == PROPOSED (ERR_DISPOSITION_NOT_PROPOSED)"]
        side_effects: ["increments DispositionCase.version by 1"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /disposition-cases/{caseId}/execute"
        actor: EquipmentManager
        preconditions: ["case.status == APPROVED (ERR_DISPOSITION_NOT_APPROVED)", "affected_pool_ids non-empty (ERR_DISPOSITION_SCOPE_EMPTY)", "every affected pool has reserved_quantity == 0 and in_laundry_quantity == 0 (ERR_POOL_HAS_ACTIVE_COMMITMENTS)"]
        side_effects: ["RETURN_TO_STOCK: pools unchanged (stay ACTIVE), units_disposed = 0, proceeds_cents = 0", "DONATE/DISCARD: units_disposed = sum of stock_on_hand; each pool stock_on_hand -> 0 and status -> CLOSED; proceeds_cents = 0", "MEMORABILIA_SALE: units_disposed = sum of stock_on_hand; proceeds_cents = units_disposed x unit_price_cents; each pool stock_on_hand -> 0 and status -> CLOSED", "increments DispositionCase.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version; true races only)
# =============================================================================
concurrency_rules:
  - rule_id: pool-adjustment-stale-version
    parent_entity: InventoryPool
    write_endpoint: "POST /inventory-pools/{poolId}/stock-adjustments"
    occ_field: "expected_pool_version"
    description: |
      A stock adjustment carries the InventoryPool.version the client last observed.
      If the pool's version has advanced beyond expected_pool_version (e.g. another
      adjustment, reservation, receive, or laundry movement has since landed), the
      adjustment is rejected as stale rather than silently overwriting a newer count.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
  - rule_id: contract-amend-stale-version
    parent_entity: SupplierContract
    write_endpoint: "POST /supplier-contracts/{contractId}/amendments"
    occ_field: "expected_supplier_contract_version"
    description: |
      An amendment carries the SupplierContract.version the client last observed.
      If the contract's version has advanced beyond expected_supplier_contract_version
      (e.g. activation or a prior amendment has since landed), the amendment is
      rejected as stale so allocation caps are never rebased on a superseded read.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: pool_availability_reconciliation
    trigger: "any mutation touching InventoryPool stock/reservation/laundry quantities (kit reserve/issue/release/return, event complete load, laundry READY restock, stock adjustment, order receive, disposition write-off)"
    algorithm: aggregation
    formula: |
      available_quantity = stock_on_hand - reserved_quantity - in_laundry_quantity
      INVARIANT (conservation): stock_on_hand == available_quantity + reserved_quantity + in_laundry_quantity
      Mutations:
        kit create (reserve):   reserved_quantity += 1 on jersey_pool and pants_pool
        kit issue:              reserved_quantity -= 1 AND stock_on_hand -= 1 (both pools)
        kit release:            reserved_quantity -= 1 (both pools)
        kit return:             stock_on_hand += 1 (both pools)
        event complete load:    stock_on_hand -= q, in_laundry_quantity += q per load line
        laundry READY:          in_laundry_quantity -= q, stock_on_hand += q per load line
        stock adjustment:       stock_on_hand = new_stock_on_hand (must be >= reserved + in_laundry)
        order receive:          stock_on_hand += received_quantity per line
        disposition write-off:  stock_on_hand -> 0 (requires reserved == 0 and in_laundry == 0)
    input_set: "the single InventoryPool row being mutated"
    precision: "integer units"

  - name: reorder_threshold_check
    trigger: "runs immediately after every pool_availability_reconciliation"
    algorithm: threshold
    formula: |
      Edge-triggered on the DECREASE direction only:
        fires when previous available_quantity > reorder_point AND new available_quantity <= reorder_point.
      On fire:
        inbound_open = sum of line quantities over KitOrders with status in {SUBMITTED, PARTIALLY_RECEIVED}
                       whose (season via contract, garment_type, size_code) match this pool
                       (RECEIVED excluded: stock already landed; CANCELLED excluded).
        Contract selector: eligibility = SupplierContracts with status == ACTIVE,
          season_label == pool.season_label, and allocation_caps containing pool.garment_type;
          ranking = created_at ASC; tie-break = vendor_name ASC; empty pool -> reorder_blocked = true, no order.
        remaining_allocation = cap[garment_type] - units_committed[garment_type] on the selected contract.
        VARIANT FORWARD_LOOKING (authoritative): qty_raw = (reorder_point - available_quantity - inbound_open) + reorder_batch_size
        VARIANT ON_HAND_ONLY (diagnostic):       qty_raw = (reorder_point - available_quantity) + reorder_batch_size
        qty = min(qty_raw, remaining_allocation)
        if qty <= 0: reorder_blocked = true, no order created
        else: create KitOrder source=AUTO_REORDER status=SUBMITTED with one line
              {garment_type, size_code, quantity: qty, unit_price_cents: 0, line_discount_pct: 0};
              units_committed[garment_type] += qty on the selected contract.
      On any INCREASE reconciliation:
        if reorder_blocked == true AND new available_quantity > reorder_point: reorder_blocked = false.
    constants:
      # threshold crossing uses <= on the new value
      CROSSING_COMPARATOR: "<="
    input_set: "the mutated InventoryPool; KitOrders via their contract season; ACTIVE SupplierContracts"
    precision: "integer units"
    variants:
      - { name: FORWARD_LOOKING, when: "authoritative reorder quantity", difference: "subtracts inbound open-order units from the shortage" }
      - { name: ON_HAND_ONLY, when: "diagnostic/projection reads", difference: "ignores inbound open orders, yielding a larger (or nonzero) quantity for identical pool state" }

  - name: damage_fee_cents
    trigger: "DamageClaim creation (provisional_fee_cents, always REPLACEMENT variant) and assessment (assessed_fee_cents, variant selected by claim_type)"
    algorithm: tiered_pricing
    formula: |
      condition_factor: A = 1.00, B = 0.80, C = 0.60, F = 0.25
      age_days = (logical clock date) - acquired_date
        kit subject: acquired_date = KitAssignment.created_at date
        gear subject: acquired_date = GearItem.acquired_on
      age_factor: age_days <= 365 -> 1.0; 366..730 -> 0.7; > 730 -> 0.4
      raw = base_value_cents * condition_factor * age_factor
      fee = min(FEE_CAP_CENTS, max(DEDUCTIBLE_CENTS, raw))
      Evaluation order is fixed: factor lookup -> multiply -> floor clamp (deductible) -> cap clamp.
      VARIANT REPLACEMENT (claim_type == LOST): condition_factor and age_factor forced to 1.0.
      VARIANT DEPRECIATED (claim_type == DAMAGED): full formula with assessed condition grade.
    constants:
      FEE_CAP_CENTS: 50000
      DEDUCTIBLE_CENTS: 5000
    input_set: "the DamageClaim plus its subject (KitAssignment or GearItem)"
    precision: "integer cents; raw truncated toward zero to integer cents before clamps"
    variants:
      - { name: REPLACEMENT, when: "claim_type == LOST (and all provisional estimates)", difference: "ignores condition and age; identical inputs yield a strictly higher or equal fee than DEPRECIATED whenever grade < A or age > 365 days" }
      - { name: DEPRECIATED, when: "claim_type == DAMAGED at assessment", difference: "applies condition_factor and age_factor" }

  - name: order_total_cents
    trigger: "KitOrder creation"
    algorithm: tiered_pricing
    formula: |
      PINNED ROUNDING ORDER (per-line first, then sum, then rebate):
        1. per line: line_total_cents = round_half_up(unit_price_cents * quantity * (1 - line_discount_pct))
        2. subtotal_cents = sum of line_total_cents
        3. total_cents = round_half_up(subtotal_cents * (1 - contract.contract_rebate_pct))
      Summing raw line values before rounding (sum-then-round) is a DIFFERENT, non-authoritative
      variant and can differ by one or more cents; only the pinned order is correct.
    input_set: "the KitOrder's lines plus the parent SupplierContract.contract_rebate_pct"
    precision: "integer cents, round_half_up at each pinned rounding step"

  - name: units_committed_reconciliation
    trigger: "KitOrder creation, cancel, and receive status bookkeeping"
    algorithm: aggregation
    formula: |
      For each garment_type g in contract.allocation_caps:
        units_committed[g] = sum over the contract's KitOrders of line quantities for g
          where order.status in {SUBMITTED, PARTIALLY_RECEIVED, RECEIVED}
          (CANCELLED orders contribute only their already-received quantities:
           committed[g] += received quantities of a cancelled order; the outstanding part is released at cancel).
        remaining_allocation[g] = allocation_caps[g] - units_committed[g]
      INVARIANT (conservation): units_committed[g] + remaining_allocation[g] == allocation_caps[g]
      NOTE: units_committed is derived on read; KitOrder create/cancel does NOT mutate a stored
      contract field and therefore does NOT increment SupplierContract.version.
    input_set: "KitOrders of the contract in any status, with their lines and received_lines"
    precision: "integer units"

  - name: laundry_turnaround
    trigger: "GameEvent completion with non-empty laundry_load; laundry_overdue evaluated on every GameEvent read"
    algorithm: threshold
    formula: |
      laundry_due_at = kickoff_at + LAUNDRY_TURNAROUND_HOURS
      laundry_overdue = (logical clock now > laundry_due_at) AND laundry_status in {COLLECTING, IN_WASH}
      lock-kit gate (turnaround between events): a GameEvent may lock its kit only if no other
      GameEvent with the same season_label has status == COMPLETED and laundry_status in {COLLECTING, IN_WASH}.
    constants:
      LAUNDRY_TURNAROUND_HOURS: 48
    input_set: "the completing/read GameEvent; sibling GameEvents with same season_label for the lock gate"
    precision: "ISO 8601 UTC timestamps, strict > comparison for overdue"

  - name: alternate_kit_rotation_count
    trigger: "GameEvent creation with designated_kit == ALTERNATE"
    algorithm: threshold
    formula: |
      count = number of GameEvents with same season_label, designated_kit == ALTERNATE,
              and status != CANCELLED
      creation allowed iff count < MAX_ALTERNATE_KIT_GAMES_PER_SEASON
      (the 3rd ALTERNATE event succeeds when count == 2; rejected when count == 3)
    constants:
      MAX_ALTERNATE_KIT_GAMES_PER_SEASON: 3
    input_set: "GameEvents with same season_label, status != CANCELLED (CANCELLED frees a slot)"
    precision: "integer count, strict < comparison"

  - name: event_spacing_check
    trigger: "GameEvent creation"
    algorithm: interval_merge
    formula: |
      For every other GameEvent with same season_label and status != CANCELLED:
        |new.kickoff_at - other.kickoff_at| >= MIN_EVENT_SPACING_HOURS (gap-buffer semantics;
        exactly 48h apart is allowed, 47:59:59 is rejected). Pure overlap and near-adjacency both fail.
    constants:
      MIN_EVENT_SPACING_HOURS: 48
    input_set: "GameEvents with same season_label and status != CANCELLED"
    precision: "whole minutes at least; comparison in seconds, >= 172800"

  - name: provider_capacity_check
    trigger: "ReconditioningJob creation"
    algorithm: interval_merge
    formula: |
      Each OUT job occupies the half-open window [sent_on, due_back_on), due_back_on = sent_on + 45 days.
      concurrent(provider, window) = count of OUT jobs with same provider_name whose windows overlap
        the new job's window (overlap: new.sent_on < existing.due_back_on AND existing.sent_on < new.due_back_on).
      Creation rejected when concurrent >= MAX_CONCURRENT_JOBS_PER_PROVIDER
      (aggregate-capacity semantics: individual overlaps tolerated up to the cap).
      Item-level gate is separate: the GearItem must be IN_STOCK (state precondition).
    constants:
      MAX_CONCURRENT_JOBS_PER_PROVIDER: 2
      RECONDITIONING_SLA_DAYS: 45
      CERT_VALIDITY_DAYS: 365
    input_set: "ReconditioningJobs with status == OUT and same provider_name"
    precision: "date granularity (YYYY-MM-DD), half-open intervals"

  - name: disposition_execution_totals
    trigger: "DispositionCase execution"
    algorithm: aggregation
    formula: |
      matching pools = InventoryPools with status ACTIVE, season_label, garment_type matching,
        and size_code equal when the case specifies one
      units_disposed = 0 for RETURN_TO_STOCK; else sum of stock_on_hand over matching pools
      proceeds_cents = units_disposed * unit_price_cents for MEMORABILIA_SALE; else 0
    input_set: "InventoryPools matching the case scope with status == ACTIVE"
    precision: "integer units / integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is permitted on this endpoint per RBAC"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request body schema: required fields present, types/enums/ranges valid (jersey_number 0..99, quantities > 0, pcts in 0..1, dates parseable); DamageClaim carries exactly one of kit_assignment_id / gear_item_id; MEMORABILIA_SALE case carries unit_price_cents"
    error_id: "ERR_INVALID_REQUEST (ERR_INVALID_CLAIM_SUBJECT for the claim subject rule)"
    http_status: 400
    applies_to: "all POST/PATCH endpoints"
  - priority: 4
    category: existence
    check: "Referenced resources exist: path ids left-to-right, then body-referenced ids (player_id, pool ids, contract id, item_id, order lines' pools by (contract season, garment_type, size_code) -> ERR_POOL_NOT_FOUND)"
    error_id: "ERR_PLAYER_NOT_FOUND | ERR_POOL_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_KIT_ASSIGNMENT_NOT_FOUND | ERR_GEAR_ITEM_NOT_FOUND | ERR_RECONDITIONING_JOB_NOT_FOUND | ERR_GAME_EVENT_NOT_FOUND | ERR_DAMAGE_CLAIM_NOT_FOUND | ERR_DISPOSITION_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: state
    check: "State preconditions: contract ACTIVE for orders/amendments; pool ACTIVE (not CLOSED) for reserve/adjust/load; kit RESERVED for issue/release, ISSUED for return; gear IN_STOCK for issue/retire/job-create, ISSUED for return; job OUT for record-result; event SCHEDULED for lock, KIT_LOCKED for complete, SCHEDULED/KIT_LOCKED for cancel; laundry one-step progression; claim REPORTED for assess, ASSESSED for settle/waive/reopen; disposition PROPOSED for approve/reject, APPROVED for execute; player ACTIVE for kit issue/gear issue; claim subject state (kit ISSUED, gear ISSUED); lock-kit laundry turnaround gate"
    error_id: "ERR_CONTRACT_NOT_ACTIVE | ERR_POOL_CLOSED | ERR_KIT_NOT_RESERVED | ERR_KIT_NOT_ISSUED | ERR_GEAR_NOT_IN_STOCK | ERR_GEAR_NOT_ISSUED | ERR_JOB_NOT_OPEN | ERR_EVENT_NOT_SCHEDULED | ERR_EVENT_NOT_LOCKED | ERR_LAUNDRY_INVALID_TRANSITION | ERR_LAUNDRY_NOT_READY | ERR_CLAIM_NOT_REPORTED | ERR_CLAIM_NOT_ASSESSED | ERR_DISPOSITION_NOT_PROPOSED | ERR_DISPOSITION_NOT_APPROVED | ERR_PLAYER_NOT_ACTIVE | ERR_OPEN_ORDERS_EXIST | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6
    category: business_safety
    check: "Protective gear safety: HELMET/SHOULDER_PADS issue requires certification_expires_on non-null and strictly > now; any gear with condition_grade F is not issuable"
    error_id: "ERR_GEAR_CERTIFICATION_EXPIRED | ERR_GEAR_CONDITION_NOT_ISSUABLE"
    http_status: 409
    applies_to: "POST /gear-items/{itemId}/issue"
  - priority: 7
    category: business_constraint
    check: "Uniqueness and structural constraints: (season_label, jersey_number) unique among kits in RESERVED/ISSUED; asset_tag unique; (season_label, garment_type, size_code) pool unique; player holds at most one ISSUED gear item per item_type; order line garment_type covered by contract allocation_caps; claim subject belongs to claim.player_id (kit.player_id / gear.current_holder_id); pools referenced by a kit share the kit's season_label"
    error_id: "ERR_JERSEY_NUMBER_TAKEN | ERR_ASSET_TAG_TAKEN | ERR_POOL_ALREADY_EXISTS | ERR_PLAYER_GEAR_LIMIT_REACHED | ERR_GARMENT_NOT_COVERED_BY_CONTRACT | ERR_CLAIM_PLAYER_MISMATCH | ERR_POOL_SEASON_MISMATCH"
    http_status: 409
    applies_to: "kit/gear/pool/order/claim creation and gear issue"
  - priority: 8
    category: business_temporal
    check: "Temporal window rules: 48h event spacing within a season; provider concurrent reconditioning capacity (max 2 overlapping OUT windows); ALTERNATE kit season rotation cap (count < 3)"
    error_id: "ERR_EVENT_SPACING_VIOLATION | ERR_VENDOR_CAPACITY_EXCEEDED | ERR_ALTERNATE_KIT_LIMIT_REACHED"
    http_status: 409
    applies_to: "POST /game-events, POST /reconditioning-jobs"
  - priority: 9
    category: business_fiscal
    check: "Capacity/fiscal checks: order line quantities per garment_type <= remaining_allocation (equality allowed); kit reserve requires available_quantity >= 1 on both pools; event laundry_load quantity <= pool available_quantity; stock adjustment new_stock_on_hand >= reserved + in_laundry; amendment caps >= units_committed per garment_type; receive quantities <= outstanding"
    error_id: "ERR_ALLOCATION_CAP_EXCEEDED | ERR_POOL_INSUFFICIENT_STOCK | ERR_STOCK_BELOW_COMMITMENTS | ERR_AMENDMENT_BELOW_COMMITTED | ERR_RECEIVE_EXCEEDS_OUTSTANDING"
    http_status: 402
    applies_to: "POST /kit-orders, POST /kit-assignments, POST /game-events/{id}/complete, POST /inventory-pools/{id}/stock-adjustments, POST /supplier-contracts/{id}/amendments, POST /kit-orders/{id}/receive"
    note: "ERR_ALLOCATION_CAP_EXCEEDED uses http 402; the other fiscal-family errors use 409."

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Player ---
  - { method: POST, path: "/players", description: "Create a roster player", roles: [EquipmentManager], code: 201, input: [full_name, position_group], output: Player, side_effects: ["status initialized ACTIVE"] }
  - { method: GET, path: "/players/{playerId}", description: "Get a player", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: Player, side_effects: [] }
  - { method: PATCH, path: "/players/{playerId}", description: "Transition player status (ACTIVE <-> SUSPENDED, -> RELEASED)", roles: [EquipmentManager], code: 200, input: [status], output: Player, side_effects: ["RELEASED cascades RESERVED kits to RELEASED with pool reservation restore", "increments Player.version by 1"] }

  # --- InventoryPool ---
  - { method: POST, path: "/inventory-pools", description: "Create a size/spec uniform stock pool for a season", roles: [EquipmentManager], code: 201, input: [season_label, garment_type, size_code, stock_on_hand, reorder_point, reorder_batch_size], output: InventoryPool, side_effects: ["reserved/in_laundry initialized 0; available_quantity = stock_on_hand"] }
  - { method: GET, path: "/inventory-pools/{poolId}", description: "Get a pool", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: InventoryPool, side_effects: [] }
  - { method: GET, path: "/inventory-pools", description: "List pools with filters and pagination", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: ["season_label?", "garment_type?", "status?", "limit?", "offset?"], output: "InventoryPool[]", side_effects: [] }
  - { method: POST, path: "/inventory-pools/{poolId}/stock-adjustments", description: "Absolute stock recount with OCC guard", roles: [EquipmentManager], code: 200, input: [new_stock_on_hand, expected_pool_version, "reason?"], output: InventoryPool, side_effects: ["stock_on_hand := new_stock_on_hand", "pool_availability_reconciliation + reorder_threshold_check (either direction)", "increments InventoryPool.version by 1"] }

  # --- SupplierContract ---
  - { method: POST, path: "/supplier-contracts", description: "Create a supplier contract with product allocation caps", roles: [TeamAdmin], code: 201, input: [vendor_name, season_label, start_on, end_on, allocation_caps, default_lead_time_days, "contract_rebate_pct?"], output: SupplierContract, side_effects: ["status DRAFT; units_committed zeros per capped garment_type"] }
  - { method: GET, path: "/supplier-contracts/{contractId}", description: "Get a contract", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: SupplierContract, side_effects: [] }
  - { method: POST, path: "/supplier-contracts/{contractId}/activate", description: "Activate a DRAFT contract", roles: [TeamAdmin], code: 200, input: [], output: SupplierContract, side_effects: ["status -> ACTIVE", "increments SupplierContract.version by 1"] }
  - { method: POST, path: "/supplier-contracts/{contractId}/amendments", description: "Amend allocation caps on an ACTIVE contract with OCC guard", roles: [TeamAdmin], code: 200, input: [allocation_caps, expected_supplier_contract_version], output: SupplierContract, side_effects: ["allocation_caps replaced", "increments SupplierContract.version by 1"] }
  - { method: POST, path: "/supplier-contracts/{contractId}/close", description: "Close an ACTIVE contract (no open orders)", roles: [TeamAdmin], code: 200, input: [], output: SupplierContract, side_effects: ["status -> CLOSED", "increments SupplierContract.version by 1"] }

  # --- KitOrder ---
  - { method: POST, path: "/kit-orders", description: "Create and submit a uniform order against a contract", roles: [EquipmentManager], code: 201, input: [supplier_contract_id, lines], output: KitOrder, side_effects: ["status SUBMITTED, source MANUAL", "subtotal/total computed per pinned rounding order", "expected_delivery_on = today + lead time", "units_committed[garment_type] += line quantities"] }
  - { method: GET, path: "/kit-orders/{orderId}", description: "Get an order", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: KitOrder, side_effects: [] }
  - { method: GET, path: "/kit-orders", description: "List orders with filters and pagination", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: ["supplier_contract_id?", "status?", "source?", "limit?", "offset?"], output: "KitOrder[]", side_effects: [] }
  - { method: POST, path: "/kit-orders/{orderId}/receive", description: "Receive (fully or partially) order lines into pools", roles: [EquipmentManager], code: 200, input: [received_lines], output: KitOrder, side_effects: ["pool.stock_on_hand += received quantities", "reconciliation + threshold check (increase)", "status -> PARTIALLY_RECEIVED or RECEIVED"] }
  - { method: POST, path: "/kit-orders/{orderId}/cancel", description: "Cancel an open order, releasing outstanding allocation", roles: [EquipmentManager], code: 200, input: [], output: KitOrder, side_effects: ["units_committed released for outstanding quantities", "status -> CANCELLED"] }

  # --- KitAssignment ---
  - { method: POST, path: "/kit-assignments", description: "Reserve a numbered season kit for a player from jersey/pants pools", roles: [EquipmentManager], code: 201, input: [player_id, season_label, jersey_number, jersey_pool_id, pants_pool_id], output: KitAssignment, side_effects: ["both pools reserved_quantity += 1", "reconciliation + threshold check (decrease)", "status RESERVED"] }
  - { method: GET, path: "/kit-assignments/{assignmentId}", description: "Get a kit assignment", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: KitAssignment, side_effects: [] }
  - { method: GET, path: "/kit-assignments", description: "List kit assignments with filters and pagination", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: ["player_id?", "jersey_pool_id?", "pants_pool_id?", "season_label?", "status?", "limit?", "offset?"], output: "KitAssignment[]", side_effects: [] }
  - { method: POST, path: "/kit-assignments/{assignmentId}/issue", description: "Issue a reserved kit to its player", roles: [EquipmentManager], code: 200, input: [], output: KitAssignment, side_effects: ["both pools: reserved -= 1, stock_on_hand -= 1", "reconciliation + threshold check (decrease)", "status -> ISSUED"] }
  - { method: POST, path: "/kit-assignments/{assignmentId}/release", description: "Release a reserved (unissued) kit", roles: [EquipmentManager], code: 200, input: [], output: KitAssignment, side_effects: ["both pools reserved -= 1", "reconciliation + threshold check (increase)", "status -> RELEASED"] }
  - { method: POST, path: "/kit-assignments/{assignmentId}/return", description: "Return an issued kit to stock", roles: [EquipmentManager], code: 200, input: [], output: KitAssignment, side_effects: ["both pools stock_on_hand += 1", "reconciliation + threshold check (increase)", "status -> RETURNED"] }

  # --- GearItem ---
  - { method: POST, path: "/gear-items", description: "Register a serialized protective gear item", roles: [EquipmentManager], code: 201, input: [asset_tag, item_type, size_spec, acquired_on, "condition_grade?", "certification_expires_on?"], output: GearItem, side_effects: ["status IN_STOCK"] }
  - { method: GET, path: "/gear-items/{itemId}", description: "Get a gear item", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: GearItem, side_effects: [] }
  - { method: GET, path: "/gear-items", description: "List gear items with filters and pagination", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: ["current_holder_id?", "item_type?", "status?", "limit?", "offset?"], output: "GearItem[]", side_effects: [] }
  - { method: POST, path: "/gear-items/{itemId}/issue", description: "Issue a gear item to a player (safety-gated)", roles: [EquipmentManager], code: 200, input: [player_id], output: GearItem, side_effects: ["status -> ISSUED, current_holder_id set"] }
  - { method: POST, path: "/gear-items/{itemId}/return", description: "Return an issued gear item to stock", roles: [EquipmentManager], code: 200, input: [], output: GearItem, side_effects: ["status -> IN_STOCK, holder cleared"] }
  - { method: POST, path: "/gear-items/{itemId}/retire", description: "Retire an in-stock gear item", roles: [EquipmentManager], code: 200, input: [], output: GearItem, side_effects: ["status -> RETIRED"] }

  # --- ReconditioningJob ---
  - { method: POST, path: "/reconditioning-jobs", description: "Send an in-stock gear item out for reconditioning/recertification", roles: [EquipmentManager], code: 201, input: [item_id, provider_name, sent_on], output: ReconditioningJob, side_effects: ["item -> OUT_FOR_RECONDITIONING", "due_back_on = sent_on + 45 days", "provider capacity check", "status OUT"] }
  - { method: GET, path: "/reconditioning-jobs/{jobId}", description: "Get a reconditioning job", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: ReconditioningJob, side_effects: [] }
  - { method: GET, path: "/reconditioning-jobs", description: "List reconditioning jobs with filters", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: ["item_id?", "provider_name?", "status?", "limit?", "offset?"], output: "ReconditioningJob[]", side_effects: [] }
  - { method: POST, path: "/reconditioning-jobs/{jobId}/record-result", description: "Record PASSED (with result_grade) or FAILED outcome", roles: [EquipmentManager], code: 200, input: [outcome, "result_grade?"], output: ReconditioningJob, side_effects: ["PASS: item IN_STOCK with new grade + certification_expires_on = result date + 365d", "FAIL: item IN_STOCK with grade F"] }

  # --- GameEvent ---
  - { method: POST, path: "/game-events", description: "Schedule a game event with kit designation and optional seeded checklist", roles: [EquipmentManager], code: 201, input: [season_label, opponent_name, kickoff_at, designated_kit, "checklist?"], output: GameEvent, side_effects: ["status SCHEDULED, laundry_status NOT_STARTED", "checklist items PENDING"] }
  - { method: GET, path: "/game-events/{eventId}", description: "Get a game event (includes checklist + laundry fields + computed overdue)", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: GameEvent, side_effects: [] }
  - { method: POST, path: "/game-events/{eventId}/lock-kit", description: "Lock the kit for the event (turnaround gate on prior events' laundry)", roles: [EquipmentManager], code: 200, input: [], output: GameEvent, side_effects: ["status -> KIT_LOCKED"] }
  - { method: POST, path: "/game-events/{eventId}/complete", description: "Complete the event and send the sideline load to laundry", roles: [EquipmentManager], code: 200, input: [laundry_load], output: GameEvent, side_effects: ["status -> COMPLETED", "pools: stock -= q, in_laundry += q per load line", "laundry_status -> COLLECTING (if load non-empty)", "laundry_due_at = kickoff + 48h", "threshold cascade may create AUTO_REORDER order + commit contract allocation"] }
  - { method: POST, path: "/game-events/{eventId}/cancel", description: "Cancel a scheduled or kit-locked event", roles: [EquipmentManager], code: 200, input: [], output: GameEvent, side_effects: ["status -> CANCELLED", "pending checklist items -> NA", "ALTERNATE slot freed"] }
  - { method: POST, path: "/game-events/{eventId}/laundry-advance", description: "Advance laundry one step: COLLECTING -> IN_WASH -> READY -> CLOSED", roles: [LaundryVendor, EquipmentManager], code: 200, input: [], output: GameEvent, side_effects: ["READY transition restocks load into pools (in_laundry -= q, stock += q)", "reconciliation + threshold check (increase)"] }
  - { method: POST, path: "/game-events/{eventId}/checklist/{itemRef}/complete", description: "Mark a checklist item DONE or NA", roles: [EquipmentManager], code: 200, input: [outcome], output: GameEvent, side_effects: ["checklist item status set (PENDING -> DONE | NA)"] }

  # --- DamageClaim ---
  - { method: POST, path: "/damage-claims", description: "Report a loss/damage claim against a player's issued kit or gear", roles: [EquipmentManager], code: 201, input: [player_id, claim_type, base_value_cents, "kit_assignment_id?", "gear_item_id?", "description?"], output: DamageClaim, side_effects: ["status REPORTED", "provisional_fee_cents computed (REPLACEMENT variant)"] }
  - { method: GET, path: "/damage-claims/{claimId}", description: "Get a damage claim", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: DamageClaim, side_effects: [] }
  - { method: GET, path: "/damage-claims", description: "List damage claims with filters", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: ["player_id?", "kit_assignment_id?", "gear_item_id?", "status?", "limit?", "offset?"], output: "DamageClaim[]", side_effects: [] }
  - { method: POST, path: "/damage-claims/{claimId}/assess", description: "Assess a reported claim with a condition grade", roles: [EquipmentManager], code: 200, input: [condition_grade], output: DamageClaim, side_effects: ["assessed_fee_cents computed (variant per claim_type)", "status -> ASSESSED"] }
  - { method: POST, path: "/damage-claims/{claimId}/settle", description: "Settle an assessed claim (charges fee, mutates subject)", roles: [EquipmentManager], code: 200, input: [], output: DamageClaim, side_effects: ["final_fee_cents = assessed_fee_cents", "subject cascade per claim_type", "status -> SETTLED"] }
  - { method: POST, path: "/damage-claims/{claimId}/waive", description: "Waive an assessed claim (no fee, same subject mutation)", roles: [TeamAdmin], code: 200, input: [], output: DamageClaim, side_effects: ["final_fee_cents = 0", "subject cascade per claim_type", "status -> WAIVED"] }
  - { method: POST, path: "/damage-claims/{claimId}/reopen", description: "Reopen an assessed claim back to REPORTED", roles: [TeamAdmin], code: 200, input: [], output: DamageClaim, side_effects: ["assessed fields cleared", "status -> REPORTED"] }

  # --- DispositionCase ---
  - { method: POST, path: "/disposition-cases", description: "Propose an end-of-season disposition over a pool scope", roles: [EquipmentManager], code: 201, input: [season_label, garment_type, method, "size_code?", "unit_price_cents?"], output: DispositionCase, side_effects: ["status PROPOSED"] }
  - { method: GET, path: "/disposition-cases/{caseId}", description: "Get a disposition case", roles: [EquipmentManager, TeamAdmin, LaundryVendor], code: 200, input: [], output: DispositionCase, side_effects: [] }
  - { method: POST, path: "/disposition-cases/{caseId}/approve", description: "Approve a proposed disposition (snapshots affected pools)", roles: [TeamAdmin], code: 200, input: [], output: DispositionCase, side_effects: ["status -> APPROVED", "affected_pool_ids snapshot"] }
  - { method: POST, path: "/disposition-cases/{caseId}/reject", description: "Reject a proposed disposition", roles: [TeamAdmin], code: 200, input: [], output: DispositionCase, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/disposition-cases/{caseId}/execute", description: "Execute an approved disposition (write-off / carryover / memorabilia sale)", roles: [EquipmentManager], code: 200, input: [], output: DispositionCase, side_effects: ["units_disposed / proceeds_cents computed", "disposal methods close affected pools", "status -> EXECUTED"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO 8601 UTC). Server startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time.", roles: [TeamAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set; affects expiry/overdue/age computations"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not permitted on this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, invalid enum/type/range (jersey_number 0..99, quantity > 0, pct 0..1, unparseable date), or MEMORABILIA_SALE without unit_price_cents" }
  - { id: ERR_PLAYER_NOT_FOUND, http: 404, condition: "player id does not exist" }
  - { id: ERR_POOL_NOT_FOUND, http: 404, condition: "pool id does not exist (or no pool matches an order line's season/garment/size)" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "supplier contract id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "kit order id does not exist" }
  - { id: ERR_KIT_ASSIGNMENT_NOT_FOUND, http: 404, condition: "kit assignment id does not exist" }
  - { id: ERR_GEAR_ITEM_NOT_FOUND, http: 404, condition: "gear item id does not exist" }
  - { id: ERR_RECONDITIONING_JOB_NOT_FOUND, http: 404, condition: "reconditioning job id does not exist" }
  - { id: ERR_GAME_EVENT_NOT_FOUND, http: 404, condition: "game event id does not exist" }
  - { id: ERR_DAMAGE_CLAIM_NOT_FOUND, http: 404, condition: "damage claim id does not exist" }
  - { id: ERR_DISPOSITION_CASE_NOT_FOUND, http: 404, condition: "disposition case id does not exist" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires contract in ACTIVE state (order create, amendments); activate requires DRAFT" }
  - { id: ERR_POOL_CLOSED, http: 409, condition: "Pool is CLOSED (dispositioned); no reservations, adjustments, or laundry loads against it" }
  - { id: ERR_OPEN_ORDERS_EXIST, http: 409, condition: "Contract close blocked by orders in SUBMITTED or PARTIALLY_RECEIVED" }
  - { id: ERR_ORDER_NOT_OPEN, http: 409, condition: "receive/cancel requires order in SUBMITTED or PARTIALLY_RECEIVED" }
  - { id: ERR_RECEIVE_EXCEEDS_OUTSTANDING, http: 409, condition: "received quantity for a line exceeds ordered minus already received" }
  - { id: ERR_KIT_NOT_RESERVED, http: 409, condition: "issue/release requires kit in RESERVED" }
  - { id: ERR_KIT_NOT_ISSUED, http: 409, condition: "return (or claim subject state) requires kit in ISSUED" }
  - { id: ERR_GEAR_NOT_IN_STOCK, http: 409, condition: "issue/retire/job-create requires gear in IN_STOCK" }
  - { id: ERR_GEAR_NOT_ISSUED, http: 409, condition: "gear return requires status ISSUED" }
  - { id: ERR_JOB_NOT_OPEN, http: 409, condition: "record-result requires job in OUT" }
  - { id: ERR_EVENT_NOT_SCHEDULED, http: 409, condition: "lock-kit/cancel requires event in SCHEDULED (cancel also allows KIT_LOCKED)" }
  - { id: ERR_EVENT_NOT_LOCKED, http: 409, condition: "complete requires event in KIT_LOCKED" }
  - { id: ERR_LAUNDRY_INVALID_TRANSITION, http: 409, condition: "laundry-advance from NOT_STARTED or CLOSED" }
  - { id: ERR_LAUNDRY_NOT_READY, http: 409, condition: "lock-kit blocked: a prior same-season COMPLETED event still has laundry COLLECTING or IN_WASH" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 409, condition: "complete blocked: a required checklist item is still PENDING" }
  - { id: ERR_CLAIM_NOT_REPORTED, http: 409, condition: "assess requires claim in REPORTED" }
  - { id: ERR_CLAIM_NOT_ASSESSED, http: 409, condition: "settle/waive/reopen requires claim in ASSESSED" }
  - { id: ERR_DISPOSITION_NOT_PROPOSED, http: 409, condition: "approve/reject requires case in PROPOSED" }
  - { id: ERR_DISPOSITION_NOT_APPROVED, http: 409, condition: "execute requires case in APPROVED" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Invalid status transition requested (e.g. PATCH /players with a transition not allowed from the current status)" }
  - { id: ERR_PLAYER_NOT_ACTIVE, http: 409, condition: "kit issue / gear issue requires player ACTIVE" }
  - { id: ERR_PLAYER_HAS_ISSUED_KITS, http: 409, condition: "player release blocked by kits still ISSUED" }
  - { id: ERR_GEAR_CERTIFICATION_EXPIRED, http: 409, condition: "HELMET/SHOULDER_PADS issue with missing certification or certification_expires_on <= now" }
  - { id: ERR_GEAR_CONDITION_NOT_ISSUABLE, http: 409, condition: "gear with condition_grade F cannot be issued" }
  - { id: ERR_PLAYER_GEAR_LIMIT_REACHED, http: 409, condition: "player already holds an ISSUED gear item of the same item_type" }
  - { id: ERR_JERSEY_NUMBER_TAKEN, http: 409, condition: "(season_label, jersey_number) already held by a kit in RESERVED or ISSUED" }
  - { id: ERR_ASSET_TAG_TAKEN, http: 409, condition: "gear asset_tag already registered" }
  - { id: ERR_POOL_ALREADY_EXISTS, http: 409, condition: "pool with same (season_label, garment_type, size_code) already exists" }
  - { id: ERR_POOL_SEASON_MISMATCH, http: 409, condition: "kit pools' season_label must equal the kit's season_label" }
  - { id: ERR_GARMENT_NOT_COVERED_BY_CONTRACT, http: 409, condition: "order line garment_type absent from contract allocation_caps" }
  - { id: ERR_CLAIM_PLAYER_MISMATCH, http: 409, condition: "claim subject not currently issued to claim.player_id" }
  - { id: ERR_INVALID_CLAIM_SUBJECT, http: 400, condition: "exactly one of kit_assignment_id / gear_item_id must be set" }
  - { id: ERR_EVENT_SPACING_VIOLATION, http: 409, condition: "kickoff within 48h of another non-cancelled same-season event" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 409, condition: "provider already has 2 OUT jobs whose windows overlap the new job" }
  - { id: ERR_ALTERNATE_KIT_LIMIT_REACHED, http: 409, condition: "season already has 3 non-cancelled ALTERNATE designations" }
  - { id: ERR_ALLOCATION_CAP_EXCEEDED, http: 402, condition: "order would push units_committed above the garment_type allocation cap" }
  - { id: ERR_POOL_INSUFFICIENT_STOCK, http: 409, condition: "reservation or laundry load exceeds pool available_quantity" }
  - { id: ERR_STOCK_BELOW_COMMITMENTS, http: 409, condition: "stock adjustment new_stock_on_hand < reserved_quantity + in_laundry_quantity" }
  - { id: ERR_AMENDMENT_BELOW_COMMITTED, http: 409, condition: "amended cap below units_committed for a garment_type" }
  - { id: ERR_DISPOSITION_SCOPE_EMPTY, http: 409, condition: "execute with zero matching ACTIVE pools" }
  - { id: ERR_POOL_HAS_ACTIVE_COMMITMENTS, http: 409, condition: "disposition execution blocked by reserved or in-laundry units in a matching pool" }
  - { id: ERR_STALE_POOL_VERSION, http: 412, condition: "expected_pool_version does not match current InventoryPool.version" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_supplier_contract_version does not match current SupplierContract.version" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: EquipmentManager
    description: "Team equipment manager; runs day-to-day inventory, kits, gear, orders, events, claims assessment, disposition proposals/execution"
    identity: "opaque"
    exclusive_operations:
      - "POST /players, PATCH /players/{id}"
      - "POST /inventory-pools, POST /inventory-pools/{id}/stock-adjustments"
      - "POST /kit-orders, POST /kit-orders/{id}/receive, POST /kit-orders/{id}/cancel"
      - "POST /kit-assignments(+ issue/release/return)"
      - "POST /gear-items(+ issue/return/retire)"
      - "POST /reconditioning-jobs(+ record-result)"
      - "POST /game-events(+ lock-kit/complete/cancel/checklist complete)"
      - "POST /damage-claims(+ assess/settle)"
      - "POST /disposition-cases(+ execute)"
    shared_operations:
      - "all GET endpoints"
      - "POST /game-events/{id}/laundry-advance (shared with LaundryVendor)"
  - name: TeamAdmin
    description: "Team administrator; owns supplier contracts, disposition approval, claim waivers/reopens, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /supplier-contracts(+ activate/amendments/close)"
      - "POST /disposition-cases/{id}/approve, POST /disposition-cases/{id}/reject"
      - "POST /damage-claims/{id}/waive, POST /damage-claims/{id}/reopen"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: LaundryVendor
    description: "External laundry vendor; advances laundry cycles and reads state"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints"
      - "POST /game-events/{id}/laundry-advance (shared with EquipmentManager)"
