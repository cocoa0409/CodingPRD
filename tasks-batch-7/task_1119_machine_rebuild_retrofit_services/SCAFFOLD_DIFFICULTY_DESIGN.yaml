# =============================================================================
# Task 1119 — Machine Rebuild & Retrofit Services
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. All numeric asserts are code-computed
# literals from the §1.3 formulas and their pinned constants.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: residual_value_market_vs_cost_diverge
        grounds:
          - calculations.residual_value_cents
          - entities.TradeInOffer.fields.market_value_cents
          - entities.TradeInOffer.fields.cost_value_cents
        distinguishing_aspect: |
          Valuation domain (TradeInOffer on Machine): identical machine, age 10,
          wear_index 57.00 -> MARKET_COMPARABLE yields 7965128 cents while
          COST_APPROACH yields 12000000 cents; the pinned valuation_variant
          selects which one becomes residual_value_cents.
        test_recipe:
          setup:
            - "Customer C with high credit limit; LATHE machine (year 2016) with an ACCEPTED assessment of wear_index 57.00 (measurements 10/8/6) so recommended_path == MECHANICAL_REBUILD"
            - "Logical clock at the startup default 2026-05-01T00:00:00Z (age_years = 2026 - 2016 = 10)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-101", machine_type: "LATHE", year_of_manufacture: 2016, control_generation: "LEGACY", spindle_hours: 50000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "as-found scope", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
          trigger:
            - { call: "GET /api/machines/${m}", payload: {}, as: ProjectManager, captures: { m_v2: $.data.version } }
            - { call: "POST /api/machines/${m}/trade-in-offers", payload: { valuation_variant: "MARKET_COMPARABLE", expected_machine_version: "${m_v2}" }, as: ProjectManager, captures: { offer_a: $.data.id, mv_a: $.data.market_value_cents, cv_a: $.data.cost_value_cents, rv_a: $.data.residual_value_cents } }
            - { call: "GET /api/machines/${m}", payload: {}, as: ProjectManager, captures: { m_v3: $.data.version } }
            - { call: "POST /api/machines/${m}/trade-in-offers", payload: { valuation_variant: "COST_APPROACH", expected_machine_version: "${m_v3}" }, as: ProjectManager, captures: { offer_b: $.data.id, rv_b: $.data.residual_value_cents } }
            - { call: "GET /api/trade-in-offers/${offer_a}", payload: {}, as: ProjectManager, captures: { a_status: $.data.status } }
          assert:
            - "offer ${offer_a}: market_value_cents == 7965128 AND cost_value_cents == 12000000 (both variants stored on the same offer)"
            - "offer ${offer_a}: residual_value_cents == 7965128 (MARKET_COMPARABLE pinned)"
            - "offer ${offer_b}: residual_value_cents == 12000000 (COST_APPROACH pinned)"
            - "7965128 != 12000000 — identical inputs, different variants, different residual values"
            - "offer ${offer_a} status == SUPERSEDED after offer ${offer_b} creation; offer ${offer_b} status == OFFERED"

      - name: acceptance_worst_case_vs_iso_diverge
        grounds:
          - calculations.acceptance_evaluation
          - entities.AcceptanceTest.fields.evaluation_variant
          - entities.AcceptanceTest.fields.statistic_value
        distinguishing_aspect: |
          Metrology domain (AcceptanceTest on RebuildProject) — a different entity
          domain from residual_value_market_vs_cost_diverge: identical samples
          [10, 12, -8, 9, -11] PASS under WORST_CASE (statistic 12.0 <= 20.0) on a
          MECHANICAL_REBUILD project but FAIL under ISO_STATISTICAL
          (statistic 22.02 > 20.0) on a FULL_REBUILD project.
        test_recipe:
          setup:
            - "Two customers/machines with accepted assessments: M1 wear 57.00 -> decision MECHANICAL_REBUILD (WORST_CASE); M2 wear 123.00 (30/12/9) -> decision FULL_REBUILD (ISO_STATISTICAL)"
            - "Both projects fully sourced, approved, rebuilt, and in AWAITING_ACCEPTANCE with a SCHEDULED test each"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-102", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m1: $.data.id, m1_v: $.data.version } }
            - { call: "POST /api/machines/${m1}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m1_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt1: $.data.id } }
            - { call: "POST /api/assessments/${asmt1}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt1}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt1}", payload: {}, as: ProjectManager, captures: { p1: "$.data[0].id" } }
            - { call: "POST /api/projects/${p1}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-102", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 900000, stock_quantity: 5, lead_time_days: 7 }, as: PlatformAdmin, captures: { pa1: $.data.id } }
            - { call: "POST /api/projects/${p1}/part-lines", payload: { part_id: "${pa1}", quantity: 1 }, as: ProjectManager, captures: { line1: $.data.id } }
            - { call: "GET /api/projects/${p1}", payload: {}, as: ProjectManager, captures: { p1_v: $.data.version } }
            - { call: "POST /api/projects/${p1}/quote", payload: { expected_project_version: "${p1_v}" }, as: ProjectManager }
            - { call: "POST /api/projects/${p1}/quote/send", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${p1}/quote/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /api/projects/${p1}/begin-sourcing", payload: {}, as: ProjectManager }
            - { call: "POST /api/part-lines/${line1}/fulfill", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /api/projects/${p1}/start-rebuild", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${p1}/declare-ready", payload: {}, as: RebuildEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/projects/${p1}/acceptance-tests", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { t1: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-103", machine_type: "MILL", year_of_manufacture: 2015, control_generation: "LEGACY", spindle_hours: 70000 }, as: PlatformAdmin, captures: { m2: $.data.id, m2_v: $.data.version } }
            - { call: "POST /api/machines/${m2}/assessments", payload: { positioning_deviation_microns: 30, spindle_runout_microns: 12, backlash_microns: 9, scope_notes: "s", expected_machine_version: "${m2_v}" }, as: Assessor, as_user_id: "assessor-2", captures: { asmt2: $.data.id } }
            - { call: "POST /api/assessments/${asmt2}/submit", payload: {}, as: Assessor, as_user_id: "assessor-2" }
            - { call: "POST /api/assessments/${asmt2}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt2}", payload: {}, as: ProjectManager, captures: { p2: "$.data[0].id" } }
            - { call: "POST /api/projects/${p2}/decision", payload: { decision: "FULL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-103", description: "Spindle cartridge", oem_status: "ACTIVE", unit_cost_cents: 900000, stock_quantity: 5, lead_time_days: 7 }, as: PlatformAdmin, captures: { pa2: $.data.id } }
            - { call: "POST /api/projects/${p2}/part-lines", payload: { part_id: "${pa2}", quantity: 1 }, as: ProjectManager, captures: { line2: $.data.id } }
            - { call: "GET /api/projects/${p2}", payload: {}, as: ProjectManager, captures: { p2_v: $.data.version } }
            - { call: "POST /api/projects/${p2}/quote", payload: { expected_project_version: "${p2_v}" }, as: ProjectManager }
            - { call: "POST /api/projects/${p2}/quote/send", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${p2}/quote/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /api/projects/${p2}/begin-sourcing", payload: {}, as: ProjectManager }
            - { call: "POST /api/part-lines/${line2}/fulfill", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /api/projects/${p2}/start-rebuild", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${p2}/declare-ready", payload: {}, as: RebuildEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/projects/${p2}/acceptance-tests", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { t2: $.data.id } }
          trigger:
            - { call: "POST /api/acceptance-tests/${t1}/record", payload: { samples_microns: [10, 12, -8, 9, -11], repeatability_microns: 5.0 }, as: QualityInspector, as_user_id: "qi-1", captures: { t1_stat: $.data.statistic_value, t1_status: $.data.status, t1_variant: $.data.evaluation_variant } }
            - { call: "POST /api/acceptance-tests/${t2}/record", payload: { samples_microns: [10, 12, -8, 9, -11], repeatability_microns: 5.0 }, as: QualityInspector, as_user_id: "qi-1", captures: { t2_stat: $.data.statistic_value, t2_status: $.data.status, t2_variant: $.data.evaluation_variant } }
            - { call: "GET /api/projects/${p1}", payload: {}, as: ProjectManager, captures: { p1_ws: $.data.work_status } }
            - { call: "GET /api/projects/${p2}", payload: {}, as: ProjectManager, captures: { p2_ws: $.data.work_status } }
          assert:
            - "test ${t1}: evaluation_variant == WORST_CASE, statistic_value == 12.0, status == PASSED"
            - "test ${t2}: evaluation_variant == ISO_STATISTICAL, statistic_value == 22.02, status == FAILED"
            - "identical samples produce opposite verdicts across the two variants"
            - "project ${p1} work_status == ACCEPTED; project ${p2} work_status == REWORK"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quote_nested_rounding_order
        grounds:
          - calculations.quote_price_cents
          - entities.ProjectPartLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: each OBSOLETE line rounds
          round_half_up(1 * 1333333 * 1.8) = 2399999 at line creation and the two
          lines then sum to 4799998; sum-then-round would yield 4799999 — a
          one-cent divergence that pins the evaluation order.
        test_recipe:
          setup:
            - "MECHANICAL_REBUILD project (wear 57.00) with one ACTIVE line (qty 2 @ 1250000) and two separate OBSOLETE lines (qty 1 each @ 1333333)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-104", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-104", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 1250000, stock_quantity: 10, lead_time_days: 14 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/parts", payload: { part_number: "P-B-104", description: "NC board", oem_status: "OBSOLETE", unit_cost_cents: 1333333, stock_quantity: 0, lead_time_days: 60 }, as: PlatformAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pa}", quantity: 2 }, as: ProjectManager, captures: { line_a: $.data.id, line_a_total: $.data.line_total_cents } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pb}", quantity: 1 }, as: ProjectManager, captures: { line_b1: $.data.id, line_b1_total: $.data.line_total_cents } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pb}", quantity: 1 }, as: ProjectManager, captures: { line_b2: $.data.id, line_b2_total: $.data.line_total_cents } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v}" }, as: ProjectManager, captures: { q_base: $.data.base_price_cents, q_parts: $.data.parts_total_cents, q_labor: $.data.labor_cents, q_disc: $.data.discount_cents, q_price: $.data.quote_price_cents } }
          assert:
            - "line ${line_b1}.line_total_cents == 2399999 and line ${line_b2}.line_total_cents == 2399999 (per-line round_half_up(1333333 * 1.8) = round_half_up(2399999.4))"
            - "project parts_total_cents == 7299998 (= 2500000 + 2399999 + 2399999; sum-then-round would give 7299999)"
            - "project labor_cents == 2566500 (= (120 + floor(57.00)) * 14500)"
            - "project base_price_cents == 60000000, discount_cents == 1397330 (= round_half_up(69866498 * 0.02)), quote_price_cents == 68469168"

      - name: wear_index_weighted_clamp
        grounds:
          - calculations.wear_index
          - calculations.recommended_path
        distinguishing_aspect: |
          Mode (a) — three weighted inputs with a non-linear min-clamp interaction:
          measurements 300/200/150 produce raw score 15.5 which the clamp pins to
          1.5 (wear_index 150.00, not 1550.00); a distinct mode from
          quote_nested_rounding_order's rounding-order mechanics.
        test_recipe:
          setup:
            - "Two registered machines awaiting assessment"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-105", machine_type: "GRINDER", year_of_manufacture: 2009, control_generation: "LEGACY", spindle_hours: 90000 }, as: PlatformAdmin, captures: { m1: $.data.id, m1_v: $.data.version } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-106", machine_type: "LATHE", year_of_manufacture: 2020, control_generation: "MODERN", spindle_hours: 8000 }, as: PlatformAdmin, captures: { m2: $.data.id, m2_v: $.data.version } }
          trigger:
            - { call: "POST /api/machines/${m1}/assessments", payload: { positioning_deviation_microns: 300, spindle_runout_microns: 200, backlash_microns: 150, scope_notes: "destroyed", expected_machine_version: "${m1_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { a1: $.data.id, a1_wear: $.data.wear_index, a1_path: $.data.recommended_path } }
            - { call: "POST /api/machines/${m2}/assessments", payload: { positioning_deviation_microns: 30, spindle_runout_microns: 12, backlash_microns: 9, scope_notes: "heavy wear", expected_machine_version: "${m2_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { a2: $.data.id, a2_wear: $.data.wear_index, a2_path: $.data.recommended_path } }
          assert:
            - "assessment ${a1}: wear_index == 150.0 (raw 15.5 clamped to 1.5 x 100 — unclamped would be 1550.0)"
            - "assessment ${a1}: recommended_path == FULL_REBUILD"
            - "assessment ${a2}: wear_index == 123.0 (= 0.5*1.5 + 0.3*1.2 + 0.2*0.6 = 1.23 x 100), recommended_path == FULL_REBUILD"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: project_rework_cycle_and_parallel_commercial
        grounds:
          - state_machines.RebuildProject.AWAITING_ACCEPTANCE_to_REWORK
          - state_machines.RebuildProject.REWORK_to_AWAITING_ACCEPTANCE
          - state_machines.RebuildProject.QUOTE_SENT_to_QUOTE_DRAFT
        distinguishing_aspect: |
          RebuildProject exhibits both non-linear shapes at once: the work
          dimension cycles AWAITING_ACCEPTANCE -> REWORK -> AWAITING_ACCEPTANCE
          while the parallel commercial dimension independently cycles
          QUOTE_SENT -> QUOTE_DRAFT -> QUOTE_SENT -> APPROVED; the work-cycle
          rework surcharge (3399939 cents = 5% of 67998770) accrues without
          disturbing commercial_status.
        test_recipe:
          setup:
            - "MECHANICAL_REBUILD project quoted at 67998770 (lines: 2x ACTIVE @1250000, 3x OBSOLETE @800000), quote sent, recomputed (commercial revert), re-sent, approved, sourced, rebuilt to AWAITING_ACCEPTANCE"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-107", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-107", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 1250000, stock_quantity: 10, lead_time_days: 14 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/parts", payload: { part_number: "P-B-107", description: "NC board", oem_status: "OBSOLETE", unit_cost_cents: 800000, stock_quantity: 0, lead_time_days: 60 }, as: PlatformAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pa}", quantity: 2 }, as: ProjectManager, captures: { line_a: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pb}", quantity: 3 }, as: ProjectManager, captures: { line_b: $.data.id } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v1: $.data.version } }
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v1}" }, as: ProjectManager, captures: { q_price: $.data.quote_price_cents } }
            - { call: "POST /api/projects/${proj}/quote/send", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v2: $.data.version } }
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v2}" }, as: ProjectManager, captures: { cs_reverted: $.data.commercial_status, q_rev2: $.data.quote_revision, ws_unchanged: $.data.work_status } }
            - { call: "POST /api/projects/${proj}/quote/send", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/quote/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /api/projects/${proj}/begin-sourcing", payload: {}, as: ProjectManager }
            - { call: "POST /api/part-lines/${line_a}/fulfill", payload: {}, as: LogisticsCoordinator }
            - { call: "GET /api/re-jobs?project_id=${proj}", payload: {}, as: ProjectManager, captures: { rej: "$.data[0].id" } }
            - { call: "POST /api/re-jobs/${rej}/capture-spec", payload: {}, as: RebuildEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/re-jobs/${rej}/fabricate", payload: { re_cost_cents: 500000 }, as: RebuildEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/re-jobs/${rej}/validate", payload: {}, as: QualityInspector, as_user_id: "qi-1" }
            - { call: "POST /api/projects/${proj}/start-rebuild", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/declare-ready", payload: {}, as: RebuildEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/projects/${proj}/acceptance-tests", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /api/acceptance-tests/${t1}/record", payload: { samples_microns: [25, 0, 0, 0, 0], repeatability_microns: 5.0 }, as: QualityInspector, as_user_id: "qi-1" }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { ws_fail: $.data.work_status, rc_fail: $.data.rework_cost_cents, cs_fail: $.data.commercial_status } }
            - { call: "POST /api/projects/${proj}/declare-ready", payload: {}, as: RebuildEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/projects/${proj}/acceptance-tests", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { t2: $.data.id, t2_attempt: $.data.attempt_number } }
            - { call: "POST /api/acceptance-tests/${t2}/record", payload: { samples_microns: [8, -8, 8, -8, 0], repeatability_microns: 5.0 }, as: QualityInspector, as_user_id: "qi-1" }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { ws_pass: $.data.work_status, cfc: $.data.consecutive_fail_count, acc_pos: $.data.accepted_positioning_microns } }
            - { call: "GET /api/training-records?project_id=${proj}", payload: {}, as: ProjectManager, captures: { tr_status: "$.data[0].status", tr_sessions: "$.data[0].sessions_required" } }
          assert:
            - "after quote recompute on QUOTE_SENT: commercial_status == QUOTE_DRAFT (commercial cycle revert), quote_revision == 2, work_status unchanged == DECIDED (parallel dimension independence)"
