  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: optimistic_concurrency_patient_version_increments_on_mutation
        claim_type: layer_optimistic_concurrency
        grounds:
          - "complexity_profile.complexity_layers"
          - "concurrency_rules[prescription-renew-stale-patient]"
        distinguishing_aspect: "Every successful mutation on Patient increments version by 1"
        test_recipe:
          setup: ["Fresh patient"]
          setup_api_calls:
            - call: "POST /cgm/patients"
              payload: { full_name: "CC1", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRCC1", npi: "1234567827", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-CC1", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
            - call: "GET /cgm/patients/${pt}"
              payload: {}
              as: Any
              captures: { pt_v_after: $.data.version }
          assert:
            - "initial Patient.version == 1"
            - "after prescription create, Patient.version == 2 (prescription create bumps patient version by 1)"

      - name: derived_field_reconciliation_lot_posture_recomputed_on_aer_close
        claim_type: layer_derived_field_reconciliation
        grounds:
          - "complexity_profile.complexity_layers"
          - "calculations.lot_complaint_posture_rule"
        distinguishing_aspect: "SensorLot.complaint_count and complaint_posture derived fields stay consistent with AER closures"
        test_recipe:
          setup: ["Lot with one AER (OPEN)"]
          setup_api_calls:
            - call: "POST /cgm/patients"
              payload: { full_name: "CC2", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-CC2", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/sensor-products/${prod}/sensor-lots"
              payload: { lot_code: "LCC2", quantity_manufactured: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot}/sensor-units"
              payload: { serial_number: "SN-CC2" }
              as: PlatformAdmin
              captures: { u1: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot}/adverse-event-reports"
              payload: { sensor_unit_id: "${u1}", patient_id: "${pt}", severity: "MEDIUM", event_type: "OTHER" }
              as: QualityEngineer
              captures: { aer: $.data.id }
          trigger:
            - call: "GET /cgm/sensor-lots/${lot}"
              payload: {}
              as: Any
            - call: "POST /cgm/adverse-event-reports/${aer}/investigate"
              payload: {}
              as: QualityEngineer
            - call: "POST /cgm/adverse-event-reports/${aer}/close"
              payload: { outcome: "SUBSTANTIATED" }
              as: QualityEngineer
            - call: "GET /cgm/sensor-lots/${lot}"
              payload: {}
              as: Any
          assert:
            - "before close: complaint_count == 0, posture == NORMAL"
            - "after SUBSTANTIATED close: complaint_count == 1, posture == NORMAL"

      - name: cascading_side_effects_prescription_cancel_cascade_to_pending_orders
        claim_type: layer_cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
          - "state_machines.Prescription.ACTIVE_to_CANCELLED"
        distinguishing_aspect: "Cancelling a prescription auto-cancels any PENDING_PICK SensorOrders for it"
        test_recipe:
          setup: ["Prescription with one PENDING_PICK order"]
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "CC3", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRCC3", npi: "1234567828", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-CC3", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/sensor-products/${prod}/sensor-lots"
              payload: { lot_code: "LCC3", quantity_manufactured: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "PYCC3", plan_code: "PCC3", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
              captures: { py: $.data.id }
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
            - call: "POST /cgm/prescriptions/${rx}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pt}/sensor-orders"
              payload: { prescription_id: "${rx}", coverage_verification_id: "${cv}", lot_id: "${lot}", quantity: 1 }
              as: FulfillmentAgent
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /cgm/prescriptions/${rx}/cancel"
              payload: {}
              as: Prescriber
              as_user_id: "${dr}"
            - call: "GET /cgm/sensor-orders/${ord}"
              payload: {}
              as: Any
          assert:
            - "Prescription.${rx}.status == CANCELLED"
            - "SensorOrder.${ord}.fulfillment_status == CANCELLED (cascade)"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_post_then_get_reflects_change
        claim_type: consistency_immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "A write is visible in the immediately-following GET in the same logical clock"
        test_recipe:
          setup: ["Fresh patient"]
          setup_api_calls:
            - call: "POST /cgm/patients"
              payload: { full_name: "CM1", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id }
          trigger:
            - call: "GET /cgm/patients/${pt}"
              payload: {}
              as: Any
          assert:
            - "GET returns the just-created Patient with full_name == 'CM1'"
