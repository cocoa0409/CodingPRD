        distinguishing_aspect: "The chamber rules are a two-sided conditional keyed on test_type and they sit at 340/341, above the stage gate at 510: a SALT_SPRAY run with no chamber is refused for the missing chamber even though the lot has not reached PLATED, and a HARDNESS run carrying a chamber is refused for the surplus chamber."
