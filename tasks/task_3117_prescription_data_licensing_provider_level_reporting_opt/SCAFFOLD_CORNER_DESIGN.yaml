  # ===========================================================================
  - section: endpoints
    instances:

      - name: sync_methodology_clears_stale_pin
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/report-products/{id}/sync-methodology
          - validations[priority=21]
        distinguishing_aspect: "After a methodology restate makes a product stale (pinned 1 vs current 2), sync-methodology re-pins the product and a subsequent compile succeeds."
        test_recipe:
          setup:
            - "Default clock. Methodology + one CURRENT cell for 2026-08; client; product (pinned at version 1); methodology restated to version 2 (cell now PENDING_RESTATEMENT); cell recomputed back to CURRENT; period ended 2026-08-31; one SCHEDULED delivery."
          setup_api_calls:
            - call: "POST /projection-methodologies"
              payload: { name: "M-SYNC", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, mv: $.data.version }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G1", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Client Sync", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-SYNC", prescriber_ids: [], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /projection-methodologies/${m_id}/restate"
              payload: { expected_methodology_version: "${mv}" }
              as: PlatformAdmin
            - call: "POST /projection-cells/${c_id}/recompute"
              payload: { projection_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /report-products/${pr_id}/sync-methodology"
              payload: {}
              as: PlatformAdmin
              captures: { pin: $.data.pinned_methodology_version }
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: {}
              as: PlatformAdmin
              captures: { st2: $.data.status }
          assert:
            - "compile before sync fails with ERR_PRODUCT_VERSION_STALE (HTTP 409)"
            - "sync-methodology sets pinned_methodology_version == 2"
            - "compile after sync succeeds with status COMPILED"

  # ===========================================================================
  - section: errors
    instances:

      - name: stale_version_restate_methodology_returns_412
        claim_type: Violation to Error
        grounds:
          - concurrency_rules[methodology-restate-stale-version]
          - errors[ERR_STALE_VERSION]
          - validations[priority=6]
        distinguishing_aspect: "OCC on ProjectionMethodology.version: a restate carrying the version observed before a successful restate is rejected 412 ERR_STALE_VERSION; the first restate (matching version) succeeds and bumps the version."
        test_recipe:
          setup:
            - "Methodology created (version captured)."
          setup_api_calls:
            - call: "POST /projection-methodologies"
              payload: { name: "M-OCC", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, mv: $.data.version }
          trigger:
            - call: "POST /projection-methodologies/${m_id}/restate"
              payload: { expected_methodology_version: "${mv}" }
              as: PlatformAdmin
              captures: { mv2: $.data.version }
            - call: "POST /projection-methodologies/${m_id}/restate"
              payload: { expected_methodology_version: "${mv}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first restate succeeds and version == 2"
            - "second restate with the stale captured version fails with error_id == ERR_STALE_VERSION (HTTP 412)"
            - "GET /projection-methodologies/${m_id} still shows version == 2"

      - name: stale_version_amend_agreement_returns_412
        claim_type: Violation to Error
        grounds:
          - concurrency_rules[agreement-amend-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on DataAcquisitionAgreement.version: after activate bumps the version (1 -> 2), an amend carrying the pre-activate version fails 412 while an amend with the current version succeeds and increments amendment_count."
        test_recipe:
          setup:
            - "Supplier; agreement created (version 1 captured); activated (version 2 captured)."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "SO", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id, av1: $.data.version }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
              captures: { av2: $.data.version }
          trigger:
            - call: "POST /data-acquisition-agreements/${ag_id}/amendments"
              payload: { expected_agreement_version: "${av1}", royalty_budget_cents: 2000000 }
              as: DataAcquisitionManager
              captures: { err: $.data.error_id }
            - call: "POST /data-acquisition-agreements/${ag_id}/amendments"
              payload: { expected_agreement_version: "${av2}", royalty_budget_cents: 2000000 }
              as: DataAcquisitionManager
              captures: { ac: $.data.amendment_count, bud: $.data.royalty_budget_cents }
          assert:
            - "amend with the stale pre-activate version fails with error_id == ERR_STALE_VERSION (HTTP 412)"
            - "amend with the current version succeeds: amendment_count == 1 and royalty_budget_cents == 2000000"

      - name: insufficient_entitlement_on_compile_returns_402
        claim_type: Violation to Error
        grounds:
          - validations[priority=25]
          - errors[ERR_INSUFFICIENT_ENTITLEMENT]
          - calculations.calc_entitlement_balance
        distinguishing_aspect: "Client entitlement_cells_total 2 with 3 matching CURRENT cells: compile fails 402 ERR_INSUFFICIENT_ENTITLEMENT and the delivery stays SCHEDULED with balance untouched."
        test_recipe:
          setup:
            - "Default clock. Client entitlement 2; methodology with 3 CURRENT cells for 2026-08; product; period ended 2026-08-31; one SCHEDULED delivery."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Client Poor", entitlement_cells_total: 2 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /projection-methodologies"
              payload: { name: "M-ENT", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G1", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G2", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G3", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-ENT", prescriber_ids: [], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_ENTITLEMENT with HTTP 402"
            - "GET /report-deliveries/${d_id} still SCHEDULED; GET /clients/${cl_id} balance still == 2"

      - name: royalty_budget_exhausted_on_accept_returns_402
        claim_type: Violation to Error
        grounds:
          - validations[priority=24]
          - errors[ERR_ROYALTY_BUDGET_EXHAUSTED]
          - calculations.calc_acquisition_royalty
        distinguishing_aspect: "Agreement budget 1000 cents; a 20000-record PHARMACY batch computes royalty 30000 which exceeds the remaining budget — accept fails 402 and the batch stays DEIDENTIFIED."
        test_recipe:
          setup:
            - "PHARMACY supplier, ACTIVE agreement with royalty_budget_cents 1000, profile, batch of 20000 records DEIDENTIFIED."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "SB2", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /deidentification-profiles"
              payload: { name: "DPB", salt_version: "sv1" }
              as: PrivacyOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 20000 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /data-feed-batches/${b_id}/validate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches/${b_id}/deidentify"
              payload: { deidentification_profile_id: "${dp_id}" }
              as: PrivacyOfficer
          trigger:
            - call: "POST /data-feed-batches/${b_id}/accept"
              payload: { deid_qa_score: 0.95 }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROYALTY_BUDGET_EXHAUSTED with HTTP 402 (30000 > 1000 remaining)"
            - "GET /data-feed-batches/${b_id} still DEIDENTIFIED with royalty_cents null; agreement royalty_spent_cents == 0"

      - name: delivery_window_missed_compile_too_early
        claim_type: Violation to Error
        grounds:
          - validations[priority=19]
          - errors[ERR_DELIVERY_WINDOW_MISSED]
        excluded_because:
          difficulty_instance: boundary_precision_check / compile_at_exact_period_end_date
          rationale: "The early-compile failure and the exact-boundary success are both asserted in the named §1.8 instance."

      - name: reidentification_purpose_audit_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=14]
          - errors[ERR_REIDENTIFICATION_PROHIBITED]
        distinguishing_aspect: "An audit request with purpose REIDENTIFICATION is refused 403 ERR_REIDENTIFICATION_PROHIBITED regardless of window validity — the re-identification prohibition is absolute."
        test_recipe:
          setup:
            - "One ACTIVE client."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Client ReID", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /clients/${cl_id}/audit-requests"
              payload: { window_start_date: "2026-10-01", window_end_date: "2026-10-15", purpose: "REIDENTIFICATION" }
              as: ManufacturerClient
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REIDENTIFICATION_PROHIBITED with HTTP 403"
            - "GET /clients/${cl_id}/audit-events returns total_count == 0"

      - name: suspended_client_blocks_new_audit_request
        claim_type: Violation to Error
        grounds:
          - validations[priority=13]
          - errors[ERR_CLIENT_SUSPENDED]
        distinguishing_aspect: "After an audit completes REIDENTIFICATION_ATTEMPTED (client SUSPENDED), a new audit request for that client fails 409 ERR_CLIENT_SUSPENDED; reinstate restores the right."
        test_recipe:
          setup:
            - "Client with one COMPLETED audit (outcome REIDENTIFICATION_ATTEMPTED) so client is SUSPENDED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Client Susp", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audit-requests"
              payload: { window_start_date: "2026-03-01", window_end_date: "2026-03-15", purpose: "AUDIT_COMPLIANCE" }
              as: ManufacturerClient
              as_user_id: "${cl_id}"
              captures: { au_id: $.data.id }
            - call: "POST /audit-events/${au_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /audit-events/${au_id}/complete"
              payload: { outcome: "REIDENTIFICATION_ATTEMPTED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clients/${cl_id}/audit-requests"
              payload: { window_start_date: "2026-10-01", window_end_date: "2026-10-15", purpose: "AUDIT_COMPLIANCE" }
              as: ManufacturerClient
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
            - call: "POST /clients/${cl_id}/reinstate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clients/${cl_id}/audit-requests"
              payload: { window_start_date: "2026-10-01", window_end_date: "2026-10-15", purpose: "AUDIT_COMPLIANCE" }
              as: ManufacturerClient
              as_user_id: "${cl_id}"
              captures: { au2_id: $.data.id, st2: $.data.status }
          assert:
            - "audit request while SUSPENDED fails with error_id == ERR_CLIENT_SUSPENDED (HTTP 409)"
            - "after reinstate the same request succeeds with status REQUESTED (201)"

