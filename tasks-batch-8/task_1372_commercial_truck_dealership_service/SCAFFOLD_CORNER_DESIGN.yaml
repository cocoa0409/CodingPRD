  # ==================================================================
  # Section: rbac
  # ==================================================================
  - section: rbac
    instances:
      - name: each_exclusive_endpoint_rejects_foreign_roles
        claim_type: role_denial
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "Representative exclusivity sweep: SalesConsultant cannot PATCH accounts (SalesManager), WarrantyAdministrator cannot adjudicate (OEMClaimsAdjudicator), Controller cannot sell units (SalesConsultant)."
        test_recipe:
          setup: ["account, pool+order-held, READY unit via chain"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "RbacCo", account_type: "FLEET", credit_limit_cents: 50000000 }, as: SalesManager, captures: { acct_id: $.data.id, acct_v: $.data.version } }
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88335" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
            - { call: "POST /dealership/units/${unit_id}/inspect", payload: { outcome: "PASS" }, as: ServiceManager }
          trigger:
            - { call: "PATCH /dealership/customer-accounts/${acct_id}", payload: { fleet_tier: "GOLD", expected_customer_account_version: "${acct_v}" }, as: SalesConsultant, captures: { e1: $.data.error_id } }
            - { call: "POST /dealership/units/${unit_id}/sell", payload: { customer_account_id: "${acct_id}", sale_price_cents: 12000000 }, as: Controller, captures: { e2: $.data.error_id } }
            - { call: "POST /dealership/warranty-claims", payload: { repair_order_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", claimed_labor_cents: 1, claimed_parts_cents: 0 }, as: OEMClaimsAdjudicator, captures: { e3: $.data.error_id } }
          assert:
            - "e1 == ERR_INSUFFICIENT_PERMISSIONS (SalesConsultant cannot PATCH accounts)"
            - "e2 == ERR_INSUFFICIENT_PERMISSIONS (Controller cannot sell)"
            - "e3 == ERR_INSUFFICIENT_PERMISSIONS (OEMClaimsAdjudicator cannot draft claims) — role check (p2) precedes existence (p5)"
      - name: fleet_customer_identity_is_entity_backed
        claim_type: role_identity
        grounds: ["roles[FleetCustomer]", "validations[priority=3]"]
        distinguishing_aspect: "FleetCustomer X-User-ID is the CustomerAccount id: owner approve succeeds, non-owner approve is 403."
        test_recipe:
          setup: ["RETAIL account; RO with one line; estimate submitted (PENDING_APPROVAL)"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "OwnRo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "OtherRo", account_type: "RETAIL" }, as: SalesManager, captures: { other_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042814", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, description: "l" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
          trigger:
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${other_id}", captures: { e1: $.data.error_id } }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}", captures: { st: $.data.auth_status } }
          assert:
            - "non-owner approve: ERR_INSUFFICIENT_PERMISSIONS"
            - "owner approve: auth_status == APPROVED"
      - name: estimate_decline_then_revise_cycle
        claim_type: role_shared_and_exclusive
        grounds: [state_machines.RepairOrder, "roles[ServiceAdvisor]", "roles[FleetCustomer]"]
        distinguishing_aspect: "Approval-dimension cycle: PENDING_APPROVAL -> DECLINED (customer) -> DRAFT (advisor revise) -> PENDING_APPROVAL (resubmit) -> APPROVED; each step requires the correct role."
        test_recipe:
          setup: ["RETAIL account; RO with one line; estimate submitted"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "CycleRo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042815", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, description: "l" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
          trigger:
            - { call: "POST /dealership/repair-orders/${ro_id}/decline-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}", captures: { s1: $.data.auth_status } }
            - { call: "POST /dealership/repair-orders/${ro_id}/revise", payload: {}, as: ServiceAdvisor, captures: { s2: $.data.auth_status } }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor, captures: { s3: $.data.auth_status } }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}", captures: { s4: $.data.auth_status } }
          assert:
            - "DECLINED -> DRAFT -> PENDING_APPROVAL -> APPROVED in sequence (auth dimension cycles while work stays OPEN)"

  # ==================================================================
  # Section: cross_cutting_complexity_layers
  # ==================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_rejected_on_account_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[account-patch-stale-version]"]
        distinguishing_aspect: "OCC on CustomerAccount.version: a PATCH carrying the pre-mutation version succeeds; replaying the SAME captured version after the version advanced fails with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["FLEET account created (version 1, captured)"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "OccCo", account_type: "FLEET", credit_limit_cents: 500000 }, as: SalesManager, captures: { acct_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PATCH /dealership/customer-accounts/${acct_id}", payload: { fleet_tier: "GOLD", expected_customer_account_version: "${v1}" }, as: SalesManager, captures: { v2: $.data.version, tier: $.data.fleet_tier } }
            - { call: "PATCH /dealership/customer-accounts/${acct_id}", payload: { credit_limit_cents: 600000, expected_customer_account_version: "${v1}" }, as: SalesManager, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH: tier == GOLD and version == ${v1} + 1"
            - "second PATCH with the same (now stale) version: http 412 ERR_STALE_VERSION; credit_limit_cents unchanged (500000)"
      - name: occ_stale_version_rejected_on_floorplan_adjustment
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[unit-adjustment-stale-version]"]
        distinguishing_aspect: "OCC on Unit.version: adjustment with a version captured before a sweep-driven mutation (interest accrual bumps the unit) fails 412 — cascaded mutations count as version advances."
        test_recipe:
          setup: ["NEW unit received 2026-08-15 (version captured); clock advanced to 2026-08-20 and swept (interest posts, unit version bumps)"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88336" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
            - { call: "GET /dealership/units/${unit_id}", payload: {}, as: Controller, captures: { uv: $.data.version } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
          trigger:
            - { call: "POST /dealership/units/${unit_id}/floor-plan-adjustments", payload: { amount_cents: 1000, expected_unit_version: "${uv}", note: "stale" }, as: Controller, captures: { err: $.data.error_id } }
            - { call: "GET /dealership/units/${unit_id}", payload: {}, as: Controller, captures: { uv2: $.data.version, bal2: $.data.floorplan_balance_cents } }
            - { call: "POST /dealership/units/${unit_id}/floor-plan-adjustments", payload: { amount_cents: 1000, expected_unit_version: "${uv2}", note: "fresh" }, as: Controller, captures: { bal3: $.data.floorplan_balance_cents } }
          assert:
            - "stale adjustment: http 412 ERR_STALE_VERSION (sweep bumped the version between GET and POST)"
            - "balance after sweep == 10085000 + round_half_up(10085000*0.069/360*5) == 10085000 + 9663 == 10094663"
            - "fresh adjustment with the re-read version succeeds: balance == 10095665"
      - name: derived_open_ar_reconciles_across_invoice_payment_return
        claim_type: derived_field_reconciliation
        grounds: [entities.CustomerAccount.fields.open_ar_cents, calculations.repair_order_totals]
        distinguishing_aspect: "open_ar_cents tracks sources through their lifecycle: +17325 at invoice, -17325 at payment; parts sale +3000 then full return -3000 (no restocking fee inside 30 days) nets to 0."
        test_recipe:
          setup: ["RETAIL account; RO INVOICED (due 17325); parts sale qty 3 x 1000"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "ArCo", account_type: "FLEET", credit_limit_cents: 10000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042816", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, description: "l" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "D1", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
            - { call: "POST /dealership/service-bookings/${bk_id}/check-in", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/complete-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/invoice", payload: {}, as: ServiceManager }
            - { call: "POST /dealership/parts", payload: { sku: "AR-1", part_name: "AR", list_price_cents: 1000, cost_cents: 500, on_hand: 10 }, as: PartsCounterRep, captures: { part_id: $.data.id } }
            - { call: "POST /dealership/parts-sales", payload: { customer_account_id: "${acct_id}", lines: [ { part_id: "${part_id}", quantity: 3 } ] }, as: PartsCounterRep, captures: { sale_id: $.data.id } }
            - { call: "GET /dealership/parts-sale-lines", payload: { parts_sale_id: "${sale_id}" }, as: PartsCounterRep, captures: { line_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /dealership/repair-orders/${ro_id}/post-payment", payload: { amount_cents: 17325 }, as: Controller }
            - { call: "POST /dealership/parts-sale-lines/${line_id}/return", payload: { quantity: 3 }, as: PartsCounterRep, captures: { rc: $.data.return_credit_cents } }
            - { call: "GET /dealership/customer-accounts/${acct_id}", payload: {}, as: Controller, captures: { ar: $.data.open_ar_cents } }
            - { call: "GET /dealership/parts/${part_id}", payload: {}, as: PartsCounterRep, captures: { oh: $.data.on_hand } }
          assert:
            - "after invoice + sale: open_ar was 20325 (17325 + 3000)"
            - "after payment and full return: open_ar_cents == 0"
            - "return_credit_cents == 3000 (within 30 days -> no restocking fee)"
            - "Part.on_hand == 10 (sale -3, return +3 — conserved)"
            - "PartsSale.${sale_id}.status == FULLY_RETURNED"
      - name: ops_run_checkpoint_restocking_fee_after_30_days
        claim_type: scheduled_deferred_effect
        grounds: [state_machines.PartsSale.INVOICED_to_PARTIALLY_RETURNED]
        distinguishing_aspect: "Restocking fee engages on clock age: return at day 31 incurs 15% fee (credit 850 per 1000-cent unit); return at day 30 is fee-free — the fee depends on the logical clock, not request timing."
        test_recipe:
          setup: ["RETAIL account; sale of qty 2 x 1000 at clock 2026-08-01; clock advanced to 2026-09-01 (>30 days)"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "FeeCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/parts", payload: { sku: "FEE-1", part_name: "F", list_price_cents: 1000, cost_cents: 500, on_hand: 10 }, as: PartsCounterRep, captures: { part_id: $.data.id } }
            - { call: "POST /dealership/parts-sales", payload: { customer_account_id: "${acct_id}", lines: [ { part_id: "${part_id}", quantity: 2 } ] }, as: PartsCounterRep, captures: { sale_id: $.data.id } }
            - { call: "GET /dealership/parts-sale-lines", payload: { parts_sale_id: "${sale_id}" }, as: PartsCounterRep, captures: { line_id: "$.data[0].id" } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: DealershipAdmin }
          trigger:
            - { call: "POST /dealership/parts-sale-lines/${line_id}/return", payload: { quantity: 1 }, as: PartsCounterRep, captures: { rc: $.data.return_credit_cents, st: $.data.returned_quantity } }
            - { call: "GET /dealership/parts-sales/${sale_id}", payload: {}, as: PartsCounterRep, captures: { sst: $.data.status } }
          assert:
            - "return at day 31: return_credit_cents == 850 (1000 - 15% restocking fee 150)"
            - "sale status == PARTIALLY_RETURNED (1 of 2 returned)"
      - name: cascading_receive_creates_unit_and_advance_entry
        claim_type: cascading_side_effects
        grounds: [state_machines.FactoryOrder.SHIPPED_to_DELIVERED, entities.FloorPlanEntry]
        distinguishing_aspect: "3-hop receive chain: order DELIVERED -> Unit created IN_STOCK -> ADVANCE FloorPlanEntry posted -> balance set; ledger readable via the sub-resource GET."
        test_recipe:
          setup: ["order SHIPPED at clock 2026-08-15"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
          trigger:
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88337", apr_bp: 700 }, as: SalesManager, captures: { unit_id: $.data.received_unit_id, ost: $.data.status } }
            - { call: "GET /dealership/units/${unit_id}/floor-plan-entries", payload: {}, as: Controller }
          assert:
            - "order status == DELIVERED and received_unit_id set (hop 1)"
            - "Unit exists with apr_bp == 700 (payload override of the 690 default) and status IN_STOCK (hop 2)"
            - "exactly one FloorPlanEntry: ADVANCE +10085000 at entry_date 2026-08-15, resulting_balance_cents == 10085000 (hop 3)"

  # ==================================================================
  # Section: consistency_model
  # ==================================================================
  - section: consistency_model
    instances:
      - name: mutations_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: action responses carry post-mutation state (commit returns COMMITTED + locked committed_total_cents; invoice returns computed totals) with no re-read or delay."
        test_recipe:
          setup: ["pool; order held"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-10", vocation_group: "STANDARD", capacity: 3 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "SD_114", engine_option: "DD15", axle_config: "A6X4" }, as: SalesConsultant, captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant, captures: { st: $.data.status, tot: $.data.committed_total_cents } }
          assert:
            - "commit response itself shows status == COMMITTED and committed_total_cents == 14635000 (12300000 + 1200000 + 850000 - 0 + 0 + 285000)"
            - "a subsequent GET returns identical fields (no drift between write and read)"
