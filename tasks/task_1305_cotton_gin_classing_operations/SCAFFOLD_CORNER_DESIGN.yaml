        claim_type: rbac_denial
        grounds: ["roles[CoopAccountant]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "seed sales are a CoopAccountant exclusive; WarehouseManager (who touches the same bales physically) is denied."
        test_recipe:
