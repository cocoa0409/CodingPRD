scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: wage_provisional_vs_final_diverge_on_placement_money
        grounds:
          - calculations.wage_settlement
          - entities.Placement.fields.provisional_wage_cents
          - entities.Placement.fields.final_wage_cents
          - endpoints["GET /wbl/placements/{placementId}/wage-preview"]
        distinguishing_aspect: |
          This dual-variant instance operates on the money domain of Placement: three 3.33-hour
          entries at 1275 cents/hour yield 12738 cents under PROVISIONAL (round per entry) and
          12737 cents under FINAL (sum hours then round), a divergence of exactly 1 cent.
        test_recipe:
          setup:
            - "logical clock at 2026-09-14T08:00:00Z"
            - "employer partner with current workers comp, worksite APPROVED by safety review, supervisor trained 2026-03-01"
            - "agreement EXECUTED by a coordinator different from its drafter"
            - "student aged 17 at start with an ISSUED MINOR_16_17 permit and a student-learner certificate"
            - "PAID placement at 1275 cents/hour, ACTIVE and CLEARED after training-plan approval"
            - "three LOGGED timesheet entries of exactly 3.33 hours each (total 9.99 hours)"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Ridgeview Manufacturing", naics_code: "332710", industry_sector: "MANUFACTURING", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-88120", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /wbl/worksites"
              payload: { employer_partner_id: "${emp_id}", site_name: "Ridgeview Plant A", address_line: "14 Mill Rd", hazard_class: "NON_HAZARDOUS", has_power_machinery: false, displaces_paid_employee: false, max_concurrent_students: 2 }
              as: WblCoordinator
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /wbl/safety-reviews"
              payload: { worksite_id: "${ws_id}", machinery_guarding_ok: true, hazard_findings_count: 0, orientation_documented: true, emergency_plan_on_file: true, expected_worksite_version: "${ws_v1}" }
              as: SafetyReviewer
              captures: { rev_id: $.data.id }
            - call: "POST /wbl/safety-reviews/${rev_id}/decision"
              payload: { decision: "APPROVED" }
              as: SafetyReviewer
            - call: "POST /wbl/supervisors"
              payload: { worksite_id: "${ws_id}", full_name: "Dana Ruiz", email: "dana@ridgeview.example", training_completed_on: "2026-03-01", max_student_load: 2 }
              as: WblCoordinator
              captures: { sup_id: $.data.id }
            - call: "POST /wbl/agreements"
              payload: { employer_partner_id: "${emp_id}", worksite_id: "${ws_id}", employer_signer_supervisor_id: "${sup_id}", effective_on: "2026-09-01", expires_on: "2027-06-30", insurance_rider: true }
              as: WblCoordinator
              as_user_id: "coord-drafter-1"
              captures: { agr_id: $.data.id }
            - call: "POST /wbl/agreements/${agr_id}/employer-sign"
              payload: {}
              as: EmployerSupervisor
              as_user_id: "${sup_id}"
            - call: "POST /wbl/agreements/${agr_id}/execute"
              payload: {}
              as: WblCoordinator
              as_user_id: "coord-signer-2"
            - call: "POST /wbl/students"
              payload: { full_name: "Ana Pike", birth_date: "2009-05-14", grade_level: 12, gpa: 3.20, attendance_rate: 0.96, student_learner_certificate: true, guardian_consent_on_file: true }
              as: WblCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /wbl/work-permits"
              payload: { student_id: "${stu_id}", permit_class: "MINOR_16_17", hazardous_endorsement: false }
              as: WblCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /wbl/work-permits/${per_id}/issue"
              payload: { expires_on: "2027-06-30" }
              as: ComplianceOfficer
            - call: "GET /wbl/worksites/${ws_id}"
              payload: {}
              as: WblCoordinator
              captures: { ws_v2: $.data.version }
            - call: "POST /wbl/placements"
              payload: { student_id: "${stu_id}", worksite_id: "${ws_id}", agreement_id: "${agr_id}", supervisor_id: "${sup_id}", pay_classification: "PAID", hourly_wage_cents: 1275, stipend_total_cents: 0, scheduled_weekly_hours: 12.00, start_on: "2026-09-07", end_on: "2026-12-18", credit_target_credits: 1.00, credit_award_mode: "COMPETENCY_BASED", required_evaluation_cycles: 2, transportation_mode: "PUBLIC_TRANSIT", commute_round_trip_miles: 0.00, expected_worksite_version: "${ws_v2}" }
              as: WblCoordinator
              captures: { pl_id: $.data.id, pl_v1: $.data.version }
            - call: "POST /wbl/training-plans"
              payload: { placement_id: "${pl_id}", course_code: "CTE-410", credit_hours_target: 120.00, expected_placement_version: "${pl_v1}" }
              as: WblCoordinator
