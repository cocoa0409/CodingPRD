          - state_machines.Settlement.FINAL_to_REOPENED
          - state_machines.DistributionLine.PENDING_to_VOIDED
        distinguishing_aspect: |
          Depth-3 cascade from a third distinct trigger (appeal decide): (1) appeal ->
          UPHELD causes (2) subject settlement FINAL -> REOPENED with recompute, which
          causes (3) its PENDING/APPROVED distribution lines (including the APPROVED line
          A) to flip VOIDED — compensation without touching PAID lines.
        test_recipe:
          setup:
            - "Canonical ONE_SIDED period: settlement FINAL (pool 23054), 3 PENDING lines generated, line A APPROVED; SETTLEMENT-subject appeal filed within the 30-day window (clock default 2026-08-01 == finalized_at)"
