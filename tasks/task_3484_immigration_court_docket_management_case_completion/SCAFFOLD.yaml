# =============================================================================
# SCAFFOLD.yaml — Immigration Court Docket Management & Case Completion (EOIR)
# §1.0–§1.7 seed tables. Difficulty target: beyond Expert (dense coupling,
# cyclic docket lifecycle, dual venue-change mechanisms, dual-variant metrics,
# selector policies, OCC, checkpoint lapse processing).
# =============================================================================

scenario: |
  Immigration Court Docket Management & Case Completion (Executive Office for Immigration Review): case initiation upon filing of a charging document with venue assignment and change of venue motions, master calendar and individual hearing scheduling with interpreter assignment for many languages, continuance requests for attorney representation, evidence gathering and pending applications elsewhere with adjudicator discretion, detained docket prioritization with expedited timelines and remote hearing technology, respondent representation rates and pro bono legal orientation programs affecting hearing efficiency, case completion goals and docket backlog with reassignment among courts, decision issuance with appeal to a review board and remand handling, in absentia orders and motions to reopen when notice was defective

domain_name: immigration-court-docketing
api_prefix: /eoir

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: Workflow orchestration        # docket lifecycle pipeline with branching and discretion gates
  secondary_archetype: Temporal windowing          # judge/interpreter hearing intervals, deadlines, lapse windows
  complexity_layers:
    - optimistic_concurrency                       # OCC on Case.version for hearing/decision/reassignment writes
    - cascading_side_effects                       # no-show and reopen-grant cascades span 3+ entities
    - derived_field_reconciliation                 # court backlog flags, case age metrics, duration factors
    - selector_policy                              # interpreter assignment and reassignment target courts
  entity_topology: flat                            # peer resources under /eoir joined by foreign keys
  state_machine_shape: cyclic                      # appeal/remand loop, in-absentia reopen loop, closure/recalendar loop
  relationship_patterns:
    - one_to_many                                  # Court→Case, Case→Hearing, Case→Decision, ...
    - cross_aggregate                              # Hearing→Judge/Interpreter, MotionToReopen→Decision
    - self_referential                             # Hearing.supersedes_hearing_id (continuance supersession chain)
  role_model: approval_chain                       # CourtAdministrator files → ImmigrationJudge decides; appeals → BoardMember
  consistency_model: immediate                     # every mutation visible in the same response and subsequent reads

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Court
    parent: null
    common_fields: true
    fields:
      - { name: court_code, type: string, source: input, description: "Court code; unique across all courts (ERR_COURT_CODE_NOT_UNIQUE)" }
      - { name: name, type: string, source: input, description: "Court display name" }
      - { name: city, type: string, source: input, description: "City where the court sits" }
      - { name: annual_completion_goal, type: integer, source: input, constraints: ">= 1", description: "Case completion goal for the calendar year" }
      - { name: detained_daily_hearing_capacity, type: integer, source: input, constraints: ">= 0", description: "Max detained-custody hearings per UTC calendar day" }
      - { name: pending_case_count, type: integer, source: computed, description: "Count of Cases with court_id = this court and status IN {FILED, CALENDAR, MERITS, DECIDED, APPEALED, IN_ABSENTIA, ADMIN_CLOSED}" }
      - { name: completions_ytd, type: integer, source: computed, description: "Count of Cases with court_id = this court, status COMPLETED, completed_at within [Jan 1 00:00Z of clock year, current clock]" }
      - { name: is_backlog_critical, type: boolean, source: computed, description: "pending_case_count >= ceil(0.25 * annual_completion_goal); recomputed on every mutation affecting pending_case_count" }

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - { name: court_id, type: string, source: input, description: "FK -> Court.id; home court of the judge" }
      - { name: full_name, type: string, source: input, description: "Judge full name" }
      - { name: max_pending_cases, type: integer, source: input, constraints: ">= 1", description: "Caseload cap on assigned non-terminal cases" }
      - { name: pending_case_load, type: integer, source: computed, description: "Count of Cases with assigned_judge_id = this judge and status NOT IN {COMPLETED}" }

  - name: Interpreter
    parent: null
    common_fields: true
    fields:
      - { name: court_id, type: string, source: input, description: "FK -> Court.id; court whose pool the interpreter belongs to" }
      - { name: full_name, type: string, source: input, description: "Interpreter full name" }
      - { name: language_codes, type: array, source: input, constraints: "non-empty array of ISO 639-2/T lowercase 3-letter codes", description: "Languages the interpreter covers" }
      - { name: daily_hearing_cap, type: integer, source: input, constraints: ">= 1", description: "Max SCHEDULED hearings per UTC calendar day" }

  - name: LegalOrientationProgram
    parent: null
    common_fields: true
    fields:
      - { name: court_id, type: string, source: input, description: "FK -> Court.id; court where the pro bono orientation program operates" }
      - { name: program_name, type: string, source: input, description: "Program display name" }
      - { name: coverage_pct, type: integer, source: input, constraints: "0..100", description: "Share of respondents the program reaches; >= 50 activates the master-calendar efficiency factor" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the program currently operates" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: court_id, type: string, source: input, description: "FK -> Court.id; current venue court (rewritten by granted venue motions and reassignments)" }
      - { name: case_number, type: string, source: input, description: "Charging-document case number; unique within the venue court (ERR_CASE_NUMBER_NOT_UNIQUE)" }
      - { name: respondent_full_name, type: string, source: input, description: "Respondent full name" }
      - { name: custody_status, type: enum, source: input, constraints: "DETAINED | NON_DETAINED", description: "Detained cases get expedited deadlines, remote-hearing requirement, and a lower continuance cap" }
      - { name: primary_language_code, type: string, source: input, constraints: "ISO 639-2/T lowercase 3-letter code", description: "Respondent primary language" }
      - { name: representation_status, type: enum, source: input, constraints: "PRO_SE | COUNSEL_RETAINED | PRO_BONO", description: "Representation posture; drives continuance eligibility and merits-hearing efficiency" }
      - { name: interpreter_required, type: boolean, source: input, default: true, description: "When false (English-proceeding cases), hearings are created with interpreter_id null and skip interpreter selection" }
      - { name: assigned_judge_id, type: string, source: system, description: "FK -> Judge.id; null until docketed, cleared by granted venue motions and reassignments" }
      - { name: status, type: enum, source: system, description: "FILED | CALENDAR | MERITS | DECIDED | APPEALED | IN_ABSENTIA | ADMIN_CLOSED | COMPLETED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock value at case creation (charging document filing instant)" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock when the case reached COMPLETED; null until then" }
      - { name: target_completion_date, type: datetime, source: computed, description: "filed_at + TARGET_DAYS(custody_status): 60 days DETAINED, 365 days NON_DETAINED" }
      - { name: days_pending_calendar, type: integer, source: computed, description: "floor((clock - filed_at) / 86400s); CALENDAR variant of case age" }
      - { name: days_pending_court, type: integer, source: computed, description: "count of Mon-Fri dates D with date(filed_at) < D <= date(clock); COURT_DAYS variant of case age" }
      - { name: is_past_goal, type: boolean, source: computed, description: "days_pending_calendar > TARGET_DAYS(custody_status); strict greater-than, so exactly on target is NOT past goal" }
      - { name: continuance_count, type: integer, source: computed, description: "Count of ContinuanceRequests for this case with status GRANTED" }
      - { name: priority_score, type: integer, source: computed, description: "Detained-docket scheduling priority per calculations.case_priority_score" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case the hearing belongs to" }
      - { name: hearing_type, type: enum, source: input, constraints: "MASTER_CALENDAR | INDIVIDUAL_MERITS", description: "MASTER_CALENDAR valid while case CALENDAR; INDIVIDUAL_MERITS valid while case MERITS" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (must be >= current clock)" }
      - { name: duration_minutes, type: integer, source: computed, description: "Post-rounding block length per calculations.hearing_duration_and_daily_load" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start + duration_minutes" }
      - { name: is_remote, type: boolean, source: input, default: false, description: "Remote hearing technology flag; MUST be true for DETAINED cases (ERR_DETAINED_REQUIRES_REMOTE)" }
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id; copied from Case.assigned_judge_id at creation" }
      - { name: interpreter_id, type: string, source: system, description: "FK -> Interpreter.id; null when Case.interpreter_required is false, else chosen by calculations.interpreter_assignment_selector" }
      - { name: supersedes_hearing_id, type: string, source: system, description: "FK -> Hearing.id; set on auto-created replacement hearings (continuance grant); null otherwise" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "True for system-scheduled hearings (continuance supersession, remand, reopen)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CONTINUED | NO_SHOW | CANCELLED" }

  - name: HearingNotice
    parent: null
    common_fields: true
    fields:
      - { name: hearing_id, type: string, source: input, description: "FK -> Hearing.id; the hearing whose service this notice records (at most one notice per hearing)" }
      - { name: service_method, type: enum, source: input, constraints: "MAIL | PERSONAL_SERVICE | ELECTRONIC", description: "How notice of the hearing was served on the respondent" }
      - { name: served_at, type: datetime, source: input, description: "When notice was served; must be <= current clock" }
      - { name: status, type: enum, source: system, description: "SERVED | DEFECTIVE" }

  - name: ContinuanceRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case seeking a continuance" }
      - { name: hearing_id, type: string, source: input, description: "FK -> Hearing.id; the SCHEDULED hearing the request targets" }
      - { name: reason_code, type: enum, source: input, constraints: "ATTORNEY_REPRESENTATION | EVIDENCE_GATHERING | PENDING_APPLICATION | OTHER", description: "ATTORNEY_REPRESENTATION requires the case to be PRO_SE; PENDING_APPLICATION grant administratively closes the case" }
      - { name: is_first_for_case, type: boolean, source: computed, description: "True when no prior ContinuanceRequest (any status) exists for this case; gates the attorney-representation lead-time carve-out" }
      - { name: status, type: enum, source: system, description: "PENDING | GRANTED | DENIED" }
      - { name: decided_by_judge_id, type: string, source: system, description: "FK -> Judge.id; judge who ruled (null while PENDING)" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at ruling; null while PENDING" }

  - name: ChangeOfVenueMotion
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case seeking a venue change" }
      - { name: destination_court_id, type: string, source: input, description: "FK -> Court.id; requested new venue (must differ from the case's current court)" }
      - { name: reason, type: string, source: input, description: "Movant's stated reason" }
      - { name: status, type: enum, source: system, description: "PENDING | GRANTED | DENIED" }
      - { name: decided_by_judge_id, type: string, source: system, description: "FK -> Judge.id; judge who ruled (null while PENDING)" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at ruling; null while PENDING" }

  - name: CaseReassignment
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case moved between courts" }
      - { name: from_court_id, type: string, source: system, description: "FK -> Court.id; source court (must be backlog-critical)" }
      - { name: to_court_id, type: string, source: system, description: "FK -> Court.id; destination chosen by calculations.reassignment_target_selector" }
      - { name: reason, type: string, source: system, description: "Always BACKLOG_REBALANCE for this admin-driven transfer" }
      - { name: executed_at, type: datetime, source: system, description: "Logical clock when the reassignment executed" }

  - name: Decision
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; decided case (input on judge-issued decisions; system-set on in-absentia cascade decisions)" }
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id; issuing judge (the acting judge, or the no-show hearing's judge for in-absentia orders)" }
      - { name: outcome, type: enum, source: input, constraints: "GRANT_RELIEF | REMOVAL | TERMINATION | IN_ABSENTIA_REMOVAL", description: "IN_ABSENTIA_REMOVAL is system-only (record-no-show cascade); supplying it to POST /eoir/decisions yields ERR_IN_ABSENTIA_OUTCOME_NOT_CREATABLE" }
      - { name: source_hearing_id, type: string, source: system, description: "FK -> Hearing.id; the no-show hearing that produced an IN_ABSENTIA_REMOVAL decision; null for judge-issued decisions" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issuance" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "issued_at + 30 days; appeal filing accepts clock <= appeal_deadline (inclusive)" }
      - { name: reopen_deadline, type: datetime, source: computed, description: "issued_at + 180 days; only set when outcome = IN_ABSENTIA_REMOVAL, else null; EXCEPTIONAL_CIRCUMSTANCES motions accept clock <= reopen_deadline (inclusive)" }
      - { name: status, type: enum, source: system, description: "ISSUED | APPEAL_PENDING | FINAL | REMANDED | RESCINDED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: decision_id, type: string, source: input, description: "FK -> Decision.id; the decision under appeal" }
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; copied from the decision" }
      - { name: grounds, type: string, source: input, required: false, description: "Optional statement of grounds" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock at filing" }
      - { name: status, type: enum, source: system, description: "FILED | AFFIRMED | REMANDED | DISMISSED" }
      - { name: remand_instructions, type: string, source: input, description: "Required iff the board ruling is REMANDED (ERR_REMAND_INSTRUCTIONS_REQUIRED); null otherwise" }
      - { name: decided_by_board_member_id, type: string, source: system, description: "Opaque X-User-ID of the deciding BoardMember; null while FILED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at ruling; null while FILED" }

  - name: MotionToReopen
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the in-absentia case" }
      - { name: decision_id, type: string, source: input, description: "FK -> Decision.id; the IN_ABSENTIA_REMOVAL decision to rescind" }
      - { name: basis, type: enum, source: input, constraints: "NOTICE_DEFECTIVE | EXCEPTIONAL_CIRCUMSTANCES", description: "NOTICE_DEFECTIVE requires the source hearing's notice to be DEFECTIVE and is exempt from the 180-day window; EXCEPTIONAL_CIRCUMSTANCES is window-bound" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock at filing" }
      - { name: status, type: enum, source: system, description: "FILED | GRANTED | DENIED" }
      - { name: decided_by_judge_id, type: string, source: system, description: "FK -> Judge.id; judge who ruled (null while FILED)" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at ruling; null while FILED" }

  - name: DocketReview
    parent: null
    common_fields: false
    fields:
      - { name: court_id, type: string, source: system, description: "FK -> Court.id; court whose docket the checkpoint reviews (from path)" }
      - { name: run_index, type: integer, source: system, description: "Per-court monotonic counter starting at 1; each POST creates a new immutable snapshot" }
      - { name: computed_at, type: datetime, source: system, description: "Logical clock at run time" }
      - { name: pending_case_count, type: integer, source: computed, description: "Court pending_case_count at run time" }
      - { name: completions_ytd, type: integer, source: computed, description: "Court completions_ytd at run time" }
      - { name: representation_rate_pct, type: number, source: computed, description: "Share of the court's pending cases with representation_status != PRO_SE, 1 decimal place round_half_up; 0.0 when no pending cases" }
      - { name: pace_ratio_calendar, type: number, source: computed, description: "CALENDAR_PRORATA variant per calculations.court_completion_pace, 4 decimal places round_half_up" }
      - { name: pace_ratio_hearing_day, type: number, source: computed, description: "HEARING_DAY_PRORATA variant per calculations.court_completion_pace, 4 decimal places round_half_up" }
      - { name: is_backlog_critical, type: boolean, source: computed, description: "Court backlog flag at run time" }
      - { name: is_on_pace, type: boolean, source: computed, description: "pace_ratio_calendar >= 1.0 (the CALENDAR variant is the official pace test)" }
      - { name: cases_finalized_by_lapse, type: integer, source: computed, description: "How many cases this run moved DECIDED->COMPLETED or IN_ABSENTIA->COMPLETED because their lapse window expired" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: FILED
    terminal_states: [COMPLETED]
    transitions:
      - from: FILED
        to: CALENDAR
        trigger: "POST /eoir/cases/{caseId}/assign-judge"
        actor: CourtAdministrator
        preconditions:
          - "Case must be FILED (ERR_CASE_NOT_AWAITING_DOCKET)"
          - "Judge must exist (ERR_JUDGE_NOT_FOUND)"
          - "judge.court_id must equal case.court_id (ERR_JUDGE_WRONG_COURT)"
          - "judge.pending_case_load < judge.max_pending_cases (ERR_JUDGE_CASELOAD_FULL)"
        side_effects:
          - "Case.assigned_judge_id = judge_id"
          - "increments Case.version by 1"

      - from: CALENDAR
        to: MERITS
        trigger: "system (a MASTER_CALENDAR hearing of this case transitions SCHEDULED -> COMPLETED)"
        actor: system
        preconditions:
          - "The completed hearing is of type MASTER_CALENDAR and the case is CALENDAR"
        side_effects:
          - "increments Case.version by 1"

      - from: MERITS
        to: DECIDED
        trigger: "POST /eoir/decisions"
        actor: ImmigrationJudge
        preconditions:
          - "Case must be MERITS (ERR_CASE_NOT_IN_MERITS)"
          - "At least one COMPLETED INDIVIDUAL_MERITS hearing exists for the case (ERR_NO_COMPLETED_MERITS_HEARING)"
          - "X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
          - "OCC: expected_case_version must equal Case.version (ERR_STALE_CASE_VERSION, 412)"
        side_effects:
          - "Decision created with status ISSUED, issued_at = clock, appeal_deadline = clock + 30 days"
          - "increments Case.version by 1"

      - from: DECIDED
        to: APPEALED
        trigger: "POST /eoir/appeals"
        actor: CourtAdministrator
        preconditions:
          - "Decision.status must be ISSUED (ERR_DECISION_NOT_APPEALABLE)"
          - "clock <= decision.appeal_deadline inclusive (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects:
          - "Decision.status -> APPEAL_PENDING"
          - "increments Case.version by 1"

      - from: IN_ABSENTIA
        to: APPEALED
        trigger: "POST /eoir/appeals (appealing the in-absentia decision)"
        actor: CourtAdministrator
        preconditions:
          - "Decision.status must be ISSUED (ERR_DECISION_NOT_APPEALABLE)"
          - "clock <= decision.appeal_deadline inclusive (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects:
          - "Decision.status -> APPEAL_PENDING"
          - "increments Case.version by 1"

      - from: APPEALED
        to: COMPLETED
        trigger: "POST /eoir/appeals/{appealId}/decide with ruling AFFIRMED or DISMISSED"
        actor: BoardMember
        preconditions:
          - "Appeal must be FILED (ERR_APPEAL_ALREADY_DECIDED)"
        side_effects:
          - "Decision.status -> FINAL"
          - "Case.completed_at = clock"
          - "increments Case.version by 1"

      - from: APPEALED
        to: MERITS
        trigger: "POST /eoir/appeals/{appealId}/decide with ruling REMANDED"
        actor: BoardMember
        preconditions:
          - "Appeal must be FILED (ERR_APPEAL_ALREADY_DECIDED)"
          - "remand_instructions is required when ruling = REMANDED (ERR_REMAND_INSTRUCTIONS_REQUIRED)"
        side_effects:
          - "Decision.status -> REMANDED"
          - "Appeal.remand_instructions recorded"
          - "system auto-creates an INDIVIDUAL_MERITS hearing for the case at clock + 42 days (auto_created = true; judge = case.assigned_judge_id; interpreter re-selected; slot advances +1 day until scheduling checks pass)"
          - "increments Case.version by 1"

      - from: DECIDED
        to: COMPLETED
        trigger: "system (docket-review run observes clock > decision.appeal_deadline while Decision.status = ISSUED)"
        actor: system
        preconditions:
          - "Case DECIDED, its latest decision ISSUED, and clock > appeal_deadline at docket-review run"
        side_effects:
          - "Decision.status -> FINAL"
          - "Case.completed_at = clock"
          - "DocketReview.cases_finalized_by_lapse += 1"
          - "increments Case.version by 1"

      - from: CALENDAR
        to: IN_ABSENTIA
        trigger: "system (POST /eoir/hearings/{hearingId}/record-no-show succeeds)"
        actor: ImmigrationJudge
        preconditions:
          - "Hearing must be SCHEDULED (ERR_HEARING_NOT_SCHEDULED)"
          - "clock >= hearing.scheduled_start (ERR_HEARING_NOT_YET_DUE)"
          - "A HearingNotice exists for the hearing (ERR_NOTICE_NOT_SERVED)"
          - "That notice must be SERVED, not DEFECTIVE (ERR_NOTICE_DEFECTIVE_BLOCKS_IN_ABSENTIA)"
          - "No PENDING ContinuanceRequest targets the hearing (ERR_CONTINUANCE_PENDING_BLOCKS_NO_SHOW)"
          - "X-User-ID must equal hearing.judge_id (ERR_NOT_HEARING_JUDGE)"
        side_effects:
          - "Hearing.status -> NO_SHOW"
          - "Case.status -> IN_ABSENTIA (assigned_judge_id is retained)"
          - "system creates a Decision: outcome IN_ABSENTIA_REMOVAL, status ISSUED, judge_id = hearing.judge_id, source_hearing_id = hearing.id, issued_at = clock, appeal_deadline = clock + 30 days, reopen_deadline = clock + 180 days"
          - "increments Case.version by 1"

      - from: MERITS
        to: IN_ABSENTIA
        trigger: "system (POST /eoir/hearings/{hearingId}/record-no-show succeeds)"
        actor: ImmigrationJudge
        preconditions:
          - "Hearing must be SCHEDULED (ERR_HEARING_NOT_SCHEDULED)"
          - "clock >= hearing.scheduled_start (ERR_HEARING_NOT_YET_DUE)"
          - "A HearingNotice exists for the hearing (ERR_NOTICE_NOT_SERVED)"
          - "That notice must be SERVED, not DEFECTIVE (ERR_NOTICE_DEFECTIVE_BLOCKS_IN_ABSENTIA)"
          - "No PENDING ContinuanceRequest targets the hearing (ERR_CONTINUANCE_PENDING_BLOCKS_NO_SHOW)"
          - "X-User-ID must equal hearing.judge_id (ERR_NOT_HEARING_JUDGE)"
        side_effects:
          - "Hearing.status -> NO_SHOW"
          - "Case.status -> IN_ABSENTIA (assigned_judge_id is retained)"
          - "system creates a Decision: outcome IN_ABSENTIA_REMOVAL, status ISSUED, judge_id = hearing.judge_id, source_hearing_id = hearing.id, issued_at = clock, appeal_deadline = clock + 30 days, reopen_deadline = clock + 180 days"
          - "increments Case.version by 1"

      - from: IN_ABSENTIA
        to: CALENDAR
        trigger: "POST /eoir/motions-to-reopen/{motionId}/decide with decision GRANTED"
        actor: ImmigrationJudge
        preconditions:
          - "Motion must be FILED (ERR_MOTION_NOT_PENDING)"
          - "X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "Decision.status -> RESCINDED"
          - "Case.status -> CALENDAR"
          - "system auto-creates a MASTER_CALENDAR hearing for the case at clock + 21 days (auto_created = true; judge = case.assigned_judge_id; interpreter re-selected; slot advances +1 day until scheduling checks pass)"
          - "increments Case.version by 1"

      - from: IN_ABSENTIA
        to: COMPLETED
        trigger: "system (docket-review run observes clock > decision.reopen_deadline while Decision.status = ISSUED and no FILED MotionToReopen exists for the case)"
        actor: system
        preconditions:
          - "Case IN_ABSENTIA, its in-absentia decision ISSUED, clock > reopen_deadline, no FILED motion"
        side_effects:
          - "Decision.status -> FINAL"
          - "Case.completed_at = clock"
          - "DocketReview.cases_finalized_by_lapse += 1"
          - "increments Case.version by 1"

      - from: CALENDAR
        to: ADMIN_CLOSED
        trigger: "POST /eoir/cases/{caseId}/administrative-closure, or system (continuance granted with reason_code = PENDING_APPLICATION)"
        actor: ImmigrationJudge
        preconditions:
          - "Case must be CALENDAR or MERITS (ERR_CASE_STATE_FORBIDS_CLOSURE)"
          - "Direct endpoint: X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "All SCHEDULED hearings of the case -> CANCELLED (conditional cascade: only SCHEDULED hearings)"
          - "increments Case.version by 1"

      - from: MERITS
        to: ADMIN_CLOSED
        trigger: "POST /eoir/cases/{caseId}/administrative-closure, or system (continuance granted with reason_code = PENDING_APPLICATION)"
        actor: ImmigrationJudge
        preconditions:
          - "Case must be CALENDAR or MERITS (ERR_CASE_STATE_FORBIDS_CLOSURE)"
          - "Direct endpoint: X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "All SCHEDULED hearings of the case -> CANCELLED (conditional cascade: only SCHEDULED hearings)"
          - "increments Case.version by 1"

      - from: ADMIN_CLOSED
        to: MERITS
        trigger: "POST /eoir/cases/{caseId}/recalendar"
        actor: ImmigrationJudge
        preconditions:
          - "Case must be ADMIN_CLOSED (ERR_CASE_NOT_ADMIN_CLOSED)"
          - "X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "increments Case.version by 1"

      - from: FILED
        to: FILED
        trigger: "POST /eoir/venue-motions/{motionId}/decide with decision GRANTED, or POST /eoir/case-reassignments"
        actor: ImmigrationJudge
        preconditions:
          - "See ChangeOfVenueMotion / reassignment preconditions"
        side_effects:
          - "Case.court_id = destination court; Case.assigned_judge_id = null; Case.status = FILED"
          - "All SCHEDULED hearings of the case -> CANCELLED"
          - "increments Case.version by 1"
        note: "Venue change resets the case to FILED so the new court re-dockets it to one of its own judges."

      - from: CALENDAR
        to: FILED
        trigger: "POST /eoir/venue-motions/{motionId}/decide with decision GRANTED, or POST /eoir/case-reassignments"
        actor: ImmigrationJudge
        preconditions:
          - "See ChangeOfVenueMotion / reassignment preconditions"
        side_effects:
          - "Case.court_id = destination court; Case.assigned_judge_id = null; Case.status = FILED"
          - "All SCHEDULED hearings of the case -> CANCELLED"
          - "increments Case.version by 1"

      - from: MERITS
        to: FILED
        trigger: "POST /eoir/venue-motions/{motionId}/decide with decision GRANTED, or POST /eoir/case-reassignments"
        actor: ImmigrationJudge
        preconditions:
          - "See ChangeOfVenueMotion / reassignment preconditions"
        side_effects:
          - "Case.court_id = destination court; Case.assigned_judge_id = null; Case.status = FILED"
          - "All SCHEDULED hearings of the case -> CANCELLED"
          - "increments Case.version by 1"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CONTINUED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /eoir/hearings/{hearingId}/complete"
        actor: ImmigrationJudge
        preconditions:
          - "Hearing must be SCHEDULED (ERR_HEARING_NOT_SCHEDULED)"
          - "clock >= hearing.scheduled_start (ERR_HEARING_NOT_YET_DUE)"
          - "X-User-ID must equal hearing.judge_id (ERR_NOT_HEARING_JUDGE)"
        side_effects:
          - "If hearing_type = MASTER_CALENDAR and case.status = CALENDAR: case -> MERITS"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /eoir/hearings/{hearingId}/record-no-show"
        actor: ImmigrationJudge
        preconditions:
          - "See Case CALENDAR|MERITS -> IN_ABSENTIA preconditions (notice, continuance, ownership, clock)"
        side_effects:
          - "Case -> IN_ABSENTIA; system creates the IN_ABSENTIA_REMOVAL Decision (see Case machine)"

      - from: SCHEDULED
        to: CONTINUED
        trigger: "system (POST /eoir/continuance-requests/{requestId}/decide with decision GRANTED, reason_code != PENDING_APPLICATION)"
        actor: ImmigrationJudge
        preconditions:
          - "The granted continuance targets this hearing"
        side_effects:
          - "system auto-creates the replacement hearing: same case/type/judge and same is_remote flag, supersedes_hearing_id = this hearing, auto_created = true, scheduled_start = this.scheduled_start + CONTINUANCE_BUMP_DAYS(case.custody_status) (7 days DETAINED, 28 days NON_DETAINED; slot advances +1 day until scheduling checks pass), interpreter re-selected"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (administrative closure, PENDING_APPLICATION continuance grant, venue-motion grant, or case reassignment)"
        actor: system
        preconditions:
          - "A parent-level cascade cancels this hearing"
        side_effects: []

  - entity: HearingNotice
    initial_state: SERVED
    terminal_states: [DEFECTIVE]
    transitions:
      - from: SERVED
        to: DEFECTIVE
        trigger: "POST /eoir/notices/{noticeId}/mark-defective"
        actor: CourtAdministrator
        preconditions:
          - "Notice must be SERVED (ERR_NOTICE_ALREADY_DEFECTIVE)"
        side_effects: []
        note: "Marking a notice defective does NOT itself rescind an in-absentia order; it unlocks a NOTICE_DEFECTIVE MotionToReopen."

  - entity: ContinuanceRequest
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /eoir/continuance-requests/{requestId}/decide with decision GRANTED"
        actor: ImmigrationJudge
        preconditions:
          - "Request must be PENDING (ERR_CONTINUANCE_NOT_PENDING)"
          - "X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "If reason_code != PENDING_APPLICATION: targeted hearing -> CONTINUED and system auto-creates the superseding hearing (see Hearing machine)"
          - "If reason_code = PENDING_APPLICATION: targeted hearing -> CANCELLED, no replacement hearing, and case -> ADMIN_CLOSED (conditional cascade)"
          - "decided_by_judge_id = acting judge; decided_at = clock"

      - from: PENDING
        to: DENIED
        trigger: "POST /eoir/continuance-requests/{requestId}/decide with decision DENIED"
        actor: ImmigrationJudge
        preconditions:
          - "Request must be PENDING (ERR_CONTINUANCE_NOT_PENDING)"
          - "X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "decided_by_judge_id = acting judge; decided_at = clock; targeted hearing is untouched"

  - entity: ChangeOfVenueMotion
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /eoir/venue-motions/{motionId}/decide with decision GRANTED"
        actor: ImmigrationJudge
        preconditions:
          - "Motion must be PENDING (ERR_VENUE_MOTION_NOT_PENDING)"
          - "X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "Case.court_id = destination_court_id; Case.assigned_judge_id = null; Case.status = FILED"
          - "All SCHEDULED hearings of the case -> CANCELLED"
          - "increments Case.version by 1"

      - from: PENDING
        to: DENIED
        trigger: "POST /eoir/venue-motions/{motionId}/decide with decision DENIED"
        actor: ImmigrationJudge
        preconditions:
          - "Motion must be PENDING (ERR_VENUE_MOTION_NOT_PENDING)"
          - "X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "decided_by_judge_id = acting judge; decided_at = clock"

  - entity: Decision
    initial_state: ISSUED
    terminal_states: [FINAL, REMANDED, RESCINDED]
    transitions:
      - from: ISSUED
        to: APPEAL_PENDING
        trigger: "POST /eoir/appeals"
        actor: CourtAdministrator
        preconditions:
          - "Decision must be ISSUED (ERR_DECISION_NOT_APPEALABLE)"
          - "clock <= appeal_deadline inclusive (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects:
          - "Case.status DECIDED -> APPEALED"

      - from: APPEAL_PENDING
        to: FINAL
        trigger: "POST /eoir/appeals/{appealId}/decide with ruling AFFIRMED or DISMISSED"
        actor: BoardMember
        preconditions:
          - "Appeal must be FILED (ERR_APPEAL_ALREADY_DECIDED)"
        side_effects:
          - "Case.status APPEALED -> COMPLETED; Case.completed_at = clock"

      - from: APPEAL_PENDING
        to: REMANDED
        trigger: "POST /eoir/appeals/{appealId}/decide with ruling REMANDED"
        actor: BoardMember
        preconditions:
          - "Appeal must be FILED (ERR_APPEAL_ALREADY_DECIDED)"
          - "remand_instructions required (ERR_REMAND_INSTRUCTIONS_REQUIRED)"
        side_effects:
          - "Case.status APPEALED -> MERITS; system auto-creates the remand merits hearing at clock + 42 days"

      - from: ISSUED
        to: FINAL
        trigger: "system (docket-review lapse: appeal window expired undecided, or in-absentia reopen window expired with no FILED motion)"
        actor: system
        preconditions:
          - "clock > appeal_deadline (merits decisions) or clock > reopen_deadline with no FILED motion (in-absentia decisions), observed during POST /eoir/courts/{courtId}/docket-reviews"
        side_effects:
          - "Owning case -> COMPLETED; completed_at = clock"

      - from: ISSUED
        to: RESCINDED
        trigger: "POST /eoir/motions-to-reopen/{motionId}/decide with decision GRANTED"
        actor: ImmigrationJudge
        preconditions:
          - "Motion must be FILED; decision must be the motion's target (see MotionToReopen machine)"
        side_effects:
          - "Case.status IN_ABSENTIA -> CALENDAR; system auto-creates the reopen master hearing at clock + 21 days"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [AFFIRMED, REMANDED, DISMISSED]
    transitions:
      - from: FILED
        to: AFFIRMED
        trigger: "POST /eoir/appeals/{appealId}/decide with ruling AFFIRMED"
        actor: BoardMember
        preconditions:
          - "Appeal must be FILED (ERR_APPEAL_ALREADY_DECIDED)"
        side_effects:
          - "Decision -> FINAL; Case -> COMPLETED (completed_at = clock); decided_by_board_member_id = acting X-User-ID"

      - from: FILED
        to: REMANDED
        trigger: "POST /eoir/appeals/{appealId}/decide with ruling REMANDED"
        actor: BoardMember
        preconditions:
          - "Appeal must be FILED (ERR_APPEAL_ALREADY_DECIDED)"
          - "remand_instructions required (ERR_REMAND_INSTRUCTIONS_REQUIRED)"
        side_effects:
          - "Decision -> REMANDED; Case -> MERITS; system auto-creates remand merits hearing at clock + 42 days"

      - from: FILED
        to: DISMISSED
        trigger: "POST /eoir/appeals/{appealId}/decide with ruling DISMISSED"
        actor: BoardMember
        preconditions:
          - "Appeal must be FILED (ERR_APPEAL_ALREADY_DECIDED)"
        side_effects:
          - "Decision -> FINAL; Case -> COMPLETED (completed_at = clock)"

  - entity: MotionToReopen
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: GRANTED
        trigger: "POST /eoir/motions-to-reopen/{motionId}/decide with decision GRANTED"
        actor: ImmigrationJudge
        preconditions:
          - "Motion must be FILED (ERR_MOTION_NOT_PENDING)"
          - "X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "Decision -> RESCINDED; Case IN_ABSENTIA -> CALENDAR; system auto-creates reopen master hearing at clock + 21 days"

      - from: FILED
        to: DENIED
        trigger: "POST /eoir/motions-to-reopen/{motionId}/decide with decision DENIED"
        actor: ImmigrationJudge
        preconditions:
          - "Motion must be FILED (ERR_MOTION_NOT_PENDING)"
          - "X-User-ID must equal case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE)"
        side_effects:
          - "decided_by_judge_id = acting judge; decided_at = clock; decision and case unchanged"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's version only)
# =============================================================================
concurrency_rules:
  - rule_id: hearing-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /eoir/hearings"
    occ_field: "expected_case_version"
    description: |
      Creating a hearing against a Case whose version has advanced since the
      client last observed it is rejected. A prior writer may have scheduled a
      hearing (which legitimately occupies the case's single SCHEDULED slot) or
      otherwise mutated the case; the current writer's view is stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: decision-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /eoir/decisions"
    occ_field: "expected_case_version"
    description: |
      Issuing a decision against a Case whose version has advanced since the
      client last observed it is rejected. Another writer may have just issued
      a decision (moving the case to DECIDED) or granted a venue motion; the
      stale writer must re-read the case before deciding.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: reassignment-stale-case
    parent_entity: Case
    write_endpoint: "POST /eoir/case-reassignments"
    occ_field: "expected_case_version"
    description: |
      Reassigning a Case whose version has advanced since the client last
      observed it is rejected. The backlog metrics and case posture the writer
      relied on (e.g., a just-granted venue motion) may have changed; the
      stale writer must re-read before moving the case.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hearing_duration_and_daily_load
    trigger: "hearing creation (direct POST /eoir/hearings and system auto-created replacement/remand/reopen hearings)"
    algorithm: tiered_pricing
    formula: |
      raw_minutes =
        if hearing_type == MASTER_CALENDAR:
            30 * (0.5  if an ACTIVE LegalOrientationProgram with coverage_pct >= 50 exists
                  at the case's court else 1)
        else:  # INDIVIDUAL_MERITS
            120 * (0.75 if case.custody_status == DETAINED else 1)
                * (0.8  if case.representation_status != PRO_SE else 1)
      duration_minutes = ceil(raw_minutes / 15) * 15        # round UP to a 15-minute block
      scheduled_end = scheduled_start + duration_minutes
      Judge daily-load check (pinned rounding order — round EACH hearing first, THEN sum):
        day_load = SUM(duration_minutes) over the judge's SCHEDULED hearings whose
                   UTC calendar date equals the new hearing's date
        require day_load + duration_minutes <= 120          # equality is ALLOWED
      Rounding order is normative: per-hearing ceil-to-15 happens BEFORE the daily
      sum; summing raw minutes and rounding once afterwards is a different (wrong)
      algorithm — e.g. two represented merits hearings are 105 + 105 = 210 under the
      pinned order, not ceil(96 + 96) = 195.
    input_set: "the new hearing's case (custody, representation), the case's court LOP rows (active, coverage_pct), the judge's SCHEDULED hearings on the same UTC date"
    constants:
      MASTER_BASE_MINUTES: 30
      MERITS_BASE_MINUTES: 120
      DETAINED_MERITS_FACTOR: 0.75
      REPRESENTED_MERITS_FACTOR: 0.8
      LOP_MASTER_FACTOR: 0.5
      LOP_COVERAGE_THRESHOLD_PCT: 50
      SLOT_MINUTES: 15
      JUDGE_DAILY_MINUTE_CAP: 120
    precision: "integer minutes; ceil to multiple of 15 per hearing before any aggregation"
    note: "Duration factors are evaluated at hearing-creation time and stored on the hearing; later LOP coverage changes do NOT rewrite existing hearings (derived-field reconciliation: only new hearings see the new factor)."

  - name: case_priority_score
    trigger: "computed on every read of a Case (derived from clock, custody, and continuance history)"
    algorithm: weighted_scoring
    formula: |
      base        = 1000 if custody_status == DETAINED else 0
      age_points  = 2 * min(days_pending_calendar, 720)
      drag        = 25 * min(continuance_count, 4)
      priority_score = max(0, base + age_points - drag)
      Three inputs interact non-linearly: custody is a step function, age is a
      capped linear term, and the continuance drag is itself capped — a case with
      5 granted continuances sheds the same 100 points as one with 4.
    input_set: "Case.custody_status, Case.days_pending_calendar (CALENDAR variant), Case.continuance_count (GRANTED continuances only)"
    constants:
      DETAINED_PRIORITY_BASE: 1000
      AGE_POINTS_PER_DAY: 2
      AGE_CAP_DAYS: 720
      CONTINUANCE_DRAG_POINTS: 25
      CONTINUANCE_DRAG_CAP: 4
    precision: "integer"

  - name: days_pending
    trigger: "computed on every read of a Case"
    algorithm: chronological
    formula: |
      CALENDAR variant (official — drives is_past_goal and target_completion_date):
        days_pending_calendar = floor((clock - filed_at) / 86400 seconds)
      COURT_DAYS variant (reporting only):
        days_pending_court = count of dates D with weekday(D) in Mon..Fri
                             and date(filed_at) < D <= date(clock)
      The two variants diverge over any span containing a weekend:
      filed 2026-09-01 (Tue), clock 2026-09-11 (Fri) -> calendar 10, court 8.
      is_past_goal uses the CALENDAR variant with a strict '>' against
      TARGET_DAYS (60 DETAINED / 365 NON_DETAINED): exactly 60 days is NOT past goal.
    input_set: "Case.filed_at, logical clock, Case.custody_status"
    constants:
      TARGET_DAYS_DETAINED: 60
      TARGET_DAYS_NON_DETAINED: 365
    precision: "integer days"
    variants:
      - name: CALENDAR
        when: "official; drives is_past_goal, target_completion_date, and priority_score"
        difference: "counts every calendar day including weekends"
      - name: COURT_DAYS
        when: "reporting variant surfaced as days_pending_court"
        difference: "counts only Mon-Fri dates strictly after the filed date up to and including the clock date"

  - name: court_completion_pace
    trigger: "POST /eoir/courts/{courtId}/docket-reviews (values frozen onto the DocketReview snapshot)"
    algorithm: forward_looking
    formula: |
      completions = court.completions_ytd at run time
      CALENDAR_PRORATA variant (official — drives is_on_pace):
        elapsed_days = max(1, floor((clock - Jan 1 00:00Z of clock year) / 86400))
        pace_ratio_calendar = completions / (annual_completion_goal * elapsed_days / 365)
      HEARING_DAY_PRORATA variant (reporting):
        elapsed_hearing_days = max(1, count of Mon-Fri dates D with Jan 1 < D <= date(clock))
        pace_ratio_hearing_day = completions / (annual_completion_goal * elapsed_hearing_days / 260)
      is_on_pace = (pace_ratio_calendar >= 1.0)
      Worked anchor: goal 100, 1 completion, clock 2026-10-05 -> elapsed_days 277,
      hearing days 197 -> calendar 1/75.8904 = 0.0132, hearing-day 1/75.7692 = 0.0132.
      At clock 2026-09-10 (elapsed 252, hearing days 180) the variants split:
      calendar 0.0145 vs hearing-day 0.0144.
    input_set: "Court.annual_completion_goal, court completions_ytd at run time, logical clock"
    constants:
      DAYS_PER_YEAR: 365
      HEARING_DAYS_PER_YEAR: 260
    precision: "4 decimal places, round_half_up"
    variants:
      - name: CALENDAR_PRORATA
        when: "official pace test; is_on_pace reads this variant"
        difference: "pro-rates the annual goal over elapsed calendar days / 365"
      - name: HEARING_DAY_PRORATA
        when: "reporting variant surfaced alongside"
        difference: "pro-rates the annual goal over elapsed Mon-Fri days / 260, producing a different ratio for identical completions"

  - name: interpreter_assignment_selector
    trigger: "hearing creation (direct or auto-created) when case.interpreter_required is true"
    algorithm: constraint_propagation
    formula: |
      Candidate pool = Interpreters I where:
        (a) I.court_id == case.court_id
        (b) case.primary_language_code IN I.language_codes
        (c) count of I's SCHEDULED hearings on the new hearing's UTC date < I.daily_hearing_cap
        (d) buffer rule: for every SCHEDULED hearing H of I,
            NOT ( new_start - 15min < H.scheduled_end AND H.scheduled_start < new_end + 15min )
            — a 15-minute buffer is reserved around BOTH sides of every existing
            hearing; a gap of EXACTLY 15 minutes passes (strict inequalities).
      Ranking: fewest SCHEDULED hearings on that date ASC; tie-break I.created_at ASC.
      Fallback: empty pool -> ERR_NO_INTERPRETER_AVAILABLE (422).
      Never uses interpreter id or any random property for selection.
    input_set: "Interpreters of the case's court, their SCHEDULED hearings on the date, case.primary_language_code"
    constants:
      INTERPRETER_BUFFER_MINUTES: 15
    precision: "n/a"

  - name: reassignment_target_selector
    trigger: "POST /eoir/case-reassignments"
    algorithm: waterfall_allocation
    formula: |
      Candidate pool = Courts C where:
        (a) C.id != case.court_id
        (b) C.pending_case_count < C.annual_completion_goal   # strict
      Ranking: load_ratio = C.pending_case_count / C.annual_completion_goal ASC;
               tie-break C.created_at ASC.
      Fallback: empty pool -> ERR_NO_ELIGIBLE_COURT (422).
      The selected court becomes Case.court_id. Never uses court id for ranking.
    input_set: "all Courts and their live pending_case_count"
    precision: "load_ratio compared exactly (rational comparison pending*other.goal vs other.pending*goal to avoid float drift)"

  - name: appeal_and_reopen_windows
    trigger: "POST /eoir/appeals, POST /eoir/motions-to-reopen, docket-review lapse processing"
    algorithm: threshold
    formula: |
      appeal_deadline = decision.issued_at + 30 days
        POST /eoir/appeals requires clock <= appeal_deadline (INCLUSIVE:
        a filing at exactly appeal_deadline succeeds; one second later fails).
      reopen_deadline = decision.issued_at + 180 days (IN_ABSENTIA_REMOVAL only)
        EXCEPTIONAL_CIRCUMSTANCES motions require clock <= reopen_deadline (INCLUSIVE).
        NOTICE_DEFECTIVE motions are EXEMPT from the window entirely.
      Lapse (during docket-review): a DECIDED case whose decision is ISSUED with
      clock > appeal_deadline -> COMPLETED; an IN_ABSENTIA case whose decision is
      ISSUED with clock > reopen_deadline and no FILED motion -> COMPLETED.
    input_set: "Decision.issued_at, outcome, logical clock, open motions"
    constants:
      APPEAL_WINDOW_DAYS: 30
      REOPEN_WINDOW_DAYS: 180
    precision: "second-exact comparison on ISO8601 timestamps"

  - name: backlog_critical_flag
    trigger: "recomputed on every mutation that changes a court's pending_case_count (case create, completion, venue grant, reassignment) and surfaced on Court reads and DocketReview snapshots"
    algorithm: threshold
    formula: |
      is_backlog_critical = pending_case_count >= ceil(0.25 * annual_completion_goal)
      Boundary is INCLUSIVE: goal 8 -> critical at exactly 2 pending cases.
    input_set: "Court.pending_case_count, Court.annual_completion_goal"
    constants:
      BACKLOG_CRITICAL_RATIO: 0.25
    precision: "integer ceiling before comparison"

  - name: detained_scheduling_rules
    trigger: "client-initiated POST /eoir/hearings for a DETAINED case (system auto-created replacement/remand/reopen hearings are exempt from the expedited-deadline check — a granted continuance legitimately pushes past it — but still run judge overlap, judge daily minutes, detained daily capacity, and interpreter selection)"
    algorithm: threshold
    formula: |
      Expedited deadlines (measured from case.filed_at):
        MASTER_CALENDAR:   scheduled_start <= filed_at + 14 days (inclusive)
        INDIVIDUAL_MERITS: scheduled_start <= filed_at + 30 days (inclusive)
        violation -> ERR_DETAINED_HEARING_PAST_EXPEDITED_DEADLINE (409)
      Remote technology: is_remote must be true -> ERR_DETAINED_REQUIRES_REMOTE (409)
      Daily capacity: count of SCHEDULED hearings of DETAINED cases at the case's
      court on the new hearing's UTC date must be < court.detained_daily_hearing_capacity,
      i.e. creation is rejected when the count already equals the cap
      -> ERR_DETAINED_DAILY_CAPACITY_REACHED (409)
    input_set: "Case.custody_status/filed_at, hearing type/start/is_remote, court capacity, same-day detained SCHEDULED hearings"
    constants:
      DETAINED_MASTER_HEARING_DAYS: 14
      DETAINED_MERITS_HEARING_DAYS: 30
    precision: "second-exact"

  - name: continuance_caps_bumps_and_auto_hearing_offsets
    trigger: "POST /eoir/continuance-requests (caps and lead time at filing); continuance grant (bump); appeal remand and reopen grant (auto-hearing offsets)"
    algorithm: threshold
    formula: |
      Filing caps (checked at filing against the case's current GRANTED count):
        DETAINED:     reject when continuance_count >= 2
        NON_DETAINED: reject when continuance_count >= 5
        Boundary is inclusive-at-cap: the request that would become grant number
        cap+1 is rejected; the request filed while count == cap-1 is allowed.
      Lead time: filing requires clock <= hearing.scheduled_start - 24 hours,
        EXCEPT the case's first-ever request whose reason_code is
        ATTORNEY_REPRESENTATION (unrepresented respondents get one late carve-out).
      Grant bump: replacement hearing scheduled_start = old scheduled_start
        + 7 days (case DETAINED) / + 28 days (NON_DETAINED).
      Auto-hearing offsets: remand merits hearing at clock + 42 days;
        reopen master hearing at clock + 21 days.
      All auto-created hearings advance their candidate slot +1 calendar day
      until judge overlap, judge daily-minute cap, detained capacity, and the
      interpreter selector all pass (deterministic forward search).
    input_set: "Case.custody_status, Case.continuance_count, request reason_code and is_first_for_case, targeted hearing scheduled_start"
    constants:
      CONTINUANCE_CAP_DETAINED: 2
      CONTINUANCE_CAP_NON_DETAINED: 5
      CONTINUANCE_LEAD_HOURS: 24
      CONTINUANCE_BUMP_DAYS_DETAINED: 7
      CONTINUANCE_BUMP_DAYS_NON_DETAINED: 28
      AUTO_HEARING_REMAND_DAYS: 42
      AUTO_HEARING_REOPEN_DAYS: 21
    precision: "second-exact day arithmetic on ISO8601 timestamps"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failing check wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role must be one of CourtAdministrator, ImmigrationJudge, BoardMember; when the role is ImmigrationJudge, X-User-ID must be the id of an existing Judge. Unknown body fields are ignored (not rejected)."
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The declared role must be permitted on this endpoint per the endpoint table"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path ids and body foreign-key ids must resolve, validated left-to-right (path first, then body in declared input order)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_NOT_FOUND for LegalOrientationProgram, CaseReassignment, DocketReview)"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: auth
    check: "Role-entity ownership binding: ImmigrationJudge actions on a case require X-User-ID == case.assigned_judge_id (ERR_NOT_ASSIGNED_JUDGE); hearing complete/no-show require X-User-ID == hearing.judge_id (ERR_NOT_HEARING_JUDGE)"
    error_id: "ERR_NOT_ASSIGNED_JUDGE / ERR_NOT_HEARING_JUDGE"
    http_status: 403
    applies_to: "judge-scoped actions: assign-n/a; complete, record-no-show, POST /eoir/decisions, decide on continuances/venue-motions/motions-to-reopen, administrative-closure, recalendar"

  - priority: 5
    category: state
    check: "Entity state preconditions per §1.2 (case phase for hearing type, decision ISSUED for appeal, request/motion/appeal PENDING-or-FILED for decide, hearing SCHEDULED for complete/no-show, etc.); includes ERR_CASE_ALREADY_TERMINAL for mutations against COMPLETED cases. Ordering within this tier: the acting entity's own phase is checked first (e.g., case phase before merits-hearing existence on decision issuance); a check that needs a SECOND entity loaded (e.g., the rescindability of the decision a motion targets) runs immediately after the priority-6 linkage check for that pair."
    error_id: "ERR_CASE_NOT_AWAITING_DOCKET / ERR_CASE_STATE_FORBIDS_HEARING / ERR_CASE_ALREADY_TERMINAL / ERR_HEARING_TYPE_STAGE_MISMATCH / ERR_CASE_NOT_IN_MERITS / ERR_NO_COMPLETED_MERITS_HEARING / ERR_CASE_STATE_FORBIDS_CLOSURE / ERR_CASE_NOT_ADMIN_CLOSED / ERR_CASE_NOT_IN_ABSENTIA / ERR_HEARING_NOT_SCHEDULED / ERR_DECISION_NOT_APPEALABLE / ERR_DECISION_NOT_RESCINDABLE / ERR_APPEAL_ALREADY_DECIDED / ERR_CONTINUANCE_NOT_PENDING / ERR_VENUE_MOTION_NOT_PENDING / ERR_MOTION_NOT_PENDING / ERR_NOTICE_ALREADY_DEFECTIVE"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-entity linkage: continuance's hearing must belong to its case (ERR_HEARING_CASE_MISMATCH); motion's decision must belong to its case (ERR_DECISION_CASE_MISMATCH); assigned judge must sit at the case's court (ERR_JUDGE_WRONG_COURT)"
    error_id: "ERR_HEARING_CASE_MISMATCH / ERR_DECISION_CASE_MISMATCH / ERR_JUDGE_WRONG_COURT"
    http_status: 409
    applies_to: "POST /eoir/continuance-requests, POST /eoir/motions-to-reopen, POST /eoir/cases/{caseId}/assign-judge"

  - priority: 7
    category: business_safety
    check: "Due-process checks: in-absentia ordering requires an existing SERVED notice (ERR_NOTICE_NOT_SERVED; ERR_NOTICE_DEFECTIVE_BLOCKS_IN_ABSENTIA when the notice is DEFECTIVE); NOTICE_DEFECTIVE motions require a DEFECTIVE notice (ERR_NOTICE_NOT_DEFECTIVE)"
    error_id: "ERR_NOTICE_NOT_SERVED / ERR_NOTICE_DEFECTIVE_BLOCKS_IN_ABSENTIA / ERR_NOTICE_NOT_DEFECTIVE"
    http_status: 409
    applies_to: "POST /eoir/hearings/{hearingId}/record-no-show, POST /eoir/motions-to-reopen"

  - priority: 8
    category: business_temporal
    check: "Clock rules: hearing start not in the past (ERR_HEARING_IN_PAST); complete/no-show only at or after start (ERR_HEARING_NOT_YET_DUE); detained expedited deadlines (ERR_DETAINED_HEARING_PAST_EXPEDITED_DEADLINE); continuance lead time 24h unless first-ever ATTORNEY_REPRESENTATION request (ERR_CONTINUANCE_TOO_LATE); appeal window inclusive (ERR_APPEAL_WINDOW_EXPIRED); reopen window inclusive for EXCEPTIONAL_CIRCUMSTANCES (ERR_REOPEN_WINDOW_EXPIRED)"
    error_id: "ERR_HEARING_IN_PAST / ERR_HEARING_NOT_YET_DUE / ERR_DETAINED_HEARING_PAST_EXPEDITED_DEADLINE / ERR_CONTINUANCE_TOO_LATE / ERR_APPEAL_WINDOW_EXPIRED / ERR_REOPEN_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "hearing creation/completion/no-show, continuance filing, appeal filing, motion filing"

  - priority: 9
    category: business_constraint
    check: "Capacity/uniqueness/conflict checks: judge half-open overlap (ERR_JUDGE_SCHEDULE_CONFLICT); judge daily minute cap with per-hearing pre-rounding (ERR_JUDGE_DAILY_MINUTES_EXCEEDED); detained daily capacity (ERR_DETAINED_DAILY_CAPACITY_REACHED); one SCHEDULED hearing per case (ERR_CASE_HAS_SCHEDULED_HEARING); one PENDING continuance per hearing (ERR_CONTINUANCE_ALREADY_PENDING) and per-hearing pending blocks no-show (ERR_CONTINUANCE_PENDING_BLOCKS_NO_SHOW); continuance caps 2 DETAINED / 5 NON_DETAINED evaluated as count >= cap at filing (ERR_CONTINUANCE_CAP_REACHED); one PENDING venue motion per case (ERR_VENUE_MOTION_ALREADY_PENDING); one FILED motion to reopen per case (ERR_MOTION_ALREADY_PENDING); one notice per hearing (ERR_NOTICE_ALREADY_RECORDED); judge caseload cap (ERR_JUDGE_CASELOAD_FULL); detained hearings require is_remote = true (ERR_DETAINED_REQUIRES_REMOTE); case number unique within court (ERR_CASE_NUMBER_NOT_UNIQUE); court_code unique globally (ERR_COURT_CODE_NOT_UNIQUE); reassignment requires NON_DETAINED (ERR_DETAINED_NOT_REASSIGNABLE) and a backlog-critical source court (ERR_COURT_NOT_BACKLOG_CRITICAL)"
    error_id: "ERR_JUDGE_SCHEDULE_CONFLICT / ERR_JUDGE_DAILY_MINUTES_EXCEEDED / ERR_DETAINED_DAILY_CAPACITY_REACHED / ERR_CASE_HAS_SCHEDULED_HEARING / ERR_CONTINUANCE_ALREADY_PENDING / ERR_CONTINUANCE_PENDING_BLOCKS_NO_SHOW / ERR_CONTINUANCE_CAP_REACHED / ERR_VENUE_MOTION_ALREADY_PENDING / ERR_MOTION_ALREADY_PENDING / ERR_NOTICE_ALREADY_RECORDED / ERR_JUDGE_CASELOAD_FULL / ERR_CASE_NUMBER_NOT_UNIQUE / ERR_COURT_CODE_NOT_UNIQUE / ERR_DETAINED_NOT_REASSIGNABLE / ERR_COURT_NOT_BACKLOG_CRITICAL"
    http_status: 409
    applies_to: "creation and cascade-affecting endpoints"

  - priority: 10
    category: business_constraint
    check: "Semantic input values (well-formed but domain-invalid): destination court must differ from current (ERR_DESTINATION_COURT_IS_CURRENT); ATTORNEY_REPRESENTATION continuance requires PRO_SE (ERR_REASON_REQUIRES_PRO_SE); IN_ABSENTIA_REMOVAL may not be posted directly (ERR_IN_ABSENTIA_OUTCOME_NOT_CREATABLE); REMANDED ruling requires remand_instructions (ERR_REMAND_INSTRUCTIONS_REQUIRED); interpreter pool empty (ERR_NO_INTERPRETER_AVAILABLE); no eligible reassignment court (ERR_NO_ELIGIBLE_COURT); malformed bodies, missing required fields, invalid enum members (ERR_INVALID_REQUEST, 400)"
    error_id: "ERR_DESTINATION_COURT_IS_CURRENT / ERR_REASON_REQUIRES_PRO_SE / ERR_IN_ABSENTIA_OUTCOME_NOT_CREATABLE / ERR_REMAND_INSTRUCTIONS_REQUIRED / ERR_NO_INTERPRETER_AVAILABLE / ERR_NO_ELIGIBLE_COURT / ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: all

  - priority: 11
    category: state
    check: "OCC: expected_case_version must equal the case's current version on the three guarded write endpoints (evaluated after all business rules pass, immediately before commit)"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /eoir/hearings, POST /eoir/decisions, POST /eoir/case-reassignments"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving endpoint; default time 2026-09-01T00:00:00Z) ---
  - method: POST
    path: "/eoir/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All computed datetimes, deadlines, and lapse checks read this clock."
    roles: [CourtAdministrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; subsequent reads recompute clock-derived fields"]

  # --- Courts ---
  - method: POST
    path: "/eoir/courts"
    description: "Create an immigration court"
    roles: [CourtAdministrator]
    code: 201
    input: [court_code, name, city, annual_completion_goal, detained_daily_hearing_capacity]
    output: Court
    side_effects: ["pending_case_count = 0, completions_ytd = 0, is_backlog_critical = false"]

  - method: GET
    path: "/eoir/courts/{courtId}"
    description: "Get a court including live computed backlog fields"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: Court
    side_effects: []

  # --- Judges ---
  - method: POST
    path: "/eoir/judges"
    description: "Create a judge at a court"
    roles: [CourtAdministrator]
    code: 201
    input: [court_id, full_name, max_pending_cases]
    output: Judge
    side_effects: []

  - method: GET
    path: "/eoir/judges"
    description: "List judges with optional filters"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["court_id?", "limit?", "offset?"]
    output: "Judge[]"
    side_effects: []

  - method: GET
    path: "/eoir/judges/{judgeId}"
    description: "Get a judge"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: Judge
    side_effects: []

  # --- Interpreters ---
  - method: POST
    path: "/eoir/interpreters"
    description: "Create an interpreter in a court's pool"
    roles: [CourtAdministrator]
    code: 201
    input: [court_id, full_name, language_codes, daily_hearing_cap]
    output: Interpreter
    side_effects: []

  - method: GET
    path: "/eoir/interpreters"
    description: "List interpreters with optional filters"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["court_id?", "limit?", "offset?"]
    output: "Interpreter[]"
    side_effects: []

  - method: GET
    path: "/eoir/interpreters/{interpreterId}"
    description: "Get an interpreter"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: Interpreter
    side_effects: []

  # --- Legal Orientation Programs ---
  - method: POST
    path: "/eoir/orientation-programs"
    description: "Create a pro bono legal orientation program at a court"
    roles: [CourtAdministrator]
    code: 201
    input: [court_id, program_name, coverage_pct, "active?"]
    output: LegalOrientationProgram
    side_effects: []

  - method: GET
    path: "/eoir/orientation-programs"
    description: "List orientation programs"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["court_id?", "limit?", "offset?"]
    output: "LegalOrientationProgram[]"
    side_effects: []

  - method: GET
    path: "/eoir/orientation-programs/{programId}"
    description: "Get an orientation program"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: LegalOrientationProgram
    side_effects: []

  - method: POST
    path: "/eoir/orientation-programs/{programId}/set-coverage"
    description: "Update a program's coverage_pct and/or active flag; affects only hearings created afterwards"
    roles: [CourtAdministrator]
    code: 200
    input: ["coverage_pct?", "active?"]
    output: LegalOrientationProgram
    side_effects: ["increments LegalOrientationProgram.version by 1; future master-calendar durations re-derive the LOP factor"]

  # --- Cases ---
  - method: POST
    path: "/eoir/cases"
    description: "Initiate a case upon filing of a charging document; the supplied court_id is the initial venue assignment"
    roles: [CourtAdministrator]
    code: 201
    input: [court_id, case_number, respondent_full_name, custody_status, primary_language_code, representation_status, "interpreter_required?"]
    output: Case
    side_effects:
      - "status = FILED; filed_at = current clock; assigned_judge_id = null"
      - "venue court's pending_case_count and is_backlog_critical recompute"

  - method: GET
    path: "/eoir/cases"
    description: "List cases with optional filters"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["court_id?", "assigned_judge_id?", "status?", "custody_status?", "limit?", "offset?"]
    output: "Case[]"
    side_effects: []

  - method: GET
    path: "/eoir/cases/{caseId}"
    description: "Get a case including computed age, priority, and target fields"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: POST
    path: "/eoir/cases/{caseId}/assign-judge"
    description: "Docket a FILED case to a judge of its venue court (FILED -> CALENDAR)"
    roles: [CourtAdministrator]
    code: 200
    input: [judge_id]
    output: Case
    side_effects: ["assigned_judge_id set; status -> CALENDAR; increments Case.version by 1"]

  - method: POST
    path: "/eoir/cases/{caseId}/administrative-closure"
    description: "Judge administratively closes a CALENDAR or MERITS case (e.g. pending application elsewhere)"
    roles: [ImmigrationJudge]
    code: 200
    input: [closure_reason]
    output: Case
    side_effects: ["status -> ADMIN_CLOSED; SCHEDULED hearings -> CANCELLED; increments Case.version by 1"]

  - method: POST
    path: "/eoir/cases/{caseId}/recalendar"
    description: "Judge returns an ADMIN_CLOSED case to the merits docket"
    roles: [ImmigrationJudge]
    code: 200
    input: []
    output: Case
    side_effects: ["status -> MERITS; increments Case.version by 1"]

  # --- Hearings ---
  - method: POST
    path: "/eoir/hearings"
    description: "Schedule a master-calendar or individual-merits hearing; interpreter auto-selected when the case requires one"
    roles: [CourtAdministrator]
    code: 201
    input: [case_id, hearing_type, scheduled_start, "is_remote?", expected_case_version]
    output: Hearing
    side_effects:
      - "duration_minutes and scheduled_end computed per calculations.hearing_duration_and_daily_load"
      - "judge_id copied from case.assigned_judge_id; interpreter_id set by calculations.interpreter_assignment_selector (null when case.interpreter_required is false)"
      - "status = SCHEDULED; auto_created = false"
      - "increments Case.version by 1"

  - method: GET
    path: "/eoir/hearings"
    description: "List hearings with optional filters"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["case_id?", "judge_id?", "interpreter_id?", "supersedes_hearing_id?", "status?", "limit?", "offset?"]
    output: "Hearing[]"
    side_effects: []

  - method: GET
    path: "/eoir/hearings/{hearingId}"
    description: "Get a hearing"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  - method: POST
    path: "/eoir/hearings/{hearingId}/complete"
    description: "Record that a scheduled hearing was held"
    roles: [ImmigrationJudge]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status -> COMPLETED; MASTER_CALENDAR completion moves case CALENDAR -> MERITS"]

  - method: POST
    path: "/eoir/hearings/{hearingId}/record-no-show"
    description: "Record respondent failure to appear; with valid service this enters an in absentia removal order"
    roles: [ImmigrationJudge]
    code: 200
    input: []
    output: Hearing
    side_effects:
      - "status -> NO_SHOW"
      - "case -> IN_ABSENTIA (increments Case.version by 1)"
      - "system creates Decision (IN_ABSENTIA_REMOVAL, ISSUED, source_hearing_id = this hearing, issued_at = clock, appeal_deadline = clock + 30d, reopen_deadline = clock + 180d)"

  # --- Hearing Notices ---
  - method: POST
    path: "/eoir/notices"
    description: "Record service of a hearing notice (at most one per hearing)"
    roles: [CourtAdministrator]
    code: 201
    input: [hearing_id, service_method, served_at]
    output: HearingNotice
    side_effects: ["status = SERVED"]

  - method: GET
    path: "/eoir/hearings/{id}/notices"
    description: "List notices for a hearing (0 or 1 element)"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "HearingNotice[]"
    side_effects: []

  - method: POST
    path: "/eoir/notices/{noticeId}/mark-defective"
    description: "Mark a served notice defective (e.g. wrong address discovered)"
    roles: [CourtAdministrator]
    code: 200
    input: []
    output: HearingNotice
    side_effects: ["status -> DEFECTIVE"]

  # --- Continuance Requests ---
  - method: POST
    path: "/eoir/continuance-requests"
    description: "File a continuance request against a scheduled hearing"
    roles: [CourtAdministrator]
    code: 201
    input: [case_id, hearing_id, reason_code]
    output: ContinuanceRequest
    side_effects: ["status = PENDING; is_first_for_case computed"]

  - method: GET
    path: "/eoir/continuance-requests"
    description: "List continuance requests"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["case_id?", "hearing_id?", "status?", "decided_by_judge_id?", "limit?", "offset?"]
    output: "ContinuanceRequest[]"
    side_effects: []

  - method: GET
    path: "/eoir/continuance-requests/{requestId}"
    description: "Get a continuance request"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: ContinuanceRequest
    side_effects: []

  - method: POST
    path: "/eoir/continuance-requests/{requestId}/decide"
    description: "Judge grants or denies a continuance at their discretion"
    roles: [ImmigrationJudge]
    code: 200
    input: [decision]
    output: ContinuanceRequest
    side_effects:
      - "GRANTED with reason != PENDING_APPLICATION: hearing -> CONTINUED; superseding hearing auto-created at old start + bump (7d DETAINED / 28d NON_DETAINED); increments Case.version by 1"
      - "GRANTED with reason = PENDING_APPLICATION: hearing -> CANCELLED; case -> ADMIN_CLOSED; increments Case.version by 1"
      - "DENIED: status only"

  # --- Change of Venue Motions ---
  - method: POST
    path: "/eoir/venue-motions"
    description: "File a change-of-venue motion for a case"
    roles: [CourtAdministrator]
    code: 201
    input: [case_id, destination_court_id, reason]
    output: ChangeOfVenueMotion
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/eoir/venue-motions"
    description: "List change-of-venue motions"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["case_id?", "destination_court_id?", "status?", "decided_by_judge_id?", "limit?", "offset?"]
    output: "ChangeOfVenueMotion[]"
    side_effects: []

  - method: GET
    path: "/eoir/venue-motions/{motionId}"
    description: "Get a change-of-venue motion"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: ChangeOfVenueMotion
    side_effects: []

  - method: POST
    path: "/eoir/venue-motions/{motionId}/decide"
    description: "Judge grants or denies a change-of-venue motion; grant moves the case and resets it to FILED"
    roles: [ImmigrationJudge]
    code: 200
    input: [decision]
    output: ChangeOfVenueMotion
    side_effects: ["GRANTED: case.court_id = destination; assigned_judge_id = null; case -> FILED; SCHEDULED hearings -> CANCELLED; increments Case.version by 1"]

  # --- Case Reassignments (backlog-driven admin transfer) ---
  - method: POST
    path: "/eoir/case-reassignments"
    description: "Reassign a non-detained case out of a backlog-critical court; destination chosen by calculations.reassignment_target_selector"
    roles: [CourtAdministrator]
    code: 201
    input: [case_id, expected_case_version]
    output: CaseReassignment
    side_effects:
      - "case.court_id = selected court; assigned_judge_id = null; case -> FILED; SCHEDULED hearings -> CANCELLED"
      - "both courts' pending_case_count and is_backlog_critical recompute; global pending total is conserved"
      - "increments Case.version by 1"

  - method: GET
    path: "/eoir/case-reassignments"
    description: "List reassignments"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["case_id?", "from_court_id?", "to_court_id?", "limit?", "offset?"]
    output: "CaseReassignment[]"
    side_effects: []

  - method: GET
    path: "/eoir/case-reassignments/{reassignmentId}"
    description: "Get a reassignment record (immutable; common_fields false)"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: CaseReassignment
    side_effects: []

  # --- Decisions ---
  - method: POST
    path: "/eoir/decisions"
    description: "Judge issues a decision on a MERITS case (IN_ABSENTIA_REMOVAL outcomes are system-only)"
    roles: [ImmigrationJudge]
    code: 201
    input: [case_id, outcome, expected_case_version]
    output: Decision
    side_effects:
      - "status = ISSUED; issued_at = clock; appeal_deadline = clock + 30d; reopen_deadline = null"
      - "case -> DECIDED; increments Case.version by 1"

  - method: GET
    path: "/eoir/decisions"
    description: "List decisions"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["case_id?", "judge_id?", "source_hearing_id?", "status?", "limit?", "offset?"]
    output: "Decision[]"
    side_effects: []

  - method: GET
    path: "/eoir/decisions/{decisionId}"
    description: "Get a decision"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: Decision
    side_effects: []

  # --- Appeals ---
  - method: POST
    path: "/eoir/appeals"
    description: "File an appeal of a decision with the review board"
    roles: [CourtAdministrator]
    code: 201
    input: [decision_id, "grounds?"]
    output: Appeal
    side_effects: ["status = FILED; decision -> APPEAL_PENDING; case DECIDED|IN_ABSENTIA -> APPEALED; increments Case.version by 1"]

  - method: GET
    path: "/eoir/appeals"
    description: "List appeals"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["decision_id?", "case_id?", "status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/eoir/appeals/{appealId}"
    description: "Get an appeal"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/eoir/appeals/{appealId}/decide"
    description: "Board member affirms, remands, or dismisses an appeal; REMANDED requires remand_instructions"
    roles: [BoardMember]
    code: 200
    input: [ruling, "remand_instructions?"]
    output: Appeal
    side_effects:
      - "AFFIRMED/DISMISSED: decision -> FINAL; case -> COMPLETED (completed_at = clock)"
      - "REMANDED: decision -> REMANDED; case -> MERITS; system auto-creates INDIVIDUAL_MERITS hearing at clock + 42d (auto_created, interpreter re-selected)"
      - "increments Case.version by 1"

  # --- Motions to Reopen ---
  - method: POST
    path: "/eoir/motions-to-reopen"
    description: "File a motion to reopen an in absentia order (defective notice or exceptional circumstances)"
    roles: [CourtAdministrator]
    code: 201
    input: [case_id, decision_id, basis]
    output: MotionToReopen
    side_effects: ["status = FILED"]

  - method: GET
    path: "/eoir/motions-to-reopen"
    description: "List motions to reopen"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["case_id?", "decision_id?", "status?", "decided_by_judge_id?", "limit?", "offset?"]
    output: "MotionToReopen[]"
    side_effects: []

  - method: GET
    path: "/eoir/motions-to-reopen/{motionId}"
    description: "Get a motion to reopen"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: MotionToReopen
    side_effects: []

  - method: POST
    path: "/eoir/motions-to-reopen/{motionId}/decide"
    description: "Judge grants or denies a motion to reopen; grant rescinds the in-absentia decision and restores the case to CALENDAR"
    roles: [ImmigrationJudge]
    code: 200
    input: [decision]
    output: MotionToReopen
    side_effects:
      - "GRANTED: decision -> RESCINDED; case IN_ABSENTIA -> CALENDAR; system auto-creates MASTER_CALENDAR hearing at clock + 21d (auto_created, interpreter re-selected); increments Case.version by 1"
      - "DENIED: status only"

  # --- Docket Reviews (ops-run checkpoint) ---
  - method: POST
    path: "/eoir/courts/{courtId}/docket-reviews"
    description: "Run the docket checkpoint for a court: freeze pace/backlog metrics onto an immutable snapshot and process lapse transitions (expired appeal windows and expired in-absentia reopen windows finalize their cases)"
    roles: [CourtAdministrator]
    code: 201
    input: []
    output: DocketReview
    side_effects:
      - "creates DocketReview snapshot with run_index = previous max + 1 for this court (first run = 1)"
      - "lapse sweep: DECIDED cases with ISSUED decision and clock > appeal_deadline -> COMPLETED (decision FINAL); IN_ABSENTIA cases with ISSUED decision, clock > reopen_deadline, no FILED motion -> COMPLETED (decision FINAL); each increments Case.version by 1 and cases_finalized_by_lapse"

  - method: GET
    path: "/eoir/docket-reviews"
    description: "List docket review snapshots"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: ["court_id?", "limit?", "offset?"]
    output: "DocketReview[]"
    side_effects: []

  - method: GET
    path: "/eoir/docket-reviews/{reviewId}"
    description: "Get a docket review snapshot (immutable; common_fields false)"
    roles: [CourtAdministrator, ImmigrationJudge, BoardMember]
    code: 200
    input: []
    output: DocketReview
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value is not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role is not permitted on this endpoint" }
  # --- input shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, wrong type, or invalid enum member" }
  # --- existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced LegalOrientationProgram, CaseReassignment, or DocketReview id does not exist" }
  - { id: ERR_COURT_NOT_FOUND, http: 404, condition: "Court id does not exist" }
  - { id: ERR_JUDGE_NOT_FOUND, http: 404, condition: "Judge id does not exist" }
  - { id: ERR_INTERPRETER_NOT_FOUND, http: 404, condition: "Interpreter id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Case id does not exist" }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "Hearing id does not exist" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "HearingNotice id does not exist" }
  - { id: ERR_CONTINUANCE_NOT_FOUND, http: 404, condition: "ContinuanceRequest id does not exist" }
  - { id: ERR_VENUE_MOTION_NOT_FOUND, http: 404, condition: "ChangeOfVenueMotion id does not exist" }
  - { id: ERR_DECISION_NOT_FOUND, http: 404, condition: "Decision id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "Appeal id does not exist" }
  - { id: ERR_MOTION_NOT_FOUND, http: 404, condition: "MotionToReopen id does not exist" }
  # --- ownership (role-entity binding) ---
  - { id: ERR_NOT_ASSIGNED_JUDGE, http: 403, condition: "Judge-scoped case action where X-User-ID != case.assigned_judge_id" }
  - { id: ERR_NOT_HEARING_JUDGE, http: 403, condition: "Hearing complete/no-show where X-User-ID != hearing.judge_id" }
  # --- state ---
  - { id: ERR_CASE_NOT_AWAITING_DOCKET, http: 409, condition: "assign-judge on a case that is not FILED" }
  - { id: ERR_CASE_STATE_FORBIDS_HEARING, http: 409, condition: "Hearing creation on a case not in CALENDAR or MERITS" }
  - { id: ERR_CASE_ALREADY_TERMINAL, http: 409, condition: "Mutation targeted at a COMPLETED case" }
  - { id: ERR_HEARING_TYPE_STAGE_MISMATCH, http: 409, condition: "MASTER_CALENDAR hearing while case not CALENDAR, or INDIVIDUAL_MERITS hearing while case not MERITS" }
  - { id: ERR_CASE_NOT_IN_MERITS, http: 409, condition: "Decision issuance on a case not in MERITS" }
  - { id: ERR_NO_COMPLETED_MERITS_HEARING, http: 409, condition: "Decision issuance with no COMPLETED INDIVIDUAL_MERITS hearing on the case" }
  - { id: ERR_CASE_STATE_FORBIDS_CLOSURE, http: 409, condition: "administrative-closure on a case not in CALENDAR or MERITS" }
  - { id: ERR_CASE_NOT_ADMIN_CLOSED, http: 409, condition: "recalendar on a case not ADMIN_CLOSED" }
  - { id: ERR_CASE_NOT_IN_ABSENTIA, http: 409, condition: "MotionToReopen filed for a case not IN_ABSENTIA" }
  - { id: ERR_HEARING_NOT_SCHEDULED, http: 409, condition: "complete/record-no-show on a hearing not SCHEDULED" }
  - { id: ERR_DECISION_NOT_APPEALABLE, http: 409, condition: "Appeal filed on a decision not in ISSUED status" }
  - { id: ERR_DECISION_NOT_RESCINDABLE, http: 409, condition: "MotionToReopen targets a decision not ISSUED, or whose outcome is not IN_ABSENTIA_REMOVAL" }
  - { id: ERR_APPEAL_ALREADY_DECIDED, http: 409, condition: "decide on an appeal not in FILED status" }
  - { id: ERR_CONTINUANCE_NOT_PENDING, http: 409, condition: "decide on a continuance not in PENDING status" }
  - { id: ERR_VENUE_MOTION_NOT_PENDING, http: 409, condition: "decide on a venue motion not in PENDING status" }
  - { id: ERR_MOTION_NOT_PENDING, http: 409, condition: "decide on a motion to reopen not in FILED status" }
  - { id: ERR_NOTICE_ALREADY_DEFECTIVE, http: 409, condition: "mark-defective on a notice already DEFECTIVE" }
  # --- referential ---
  - { id: ERR_HEARING_CASE_MISMATCH, http: 409, condition: "Continuance request whose hearing_id belongs to a different case than case_id" }
  - { id: ERR_DECISION_CASE_MISMATCH, http: 409, condition: "MotionToReopen whose decision_id belongs to a different case than case_id" }
  - { id: ERR_JUDGE_WRONG_COURT, http: 409, condition: "assign-judge with a judge whose court_id differs from the case's court_id" }
  # --- safety (due process) ---
  - { id: ERR_NOTICE_NOT_SERVED, http: 409, condition: "record-no-show with no HearingNotice recorded for the hearing" }
  - { id: ERR_NOTICE_DEFECTIVE_BLOCKS_IN_ABSENTIA, http: 409, condition: "record-no-show where the hearing's notice is DEFECTIVE; an in absentia order may not rest on defective notice" }
  - { id: ERR_NOTICE_NOT_DEFECTIVE, http: 409, condition: "MotionToReopen with basis NOTICE_DEFECTIVE where the source hearing's notice is not DEFECTIVE" }
  # --- temporal ---
  - { id: ERR_HEARING_IN_PAST, http: 409, condition: "Hearing scheduled_start earlier than the current clock" }
  - { id: ERR_HEARING_NOT_YET_DUE, http: 409, condition: "complete or record-no-show before the hearing's scheduled_start" }
  - { id: ERR_DETAINED_HEARING_PAST_EXPEDITED_DEADLINE, http: 409, condition: "Detained hearing scheduled beyond filed_at + 14d (master) or + 30d (merits)" }
  - { id: ERR_CONTINUANCE_TOO_LATE, http: 409, condition: "Continuance filed later than 24h before the hearing start, unless it is the case's first-ever request with reason ATTORNEY_REPRESENTATION" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 409, condition: "Appeal filed with clock strictly after decision.appeal_deadline" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 409, condition: "EXCEPTIONAL_CIRCUMSTANCES motion filed with clock strictly after decision.reopen_deadline" }
  # --- constraint ---
  - { id: ERR_JUDGE_SCHEDULE_CONFLICT, http: 409, condition: "Judge has a SCHEDULED hearing overlapping [start, end) — half-open semantics: adjacency (end == start) is allowed" }
  - { id: ERR_JUDGE_DAILY_MINUTES_EXCEEDED, http: 409, condition: "Sum of per-hearing rounded duration_minutes for the judge that UTC date plus the new rounded duration exceeds 120" }
  - { id: ERR_DETAINED_DAILY_CAPACITY_REACHED, http: 409, condition: "Court already has detained_daily_hearing_capacity SCHEDULED detained hearings on that UTC date" }
  - { id: ERR_DETAINED_REQUIRES_REMOTE, http: 409, condition: "Hearing for a DETAINED case created without is_remote = true (remote hearing technology is mandatory on the detained docket)" }
  - { id: ERR_CASE_HAS_SCHEDULED_HEARING, http: 409, condition: "Case already has a SCHEDULED hearing; at most one is allowed" }
  - { id: ERR_CONTINUANCE_ALREADY_PENDING, http: 409, condition: "A PENDING continuance already targets this hearing" }
  - { id: ERR_CONTINUANCE_PENDING_BLOCKS_NO_SHOW, http: 409, condition: "record-no-show while a PENDING continuance targets the hearing" }
  - { id: ERR_CONTINUANCE_CAP_REACHED, http: 409, condition: "Case's GRANTED continuance count is already at cap (2 DETAINED / 5 NON_DETAINED) at filing time" }
  - { id: ERR_VENUE_MOTION_ALREADY_PENDING, http: 409, condition: "A PENDING change-of-venue motion already exists for the case" }
  - { id: ERR_MOTION_ALREADY_PENDING, http: 409, condition: "A FILED motion to reopen already exists for the case" }
  - { id: ERR_NOTICE_ALREADY_RECORDED, http: 409, condition: "A HearingNotice already exists for the hearing" }
  - { id: ERR_JUDGE_CASELOAD_FULL, http: 409, condition: "assign-judge to a judge whose pending_case_load >= max_pending_cases" }
  - { id: ERR_CASE_NUMBER_NOT_UNIQUE, http: 409, condition: "case_number already exists within the venue court" }
  - { id: ERR_COURT_CODE_NOT_UNIQUE, http: 409, condition: "court_code already exists" }
  - { id: ERR_DETAINED_NOT_REASSIGNABLE, http: 409, condition: "Reassignment of a DETAINED case (detained respondents remain with the detaining court's docket)" }
  - { id: ERR_COURT_NOT_BACKLOG_CRITICAL, http: 409, condition: "Reassignment from a court whose is_backlog_critical is false" }
  # --- semantic ---
  - { id: ERR_DESTINATION_COURT_IS_CURRENT, http: 422, condition: "Venue motion destination equals the case's current court" }
  - { id: ERR_REASON_REQUIRES_PRO_SE, http: 422, condition: "ATTORNEY_REPRESENTATION continuance on a case that is not PRO_SE" }
  - { id: ERR_IN_ABSENTIA_OUTCOME_NOT_CREATABLE, http: 422, condition: "POST /eoir/decisions with outcome IN_ABSENTIA_REMOVAL (system-only outcome)" }
  - { id: ERR_REMAND_INSTRUCTIONS_REQUIRED, http: 422, condition: "Appeal decide with ruling REMANDED but no remand_instructions" }
  - { id: ERR_NO_INTERPRETER_AVAILABLE, http: 422, condition: "Interpreter selector pool is empty for the case's language/date at its court" }
  - { id: ERR_NO_ELIGIBLE_COURT, http: 422, condition: "Reassignment selector pool is empty (every other court at or above its completion goal)" }
  # --- concurrency ---
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not equal the case's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CourtAdministrator
    description: "Court staff: files charging documents, dockets cases to judges, schedules hearings, records notices, files continuances/venue motions/appeals/motions to reopen, runs docket reviews, executes backlog reassignments, administers courts/judges/interpreters/orientation programs and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /eoir/_clock/set_current_utc"
      - "POST /eoir/courts, POST /eoir/judges, POST /eoir/interpreters, POST /eoir/orientation-programs, POST /eoir/orientation-programs/{id}/set-coverage"
      - "POST /eoir/cases, POST /eoir/cases/{id}/assign-judge"
      - "POST /eoir/hearings, POST /eoir/notices, POST /eoir/notices/{id}/mark-defective"
      - "POST /eoir/continuance-requests, POST /eoir/venue-motions, POST /eoir/appeals, POST /eoir/motions-to-reopen"
      - "POST /eoir/case-reassignments, POST /eoir/courts/{id}/docket-reviews"
    shared_operations:
      - "all GET endpoints"

  - name: ImmigrationJudge
    description: "Adjudicator: holds hearings, records no-shows, rules on continuances, venue motions, and motions to reopen, issues decisions, administratively closes and recalendars cases — only on cases assigned to that judge"
    identity: "entity_backed:Judge"
    exclusive_operations:
      - "POST /eoir/hearings/{id}/complete, POST /eoir/hearings/{id}/record-no-show"
      - "POST /eoir/decisions"
      - "POST /eoir/continuance-requests/{id}/decide, POST /eoir/venue-motions/{id}/decide, POST /eoir/motions-to-reopen/{id}/decide"
      - "POST /eoir/cases/{id}/administrative-closure, POST /eoir/cases/{id}/recalendar"
    shared_operations:
      - "all GET endpoints"

  - name: BoardMember
    description: "Review board member: rules on appeals (affirm, remand, dismiss)"
    identity: opaque
    exclusive_operations:
      - "POST /eoir/appeals/{id}/decide"
    shared_operations:
      - "all GET endpoints"
