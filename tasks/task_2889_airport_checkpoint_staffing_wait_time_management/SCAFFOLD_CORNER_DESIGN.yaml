            - "${sh_band_admin} and ${sh_band_planner} are both created — POST /time-bands is shared between PlatformAdmin and StaffingPlanner"
            - "${sh_ci} == CHECKED_IN — a DutyManager drives the duty axis on behalf of the officer; the opaque role is exempt from the ownership comparison that binds entity_backed roles"
            - "${sh_paused} == PAUSED — the SUPERVISOR-certified officer shares stand-down with CheckpointManager, and the CHECKED_IN assignment flipped to REASSIGN_PENDING"

  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: plan_create_occ_rejects_a_version_its_own_predecessor_advanced
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-checkpoint]
          - endpoints.POST_staffing-plans
          - errors[ERR_STALE_CHECKPOINT_VERSION]
        distinguishing_aspect: "POST /staffing-plans itself increments Checkpoint.version, so a client that creates one plan and reuses the same expected_checkpoint_version for a second is guaranteed to be stale — the OCC token is self-invalidating. Any unrelated write to the checkpoint (a PATCH, a wait observation) invalidates it too."
        test_recipe:
          setup: ["one checkpoint read at version 1"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_cpver
          trigger:
            - call: "POST /staffing-plans"
              payload: { checkpoint_id: "${cp_id}", operational_date: "2026-09-10", expected_checkpoint_version: "${cp_v1}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { occ_plan1: $.data.id, occ_plan1_state: $.data.state }
            - call: "POST /staffing-plans"
              payload: { checkpoint_id: "${cp_id}", operational_date: "2026-09-10", expected_checkpoint_version: "${cp_v1}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 412
              captures: { occ_stale: $.data.error_id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: StaffingPlanner
              captures: { cp_v2: $.data.version }
            - call: "POST /staffing-plans"
              payload: { checkpoint_id: "${cp_id}", operational_date: "2026-09-10", expected_checkpoint_version: "${cp_v2}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { occ_plan2: $.data.id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: StaffingPlanner
              captures: { cp_v3: $.data.version }
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { wait_threshold_minutes_standard: 14 }
              as: CheckpointManager
              captures: { occ_patch_v: $.data.version }
            - call: "POST /staffing-plans"
              payload: { checkpoint_id: "${cp_id}", operational_date: "2026-09-11", expected_checkpoint_version: "${cp_v3}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 412
              captures: { occ_stale2: $.data.error_id }
          assert:
            - "${cp_v1} == 1 and ${occ_plan1_state} == DRAFT"
            - "${occ_stale} == ERR_STALE_CHECKPOINT_VERSION (412) — the first create already advanced the checkpoint to version 2"
            - "${cp_v2} == 2 and the retry with the re-read token creates ${occ_plan2}, a SECOND DRAFT plan for the same (checkpoint, operational_date), which the product deliberately permits"
            - "${cp_v3} == 3 and ${occ_patch_v} == 4"
            - "${occ_stale2} == ERR_STALE_CHECKPOINT_VERSION (412) — an unrelated PATCH invalidated the token even for a different operational_date"
            - "exactly two plans exist: GET /staffing-plans?checkpoint_id=${cp_id} returns 2 rows, so neither rejected create left a partial row"

      - name: surge_detail_occ_pins_the_officer_ledger_the_requester_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[surge-detail-create-stale-officer]
          - endpoints.POST_surge-details
          - errors[ERR_STALE_OFFICER_VERSION]
        distinguishing_aspect: "The Officer version moves on writes the requester never made — a detail decision, a duty-status change — so the stale token here protects committed_duty_minutes rather than the row being created. Each successful create also self-invalidates, exactly like the checkpoint rule."
        test_recipe:
          setup: ["a SUBMITTED plan and one officer read at a known version"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
            - *c_submit
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { occ_off_v1: $.data.version, occ_off_committed: $.data.committed_duty_minutes }
          trigger:
            - call: "POST /surge-details"
              payload: { staffing_plan_id: "${plan_id}", officer_id: "${off_id}", event_code: "SPORTING_EVENT", window_start_utc: "2026-09-10T12:00:00Z", detail_minutes: 30, expected_officer_version: "${occ_off_v1}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { occ_sd1: $.data.id, occ_sd1_state: $.data.state }
            - call: "POST /surge-details"
              payload: { staffing_plan_id: "${plan_id}", officer_id: "${off_id}", event_code: "SPORTING_EVENT", window_start_utc: "2026-09-10T13:00:00Z", detail_minutes: 30, expected_officer_version: "${occ_off_v1}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 412
              captures: { occ_sd_stale: $.data.error_id }
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { occ_off_v2: $.data.version }
            - call: "POST /surge-details/${occ_sd1}/decision"
              payload: { decision: "APPROVE" }
              as: DutyManager
              as_user_id: duty-1
              captures: { occ_sd1_approved: $.data.state, occ_sd1_cost: $.data.detail_cost_cents }
            - call: "POST /surge-details"
              payload: { staffing_plan_id: "${plan_id}", officer_id: "${off_id}", event_code: "SPORTING_EVENT", window_start_utc: "2026-09-10T13:00:00Z", detail_minutes: 30, expected_officer_version: "${occ_off_v2}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 412
              captures: { occ_sd_stale2: $.data.error_id }
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { occ_off_v3: $.data.version, occ_off_committed2: $.data.committed_duty_minutes, occ_off_detail_minutes: $.data.approved_detail_minutes }
            - call: "POST /surge-details"
              payload: { staffing_plan_id: "${plan_id}", officer_id: "${off_id}", event_code: "SPORTING_EVENT", window_start_utc: "2026-09-10T13:00:00Z", detail_minutes: 30, expected_officer_version: "${occ_off_v3}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { occ_sd2: $.data.id, occ_sd2_state: $.data.state }
          assert:
            - "${occ_off_committed} == 30 from the SCHEDULED assignment and ${occ_sd1_state} == REQUESTED"
            - "${occ_sd_stale} == ERR_STALE_OFFICER_VERSION (412) — the first create bumped the officer"
            - "${occ_off_v2} == ${occ_off_v1} + 1"
            - "${occ_sd1_approved} == APPROVED with ${occ_sd1_cost} == 3000 (30 x DETAIL_RATE_CENTS_PER_MINUTE 100)"
            - "${occ_sd_stale2} == ERR_STALE_OFFICER_VERSION (412) — the DECISION, made by a different role, invalidated the requester's token"
            - "${occ_off_v3} == ${occ_off_v2} + 1, ${occ_off_committed2} == 60 and ${occ_off_detail_minutes} == 30 — precisely the ledger fields the OCC token protects"
            - "${occ_sd2_state} == REQUESTED once the fresh version is used"

      - name: re_forecasting_a_band_overwrites_the_variant_fields_in_place
        claim_type: dual_variant_calculation
        grounds:
          - calculations.time_band_pax_forecast
          - calculations.lane_requirement
          - endpoints.POST_time-bands_forecast
        distinguishing_aspect: "Switching variants must RECONCILE the stored projection rather than append a second one: forecast_pax_count, forecast_variant, forecast_computed_at_utc and all four lane-requirement fields are rewritten on the same row, and switching back restores the earlier numbers exactly. The seasonal multiplier at its 0.50 lower bound is the field that separates the variants."
        test_recipe:
          setup:
            - "two equipped STANDARD lanes, one 100-passenger flight departing 10:30 and a 10:00 band with seasonal_multiplier 0.50"
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_lane2
            - *c_eq2_w
            - *c_eq2_x
            - *c_eq2_a
            - *c_curve
            - *c_flight100
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 0.5 }
              as: StaffingPlanner
              captures: { rv_band_id: $.data.id, rv_mult: $.data.seasonal_multiplier }
          trigger:
            - call: "POST /time-bands/${rv_band_id}/forecast"
              payload: { variant: "SCHEDULE_ONLY" }
              as: StaffingPlanner
              captures: { rv_pax_a: $.data.forecast_pax_count, rv_var_a: $.data.forecast_variant, rv_std_a: $.data.required_standard_lanes, rv_unmet_a: $.data.unmet_standard_demand, rv_at_a: $.data.forecast_computed_at_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T08:05:00Z" }
              as: PlatformAdmin
            - call: "POST /time-bands/${rv_band_id}/forecast"
              payload: { variant: "CURVE_BLENDED" }
              as: StaffingPlanner
              captures: { rv_pax_b: $.data.forecast_pax_count, rv_var_b: $.data.forecast_variant, rv_std_b: $.data.required_standard_lanes, rv_at_b: $.data.forecast_computed_at_utc }
            - call: "GET /time-bands"
              payload: { checkpoint_id: "${cp_id}" }
              as: StaffingPlanner
              captures: { rv_first_id: "$.data[0].id", rv_first_pax: "$.data[0].forecast_pax_count" }
            - call: "POST /time-bands/${rv_band_id}/forecast"
              payload: { variant: "SCHEDULE_ONLY" }
              as: DutyManager
              captures: { rv_pax_c: $.data.forecast_pax_count, rv_std_c: $.data.required_standard_lanes, rv_at_c: $.data.forecast_computed_at_utc }
          assert:
            - "${rv_mult} == \"0.50\" — the lower bound of the allowed range, serialized as a two-decimal string"
            - "${rv_pax_a} == 100 with ${rv_var_a} == SCHEDULE_ONLY: the whole 30-minute curve window falls inside the band, and seasonal_multiplier is IGNORED by this variant"
            - "${rv_std_a} == 2 (waterfall: 90 < 100, 90 + 90 >= 100) and ${rv_unmet_a} == 0, with ${rv_at_a} == 2026-09-10T08:00:00Z"
            - "${rv_pax_b} == 50 with ${rv_var_b} == CURVE_BLENDED — round_half_up(100 x 1.00 x 30/30 x (1 - 0) x 0.50)"
            - "${rv_std_b} == 1 — the requirement fields were re-derived, not left over from the previous variant, and ${rv_at_b} == 2026-09-10T08:05:00Z"
            - "the list holds exactly one row (total_count 1 in the envelope) with ${rv_first_id} == ${rv_band_id} and ${rv_first_pax} == 50 — the re-forecast overwrote the row instead of appending one"
            - "${rv_pax_c} == 100 and ${rv_std_c} == 2 with ${rv_at_c} == 2026-09-10T08:05:00Z — switching back restores the earlier numbers exactly, so the reconciliation is lossless in both directions"

      - name: breach_counter_advances_per_lane_type_and_resets_below_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.published_wait_time
          - calculations.checkpoint_posture
          - state_machines.EscalationTicket[NONE -> RAISED]
          - state_machines.EscalationTicket[RAISED -> EXPIRED]
        distinguishing_aspect: "The trigger is a CUMULATIVE counter with a per-lane_type scope and a reset edge: two consecutive breaches raise a ticket, an expedited breach must not advance the standard counter, and a single sub-threshold publication both zeroes the counter and expires the open ticket. Because the publication is a window average, one good sample also keeps the NEXT breach-level sample below the threshold, so the counter cannot immediately re-arm."
        test_recipe:
          setup: ["one checkpoint (thresholds 15 standard / 8 expedited) with one OPEN standard lane and a supervisor"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_off_sup
          trigger:
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 960, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { rt_pub1: $.data.published_wait_minutes_snapshot, rt_breach1: $.data.breached_threshold }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { rt_cnt_std_1: $.data.consecutive_breach_count_standard, rt_posture_1: $.data.posture }
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 960, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { rt_pub2: $.data.published_wait_minutes_snapshot }
            - call: "GET /escalation-tickets"
              payload: { checkpoint_id: "${cp_id}", lane_type_scope: "STANDARD" }
              as: CheckpointManager
              captures: { rt_std_ticket: "$.data[0].id", rt_std_ticket_state: "$.data[0].state", rt_std_scope: "$.data[0].lane_type_scope" }
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "EXPEDITED", sampled_wait_seconds: 960, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { rt_pub_exp1: $.data.published_wait_minutes_snapshot }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { rt_cnt_std_2: $.data.consecutive_breach_count_standard, rt_cnt_exp_1: $.data.consecutive_breach_count_expedited, rt_posture_2: $.data.posture }
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "EXPEDITED", sampled_wait_seconds: 960, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { rt_pub_exp2: $.data.published_wait_minutes_snapshot }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { rt_posture_3: $.data.posture }
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 60, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { rt_pub3: $.data.published_wait_minutes_snapshot, rt_breach3: $.data.breached_threshold }
            - call: "GET /checkpoints/${cp_id}/wait-time"
              payload: { lane_type: "STANDARD" }
              as: CheckpointManager
              captures: { rt_avg3: $.data.weighted_average_seconds, rt_n3: $.data.sample_count, rt_thr3: $.data.threshold_minutes }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { rt_cnt_std_3: $.data.consecutive_breach_count_standard, rt_posture_4: $.data.posture }
            - call: "GET /escalation-tickets/${rt_std_ticket}"
              payload: {}
              as: CheckpointManager
              captures: { rt_std_ticket_after: $.data.state }
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 960, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { rt_pub4: $.data.published_wait_minutes_snapshot, rt_breach4: $.data.breached_threshold }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { rt_cnt_std_4: $.data.consecutive_breach_count_standard }
          assert:
            - "${rt_pub1} == 16 and ${rt_breach1} == true (thin data: one sample, 960 s -> 16 min >= 15), with ${rt_cnt_std_1} == 1 and ${rt_posture_1} == NORMAL — one breach raises nothing"
            - "${rt_pub2} == 16 (still fewer than 3 samples, so the latest observation is used) and the counter reaches ESCALATION_BREACH_COUNT_REQUIRED, creating ${rt_std_ticket} with ${rt_std_ticket_state} == RAISED and ${rt_std_scope} == STANDARD (the envelope reports total_count 1)"
            - "${rt_pub_exp1} == 16 breaches the expedited threshold 8, yet ${rt_cnt_std_2} == 2 is untouched while ${rt_cnt_exp_1} == 1 — the counters are per lane_type"
            - "${rt_posture_2} == ELEVATED (exactly one open ticket) and ${rt_posture_3} == SURGE once the second expedited breach raises the EXPEDITED-scope ticket, hitting SURGE_OPEN_ESCALATION_THRESHOLD 2"
            - "${rt_n3} == 3 with ${rt_thr3} == 15, ${rt_avg3} == \"660.00\" and ${rt_pub3} == 11 with ${rt_breach3} == false — three standard samples now qualify for the weighted average, and every weight is 3 x 10 == 30, so (960 + 960 + 60) / 3 == 660 s"
            - "${rt_cnt_std_3} == 0 and ${rt_std_ticket_after} == EXPIRED, dropping ${rt_posture_4} back to ELEVATED (the expedited ticket is still open)"
            - "${rt_pub4} == 12 (2940 / 4 == 735 s -> 12.25 -> 12) with ${rt_breach4} == false and ${rt_cnt_std_4} == 0 — a fourth breach-level SAMPLE is not a breach-level PUBLICATION, so the counter stays disarmed"

      - name: cascade_chain_from_equipment_fault_reaches_four_entities
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / equipment_fault_to_escalation_depth_four"
          rationale: "That §1.8 instance walks the full EquipmentUnit -> Lane -> Checkpoint.posture -> EscalationTicket chain end-to-end in one fixture, asserts every intermediate field after each link, and its sibling plan_approval_supersede_depth_three covers the second independent chain; the §1.9 state_machines section additionally probes the ordering-sensitive legs (suspension cascade and branch-specific referral cascade), so a further cross-cutting instance would only restate them."

  # ===========================================================================
  - section: consistency model
    instances:

      - name: every_derived_field_is_current_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.staffing_plan_cost
          - calculations.checkpoint_posture
        distinguishing_aspect: "consistency_model is immediate, so there is no lag anywhere: the write's OWN response body already carries the recomputed derived fields, and a read issued straight afterwards agrees with it. Nothing may require a second call, a retry or a delay to converge."
        test_recipe:
          setup: ["one equipped OPEN lane, one officer, one forecast band and a DRAFT plan"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
          trigger:
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { im_asg_id: $.data.id, im_planned: $.data.planned_minutes }
            - call: "GET /staffing-plans/${plan_id}/cost-summary"
              payload: {}
              as: StaffingPlanner
              captures: { im_sub: $.data.subtotal_cents, im_rate: $.data.admin_fee_rate, im_fee: $.data.admin_fee_cents, im_total: $.data.total_cost_cents }
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { im_committed: $.data.committed_duty_minutes }
            - call: "POST /equipment-units/${eq_ai_id}/report-state"
              payload: { state: "OUT_OF_SERVICE", note: "imaging fault" }
              as: CheckpointManager
              captures: { im_eq_state: $.data.state }
            - call: "GET /lanes/${lane_id}"
              payload: {}
              as: CheckpointManager
              captures: { im_lane_state: $.data.lane_state, im_lane_eq: $.data.equipment_state, im_lane_reason: $.data.paused_reason_code }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { im_posture: $.data.posture, im_open_ct: $.data.open_lane_count, im_avail: $.data.available_lane_positions }
          assert:
            - "${im_planned} == 30 is already present in the CREATE response — no follow-up read is needed to learn a computed field"
            - "${im_sub} == 3000, ${im_rate} == \"0.060\", ${im_fee} == 180 and ${im_total} == 3180 immediately after the create, with no intermediate null state"
            - "${im_committed} == 30 immediately — the officer ledger is not eventually consistent"
            - "${im_eq_state} == OUT_OF_SERVICE and, in the very next read, ${im_lane_eq} == OUT_OF_SERVICE with ${im_lane_state} == PAUSED and ${im_lane_reason} == EQUIPMENT_FAULT"
            - "${im_posture} == ELEVATED with ${im_open_ct} == 0 and ${im_avail} == 6 — three cascade links and two counters all settled inside the single report-state request"
            - "repeating every GET above returns identical values, so nothing converges late"
