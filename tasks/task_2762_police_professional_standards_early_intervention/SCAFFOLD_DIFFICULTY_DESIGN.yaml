# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2762 — Police Professional Standards & Early Intervention
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# Every numeric literal in an `assert:` line was computed by executing the
# corresponding §1.3 formula against its `constants:` before being written here.
# The logical clock starts at its mandatory default 2026-08-01T00:00:00Z.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: presumptive_versus_final_discipline_matrix_prior_tier
        grounds:
          - calculations.discipline_matrix
          - entities.Discipline.fields.presumptive_days
          - entities.Discipline.fields.final_days
          - entities.Discipline.fields.presumptive_prior_tier
          - entities.Discipline.fields.final_prior_tier
          - state_machines.Allegation.PENDING_to_SUSTAINED
          - state_machines.Discipline.PROPOSED_to_IMPOSED
        distinguishing_aspect: |
          The two variants differ in which prior sustained findings count toward the matrix tier:
          PRESUMPTIVE counts every qualifying sustained allegation, FINAL counts only those whose
          Discipline actually reached IMPOSED, UPHELD or MODIFIED, so the identical officer with
          the identical aggravator and mitigator counts yields presumptive_days 24 and final_days
          16 on one Discipline row.
        test_recipe:
          setup:
            - "One INTERNAL_AFFAIRS unit and one PATROL_DIVISION unit exist."
            - "Commander Reyes (IACommander), Investigator Ahn (certification_level 3, max_case_load 3), Sergeant Doyle (reporting supervisor) and Officer Vance (the subject, PATROL) exist and are ACTIVE."
            - "A first CLASS_II complaint against Officer Vance has been investigated, its single offense_class B allegation SUSTAINED, and the Discipline it produced has been deliberately left in PROPOSED — never imposed."
            - "A second CLASS_II complaint against the same officer has been investigated and its single offense_class B allegation SUSTAINED with aggravator_count 2 and mitigator_count 1, producing a second Discipline in PROPOSED."
            - "The logical clock stands at 2026-08-09T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 11000000, demographic_code: "DG_B", hire_date: "2014-05-12T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 3 }
              as: SystemAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /hearing-rooms"
              payload: { facility_code: "HQ", room_name: "Interview 1", concurrent_capacity: 1, recording_enabled: true }
              as: SystemAdmin
              captures: { room1_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Failure to complete required reports on shift.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", complainant_demographic_code: "DG_A", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "NEGLECT_OF_DUTY", narrative: "Reports for four shifts were never filed.", offense_class: "B" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/investigations"
              payload: { opening_note: "Assigned to internal affairs." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i1_id: $.data.id, i1_v: $.data.version }
            - call: "POST /investigations/${i1_id}/assignments"
              payload: { expected_investigation_version: "${i1_v}", investigator_officer_id: "${inv_a_id}", assignment_note: "Certified level 3." }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /investigations/${i1_id}/interview-sessions"
              payload: { subject_officer_id: "${subj_id}", hearing_room_id: "${room1_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:30:00Z", notice_served_at: "2026-08-01T00:00:00Z", representation_status: "REP_PRESENT" }
              as: Investigator
              as_user_id: "${inv_a_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /interview-sessions/${s1_id}/hold"
              payload: { interview_summary: "Officer interviewed with representation present." }
              as: Investigator
              as_user_id: "${inv_a_id}"
            - call: "POST /investigations/${i1_id}/findings"
              payload: { allegation_findings: [{ allegation_id: "${a1_id}", evidence_weight_for: 60, evidence_weight_against: 40, policy_compliant: false }], summary: "Reports confirmed missing." }
              as: Investigator
              as_user_id: "${inv_a_id}"
            - call: "POST /allegations/${a1_id}/disposition"
              payload: { disposition: "SUSTAINED", aggravator_count: 0, mitigator_count: 0, rationale: "Preponderance carried." }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "GET /disciplines"
              payload: { allegation_id: "${a1_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { d1_id: "$.data[0].id"}
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Second neglect of duty allegation on a later shift.", incident_datetime: "2026-07-20T18:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", complainant_demographic_code: "DG_A", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /complaints/${c2_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "NEGLECT_OF_DUTY", narrative: "Evidence log left unsecured.", offense_class: "B" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /complaints/${c2_id}/investigations"
              payload: { opening_note: "Second file opened." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i2_id: $.data.id, i2_v: $.data.version }
            - call: "POST /investigations/${i2_id}/assignments"
              payload: { expected_investigation_version: "${i2_v}", investigator_officer_id: "${inv_a_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /investigations/${i2_id}/interview-sessions"
              payload: { subject_officer_id: "${subj_id}", hearing_room_id: "${room1_id}", scheduled_start: "2026-08-09T09:00:00Z", scheduled_end: "2026-08-09T10:30:00Z", notice_served_at: "2026-08-05T09:00:00Z", representation_status: "REP_PRESENT" }
              as: Investigator
              as_user_id: "${inv_a_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-09T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /interview-sessions/${s2_id}/hold"
              payload: { interview_summary: "Second interview held with representation present." }
              as: Investigator
              as_user_id: "${inv_a_id}"
            - call: "POST /investigations/${i2_id}/findings"
              payload: { allegation_findings: [{ allegation_id: "${a2_id}", evidence_weight_for: 60, evidence_weight_against: 40, policy_compliant: false }], summary: "Log confirmed unsecured." }
              as: Investigator
              as_user_id: "${inv_a_id}"
            - call: "POST /allegations/${a2_id}/disposition"
              payload: { disposition: "SUSTAINED", aggravator_count: 2, mitigator_count: 1, rationale: "Two aggravators, one mitigator." }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "GET /disciplines"
              payload: { allegation_id: "${a2_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { d2_id: "$.data[0].id", d2_presumptive_days: "$.data[0].presumptive_days", d2_presumptive_tier: "$.data[0].presumptive_prior_tier"}
          trigger:
            - call: "POST /disciplines/${d2_id}/impose"
              payload: { effective_date: "2026-08-10T00:00:00Z", aggravator_count: 2, mitigator_count: 1 }
              as: IACommander
              as_user_id: "${cmdr_id}"
          assert:
            - "${d2_presumptive_tier} == 1"
            - "${d2_presumptive_days} == 24"
            - "Discipline.${d2_id}.final_prior_tier == 0"
            - "Discipline.${d2_id}.final_days == 16"
            - "Discipline.${d2_id}.effective_days == 16"
            - "Discipline.${d2_id}.presumptive_days == 24 (unchanged by the impose call)"
            - "Discipline.${d2_id}.status == IMPOSED"
            - "Discipline.${d1_id}.status == PROPOSED"
            - "Officer.${subj_id}.imposed_suspension_days_total == 16"
            - "Officer.${subj_id}.employment_status == SUSPENDED"
            - "Officer.${subj_id}.suspension_end_date == 2026-08-26"
            - "Discipline.${d2_id}.appeal_deadline_at == 2026-08-24T09:00:00Z"

      - name: eis_rolling_window_versus_peer_relative_score
        grounds:
          - calculations.eis_composite_score
          - entities.Officer.fields.eis_score
          - entities.Officer.fields.eis_alert_level
          - entities.EarlyInterventionAlert.fields.score_variant
          - entities.Unit.fields.peer_group_code
        distinguishing_aspect: |
          ROLLING_12M multiplies the weighted total by the officer's assignment multiplier and
          adds an indicator bonus, while PEER_RELATIVE divides the same weighted total by the
          peer-group mean and scales by 40 with neither multiplier nor bonus, so the identical
          event history yields composite_score 63.75 at level ALERT under one variant and 46.67
          at level WATCH under the other.
        test_recipe:
          setup:
            - "A single PATROL_DIVISION unit 'Patrol South' with peer_group_code PG_SOUTH holds exactly three ACTIVE officers, so the peer pool of the subject is exactly two officers."
            - "Officer Kerr (the subject, assignment_type PATROL) has five activity events inside the rolling window: USE_OF_FORCE LEVEL_2 on 2026-06-01, USE_OF_FORCE LEVEL_1 on 2026-06-15, USE_OF_FORCE LEVEL_3 on 2026-07-01, PURSUIT on 2026-07-10 and PURSUIT on 2026-07-20."
            - "Peer officer Lund has five USE_OF_FORCE LEVEL_3 events, giving a weighted total of 30; peer officer Moss has no events at all, giving a weighted total of 0, so the peer mean is exactly 15."
            - "The logical clock stands at the default 2026-08-01T00:00:00Z, so every event is inside the 365-day window and inside the 180-day full-weight band."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol South", unit_role: "PATROL_DIVISION", command_code: "PS", peer_group_code: "PG_SOUTH", sworn_headcount: 3, intake_enabled: true }
              as: SystemAdmin
              captures: { south_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${south_unit_id}", badge_number: "PS-201", full_name: "Officer Kerr", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_B", hire_date: "2018-04-02T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_s_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${south_unit_id}", badge_number: "PS-202", full_name: "Officer Lund", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_A", hire_date: "2017-06-01T00:00:00Z" }
              as: SystemAdmin
              captures: { peer1_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${south_unit_id}", badge_number: "PS-203", full_name: "Officer Moss", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_D", hire_date: "2020-01-06T00:00:00Z" }
              as: SystemAdmin
              captures: { peer2_id: $.data.id }
            - call: "POST /officers/${subj_s_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_2", occurred_at: "2026-06-01T00:00:00Z", source_reference: "UOF-1" }
              as: SystemAdmin
            - call: "POST /officers/${subj_s_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_1", occurred_at: "2026-06-15T00:00:00Z", source_reference: "UOF-2" }
              as: SystemAdmin
            - call: "POST /officers/${subj_s_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T00:00:00Z", source_reference: "UOF-3" }
              as: SystemAdmin
            - call: "POST /officers/${subj_s_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-10T00:00:00Z", source_reference: "PUR-1" }
              as: SystemAdmin
            - call: "POST /officers/${subj_s_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-20T00:00:00Z", source_reference: "PUR-2" }
              as: SystemAdmin
            - call: "POST /officers/${peer1_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-06-01T00:00:00Z", source_reference: "L-1" }
              as: SystemAdmin
            - call: "POST /officers/${peer1_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-06-05T00:00:00Z", source_reference: "L-2" }
              as: SystemAdmin
            - call: "POST /officers/${peer1_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-06-10T00:00:00Z", source_reference: "L-3" }
              as: SystemAdmin
            - call: "POST /officers/${peer1_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-06-15T00:00:00Z", source_reference: "L-4" }
              as: SystemAdmin
            - call: "POST /officers/${peer1_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-06-20T00:00:00Z", source_reference: "L-5" }
              as: SystemAdmin
          trigger:
            - call: "GET /officers/${subj_s_id}/eis-profile"
              payload: { variant: "ROLLING_12M" }
              as: SystemAdmin
              captures: { roll_total: $.data.weighted_total, roll_score: $.data.composite_score, roll_level: $.data.alert_level }
            - call: "GET /officers/${subj_s_id}/eis-profile"
              payload: { variant: "PEER_RELATIVE" }
              as: SystemAdmin
              captures: { peer_score: $.data.composite_score, peer_level: $.data.alert_level, peer_mean_v: $.data.peer_mean, pool_size: $.data.peer_pool_size }
          assert:
            - "${roll_total} == 17.50"
            - "${roll_score} == 63.75"
            - "${roll_level} == ALERT"
            - "${pool_size} == 2"
            - "${peer_mean_v} == 15.00"
            - "${peer_score} == 46.67"
            - "${peer_level} == WATCH"
            - "Officer.${subj_s_id}.eis_score == 63.75 (the stored ledger tracks the ROLLING_12M variant only)"
            - "Officer.${subj_s_id}.eis_alert_level == ALERT"

  - rule_id: combinatorial_formula
    instances:
      - name: eis_five_factor_score_assignment_multiplier_and_indicator_bonus
        grounds:
          - calculations.eis_composite_score
          - entities.OfficerActivityEvent.fields.event_type
          - entities.OfficerActivityEvent.fields.severity_code
          - entities.Officer.fields.assignment_type
          - endpoints["GET /officers/{id}/eis-profile"]
        distinguishing_aspect: |
          The score combines five independent factors in one non-decomposable expression - event
          base weight, severity multiplier, age decay, assignment multiplier and an additive
          per-indicator bonus - so two officers with byte-identical event histories that differ
          only in assignment_type score 63.75 and 55.00, a gap of 8.75 that no single-factor
          formula can produce.
        test_recipe:
          setup:
            - "One PATROL_DIVISION unit holds two ACTIVE officers: Officer Ruiz with assignment_type PATROL and Officer Sato with assignment_type INVESTIGATIVE."
            - "Both officers receive the identical five events: USE_OF_FORCE LEVEL_2 on 2026-06-01, USE_OF_FORCE LEVEL_1 on 2026-06-15, USE_OF_FORCE LEVEL_3 on 2026-07-01, PURSUIT on 2026-07-10 and PURSUIT on 2026-07-20."
            - "The logical clock stands at the default 2026-08-01T00:00:00Z, so every event has age_days at most 61 and decay stays 1.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol West", unit_role: "PATROL_DIVISION", command_code: "PW", peer_group_code: "PG_WEST", sworn_headcount: 40, intake_enabled: true }
              as: SystemAdmin
              captures: { west_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${west_unit_id}", badge_number: "PW-301", full_name: "Officer Ruiz", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_A", hire_date: "2016-03-14T00:00:00Z" }
              as: SystemAdmin
              captures: { patrol_off_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${west_unit_id}", badge_number: "PW-302", full_name: "Officer Sato", rank: "OFFICER", assignment_type: "INVESTIGATIVE", annual_salary_cents: 9000000, demographic_code: "DG_B", hire_date: "2016-03-14T00:00:00Z" }
              as: SystemAdmin
              captures: { inv_off_id: $.data.id }
            - call: "POST /officers/${patrol_off_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_2", occurred_at: "2026-06-01T00:00:00Z", source_reference: "R-1" }
              as: SystemAdmin
            - call: "POST /officers/${patrol_off_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_1", occurred_at: "2026-06-15T00:00:00Z", source_reference: "R-2" }
              as: SystemAdmin
            - call: "POST /officers/${patrol_off_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T00:00:00Z", source_reference: "R-3" }
              as: SystemAdmin
            - call: "POST /officers/${patrol_off_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-10T00:00:00Z", source_reference: "R-4" }
              as: SystemAdmin
            - call: "POST /officers/${patrol_off_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-20T00:00:00Z", source_reference: "R-5" }
              as: SystemAdmin
            - call: "POST /officers/${inv_off_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_2", occurred_at: "2026-06-01T00:00:00Z", source_reference: "S-1" }
              as: SystemAdmin
            - call: "POST /officers/${inv_off_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_1", occurred_at: "2026-06-15T00:00:00Z", source_reference: "S-2" }
              as: SystemAdmin
            - call: "POST /officers/${inv_off_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T00:00:00Z", source_reference: "S-3" }
              as: SystemAdmin
            - call: "POST /officers/${inv_off_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-10T00:00:00Z", source_reference: "S-4" }
              as: SystemAdmin
            - call: "POST /officers/${inv_off_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-20T00:00:00Z", source_reference: "S-5" }
              as: SystemAdmin
          trigger:
            - call: "GET /officers/${patrol_off_id}/eis-profile"
              payload: {}
              as: IACommander
              as_user_id: "${patrol_off_id}"
              captures: { p_total: $.data.weighted_total, p_score: $.data.composite_score, p_level: $.data.alert_level, p_count: $.data.event_count, p_window_start: $.data.window_start }
            - call: "GET /officers/${inv_off_id}/eis-profile"
              payload: {}
              as: IACommander
              as_user_id: "${patrol_off_id}"
              captures: { i_total: $.data.weighted_total, i_score: $.data.composite_score, i_level: $.data.alert_level }
          assert:
            - "${p_count} == 5"
            - "${p_window_start} == 2025-08-01T00:00:00Z"
            - "${p_total} == 17.50"
            - "${i_total} == 17.50 (the weighted total is variant- and assignment-independent)"
            - "${p_score} == 63.75"
            - "${p_level} == ALERT"
            - "${i_score} == 55.00"
            - "${i_level} == ALERT"
            - "the 8.75 gap equals 17.50 * (1.0 - 0.8) * 2.5, proving the assignment multiplier is applied to the weighted total before the additive bonus rather than to the finished score"
            - "Officer.${patrol_off_id}.eis_score == 63.75"
            - "Officer.${inv_off_id}.eis_score == 55.00"

      - name: back_pay_per_period_rounding_then_offset_then_interest
        grounds:
          - calculations.reinstatement_back_pay
          - entities.Reinstatement.fields.gross_back_pay_cents
          - entities.Reinstatement.fields.net_back_pay_cents
          - entities.Reinstatement.fields.interest_cents
          - entities.Reinstatement.fields.total_award_cents
          - state_machines.Reinstatement.PENDING_to_FINALIZED
          - state_machines.Discipline.APPEALED_to_MODIFIED
        distinguishing_aspect: |
          The award chains four order-sensitive operations - split into 10-day pay periods, round
          each period before summing, subtract interim earnings, then accrue interest on the net
          for the elapsed days - so an annual_salary_cents of 9100013 over 24 reversed days yields
          gross 840002 where a single end-of-calculation rounding would yield 840001, and a
          total_award_cents of 722152.
        test_recipe:
          setup:
            - "Officer Vance has annual_salary_cents 9100013 and one SUSTAINED offense_class A allegation."
            - "The discipline was imposed at exactly 2026-08-20T00:00:00Z with final_days 30 (class A, prior tier 0, no aggravators, no mitigators, floored at the class A minimum)."
            - "An appeal filed 2026-08-25 was decided MODIFIED with modified_days 6, so reversed_days is 30 - 6 = 24 and a Reinstatement exists in PENDING."
            - "The logical clock is moved to 2026-11-01T00:00:00Z before finalization, giving days_elapsed 73 from imposed_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
