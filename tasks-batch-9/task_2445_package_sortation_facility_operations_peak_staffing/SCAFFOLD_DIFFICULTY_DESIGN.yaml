  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: door_turnaround_buffer_gap_exactly_15_minutes
        grounds:
          - calculations.door_interval_conflict
          - validations.27_ERR_DOOR_WINDOW_CONFLICT
          - entities.DockDoor.fields.turnaround_buffer_min
          - endpoints.POST_/sortation/trailer-appointments
        distinguishing_aspect: |
          Metric: whole minutes of dock turnaround buffer, tested at the endpoint
          POST /sortation/trailer-appointments. The buffered comparison is strict, so a gap of exactly
          DEFAULT_TURNAROUND_BUFFER_MIN (15) minutes after the previous window is accepted while 14
          minutes is refused; the boundary sits between 07:14 and 07:15 for a window ending at 07:00.
        test_recipe:
