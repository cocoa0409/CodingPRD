              as: Driver
              as_user_id: "${d14}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SPOT_UNLISTED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: booking_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=30]
          - errors[ERR_SPOT_TIME_CONFLICT]
          - entities.Booking.fields.start_at
          - entities.Booking.fields.end_at
        distinguishing_aspect: >-
          Spot booking interval semantics are HALF-OPEN [start,end): a new booking starting exactly
          at the prior booking's end_at (12:00) is ACCEPTED (adjacency allowed), but one starting
          at 11:00 (genuine intersection) is rejected with ERR_SPOT_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Spot S15 with existing RESERVED Booking [10:00,12:00)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h15@x.com", display_name: "H15", payout_account_ref: "pa_15" }
              as: Anonymous
              captures: { h15: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d15@x.com", display_name: "D15" }
              as: Anonymous
              captures: { d15: $.data.id }
            - call: "POST /drivers/${d15}/wallet/topup"
              payload: { amount_cents: 10000 }
              as: Driver
              as_user_id: "${d15}"
            - call: "POST /spots"
              payload: { host_id: "${h15}", title: "S15", zone_code: "Z15", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h15}"
              captures: { s15: $.data.id, s15v: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${s15}", driver_id: "${d15}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T12:00:00Z", expected_spot_version: "${s15v}" }
              as: Driver
              as_user_id: "${d15}"
              captures: { b15: $.data.id }
            - call: "GET /spots/${s15}"
              payload: {}
              as: Host
              as_user_id: "${h15}"
              captures: { s15v2: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${s15}", driver_id: "${d15}", rate_kind: "HOURLY", start_at: "2026-04-20T12:00:00Z", end_at: "2026-04-20T13:00:00Z", expected_spot_version: "${s15v2}" }
              as: Driver
              as_user_id: "${d15}"
              captures: { b15adj: $.data.id }
            - call: "GET /spots/${s15}"
              payload: {}
              as: Host
              as_user_id: "${h15}"
              captures: { s15v3: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { spot_id: "${s15}", driver_id: "${d15}", rate_kind: "HOURLY", start_at: "2026-04-20T11:00:00Z", end_at: "2026-04-20T13:30:00Z", expected_spot_version: "${s15v3}" }
              as: Driver
              as_user_id: "${d15}"
              captures: { err: $.data.error_id }
          assert:
            - "Booking.${b15adj}.occupancy_status == RESERVED"
            - "error_id == ERR_SPOT_TIME_CONFLICT"

      - name: pricing_event_buffer_closed_adjacency_rejected
        grounds:
          - validations[priority=31]
          - errors[ERR_EVENT_ZONE_CONFLICT]
          - entities.PricingEvent.fields.window_start
          - entities.PricingEvent.fields.window_end
        distinguishing_aspect: >-
          PricingEvent interval semantics are CLOSED-with-1h-buffer (different resource, different
          arithmetic): a new event only 30 minutes after an ACTIVE event in the same zone is
          rejected (gap < 3600s), whereas a >= 3600s gap would be allowed — adjacency is NOT allowed.
        test_recipe:
          setup:
            - "Zone DT-09 has an ACTIVE PricingEvent [2026-04-09T10:00Z, 12:00Z)."
          setup_api_calls:
            - call: "POST /pricing-events"
              payload: { zone_code: "DT-09", window_start: "2026-04-09T10:00:00Z", window_end: "2026-04-09T12:00:00Z", surge_multiplier_bps: 20000 }
              as: PlatformAdmin
              captures: { pe1: $.data.id }
          trigger:
            - call: "POST /pricing-events"
              payload: { zone_code: "DT-09", window_start: "2026-04-09T12:30:00Z", window_end: "2026-04-09T14:00:00Z", surge_multiplier_bps: 30000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EVENT_ZONE_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transfer_accept_conserves_driver_escrow_quoted
        grounds:
          - state_machines.TransferOffer.PENDING_to_ACCEPTED
          - entities.Driver.fields.wallet_balance_cents
          - entities.Booking.fields.quoted_amount_cents
        distinguishing_aspect: >-
          Conserved quantity = booking escrow (Booking.quoted_amount_cents=800): transfer accept
          refunds from_driver the full 800 and charges to_driver 800, so from_driver returns to its
          pre-booking balance (5000) and the booking's escrow is unchanged at 800; the sum of the
          two drivers' wallet deltas over the accept is exactly zero.
        test_recipe:
          setup:
            - "Booking B16 held by D16a (funded 5000, charged 800 -> wallet 4200); D16b funded 5000; PENDING offer to D16b before start."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h16@x.com", display_name: "H16", payout_account_ref: "pa_16" }
              as: Anonymous
              captures: { h16: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d16a@x.com", display_name: "D16a" }
              as: Anonymous
              captures: { d16a: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d16b@x.com", display_name: "D16b" }
              as: Anonymous
              captures: { d16b: $.data.id }
            - call: "POST /drivers/${d16a}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d16a}"
            - call: "POST /drivers/${d16b}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d16b}"
            - call: "POST /spots"
              payload: { host_id: "${h16}", title: "S16", zone_code: "Z16", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h16}"
              captures: { s16: $.data.id, s16v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings"
              payload: { spot_id: "${s16}", driver_id: "${d16a}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T12:00:00Z", expected_spot_version: "${s16v}" }
              as: Driver
              as_user_id: "${d16a}"
              captures: { b16: $.data.id, b16v: $.data.version }
            - call: "POST /transfer-offers"
              payload: { booking_id: "${b16}", to_driver_id: "${d16b}", expected_booking_version: "${b16v}" }
              as: Driver
              as_user_id: "${d16a}"
              captures: { off16: $.data.id }
          trigger:
            - call: "POST /transfer-offers/${off16}/accept"
              payload: {}
              as: Driver
              as_user_id: "${d16b}"
              captures: { off16_status: $.data.status }
          assert:
            - "Driver.${d16a}.wallet_balance_cents == 5000"
            - "Driver.${d16b}.wallet_balance_cents == 4200"
            - "Booking.${b16}.quoted_amount_cents == 800"
            - "Booking.${b16}.driver_id == ${d16b}"

      - name: reverse_payout_conserves_host_lifetime_ledger
        grounds:
          - calculations.host_payout_amount
          - entities.Host.fields.lifetime_payout_cents
          - entities.PayoutLedgerEntry.fields.entry_type
          - entities.PayoutLedgerEntry.fields.amount_cents
        distinguishing_aspect: >-
          Conserved quantity = Host.lifetime_payout_cents (a distinct conserved quantity from driver
          escrow): a no-show posts EARNING +2550 (lifetime 2550), then reverse-payout posts REVERSAL
          -2550, returning lifetime to its pre-EARNING value of 0.
        test_recipe:
          setup:
            - "Host H17 (fee 1500 bps); Booking B17 quoted 3000 (HOURLY 3h surge 2.5x) marked NO_SHOW -> EARNING net 2550, lifetime 2550."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h17@x.com", display_name: "H17", payout_account_ref: "pa_17", platform_fee_bps: 1500 }
              as: Anonymous
              captures: { h17: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d17@x.com", display_name: "D17" }
              as: Anonymous
              captures: { d17: $.data.id }
            - call: "POST /drivers/${d17}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d17}"
            - call: "POST /spots"
              payload: { host_id: "${h17}", title: "S17", zone_code: "DT-17", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z", overstay_grace_minutes: 15 }
              as: Host
              as_user_id: "${h17}"
              captures: { s17: $.data.id, s17v: $.data.version }
            - call: "POST /pricing-events"
              payload: { zone_code: "DT-17", window_start: "2026-04-08T00:00:00Z", window_end: "2026-04-09T00:00:00Z", surge_multiplier_bps: 25000 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings"
              payload: { spot_id: "${s17}", driver_id: "${d17}", rate_kind: "HOURLY", start_at: "2026-04-08T10:00:00Z", end_at: "2026-04-08T13:00:00Z", expected_spot_version: "${s17v}" }
              as: Driver
              as_user_id: "${d17}"
              captures: { b17: $.data.id, b17v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T13:20:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b17}/mark-no-show"
              payload: {}
              as: PlatformAdmin
              captures: { b17v2: $.data.version }
          trigger:
            - call: "POST /bookings/${b17}/reverse-payout"
              payload: { expected_booking_version: "${b17v2}" }
              as: PlatformAdmin
              captures: { rev_type: $.data.entry_type, rev_amt: $.data.amount_cents }
          assert:
            - "PayoutLedgerEntry.entry_type == REVERSAL"
            - "PayoutLedgerEntry.amount_cents == -2550"
            - "Host.${h17}.lifetime_payout_cents == 0"
