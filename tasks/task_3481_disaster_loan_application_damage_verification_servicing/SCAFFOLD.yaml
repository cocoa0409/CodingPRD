scenario: 'Disaster Loan Application, Damage Verification & Servicing (Small Business Administration): declaration triggering loan availability for a defined geography with filing deadlines for physical
  and economic injury applications, application intake with credit review and repayment ability analysis for homeowners, renters and businesses, damage verification through inspection or estimation with
  insurance proceeds deducted to prevent duplication of benefits, loan approval with collateral requirements above thresholds and terms including deferral periods, disbursement in stages against completed
  repairs with modification requests as costs change, insurance settlement adjustments requiring loan reduction and repayment of excess funds, servicing including deferment, hardship accommodation and default
  handling on a portfolio of disaster borrowers, coordination with grant programs to avoid duplicated assistance

  '
domain_name: disaster-loan-servicing
api_prefix: /disaster-relief
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: DisasterDeclaration
  parent: null
  common_fields: true
  fields:
  - name: declaration_number
    type: string
    source: input
    description: Unique public declaration identifier (e.g. DR-4821)
    constraints: unique across all declarations
  - name: disaster_type
    type: enum
    source: input
    description: HURRICANE | FLOOD | EARTHQUAKE | TORNADO | WILDFIRE
  - name: incident_start_date
    type: datetime
    source: input
    description: First day of the incident period (inclusive)
  - name: incident_end_date
    type: datetime
    source: input
    description: Last day of the incident period (inclusive); must be >= incident_start_date
  - name: declared_date
    type: datetime
    source: input
    description: Date the disaster was declared; anchors both filing deadlines
  - name: counties
    type: array
    source: input
    description: 'Array of { county_fips: string, eligible_purposes: array of PHYSICAL_DAMAGE | ECONOMIC_INJURY }; at least one entry required; county_fips values unique within the declaration'
  - name: physical_filing_deadline
    type: datetime
    source: computed
    description: = declared_date + PHYSICAL_FILING_WINDOW_DAYS (90). PHYSICAL_DAMAGE submissions accepted iff current_utc <= this instant
  - name: economic_injury_filing_deadline
    type: datetime
    source: computed
    description: = declared_date + EIDL_FILING_WINDOW_DAYS (270). ECONOMIC_INJURY submissions accepted iff current_utc <= this instant
  - name: status
    type: enum
    source: system
    description: 'OPEN -> PHYSICAL_CLOSED -> FULLY_CLOSED; advanced automatically by the logical-clock sweep: OPEN while current_utc <= physical_filing_deadline; PHYSICAL_CLOSED once current_utc > physical_filing_deadline
      and current_utc <= economic_injury_filing_deadline; FULLY_CLOSED once current_utc > economic_injury_filing_deadline'
- name: Applicant
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Applicant full legal name
  - name: email
    type: string
    source: input
    description: Contact email
    constraints: unique across all applicants
  - name: applicant_type
    type: enum
    source: input
    description: HOMEOWNER | RENTER | BUSINESS; drives caps, terms and interest rates
  - name: annual_income_cents
    type: integer
    source: input
    description: Verified annual gross income in cents; > 0
  - name: monthly_debt_cents
    type: integer
    source: input
    description: Self-reported recurring monthly debt obligations in cents; >= 0
- name: LoanApplication
  parent: null
  common_fields: true
  fields:
  - name: declaration_id
    type: string
    source: input
    description: FK -> DisasterDeclaration.id; the declaration this application files under
  - name: applicant_id
    type: string
    source: system
    description: FK -> Applicant.id; taken from the authenticated Applicant's X-User-ID, never from the request body
  - name: county_fips
    type: string
    source: input
    description: County FIPS where damaged property / injured business sits; must appear in the declaration's counties with a matching eligible_purposes entry
  - name: loan_purpose
    type: enum
    source: input
    description: PHYSICAL_DAMAGE | ECONOMIC_INJURY
  - name: requested_amount_cents
    type: integer
    source: input
    description: Requested loan amount in cents; > 0
  - name: status
    type: enum
    source: system
    description: DRAFT -> SUBMITTED -> VERIFICATION -> DECISION_PENDING -> APPROVED | DECLINED; ECONOMIC_INJURY applications skip VERIFICATION; DECLINED -> DECISION_PENDING via reconsideration
  - name: reconsideration_count
    type: integer
    source: system
    default: 0
    description: Number of reconsiderations requested; request-reconsideration allowed iff < MAX_RECONSIDERATIONS (2)
  - name: submitted_at
    type: datetime
    source: system
    description: Logical timestamp of submission; null until submitted
  - name: decline_reason
    type: string
    source: system
    description: 'Machine-set reason on DECLINED: CREDIT_FAIL | DTI_EXCEEDED | APPROVER_DECLINE'
  - name: loan_id
    type: string
    source: system
    description: FK -> Loan.id; set exactly once when the application is approved; null before
    constraints: nullable
- name: CreditReview
  parent: null
  common_fields: false
  fields:
  - name: application_id
    type: string
    source: system
    description: FK -> LoanApplication.id; from the URL path
  - name: reviewer_user_id
    type: string
    source: system
    description: X-User-ID of the LoanOfficer who filed the review
  - name: credit_score
    type: integer
    source: input
    description: Bureau credit score pulled by the officer; 300..850
  - name: verified_monthly_debt_cents
    type: integer
    source: input
    description: Officer-verified recurring monthly debt in cents; >= 0
  - name: proposed_payment_cents
    type: integer
    source: computed
    description: STANDARD-variant amortized monthly payment on requested_amount_cents at the rate/term implied by applicant_type x loan_purpose (calc monthly_payment_calc, STANDARD variant)
  - name: dti_pass
    type: boolean
    source: computed
    description: (verified_monthly_debt_cents + proposed_payment_cents) * 100 <= MAX_DTI_PERCENT (43) * floor(annual_income_cents / 12)
  - name: score_pass
    type: boolean
    source: computed
    description: credit_score >= MIN_CREDIT_SCORE (640)
  - name: verdict
    type: enum
    source: computed
    description: PASS iff score_pass AND dti_pass else FAIL
- name: DamageVerification
  parent: null
  common_fields: true
  fields:
  - name: application_id
    type: string
    source: system
    description: FK -> LoanApplication.id; from the URL path
  - name: method
    type: enum
    source: input
    description: INSPECTION | ESTIMATION; ESTIMATION allowed only when requested_amount_cents <= ESTIMATION_MAX_CENTS (2500000)
  - name: valuation_basis
    type: enum
    source: input
    description: REPLACEMENT_COST | ACTUAL_CASH_VALUE; selects the loss variant (calc verified_loss_calc)
  - name: depreciation_pct
    type: number
    source: input
    description: Required iff valuation_basis == ACTUAL_CASH_VALUE; 0 < depreciation_pct <= 0.90; ignored (must be omitted) for REPLACEMENT_COST
    constraints: nullable
  - name: assessed_loss_cents
    type: integer
    source: input
    description: Verifier-assessed gross loss in cents, recorded at completion; >= 0
  - name: insurance_proceeds_cents
    type: integer
    source: input
    description: Insurance proceeds received or receivable by the applicant for this loss, recorded at completion; >= 0
  - name: verified_loss_cents
    type: integer
    source: computed
    description: 'REPLACEMENT_COST: = assessed_loss_cents. ACTUAL_CASH_VALUE: = round_half_up(assessed_loss_cents * (1 - depreciation_pct))'
  - name: net_verified_loss_cents
    type: integer
    source: computed
    description: = max(0, verified_loss_cents - insurance_proceeds_cents); duplication-of-benefits deduction
  - name: status
    type: enum
    source: system
    description: REQUESTED -> COMPLETED -> DISPUTED -> COMPLETED (cycle; complete from DISPUTED re-records figures)
  - name: verifier_user_id
    type: string
    source: system
    description: X-User-ID of the LossVerifier who completed the verification; segregation anchor for repair-milestone decisions
  - name: completed_at
    type: datetime
    source: system
    description: Logical timestamp of the latest completion; anchors the dispute window (DISPUTE_WINDOW_DAYS = 30)
    constraints: nullable
- name: Loan
  parent: null
  common_fields: true
  fields:
  - name: application_id
    type: string
    source: system
    description: FK -> LoanApplication.id; 1:1 with an APPROVED application
  - name: applicant_id
    type: string
    source: system
    description: FK -> Applicant.id; denormalized from the application for servicing queries
  - name: loan_purpose
    type: enum
    source: system
    description: 'Copied from the application: PHYSICAL_DAMAGE | ECONOMIC_INJURY'
  - name: approved_amount_cents
    type: integer
    source: computed
    description: Calc approved_amount_calc; updated only by an APPROVED ModificationRequest
  - name: interest_rate
    type: number
    source: computed
    description: 0.03125 for HOMEOWNER/RENTER physical loans; 0.04 for BUSINESS physical loans and all ECONOMIC_INJURY loans
  - name: term_months
    type: integer
    source: computed
    description: 360 for HOMEOWNER/BUSINESS physical and all ECONOMIC_INJURY loans; 84 for RENTER physical loans
  - name: deferral_months
    type: integer
    source: computed
    default: 12
    description: = DEFERRAL_MONTHS (12); first payment due deferral_months + 1 calendar months after the first tranche release
  - name: monthly_payment_cents
    type: integer
    source: computed
    description: DEFERRED_CAPITALIZED variant of monthly_payment_calc on approved_amount_cents; recomputed when an approved modification changes approved_amount_cents
  - name: collateral_required
    type: boolean
    source: computed
    description: 'approved_amount_cents > collateral threshold for the loan''s purpose: PHYSICAL_COLLATERAL_THRESHOLD_CENTS (2500000) or EIDL_COLLATERAL_THRESHOLD_CENTS (5000000); strictly greater'
  - name: collateral_description
    type: string
    source: input
    description: Required at approval iff collateral_required; free-text collateral description
    constraints: nullable
  - name: collateral_value_cents
    type: integer
    source: input
    description: Required at approval iff collateral_required; estimated collateral value in cents; >= approved_amount_cents
    constraints: nullable
  - name: commitment_amount_cents
    type: integer
    source: computed
    description: Undrawn-plus-drawn commitment ceiling; = approved_amount_cents at origination, reduced by insurance-settlement clawbacks and downward modifications
  - name: disbursed_total_cents
    type: integer
    source: computed
    default: 0
    description: Sum of RELEASED tranche amounts
  - name: outstanding_balance_cents
    type: integer
    source: computed
    default: 0
    description: Principal owed; += tranche releases, -= principal portions of POSTED payments and receivable payments
  - name: accrued_interest_balance_cents
    type: integer
    source: computed
    default: 0
    description: Interest accrued and capitalized into this running bucket at each loan money event (release, payment); daily simple interest on outstanding_balance_cents at interest_rate/365
  - name: last_accrual_date
    type: datetime
    source: system
    description: Date through which interest has been accrued; set at each release/payment event
    constraints: nullable
  - name: late_fee_balance_cents
    type: integer
    source: computed
    default: 0
    description: Unpaid assessed late fees; += LATE_FEE_PCT (0.05) * monthly_payment_cents (round_half_up) when the sweep finds days_past_due >= LATE_FEE_GRACE_DAYS (15) and no late fee yet assessed for
      that due date
  - name: total_principal_paid_cents
    type: integer
    source: computed
    default: 0
    description: Cumulative principal portions of POSTED payments (reversed payments excluded)
  - name: total_interest_paid_cents
    type: integer
    source: computed
    default: 0
    description: Cumulative interest portions of POSTED payments
  - name: next_due_date
    type: datetime
    source: computed
    description: Set at first tranche release = release date + deferral_months + 1 calendar months; shifted forward by DEFERMENT action length when a deferment activates
    constraints: nullable
  - name: days_past_due
    type: integer
    source: computed
    default: 0
    description: 'Recomputed by the clock sweep: 0 while servicing_status in {CURRENT, DEFERRED, HARDSHIP} or next_due_date is null or current date <= next_due_date; else calendar days between next_due_date
      and current date'
  - name: lifecycle_status
    type: enum
    source: system
    description: PENDING_ACCEPTANCE -> ACTIVE -> PAID_IN_FULL | CHARGED_OFF
  - name: servicing_status
    type: enum
    source: system
    description: CURRENT <-> DEFERRED | HARDSHIP; CURRENT -> DELINQUENT (sweep, days_past_due >= 30); DELINQUENT -> CURRENT (curing payment); DELINQUENT -> DEFAULT (sweep, days_past_due >= 120); DEFAULT
      -> CHARGED_OFF lifecycle transition (sweep, days_past_due >= 180)
- name: DisbursementTranche
  parent: null
  common_fields: true
  fields:
  - name: loan_id
    type: string
    source: system
    description: FK -> Loan.id
  - name: stage_number
    type: integer
    source: system
    description: '1-based stage; schedule at origination: T1 = min(INITIAL_DISBURSEMENT_CAP_CENTS 2500000, approved); remaining split T2 = floor(remaining/2), T3 = remainder; zero-amount tranches are not
      created; a modification increase appends the delta as the next stage'
  - name: amount_cents
    type: integer
    source: computed
    description: Scheduled amount; may be reduced by clawback waterfall (never below 0)
  - name: status
    type: enum
    source: system
    description: SCHEDULED -> ELIGIBLE -> RELEASED; SCHEDULED | ELIGIBLE -> CANCELLED by clawback waterfall. T1 becomes ELIGIBLE when the loan activates; T_i (i>1) becomes ELIGIBLE when all prior tranches
      are RELEASED and cumulative verified milestone cost >= sum of amounts of stages < i
  - name: released_at
    type: datetime
    source: system
    description: Logical timestamp of release
    constraints: nullable
- name: RepairMilestone
  parent: null
  common_fields: true
  fields:
  - name: loan_id
    type: string
    source: system
    description: FK -> Loan.id; from the URL path
  - name: description
    type: string
    source: input
    description: Repair work description
  - name: claimed_cost_cents
    type: integer
    source: input
    description: Borrower-claimed completed repair cost in cents; > 0
  - name: verified_cost_cents
    type: integer
    source: input
    description: Verifier-confirmed cost recorded at decision time; 0 <= verified_cost_cents <= claimed_cost_cents
    constraints: null until VERIFIED
  - name: status
    type: enum
    source: system
    description: REPORTED -> VERIFIED | REJECTED
  - name: verifier_user_id
    type: string
    source: system
    description: X-User-ID of the deciding LossVerifier; MUST differ from the DamageVerification.verifier_user_id on the loan's application (segregation of duties)
    constraints: null until decided
- name: ModificationRequest
  parent: null
  common_fields: true
  fields:
  - name: loan_id
    type: string
    source: system
    description: FK -> Loan.id; from the URL path
  - name: requested_amount_cents
    type: integer
    source: input
    description: Requested NEW total approved amount in cents; > 0 and != current approved_amount_cents
  - name: reason
    type: string
    source: input
    description: Borrower justification (cost change)
  - name: status
    type: enum
    source: system
    description: SUBMITTED -> APPROVED | DENIED; a newer create auto-DENIES a still-SUBMITTED predecessor (supersede)
  - name: decided_by
    type: string
    source: system
    description: X-User-ID of the deciding LoanApprover
    constraints: null until decided
- name: InsuranceSettlement
  parent: null
  common_fields: true
  fields:
  - name: loan_id
    type: string
    source: system
    description: FK -> Loan.id; from the URL path
  - name: settlement_amount_cents
    type: integer
    source: input
    description: Post-disbursement insurance settlement in cents; > 0
  - name: received_date
    type: datetime
    source: input
    description: Date the applicant received the settlement
  - name: status
    type: enum
    source: system
    description: REPORTED -> APPLIED -> VOIDED
  - name: clawback_commitment_delta_cents
    type: integer
    source: computed
    description: Commitment reduction applied at apply time (>= 0)
    constraints: null until APPLIED
  - name: excess_due_cents
    type: integer
    source: computed
    description: Excess-funds amount generated at apply time (0 when none)
    constraints: null until APPLIED
- name: ExcessFundsReceivable
  parent: null
  common_fields: true
  fields:
  - name: loan_id
    type: string
    source: system
    description: FK -> Loan.id; at most one receivable per loan in {OPEN, PARTIALLY_PAID}; a later clawback on an OPEN/PARTIALLY_PAID receivable increases amount_due_cents instead of creating a new row
  - name: amount_due_cents
    type: integer
    source: computed
    description: Total excess funds owed
  - name: amount_paid_cents
    type: integer
    source: computed
    default: 0
    description: Cumulative receivable payments
  - name: due_date
    type: datetime
    source: computed
    description: = created_at + EXCESS_FUNDS_DUE_DAYS (30)
  - name: status
    type: enum
    source: system
    description: OPEN -> PARTIALLY_PAID -> PAID; OPEN | PARTIALLY_PAID -> ESCALATED when the loan enters DEFAULT
- name: ServicingAction
  parent: null
  common_fields: true
  fields:
  - name: loan_id
    type: string
    source: system
    description: FK -> Loan.id; from the URL path
  - name: action_type
    type: enum
    source: input
    description: DEFERMENT | HARDSHIP
  - name: start_date
    type: datetime
    source: input
    description: First day of accommodation (half-open interval start)
  - name: end_date
    type: datetime
    source: input
    description: First day AFTER the accommodation (half-open interval end); end_date > start_date; end_date - start_date <= ACCOMMODATION_MAX_DAYS (360)
  - name: status
    type: enum
    source: system
    description: REQUESTED -> APPROVED -> ACTIVE -> EXPIRED; REQUESTED -> DENIED. APPROVED -> ACTIVE and ACTIVE -> EXPIRED are clock-sweep transitions
  - name: decided_by
    type: string
    source: system
    description: X-User-ID of the deciding ServicingAgent
    constraints: null until decided
- name: Payment
  parent: null
  common_fields: false
  fields:
  - name: loan_id
    type: string
    source: system
    description: FK -> Loan.id; from the URL path
  - name: amount_cents
    type: integer
    source: input
    description: Borrower payment in cents; > 0 and <= late_fee_balance + accrued interest due + outstanding_balance at posting
  - name: fee_portion_cents
    type: integer
    source: computed
    description: Amount allocated to late_fee_balance (waterfall step 1)
  - name: interest_portion_cents
    type: integer
    source: computed
    description: Amount allocated to accrued interest (waterfall step 2)
  - name: principal_portion_cents
    type: integer
    source: computed
    description: Amount allocated to outstanding principal (waterfall step 3, remainder)
  - name: status
    type: enum
    source: system
    description: POSTED -> REVERSED
- name: GrantAward
  parent: null
  common_fields: false
  fields:
  - name: application_id
    type: string
    source: system
    description: FK -> LoanApplication.id; from the URL path
  - name: program_name
    type: string
    source: input
    description: External grant program name
  - name: award_amount_cents
    type: integer
    source: input
    description: Grant amount in cents; > 0
  - name: purpose_category
    type: enum
    source: input
    description: PHYSICAL_DAMAGE | ECONOMIC_INJURY; must equal the application's loan_purpose (ERR_INVALID_REQUEST otherwise)
state_machines:
- entity: DisasterDeclaration
  initial_state: OPEN
  terminal_states:
  - FULLY_CLOSED
  transitions:
  - from: OPEN
    to: PHYSICAL_CLOSED
    trigger: system clock sweep (POST /_clock/set_current_utc) when the new current_utc > physical_filing_deadline
    actor: system
    preconditions:
    - current_utc > physical_filing_deadline
    - current_utc <= economic_injury_filing_deadline
    side_effects:
    - increments version by 1
    - PHYSICAL_DAMAGE submissions under this declaration are thereafter rejected with ERR_PHYSICAL_FILING_CLOSED
  - from: OPEN
    to: FULLY_CLOSED
    trigger: system clock sweep when the new current_utc > economic_injury_filing_deadline
    actor: system
    preconditions:
    - current_utc > economic_injury_filing_deadline
    side_effects:
    - increments version by 1
    - all submissions under this declaration are thereafter rejected (ERR_PHYSICAL_FILING_CLOSED or ERR_EIDL_FILING_CLOSED by purpose)
  - from: PHYSICAL_CLOSED
    to: FULLY_CLOSED
    trigger: system clock sweep when the new current_utc > economic_injury_filing_deadline
    actor: system
    preconditions:
    - current_utc > economic_injury_filing_deadline
    side_effects:
    - increments version by 1
- entity: LoanApplication
  initial_state: DRAFT
  terminal_states:
  - APPROVED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /disaster-relief/loan-applications/{id}/submit
    actor: Applicant
    preconditions:
    - acting Applicant's X-User-ID == application.applicant_id (ERR_FORBIDDEN_OWNER)
    - declaration exists (ERR_NOT_FOUND)
    - 'purpose PHYSICAL_DAMAGE: current_utc <= declaration.physical_filing_deadline else ERR_PHYSICAL_FILING_CLOSED (deadline inclusive)'
    - 'purpose ECONOMIC_INJURY: current_utc <= declaration.economic_injury_filing_deadline else ERR_EIDL_FILING_CLOSED (deadline inclusive)'
    - declaration.counties contains county_fips with loan_purpose in its eligible_purposes else ERR_COUNTY_NOT_ELIGIBLE (checked AFTER deadline checks)
    side_effects:
    - submitted_at := current_utc
    - increments version by 1
  - from: SUBMITTED
    to: VERIFICATION
    trigger: POST /disaster-relief/loan-applications/{id}/credit-reviews with computed verdict PASS on a PHYSICAL_DAMAGE application
    actor: LoanOfficer
    preconditions:
    - application.status == SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)
    side_effects:
    - CreditReview row created with computed proposed_payment_cents / score_pass / dti_pass / verdict
    - increments version by 1
  - from: SUBMITTED
    to: DECISION_PENDING
    trigger: POST /disaster-relief/loan-applications/{id}/credit-reviews with computed verdict PASS on an ECONOMIC_INJURY application (skips damage verification entirely)
    actor: LoanOfficer
    preconditions:
    - application.status == SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)
    side_effects:
    - CreditReview row created
    - increments version by 1
  - from: SUBMITTED
    to: DECLINED
    trigger: POST /disaster-relief/loan-applications/{id}/credit-reviews with computed verdict FAIL
    actor: LoanOfficer
    preconditions:
    - application.status == SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)
    side_effects:
    - decline_reason := CREDIT_FAIL when score_pass is false else DTI_EXCEEDED
    - increments version by 1
  - from: VERIFICATION
    to: DECISION_PENDING
    trigger: POST /disaster-relief/damage-verifications/{id}/complete on the application's open verification
    actor: LossVerifier
    preconditions:
    - verification.status in {REQUESTED, DISPUTED} (ERR_VERIFICATION_NOT_OPEN)
    side_effects:
    - DamageVerification figures recorded; verified_loss_cents and net_verified_loss_cents computed (calc verified_loss_calc, net_verified_loss_calc)
    - application advances to DECISION_PENDING; increments version by 1
  - from: DECISION_PENDING
    to: APPROVED
    trigger: POST /disaster-relief/loan-applications/{id}/decision with decision APPROVED
    actor: LoanApprover
    preconditions:
    - application.status == DECISION_PENDING (ERR_APPLICATION_NOT_DECISION_PENDING)
    - 'PHYSICAL_DAMAGE: the application''s latest DamageVerification is in COMPLETED — a DISPUTED (or otherwise open) verification blocks approval (ERR_VERIFICATION_REQUIRED); this state-family gate is
      evaluated BEFORE any fiscal check'
    - computed approved_amount_cents > collateral threshold for purpose => collateral_description and collateral_value_cents present in payload with collateral_value_cents >= approved_amount_cents (ERR_COLLATERAL_REQUIRED)
    side_effects:
    - approved_amount_cents computed (calc approved_amount_calc)
    - Loan created in PENDING_ACCEPTANCE with computed rate/term/payment/commitment (hop 1 of approval cascade)
    - 'Loan creation spawns the DisbursementTranche schedule (hop 2): T1 = min(2500000, approved); remaining split T2 = floor(rem/2), T3 = rem - T2; zero-amount tranches not created'
    - application.loan_id set; increments version by 1
  - from: DECISION_PENDING
    to: DECLINED
    trigger: POST /disaster-relief/loan-applications/{id}/decision with decision DECLINED
    actor: LoanApprover
    preconditions:
    - application.status == DECISION_PENDING (ERR_APPLICATION_NOT_DECISION_PENDING)
    side_effects:
    - decline_reason := APPROVER_DECLINE
    - increments version by 1
    note: 'DECLINED is absorbing once reconsideration_count == MAX_RECONSIDERATIONS (2): no transition out is then reachable (request-reconsideration fails with ERR_RECONSIDERATION_LIMIT and decision fails
      with ERR_APPLICATION_NOT_DECISION_PENDING)'
  - from: DECLINED
    to: DECISION_PENDING
    trigger: POST /disaster-relief/loan-applications/{id}/request-reconsideration
    actor: Applicant
    preconditions:
    - acting Applicant owns the application (ERR_FORBIDDEN_OWNER)
    - application.status == DECLINED (ERR_APPLICATION_NOT_DECLINED)
    - reconsideration_count < MAX_RECONSIDERATIONS (2) (ERR_RECONSIDERATION_LIMIT)
    side_effects:
    - reconsideration_count += 1
    - decline_reason := null
    - increments version by 1
- entity: DamageVerification
  initial_state: REQUESTED
  terminal_states: []
  transitions:
  - from: REQUESTED
    to: COMPLETED
    trigger: POST /disaster-relief/damage-verifications/{id}/complete
    actor: LossVerifier
    preconditions:
    - verification.status == REQUESTED
    side_effects:
    - verified_loss_cents, net_verified_loss_cents computed; verifier_user_id := X-User-ID; completed_at := current_utc
    - the linked LoanApplication advances VERIFICATION -> DECISION_PENDING (cascade)
    - increments version by 1
  - from: DISPUTED
    to: COMPLETED
    trigger: POST /disaster-relief/damage-verifications/{id}/complete with corrected figures
    actor: LossVerifier
    preconditions:
    - verification.status == DISPUTED
    side_effects:
    - figures recomputed (verified_loss_cents, net_verified_loss_cents); completed_at := current_utc
    - linked application remains in DECISION_PENDING (it already advanced on first completion); application version unchanged
    - increments version by 1
  - from: COMPLETED
    to: DISPUTED
    trigger: POST /disaster-relief/damage-verifications/{id}/dispute
    actor: Applicant
    preconditions:
    - acting Applicant owns the linked application (ERR_FORBIDDEN_OWNER)
    - verification.status == COMPLETED (ERR_VERIFICATION_NOT_DISPUTABLE)
    - current_utc <= completed_at + DISPUTE_WINDOW_DAYS (30), inclusive (ERR_DISPUTE_WINDOW_CLOSED)
    - linked application.status != APPROVED (ERR_VERIFICATION_NOT_DISPUTABLE — post-approval loss changes flow through modification requests and insurance settlements instead)
    side_effects:
    - increments version by 1
- entity: Loan
  initial_state: PENDING_ACCEPTANCE
  terminal_states:
  - PAID_IN_FULL
  - CHARGED_OFF
  transitions:
  - from: PENDING_ACCEPTANCE
    to: ACTIVE
    trigger: POST /disaster-relief/loans/{id}/accept
    actor: Applicant
    preconditions:
    - acting Applicant's X-User-ID == loan.applicant_id (ERR_FORBIDDEN_OWNER)
    - loan.lifecycle_status == PENDING_ACCEPTANCE (ERR_LOAN_NOT_PENDING_ACCEPTANCE)
    side_effects:
    - 'hop 1: loan.lifecycle_status := ACTIVE; increments version by 1'
    - 'hop 2: tranche stage 1 transitions SCHEDULED -> ELIGIBLE (its own release still requires the release endpoint)'
  - from: ACTIVE
    to: PAID_IN_FULL
    trigger: system, at any event (payment or receivable payment) that drives outstanding_balance_cents to exactly 0
    actor: system
    preconditions:
    - outstanding_balance_cents == 0 after applying the event
    side_effects:
    - increments version by 1
  - from: ACTIVE
    to: CHARGED_OFF
    trigger: system clock sweep when days_past_due >= CHARGE_OFF_AFTER_DAYS (180)
    actor: system
    preconditions:
    - servicing_status == DEFAULT
    - days_past_due >= 180
    side_effects:
    - increments version by 1
    - no further payments accepted (ERR_LOAN_NOT_ACTIVE on POST /loans/{id}/payments)
  - from: CURRENT
    to: DEFERRED
    trigger: system clock sweep activating an APPROVED DEFERMENT ServicingAction whose start_date has been reached
    actor: system
    preconditions:
    - loan.servicing_status == CURRENT
    - the activated action.action_type == DEFERMENT
    side_effects:
    - next_due_date += (end_date - start_date) days
    - increments version by 1
  - from: CURRENT
    to: HARDSHIP
    trigger: system clock sweep activating an APPROVED HARDSHIP ServicingAction whose start_date has been reached
    actor: system
    preconditions:
    - loan.servicing_status == CURRENT
    - the activated action.action_type == HARDSHIP
    side_effects:
    - increments version by 1
  - from: DEFERRED
    to: CURRENT
    trigger: system clock sweep expiring the ACTIVE DEFERMENT (current_utc >= end_date)
    actor: system
    preconditions: []
    side_effects:
    - increments version by 1
  - from: HARDSHIP
    to: CURRENT
    trigger: system clock sweep expiring the ACTIVE HARDSHIP (current_utc >= end_date)
    actor: system
    preconditions: []
    side_effects:
    - increments version by 1
  - from: CURRENT
    to: DELINQUENT
    trigger: system clock sweep when days_past_due >= DELINQUENT_AFTER_DAYS (30)
    actor: system
    preconditions:
    - servicing_status == CURRENT
    side_effects:
    - increments version by 1
    - late fee of round_half_up(0.05 * monthly_payment_cents) added to late_fee_balance_cents once per due-date cycle at days_past_due >= 15
  - from: DELINQUENT
    to: CURRENT
    trigger: POST /disaster-relief/loans/{id}/payments that brings the loan contractually current (pays all accrued fees + interest + principal of missed scheduled amounts is NOT required — any POSTED payment
      that reduces arrears to zero, i.e. pays fee + accrued interest in full, cures)
    actor: Applicant
    preconditions:
    - payment POSTED
    - late_fee_balance_cents == 0 and accrued interest fully covered by the waterfall
    side_effects:
    - days_past_due := 0
    - increments version by 1
  - from: DELINQUENT
    to: DEFAULT
    trigger: system clock sweep when days_past_due >= DEFAULT_AFTER_DAYS (120)
    actor: system
    preconditions:
    - servicing_status == DELINQUENT
    side_effects:
    - 'hop 1: servicing_status := DEFAULT; increments version by 1'
    - 'hop 2: any OPEN or PARTIALLY_PAID ExcessFundsReceivable on this loan transitions to ESCALATED'
    - 'hop 3: all REQUESTED ServicingActions on this loan transition to DENIED'
- entity: DisbursementTranche
  initial_state: SCHEDULED
  terminal_states:
  - RELEASED
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: ELIGIBLE
    trigger: 'system: stage 1 when the loan becomes ACTIVE; stage i>1 when every stage < i is RELEASED and cumulative VERIFIED milestone cost >= sum of amounts of stages < i (re-evaluated at every milestone
      VERIFIED decision and every tranche RELEASE)'
    actor: system
    preconditions: []
    side_effects:
    - increments version by 1
  - from: ELIGIBLE
    to: RELEASED
    trigger: POST /disaster-relief/disbursement-tranches/{id}/release
    actor: ServicingAgent
    preconditions:
    - tranche.status == ELIGIBLE (ERR_TRANCHE_NOT_RELEASABLE)
    - loan.lifecycle_status == ACTIVE (ERR_LOAN_NOT_ACTIVE)
    side_effects:
    - released_at := current_utc; increments version by 1
    - loan.disbursed_total_cents += amount_cents; loan.outstanding_balance_cents += amount_cents (cascade hop 2)
    - 'first release on the loan: loan.last_accrual_date := released_at date and loan.next_due_date := released_at + deferral_months + 1 calendar months; later releases: accrued interest folded into accrued_interest_balance_cents
      and last_accrual_date advanced'
    - loan.version incremented
    - subsequent tranche eligibility re-evaluated (cascade hop 3)
  - from: SCHEDULED
    to: CANCELLED
    trigger: 'system: clawback waterfall (calc clawback_calc) walks un-released tranches in DESCENDING stage_number and cancels/reduces until sum of remaining un-released amounts == max(0, commitment_amount_cents
      - disbursed_total_cents)'
    actor: system
    preconditions: []
    side_effects:
    - increments version by 1
  - from: ELIGIBLE
    to: CANCELLED
    trigger: 'system: same clawback waterfall'
    actor: system
    preconditions: []
    side_effects:
    - increments version by 1
- entity: RepairMilestone
  initial_state: REPORTED
  terminal_states:
  - VERIFIED
  - REJECTED
  transitions:
  - from: REPORTED
    to: VERIFIED
    trigger: POST /disaster-relief/repair-milestones/{id}/decision with decision VERIFIED and verified_cost_cents
    actor: LossVerifier
    preconditions:
    - milestone.status == REPORTED (ERR_MILESTONE_NOT_REPORTED)
    - X-User-ID != DamageVerification.verifier_user_id of the loan's application's latest COMPLETED verification, when one exists (ERR_SEGREGATION_OF_DUTIES)
    - 0 <= verified_cost_cents <= claimed_cost_cents (ERR_INVALID_REQUEST)
    side_effects:
    - verifier_user_id := X-User-ID; increments version by 1
    - 'hop 2: loan''s un-released tranche eligibility re-evaluated (calc disbursement_waterfall_calc); a tranche crossing its threshold flips SCHEDULED -> ELIGIBLE'
  - from: REPORTED
    to: REJECTED
    trigger: POST /disaster-relief/repair-milestones/{id}/decision with decision REJECTED
    actor: LossVerifier
    preconditions:
    - milestone.status == REPORTED (ERR_MILESTONE_NOT_REPORTED)
    - segregation rule as above (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - verifier_user_id := X-User-ID; increments version by 1
- entity: ModificationRequest
  initial_state: SUBMITTED
  terminal_states:
  - APPROVED
  - DENIED
  transitions:
  - from: SUBMITTED
    to: APPROVED
    trigger: POST /disaster-relief/modification-requests/{id}/decision with decision APPROVED
    actor: LoanApprover
    preconditions:
    - modification.status == SUBMITTED (ERR_MODIFICATION_NOT_SUBMITTED)
    - requested_amount_cents <= applicant-type/purpose cap (calc approved_amount_calc constants) (ERR_MODIFICATION_EXCEEDS_CAP)
    side_effects:
    - loan.approved_amount_cents := requested_amount_cents; delta := new - old
    - 'delta > 0: commitment_amount_cents += delta; new DisbursementTranche appended at next stage_number with amount_cents = delta (SCHEDULED); loan.monthly_payment_cents recomputed (DEFERRED_CAPITALIZED
      variant on new approved amount)'
    - 'delta < 0: commitment_amount_cents := min(commitment_amount_cents, approved_amount_cents); clawback waterfall runs over un-released tranches; if disbursed_total_cents > new commitment_amount_cents
      an ExcessFundsReceivable is created/topped up for the difference'
    - decided_by := X-User-ID; increments version by 1; loan.version incremented
  - from: SUBMITTED
    to: DENIED
    trigger: POST /disaster-relief/modification-requests/{id}/decision with decision DENIED, OR system supersede when a newer ModificationRequest is created on the same loan while this one is SUBMITTED
    actor: LoanApprover
    preconditions:
    - modification.status == SUBMITTED (ERR_MODIFICATION_NOT_SUBMITTED)
    side_effects:
    - decided_by set for manual denial; increments version by 1
- entity: InsuranceSettlement
  initial_state: REPORTED
  terminal_states:
  - APPLIED
  - VOIDED
  transitions:
  - from: REPORTED
    to: APPLIED
    trigger: 'POST /disaster-relief/insurance-settlements/{id}/apply (OCC: expected_loan_version must match loan.version)'
    actor: ServicingAgent
    preconditions:
    - settlement.status == REPORTED (ERR_SETTLEMENT_NOT_REPORTED)
    - expected_loan_version == loan.version (ERR_STALE_VERSION)
    side_effects:
    - 'hop 1: calc clawback_calc runs: total_insurance = insurance_proceeds_cents (latest COMPLETED verification, else 0) + sum of APPLIED settlements + this settlement; new_net_loss = max(0, verified_loss
      - total_insurance); new_commitment = min(approved_amount_cents, new_net_loss); loan.commitment_amount_cents := new_commitment; loan.version incremented'
    - 'hop 2: clawback waterfall over un-released tranches (descending stage_number): cancel/reduce until sum(un-released amounts) == max(0, new_commitment - disbursed_total_cents)'
    - 'hop 3: if disbursed_total_cents > new_commitment after the tranche cascade: excess = disbursed_total_cents - new_commitment; create or top up the loan''s OPEN/PARTIALLY_PAID ExcessFundsReceivable
      by excess (due_date := current_utc + 30 days on creation)'
    - clawback_commitment_delta_cents and excess_due_cents recorded on the settlement; increments version by 1
  - from: APPLIED
    to: VOIDED
    trigger: POST /disaster-relief/insurance-settlements/{id}/void
    actor: ServicingAgent
    preconditions:
    - settlement.status == APPLIED (ERR_SETTLEMENT_NOT_APPLIED)
    side_effects:
    - 'compensation of the apply cascade: commitment_amount_cents += clawback_commitment_delta_cents; tranche amounts/status restored to their pre-apply values; if excess_due_cents > 0 the receivable''s
      amount_due_cents is reduced by excess_due_cents (a receivable driven to amount_due_cents == amount_paid_cents becomes PAID; a receivable with amount_due_cents reduced to 0 and amount_paid_cents ==
      0 is removed)'
    - increments version by 1; loan.version incremented
- entity: ExcessFundsReceivable
  initial_state: OPEN
  terminal_states:
  - PAID
  - ESCALATED
  transitions:
  - from: OPEN
    to: PARTIALLY_PAID
    trigger: POST /disaster-relief/excess-funds-receivables/{id}/payments with 0 < amount < remaining
    actor: Applicant
    preconditions:
    - acting Applicant owns the loan (ERR_FORBIDDEN_OWNER)
    - receivable.status in {OPEN, PARTIALLY_PAID} (ERR_RECEIVABLE_NOT_OPEN)
    - amount_cents <= amount_due_cents - amount_paid_cents (ERR_PAYMENT_EXCEEDS_BALANCE)
    side_effects:
    - amount_paid_cents += amount_cents
    - loan.outstanding_balance_cents -= amount_cents (the excess was disbursed principal); loan.total_principal_paid_cents += amount_cents; loan.version incremented
    - increments version by 1
  - from: OPEN
    to: PAID
    trigger: POST /disaster-relief/excess-funds-receivables/{id}/payments with amount == remaining
    actor: Applicant
    preconditions:
    - as above
    side_effects:
    - as above, then status := PAID
  - from: PARTIALLY_PAID
    to: PAID
    trigger: POST /disaster-relief/excess-funds-receivables/{id}/payments with amount == remaining
    actor: Applicant
    preconditions:
    - as above
    side_effects:
    - as above, then status := PAID
  - from: OPEN
    to: ESCALATED
    trigger: 'system: linked loan enters DEFAULT'
    actor: system
    preconditions: []
    side_effects:
    - increments version by 1
  - from: PARTIALLY_PAID
    to: ESCALATED
    trigger: 'system: linked loan enters DEFAULT'
    actor: system
    preconditions: []
    side_effects:
    - increments version by 1
- entity: ServicingAction
  initial_state: REQUESTED
  terminal_states:
  - DENIED
  - EXPIRED
  transitions:
  - from: REQUESTED
    to: APPROVED
    trigger: POST /disaster-relief/servicing-actions/{id}/decision with decision APPROVED
    actor: ServicingAgent
    preconditions:
    - action.status == REQUESTED (ERR_ACTION_NOT_REQUESTED)
    - loan.lifecycle_status == ACTIVE (ERR_LOAN_NOT_ACTIVE)
    - loan.servicing_status != DEFAULT (ERR_ACCOMMODATION_NOT_ALLOWED)
    - 'half-open interval [start_date, end_date) must not overlap any APPROVED or ACTIVE ServicingAction on the same loan: overlap iff start_date < other.end_date AND end_date > other.start_date; adjacency
      (end_date == other.start_date) is allowed (ERR_ACCOMMODATION_OVERLAP)'
    side_effects:
    - decided_by := X-User-ID; increments version by 1
    - if start_date <= current_utc the action immediately continues to ACTIVE in the same request and the loan servicing_status flips (CURRENT -> DEFERRED | HARDSHIP)
  - from: REQUESTED
    to: DENIED
    trigger: POST /disaster-relief/servicing-actions/{id}/decision with decision DENIED, or system when the loan enters DEFAULT
    actor: ServicingAgent
    preconditions:
    - action.status == REQUESTED (ERR_ACTION_NOT_REQUESTED)
    side_effects:
    - decided_by set for manual denial; increments version by 1
  - from: APPROVED
    to: ACTIVE
    trigger: system clock sweep when current_utc >= start_date
    actor: system
    preconditions: []
    side_effects:
    - 'loan.servicing_status flips to DEFERRED or HARDSHIP by action_type; DEFERMENT: loan.next_due_date += (end_date - start_date) days; loan.version incremented'
    - increments version by 1
  - from: ACTIVE
    to: EXPIRED
    trigger: system clock sweep when current_utc >= end_date
    actor: system
    preconditions: []
    side_effects:
    - loan.servicing_status returns to CURRENT; increments version by 1
    - loan.version incremented
- entity: Payment
  initial_state: POSTED
  terminal_states:
  - POSTED
  - REVERSED
  transitions:
  - from: POSTED
    to: REVERSED
    trigger: POST /disaster-relief/payments/{id}/reverse
    actor: ServicingAgent
    preconditions:
    - payment.status == POSTED (ERR_INVALID_REQUEST)
    side_effects:
    - 'compensation: loan.outstanding_balance_cents += principal_portion_cents; total_principal_paid_cents -= principal_portion_cents; total_interest_paid_cents -= interest_portion_cents; accrued_interest_balance_cents
      += interest_portion_cents; late_fee_balance_cents += fee_portion_cents; loan.last_accrual_date restored to its pre-payment value'
    - if the payment had transitioned the loan to PAID_IN_FULL, the loan returns to ACTIVE
    - loan.version incremented
concurrency_rules:
- rule_id: modification-create-stale-loan
  parent_entity: Loan
  write_endpoint: POST /disaster-relief/loans/{id}/modification-requests
  occ_field: expected_loan_version
  description: 'Creating a ModificationRequest against a Loan whose version has advanced

    since the client last observed it is rejected. A successful create bumps

    loan.version (and auto-denies any still-SUBMITTED predecessor), so a

    second create carrying the previously observed version is stale and must

    be refused deterministically.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: settlement-apply-stale-loan
  parent_entity: Loan
  write_endpoint: POST /disaster-relief/insurance-settlements/{id}/apply
  occ_field: expected_loan_version
  description: 'Applying an InsuranceSettlement rewrites the loan''s commitment, tranche

    schedule, and possibly its receivable. The client must present the loan

    version it based its figures on; any loan mutation since then (another

    settlement applied, a modification approved, a tranche released) makes

    the presented version stale and the apply is rejected.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: verified_loss_calc
  trigger: POST /disaster-relief/damage-verifications/{id}/complete
  algorithm: threshold
  formula: "if valuation_basis == REPLACEMENT_COST:\n    verified_loss_cents = assessed_loss_cents\nelse:  # ACTUAL_CASH_VALUE\n    verified_loss_cents = round_half_up(assessed_loss_cents * (1 - depreciation_pct))\n\
    net_verified_loss_cents = max(0, verified_loss_cents - insurance_proceeds_cents)\n"
  input_set: the DamageVerification being completed
  constants:
    MAX_DEPRECIATION_PCT: 0.9
    ESTIMATION_MAX_CENTS: 2500000
  precision: integer cents; multiplication in exact decimal, round_half_up to cents
  variants:
  - name: replacement_cost
    when: valuation_basis == REPLACEMENT_COST
    difference: full assessed loss counts; depreciation ignored
  - name: actual_cash_value
    when: valuation_basis == ACTUAL_CASH_VALUE
    difference: assessed loss reduced by depreciation_pct; same assessed_loss_cents yields a strictly smaller verified_loss_cents whenever depreciation_pct > 0
- name: approved_amount_calc
  trigger: POST /disaster-relief/loan-applications/{id}/decision with decision APPROVED
  algorithm: tiered_pricing
  formula: "# evaluation order is pinned; each step's output feeds the next\n(1) cap_cents = CAP[applicant_type][loan_purpose]:\n      HOMEOWNER/PHYSICAL=50000000, RENTER/PHYSICAL=10000000,\n      BUSINESS/PHYSICAL=200000000,\
    \ any/ECONOMIC_INJURY=200000000\n(2) loss_bound_cents:\n      PHYSICAL_DAMAGE -> max(0, net_verified_loss_cents(latest COMPLETED verification)\n                               - sum(GrantAward.award_amount_cents\
    \ where purpose_category == PHYSICAL_DAMAGE))\n      ECONOMIC_INJURY -> requested_amount_cents\n                               - sum(GrantAward.award_amount_cents where purpose_category == ECONOMIC_INJURY)\
    \ is NOT subtracted pre-approval;\n                                 grant offsets for EIDL apply only to the DOB ceiling in dob_check\n(3) affordability_cap_cents = largest principal whose STANDARD-variant\
    \ monthly payment P\n      satisfies (verified_monthly_debt_cents + P) * 100 <= 43 * floor(annual_income_cents/12),\n      computed by inverting the amortization formula at the loan's rate/term (floor\
    \ to cents)\n(4) approved_amount_cents = min(requested_amount_cents, cap_cents, loss_bound_cents, affordability_cap_cents)\n      for ECONOMIC_INJURY the loss_bound term is omitted (min over the remaining\
    \ three)\n"
  input_set: the application, its applicant, the latest PASS CreditReview, the latest COMPLETED DamageVerification (physical only), all GrantAwards on the application
  constants:
    HOMEOWNER_PHYSICAL_CAP_CENTS: 50000000
    RENTER_PHYSICAL_CAP_CENTS: 10000000
    BUSINESS_PHYSICAL_CAP_CENTS: 200000000
    EIDL_CAP_CENTS: 200000000
    MAX_DTI_PERCENT: 43
  precision: integer cents
- name: monthly_payment_calc
  trigger: credit review (STANDARD variant on requested_amount_cents); loan origination and approved modification (DEFERRED_CAPITALIZED variant on approved_amount_cents)
  algorithm: forward_looking
  formula: "r = interest_rate / 12                       # exact decimal division\nSTANDARD:            P = L * r * (1+r)^term / ((1+r)^term - 1)\nDEFERRED_CAPITALIZED: L' = L * (1 + r * deferral_months)\
    \   # simple accrual during deferral, capitalized\n                      P = L' * r * (1+r)^term / ((1+r)^term - 1)\nrate/term selection: HOMEOWNER physical -> 0.03125 / 360; RENTER physical -> 0.03125\
    \ / 84;\n                     BUSINESS physical -> 0.04 / 360; ECONOMIC_INJURY (any type) -> 0.04 / 360\n"
  input_set: principal L (requested or approved), applicant_type, loan_purpose
  constants:
    INTEREST_RATE_PERSONAL: 0.03125
    INTEREST_RATE_BUSINESS: 0.04
    TERM_MONTHS_HOMEOWNER: 360
    TERM_MONTHS_RENTER: 84
    TERM_MONTHS_BUSINESS: 360
    TERM_MONTHS_EIDL: 360
    DEFERRAL_MONTHS: 12
  precision: compute in exact decimal; round_half_up to integer cents at the final step only
  variants:
  - name: standard
    when: credit review affordability analysis (no deferral capitalization)
    difference: payment computed on unadjusted principal L
  - name: deferred_capitalized
    when: the loan's scheduled monthly payment (all disaster loans carry a 12-month deferral whose interest capitalizes)
    difference: same L, rate and term yield a strictly larger payment because interest accrued over deferral_months is capitalized into principal first
- name: disbursement_waterfall_calc
  trigger: re-evaluated at every milestone VERIFIED decision and every tranche RELEASE
  algorithm: waterfall_allocation
  formula: "verified_total = sum(RepairMilestone.verified_cost_cents where status == VERIFIED and loan_id == loan)\nwalk tranches in ASCENDING stage_number:\n  stage 1: ELIGIBLE iff loan.lifecycle_status\
    \ == ACTIVE\n  stage i>1: ELIGIBLE iff every stage j<i is RELEASED\n             AND verified_total >= sum(amount_cents of stages j<i)   # boundary: equality suffices\nrelease of an ELIGIBLE tranche\
    \ moves the full amount_cents (no partial release)\n"
  input_set: all tranches and VERIFIED milestones of the loan
  constants:
    INITIAL_DISBURSEMENT_CAP_CENTS: 2500000
  precision: integer cents
- name: payment_allocation_calc
  trigger: POST /disaster-relief/loans/{id}/payments
  algorithm: waterfall_allocation
  formula: "# evaluation + rounding order is pinned; reordering changes the cents\n(1) interest_due = accrued_interest_balance_cents\n                   + round_half_up(outstanding_balance_cents * interest_rate\
    \ * days_since(last_accrual_date) / 365)\n    (this single accrual step rounds to cents HERE, before any allocation)\n(2) fee_portion_cents      = min(amount_cents, late_fee_balance_cents);        rem\
    \ = amount_cents - fee_portion_cents\n(3) interest_portion_cents = min(rem, interest_due);                           rem -= interest_portion_cents\n(4) principal_portion_cents = rem          # remainder\
    \ always lands on principal\npost: late_fee_balance_cents -= fee_portion_cents; accrued_interest_balance_cents = interest_due - interest_portion_cents;\n      outstanding_balance_cents -= principal_portion_cents;\
    \ last_accrual_date := current date;\n      total_principal_paid_cents += principal_portion_cents; total_interest_paid_cents += interest_portion_cents\nreject: amount_cents > late_fee_balance_cents\
    \ + interest_due + outstanding_balance_cents -> ERR_PAYMENT_EXCEEDS_BALANCE\n        (equality = exact payoff is ALLOWED and transitions the loan to PAID_IN_FULL)\n"
  input_set: the loan and the payment amount
  constants:
    DAYS_IN_YEAR: 365
  precision: integer cents, round_half_up; the accrual rounding happens exactly once at step (1)
- name: clawback_calc
  trigger: POST /disaster-relief/insurance-settlements/{id}/apply; also ModificationRequest APPROVED with delta < 0 (with total_insurance held at its current value)
  algorithm: chronological
  formula: "# circular-looking dependency pinned to this exact evaluation order:\n(1) total_insurance = insurance_proceeds_cents(latest COMPLETED verification, else 0)\n                      + sum(settlement_amount_cents\
    \ of APPLIED settlements) + this settlement_amount_cents\n(2) new_net_loss   = max(0, verified_loss_cents - total_insurance)         # depends on (1)\n(3) new_commitment = min(approved_amount_cents,\
    \ new_net_loss)              # depends on (2)\n(4) clawback waterfall over un-released tranches in DESCENDING stage_number:\n      cancel whole tranches (largest stage first) while sum(un-released)\
    \ - tranche.amount >= target,\n      else reduce the current tranche so that sum(un-released) == target,\n      where target = max(0, new_commitment - disbursed_total_cents)        # depends on (3)\n\
    (5) excess_due = max(0, disbursed_total_cents - new_commitment)            # depends on (3); computed AFTER (4) settles\n(6) excess_due > 0 -> create or top up the loan's OPEN/PARTIALLY_PAID ExcessFundsReceivable\
    \ by excess_due\n"
  input_set: the loan, its settlements, the latest COMPLETED verification, all un-released tranches
  constants:
    EXCESS_FUNDS_DUE_DAYS: 30
  precision: integer cents
- name: delinquency_aging_calc
  trigger: system clock sweep (POST /_clock/set_current_utc), evaluated per ACTIVE loan in ascending created_at order
  algorithm: threshold
  formula: "if servicing_status in {DEFERRED, HARDSHIP}: days_past_due stays 0; no aging, no fees\nelif next_due_date is null or current_date <= next_due_date: days_past_due := 0\nelse: days_past_due :=\
    \ calendar days between next_due_date and current_date\nlate fee: at days_past_due >= 15 (and no fee yet assessed for this due-date cycle):\n          late_fee_balance_cents += round_half_up(0.05 *\
    \ monthly_payment_cents)\nstatus:   days_past_due >= 30  -> CURRENT to DELINQUENT (boundary: exactly 30 qualifies)\n          days_past_due >= 120 -> DELINQUENT to DEFAULT (boundary: exactly 120 qualifies)\n\
    \          days_past_due >= 180 -> DEFAULT to lifecycle CHARGED_OFF (boundary: exactly 180 qualifies)\na single sweep applies the full cascade: fees first, then the furthest applicable status\n"
  input_set: all loans with lifecycle_status == ACTIVE
  constants:
    LATE_FEE_GRACE_DAYS: 15
    LATE_FEE_PCT: 0.05
    DELINQUENT_AFTER_DAYS: 30
    DEFAULT_AFTER_DAYS: 120
    CHARGE_OFF_AFTER_DAYS: 180
  precision: integer days; fee in integer cents round_half_up
- name: dob_check
  trigger: POST /disaster-relief/loan-applications/{id}/grant-awards (any application status)
  algorithm: aggregation
  formula: "assistance_total = verified insurance + grants + loan commitment for the same purpose:\n  PHYSICAL_DAMAGE:  insurance_proceeds_cents(latest COMPLETED verification, else 0)\n                \
    \    + sum(settlement_amount_cents of APPLIED settlements on the loan, if any)\n                    + sum(GrantAward.award_amount_cents with purpose_category == PHYSICAL_DAMAGE, including the new one)\n\
    \                    + (loan.commitment_amount_cents if the application is APPROVED else 0)\nreject the grant with ERR_DUPLICATION_OF_BENEFITS when\n  assistance_total > verified_loss_cents(latest COMPLETED\
    \ verification, else 0)\nECONOMIC_INJURY grants are always accepted (no verified loss ceiling exists pre-approval);\nboundary: assistance_total == verified_loss_cents is ALLOWED (strictly-greater rejection)\n"
  input_set: the application, its verification, its loan (if any), its grants
  constants: {}
  precision: integer cents
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present and non-empty
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: X-User-Role is permitted on this endpoint per the endpoint's roles list
  error_id: ERR_UNAUTHORIZED
  http_status: 403
  applies_to: all
- priority: 3
  category: auth
  check: 'entity-backed ownership: when role is Applicant, X-User-ID must equal the applicant_id of the target resource (application, loan, verification via application, milestone via loan, receivable via
    loan, servicing action via loan, settlement via loan)'
  error_id: ERR_FORBIDDEN_OWNER
  http_status: 403
  applies_to: all Applicant endpoints under /disaster-relief
- priority: 4
  category: existence
  check: path identifiers resolve to existing rows, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 5
  category: business_constraint
  check: 'request body well-formed: required fields present, enums in range, amounts > 0 where required, deprecation_pct range 0<p<=0.90 and present iff valuation_basis == ACTUAL_CASH_VALUE, end_date >
    start_date, grant purpose_category == application.loan_purpose'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
- priority: 6
  category: state
  check: 'OCC: expected_loan_version equals loan.version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to:
  - POST /disaster-relief/loans/{id}/modification-requests
  - POST /disaster-relief/insurance-settlements/{id}/apply
- priority: 7
  category: business_referential
  check: 'damage verification create: application.loan_purpose == PHYSICAL_DAMAGE (EIDL files have no physical verification step)'
  error_id: ERR_VERIFICATION_NOT_APPLICABLE
  http_status: 409
  applies_to:
  - POST /disaster-relief/loan-applications/{id}/damage-verifications
- priority: 8
  category: state
  check: target resource in a state that admits the operation (application DRAFT for submit; SUBMITTED for credit review; VERIFICATION for verification create; DECISION_PENDING for decision; DECLINED for
    reconsideration; verification REQUESTED/DISPUTED for complete and COMPLETED for dispute; loan PENDING_ACCEPTANCE for accept and ACTIVE for milestones/modifications/payments/settlement reports/servicing
    approval; milestone REPORTED for decision; tranche ELIGIBLE for release; modification SUBMITTED for decision; settlement REPORTED for apply / APPLIED for void; receivable OPEN/PARTIALLY_PAID for payment;
    action REQUESTED for decision). The error_id shown here is the exemplar; each gate returns its own per-state error from §1.6 (ERR_APPLICATION_NOT_DRAFT, ERR_APPLICATION_NOT_SUBMITTED, ERR_APPLICATION_NOT_IN_VERIFICATION,
    ERR_APPLICATION_NOT_DECISION_PENDING, ERR_APPLICATION_NOT_DECLINED, ERR_VERIFICATION_NOT_OPEN, ERR_VERIFICATION_NOT_DISPUTABLE, ERR_LOAN_NOT_PENDING_ACCEPTANCE, ERR_LOAN_NOT_ACTIVE, ERR_MILESTONE_NOT_REPORTED,
    ERR_TRANCHE_NOT_RELEASABLE, ERR_MODIFICATION_NOT_SUBMITTED, ERR_SETTLEMENT_NOT_REPORTED, ERR_SETTLEMENT_NOT_APPLIED, ERR_RECEIVABLE_NOT_OPEN, ERR_ACTION_NOT_REQUESTED)
  error_id: ERR_APPLICATION_NOT_DRAFT
  http_status: 409
  applies_to: all state-transition endpoints — the concrete error_id is the per-state one from §1.6 (e.g. ERR_APPLICATION_NOT_DRAFT, ERR_LOAN_NOT_ACTIVE)
- priority: 9
  category: business_temporal
  check: 'submit: current_utc <= the purpose''s filing deadline (inclusive)'
  error_id: ERR_PHYSICAL_FILING_CLOSED
  http_status: 422
  applies_to:
  - POST /disaster-relief/loan-applications/{id}/submit (PHYSICAL_DAMAGE)
- priority: 10
  category: business_temporal
  check: 'submit: current_utc <= economic_injury_filing_deadline (inclusive)'
  error_id: ERR_EIDL_FILING_CLOSED
  http_status: 422
  applies_to:
  - POST /disaster-relief/loan-applications/{id}/submit (ECONOMIC_INJURY)
- priority: 11
  category: business_referential
  check: 'submit: county_fips appears in the declaration''s counties with loan_purpose among its eligible_purposes; evaluated AFTER the deadline checks, so a past-deadline submission to an ineligible county
    reports the deadline error'
  error_id: ERR_COUNTY_NOT_ELIGIBLE
  http_status: 422
  applies_to:
  - POST /disaster-relief/loan-applications/{id}/submit
- priority: 12
  category: business_temporal
  check: 'dispute: current_utc <= completed_at + 30 days (inclusive)'
  error_id: ERR_DISPUTE_WINDOW_CLOSED
  http_status: 422
  applies_to:
  - POST /disaster-relief/damage-verifications/{id}/dispute
- priority: 13
  category: business_safety
  check: 'segregation of duties: the LossVerifier deciding a RepairMilestone must not be the verifier_user_id of the application''s latest COMPLETED DamageVerification'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to:
  - POST /disaster-relief/repair-milestones/{id}/decision
- priority: 14
  category: business_safety
  check: 'duplication of benefits: posting a grant must not push assistance_total over verified_loss_cents (calc dob_check; equality allowed)'
  error_id: ERR_DUPLICATION_OF_BENEFITS
  http_status: 422
  applies_to:
  - POST /disaster-relief/loan-applications/{id}/grant-awards
- priority: 15
  category: business_constraint
  check: 'declaration create: for every declared county, no other declaration covers the same county_fips with an incident window [incident_start_date, incident_end_date] that intersects (inclusive both
    ends — shared boundary day counts as overlap)'
  error_id: ERR_DECLARATION_WINDOW_OVERLAP
  http_status: 409
  applies_to:
  - POST /disaster-relief/disaster-declarations
- priority: 16
  category: business_constraint
  check: 'servicing action approve: half-open [start_date, end_date) must not overlap another APPROVED/ACTIVE action on the same loan; adjacency allowed'
  error_id: ERR_ACCOMMODATION_OVERLAP
  http_status: 409
  applies_to:
  - POST /disaster-relief/servicing-actions/{id}/decision
- priority: 17
  category: business_constraint
  check: 'servicing action approve: loan.servicing_status != DEFAULT and lifecycle ACTIVE'
  error_id: ERR_ACCOMMODATION_NOT_ALLOWED
  http_status: 409
  applies_to:
  - POST /disaster-relief/servicing-actions/{id}/decision
- priority: 18
  category: business_constraint
  check: 'verification create: method == ESTIMATION requires requested_amount_cents <= 2500000'
  error_id: ERR_ESTIMATION_NOT_ALLOWED
  http_status: 422
  applies_to:
  - POST /disaster-relief/loan-applications/{id}/damage-verifications
- priority: 19
  category: business_constraint
  check: 'reconsideration: reconsideration_count < 2'
  error_id: ERR_RECONSIDERATION_LIMIT
  http_status: 409
  applies_to:
  - POST /disaster-relief/loan-applications/{id}/request-reconsideration
- priority: 20
  category: business_fiscal
  check: 'credit review records a computed verdict instead of raising: score_pass == (credit_score >= 640), dti_pass == ((verified_monthly_debt_cents + proposed_payment_cents) * 100 <= 43 * floor(annual_income_cents/12));
    a FAIL verdict transitions the application to DECLINED and is NOT an error response'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to:
  - POST /disaster-relief/loan-applications/{id}/credit-reviews (only malformed bodies error; verdict outcomes never do)
- priority: 21
  category: business_fiscal
  check: 'approval: collateral fields required iff approved_amount_cents strictly greater than the purpose''s collateral threshold; collateral_value_cents >= approved_amount_cents'
  error_id: ERR_COLLATERAL_REQUIRED
  http_status: 422
  applies_to:
  - POST /disaster-relief/loan-applications/{id}/decision
- priority: 22
  category: business_fiscal
  check: 'modification decision APPROVED: requested_amount_cents <= cap for applicant_type x loan_purpose'
  error_id: ERR_MODIFICATION_EXCEEDS_CAP
  http_status: 422
  applies_to:
  - POST /disaster-relief/modification-requests/{id}/decision
- priority: 23
  category: business_fiscal
  check: 'payment: 0 < amount_cents <= late_fee_balance + interest_due + outstanding_balance (equality allowed)'
  error_id: ERR_PAYMENT_EXCEEDS_BALANCE
  http_status: 422
  applies_to:
  - POST /disaster-relief/loans/{id}/payments
  - POST /disaster-relief/excess-funds-receivables/{id}/payments
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: 'Set the server''s logical clock (test-driving endpoint). Startup default before any call is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Setting the clock runs the
    sweep: declaration status rollup, servicing-action activation/expiry, delinquency aging (fees, DELINQUENT at 30, DEFAULT at 120, CHARGE_OFF at 180), receivable escalation on default.'
  roles:
  - SystemAdmin
  code: 200
  input:
  - current_utc
  output:
    current_utc: datetime
  side_effects:
  - runs the full time-driven sweep described in calc delinquency_aging_calc and the ServicingAction/DisasterDeclaration machines
- method: POST
  path: /disaster-relief/disaster-declarations
  description: Declare a disaster, opening loan availability for the declared geography
  roles:
  - SystemAdmin
  code: 201
  input:
  - declaration_number
  - disaster_type
  - incident_start_date
  - incident_end_date
  - declared_date
  - counties
  output: DisasterDeclaration
  side_effects:
  - physical_filing_deadline and economic_injury_filing_deadline computed
  - status := OPEN
- method: POST
  path: /disaster-relief/applicants
  description: Self-register an applicant (homeowner, renter or business)
  roles:
  - Anonymous
  code: 201
  input:
  - full_name
  - email
  - applicant_type
  - annual_income_cents
  - monthly_debt_cents
  output: Applicant
  side_effects: []
- method: POST
  path: /disaster-relief/loan-applications
  description: Create a DRAFT application; applicant_id comes from the caller's X-User-ID; results ordered by created_at ASC
  roles:
  - Applicant
  code: 201
  input:
  - declaration_id
  - county_fips
  - loan_purpose
  - requested_amount_cents
  output: LoanApplication
  side_effects: []
- method: GET
  path: /disaster-relief/loan-applications
  description: Paginated list of applications; reverse-lookup for the declaration_id, applicant_id and loan_id foreign keys; results ordered by created_at ASC
  roles:
  - Applicant
  - LoanOfficer
  - LoanApprover
  - ServicingAgent
  - LossVerifier
  - GrantCoordinator
  code: 200
  input:
  - applicant_id?
  - declaration_id?
  - loan_id?
  - status?
  - limit?
  - offset?
  output: LoanApplication[]
  side_effects: []
- method: GET
  path: /disaster-relief/loan-applications/{id}
  description: Read one application
  roles:
  - Applicant
  - LoanOfficer
  - LoanApprover
  - ServicingAgent
  - LossVerifier
  - GrantCoordinator
  code: 200
  input: []
  output: LoanApplication
  side_effects: []
- method: POST
  path: /disaster-relief/loan-applications/{id}/submit
  description: Submit a DRAFT application; enforces declaration status, filing deadline (purpose-specific, inclusive), county eligibility
  roles:
  - Applicant
  code: 200
  input: []
  output: LoanApplication
  side_effects:
  - status DRAFT -> SUBMITTED
  - submitted_at := current_utc
- method: POST
  path: /disaster-relief/loan-applications/{id}/request-reconsideration
  description: Move a DECLINED application back to DECISION_PENDING; at most MAX_RECONSIDERATIONS (2) times
  roles:
  - Applicant
  code: 200
  input: []
  output: LoanApplication
  side_effects:
  - reconsideration_count += 1
  - decline_reason := null
- method: POST
  path: /disaster-relief/loan-applications/{id}/credit-reviews
  description: 'File the credit review; verdict is computed (never client-supplied) and drives the application: PASS -> VERIFICATION (physical) or DECISION_PENDING (EIDL); FAIL -> DECLINED'
  roles:
  - LoanOfficer
  code: 201
  input:
  - credit_score
  - verified_monthly_debt_cents
  output: CreditReview
  side_effects:
  - computes proposed_payment_cents (STANDARD variant), score_pass, dti_pass, verdict
  - transitions the application
- method: GET
  path: /disaster-relief/loan-applications/{id}/credit-reviews
  description: List credit reviews of an application (FK reverse lookup)
  roles:
  - LoanOfficer
  - LoanApprover
  - ServicingAgent
  code: 200
  input:
  - limit?
  - offset?
  output: CreditReview[]
  side_effects: []
- method: POST
  path: /disaster-relief/loan-applications/{id}/decision
  description: Approve or decline a DECISION_PENDING application. Approve computes approved_amount_cents and creates the Loan plus its tranche schedule.
  roles:
  - LoanApprover
  code: 200
  input:
  - decision
  - collateral_description?
  - collateral_value_cents?
  output: LoanApplication
  side_effects:
  - 'APPROVED: computes approved_amount_cents (calc approved_amount_calc), creates Loan (PENDING_ACCEPTANCE) and its DisbursementTranche schedule, sets application.loan_id'
  - 'DECLINED: decline_reason := APPROVER_DECLINE'
- method: POST
  path: /disaster-relief/loan-applications/{id}/damage-verifications
  description: Open a damage verification (inspection or estimation) on a VERIFICATION application
  roles:
  - LossVerifier
  code: 201
  input:
  - method
  - valuation_basis
  - depreciation_pct?
  output: DamageVerification
  side_effects: []
- method: GET
  path: /disaster-relief/loan-applications/{id}/damage-verifications
  description: List verifications of an application (FK reverse lookup)
  roles:
  - LossVerifier
  - LoanApprover
  - LoanOfficer
  - Applicant
  code: 200
  input:
  - limit?
  - offset?
  output: DamageVerification[]
  side_effects: []
- method: POST
  path: /disaster-relief/damage-verifications/{id}/complete
  description: Record assessed loss and insurance proceeds; computes verified/net loss; first completion advances the application to DECISION_PENDING; also resolves a DISPUTED verification
  roles:
  - LossVerifier
  code: 200
  input:
  - assessed_loss_cents
  - insurance_proceeds_cents
  output: DamageVerification
  side_effects:
  - verified_loss_cents and net_verified_loss_cents computed (calc verified_loss_calc)
  - application VERIFICATION -> DECISION_PENDING on first completion
- method: POST
  path: /disaster-relief/damage-verifications/{id}/dispute
  description: Applicant disputes a COMPLETED verification within 30 days of completion (pre-approval only)
  roles:
  - Applicant
  code: 200
  input: []
  output: DamageVerification
  side_effects:
  - status COMPLETED -> DISPUTED
- method: POST
  path: /disaster-relief/loan-applications/{id}/grant-awards
  description: Report an external grant on the application; enforces duplication-of-benefits ceiling (calc dob_check)
  roles:
  - GrantCoordinator
  code: 201
  input:
  - program_name
  - award_amount_cents
  - purpose_category
  output: GrantAward
  side_effects:
  - dob_check; rejection ERR_DUPLICATION_OF_BENEFITS when the ceiling would be exceeded
- method: GET
  path: /disaster-relief/loan-applications/{id}/grant-awards
  description: List grants reported on an application (FK reverse lookup)
  roles:
  - GrantCoordinator
  - LoanApprover
  - LoanOfficer
  - ServicingAgent
  code: 200
  input:
  - limit?
  - offset?
  output: GrantAward[]
  side_effects: []
- method: GET
  path: /disaster-relief/loans
  description: Paginated list of loans; reverse-lookup for Loan.application_id and Loan.applicant_id; servicing_status filter powers the servicing portfolio view
  roles:
  - LoanOfficer
  - LoanApprover
  - ServicingAgent
  - LossVerifier
  - GrantCoordinator
  code: 200
  input:
  - application_id?
  - applicant_id?
  - servicing_status?
  - lifecycle_status?
  - limit?
  - offset?
  output: Loan[]
  side_effects: []
- method: GET
  path: /disaster-relief/loans/{id}
  description: Read one loan (all computed ledger fields)
  roles:
  - Applicant
  - LoanOfficer
  - LoanApprover
  - ServicingAgent
  - LossVerifier
  code: 200
  input: []
  output: Loan
  side_effects: []
- method: POST
  path: /disaster-relief/loans/{id}/accept
  description: Borrower accepts the approved loan; activates it and makes tranche 1 eligible
  roles:
  - Applicant
  code: 200
  input: []
  output: Loan
  side_effects:
  - lifecycle PENDING_ACCEPTANCE -> ACTIVE
  - tranche stage 1 SCHEDULED -> ELIGIBLE
- method: GET
  path: /disaster-relief/loans/{id}/disbursement-tranches
  description: List the loan's tranche schedule (FK reverse lookup); results ordered by stage_number ASC
  roles:
  - Applicant
  - ServicingAgent
  - LoanApprover
  - LossVerifier
  code: 200
  input:
  - limit?
  - offset?
  output: DisbursementTranche[]
  side_effects: []
- method: POST
  path: /disaster-relief/loans/{id}/repair-milestones
  description: Borrower reports a completed repair milestone
  roles:
  - Applicant
  code: 201
  input:
  - description
  - claimed_cost_cents
  output: RepairMilestone
  side_effects: []
- method: GET
  path: /disaster-relief/loans/{id}/repair-milestones
  description: List the loan's repair milestones (FK reverse lookup)
  roles:
  - Applicant
  - ServicingAgent
  - LossVerifier
  - LoanApprover
  code: 200
  input:
  - limit?
  - offset?
  output: RepairMilestone[]
  side_effects: []
- method: POST
  path: /disaster-relief/repair-milestones/{id}/decision
  description: Verifier confirms or rejects a reported milestone; VERIFIED re-evaluates tranche eligibility (calc disbursement_waterfall_calc); segregation of duties enforced
  roles:
  - LossVerifier
  code: 200
  input:
  - decision
  - verified_cost_cents?
  output: RepairMilestone
  side_effects:
  - 'VERIFIED: verified_cost_cents recorded; tranche eligibility re-evaluated'
  - 'REJECTED: no cascade'
- method: POST
  path: /disaster-relief/disbursement-tranches/{id}/release
  description: Release an ELIGIBLE tranche; moves money onto the loan ledger
  roles:
  - ServicingAgent
  code: 200
  input: []
  output: DisbursementTranche
  side_effects:
  - loan.disbursed_total_cents and outstanding_balance_cents += amount_cents
  - first release sets last_accrual_date and next_due_date
  - loan.version incremented
  - next-tranche eligibility re-evaluated
- method: POST
  path: /disaster-relief/loans/{id}/modification-requests
  description: Borrower requests a new total approved amount (cost change). OCC-guarded; supersedes (auto-DENIES) any still-SUBMITTED predecessor.; results ordered by created_at ASC
  roles:
  - Applicant
  code: 201
  input:
  - requested_amount_cents
  - reason
  - expected_loan_version
  output: ModificationRequest
  side_effects:
  - auto-DENIES a still-SUBMITTED predecessor modification on the same loan
  - increments loan.version by 1
- method: GET
  path: /disaster-relief/loans/{id}/modification-requests
  description: List modification requests on a loan (FK reverse lookup); results ordered by created_at ASC
  roles:
  - Applicant
  - LoanApprover
  - ServicingAgent
  code: 200
  input:
  - limit?
  - offset?
  output: ModificationRequest[]
  side_effects: []
- method: POST
  path: /disaster-relief/modification-requests/{id}/decision
  description: Approve or deny a SUBMITTED modification; approval rewrites approved/commitment and resizes the tranche schedule (increase appends a stage; decrease runs the clawback waterfall)
  roles:
  - LoanApprover
  code: 200
  input:
  - decision
  output: ModificationRequest
  side_effects:
  - 'APPROVED: applies the delta per the ModificationRequest machine'
  - loan.version incremented on approval
- method: POST
  path: /disaster-relief/loans/{id}/insurance-settlements
  description: Borrower reports a post-disbursement insurance settlement
  roles:
  - Applicant
  code: 201
  input:
  - settlement_amount_cents
  - received_date
  output: InsuranceSettlement
  side_effects: []
- method: GET
  path: /disaster-relief/loans/{id}/insurance-settlements
  description: List settlements reported on a loan (FK reverse lookup)
  roles:
  - Applicant
  - ServicingAgent
  - LoanApprover
  code: 200
  input:
  - limit?
  - offset?
  output: InsuranceSettlement[]
  side_effects: []
- method: POST
  path: /disaster-relief/insurance-settlements/{id}/apply
  description: 'Apply a REPORTED settlement: runs clawback_calc (commitment reduction, tranche LIFO waterfall, excess-funds receivable). OCC-guarded.'
  roles:
  - ServicingAgent
  code: 200
  input:
  - expected_loan_version
  output: InsuranceSettlement
  side_effects:
  - calc clawback_calc hop 1-3
  - loan.version incremented
- method: POST
  path: /disaster-relief/insurance-settlements/{id}/void
  description: Void an APPLIED settlement; exactly compensates its cascade (commitment, tranches, receivable)
  roles:
  - ServicingAgent
  code: 200
  input: []
  output: InsuranceSettlement
  side_effects:
  - compensates the apply cascade (see InsuranceSettlement machine)
  - loan.version incremented
- method: GET
  path: /disaster-relief/loans/{id}/excess-funds-receivables
  description: List the loan's excess-funds receivables (FK reverse lookup; 0 or 1 row in practice)
  roles:
  - Applicant
  - ServicingAgent
  - LoanApprover
  code: 200
  input:
  - limit?
  - offset?
  output: ExcessFundsReceivable[]
  side_effects: []
- method: POST
  path: /disaster-relief/excess-funds-receivables/{id}/payments
  description: Borrower repays excess funds; reduces both the receivable and the loan's outstanding principal
  roles:
  - Applicant
  code: 201
  input:
  - amount_cents
  output: ExcessFundsReceivable
  side_effects:
  - amount_paid_cents += amount_cents
  - loan.outstanding_balance_cents -= amount_cents; loan.total_principal_paid_cents += amount_cents
  - status may flip to PARTIALLY_PAID or PAID
- method: POST
  path: /disaster-relief/loans/{id}/servicing-actions
  description: Borrower requests a deferment or hardship accommodation window (half-open interval)
  roles:
  - Applicant
  code: 201
  input:
  - action_type
  - start_date
  - end_date
  output: ServicingAction
  side_effects: []
- method: GET
  path: /disaster-relief/loans/{id}/servicing-actions
  description: List servicing actions on a loan (FK reverse lookup)
  roles:
  - Applicant
  - ServicingAgent
  code: 200
  input:
  - limit?
  - offset?
  output: ServicingAction[]
  side_effects: []
- method: POST
  path: /disaster-relief/servicing-actions/{id}/decision
  description: Approve or deny a REQUESTED servicing action; approval enforces the half-open overlap rule and flips the loan's servicing_status when the window has already started
  roles:
  - ServicingAgent
  code: 200
  input:
  - decision
  output: ServicingAction
  side_effects:
  - 'APPROVED: may immediately continue to ACTIVE (sweep-equivalent) when start_date <= current_utc'
  - loan.version incremented when the loan's servicing_status flips
- method: POST
  path: /disaster-relief/loans/{id}/payments
  description: Borrower payment; waterfall allocation fees -> interest -> principal (calc payment_allocation_calc); exact payoff transitions to PAID_IN_FULL; curing payment lifts DELINQUENT to CURRENT
  roles:
  - Applicant
  code: 201
  input:
  - amount_cents
  output: Payment
  side_effects:
  - calc payment_allocation_calc
  - loan ledger fields updated; loan.version incremented
  - loan may transition to PAID_IN_FULL or servicing_status DELINQUENT -> CURRENT
- method: GET
  path: /disaster-relief/loans/{id}/payments
  description: List payments posted on a loan (FK reverse lookup)
  roles:
  - Applicant
  - ServicingAgent
  - LoanApprover
  code: 200
  input:
  - limit?
  - offset?
  output: Payment[]
  side_effects: []
- method: POST
  path: /disaster-relief/payments/{id}/reverse
  description: Reverse a POSTED payment (NSF/compensation); restores every loan ledger field the payment touched
  roles:
  - ServicingAgent
  code: 200
  input: []
  output: Payment
  side_effects:
  - compensates the payment's allocation exactly (see Payment machine)
  - loan.version incremented
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: X-User-Role or X-User-ID header missing/empty
- id: ERR_UNAUTHORIZED
  http: 403
  condition: role not in the endpoint's roles list
- id: ERR_FORBIDDEN_OWNER
  http: 403
  condition: Applicant-role caller's X-User-ID does not match the target resource's applicant_id
- id: ERR_NOT_FOUND
  http: 404
  condition: a path identifier does not resolve (checked left-to-right)
- id: ERR_INVALID_REQUEST
  http: 400
  condition: 'malformed body: missing required field, out-of-range enum, non-positive amount, depreciation_pct missing/out of range for ACTUAL_CASH_VALUE, end_date <= start_date, grant purpose_category
    mismatch, payment reverse on a non-POSTED payment'
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_loan_version != loan.version on an OCC-guarded endpoint
- id: ERR_PHYSICAL_FILING_CLOSED
  http: 422
  condition: PHYSICAL_DAMAGE submit with current_utc strictly after physical_filing_deadline
- id: ERR_EIDL_FILING_CLOSED
  http: 422
  condition: ECONOMIC_INJURY submit with current_utc strictly after economic_injury_filing_deadline
- id: ERR_COUNTY_NOT_ELIGIBLE
  http: 422
  condition: county_fips absent from the declaration's counties or lacking the loan_purpose in eligible_purposes
- id: ERR_APPLICATION_NOT_DRAFT
  http: 409
  condition: submit on a non-DRAFT application
- id: ERR_APPLICATION_NOT_SUBMITTED
  http: 409
  condition: credit review on an application not in SUBMITTED
- id: ERR_APPLICATION_NOT_IN_VERIFICATION
  http: 409
  condition: damage-verification create on an application not in VERIFICATION
- id: ERR_APPLICATION_NOT_DECISION_PENDING
  http: 409
  condition: decision on an application not in DECISION_PENDING
- id: ERR_APPLICATION_NOT_DECLINED
  http: 409
  condition: reconsideration on an application not in DECLINED
- id: ERR_RECONSIDERATION_LIMIT
  http: 409
  condition: reconsideration when reconsideration_count == 2
- id: ERR_VERIFICATION_REQUIRED
  http: 409
  condition: approval of a PHYSICAL_DAMAGE application with no COMPLETED damage verification
- id: ERR_VERIFICATION_NOT_APPLICABLE
  http: 409
  condition: damage-verification create on an ECONOMIC_INJURY application
- id: ERR_VERIFICATION_NOT_OPEN
  http: 409
  condition: complete on a verification not in {REQUESTED, DISPUTED}
- id: ERR_VERIFICATION_NOT_DISPUTABLE
  http: 409
  condition: dispute on a non-COMPLETED verification or after the linked application is APPROVED
- id: ERR_DISPUTE_WINDOW_CLOSED
  http: 422
  condition: dispute later than completed_at + 30 days
- id: ERR_ESTIMATION_NOT_ALLOWED
  http: 422
  condition: ESTIMATION method with requested_amount_cents > 2500000
- id: ERR_COLLATERAL_REQUIRED
  http: 422
  condition: approval above the purpose's collateral threshold without collateral fields, or collateral_value_cents < approved_amount_cents
- id: ERR_MODIFICATION_EXCEEDS_CAP
  http: 422
  condition: modification approval with requested_amount_cents over the applicant-type/purpose cap
- id: ERR_DUPLICATION_OF_BENEFITS
  http: 422
  condition: grant posting that pushes assistance_total strictly over verified_loss_cents
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: milestone decision by the same LossVerifier user who completed the application's latest COMPLETED DamageVerification
- id: ERR_LOAN_NOT_PENDING_ACCEPTANCE
  http: 409
  condition: accept on a loan not in PENDING_ACCEPTANCE
- id: ERR_LOAN_NOT_ACTIVE
  http: 409
  condition: milestone create, modification create, settlement report, payment, tranche release, or servicing-action approval on a loan whose lifecycle_status != ACTIVE
- id: ERR_MILESTONE_NOT_REPORTED
  http: 409
  condition: milestone decision on a non-REPORTED milestone
- id: ERR_TRANCHE_NOT_RELEASABLE
  http: 409
  condition: release on a tranche not in ELIGIBLE (includes out-of-order release and insufficient verified milestone coverage)
- id: ERR_MODIFICATION_NOT_SUBMITTED
  http: 409
  condition: modification decision on a non-SUBMITTED request
- id: ERR_SETTLEMENT_NOT_REPORTED
  http: 409
  condition: apply on a settlement not in REPORTED
- id: ERR_SETTLEMENT_NOT_APPLIED
  http: 409
  condition: void on a settlement not in APPLIED
- id: ERR_ACTION_NOT_REQUESTED
  http: 409
  condition: servicing-action decision on a non-REQUESTED action
- id: ERR_ACCOMMODATION_OVERLAP
  http: 409
  condition: approving an action whose half-open window overlaps an APPROVED/ACTIVE sibling on the same loan
- id: ERR_ACCOMMODATION_NOT_ALLOWED
  http: 409
  condition: approving an action while the loan's servicing_status is DEFAULT
- id: ERR_RECEIVABLE_NOT_OPEN
  http: 409
  condition: receivable payment on a receivable in PAID or ESCALATED
- id: ERR_PAYMENT_EXCEEDS_BALANCE
  http: 422
  condition: payment or receivable payment above the currently chargeable total (fees + interest due + principal; or receivable remaining)
- id: ERR_DECLARATION_WINDOW_OVERLAP
  http: 409
  condition: declaration create whose inclusive incident window shares a day with another declaration covering the same county_fips
roles:
- name: Anonymous
  description: Unauthenticated registrant; may only self-register as an applicant
  identity: opaque
  exclusive_operations:
  - POST /disaster-relief/applicants
  shared_operations: []
- name: Applicant
  description: Disaster borrower (homeowner, renter, business); acts only on own resources
  identity: entity_backed:Applicant
  exclusive_operations:
  - application create/submit/reconsideration/dispute
  - loan accept
  - milestone report
  - modification request
  - settlement report
  - servicing-action request
  - payments (loan and receivable)
  shared_operations:
  - read own application/loan and child collections
  - read declarations
- name: LoanOfficer
  description: Intake and credit-review officer
  identity: opaque
  exclusive_operations:
  - file credit reviews
  shared_operations:
  - read applications, loans, verifications, grants
- name: LossVerifier
  description: Damage inspector / loss verifier; may not verify repair milestones on a loan whose damage verification they completed (segregation of duties)
  identity: opaque
  exclusive_operations:
  - open and complete damage verifications
  - decide repair milestones
  shared_operations:
  - read applications, loans, verifications, milestones
- name: LoanApprover
  description: Approval authority for applications and modification requests
  identity: opaque
  exclusive_operations:
  - application decision
  - modification decision
  shared_operations:
  - read applications, loans, verifications, grants, tranches
- name: ServicingAgent
  description: 'Portfolio servicing: disbursement release, settlement apply/void, servicing-action decisions, payment reversal'
  identity: opaque
  exclusive_operations:
  - tranche release
  - settlement apply/void
  - servicing-action decision
  - payment reverse
  shared_operations:
  - read loans and all child collections
- name: GrantCoordinator
  description: External grant program coordination; reports grants under the duplication-of-benefits ceiling
  identity: opaque
  exclusive_operations:
  - report grant awards
  shared_operations:
  - read applications, grants, loans
- name: SystemAdmin
  description: 'Platform operator: declares disasters and drives the logical clock'
  identity: opaque
  exclusive_operations:
  - POST /disaster-relief/disaster-declarations
  - POST /_clock/set_current_utc
  shared_operations:
  - read declarations
