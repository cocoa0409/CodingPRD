          setup:
            - "A CUSTOMER_SPECIFIC service-body truck on F550-DRW-84CA with exactly one CRANE-6000 installation, carried all the way to BUILD_COMPLETE / LABELED."
            - "The FINAL_QC slot in BAY-1 spanning 2026-09-01 to 2026-09-10 has been closed; the AS_DESIGNED and AS_MEASURED certifications are both APPROVED and the label cites the AS_MEASURED one."
