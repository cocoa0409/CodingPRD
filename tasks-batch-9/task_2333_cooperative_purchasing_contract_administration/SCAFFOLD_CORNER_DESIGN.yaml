            - "after 2 substantiations: deduction_points_total == 15.00 and performance_score == 85.00"
            - "at exactly 85.00 the tier is still PREFERRED, because TIER_PREFERRED_THRESHOLD is inclusive"
            - "after 3 substantiations: performance_score == 77.50 and performance_tier == STANDARD"
            - "after 4 substantiations: deduction_points_total == 30.00 and performance_score == 70.00"
            - "at exactly 70.00 the tier is still STANDARD, because TIER_STANDARD_THRESHOLD is inclusive"
