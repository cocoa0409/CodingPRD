  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_record_half_open_interval_overlap_and_adjacency
        interval_semantics: "half-open [effective_from, effective_to) — touching endpoints are adjacent, not overlapping"
        resource_entity: "RateRecord, keyed on the routing resource (lane_id, carrier_id, routing_position)"
        grounds:
          - validations.priority_14_business_temporal
          - errors.ERR_RATE_INTERVAL_OVERLAP
          - state_machines.RateRecord.STAGED_to_LOADED
          - entities.RateRecord.fields.effective_from
          - entities.RateRecord.fields.effective_to
        distinguishing_aspect: |
          Half-open semantics on a rate-loading resource: two records that share an endpoint
          are legal because the earlier interval excludes its own end instant, while a record
          straddling an existing interval is rejected. The occupancy key is the triple
          (lane, carrier, routing_position), not the contract, so the resource being
          protected is the routing slot itself.
        test_recipe:
          setup:
            - "Single-lane awarded event for carrier ALFL with the contract minted by the award cascade and rate_load_status NOT_STAGED."
            - "Contract window 2026-09-01 to 2027-09-01, so every interval used below sits inside it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
