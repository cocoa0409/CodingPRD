# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing X-User-Role or X-User-ID header, or undeclared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted for the endpoint, or Veteran acting outside own subtree" }
  - { id: ERR_UNDERWRITER_IS_ORIGINATOR, http: 403, condition: "underwriting decision attempted by the loan's originator_user_id (segregation of duties)" }
  - { id: ERR_VALIDATION, http: 400, condition: "missing required field, wrong type, or malformed value" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "enum field carries an undeclared member" }
  - { id: ERR_VETERAN_NOT_FOUND, http: 404, condition: "veteran id does not resolve" }
  - { id: ERR_COE_NOT_FOUND, http: 404, condition: "certificate of eligibility id does not resolve" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "loan id does not resolve" }
  - { id: ERR_APPRAISAL_NOT_FOUND, http: 404, condition: "appraisal id does not resolve" }
  - { id: ERR_REPAIR_NOT_FOUND, http: 404, condition: "repair requirement id does not resolve" }
  - { id: ERR_OCCUPANCY_CERT_NOT_FOUND, http: 404, condition: "occupancy certificate id does not resolve" }
  - { id: ERR_ASSUMPTION_NOT_FOUND, http: 404, condition: "assumption request id does not resolve" }
  - { id: ERR_REFINANCE_NOT_FOUND, http: 404, condition: "refinance request id does not resolve" }
  - { id: ERR_FEE_ASSESSMENT_NOT_FOUND, http: 404, condition: "funding fee assessment id does not resolve" }
  - { id: ERR_RESTORATION_NOT_FOUND, http: 404, condition: "entitlement restoration request id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "generic invalid-from rejection on a state-machine action" }
  - { id: ERR_COE_NOT_ISSUED, http: 409, condition: "loan creation without an ISSUED COE for the borrower" }
  - { id: ERR_LOAN_NOT_CLOSABLE, http: 409, condition: "close attempted while underwriting_status != APPROVED" }
  - { id: ERR_LOAN_NOT_PAID_OFF, http: 409, condition: "restoration grant attempted while loan.closing_status != PAID_IN_FULL" }
  - { id: ERR_FEE_NOT_REFUNDABLE, http: 409, condition: "refund attempted on an assessment not in COLLECTED (or already REFUNDED)" }
  - { id: ERR_RECONSIDERATION_EXHAUSTED, http: 409, condition: "third reconsideration attempt on a COE" }
  - { id: ERR_APPRAISAL_NOT_ASSIGNED, http: 409, condition: "submit-report by a non-assigned appraiser or on an appraisal not in ASSIGNED/REPAIRS_REQUIRED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_loan_version != current Loan.version on refinance creation (OCC)" }
