  # ===============================================================
  # Section: rbac
  # ===============================================================
  - section: rbac
    instances:
      - name: program_create_as_collection_officer_forbidden
        claim_type: rbac_deny
        grounds: ["roles.ProgramAdmin", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "CollectionOfficer calling the ProgramAdmin-exclusive POST /survey/programs gets ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /survey/programs", payload: { code: "CES", name: "X", sample_budget: 3 }, as: CollectionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN and http status == 403"

      - name: respondent_cannot_accept_own_report_forbidden
        claim_type: rbac_deny
        grounds: ["roles.CollectionOfficer", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The report advance endpoint splits actions by role: ACCEPT is CollectionOfficer-only, so a Respondent (even the owning establishment) gets ERR_FORBIDDEN — role check fires before existence."
        test_recipe:
          setup: ["empty database (role check precedes existence, so a never-existent report id suffices)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /survey/response-reports/88888888-8888-4888-8888-888888888888/advance", payload: { action: ACCEPT }, as: Respondent, as_user_id: "11111111-1111-4111-8111-111111111111", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (403), not ERR_REPORT_NOT_FOUND — authorization precedes existence"

      - name: respondent_acting_on_other_establishment_forbidden
        claim_type: rbac_deny
        grounds: ["roles.Respondent", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed ownership: Respondent with X-User-ID of establishment E1 cannot ACCEPT the invitation addressed to E2 (enrollment.establishment_id mismatch) -> ERR_FORBIDDEN."
        test_recipe:
          setup: ["program/frame frozen; establishments E1 and E2 registered; E2's enrollment is INVITED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0005401", name: "OW-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/establishments", payload: { ein: "11-0005402", name: "OW-E2", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e2: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e2}", program_code: "CES" }, as: CollectionOfficer, captures: { en2: $.data.id } }
          trigger:
            - { call: "POST /survey/panel-enrollments/${en2}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (403); the enrollment stays INVITED"

      - name: breach_report_as_accredited_media_forbidden
        claim_type: rbac_deny
        grounds: ["roles.ReleaseManager", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "report-breach is ReleaseManager-exclusive; an AccreditedMedia caller gets ERR_FORBIDDEN even for a non-existent grant (role before existence)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /survey/embargo-grants/99999999-9999-4999-8999-999999999999/report-breach", payload: {}, as: AccreditedMedia, as_user_id: "11111111-1111-4111-8111-111111111111", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (403)"

      - name: collection_officer_cannot_certify_forbidden
        claim_type: rbac_deny
        grounds: ["roles.EstimationAnalyst", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Cycle advance action split: CERTIFY is EstimationAnalyst-only; CollectionOfficer gets ERR_FORBIDDEN even for a non-existent cycle."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /survey/survey-cycles/11111111-1111-4111-8111-111111111111/advance", payload: { action: CERTIFY }, as: CollectionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (403), not ERR_CYCLE_NOT_FOUND"

      - name: release_manager_cannot_approve_disclosure_forbidden
        claim_type: rbac_deny
        grounds: ["roles.DisclosureOfficer", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Release advance action split: APPROVE_DISCLOSURE is DisclosureOfficer-only; a ReleaseManager with a perfectly valid release and version still gets ERR_FORBIDDEN (authorization precedes OCC and state checks)."
        test_recipe:
          setup: ["program CES; cycle 2026-09; release R1 created (version captured)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/release-events", payload: { cycle_id: "${cyc}", release_at: "2026-10-01T13:30:00Z" }, as: ReleaseManager, captures: { rel: $.data.id, rv1: $.data.version } }
          trigger:
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: APPROVE_DISCLOSURE, expected_release_version: "${rv1}" }, as: ReleaseManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (403)"

  # ===============================================================
  # Section: complexity_layers
  # ===============================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_program_version_on_frame_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[frame-create-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on SurveyProgram.version: after frame F1 advances the program to version 2, a second frame create still carrying version 1 is rejected 412 ERR_STALE_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["program CES created (version 1 captured); frame F1 (2026-Q3) created with expected 1 -> program version 2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v1: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v1}" }, as: ProgramAdmin, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q4", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v1}" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /survey/programs", payload: {}, as: ProgramAdmin, captures: { prog_v2: "$.data[0].version" } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q4", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v2}" }, as: ProgramAdmin, captures: { f2: $.data.id } }
          assert:
            - "err == ERR_STALE_VERSION (412) — ${prog_v1} went stale when F1 bumped the program"
            - "prog_v2 == 2 and the retry with it succeeds (201)"
            - "the rejected attempt created no frame (a later GET /survey/sample-frames/${f2} shows only the retry's data)"

      - name: occ_stale_release_version_on_reschedule
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[release-reschedule-stale-release]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ReleaseEvent.version: POSTPONE advances the release to version 2; a RESCHEDULE carrying the pre-postpone version 1 is rejected 412; with the fresh version it succeeds and embargo_open_at is recomputed from the new release_at."
        test_recipe:
          setup: ["program CES; cycle 2026-09; release R1 at 2026-10-01T13:30:00Z (version 1); R1 POSTPONED with version 1 (now version 2)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/release-events", payload: { cycle_id: "${cyc}", release_at: "2026-10-01T13:30:00Z" }, as: ReleaseManager, captures: { rel: $.data.id, rv1: $.data.version } }
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: POSTPONE, expected_release_version: "${rv1}" }, as: ReleaseManager, captures: { rv2: $.data.version, pub: $.data.pub_status } }
          trigger:
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: RESCHEDULE, new_release_at: "2026-10-08T13:30:00Z", expected_release_version: "${rv1}" }, as: ReleaseManager, captures: { err: $.data.error_id } }
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: RESCHEDULE, new_release_at: "2026-10-08T13:30:00Z", expected_release_version: "${rv2}" }, as: ReleaseManager, captures: { pub2: $.data.pub_status, eo2: $.data.embargo_open_at, rv3: $.data.version } }
          assert:
            - "err == ERR_STALE_VERSION (412) for the stale ${rv1} attempt"
            - "pub2 == SCHEDULED and eo2 == 2026-10-08T13:00:00Z (recomputed from new release_at and the current 30-minute window) and rv3 == rv2 + 1"

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: ["calculations.cell_estimate_with_imputation", "calculations.response_rates", "calculations.seasonal_adjustment"]
        excluded_because:
          difficulty_instance: imputation_link_relative_vs_stratified_mean_revision
          rationale: "All three dual-variant calculations are asserted by the three §1.8 dual_variant_calc instances."

      - name: rate_threshold_layer_covered
        claim_type: rate_threshold_triggers
        grounds: ["validations[priority=50]", "calculations.response_rates"]
        excluded_because:
          difficulty_instance: certify_weighted_rate_exactly_at_threshold_passes
          rationale: "Threshold boundary (inclusive >=) asserted in §1.8; sub-threshold rejection asserted by corner certify_below_threshold_rejected."

  # ===============================================================
  # Section: consistency_model
  # ===============================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_visible_in_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.neyman_stratum_allocation"]
        distinguishing_aspect: "Immediate consistency: the freeze RESPONSE itself carries the computed allocations and total_sample_size — no re-read or settling delay is needed to observe the calculation."
        test_recipe:
          setup: ["program CES (budget 3); DRAFT frame 2026-Q3 with one stratum (MANUFACTURING,SMALL,100)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { f1: $.data.id, alloc_pre: $.data.total_sample_size } }
          trigger:
            - { call: "POST /survey/sample-frames/${f1}/freeze", payload: {}, as: ProgramAdmin, captures: { st: $.data.frame_status, total: $.data.total_sample_size, strata_out: $.data.strata, fz: $.data.frozen_at } }
          assert:
            - "alloc_pre is null before freeze (allocation not computed on DRAFT)"
            - "st == FROZEN and total == 3 and strata_out[0].allocated_sample_size == 3 and fz == 2026-09-01T00:00:00Z — all visible in the freeze response itself"
