scenario: "Rent-Reporting & Rent-to-Credit Service: tenant enrollment & lease/rent verification, on-time-payment tri-bureau reporting, back-reporting & months, landlord/PM integration, dispute & correction, subscription/fee, score-tracking, cancellation"
domain_name: "rent-reporting-credit"
api_prefix: "/api"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # flat: peer entities linked by FK references; child discovery via filtered-list
  # GETs (e.g. GET /leases?tenant_id=...), no deep URL nesting.
  state_machine_shape: cyclic
  # ReportedItem loops REPORTED->DISPUTED->REPORTED; Dispute forks
  # INVESTIGATING->{RESOLVED_CORRECTED, RESOLVED_UPHELD} with divergent side-effects.
  relationship_patterns:
    - one_to_many
    - self_referential   # ReportedItem.supersedes_item_id -> ReportedItem.id (correction chain)
    - cross_aggregate    # reporting/dispute reason across Lease + Enrollment aggregates
  role_model: segregation_of_duties
  # ComplianceAnalyst investigates a dispute; a DIFFERENT ComplianceOfficer must
  # resolve it (X-User-ID inequality enforced) -> ERR_SEGREGATION_OF_DUTIES.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Tenant's legal name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique per tenant."
      - name: phone
        type: string
        source: input
        description: "Contact phone."
        default: null
      - name: reported_on_time_rate_pct
        type: integer
        source: computed
        description: "Denormalized `as_reported` on-time percentage over the tenant's effective (status IN {REPORTED, DISPUTED}) ReportedItems; recomputed on every furnish/retract/correction cascade. Null when the tenant has zero effective ReportedItems. See calculations.tenant_on_time_rate."
        default: null
      - name: effective_reported_items
        type: integer
        source: computed
        description: "Denormalized count of this tenant's ReportedItems with status IN {REPORTED, DISPUTED}; recomputed by reporting cascades."
        default: 0

  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Landlord or property-management company name."
      - name: email
        type: string
        source: input
        description: "PM integration contact email."
      - name: contact_name
        type: string
        source: input
        description: "Named contact at the PM."
        default: null

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable plan name."
      - name: tier
        type: enum
        source: input
        description: "Plan tier."
        constraints: "one of {BASIC, PLUS, PREMIUM}"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring monthly subscription fee in cents; >= 0."
      - name: back_reporting_included_months
        type: integer
        source: input
        description: "Number of historical months included free with this plan for back-reporting; >= 0."

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; the enrolling tenant."
      - name: plan_id
        type: string
        source: input
        description: "FK -> SubscriptionPlan.id; the selected plan."
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle."
        default: PENDING_PAYMENT
        constraints: "one of {PENDING_PAYMENT, ACTIVE, CANCELLED}"
      - name: monthly_fee_cents
        type: integer
        source: system
        description: "Snapshot of SubscriptionPlan.monthly_fee_cents captured at enrollment; immune to later plan edits."
      - name: current_period_start
        type: datetime
        source: system
        description: "Start of the current paid subscription period (set to logical clock on activation)."
        default: null
      - name: current_period_end
        type: datetime
        source: system
        description: "current_period_start + 1 calendar month (half-open); used by cancellation_settlement proration."
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: "Logical-clock instant of cancellation."
        default: null
      - name: refund_cents
        type: integer
        source: system
        description: "Prorated cancellation refund computed by calculations.cancellation_settlement (prorated_refund variant)."
        default: 0
      - name: earned_cents
        type: integer
        source: system
        description: "Prorated earned revenue at cancellation (monthly_fee_cents - refund_cents when the period invoice was paid); 0 otherwise. Conserved-quantity ledger field."
        default: 0

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; the renting tenant."
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; the verifying landlord/PM."
      - name: property_address
        type: string
        source: input
        description: "Normalized unit address; overlap uniqueness is scoped to (tenant_id, property_address)."
      - name: rent_amount_cents
        type: integer
        source: input
        description: "Monthly rent in cents; > 0."
      - name: monthly_due_day
        type: integer
        source: input
        description: "Day-of-month rent is due; 1..28."
      - name: lease_start
        type: datetime
        source: input
        description: "Lease term start (inclusive)."
      - name: lease_end
        type: datetime
        source: input
        description: "Lease term end (exclusive; half-open [lease_start, lease_end))."
      - name: verification_status
        type: enum
        source: system
        description: "Landlord verification lifecycle."
        default: PENDING_VERIFICATION
        constraints: "one of {PENDING_VERIFICATION, VERIFIED, REJECTED, TERMINATED}"

  - name: RentPayment
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease this rent payment belongs to."
      - name: period_month
        type: string
        source: input
        description: "Billing month in 'YYYY-MM'."
      - name: due_date
        type: datetime
        source: input
        description: "Date rent was due for period_month."
      - name: paid_date
        type: datetime
        source: input
        description: "Date rent was actually paid; null means unpaid/missed."
        default: null
      - name: amount_paid_cents
        type: integer
        source: input
        description: "Amount the tenant actually paid in cents; >= 0."
      - name: on_time
        type: boolean
        source: computed
        description: "True iff paid_date is not null AND paid_date <= due_date + GRACE_DAYS. See calculations.payment_on_time_status."
      - name: status
        type: enum
        source: system
        description: "Reporting lifecycle for this payment record."
        default: RECORDED
        constraints: "one of {RECORDED, REPORTED}"

  - name: ReportedItem
    parent: null
    common_fields: true
    fields:
      - name: rent_payment_id
        type: string
        source: system
        description: "FK -> RentPayment.id; the payment furnished as a tradeline entry."
      - name: tenant_id
        type: string
        source: system
        description: "FK -> Tenant.id; denormalized tradeline subject."
      - name: lease_id
        type: string
        source: system
        description: "FK -> Lease.id; denormalized for lease-termination retraction cascade."
      - name: supersedes_item_id
        type: string
        source: system
        description: "FK -> ReportedItem.id; set on a correction's replacement item to point at the CORRECTED original; null on original items."
        default: null
      - name: period_month
        type: string
        source: system
        description: "Snapshot of RentPayment.period_month; the furnished month."
      - name: on_time
        type: boolean
        source: system
        description: "Snapshot of the on-time flag furnished to the bureaus (may differ from the payment after a correction)."
      - name: amount_reported_cents
        type: integer
        source: system
        description: "Amount furnished to bureaus in cents."
      - name: source
        type: enum
        source: system
        description: "Whether furnished by the monthly report action or a back-report completion."
        constraints: "one of {MONTHLY, BACK_REPORT}"
      - name: status
        type: enum
        source: system
        description: "Tradeline lifecycle."
        default: REPORTED
        constraints: "one of {REPORTED, DISPUTED, CORRECTED, RETRACTED}"
      - name: bureau_statuses
        type: object
        source: system
        description: "Per-bureau furnish state, keys EQUIFAX/EXPERIAN/TRANSUNION, each one of {FURNISHED, DELETED}."

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: reported_item_id
        type: string
        source: input
        description: "FK -> ReportedItem.id; the tradeline entry under dispute."
      - name: tenant_id
        type: string
        source: system
        description: "FK -> Tenant.id; the filer, taken from X-User-ID."
      - name: reason_code
        type: enum
        source: input
        description: "Dispute reason."
        constraints: "one of {NOT_MINE, INCORRECT_AMOUNT, INCORRECT_STATUS, PAID_ON_TIME}"
      - name: status
        type: enum
        source: system
        description: "Dispute lifecycle (branching resolution)."
        default: OPEN
        constraints: "one of {OPEN, INVESTIGATING, RESOLVED_CORRECTED, RESOLVED_UPHELD, WITHDRAWN}"
      - name: analyst_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceAnalyst who moved the dispute to INVESTIGATING."
        default: null
      - name: officer_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who resolved the dispute."
        default: null
      - name: investigation_deadline
        type: datetime
        source: system
        description: "current logical clock + DISPUTE_INVESTIGATION_DAYS, stamped when investigation begins."
        default: null
      - name: resolution_note
        type: string
        source: system
        description: "Free-text resolution note."
        default: null

  - name: BackReportRequest
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease whose historical months are back-reported."
      - name: requested_months
        type: array
        source: input
        description: "List of 'YYYY-MM' months to back-report; each must have a RECORDED RentPayment on the lease and must be within BACK_REPORT_MAX_MONTHS of the current month and not in the future."
      - name: billable_months
        type: integer
        source: computed
        description: "max(0, count(requested_months) - plan.back_reporting_included_months). See calculations.back_report_fee."
      - name: fee_cents
        type: integer
        source: computed
        description: "min(billable_months * BACK_REPORT_PER_MONTH_CENTS, BACK_REPORT_FEE_CAP_CENTS)."
      - name: status
        type: enum
        source: system
        description: "Back-report lifecycle."
        default: PENDING
        constraints: "one of {PENDING, APPROVED, COMPLETED, REJECTED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the enrollment billed."
      - name: back_report_request_id
        type: string
        source: system
        description: "FK -> BackReportRequest.id; set only on BACK_REPORT invoices, null otherwise."
        default: null
      - name: kind
        type: enum
        source: system
        description: "Invoice kind."
        constraints: "one of {SUBSCRIPTION, BACK_REPORT}"
      - name: amount_cents
        type: integer
        source: system
        description: "Invoice amount in cents."
      - name: period_month
        type: string
        source: system
        description: "Billed subscription period 'YYYY-MM' (null for BACK_REPORT)."
        default: null
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        default: DUE
        constraints: "one of {DUE, PAID, VOID}"
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant of payment."
        default: null

  - name: ScoreSnapshot
    parent: null
    common_fields: false
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; subject of the score reading."
      - name: bureau
        type: enum
        source: input
        description: "Bureau that produced the score."
        constraints: "one of {EQUIFAX, EXPERIAN, TRANSUNION}"
      - name: score
        type: integer
        source: input
        description: "Credit score reading; 300..850."
      - name: as_of_month
        type: string
        source: input
        description: "Month the score reflects, 'YYYY-MM'."

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: Enrollment
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /invoices/{id}/pay on the enrollment's SUBSCRIPTION invoice"
        actor: Tenant
        preconditions:
          - "the paid invoice.kind == SUBSCRIPTION and invoice.enrollment_id == this enrollment"
        side_effects:
          - "set current_period_start = logical clock now"
          - "set current_period_end = current_period_start + 1 calendar month"
        note: "Activation is driven by paying the first subscription invoice, not by a direct endpoint."
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Tenant
        preconditions: []
        side_effects:
          - "set cancelled_at = logical clock now"
          - "refund_cents = 0 and earned_cents = 0 (no period was paid)"
          - "VOID any DUE invoices on this enrollment"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Tenant
        preconditions: []
        side_effects:
          - "set cancelled_at = logical clock now"
          - "compute calculations.cancellation_settlement -> refund_cents, earned_cents (conserved-money invariant)"
          - "VOID any DUE invoices on this enrollment"
          - "cascade: every Lease of this tenant with verification_status == VERIFIED transitions VERIFIED->TERMINATED"
        note: "Depth>=3 cascade origin: cancel -> lease TERMINATED -> ReportedItem RETRACTED -> tenant rate recompute. See §1.2 Lease.VERIFIED_to_TERMINATED."

  - entity: Lease
    initial_state: PENDING_VERIFICATION
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /leases/{id}/verify {decision: VERIFIED}"
        actor: Landlord
        preconditions:
          - "acting Landlord (X-User-ID) == lease.landlord_id"
        side_effects:
          - "increments Lease.version by 1"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /leases/{id}/verify {decision: REJECTED}"
        actor: Landlord
        preconditions:
          - "acting Landlord (X-User-ID) == lease.landlord_id"
        side_effects:
          - "increments Lease.version by 1"
      - from: VERIFIED
        to: TERMINATED
        trigger: "system: cascade from Enrollment ACTIVE->CANCELLED for this lease's tenant"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: every non-terminal ReportedItem on this lease (status IN {REPORTED, DISPUTED}) transitions to RETRACTED"
        note: "Second cascade hop; the RETRACTED items themselves trigger the tenant-rate recompute (third hop)."

  - entity: RentPayment
    initial_state: RECORDED
    terminal_states: [REPORTED]
    transitions:
      - from: RECORDED
        to: REPORTED
        trigger: "POST /rent-payments/{id}/report  OR  POST /back-report-requests/{id}/complete"
        actor: ComplianceAnalyst
        preconditions:
          - "lease.verification_status == VERIFIED (cross-entity: RentPayment depends on Lease state)"
          - "the tenant's Enrollment.status == ACTIVE (cross-entity: RentPayment depends on Enrollment state)"
          - "no non-retracted ReportedItem exists for (lease_id, period_month) (month-coverage overlap)"
        side_effects:
          - "create a ReportedItem (status REPORTED) furnished to all 3 bureaus"
          - "recompute tenant.reported_on_time_rate_pct and tenant.effective_reported_items"

  - entity: ReportedItem
    initial_state: REPORTED
    terminal_states: [RETRACTED]
    transitions:
      - from: REPORTED
        to: DISPUTED
        trigger: "POST /disputes (filing a dispute against this item)"
        actor: Tenant
        preconditions:
          - "logical clock now <= reported_item.created_at + DISPUTE_WINDOW_DAYS (dispute window open)"
        side_effects:
          - "increments ReportedItem.version by 1"
          - "furnished-item count invariant: DISPUTED still counts as effective (status IN {REPORTED, DISPUTED})"
      - from: DISPUTED
        to: REPORTED
        trigger: "POST /disputes/{id}/resolve {resolution: UPHELD}  OR  POST /disputes/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "reinstate the tradeline (bureau_statuses back to FURNISHED)"
          - "recompute tenant.reported_on_time_rate_pct"
        note: "Cyclic: REPORTED->DISPUTED->REPORTED revision loop."
      - from: DISPUTED
        to: CORRECTED
        trigger: "POST /disputes/{id}/resolve {resolution: CORRECTED}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "create a superseding ReportedItem (status REPORTED, supersedes_item_id = this item, source inherited) with corrected on_time / amount"
          - "furnished-item count invariant: this item leaves {REPORTED,DISPUTED} (-1) and the superseding item enters (+1) -> net effective count unchanged"
          - "recompute tenant.reported_on_time_rate_pct"
      - from: REPORTED
        to: RETRACTED
        trigger: "POST /reported-items/{id}/retract  OR  system cascade from Lease VERIFIED->TERMINATED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "set bureau_statuses all to DELETED"
          - "recompute tenant.reported_on_time_rate_pct and tenant.effective_reported_items"
      - from: DISPUTED
        to: RETRACTED
        trigger: "system cascade from Lease VERIFIED->TERMINATED"
        actor: system
        preconditions: []
        side_effects:
          - "set bureau_statuses all to DELETED"
          - "recompute tenant.reported_on_time_rate_pct and tenant.effective_reported_items"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_CORRECTED, RESOLVED_UPHELD, WITHDRAWN]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /disputes/{id}/investigate"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects:
          - "set analyst_user_id = X-User-ID"
          - "set investigation_deadline = logical clock now + DISPUTE_INVESTIGATION_DAYS"
      - from: INVESTIGATING
        to: RESOLVED_CORRECTED
        trigger: "POST /disputes/{id}/resolve {resolution: CORRECTED}"
        actor: ComplianceOfficer
        preconditions:
          - "SoD: X-User-ID != analyst_user_id"
        side_effects:
          - "set officer_user_id = X-User-ID"
          - "drive ReportedItem DISPUTED->CORRECTED (creates superseding item)"
      - from: INVESTIGATING
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve {resolution: UPHELD}"
        actor: ComplianceOfficer
        preconditions:
          - "SoD: X-User-ID != analyst_user_id"
        side_effects:
          - "set officer_user_id = X-User-ID"
          - "drive ReportedItem DISPUTED->REPORTED (reinstated, no correction)"
        note: "Branching fork from INVESTIGATING: CORRECTED vs UPHELD carry divergent ReportedItem side-effects."
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Tenant
        preconditions:
          - "acting Tenant (X-User-ID) == dispute.tenant_id"
        side_effects:
          - "drive ReportedItem DISPUTED->REPORTED (reinstated)"
      - from: INVESTIGATING
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Tenant
        preconditions:
          - "acting Tenant (X-User-ID) == dispute.tenant_id"
        side_effects:
          - "drive ReportedItem DISPUTED->REPORTED (reinstated)"

  - entity: BackReportRequest
    initial_state: PENDING
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /back-report-requests/{id}/decision {decision: APPROVED}"
        actor: ComplianceOfficer
        preconditions:
          - "the tenant's Enrollment.status == ACTIVE (cross-entity: BackReportRequest depends on Enrollment state)"
          - "the BACK_REPORT fee Invoice.status == PAID"
          - "no requested month has become covered by a non-retracted ReportedItem since creation (month-coverage overlap)"
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /back-report-requests/{id}/decision {decision: REJECTED}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "VOID the BACK_REPORT fee Invoice"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /back-report-requests/{id}/complete"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects:
          - "for each requested month, create a ReportedItem (source BACK_REPORT, status REPORTED) from that month's RentPayment and set the payment status REPORTED"
          - "recompute tenant.reported_on_time_rate_pct and tenant.effective_reported_items"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - rule_id: payment-record-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /rent-payments"
    occ_field: "expected_lease_version"
    description: |
      Recording a RentPayment against a Lease whose version has advanced since
      the client last observed it is rejected. The rent amount and terms a
      payment is recorded against are read off a specific Lease version; another
      writer may have amended the lease or recorded a prior payment (each of
      which advances Lease.version), leaving this client's view stale. The
      guard reduces to an optimistic-version check: if the supplied
      expected_lease_version no longer matches the stored Lease.version, the
      write is rejected. Both a verified lease's status and its identity are
      unchanged between the two writes; only the version differs.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: payment_on_time_status
    trigger: "on POST /rent-payments (stamped onto RentPayment.on_time), snapshotted onto ReportedItem.on_time at report time"
    algorithm: threshold
    formula: |
      if paid_date is null:
          on_time = false
      else:
          on_time = (paid_date <= due_date + GRACE_DAYS days)   # inclusive boundary
    input_set: "the single RentPayment being recorded"
    constants:
      GRACE_DAYS: 5
    precision: "date comparison at day granularity; boundary is inclusive (paid exactly GRACE_DAYS after due is on_time)"

  - name: back_report_fee
    trigger: "on POST /back-report-requests (stamped onto billable_months and fee_cents)"
    algorithm: tiered_pricing
    formula: |
      n = count(requested_months)
      included = plan.back_reporting_included_months      # plan is the tenant's enrolled SubscriptionPlan
      billable_months = max(0, n - included)
      fee_cents = min(billable_months * BACK_REPORT_PER_MONTH_CENTS, BACK_REPORT_FEE_CAP_CENTS)
    input_set: "the requested_months on this request and the enrolled plan's included allowance"
    constants:
      BACK_REPORT_PER_MONTH_CENTS: 200
      BACK_REPORT_FEE_CAP_CENTS: 3000
      BACK_REPORT_MAX_MONTHS: 24
    precision: "integer cents; nested max()/min() with 3 inputs (n, included, per-month price) and a cap (combinatorial mode a)"

  - name: tenant_on_time_rate
    trigger: "recomputed on every furnish/retract/correction cascade; read on GET /tenants/{id}/credit-summary"
    algorithm: aggregation
    formula: |
      # Both variants round HALF_UP to an integer percent; null when denominator == 0.
      # Variant as_paid:
      pay_set = { RentPayment p : p.lease.tenant_id == tenant.id }        # ALL recorded payments, any status
      if len(pay_set) == 0: as_paid = null
      else: as_paid = round_half_up(100 * count(p in pay_set where p.on_time) / len(pay_set))
      # Variant as_reported:
      rep_set = { ReportedItem r : r.tenant_id == tenant.id and r.status IN {REPORTED, DISPUTED} }
      if len(rep_set) == 0: as_reported = null
      else: as_reported = round_half_up(100 * count(r in rep_set where r.on_time) / len(rep_set))
    input_set: "as_paid ranges over every RentPayment on the tenant's leases regardless of reporting; as_reported ranges only over effective (status IN {REPORTED, DISPUTED}) ReportedItems"
    constants: {}
    precision: "integer percent, round_half_up; empty denominator -> null"
    variants:
      - name: as_paid
        when: "payment-view metric; counts every recorded RentPayment"
        difference: "includes payments never furnished and excludes correction supersedes; denominator = all payments"
      - name: as_reported
        when: "tradeline-view metric; counts only effective ReportedItems"
        difference: "excludes RETRACTED/CORRECTED items and unfurnished payments; denominator = effective ReportedItems -> diverges from as_paid whenever the furnished subset differs from the full payment set"

  - name: cancellation_settlement
    trigger: "on POST /enrollments/{id}/cancel from ACTIVE (stamped onto refund_cents, earned_cents)"
    algorithm: forward_looking
    formula: |
      # PINNED variant = prorated_refund.
      days_in_period = (current_period_end - current_period_start) in days
      days_used = clamp((cancelled_at - current_period_start) in days, 0, days_in_period)
      paid_this_period_cents = monthly_fee_cents if the current-period SUBSCRIPTION invoice.status == PAID else 0
      earned_cents = round_half_up(monthly_fee_cents * days_used / days_in_period)
      refund_cents = max(0, paid_this_period_cents - earned_cents)
      # Conserved-money invariant (when paid): earned_cents + refund_cents == paid_this_period_cents (== monthly_fee_cents).
    input_set: "the enrollment's current paid period and the logical clock instant of cancellation"
    constants: {}
    precision: "integer cents, round_half_up on earned_cents; refund_cents floored at 0"
    variants:
      - name: prorated_refund
        when: "PINNED / applied variant"
        difference: "refund_cents = paid - earned(prorated by days_used); e.g. fee 1499 over 31 days, cancel day 10 -> earned 484, refund 1015"
      - name: accrual_forfeit
        when: "divergent alternative (documents dual-variant ambiguity; NOT applied)"
        difference: "treats the whole started period as earned -> earned = full monthly_fee_cents, refund = 0; diverges from prorated_refund by exactly the prorated refund (1015 for the pinned example)"

  - name: latest_score_by_bureau
    trigger: "read on GET /tenants/{id}/credit-summary"
    algorithm: aggregation
    formula: |
      for each bureau B in {EQUIFAX, EXPERIAN, TRANSUNION}:
          candidates = { ScoreSnapshot s : s.tenant_id == tenant.id and s.bureau == B }
          if candidates empty: latest[B] = null
          else:
              # rank by as_of_month DESC; tie-break created_at DESC (never by id)
              latest[B] = argmax(candidates, key=(as_of_month, created_at)).score
    input_set: "all ScoreSnapshots for the tenant, partitioned by bureau"
    constants: {}
    precision: "exact integer score; selection strictly by (as_of_month, created_at), never by random id"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number checked first)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint; for entity_backed roles the acting X-User-ID owns the target resource (Tenant owns own enrollment/lease/dispute; Landlord owns the lease it verifies)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and every FK in the body resolves to a live resource, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: invalid_request
    check: "required fields present; enums in range; numeric fields in range (score 300..850, monthly_due_day 1..28, cents >= 0); period_month/ISO formats valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"
  - priority: 5
    category: state
    check: "POST /leases/{id}/verify only from verification_status == PENDING_VERIFICATION"
    error_id: ERR_ALREADY_VERIFIED
    http_status: 409
    applies_to: "POST /leases/{id}/verify"
  - priority: 6
    category: state
    check: "reporting a payment (monthly report or back-report completion) requires lease.verification_status == VERIFIED"
    error_id: ERR_LEASE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /rent-payments/{id}/report, POST /back-report-requests/{id}/complete"
  - priority: 7
    category: state
    check: "filing a dispute requires the ReportedItem.status == REPORTED"
    error_id: ERR_ITEM_NOT_DISPUTABLE
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 8
    category: state
    check: "the transition's from-state precondition holds; acting on a terminal resource, or any trigger not enumerated from the current state, is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (cancel, verify, report, retract, investigate, resolve, withdraw, decision, complete, pay)"
  - priority: 9
    category: state
    check: "on POST /rent-payments, supplied expected_lease_version equals the current Lease.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rent-payments"
  - priority: 10
    category: business_safety
    check: "on POST /disputes/{id}/resolve, the acting officer (X-User-ID) is NOT the analyst who investigated (dispute.analyst_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /disputes/{id}/resolve"
  - priority: 11
    category: business_temporal
    check: "filing a dispute requires logical clock now <= reported_item.created_at + DISPUTE_WINDOW_DAYS"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /disputes"
  - priority: 12
    category: business_constraint
    check: "a new Lease must not overlap (half-open [lease_start, lease_end)) an existing non-terminal Lease for the same (tenant_id, property_address)"
    error_id: ERR_LEASE_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /leases"
  - priority: 14
    category: business_constraint
    check: "for the (lease_id, period_month) being furnished, no non-retracted ReportedItem already covers that month"
    error_id: ERR_PERIOD_ALREADY_COVERED
    http_status: 409
    applies_to: "POST /rent-payments/{id}/report, POST /back-report-requests (per month), POST /back-report-requests/{id}/decision"
  - priority: 15
    category: business_constraint
    check: "count(requested_months) <= BACK_REPORT_MAX_MONTHS (24)"
    error_id: ERR_BACK_REPORT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /back-report-requests"
  - priority: 16
    category: business_constraint
    check: "each requested month is within BACK_REPORT_MAX_MONTHS of the current month, not in the future, and has a RECORDED RentPayment on the lease"
    error_id: ERR_BACK_REPORT_MONTHS_INVALID
    http_status: 422
    applies_to: "POST /back-report-requests"
  - priority: 17
    category: business_temporal
    check: "POST /_clock/set_current_utc target instant is not strictly before the current logical clock"
    error_id: ERR_CLOCK_BEFORE_CURRENT
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 18
    category: business_fiscal
    check: "reporting / approving requires the tenant's Enrollment.status == ACTIVE"
    error_id: ERR_ENROLLMENT_INACTIVE
    http_status: 402
    applies_to: "POST /rent-payments/{id}/report, POST /back-report-requests/{id}/decision"
  - priority: 19
    category: business_fiscal
    check: "approving a back-report requires its BACK_REPORT fee Invoice.status == PAID"
    error_id: ERR_INVOICE_UNPAID
    http_status: 402
    applies_to: "POST /back-report-requests/{id}/decision"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  # ---- Tenants ----
  - method: POST
    path: "/api/tenants"
    description: "Onboard a tenant."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, "phone?"]
    output: Tenant
    side_effects: []
  - method: GET
    path: "/api/tenants/{id}"
    description: "Fetch a tenant."
    roles: [PlatformAdmin, Tenant]
    code: 200
    input: []
    output: Tenant
    side_effects: []
  - method: GET
    path: "/api/tenants/{id}/credit-summary"
    description: "Computed read: both on-time-rate variants and latest score per bureau."
    roles: [PlatformAdmin, Tenant]
    code: 200
    input: []
    output: "{ tenant_id: string, on_time_rate_as_paid_pct: integer, on_time_rate_as_reported_pct: integer, total_payments: integer, effective_reported_items: integer, latest_scores: object }"
    side_effects: ["computes calculations.tenant_on_time_rate (both variants), calculations.latest_score_by_bureau"]
  - method: GET
    path: "/api/tenants/{id}/score-snapshots"
    description: "List score snapshots for a tenant (reverse-reachability for ScoreSnapshot.tenant_id)."
    roles: [PlatformAdmin, Tenant]
    code: 200
    input: ["bureau?"]
    output: "ScoreSnapshot[]"
    side_effects: []

  # ---- Landlords ----
  - method: POST
    path: "/api/landlords"
    description: "Onboard a landlord / property manager."
    roles: [PlatformAdmin]
    code: 201
    input: [company_name, email, "contact_name?"]
    output: Landlord
    side_effects: []
  - method: GET
    path: "/api/landlords/{id}"
    description: "Fetch a landlord."
    roles: [PlatformAdmin, Landlord]
    code: 200
    input: []
    output: Landlord
    side_effects: []

  # ---- Subscription plans ----
  - method: POST
    path: "/api/subscription-plans"
    description: "Create a subscription plan."
    roles: [PlatformAdmin]
    code: 201
    input: [name, tier, monthly_fee_cents, back_reporting_included_months]
    output: SubscriptionPlan
    side_effects: []
  - method: GET
    path: "/api/subscription-plans/{id}"
    description: "Fetch a plan."
    roles: [PlatformAdmin, Tenant]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []

  # ---- Enrollments ----
  - method: POST
    path: "/api/enrollments"
    description: "Enroll a tenant on a plan; snapshots the fee and issues the first subscription invoice."
    roles: [Tenant, PlatformAdmin]
    code: 201
    input: [tenant_id, plan_id]
    output: Enrollment
    side_effects:
      - "create Enrollment status PENDING_PAYMENT, monthly_fee_cents = plan.monthly_fee_cents"
      - "create a SUBSCRIPTION Invoice (status DUE, amount = plan.monthly_fee_cents)"
  - method: GET
    path: "/api/enrollments/{id}"
    description: "Fetch an enrollment."
    roles: [Tenant, PlatformAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/api/enrollments"
    description: "List/filter enrollments (reverse-reachability for Enrollment.tenant_id and Enrollment.plan_id)."
    roles: [Tenant, PlatformAdmin]
    code: 200
    input: ["tenant_id?", "plan_id?", "status?"]
    output: "Enrollment[]"
    side_effects: []
  - method: POST
    path: "/api/enrollments/{id}/cancel"
    description: "Cancel an enrollment; prorated settlement + cascade termination/retraction."
    roles: [Tenant]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status -> CANCELLED, cancelled_at = clock now"
      - "from ACTIVE: compute calculations.cancellation_settlement -> refund_cents, earned_cents"
      - "VOID DUE invoices on the enrollment"
      - "cascade: VERIFIED leases of this tenant -> TERMINATED -> their non-retracted ReportedItems -> RETRACTED -> tenant rate recompute"

  # ---- Leases ----
  - method: POST
    path: "/api/leases"
    description: "Create a lease (pending landlord verification)."
    roles: [Tenant, PlatformAdmin]
    code: 201
    input: [tenant_id, landlord_id, property_address, rent_amount_cents, monthly_due_day, lease_start, lease_end]
    output: Lease
    side_effects: ["reject on ERR_LEASE_DATE_OVERLAP against non-terminal leases for (tenant_id, property_address)"]
  - method: GET
    path: "/api/leases/{id}"
    description: "Fetch a lease."
    roles: [Tenant, Landlord, PlatformAdmin]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: GET
    path: "/api/leases"
    description: "List/filter leases (reverse-reachability for Lease.tenant_id and Lease.landlord_id)."
    roles: [Tenant, Landlord, PlatformAdmin]
    code: 200
    input: ["tenant_id?", "landlord_id?", "verification_status?"]
    output: "Lease[]"
    side_effects: []
  - method: POST
    path: "/api/leases/{id}/verify"
    description: "Landlord verifies or rejects a pending lease."
    roles: [Landlord, PlatformAdmin]
    code: 200
    input: [decision, "note?"]
    output: Lease
    side_effects: ["decision VERIFIED -> verification_status VERIFIED; decision REJECTED -> REJECTED; increments Lease.version by 1"]

  # ---- Rent payments ----
  - method: POST
    path: "/api/rent-payments"
    description: "Record a monthly rent payment against a lease (OCC on Lease.version)."
    roles: [Landlord, PlatformAdmin]
    code: 201
    input: [lease_id, period_month, due_date, "paid_date?", amount_paid_cents, expected_lease_version]
    output: RentPayment
    side_effects:
      - "compute calculations.payment_on_time_status -> on_time"
      - "increments Lease.version by 1 (OCC guard field)"
  - method: GET
    path: "/api/rent-payments/{id}"
    description: "Fetch a rent payment."
    roles: [Tenant, Landlord, PlatformAdmin]
    code: 200
    input: []
    output: RentPayment
    side_effects: []
  - method: GET
    path: "/api/rent-payments"
    description: "List/filter rent payments (reverse-reachability for RentPayment.lease_id)."
    roles: [Tenant, Landlord, PlatformAdmin]
    code: 200
    input: ["lease_id?", "status?"]
    output: "RentPayment[]"
    side_effects: []
  - method: POST
    path: "/api/rent-payments/{id}/report"
    description: "Furnish a recorded payment as a tri-bureau tradeline."
    roles: [ComplianceAnalyst, PlatformAdmin]
    code: 201
    input: []
    output: ReportedItem
    side_effects:
      - "guard: lease VERIFIED, enrollment ACTIVE, month not already covered"
      - "create ReportedItem (source MONTHLY, status REPORTED, on_time snapshot, bureau_statuses all FURNISHED)"
      - "payment status RECORDED -> REPORTED"
      - "recompute tenant.reported_on_time_rate_pct, tenant.effective_reported_items"

  # ---- Reported items ----
  - method: GET
    path: "/api/reported-items/{id}"
    description: "Fetch a reported tradeline item."
    roles: [Tenant, ComplianceAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ReportedItem
    side_effects: []
  - method: GET
    path: "/api/reported-items"
    description: "List/filter reported items (reverse-reachability for rent_payment_id, tenant_id, lease_id, supersedes_item_id)."
    roles: [Tenant, ComplianceAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["rent_payment_id?", "tenant_id?", "lease_id?", "supersedes_item_id?", "status?"]
    output: "ReportedItem[]"
    side_effects: []
  - method: POST
    path: "/api/reported-items/{id}/retract"
    description: "Retract a furnished tradeline (bureau deletion)."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: ReportedItem
    side_effects:
      - "status REPORTED -> RETRACTED, bureau_statuses all DELETED"
      - "recompute tenant.reported_on_time_rate_pct, tenant.effective_reported_items"

  # ---- Disputes ----
  - method: POST
    path: "/api/disputes"
    description: "File a dispute against a reported item."
    roles: [Tenant]
    code: 201
    input: [reported_item_id, reason_code]
    output: Dispute
    side_effects:
      - "guard: item REPORTED (implies no open dispute), within dispute window"
      - "create Dispute status OPEN, tenant_id = X-User-ID"
      - "ReportedItem REPORTED -> DISPUTED, increments ReportedItem.version by 1"
  - method: GET
    path: "/api/disputes/{id}"
    description: "Fetch a dispute."
    roles: [Tenant, ComplianceAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/api/disputes"
    description: "List/filter disputes (reverse-reachability for reported_item_id, tenant_id)."
    roles: [Tenant, ComplianceAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["reported_item_id?", "tenant_id?", "status?"]
    output: "Dispute[]"
    side_effects: []
  - method: POST
    path: "/api/disputes/{id}/investigate"
    description: "Analyst opens an investigation."
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: Dispute
    side_effects:
      - "status OPEN -> INVESTIGATING"
      - "analyst_user_id = X-User-ID; investigation_deadline = clock now + DISPUTE_INVESTIGATION_DAYS"
  - method: POST
    path: "/api/disputes/{id}/resolve"
    description: "Officer resolves the dispute (correction or upheld); SoD enforced."
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution, "corrected_on_time?", "corrected_amount_cents?", "note?"]
    output: Dispute
    side_effects:
      - "guard: X-User-ID != analyst_user_id (ERR_SEGREGATION_OF_DUTIES)"
      - "resolution CORRECTED -> status RESOLVED_CORRECTED; ReportedItem DISPUTED -> CORRECTED + superseding item created with corrected on_time/amount; recompute rate"
      - "resolution UPHELD -> status RESOLVED_UPHELD; ReportedItem DISPUTED -> REPORTED (reinstated); recompute rate"
      - "set officer_user_id = X-User-ID"
  - method: POST
    path: "/api/disputes/{id}/withdraw"
    description: "Tenant withdraws their dispute."
    roles: [Tenant]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> WITHDRAWN; ReportedItem DISPUTED -> REPORTED (reinstated); recompute rate"]

  # ---- Back-report requests ----
  - method: POST
    path: "/api/back-report-requests"
    description: "Request back-reporting of historical months for a lease; computes the fee and issues a fee invoice."
    roles: [Tenant, PlatformAdmin]
    code: 201
    input: [lease_id, requested_months]
    output: BackReportRequest
    side_effects:
      - "validate month window/limit and RECORDED-payment existence; reject covered months"
      - "compute calculations.back_report_fee -> billable_months, fee_cents"
      - "create BackReportRequest status PENDING"
      - "create a BACK_REPORT Invoice (status DUE, amount = fee_cents) on the tenant's enrollment"
  - method: GET
    path: "/api/back-report-requests/{id}"
    description: "Fetch a back-report request."
    roles: [Tenant, ComplianceAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: BackReportRequest
    side_effects: []
  - method: GET
    path: "/api/back-report-requests"
    description: "List/filter back-report requests (reverse-reachability for lease_id)."
    roles: [Tenant, ComplianceAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["lease_id?", "status?"]
    output: "BackReportRequest[]"
    side_effects: []
  - method: POST
    path: "/api/back-report-requests/{id}/decision"
    description: "Officer approves or rejects a back-report request."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: BackReportRequest
    side_effects:
      - "decision APPROVED: guard enrollment ACTIVE, fee invoice PAID, no month newly covered; status PENDING -> APPROVED"
      - "decision REJECTED: status PENDING -> REJECTED; VOID the fee invoice"
  - method: POST
    path: "/api/back-report-requests/{id}/complete"
    description: "Analyst furnishes the approved back-report months."
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: BackReportRequest
    side_effects:
      - "for each requested month create a ReportedItem (source BACK_REPORT) from that month's RentPayment; payment -> REPORTED"
      - "status APPROVED -> COMPLETED; recompute tenant rate + effective count"

  # ---- Invoices ----
  - method: GET
    path: "/api/invoices/{id}"
    description: "Fetch an invoice."
    roles: [Tenant, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/api/invoices"
    description: "List/filter invoices (reverse-reachability for enrollment_id and back_report_request_id)."
    roles: [Tenant, PlatformAdmin]
    code: 200
    input: ["enrollment_id?", "back_report_request_id?", "kind?", "status?"]
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/api/invoices/{id}/pay"
    description: "Pay an invoice (simulated); activates the enrollment on first subscription payment."
    roles: [Tenant, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "status DUE -> PAID, paid_at = clock now"
      - "if kind SUBSCRIPTION and enrollment PENDING_PAYMENT: enrollment -> ACTIVE, set current_period_start = clock now, current_period_end = +1 month"

  # ---- Score snapshots ----
  - method: POST
    path: "/api/score-snapshots"
    description: "Ingest a bureau score reading (append-only)."
    roles: [PlatformAdmin]
    code: 201
    input: [tenant_id, bureau, score, as_of_month]
    output: ScoreSnapshot
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default (never wall-clock). Target must not be strictly before the current clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advance logical clock; reject earlier target with ERR_CLOCK_BEFORE_CURRENT"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the endpoint, or entity_backed actor is not the owner of the target resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad enum value, wrong type, or out-of-range numeric (score, monthly_due_day, cents, malformed period_month/ISO)"
  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "referenced Tenant id does not exist"
  - id: ERR_LANDLORD_NOT_FOUND
    http: 404
    condition: "referenced Landlord id does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "referenced SubscriptionPlan id does not exist"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "referenced Enrollment id does not exist"
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "referenced Lease id does not exist"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "referenced RentPayment id does not exist"
  - id: ERR_REPORTED_ITEM_NOT_FOUND
    http: 404
    condition: "referenced ReportedItem id does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "referenced Dispute id does not exist"
  - id: ERR_BACK_REPORT_NOT_FOUND
    http: 404
    condition: "referenced BackReportRequest id does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "referenced Invoice id does not exist"
  - id: ERR_ALREADY_VERIFIED
    http: 409
    condition: "verify called on a lease not in PENDING_VERIFICATION"
  - id: ERR_LEASE_NOT_VERIFIED
    http: 409
    condition: "reporting a payment whose lease is not VERIFIED"
  - id: ERR_ITEM_NOT_DISPUTABLE
    http: 409
    condition: "filing a dispute against an item not in REPORTED status"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition trigger not valid from the resource's current state (incl. terminal resources)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_lease_version does not match current Lease.version on POST /rent-payments"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "dispute resolver (X-User-ID) is the same operator who investigated it"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "dispute filed after reported_item.created_at + DISPUTE_WINDOW_DAYS"
  - id: ERR_LEASE_DATE_OVERLAP
    http: 409
    condition: "new lease overlaps an existing non-terminal lease for the same (tenant, property_address)"
  - id: ERR_PERIOD_ALREADY_COVERED
    http: 409
    condition: "the (lease, month) is already covered by a non-retracted ReportedItem"
  - id: ERR_BACK_REPORT_LIMIT_EXCEEDED
    http: 422
    condition: "requested_months count exceeds BACK_REPORT_MAX_MONTHS (24)"
  - id: ERR_BACK_REPORT_MONTHS_INVALID
    http: 422
    condition: "a requested month is future, older than BACK_REPORT_MAX_MONTHS, or has no RECORDED RentPayment on the lease"
  - id: ERR_ENROLLMENT_INACTIVE
    http: 402
    condition: "reporting/approving requires an ACTIVE enrollment; it is PENDING_PAYMENT or CANCELLED"
  - id: ERR_INVOICE_UNPAID
    http: 402
    condition: "approving a back-report whose fee invoice is not PAID"
  - id: ERR_CLOCK_BEFORE_CURRENT
    http: 422
    condition: "clock set target is strictly before the current logical clock"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: Tenant
    description: "The enrolled renter."
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /enrollments (self)"
      - "POST /enrollments/{id}/cancel"
      - "POST /leases (self)"
      - "POST /disputes"
      - "POST /disputes/{id}/withdraw"
      - "POST /back-report-requests (self)"
      - "POST /invoices/{id}/pay (own)"
    shared_operations:
      - "GET own tenant / credit-summary / score-snapshots / enrollments / leases / rent-payments / reported-items / disputes / back-report-requests / invoices"
  - name: Landlord
    description: "Landlord / property manager integration."
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /leases/{id}/verify (own leases)"
      - "POST /rent-payments (against own leases)"
    shared_operations:
      - "GET own leases / rent-payments"
  - name: ComplianceAnalyst
    description: "Furnishing/investigation operator (maker). Opaque operator id."
    identity: "opaque"
    exclusive_operations:
      - "POST /rent-payments/{id}/report"
      - "POST /disputes/{id}/investigate"
      - "POST /back-report-requests/{id}/complete"
    shared_operations:
      - "GET reported-items / disputes / back-report-requests"
  - name: ComplianceOfficer
    description: "Approval/resolution operator (checker). Opaque operator id; SoD-separated from the analyst on the same dispute."
    identity: "opaque"
    exclusive_operations:
      - "POST /reported-items/{id}/retract"
      - "POST /disputes/{id}/resolve"
      - "POST /back-report-requests/{id}/decision"
    shared_operations:
      - "GET reported-items / disputes / back-report-requests"
  - name: PlatformAdmin
    description: "Operational superuser: onboarding, plans, score ingestion, clock. Opaque operator id."
    identity: "opaque"
    exclusive_operations:
      - "POST /tenants"
      - "POST /landlords"
      - "POST /subscription-plans"
      - "POST /score-snapshots"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET across all collections; POST /enrollments, /leases, /leases/{id}/verify, /rent-payments, /rent-payments/{id}/report, /invoices/{id}/pay, /back-report-requests as an operational override"





