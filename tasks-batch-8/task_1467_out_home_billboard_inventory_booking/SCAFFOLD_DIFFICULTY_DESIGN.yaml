            - { call: "PUT /api/posting-records/${pr}", payload: { status: "VERIFIED" }, as: OperationsAuditor, as_user_id: "auditor-1" }
            - { call: "PUT /api/campaigns/${camp}", payload: { billing_status: "INVOICED" }, as: FinanceAnalyst }
            - { call: "GET /api/flights/${fl}/make-goods", payload: {}, as: FinanceAnalyst, captures: { mg: "$.data[0].id", mg_credit: "$.data[0].credit_cents", mg_by: "$.data[0].proposed_by" } }
