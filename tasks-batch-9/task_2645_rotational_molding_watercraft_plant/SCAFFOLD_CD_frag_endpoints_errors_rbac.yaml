      - name: layer_cascading_side_effects_transitive_chain_across_three_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.Mold
          - state_machines.ProductionOrder
        excluded_because:
          difficulty_instance: "transitive_cascade / demold_service_cascade_unblocks_three_resin_blocked_orders"
          rationale: "That instance drives the full transitive chain — demould raises cycles_since_service to the service interval, the mould goes to MAINTENANCE, its SCHEDULED cycles abort, their charges release resin, and three BLOCKED_RESIN orders return to READY_TO_SCHEDULE — so the multi-hop cascade is already asserted end to end."

  # ===========================================================================
  # SECTION: consistency_model
  # Claim row from claim-extraction-guide.md "From Consistency Model". The
  # profile declares consistency_model: immediate, so every claim below asserts
  # that a write's effects — including its OCC version bump and its cascades —
  # are fully visible to the very next request, and that the ONLY concurrency
  # mechanism is optimistic concurrency on a named parent version (412), never a
  # lock, a retry window or a first-writer-wins race.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: occ_cycle_create_stale_order_version_then_the_refreshed_version_succeeds
        claim_type: immediate
        grounds:
          - concurrency_rules.cycle-create-stale-order
          - errors.ERR_STALE_PRODUCTION_ORDER_VERSION
          - validations.priority_80
        distinguishing_aspect: |
          The second cycle is legitimate in every other respect — free arm, free
          tool, quota headroom of exactly 4 units and a free cooling slot — so the
          only reason it is refused is that the first create advanced
          ProductionOrder.version, and re-reading that version makes the same
          request succeed.
        test_recipe:
          setup:
            - "Two moulds MLD-CD-1 and MLD-CD-2 for PM-CD-KM, each cavity_count 2, both AVAILABLE with cycles_since_service 0."
            - "OvenStation OVN-CD-1 (arm_count 2) and CoolingBay BAY-CD-1 (concurrent_slot_capacity 2), both OPERATIONAL."
            - "ProductionOrder PO-CD-4 (ordered_qty 4, no demand_bucket_id) is READY_TO_SCHEDULE, so two 2-cavity cycles fit inside floor(4 * 1.20) = 4."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_mold2
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_wh
            - *cd2_lot
            - *cd2_po4
            - *cd2_po4rel
          trigger:
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { ov_a: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${ov_a}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_a: $.data.id }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${ov_a}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { ov_b: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${ov_b}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_b: $.data.id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { ov_c: $.data.version }
          assert:
            - "the first create returns 201 with status 'SCHEDULED', mold_id ${mold} and arm_index 1"
            - "the second create with the pre-read version returns status 412 with data.error_id 'ERR_STALE_PRODUCTION_ORDER_VERSION'"
            - "GET /molding-cycles?production_order_id=${po} returns total_count 1 immediately after the 412 — the refusal created nothing"
            - "${ov_b} == ${ov_a} + 1: the first create's bump is visible to the very next read, with no settle step"
            - "the retry with ${ov_b} returns 201 with arm_index 2 and mold_id ${mold2}, proving the request itself was always valid"
            - "${ov_c} == ${ov_b} + 1 and GET /molding-cycles?production_order_id=${po} returns total_count 2"
            - "no request in this instance ever waits, retries internally or returns a lock or conflict-retry hint: the only concurrency signal is the 412 on a named parent version"

      - name: occ_charge_create_stale_resin_lot_version_preserves_the_mass_ledger
        claim_type: immediate
        grounds:
          - concurrency_rules.charge-create-stale-resin-lot
          - errors.ERR_STALE_RESIN_LOT_VERSION
          - validations.priority_81
        distinguishing_aspect: |
          The refused reservation leaves the three-bucket ledger exactly where the
          first reservation left it (available 476.000, reserved 24.000, consumed
          0.000, summing to the 500.000 kg receipt), and the retry with the
          refreshed version moves precisely one more charge's worth of mass — so
          a 412 that had partially reserved would be caught by the invariant.
        test_recipe:
          setup:
            - "PO-CD-4 released with cycle CYC-A on arm 1 and cycle CYC-B on arm 2, both SCHEDULED over 09:00-10:00 with 30 minutes of cooling, on moulds MLD-CD-1 and MLD-CD-2."
            - "LOT-CD-1 holds its full 500.000 kg receipt: available 500.000, reserved 0.000, consumed 0.000, status AVAILABLE, regrind 10.00 pct."
            - "T-CD-RES-1 is ACTIVE and holds RESIN_BLENDING; the logical clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_mold2
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_wh
            - *cd2_lot
            - *cd2_po4
            - *cd2_po4rel
            - *cd2_cyc
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v2: $.data.version }
            - *cd2_cycb
          trigger:
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { rl_a: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${rl_a}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { chg_a: $.data.id }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cycb}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${rl_a}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { rl_b: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cycb}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${rl_b}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { chg_b: $.data.id }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { rl_c: $.data.version }
          assert:
            - "the first charge returns 201 with status 'RESERVED' and charge_kg 24.000"
            - "the second charge with the pre-read version returns status 412 with data.error_id 'ERR_STALE_RESIN_LOT_VERSION' — not ERR_RESIN_LOT_NOT_AVAILABLE and not ERR_REGRIND_LIMIT_EXCEEDED, both of which pass"
            - "immediately after the 412 ResinLot.${lot} reports available_kg 476.000, reserved_kg 24.000 and consumed_kg 0.000, summing to received_kg 500.000"
            - "GET /resin-charges?molding_cycle_id=${cycb} returns total_count 0 after the 412"
            - "${rl_b} == ${rl_a} + 1 and the retry with ${rl_b} returns 201 with status 'RESERVED'"
            - "${rl_c} == ${rl_b} + 1 and ResinLot.${lot} then reports available_kg 452.000, reserved_kg 48.000, consumed_kg 0.000 — still exactly 500.000 kg in total"

      - name: occ_store_unit_stale_warehouse_version_after_the_sibling_hull_lands
        claim_type: immediate
        grounds:
          - concurrency_rules.store-unit-stale-warehouse
          - errors.ERR_STALE_WAREHOUSE_VERSION
          - validations.priority_82
        distinguishing_aspect: |
