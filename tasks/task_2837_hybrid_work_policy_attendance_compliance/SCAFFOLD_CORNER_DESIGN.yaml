      - name: the_disability_flag_makes_an_otherwise_routine_category_interactive
        claim_type: conditional
        grounds:
          - entities.ExceptionRequest.fields.interactive_process_required
          - validations[priority=64, ERR_ACCOMMODATION_SPECIALIST_REQUIRED]
        distinguishing_aspect: "interactive_process_required is a DISJUNCTION over the category and an employee-level flag, so two CAREGIVING requests - identical in every payload field - are adjudicable by different roles purely because of disability_accommodation_on_file on the employee row. The flagged one also needs an information round first."
        test_recipe:
          setup:
            - "Cycle, team T-A, and two employees on it: E-FLAG with disability_accommodation_on_file true and E-PLAIN with the field omitted so it falls back to its false default. Each files an identical CAREGIVING request for 2026-09-07..2026-09-08 asking for 2 relief days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN51", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
