        grounds:
          - "complexity_profile.complexity_layers.cascading_side_effects"
          - "endpoints.POST /damage-claims/{claim_id}/charge"
        excluded_because:
          difficulty_instance: transitive_cascade / damage_charge_cascades_delinquency_to_unit_release
          rationale: >-
            The charge -> ledger -> delinquency -> reservation -> unit chain, including the partial-order
            sensitivity between the MATCHED and WAITLISTED hops, is asserted in the named §1.8 instance.
      - name: layer_dual_variant_calculations_diverge_on_one_fixture
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers.dual_variant_calculation"
          - "calculations.unit_economics"
          - "calculations.member_damage_risk_score"
        excluded_because:
