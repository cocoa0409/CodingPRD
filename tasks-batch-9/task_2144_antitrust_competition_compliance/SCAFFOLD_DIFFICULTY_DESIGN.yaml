            - "RiskAssessment.${ra_base_id}.interaction_component == 0"
            - "RiskAssessment.${ra_base_id}.overlap_component == 1.00"
            - "RiskAssessment.${ra_base_id}.market_risk_index == 46.00"
            - "RiskAssessment.${ra_inc_id}.market_risk_index == 46.00"
            - "RiskAssessment.${ra_inc_id}.incident_load == 0"
            - "RiskAssessment.${ra_inc_id}.escalated_contact_count == 0"
            - "RiskAssessment.${ra_inc_id}.flagged_attendance_count == 0"
            - "RiskAssessment.${ra_inc_id}.document_violation_count == 0"
            - "RiskAssessment.${ra_inc_id}.risk_band == MODERATE"
            - "BusinessUnit.${bu_id}.posture == OPEN"

