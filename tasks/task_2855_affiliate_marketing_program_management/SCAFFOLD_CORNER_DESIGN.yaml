  - section: rbac
    instances:

      - name: anonymous_registration_allowed_but_all_other_routes_return_unauthenticated
        claim_type: unauthenticated_rejected
        grounds:
          - roles[Anonymous]
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints[POST /affiliates]
        distinguishing_aspect: "Anonymous is the only role on POST /affiliates, so self-registration succeeds with no X-User-ID; every other route rejects the same header-less caller with ERR_UNAUTHENTICATED (401). Priority 1 outranks the typed 404s, so an unauthenticated GET on a ghost affiliate id is 401 ERR_UNAUTHENTICATED, never 404 ERR_AFFILIATE_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-07-05T00:00:00Z."
            - "One Network created by ProgramAdmin adm-001."
            - "No other state; the registration in the setup is itself the positive Anonymous claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 300, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "Walk In Media LLC", contact_email: "walkin@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_id: "$.data.id" }
          trigger:
            - call: "GET /affiliates/${aff_id}"
              payload: {}
              as: Anonymous
              captures: { e_get: "$.data.error_id" }
            - call: "POST /networks"
              payload: { name: "Ghost Network", fee_model: "FLAT_PER_CONVERSION", fee_bps: 0, flat_fee_cents: 50, statement_currency: "USD" }
              as: Anonymous
              captures: { e_net: "$.data.error_id" }
            - call: "GET /payout-lines"
              payload: { limit: 10, offset: 0 }
              as: Anonymous
              captures: { e_lines: "$.data.error_id" }
            - call: "GET /affiliates/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { e_ghost: "$.data.error_id" }
          assert:
            - "the setup POST /affiliates with no X-User-ID returns HTTP 201 with data.status == \"PENDING_APPLICATION\" and data.version == 1"
            - "GET /affiliates/${aff_id} with no X-User-ID returns HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "POST /networks with no X-User-ID returns HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" and no second Network is created (GET /networks total_count == 1)"
            - "GET /payout-lines with no X-User-ID returns HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "GET /affiliates/00000000-0000-0000-0000-000000000000 with no X-User-ID returns HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" — priority 1 outranks the priority 3 ERR_AFFILIATE_NOT_FOUND"

      - name: role_cannot_perform_another_roles_exclusive_operation
        claim_type: other_role_exclusive_operation_denied
        grounds:
          - roles[ProgramAdmin]
          - roles[PartnerManager]
          - roles[ComplianceAnalyst]
          - roles[FinanceAnalyst]
          - roles[FinanceController]
          - validations[priority 2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Each role's exclusive operation refuses every other role with ERR_UNAUTHORIZED (403): screen is ComplianceAnalyst-only, decide is PartnerManager-only, POST /payout-batches is FinanceAnalyst-only and approve is FinanceController-only. Priority 2 sits above every state and existence check, so ComplianceAnalyst deciding an unscreened application is 403 (not 409 ERR_APPLICATION_NOT_SCREENED) and FinanceAnalyst approving a ghost batch id is 403 (not 404 ERR_BATCH_NOT_FOUND). The owning role's own call then succeeds on the identical payload."
