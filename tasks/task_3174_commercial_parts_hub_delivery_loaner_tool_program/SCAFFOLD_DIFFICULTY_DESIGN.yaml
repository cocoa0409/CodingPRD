      - call: POST /commercial/tool-catalog/{toolCatalogId}/fitments
        payload:
          part_id: ${p_pad}
          placement: FRONT
          depth_index: 2
        as: ToolCribAttendant
      - call: POST /commercial/tool-catalog/{toolCatalogId}/fitments
        payload:
          part_id: ${p_bolt}
          placement: FRONT
          depth_index: 5
        as: ToolCribAttendant
      - call: POST /commercial/tool-loans
        payload:
          account_id: ${acct}
          tool_catalog_id: ${t1}
          deposit_amount_cents: 9000
        as: CommercialSalesRep
        captures:
          ln1: $.data.id
