  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: return_qr_rework_cycle
        grounds:
          - state_machines.TaxReturn.PENDING_QR_to_QR_FAILED
          - state_machines.TaxReturn.QR_FAILED_to_IN_PREPARATION
          - entities.TaxReturn.fields.qr_failure_count
        distinguishing_aspect: |
          TaxReturn machine is cyclic: IN_PREPARATION -> PENDING_QR ->
          QR_FAILED -> IN_PREPARATION is traversed TWICE in one test, with
          qr_failure_count accumulating to 2 — a pure linear pipeline could not
          re-enter IN_PREPARATION.
        test_recipe:
          setup:
            - "Certified OPEN site; preparer and reviewer active; verified taxpayer; return created and patched to be preparation-ready (PAPER_CHECK)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Rev Rita", email: "rev@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rev_id: $.data.id, rev_v: $.data.version } }
            - { call: "POST /volunteers/${rev_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${rev_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${rev_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rev_v2: $.data.version } }
            - { call: "POST /volunteers/${rev_id}/certifications", payload: { test_type: INTAKE_QR, score: 92, tax_season: 2026, expected_volunteer_version: "${rev_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${rev_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { rev_v3: $.data.version } }
            - { call: "POST /volunteers/${rev_id}/certifications", payload: { test_type: ADVANCED, score: 85, tax_season: 2026, expected_volunteer_version: "${rev_v3}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${rev_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /taxpayers", payload: { full_name: "Taxpayer Four", ssn_token: "SSN-004", phone: "555-0104" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_id: $.data.id } }
            - { call: "POST /taxpayers/${tp_id}/verify-identity", payload: { id_document_type: DRIVERS_LICENSE }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_id}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /tax-returns", payload: { appointment_id: "${appt_id}", tax_year: 2025, filing_status: SINGLE }, as: Preparer, as_user_id: "${prep_id}", captures: { ret_id: $.data.id, ret_v: $.data.version } }
            - { call: "PATCH /tax-returns/${ret_id}", payload: { documents_received: ["PHOTO_ID", "SSN_CARD", "W2"], interview_confirmed: true, wages_cents: 1000000, earned_income_cents: 1000000, withholding_verified_cents: 100000, expected_return_version: "${ret_v}" }, as: Preparer, as_user_id: "${prep_id}" }
          trigger:
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: IN_PREPARATION }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: PENDING_QR }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: QR_FAILED, review_notes: "Missing W-2 wage match" }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: IN_PREPARATION }, as: Preparer, as_user_id: "${prep_id}", captures: { st1: $.data.status, qf1: $.data.qr_failure_count } }
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: PENDING_QR }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: QR_FAILED, review_notes: "Withholding mismatch persists" }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: IN_PREPARATION }, as: Preparer, as_user_id: "${prep_id}", captures: { st2: $.data.status, qf2: $.data.qr_failure_count } }
          assert:
            - "After first rework: TaxReturn.${ret_id}.status == IN_PREPARATION and qr_failure_count == 1"
            - "After second loop: TaxReturn.${ret_id}.status == IN_PREPARATION and qr_failure_count == 2"
            - "The cycle PENDING_QR -> QR_FAILED -> IN_PREPARATION was traversed twice for the same return"

      - name: volunteer_activation_cycle
        grounds:
          - state_machines.Volunteer.ACTIVE_to_INACTIVE
          - state_machines.Volunteer.INACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Volunteer machine is cyclic (ACTIVE -> INACTIVE -> ACTIVE) on a
          DIFFERENT entity than TaxReturn; re-activation re-evaluates the
          ETHICS-certification precondition against the CURRENT certification
          set, not a cached flag.
        test_recipe:
          setup:
            - "Certified OPEN site with coordinator; preparer registered with ETHICS+BASIC and ACTIVE"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: INACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { st_mid: $.data.status } }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { st_end: $.data.status } }
          assert:
            - "Volunteer.${prep_id}.status == INACTIVE after first trigger call"
            - "Volunteer.${prep_id}.status == ACTIVE after second trigger call (loop back to the original state)"
            - "Volunteer.${prep_id}.certified_test_types still contains ETHICS and BASIC after the cycle"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: site_suspend_cascade_depth3
        grounds:
          - state_machines.Site.OPEN_to_SUSPENDED
          - state_machines.Appointment.CHECKED_IN_to_CANCELLED
          - state_machines.TaxReturn.INTAKE_STARTED_to_WITHDRAWN
          - state_machines.FinancialServiceReferral.OFFERED_to_VOID
        distinguishing_aspect: |
          Depth-3 chain originating at the site-suspend trigger:
          Site OPEN->SUSPENDED mutates Appointments (link 1); each appointment's
          cancellation mutates its INTAKE_STARTED TaxReturn (link 2); that
          withdrawal mutates the return's OFFERED FinancialServiceReferral
          (link 3) — every hop is caused by the previous hop, not by the
          original trigger.
        test_recipe:
          setup:
            - "Certified OPEN site; coordinator, screener, preparer active"
            - "Return R in INTAKE_STARTED whose origin appointment A1 is CHECKED_IN; referral OFFERED on R"
            - "Second appointment A2 (different taxpayer, 2026-08-04) still SCHEDULED"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /taxpayers", payload: { full_name: "Tp One", ssn_token: "SSN-101", phone: "555-1101" }, as: Screener, as_user_id: "${scr_id}", captures: { tp1: $.data.id } }
            - { call: "POST /taxpayers/${tp1}/verify-identity", payload: { id_document_type: DRIVERS_LICENSE }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp1}", volunteer_id: "${prep_id}", purpose: INTAKE, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt1: $.data.id } }
            - { call: "POST /appointments/${appt1}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /tax-returns", payload: { appointment_id: "${appt1}", tax_year: 2025, filing_status: SINGLE }, as: Preparer, as_user_id: "${prep_id}", captures: { ret1: $.data.id } }
            - { call: "POST /tax-returns/${ret1}/financial-referrals", payload: { service_type: CREDIT_COUNSELING }, as: Preparer, as_user_id: "${prep_id}", captures: { ref1: $.data.id } }
            - { call: "POST /taxpayers", payload: { full_name: "Tp Two", ssn_token: "SSN-102", phone: "555-1102" }, as: Screener, as_user_id: "${scr_id}", captures: { tp2: $.data.id } }
            - { call: "POST /taxpayers/${tp2}/verify-identity", payload: { id_document_type: PASSPORT }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp2}", volunteer_id: "${prep_id}", purpose: INTAKE, start_at: "2026-08-04T10:00:00Z", end_at: "2026-08-04T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt2: $.data.id } }
          trigger:
            - { call: "POST /sites/${site_id}/state", payload: { to_status: SUSPENDED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /appointments/${appt1}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { a1_status: $.data.status } }
            - { call: "GET /appointments/${appt2}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { a2_status: $.data.status } }
            - { call: "GET /tax-returns/${ret1}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { r1_status: $.data.status, r1_reason: $.data.withdrawal_reason } }
            - { call: "GET /tax-returns/${ret1}/financial-referrals", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { ref1_status: "$.data[0].status" } }
          assert:
            - "Appointment.${appt1}.status == CANCELLED (link 1)"
            - "Appointment.${appt2}.status == CANCELLED (link 1, SCHEDULED branch)"
            - "TaxReturn.${ret1}.status == WITHDRAWN and withdrawal_reason == SITE_SUSPENDED (link 2)"
            - "FinancialServiceReferral.${ref1}.status == VOID (link 3)"
            - "Site.${site_id}.status == SUSPENDED"

      - name: failed_ethics_recert_demotes_volunteer
        grounds:
          - state_machines.Certification.CURRENT_to_SUPERSEDED
          - state_machines.Volunteer.ACTIVE_to_INACTIVE
          - calculations.certification_result
          - concurrency_rules[certification-record-stale-volunteer]
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (certification recording, not
          site suspension): the new failed ETHICS attempt supersedes the prior
          CURRENT pass (link 1), and losing the only CURRENT passed ETHICS cert
          auto-demotes the Volunteer ACTIVE->INACTIVE (link 2).
        test_recipe:
          setup:
            - "Certified OPEN site; preparer ACTIVE holding CURRENT passed ETHICS (score 90) and BASIC"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { old_cert: $.data.id } }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v3: $.data.version } }
          trigger:
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 40, tax_season: 2026, expected_volunteer_version: "${prep_v3}" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { new_passed: $.data.passed, new_status: $.data.status, new_attempt: $.data.attempt_number } }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { vol_status: $.data.status } }
            - { call: "GET /volunteers/${prep_id}/certifications", as: SiteCoordinator, as_user_id: "${coord_id}" }
          assert:
            - "New Certification.passed == false and status == CURRENT, attempt_number == 2 (link 1: prior row superseded)"
            - "Certification.${old_cert}.status == SUPERSEDED in the certifications list (link 1)"
            - "Volunteer.${prep_id}.status == INACTIVE (link 2: auto-demotion caused by losing the CURRENT passed ETHICS cert)"
            - "Volunteer.${prep_id}.certified_test_types no longer contains ETHICS"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: review_wrong_state_and_uncertified_reviewer_rejected
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_TRANSITION]
          - errors[ERR_REVIEWER_NOT_CERTIFIED]
        distinguishing_aspect: |
          Category pair state(5) vs business_safety(6): the return is in
          IN_PREPARATION (QR_PASSED undefined from it -> state violation) AND
          the acting reviewer holds no certifications (safety violation); the
          state error ERR_INVALID_TRANSITION must win because priority 5 is
          checked before priority 6.
        test_recipe:
          setup:
            - "Certified OPEN site; preparer active; reviewer U registered WITHOUT any certifications"
            - "Return created, patched preparation-ready, advanced to IN_PREPARATION (never submitted for review)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Rev Uncertified", email: "revu@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { revu_id: $.data.id } }
            - { call: "POST /taxpayers", payload: { full_name: "Taxpayer Five", ssn_token: "SSN-005", phone: "555-0105" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_id: $.data.id } }
            - { call: "POST /taxpayers/${tp_id}/verify-identity", payload: { id_document_type: DRIVERS_LICENSE }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_id}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /tax-returns", payload: { appointment_id: "${appt_id}", tax_year: 2025, filing_status: SINGLE }, as: Preparer, as_user_id: "${prep_id}", captures: { ret_id: $.data.id, ret_v: $.data.version } }
            - { call: "PATCH /tax-returns/${ret_id}", payload: { documents_received: ["PHOTO_ID", "SSN_CARD", "W2"], interview_confirmed: true, wages_cents: 1000000, earned_income_cents: 1000000, withholding_verified_cents: 100000, expected_return_version: "${ret_v}" }, as: Preparer, as_user_id: "${prep_id}" }
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: IN_PREPARATION }, as: Preparer, as_user_id: "${prep_id}" }
          trigger:
            - { call: "POST /tax-returns/${ret_id}/state", payload: { to_status: QR_PASSED }, as: QualityReviewer, as_user_id: "${revu_id}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_TRANSITION (state priority 5 beats business_safety priority 6)"
            - "response error_id != ERR_REVIEWER_NOT_CERTIFIED even though the reviewer is also uncertified"
            - "TaxReturn.${ret_id}.status remains IN_PREPARATION"

      - name: appointment_outside_window_and_inactive_volunteer_rejected
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_OUTSIDE_SITE_WINDOW]
          - errors[ERR_VOLUNTEER_NOT_ACTIVE]
        distinguishing_aspect: |
          Category pair business_temporal(8) vs business_referential(9) — a
          DIFFERENT pair than state-vs-safety above: the new appointment starts
          at 18:00 outside the 9-17 daily window (temporal violation) AND its
          assigned volunteer is INACTIVE (referential violation);
          ERR_OUTSIDE_SITE_WINDOW must win because priority 8 precedes 9.
        test_recipe:
          setup:
            - "Certified OPEN site; preparer was ACTIVE then moved to INACTIVE"
            - "Verified taxpayer exists"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: INACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /taxpayers", payload: { full_name: "Taxpayer Six", ssn_token: "SSN-006", phone: "555-0106" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_id: $.data.id } }
            - { call: "POST /taxpayers/${tp_id}/verify-identity", payload: { id_document_type: STATE_ID }, as: Screener, as_user_id: "${scr_id}" }
          trigger:
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_id}", volunteer_id: "${prep_id}", purpose: INTAKE, start_at: "2026-08-03T18:00:00Z", end_at: "2026-08-03T19:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_OUTSIDE_SITE_WINDOW (temporal priority 8 beats referential priority 9)"
            - "response error_id != ERR_VOLUNTEER_NOT_ACTIVE even though the assigned volunteer is INACTIVE"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: certification_pass_threshold_79_vs_80
        grounds:
          - calculations.certification_result
          - entities.Certification.fields.passed
        distinguishing_aspect: |
          Metric = test score: the threshold is inclusive (score >= 80 passes),
          so 79 fails and 80 passes; exercised through
          POST /volunteers/{id}/certifications.
        test_recipe:
          setup:
            - "Certified OPEN site with coordinator; a registered volunteer with no certifications"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Trainee Tim", email: "tim@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { tim_id: $.data.id, tim_v: $.data.version } }
          trigger:
            - { call: "POST /volunteers/${tim_id}/certifications", payload: { test_type: BASIC, score: 79, tax_season: 2026, expected_volunteer_version: "${tim_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { pass79: $.data.passed } }
            - { call: "GET /volunteers/${tim_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { tim_v2: $.data.version } }
            - { call: "POST /volunteers/${tim_id}/certifications", payload: { test_type: ADVANCED, score: 80, tax_season: 2026, expected_volunteer_version: "${tim_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { pass80: $.data.passed } }
          assert:
            - "Certification with score 79 has passed == false"
            - "Certification with score 80 has passed == true (inclusive threshold)"

