            - call: "POST /flow-links"
              payload: { project_id: "${proj_e12p}", from_segment_id: "${seg_e12a}", to_segment_id: "${seg_e12b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_e12p}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_e12p}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-012"
            - call: "POST /projects"
              payload: { customer_name: "Cascade Distribution", facility_code: "DC-PDX-07", customer_rep_user_id: "cust-rep-88", required_throughput_cph: 1200, contract_base_cents: 200000000, authorized_ceiling_cents: 260000000, spares_budget_cents: 3000000, service_tier: "BASIC" }
              as: ProjectDirector
              as_user_id: "pd-012"
