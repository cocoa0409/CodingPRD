            - "Participant.${p_id}.diversification_first_eligible_plan_year == 2023 and diversification_eligible == true"
            - "EsopPlan.${plan_id}.draft_run_count == 0"

      - name: close_year_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.EsopPlan.OPEN_to_VALUATION_PENDING
          - validations[priority=8]
          - errors[ERR_PLAN_STATE_INVALID]
        distinguishing_aspect: "A second close-year on a plan already in VALUATION_PENDING returns ERR_PLAN_STATE_INVALID (409) and leaves EsopPlan.version at the value the first call produced."
        test_recipe:
          setup: ["One plan already moved to VALUATION_PENDING by a first close-year."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
