# =============================================================================
# §1.9 Scaffold Corner Design — USDA Meat Processing & HACCP
# Breadth coverage of every testable claim §1.1–§1.7 declares that §1.8 does
# not already cover. Sections follow the claim-extraction-guide taxonomy.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: plant_and_plan_creation_apply_defaults
        claim_type: defaults
        grounds: [entities.Plant.fields.operating_status, entities.Plant.fields.provisional_compliance_score, entities.HACCPPlan.fields.status, entities.HACCPPlan.fields.revision_number]
        distinguishing_aspect: "Fresh Plant starts ACTIVE with scores 100 and occupancy 0; fresh HACCPPlan starts DRAFT with revision_number 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-S", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id, p_status: $.data.operating_status, p_prov: $.data.provisional_compliance_score, p_off: $.data.official_compliance_score, p_occ: $.data.cooler_occupied_lbs } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id, pl_status: $.data.status, pl_rev: $.data.revision_number } }
          trigger: []
          assert:
            - "Plant create response: operating_status == ACTIVE, provisional_compliance_score == 100, official_compliance_score == 100, cooler_occupied_lbs == 0"
            - "HACCPPlan create response: status == DRAFT, revision_number == 0"
            - "both responses carry server-minted id (UUID), created_at, updated_at, version == 1"

      - name: plant_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Plant.fields.cooler_occupied_lbs, entities.Plant.fields.official_compliance_score]
        distinguishing_aspect: "Client-supplied values for computed fields are ignored; the server-computed defaults come back in the response."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-T", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000, cooler_occupied_lbs: 999.0, official_compliance_score: 1 }, as: PlantAdmin, captures: { occ: $.data.cooler_occupied_lbs, off: $.data.official_compliance_score } }
          assert:
            - "response cooler_occupied_lbs == 0 (client-supplied 999.0 ignored)"
            - "response official_compliance_score == 100 (client-supplied 1 ignored)"

      - name: plant_missing_required_establishment_number_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Plant.fields.establishment_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field establishment_number is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plants", payload: { name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: plant_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent plant UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlantAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: production_day_invalid_enum_process_type_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ProductionDay.fields.process_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An enum member outside the declared set is rejected as a schema error before any business rule runs."
        test_recipe:
          setup: ["plant registered"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-U", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
          trigger:
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "FERMENTED" }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: lots_list_pagination_defaults_and_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more; default limit is 10."
        test_recipe:
          setup:
            - "Plant with EFFECTIVE plan, inspector ON_PREMISE, OPEN day, and 2 RECEIVED lots"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-V", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 10, live_weight_lbs: 12500 }, as: ProductionManager, captures: { lot1: $.data.id } }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "SWINE", supplier_name: "Verde Farms", head_count: 20, live_weight_lbs: 5200 }, as: ProductionManager, captures: { lot2: $.data.id } }
          trigger:
            - { call: "GET /lots?production_day_id=${day_id}&limit=1&offset=0", as: QAManager, captures: { page1_first_species: "$.data[0].species" } }
            - { call: "GET /lots?production_day_id=${day_id}&limit=1&offset=1", as: QAManager, captures: { page2_first_species: "$.data[0].species" } }
          assert:
            - "page 1 (limit=1, offset=0): exactly 1 row, total_count == 2, has_more == true"
            - "page 2 (limit=1, offset=1): exactly 1 row, has_more == false, and a different lot than page 1"
            - "unfiltered GET /lots uses default limit 10: both rows returned with has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: plan_submit_without_ccp_returns_plan_has_no_ccp
        claim_type: precondition_enforcement
        grounds: ["validations[priority=29]", "errors[ERR_PLAN_HAS_NO_CCP]", state_machines.HACCPPlan.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submit precondition (>= 1 CCP) is enforced: a CCP-less plan cannot leave DRAFT."
        test_recipe:
          setup: ["plant registered; DRAFT plan with zero CCPs"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-01", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
          trigger:
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PLAN_HAS_NO_CCP and HTTP status == 422"
            - "GET /haccp-plans/${plan_id} still shows status == DRAFT"

      - name: superseded_plan_submit_returns_plan_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.HACCPPlan, "errors[ERR_PLAN_INVALID_STATE]"]
        distinguishing_aspect: "SUPERSEDED is terminal: no transition (here submit) is allowed from it."
        test_recipe:
          setup: ["plant with plan v1 EFFECTIVE then SUPERSEDED by plan v2"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-02", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan1: $.data.id } }
            - { call: "POST /haccp-plans/${plan1}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan1}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan1}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan1}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan2: $.data.id } }
            - { call: "POST /haccp-plans/${plan2}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler v2", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 30 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan2}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan2}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan2}/activate", payload: {}, as: QAManager }
          trigger:
            - { call: "POST /haccp-plans/${plan1}/submit", payload: {}, as: QAManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PLAN_INVALID_STATE and HTTP status == 409"
            - "GET /haccp-plans/${plan1} status remains SUPERSEDED"

      - name: sample_report_twice_returns_already_reported
        claim_type: idempotency
        grounds: [state_machines.PathogenSample, "errors[ERR_SAMPLE_ALREADY_REPORTED]"]
        distinguishing_aspect: "Terminal-state lockdown on PathogenSample: a second report-result on a NEGATIVE sample is rejected."
        test_recipe:
          setup: ["OPEN day with HARVESTED lot; one sample collected and reported NEGATIVE"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-03", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 10, live_weight_lbs: 12500 }, as: ProductionManager, captures: { lot_id: $.data.id } }
            - { call: "POST /lots/${lot_id}/pass-ante-mortem", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /lots/${lot_id}/harvest", payload: { hot_carcass_weight_lbs: 1030.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/pathogen-samples", payload: { organism: "GENERIC_ECOLI", sample_type: "CARCASS_SWAB" }, as: QATech, as_user_id: "qa-tech-1", captures: { sample_id: $.data.id, sample_result0: $.data.result } }
            - { call: "POST /pathogen-samples/${sample_id}/report-result", payload: { result: "NEGATIVE" }, as: LabAnalyst, as_user_id: "lab-1" }
          trigger:
            - { call: "POST /pathogen-samples/${sample_id}/report-result", payload: { result: "POSITIVE" }, as: LabAnalyst, as_user_id: "lab-1", captures: { err: $.data.error_id } }
          assert:
            - "newly collected sample has result == PENDING (initial state)"
            - "second report rejected: error_id == ERR_SAMPLE_ALREADY_REPORTED and HTTP status == 409"
            - "GET /pathogen-samples/${sample_id} still shows result == NEGATIVE"

      - name: day_suspend_from_planned_returns_day_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ProductionDay, "errors[ERR_DAY_INVALID_STATE]"]
        distinguishing_aspect: "suspend is only valid from OPEN; from PLANNED it is an invalid transition."
        test_recipe:
          setup: ["plant; PLANNED day (never opened)"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-04", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
          trigger:
            - { call: "POST /production-days/${day_id}/suspend", payload: {}, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DAY_INVALID_STATE and HTTP status == 409"

      - name: lot_harvest_before_ante_mortem_returns_lot_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CarcassLot, "errors[ERR_LOT_INVALID_STATE]"]
        distinguishing_aspect: "harvest requires CLEARED; from RECEIVED it is rejected, enforcing inspector ante-mortem first."
        test_recipe:
          setup: ["OPEN day; lot RECEIVED (ante-mortem not yet passed)"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-05", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 10, live_weight_lbs: 12500 }, as: ProductionManager, captures: { lot_id: $.data.id, lot_status0: $.data.status } }
          trigger:
            - { call: "POST /lots/${lot_id}/harvest", payload: { hot_carcass_weight_lbs: 1030.0 }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "lot initial status == RECEIVED"
            - "harvest rejected: error_id == ERR_LOT_INVALID_STATE and HTTP status == 409"

      - name: deviation_verify_before_action_logged_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Deviation, "errors[ERR_DEVIATION_INVALID_STATE]"]
        distinguishing_aspect: "verify requires ACTION_LOGGED; from OPEN it is rejected — the corrective-action step cannot be skipped."
        test_recipe:
          setup: ["OPEN day; observation violation created Deviation D in OPEN state"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-06", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager, captures: { ccp_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /ccps/${ccp_id}/observations", payload: { observed_value_f: 41.0 }, as: QATech, as_user_id: "qa-tech-1", captures: { dev_id: $.data.deviation_id } }
          trigger:
            - { call: "POST /deviations/${dev_id}/verify", payload: {}, as: QAManager, as_user_id: "qa-mgr-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEVIATION_INVALID_STATE and HTTP status == 409"
            - "GET /deviations/${dev_id} status remains OPEN"

      - name: nr_appeal_after_close_returns_noncompliance_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.NoncomplianceRecord, "errors[ERR_NONCOMPLIANCE_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal for an NR: appeal after resolve is rejected."
        test_recipe:
          setup: ["OPEN day; humane audit FAILED created NR (created_by insp-01); NR resolved to CLOSED by insp-02"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-07", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "SLAUGHTER" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1S", hazard_category: "BIOLOGICAL", description: "Scald water", critical_limit_min_f: 140.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "SLAUGHTER" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /plants/${plant_id}/humane-audits", payload: { production_day_id: "${day_id}", stunning_efficacy_pct: 98.0, slips_falls_pct: 2.0, vocalization_pct: 5.0 }, as: Inspector, as_user_id: "insp-01", captures: { nr_id: $.data.noncompliance_record_id } }
            - { call: "POST /noncompliance-records/${nr_id}/resolve", payload: { resolution_note: "Stun operator retrained; verified" }, as: Inspector, as_user_id: "insp-02" }
