          - errors[ERR_CONTENT_PARITY_BLOCKED]
          - endpoints[PATCH /distribution/channel-mappings/{id}/content]
        distinguishing_aspect: |
          Entity pair Promotion x ChannelMapping: the gate is a COMPUTED state on the other entity
          (parity_state, derived from the mapping's content fingerprint against the room type master)
          rather than a lifecycle state, so it is repaired by writing content fields on the mapping and
          never by touching the promotion at all.
