      - name: remediation_verified_without_evidence_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=62]
          - errors[ERR_EVIDENCE_REQUIRED]
          - endpoints[POST /cpa/brand-audits/{auditId}/remediation]
        distinguishing_aspect: "evidence_ref is optional on the endpoint but mandatory for exactly one target value: the identical call is a 422 without it and a 200 with it, and the IN_PROGRESS step never requires it."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base and one BrandAudit whose remediation_status is IN_PROGRESS (set without evidence)."
          setup_api_calls:
