              payload: { decision: "REJECT", decision_note: "Fourth round - version abandoned" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "Recipe.${r1}.revision_round == 1 and status == DRAFT after setup_api_calls[6]"
            - "Recipe.${r1}.revision_round == 2 and status == DRAFT after setup_api_calls[8]"
            - "Recipe.${r1}.revision_round == 3 and status == DRAFT after setup_api_calls[10]"
            - "trigger[0] response HTTP status == 200 and data.status == REJECTED"
            - "Recipe.${r1}.status == REJECTED and Recipe.${r1}.revision_round == 3 - the counter does not advance past the cap"
            - "MenuItem.${item}.labeling_status == DECLARATION_PENDING and declared_calorie_max == null: a rejected version never declares"
            - "trigger[1] response HTTP status == 409 and data.error_id == ERR_ALREADY_TERMINAL"
            - "GET /recipes/${r1}/nutrition-analyses returns total_count == 4 with every row in status REJECTED"

      - name: variance_grant_without_opening_review_returns_variance_state_invalid
        claim_type: invalid_transitions
        grounds:
          - state_machines.VarianceRequest.transitions.SUBMITTED_to_UNDER_REVIEW
          - validations[priority=16]
          - errors[ERR_VARIANCE_STATE_INVALID]
        distinguishing_aspect: "GRANTED is reachable only from UNDER_REVIEW: deciding GRANTED on a SUBMITTED request returns ERR_VARIANCE_STATE_INVALID (409) with effective dates still null, and the same call succeeds after OPEN_REVIEW."
        test_recipe:
          setup:
            - "One VarianceRequest in status SUBMITTED against a VARIANCE_ALLOWED jurisdiction."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
