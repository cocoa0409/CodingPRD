          rationale: "Asserted as the failure path of the named §1.8 instance (PATCH to INACTIVE then intake rejected with ERR_PAYER_INACTIVE)."

  # ---------------------------------------------------------- calculations ---
  - section: calculations
    instances:
      - name: deadline_fallback_to_payer_default
        claim_type: constants_applied
        grounds: [calculations.appeal_deadline_schedule, entities.Payer.fields.default_timely_filing_days]
        distinguishing_aspect: "With no effective level-1 policy, the deadline falls back to payer.default_timely_filing_days: remit 2026-08-01 + 90 = 2026-10-30."
        test_recipe:
          setup: ["payer A with default_timely_filing_days 90 and NO appeal policies; code CO-16"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "MEDICAID", default_timely_filing_days: 90 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
          trigger:
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2201", patient_account_number: "PA-2201", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d_dl: $.data.next_appeal_deadline }
          assert:
            - "next_appeal_deadline == 2026-10-30 (fallback to payer default 90 days, no policy row exists)"

      - name: next_level_deadline_after_upheld
        claim_type: correct_result
        grounds: [calculations.appeal_deadline_schedule]
        distinguishing_aspect: "After an UPHELD level-1 outcome recorded at 2026-09-10, the level-2 deadline re-anchors on the outcome date: 2026-09-10 + 45 = 2026-10-25."
        test_recipe:
          setup: ["payer A with level-1 (60d) and level-2 (45d) policies; code CO-16; denial CLM-2202 (denied 250000) with level-1 appeal SUBMITTED; clock 2026-09-10"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 2, timely_filing_days: 45, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2202", patient_account_number: "PA-2202", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-2202-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: RevenueCycleDirector
          trigger:
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "UPHELD", recovered_amount_cents: 0 }
              as: DenialsSpecialist
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsManager
              captures: { d_dl: $.data.next_appeal_deadline, d_status: $.data.status }
          assert:
            - "next_appeal_deadline == 2026-10-25 (outcome date 2026-09-10 + level-2 policy 45 days)"
            - "denial remains IN_APPEAL (level 2 available, balance open)"

      - name: queue_bucket_exact_boundary
        claim_type: precision
        grounds: [calculations.queue_priority_score]
        distinguishing_aspect: "Bucket edges are >= comparisons: a score of exactly 50.00 (dollar 20.00 + deadline 30.00 at 10 days remaining) lands in HIGH, not MEDIUM."
        test_recipe:
          setup: ["payer A with level-1 policy (60d); code CO-16; denial CLM-2203 (denied 200000, remit 2026-08-01 -> deadline 2026-09-30) QUEUED; clock 2026-09-20 (10 days remaining)"]
