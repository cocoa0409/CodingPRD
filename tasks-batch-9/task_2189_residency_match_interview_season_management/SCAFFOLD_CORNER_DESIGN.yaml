      - name: state_check_outranks_the_screening_filter_on_a_rejected_application
        claim_type: priority_ordering
        grounds:
          - validations.priority 5
          - validations.priority 10 ERR_SCREENING_FILTER_FAILED
        excluded_because:
          difficulty_instance: state_check_precedes_screening_filter_on_already_rejected_application
          rationale: >
            The priority-5-before-priority-10 adjudication on an application that violates both rules at once
            is the §1.8 priority-pair instance's entire subject.

      - name: conflict_of_interest_outranks_the_double_booking_check
        claim_type: priority_conflict
        grounds:
          - validations.priority 7 ERR_CONFLICT_OF_INTEREST
          - validations.priority 9 ERR_INTERVIEWER_DOUBLE_BOOKED
        excluded_because:
          difficulty_instance: conflict_of_interest_precedes_interviewer_double_booking
          rationale: >
            A single assignment that trips both the priority-7 conflict rule and the priority-9 overlap rule,
            and the demonstration that the lower number wins, is the §1.8 priority-pair instance.

      - name: wave_windows_must_keep_a_forty_eight_hour_buffer_in_both_directions
        claim_type: temporal_validation
        grounds:
          - validations.priority 9 ERR_WAVE_WINDOW_CONFLICT
          - constants.WAVE_MIN_GAP_HOURS
        excluded_because:
          difficulty_instance: wave_closed_interval_requires_forty_eight_hour_buffer_both_directions
          rationale: >
            Both directions of the WAVE_MIN_GAP_HOURS buffer, at exactly 48 hours and one hour inside it, are
            walked by the §1.8 temporal-overlap instance.

      - name: submit_to_committee_aggregates_the_score_card_states_of_every_entry
        claim_type: cross_entity_validation
        grounds:
          - validations.priority 10 ERR_INSUFFICIENT_EVALUATIONS
          - constants.MIN_SCORECARDS_PER_ENTRY
        excluded_because:
          difficulty_instance: rank_list_submit_gated_by_scorecard_states_two_entities_away
          rationale: >
            The two-entities-away gate - DRAFT cards not counting toward MIN_SCORECARDS_PER_ENTRY - is
            asserted by the §1.8 cross-entity instance from both the failing and the passing side.

      - name: activation_aggregates_every_mandatory_credential_item
        claim_type: aggregate_validation
        grounds:
          - validations.priority 11 ERR_CREDENTIALS_INCOMPLETE
          - entities.Contract.verified_credential_count
        excluded_because:
          difficulty_instance: contract_activation_gated_by_every_mandatory_credential_item
          rationale: >
            The aggregate check verified_credential_count == mandatory_credential_count, individually valid
            items and all, is the §1.8 cross-entity instance's subject.


  # ===========================================================================
  # Endpoints - Table 5 rows against §1.5: the cross-reference link pattern, a
  # declared side effect on an action endpoint, a conditional action refused
  # outside its phase, and the standard CRUD round trip.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: accepting_into_a_slot_from_another_wave_is_a_cross_reference_mismatch
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST /interview-invitations/{id}/accept
          - validations.priority 8 ERR_CROSS_REFERENCE_MISMATCH
          - errors.ERR_CROSS_REFERENCE_MISMATCH
        distinguishing_aspect: >
          Both referenced rows exist and the applicant owns the invitation, so nothing at priority 3 or 8's
          ownership limb fires: the only defect is that the slot belongs to wave 2 while the invitation was
          issued by wave 1. The 422 must be ERR_CROSS_REFERENCE_MISMATCH rather than a 404, and wave 2's
          slot must be left with booked_count 0.
        test_recipe:
          setup:
            - "a RELEASED wave 1 holding an ISSUED invitation, plus a second wave 48 hours clear of wave 1 with its own slot"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Iris Kwon", is_program_director: true, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { pd_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Alan Reyes", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f1_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Bea Osei", is_program_director: false, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f2_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
