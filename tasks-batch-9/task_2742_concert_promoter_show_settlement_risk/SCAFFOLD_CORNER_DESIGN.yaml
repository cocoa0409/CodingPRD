          assert:
            - "NINE OWNERSHIP REFUSALS CARRY THE OWNERSHIP ERROR — ${pr_err_1}, ${pr_err_2}, ${pr_err_3}, ${pr_err_4}, ${pr_err_5}, ${pr_err_7}, ${pr_err_8}, ${pr_err_9} and ${pr_err_12} are each ERR_NOT_RESOURCE_OWNER with HTTP 403, and NONE of them is ERR_ROLE_FORBIDDEN: every one of those calls was made by a role that §1.5 lists on the endpoint, so the role gate at priority 2 passed and priority 15 did the work"
            - "THE OWNING IDENTITY SUCCEEDS AT THE IDENTICAL CALL — ${pr_o1_status_a} == SUBMITTED then ${pr_o1_status_b} == ACCEPTED with ${pr_o1_accby} == ${pr_a1_id}; ${pr_o2_status_a} == SUBMITTED then ${pr_o2_status_b} == COUNTERED with ${pr_o2_guar} == 150000; the holds return ${pr_h1_status} == ${pr_h2_status} == HELD; the invoice returns ${pr_i1_status} == SUBMITTED and then ${pr_i1_status_d} == DISPUTED"
            - "INVENTORY MOVED ONLY FOR THE OWNERS — after the two refused and two accepted holds ${pr_t3_held_a} == 9 with ${pr_t3_avail_a} == 91 (200 - 100 sold - 9 held), and after the releases ${pr_t3_held_b} == 0 with ${pr_t3_avail_b} == 100; the refused calls left no hold row behind"
            - "RELEASE IS OWNED BY KIND AND BY ROOM — ${pr_h2_rel} == RELEASED with ${pr_h2_relby} == ${pr_v1_id} and ${pr_h1_rel} == RELEASED with ${pr_h1_relby} == ${pr_a1_id}; a hold may only be released by the identity whose kind it is"
            - "THE KIND CLAUSE IS A STATE PRECONDITION, NOT AN OWNERSHIP CHECK — ${pr_err_6} == ERR_INVALID_STATE with HTTP 409, not ERR_NOT_RESOURCE_OWNER: Act One's rep DOES own show S3, so priority 15 is satisfied, and it is the §1.2 release precondition (an ArtistRep may release only ARTIST_HOLD rows) that priority 17 enforces"
            - "OWNERSHIP DOES NOT SCOPE READS — ${pr_s3_read_status} == PERFORMED is readable by Act Two's rep and GET /ticket-tiers?show_id=${pr_s3_id} returns total_count 1 to Hall Two's operator: priority 15's applies_to names seven WRITE endpoints and no GET, so an implementation that filters reads by the acting identity is wrong"
            - "THE PORTFOLIO READ IS ROLE-SCOPED INSTEAD — ${pr_err_10} == ${pr_err_11} == ERR_ROLE_FORBIDDEN 403: GET /markets/{market_id}/portfolio-risk is the single GET that the two entity-backed roles may not call, which is why §1.7 words their read grants as an explicit list rather than 'every GET'"
            - "SIGNING IS OWNED BY THE ACT THAT PLAYED — the refused signature leaves ${pr_st_status_after} == CALCULATED with ${pr_st_signed_after} == null, and Act One's rep then gets ${pr_st_status_s} == ARTIST_SIGNED with ${pr_st_signedby} == ${pr_a1_id} == the show's artist_id"
            - "THE SETTLEMENT NUMBERS ARE UNDISTURBED BY THE REFUSALS — ${pr_st_status_c} == CALCULATED with ${pr_st_adj} == 487500 (500000 gross less the 12500 card fee), ${pr_st_exp} == 0 because the show's only invoice is DISPUTED and never reached the ledger, ${pr_st_due} == 100000 == the FLAT guarantee, and ${pr_st_net} == 387500"

  # ===========================================================================
  # SECTION 8 — cross-cutting complexity layers
  # §1.0 declares exactly four layers: dual_variant_calculation,
  # cascading_side_effects, rate_threshold_triggers and optimistic_concurrency.
  # All four are walked below. The other rows of the layer table are SKIPPED
  # because the scaffold does not declare them: there is no soft_delete (no
  # entity carries a deleted flag and no endpoint deletes), no idempotency key
  # anywhere in §1.5, no cursor pagination beyond limit/offset (plain
  # pagination is covered under entities), no bulk endpoint, no scheduled
  # action other than the explicit POST /_ops/run sweep, no tenant boundary,
  # no feature flag, and derived_field_reconciliation is subsumed by
  # cascading_side_effects since every derived field in §1.1 is refreshed by a
  # declared cascade hop.
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: both_valuation_variants_are_reachable_and_disagree_on_the_same_market
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers[dual_variant_calculation]"
          - "calculations.market_performance_index.variants"
          - "calculations.settlement_projection.variants"
        excluded_because:
          difficulty_instance: market_performance_index_trailing_settled_versus_mark_to_market
          rationale: "The §1.8 instance already drives both declared variants of the market performance index over one identical data set — GET /markets/{market_id}/portfolio-risk with no valuation parameter (TRAILING_SETTLED, which must equal the persisted Market.performance_index) and with valuation=MARK_TO_MARKET — and asserts the exact integer index each returns, the sign of the delta between them, and the two wrong answers that the plausible-but-incorrect averaging and denominator-marking variants would produce. It also asserts that neither read persists anything. The second dual-variant calculation in §1.3, settlement_projection, is driven the same way by settlement_projection_provisional_versus_final_diverge_on_identical_show, which is cited by the §1.9 endpoints instance computed_reads_return_derived_money_without_persisting_it. Adding a third walk of the same two variant pairs here would restate those assertions without probing anything new, so this row is covered rather than weakened."

      - name: the_four_hop_approval_cascade_reaches_the_market_ledger
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers[cascading_side_effects]"
          - "endpoints[POST /vendor-invoices/{vendor_invoice_id}/approve].side_effects"
          - "endpoints[POST /offers/{offer_id}/accept].side_effects"
        excluded_because:
          difficulty_instance: invoice_approval_cascades_four_levels_invoice_line_show_market
          rationale: "The §1.8 instance verifies the longest declared chain end to end — invoice APPROVED, then budget_line actual/variance/variance_status/settlement_expense, then show total_actual_expense/budget_posture/breakeven, then market at_risk_guarantee/risk_posture — with the exact value at each of the four hops, the version increment on all four rows, and the ordering sensitivity that makes hop 4 depend on hop 3's recomputed breakeven rather than on the raw invoice amount. Partial-failure handling of the same cascade is covered by settlement_offer_and_claim_rule_violations_each_return_their_own_error_id and segregation_of_duties_blocks_the_same_user_from_both_halves_of_four_pairs, which each assert that a refused approval leaves all four levels untouched. The three-level acceptance cascade (offer, show, artist and market) is likewise walked by offer_acceptance_cascades_three_levels_offer_show_artist_and_market and re-verified from the aggregate side by individually_affordable_guarantees_collectively_break_the_market_limit. A fresh instance here would add no new hop, so this row is covered."

      - name: cumulative_exposure_bands_and_instantaneous_variance_bands_fire_at_their_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - "complexity_profile.complexity_layers[rate_threshold_triggers]"
          - "calculations.market_guarantee_exposure"
          - "calculations.show_comp_allowance"
          - "calculations.budget_line_variance_recognition"
          - "validations[priority=32]"
          - "validations[priority=40]"
        distinguishing_aspect: "Three thresholds of two different kinds are driven to their exact boundaries in one run. The market posture band is CUMULATIVE: it moves only as guarantees accumulate, and the walk lands on 70.00, 90.00, 99.90 and 100.00 so that all four bands including RESTRICTED — the band no other instance reaches, because it needs a utilization strictly between 90 and 100 — are observed, and then cancellations walk the band back DOWN, which is the reset half that a one-way implementation fails. The comp allowance is also cumulative but counts only comp seats, so a five-seat ARTIST_HOLD is admitted while the comps sit exactly at the ceiling, and the SAME ceiling is re-checked when that hold is later converted rather than only at creation. The variance band is INSTANTANEOUS: it is re-derived from scratch at every approval, and four lines differing by a single cent (11000 / 11001 / 12500 / 12501 against a budget of 10000) put both of its boundaries under test at once, 10.00 versus 10.01 for the tolerance gate and 25.00 versus 25.01 for the approver escalation."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z throughout — no deadline is under test here. Market Band Market with guarantee_exposure_limit_cents 1000000 (deliberately small so that whole-cent guarantees land on exact percentages). Venue Band Hall capacity 500, facility fee 0, ticket tax 0."
            - "Five artists (Band Act One through Band Act Five), one show each at Band Hall on disjoint weekly load windows so that neither the venue window rule nor the 36-hour artist routing buffer interferes: S1 2026-12-02T02:00Z, S2 2026-12-09T02:00Z, S3 2026-12-16T02:00Z, S4 2026-12-23T02:00Z, S5 2026-12-30T02:00Z."
            - "Five SUBMITTED FLAT_GUARANTEE offers, one per show, with deposit 0 and expense cap equal to the guarantee: O1 700000, O2 200000, O3 99000, O4 1000, O5 1000. Nothing is accepted yet, so committed guarantee is 0, utilization 0.00 and posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Band Market", region_code: "BD", guarantee_exposure_limit_cents: 1000000 }
              as: RiskOfficer
              captures: { rt_mk_id: $.data.id, rt_mk_util_0: $.data.exposure_utilization_pct, rt_mk_posture_0: $.data.risk_posture }
            - call: "POST /venues"
              payload: { market_id: "${rt_mk_id}", name: "Band Hall", gross_capacity: 500, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { rt_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Band Act One", agency: "Bnd Talent", tier: "THEATER", historical_sellthrough_pct: 60.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rt_a1_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Band Act Two", agency: "Bnd Talent", tier: "THEATER", historical_sellthrough_pct: 61.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rt_a2_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Band Act Three", agency: "Bnd Talent", tier: "CLUB", historical_sellthrough_pct: 62.00, withholding_pct: 0 }
              as: TalentBuyer
