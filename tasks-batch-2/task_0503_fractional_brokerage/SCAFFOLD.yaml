# =============================================================================
# Commission-Free Fractional Brokerage (Robinhood style) — seed tables
# Difficulty tier: EXPERT (§0.4)
# =============================================================================

scenario: |
  503. Commission-Free Fractional Brokerage (Robinhood style): instant deposit &
  buying power, dollar-based fractional order, market/limit & extended-hours,
  dividend reinvestment (DRIP), options approval levels, settlement (T+1)/PFOF
  routing, margin & pattern-day-trader rule, 1099-B & cost basis

domain_name: fractional-brokerage
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation     # cost basis FIFO vs average; instant vs settled buying power
    - cascading_side_effects       # fill -> position/lot -> settlement -> cash/buying-power -> margin
    - rate_threshold_triggers      # PDT day-trade count, margin maintenance ratio, deposit instant-credit cap
    - derived_field_reconciliation # buying_power / account_equity / maintenance_excess kept consistent

  entity_topology: flat
  # Peer entities under a single Account aggregate, joined by FK references in the
  # body. URLs are flat collections (/orders, /fills, /settlements, /dividends...),
  # NOT deeply nested resource trees.

  state_machine_shape: parallel
  # Order carries two independent state dimensions (order_status x settlement-leg
  # via the Settlement entity). DividendEvent has a branching/cyclic reinvest loop.
  # MarginCall is a branching revert machine. Account.trading_status is compound.

  relationship_patterns:
    - one_to_many        # Account -> Order, Position, Settlement, Dividend, Lot
    - flat_references    # Order -> Security, Fill -> Order, Lot -> Position
    - cross_aggregate    # Settlement debits/credits Account.cash; Disposal reads Lots

  role_model: peer_roles
  # AccountHolder acts on own account (entity_backed). ComplianceOfficer approves
  # options levels / lifts restrictions (opaque). ClearingSystem is the settlement/
  # corporate-actions operator (opaque). MarketData posts quotes/executions (opaque).

  consistency_model: immediate
  # All buying-power, equity, and maintenance recomputes are synchronous within the
  # triggering request. T+1 settlement is advanced by an explicit clock/settle call,
  # not background eventual consistency.

# =============================================================================
# Response envelope (FIXED — §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1) — 12 entities
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Account
    parent: null
    common_fields: true            # id, created_at, updated_at, version
    fields:
      - { name: holder_email, type: string, source: input, description: "Login email; unique per account" }
      - { name: account_type, type: enum, source: input, description: "CASH | MARGIN", default: "CASH", constraints: "CASH | MARGIN" }
      - { name: options_level, type: integer, source: computed, description: "Approved options trading level 0..3; 0 = none, set by ComplianceOfficer approval", default: 0, constraints: "0 | 1 | 2 | 3" }
      - { name: trading_status, type: enum, source: computed, description: "Compound posture derived from margin/PDT/compliance state: ACTIVE | RESTRICTED_CLOSING_ONLY | MARGIN_CALL | FROZEN", default: "ACTIVE", constraints: "ACTIVE | RESTRICTED_CLOSING_ONLY | MARGIN_CALL | FROZEN" }
      - { name: settled_cash_cents, type: integer, source: computed, description: "Cash that has fully settled (T+1 cleared); the only cash usable in a CASH account", default: 0 }
      - { name: unsettled_cash_cents, type: integer, source: computed, description: "Net of pending settlement legs not yet cleared; can be negative (owed) or positive (incoming)", default: 0 }
      - { name: instant_credit_cents, type: integer, source: computed, description: "Provisional buying power granted from a PENDING instant deposit, capped at INSTANT_CAP_CENTS", default: 0 }
      - { name: buying_power_cents, type: integer, source: computed, description: "Spendable buying power; CASH = settled_cash + instant_credit; MARGIN = maintenance-adjusted per buying_power calc" }
      - { name: account_equity_cents, type: integer, source: computed, description: "settled_cash + unsettled_cash + sum(Position.market_value_cents)" }
      - { name: maintenance_requirement_cents, type: integer, source: computed, description: "Sum over Positions of market_value * maintenance rate; basis for margin call" }
      - { name: maintenance_excess_cents, type: integer, source: computed, description: "account_equity - maintenance_requirement; negative triggers MARGIN_CALL" }
      - { name: day_trade_count, type: integer, source: computed, description: "Rolling count of day trades inside the current 5-business-day window", default: 0 }
      - { name: pdt_flagged, type: boolean, source: computed, description: "True once day_trade_count reaches PDT_THRESHOLD (4) in window AND equity < PDT_MIN_EQUITY_CENTS", default: false }
      - { name: compliance_hold, type: boolean, source: input, description: "Manual FROZEN override toggled by ComplianceOfficer; when true forces trading_status=FROZEN", default: false }

  # ---------------------------------------------------------------------------
  - name: Security
    parent: null
    common_fields: false           # id, created_at only — reference/config data
    fields:
      - { name: symbol, type: string, source: input, description: "Ticker symbol; unique" }
      - { name: instrument_type, type: enum, source: input, description: "EQUITY | OPTION", constraints: "EQUITY | OPTION" }
      - { name: last_price_cents, type: integer, source: input, description: "Most recent quoted price in cents; updated via quote endpoint" }
      - { name: fractional_enabled, type: boolean, source: input, description: "Whether dollar-based fractional orders are allowed", default: true }
      - { name: maintenance_rate_bps, type: integer, source: input, description: "Margin maintenance requirement in basis points (e.g. 2500 = 25%)", default: 2500 }
      - { name: required_options_level, type: integer, source: input, description: "Minimum Account.options_level required to trade this option; 0 for equities", default: 0, constraints: "0 | 1 | 2 | 3" }
      - { name: extended_hours_eligible, type: boolean, source: input, description: "Whether extended-hours sessions accept orders for this security", default: true }

  # ---------------------------------------------------------------------------
  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the depositing account" }
      - { name: amount_cents, type: integer, source: input, description: "Deposit amount in cents; must be > 0" }
      - { name: instant_eligible, type: boolean, source: input, description: "Whether instant credit was requested", default: true }
      - { name: instant_credit_granted_cents, type: integer, source: computed, description: "Provisional credit granted now = min(amount, remaining INSTANT_CAP headroom)" }
      - { name: status, type: enum, source: computed, description: "PENDING -> SETTLED / REVERSED", default: "PENDING", constraints: "PENDING | SETTLED | REVERSED" }
      - { name: settles_on, type: datetime, source: computed, description: "Logical clock date + 1 business day (T+1) when funds fully clear" }

  # ---------------------------------------------------------------------------
  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the ordering account" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; the instrument being traded" }
      - { name: side, type: enum, source: input, description: "BUY | SELL", constraints: "BUY | SELL" }
      - { name: order_type, type: enum, source: input, description: "MARKET | LIMIT", constraints: "MARKET | LIMIT" }
      - { name: notional_cents, type: integer, source: input, description: "Dollar-based fractional order size in cents; mutually exclusive with quantity", default: 0 }
      - { name: quantity, type: number, source: input, description: "Share quantity (may be fractional); mutually exclusive with notional_cents", default: 0 }
      - { name: limit_price_cents, type: integer, source: input, description: "Limit price in cents; required when order_type=LIMIT", default: 0 }
      - { name: session, type: enum, source: input, description: "REGULAR | EXTENDED", default: "REGULAR", constraints: "REGULAR | EXTENDED" }
      - { name: is_closing, type: boolean, source: input, description: "Marks a SELL/closing order allowed even under RESTRICTED_CLOSING_ONLY", default: false }
      - { name: order_status, type: enum, source: computed, description: "Order-lifecycle dimension: PENDING_NEW -> ACCEPTED -> {FILLED, PARTIALLY_FILLED} / REJECTED / CANCELLED", default: "PENDING_NEW", constraints: "PENDING_NEW | ACCEPTED | PARTIALLY_FILLED | FILLED | REJECTED | CANCELLED" }
      - { name: filled_quantity, type: number, source: computed, description: "Cumulative filled share quantity across Fills", default: 0 }
      - { name: filled_notional_cents, type: integer, source: computed, description: "Cumulative gross filled value in cents across Fills", default: 0 }
      - { name: reserved_buying_power_cents, type: integer, source: computed, description: "Buying power held while a BUY order is live (ACCEPTED/PARTIALLY_FILLED); released on terminal", default: 0 }
      - { name: pfof_venue, type: enum, source: computed, description: "Payment-for-order-flow routing venue chosen by the selector: VENUE_A | VENUE_B | VENUE_C", constraints: "VENUE_A | VENUE_B | VENUE_C" }
      - { name: opened_day_trade, type: boolean, source: computed, description: "True if this order's fill paired with a same-symbol same-session open/close to count a day trade", default: false }

  # ---------------------------------------------------------------------------
  - name: Fill
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order this execution belongs to" }
      - { name: account_id, type: string, source: system, description: "Denormalized account id copied from the parent order (discover Fills via GET /orders/{id}/fills); not an independent FK" }
      - { name: fill_quantity, type: number, source: input, description: "Shares executed in this fill (may be fractional); > 0" }
      - { name: fill_price_cents, type: integer, source: input, description: "Execution price per share in cents" }
      - { name: gross_value_cents, type: integer, source: computed, description: "round_half_up(fill_quantity * fill_price_cents)" }
      - { name: pfof_rebate_cents, type: integer, source: computed, description: "Per-fill PFOF rebate = round_half_up(gross_value * venue_rebate_bps / 10000)" }
      - { name: settlement_id, type: string, source: computed, description: "Denormalized id of the Settlement leg created by this fill (inverse FK lives on Settlement.fill_id; discover via GET /settlements?fill_id=); not an independent FK" }

  # ---------------------------------------------------------------------------
  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account whose cash settles" }
      - { name: fill_id, type: string, source: input, description: "Denormalized id of the originating Fill leg (discover settlements via GET /accounts/{id}/settlements?fill_id=); not an independent FK" }
      - { name: direction, type: enum, source: computed, description: "DEBIT (BUY: cash leaves) | CREDIT (SELL: cash arrives)", constraints: "DEBIT | CREDIT" }
      - { name: amount_cents, type: integer, source: computed, description: "Absolute cash amount of this leg = Fill.gross_value_cents" }
      - { name: settles_on, type: datetime, source: computed, description: "Trade date + 1 business day (T+1)" }
      - { name: status, type: enum, source: computed, description: "UNSETTLED -> SETTLED / FAILED", default: "UNSETTLED", constraints: "UNSETTLED | SETTLED | FAILED" }

  # ---------------------------------------------------------------------------
  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; held instrument; unique per (account, security)" }
      - { name: quantity, type: number, source: computed, description: "Net open share quantity = sum of open Lot.remaining_quantity", default: 0 }
      - { name: average_cost_cents, type: integer, source: computed, description: "round_half_up(total_open_cost_basis / quantity); average-cost variant of basis", default: 0 }
      - { name: cost_basis_method, type: enum, source: input, description: "FIFO | AVERAGE — pinned at first open; governs which disposal variant applies", default: "FIFO", constraints: "FIFO | AVERAGE" }
      - { name: market_value_cents, type: integer, source: computed, description: "round_half_up(quantity * Security.last_price_cents)" }
      - { name: realized_pl_cents, type: integer, source: computed, description: "Cumulative realized gain/loss from disposals on this position", default: 0 }
      - { name: drip_enabled, type: boolean, source: input, description: "Whether cash dividends auto-reinvest (DRIP)", default: false }

  # ---------------------------------------------------------------------------
  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the position this tax lot belongs to" }
      - { name: acquired_at, type: datetime, source: computed, description: "Logical clock time the lot's opening fill executed; FIFO ordering key" }
      - { name: original_quantity, type: number, source: computed, description: "Shares acquired in this lot at open" }
      - { name: remaining_quantity, type: number, source: computed, description: "Shares still open in this lot; reduced by disposals", default: 0 }
      - { name: cost_per_share_cents, type: integer, source: computed, description: "round_half_up(opening Fill.gross_value / fill_quantity)" }
      - { name: status, type: enum, source: computed, description: "OPEN -> PARTIALLY_CLOSED -> CLOSED", default: "OPEN", constraints: "OPEN | PARTIALLY_CLOSED | CLOSED" }

  # ---------------------------------------------------------------------------
  - name: Disposal
    parent: null
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the position being reduced" }
      - { name: fill_id, type: string, source: input, description: "Denormalized id of the SELL Fill that drove this disposal (discover Disposals via GET /positions/{id}/disposals); not an independent FK" }
      - { name: lot_id, type: string, source: computed, description: "Denormalized id of the Lot consumed (FIFO); null for AVERAGE-method disposals; discover lots via GET /positions/{id}/lots; not an independent FK", default: null }
      - { name: quantity, type: number, source: computed, description: "Shares disposed against the consumed lot (FIFO) or the position (AVERAGE)" }
      - { name: proceeds_cents, type: integer, source: computed, description: "round_half_up(quantity * SELL fill_price_cents)" }
      - { name: cost_basis_cents, type: integer, source: computed, description: "FIFO: quantity * lot.cost_per_share; AVERAGE: round_half_up(quantity * position.average_cost)" }
      - { name: realized_pl_cents, type: integer, source: computed, description: "proceeds_cents - cost_basis_cents; flows to 1099-B" }
      - { name: term, type: enum, source: computed, description: "SHORT (held <= 365 days) | LONG (> 365 days) for 1099-B classification", constraints: "SHORT | LONG" }

  # ---------------------------------------------------------------------------
  - name: DividendEvent
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the receiving account" }
      - { name: position_id, type: string, source: input, description: "Denormalized id of the Position earning the dividend (account-scoped; discover via GET /accounts/{id}/dividends); not an independent FK" }
      - { name: rate_per_share_cents, type: integer, source: input, description: "Declared cash dividend per share in cents (may carry fractional precision)" }
      - { name: ex_date, type: datetime, source: input, description: "Ex-dividend date; opens the dividend's processing window [ex_date, ex_date + DIVIDEND_WINDOW_DAYS). No two non-terminal (ANNOUNCED/PAID) dividends for the same position may have overlapping windows" }
      - { name: window_end, type: datetime, source: computed, description: "ex_date + DIVIDEND_WINDOW_DAYS (closed-open window upper bound)" }
      - { name: record_quantity, type: number, source: computed, description: "Position.quantity snapshotted at announce time" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "round_half_up(record_quantity * rate_per_share_cents)" }
      - { name: reinvest_quantity, type: number, source: computed, description: "Shares purchased by DRIP = gross_amount / Security.last_price (truncated to 6 dp); 0 if DRIP off", default: 0 }
      - { name: residual_cash_cents, type: integer, source: computed, description: "Cash left after DRIP fractional buy; credited to settled_cash", default: 0 }
      - { name: status, type: enum, source: computed, description: "ANNOUNCED -> PAID -> {REINVESTED} / REVERSED", default: "ANNOUNCED", constraints: "ANNOUNCED | PAID | REINVESTED | REVERSED" }

  # ---------------------------------------------------------------------------
  - name: OptionsApproval
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the applicant account" }
      - { name: requested_level, type: integer, source: input, description: "Options level requested 1..3", constraints: "1 | 2 | 3" }
      - { name: stated_experience_years, type: integer, source: input, description: "Self-reported options experience in years; gates max grantable level" }
      - { name: liquid_net_worth_cents, type: integer, source: input, description: "Self-reported liquid net worth in cents; gates level 3" }
      - { name: granted_level, type: integer, source: computed, description: "Level actually granted on approval; <= requested_level", default: 0 }
      - { name: status, type: enum, source: computed, description: "SUBMITTED -> {APPROVED, DENIED} ; APPROVED can REVOKED", default: "SUBMITTED", constraints: "SUBMITTED | APPROVED | DENIED | REVOKED" }

  # ---------------------------------------------------------------------------
  - name: MarginCall
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account in deficiency" }
      - { name: deficiency_cents, type: integer, source: computed, description: "abs(maintenance_excess_cents) at issuance; the amount that must be cured" }
      - { name: cure_by, type: datetime, source: computed, description: "Logical clock date + MARGIN_CURE_DAYS business days deadline" }
      - { name: status, type: enum, source: computed, description: "ISSUED -> {MET, LIQUIDATED} ; reopens to ISSUED on re-breach", default: "ISSUED", constraints: "ISSUED | MET | LIQUIDATED" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  # ---- Account.trading_status (compound / posture-driven) -------------------
  - entity: Account
    field: trading_status
    initial_state: ACTIVE
    terminal_states: []
    note: |
      Compound derived posture, recomputed after every event that changes equity,
      maintenance, PDT count, or compliance_hold. Priority (first match wins):
        1) FROZEN          if compliance_hold == true
        2) MARGIN_CALL     if an open MarginCall (status=ISSUED) exists for the account
        3) RESTRICTED_CLOSING_ONLY  if pdt_flagged == true OR maintenance_excess_cents < 0
        4) ACTIVE          otherwise
    transitions:
      - from: ACTIVE
        to: RESTRICTED_CLOSING_ONLY
        trigger: "system: recompute after a fill or quote pushes maintenance_excess_cents < 0, or PDT flag set"
        actor: system
        preconditions: ["compliance_hold == false", "no ISSUED MarginCall yet"]
        side_effects:
          - "Opening BUY orders rejected with ERR_RESTRICTED_CLOSING_ONLY; only is_closing SELL orders accepted"
      - from: ACTIVE
        to: MARGIN_CALL
        trigger: "POST /accounts/{id}/margin-calls (ClearingSystem issues a call)"
        actor: ClearingSystem
        preconditions: ["maintenance_excess_cents < 0", "compliance_hold == false"]
        side_effects:
          - "Creates MarginCall(status=ISSUED, deficiency=abs(maintenance_excess))"
          - "All opening BUY orders blocked; closing SELLs allowed"
      - from: RESTRICTED_CLOSING_ONLY
        to: MARGIN_CALL
        trigger: "POST /accounts/{id}/margin-calls"
        actor: ClearingSystem
        preconditions: ["maintenance_excess_cents < 0", "compliance_hold == false"]
        side_effects: ["Creates MarginCall(status=ISSUED)"]
      - from: MARGIN_CALL
        to: ACTIVE
        trigger: "system: MarginCall met (deposit or closing sells restore maintenance_excess >= 0)"
        actor: system
        preconditions: ["no other ISSUED MarginCall", "pdt_flagged == false", "compliance_hold == false"]
        side_effects: ["MarginCall.status -> MET", "Opening BUYs re-enabled"]
      - from: RESTRICTED_CLOSING_ONLY
        to: ACTIVE
        trigger: "system: maintenance_excess restored to >= 0 AND pdt_flagged cleared"
        actor: system
        preconditions: ["maintenance_excess_cents >= 0", "pdt_flagged == false", "compliance_hold == false"]
        side_effects: ["Opening BUYs re-enabled"]
      - from: ACTIVE
        to: FROZEN
        trigger: "PATCH /accounts/{id}/compliance-hold (set true)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["All order placement blocked with ERR_ACCOUNT_FROZEN", "increments Account.version by 1"]
      - from: RESTRICTED_CLOSING_ONLY
        to: FROZEN
        trigger: "PATCH /accounts/{id}/compliance-hold (set true)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["All order placement blocked", "increments Account.version by 1"]
      - from: MARGIN_CALL
        to: FROZEN
        trigger: "PATCH /accounts/{id}/compliance-hold (set true)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["All order placement blocked", "increments Account.version by 1"]
      - from: FROZEN
        to: ACTIVE
        trigger: "PATCH /accounts/{id}/compliance-hold (set false)"
        actor: ComplianceOfficer
        preconditions: ["no ISSUED MarginCall", "pdt_flagged == false", "maintenance_excess_cents >= 0"]
        side_effects: ["Order placement re-enabled", "increments Account.version by 1"]
      - from: FROZEN
        to: RESTRICTED_CLOSING_ONLY
        trigger: "PATCH /accounts/{id}/compliance-hold (set false)"
        actor: ComplianceOfficer
        preconditions: ["pdt_flagged == true OR maintenance_excess_cents < 0", "no ISSUED MarginCall"]
        side_effects: ["Closing SELLs re-enabled; opening BUYs still blocked"]

  # ---- Order.order_status (parallel dimension 1 of 2 on Order) --------------
  - entity: Order
    field: order_status
    initial_state: PENDING_NEW
    terminal_states: [FILLED, REJECTED, CANCELLED]
    note: |
      order_status evolves independently of the settlement leg (the Settlement
      entity carries the T+1 dimension). An order may be FILLED while its
      Settlement is still UNSETTLED.
    transitions:
      - from: PENDING_NEW
        to: ACCEPTED
        trigger: "POST /orders (validation + routing passes)"
        actor: AccountHolder
        preconditions:
          - "Account.trading_status not FROZEN (ERR_ACCOUNT_FROZEN)"
          - "If opening BUY: trading_status == ACTIVE (ERR_RESTRICTED_CLOSING_ONLY otherwise)"
          - "Security tradable: if OPTION, Account.options_level >= Security.required_options_level (ERR_OPTIONS_LEVEL_INSUFFICIENT)"
          - "If order_type==LIMIT: limit_price_cents > 0 (ERR_LIMIT_PRICE_REQUIRED)"
          - "If fractional notional: Security.fractional_enabled (ERR_FRACTIONAL_NOT_ALLOWED) AND order_type==MARKET AND session==REGULAR (ERR_FRACTIONAL_ORDER_CONSTRAINT)"
          - "If session==EXTENDED: Security.extended_hours_eligible AND order_type==LIMIT (ERR_EXTENDED_HOURS_LIMIT_ONLY)"
          - "BUY buying-power check: required_cents <= Account.buying_power_cents (ERR_INSUFFICIENT_BUYING_POWER)"
          - "SELL quantity check: requested shares <= Position.quantity (ERR_INSUFFICIENT_SHARES)"
        side_effects:
          - "pfof_venue selected by routing calc"
          - "BUY: reserved_buying_power_cents = required_cents; Account.buying_power_cents decreases by that amount (reservation)"
      - from: ACCEPTED
        to: PARTIALLY_FILLED
        trigger: "POST /orders/{id}/fills (ClearingSystem reports a partial execution)"
        actor: ClearingSystem
        preconditions: ["order not terminal — fills on FILLED/REJECTED/CANCELLED rejected (ERR_CANNOT_FILL_TERMINAL)", "cumulative fill_quantity < order target quantity"]
        side_effects:
          - "Create Fill; filled_quantity += fill_quantity; filled_notional_cents += gross_value"
          - "BUY: open/extend Lot on Position (cascade: Lot -> Position.quantity/average_cost recompute)"
          - "SELL: create Disposal(s) consuming Lot(s) (cascade: Lot.remaining -> Position.quantity/realized_pl recompute)"
          - "Create Settlement(status=UNSETTLED, settles_on=T+1)"
          - "Recompute Account equity/maintenance/buying_power; possibly flip trading_status"
      - from: ACCEPTED
        to: FILLED
        trigger: "POST /orders/{id}/fills (execution completes the order)"
        actor: ClearingSystem
        preconditions: ["cumulative fill_quantity reaches order target quantity (full fill)"]
        side_effects:
          - "Same cascade as PARTIALLY_FILLED, plus:"
          - "BUY: release leftover reserved_buying_power_cents (reservation minus actual fills)"
          - "Day-trade detection: if a same-symbol opposite-side fill occurred same session today, increment day_trade_count (cascade -> pdt_flagged -> trading_status)"
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "POST /orders/{id}/fills (final partial completes the order)"
        actor: ClearingSystem
        preconditions: ["cumulative fill_quantity reaches order target quantity"]
        side_effects: ["Same as ACCEPTED->FILLED cascade and reservation release"]
      - from: PENDING_NEW
        to: REJECTED
        trigger: "POST /orders (a validation precondition fails)"
        actor: system
        preconditions: ["any ACCEPTED precondition fails"]
        side_effects: ["No reservation; no Position change"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: AccountHolder
        preconditions: ["order not terminal"]
        side_effects: ["Release reserved_buying_power_cents (cascade: Account.buying_power_cents restored)"]
      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: AccountHolder
        preconditions: ["order not terminal"]
        side_effects: ["Release remaining reserved_buying_power_cents for the unfilled portion"]

  # ---- Settlement.status (parallel dimension 2 — T+1 leg) -------------------
  - entity: Settlement
    field: status
    initial_state: UNSETTLED
    terminal_states: [SETTLED, FAILED]
    transitions:
      - from: UNSETTLED
        to: SETTLED
        trigger: "POST /_clock/advance (clock crosses settles_on) — ClearingSystem sweep"
        actor: ClearingSystem
        preconditions: ["logical clock date >= settles_on (a leg whose settles_on is still in the future is left UNSETTLED; an explicit settle of a not-yet-due leg would be ERR_SETTLEMENT_NOT_DUE)"]
        side_effects:
          - "DEBIT leg: settled_cash_cents -= amount; unsettled_cash_cents += amount (was negative reserve)"
          - "CREDIT leg: settled_cash_cents += amount; unsettled_cash_cents -= amount"
          - "Recompute buying_power_cents"
      - from: UNSETTLED
        to: FAILED
        trigger: "POST /settlements/{id}/fail (ClearingSystem rejects the leg)"
        actor: ClearingSystem
        preconditions: ["leg still UNSETTLED"]
        side_effects: ["Reverse the provisional cash/position effects of the originating Fill (compensation)"]

  # ---- Deposit.status (linear with instant-credit reconciliation) -----------
  - entity: Deposit
    field: status
    initial_state: PENDING
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /_clock/advance (clock crosses settles_on)"
        actor: ClearingSystem
        preconditions: ["logical clock date >= settles_on"]
        side_effects:
          - "settled_cash_cents += amount_cents"
          - "instant_credit_cents -= instant_credit_granted_cents (provisional credit retired, real cash now settled)"
          - "Recompute buying_power_cents (net zero change in CASH buying power on settle)"
      - from: PENDING
        to: REVERSED
        trigger: "POST /deposits/{id}/reverse (ClearingSystem: ACH return)"
        actor: ClearingSystem
        preconditions: ["deposit still PENDING"]
        side_effects:
          - "instant_credit_cents -= instant_credit_granted_cents (claw back provisional credit)"
          - "Recompute buying_power_cents; may push it negative -> may trigger margin/restriction recompute"

  # ---- DividendEvent.status (branching reinvest loop) -----------------------
  - entity: DividendEvent
    field: status
    initial_state: ANNOUNCED
    terminal_states: [REINVESTED, REVERSED]
    transitions:
      - from: ANNOUNCED
        to: PAID
        trigger: "POST /dividends/{id}/pay (ClearingSystem pays the cash dividend)"
        actor: ClearingSystem
        preconditions: ["DividendEvent status == ANNOUNCED (pay/reinvest/reverse on a wrong-status dividend -> ERR_DIVIDEND_NOT_PAYABLE)", "record_quantity > 0"]
        side_effects:
          - "settled_cash_cents += gross_amount_cents"
          - "Recompute buying_power_cents"
      - from: PAID
        to: REINVESTED
        trigger: "POST /dividends/{id}/reinvest (DRIP buy)"
        actor: ClearingSystem
        preconditions: ["Position.drip_enabled == true", "reinvest_quantity > 0 (ERR_DRIP_NOT_ENABLED / ERR_DRIP_BELOW_MINIMUM)"]
        side_effects:
          - "settled_cash_cents -= (gross_amount_cents - residual_cash_cents)"
          - "Open new Lot for reinvest_quantity (cascade: Position.quantity/average_cost recompute)"
          - "residual_cash_cents remains in settled_cash"
      - from: PAID
        to: REVERSED
        trigger: "POST /dividends/{id}/reverse (correction)"
        actor: ClearingSystem
        preconditions: ["status == PAID (not yet REINVESTED)"]
        side_effects: ["settled_cash_cents -= gross_amount_cents (compensation: undo the pay credit)"]

  # ---- OptionsApproval.status (branching approve/deny + revoke) -------------
  - entity: OptionsApproval
    field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /options-approvals/{id}/decide (decision=APPROVE)"
        actor: ComplianceOfficer
        preconditions: ["granted_level computed by suitability calc > 0 (else DENIED)"]
        side_effects: ["Account.options_level = max(current, granted_level) (cascade -> option order eligibility)"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /options-approvals/{id}/decide (decision=APPROVE but suitability grants 0, or decision=DENY)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Account.options_level unchanged"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /options-approvals/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Account.options_level reset to highest still-APPROVED level for the account (0 if none)"]

  # ---- MarginCall.status (branching revert / reopen cycle) ------------------
  - entity: MarginCall
    field: status
    initial_state: ISSUED
    terminal_states: [MET, LIQUIDATED]
    transitions:
      - from: ISSUED
        to: MET
        trigger: "system: maintenance_excess_cents >= 0 after a deposit/settle or closing SELL fill"
        actor: system
        preconditions: ["maintenance_excess_cents >= 0"]
        side_effects: ["trading_status recomputes (may return to ACTIVE)"]
      - from: ISSUED
        to: LIQUIDATED
        trigger: "POST /accounts/{id}/margin-calls/{call_id}/liquidate (clock past cure_by, deficiency remains)"
        actor: ClearingSystem
        preconditions: ["logical clock date > cure_by AND maintenance_excess_cents < 0 (liquidating before cure_by, or when excess already >= 0, -> ERR_MARGIN_CALL_NOT_DUE)"]
        side_effects:
          - "Force-create closing SELL Fills until maintenance_excess >= 0 (cascade: Disposals, Position, realized_pl, settled_cash)"
          - "trading_status recomputes"

  # ---- Lot.status (linear consume) ------------------------------------------
  - entity: Lot
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PARTIALLY_CLOSED
        trigger: "system: a Disposal consumes part of this lot"
        actor: system
        preconditions: ["disposal quantity < remaining_quantity"]
        side_effects: ["remaining_quantity decreases"]
      - from: OPEN
        to: CLOSED
        trigger: "system: a Disposal consumes the whole lot"
        actor: system
        preconditions: ["disposal quantity == remaining_quantity"]
        side_effects: ["remaining_quantity -> 0"]
      - from: PARTIALLY_CLOSED
        to: CLOSED
        trigger: "system: a later Disposal exhausts the lot"
        actor: system
        preconditions: ["disposal quantity == remaining_quantity"]
        side_effects: ["remaining_quantity -> 0"]

# =============================================================================
# Table 2.1: Concurrency Rules (§1.2.1) — OCC on Account.version
# =============================================================================
concurrency_rules:
  - rule_id: order-place-stale-account
    parent_entity: Account
    write_endpoint: "POST /orders"
    occ_field: "expected_account_version"
    description: |
      Placing an Order against an Account whose version has advanced since the
      client last observed it is rejected. A buying-power-consuming write (a new
      BUY order legitimately reserves buying power and bumps the account version)
      may have landed between the client's read of the account and this order, so
      the client's view of buying_power_cents is stale; the order is refused on a
      version mismatch rather than reserving against an out-of-date balance.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: options-decide-stale-account
    parent_entity: Account
    write_endpoint: "POST /options-approvals/{id}/decide"
    occ_field: "expected_account_version"
    description: |
      Deciding an OptionsApproval against an Account whose version has advanced
      since the officer last observed it is rejected. Another approval may have
      already raised options_level (bumping the account version); the officer's
      decision is refused on a version mismatch so two approvals cannot both grant
      against the same stale account snapshot.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  # ----- Dual-variant calc #1: cost basis on disposal (DIFFERENT entity: Position/Lot)
  - name: cost_basis_disposal
    trigger: "Order ACCEPTED->FILLED / ->PARTIALLY_FILLED on a SELL: each Disposal computes realized P/L"
    algorithm: chronological
    formula: |
      proceeds_cents = round_half_up(disposed_qty * sell_fill_price_cents)
      FIFO variant:
        consume open Lots in ascending (acquired_at, created_at) order;
        for each consumed slice s of quantity q from lot L:
          cost_basis_s = round_half_up(q * L.cost_per_share_cents)
        cost_basis_cents = sum of cost_basis_s across consumed slices
      AVERAGE variant:
        cost_basis_cents = round_half_up(disposed_qty * position.average_cost_cents)
      realized_pl_cents = proceeds_cents - cost_basis_cents
      term = SHORT if (clock_now - lot.acquired_at) <= 365 days else LONG (FIFO);
             AVERAGE uses the earliest contributing lot's acquired_at for term.
    input_set: "Only OPEN/PARTIALLY_CLOSED Lots of the Position; CLOSED lots excluded"
    constants:
      LONG_TERM_DAYS: 365
    precision: "cents, round_half_up"
    variants:
      - name: fifo
        when: "Position.cost_basis_method == FIFO"
        difference: "Consumes specific lots oldest-first; cost_basis is the sum of per-lot slice bases; lot_id recorded on Disposal"
      - name: average
        when: "Position.cost_basis_method == AVERAGE"
        difference: "Uses the position-wide average_cost_cents; lot_id null; basis = round_half_up(qty * average_cost)"

  # ----- Dual-variant calc #2: buying power (DIFFERENT entity: Account)
  - name: buying_power
    trigger: "Recompute after deposit, settlement, fill, dividend, reversal, quote update, order reservation/release"
    algorithm: aggregation
    formula: |
      CASH account variant:
        buying_power_cents = settled_cash_cents + instant_credit_cents
                             - sum(reserved_buying_power_cents over live BUY orders)
      MARGIN account variant:
        equity = account_equity_cents
        buying_power_cents = max(0, 2 * (equity - maintenance_requirement_cents))
                             - sum(reserved_buying_power_cents over live BUY orders)
      Live BUY order = order_status in {ACCEPTED, PARTIALLY_FILLED}.
    input_set: "settled_cash + instant_credit (CASH) or equity+maintenance (MARGIN); live BUY reservations subtracted"
    constants:
      MARGIN_MULTIPLIER: 2
    precision: "cents, integer"
    variants:
      - name: cash_settled
        when: "Account.account_type == CASH"
        difference: "Strictly settled_cash + instant_credit; unsettled cash NOT spendable (good-faith violation if spent)"
      - name: margin_leverage
        when: "Account.account_type == MARGIN"
        difference: "2x maintenance excess; uses full equity including unsettled, leverage multiplier applies"

  # ----- Instant-deposit provisional credit (threshold on a cumulative cap) ---
  - name: instant_credit
    trigger: "POST /accounts/{id}/deposits with instant_eligible=true"
    algorithm: threshold
    formula: |
      outstanding = sum(instant_credit_granted_cents over the account's PENDING deposits)
      headroom = INSTANT_CAP_CENTS - outstanding
      requested = amount_cents (when instant_eligible) else 0
      if requested > headroom: reject ERR_INSTANT_LIMIT_EXCEEDED
      else instant_credit_granted_cents = requested; Account.instant_credit_cents += requested
      Boundary: requested == headroom is ALLOWED (<=); requested == headroom + 1 is rejected.
    input_set: "Account's PENDING (not yet SETTLED/REVERSED) deposits' granted credit"
    constants:
      INSTANT_CAP_CENTS: 10000000     # $100,000.00 cumulative provisional-credit ceiling
    precision: "cents, integer"

  # ----- Combinatorial mode (a): nonlinear multi-input — options suitability
  - name: options_suitability
    trigger: "OptionsApproval decide(APPROVE)"
    algorithm: threshold
    formula: |
      base_cap =
        3 if (stated_experience_years >= 3 AND liquid_net_worth_cents >= 10000000)
        else 2 if stated_experience_years >= 2
        else 1 if stated_experience_years >= 1
        else 0
      granted_level = min(requested_level, base_cap)
      # >=3 inputs (experience, net worth, requested) with nested conditional branches:
      # net-worth gate only matters at the level-3 boundary.
    input_set: "OptionsApproval fields only"
    constants:
      L3_MIN_NET_WORTH_CENTS: 10000000     # $100,000
      L3_MIN_EXPERIENCE_YEARS: 3
      L2_MIN_EXPERIENCE_YEARS: 2
      L1_MIN_EXPERIENCE_YEARS: 1
    precision: "integer level"

  # ----- Combinatorial mode (b): order-dependent rounding — DRIP reinvest
  - name: drip_reinvest
    trigger: "DividendEvent PAID->REINVESTED"
    algorithm: aggregation
    formula: |
      gross_amount_cents = round_half_up(record_quantity * rate_per_share_cents)   # round PER EVENT, once
      reinvest_quantity  = truncate_to_6dp(gross_amount_cents / last_price_cents)  # fractional shares, truncated (never round up)
      spent_cents        = round_half_up(reinvest_quantity * last_price_cents)
      residual_cash_cents = gross_amount_cents - spent_cents
      # Rounding ORDER is pinned: (1) round the gross dividend first, (2) truncate the
      # share quantity, (3) round the spend. "Truncate-then-round-spend" vs
      # "round-shares-then-multiply" give different residual cents; this scaffold pins
      # truncate-shares-first so residual is always >= 0.
    input_set: "Single DividendEvent + its Position's Security.last_price_cents"
    constants:
      SHARE_PRECISION_DP: 6
    precision: "shares truncated to 6 dp; cents round_half_up"

  # ----- Combinatorial mode (c): circular-looking eval order — order cost with PFOF rebate
  - name: order_required_cash
    trigger: "Order placement (BUY) reservation and fill settlement"
    algorithm: aggregation
    formula: |
      # required_cents drives the buying-power reservation, but the venue rebate is
      # keyed off the gross trade value which itself derives from required_cents.
      # Evaluation order is pinned to break the apparent circularity:
      #   1) required_gross_cents = notional_cents (notional order) OR
      #      round_half_up(quantity * ref_price_cents) (quantity order),
      #      where ref_price = limit_price_cents for LIMIT, else Security.last_price_cents
      #   2) pfof_venue = routing selector over required_gross_cents (see pfof_routing)
      #   3) reserved_buying_power_cents = required_gross_cents  (rebate does NOT reduce reservation)
      #   4) on each Fill: pfof_rebate_cents = round_half_up(gross_value_cents * venue_rebate_bps / 10000),
      #      credited to settled_cash on settlement (rebate is post-hoc, never pre-netted)
      # The pinned order ensures the reservation is computed BEFORE any rebate so the
      # buying-power check never double-counts the rebate.
    input_set: "Single Order + its Security + chosen venue rebate bps"
    constants:
      VENUE_A_REBATE_BPS: 30
      VENUE_B_REBATE_BPS: 20
      VENUE_C_REBATE_BPS: 10
    precision: "cents, round_half_up"

  # ----- PFOF routing selector (deterministic, no random id) -----------------
  - name: pfof_routing
    trigger: "Order ACCEPTED — choose execution venue"
    algorithm: weighted_scoring
    formula: |
      Candidate venues = {VENUE_A, VENUE_B, VENUE_C}, all eligible for EQUITY.
      For OPTION instruments only VENUE_A and VENUE_B are eligible.
      score(venue) = venue_rebate_bps  (higher rebate ranks first)
      Choose the eligible venue with the highest score.
      Tie-break: lexicographic venue name ascending (VENUE_A < VENUE_B < VENUE_C).
      Empty eligible set is impossible (VENUE_A always eligible) -> no fallback needed.
    input_set: "Security.instrument_type determines eligible venue set"
    constants:
      VENUE_A_REBATE_BPS: 30
      VENUE_B_REBATE_BPS: 20
      VENUE_C_REBATE_BPS: 10
    precision: "integer bps; deterministic selection"

  # ----- PDT day-trade detection (threshold, rolling window) -----------------
  - name: pdt_day_trade
    trigger: "Order fill completes — detect day trade and update PDT flag"
    algorithm: threshold
    formula: |
      A day trade = a BUY-to-open and SELL-to-close (or short open+cover) of the SAME
      security within the SAME logical-clock calendar date.
      On a closing fill, if an opening fill of the same security exists with the same
      logical-clock date, increment day_trade_count and set this order's opened_day_trade=true.
      window = trailing 5 business days from current clock date (inclusive).
      day_trade_count = count of day trades whose detection date is within window.
      pdt_flagged = (day_trade_count >= PDT_THRESHOLD) AND (account_equity_cents < PDT_MIN_EQUITY_CENTS).
      Boundary: exactly 4 day trades flags; exactly $25,000.00 equity does NOT flag (>= clears).
    input_set: "Fills of the account within the trailing-5-business-day window"
    constants:
      PDT_THRESHOLD: 4
      PDT_MIN_EQUITY_CENTS: 2500000     # $25,000.00
      WINDOW_BUSINESS_DAYS: 5
    precision: "integer count"

  # ----- Maintenance / margin excess (aggregation + threshold) ---------------
  - name: maintenance_excess
    trigger: "Recompute after fill, quote update, deposit, settlement, dividend, liquidation"
    algorithm: aggregation
    formula: |
      account_equity_cents = settled_cash_cents + unsettled_cash_cents
                             + sum over Positions of market_value_cents
      maintenance_requirement_cents =
        sum over Positions of round_half_up(market_value_cents * Security.maintenance_rate_bps / 10000)
      maintenance_excess_cents = account_equity_cents - maintenance_requirement_cents
      Issue/keep MarginCall while maintenance_excess_cents < 0.
      market_value_cents per position = round_half_up(quantity * Security.last_price_cents).
    input_set: "All Positions with quantity > 0; CASH accounts have maintenance_rate effectively but only MARGIN can go on call"
    constants: {}
    precision: "cents, round_half_up"

  # ----- Temporal-window overlap detection (two distinct interval semantics) --
  - name: window_overlap
    trigger: "POST /dividends (dividend window) and POST /accounts/{id}/margin-calls (cure window)"
    algorithm: interval_merge
    formula: |
      Dividend window (closed-open [ex_date, window_end)):
        window_end = ex_date + DIVIDEND_WINDOW_DAYS calendar days.
        Overlap with an existing non-terminal (ANNOUNCED/PAID) dividend D' for the SAME position iff
          ex_date < D'.window_end AND D'.ex_date < window_end   (half-open: touching endpoints do NOT overlap).
        Any overlap -> ERR_DIVIDEND_WINDOW_OVERLAP.
      Margin-call cure window (closed [issued_at, cure_by], single-occupancy capacity 1):
        A new margin call collides iff ANY MarginCall with status==ISSUED exists for the account
        whose [created_at, cure_by] still contains the current clock (cure_by >= clock).
        Aggregate capacity is 1: a second ISSUED call may never coexist -> ERR_MARGIN_CALL_ACTIVE.
      The two rules differ in interval arithmetic: the dividend rule is pairwise half-open overlap on
      Position windows (touching allowed); the margin rule is single-slot occupancy on Account windows
      using a CLOSED upper bound (cure_by inclusive).
    input_set: "Non-terminal DividendEvents per position; ISSUED MarginCalls per account"
    constants:
      DIVIDEND_WINDOW_DAYS: 30
      MARGIN_CURE_DAYS: 4
    precision: "calendar-day boundaries; half-open for dividends, closed-upper for margin"

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — ordered by priority
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; AccountHolder must own the target account (X-User-ID == Account.id or Account.id on the resource)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids exist (Account, Security, Order, Fill, Position, etc.), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts > 0; notional XOR quantity on order"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH"

  - priority: 5
    category: business_referential
    check: "OCC: expected_account_version (when supplied/required) matches Account.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /orders, POST /options-approvals/{id}/decide"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the transition (order not terminal, settlement UNSETTLED, dividend ANNOUNCED/PAID, approval SUBMITTED/APPROVED, lot OPEN, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Account.trading_status FROZEN blocks ALL order placement"
    error_id: ERR_ACCOUNT_FROZEN
    http_status: 409
    applies_to: "POST /orders"

  - priority: 8
    category: business_safety
    check: "RESTRICTED_CLOSING_ONLY / MARGIN_CALL: opening BUY orders blocked; only is_closing SELL accepted"
    error_id: ERR_RESTRICTED_CLOSING_ONLY
    http_status: 409
    applies_to: "POST /orders"

  - priority: 9
    category: business_safety
    check: "OPTION security requires Account.options_level >= Security.required_options_level"
    error_id: ERR_OPTIONS_LEVEL_INSUFFICIENT
    http_status: 409
    applies_to: "POST /orders"

  - priority: 10
    category: business_constraint
    check: "LIMIT order requires limit_price_cents > 0"
    error_id: ERR_LIMIT_PRICE_REQUIRED
    http_status: 422
    applies_to: "POST /orders"

  - priority: 11
    category: business_constraint
    check: "Notional (dollar fractional) order on a security with fractional_enabled=false is rejected"
    error_id: ERR_FRACTIONAL_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /orders"

  - priority: 12
    category: business_constraint
    check: "Fractional (notional) order must be order_type==MARKET AND session==REGULAR"
    error_id: ERR_FRACTIONAL_ORDER_CONSTRAINT
    http_status: 422
    applies_to: "POST /orders"

  - priority: 13
    category: business_constraint
    check: "EXTENDED session requires Security.extended_hours_eligible AND order_type==LIMIT"
    error_id: ERR_EXTENDED_HOURS_LIMIT_ONLY
    http_status: 422
    applies_to: "POST /orders"

  - priority: 14
    category: business_constraint
    check: "SELL order quantity must not exceed Position.quantity available"
    error_id: ERR_INSUFFICIENT_SHARES
    http_status: 409
    applies_to: "POST /orders"

  - priority: 15
    category: business_fiscal
    check: "BUY order required_cents must not exceed Account.buying_power_cents"
    error_id: ERR_INSUFFICIENT_BUYING_POWER
    http_status: 402
    applies_to: "POST /orders"

  - priority: 16
    category: business_temporal
    check: "Announcing a dividend whose [ex_date, window_end) overlaps a non-terminal (ANNOUNCED/PAID) dividend window for the same position is rejected (closed-open interval overlap on the Position dividend window)"
    error_id: ERR_DIVIDEND_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /dividends"

  - priority: 17
    category: business_fiscal
    check: "Instant deposit credit cannot exceed remaining INSTANT_CAP headroom"
    error_id: ERR_INSTANT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /accounts/{id}/deposits"

  - priority: 18
    category: business_temporal
    check: "Issuing a margin call while an ISSUED MarginCall's [issued, cure_by] window is still open on the account is rejected (single-occupancy cure window, capacity 1)"
    error_id: ERR_MARGIN_CALL_ACTIVE
    http_status: 409
    applies_to: "POST /accounts/{id}/margin-calls"

# =============================================================================
# Table 5: API Endpoint Table (§1.5) — 34 endpoints
# Reverse-reachability strategy: filtered-list GETs anchored by each child's
# single-resource GET segment (Order, Position); Account-scoped sub-resources
# for leaf children (Deposit, Settlement, Dividend, OptionsApproval, MarginCall);
# Order/Position sub-resources for Fill, Lot, Disposal.
# =============================================================================
endpoints:
  # ---- Account ----
  - method: POST
    path: "/accounts"
    description: "Open a brokerage account"
    roles: [AccountHolder, ComplianceOfficer]
    code: 201
    input: [holder_email, "account_type?"]
    output: Account
    side_effects: ["trading_status=ACTIVE; cash/equity/buying_power initialized to 0; options_level=0"]

  - method: GET
    path: "/accounts/{id}"
    description: "Get an account (computed equity/buying_power/maintenance)"
    roles: [AccountHolder, ComplianceOfficer, ClearingSystem]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: PATCH
    path: "/accounts/{id}/compliance-hold"
    description: "Set/clear the compliance FROZEN override"
    roles: [ComplianceOfficer]
    code: 200
    input: [compliance_hold]
    output: Account
    side_effects: ["trading_status recomputes (FROZEN when true); increments Account.version by 1"]

  # ---- Deposit ----
  - method: POST
    path: "/accounts/{id}/deposits"
    description: "Instant deposit with optional provisional credit"
    roles: [AccountHolder]
    code: 201
    input: [amount_cents, "instant_eligible?"]
    output: Deposit
    side_effects:
      - "instant_credit_granted_cents = min(amount, INSTANT_CAP headroom); instant_credit_cents += that"
      - "settles_on = clock date + 1 business day; status=PENDING"
      - "Recompute Account.buying_power_cents; increments Account.version by 1"

  - method: GET
    path: "/accounts/{id}/deposits"
    description: "List deposits for an account; reverse-reachability for Deposit.account_id"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Deposit[]
    side_effects: []

  - method: POST
    path: "/deposits/{id}/reverse"
    description: "ACH return: reverse a pending deposit"
    roles: [ClearingSystem]
    code: 200
    input: []
    output: Deposit
    side_effects: ["status -> REVERSED; claw back instant_credit; recompute buying_power; increments Account.version by 1"]

  # ---- Security ----
  - method: POST
    path: "/securities"
    description: "Register a tradable instrument"
    roles: [ClearingSystem, ComplianceOfficer]
    code: 201
    input: [symbol, instrument_type, last_price_cents, "fractional_enabled?", "maintenance_rate_bps?", "required_options_level?", "extended_hours_eligible?"]
    output: Security
    side_effects: []

  - method: PATCH
    path: "/securities/{id}/quote"
    description: "Push a new last_price_cents (market data); recomputes affected accounts' equity/maintenance"
    roles: [MarketData, ClearingSystem]
    code: 200
    input: [last_price_cents]
    output: Security
    side_effects: ["For every Position on this security: market_value recompute -> Account equity/maintenance/buying_power -> trading_status recompute"]

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Place a market/limit, regular/extended, dollar-fractional or share-quantity order"
    roles: [AccountHolder]
    code: 201
    input: [account_id, security_id, side, order_type, expected_account_version, "notional_cents?", "quantity?", "limit_price_cents?", "session?", "is_closing?"]
    output: Order
    side_effects:
      - "OCC check on expected_account_version (ERR_STALE_ACCOUNT_VERSION)"
      - "Validates and either ACCEPTED (reserve buying power, pick pfof_venue) or REJECTED"
      - "BUY: reserved_buying_power_cents set; Account.buying_power_cents decreases; increments Account.version by 1"

  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders; reverse-reachability for Order.account_id and Order.security_id"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: ["account_id?", "security_id?", "order_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a non-terminal order"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Order
    side_effects: ["order_status -> CANCELLED; release reserved buying power; increments Account.version by 1"]

  - method: POST
    path: "/orders/{id}/fills"
    description: "Report an execution (partial or full) against an order"
    roles: [ClearingSystem]
    code: 201
    input: [fill_quantity, fill_price_cents]
    output: Fill
    side_effects:
      - "order_status advances (ACCEPTED->PARTIALLY_FILLED/FILLED); filled_quantity/notional update"
      - "BUY: open/extend Lot; SELL: create Disposal(s) consuming Lots (cost_basis calc)"
      - "Create Settlement (UNSETTLED, T+1); compute pfof_rebate"
      - "Day-trade detection; recompute equity/maintenance/buying_power/trading_status; increments Account.version by 1"

  - method: GET
    path: "/orders/{id}/fills"
    description: "List fills for an order; reverse-reachability for Fill.order_id"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Fill[]
    side_effects: []

  # ---- Settlement ----
  - method: GET
    path: "/accounts/{id}/settlements"
    description: "List settlement legs for an account; reverse-reachability for Settlement.account_id"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: ["fill_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/settlements/{id}/fail"
    description: "Fail an unsettled leg (reversal/compensation)"
    roles: [ClearingSystem]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> FAILED; reverse provisional cash/position effects of the originating Fill; increments Account.version by 1"]

  # ---- Position / Lot / Disposal ----
  - method: GET
    path: "/positions/{id}"
    description: "Get a position (computed quantity/avg cost/market value/realized P/L)"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: []
    output: Position
    side_effects: []

  - method: GET
    path: "/positions"
    description: "List positions; reverse-reachability for Position.account_id and Position.security_id"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: ["account_id?", "security_id?", "limit?", "offset?"]
    output: Position[]
    side_effects: []

  - method: PATCH
    path: "/positions/{id}/drip"
    description: "Enable/disable DRIP for a position"
    roles: [AccountHolder]
    code: 200
    input: [drip_enabled]
    output: Position
    side_effects: ["Position.drip_enabled set; increments Position.version by 1"]

  - method: GET
    path: "/positions/{id}/lots"
    description: "List tax lots for a position; reverse-reachability for Lot.position_id"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: GET
    path: "/positions/{id}/disposals"
    description: "List realized disposals (1099-B detail) for a position; reverse-reachability for Disposal.position_id"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: ["term?", "limit?", "offset?"]
    output: Disposal[]
    side_effects: []

  # ---- Dividend / DRIP ----
  - method: POST
    path: "/dividends"
    description: "Announce a cash dividend for a position (snapshots record_quantity). Rejects if the ex_date window overlaps an existing non-terminal dividend for the same position."
    roles: [ClearingSystem]
    code: 201
    input: [account_id, position_id, rate_per_share_cents, ex_date]
    output: DividendEvent
    side_effects:
      - "record_quantity snapshot; gross_amount computed; status=ANNOUNCED"
      - "window_end = ex_date + DIVIDEND_WINDOW_DAYS; overlap check against ANNOUNCED/PAID dividends of the same position (ERR_DIVIDEND_WINDOW_OVERLAP)"

  - method: GET
    path: "/accounts/{id}/dividends"
    description: "List dividend events for an account; reverse-reachability for DividendEvent.account_id"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DividendEvent[]
    side_effects: []

  - method: POST
    path: "/dividends/{id}/pay"
    description: "Pay the announced cash dividend"
    roles: [ClearingSystem]
    code: 200
    input: []
    output: DividendEvent
    side_effects: ["status -> PAID; settled_cash += gross_amount; recompute buying_power; increments Account.version by 1"]

  - method: POST
    path: "/dividends/{id}/reinvest"
    description: "Reinvest a paid dividend (DRIP) into fractional shares"
    roles: [ClearingSystem]
    code: 200
    input: []
    output: DividendEvent
    side_effects: ["status -> REINVESTED; open Lot for reinvest_quantity; settled_cash -= spent; residual remains; increments Account.version by 1"]

  - method: POST
    path: "/dividends/{id}/reverse"
    description: "Reverse a paid (not yet reinvested) dividend"
    roles: [ClearingSystem]
    code: 200
    input: []
    output: DividendEvent
    side_effects: ["status -> REVERSED; settled_cash -= gross_amount (compensation); increments Account.version by 1"]

  # ---- Options approval ----
  - method: POST
    path: "/options-approvals"
    description: "Apply for an options trading level (requested_level must be 1..3)"
    roles: [AccountHolder]
    code: 201
    input: [account_id, requested_level, stated_experience_years, liquid_net_worth_cents]
    output: OptionsApproval
    side_effects: ["Validate requested_level in 1..3 (ERR_OPTIONS_LEVEL_TOO_HIGH otherwise); status=SUBMITTED"]

  - method: GET
    path: "/accounts/{id}/options-approvals"
    description: "List options approvals for an account; reverse-reachability for OptionsApproval.account_id"
    roles: [AccountHolder, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OptionsApproval[]
    side_effects: []

  - method: POST
    path: "/options-approvals/{id}/decide"
    description: "Approve (suitability-capped) or deny an options application"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, expected_account_version]
    output: OptionsApproval
    side_effects:
      - "OCC check on expected_account_version"
      - "APPROVE: granted_level = suitability cap; if >0 -> APPROVED and Account.options_level = max(current, granted_level); increments Account.version by 1"
      - "Suitability yields 0 or decision=DENY -> DENIED"

  - method: POST
    path: "/options-approvals/{id}/revoke"
    description: "Revoke an approved options level"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OptionsApproval
    side_effects: ["status -> REVOKED; Account.options_level reset to highest still-APPROVED level; increments Account.version by 1"]

  # ---- Margin calls ----
  - method: POST
    path: "/accounts/{id}/margin-calls"
    description: "Issue a margin call against an account in deficiency. At most one ISSUED call may occupy an account's cure window at a time."
    roles: [ClearingSystem]
    code: 201
    input: []
    output: MarginCall
    side_effects:
      - "Precondition: maintenance_excess_cents < 0 (ERR_NO_DEFICIENCY); no existing ISSUED MarginCall on the account (ERR_MARGIN_CALL_ACTIVE)"
      - "MarginCall(status=ISSUED, deficiency=abs(maintenance_excess)); cure_by=clock+MARGIN_CURE_DAYS; trading_status -> MARGIN_CALL"

  - method: GET
    path: "/accounts/{id}/margin-calls"
    description: "List margin calls for an account; reverse-reachability for MarginCall.account_id"
    roles: [AccountHolder, ClearingSystem, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MarginCall[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/margin-calls/{call_id}/liquidate"
    description: "Liquidate to cure an unmet margin call past its deadline"
    roles: [ClearingSystem]
    code: 200
    input: []
    output: MarginCall
    side_effects: ["Force closing SELL fills until excess>=0 (cascade Disposals/Position/cash); status -> LIQUIDATED; trading_status recomputes"]

  # ---- Clock (test-driving; default 2026-01-01T00:00:00Z) ----
  - method: POST
    path: "/_clock/advance"
    description: "Set the logical clock to a UTC instant and run the ClearingSystem sweep (settle Deposits/Settlements whose settles_on has passed). Server startup default clock is 2026-01-01T00:00:00Z; before any advance the clock reads exactly this default and never falls back to wall-clock."
    roles: [ClearingSystem]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["clock set; all PENDING Deposits and UNSETTLED Settlements with settles_on <= clock -> SETTLED; recompute affected accounts"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6) — 24 codes
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or AccountHolder acting on an account it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, non-positive amount, or notional+quantity both set/both zero" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match current Account.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_ACCOUNT_FROZEN, http: 409, condition: "Account.trading_status is FROZEN; all order placement blocked" }
  - { id: ERR_RESTRICTED_CLOSING_ONLY, http: 409, condition: "Account RESTRICTED_CLOSING_ONLY or MARGIN_CALL; opening BUY blocked, only is_closing SELL allowed" }
  - { id: ERR_OPTIONS_LEVEL_INSUFFICIENT, http: 409, condition: "Account.options_level below Security.required_options_level for an OPTION order" }
  - { id: ERR_FRACTIONAL_NOT_ALLOWED, http: 422, condition: "Notional order on a security with fractional_enabled=false" }
  - { id: ERR_FRACTIONAL_ORDER_CONSTRAINT, http: 422, condition: "Notional/fractional order is not MARKET+REGULAR session" }
  - { id: ERR_EXTENDED_HOURS_LIMIT_ONLY, http: 422, condition: "EXTENDED session order that is not LIMIT, or security not extended_hours_eligible" }
  - { id: ERR_INSUFFICIENT_SHARES, http: 409, condition: "SELL order quantity exceeds available Position.quantity" }
  - { id: ERR_INSUFFICIENT_BUYING_POWER, http: 402, condition: "BUY required_cents exceeds Account.buying_power_cents" }
  - { id: ERR_INSTANT_LIMIT_EXCEEDED, http: 402, condition: "Requested instant credit exceeds remaining INSTANT_CAP headroom" }
  - { id: ERR_LIMIT_PRICE_REQUIRED, http: 422, condition: "order_type=LIMIT without limit_price_cents > 0" }
  - { id: ERR_DRIP_NOT_ENABLED, http: 409, condition: "Reinvest requested but Position.drip_enabled is false" }
  - { id: ERR_DRIP_BELOW_MINIMUM, http: 409, condition: "Reinvest yields reinvest_quantity == 0 (gross dividend below one fractional share at last_price)" }
  - { id: ERR_DIVIDEND_NOT_PAYABLE, http: 409, condition: "Pay/reinvest/reverse on a dividend in the wrong status" }
  - { id: ERR_OPTIONS_LEVEL_TOO_HIGH, http: 422, condition: "requested_level outside 1..3" }
  - { id: ERR_MARGIN_CALL_NOT_DUE, http: 409, condition: "Liquidate attempted before cure_by, or excess already non-negative" }
  - { id: ERR_NO_DEFICIENCY, http: 409, condition: "Issue margin call when maintenance_excess_cents >= 0" }
  - { id: ERR_MARGIN_CALL_ACTIVE, http: 409, condition: "An ISSUED MarginCall already occupies this account's cure window; cannot open an overlapping one" }
  - { id: ERR_CANNOT_FILL_TERMINAL, http: 409, condition: "Fill reported against a terminal (FILLED/REJECTED/CANCELLED) order" }
  - { id: ERR_SETTLEMENT_NOT_DUE, http: 409, condition: "Settlement settle attempted while clock < settles_on" }
  - { id: ERR_DIVIDEND_WINDOW_OVERLAP, http: 409, condition: "Announced dividend's [ex_date, window_end) overlaps a non-terminal dividend's window for the same position" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: AccountHolder
    description: "Retail customer acting on their own account: deposits, orders, DRIP toggle, options applications"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /accounts/{id}/deposits — instant deposit"
      - "POST /orders — place order"
      - "POST /orders/{id}/cancel — cancel own order"
      - "PATCH /positions/{id}/drip — toggle DRIP"
      - "POST /options-approvals — apply for options level"
    shared_operations:
      - "POST /accounts — open account (also ComplianceOfficer)"
      - "GET reads of own account, orders, fills, positions, lots, disposals, settlements, deposits, dividends, options-approvals, margin-calls, securities"

  - name: ComplianceOfficer
    description: "Back-office officer: options approvals, compliance freeze, security registration"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /accounts/{id}/compliance-hold — freeze/unfreeze"
      - "POST /options-approvals/{id}/decide — approve/deny options"
      - "POST /options-approvals/{id}/revoke — revoke options level"
    shared_operations:
      - "POST /accounts — open account (also AccountHolder)"
      - "POST /securities — register security (also ClearingSystem)"
      - "GET reads across accounts for oversight"

  - name: ClearingSystem
    description: "Clearing / settlement / corporate-actions operator: fills, settlements, dividends, margin calls, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/fills — report execution"
      - "POST /settlements/{id}/fail — fail a leg"
      - "POST /deposits/{id}/reverse — ACH return"
      - "POST /dividends — announce; POST /dividends/{id}/pay|reinvest|reverse"
      - "POST /accounts/{id}/margin-calls — issue; POST .../liquidate"
      - "POST /_clock/advance — advance logical clock + settlement sweep"
    shared_operations:
      - "POST /securities — register security (also ComplianceOfficer)"
      - "GET reads across all resources"

  - name: MarketData
    description: "Market-data feed operator: pushes quotes that revalue positions"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /securities/{id}/quote — push last_price_cents"
    shared_operations: []
