              captures: { prot_a: $.data.id }
            - call: "GET /incentives/objectives/${obj_a}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { obj_a_status2: $.data.status, obj_a_round: $.data.protest_round }
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
