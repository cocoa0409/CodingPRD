              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-O1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "XP900", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${partner_carrier_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg_id: "$.data.id" }
            - call: "PATCH /flight-legs/${leg_id}"
              payload: { dep_utc: "2026-11-02T10:00:00Z", arr_utc: "2026-11-02T11:00:00Z" }
              as: NetworkPlanner
              as_user_id: "${partner_carrier_id}"
              captures: { err_patch: "$.data.error_id" }
          assert:
            - "trigger call 1 -> HTTP 403 with data.error_id == \"ERR_OWNERSHIP_MISMATCH\"; ScheduleVersion.${sv_id}.leg_count == 0"
            - "trigger call 2 -> HTTP 201 for the identical geometry from the owning carrier; leg_count == 1"
            - "trigger call 3 -> HTTP 403 with data.error_id == \"ERR_OWNERSHIP_MISMATCH\"; FlightLeg.${leg_id}.dep_utc is still \"2026-11-02T08:00:00Z\""
            - "GET /flight-legs filtered by schedule_version_id ${sv_id} returns total_count == 1"

      - name: state_rules_are_evaluated_before_deadline_rules_on_the_same_request
        claim_type: priority_ordering
        grounds:
          - "validations.priority_26_ERR_SEASON_NOT_OPEN"
          - "validations.priority_73_ERR_SLOT_RETURN_DEADLINE_PASSED"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / season_not_open_outranks_slot_return_deadline_passed_on_the_same_return
          rationale: "That instance proves the low-priority deadline rule fires on its own first, then makes both rules true on the identical request and shows only ERR_SEASON_NOT_OPEN surfacing."

      - name: safety_rules_are_evaluated_before_referential_rules_on_the_same_request
        claim_type: priority_ordering
        grounds:
          - "validations.priority_45_ERR_CURFEW_VIOLATION"
          - "validations.priority_66_ERR_ROUTE_AUTHORITY_MISSING"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / curfew_violation_outranks_route_authority_missing_on_the_same_leg_creation
          rationale: "Curfew (45, business_safety) versus route authority (66, business_referential) is asserted there on one leg creation that violates both, including each rule firing alone."

      - name: a_curfew_violation_is_rejected_at_creation_but_countable_with_a_waiver
        claim_type: satisfaction_to_pass
        grounds:
          - "validations.priority_45_ERR_CURFEW_VIOLATION"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / curfew_violation_outranks_route_authority_missing_on_the_same_leg_creation
          rationale: "The same instance drives the curfew rule to violation and then to satisfaction on the identical station geometry, including the curfew_waiver_reference path that counts instead of rejecting."

      - name: gate_capacity_is_enforced_against_the_station_gate_count
        claim_type: violation_to_error
        grounds:
          - "validations.priority_56_ERR_GATE_CAPACITY_EXCEEDED"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / station_gate_occupancy_intervals_are_half_open_so_touching_endpoints_do_not_overlap
          rationale: "That instance builds peak concurrency to exactly gate_count, then one beyond it, and asserts the 409 at the overflowing leg only."

      - name: an_overlapping_slot_series_at_the_same_time_of_day_is_a_conflict
        claim_type: uniqueness_conflict
        grounds:
          - "validations.priority_63_ERR_SLOT_SERIES_CONFLICT"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / slot_series_day_of_week_masks_conflict_only_on_set_intersection
          rationale: "Day-mask set intersection at an identical station, season, movement_type and time-of-day is asserted there in both the disjoint and the intersecting case."

  # ===================================================================
  # SECTION 5 — endpoints  (§1.5, 58 endpoints: 32 POST, 25 GET, 1 PATCH)
  # ===================================================================
  - section: endpoints
    instances:

      - name: route_authority_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_route_authorities
          - endpoints.GET_route_authorities_route_authority_id
          - endpoints.GET_route_authorities
        distinguishing_aspect: |
          The plain CRUD triple must round-trip every declared input and every declared filter: two
          authorities for the same carrier on different country pairs, read back individually, then
          listed filtered by carrier_id + status (both) and by dest_country_code (one). A list endpoint
          that ignores its filters returns 2 for the narrow query.
        test_recipe:
          setup:
            - "One carrier HX (DE, home). Clock at its default 2026-08-01T00:00:00Z, inside both validity windows."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
          trigger:
            - call: "POST /route-authorities"
              payload: { carrier_id: "${home_carrier_id}", origin_country_code: "DE", dest_country_code: "PT", freedom_type: "THIRD_FOURTH", weekly_frequency_cap: 7, granted_from_utc: "2026-01-01T00:00:00Z", granted_until_utc: "2027-12-31T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { ra_pt_id: "$.data.id" }
            - call: "POST /route-authorities"
              payload: { carrier_id: "${home_carrier_id}", origin_country_code: "DE", dest_country_code: "US", freedom_type: "FIFTH", weekly_frequency_cap: 3, granted_from_utc: "2026-01-01T00:00:00Z", granted_until_utc: "2027-12-31T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { ra_us_id: "$.data.id" }
            - call: "GET /route-authorities/${ra_us_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
            - call: "GET /route-authorities"
              payload: { carrier_id: "${home_carrier_id}", status: "ACTIVE", limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
            - call: "GET /route-authorities"
              payload: { dest_country_code: "PT", limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
          assert:
            - "both POSTs -> HTTP 201 with status \"ACTIVE\", suspension_reason == null, version == 1"
            - "GET /route-authorities/${ra_us_id} -> freedom_type == \"FIFTH\", weekly_frequency_cap == 3, origin_country_code == \"DE\", dest_country_code == \"US\""
            - "the carrier_id + status list reports total_count == 2 and response_type == \"array\""
            - "the dest_country_code \"PT\" list reports total_count == 1 and data[0].id == \"${ra_pt_id}\""
            - "RouteAuthority.${ra_pt_id}.granted_until_utc == \"2027-12-31T23:59:59Z\" — the validity window round-trips unmodified"

      - name: suspending_a_route_authority_immediately_blocks_new_legs_on_that_pair
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_route_authorities_route_authority_id_suspend
          - "validations.priority_67_ERR_ROUTE_AUTHORITY_INACTIVE"
        distinguishing_aspect: |
          The suspend action writes status SUSPENDED plus suspension_reason and is immediately visible to
          the leg-creation gate, which then answers ERR_ROUTE_AUTHORITY_INACTIVE (422) — NOT
          ERR_ROUTE_AUTHORITY_MISSING, because a matching authority does exist. Collapsing the two errors
          hides whether the airline needs a new grant or a reinstatement.
        test_recipe:
          setup:
            - "Home carrier HX (DE); FRA LEVEL_3_COORDINATED (DE); LIS LEVEL_2_FACILITATED (PT, utc_offset_minutes 0); Season W26 OPEN; ScheduleVersion W26-A1, empty."
            - "One ACTIVE RouteAuthority for HX on DE/PT, THIRD_FOURTH, weekly_frequency_cap 7."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "LIS", country_code: "PT", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 0, gate_count: 2, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { lis_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /route-authorities"
              payload: { carrier_id: "${home_carrier_id}", origin_country_code: "DE", dest_country_code: "PT", freedom_type: "THIRD_FOURTH", weekly_frequency_cap: 7, granted_from_utc: "2026-01-01T00:00:00Z", granted_until_utc: "2027-12-31T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { ra_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-A1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
          trigger:
            - call: "POST /route-authorities/${ra_id}/suspend"
              payload: { reason: "BILATERAL_RENEGOTIATION" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX600", origin_station_id: "${fra_id}", dest_station_id: "${lis_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T11:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger call 1 -> HTTP 200; RouteAuthority.${ra_id}.status == \"SUSPENDED\", suspension_reason == \"BILATERAL_RENEGOTIATION\", version == 2"
            - "trigger call 2 -> HTTP 422 with data.error_id == \"ERR_ROUTE_AUTHORITY_INACTIVE\", NOT \"ERR_ROUTE_AUTHORITY_MISSING\""
            - "ScheduleVersion.${sv_id}.leg_count == 0 and schedule_compliance_score == 100.00"
            - "GET /route-authorities filtered by status \"ACTIVE\" returns total_count == 0"

      - name: withdrawing_a_version_cancels_every_leg_and_releases_every_slot_in_one_call
        claim_type: bulk_action
        grounds:
          - state_machines.ScheduleVersion.DRAFT_to_WITHDRAWN
          - endpoints.POST_schedule_versions_schedule_version_id_withdraw
        distinguishing_aspect: |
          One withdraw call must cancel BOTH legs with cancellation_reason SCHEDULE_WITHDRAWN, detach the
          slot-backed one, and drive the released holding's attached_operations 1 -> 0 so
          at_risk_of_loss flips true -> false and the version leaves BLOCKED — all as a single atomic
          bulk write. A second withdraw is ERR_SCHEDULE_VERSION_STATE_INVALID (409).
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; MUC LEVEL_2_FACILITATED; Season W26 OPEN."
            - "One FRA DEPARTURE holding at 2026-11-02T08:00:00Z, days_of_week \"1\", series_weeks 5 (planned_operations 5)."
            - "ScheduleVersion W26-B1 with two FRA->MUC legs, 2026-11-02 and 2026-11-09, both 08:00Z->09:00Z; the 11-02 leg is attached to the holding, so attached_operations == 1, utilization_pct_as_filed == 20.00, at_risk_of_loss == true, at_risk_slot_count == 1, unslotted_leg_count == 1, score 100 - 8 - 15 == 77.00 and compliance_state BLOCKED."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-B1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg1_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX103", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-09T08:00:00Z", arr_utc: "2026-11-09T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg2_id: "$.data.id" }
            - call: "POST /flight-legs/${leg1_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          trigger:
            - call: "POST /schedule-versions/${sv_id}/withdraw"
              payload: { reason: "NETWORK_REPLAN" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /schedule-versions/${sv_id}/withdraw"
              payload: { reason: "NETWORK_REPLAN" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "before the trigger: SlotHolding.${sh_id}.attached_operations == 1, utilization_pct_as_filed == 20.00, at_risk_of_loss == true; ScheduleVersion.${sv_id}.schedule_compliance_score == 77.00 and compliance_state == \"BLOCKED\""
            - "trigger call 1 -> HTTP 200; ScheduleVersion.${sv_id}.filing_status == \"WITHDRAWN\""
            - "BOTH FlightLeg.${leg1_id} and FlightLeg.${leg2_id} are status \"CANCELLED\" with cancellation_reason \"SCHEDULE_WITHDRAWN\", and ${leg1_id}.departure_slot_holding_id == null"
            - "SlotHolding.${sh_id}.attached_operations == 0, utilization_pct_as_filed == 0.00, at_risk_of_loss == false, holding_status still \"HELD\" — the series is released, not lost"
            - "ScheduleVersion.${sv_id}.unslotted_leg_count == 0, at_risk_slot_count == 0, schedule_compliance_score == 100.00, compliance_state == \"CLEAN\""
            - "trigger call 2 -> HTTP 409 with data.error_id == \"ERR_SCHEDULE_VERSION_STATE_INVALID\""

      - name: attaching_a_slot_links_the_leg_and_the_holding_on_both_sides
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_flight_legs_flight_leg_id_attach_slot
          - "validations.priority_61_ERR_SLOT_TIME_MISMATCH"
        distinguishing_aspect: |
          One attach call must write BOTH sides of the reference: FlightLeg.departure_slot_holding_id and
          the holding's attached_operations / utilization_pct_as_filed, and the leg stays DRAFT because no
          aircraft is assigned yet. The same call is refused with ERR_SLOT_TIME_MISMATCH when the leg's
          ISO weekday is not in days_of_week even though the time-of-day matches exactly.
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; MUC LEVEL_2_FACILITATED; Season W26 OPEN."
            - "One FRA DEPARTURE holding at 2026-11-02T08:00:00Z with days_of_week \"1\" (Mondays only), series_weeks 5."
            - "ScheduleVersion W26-L1 with a Monday leg (2026-11-02 08:00Z) and a Tuesday leg (2026-11-03 08:00Z) — same time-of-day, different ISO weekday."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-L1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { mon_leg_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX105", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-03T08:00:00Z", arr_utc: "2026-11-03T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { tue_leg_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs/${tue_leg_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /flight-legs/${mon_leg_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 -> HTTP 422 with data.error_id == \"ERR_SLOT_TIME_MISMATCH\" (2026-11-03 is ISO weekday 2, which is not in \"1\"); SlotHolding.${sh_id}.attached_operations == 0"
            - "trigger call 2 -> HTTP 200; FlightLeg.${mon_leg_id}.departure_slot_holding_id == \"${sh_id}\", arrival_slot_holding_id == null, status still \"DRAFT\" (no aircraft assigned, so SLOT_BACKED is unreachable)"
            - "SlotHolding.${sh_id}.attached_operations == 1, utilization_pct_as_filed == 20.00, at_risk_of_loss == true, credited_operations == 0, utilization_pct == 0.00"
            - "GET /flight-legs filtered by departure_slot_holding_id ${sh_id} returns total_count == 1 with data[0].id == \"${mon_leg_id}\" — the reverse channel resolves"
            - "ScheduleVersion.${sv_id}.unslotted_leg_count == 1, at_risk_slot_count == 1, schedule_compliance_score == 77.00, compliance_state == \"BLOCKED\""

      - name: rotation_feasibility_read_reports_the_ordered_chain_and_the_maintenance_windows
        claim_type: computed_read
        grounds:
          - endpoints.GET_aircraft_aircraft_id_rotation_feasibility
          - calculations.maintenance_opportunity_minutes
          - calculations.rotation_feasibility_evaluation
        distinguishing_aspect: |
          This read-only projection must expose all seven declared fields off one tail: FEASIBLE,
          ordered_leg_ids in dep_utc order, required_turn_minutes 45 (aircraft min_turn 45, no station
          override, domestic inbound so no bump), total_block_minutes 120, first_violation_leg_id null,
          and BOTH maintenance variants 0 — because the only ground period sits at TXL, whose
          maintenance_capable is false. An implementation that ignores the maintenance_capable filter
          reports 60 for both.
        test_recipe:
          setup:
            - "Home carrier HX; MUC LEVEL_2_FACILITATED maintenance_capable true; TXL LEVEL_2_FACILITATED maintenance_capable false, no min_turn_override_minutes; Season W26 OPEN."
            - "Aircraft D-AHXA, fleet B738, min_turn_minutes 45, max_daily_block_minutes 600, required_check_minutes 240, maintenance_check_required left at its default false."
            - "ScheduleVersion W26-G1 with MUC->TXL 2026-11-03 08:00Z->09:00Z and TXL->MUC 2026-11-03 10:00Z->11:00Z, both assigned to D-AHXA."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXA", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { ac_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-G1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX320", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:00:00Z", arr_utc: "2026-11-03T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { out_leg_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX321", origin_station_id: "${txl_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-03T10:00:00Z", arr_utc: "2026-11-03T11:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { back_leg_id: "$.data.id" }
            - call: "POST /flight-legs/${out_leg_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${back_leg_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          trigger:
            - call: "GET /aircraft/${ac_id}/rotation-feasibility"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
          assert:
            - "HTTP 200 with rotation_feasibility_status == \"FEASIBLE\" and first_violation_leg_id == null"
            - "ordered_leg_ids == [\"${out_leg_id}\", \"${back_leg_id}\"] — dep_utc ascending, not creation or id order"
            - "required_turn_minutes == 45 and total_block_minutes == 120"
            - "maintenance_opportunity_minutes == 0 AND cumulative_ground_minutes == 0 — the single 60-minute ground period is at TXL, which is not maintenance_capable"
            - "the same three values are readable off GET /aircraft/${ac_id} (rotation_feasibility_status, maintenance_opportunity_minutes, cumulative_ground_minutes) and Aircraft.${ac_id}.assigned_leg_count == 2"

      - name: one_acknowledge_endpoint_branches_on_its_outcome_input
        claim_type: conditional_action
        grounds:
          - endpoints.POST_filing_submissions_filing_submission_id_acknowledge
        excluded_because:
          difficulty_instance: compensating_invariant / filing_charge_ledger_returns_to_exactly_zero_after_transmit_then_rejection
          rationale: "That instance drives acknowledge with outcome REJECT and asserts the full reversal, and contrasts it with the ACCEPT branch which leaves the ledger and the FILED legs in place."

  # ===================================================================
  # SECTION 6 — errors  (§1.6, 67 error ids)
  # ===================================================================
  - section: errors
    instances:

      - name: every_entity_type_has_its_own_not_found_error_id
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CARRIER_NOT_FOUND
          - errors.ERR_STATION_NOT_FOUND
          - errors.ERR_SEASON_NOT_FOUND
          - errors.ERR_AIRCRAFT_NOT_FOUND
          - errors.ERR_SCHEDULE_VERSION_NOT_FOUND
          - errors.ERR_FLIGHT_LEG_NOT_FOUND
          - errors.ERR_SLOT_HOLDING_NOT_FOUND
          - errors.ERR_SLOT_UTILIZATION_RECORD_NOT_FOUND
          - errors.ERR_SLOT_TRANSACTION_NOT_FOUND
          - errors.ERR_FILING_SUBMISSION_NOT_FOUND
          - errors.ERR_ROUTE_AUTHORITY_NOT_FOUND
          - errors.ERR_NOTIFICATION_OBLIGATION_NOT_FOUND
        distinguishing_aspect: |
          Twelve GETs for a non-existent id on an empty database must return twelve DISTINCT error ids,
          each 404. A single shared ERR_NOT_FOUND, or a generic 500 on an unknown id, fails. This also
          pins the error envelope: response_type "error" and data carrying only error_id and message.
        test_recipe:
          setup:
            - "Completely empty database. Every id below is a literal that cannot exist."
          setup_api_calls: []
          trigger:
            - call: "GET /carriers/car-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e1: "$.data.error_id" }
            - call: "GET /stations/sta-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e2: "$.data.error_id" }
            - call: "GET /seasons/sea-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e3: "$.data.error_id" }
            - call: "GET /aircraft/air-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e4: "$.data.error_id" }
            - call: "GET /schedule-versions/sv-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e5: "$.data.error_id" }
            - call: "GET /flight-legs/leg-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e6: "$.data.error_id" }
            - call: "GET /slot-holdings/sh-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e7: "$.data.error_id" }
            - call: "GET /slot-utilization-records/sur-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e8: "$.data.error_id" }
            - call: "GET /slot-transactions/stx-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e9: "$.data.error_id" }
            - call: "GET /filing-submissions/fs-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e10: "$.data.error_id" }
            - call: "GET /route-authorities/ra-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e11: "$.data.error_id" }
            - call: "GET /notification-obligations/pno-missing-0001"
              payload: {}
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e12: "$.data.error_id" }
          assert:
            - "all twelve calls -> HTTP 404"
            - "the error ids are, in order, ERR_CARRIER_NOT_FOUND, ERR_STATION_NOT_FOUND, ERR_SEASON_NOT_FOUND, ERR_AIRCRAFT_NOT_FOUND, ERR_SCHEDULE_VERSION_NOT_FOUND, ERR_FLIGHT_LEG_NOT_FOUND, ERR_SLOT_HOLDING_NOT_FOUND, ERR_SLOT_UTILIZATION_RECORD_NOT_FOUND, ERR_SLOT_TRANSACTION_NOT_FOUND, ERR_FILING_SUBMISSION_NOT_FOUND, ERR_ROUTE_AUTHORITY_NOT_FOUND, ERR_NOTIFICATION_OBLIGATION_NOT_FOUND — twelve distinct values"
            - "every response has response_type == \"error\", a non-empty data.message, and meta.api_request_id / meta.api_request_timestamp present"
            - "no response body carries any entity field alongside the error"

      - name: assign_aircraft_answers_each_broken_precondition_with_its_own_error_id
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AIRCRAFT_NOT_IN_SERVICE
          - errors.ERR_FLEET_TYPE_MISMATCH
          - errors.ERR_AIRCRAFT_CARRIER_MISMATCH
          - "validations.priority_48_ERR_AIRCRAFT_NOT_IN_SERVICE"
        distinguishing_aspect: |
          Three different tails fail the same endpoint for three different reasons, in the declared
          priority order 48 < 49 < 50: a MAINTENANCE_GROUNDED B738 of the right carrier gives
          ERR_AIRCRAFT_NOT_IN_SERVICE, an IN_SERVICE A320 gives ERR_FLEET_TYPE_MISMATCH, and another
          carrier's IN_SERVICE B738 gives ERR_AIRCRAFT_CARRIER_MISMATCH; the correct tail then succeeds.
          Each earlier condition is deliberately satisfied so the later error is the only one available.
        test_recipe:
          setup:
            - "Two carriers HX (DE, home) and XP (PT); MUC and TXL LEVEL_2_FACILITATED; Season W26 OPEN."
            - "Four tails: HX D-AHXA IN_SERVICE B738; HX D-AHXB MAINTENANCE_GROUNDED B738; HX D-AHXC IN_SERVICE A320; XP CS-XPA IN_SERVICE B738."
            - "ScheduleVersion W26-E1 owned by HX with one MUC->TXL leg on 2026-11-03 08:00Z->09:00Z, fleet_type_code B738, status DRAFT."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /carriers"
              payload: { iata_code: "XP", icao_code: "XPA", country_code: "PT", is_home_carrier: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { partner_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXA", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, status: "IN_SERVICE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { good_ac_id: "$.data.id" }
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXB", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, status: "MAINTENANCE_GROUNDED" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { grounded_ac_id: "$.data.id" }
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXC", fleet_type_code: "A320", seats: 180, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, status: "IN_SERVICE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { wrong_fleet_ac_id: "$.data.id" }
            - call: "POST /aircraft"
              payload: { carrier_id: "${partner_carrier_id}", base_station_id: "${muc_id}", registration: "CS-XPA", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, status: "IN_SERVICE" }
              as: NetworkPlanner
              as_user_id: "${partner_carrier_id}"
              captures: { other_carrier_ac_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-E1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX320", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:00:00Z", arr_utc: "2026-11-03T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs/${leg_id}/assign-aircraft"
              payload: { aircraft_id: "${grounded_ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { e_status: "$.data.error_id" }
            - call: "POST /flight-legs/${leg_id}/assign-aircraft"
              payload: { aircraft_id: "${wrong_fleet_ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { e_fleet: "$.data.error_id" }
            - call: "POST /flight-legs/${leg_id}/assign-aircraft"
              payload: { aircraft_id: "${other_carrier_ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { e_carrier: "$.data.error_id" }
            - call: "POST /flight-legs/${leg_id}/assign-aircraft"
              payload: { aircraft_id: "${good_ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 -> HTTP 409 with data.error_id == \"ERR_AIRCRAFT_NOT_IN_SERVICE\""
            - "trigger call 2 -> HTTP 422 with data.error_id == \"ERR_FLEET_TYPE_MISMATCH\""
            - "trigger call 3 -> HTTP 422 with data.error_id == \"ERR_AIRCRAFT_CARRIER_MISMATCH\" — the tail is IN_SERVICE and the fleet matches, so only the ownership rule is left"
            - "trigger call 4 -> HTTP 200; FlightLeg.${leg_id}.assigned_aircraft_id == \"${good_ac_id}\" and status == \"SLOT_BACKED\" (neither MUC nor TXL is LEVEL_3_COORDINATED, so required_slot_set is empty and ASSIGNED auto-advances)"
            - "Aircraft.${good_ac_id}.assigned_leg_count == 1 and rotation_feasibility_status == \"FEASIBLE\"; the three rejected tails all still report assigned_leg_count == 0 and rotation_feasibility_status == \"UNCHECKED\""

      - name: fiscal_and_state_errors_keep_their_own_status_codes_on_one_endpoint
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FILING_CHARGE_BUDGET_EXCEEDED
          - errors.ERR_SCHEDULE_BLOCKED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / schedule_blocked_outranks_filing_charge_budget_exceeded_on_the_same_transmit
          rationale: "402 for the budget rule and 409 for the blocked-state rule are both raised from the same transmit endpoint there, first separately and then with both true at once."

  # ===================================================================
  # SECTION 7 — rbac  (§1.7, 6 roles, 2 segregation-of-duties rules)
  # ===================================================================
  - section: rbac
    instances:

      - name: allocating_a_slot_series_is_forbidden_to_every_role_but_the_coordinator
        claim_type: role_denied
        grounds:
          - endpoints.POST_slot_holdings
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          POST /slot-holdings declares roles [SlotCoordinator] only. The carrier that wants the slot —
          NetworkPlanner — must be refused with ERR_ROLE_NOT_PERMITTED (403) and must leave no row behind;
          the same body from SlotCoordinator is 201. An implementation that treats "the owning carrier may
          write its own holdings" as an ownership question instead of a role question lets an airline mint
          its own slots.
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; Season W26 OPEN. No holdings yet."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
          trigger:
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { e_planner: "$.data.error_id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5 }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { e_admin: "$.data.error_id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5 }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
          assert:
            - "trigger call 1 -> HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\" (not ERR_OWNERSHIP_MISMATCH — the carrier_id in the body is its own)"
            - "trigger call 2 -> HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\" — even the reference-data administrator cannot allocate a series"
            - "after both denials GET /slot-holdings with station_id ${fra_id} returns total_count == 0 — the rejected requests wrote nothing"
            - "trigger call 3 -> HTTP 201; SlotHolding.${sh_id}.holding_status == \"HELD\", carrier_id == \"${home_carrier_id}\", planned_operations == 5"

      - name: a_blank_identity_header_is_unauthenticated_before_any_role_check_runs
        claim_type: missing_auth
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          A blank X-User-ID and a blank X-User-Role must both give ERR_UNAUTHENTICATED (401) on an
          endpoint whose role list would ALSO have rejected the caller — 401 outranks 403, so the server
          must never leak "your role is wrong" to an unidentified caller. The check must fire on GET
          endpoints too, not only on writes.
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; Season W26 OPEN; one HELD FRA departure series."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
