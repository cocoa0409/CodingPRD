              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 5000, construction_window_start: "2027-01-01T00:00:00Z", construction_window_end: "2027-02-01T00:00:00Z", estimated_cost_cents: 1000000 }
              as: GroundTenant
