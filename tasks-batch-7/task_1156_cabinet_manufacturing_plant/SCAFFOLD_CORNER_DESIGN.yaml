              as: Dealer
              as_user_id: ${d_id}
              captures: { l2_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-1", capacity_doors: 10 }
