          - "roles[ComplianceOfficer\"], endpoints.\"POST /nabs/orders/{id}/pack"
        distinguishing_aspect: "ComplianceOfficer attempting POST /pack returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Order in PICKING"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "cpk", display_name: "CPK", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cid}", sku_code: "spk", title: "SPK", base_price_cents: 100, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sid: "$.data.id"
            - call: "POST /nabs/skus/${sid}/lots"
              payload: { lot_code: "L", qty_received: 5, unit_cost_cents: 10, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "mpk@x.com", full_name: "MPK", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                mid: "$.data.id"
            - call: "POST /nabs/orders"
              payload: { member_id: "${mid}", channel: "RETAIL" }
              as: Member
              as_user_id: "${mid}"
              captures:
                oid: "$.data.id"
            - call: "POST /nabs/orders/${oid}/lines"
              payload: { sku_id: "${sid}", qty: 1 }
              as: Member
              as_user_id: "${mid}"
            - call: "GET /nabs/orders/${oid}"
              as: Member
              as_user_id: "${mid}"
              captures:
                ov: "$.data.version"
            - call: "POST /nabs/orders/${oid}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Member
