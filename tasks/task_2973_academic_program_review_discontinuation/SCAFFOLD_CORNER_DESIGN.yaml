      - name: notices_follow_the_waterfall_order_and_the_statutory_minimum
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - validations[priority=42]
          - errors[ERR_REDUCTION_SEQUENCE_VIOLATION]
          - errors[ERR_TENURE_NOTICE_TOO_SHORT]
          - calculations.staffing_reduction_waterfall
        distinguishing_aspect: |
          Two refusals guard one ordered queue, and their relative priority is
          observable: a notice aimed at position 2 with an also-illegal
          notice_days reports the SEQUENCE error, not the notice-length error,
          because priority 41 outranks 42. The statutory minimum is per
          tenure_status, so 29 days is refused for an ADJUNCT that 30 days
          satisfies. And the queue is not static — noticing position 1 removes
          that appointment from the ASSIGNED pool, promotes the former position 2
          to position 1, and makes the very call that was just refused succeed.
        test_recipe:
          setup:
            - "A program with the three-term rolling cost window 12000000 + 11000000 + 11000000 cents, so severance_budget_cap_cents == floor(0.15 * 34000000) == 5100000."
            - "No teach-out plan and therefore no course guarantees: guaranteed_section_count is 0, retained_teach_out_fte is 0.00 and the whole assigned pool is reducible."
            - "Two appointments: a1 ADJUNCT 0.25 fte at 4000000 cents (notice_pay 82192) and a2 NON_TENURE_TRACK 1.00 fte at 7200000 cents (notice_pay 1775342). Both are funded: a1 is position 1, a2 is position 2, liability 1857534, deferred_fte 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2024FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-1", tenure_status: "ADJUNCT", fte: 0.25, annual_salary_cents: 4000000 }
              as: HRPartner
              captures: { a1_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-NTT-1", tenure_status: "NON_TENURE_TRACK", fte: 1.00, annual_salary_cents: 7200000 }
              as: HRPartner
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /provost/faculty-appointments/${a2_id}/transitions"
              payload: { action: "ISSUE_NOTICE", notice_days: 5 }
              as: HRPartner
              captures: { e_order: $.data.error_id }
            - call: "POST /provost/faculty-appointments/${a1_id}/transitions"
              payload: { action: "ISSUE_NOTICE", notice_days: 29 }
              as: HRPartner
              captures: { e_short: $.data.error_id }
            - call: "POST /provost/faculty-appointments/${a1_id}/transitions"
              payload: { action: "ISSUE_NOTICE", notice_days: 30 }
              as: HRPartner
            - call: "GET /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { limit: 10, offset: 0 }
              as: HRPartner
            - call: "POST /provost/faculty-appointments/${a2_id}/transitions"
              payload: { action: "ISSUE_NOTICE", notice_days: 90 }
              as: HRPartner
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: HRPartner
          assert:
            - "${e_order} == ERR_REDUCTION_SEQUENCE_VIOLATION with HTTP 409 and NOT ERR_TENURE_NOTICE_TOO_SHORT — a2 holds position 2 while a1 holds position 1, and priority 41 is evaluated before priority 42 even though notice_days 5 is also below the 90-day statutory minimum for NON_TENURE_TRACK"
            - "a2 is unchanged after that refusal: state ASSIGNED, notice_days null, notice_issued_at null"
            - "${e_short} == ERR_TENURE_NOTICE_TOO_SHORT with HTTP 422 — a1 IS the minimum position, so the sequence check passes and the length check decides; 29 is one day below the ADJUNCT minimum of 30"
            - "a1 is unchanged after that refusal: state ASSIGNED, notice_days null"
            - "the third call returns 200 with a1 in state NOTICE_ISSUED, notice_days 30 and notice_issued_at 2026-08-01T00:00:00Z"
            - "the appointment list then shows a2 with reduction_sequence_position 1 and a1 with reduction_sequence_position null — a1 left the ASSIGNED pool, so it is no longer a funded candidate and the queue renumbered from 1 with no gap"
            - "the a2 notice that follows returns 200 with state NOTICE_ISSUED, notice_days 90 and notice_pay_cents still 1775342 — the exact call refused at the start now succeeds because the queue moved, not because the payload changed"
            - "the program read shows faculty_fte_baseline 1.25, active_fte_total 1.25, assigned_pool_fte 0.00, reducible_fte 0.00, staffing_liability_cents 0 and deferred_fte 0.00 — with no ASSIGNED rows left the waterfall funds nobody, and a notice does not move fte out of active_fte_total"
            - "separated_fte_total and reassigned_fte_total are both 0.00 — a notice is not a separation"

      - name: an_unfundable_reduction_blocks_effectuation_until_the_fte_is_retained
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - validations[priority=41]
          - errors[ERR_SEVERANCE_CAP_EXCEEDED]
          - errors[ERR_REDUCTION_SEQUENCE_VIOLATION]
          - calculations.staffing_reduction_waterfall
        distinguishing_aspect: |
          A single expensive TENURED appointment cannot be funded at all: its
          notice pay alone exceeds the whole severance cap, so the waterfall
          breaks before position 1 is handed out, leaving deferred_fte at the
          full reducible amount. That single number blocks two different things —
          the decision cannot be effectuated (priority 33) and the unfunded
          appointment cannot be noticed (priority 41's null-position branch).
          Retaining the appointment for the teach-out empties the assigned pool,
          which drives deferred_fte to 0.00 and unblocks effectuation without
          spending a cent of severance.
