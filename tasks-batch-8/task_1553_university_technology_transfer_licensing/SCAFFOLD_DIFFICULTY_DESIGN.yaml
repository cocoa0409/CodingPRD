        grounds:
          - state_machines.InventionDisclosure.INVENTORSHIP_DISPUTED_to_INVENTORSHIP_REVIEW
          - validations[priority=8]
          - errors[ERR_SHARE_SUM_INVALID]
        distinguishing_aspect: |
          Conserved quantity: inventorship share basis points — a different
          conserved quantity than cost cents. Dispute -> resolve -> re-dispute
          -> resolve-restore must keep sum(share_bp) == 10000 at every step
          and return the vector to its original (6000, 4000).
