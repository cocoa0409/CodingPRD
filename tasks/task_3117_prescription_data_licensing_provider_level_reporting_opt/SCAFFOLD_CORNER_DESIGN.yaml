  # ===========================================================================
  - section: consistency_model
    instances:

      - name: compile_response_immediately_reflects_mutation
        claim_type: Immediate Consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/report-deliveries/{id}/compile
        distinguishing_aspect: "consistency_model immediate: the compile 200 response itself carries status COMPILED, the computed fee_cents 11000, and the compiled_cell_ids — no re-GET is needed to observe the mutation."
        test_recipe:
          setup:
            - "Default clock. Client (entitlement 100); methodology with one CURRENT cell for 2026-08; product (base 10000, cell 1000 x 1.0, no discount); period ended 2026-08-31; one SCHEDULED delivery."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Client Imm", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /projection-methodologies"
              payload: { name: "M-IMM", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G1", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-IMM", prescriber_ids: [], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status, fee: $.data.fee_cents, cells: $.data.compiled_cell_ids, ver: $.data.version }
          assert:
            - "compile response status == COMPILED, fee_cents == 11000, len(compiled_cell_ids) == 1, version == 2"
