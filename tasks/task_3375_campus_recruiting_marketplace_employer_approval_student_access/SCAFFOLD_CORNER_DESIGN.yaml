# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3375_campus_recruiting_marketplace_employer_approval_student_access
#
# Breadth probe over §1.1–§1.7 claims that SCAFFOLD_DIFFICULTY_DESIGN.yaml does
# not already exercise. Corners covered by §1.8 appear as excluded_because
# stubs with no test_recipe. YAML anchors (&k_*) are document-local and
# re-execute against a fresh empty database per instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: university_create_applies_defaults_and_onboarding_state
        claim_type: Creation
        grounds:
          - entities.University
          - endpoints.POST_/universities
        distinguishing_aspect: "A university created with only name and primary_domain comes back 201 ONBOARDING with employer_daily_message_cap defaulted to 10, version 1, and system-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /universities"
              payload: { name: "State University", primary_domain: "stateu.edu" }
              as: PlatformAdmin
              captures: { cu_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "University.${cu_id}.status == ONBOARDING and version == 1"
            - "University.${cu_id}.employer_daily_message_cap == 10 (default applied)"
            - "University.${cu_id}.enrolled_student_count == 0 and approved_employer_count == 0"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: student_get_round_trips_all_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Student
          - endpoints.GET_/students/{id}
        distinguishing_aspect: "Every stored Student field round-trips through GET exactly as posted, including the explicitly-set PUBLIC_TO_APPROVED_EMPLOYERS visibility and the system-managed outcome defaults (UNREPORTED, null outcome_recorded_at)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE. Student Sam provisioned with the full field set."
          setup_api_calls:
            - *k_clock
            - &k_uni
              call: "POST /universities"
              payload: { name: "State University", primary_domain: "stateu.edu", employer_daily_message_cap: 10 }
              as: PlatformAdmin
              captures: { uni_id: $.data.id }
            - &k_uni_active
              call: "POST /universities/${uni_id}/transition"
              payload: { to: "ACTIVE" }
              as: PlatformAdmin
            - &k_stu
              call: "POST /students"
              payload: { university_id: "${uni_id}", email: "sam@stateu.edu", full_name: "Sam Lee", major: "CS", graduation_year: 2027, work_authorization: "US_CITIZEN", profile_visibility: "PUBLIC_TO_APPROVED_EMPLOYERS" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "GET /students/${stu_id}"
              payload: {}
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
          assert:
            - "the response status is 200"
            - "Student.${stu_id}.email == \"sam@stateu.edu\", major == \"CS\", graduation_year == 2027, work_authorization == US_CITIZEN"
            - "Student.${stu_id}.profile_visibility == PUBLIC_TO_APPROVED_EMPLOYERS and status == ENROLLED"
            - "Student.${stu_id}.outcome_status == UNREPORTED and outcome_recorded_at is null"
            - "Student.${stu_id}.university_id == ${uni_id}"

      - name: students_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/students
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three students at the university, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE with three students (Sam plus two more)."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_stu
            - call: "POST /students"
              payload: { university_id: "${uni_id}", email: "sally@stateu.edu", full_name: "Sally Kim", major: "CS", graduation_year: 2027, work_authorization: "US_CITIZEN" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
            - call: "POST /students"
              payload: { university_id: "${uni_id}", email: "wei@stateu.edu", full_name: "Wei Chen", major: "EE", graduation_year: 2028, work_authorization: "VISA_OPT_CPT" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
          trigger:
            - call: "GET /students"
              payload: { university_id: "${uni_id}", limit: 2, offset: 0 }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /students?university_id=${uni_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /students?university_id=${uni_id} with no pagination params returns 3 rows (limit defaults to 10, offset to 0)"
            - "GET /students?university_id=${uni_id}&major=EE returns exactly 1 row (Wei)"

      - name: employer_get_with_unknown_id_returns_employer_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/employers/{id}
          - errors.ERR_EMPLOYER_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated employer id produces the entity-specific 404 ERR_EMPLOYER_NOT_FOUND, not a generic ERR_NOT_FOUND and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No employer exists."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and err_id == ERR_EMPLOYER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: job_posting_create_missing_deadline_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.JobPosting.fields.application_deadline
          - validations[priority=11]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "application_deadline is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST from the residual shape bucket — not an eligibility error, and no posting row is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer Acme APPROVED (auto 25, STANDARD)."
          setup_api_calls:
            - *k_clock
            - &k_emp
              call: "POST /employers"
              payload: { company_name: "Acme Corp", website_domain: "acme.com", contact_email: "hr@acme.com" }
              as: Anonymous
              captures: { emp_id: $.data.id, emp_tok: $.data.domain_verification_token }
            - &k_emp_verify
              call: "POST /employers/${emp_id}/verify-domain"
              payload: { verification_token: "${emp_tok}" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
            - &k_emp_screen
              call: "POST /employers/${emp_id}/screen"
              payload: { decision: "CLEAR", analyst_signal_adjustment: 0 }
              as: PlatformAdmin
              captures: { emp_v: $.data.version }
          trigger:
            - call: "POST /job-postings"
              payload: { employer_id: "${emp_id}", title: "SWE Intern", position_type: "INTERNSHIP", min_graduation_year: 2026, max_graduation_year: 2028 }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_INVALID_REQUEST"
            - "GET /job-postings?employer_id=${emp_id} returns 0 rows — nothing was persisted"

      - name: student_create_defaults_profile_visibility_to_university_only
        claim_type: Defaults
        grounds:
          - entities.Student.fields.profile_visibility
          - endpoints.POST_/students
        distinguishing_aspect: "profile_visibility declares default UNIVERSITY_ONLY, so omitting it stores UNIVERSITY_ONLY rather than null — and such a student is invisible to employer outreach until she opts in."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
          trigger:
            - call: "POST /students"
              payload: { university_id: "${uni_id}", email: "pat@stateu.edu", full_name: "Pat Ng", major: "BIO", graduation_year: 2028, work_authorization: "SPONSORSHIP_REQUIRED" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { stu_p_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Student.${stu_p_id}.profile_visibility == UNIVERSITY_ONLY"
            - "GET /students/${stu_p_id} as the student shows the same stored value"

      - name: job_posting_create_active_count_extra_field_is_ignored_input
        claim_type: Computed Fields
        grounds:
          - entities.JobPosting.fields.active_application_count
          - endpoints.POST_/job-postings
        distinguishing_aspect: "active_application_count is source: computed; a client that smuggles active_application_count: 99 into the create body is ignored — the posting is created with the real computed value 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer Acme APPROVED."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
          trigger:
            - call: "POST /job-postings"
              payload: { employer_id: "${emp_id}", title: "SWE Intern", position_type: "INTERNSHIP", min_graduation_year: 2026, max_graduation_year: 2028, application_deadline: "2026-12-01T00:00:00Z", active_application_count: 99 }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { post_c_id: $.data.id }
          assert:
            - "the response status is 201"
            - "JobPosting.${post_c_id}.active_application_count == 0, not 99"
            - "JobPosting.${post_c_id}.blocked_university_ids == [] and status == DRAFT"

      - name: employer_create_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Employer.fields.status
          - endpoints.POST_/employers
        distinguishing_aspect: "status and version are source: system. A registration body carrying status=APPROVED and version=9 is ignored: the employer lands PENDING with version 1 and a server-minted domain_verification_token."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /employers"
              payload: { company_name: "Sneaky Inc", website_domain: "sneaky.com", contact_email: "hr@sneaky.com", status: "APPROVED", version: 9 }
              as: Anonymous
              captures: { emp_s_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Employer.${emp_s_id}.status == PENDING and version == 1"
            - "Employer.${emp_s_id}.domain_verification_token is non-null and fraud_risk_score is not yet assigned by the analyst path (screen_count == 0)"

      - name: student_create_with_invalid_enum_work_authorization_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Student.fields.work_authorization
          - validations[priority=11]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "work_authorization is a closed enum of four members; the near-miss value CITIZEN (missing the US_ prefix) is rejected 400 ERR_INVALID_REQUEST rather than coerced."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
          trigger:
            - call: "POST /students"
              payload: { university_id: "${uni_id}", email: "kim@stateu.edu", full_name: "Kim Lee", major: "CS", graduation_year: 2027, work_authorization: "CITIZEN" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_INVALID_REQUEST"
            - "GET /students?university_id=${uni_id} returns 0 rows"

      - name: student_create_with_unknown_university_returns_university_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Student.fields.university_id
          - validations[priority=4]
          - errors.ERR_UNIVERSITY_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology puts university_id in the request body; priority-4 existence validates it after ownership (caller id == body university_id passes trivially when they are the same unknown id) and answers 404 ERR_UNIVERSITY_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No university exists."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /students"
              payload: { university_id: "00000000-0000-4000-8000-000000000000", email: "ghost@stateu.edu", full_name: "Ghost", major: "CS", graduation_year: 2027, work_authorization: "US_CITIZEN" }
              as: CareerCenterAdmin
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and err_id == ERR_UNIVERSITY_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: university_offboarded_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.University
          - errors.ERR_INVALID_UNIVERSITY_TRANSITION
        distinguishing_aspect: "OFFBOARDED is terminal: after ACTIVE -> OFFBOARDED, every further transition attempt fails 409 ERR_INVALID_UNIVERSITY_TRANSITION and the stored status never moves."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ONBOARDING."
          setup_api_calls:
            - *k_clock
            - *k_uni
          trigger:
            - *k_uni_active
            - call: "POST /universities/${uni_id}/transition"
              payload: { to: "OFFBOARDED" }
              as: PlatformAdmin
            - call: "POST /universities/${uni_id}/transition"
              payload: { to: "ACTIVE" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the OFFBOARDED transition returned 200"
            - "the subsequent ACTIVE attempt returns 409 with err_id == ERR_INVALID_UNIVERSITY_TRANSITION"
            - "a final read via POST response shows the university stayed OFFBOARDED"

      - name: employer_rejected_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Employer
          - errors.ERR_INVALID_EMPLOYER_TRANSITION
        distinguishing_aspect: "REJECTED is terminal: screen REJECT from DOMAIN_VERIFIED lands in REJECTED, and a later screen CLEAR is refused 409 ERR_INVALID_EMPLOYER_TRANSITION — there is no resurrection path."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer Acme DOMAIN_VERIFIED."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_emp_verify
            - call: "POST /employers/${emp_id}/screen"
              payload: { decision: "REJECT" }
              as: PlatformAdmin
          trigger:
            - call: "POST /employers/${emp_id}/screen"
              payload: { decision: "CLEAR", analyst_signal_adjustment: 0 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_EMPLOYER_TRANSITION"
            - "GET /employers/${emp_id} shows status == REJECTED"

      - name: employer_approval_created_in_pending
        claim_type: Initial State
        grounds:
          - state_machines.EmployerApproval
          - endpoints.POST_/employer-approvals
        distinguishing_aspect: "A fresh approval request lands in PENDING with decided_at null and trust_tier_at_decision null — the career center has not acted; none of the decision fields may be client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE; employer Acme APPROVED."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
          trigger:
            - &k_appr
              call: "POST /employer-approvals"
              payload: { employer_id: "${emp_id}", university_id: "${uni_id}" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { appr_id: $.data.id }
          assert:
            - "the response status is 201"
            - "EmployerApproval.${appr_id}.status == PENDING"
            - "decided_at is null, decision_reason is null, trust_tier_at_decision is null, supersedes_approval_id is null"

      - name: application_cannot_jump_submitted_to_offer
        claim_type: Invalid Transition
        grounds:
          - state_machines.Application.SUBMITTED_to_UNDER_REVIEW
          - errors.ERR_INVALID_APPLICATION_TRANSITION
        distinguishing_aspect: "The application pipeline forbids skipping: SUBMITTED -> OFFER_EXTENDED is refused 409 ERR_INVALID_APPLICATION_TRANSITION; only the documented next stage (UNDER_REVIEW) works."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base fixture: university ACTIVE, Sam ENROLLED, Acme APPROVED with approval APPROVED, posting PUBLISHED, Sam's application SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_stu
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - *k_appr
            - &k_appr_ok
              call: "POST /employer-approvals/${appr_id}/decide"
              payload: { decision: "APPROVE", expected_employer_version: "${emp_v}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
            - &k_post
              call: "POST /job-postings"
              payload: { employer_id: "${emp_id}", title: "SWE Intern", position_type: "INTERNSHIP", required_majors: ["CS"], min_graduation_year: 2026, max_graduation_year: 2028, accepted_work_authorizations: ["US_CITIZEN", "PERMANENT_RESIDENT"], required_documents: ["RESUME"], application_deadline: "2026-12-01T00:00:00Z" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { post_id: $.data.id }
            - &k_post_submit
              call: "POST /job-postings/${post_id}/transition"
              payload: { to: "SUBMITTED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
            - &k_post_publish
              call: "POST /job-postings/${post_id}/transition"
              payload: { to: "PUBLISHED" }
              as: PlatformAdmin
            - &k_apply
              call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sam-resume.pdf" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/transition"
              payload: { to: "OFFER_EXTENDED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_APPLICATION_TRANSITION"
            - "GET /applications/${app_id} still shows SUBMITTED"

      - name: posting_closed_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.JobPosting
          - errors.ERR_POSTING_TERMINAL
        distinguishing_aspect: "CLOSED is reachable even from DRAFT and is terminal: a later SUBMITTED attempt fails 409 ERR_POSTING_TERMINAL — distinct from ERR_INVALID_POSTING_TRANSITION, which covers non-terminal illegal moves."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer Acme APPROVED; posting in DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - *k_post
          trigger:
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "CLOSED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "SUBMITTED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the CLOSE transition returned 200 (DRAFT -> CLOSED is legal)"
            - "the SUBMITTED attempt returns 409 with err_id == ERR_POSTING_TERMINAL"
            - "GET /job-postings/${post_id} shows status == CLOSED"

      - name: signup_attendance_requires_completed_event
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EventSignup.REGISTERED_to_ATTENDED
          - errors.ERR_INVALID_SIGNUP_TRANSITION
        distinguishing_aspect: "Attendance marking is gated on the PARENT event being COMPLETED: a REGISTERED signup under an OPEN event refuses to=ATTENDED with 409 ERR_INVALID_SIGNUP_TRANSITION even though the signup itself is in the right state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE; event OPEN with one capacity-10 session; Sam REGISTERED."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_stu
            - &k_event
              call: "POST /career-events"
              payload: { university_id: "${uni_id}", title: "Fall Fair", starts_at: "2026-10-10T09:00:00Z", ends_at: "2026-10-10T17:00:00Z" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - &k_event_open
              call: "POST /career-events/${ev_id}/transition"
              payload: { to: "OPEN" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ev_v2: $.data.version }
            - &k_sess
              call: "POST /career-events/${ev_id}/sessions"
              payload: { title: "Acme Booth", mode: "IN_PERSON", room_id: "GYM-A", starts_at: "2026-10-10T10:00:00Z", ends_at: "2026-10-10T11:00:00Z", signup_deadline: "2026-10-09T23:59:59Z", capacity: 10, expected_career_event_version: "${ev_v2}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ses_id: $.data.id }
            - &k_signup1
              call: "POST /event-signups"
              payload: { event_session_id: "${ses_id}", student_id: "${stu_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { sg1_id: $.data.id }
          trigger:
            - call: "POST /event-signups/${sg1_id}/transition"
              payload: { to: "ATTENDED" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_SIGNUP_TRANSITION"
            - "GET /event-signups/${sg1_id} still shows REGISTERED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: fraud_tier_boundary_score_20_low_risk_21_standard
        claim_type: Constants Applied
        grounds:
          - calculations.fraud_risk_score
          - entities.Employer.fields.trust_tier
        distinguishing_aspect: "The LOW_RISK/STANDARD boundary is inclusive below: a score of exactly TIER_LOW_RISK_MAX (20) maps to LOW_RISK while 21 maps to STANDARD — tested with two identical employers whose analyst adjustments differ by one point (+10 vs +11 on an auto score of 10)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two employers Beta Works and Delta U, both auto-scored 10 (email-domain match -25, .edu TLD -15: 50 - 40)."
          setup_api_calls:
            - *k_clock
            - call: "POST /employers"
              payload: { company_name: "Beta Works", website_domain: "beta.edu", contact_email: "hi@beta.edu" }
              as: Anonymous
              captures: { empB_id: $.data.id, empB_tok: $.data.domain_verification_token }
            - call: "POST /employers/${empB_id}/verify-domain"
              payload: { verification_token: "${empB_tok}" }
              as: EmployerRecruiter
              as_user_id: "${empB_id}"
            - call: "POST /employers"
              payload: { company_name: "Delta U", website_domain: "delta.edu", contact_email: "hi@delta.edu" }
              as: Anonymous
              captures: { empD_id: $.data.id, empD_tok: $.data.domain_verification_token }
            - call: "POST /employers/${empD_id}/verify-domain"
              payload: { verification_token: "${empD_tok}" }
              as: EmployerRecruiter
              as_user_id: "${empD_id}"
          trigger:
            - call: "POST /employers/${empB_id}/screen"
              payload: { decision: "CLEAR", analyst_signal_adjustment: 10 }
              as: PlatformAdmin
            - call: "POST /employers/${empD_id}/screen"
              payload: { decision: "CLEAR", analyst_signal_adjustment: 11 }
              as: PlatformAdmin
          assert:
            - "Employer.${empB_id}.fraud_risk_score == 20 and trust_tier == LOW_RISK (<= 20)"
            - "Employer.${empD_id}.fraud_risk_score == 21 and trust_tier == STANDARD"
            - "both employers are APPROVED — the tier boundary does not gate CLEAR, only HIGH_RISK does"

