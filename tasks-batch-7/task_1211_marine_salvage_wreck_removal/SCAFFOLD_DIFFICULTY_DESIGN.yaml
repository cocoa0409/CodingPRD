            - "EquipmentCharter.${ch_id}.standby_days == 3 (72h)"
            - "EquipmentCharter.${ch_id}.demurrage_days == 0 (elapsed 336h == booked 336h; strictly-greater trigger does not fire)"
            - "EquipmentCharter.${ch_id}.total_cost_cents == 12500014 (11 x 1,000,001 + 3 x round_half_up(1,000,001 x 0.5)=500,001; per-line rounding pinned)"
            - "total_cost_cents != 12500013 (the sum-then-round order is non-conformant)"
            - "SalvageContract.${ct_id}.cost_to_date_cents == 12500014 after off-hire recompute"

      - name: scopic_netting_after_award_pinned_order
        grounds:
          - calculations.special_compensation
          - calculations.salvage_award_final
          - entities.PollutionEvent.fields.special_compensation_payable_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation
          order — payable = max(0, final_exposure - award.computed) only AFTER
          charter costs and then the Article-13 award are computed. With final
          exposure 12,000,000 and award 75,000,000 the payable collapses to 0;
          evaluating the netting before the award (reverse order) is undefined
          and forbidden. Distinct mode from tiered (a) and rounding-order (b).
