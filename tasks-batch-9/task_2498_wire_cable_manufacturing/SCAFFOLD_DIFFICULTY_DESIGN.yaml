  # ===========================================================================
  # Rule 4 - transitive cascade chains
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_suspend_cascades_four_hops_to_queued_lot
        grounds:
          - state_machines.ListingCertification.ACTIVE_to_SUSPENDED
          - state_machines.CatalogProduct.RELEASED_to_SUSPENDED
          - state_machines.CustomerOrder.QUOTED_to_HELD
          - state_machines.ProductionLot.PENDING_to_QUARANTINED
          - endpoints.POST_/listing-certifications/{id}/inspections
        cascade_depth: 4
        chain: "FactoryInspection(outcome=SUSPEND) -> ListingCertification.status=SUSPENDED -> CatalogProduct.status=SUSPENDED -> CustomerOrder.pricing_status=HELD -> ProductionLot.quality_state=QUARANTINED"
        distinguishing_aspect: |
          Depth-4 chain triggered from the certification side of the graph
          (POST /listing-certifications/{id}/inspections). Every hop crosses into
          a different entity and each hop is conditional on the target's current
          state, so the fourth hop only lands because the queued lot is still
          quality_state PENDING.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; copper settlement 2026-07-30 at 4.10."
            - "QUALIFIED compounds; UL file E12345 ACTIVE via a PASS inspection on 2026-06-05."
            - "SKU THHN-12-CU RELEASED against that file; customer ACME order SO-CAS for 5.000 kft in pricing_status QUOTED / fulfillment_status OPEN."
            - "Rod lot of 20000 lbs; lot LOT-CAS created against SO-CAS and left at process_state QUEUED / quality_state PENDING (no process steps run)."
          setup_api_calls:
