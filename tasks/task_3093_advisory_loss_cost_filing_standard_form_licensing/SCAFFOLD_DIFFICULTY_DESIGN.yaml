            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-050", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2027-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
