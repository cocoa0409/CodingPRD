          scheduled_end: '2026-09-17T21:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 1
          replay_hours: 0
          expected_property_version: ${p_x1_v}
        as: RightsManager
        captures:
          w_x1_id: $.data.id
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-X1
          scope_kind: REGION
          total_units: 10
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_x1_id: $.data.id
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_x1_id}
          window_id: ${w_x1_id}
          units: 1
        as: StreamOps
        captures:
          res_x1_id: $.data.id
      - call: POST /platform/capacity-reservations/${res_x1_id}/confirm
        payload: {}
        as: StreamOps
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-17T18:00:00Z'
        as: StreamOps
      trigger:
      - call: POST /platform/windows/${w_x1_id}/go-live
        payload: {}
        as: RightsManager
        captures:
          x1_err: $.data.error_id
      assert:
      - 'x1_err == ERR_INVALID_STATE  # property not ACTIVE blocks window go-live'
  - name: promo_redeem_gated_by_partner_state
    grounds:
    - state_machines.PromoCode.ISSUED_to_REDEEMED
    - validations[priority=18]
    - errors[ERR_PROMO_INVALID]
    distinguishing_aspect: 'Pair PromoCode -> DistributionPartner (different pair than window->

      property): redeem requires the issuing partner''s partner_status ==

      ACTIVE; a code from a SUSPENDED partner fails even when the code

      itself is ISSUED and unexpired.

      '
    test_recipe:
      setup:
      - Partner with one ISSUED code; partner subsequently SUSPENDED (via admin action) — modeled here by redeem attempt against a partner whose status is not ACTIVE
      setup_api_calls:
      - call: POST /platform/partners
        payload:
          partner_code: PT-X2
          display_name: Cross2
          bundled_tier: PREMIUM
          max_promo_codes: 3
        as: PartnerManager
        captures:
          pt_x2_id: $.data.id
      - call: POST /platform/partners/${pt_x2_id}/promo-codes
        payload: {}
        as: PartnerManager
        captures:
          code_x2: $.data.code
      - call: POST /platform/viewers
        payload:
          email: x2@x.com
          home_region: '510'
        as: Viewer
        captures:
          v_x2_id: $.data.id
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-30T00:00:00Z'
        as: StreamOps
      trigger:
      - call: POST /platform/promo-codes/redeem
        payload:
          code: ${code_x2}
          viewer_id: ${v_x2_id}
        as: Viewer
        as_user_id: ${v_x2_id}
        captures:
          x2_err: $.data.error_id
      assert:
      - 'x2_err == ERR_PROMO_INVALID  # code issued 2026-09-01 default clock + 72h expiry < 2026-09-30 -> expired; redeem depends on code status which depends on
        clock'
      - PromoCode.code_status transitions ISSUED -> EXPIRED under the clock sweep
- rule_id: resource_temporal_overlap
  instances:
  - name: blackout_half_open_adjacency_allowed
    grounds:
    - calculations.blackout_overlap
    - validations[priority=9]
    - errors[ERR_BLACKOUT_OVERLAP]
    distinguishing_aspect: 'Resource = TerritoryRule on (window, region); half-open interval

      semantics: rule A [10:00, 12:00) and rule B [12:00, 14:00) are

      adjacent and MUST both be admitted (no merge), while a third rule

      [11:00, 13:00) overlaps A and is rejected — adjacency is not overlap.

      '
    test_recipe:
      setup:
      - ACTIVE property, SCHEDULED window covering 2026-09-18 09:00..20:00
      - BLACKOUT rule R1 10:00-12:00 ACTIVE
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-T1
          display_name: Temp1
          sport: TENNIS
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 3
          exclusive_windows_count: 3
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_t1_id: $.data.id
          p_t1_v: $.data.version
      - call: POST /platform/properties/${p_t1_id}/activate
        payload: {}
        as: RightsManager
      - call: POST /platform/windows
        payload:
          property_id: ${p_t1_id}
          event_code: T1
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-18T09:00:00Z'
          scheduled_end: '2026-09-18T20:00:00Z'
          territory_scope:
          - '510'
          regional_block: true
          capacity_required_units: 1
          replay_hours: 0
          expected_property_version: ${p_t1_v}
        as: RightsManager
        captures:
          w_t1_id: $.data.id
      - call: POST /platform/territory-rules
        payload:
          window_id: ${w_t1_id}
          region_code: '510'
          rule_kind: BLACKOUT
          effective_start: '2026-09-18T10:00:00Z'
          effective_end: '2026-09-18T12:00:00Z'
          broadcast_obligation_ref: BC-1
        as: RightsManager
      - call: POST /platform/territory-rules
        payload:
          window_id: ${w_t1_id}
          region_code: '510'
          rule_kind: BLACKOUT
          effective_start: '2026-09-18T12:00:00Z'
          effective_end: '2026-09-18T14:00:00Z'
          broadcast_obligation_ref: BC-2
        as: RightsManager
      trigger:
      - call: POST /platform/territory-rules
        payload:
          window_id: ${w_t1_id}
          region_code: '510'
          rule_kind: BLACKOUT
          effective_start: '2026-09-18T11:00:00Z'
          effective_end: '2026-09-18T13:00:00Z'
          broadcast_obligation_ref: BC-3
        as: RightsManager
        captures:
          t1_err: $.data.error_id
      assert:
      - Adjacent rule R2 (start == R1.end) was admitted in setup (201)
      - 't1_err == ERR_BLACKOUT_OVERLAP  # [11:00,13:00) intersects [10:00,12:00)'
      - R1 and R2 remain separate ACTIVE rules (no interval merge)
  - name: capacity_window_aggregate_overlap_across_reservations
    grounds:
    - calculations.capacity_commit
    - validations[priority=16]
    - errors[ERR_CAPACITY_INSUFFICIENT]
    distinguishing_aspect: 'Resource = CapacityPool with AGGREGATE-CAPACITY semantics (different

      from half-open adjacency): overlapping-in-time reservations on the

      same pool consume shared units; a hold whose units exactly equal

      remaining capacity succeeds (equality passes), one unit more fails.

      The interval semantics differ: no interval intersection test, only a

      summation over co-existing reservations.

      '
    test_recipe:
      setup:
      - Pool total_units 10, oversubscribe 0; reservation R1 of 10 HELD
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-T2
          display_name: Temp2
          sport: NFL
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 3
          exclusive_windows_count: 3
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_t2_id: $.data.id
          p_t2_v: $.data.version
      - call: POST /platform/properties/${p_t2_id}/activate
        payload: {}
        as: RightsManager
      - call: POST /platform/windows
        payload:
          property_id: ${p_t2_id}
          event_code: T2
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-19T18:00:00Z'
          scheduled_end: '2026-09-19T21:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 10
          replay_hours: 0
          expected_property_version: ${p_t2_v}
        as: RightsManager
        captures:
          w_t2_id: $.data.id
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-T2
          scope_kind: REGION
          total_units: 10
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_t2_id: $.data.id
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_t2_id}
          window_id: ${w_t2_id}
          units: 10
        as: StreamOps
        captures:
          res_t2_id: $.data.id
      trigger:
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_t2_id}
          window_id: ${w_t2_id}
          units: 1
        as: StreamOps
        captures:
          t2_err: $.data.error_id
      assert:
      - 't2_err == ERR_CAPACITY_INSUFFICIENT  # 10 held of 10 total; one more unit exceeds'
      - R1 of exactly 10 units was admitted (equality passes at hold time)
- rule_id: compensating_invariant
  instances:
  - name: pool_committed_units_conserved_across_hold_release_cycle
    grounds:
    - entities.CapacityPool.fields.committed_units
    - state_machines.CapacityReservation.HELD_to_CONFIRMED
    - state_machines.CapacityReservation.CONFIRMED_to_RELEASED
    distinguishing_aspect: 'Conserved quantity = CapacityPool.committed_units: for any sequence

      of hold(H) + release(R) pairs on a pool with no other activity,

      committed_units returns exactly to its prior value:

      committed(after H then R) == committed(before H). Verified with

      units 7: 0 -> 7 (hold) -> 7 (confirm, unchanged) -> 0 (release).

      '
    test_recipe:
      setup:
      - Pool total 20; window scheduled; no reservations yet (committed 0)
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-I1
          display_name: Inv1
          sport: MLB
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 3
          exclusive_windows_count: 3
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_i1_id: $.data.id
          p_i1_v: $.data.version
      - call: POST /platform/properties/${p_i1_id}/activate
        payload: {}
        as: RightsManager
      - call: POST /platform/windows
        payload:
          property_id: ${p_i1_id}
          event_code: I1
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-20T18:00:00Z'
          scheduled_end: '2026-09-20T21:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 7
          replay_hours: 0
          expected_property_version: ${p_i1_v}
        as: RightsManager
        captures:
          w_i1_id: $.data.id
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-I1
          scope_kind: REGION
          total_units: 20
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_i1_id: $.data.id
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_i1_id}
          window_id: ${w_i1_id}
          units: 7
        as: StreamOps
        captures:
          res_i1_id: $.data.id
      - call: POST /platform/capacity-reservations/${res_i1_id}/confirm
        payload: {}
        as: StreamOps
      - call: POST /platform/capacity-reservations/${res_i1_id}/release
        payload: {}
        as: StreamOps
      trigger:
      - call: GET /platform/capacity-pools/${pool_i1_id}
        payload: {}
        as: StreamOps
        captures:
          i1_committed: $.data.committed_units
      assert:
      - 'i1_committed == 0  # hold(7) + confirm + release restores the pre-hold value exactly'
  - name: property_window_counters_conserved_across_schedule_cancel_cycle
    grounds:
    - entities.RightsProperty.fields.simulcast_windows_consumed
    - state_machines.StreamingWindow.SCHEDULED_to_CANCELLED
    - state_machines.RightsProperty.NEGOTIATION_to_ACTIVE
    distinguishing_aspect: 'Conserved quantity = RightsProperty.simulcast_windows_consumed

      (different quantity than pool units): schedule(S) + cancel(C) of the

      same window returns the counter to its prior value:

      consumed(after S then C) == consumed(before S). Verified: 0 -> 1

      (schedule) -> 0 (cancel), while simulcast_windows_count (the quota)

      never changes.

      '
    test_recipe:
      setup:
      - ACTIVE property with simulcast_windows_count 5, no windows yet (consumed 0)
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-I2
          display_name: Inv2
          sport: SOCCER
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 5
          exclusive_windows_count: 5
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_i2_id: $.data.id
          p_i2_v: $.data.version
      - call: POST /platform/properties/${p_i2_id}/activate
        payload: {}
        as: RightsManager
      - call: POST /platform/windows
        payload:
          property_id: ${p_i2_id}
          event_code: I2
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-21T18:00:00Z'
          scheduled_end: '2026-09-21T21:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 1
          replay_hours: 0
          expected_property_version: ${p_i2_v}
        as: RightsManager
        captures:
          w_i2_id: $.data.id
      - call: POST /platform/windows/${w_i2_id}/cancel
        payload: {}
        as: RightsManager
      trigger:
      - call: GET /platform/properties/${p_i2_id}
        payload: {}
        as: RightsManager
        captures:
          i2_consumed: $.data.simulcast_windows_consumed
          i2_quota: $.data.simulcast_windows_count
      assert:
      - 'i2_consumed == 0  # schedule(1) + cancel restores the pre-schedule counter'
      - 'i2_quota == 5  # quota field is invariant across the cycle'
