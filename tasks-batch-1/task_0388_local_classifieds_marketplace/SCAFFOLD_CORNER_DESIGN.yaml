  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: trust_score_verification_bonus_applied
        claim_type: Constants Applied
        grounds: [calculations.compute_trust_score, entities.Member.fields.phone_verified]
        distinguishing_aspect: "Confirming phone verification raises trust_score from 50 to 70 (VERIFY_BONUS +20) and sets phone_verified true."
        test_recipe:
          setup: ["A member registered (trust_score 50, phone_verified false)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m@x.com", display_name: "M", role_kind: "BOTH" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/request-verification"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { code: $.data.verification_code }
          trigger:
            - call: "POST /members/${m_id}/confirm-verification"
              payload: { verification_code: "${code}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ts: $.data.trust_score, pv: $.data.phone_verified }
          assert:
            - "Member.${m_id}.phone_verified == true"
            - "Member.${m_id}.trust_score == 70"

      - name: verification_code_mismatch_rejected
        claim_type: Correct Result
        grounds: [endpoints, "errors[ERR_VERIFICATION_CODE_MISMATCH]", entities.Member.fields.verification_code]
        distinguishing_aspect: "Submitting a wrong verification code -> ERR_VERIFICATION_CODE_MISMATCH 422; phone_verified stays false."
        test_recipe:
          setup: ["A member who has requested verification (code minted)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m@x.com", display_name: "M", role_kind: "BOTH" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/request-verification"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /members/${m_id}/confirm-verification"
              payload: { verification_code: "DEFINITELY-WRONG" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response error_id == ERR_VERIFICATION_CODE_MISMATCH"
            - "http status == 422"
            - "Member.${m_id}.phone_verified == false"

      - name: trust_score_completion_cap_honored
        claim_type: Precision
        grounds: [calculations.compute_trust_score]
        distinguishing_aspect: "completion_bonus is min(completed,5)*6; a verified member with 5 completed sales reaches the clamp ceiling 100 (50+20+30), and further sales do not exceed it."
        excluded_because:
          difficulty_instance: dual_variant_calc / trust_score_provisional_vs_final_on_member
          rationale: "Trust-score completion-bonus accrual is the asserted divergence (70 vs 76 on completion) of the named §1.8 instance; the cap/ceiling is the same formula's clamp already exercised by combinatorial_formula / trust_score_nonlinear_clamped_three_inputs."

