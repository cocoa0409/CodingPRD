  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before role, existence, or body checks."
        test_recipe:
          setup: ["Logical clock pinned; empty database. The trigger request is sent WITHOUT the X-User-Role and X-User-ID headers."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /licensing/varieties"
              payload: { variety_code: "BRB-STR-99", berry_type: "STRAWBERRY", name: "Mystery" }
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 with error_id == ERR_UNAUTHENTICATED"

      - name: authz_role_gate_beats_existence
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "A QualityGrader suspending a non-existent grower id hits the authorization gate (priority 2) before existence (priority 4): 403 ERR_FORBIDDEN_ROLE, never 404 — role checks do not leak resource existence."
        test_recipe:
          setup: ["Logical clock pinned; empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /licensing/growers/00000000-0000-4000-8000-000000000000/suspend"
              payload: {}
              as: QualityGrader
              as_user_id: "qg-9"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 with error_id == ERR_FORBIDDEN_ROLE, not 404"

      - name: grower_confirming_another_growers_planting_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=3]
          - errors.ERR_NOT_OWN_RESOURCE
        distinguishing_aspect: "GrowerPrincipal is entity-backed: G2's X-User-ID does not equal G1's grower id on P1's agreement chain, so the confirm is 403 ERR_NOT_OWN_RESOURCE."
        test_recipe:
          setup: ["Canonical chain through P1 planned under G1; G2 also exists; clock 2026-08-02."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_p1
            - &c_g2
              call: "POST /licensing/growers"
              payload: { legal_name: "Coastal Berry Co", region_code: "CA-SALINAS" }
              as: PlatformAdmin
              captures: { g2_id: $.data.id }
            - *c_clock_aug
          trigger:
            - call: "POST /licensing/plantings/${p1_id}/confirm"
              payload: { plants_planted_actual: 1500, planted_on: "2026-08-01T00:00:00Z" }
              as: GrowerPrincipal
              as_user_id: "${g2_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 with error_id == ERR_NOT_OWN_RESOURCE"
            - "Planting.${p1_id} stays PLANNED"

      - name: exclusive_marketing_false_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=11]
          - errors.ERR_EXCLUSIVE_MARKETING_REQUIRED
          - entities.GrowerAgreement.fields.exclusive_marketing
        distinguishing_aspect: "The exclusive-marketing clause is non-negotiable: an agreement posted with exclusive_marketing=false is rejected 409 ERR_EXCLUSIVE_MARKETING_REQUIRED even when every other field is valid."
        test_recipe:
          setup: ["V1 RELEASED; G1 ACTIVE."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
          trigger:
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g1_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 1000, cultural_practice_codes: ["ORGANIC"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: false }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_EXCLUSIVE_MARKETING_REQUIRED"
            - "GET /licensing/agreements?grower_id=${g1_id} returns 0 rows"

      - name: dispute_window_expired_on_issued_statement
        claim_type: Violation -> Error
        grounds:
          - validations[priority=10]
          - errors.ERR_DISPUTE_WINDOW_EXPIRED
          - entities.SettlementStatement.fields.dispute_deadline
        distinguishing_aspect: "On a still-ISSUED statement the state gate passes, so the temporal gate is the one that fires: dispute at 2026-10-27T00:00:01Z against the 2026-10-26T00:00:00Z deadline is 422 ERR_DISPUTE_WINDOW_EXPIRED (contrast with the FINAL-statement case in §1.8)."
        test_recipe:
          setup: ["Corner pool settled; G1 statement ISSUED (net 562120, deadline 2026-10-26T00:00:00Z); clock advanced past the deadline."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - *c_h1
            - *c_clock_h1b
            - *c_h1_recv
            - *c_h1_grade
            - *c_h1_cert
            - *c_p1_get3
            - *c_clock_oct11
            - *c_hy
            - *c_clock_oct12
            - *c_hy_recv
            - *c_hy_grade
            - *c_hy_cert
            - *c_poolx
            - *c_closex
            - *c_settlex
            - *c_stmtx_get
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-27T00:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /licensing/settlement-statements/${s_c1}/dispute"
              payload: { reason: "late dispute" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 with error_id == ERR_DISPUTE_WINDOW_EXPIRED (not ERR_STATEMENT_NOT_DISPUTABLE — the statement IS in ISSUED)"
            - "SettlementStatement.${s_c1} stays ISSUED with dispute_count == 0"

      - name: lot_variety_mismatch_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors.ERR_LOT_VARIETY_MISMATCH
        distinguishing_aspect: "A planting may only draw from a lot of the agreement's variety: lot L_WRONG holds BLACKBERRY V2 material while A1 licenses STRAWBERRY V1 — 422 ERR_LOT_VARIETY_MISMATCH (referential gate)."
        test_recipe:
          setup: ["V1 (STRAWBERRY) and V2 (BLACKBERRY) both RELEASED; G1 with ACTIVE A1 for V1; L_WRONG shipped under A1 but carrying V2 material."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - call: "POST /licensing/varieties"
              payload: { variety_code: "BRB-BLK-01", berry_type: "BLACKBERRY", name: "Midnight Canyon" }
              as: BreedingManager
              captures: { v2_id: $.data.id }
            - call: "POST /licensing/varieties/${v2_id}/release"
              payload: {}
              as: BreedingManager
            - call: "POST /licensing/plant-lots"
              payload: { nursery_code: "NUR-CA-01", agreement_id: "${a1_id}", variety_id: "${v2_id}", quantity_plants: 100 }
              as: NurseryManager
              captures: { l_wrong: $.data.id }
          trigger:
            - call: "POST /licensing/plantings"
              payload: { agreement_id: "${a1_id}", plant_lot_id: "${l_wrong}", planned_plants: 10, expected_agreement_version: "${a1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /licensing/plantings"
              payload: { agreement_id: "${a1_id}" }
              as: ComplianceOfficer
          assert:
            - "the response status is 422 with error_id == ERR_LOT_VARIETY_MISMATCH"
            - "GET /licensing/plantings?agreement_id=${a1_id} returns 0 rows (total_count 0)"

      - name: confirm_without_covering_window_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=10]
          - errors.ERR_NO_HARVEST_WINDOW
          - calculations.expected_yield_and_booking
        distinguishing_aspect: "The window selector's empty-pool fallback: with no harvest window covering expected_first_harvest 2026-09-30 for (CA-SALINAS, V1), confirm fails 422 ERR_NO_HARVEST_WINDOW."
        test_recipe:
          setup: ["Canonical chain through P1 planned; NO harvest window exists; clock 2026-08-02."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_p1
            - *c_clock_aug
          trigger:
            - call: "POST /licensing/plantings/${p1_id}/confirm"
              payload: { plants_planted_actual: 1500, planted_on: "2026-08-01T00:00:00Z" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 with error_id == ERR_NO_HARVEST_WINDOW"
            - "Planting.${p1_id} stays PLANNED; PlantLot.${l1_id}.plants_reserved stays 1500"

      - name: harvest_before_planting_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=10]
          - errors.ERR_HARVEST_BEFORE_PLANTING
        distinguishing_aspect: "A lot harvested 2026-07-15 from a planting confirmed on 2026-08-01 is temporally impossible: 422 ERR_HARVEST_BEFORE_PLANTING at lot creation."
        test_recipe:
          setup: ["Canonical chain through P1 confirmed (planted_on 2026-08-01); clock 2026-08-02."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
          trigger:
            - call: "POST /licensing/harvest-lots"
              payload: { planting_id: "${p1_id}", harvested_at: "2026-07-15T06:00:00Z", gross_weight_kg: 100, expected_planting_version: "${p1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 with error_id == ERR_HARVEST_BEFORE_PLANTING"
            - "GET /licensing/harvest-lots?planting_id=${p1_id} returns 0 rows"

      - name: planted_on_outside_agreement_window_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=10]
          - errors.ERR_PLANTING_WINDOW_VIOLATION
        distinguishing_aspect: "planted_on 2028-01-05 lands after the agreement's effective_to 2027-12-31 (closed bound): 422 ERR_PLANTING_WINDOW_VIOLATION even though a harvest window covering the expected first harvest exists."
        test_recipe:
          setup: ["V1 RELEASED; G1 with ACTIVE A1 [2026-01-01, 2027-12-31]; lot L1; late window [2028-03-01, 2028-03-08) covering the 60-day harvest of a 2028-01-05 planting; P1 planned 1500; clock 2028-01-10."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - call: "POST /licensing/harvest-windows"
              payload: { region_code: "CA-SALINAS", variety_id: "${v1_id}", week_start: "2028-03-01T00:00:00Z", week_end: "2028-03-08T00:00:00Z", target_volume_kg: 100000 }
              as: PlatformAdmin
            - *c_p1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /licensing/plantings/${p1_id}/confirm"
              payload: { plants_planted_actual: 1500, planted_on: "2028-01-05T00:00:00Z" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 with error_id == ERR_PLANTING_WINDOW_VIOLATION"
            - "Planting.${p1_id} stays PLANNED"

      - name: pool_window_overlap_adjacency
        claim_type: Violation -> Error
        grounds:
          - validations[priority=10]
          - errors.ERR_POOL_WINDOW_OVERLAP
        distinguishing_aspect: "Pool windows are half-open per berry_type: a pool starting 2026-10-12 exactly at the predecessor's week_end is accepted; one starting 2026-10-11 overlaps and is rejected 422."
        test_recipe:
          setup: ["Pool P_A STRAWBERRY [2026-10-05, 2026-10-12) exists."]
          setup_api_calls:
            - *c_clock
            - call: "POST /licensing/pool-periods"
              payload: { berry_type: "STRAWBERRY", week_start: "2026-10-05T00:00:00Z", week_end: "2026-10-12T00:00:00Z", is_shoulder_week: false }
              as: SettlementOfficer
          trigger:
            - call: "POST /licensing/pool-periods"
              payload: { berry_type: "STRAWBERRY", week_start: "2026-10-12T00:00:00Z", week_end: "2026-10-19T00:00:00Z", is_shoulder_week: false }
              as: SettlementOfficer
            - call: "POST /licensing/pool-periods"
              payload: { berry_type: "STRAWBERRY", week_start: "2026-10-11T00:00:00Z", week_end: "2026-10-18T00:00:00Z", is_shoulder_week: false }
              as: SettlementOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "adjacent pool [10-12, 10-19) accepted (201) — half-open adjacency is legal"
            - "overlapping pool [10-11, 10-18) rejected 422 ERR_POOL_WINDOW_OVERLAP"

      - name: negative_settlement_adjustment_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=12]
          - errors.ERR_NEGATIVE_SETTLEMENT
        distinguishing_aspect: "Fiscal floor: resolve ADJUST of -562121 against net 562120 would drive net_cents to -1 — rejected 422 ERR_NEGATIVE_SETTLEMENT and the statement stays DISPUTED with its net unchanged."
        test_recipe:
          setup: ["Corner pool settled; G1 statement ISSUED net 562120; grower disputes it (DISPUTED)."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - *c_h1
            - *c_clock_h1b
            - *c_h1_recv
            - *c_h1_grade
            - *c_h1_cert
            - *c_p1_get3
            - *c_clock_oct11
            - *c_hy
            - *c_clock_oct12
            - *c_hy_recv
            - *c_hy_grade
            - *c_hy_cert
            - *c_poolx
            - *c_closex
            - *c_settlex
            - *c_stmtx_get
            - call: "POST /licensing/settlement-statements/${s_c1}/dispute"
              payload: { reason: "audit dispute" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
          trigger:
            - call: "POST /licensing/settlement-statements/${s_c1}/resolve"
              payload: { resolution: "ADJUST", adjustment_cents: -562121 }
              as: SettlementOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 with error_id == ERR_NEGATIVE_SETTLEMENT"
            - "SettlementStatement.${s_c1} stays DISPUTED with net_cents == 562120 and adjustment_total_cents == 0"

      - name: dispute_state_vs_temporal_priority_corner
        claim_type: Priority Ordering
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / dispute_state_gate_beats_temporal_gate
          rationale: "Dual-failure dispute (FINAL + past deadline) asserted there to return the state error."

      - name: confirm_state_vs_quota_priority_corner
        claim_type: Priority Ordering
        grounds:
          - validations[priority=7]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / confirm_state_gate_beats_quota_gate
          rationale: "Dual-failure confirm (SUSPENDED agreement + quota exceeded) asserted there to return the state error."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: close_creates_provisional_statements_and_stamps_lots
        claim_type: Computed Read
        grounds:
          - endpoints.POST_/licensing/pool-periods/{poolPeriodId}/close
          - entities.SettlementStatement.fields.provisional_net_cents
        distinguishing_aspect: "Close runs the provisional pipeline: pool totals (net 1150, wkg 1322.5, gross 575000, fee 34500, net 540500, rate 408.6957), exactly one PROVISIONAL statement for G1 with provisional_net_cents == 540500, and H1 stamped with pool_period_id while the week_end-excluded HY is untouched."
        test_recipe:
          setup: ["Corner pool scenario through close @500 (no settle)."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
