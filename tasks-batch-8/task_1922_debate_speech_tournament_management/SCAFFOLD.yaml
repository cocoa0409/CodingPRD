# =============================================================================
# PRD Benchmark Scaffold — task_1922_debate_speech_tournament_management
# =============================================================================

scenario: |
  1922. Debate & Speech Tournament Management (NSDA district tournament): tournament registration & entry caps by school, event/division assignment & judge obligation, pairing algorithm & conflict avoidance, ballot collection & speaker point tabulation, elimination bracket & break determination, judge pool shortage & hired judges, results publication & qualification points, hosting logistics (rooms/food/awards)

domain_name: debate-speech-tournament
api_prefix: "/"

complexity_profile:
  primary_archetype: quota / allocation        # judge-round obligation & coverage competed across schools
  secondary_archetype: posture-driven gating   # school obligation posture gates school confirm, which gates tournament lock, which gates prelims, which gates elims, which gates publication
  complexity_layers:
    - optimistic_concurrency        # OCC on Tournament.version (lock), Round.version (pairing generation), School.version (hired-judge purchase)
    - cascading_side_effects        # entry withdraw -> obligation recompute -> hired-round auto-release -> invoice recompute; ballot void -> pairing revert -> round reopen -> standings recompute
    - dual_variant_calculation      # speaker points RAW vs HIGH_LOW_ADJUSTED; hired-judge fee QUOTE vs FINAL
    - rate_threshold_triggers       # break win threshold, hired-fee premium tier, invoice volume-discount tiers
    - derived_field_reconciliation  # school obligation/coverage/shortfall/invoice recomputed on every registration-graph mutation
    - selector_policy               # pairing generation, bye assignment, break selection — all fully pinned, created_at ASC final tie-break
  entity_topology: flat                       # all resources rooted at / with FK links; no nested URLs
  state_machine_shape: parallel               # Tournament carries two independent axes (status x results_visibility); cyclic machines on Entry/Ballot/Round/Pairing/HiredJudgeContract
  relationship_patterns:
    - one_to_many                  # Tournament->Schools/Divisions/Rooms, Division->Rounds, Round->Pairings
    - many_to_many                 # PairingEntry junction (Pairing x Entry)
    - cross_aggregate              # HiredJudgeContract->School, Ballot->Pairing+Judge, JudgeConflict->Judge+School
  role_model: segregation_of_duties           # TournamentDirector (phases/config/fill) vs TabStaff (pairing/ballot verification) — neither can do the other's step
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tournament name" }
      - { name: status, type: enum, source: system, description: "DRAFT -> REGISTRATION_OPEN -> REGISTRATION_LOCKED -> PRELIMS_ACTIVE -> ELIMS_ACTIVE -> COMPLETED (independent of results_visibility)", default: "DRAFT" }
      - { name: results_visibility, type: enum, source: system, description: "HIDDEN -> PUBLISHED -> CERTIFIED; parallel state axis, independent of status", default: "HIDDEN" }
      - { name: registration_opens_at, type: datetime, source: input, description: "open-registration allowed when current logical UTC >= this instant" }
      - { name: registration_locks_at, type: datetime, source: input, description: "lock-registration allowed when current logical UTC >= this instant" }
      - { name: prelim_round_count, type: integer, source: input, description: "Preliminary rounds per division; drives judge obligation multiplier and break win threshold", default: 4, constraints: "integer in [2,6]" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Base fee per confirmed entry, in cents", default: 2500, constraints: ">= 0" }
      - { name: tournament_staff_count, type: integer, source: input, description: "Staff headcount included in catering demand", default: 10, constraints: ">= 0" }
      - { name: late_fee_starts_at, type: datetime, source: input, description: "Optional; entries confirmed at/after this instant incur the late surcharge", default: null }
      - { name: late_fee_surcharge_pct, type: number, source: input, description: "Late-entry surcharge rate (0.15 = 15%); applied per entry with round_half_up to cents", default: 0.15 }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: name, type: string, source: input, description: "School name" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> CONFIRMED; CONFIRMED -> REGISTERED allowed while tournament REGISTRATION_OPEN", default: "REGISTERED" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Optional credit ceiling on projected invoice at entry-confirm time; absent = unlimited", default: null }
      - { name: confirmed_entry_count, type: integer, source: computed, description: "Count of entries with status in {CONFIRMED, COMPETING, ADVANCED, ELIMINATED, FINISHED}", default: 0 }
      - { name: judge_obligation_rounds, type: integer, source: computed, description: "From calculations.judge_obligation_rounds; recomputed on entry confirm/withdraw", default: 0 }
      - { name: covered_judge_rounds, type: integer, source: computed, description: "Committed school-judge rounds + rounds_active of contracts in {FILLED, CONFIRMED, DISPUTED, PAID}", default: 0 }
      - { name: shortfall_rounds, type: integer, source: computed, description: "max(0, judge_obligation_rounds - covered_judge_rounds)", default: 0 }
      - { name: obligation_status, type: enum, source: computed, description: "SATISFIED iff shortfall_rounds == 0 else DEFICIENT", default: "SATISFIED" }
      - { name: invoice_balance_cents, type: integer, source: computed, description: "From calculations.school_invoice_total; entry fees + final judge fees - volume discount - payments", default: 0 }

  - name: EventDivision
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: event_type, type: enum, source: input, description: "DEBATE | SPEECH" }
      - { name: event_code, type: string, source: input, description: "DEBATE codes {CX, LD, PF}; SPEECH codes {OO, EXT, INF}; must match event_type family (ERR_EVENT_CODE_TYPE_MISMATCH)" }
      - { name: division, type: enum, source: input, description: "VARSITY | JV | NOVICE" }
      - { name: per_school_entry_cap, type: integer, source: input, description: "Max non-WITHDRAWN entries per school in this division; creation allowed iff current count < cap", default: 4, constraints: ">= 1" }
      - { name: global_entry_cap, type: integer, source: input, description: "Max non-WITHDRAWN entries across all schools in this division", default: 32, constraints: ">= 1" }
      - { name: competing_entry_count, type: integer, source: computed, description: "Count of entries with status COMPETING/ADVANCED/ELIMINATED/FINISHED in this division", default: 0 }
      - { name: bracket_size, type: integer, source: computed, description: "Set by determine-breaks; power of two in [2,16]; null before breaks", default: null }

  - name: Entry
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id" }
      - { name: division_id, type: string, source: input, description: "FK -> EventDivision.id" }
      - { name: competitor_name, type: string, source: input, description: "Competitor or team name" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> CONFIRMED -> COMPETING -> ADVANCED | ELIMINATED -> FINISHED; CONFIRMED -> WITHDRAWN; WITHDRAWN -> CONFIRMED (cycle, pre-lock only)", default: "REGISTERED" }
      - { name: wins, type: integer, source: computed, description: "Verified prelim ballot wins + bye awards (debate)", default: 0 }
      - { name: losses, type: integer, source: computed, description: "Verified prelim ballot losses (debate)", default: 0 }
      - { name: speaker_points_raw, type: integer, source: computed, description: "Sum of speaker points over VERIFIED ballots plus bye award points (debate)", default: 0 }
      - { name: speaker_points_adjusted, type: integer, source: computed, description: "High-low adjusted: with >=3 contributions, raw minus max minus min; else equals raw", default: 0 }
      - { name: rank_points_raw, type: integer, source: computed, description: "Sum over VERIFIED speech ballots of (8 - rank) (speech)", default: 0 }
      - { name: rank_points_adjusted, type: integer, source: computed, description: "With >=3 VERIFIED speech ballots: raw minus largest minus smallest (8-rank) contribution; else equals raw", default: 0 }
      - { name: opponent_strength, type: integer, source: computed, description: "Sum of final prelim wins of distinct prelim opponents (debate; bye rounds skipped)", default: 0 }
      - { name: prelim_rank, type: integer, source: computed, description: "Standings position in division after latest tabulated prelim round; null before first tabulation", default: null }
      - { name: has_received_bye, type: boolean, source: computed, description: "True once the entry has been awarded a prelim bye", default: false }
      - { name: seed, type: integer, source: computed, description: "Elimination seed assigned at determine-breaks (1 = best); null for non-breaking", default: null }
      - { name: final_placement, type: enum, source: computed, description: "CHAMPION | RUNNER_UP | SEMIFINALIST | QUARTERFINALIST | OCTOFINALIST | NON_BREAKING; null until determined", default: null }
      - { name: qualification_points, type: integer, source: computed, description: "Awarded at publish-results from final_placement tier table; WITHDRAWN entries get 0; null before publication", default: null }
      - { name: fee_charged_cents, type: integer, source: computed, description: "Fee recorded at confirm (base + per-entry late surcharge, round_half_up); audit only — invoice includes it only while status is non-WITHDRAWN", default: 0 }

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: school_id, type: string, source: input, description: "FK -> School.id; null for HIRED judges", default: null }
      - { name: name, type: string, source: input, description: "Judge name" }
      - { name: judge_type, type: enum, source: system, description: "SCHOOL_PROVIDED (via POST /judges) | HIRED (created by contract fill)", default: "SCHOOL_PROVIDED" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> COMMITTED -> WITHDRAWN; REGISTERED -> WITHDRAWN; HIRED judges are created directly in COMMITTED", default: "REGISTERED" }
      - { name: commitment_rounds, type: integer, source: input, description: "Rounds this judge covers. The [1, tournament.prelim_round_count] bound applies only to POST /judges/{id}/commit (school-provided judges); HIRED judges receive commitment_rounds = rounds_requested at fill, which may exceed prelim_round_count", default: 0 }
      - { name: assigned_round_count, type: integer, source: computed, description: "Count of pairings currently staffed by this judge (any non-VERIFIED or VERIFIED pairing with judge_id = this judge)", default: 0 }

  - name: JudgeConflict
    parent: null
    common_fields: false
    fields:
      - { name: judge_id, type: string, source: input, description: "FK -> Judge.id" }
      - { name: school_id, type: string, source: input, description: "FK -> School.id; judge may not be assigned to pairings involving this school's entries" }
      - { name: reason, type: string, source: input, description: "Optional explanation", default: null }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: name, type: string, source: input, description: "Room label" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity (informational)", default: 30, constraints: ">= 1" }

  - name: Round
    parent: null
    common_fields: true
    fields:
      - { name: division_id, type: string, source: input, description: "FK -> EventDivision.id" }
      - { name: round_number, type: integer, source: input, description: "1-based round number; unique within division (ERR_ROUND_NUMBER_EXISTS)", constraints: ">= 1" }
      - { name: kind, type: enum, source: input, description: "PRELIM | ELIM" }
      - { name: starts_at, type: datetime, source: input, description: "Round slot start (logical UTC); must be < ends_at" }
      - { name: ends_at, type: datetime, source: input, description: "Round slot end; ballots accepted until ends_at + 60 minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PAIRED -> BALLOTS_OPEN -> TABULATED; TABULATED -> BALLOTS_OPEN auto-revert on ballot void", default: "SCHEDULED" }
      - { name: pairings_total, type: integer, source: computed, description: "Count of pairings generated for this round", default: 0 }
      - { name: pairings_verified_count, type: integer, source: computed, description: "Count of this round's pairings in VERIFIED status", default: 0 }

  - name: Pairing
    parent: null
    common_fields: true
    fields:
      - { name: round_id, type: string, source: system, description: "FK -> Round.id; set by generate-pairings" }
      - { name: format, type: enum, source: computed, description: "HEAD_TO_HEAD (debate) | SECTION (speech); derived from division event_type", default: null }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; null until assign-room", default: null }
      - { name: judge_id, type: string, source: input, description: "FK -> Judge.id; null until assign-judge", default: null }
      - { name: status, type: enum, source: system, description: "PENDING_STAFFING -> STAFFED -> BALLOT_RELEASED -> BALLOT_SUBMITTED -> VERIFIED; STAFFED -> PENDING_STAFFING on unassign; VERIFIED -> BALLOT_RELEASED on ballot void", default: "PENDING_STAFFING" }
      - { name: is_bye, type: boolean, source: computed, description: "True when the pairing holds a single entry (debate bye); bye pairings are created directly in VERIFIED status", default: false }
      - { name: winner_entry_id, type: string, source: computed, description: "Winning entry from the VERIFIED ballot (debate) or null; references Entry.id", default: null }

  - name: PairingEntry
    parent: null
    common_fields: false
    fields:
      - { name: pairing_id, type: string, source: system, description: "FK -> Pairing.id" }
      - { name: entry_id, type: string, source: system, description: "FK -> Entry.id" }
      - { name: side, type: enum, source: system, description: "AFF | NEG (debate) | SPEAKER (speech)" }
      - { name: draw_position, type: integer, source: system, description: "1-based order within pairing; listing sorted by draw_position ASC" }

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - { name: pairing_id, type: string, source: input, description: "FK -> Pairing.id" }
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id; set from authenticated Judge identity" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> VERIFIED -> VOIDED; SUBMITTED -> DRAFT on recall", default: "DRAFT" }
      - { name: winner_entry_id, type: string, source: input, description: "Debate only: winning entry; must be a member of the pairing", default: null }
      - { name: speaker_points, type: object, source: input, description: "Debate only: map of entry_id -> integer points in [20,30]; every pairing member must be present", default: null }
      - { name: ranks, type: object, source: input, description: "Speech only: map of entry_id -> integer rank in [1, section size]; ranks unique within ballot; every section member present", default: null }
      - { name: allow_low_point_win, type: boolean, source: input, description: "Debate only: must be true to submit a win where winner total speaker points < loser total", default: false }
      - { name: submitted_at, type: datetime, source: system, description: "Logical UTC of last DRAFT -> SUBMITTED transition", default: null }

  - name: HiredJudgeContract
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> FILLED -> CONFIRMED -> PAID; CONFIRMED -> DISPUTED -> CONFIRMED (cycle); REQUESTED -> CANCELLED; auto-CANCELLED when auto-release drains rounds to 0", default: "REQUESTED" }
      - { name: rounds_requested, type: integer, source: input, description: "Hired judge-rounds purchased; must be in [1, school.shortfall_rounds] at creation", constraints: ">= 1" }
      - { name: rounds_released, type: integer, source: computed, description: "Rounds auto-released by entry-withdrawal cascade (only from REQUESTED/CONFIRMED contracts)", default: 0 }
      - { name: rounds_active, type: integer, source: computed, description: "rounds_requested - rounds_released; counts toward school coverage only when status in {FILLED, CONFIRMED, DISPUTED, PAID}", default: 0 }
      - { name: hired_judge_id, type: string, source: system, description: "HIRED Judge created at fill; references Judge.id; null until FILLED", default: null }
      - { name: fee_quote_cents, type: integer, source: computed, description: "PROVISIONAL_QUOTE variant of calculations.hired_judge_fee at creation", default: 0 }
      - { name: final_fee_cents, type: integer, source: computed, description: "FINAL_INVOICE variant of calculations.hired_judge_fee; set at accept, recomputed on rounds change; null before CONFIRMED", default: null }

  - name: LogisticsOrder
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: kind, type: enum, source: input, description: "CATERING | AWARDS; at most one non-FULFILLED order per kind per tournament (ERR_ORDER_KIND_EXISTS)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> FULFILLED", default: "DRAFT" }
      - { name: headcount_demand, type: integer, source: computed, description: "CATERING: competing+advanced+eliminated entries of tournament + COMMITTED judges + tournament_staff_count; recomputed while DRAFT", default: 0 }
      - { name: meal_count, type: integer, source: computed, description: "CATERING: ceil(headcount_demand * 1.10); recomputed while DRAFT", default: 0 }
      - { name: awards_count, type: integer, source: computed, description: "AWARDS: sum of bracket_size over divisions with bracket_size set; recomputed while DRAFT", default: 0 }
      - { name: frozen_meal_count, type: integer, source: computed, description: "meal_count snapshot at submit; null until SUBMITTED", default: null }
      - { name: frozen_awards_count, type: integer, source: computed, description: "awards_count snapshot at submit; null until SUBMITTED", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tournament
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    note: "Two parallel axes: status (competition phase) and results_visibility (HIDDEN -> PUBLISHED -> CERTIFIED). They evolve independently: results_visibility transitions are gated on status values but never mutate status."
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /tournaments/{id}/open-registration"
        actor: TournamentDirector
        preconditions:
          - "status == DRAFT (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "current logical UTC >= registration_opens_at (ERR_REGISTRATION_WINDOW_NOT_OPEN)"
        side_effects: ["Tournament.version +1"]
      - from: REGISTRATION_OPEN
        to: REGISTRATION_LOCKED
        trigger: "POST /tournaments/{id}/lock-registration"
        actor: TournamentDirector
        preconditions:
          - "current logical UTC >= registration_locks_at (ERR_REGISTRATION_WINDOW_CLOSED)"
          - "every School of this tournament has status == CONFIRMED and obligation_status == SATISFIED (ERR_SCHOOLS_NOT_LOCK_READY)"
          - "OCC: expected_tournament_version == Tournament.version (ERR_STALE_VERSION)"
        side_effects:
          - "status -> REGISTRATION_LOCKED; Tournament.version +1"
          - "Snapshot: each school's judge_obligation_rounds is now frozen for coverage evaluation (entries can no longer be confirmed or withdrawn)"
      - from: REGISTRATION_LOCKED
        to: PRELIMS_ACTIVE
        trigger: "POST /tournaments/{id}/start-prelims"
        actor: TournamentDirector
        preconditions:
          - "status == REGISTRATION_LOCKED (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "every division with >= 2 CONFIRMED entries has >= 1 SCHEDULED PRELIM round (ERR_ROUNDS_NOT_SCHEDULED)"
        side_effects:
          - "All entries CONFIRMED -> COMPETING (cascade down)"
          - "Tournament.version +1"
      - from: PRELIMS_ACTIVE
        to: ELIMS_ACTIVE
        trigger: "POST /tournaments/{id}/start-elims"
        actor: TournamentDirector
        preconditions:
          - "status == PRELIMS_ACTIVE (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "every PRELIM round of every division is TABULATED (ERR_ROUNDS_NOT_TABULATED)"
          - "every division with competing_entry_count >= 2 has bracket_size set (ERR_BREAKS_NOT_DETERMINED)"
        side_effects: ["Tournament.version +1"]
      - from: ELIMS_ACTIVE
        to: COMPLETED
        trigger: "POST /tournaments/{id}/complete"
        actor: TournamentDirector
        preconditions:
          - "status == ELIMS_ACTIVE (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "every ELIM round of every division is TABULATED (ERR_ROUNDS_NOT_TABULATED)"
        side_effects:
          - "Debate: the single still-ADVANCED entry per division -> FINISHED with final_placement = CHAMPION"
          - "Speech: still-ADVANCED entries (top-2 of final section) ordered by final-section ballot ranks: rank 1 -> FINISHED + CHAMPION, rank 2 -> FINISHED + RUNNER_UP"
          - "Tournament.version +1"
      - from: HIDDEN
        to: PUBLISHED
        trigger: "POST /tournaments/{id}/publish-results (axis: results_visibility)"
        actor: TournamentDirector
        preconditions:
          - "status == COMPLETED (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "results_visibility == HIDDEN (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
        side_effects:
          - "Entry.qualification_points set per calculations.qualification_points_award for every non-WITHDRAWN entry; WITHDRAWN entries get 0"
          - "results_visibility -> PUBLISHED; Tournament.version +1"
      - from: PUBLISHED
        to: CERTIFIED
        trigger: "POST /tournaments/{id}/certify-qualifications (axis: results_visibility)"
        actor: TournamentDirector
        preconditions:
          - "results_visibility == PUBLISHED (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "every HiredJudgeContract of every school in this tournament is in {PAID, CANCELLED} (ERR_UNPAID_CONTRACTS_REMAIN)"
        side_effects: ["results_visibility -> CERTIFIED; Tournament.version +1"]

  - entity: School
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: CONFIRMED
        trigger: "POST /schools/{id}/confirm"
        actor: SchoolCoach
        preconditions:
          - "Tournament.status == REGISTRATION_OPEN (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "school status == REGISTERED (ERR_SCHOOL_INVALID_STATE)"
          - "obligation_status == SATISFIED, i.e. shortfall_rounds == 0 (ERR_SCHOOL_OBLIGATION_DEFICIENT)"
        side_effects: ["School.version +1; touches Tournament (Tournament.version +1)"]
      - from: CONFIRMED
        to: REGISTERED
        trigger: "POST /schools/{id}/unconfirm"
        actor: SchoolCoach
        preconditions:
          - "Tournament.status == REGISTRATION_OPEN (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "school status == CONFIRMED (ERR_SCHOOL_INVALID_STATE)"
        side_effects: ["School.version +1; touches Tournament (Tournament.version +1)"]

  - entity: Entry
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN, ELIMINATED, FINISHED]
    transitions:
      - from: REGISTERED
        to: CONFIRMED
        trigger: "POST /entries/{id}/confirm"
        actor: SchoolCoach
        preconditions:
          - "Tournament.status == REGISTRATION_OPEN (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "entry status == REGISTERED or WITHDRAWN (ERR_ENTRY_INVALID_STATE)"
          - "fiscal: projected invoice_balance_cents after this confirm <= school.credit_limit_cents when set (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "fee_charged_cents computed (base + per-entry late surcharge per calculations.entry_fee_total)"
          - "Cascade link 1: School.confirmed_entry_count / judge_obligation_rounds / shortfall_rounds / obligation_status / invoice_balance_cents recomputed (School.version +1)"
          - "touches Tournament (Tournament.version +1)"
      - from: WITHDRAWN
        to: CONFIRMED
        trigger: "POST /entries/{id}/confirm"
        actor: SchoolCoach
        preconditions: ["same as REGISTERED -> CONFIRMED"]
        side_effects: ["same as REGISTERED -> CONFIRMED (re-confirm cycle; fee charged again)"]
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: SchoolCoach
        preconditions:
          - "Tournament.status == REGISTRATION_OPEN (ERR_TOURNAMENT_PHASE_FORBIDDEN; withdrawal after lock is impossible)"
          - "entry status == CONFIRMED (ERR_ENTRY_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: entry leaves the invoice status set -> School.confirmed_entry_count and judge_obligation_rounds recomputed (School.version +1)"
          - "Cascade link 2: reduced obligation may create surplus hired coverage -> auto-release drains surplus from the school's contracts with status REQUESTED or CONFIRMED, most recently created first (created_at DESC); each affected contract: rounds_released increased (never below 0 rounds_requested), fees recomputed; a REQUESTED contract drained to 0 active rounds -> CANCELLED"
          - "Cascade link 3: contract fee changes feed School.invoice_balance_cents recomputation (School.version +1)"
          - "touches Tournament (Tournament.version +1)"
      - from: CONFIRMED
        to: COMPETING
        trigger: "system (cascade from POST /tournaments/{id}/start-prelims)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPETING
        to: ADVANCED
        trigger: "system (determine-breaks: entry within top bracket_size of standings among candidates)"
        actor: system
        preconditions: []
        side_effects: ["seed assigned 1..bracket_size in standings order"]
      - from: COMPETING
        to: ELIMINATED
        trigger: "system (determine-breaks: entry outside break set)"
        actor: system
        preconditions: []
        side_effects: ["final_placement = NON_BREAKING"]
      - from: ADVANCED
        to: ELIMINATED
        trigger: "system (ELIM round tabulate: entry lost its debate pairing or was outside top-2 of its speech section)"
        actor: system
        preconditions: []
        side_effects: ["final_placement set per calculations.elim_placement from the elim round's starting field size"]
      - from: ADVANCED
        to: FINISHED
        trigger: "system (cascade from POST /tournaments/{id}/complete)"
        actor: system
        preconditions: []
        side_effects: ["final_placement CHAMPION (debate winner / speech final rank 1) or RUNNER_UP (speech final rank 2)"]

  - entity: Judge
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: COMMITTED
        trigger: "POST /judges/{id}/commit (school-provided) or system at contract fill (hired)"
        actor: SchoolCoach | system
        preconditions:
          - "judge status == REGISTERED (ERR_JUDGE_INVALID_STATE)"
          - "commitment_rounds in [1, tournament.prelim_round_count] (ERR_COMMITMENT_ROUNDS_INVALID)"
          - "Tournament.status == REGISTRATION_OPEN for school-provided commit (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
        side_effects:
          - "School.covered_judge_rounds / shortfall_rounds / obligation_status recomputed (School.version +1)"
          - "touches Tournament (Tournament.version +1)"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /judges/{id}/withdraw"
        actor: SchoolCoach
        preconditions: ["Tournament.status == REGISTRATION_OPEN (ERR_TOURNAMENT_PHASE_FORBIDDEN)"]
        side_effects: ["School coverage recomputed (School.version +1); touches Tournament (Tournament.version +1)"]
      - from: COMMITTED
        to: WITHDRAWN
        trigger: "POST /judges/{id}/withdraw"
        actor: SchoolCoach
        preconditions: ["Tournament.status == REGISTRATION_OPEN (ERR_TOURNAMENT_PHASE_FORBIDDEN)"]
        side_effects: ["School.covered_judge_rounds drops by commitment_rounds; shortfall/obligation_status recomputed (School.version +1); touches Tournament (Tournament.version +1)"]

  - entity: Round
    initial_state: SCHEDULED
    terminal_states: [TABULATED]
    transitions:
      - from: SCHEDULED
        to: PAIRED
        trigger: "POST /rounds/{id}/generate-pairings"
        actor: TabStaff
        preconditions:
          - "round status == SCHEDULED (ERR_ROUND_INVALID_STATE)"
          - "PRELIM: Tournament.status == PRELIMS_ACTIVE; ELIM: Tournament.status == ELIMS_ACTIVE (ERR_TOURNAMENT_PHASE_FORBIDDEN)"
          - "PRELIM: all prior-numbered PRELIM rounds of the division are TABULATED; ELIM: all prior ELIM rounds of the division are TABULATED (ERR_ROUND_INVALID_STATE)"
          - "OCC: expected_round_version == Round.version (ERR_STALE_VERSION)"
          - "pairing algorithm finds a complete valid arrangement (ERR_PAIRING_INFEASIBLE)"
        side_effects:
          - "Pairings + PairingEntries created per calculations.pairing_generation; bye pairings created directly VERIFIED with bye award applied to the entry"
          - "Round.pairings_total set; Round.version +1"
      - from: PAIRED
        to: BALLOTS_OPEN
        trigger: "POST /rounds/{id}/open-ballots"
        actor: TabStaff
        preconditions:
          - "round status == PAIRED (ERR_ROUND_INVALID_STATE)"
          - "every non-bye pairing is STAFFED (room + judge assigned) (ERR_ROUND_INVALID_STATE)"
        side_effects: ["All non-bye pairings STAFFED -> BALLOT_RELEASED (cascade down); Round.version +1"]
      - from: BALLOTS_OPEN
        to: TABULATED
        trigger: "POST /rounds/{id}/tabulate"
        actor: TabStaff
        preconditions:
          - "round status == BALLOTS_OPEN (ERR_ROUND_INVALID_STATE)"
          - "every pairing of the round is VERIFIED (ERR_ROUND_INVALID_STATE)"
        side_effects:
          - "Entry stats recomputed per calculations.speaker_point_tabulation / speech_rank_tabulation / opponent_strength / prelim_standings_ranking"
          - "ELIM: losers -> ELIMINATED with final_placement per calculations.elim_placement; winners stay ADVANCED (speech: top-2 per section stay ADVANCED)"
          - "Round.version +1"
      - from: TABULATED
        to: BALLOTS_OPEN
        trigger: "system (auto-revert when a VERIFIED ballot of this round is voided)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2 of ballot void: round reopens so a replacement ballot can be entered"
          - "Cascade link 3: Entry stats recomputed excluding the VOIDED ballot (wins/points/opponent_strength/prelim_rank refreshed; School.invoice untouched)"
          - "Round.version +1"

  - entity: Pairing
    initial_state: PENDING_STAFFING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING_STAFFING
        to: STAFFED
        trigger: "system (when both room_id and judge_id are set via assign-room / assign-judge)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STAFFED
        to: PENDING_STAFFING
        trigger: "system (unassign-judge, or unassign via room reassignment removing room_id)"
        actor: system
        preconditions: []
        side_effects: ["Judge.assigned_round_count decremented (compensation)"]
      - from: STAFFED
        to: BALLOT_RELEASED
        trigger: "system (cascade from round open-ballots)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BALLOT_RELEASED
        to: BALLOT_SUBMITTED
        trigger: "system (a DRAFT ballot of this pairing is submitted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BALLOT_SUBMITTED
        to: BALLOT_RELEASED
        trigger: "system (ballot recalled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BALLOT_SUBMITTED
        to: VERIFIED
        trigger: "system (ballot verified by TabStaff)"
        actor: system
        preconditions: []
        side_effects: ["Round.pairings_verified_count +1; debate: Pairing.winner_entry_id set"]
      - from: VERIFIED
        to: BALLOT_RELEASED
        trigger: "system (ballot voided by TabStaff)"
        actor: system
        preconditions: []
        side_effects: ["Round.pairings_verified_count -1; Pairing.winner_entry_id cleared; triggers Round TABULATED -> BALLOTS_OPEN auto-revert when round was TABULATED"]

  - entity: Ballot
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ballots/{id}/submit"
        actor: Judge
        preconditions:
          - "ballot status == DRAFT (ERR_BALLOT_INVALID_STATE)"
          - "pairing status == BALLOT_RELEASED (ERR_PAIRING_INVALID_STATE) — cross-entity gate"
          - "current logical UTC <= round.ends_at + 60 minutes (ERR_BALLOT_WINDOW_CLOSED)"
          - "debate: winner total speaker points >= loser total unless allow_low_point_win (ERR_LOW_POINT_WIN_NOT_FLAGGED)"
          - "speaker points in [20,30] (ERR_SPEAKER_POINTS_OUT_OF_RANGE); speech ranks in [1, section size] and unique (ERR_RANK_INVALID / ERR_DUPLICATE_RANK_IN_SECTION)"
        side_effects: ["Pairing BALLOT_RELEASED -> BALLOT_SUBMITTED; submitted_at set"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /ballots/{id}/recall"
        actor: Judge
        preconditions: ["ballot status == SUBMITTED (ERR_BALLOT_INVALID_STATE)"]
        side_effects: ["Pairing BALLOT_SUBMITTED -> BALLOT_RELEASED (cycle)"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /ballots/{id}/verify"
        actor: TabStaff
        preconditions: ["ballot status == SUBMITTED (ERR_BALLOT_INVALID_STATE)"]
        side_effects: ["Pairing BALLOT_SUBMITTED -> VERIFIED"]
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /ballots/{id}/void"
        actor: TabStaff
        preconditions: ["ballot status == VERIFIED (ERR_BALLOT_INVALID_STATE)"]
        side_effects:
          - "Cascade link 1: Pairing VERIFIED -> BALLOT_RELEASED (winner cleared)"
          - "Cascade link 2: if the pairing's round was TABULATED, round auto-reverts TABULATED -> BALLOTS_OPEN (Round.version +1)"
          - "Cascade link 3: Entry stats recomputed excluding this ballot (wins, speaker_points_raw/adjusted, rank_points_raw/adjusted, opponent_strength, prelim_rank)"

  - entity: HiredJudgeContract
    initial_state: REQUESTED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: REQUESTED
        to: FILLED
        trigger: "POST /hired-judge-contracts/{id}/fill"
        actor: TournamentDirector
        preconditions: ["contract status == REQUESTED (ERR_CONTRACT_INVALID_STATE)"]
        side_effects:
          - "HIRED Judge created (status COMMITTED, commitment_rounds = rounds_requested, school_id = null)"
          - "School.covered_judge_rounds += rounds_active; shortfall/obligation_status recomputed (School.version +1)"
          - "touches Tournament (Tournament.version +1)"
      - from: FILLED
        to: CONFIRMED
        trigger: "POST /hired-judge-contracts/{id}/accept"
        actor: SchoolCoach
        preconditions: ["contract status == FILLED (ERR_CONTRACT_INVALID_STATE)"]
        side_effects:
          - "final_fee_cents computed per calculations.hired_judge_fee FINAL_INVOICE variant"
          - "School.invoice_balance_cents recomputed (School.version +1); touches Tournament (Tournament.version +1)"
      - from: CONFIRMED
        to: DISPUTED
        trigger: "POST /hired-judge-contracts/{id}/dispute"
        actor: SchoolCoach
        preconditions: ["contract status == CONFIRMED (ERR_CONTRACT_INVALID_STATE)"]
        side_effects: ["School.version +1"]
      - from: DISPUTED
        to: CONFIRMED
        trigger: "POST /hired-judge-contracts/{id}/resolve-dispute"
        actor: TournamentDirector
        preconditions: ["contract status == DISPUTED (ERR_CONTRACT_INVALID_STATE)"]
        side_effects: ["School.version +1"]
      - from: CONFIRMED
        to: PAID
        trigger: "POST /hired-judge-contracts/{id}/pay"
        actor: SchoolCoach
        preconditions: ["contract status == CONFIRMED (ERR_CONTRACT_INVALID_STATE)"]
        side_effects: ["School.invoice_balance_cents -= final_fee_cents (School.version +1); touches Tournament (Tournament.version +1)"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /hired-judge-contracts/{id}/cancel, or system auto-release draining rounds to 0"
        actor: TournamentDirector | system
        preconditions: ["contract status == REQUESTED (ERR_CONTRACT_INVALID_STATE; manual cancel)"]
        side_effects: ["School coverage/invoice recomputed (School.version +1); touches Tournament (Tournament.version +1)"]

  - entity: LogisticsOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /logistics-orders/{id}/submit"
        actor: TournamentDirector
        preconditions:
          - "order status == DRAFT (ERR_ORDER_INVALID_STATE)"
          - "AWARDS kind: tournament.status in {ELIMS_ACTIVE, COMPLETED} AND every division of the tournament with competing_entry_count >= 2 has bracket_size set (ERR_BREAKS_NOT_DETERMINED)"
        side_effects: ["frozen_meal_count = meal_count; frozen_awards_count = awards_count (freeze)"]
      - from: SUBMITTED
        to: FULFILLED
        trigger: "POST /logistics-orders/{id}/fulfill"
        actor: TournamentDirector
        preconditions: ["order status == SUBMITTED (ERR_ORDER_INVALID_STATE)"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: lock-registration-stale-tournament
    parent_entity: Tournament
    write_endpoint: "POST /tournaments/{id}/lock-registration"
    occ_field: expected_tournament_version
    description: |
      Locking registration snapshots every school's obligation and coverage.
      A lock request carrying an expected_tournament_version below the
      tournament's current version is rejected because the registration graph
      (entries, judges, contracts, school confirms) has advanced since the
      caller last observed the tournament, making the snapshot basis stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: generate-pairings-stale-round
    parent_entity: Round
    write_endpoint: "POST /rounds/{id}/generate-pairings"
    occ_field: expected_round_version
    description: |
      Generating pairings against a Round whose version has advanced since the
      caller last observed it is rejected: the caller's standings snapshot and
      staffing view predate the latest round mutation (e.g. a ballot void that
      reopened the round and recomputed entry stats).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-create-stale-school
    parent_entity: School
    write_endpoint: "POST /hired-judge-contracts"
    occ_field: expected_school_version
    description: |
      Purchasing hired judge-rounds against a School whose version has
      advanced since the caller last observed it is rejected: the shortfall
      the purchase was sized against may have changed (entry confirmed or
      withdrawn, judge committed, another contract filled), so the purchase
      basis is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: judge_obligation_rounds
    trigger: "entry confirm, entry withdraw (re-confirm included), school read"
    algorithm: aggregation
    formula: |
      obligation = 0
      for each division D of the school's tournament:
        n_D = count of school's entries in D with status in {CONFIRMED, COMPETING, ADVANCED, ELIMINATED, FINISHED}
        if n_D == 0: continue
        if D.event_type == DEBATE: judges_D = ceil(n_D / DEBATE_ENTRIES_PER_JUDGE)
        else:                      judges_D = ceil(n_D / SPEECH_ENTRIES_PER_JUDGE)
        obligation += judges_D * tournament.prelim_round_count
      (combinatorial: per-division conditional rate + ceil + round-count multiplier)
    input_set: "school's non-WITHDRAWN, non-REGISTERED entries grouped by division"
    constants:
      DEBATE_ENTRIES_PER_JUDGE: 2
      SPEECH_ENTRIES_PER_JUDGE: 5
    precision: "integer rounds; ceil applied per division before multiplying"

  - name: judge_coverage_shortfall
    trigger: "judge commit/withdraw, contract fill/accept/pay/cancel/auto-release, entry confirm/withdraw (after obligation recompute)"
    algorithm: aggregation
    formula: |
      committed_school_rounds = sum of commitment_rounds over school's Judges with status == COMMITTED and judge_type == SCHOOL_PROVIDED
      hired_rounds = sum of rounds_active over school's contracts with status in {FILLED, CONFIRMED, DISPUTED, PAID}
      covered_judge_rounds = committed_school_rounds + hired_rounds
      shortfall_rounds = max(0, judge_obligation_rounds - covered_judge_rounds)
      obligation_status = SATISFIED iff shortfall_rounds == 0 else DEFICIENT
    input_set: "school's COMMITTED judges and non-terminal contracts"
    precision: "integer rounds"

  - name: hired_judge_fee
    trigger: "QUOTE variant at contract creation; FINAL variant at contract accept and on any rounds_requested change (auto-release)"
    algorithm: tiered_pricing
    formula: |
      candidate ordering: all HiredJudgeContracts of the tournament in the variant's status set,
        sorted created_at ASC, tie-break rounds_requested ASC (never id).
      C_pre(contract) = sum of rounds_requested of contracts earlier in the ordering.
      premium_rounds = max(0, min(rounds_requested, C_pre + rounds_requested - PREMIUM_THRESHOLD_ROUNDS))
      base_rounds = rounds_requested - premium_rounds
      fee = base_rounds * HIRED_ROUND_BASE_CENTS + premium_rounds * HIRED_ROUND_PREMIUM_CENTS
      (chronological: the same contract's fee depends on which earlier-created contracts are in the status set)
    input_set: "QUOTE: contracts in {REQUESTED, FILLED, CONFIRMED, DISPUTED, PAID}; FINAL: contracts in {FILLED, CONFIRMED, DISPUTED, PAID} (REQUESTED excluded)"
    constants:
      PREMIUM_THRESHOLD_ROUNDS: 8
      HIRED_ROUND_BASE_CENTS: 5000
      HIRED_ROUND_PREMIUM_CENTS: 7500
    precision: "integer cents (rates are whole cents; no rounding needed)"
    variants:
      - name: PROVISIONAL_QUOTE
        when: "contract creation (REQUESTED)"
        difference: "candidate set includes other schools' still-REQUESTED contracts, so the quote can price some rounds at the premium rate that the FINAL fee prices at base once those requests never fill"
      - name: FINAL_INVOICE
        when: "contract accept (CONFIRMED) and on rounds change"
        difference: "candidate set excludes REQUESTED contracts; fee is frozen on final_fee_cents and feeds the school invoice"

  - name: entry_fee_total
    trigger: "entry confirm"
    algorithm: aggregation
    formula: |
      per-entry fee at confirm time:
        base = tournament.entry_fee_cents
        if tournament.late_fee_starts_at is set AND current logical UTC >= late_fee_starts_at:
          fee_charged_cents = round_half_up(base * (1 + tournament.late_fee_surcharge_pct))
        else:
          fee_charged_cents = base
      entry_fees_subtotal = sum of fee_charged_cents over entries in {CONFIRMED, COMPETING, ADVANCED, ELIMINATED, FINISHED}
      ROUNDING ORDER PINNED: the surcharge is rounded per entry at confirm time, then summed;
        summing bases and then applying the surcharge yields a different total and is forbidden.
    input_set: "school's entries in the invoice status set"
    precision: "2 decimal places, round_half_up, applied per entry before summation"

  - name: school_invoice_total
    trigger: "entry confirm/withdraw, contract accept/pay/auto-release, dispute resolve (no fee change), school read"
    algorithm: threshold
    formula: |
      entry_fees = entry_fee_total subtotal for the school
      judge_fees = sum of final_fee_cents over contracts in {CONFIRMED, DISPUTED, PAID}
      pre_discount = entry_fees + judge_fees
      EVALUATION ORDER PINNED (circular-looking dependency resolved):
        1. compute pre_discount
        2. select discount tier keyed on PRE-discount value:
             pre_discount >= 100000 -> 10%;  pre_discount >= 50000 -> 5%;  else 0%
           (the tier does NOT change even though applying it may drop the total below the threshold)
        3. discount_cents = round_half_up(entry_fees * pct) + round_half_up(judge_fees * pct)
           (round per component, then sum — rounding the combined amount is forbidden)
        4. payments = sum of final_fee_cents over contracts in {PAID}
        5. invoice_balance_cents = pre_discount - discount_cents - payments
    input_set: "school entries in invoice status set; school contracts in invoiced status sets"
    constants:
      DISCOUNT_TIER_2_THRESHOLD_CENTS: 100000
      DISCOUNT_TIER_2_PCT: 0.10
      DISCOUNT_TIER_1_THRESHOLD_CENTS: 50000
      DISCOUNT_TIER_1_PCT: 0.05
    precision: "2 decimal places, round_half_up, per component before summation"

  - name: speaker_point_tabulation
    trigger: "round tabulate; ballot void (recompute)"
    algorithm: aggregation
    formula: |
      For a DEBATE entry:
        contributions = speaker points from each VERIFIED ballot of the entry's prelim pairings,
                        plus one bye-award contribution of BYE_SPEAKER_POINTS per bye received.
        speaker_points_raw = sum(contributions)
        wins = count of VERIFIED ballots where winner_entry_id == entry, plus bye awards
        losses = count of VERIFIED ballots where entry is a pairing member and winner_entry_id != entry
    input_set: "VERIFIED ballots of PRELIM rounds in the entry's division; VOIDED excluded"
    constants:
      BYE_SPEAKER_POINTS: 27
      SPEAKER_POINT_MIN: 20
      SPEAKER_POINT_MAX: 30
    precision: "integer points"
    variants:
      - name: RAW_TOTAL
        when: "speaker_points_raw field"
        difference: "plain sum of all contributions"
      - name: HIGH_LOW_ADJUSTED
        when: "speaker_points_adjusted field, used in standings tie-break"
        difference: "with >= 3 contributions, raw minus the maximum minus the minimum contribution; with < 3 contributions, equals raw — identical data, different number"

  - name: speech_rank_tabulation
    trigger: "round tabulate; ballot void (recompute)"
    algorithm: aggregation
    formula: |
      For a SPEECH entry:
        contributions = (8 - rank) from each VERIFIED ballot covering the entry's prelim sections.
        rank_points_raw = sum(contributions)
        rank_points_adjusted = with >= 3 VERIFIED ballots: raw - max(contribution) - min(contribution); else raw
        first_place_count = count of VERIFIED ballots where entry's rank == 1
    input_set: "VERIFIED ballots of PRELIM rounds in the entry's division; VOIDED excluded"
    precision: "integer points"

  - name: prelim_standings_ranking
    trigger: "round tabulate; determine-breaks; division standings read"
    algorithm: weighted_scoring
    formula: |
      Candidate set: division entries with status in {COMPETING, ADVANCED, ELIMINATED, FINISHED}.
      DEBATE order: wins DESC, speaker_points_adjusted DESC, opponent_strength DESC,
                    speaker_points_raw DESC, created_at ASC (final tie-break; id never used).
      SPEECH order: rank_points_adjusted DESC, rank_points_raw DESC, first_place_count DESC,
                    created_at ASC.
      prelim_rank = 1-based position in that order after the latest tabulated prelim round.
    input_set: "division entries in competition statuses"
    precision: "integer rank; ties impossible after created_at ASC final tie-break"

  - name: opponent_strength
    trigger: "round tabulate (debate divisions)"
    algorithm: aggregation
    formula: |
      opponent_strength(entry) = sum over distinct opponents met in PRELIM rounds
                                 of that opponent's current wins (post-this-round recompute).
      Bye rounds contribute no opponent. Speech entries: always 0.
      Evaluation order at tabulate: first recompute all wins for the division, then opponent_strength.
    input_set: "VERIFIED ballots of the division's PRELIM rounds"
    precision: "integer wins"

  - name: break_determination
    trigger: "POST /divisions/{id}/determine-breaks"
    algorithm: threshold
    formula: |
      n = competing_entry_count for the division (entries in {COMPETING})
      if n < 4: fail ERR_INSUFFICIENT_BREAK_CANDIDATES
      W = tournament.prelim_round_count
      win_threshold = floor(W / 2) + 1                      # strictly more wins than losses
      candidates = DEBATE: entries with wins >= win_threshold (boundary: wins == threshold qualifies,
                   wins == threshold - 1 does not);  SPEECH: all COMPETING entries
      size_cap = largest power of two <= floor(n / 2), capped at 16
      bracket_size = largest power of two <= min(size_cap, |candidates|)
      if bracket_size < 2: fail ERR_INSUFFICIENT_BREAK_CANDIDATES
      advancing = first bracket_size entries of the division's standings order restricted to candidates
      advancing entries -> ADVANCED with seed 1..bracket_size in standings order
      all other COMPETING entries -> ELIMINATED with final_placement = NON_BREAKING
    input_set: "COMPETING entries of the division; requires all PRELIM rounds TABULATED"
    precision: "integer; >= boundary on win_threshold is exact"

  - name: pairing_generation
    trigger: "POST /rounds/{id}/generate-pairings"
    algorithm: constraint_propagation
    formula: |
      Eligible entries (division, status COMPETING for PRELIM; ADVANCED for ELIM):
      PRELIM DEBATE, round 1: order by created_at ASC; pair adjacent (1v2, 3v4, ...).
      PRELIM DEBATE, round r>1: order by standings; group into win-brackets; pair high-high within
        bracket (1v2, 3v4 ...); a bracket with odd count sends its lowest-ordered entry DOWN to be
        paired high-high within the next lower bracket (recursive).
      Same-school matchup and rematch (pair that already met in an earlier PRELIM round of this
        division) are HARD constraints: if no complete valid arrangement exists, persist nothing and
        fail ERR_PAIRING_INFEASIBLE. Resolution search: try swapping the conflicting pairing's second
        member with the next available entry in order; exhaustive in created_at-guided order.
      BYE: if eligible count is odd, exactly one bye goes to the lowest-ordered entry with
        has_received_bye == false (if all have one, the lowest-ordered overall); bye pairing is
        created VERIFIED, winner = that entry, and contributes (win, BYE_SPEAKER_POINTS).
        The bye pairing is emitted after all regular pairings of the round (list order).
      PRELIM SPEECH: order by standings (round 1: created_at ASC); num_sections = ceil(n / 7);
        sections sized as equally as possible (sizes differ by <= 1, larger sections first);
        serpentine distribution by order (entry i -> section snake(i)); no same-school or rematch
        avoidance in speech (pinned: sections never reject for conflicts).
      ELIM DEBATE: field must be a power of two (guaranteed by break_determination); seed i paired
        with seed (field + 1 - i). ELIM SPEECH: serpentine by seed into sections of <= 7; field <= 7
        produces a single final section.
      Elimination rounds ignore same-school and rematch constraints (pinned).
      Sides: within a debate pairing, first-ordered entry is AFF, second is NEG.
    input_set: "division entries in the phase-appropriate status"
    constants:
      SECTION_MAX_SIZE: 7
    precision: "deterministic; every ordering falls back to created_at ASC, never id"

  - name: elim_placement
    trigger: "ELIM round tabulate (losers), tournament complete (champions/runners-up)"
    algorithm: threshold
    formula: |
      Let F = number of ADVANCED entries in the division at the start of the elim round.
      DEBATE loser placement by F: F == 2 -> RUNNER_UP; F in {3,4} -> SEMIFINALIST;
        F in [5,8] -> QUARTERFINALIST; F in [9,16] -> OCTOFINALIST.
      SPEECH: non-advancing section members take the same F-based tier, except the final section
        (F <= 7 and no further elim rounds): ranks 3..4 -> SEMIFINALIST, ranks 5..7 -> QUARTERFINALIST.
      At tournament complete: debate still-ADVANCED entry -> CHAMPION; speech final-section
        rank 1 -> CHAMPION, rank 2 -> RUNNER_UP.
    input_set: "ADVANCED entries of the division at the elim round's tabulation"
    precision: "exact tier boundaries on F"

  - name: qualification_points_award
    trigger: "POST /tournaments/{id}/publish-results"
    algorithm: threshold
    formula: |
      qualification_points = table[final_placement]:
        CHAMPION 10, RUNNER_UP 8, SEMIFINALIST 6, QUARTERFINALIST 4, OCTOFINALIST 2, NON_BREAKING 1.
      WITHDRAWN entries: 0. Computed once at publication; immutable afterwards.
    input_set: "all entries of the tournament not in status REGISTERED"
    precision: "integer points"

  - name: logistics_demand
    trigger: "recomputed on registration-graph mutation while order is DRAFT; frozen at submit"
    algorithm: aggregation
    formula: |
      CATERING:
        headcount_demand = (entries of tournament in {COMPETING, ADVANCED, ELIMINATED, FINISHED})
                           + (Judges of tournament with status == COMMITTED)
                           + tournament.tournament_staff_count
        meal_count = ceil(headcount_demand * 1.10)
      AWARDS:
        awards_count = sum of bracket_size over divisions of the tournament with bracket_size set
      At submit: frozen_meal_count / frozen_awards_count snapshot the live values;
      after submit the live fields keep recomputing but the frozen fields never change.
    input_set: "tournament entries/judges/divisions as filtered above"
    precision: "integer; ceil after the 1.10 multiplier"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role value is one of the declared roles", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's role list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ownership: SchoolCoach's X-User-ID equals the target School.id (or resource's school FK); Judge's X-User-ID equals the ballot's pairing.judge_id", error_id: ERR_RESOURCE_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "SchoolCoach and Judge write endpoints" }
  - { priority: 4, category: existence, check: "every id in path or body exists, validated left-to-right (path first, then body fields in input order)", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: "all endpoints with resource ids" }
  - { priority: 5, category: state, check: "tournament phase gate for the operation (writes into registration graph only while REGISTRATION_OPEN; pairing/tabulation only in the matching phase; publish only from COMPLETED)", error_id: ERR_TOURNAMENT_PHASE_FORBIDDEN, http_status: 409, applies_to: "all phase-gated endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals parent's current version (evaluated before entity-state preconditions so a stale view is always reported as 412)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /tournaments/{id}/lock-registration; POST /rounds/{id}/generate-pairings; POST /hired-judge-contracts" }
  - { priority: 7, category: state, check: "target entity in required state (entry/school/judge/round/pairing/ballot/contract/order state preconditions), including aggregate gates: ERR_SCHOOLS_NOT_LOCK_READY, ERR_ROUNDS_NOT_SCHEDULED, ERR_ROUNDS_NOT_TABULATED, ERR_BREAKS_NOT_DETERMINED, ERR_UNPAID_CONTRACTS_REMAIN, ERR_INSUFFICIENT_BREAK_CANDIDATES", error_id: "ERR_<ENTITY>_INVALID_STATE or gate-specific", http_status: 409, applies_to: "state-transition endpoints" }
  - { priority: 8, category: business_safety, check: "judge conflict of interest: judge may not be assigned to a pairing involving an entry of (a) the judge's own school_id, or (b) any school in the judge's JudgeConflicts", error_id: ERR_JUDGE_CONFLICT_OF_INTEREST, http_status: 409, applies_to: "POST /pairings/{id}/assign-judge" }
  - { priority: 9, category: business_safety, check: "low-point win: debate ballot where winner total speaker points < loser total requires allow_low_point_win == true", error_id: ERR_LOW_POINT_WIN_NOT_FLAGGED, http_status: 422, applies_to: "POST /ballots, POST /ballots/{id}/submit" }
  - { priority: 10, category: business_constraint, check: "structural caps and uniqueness: per-school division cap (count < cap to create), global division cap, event_code matches event_type family, commitment_rounds in [1, prelim_round_count], round_number unique per division, one non-FULFILLED LogisticsOrder per kind, pairing algorithm feasibility", error_id: "ERR_SCHOOL_ENTRY_CAP_EXCEEDED | ERR_DIVISION_GLOBAL_CAP_REACHED | ERR_EVENT_CODE_TYPE_MISMATCH | ERR_COMMITMENT_ROUNDS_INVALID | ERR_ROUND_NUMBER_EXISTS | ERR_ORDER_KIND_EXISTS | ERR_PAIRING_INFEASIBLE | ERR_JUDGE_OVER_COMMITTED", http_status: 409, applies_to: "create/action endpoints" }
  - { priority: 11, category: business_constraint, check: "ballot field validity: speaker points integers in [20,30] covering every pairing member; speech ranks integers in [1, section size], unique within the ballot, covering every section member; winner_entry_id is a pairing member", error_id: "ERR_SPEAKER_POINTS_OUT_OF_RANGE | ERR_RANK_INVALID | ERR_DUPLICATE_RANK_IN_SECTION | ERR_WINNER_NOT_IN_PAIRING", http_status: 422, applies_to: "POST /ballots, POST /ballots/{id}/submit" }
  - { priority: 12, category: business_constraint, check: "hired-judge purchase sizing: rounds_requested in [1, school.shortfall_rounds] at creation", error_id: ERR_HIRED_ROUNDS_EXCEED_SHORTFALL, http_status: 422, applies_to: "POST /hired-judge-contracts" }
  - { priority: 13, category: business_temporal, check: "room occupation uses half-open interval [starts_at, ends_at): assigning a room to a pairing is rejected iff another pairing in the same tournament holds the room with starts_at < new.ends_at AND new.starts_at < ends_at; touching endpoints (end == start) is allowed, zero buffer", error_id: ERR_ROOM_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /pairings/{id}/assign-room" }
  - { priority: 14, category: business_temporal, check: "judge buffered occupation: assigning a judge is rejected iff any other pairing staffed by the judge has a slot overlapping the new slot OR separated by a gap < JUDGE_TURNOVER_MINUTES (30) on either side; a gap of exactly 30 minutes is allowed", error_id: ERR_JUDGE_TURNOVER_CONFLICT, http_status: 409, applies_to: "POST /pairings/{id}/assign-judge" }
  - { priority: 15, category: business_temporal, check: "windows on the logical clock: open-registration requires now >= registration_opens_at; lock requires now >= registration_locks_at; ballot submit requires now <= round.ends_at + 60 minutes", error_id: "ERR_REGISTRATION_WINDOW_NOT_OPEN | ERR_REGISTRATION_WINDOW_CLOSED | ERR_BALLOT_WINDOW_CLOSED", http_status: 409, applies_to: "phase transitions and ballot submit" }
  - { priority: 16, category: business_referential, check: "cross-tournament integrity: every referenced entity (school, division, entry, judge, room, round, pairing, contract, order) must belong to the same tournament as the operation's context", error_id: ERR_CROSS_TOURNAMENT_REFERENCE, http_status: 409, applies_to: "endpoints with multiple resource references" }
  - { priority: 17, category: business_fiscal, check: "credit ceiling: entry confirm rejected when projected school invoice_balance_cents after the confirm would exceed school.credit_limit_cents (when set)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /entries/{id}/confirm" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Tournament lifecycle ---
  - { method: POST, path: "/tournaments", description: "Create tournament (starts DRAFT, results HIDDEN)", roles: [TournamentDirector], code: 201, input: [name, registration_opens_at, registration_locks_at, "prelim_round_count?", "entry_fee_cents?", "tournament_staff_count?", "late_fee_starts_at?", "late_fee_surcharge_pct?"], output: Tournament, side_effects: [] }
  - { method: GET, path: "/tournaments", description: "List tournaments", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["limit?", "offset?"], output: "Tournament[]", side_effects: [] }
  - { method: GET, path: "/tournaments/{id}", description: "Get tournament", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: Tournament, side_effects: [] }
  - { method: POST, path: "/tournaments/{id}/open-registration", description: "DRAFT -> REGISTRATION_OPEN; requires logical clock >= registration_opens_at", roles: [TournamentDirector], code: 200, input: [], output: Tournament, side_effects: ["status transition; Tournament.version +1"] }
  - { method: POST, path: "/tournaments/{id}/lock-registration", description: "REGISTRATION_OPEN -> REGISTRATION_LOCKED. Gates: clock >= locks_at; every school CONFIRMED and SATISFIED; OCC on Tournament.version", roles: [TournamentDirector], code: 200, input: [expected_tournament_version], output: Tournament, side_effects: ["status transition; increments Tournament.version by 1"] }
  - { method: POST, path: "/tournaments/{id}/start-prelims", description: "REGISTRATION_LOCKED -> PRELIMS_ACTIVE; cascades CONFIRMED entries to COMPETING", roles: [TournamentDirector], code: 200, input: [], output: Tournament, side_effects: ["entries CONFIRMED -> COMPETING; increments Tournament.version by 1"] }
  - { method: POST, path: "/tournaments/{id}/start-elims", description: "PRELIMS_ACTIVE -> ELIMS_ACTIVE; gates: all prelim rounds TABULATED, breaks determined", roles: [TournamentDirector], code: 200, input: [], output: Tournament, side_effects: ["increments Tournament.version by 1"] }
  - { method: POST, path: "/tournaments/{id}/complete", description: "ELIMS_ACTIVE -> COMPLETED; gates: all elim rounds TABULATED; resolves CHAMPION/RUNNER_UP placements", roles: [TournamentDirector], code: 200, input: [], output: Tournament, side_effects: ["ADVANCED entries -> FINISHED with final placements; increments Tournament.version by 1"] }
  - { method: POST, path: "/tournaments/{id}/publish-results", description: "results_visibility HIDDEN -> PUBLISHED (requires status COMPLETED); computes qualification_points on every non-WITHDRAWN entry (0 for WITHDRAWN)", roles: [TournamentDirector], code: 200, input: [], output: Tournament, side_effects: ["Entry.qualification_points set; increments Tournament.version by 1"] }
  - { method: POST, path: "/tournaments/{id}/certify-qualifications", description: "results_visibility PUBLISHED -> CERTIFIED; gate: all HiredJudgeContracts PAID or CANCELLED", roles: [TournamentDirector], code: 200, input: [], output: Tournament, side_effects: ["increments Tournament.version by 1"] }

  # --- Schools ---
  - { method: POST, path: "/schools", description: "Register a school into a tournament", roles: [TournamentDirector], code: 201, input: [tournament_id, name, "credit_limit_cents?"], output: School, side_effects: [] }
  - { method: GET, path: "/schools", description: "List schools", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["tournament_id?", "status?", "limit?", "offset?"], output: "School[]", side_effects: [] }
  - { method: GET, path: "/schools/{id}", description: "Get school with computed obligation/coverage/shortfall/invoice fields", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: School, side_effects: [] }
  - { method: POST, path: "/schools/{id}/confirm", description: "REGISTERED -> CONFIRMED; requires shortfall_rounds == 0", roles: [SchoolCoach], code: 200, input: [], output: School, side_effects: ["School.version +1; Tournament.version +1"] }
  - { method: POST, path: "/schools/{id}/unconfirm", description: "CONFIRMED -> REGISTERED while REGISTRATION_OPEN", roles: [SchoolCoach], code: 200, input: [], output: School, side_effects: ["School.version +1; Tournament.version +1"] }

  # --- Divisions ---
  - { method: POST, path: "/divisions", description: "Create an event division", roles: [TournamentDirector], code: 201, input: [tournament_id, event_type, event_code, division, "per_school_entry_cap?", "global_entry_cap?"], output: EventDivision, side_effects: [] }
  - { method: GET, path: "/divisions", description: "List divisions", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["tournament_id?", "event_type?", "limit?", "offset?"], output: "EventDivision[]", side_effects: [] }
  - { method: GET, path: "/divisions/{id}", description: "Get division", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: EventDivision, side_effects: [] }
  - { method: POST, path: "/divisions/{id}/determine-breaks", description: "Compute bracket_size, advance top entries (ADVANCED + seed), eliminate others (NON_BREAKING). Gates: PRELIMS_ACTIVE, all prelim rounds of division TABULATED, >= 2 break candidates", roles: [TabStaff], code: 200, input: [], output: EventDivision, side_effects: ["bracket_size set; Entry status/seed/placement mutations"] }
  - { method: GET, path: "/divisions/{id}/standings", description: "Division standings: entries in competition statuses sorted by prelim_rank ASC (unranked last by created_at ASC)", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["limit?", "offset?"], output: "Entry[]", side_effects: [] }

  # --- Entries ---
  - { method: POST, path: "/entries", description: "Create entry (REGISTERED) in REGISTRATION_OPEN; enforces per-school and global division caps on non-WITHDRAWN counts", roles: [SchoolCoach], code: 201, input: [school_id, division_id, competitor_name], output: Entry, side_effects: [] }
  - { method: GET, path: "/entries", description: "List entries with filters", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["school_id?", "division_id?", "status?", "limit?", "offset?"], output: "Entry[]", side_effects: [] }
  - { method: GET, path: "/entries/{id}", description: "Get entry with computed stats", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: Entry, side_effects: [] }
  - { method: POST, path: "/entries/{id}/confirm", description: "REGISTERED or WITHDRAWN -> CONFIRMED; charges fee (late surcharge after late_fee_starts_at); recomputes school obligation/invoice", roles: [SchoolCoach], code: 200, input: [], output: Entry, side_effects: ["fee_charged_cents set; School recompute (version +1); Tournament.version +1"] }
  - { method: POST, path: "/entries/{id}/withdraw", description: "CONFIRMED -> WITHDRAWN (pre-lock only); cascades: school recompute -> hired-round auto-release -> invoice recompute", roles: [SchoolCoach], code: 200, input: [], output: Entry, side_effects: ["School recompute (version +1); contract auto-release cascade; Tournament.version +1"] }

  # --- Judges & conflicts ---
  - { method: POST, path: "/judges", description: "Register a school-provided judge (REGISTERED); school_id required and must equal coach's school for SchoolCoach", roles: [SchoolCoach, TournamentDirector], code: 201, input: [tournament_id, school_id, name], output: Judge, side_effects: [] }
  - { method: GET, path: "/judges", description: "List judges", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["tournament_id?", "school_id?", "judge_type?", "status?", "limit?", "offset?"], output: "Judge[]", side_effects: [] }
  - { method: GET, path: "/judges/{id}", description: "Get judge", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: Judge, side_effects: [] }
  - { method: POST, path: "/judges/{id}/commit", description: "REGISTERED -> COMMITTED with commitment_rounds in [1, prelim_round_count]; recomputes school coverage", roles: [SchoolCoach], code: 200, input: [commitment_rounds], output: Judge, side_effects: ["School coverage recompute (version +1); Tournament.version +1"] }
  - { method: POST, path: "/judges/{id}/withdraw", description: "REGISTERED or COMMITTED -> WITHDRAWN (pre-lock only); coverage recompute", roles: [SchoolCoach], code: 200, input: [], output: Judge, side_effects: ["School coverage recompute (version +1); Tournament.version +1"] }
  - { method: POST, path: "/judge-conflicts", description: "Record that a judge may not judge a school's entries", roles: [SchoolCoach, TabStaff], code: 201, input: [judge_id, school_id, "reason?"], output: JudgeConflict, side_effects: [] }
  - { method: GET, path: "/judge-conflicts", description: "List judge conflicts", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["judge_id?", "school_id?", "limit?", "offset?"], output: "JudgeConflict[]", side_effects: [] }
  - { method: GET, path: "/judge-conflicts/{id}", description: "Get judge conflict", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: JudgeConflict, side_effects: [] }

  # --- Rooms ---
  - { method: POST, path: "/rooms", description: "Create a room", roles: [TournamentDirector], code: 201, input: [tournament_id, name, "capacity?"], output: Room, side_effects: [] }
  - { method: GET, path: "/rooms", description: "List rooms", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["tournament_id?", "limit?", "offset?"], output: "Room[]", side_effects: [] }
  - { method: GET, path: "/rooms/{id}", description: "Get room", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: Room, side_effects: [] }

  # --- Rounds & pairing ---
  - { method: POST, path: "/rounds", description: "Create a round (SCHEDULED); round_number unique within division; starts_at < ends_at", roles: [TabStaff], code: 201, input: [division_id, round_number, kind, starts_at, ends_at], output: Round, side_effects: [] }
  - { method: GET, path: "/rounds", description: "List rounds", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["division_id?", "kind?", "status?", "limit?", "offset?"], output: "Round[]", side_effects: [] }
  - { method: GET, path: "/rounds/{id}", description: "Get round", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: Round, side_effects: [] }
  - { method: POST, path: "/rounds/{id}/generate-pairings", description: "SCHEDULED -> PAIRED; runs calculations.pairing_generation; creates Pairings + PairingEntries; bye pairings created VERIFIED; OCC on Round.version", roles: [TabStaff], code: 200, input: [expected_round_version], output: Round, side_effects: ["Pairing/PairingEntry creation; bye awards applied; increments Round.version by 1"] }
  - { method: POST, path: "/rounds/{id}/open-ballots", description: "PAIRED -> BALLOTS_OPEN; requires every non-bye pairing STAFFED; cascades pairings to BALLOT_RELEASED", roles: [TabStaff], code: 200, input: [], output: Round, side_effects: ["pairings STAFFED -> BALLOT_RELEASED; Round.version +1"] }
  - { method: POST, path: "/rounds/{id}/tabulate", description: "BALLOTS_OPEN -> TABULATED; requires all pairings VERIFIED; recomputes entry stats; ELIM: resolves placements/advancement", roles: [TabStaff], code: 200, input: [], output: Round, side_effects: ["entry stats recompute; ELIM placements; Round.version +1"] }

  # --- Pairings ---
  - { method: GET, path: "/pairings", description: "List pairings", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["round_id?", "judge_id?", "room_id?", "status?", "limit?", "offset?"], output: "Pairing[]", side_effects: [] }
  - { method: GET, path: "/pairings/{id}", description: "Get pairing", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: Pairing, side_effects: [] }
  - { method: POST, path: "/pairings/{id}/assign-room", description: "Assign room; half-open interval overlap check against the room's other pairings in the tournament", roles: [TabStaff], code: 200, input: [room_id], output: Pairing, side_effects: ["pairing may become STAFFED"] }
  - { method: POST, path: "/pairings/{id}/assign-judge", description: "Assign judge; checks: conflict of interest (priority 8) before buffered turnover overlap (priority 14); COMMITTED status required; pairing in PENDING_STAFFING; assigned_round_count must be < commitment_rounds (ERR_JUDGE_OVER_COMMITTED)", roles: [TabStaff], code: 200, input: [judge_id], output: Pairing, side_effects: ["Judge.assigned_round_count +1; pairing may become STAFFED"] }
  - { method: POST, path: "/pairings/{id}/unassign-judge", description: "Remove judge from a PENDING_STAFFING/STAFFED pairing; compensation of assign-judge", roles: [TabStaff], code: 200, input: [], output: Pairing, side_effects: ["Judge.assigned_round_count -1; STAFFED pairing reverts to PENDING_STAFFING"] }

  # --- Pairing entries (junction) ---
  - { method: GET, path: "/pairing-entries", description: "List pairing memberships; sorted by draw_position ASC within a pairing", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["pairing_id?", "entry_id?", "limit?", "offset?"], output: "PairingEntry[]", side_effects: [] }
  - { method: GET, path: "/pairing-entries/{id}", description: "Get pairing membership", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: PairingEntry, side_effects: [] }

  # --- Ballots ---
  - { method: POST, path: "/ballots", description: "Judge creates a DRAFT ballot for an assigned pairing (debate: winner_entry_id + speaker_points; speech: ranks)", roles: [Judge], code: 201, input: [pairing_id, "winner_entry_id?", "speaker_points?", "ranks?", "allow_low_point_win?"], output: Ballot, side_effects: ["ballot field validation runs at create and again at submit"] }
  - { method: GET, path: "/ballots", description: "List ballots", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["pairing_id?", "judge_id?", "status?", "limit?", "offset?"], output: "Ballot[]", side_effects: [] }
  - { method: GET, path: "/ballots/{id}", description: "Get ballot", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: Ballot, side_effects: [] }
  - { method: POST, path: "/ballots/{id}/submit", description: "DRAFT -> SUBMITTED; requires pairing BALLOT_RELEASED and within ballot window", roles: [Judge], code: 200, input: [], output: Ballot, side_effects: ["pairing -> BALLOT_SUBMITTED; submitted_at set"] }
  - { method: POST, path: "/ballots/{id}/recall", description: "SUBMITTED -> DRAFT (cycle); pairing reverts to BALLOT_RELEASED", roles: [Judge], code: 200, input: [], output: Ballot, side_effects: ["pairing -> BALLOT_RELEASED"] }
  - { method: POST, path: "/ballots/{id}/verify", description: "SUBMITTED -> VERIFIED (TabStaff only — segregation of duties)", roles: [TabStaff], code: 200, input: [], output: Ballot, side_effects: ["pairing -> VERIFIED; round.pairings_verified_count +1"] }
  - { method: POST, path: "/ballots/{id}/void", description: "VERIFIED -> VOIDED; cascades: pairing -> BALLOT_RELEASED, TABULATED round reopens, entry stats recomputed", roles: [TabStaff], code: 200, input: [], output: Ballot, side_effects: ["pairing revert; round auto-reopen; entry stats recompute"] }

  # --- Hired judge contracts ---
  - { method: POST, path: "/hired-judge-contracts", description: "School purchases hired judge-rounds against its shortfall; OCC on School.version; fee_quote_cents computed (PROVISIONAL_QUOTE)", roles: [SchoolCoach], code: 201, input: [school_id, rounds_requested, expected_school_version], output: HiredJudgeContract, side_effects: ["School.version +1; Tournament.version +1"] }
  - { method: GET, path: "/hired-judge-contracts", description: "List hired judge contracts", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["school_id?", "status?", "limit?", "offset?"], output: "HiredJudgeContract[]", side_effects: [] }
  - { method: GET, path: "/hired-judge-contracts/{id}", description: "Get contract", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: HiredJudgeContract, side_effects: [] }
  - { method: POST, path: "/hired-judge-contracts/{id}/fill", description: "REQUESTED -> FILLED; creates HIRED Judge (COMMITTED, commitment = rounds_requested)", roles: [TournamentDirector], code: 200, input: [judge_name], output: HiredJudgeContract, side_effects: ["HIRED Judge created; School coverage recompute (version +1); Tournament.version +1"] }
  - { method: POST, path: "/hired-judge-contracts/{id}/accept", description: "FILLED -> CONFIRMED; computes final_fee_cents (FINAL_INVOICE variant) and adds to school invoice", roles: [SchoolCoach], code: 200, input: [], output: HiredJudgeContract, side_effects: ["School invoice recompute (version +1); Tournament.version +1"] }
  - { method: POST, path: "/hired-judge-contracts/{id}/dispute", description: "CONFIRMED -> DISPUTED", roles: [SchoolCoach], code: 200, input: [], output: HiredJudgeContract, side_effects: ["School.version +1"] }
  - { method: POST, path: "/hired-judge-contracts/{id}/resolve-dispute", description: "DISPUTED -> CONFIRMED (cycle)", roles: [TournamentDirector], code: 200, input: [], output: HiredJudgeContract, side_effects: ["School.version +1"] }
  - { method: POST, path: "/hired-judge-contracts/{id}/pay", description: "CONFIRMED -> PAID; subtracts final_fee_cents from school invoice_balance_cents", roles: [SchoolCoach], code: 200, input: [], output: HiredJudgeContract, side_effects: ["School invoice recompute (version +1); Tournament.version +1"] }
  - { method: POST, path: "/hired-judge-contracts/{id}/cancel", description: "REQUESTED -> CANCELLED (manual)", roles: [TournamentDirector], code: 200, input: [], output: HiredJudgeContract, side_effects: ["School recompute (version +1); Tournament.version +1"] }

  # --- Hosting logistics ---
  - { method: POST, path: "/logistics-orders", description: "Create a logistics order (CATERING or AWARDS); live demand fields recompute while DRAFT", roles: [TournamentDirector], code: 201, input: [tournament_id, kind], output: LogisticsOrder, side_effects: [] }
  - { method: GET, path: "/logistics-orders", description: "List logistics orders", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: ["tournament_id?", "kind?", "limit?", "offset?"], output: "LogisticsOrder[]", side_effects: [] }
  - { method: GET, path: "/logistics-orders/{id}", description: "Get logistics order", roles: [TournamentDirector, TabStaff, SchoolCoach, Judge], code: 200, input: [], output: LogisticsOrder, side_effects: [] }
  - { method: POST, path: "/logistics-orders/{id}/submit", description: "DRAFT -> SUBMITTED; freezes meal/awards counts; AWARDS requires tournament in ELIMS_ACTIVE or COMPLETED and all competing divisions' breaks determined", roles: [TournamentDirector], code: 200, input: [], output: LogisticsOrder, side_effects: ["frozen_meal_count / frozen_awards_count set"] }
  - { method: POST, path: "/logistics-orders/{id}/fulfill", description: "SUBMITTED -> FULFILLED", roles: [TournamentDirector], code: 200, input: [], output: LogisticsOrder, side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical UTC clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time.", roles: [TournamentDirector], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advance; no entity mutation"] }

