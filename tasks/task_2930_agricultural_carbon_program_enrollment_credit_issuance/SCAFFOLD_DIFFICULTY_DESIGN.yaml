          - calculations.data_packet_qc_score
          - validations[priority 21 ERR_QC_SCORE_BELOW_THRESHOLD]
          - state_machines.DataPacket.qc_axis
          - endpoints[POST /data-packets/{data_packet_id}/correct]
        distinguishing_aspect: |
          QC_PASS_MIN_SCORE 70.00 is inclusive and qc_score is a three-term weighted sum rounded
          to 2 decimals. A FARM_RECORD packet at coverage 55.00 scores exactly 69.50 and must be
          refused, and a one-point coverage correction to 56.00 scores exactly 70.00 and must be
