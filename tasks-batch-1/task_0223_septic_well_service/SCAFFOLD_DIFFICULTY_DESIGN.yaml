              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-06-22", window_start_minute: 540, estimated_gallons: 500 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: Dispatcher
          assert:
            - "Route.${route_id}.assigned_stop_count == 0"
            - "WorkOrder.${wo_id}.route_id == null"

      - name: route_booked_minutes_conserved_on_schedule_then_complete
        grounds:
          - state_machines.WorkOrder.DRAFT_to_SCHEDULED
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - entities.Route.fields.booked_minutes
        distinguishing_aspect: |
          Conserved quantity = Route.booked_minutes (a sum of durations, a different conserved
          quantity than the stop count). Schedule adds 60; completing the WO removes it from the
          counted set so booked_minutes returns to 0; sum invariant holds, no drift.
        test_recipe:
          setup:
            - "Account GOOD; Site service_minutes=60; ACTIVE tech; OPEN route; PUMPING WO scheduled (booked_minutes=60), dispatched, started."
          setup_api_calls:
