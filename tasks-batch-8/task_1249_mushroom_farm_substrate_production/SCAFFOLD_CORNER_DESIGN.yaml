  - section: validations
    instances:
      - name: request_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID / X-User-Role headers fail at priority 1 before anything else."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/rooms"
              payload: { room_code: "R1", capacity_tonnes: 50.0 }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "With both headers omitted: response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400)"
            - "No room is persisted"

      - name: room_create_forbidden_for_sales_manager
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]", roles.FarmManager]
        distinguishing_aspect: "Room creation is FarmManager-exclusive; SalesManager is rejected at priority 3 with ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/rooms"
              payload: { room_code: "R1", capacity_tonnes: 50.0 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN (HTTP 403)"

      - name: pieces_log_identity_unresolved_returns_403
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_IDENTITY_NOT_RESOLVED]"]
        distinguishing_aspect: "Identity resolution (priority 2) precedes path existence (priority 4): a crew lead whose X-User-ID is not a Worker gets ERR_IDENTITY_NOT_RESOLVED even when the flush id does not exist either."
        test_recipe:
          setup: ["Empty database (no workers, no flushes)"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/flushes/44444444-4444-4444-4444-444444444444/pieces"
              payload: { worker_id: "33333333-3333-3333-3333-333333333333", kg_picked: 10.0 }
              as: HarvestCrewLead
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_IDENTITY_NOT_RESOLVED (HTTP 403), not ERR_FLUSH_NOT_FOUND"

      - name: buyerportal_cannot_create_for_other_buyer
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_BUYER_MISMATCH]", roles.BuyerPortal]
        distinguishing_aspect: "BuyerPortal ownership rule: X-User-ID buyer b1 creating a commitment for buyer b2 is rejected with ERR_BUYER_MISMATCH."
        test_recipe:
          setup: ["Buyers b1 and b2 exist (both ACTIVE)"]
          setup_api_calls:
            - { call: "POST /api/buyers", payload: { name: "Acme Grocery" }, as: SalesManager, captures: { b1_id: $.data.id } }
            - { call: "POST /api/buyers", payload: { name: "Other Market" }, as: SalesManager, captures: { b2_id: $.data.id } }
          trigger:
            - call: "POST /api/buyer-commitments"
              payload: { buyer_id: "${b2_id}", reference: "PO-999" }
              as: BuyerPortal
              as_user_id: "${b1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BUYER_MISMATCH (HTTP 403)"
            - "GET /api/buyer-commitments?buyer_id=${b2_id} returns an empty array"

      - name: cycle_create_body_fk_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_BATCH_NOT_FOUND]"]
        distinguishing_aspect: "A body foreign key (batch_id) that does not resolve yields the resource-specific 404 even though the tunnel reference is valid."
        test_recipe:
          setup: ["Tunnel t1 exists"]
          setup_api_calls:
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
          trigger:
            - call: "POST /api/pasteurization-cycles"
              payload: { batch_id: "55555555-5555-5555-5555-555555555555", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }
              as: CompostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BATCH_NOT_FOUND (HTTP 404)"

      - name: clock_regression_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CLOCK_REGRESSION]", "endpoints.POST /api/_clock/set_current_utc"]
        distinguishing_aspect: "The logical clock is monotonic: after moving to 2026-05-03, setting 2026-05-01 is rejected."
        test_recipe:
          setup: ["Logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CLOCK_REGRESSION (HTTP 409)"
            - "A subsequent set to the same instant 2026-05-03T00:00:00Z is accepted (equality is not regression)"

      - name: commitment_create_for_suspended_buyer_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=10]", "errors[ERR_BUYER_NOT_ACTIVE]", state_machines.Buyer.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Buyer status is a conditional gate: after PATCH-suspending the buyer, commitment creation fails with ERR_BUYER_NOT_ACTIVE."
        test_recipe:
          setup: ["Buyer b1 created then suspended"]
          setup_api_calls:
            - { call: "POST /api/buyers", payload: { name: "Acme Grocery" }, as: SalesManager, captures: { buyer_id: $.data.id } }
            - { call: "PATCH /api/buyers/${buyer_id}", payload: { status: "SUSPENDED" }, as: SalesManager }
          trigger:
            - call: "POST /api/buyer-commitments"
              payload: { buyer_id: "${buyer_id}", reference: "PO-100" }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BUYER_NOT_ACTIVE (HTTP 409)"

