            - call: "POST /vendors"
              payload: { legal_name: "BoatCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /grants"
              payload: { grant_code: "G-SUS", sponsor: "NOAA", total_award_cents: 5000000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g_id}", lines: [{ commodity_code: "OCE", description: "buoy", quantity: 1, unit_price_cents: 1000000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r1_id: $.data.id }
            - call: "POST /requisitions/${r1_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: GrantOfficer
              as_user_id: "grant-officer-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
            - call: "POST /grants/${g_id}/suspend"
              as: GrantOfficer
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g_id}", lines: [{ commodity_code: "OCE", description: "rope", quantity: 1, unit_price_cents: 100000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /requisitions/${r2_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { err1: $.data.error_id }
            - call: "POST /grants/${g_id}/close"
              as: GrantOfficer
              captures: { err2: $.data.error_id }
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { enc: $.data.encumbered_cents, g_status_check: $.data.spent_cents }
          assert:
            - "submit against SUSPENDED grant: err1 == ERR_GRANT_NOT_ACTIVE"
            - "close while encumbered: err2 == ERR_GRANT_HAS_OPEN_ENCUMBRANCES (encumbrance 1,520,000 survives the suspension)"
            - "ledger unchanged by either rejection: encumbered_cents == 1520000, spent_cents == 0"

      - name: pcard_close_open_txn_and_closed_post_rejected
        claim_type: terminal_lockdown
        grounds: ["errors", "ERR_CARD_HAS_OPEN_TRANSACTIONS", "errors", "ERR_CARD_CLOSED", "state_machines.PCard"]
        distinguishing_aspect: "Close is gated on open transactions: with a POSTED debit, close fails with ERR_CARD_HAS_OPEN_TRANSACTIONS; after reconciling, close succeeds and a later post hits the CLOSED lockdown (ERR_CARD_CLOSED, distinct from the SUSPENDED error)."
        test_recipe:
          setup: ["Department; card with one DEBIT 40,000 POSTED"]
          setup_api_calls:
