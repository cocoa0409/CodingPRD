scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_tiered_vs_per_sf_diverge
        grounds:
          - calculations.fee_quote
          - entities.Engagement.fields.fee_schedule
          - entities.Engagement.fields.quoted_fee_cents
        distinguishing_aspect: |
          Entity domain = Engagement pricing. Identical engagement inputs
          (STANDARD tier, 30000 sf, 2 planned approaches, 20-day expedited
          turnaround, client total 0) price differently under the two pinned
          variants: TIERED = (450000 + 0 + 75000) * 1.25 = 656250 cents;
          PER_SF = 18 * 30000 + 100000 = 640000 cents.
        test_recipe:
          setup:
            - "Client exists with total_billed_cents == 0"
            - "Two appraisers exist (author, reviewer)"
            - "Two engagements submitted, identical except fee_schedule (TIERED vs PER_SF), STANDARD tier (OFFICE 30000 sf FINANCING), 20-day turnaround (expedited), 2 planned approaches"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "100 Main St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 20, planned_approach_count: 2, fee_schedule: "TIERED", is_contingent_fee: false }
              as: EngagementManager
              captures: { eng_t_id: $.data.id }
            - call: "POST /engagements/${eng_t_id}/submit"
              payload: {}
              as: EngagementManager
              captures: { eng_t_quote: $.data.quoted_fee_cents }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "100 Main St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 20, planned_approach_count: 2, fee_schedule: "PER_SF", is_contingent_fee: false }
              as: EngagementManager
              captures: { eng_p_id: $.data.id }
            - call: "POST /engagements/${eng_p_id}/submit"
              payload: {}
              as: EngagementManager
              captures: { eng_p_quote: $.data.quoted_fee_cents }
          trigger:
            - call: "GET /engagements/${eng_t_id}"
              as: EngagementManager
            - call: "GET /engagements/${eng_p_id}"
              as: EngagementManager
          assert:
            - "Engagement.${eng_t_id}.quoted_fee_cents == 656250"
            - "Engagement.${eng_p_id}.quoted_fee_cents == 640000"
            - "Engagement.${eng_t_id}.quoted_fee_cents != Engagement.${eng_p_id}.quoted_fee_cents"

      - name: noi_trailing_vs_stabilized_diverge
        grounds:
          - calculations.noi_variants
          - calculations.direct_capitalization_value
          - entities.DataSubmission.fields.noi_trailing_cents
          - entities.DataSubmission.fields.noi_stabilized_cents
        distinguishing_aspect: |
          Entity domain = operating-statement analysis (distinct from the
          Engagement pricing domain of fee_tiered_vs_per_sf_diverge). The same
          accepted statement (gross 12000000, vacancy 600000, reimbursements
          300000, expenses 4000000) yields TRAILING_ACTUAL NOI 7700000 but
          STABILIZED NOI 7460000; the INCOME direct-cap approach consumes the
          STABILIZED variant (7460000 * 10000 / 700 = 106571429).
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS (STANDARD, TIERED, 30000 sf, 30-day turnaround, fee 450000)"
            - "One OPERATING_STATEMENT accepted; two selected comparables on the engagement"
            - "One INCOME approach (cap 700 bps, weight 100.00) completed"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "100 Main St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1, fee_schedule: "TIERED", is_contingent_fee: false }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /engagements/${eng_id}/data-submissions"
              payload: { submission_type: "OPERATING_STATEMENT", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", scheduled_gross_rent_cents: 12000000, vacancy_loss_cents: 600000, expense_reimbursements_cents: 300000, operating_expenses_cents: 4000000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { ds_id: $.data.id }
            - call: "POST /data-submissions/${ds_id}/accept"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng_id}/comparables"
              payload: { address: "200 Oak Ave", sale_date: "2026-03-01T00:00:00Z", sale_price_cents: 10000000, noi_at_sale_cents: 650000, size_sf: 5000, adjustment_pct: 0, selected_for_support: true }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng_id}/comparables"
              payload: { address: "300 Elm St", sale_date: "2026-05-01T00:00:00Z", sale_price_cents: 8000000, noi_at_sale_cents: 600000, size_sf: 4000, adjustment_pct: -4.00, selected_for_support: true }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng_id}/approaches"
              payload: { approach_type: "INCOME", weight_pct: 100.00, cap_rate_bps: 700 }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
              captures: { apr_id: $.data.id }
            - call: "POST /approaches/${apr_id}/complete"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
          trigger:
            - call: "GET /data-submissions/${ds_id}"
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "GET /approaches/${apr_id}"
              as: StaffAppraiser
              as_user_id: "${aa_id}"
          assert:
            - "DataSubmission.${ds_id}.noi_trailing_cents == 7700000"
            - "DataSubmission.${ds_id}.noi_stabilized_cents == 7460000"
            - "DataSubmission.${ds_id}.noi_trailing_cents != DataSubmission.${ds_id}.noi_stabilized_cents"
            - "ValuationApproach.${apr_id}.indicated_value_cents == 106571429  (consumes STABILIZED)"

  # ===================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_quote_multifactor_mode_a
        grounds:
          - calculations.fee_quote
          - calculations.complexity_tier_assignment
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — tier base (HIGH
          via SPECIAL_PURPOSE) + ceil-bucket size surcharge (65001 sf -> 2
          blocks) + per-approach addon (3 planned -> 150000) + expedited
          multiplier (30 < 45 -> x1.25): (900000 + 30000 + 150000) * 1.25 =
          1350000 cents.
        test_recipe:
          setup:
            - "Client with total_billed_cents == 0"
            - "Engagement: SPECIAL_PURPOSE, 65001 sf, FINANCING, 3 planned approaches, turnaround 30, TIERED, submitted"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "1 Special Way", property_type: "SPECIAL_PURPOSE", building_sf: 65001, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 3, fee_schedule: "TIERED", is_contingent_fee: false }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_tier: $.data.complexity_tier }
          trigger:
            - call: "POST /engagements/${eng_id}/submit"
              payload: {}
              as: EngagementManager
          assert:
            - "Engagement.${eng_id}.complexity_tier == HIGH"
            - "Engagement.${eng_id}.quoted_fee_cents == 1350000"

      - name: reconciled_value_round_per_approach_then_sum_mode_b
        grounds:
          - calculations.reconciled_value
          - state_machines.Report.DRAFTING_to_INTERNAL_REVIEW
        distinguishing_aspect: |
          Mode (b): nested rounding order — scaffold pins round-per-approach
          THEN sum. With indicated values 106571429 / 58800000 / 21000002 at
          weights 40/30/30, round-then-sum = 66568573 while sum-then-round =
          66568572; the conforming answer is exactly 66568573.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS (30000 sf building)"
            - "ACCEPTED OPERATING_STATEMENT (NOI stabilized 7460000); two selected comparables (supported cap 685)"
            - "INCOME approach cap 700 -> indicated 106571429, weight 40.00, COMPLETE"
            - "SALES_COMPARISON approach -> indicated 58800000, weight 30.00, COMPLETE"
            - "COST approach (land 20000002, replacement 1000000, dep 0) -> indicated 21000002, weight 30.00, COMPLETE"
            - "Report created in DRAFTING"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "100 Main St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 3, fee_schedule: "TIERED", is_contingent_fee: false }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /engagements/${eng_id}/data-submissions"
              payload: { submission_type: "OPERATING_STATEMENT", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", scheduled_gross_rent_cents: 12000000, vacancy_loss_cents: 600000, expense_reimbursements_cents: 300000, operating_expenses_cents: 4000000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { ds_id: $.data.id }
            - call: "POST /data-submissions/${ds_id}/accept"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng_id}/comparables"
              payload: { address: "200 Oak Ave", sale_date: "2026-03-01T00:00:00Z", sale_price_cents: 10000000, noi_at_sale_cents: 650000, size_sf: 5000, adjustment_pct: 0, selected_for_support: true }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng_id}/comparables"
              payload: { address: "300 Elm St", sale_date: "2026-05-01T00:00:00Z", sale_price_cents: 8000000, noi_at_sale_cents: 600000, size_sf: 4000, adjustment_pct: -4.00, selected_for_support: true }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng_id}/approaches"
              payload: { approach_type: "INCOME", weight_pct: 40.00, cap_rate_bps: 700 }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
              captures: { ap_inc: $.data.id }
            - call: "POST /engagements/${eng_id}/approaches"
              payload: { approach_type: "SALES_COMPARISON", weight_pct: 30.00 }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
              captures: { ap_sal: $.data.id }
            - call: "POST /engagements/${eng_id}/approaches"
              payload: { approach_type: "COST", weight_pct: 30.00, land_value_cents: 20000002, replacement_cost_cents: 1000000, depreciation_pct: 0 }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
              captures: { ap_cst: $.data.id }
            - call: "POST /approaches/${ap_inc}/complete"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /approaches/${ap_sal}/complete"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /approaches/${ap_cst}/complete"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng_id}/reports"
              payload: { expected_engagement_version: "${eng_v}" }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /reports/${rep_id}/submit_review"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
          assert:
            - "Report.${rep_id}.value_conclusion_cents == 66568573  (round per approach, then sum; sum-then-round 66568572 is non-conforming)"
            - "Report.${rep_id}.status == INTERNAL_REVIEW"

      - name: volume_discount_evaluation_order_mode_c
        grounds:
          - calculations.fee_quote
          - calculations.volume_discount_tier
          - entities.Client.fields.total_billed_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the engagement's fee feeds
          client.total_billed_cents, which keys the discount on that same fee.
          Pinned order: discount looks up the client total BEFORE this
          engagement bills. Client billed 6000000 by a first delivered
          engagement (PER_SF HIGH: 30 * 200000), so a second STANDARD TIERED
          quote = round(450000 * 0.95) = 427500, not 450000, and never
          self-referential.
        test_recipe:
          setup:
            - "Client exists; first engagement (OFFICE 200000 sf -> HIGH, PER_SF, 45-day turnaround, 1 approach) delivered end-to-end, billing 6000000"
            - "Second engagement (OFFICE 30000 sf -> STANDARD, TIERED, 30-day turnaround, 1 approach) created and submitted"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Mary Mai", designation: "MAI" }
              as: EngagementManager
              captures: { mm_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "9 Tower Rd", property_type: "OFFICE", building_sf: 200000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 45, planned_approach_count: 1, fee_schedule: "PER_SF", is_contingent_fee: false }
              as: EngagementManager
              captures: { eng1_id: $.data.id }
            - call: "POST /engagements/${eng1_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng1_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng1_v: $.data.version }
            - call: "POST /engagements/${eng1_id}/data-submissions"
              payload: { submission_type: "OPERATING_STATEMENT", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", scheduled_gross_rent_cents: 12000000, vacancy_loss_cents: 600000, expense_reimbursements_cents: 300000, operating_expenses_cents: 4000000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { ds1_id: $.data.id }
            - call: "POST /data-submissions/${ds1_id}/accept"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng1_id}/comparables"
              payload: { address: "200 Oak Ave", sale_date: "2026-03-01T00:00:00Z", sale_price_cents: 10000000, noi_at_sale_cents: 650000, size_sf: 5000, adjustment_pct: 0, selected_for_support: true }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng1_id}/approaches"
              payload: { approach_type: "INCOME", weight_pct: 100.00, cap_rate_bps: 700 }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /approaches/${ap1_id}/complete"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements/${eng1_id}/reports"
              payload: { expected_engagement_version: "${eng1_v}" }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
              captures: { rep1_id: $.data.id }
            - call: "POST /reports/${rep1_id}/submit_review"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /reports/${rep1_id}/review_approve"
              payload: {}
              as: ReviewAppraiser
              as_user_id: "${rr_id}"
            - call: "POST /reports/${rep1_id}/issue_to_client"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /reports/${rep1_id}/finalize"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /reports/${rep1_id}/sign"
              payload: {}
              as: MAISigner
              as_user_id: "${mm_id}"
            - call: "POST /reports/${rep1_id}/deliver"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "100 Main St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1, fee_schedule: "TIERED", is_contingent_fee: false }
              as: EngagementManager
              captures: { eng2_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng2_id}/submit"
              payload: {}
              as: EngagementManager
