# =============================================================================
# Task 2034 — Law Firm Conflicts Check & New Matter Intake
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design
# (§1.9) live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml /
# SCAFFOLD_CORNER_DESIGN.yaml and are NOT top-level keys here.
# =============================================================================

scenario: |
  2034. Law Firm Conflicts Check & New Matter Intake (AmLaw firm intake department): party/affiliate name normalization & search across matters, conflict hit review by responsible attorney, ethical wall creation & access restriction, waiver request & client consent documentation, engagement letter generation with scope/rate terms, client credit check & retainer requirement, matter number assignment & billing setup, lateral hire conflicts imputation

domain_name: law-firm-intake
api_prefix: /intake

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Access control matrix"
  complexity_layers:
    - cascading_side_effects        # waiver revoke -> hit -> clearance -> letter VOID; lateral sweep -> hits -> clearance flips -> walls
    - dual_variant_calculation      # STRICT vs PHONETIC match scoring; V_RECENT vs V_BEST credit-band selection
    - optimistic_concurrency        # OCC on Matter.version for PATCH and engagement-letter create-with-supersede
    - rate_threshold_triggers       # credit band 740/670 boundaries; retainer funded-at-exact-required; waiver/credit expiry boundaries
  entity_topology: graph            # Party self-referential affiliate tree + MatterParty many-to-many + cross-aggregate ConflictHit links
  state_machine_shape: parallel     # Matter.lifecycle_status x Matter.clearance_status evolve independently; WaiverRequest/ConflictHit/RetainerDeposit are cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many                  # MatterParty junction: Party <-> Matter
    - self_referential              # Party.affiliate_of_id -> Party.id (affiliate tree, cycle-checked)
    - cross_aggregate               # ConflictHit links ConflictCheck -> Party + Matter across aggregates
  role_model: segregation_of_duties # waiver requester (responsible attorney) != waiver approver (conflicts partner); walls administered only by ConflictsPartner
  consistency_model: immediate      # every mutation + cascade visible in the same request's response / immediate re-read

# =============================================================================
# §1.1 Entity-Relationship Table
# All entities carry common_fields: true  =>  id (server-minted UUID, no type
# prefix), created_at / updated_at (ISO 8601 UTC, 3 fractional digits),
# version (integer, starts at 1, +1 on every mutation of that row including
# cascaded side effects that write to the row).
# =============================================================================
entities:
  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered or full legal name as supplied at intake" }
      - { name: party_type, type: enum, source: input, description: "CORPORATION | INDIVIDUAL | PARTNERSHIP | TRUST | GOVERNMENT" }
      - { name: aliases, type: array, source: input, description: "List of {alias_name, normalized_alias} objects (DBA/former/misspelling names); normalized_alias computed per calculations.name_normalization on add", default: [] }
      - { name: normalized_name, type: string, source: computed, description: "Result of calculations.name_normalization over legal_name" }
      - { name: phonetic_key, type: string, source: computed, description: "4-char American Soundex of normalized_name per calculations.name_normalization" }
      - { name: affiliate_of_id, type: string, source: input, description: "FK -> Party.id; parent party in the affiliate tree (null = root). Must reference an existing Party (ERR_NOT_FOUND otherwise); affiliates can only point at already-created parties, so chains are acyclic by construction", default: null }

  - name: Attorney
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Attorney full name" }
      - { name: bar_number, type: string, source: input, description: "Bar admission number" }
      - { name: practice_group, type: enum, source: input, description: "LITIGATION | CORPORATE | TAX | IP" }
      - { name: hire_type, type: enum, source: input, description: "INTERNAL | LATERAL", default: "INTERNAL" }
      - { name: lateral_employed_from, type: string, source: input, description: "YYYY-MM-DD first day of prior-firm employment; required iff hire_type=LATERAL", default: null }
      - { name: lateral_employed_to, type: string, source: input, description: "YYYY-MM-DD last day of prior-firm employment, INCLUSIVE for overlap tests; required iff hire_type=LATERAL", default: null }
      - { name: prior_client_names, type: array, source: input, description: "List of prior-firm client name strings disclosed at onboarding; required (may be empty list) iff hire_type=LATERAL. Triggers the lateral sweep", default: [] }
      - { name: status, type: enum, source: system, description: "ACTIVE | LATERAL_PENDING. LATERAL_PENDING auto-flips to ACTIVE when zero PENDING sweep hits remain for this attorney" }

  - name: Matter
    parent: null
    common_fields: true
    fields:
      - { name: matter_title, type: string, source: input, description: "Short descriptive title", default: "" }
      - { name: client_party_id, type: string, source: input, description: "FK -> Party.id; the client this matter is opened for" }
      - { name: responsible_attorney_id, type: string, source: input, description: "FK -> Attorney.id; must reference an Attorney with status=ACTIVE at assignment (ERR_ATTORNEY_NOT_ACTIVE otherwise)" }
      - { name: practice_group, type: enum, source: input, description: "LITIGATION | CORPORATE | TAX | IP" }
      - { name: lifecycle_status, type: enum, source: computed, description: "INTAKE | OPEN | CLOSED | DECLINED — independent parallel dimension from clearance_status" }
      - { name: clearance_status, type: enum, source: computed, description: "UNCHECKED | HITS_PENDING | CLEARED | BLOCKED | WAIVED — derived from non-superseded checks' hits per state_machines.Matter clearance rule" }
      - { name: matter_number, type: string, source: system, description: "Assigned exactly once at successful COUNTERSIGN: 'M' + zero-padded 6-digit counter in countersign completion order; null before", default: null }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp of the INTAKE->OPEN transition; null until countersigned", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of OPEN->CLOSED; null otherwise. Half-open interval end for overlap tests", default: null }
      - { name: decline_reason, type: string, source: input, description: "Reason text captured on DECLINE", default: "" }

  - name: MatterParty
    parent: null
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: input, description: "FK -> Matter.id; matter whose roster this row belongs to" }
      - { name: party_id, type: string, source: input, description: "FK -> Party.id; the associated party" }
      - { name: role_in_matter, type: enum, source: input, description: "ADVERSE | WITNESS | RELATED" }

  - name: ConflictCheck
    parent: null
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id; matter this check ran for (for LATERAL_SWEEP checks: the EXISTING matter the lateral's prior client matched on)" }
      - { name: check_kind, type: enum, source: system, description: "INTAKE (created via POST conflict-checks) | LATERAL_SWEEP (system-created by attorney onboarding)" }
      - { name: search_variant, type: enum, source: input, description: "STRICT | PHONETIC — input on INTAKE checks; system-fixed PHONETIC for LATERAL_SWEEP" }
      - { name: match_threshold, type: integer, source: input, description: "Minimum match_score (0..100) for a candidate to become a hit; default 60", default: 60 }
      - { name: status, type: enum, source: system, description: "COMPLETED -> SUPERSEDED. Supersede scope: only same-check_kind checks on the same matter supersede each other" }
      - { name: hit_count, type: integer, source: computed, description: "Number of ConflictHit rows produced by this check" }
      - { name: lateral_attorney_id, type: string, source: system, description: "Attribution only (not a navigable FK): Attorney.id whose onboarding triggered this sweep check; null on INTAKE checks", default: null }
      - { name: query_label, type: string, source: system, description: "For LATERAL_SWEEP: the prior_client_name string that produced this check; null on INTAKE checks", default: null }

  - name: ConflictHit
    parent: null
    common_fields: true
    fields:
      - { name: check_id, type: string, source: system, description: "FK -> ConflictCheck.id; producing check" }
      - { name: matched_party_id, type: string, source: system, description: "FK -> Party.id; candidate party that matched" }
      - { name: matched_matter_id, type: string, source: system, description: "FK -> Matter.id; the OTHER matter on which matched_party_id appears (never the check's own matter)" }
      - { name: matched_via, type: enum, source: system, description: "DIRECT (normalized_name) | ALIAS (alias value) | AFFILIATE (affiliate-tree expansion) | LATERAL (lateral-sweep name match)" }
      - { name: match_score, type: integer, source: computed, description: "0..100 per calculations.conflict_match_score; affiliate hops discounted -10 per hop" }
      - { name: review_status, type: enum, source: system, description: "PENDING | CONFIRMED | DISMISSED | WAIVED | STALE" }
      - { name: reviewed_by_attorney_id, type: string, source: system, description: "Attribution only: Attorney.id (X-User-ID) that reviewed; null while PENDING", default: null }
      - { name: review_note, type: string, source: input, description: "Optional reviewer note captured at review", default: "" }
      - { name: lateral_attorney_id, type: string, source: system, description: "Attribution only: Attorney.id of the lateral whose sweep produced this hit; null on INTAKE hits. Activation gate reads this field", default: null }

  - name: EthicalWall
    parent: null
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id; walled matter (at most one ACTIVE wall per matter)" }
      - { name: reason, type: enum, source: input, description: "CONFLICT_CONFIRMED | LATERAL_IMPUTATION | CLIENT_REQUEST" }
      - { name: memo, type: string, source: input, description: "Screening memo text", default: "" }
      - { name: excluded_attorney_ids, type: array, source: input, description: "Ordered list of Attorney.id values denied read access to the matter while wall is ACTIVE; >=1 entry at creation, deduplicated server-side" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED" }
      - { name: lifted_at, type: datetime, source: system, description: "Logical-clock timestamp of LIFT; null while ACTIVE", default: null }

  - name: WaiverRequest
    parent: null
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id; intake matter seeking the waiver" }
      - { name: conflict_hit_id, type: string, source: input, description: "FK -> ConflictHit.id; the CONFIRMED hit being waived" }
      - { name: requested_by_attorney_id, type: string, source: system, description: "Attribution: X-User-ID of the creating ResponsibleAttorney; segregation-of-duties anchor (approver must differ)" }
      - { name: proposed_terms, type: string, source: input, description: "Scope/terms text presented to the client" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | CONSENTED | DECLINED | APPROVED | REVOKED | EXPIRED" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock time of SEND; null in DRAFT", default: null }
      - { name: expires_at, type: datetime, source: computed, description: "sent_at + 30 days; expiry fires when current logical time >= expires_at (inclusive boundary)", default: null }
      - { name: consent_document_ref, type: string, source: input, description: "Document reference supplied at RECORD_CONSENT", default: null }
      - { name: decline_reason, type: string, source: input, description: "Optional reason captured at DECLINE", default: "" }
      - { name: approved_by_attorney_id, type: string, source: system, description: "Attribution: ConflictsPartner X-User-ID at APPROVE; must differ from requested_by_attorney_id", default: null }

  - name: EngagementLetter
    parent: null
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id" }
      - { name: scope_text, type: string, source: input, description: "Narrative scope of engagement" }
      - { name: fee_lines, type: array, source: input, description: "List of {description, hours (number > 0), rate_cents (integer > 0)}; >= 1 line" }
      - { name: fee_estimate_cents, type: integer, source: computed, description: "calculations.letter_fee_estimate: round per line (round_half_up) THEN sum — order pinned" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | COUNTERSIGNED | SUPERSEDED | VOID" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock time of ISSUE; countersign window = issued_at + 30 days, stale iff now > issued_at + 30d (strict)", default: null }
      - { name: countersigned_at, type: datetime, source: system, description: "Logical-clock time of COUNTERSIGN", default: null }

  - name: CreditAssessment
    parent: null
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id; assessments are ordered per matter for its client" }
      - { name: score, type: integer, source: input, description: "Credit score 300..850 inclusive" }
      - { name: band, type: enum, source: computed, description: "PRIME (score >= 740) | STANDARD (670..739) | SUBPRIME (< 670) — calculations.credit_band" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical-clock time of creation; validity window [assessed_at, assessed_at + 90d], stale iff now > assessed_at + 90d (strict)" }

  - name: RetainerDeposit
    parent: null
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id; exactly one deposit per matter, auto-created at first letter ISSUE" }
      - { name: required_cents, type: integer, source: computed, description: "calculations.retainer_required_amount over the matter's latest DRAFT/ISSUED letter and latest valid credit assessment (SUBPRIME default when none valid)" }
      - { name: funded_total_cents, type: integer, source: system, description: "Cumulative sum of all FUND amounts", default: 0 }
      - { name: refunded_total_cents, type: integer, source: system, description: "Cumulative sum of all REFUND amounts", default: 0 }
      - { name: received_cents, type: integer, source: computed, description: "= funded_total_cents - refunded_total_cents (current held balance)" }
      - { name: status, type: enum, source: computed, description: "PENDING (received==0) | PARTIALLY_FUNDED (0 < received < required) | FUNDED (received >= required, equality counts)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Matter
    initial_state: INTAKE   # lifecycle_status dimension; clearance_status dimension starts UNCHECKED
    terminal_states: [CLOSED, DECLINED]   # lifecycle terminals; clearance_status has no terminal (recomputable on OPEN matters too)
    note: |
      TWO PARALLEL DIMENSIONS on one row. lifecycle_status: INTAKE -> OPEN -> CLOSED, INTAKE -> DECLINED.
      clearance_status is a DERIVED dimension, recomputed after every event listed in the clearance rule
      below, over the hits of this matter's NON-SUPERSEDED ConflictCheck rows (both kinds):
        precedence (first match wins):
          1. any hit with review_status == CONFIRMED          -> BLOCKED
          2. else any hit with review_status == PENDING       -> HITS_PENDING
          3. else any hit with review_status == WAIVED        -> WAIVED
          4. else at least one COMPLETED check exists         -> CLEARED
          5. else                                             -> UNCHECKED
      Recompute triggers: conflict-check creation, hit review, waiver APPROVE/REVOKE, roster change
      (MatterParty add supersedes INTAKE checks), lateral-sweep hit creation, hit STALE-ing.
      Every clearance_status flip is a mutation of the Matter row (version +1, updated_at refreshed).
    transitions:
      - from: INTAKE
        to: OPEN
        trigger: "POST /intake/engagement-letters/{id}/transition action=COUNTERSIGN succeeds"
        actor: Client
        preconditions:
          - "letter.status == ISSUED and all countersign gates pass (see EngagementLetter transitions)"
        side_effects:
          - "matter.matter_number assigned ('M' + zero-padded 6-digit counter in countersign completion order)"
          - "matter.opened_at = current logical time"
          - "matter.version += 1"
      - from: INTAKE
        to: DECLINED
        trigger: "POST /intake/matters/{id}/transition action=DECLINE"
        actor: ConflictsPartner
        preconditions:
          - "lifecycle_status == INTAKE (else ERR_MATTER_NOT_INTAKE)"
        side_effects:
          - "decline_reason stored; matter.version += 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /intake/matters/{id}/transition action=CLOSE"
        actor: ResponsibleAttorney | ConflictsPartner
        preconditions:
          - "lifecycle_status == OPEN (else ERR_MATTER_NOT_OPEN)"
          - "ResponsibleAttorney caller must be the matter's responsible_attorney_id (else ERR_NOT_RESPONSIBLE_ATTORNEY)"
        side_effects:
          - "matter.closed_at = current logical time; matter.version += 1"
      - from: UNCHECKED
        to: HITS_PENDING
        trigger: "system: clearance recompute after check creation / lateral sweep"
        actor: system
        preconditions: ["recompute precedence rule 2 matches"]
        side_effects: ["matter.version += 1"]
      - from: UNCHECKED
        to: CLEARED
        trigger: "system: clearance recompute after check creation with zero hits"
        actor: system
        preconditions: ["recompute precedence rule 4 matches"]
        side_effects: ["matter.version += 1"]
      - from: HITS_PENDING
        to: CLEARED
        trigger: "system: clearance recompute after last PENDING hit DISMISSED"
        actor: system
        preconditions: ["recompute precedence rule 4 matches"]
        side_effects: ["matter.version += 1"]
      - from: HITS_PENDING
        to: BLOCKED
        trigger: "system: clearance recompute after a hit is CONFIRMED"
        actor: system
        preconditions: ["recompute precedence rule 1 matches"]
        side_effects: ["matter.version += 1"]
      - from: BLOCKED
        to: WAIVED
        trigger: "system: clearance recompute after waiver APPROVE waives the last CONFIRMED hit"
        actor: system
        preconditions: ["recompute precedence rule 3 matches"]
        side_effects: ["matter.version += 1"]
      - from: WAIVED
        to: BLOCKED
        trigger: "system: clearance recompute after waiver REVOKE un-waives a hit (CYCLE)"
        actor: system
        preconditions: ["recompute precedence rule 1 matches"]
        side_effects: ["matter.version += 1"]
      - from: CLEARED
        to: UNCHECKED
        trigger: "system: roster change supersedes the matter's INTAKE checks (CYCLE)"
        actor: system
        preconditions: ["recompute precedence rule 5 matches (no non-superseded checks remain)"]
        side_effects: ["matter.version += 1"]
      - from: CLEARED
        to: HITS_PENDING
        trigger: "system: lateral sweep creates a PENDING hit on this previously-cleared matter"
        actor: system
        preconditions: ["recompute precedence rule 2 matches"]
        side_effects: ["matter.version += 1"]
      - from: WAIVED
        to: HITS_PENDING
        trigger: "system: new PENDING hit (lateral sweep) while prior hits all WAIVED"
        actor: system
        preconditions: ["recompute precedence rule 2 matches"]
        side_effects: ["matter.version += 1"]

  - entity: ConflictCheck
    initial_state: COMPLETED   # checks run synchronously at creation
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system: (a) a new ConflictCheck of the SAME check_kind is created for the same matter, or (b) a MatterParty is added to the matter (INTAKE kind only)"
        actor: system
        preconditions:
          - "an existing COMPLETED check of the same check_kind on the same matter"
        side_effects:
          - "all of this check's hits still in review_status == PENDING become STALE (cascade, per-hit version +1)"
          - "owning matter's clearance_status recomputed"

  - entity: ConflictHit
    initial_state: PENDING
    terminal_states: [DISMISSED, STALE]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /intake/conflict-hits/{id}/review decision=CONFIRMED"
        actor: ResponsibleAttorney | ConflictsPartner
        preconditions:
          - "review_status == PENDING (else ERR_HIT_NOT_PENDING)"
          - "reviewer X-User-ID == responsible_attorney_id of the check's matter when role=ResponsibleAttorney (else ERR_NOT_RESPONSIBLE_ATTORNEY)"
        side_effects:
          - "reviewed_by_attorney_id = caller; check's matter clearance_status recomputed"
          - "if this was a LATERAL_SWEEP hit and it was the last PENDING hit for that lateral attorney: attorney LATERAL_PENDING -> ACTIVE, then walls auto-applied (see Attorney machine)"
      - from: PENDING
        to: DISMISSED
        trigger: "POST /intake/conflict-hits/{id}/review decision=DISMISSED"
        actor: ResponsibleAttorney | ConflictsPartner
        preconditions: ["same as CONFIRMED"]
        side_effects:
          - "reviewed_by_attorney_id = caller; check's matter clearance_status recomputed"
          - "same last-PENDING lateral activation check as CONFIRMED"
      - from: PENDING
        to: STALE
        trigger: "system: owning ConflictCheck superseded"
        actor: system
        preconditions: ["owning check transitions COMPLETED -> SUPERSEDED"]
        side_effects: ["matter clearance recomputed via owning check's supersede cascade"]
      - from: CONFIRMED
        to: WAIVED
        trigger: "system: a WaiverRequest referencing this hit reaches APPROVED"
        actor: system
        preconditions: ["waiver APPROVE transition succeeds with waiver.conflict_hit_id == this hit"]
        side_effects: ["matter clearance_status recomputed (may yield WAIVED)"]
      - from: WAIVED
        to: CONFIRMED
        trigger: "system: the waiver that waived this hit is REVOKED (CYCLE)"
        actor: system
        preconditions: ["waiver REVOKE transition succeeds"]
        side_effects: ["matter clearance_status recomputed (yields BLOCKED)"]

  - entity: WaiverRequest
    initial_state: DRAFT
    terminal_states: []   # fully cyclic: DECLINED / REVOKED / EXPIRED all loop back to DRAFT via REDRAFT
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /intake/waiver-requests/{id}/transition action=SEND"
        actor: ResponsibleAttorney
        preconditions:
          - "status == DRAFT (else ERR_WAIVER_INVALID_STATE)"
          - "caller X-User-ID == requested_by_attorney_id (else ERR_NOT_RESPONSIBLE_ATTORNEY)"
          - "referenced hit review_status == CONFIRMED (else ERR_HIT_NOT_CONFIRMED)"
        side_effects: ["sent_at = now; expires_at = sent_at + 30 days"]
      - from: SENT
        to: CONSENTED
        trigger: "POST /intake/waiver-requests/{id}/transition action=RECORD_CONSENT"
        actor: Client
        preconditions:
          - "status == SENT (else ERR_WAIVER_INVALID_STATE; an EXPIRED-swept waiver fails here)"
          - "caller X-User-ID == matter.client_party_id (else ERR_FORBIDDEN)"
          - "consent_document_ref provided (else ERR_INVALID_REQUEST)"
        side_effects: ["consent_document_ref stored"]
      - from: SENT
        to: DECLINED
        trigger: "POST /intake/waiver-requests/{id}/transition action=DECLINE"
        actor: Client
        preconditions: ["status == SENT", "caller X-User-ID == matter.client_party_id"]
        side_effects: ["decline_reason stored"]
      - from: SENT
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances logical time to >= expires_at (sweep on clock-set; inclusive boundary)"
        actor: system
        preconditions: ["status == SENT and new current_utc >= expires_at"]
        side_effects: ["no clearance change (SENT waivers never affected clearance)"]
      - from: CONSENTED
        to: APPROVED
        trigger: "POST /intake/waiver-requests/{id}/transition action=APPROVE"
        actor: ConflictsPartner
        preconditions:
          - "status == CONSENTED (else ERR_WAIVER_INVALID_STATE)"
          - "caller X-User-ID != requested_by_attorney_id (segregation of duties, else ERR_SOD_SELF_APPROVAL)"
        side_effects:
          - "approved_by_attorney_id = caller"
          - "referenced hit CONFIRMED -> WAIVED (cascade hop 1)"
          - "matter clearance_status recomputed; if no CONFIRMED hits remain -> WAIVED (cascade hop 2)"
      - from: CONSENTED
        to: REVOKED
        trigger: "POST /intake/waiver-requests/{id}/transition action=REVOKE"
        actor: Client | ConflictsPartner
        preconditions: ["status in {CONSENTED, APPROVED}", "Client caller must own the matter (X-User-ID == matter.client_party_id)"]
        side_effects: ["no hit status change (hit not WAIVED yet)"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /intake/waiver-requests/{id}/transition action=REVOKE"
        actor: Client | ConflictsPartner
        preconditions: ["status in {CONSENTED, APPROVED}", "Client caller must own the matter"]
        side_effects:
          - "referenced hit WAIVED -> CONFIRMED (cascade hop 1)"
          - "matter clearance_status recomputed -> BLOCKED (cascade hop 2)"
          - "every EngagementLetter of this matter in status ISSUED -> VOID (cascade hop 3, conditional: COUNTERSIGNED/DRAFT letters unaffected)"
      - from: DECLINED
        to: DRAFT
        trigger: "POST /intake/waiver-requests/{id}/transition action=REDRAFT (CYCLE)"
        actor: ResponsibleAttorney
        preconditions: ["status in {DECLINED, REVOKED, EXPIRED}", "caller X-User-ID == requested_by_attorney_id"]
        side_effects: ["sent_at, expires_at, consent_document_ref, decline_reason, approved_by_attorney_id reset to null/empty; proposed_terms may be replaced via transition payload"]
      - from: REVOKED
        to: DRAFT
        trigger: "POST /intake/waiver-requests/{id}/transition action=REDRAFT (CYCLE)"
        actor: ResponsibleAttorney
        preconditions: ["same as DECLINED -> DRAFT"]
        side_effects: ["same as DECLINED -> DRAFT"]
      - from: EXPIRED
        to: DRAFT
        trigger: "POST /intake/waiver-requests/{id}/transition action=REDRAFT (CYCLE)"
        actor: ResponsibleAttorney
        preconditions: ["same as DECLINED -> DRAFT"]
        side_effects: ["same as DECLINED -> DRAFT"]

  - entity: EngagementLetter
    initial_state: DRAFT
    terminal_states: [COUNTERSIGNED, SUPERSEDED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /intake/engagement-letters/{id}/transition action=ISSUE"
        actor: ResponsibleAttorney
        preconditions:
          - "letter.status == DRAFT (else ERR_LETTER_INVALID_STATE)"
          - "caller X-User-ID == matter.responsible_attorney_id (else ERR_NOT_RESPONSIBLE_ATTORNEY)"
          - "matter.lifecycle_status == INTAKE (else ERR_MATTER_NOT_INTAKE)"
        side_effects:
          - "issued_at = now"
          - "if no RetainerDeposit exists for the matter: create one (PENDING) with required_cents per calculations.retainer_required_amount; else recompute its required_cents and re-derive its status"
      - from: ISSUED
        to: COUNTERSIGNED
        trigger: "POST /intake/engagement-letters/{id}/transition action=COUNTERSIGN"
        actor: Client
        preconditions:
          - "letter.status == ISSUED (else ERR_LETTER_INVALID_STATE)"
          - "caller X-User-ID == matter.client_party_id (else ERR_FORBIDDEN)"
          - "business_safety: matter.clearance_status in {CLEARED, WAIVED} (else ERR_MATTER_CLEARANCE_BLOCKED)"
          - "business_temporal: now <= issued_at + 30 days (strict; else ERR_LETTER_STALE)"
          - "business_fiscal: at least one CreditAssessment exists for the matter (else ERR_CREDIT_MISSING)"
          - "business_fiscal: the latest CreditAssessment is not stale per calculations.assessment_validity (else ERR_CREDIT_STALE)"
          - "business_fiscal: matter's RetainerDeposit status == FUNDED (else ERR_RETAINER_UNFUNDED)"
        side_effects:
          - "countersigned_at = now"
          - "matter INTAKE -> OPEN: matter_number assigned, opened_at = now (billing setup complete)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a new EngagementLetter is created for the same matter"
        actor: system
        preconditions: ["new letter creation succeeds while this letter is DRAFT"]
        side_effects: []
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: a new EngagementLetter is created for the same matter"
        actor: system
        preconditions: ["new letter creation succeeds while this letter is ISSUED"]
        side_effects: ["RetainerDeposit required_cents recomputed against the new letter at next ISSUE"]
      - from: DRAFT
        to: VOID
        trigger: "POST /intake/engagement-letters/{id}/transition action=VOID"
        actor: ConflictsPartner
        preconditions: ["letter.status in {DRAFT, ISSUED} (else ERR_LETTER_INVALID_STATE)"]
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "POST action=VOID, or system: waiver REVOKE on this letter's matter (conditional cascade)"
        actor: ConflictsPartner | system
        preconditions: ["letter.status == ISSUED"]
        side_effects: []

  - entity: RetainerDeposit
    initial_state: PENDING
    terminal_states: []   # cyclic: FUNDED -> PARTIALLY_FUNDED via required-recompute; any -> PENDING via full REFUND
    note: "status is DERIVED after every mutation: received==0 -> PENDING; 0<received<required -> PARTIALLY_FUNDED; received>=required -> FUNDED (equality counts as funded)"
    transitions:
      - from: PENDING
        to: PARTIALLY_FUNDED
        trigger: "POST /intake/retainer-deposits/{id}/transition action=FUND with 0 < received < required"
        actor: BillingClerk
        preconditions: ["amount_cents > 0 (else ERR_INVALID_REQUEST)"]
        side_effects: ["funded_total_cents += amount_cents; received_cents recomputed; status re-derived"]
      - from: PARTIALLY_FUNDED
        to: FUNDED
        trigger: "action=FUND bringing received_cents >= required_cents (equality counts)"
        actor: BillingClerk
        preconditions: ["amount_cents > 0"]
        side_effects: ["funded_total_cents += amount_cents; status re-derived"]
      - from: PENDING
        to: FUNDED
        trigger: "action=FUND with amount_cents >= required_cents in one call"
        actor: BillingClerk
        preconditions: ["amount_cents > 0"]
        side_effects: ["as above"]
      - from: PARTIALLY_FUNDED
        to: PENDING
        trigger: "action=REFUND of the full received_cents (CYCLE)"
        actor: BillingClerk
        preconditions: ["0 < amount_cents <= received_cents (else ERR_REFUND_EXCEEDS_BALANCE)"]
        side_effects: ["refunded_total_cents += amount_cents; received_cents recomputed; status re-derived"]
      - from: FUNDED
        to: PENDING
        trigger: "action=REFUND of the full received_cents (CYCLE)"
        actor: BillingClerk
        preconditions: ["0 < amount_cents <= received_cents"]
        side_effects: ["as above"]
      - from: FUNDED
        to: PARTIALLY_FUNDED
        trigger: "action=REFUND partial, OR system: required_cents recomputed above received_cents after a new CreditAssessment or new letter ISSUE"
        actor: BillingClerk | system
        preconditions: ["refund: 0 < amount_cents <= received_cents; recompute: automatic"]
        side_effects: ["amounts/status re-derived"]

  - entity: EthicalWall
    initial_state: ACTIVE   # walls take effect at creation
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /intake/ethical-walls/{id}/transition action=LIFT"
        actor: ConflictsPartner
        preconditions: ["status == ACTIVE (else ERR_WALL_INVALID_STATE)"]
        side_effects: ["lifted_at = now; excluded attorneys regain read access immediately"]
    note: "EXCLUDE/RELEASE actions on the same endpoint mutate excluded_attorney_ids in place (status stays ACTIVE, wall.version += 1): EXCLUDE appends (error ERR_ATTORNEY_ALREADY_EXCLUDED if present), RELEASE removes (error ERR_ATTORNEY_NOT_EXCLUDED if absent)."

  - entity: Attorney
    initial_state: ACTIVE   # INTERNAL hires; LATERAL hires start LATERAL_PENDING unless their sweep finds zero hits
    terminal_states: []
    transitions:
      - from: LATERAL_PENDING
        to: ACTIVE
        trigger: "system: after any lateral-sweep hit review, the count of PENDING ConflictHit rows with lateral_attorney_id == this attorney reaches zero"
        actor: system
        preconditions: ["zero PENDING lateral-sweep hits for this attorney"]
        side_effects:
          - "for each CONFIRMED lateral-sweep hit's matter: if an ACTIVE EthicalWall exists on that matter, append this attorney to excluded_attorney_ids (if absent); else create an EthicalWall(reason=LATERAL_IMPUTATION, excluded_attorney_ids=[this attorney]) on that matter"
          - "attorney.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only; both are true
# create-with-supersede / blind-amend races per the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: matter-amend-stale-version
    parent_entity: Matter
    write_endpoint: "PATCH /intake/matters/{id}"
    occ_field: "expected_matter_version"
    description: |
      Amending intake fields on a Matter whose version has advanced since the
      caller last observed it is rejected: another writer may have amended the
      roster or details (each of which legitimately supersedes the open conflict
      checks), so the caller's view of the intake is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: letter-create-stale-matter
    parent_entity: Matter
    write_endpoint: "POST /intake/matters/{id}/engagement-letters"
    occ_field: "expected_matter_version"
    description: |
      Creating an EngagementLetter against a Matter whose version has advanced
      since the caller last observed it is rejected: letter creation legitimately
      supersedes any existing DRAFT/ISSUED letter for the matter, so a caller
      working from a stale matter view would unknowingly supersede terms it never
      saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: name_normalization
    trigger: "Party create (legal_name and aliases at creation); ConflictCheck run; lateral sweep"
    algorithm: constraint_propagation
    formula: |
      normalize(s):
        1. lowercase; replace every char not in [a-z0-9 ] with a single space; collapse whitespace; trim
        2. repeatedly drop trailing tokens in SUFFIX_TOKENS until no trailing token matches
        3. result = remaining tokens joined by single space
      soundex(s):  # American Soundex over normalize(s) with spaces removed, uppercased
        keep first letter; map remaining: BFPV->1, CGJKQSXZ->2, DT->3, L->4, MN->5, R->6, vowels/H/W/Y dropped;
        collapse consecutive duplicate codes (same code letters adjacent in the ORIGINAL string share one code);
        pad right with '0' / truncate to length 4.
    input_set: "Party.legal_name and every aliases[].alias_name"
    constants:
      SUFFIX_TOKENS: [inc, incorporated, corp, corporation, co, company, llc, llp, lp, ltd, pc, pllc]
    precision: "exact string transform; no rounding"

  - name: conflict_match_score
    trigger: "POST /intake/matters/{id}/conflict-checks (INTAKE); POST /intake/attorneys with hire_type=LATERAL (LATERAL_SWEEP)"
    algorithm: weighted_scoring
    formula: |
      For each QUERY subject Q (INTAKE: the matter's client party plus every MatterParty party;
      LATERAL_SWEEP: one prior_client_name string) and each CANDIDATE party P appearing on any OTHER
      matter with lifecycle_status in {INTAKE, OPEN} (matched_matter_id != check.matter_id):
        channel_direct   = 100 if normalize(Q) == P.normalized_name else token_overlap
        channel_alias    = 100 if normalize(Q) == any P.aliases[].normalized_alias else token_overlap vs that alias (max over aliases)
        token_overlap(A,B) = floor(100 * |tokens(A) intersect tokens(B)| / max(|tokens(A)|, |tokens(B)|)),
                             counted only when >= TOKEN_OVERLAP_MIN (else 0)
        STRICT variant:   base_score = max(channel_direct, channel_alias)                      # phonetic ignored
        PHONETIC variant: base_score = max(channel_direct, channel_alias, PHONETIC_SCORE if soundex(Q)==P.phonetic_key else 0)
      Affiliate expansion: for each party C reachable from P by following affiliate_of_id DOWNWARD... 
      (affiliate tree walk from P through children, i.e., parties whose affiliate_of chain leads UP to P),
      depth d = 1..AFFILIATE_MAX_DEPTH: emit an additional hit candidate with matched_via=AFFILIATE and
      score = base_score - AFFILIATE_DEPTH_DISCOUNT*d; if several paths reach C, keep the max score.
      A candidate becomes a ConflictHit iff score >= match_threshold (>=, inclusive).
      Deterministic emission/read order for hits (check hit lists and GET /intake/conflict-hits alike):
      match_score DESC, then matched party's created_at ASC, then matched matter's created_at ASC (never id).
      LATERAL_SWEEP additionally requires the employment-interval overlap test to pass (pinned on the
      POST /intake/attorneys endpoint: day-granularity, lateral_employed_to INCLUSIVE: overlap iff
      matter.opened_day <= lateral_employed_to AND (matter.closed_at is null OR closed_day >= lateral_employed_from)).
    input_set: "candidates = parties that are client_party_id or MatterParty.party_id of matters with lifecycle_status IN {INTAKE, OPEN}; the check's own matter excluded"
    constants:
      TOKEN_OVERLAP_MIN: 80
      PHONETIC_SCORE: 70
      AFFILIATE_DEPTH_DISCOUNT: 10
      AFFILIATE_MAX_DEPTH: 3
      DEFAULT_MATCH_THRESHOLD: 60
    precision: "integer scores; floor on token_overlap"
    variants:
      - name: STRICT
        when: "caller passes search_variant=STRICT"
        difference: "phonetic channel ignored: names that sound alike but share no tokens (e.g. 'Smyth' vs 'Smith') score 0 and produce no hit"
      - name: PHONETIC
        when: "caller passes search_variant=PHONETIC; mandatory for LATERAL_SWEEP"
        difference: "phonetic-key equality contributes a 70-score channel, so sound-alike names produce hits that STRICT misses — identical inputs, different hit set"

  - name: letter_fee_estimate
    trigger: "EngagementLetter creation (stored on fee_estimate_cents)"
    algorithm: aggregation
    formula: |
      for each line in fee_lines: line_cents = round_half_up(line.hours * line.rate_cents)   # round PER LINE first
      fee_estimate_cents = sum(line_cents)                                                    # then sum — order pinned
    input_set: "the letter's own fee_lines"
    constants: {}
    precision: "integer cents; round_half_up per line BEFORE summation (sum-then-round is the rejected interpretation: it differs, e.g. two lines of 0.5h x 101c give 51+51=102 vs round(101)=101)"

  - name: retainer_required_amount
    trigger: "RetainerDeposit auto-creation at first letter ISSUE; recompute at each subsequent ISSUE and at each new CreditAssessment creation"
    algorithm: threshold
    formula: |
      band = band of the VALID CreditAssessment for this matter with the LATEST assessed_at
             (validity per calculations.assessment_validity; tie on assessed_at broken by later created_at);
             if no valid assessment exists, band = SUBPRIME (conservative default).
      fee  = fee_estimate_cents of the matter's LATEST-created EngagementLetter in status {DRAFT, ISSUED}.
      evaluation order (pinned): raw = fee * MONTHS_MULTIPLIER[band]
                                 required_cents = min(max(raw, RETAINER_MIN_CENTS), RETAINER_MAX_CENTS)
    input_set: "the matter's CreditAssessment rows (validity windowed) and its DRAFT/ISSUED EngagementLetter rows"
    constants:
      MONTHS_MULTIPLIER: { PRIME: 1, STANDARD: 2, SUBPRIME: 3 }
      RETAINER_MIN_CENTS: 50000
      RETAINER_MAX_CENTS: 10000000
      ASSESSMENT_VALID_DAYS: 90
    precision: "integer cents; fee already integer per letter_fee_estimate"
    variants:
      - name: V_RECENT
        when: "PINNED interpretation: the latest-assessed valid assessment's band governs"
        difference: "with an older PRIME and a newer STANDARD assessment both inside validity, required = fee x 2"
      - name: V_BEST
        when: "REJECTED interpretation: the client-favorable best band among valid assessments"
        difference: "same inputs would give required = fee x 1 — a different number; implementations must follow V_RECENT"

  - name: credit_band
    trigger: "CreditAssessment creation (stored on band)"
    algorithm: threshold
    formula: |
      band = PRIME    if score >= 740
             STANDARD if 670 <= score <= 739
             SUBPRIME if score < 670
    input_set: "the assessment's own score"
    constants:
      PRIME_MIN: 740
      STANDARD_MIN: 670
    precision: "integer score; inclusive lower bounds (740 is PRIME, 739 is STANDARD, 670 is STANDARD, 669 is SUBPRIME)"

  - name: assessment_validity
    trigger: "retainer_required_amount evaluation; COUNTERSIGN credit gate"
    algorithm: threshold
    formula: |
      an assessment is VALID at logical time T iff T <= assessed_at + ASSESSMENT_VALID_DAYS days
      (stale iff T > assessed_at + 90 days — strict inequality; exactly 90 days old is still valid).
      Waiver expiry uses the OPPOSITE boundary convention by design: a SENT waiver expires when
      T >= expires_at (inclusive; see WaiverRequest state machine).
    input_set: "CreditAssessment rows of one matter"
    constants:
      ASSESSMENT_VALID_DAYS: 90
    precision: "second-precision ISO timestamps"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller role is in the endpoint's roles list; per-action role rules on transition endpoints (e.g. APPROVE requires ConflictsPartner; DECLINE of a matter requires ConflictsPartner)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path ids resolve left-to-right (matter, then letter/waiver/wall/deposit/hit/party/attorney); FK body fields (client_party_id, responsible_attorney_id, party_id, conflict_hit_id, attorney_id) resolve", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: auth, check: "wall gate: GET /intake/matters/{id} — if the caller is an entity-backed attorney role (ResponsibleAttorney or ConflictsPartner) whose X-User-ID is in any ACTIVE EthicalWall.excluded_attorney_ids of that matter, deny. Opaque roles and the matter's Client are never wall-blocked. Attorneys with status LATERAL_PENDING may not read any matter", error_id: ERR_WALL_EXCLUDED, http_status: 403, applies_to: "GET /intake/matters/{id}" }
  - { priority: 5, category: auth, check: "ownership: ResponsibleAttorney caller is the matter's responsible_attorney_id (hit review, letter ISSUE, waiver SEND/REDRAFT, waiver create); Client caller owns the matter (RECORD_CONSENT, DECLINE, REVOKE, COUNTERSIGN, GET matter as client)", error_id: ERR_NOT_RESPONSIBLE_ATTORNEY, http_status: 403, applies_to: "POST /intake/conflict-hits/{id}/review, POST /intake/engagement-letters/{id}/transition, POST /intake/waiver-requests/{id}/transition, POST /intake/matters/{id}/waiver-requests, POST /intake/matters/{id}/transition" }
  - { priority: 5, category: auth, check: "client ownership failures on Client-scoped operations return the generic forbidden error", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "Client-role calls where X-User-ID != matter.client_party_id" }
  - { priority: 6, category: state, check: "matter lifecycle gate: letter create/PATCH/parties-add require INTAKE or OPEN as pinned per endpoint (letters: INTAKE only); DECLINE requires INTAKE; CLOSE requires OPEN; checks/walls rejected on CLOSED/DECLINED", error_id: ERR_MATTER_NOT_INTAKE, http_status: 409, applies_to: "POST /intake/matters/{id}/engagement-letters, POST /intake/matters/{id}/transition(DECLINE)" }
  - { priority: 6, category: state, check: "CLOSE requires lifecycle OPEN", error_id: ERR_MATTER_NOT_OPEN, http_status: 409, applies_to: "POST /intake/matters/{id}/transition(CLOSE)" }
  - { priority: 6, category: state, check: "conflict checks, ethical-wall creation, roster changes, and PATCH are rejected on CLOSED or DECLINED matters", error_id: ERR_MATTER_TERMINAL, http_status: 409, applies_to: "POST /intake/matters/{id}/conflict-checks, POST /intake/matters/{id}/ethical-walls, POST /intake/matters/{id}/parties, PATCH /intake/matters/{id}" }
  - { priority: 6, category: state, check: "hit review requires review_status == PENDING", error_id: ERR_HIT_NOT_PENDING, http_status: 409, applies_to: "POST /intake/conflict-hits/{id}/review" }
  - { priority: 6, category: state, check: "waiver transition invalid from current status (incl. RECORD_CONSENT on an EXPIRED-swept waiver)", error_id: ERR_WAIVER_INVALID_STATE, http_status: 409, applies_to: "POST /intake/waiver-requests/{id}/transition" }
  - { priority: 6, category: state, check: "letter transition invalid from current status (ISSUE/COUNTERSIGN/VOID)", error_id: ERR_LETTER_INVALID_STATE, http_status: 409, applies_to: "POST /intake/engagement-letters/{id}/transition" }
  - { priority: 6, category: state, check: "wall LIFT requires status ACTIVE (also covers second LIFT)", error_id: ERR_WALL_INVALID_STATE, http_status: 409, applies_to: "POST /intake/ethical-walls/{id}/transition" }
  - { priority: 6, category: state, check: "OCC: expected_matter_version equals matter.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /intake/matters/{id}, POST /intake/matters/{id}/engagement-letters" }
  - { priority: 7, category: business_safety, check: "countersign requires matter.clearance_status in {CLEARED, WAIVED}", error_id: ERR_MATTER_CLEARANCE_BLOCKED, http_status: 422, applies_to: "POST /intake/engagement-letters/{id}/transition(COUNTERSIGN)" }
  - { priority: 7, category: business_safety, check: "segregation of duties: waiver APPROVE caller must differ from requested_by_attorney_id", error_id: ERR_SOD_SELF_APPROVAL, http_status: 403, applies_to: "POST /intake/waiver-requests/{id}/transition(APPROVE)" }
  - { priority: 7, category: business_safety, check: "responsible-attorney adverse overlap (V-T1): assigning responsible_attorney_id R is rejected if R is responsible on another matter M2 with lifecycle OPEN and (the new matter's client appears ADVERSE on M2, or M2's client appears ADVERSE on the target matter). Half-open interval semantics: M2's activity [M2.opened_at, M2.closed_at) — a CLOSED M2 with closed_at <= now does NOT overlap", error_id: ERR_ATTORNEY_ADVERSE_OVERLAP, http_status: 422, applies_to: "POST /intake/matters, PATCH /intake/matters/{id}, POST /intake/matters/{id}/parties" }
  - { priority: 7, category: business_safety, check: "responsible_attorney_id must reference an Attorney with status == ACTIVE", error_id: ERR_ATTORNEY_NOT_ACTIVE, http_status: 422, applies_to: "POST /intake/matters, PATCH /intake/matters/{id}" }
  - { priority: 8, category: business_temporal, check: "countersign staleness: now <= issued_at + 30 days (strict; exactly 30 days old is still countersignable)", error_id: ERR_LETTER_STALE, http_status: 422, applies_to: "POST /intake/engagement-letters/{id}/transition(COUNTERSIGN)" }
  - { priority: 9, category: business_referential, check: "waiver create: referenced hit's ConflictCheck must not be SUPERSEDED", error_id: ERR_CHECK_SUPERSEDED, http_status: 409, applies_to: "POST /intake/matters/{id}/waiver-requests" }
  - { priority: 9, category: business_referential, check: "waiver create/SEND: referenced hit must be review_status == CONFIRMED", error_id: ERR_HIT_NOT_CONFIRMED, http_status: 422, applies_to: "POST /intake/matters/{id}/waiver-requests, POST /intake/waiver-requests/{id}/transition(SEND)" }
  - { priority: 10, category: business_constraint, check: "at most one ACTIVE-status (DRAFT|SENT|CONSENTED|APPROVED) WaiverRequest per conflict hit", error_id: ERR_WAIVER_ACTIVE_EXISTS, http_status: 409, applies_to: "POST /intake/matters/{id}/waiver-requests" }
  - { priority: 10, category: business_constraint, check: "at most one ACTIVE EthicalWall per matter", error_id: ERR_WALL_INVALID_STATE, http_status: 409, applies_to: "POST /intake/matters/{id}/ethical-walls" }
  - { priority: 10, category: business_constraint, check: "wall EXCLUDE of an attorney already excluded / RELEASE of an attorney not excluded", error_id: ERR_ATTORNEY_ALREADY_EXCLUDED, http_status: 409, applies_to: "POST /intake/ethical-walls/{id}/transition(EXCLUDE)" }
  - { priority: 10, category: business_constraint, check: "RELEASE target not currently excluded", error_id: ERR_ATTORNEY_NOT_EXCLUDED, http_status: 409, applies_to: "POST /intake/ethical-walls/{id}/transition(RELEASE)" }
  - { priority: 10, category: business_constraint, check: "party already on the matter roster", error_id: ERR_PARTY_ALREADY_ON_MATTER, http_status: 409, applies_to: "POST /intake/matters/{id}/parties" }
  - { priority: 11, category: business_fiscal, check: "countersign: at least one CreditAssessment exists for the matter", error_id: ERR_CREDIT_MISSING, http_status: 422, applies_to: "POST /intake/engagement-letters/{id}/transition(COUNTERSIGN)" }
  - { priority: 11, category: business_fiscal, check: "countersign: latest CreditAssessment not stale (now <= assessed_at + 90d)", error_id: ERR_CREDIT_STALE, http_status: 422, applies_to: "POST /intake/engagement-letters/{id}/transition(COUNTERSIGN)" }
  - { priority: 11, category: business_fiscal, check: "countersign: RetainerDeposit status == FUNDED", error_id: ERR_RETAINER_UNFUNDED, http_status: 422, applies_to: "POST /intake/engagement-letters/{id}/transition(COUNTERSIGN)" }
  - { priority: 11, category: business_fiscal, check: "REFUND amount_cents <= received_cents", error_id: ERR_REFUND_EXCEEDS_BALANCE, http_status: 422, applies_to: "POST /intake/retainer-deposits/{id}/transition(REFUND)" }
  - { priority: 12, category: business_constraint, check: "request shape: required fields present; enums in range; match_threshold in 0..100; score in 300..850; amount_cents > 0; fee_lines >= 1 with hours > 0 and rate_cents > 0; hire_type=LATERAL requires lateral_employed_from/to and prior_client_names; alias normalized value must not duplicate the party's own normalized_name or another alias", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table  (33 endpoints)
# STAFF shorthand below is expanded explicitly per endpoint.
# =============================================================================
endpoints:
  # ---- Parties ----
  - { method: POST, path: "/intake/parties", description: "Create a party; computes normalized_name + phonetic_key; affiliate_of_id existence-checked", roles: [FirmAdmin], code: 201, input: [legal_name, party_type, "aliases?", "affiliate_of_id?"], output: Party, side_effects: [name_normalization] }
  - { method: GET, path: "/intake/parties/{id}", description: "Read one party (Client may read only its own party record: X-User-ID == id)", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk, Client], code: 200, input: [], output: Party, side_effects: [] }
  - { method: GET, path: "/intake/parties", description: "List/search parties; q? filters on normalized_name substring, affiliate_of_id? gives reverse reach into the affiliate tree", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk], code: 200, input: ["q?", "party_type?", "affiliate_of_id?", "limit?", "offset?"], output: "Party[]", side_effects: [] }
  - { method: GET, path: "/intake/parties/{id}/matter-parties", description: "Reverse reach: roster rows naming this party", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk], code: 200, input: [], output: "MatterParty[]", side_effects: [] }

  # ---- Attorneys ----
  - { method: POST, path: "/intake/attorneys", description: "Onboard an attorney. hire_type=LATERAL requires lateral_employed_from/to + prior_client_names and synchronously runs the lateral sweep: per prior_client_name, PHONETIC match (threshold 60) against parties on matters with lifecycle in {INTAKE, OPEN}, then employment-overlap filter at DAY granularity with employed_to INCLUSIVE: activity_start_day = opened_at day if the matter is OPEN/CLOSED else created_at day (INTAKE matters are active prospects); overlap iff activity_start_day <= lateral_employed_to AND (closed_at is null OR closed_day >= lateral_employed_from). Per surviving (name, matter) pair a LATERAL_SWEEP ConflictCheck + ConflictHits are created on that EXISTING matter and its clearance recomputed. Attorney starts LATERAL_PENDING if any hit was created, else ACTIVE", roles: [FirmAdmin], code: 201, input: [full_name, bar_number, practice_group, "hire_type?", "lateral_employed_from?", "lateral_employed_to?", "prior_client_names?"], output: Attorney, side_effects: [conflict_match_score, "LATERAL_SWEEP checks + hits on matched existing matters", "affected matters' clearance_status recompute"] }
  - { method: GET, path: "/intake/attorneys/{id}", description: "Read one attorney (incl. status, prior_client_names)", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk], code: 200, input: [], output: Attorney, side_effects: [] }

  # ---- Matters ----
  - { method: POST, path: "/intake/matters", description: "Open intake for a new matter; lifecycle INTAKE, clearance UNCHECKED; adverse-overlap + attorney-active checks apply", roles: [IntakeSpecialist], code: 201, input: [client_party_id, responsible_attorney_id, practice_group, "matter_title?"], output: Matter, side_effects: [] }
  - { method: GET, path: "/intake/matters", description: "List/filter matters; also serves FK reverse reach for client_party_id and responsible_attorney_id", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk], code: 200, input: ["client_party_id?", "responsible_attorney_id?", "lifecycle_status?", "clearance_status?", "limit?", "offset?"], output: "Matter[]", side_effects: [] }
  - { method: GET, path: "/intake/matters/{id}", description: "Read one matter. Wall-gated (ERR_WALL_EXCLUDED for excluded entity-backed attorneys; LATERAL_PENDING attorneys may not read any matter). Client may read only matters where client_party_id == X-User-ID", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk, Client], code: 200, input: [], output: Matter, side_effects: [] }
  - { method: PATCH, path: "/intake/matters/{id}", description: "Amend intake fields (OCC). Changing responsible_attorney_id re-runs adverse-overlap + attorney-active checks. Roster-affecting edits supersede INTAKE checks", roles: [IntakeSpecialist], code: 200, input: ["matter_title?", "practice_group?", "responsible_attorney_id?", expected_matter_version], output: Matter, side_effects: ["matter.version += 1", "supersede COMPLETED INTAKE checks when responsible_attorney_id changes"] }
  - { method: POST, path: "/intake/matters/{id}/parties", description: "Add an ADVERSE/WITNESS/RELATED party to the roster (INTAKE or OPEN matters); supersedes the matter's COMPLETED INTAKE checks and stales their PENDING hits", roles: [IntakeSpecialist], code: 201, input: [party_id, role_in_matter], output: MatterParty, side_effects: ["ConflictCheck COMPLETED -> SUPERSEDED (INTAKE kind)", "PENDING hits -> STALE", "clearance_status recompute", "matter.version += 1"] }
  - { method: GET, path: "/intake/matters/{id}/parties", description: "Roster listing", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk], code: 200, input: [], output: "MatterParty[]", side_effects: [] }
  - { method: POST, path: "/intake/matters/{id}/transition", description: "Matter lifecycle actions: DECLINE (ConflictsPartner; INTAKE only) or CLOSE (responsible ResponsibleAttorney or ConflictsPartner; OPEN only)", roles: [ResponsibleAttorney, ConflictsPartner], code: 200, input: [action, "reason?"], output: Matter, side_effects: ["lifecycle transition + opened/closed bookkeeping", "matter.version += 1"] }
  - { method: GET, path: "/intake/matters/{id}/conflict-checks", description: "List the matter's conflict checks (both kinds)", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk], code: 200, input: [], output: "ConflictCheck[]", side_effects: [] }
  - { method: POST, path: "/intake/matters/{id}/conflict-checks", description: "Run a conflict check (INTAKE or OPEN matters). Supersedes the prior COMPLETED INTAKE check (staling its PENDING hits), computes hits per conflict_match_score, recomputes clearance", roles: [IntakeSpecialist, ResponsibleAttorney], code: 201, input: [search_variant, "match_threshold?"], output: ConflictCheck, side_effects: [conflict_match_score, "prior INTAKE check SUPERSEDED + hits STALE", "clearance_status recompute", "matter.version += 1"] }

  # ---- Conflict hits ----
  - { method: GET, path: "/intake/conflict-hits", description: "Filtered hit listing (ordered match_score DESC, matched-party created_at ASC, matched-matter created_at ASC); reverse reach for ConflictHit.check_id / matched_party_id / matched_matter_id", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner], code: 200, input: ["check_id?", "matched_party_id?", "matched_matter_id?", "review_status?", "limit?", "offset?"], output: "ConflictHit[]", side_effects: [] }
  - { method: GET, path: "/intake/conflict-hits/{id}", description: "Read one hit", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner], code: 200, input: [], output: ConflictHit, side_effects: [] }
  - { method: GET, path: "/intake/conflict-hits/{id}/waiver-requests", description: "Reverse reach: waivers (0..1 active historically, all statuses) targeting this hit", roles: [ResponsibleAttorney, ConflictsPartner, FirmAdmin], code: 200, input: [], output: "WaiverRequest[]", side_effects: [] }
  - { method: POST, path: "/intake/conflict-hits/{id}/review", description: "Responsible attorney (or ConflictsPartner) reviews a PENDING hit; may trigger lateral auto-activation + auto-wall cascade", roles: [ResponsibleAttorney, ConflictsPartner], code: 200, input: [decision, "note?"], output: ConflictHit, side_effects: ["review_status set", "clearance_status recompute on check's matter", "lateral activation + wall cascade when last PENDING sweep hit resolves"] }

  # ---- Ethical walls ----
  - { method: POST, path: "/intake/matters/{id}/ethical-walls", description: "Create an ACTIVE wall (max one ACTIVE per matter); excluded attorneys lose matter read access immediately", roles: [ConflictsPartner], code: 201, input: [reason, excluded_attorney_ids, "memo?"], output: EthicalWall, side_effects: ["wall takes effect for GET /intake/matters/{id}"] }
  - { method: GET, path: "/intake/matters/{id}/ethical-walls", description: "List walls of a matter (wall existence is itself confidential)", roles: [ConflictsPartner, FirmAdmin], code: 200, input: [], output: "EthicalWall[]", side_effects: [] }
  - { method: POST, path: "/intake/ethical-walls/{id}/transition", description: "Wall actions: EXCLUDE {attorney_id} append; RELEASE {attorney_id} remove; LIFT the wall (ACTIVE -> LIFTED)", roles: [ConflictsPartner], code: 200, input: [action, "attorney_id?"], output: EthicalWall, side_effects: ["excluded_attorney_ids mutation or status=LIFTED", "wall.version += 1"] }

  # ---- Waivers ----
  - { method: POST, path: "/intake/matters/{id}/waiver-requests", description: "Draft a waiver for a CONFIRMED hit whose check is not SUPERSEDED; one active waiver per hit; requested_by = caller", roles: [ResponsibleAttorney], code: 201, input: [conflict_hit_id, proposed_terms], output: WaiverRequest, side_effects: [] }
  - { method: GET, path: "/intake/matters/{id}/waiver-requests", description: "List waivers of a matter", roles: [ResponsibleAttorney, ConflictsPartner, FirmAdmin], code: 200, input: [], output: "WaiverRequest[]", side_effects: [] }
  - { method: POST, path: "/intake/waiver-requests/{id}/transition", description: "Waiver lifecycle: SEND (requester), RECORD_CONSENT / DECLINE (owning Client), APPROVE (ConflictsPartner, SoD), REVOKE (owning Client or ConflictsPartner), REDRAFT (requester). APPROVE waives the hit; REVOKE of an APPROVED waiver un-waives and VOIDs ISSUED letters", roles: [ResponsibleAttorney, ConflictsPartner, Client], code: 200, input: [action, "consent_document_ref?", "decline_reason?", "proposed_terms?", "note?"], output: WaiverRequest, side_effects: ["see WaiverRequest state machine incl. hit WAIVED/CONFIRMED and letter VOID cascades"] }

  # ---- Engagement letters ----
  - { method: POST, path: "/intake/matters/{id}/engagement-letters", description: "Create a DRAFT letter (OCC on matter; INTAKE only); supersedes existing DRAFT/ISSUED letters; fee_estimate_cents computed", roles: [ResponsibleAttorney, IntakeSpecialist], code: 201, input: [scope_text, fee_lines, expected_matter_version], output: EngagementLetter, side_effects: [letter_fee_estimate, "prior DRAFT/ISSUED letter -> SUPERSEDED", "matter.version += 1"] }
  - { method: GET, path: "/intake/matters/{id}/engagement-letters", description: "List letters of a matter (Client: own matters only)", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk, Client], code: 200, input: [], output: "EngagementLetter[]", side_effects: [] }
  - { method: POST, path: "/intake/engagement-letters/{id}/transition", description: "ISSUE (responsible attorney; creates/recomputes RetainerDeposit), COUNTERSIGN (owning Client; full gate chain; opens matter + assigns matter_number), VOID (ConflictsPartner)", roles: [ResponsibleAttorney, Client, ConflictsPartner], code: 200, input: [action], output: EngagementLetter, side_effects: ["ISSUE: RetainerDeposit create/recompute", "COUNTERSIGN: matter INTAKE->OPEN, matter_number, opened_at", "waiver-revoke conditional VOID per state machine"] }

  # ---- Credit ----
  - { method: POST, path: "/intake/matters/{id}/credit-assessments", description: "Record a credit assessment (assessed_at = logical now; band computed). Creating one recomputes the matter's RetainerDeposit.required_cents if a deposit exists", roles: [BillingClerk], code: 201, input: [score], output: CreditAssessment, side_effects: [credit_band, retainer_required_amount, "deposit status re-derivation"] }
  - { method: GET, path: "/intake/matters/{id}/credit-assessments", description: "List assessments of a matter", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk], code: 200, input: [], output: "CreditAssessment[]", side_effects: [] }

  # ---- Retainer ----
  - { method: GET, path: "/intake/matters/{id}/retainer-deposits", description: "The matter's deposit (array of 0..1; created at first ISSUE)", roles: [FirmAdmin, IntakeSpecialist, ResponsibleAttorney, ConflictsPartner, BillingClerk, Client], code: 200, input: [], output: "RetainerDeposit[]", side_effects: [] }
  - { method: POST, path: "/intake/retainer-deposits/{id}/transition", description: "FUND {amount_cents} / REFUND {amount_cents}; status re-derived (received >= required => FUNDED, equality counts)", roles: [BillingClerk], code: 200, input: [action, amount_cents], output: RetainerDeposit, side_effects: ["funded/refunded totals and received_cents updated", "status re-derived"] }

  # ---- Logical clock (test-driving) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. STARTUP DEFAULT: before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Side effect: SENT waivers with expires_at <= new time become EXPIRED (inclusive boundary). Arbitrary target instants allowed (no monotonicity constraint)", roles: [FirmAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string, expired_waiver_ids: string[] }", side_effects: ["waiver expiry sweep"] }

# =============================================================================
# §1.6 Error Code Catalog (30)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/empty X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint/action; or Client ownership mismatch on Client-scoped operations" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK body reference does not resolve" }
  - { id: ERR_WALL_EXCLUDED, http: 403, condition: "Entity-backed attorney caller is excluded by an ACTIVE ethical wall on the matter (or is LATERAL_PENDING reading any matter)" }
  - { id: ERR_NOT_RESPONSIBLE_ATTORNEY, http: 403, condition: "ResponsibleAttorney-scoped action attempted by an attorney who is not the matter's responsible attorney (or waiver requester mismatch on SEND/REDRAFT)" }
  - { id: ERR_SOD_SELF_APPROVAL, http: 403, condition: "Waiver APPROVE attempted by the same attorney who requested it" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, enum out of range, threshold outside 0..100, score outside 300..850, non-positive amounts, empty fee_lines, missing lateral fields, duplicate normalized alias" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_matter_version does not equal the matter's current version (OCC)" }
  - { id: ERR_MATTER_NOT_INTAKE, http: 409, condition: "Operation requires lifecycle INTAKE (letter create, DECLINE)" }
  - { id: ERR_MATTER_NOT_OPEN, http: 409, condition: "CLOSE requires lifecycle OPEN" }
  - { id: ERR_MATTER_TERMINAL, http: 409, condition: "Conflict checks, wall creation, roster changes, PATCH on a CLOSED or DECLINED matter" }
  - { id: ERR_CHECK_SUPERSEDED, http: 409, condition: "Waiver create references a hit whose ConflictCheck is SUPERSEDED" }
  - { id: ERR_HIT_NOT_PENDING, http: 409, condition: "Review attempted on a hit not in PENDING (CONFIRMED/DISMISSED/WAIVED/STALE)" }
  - { id: ERR_HIT_NOT_CONFIRMED, http: 422, condition: "Waiver create/SEND requires the referenced hit to be CONFIRMED" }
  - { id: ERR_WAIVER_INVALID_STATE, http: 409, condition: "Waiver transition not allowed from current status (incl. consent on EXPIRED)" }
  - { id: ERR_WAIVER_ACTIVE_EXISTS, http: 409, condition: "An active (DRAFT|SENT|CONSENTED|APPROVED) waiver already exists for the hit" }
  - { id: ERR_LETTER_INVALID_STATE, http: 409, condition: "Letter transition not allowed from current status" }
  - { id: ERR_LETTER_STALE, http: 422, condition: "COUNTERSIGN attempted after issued_at + 30 days (strict staleness)" }
  - { id: ERR_MATTER_CLEARANCE_BLOCKED, http: 422, condition: "COUNTERSIGN while matter.clearance_status not in {CLEARED, WAIVED}" }
  - { id: ERR_CREDIT_MISSING, http: 422, condition: "COUNTERSIGN with no CreditAssessment on the matter" }
  - { id: ERR_CREDIT_STALE, http: 422, condition: "COUNTERSIGN where the latest CreditAssessment is older than 90 days (strict)" }
  - { id: ERR_RETAINER_UNFUNDED, http: 422, condition: "COUNTERSIGN while RetainerDeposit status != FUNDED" }
  - { id: ERR_REFUND_EXCEEDS_BALANCE, http: 422, condition: "REFUND amount_cents > received_cents (or <= 0 via ERR_INVALID_REQUEST)" }
  - { id: ERR_WALL_INVALID_STATE, http: 409, condition: "Wall lifecycle/constraint violation: second ACTIVE wall on a matter; LIFT on a LIFTED wall; EXCLUDE/RELEASE after LIFT" }
  - { id: ERR_ATTORNEY_ALREADY_EXCLUDED, http: 409, condition: "EXCLUDE an attorney already in excluded_attorney_ids" }
  - { id: ERR_ATTORNEY_NOT_EXCLUDED, http: 409, condition: "RELEASE an attorney not in excluded_attorney_ids" }
  - { id: ERR_ATTORNEY_ADVERSE_OVERLAP, http: 422, condition: "Responsible-attorney adverse overlap with another OPEN matter (half-open interval test)" }
  - { id: ERR_ATTORNEY_NOT_ACTIVE, http: 422, condition: "Assigning a LATERAL_PENDING attorney as responsible attorney" }
  - { id: ERR_PARTY_ALREADY_ON_MATTER, http: 409, condition: "Adding a party already on the matter roster" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Firm operations administrator: manages parties, attorneys, and the logical clock; broad read access"
    identity: opaque
    exclusive_operations: ["POST /intake/parties", "POST /intake/attorneys", "POST /_clock/set_current_utc"]
    shared_operations: ["read parties/attorneys/matters/checks/walls/lists"]
  - name: IntakeSpecialist
    description: "Intake department staff: opens matters, maintains rosters, runs conflict checks, drafts letters"
    identity: opaque
    exclusive_operations: ["POST /intake/matters", "PATCH /intake/matters/{id}", "POST /intake/matters/{id}/parties"]
    shared_operations: ["POST /intake/matters/{id}/conflict-checks", "POST /intake/matters/{id}/engagement-letters", "reads"]
  - name: ResponsibleAttorney
    description: "Attorney responsible for a matter: reviews its conflict hits, requests/sends/redrafts its waivers, issues its letters, closes it"
    identity: "entity_backed:Attorney"
    exclusive_operations: ["POST /intake/matters/{id}/waiver-requests"]
    shared_operations: ["POST /intake/conflict-hits/{id}/review", "POST /intake/waiver-requests/{id}/transition (SEND, REDRAFT)", "POST /intake/engagement-letters/{id}/transition (ISSUE)", "POST /intake/matters/{id}/transition (CLOSE)", "POST /intake/matters/{id}/conflict-checks", "reads"]
  - name: ConflictsPartner
    description: "Conflicts committee partner: approves waivers (never own requests — SoD), administers ethical walls, declines matters, voids letters"
    identity: "entity_backed:Attorney"
    exclusive_operations: ["POST /intake/matters/{id}/ethical-walls", "POST /intake/ethical-walls/{id}/transition", "waiver APPROVE", "POST /intake/matters/{id}/transition (DECLINE)", "letter VOID"]
    shared_operations: ["POST /intake/conflict-hits/{id}/review", "waiver REVOKE", "reads"]
  - name: BillingClerk
    description: "Finance staff: records credit assessments and retainer fund/refund events"
    identity: opaque
    exclusive_operations: ["POST /intake/matters/{id}/credit-assessments", "POST /intake/retainer-deposits/{id}/transition"]
    shared_operations: ["reads"]
  - name: Client
    description: "The client party of a matter: reads its own matter/letters/deposit, records consent/decline/revoke on its waivers, countersigns letters"
    identity: "entity_backed:Party"
    exclusive_operations: ["RECORD_CONSENT", "waiver DECLINE", "letter COUNTERSIGN"]
    shared_operations: ["GET /intake/matters/{id} (own)", "GET /intake/matters/{id}/engagement-letters (own)", "GET /intake/matters/{id}/retainer-deposits (own)", "waiver REVOKE (own)"]
