            - "the refused attempt changed nothing: exactly one AllocationLine exists, InventoryLot.${lot_a}.allocated_sqft == 4400.00, and AllocationCycle.${cycle}.version did NOT advance on the failed write"
            - "${cycle_v2} == ${cycle_v} + 1"
            - "resubmitting the byte-identical line body with ${cycle_v2} returns HTTP 201: AllocationLine ${line2} exists, InventoryLot.${lot_a}.allocated_sqft == 8800.00 and AllocationCycle.${cycle}.version == ${cycle_v} + 2"

      - name: a_stale_expected_plant_version_is_refused_when_staging_cullet
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cullet-batch-stage-stale-plant]
          - errors[ERR_STALE_PLANT_VERSION]
          - validations[priority=31]
        distinguishing_aspect: "The cullet ledger lives on the Plant, so every staged batch bumps plant.version and invalidates the previous read. Staging two batches back to back from one cached version therefore fails on the second — the writer must prove it has seen the ledger it is adding to — while the same pair of requests with a re-read in between both succeed."
