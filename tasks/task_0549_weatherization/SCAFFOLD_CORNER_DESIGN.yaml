              payload: { job_id: "${job_id}", principal_cents: 500000, term_months: 60, apr_bps: 600, expected_job_version: "${job_v}" }
              as: ProgramAdmin
              captures: { fp_a_id: $.data.id }
          trigger:
            - call: "POST /weatherization/financing-plans"
              payload: { job_id: "${job_id}", principal_cents: 450000, term_months: 60, apr_bps: 600, expected_job_version: "${job_v}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_VERSION"
            - "FinancingPlan.${fp_a_id}.status == OFFERED"

      - name: financing_create_increments_job_version
        claim_type: optimistic_concurrency
        grounds:
          - 'entities.Job.fields.version'
          - 'endpoints."POST /weatherization/financing-plans"'
        distinguishing_aspect: "A successful financing create with the matching expected_job_version increments Job.version by exactly 1 (1 -> 2)."
        test_recipe:
          setup: ["A job at version 1"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "47 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id, job_v: $.data.version }
          trigger:
            - call: "POST /weatherization/financing-plans"
              payload: { job_id: "${job_id}", principal_cents: 500000, term_months: 60, apr_bps: 600, expected_job_version: "${job_v}" }
              as: ProgramAdmin
          assert:
            - "Job.${job_id}.version == 2"

      - name: cascading_side_effects_stub
        claim_type: cascading_side_effects
        grounds:
          - 'state_machines.Job.verification_status_PENDING_to_verification_status_FAILED'
        excluded_because:
          difficulty_instance: transitive_cascade / verify_fail_cascade_scope_rebate_budget_depth3
          rationale: "The N-level cascade end-to-end is the §1.8 depth-3 cascade instance."

      - name: dual_variant_calculation_stub
        claim_type: dual_variant_calculation
        grounds:
          - 'calculations.rebate_amount'
        excluded_because:
          difficulty_instance: dual_variant_calc / rebate_provisional_vs_finalized
          rationale: "PROVISIONAL vs FINALIZED divergence is the §1.8 dual-variant instance."

      - name: rate_threshold_income_boundary_stub
        claim_type: rate_threshold_triggers
        grounds:
          - 'calculations.wap_income_eligibility'
        excluded_because:
          difficulty_instance: boundary_precision_check / wap_income_at_exact_limit_eligible
          rationale: "The inclusive income threshold boundary is the §1.8 boundary instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: approved_rebate_visible_immediately_on_job_read
        claim_type: immediate
        grounds:
          - 'state_machines.RebateClaim.SUBMITTED_to_APPROVED'
          - 'entities.Job.fields.approved_rebate_total_cents'
        distinguishing_aspect: "Immediate consistency: right after rebate approve, a GET on the job reflects approved_rebate_total_cents == 50000 in the same synchronous flow (no lag)."
        test_recipe:
          setup: ["Attic scope INSTALLED at achieved R25; rebate SUBMITTED (finalized 50000)"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "48 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 300000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "ATTIC_INSULATION", area_sqft: 1000, target_r_value: 38, estimated_cost_cents: 100000, estimated_savings_kwh: 500 }
              as: Auditor
              captures: { scope_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/crews"
              payload: { name: "Crew U", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 20 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-04T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/mark-installed"
              payload: { achieved_r_value: 25, actual_cost_cents: 100000 }
              as: Installer
            - call: "POST /weatherization/rebate-claims"
              payload: { job_id: "${job_id}", scope_item_id: "${scope_id}" }
              as: ProgramAdmin
              captures: { rebate_id: $.data.id }
            - call: "POST /weatherization/rebate-claims/${rebate_id}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /weatherization/rebate-claims/${rebate_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
          trigger:
            - call: "GET /weatherization/jobs/${job_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Job.${job_id}.approved_rebate_total_cents == 50000"
            - "Job.${job_id}.estimated_out_of_pocket_cents == 20000"
