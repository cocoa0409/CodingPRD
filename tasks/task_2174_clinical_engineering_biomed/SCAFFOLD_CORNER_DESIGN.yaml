        grounds:
          - "errors[ERR_INVALID_RECALL_MATCH_STATE]"
          - "entities.RecallMatch.fields.disposition"
        distinguishing_aspect: "disposition is declared only from PENDING, so a second disposition call on the same match returns 409 ERR_INVALID_RECALL_MATCH_STATE and the first outcome EXEMPTED stands."
        test_recipe:
          setup: ["A published CLASS_II notice whose single match has already been dispositioned EXEMPTED."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
