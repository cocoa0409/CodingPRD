            - *c_approve
            - *c_op
            - *c_taker
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - *c_recipe
            - *c_dist
            - *c_dist_act
            - call: "POST /recipe-distributions/${dist_id}/suspend"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { st_susp1: $.data.status }
            - *c_stand_v
          trigger:
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { err_suspended: $.data.error_id }
            - call: "POST /recipe-distributions/${dist_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { st_act2: $.data.status }
            - call: "POST /recipe-distributions/${dist_id}/suspend"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { st_susp2: $.data.status }
            - call: "POST /recipe-distributions/${dist_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { st_act3: $.data.status }
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v2: $.data.version }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v2}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
          assert:
            - "order during SUSPENDED rejected with ERR_DISTRIBUTION_NOT_ACTIVE"
            - "distribution traverses ACTIVATED -> SUSPENDED -> ACTIVATED -> SUSPENDED -> ACTIVATED (two full cycles)"
            - "order after second re-activation succeeds with 201 and queue_status == MERGED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: agreement_termination_cascades_stand_suspend_order_abandon_payment_void
        grounds:
          - state_machines.OperatorAgreement.ACTIVE_to_TERMINATED
          - state_machines.Stand.OPEN_to_SUSPENDED
          - state_machines.Order.QUEUED_to_ABANDONED
          - state_machines.Payment.AUTHORIZED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 transitive cascade from a single trigger: terminating the
          last ACTIVE agreement (link 1) suspends the stand (link 2), which
          abandons in-flight orders and releases their lane slots (link 3),
          which voids their AUTHORIZED payments (link 4). Each link is caused
          by the previous link, not by the terminate call itself.
        test_recipe:
          setup:
            - "Stand OPEN under its only ACTIVE agreement; one app order QUEUED with payment AUTHORIZED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - *c_recipe
            - *c_dist
            - *c_dist_act
            - call: "POST /loyalty-accounts"
              payload: { full_name: "App Amy", home_stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - *c_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "LOYALTY_APP", loyalty_account_id: "${acct_id}", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /operator-agreements/${agr_id}/terminate"
              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { agr_status: $.data.status }
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { stand_status: $.data.status }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { order_queue: $.data.queue_status }
            - call: "GET /payments/${pay_id}"
              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { pay_status: $.data.status }
          assert:
            - "link 1: OperatorAgreement.${agr_id}.status == TERMINATED"
            - "link 2: Stand.${stand_id}.status == SUSPENDED (last ACTIVE agreement gone)"
            - "link 3: Order.${order_id}.queue_status == ABANDONED (from QUEUED, slot was never reserved)"
            - "link 4: Payment.${pay_id}.status == VOIDED"
            - "LoyaltyAccount.${acct_id} accrues 0 points (void, not capture)"

      - name: distribution_withdrawal_cancels_items_and_recomputes_order_totals
        grounds:
          - state_machines.RecipeDistribution.ACTIVATED_to_WITHDRAWN
          - state_machines.OrderItem.PENDING_to_CANCELLED
          - calculations.order_total_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: withdrawing a distribution
          (link 1) cancels the stand's PENDING/BUILDING items of that recipe
          (link 2), and each item cancellation recomputes its parent order's
          subtotal/discount/total and outstanding build seconds (link 3).
        test_recipe:
          setup:
            - "Stand OPEN; window order with quantity 2 of the Carmelizer (450c each, total 900), items still PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - *c_recipe
            - *c_dist
            - *c_dist_act
            - *c_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 2, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /recipe-distributions/${dist_id}/withdraw"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { dist_status: $.data.status }
            - call: "GET /order-items"
              payload: { order_id: "${order_id}" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { item_status: "$.data[0].build_status" }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { total_after: $.data.total_cents, outstanding_after: $.data.outstanding_build_seconds }
          assert:
            - "link 1: RecipeDistribution.${dist_id}.status == WITHDRAWN"
            - "link 2: OrderItem.build_status == CANCELLED"
            - "link 3: Order.${order_id}.total_cents == 0 (was 900) and outstanding_build_seconds == 0"
            - "Order.${order_id}.subtotal_cents == 0 and discount_cents == 0 after recompute"

