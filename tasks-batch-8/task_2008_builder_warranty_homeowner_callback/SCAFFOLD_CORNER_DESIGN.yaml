        distinguishing_aspect: "Breach requires strictly-greater: an assess landing exactly on response_due_at (2026-08-04T00:00:00Z for a STANDARD request reported 2026-08-01) is MET — response_breached stays false."
        test_recipe:
          setup: ["request reported at default clock; clock advanced to exactly the due instant"]
