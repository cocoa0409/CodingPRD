            - call: "POST /incentives/deliveries/${delivery_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { del_status_after: $.data.status }
            - call: "POST /incentives/claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
              captures: { claim_vs_final: $.data.validation_status, claim_amt_final: $.data.approved_amount_cents, claim_basis_final: $.data.rate_basis }
            - call: "GET /incentives/programs/${prog_id}/spend-summary"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { committed_final: $.data.committed_cents, units_final: $.data.claimed_units, spend_final: $.data.per_unit_spend_cents }
          assert:
            - "${del_status_initial} == REPORTED and ${del_flag} == false and ${claim_vs_initial} == SUBMITTED — a claim may be submitted against a delivery the auditor has not yet touched"
            - "the first adjudication returns HTTP 409 with error.code == ERR_DELIVERY_NOT_VALIDATED, even though the Claim itself is in the correct SUBMITTED source state"
            - "${claim_vs_mid} == SUBMITTED and ${claim_amt_mid} == null and ${claim_adj_mid} == null — the cross-entity refusal is a complete no-op on the Claim"
            - "${committed_mid} == 0 and ${units_mid} == 0 — no money moved on the failed adjudication"
            - "${del_status_after} == VALIDATED, and this delivery transition is the ONLY thing that changed between the two adjudication calls"
            - "the second, byte-identical adjudication returns HTTP 200 with ${claim_vs_final} == VALIDATED, ${claim_amt_final} == 130000 and ${claim_basis_final} == AS_SOLD_SNAPSHOT"
            - "${committed_final} == 130000 and ${units_final} == 1 and ${spend_final} == 130000"

      - name: terminated_dealer_standing_blocks_delivery_reporting_and_claim_submission
        grounds:
