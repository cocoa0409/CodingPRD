          setup:
            - "Weekday 2026-08-04; policy A; wagon product 900 c; field estimated 1000 oz OPEN; window 09:00-17:00 capacity 30 OPEN"
            - "Offline batch B1 applies session S1 (party 2, containers 1 -> admission 1500) plus OFFLINE_CARD payment 1500; session then enters the field via API"
            - "Offline batch B2 applies HARVEST_LINE L1 (net 100 oz, PROVISIONAL) against the FIELD_ACTIVE session"
