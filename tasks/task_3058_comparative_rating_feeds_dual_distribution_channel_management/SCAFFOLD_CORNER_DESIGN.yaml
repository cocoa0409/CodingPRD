        claim_type: rbac_denial
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.PortfolioReview.FINDINGS_ISSUED_to_ACTION_TAKEN
        distinguishing_aspect: "Segregation of duties: the reviewer whose X-User-ID opened the review cannot take the action — the same role, a different identity, fails; a second reviewer succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Agent APPOINTED (TX, AUTO). Review opened by ur-1 and findings issued."
          setup_api_calls:
