      - name: the_consummation_gate_reads_a_posture_that_an_unwind_reverted
        claim_type: cascading_validation
        grounds:
          - validations.priority_46_ERR_RESTRICTED_ASSETS_UNRESOLVED
          - calculations.restricted_asset_posture
          - state_machines.RestrictedFund.TRANSFERRED_to_CONSENT_GRANTED
        distinguishing_aspect: |
          The validated field is not supplied by the client and is not stored by the
          endpoint being called: restricted_asset_posture is recomputed by a cascade three
          entities away. Unwinding a fund that was already transferred silently flips the
          posture CLEARED -> RESTRICTED_PENDING, and the very next consummation - with an
          unchanged request body that succeeded a moment earlier - must now be refused.
          Re-transferring the fund clears it again and the same body closes the merger, so
          the rule reads live derived state rather than a snapshot.
