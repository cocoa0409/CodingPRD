      - name: customer_cannot_pay_other_customers_work_order
        claim_type: ownership_denied
        grounds:
          - roles.Customer
          - endpoints./payments
          - entities.WorkOrder.fields.customer_id
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "A Customer (entity_backed) paying a work order whose customer_id != X-User-ID -> 403 ERR_FORBIDDEN (ownership check)."
        test_recipe:
          setup: ["Two customers; customer A owns a REPAIR work order in ASSESSED; customer B acts."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner A", email: "ownera@x.com", phone: "555-0231", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { ca: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Owner B", email: "ownerb@x.com", phone: "555-0232", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cb: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${ca}", vin: "DJGCM82633A004427", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04233" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${ca}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 20, in_driver_primary_view: false, edge_distance_mm: 80 }
              as: ServiceAdvisor
              captures: { asmt: $.data.id }
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /payments"
              payload: { work_order_id: "${wo}", amount_cents: 9657, method: "CARD" }
              as: Customer
              as_user_id: "${cb}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403; data.error_id == ERR_FORBIDDEN"

      - name: missing_auth_header_unauthenticated
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints./work-orders
        distinguishing_aspect: "A request to POST /work-orders with no/invalid X-User-Role -> 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["A customer and vehicle exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "NoAuth Owner", email: "noauth@x.com", phone: "555-0233", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "EJGCM82633A004428", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04234" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401; data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-cutting layers — OCC stale-version, response envelope, pagination
  # =========================================================================
  - section: cross_cutting
    instances:
      - name: part_order_stale_work_order_version_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[part-order-stale-work-order]
          - endpoints./part-orders
          - errors[ERR_STALE_WORK_ORDER_VERSION]
        distinguishing_aspect: "After one part-order reserve bumps WorkOrder.version, a second create still carrying the pre-reserve version -> 412 ERR_STALE_WORK_ORDER_VERSION."
        test_recipe:
          setup: ["A REPLACE non-ADAS work order in ASSESSED; a GlassPart on_hand_qty=5; client holds the post-accept version."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "OCC Owner", email: "occ@x.com", phone: "555-0234", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "FJGCM82633A004429", make: "Honda", model: "Pilot", model_year: 2014, adas_equipped: false, glass_part_number: "FW04235" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04235", description: "OCC glass", adas_compatible: false, unit_price_cents: 22000, on_hand_qty: 5 }
              as: ShopManager
              captures: { pid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 0, longest_crack_mm: 300, in_driver_primary_view: true, edge_distance_mm: 5 }
              as: ServiceAdvisor
              captures: { asmt: $.data.id }
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
            - call: "POST /part-orders"
              payload: { work_order_id: "${wo}", glass_part_id: "${pid}", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /part-orders"
              payload: { work_order_id: "${wo}", glass_part_id: "${pid}", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412; data.error_id == ERR_STALE_WORK_ORDER_VERSION (first reserve bumped version past wo_v2)"

      - name: recalibration_open_stale_work_order_version_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[recalibration-open-stale-work-order]
          - endpoints./recalibration-jobs
          - errors[ERR_STALE_WORK_ORDER_VERSION]
        distinguishing_aspect: "Opening a RecalibrationJob carrying the pre-finish-install WorkOrder.version (version stamped before finish-install bumped it) -> 412 ERR_STALE_WORK_ORDER_VERSION; uses expression ${wo_v_pre}-1 unreachable, so we pin the captured stale value directly."
        test_recipe:
          setup: ["A REPLACE+ADAS work order driven to AWAITING_RECALIBRATION; the client kept the version observed BEFORE finish-install (the accept-assessment version)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "OCC2 Owner", email: "occ2@x.com", phone: "555-0235", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "GJGCM82633A004430", make: "Honda", model: "CR-V", model_year: 2023, adas_equipped: true, glass_part_number: "FW04236" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04236", description: "ADAS glass", adas_compatible: true, unit_price_cents: 31000, on_hand_qty: 5 }
              as: ShopManager
              captures: { pid: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "OCC2 Tech", can_mobile: false, adas_certified: true, home_state: "CA" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Bay Inst O2", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { ibid: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Calib O2", bay_type: "CALIBRATION", cleanroom: false }
              as: ShopManager
              captures: { cbid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 0, longest_crack_mm: 300, in_driver_primary_view: true, edge_distance_mm: 5 }
              as: ServiceAdvisor
              captures: { asmt: $.data.id }
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
            - call: "POST /part-orders"
              payload: { work_order_id: "${wo}", glass_part_id: "${pid}", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo}", technician_id: "${tid}", service_bay_id: "${ibid}", service_location: "IN_SHOP", start_at: "2026-06-13T08:00:00Z", end_at: "2026-06-13T08:59:00Z" }
              as: ServiceAdvisor
              captures: { appt: $.data.id }
            - call: "POST /work-orders/${wo}/schedule"
              payload: { appointment_id: "${appt}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments/${appt}/check-in"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /work-orders/${wo}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /work-orders/${wo}/finish-install"
              payload: { temp_c: 25, humidity_pct: 40 }
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "POST /recalibration-jobs"
              payload: { work_order_id: "${wo}", technician_id: "${tid}", service_bay_id: "${cbid}", calibration_type: "STATIC", start_at: "2026-06-13T09:10:00Z", end_at: "2026-06-13T09:40:00Z", expected_work_order_version: "${wo_v2}" }
              as: Technician
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412; data.error_id == ERR_STALE_WORK_ORDER_VERSION (version advanced through part-reserve, schedule, start-service, finish-install since wo_v2)"

      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.WorkOrder.fields.version
          - endpoints./work-orders/{id}/accept-assessment
        distinguishing_aspect: "WorkOrder.version starts at 1 on create and increments by 1 on accept-assessment (to 2)."
        test_recipe:
          setup: ["An OPEN work order with a DRAFT assessment."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ver Owner", email: "ver@x.com", phone: "555-0236", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "HJGCM82633A004431", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04237" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id, v1: $.data.version }
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 20, in_driver_primary_view: false, edge_distance_mm: 80 }
              as: ServiceAdvisor
              captures: { asmt: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
              captures: { v2: $.data.version }
          assert:
            - "WorkOrder.${wo}.version == 1 at create"
            - "WorkOrder.${wo}.version == 2 after accept-assessment"

      - name: response_envelope_shape_on_create
        claim_type: response_envelope
        grounds:
          - endpoints./customers
        distinguishing_aspect: "A successful create returns the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type=='object', data{}."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Env Owner", email: "env@x.com", phone: "555-0237", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == object; data contains the created customer"

      - name: pagination_defaults_on_glass_parts_list
        claim_type: pagination_with_filtering
        grounds:
          - endpoints./glass-parts
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /glass-parts returns the envelope pagination fields (limit default 10, offset 0, total_count, has_more) over a list of created parts."
        test_recipe:
          setup: ["Two glass parts created."]
          setup_api_calls:
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04238", description: "P1", adas_compatible: false, unit_price_cents: 21000, on_hand_qty: 1 }
              as: ShopManager
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04239", description: "P2", adas_compatible: false, unit_price_cents: 22000, on_hand_qty: 1 }
              as: ShopManager
          trigger:
            - call: "GET /glass-parts?limit=1&offset=0"
              payload: {}
              as: ShopManager
          assert:
            - "response includes total_count >= 2, limit == 1, offset == 0, has_more == true; data array length == 1"

  # =========================================================================
  # Consistency model — immediate visibility of cascades
  # =========================================================================
  - section: consistency_model
    instances:
      - name: cancel_cascade_visible_immediately
        claim_type: immediate
        grounds:
          - state_machines.WorkOrder.OPEN_to_CANCELLED
          - state_machines.ServiceAppointment.BOOKED_to_CANCELLED
        distinguishing_aspect: "Cancelling a SCHEDULED work order immediately reflects the BOOKED appointment as CANCELLED in the same request flow (no lag)."
        test_recipe:
          setup: ["A REPAIR work order in SCHEDULED with a BOOKED in-shop appointment."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Imm Owner", email: "imm@x.com", phone: "555-0238", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "IJGCM82633A004432", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04240" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Imm Tech", can_mobile: false, adas_certified: false, home_state: "CA" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Bay Imm", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { bid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 20, in_driver_primary_view: false, edge_distance_mm: 80 }
              as: ServiceAdvisor
              captures: { asmt: $.data.id }
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo}", technician_id: "${tid}", service_bay_id: "${bid}", service_location: "IN_SHOP", start_at: "2026-06-16T08:00:00Z", end_at: "2026-06-16T09:00:00Z" }
              as: ServiceAdvisor
              captures: { appt: $.data.id }
            - call: "POST /work-orders/${wo}/schedule"
              payload: { appointment_id: "${appt}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /work-orders/${wo}/cancel"
              payload: {}
              as: ServiceAdvisor
            - call: "GET /service-appointments/${appt}"
              payload: {}
              as: ServiceAdvisor
              captures: { appt_status: $.data.status }
          assert:
            - "WorkOrder.${wo}.status == CANCELLED"
            - "ServiceAppointment.${appt}.status == CANCELLED immediately after cancel"
