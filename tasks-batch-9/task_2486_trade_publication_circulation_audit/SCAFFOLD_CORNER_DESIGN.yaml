            - "HTTP 409 with ${err} == ERR_RETENTION_NOT_ELAPSED"
            - "SourceDocument.${doc_i_id}.purge_status is still RETAINED and purged_at is null"
            - "the same call at clock 2029-07-15T00:00:00Z succeeds — the comparison is inclusive"

      - name: certify_conflict_between_not_draft_and_segregation_of_duties
        claim_type: priority_conflict
        grounds: ["validations[priority=30]", "validations[priority=40]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / certify_filed_statement_by_preparer_rejects_not_draft_over_sod
          rationale: "The named §1.8 instance violates both rules in one call and asserts the state error at priority 30 wins."

      - name: verify_conflict_between_purged_document_and_low_score
        claim_type: priority_conflict
        grounds: ["validations[priority=50]", "validations[priority=70]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / verify_with_purged_doc_and_low_score_rejects_purged_over_threshold
          rationale: "The named §1.8 instance violates the referential rule at 50 and the constraint rule at 70 in one call."

