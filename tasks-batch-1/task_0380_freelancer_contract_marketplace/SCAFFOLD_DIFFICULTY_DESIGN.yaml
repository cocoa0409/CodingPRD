# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Freelancer & Contract Work Marketplace — 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_milestone_release_standard_vs_split
        grounds:
          - calculations.platform_fee
          - state_machines.Milestone.APPROVED_to_RELEASED
          - state_machines.Dispute.UNDER_ARBITRATION_to_RESOLVED
          - entities.Payout.fields.net_cents
        distinguishing_aspect: |
          On the Payout/Milestone domain, a STANDARD full release of a 100000-cent escrow yields
          gross=100000 while a SPLIT arbitration award on the same 100000-cent escrow yields gross=60000;
          the two release paths produce different Payout.gross_cents and net_cents for identical funded escrow.
        test_recipe:
          setup:
            - "Client wallet funded; ACTIVE FIXED contract with two FUNDED milestones each holding 100000 escrow."
            - "Milestone M1 will take the STANDARD approve->release path; milestone M2 will take the dispute SPLIT path with award 60000."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Acme", email: "acme@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev", email: "dev1@x.com", skills: ["python"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /clients/${client_id}/wallet/deposit"
              payload: { amount_cents: 500000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "Build API", billing_type: "FIXED", budget_cents: 300000, required_skills: ["python"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 200000, cover_letter: "hi" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: { sow_text: "Deliver API" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "M1", amount_cents: 100000, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "M2", amount_cents: 100000, ordinal: 2 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones/${m1_id}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { cv1: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones/${m2_id}/fund"
              payload: { expected_contract_version: "${cv1}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { cv2: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones/${m1_id}/submit-work"
              payload: {}
              as: Freelancer
              as_user_id: "${fl_id}"
            - call: "POST /contracts/${contract_id}/milestones/${m1_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /contracts/${contract_id}/milestones/${m2_id}/submit-work"
              payload: {}
              as: Freelancer
              as_user_id: "${fl_id}"
            - call: "POST /contracts/${contract_id}/milestones/${m2_id}/dispute"
              payload: { raised_by: "FREELANCER", reason: "scope", claimed_release_cents: 100000 }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /disputes/${disp_id}/assign-arbitration"
              payload: {}
              as: Arbitrator
          trigger:
            - call: "POST /contracts/${contract_id}/milestones/${m1_id}/release"
              payload: { expected_contract_version: "${cv2}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { m1_after: $.data.released_gross_cents }
            - call: "POST /disputes/${disp_id}/resolve"
              payload: { arbitrator_award_cents: 60000 }
              as: Arbitrator
              captures: { m2_after: $.data.id }
          assert:
            - "Milestone.${m1_id}.released_gross_cents == 100000"
            - "Milestone.${m2_id}.released_gross_cents == 60000"
            - "Milestone.${m2_id}.refunded_cents == 40000"
            - "the STANDARD release Payout.gross_cents (100000) != the SPLIT release Payout.gross_cents (60000)"

      - name: dual_variant_tax_record_gross_vs_net_basis
        grounds:
          - calculations.tax_year_reportable
          - entities.TaxRecord.fields.reportable_gross_cents
          - entities.Payout.fields.gross_cents
          - entities.Payout.fields.net_cents
        distinguishing_aspect: |
          On the TaxRecord domain (different entity from platform_fee's Payout/Milestone subject), the same
          freelancer-year produces reportable_gross_cents=60000 under GROSS_BASIS but 48000 under NET_BASIS
          from the identical single PAID payout (gross 60000, fee 12000, net 48000).
        test_recipe:
          setup:
            - "Freelancer with one PAID payout in tax year 2026: gross 60000, fee 12000, net 48000."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Beta", email: "beta@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev2", email: "dev2@x.com", skills: ["go"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /clients/${client_id}/wallet/deposit"
              payload: { amount_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "Job", billing_type: "FIXED", budget_cents: 80000, required_skills: ["go"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 60000, cover_letter: "hi" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: { sow_text: "do work" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "M", amount_cents: 60000, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m_id: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { cv1: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/submit-work"
              payload: {}
              as: Freelancer
              as_user_id: "${fl_id}"
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/release"
              payload: { expected_contract_version: "${cv1}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /milestones/${m_id}/payouts"
              payload: {}
              as: PlatformAdmin
              captures: { payout_id: "$.data[0].id" }
            - call: "POST /payouts/${payout_id}/settle"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /tax-records"
              payload: { freelancer_id: "${fl_id}", tax_year: 2026, basis: "GROSS_BASIS" }
              as: PlatformAdmin
              captures: { gross_record: $.data.reportable_gross_cents }
            - call: "POST /tax-records"
              payload: { freelancer_id: "${fl_id}", tax_year: 2026, basis: "NET_BASIS" }
              as: PlatformAdmin
              captures: { net_record: $.data.reportable_gross_cents }
          assert:
            - "GROSS_BASIS TaxRecord.reportable_gross_cents == 60000 and is_reportable == true (form_status GENERATED)"
            - "NET_BASIS TaxRecord.reportable_gross_cents == 48000 and is_reportable == false (form_status BELOW_THRESHOLD)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_platform_fee_tier_plus_surcharge_clamp
        grounds:
          - calculations.platform_fee
          - entities.Freelancer.fields.lifetime_earnings_cents
          - entities.Freelancer.fields.dispute_loss_count
          - entities.Payout.fields.platform_fee_cents
        distinguishing_aspect: |
          Mode (a): platform_fee combines >=3 inputs (gross, lifetime_earnings tier selection,
          dispute_loss_count surcharge) with nested branch+min clamp — TIER_A 0.20 + 0.05 risk surcharge
          clamped by MAX_RATE 0.25 yields fee floor(100000*0.25)=25000, not 0.30.
        test_recipe:
          setup:
            - "Freelancer with dispute_loss_count >= 3 and lifetime_earnings_cents 0 (TIER_A) about to receive a 100000-cent release."
            - "Three prior CLIENT_FAVOR disputes lost to push dispute_loss_count to 3."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Gamma", email: "gamma@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev3", email: "dev3@x.com", skills: ["rust"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /clients/${client_id}/wallet/deposit"
              payload: { amount_cents: 1000000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "Risky", billing_type: "FIXED", budget_cents: 500000, required_skills: ["rust"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 400000, cover_letter: "hi" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: { sow_text: "risk work" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "L1", amount_cents: 30000, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ml1: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "L2", amount_cents: 30000, ordinal: 2 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ml2: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "L3", amount_cents: 30000, ordinal: 3 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ml3: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "PAY", amount_cents: 100000, ordinal: 4 }
              as: Client
              as_user_id: "${client_id}"
              captures: { mpay: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones/${ml1}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { cv1: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones/${ml2}/fund"
              payload: { expected_contract_version: "${cv1}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { cv2: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones/${ml3}/fund"
              payload: { expected_contract_version: "${cv2}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { cv3: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones/${mpay}/fund"
              payload: { expected_contract_version: "${cv3}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { cv4: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones/${ml1}/submit-work"
              payload: {}
