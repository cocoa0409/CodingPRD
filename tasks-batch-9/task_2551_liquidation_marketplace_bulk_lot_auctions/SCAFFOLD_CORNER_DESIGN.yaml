            - call: "POST /liquidation/lots/${lot2}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot2}/manifest-reviews"
              payload: { decision: "APPROVE", review_note: "threshold lot two verified" }
              as: MarketplaceOps
