        grounds: ["errors[ERR_MILESTONE_CYCLE]", "validations[priority=32]", entities.Milestone.fields.sequence_index]
        distinguishing_aspect: "Acyclicity is enforced structurally by sequence_index rather than by graph traversal: naming a prerequisite whose sequence_index is greater than the new milestone's is refused, and the same request pointing at a strictly smaller sequence_index is accepted."
