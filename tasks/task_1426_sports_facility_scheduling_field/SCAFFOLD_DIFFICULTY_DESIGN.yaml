          awarded_prime_hours == sum of prime hours over the org's permits in {RESERVED,
          CONFIRMED}: award(+2) then cancel(-2) returns org A's ledger to exactly 0 with no
          drift, and the waitlist promotion re-adds exactly 2 to org B's ledger — the freed
