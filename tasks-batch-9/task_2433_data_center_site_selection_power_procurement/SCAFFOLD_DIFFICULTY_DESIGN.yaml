      - name: parcel_apn_half_open_window_adjacency
        grounds:
          - validations[priority=29]
          - entities.LandParcelOption.fields.window_start
          - entities.LandParcelOption.fields.window_end
          - concurrency_rules[parcel-option-supersede-stale-site]
        distinguishing_aspect: |
          Parcel exclusivity is pairwise on (site_id, parcel_apn) over HALF-OPEN windows with NO
          buffer: a second option starting 2027-06-01 inside the live 2027-01-01..2027-12-31 window
          is refused with ERR_OPTION_WINDOW_CONFLICT, while one starting exactly at the incumbent's
          window_end 2027-12-31 is admitted — adjacency is legal, unlike the buffered CLOSED
          aggregate intervals of the transmission instance.
        test_recipe:
          setup:
            - "Site Alpha of 300 gross acres with one OPTIONED parcel APN-100 for 120 acres over 2027-01-01..2027-12-31 (half-open)."
            - "Logical clock left at its 2026-08-01T00:00:00Z default so both candidate windows are forward-dated."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "GET /candidate-sites/${s1_id}"
              payload: {}
              as: SiteScreeningAnalyst
              captures: { s1_v0: $.data.version }
            - call: "POST /parcel-options"
              payload: { site_id: "${s1_id}", parcel_apn: "APN-100", phase_index: 1, acres: 120, option_premium_usd: 500000, purchase_price_usd: 18000000, premium_credit_pct: 0.5, window_start: "2027-01-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z", expected_site_version: "${s1_v0}" }
              as: SiteScreeningAnalyst
              captures: { o1_id: $.data.id }
            - call: "GET /candidate-sites/${s1_id}"
              payload: {}
              as: SiteScreeningAnalyst
              captures: { s1_v1: $.data.version }
          trigger:
            - call: "POST /parcel-options"
              payload: { site_id: "${s1_id}", parcel_apn: "APN-100", phase_index: 2, acres: 30, option_premium_usd: 200000, purchase_price_usd: 5000000, premium_credit_pct: 0.5, window_start: "2027-06-01T00:00:00Z", window_end: "2028-06-01T00:00:00Z", expected_site_version: "${s1_v1}" }
              as: SiteScreeningAnalyst
              captures: { err_id: $.data.error_id }
            - call: "POST /parcel-options"
              payload: { site_id: "${s1_id}", parcel_apn: "APN-100", phase_index: 3, acres: 30, option_premium_usd: 200000, purchase_price_usd: 5000000, premium_credit_pct: 0.5, window_start: "2027-12-31T00:00:00Z", window_end: "2028-12-31T00:00:00Z", expected_site_version: "${s1_v1}" }
              as: SiteScreeningAnalyst
              captures: { o3_id: $.data.id }
          assert:
            - "the first trigger returns HTTP 409 with ${err_id} == ERR_OPTION_WINDOW_CONFLICT"
            - "CandidateSite.${s1_id}.land_control_pct == 40.00 after the refused create (120 of 300 acres)"
            - "the second trigger returns HTTP 201 and LandParcelOption.${o3_id}.status == OPTIONED"
            - "LandParcelOption.${o3_id}.window_start == 2027-12-31T00:00:00Z equals LandParcelOption.${o1_id}.window_end, and the abutting pair is accepted"
            - "CandidateSite.${s1_id}.land_control_pct == 50.00 after the accepted create (150 of 300 acres)"
            - "SitingProgram.${p_id}.option_exposure_usd == 700000.00"
            - "the refused create did not increment CandidateSite.${s1_id}.version, which is why the second create reuses ${s1_v1} successfully"

  - rule_id: compensating_invariant
    instances:
      - name: utility_capacity_restored_on_withdraw
        grounds:
          - calculations.utility_capacity_ledger
          - state_machines.InterconnectionApplication.CAPACITY_RESERVED_to_WITHDRAWN
          - entities.Utility.fields.available_capacity_mw
        distinguishing_aspect: |
          reserved_capacity_mw + available_capacity_mw == total_transmission_capacity_mw (400.0)
          holds at every step, and withdrawing the reservation restores the ledger to exactly its
          pre-reservation values (0 / 400.0) with no residual MW — the conserved quantity is
          transmission capacity, in MW.
        test_recipe:
          setup:
            - "Utility with total_transmission_capacity_mw 400 and commissioning_buffer_days 90."
            - "Site Alpha screened; its 300 MW application walked to CAPACITY_RESERVED so reserved_capacity_mw is 300.0 and available_capacity_mw is 100.0."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Bravo", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Catawba Electric", state_code: "SC", balancing_authority: "SOCO", total_transmission_capacity_mw: 400, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Broad River", basin_code: "BRD-01", state_code: "SC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "SC", county: "Cherokee", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /candidate-sites/${s1_id}/screen"
              payload: { transmission_headroom_mw: 300, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "AIR_COOLED", annual_water_demand_mgal: 0 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
            - call: "POST /interconnection-applications"
              payload: { site_id: "${s1_id}", utility_id: "${u_id}", requested_mw: 300, window_start: "2029-01-01T00:00:00Z", window_end: "2029-12-31T00:00:00Z" }
              as: SiteScreeningAnalyst
              captures: { a1_id: $.data.id }
            - call: "POST /interconnection-applications/${a1_id}/submit"
              payload: {}
              as: SiteScreeningAnalyst
            - call: "POST /interconnection-applications/${a1_id}/load-studies"
              payload: { it_load_mw: 240, cooling_load_mw: 66, ancillary_load_mw: 12, diversity_factor: 0.92 }
              as: UtilityPlanner
              as_user_id: "${u_id}"
            - call: "POST /interconnection-applications/${a1_id}/reserve-capacity"
              payload: {}
              as: UtilityPlanner
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /interconnection-applications/${a1_id}/withdraw"
              payload: { withdrawal_reason: "SPONSOR_DEFERRED" }
              as: SiteScreeningAnalyst
          assert:
            - "InterconnectionApplication.${a1_id}.status == WITHDRAWN"
            - "InterconnectionApplication.${a1_id}.reserved_mw == 0"
            - "InterconnectionApplication.${a1_id}.queue_position == 0"
            - "Utility.${u_id}.reserved_capacity_mw == 0"
            - "Utility.${u_id}.available_capacity_mw == 400.0"
            - "Utility.${u_id}.reserved_capacity_mw + Utility.${u_id}.available_capacity_mw == 400.0 (invariant holds before the reservation, while reserved at 300.0/100.0, and after the withdrawal)"
            - "InterconnectionApplication.${a1_id}.study_fee_usd == 360000.00 (the study fee is sunk and is NOT compensated)"
            - "CandidateSite.${s1_id}.site_capital_commitment_usd == 0"

      - name: option_premium_conserved_on_supersede_release
        grounds:
          - calculations.option_premium_ledger
          - state_machines.LandParcelOption.OPTIONED_to_RELEASED
          - entities.SitingProgram.fields.premium_committed_total_usd
          - concurrency_rules[parcel-option-supersede-stale-site]
        distinguishing_aspect: |
          Superseding an option moves 1250000.00 from option_exposure_usd to
          forfeited_premium_usd while premium_committed_total_usd rises only by the NEW option's
          premium (1250000.00 -> 1650000.00), so exposure + forfeited + capitalized always equals
          the total — the conserved quantity is money across three buckets, not MW across one
          ledger pair.
        test_recipe:
          setup:
            - "Site Alpha of 300 gross acres with one OPTIONED parcel APN-100 for 240 acres, premium 1,250,000, window 2027-01-01..2027-12-31."
            - "Program ledger therefore reads exposure 1250000.00, forfeited 0, capitalized 0, total 1250000.00."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
