      - name: reservation_state_rule_outranks_the_two_pool_rules
        claim_type: priority_ordering
        grounds:
          - validations.reservation_exhaust_pool
          - validations.reservation_power_pool
        excluded_because:
          difficulty_instance: reservation_state_error_precedes_capacity_and_power_errors
          rationale: "That §1.8 instance already walks the priority ladder on POST /capacity-reservations, showing the state guard, then ERR_EXHAUST_CAPACITY_EXCEEDED before ERR_POWER_CAPACITY_EXCEEDED on a payload that violates both pools."

      - name: vibration_rule_outranks_the_delivery_term_rule
        claim_type: priority_ordering
        grounds:
          - validations.phase_vibration_conflict
          - validations.phase_window_within_term
        excluded_because:
          difficulty_instance: phase_vibration_safety_error_precedes_delivery_term_error
          rationale: "The priority-30 versus priority-40 contest on POST /phase-packages/{phaseId}/schedule is asserted there with a window that violates both rules at once."

      - name: vibration_buffer_interval_test_at_the_exact_buffer
        claim_type: violation_to_error
        grounds:
          - validations.phase_vibration_conflict
          - calculations.building_capacity_pools
        excluded_because:
          difficulty_instance: phase_vibration_buffer_conflicts_at_exactly_24h_gap
          rationale: "The closed buffered-interval boundary (a 24h gap conflicts, 24h plus one second does not) is that §1.8 instance's subject, including the VIBRATION_BUFFER_HOURS constant."

      - name: permit_application_requires_the_exhaust_scope_item_complete
        claim_type: violation_to_error
        grounds:
          - validations.permit_application_exhaust_scope_complete
          - errors.ERR_EXHAUST_SCOPE_INCOMPLETE
        excluded_because:
          difficulty_instance: permit_application_gated_on_lab_exhaust_scope_item_state
          rationale: "That §1.8 instance drives the same endpoint across the LAB_EXHAUST scope item's PLANNED and COMPLETE states, so the violation and the satisfaction are both pinned there."

      - name: shutdown_window_conflict_with_a_confirmed_allocation
        claim_type: violation_to_error
        grounds:
          - validations.phase_shutdown_amenity_conflict
          - errors.ERR_SHUTDOWN_CONFLICTS_AMENITY
        excluded_because:
          difficulty_instance: shutdown_phase_gated_on_confirmed_amenity_allocation_state
