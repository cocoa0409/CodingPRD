              captures: { c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version }
            - call: "GET /contracts/${contract_id}/approval-workflows"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { wf_id: $.data.0.id }
          trigger:
