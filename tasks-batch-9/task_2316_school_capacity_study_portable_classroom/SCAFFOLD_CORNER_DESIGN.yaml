      - name: inventory_listing_combines_filters_paging_and_stable_ordering
        claim_type: pagination_with_filtering
        grounds: ["endpoints[GET /facilities/portable-units]", response_envelope.pagination]
        distinguishing_aspect: "Five units across two size classes and two condition states are listed with a filter and a two-row page, so the envelope must report total_count 3 for the filtered set rather than 5 for the table, has_more must flip between the pages, and the second page must not repeat a row. Filtering on two dimensions at once then narrows to a single row, which catches an implementation that applies only the last filter it parsed."
        test_recipe:
          setup: ["five units: three single-wides and two double-wides, one of the single-wides marked NEEDS_REHAB"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-P001", size_class: "SINGLE_24x40", condition_grade: "A", ada_ramp_installed: true, acquisition_cost_cents: 9600000, in_service_year: 2021 }
              as: AssetManager
              as_user_id: "assets-3"
              captures: { unit_one_id: id }
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-P002", size_class: "SINGLE_24x40", condition_grade: "B", ada_ramp_installed: true, acquisition_cost_cents: 9600000, in_service_year: 2019 }
              as: AssetManager
              as_user_id: "assets-3"
              captures: { unit_two_id: id }
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-P003", size_class: "SINGLE_24x40", condition_grade: "C", ada_ramp_installed: false, acquisition_cost_cents: 9600000, in_service_year: 2014 }
              as: AssetManager
              as_user_id: "assets-3"
              captures: { unit_three_id: id }
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-P004", size_class: "DOUBLE_28x64", condition_grade: "B", ada_ramp_installed: true, acquisition_cost_cents: 15000000, in_service_year: 2019 }
              as: AssetManager
              as_user_id: "assets-3"
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-P005", size_class: "DOUBLE_28x64", condition_grade: "C", ada_ramp_installed: false, acquisition_cost_cents: 15000000, in_service_year: 2013 }
              as: AssetManager
              as_user_id: "assets-3"
            - call: "POST /facilities/portable-units/${unit_three_id}/condition"
              payload: { condition_status: "NEEDS_REHAB", condition_grade: "C" }
              as: AssetManager
              as_user_id: "assets-3"
          trigger:
            call: "GET /facilities/portable-units"
            payload: { size_class: "SINGLE_24x40", limit: 2, offset: 0 }
            as: AssetManager
            as_user_id: "assets-3"
          assert:
            - "response status is 200 and response_type == \"array\""
            - "data.total_count == 3 - the filtered count, not the five rows in the table"
            - "data.limit == 2, data.offset == 0 and data.has_more == true"
            - "exactly two of ${unit_one_id}, ${unit_two_id} and ${unit_three_id} are present, and none of the double-wides"
            - "the second page completes the set without repetition: the same read with offset 2 returns data.total_count == 3, data.has_more == false and the one remaining single-wide id"
            - "two filters compose: the same read with size_class SINGLE_24x40 and condition_status NEEDS_REHAB returns data.total_count == 1 and the single row ${unit_three_id}"
            - "an unmatched combination is empty, not an error: size_class DOUBLE_28x64 with condition_status UNSAFE returns 200 with data.total_count == 0 and data.has_more == false"

