            - "Timesheet.${ts_id}.status is still \"BILL_ACCEPTED\" and its net_billable_units is still ${net_units}"
            - "the case read shows billed_units_to_date == ${net_units}: the refused decision credited nothing a second time"

  - section: rbac
    instances:
      - name: an_absent_role_header_is_rejected_before_anything_else
        claim_type: Missing Credentials
        grounds:
          - validations[priority 1 ERR_MISSING_AUTH_HEADER]
          - roles
        distinguishing_aspect: >-
          A request that omits X-User-Role is 401 even when the path id is also unknown and the body
          is also invalid, because priority 1 precedes both the existence checks and
          ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "No data is needed; both calls send an empty role header."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "GET /pdn/nurses"
              payload: {}
              as: ""
              as_user_id: "admin-001"
            - call: "POST /pdn/cases/00000000-0000-4000-8000-000000000000/hold"
              payload: { hold_reason: "NOT_A_LEGAL_REASON" }
              as: ""
              as_user_id: ""
          assert:
            - "the nurse listing returns HTTP 401 with error_id ERR_MISSING_AUTH_HEADER (the role header is sent as the empty string, never as whitespace)"
            - "the hold call returns HTTP 401 with the same error_id, not ERR_CASE_NOT_FOUND and not ERR_INVALID_REQUEST"

