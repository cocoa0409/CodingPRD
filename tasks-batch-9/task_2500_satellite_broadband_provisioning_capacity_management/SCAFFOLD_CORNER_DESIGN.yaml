          - calculations.cell_slot_availability
          - entities.Subscriber.fields.account_state
          - 'endpoints["POST /satellite-broadband/subscriptions/{id}/suspend"]'
        distinguishing_aspect: "A three-hop chain whose middle hop is only observable because the beam was pushed SATURATED by a tightened policy: freeing one subscription's Mbps flips the beam back to NORMAL (hop 1), which re-opens every cell from CLOSED to WAITLIST_ONLY (hop 2), while the subscriber account rolls up to SUSPENDED (hop 3) and the cell's committed slot is deliberately NOT released."
