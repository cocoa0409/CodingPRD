            - "old_event_status == \"SUPERSEDED\" (the first-listed event is the original [01-01, 02-01) INDEPENDENT event; partial overlap [01-15, 02-01) supersedes the whole old interval)"
            - "share_after == 10.0 (1000 bigbox / (9000 + 1000) confirmed total, round_half_up to 2 decimals)"

      - name: license_term_adjacency_no_overlap
        grounds:
          - calculations.license_fee
          - entities.ColorLicense.fields.expires_on
        distinguishing_aspect: |
          Interval semantics B (half-open adjacency, different resource): a
          license renewed so its new term starts exactly when the old term
          ends is NOT an overlap — at the instant now == old expires_on the
          lazy sweep has already flipped the license to EXPIRED, and the
          EXPIRED renewal charges the prorated 0 fee, distinct from the
          channel-event supersede arithmetic.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. ONBOARDING dealer (never activated) with license L1 activated 2026-09-01 (expires_on 2027-09-01). Clock advanced to exactly 2027-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /dealer-network/colorant-systems"
              payload: { code: "G25", name: "Gen-25 Colorant System", generation: 25, annual_license_fee_cents: 2500000, min_initial_inventory_units: 40 }
              as: ColorLabAdmin
              captures: { system_id: $.data.id }
            - call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Beacon Paint Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", branding_compliant: true, coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /dealer-network/dealers/${dealer_id}/begin-onboarding"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/equipment"
              payload: { dealer_id: "${dealer_id}", serial_no: "SN-100", model: "Corob D600", colorant_system_id: "${system_id}", installed_on: "2026-09-01T00:00:00Z" }
              as: EquipmentTech
              captures: { equip_id: $.data.id }
            - call: "POST /dealer-network/licenses"
              payload: { dealer_id: "${dealer_id}", colorant_system_id: "${system_id}" }
              as: RegionManager
              captures: { lic_id: $.data.id }
            - call: "POST /dealer-network/equipment/${equip_id}/calibrations"
              payload: { performed_on: "${clock_now}", result: "PASS" }
              as: EquipmentTech
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /dealer-network/licenses/${lic_id}"
              as: RegionManager
              captures: { status_at_boundary: $.data.status }
            - call: "POST /dealer-network/licenses/${lic_id}/renew"
              payload: {}
              as: RegionManager
              captures: { basis: $.data.fee_basis, fee: $.data.fee_charged_cents, new_expiry: $.data.expires_on }
          assert:
            - "status_at_boundary == \"EXPIRED\" (half-open term: now >= expires_on flips the license at the exact boundary)"
            - "basis == \"PRORATED\" and fee == 0 (zero days remain under the old term at adjacency)"
            - "new_expiry starts a fresh 365-day term (2028-09-01), so adjacent terms never double-cover a day"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: coop_ledger_conservation_through_claim_lifecycle
        grounds:
          - calculations.coop_accrual
          - state_machines.CoopClaim
          - entities.Dealer.fields.coop_balance_cents
        distinguishing_aspect: |
          Conserved quantity = dealer co-op funds: for the approve-then-pay
          pair, (coop_balance_cents + coop_pending_cents) is invariant after
          approve (money moves balance -> pending), and pay decreases the sum
          by exactly amount_cents — no drift across the lifecycle.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Fully onboarded ACTIVE dealer (branding_compliant, accrual 0.02) whose PAID INITIAL_STOCK order accrued 80 cents; a SUBMITTED claim of 50 cents exists."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
