# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# CECL Allowance for Credit Losses
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: segment_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.PortfolioSegment, "validations[priority=4]"]
        distinguishing_aspect: "Client-supplied id/created_at/version in the create body are ignored, not rejected; server-minted values are returned."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024, id: "11111111-1111-4111-8111-111111111111", version: 99 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id, seg_v: $.data.version }
          assert:
            - "201; response id != '11111111-1111-4111-8111-111111111111' (server-minted) and version == 1 (${seg_v})"
            - "status == OPEN; origination_total_cents == 0"

      - name: loan_defaults_applied
        claim_type: defaults
        grounds: [entities.Loan.fields.delinquency_days, entities.Loan.fields.collateral_value_cents]
        distinguishing_aspect: "Omitting delinquency_days and collateral_value_cents applies defaults 0 and 0."
        test_recipe:
          setup: ["OPEN segment"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "AUTO-NP-2024", name: "Auto NP", product_type: AUTO, risk_rating_band: NEAR_PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-D1", amortized_cost_cents: 25000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { dd: $.data.delinquency_days, cv: $.data.collateral_value_cents, st: $.data.status }
          assert:
            - "delinquency_days == 0 (${dd}) and collateral_value_cents == 0 (${cv})"
            - "status == ACTIVE (${st}); individually_evaluated == false"

      - name: loan_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Loan.fields.risk_rating, "validations[priority=4]"]
        distinguishing_aspect: "risk_rating outside the declared enum is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["OPEN segment"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "AUTO-NP-2024", name: "Auto NP", product_type: AUTO, risk_rating_band: NEAR_PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-E1", amortized_cost_cents: 25000, risk_rating: "VERY_BAD" }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (${err}); http 400"

      - name: loan_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent loan id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cecl/loans/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (${err}); http 404"

      - name: individually_evaluated_boundary
        claim_type: computed_fields
        grounds: [calculations.individual_evaluation_flag]
        distinguishing_aspect: "Threshold uses >= : 100000000 cents exactly is individually evaluated; 99999999 is not; SUBSTANDARD below the threshold is evaluated via the rating branch."
        test_recipe:
          setup: ["OPEN segment"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "MTG-PRIME-2024", name: "Prime Mtg", product_type: MORTGAGE, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-T1", amortized_cost_cents: 99999999, risk_rating: PASS }
              as: CreditAnalyst
              captures: { f1: $.data.individually_evaluated }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-T2", amortized_cost_cents: 100000000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { f2: $.data.individually_evaluated }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-T3", amortized_cost_cents: 50000, risk_rating: SUBSTANDARD }
              as: CreditAnalyst
              captures: { f3: $.data.individually_evaluated }
          assert:
            - "99999999 PASS -> individually_evaluated == false (${f1})"
            - "100000000 PASS (exactly at threshold) -> individually_evaluated == true (${f2})"
            - "50000 SUBSTANDARD (rating branch) -> individually_evaluated == true (${f3})"

      - name: loan_computed_flag_input_ignored
        claim_type: computed_fields
        grounds: [entities.Loan.fields.individually_evaluated]
        distinguishing_aspect: "Client-supplied individually_evaluated in the create body is ignored; the computed value prevails."
        test_recipe:
          setup: ["OPEN segment"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "MTG-PRIME-2024", name: "Prime Mtg", product_type: MORTGAGE, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-C1", amortized_cost_cents: 100000000, risk_rating: PASS, individually_evaluated: false }
              as: CreditAnalyst
              captures: { f: $.data.individually_evaluated }
          assert:
            - "individually_evaluated == true (${f}) despite body claiming false"

      - name: backtest_result_immutability
        claim_type: immutability
        grounds: [entities.BacktestResult]
        distinguishing_aspect: "BacktestResult has common_fields: false — responses carry id and created_at but no version/updated_at, and no update/delete endpoint exists."
        test_recipe:
          setup:
            - "ACTIVE model; one FINALIZED run (small PRIME portfolio, single BASELINE scenario, allowance 50000 / exposure 10000000)"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-IM", amortized_cost_cents: 10000000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /cecl/model-runs/${run_id}/submit_for_review"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/model-runs/${run_id}/approve"
              payload: {}
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
            - call: "POST /cecl/model-runs/${run_id}/finalize"
              payload: { period_charge_offs_cents: 0, period_recoveries_cents: 0 }
              as: ChiefCreditOfficer
          trigger:
            - call: "POST /cecl/loss-models/${m_id}/backtests"
              payload: { backtest_period: "2026-Q1", actual_loss_rate_bps: 60 }
              as: ModelValidator
              captures: { bt_id: $.data.id }
          assert:
            - "BacktestResult ${bt_id} response has no 'version' and no 'updated_at' key"
            - "outcome == PASS (|60 - 50| = 10 <= 150); predicted_loss_rate_bps == 50"

      - name: model_runs_list_pagination
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["ACTIVE model; BASELINE scenario; two DRAFT runs (2026-Q1, 2026-Q2)"]
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q2", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
          trigger:
            - call: "GET /cecl/model-runs"
              payload: { limit: 1, offset: 0 }
              as: CreditAnalyst
          assert:
            - "Page 1: exactly 1 row, total_count == 2, has_more == true"
            - "offset=1 returns the second run; has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_from_executed_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ModelRun.transitions, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Approve from EXECUTED (never submitted) by a DIFFERENT user than the executor isolates the pure state violation: ERR_INVALID_STATE_TRANSITION, run stays EXECUTED."
        test_recipe:
          setup: ["Run 2026-Q1 EXECUTED by analyst-1 (zero evaluations)"]
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-A1", amortized_cost_cents: 50000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /cecl/model-runs/${run_id}/approve"
              payload: {}
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (${err})"
            - "ModelRun.${run_id}.status remains EXECUTED"

      - name: finalize_twice_rejected_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.ModelRun.terminal_states]
        distinguishing_aspect: "FINALIZED is terminal: a second finalize is rejected and no second DisclosureReport is created."
        test_recipe:
          setup: ["Run 2026-Q1 FINALIZED"]
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-F1", amortized_cost_cents: 50000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /cecl/model-runs/${run_id}/submit_for_review"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/model-runs/${run_id}/approve"
              payload: {}
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
            - call: "POST /cecl/model-runs/${run_id}/finalize"
              payload: { period_charge_offs_cents: 0, period_recoveries_cents: 0 }
              as: ChiefCreditOfficer
          trigger:
            - call: "POST /cecl/model-runs/${run_id}/finalize"
              payload: { period_charge_offs_cents: 0, period_recoveries_cents: 0 }
              as: ChiefCreditOfficer
              captures: { err: $.data.error_id }
            - call: "GET /cecl/model-runs/${run_id}/disclosure-reports"
              payload: {}
              as: CreditAnalyst
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (${err})"
            - "GET disclosure-reports for ${run_id} still returns exactly 1 report"

      - name: factor_approve_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.QualitativeFactor.transitions]
        distinguishing_aspect: "Skipping the document step: approve on a DRAFT factor is rejected; the DOCUMENTED state is mandatory."
        test_recipe:
          setup: ["DRAFT factor"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/qualitative-factors"
              payload: { segment_id: "${seg_id}", factor_code: CONCENTRATION_RISK, adjustment_bps: 25, effective_from_period: "2026-Q1", effective_to_period: "2026-Q2" }
              as: CreditAnalyst
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /cecl/qualitative-factors/${f_id}/approve"
              payload: {}
              as: ChiefCreditOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (${err}); factor remains DRAFT"

      - name: evaluation_submit_without_notes_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.IndividualEvaluation.DRAFT_to_SUBMITTED, "errors[ERR_ANALYSIS_DOCUMENTATION_REQUIRED]"]
        distinguishing_aspect: "Submit with empty analysis_notes is rejected with ERR_ANALYSIS_DOCUMENTATION_REQUIRED (422), not a generic state error."
        test_recipe:
          setup: ["Run EXECUTED with one DRAFT evaluation (SUBSTANDARD loan)"]
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "SB-SUB-2023", name: "SmallBiz Subprime", product_type: SMALL_BUSINESS, risk_rating_band: SUBPRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-N1", amortized_cost_cents: 500000, risk_rating: SUBSTANDARD, collateral_value_cents: 460000 }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
            - call: "GET /cecl/individual-evaluations"
              payload: { run_id: "${run_id}" }
              as: CreditAnalyst
              captures: { ie_id: "$.data[0].id" }
          trigger:
            - call: "POST /cecl/individual-evaluations/${ie_id}/submit"
              payload: {}
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ANALYSIS_DOCUMENTATION_REQUIRED (${err}); evaluation remains DRAFT"

      - name: disclosure_signoff_from_prepared_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DisclosureReport.transitions]
        distinguishing_aspect: "sign_off directly from PREPARED (skipping submit_for_audit) is rejected even for the ExternalAuditor."
        test_recipe:
          setup: ["Run 2026-Q1 FINALIZED (DisclosureReport in PREPARED)"]
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-D9", amortized_cost_cents: 50000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /cecl/model-runs/${run_id}/submit_for_review"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/model-runs/${run_id}/approve"
              payload: {}
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
            - call: "POST /cecl/model-runs/${run_id}/finalize"
              payload: { period_charge_offs_cents: 0, period_recoveries_cents: 0 }
              as: ChiefCreditOfficer
            - call: "GET /cecl/model-runs/${run_id}/disclosure-reports"
              payload: {}
              as: CreditAnalyst
              captures: { dr_id: "$.data[0].id" }
          trigger:
            - call: "POST /cecl/disclosure-reports/${dr_id}/sign_off"
              payload: { audit_reference: "AUD-2026-001" }
              as: ExternalAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (${err}); report remains PREPARED"

      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.LossModel, state_machines.ModelRun, state_machines.QualitativeFactor, state_machines.EconomicScenario]
        distinguishing_aspect: "New entities start in their declared initial states: model DRAFT, run DRAFT, factor DRAFT, scenario ACTIVE, loan ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_st: $.data.status }
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { s_st: $.data.status }
            - call: "POST /cecl/qualitative-factors"
              payload: { segment_id: "${seg_id}", factor_code: POLICY_CHANGE, adjustment_bps: 10, effective_from_period: "2026-Q1", effective_to_period: "2026-Q1" }
              as: CreditAnalyst
              captures: { f_st: $.data.status }
          assert:
            - "LossModel.status == DRAFT (${m_st}); EconomicScenario.status == ACTIVE (${s_st}); QualitativeFactor.status == DRAFT (${f_st})"

      - name: model_activate_auto_retire_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.LossModel.DRAFT_to_ACTIVE]
        excluded_because:
          difficulty_instance: reversion_straight_line_vs_immediate
          rationale: "That instance's asserts include LossModel.${m_sl}.status == RETIRED after the second activation."

      - name: partial_charge_off_keeps_active_and_boundary_rate
        claim_type: side_effect_execution
        grounds: [state_machines.Loan.ACTIVE_to_ACTIVE, calculations.segment_charge_off_rate]
        distinguishing_aspect: "Partial charge-off keeps the loan ACTIVE with reduced amortized cost, and a recomputed rate of exactly 200 bps does NOT trigger WATCH (strict >)."
        test_recipe:
          setup: ["Segment with two PASS loans of 100000 (origination_total 200000)"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "AUTO-NP-2023", name: "Auto NP", product_type: AUTO, risk_rating_band: NEAR_PRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-P1", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { loan_1: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-P2", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
          trigger:
            - call: "POST /cecl/loans/${loan_1}/charge_off"
              payload: { charge_off_amount_cents: 4000, charge_off_period: "2026-Q1" }
              as: CreditAnalyst
            - call: "GET /cecl/portfolio-segments/${seg_id}"
              payload: {}
              as: CreditAnalyst
          assert:
            - "Loan.${loan_1}.status == ACTIVE; amortized_cost_cents == 96000; charged_off_total_cents == 4000"
            - "charge_off_rate_bps == 200 (round_half_up(4000*10000/200000)) and status remains OPEN (200 is not > 200)"

      - name: recovery_on_never_charged_loan_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Loan.ACTIVE_to_ACTIVE, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "record_recovery on an ACTIVE loan with charged_off_total_cents == 0 is rejected with ERR_INVALID_STATE_TRANSITION (nothing to recover against)."
        test_recipe:
          setup: ["Segment with one PASS loan 100000, never charged off"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "AUTO-NP-2023", name: "Auto NP", product_type: AUTO, risk_rating_band: NEAR_PRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-R9", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /cecl/loans/${loan_id}/record_recovery"
              payload: { recovery_amount_cents: 1000, recovery_period: "2026-Q1" }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (${err})"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: collective_exposure_excludes_individual_and_charged_off
        claim_type: input_set_filtering
        grounds: [calculations.quantitative_reserve, calculations.individual_evaluation_flag]
        distinguishing_aspect: "The collective input set excludes individually-evaluated loans (SUBSTANDARD) and non-ACTIVE loans (fully charged off): exposure is exactly the 10000000-cent PASS loan."
        test_recipe:
          setup:
            - "PRIME segment with: PASS loan 10000000; SUBSTANDARD loan 500000 (collateral 460000); PASS loan 80000 fully charged off before the run"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-K1", amortized_cost_cents: 10000000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-K2", amortized_cost_cents: 500000, risk_rating: SUBSTANDARD, collateral_value_cents: 460000 }
              as: CreditAnalyst
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-K3", amortized_cost_cents: 80000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { loan_3: $.data.id }
            - call: "POST /cecl/loans/${loan_3}/charge_off"
              payload: { charge_off_amount_cents: 80000, charge_off_period: "2026-Q1" }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              captures: { exp: $.data.total_exposure_cents, iec: $.data.individual_evaluation_count }
          assert:
            - "segments_breakdown[0].exposure_cents == 10000000 (SUBSTANDARD loan and CHARGED_OFF loan excluded)"
            - "quantitative_reserve_cents == 50000 (50 bps on 10000000)"
            - "individual_evaluation_count == 1 (${iec}); individual reserve 86000"
            - "total_exposure_cents == 10500000 (${exp}: 10000000 collective + 500000 individually evaluated)"
            - "PortfolioSegment status remains OPEN (rate round(80000*10000/10580000) = 76 bps <= 200)"

      - name: qualitative_window_filtering
        claim_type: input_set_filtering
        grounds: [calculations.qualitative_adjustment]
        distinguishing_aspect: "Only APPROVED factors whose closed window covers the run's as_of_period enter the qualitative sum: run 2026-Q1 gets +25 bps (25000 cents), run 2026-Q2 gets 0."
        test_recipe:
          setup:
            - "ACTIVE model; PRIME segment with PASS loan 10000000; BASELINE scenario; factor +25 bps APPROVED with closed window 2026-Q1..2026-Q1"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-Q1", amortized_cost_cents: 10000000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
