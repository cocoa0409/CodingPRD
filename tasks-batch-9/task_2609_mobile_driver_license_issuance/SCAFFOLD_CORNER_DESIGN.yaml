        distinguishing_aspect: "A PATCH carrying only physical_credential_expires_on rewrites that field, leaves physical_credential_status VALID and restriction_codes [] untouched, opens no UpdateOrder (restriction_codes was absent) and bumps Holder.version to 2; an implementation that nulls the omitted optionals fails."
