    instances:
      - name: slot_window_expired_rejected_half_open
        grounds:
          - validations[priority=8]
          - entities.PickupSlot.fields.window_end_utc
        distinguishing_aspect: >-
          Half-open interval semantics on PickupSlot: at clock_now == window_end_utc the window is
          already closed (end is exclusive), so placement is rejected with ERR_SLOT_UNAVAILABLE.
        test_recipe:
          setup:
            - "A COUNTER slot ending 2026-03-05T00:00:00Z; logical clock advanced to exactly that instant; a CART order with a line on that slot."
          setup_api_calls:
