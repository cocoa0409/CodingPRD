            - "Inspector 'Cy Verify' with decon_endorsement false, one passed 24-hour record and one FAILED 20-hour record: credited hours 24.00, certification_level LEVEL_1, status ACTIVE, certification_expires_at 2027-08-01T00:00:00Z, contributing nothing to certified_inspector_count."
