    output: Member[]
    side_effects: []

  # ---- Memberships ----
  - method: POST
    path: "/studio/memberships"
    description: "Create a PENDING membership (wax-pass) for a member."
    roles: [StudioAdmin, FrontDesk]
    code: 201
    input: [member_id, tier, monthly_credit_grant, monthly_fee_cents, "max_rollover_credits?"]
    output: Membership
    side_effects: ["status=PENDING, cycle_index=0, credit_balance=0"]

  - method: GET
    path: "/studio/memberships/{id}"
    description: "Get a membership (computed credit_balance)."
    roles: [StudioAdmin, FrontDesk, Member]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/studio/memberships"
