          A different metric (percentage margin, 2-decimal round_half_up) reached through a different
          endpoint (POST /performance-demos/{demo_id}/certify): a MAX_DAY turbidity reading of 0.285
          against a 0.300 limit gives min_margin_pct exactly 5.00, and because the gate is
