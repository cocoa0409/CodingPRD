  - section: cross-cutting complexity layers
    instances:
      - name: a_successful_assessment_stales_the_token_that_created_it
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[credit-assessment-create-stale-application]
          - errors[ERR_STALE_APPLICATION_VERSION]
        distinguishing_aspect: "The OCC token is invalidated by the writer's own success, not only by a foreign writer: creating the first assessment with the version read at advance-to-underwriting works and re-pins the application, replaying that same token is 412 ERR_STALE_APPLICATION_VERSION, and re-reading the application yields a token that legitimately supersedes the first assessment with the other method - so the guard is a version comparison, not a once-per-application rule."
        test_recipe:
          setup:
            - "application advanced to UNDERWRITING at clock 2026-08-01 with credit_score 610, prior history 24 months, avg_delivery_lag_days 21, declared ratio 320 bps and requested volume 30000000; the version returned by advance-to-underwriting is captured"
