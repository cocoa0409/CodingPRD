              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "NORMAL", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "trench", is_white_lined: true }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tid: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /locate-tickets/${tid}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { v1: $.data.version }
          assert:
            - "at create: LocateTicket.${tid}.version == 1"
            - "after submit: LocateTicket.${tid}.version == 2"

