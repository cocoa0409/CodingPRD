    roles: [RegulatorAuditor]
    code: 201
    input: [jurisdiction, election_cycle, period_label, period_start, period_end, filing_deadline]
    output: ReportingPeriod
    side_effects: ["ReportingPeriod created OPEN"]
  - method: GET
    path: "/disclosure/reporting-periods/{id}"
