# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Ocean Container Detention & Demurrage Billing Dispute
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2 instances per rule.
# Fixture calendar: logical clock default 2026-09-01T00:00:00Z (Tuesday);
# terminal OAK timezone Pacific/Honolulu; holiday 2026-09-07 (Labor Day, Mon).
# Working day = not Sunday, not holiday, Saturday only when contract flag set.
# All fixture timestamps use 12:00:00Z so the Honolulu calendar date equals
# the UTC date (12:00 UTC = 02:00 HST same day).
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: demurrage_provisional_vs_final_accrual_divergence
        grounds:
          - calculations.demurrage_accrual
          - state_machines.Container.AVAILABLE_to_GATE_OUT
          - entities.Container.fields.demurrage_amount_cents
        distinguishing_aspect: |
          Same container, same pinned contract: the provisional variant (as-of
          logical clock, status AVAILABLE) yields 30000 cents while the final
          variant (gate-out on a later logical date) yields 135000 cents —
          a divergence driven purely by accrual-end selection on the Container
          entity domain.
        test_recipe:
          setup:
            - "Account ACCT-A ACTIVE with contract CTR-A (ACTIVE, demurrage_free_days=2, detention_free_days=5, saturday_counts_as_free_day=false, both schedules STANDARD)"
            - "Terminal OAK exists with holiday 2026-09-07 and one return location LOC-1 (OPEN, accepts DRY40)"
            - "Container CNTR-A: available_ts 2026-09-08T12:00:00Z, status AVAILABLE (free days = 09-09, 09-10)"
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-A", legal_name: "Alpha Importers" }
              as: ContractManager
              captures: { acct_a: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_a}/service-contracts"
              payload: { contract_ref: "CTR-A", demurrage_free_days: 2, detention_free_days: 5, saturday_counts_as_free_day: false, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ctr_a: $.data.id }
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ContractManager
            - call: "POST /ocean-billing/service-contracts/${ctr_a}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "LGB", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5, gate_closed_weekends: true }
              as: TerminalOperator
              captures: { term_lgb: $.data.id }
            - call: "POST /ocean-billing/terminals/${term_lgb}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-L1", terminal_id: "${term_lgb}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
              captures: { loc_1: $.data.id }
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000011", equipment_type: "DRY40", customer_account_id: "${acct_a}", service_contract_id: "${ctr_a}", terminal_id: "${term_lgb}", discharge_ts: "2026-09-07T12:00:00Z", available_ts: "2026-09-08T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_a: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_a}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T12:00:00Z" }
              as: TerminalOperator
            - call: "GET /ocean-billing/containers/${cntr_a}"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-18T12:00:00Z" }
              as: TerminalOperator
          trigger:
            - call: "POST /ocean-billing/containers/${cntr_a}/gate-out"
              payload: { slot_override: true, slot_override_reason: "terminal closed early 09-18" }
              as: TerminalOperator
          assert:
            - "The provisional GET at logical clock 2026-09-14 returned demurrage_amount_cents == 30000 (2 billable days: 09-11, 09-14 @15000) and demurrage_billable_days == 2"
            - "Container.${cntr_a}.demurrage_amount_cents == 135000 after gate-out (6 billable days: 09-11,09-14,09-15,09-16,09-17,09-18 — 3@15000 + 3@30000)"
            - "Container.${cntr_a}.demurrage_billable_days == 6"
            - "provisional 30000 != final 135000"
            - "Container.${cntr_a}.status == GATE_OUT"
            - "Container.${cntr_a}.assigned_return_location_id == ${loc_1}"

      - name: aging_bucket_threshold_variant_vs_accrual_variant_domains
        grounds:
          - calculations.aging_bucket
          - calculations.aging_posture
          - entities.Invoice.fields.aging_bucket
          - state_machines.CustomerAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          On the Invoice/CustomerAccount domain (not the Container charge
          domain of the sibling instance): identical unpaid balance yields a
          bucket that flips at exact day-count boundaries (30 vs 31 vs 60 vs
          61), and 7 consecutive sweeps at DAYS_61_PLUS flip the account to
          SUSPENDED — a threshold computation with different inputs and
          outputs than any accrual.
        test_recipe:
          setup:
            - "Invoice INV-B for ACCT-B with gross 15000 cents issued at logical clock 2026-09-30 (due_at = 2026-10-30), balance_due_cents == 15000, no payments"
            - "Container flow completed: demurrage-only charge 15000 (1 billable day, hold-overlay scenario G), detention 0 (returned within free time), invoice issued"
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-B", legal_name: "Beta Traders" }
              as: ContractManager
              captures: { acct_b: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_b}/service-contracts"
              payload: { contract_ref: "CTR-B", demurrage_free_days: 2, detention_free_days: 5, saturday_counts_as_free_day: false, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-06-30T00:00:00Z" }
              as: ContractManager
              captures: { ctr_b: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${ctr_b}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "HON", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5, gate_closed_weekends: true }
              as: TerminalOperator
              captures: { term_hon: $.data.id }
            - call: "POST /ocean-billing/terminals/${term_hon}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-H1", terminal_id: "${term_hon}", accepts_equipment_types: ["DRY20"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000029", equipment_type: "DRY20", customer_account_id: "${acct_b}", service_contract_id: "${ctr_b}", terminal_id: "${term_hon}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_b: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_b}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_b}/holds"
              payload: { hold_code: "CUSTOMS_HOLD", action: "PLACE" }
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_b}/holds"
              payload: { hold_code: "CUSTOMS_HOLD", action: "RELEASE" }
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_b}/holds"
              payload: { hold_code: "CUSTOMS_HOLD", action: "PLACE" }
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_b}/holds"
              payload: { hold_code: "CUSTOMS_HOLD", action: "RELEASE" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_b}/gate-out"
              payload: { slot_override: true, slot_override_reason: "customs released, expedited" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_b}/return-empty"
              payload: {}
              as: EquipmentController
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T12:00:00Z" }
              as: BillingAgent
            - call: "POST /ocean-billing/containers/${cntr_b}/issue-invoice"
              payload: {}
              as: BillingAgent
              captures: { inv_b: $.data.id }
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T12:00:00Z" }
              as: BillingAgent
          trigger:
            - call: "GET /ocean-billing/invoices/${inv_b}"
              payload: {}
              as: BillingAgent
              captures: { bucket_at_due: $.data.aging_bucket }
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-29T12:00:00Z" }
              as: BillingAgent
            - call: "GET /ocean-billing/invoices/${inv_b}"
              payload: {}
              as: BillingAgent
              captures: { bucket_30: $.data.aging_bucket }
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T12:00:00Z" }
              as: BillingAgent
            - call: "GET /ocean-billing/invoices/${inv_b}"
              payload: {}
              as: BillingAgent
              captures: { bucket_31: $.data.aging_bucket }
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-29T12:00:00Z" }
              as: BillingAgent
            - call: "GET /ocean-billing/invoices/${inv_b}"
              payload: {}
              as: BillingAgent
              captures: { bucket_60: $.data.aging_bucket }
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-30T12:00:00Z" }
              as: BillingAgent
            - call: "GET /ocean-billing/invoices/${inv_b}"
              payload: {}
              as: BillingAgent
              captures: { bucket_61: $.data.aging_bucket }
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T12:00:00Z" }
              as: BillingAgent
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T12:00:00Z" }
              as: BillingAgent
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T12:00:00Z" }
              as: BillingAgent
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-03T12:00:00Z" }
              as: BillingAgent
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-04T12:00:00Z" }
              as: BillingAgent
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T12:00:00Z" }
              as: BillingAgent
            - call: "GET /ocean-billing/customer-accounts/${acct_b}"
              payload: {}
              as: BillingAgent
              captures: { acct_b_status: $.data.status, acct_b_hold: $.data.credit_hold }
          assert:
            - "bucket_at_due == CURRENT (days_past_due == 0)"
            - "bucket_30 == DAYS_1_30 (days_past_due == 30 — upper bound inclusive)"
            - "bucket_31 == DAYS_31_60 (days_past_due == 31)"
            - "bucket_60 == DAYS_31_60 (days_past_due == 60 — upper bound inclusive)"
            - "bucket_61 == DAYS_61_PLUS (days_past_due == 61)"
            - "acct_b_status == SUSPENDED after 7 consecutive DAYS_61_PLUS sweeps (2026-12-30 through 2027-01-05; CREDIT_HOLD_GRACE_DAYS=7)"
            - "acct_b_hold == true"

  - rule_id: combinatorial_formula
    instances:
      - name: demurrage_tier_straddle_marginal_allocation
        grounds:
          - calculations.demurrage_accrual
          - calculations.working_day_sequence
          - entities.ServiceContract.fields.demurrage_rate_schedule
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — (working-day sequence) x
          (free-day count) x (tier table) with MARGINAL day-index mapping, so
          the 4th billable day prices at the tier-2 rate while days 1-3 stay
          at tier-1; two containers on the SAME dates but different schedules
          (STANDARD vs EXTENDED_TIERED) straddle different boundaries and
          yield 105000 vs 84000 for nearly identical exposure.
        test_recipe:
          setup:
            - "ACCT-C ACTIVE; two ACTIVE contracts: CTR-STD (STANDARD demurrage schedule, free=4, sat=false) and CTR-EXT (EXTENDED_TIERED, free=3, sat=true)"
            - "Terminal OAK with Labor Day 2026-09-07; return location LOC-1 accepting DRY40"
            - "CNTR-STD on CTR-STD: available 2026-09-01, gate-out 2026-09-15"
            - "CNTR-EXT on CTR-EXT: available 2026-09-04, gate-out 2026-09-16"
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-C", legal_name: "Gamma Logistics" }
              as: ContractManager
              captures: { acct_c: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_c}/service-contracts"
              payload: { contract_ref: "CTR-STD", demurrage_free_days: 4, detention_free_days: 5, saturday_counts_as_free_day: false, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ctr_std: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_c}/service-contracts"
              payload: { contract_ref: "CTR-EXT", demurrage_free_days: 3, detention_free_days: 2, saturday_counts_as_free_day: true, demurrage_rate_schedule: "EXTENDED_TIERED", detention_rate_schedule: "EXTENDED_TIERED", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ctr_ext: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${ctr_std}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/service-contracts/${ctr_ext}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5, gate_closed_weekends: true }
              as: TerminalOperator
              captures: { term_oak: $.data.id }
            - call: "POST /ocean-billing/terminals/${term_oak}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000037", equipment_type: "DRY40", customer_account_id: "${acct_c}", service_contract_id: "${ctr_std}", terminal_id: "${term_oak}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_std: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_std}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000045", equipment_type: "DRY40", customer_account_id: "${acct_c}", service_contract_id: "${ctr_ext}", terminal_id: "${term_oak}", discharge_ts: "2026-09-03T12:00:00Z", available_ts: "2026-09-04T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_ext: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_ext}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_std}/gate-out"
              payload: { slot_override: true, slot_override_reason: "vessel bunching" }
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T12:00:00Z" }
              as: TerminalOperator
          trigger:
            - call: "POST /ocean-billing/containers/${cntr_ext}/gate-out"
              payload: { slot_override: true, slot_override_reason: "vessel bunching" }
              as: TerminalOperator
          assert:
            - "Container.${cntr_std}.demurrage_billable_days == 5 (09-09,09-10,09-11,09-14,09-15; Sat/Sun skipped, 09-07 holiday inside free window)"
            - "Container.${cntr_std}.demurrage_amount_cents == 105000 (3@15000 + 2@30000 marginal straddle of the day-3/day-4 boundary)"
            - "Container.${cntr_ext}.demurrage_billable_days == 6 (09-10,09-11,09-12,09-14,09-15,09-16; Saturdays count under CTR-EXT)"
            - "Container.${cntr_ext}.demurrage_amount_cents == 84000 (5@12000 + 1@24000 marginal straddle of the day-5/day-6 boundary)"
            - "105000 != 84000 — schedule selection changes tier boundaries"

      - name: credit_waterfall_evaluation_order_and_component_offset
        grounds:
          - calculations.credit_waterfall
          - calculations.waiver_authority_tier
          - entities.Invoice.fields.balance_due_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned by evaluation order —
          balance_due_cents depends on credit_total_cents, while each credit's
          component split depends on the detention-first waterfall and on
          credits already applied. A 60000-cent TIER_2 credit against an
          invoice with detention 54000 + demurrage 105000 offsets detention
          fully then demurrage partially (6000); a subsequent 100000-cent
          credit approval is rejected because the creditable remainder is
          99000 — approval-time evaluation, not proposal-time.
        test_recipe:
          setup:
            - "ACCT-D ACTIVE; CTR-D ACTIVE (STANDARD both schedules, dem free=4, det free=5, sat=false)"
            - "CNTR-D1: demurrage 105000 frozen (avail 09-01, gate-out 09-15); detention 54000 frozen (gate-out 09-15, free days 09-16,17,18,21,22, return 09-29 with no holds -> billable 09-23,24,25,28,29 = 5 days -> 4@9000 + 1@18000)"
            - "INV-D issued with demurrage_total_cents=105000, detention_total_cents=54000, gross=159000, balance 159000"
            - "WV-D1 proposed by CreditSupervisor sup-1 (60000, TIER_2, PROPOSED)"
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-D", legal_name: "Delta Freight" }
              as: ContractManager
              captures: { acct_d: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_d}/service-contracts"
              payload: { contract_ref: "CTR-D", demurrage_free_days: 4, detention_free_days: 5, saturday_counts_as_free_day: false, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ctr_d: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${ctr_d}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5, gate_closed_weekends: true }
              as: TerminalOperator
              captures: { term_oak: $.data.id }
            - call: "POST /ocean-billing/terminals/${term_oak}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000052", equipment_type: "DRY40", customer_account_id: "${acct_d}", service_contract_id: "${ctr_d}", terminal_id: "${term_oak}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_d1: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_d1}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_d1}/gate-out"
              payload: { slot_override: true, slot_override_reason: "gate congestion" }
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_d1}/return-empty"
              payload: {}
              as: EquipmentController
            - call: "POST /ocean-billing/containers/${cntr_d1}/issue-invoice"
              payload: {}
              as: BillingAgent
              captures: { inv_d: $.data.id }
            - call: "POST /ocean-billing/invoices/${inv_d}/credit-waivers"
              payload: { amount_cents: 60000, justification: "goodwill for gate congestion delay" }
              as: CreditSupervisor
              as_user_id: "sup-1"
              captures: { wv_d1: $.data.id, wv_d1_tier: $.data.authority_tier, wv_d1_status: $.data.status, wv_d1_v: $.data.version }
            - call: "POST /ocean-billing/invoices/${inv_d}/credit-waivers"
              payload: { amount_cents: 100000, justification: "second goodwill, oversized" }
