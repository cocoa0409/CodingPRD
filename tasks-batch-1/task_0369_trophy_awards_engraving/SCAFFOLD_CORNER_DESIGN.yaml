# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0369_trophy_awards_engraving — breadth probe over §1.1-§1.7.
# All formula-derived asserts are precomputed literals.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_order_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Order
          - endpoints
        distinguishing_aspect: "POST /orders with customer_id+service_level+due_date -> 201; production_status=DRAFT, payment_status=UNPAID, version=1, line_count=0."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e1@x.com", full_name: "E One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oid: $.data.id }
          assert:
            - "response code == 201"
            - "Order.${oid}.production_status == DRAFT"
            - "Order.${oid}.payment_status == UNPAID"
            - "Order.${oid}.version == 1"
            - "Order.${oid}.line_count == 0"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Order
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /orders/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No order with the queried id."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e2@x.com", full_name: "E Two" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND (404)"

      - name: create_order_missing_due_date_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Order.fields.due_date
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /orders without required due_date -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e3@x.com", full_name: "E Three" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST (400)"

      - name: create_order_bad_service_level_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Order.fields.service_level
          - "validations[priority=4]"
        distinguishing_aspect: "POST /orders with service_level='OVERNIGHT' (not in enum) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e4@x.com", full_name: "E Four" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "OVERNIGHT", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST (400)"

      - name: create_line_default_quantity_engraving_text_empty
        claim_type: Defaults
        grounds:
          - entities.OrderLine.fields.engraving_text
          - entities.OrderLine.fields.include_logo
        distinguishing_aspect: "POST /orders/{id}/lines omitting engraving_text/include_logo -> engraving_text='' , include_logo=false, char_count=0."
        test_recipe:
          setup: ["A DRAFT order and active product."]
          setup_api_calls:
            - call: "POST /components"
              payload: { code: "EC-5", name: "Base", on_hand_qty: 10 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "EP-5", name: "Plaque", product_type: "PLAQUE", base_price_cents: 4000, engraving_price_per_char_cents: 50, logo_setup_fee_cents: 2000, standard_lead_days: 5, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e5@x.com", full_name: "E Five" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lid: $.data.id }
          assert:
            - "OrderLine.${lid}.engraving_text == ''"
            - "OrderLine.${lid}.include_logo == false"
            - "OrderLine.${lid}.line_status == PENDING"

      - name: order_id_and_version_system_generated_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Order.fields.production_status
          - entities.Order.fields.version
        distinguishing_aspect: "POST /orders never lets the client set production_status/version; server stamps DRAFT/1 (input-ignored extra keys rejected as ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e6@x.com", full_name: "E Six" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z", production_status: "READY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST (400)"

      - name: payment_entity_has_no_version_field_immutable
        claim_type: Immutability
        grounds:
          - entities.Payment
        distinguishing_aspect: "Payment uses common_fields:false -> it carries id+created_at only, no version; no PUT/PATCH endpoint exists for payments."
        test_recipe:
          setup: ["A CONFIRMED order with a captured deposit Payment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /components"
              payload: { code: "EC-7", name: "Base", on_hand_qty: 10 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "EP-7", name: "Plaque", product_type: "PLAQUE", base_price_cents: 10000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e7@x.com", full_name: "E Seven" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lid: $.data.id }
            - call: "POST /order-lines/${lid}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "X" }
              as: ShopStaff
              captures: { pid: $.data.id }
            - call: "POST /order-lines/${lid}/proofs/${pid}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${lid}/proofs/${pid}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${oid}/price"
              payload: {}
              as: ShopStaff
              captures: { ov: $.data.version }
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${oid}/payments"
              payload: { amount_cents: 5000, kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /orders/${oid}/payments"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "GET payments returns array length 1"
            - "payment[0].pay_status == CAPTURED"
            - "payment[0] has no version field"

      - name: duplicate_customer_email_returns_duplicate_value
        claim_type: Type Constraints
        grounds:
          - entities.Customer.fields.email
          - "errors[ERR_DUPLICATE_VALUE]"
        distinguishing_aspect: "Registering a second customer with an existing email -> ERR_DUPLICATE_VALUE (409)."
        test_recipe:
          setup: ["A customer with email dup@x.com already exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "First" }
              as: Anonymous
          trigger:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "Second" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DUPLICATE_VALUE (409)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Order.PRICED_to_CONFIRMED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /orders/{id}/confirm on a DRAFT (never priced) order -> ERR_INVALID_STATE (409); no allocations created."
        test_recipe:
          setup: ["A DRAFT order with one line, never priced."]
          setup_api_calls:
            - call: "POST /components"
              payload: { code: "EC-9", name: "Base", on_hand_qty: 10 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "EP-9", name: "Plaque", product_type: "PLAQUE", base_price_cents: 4000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e9@x.com", full_name: "E Nine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${oid}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (409)"
            - "Order.${oid}.production_status == DRAFT"

      - name: cancel_fulfilled_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order.DRAFT_to_CANCELLED
          - state_machines.Order.READY_to_FULFILLED
        distinguishing_aspect: "POST /orders/{id}/cancel on a FULFILLED (terminal) order -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A fully FULFILLED order (PICKUP handed off)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /components"
              payload: { code: "EC-10", name: "Base", on_hand_qty: 10 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "EP-10", name: "Plaque", product_type: "PLAQUE", base_price_cents: 10000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e10@x.com", full_name: "E Ten" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lid: $.data.id }
            - call: "POST /order-lines/${lid}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "X" }
              as: ShopStaff
              captures: { pid: $.data.id }
            - call: "POST /order-lines/${lid}/proofs/${pid}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${lid}/proofs/${pid}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${oid}/price"
              payload: {}
              as: ShopStaff
              captures: { ov: $.data.version }
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${oid}/payments"
              payload: { amount_cents: 10000, kind: "FULL" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${oid}/start-production"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${lid}/engrave"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${lid}/assemble"
              payload: {}
              as: ShopStaff
            - call: "POST /orders/${oid}/fulfillments"
              payload: { method: "PICKUP" }
              as: ShopStaff
              captures: { fid: $.data.id }
            - call: "POST /orders/${oid}/fulfillments/${fid}/hand-off"
              payload: {}
              as: ShopStaff
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (409)"
            - "Order.${oid}.production_status == FULFILLED"
            - "Order.${oid}.due_date_met == true"

      - name: approve_proof_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Proof.SENT_to_APPROVED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST .../proofs/{id}/approve while proof is DRAFT (not SENT) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A line with a DRAFT (un-sent) proof."]
          setup_api_calls:
            - call: "POST /components"
              payload: { code: "EC-11", name: "Base", on_hand_qty: 10 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "EP-11", name: "Plaque", product_type: "PLAQUE", base_price_cents: 4000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e11@x.com", full_name: "E Eleven" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lid: $.data.id }
            - call: "POST /order-lines/${lid}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "X" }
              as: ShopStaff
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /order-lines/${lid}/proofs/${pid}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (409)"
            - "Proof.${pid}.proof_status == DRAFT"

      - name: new_order_initial_state_is_draft_unpaid
        claim_type: Initial State
        grounds:
          - state_machines.Order.production_status
          - state_machines.Order.payment_status
        distinguishing_aspect: "A freshly created order has production_status=DRAFT and payment_status=UNPAID."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e12@x.com", full_name: "E Twelve" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oid: $.data.id }
          assert:
            - "Order.${oid}.production_status == DRAFT"
            - "Order.${oid}.payment_status == UNPAID"

      - name: rush_policy_create_active_deactivates_prior
        claim_type: Side Effect Execution
        grounds:
          - endpoints
          - entities.RushPolicy.fields.active
        distinguishing_aspect: "Creating a second RushPolicy with active=true sets the first policy's active=false (single active invariant)."
        test_recipe:
          setup: ["One active RushPolicy P1."]
          setup_api_calls:
            - call: "POST /rush-policies"
              payload: { name: "P1", expedited_surcharge_pct: 0.20, rush_surcharge_pct: 0.40, rush_min_business_days: 1, active: true }
              as: ShopManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /rush-policies"
              payload: { name: "P2", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
              captures: { p2: $.data.id }
          assert:
            - "RushPolicy.${p1}.active == false"
            - "RushPolicy.${p2}.active == true"

      - name: revise_proof_from_sent_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Proof.CHANGES_REQUESTED_to_DRAFT
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST .../revise while proof is SENT (not CHANGES_REQUESTED) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A line with a SENT proof."]
          setup_api_calls:
            - call: "POST /components"
              payload: { code: "EC-13", name: "Base", on_hand_qty: 10 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "EP-13", name: "Plaque", product_type: "PLAQUE", base_price_cents: 4000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e13@x.com", full_name: "E Thirteen" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lid: $.data.id }
            - call: "POST /order-lines/${lid}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "X" }
              as: ShopStaff
              captures: { pid: $.data.id }
            - call: "POST /order-lines/${lid}/proofs/${pid}/send"
              payload: {}
              as: ShopStaff
          trigger:
            - call: "POST /order-lines/${lid}/proofs/${pid}/revise"
              payload: {}
              as: ShopStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (409)"
            - "Proof.${pid}.proof_status == SENT"

      - name: ship_fulfillment_branch_computes_fee
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Fulfillment.STAGED_to_HANDED_OFF
          - calculations.ship_fee
        distinguishing_aspect: "Staging a SHIP fulfillment with ship_weight_grams=2000 sets ship_fee_cents=1500 (BASE 1200 + 1*PER_KG 300); PICKUP would be 0."
        test_recipe:
          setup: ["A READY order paid in full."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /components"
              payload: { code: "EC-14", name: "Base", on_hand_qty: 10 }
              as: ShopManager
