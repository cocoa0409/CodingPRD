              captures: { par_sa: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_sa}", display_name: "Kid SA", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_sa}"
              captures: { child_sa: $.data.id, child_sa_v: $.data.version }
            - call: "PATCH /api/children/${child_sa}"
              payload: { profile_status: "ARCHIVED", expected_child_version: "${child_sa_v}" }
