      - name: outage_windows_touching_allowed_but_interior_overlap_refused
        grounds:
          - validations[priority=21]
          - errors[ERR_OUTAGE_WINDOW_OVERLAP]
          - calculations.tool_monthly_uptime
          - entities.PriceComparisonTool.fields.outage_windows
        distinguishing_aspect: |
          Outage windows are HALF-OPEN: the window 03:00Z-04:12Z that begins exactly when the
          00:00Z-03:00Z window ends must be ACCEPTED, while a third window 04:00Z-05:00Z whose
          interior intersects the second must be refused with 409 ERR_OUTAGE_WINDOW_OVERLAP. The
          accepted pair then merges into one 252-minute span for the month, giving 99.42% uptime and
          no breach — an implementation that double-counts the touching endpoint minute, or rejects
          the touching window outright, gets both the count and the uptime wrong.
