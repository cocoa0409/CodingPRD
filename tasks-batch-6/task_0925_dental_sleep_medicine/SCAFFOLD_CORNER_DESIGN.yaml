        claim_type: Role denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Rung 1 precedes everything: a request with no X-User-Role header returns ERR_UNAUTHENTICATED
          with 401, not the 403 that a recognised but unauthorised role would receive.
        test_recipe:
          setup:
            - "One registered payer."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL" }
              as: PlatformAdmin
              captures: { payer_med_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-900", full_name: "No Auth", date_of_birth: "1980-01-01", medical_payer_id: "${payer_med_id}" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_UNAUTHENTICATED with HTTP 401"
            - "the request carries no X-User-Role and no X-User-ID header"
            - "no Patient row is created"

