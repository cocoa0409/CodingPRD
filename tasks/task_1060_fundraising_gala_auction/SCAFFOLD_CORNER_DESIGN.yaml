              as_user_id: "auc-1"
            - call: "POST /api/auction-items/${item_1}/bids"
              payload: { bidder_id: "${b_a}", amount_cents: 12500 }
              as: Bidder
              as_user_id: "${b_a}"
            - call: "POST /api/auction-items/${item_1}/close"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { inv_1: $.data.invoice_id }
            - call: "POST /api/invoices/${inv_1}/finalize"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "POST /api/payments"
              payload: { invoice_id: "${inv_1}", amount_cents: 12500, method: "CARD" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pay_1: $.data.id }
          trigger:
            - call: "POST /api/payments/${pay_1}/void"
              payload: { reason: "Mistaken capture." }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status == 403"
            - "PaymentTransaction.${pay_1}.status == CAPTURED"
            - "GalaEvent.${ev_id}.gross_collected_cents == 12500"

  - section: cross_cutting_layers
    instances:
      - name: stale_expected_event_version_on_run_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[recon-run-create-stale-event]
          - errors[ERR_STALE_EVENT_VERSION]
          - validations[priority=14]
        distinguishing_aspect: "The first run creation advances GalaEvent.version, so a second create still carrying the previously observed version returns ERR_STALE_EVENT_VERSION with HTTP 412 and creates no run."
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; one DRAFT event whose version has been read once."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { ev_ver_1: $.data.version }
            - call: "POST /api/events/${ev_id}/reconciliation-runs"
              payload: { expected_event_version: "${ev_ver_1}", revenue_basis: "BOOKED" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { run_1: $.data.id }
          trigger:
            - call: "POST /api/events/${ev_id}/reconciliation-runs"
              payload: { expected_event_version: "${ev_ver_1}", revenue_basis: "CASH_BASIS" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /api/events/${ev_id}/reconciliation-runs"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { only_run: "$.data[0].id" }
          assert:
            - "${err_id} == ERR_STALE_EVENT_VERSION"
            - "HTTP status == 412"
            - "${only_run} == ${run_1}"
            - "meta pagination total_count == 1"
            - "ReconciliationRun.${run_1}.status == PREPARED"

      - name: derived_field_reconciliation_on_bidder_balance
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Bidder.fields.outstanding_balance_cents
          - calculations.invoice_totals
        excluded_because:
          difficulty_instance: transitive_cascade / lot_close_cascades_through_invoice_totals_to_bidder_balance
          rationale: "Bidder.outstanding_balance_cents correctness after an invoice-total change is the terminal assertion of the named difficulty instance."
      - name: cascading_side_effects_on_invoice_payment
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CheckoutInvoice.PENDING_PAYMENT_to_PAID
          - entities.GalaEvent.fields.gross_collected_cents
        excluded_because:
          difficulty_instance: transitive_cascade / payment_capture_cascades_to_event_rollups
          rationale: "The full capture cascade is asserted end-to-end by the named difficulty instance."
      - name: rate_threshold_trigger_on_processing_fee_tiers
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.invoice_totals
          - global_constants.FEE_TIER_1_CEILING_CENTS
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_processing_fee_tier_pinned_to_prefee_subtotal
          rationale: "The tier-1 / tier-2 breakpoint behaviour at 49900 versus the grossed-up 51377 is asserted by the named difficulty instance."

  - section: consistency_model
    instances:
      - name: immediate_visibility_of_close_cascade_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.AuctionItem.OPEN_to_AWARDED
        excluded_because:
          difficulty_instance: transitive_cascade / lot_close_cascades_through_invoice_totals_to_bidder_balance
          rationale: "The close response already carries the freshly minted invoice_id and hammer price, which the named difficulty instance asserts directly off the trigger response."
