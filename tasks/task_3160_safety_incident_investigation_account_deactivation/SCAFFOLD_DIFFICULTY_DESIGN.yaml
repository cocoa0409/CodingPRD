            - call: "POST /safety/incidents/${inc1}/decision"
              payload: { decision_category: "RESTRICTED", decision_basis: "Two source types but a provisional evidence score, so the account is restricted rather than deactivated.", expected_incident_version: "${inc1_v_ready}" }
              as: SafetyInvestigator
              captures: { inc1_v_restricted: $.data.version }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
              captures: { inc2: $.data.id, inc2_v: $.data.version }
            - call: "POST /safety/incidents/${inc2}/hold"
              payload: {}
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc2}/evidence"
              payload: { evidence_type: "TRIP_DATA", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { e21: $.data.id }
            - call: "POST /safety/incidents/${inc2}/evidence"
              payload: { evidence_type: "EXTERNAL_RECORD", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { e22: $.data.id }
            - call: "POST /safety/incidents/${inc2}/evidence/accept"
              payload: { evidence_id: "${e21}", accepted: true }
