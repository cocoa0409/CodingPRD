scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_computed_sliding_fields
        claim_type: Creation
        grounds:
          - entities.Patient
          - calculations.sliding_fee_scale
        distinguishing_aspect: >-
          POST /patients with all required fields returns 201 and a body carrying server-computed
          fpl_percent and sliding_fee_multiplier alongside the input fields.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "New Pt", location_state_code: "CA", annual_household_income: 40000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Patient.${p_id}.fpl_percent == 265.60"
            - "Patient.${p_id}.sliding_fee_multiplier == 0.80"
            - "Patient.${p_id}.status == ACTIVE"

      - name: get_nonexistent_therapist_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Therapist
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /therapists/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /therapists/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_patient_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Patient.fields.household_size
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients omitting household_size returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "X", location_state_code: "CA", annual_household_income: 40000 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: crisis_assessment_score_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.CrisisAssessment.fields.ideation_score
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "ideation_score=4 (>3) on POST /crisis-assessments returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One therapist, one patient."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr Q" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt Q", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /crisis-assessments"
              payload: { patient_id: "${p_id}", therapist_id: "${t_id}", ideation_score: 4, plan_score: 0, means_access_score: 0, prior_attempts_score: 0 }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: state_license_default_telehealth_authorized_true
        claim_type: Defaults
        grounds:
          - entities.StateLicense.fields.telehealth_authorized
        distinguishing_aspect: "Omitting telehealth_authorized on POST /state-licenses defaults it to true."
        test_recipe:
          setup:
            - "One therapist."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr D" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LD", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
              captures: { l_id: $.data.id }
          assert:
            - "StateLicense.${l_id}.telehealth_authorized == true"
            - "StateLicense.${l_id}.status == ACTIVE"

      - name: system_fields_minted_on_therapist_create
        claim_type: System Fields
        grounds:
          - entities.Therapist
        distinguishing_aspect: "POST /therapists mints id, created_at, updated_at, version=1; client-sent version is ignored."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /therapists"
              payload: { full_name: "Dr Sys" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
          assert:
            - "Therapist.${t_id}.version == 1"
            - "Therapist.${t_id}.credential_status == ASSOCIATE"
            - "Therapist.${t_id}.requires_supervision == true"

      - name: list_patients_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Patient
          - endpoints
        distinguishing_aspect: "GET /patients returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup:
            - "Two patients exist."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pt 1", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
            - call: "POST /patients"
              payload: { full_name: "Pt 2", location_state_code: "NY", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
          trigger:
            - call: "GET /patients"
              payload: {}
              as: FrontDesk
          assert:
            - "response.response_type == array"
            - "response.meta has api_request_id and api_request_timestamp"
            - "response total_count == 2 and has_more == false"

  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_appointment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already-CANCELLED appointment returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup:
            - "A CANCELLED appointment."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr Cx" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt Cx", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-07-01T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${a_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: render_future_appointment_before_start_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appointment.SCHEDULED_to_RENDERED
        distinguishing_aspect: "Rendering an appointment whose start_at is still in the future (clock before start) is rejected ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Clock at 2026-07-01T06:00:00Z; a SCHEDULED CA appointment at 08:00 by a licensed therapist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T06:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr Fut" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LF", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /patients"
              payload: { full_name: "Pt Fut", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-07-01T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: newly_created_claim_starts_submitted
        claim_type: Initial State
        grounds:
          - state_machines.Claim
          - state_machines.Appointment.COMPLETED_to_CLAIMED
        distinguishing_aspect: "A Claim created from a COMPLETED insurance appointment starts in status SUBMITTED."
        test_recipe:
          setup:
            - "A COMPLETED insurance appointment by an INDEPENDENT CA therapist; OON copay policy."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr Init" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LI", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /payer-contracts"
              payload: { payer_name: "InitNet", in_network: false, contracted_rate_90791_cents: 0, contracted_rate_90834_cents: 0 }
              as: Biller
              captures: { c_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt Init", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_id}", contract_id: "${c_id}", cost_share_model: "COPAY", copay_cents: 2500, deductible_total_cents: 0 }
              as: FrontDesk
              captures: { pol_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-07-02T08:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_id: $.data.id }
            - call: "POST /clinical-notes/${n_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /claims"
              payload: { appointment_id: "${a_id}", expected_appointment_version: "${a_v}" }
              as: Biller
              captures: { cl_id: $.data.id }
          assert:
            - "Claim.${cl_id}.status == SUBMITTED"
            - "Claim.${cl_id}.billed_charge_cents == 15000"

      - name: void_terminal_claim_cannot_transition_again
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Claim.ADJUDICATED_to_VOID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A VOID claim is terminal; a subsequent adjudicate returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A claim that has been adjudicated then voided (OON copay)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr Vd" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LVd", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /payer-contracts"
              payload: { payer_name: "VdNet", in_network: false, contracted_rate_90791_cents: 0, contracted_rate_90834_cents: 0 }
              as: Biller
              captures: { c_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt Vd", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_id}", contract_id: "${c_id}", cost_share_model: "COPAY", copay_cents: 2500, deductible_total_cents: 0 }
              as: FrontDesk
              captures: { pol_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-07-03T08:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_id: $.data.id }
            - call: "POST /clinical-notes/${n_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a_v: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a_id}", expected_appointment_version: "${a_v}" }
              as: Biller
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /claims/${cl_id}/adjudicate"
              payload: { expected_claim_version: "${cl_v}" }
              as: Biller
              captures: { cl_v2: $.data.version }
            - call: "POST /claims/${cl_id}/void"
              payload: { expected_claim_version: "${cl_v2}" }
              as: Biller
              captures: { cl_v3: $.data.version }
          trigger:
            - call: "POST /claims/${cl_id}/adjudicate"
              payload: { expected_claim_version: "${cl_v3}" }
              as: Biller
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: suspend_therapist_cascades_cancel_scheduled_appointments
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Therapist.ASSOCIATE_to_SUSPENDED
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Suspending a therapist cascades their SCHEDULED appointments to CANCELLED (cascade-down side effect)."
        test_recipe:
          setup:
            - "An ASSOCIATE therapist with one SCHEDULED appointment."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr Susp" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /patients"
              payload: { full_name: "Pt Susp", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-07-04T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /therapists/${t_id}/suspend"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
          assert:
            - "Therapist.${t_id}.credential_status == SUSPENDED"
            - "Appointment.${a_id}.status == CANCELLED"

      - name: complete_appointment_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Appointment.RENDERED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling complete on an already-COMPLETED appointment returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A COMPLETED self-pay appointment by an INDEPENDENT CA therapist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr Idem" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LId", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /patients"
              payload: { full_name: "Pt Idem", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-07-05T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_id: $.data.id }
            - call: "POST /clinical-notes/${n_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /appointments/${a_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # =========================================================================
  - section: calculations
    instances:
      - name: self_pay_charge_stamped_at_render
        claim_type: Correct Result
        grounds:
          - calculations.self_pay_charge
          - entities.Appointment.fields.patient_charge_cents
        distinguishing_aspect: >-
          Rendering a SELF_PAY 90834 for a patient whose multiplier is 0.20 stamps
          patient_charge_cents = round(15000 * 0.20) = 3000.
        test_recipe:
          setup:
            - "A SCHEDULED self-pay 90834 by an INDEPENDENT CA therapist for a 0.20-multiplier patient."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr SP" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LSp", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /patients"
              payload: { full_name: "Pt SP", location_state_code: "CA", annual_household_income: 30000, household_size: 2 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-07-06T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
          assert:
            - "Patient.${p_id}.sliding_fee_multiplier == 0.20"
            - "Appointment.${a_id}.patient_charge_cents == 3000"

      - name: in_network_copay_deductible_met_split
        claim_type: Constants Applied
        grounds:
