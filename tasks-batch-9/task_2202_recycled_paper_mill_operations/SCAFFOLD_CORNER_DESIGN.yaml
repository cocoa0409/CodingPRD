              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Delta Fiber Recovery", freight_per_ton: 12.50 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "OCC_11", contracted_tons: 400.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
