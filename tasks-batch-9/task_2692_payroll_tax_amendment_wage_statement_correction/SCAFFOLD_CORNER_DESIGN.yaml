      - name: close_with_an_unsettled_repayment_returns_repayment_not_settled
        claim_type: Error triggerability
        grounds:
          - validations.priority_54
          - errors.ERR_REPAYMENT_NOT_SETTLED
          - state_machines.CorrectionCase.status.REMEDIATION_PENDING_to_CLOSED
        distinguishing_aspect: "Closure has two independent settlement gates and the remediation one is satisfied here, so only the repayment gate can fire: a PROPOSED arrangement is neither collected nor written off, and cancelling it — not collecting it — is enough to let the case close."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "The 2025 Q1 federal fixture with all three discrepancies categorised."
            - "A same-year wage repayment proposed while the case is still OPEN and left in PROPOSED."
            - "The amendment is prepared by one user, signed by another, submitted and ACCEPTED, which drives the case to REMEDIATION_PENDING and auto-creates one ControlRemediation."
            - "That remediation is assigned an owner, submitted for verification and verified by a different user, so every remediation on the case is VERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
