            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 50, line_code: "SCL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /drops", payload: { season: "FALL_2026", title: "Future", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", listings: [{ sku_id: "${s1}", drop_price_cents: 1100, is_exclusive: true }] }, as: MerchOps, captures: { d1: "$.data.id" } }
            - { call: "POST /customers", payload: { email: "sc@x.com", full_name: "Sc" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_DROP_NOT_LIVE"

      - name: add_line_batch_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_BATCH_NOT_FOUND]"]
        distinguishing_aspect: "Adding a line whose batch_id does not exist returns ERR_BATCH_NOT_FOUND (404)."
        test_recipe:
          setup: ["A customer with a PENDING order and a real sku, but a bogus batch_id."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Bnf", scent_family: "CITRUS", title: "Bnf" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Bnf", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /customers", payload: { email: "bnf@x.com", full_name: "Bnf" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "00000000-0000-4000-8000-0000000000ff", quantity: 1 }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 404"
            - "error_id == ERR_BATCH_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: customer_cannot_create_product
        claim_type: unauthorized_role
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Customer calling POST /products (a MerchOps/PlatformAdmin exclusive) is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A registered customer."]
