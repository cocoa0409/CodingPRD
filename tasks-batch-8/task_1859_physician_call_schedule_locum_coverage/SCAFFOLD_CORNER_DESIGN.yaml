      - name: regenerate_with_served_assignment_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REGENERATE_HAS_PROGRESS]"
        distinguishing_aspect: "Regenerate is blocked once real work happened: an assignment SERVED while the program was still GENERATED forces ERR_REGENERATE_HAS_PROGRESS even with the correct OCC version."
        test_recipe:
          setup: ["program GENERATED with one auto-assignment to P1; the assignment was then marked SERVED (clock past window end); program still GENERATED (never published)"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
