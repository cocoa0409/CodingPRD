          - entities.ApplicantOrganization.fields.upheld_complaint_count
          - calculations.organization_risk_score
        distinguishing_aspect: |
          The three-step complaint chain must execute in order and its uphold cascade must land on
          the organization: status RECEIVED -> UNDER_REVIEW -> UPHELD, resolved_on 2026-08-10,
          upheld_complaint_count 1 and risk_score 2 (WEIGHT_UPHELD_COMPLAINT 2 under AT_DECISION),
          while the organization's own status stays APPLIED.
