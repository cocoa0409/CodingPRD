    claim_type: Not Found
    grounds:
    - entities.Counterparty
    - errors[ERR_COUNTERPARTY_NOT_FOUND]
    - validations[priority=4]
    - endpoints.GET_/counterparties/{id}
    distinguishing_aspect: A syntactically valid but unallocated id on the counterparty path produces the entity-specific
      404 ERR_COUNTERPARTY_NOT_FOUND rather than a generic not-found or a 400.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. No counterparty has been created.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /counterparties/00000000-0000-4000-8000-000000000000
        payload: {}
        as: PaymentApprover
        captures:
          c4_err: $.data.error_id
      assert:
      - the response is 404 and error_id == ERR_COUNTERPARTY_NOT_FOUND
      - response_type is error and data carries both error_id and message
      - the same 404 is returned for an id that is not even UUID-shaped, rather than a 400
