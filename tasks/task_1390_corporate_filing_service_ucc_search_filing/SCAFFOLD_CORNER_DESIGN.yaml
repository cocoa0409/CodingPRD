# =============================================================================
# Task 1390 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: create_client_returns_defaults
        claim_type: creation
        grounds: ["entities.ClientAccount"]
        distinguishing_aspect: "POST /client-accounts returns 201 with server-set status ACTIVE, zeroed fee ledgers, version 1."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id, st: $.data.status, chg: $.data.fees_charged_total_cents, ref: $.data.fees_refunded_total_cents, v: $.data.version } }
          assert:
            - "response status 201; ClientAccount.status == ACTIVE"
            - "fees_charged_total_cents == 0 and fees_refunded_total_cents == 0"
            - "version == 1 and id is a server-minted UUID"

      - name: create_request_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.FilingRequest", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required client_id from POST /filing-requests fails schema validation with ERR_INVALID_REQUEST (400) before any business logic."
        test_recipe:
          setup: ["CA profile, client, debtor, secured party exist"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
          trigger:
            - { call: "POST /filing-requests", payload: { kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: create_request_with_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.FilingRequest.fields.collateral_class", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "collateral_class 'LEASEHOLD' is not a declared enum member and must be rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["CA profile, client, debtor, secured party exist"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
          trigger:
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "LEASEHOLD", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: create_client_system_input_ignored
        claim_type: system_fields
        grounds: ["entities.ClientAccount"]
        distinguishing_aspect: "Client-supplied id and created_at in the create body are ignored: the server mints its own UUID and stamps created_at from the logical clock (2026-08-01T00:00:00Z)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /client-accounts", payload: { name: "Spoof Inc", id: "11111111-1111-1111-1111-111111111111", created_at: "2020-01-01T00:00:00Z" }, as: PlatformAdmin, captures: { cid: $.data.id, cat: $.data.created_at } }
          assert:
            - "ClientAccount.id != 11111111-1111-1111-1111-111111111111"
            - "ClientAccount.created_at == 2026-08-01T00:00:00Z (logical clock, not client input)"

      - name: filing_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_FILING_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent filing UUID yields ERR_FILING_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /filings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FILING_NOT_FOUND and http status 404"

      - name: pagination_limit_offset_total_count
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /client-accounts]"]
        distinguishing_aspect: "With 3 clients, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup: ["three client accounts created"]
          setup_api_calls:
            - { call: "POST /client-accounts", payload: { name: "Alpha" }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Beta" }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Gamma" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /client-accounts?limit=2&offset=0", as: PlatformAdmin }
            - { call: "GET /client-accounts?limit=2&offset=2", as: PlatformAdmin }
          assert:
            - "page 1: len(data) == 2, total_count == 3, has_more == true"
            - "page 2: len(data) == 1, total_count == 3, has_more == false"

      - name: search_hit_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.SearchResultHit"]
        distinguishing_aspect: "common_fields false: a recorded SearchResultHit carries id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["client, debtor exist; PRE_FILING search recorded with one hit"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /lien-searches", payload: { client_id: "${cid}", purpose: "PRE_FILING", debtor_id: "${did}", jurisdiction_code: "CA" }, as: FilingSpecialist, captures: { sid: $.data.id } }
            - { call: "POST /lien-searches/${sid}/record-results", payload: { through_date: "2026-08-01T00:00:00Z", hits: [ { found_debtor_name: "Acme Manufacturing, Inc.", found_filing_number: "CA-2020-0001", found_filed_at: "2020-01-15T00:00:00Z", secured_party_name: "Other Bank" } ] }, as: SearchAnalyst }
          trigger:
            - { call: "GET /lien-searches/${sid}/hits", as: PlatformAdmin }
          assert:
            - "hit record has id and created_at"
            - "hit record has NO version and NO updated_at field"
            - "hit.hit_kind == EXACT_MATCH"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: initial_states_assigned_on_create
        claim_type: initial_state
        grounds: ["state_machines.FilingRequest", "state_machines.UCCFiling", "state_machines.LienSearch"]
        distinguishing_aspect: "Newly created FilingRequest is DRAFT_INTAKE; a new attempt is DRAFT with reflection UNVERIFIED; a new search is ORDERED — all before any transition call."
        test_recipe:
          setup: ["CA profile, client, debtor, secured party exist"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
          trigger:
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id, rst: $.data.status } }
            - { call: "POST /lien-searches", payload: { client_id: "${cid}", purpose: "PRE_FILING", debtor_id: "${did}", jurisdiction_code: "CA" }, as: FilingSpecialist, captures: { sst: $.data.status } }
          assert:
            - "FilingRequest.status == DRAFT_INTAKE at creation"
            - "LienSearch.status == ORDERED at creation"
            - "FilingRequest.${rid}.filing_office == null before submit-intake (determination has not run)"

      - name: approve_from_draft_intake_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.FilingRequest.IN_REVIEW_to_READY", "errors[ERR_REQUEST_INVALID_STATE]"]
        distinguishing_aspect: "approve-preparation from DRAFT_INTAKE is an invalid-from rejection; no quote is snapshotted."
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_vs_temporal_on_approve_preparation"
          rationale: "That instance's trigger is exactly this call from DRAFT_INTAKE and asserts ERR_REQUEST_INVALID_STATE wins."

      - name: record_acceptance_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.UCCFiling.SUBMITTED_to_ACTIVE", "errors[ERR_FILING_INVALID_STATE]"]
        distinguishing_aspect: "record-acceptance requires SUBMITTED; calling it on a DRAFT attempt yields ERR_FILING_INVALID_STATE and assigns no filing_number."
        test_recipe:
          setup: ["READY request with a DRAFT attempt (never submitted)"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
          trigger:
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FILING_INVALID_STATE"
            - "UCCFiling.${fid}.effectiveness_status == DRAFT and filing_number == null"

      - name: rerecord_results_rejected
        claim_type: idempotency
        grounds: ["state_machines.LienSearch.ORDERED_to_COMPLETED", "errors[ERR_SEARCH_NOT_ORDERED]"]
        distinguishing_aspect: "record-results is a one-shot transition: a second call on the COMPLETED search fails with ERR_SEARCH_NOT_ORDERED and the first result set is untouched."
        test_recipe:
          setup: ["PRE_FILING search already completed with results"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /lien-searches", payload: { client_id: "${cid}", purpose: "PRE_FILING", debtor_id: "${did}", jurisdiction_code: "CA" }, as: FilingSpecialist, captures: { sid: $.data.id } }
            - { call: "POST /lien-searches/${sid}/record-results", payload: { through_date: "2026-08-01T00:00:00Z", hits: [] }, as: SearchAnalyst }
          trigger:
            - { call: "POST /lien-searches/${sid}/record-results", payload: { through_date: "2026-08-01T00:00:00Z", hits: [] }, as: SearchAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEARCH_NOT_ORDERED"
            - "LienSearch.${sid}.status == COMPLETED (unchanged)"

      - name: withdraw_submitted_attempt_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.UCCFiling.DRAFT_to_WITHDRAWN", "errors[ERR_FILING_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawal is defined only from DRAFT; withdrawing a SUBMITTED attempt yields ERR_FILING_INVALID_STATE."
        test_recipe:
          setup: ["attempt submitted (SUBMITTED), request IN_PROCESS"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
          trigger:
            - { call: "POST /filings/${fid}/withdraw", payload: {}, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FILING_INVALID_STATE"
            - "UCCFiling.${fid}.effectiveness_status == SUBMITTED (unchanged)"

      - name: cancel_in_process_request_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.FilingRequest.DRAFT_INTAKE_to_CANCELLED", "errors[ERR_REQUEST_IN_PROCESS]"]
        distinguishing_aspect: "Cancellation is closed while an attempt sits at the filing office: cancel on IN_PROCESS yields ERR_REQUEST_IN_PROCESS, not the generic state error."
        test_recipe:
          setup: ["attempt submitted (request IN_PROCESS)"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
          trigger:
            - { call: "POST /filing-requests/${rid}/cancel", payload: {}, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REQUEST_IN_PROCESS"
            - "FilingRequest.${rid}.status == IN_PROCESS (unchanged)"

      - name: terminal_lockdown_fulfilled_request_submit_intake
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.FilingRequest"]
        distinguishing_aspect: "FULFILLED is terminal: submit-intake on a fulfilled request yields ERR_REQUEST_INVALID_STATE and no transition fires."
        test_recipe:
          setup: ["request carried end-to-end to FULFILLED (attempt accepted)"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { rid: $.data.id } }
            - { call: "POST /filing-requests/${rid}/submit-intake", payload: {}, as: FilingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /filing-requests/${rid}/approve-preparation", payload: {}, as: FilingReviewer, as_user_id: "rev-1" }
            - { call: "POST /filing-requests/${rid}/attempts", payload: { debtor_name_on_filing: "Acme Manufacturing, Inc.", collateral_text: "All manufacturing equipment located at 100 Industrial Way" }, as: FilingSpecialist, captures: { fid: $.data.id } }
            - { call: "POST /filings/${fid}/submit", payload: {}, as: FilingSpecialist }
            - { call: "POST /filings/${fid}/record-acceptance", payload: { filing_number: "CA-2026-0001", filed_at: "2026-08-01T00:00:00Z" }, as: FilingOfficer }
          trigger:
