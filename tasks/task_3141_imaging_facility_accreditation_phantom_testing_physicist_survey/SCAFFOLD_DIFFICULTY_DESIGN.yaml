- rule_id: transitive_cascade
  instances:
  - name: deficiency_hop_plan_hop_unit_count_hop_payer_hop
    grounds:
    - state_machines.ClinicalImageSubmission.PENDING_REVIEW_to_DEFICIENCY
    - state_machines.CorrectiveActionPlan.OPEN_to_SUBMITTED
    - state_machines.ClinicalImageSubmission.PENDING_REVIEW_to_ACCEPTED
    - validations[priority=6]
    - entities.Facility.fields.payer_participation_status
    distinguishing_aspect: 'A single review call at hop 1 cascades across four entities and three causal links of depth 4: the deficiency creates a plan (hop 2) whose SUBMITTED re-labelling changes the unit''s deficiency_open_count (hop 3), which is the quantity the accepting review re-reads before flipping the facility''s payer_participation_status (hop 4) — no link is caused by the original review call.'
    test_recipe:
      setup:
      - Logical clock 2026-09-05T00:00:00Z (inside the unit's open submission and testing windows).
