      - name: campaign_suspend_locks_open_campaign_via_group_cascade
        claim_type: cascade_down
        grounds: [state_machines.EmployerGroup.ACTIVE_to_SUSPENDED, state_machines.EnrollmentCampaign.transitions]
        distinguishing_aspect: "Suspending a group force-locks its OPEN campaigns; DRAFT campaigns of the same group are untouched by the cascade."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GZ ACTIVE; counselors CZ1, CZ2 ACTIVE; campaign CZ-A OPEN (window 2026-09-01..2026-09-15); campaign CZ-B DRAFT (window 2026-09-15..2026-10-01, counselor CZ2)."
