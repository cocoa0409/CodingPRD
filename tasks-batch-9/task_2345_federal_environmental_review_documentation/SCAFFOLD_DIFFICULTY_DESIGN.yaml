            - *c_get_act_v
            - *c_adopt_pn1
            - *c_issue_bio
            - *c_alt_a
            - *c_alt_b
            - *c_screen_alt_a
            - *c_screen_alt_b
            - *c_agency_fws
            - *c_con_esa
            - *c_con_esa_concur
            - *c_close_scope1
            - *c_cum1
            - *c_cum2
            - *c_cum3
            - *c_cum4
            - *c_ra_bio
            - *c_final_unmit
            - *c_doc_ea
            - *c_clk_sep5
            - *c_publish_ea
            - *c_comment1
            - *c_clk_oct5
            - *c_close_comments
            - *c_respond_comment1
            - *c_finalize_doc
            - *c_decision
            - *c_mit1
            - *c_get_dec_v2
            - *c_mit2
            - *c_clk_nov1
            - *c_sign
            - &c_objection
              call: "POST /decisions/${dec_id}/objections"
              payload: { objector_name: "J. Rivera", objector_type: "COMMENTER", basis_issue_area: "BIOLOGICAL", standing_basis: "SUBSTANTIVE_COMMENT" }
              as: PublicCommenter
              captures: { obj_id: $.data.id }
          trigger:
            - &c_resolve_remand
              call: "POST /objections/${obj_id}/resolve"
