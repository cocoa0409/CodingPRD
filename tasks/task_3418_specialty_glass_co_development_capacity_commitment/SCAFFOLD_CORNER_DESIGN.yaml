      - name: yield_step_boundaries_20000_and_80000
        claim_type: constants_applied
        grounds: ["calculations.yield_learning_curve"]
        distinguishing_aspect: "Step thresholds are inclusive at the lower bound of the next step: planned 20000 takes rate 0.78 (not 0.62) and planned 80000 takes 0.90; adjacent same-composition campaigns share a tank with zero gap."
        test_recipe:
          setup: ["QUALIFIED composition; SECURED commitment; tank commissioned; no campaigns yet"]
