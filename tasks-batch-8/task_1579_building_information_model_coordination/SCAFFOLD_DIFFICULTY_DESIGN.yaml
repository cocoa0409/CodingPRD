            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/clash-runs", payload: { tolerance_mm: 5.0 }, as: BIMCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "A/1", overlap_mm: 75.0, spans_disciplines: true }, as: BIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "A/2", overlap_mm: 75.0, spans_disciplines: true }, as: BIMCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "A/3", overlap_mm: 75.0, spans_disciplines: true }, as: BIMCoordinator, captures: { c3: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${pid}/advance-phase", payload: {}, as: VDCManager }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { ph1: $.data.current_phase, po1: $.data.coordination_posture, cri1: $.data.coordination_readiness_index } }
            - { call: "POST /api/clash-issues/${c1}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c2}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c3}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c1}/resolve", payload: { actual_labor_hours: 1.0 }, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/clash-issues/${c2}/resolve", payload: { actual_labor_hours: 1.0 }, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/clash-issues/${c3}/resolve", payload: { actual_labor_hours: 1.0 }, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/clash-issues/${c1}/verify", payload: { re_inspection_overlap_mm: 0.0 }, as: BIMCoordinator, as_user_id: "coord-2" }
            - { call: "POST /api/clash-issues/${c2}/verify", payload: { re_inspection_overlap_mm: 0.0 }, as: BIMCoordinator, as_user_id: "coord-2" }
            - { call: "POST /api/clash-issues/${c3}/verify", payload: { re_inspection_overlap_mm: 0.0 }, as: BIMCoordinator, as_user_id: "coord-2" }
