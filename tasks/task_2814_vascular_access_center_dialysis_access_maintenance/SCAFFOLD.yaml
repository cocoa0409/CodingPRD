scenario: |
  2814. Vascular Access Center & Dialysis Access Maintenance (freestanding vascular access center):
  referral intake from dialysis facilities with access flow and pressure surveillance data, procedure
  scheduling for angioplasty, thrombectomy and catheter exchange with same-day urgency, moderate
  sedation staffing and recovery monitoring, access type conversion planning from catheter to fistula
  with maturation follow-up, procedure coding, bundled versus separately payable services, and medical
  necessity documentation, infection surveillance and post-procedure complication tracking, dialysis
  facility partnership metrics on missed treatments, inventory of sheaths, balloons and stents with
  expiry control

domain_name: vascular-access-center
api_prefix: ""          # peer top-level collections: /referrals, /procedures, /device-lots, ...

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer collections joined by cross-aggregate FKs plus a self-referential
  # VascularAccess.predecessor_access_id chain (catheter -> fistula conversion
  # lineage) and a DeviceUsage junction between Procedure and DeviceLot.

  state_machine_shape: cyclic
  # Referral: SUBMITTED <-> INFO_REQUESTED revision loop.
  # VascularAccess: IN_USE <-> DYSFUNCTIONAL maintenance loop.
  # AccessConversionPlan: ACTIVE <-> MATURATION_HOLD re-check loop.
  # DeviceLot: AVAILABLE <-> QUARANTINED loop.
  # Procedure: PARALLEL dimensions (clinical_status x coding_status) on one row.

  relationship_patterns:
    - one_to_many          # DialysisFacility -> Patient -> VascularAccess -> Referral
    - many_to_many         # DeviceUsage junction (Procedure x DeviceLot)
    - self_referential     # VascularAccess.predecessor_access_id
    - cross_aggregate      # Procedure -> Clinician / ProcedureRoom; Plan -> two VascularAccess rows

  role_model: segregation_of_duties
  # The Coder who codes a Procedure may not be its primary operator or sedation RN;
  # medical-necessity attestation may only be filed by the primary operator; billing
  # is exclusive to CenterAdmin and requires a prior attestation by someone else.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: DialysisFacility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the partner dialysis facility
      - name: facility_code
        type: string
        source: input
        description: operator-assigned short code; unique across all DialysisFacility rows
        constraints: "1..16 chars, unique"
      - name: contract_status
        type: enum
        source: computed
        description: partnership posture derived from partnership_score by calculations.facility_partnership_score step 9
        default: ACTIVE
        constraints: "one of {ACTIVE, PROBATION, SUSPENDED}"
      - name: partnership_tier
        type: enum
        source: computed
        description: grace-credit tier persisted by the previous scoring evaluation; read as tier_at_eval by the next one
        default: SILVER
        constraints: "one of {GOLD, SILVER, WATCH}"
      - name: partnership_score
        type: integer
        source: computed
        description: 0..100 partnership score from calculations.facility_partnership_score
        default: 100
        constraints: "0 <= partnership_score <= 100"
      - name: referral_volume_window
        type: integer
        source: computed
        description: count of in-window referrals used as the grace-credit base
        default: 0
      - name: raw_missed_count_window
        type: integer
        source: computed
        description: sum of Referral.missed_treatment_count over the 90-day window before grace credit
        default: 0
      - name: grace_credit_window
        type: integer
        source: computed
        description: floor(referral_volume_window * GRACE_RATE_BY_TIER[tier_at_eval])
        default: 0
      - name: adjusted_missed_count_window
        type: integer
        source: computed
        description: max(0, raw_missed_count_window - grace_credit_window)
        default: 0
      - name: same_day_honored_window
        type: integer
        source: computed
        description: count of DISCHARGED procedures that honored a SAME_DAY referral on its triage date
        default: 0
      - name: last_scored_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent scoring evaluation; null before the first one
        default: null

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: medical record number; unique across all Patient rows
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: patient legal name
      - name: dialysis_facility_id
        type: string
        source: input
        description: "FK -> DialysisFacility.id; the patient's home dialysis facility"
      - name: dialysis_modality
        type: enum
        source: input
        description: how the patient currently dialyzes
        constraints: "one of {IN_CENTER_HD, HOME_HD, PD}"
      - name: payer_program
        type: enum
        source: input
        description: payer model that selects the reimbursement variant in calculations.procedure_allowed_amount
        constraints: "one of {BUNDLED_ESRD, FEE_FOR_SERVICE}"
      - name: access_count
        type: integer
        source: computed
        description: count of VascularAccess rows for this patient whose status IN {PLANNED, PLACED, MATURING, IN_USE, DYSFUNCTIONAL}
        default: 0

  - name: VascularAccess
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; owner of this access"
      - name: access_type
        type: enum
        source: input
        description: physical access modality
        constraints: "one of {TUNNELED_CATHETER, AVF, AVG}"
      - name: laterality
        type: enum
        source: input
        description: side of the body
        constraints: "one of {LEFT, RIGHT}"
      - name: site
        type: enum
        source: input
        description: anatomical site
        constraints: "one of {FOREARM, UPPER_ARM, THIGH, INTERNAL_JUGULAR, SUBCLAVIAN}"
      - name: placed_on
        type: string
        source: input
        description: calendar date the access was surgically placed, YYYY-MM-DD; maturation day count anchors here
        constraints: "YYYY-MM-DD"
      - name: predecessor_access_id
        type: string
        source: input
        description: "FK -> VascularAccess.id; the access this one is intended to replace (self-referential conversion lineage); null for a first access"
        default: null
      - name: status
        type: enum
        source: computed
        description: lifecycle state driven by state_machines.VascularAccess
        default: PLANNED
        constraints: "one of {PLANNED, PLACED, MATURING, IN_USE, DYSFUNCTIONAL, ABANDONED}"
      - name: angioplasty_count
        type: integer
        source: computed
        description: count of DISCHARGED procedures on this access with procedure_type == ANGIOPLASTY
        default: 0
      - name: thrombectomy_count
        type: integer
        source: computed
        description: count of DISCHARGED procedures on this access with procedure_type == THROMBECTOMY
        default: 0
      - name: catheter_exchange_count
        type: integer
        source: computed
        description: count of DISCHARGED procedures on this access with procedure_type == CATHETER_EXCHANGE
        default: 0
      - name: maturation_intervention_count
        type: integer
        source: computed
        description: count of DISCHARGED procedures on this access with procedure_type == FISTULA_MATURATION_INTERVENTION
        default: 0
      - name: attributable_infection_count
        type: integer
        source: computed
        description: count of InfectionEvent rows on this access with attributable == true
        default: 0
      - name: intervention_burden_score
        type: integer
        source: computed
        description: weighted burden from calculations.access_intervention_burden
        default: 0
      - name: abandoned_at
        type: datetime
        source: computed
        description: logical-clock instant the access entered ABANDONED; null otherwise
        default: null

  - name: SurveillanceReading
    parent: null
    common_fields: false
    fields:
      - name: access_id
        type: string
        source: input
        description: "FK -> VascularAccess.id; access the reading was taken on"
      - name: reported_by_facility_id
        type: string
        source: input
        description: "FK -> DialysisFacility.id; facility that submitted the reading; must equal X-User-ID for FacilityCoordinator"
      - name: reading_at
        type: datetime
        source: input
        description: instant the flow/pressure measurement was taken, ISO 8601 UTC
      - name: access_flow_ml_min
        type: integer
        source: input
        description: measured access blood flow in mL/min
        constraints: ">= 0"
      - name: venous_pressure_mmhg
        type: integer
        source: input
        description: dynamic venous pressure in mmHg
        constraints: ">= 0"
      - name: recirculation_pct
        type: number
        source: input
        description: measured recirculation percentage, one decimal place
        constraints: "0.0 <= recirculation_pct <= 100.0"
      - name: kind
        type: enum
        source: input
        description: routine monthly surveillance versus urgent bedside check
        constraints: "one of {ROUTINE, URGENT}"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: access_id
        type: string
        source: input
        description: "FK -> VascularAccess.id; access the facility believes is failing"
      - name: referring_facility_id
        type: string
        source: input
        description: "FK -> DialysisFacility.id; submitting facility; must equal X-User-ID for FacilityCoordinator"
      - name: suspected_problem
        type: enum
        source: input
        description: facility's working diagnosis
        constraints: "one of {STENOSIS, THROMBOSIS, CATHETER_DYSFUNCTION, MATURATION_FAILURE}"
      - name: clinical_narrative
        type: string
        source: input
        description: free-text justification carried into medical-necessity documentation
      - name: missed_treatment_count
        type: integer
        source: input
        description: dialysis treatments missed by this patient because of this access problem
        default: 0
        constraints: "0 <= missed_treatment_count <= 60"
      - name: status
        type: enum
        source: computed
        description: lifecycle state driven by state_machines.Referral
        default: SUBMITTED
        constraints: "one of {SUBMITTED, INFO_REQUESTED, TRIAGED, SCHEDULED, COMPLETED, DECLINED}"
      - name: triage_score
        type: integer
        source: computed
        description: 0..100 score from calculations.referral_triage_score; null before triage
        default: null
      - name: triage_variant
        type: enum
        source: computed
        description: which variant of calculations.referral_triage_score produced triage_score
        default: null
        constraints: "one of {TREND_BASED, ABSOLUTE_BASED}"
      - name: urgency
        type: enum
        source: computed
        description: urgency band derived from triage_score thresholds; null before triage
        default: null
        constraints: "one of {SAME_DAY, NEXT_DAY, ROUTINE}"
      - name: triaged_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent triage; the SAME_DAY scheduling window anchors on its calendar date
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: logical-clock instant the referral entered COMPLETED
        default: null
      - name: info_request_count
        type: integer
        source: computed
        description: number of times this referral has entered INFO_REQUESTED (revision loop counter)
        default: 0
      - name: hold_reason
        type: enum
        source: computed
        description: why the referral was last pushed to INFO_REQUESTED
        default: null
        constraints: "one of {COORDINATOR_REQUEST, FACILITY_POSTURE_HOLD}"
      - name: decline_reason
        type: string
        source: computed
        description: free-text reason recorded when the referral entered DECLINED
        default: null

  - name: ProcedureRoom
    parent: null
    common_fields: true
    fields:
      - name: room_code
        type: string
        source: input
        description: operator-assigned room code; unique across all ProcedureRoom rows
        constraints: "unique"
      - name: room_type
        type: enum
        source: input
        description: angiography suite versus plain procedure room; only ANGIO_SUITE earns the same-day surge allowance
        constraints: "one of {ANGIO_SUITE, PROCEDURE_ROOM}"
      - name: turnover_buffer_min
        type: integer
        source: input
        description: minutes of room turnover appended to every booking for overlap arithmetic
        default: 30
        constraints: ">= 0"
      - name: daily_case_cap
        type: integer
        source: input
        description: maximum non-cancelled cases per calendar day in this room before surge
        default: 6
        constraints: ">= 1"
      - name: recovery_bay_count
        type: integer
        source: input
        description: number of moderate-sedation recovery bays attached to this room
        default: 3
        constraints: ">= 1"

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: clinician legal name
      - name: clinician_role
        type: enum
        source: input
        description: staffing role; constrains which Procedure slot the clinician may fill
        constraints: "one of {INTERVENTIONALIST, SEDATION_RN, RECOVERY_RN, CODER}"
      - name: npi
        type: string
        source: input
        description: national provider identifier; unique across all Clinician rows
        constraints: "10 digits, unique"
      - name: moderate_sedation_credentialed
        type: boolean
        source: input
        description: whether the clinician may staff a MODERATE sedation case
        default: false
      - name: credential_expires_on
        type: string
        source: input
        description: calendar date the sedation credential lapses, YYYY-MM-DD; valid while credential_expires_on >= date(clock)
        constraints: "YYYY-MM-DD"
      - name: max_concurrent_sedation_cases
        type: integer
        source: input
        description: aggregate ceiling on overlapping MODERATE sedation cases assigned to this clinician
        default: 2
        constraints: ">= 0"

  - name: Procedure
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the referral this procedure answers"
      - name: access_id
        type: string
        source: computed
        description: "FK -> VascularAccess.id; copied verbatim from the referral's access_id at creation and never re-derived"
      - name: room_id
        type: string
        source: input
        description: "FK -> ProcedureRoom.id; room the case occupies"
      - name: primary_operator_id
        type: string
        source: input
        description: "FK -> Clinician.id; must have clinician_role == INTERVENTIONALIST"
      - name: sedation_rn_id
        type: string
        source: input
        description: "FK -> Clinician.id; must have clinician_role == SEDATION_RN; required when sedation_level == MODERATE"
      - name: attested_by_id
        type: string
        source: computed
        description: "FK -> Clinician.id; clinician who filed the medical-necessity attestation; null before attestation"
        default: null
      - name: supporting_reading_id
        type: string
        source: computed
        description: "FK -> SurveillanceReading.id; the surveillance reading cited by the attestation; null before attestation"
        default: null
      - name: procedure_type
        type: enum
        source: input
        description: intervention performed
        constraints: "one of {ANGIOPLASTY, THROMBECTOMY, CATHETER_EXCHANGE, FISTULA_MATURATION_INTERVENTION}"
      - name: sedation_level
        type: enum
        source: input
        description: sedation plan; MODERATE consumes sedation-RN and recovery-bay capacity
        constraints: "one of {NONE, MODERATE}"
      - name: scheduled_start
        type: datetime
        source: input
        description: booked room start, ISO 8601 UTC
      - name: scheduled_end
        type: datetime
        source: input
        description: booked room end, ISO 8601 UTC; must be strictly after scheduled_start
      - name: clinical_status
        type: enum
        source: computed
        description: clinical dimension of state_machines.Procedure; evolves independently of coding_status
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_ROOM, RECOVERY, DISCHARGED, ABORTED, CANCELLED}"
      - name: coding_status
        type: enum
        source: computed
        description: revenue-cycle dimension of state_machines.Procedure; evolves independently of clinical_status
        default: UNCODED
        constraints: "one of {UNCODED, CODED, ATTESTED, BILLED, DENIED, REBILLED}"
      - name: sedation_end_at
        type: datetime
        source: computed
        description: instant sedation stopped, recorded on the RECOVERY transition; anchors the recovery-bay window
        default: null
      - name: discharged_at
        type: datetime
        source: computed
        description: logical-clock instant the patient was discharged; anchors infection attribution
        default: null
      - name: reimbursement_variant
        type: enum
        source: computed
        description: variant of calculations.procedure_allowed_amount that produced allowed_amount_cents
        default: null
        constraints: "one of {BUNDLED_ESRD, FEE_FOR_SERVICE}"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: sum of ProcedureCode.allowed_cents for this procedure under the applicable variant
        default: 0
      - name: billed_amount_cents
        type: integer
        source: computed
        description: amount currently on the payer's desk; set to allowed_amount_cents on BILLED and REBILLED
        default: 0
      - name: denied_amount_cents
        type: integer
        source: computed
        description: amount currently denied; set to billed_amount_cents on DENIED, zeroed on REBILLED
        default: 0
      - name: net_receivable_cents
        type: integer
        source: computed
        description: billed_amount_cents - denied_amount_cents; the conserved money quantity of the revenue cycle
        default: 0
      - name: rebill_count
        type: integer
        source: computed
        description: number of times this procedure has been rebilled after a denial
        default: 0
      - name: medical_necessity_statement
        type: string
        source: computed
        description: attestation narrative filed by the primary operator
        default: null
      - name: abort_reason
        type: string
        source: computed
        description: reason recorded when the case was aborted in room
        default: null
      - name: cancel_reason
        type: enum
        source: computed
        description: reason recorded when the booking was cancelled before entering the room
        default: null
        constraints: "one of {COORDINATOR_CANCEL, FACILITY_POSTURE_HOLD}"
      - name: denial_reason
        type: enum
        source: computed
        description: payer denial category
        default: null
        constraints: "one of {MEDICAL_NECESSITY, BUNDLING, DOCUMENTATION, TIMELY_FILING}"
      - name: denial_code
        type: string
        source: computed
        description: payer remittance code recorded with the denial
        default: null

  - name: ProcedureCode
    parent: Procedure
    common_fields: true
    fields:
      - name: procedure_id
        type: string
        source: input
        description: "FK -> Procedure.id; procedure this line item belongs to"
      - name: hcpcs_code
        type: string
        source: input
        description: HCPCS/CPT code string as submitted
      - name: code_family
        type: enum
        source: input
        description: bundling family; lines sharing the primary line's family collapse under the bundled variant
        constraints: "one of {ANGIOPLASTY, THROMBECTOMY, CATH_EXCHANGE, IMAGING, ACCESS_MAINTENANCE_BUNDLE}"
      - name: base_allowed_cents
        type: integer
        source: input
        description: payer fee-schedule amount for this code before modifier and multiple-procedure reduction
        constraints: ">= 0"
      - name: modifier
        type: enum
        source: input
        description: "billing modifier; M52 halves the line, M59 marks a distinct site and blocks bundling"
        default: NONE
        constraints: "one of {NONE, M59, M52}"
      - name: rank
        type: integer
        source: input
        description: submission rank; rank 1 is the primary line and drives both variants
        constraints: ">= 1, unique per procedure_id"
      - name: is_bundled
        type: boolean
        source: computed
        description: true when the bundled variant collapsed this line to zero
        default: false
      - name: reduction_factor_pct
        type: integer
        source: computed
        description: multiple-procedure reduction applied to this line, in percent (100, 50 or 25)
        default: 100
      - name: allowed_cents
        type: integer
        source: computed
        description: per-line allowed amount after modifier and reduction, rounded to whole cents round_half_up
        default: 0

  - name: RecoveryObservation
    parent: Procedure
    common_fields: false
    fields:
      - name: procedure_id
        type: string
        source: input
        description: "FK -> Procedure.id; procedure being recovered from"
      - name: observed_at
        type: datetime
        source: input
        description: instant the observation was charted, ISO 8601 UTC
      - name: aldrete_score
        type: integer
        source: input
        description: modified Aldrete recovery score
        constraints: "0 <= aldrete_score <= 10"
      - name: on_room_air
        type: boolean
        source: input
        description: whether the patient is breathing room air without supplemental oxygen

  - name: DeviceLot
    parent: null
    common_fields: true
    fields:
      - name: device_type
        type: enum
        source: input
        description: consumable category
        constraints: "one of {SHEATH, BALLOON, STENT}"
      - name: catalog_code
        type: string
        source: input
        description: manufacturer catalog code
      - name: lot_number
        type: string
        source: input
        description: manufacturer lot number; unique per (device_type, lot_number)
        constraints: "unique with device_type"
      - name: expires_on
        type: string
        source: input
        description: lot expiry date, YYYY-MM-DD; a lot is eligible only while expires_on is strictly after the case's calendar date
        constraints: "YYYY-MM-DD"
      - name: received_quantity
        type: integer
        source: input
        description: units received into stock; immutable and the anchor of the device-unit conservation invariant
        constraints: ">= 1"
      - name: quantity_on_hand
        type: integer
        source: computed
        description: units physically present; decremented only when a reservation is consumed
        default: "received_quantity at creation"
      - name: quantity_reserved
        type: integer
        source: computed
        description: sum of DeviceUsage.quantity for this lot with state == RESERVED
        default: 0
      - name: unit_cost_cents
        type: integer
        source: input
        description: acquisition cost per unit in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: lifecycle state driven by state_machines.DeviceLot
        default: AVAILABLE
        constraints: "one of {AVAILABLE, QUARANTINED, EXPIRED, DEPLETED}"
      - name: quarantine_reason
        type: string
        source: computed
        description: reason recorded when the lot was quarantined; retained after release
        default: null

  - name: DeviceUsage
    parent: null
    common_fields: true
    fields:
      - name: procedure_id
        type: string
        source: input
        description: "FK -> Procedure.id; case the units are held for"
      - name: device_lot_id
        type: string
        source: input
        description: "FK -> DeviceLot.id; lot the units are drawn from"
      - name: quantity
        type: integer
        source: input
        description: units reserved for the case
        constraints: ">= 1"
      - name: state
        type: enum
        source: computed
        description: reservation lifecycle driven by state_machines.DeviceUsage
        default: RESERVED
        constraints: "one of {RESERVED, CONSUMED, RELEASED}"
      - name: wasted_quantity
        type: integer
        source: computed
        description: units opened but not implanted, recorded at consumption
        default: 0
      - name: consumed_at
        type: datetime
        source: computed
        description: logical-clock instant the reservation was consumed
        default: null
      - name: released_at
        type: datetime
        source: computed
        description: logical-clock instant the reservation was released back to stock
        default: null

  - name: AccessConversionPlan
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; patient being converted"
      - name: from_access_id
        type: string
        source: input
        description: "FK -> VascularAccess.id; the access being retired, typically a TUNNELED_CATHETER"
      - name: target_access_id
        type: string
        source: input
        description: "FK -> VascularAccess.id; the maturing fistula or graft that will replace it; null while the target has not been placed"
        default: null
      - name: target_access_type
        type: enum
        source: input
        description: intended permanent access modality
        constraints: "one of {AVF, AVG}"
      - name: target_conversion_date
        type: string
        source: input
        description: planned cutover date, YYYY-MM-DD
        constraints: "YYYY-MM-DD"
      - name: status
        type: enum
        source: computed
        description: lifecycle state driven by state_machines.AccessConversionPlan
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, MATURATION_HOLD, CONVERTED, ABANDONED}"
      - name: maturation_check_count
        type: integer
        source: computed
        description: number of maturation checks filed against this plan
        default: 0
      - name: last_check_at
        type: datetime
        source: computed
        description: charted instant of the most recent maturation check
        default: null
      - name: last_diameter_mm
        type: number
        source: computed
        description: diameter from the most recent maturation check, mm
        default: null
      - name: last_flow_ml_min
        type: integer
        source: computed
        description: flow from the most recent maturation check, mL/min
        default: null
      - name: last_depth_mm
        type: number
        source: computed
        description: depth from the most recent maturation check, mm
        default: null
      - name: days_since_placement
        type: integer
        source: computed
        description: whole days from target access placed_on to date(clock) at the most recent check
        default: null
      - name: readiness_met
        type: boolean
        source: computed
        description: whether the most recent maturation check satisfied calculations.maturation_readiness
        default: false
      - name: readiness_failure_reasons
        type: array
        source: computed
        description: sorted list of failed readiness criterion names from the most recent check
        default: []
      - name: converted_at
        type: datetime
        source: computed
        description: logical-clock instant the plan entered CONVERTED
        default: null

  - name: InfectionEvent
    parent: null
    common_fields: true
    fields:
      - name: procedure_id
        type: string
        source: input
        description: "FK -> Procedure.id; index procedure the event is evaluated against"
      - name: access_id
        type: string
        source: computed
        description: "FK -> VascularAccess.id; copied verbatim from the procedure's access_id at creation"
      - name: event_type
        type: enum
        source: input
        description: complication category
        constraints: "one of {ACCESS_SITE_INFECTION, BACTEREMIA}"
      - name: organism
        type: string
        source: input
        description: cultured organism, free text
      - name: onset_at
        type: datetime
        source: input
        description: instant of symptom onset, ISO 8601 UTC
      - name: days_post_procedure
        type: integer
        source: computed
        description: whole days from procedure.discharged_at to onset_at, floor of the elapsed-seconds quotient
      - name: attributable
        type: boolean
        source: computed
        description: whether the event falls inside the 30-day attribution window per calculations.infection_attribution
        default: false

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Referral
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /referrals/{id}/request-info"
        actor: AccessCoordinator
        preconditions:
          - "referral.status == SUBMITTED"
        side_effects:
          - "set referral.hold_reason = COORDINATOR_REQUEST"
          - "increment referral.info_request_count by 1"
          - "increment Referral.version by 1"
        note: "First half of the SUBMITTED <-> INFO_REQUESTED revision loop."

      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /referrals/{id}/resubmit"
        actor: FacilityCoordinator
        preconditions:
          - "referral.status == INFO_REQUESTED"
          - "referral.referring_facility_id == X-User-ID"
        side_effects:
          - "overwrite referral.clinical_narrative with the resubmitted narrative"
          - "overwrite referral.missed_treatment_count when the payload supplies it"
          - "clear referral.hold_reason to null"
          - "clear referral.triage_score, referral.triage_variant, referral.urgency and referral.triaged_at to null (a resubmitted referral must be re-triaged from scratch)"
          - "increment Referral.version by 1"
        note: "Closes the revision loop; info_request_count is NOT decremented, so the loop is countable."

      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /referrals/{id}/triage"
        actor: AccessCoordinator
        preconditions:
          - "referral.status == SUBMITTED"
          - "DialysisFacility(referral.referring_facility_id).contract_status IN {ACTIVE, PROBATION} — SUSPENDED rejects with ERR_FACILITY_SUSPENDED"
          - "COUNT(SurveillanceReading where access_id == referral.access_id AND reading_at <= clock) >= 1 — otherwise ERR_INSUFFICIENT_SURVEILLANCE"
          - "VascularAccess(referral.access_id).status != ABANDONED"
        side_effects:
          - "run calculations.referral_triage_score; write referral.triage_score, referral.triage_variant, referral.urgency"
          - "set referral.triaged_at = clock"
          - "when referral.suspected_problem IN {STENOSIS, THROMBOSIS, CATHETER_DYSFUNCTION} AND VascularAccess(referral.access_id).status == IN_USE: transition that access IN_USE -> DYSFUNCTIONAL"
          - "run calculations.facility_partnership_score for referral.referring_facility_id (single pass)"
          - "increment Referral.version by 1"

      - from: TRIAGED
        to: SCHEDULED
        trigger: "POST /procedures (system side effect of creating the Procedure)"
        actor: system
        preconditions:
          - "referral.status == TRIAGED"
        side_effects:
          - "increment Referral.version by 1"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /procedures/{id}/discharge (cascade hop 2)"
        actor: system
        preconditions:
          - "referral.status == SCHEDULED"
          - "the discharging Procedure.referral_id == referral.id"
        side_effects:
          - "set referral.completed_at = clock"
          - "cascade hop 3: re-evaluate VascularAccess(referral.access_id) — DYSFUNCTIONAL -> IN_USE, or MATURING -> IN_USE when the completing procedure_type == FISTULA_MATURATION_INTERVENTION"
          - "increment Referral.version by 1"

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /referrals/{id}/decline"
        actor: AccessCoordinator
        preconditions:
          - "referral.status IN {SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "set referral.decline_reason from the payload"
          - "run calculations.facility_partnership_score for referral.referring_facility_id (DECLINED referrals leave the missed-treatment window, so the score can rise)"
          - "increment Referral.version by 1"

      - from: INFO_REQUESTED
        to: DECLINED
        trigger: "POST /referrals/{id}/decline"
        actor: AccessCoordinator
        preconditions:
          - "referral.status IN {SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "set referral.decline_reason from the payload"
          - "run calculations.facility_partnership_score for referral.referring_facility_id"
          - "increment Referral.version by 1"

      - from: TRIAGED
        to: INFO_REQUESTED
        trigger: "posture cascade from DialysisFacility ACTIVE -> SUSPENDED or ACTIVE -> PROBATION (cascade hop 3)"
        actor: system
        preconditions:
          - "referral.status IN {SUBMITTED, TRIAGED, SCHEDULED} at the moment the facility posture drops"
        side_effects:
          - "set referral.hold_reason = FACILITY_POSTURE_HOLD"
          - "increment referral.info_request_count by 1"
          - "clear referral.triage_score, referral.triage_variant, referral.urgency, referral.triaged_at to null"
          - "increment Referral.version by 1"

      - from: SCHEDULED
        to: INFO_REQUESTED
        trigger: "posture cascade from DialysisFacility ACTIVE -> SUSPENDED (cascade hop 3)"
        actor: system
        preconditions:
          - "referral.status == SCHEDULED"
          - "DialysisFacility(referral.referring_facility_id).contract_status became SUSPENDED in this request"
        side_effects:
          - "set referral.hold_reason = FACILITY_POSTURE_HOLD"
          - "increment referral.info_request_count by 1"
          - "cascade hop 4: every Procedure with referral_id == referral.id AND clinical_status == SCHEDULED transitions SCHEDULED -> CANCELLED with cancel_reason = FACILITY_POSTURE_HOLD"
          - "increment Referral.version by 1"

  - entity: VascularAccess
    shape: cyclic
    initial_state: PLANNED
    terminal_states: [ABANDONED]
    transitions:
      - from: PLANNED
        to: PLACED
        trigger: "POST /vascular-accesses/{id}/status with to_status = PLACED"
        actor: AccessCoordinator
        preconditions:
          - "access.status == PLANNED"
        side_effects:
          - "increment VascularAccess.version by 1"

      - from: PLACED
        to: MATURING
        trigger: "POST /vascular-accesses/{id}/status with to_status = MATURING"
        actor: AccessCoordinator
        preconditions:
          - "access.status == PLACED"
          - "access.access_type IN {AVF, AVG} — a TUNNELED_CATHETER never matures and is rejected with ERR_ACCESS_TRANSITION_NOT_ALLOWED"
        side_effects:
          - "increment VascularAccess.version by 1"

      - from: PLACED
        to: IN_USE
        trigger: "POST /vascular-accesses/{id}/status with to_status = IN_USE"
        actor: AccessCoordinator
        preconditions:
          - "access.status == PLACED"
          - "access.access_type == TUNNELED_CATHETER — AVF/AVG must pass through MATURING first"
        side_effects:
          - "increment Patient.access_count recomputation"
          - "increment VascularAccess.version by 1"

      - from: MATURING
        to: IN_USE
        trigger: "POST /vascular-accesses/{id}/status with to_status = IN_USE"
        actor: AccessCoordinator
        preconditions:
          - "access.status == MATURING"
          - "access.access_type IN {AVF, AVG}"
        side_effects:
          - "cascade: every AccessConversionPlan with target_access_id == access.id AND status == ACTIVE AND readiness_met == true transitions ACTIVE -> CONVERTED"
          - "increment VascularAccess.version by 1"

      - from: IN_USE
        to: DYSFUNCTIONAL
        trigger: "POST /referrals/{id}/triage side effect, or POST /infection-events when attributable_infection_count reaches 2"
        actor: system
        preconditions:
          - "access.status == IN_USE"
        side_effects:
          - "increment VascularAccess.version by 1"

      - from: DYSFUNCTIONAL
        to: IN_USE
        trigger: "POST /procedures/{id}/discharge (cascade hop 3, caused by the referral entering COMPLETED)"
        actor: system
        preconditions:
          - "access.status == DYSFUNCTIONAL"
          - "the Referral that just entered COMPLETED has access_id == access.id"
        side_effects:
          - "recompute angioplasty_count / thrombectomy_count / catheter_exchange_count / maturation_intervention_count and calculations.access_intervention_burden"
          - "increment VascularAccess.version by 1"
        note: "Closes the IN_USE <-> DYSFUNCTIONAL maintenance loop."

      - from: MATURING
        to: IN_USE
        trigger: "POST /procedures/{id}/discharge (cascade hop 3) when the completing procedure_type == FISTULA_MATURATION_INTERVENTION"
        actor: system
        preconditions:
          - "access.status == MATURING"
          - "the Referral that just entered COMPLETED has access_id == access.id AND the discharging Procedure.procedure_type == FISTULA_MATURATION_INTERVENTION"
        side_effects:
          - "recompute intervention counters and calculations.access_intervention_burden"
          - "cascade hop 4: every AccessConversionPlan with target_access_id == access.id AND status == ACTIVE AND readiness_met == true transitions ACTIVE -> CONVERTED"
          - "increment VascularAccess.version by 1"

      - from: IN_USE
        to: ABANDONED
        trigger: "AccessConversionPlan ACTIVE -> CONVERTED (cascade hop 5), or POST /vascular-accesses/{id}/status with to_status = ABANDONED"
        actor: system | AccessCoordinator
        preconditions:
          - "access.status IN {PLANNED, PLACED, MATURING, IN_USE, DYSFUNCTIONAL}"
          - "when the transition is driven by POST /vascular-accesses/{id}/status: no Procedure on this access has clinical_status IN {SCHEDULED, IN_ROOM, RECOVERY} — otherwise ERR_ACCESS_HAS_OPEN_CASE. The AccessConversionPlan ACTIVE -> CONVERTED cascade (hop 5) is EXEMPT: the whole point of the conversion is to retire the old access, and any booking still standing on it is deliberately left in place to fail at POST /procedures/{id}/start with ERR_ACCESS_ABANDONED."
        side_effects:
          - "set access.abandoned_at = clock"
          - "cascade: every AccessConversionPlan with target_access_id == access.id AND status IN {DRAFT, ACTIVE, MATURATION_HOLD} transitions to ABANDONED"
          - "increment VascularAccess.version by 1"

      - from: DYSFUNCTIONAL
        to: ABANDONED
        trigger: "POST /vascular-accesses/{id}/status with to_status = ABANDONED"
        actor: AccessCoordinator
        preconditions:
          - "access.status == DYSFUNCTIONAL"
          - "no Procedure on this access has clinical_status IN {SCHEDULED, IN_ROOM, RECOVERY} — otherwise ERR_ACCESS_HAS_OPEN_CASE; the conversion cascade is exempt exactly as in the IN_USE -> ABANDONED row"
        side_effects:
          - "set access.abandoned_at = clock"
          - "cascade: every AccessConversionPlan with target_access_id == access.id AND status IN {DRAFT, ACTIVE, MATURATION_HOLD} transitions to ABANDONED"
          - "increment VascularAccess.version by 1"

  - entity: Procedure
    dimension: clinical_status
    shape: parallel_dimension_branching
    initial_state: SCHEDULED
    terminal_states: [DISCHARGED, ABORTED, CANCELLED]
    note: |
      Dimension 1 of 2 on the same Procedure row. clinical_status and coding_status advance
      independently: a DISCHARGED case may still be UNCODED, and an ABORTED case may still be
      coded, attested and billed. Only the DISCHARGED branch fires the five-hop discharge cascade;
      the ABORTED branch consumes devices without completing the referral.
    transitions:
      - from: SCHEDULED
        to: IN_ROOM
        trigger: "POST /procedures/{id}/start"
        actor: Interventionalist
        preconditions:
          - "procedure.clinical_status == SCHEDULED"
          - "X-User-ID == procedure.primary_operator_id"
          - "VascularAccess(procedure.access_id).status IN {MATURING, IN_USE, DYSFUNCTIONAL} — ABANDONED rejects with ERR_ACCESS_ABANDONED"
          - "when procedure.sedation_level == MODERATE: Clinician(procedure.sedation_rn_id).moderate_sedation_credentialed == true AND Clinician(procedure.sedation_rn_id).credential_expires_on >= date(clock)"
        side_effects:
          - "increment Procedure.version by 1"

      - from: IN_ROOM
        to: RECOVERY
        trigger: "POST /procedures/{id}/recovery"
        actor: Interventionalist
        preconditions:
          - "procedure.clinical_status == IN_ROOM"
          - "X-User-ID == procedure.primary_operator_id"
          - "payload sedation_end_at >= procedure.scheduled_start"
        side_effects:
          - "set procedure.sedation_end_at from the payload; this anchors the closed recovery-bay window [sedation_end_at, sedation_end_at + RECOVERY_WINDOW_MIN]"
          - "increment Procedure.version by 1"

      - from: RECOVERY
        to: DISCHARGED
        trigger: "POST /procedures/{id}/discharge"
        actor: SedationRN
        preconditions:
          - "procedure.clinical_status == RECOVERY"
          - "X-User-ID == procedure.sedation_rn_id"
          - "COUNT(RecoveryObservation where procedure_id == procedure.id) >= 2 — otherwise ERR_RECOVERY_CRITERIA_NOT_MET"
          - "the RecoveryObservation with the greatest observed_at (tie-break created_at ASC) has aldrete_score >= 9 AND on_room_air == true"
          - "(max(observed_at) - min(observed_at)) >= MIN_RECOVERY_SPAN_MIN (15) minutes, boundary inclusive"
        side_effects:
          - "cascade hop 1: set procedure.discharged_at = clock; every DeviceUsage for this procedure with state == RESERVED transitions RESERVED -> CONSUMED"
          - "cascade hop 2: Referral(procedure.referral_id) SCHEDULED -> COMPLETED"
          - "cascade hop 3 (caused by hop 2): VascularAccess(procedure.access_id) DYSFUNCTIONAL -> IN_USE, or MATURING -> IN_USE when procedure_type == FISTULA_MATURATION_INTERVENTION; intervention counters and calculations.access_intervention_burden recomputed"
          - "cascade hop 4 (caused by hop 3): every AccessConversionPlan with target_access_id == procedure.access_id AND status == ACTIVE AND readiness_met == true transitions ACTIVE -> CONVERTED"
          - "cascade hop 5 (caused by hop 4): the converted plan's from_access transitions to ABANDONED with abandoned_at = clock"
          - "run calculations.facility_partnership_score for the referral's facility (same_day_honored_window may rise)"
          - "increment Procedure.version by 1"

      - from: IN_ROOM
        to: ABORTED
        trigger: "POST /procedures/{id}/abort"
        actor: Interventionalist
        preconditions:
          - "procedure.clinical_status == IN_ROOM"
          - "X-User-ID == procedure.primary_operator_id"
        side_effects:
          - "set procedure.abort_reason from the payload"
          - "every DeviceUsage for this procedure with state == RESERVED transitions RESERVED -> CONSUMED with wasted_quantity = quantity (opened devices cannot return to stock)"
          - "Referral(procedure.referral_id) stays SCHEDULED — the branch deliberately does NOT complete the referral and does NOT touch VascularAccess.status"
          - "increment Procedure.version by 1"
        note: "Divergent branch: shares hop 1's device consumption with DISCHARGED but fires none of hops 2-5."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /procedures/{id}/cancel, or Referral SCHEDULED -> INFO_REQUESTED posture cascade (hop 4)"
        actor: AccessCoordinator | system
        preconditions:
          - "procedure.clinical_status == SCHEDULED"
        side_effects:
          - "set procedure.cancel_reason = COORDINATOR_CANCEL for the explicit call, FACILITY_POSTURE_HOLD for the cascade"
          - "compensating action: every DeviceUsage for this procedure with state == RESERVED transitions RESERVED -> RELEASED, decrementing DeviceLot.quantity_reserved by DeviceUsage.quantity and leaving DeviceLot.quantity_on_hand untouched (cascade hop 5 of the posture chain)"
          - "when the caller is AccessCoordinator and Referral(procedure.referral_id).status == SCHEDULED: revert that referral SCHEDULED -> TRIAGED so it can be rescheduled"
          - "increment Procedure.version by 1"

  - entity: Procedure
    dimension: coding_status
    shape: cyclic
    initial_state: UNCODED
    terminal_states: []
    note: |
      Dimension 2 of 2 on the same Procedure row, with a DENIED <-> REBILLED money loop.
      No coding transition reads or writes clinical_status beyond the single DISCHARGED/ABORTED
      precondition on the first code line.
    transitions:
      - from: UNCODED
        to: CODED
        trigger: "POST /procedures/{id}/codes (first line)"
        actor: Coder
        preconditions:
          - "procedure.clinical_status IN {DISCHARGED, ABORTED}"
          - "procedure.coding_status IN {UNCODED, CODED}"
          - "X-User-ID != procedure.primary_operator_id AND X-User-ID != procedure.sedation_rn_id — otherwise ERR_SEGREGATION_OF_DUTIES"
          - "no existing ProcedureCode for this procedure has the same rank — otherwise ERR_DUPLICATE_CODE_RANK"
        side_effects:
          - "create the ProcedureCode row"
          - "re-run calculations.procedure_allowed_amount over all lines; rewrite every line's is_bundled, reduction_factor_pct and allowed_cents, and procedure.allowed_amount_cents and procedure.reimbursement_variant"
          - "increment Procedure.version by 1"

      - from: CODED
        to: CODED
        trigger: "POST /procedures/{id}/codes (subsequent lines)"
        actor: Coder
        preconditions:
          - "procedure.coding_status == CODED"
          - "X-User-ID != procedure.primary_operator_id AND X-User-ID != procedure.sedation_rn_id"
          - "no existing ProcedureCode for this procedure has the same rank"
        side_effects:
          - "create the ProcedureCode row and re-run calculations.procedure_allowed_amount over all lines"
          - "increment Procedure.version by 1"

      - from: CODED
        to: ATTESTED
        trigger: "POST /procedures/{id}/attest"
        actor: Interventionalist
        preconditions:
          - "procedure.coding_status == CODED"
          - "X-User-ID == procedure.primary_operator_id — otherwise ERR_ATTESTATION_NOT_OPERATOR"
          - "the payload supporting_reading_id names a SurveillanceReading whose access_id == procedure.access_id AND whose reading_at is within [procedure.scheduled_start - MEDICAL_NECESSITY_LOOKBACK_DAYS (30) days, procedure.scheduled_start] — otherwise ERR_MEDICAL_NECESSITY_UNSUPPORTED"
        side_effects:
          - "set procedure.medical_necessity_statement, procedure.attested_by_id = X-User-ID, procedure.supporting_reading_id"
          - "increment Procedure.version by 1"

      - from: ATTESTED
        to: BILLED
        trigger: "POST /procedures/{id}/bill"
        actor: CenterAdmin
        preconditions:
          - "procedure.coding_status == ATTESTED"
          - "every ProcedureCode line with is_bundled == false and code_family IN {ANGIOPLASTY, THROMBECTOMY, CATH_EXCHANGE} has a CONSUMED DeviceUsage of the family's required device_type per validations priority 31 — otherwise ERR_CODE_DEVICE_MISMATCH"
          - "procedure.allowed_amount_cents <= SESSION_CAP_CENTS (480000) — otherwise ERR_SESSION_CAP_EXCEEDED"
        side_effects:
          - "set procedure.billed_amount_cents = procedure.allowed_amount_cents, procedure.denied_amount_cents = 0, procedure.net_receivable_cents = procedure.billed_amount_cents"
          - "increment Procedure.version by 1"

      - from: BILLED
        to: DENIED
        trigger: "POST /procedures/{id}/deny"
        actor: CenterAdmin
        preconditions:
          - "procedure.coding_status IN {BILLED, REBILLED}"
        side_effects:
          - "set procedure.denial_reason and procedure.denial_code from the payload"
          - "set procedure.denied_amount_cents = procedure.billed_amount_cents and procedure.net_receivable_cents = 0"
          - "increment Procedure.version by 1"

      - from: REBILLED
        to: DENIED
        trigger: "POST /procedures/{id}/deny"
        actor: CenterAdmin
        preconditions:
          - "procedure.coding_status IN {BILLED, REBILLED}"
        side_effects:
          - "set procedure.denial_reason and procedure.denial_code from the payload"
          - "set procedure.denied_amount_cents = procedure.billed_amount_cents and procedure.net_receivable_cents = 0"
          - "increment Procedure.version by 1"

      - from: DENIED
        to: REBILLED
        trigger: "POST /procedures/{id}/rebill"
        actor: CenterAdmin
        preconditions:
          - "procedure.coding_status == DENIED"
          - "procedure.rebill_count < MAX_REBILLS (2) — otherwise ERR_REBILL_LIMIT_REACHED"
        side_effects:
          - "compensating action: re-run calculations.procedure_allowed_amount over the unchanged line set, set procedure.billed_amount_cents = procedure.allowed_amount_cents, procedure.denied_amount_cents = 0, procedure.net_receivable_cents = procedure.billed_amount_cents"
          - "increment procedure.rebill_count by 1"
          - "increment Procedure.version by 1"
        note: "Closes the DENIED <-> REBILLED loop; the money invariant must return to its pre-denial value with zero drift."

  - entity: AccessConversionPlan
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [CONVERTED, ABANDONED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /access-conversion-plans/{id}/activate"
        actor: AccessCoordinator
        preconditions:
          - "plan.status == DRAFT"
          - "plan.target_access_id != null"
          - "VascularAccess(plan.target_access_id).status IN {PLANNED, PLACED, MATURING} — otherwise ERR_TARGET_ACCESS_NOT_CONVERTIBLE"
          - "VascularAccess(plan.from_access_id).access_type == TUNNELED_CATHETER OR VascularAccess(plan.from_access_id).intervention_burden_score >= CONVERSION_BURDEN_MIN (4) — otherwise ERR_CONVERSION_NOT_INDICATED"
        side_effects:
          - "set VascularAccess(plan.target_access_id).predecessor_access_id = plan.from_access_id"
          - "increment AccessConversionPlan.version by 1"
          - "increment VascularAccess.version by 1 on the target access"

      - from: ACTIVE
        to: MATURATION_HOLD
        trigger: "POST /access-conversion-plans/{id}/maturation-checks whose readiness evaluation fails"
        actor: Interventionalist
        preconditions:
          - "plan.status == ACTIVE"
          - "calculations.maturation_readiness returns ready == false"
        side_effects:
          - "increment plan.maturation_check_count by 1; write last_check_at, last_diameter_mm, last_flow_ml_min, last_depth_mm, days_since_placement"
          - "set plan.readiness_met = false and plan.readiness_failure_reasons to the sorted list of failed criterion names"
          - "increment AccessConversionPlan.version by 1"

      - from: MATURATION_HOLD
        to: ACTIVE
        trigger: "POST /access-conversion-plans/{id}/maturation-checks whose readiness evaluation passes while the target access is not yet IN_USE"
        actor: Interventionalist
        preconditions:
          - "plan.status == MATURATION_HOLD"
          - "calculations.maturation_readiness returns ready == true"
          - "VascularAccess(plan.target_access_id).status != IN_USE"
        side_effects:
          - "increment plan.maturation_check_count by 1; write the check measurements"
          - "set plan.readiness_met = true and plan.readiness_failure_reasons = []"
          - "increment AccessConversionPlan.version by 1"
        note: |
          Closes the ACTIVE <-> MATURATION_HOLD re-check loop. There is deliberately NO
          ACTIVE -> ACTIVE and no MATURATION_HOLD -> MATURATION_HOLD self-loop: a plan reaches
          readiness_met == true only by passing a check while in MATURATION_HOLD, so every plan
          that converts has traversed at least one failing check followed by a passing one.

      - from: ACTIVE
        to: CONVERTED
        trigger: "VascularAccess(target) -> IN_USE (cascade hop 4 of the discharge chain, or the manual MATURING -> IN_USE transition)"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "plan.readiness_met == true"
          - "VascularAccess(plan.target_access_id).status just became IN_USE in this request"
        side_effects:
          - "set plan.converted_at = clock"
          - "cascade hop 5: VascularAccess(plan.from_access_id) -> ABANDONED with abandoned_at = clock"
          - "increment AccessConversionPlan.version by 1"

      - from: MATURATION_HOLD
        to: ABANDONED
        trigger: "VascularAccess(target) -> ABANDONED cascade"
        actor: system
        preconditions:
          - "plan.status IN {DRAFT, ACTIVE, MATURATION_HOLD}"
          - "VascularAccess(plan.target_access_id).status just became ABANDONED in this request"
        side_effects:
          - "increment AccessConversionPlan.version by 1"

      - from: ACTIVE
        to: ABANDONED
        trigger: "VascularAccess(target) -> ABANDONED cascade"
        actor: system
        preconditions:
          - "plan.status IN {DRAFT, ACTIVE, MATURATION_HOLD}"
          - "VascularAccess(plan.target_access_id).status just became ABANDONED in this request"
        side_effects:
          - "increment AccessConversionPlan.version by 1"

      - from: DRAFT
        to: ABANDONED
        trigger: "POST /access-conversion-plans creating a newer plan on the same from_access_id (supersede), or VascularAccess(target) -> ABANDONED cascade"
        actor: system
        preconditions:
          - "plan.status == DRAFT"
          - "either a newly created AccessConversionPlan has the same from_access_id, or VascularAccess(plan.target_access_id).status just became ABANDONED in this request"
        side_effects:
          - "increment AccessConversionPlan.version by 1"
        note: "Supersede path is what makes concurrency_rules.conversion-plan-create-stale-access a true race rather than a state precondition."

  - entity: DeviceLot
    shape: cyclic
    initial_state: AVAILABLE
    terminal_states: [EXPIRED, DEPLETED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /device-lots/{id}/quarantine"
        actor: CenterAdmin
        preconditions:
          - "lot.status == AVAILABLE"
        side_effects:
          - "set lot.quarantine_reason from the payload"
          - "every DeviceUsage on this lot with state == RESERVED transitions RESERVED -> RELEASED, decrementing lot.quantity_reserved by DeviceUsage.quantity"
          - "increment DeviceLot.version by 1"

      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /device-lots/{id}/release"
        actor: CenterAdmin
        preconditions:
          - "lot.status == QUARANTINED"
          - "lot.expires_on >= date(clock) — a lapsed lot cannot be released back, ERR_DEVICE_LOT_EXPIRED"
        side_effects:
          - "retain lot.quarantine_reason for audit"
          - "increment DeviceLot.version by 1"
        note: "Closes the AVAILABLE <-> QUARANTINED loop."

      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /_ops/expiry-sweep"
        actor: CenterAdmin
        preconditions:
          - "lot.status IN {AVAILABLE, QUARANTINED}"
          - "lot.expires_on < date(clock)"
        side_effects:
          - "every DeviceUsage on this lot with state == RESERVED transitions RESERVED -> RELEASED, decrementing lot.quantity_reserved"
          - "increment DeviceLot.version by 1"

      - from: QUARANTINED
        to: EXPIRED
        trigger: "POST /_ops/expiry-sweep"
        actor: CenterAdmin
        preconditions:
          - "lot.status IN {AVAILABLE, QUARANTINED}"
          - "lot.expires_on < date(clock)"
        side_effects:
          - "every DeviceUsage on this lot with state == RESERVED transitions RESERVED -> RELEASED, decrementing lot.quantity_reserved"
          - "increment DeviceLot.version by 1"

      - from: AVAILABLE
        to: DEPLETED
        trigger: "DeviceUsage RESERVED -> CONSUMED (discharge or abort) that drives quantity_on_hand to 0"
        actor: system
        preconditions:
          - "lot.status == AVAILABLE"
          - "lot.quantity_on_hand == 0 after the consumption is applied"
        side_effects:
          - "increment DeviceLot.version by 1"

  - entity: DeviceUsage
    shape: branching
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /procedures/{id}/discharge or POST /procedures/{id}/abort"
        actor: system
        preconditions:
          - "usage.state == RESERVED"
        side_effects:
          - "set usage.consumed_at = clock; on the abort branch also set usage.wasted_quantity = usage.quantity"
          - "decrement DeviceLot.quantity_on_hand by usage.quantity AND decrement DeviceLot.quantity_reserved by usage.quantity"
          - "when DeviceLot.quantity_on_hand reaches 0: DeviceLot AVAILABLE -> DEPLETED"
          - "increment DeviceUsage.version and DeviceLot.version by 1"

      - from: RESERVED
        to: RELEASED
        trigger: "POST /procedures/{id}/cancel, POST /device-lots/{id}/quarantine, POST /_ops/expiry-sweep, or the facility-posture cascade"
        actor: system
        preconditions:
          - "usage.state == RESERVED"
        side_effects:
          - "set usage.released_at = clock"
          - "decrement DeviceLot.quantity_reserved by usage.quantity; DeviceLot.quantity_on_hand is untouched"
          - "increment DeviceUsage.version and DeviceLot.version by 1"

  - entity: DialysisFacility
    dimension: contract_status
    shape: compound
    initial_state: ACTIVE
    terminal_states: []
    note: "contract_status is a pure function of partnership_score (calculations.facility_partnership_score step 9); it is never set directly by any endpoint."
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "any scoring evaluation whose resulting partnership_score lands in [50, 69]"
        actor: system
        preconditions:
          - "facility.contract_status == ACTIVE"
          - "the freshly computed partnership_score is >= 50 AND <= 69"
        side_effects:
          - "cascade hop 3: every Referral of this facility with status IN {SUBMITTED, TRIAGED} transitions to INFO_REQUESTED with hold_reason = FACILITY_POSTURE_HOLD"
          - "increment DialysisFacility.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "any scoring evaluation whose resulting partnership_score is <= 49"
        actor: system
        preconditions:
          - "facility.contract_status IN {ACTIVE, PROBATION}"
          - "the freshly computed partnership_score is <= 49"
        side_effects:
          - "cascade hop 3: every Referral of this facility with status IN {SUBMITTED, TRIAGED, SCHEDULED} transitions to INFO_REQUESTED with hold_reason = FACILITY_POSTURE_HOLD"
          - "cascade hop 4 (caused by hop 3): every Procedure whose referral was just held and whose clinical_status == SCHEDULED transitions SCHEDULED -> CANCELLED with cancel_reason = FACILITY_POSTURE_HOLD"
          - "cascade hop 5 (caused by hop 4): every DeviceUsage on those cancelled procedures with state == RESERVED transitions RESERVED -> RELEASED, decrementing DeviceLot.quantity_reserved"
          - "increment DialysisFacility.version by 1"

      - from: PROBATION
        to: SUSPENDED
        trigger: "any scoring evaluation whose resulting partnership_score is <= 49"
        actor: system
        preconditions:
          - "facility.contract_status IN {ACTIVE, PROBATION}"
          - "the freshly computed partnership_score is <= 49"
        side_effects:
          - "same hop 3 / hop 4 / hop 5 chain as ACTIVE -> SUSPENDED"
          - "increment DialysisFacility.version by 1"

      - from: PROBATION
        to: ACTIVE
        trigger: "any scoring evaluation whose resulting partnership_score is >= 70"
        actor: system
        preconditions:
          - "facility.contract_status IN {PROBATION, SUSPENDED}"
          - "the freshly computed partnership_score is >= 70"
        side_effects:
          - "no referral cascade — held referrals are NOT auto-released; the facility must resubmit them"
          - "increment DialysisFacility.version by 1"

      - from: SUSPENDED
        to: PROBATION
        trigger: "any scoring evaluation whose resulting partnership_score lands in [50, 69]"
        actor: system
        preconditions:
          - "facility.contract_status == SUSPENDED"
          - "the freshly computed partnership_score is >= 50 AND <= 69"
        side_effects:
          - "no referral cascade"
          - "increment DialysisFacility.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "any scoring evaluation whose resulting partnership_score is >= 70"
        actor: system
        preconditions:
          - "facility.contract_status IN {PROBATION, SUSPENDED}"
          - "the freshly computed partnership_score is >= 70"
        side_effects:
          - "no referral cascade"
          - "increment DialysisFacility.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: procedure-create-stale-referral
    parent_entity: Referral
    write_endpoint: "POST /procedures"
    occ_field: "expected_referral_version"
    description: |
      Creating a Procedure against a Referral whose version has advanced since the client last
      observed it is rejected. A TRIAGED referral legitimately keeps changing: POST
      /referrals/{id}/missed-treatments overwrites missed_treatment_count and rescores the
      referring facility, and the facility-posture cascade can push the very same referral to
      INFO_REQUESTED, so a booking built on a stale view of the referral would schedule against a
      superseded missed-treatment burden or against a referral that is no longer bookable.
    error_id: ERR_STALE_REFERRAL_VERSION
    http_status: 412

  - rule_id: device-usage-stale-lot
    parent_entity: DeviceLot
    write_endpoint: "POST /procedures/{id}/device-usages"
    occ_field: "expected_device_lot_version"
    description: |
      Reserving units against a DeviceLot whose version has advanced since the client last
      observed it is rejected. Another reservation, a quarantine, a release or an expiry sweep
      legitimately changes the lot's available headroom, so a reservation computed from a stale
      quantity_on_hand / quantity_reserved pair would over-commit the lot.
    error_id: ERR_STALE_DEVICE_LOT_VERSION
    http_status: 412

  - rule_id: conversion-plan-create-stale-access
    parent_entity: VascularAccess
    write_endpoint: "POST /access-conversion-plans"
    occ_field: "expected_access_version"
    description: |
      Creating an AccessConversionPlan against a from_access whose version has advanced since the
      client last observed it is rejected. A newer plan legitimately supersedes any earlier DRAFT
      plan on the same from_access, and the access's own status may have moved to DYSFUNCTIONAL or
      ABANDONED, so planning from a stale access view would retire the wrong access.
    error_id: ERR_STALE_ACCESS_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: referral_triage_score
    trigger: "state_machines.Referral SUBMITTED -> TRIAGED (POST /referrals/{id}/triage); writes referral.triage_score, referral.triage_variant and referral.urgency"
    algorithm: weighted_scoring
    formula: |
      # Input set: SurveillanceReading rows where access_id == referral.access_id
      #            AND reading_at >= clock - TRIAGE_LOOKBACK_DAYS days
      #            AND reading_at <= clock
      # Ordering:  reading_at ASC, tie-break created_at ASC. `latest` is the last element,
      #            `prev` the element immediately before it. Never ordered by id.
      qualifying = that ordered list
      if len(qualifying) == 0: reject with ERR_INSUFFICIENT_SURVEILLANCE
      if len(qualifying) >= 2:
          variant = TREND_BASED
          flow_drop_pct = (prev.access_flow_ml_min - latest.access_flow_ml_min)
                          / prev.access_flow_ml_min * 100        # may be negative when flow improved
          trend_points = min(40, max(0, round_half_up(flow_drop_pct * TREND_WEIGHT)))
          level_points = 25 if latest.access_flow_ml_min < FLOW_CRITICAL_ML_MIN
                         else (12 if latest.access_flow_ml_min < FLOW_LOW_ML_MIN else 0)
      else:
          variant = ABSOLUTE_BASED
          trend_points = 0
          level_points = 40 if latest.access_flow_ml_min < FLOW_CRITICAL_ML_MIN
                         else (20 if latest.access_flow_ml_min < FLOW_LOW_ML_MIN else 0)
      pressure_points = 15 if latest.venous_pressure_mmhg >= VP_HIGH_MMHG else 0
      recirc_points   = 10 if latest.recirculation_pct >= RECIRC_HIGH_PCT else 0
      missed_points   = min(MISSED_POINTS_CAP, MISSED_POINTS_PER * referral.missed_treatment_count)
      triage_score = min(100, trend_points + level_points + pressure_points
                              + recirc_points + missed_points)
      urgency = SAME_DAY if triage_score >= SAME_DAY_SCORE_MIN
                else (NEXT_DAY if triage_score >= NEXT_DAY_SCORE_MIN else ROUTINE)
    input_set: "SurveillanceReading rows for the referral's access with reading_at inside the closed window [clock - 21 days, clock]; readings on other accesses and readings outside the window are excluded regardless of kind"
    constants:
      TRIAGE_LOOKBACK_DAYS: 21
      TREND_WEIGHT: 1.2
      FLOW_CRITICAL_ML_MIN: 600
      FLOW_LOW_ML_MIN: 800
      VP_HIGH_MMHG: 150
      RECIRC_HIGH_PCT: 10.0
      MISSED_POINTS_PER: 6
      MISSED_POINTS_CAP: 18
      SAME_DAY_SCORE_MIN: 70
      NEXT_DAY_SCORE_MIN: 45
    precision: "triage_score is an integer 0..100; the only rounding is round_half_up on trend_points before the min(40, ...) clamp"
    variants:
      - name: trend_based
        when: "two or more qualifying readings exist in the 21-day window"
        difference: "adds a flow-decline trend component worth up to 40 points and softens the absolute-level component to 25/12; the score therefore reacts to the delta between the two most recent readings"
      - name: absolute_based
        when: "exactly one qualifying reading exists in the 21-day window"
        difference: "no trend component at all and a doubled absolute-level component of 40/20; identical latest-reading values yield a different score and can yield a different urgency band than trend_based"

  - name: procedure_allowed_amount
    trigger: "every POST /procedures/{id}/codes, and again on state_machines.Procedure DENIED -> REBILLED; writes ProcedureCode.is_bundled, ProcedureCode.reduction_factor_pct, ProcedureCode.allowed_cents, Procedure.allowed_amount_cents and Procedure.reimbursement_variant"
    algorithm: tiered_pricing
    formula: |
      # Input set: every ProcedureCode with procedure_id == procedure.id, ordered by
      #            rank ASC (rank is unique per procedure_id, so no tie is possible;
      #            the declared tie-break is created_at ASC). Never ordered by id.
      variant = BUNDLED_ESRD if Patient(...).payer_program == BUNDLED_ESRD else FEE_FOR_SERVICE
      primary = the line with the smallest rank
      mod_factor(line) = 0.50 if line.modifier == M52 else 1.00
      position_factor(i) = 100 if i == 1 else (SECONDARY_REDUCTION_PCT if i == 2
                                               else TERTIARY_REDUCTION_PCT)     # percent
      for i, line in enumerate(ordered_lines, start=1):
          if variant == BUNDLED_ESRD and i > 1
             and line.modifier != M59
             and (line.code_family == primary.code_family or line.code_family == IMAGING):
              line.is_bundled = true
              line.reduction_factor_pct = 0
              line.allowed_cents = 0
          else:
              line.is_bundled = false
              line.reduction_factor_pct = position_factor(i)
              # ROUNDING ORDER IS PINNED: round each line to whole cents FIRST, then sum.
              line.allowed_cents = round_half_up(line.base_allowed_cents
                                                 * mod_factor(line)
                                                 * line.reduction_factor_pct / 100)
      procedure.allowed_amount_cents = SUM(line.allowed_cents for all lines)
      procedure.reimbursement_variant = variant
      # The rejected alternative — sum the unrounded per-line products and round once at the
      # end — is explicitly NOT used. For base amounts 180050 / 45075 / 90050 with modifier
      # NONE under FEE_FOR_SERVICE the pinned order yields 225101 while sum-then-round yields
      # 225100; the scaffold requires 225101.
    input_set: "all ProcedureCode rows of the procedure regardless of is_bundled; no status filter applies because ProcedureCode has no lifecycle state. Lines are never deleted, so a rebill recomputes over the identical set."
    constants:
      SECONDARY_REDUCTION_PCT: 50
      TERTIARY_REDUCTION_PCT: 25
      M52_FACTOR: 0.50
      SESSION_CAP_CENTS: 480000
    precision: "whole cents; round_half_up applied per line BEFORE summation, never after"
    variants:
      - name: bundled_esrd
        when: "Patient(procedure -> referral -> access -> patient).payer_program == BUNDLED_ESRD"
        difference: "every non-primary line whose code_family equals the primary line's family, or whose family is IMAGING, collapses to allowed_cents = 0 with is_bundled = true unless it carries modifier M59; only distinct-family lines survive and they still take the rank-based reduction"
      - name: fee_for_service
        when: "Patient(...).payer_program == FEE_FOR_SERVICE"
        difference: "no line is ever bundled; every line is paid at base x modifier x rank-based reduction, so the same three code lines yield 225101 cents here versus 180050 cents under bundled_esrd"

  - name: facility_partnership_score
    trigger: "POST /referrals, POST /referrals/{id}/triage, POST /referrals/{id}/decline, POST /referrals/{id}/missed-treatments and POST /procedures/{id}/discharge; writes DialysisFacility.partnership_score, partnership_tier, contract_status, referral_volume_window, raw_missed_count_window, grace_credit_window, adjusted_missed_count_window, same_day_honored_window and last_scored_at"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. grace_credit depends on the tier, the tier depends on the
      # score, and the score depends on grace_credit. The cycle is broken by reading the tier
      # that the PREVIOUS evaluation persisted:
      tier_at_eval = facility.partnership_tier as currently stored, read BEFORE any write
      # Step A - window membership (identical filter for both aggregates):
      window_referrals = Referral where referring_facility_id == facility.id
                         AND status IN {SUBMITTED, INFO_REQUESTED, TRIAGED, SCHEDULED, COMPLETED}
                         AND created_at >= clock - PARTNERSHIP_WINDOW_DAYS days   # inclusive
                         AND created_at <= clock                                  # inclusive
                         # DECLINED referrals are excluded, so declining a referral raises the score
      raw_missed_count_window = SUM(r.missed_treatment_count for r in window_referrals)
      referral_volume_window  = COUNT(window_referrals)
      # Step B - grace credit from the PERSISTED tier:
      grace_credit_window = floor(referral_volume_window * GRACE_RATE_BY_TIER[tier_at_eval])
      adjusted_missed_count_window = max(0, raw_missed_count_window - grace_credit_window)
      # Step C - same-day honoring bonus:
      same_day_honored_window = COUNT(Procedure p where
          Referral(p.referral_id) in window_referrals
          AND p.clinical_status == DISCHARGED
          AND Referral(p.referral_id).urgency == SAME_DAY
          AND date(p.scheduled_start) == date(Referral(p.referral_id).triaged_at))
      # Step D - score, then tier, then posture, in this order:
      partnership_score = clamp(0, 100, 100 - MISSED_PENALTY_POINTS * adjusted_missed_count_window
                                            + SAME_DAY_HONORED_BONUS * same_day_honored_window)
      partnership_tier  = GOLD if partnership_score >= GOLD_SCORE_MIN
                          else (SILVER if partnership_score >= SILVER_SCORE_MIN else WATCH)
      contract_status   = ACTIVE     if partnership_score >= PROBATION_SCORE_MAX + 1
                          else (PROBATION if partnership_score >= SUSPENSION_SCORE_MAX + 1
                                else SUSPENDED)
      last_scored_at = clock
      # Single pass only: the referral / procedure / device cascades that a posture drop fires
      # do NOT re-trigger this calculation inside the same request, even though they change
      # referral statuses that the Step A filter reads.
    input_set: "Referral rows of the facility inside the closed 90-day window whose status is not DECLINED, plus their DISCHARGED procedures for the same-day bonus"
    constants:
      PARTNERSHIP_WINDOW_DAYS: 90
      GRACE_RATE_BY_TIER: { GOLD: 0.20, SILVER: 0.10, WATCH: 0.00 }
      MISSED_PENALTY_POINTS: 4
      SAME_DAY_HONORED_BONUS: 3
      GOLD_SCORE_MIN: 85
      SILVER_SCORE_MIN: 70
      PROBATION_SCORE_MAX: 69
      SUSPENSION_SCORE_MAX: 49
    precision: "partnership_score is an integer 0..100; grace_credit_window uses floor, never round"
    variants: []

  - name: sedation_staffing_capacity
    trigger: "POST /procedures, evaluated before the booking is persisted; gates the create with ERR_ROOM_DAILY_CAP_REACHED, ERR_SEDATION_CAPACITY_EXCEEDED or ERR_RECOVERY_BAY_UNAVAILABLE"
    algorithm: threshold
    formula: |
      # Three independent headrooms combined by a nested min/max, with a conditional surge term.
      booked_cases_today = COUNT(Procedure where room_id == candidate.room_id
          AND date(scheduled_start) == date(candidate.scheduled_start)
          AND clinical_status IN {SCHEDULED, IN_ROOM, RECOVERY, DISCHARGED})   # ABORTED and CANCELLED excluded
      surge = SURGE_ALLOWANCE if (Referral(candidate.referral_id).urgency == SAME_DAY
                                  AND ProcedureRoom(candidate.room_id).room_type == ANGIO_SUITE
                                  AND hour_utc(candidate.scheduled_start) < SURGE_CUTOFF_HOUR_UTC)
              else 0
      room_headroom = ProcedureRoom(candidate.room_id).daily_case_cap + surge - booked_cases_today
      overlapping_sedation = COUNT(Procedure where sedation_rn_id == candidate.sedation_rn_id
          AND sedation_level == MODERATE
          AND clinical_status IN {SCHEDULED, IN_ROOM, RECOVERY}
          AND half_open_overlap([scheduled_start, scheduled_end),
                                [candidate.scheduled_start, candidate.scheduled_end)))
      rn_headroom = Clinician(candidate.sedation_rn_id).max_concurrent_sedation_cases
                    - overlapping_sedation
      recovery_cases = COUNT(Procedure where room_id == candidate.room_id
          AND sedation_level == MODERATE
          AND clinical_status IN {SCHEDULED, IN_ROOM, RECOVERY}
          AND closed_overlap([scheduled_end, scheduled_end + RECOVERY_WINDOW_MIN minutes],
                             [candidate.scheduled_end,
                              candidate.scheduled_end + RECOVERY_WINDOW_MIN minutes]))
      bay_headroom = floor(ProcedureRoom(candidate.room_id).recovery_bay_count
                           / RECOVERY_BAYS_PER_CASE) - recovery_cases
      effective_capacity = max(0, min(room_headroom, rn_headroom, bay_headroom))
      # GATE ORDER IS PINNED: room_headroom first, then rn_headroom, then bay_headroom.
      # A candidate whose sedation_level == NONE skips rn_headroom and bay_headroom entirely
      # (both are treated as +infinity) but still consumes room_headroom.
    input_set: "non-cancelled, non-aborted procedures in the same room on the same calendar day for the room cap; MODERATE sedation procedures in {SCHEDULED, IN_ROOM, RECOVERY} for the RN and bay aggregates"
    constants:
      SURGE_ALLOWANCE: 1
      SURGE_CUTOFF_HOUR_UTC: 15
      RECOVERY_WINDOW_MIN: 90
      RECOVERY_BAYS_PER_CASE: 1
    precision: "integer case counts; floor on the bay division"
    variants: []

  - name: maturation_readiness
    trigger: "POST /access-conversion-plans/{id}/maturation-checks; decides whether the plan goes to MATURATION_HOLD or stays/returns to ACTIVE, and writes plan.readiness_met, plan.readiness_failure_reasons and plan.days_since_placement"
    algorithm: threshold
    formula: |
      target = VascularAccess(plan.target_access_id)
      days_since_placement = (date(clock) - target.placed_on) in whole days
      reading_count = COUNT(SurveillanceReading where access_id == target.id
                            AND reading_at <= clock)
      failures = []
      if not (payload.diameter_mm  >= MIN_DIAMETER_MM):      failures.append("DIAMETER")
      if not (payload.flow_ml_min  >= MIN_FLOW_ML_MIN):      failures.append("FLOW")
      if not (payload.depth_mm     <= MAX_DEPTH_MM):         failures.append("DEPTH")
      if not (days_since_placement >= MIN_DAYS_SINCE_PLACEMENT): failures.append("MATURATION_DAYS")
      if not (reading_count        >= MIN_READINGS):         failures.append("SURVEILLANCE_COUNT")
      readiness_met = (len(failures) == 0)
      readiness_failure_reasons = sorted(failures)     # ASCII ascending, deterministic
      # All four numeric comparisons are inclusive at the boundary: diameter 6.0, flow 600,
      # depth 6.0 and day 42 all PASS; 5.9 / 599 / 6.1 / day 41 all FAIL.
    input_set: "the payload measurements of this single check plus every SurveillanceReading on the target access with reading_at <= clock; earlier checks on the same plan are not re-read"
    constants:
      MIN_DIAMETER_MM: 6.0
      MIN_FLOW_ML_MIN: 600
      MAX_DEPTH_MM: 6.0
      MIN_DAYS_SINCE_PLACEMENT: 42
      MIN_READINGS: 2
    precision: "diameter and depth compared at one decimal place; days is a whole-day difference of calendar dates, not a rounded hour count"
    variants: []

  - name: device_lot_allocation
    trigger: "POST /procedures/{id}/device-allocations; selects lots and creates the DeviceUsage rows"
    algorithm: waterfall_allocation
    formula: |
      # Eligibility filter (the candidate set):
      candidates = DeviceLot where device_type == payload.device_type
                   AND status == AVAILABLE
                   AND expires_on > date(procedure.scheduled_start)      # STRICTLY after
                   AND (quantity_on_hand - quantity_reserved) > 0
      # Ranking expression, then tie-break, then fallback:
      order candidates by expires_on ASC, then created_at ASC        # FEFO; `id` is never read
      if candidates is empty: reject with ERR_NO_ELIGIBLE_LOT and reserve nothing
      total_available = SUM(quantity_on_hand - quantity_reserved for candidates)
      if total_available < payload.quantity:
          reject with ERR_INSUFFICIENT_DEVICE_STOCK and reserve nothing   # all-or-nothing
      remaining = payload.quantity
      for lot in ordered candidates:
          take = min(remaining, lot.quantity_on_hand - lot.quantity_reserved)
          if take > 0:
              create DeviceUsage(procedure_id, lot.id, quantity = take, state = RESERVED)
              lot.quantity_reserved += take          # quantity_on_hand untouched until consumption
              lot.version += 1
              remaining -= take
          if remaining == 0: break
      # The created DeviceUsage rows are returned in the same FEFO order.
    input_set: "DeviceLot rows of the requested device_type with status == AVAILABLE, unexpired relative to the case date, and with strictly positive headroom; QUARANTINED, EXPIRED and DEPLETED lots are excluded even when quantity_on_hand > 0"
    constants:
      EXPIRY_ELIGIBILITY: "expires_on > date(procedure.scheduled_start)"
    precision: "integer units; no partial units"
    variants: []

  - name: infection_attribution
    trigger: "POST /infection-events; writes InfectionEvent.days_post_procedure and InfectionEvent.attributable, then propagates to the access"
    algorithm: threshold
    formula: |
      procedure = Procedure(event.procedure_id)
      # Preconditions elsewhere guarantee procedure.clinical_status == DISCHARGED,
      # so procedure.discharged_at is non-null.
      elapsed_seconds = (event.onset_at - procedure.discharged_at) in seconds
      days_post_procedure = floor(elapsed_seconds / 86400)
      attributable = (days_post_procedure >= 0
                      AND days_post_procedure <= ATTRIBUTION_WINDOW_DAYS)
      # Boundary: exactly 30 whole days -> attributable == true; 31 -> false.
      if attributable:
          VascularAccess(event.access_id).attributable_infection_count += 1
          recompute calculations.access_intervention_burden for that access
          if VascularAccess(event.access_id).attributable_infection_count
             >= INFECTION_DYSFUNCTION_THRESHOLD
             AND VascularAccess(event.access_id).status == IN_USE:
              transition that access IN_USE -> DYSFUNCTIONAL
    input_set: "the single index procedure named by procedure_id; other procedures on the same access are ignored"
    constants:
      ATTRIBUTION_WINDOW_DAYS: 30
      INFECTION_DYSFUNCTION_THRESHOLD: 2
    precision: "days_post_procedure is a floored whole-day count of elapsed seconds, so 29 days 23 hours is 29"
    variants: []

  - name: access_intervention_burden
    trigger: "recomputed on every VascularAccess counter update — i.e. on the discharge cascade hop 3 and on an attributable InfectionEvent; writes VascularAccess.intervention_burden_score"
    algorithm: weighted_scoring
    formula: |
      intervention_burden_score =
            W_ANGIOPLASTY   * access.angioplasty_count
          + W_THROMBECTOMY  * access.thrombectomy_count
          + W_CATH_EXCHANGE * access.catheter_exchange_count
          + W_MATURATION    * access.maturation_intervention_count
          + W_INFECTION     * access.attributable_infection_count
      # Gate: POST /access-conversion-plans/{id}/activate requires
      #   from_access.access_type == TUNNELED_CATHETER
      #   OR from_access.intervention_burden_score >= CONVERSION_BURDEN_MIN
      # with CONVERSION_BURDEN_MIN inclusive: a burden of exactly 4 passes, 3 fails.
    input_set: "the four DISCHARGED-procedure counters and the attributable-infection counter already persisted on the access; procedures in SCHEDULED / IN_ROOM / RECOVERY / ABORTED / CANCELLED never contribute"
    constants:
      W_ANGIOPLASTY: 2
      W_THROMBECTOMY: 3
      W_CATH_EXCHANGE: 1
      W_MATURATION: 1
      W_INFECTION: 5
      CONVERSION_BURDEN_MIN: 4
    precision: "integer score, no rounding"
    variants: []

  - name: facility_missed_treatment_metrics
    trigger: "GET /dialysis-facilities/{id}/partnership-metrics — a pure read that recomputes nothing and persists nothing"
    algorithm: aggregation
    formula: |
      # Reads the persisted window aggregates and derives two integer-scaled rates from
      # them. Both wire fields are INTEGERS (see §1.5) so no floating point crosses the
      # boundary: the missed rate is scaled by 100, the honor rate is a whole percent.
      referral_volume_window = facility.referral_volume_window
      raw_missed_count_window = facility.raw_missed_count_window
      missed_treatments_per_referral_x100 = 0 if referral_volume_window == 0
          else round_half_up(raw_missed_count_window * 100 / referral_volume_window, 0)
      same_day_honor_rate_pct = 0 if same_day_referral_count == 0
          else round_half_up(facility.same_day_honored_window * 100
                             / same_day_referral_count, 0)
      where same_day_referral_count = COUNT(Referral r where
              r.referring_facility_id == facility.id
              AND r.status IN {SUBMITTED, INFO_REQUESTED, TRIAGED, SCHEDULED, COMPLETED}
              AND r.created_at >= clock - 90 days AND r.created_at <= clock
              AND r.urgency == SAME_DAY)
      # window_start = clock - 90 days and window_end = clock, both echoed as ISO-8601
      # instants so the caller can see exactly which referrals were in scope.
      # Empty-set boundary: a facility with zero in-window referrals reports 0 for both
      # rates rather than dividing by zero or omitting the keys.
    input_set: "the facility's persisted window aggregates plus the in-window non-DECLINED referrals whose urgency == SAME_DAY"
    constants:
      PARTNERSHIP_WINDOW_DAYS: 90
    precision: "both rates are integers: the missed rate is per-referral scaled by 100 (round_half_up at the unit), the honor rate is a whole percent (round_half_up at the unit); 0 for either rate when its denominator is zero"
    variants: []

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the first failing row decides the response, so a request that violates
#     several rows always returns the lowest-priority-number error)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id embedded in the path resolves to a live row, validated left-to-right"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_ACCESS_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_PROCEDURE_NOT_FOUND | ERR_DEVICE_LOT_NOT_FOUND | ERR_DEVICE_USAGE_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_INFECTION_EVENT_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: business_constraint
    check: "request body shape: every required field present, enum values inside the declared member set, integers within their declared domains, dates well-formed YYYY-MM-DD, datetimes well-formed ISO 8601 UTC, and scheduled_end strictly after scheduled_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every POST endpoint"

  - priority: 5
    category: existence
    check: "every foreign-key id supplied in the body resolves to a live row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_ACCESS_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_DEVICE_LOT_NOT_FOUND | ERR_READING_NOT_FOUND"
    http_status: 404
    applies_to: "every POST endpoint that accepts a foreign key in the body"

  - priority: 6
    category: business_referential
    check: "facility scope: when X-User-Role == FacilityCoordinator, X-User-ID must equal the referring_facility_id / reported_by_facility_id in the body, or the referring_facility_id of the referral named in the path"
    error_id: ERR_FACILITY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /referrals, POST /referrals/{id}/resubmit, POST /referrals/{id}/missed-treatments, POST /surveillance-readings, GET /referrals/{id}, GET /dialysis-facilities/{id}, GET /dialysis-facilities/{id}/partnership-metrics"

  - priority: 7
    category: business_referential
    check: "clinician role fit and assignment: primary_operator_id must name a Clinician with clinician_role == INTERVENTIONALIST; sedation_rn_id must name a Clinician with clinician_role == SEDATION_RN; and on start / recovery / abort the acting X-User-ID must equal procedure.primary_operator_id, while on discharge and recovery-observations it must equal procedure.sedation_rn_id. Attestation is deliberately NOT listed here: the operator-identity check on POST /procedures/{id}/attest belongs to priority 14 and reports ERR_ATTESTATION_NOT_OPERATOR, so the two rules never compete for the same request"
    error_id: "ERR_CLINICIAN_ROLE_MISMATCH | ERR_NOT_ASSIGNED_CLINICIAN"
    http_status: "422 | 403"
    applies_to: "POST /procedures, POST /procedures/{id}/start, POST /procedures/{id}/recovery, POST /procedures/{id}/abort, POST /procedures/{id}/recovery-observations, POST /procedures/{id}/discharge"

  - priority: 8
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2 (referral TRIAGED before scheduling, procedure SCHEDULED before start, RECOVERY before discharge, coding_status ATTESTED before billing, plan DRAFT before activation, lot AVAILABLE before quarantine, and so on)"
    error_id: "ERR_REFERRAL_NOT_TRIAGED | ERR_REFERRAL_STATE_INVALID | ERR_PROCEDURE_NOT_SCHEDULED | ERR_PROCEDURE_NOT_IN_ROOM | ERR_PROCEDURE_NOT_IN_RECOVERY | ERR_PROCEDURE_TERMINAL | ERR_CODING_STATE_INVALID | ERR_PLAN_STATE_INVALID | ERR_DEVICE_LOT_STATE_INVALID | ERR_ACCESS_TRANSITION_NOT_ALLOWED"
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 9
    category: state
    check: "optimistic concurrency: the supplied expected_*_version equals the parent row's current version (see §1.2.1)"
    error_id: "ERR_STALE_REFERRAL_VERSION | ERR_STALE_DEVICE_LOT_VERSION | ERR_STALE_ACCESS_VERSION"
    http_status: 412
    applies_to: "POST /procedures, POST /procedures/{id}/device-usages, POST /access-conversion-plans"

  - priority: 10
    category: business_safety
    check: "moderate-sedation credentialing: when sedation_level == MODERATE the named sedation RN has moderate_sedation_credentialed == true AND credential_expires_on >= date(clock); the same check re-runs at start time against the clock of that request"
    error_id: ERR_SEDATION_CREDENTIAL_INVALID
    http_status: 422
    applies_to: "POST /procedures, POST /procedures/{id}/start"

  - priority: 11
    category: business_safety
    check: "device lot posture: the named lot has status == AVAILABLE and expires_on strictly after date(procedure.scheduled_start)"
    error_id: "ERR_DEVICE_LOT_QUARANTINED | ERR_DEVICE_LOT_EXPIRED"
    http_status: 422
    applies_to: "POST /procedures/{id}/device-usages, POST /device-lots/{id}/release"

  - priority: 12
    category: business_safety
    check: "recovery discharge criteria: at least two RecoveryObservation rows, latest by observed_at has aldrete_score >= 9 and on_room_air == true, and the span between the earliest and latest observed_at is at least MIN_RECOVERY_SPAN_MIN (15) minutes, boundary inclusive"
    error_id: ERR_RECOVERY_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /procedures/{id}/discharge"

  - priority: 13
    category: business_safety
    check: "the procedure's access is not ABANDONED when the case is brought into the room"
    error_id: ERR_ACCESS_ABANDONED
    http_status: 409
    applies_to: "POST /procedures/{id}/start"

  - priority: 14
    category: business_safety
    check: "segregation of duties: the coding clinician is neither the primary operator nor the sedation RN of the procedure being coded, and the medical-necessity attestation is filed by exactly the primary operator"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_ATTESTATION_NOT_OPERATOR"
    http_status: 403
    applies_to: "POST /procedures/{id}/codes, POST /procedures/{id}/attest"

  - priority: 15
    category: business_safety
    check: "medical necessity support: supporting_reading_id names a SurveillanceReading on the procedure's own access whose reading_at falls inside [scheduled_start - 30 days, scheduled_start]"
    error_id: ERR_MEDICAL_NECESSITY_UNSUPPORTED
    http_status: 422
    applies_to: "POST /procedures/{id}/attest"

  - priority: 16
    category: business_temporal
    check: "scheduled_start >= clock at booking time"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "POST /procedures"

  - priority: 17
    category: business_temporal
    check: "same-day urgency window: when the referral's urgency == SAME_DAY, date(scheduled_start) must equal date(referral.triaged_at); when urgency == NEXT_DAY it must be within one calendar day after date(referral.triaged_at)"
    error_id: ERR_SAME_DAY_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /procedures"

  - priority: 18
    category: business_temporal
    check: "room occupancy, pairwise with turnover buffer: the candidate's [scheduled_start, scheduled_end + turnover_buffer_min) must not intersect any existing non-cancelled, non-aborted booking's [scheduled_start, scheduled_end + turnover_buffer_min) in the same room; adjacency is legal exactly when candidate.scheduled_start >= existing.scheduled_end + turnover_buffer_min"
    error_id: ERR_ROOM_OCCUPIED
    http_status: 409
    applies_to: "POST /procedures"

  - priority: 19
    category: business_temporal
    check: "room daily case cap, evaluated as the first of the three headrooms in calculations.sedation_staffing_capacity: daily_case_cap + surge - booked_cases_today must be >= 1, where surge is 1 only for a SAME_DAY referral booked into an ANGIO_SUITE before 15:00 UTC"
    error_id: ERR_ROOM_DAILY_CAP_REACHED
    http_status: 409
    applies_to: "POST /procedures"

  - priority: 20
    category: business_temporal
    check: "sedation RN aggregate concurrency, unbuffered half-open intervals: the count of MODERATE-sedation procedures in {SCHEDULED, IN_ROOM, RECOVERY} assigned to the same sedation RN whose [scheduled_start, scheduled_end) intersects the candidate's must remain strictly below Clinician.max_concurrent_sedation_cases; this is an aggregate-cardinality rule, not pairwise exclusion, so overlaps are legal until the ceiling is reached"
    error_id: ERR_SEDATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /procedures"

  - priority: 21
    category: business_temporal
    check: "recovery bay capacity, fully closed intervals: the count of MODERATE-sedation procedures in the same room whose [scheduled_end, scheduled_end + 90 min] closed window intersects the candidate's closed window must remain strictly below recovery_bay_count; because both endpoints are inclusive, two cases whose windows merely touch DO collide"
    error_id: ERR_RECOVERY_BAY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /procedures"

  - priority: 22
    category: business_constraint
    check: "the referring facility's contract_status is ACTIVE or PROBATION at triage time"
    error_id: ERR_FACILITY_SUSPENDED
    http_status: 409
    applies_to: "POST /referrals/{id}/triage"

  - priority: 23
    category: business_constraint
    check: "at least one SurveillanceReading exists on the referral's access with reading_at <= clock"
    error_id: ERR_INSUFFICIENT_SURVEILLANCE
    http_status: 422
    applies_to: "POST /referrals/{id}/triage"

  - priority: 24
    category: business_constraint
    check: "rank uniqueness within a procedure's code lines"
    error_id: ERR_DUPLICATE_CODE_RANK
    http_status: 409
    applies_to: "POST /procedures/{id}/codes"

  - priority: 25
    category: business_constraint
    check: "scalar uniqueness: DialysisFacility.facility_code, Patient.mrn, Clinician.npi, ProcedureRoom.room_code and the (DeviceLot.device_type, DeviceLot.lot_number) pair"
    error_id: "ERR_DUPLICATE_FACILITY_CODE | ERR_DUPLICATE_MRN | ERR_DUPLICATE_NPI | ERR_DUPLICATE_ROOM_CODE | ERR_DUPLICATE_LOT_NUMBER"
    http_status: 409
    applies_to: "POST /dialysis-facilities, POST /patients, POST /clinicians, POST /procedure-rooms, POST /device-lots"

  - priority: 26
    category: business_constraint
    check: "conversion indication: the plan's from_access is a TUNNELED_CATHETER, or its intervention_burden_score is >= CONVERSION_BURDEN_MIN (4)"
    error_id: ERR_CONVERSION_NOT_INDICATED
    http_status: 422
    applies_to: "POST /access-conversion-plans/{id}/activate"

  - priority: 27
    category: business_constraint
    check: "target access convertibility: plan.target_access_id is not null and that access's status is in {PLANNED, PLACED, MATURING}"
    error_id: ERR_TARGET_ACCESS_NOT_CONVERTIBLE
    http_status: 409
    applies_to: "POST /access-conversion-plans/{id}/activate, POST /access-conversion-plans/{id}/maturation-checks"

  - priority: 28
    category: business_constraint
    check: "no Procedure on the access has clinical_status in {SCHEDULED, IN_ROOM, RECOVERY} when the access is being abandoned"
    error_id: ERR_ACCESS_HAS_OPEN_CASE
    http_status: 409
    applies_to: "POST /vascular-accesses/{id}/status with to_status = ABANDONED"

  - priority: 29
    category: business_constraint
    check: "rebill_count < MAX_REBILLS (2) before a rebill is accepted"
    error_id: ERR_REBILL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /procedures/{id}/rebill"

  - priority: 30
    category: business_constraint
    check: "device stock: for an explicit reservation the named lot's (quantity_on_hand - quantity_reserved) >= requested quantity; for a FEFO allocation the candidate set is non-empty and its aggregate headroom covers the request, all-or-nothing"
    error_id: "ERR_LOT_DEPLETED | ERR_INSUFFICIENT_DEVICE_STOCK | ERR_NO_ELIGIBLE_LOT"
    http_status: "409 | 409 | 422"
    applies_to: "POST /procedures/{id}/device-usages, POST /procedures/{id}/device-allocations"

  - priority: 31
    category: business_referential
    check: "code-to-device consistency at billing: every non-bundled ProcedureCode whose code_family is ANGIOPLASTY, THROMBECTOMY or CATH_EXCHANGE requires at least one CONSUMED DeviceUsage on the procedure drawn from a lot whose device_type is the family's required consumable (ANGIOPLASTY -> BALLOON, THROMBECTOMY -> SHEATH, CATH_EXCHANGE -> SHEATH)"
    error_id: ERR_CODE_DEVICE_MISMATCH
    http_status: 422
    applies_to: "POST /procedures/{id}/bill"

  - priority: 32
    category: business_fiscal
    check: "procedure.allowed_amount_cents <= SESSION_CAP_CENTS (480000)"
    error_id: ERR_SESSION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /procedures/{id}/bill"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
#     api_prefix is "" — every collection below is a top-level peer path.
#     A trailing `?` on an input field marks it optional.
# ---------------------------------------------------------------------------
endpoints:

  # --- logical clock and operational sweep ---------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [CenterAdmin]
    input: [to_iso8601]
    output: { current_utc: string }
    description: "test-driving endpoint that sets the logical clock every subsequent request reads as `clock`. The server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time, and it never advances on its own."
    side_effects:
      - "sets the logical clock to to_iso8601; the response echoes it as current_utc"

  - method: POST
    path: /_ops/expiry-sweep
    roles: [CenterAdmin]
    input: []
    output: "{ expired_lot_ids: string[], released_usage_ids: string[], expired_count: integer, released_count: integer }"
    side_effects:
      - "every DeviceLot with status IN {AVAILABLE, QUARANTINED} and expires_on < date(clock) transitions to EXPIRED"
      - "every RESERVED DeviceUsage on a swept lot transitions RESERVED -> RELEASED, decrementing that lot's quantity_reserved and leaving quantity_on_hand untouched"
      - "expired_lot_ids and released_usage_ids are ordered by the lots' expires_on ASC then created_at ASC; the sweep is idempotent because an EXPIRED lot is no longer in the input set"

  # --- DialysisFacility ----------------------------------------------------
  - method: POST
    path: /dialysis-facilities
    roles: [CenterAdmin]
    input: [name, facility_code]
    output: DialysisFacility
    side_effects:
      - "contract_status = ACTIVE, partnership_tier = SILVER, partnership_score = 100, all window counters 0, last_scored_at = null, version = 1"

  - method: GET
    path: /dialysis-facilities/{id}
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator, Interventionalist, SedationRN, Coder]
    input: []
    output: DialysisFacility

  - method: GET
    path: /dialysis-facilities/{id}/patients
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator]
    input: ["dialysis_modality?", "payer_program?", "limit?", "offset?"]
    output: Patient[]
    side_effects:
      - "reverse-reachability list for Patient.dialysis_facility_id; ordered by created_at ASC"

  - method: GET
    path: /dialysis-facilities/{id}/surveillance-readings
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator]
    input: ["kind?", "limit?", "offset?"]
    output: SurveillanceReading[]
    side_effects:
      - "reverse-reachability list for SurveillanceReading.reported_by_facility_id; ordered by reading_at ASC then created_at ASC"

  - method: GET
    path: /dialysis-facilities/{id}/partnership-metrics
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator]
    input: []
    output: { facility_id: string, partnership_score: integer, partnership_tier: string, contract_status: string, referral_volume_window: integer, raw_missed_count_window: integer, grace_credit_window: integer, adjusted_missed_count_window: integer, same_day_honored_window: integer, missed_treatments_per_referral_x100: integer, same_day_honor_rate_pct: integer, window_start: string, window_end: string }
    side_effects:
      - "pure read: runs calculations.facility_missed_treatment_metrics over the current 90-day window and persists nothing, so two consecutive calls with an unchanged clock return byte-identical bodies"

  # --- Patient -------------------------------------------------------------
  - method: POST
    path: /patients
    roles: [CenterAdmin, AccessCoordinator]
    input: [mrn, full_name, dialysis_facility_id, dialysis_modality, payer_program]
    output: Patient
    side_effects:
      - "access_count = 0, version = 1"

  - method: GET
    path: /patients/{id}
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator, Interventionalist, SedationRN, Coder]
    input: []
    output: Patient

  # --- Clinician -----------------------------------------------------------
  - method: POST
    path: /clinicians
    roles: [CenterAdmin]
    input: [full_name, clinician_role, npi, credential_expires_on, "moderate_sedation_credentialed?", "max_concurrent_sedation_cases?"]
    output: Clinician
    side_effects:
      - "moderate_sedation_credentialed defaults to false and max_concurrent_sedation_cases to 2 when omitted"

  - method: GET
    path: /clinicians/{id}
    roles: [CenterAdmin, AccessCoordinator, Interventionalist, SedationRN, Coder]
    input: []
    output: Clinician

  # --- ProcedureRoom -------------------------------------------------------
  - method: POST
    path: /procedure-rooms
    roles: [CenterAdmin]
    input: [room_code, room_type, "turnover_buffer_min?", "daily_case_cap?", "recovery_bay_count?"]
    output: ProcedureRoom
    side_effects:
      - "turnover_buffer_min defaults to 30, daily_case_cap to 6, recovery_bay_count to 3 when omitted"

  - method: GET
    path: /procedure-rooms/{id}
    roles: [CenterAdmin, AccessCoordinator, Interventionalist, SedationRN]
    input: []
    output: ProcedureRoom

  # --- DeviceLot -----------------------------------------------------------
  - method: POST
    path: /device-lots
    roles: [CenterAdmin]
    input: [device_type, catalog_code, lot_number, expires_on, received_quantity, unit_cost_cents]
    output: DeviceLot
    side_effects:
      - "quantity_on_hand = received_quantity, quantity_reserved = 0, status = AVAILABLE, quarantine_reason = null; received_quantity is never mutated again and anchors the device-unit conservation invariant"

  - method: POST
    path: /device-lots/{id}/quarantine
    roles: [CenterAdmin]
    input: [quarantine_reason]
    output: DeviceLot
    side_effects:
      - "DeviceLot AVAILABLE -> QUARANTINED"
      - "every RESERVED DeviceUsage on this lot transitions RESERVED -> RELEASED and quantity_reserved is decremented by each released quantity; quantity_on_hand is untouched"

  - method: POST
    path: /device-lots/{id}/release
    roles: [CenterAdmin]
    input: []
    output: DeviceLot
    side_effects:
      - "DeviceLot QUARANTINED -> AVAILABLE; rejects with ERR_DEVICE_LOT_EXPIRED when expires_on < date(clock); quarantine_reason is retained for audit rather than cleared"

  - method: GET
    path: /device-lots/{id}
    roles: [CenterAdmin, AccessCoordinator, Interventionalist]
    input: []
    output: DeviceLot

  - method: GET
    path: /device-lots
    roles: [CenterAdmin, AccessCoordinator, Interventionalist]
    input: ["device_type?", "status?", "limit?", "offset?"]
    output: DeviceLot[]
    side_effects:
      - "ordered by expires_on ASC then created_at ASC — the same FEFO order calculations.device_lot_allocation walks"

  # --- VascularAccess ------------------------------------------------------
  - method: POST
    path: /vascular-accesses
    roles: [CenterAdmin, AccessCoordinator]
    input: [patient_id, access_type, laterality, site, placed_on, "predecessor_access_id?"]
    output: VascularAccess
    side_effects:
      - "status = PLANNED, every intervention counter 0, intervention_burden_score 0, abandoned_at null"
      - "increment Patient.access_count by 1"

  - method: POST
    path: /vascular-accesses/{id}/status
    roles: [CenterAdmin, AccessCoordinator]
    input: [to_status]
    output: VascularAccess
    side_effects:
      - "drives the state_machines.VascularAccess transition named by to_status; illegal pairs reject with ERR_ACCESS_TRANSITION_NOT_ALLOWED"
      - "to_status = IN_USE from MATURING may fire AccessConversionPlan ACTIVE -> CONVERTED and then the from_access -> ABANDONED cascade"
      - "to_status = ABANDONED sets abandoned_at = clock, decrements Patient.access_count, and cascades every plan whose target_access_id is this access to ABANDONED; rejects with ERR_ACCESS_HAS_OPEN_CASE while any Procedure on the access is in {SCHEDULED, IN_ROOM, RECOVERY}"

  - method: GET
    path: /vascular-accesses/{id}
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator, Interventionalist, SedationRN, Coder]
    input: []
    output: VascularAccess

  - method: GET
    path: /vascular-accesses
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator, Interventionalist]
    input: ["patient_id?", "access_type?", "status?", "predecessor_access_id?", "limit?", "offset?"]
    output: VascularAccess[]
    side_effects:
      - "reverse-reachability list for VascularAccess.patient_id and the self-referential VascularAccess.predecessor_access_id; ordered by created_at ASC"

  - method: GET
    path: /vascular-accesses/{id}/surveillance-readings
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator, Interventionalist]
    input: ["kind?", "limit?", "offset?"]
    output: SurveillanceReading[]
    side_effects:
      - "reverse-reachability list for SurveillanceReading.access_id; ordered by reading_at ASC then created_at ASC, which is exactly the order calculations.referral_triage_score reads to pick latest and previous"

  # --- SurveillanceReading (immutable, common_fields: false) ---------------
  - method: POST
    path: /surveillance-readings
    roles: [FacilityCoordinator, AccessCoordinator, CenterAdmin]
    input: [access_id, reported_by_facility_id, reading_at, access_flow_ml_min, venous_pressure_mmhg, recirculation_pct, kind]
    output: SurveillanceReading
    side_effects:
      - "immutable record: the response carries id and created_at but no version field, and no endpoint mutates a reading after creation"
      - "a FacilityCoordinator whose X-User-ID differs from reported_by_facility_id is rejected with ERR_FACILITY_SCOPE_VIOLATION"

  - method: GET
    path: /surveillance-readings/{id}
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator, Interventionalist, Coder]
    input: []
    output: SurveillanceReading

  # --- Referral ------------------------------------------------------------
  - method: POST
    path: /referrals
    roles: [FacilityCoordinator, AccessCoordinator, CenterAdmin]
    input: [access_id, referring_facility_id, suspected_problem, clinical_narrative, "missed_treatment_count?"]
    output: Referral
    side_effects:
      - "status = SUBMITTED, info_request_count = 0, triage_score / triage_variant / urgency / triaged_at / hold_reason / decline_reason all null"
      - "missed_treatment_count defaults to 0 when omitted"
      - "runs calculations.facility_partnership_score for referring_facility_id, which can itself drop contract_status and fire the posture cascade in the same request"

  - method: POST
    path: /referrals/{id}/request-info
    roles: [AccessCoordinator, CenterAdmin]
    input: ["info_request_note?"]
    output: Referral
    side_effects:
      - "Referral SUBMITTED -> INFO_REQUESTED with hold_reason = COORDINATOR_REQUEST and info_request_count incremented"

  - method: POST
    path: /referrals/{id}/resubmit
    roles: [FacilityCoordinator]
    input: [clinical_narrative, "missed_treatment_count?"]
    output: Referral
    side_effects:
      - "Referral INFO_REQUESTED -> SUBMITTED, overwriting clinical_narrative and (when supplied) missed_treatment_count"
      - "clears hold_reason, triage_score, triage_variant, urgency and triaged_at so the referral must be re-triaged from scratch; info_request_count is deliberately NOT decremented"

  - method: POST
    path: /referrals/{id}/triage
    roles: [AccessCoordinator, CenterAdmin]
    input: []
    output: Referral
    side_effects:
      - "Referral SUBMITTED -> TRIAGED; runs calculations.referral_triage_score and writes triage_score, triage_variant, urgency and triaged_at = clock"
      - "the variant is selected by the data, not the caller: TREND_BASED whenever at least two readings on the access precede the clock, ABSOLUTE_BASED otherwise"
      - "when suspected_problem IN {STENOSIS, THROMBOSIS, CATHETER_DYSFUNCTION} and the access is IN_USE, that access transitions IN_USE -> DYSFUNCTIONAL in the same request"
      - "runs calculations.facility_partnership_score for the referring facility (single pass, reading the tier persisted by the previous evaluation)"

  - method: POST
    path: /referrals/{id}/decline
    roles: [AccessCoordinator, CenterAdmin]
    input: [decline_reason]
    output: Referral
    side_effects:
      - "Referral {SUBMITTED, INFO_REQUESTED} -> DECLINED, a terminal state"
      - "the declined referral leaves the missed-treatment window, so re-running calculations.facility_partnership_score can raise the score and lift the facility's posture"

  - method: POST
    path: /referrals/{id}/missed-treatments
    roles: [FacilityCoordinator, AccessCoordinator, CenterAdmin]
    input: [missed_treatment_count]
    output: Referral
    side_effects:
      - "overwrites referral.missed_treatment_count with the supplied absolute value (not a delta)"
      - "cascade hop 1: re-runs calculations.facility_partnership_score for the referring facility"
      - "cascade hop 2: the recomputed score may drive DialysisFacility ACTIVE -> PROBATION or ACTIVE -> SUSPENDED"
      - "cascade hop 3: on that posture drop, every referral of the facility in {SUBMITTED, TRIAGED, SCHEDULED} moves to INFO_REQUESTED with hold_reason = FACILITY_POSTURE_HOLD"
      - "cascade hop 4: every SCHEDULED Procedure under those referrals moves to CANCELLED with cancel_reason = FACILITY_POSTURE_HOLD"
      - "cascade hop 5: every RESERVED DeviceUsage on those cancelled procedures moves to RELEASED, restoring DeviceLot.quantity_reserved"

  - method: GET
    path: /referrals/{id}
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator, Interventionalist, Coder]
    input: []
    output: Referral

  - method: GET
    path: /referrals
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator, Interventionalist]
    input: ["access_id?", "referring_facility_id?", "status?", "urgency?", "limit?", "offset?"]
    output: Referral[]
    side_effects:
      - "reverse-reachability list for Referral.access_id and Referral.referring_facility_id; ordered by created_at ASC"

  # --- Procedure: booking --------------------------------------------------
  - method: POST
    path: /procedures
    roles: [AccessCoordinator, CenterAdmin]
    input: [referral_id, room_id, primary_operator_id, procedure_type, sedation_level, scheduled_start, scheduled_end, expected_referral_version, "sedation_rn_id?"]
    output: Procedure
    side_effects:
      - "OCC: expected_referral_version must equal Referral.version, otherwise ERR_STALE_REFERRAL_VERSION (412) — see §1.2.1 procedure-create-stale-referral"
      - "access_id is copied verbatim from the referral and is never re-derived, even if the referral is later resubmitted against a different access"
      - "clinical_status = SCHEDULED, coding_status = UNCODED, every money field 0, rebill_count 0"
      - "sedation_rn_id is required when sedation_level == MODERATE and ignored when sedation_level == NONE"
      - "runs calculations.sedation_staffing_capacity: room daily cap with the conditional ANGIO_SUITE surge allowance, the sedation RN's aggregate overlap ceiling, and the closed-interval recovery-bay window"
      - "Referral TRIAGED -> SCHEDULED as a system side effect in the same request; Referral.version increments, so a second booking must resend the new version"

  - method: POST
    path: /procedures/{id}/cancel
    roles: [AccessCoordinator, CenterAdmin]
    input: ["cancel_note?"]
    output: Procedure
    side_effects:
      - "Procedure SCHEDULED -> CANCELLED with cancel_reason = COORDINATOR_CANCEL"
      - "compensating action: every RESERVED DeviceUsage on the procedure moves to RELEASED, decrementing DeviceLot.quantity_reserved and leaving quantity_on_hand untouched, so the device-unit invariant holds with zero drift"
      - "the parent referral reverts SCHEDULED -> TRIAGED so it can be rebooked"

  # --- Procedure: device reservation --------------------------------------
  - method: POST
    path: /procedures/{id}/device-usages
    roles: [Interventionalist, AccessCoordinator, CenterAdmin]
    input: [device_lot_id, quantity, expected_device_lot_version]
    output: DeviceUsage
    side_effects:
      - "OCC: expected_device_lot_version must equal DeviceLot.version, otherwise ERR_STALE_DEVICE_LOT_VERSION (412) — see §1.2.1 device-usage-stale-lot"
      - "explicit single-lot reservation: state = RESERVED, DeviceLot.quantity_reserved += quantity, quantity_on_hand untouched, DeviceLot.version incremented"
      - "the lot must be AVAILABLE and unexpired relative to date(procedure.scheduled_start); headroom (quantity_on_hand - quantity_reserved) must be >= quantity, boundary inclusive"

  - method: POST
    path: /procedures/{id}/device-allocations
    roles: [Interventionalist, AccessCoordinator, CenterAdmin]
    input: [device_type, quantity]
    output: DeviceUsage[]
    side_effects:
      - "server-side FEFO waterfall per calculations.device_lot_allocation: candidate lots ordered by expires_on ASC then created_at ASC, each filled to its headroom before the next is touched"
      - "all-or-nothing: if aggregate headroom is short the call reserves nothing and returns ERR_INSUFFICIENT_DEVICE_STOCK; if the candidate set is empty it returns ERR_NO_ELIGIBLE_LOT"
      - "no expected_device_lot_version is accepted here because the server, not the caller, chooses the lots"

  - method: GET
    path: /device-usages/{id}
    roles: [CenterAdmin, AccessCoordinator, Interventionalist, Coder]
    input: []
    output: DeviceUsage

  - method: GET
    path: /device-usages
    roles: [CenterAdmin, AccessCoordinator, Interventionalist, Coder]
    input: ["procedure_id?", "device_lot_id?", "state?", "limit?", "offset?"]
    output: DeviceUsage[]
    side_effects:
      - "reverse-reachability list for DeviceUsage.procedure_id and DeviceUsage.device_lot_id; ordered by created_at ASC"

  # --- Procedure: clinical dimension --------------------------------------
  - method: POST
    path: /procedures/{id}/start
    roles: [Interventionalist]
    input: []
    output: Procedure
    side_effects:
      - "Procedure SCHEDULED -> IN_ROOM; the acting X-User-ID must be procedure.primary_operator_id"
      - "re-checks the sedation credential against the clock of this request, so a booking that was legal yesterday can fail today with ERR_SEDATION_CREDENTIAL_INVALID"
      - "rejects with ERR_ACCESS_ABANDONED when the procedure's access reached ABANDONED after the booking was made"

  - method: POST
    path: /procedures/{id}/recovery
    roles: [Interventionalist]
    input: [sedation_end_at]
    output: Procedure
    side_effects:
      - "Procedure IN_ROOM -> RECOVERY; sets sedation_end_at, which anchors the closed recovery-bay window [sedation_end_at, sedation_end_at + 90 min]"

  - method: POST
    path: /procedures/{id}/recovery-observations
    roles: [SedationRN]
    input: [observed_at, aldrete_score, on_room_air]
    output: RecoveryObservation
    side_effects:
      - "immutable record: no version field and no update endpoint; the acting X-User-ID must be procedure.sedation_rn_id"

  - method: POST
    path: /procedures/{id}/discharge
    roles: [SedationRN]
    input: []
    output: Procedure
    side_effects:
      - "Procedure RECOVERY -> DISCHARGED once the recovery criteria hold: >= 2 observations, latest by observed_at with aldrete_score >= 9 and on_room_air true, and a span of at least 15 minutes between earliest and latest observed_at"
      - "hop 1: discharged_at = clock; every RESERVED DeviceUsage -> CONSUMED, decrementing both quantity_on_hand and quantity_reserved, and any lot reaching quantity_on_hand 0 goes AVAILABLE -> DEPLETED"
      - "hop 2: the parent Referral SCHEDULED -> COMPLETED with completed_at = clock"
      - "hop 3: the access moves DYSFUNCTIONAL -> IN_USE (or MATURING -> IN_USE for a FISTULA_MATURATION_INTERVENTION); its intervention counter increments and calculations.access_intervention_burden is recomputed"
      - "hop 4: every ACTIVE AccessConversionPlan whose target_access_id is that access and whose readiness_met is true moves ACTIVE -> CONVERTED with converted_at = clock"
      - "hop 5: each converted plan's from_access moves to ABANDONED with abandoned_at = clock, decrementing Patient.access_count"
      - "runs calculations.facility_partnership_score, which may raise same_day_honored_window and lift the facility posture"

  - method: POST
    path: /procedures/{id}/abort
    roles: [Interventionalist]
    input: [abort_reason]
    output: Procedure
    side_effects:
      - "Procedure IN_ROOM -> ABORTED; shares hop 1's device consumption but with wasted_quantity = quantity on every consumed usage"
      - "fires NONE of hops 2-5: the referral stays SCHEDULED, the access keeps its status and counters, no plan converts and no from_access is abandoned"

  # --- Procedure: coding dimension ----------------------------------------
  - method: POST
    path: /procedures/{id}/codes
    roles: [Coder]
    input: [hcpcs_code, code_family, base_allowed_cents, rank, "modifier?"]
    output: ProcedureCode
    side_effects:
      - "requires clinical_status IN {DISCHARGED, ABORTED}; coding_status UNCODED -> CODED on the first line and CODED -> CODED on subsequent lines"
      - "segregation of duties: the acting X-User-ID must be neither primary_operator_id nor sedation_rn_id, otherwise ERR_SEGREGATION_OF_DUTIES"
      - "re-runs calculations.procedure_allowed_amount over the whole line set, rewriting every line's is_bundled, reduction_factor_pct and allowed_cents plus procedure.allowed_amount_cents and procedure.reimbursement_variant"
      - "the variant is chosen from Patient.payer_program, so an identical line set produces a different allowed_amount_cents for a BUNDLED_ESRD patient than for a FEE_FOR_SERVICE one"
      - "modifier defaults to NONE when omitted"

  - method: POST
    path: /procedures/{id}/attest
    roles: [Interventionalist]
    input: [medical_necessity_statement, supporting_reading_id]
    output: Procedure
    side_effects:
      - "coding_status CODED -> ATTESTED; sets attested_by_id = X-User-ID and supporting_reading_id"
      - "only the primary operator may attest (ERR_ATTESTATION_NOT_OPERATOR), and the cited reading must be on this procedure's own access inside the 30-day lookback ending at scheduled_start (ERR_MEDICAL_NECESSITY_UNSUPPORTED)"

  - method: POST
    path: /procedures/{id}/bill
    roles: [CenterAdmin]
    input: []
    output: Procedure
    side_effects:
      - "coding_status ATTESTED -> BILLED; billed_amount_cents = allowed_amount_cents, denied_amount_cents = 0, net_receivable_cents = billed_amount_cents"
      - "checks code-to-device consistency (ERR_CODE_DEVICE_MISMATCH, priority 31) strictly before the session cap (ERR_SESSION_CAP_EXCEEDED, priority 32)"

  - method: POST
    path: /procedures/{id}/deny
    roles: [CenterAdmin]
    input: [denial_reason, denial_code]
    output: Procedure
    side_effects:
      - "coding_status {BILLED, REBILLED} -> DENIED; denied_amount_cents = billed_amount_cents and net_receivable_cents = 0"

  - method: POST
    path: /procedures/{id}/rebill
    roles: [CenterAdmin]
    input: []
    output: Procedure
    side_effects:
      - "coding_status DENIED -> REBILLED, closing the money loop; re-runs calculations.procedure_allowed_amount over the unchanged line set and restores billed_amount_cents, denied_amount_cents = 0 and net_receivable_cents to their pre-denial values with zero drift"
      - "rebill_count increments and is capped at 2 (ERR_REBILL_LIMIT_REACHED)"

  - method: GET
    path: /procedures/{id}
    roles: [CenterAdmin, AccessCoordinator, FacilityCoordinator, Interventionalist, SedationRN, Coder]
    input: []
    output: Procedure

  - method: GET
    path: /procedures
    roles: [CenterAdmin, AccessCoordinator, Interventionalist, SedationRN, Coder]
    input: ["referral_id?", "access_id?", "room_id?", "primary_operator_id?", "sedation_rn_id?", "attested_by_id?", "supporting_reading_id?", "clinical_status?", "coding_status?", "limit?", "offset?"]
    output: Procedure[]
    side_effects:
      - "reverse-reachability list for all seven Procedure foreign keys; ordered by scheduled_start ASC then created_at ASC"

  - method: GET
    path: /procedures/{id}/codes
    roles: [CenterAdmin, AccessCoordinator, Interventionalist, Coder]
    input: ["limit?", "offset?"]
    output: ProcedureCode[]
    side_effects:
      - "reverse-reachability list for ProcedureCode.procedure_id; ordered by rank ASC"

  - method: GET
    path: /procedures/{id}/recovery-observations
    roles: [CenterAdmin, Interventionalist, SedationRN]
    input: ["limit?", "offset?"]
    output: RecoveryObservation[]
    side_effects:
      - "reverse-reachability list for RecoveryObservation.procedure_id; ordered by observed_at ASC then created_at ASC"

  - method: GET
    path: /procedures/{id}/reimbursement-preview
    roles: [CenterAdmin, Coder]
    input: []
    output: "{ procedure_id: string, applicable_variant: string, bundled_esrd_total_cents: integer, fee_for_service_total_cents: integer, variant_delta_cents: integer, line_items: object[] }"
    side_effects:
      - "pure read that evaluates BOTH variants of calculations.procedure_allowed_amount over the stored line set and persists nothing; applicable_variant echoes the patient's payer_program and variant_delta_cents is fee_for_service_total_cents - bundled_esrd_total_cents"

  # --- AccessConversionPlan ------------------------------------------------
  - method: POST
    path: /access-conversion-plans
    roles: [AccessCoordinator, CenterAdmin]
    input: [patient_id, from_access_id, target_access_type, target_conversion_date, expected_access_version, "target_access_id?"]
    output: AccessConversionPlan
    side_effects:
      - "OCC: expected_access_version must equal VascularAccess(from_access_id).version, otherwise ERR_STALE_ACCESS_VERSION (412) — see §1.2.1 conversion-plan-create-stale-access"
      - "status = DRAFT, maturation_check_count = 0, readiness_met = false, readiness_failure_reasons = []"
      - "supersede: any existing DRAFT plan on the same from_access_id transitions DRAFT -> ABANDONED, which is why a stale from_access version is a genuine lost-update rather than a state precondition"

  - method: POST
    path: /access-conversion-plans/{id}/activate
    roles: [AccessCoordinator, CenterAdmin]
    input: []
    output: AccessConversionPlan
    side_effects:
      - "AccessConversionPlan DRAFT -> ACTIVE; sets VascularAccess(target_access_id).predecessor_access_id = from_access_id and increments that access's version"
      - "requires target_access_id non-null with target status IN {PLANNED, PLACED, MATURING} (ERR_TARGET_ACCESS_NOT_CONVERTIBLE) and a from_access that is either a TUNNELED_CATHETER or carries intervention_burden_score >= 4 (ERR_CONVERSION_NOT_INDICATED)"

  - method: POST
    path: /access-conversion-plans/{id}/maturation-checks
    roles: [Interventionalist, AccessCoordinator]
    input: [diameter_mm, flow_ml_min, depth_mm]
    output: AccessConversionPlan
    side_effects:
      - "runs calculations.maturation_readiness over the payload plus the target access's readings; increments maturation_check_count and writes last_check_at = clock, last_diameter_mm, last_flow_ml_min, last_depth_mm, days_since_placement, readiness_met and readiness_failure_reasons"
      - "a failing check drives ACTIVE -> MATURATION_HOLD; a passing check drives MATURATION_HOLD -> ACTIVE, so the plan can loop between the two states any number of times"
      - "all four numeric criteria are inclusive at the boundary: diameter 6.0, flow 600, depth 6.0 and day 42 pass"

  - method: GET
    path: /access-conversion-plans/{id}
    roles: [CenterAdmin, AccessCoordinator, Interventionalist]
    input: []
    output: AccessConversionPlan

  - method: GET
    path: /access-conversion-plans
    roles: [CenterAdmin, AccessCoordinator, Interventionalist]
    input: ["patient_id?", "from_access_id?", "target_access_id?", "status?", "limit?", "offset?"]
    output: AccessConversionPlan[]
    side_effects:
      - "reverse-reachability list for AccessConversionPlan.patient_id, .from_access_id and .target_access_id; ordered by created_at ASC"

  # --- InfectionEvent ------------------------------------------------------
  - method: POST
    path: /infection-events
    roles: [Interventionalist, AccessCoordinator, CenterAdmin]
    input: [procedure_id, event_type, organism, onset_at]
    output: InfectionEvent
    side_effects:
      - "access_id is copied verbatim from the procedure; requires the procedure to be DISCHARGED so discharged_at is non-null"
      - "runs calculations.infection_attribution: days_post_procedure is a floored whole-day count and attributable is true only for 0..30 inclusive"
      - "when attributable: VascularAccess.attributable_infection_count increments, calculations.access_intervention_burden is recomputed, and at a count of 2 or more an IN_USE access transitions IN_USE -> DYSFUNCTIONAL"

  - method: GET
    path: /infection-events/{id}
    roles: [CenterAdmin, AccessCoordinator, Interventionalist]
    input: []
    output: InfectionEvent

  - method: GET
    path: /infection-events
    roles: [CenterAdmin, AccessCoordinator, Interventionalist]
    input: ["procedure_id?", "access_id?", "attributable?", "limit?", "offset?"]
    output: InfectionEvent[]
    side_effects:
      - "reverse-reachability list for InfectionEvent.procedure_id and InfectionEvent.access_id; ordered by onset_at ASC then created_at ASC"

# ---------------------------------------------------------------------------
# 1.6 Error Catalog
#     Every id below is reachable from at least one endpoint in §1.5.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "authentication headers missing or role not recognized"
    trigger: "X-User-Role or X-User-ID absent, or X-User-Role outside the six roles of §1.7"

  - id: ERR_UNAUTHORIZED
    http_status: 403
    message: "role not permitted for this operation"
    trigger: "the acting role is not in the called endpoint's roles list"

  - id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    message: "dialysis facility not found"
    trigger: "unknown facility id in a path or in referring_facility_id / reported_by_facility_id / dialysis_facility_id"

  - id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    message: "patient not found"
    trigger: "unknown patient id in a path or in patient_id"

  - id: ERR_ACCESS_NOT_FOUND
    http_status: 404
    message: "vascular access not found"
    trigger: "unknown access id in a path or in access_id / predecessor_access_id / from_access_id / target_access_id"

  - id: ERR_READING_NOT_FOUND
    http_status: 404
    message: "surveillance reading not found"
    trigger: "unknown reading id in a path or in supporting_reading_id"

  - id: ERR_REFERRAL_NOT_FOUND
    http_status: 404
    message: "referral not found"
    trigger: "unknown referral id in a path or in referral_id"

  - id: ERR_ROOM_NOT_FOUND
    http_status: 404
    message: "procedure room not found"
    trigger: "unknown room id in a path or in room_id"

  - id: ERR_CLINICIAN_NOT_FOUND
    http_status: 404
    message: "clinician not found"
    trigger: "unknown clinician id in a path or in primary_operator_id / sedation_rn_id"

  - id: ERR_PROCEDURE_NOT_FOUND
    http_status: 404
    message: "procedure not found"
    trigger: "unknown procedure id in a path or in procedure_id"

  - id: ERR_DEVICE_LOT_NOT_FOUND
    http_status: 404
    message: "device lot not found"
    trigger: "unknown lot id in a path or in device_lot_id"

  - id: ERR_DEVICE_USAGE_NOT_FOUND
    http_status: 404
    message: "device usage not found"
    trigger: "unknown usage id on GET /device-usages/{id}"

  - id: ERR_PLAN_NOT_FOUND
    http_status: 404
    message: "access conversion plan not found"
    trigger: "unknown plan id on any /access-conversion-plans/{id} path"

  - id: ERR_INFECTION_EVENT_NOT_FOUND
    http_status: 404
    message: "infection event not found"
    trigger: "unknown event id on GET /infection-events/{id}"

  - id: ERR_INVALID_REQUEST
    http_status: 422
    message: "request body failed shape validation"
    trigger: "missing required field, enum value outside the declared set, wrong scalar type, malformed date or datetime, or scheduled_end not strictly after scheduled_start"

  - id: ERR_FACILITY_SCOPE_VIOLATION
    http_status: 403
    message: "facility coordinator may only act on its own facility"
    trigger: "X-User-Role == FacilityCoordinator and X-User-ID does not match the facility named by the body or by the referral in the path"

  - id: ERR_CLINICIAN_ROLE_MISMATCH
    http_status: 422
    message: "clinician does not hold the required staffing role"
    trigger: "primary_operator_id names a non-INTERVENTIONALIST, or sedation_rn_id names a non-SEDATION_RN, on POST /procedures"

  - id: ERR_NOT_ASSIGNED_CLINICIAN
    http_status: 403
    message: "acting clinician is not the one assigned to this case"
    trigger: "X-User-ID differs from procedure.primary_operator_id on start / recovery / abort / attest, or from procedure.sedation_rn_id on recovery-observations / discharge"

  - id: ERR_REFERRAL_NOT_TRIAGED
    http_status: 409
    message: "referral must be TRIAGED before a procedure can be booked"
    trigger: "POST /procedures against a referral in SUBMITTED, INFO_REQUESTED, SCHEDULED, COMPLETED or DECLINED"

  - id: ERR_REFERRAL_STATE_INVALID
    http_status: 409
    message: "referral is not in a state that allows this transition"
    trigger: "request-info on a non-SUBMITTED referral, resubmit on a referral not in INFO_REQUESTED, triage on a non-SUBMITTED referral, or decline on a referral already TRIAGED, SCHEDULED, COMPLETED or DECLINED"

  - id: ERR_PROCEDURE_NOT_SCHEDULED
    http_status: 409
    message: "procedure is not in SCHEDULED"
    trigger: "start or cancel on a procedure whose clinical_status is not SCHEDULED"

  - id: ERR_PROCEDURE_NOT_IN_ROOM
    http_status: 409
    message: "procedure is not in IN_ROOM"
    trigger: "recovery or abort on a procedure whose clinical_status is not IN_ROOM"

  - id: ERR_PROCEDURE_NOT_IN_RECOVERY
    http_status: 409
    message: "procedure is not in RECOVERY"
    trigger: "discharge, or a recovery observation, on a procedure whose clinical_status is not RECOVERY"

  - id: ERR_PROCEDURE_TERMINAL
    http_status: 409
    message: "procedure has reached a terminal clinical state"
    trigger: "any clinical transition attempted from DISCHARGED, ABORTED or CANCELLED"

  - id: ERR_CODING_STATE_INVALID
    http_status: 409
    message: "coding state does not allow this revenue-cycle transition"
    trigger: "coding a procedure whose clinical_status is neither DISCHARGED nor ABORTED, attesting an UNCODED or already ATTESTED procedure, billing a non-ATTESTED procedure, denying a procedure that is not BILLED or REBILLED, or rebilling a procedure that is not DENIED"

  - id: ERR_PLAN_STATE_INVALID
    http_status: 409
    message: "conversion plan is not in a state that allows this transition"
    trigger: "activate on a non-DRAFT plan, or a maturation check on a plan in DRAFT, CONVERTED or ABANDONED"

  - id: ERR_DEVICE_LOT_STATE_INVALID
    http_status: 409
    message: "device lot is not in a state that allows this transition"
    trigger: "quarantine on a lot that is not AVAILABLE, or release on a lot that is not QUARANTINED"

  - id: ERR_ACCESS_TRANSITION_NOT_ALLOWED
    http_status: 409
    message: "vascular access cannot make the requested status transition"
    trigger: "POST /vascular-accesses/{id}/status with a (from, to) pair absent from state_machines.VascularAccess, including any transition out of the terminal ABANDONED state"

  - id: ERR_STALE_REFERRAL_VERSION
    http_status: 412
    message: "referral has been modified since it was read"
    trigger: "expected_referral_version does not equal Referral.version on POST /procedures"

  - id: ERR_STALE_DEVICE_LOT_VERSION
    http_status: 412
    message: "device lot has been modified since it was read"
    trigger: "expected_device_lot_version does not equal DeviceLot.version on POST /procedures/{id}/device-usages"

  - id: ERR_STALE_ACCESS_VERSION
    http_status: 412
    message: "vascular access has been modified since it was read"
    trigger: "expected_access_version does not equal VascularAccess.version on POST /access-conversion-plans"

  - id: ERR_SEDATION_CREDENTIAL_INVALID
    http_status: 422
    message: "sedation registered nurse is not validly credentialed for moderate sedation"
    trigger: "sedation_level == MODERATE and the named RN has moderate_sedation_credentialed false or credential_expires_on < date(clock), at booking or at start"

  - id: ERR_DEVICE_LOT_QUARANTINED
    http_status: 422
    message: "device lot is quarantined and cannot be reserved"
    trigger: "POST /procedures/{id}/device-usages naming a QUARANTINED lot"

  - id: ERR_DEVICE_LOT_EXPIRED
    http_status: 422
    message: "device lot has lapsed"
    trigger: "reserving from a lot whose expires_on is not strictly after the case date, or releasing a quarantined lot whose expires_on < date(clock)"

  - id: ERR_RECOVERY_CRITERIA_NOT_MET
    http_status: 422
    message: "recovery criteria for discharge are not satisfied"
    trigger: "fewer than two observations, a latest observation with aldrete_score < 9 or on_room_air false, or an observation span shorter than 15 minutes"

  - id: ERR_ACCESS_ABANDONED
    http_status: 409
    message: "vascular access has been abandoned"
    trigger: "POST /procedures/{id}/start when the case's access reached ABANDONED after booking"

  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "the clinician who performed the case may not code it"
    trigger: "POST /procedures/{id}/codes where X-User-ID equals primary_operator_id or sedation_rn_id"

  - id: ERR_ATTESTATION_NOT_OPERATOR
    http_status: 403
    message: "only the primary operator may attest medical necessity"
    trigger: "POST /procedures/{id}/attest where X-User-ID is an interventionalist other than primary_operator_id"

  - id: ERR_MEDICAL_NECESSITY_UNSUPPORTED
    http_status: 422
    message: "cited surveillance reading does not support medical necessity"
    trigger: "supporting_reading_id names a reading on another access, or one outside the 30-day window ending at scheduled_start"

  - id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    message: "scheduled start is before the current clock"
    trigger: "POST /procedures with scheduled_start < clock"

  - id: ERR_SAME_DAY_WINDOW_MISSED
    http_status: 422
    message: "booking falls outside the urgency window earned at triage"
    trigger: "a SAME_DAY referral booked on a date other than date(triaged_at), or a NEXT_DAY referral booked more than one calendar day after date(triaged_at)"

  - id: ERR_ROOM_OCCUPIED
    http_status: 409
    message: "procedure room is occupied for the requested interval"
    trigger: "the candidate's buffered interval intersects an existing non-cancelled, non-aborted booking's buffered interval in the same room"

  - id: ERR_SEDATION_CAPACITY_EXCEEDED
    http_status: 409
    message: "sedation registered nurse has no remaining concurrent capacity"
    trigger: "overlapping MODERATE sedation cases assigned to the same RN would reach max_concurrent_sedation_cases"

  - id: ERR_RECOVERY_BAY_UNAVAILABLE
    http_status: 409
    message: "no recovery bay is free for the projected recovery window"
    trigger: "the candidate's closed recovery window intersects those of recovery_bay_count other MODERATE cases in the same room, touching endpoints included"

  - id: ERR_FACILITY_SUSPENDED
    http_status: 409
    message: "referring facility is suspended"
    trigger: "POST /referrals/{id}/triage while the referring facility's contract_status is SUSPENDED"

  - id: ERR_INSUFFICIENT_SURVEILLANCE
    http_status: 422
    message: "no surveillance reading exists for this access"
    trigger: "POST /referrals/{id}/triage with zero readings on the referral's access at or before the clock"

  - id: ERR_ROOM_DAILY_CAP_REACHED
    http_status: 409
    message: "procedure room has no remaining capacity for that calendar day"
    trigger: "the room's non-cancelled case count for the day already equals daily_case_cap, or daily_case_cap + 1 when the ANGIO_SUITE same-day surge allowance applies"

  - id: ERR_DUPLICATE_CODE_RANK
    http_status: 409
    message: "a code line with that rank already exists on the procedure"
    trigger: "POST /procedures/{id}/codes reusing an existing rank"

  - id: ERR_DUPLICATE_FACILITY_CODE
    http_status: 409
    message: "facility_code already in use"
    trigger: "POST /dialysis-facilities with an existing facility_code"

  - id: ERR_DUPLICATE_MRN
    http_status: 409
    message: "mrn already in use"
    trigger: "POST /patients with an existing mrn"

  - id: ERR_DUPLICATE_NPI
    http_status: 409
    message: "npi already in use"
    trigger: "POST /clinicians with an existing npi"

  - id: ERR_DUPLICATE_ROOM_CODE
    http_status: 409
    message: "room_code already in use"
    trigger: "POST /procedure-rooms with an existing room_code"

  - id: ERR_DUPLICATE_LOT_NUMBER
    http_status: 409
    message: "lot_number already in use for that device_type"
    trigger: "POST /device-lots repeating a (device_type, lot_number) pair; the same lot_number under a different device_type is accepted"

  - id: ERR_CONVERSION_NOT_INDICATED
    http_status: 422
    message: "conversion is not clinically indicated for this access"
    trigger: "activating a plan whose from_access is not a TUNNELED_CATHETER and whose intervention_burden_score is below 4"

  - id: ERR_TARGET_ACCESS_NOT_CONVERTIBLE
    http_status: 409
    message: "target access cannot receive a conversion"
    trigger: "activating or checking a plan whose target_access_id is null, or whose target access is IN_USE, DYSFUNCTIONAL or ABANDONED"

  - id: ERR_ACCESS_HAS_OPEN_CASE
    http_status: 409
    message: "vascular access still has an open case"
    trigger: "abandoning an access while a Procedure on it is SCHEDULED, IN_ROOM or RECOVERY"

  - id: ERR_REBILL_LIMIT_REACHED
    http_status: 409
    message: "rebill limit reached for this procedure"
    trigger: "POST /procedures/{id}/rebill when rebill_count is already 2"

  - id: ERR_LOT_DEPLETED
    http_status: 409
    message: "device lot has no units left"
    trigger: "reserving from a lot whose status is DEPLETED, or whose headroom is exactly 0"

  - id: ERR_INSUFFICIENT_DEVICE_STOCK
    http_status: 409
    message: "requested quantity exceeds available stock"
    trigger: "an explicit reservation larger than a single lot's headroom, or a FEFO allocation larger than the aggregate headroom of the whole candidate set"

  - id: ERR_NO_ELIGIBLE_LOT
    http_status: 422
    message: "no eligible device lot exists for that device type"
    trigger: "POST /procedures/{id}/device-allocations when every lot of the type is quarantined, expired, depleted or lapsed relative to the case date"

  - id: ERR_CODE_DEVICE_MISMATCH
    http_status: 422
    message: "a billed procedural code has no matching consumed device"
    trigger: "POST /procedures/{id}/bill with a non-bundled ANGIOPLASTY, THROMBECTOMY or CATH_EXCHANGE line lacking a CONSUMED DeviceUsage of the family's required device_type"

  - id: ERR_SESSION_CAP_EXCEEDED
    http_status: 409
    message: "allowed amount exceeds the per-session cap"
    trigger: "POST /procedures/{id}/bill with allowed_amount_cents above 480000"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
#     role_model: segregation_of_duties — the interventionalist who performs a
#     case may never code it, and only that same interventionalist may attest
#     its medical necessity, so the operator/coder/attester triangle is fixed.
# ---------------------------------------------------------------------------
roles:
  - name: CenterAdmin
    description: "freestanding centre operator: reference data, device inventory, the revenue cycle and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/expiry-sweep"
      - "POST /dialysis-facilities"
      - "POST /clinicians"
      - "POST /procedure-rooms"
      - "POST /device-lots"
      - "POST /device-lots/{id}/quarantine"
      - "POST /device-lots/{id}/release"
      - "POST /procedures/{id}/bill"
      - "POST /procedures/{id}/deny"
      - "POST /procedures/{id}/rebill"
    shared_operations:
      - "POST /patients, POST /vascular-accesses, POST /vascular-accesses/{id}/status (with AccessCoordinator)"
      - "POST /surveillance-readings, POST /referrals, POST /referrals/{id}/missed-treatments (with FacilityCoordinator and AccessCoordinator)"
      - "POST /referrals/{id}/request-info, POST /referrals/{id}/triage, POST /referrals/{id}/decline, POST /procedures, POST /procedures/{id}/cancel, POST /access-conversion-plans, POST /access-conversion-plans/{id}/activate (with AccessCoordinator)"
      - "POST /procedures/{id}/device-usages, POST /procedures/{id}/device-allocations, POST /infection-events (with AccessCoordinator and Interventionalist)"
      - "every GET in §1.5"

  - name: AccessCoordinator
    description: "centre-side coordinator who triages referrals, books cases, manages accesses and conversion plans"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /referrals/{id}/request-info, POST /referrals/{id}/triage, POST /referrals/{id}/decline (with CenterAdmin)"
      - "POST /patients, POST /vascular-accesses, POST /vascular-accesses/{id}/status (with CenterAdmin)"
      - "POST /procedures, POST /procedures/{id}/cancel (with CenterAdmin)"
      - "POST /access-conversion-plans, POST /access-conversion-plans/{id}/activate (with CenterAdmin); POST /access-conversion-plans/{id}/maturation-checks (with Interventionalist)"
      - "POST /procedures/{id}/device-usages, POST /procedures/{id}/device-allocations, POST /infection-events (with CenterAdmin and Interventionalist)"
      - "POST /surveillance-readings, POST /referrals, POST /referrals/{id}/missed-treatments (with FacilityCoordinator and CenterAdmin)"
      - "every GET except GET /procedures/{id}/reimbursement-preview"
    note: "cannot bill, deny, rebill, code, attest, start, recover, observe, discharge or abort — the coordinator never touches the room or the money"

  - name: FacilityCoordinator
    description: "partner dialysis facility staffer who submits referrals, surveillance data and missed-treatment counts for their own facility only"
    identity: "entity_backed:DialysisFacility"
    exclusive_operations:
      - "POST /referrals/{id}/resubmit"
    shared_operations:
      - "POST /referrals, POST /surveillance-readings, POST /referrals/{id}/missed-treatments (with AccessCoordinator and CenterAdmin)"
      - "GET /dialysis-facilities/{id}, GET /dialysis-facilities/{id}/patients, GET /dialysis-facilities/{id}/surveillance-readings, GET /dialysis-facilities/{id}/partnership-metrics, GET /patients/{id}, GET /vascular-accesses, GET /vascular-accesses/{id}, GET /vascular-accesses/{id}/surveillance-readings, GET /surveillance-readings/{id}, GET /referrals, GET /referrals/{id}, GET /procedures/{id}"
    note: "X-User-ID is a DialysisFacility.id; every read and write is scoped to that facility by validations priority 6 (ERR_FACILITY_SCOPE_VIOLATION)"

  - name: Interventionalist
    description: "proceduralist who runs the case in the room, attests medical necessity and files maturation checks"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /procedures/{id}/start"
      - "POST /procedures/{id}/recovery"
      - "POST /procedures/{id}/abort"
      - "POST /procedures/{id}/attest"
    shared_operations:
      - "POST /access-conversion-plans/{id}/maturation-checks (with AccessCoordinator)"
      - "POST /procedures/{id}/device-usages, POST /procedures/{id}/device-allocations, POST /infection-events (with AccessCoordinator and CenterAdmin)"
      - "GET /dialysis-facilities/{id}, GET /patients/{id}, GET /clinicians/{id}, GET /procedure-rooms/{id}, GET /device-lots, GET /device-lots/{id}, GET /vascular-accesses, GET /vascular-accesses/{id}, GET /vascular-accesses/{id}/surveillance-readings, GET /surveillance-readings/{id}, GET /referrals, GET /referrals/{id}, GET /procedures, GET /procedures/{id}, GET /procedures/{id}/codes, GET /procedures/{id}/recovery-observations, GET /device-usages, GET /device-usages/{id}, GET /access-conversion-plans, GET /access-conversion-plans/{id}, GET /infection-events, GET /infection-events/{id}"
    note: "X-User-ID is a Clinician.id with clinician_role == INTERVENTIONALIST; start / recovery / abort additionally require X-User-ID == procedure.primary_operator_id (ERR_NOT_ASSIGNED_CLINICIAN, priority 7) while attest requires the same identity under priority 14 (ERR_ATTESTATION_NOT_OPERATOR), and coding is forbidden entirely"

  - name: SedationRN
    description: "sedation nurse who charts recovery observations and discharges the patient"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /procedures/{id}/recovery-observations"
      - "POST /procedures/{id}/discharge"
    shared_operations:
      - "GET /dialysis-facilities/{id}, GET /patients/{id}, GET /clinicians/{id}, GET /procedure-rooms/{id}, GET /vascular-accesses/{id}, GET /procedures, GET /procedures/{id}, GET /procedures/{id}/recovery-observations"
    note: "X-User-ID is a Clinician.id with clinician_role == SEDATION_RN and must equal procedure.sedation_rn_id; the five-hop discharge cascade is therefore fired by a role that can do almost nothing else"

  - name: Coder
    description: "coding specialist who files the procedural code lines that drive both reimbursement variants"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /procedures/{id}/codes"
    shared_operations:
      - "GET /dialysis-facilities/{id}, GET /patients/{id}, GET /clinicians/{id}, GET /surveillance-readings/{id}, GET /vascular-accesses/{id}, GET /referrals/{id}, GET /procedures, GET /procedures/{id}, GET /procedures/{id}/codes, GET /procedures/{id}/reimbursement-preview, GET /device-usages, GET /device-usages/{id}"
    note: "X-User-ID is a Clinician.id with clinician_role == CODER; segregation of duties forbids coding a case where X-User-ID equals primary_operator_id or sedation_rn_id, and the Coder may never attest, bill, deny or rebill"
