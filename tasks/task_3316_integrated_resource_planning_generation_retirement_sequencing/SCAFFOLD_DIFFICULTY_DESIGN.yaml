              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_NOT_APPROVED (HTTP 409); no commitment row is created"

      - name: testimony_requires_plan_under_review
        grounds:
          - state_machines.IntervenorTestimony
