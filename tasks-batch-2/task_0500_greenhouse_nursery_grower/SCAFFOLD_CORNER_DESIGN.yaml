# =============================================================================
# Task 0500 — Greenhouse & Nursery Grower (wholesale)
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Walks references/claim-extraction-guide.md row-by-row against §1.1–§1.7.
# Default logical clock at startup: 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_variety_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.CropVariety, endpoints]
        distinguishing_aspect: "POST /nursery/varieties with all required fields -> 201; response carries id, status=DRAFT, version=1, and every input field echoed."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nursery/varieties"
              payload: { common_name: "Petunia X", cultivar_code: "PETX1", propagation_form: "PLUG", grow_cycle_days: 10, container_footprint_units: 2, ship_ready_grade_min_height_cm: 12, ship_ready_min_live_pct: 0.80, requires_phyto: false }
              as: GrowerManager
              captures: { vid: $.data.id }
          assert:
            - "HTTP 201; CropVariety.${vid}.status == DRAFT and version == 1"
            - "CropVariety.${vid}.cultivar_code == PETX1 and grow_cycle_days == 10"

      - name: get_zone_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Zone, endpoints]
        distinguishing_aspect: "GET /nursery/zones/{id} returns the created zone with computed occupancy fields initialized (occupied 0, reserved 0, free == capacity, fill_state OPEN)."
        test_recipe:
          setup: ["One zone capacity=500."]
          setup_api_calls:
            - call: "POST /nursery/zones"
              payload: { name: "Z1", climate_class: "WARM", capacity_units: 500 }
              as: GrowerManager
              captures: { zid: $.data.id }
          trigger:
            - call: "GET /nursery/zones/${zid}"
              payload: {}
              as: GrowerManager
              captures: { fu: $.data.free_units, fs: $.data.fill_state }
          assert:
            - "Zone.${zid}.occupied_units == 0, reserved_units == 0, free_units == 500, fill_state == OPEN"

      - name: list_varieties_paginated_envelope
        claim_type: Listing
        grounds: [entities.CropVariety, endpoints, response_envelope]
        distinguishing_aspect: "GET /nursery/varieties returns response_type array with pagination fields total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["Three DRAFT varieties created."]
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "A", cultivar_code: "AAA1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "B", cultivar_code: "BBB1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "C", cultivar_code: "CCC1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
          trigger:
            - call: "GET /nursery/varieties"
              payload: { limit: 2, offset: 0 }
              as: GrowerManager
          assert:
            - "response_type == array; data length == 2; meta total_count == 3; has_more == true"

      - name: get_batch_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.PropagationBatch, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /nursery/batches/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /nursery/batches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductionTech
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND"

      - name: create_variety_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds: [entities.CropVariety, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /nursery/varieties omitting grow_cycle_days (required, no default) -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nursery/varieties"
              payload: { common_name: "NoCycle", cultivar_code: "NOCY1", propagation_form: "PLUG", container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_INVALID_REQUEST"

      - name: variety_requires_phyto_default_false_applied
        claim_type: Defaults
        grounds: [entities.CropVariety.fields.requires_phyto]
        distinguishing_aspect: "Omitting requires_phyto on create -> stored default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nursery/varieties"
              payload: { common_name: "DefPhyto", cultivar_code: "DEFP1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
          assert:
            - "CropVariety.${vid}.requires_phyto == false"

      - name: batch_lot_code_system_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.PropagationBatch.fields.lot_code]
        distinguishing_aspect: "lot_code is server-minted; a client-supplied lot_code in the create payload is ignored (and rejected as unknown field per §1.5 input)."
        test_recipe:
          setup: ["ACTIVE variety footprint 1; OPEN zone cap 100."]
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "L", cultivar_code: "LOT1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 100 }
              as: GrowerManager
              captures: { zid: $.data.id }
          trigger:
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 10 }
              as: ProductionTech
              captures: { bid: $.data.id, lc: $.data.lot_code }
          assert:
            - "PropagationBatch.${bid}.lot_code is a non-empty server-minted string the client never supplied"

      - name: inputlog_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.InputLog]
        distinguishing_aspect: "InputLog has common_fields:false — append-only event with only id + created_at; no version field and no update endpoint exists."
        test_recipe:
          setup: ["ACTIVE variety, zone, GROWING batch; one CLIMATE input-log recorded."]
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "IL", cultivar_code: "ILG1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 100 }
              as: GrowerManager
              captures: { zid: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 10 }
              as: ProductionTech
              captures: { bid: $.data.id }
            - call: "GET /nursery/zones/${zid}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${bid}/transplant"
              payload: { started_count: 10, expected_zone_version: "${zv}" }
              as: ProductionTech
          trigger:
            - call: "POST /nursery/batches/${bid}/input-logs"
              payload: { event_type: "CLIMATE", temperature_c: 22.5 }
              as: ProductionTech
              captures: { lid: $.data.id }
          assert:
            - "InputLog.${lid} response has id and created_at but no version field"

      - name: variety_invalid_enum_propagation_form_rejected
        claim_type: Type Constraints
        grounds: [entities.CropVariety.fields.propagation_form, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "propagation_form outside {PLUG,LINER,BARE_ROOT} -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nursery/varieties"
              payload: { common_name: "Bad", cultivar_code: "BAD1", propagation_form: "SEED", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_INVALID_REQUEST"

      - name: batch_create_wrong_variety_id_not_found
        claim_type: Parent Relationships
        grounds: [entities.PropagationBatch.fields.variety_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a batch with a non-existent variety_id (FK) -> 404 ERR_NOT_FOUND (FK existence validated)."
        test_recipe:
          setup: ["One OPEN zone cap 100; no such variety."]
          setup_api_calls:
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 100 }
              as: GrowerManager
              captures: { zid: $.data.id }
          trigger:
            - call: "POST /nursery/batches"
              payload: { variety_id: "11111111-1111-4111-8111-111111111111", zone_id: "${zid}", source_supplier: "S", sourced_count: 10 }
              as: ProductionTech
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND"

      - name: fk_reverse_list_batches_by_zone
        claim_type: Foreign key references validated
        grounds: [entities.PropagationBatch.fields.zone_id, endpoints]
        distinguishing_aspect: "GET /nursery/zones/{id}/batches returns the PropagationBatch[] for that zone (flat-topology FK reverse-reachability)."
        test_recipe:
          setup: ["ACTIVE variety, zone, one PLANNED batch in that zone."]
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "RV", cultivar_code: "RVG1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 100 }
              as: GrowerManager
              captures: { zid: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 10 }
              as: ProductionTech
              captures: { bid: $.data.id }
          trigger:
            - call: "GET /nursery/zones/${zid}/batches"
              payload: {}
              as: GrowerManager
          assert:
            - "response_type array contains exactly one PropagationBatch whose id == ${bid} and zone_id == ${zid}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: variety_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.CropVariety, entities.CropVariety.fields.status]
        distinguishing_aspect: "A freshly created variety starts in DRAFT (initial_state)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nursery/varieties"
              payload: { common_name: "Init", cultivar_code: "INIT1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
          assert:
            - "CropVariety.${vid}.status == DRAFT"

      - name: transplant_from_growing_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PropagationBatch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Transplant is only defined from PLANNED; a second transplant on an already-GROWING batch returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE variety footprint 1; OPEN zone cap 100; batch transplanted (GROWING)."]
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "TG", cultivar_code: "TGR1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 100 }
              as: GrowerManager
              captures: { zid: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 10 }
              as: ProductionTech
              captures: { bid: $.data.id }
            - call: "GET /nursery/zones/${zid}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${bid}/transplant"
              payload: { started_count: 10, expected_zone_version: "${zv}" }
              as: ProductionTech
            - call: "GET /nursery/zones/${zid}"
              payload: {}
              as: ProductionTech
              captures: { zv2: $.data.version }
          trigger:
            - call: "POST /nursery/batches/${bid}/transplant"
              payload: { started_count: 10, expected_zone_version: "${zv2}" }
              as: ProductionTech
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: retired_variety_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CropVariety, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is terminal; activate on a RETIRED variety returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE variety retired (no batches)."]
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "Ret", cultivar_code: "RETR1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/varieties/${vid}/retire"
              payload: {}
              as: GrowerManager
          trigger:
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: retire_variety_in_use_blocked
        claim_type: guarded transitions
        grounds: [state_machines.CropVariety.ACTIVE_to_RETIRED, "errors[ERR_VARIETY_IN_USE]"]
        distinguishing_aspect: "Retire is guarded by a cross-entity check: a variety backing a non-terminal (PLANNED) batch cannot retire -> 409 ERR_VARIETY_IN_USE."
        test_recipe:
          setup: ["ACTIVE variety with one PLANNED batch."]
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "InUse", cultivar_code: "INUS1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 100 }
              as: GrowerManager
              captures: { zid: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 10 }
              as: ProductionTech
          trigger:
            - call: "POST /nursery/varieties/${vid}/retire"
              payload: {}
              as: GrowerManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_VARIETY_IN_USE"

      - name: decommission_nonempty_zone_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.Zone.OPEN_FOR_USE_to_DECOMMISSIONED, "errors[ERR_ZONE_NOT_EMPTY]"]
        distinguishing_aspect: "Decommission requires occupied==0 and reserved==0; a zone with a PLANNED batch's reservation returns 409 ERR_ZONE_NOT_EMPTY."
        test_recipe:
          setup: ["Zone with one PLANNED batch reserving footprint."]
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "Dec", cultivar_code: "DECR1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 100 }
              as: GrowerManager
              captures: { zid: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 10 }
              as: ProductionTech
          trigger:
            - call: "POST /nursery/zones/${zid}/decommission"
              payload: {}
              as: GrowerManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_ZONE_NOT_EMPTY"

      - name: void_planned_batch_releases_reservation
        claim_type: Side Effect Execution
        grounds: [state_machines.PropagationBatch.PLANNED_to_VOIDED, calculations.zone_occupancy, entities.Zone.fields.reserved_units]
        distinguishing_aspect: "Voiding a PLANNED batch releases its zone reservation: reserved_units drops back to 0 and free_units returns to capacity."
        test_recipe:
          setup: ["Zone cap 100, one PLANNED batch sourced=40 (reserved 40, free 60)."]
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "Vd", cultivar_code: "VDR1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 100 }
              as: GrowerManager
              captures: { zid: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 40 }
              as: ProductionTech
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /nursery/batches/${bid}/void"
              payload: {}
              as: GrowerManager
            - call: "GET /nursery/zones/${zid}"
              payload: {}
              as: GrowerManager
              captures: { ru: $.data.reserved_units, fu: $.data.free_units }
          assert:
            - "PropagationBatch.${bid}.status == VOIDED"
            - "Zone.${zid}.reserved_units == 0 and free_units == 100"

      - name: cancel_confirmed_order_with_dispatched_shipment_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.BrokerOrder.CONFIRMED_to_CANCELLED, "errors[ERR_ORDER_HAS_SHIPMENT]"]
        distinguishing_aspect: "Cancelling a CONFIRMED order that already has a DISPATCHED shipment returns 409 ERR_ORDER_HAS_SHIPMENT."
        test_recipe:
          setup: ["Order FULFILLING after a partial dispatch of a 2-unit line out of qty 100."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Cx", cultivar_code: "CXR1", propagation_form: "LINER", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5, requires_phyto: false }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 1000 }
              as: GrowerManager
              captures: { zid: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 100 }
              as: ProductionTech
              captures: { bid: $.data.id }
            - call: "GET /nursery/zones/${zid}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${bid}/transplant"
              payload: { started_count: 100, expected_zone_version: "${zv}" }
              as: ProductionTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/batches/${bid}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 10 }
              as: ProductionTech
            - call: "POST /nursery/batches/${bid}/start-grading"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${bid}/finalize-grade"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/availability"
              payload: { batch_id: "${bid}", unit_price_cents: 300 }
              as: SalesCoordinator
              captures: { eid: $.data.id }
            - call: "POST /nursery/brokers"
              payload: { company_name: "OR", contact_email: "o@x.com", ship_to_state: "OR", credit_limit_cents: 5000000 }
              as: SalesCoordinator
              captures: { brid: $.data.id }
            - call: "POST /nursery/orders"
              payload: { broker_id: "${brid}", requested_ship_date: "2026-03-01T00:00:00Z" }
              as: SalesCoordinator
              captures: { oid: $.data.id }
            - call: "POST /nursery/orders/${oid}/lines"
              payload: { availability_entry_id: "${eid}", quantity: 100 }
              as: SalesCoordinator
              captures: { lid: $.data.id }
            - call: "GET /nursery/orders/${oid}"
              payload: {}
              as: SalesCoordinator
              captures: { ov: $.data.version }
            - call: "POST /nursery/orders/${oid}/confirm"
