              captures: { poa: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-CD-B", product_model_id: "${pm3}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pob: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-CD-C", product_model_id: "${pm3}", target_warehouse_id: "${whf}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { poc: $.data.id }
          trigger:
            - call: "POST /production-orders/${poa}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /production-orders/${pob}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /production-orders/${poc}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-3", product_model_id: "${pm3}", size_class: "TANDEM", cavity_count: 1, nominal_charge_kg: 30.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /production-orders/${pob}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "Warehouse.${whf}.posture == 'FROZEN' with committed_cube_m3 2.0000 and utilization_pct 95.24 before any of the five trigger calls"
            - "the PO-CD-A release returns status 200 with status 'READY_TO_SCHEDULE', blocked_reason null and version 2"
            - "the PO-CD-A release response carries material_cost_cents 0, oven_energy_cost_cents 0, overhead_cents 0, total_cost_cents 0 and unit_cost_cents null"
            - "the first PO-CD-B release returns status 409 with data.error_id 'ERR_NO_ELIGIBLE_MOLD', even though PM-CD-T3 also has no qualified resin lot"
            - "the PO-CD-C release returns status 409 with data.error_id 'ERR_WAREHOUSE_FROZEN', even though PM-CD-T3 has neither a mould nor a qualified lot at that moment"
            - "ProductionOrder.${pob}.status and ProductionOrder.${poc}.status are both still 'DRAFT' with version 1 — a refused release performs no partial write"
            - "the second PO-CD-B release, taken after MLD-CD-3 exists, returns status 409 with data.error_id 'ERR_RESIN_INSUFFICIENT'"
            - "ProductionOrder.${pob}.status is still 'DRAFT' with version 1 after the second refusal"

      - name: ep_warranty_return_to_queue_revokes_the_waiver_and_resets_the_other_axis
        claim_type: Action endpoint
        grounds:
          - "endpoints.POST_/warranty-claims/{warranty_claim_id}/return-to-queue"
          - state_machines.WarrantyClaim.claim_status.UNDER_REVIEW_to_SUBMITTED
          - state_machines.WarrantyClaim.storage_review_status.WAIVED_to_NOT_STARTED
          - validations.priority_43
        distinguishing_aspect: |
          One return-to-queue call moves BOTH parallel axes of the same row:
          claim_status UNDER_REVIEW -> SUBMITTED and storage_review_status
          WAIVED -> NOT_STARTED with storage_description and months_in_service
          cleared, so the PlantAdmin waiver is revoked rather than remembered —
          and the immediately following approve is refused with
          ERR_CLAIM_INVALID_STATE (priority 43) rather than
          ERR_STORAGE_REVIEW_INCOMPLETE (priority 55) even though both guards
          now fail.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with both hulls STORED in Z-A of WH-CD."
            - "Customer CUS-CD-1 (region Z2) which acknowledged storage guidance at 2026-08-01T10:35:00Z, i.e. before the hull was delivered."
            - "Shipment SHP-CD-1 out of WH-CD to zone Z2, trailer_cube_capacity_m3 5.0000 and trailer_max_payload_kg 200.000; both hulls loaded so nested cube is 2.0000 + 2.0000 * 0.5000 = 3.0000 and cube_utilization_pct is exactly 60.00, the minimum that may be sealed."
            - "Trailer sealed at 2026-08-01T10:35:00Z, departed 2026-08-01T11:00:00Z and delivered 2026-08-02T00:00:00Z, so both hulls are DELIVERED."
            - "WarrantyClaim CLM-CD-1 on hull 1 for CUS-CD-1, HULL_DEFORMATION with reported_deformation_mm 4.50 (>= the 3.00 threshold), taken to UNDER_REVIEW, storage-reviewed VIOLATED and then waived by the PlantAdmin."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
