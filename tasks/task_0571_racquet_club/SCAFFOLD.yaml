      - { name: lesson_id, type: string, source: system, description: "FK -> Lesson.id; the clinic/lesson enrolled in" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the enrolling member" }
      - { name: status, type: enum, source: system, description: "Seat state; ENROLLED counts against capacity, WAITLISTED does not", constraints: "ENROLLED | WAITLISTED | CANCELLED" }

  - name: Competition
    parent: null
