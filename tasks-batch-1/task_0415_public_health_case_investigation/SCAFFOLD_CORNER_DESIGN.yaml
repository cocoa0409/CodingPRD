        claim_type: Violation to Error
        grounds:
          - errors[ERR_LAB_NOT_SUPERSEDABLE]
          - state_machines.LabResult.LINKED_to_SUPERSEDED
        distinguishing_aspect: |
          supersede is legal only from LINKED; a RECEIVED/UNLINKED lab rejects supersede with
          409 ERR_LAB_NOT_SUPERSEDABLE.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1; an UNLINKED lab (no matching case) exists."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
