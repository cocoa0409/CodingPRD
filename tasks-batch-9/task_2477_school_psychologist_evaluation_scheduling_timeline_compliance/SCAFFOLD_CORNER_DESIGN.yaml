  - section: errors
    instances:
      - name: path_ids_resolve_left_to_right
        claim_type: triggerability
        grounds:
          - validations[priority=4]
          - errors.ERR_INSTRUMENT_NOT_FOUND
          - errors.ERR_SEAT_NOT_FOUND
        distinguishing_aspect: "On the two-id seat-release path, an unknown INSTRUMENT plus an unknown SEAT reports the instrument's 404 — the left-most id is resolved first, so the seat error is only reachable once the instrument exists."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one AssessmentInstrument with license_seat_total 1 and no seats."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "SB-5", instrument_code: "SB5", protocol_stock_count: 2, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1750, license_seat_total: 1, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /psych-services/assessment-instruments/00000000-0000-4000-8000-000000000000/license-seats/00000000-0000-4000-8000-000000000001/release"
              payload: {}
              as: PsychServicesSupervisor
          assert:
            - "HTTP 404 with data.error_id == \"ERR_INSTRUMENT_NOT_FOUND\" (NOT ERR_SEAT_NOT_FOUND)"
            - "The same call with the real ${inst} and the unknown seat id returns HTTP 404 with data.error_id == \"ERR_SEAT_NOT_FOUND\""
            - "POST /psych-services/referrals/00000000-0000-4000-8000-000000000000/consent-events returns ERR_REFERRAL_NOT_FOUND and POST /psych-services/protocol-orders/00000000-0000-4000-8000-000000000000/receive returns ERR_ORDER_NOT_FOUND"

      - name: released_seat_cannot_be_released_again
        claim_type: triggerability
        grounds:
          - validations[priority=8]
          - errors.ERR_SEAT_STATE_INVALID
          - state_machines.ScoringLicenseSeat.terminal_states
        distinguishing_aspect: "RELEASED is terminal for a seat, so the compensating action is not itself repeatable — a second release must not credit a second free seat."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School; one ACTIVE SSP psychologist; one AssessmentInstrument with license_seat_total 1; the psychologist's seat has already been released."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Pinehaven Middle", building_code: "PH60", grade_band: "MIDDLE", concurrent_meeting_capacity: 2, enrollment_count: 460 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Tomas Ek", employee_number: "E-2033", credential_type: "SSP", assigned_school_ids: ["${s1}"] }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "TAPS-4", instrument_code: "TAPS4", protocol_stock_count: 2, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1000, license_seat_total: 1, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
            - call: "POST /psych-services/assessment-instruments/${inst}/license-seats"
              payload: { psychologist_id: "${pa}" }
              as: DistrictAdmin
              captures: { seat1: $.data.id }
            - call: "POST /psych-services/assessment-instruments/${inst}/license-seats/${seat1}/release"
              payload: {}
              as: PsychServicesSupervisor
          trigger:
            - call: "POST /psych-services/assessment-instruments/${inst}/license-seats/${seat1}/release"
              payload: {}
              as: PsychServicesSupervisor
          assert:
            - "HTTP 409 with data.error_id == \"ERR_SEAT_STATE_INVALID\""
            - "ScoringLicenseSeat.${seat1}.status is still RELEASED with its original released_at"
            - "AssessmentInstrument.${inst}.license_seats_free == 1 — NOT 2; the invariant total == assigned + free still holds"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: triggerability
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=2]
        distinguishing_aspect: "Authentication is checked before everything else: a request with no headers at all — and one carrying a role string outside the five declared roles — both return 401 rather than 403, 404 or 422, even when the body is also malformed."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; no other data required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /psych-services/schools"
              payload: { grade_band: "NOT_A_BAND" }
              as: NONE
          assert:
            - "HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" — no X-User-Role / X-User-ID headers were sent, so the malformed body is never inspected"
            - "The same call with X-User-Role \"Superintendent\" (not one of the five declared roles) also returns 401 ERR_UNAUTHENTICATED, not 403"
            - "A GET (GET /psych-services/referrals) with no headers likewise returns 401 — the rule applies to reads too"
            - "The same malformed body sent as a valid DistrictAdmin returns 422 ERR_INVALID_REQUEST, confirming the ordering"

      - name: remedy_approval_requires_a_proposal_first
        claim_type: triggerability
        grounds:
          - validations[priority=8]
          - errors.ERR_BREACH_STATE_INVALID
          - endpoints["POST /psych-services/timeline-breaches/{breach_id}/approve-remedy"]
        distinguishing_aspect: "A freshly DETECTED breach cannot be approved: the approval step has no proposal to ratify, so the state error fires before any award is written and approved_by_user_id stays null."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; one School; one INITIAL 1-domain referral consented effective 2026-06-01T09:00:00Z, PENDING_ASSIGNMENT."
            - "Clock advanced to 2026-08-10T00:00:00Z (70 elapsed days, days_remaining -10) and a compliance run executed, so one TimelineBreach exists in status DETECTED with breach_days 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: DistrictAdmin
