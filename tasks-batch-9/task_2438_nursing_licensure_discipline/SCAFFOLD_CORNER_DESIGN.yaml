          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Complaint intake is exclusive to Investigator. Because the role gate is priority 2 and the ownership gate is priority 5, an Applicant filing against their OWN licence — where ownership would pass — still receives ERR_FORBIDDEN_ROLE rather than ERR_NOT_RESOURCE_OWNER, proving the ordering."
