              as: CaseWorker
              captures: { pat_id: $.data.id }
            - call: "POST /pap/screenings"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", household_size: 1, income_basis: "PRIOR_YEAR", prior_year_income_cents: 3000000, insurance_status: "UNINSURED" }
              as: Patient
