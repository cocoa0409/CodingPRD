      - GET /enrollments/${eb_id} returns status == "ATTENDED"
      - GET /readiness-sessions/${sa_id} returns enrolled_count == 0 and remaining_seats == 3
      - GET /readiness-sessions/${sb_id} returns enrolled_count == 1 and remaining_seats == 1
