              payload: { production_order_id: "${o_id}", furnace_id: FURNACE_A, planned_tap_start: "2026-09-02T11:00:00Z", planned_tap_end: "2026-09-02T13:00:00Z", planned_iron_lbs: 2000, planned_pig_iron_pct: 40, planned_scrap_steel_pct: 40, planned_returns_pct: 15, planned_alloy_pct: 5, expected_production_order_version: "${o_v4}" }
              as: MeltOperator
