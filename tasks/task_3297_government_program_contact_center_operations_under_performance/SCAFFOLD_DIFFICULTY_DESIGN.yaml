          surge_type: PUBLIC_EVENT
          starts_on: '2026-09-15T00:00:00Z'
          ends_on: '2026-09-30T00:00:00Z'
          expected_volume_factor: 1.5
        as: OpsManager
        captures:
          sw_a: $.data.id
      - call: POST /contracts
        payload:
          agency_name: Agency B
          measurement_tz: UTC
          cap_absolutes: false
        as: PlatformAdmin
        captures:
          cb_id: $.data.id
          cb_id_v0: $.data.version
      - call: POST /service-levels
        payload:
          contract_id: ${cb_id}
          program_code: MEDICAID
          metric: ASA
          target: 30
          cap_pct_of_gross: 1.0
          remedy_fee_cents: 1000
          effective_from: '2026-09-01T00:00:00Z'
        as: OpsManager
        captures:
          slb_id: $.data.id
      - call: POST /service-levels/${slb_id}/transition
        payload:
          to_status: EFFECTIVE
          expected_contract_version: ${cb_id_v0}
        as: OpsManager
      - call: POST /contracts/${cb_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a1_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - call: POST /surge-windows
        payload:
          contract_id: ${cb_id}
          program_code: MEDICAID
          surge_type: PUBLIC_EVENT
          starts_on: '2026-09-16T00:00:00Z'
          ends_on: '2026-09-30T00:00:00Z'
          expected_volume_factor: 1.5
        as: OpsManager
        captures:
          sw_b: $.data.id
      - call: POST /surge-windows/${sw_b}/transition
        payload:
          to_status: CANCELLED
        as: OpsManager
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      - call: POST /invoices
        payload:
          contract_id: ${c_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          sinv_a: $.data.id
      - call: POST /invoices
        payload:
          contract_id: ${cb_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          sinv_b: $.data.id
      trigger:
      - call: POST /invoices/${sinv_a}/prepare
        payload: {}
        as: BillingAnalyst
      - call: POST /invoices/${sinv_b}/prepare
        payload: {}
        as: BillingAnalyst
      assert:
      - SurgeWindow.${sw_a}.status == ACTIVE (auto at clock 2026-09-20)
      - Invoice.${sinv_a}.gross_cents == 56000 and its ASA line staffing_target == 15 (ceil(10 x 1.5))
      - Invoice.${sinv_b}.gross_cents == 54000 and its ASA line staffing_target == 10 (cancelled window contributes multiplier 1.0)
      - both lines have staffing_actual == 1; both are non-compliant on the staffing leg alone
- rule_id: resource_temporal_overlap
  instances:
  - name: surge_window_adjacency_rejected
    grounds:
    - entities.SurgeWindow.fields.status
    - errors.ERR_SURGE_OVERLAP
    - validations[priority=9]
    distinguishing_aspect: 'Adjacency-inclusive interval semantics on SurgeWindow: a candidate

      [2026-09-30, 2026-10-15) against an existing [2026-09-01, 2026-09-30)

      collides because s < e2 and e > s2 with shared boundary instant —

      gap-zero adjacency is REJECTED (different from a half-open

      merge-style rule that would permit touching intervals).

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01. ACTIVE contract; one DECLARED surge window [2026-09-01, 2026-09-30) for MEDICAID.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /surge-windows
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          surge_type: ENROLLMENT_PERIOD
          starts_on: '2026-09-01T00:00:00Z'
          ends_on: '2026-09-30T00:00:00Z'
          expected_volume_factor: 1.5
        as: OpsManager
        captures:
          sw1: $.data.id
      trigger:
      - call: POST /surge-windows
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          surge_type: POLICY_CHANGE
          starts_on: '2026-09-30T00:00:00Z'
          ends_on: '2026-10-15T00:00:00Z'
          expected_volume_factor: 1.2
        as: OpsManager
        captures:
          ovl_err: $.data.error_id
      assert:
      - the response status is 409 and ovl_err == ERR_SURGE_OVERLAP (adjacent windows collide)
      - GET /surge-windows?contract_id=${c_id} returns exactly 1 row
      - a third window [2026-10-01, 2026-10-15) would still collide with the hypothetical second but is moot; the first window remains DECLARED/ACTIVE
        untouched
  - name: certification_freshness_instant_valid_until_boundary
    grounds:
    - entities.Certification.fields.valid_until
    - calculations.agent_selector
    - errors.ERR_NO_ELIGIBLE_QUEUE
    distinguishing_aspect: 'Different resource and different interval semantics than surge

      windows: an instantaneous freshness predicate, not an interval pair.

      At clock == valid_until the certification is already stale

      (valid_until > now required), so routing one second before succeeds

      and routing at the exact expiry instant fails ERR_NO_ELIGIBLE_QUEUE —

      a strict-greater-than boundary on a point-in-time resource.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01. ACTIVE contract, queue, one agent certified with valid_until 2026-09-10T00:00:00Z. Two WAITING calls.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /agents
        payload:
          full_name: Agent One
          languages:
          - en
        as: OpsManager
        captures:
          a1_id: $.data.id
      - *id003
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a1_id}
          valid_until: '2026-09-10T00:00:00Z'
        as: KnowledgeManager
      - *id004
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-09T23:59:59Z'
        as: Supervisor
        captures:
          fcall1: $.data.id
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-10T00:00:00Z'
        as: Supervisor
        captures:
          fcall2: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-09T23:59:59Z'
        as: PlatformAdmin
      - call: POST /calls/${fcall1}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T00:00:00Z'
        as: PlatformAdmin
      - call: POST /calls/${fcall2}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
        captures:
          fresh_err: $.data.error_id
      assert:
      - Call.${fcall1}.status == ASSIGNED (cert fresh one second before valid_until)
      - the second route returns 409 and fresh_err == ERR_NO_ELIGIBLE_QUEUE (at the exact expiry instant the pool is empty)
      - GET /certifications?agent_id=${a1_id} still shows the row — staleness is derived from the clock, not a stored flag
- rule_id: compensating_invariant
  instances:
  - name: recompute_conserves_gross_minus_withheld_equals_net
    grounds:
    - entities.Invoice.fields.net_cents
    - calculations.withholding_amount
    - endpoints.POST_/invoices/{id}/recompute
    distinguishing_aspect: 'Conserved quantity: fiscal equation. The forward action (prepare

      creating withholding) paired with its compensating recompute after a

      remedying cure payment leaves gross_cents - withheld_cents ==

      net_cents at every step AND

      Contract.withheld_cents_cum == sum over invoices of withheld_cents;

      the cure releases 21600 and both ledgers return to 0 drift.

      '
    test_recipe:
      setup:
      - 'Same fixture as remedy_payment_releases_withholding_resyncs_invoice_and_contract: one call answered in 40s, invoice prepared (withheld
        21600), cure paid (released), then an explicit recompute runs the official variant.'
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /agents
        payload:
          full_name: Agent One
          languages:
          - en
        as: OpsManager
        captures:
          a1_id: $.data.id
      - *id003
      - call: POST /training-courses/${course_id}/complete
        payload:
          agent_id: ${a1_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - *id004
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          icall: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:00:00Z'
        as: PlatformAdmin
      - call: POST /calls/${icall}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:00:40Z'
        as: PlatformAdmin
      - call: POST /calls/${icall}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${a1_id}
      - call: POST /invoices
        payload:
          contract_id: ${c_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          iinv: $.data.id
      - call: POST /invoices/${iinv}/prepare
        payload: {}
        as: BillingAnalyst
      - call: GET /invoices/${iinv}/lines
        payload: {}
        as: BillingAnalyst
        captures:
          iline_id: $.data[0].id
      - call: GET /invoice-lines/${iline_id}/cure-periods
        payload: {}
        as: BillingAnalyst
        captures:
          icp: $.data[0].id
      - call: POST /cure-periods/${icp}/pay-remedy
        payload: {}
        as: BillingAnalyst
      trigger:
      - call: POST /invoices/${iinv}/recompute
        payload: {}
        as: BillingAnalyst
      assert:
      - Invoice.${iinv}.gross_cents - Invoice.${iinv}.withheld_cents == Invoice.${iinv}.net_cents after every step (54000 - 0 == 54000)
      - Contract.${c_id}.withheld_cents_cum == 0 after cure + recompute (no drift from the 21600 withhold-then-release pair)
      - the recomputed line withholds 0 even though measured ASA is still 40 — the REMEDIED cure period suppresses re-opening a breach for the
        same line
  - name: dispute_cycle_conserves_open_plan_count
    grounds:
    - state_machines.QualityReview.DISPUTED_to_OVERTURNED
    - state_machines.CoachingPlan.OPEN_to_CANCELLED
    - entities.CoachingPlan.fields.status
    distinguishing_aspect: 'A different conserved quantity than money: the count of OPEN

      coaching plans per agent. A low-score review ACCEPTED creates one

      OPEN plan (count 1); a second ACCEPTED low-score review for the same

      agent creates none (dedup, count stays 1); cancelling restores 0;

      and an OVERTURNED dispute never changes the count. Forward+compensate

      leaves the per-agent OPEN-plan count invariant at each step.

      '
