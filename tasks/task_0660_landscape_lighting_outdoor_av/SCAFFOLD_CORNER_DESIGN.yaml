        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[fixture-assign-stale-transformer]"
          - "errors[ERR_STALE_TRANSFORMER_VERSION]"
        distinguishing_aspect: "After a first assign bumps Transformer.version, a second assign still carrying the pre-bump version -> ERR_STALE_TRANSFORMER_VERSION (412)."
        test_recipe:
          setup: ["Project, 300VA transformer (version captured pre-assign), one zone, two PLANNED fixtures."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_cc1@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
