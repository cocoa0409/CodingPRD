              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/cloud-commitments"
              payload: { committed_amount_cents: 100000, expires_on: "2026-12-31" }
              as: LicensingSpecialist
              captures: { com_id: $.data.id }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /licensing/cloud-commitments/${com_id}/consumption-events"
              payload: { requested_cents: 1000 }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
            - call: "GET /licensing/cloud-commitments/${com_id}"
              as: LicensingSpecialist
              captures: { com_status: $.data.status }
          assert:
            - "error_id == ERR_COMMITMENT_EXPIRED (422)"
            - "commitment status == EXPIRED after the rejected consumption (error-path side effect)"

