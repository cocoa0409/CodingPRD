              as_user_id: "${custA_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${custB_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER (403)"
            - "Order.${order_id}.order_status == CART (unchanged)"

      - name: missing_role_header_unauthenticated
        claim_type: peer_roles
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "A request whose X-User-Role is not a known role is rejected ERR_UNAUTHENTICATED (401) before any authorization or existence check."
        test_recipe:
          setup: ["A farm exists to target."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
          trigger:
            - call: "GET /farms/${farm_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED (401)"

  - section: cross_cutting_complexity_layers
    instances:
