  - rule_id: combinatorial_formula
    instances:
      - name: meals_rate_value_rounds_per_line_item_then_sums
        grounds:
          - calculations.claim_meals_rate_value
          - entities.ClaimLineItem.fields.meals_rate_value_cents
          - entities.ClaimLineItem.fields.rate_class
          - entities.MealClaim.fields.meals_rate_value_cents
        distinguishing_aspect: |
          Mode (b) — a pinned evaluation ORDER inside one formula: each (line_item, meal_type) product
          47 * 470.50 = 22113.50 is rounded half-up to 22114 BEFORE summing, so three identical line
          items total exactly 66342; the plausible sum-then-round reading (141 * 470.50 = 66340.50 ->
          66341) is off by one cent and must not appear.
        test_recipe:
          setup:
            - "Sponsor APPROVED with an APPROVED budget."
            - "Three rural SELF_PREP OPEN sites (RURAL_OR_SELF_PREP rate class) APPROVED and OPERATING from 2026-06-08."
            - "Each site has exactly one FINALIZED MealServiceDay 2026-06-08 with 47 LUNCH first meals counted out of 150 produced."
            - "A DRAFT June claim with no line items yet."
