              as: LoanOperations
              as_user_id: "ops-1"
              captures: { r_st: $.data.status, r_cs: $.data.compensation_status, r_fa: $.data.funded_amount_cents, r_af: $.data.authority_flag }
            - call: "GET /loan-applications/${loan1}"
              payload: {}
              as: LoanOperations
              as_user_id: "ops-1"
              captures: { g_st: $.data.status, g_cs: $.data.compensation_status, g_fa: $.data.funded_amount_cents, g_af: $.data.authority_flag }
            - call: "GET /compensation-records"
              payload: { loan_application_id: "${loan1}" }
              as: LoanOperations
              as_user_id: "ops-1"
              captures: { rec_total: $.total_count, rec_st: "$.data[0].status", rec_acc: "$.data[0].accrued_cents" }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { o_life: $.data.lifetime_accrued_cents, o_net: $.data.net_compensation_cents }
          assert:
            - "The close response is authoritative: ${r_st} == FUNDED, ${r_cs} == ACCRUED,
               ${r_fa} == 5000000, ${r_af} == VERIFIED"
            - "The follow-up read agrees field-for-field: ${g_st} == ${r_st},
               ${g_cs} == ${r_cs}, ${g_fa} == ${r_fa} and ${g_af} == ${r_af}"
            - "${rec_total} == 1, ${rec_st} == ACCRUED, ${rec_acc} == 52500 (the ledger line is
               listable in the very next request)"
            - "${o_life} == 52500 and ${o_net} == 52500 (the originator's roll-ups moved in the
               same request that closed the loan; nothing has been clawed back)"

      - name: sweep_response_ids_are_confirmable_by_the_immediately_following_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /_ops/daily-license-sweep]
        distinguishing_aspect: |
          The sweep is the one endpoint whose response is a manifest of ids rather than a row, and
          under immediate consistency every id it returns must already be observable: the licence
          named in expired_license_ids reads back EXPIRED, the sponsorship named in
          relinquished_sponsorship_ids reads back RELINQUISHED, the loan named in
          suspended_loan_ids reads back authority_flag SUSPENDED, and the investigation named in
          opened_investigation_ids is already retrievable by that id - all in the requests that
          immediately follow, with no second sweep and no settling step. The originator's
          open_investigation_count and authorized_state_codes are equally current.
        test_recipe:
          setup:
            - "Originator 2200001 with a CA licence CA-DFPI-70001 expiring 2026-08-15
               (window 2026-08-01), activated and sponsored by INST-0001 from 2026-07-01."
            - "One CA loan LOCKED at 5000000 cents, so the lapse has something to suspend."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2026-08-15T00:00:00Z", renewal_window_opens_at: "2026-08-01T00:00:00Z", ce_reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_v: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-0001", effective_at: "2026-07-01T00:00:00Z", expected_license_registration_version: "${lic_v}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { sp_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BR-9971", product_type: "FIXED_30", requested_amount_cents: 5000000, par_rate_bps: 650 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan1: $.data.id }
            - call: "POST /loan-applications/${loan1}/lock"
              payload: { note_rate_bps: 650, locked_amount_cents: 5000000 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { pre_af: $.data.authority_flag }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /_ops/daily-license-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_at: $.data.swept_at, s_exp: $.data.expired_license_ids, s_rel: $.data.relinquished_sponsorship_ids, s_susp: $.data.suspended_loan_ids, s_inv: $.data.opened_investigation_ids, s_esc: $.data.escalated_inquiry_ids }
            - call: "GET /license-registrations/${lic_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { lic_st: $.data.status }
            - call: "GET /sponsorship-transfers/${sp_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sp_st: $.data.status, sp_rel: $.data.relinquished_at }
            - call: "GET /loan-applications/${loan1}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { loan_st: $.data.status, loan_af: $.data.authority_flag }
            - call: "GET /unlicensed-activity-investigations"
              payload: { loan_application_id: "${loan1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { inv_total: $.total_count, inv_id: "$.data[0].id", inv_st: "$.data[0].status", inv_by: "$.data[0].opened_by", inv_reason: "$.data[0].trigger_reason" }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { o_open: $.data.open_investigation_count }
            - call: "GET /originators/${orig_id}/authority"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { states: $.data.authorized_state_codes }
          assert:
            - "${pre_af} == VERIFIED before the lapse"
            - "${s_at} == 2026-08-16T00:00:00Z"
            - "${s_exp} == [${lic_id}] and ${lic_st} == EXPIRED"
            - "${s_rel} == [${sp_id}], ${sp_st} == RELINQUISHED and
               ${sp_rel} == 2026-08-16T00:00:00Z"
            - "${s_susp} == [${loan1}], ${loan_st} == LOCKED and ${loan_af} == SUSPENDED"
            - "${inv_total} == 1 and ${s_inv} == [${inv_id}]"
            - "${inv_st} == OPEN, ${inv_by} == CASCADE, ${inv_reason} == AUTHORITY_LAPSE"
            - "${s_esc} == [] (no examination inquiries exist)"
            - "${o_open} == 1 and ${states} == [] - every downstream roll-up is already current
               in the first read after the sweep"
