      - name: duration_precision_single_ceiling
        claim_type: precision
        grounds:
          - calculations.class_duration_estimate
        excluded_because:
          difficulty_instance: class_duration_projected_all_entered_vs_confirmed_only
          rationale: |
            The §1.8 instance already pins the rounding contract: ride minutes are
            ceiled ONCE over the whole field rather than per horse, and the jump-off
            term is ceiled separately, which is what the precision row asks for.

      - name: duration_variant_divergence_and_selection
        claim_type: variant_divergence
        grounds:
          - calculations.class_duration_estimate.variants.projected_all_entered
        excluded_because:
          difficulty_instance: class_duration_projected_all_entered_vs_confirmed_only
          rationale: |
            That instance runs both variants over one data set, asserts the delta and
            asserts which variant each surface uses (the booked slot takes the
            all-entered variant, the projection reports both), covering divergence and
            selection together.

      - name: standings_weighted_scoring_accumulation
        claim_type: weighted_scoring
        grounds:
          - calculations.rider_standing_points.variants.national_scale
        excluded_because:
          difficulty_instance: rider_standings_national_scale_vs_regional_scale
          rationale: |
            The §1.8 instance drives the same placings through the fractional national
            scale and the integer regional scale at multiple confirmed-entry counts,
            asserting that the multiplier tiers apply and that the fractional national
            totals do not drift — the weighted-scoring claim in full.

      - name: ring_interval_adjacency_and_disjointness
        claim_type: interval_merge
        grounds:
          - calculations.ring_schedule_layout
        excluded_because:
          difficulty_instance: ring_slot_half_open_plus_turnover_buffer
          rationale: |
            That instance tests the exact-touch case (next start == previous end plus
            buffer, accepted) and the one-minute overlap (rejected), which are the
            adjacent-and-disjoint interval claims for this scaffold's only interval
            geometry.

      - name: official_load_running_total_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.official_load_ledger
        excluded_because:
          difficulty_instance: footing_hold_unwinds_schedule_and_official_load
          rationale: |
            The §1.8 instance asserts Official.assigned_minutes both after the
            assignments are added and after the footing hold reverses them, which is
            the running-total-after-reversal claim.

      - name: prize_ledger_input_set_and_reversal
        claim_type: input_set_filtering
        grounds:
          - calculations.show_prize_ledger
        excluded_because:
          difficulty_instance: prize_pool_post_then_void_zero_drift
          rationale: |
            That instance posts and then voids a class and reconciles
            allocated_prize_cents / unallocated_prize_cents to their pre-post values,
            which covers both the ledger's input set (only RESULTS_POSTED and
            POINTS_SUBMITTED classes count) and its reversal.

      - name: prize_allocation_rounding_order_pinned
        claim_type: waterfall_allocation
        grounds:
          - calculations.class_prize_allocation
        excluded_because:
          difficulty_instance: class_prize_rounding_order_per_place_then_sum
          rationale: |
            The §1.8 instance is built on exactly this trap: it asserts the per-place
            round-then-sum order against the tempting sum-then-round order and pins the
            residual fold, so the waterfall ordering and remainder claims are already
            covered end to end.

      - name: office_fee_tier_not_reevaluated
        claim_type: tiered_pricing
        grounds:
          - calculations.entry_settlement
        excluded_because:
          difficulty_instance: entry_settlement_office_fee_keyed_on_preliminary_subtotal
          rationale: |
            That instance drives the 97500 subtotal whose total_due lands exactly on the
            waiver threshold and asserts the fee is NOT re-evaluated, which is the
            marginal-vs-average / straddling claim for this tiered rule.

  - section: validations
    instances:
      - name: valid_entry_passes_every_verification_gate
        claim_type: satisfaction_pass
        grounds:
          - validations.priority_20
          - validations.priority_21
          - validations.priority_22
          - validations.priority_60
          - validations.priority_63
          - calculations.entry_settlement
          - calculations.show_stall_ledger
        distinguishing_aspect: |
          The mirror image of every intake rejection: an entry whose rider membership is
          current, whose coggins is in date, whose horse is ELIGIBLE, whose stall request
          fits and whose payment matches to the cent must walk the whole intake ladder
          with no error. Implementations that over-fire a gate (e.g. treat
          membership_expires_on as exclusive-at-equal, or compare coggins_expires_on
          against the logical clock instead of Show.start_utc) fail here rather than on
          any negative probe.
        test_recipe:
          setup:
            - "APPROVED show (start 2026-09-10, stall_capacity 40, stall_fee 7500), JUMPER division, class 101 OPEN with entry_fee_cents 25000."
            - "Clean rider (membership_expires_on 2027-06-30) and clean horse (coggins_drawn_on 2026-03-01 -> coggins_expires_on 2027-03-01)."
            - "Logical clock is at the default 2026-08-01T00:00:00Z, before entry_close_utc 2026-09-01T00:00:00Z."
