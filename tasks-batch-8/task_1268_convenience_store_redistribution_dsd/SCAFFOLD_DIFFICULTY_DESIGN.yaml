          trigger:
            - { call: "POST /delivery-manifests/${m_id}/delivery-exceptions", payload: { order_id: "${po_id}", order_line_id: "${line_p1}", exception_type: "SHORT", cases_qty: 8, split_units_qty: 0 }, as: RouteDriver, captures: { exc_st: $.data.status, exc_credit: $.data.credit_amount_cents } }
            - { call: "GET /invoices/${inv_id}", payload: {}, as: CreditManager, captures: { inv_bal: $.data.balance_cents } }
            - { call: "GET /invoices/${inv_id}/credit-memos", payload: {}, as: CreditManager, captures: { memo_st: "$.data[0].status", memo_amt: "$.data[0].amount_cents" } }
