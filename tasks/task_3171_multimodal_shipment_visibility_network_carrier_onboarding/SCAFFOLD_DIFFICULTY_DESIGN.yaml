          assert:
            - "response status 409 with error_id ERR_CONNECTION_NOT_ACTIVE (connection TESTING, not ACTIVE)"
            - "Shipment.${xe_ship_id}.tracking_status remains BOOKED and GET /shipments/${xe_ship_id}/events returns 0 rows"

      - name: link_confirm_requires_non_terminal_shipment
        grounds:
          - state_machines.ShipmentIdentityLink.PROPOSED_to_CONFIRMED
          - errors.ERR_SHIPMENT_TERMINAL
        distinguishing_aspect: |
          Entity pair (ShipmentIdentityLink <- Shipment), different from the
          Shipment<-Connection pair: confirming a link whose match_score is
          1.0 is rejected with ERR_SHIPMENT_TERMINAL once the shipment has
          been cancelled, even though the link itself is validly PROPOSED.
        test_recipe:
          setup:
            - "Connection TESTING. Shipper with PO (PO-5/BK-5/LAX) and a score-1.0 shipment; link PROPOSED. Shipment then cancelled by its shipper."
          setup_api_calls:
