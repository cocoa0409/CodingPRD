            - "HedgeProgram.${prog_id}.planned_coverage_pct_delta == 16.53 after the re-size (it was 18.18 before)"
            - "HedgeProgram.${prog_id}.return_count == 2"
            - "HedgeProgram.${prog_id}.status == ACTIVE"
            - "HedgeProgram.${prog_id}.submitted_by_user_id == \"u_analyst_2\""
