              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /service-bookings"
              payload: { case_id: "${case_id}", kind: TEMP_HOUSING, start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-10T00:00:00Z", amount_cents: 15000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { sb_h: $.data.id }
            - call: "POST /service-bookings/${sb_h}/confirm"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /service-bookings"
              payload: { case_id: "${case_id}", kind: TRAVEL, start_date: "2026-08-15T00:00:00Z", amount_cents: 61000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { sb_t: $.data.id }
            - call: "POST /service-bookings/${sb_t}/confirm"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /service-bookings/${sb_t}/complete"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: MobilityCoordinator
            - call: "POST /employees/${emp_id}/terminate"
              payload: {}
              as: MobilityCoordinator
