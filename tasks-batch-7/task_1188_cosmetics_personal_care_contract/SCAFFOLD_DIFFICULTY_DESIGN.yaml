              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 100, batch_id: "${bt}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/start-mixing"
              as: ProductionPlanner
            - call: "POST /cosmfg/filling-lines"
              payload: { line_code: "L1" }
              as: ProductionPlanner
              captures: { ln: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${bt}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T10:00:00Z", planned_units: 2000 }
              as: ProductionPlanner
              captures: { rn: $.data.id }
          trigger:
            - call: "POST /cosmfg/filling-runs/${rn}/start"
              as: ProductionPlanner
              captures: { e: $.data.error_id }
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 4000 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "PH", measured_value: 5.5 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${bt}/release"
              as: QAManager
              as_user_id: "qa-2"
            - call: "POST /cosmfg/filling-runs/${rn}/start"
              as: ProductionPlanner
              captures: { rn_st: $.data.status }
          assert:
            - "Start with MIXING batch rejected with error_id ERR_BATCH_NOT_RELEASED"
            - "After batch release, start succeeds: FillingRun.${rn}.status == IN_PROGRESS"

      - name: batch_release_blocked_by_failed_study
        grounds:
          - validations[priority=11]
          - state_machines.Batch.IPC_PASSED_to_RELEASED_TO_FILLING
          - state_machines.StabilityStudy.IN_PROGRESS_to_COMPLETED_FAIL
          - errors[ERR_STUDY_FAILED_BLOCKS_RELEASE]
        distinguishing_aspect: |
          Pair Batch -> StabilityStudy (distinct from Order -> Formula and
          Run -> Batch): an IPC_PASSED batch cannot be released while any study of
          the order's formula is COMPLETED_FAIL.
        test_recipe:
          setup:
            - "ACTIVE formula with an ACCELERATED stability study that has FAILED interval 30"
            - "CONFIRMED order with an IPC_PASSED 100kg batch"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/stability-chambers"
              payload: { chamber_code: "CH1", capacity_studies: 4 }
              as: QAManager
              captures: { ch: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/stability-studies"
              payload: { chamber_id: "${ch}", study_type: "ACCELERATED" }
              as: QAManager
              captures: { st: $.data.id }
            - call: "POST /cosmfg/stability-studies/${st}/readings"
              payload: { interval_index: 30, result: "FAIL" }
              as: QAManager
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 100, batch_id: "${bt}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/start-mixing"
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
