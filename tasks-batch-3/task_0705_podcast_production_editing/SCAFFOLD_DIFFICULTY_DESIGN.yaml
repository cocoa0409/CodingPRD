              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep R1", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep1: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep1}", engineer_id: "${eng_id}", capture_mode: "REMOTE", scheduled_start_utc: "2026-03-04T10:00:00Z", scheduled_end_utc: "2026-03-04T11:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { s1: $.data.id }
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep R2", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep2: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { episode_id: "${ep2}", engineer_id: "${eng_id}", capture_mode: "REMOTE", scheduled_start_utc: "2026-03-04T11:30:00Z", scheduled_end_utc: "2026-03-04T12:30:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { s2_status: $.data.status }
          assert:
            - "The second REMOTE booking starting exactly 30 minutes after the first ends (11:00 + 30min = 11:30) SUCCEEDS with status 201 and Session.status == BOOKED (gap == buffer is allowed)."
            - "A REMOTE booking starting at 11:29 (29-minute gap) would instead return status 409 ERR_REMOTE_BUFFER_VIOLATION; the boundary at exactly 30 minutes is the precision point."

