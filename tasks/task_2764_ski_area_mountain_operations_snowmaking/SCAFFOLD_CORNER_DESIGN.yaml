            - "Trigger 14: posture == 'PUBLISHED_FULL', open_terrain_count == 1 and terrain_open_acres == 18.0 again; new_snow_in is still 12.0, so the threshold gates the clearance and not the decision."

      - name: the_lift_wind_hold_fires_strictly_above_its_threshold_while_the_day_hold_fires_at_sixty
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Lift.OPEN_to_WIND_HOLD
          - state_machines.Lift.WIND_HOLD_to_OPEN
          - state_machines.DayPlan.PUBLISHED_PARTIAL_to_WEATHER_HOLD
          - validations[priority=33]
          - errors[ERR_WIND_ABOVE_RELEASE_THRESHOLD]
          - endpoints[POST /mountain-ops/day-plans/{id}/weather]
        distinguishing_aspect: |
          Three different wind numbers govern one endpoint and they must not be conflated: the per-lift
          hold is STRICTLY greater than wind_hold_threshold_mph (40.0 is inert, 40.1 fires), the release
          band is threshold minus 5.0 and is INCLUSIVE (35.1 is refused, 35.0 is allowed), and the
          mountain-wide posture hold is a hard constant at >= 60.0 regardless of any lift threshold. The
          asymmetry at the end is the sharpest corner: dropping below 60.0 restores the posture but
          releases no lift, so the day is bookable while the mountain is still shut.
        test_recipe:
          setup:
            - "A season OPERATING, lift L1 with wind_hold_threshold_mph 40.0 OPEN at 1800 pph with two operators, one OPEN area of 18.0 acres, and a PUBLISHED_FULL day plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
