  - rule_id: cross_entity_state_dependency
    instances:
      - name: net_open_requires_repeater_operational
        grounds:
          - state_machines.NetSession.SCHEDULED_to_OPEN
          - entities.NetSession.fields.repeater_id
          - errors[ERR_REPEATER_NOT_OPERATIONAL]
        distinguishing_aspect: |
          Entity pair NetSession -> Repeater: a net cannot open while its repeater is DEGRADED; the other
          dependency instance crosses the EmergencyActivation -> ServedAgencyAgreement pair.
        test_recipe:
          setup:
            - "Repeater OPERATIONAL (site agreement ACTIVE + GRANTED coordination); net-control member W1NCS; net 'Net 1' SCHEDULED in window; repeater then set to DEGRADED."
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr: $.data.id }
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/record-decision"
              payload: { outcome: "GRANTED", council_reference: "C-001" }
              as: ClubAdmin
            - call: "POST /repeaters/${rep}/set-status"
              payload: { to: "OPERATIONAL" }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "W1NCS", full_name: "Net Control", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { nc: $.data.id }
            - call: "POST /members/${nc}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /net-sessions"
              payload: { name: "Net 1", repeater_id: "${rep}", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-02T00:00:00Z" }
              as: NetControl
              as_user_id: "${nc}"
              captures: { net: $.data.id }
            - call: "POST /repeaters/${rep}/set-status"
              payload: { to: "DEGRADED" }
              as: ClubAdmin
          trigger:
            - call: "POST /net-sessions/${net}/set-status"
              payload: { to: "OPEN" }
              as: NetControl
              as_user_id: "${nc}"
          assert:
            - "response status == 409 with data.error_id == ERR_REPEATER_NOT_OPERATIONAL"
            - "NetSession.${net}.status == SCHEDULED"

      - name: activation_requires_agreement_active
        grounds:
          - state_machines.EmergencyActivation.STANDBY_to_ACTIVATED
          - entities.EmergencyActivation.fields.agreement_id
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair EmergencyActivation -> ServedAgencyAgreement: an activation under a DRAFT agreement
          cannot be activated; the other dependency instance crosses the NetSession -> Repeater pair.
        test_recipe:
          setup:
            - "EC member W1EC; served-agency agreement left in DRAFT (window valid); STANDBY activation created under it."
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "W1EC", full_name: "EC One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { ec: $.data.id }
            - call: "POST /served-agency-agreements"
              payload: { agency_name: "County OEM", max_operators: 10, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { sag: $.data.id, sag_ver: $.data.version }
            - call: "POST /emergency-activations"
              payload: { agreement_id: "${sag}", title: "Tornado", required_operators: 3, expected_served_agency_agreement_version: "${sag_ver}" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
              captures: { act: $.data.id }
          trigger:
            - call: "POST /emergency-activations/${act}/set-status"
              payload: { to: "ACTIVATED" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
          assert:
            - "response status == 409 with data.error_id == ERR_AGREEMENT_NOT_ACTIVE"
            - "EmergencyActivation.${act}.status == STANDBY"

  - rule_id: resource_temporal_overlap
    instances:
      - name: net_half_open_overlap_allows_adjacent
        grounds:
          - validations[priority=7]
          - entities.NetSession.fields.scheduled_start
          - entities.NetSession.fields.scheduled_end
          - errors[ERR_NET_TIME_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on the Repeater resource: a net starting exactly at another net's
          scheduled_end (02:00:00Z) is accepted, while one overlapping by any positive amount
          (01:00-03:00 vs 00:00-02:00) is rejected; different interval semantics and resource than the
          site-agreement closed-interval instance.
        test_recipe:
          setup:
            - "Repeater OPERATIONAL; net-control member W1NCS; net 'Net 1' SCHEDULED 2026-05-01T00:00:00Z-02:00:00Z on the repeater."
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr: $.data.id }
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/record-decision"
              payload: { outcome: "GRANTED", council_reference: "C-001" }
              as: ClubAdmin
            - call: "POST /repeaters/${rep}/set-status"
              payload: { to: "OPERATIONAL" }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "W1NCS", full_name: "Net Control", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { nc: $.data.id }
            - call: "POST /members/${nc}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /net-sessions"
              payload: { name: "Net 1", repeater_id: "${rep}", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-01T02:00:00Z" }
              as: NetControl
              as_user_id: "${nc}"
          trigger:
            - call: "POST /net-sessions"
              payload: { name: "Net 2", repeater_id: "${rep}", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T04:00:00Z" }
              as: NetControl
              as_user_id: "${nc}"
              captures: { net2: $.data.id }
            - call: "POST /net-sessions"
              payload: { name: "Net 3", repeater_id: "${rep}", scheduled_start: "2026-05-01T01:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: NetControl
              as_user_id: "${nc}"
          assert:
            - "adjacent net creation succeeded: NetSession.${net2} exists with status SCHEDULED"
            - "overlapping net creation rejected: 409 ERR_NET_TIME_CONFLICT"
            - "GET /net-sessions?repeater_id=${rep} total_count == 2"

      - name: site_agreement_closed_interval_touching_conflicts
        grounds:
          - validations[priority=7]
          - entities.AntennaSiteAgreement.fields.lease_start
          - entities.AntennaSiteAgreement.fields.lease_end
          - errors[ERR_SITE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Closed-interval semantics on the site_name resource: a second agreement whose lease_start equals
          the first agreement's lease_end CONFLICTS (touching endpoints count as overlap), while a disjoint
          window is accepted; different semantics and resource than the half-open net-overlap instance.
        test_recipe:
          setup:
            - "AntennaSiteAgreement 'Hilltop' in NEGOTIATION with lease 2026-01-01T00:00:00Z to 2026-12-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2026-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa1: $.data.id }
          trigger:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-12-31T00:00:00Z", lease_end: "2027-06-30T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2027-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa3: $.data.id }
          assert:
            - "touching-window creation rejected: 409 ERR_SITE_WINDOW_CONFLICT"
            - "disjoint creation succeeded: AntennaSiteAgreement.${asa3} exists with status NEGOTIATION"
            - "GET /antenna-site-agreements?site_name=Hilltop total_count == 2"

  - rule_id: compensating_invariant
    instances:
      - name: equipment_loan_outstanding_roundtrip
        grounds:
          - state_machines.EquipmentLoan.ACTIVE_to_RETURNED
          - entities.EquipmentLoan.fields.status
          - errors[ERR_ITEM_ON_LOAN]
        distinguishing_aspect: |
          Conserved quantity: count of outstanding (ACTIVE/OVERDUE) loans per item_tag. Checkout raises it
          0 -> 1, return restores it to 0 — proven by a second checkout for the same item_tag succeeding
          after the return; a different conserved quantity than the field-day score invariant.
        test_recipe:
          setup:
            - "ACTIVE member K1AAA with GOOD_STANDING privilege."
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "K1AAA", full_name: "Op One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /equipment-loans"
              payload: { item_tag: "HT-300", due_at: "2026-06-01T00:00:00Z", estimated_value_cents: 1000 }
              as: Member
              as_user_id: "${m1}"
              captures: { loan1: $.data.id }
          trigger:
            - call: "POST /equipment-loans/${loan1}/return"
              payload: { return_condition: "GOOD" }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /equipment-loans"
              payload: { item_tag: "HT-300", due_at: "2026-06-15T00:00:00Z", estimated_value_cents: 1000 }
              as: Member
              as_user_id: "${m1}"
              captures: { loan2: $.data.id }
          assert:
            - "EquipmentLoan.${loan1}.status == RETURNED"
            - "EquipmentLoan.${loan1}.late_fee_cents == 0"
            - "GET /equipment-loans?item_tag=HT-300&status=ACTIVE total_count == 1 (only the new loan)"
            - "EquipmentLoan.${loan2}.status == ACTIVE"

      - name: field_day_duplicate_mark_unmark_roundtrip
        grounds:
          - calculations.field_day_scores
          - entities.FieldDayContact.fields.is_duplicate
          - state_machines.FieldDayEvent (FINALIZED lock)
        distinguishing_aspect: |
          Conserved quantity: FieldDayEvent.final_score. Marking a contact duplicate then unmarking it is a
          forward/compensating pair that must leave final_score at its pre-mark value (10), while
          provisional_score stays 10 throughout because the provisional variant includes duplicates;
          a different conserved quantity than the loan-outstanding count.
        test_recipe:
          setup:
            - "ACTIVE member K1AAA; FieldDayEvent OPEN; one contact logged (CW/QRP/B2M = 10 pts)."
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "K1AAA", full_name: "Op One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /field-day-events"
              payload: { name: "FD 2026", start_at: "2026-05-01T00:00:00Z", end_at: "2026-05-03T00:00:00Z" }
              as: ClubAdmin
              captures: { ev: $.data.id }
            - call: "POST /field-day-events/${ev}/set-status"
              payload: { to: "OPEN" }
              as: ClubAdmin
            - call: "POST /field-day-contacts"
              payload: { event_id: "${ev}", worked_callsign: "W1AW", band: "B2M", mode: "CW", power_category: "QRP" }
              as: Member
              as_user_id: "${m1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /field-day-contacts/${c1}/set-duplicate"
              payload: { is_duplicate: true }
              as: ClubAdmin
            - call: "POST /field-day-contacts/${c1}/set-duplicate"
              payload: { is_duplicate: false }
              as: ClubAdmin
            - call: "GET /field-day-events/${ev}"
              payload: {}
              as: ClubAdmin
          assert:
            - "FieldDayEvent.${ev}.provisional_score == 10"
            - "FieldDayEvent.${ev}.final_score == 10"
            - "FieldDayEvent.${ev}.contact_count == 1"
            - "FieldDayContact.${c1}.is_duplicate == false"
