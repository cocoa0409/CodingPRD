              payload: { brokerage_id: "${bkIC}", brand_id: "${brIC}", market_id: "${mkIC}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agIC: $.data.id, agIC_v: $.data.version }
            - call: "POST /franchise/agreements/${agIC}/conversion-plans"
              payload: { milestones: [ { name: "m", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cpIC: $.data.id }
            - call: "POST /franchise/conversion-plans/${cpIC}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agIC}/activate"
              payload: { expected_agreement_version: "${agIC_v}" }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agIC}/gci-reports"
              payload: { period_month: "2027-01", gci_cents: 100000000 }
              as: FranchisorOps
          trigger:
            - call: "POST /franchise/agreements/${agIC}/royalty-periods"
              payload: { period_month: "2027-01" }
              as: FranchisorOps
              captures: { dueIC: $.data.royalty_due_cents, fundIC: $.data.ad_fund_due_cents }
          assert:
            - "response data.royalty_due_cents == 6000000 in the POST response itself"
            - "response data.ad_fund_due_cents == 2000000 in the POST response itself"
