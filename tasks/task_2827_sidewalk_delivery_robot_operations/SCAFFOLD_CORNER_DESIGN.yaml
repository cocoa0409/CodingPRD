              as: FleetDispatcher
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "BEGIN_CHARGE", bay_reservation_id: "${res}" }
              as: FleetDispatcher
          assert:
            - "the first BEGIN_CHARGE returns 409 with error_id ERR_RESERVATION_NOT_ACTIVE"
            - "Robot.${r}.duty_state == AVAILABLE and Robot.${r}.current_bay_reservation_id == null after the refusal"
            - "the ACTIVATE returns 200 with BayReservation.${res}.state == ACTIVE"
            - "DepotBay.${b}.committed_minutes == 60 and ServiceZone.${z}.reserved_bay_minutes == 60 are unchanged by the activation"
            - "the second BEGIN_CHARGE returns 200 with Robot.${r}.duty_state == CHARGING"
