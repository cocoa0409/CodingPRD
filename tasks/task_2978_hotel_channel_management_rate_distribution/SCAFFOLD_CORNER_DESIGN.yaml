# =========================================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 breadth probe for task 2978
# Hotel Channel Management & Rate Distribution
#
# Taxonomy: references/claim-extraction-guide.md - `section:` values are the guide's nine
# sections, `claim_type:` values are its per-section rows. Nothing invented.
#
# Envelope conventions used by every assert below (§1.0 of SCAFFOLD.yaml):
#   success object -> { meta, response_type: "object", data: {...} }
#   success list   -> { meta, response_type: "array",  data: [...], limit, offset,
#                       total_count, has_more }   (pagination fields sit BESIDE data,
#                       because data itself is the array)
#   error          -> { meta, response_type: "error", data: { error_id, message } }
# Every instance starts from an empty DB and pins the logical clock first.
# =========================================================================================
scaffold_corner_design:

  # =====================================================================================
  - section: entities
    instances:

      - name: property_create_returns_full_entity_with_common_fields
        claim_type: creation
        grounds:
          - entities.Property
          - endpoints[POST /distribution/properties]
          - response_envelope.success
        distinguishing_aspect: |
          A create with every optional field supplied echoes all eight input fields verbatim and adds
          the four common fields, with version == 1 and created_at == updated_at == the logical clock.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-25T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object"
            - "data == { id: <uuid>, code: HTL-SFO, name: Harborview SFO, currency_code: USD, overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5, version: 1, created_at: 2026-08-25T00:00:00.000Z, updated_at: 2026-08-25T00:00:00.000Z }"
            - "GET /distribution/properties/${prop_id} returns byte-identical field values"

      - name: property_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Property.fields.overbooking_pct_bp
          - entities.Property.fields.booking_horizon_days
          - entities.Property.fields.mix_window_days
          - endpoints[POST /distribution/properties]
        distinguishing_aspect: |
          Omitting all five optional Property fields yields currency_code USD, overbooking_pct_bp 0,
          booking_horizon_days 365, mix_window_days 30, rate_mismatch_tolerance_cents 0 and
          required_image_count 0 - notably overbooking_pct_bp 0 means the ceiling equals capacity.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-25T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /distribution/properties"
              payload: { code: "HTL-LAX", name: "Harborview LAX", currency_code: "USD" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
          assert:
            - "Property.${prop_id} == { currency_code: USD, overbooking_pct_bp: 0, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 0, required_image_count: 0 }"
            - "RoomType.${king_id}.overbooking_pct_bp == null (its own default) and effective_overbooking_pct_bp == 0 (falls back to the property)"
            - "InventoryDay.${inv_id}.overbooking_ceiling_units == 10 == physical_capacity_units, and shared_pool_units == 10 - the zero default means no overbooking at all"

      - name: channel_defaults_applied_when_optional_flags_omitted
        claim_type: defaults
        grounds:
          - entities.Channel.fields.sell_adjustment_bp
          - entities.Channel.fields.requires_content_parity
          - entities.Channel.fields.geo_market_codes
          - endpoints[POST /distribution/properties/{id}/channels]
        distinguishing_aspect: |
          A channel created with only its three required fields has sell_adjustment_bp 0,
          allows_member_rate false, allows_opaque_rate false, geo_market_codes [] and
          requires_content_parity TRUE - the one default that is true rather than empty - plus a
          seven-field ledger that starts at all zeros.
        test_recipe:
          setup:
            - "Property HTL-SFO exists at logical clock 2026-08-25T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
          assert:
            - "Channel.${ota1_id} == { sell_adjustment_bp: 0, allows_member_rate: false, allows_opaque_rate: false, geo_market_codes: [], requires_content_parity: true }"
            - "Channel.${ota1_id} ledger == { gross_revenue_cents: 0, commission_accrued_cents: 0, net_revenue_cents: 0, room_nights_sold: 0, bookings_count: 0, cancellations_count: 0, mismatch_alert_count: 0 }"
            - "ChannelConnection.${conn_id}.heartbeat_interval_minutes == 15 (its schema default), connection_state == PENDING, consecutive_failures == 0, last_heartbeat_at == null"

      - name: rate_plan_retrieval_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /distribution/rate-plans/{id}]
          - entities.RatePlan.fields.resolved_base_amount_cents
          - entities.RatePlan.fields.derivation_depth
        distinguishing_aspect: |
          A GET on a root PUBLIC plan returns the stored inputs plus derivation_depth 0 and
          resolved_base_amount_cents equal to base_amount_cents 25000, with plan_state DRAFT and
          version 1 - no activation needed to see the derived fields.
        test_recipe:
          setup:
            - "Property HTL-SFO at logical clock 2026-08-25T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
          trigger:
            - call: "GET /distribution/rate-plans/${bar_id}"
              payload: {}
              as: RevenueDirector
          assert:
            - "HTTP 200 with data == { id: ${bar_id}, property_id: ${prop_id}, code: BAR, rate_class: PUBLIC, parent_rate_plan_id: null, base_amount_cents: 25000, offset_kind: NONE, offset_bp: null, offset_amount_cents: null, floor_amount_cents: 18000, ceiling_amount_cents: 40000, package_inclusion_cents: 0, member_only: false, negotiated_account_code: null, plan_state: DRAFT, derivation_depth: 0, resolved_base_amount_cents: 25000, version: 1 }"
            - "created_at == updated_at == 2026-08-25T00:00:00.000Z"

      - name: rate_plan_listing_paginates_and_filters_by_plan_state
        claim_type: listing
        grounds:
          - endpoints[GET /distribution/rate-plans]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three plans on the property, limit 2 / offset 0 returns two rows with total_count 3 and
          has_more true; offset 2 returns the last row with has_more false; and plan_state=ACTIVE
          narrows total_count to 1 - filter and pagination compose rather than override each other.
        test_recipe:
          setup:
            - "Property HTL-SFO with three PUBLIC rate plans BAR, BAR2 and BAR3, of which only BAR is activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR2", rate_class: "PUBLIC", base_amount_cents: 26000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR3", rate_class: "PUBLIC", base_amount_cents: 27000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
          trigger:
            - call: "GET /distribution/rate-plans"
              payload: { property_id: "${prop_id}", limit: 2, offset: 0 }
              as: RevenueManager
            - call: "GET /distribution/rate-plans"
              payload: { property_id: "${prop_id}", limit: 2, offset: 2 }
              as: RevenueManager
            - call: "GET /distribution/rate-plans"
              payload: { property_id: "${prop_id}", plan_state: "ACTIVE" }
              as: RevenueManager
          assert:
            - "First page: HTTP 200, response_type == array, data length 2, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "Second page: data length 1, offset == 2, total_count == 3, has_more == false"
            - "plan_state=ACTIVE: data length 1 with data[0].id == ${bar_id}, limit == 10 (the default), offset == 0, total_count == 1, has_more == false"

      - name: reservation_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - endpoints[GET /distribution/reservations/{id}]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on the reservation read path returns HTTP 404 with
          data.error_id == ERR_RESERVATION_NOT_FOUND - the existence check at P4 fires before any
          business logic and the envelope carries the error shape, not an empty object.
        test_recipe:
          setup:
            - "Empty database beyond the pinned clock: no reservation has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /distribution/reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RevenueManager
          assert:
            - "HTTP 404 with response_type == error and data == { error_id: ERR_RESERVATION_NOT_FOUND, message: <non-empty string> }"
            - "data carries no reservation fields at all"

      - name: rate_plan_create_missing_floor_amount_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /distribution/properties/{id}/rate-plans]
        distinguishing_aspect: |
          floor_amount_cents and ceiling_amount_cents are non-optional on the create path even though
          base_amount_cents is optional; omitting floor_amount_cents returns HTTP 400
          ERR_INVALID_REQUEST and creates no RatePlan row.
        test_recipe:
          setup:
            - "Property HTL-SFO at logical clock 2026-08-25T00:00:00.000Z with no rate plans."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, ceiling_amount_cents: 40000 }
              as: RevenueManager
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /distribution/rate-plans?property_id=${prop_id} returns total_count == 0"

      - name: channel_create_with_invalid_enum_channel_kind_rejected
        claim_type: type_constraints
        grounds:
          - entities.Channel.fields.channel_kind
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          channel_kind accepts only the declared enum members; the well-formed but undeclared value
          "OTA_SEMI_OPAQUE" returns HTTP 400 ERR_INVALID_REQUEST rather than being stored verbatim.
        test_recipe:
          setup:
            - "Property HTL-SFO at logical clock 2026-08-25T00:00:00.000Z with no channels."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA9", channel_kind: "OTA_SEMI_OPAQUE", commission_bp: 1750 }
              as: PlatformAdmin
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /distribution/channels?property_id=${prop_id} returns total_count == 0"

      - name: inventory_day_computed_units_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.InventoryDay.fields.allocated_units
          - entities.InventoryDay.fields.overbooking_ceiling_units
          - endpoints[POST /distribution/room-types/{id}/inventory-days]
        distinguishing_aspect: |
          The inventory-day create path accepts stay_date only; client-supplied allocated_units,
          committed_units and overbooking_ceiling_units are ignored and the six computed fields are
          derived from the room type (capacity 10, 1000bp -> ceiling 11, shared 11).
        test_recipe:
          setup:
            - "Property HTL-SFO (overbooking_pct_bp 1000) with room type KING of capacity 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
          trigger:
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10", allocated_units: 99, committed_units: 99, overbooking_ceiling_units: 99, pooled_state: "EXHAUSTED" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
          assert:
            - "HTTP 201 with InventoryDay.${inv_id} == { room_type_id: ${king_id}, stay_date: 2026-09-10, physical_capacity_units: 10, overbooking_ceiling_units: 11, allocated_units: 0, committed_units: 0, shared_pool_units: 11, pooled_state: OPEN, version: 1 }"
            - "None of the four ignored input values (99, 99, 99, EXHAUSTED) appears anywhere in the stored row"

      - name: freeze_window_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ConnectivityFreezeWindow
          - endpoints[POST /distribution/channel-connections/{id}/freeze-windows]
        distinguishing_aspect: |
          ConnectivityFreezeWindow is the only entity declared with common_fields false: its create
          response carries id, connection_id, starts_at, ends_at, reason and effective_starts_at and
          NO version field, and §1.5 exposes no PATCH or delete path for it.
        test_recipe:
          setup:
            - "Property HTL-SFO, channel OTA1 and a PENDING connection on it, at logical clock 2026-08-25T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
          trigger:
            - call: "POST /distribution/channel-connections/${conn_id}/freeze-windows"
              payload: { starts_at: "2026-08-26T10:00:00.000Z", ends_at: "2026-08-26T12:00:00.000Z", reason: "MAINTENANCE" }
              as: ChannelOpsEngineer
              captures: { fw_id: $.data.id }
            - call: "GET /distribution/channel-connections/${conn_id}/freeze-windows"
              payload: {}
              as: ChannelOpsEngineer
          assert:
            - "HTTP 201 with data == { id: ${fw_id}, connection_id: ${conn_id}, starts_at: 2026-08-26T10:00:00.000Z, ends_at: 2026-08-26T12:00:00.000Z, reason: MAINTENANCE, effective_starts_at: 2026-08-26T09:00:00.000Z }"
            - "data contains no version, and no created_at/updated_at pair is required of it"
            - "The list read returns total_count == 1 and data[0] with the same six fields"

      - name: room_type_create_under_unknown_property_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_PROPERTY_NOT_FOUND]
          - endpoints[POST /distribution/properties/{id}/room-types]
        distinguishing_aspect: |
          The nested create path validates its parent id before its body: an unknown property id
          returns HTTP 404 ERR_PROPERTY_NOT_FOUND even though the room-type body is perfectly valid.
        test_recipe:
          setup:
            - "Empty database beyond the pinned clock: no property exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /distribution/properties/00000000-0000-4000-8000-0000000000ff/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
          assert:
            - "HTTP 404 with data.error_id == ERR_PROPERTY_NOT_FOUND"
            - "GET /distribution/room-types returns total_count == 0"

      - name: channel_mapping_junction_is_unique_per_plan_channel_room_type_triple
        claim_type: entity_topology_graph
        grounds:
          - entities.ChannelMapping
          - endpoints[POST /distribution/channel-mappings]
          - errors[ERR_DUPLICATE_RESOURCE]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          ChannelMapping is the graph's many-to-many junction (rate plan x channel x room type) and is
          parentless: the same rate plan may map twice when the room type differs, but repeating the
          full triple returns HTTP 409 ERR_DUPLICATE_RESOURCE.
        test_recipe:
          setup:
            - "Property HTL-SFO with room types KING and TWIN, channel OTA1 with a PENDING connection, and DRAFT rate plan BAR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "TWIN", name: "Twin Room", physical_capacity_units: 2, master_description_hash: "twinv1", master_image_count: 5 }
              as: RevenueManager
              captures: { twin_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
          trigger:
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_king_id: $.data.id }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${twin_id}", external_rate_code: "BAR-OTA1-TWIN", content_description_hash: "twinv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_twin_id: $.data.id }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING-2", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
          assert:
            - "Both distinct triples are accepted: ChannelMapping.${map_king_id}.mapping_state == DRAFT and parity_state == IN_PARITY; ChannelMapping.${map_twin_id}.mapping_state == DRAFT and parity_state == IN_PARITY"
            - "Neither mapping row carries a property_id or parent field - the junction is parentless and reaches the property only through its three FKs"
            - "The repeated (BAR, OTA1, KING) triple returns HTTP 409 with data.error_id == ERR_DUPLICATE_RESOURCE even though external_rate_code differs"
            - "GET /distribution/channel-mappings?rate_plan_id=${bar_id} returns total_count == 2"

  # =====================================================================================
  - section: state_machines
    instances:

      - name: newly_created_entities_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.RatePlan
          - state_machines.ChannelConnection
          - state_machines.ChannelMapping
          - state_machines.Promotion
          - state_machines.InventoryDay
        distinguishing_aspect: |
          One creation chain proves five initial_state declarations at once: RatePlan DRAFT,
          ChannelConnection PENDING, ChannelMapping DRAFT, InventoryDay OPEN, and Promotion's TWO
          independent axes at DRAFT and NOT_LOADED simultaneously.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-25T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
          trigger:
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/promotions"
              payload: { code: "MEMBER10", promo_kind: "MEMBER_RATE", discount_kind: "PERCENT", discount_bp: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: RevenueManager
              captures: { promo_id: $.data.id }
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
          assert:
            - "ChannelConnection.${conn_id}.connection_state == PENDING with consecutive_failures == 0 and suspended_at == null"
            - "RatePlan.${bar_id}.plan_state == DRAFT"
            - "ChannelMapping.${map_id}.mapping_state == DRAFT with mismatch_state == UNKNOWN and mismatch_delta_cents == null"
            - "Promotion.${promo_id}.approval_status == DRAFT AND distribution_status == NOT_LOADED, with revision_count == 0, submitted_by_user_id == null and approved_by_user_id == null"
            - "InventoryDay.${inv_id}.pooled_state == OPEN"
            - "Every one of these five rows has version == 1"

      - name: closed_rate_plan_is_terminal_and_cannot_be_reactivated_or_patched
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RatePlan
          - errors[ERR_RATE_PLAN_STATE_INVALID]
          - endpoints[POST /distribution/rate-plans/{id}/activate]
        distinguishing_aspect: |
          CLOSED is RatePlan's only terminal state: activate, close and PATCH all return HTTP 409
          ERR_RATE_PLAN_STATE_INVALID, and the PATCH refusal happens on state even though the echoed
          expected_rate_plan_version is the freshest one the server ever issued.
        test_recipe:
          setup:
            - "Property HTL-SFO with rate plan BAR created, activated (version 2) and then closed (version 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/rate-plans/${bar_id}/close"
              payload: {}
              as: RevenueManager
              captures: { closed_v: $.data.version }
          trigger:
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/rate-plans/${bar_id}/close"
              payload: {}
              as: RevenueManager
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${closed_v}", base_amount_cents: 26000 }
              as: RevenueManager
          assert:
            - "After setup: RatePlan.${bar_id}.plan_state == CLOSED and version == 3 (create 1, activate 2, close 3)"
            - "Re-activate: HTTP 409 with data.error_id == ERR_RATE_PLAN_STATE_INVALID"
            - "Re-close: HTTP 409 with data.error_id == ERR_RATE_PLAN_STATE_INVALID"
            - "PATCH with the correct version ${closed_v}: HTTP 409 with data.error_id == ERR_RATE_PLAN_STATE_INVALID (state, not 412 - the version echo was valid)"
            - "RatePlan.${bar_id}.base_amount_cents is still 25000 and version is still 3 - none of the three refusals mutated anything"

      - name: connection_activate_twice_second_attempt_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ChannelConnection.transitions[PENDING->HEALTHY]
          - errors[ERR_CONNECTION_STATE_INVALID]
          - endpoints[POST /distribution/channel-connections/{id}/activate]
        distinguishing_aspect: |
          activate is a transition, not an idempotent setter: the second call on an already HEALTHY
          connection returns HTTP 409 ERR_CONNECTION_STATE_INVALID and does not bump version.
        test_recipe:
          setup:
            - "Property HTL-SFO, channel OTA1, and a connection already activated to HEALTHY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
              captures: { conn_v: $.data.version }
          trigger:
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
          assert:
            - "HTTP 409 with data.error_id == ERR_CONNECTION_STATE_INVALID"
            - "ChannelConnection.${conn_id}.connection_state is still HEALTHY and version is still ${conn_v} (== 2)"

      - name: promotion_approve_without_submit_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Promotion
          - errors[ERR_PROMOTION_STATE_INVALID]
          - endpoints[POST /distribution/promotions/{id}/approve]
        distinguishing_aspect: |
          On the approval axis only SUBMITTED accepts approve/reject: calling approve on a DRAFT
          promotion returns HTTP 409 ERR_PROMOTION_STATE_INVALID, leaves approved_by_user_id null, and
          does not touch the independent distribution axis.
        test_recipe:
          setup:
            - "Property HTL-SFO with ACTIVE rate plan BAR carrying a DRAFT promotion MEMBER10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/rate-plans/${bar_id}/promotions"
              payload: { code: "MEMBER10", promo_kind: "MEMBER_RATE", discount_kind: "PERCENT", discount_bp: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: RevenueManager
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /distribution/promotions/${promo_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/promotions/${promo_id}/reject"
              payload: { reason: "too aggressive" }
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/promotions/${promo_id}/revise"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
          assert:
            - "approve on DRAFT: HTTP 409 with data.error_id == ERR_PROMOTION_STATE_INVALID; approved_by_user_id stays null"
            - "reject on DRAFT: HTTP 409 with data.error_id == ERR_PROMOTION_STATE_INVALID; reject_reason stays null"
            - "revise on DRAFT (revise requires REJECTED): HTTP 409 with data.error_id == ERR_PROMOTION_STATE_INVALID; revision_count stays 0"
            - "Promotion.${promo_id} still == { approval_status: DRAFT, distribution_status: NOT_LOADED, version: 1 } after all three refusals"

      - name: revalidate_moves_suspended_connection_to_degraded_without_restoring_allotments
        claim_type: side_effect_execution
        grounds:
          - state_machines.ChannelConnection.transitions[SUSPENDED->DEGRADED]
          - state_machines.ChannelAllocation.transitions[OPEN->RECALLED]
          - endpoints[POST /distribution/channel-connections/{id}/revalidate]
        distinguishing_aspect: |
          revalidate lands on DEGRADED - never HEALTHY - with consecutive_failures set to
          CONNECTION_FAILURE_SUSPEND_THRESHOLD - 1 == 2, so ONE further ERROR heartbeat re-suspends;
          and the allotments recalled by the suspension stay RECALLED, which the inventory day proves
          by keeping allocated_units 0.
        test_recipe:
          setup:
            - "Property HTL-SFO (overbooking_pct_bp 1000) with room type KING capacity 10 -> ceiling 11 and inventory day 2026-09-10 open."
            - "Channel OTA1 with a HEALTHY connection and an OPEN 4-unit allotment over 2026-09-10, so the day reads allocated 4 / committed 0 / shared 7."
            - "Three ERROR heartbeats then drive the connection to SUSPENDED, which recalls the allotment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "GET /distribution/room-types/${king_id}"
              payload: {}
              as: RevenueManager
              captures: { king_v1: $.data.version }
            - call: "POST /distribution/room-types/${king_id}/allocations"
              payload: { channel_id: "${ota1_id}", allocated_units: 4, start_date: "2026-09-10", end_date: "2026-09-10", expected_room_type_version: "${king_v1}" }
              as: RevenueManager
              captures: { alloc_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
          trigger:
            - call: "POST /distribution/channel-connections/${conn_id}/revalidate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "AUTH_REJECTED" }
              as: ChannelOpsEngineer
          assert:
            - "After setup: ChannelConnection.${conn_id}.connection_state == SUSPENDED with consecutive_failures == 3, ChannelAllocation.${alloc_id}.allocation_state == RECALLED with recalled_at == 2026-08-25T00:00:00.000Z, and InventoryDay.${inv_id} == { allocated_units: 0, committed_units: 0, shared_pool_units: 11 }"
            - "After revalidate: ChannelConnection.${conn_id}.connection_state == DEGRADED (NOT HEALTHY) with consecutive_failures == 2 and suspended_at cleared to null"
            - "ChannelAllocation.${alloc_id} is still RECALLED and InventoryDay.${inv_id}.allocated_units is still 0 - revalidation never restores recalled inventory"
            - "After the single further ERROR heartbeat: connection_state == SUSPENDED again with consecutive_failures == 3 and last_failure_code == AUTH_REJECTED - one failure was enough because revalidate parks the streak at the threshold minus one"

      - name: mapping_cycles_verified_errored_verified_after_parity_repair
        claim_type: cyclic
        grounds:
          - state_machines.ChannelMapping
          - calculations.job_dispatch_resolution
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          ChannelMapping is cyclic: a PARITY_BLOCKED job rejection knocks a VERIFIED mapping to
          ERRORED, and after the content is repaired the SAME verify endpoint that first produced
          VERIFIED accepts ERRORED -> VERIFIED, so the mapping returns to the state it left.
        test_recipe:
          setup:
            - "Property HTL-SFO (required_image_count 5), room type KING with master hash 'kingv1' and 5 master images, channel OTA1 with a HEALTHY connection."
            - "Rate plan BAR ACTIVE at 25000 (version 2) with one VERIFIED, IN_PARITY mapping BAR x OTA1 x KING."
            - "A PATCH on BAR queues one RATE batch with a single QUEUED job; the mapping's content is then broken to 4 images, so parity_state == OUT_OF_PARITY while mapping_state is still VERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
              captures: { bar_v: $.data.version }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${bar_v}", ceiling_amount_cents: 41000 }
              as: RevenueManager
            - call: "GET /distribution/distribution-batches"
              payload: { property_id: "${prop_id}", payload_kind: "RATE" }
              as: ChannelOpsEngineer
              captures: { batch_id: "$.data[0].id" }
            - call: "PATCH /distribution/channel-mappings/${map_id}/content"
              payload: { content_image_count: 4 }
              as: ChannelOpsEngineer
          trigger:
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
            - call: "PATCH /distribution/channel-mappings/${map_id}/content"
              payload: { content_image_count: 5 }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
          assert:
            - "Dispatch: the single child job ends REJECTED with failure_reason == PARITY_BLOCKED and applied_at == null; DistributionBatch.${batch_id} == { batch_state: FAILED, total_jobs: 1, applied_jobs: 0, rejected_jobs: 1 }"
            - "The rejection knocks the mapping down: ChannelMapping.${map_id}.mapping_state == ERRORED with last_pushed_rate_cents still null"
            - "PATCH content back to 5 images: parity_state == IN_PARITY but mapping_state is STILL ERRORED - repairing content does not re-verify by itself"
            - "verify: HTTP 200 with ChannelMapping.${map_id}.mapping_state == VERIFIED again and verified_at == 2026-08-25T00:00:00.000Z - the cycle closes"

      - name: reservation_cancel_twice_second_attempt_rejected
        claim_type: idempotency
