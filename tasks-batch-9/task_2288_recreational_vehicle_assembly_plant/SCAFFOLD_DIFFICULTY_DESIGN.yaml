# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2288 Recreational Vehicle Assembly Plant
#
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every numeric literal in an `assert:` was computed against the §1.3 formula
# and its constants with Decimal ROUND_HALF_UP.
# The logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: invoice_provisional_at_submit_versus_final_at_ship_diverge_on_one_unit
        grounds:
          - calculations.dealer_invoice_amount
          - entities.UnitOrder.fields.provisional_invoice_cents
          - entities.UnitOrder.fields.final_invoice_cents
          - entities.UnitBuild.fields.actual_station_hours
          - entities.UnitBuild.fields.rework_count
          - entities.UnitBuild.fields.defect_points_total
          - state_machines.UnitOrder.DRAFT_to_CONFIG_VALIDATED
          - state_machines.UnitOrder.BUILT_to_SHIPPED
        distinguishing_aspect: |
          This dual variant lives in the money domain on UnitOrder: the same unit
          is priced twice from identical discount lines, and the FINAL_AT_SHIP
          variant differs from PROVISIONAL_AT_SUBMIT by exactly 63460 cents of
          build-derived overtime, rework and quality-credit adjustments that do
          not exist at submit time.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Supplier SUP-CH (CHASSIS) and SUP-APP (APPLIANCE), both ACTIVE at quality_score 100.00."
            - "FloorPlan FP-3410: CLASS_A, 34 ft, base_msrp 18500000, base_station_hours 46.00, dry 22400 lb, gvwr 26000 lb, wheelbase 242 in, 50 A, 90 gal."
            - "Five ACTIVE options: OPT-AC2, OPT-WASH, OPT-SOLAR, OPT-INV, OPT-BATT."
            - "Dealer D-WEST: region WEST, allocation_share_bp 1500, credit limit 15274000, goodwill budget 500000."
            - "ProductionLine LINE-A: CLASS_A, 240.00 h/day, 4 units/day. TestBooth BOOTH-1: WATER_TEST, 1 bay, 30 min turnaround."
            - "One CLASS_A chassis, wheelbase 242, gvwr 26000 received at 2026-08-01."
            - "One APPLIANCE component lot of 20 pieces."
            - "The order is STOCK, submitted (provisional 16122725), floor-plan funded, slotted on LINE-A for 2026-08-05, chassis matched, released to line."
            - "The build consumes 75.00 station hours against a required 71.24, fails its first water test on a leak, passes the retest CONDITIONAL at 6 defect points and passes PDI at 3 defect points, giving rework_count 1 and defect_points_total 9."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-CH", name: "Cascade Chassis Works", component_categories: ["CHASSIS"] }
              as: PlantAdmin
              captures: { sup_ch_id: $.data.id }
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-APP", name: "Northline Appliance", component_categories: ["APPLIANCE"] }
              as: PlantAdmin
              captures: { sup_app_id: $.data.id }
            - call: "POST /floor-plans"
              payload: { model_code: "FP-3410", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 46.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
              as: PlantAdmin
              captures: { fp_a_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-AC2", category: "ELECTRICAL", install_station: "ROOF_SET", price_cents: 385000, weight_lbs: 95, added_station_hours: 2.50, amp_draw: 16, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_ac2_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-WASH", category: "APPLIANCE", install_station: "APPLIANCE_INSTALL", price_cents: 245500, weight_lbs: 180, added_station_hours: 3.00, amp_draw: 12, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_wash_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-BATT", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 415000, weight_lbs: 130, added_station_hours: 2.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_batt_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-INV", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 165000, weight_lbs: 45, added_station_hours: 1.50, amp_draw: 0, water_demand_gal: 0, requires_option_codes: ["OPT-BATT"] }
              as: PlantAdmin
              captures: { opt_inv_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-SOLAR", category: "ELECTRICAL", install_station: "ROOF_SET", price_cents: 325000, weight_lbs: 70, added_station_hours: 4.00, amp_draw: 0, water_demand_gal: 0, requires_option_codes: ["OPT-INV"] }
              as: PlantAdmin
              captures: { opt_solar_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-WEST", region: "WEST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 15274000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_w_id: $.data.id }
            - call: "POST /production-lines"
              payload: { line_code: "LINE-A", chassis_class_supported: "CLASS_A", daily_station_hour_capacity: 240.00, max_units_per_day: 4 }
              as: PlantAdmin
              captures: { line_a_id: $.data.id }
            - call: "POST /test-booths"
              payload: { booth_code: "BOOTH-1", booth_type: "WATER_TEST", bay_count: 1, turnaround_minutes: 30 }
              as: PlantAdmin
              captures: { booth1_id: $.data.id }
            - call: "POST /chassis-receipts"
              payload: { supplier_id: "${sup_ch_id}", chassis_serial: "CH-0001", chassis_class: "CLASS_A", gvwr_lbs: 26000, wheelbase_in: 242 }
              as: PlantAdmin
              captures: { ch1_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_app_id}", part_number: "WH-6G-2026", lot_code: "L-2211", category: "APPLIANCE", quantity_received: 20 }
              as: PlantAdmin
              captures: { lot_app_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_w_id}", floor_plan_id: "${fp_a_id}", order_type: "STOCK", selected_option_ids: ["${opt_ac2_id}", "${opt_wash_id}", "${opt_solar_id}", "${opt_inv_id}", "${opt_batt_id}"], requested_delivery_date: "2026-09-15T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_w_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_w_id}"
            - call: "POST /unit-orders/${ord_id}/request-funding"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_w_id}"
            - call: "POST /unit-orders/${ord_id}/funding-decision"
              payload: { decision: "APPROVED" }
              as: PlantAdmin
              captures: { ord_v_funded: $.data.version }
            - call: "POST /unit-orders/${ord_id}/production-slots"
              payload: { line_id: "${line_a_id}", slot_date: "2026-08-05T00:00:00Z", expected_unit_order_version: "${ord_v_funded}" }
              as: ProductionScheduler
            - call: "POST /unit-orders/${ord_id}/match-chassis"
              payload: {}
              as: ProductionScheduler
            - call: "POST /unit-orders/${ord_id}/release-to-line"
              payload: {}
              as: ProductionScheduler
              captures: { build_id: $.data.id }
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "SIDEWALL_LAM", station_hours_used: 8.00 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "ROOF_SET", station_hours_used: 10.00 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "ROUGH_IN", station_hours_used: 14.00 }
              as: LineSupervisor
            - call: "POST /component-installations"
              payload: { unit_build_id: "${build_id}", component_lot_id: "${lot_app_id}", station: "APPLIANCE_INSTALL", quantity: 2 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "APPLIANCE_INSTALL", station_hours_used: 12.00 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "FINISH", station_hours_used: 9.00 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "WATER_TEST", station_hours_used: 2.00 }
              as: LineSupervisor
            - call: "POST /quality-inspections"
              payload: { unit_build_id: "${build_id}", inspection_type: "WATER_TEST", test_booth_id: "${booth1_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T10:00:00Z" }
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { insp_wt1_id: $.data.id }
            - call: "POST /quality-inspections/${insp_wt1_id}/complete"
              payload: { defect_points: 0, leak_detected: true }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "APPLIANCE_INSTALL", station_hours_used: 6.00 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "FINISH", station_hours_used: 4.00 }
              as: LineSupervisor
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "WATER_TEST", station_hours_used: 2.00 }
              as: LineSupervisor
            - call: "POST /quality-inspections"
              payload: { unit_build_id: "${build_id}", inspection_type: "WATER_TEST", test_booth_id: "${booth1_id}", window_start: "2026-08-05T11:00:00Z", window_end: "2026-08-05T12:00:00Z" }
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { insp_wt2_id: $.data.id }
            - call: "POST /quality-inspections/${insp_wt2_id}/complete"
              payload: { defect_points: 6, leak_detected: false }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "PDI", station_hours_used: 3.00 }
              as: LineSupervisor
            - call: "POST /quality-inspections"
              payload: { unit_build_id: "${build_id}", inspection_type: "PDI" }
              as: QualityInspector
              as_user_id: "qi-bob"
              captures: { insp_pdi_id: $.data.id }
            - call: "POST /quality-inspections/${insp_pdi_id}/complete"
              payload: { defect_points: 3, leak_detected: false }
              as: QualityInspector
              as_user_id: "qi-bob"
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "READY_TO_SHIP", station_hours_used: 5.00 }
              as: LineSupervisor
          trigger:
            - call: "POST /unit-orders/${ord_id}/ship"
              payload: {}
              as: ProductionScheduler
          assert:
            - "UnitOrder.${ord_id}.provisional_invoice_cents == 16122725"
            - "UnitOrder.${ord_id}.final_invoice_cents == 16186185"
            - "UnitOrder.${ord_id}.final_invoice_cents - UnitOrder.${ord_id}.provisional_invoice_cents == 63460"
            - "UnitOrder.${ord_id}.required_station_hours == 71.24"
            - "UnitBuild.${build_id}.actual_station_hours == 75.00"
            - "UnitBuild.${build_id}.rework_count == 1"
            - "UnitBuild.${build_id}.defect_points_total == 9"
            - "UnitOrder.${ord_id}.status == SHIPPED"
            - "UnitBuild.${build_id}.current_station == SHIPPED"
            - "UnitOrder.${ord_id}.financed_principal_cents == 14510453 (unchanged by the FINAL_AT_SHIP recomputation)"

      - name: supplier_score_rolling_window_and_lifetime_decay_diverge_at_day_ninety
        grounds:
          - calculations.supplier_quality_score
          - entities.Supplier.fields.quality_score
          - entities.Supplier.fields.supplier_status
          - entities.Supplier.fields.penalty_event_count
          - state_machines.RecallCampaign.DRAFT_to_OPEN
          - endpoints["GET /suppliers/{id}/scorecard"]
        distinguishing_aspect: |
          This dual variant lives in the supplier-risk domain on Supplier, not in
          the money domain: with two SAFETY campaigns aged exactly 90 days the
          ROLLING_90D score reads 100.00 because the window comparison is
          age_days < 90, while LIFETIME_CUMULATIVE reads 85.00 because the same
          two events keep half of their 15.0 weight forever.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Supplier SUP-APP (APPLIANCE) at quality_score 100.00, ACTIVE."
            - "Two APPLIANCE lots of the same part number WH-6G-2026 with lot codes L-1 and L-2, 10 pieces each."
            - "Two SAFETY recall campaigns, one per lot code, both OPENED at 2026-08-01T00:00:00Z, so both penalty events carry weight 15.0 and the rolling score sits on its ACTIVE boundary at 70.00."
            - "The clock then moves to 2026-10-30T00:00:00Z, exactly 90 days after both openings."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-APP", name: "Northline Appliance", component_categories: ["APPLIANCE"] }
              as: PlantAdmin
              captures: { sup_app_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_app_id}", part_number: "WH-6G-2026", lot_code: "L-1", category: "APPLIANCE", quantity_received: 10 }
              as: PlantAdmin
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_app_id}", part_number: "WH-6G-2026", lot_code: "L-2", category: "APPLIANCE", quantity_received: 10 }
              as: PlantAdmin
            - call: "POST /recall-campaigns"
              payload: { supplier_id: "${sup_app_id}", campaign_code: "RC-2026-01", part_number: "WH-6G-2026", lot_codes: ["L-1"], severity: "SAFETY" }
              as: RecallCoordinator
              captures: { rc1_id: $.data.id }
            - call: "POST /recall-campaigns/${rc1_id}/open"
              payload: {}
              as: RecallCoordinator
            - call: "POST /recall-campaigns"
              payload: { supplier_id: "${sup_app_id}", campaign_code: "RC-2026-02", part_number: "WH-6G-2026", lot_codes: ["L-2"], severity: "SAFETY" }
              as: RecallCoordinator
              captures: { rc2_id: $.data.id }
            - call: "POST /recall-campaigns/${rc2_id}/open"
              payload: {}
              as: RecallCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "GET /suppliers/${sup_app_id}/scorecard"
              payload: {}
              as: PlantAdmin
          assert:
            - "response.data.rolling_quality_score == 100.00"
            - "response.data.lifetime_quality_score == 85.00"
            - "response.data.supplier_status == ACTIVE"
            - "response.data.penalty_event_count == 2"
            - "response.data.open_recall_count == 2"
            - "Supplier.${sup_app_id}.quality_score == 100.00 (the persisted field follows the ROLLING_90D variant only)"

  - rule_id: combinatorial_formula
    instances:

      - name: invoice_rounds_each_discount_line_before_summing_costing_two_cents
        grounds:
          - calculations.dealer_invoice_amount
          - entities.UnitOrder.fields.provisional_invoice_cents
          - entities.OptionItem.fields.category
          - state_machines.UnitOrder.DRAFT_to_CONFIG_VALIDATED
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order is observable: the five option
          lines each land on an exact half cent, so rounding per line and then
          summing yields 15704925 while summing the raw products and rounding
          once yields 15704923, a pinned 2-cent divergence that no other
          calculation in this scaffold reproduces.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "FloorPlan FP-3410 with base_msrp 18500000; STOCK order so the base-unit discount is 2200 bp."
            - "Five options priced so every discounted line ends in .5 cents: OPT-AC2 385000 and OPT-BATT 415000 and OPT-INV 165000 and OPT-SOLAR 325000 at 1725 bp, OPT-WASH 245500 at 1550 bp."
            - "Dealer D-WEST in region WEST, so freight is 180000 + 4200*34 + 95000 = 417800."
            - "The order is in DRAFT with all five options selected."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-3410", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 46.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
              as: PlantAdmin
              captures: { fp_a_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-AC2", category: "ELECTRICAL", install_station: "ROOF_SET", price_cents: 385000, weight_lbs: 95, added_station_hours: 2.50, amp_draw: 16, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_ac2_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-WASH", category: "APPLIANCE", install_station: "APPLIANCE_INSTALL", price_cents: 245500, weight_lbs: 180, added_station_hours: 3.00, amp_draw: 12, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_wash_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-BATT", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 415000, weight_lbs: 130, added_station_hours: 2.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_batt_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-INV", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 165000, weight_lbs: 45, added_station_hours: 1.50, amp_draw: 0, water_demand_gal: 0, requires_option_codes: ["OPT-BATT"] }
              as: PlantAdmin
              captures: { opt_inv_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-SOLAR", category: "ELECTRICAL", install_station: "ROOF_SET", price_cents: 325000, weight_lbs: 70, added_station_hours: 4.00, amp_draw: 0, water_demand_gal: 0, requires_option_codes: ["OPT-INV"] }
              as: PlantAdmin
              captures: { opt_solar_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-WEST", region: "WEST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 15274000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_w_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_w_id}", floor_plan_id: "${fp_a_id}", order_type: "STOCK", selected_option_ids: ["${opt_ac2_id}", "${opt_wash_id}", "${opt_solar_id}", "${opt_inv_id}", "${opt_batt_id}"], requested_delivery_date: "2026-09-15T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_w_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_w_id}"
          assert:
            - "UnitOrder.${ord_id}.provisional_invoice_cents == 16122725"
            - "UnitOrder.${ord_id}.provisional_invoice_cents != 16122723 (the sum-then-round result is wrong by 2 cents)"
            - "UnitOrder.${ord_id}.option_price_total_cents == 1535500"
            - "UnitOrder.${ord_id}.status == CONFIG_VALIDATED"
            - "UnitOrder.${ord_id}.locked_floor_plan_version == 1"

      - name: warranty_reimbursement_tier_and_goodwill_and_chargeback_pin_evaluation_order
        grounds:
          - calculations.warranty_claim_reimbursement
          - entities.WarrantyClaim.fields.authority_tier
          - entities.WarrantyClaim.fields.goodwill_authorized_cents
          - entities.WarrantyClaim.fields.total_reimbursement_cents
          - entities.WarrantyClaim.fields.supplier_chargeback_cents
          - entities.Dealer.fields.goodwill_used_cents
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency pinned by explicit step order:
          authority_tier is keyed on the schedule subtotal (step 3), the goodwill
          percentage ceiling 21100 is keyed on that same subtotal, and the
          supplier chargeback 75960 is keyed on the step-6 total that already
          includes the goodwill, so evaluating tier or chargeback earlier changes
          the payout.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Supplier SUP-APP (APPLIANCE) ACTIVE at quality_score 100.00, so the chargeback rate is 6000 bp."
            - "Dealer D-WEST with goodwill_budget_cents 500000 and goodwill_used_cents 0."
            - "A delivered unit for D-WEST shipped at 2026-08-01T00:00:00Z, so the claim is in warranty."
            - "An APPLIANCE component lot of 20 pieces from SUP-APP."
            - "A SUBMITTED claim: claim_type APPLIANCE, labor_hours 3.50 (under the 8.0 h cap), parts_cost_cents 68000, goodwill_requested_cents 60000."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-APP", name: "Northline Appliance", component_categories: ["APPLIANCE"] }
              as: PlantAdmin
              captures: { sup_app_id: $.data.id }
            - call: "POST /floor-plans"
              payload: { model_code: "FP-3410", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 46.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
              as: PlantAdmin
              captures: { fp_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-WEST", region: "WEST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 15274000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_w_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_app_id}", part_number: "WH-6G-2026", lot_code: "L-2211", category: "APPLIANCE", quantity_received: 20 }
              as: PlantAdmin
              captures: { lot_app_id: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_w_id}", floor_plan_id: "${fp_a_id}", shipped_at: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              captures: { build_id: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${build_id}", claim_type: "APPLIANCE", labor_hours: 3.50, parts_cost_cents: 68000, narrative: "Water heater failed on delivery inspection", component_lot_id: "${lot_app_id}", goodwill_requested_cents: 60000 }
              as: DealerPrincipal
              as_user_id: "${dlr_w_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVED" }
              as: WarrantyAdministrator
              as_user_id: "wa-carol"
          assert:
            - "WarrantyClaim.${claim_id}.labor_reimbursement_cents == 27300"
