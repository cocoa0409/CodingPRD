            - "response status == 409"

      - name: cancel_blocked_by_open_claim
        claim_type: Precondition Enforcement
        grounds: [state_machines.Policy.ACTIVE_to_CANCELLED, "validations[priority=20]", "errors[ERR_OPEN_CLAIM_BLOCKS_CANCEL]"]
        distinguishing_aspect: "Cancelling a policy with a claim in UNDER_REVIEW returns ERR_OPEN_CLAIM_BLOCKS_CANCEL (409)."
