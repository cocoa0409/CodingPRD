# =============================================================================
# PRD Benchmark Seed Tables — Bariatric / Weight-Loss Surgery Program
# Difficulty: Expert
# =============================================================================

scenario: |
  Bariatric / Weight-Loss Surgery Program: candidacy & BMI/comorbidity criteria,
  insurance-required supervised-diet & psych clearance, pre-op education & milestone
  checklist, surgery scheduling & case bundle, nutrition & follow-up visit series,
  complication & readmission, self-pay/financing, outcome registry

domain_name: bariatric-weight-loss-surgery
# Flat topology: multiple top-level collections, no shared URL parent. api_prefix is
# empty so every collection (/programs, /patients, /surgery-cases, /operating-rooms,
# /surgeons, /insurance-plans) is its own root resource.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting of one business aggregate inside
  # another in the URL path. Program is the hub; clearances/surgery/financing reference it.

  state_machine_shape: branching
  # Program candidacy forks ELIGIBLE|INELIGIBLE; SurgeryCase forks COMPLETED|CANCELLED;
  # PsychEvaluation cycles DEFERRED->PENDING; Program cycles POST_OP<->READMITTED.

  relationship_patterns:
    - one_to_many        # Program -> (DietVisits, PsychEvals, NutritionClearances, Milestones, FollowUpVisits, FinancingPlans, SurgeryCases)
    - cross_aggregate    # SurgeryCase references OperatingRoom + Surgeon (config aggregates)

  role_model: peer_roles
  # ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist,
  # Surgeon, SystemAdmin each own distinct resource types; Surgeon is entity-backed
  # with ownership checks on the case they operate.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number; human-facing patient identifier"
      - name: full_name
        type: string
        source: input
        description: "Patient legal name"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD)"
      - name: sex
        type: enum
        source: input
        description: "Biological sex; selects the ideal-body-weight formula variant"
        constraints: "one of {MALE, FEMALE}"
      - name: height_cm
        type: number
        source: input
        description: "Standing height in centimetres; denominator of BMI and IBW"
        constraints: "> 0"
      - name: baseline_weight_kg
        type: number
        source: input
        description: "Intake weight in kilograms; baseline for BMI and %EWL"
        constraints: "> 0"

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - name: plan_name
        type: string
        source: input
        description: "Payer plan display name"
      - name: payer_code
        type: string
        source: input
        description: "Short payer identifier code"
      - name: required_supervised_diet_months
        type: integer
        source: input
        description: "Consecutive attended monthly supervised-diet visits the payer requires before authorization"
        constraints: ">= 0"
      - name: requires_psych_clearance
        type: boolean
        source: input
        default: true
        description: "Whether a CLEARED psychological evaluation is mandatory"
      - name: requires_nutrition_clearance
        type: boolean
        source: input
        default: true
        description: "Whether a CLEARED nutrition clearance is mandatory"
      - name: bmi_floor_no_comorbidity
        type: number
        source: input
        default: 40.0
        description: "BMI at or above which the patient qualifies with no comorbidity"
      - name: bmi_floor_with_comorbidity
        type: number
        source: input
        default: 35.0
        description: "BMI at or above which the patient qualifies IF a qualifying comorbidity is present"
      - name: qualifying_comorbidities
        type: array
        source: input
        description: "Comorbidity enum values this payer accepts as qualifying"
        constraints: "subset of {TYPE_2_DIABETES, HYPERTENSION, OSA, NAFLD, DYSLIPIDEMIA, GERD, OSTEOARTHRITIS}"

  - name: OperatingRoom
    parent: null
    common_fields: true
    fields:
      - name: room_code
        type: string
        source: input
        description: "Operating-room label"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        default: 30
        description: "Minutes of mandatory cleaning/turnover that must separate two cases in this room"
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        default: OPEN
        description: "Room availability; CLOSED rooms reject scheduling"
        constraints: "one of {OPEN, CLOSED}"

  - name: Surgeon
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Surgeon name"
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier"
      - name: credentialed_procedures
        type: array
        source: input
        description: "Procedure enum values this surgeon is credentialed to perform"
        constraints: "subset of {SLEEVE_GASTRECTOMY, GASTRIC_BYPASS, ADJUSTABLE_BAND}"

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: payment_pathway
        type: enum
        source: input
        description: "Funding route; drives clearance requirements and financing eligibility"
        constraints: "one of {INSURANCE, SELF_PAY}"
      - name: insurance_plan_id
        type: string
        source: input
        default: null
        description: "FK -> InsurancePlan.id; REQUIRED when payment_pathway=INSURANCE, MUST be absent/null when SELF_PAY"
      - name: comorbidities
        type: array
        source: input
        description: "Documented comorbidity enum values for this patient"
        constraints: "subset of {TYPE_2_DIABETES, HYPERTENSION, OSA, NAFLD, DYSLIPIDEMIA, GERD, OSTEOARTHRITIS}"
      - name: baseline_bmi
        type: number
        source: computed
        description: "Snapshot BMI computed from the patient's height_cm & baseline_weight_kg at program creation (calc: baseline_bmi)"
      - name: baseline_weight_kg
        type: number
        source: computed
        description: "Snapshot of Patient.baseline_weight_kg at program creation; %EWL/%TWL baseline"
      - name: ideal_body_weight_kg
        type: number
        source: computed
        description: "Devine ideal body weight from patient height_cm & sex, snapshot at creation (calc: ideal_body_weight)"
      - name: candidacy_status
        type: enum
        source: computed
        default: UNDETERMINED
        description: "Result of candidacy review (calc: candidacy_determination)"
        constraints: "one of {UNDETERMINED, QUALIFIED, NOT_QUALIFIED}"
      - name: qualifying_reason
        type: enum
        source: computed
        default: null
        description: "Why candidacy resolved as it did (calc: candidacy_determination)"
        constraints: "one of {BMI_40_PLUS, BMI_35_PLUS_COMORBIDITY, NOT_MET} or null before review"
      - name: status
        type: enum
        source: system
        default: SCREENING
        description: "Program lifecycle state (see state machine)"
        constraints: "one of {SCREENING, CANDIDACY_REVIEW, ELIGIBLE, INELIGIBLE, CLEARANCE_IN_PROGRESS, CLEARED, SURGERY_SCHEDULED, POST_OP, READMITTED, COMPLETED}"
      - name: clearances_complete
        type: boolean
        source: computed
        default: false
        description: "Derived gate: psych CLEARED + nutrition CLEARED + all milestones complete + (INSURANCE: diet months met) (calc: clearances_complete)"
      - name: readmission_count
        type: integer
        source: system
        default: 0
        description: "Cumulative number of readmission-triggering complications logged"
      - name: active_complication_count
        type: integer
        source: system
        default: 0
        description: "Conserved quantity: count of this program's complications currently in OPEN status"
      - name: amount_collected_cents
        type: integer
        source: system
        default: 0
        description: "Self-pay money collected = down_payment of the current ACTIVE FinancingPlan"
      - name: amount_refunded_cents
        type: integer
        source: system
        default: 0
        description: "Self-pay money refunded on surgery cancellation"
      - name: amount_forfeited_cents
        type: integer
        source: system
        default: 0
        description: "Self-pay money retained as cancellation fee on surgery cancellation"

  - name: SupervisedDietVisit
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: month_index
        type: integer
        source: input
        description: "Which required month (1-based) this visit satisfies"
        constraints: ">= 1"
      - name: visit_date
        type: string
        source: input
        description: "ISO 8601 date of the supervised-diet visit"
      - name: weight_kg
        type: number
        source: input
        description: "Weight recorded at this visit"
        constraints: "> 0"
      - name: attended
        type: boolean
        source: input
        default: true
        description: "Whether the patient attended; only attended visits count toward the requirement"

  - name: PsychEvaluation
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: clinician_note
        type: string
        source: input
        default: null
        description: "Free-text behavioral-health note"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Evaluation lifecycle (see state machine)"
        constraints: "one of {PENDING, CLEARED, DEFERRED}"
      - name: deferral_reason
        type: string
        source: system
        default: null
        description: "Reason captured when a decision defers the evaluation"
      - name: reevaluation_count
        type: integer
        source: system
        default: 0
        description: "Number of times this evaluation was re-opened from DEFERRED back to PENDING"

  - name: NutritionClearance
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: decision
        type: enum
        source: input
        description: "Dietitian's clearance decision, set at creation"
        constraints: "one of {CLEARED, NOT_CLEARED}"
      - name: diet_readiness_score
        type: integer
        source: input
        description: "0-100 readiness score supporting the decision"
        constraints: "0..100"

  - name: EducationMilestone
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: milestone_code
        type: enum
        source: input
        description: "Which pre-op education milestone; unique per program"
        constraints: "one of {NUTRITION_CLASS, EXERCISE_ORIENTATION, SURGERY_RISKS_CONSENT, POST_OP_DIET_EDUCATION}"
      - name: completed
        type: boolean
        source: input
        default: false
        description: "Whether this milestone is complete"
      - name: completed_date
        type: string
        source: input
        default: null
        description: "ISO 8601 date the milestone was completed"

  - name: SurgeryCase
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: operating_room_id
        type: string
        source: input
        description: "FK -> OperatingRoom.id"
      - name: surgeon_id
        type: string
        source: input
        description: "FK -> Surgeon.id"
      - name: procedure_type
        type: enum
        source: input
        description: "Planned procedure"
        constraints: "one of {SLEEVE_GASTRECTOMY, GASTRIC_BYPASS, ADJUSTABLE_BAND}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the OR booking"
      - name: scheduled_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the OR booking; must be > scheduled_start"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Case lifecycle (see state machine)"
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
      - name: estimated_bundle_cents
        type: integer
        source: computed
        description: "Provisional self-pay case bundle at scheduling (calc: case_bundle_price variant=estimate); 0 for INSURANCE programs"
      - name: actual_or_minutes
        type: integer
        source: input
        default: null
        description: "Actual operating-room minutes, supplied at completion; drives the final bundle"
        constraints: ">= 0"
      - name: final_bundle_cents
        type: integer
        source: computed
        default: null
        description: "Final self-pay case bundle at completion (calc: case_bundle_price variant=final); null until COMPLETED"
      - name: cancellation_reason
        type: string
        source: input
        default: null
        description: "Free-text reason recorded on cancel"

  - name: Complication
    parent: null
    common_fields: true
    fields:
      - name: surgery_case_id
        type: string
        source: input
        description: "FK -> SurgeryCase.id"
      - name: complication_type
        type: enum
        source: input
        description: "Category of complication"
        constraints: "one of {LEAK, BLEEDING, STRICTURE, INFECTION, DVT, OTHER}"
      - name: severity
        type: enum
        source: input
        description: "Clinical severity"
        constraints: "one of {MINOR, MODERATE, SEVERE}"
      - name: requires_readmission
        type: boolean
        source: input
        description: "Whether this complication triggers a hospital readmission"
      - name: onset_date
        type: string
        source: input
        description: "ISO 8601 date of complication onset"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Complication lifecycle (see state machine)"
        constraints: "one of {OPEN, RESOLVED}"

  - name: FollowUpVisit
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: interval_code
        type: enum
        source: system
        description: "Which post-op follow-up in the auto-generated series"
        constraints: "one of {WEEK_2, WEEK_6, MONTH_3, MONTH_6, MONTH_12}"
      - name: scheduled_date
        type: string
        source: system
        description: "ISO 8601 date computed from surgery completion date + interval offset"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Visit lifecycle (see state machine)"
        constraints: "one of {SCHEDULED, COMPLETED}"
      - name: recorded_weight_kg
        type: number
        source: input
        default: null
        description: "Weight recorded when the visit is completed"
        constraints: "> 0"
      - name: ewl_pct_ibw
        type: number
        source: computed
        default: null
        description: "%EWL against Devine ideal body weight (calc: weight_loss_outcome variant=ewl_ibw)"
      - name: ewl_pct_bmi25
        type: number
        source: computed
        default: null
        description: "%EWL against the BMI-25 reference weight (calc: weight_loss_outcome variant=ewl_bmi25)"

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: procedure_type
        type: enum
        source: input
        description: "Planned procedure priced by this financing plan"
        constraints: "one of {SLEEVE_GASTRECTOMY, GASTRIC_BYPASS, ADJUSTABLE_BAND}"
      - name: down_payment_cents
        type: integer
        source: input
        description: "Up-front payment collected at plan creation"
        constraints: ">= 0"
      - name: term_months
        type: integer
        source: input
        description: "Number of monthly installments"
        constraints: ">= 1"
      - name: apr_bps
        type: integer
        source: input
        description: "Annual percentage rate in basis points (1200 = 12%)"
        constraints: ">= 0"
      - name: bundle_price_cents
        type: integer
        source: computed
        description: "Self-pay bundle price for procedure_type at program.baseline_bmi (calc: case_bundle_price variant=estimate)"
      - name: interest_cents
        type: integer
        source: computed
        description: "Financing interest on the principal (calc: financing_schedule)"
      - name: installment_cents
        type: integer
        source: computed
        description: "Per-installment amount for installments 1..term_months-1 (calc: financing_schedule)"
      - name: final_installment_cents
        type: integer
        source: computed
        description: "Last installment; absorbs the rounding remainder (calc: financing_schedule)"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE for the current plan; a superseding plan flips the prior to SUPERSEDED"
        constraints: "one of {ACTIVE, SUPERSEDED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: SCREENING
    terminal_states: [INELIGIBLE, COMPLETED]
    transitions:
      - from: SCREENING
        to: CANDIDACY_REVIEW
        trigger: "POST /programs/{id}/candidacy-review"
        actor: ProgramCoordinator
        preconditions:
          - "program.status == SCREENING"
        side_effects:
          - "run calc candidacy_determination over baseline_bmi, comorbidities, and plan floors"
          - "set candidacy_status and qualifying_reason"
          - "increments Program.version by 1"
        note: "Auto-advances to ELIGIBLE or INELIGIBLE in the same request per candidacy_status."
      - from: CANDIDACY_REVIEW
        to: ELIGIBLE
        trigger: "system (same request as candidacy-review) when candidacy_status==QUALIFIED"
        actor: system
        preconditions:
          - "candidacy_status == QUALIFIED"
        side_effects: []
      - from: CANDIDACY_REVIEW
        to: INELIGIBLE
        trigger: "system (same request as candidacy-review) when candidacy_status==NOT_QUALIFIED"
        actor: system
        preconditions:
          - "candidacy_status == NOT_QUALIFIED"
        side_effects: []
        note: "Terminal; a NOT_QUALIFIED program cannot proceed to clearance."
      - from: ELIGIBLE
        to: CLEARANCE_IN_PROGRESS
        trigger: "POST /programs/{id}/request-clearance"
        actor: ProgramCoordinator
        preconditions:
          - "program.status == ELIGIBLE"
        side_effects:
          - "increments Program.version by 1"
        note: "Opens the window in which psych/nutrition/diet/milestone artifacts may be added."
      - from: CLEARANCE_IN_PROGRESS
        to: CLEARED
        trigger: "POST /programs/{id}/finalize-clearance"
        actor: ProgramCoordinator
        preconditions:
          - "program.status == CLEARANCE_IN_PROGRESS"
          - "clearances_complete == true (calc: clearances_complete; else ERR_CLEARANCES_INCOMPLETE) — depends on PsychEvaluation.status==CLEARED and NutritionClearance.decision==CLEARED (cross-entity)"
        side_effects:
          - "recompute clearances_complete"
          - "increments Program.version by 1"
      - from: CLEARED
        to: SURGERY_SCHEDULED
        trigger: "POST /programs/{id}/surgery-cases"
        actor: ProgramCoordinator
        preconditions:
          - "program.status == CLEARED (else ERR_PROGRAM_NOT_CLEARED)"
          - "expected_program_version matches program.version (else ERR_STALE_PROGRAM_VERSION)"
        side_effects:
          - "create SurgeryCase in SCHEDULED with estimated_bundle_cents (calc: case_bundle_price variant=estimate)"
          - "increments Program.version by 1"
      - from: SURGERY_SCHEDULED
        to: CLEARED
        trigger: "POST /surgery-cases/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "the program's current SurgeryCase.status == SCHEDULED"
        side_effects:
          - "SurgeryCase -> CANCELLED; release OR-room and surgeon interval"
          - "if SELF_PAY and amount_collected_cents>0: run refund (calc: cancellation_refund); set amount_refunded_cents, amount_forfeited_cents"
          - "increments Program.version by 1"
        note: "Program returns to CLEARED so a replacement case can be scheduled."
      - from: SURGERY_SCHEDULED
        to: POST_OP
        trigger: "POST /surgery-cases/{id}/complete (cascade hop 1->2)"
        actor: Surgeon
        preconditions:
          - "the program's current SurgeryCase.status == SCHEDULED"
        side_effects:
          - "CASCADE hop 2: caused by SurgeryCase COMPLETED; move Program to POST_OP"
          - "CASCADE hop 3: entering POST_OP generates the FollowUpVisit series (5 visits WEEK_2..MONTH_12) dated off surgery completion date; scheduled_date = completion date + INTERVAL_OFFSET_DAYS[interval_code] where INTERVAL_OFFSET_DAYS = { WEEK_2: 14, WEEK_6: 42, MONTH_3: 90, MONTH_6: 180, MONTH_12: 365 }"
          - "CASCADE hop 4: generation stamps each FollowUpVisit.scheduled_date and enrolls the program's outcome-registry baseline (baseline_weight_kg, ideal_body_weight_kg already snapshotted)"
          - "increments Program.version by 1"
      - from: POST_OP
        to: READMITTED
        trigger: "POST /surgery-cases/{id}/complications (cascade hop 1->2) when requires_readmission==true"
        actor: Surgeon
        preconditions:
          - "program.status == POST_OP"
          - "the complication's SurgeryCase belongs to this program"
        side_effects:
          - "CASCADE hop 2: caused by Complication created OPEN with requires_readmission==true; Program POST_OP -> READMITTED"
          - "increment readmission_count by 1; increment active_complication_count by 1"
          - "increments Program.version by 1"
      - from: READMITTED
        to: POST_OP
        trigger: "POST /complications/{id}/resolve (compensation) when no other OPEN complication remains"
        actor: Surgeon
        preconditions:
          - "program.status == READMITTED"
          - "after this resolution active_complication_count would reach 0"
        side_effects:
          - "Complication -> RESOLVED; decrement active_complication_count by 1"
          - "Program READMITTED -> POST_OP (compensates the readmission side of the cascade)"
          - "increments Program.version by 1"
      - from: POST_OP
        to: COMPLETED
        trigger: "system when the MONTH_12 FollowUpVisit is recorded (POST /follow-up-visits/{id}/record)"
        actor: system
        preconditions:
          - "program.status == POST_OP"
          - "the visit being recorded has interval_code == MONTH_12"
        side_effects:
          - "Program -> COMPLETED (outcome registry finalized)"
          - "increments Program.version by 1"

  - entity: PsychEvaluation
    initial_state: PENDING
    terminal_states: [CLEARED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /psych-evaluations/{id}/decision with decision=CLEARED"
        actor: BehavioralHealthClinician
        preconditions:
          - "psych_evaluation.status == PENDING"
        side_effects:
          - "recompute owning Program.clearances_complete"
      - from: PENDING
        to: DEFERRED
        trigger: "POST /psych-evaluations/{id}/decision with decision=DEFERRED"
        actor: BehavioralHealthClinician
        preconditions:
          - "psych_evaluation.status == PENDING"
        side_effects:
          - "set deferral_reason"
          - "recompute owning Program.clearances_complete"
      - from: DEFERRED
        to: PENDING
        trigger: "POST /psych-evaluations/{id}/reevaluate"
        actor: BehavioralHealthClinician
        preconditions:
          - "psych_evaluation.status == DEFERRED"
        side_effects:
          - "increment reevaluation_count by 1"
          - "clear deferral_reason"
        note: "Non-linear cycle: DEFERRED -> PENDING lets the evaluation be re-decided."

  - entity: SurgeryCase
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /surgery-cases/{id}/complete"
        actor: Surgeon
        preconditions:
          - "surgery_case.status == SCHEDULED"
          - "acting Surgeon owns the case: X-User-ID == surgery_case.surgeon_id"
        side_effects:
          - "set actual_or_minutes; compute final_bundle_cents (calc: case_bundle_price variant=final)"
          - "CASCADE origin: bubbles up to Program (SURGERY_SCHEDULED -> POST_OP -> follow-up series)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /surgery-cases/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "surgery_case.status == SCHEDULED"
        side_effects:
          - "set cancellation_reason; release OR-room and surgeon interval"
          - "bubble up to Program: SURGERY_SCHEDULED -> CLEARED; trigger refund if SELF_PAY"

  - entity: Complication
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /complications/{id}/resolve"
        actor: Surgeon
        preconditions:
          - "complication.status == OPEN"
        side_effects:
          - "decrement owning Program.active_complication_count by 1"
          - "if program.status == READMITTED and active_complication_count reaches 0: Program READMITTED -> POST_OP"

  - entity: FollowUpVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /follow-up-visits/{id}/record"
        actor: Dietitian
        preconditions:
          - "follow_up_visit.status == SCHEDULED"
        side_effects:
          - "set recorded_weight_kg; compute ewl_pct_ibw and ewl_pct_bmi25 (calc: weight_loss_outcome)"
          - "if interval_code == MONTH_12 and program.status == POST_OP: Program -> COMPLETED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: financing-plan-supersede-stale-program
    parent_entity: Program
    write_endpoint: "POST /programs/{id}/financing-plan"
    occ_field: "expected_program_version"
    description: |
      Creating a FinancingPlan against a Program whose version has advanced since
      the client last observed it is rejected. A new financing plan legitimately
      supersedes the prior ACTIVE plan (re-financing is allowed from the same
      program state), so a request carrying a stale expected_program_version — one
      that did not observe the version bump from an earlier plan creation — is
      rejected on the stale-version check rather than by any state precondition.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: baseline_bmi
    trigger: "POST /programs (at program creation)"
    algorithm: threshold
    formula: |
      height_m = patient.height_cm / 100
      baseline_bmi = patient.baseline_weight_kg / (height_m ** 2)
    input_set: "the single Patient referenced by patient_id, using its height_cm and baseline_weight_kg at creation time"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: ideal_body_weight
    trigger: "POST /programs (at program creation)"
    algorithm: weighted_scoring
    formula: |
      inches_over_60 = (patient.height_cm / 2.54) - 60      # may be negative for short patients
      if patient.sex == MALE:  ideal_body_weight_kg = 50.0 + 2.3 * inches_over_60
      else:                    ideal_body_weight_kg = 45.5 + 2.3 * inches_over_60
    input_set: "the single Patient referenced by patient_id (height_cm, sex)"
    constants:
      MALE_BASE_KG: 50.0
      FEMALE_BASE_KG: 45.5
      KG_PER_INCH_OVER_60: 2.3
    precision: "3 decimal places, round_half_up (stored); used as denominator by weight_loss_outcome"

  - name: candidacy_determination
    trigger: "POST /programs/{id}/candidacy-review"
    algorithm: threshold
    formula: |
      # Floors: INSURANCE uses the plan's floors and qualifying set; SELF_PAY uses defaults below.
      floor_no  = plan.bmi_floor_no_comorbidity     if INSURANCE else DEFAULT_BMI_FLOOR_NO_COMORBIDITY
      floor_yes = plan.bmi_floor_with_comorbidity    if INSURANCE else DEFAULT_BMI_FLOOR_WITH_COMORBIDITY
      qual_set  = plan.qualifying_comorbidities       if INSURANCE else DEFAULT_QUALIFYING_COMORBIDITIES
      has_qualifying = (set(program.comorbidities) INTERSECT set(qual_set)) is non-empty
      if baseline_bmi >= floor_no:
          candidacy_status = QUALIFIED ; qualifying_reason = BMI_40_PLUS
      elif baseline_bmi >= floor_yes AND has_qualifying:
          candidacy_status = QUALIFIED ; qualifying_reason = BMI_35_PLUS_COMORBIDITY
      else:
          candidacy_status = NOT_QUALIFIED ; qualifying_reason = NOT_MET
    input_set: "the Program's baseline_bmi and comorbidities; the linked InsurancePlan floors/qual-set when INSURANCE, else the DEFAULT_* constants"
    constants:
      DEFAULT_BMI_FLOOR_NO_COMORBIDITY: 40.0
      DEFAULT_BMI_FLOOR_WITH_COMORBIDITY: 35.0
      DEFAULT_QUALIFYING_COMORBIDITIES: [TYPE_2_DIABETES, HYPERTENSION, OSA, NAFLD, DYSLIPIDEMIA]
    precision: "comparisons on baseline_bmi are exact at 1-decimal stored value; boundary is inclusive (>=)"
    note: "Non-linear: 3+ inputs (bmi, comorbidity set, plan floor pair) with conditional tier selection; GERD and OSTEOARTHRITIS are NOT in the default qualifying set."

  - name: supervised_diet_progress
    trigger: "read during POST /programs/{id}/finalize-clearance and inside clearances_complete"
    algorithm: aggregation
    formula: |
      required = plan.required_supervised_diet_months (INSURANCE) ; 0 for SELF_PAY
      qualifying_months = { v.month_index for v in SupervisedDietVisit
                            where v.program_id == program.id
                              and v.attended == true
                              and 1 <= v.month_index <= required }
      diet_requirement_met = ( count(qualifying_months) >= required )
    input_set: "SupervisedDietVisit rows for the program with attended==true and month_index in [1, required]; distinct month_index counted once"
    constants: {}
    precision: "integer count; boundary inclusive (>=). required==0 => met is vacuously true"
    note: "Boundary metric: exactly `required` distinct attended months qualifies; required-1 does not."

  - name: clearances_complete
    trigger: "recomputed on any clearance-artifact mutation; read at finalize-clearance"
    algorithm: aggregation
    formula: |
      psych_ok = exists PsychEvaluation p (p.program_id==program.id and p.status==CLEARED)
      nutr_ok  = exists NutritionClearance n (n.program_id==program.id and n.decision==CLEARED)
      miles_ok = every code in {NUTRITION_CLASS, EXERCISE_ORIENTATION, SURGERY_RISKS_CONSENT, POST_OP_DIET_EDUCATION}
                 has an EducationMilestone m (m.program_id==program.id, m.milestone_code==code, m.completed==true)
      diet_ok  = (payment_pathway==SELF_PAY) ? true : supervised_diet_progress.diet_requirement_met
      clearances_complete = psych_ok AND nutr_ok AND miles_ok AND diet_ok
    input_set: "latest state of PsychEvaluation, NutritionClearance, EducationMilestone, SupervisedDietVisit rows for the program"
    constants:
      REQUIRED_MILESTONES: [NUTRITION_CLASS, EXERCISE_ORIENTATION, SURGERY_RISKS_CONSENT, POST_OP_DIET_EDUCATION]
    precision: "boolean"

  - name: case_bundle_price
    trigger: "estimate: POST /programs/{id}/surgery-cases and POST /programs/{id}/financing-plan; final: POST /surgery-cases/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      base = BASE_CENTS[procedure_type]
      surcharge_pct = 0.15 if baseline_bmi >= 50 else (0.08 if baseline_bmi >= 40 else 0.00)
      estimate_cents = round_half_up( base * (1 + surcharge_pct) )        # integer cents
      # final adds operating-room overtime beyond the procedure's standard minutes:
      overtime_min = max(0, actual_or_minutes - STANDARD_OR_MINUTES[procedure_type])
      final_cents = estimate_cents + overtime_min * OVERTIME_RATE_CENTS_PER_MIN
    input_set: "one SurgeryCase (procedure_type, actual_or_minutes) and its Program.baseline_bmi"
    constants:
      BASE_CENTS: { SLEEVE_GASTRECTOMY: 1800000, GASTRIC_BYPASS: 2500000, ADJUSTABLE_BAND: 1500000 }
      STANDARD_OR_MINUTES: { SLEEVE_GASTRECTOMY: 90, GASTRIC_BYPASS: 150, ADJUSTABLE_BAND: 60 }
      OVERTIME_RATE_CENTS_PER_MIN: 25000
      BMI_SURCHARGE_HIGH: 0.15
      BMI_SURCHARGE_MID: 0.08
    precision: "integer cents; round_half_up on the surcharge multiplication only"
    variants:
      - name: estimate
        when: "at scheduling / financing-plan creation, before the case is performed"
        difference: "uses base*(1+surcharge) only; no OR overtime term (actual_or_minutes unknown)"
      - name: final
        when: "at POST /surgery-cases/{id}/complete, once actual_or_minutes is known"
        difference: "adds overtime_min * OVERTIME_RATE_CENTS_PER_MIN to the estimate; differs from estimate whenever actual_or_minutes > standard"

  - name: financing_schedule
    trigger: "POST /programs/{id}/financing-plan"
    algorithm: waterfall_allocation
    formula: |
      bundle = case_bundle_price(variant=estimate) for financing.procedure_type at program.baseline_bmi
      principal = bundle - down_payment_cents
      # Rounding order is PINNED: interest is computed ONCE on the whole principal, then rounded,
      # THEN the financed total is split. Do NOT round per-installment before summing.
      interest_cents = round_half_up( principal * (apr_bps / 10000) * (term_months / 12) )
      financed_total = principal + interest_cents
      installment_cents        = floor( financed_total / term_months )           # installments 1..term-1
      final_installment_cents  = financed_total - installment_cents * (term_months - 1)   # last absorbs remainder
    input_set: "one FinancingPlan (down_payment_cents, term_months, apr_bps, procedure_type) and its Program.baseline_bmi"
    constants: {}
    precision: "integer cents; interest rounded round_half_up once; installments use floor with remainder waterfalled into final_installment"
    note: "Combinatorial mode (b): round-then-split; per-installment rounding then summing would drift from bundle+interest."

  - name: weight_loss_outcome
    trigger: "POST /follow-up-visits/{id}/record"
    algorithm: weighted_scoring
    formula: |
      B = program.baseline_weight_kg ; W = recorded_weight_kg
      height_m = program-linked patient height_cm / 100
      weight_bmi25 = 25.0 * (height_m ** 2)
      ewl_pct_ibw   = (B - W) / (B - program.ideal_body_weight_kg) * 100
      ewl_pct_bmi25 = (B - W) / (B - weight_bmi25) * 100
    input_set: "one FollowUpVisit's recorded_weight_kg against the Program baseline_weight_kg, ideal_body_weight_kg, and the BMI-25 reference weight"
    constants:
      REFERENCE_BMI: 25.0
    precision: "1 decimal place, round_half_up, on each percentage independently"
    variants:
      - name: ewl_ibw
        when: "outcome registry reporting against ideal body weight"
        difference: "denominator is (baseline - Devine IBW)"
      - name: ewl_bmi25
        when: "outcome registry reporting against BMI-25 reference weight"
        difference: "denominator is (baseline - 25*height_m^2); larger reference weight => smaller denominator gap => different percentage than ewl_ibw"

  - name: cancellation_refund
    trigger: "POST /surgery-cases/{id}/cancel (SELF_PAY program with amount_collected_cents > 0)"
    algorithm: waterfall_allocation
    formula: |
      collected = program.amount_collected_cents
      forfeited = min(collected, CANCELLATION_FEE_CENTS)
      refunded  = collected - forfeited
      # program.amount_forfeited_cents += forfeited ; program.amount_refunded_cents += refunded
    input_set: "the Program's amount_collected_cents at cancellation time"
    constants:
      CANCELLATION_FEE_CENTS: 100000
    precision: "integer cents"
    note: "Invariant: amount_refunded_cents + amount_forfeited_cents == amount_collected_cents after cancel."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint (per §1.7); for Surgeon-owned actions X-User-ID must equal SurgeryCase.surgeon_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "each path-referenced resource exists, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "request body is well-formed: required fields present, enums in range, types correct, numeric constraints honored (e.g. scheduled_end>scheduled_start handled at temporal tier)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: business_referential
    check: "body foreign keys resolve: patient_id, insurance_plan_id, operating_room_id, surgeon_id, program_id, surgery_case_id reference existing rows"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "endpoints taking body/path FKs"
  - priority: 6
    category: business_referential
    check: "pathway/plan coherence at program creation: INSURANCE requires insurance_plan_id present; SELF_PAY requires it absent/null"
    error_id: ERR_PATHWAY_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /programs"
  - priority: 7
    category: state
    check: "the target resource is in the required state for this transition (candidacy-review<-SCREENING, request-clearance<-ELIGIBLE, finalize-clearance<-CLEARANCE_IN_PROGRESS, complete/cancel<-SCHEDULED, decision<-PENDING, reevaluate<-DEFERRED, resolve<-OPEN, record<-SCHEDULED)"
    error_id: "ERR_INVALID_PROGRAM_STATE | ERR_INVALID_PSYCH_STATE | ERR_INVALID_SURGERY_STATE | ERR_INVALID_COMPLICATION_STATE | ERR_INVALID_FOLLOWUP_STATE"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: state
    check: "surgery scheduling requires the Program in CLEARED"
    error_id: ERR_PROGRAM_NOT_CLEARED
    http_status: 409
    applies_to: "POST /programs/{id}/surgery-cases"
  - priority: 9
    category: business_referential
    check: "financing plan requires the Program.payment_pathway == SELF_PAY"
    error_id: ERR_NOT_SELF_PAY
    http_status: 409
    applies_to: "POST /programs/{id}/financing-plan"
  - priority: 10
    category: business_safety
    check: "finalize-clearance requires clearances_complete==true (psych CLEARED, nutrition CLEARED, all milestones, diet months for INSURANCE)"
    error_id: ERR_CLEARANCES_INCOMPLETE
    http_status: 409
    applies_to: "POST /programs/{id}/finalize-clearance"
  - priority: 11
    category: business_constraint
    check: "surgeon must be credentialed for the requested procedure_type"
    error_id: ERR_SURGEON_NOT_CREDENTIALED
    http_status: 409
    applies_to: "POST /programs/{id}/surgery-cases"
  - priority: 12
    category: business_constraint
    check: "the target OperatingRoom.status must be OPEN"
    error_id: ERR_ROOM_CLOSED
    http_status: 409
    applies_to: "POST /programs/{id}/surgery-cases"
  - priority: 13
    category: business_constraint
    check: "duplicate EducationMilestone.milestone_code for the same program is rejected"
    error_id: ERR_DUPLICATE_MILESTONE
    http_status: 409
    applies_to: "POST /programs/{id}/milestones"
  - priority: 14
    category: business_constraint
    check: "duplicate SupervisedDietVisit.month_index for the same program is rejected"
    error_id: ERR_DUPLICATE_DIET_MONTH
    http_status: 409
    applies_to: "POST /programs/{id}/diet-visits"
  - priority: 15
    category: business_temporal
    check: "scheduled_end must be strictly after scheduled_start"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /programs/{id}/surgery-cases"
  - priority: 16
    category: business_temporal
    check: "scheduled_start must be at or after the current logical clock (no past bookings)"
    error_id: ERR_SURGERY_IN_PAST
    http_status: 422
    applies_to: "POST /programs/{id}/surgery-cases"
  - priority: 17
    category: business_temporal
    check: "OperatingRoom double-booking: reject if any non-cancelled case in the same room is within turnover_buffer_minutes — i.e. new.start < c.end + buffer AND c.start < new.end + buffer (buffer-extended, symmetric)"
    error_id: ERR_OR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /programs/{id}/surgery-cases"
  - priority: 18
    category: business_temporal
    check: "Surgeon double-booking: reject if any non-cancelled case for the same surgeon strictly overlaps [start,end) with NO buffer — new.start < c.end AND c.start < new.end (adjacency at start==end is allowed)"
    error_id: ERR_SURGEON_CONFLICT
    http_status: 409
    applies_to: "POST /programs/{id}/surgery-cases"
  - priority: 19
    category: business_fiscal
    check: "financing down_payment_cents must not exceed the computed bundle_price_cents"
    error_id: ERR_DOWN_PAYMENT_EXCEEDS_BUNDLE
    http_status: 422
    applies_to: "POST /programs/{id}/financing-plan"
  - priority: 20
    category: state
    check: "OCC: expected_program_version must equal Program.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /programs/{id}/financing-plan"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Configuration (SystemAdmin creates; reads open to all roles) ----------
  - method: POST
    path: "/insurance-plans"
    description: "Create an insurance plan (candidacy floors + clearance requirements)"
    roles: [SystemAdmin]
    code: 201
    input: [plan_name, payer_code, required_supervised_diet_months, "requires_psych_clearance?", "requires_nutrition_clearance?", "bmi_floor_no_comorbidity?", "bmi_floor_with_comorbidity?", qualifying_comorbidities]
    output: InsurancePlan
    side_effects: []
  - method: GET
    path: "/insurance-plans/{id}"
    description: "Fetch an insurance plan"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: []
  - method: POST
    path: "/operating-rooms"
    description: "Create an operating room with turnover buffer"
    roles: [SystemAdmin]
    code: 201
    input: [room_code, "turnover_buffer_minutes?", "status?"]
    output: OperatingRoom
    side_effects: []
  - method: GET
    path: "/operating-rooms/{id}"
    description: "Fetch an operating room"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: []
    output: OperatingRoom
    side_effects: []
  - method: POST
    path: "/surgeons"
    description: "Create a surgeon with credentialed procedures"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, npi, credentialed_procedures]
    output: Surgeon
    side_effects: []
  - method: GET
    path: "/surgeons/{id}"
    description: "Fetch a surgeon"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: []
    output: Surgeon
    side_effects: []
  - method: GET
    path: "/surgery-cases"
    description: "List surgery cases filtered by program, room, or surgeon (FK reverse-reachability)"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: ["program_id?", "operating_room_id?", "surgeon_id?", "status?", "limit?", "offset?"]
    output: SurgeryCase[]
    side_effects: []

  # ---- Clock (test-driving) --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; the clock reads exactly this until first set and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["advance/replace the logical clock used for past-booking and follow-up date math"]

  # ---- Patients --------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [ProgramCoordinator]
    code: 201
    input: [mrn, full_name, date_of_birth, sex, height_cm, baseline_weight_kg]
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients/{id}"
    description: "Fetch a patient"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Programs --------------------------------------------------------------
  - method: POST
    path: "/programs"
    description: "Create a bariatric program for a patient; computes baseline_bmi and ideal_body_weight"
    roles: [ProgramCoordinator]
    code: 201
    input: [patient_id, payment_pathway, "insurance_plan_id?", comorbidities]
    output: Program
    side_effects: ["compute baseline_bmi, baseline_weight_kg, ideal_body_weight_kg (calcs)"]
  - method: GET
    path: "/programs/{id}"
    description: "Fetch a program"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/programs"
    description: "List programs filtered by patient or plan (FK reverse-reachability)"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: ["patient_id?", "insurance_plan_id?", "status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: POST
    path: "/programs/{id}/candidacy-review"
    description: "Run candidacy determination; program advances to ELIGIBLE or INELIGIBLE"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Program
    side_effects: ["calc candidacy_determination; set candidacy_status, qualifying_reason; SCREENING->ELIGIBLE|INELIGIBLE; increments Program.version by 1"]
  - method: POST
    path: "/programs/{id}/request-clearance"
    description: "Open the clearance window (ELIGIBLE -> CLEARANCE_IN_PROGRESS)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Program
    side_effects: ["ELIGIBLE->CLEARANCE_IN_PROGRESS; increments Program.version by 1"]
  - method: POST
    path: "/programs/{id}/finalize-clearance"
    description: "Verify all clearances and move CLEARANCE_IN_PROGRESS -> CLEARED"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Program
    side_effects: ["recompute clearances_complete; CLEARANCE_IN_PROGRESS->CLEARED; increments Program.version by 1"]
  - method: GET
    path: "/programs/{id}/summary"
    description: "Outcome-registry summary (computed read): candidacy, latest %EWL variants, readmission and complication counts"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: []
    output: "{ program_id: string, status: string, baseline_bmi: number, candidacy_status: string, latest_ewl_pct_ibw: number, latest_ewl_pct_bmi25: number, readmission_count: integer, active_complication_count: integer }"
    side_effects: []

  # ---- Supervised diet -------------------------------------------------------
  - method: POST
    path: "/programs/{id}/diet-visits"
    description: "Log a supervised-diet visit for a program in CLEARANCE_IN_PROGRESS"
    roles: [Dietitian]
    code: 201
    input: [month_index, visit_date, weight_kg, "attended?"]
    output: SupervisedDietVisit
    side_effects: ["recompute owning Program.clearances_complete"]
  - method: GET
    path: "/programs/{id}/diet-visits"
    description: "List a program's supervised-diet visits (FK reverse-reachability)"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: ["limit?", "offset?"]
    output: SupervisedDietVisit[]
    side_effects: []

  # ---- Psych evaluation ------------------------------------------------------
  - method: POST
    path: "/programs/{id}/psych-evaluations"
    description: "Create a psychological evaluation (PENDING) for a program in CLEARANCE_IN_PROGRESS"
    roles: [BehavioralHealthClinician]
    code: 201
    input: ["clinician_note?"]
    output: PsychEvaluation
    side_effects: []
  - method: GET
    path: "/programs/{id}/psych-evaluations"
    description: "List a program's psych evaluations (FK reverse-reachability)"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: ["limit?", "offset?"]
    output: PsychEvaluation[]
    side_effects: []
  - method: POST
    path: "/psych-evaluations/{id}/decision"
    description: "Decide a PENDING evaluation: CLEARED or DEFERRED"
    roles: [BehavioralHealthClinician]
    code: 200
    input: [decision, "deferral_reason?"]
    output: PsychEvaluation
    side_effects: ["PENDING->CLEARED|DEFERRED; recompute owning Program.clearances_complete"]
  - method: POST
    path: "/psych-evaluations/{id}/reevaluate"
    description: "Re-open a DEFERRED evaluation back to PENDING"
    roles: [BehavioralHealthClinician]
    code: 200
    input: []
    output: PsychEvaluation
    side_effects: ["DEFERRED->PENDING; increment reevaluation_count; clear deferral_reason"]

  # ---- Nutrition clearance ---------------------------------------------------
  - method: POST
    path: "/programs/{id}/nutrition-clearances"
    description: "Record a nutrition clearance decision for a program in CLEARANCE_IN_PROGRESS"
    roles: [Dietitian]
    code: 201
    input: [decision, diet_readiness_score]
    output: NutritionClearance
    side_effects: ["recompute owning Program.clearances_complete"]
  - method: GET
    path: "/programs/{id}/nutrition-clearances"
    description: "List a program's nutrition clearances (FK reverse-reachability)"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: ["limit?", "offset?"]
    output: NutritionClearance[]
    side_effects: []

  # ---- Education milestones --------------------------------------------------
  - method: POST
    path: "/programs/{id}/milestones"
    description: "Record/complete a pre-op education milestone (unique per code)"
    roles: [ProgramCoordinator]
    code: 201
    input: [milestone_code, "completed?", "completed_date?"]
    output: EducationMilestone
    side_effects: ["recompute owning Program.clearances_complete"]
  - method: GET
    path: "/programs/{id}/milestones"
    description: "List a program's education milestones (FK reverse-reachability)"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: ["limit?", "offset?"]
    output: EducationMilestone[]
    side_effects: []

  # ---- Surgery scheduling & lifecycle ---------------------------------------
  - method: POST
    path: "/programs/{id}/surgery-cases"
    description: "Schedule a surgery case for a CLEARED program; runs credentialing, room-closed, temporal-overlap, and OCC checks"
    roles: [ProgramCoordinator]
    code: 201
    input: [operating_room_id, surgeon_id, procedure_type, scheduled_start, scheduled_end, expected_program_version]
    output: SurgeryCase
    side_effects: ["create SurgeryCase SCHEDULED; estimated_bundle_cents (calc: case_bundle_price variant=estimate); Program CLEARED->SURGERY_SCHEDULED; increments Program.version by 1"]
  - method: GET
    path: "/surgery-cases/{id}"
    description: "Fetch a surgery case"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: []
    output: SurgeryCase
    side_effects: []
  - method: POST
    path: "/surgery-cases/{id}/complete"
    description: "Mark a scheduled case COMPLETED (assigned Surgeon only); records actual OR minutes and final bundle"
    roles: [Surgeon]
    code: 200
    input: [actual_or_minutes]
    output: SurgeryCase
    side_effects: ["compute final_bundle_cents (calc: case_bundle_price variant=final); CASCADE: Program SURGERY_SCHEDULED->POST_OP -> generate FollowUpVisit series; increments Program.version by 1"]
  - method: POST
    path: "/surgery-cases/{id}/cancel"
    description: "Cancel a scheduled case; releases room/surgeon and refunds self-pay deposit"
    roles: [ProgramCoordinator]
    code: 200
    input: ["cancellation_reason?"]
    output: SurgeryCase
    side_effects: ["SCHEDULED->CANCELLED; Program SURGERY_SCHEDULED->CLEARED; if SELF_PAY run cancellation_refund; increments Program.version by 1"]

  # ---- Complications ---------------------------------------------------------
  - method: POST
    path: "/surgery-cases/{id}/complications"
    description: "Log a complication on a completed case (assigned Surgeon only)"
    roles: [Surgeon]
    code: 201
    input: [complication_type, severity, requires_readmission, onset_date]
    output: Complication
    side_effects: ["increment Program.active_complication_count; if requires_readmission: readmission_count++ and Program POST_OP->READMITTED; increments Program.version by 1"]
  - method: GET
    path: "/surgery-cases/{id}/complications"
    description: "List a case's complications (FK reverse-reachability)"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: ["limit?", "offset?"]
    output: Complication[]
    side_effects: []
  - method: POST
    path: "/complications/{id}/resolve"
    description: "Resolve an OPEN complication (assigned Surgeon only)"
    roles: [Surgeon]
    code: 200
    input: []
    output: Complication
    side_effects: ["OPEN->RESOLVED; decrement Program.active_complication_count; if program READMITTED and count reaches 0: READMITTED->POST_OP; increments Program.version by 1"]

  # ---- Follow-up visits ------------------------------------------------------
  - method: GET
    path: "/programs/{id}/follow-up-visits"
    description: "List a program's follow-up visits (FK reverse-reachability; the only discovery channel for cascade-created visits)"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: ["limit?", "offset?"]
    output: FollowUpVisit[]
    side_effects: []
  - method: POST
    path: "/follow-up-visits/{id}/record"
    description: "Record weight at a scheduled follow-up; computes %EWL variants; MONTH_12 completes the program"
    roles: [Dietitian]
    code: 200
    input: [recorded_weight_kg]
    output: FollowUpVisit
    side_effects: ["SCHEDULED->COMPLETED; compute ewl_pct_ibw, ewl_pct_bmi25 (calc: weight_loss_outcome); if MONTH_12: Program POST_OP->COMPLETED"]

  # ---- Financing -------------------------------------------------------------
  - method: POST
    path: "/programs/{id}/financing-plan"
    description: "Create/replace a self-pay financing plan (OCC on program version); prior ACTIVE plan becomes SUPERSEDED"
    roles: [BillingSpecialist]
    code: 201
    input: [procedure_type, down_payment_cents, term_months, apr_bps, expected_program_version]
    output: FinancingPlan
    side_effects: ["compute bundle_price_cents, interest_cents, installment_cents, final_installment_cents (calc: financing_schedule); prior ACTIVE FinancingPlan->SUPERSEDED; set Program.amount_collected_cents = down_payment_cents; increments Program.version by 1"]
  - method: GET
    path: "/programs/{id}/financing-plan"
    description: "List a program's financing plans (FK reverse-reachability)"
    roles: [ProgramCoordinator, Dietitian, BehavioralHealthClinician, BillingSpecialist, SystemAdmin, Surgeon]
    code: 200
    input: ["limit?", "offset?"]
    output: FinancingPlan[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this operation, or Surgeon acting on a case they do not own"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field, bad enum value, wrong type, out-of-range number"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "patient_id / path patient id does not resolve"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program id (path or body) does not resolve"
  - id: ERR_INSURANCE_PLAN_NOT_FOUND
    http: 404
    condition: "insurance_plan_id does not resolve"
  - id: ERR_OPERATING_ROOM_NOT_FOUND
    http: 404
    condition: "operating_room_id does not resolve"
  - id: ERR_SURGEON_NOT_FOUND
    http: 404
    condition: "surgeon_id does not resolve"
  - id: ERR_SURGERY_CASE_NOT_FOUND
    http: 404
    condition: "surgery case id does not resolve"
  - id: ERR_PSYCH_EVALUATION_NOT_FOUND
    http: 404
    condition: "psych evaluation id does not resolve"
  - id: ERR_COMPLICATION_NOT_FOUND
    http: 404
    condition: "complication id does not resolve"
  - id: ERR_FOLLOW_UP_VISIT_NOT_FOUND
    http: 404
    condition: "follow-up visit id does not resolve"
  - id: ERR_PATHWAY_PLAN_MISMATCH
    http: 422
    condition: "INSURANCE program missing insurance_plan_id, or SELF_PAY program supplying one"
  - id: ERR_INVALID_PROGRAM_STATE
    http: 409
    condition: "program transition attempted from a state that does not allow it"
  - id: ERR_INVALID_PSYCH_STATE
    http: 409
    condition: "psych decision on non-PENDING, or reevaluate on non-DEFERRED"
  - id: ERR_INVALID_SURGERY_STATE
    http: 409
    condition: "complete/cancel attempted on a case not in SCHEDULED"
  - id: ERR_INVALID_COMPLICATION_STATE
    http: 409
    condition: "resolve attempted on a complication not in OPEN"
  - id: ERR_INVALID_FOLLOWUP_STATE
    http: 409
    condition: "record attempted on a follow-up visit not in SCHEDULED"
  - id: ERR_PROGRAM_NOT_CLEARED
    http: 409
    condition: "surgery scheduling attempted while Program.status != CLEARED"
  - id: ERR_CLEARANCES_INCOMPLETE
    http: 409
    condition: "finalize-clearance while clearances_complete==false"
  - id: ERR_SURGEON_NOT_CREDENTIALED
    http: 409
    condition: "surgeon not credentialed for the requested procedure_type"
  - id: ERR_ROOM_CLOSED
    http: 409
    condition: "scheduling into an OperatingRoom whose status is CLOSED"
  - id: ERR_DUPLICATE_MILESTONE
    http: 409
    condition: "milestone_code already recorded for the program"
  - id: ERR_DUPLICATE_DIET_MONTH
    http: 409
    condition: "month_index already logged for the program"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "scheduled_end not strictly after scheduled_start"
  - id: ERR_SURGERY_IN_PAST
    http: 422
    condition: "scheduled_start before the current logical clock"
  - id: ERR_OR_ROOM_CONFLICT
    http: 409
    condition: "OR-room booking collides with another case within the room's turnover buffer"
  - id: ERR_SURGEON_CONFLICT
    http: 409
    condition: "surgeon booking strictly overlaps another of the surgeon's cases"
  - id: ERR_NOT_SELF_PAY
    http: 409
    condition: "financing plan requested on a non-SELF_PAY program"
  - id: ERR_DOWN_PAYMENT_EXCEEDS_BUNDLE
    http: 422
    condition: "financing down_payment_cents greater than computed bundle_price_cents"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not match Program.version (OCC)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramCoordinator
    description: "Owns patient intake, program lifecycle, candidacy/clearance orchestration, milestones, and surgery scheduling/cancellation"
    identity: "opaque"
    exclusive_operations:
      - "POST /patients"
      - "POST /programs"
      - "POST /programs/{id}/candidacy-review"
      - "POST /programs/{id}/request-clearance"
      - "POST /programs/{id}/finalize-clearance"
      - "POST /programs/{id}/milestones"
      - "POST /programs/{id}/surgery-cases"
      - "POST /surgery-cases/{id}/cancel"
    shared_operations:
      - "all GET reads"
  - name: Dietitian
    description: "Owns supervised-diet visits, nutrition clearances, and follow-up weight recording"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs/{id}/diet-visits"
      - "POST /programs/{id}/nutrition-clearances"
      - "POST /follow-up-visits/{id}/record"
    shared_operations:
      - "all GET reads"
  - name: BehavioralHealthClinician
    description: "Owns psychological evaluations and their decisions/re-evaluations"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs/{id}/psych-evaluations"
      - "POST /psych-evaluations/{id}/decision"
      - "POST /psych-evaluations/{id}/reevaluate"
    shared_operations:
      - "all GET reads"
  - name: BillingSpecialist
    description: "Owns self-pay financing plans"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs/{id}/financing-plan"
    shared_operations:
      - "all GET reads"
  - name: Surgeon
    description: "Performs surgery and manages complications; may act only on cases where SurgeryCase.surgeon_id == X-User-ID"
    identity: "entity_backed:Surgeon"
    exclusive_operations:
      - "POST /surgery-cases/{id}/complete"
      - "POST /surgery-cases/{id}/complications"
      - "POST /complications/{id}/resolve"
    shared_operations:
      - "all GET reads"
  - name: SystemAdmin
    description: "Manages configuration (insurance plans, operating rooms, surgeons) and the test logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /insurance-plans"
      - "POST /operating-rooms"
      - "POST /surgeons"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
