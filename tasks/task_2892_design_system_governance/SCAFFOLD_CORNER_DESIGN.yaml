            - "an ENHANCEMENT proposal on `badge` with A11Y_AUTOMATED + TOKEN_COMPLIANCE evidence, both gates approved, and a DRAFT release"
            - "Component `badge`'s version is captured, then a dependency edge badge -> icon pinned at major 1 bumps it"
