  instances:
  - name: registration_state_check_precedes_budget_headroom_check_on_confirm
    grounds:
    - §1.4 priority 11 ERR_REGISTRATION_STATE_INVALID (category state)
    - §1.4 priority 30 ERR_BUDGET_HEADROOM_EXCEEDED (category business_fiscal)
    - §1.2 Registration ACCEPTED -> CONFIRMED preconditions
    - §1.3 program_budget_rollup and §1.3 air_cost_and_change_fee
    - §1.5 POST /registrations/{registration_id}/confirm
    distinguishing_aspect: |-
      A confirm call that violates BOTH the attendance-state guard (registration still INVITED) and the headroom guard (cost_cents 105500 against budget_headroom_cents 56826) must return the priority-11 state error ERR_REGISTRATION_STATE_INVALID with HTTP 409, and only once the state violation is removed by accepting the invitation does the same call surface the priority-30 fiscal error ERR_BUDGET_HEADROOM_EXCEEDED with HTTP 422.
