        claim_type: listing
        grounds:
          - endpoints[GET /installations/{id}/calibration-runs]
          - entities.CalibrationRun.fields.recorded_at_utc
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Two runs recorded at two distinct logical-clock positions must come back newest-first, so a
          limit=1 page returns the SECOND run, not the first, with has_more true; the immutable-run history
          is an audit trail, so both rows survive and the older one is reachable at offset=1.
        test_recipe:
          setup:
            - "Harbor Arena with rig RIG-A; a FAIL run recorded at 2026-08-01T12:00:00Z and a PASS run recorded at 2026-08-01T13:00:00Z"
