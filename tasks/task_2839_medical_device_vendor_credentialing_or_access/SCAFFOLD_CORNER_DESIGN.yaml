      - name: appeal_overturn_lands_lapsed_rep_in_suspended
        claim_type: cross_entity
        grounds:
          - state_machines.AccessAppeal.SUBMITTED_to_OVERTURNED
          - state_machines.VendorRep.REVOKED_to_SUSPENDED
          - calculations.rep_credential_posture
        distinguishing_aspect: "An overturned appeal does not blindly restore CREDENTIALED: because the rep's influenza credential expired while the appeal was pending, the recomputed posture is LAPSED and the rep lands in SUSPENDED with suspension_reason CREDENTIAL_LAPSED, reinstated_at_utc stamped at the decision instant."
        test_recipe:
          setup:
            - "Vendor APPLV has rep Ada, fully credentialed at the 2026-08-01T00:00:00Z default clock; her IMMUNIZATION_INFLUENZA credential expires at 2026-09-01T00:00:00Z and the other three expire in 2027."
            - "At 2026-08-15T00:00:00Z user_credentialing_1 revokes Ada's access; she files an appeal the same instant (appeal_deadline_utc 2026-08-29T00:00:00Z)."
            - "The clock then moves to 2026-09-02T00:00:00Z and one ComplianceSweep expires the influenza credential, so Ada's posture is LAPSED while she is still REVOKED."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Appeal Overturn Devices", vendor_code: "APPLV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
