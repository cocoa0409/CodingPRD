          - constants.SANCTION_DISREGARD_MAX_MONTHS
          - state_machines.FederalReportingPeriod.OPEN_to_CALCULATED
        distinguishing_aspect: |
          The three-month sanction disregard empties every adjusted denominator, so
          den_all is 0 and wpr_all_families_pct falls back to 0.00, while
          current_caseload is still 1.00 because the credit uses the UNADJUSTED
          denominators; with prior_year_caseload 2.00 the credit is 50.00, the
          adjusted target is 0.00 and target_met is true even at a 0.00 rate.
