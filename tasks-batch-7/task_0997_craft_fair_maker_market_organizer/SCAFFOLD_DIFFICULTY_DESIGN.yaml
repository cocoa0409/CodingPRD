  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_cascade_depth3
        grounds:
          - state_machines.MakerEvent.LIVE_to_WEATHER_HOLD
          - state_machines.MakerEvent.WEATHER_HOLD_to_CANCELLED
          - state_machines.BoothAssignment.ACTIVE_to_FORFEITED
          - state_machines.Settlement.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Trigger = POST /maker-events/{id}/cancel from WEATHER_HOLD. Cascade
          depth 3: cancel(MakerEvent) -> FORFEIT(BoothAssignment) -> CANCEL
          (Settlement) AND delete(LoadInSlot); plus parallel refund of Tickets.
          Originating trigger is distinct from the weather-hold trigger below.
        test_recipe:
          setup:
            - "MakerEvent in WEATHER_HOLD (was LIVE, SEVERE weather posted)"
            - "One ACTIVE BoothAssignment, one PENDING Settlement, one LoadInSlot, one ISSUED Ticket"
