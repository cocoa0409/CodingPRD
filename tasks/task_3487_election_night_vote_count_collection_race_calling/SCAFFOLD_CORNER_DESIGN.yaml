              as: Stringer
              as_user_id: "${str_s}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE"

      - name: posture_forbids_county_creation_after_lock
        claim_type: Violation to Error
        grounds:
