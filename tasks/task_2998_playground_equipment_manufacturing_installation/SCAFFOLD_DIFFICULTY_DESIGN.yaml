  - rule_id: resource_temporal_overlap
    instances:
      - name: placement_use_zone_overlap_exempted_only_for_attached_pair
        grounds:
          - calculations.use_zone_extent
          - validations[priority=60]
          - validations[priority=63]
          - errors.ERR_USE_ZONE_OVERLAP
          - state_machines.ComponentPlacement.DRAFT_to_VALIDATED
        distinguishing_aspect: |
          Two climber placements occupy the IDENTICAL use-zone interval 687..1113 and overlap the
          same VALIDATED deck zone 517..883; the only difference is the attachment relationship, so
          the unattached one is rejected with ERR_USE_ZONE_OVERLAP and the deck-attached one
          validates. The exemption is therefore relational, not geometric - an implementation
          keyed on coordinates alone cannot separate these two rows.
