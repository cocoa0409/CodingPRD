  # ==========================================================================
  - section: errors
    instances:

      - name: error_envelope_is_uniform_across_unauthorized_and_not_found
        claim_type: error_triggerable
        grounds:
          - response_envelope
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_AIRCRAFT_NOT_FOUND]
        distinguishing_aspect: |
          Every failure uses the same envelope as a success: response_type
          "error", a data object carrying exactly error_id and message, and a
          meta object carrying api_request_id. The claim is checked on two
          errors raised at different ladder positions (role check at 2 and path
          lookup at 4) so the shape cannot be special-cased per status.
        test_recipe:
          setup:
            - "One airframe exists; no other rows are needed."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
          trigger:
            - call: "POST /aircraft/${ac1}/ground"
              payload: {}
              as: RampAgent
              captures: { err_role: $.data.error_id }
            - call: "GET /aircraft/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: RampAgent
              captures: { err_missing: $.data.error_id }
          assert:
            - "first trigger: HTTP 403 with response_type == \"error\", data.error_id == \"ERR_UNAUTHORIZED\", a non-empty data.message and a non-empty meta.api_request_id"
            - "second trigger: HTTP 404 with response_type == \"error\", data.error_id == \"ERR_AIRCRAFT_NOT_FOUND\", a non-empty data.message and a non-empty meta.api_request_id"
            - "neither error response carries any data field other than error_id and message"
            - "Aircraft.${ac1}.status == \"IN_SERVICE\""

      - name: invalid_request_is_raised_for_shape_enum_and_range_faults
        claim_type: error_triggerable
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          The single 400 code covers every shape fault, and each variety is
          exercised once: a missing required field, an unknown enum member, a
          value of the wrong type, a negative quantity where only non-negative
          values are meaningful, and an unparseable instant. All five answer
          400 ERR_INVALID_REQUEST and nothing is persisted, which pins the code
          as reachable without leaving a partial row behind.
        test_recipe:
          setup:
            - "One airframe with the zone OC exists so that the compartment reference in the last probe resolves."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw: $.data.id }
          trigger:
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "OC", kind: "CABIN_ZONE", arm_m: 22.900, running_load_limit_kg_per_m: 2000, length_m: 8.0 }
              as: LoadControlAdmin
              captures: { e_missing: $.data.error_id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "OD", kind: "GALLEY", arm_m: 22.900, max_weight_kg: 8000, running_load_limit_kg_per_m: 2000, length_m: 8.0 }
              as: LoadControlAdmin
              captures: { e_enum: $.data.error_id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw}", aircraft_type_code: "B738", temp_lo_c: "cold", temp_hi_c: 15, base_limit_weight_kg: 79000 }
              as: LoadControlAdmin
              captures: { e_type: $.data.error_id }
            - call: "POST /weight-programs"
              payload: { code: "NEG-1", program_kind: "STANDARD", male_kg: -88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { e_range: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "the fifteenth of August" }
              as: LoadControlAdmin
              captures: { e_instant: $.data.error_id }
          assert:
            - "all five triggers return HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /aircraft/${ac1}/compartments returns total_count == 0"
            - "GET /runways/${rw}/performance-bands returns total_count == 0"
            - "GET /weight-programs with no filters returns total_count == 0"

  # ==========================================================================
  - section: rbac
    instances:

      - name: each_role_denied_another_roles_exclusive_operation_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles[LoadControlAdmin].exclusive_operations
          - roles[LoadController].exclusive_operations
          - roles[RampAgent].exclusive_operations
          - roles[DangerousGoodsOfficer].exclusive_operations
          - roles[Captain].exclusive_operations
          - roles[AuditInspector].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Every one of the six roles is caught reaching into another role's
          exclusive operation, so no single permissive branch can pass the
          claim: the controller cannot create airframes, the ramp agent cannot
          open a load plan, the dangerous-goods officer cannot book cargo, the
          captain cannot issue a load sheet, the audit inspector cannot
          despatch a flight and the administrator cannot retune the flight
          conditions. All six answer 403 ERR_UNAUTHORIZED before any state
          check runs.
        test_recipe:
          setup:
            - "AC1 with OC and H1, R1 with the [15,30) band, STD-2026 and FLT already exist, created by the properly entitled roles; a DRAFT plan and its computed sheet are not needed because authorisation is decided first."
