              payload: { bid_contract_id: "${c7_id}", depot_id: "${d7a}", requested_tons: 2000, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 70.00, storm_priority: "ROUTINE", expected_bid_contract_version: "${c7_v}" }
              as: ContractAdministrator
              captures: { o7_id: $.data.id }
          trigger:
            - call: "POST /salt/delivery-orders/${o7_id}/allocate"
              payload: {}
              as: LogisticsPlanner
              captures: { o7_status: $.data.status, o7_penalty: $.data.shortfall_penalty_usd }
          assert:
            - "${c7_value} == 342750.00"
            - "hop 1 — ${o7_status} == SHORTED, DeliveryOrder.${o7_id}.allocated_tons == 900.00, shorted_tons == 1100.00, penalty_state == ACCRUED, ${o7_penalty} == 20565.00 (the 15 pct cap on the 137100.00 order value binds below the raw 24200.00)"
            - "hop 2 — BidContract.${c7_id}.penalty_accrued_usd == 20565.00 and BidContract.${c7_id}.supply_reliability_score == 78.00 (100 - 22.00 haircut)"
            - "hop 3 — BidContract.${c7_id}.breach_watch == true because 20565.00 >= 17137.50 (5 pct of 342750.00)"
            - "BidContract.${c7_id}.fulfilled_tons == 0.00 — a SHORTED order contributes nothing to fulfilment until it is delivered"
            - "GET /salt/stockpile-lots?depot_id=${d7a} shows the drawn lot with tons_reserved == 900.00 and tons_available == 0.00 while tons_on_hand is still 900.00"
