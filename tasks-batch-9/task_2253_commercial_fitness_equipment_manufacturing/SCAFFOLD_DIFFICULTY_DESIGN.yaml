      - The identical trigger request now returns 201 with DurabilityTestRun.${x3}.status == RESERVED
      - DurabilityTestRun.${x3}.window_start == 2026-08-06T00:00:00Z and window_end == 2026-08-10T00:00:00Z
      - DurabilityTestRig.${g1}.occupied_station_count == 2 (x2 and x3; the ABORTED x1 no longer occupies a station)
