              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Dune Ledger", account_code: "DLG" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H9", row_code: "RQ", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9801", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 50, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: ProvisioningEngineer
              captures: { rv1: $.data.version }
          trigger:
            - call: "POST /colocation/power-circuits/${cir_id}/energize"
              payload: { expected_row_version: "${rv1}" }
              as: ProvisioningEngineer
            - call: "GET /colocation/cabinets/${cab_id}"
              as: ProvisioningEngineer
            - call: "GET /colocation/rows/${row_id}"
              as: ProvisioningEngineer
            - call: "GET /colocation/contracts/${ctr_id}"
              as: BillingOperator
          assert:
            - "The energize response already carries status ENERGIZED, allocated_kw 9.600, cooling_contribution_kw 9.600 and energized_at 2026-08-01T00:00:00Z"
            - "The cabinet read shows status ACTIVE, allocated_power_kw 9.600, cooling_load_kw 9.600 and energized_primary_circuit_count 1"
            - "The row read shows energized_cabinet_count 1, allocated_power_kw 9.600, cooling_load_kw 9.600, density_ceiling_kw 25.000, effective_ceiling_kw 25.000, stranded_nameplate_kw 15.400 and row_status OPEN"
            - "The contract read shows provisioned_power_kw 9.600, stranded_commit_kw 10.400 and commit_utilization_pct 48.0 — every level is consistent with no intervening write"

      - name: closed_period_invoice_lines_are_queryable_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/colocation/contracts/{contract_id}/billing-close
          - calculations.contract_provisioning_rollup.formula.billed_total_usd
        distinguishing_aspect: "The close response itself carries the refreshed billed_total_usd and last_closed_period_end, and the immutable InvoiceLine rows it appended are returned by the very next list read — the ledger and its aggregate never disagree, even momentarily."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract ACTIVE with power_commit_kw 20.0 and one RESERVED cabinet; no meter intervals and no cross-connects."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Dune Ledger", account_code: "DLG" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H9", row_code: "RR", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9802", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/contracts/${ctr_id}/billing-close"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: BillingOperator
            - call: "GET /colocation/invoice-lines?contract_id=${ctr_id}"
              as: BillingOperator
            - call: "GET /colocation/contracts/${ctr_id}"
              as: BillingOperator
          assert:
            - "The close response carries billed_total_usd == 3500.00, cross_connect_billed_usd == 0.00 and last_closed_period_end == 2026-08-01T00:00:00Z"
            - "The list read returns exactly 1 row of line_type POWER_COMMIT with amount_usd == 3500.00 and total_count == 1 — visible on the very next request"
            - "The contract read agrees with the close response on every field, so the aggregate and the ledger are never out of step"
