            - "DisposalUnit.${unit_id}.closure_plan_posting_due_date == 2026-09-30"
            - "DisposalUnit.${unit_id}.overdue_posting_types == [] because both obligation dates are still in the future"
            - "DisposalUnit.${unit_id}.compliance_posture == WATCH (a pending posting obligation is due on or after today)"
