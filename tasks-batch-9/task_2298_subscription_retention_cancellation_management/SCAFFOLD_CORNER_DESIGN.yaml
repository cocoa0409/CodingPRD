              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "TOO_MUCH_PRODUCT" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "POST /cancellation-sessions/${sess_id}/present-offers"
              payload: {}
              as: RetentionSpecialist
              as_user_id: "rs_22"
              captures: { grant_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${s_a_id}/compliance-notices"
              payload: { notice_type: "RENEWAL_REMINDER" }
              as: BillingOperator
              captures: { reminder_id: "$.data[0].id" }
            - call: "POST /compliance-notices/${reminder_id}/send"
              payload: {}
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${s_a_id}/renewals"
              payload: {}
              as: BillingOperator
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}", status: "OPEN" }
              as: BillingOperator
              captures: { inv1_id: "$.data[1].id" }
          assert:
            - "Response status is 200"
            - "CancellationSession.${sess_id}.state == ABANDONED"
            - "CancellationSession.${sess_id}.completed_at == 2026-02-07T00:00:00Z"
            - "SaveOfferGrant.${grant_id}.state == EXPIRED"
            - "SaveOfferGrant.${grant_id}.blended_term_margin_pct == 0.5799"
            - "Invoice.${inv1_id}.cycle_index == 1"
            - "Invoice.${inv1_id}.amount_cents == 4999"
            - "Invoice.${inv1_id}.is_renewal == true"
            - "Subscription.${s_a_id}.lifecycle_state == ACTIVE"
            - "Subscription.${s_a_id}.next_renewal_at == 2026-03-07T00:00:00Z"
            - "Subscription.${s_a_id}.term_shipments_delivered == 2"
            - "Subscription.${s_a_id}.term_shipments_remaining == 10"

      - name: resume_modification_returns_paused_subscription_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.Subscription.transitions.PAUSED_to_ACTIVE
          - state_machines.Subscription.transitions.ACTIVE_to_PAUSED
          - entities.Subscription.fields.pause_cycles_used
        distinguishing_aspect: |
          A subscriber-initiated PAUSE for exactly one cycle drives lifecycle_state to PAUSED with
          paused_until 2026-02-07, and the RESUME modification drives it back to ACTIVE with
          paused_until null while pause_cycles_used stays at 1 - neither leg moves
          committed_price_cents, so both rows carry delta_price_cents 0.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A at 4-week cadence, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "PAUSE", expected_subscription_version: "${v1}", pause_start_at: "2026-01-10T00:00:00Z", pause_end_at: "2026-02-07T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { pause_mod_id: $.data.id }
            - call: "GET /subscriptions/${s_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v2: $.data.version }
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "RESUME", expected_subscription_version: "${v2}" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { resume_mod_id: $.data.id }
          assert:
            - "Both modification responses have status 201"
            - "SubscriptionModification.${pause_mod_id}.state == APPLIED"
            - "SubscriptionModification.${pause_mod_id}.delta_price_cents == 0"
            - "SubscriptionModification.${resume_mod_id}.state == APPLIED"
            - "SubscriptionModification.${resume_mod_id}.delta_price_cents == 0"
            - "Subscription.${s_a_id}.lifecycle_state == ACTIVE"
            - "Subscription.${s_a_id}.paused_until == null"
            - "Subscription.${s_a_id}.pause_cycles_used == 1"
            - "Subscription.${s_a_id}.committed_price_cents == 4999"
            - "Subscription.${s_a_id}.version == 3"

      - name: subscription_parallel_axes_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Subscription
        excluded_because:
          difficulty_instance: non_linear_state_machine / subscription_parallel_axes_paused_while_past_due
          rationale: "The named §1.8 instance drives lifecycle_state and billing_state along independent paths and asserts the combined state."

      - name: winback_target_loops_back_to_eligible
        claim_type: cyclic
        grounds:
          - state_machines.WinBackTarget.transitions.EXPIRED_to_ELIGIBLE
        excluded_because:
          difficulty_instance: non_linear_state_machine / winback_target_cycles_back_to_eligible_and_resends
          rationale: "The named §1.8 instance walks ELIGIBLE -> SENT -> EXPIRED -> ELIGIBLE and asserts the loop's termination condition."

      - name: reversal_restores_every_snapshot_field_without_drift
        claim_type: compensation
        grounds:
          - endpoints["POST /subscription-modifications/{id}/reverse"].side_effects
          - entities.SubscriptionModification.fields.prior_snapshot
        excluded_because:
          difficulty_instance: compensating_invariant / committed_price_conserved_across_downgrade_and_reversal
          rationale: "The named §1.8 instance asserts that the forward-plus-compensating pair leaves committed_price_cents and the conservation sum identical."

      - name: write_off_cascades_down_the_billing_chain
        claim_type: cascade_down
        grounds:
          - endpoints["POST /_payments/simulate"].side_effects
          - state_machines.Invoice.transitions.FAILED_to_WRITTEN_OFF
        excluded_because:
          difficulty_instance: transitive_cascade / write_off_cascade_invoice_subscription_subscriber_session
          rationale: "The named §1.8 instance verifies the four-hop invoice -> subscription -> subscriber -> session cascade end to end."

      - name: grant_acceptance_guarded_by_billing_axis_of_another_entity
        claim_type: guarded_transitions
        grounds:
          - validations[priority=45]
          - state_machines.SaveOfferGrant.transitions.PRESENTED_to_ACCEPTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / offer_accept_gated_by_subscription_billing_state
          rationale: "The named §1.8 instance asserts the grant transition is admitted or refused purely on the Subscription's billing_state."

  # ===========================================================================
  - section: calculations
    instances:

      - name: signup_invoice_amount_and_cogs_match_the_pinned_line_construction
        claim_type: correct_result
        grounds:
          - calculations.invoice_amount_cents
          - entities.Invoice.fields.line_items
          - entities.Invoice.fields.amount_cents
          - entities.Invoice.fields.cogs_cents
        distinguishing_aspect: |
          With no discount the signup invoice is 4999 + 1299 = 6298 cents against 2100 + 520 = 2620
          cents of COGS, and line_items must appear in the pinned order (PLAN line first, then addon
          lines by code ASC) with per-line line_cents, not a single rolled-up total.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE (4999 / 2100) with MUG 1299 / 520 and TUMBLER 899 / 360; subscriber A subscribed with one MUG."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }, { code: "TUMBLER", unit_price_cents: 899, unit_cogs_cents: 360 }] }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true, addons: [{ code: "MUG", qty: 1 }] }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
          trigger:
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
          assert:
            - "Response status is 200"
            - "Invoice.${inv0_id}.amount_cents == 6298"
            - "Invoice.${inv0_id}.cogs_cents == 2620"
            - "Invoice.${inv0_id}.line_items has length 2"
            - "Invoice.${inv0_id}.line_items[0] == { kind: PLAN, code: CORE, unit_price_cents: 4999, qty: 1, line_cents: 4999 }"
            - "Invoice.${inv0_id}.line_items[1] == { kind: ADDON, code: MUG, unit_price_cents: 1299, qty: 1, line_cents: 1299 }"
            - "Invoice.${inv0_id}.proration_factor == 1.0000"

      - name: selector_priority_rank_dominates_a_richer_blended_margin
        claim_type: constraint_propagation
        grounds:
          - calculations.save_offer_selection
          - calculations.save_offer_margin_pct
          - entities.SaveOfferTemplate.fields.priority_rank
          - entities.SaveOfferGrant.fields.retention_value_cents
        distinguishing_aspect: |
          Two templates match reason PRICE: T_R5 (45 % off for 2 cycles, rank 5, blended 0.4877) and
          T_R60 (10 % off for 1 cycle, rank 60, blended 0.5691). The ranking expression is
          priority_rank ASC first, so the *less* profitable T_R5 must win - a selector that sorted by
          margin would present T_R60.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE (4999 / 2100, floor 0.4200); subscriber A subscribed at 4-week cadence."
            - "Templates T_R5 (DISCOUNT 0.4500 x 2, rank 5) and T_R60 (DISCOUNT 0.1000 x 1, rank 60) both list reason PRICE."
            - "A session captured reason PRICE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /save-offer-templates"
              payload: { code: "T_R5", name: "Deep Short Discount", offer_type: "DISCOUNT", priority_rank: 5, discount_pct: 0.4500, discount_cycles: 2, eligible_reason_codes: ["PRICE"] }
              as: PlatformAdmin
              captures: { t_r5_id: $.data.id }
            - call: "POST /save-offer-templates"
              payload: { code: "T_R60", name: "Shallow Discount", offer_type: "DISCOUNT", priority_rank: 60, discount_pct: 0.1000, discount_cycles: 1, eligible_reason_codes: ["PRICE"] }
              as: PlatformAdmin
              captures: { t_r60_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
          trigger:
            - call: "POST /cancellation-sessions/${sess_id}/present-offers"
              payload: {}
              as: RetentionSpecialist
              as_user_id: "rs_30"
              captures: { grant_id: $.data.id }
          assert:
            - "Response status is 201"
            - "SaveOfferGrant.${grant_id}.save_offer_template_id == ${t_r5_id}"
            - "SaveOfferGrant.${grant_id}.save_offer_template_id != ${t_r60_id}"
            - "SaveOfferGrant.${grant_id}.per_cycle_margin_pct == 0.2361"
            - "SaveOfferGrant.${grant_id}.blended_term_margin_pct == 0.4877"
            - "SaveOfferGrant.${grant_id}.retention_value_cents == 9995"
            - "SaveOfferGrant.${grant_id}.margin_exception_required == false"
            - "SaveOfferGrant.${grant_id}.margin_exception_state == NOT_REQUIRED"
            - "SaveOfferGrant.${grant_id}.expires_at == 2026-01-12T00:00:00Z"
            - "CancellationSession.${sess_id}.state == OFFERS_PRESENTED"
            - "CancellationSession.${sess_id}.presented_by_user_id == rs_30"

      - name: involuntary_score_ceiling_clips_a_high_raw_priority_score
        claim_type: constants_applied
        grounds:
          - calculations.winback_priority_score
          - calculations.winback_priority_score.constants.INVOLUNTARY_SCORE_CEILING
          - calculations.subscriber_lifetime_value
          - entities.WinBackTarget.fields.priority_score
        distinguishing_aspect: |
          An involuntary churner with realized LTV 1058, 34 days since lapse and a PRICE reason
          scores raw 0.4888, but INVOLUNTARY_SCORE_CEILING clips the stored priority_score to
          exactly 0.4000 - the clip is applied after rounding, so any value above the ceiling is
          impossible for INVOLUNTARY subscribers.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE (4999 / 2100, MUG 1299 / 520); subscriber A on ORGANIC subscribed with one MUG; a cancellation session captured reason PRICE but was never completed."
            - "The signup invoice (6298 / 2620) was paid, the cycle-1 reminder was sent on 2026-01-28, and the 2026-02-07 renewal issued invoice 1 (6298 / 2620)."
            - "Invoice 1 was hard-declined with DO_NOT_HONOR on its first attempt, writing it off: realized LTV 3678 - 2620 = 1058, churn INVOLUNTARY, lapsed_at 2026-02-07, suppression until 2026-03-09."
            - "Clock then advanced to 2026-03-13 and a LAUNCHED campaign with bounds [30, 120] exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }] }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true, addons: [{ code: "MUG", qty: 1 }] }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SUCCEEDED" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${s_a_id}/compliance-notices"
              payload: { notice_type: "RENEWAL_REMINDER" }
              as: BillingOperator
              captures: { reminder_id: "$.data[0].id" }
            - call: "POST /compliance-notices/${reminder_id}/send"
              payload: {}
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${s_a_id}/renewals"
              payload: {}
              as: BillingOperator
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}", status: "OPEN" }
              as: BillingOperator
              captures: { inv1_id: "$.data[0].id" }
            - call: "POST /invoices/${inv1_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv1_id}", outcome: "HARD_DECLINE", decline_code: "DO_NOT_HONOR" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /winback-campaigns"
              payload: { code: "WB_CEIL", name: "Ceiling Probe", min_days_since_lapse: 30, max_days_since_lapse: 120, offer_discount_pct: 0.2000 }
              as: RetentionSpecialist
              captures: { camp_id: $.data.id }
            - call: "POST /winback-campaigns/${camp_id}/launch"
              payload: {}
              as: RetentionSpecialist
              captures: { camp_v: $.data.version }
          trigger:
            - call: "POST /winback-campaigns/${camp_id}/targets"
              payload: { subscriber_id: "${sub_a_id}", expected_campaign_version: "${camp_v}" }
              as: RetentionSpecialist
              captures: { target_id: $.data.id }
          assert:
            - "Response status is 201"
            - "Subscriber.${sub_a_id}.churn_type == INVOLUNTARY"
            - "Subscriber.${sub_a_id}.realized_ltv_cents == 1058"
            - "Subscriber.${sub_a_id}.projected_ltv_cents == 1058"
            - "Subscriber.${sub_a_id}.winback_suppressed_until == 2026-03-09T00:00:00Z"
            - "WinBackTarget.${target_id}.days_since_lapse_at_target == 34"
            - "WinBackTarget.${target_id}.priority_score == 0.4000"
            - "WinBackTarget.${target_id}.projected_ltv_cents == 1058"
            - "WinBackTarget.${target_id}.state == ELIGIBLE"
            - "WinBackTarget.${target_id}.suppression_reason == NONE"
            - "WinBackCampaign.${camp_id}.targeted_count == 1"

      - name: cohort_membership_window_is_half_open_on_the_month_boundary
        claim_type: input_set_filtering
        grounds:
          - calculations.cohort_retention_metrics
          - entities.Subscriber.fields.cohort_month
          - entities.RetentionCohortSnapshot.fields.member_count
        distinguishing_aspect: |
          Subscriber A first subscribed 2026-01-10 and subscriber Z on 2026-02-10; the 2026-01
          snapshot must hold exactly one member (A, mean realized LTV 2899 from the paid 4999 / 2100
          invoice) and the 2026-02 snapshot exactly one member (Z, mean 0 because its invoice is
          still OPEN) - neither cohort may see the other's subscriber.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE (4999 / 2100); subscriber A on ORGANIC subscribed and paid the signup invoice."
            - "Clock 2026-02-10; subscriber Z on SEARCH subscribed, leaving its signup invoice OPEN."
          setup_api_calls:
