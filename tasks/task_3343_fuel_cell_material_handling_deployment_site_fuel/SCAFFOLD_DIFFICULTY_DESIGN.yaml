              as: SiteManager
              captures: { c1: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts/${c1}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-P2", location_type: "OUTDOOR", capacity_kg_per_day: 200, storage_capacity_kg: 500, construction_start: "2026-10-01", construction_end: "2026-11-01" }
              as: SiteManager
              captures: { st: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
