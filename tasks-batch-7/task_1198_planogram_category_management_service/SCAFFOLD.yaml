  # --- Test-driving clock ---
  - method: POST
    path: "/retailers/{id}/_clock/set_current_utc"
    description: "Set logical clock (default startup time is 2026-05-01T00:00:00Z)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "advance server logical clock"
      - "fire time-based transitions: DISCONTINUING→DELISTED products past effective_date; APPROVED→ACTIVE funding deals past starts_at; ACTIVE→CLOSED funding deals past ends_at; SCHEDULED→IN_PROGRESS reset projects past scheduled_start"

# =============================================================================
# §1.6 — Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id not found in retailer scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed payload, wrong types, missing required fields" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current entity version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "entity not in a state that permits the requested transition" }
  - { id: ERR_CATEGORY_LOCKED, http: 409, condition: "operation requires category.status == OPEN but it is LOCKED or ARCHIVED" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 422, condition: "CategoryManager user id equals the submitting CategoryCaptain user id (segregation-of-duties)" }
  - { id: ERR_CAPTAIN_CONFLICT, http: 422, condition: "funding deal coi_flag == CAPTAIN_BLOCKING_RIVAL — cannot be approved" }
  - { id: ERR_RESET_WINDOW_CONFLICT, http: 422, condition: "reset window overlaps another same-store project in {SCHEDULED, IN_PROGRESS} or start >= end" }
  - { id: ERR_CREW_OVERLAP, http: 422, condition: "assignment overlaps another ASSIGNED assignment on same crew or exceeds crew concurrency cap" }
  - { id: ERR_PRODUCT_NOT_LISTABLE, http: 422, condition: "referenced product not in {LISTED, DISCONTINUING} for planogram line create" }
  - { id: ERR_PLANOGRAM_INVALID, http: 422, condition: "planogram fails submit preconditions (no lines, utilization > 100, references DELISTED product)" }
  - { id: ERR_UNDERSTOCK_NOT_ALLOWED, http: 422, condition: "planogram has UNDERSTOCK line and category.role != CONVENIENCE" }
  - { id: ERR_DUPLICATE_ACTIVE_VARIANT, http: 422, condition: "another ACTIVE planogram already exists for same (category_id, variant)" }
  - { id: ERR_DISCONTINUATION_DATE_PAST, http: 422, condition: "discontinuation_effective_date is not in the future" }
  - { id: ERR_CATEGORY_HAS_OPEN_WORK, http: 422, condition: "category archive blocked by non-terminal planogram or reset project" }
  - { id: ERR_AUDIT_SCORE_RANGE, http: 422, condition: "matched_facings outside [0, total_facings_expected]" }
  - { id: ERR_LINE_INVALID, http: 422, condition: "capacity_units < facings, facings < 1, or position_index already used in this planogram" }
  - { id: ERR_VALIDATION, http: 422, condition: "generic business-rule violation fallback" }

# =============================================================================
# §1.7 — RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; can create retailers and set logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /retailers"
      - "POST /retailers/{rid}/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: RetailerAdmin
    description: "Retailer HQ operator; manages suppliers, stores, funding deals"
    identity: opaque
    exclusive_operations:
      - "POST /retailers/{rid}/suppliers"
      - "POST /retailers/{rid}/suppliers/{sid}/appoint-captain"
      - "POST /retailers/{rid}/stores"
      - "POST /retailers/{rid}/funding-deals/{fdid}/approve"
      - "POST /retailers/{rid}/funding-deals/{fdid}/reject"
    shared_operations:
      - "GET endpoints"
      - "POST /retailers/{rid}/funding-deals"

  - name: CategoryManager
    description: "Retailer category manager; approves planograms, cuts in products"
    identity: opaque
    exclusive_operations:
      - "POST /retailers/{rid}/categories"
      - "POST /retailers/{rid}/categories/{cid}/lock"
      - "POST /retailers/{rid}/categories/{cid}/unlock"
      - "POST /retailers/{rid}/categories/{cid}/archive"
      - "POST /retailers/{rid}/products/{pid}/list"
      - "POST /retailers/{rid}/products/{pid}/discontinue"
      - "POST /retailers/{rid}/products/{pid}/cancel-discontinuation"
      - "POST /retailers/{rid}/products/{pid}/relist"
      - "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/approve"
      - "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/reject"
      - "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/activate"
    shared_operations:
      - "GET endpoints"
      - "POST /retailers/{rid}/products"
      - "POST /retailers/{rid}/categories/{cid}/planograms"
      - "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/lines"
      - "DELETE /retailers/{rid}/categories/{cid}/planograms/{pid}/lines/{lid}"
      - "GET /retailers/{rid}/categories/{cid}/space-to-sales"
      - "POST /retailers/{rid}/categories/{cid}/reset-projects"

  - name: CategoryCaptain
    description: "External supplier-side category captain agency author"
    identity: entity_backed:Supplier
    exclusive_operations:
      - "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/submit"
      - "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/return-to-draft"
    shared_operations:
      - "GET endpoints"
      - "POST /retailers/{rid}/products"
      - "POST /retailers/{rid}/categories/{cid}/planograms"
      - "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/lines"
      - "DELETE /retailers/{rid}/categories/{cid}/planograms/{pid}/lines/{lid}"
      - "POST /retailers/{rid}/funding-deals"
      - "GET /retailers/{rid}/categories/{cid}/space-to-sales"

  - name: FieldAuditor
    description: "Submits store photo audits"
    identity: opaque
    exclusive_operations:
      - "POST /retailers/{rid}/stores/{sid}/audits"
    shared_operations:
      - "GET endpoints"

  - name: AuditReviewer
    description: "Scores audits; separate from submitter"
    identity: opaque
    exclusive_operations:
      - "POST /retailers/{rid}/stores/{sid}/audits/{aid}/score"
      - "POST /retailers/{rid}/stores/{sid}/audits/{aid}/reject"
    shared_operations:
      - "GET endpoints"

  - name: ResetCoordinator
    description: "Schedules reset labor"
    identity: opaque
    exclusive_operations:
      - "POST /retailers/{rid}/reset-crews"
      - "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/schedule"
      - "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/complete"
      - "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/cancel"
      - "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/assignments"
      - "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/assignments/{raid}/release"
    shared_operations:
      - "GET endpoints"
      - "POST /retailers/{rid}/categories/{cid}/reset-projects"
