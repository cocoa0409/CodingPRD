  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_parallel_attendance_x_billing
        grounds:
          - state_machines.Appointment.CHECKED_IN_to_ATTENDED
          - state_machines.Appointment.POSTED_to_ADJUDICATED
          - entities.Appointment.fields.attendance_status
          - entities.Appointment.fields.billing_status
        distinguishing_aspect: |
          The Appointment carries two independent state dimensions: completing it advances attendance_status
          BOOKED->CHECKED_IN->ATTENDED while billing_status moves UNBILLED->POSTED; a later adjudicate advances
          billing_status POSTED->ADJUDICATED WITHOUT touching attendance_status (stays ATTENDED). Parallel, not linear.
        test_recipe:
          setup:
            - "INSURANCE patient with an ACTIVE policy (cap 20, deductible_met already met, coinsurance 0.20, allowed 8000) and one ATTENDED+POSTED ADJUSTMENT appointment."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Ins Ida", date_of_birth: "1980-01-01", payer_mode: "INSURANCE" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/insurance-policies"
              payload: { carrier_name: "Acme", annual_visit_cap: 20, deductible_total_cents: 0, coinsurance_pct: 0.20, allowed_amount_cents: 8000 }
              as: BillingClerk
              captures: { pol_id: $.data.id }
