            - "Ben already holds a stay 2026-09-11 -> 2026-09-12, occupying night 09-11 only."
            - "So before the trigger, night 09-11 has occupancy 2 (full), night 09-10 and 09-12 have occupancy 1, and nights 09-13 onward have occupancy 0."
