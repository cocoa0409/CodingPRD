          - calculations.parts_conservation_invariant
        excluded_because:
          difficulty_instance: claim_reversal_cascades_population_metrics_then_autoschedules_followup_wave
          rationale: "That §1.8 instance asserts the full undo -- REVERSED with final_amount_cents retained at 18980, the row back to UNREPAIRED, remedied_count 0, completion 0.00 and the obligation back to 0 -- with no drift."

