            - "CommunityResource.${res}.open_referral_count == 0"

      - name: temporal_beats_constraint_when_past_window_also_collides
        grounds:
          - validations[priority=57]
          - validations[priority=70]
          - errors[ERR_TOUCH_WINDOW_IN_PAST]
          - errors[ERR_CARE_MANAGER_SLOT_CONFLICT]
        distinguishing_aspect: |
          Conflict pair three crosses `business_temporal` (priority 57) against
          `business_constraint` (priority 70): a touch whose window is both in the past and
          overlapping an existing SCHEDULED touch must return ERR_TOUCH_WINDOW_IN_PAST, while an
          otherwise identical future window that only collides returns ERR_CARE_MANAGER_SLOT_CONFLICT.
