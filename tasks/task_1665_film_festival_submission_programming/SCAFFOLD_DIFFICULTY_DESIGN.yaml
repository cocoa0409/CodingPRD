  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: submission_needs_info_revision_cycle
        grounds:
          - state_machines.Submission.SUBMITTED_to_NEEDS_INFO
          - state_machines.Submission.NEEDS_INFO_to_SUBMITTED
          - entities.Submission.fields.needs_info_resolved
        distinguishing_aspect: |
          Submission cycles SUBMITTED -> NEEDS_INFO -> SUBMITTED (a revision
          loop gated by the needs_info_resolved flag) while its independent
          payment_status dimension stays PAID — a cycle plus a second status
          dimension on the same entity.
        test_recipe:
          setup:
            - "Edition INTAKE_OPEN; one paid SHORT_FILM submission (status SUBMITTED, payment_status PAID)"
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000, screener_count_required: 2 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "Nora Voss", email: "nora@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Loop Study", runtime_minutes: 12, completion_date: "2025-06-01", premiere_status: NONE, production_company: "Loop Films", format: PRORES_4444 }, as: FILMMAKER, as_user_id: "${subm}", captures: { film: $.data.id } }
            - { call: "POST /festival/submissions/${film}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { pay: $.data.id } }
            - { call: "POST /festival/_payments/simulate", payload: { fee_payment_id: "${pay}", outcome: SUCCEEDED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submissions/${film}/eligibility-decision", payload: { decision: NEEDS_INFO, reason: "runtime credit sheet missing" }, as: FESTIVAL_ADMIN }
          trigger:
            - { call: "POST /festival/submissions/${film}/resubmit", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { err1: $.data.error_id } }
            - { call: "PATCH /festival/submissions/${film}", payload: { production_company: "Loop Films LLC" }, as: FILMMAKER, as_user_id: "${subm}", captures: { resolved: $.data.needs_info_resolved } }
            - { call: "POST /festival/submissions/${film}/resubmit", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { st2: $.data.status } }
            - { call: "POST /festival/submissions/${film}/eligibility-decision", payload: { decision: ELIGIBLE }, as: FESTIVAL_ADMIN, captures: { st3: $.data.status } }
            - { call: "GET /festival/submissions/${film}", payload: {}, as: FESTIVAL_ADMIN, captures: { payst: $.data.payment_status } }
          assert:
            - "first resubmit rejected: err1 == ERR_UNRESOLVED_INFO_REQUEST (needs_info_resolved was false)"
            - "PATCH while NEEDS_INFO sets needs_info_resolved == true"
            - "second resubmit succeeds: status == SUBMITTED (cycle completed)"
            - "final eligibility ruling lands: status == ELIGIBLE"
            - "payment_status == PAID throughout — the payment dimension never cycled"

      - name: slot_hold_release_and_reverse_programmed_cycle
        grounds:
          - state_machines.ScreeningSlot.OPEN_to_HELD
          - state_machines.ScreeningSlot.HELD_to_OPEN
          - state_machines.ScreeningSlot.CONFIRMED_to_CANCELLED
          - state_machines.SlateEntry.PROGRAMMED_to_CONFIRMED
        distinguishing_aspect: |
          ScreeningSlot cycles OPEN -> HELD -> OPEN -> HELD -> CONFIRMED and a
