            - "ScopeItem.${ib}.status == PENDING_APPROVAL and approval_tier == PM (variance 1001bp > 1000bp)"

      - name: vendor_calendar_half_open_adjacency_boundary
        grounds:
          - errors[ERR_VENDOR_OVERLAP]
          - entities.VendorAssignment.fields.start_date
          - entities.VendorAssignment.fields.end_date
        distinguishing_aspect: |
          Date-interval metric on POST /make-ready/vendor-assignments (different
          metric and endpoint than the variance boundary): half-open
          [start_date, end_date) means start == prior end (2026-08-08) is allowed
          adjacency, while a start one day inside (2026-08-07) collides.
        test_recipe:
          setup:
            - "Vendor V (CLEAN trade) has SCHEDULED assignment [2026-08-05, 2026-08-08) on turn T1"
            - "Turns T2 and T3 (separate units) each SCOPED with one PLANNED CLEAN item"
          setup_api_calls:
