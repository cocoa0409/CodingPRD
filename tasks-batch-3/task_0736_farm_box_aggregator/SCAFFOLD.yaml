# =============================================================================
# PRD Benchmark Seed Tables — Local Farm-Box & Online Farmers-Market Aggregator
# Difficulty: Expert
# =============================================================================
scenario: |
  736. Local Farm-Box & Online Farmers-Market Aggregator: multi-farm catalog & availability,
  customer order & pickup-hub/delivery slot, vendor allocation & packout, weight/variable
  pricing, SNAP/Double-Up match, vendor settlement & commission, substitution/refund,
  subscription option

domain_name: farm-box-aggregator
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation          # finite per-cycle farm availability reserved -> committed -> released
  secondary_archetype: pricing_engine          # weight/variable pricing + SNAP/Double-Up + commission/settlement
  complexity_layers:
    - dual_variant_calculation                 # estimated (order) vs final (packout) pricing & payout
    - cascading_side_effects                   # short -> refund -> customer credit ; cancel -> lines -> offering release
    - rate_threshold_triggers                  # Double-Up per-customer cap, availability boundary
    - optimistic_concurrency                   # settlement create OCC on Farm.version

  entity_topology: flat                        # peer entities linked by FK (no deep URL nesting), plus a few nested creates
  state_machine_shape: parallel                # Order carries order_status x payment_status; OrderLine branches; Subscription cycles
  relationship_patterns:
    - one_to_many
    - many_to_many                             # OrderLine bridges Order <-> Offering; substitute_offering_id is a second Offering ref
    - cross_aggregate                          # OrderLine.pack depends on parent Order state; settlement spans Farm+MarketCycle+lines
  role_model: peer_roles                        # Farm owns catalog/offerings/packout; Customer owns orders/subscriptions; PlatformAdmin operates
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Farm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Farm / vendor display name"
      - name: region_code
        type: string
        source: input
        description: "Geographic region code; scopes MarketCycle window-overlap checks"
      - name: commission_pct
        type: number
        source: input
        description: "Platform commission fraction taken from gross sales at settlement"
        constraints: ">= 0 and <= 1"
      - name: snap_authorized
        type: boolean
        source: input
        default: false
        description: "Whether this farm is authorized to sell SNAP-eligible products"
      - name: payout_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Running sum of net_payout_cents from this farm's finalized settlements"
      - name: settled_cycle_count
        type: integer
        source: computed
        default: 0
        description: "Number of finalized VendorSettlements for this farm (drives version bumps)"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: farm_id
        type: string
        source: input
        description: "FK -> Farm.id; the farm that owns this catalog product"
      - name: name
        type: string
        source: input
        description: "Product display name"
      - name: category
        type: enum
        source: input
        description: "Catalog category"
        constraints: "one of PRODUCE|DAIRY|MEAT|PANTRY|OTHER"
      - name: pricing_mode
        type: enum
        source: input
        description: "FIXED = priced per whole unit; WEIGHT = priced per kg with variable actual weight"
        constraints: "one of FIXED|WEIGHT"
      - name: unit_price_cents
        type: integer
        source: input
        default: null
        description: "Price per unit in cents (required when pricing_mode=FIXED; null for WEIGHT)"
      - name: price_per_kg_cents
        type: integer
        source: input
        default: null
        description: "Price per kilogram in cents (required when pricing_mode=WEIGHT; null for FIXED)"
      - name: estimated_weight_kg
        type: number
        source: input
        default: null
        description: "Estimated weight per ordered unit in kg (required when pricing_mode=WEIGHT; used for estimated pricing)"
      - name: snap_eligible
        type: boolean
        source: input
        default: false
        description: "Whether this product qualifies for SNAP payment and Double-Up match"

  - name: MarketCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_code
        type: string
        source: input
        description: "Human-readable cycle label"
      - name: region_code
        type: string
        source: input
        description: "Region this cycle serves; only one cycle per region may occupy an overlapping window"
      - name: order_open_at
        type: datetime
        source: input
        description: "Instant ordering opens (ISO 8601 UTC)"
      - name: order_cutoff_at
        type: datetime
        source: input
        description: "Instant ordering closes and allocation runs (ISO 8601 UTC); must be > order_open_at"
      - name: fulfillment_date
        type: datetime
        source: input
        description: "Instant orders are fulfilled/delivered (ISO 8601 UTC); must be > order_cutoff_at"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Lifecycle state"
        constraints: "one of SCHEDULED|OPEN|CUTOFF|SETTLED"

  - name: Offering
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the catalog product being offered this cycle"
      - name: market_cycle_id
        type: string
        source: input
        description: "FK -> MarketCycle.id; the cycle this availability belongs to"
      - name: offered_qty
        type: integer
        source: input
        description: "Whole units the farm makes available this cycle"
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        default: null
        description: "Cycle override for FIXED per-unit price; when null, resolves to Product.unit_price_cents"
      - name: price_per_kg_cents
        type: integer
        source: input
        default: null
        description: "Cycle override for WEIGHT per-kg price; when null, resolves to Product.price_per_kg_cents"
      - name: reserved_qty
        type: integer
        source: computed
        default: 0
        description: "Units held by OrderLines in {REQUESTED, ALLOCATED}"
      - name: committed_qty
        type: integer
        source: computed
        default: 0
        description: "Units consumed by OrderLines in {PACKED, SUBSTITUTED, FULFILLED} (fulfilled_qty)"
      - name: remaining_qty
        type: integer
        source: computed
        description: "offered_qty - reserved_qty - committed_qty; never negative"

  - name: PickupHub
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Hub display name"
      - name: hub_type
        type: enum
        source: input
        description: "PICKUP = customers collect (slot_capacity = concurrent pickup capacity); DELIVERY = time-slotted delivery"
        constraints: "one of PICKUP|DELIVERY"
      - name: slot_capacity
        type: integer
        source: input
        description: "Max number of DELIVERY orders whose [slot_start, slot_end) intervals may overlap at once"
        constraints: ">= 1"
      - name: region_code
        type: string
        source: input
        description: "Region this hub serves"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Customer display name"
      - name: snap_balance_cents
        type: integer
        source: input
        default: 0
        description: "Current SNAP/EBT balance in cents"
      - name: wallet_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Store credit accrued from refunds"
      - name: doubleup_used_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative Double-Up match consumed by this customer; capped at DOUBLEUP_CAP_CENTS; reversed on refund"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owning customer (taken from path)"
      - name: pickup_hub_id
        type: string
        source: input
        description: "FK -> PickupHub.id; hub the generated boxes route to"
      - name: box_size
        type: enum
        source: input
        description: "Box size tier"
        constraints: "one of SMALL|MEDIUM|LARGE"
      - name: cadence
        type: enum
        source: input
        description: "How often a box order is generated"
        constraints: "one of WEEKLY|BIWEEKLY"
      - name: price_cap_cents
        type: integer
        source: input
        description: "Maximum box value per generated order"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Lifecycle state (cyclic: ACTIVE <-> PAUSED, terminal CANCELLED)"
        constraints: "one of ACTIVE|PAUSED|CANCELLED"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: system
        description: "FK -> Customer.id; taken from X-User-ID of the acting Customer"
      - name: market_cycle_id
        type: string
        source: input
        description: "FK -> MarketCycle.id; the cycle this order is placed in"
      - name: pickup_hub_id
        type: string
        source: input
        description: "FK -> PickupHub.id; fulfillment hub"
      - name: subscription_id
        type: string
        source: system
        default: null
        description: "FK -> Subscription.id; set when the order was generated from a subscription, else null"
      - name: fulfillment_type
        type: enum
        source: input
        description: "PICKUP or DELIVERY; DELIVERY requires delivery_slot_start/end"
        constraints: "one of PICKUP|DELIVERY"
      - name: delivery_slot_start
        type: datetime
        source: input
        default: null
        description: "Delivery window start (ISO 8601 UTC); required when fulfillment_type=DELIVERY"
      - name: delivery_slot_end
        type: datetime
        source: input
        default: null
        description: "Delivery window end (ISO 8601 UTC); required when fulfillment_type=DELIVERY; must be > start"
      - name: subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of line estimated_line_cents (estimated variant), frozen at checkout"
      - name: eligible_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of estimated_line_cents for lines whose snap_eligible is true, frozen at checkout"
      - name: snap_applied_cents
        type: integer
        source: computed
        default: 0
        description: "SNAP dollars authorized against this order at checkout (frozen)"
      - name: doubleup_match_cents
        type: integer
        source: computed
        default: 0
        description: "Double-Up match authorized against this order at checkout (frozen)"
      - name: customer_owed_cents
        type: integer
        source: computed
        default: 0
        description: "Out-of-pocket owed; estimated at checkout then recomputed to final at fulfillment"
      - name: final_total_cents
        type: integer
        source: computed
        default: null
        description: "Final gross (sum of final_line_cents) set at fulfillment; null before fulfillment"
      - name: refunded_snap_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative SNAP restored to the customer by refunds on this order"
      - name: refunded_wallet_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative wallet credit issued by refunds on this order"
      - name: order_status
        type: enum
        source: system
        default: CART
        description: "Fulfillment dimension"
        constraints: "one of CART|PLACED|ALLOCATED|FULFILLED|CANCELLED"
      - name: payment_status
        type: enum
        source: system
        default: UNPAID
        description: "Payment dimension, evolves independently of order_status"
        constraints: "one of UNPAID|AUTHORIZED|CAPTURED|PARTIALLY_REFUNDED|REFUNDED"

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; parent order (taken from path)"
      - name: offering_id
        type: string
        source: input
        description: "FK -> Offering.id; the offering being purchased"
      - name: requested_qty
        type: integer
        source: input
        description: "Units requested"
        constraints: ">= 1"
      - name: allocated_qty
        type: integer
        source: computed
        default: null
        description: "Units allocated at cutoff (= requested_qty); null before allocation"
      - name: fulfilled_qty
        type: integer
        source: computed
        default: null
        description: "Units actually packed; set at packout; may be < allocated_qty (short)"
      - name: actual_weight_kg
        type: number
        source: computed
        default: null
        description: "Total actual weight for WEIGHT lines, recorded at packout"
      - name: snap_eligible
        type: boolean
        source: computed
        default: false
        description: "Copied from the offering's Product.snap_eligible when the line is added"
      - name: estimated_line_cents
        type: integer
        source: computed
        description: "Estimated line price (estimated pricing variant), set when line is added"
      - name: final_line_cents
        type: integer
        source: computed
        default: null
        description: "Final line price (final pricing variant), set at packout; null before"
      - name: substitute_offering_id
        type: string
        source: computed
        default: null
        description: "FK -> Offering.id; the replacement offering when line_status=SUBSTITUTED, else null"
      - name: price_delta_cents
        type: integer
        source: computed
        default: 0
        description: "final_line_cents - estimated_line_cents (negative on short/cheaper substitution)"
      - name: line_status
        type: enum
        source: system
        default: REQUESTED
        description: "Branching lifecycle"
        constraints: "one of REQUESTED|ALLOCATED|PACKED|SUBSTITUTED|SHORTED|FULFILLED|CANCELLED"

  - name: VendorSettlement
    parent: null
    common_fields: false
    fields:
      - name: farm_id
        type: string
        source: input
        description: "FK -> Farm.id; the settled farm (taken from path)"
      - name: market_cycle_id
        type: string
        source: input
        description: "FK -> MarketCycle.id; the settled cycle"
      - name: gross_sales_cents
        type: integer
        source: computed
        description: "Sum of final_line_cents over this farm's FULFILLED lines in the cycle"
      - name: commission_cents
        type: integer
        source: computed
        description: "Sum over lines of round_half_up(final_line_cents * Farm.commission_pct) — per-line rounding"
      - name: snap_reimbursable_cents
        type: integer
        source: computed
        description: "Portion of gross funded by SNAP/Double-Up, reimbursed to the farm by the program"
      - name: net_payout_cents
        type: integer
        source: computed
        description: "gross_sales_cents - commission_cents"
      - name: line_count
        type: integer
        source: computed
        description: "Number of FULFILLED lines swept into this settlement"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- MarketCycle: linear posture gate (SCHEDULED -> OPEN -> CUTOFF -> SETTLED) ---
  - entity: MarketCycle
    initial_state: SCHEDULED
    terminal_states: [SETTLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /market-cycles/{id}/open"
        actor: PlatformAdmin
        preconditions: ["cycle.status == SCHEDULED"]
        side_effects:
          - "Ordering is enabled for this cycle"
          - "For each Subscription in status ACTIVE whose pickup_hub_id.region_code == cycle.region_code, a box Order is generated (subscription_id set, order_status=CART) — see calc subscription_box_build"
      - from: OPEN
        to: CUTOFF
        trigger: "POST /market-cycles/{id}/cutoff"
        actor: PlatformAdmin
        preconditions: ["cycle.status == OPEN"]
        side_effects:
          - "Every Order in this cycle with order_status=PLACED transitions to ALLOCATED"
          - "Each such order's OrderLines transition REQUESTED -> ALLOCATED with allocated_qty = requested_qty (offering reserved_qty unchanged; still counted as reserved)"
          - "New order creation and checkout for this cycle are rejected (ERR_CYCLE_NOT_OPEN)"
      - from: CUTOFF
        to: SETTLED
        trigger: "POST /market-cycles/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "cycle.status == CUTOFF"
          - "every Order in this cycle has order_status in {FULFILLED, CANCELLED} (ERR_CYCLE_HAS_OPEN_ORDERS otherwise)"
        side_effects: ["VendorSettlement creation for this cycle is enabled"]

  # --- Order: PARALLEL dimensions order_status x payment_status ---
  - entity: Order
    initial_state: CART            # order_status dimension
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      # order_status dimension
      - from: CART
        to: PLACED
        trigger: "POST /orders/{id}/checkout"
        actor: Customer
        preconditions:
          - "acting Customer owns the order (X-User-ID == order.customer_id)"
          - "order.order_status == CART"
          - "order.market_cycle_id -> MarketCycle.status == OPEN (cross-entity, ERR_CYCLE_NOT_OPEN)"
          - "order has >= 1 OrderLine (ERR_EMPTY_ORDER)"
          - "if fulfillment_type=DELIVERY: adding this order's [delivery_slot_start, delivery_slot_end) to the hub keeps overlapping active-order count <= pickup_hub.slot_capacity (ERR_SLOT_CAPACITY_EXCEEDED)"
        side_effects:
          - "compute subtotal_cents, eligible_subtotal_cents, snap_applied_cents, doubleup_match_cents, customer_owed_cents via calc order_benefit_application (estimated variant)"
          - "Customer.snap_balance_cents -= snap_applied_cents"
          - "Customer.doubleup_used_cents += doubleup_match_cents"
          - "payment_status: UNPAID -> AUTHORIZED"
      - from: PLACED
        to: ALLOCATED
        trigger: "system on POST /market-cycles/{id}/cutoff"
        actor: system
        preconditions: ["order.order_status == PLACED"]
        side_effects: ["each OrderLine REQUESTED -> ALLOCATED (allocated_qty = requested_qty)"]
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: PlatformAdmin | Farm
        preconditions:
          - "order.order_status == ALLOCATED"
          - "every OrderLine is in a terminal packout state {PACKED, SUBSTITUTED, SHORTED} (ERR_LINES_NOT_PACKED)"
        side_effects:
          - "each OrderLine PACKED|SUBSTITUTED|SHORTED -> FULFILLED"
          - "final_total_cents = sum(final_line_cents); customer_owed_cents recomputed to final via calc order_benefit_application (final variant)"
          - "payment_status: AUTHORIZED -> CAPTURED"
      - from: CART
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions: ["order.order_status in {CART, PLACED, ALLOCATED}"]
        side_effects: ["cascade: see cancel side_effects on PLACED->CANCELLED (identical); from CART no benefits were applied so no refund"]
      - from: PLACED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions: ["order.order_status in {PLACED, ALLOCATED}"]
        side_effects:
          - "CASCADE L1: each non-terminal OrderLine -> CANCELLED"
          - "CASCADE L2 (caused by each line cancel): Offering.reserved_qty -= line.requested_qty (release), Offering.remaining_qty recomputed"
          - "full refund via calc refund_allocation: Customer.snap_balance_cents += snap_applied_cents; Customer.doubleup_used_cents -= doubleup_match_cents; Customer.wallet_credit_cents += customer_owed_cents; order.refunded_snap_cents += snap_applied_cents; order.refunded_wallet_cents += customer_owed_cents"
          - "payment_status: AUTHORIZED -> REFUNDED"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions: ["order.order_status == ALLOCATED", "no OrderLine has line_status in {PACKED, SUBSTITUTED, SHORTED, FULFILLED} (ERR_ORDER_IN_PACKOUT)"]
        side_effects: ["identical cascade + refund as PLACED -> CANCELLED"]

  # --- OrderLine: BRANCHING fork-join (ALLOCATED -> {PACKED, SUBSTITUTED, SHORTED} -> FULFILLED) ---
  - entity: OrderLine
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "system on cycle cutoff"
        actor: system
        preconditions: ["line.line_status == REQUESTED", "parent Order.order_status == PLACED"]
        side_effects: ["allocated_qty = requested_qty"]
      - from: ALLOCATED
        to: PACKED
        trigger: "POST /order-lines/{id}/pack (fulfilled_qty == allocated_qty, no substitute)"
        actor: Farm | PlatformAdmin
        preconditions:
          - "line.line_status == ALLOCATED"
          - "parent Order.order_status == ALLOCATED (cross-entity, ERR_ORDER_NOT_ALLOCATED)"
          - "acting Farm owns the line's offering.product.farm_id (ERR_NOT_LINE_OWNER)"
          - "fulfilled_qty == allocated_qty and fulfilled_qty >= 1"
          - "for WEIGHT products actual_weight_kg > 0 (ERR_INVALID_WEIGHT)"
        side_effects:
          - "final_line_cents via calc line_pricing (final variant); price_delta_cents = final_line_cents - estimated_line_cents"
          - "Offering.reserved_qty -= requested_qty; Offering.committed_qty += fulfilled_qty"
          - "if price_delta_cents < 0: partial refund via calc refund_allocation"
          - "if price_delta_cents > 0: Order.customer_owed_cents accrues the delta at fulfillment (recomputed then)"
      - from: ALLOCATED
        to: SHORTED
        trigger: "POST /order-lines/{id}/pack (fulfilled_qty < allocated_qty)"
        actor: Farm | PlatformAdmin
        preconditions:
          - "line.line_status == ALLOCATED"
          - "parent Order.order_status == ALLOCATED"
          - "acting Farm owns the line's offering.product.farm_id"
          - "0 <= fulfilled_qty < allocated_qty"
        side_effects:
          - "CASCADE L1: final_line_cents via calc line_pricing over fulfilled_qty/actual_weight_kg; price_delta_cents = final_line_cents - estimated_line_cents (negative); Offering.reserved_qty -= requested_qty; Offering.committed_qty += fulfilled_qty"
          - "CASCADE L2 (caused by the short): credit = estimated_line_cents - final_line_cents; Order.refunded_snap_cents / refunded_wallet_cents updated per calc refund_allocation; Order.payment_status -> PARTIALLY_REFUNDED"
          - "CASCADE L3 (caused by the refund record): Customer.snap_balance_cents += refund_to_snap; Customer.doubleup_used_cents -= refund_to_doubleup; Customer.wallet_credit_cents += refund_to_wallet"
      - from: ALLOCATED
        to: SUBSTITUTED
        trigger: "POST /order-lines/{id}/pack (substitute_offering_id provided)"
        actor: Farm | PlatformAdmin
        preconditions:
          - "line.line_status == ALLOCATED"
          - "parent Order.order_status == ALLOCATED"
          - "acting Farm owns both the original line's product farm AND the substitute offering's product farm (ERR_NOT_LINE_OWNER)"
          - "substitute offering belongs to the same market_cycle_id as the line's offering (ERR_OFFERING_CYCLE_MISMATCH)"
          - "substitute offering has remaining_qty >= substitute_qty (ERR_INSUFFICIENT_AVAILABILITY)"
        side_effects:
          - "substitute_offering_id set; final_line_cents via calc line_pricing over the substitute offering price & substitute_qty; price_delta_cents = final_line_cents - estimated_line_cents"
          - "original Offering.reserved_qty -= requested_qty; substitute Offering.committed_qty += substitute_qty"
          - "if price_delta_cents < 0: partial refund via calc refund_allocation (Order.payment_status -> PARTIALLY_REFUNDED, Customer credited)"
      - from: PACKED
        to: FULFILLED
        trigger: "system on POST /orders/{id}/fulfill"
        actor: system
        preconditions: ["parent Order.order_status == ALLOCATED"]
        side_effects: ["line frozen for settlement"]
      - from: SUBSTITUTED
        to: FULFILLED
        trigger: "system on POST /orders/{id}/fulfill"
        actor: system
        preconditions: ["parent Order.order_status == ALLOCATED"]
        side_effects: ["line frozen for settlement"]
      - from: SHORTED
        to: FULFILLED
        trigger: "system on POST /orders/{id}/fulfill"
        actor: system
        preconditions: ["parent Order.order_status == ALLOCATED"]
        side_effects: ["line frozen for settlement (fulfilled_qty may be 0)"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "system on order cancel"
        actor: system
        preconditions: ["parent Order.order_status in {CART, PLACED}"]
        side_effects: ["Offering.reserved_qty -= requested_qty"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "system on order cancel"
        actor: system
        preconditions: ["parent Order.order_status == ALLOCATED", "line not yet packed"]
        side_effects: ["Offering.reserved_qty -= requested_qty"]

  # --- Subscription: CYCLIC (ACTIVE <-> PAUSED), terminal CANCELLED ---
  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Customer | PlatformAdmin
        preconditions: ["acting Customer owns subscription", "subscription.status == ACTIVE"]
        side_effects: ["no box orders generated while PAUSED"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: Customer | PlatformAdmin
        preconditions: ["acting Customer owns subscription", "subscription.status == PAUSED"]
        side_effects: ["box order generation resumes at next cycle open"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions: ["acting Customer owns subscription", "subscription.status == ACTIVE"]
        side_effects: ["subscription permanently closed"]
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions: ["acting Customer owns subscription", "subscription.status == PAUSED"]
        side_effects: ["subscription permanently closed"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-farm
    parent_entity: Farm
    write_endpoint: "POST /farms/{id}/settlements"
    occ_field: "expected_farm_version"
    description: |
      Creating a VendorSettlement against a Farm whose version has advanced since the client
      last observed it is rejected. A settlement finalizes a farm's payout for a cycle and
      posts net_payout_cents into Farm.payout_balance_cents (bumping Farm.version). A second
      create whose expected_farm_version is stale reflects a view of the farm's payout balance
      taken before an earlier settlement posted, so it is rejected to prevent double-posting
      payout onto a stale balance.
    error_id: ERR_STALE_FARM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- DUAL-VARIANT #1 (OrderLine domain): estimated vs final line pricing ---
  - name: line_pricing
    trigger: "estimated variant on POST /orders/{id}/lines (line add); final variant on POST /order-lines/{id}/pack"
    algorithm: forward_looking
    input_set: "one OrderLine and its resolved Offering price; WEIGHT vs FIXED branch on the offering's Product.pricing_mode"
    formula: |
      # price resolution (offering override wins, else product base):
      eff_unit_price   = offering.unit_price_cents   if not null else product.unit_price_cents
      eff_price_per_kg = offering.price_per_kg_cents  if not null else product.price_per_kg_cents

      # ESTIMATED variant (at line add), uses requested_qty and estimated weight:
      if product.pricing_mode == FIXED:
        estimated_line_cents = requested_qty * eff_unit_price
      else:  # WEIGHT
        estimated_line_cents = round_half_up(requested_qty * product.estimated_weight_kg * eff_price_per_kg)

      # FINAL variant (at packout), uses fulfilled_qty and measured actual_weight_kg:
      if product.pricing_mode == FIXED:
        final_line_cents = fulfilled_qty * eff_unit_price
      else:  # WEIGHT
        final_line_cents = round_half_up(actual_weight_kg * eff_price_per_kg)
      # substitution: final uses the SUBSTITUTE offering's resolved price and substitute_qty/weight
    constants: {}
    precision: "whole cents, round_half_up; rounding applied once per line after the weight product"
    variants:
      - name: estimated
        when: "line add / checkout (before packout)"
        difference: "uses requested_qty and Product.estimated_weight_kg; writes estimated_line_cents"
      - name: final
        when: "packout (POST /order-lines/{id}/pack)"
        difference: "uses fulfilled_qty and measured actual_weight_kg (or substitute offering); writes final_line_cents. For identical requested/fulfilled units a WEIGHT line's final differs from estimated because actual weight != estimated weight"

  # --- COMBINATORIAL mode (a) (Order/Customer domain): SNAP + Double-Up application ---
  - name: order_benefit_application
    trigger: "estimated variant on POST /orders/{id}/checkout; final variant on POST /orders/{id}/fulfill"
    algorithm: threshold
    input_set: "all OrderLines of the order (estimated_line_cents for estimated variant; final_line_cents for final variant), Customer.snap_balance_cents, Customer.doubleup_used_cents"
    formula: |
      subtotal_cents         = sum(line.estimated_line_cents for all lines)          # (final: sum final_line_cents)
      eligible_subtotal_cents= sum(line.estimated_line_cents for lines where line.snap_eligible)  # (final: final_line_cents)
      snap_applied_cents     = min(customer.snap_balance_cents, eligible_subtotal_cents)
      doubleup_match_cents   = min(snap_applied_cents, max(0, DOUBLEUP_CAP_CENTS - customer.doubleup_used_cents))
      customer_owed_cents    = max(0, subtotal_cents - snap_applied_cents - doubleup_match_cents)
      # FINAL variant note: snap_applied_cents and doubleup_match_cents are FROZEN at their checkout
      # (estimated) values and are NOT recomputed at fulfillment. Only subtotal is refreshed to the
      # final gross, so: final customer_owed_cents = max(0, final_gross - snap_applied_cents(frozen) - doubleup_match_cents(frozen)).
      # Evaluation order is fixed: subtotal -> eligible -> snap -> doubleup -> owed.
    constants:
      DOUBLEUP_CAP_CENTS: 2000
    precision: "integer cents; no rounding (all inputs are integer cents)"
    variants:
      - name: estimated
        when: "checkout"
        difference: "consumes Customer.snap_balance_cents and increments doubleup_used_cents; freezes snap_applied_cents/doubleup_match_cents on the order"
      - name: final
        when: "fulfillment"
        difference: "recomputes only subtotal/owed from final_line_cents; snap & doubleup stay frozen, so heavier actual weights raise customer_owed_cents out-of-pocket"

  # --- DUAL-VARIANT #2 (Farm/Settlement domain) + COMBINATORIAL mode (b) nested rounding ---
  - name: vendor_settlement_payout
    trigger: "provisional variant reported at cutoff (allocation preview); final variant on POST /farms/{id}/settlements"
    algorithm: aggregation
    input_set: "the farm's lines in the cycle; provisional includes ALLOCATED lines using estimated_line_cents; final includes only FULFILLED lines using final_line_cents"
    formula: |
      # candidate lines = OrderLines whose offering.product.farm_id == farm.id AND market_cycle_id == cycle.id
      # FINAL variant: candidate lines further filtered to line_status == FULFILLED, valued by final_line_cents.
      gross_sales_cents = sum(line.final_line_cents for candidate FULFILLED lines)
      # PER-LINE commission rounding (pinned order): round each line THEN sum. This differs in cents
      # from sum-then-round. e.g. two lines of 1010 @ 0.15 -> round(151.5)+round(151.5)=152+152=304,
      # whereas round(2020*0.15)=303.
      commission_cents = sum(round_half_up(line.final_line_cents * farm.commission_pct) for candidate FULFILLED lines)
      net_payout_cents = gross_sales_cents - commission_cents
      snap_reimbursable_cents = sum(snap+doubleup dollars attributable to this farm's FULFILLED snap_eligible lines)
      line_count = count(candidate FULFILLED lines)
    constants: {}
    precision: "whole cents, round_half_up; commission rounded PER LINE before summation (order pinned)"
    variants:
      - name: provisional
        when: "allocation preview at cutoff"
        difference: "includes ALLOCATED lines valued by estimated_line_cents; per-line commission over estimates"
      - name: final
        when: "settlement create"
        difference: "includes only FULFILLED lines valued by final_line_cents; SHORTED lines with fulfilled_qty=0 contribute 0; differs from provisional because actual weights and short/substitution outcomes change the included set and values"

  # --- Availability aggregation (Offering domain) ---
  - name: offering_availability
    trigger: "recomputed on line add, cancel, allocation, packout, substitution"
    algorithm: aggregation
    input_set: "one Offering; its OrderLines partitioned by line_status"
    formula: |
      reserved_qty  = sum(line.requested_qty for lines where line_status in {REQUESTED, ALLOCATED})
      committed_qty = sum(line.fulfilled_qty  for lines where line_status in {PACKED, SUBSTITUTED, FULFILLED})
      remaining_qty = offered_qty - reserved_qty - committed_qty
      # INVARIANT (conserved quantity, units): offered_qty == remaining_qty + reserved_qty + committed_qty at all times.
    constants: {}
    precision: "integer units; remaining_qty must never be persisted negative (a request that would drive it negative is rejected pre-write)"

  # --- Refund allocation (compensation; Customer/Order domain) ---
  - name: refund_allocation
    trigger: "on short (SHORTED), cheaper substitution, or order cancel"
    algorithm: waterfall_allocation
    input_set: "the credit amount, the order's frozen snap_applied_cents/doubleup_match_cents and already-refunded counters"
    formula: |
      # credit is the cents to return for the affected line (or whole order on cancel).
      # Waterfall order is PINNED: SNAP first, then Double-Up reversal, then wallet.
      remaining_snap = order.snap_applied_cents - order.refunded_snap_cents
      # doubleup reversal so far on this order = doubleup_match_cents - (current Customer.doubleup_used_cents
      # contribution from this order). For the single-refund test cases this reduces to order.doubleup_match_cents.
      remaining_du   = order.doubleup_match_cents - doubleup_already_reversed_for_this_order
      if line.snap_eligible:
        refund_to_snap     = min(credit, remaining_snap)
        refund_to_doubleup = min(credit - refund_to_snap, remaining_du)
        refund_to_wallet   = credit - refund_to_snap - refund_to_doubleup
      else:
        refund_to_snap = 0; refund_to_doubleup = 0; refund_to_wallet = credit
      # side effects:
      #   Customer.snap_balance_cents   += refund_to_snap
      #   Customer.doubleup_used_cents  -= refund_to_doubleup      (reverse the match)
      #   Customer.wallet_credit_cents  += refund_to_wallet
      #   Order.refunded_snap_cents     += refund_to_snap
      #   Order.refunded_wallet_cents   += refund_to_wallet
      # INVARIANT (conserved quantity, SNAP cents): for a full forward(checkout)+compensate(full refund)
      # pair, Customer.snap_balance_cents returns to its pre-checkout value (snap dollars conserved).
    constants: {}
    precision: "integer cents; waterfall order SNAP -> Double-Up -> wallet is pinned and not order-sensitive across lines because each line consumes from the shared remaining counters in line-creation order (created_at ASC)"

  # --- Subscription box build (order generation) ---
  - name: subscription_box_build
    trigger: "system on POST /market-cycles/{id}/open for each ACTIVE subscription in the region"
    algorithm: aggregation
    input_set: "the subscription and the cycle's LISTED offerings for the subscription's box"
    formula: |
      # Generates a CART Order (subscription_id set, fulfillment via subscription.pickup_hub_id, PICKUP).
      # Box target value by size: SMALL=1500, MEDIUM=3000, LARGE=6000 cents, capped at price_cap_cents.
      target = min(BOX_TARGET_CENTS[box_size], subscription.price_cap_cents)
      # Candidate offerings = offerings in this cycle whose Product.category == PRODUCE.
      # They are added in ascending Offering.created_at (tie-break: none needed; created_at is the sole,
      # deterministic order key — id is NEVER used) until adding the next offering's one-unit
      # estimated_line_cents would push the cumulative box value above target; each added offering
      # contributes a single unit (requested_qty = 1).
    constants:
      BOX_TARGET_CENTS: { SMALL: 1500, MEDIUM: 3000, LARGE: 6000 }
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "each path-referenced resource exists, validated left-to-right (farm, cycle, order, line, subscription, settlement)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "body-referenced FK targets exist (product_id, offering_id, market_cycle_id, pickup_hub_id, substitute_offering_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /orders, POST /orders/{id}/lines, POST /market-cycles/{id}/offerings, POST /order-lines/{id}/pack, POST /customers/{id}/subscriptions, POST /farms/{id}/settlements"

  - priority: 5
    category: existence
    check: "acting entity_backed user owns the target resource (Customer owns order/subscription; Farm owns product/offering being written)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer order/subscription writes; Farm product/offering writes"

  - priority: 6
    category: business_constraint
    check: "pagination params valid: limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list (GET collection) endpoints"

  - priority: 6
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, quantities >= 1, commission_pct in [0,1], delivery slots present & end>start for DELIVERY, WEIGHT product carries price_per_kg_cents+estimated_weight_kg, FIXED carries unit_price_cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT with a body"

  # ----- STATE preconditions -----
  # priority 7 is checked BEFORE the generic line-state check (priority 9), which is what makes
  # ERR_ORDER_NOT_ALLOCATED reachable: packing a line while its Order is still PLACED (pre-cutoff)
  # trips 7 first; re-packing an already-PACKED line while the Order is ALLOCATED trips 9.
  - priority: 7
    category: state
    check: "parent Order.order_status == ALLOCATED when packing one of its lines (cross-entity, checked before the line's own state)"
    error_id: ERR_ORDER_NOT_ALLOCATED
    http_status: 409
    applies_to: "POST /order-lines/{id}/pack"

  - priority: 8
    category: state
    check: "MarketCycle.status == OPEN when creating an order, adding a line, or checking out (CONFLICT-A state leg)"
    error_id: ERR_CYCLE_NOT_OPEN
    http_status: 409
    applies_to: "POST /orders, POST /orders/{id}/lines, POST /orders/{id}/checkout"

  - priority: 9
    category: state
    check: "target resource is in a state permitting the transition (line ALLOCATED for pack; order CART for add-line/checkout; order ALLOCATED for fulfill; subscription status matches pause/resume/cancel; cycle SCHEDULED/OPEN/CUTOFF matches open/cutoff/settle)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "checkout of an order with zero lines"
    error_id: ERR_EMPTY_ORDER
    http_status: 409
    applies_to: "POST /orders/{id}/checkout"

  - priority: 9
    category: state
    check: "fulfill requires every OrderLine in {PACKED, SUBSTITUTED, SHORTED}"
    error_id: ERR_LINES_NOT_PACKED
    http_status: 409
    applies_to: "POST /orders/{id}/fulfill"

  - priority: 9
    category: state
    check: "cancel of an ALLOCATED order rejected once any line is PACKED/SUBSTITUTED/SHORTED/FULFILLED"
    error_id: ERR_ORDER_IN_PACKOUT
    http_status: 409
    applies_to: "POST /orders/{id}/cancel"

  - priority: 9
    category: state
    check: "settle requires every order in the cycle to be FULFILLED or CANCELLED"
    error_id: ERR_CYCLE_HAS_OPEN_ORDERS
    http_status: 409
    applies_to: "POST /market-cycles/{id}/settle"

  # ----- business_referential (priority 10) -----
  - priority: 10
    category: business_referential
    check: "on offering create, product_id.farm_id == acting Farm (CONFLICT-B referential leg)"
    error_id: ERR_PRODUCT_FARM_MISMATCH
    http_status: 409
    applies_to: "POST /market-cycles/{id}/offerings"

  - priority: 10
    category: business_referential
    check: "on substitution, substitute offering's market_cycle_id == original line's offering.market_cycle_id"
    error_id: ERR_OFFERING_CYCLE_MISMATCH
    http_status: 409
    applies_to: "POST /order-lines/{id}/pack (substitute)"

  - priority: 10
    category: business_referential
    check: "acting Farm owns the line's offering.product.farm_id (and, for substitution, the substitute offering's farm too) when packing"
    error_id: ERR_NOT_LINE_OWNER
    http_status: 403
    applies_to: "POST /order-lines/{id}/pack"

  # ----- business_safety (priority 11): SNAP authorization (CONFLICT-B safety leg) -----
  - priority: 11
    category: business_safety
    check: "a snap_eligible product may only be created/offered under a Farm whose snap_authorized == true"
    error_id: ERR_FARM_NOT_SNAP_AUTHORIZED
    http_status: 422
    applies_to: "POST /farms/{id}/products, POST /market-cycles/{id}/offerings"

  # ----- business_temporal (priority 12) -----
  - priority: 12
    category: business_temporal
    check: "on cycle create, no other MarketCycle with the same region_code has a [order_open_at, fulfillment_date] window within CYCLE_BUFFER_HOURS (closed intervals + 24h buffer)"
    error_id: ERR_CYCLE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /market-cycles"

  # ----- business_constraint (priority 13): capacity / geometry / measurement -----
  - priority: 13
    category: business_constraint
    check: "on DELIVERY checkout, count of active-order [slot_start, slot_end) intervals overlapping (half-open; adjacency end==start allowed) on the hub stays <= slot_capacity"
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/checkout"

  - priority: 13
    category: business_constraint
    check: "on pack, fulfilled_qty <= allocated_qty (over-pack rejected)"
    error_id: ERR_OVER_PACK
    http_status: 409
    applies_to: "POST /order-lines/{id}/pack"

  - priority: 13
    category: business_constraint
    check: "on pack of a WEIGHT line with fulfilled_qty >= 1, actual_weight_kg must be present and > 0"
    error_id: ERR_INVALID_WEIGHT
    http_status: 422
    applies_to: "POST /order-lines/{id}/pack"

  # ----- business_fiscal (priority 14): availability / quota / OCC (CONFLICT-A fiscal leg) -----
  - priority: 14
    category: business_fiscal
    check: "requested_qty <= offering.remaining_qty on line add (and substitute_qty <= substitute offering.remaining_qty on substitution)"
    error_id: ERR_INSUFFICIENT_AVAILABILITY
    http_status: 409
    applies_to: "POST /orders/{id}/lines, POST /order-lines/{id}/pack (substitute)"

  - priority: 14
    category: business_fiscal
    check: "on settlement create, expected_farm_version == Farm.version (OCC); stale -> reject"
    error_id: ERR_STALE_FARM_VERSION
    http_status: 412
    applies_to: "POST /farms/{id}/settlements"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Farm -----
  - method: POST
    path: "/farms"
    description: "Create a farm/vendor"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, commission_pct, "snap_authorized?"]
    output: Farm
    side_effects: ["payout_balance_cents=0, settled_cycle_count=0, version=1"]
  - method: GET
    path: "/farms/{id}"
    description: "Get a farm (exposes version and payout_balance_cents for OCC and settlement observation)"
    roles: [PlatformAdmin, Farm, Customer]
    code: 200
    input: []
    output: Farm
    side_effects: []
  - method: GET
    path: "/farms/{id}/products"
    description: "List a farm's catalog products (reverse-reachability for Product.farm_id)"
    roles: [PlatformAdmin, Farm, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  # ----- Product -----
  - method: POST
    path: "/farms/{id}/products"
    description: "Create a catalog product under a farm"
    roles: [PlatformAdmin, Farm]
    code: 201
    input: [name, category, pricing_mode, "unit_price_cents?", "price_per_kg_cents?", "estimated_weight_kg?", "snap_eligible?"]
    output: Product
    side_effects: ["snap_eligible product requires Farm.snap_authorized (ERR_FARM_NOT_SNAP_AUTHORIZED)"]

  # ----- MarketCycle -----
  - method: POST
    path: "/market-cycles"
    description: "Create a market cycle (rejects region window overlap within 24h buffer)"
    roles: [PlatformAdmin]
    code: 201
    input: [cycle_code, region_code, order_open_at, order_cutoff_at, fulfillment_date]
    output: MarketCycle
    side_effects: ["status=SCHEDULED", "ERR_CYCLE_WINDOW_CONFLICT on same-region overlapping window"]
  - method: GET
    path: "/market-cycles/{id}"
    description: "Get a market cycle (exposes status)"
    roles: [PlatformAdmin, Farm, Customer]
    code: 200
    input: []
    output: MarketCycle
    side_effects: []
  - method: POST
    path: "/market-cycles/{id}/open"
    description: "Open ordering; generate subscription box orders for the region"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MarketCycle
    side_effects: ["status SCHEDULED->OPEN", "generate CART orders for ACTIVE subscriptions in region (subscription_box_build)"]
  - method: POST
    path: "/market-cycles/{id}/cutoff"
    description: "Close ordering and run allocation"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MarketCycle
    side_effects: ["status OPEN->CUTOFF", "PLACED orders -> ALLOCATED; their lines REQUESTED -> ALLOCATED"]
  - method: POST
    path: "/market-cycles/{id}/settle"
    description: "Mark cycle settled (enables settlement)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MarketCycle
    side_effects: ["status CUTOFF->SETTLED", "requires all orders FULFILLED/CANCELLED (ERR_CYCLE_HAS_OPEN_ORDERS)"]

  # ----- Offering -----
  - method: POST
    path: "/market-cycles/{id}/offerings"
    description: "Farm offers a product with a quantity in this cycle"
    roles: [PlatformAdmin, Farm]
    code: 201
    input: [product_id, offered_qty, "unit_price_cents?", "price_per_kg_cents?"]
    output: Offering
    side_effects: ["reserved_qty=0, committed_qty=0, remaining_qty=offered_qty", "ERR_PRODUCT_FARM_MISMATCH / ERR_FARM_NOT_SNAP_AUTHORIZED"]
  - method: GET
    path: "/offerings/{id}"
    description: "Get an offering (exposes reserved/committed/remaining_qty)"
    roles: [PlatformAdmin, Farm, Customer]
    code: 200
    input: []
    output: Offering
    side_effects: []
  - method: GET
    path: "/offerings"
    description: "List offerings (reverse-reachability for Offering.product_id, Offering.market_cycle_id)"
    roles: [PlatformAdmin, Farm, Customer]
    code: 200
    input: ["product_id?", "market_cycle_id?", "farm_id?", "limit?", "offset?"]
    output: "Offering[]"
    side_effects: []

  # ----- PickupHub -----
  - method: POST
    path: "/pickup-hubs"
    description: "Create a pickup or delivery hub"
    roles: [PlatformAdmin]
    code: 201
    input: [name, hub_type, slot_capacity, region_code]
    output: PickupHub
    side_effects: []
  - method: GET
    path: "/pickup-hubs/{id}"
    description: "Get a hub"
    roles: [PlatformAdmin, Farm, Customer]
    code: 200
    input: []
    output: PickupHub
    side_effects: []

  # ----- Customer -----
  - method: POST
    path: "/customers"
    description: "Create a customer with an initial SNAP balance"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "snap_balance_cents?"]
    output: Customer
    side_effects: ["wallet_credit_cents=0, doubleup_used_cents=0"]
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer (exposes snap_balance_cents, wallet_credit_cents, doubleup_used_cents)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ----- Subscription -----
  - method: POST
    path: "/customers/{id}/subscriptions"
    description: "Create a box subscription for a customer"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [pickup_hub_id, box_size, cadence, price_cap_cents]
    output: Subscription
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/subscriptions/{id}"
    description: "Get a subscription"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions (reverse-reachability for Subscription.customer_id, Subscription.pickup_hub_id)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: ["customer_id?", "pickup_hub_id?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/pause"
    description: "Pause an active subscription"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status ACTIVE->PAUSED"]
  - method: POST
    path: "/subscriptions/{id}/resume"
    description: "Resume a paused subscription"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status PAUSED->ACTIVE"]
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a subscription"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status ->CANCELLED"]

  # ----- Order -----
  - method: POST
    path: "/orders"
    description: "Create a CART order in an OPEN cycle"
    roles: [Customer]
    code: 201
    input: [market_cycle_id, pickup_hub_id, fulfillment_type, "delivery_slot_start?", "delivery_slot_end?"]
    output: Order
    side_effects: ["customer_id from X-User-ID", "order_status=CART, payment_status=UNPAID", "ERR_CYCLE_NOT_OPEN if cycle not OPEN"]
  - method: GET
    path: "/orders/{id}"
    description: "Get an order (exposes totals, statuses, refunded counters)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders (reverse-reachability for Order.customer_id, market_cycle_id, pickup_hub_id, subscription_id)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: ["customer_id?", "market_cycle_id?", "pickup_hub_id?", "subscription_id?", "order_status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []
  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a line to a CART order (reserves offering qty)"
    roles: [Customer]
    code: 201
    input: [offering_id, requested_qty]
    output: OrderLine
    side_effects: ["line_status=REQUESTED", "snap_eligible copied from product", "estimated_line_cents via line_pricing(estimated)", "Offering.reserved_qty += requested_qty", "ERR_INSUFFICIENT_AVAILABILITY / ERR_CYCLE_NOT_OPEN"]
  - method: POST
    path: "/orders/{id}/checkout"
    description: "Check out a CART order: apply SNAP/Double-Up, authorize, book delivery slot"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["order_benefit_application(estimated)", "Customer.snap_balance_cents -= snap_applied_cents; doubleup_used_cents += doubleup_match_cents", "order_status CART->PLACED, payment_status UNPAID->AUTHORIZED", "DELIVERY slot overlap check"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order; cascade line cancels, release offerings, full refund"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["lines -> CANCELLED", "Offering.reserved_qty released", "full refund via refund_allocation", "payment_status -> REFUNDED"]
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "Fulfill an ALLOCATED order whose lines are all packed"
    roles: [PlatformAdmin, Farm]
    code: 200
    input: []
    output: Order
    side_effects: ["lines PACKED/SUBSTITUTED/SHORTED -> FULFILLED", "final_total_cents & final customer_owed_cents via order_benefit_application(final)", "payment_status AUTHORIZED->CAPTURED"]

  # ----- OrderLine -----
  - method: GET
    path: "/order-lines/{id}"
    description: "Get an order line (exposes estimated/final line cents, statuses, price_delta)"
    roles: [PlatformAdmin, Customer, Farm]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "List order lines (reverse-reachability for OrderLine.order_id, offering_id, substitute_offering_id)"
    roles: [PlatformAdmin, Customer, Farm]
    code: 200
    input: ["order_id?", "offering_id?", "substitute_offering_id?", "line_status?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: POST
    path: "/order-lines/{id}/pack"
    description: "Packout: record actual weight/qty, or substitute; drives PACKED/SHORTED/SUBSTITUTED"
    roles: [Farm, PlatformAdmin]
    code: 200
    input: ["fulfilled_qty?", "actual_weight_kg?", "substitute_offering_id?", "substitute_qty?"]
    output: OrderLine
    side_effects: ["final_line_cents via line_pricing(final)", "offering reserved->committed", "short/cheaper-substitution triggers refund cascade", "ERR_NOT_LINE_OWNER / ERR_ORDER_NOT_ALLOCATED / ERR_OVER_PACK / ERR_OFFERING_CYCLE_MISMATCH"]

  # ----- VendorSettlement -----
  - method: POST
    path: "/farms/{id}/settlements"
    description: "Finalize a farm's settlement for a settled cycle (OCC on Farm.version)"
    roles: [PlatformAdmin]
    code: 201
    input: [market_cycle_id, expected_farm_version]
    output: VendorSettlement
    side_effects: ["vendor_settlement_payout(final)", "Farm.payout_balance_cents += net_payout_cents", "Farm.settled_cycle_count += 1", "increments Farm.version by 1", "swept FULFILLED lines flagged settled", "ERR_STALE_FARM_VERSION (412) on stale expected_farm_version", "requires cycle SETTLED"]
  - method: GET
    path: "/settlements/{id}"
    description: "Get a settlement (reverse-reachability seg source for VendorSettlement)"
    roles: [PlatformAdmin, Farm]
    code: 200
    input: []
    output: VendorSettlement
    side_effects: []
  - method: GET
    path: "/settlements"
    description: "List settlements (reverse-reachability for VendorSettlement.farm_id, market_cycle_id)"
    roles: [PlatformAdmin, Farm]
    code: 200
    input: ["farm_id?", "market_cycle_id?", "limit?", "offset?"]
    output: "VendorSettlement[]"
    side_effects: []

  # ----- Test-driving: logical clock -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock advanced/set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for the endpoint per RBAC"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path- or body-referenced resource does not exist"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor (Customer/Farm) is not the owner of the targeted resource"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body: missing required field, bad enum, qty < 1, commission_pct out of [0,1], missing WEIGHT/FIXED price fields, missing/backwards delivery slot"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1,100] or offset < 0"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a state permitting the requested transition (generic)"
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "order create / add-line / checkout attempted while MarketCycle.status != OPEN"
  - id: ERR_EMPTY_ORDER
    http: 409
    condition: "checkout of an order with zero lines"
  - id: ERR_ORDER_NOT_ALLOCATED
    http: 409
    condition: "packing a line whose parent Order.order_status != ALLOCATED"
  - id: ERR_LINES_NOT_PACKED
    http: 409
    condition: "fulfill attempted while some line is not in {PACKED, SUBSTITUTED, SHORTED}"
  - id: ERR_ORDER_IN_PACKOUT
    http: 409
    condition: "cancel of an ALLOCATED order that already has packed/substituted/shorted lines"
  - id: ERR_CYCLE_HAS_OPEN_ORDERS
    http: 409
    condition: "settle attempted while some order in the cycle is not FULFILLED/CANCELLED"
  - id: ERR_PRODUCT_FARM_MISMATCH
    http: 409
    condition: "offering create where product_id.farm_id != acting Farm"
  - id: ERR_OFFERING_CYCLE_MISMATCH
    http: 409
    condition: "substitution where substitute offering's market_cycle_id != original line's cycle"
  - id: ERR_NOT_LINE_OWNER
    http: 403
    condition: "packing a line whose offering.product.farm_id != acting Farm (or substitute not owned)"
  - id: ERR_FARM_NOT_SNAP_AUTHORIZED
    http: 422
    condition: "snap_eligible product created/offered under a Farm with snap_authorized=false"
  - id: ERR_CYCLE_WINDOW_CONFLICT
    http: 409
    condition: "new cycle's window overlaps (within 24h buffer) an existing same-region cycle"
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "DELIVERY checkout would push overlapping active bookings on the hub above slot_capacity"
  - id: ERR_OVER_PACK
    http: 409
    condition: "pack with fulfilled_qty > allocated_qty"
  - id: ERR_INVALID_WEIGHT
    http: 422
    condition: "pack of a WEIGHT line with actual_weight_kg missing or <= 0"
  - id: ERR_INSUFFICIENT_AVAILABILITY
    http: 409
    condition: "requested_qty (or substitute_qty) exceeds the offering's remaining_qty"
  - id: ERR_STALE_FARM_VERSION
    http: 412
    condition: "settlement create with expected_farm_version != Farm.version (OCC)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Marketplace operator; runs cycles, onboarding, and settlements"
    identity: "opaque"
    exclusive_operations:
      - "POST /farms"
      - "POST /market-cycles"
      - "POST /market-cycles/{id}/open"
      - "POST /market-cycles/{id}/cutoff"
      - "POST /market-cycles/{id}/settle"
      - "POST /pickup-hubs"
      - "POST /customers"
      - "POST /farms/{id}/settlements"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /farms/{id}/products (with Farm)"
      - "POST /market-cycles/{id}/offerings (with Farm)"
      - "POST /orders/{id}/fulfill (with Farm)"
      - "POST /order-lines/{id}/pack (with Farm)"
      - "POST /orders/{id}/cancel (with Customer)"
      - "POST /customers/{id}/subscriptions, pause/resume/cancel (with Customer)"
      - "GET reads across farms, cycles, offerings, orders, lines, subscriptions, settlements, customers"

  - name: Farm
    description: "Vendor; manages own catalog & offerings, packs allocated lines, fulfills, views own settlements"
    identity: "entity_backed:Farm"
    exclusive_operations:
      - "POST /order-lines/{id}/pack for lines whose offering.product.farm_id == self"
    shared_operations:
      - "POST /farms/{id}/products (own farm; with PlatformAdmin)"
      - "POST /market-cycles/{id}/offerings (own products; with PlatformAdmin)"
      - "POST /orders/{id}/fulfill (with PlatformAdmin)"
      - "GET /farms/{id}, /farms/{id}/products, /offerings, /order-lines, /settlements, /market-cycles/{id}, /pickup-hubs/{id}"

  - name: Customer
    description: "Shopper; creates orders, adds lines, checks out, manages own subscriptions"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/checkout"
    shared_operations:
      - "POST /orders/{id}/cancel (own order; with PlatformAdmin)"
      - "POST /customers/{id}/subscriptions, pause/resume/cancel (own; with PlatformAdmin)"
      - "GET /customers/{id} (self), /orders, /order-lines, /offerings, /subscriptions, /market-cycles/{id}"
