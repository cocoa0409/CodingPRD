            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_b}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 100001, processing_date_balance_cents: 100001 }, as: PlanSponsor, captures: { c2: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_c}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 700000, processing_date_balance_cents: 700000 }, as: PlanSponsor, captures: { c3: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_d}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 700001, processing_date_balance_cents: 700001 }, as: PlanSponsor, captures: { c4: $.data.id } }
