            - "response.data.error_id == ERR_CARD_NOT_ACTIVE"

      - name: no_assignment_referential_beats_product_safety
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_NO_ACTIVE_ASSIGNMENT]
          - errors[ERR_PRODUCT_NOT_ALLOWED]
        distinguishing_aspect: >
          One authorize violates a business_referential check (priority 7,
          ERR_NO_ACTIVE_ASSIGNMENT: card has no assignment) and a business_safety check (priority
          8, ERR_PRODUCT_NOT_ALLOWED: UNLEADED not whitelisted); referential wins ->
          ERR_NO_ACTIVE_ASSIGNMENT. Different category pair than the state/fiscal conflict.
        test_recipe:
          setup:
            - "Fleet; active card whose allowed_products = [DIESEL] only; NO CardAssignment created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
