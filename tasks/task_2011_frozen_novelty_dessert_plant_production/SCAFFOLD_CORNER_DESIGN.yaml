- section: cross_cutting_layers
  instances:
  - name: occ_reformulation_stale_version_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[product-reformulation-stale-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: Reformulation carrying the pre-PATCH version (1) after a spec edit bumped the product to version 2 -> 412 ERR_STALE_VERSION.
    test_recipe:
      setup:
      - product P-OCC created (version 1), then PATCHed (version 2)
      setup_api_calls:
      - call: POST /products
        payload:
          sku_code: P-OCC
          product_name: Occ Bar
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          p1: $.data.id
          v1: $.data.version
      - call: PATCH /products/${p1}
        payload:
          product_name: Occ Bar v1.1
        as: PlantManager
      trigger:
      - call: POST /products/${p1}/reformulations
        payload:
          expected_product_version: ${v1}
          sku_code: P-OCC-2
          product_name: Occ Bar Reformulated
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 72
          target_overrun_pct: 42
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_STALE_VERSION and HTTP 412 (observed version 1 != current 2)
  - name: occ_reformulation_success_path
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[product-reformulation-stale-version]
    distinguishing_aspect: 'Happy path: expected version matches -> 201; parent gains successor_product_id and version increments; child''s predecessor_product_id points back (self-referential lineage).'
    test_recipe:
      setup:
      - product P-OC2 created (version 1)
      setup_api_calls:
      - call: POST /products
        payload:
          sku_code: P-OC2
          product_name: Occ2 Bar
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          p1: $.data.id
          v1: $.data.version
      trigger:
      - call: POST /products/${p1}/reformulations
        payload:
          expected_product_version: ${v1}
          sku_code: P-OC2-R
          product_name: Occ2 Bar R
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 72
          target_overrun_pct: 42
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          child: $.data.id
          child_pred: $.data.predecessor_product_id
      - call: GET /products/${p1}
        as: PlantManager
        captures:
          par_v: $.data.version
