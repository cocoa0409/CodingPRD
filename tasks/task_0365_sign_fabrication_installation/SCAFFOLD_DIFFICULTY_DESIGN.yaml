  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: change_order_apply_contract_ledger_invariant
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
          - calculations.contract_total
          - entities.SignProject.fields.contract_total_cents
          - entities.ChangeOrder.fields.delta_total_cents
        distinguishing_aspect: |
          Conserved quantity = contract ledger: after every APPLIED change order,
          SignProject.contract_total_cents MUST equal accepted_estimate.total_cents + sum of all
          APPLIED ChangeOrder.delta_total_cents. With baseline 24300 and a +7200 dim delta applied,
          contract_total_cents == 31500 exactly (no drift) — a monetary conserved quantity.
        test_recipe:
          setup:
            - "Project in FABRICATION, accepted estimate 24300, one APPROVED dim change order (delta 7200)"
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Led Co", site_address: "50 Money St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/m.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/send"
              payload: {}
              as: ShopManager
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv1: $.data.version }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/accept"
              payload: { expected_sign_project_version: "${pv1}" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/site-surveys"
              payload: { measured_clearance_ft: 30, overhead_obstruction: false, ground_bearing_ok: true }
              as: Surveyor
              captures: { survey_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/site-surveys/${survey_id}/decide"
              payload: { result: "PASS" }
              as: Surveyor
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders"
              payload: {}
              as: ShopManager
              captures: { wo_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/change-orders"
              payload: { reason: "wider", new_face_width_in: 60 }
              as: ShopManager
              captures: { co_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/change-orders/${co_id}/approve"
              payload: {}
              as: Customer
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /sign-projects/${proj_id}/change-orders/${co_id}/apply"
              payload: { expected_sign_project_version: "${pv2}" }
              as: ShopManager
          assert:
            - "ChangeOrder.${co_id}.delta_total_cents == 7200"
            - "SignProject.${proj_id}.contract_total_cents == 31500"

      - name: install_fail_then_cancel_booking_count_invariant
