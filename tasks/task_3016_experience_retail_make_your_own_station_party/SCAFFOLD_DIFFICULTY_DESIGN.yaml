              captures: { b8: $.data.id }
            - call: "POST /build-ship-orders/${b8}/start-assembly"
              payload: {}
              as: WorkshopAssociate
              captures: { b8s: $.data.workshop_session_id }
            - call: "POST /workshops/${b8s}/advance-step"
              payload: {}
