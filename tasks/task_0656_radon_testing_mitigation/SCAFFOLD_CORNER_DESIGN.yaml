# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Radon Testing & Mitigation — breadth probe over §1.1–§1.7 surface.
# Sections/claim_types taken verbatim from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_property_creation_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Property, endpoints]
        distinguishing_aspect: "POST /properties with required fields → 201; posture=OPEN, open_test_count=0, latest_result_pci_l=null, version=1."
        test_recipe:
          setup: ["Empty DB at clock default 2026-04-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { address_line: "C1", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id, posture: $.data.posture, ver: $.data.version }
          assert:
            - "Property.${prop_id}.posture == OPEN"
            - "Property.${prop_id}.open_test_count == 0"
            - "Property.${prop_id}.latest_result_pci_l == null"
            - "Property.${prop_id}.version == 1"

      - name: entity_property_get_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Property, 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /properties/{bogus uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-0000-0000-000000000999"
              as: ClientContact
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: entity_property_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Property.fields.foundation_type, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /properties omitting foundation_type → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { address_line: "C2", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: entity_property_invalid_foundation_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Property.fields.foundation_type, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /properties with foundation_type='PIER' (not in enum) → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { address_line: "C3", foundation_type: "PIER", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: entity_paymentrecord_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.PaymentRecord]
        distinguishing_aspect: "PaymentRecord is common_fields:false (append-only ledger): carries id and created_at only, no version, and there is no PaymentRecord update/transition endpoint."
        test_recipe:
          setup: ["A QUOTED JOB B exists with one DEPOSIT ledger entry."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "C In", nrpp_license_id: "NRPP-C50" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "C4", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_init: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${t_init}/retrieve"
              payload: { lab_integrated_pci_l: 6.0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_init}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /mitigation-jobs"
              payload: { property_id: "${prop_id}", triggering_test_id: "${t_init}", num_suction_points: 1, has_sump_pump: false, is_rush: false }
              as: MitigationDesigner
              captures: { job_id: $.data.id }
            - call: "POST /mitigation-jobs/${job_id}/quote"
              payload: {}
              as: MitigationDesigner
            - call: "POST /payment-records"
              payload: { mitigation_job_id: "${job_id}", kind: "DEPOSIT", amount_cents: 45000 }
              as: ClientContact
              captures: { rec_kind: $.data.kind }
          trigger:
            - call: "GET /payment-records"
              payload: { mitigation_job_id: "${job_id}" }
              as: ClientContact
              captures: { k0: '$.data[0].kind' }
          assert:
            - "PaymentRecord list contains one entry with kind == DEPOSIT and amount_cents == 45000"
            - "PaymentRecord has no version field (append-only)"

      - name: entity_property_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.Property, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /properties returns response_type=array with total_count and has_more present."
        test_recipe:
          setup: ["Two properties created."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { address_line: "C5a", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
            - call: "POST /properties"
              payload: { address_line: "C5b", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
          trigger:
            - call: "GET /properties"
              payload: { limit: 1, offset: 0 }
              as: ClientContact
          assert:
            - "response_type == array; meta envelope present; total_count == 2; has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_radon_test_initial_state_placed
        claim_type: Initial State
        grounds: [state_machines.RadonTest, entities.RadonTest.fields.status]
        distinguishing_aspect: "A freshly placed RadonTest starts in status PLACED with placement_start_utc = current clock."
        test_recipe:
          setup: ["ACTIVE inspector; property OPEN; clock 2026-04-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "C In", nrpp_license_id: "NRPP-C10" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "C6", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { st: $.data.status, pstart: $.data.placement_start_utc }
          assert:
            - "RadonTest.status == PLACED"
            - "RadonTest.placement_start_utc == 2026-04-01T00:00:00Z"
            - "Property.${prop_id}.open_test_count == 1 and posture == TESTING"

      - name: sm_radon_test_record_result_from_placed_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.RadonTest.RETRIEVED_to_RESULT_READY, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "record-result on a test still PLACED (never retrieved) → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A test placed but not retrieved."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "C In", nrpp_license_id: "NRPP-C11" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "C7", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { test_id: $.data.id }
          trigger:
            - call: "POST /radon-tests/${test_id}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_STATE (HTTP 409)"

      - name: sm_radon_test_void_from_voided_terminal_locked
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RadonTest.PLACED_to_VOIDED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "A VOIDED test (terminal) rejects a second void with ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A placed test voided once."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "C In", nrpp_license_id: "NRPP-C12" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "C8", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { test_id: $.data.id }
            - call: "POST /radon-tests/${test_id}/void"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /radon-tests/${test_id}/void"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_STATE (HTTP 409)"
            - "Property.${prop_id}.open_test_count == 0 (unchanged by the rejected second void)"

      - name: sm_void_bubbles_property_back_toward_open
        claim_type: Side Effect Execution
        grounds: [state_machines.RadonTest.PLACED_to_VOIDED, entities.Property.fields.open_test_count]
        distinguishing_aspect: "Voiding the only PLACED test decrements Property.open_test_count from 1 to 0 (bubble-up posture recompute)."
        test_recipe:
          setup: ["A single placed test on a property (open_test_count=1, posture TESTING)."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "C In", nrpp_license_id: "NRPP-C13" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "C9", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { test_id: $.data.id }
          trigger:
            - call: "POST /radon-tests/${test_id}/void"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /properties/${prop_id}"
              as: ClientContact
              captures: { otc: $.data.open_test_count }
          assert:
            - "Property.${prop_id}.open_test_count == 0"

      - name: sm_permit_revoke_after_install_locked
        claim_type: Precondition Enforcement
        grounds: [state_machines.Permit.ISSUED_to_REVOKED, 'errors[ERR_PERMIT_LOCKED]']
        distinguishing_aspect: "Revoking a permit after the job is INSTALLED → ERR_PERMIT_LOCKED (409)."
        test_recipe:
          setup: ["JOB B INSTALLED with an ISSUED permit."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "C In", nrpp_license_id: "NRPP-C14" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "C Crew", max_jobs_per_day: 2 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "C10", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_init: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${t_init}/retrieve"
              payload: { lab_integrated_pci_l: 6.0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_init}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /mitigation-jobs"
              payload: { property_id: "${prop_id}", triggering_test_id: "${t_init}", num_suction_points: 1, has_sump_pump: false, is_rush: false }
              as: MitigationDesigner
              captures: { job_id: $.data.id }
            - call: "POST /mitigation-jobs/${job_id}/quote"
              payload: {}
              as: MitigationDesigner
            - call: "POST /payment-records"
              payload: { mitigation_job_id: "${job_id}", kind: "DEPOSIT", amount_cents: 45000 }
              as: ClientContact
            - call: "POST /payment-records"
              payload: { mitigation_job_id: "${job_id}", kind: "BALANCE", amount_cents: 105000 }
              as: ClientContact
            - call: "GET /properties/${prop_id}"
              as: ClientContact
              captures: { prop_v: $.data.version }
            - call: "POST /mitigation-jobs/${job_id}/schedule"
              payload: { crew_id: "${crew_id}", install_start_utc: "2026-04-03T08:00:00Z", install_end_utc: "2026-04-03T12:00:00Z", expected_property_version: "${prop_v}" }
              as: MitigationDesigner
            - call: "POST /permits"
              payload: { mitigation_job_id: "${job_id}", jurisdiction_code: "CTY-1", permit_number: "P-C140" }
              as: ComplianceOfficer
              captures: { permit_id: $.data.id }
            - call: "POST /mitigation-jobs/${job_id}/complete-install"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /permits/${permit_id}/revoke"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_PERMIT_LOCKED (HTTP 409)"

      - name: sm_retest_schedule_pause_resume_cycle
        claim_type: Valid Transition
        grounds: [state_machines.RetestSchedule.ARMED_to_PAUSED, state_machines.RetestSchedule.PAUSED_to_ARMED]
        distinguishing_aspect: "ARMED→PAUSED→ARMED round-trips; status ends ARMED."
        test_recipe:
          setup: ["A cleared JOB B warranty with an ARMED RetestSchedule."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "C In", nrpp_license_id: "NRPP-C15" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "C Crew2", max_jobs_per_day: 2 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "C11", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_init: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${t_init}/retrieve"
              payload: { lab_integrated_pci_l: 6.0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_init}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /mitigation-jobs"
              payload: { property_id: "${prop_id}", triggering_test_id: "${t_init}", num_suction_points: 1, has_sump_pump: false, is_rush: false }
              as: MitigationDesigner
              captures: { job_id: $.data.id }
            - call: "POST /mitigation-jobs/${job_id}/quote"
              payload: {}
              as: MitigationDesigner
            - call: "POST /payment-records"
              payload: { mitigation_job_id: "${job_id}", kind: "DEPOSIT", amount_cents: 45000 }
              as: ClientContact
            - call: "POST /payment-records"
              payload: { mitigation_job_id: "${job_id}", kind: "BALANCE", amount_cents: 105000 }
              as: ClientContact
            - call: "GET /properties/${prop_id}"
              as: ClientContact
              captures: { prop_v: $.data.version }
            - call: "POST /mitigation-jobs/${job_id}/schedule"
              payload: { crew_id: "${crew_id}", install_start_utc: "2026-04-03T08:00:00Z", install_end_utc: "2026-04-03T12:00:00Z", expected_property_version: "${prop_v}" }
              as: MitigationDesigner
            - call: "POST /permits"
              payload: { mitigation_job_id: "${job_id}", jurisdiction_code: "CTY-1", permit_number: "P-C150" }
              as: ComplianceOfficer
            - call: "POST /mitigation-jobs/${job_id}/complete-install"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "POST_MITIGATION", mitigation_job_id: "${job_id}", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_post: $.data.id }
            - call: "POST /radon-tests/${t_post}/retrieve"
              payload: { lab_integrated_pci_l: 1.5 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_post}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /warranties"
              as: ClientContact
              captures: { warr_id: '$.data[0].id' }
            - call: "GET /retest-schedules"
              as: ClientContact
              captures: { sched_id: '$.data[0].id' }
          trigger:
            - call: "POST /retest-schedules/${sched_id}/pause"
              payload: {}
              as: ClientContact
              captures: { s1: $.data.status }
            - call: "POST /retest-schedules/${sched_id}/resume"
              payload: {}
              as: ClientContact
              captures: { s2: $.data.status }
          assert:
            - "RetestSchedule.${sched_id}.status == ARMED after resume"

      - name: sm_job_clear_cascade_depth3
        claim_type: Side Effect Execution
        grounds: [state_machines.MitigationJob.RETEST_PENDING_to_CLEARED]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_clear_job_issues_warranty_arms_schedule_depth3
          rationale: "The CLEARED cascade (warranty issuance + schedule arming + posture flip) is asserted by the named §1.8 depth-3 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_quote_area_tier3_crawlspace
        claim_type: Constants Applied
        grounds: [calculations.mitigation_quote, entities.Property.fields.floor_area_sqft]
        distinguishing_aspect: "CRAWLSPACE base 240000 + 1 extra point 45000 + area tier3 120000 = 405000 cents (no sump, no rush); deposit 121500."
        test_recipe:
          setup: ["CRAWLSPACE property 3500 sqft (tier3) with ACTION_RECOMMENDED test; job with 2 suction points."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "C In", nrpp_license_id: "NRPP-C20" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "C12", foundation_type: "CRAWLSPACE", floor_area_sqft: 3500 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_init: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${t_init}/retrieve"
              payload: { lab_integrated_pci_l: 8.0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /radon-tests/${t_init}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /mitigation-jobs"
              payload: { property_id: "${prop_id}", triggering_test_id: "${t_init}", system_design: "SUB_MEMBRANE_DEPRESSURIZATION", num_suction_points: 2, has_sump_pump: false, is_rush: false }
              as: MitigationDesigner
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /mitigation-jobs/${job_id}/quote"
              payload: {}
              as: MitigationDesigner
              captures: { sub: $.data.quote_subtotal_cents }
          assert:
            - "MitigationJob.${job_id}.quote_subtotal_cents == 405000"
            - "MitigationJob.${job_id}.quote_total_cents == 405000"
            - "MitigationJob.${job_id}.deposit_required_cents == 121500"

      - name: calc_next_retest_fixed_cadence_no_drift
        claim_type: Correct Result
        grounds: [calculations.next_retest_due, state_machines.RetestSchedule.ARMED_to_ARMED]
        distinguishing_aspect: "fire-due advances next_due_utc by interval_days from the prior due date (2028-04-02 → 2030-04-02), not from the fire timestamp, so a late fire does not drift the cadence."
        test_recipe:
          setup: ["A cleared JOB B warranty (interval 730) armed with next_due_utc 2028-04-02; clock advanced to 2028-12-01 (late)."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "C In", nrpp_license_id: "NRPP-C21" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "C Crew3", max_jobs_per_day: 2 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "C13", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
