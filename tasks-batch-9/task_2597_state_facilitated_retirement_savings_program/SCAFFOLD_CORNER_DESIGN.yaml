          assert:
            - "ExcessContributionCase.${case_id}.status == DETECTED"
            - "ExcessContributionCase.${case_id}.detected_excess_cents == 100000"
            - "ExcessContributionCase.${case_id}.deadline_date == 2027-04-15"
            - "the first trigger call returns status == 409 with data.error_id == ERR_EXCESS_CASE_STATE_INVALID"
            - "after the first trigger call ExcessContributionCase.${case_id}.settlement_reference == null"
            - "the third trigger call returns status == 409 with data.error_id == ERR_CORRECTION_DEADLINE_PASSED"
            - "ExcessContributionCase.${case_id}.status == DETECTED"
            - "ExcessContributionCase.${case_id}.correction_method == null"
            - "ParticipantAccount.${acct_id}.uncorrected_excess_cents == 100000"
            - "ParticipantAccount.${acct_id}.posture == RESTRICTED"

      - name: enforcement_referral_on_an_unaffirmed_penalty_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.v_penalty_state
          - errors.ERR_PENALTY_STATE_INVALID
          - state_machines.PenaltyAssessment
        distinguishing_aspect: "A referral to the labor commissioner may only follow an AFFIRMED assessment, so the freshly ASSESSED penalty is refused even though the referring principal, agency and basis are all valid. Affirmation itself is only reachable after the cure period expires and only by an officer other than the assessor, so the fixture must both advance the clock past 2026-02-04 and switch principals before the identical referral succeeds."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured; Delta Fabrication is registered but delinquent on remittance"
            - "Officer OFFICER-A assessed a FAILURE_TO_REMIT penalty with notice_date 2026-01-05 and the default 30 cure days, so cure_deadline is 2026-02-04 and status is ASSESSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /employers/${emp_id}/penalty-assessments"
              payload: { violation_type: "FAILURE_TO_REMIT", notice_date: "2026-01-05" }
              as: ComplianceOfficer
              as_user_id: "OFFICER-A"
              captures: { pen_id: "$.data.id" }
          trigger:
            - call: "POST /penalty-assessments/${pen_id}/enforcement-referrals"
              payload: { agency: "STATE_LABOR_COMMISSIONER", referral_basis: "Employer has not remitted three consecutive pay periods" }
              as: ComplianceOfficer
              as_user_id: "OFFICER-B"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /penalty-assessments/${pen_id}/disposition"
              payload: { disposition: "AFFIRM", disposition_note: "No cure received within the statutory period" }
              as: ComplianceOfficer
              as_user_id: "OFFICER-B"
            - call: "POST /penalty-assessments/${pen_id}/enforcement-referrals"
              payload: { agency: "STATE_LABOR_COMMISSIONER", referral_basis: "Employer has not remitted three consecutive pay periods" }
              as: ComplianceOfficer
              as_user_id: "OFFICER-B"
              captures: { ref_id: "$.data.id" }
          assert:
            - "PenaltyAssessment.${pen_id}.status == ASSESSED"
            - "PenaltyAssessment.${pen_id}.cure_deadline == 2026-02-04"
            - "the first trigger call returns status == 409 with data.error_id == ERR_PENALTY_STATE_INVALID"
            - "after the first trigger call GET /enforcement-referrals returns total_count == 0"
            - "the third trigger call returns status == 200"
            - "PenaltyAssessment.${pen_id}.status == AFFIRMED"
            - "the fourth trigger call returns status == 201"
            - "EnforcementReferral.${ref_id}.status == REFERRED"
            - "EnforcementReferral.${ref_id}.employer_ein_snapshot == 12-3456789"

      - name: exemption_filing_with_a_lapsed_coverage_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.v_exemption_window_closed
          - errors.ERR_EXEMPTION_WINDOW_CLOSED
          - entities.ExemptionCertification.fields.coverage_period_end
        distinguishing_aspect: "Coverage is derived as plan_effective_date plus three years, so a 2022-01-01 plan yields a window that ended 2025-01-01 — already behind the 2026-01-01 clock — and the filing is refused rather than accepted-then-expired. A 2024-06-01 plan on the same employer is accepted because its window runs to 2027-06-01, which proves the rule reads the DERIVED end date and not the effective date itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured; Delta Fabrication registered with 60 employees"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /employers/${emp_id}/exemption-certifications"
              payload: { qualified_plan_type: "401K", plan_sponsor_ein: "12-3456789", plan_effective_date: "2022-01-01", attestation_accepted: true }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /employers/${emp_id}/exemption-certifications"
              payload: { qualified_plan_type: "401K", plan_sponsor_ein: "12-3456789", plan_effective_date: "2024-06-01", attestation_accepted: true }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { exm_id: "$.data.id" }
          assert:
            - "the first trigger call returns status == 409 with data.error_id == ERR_EXEMPTION_WINDOW_CLOSED"
            - "after the first trigger call GET /exemption-certifications returns total_count == 0"
            - "the second trigger call returns status == 201"
            - "ExemptionCertification.${exm_id}.coverage_period_start == 2024-06-01"
            - "ExemptionCertification.${exm_id}.coverage_period_end == 2027-06-01"
            - "ExemptionCertification.${exm_id}.status == PENDING_REVIEW"
            - "Employer.${emp_id}.registration_status == REGISTERED"

      - name: closure_completion_with_a_residual_balance_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.v_residual_balance_present
          - errors.ERR_RESIDUAL_BALANCE_PRESENT
          - state_machines.ParticipantAccount
        distinguishing_aspect: "The recordkeeper cannot finalize a closure while money is still in the account: the request legitimately moved the account to CLOSURE_PENDING and LOCKED the posture, but completion demands balance_cents == 0, so the residual 400000 blocks it and the account must stay in CLOSURE_PENDING rather than closing with a stranded balance or being reopened."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured; Delta Fabrication registered; Rosa Lim ACTIVE with balance_cents 400000 from one posted remittance"
            - "Clock at 2026-02-20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-20T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /participant-accounts/${acct_id}/closure-requests"
              payload: { closure_reason: "PARTICIPANT_REQUEST", residual_disposition: "CASH_DISTRIBUTION" }
              as: Participant
              as_user_id: "${par_id}"
          trigger:
            - call: "POST /participant-accounts/${acct_id}/closure-completion"
              payload: { completion_note: "Attempting to finalize before the residual is paid out" }
              as: Recordkeeper
          assert:
            - "the trigger call returns status == 409 with data.error_id == ERR_RESIDUAL_BALANCE_PRESENT"
            - "ParticipantAccount.${acct_id}.account_status == CLOSURE_PENDING"
            - "ParticipantAccount.${acct_id}.posture == LOCKED"
            - "ParticipantAccount.${acct_id}.balance_cents == 400000"
            - "ParticipantAccount.${acct_id}.closure_reason == PARTICIPANT_REQUEST"
            - "ParticipantAccount.${acct_id}.residual_disposition == CASH_DISTRIBUTION"
            - "ParticipantAccount.${acct_id}.closed_at == null"

      - name: closed_account_error_is_a_difficulty_instance
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / closed_account_state_gate_outranks_fiscal_sufficiency_check
          rationale: "ERR_ACCOUNT_CLOSED is already triggered there against an equally underfunded balance, which is the strongest form of the claim."

      - name: restricted_account_error_is_a_difficulty_instance
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: transitive_cascade / remittance_posting_cascades_to_excess_case_and_restricted_posture
          rationale: "ERR_ACCOUNT_RESTRICTED is raised there as the tail of the posting cascade, together with the posture that causes it."

      - name: enforcement_hold_error_is_a_difficulty_instance
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / enforcement_hold_outranks_exemption_coverage_window_temporal_check
          rationale: "ERR_ENFORCEMENT_HOLD is triggered there in its harder priority-conflict form against a competing temporal rule."

      - name: pay_period_overlap_error_is_a_difficulty_instance
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pay_period_closed_interval_rejects_shared_boundary_day
          rationale: "ERR_PAY_PERIOD_OVERLAP is triggered there exactly at the shared boundary day, which subsumes any coarser overlap test."

      - name: rollover_frequency_error_is_a_difficulty_instance
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: resource_temporal_overlap / indirect_rollover_rolling_365_day_window_admits_one_per_participant
          rationale: "ERR_ROLLOVER_FREQUENCY_LIMIT is triggered there at both ends of the rolling window."

      - name: employer_not_registered_error_is_a_difficulty_instance
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / enrollment_creation_gated_on_employer_registration_state
          rationale: "ERR_EMPLOYER_NOT_REGISTERED is triggered there across every non-REGISTERED employer state, which is broader than a single trigger here."

  # ===========================================================================
  # SECTION 7 / 9 — rbac  (claim-extraction-guide: From Table 7)
  # ===========================================================================
  - section: rbac
    instances:

      - name: employer_rate_election_and_opt_out_are_rejected_at_the_fiduciary_boundary
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - validations.v_employer_fiduciary_boundary
          - errors.ERR_FIDUCIARY_BOUNDARY_VIOLATION
          - roles.Employer.forbidden_operations
        distinguishing_aspect: "The Employer principal IS on these two routes and DOES own the addressed enrollment, so it clears the role gate at priority 2 and the ownership gate at priority 4 and is then stopped at priority 25 by the boundary rule — the refusal must be ERR_FIDUCIARY_BOUNDARY_VIOLATION, not ERR_UNAUTHORIZED, because the whole point is an auditable non-fiduciary trail. Neither refusal may leave a partial mark: the rate is still the 500 bp default with rate_source DEFAULT, and the participant then makes the very same election successfully."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured with default_contribution_rate_bp 500; TDF2045 and MMKT01 on the menu"
            - "Delta Fabrication registered; Rosa Lim ACTIVE after the auto-enrollment run at clock 2026-02-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 9600000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /_ops/auto-enrollment-run"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /enrollments/${enr_id}/rate-election"
              payload: { contribution_rate_bp: 300 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /enrollments/${enr_id}/opt-out"
              payload: { opt_out_reason_code: "AFFORDABILITY" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /enrollments/${enr_id}/rate-election"
              payload: { contribution_rate_bp: 300 }
              as: Participant
              as_user_id: "${par_id}"
          assert:
            - "the first trigger call returns status == 403 with data.error_id == ERR_FIDUCIARY_BOUNDARY_VIOLATION"
            - "the first trigger call does not return data.error_id == ERR_UNAUTHORIZED"
            - "the second trigger call returns status == 403 with data.error_id == ERR_FIDUCIARY_BOUNDARY_VIOLATION"
            - "after the first two trigger calls Enrollment.${enr_id}.contribution_rate_bp == 500"
            - "after the first two trigger calls Enrollment.${enr_id}.rate_source == DEFAULT"
            - "after the first two trigger calls Enrollment.${enr_id}.enrollment_status == ACTIVE"
            - "after the first two trigger calls Enrollment.${enr_id}.opted_out_at == null"
            - "the third trigger call returns status == 200"
            - "Enrollment.${enr_id}.contribution_rate_bp == 300"
            - "Enrollment.${enr_id}.rate_source == PARTICIPANT_ELECTED"

      - name: employer_read_of_a_participant_account_is_unauthorized
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - validations.v_role_permitted
          - errors.ERR_UNAUTHORIZED
          - roles.Employer.forbidden_operations
          - endpoints[GET /participant-accounts/{id}]
        distinguishing_aspect: "Balances are none of the employer's business, so the Employer role is absent from every account-scoped read even though the account belongs to its own employee and the employer can freely read the enrollment and the remittance lines that funded it. The refusal is the priority-2 role gate, which fires before existence, so it is 403 and not 404 even when the id is real."
        test_recipe:
          setup:
            - "Delta Fabrication registered; Rosa Lim ACTIVE at Delta with a ROTH_IRA account; enrollment id and account id known"
          setup_api_calls:
            - call: "GET /participant-accounts"
              payload: { participant_id: "${par_id}" }
              as: ProgramAdministrator
              captures: { acct_id: "$.data[0].id" }
          trigger:
            - call: "GET /participant-accounts/${acct_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "the first trigger call returns status == 403 with data.error_id == ERR_UNAUTHORIZED"
            - "the first trigger call does not return status == 404"
            - "the second trigger call returns status == 200"
            - "the second trigger call returns data.employer_id == ${emp_id}"
            - "the second trigger call returns data.participant_id == ${par_id}"

      - name: exclusive_operations_are_unauthorized_for_every_other_role
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - roles.Recordkeeper.exclusive_operations
          - roles.Employer.exclusive_operations
          - roles.ProgramAdministrator.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Three exclusive operations are each attacked by a role that plausibly could have owned it — the participant whose own money is being remitted, the recordkeeper who holds the assets, and the compliance officer who polices employers — and all three must be refused with the same 403. This is the peer-role wall: no role in this program is a superset of another, and only ProgramAdministrator decides exemptions while only Recordkeeper posts money."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured; Delta Fabrication registered with a PENDING_REVIEW exemption certification on file; Rosa Lim ACTIVE"
            - "One DRAFT payroll remittance exists for Delta"
          setup_api_calls:
            - call: "POST /employers/${emp_id}/exemption-certifications"
              payload: { qualified_plan_type: "401K", plan_sponsor_ein: "12-3456789", plan_effective_date: "2025-06-01", attestation_accepted: true }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { exm_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_id}/payroll-remittances"
              payload: { pay_period_start: "2026-01-01", pay_period_end: "2026-01-31", pay_date: "2026-02-05", total_deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rem_id: "$.data.id" }
          trigger:
            - call: "POST /employers/${emp_id}/payroll-remittances"
              payload: { pay_period_start: "2026-02-01", pay_period_end: "2026-02-28", pay_date: "2026-03-05", total_deducted_cents: 400000 }
              as: Participant
              as_user_id: "${par_id}"
            - call: "POST /exemption-certifications/${exm_id}/decision"
              payload: { decision: "APPROVE" }
              as: Recordkeeper
            - call: "POST /payroll-remittances/${rem_id}/post"
              payload: { posting_reference: "ACH-OFFICER" }
              as: ComplianceOfficer
          assert:
            - "every trigger call returns status == 403 with data.error_id == ERR_UNAUTHORIZED"
            - "GET /payroll-remittances with employer_id ${emp_id} returns total_count == 1"
            - "ExemptionCertification.${exm_id}.status == PENDING_REVIEW"
            - "ExemptionCertification.${exm_id}.decided_at == null"
            - "PayrollRemittance.${rem_id}.status == DRAFT"
            - "PayrollRemittance.${rem_id}.posting_reference == null"

      - name: same_officer_cannot_dispose_of_the_penalty_they_assessed
        claim_type: segregation_of_duties
        grounds:
          - validations.v_penalty_self_disposition
          - errors.ERR_SELF_DISPOSITION_FORBIDDEN
          - complexity_profile.role_model
        distinguishing_aspect: "Both principals hold the identical ComplianceOfficer role, so this cannot be decided by role alone — the check is on X-User-ID against assessed_by_user_id. The rule sits at priority 25, after the priority-20 state gate and after the priority-58 cure-period rule has been satisfied by advancing the clock, so the ONLY thing left to refuse the assessor is their own identity, and the second officer's identical request succeeds and is recorded in disposed_by_user_id."
        test_recipe:
          setup:
            - "Delta Fabrication registered; officer OFFICER-A assessed a FAILURE_TO_REGISTER penalty with notice_date 2026-01-05 and 30 cure days, so cure_deadline is 2026-02-04"
            - "Clock advanced to 2026-02-05 so the cure period has expired and an AFFIRM is temporally permitted"
          setup_api_calls:
            - call: "POST /employers/${emp_id}/penalty-assessments"
              payload: { violation_type: "FAILURE_TO_REGISTER", notice_date: "2026-01-05", cure_days: 30 }
              as: ComplianceOfficer
              as_user_id: "OFFICER-A"
              captures: { pen_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /penalty-assessments/${pen_id}/disposition"
              payload: { disposition: "AFFIRM", disposition_note: "Self-affirmation attempt by the assessing officer" }
              as: ComplianceOfficer
              as_user_id: "OFFICER-A"
            - call: "POST /penalty-assessments/${pen_id}/disposition"
              payload: { disposition: "AFFIRM", disposition_note: "Reviewed by a second officer; no cure received" }
              as: ComplianceOfficer
              as_user_id: "OFFICER-B"
          assert:
            - "PenaltyAssessment.${pen_id}.assessed_by_user_id == OFFICER-A"
            - "the first trigger call returns status == 403 with data.error_id == ERR_SELF_DISPOSITION_FORBIDDEN"
            - "after the first trigger call PenaltyAssessment.${pen_id}.status == ASSESSED"
            - "after the first trigger call PenaltyAssessment.${pen_id}.disposed_by_user_id == null"
            - "the second trigger call returns status == 200"
            - "PenaltyAssessment.${pen_id}.status == AFFIRMED"
            - "PenaltyAssessment.${pen_id}.disposed_by_user_id == OFFICER-B"
            - "PenaltyAssessment.${pen_id}.disposition_note == Reviewed by a second officer; no cure received"

      - name: participant_reading_another_participants_account_is_forbidden_scope
        claim_type: peer_roles
        grounds:
          - validations.v_caller_owns_target
          - errors.ERR_FORBIDDEN_SCOPE
          - roles.Participant.identity
        distinguishing_aspect: "Rosa and Ben hold the SAME Participant role, so the role gate at priority 2 lets both through and the separation is done entirely by the entity_backed identity at priority 4 — which is deliberately AFTER existence, so a participant probing the id space cannot distinguish 'exists but not yours' from 'does not exist' by status code alone: both are refusals, but a real foreign id yields 403 ERR_FORBIDDEN_SCOPE while a fabricated id yields 404. Rosa reading her own account still returns 200."
        test_recipe:
          setup:
            - "Rosa Lim and Ben Ortiz are both ACTIVE at Delta Fabrication with their own accounts; acct_id is Rosa's and ben_acct_id is Ben's"
          setup_api_calls:
            - call: "GET /participant-accounts"
              payload: { participant_id: "${ben_id}" }
              as: ProgramAdministrator
              captures: { ben_acct_id: "$.data[0].id" }
          trigger:
            - call: "GET /participant-accounts/${ben_acct_id}"
              payload: {}
              as: Participant
              as_user_id: "${par_id}"
            - call: "GET /participant-accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Participant
              as_user_id: "${par_id}"
            - call: "GET /participant-accounts/${acct_id}"
              payload: {}
              as: Participant
              as_user_id: "${par_id}"
          assert:
            - "the first trigger call returns status == 403 with data.error_id == ERR_FORBIDDEN_SCOPE"
            - "the second trigger call returns status == 404 with data.error_id == ERR_ACCOUNT_NOT_FOUND"
            - "the third trigger call returns status == 200"
            - "the third trigger call returns data.participant_id == ${par_id}"
            - "the third trigger call returns data.account_status == OPEN"

      - name: program_administrator_may_act_on_the_participants_behalf
        claim_type: shared_operations
        grounds:
          - roles.ProgramAdministrator.shared_operations
          - roles.Participant.shared_operations
          - endpoints[POST /enrollments/{id}/rate-election]
        distinguishing_aspect: "The service-centre path: every participant decision is a SHARED operation, so the administrator taking a phone call may set the rate, elect funds and update contact details with identical effect to the participant doing it themselves — rate_source still records PARTICIPANT_ELECTED and the election's source still records PARTICIPANT, because the field records whose decision it was and not which principal typed it."
        test_recipe:
          setup:
            - "Rosa Lim ACTIVE at Delta with a ROTH_IRA account holding the default TDF2045 election; acct_id and its version acct_pv are known"
          setup_api_calls:
            - call: "GET /participant-accounts/${acct_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { acct_pv: "$.data.version" }
          trigger:
            - call: "POST /enrollments/${enr_id}/rate-election"
              payload: { contribution_rate_bp: 700, escalation_opt_out: true }
              as: ProgramAdministrator
            - call: "POST /participant-accounts/${acct_id}/investment-elections"
              payload:
                allocations:
                  - { fund_code: "MMKT01", allocation_bp: 10000 }
                expected_account_version: "${acct_pv}"
              as: ProgramAdministrator
              captures: { elec_pa_id: "$.data.id" }
            - call: "PATCH /participants/${par_id}"
              payload: { phone: "+1-555-0142" }
              as: ProgramAdministrator
          assert:
            - "the first trigger call returns status == 200"
            - "Enrollment.${enr_id}.contribution_rate_bp == 700"
            - "Enrollment.${enr_id}.rate_source == PARTICIPANT_ELECTED"
            - "Enrollment.${enr_id}.escalation_opt_out == true"
            - "the second trigger call returns status == 201"
            - "InvestmentElection.${elec_pa_id}.source == PARTICIPANT"
            - "InvestmentElection.${elec_pa_id}.status == ACTIVE"
            - "ParticipantAccount.${acct_id}.active_election_id == ${elec_pa_id}"
            - "the third trigger call returns status == 200"
            - "Participant.${par_id}.phone == +1-555-0142"

  # ===========================================================================
  # SECTION 8 / 9 — cross_cutting_complexity_layers
  # (claim-extraction-guide: From Cross-Cutting Complexity Layers)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_account_version_on_an_investment_election_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.election-create-stale-account
          - validations.v_occ_account_version
          - errors.ERR_STALE_ACCOUNT_VERSION
        distinguishing_aspect: "The version is bumped by a write the participant never made — a Recordkeeper earnings posting — which is exactly the race the rule exists for: the participant composed an allocation against a balance that has since changed, so the election is refused with 412 before any allocation or fund check runs, and the stale attempt must not create an InvestmentElection row. Re-reading and resubmitting the same allocation succeeds and bumps the version again, proving version advances on every write and not only on account-owned ones."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured with TDF2045 and MMKT01 on the menu; Delta Fabrication registered; Rosa Lim ACTIVE with a ROTH_IRA account holding 400000 from one posted remittance"
            - "The account version at read time is captured as acct_v0"
          setup_api_calls:
            - call: "GET /participant-accounts/${acct_id}"
              payload: {}
              as: Participant
              as_user_id: "${par_id}"
              captures: { acct_v0: "$.data.version" }
            - call: "POST /participant-accounts/${acct_id}/earnings-postings"
              payload: { earnings_cents: 5000, posting_date: "2026-02-28" }
              as: Recordkeeper
            - call: "GET /participant-accounts/${acct_id}"
              payload: {}
              as: Participant
              as_user_id: "${par_id}"
              captures: { acct_v1: "$.data.version" }
          trigger:
            - call: "POST /participant-accounts/${acct_id}/investment-elections"
              payload:
                allocations:
                  - { fund_code: "MMKT01", allocation_bp: 10000 }
                expected_account_version: "${acct_v0}"
              as: Participant
              as_user_id: "${par_id}"
            - call: "POST /participant-accounts/${acct_id}/investment-elections"
              payload:
                allocations:
                  - { fund_code: "MMKT01", allocation_bp: 10000 }
                expected_account_version: "${acct_v1}"
              as: Participant
              as_user_id: "${par_id}"
              captures: { elec_occ_id: "$.data.id" }
          assert:
            - "ParticipantAccount.${acct_id}.balance_cents == 405000"
            - "ParticipantAccount.${acct_id}.contribution_basis_cents == 400000"
            - "acct_v1 is greater than acct_v0"
            - "the first trigger call returns status == 412 with data.error_id == ERR_STALE_ACCOUNT_VERSION"
            - "after the first trigger call GET /participant-accounts/${acct_id}/investment-elections returns total_count == 1"
            - "the second trigger call returns status == 201"
            - "InvestmentElection.${elec_occ_id}.status == ACTIVE"
            - "ParticipantAccount.${acct_id}.active_election_id == ${elec_occ_id}"
            - "ParticipantAccount.${acct_id}.version is greater than acct_v1"
            - "ParticipantAccount.${acct_id}.fund_balances allocates the whole 405000 to MMKT01"

      - name: stale_employer_version_on_an_employee_count_recount_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.recount-stale-employer
          - validations.v_occ_employer_version
          - errors.ERR_STALE_EMPLOYER_VERSION
          - calculations.employer_coverage_tier
        distinguishing_aspect: "The employer's version was bumped by its own registration, so a recount composed before registering is refused with 412 — and crucially the refusal must leave wave_tier and registration_deadline untouched at WAVE_2 / 2026-12-31 rather than half-recomputing them. With the fresh version the same 120-headcount restatement is accepted and BOTH derived fields move together to WAVE_1 / 2026-06-30, which is a deadline in the past relative to nothing here but demonstrates the recompute is unconditional."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured"
            - "Delta Fabrication LLC created with 60 employees, so wave_tier is WAVE_2 with registration_deadline 2026-12-31; its version is captured as emp_v0 BEFORE registration"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id", emp_v0: "$.data.version" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { emp_v1: "$.data.version" }
          trigger:
            - call: "POST /employers/${emp_id}/employee-count-recounts"
              payload: { employee_count: 120, effective_date: "2026-01-15", expected_employer_version: "${emp_v0}" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /employers/${emp_id}/employee-count-recounts"
              payload: { employee_count: 120, effective_date: "2026-01-15", expected_employer_version: "${emp_v1}" }
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "emp_v1 is greater than emp_v0"
            - "the first trigger call returns status == 412 with data.error_id == ERR_STALE_EMPLOYER_VERSION"
            - "after the first trigger call Employer.${emp_id}.employee_count == 60"
            - "after the first trigger call Employer.${emp_id}.wave_tier == WAVE_2"
            - "after the first trigger call Employer.${emp_id}.registration_deadline == 2026-12-31"
            - "after the first trigger call Employer.${emp_id}.last_recount_effective_date == null"
            - "the second trigger call returns status == 200"
            - "Employer.${emp_id}.employee_count == 120"
            - "Employer.${emp_id}.wave_tier == WAVE_1"
            - "Employer.${emp_id}.registration_deadline == 2026-06-30"
            - "Employer.${emp_id}.last_recount_effective_date == 2026-01-15"
            - "Employer.${emp_id}.registration_status == REGISTERED"

      - name: contributions_exactly_at_the_annual_limit_open_no_excess_case
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.participant_contribution_headroom
          - entities.ParticipantAccount.fields.remaining_headroom_cents
          - entities.ParticipantAccount.fields.posture
        distinguishing_aspect: "The instantaneous threshold is tested at the exact ceiling rather than near it: 700000 of posted contributions leaves headroom exactly 0 with posture UNRESTRICTED and NO ExcessContributionCase, so the rule must be 'greater than the limit', not 'at or above'. A second posting of a single 100-cent deduction then trips it by the smallest possible margin, and the case's detected_excess_cents must be exactly that 100 rather than the whole second batch."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured with ira_annual_limit_cents 700000 and default_contribution_rate_bp 500; TDF2045 and MMKT01 on the menu"
            - "Ridgeline Foods registered with 60 employees; Ada Cole is ACTIVE with annual_compensation_cents 14000000 after the auto-enrollment run"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "44-7788990", legal_name: "Ridgeline Foods Inc", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_r_id: "$.data.id" }
            - call: "POST /employers/${emp_r_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@ridgeline.example" }
              as: Employer
              as_user_id: "${emp_r_id}"
            - call: "POST /participants"
              payload: { full_name: "Ada Cole", date_of_birth: "1990-03-14", email: "ada.cole@x.example", ssn_last4: "9911", state_resident: true }
              as: ProgramAdministrator
              captures: { par_a_id: "$.data.id" }
            - call: "POST /employers/${emp_r_id}/enrollments"
              payload: { participant_id: "${par_a_id}", hire_date: "2026-01-05", annual_compensation_cents: 14000000 }
              as: Employer
              as_user_id: "${emp_r_id}"
              captures: { enr_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /_ops/auto-enrollment-run"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /participant-accounts"
              payload: { participant_id: "${par_a_id}" }
              as: ProgramAdministrator
              captures: { acct_a_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_r_id}/payroll-remittances"
              payload: { pay_period_start: "2026-01-01", pay_period_end: "2026-01-31", pay_date: "2026-02-05", total_deducted_cents: 700000 }
              as: Employer
              as_user_id: "${emp_r_id}"
              captures: { rem_a_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem_a_id}/remittance-lines"
              payload: { enrollment_id: "${enr_a_id}", gross_wages_cents: 14000000, deducted_cents: 700000 }
              as: Employer
              as_user_id: "${emp_r_id}"
            - call: "POST /payroll-remittances/${rem_a_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_r_id}"
            - call: "POST /payroll-remittances/${rem_a_id}/post"
              payload: { posting_reference: "ACH-RIDGE-01" }
              as: Recordkeeper
            - call: "POST /employers/${emp_r_id}/payroll-remittances"
              payload: { pay_period_start: "2026-02-01", pay_period_end: "2026-02-28", pay_date: "2026-03-05", total_deducted_cents: 100 }
              as: Employer
              as_user_id: "${emp_r_id}"
              captures: { rem_b_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem_b_id}/remittance-lines"
              payload: { enrollment_id: "${enr_a_id}", gross_wages_cents: 2000, deducted_cents: 100 }
              as: Employer
              as_user_id: "${emp_r_id}"
            - call: "POST /payroll-remittances/${rem_b_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_r_id}"
            - call: "POST /payroll-remittances/${rem_b_id}/post"
              payload: { posting_reference: "ACH-RIDGE-02" }
              as: Recordkeeper
          assert:
            - "after the fifth trigger call ParticipantAccount.${acct_a_id}.ytd_contribution_cents == 700000"
            - "after the fifth trigger call ParticipantAccount.${acct_a_id}.remaining_headroom_cents == 0"
            - "after the fifth trigger call ParticipantAccount.${acct_a_id}.uncorrected_excess_cents == 0"
            - "after the fifth trigger call ParticipantAccount.${acct_a_id}.posture == UNRESTRICTED"
            - "after the fifth trigger call GET /participant-accounts/${acct_a_id}/excess-contribution-cases returns total_count == 0"
            - "after the fifth trigger call PayrollRemittance.${rem_a_id}.total_excess_cents == 0"
            - "the ninth trigger call returns status == 200"
            - "PayrollRemittance.${rem_b_id}.total_excess_cents == 100"
            - "PayrollRemittance.${rem_b_id}.total_allocated_cents == 0"
            - "ParticipantAccount.${acct_a_id}.ytd_contribution_cents == 700000"
            - "ParticipantAccount.${acct_a_id}.uncorrected_excess_cents == 100"
            - "ParticipantAccount.${acct_a_id}.posture == RESTRICTED"
            - "GET /participant-accounts/${acct_a_id}/excess-contribution-cases returns total_count == 1 with detected_excess_cents == 100"

      - name: delinquency_threshold_holds_on_the_due_date_and_trips_the_day_after
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.employer_compliance_status_and_unremitted
          - entities.Employer.fields.unremitted_deduction_cents
          - entities.PayrollRemittance.fields.days_late
          - endpoints[POST /_ops/compliance-sweep]
        distinguishing_aspect: "Two clocks are compared against the same due date 2026-02-12 (pay_date 2026-02-05 plus the 7 remittance_due_days) and the comparison is a STRICT inequality, so a sweep run on 2026-02-12 must report zero delinquent employers while the very next day reports one. The frozen days_late must stay 0 throughout, because it was fixed at submit time and is a different quantity from the live delinquency test — an implementation that recomputes days_late during the sweep fails this."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured with the default remittance_due_days of 7; Ridgeline Foods registered with WAVE_2 deadline 2026-12-31, so no registration penalty is due"
            - "Ada Cole ACTIVE; a remittance for pay_date 2026-02-05 carrying 400000 was SUBMITTED on 2026-02-12 and never posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_r_id}/payroll-remittances"
              payload: { pay_period_start: "2026-01-01", pay_period_end: "2026-01-31", pay_date: "2026-02-05", total_deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_r_id}"
              captures: { rem_d_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem_d_id}/remittance-lines"
              payload: { enrollment_id: "${enr_a_id}", gross_wages_cents: 8000000, deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-12T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /payroll-remittances/${rem_d_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_r_id}"
          trigger:
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "PayrollRemittance.${rem_d_id}.status == SUBMITTED"
            - "PayrollRemittance.${rem_d_id}.days_late == 0"
            - "the first trigger call returns status == 200 with data.delinquent_employer_count == 0"
            - "the first trigger call returns data.assessments_created_count == 0"
            - "after the first trigger call Employer.${emp_r_id}.compliance_status == COMPLIANT"
            - "after the first trigger call Employer.${emp_r_id}.unremitted_deduction_cents == 0"
            - "the third trigger call returns status == 200 with data.delinquent_employer_count == 1"
            - "the third trigger call returns data.assessments_created_count == 0"
            - "Employer.${emp_r_id}.compliance_status == DELINQUENT"
            - "Employer.${emp_r_id}.unremitted_deduction_cents == 400000"
            - "PayrollRemittance.${rem_d_id}.days_late == 0"

      - name: posting_cascade_is_a_difficulty_instance
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / remittance_posting_cascades_to_excess_case_and_restricted_posture
          rationale: "The end-to-end posting chain — line allocation, account ledger, headroom, excess case creation and derived posture — is verified there in one pass, including its ordering sensitivity."

      - name: revocation_cascade_is_a_difficulty_instance
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / exemption_revocation_cascades_four_levels_to_enforcement_referral
          rationale: "The four-level enforcement chain is the deepest cascade in the domain and is verified there level by level."

      - name: nia_dual_variant_is_a_difficulty_instance
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / nia_adjusted_balance_vs_daily_prorata_on_excess_correction
          rationale: "Both net-income-attributable variants are computed from the same fixture there and their delta is asserted, which is the whole of the dual-variant claim."

      - name: penalty_dual_variant_is_a_difficulty_instance
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / statutory_per_employee_vs_graduated_shortfall_penalty
          rationale: "The statutory and graduated penalty variants and the greater-of selection between them are verified there."

  # ===========================================================================
  # SECTION 9 / 9 — consistency_model
  # (claim-extraction-guide: From Consistency Model — immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_current_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /participant-accounts/{id}/earnings-postings]
          - calculations.fund_allocation_split
        distinguishing_aspect: "The consistency model is immediate, so a single earnings posting must return a body in which balance_cents, fund_balances and version are ALL already updated — no read-after-write, no lagging denormalization. The same response must also show that contribution_basis_cents did NOT move, because earnings are not basis, and the fund split must have been re-derived from scratch against the new balance rather than left at its pre-posting shares."
        test_recipe:
          setup:
            - "Ada Cole's account holds 400000 from one posted remittance, split 6000 bp TDF2045 / 4000 bp MMKT01 by an ACTIVE participant election, so fund_balances are 240000 and 160000"
            - "Clock at 2026-02-28"
          setup_api_calls:
            - call: "GET /participant-accounts/${acct_a_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { acct_a_v: "$.data.version" }
            - call: "POST /participant-accounts/${acct_a_id}/investment-elections"
              payload:
                allocations:
                  - { fund_code: "TDF2045", allocation_bp: 6000 }
                  - { fund_code: "MMKT01", allocation_bp: 4000 }
                expected_account_version: "${acct_a_v}"
              as: Participant
              as_user_id: "${par_a_id}"
          trigger:
            - call: "POST /participant-accounts/${acct_a_id}/earnings-postings"
              payload: { earnings_cents: 10000, posting_date: "2026-02-28" }
              as: Recordkeeper
          assert:
            - "the trigger call returns status == 200"
            - "the trigger response body already shows balance_cents == 410000"
            - "the trigger response body already shows contribution_basis_cents == 400000"
            - "the trigger response body already shows fund_balances of 246000 for TDF2045 and 164000 for MMKT01"
            - "the trigger response body already shows a version greater than acct_a_v"
            - "a subsequent GET /participant-accounts/${acct_a_id} returns byte-identical balance_cents, contribution_basis_cents and fund_balances"
            - "ParticipantAccount.${acct_a_id}.ytd_contribution_cents == 400000"
