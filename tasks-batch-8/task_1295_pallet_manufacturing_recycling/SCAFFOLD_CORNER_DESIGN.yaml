# =============================================================================
# §1.9 Scaffold Corner Design — task_1295_pallet_manufacturing_recycling
# Breadth coverage of testable claims NOT already covered by §1.8
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section 1: Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: spec_creation_computes_board_feet_and_cube
        claim_type: computed_fields
        grounds: [entities.PalletSpec.fields.board_feet_per_pallet, entities.PalletSpec.fields.unit_cube_cuft, calculations.board_feet_per_pallet]
        distinguishing_aspect: "Created spec carries server-computed board_feet_per_pallet (15.75) and unit_cube_cuft (6.6667); client-supplied values for computed fields are ignored."
        test_recipe:
          setup: ["empty DB, clock default"]
          setup_api_calls:
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
          trigger:
            - call: "GET /pallet-ops/specs/${spec_id}"
              payload: {}
              as: PlantManager
          assert:
            - "PalletSpec.${spec_id}.board_feet_per_pallet == 15.75"
            - "PalletSpec.${spec_id}.unit_cube_cuft == 6.6667"
            - "PalletSpec.${spec_id}.status == DRAFT (initial state)"
            - "PalletSpec.${spec_id}.requires_heat_treatment_default == false (default applied)"

      - name: spec_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.PalletSpec.fields.board_count, "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "Omitting required input field board_count on spec creation returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "NOBC", length_in: 48, width_in: 40, height_in: 6.0, lumber_species: "PINE" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pallet-ops/specs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: list_endpoint_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["three specs exist"]
          setup_api_calls:
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "S-A", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "S-B", length_in: 42, width_in: 42, height_in: 5.0, board_count: 11, lumber_species: "OAK" }
              as: PlantManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "S-C", length_in: 36, width_in: 36, height_in: 5.0, board_count: 9, lumber_species: "MIXED" }
              as: PlantManager
          trigger:
            - call: "GET /pallet-ops/specs"
              payload: { limit: 2, offset: 0 }
              as: PlantManager
          assert:
            - "response envelope contains meta.api_request_id, meta.api_request_timestamp, response_type == array"
            - "data has 2 entries; pagination block shows total_count == 3 and has_more == true"

      - name: lumber_index_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.LumberPriceIndex]
        distinguishing_aspect: "LumberPriceIndex has common_fields false: response carries id and created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["one lumber index row"]
          setup_api_calls:
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
              captures: { idx: $.data.id }
          trigger:
            - call: "GET /pallet-ops/lumber-index"
              payload: { species: "PINE" }
              as: ProcurementManager
          assert:
            - "row has id and created_at; response has no version field"
            - "no PUT/PATCH endpoint exists for /pallet-ops/lumber-index (immutability by API surface)"

      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: [entities.PalletSpec.fields.lumber_species, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "lumber_species outside {PINE, OAK, MIXED} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "BADENUM", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "BIRCH" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: referenced_fk_not_found_returns_404
        claim_type: parent_relationships
        grounds: [entities.CoreUnit.fields.batch_id, "errors[ERR_REFERENCED_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Creating a CoreUnit with a non-existent batch_id returns 404 ERR_REFERENCED_NOT_FOUND (body FK validated after path existence)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", species: "PINE" }
              as: YardSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCED_NOT_FOUND and http status 404"

  # ===========================================================================
  # Section 2: State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: spec_retire_blocked_by_available_stock
        claim_type: precondition_enforcement
        grounds: [state_machines.PalletSpec.ACTIVE_to_RETIRED, "errors[ERR_SPEC_HAS_STOCK]"]
        distinguishing_aspect: "Retiring a spec that still has an AVAILABLE lot fails with ERR_SPEC_HAS_STOCK."
        test_recipe:
          setup: ["ACTIVE spec with one AVAILABLE NEW_BUILD lot"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 10, quality_grade: "NEW" }
              as: PlantManager
          trigger:
            - call: "POST /pallet-ops/specs/${spec_id}/retire"
              payload: {}
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SPEC_HAS_STOCK (409)"
            - "PalletSpec.${spec_id}.status remains ACTIVE"

      - name: terminal_state_lockdown_closed_batch
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CorePurchaseBatch, "errors[ERR_BATCH_NOT_AUDIT]"]
        distinguishing_aspect: "From terminal CLOSED, close again (and every other transition) is rejected."
        test_recipe:
          setup: ["batch fully sorted and CLOSED"]
          setup_api_calls:
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "TermCo", agreed_unit_price_cents: 500, manifest_count: 1, estimated_grade_mix: { A: 1.0, B: 0.0, SCRAP: 0.0 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c1: $.data.id }
            - call: "POST /pallet-ops/core-units/${c1}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-batches/${batch_id}/finish-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-batches/${batch_id}/close"
              payload: {}
              as: ProcurementManager
          trigger:
            - call: "POST /pallet-ops/core-batches/${batch_id}/close"
              payload: {}
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "second close returns ERR_BATCH_NOT_AUDIT (409)"
            - "CorePurchaseBatch.${batch_id}.status remains CLOSED"

      - name: invalid_transition_sort_already_sorted_core
        claim_type: invalid_transition
        grounds: [state_machines.CoreUnit, "errors[ERR_CORE_ALREADY_SORTED]"]
        distinguishing_aspect: "Sorting a core whose grade is already A (not UNSORTED) fails with ERR_CORE_ALREADY_SORTED — idempotency of the sort action."
        test_recipe:
          setup: ["batch SORTING with one core already sorted to A"]
          setup_api_calls:
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "TwiceCo", agreed_unit_price_cents: 500, manifest_count: 1, estimated_grade_mix: { A: 1.0, B: 0.0, SCRAP: 0.0 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c1: $.data.id }
            - call: "POST /pallet-ops/core-units/${c1}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
          trigger:
            - call: "POST /pallet-ops/core-units/${c1}/sort"
              payload: { grade: "B" }
              as: YardSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CORE_ALREADY_SORTED (409)"
            - "CoreUnit.${c1}.grade remains A"

      - name: wo_abort_releases_core_to_yard
        claim_type: side_effect_execution
        grounds: [state_machines.RepairWorkOrder.OPEN_to_ABORTED]
        distinguishing_aspect: "Aborting an OPEN work order releases the core: CoreUnit.processing_status returns to YARD and the work order is ABORTED."
        test_recipe:
          setup: ["ACTIVE PINE spec exists; core graded B with an OPEN (never started) work order"]
          setup_api_calls:
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { ab_spec: $.data.id }
            - call: "POST /pallet-ops/specs/${ab_spec}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "AbortCo", agreed_unit_price_cents: 500, manifest_count: 1, estimated_grade_mix: { A: 0.0, B: 1.0, SCRAP: 0.0 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c1: $.data.id }
            - call: "POST /pallet-ops/core-units/${c1}/sort"
              payload: { grade: "B" }
              as: YardSupervisor
            - call: "POST /pallet-ops/repair-orders"
              payload: { core_unit_id: "${c1}", target_grade: "A", target_spec_id: "${ab_spec}", labor_minutes_estimate: 30 }
              as: YardSupervisor
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /pallet-ops/repair-orders/${wo}/abort"
              payload: {}
              as: YardSupervisor
          assert:
            - "RepairWorkOrder.${wo}.status == ABORTED"
            - "CoreUnit.${c1}.processing_status == YARD (compensation side effect)"

      - name: customer_close_blocked_by_open_orders
        claim_type: precondition_enforcement
        grounds: [state_machines.Customer.ACTIVE_to_CLOSED, "errors[ERR_OPEN_ORDERS_EXIST]"]
        distinguishing_aspect: "Closing a customer with a non-terminal order (DRAFT) fails with ERR_OPEN_ORDERS_EXIST."
        test_recipe:
          setup: ["ACTIVE customer with one DRAFT order"]
          setup_api_calls:
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "OpenOrderCust" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
          trigger:
            - call: "POST /pallet-ops/customers/${cust_id}/close"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OPEN_ORDERS_EXIST (409)"
            - "Customer.${cust_id}.status remains ACTIVE"

      - name: route_dispatch_requires_order_allocated
        claim_type: guarded_transitions
        grounds: [state_machines.SalesOrder, state_machines.DeliveryRoute.PLAN_to_DISPATCHED, "errors[ERR_ORDER_NOT_ALLOCATED]"]
        distinguishing_aspect: "Dispatching a route whose stop's order is only CONFIRMED (not ALLOCATED) fails with ERR_ORDER_NOT_ALLOCATED — guarded transition on cross-entity state."
        test_recipe:
          setup: ["clock set; PINE index; ACTIVE spec; lot 500; customer; CONFIRMED (not allocated) order; route with stop for that order"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 500, quality_grade: "NEW" }
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "GuardCust" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /pallet-ops/orders/${o_id}/confirm"
              payload: { expected_order_version: "${o_v}" }
              as: SalesRep
            - call: "POST /pallet-ops/routes"
              payload: { route_date: "2026-08-10T00:00:00Z", trailer_cube_capacity_cuft: 5000, planned_miles: 40 }
              as: FleetPlanner
              captures: { route_id: $.data.id }
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 1, stop_type: "DELIVERY", order_id: "${o_id}" }
              as: FleetPlanner
            - call: "GET /pallet-ops/routes/${route_id}"
              payload: {}
              as: FleetPlanner
              captures: { route_v: $.data.version }
          trigger:
            - call: "POST /pallet-ops/routes/${route_id}/dispatch"
              payload: { expected_route_version: "${route_v}" }
              as: FleetPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_NOT_ALLOCATED (409)"
            - "DeliveryRoute.${route_id}.status remains PLAN"

      - name: ht_complete_stamps_lots_with_ispm15
        claim_type: side_effect_execution
        grounds: [state_machines.HeatTreatmentRun.RUNNING_to_COMPLETED, state_machines.InventoryLot, entities.InventoryLot.fields.ispm15_mark_id]
        distinguishing_aspect: "Completing a run after 6h dwell stamps every assigned lot: heat_treat_status -> HT_CERTIFIED and ispm15_mark_id copied from the run's minted mark."
        test_recipe:
          setup: ["RUNNING run started at 2026-08-01T00:00:00Z with one PENDING_HT lot; clock advanced 7 hours"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE", requires_heat_treatment_default: true }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 10, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot_id: $.data.id }
            - call: "POST /pallet-ops/ht-runs"
              payload: { chamber_code: "CH-9", species_profile: "PINE", capacity_pallets: 100 }
              as: HeatTreatOperator
              captures: { run_id: $.data.id }
            - call: "POST /pallet-ops/ht-runs/${run_id}/assign-lot"
              payload: { lot_id: "${lot_id}" }
              as: HeatTreatOperator
            - call: "POST /pallet-ops/ht-runs/${run_id}/start"
              payload: {}
              as: HeatTreatOperator
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T07:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /pallet-ops/ht-runs/${run_id}/complete"
              payload: {}
              as: HeatTreatOperator
              captures: { mark: $.data.ispm15_mark_id }
          assert:
            - "HeatTreatmentRun.${run_id}.status == COMPLETED and ispm15_mark_id is non-null"
            - "InventoryLot.${lot_id}.heat_treat_status == HT_CERTIFIED"
            - "InventoryLot.${lot_id}.ispm15_mark_id == HeatTreatmentRun.${run_id}.ispm15_mark_id"

      - name: ht_fail_releases_lots_back_to_pending
        claim_type: compensation
        grounds: [state_machines.HeatTreatmentRun.RUNNING_to_FAILED]
        distinguishing_aspect: "Failing a RUNNING run unassigns its lots and leaves them PENDING_HT (compensating the assignment) so they can join a later run."
        test_recipe:
          setup: ["RUNNING run with one assigned PENDING_HT lot"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE", requires_heat_treatment_default: true }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 10, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot_id: $.data.id }
            - call: "POST /pallet-ops/ht-runs"
              payload: { chamber_code: "CH-9", species_profile: "PINE", capacity_pallets: 100 }
              as: HeatTreatOperator
              captures: { run_id: $.data.id }
            - call: "POST /pallet-ops/ht-runs/${run_id}/assign-lot"
              payload: { lot_id: "${lot_id}" }
              as: HeatTreatOperator
            - call: "POST /pallet-ops/ht-runs/${run_id}/start"
              payload: {}
              as: HeatTreatOperator
          trigger:
            - call: "POST /pallet-ops/ht-runs/${run_id}/fail"
              payload: {}
              as: HeatTreatOperator
          assert:
            - "HeatTreatmentRun.${run_id}.status == FAILED"
            - "InventoryLot.${lot_id}.heat_treat_status remains PENDING_HT and lot is unassigned (re-assignable)"

      - name: pool_return_dispute_terminal
        claim_type: valid_transition
        grounds: [state_machines.PoolReturn.LOGGED_to_DISPUTED]
        distinguishing_aspect: "A LOGGED return can go to DISPUTED (terminal); crediting a DISPUTED return then fails with ERR_RETURN_NOT_GRADED."
        test_recipe:
          setup: ["customer; LOGGED pool return"]
          setup_api_calls:
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "DisputeCust" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/pool-returns"
              payload: { customer_id: "${cust_id}", returned_count: 2, grade_on_return: "B" }
              as: SalesRep
              captures: { pr_id: $.data.id }
          trigger:
