        claim_type: rbac_denial
        grounds: [state_machines.DutyRosterSlot.ASSIGNED_to_CONFIRMED, "errors[ERR_NOT_SLOT_OWNER]"]
        distinguishing_aspect: "Confirm by a different member than the slot's member_id fails with ERR_NOT_SLOT_OWNER even though role Member is endpoint-allowed."
        test_recipe:
          setup: ["members MO5, MO6; slot S5 assigned to MO5"]
          setup_api_calls:
