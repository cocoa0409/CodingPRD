            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "C-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "C-0002" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
