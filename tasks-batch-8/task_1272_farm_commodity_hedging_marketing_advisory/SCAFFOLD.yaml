  - { method: POST, path: "/advisory/marketing-plans/{planId}/close", description: "ACTIVE|SUSPENDED -> CLOSED when no open contracts/positions", roles: [CommodityAdvisor], code: 200, input: [], output: MarketingPlan, side_effects: ["PENDING PriceTargets -> CANCELLED"] }

  # --- PriceTarget ---
  - { method: POST, path: "/advisory/price-targets", description: "Add a price-target rung to a plan (PENDING)", roles: [CommodityAdvisor], code: 201, input: [plan_id, contract_month, target_price, increment_bushels], output: PriceTarget, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/advisory/price-targets/{targetId}", description: "Read one target", roles: [CommodityAdvisor, Grower], code: 200, input: [], output: PriceTarget, side_effects: [] }
  - { method: GET, path: "/advisory/price-targets", description: "List targets", roles: [CommodityAdvisor, Grower], code: 200, input: ["plan_id?", "status?", "recommendation_id?", "limit?", "offset?"], output: "PriceTarget[]", side_effects: [] }
  - { method: POST, path: "/advisory/price-targets/{targetId}/cancel", description: "PENDING -> CANCELLED", roles: [CommodityAdvisor], code: 200, input: [], output: PriceTarget, side_effects: [] }

  # --- MarketTick (price feed entry) ---
  - { method: POST, path: "/advisory/market-ticks", description: "Record a market price; processes target triggers, recommendation expiry (TTL 5d vs logical clock), and margin re-marking for the matching commodity+contract_month", roles: [PlatformAdmin], code: 201, input: [commodity, contract_month, price, kind, price_date], output: MarketTick, side_effects: ["Eligible PENDING PriceTargets -> TRIGGERED (order: target_price ASC, created_at ASC), minting PROPOSED HedgeRecommendations sized by coverage headroom", "PROPOSED HedgeRecommendations older than 5 days vs logical clock -> EXPIRED (their targets -> LAPSED)", "SETTLEMENT ticks re-mark OPEN positions; margin accounts dropping below maintenance -> CALL_OUTSTANDING"] }

  # --- HedgeRecommendation ---
  - { method: POST, path: "/advisory/hedge-recommendations", description: "Advisor-authored recommendation (PROPOSED)", roles: [CommodityAdvisor], code: 201, input: [plan_id, instrument, contract_month, bushels, "strike_price?", "premium_per_bushel?", "rationale?"], output: HedgeRecommendation, side_effects: ["created_by_user_id recorded", "plan pending_recommendation_count += 1"] }
  - { method: GET, path: "/advisory/hedge-recommendations/{recommendationId}", description: "Read one recommendation", roles: [CommodityAdvisor, Grower], code: 200, input: [], output: HedgeRecommendation, side_effects: [] }
  - { method: GET, path: "/advisory/hedge-recommendations", description: "List recommendations", roles: [CommodityAdvisor, Grower], code: 200, input: ["plan_id?", "status?", "price_target_id?", "limit?", "offset?"], output: "HedgeRecommendation[]", side_effects: [] }
  - { method: POST, path: "/advisory/hedge-recommendations/{recommendationId}/accept", description: "Grower accepts (coverage cap enforced, equality allowed)", roles: [Grower], code: 200, input: [], output: HedgeRecommendation, side_effects: ["status -> ACCEPTED", "plan hedged_bushels recomputed"] }
