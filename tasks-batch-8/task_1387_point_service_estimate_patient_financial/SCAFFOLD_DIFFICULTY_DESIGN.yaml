          - validations[priority=23]
          - errors[ERR_AUTH_NOT_SATISFIED]
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal: the same clear call
          violates both the authorization gate (no auth on an auth-required
          case) and the deposit gate (100000 < 125000 posted); the response
          must carry ERR_AUTH_NOT_SATISFIED, proving safety/compliance outranks
          fiscal. Sibling instance pairs state vs business_temporal.
