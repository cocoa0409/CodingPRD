        excluded_because:
          difficulty_instance: boundary_precision_check / gauge_cpk_at_capable_threshold_versus_one_ten_thousandth_below
          rationale: "Both sides of the CPK_CAPABLE_MIN threshold are asserted in the named 1.8 instance."
