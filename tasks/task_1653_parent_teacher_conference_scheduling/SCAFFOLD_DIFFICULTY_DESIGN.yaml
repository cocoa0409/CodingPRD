  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancel_locked_window_state_beats_cutoff_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_INVALID_WINDOW_STATE]
          - errors[ERR_CANCELLATION_CUTOFF]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: the family cancel violates both the
          window-state gate (window LOCKED, p7) and the cutoff gate (clock 2026-10-04T16:00Z >
          slot.start 2026-10-05T15:00Z - 24h = 2026-10-04T15:00Z, p10); the higher-priority
          state error ERR_INVALID_WINDOW_STATE must win.
        test_recipe:
          setup:
            - "Window LOCKED (clock advanced past booking_close_at 2026-10-01, then to 2026-10-04T16:00:00Z — past the 24h cancel cutoff for slot 0)"
            - "Family F, student st1 linked to T1, booking b1 on slot 0 (CONFIRMED)"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
