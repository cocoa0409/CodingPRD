  - name: duplicate_asset_statement_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=17]
    - errors[ERR_UNIQUENESS_VIOLATION]
    distinguishing_aspect: Second AssetStatement for the same (plan, plan_year) violates the uniqueness constraint.
    test_recipe:
      setup:
