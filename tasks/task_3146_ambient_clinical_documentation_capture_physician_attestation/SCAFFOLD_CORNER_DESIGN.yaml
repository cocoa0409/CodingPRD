        claim_type: role_exclusive_denial
        grounds:
          - roles[QAAuditor]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "QAAuditor is not on the attest endpoint's role list — 403 regardless of note state."
        test_recipe:
          setup: ["Draft IN_REVIEW (any completeness); auditor exists"]
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-RB1-1", full_name: "Pat Rb1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
