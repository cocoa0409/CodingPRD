      - name: every_role_can_read_a_port
        claim_type: shared_operations_allowed
        grounds:
          - roles.Guest
          - roles.ShoreExcursionDesk
          - roles.ExcursionManager
          - roles.OperatorVettingOfficer
          - roles.PortAgent
          - roles.RiskOfficer
          - roles.FinanceController
          - endpoints[GET /shore-excursions/ports/{portId}]
        distinguishing_aspect: |
          The port read is declared for all seven roles, so all seven get 200 with the same body -
          authorisation breadth is a property of the endpoint, not of the caller's other
          privileges.
        test_recipe:
          setup:
            - "One ALONGSIDE port COZ exists with risk_buffer_minutes 30 and tender_egress_minutes 25."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
          trigger:
            - call: "GET /shore-excursions/ports/${port_id}"
              payload: {}
              as: Guest
              as_user_id: "u_guest_1"
            - call: "GET /shore-excursions/ports/${port_id}"
              payload: {}
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
            - call: "GET /shore-excursions/ports/${port_id}"
              payload: {}
              as: ExcursionManager
              as_user_id: "u_mgr_1"
            - call: "GET /shore-excursions/ports/${port_id}"
              payload: {}
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "GET /shore-excursions/ports/${port_id}"
              payload: {}
              as: PortAgent
              as_user_id: "u_agent_1"
            - call: "GET /shore-excursions/ports/${port_id}"
              payload: {}
              as: RiskOfficer
              as_user_id: "u_risk_1"
            - call: "GET /shore-excursions/ports/${port_id}"
              payload: {}
              as: FinanceController
              as_user_id: "u_fin_1"
          assert:
            - "all seven reads return HTTP 200"
            - "every response carries id == ${port_id} and port_code == COZ"
            - "every response carries docking_mode == ALONGSIDE and risk_buffer_minutes == 30"
            - "no response carries an error_id"

      - name: no_role_can_reach_another_roles_exclusive_operation
        claim_type: other_roles_exclusive_denied
        grounds:
          - roles.ShoreExcursionDesk
          - roles.PortAgent
          - roles.Guest
          - roles.ExcursionManager
          - roles.FinanceController
          - roles.RiskOfficer
          - validations[2].ERR_UNAUTHORIZED
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Six exclusive operations are attacked by six wrong roles and every answer is 403
          ERR_UNAUTHORIZED - including the four whose path identifiers are deliberately unknown,
          which proves authorisation is decided before existence.
        test_recipe:
          setup:
            - "The database is empty apart from the logical clock."
            - "Each trigger names a role that is absent from that endpoint's roles list."
            - "The four path identifiers are literal unknown UUIDs, so a 404 would be the wrong answer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
          trigger:
