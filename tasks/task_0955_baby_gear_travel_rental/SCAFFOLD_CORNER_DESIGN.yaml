  # ------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: catalog_list_pagination_limit_offset
        claim_type: listing_pagination
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "With 3 catalog items, GET /catalog-items?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false."
        test_recipe:
          setup: ["three catalog items"]
          setup_api_calls:
            - { call: "POST /catalog-items", payload: { name: "Crib AP", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin }
            - { call: "POST /catalog-items", payload: { name: "Stroller AQ", category: "STROLLER", daily_rate_cents: 1500, deposit_amount_cents: 8000, weight_kg: 8.0, cleaning_turnaround_hours: 12, deep_clean_every_cycles: 3 }, as: OperationsAdmin }
            - { call: "POST /catalog-items", payload: { name: "CarSeat AR", category: "CARSEAT", daily_rate_cents: 1200, deposit_amount_cents: 9000, weight_kg: 6.0, cleaning_turnaround_hours: 12, deep_clean_every_cycles: 3 }, as: OperationsAdmin }
          trigger:
            - { call: "GET /catalog-items", payload: { limit: 2, offset: 0 }, as: OperationsAdmin }
            - { call: "GET /catalog-items", payload: { limit: 2, offset: 2 }, as: OperationsAdmin }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

      - name: response_envelope_shape_on_success_and_error
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id + meta.api_request_timestamp + response_type object/array + data; error responses carry response_type error and data.error_id + data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { full_name: "Vic We", email: "vic@x.com", phone: "022" }, as: Anonymous }
            - { call: "GET /reservations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "create response: meta.api_request_id present, response_type == object, data is the Customer"
            - "error response: response_type == error, data.error_id == ERR_RESERVATION_NOT_FOUND, data.message present"

      - name: availability_computed_read_no_bookings
        claim_type: computed_read
        grounds: [calculations.availability_count, endpoints]
        distinguishing_aspect: "With two units and zero bookings, the availability read returns available_count 2 for any window."
        test_recipe:
          setup: ["catalog with two units"]
          setup_api_calls:
            - { call: "POST /catalog-items", payload: { name: "Crib AS", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-AS1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-AS2", condition_grade: "B" }, as: OperationsAdmin }
          trigger:
            - { call: "GET /catalog-items/${cat}/availability", payload: { start_date: "2026-06-10", end_date: "2026-06-13" }, as: Customer, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { count: $.data.available_count } }
          assert:
            - "available_count == 2"

      - name: delivery_stop_complete_marks_line_out_unit_rented
        claim_type: action_endpoint_side_effect
        grounds: [state_machines.RouteStop.SCHEDULED_to_COMPLETED, state_machines.ReservationLine.ALLOCATED_to_OUT]
        distinguishing_aspect: "Completing a DELIVERY_SETUP stop flips reservation to DELIVERED, line to OUT, unit to RENTED_OUT in one immediate read-after-write."
        test_recipe:
          setup: ["CONFIRMED reservation; DISPATCHED route with the delivery stop; clock at 2026-06-10T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Wyn Xe", email: "wyn@x.com", phone: "023" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib AT", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-AT1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "51 Tupelo Rd", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route: $.data.id } }
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "51 Tupelo Rd", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop: $.data.id } }
            - { call: "POST /routes/${route}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "GET /reservation-lines", payload: { reservation_id: "${res}" }, as: OperationsAdmin, captures: { line: "$.data[0].id" } }
          trigger:
            - { call: "POST /route-stops/${stop}/complete", payload: {}, as: OperationsAdmin, captures: { st: $.data.status } }
          assert:
            - "RouteStop.${stop}.status == COMPLETED and completed_at == 2026-06-10T09:00:00Z"
            - "Reservation.${res}.status == DELIVERED"
            - "ReservationLine.${line}.status == OUT"
            - "InventoryUnit.${unit}.status == RENTED_OUT"

