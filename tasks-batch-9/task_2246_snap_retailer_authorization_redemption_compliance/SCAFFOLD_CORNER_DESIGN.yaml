                line_items:
                  - { sku: "MILK-GAL", item_class: "STAPLE_FOOD", unit_price_cents: 399, qty: 2 }
                  - { sku: "BEER-6PK", item_class: "ALCOHOL", unit_price_cents: 1099, qty: 1 }
                  - { sku: "SOAP-BAR", item_class: "NONFOOD", unit_price_cents: 249, qty: 3 }
                  - { sku: "TOMATO-SEED", item_class: "SEED_PLANT", unit_price_cents: 199, qty: 1 }
                  - { sku: "ROTISSERIE", item_class: "HOT_PREPARED", unit_price_cents: 899, qty: 1 }
                snap_benefit_available_cents: 997
                other_tender_offered_cents: 5000
