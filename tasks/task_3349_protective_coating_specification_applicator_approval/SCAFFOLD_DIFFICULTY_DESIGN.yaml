              as: ProjectEngineer
              captures: { wo_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/work-orders/${wo_id}/begin-prep-inspection"
              as: ApplicatorRep
              as_user_id: "${app_id}"
            - call: "POST /coating/work-orders/${wo_id}/prep-inspections"
