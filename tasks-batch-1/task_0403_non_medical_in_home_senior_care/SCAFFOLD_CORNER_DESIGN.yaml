        claim_type: derived_field_reconciliation
        grounds: [calculations.continuity_score, entities.Client.fields.continuity_score, state_machines.Visit.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "After one COMPLETED visit by the primary caregiver and one MISSED visit, Client.continuity_score == 0.80 (0.6*1 + 0.4*(1/2))."
        test_recipe:
