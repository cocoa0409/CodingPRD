  - name: auto_escalation_cascade_clock_to_query_to_provider
    grounds:
    - state_machines.CDIQuery.SENT_to_ESCALATED
    - state_machines.CDIQuery.ESCALATED_to_NO_RESPONSE
    - calculations.provider_education_band
    distinguishing_aspect: 'Trigger: POST .../clock/advance. Chain depth 3:

      (1) clock advance -> (2) CDIQuery.status SENT -> ESCALATED ->

      ESCALATED -> NO_RESPONSE -> (3) ProviderEducationEvent(s) created

      on the provider -> (4) provider.education_score drops and

      education_flag recomputed. Different trigger than instance 1

      (clock advance vs provider response).

      '
    test_recipe:
      setup:
      - Program at period 0; policy response_due_periods=1, escalation_stage_periods=1, max_escalation_stage=1
      - SENT query with due_period=1
      setup_api_calls:
