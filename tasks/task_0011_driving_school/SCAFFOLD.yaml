# =============================================================================
# Driving School Appointment Management — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: |
  ## 11. Driving School Appointment Management System

  **Extended System Functional Description:**

  Driving school appointment management system: student enrollment with identity verification, medical certificate validation, course package selection, and contract signing; instructor scheduling with vehicle-type qualification matching, working-hour limits, and rest-day rules; practice appointment with available-slot booking, cancellation and rescheduling rules, no-show penalties, and reschedule limits per cycle; training hour tracking with GPS-based session validation, minimum hour requirements per stage, and hour-record submission to authorities; exam appointment with stage-prerequisite check, exam slot allocation, retake limits, and result recording; simulator and additional fee billing with per-session charging, package deduction, and overage payment; complaint handling with submission categorization, multi-level response workflow, instructor-related complaint isolation, and resolution tracking; event-driven synchronization with payment, government driving authority, and IM systems; audit logging for appointment changes and training records.

domain_name: driving-school
api_prefix: /students

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (10 entities — flat topology)
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name,                    type: string,   source: input,    description: "Legal full name" }
      - { name: id_number,                    type: string,   source: input,    description: "Government identity document number" }
      - { name: id_card_country,              type: string,   source: input,    description: "ISO-3166-1 alpha-2 country code" }
      - { name: id_verified,                  type: boolean,  source: computed, description: "Set true when verify-identity succeeds" , default: false }
      - { name: medical_cert_status,          type: enum,     source: computed, description: "PENDING | VALID | EXPIRED", default: "PENDING", constraints: "{PENDING, VALID, EXPIRED}" }
      - { name: medical_cert_expires_on,      type: datetime, source: input,    description: "ISO 8601 date the medical certificate expires; required when medical_cert_status==VALID" }
      - { name: course_package_id,            type: string,   source: input,    description: "Foreign key to CoursePackage; required at PENDING_PACKAGE→PENDING_CONTRACT" }
      - { name: contract_signed_at,           type: datetime, source: system,   description: "Timestamp set when sign-contract succeeds" }
      - { name: training_stage,               type: enum,     source: computed, description: "THEORY | BASIC | HIGHWAY | COMPLETED — initial THEORY", default: "THEORY", constraints: "{THEORY, BASIC, HIGHWAY, COMPLETED}" }
      - { name: enrollment_status,            type: enum,     source: computed, description: "PENDING_VERIFICATION | PENDING_MEDICAL | PENDING_PACKAGE | PENDING_CONTRACT | ACTIVE | SUSPENDED | COMPLETED", default: "PENDING_VERIFICATION", constraints: "{PENDING_VERIFICATION, PENDING_MEDICAL, PENDING_PACKAGE, PENDING_CONTRACT, ACTIVE, SUSPENDED, COMPLETED}" }
      - { name: cycle_start_date,             type: datetime, source: system,   description: "ISO 8601 date when current 30-day cycle began; set at activation, advances on cycle reset" }
      - { name: no_show_count_this_cycle,     type: integer,  source: computed, description: "Count of PracticeAppointment with status=NO_SHOW for this student whose scheduled_start_at >= cycle_start_date", default: 0 }
      - { name: reschedule_count_this_cycle,  type: integer,  source: computed, description: "Count of PracticeAppointment created with reschedule_of_id != null for this student where created_at >= cycle_start_date", default: 0 }
      - { name: minutes_remaining_provisional,    type: integer, source: computed, description: "Provisional package minutes remaining; deducts BOOKED + IN_PROGRESS + COMPLETED practice minutes" }
      - { name: minutes_remaining_final,          type: integer, source: computed, description: "Final package minutes remaining; deducts only COMPLETED practice minutes" }
      - { name: simulator_sessions_remaining,     type: integer, source: computed, description: "Package included_simulator_sessions minus count of SimulatorSession in {BOOKED, COMPLETED}" }
      - { name: exam_attempts_remaining,          type: integer, source: computed, description: "Package included_exam_attempts minus count of ExamAppointment in {BOOKED, PASSED, FAILED, NO_SHOW}" }
      - { name: has_passed_theory,                type: boolean, source: computed, description: "True if any ExamAppointment with exam_type=THEORY_TEST and status=PASSED exists for this student", default: false }
      - { name: has_passed_basic_practical,       type: boolean, source: computed, description: "True if any ExamAppointment with exam_type=BASIC_TEST and status=PASSED exists for this student", default: false }
      - { name: suspension_reason,                type: string,  source: system,   description: "One of: ADMIN_ACTION | NO_SHOW_THRESHOLD_BREACH; null when not suspended" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name,           type: string,  source: input, description: "Instructor full name" }
      - { name: license_number,      type: string,  source: input, description: "Instructor license number" }
      - { name: vehicle_qualifications, type: array, source: input, description: "Array of vehicle types this instructor is qualified to teach. Subset of {MANUAL_C1, AUTO_C2, TRUCK_B2, MOTORCYCLE_E}" }
      - { name: status,              type: enum,    source: computed, description: "ACTIVE | SUSPENDED", default: "ACTIVE", constraints: "{ACTIVE, SUSPENDED}" }
      - { name: last_rest_date,      type: datetime, source: system, description: "ISO 8601 date of the most recent rest day (no PracticeAppointment booked for that day)" }
      - { name: working_minutes_today,    type: integer, source: computed, description: "Sum of (scheduled_end_at - scheduled_start_at) in minutes for this instructor's PracticeAppointment.status IN {BOOKED, IN_PROGRESS, COMPLETED} where scheduled_start_at falls on clock_now's calendar date" }
      - { name: working_minutes_this_week, type: integer, source: computed, description: "Sum of provisional working minutes (BOOKED + IN_PROGRESS + COMPLETED) for the calendar week (Mon 00:00:00 to Sun 23:59:59 UTC) containing clock_now" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: plate_number, type: string, source: input, description: "License plate; unique" }
      - { name: vehicle_type, type: enum,   source: input, description: "MANUAL_C1 | AUTO_C2 | TRUCK_B2 | MOTORCYCLE_E", constraints: "{MANUAL_C1, AUTO_C2, TRUCK_B2, MOTORCYCLE_E}" }
      - { name: status,       type: enum,   source: computed, description: "ACTIVE | MAINTENANCE | RETIRED", default: "ACTIVE", constraints: "{ACTIVE, MAINTENANCE, RETIRED}" }

  - name: CoursePackage
    parent: null
    common_fields: false   # immutable configuration; only id, created_at
    fields:
      - { name: name,                                  type: string,  source: input, description: "Package display name" }
      - { name: total_minutes,                         type: integer, source: input, description: "Total practice minutes included in package" }
      - { name: total_price_cents,                     type: integer, source: input, description: "Package price in cents" }
      - { name: included_simulator_sessions,           type: integer, source: input, description: "Number of simulator sessions included at no extra charge" }
      - { name: included_exam_attempts,                type: integer, source: input, description: "Number of exam attempts (across all exam types) included" }
      - { name: per_minute_overage_price_cents,        type: integer, source: input, description: "Price per minute charged when minutes_remaining drops below proposed practice minutes; the proposed practice creates an OveragePayment" }
      - { name: per_simulator_session_overage_price_cents, type: integer, source: input, description: "Price for each simulator session beyond included count" }

  - name: PracticeAppointment
    parent: null
    common_fields: true
    fields:
      - { name: student_id,           type: string,  source: input, description: "Foreign key to Student" }
      - { name: instructor_id,        type: string,  source: input, description: "Foreign key to Instructor" }
      - { name: vehicle_id,           type: string,  source: input, description: "Foreign key to Vehicle" }
      - { name: vehicle_type,         type: enum,    source: computed, description: "Snapshotted from Vehicle.vehicle_type at booking time", constraints: "{MANUAL_C1, AUTO_C2, TRUCK_B2, MOTORCYCLE_E}" }
      - { name: training_stage,       type: enum,    source: input, description: "Stage this practice counts toward; must equal Student.training_stage at booking time", constraints: "{THEORY, BASIC, HIGHWAY}" }
      - { name: scheduled_start_at,   type: datetime, source: input, description: "ISO 8601 UTC start" }
      - { name: scheduled_end_at,     type: datetime, source: input, description: "ISO 8601 UTC end; must be > scheduled_start_at" }
      - { name: scheduled_minutes,    type: integer, source: computed, description: "(scheduled_end_at - scheduled_start_at)/60, integer; pin: floor division" }
      - { name: status,               type: enum,    source: computed, description: "BOOKED | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW", default: "BOOKED", constraints: "{BOOKED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW}" }
      - { name: reschedule_of_id,     type: string,  source: input, description: "If non-null, this appointment is a reschedule of the referenced cancelled appointment" }
      - { name: cancelled_at,         type: datetime, source: system, description: "Set on CANCELLED transition" }
      - { name: cancellation_actor_role, type: string, source: system, description: "Role that cancelled (Admin or Student)" }
      - { name: check_in_at,          type: datetime, source: system, description: "Set on BOOKED→IN_PROGRESS transition" }
      - { name: check_out_at,         type: datetime, source: system, description: "Set on IN_PROGRESS→COMPLETED transition" }
      - { name: gps_track_distance_km, type: number, source: input, description: "Distance reported at check-out, in km, two decimal places" }
      - { name: gps_validated,        type: boolean, source: computed, description: "True iff gps_track_distance_km >= MIN_DRIVING_KM (5.0)" }
      - { name: recorded_minutes,     type: integer, source: computed, description: "Minutes credited toward training hours; equals scheduled_minutes when status=COMPLETED AND gps_validated=true; 0 otherwise" }
      - { name: late_cancellation_fee_cents, type: integer, source: computed, description: "Computed at CANCELLED transition; 0 unless cancelled within tier window" }
      - { name: no_show_fee_cents,    type: integer, source: computed, description: "Computed at NO_SHOW transition; 100% of session base price" }

  - name: ExamAppointment
    parent: null
    common_fields: true
    fields:
      - { name: student_id,         type: string,   source: input, description: "Foreign key to Student" }
      - { name: exam_type,          type: enum,     source: input, description: "THEORY_TEST | BASIC_TEST | FINAL_TEST", constraints: "{THEORY_TEST, BASIC_TEST, FINAL_TEST}" }
      - { name: scheduled_at,       type: datetime, source: input, description: "ISO 8601 UTC start; exams are 60 minutes by definition" }
      - { name: examiner_id,        type: string,   source: input, description: "Opaque examiner identifier" }
      - { name: status,             type: enum,     source: computed, description: "BOOKED | PASSED | FAILED | CANCELLED | NO_SHOW", default: "BOOKED", constraints: "{BOOKED, PASSED, FAILED, CANCELLED, NO_SHOW}" }
      - { name: score,              type: integer,  source: input, description: "0–100; only set on record-result" }
      - { name: passing_score,      type: integer,  source: computed, description: "Computed from exam_type: THEORY_TEST=90, BASIC_TEST=80, FINAL_TEST=85" }
      - { name: retake_index,       type: integer,  source: computed, description: "1-based ordinal among the same student's exam_type appointments (BOOKED + PASSED + FAILED + NO_SHOW + CANCELLED), assigned at creation time" }
      - { name: prerequisite_stage, type: enum,     source: computed, description: "Required Student.training_stage at booking; THEORY_TEST→THEORY, BASIC_TEST→BASIC, FINAL_TEST→HIGHWAY" }

  - name: SimulatorSession
    parent: null
    common_fields: true
    fields:
      - { name: student_id,         type: string,   source: input, description: "Foreign key to Student" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "ISO 8601 UTC start" }
      - { name: scheduled_end_at,   type: datetime, source: input, description: "ISO 8601 UTC end" }
      - { name: status,             type: enum,     source: computed, description: "BOOKED | COMPLETED | CANCELLED | NO_SHOW", default: "BOOKED", constraints: "{BOOKED, COMPLETED, CANCELLED, NO_SHOW}" }
      - { name: charged_to_package, type: boolean,  source: computed, description: "True iff at booking time student.simulator_sessions_remaining > 0; false → overage_cents charged" }
      - { name: overage_cents,      type: integer,  source: computed, description: "0 when charged_to_package=true; equals package.per_simulator_session_overage_price_cents otherwise" }

  - name: TrainingHourRecord
    parent: null
    common_fields: false   # append-only; only id, created_at
    fields:
      - { name: student_id,                  type: string,   source: system, description: "Foreign key to Student" }
      - { name: source_appointment_id,       type: string,   source: system, description: "PracticeAppointment.id that produced this record" }
      - { name: training_stage,              type: enum,     source: system, description: "Snapshot of PracticeAppointment.training_stage", constraints: "{THEORY, BASIC, HIGHWAY}" }
      - { name: minutes_recorded,            type: integer,  source: system, description: "PracticeAppointment.recorded_minutes" }
      - { name: gps_validated,               type: boolean,  source: system, description: "PracticeAppointment.gps_validated" }
      - { name: authority_submission_status, type: enum,     source: computed, description: "PENDING | SUBMITTED", default: "PENDING", constraints: "{PENDING, SUBMITTED}" }
      - { name: submitted_at,                type: datetime, source: system, description: "Set on submit-hours-to-authority" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: student_id,            type: string, source: input, description: "Foreign key to Student (the complainant)" }
      - { name: instructor_id,         type: string, source: input, description: "Foreign key to Instructor when category=INSTRUCTOR_CONDUCT; otherwise null" }
      - { name: category,              type: enum,   source: input, description: "SCHEDULING | INSTRUCTOR_CONDUCT | BILLING | FACILITY | OTHER", constraints: "{SCHEDULING, INSTRUCTOR_CONDUCT, BILLING, FACILITY, OTHER}" }
      - { name: description,           type: string, source: input, description: "Free-text complaint description" }
      - { name: level,                 type: integer, source: computed, description: "Escalation level: 1, 2, 3. Initial: 1; +1 on each escalate transition. Maximum: 3.", default: 1 }
      - { name: status,                type: enum,   source: computed, description: "OPEN | IN_REVIEW | ESCALATED | RESOLVED | REJECTED", default: "OPEN", constraints: "{OPEN, IN_REVIEW, ESCALATED, RESOLVED, REJECTED}" }
      - { name: assigned_handler_id,   type: string, source: system, description: "Opaque handler identifier (Admin or ComplaintHandler)" }
      - { name: assigned_handler_role, type: string, source: system, description: "Admin | ComplaintHandler — role of the assigned handler at IN_REVIEW" }
      - { name: response_text,         type: string, source: input, description: "Handler's response, set at resolve/reject" }
      - { name: resolution_summary,    type: string, source: input, description: "Resolution summary, set at resolve only" }
      - { name: escalated_at,          type: datetime, source: system, description: "Last ESCALATED transition timestamp" }
      - { name: resolved_at,           type: datetime, source: system, description: "Set at RESOLVED or REJECTED" }

  - name: AuditLog
    parent: null
    common_fields: false   # append-only; only id, created_at
    fields:
      - { name: actor_role,  type: string,   source: system, description: "X-User-Role at the time of the action" }
      - { name: actor_id,    type: string,   source: system, description: "X-User-ID at the time of the action" }
      - { name: entity_type, type: string,   source: system, description: "Entity name (e.g., PracticeAppointment, TrainingHourRecord)" }
      - { name: entity_id,   type: string,   source: system, description: "Affected entity's id" }
      - { name: action,      type: string,   source: system, description: "One of CREATE, UPDATE, CANCEL, CHECK_IN, CHECK_OUT, RESCHEDULE, RECORD_RESULT, SUBMIT_HOURS, NO_SHOW_SWEEP, ESCALATE, RESOLVE, REJECT, ASSIGN_HANDLER" }
      - { name: occurred_at, type: datetime, source: system, description: "Server clock at action time, ISO 8601 UTC" }

# =============================================================================
# §1.2 State Machines (5 entities)
# =============================================================================
state_machines:

  - entity: Student
    field: enrollment_status
    initial_state: PENDING_VERIFICATION
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING_VERIFICATION
        to: PENDING_MEDICAL
        trigger: "POST /students/{id}/verify-identity"
        actor: Admin
        preconditions:
          - "id_number and id_card_country present in body"
        side_effects:
          - "Set Student.id_verified=true"
          - "AuditLog written (action=UPDATE, entity_type=Student)"

      - from: PENDING_MEDICAL
        to: PENDING_PACKAGE
        trigger: "POST /students/{id}/submit-medical-cert"
        actor: Admin
        preconditions:
          - "medical_cert_expires_on is a date strictly after clock_now (ERR_MEDICAL_CERT_EXPIRED)"
        side_effects:
          - "Set Student.medical_cert_status=VALID"
          - "AuditLog written"

      - from: PENDING_PACKAGE
        to: PENDING_CONTRACT
        trigger: "POST /students/{id}/select-package"
        actor: Admin
        preconditions:
          - "course_package_id resolves to a CoursePackage (ERR_PACKAGE_NOT_FOUND)"
        side_effects:
          - "Set Student.course_package_id"
          - "AuditLog written"

      - from: PENDING_CONTRACT
        to: ACTIVE
        trigger: "POST /students/{id}/sign-contract"
        actor: Admin
        preconditions:
          - "Student.medical_cert_status==VALID (recheck against clock_now: ERR_MEDICAL_CERT_EXPIRED)"
        side_effects:
          - "Set Student.contract_signed_at = clock_now"
          - "Set Student.cycle_start_date = clock_now"
          - "Set Student.training_stage = THEORY"
          - "AuditLog written (action=UPDATE)"
          - "Emit Payment.event PACKAGE_PAID with package.total_price_cents (synchronous side-effect log)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /students/{id}/suspend"
        actor: Admin
        preconditions: []
        side_effects:
          - "Set Student.suspension_reason = ADMIN_ACTION"
          - "AuditLog written"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: PracticeAppointment NO_SHOW transition pushed Student.no_show_count_this_cycle to NO_SHOW_THRESHOLD_PER_CYCLE"
        actor: system
        preconditions:
          - "Student.no_show_count_this_cycle, recomputed AFTER the NO_SHOW transition lands, equals NO_SHOW_THRESHOLD_PER_CYCLE (3)"
        side_effects:
          - "Set Student.suspension_reason = NO_SHOW_THRESHOLD_BREACH"
          - "All future PracticeAppointment with student_id=this and status=BOOKED auto-cancel: status→CANCELLED, cancellation_actor_role=system, late_cancellation_fee_cents=0"
          - "AuditLog written"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /students/{id}/reinstate"
        actor: Admin
        preconditions: []
        side_effects:
          - "Clear Student.suspension_reason"
          - "AuditLog written"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system: ExamAppointment.exam_type=FINAL_TEST PASSED transition"
        actor: system
        preconditions:
          - "Student.training_stage transitioned to COMPLETED in the same operation"
        side_effects:
          - "All TrainingHourRecord with student_id=this and authority_submission_status=PENDING → SUBMITTED with submitted_at = clock_now"
          - "AuditLog written (action=UPDATE)"

  - entity: PracticeAppointment
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: IN_PROGRESS
        trigger: "POST /practice-appointments/{id}/check-in"
        actor: Instructor
        preconditions:
          - "X-User-ID == PracticeAppointment.instructor_id (ERR_FORBIDDEN_NOT_ASSIGNED_INSTRUCTOR)"
          - "clock_now >= PracticeAppointment.scheduled_start_at - 15 minutes AND clock_now < PracticeAppointment.scheduled_end_at (ERR_OUTSIDE_CHECK_IN_WINDOW)"
          - "Vehicle.status == ACTIVE (ERR_VEHICLE_NOT_ACTIVE)"
        side_effects:
          - "Set check_in_at = clock_now"
          - "AuditLog written (action=CHECK_IN)"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /practice-appointments/{id}/check-out"
        actor: Instructor
        preconditions:
          - "X-User-ID == PracticeAppointment.instructor_id (ERR_FORBIDDEN_NOT_ASSIGNED_INSTRUCTOR)"
          - "gps_track_distance_km present in body and >= 0"
        side_effects:
          - "Set check_out_at = clock_now, gps_track_distance_km from body"
          - "Set gps_validated = (gps_track_distance_km >= MIN_DRIVING_KM)"
          - "Set recorded_minutes = scheduled_minutes if gps_validated else 0"
          - "Insert TrainingHourRecord with this appointment id, training_stage, minutes_recorded, gps_validated, authority_submission_status=PENDING"
          - "AuditLog written (action=CHECK_OUT)"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /practice-appointments/{id}/cancel"
        actor: Admin | Student
        preconditions:
          - "If actor=Student, X-User-ID == PracticeAppointment.student_id (ERR_FORBIDDEN_NOT_OWNER)"
        side_effects:
          - "Set cancelled_at = clock_now, cancellation_actor_role = X-User-Role"
          - "Compute late_cancellation_fee_cents per calculation late_cancellation_fee"
          - "AuditLog written (action=CANCEL)"

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /_sweep/run (system; sweep finds BOOKED appointment whose scheduled_end_at + NO_SHOW_GRACE_MINUTES < clock_now)"
        actor: system
        preconditions: []
        side_effects:
          - "Set no_show_fee_cents = base_session_price (per calculation no_show_fee)"
          - "AuditLog written (action=NO_SHOW_SWEEP)"
          - "If after this update Student.no_show_count_this_cycle == NO_SHOW_THRESHOLD_PER_CYCLE AND Student.enrollment_status==ACTIVE, cascade Student → SUSPENDED (see Student state machine)"

  - entity: ExamAppointment
    field: status
    initial_state: BOOKED
    terminal_states: [PASSED, FAILED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: PASSED
        trigger: "POST /exam-appointments/{id}/record-result with score >= passing_score"
        actor: Examiner
        preconditions:
          - "score >= passing_score (computed from exam_type)"
        side_effects:
          - "If exam_type=THEORY_TEST: Student.has_passed_theory=true, Student.training_stage: THEORY→BASIC"
          - "If exam_type=BASIC_TEST: Student.has_passed_basic_practical=true, Student.training_stage: BASIC→HIGHWAY"
          - "If exam_type=FINAL_TEST: Student.training_stage: HIGHWAY→COMPLETED, then cascade Student.enrollment_status: ACTIVE→COMPLETED (see Student state machine)"
          - "AuditLog written (action=RECORD_RESULT)"

      - from: BOOKED
        to: FAILED
        trigger: "POST /exam-appointments/{id}/record-result with score < passing_score"
        actor: Examiner
        preconditions:
          - "score < passing_score"
        side_effects:
          - "AuditLog written (action=RECORD_RESULT)"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /exam-appointments/{id}/cancel"
        actor: Admin
        preconditions: []
        side_effects:
          - "AuditLog written (action=CANCEL)"

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /_sweep/run (system; sweep finds BOOKED exam whose scheduled_at + 60 + NO_SHOW_GRACE_MINUTES < clock_now)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLog written (action=NO_SHOW_SWEEP)"

  - entity: SimulatorSession
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /simulator-sessions/{id}/complete"
        actor: Admin
        preconditions:
          - "clock_now >= scheduled_start_at"
        side_effects:
          - "AuditLog written (action=UPDATE)"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /simulator-sessions/{id}/cancel"
        actor: Admin | Student
        preconditions:
          - "If actor=Student, X-User-ID == SimulatorSession.student_id"
        side_effects:
          - "AuditLog written (action=CANCEL)"

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /_sweep/run (system; sweep finds BOOKED simulator session whose scheduled_end_at + NO_SHOW_GRACE_MINUTES < clock_now)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLog written (action=NO_SHOW_SWEEP)"

  - entity: Instructor
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /instructors/{id}/suspend"
        actor: Admin
        preconditions: []
        side_effects:
          - "AuditLog written (action=UPDATE, entity_type=Instructor)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /instructors/{id}/reinstate"
        actor: Admin
        preconditions: []
        side_effects:
          - "AuditLog written (action=UPDATE, entity_type=Instructor)"

  - entity: Vehicle
    field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /vehicles/{id}/set-maintenance"
        actor: Admin
        preconditions: []
        side_effects:
          - "AuditLog written (action=UPDATE, entity_type=Vehicle)"

      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /vehicles/{id}/restore-active"
        actor: Admin
        preconditions: []
        side_effects:
          - "AuditLog written (action=UPDATE, entity_type=Vehicle)"

  - entity: Complaint
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, REJECTED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /complaints/{id}/assign-handler"
        actor: Admin
        preconditions:
          - "If Complaint.category==INSTRUCTOR_CONDUCT, body.handler_role MUST be Admin (ERR_INSTRUCTOR_COMPLAINT_REQUIRES_ADMIN)"
        side_effects:
          - "Set assigned_handler_id, assigned_handler_role from body"
          - "AuditLog written (action=ASSIGN_HANDLER)"

      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /complaints/{id}/escalate"
        actor: ComplaintHandler | Admin
        preconditions:
          - "Complaint.level < 3 (ERR_ESCALATION_LIMIT_REACHED)"
          - "X-User-ID == Complaint.assigned_handler_id (ERR_FORBIDDEN_NOT_ASSIGNED_HANDLER)"
        side_effects:
          - "Set Complaint.level += 1"
          - "Set Complaint.status = ESCALATED"
          - "Set Complaint.escalated_at = clock_now"
          - "Clear Complaint.assigned_handler_id, assigned_handler_role"
          - "AuditLog written (action=ESCALATE)"

      - from: ESCALATED
        to: IN_REVIEW
        trigger: "POST /complaints/{id}/assign-handler (re-assignment after escalation)"
        actor: Admin
        preconditions:
          - "If Complaint.category==INSTRUCTOR_CONDUCT, body.handler_role MUST be Admin (ERR_INSTRUCTOR_COMPLAINT_REQUIRES_ADMIN)"
          - "If Complaint.level == 3, body.handler_role MUST be Admin (ERR_LEVEL3_REQUIRES_ADMIN)"
        side_effects:
          - "Set assigned_handler_id, assigned_handler_role from body"
          - "AuditLog written (action=ASSIGN_HANDLER)"

      - from: IN_REVIEW
        to: RESOLVED
        trigger: "POST /complaints/{id}/resolve"
        actor: ComplaintHandler | Admin
        preconditions:
          - "X-User-ID == Complaint.assigned_handler_id (ERR_FORBIDDEN_NOT_ASSIGNED_HANDLER)"
        side_effects:
          - "Set Complaint.response_text, resolution_summary from body"
          - "Set Complaint.resolved_at = clock_now"
          - "AuditLog written (action=RESOLVE)"

      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /complaints/{id}/reject"
        actor: ComplaintHandler | Admin
        preconditions:
          - "X-User-ID == Complaint.assigned_handler_id (ERR_FORBIDDEN_NOT_ASSIGNED_HANDLER)"
        side_effects:
          - "Set Complaint.response_text from body"
          - "Set Complaint.resolved_at = clock_now"
          - "AuditLog written (action=REJECT)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two PracticeAppointment bookings for same instructor at overlapping time"
    guarantee: "At most one BOOKED appointment per instructor per overlapping interval; second rejected"
    error_id: ERR_INSTRUCTOR_TIME_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on instructor calendar; instructor calendar uses closed intervals [start, end] (a request whose start equals an existing end is rejected)"

  - scenario: "Two PracticeAppointment bookings for same vehicle at overlapping time (or within 15-minute buffer)"
    guarantee: "Vehicle calendar uses half-open intervals [start, end) PLUS a 15-minute cleaning buffer; second rejected"
    error_id: ERR_VEHICLE_TIME_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on vehicle calendar"

  - scenario: "Cancel and check-in race on the same BOOKED practice appointment"
    guarantee: "Exactly one operation succeeds; loser sees the appointment in the new status"
    error_id: ERR_APPOINTMENT_NOT_CANCELLABLE
    http_status: 409
    serialization: "First-writer-wins on PracticeAppointment.status"

  - scenario: "Two record-result calls on the same BOOKED exam"
    guarantee: "First call lands a terminal state; second rejected"
    error_id: ERR_EXAM_NOT_BOOKABLE
    http_status: 409
    serialization: "First-writer-wins on ExamAppointment.status"

  - scenario: "Two assign-handler calls on the same OPEN complaint"
    guarantee: "First call moves complaint to IN_REVIEW; second rejected"
    error_id: ERR_COMPLAINT_NOT_ASSIGNABLE
    http_status: 409
    serialization: "First-writer-wins on Complaint.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: minutes_remaining_provisional
    trigger: "Read of Student object; recomputed on every PracticeAppointment transition that affects status"
    algorithm: forward_looking
    formula: |
      provisional_used = sum(scheduled_minutes for PracticeAppointment p
        where p.student_id == this.id
          AND p.status IN {BOOKED, IN_PROGRESS, COMPLETED})
      minutes_remaining_provisional = CoursePackage.total_minutes - provisional_used
    input_set: "PracticeAppointment in {BOOKED, IN_PROGRESS, COMPLETED}; CANCELLED and NO_SHOW excluded"
    constants: {}
    precision: "integer minutes"
    variants:
      - name: provisional
        when: "default; used for booking budget gate"
        difference: "Includes BOOKED + IN_PROGRESS + COMPLETED"
      - name: final
        when: "used for end-of-cycle authority report"
        difference: "Counts only COMPLETED appointments with gps_validated=true; sum of recorded_minutes only"

  - name: minutes_remaining_final
    trigger: "Read of Student object"
    algorithm: chronological
    formula: |
      final_used = sum(recorded_minutes for PracticeAppointment p
        where p.student_id == this.id
          AND p.status == COMPLETED
          AND p.gps_validated == true)
      minutes_remaining_final = CoursePackage.total_minutes - final_used
    input_set: "PracticeAppointment in {COMPLETED} AND gps_validated=true"
    constants: {}
    precision: "integer minutes"
    note: "Always >= minutes_remaining_provisional in steady state. The two diverge when there are BOOKED or IN_PROGRESS appointments not yet completed, or COMPLETED appointments with gps_validated=false."

  - name: instructor_working_minutes_today_provisional
    trigger: "Read of Instructor object; rejection check on POST /practice-appointments"
    algorithm: forward_looking
    formula: |
      provisional_minutes = sum((scheduled_end_at - scheduled_start_at) in minutes
        for PracticeAppointment p
        where p.instructor_id == this.id
          AND p.status IN {BOOKED, IN_PROGRESS, COMPLETED}
          AND p.scheduled_start_at falls on clock_now's calendar date in UTC)
    input_set: "PracticeAppointment in {BOOKED, IN_PROGRESS, COMPLETED} on this calendar day"
    constants:
      INSTRUCTOR_DAILY_LIMIT_MINUTES: 480
    precision: "integer minutes"
    variants:
      - name: provisional
        when: "Used as the cap for booking acceptance — counts BOOKED + IN_PROGRESS + COMPLETED"
        difference: "Pessimistic; pre-commits BOOKED minutes against the daily cap"
      - name: actual
        when: "Used for instructor-payroll reporting (no payroll endpoint in v1; defined for variant divergence)"
        difference: "Sums only COMPLETED minutes — divergence with provisional whenever any BOOKED appointment is held"

  - name: late_cancellation_fee_cents
    trigger: "PracticeAppointment BOOKED→CANCELLED transition"
    algorithm: tiered_pricing
    formula: |
      delta_seconds = scheduled_start_at - clock_now    # signed
      delta_hours = delta_seconds / 3600.0              # float
      base_session_price_cents = scheduled_minutes * package.per_minute_overage_price_cents
      # Tier select (mode (a): >=3 inputs and non-linear)
      if delta_hours <= 0:
        tier_pct = 100
      elif delta_hours < 2:
        tier_pct = 100
      elif delta_hours < 24:
        tier_pct = 50
      elif delta_hours < 72:
        tier_pct = 0
      else:
        tier_pct = 0
      late_cancellation_fee_cents = floor(base_session_price_cents * tier_pct / 100)
    input_set: "Single appointment"
    constants:
      LATE_CANCEL_TIER_2H_PCT: 100
      LATE_CANCEL_TIER_24H_PCT: 50
      LATE_CANCEL_TIER_72H_PCT: 0
    precision: "integer cents, floor"
    note: "Boundary semantics: at exactly 2 hours, tier = 50; at exactly 24 hours, tier = 0; at exactly 72 hours, tier = 0. Tiered cliffs use strict less-than below."

  - name: no_show_fee_cents
    trigger: "PracticeAppointment BOOKED→NO_SHOW transition"
    algorithm: aggregation
    formula: |
      no_show_fee_cents = scheduled_minutes * package.per_minute_overage_price_cents
    input_set: "Single appointment"
    constants:
      NO_SHOW_FEE_PCT: 100
    precision: "integer cents"

  - name: simulator_billing
    trigger: "POST /simulator-sessions"
    algorithm: waterfall_allocation
    formula: |
      # Order of evaluation pinned (mode (c): circular-looking dependency)
      # 1. Recompute student.simulator_sessions_remaining BEFORE this booking
      # 2. If simulator_sessions_remaining > 0:
      #      charged_to_package = true; overage_cents = 0
      #    Else:
      #      charged_to_package = false; overage_cents = package.per_simulator_session_overage_price_cents
      # 3. After the new SimulatorSession is persisted, simulator_sessions_remaining
      #    is recomputed and may decrement to 0 or stay at 0.
    input_set: "Student package and prior SimulatorSession status"
    constants: {}
    precision: "integer cents"

  - name: cycle_invoice_overage_total
    trigger: "End-of-cycle (informational; no endpoint in v1, but pinned to allow future use and to fix rounding order)"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding pinned — round per-session, then sum
      round_per_session = []
      for s in SimulatorSession where s.student_id==this.id AND s.status==COMPLETED AND s.charged_to_package==false AND s.created_at >= cycle_start_date:
        per_session_rounded_cents = floor(s.overage_cents)   # already integer; floor is identity here
        round_per_session.append(per_session_rounded_cents)
      cycle_invoice_overage_total = sum(round_per_session)
    input_set: "SimulatorSession in {COMPLETED} for this cycle window"
    constants: {}
    precision: "integer cents — round per session, then sum (NOT sum then round)"

  - name: training_stage_advance
    trigger: "ExamAppointment BOOKED→PASSED transition"
    algorithm: topological
    formula: |
      if exam_type == THEORY_TEST and training_stage == THEORY: training_stage = BASIC
      elif exam_type == BASIC_TEST and training_stage == BASIC: training_stage = HIGHWAY
      elif exam_type == FINAL_TEST and training_stage == HIGHWAY: training_stage = COMPLETED
      else: error  # already covered by prerequisite_stage validation
    input_set: "Single Student"
    constants: {}
    precision: "n/a"

  - name: stage_minimum_hours_check
    trigger: "POST /exam-appointments creation (booking time)"
    algorithm: aggregation
    formula: |
      # The stage being attested by the exam:
      attested_stage = {
        THEORY_TEST: THEORY,
        BASIC_TEST:  BASIC,
        FINAL_TEST:  HIGHWAY
      }[exam_type]
      required_minutes = {
        THEORY: 0,
        BASIC: 600,
        HIGHWAY: 480
      }[attested_stage]
      attested_minutes = sum(recorded_minutes for TrainingHourRecord r
        where r.student_id == this.id
          AND r.training_stage == attested_stage
          AND r.gps_validated == true)
      if attested_minutes < required_minutes: reject ERR_STAGE_MIN_HOURS_NOT_MET
    input_set: "TrainingHourRecord for attested stage with gps_validated=true"
    constants:
      MIN_BASIC_MINUTES: 600
      MIN_HIGHWAY_MINUTES: 480
    precision: "integer minutes"

  - name: instructor_rest_day_check
    trigger: "POST /practice-appointments (booking time)"
    algorithm: threshold
    formula: |
      # Compute distinct calendar dates (UTC) on which this instructor has at least one
      # PracticeAppointment in {BOOKED, IN_PROGRESS, COMPLETED} within the calendar week
      # (Mon 00:00 UTC to Sun 23:59:59.999 UTC) containing scheduled_start_at.
      # The proposed appointment's scheduled_start_at counts toward its date.
      # If the resulting set of dates equals 7 (i.e., no rest day in that week), reject.
      reject if distinct_working_dates_in_week(post_proposal) == 7  # ERR_INSTRUCTOR_NEEDS_REST
    input_set: "PracticeAppointment in {BOOKED, IN_PROGRESS, COMPLETED} for instructor in target ISO week"
    constants:
      INSTRUCTOR_REST_DAYS_PER_WEEK: 1
    precision: "integer count of calendar dates"

  - name: gps_validation
    trigger: "PracticeAppointment IN_PROGRESS→COMPLETED transition (check-out)"
    algorithm: threshold
    formula: |
      gps_validated = (gps_track_distance_km >= MIN_DRIVING_KM)
      recorded_minutes = scheduled_minutes if gps_validated else 0
    input_set: "Single appointment"
    constants:
      MIN_DRIVING_KM: 5.0
    precision: "two decimal places on km"
    note: "Boundary: at exactly 5.00 km → gps_validated=true. At 4.99 km → false."

  - name: vehicle_buffer_check
    trigger: "POST /practice-appointments (booking time)"
    algorithm: interval_merge
    formula: |
      # Half-open intervals on vehicle: existing booking [a, b), proposed [c, d).
      # Conflict iff (a < d AND c < b)  OR
      #             (the gap between earlier.end and later.start is < VEHICLE_BUFFER_MINUTES).
      # Equivalently: no booking on vehicle is allowed within VEHICLE_BUFFER_MINUTES of another.
      reject if exists existing booking [a, b) such that
        (max(a, c) < min(b, d))  OR
        (c >= b AND c - b < VEHICLE_BUFFER_MINUTES * 60 seconds)  OR
        (d <= a AND a - d < VEHICLE_BUFFER_MINUTES * 60 seconds)
    input_set: "PracticeAppointment in {BOOKED, IN_PROGRESS, COMPLETED} for same vehicle_id"
    constants:
      VEHICLE_BUFFER_MINUTES: 15
    precision: "integer seconds"
    note: "Distinct from instructor calendar which uses closed intervals [start, end] without buffer."

  - name: instructor_calendar_overlap_check
    trigger: "POST /practice-appointments (booking time)"
    algorithm: interval_merge
    formula: |
      # Closed intervals on instructor: existing [a, b], proposed [c, d].
      # Conflict iff a <= d AND c <= b
      # i.e., adjacency (c == b or d == a) IS a conflict, unlike vehicle.
      reject if exists existing booking [a, b] such that a <= d AND c <= b
    input_set: "PracticeAppointment in {BOOKED, IN_PROGRESS, COMPLETED} for same instructor_id"
    constants: {}
    precision: "integer seconds"

  - name: cycle_reset_sweep
    trigger: "POST /_sweep/run"
    algorithm: chronological
    formula: |
      For each Student s with enrollment_status IN {ACTIVE, SUSPENDED}:
        if s.cycle_start_date is at least CYCLE_DAYS calendar days before clock_now's date:
          # Reset cycle: counters become 0 implicitly (since they are computed from records since cycle_start_date)
          s.cycle_start_date = clock_now.date()
          AuditLog: action=UPDATE, entity_type=Student
    input_set: "Active students whose current cycle has aged out"
    constants:
      CYCLE_DAYS: 30
    precision: "calendar dates, UTC"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must have permission for the operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist (validated left-to-right): student → appointment → complaint etc."
    error_id: "ERR_STUDENT_NOT_FOUND | ERR_INSTRUCTOR_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_PRACTICE_NOT_FOUND | ERR_EXAM_NOT_FOUND | ERR_SIMULATOR_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path id parameters

  - priority: 4
    category: business_referential
    check: "When acting role is Student or Instructor (entity-backed), X-User-ID must equal the resource's student_id / instructor_id (ownership)"
    error_id: "ERR_FORBIDDEN_NOT_OWNER | ERR_FORBIDDEN_NOT_ASSIGNED_INSTRUCTOR | ERR_FORBIDDEN_NOT_ASSIGNED_HANDLER"
    http_status: 403
    applies_to: "Student-self-service endpoints, instructor check-in/check-out, complaint handler actions"

  - priority: 5
    category: state
    check: "Target resource must be in correct state for the operation"
    error_id: "ERR_APPOINTMENT_NOT_CANCELLABLE | ERR_APPOINTMENT_NOT_CHECK_INNABLE | ERR_APPOINTMENT_NOT_CHECK_OUTTABLE | ERR_EXAM_NOT_BOOKABLE | ERR_COMPLAINT_NOT_ASSIGNABLE | ERR_COMPLAINT_NOT_RESOLVABLE | ERR_STUDENT_NOT_ACTIVE | ERR_STUDENT_NOT_AT_PENDING_STATE | ERR_INSTRUCTOR_NOT_ACTIVE | ERR_VEHICLE_NOT_ACTIVE"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-entity referential integrity: instructor must be qualified for vehicle_type; vehicle_type must match student's training_stage allowance; exam prerequisite_stage must match Student.training_stage"
    error_id: "ERR_INSTRUCTOR_NOT_QUALIFIED | ERR_VEHICLE_TYPE_MISMATCH | ERR_PREREQUISITE_STAGE_NOT_MET | ERR_INSTRUCTOR_COMPLAINT_REQUIRES_ADMIN | ERR_LEVEL3_REQUIRES_ADMIN"
    http_status: 400
    applies_to: "POST /practice-appointments, POST /exam-appointments, POST /complaints/{id}/assign-handler"

  - priority: 7
    category: business_temporal
    check: "Resource scheduling overlap and buffer violations"
    error_id: "ERR_INSTRUCTOR_TIME_CONFLICT | ERR_VEHICLE_TIME_CONFLICT | ERR_OUTSIDE_CHECK_IN_WINDOW"
    http_status: 409
    applies_to: "POST /practice-appointments, POST /practice-appointments/{id}/check-in"

  - priority: 8
    category: business_safety
    check: "Instructor working-hour limits and rest-day rule"
    error_id: "ERR_INSTRUCTOR_DAILY_LIMIT_EXCEEDED | ERR_INSTRUCTOR_WEEKLY_LIMIT_EXCEEDED | ERR_INSTRUCTOR_NEEDS_REST"
    http_status: 403
    applies_to: "POST /practice-appointments"

  - priority: 9
    category: business_constraint
    check: "Cycle-bounded counters: reschedule limit per cycle; exam retake limit"
    error_id: "ERR_RESCHEDULE_LIMIT_EXCEEDED | ERR_RETAKE_LIMIT_EXCEEDED | ERR_ESCALATION_LIMIT_REACHED | ERR_STAGE_MIN_HOURS_NOT_MET"
    http_status: 409
    applies_to: "POST /practice-appointments/{id}/reschedule, POST /exam-appointments, POST /complaints/{id}/escalate"

  - priority: 10
    category: business_fiscal
    check: "Package balance gates: practice minutes, simulator sessions, exam attempts (overage permitted only when package_total_minutes - provisional_used >= 0; else ERR_INSUFFICIENT_PACKAGE_BALANCE)"
    error_id: "ERR_INSUFFICIENT_PACKAGE_BALANCE | ERR_NO_EXAM_ATTEMPTS_REMAINING"
    http_status: 402
    applies_to: "POST /practice-appointments, POST /exam-appointments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Students ---
  - { method: POST,  path: "/students",                                      description: "Enroll a student (PENDING_VERIFICATION)",                          roles: [Admin],            code: 201, input: [full_name, id_number, id_card_country],                                            output: Student,           side_effects: ["Student created at PENDING_VERIFICATION; AuditLog written"] }
  - { method: GET,   path: "/students/{id}",                                 description: "Get student",                                                       roles: [Admin, Student],   code: 200, input: [],                                                                                  output: Student,           side_effects: [] }
  - { method: POST,  path: "/students/{id}/verify-identity",                 description: "Verify identity (PENDING_VERIFICATION→PENDING_MEDICAL)",            roles: [Admin],            code: 200, input: [],                                                                                  output: Student,           side_effects: ["Student.id_verified=true; status→PENDING_MEDICAL; AuditLog"] }
  - { method: POST,  path: "/students/{id}/submit-medical-cert",             description: "Validate medical cert (PENDING_MEDICAL→PENDING_PACKAGE)",           roles: [Admin],            code: 200, input: [medical_cert_expires_on],                                                           output: Student,           side_effects: ["medical_cert_status=VALID; status→PENDING_PACKAGE; AuditLog"] }
  - { method: POST,  path: "/students/{id}/select-package",                  description: "Select course package (PENDING_PACKAGE→PENDING_CONTRACT)",          roles: [Admin],            code: 200, input: [course_package_id],                                                                 output: Student,           side_effects: ["course_package_id set; status→PENDING_CONTRACT; AuditLog"] }
  - { method: POST,  path: "/students/{id}/sign-contract",                   description: "Sign contract and pay (PENDING_CONTRACT→ACTIVE)",                   roles: [Admin],            code: 200, input: [],                                                                                  output: Student,           side_effects: ["contract_signed_at; cycle_start_date; training_stage=THEORY; status→ACTIVE; AuditLog"] }
  - { method: POST,  path: "/students/{id}/suspend",                         description: "Admin suspend (ACTIVE→SUSPENDED)",                                  roles: [Admin],            code: 200, input: [],                                                                                  output: Student,           side_effects: ["suspension_reason=ADMIN_ACTION; AuditLog"] }
  - { method: POST,  path: "/students/{id}/reinstate",                       description: "Reinstate (SUSPENDED→ACTIVE)",                                       roles: [Admin],            code: 200, input: [],                                                                                  output: Student,           side_effects: ["suspension_reason cleared; AuditLog"] }
  - { method: GET,   path: "/students/{id}/training-hours",                  description: "Return training hour totals per stage AND the list of TrainingHourRecord rows for this student. Response shape: { totals: { THEORY: int, BASIC: int, HIGHWAY: int }, totals_validated: { THEORY: int, BASIC: int, HIGHWAY: int }, records: TrainingHourRecord[] }", roles: [Admin, Student], code: 200, input: [],                                                                                  output: "object",          side_effects: [] }
  - { method: POST,  path: "/students/{id}/submit-hours-to-authority",       description: "Submit all PENDING TrainingHourRecord rows to authority",            roles: [Admin],            code: 200, input: [],                                                                                  output: "object",          side_effects: ["For all PENDING records of this student: authority_submission_status=SUBMITTED, submitted_at=clock_now; AuditLog action=SUBMIT_HOURS"] }

  # --- Instructors ---
  - { method: POST,  path: "/instructors",                                   description: "Create instructor",                                                  roles: [Admin],            code: 201, input: [full_name, license_number, vehicle_qualifications],                                output: Instructor,        side_effects: ["status=ACTIVE; AuditLog"] }
  - { method: GET,   path: "/instructors/{id}",                              description: "Get instructor",                                                     roles: [Admin, Instructor],code: 200, input: [],                                                                                  output: Instructor,        side_effects: [] }
  - { method: POST,  path: "/instructors/{id}/suspend",                      description: "Suspend instructor (ACTIVE→SUSPENDED)",                              roles: [Admin],            code: 200, input: [],                                                                                  output: Instructor,        side_effects: ["status→SUSPENDED; AuditLog"] }
  - { method: POST,  path: "/instructors/{id}/reinstate",                    description: "Reinstate instructor (SUSPENDED→ACTIVE)",                            roles: [Admin],            code: 200, input: [],                                                                                  output: Instructor,        side_effects: ["status→ACTIVE; AuditLog"] }

  # --- Vehicles ---
  - { method: POST,  path: "/vehicles",                                      description: "Create vehicle",                                                     roles: [Admin],            code: 201, input: [plate_number, vehicle_type],                                                       output: Vehicle,           side_effects: ["status=ACTIVE; AuditLog"] }
  - { method: GET,   path: "/vehicles/{id}",                                 description: "Get vehicle",                                                        roles: [Admin],            code: 200, input: [],                                                                                  output: Vehicle,           side_effects: [] }
  - { method: POST,  path: "/vehicles/{id}/set-maintenance",                 description: "Move vehicle to MAINTENANCE",                                        roles: [Admin],            code: 200, input: [],                                                                                  output: Vehicle,           side_effects: ["status→MAINTENANCE; AuditLog"] }
  - { method: POST,  path: "/vehicles/{id}/restore-active",                  description: "Restore vehicle to ACTIVE",                                          roles: [Admin],            code: 200, input: [],                                                                                  output: Vehicle,           side_effects: ["status→ACTIVE; AuditLog"] }

  # --- Course packages ---
  - { method: POST,  path: "/course-packages",                               description: "Create course package (immutable)",                                  roles: [Admin],            code: 201, input: [name, total_minutes, total_price_cents, included_simulator_sessions, included_exam_attempts, per_minute_overage_price_cents, per_simulator_session_overage_price_cents], output: CoursePackage, side_effects: [] }
  - { method: GET,   path: "/course-packages/{id}",                          description: "Get course package",                                                 roles: [Admin, Student],   code: 200, input: [],                                                                                  output: CoursePackage,     side_effects: [] }

  # --- Practice appointments ---
  - { method: POST,  path: "/practice-appointments",                         description: "Book a practice slot",                                              roles: [Admin, Student],   code: 201, input: [student_id, instructor_id, vehicle_id, training_stage, scheduled_start_at, scheduled_end_at, "reschedule_of_id?"], output: PracticeAppointment, side_effects: ["status=BOOKED; if reschedule_of_id non-null, validate the referenced appointment is CANCELLED with cancellation_actor_role IN {Admin, Student} AND cancellation_actor_role MATCHES the booking actor's identity per ownership; reschedule_count_this_cycle increments via the new BOOKED with non-null reschedule_of_id; AuditLog (action=CREATE; if reschedule_of_id, also action=RESCHEDULE)"] }
  - { method: GET,   path: "/practice-appointments/{id}",                    description: "Get practice appointment",                                            roles: [Admin, Student, Instructor], code: 200, input: [],                                                                  output: PracticeAppointment, side_effects: [] }
  - { method: POST,  path: "/practice-appointments/{id}/cancel",             description: "Cancel a BOOKED appointment",                                        roles: [Admin, Student],   code: 200, input: [],                                                                                  output: PracticeAppointment, side_effects: ["status→CANCELLED; cancelled_at; cancellation_actor_role; late_cancellation_fee_cents computed; AuditLog (action=CANCEL)"] }
  - { method: POST,  path: "/practice-appointments/{id}/check-in",           description: "Instructor check-in (BOOKED→IN_PROGRESS)",                          roles: [Instructor, Admin],code: 200, input: [],                                                                                  output: PracticeAppointment, side_effects: ["status→IN_PROGRESS; check_in_at=clock_now; AuditLog (action=CHECK_IN)"] }
  - { method: POST,  path: "/practice-appointments/{id}/check-out",          description: "Instructor check-out (IN_PROGRESS→COMPLETED)",                       roles: [Instructor, Admin],code: 200, input: [gps_track_distance_km],                                                            output: PracticeAppointment, side_effects: ["status→COMPLETED; check_out_at=clock_now; gps_validated; recorded_minutes; insert TrainingHourRecord; AuditLog (action=CHECK_OUT)"] }
  - { method: POST,  path: "/practice-appointments/{id}/reschedule",         description: "Reschedule: cancel current and create a new BOOKED in one call",     roles: [Admin, Student],   code: 201, input: [new_scheduled_start_at, new_scheduled_end_at, "new_instructor_id?", "new_vehicle_id?"], output: PracticeAppointment, side_effects: ["Atomically cancel the current appointment (late_cancellation_fee_cents=0, regardless of tier — reschedule waives the fee) and create a new BOOKED appointment with reschedule_of_id pointing at the cancelled one; reschedule_count_this_cycle increments; AuditLog actions CANCEL and CREATE/RESCHEDULE"] }

  # --- Exam appointments ---
  - { method: POST,  path: "/exam-appointments",                             description: "Book an exam",                                                       roles: [Admin],            code: 201, input: [student_id, exam_type, scheduled_at, examiner_id],                                  output: ExamAppointment,   side_effects: ["status=BOOKED; passing_score derived; retake_index assigned; AuditLog"] }
  - { method: GET,   path: "/exam-appointments/{id}",                        description: "Get exam appointment",                                                roles: [Admin, Student, Examiner], code: 200, input: [],                                                                          output: ExamAppointment,   side_effects: [] }
  - { method: POST,  path: "/exam-appointments/{id}/record-result",          description: "Record exam result (BOOKED→PASSED or BOOKED→FAILED)",                roles: [Examiner],         code: 200, input: [score],                                                                              output: ExamAppointment,   side_effects: ["status→PASSED or FAILED; on PASSED training_stage_advance; on PASSED of FINAL_TEST cascades Student→COMPLETED; AuditLog (action=RECORD_RESULT)"] }
  - { method: POST,  path: "/exam-appointments/{id}/cancel",                 description: "Cancel exam (BOOKED→CANCELLED)",                                     roles: [Admin],            code: 200, input: [],                                                                                  output: ExamAppointment,   side_effects: ["status→CANCELLED; AuditLog"] }

  # --- Simulator sessions ---
  - { method: POST,  path: "/simulator-sessions",                            description: "Book a simulator session",                                           roles: [Admin, Student],   code: 201, input: [student_id, scheduled_start_at, scheduled_end_at],                                  output: SimulatorSession,  side_effects: ["status=BOOKED; charged_to_package and overage_cents computed (calculation simulator_billing); AuditLog"] }
  - { method: POST,  path: "/simulator-sessions/{id}/cancel",                description: "Cancel simulator (BOOKED→CANCELLED)",                                roles: [Admin, Student],   code: 200, input: [],                                                                                  output: SimulatorSession,  side_effects: ["status→CANCELLED; AuditLog (action=CANCEL)"] }
  - { method: POST,  path: "/simulator-sessions/{id}/complete",              description: "Mark simulator complete (BOOKED→COMPLETED)",                          roles: [Admin],            code: 200, input: [],                                                                                  output: SimulatorSession,  side_effects: ["status→COMPLETED; AuditLog"] }

  # --- Complaints ---
  - { method: POST,  path: "/complaints",                                    description: "File a complaint",                                                   roles: [Student, Admin],   code: 201, input: [student_id, category, description, "instructor_id?"],                              output: Complaint,         side_effects: ["status=OPEN; level=1; AuditLog"] }
  - { method: GET,   path: "/complaints/{id}",                               description: "Get complaint",                                                      roles: [Admin, Student, ComplaintHandler], code: 200, input: [],                                                                  output: Complaint,         side_effects: [] }
  - { method: POST,  path: "/complaints/{id}/assign-handler",                description: "Assign handler (OPEN→IN_REVIEW or ESCALATED→IN_REVIEW)",            roles: [Admin],            code: 200, input: [handler_id, handler_role],                                                          output: Complaint,         side_effects: ["status→IN_REVIEW; AuditLog (action=ASSIGN_HANDLER)"] }
  - { method: POST,  path: "/complaints/{id}/escalate",                      description: "Escalate (IN_REVIEW→ESCALATED)",                                     roles: [ComplaintHandler, Admin], code: 200, input: [],                                                                            output: Complaint,         side_effects: ["status→ESCALATED; level+=1; AuditLog (action=ESCALATE)"] }
  - { method: POST,  path: "/complaints/{id}/resolve",                       description: "Resolve (IN_REVIEW→RESOLVED)",                                       roles: [ComplaintHandler, Admin], code: 200, input: [response_text, resolution_summary],                                          output: Complaint,         side_effects: ["status→RESOLVED; AuditLog (action=RESOLVE)"] }
  - { method: POST,  path: "/complaints/{id}/reject",                        description: "Reject (IN_REVIEW→REJECTED)",                                        roles: [ComplaintHandler, Admin], code: 200, input: [response_text],                                                                output: Complaint,         side_effects: ["status→REJECTED; AuditLog (action=REJECT)"] }

  # --- Audit ---
  - { method: GET,   path: "/audit-logs",                                    description: "List audit logs filtered by entity_type and entity_id",              roles: [Admin],            code: 200, input: ["entity_type?", "entity_id?", "limit?", "offset?"],                                  output: "AuditLog[]",      side_effects: [] }

  # --- Test-driving control endpoints ---
  - { method: POST,  path: "/_clock/advance",                                description: "Advance the server clock by the given number of minutes (test-driving)", roles: [Admin],          code: 200, input: [minutes],                                                                            output: "object",          side_effects: ["clock_now += minutes; no records mutated"] }
  - { method: POST,  path: "/_sweep/run",                                    description: "Run all time-driven sweeps: appointment expiry → NO_SHOW; cycle resets",  roles: [Admin],          code: 200, input: [],                                                                                  output: "object",          side_effects: ["For each BOOKED PracticeAppointment with scheduled_end_at + NO_SHOW_GRACE_MINUTES < clock_now: status→NO_SHOW (no_show_fee computed; cascade Student SUSPENSION if threshold). For each BOOKED ExamAppointment expired: status→NO_SHOW. For each BOOKED SimulatorSession expired: status→NO_SHOW. For each Student whose cycle_start_date is at least CYCLE_DAYS days before clock_now: cycle_start_date=clock_now (which implicitly resets no_show_count_this_cycle and reschedule_count_this_cycle to 0)."] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- Auth / format ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,                http: 403, condition: "Role lacks permission for the operation" }
  - { id: ERR_INVALID_REQUEST,                          http: 400, condition: "Generic body shape error (missing required field, type mismatch)" }

  # --- Existence ---
  - { id: ERR_STUDENT_NOT_FOUND,    http: 404, condition: "Student id does not resolve" }
  - { id: ERR_INSTRUCTOR_NOT_FOUND, http: 404, condition: "Instructor id does not resolve" }
  - { id: ERR_VEHICLE_NOT_FOUND,    http: 404, condition: "Vehicle id does not resolve" }
  - { id: ERR_PACKAGE_NOT_FOUND,    http: 404, condition: "CoursePackage id does not resolve" }
  - { id: ERR_PRACTICE_NOT_FOUND,   http: 404, condition: "PracticeAppointment id does not resolve" }
  - { id: ERR_EXAM_NOT_FOUND,       http: 404, condition: "ExamAppointment id does not resolve" }
  - { id: ERR_SIMULATOR_NOT_FOUND,  http: 404, condition: "SimulatorSession id does not resolve" }
  - { id: ERR_COMPLAINT_NOT_FOUND,  http: 404, condition: "Complaint id does not resolve" }

  # --- Ownership / referential ---
  - { id: ERR_FORBIDDEN_NOT_OWNER,                  http: 403, condition: "Acting role is Student but X-User-ID does not match resource.student_id" }
  - { id: ERR_FORBIDDEN_NOT_ASSIGNED_INSTRUCTOR,    http: 403, condition: "Acting role is Instructor but X-User-ID != PracticeAppointment.instructor_id at check-in/check-out" }
  - { id: ERR_FORBIDDEN_NOT_ASSIGNED_HANDLER,       http: 403, condition: "Acting handler X-User-ID != Complaint.assigned_handler_id" }
  - { id: ERR_INSTRUCTOR_NOT_QUALIFIED,             http: 400, condition: "Instructor.vehicle_qualifications does not include the booking's Vehicle.vehicle_type" }
  - { id: ERR_VEHICLE_TYPE_MISMATCH,                http: 400, condition: "Vehicle.vehicle_type incompatible with the practice booking's training_stage rules (THEORY-stage students cannot book MOTORCYCLE_E or TRUCK_B2 vehicles)" }
  - { id: ERR_PREREQUISITE_STAGE_NOT_MET,           http: 400, condition: "Exam booked but Student.training_stage != prerequisite_stage for the exam_type, OR Student.has_passed_basic_practical=false when booking FINAL_TEST" }
  - { id: ERR_INSTRUCTOR_COMPLAINT_REQUIRES_ADMIN,  http: 400, condition: "Complaint.category=INSTRUCTOR_CONDUCT and assign-handler tries to set handler_role != Admin" }
  - { id: ERR_LEVEL3_REQUIRES_ADMIN,                http: 400, condition: "Complaint.level=3 and assign-handler tries to set handler_role != Admin" }

  # --- State ---
  - { id: ERR_STUDENT_NOT_ACTIVE,                   http: 409, condition: "Student.enrollment_status != ACTIVE for a booking operation" }
  - { id: ERR_STUDENT_NOT_AT_PENDING_STATE,         http: 409, condition: "Lifecycle endpoint called when Student.enrollment_status is not the expected pending value" }
  - { id: ERR_INSTRUCTOR_NOT_ACTIVE,                http: 409, condition: "Instructor.status != ACTIVE for booking" }
  - { id: ERR_VEHICLE_NOT_ACTIVE,                   http: 409, condition: "Vehicle.status != ACTIVE for booking or check-in" }
  - { id: ERR_APPOINTMENT_NOT_CANCELLABLE,          http: 409, condition: "PracticeAppointment.status != BOOKED at cancel/reschedule" }
  - { id: ERR_APPOINTMENT_NOT_CHECK_INNABLE,        http: 409, condition: "PracticeAppointment.status != BOOKED at check-in" }
  - { id: ERR_APPOINTMENT_NOT_CHECK_OUTTABLE,       http: 409, condition: "PracticeAppointment.status != IN_PROGRESS at check-out" }
  - { id: ERR_EXAM_NOT_BOOKABLE,                    http: 409, condition: "ExamAppointment.status != BOOKED at record-result/cancel" }
  - { id: ERR_SIMULATOR_NOT_BOOKED,                 http: 409, condition: "SimulatorSession.status != BOOKED at cancel/complete" }
  - { id: ERR_COMPLAINT_NOT_ASSIGNABLE,             http: 409, condition: "Complaint.status not in {OPEN, ESCALATED} at assign-handler" }
  - { id: ERR_COMPLAINT_NOT_RESOLVABLE,             http: 409, condition: "Complaint.status != IN_REVIEW at escalate/resolve/reject" }
  - { id: ERR_MEDICAL_CERT_EXPIRED,                 http: 409, condition: "medical_cert_expires_on <= clock_now at submit-medical-cert or sign-contract" }

  # --- Temporal ---
  - { id: ERR_INSTRUCTOR_TIME_CONFLICT,             http: 409, condition: "Instructor calendar (closed intervals) overlaps an existing booking" }
  - { id: ERR_VEHICLE_TIME_CONFLICT,                http: 409, condition: "Vehicle calendar (half-open + 15-min buffer) overlaps an existing booking" }
  - { id: ERR_OUTSIDE_CHECK_IN_WINDOW,              http: 409, condition: "check-in attempted before scheduled_start_at - 15 min or after scheduled_end_at" }

  # --- Safety ---
  - { id: ERR_INSTRUCTOR_DAILY_LIMIT_EXCEEDED,      http: 403, condition: "Instructor.working_minutes_today_provisional + new booking minutes > 480" }
  - { id: ERR_INSTRUCTOR_WEEKLY_LIMIT_EXCEEDED,     http: 403, condition: "Instructor.working_minutes_this_week + new booking minutes > 2400" }
  - { id: ERR_INSTRUCTOR_NEEDS_REST,                http: 403, condition: "Booking would result in this instructor working 7 distinct calendar dates within the proposed booking's ISO week" }

  # --- Constraint ---
  - { id: ERR_RESCHEDULE_LIMIT_EXCEEDED,            http: 409, condition: "Student.reschedule_count_this_cycle == 3 at reschedule" }
  - { id: ERR_RETAKE_LIMIT_EXCEEDED,                http: 409, condition: "ExamAppointment retake_index would exceed 3 for the same exam_type" }
  - { id: ERR_ESCALATION_LIMIT_REACHED,             http: 409, condition: "Complaint.level == 3 at escalate" }
  - { id: ERR_STAGE_MIN_HOURS_NOT_MET,              http: 409, condition: "Stage min hours not satisfied at exam booking time" }

  # --- Fiscal ---
  - { id: ERR_INSUFFICIENT_PACKAGE_BALANCE,         http: 402, condition: "minutes_remaining_provisional - proposed_minutes < 0 at practice booking" }
  - { id: ERR_NO_EXAM_ATTEMPTS_REMAINING,           http: 402, condition: "exam_attempts_remaining == 0 at exam booking" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Operational staff with full administrative privileges. Manages student lifecycle, scheduling, vehicles, packages, complaint assignment, and time/sweep test endpoints."
    identity: "opaque"
    exclusive_operations:
      - "POST /students"
      - "POST /students/{id}/verify-identity"
      - "POST /students/{id}/submit-medical-cert"
      - "POST /students/{id}/select-package"
      - "POST /students/{id}/sign-contract"
      - "POST /students/{id}/suspend"
      - "POST /students/{id}/reinstate"
      - "POST /students/{id}/submit-hours-to-authority"
      - "POST /instructors"
      - "POST /instructors/{id}/suspend"
      - "POST /instructors/{id}/reinstate"
      - "POST /vehicles"
      - "POST /vehicles/{id}/set-maintenance"
      - "POST /vehicles/{id}/restore-active"
      - "POST /course-packages"
      - "POST /exam-appointments"
      - "POST /exam-appointments/{id}/cancel"
      - "POST /simulator-sessions/{id}/complete"
      - "POST /complaints/{id}/assign-handler"
      - "GET /audit-logs"
      - "GET /vehicles/{id}"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "POST /practice-appointments — with Student"
      - "POST /practice-appointments/{id}/cancel — with Student"
      - "POST /practice-appointments/{id}/check-in — with Instructor"
      - "POST /practice-appointments/{id}/check-out — with Instructor"
      - "POST /practice-appointments/{id}/reschedule — with Student"
      - "POST /simulator-sessions — with Student"
      - "POST /simulator-sessions/{id}/cancel — with Student"
      - "POST /complaints — with Student"
      - "POST /complaints/{id}/escalate — with ComplaintHandler"
      - "POST /complaints/{id}/resolve — with ComplaintHandler"
      - "POST /complaints/{id}/reject — with ComplaintHandler"
      - "GET /students/{id}, GET /instructors/{id}, GET /complaints/{id}, GET /practice-appointments/{id}, GET /exam-appointments/{id}, GET /course-packages/{id}, GET /students/{id}/training-hours"

  - name: Student
    description: "Enrolled student. Self-service over their own appointments, complaints, and read of their own profile."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /practice-appointments (only with student_id == X-User-ID) — with Admin"
      - "POST /practice-appointments/{id}/cancel (only when appointment.student_id == X-User-ID) — with Admin"
      - "POST /practice-appointments/{id}/reschedule (only when appointment.student_id == X-User-ID) — with Admin"
      - "POST /simulator-sessions (only with student_id == X-User-ID) — with Admin"
      - "POST /simulator-sessions/{id}/cancel (only when session.student_id == X-User-ID) — with Admin"
      - "POST /complaints (only with student_id == X-User-ID) — with Admin"
      - "GET /students/{id} (only when id == X-User-ID), GET /complaints/{id} (only when complaint.student_id == X-User-ID), GET /practice-appointments/{id} (only when appointment.student_id == X-User-ID), GET /exam-appointments/{id} (only when exam.student_id == X-User-ID), GET /course-packages/{id}, GET /students/{id}/training-hours (only when id == X-User-ID)"

  - name: Instructor
    description: "Driving instructor. Authorized to check-in/check-out for the appointments they are assigned to."
    identity: "entity_backed:Instructor"
    exclusive_operations: []
    shared_operations:
      - "POST /practice-appointments/{id}/check-in (only when appointment.instructor_id == X-User-ID) — with Admin"
      - "POST /practice-appointments/{id}/check-out (only when appointment.instructor_id == X-User-ID) — with Admin"
      - "GET /instructors/{id} (only when id == X-User-ID), GET /practice-appointments/{id} (only when appointment.instructor_id == X-User-ID)"

  - name: Examiner
    description: "Examiner who records exam results. Opaque identity (not tied to a persisted entity in v1)."
    identity: "opaque"
    exclusive_operations:
      - "POST /exam-appointments/{id}/record-result"
    shared_operations:
      - "GET /exam-appointments/{id}"

  - name: ComplaintHandler
    description: "Tier-1/2 complaint handler for non-instructor-related complaints. Cannot handle Complaint.category=INSTRUCTOR_CONDUCT (those require Admin) and cannot handle Complaint.level=3 (also Admin-only)."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /complaints/{id}/escalate (only when X-User-ID == Complaint.assigned_handler_id) — with Admin"
      - "POST /complaints/{id}/resolve (only when X-User-ID == Complaint.assigned_handler_id) — with Admin"
      - "POST /complaints/{id}/reject (only when X-User-ID == Complaint.assigned_handler_id) — with Admin"
      - "GET /complaints/{id}"
