        distinguishing_aspect: |
          The non-linearity is a BRANCHING FORK-JOIN on ContentBundle, a different entity
          from the cyclic PriceChangeRequest: the technical branch (DRAFT -> VALIDATING ->
          VALIDATED, which writes validation_findings) and the accessibility branch (which
          writes accessibility_audit_state and leaves bundle.state at VALIDATED) advance
