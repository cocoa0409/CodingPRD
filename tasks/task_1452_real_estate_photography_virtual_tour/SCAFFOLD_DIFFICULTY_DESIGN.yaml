  # ===========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: photographer_committed_minutes_conserved_across_assign_unassign
        grounds:
          - entities.Photographer.fields.committed_minutes_by_day
          - state_machines.ShootBooking.READY_to_ASSIGNED
          - state_machines.ShootBooking.ASSIGNED_to_READY (unassign)
          - calculations.photographer_overlap_check
        distinguishing_aspect: |
          Conserved quantity #1: photographer day-minutes. For any sequence of assign
          followed by its compensating unassign (or cancel), the photographer's
          committed_minutes_by_day for that day MUST return exactly to its prior
          value — no drift — and a subsequent capacity check at the old boundary
          behaves identically to before the pair.
        test_recipe:
          setup:
            - "Market DEN travel_buffer_minutes=0; photographer P max_shoot_minutes_per_day=120; agent A"
            - "Booking B1 (60 min, 2026-08-10T08:00:00Z) assigned to P -> day=60"
            - "Booking B2 (60 min, 2026-08-10T10:00:00Z) assigned to P -> day=120"
            - "Unassign B2 -> day must return to 60"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
