# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Boutique Fitness Class Pass — Expert tier.
# 9 rule_ids × 2 instances = 18 instances. Every grounds:/call resolves to
# SCAFFOLD.yaml §1.1–§1.7. Formula-derived asserts are precomputed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_membership_prorated_vs_pack_no_refund
        grounds:
          - calculations.cancellation_refund
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - entities.Membership.fields.refund_cents
          - entities.PackagePlan.fields.kind
        distinguishing_aspect: |
          Same cancel action on the Membership domain yields a positive prorated
          refund_cents for a MEMBERSHIP plan but exactly 0 for a CREDIT_PACK plan —
          two valid refund algorithms keyed on plan.kind, both on Membership.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "One MEMBERSHIP plan price 8000c, validity 30d; one CREDIT_PACK plan price 8000c, validity 30d."
            - "Member m1 with an ACTIVE membership on the MEMBERSHIP plan; member m2 with an ACTIVE membership on the CREDIT_PACK plan; both captured at 2026-06-01."
            - "Clock advanced to 2026-06-10T00:00:00Z (9 whole days elapsed, no freeze)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /package-plans"
              payload: { name: "Monthly Unlimited", kind: "MEMBERSHIP", price_cents: 8000, grant_credits: 20, validity_days: 30, rollover_cap: 8, freeze_max_days: 14 }
              as: NetworkAdmin
              captures: { mem_plan_id: $.data.id }
            - call: "POST /package-plans"
              payload: { name: "20 Pack", kind: "CREDIT_PACK", price_cents: 8000, grant_credits: 20, validity_days: 30 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M Two", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${mem_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /members/${m2_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub2_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /memberships/${sub1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { refund1: $.data.refund_cents }
            - call: "POST /memberships/${sub2_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
              captures: { refund2: $.data.refund_cents }
          assert:
            - "Membership.${sub1_id}.refund_cents == 5600"   # 8000 * (30-9)/30 = 8000*0.7
            - "Membership.${sub1_id}.status == CANCELLED"
            - "Membership.${sub2_id}.refund_cents == 0"       # CREDIT_PACK non-refundable
            - "Membership.${sub2_id}.status == CANCELLED"

      - name: fee_late_cancel_base_vs_no_show_base
        grounds:
          - calculations.late_fee_assessment
          - state_machines.Reservation.BOOKED_to_RELEASED
          - state_machines.ClassSession.OPEN_to_COMPLETED
          - entities.FeeCharge.fields.amount_cents
        distinguishing_aspect: |
          The fee calculation produces a different base on a different entity domain
          (Reservation/FeeCharge): a first late-cancel costs 1500c while a first
          no-show costs 2500c, both at prior_strikes==0 (surcharge 0). Distinct from
          the Membership-refund dual variant.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; template late_cancel_window_hours=12, credit_cost=5."
            - "Two members m1,m2 each with an ACTIVE CREDIT_PACK (grant 20)."
            - "Two single-seat sessions s1 (starts 2026-06-02T10:00Z) and s2 (starts 2026-06-02T10:00Z) in different rooms, each OPEN with m1 BOOKED on s1 and m2 BOOKED on s2."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room B", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_b: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ino", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_b: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow", duration_min: 60, credit_cost: 5, late_cancel_window_hours: 12 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /package-plans"
              payload: { name: "20 Pack", kind: "CREDIT_PACK", price_cents: 8000, grant_credits: 20, validity_days: 60 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M Two", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /members/${m2_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub2_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-02T10:00:00Z", seat_capacity: 1 }
              as: StudioManager
              captures: { s1_id: $.data.id }
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_b}", instructor_id: "${inst_b}", template_id: "${tmpl_id}", starts_at: "2026-06-02T10:00:00Z", seat_capacity: 1 }
              as: StudioManager
              captures: { s2_id: $.data.id }
            - call: "POST /sessions/${s1_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s1_v: $.data.version }
            - call: "POST /sessions/${s2_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s2_v: $.data.version }
            - call: "POST /sessions/${s1_id}/reservations"
              payload: { membership_id: "${sub1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /sessions/${s2_id}/reservations"
              payload: { membership_id: "${sub2_id}", expected_session_version: "${s2_v}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T03:00:00Z" }
              as: NetworkAdmin
            - call: "POST /reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T11:30:00Z" }
              as: NetworkAdmin
            - call: "POST /_ops/run_completion"
              payload: {}
              as: NetworkAdmin
          assert:
            - "FeeCharge for r1 has kind == LATE_CANCEL and amount_cents == 1500"   # base 1500 + surcharge 0 (prior_strikes 0)
            - "FeeCharge for r2 has kind == NO_SHOW and amount_cents == 2500"        # base 2500 + surcharge 0
            - "Reservation.${r1_id}.attendance_status == LATE_CANCELLED"
            - "Reservation.${r2_id}.attendance_status == NO_SHOW"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: late_fee_tiered_surcharge_three_inputs
        grounds:
          - calculations.late_fee_assessment
          - calculations.member_standing_strike
          - state_machines.Reservation.BOOKED_to_RELEASED
          - entities.FeeCharge.fields.amount_cents
        distinguishing_aspect: |
          Mode (a): amount_cents = base(kind) + surcharge(prior_strikes tier) — three
          inputs (event kind, base constant, member's prior strike count) with a
          tiered branch; a second late-cancel at prior_strikes==2 yields 1500+1000=2500,
          not the 1500 a first offence yields.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; template late_cancel_window_hours=12, credit_cost=5."
            - "Member m1 with ACTIVE CREDIT_PACK (grant 30) already carrying no_show_strikes==2 from two prior NO_SHOW fees."
            - "A single-seat session s3 (starts 2026-06-05T10:00Z) OPEN with m1 BOOKED."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow", duration_min: 60, credit_cost: 5, late_cancel_window_hours: 12 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /package-plans"
              payload: { name: "30 Pack", kind: "CREDIT_PACK", price_cents: 9000, grant_credits: 30, validity_days: 60 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            # build two prior NO_SHOWs (strikes -> 2): two single-seat sessions completed with m1 booked, never cancelled
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-02T08:00:00Z", seat_capacity: 1 }
              as: StudioManager
              captures: { sp1_id: $.data.id }
            - call: "POST /sessions/${sp1_id}/publish"
              payload: {}
              as: StudioManager
              captures: { sp1_v: $.data.version }
            - call: "POST /sessions/${sp1_id}/reservations"
              payload: { membership_id: "${sub1_id}", expected_session_version: "${sp1_v}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-03T08:00:00Z", seat_capacity: 1 }
              as: StudioManager
              captures: { sp2_id: $.data.id }
            - call: "POST /sessions/${sp2_id}/publish"
              payload: {}
              as: StudioManager
              captures: { sp2_v: $.data.version }
            - call: "POST /sessions/${sp2_id}/reservations"
              payload: { membership_id: "${sub1_id}", expected_session_version: "${sp2_v}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T09:30:00Z" }
              as: NetworkAdmin
            - call: "POST /_ops/run_completion"
              payload: {}
              as: NetworkAdmin
            # now strikes == 2; create the session under test
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-05T10:00:00Z", seat_capacity: 1 }
              as: StudioManager
              captures: { s3_id: $.data.id }
            - call: "POST /sessions/${s3_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s3_v: $.data.version }
            - call: "POST /sessions/${s3_id}/reservations"
              payload: { membership_id: "${sub1_id}", expected_session_version: "${s3_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /reservations/${r3_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          assert:
            - "Member.${m1_id}.no_show_strikes == 2 immediately BEFORE the late-cancel"
            - "FeeCharge for r3 has kind == LATE_CANCEL and amount_cents == 2500"   # base 1500 + tier2 surcharge 1000
            - "Reservation.${r3_id}.attendance_status == LATE_CANCELLED"

      - name: refund_rounding_order_pinned_single_final_round
        grounds:
          - calculations.cancellation_refund
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - entities.Membership.fields.refund_cents
        distinguishing_aspect: |
          Mode (b): refund_cents pins the rounding order — multiply price by the FULL
          precision ratio and round_half_up exactly once. price 10000c, 30-day cycle,
          10 days elapsed => 10000*(20/30)=6666.67 -> 6667; rounding the ratio first
          (0.67*10000=6700) is the wrong order and is rejected.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; MEMBERSHIP plan price 10000c, validity 30d."
            - "Member m1 with ACTIVE membership captured at 2026-06-01; no freeze."
            - "Clock advanced to 2026-06-11T00:00:00Z (exactly 10 whole days elapsed)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /package-plans"
              payload: { name: "Monthly", kind: "MEMBERSHIP", price_cents: 10000, grant_credits: 20, validity_days: 30, rollover_cap: 8, freeze_max_days: 14 }
              as: NetworkAdmin
              captures: { mem_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${mem_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /memberships/${sub1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { refund: $.data.refund_cents }
          assert:
            - "Membership.${sub1_id}.refund_cents == 6667"   # single final round; NOT 6700
            - "Membership.${sub1_id}.status == CANCELLED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: session_cyclic_open_full_open_via_promotion
        grounds:
          - state_machines.ClassSession.OPEN_to_FULL
          - state_machines.ClassSession.FULL_to_OPEN
          - calculations.waitlist_promotion
          - entities.ClassSession.fields.status
        distinguishing_aspect: |
          ClassSession is cyclic on the booking axis: OPEN->FULL when the only seat is
          taken, FULL->OPEN when a seat is released, then OPEN->FULL again when the
          promoted waitlister re-fills it. The same status field oscillates.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; single-seat session s OPEN; m1 BOOKED (=> FULL); m2 WAITLISTED."
            - "Both members hold ACTIVE CREDIT_PACK with >=5 credits; template credit_cost=5, late window 12h."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow", duration_min: 60, credit_cost: 5, late_cancel_window_hours: 12 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /package-plans"
              payload: { name: "20 Pack", kind: "CREDIT_PACK", price_cents: 8000, grant_credits: 20, validity_days: 60 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M Two", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /members/${m2_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub2_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-10T10:00:00Z", seat_capacity: 1, waitlist_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v1: $.data.version }
            - call: "POST /sessions/${s_id}/reservations"
              payload: { membership_id: "${sub1_id}", expected_session_version: "${s_v1}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /sessions/${s_id}"
              payload: {}
              as: StudioManager
              captures: { s_v_full: $.data.version }
            - call: "POST /sessions/${s_id}/reservations"
              payload: { membership_id: "${sub2_id}", expected_session_version: "${s_v_full}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          assert:
            - "ClassSession.${s_id}.status == FULL after m1 books (booked_count==seat_capacity==1)"
            - "Reservation.${r2_id}.booking_status == BOOKED after m1 cancel (auto-promoted)"
            - "ClassSession.${s_id}.status == FULL again (promotion re-filled the single seat)"
            - "Reservation.${r2_id}.credits_charged == 5 and Membership.${sub2_id}.credit_balance == 15"

      - name: reservation_parallel_booking_and_attendance_axes
        grounds:
          - state_machines.Reservation.BOOKED_to_BOOKED
          - entities.Reservation.fields.booking_status
          - entities.Reservation.fields.attendance_status
        distinguishing_aspect: |
          Reservation evolves two independent dimensions: check_in advances
          attendance_status PENDING->CHECKED_IN while booking_status stays BOOKED —
          the attendance axis moves without touching the seat-holding axis.
        test_recipe:
          setup:
            - "Clock 2026-06-10T08:30:00Z (>= starts_at - CHECKIN_LEAD_HOURS=2h for a 10:00 session)."
            - "Session s OPEN with m1 BOOKED, attendance PENDING; template credit_cost=5."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
