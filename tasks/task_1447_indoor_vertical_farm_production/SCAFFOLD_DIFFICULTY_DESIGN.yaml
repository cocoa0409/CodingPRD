  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tower_allocation_half_open_adjacency
        grounds:
          - state_machines.Tower
          - entities.TowerAllocation
          - endpoints."POST /farm/batches"
        distinguishing_aspect: |
          Semantics: half-open [from, to) intervals on Tower. Batch A occupies [2026-08-03T06:00,
          2026-08-24T06:00); batch B starting exactly at A's end (adjacency, gap = 0) is ACCEPTED,
          while batch C starting one minute earlier is rejected ERR_TOWER_INTERVAL_OVERLAP.
        test_recipe:
          setup:
            - "Crop KALE-01 ACTIVE recipe (21d); rack R-01 with tower t1; batch A PLANNED with planned_seed_at 2026-08-03T06:00:00Z (allocation [2026-08-03T06:00, 2026-08-24T06:00))"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 3 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id" } }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}"], planned_seed_at: "2026-08-03T06:00:00Z" }, as: Grower, captures: { bA: "$.data.id" } }
          trigger:
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}"], planned_seed_at: "2026-08-24T06:00:00Z" }, as: Grower, captures: { bB: "$.data.id" } }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}"], planned_seed_at: "2026-08-24T05:59:00Z" }, as: Grower, captures: { err: "$.data.error_id" } }
          assert:
            - "batch B at exactly A's interval end: created 201 (half-open adjacency is allowed, gap = 0)"
            - "batch C one minute earlier: error_id == ERR_TOWER_INTERVAL_OVERLAP (422)"
            - "Tower.${t1} still shows exactly two ACTIVE allocations afterwards (A and B)"

      - name: sanitation_closed_interval_with_buffer
        grounds:
          - validations[priority=9]
          - calculations.sanitation_schedule
          - endpoints."POST /farm/sanitation-cycles"
        distinguishing_aspect: |
          Semantics: CLOSED intervals plus a mandatory 4h buffer on SanitationCycle (vs the
          half-open tower semantics above). A cycle starting exactly at the predecessor's end
          conflicts (closed intervals share the endpoint); a start 3h59m after end violates the
          buffer; a start exactly 4h after end satisfies it.
        test_recipe:
          setup:
            - "Loop WL-A; cycle CY1 SCHEDULED [2026-08-10T08:00, 2026-08-10T10:00] (closed)"
          setup_api_calls:
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-10T08:00:00Z", scheduled_end_at: "2026-08-10T10:00:00Z" }, as: SanitationLead, captures: { cy1: "$.data.id" } }
          trigger:
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-10T10:00:00Z", scheduled_end_at: "2026-08-10T12:00:00Z" }, as: SanitationLead, captures: { err_touch: "$.data.error_id" } }
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-10T13:59:00Z", scheduled_end_at: "2026-08-10T15:59:00Z" }, as: SanitationLead, captures: { err_buffer: "$.data.error_id" } }
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-10T14:00:00Z", scheduled_end_at: "2026-08-10T16:00:00Z" }, as: SanitationLead, captures: { cy2: "$.data.id" } }
          assert:
            - "start == predecessor end (10:00): error_id == ERR_SANITATION_OVERLAP (closed intervals share the endpoint)"
            - "start 3h59m after end (13:59): error_id == ERR_SANITATION_OVERLAP (buffer 4h violated)"
            - "start exactly 4h after end (14:00): created 201 (buffer satisfied at equality)"

      - name: dock_day_aggregate_capacity_quota
        grounds:
          - calculations.dock_day_capacity
          - endpoints."POST /farm/shipments"
        distinguishing_aspect: |
          Semantics: aggregate daily quota (count <= 3 per ship_date), NOT interval arithmetic —
          three shipments with identical, fully-overlapping windows are accepted while a fourth
          with a disjoint window is rejected ERR_DOCK_CAPACITY_EXCEEDED; the resource is the
          calendar day, not the window geometry (third distinct semantics).
        test_recipe:
          setup:
            - "Batch packed 100.00 lb on 2026-08-24, RELEASED; contract CT1 ACTIVE (commitment 500)"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
