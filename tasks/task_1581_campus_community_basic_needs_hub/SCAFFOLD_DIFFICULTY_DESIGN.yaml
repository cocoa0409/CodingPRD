# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Campus & Community Basic Needs Hub
# §1.8 Test Targeting Index: 9 Difficulty Rules x 2 instances each.
# Every setup_api_calls / trigger chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.5.
# Logical clock default before any set_current_utc call: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-reading calculations on DIFFERENT
  # entity domains (GrantFund fiscal vs Client pantry points).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fund_remaining_committed_vs_cash_basis
        grounds:
          - calculations.fund_remaining
          - entities.GrantFund.fields.remaining_committed_basis
          - entities.GrantFund.fields.remaining_cash_basis
        distinguishing_aspect: |
          GrantFund domain: with identical data (allocated 500000, one APPROVED application
          of 150000, nothing disbursed) the committed_basis reading reports 350000 while the
          cash_basis reading reports 450000 — two valid algorithms, provably different outputs,
          and the approval gate uses only committed_basis.
        test_recipe:
          setup:
            - "GrantReviewer staff and IntakeCoordinator staff exist"
            - "Client is ACTIVE with a VERIFIED assessment"
            - "GrantFund allocated_cents=500000; one application APPROVED with approved_cents=150000"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "R Re", email: "rev@hub.test", staff_role: "GRANT_REVIEWER" }
              as: HubAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "river", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 50000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /grant-funds"
              payload: { fund_name: "Emergency FY26", fiscal_year: 2026, allocated_cents: 500000 }
              as: HubAdmin
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /clients/${c_id}/grant-applications"
              payload: { fund_id: "${f_id}", category: "RENT", requested_cents: 150000, hardship_statement: "eviction notice" }
              as: Client
              as_user_id: "${c_id}"
              captures: { g_id: $.data.id }
            - call: "POST /grant-applications/${g_id}/submit"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /grant-applications/${g_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "${rev_id}"
            - call: "POST /grant-applications/${g_id}/approve"
              payload: { expected_fund_version: "${f_v}" }
              as: GrantReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "GET /grant-funds/${f_id}"
              as: GrantReviewer
              as_user_id: "${rev_id}"
              captures: { committed: $.data.committed_cents, cash_basis: $.data.remaining_cash_basis, committed_basis: $.data.remaining_committed_basis }
          assert:
            - "GrantFund.${f_id}.committed_cents == 150000"
            - "GrantFund.${f_id}.disbursed_cents == 0"
            - "GrantFund.${f_id}.remaining_committed_basis == 350000"
            - "GrantFund.${f_id}.remaining_cash_basis == 450000"
            - "remaining_cash_basis - remaining_committed_basis == committed_cents (150000) — same data, two variants diverge"

      - name: points_balance_settled_vs_reserved_basis
        grounds:
          - calculations.pantry_points
          - entities.Client.fields.pantry_points_spent_settled
          - entities.Client.fields.pantry_points_spent_reserved
          - entities.PantryVisit.fields.provisional_points
        distinguishing_aspect: |
          Client/pantry domain (distinct from the GrantFund fiscal instance): while a visit is
          CHECKED_IN with 20 provisional points, the settled basis reports 0 spent and the
          reserved basis reports 20 spent — same underlying data, two valid readings; after
          checkout both bases converge to 20, proving variant selection is context-dependent.
        test_recipe:
          setup:
            - "PantryStaff and IntakeCoordinator staff exist"
            - "Client ACTIVE with VERIFIED assessment household_size=1 (weekly allotment 30)"
            - "PantryItem point_cost=10, stock 10"
            - "One CHECKED_IN visit holding one line item of quantity 2 (20 provisional points)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "P Pa", email: "pantry@hub.test", staff_role: "PANTRY_STAFF" }
              as: HubAdmin
              captures: { ps_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "moss", contact_channel: "SMS", population_type: "ENROLLED_STUDENT", enrolled_credits: 12 }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 90000, housing_status: "COST_BURDENED", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 2, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /pantry-items"
              payload: { item_name: "Rice 1lb", category: "SHELF_STABLE", point_cost: 10, quantity_on_hand: 10, reorder_threshold: 0, per_visit_limit: 5 }
              as: HubAdmin
              captures: { i_id: $.data.id }
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { v_id: $.data.id }
            - call: "POST /pantry-visits/${v_id}/line-items"
              payload: { item_id: "${i_id}", quantity: 2 }
              as: PantryStaff
              as_user_id: "${ps_id}"
          trigger:
            - call: "GET /clients/${c_id}"
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { settled_mid: $.data.pantry_points_spent_settled, reserved_mid: $.data.pantry_points_spent_reserved }
            - call: "POST /pantry-visits/${v_id}/checkout"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
            - call: "GET /clients/${c_id}"
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { settled_end: $.data.pantry_points_spent_settled, reserved_end: $.data.pantry_points_spent_reserved }
          assert:
            - "mid-visit: Client.${c_id}.pantry_points_spent_settled == 0"
            - "mid-visit: Client.${c_id}.pantry_points_spent_reserved == 20"
            - "mid-visit: PantryVisit.${v_id}.provisional_points == 20 and points_spent == 0"
            - "after checkout: pantry_points_spent_settled == 20 and pantry_points_spent_reserved == 20 (variants converge)"
            - "after checkout: PantryVisit.${v_id}.points_spent == 20 and provisional_points == 0"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: instance 1 is mode (b) nested rounding with
  # pinned order (SNAP estimate); instance 2 is mode (a) >=3 inputs with tiered
  # table + conditional branch (eligibility band). Different modes.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: snap_estimate_pinned_step_rounding
        grounds:
          - calculations.snap_benefit_estimate
          - entities.BenefitsScreening.fields.snap_estimate_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned per-step order (round_half_up the 20% earned
          deduction, floor the half-adjusted shelter offset, ceil the 30% share) yields
          19205 cents for hh=2 / gross 150002 / earned 77777 / shelter 0; compute-all-then-round
          yields 19206 — the scaffold pins the per-step order so the value is well-defined.
        test_recipe:
          setup:
            - "Client ACTIVE with VERIFIED assessment: household_size=2, monthly_income_cents=150002, earned_income_cents=77777, shelter_cost_cents=0, housing COST_BURDENED, food_insecurity_score=3"
            - "One ACTIVE BenefitsCounselor exists so the screening can be assigned"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "B Be", email: "bene@hub.test", staff_role: "BENEFITS_COUNSELOR" }
              as: HubAdmin
              captures: { couns_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "fern", contact_channel: "PHONE", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 2, monthly_income_cents: 150002, earned_income_cents: 77777, shelter_cost_cents: 0, housing_status: "COST_BURDENED", dependents_under_18: 1, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 3, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/screenings"
              payload: { program: "SNAP" }
              as: BenefitsCounselor
              as_user_id: "${couns_id}"
              captures: { s_id: $.data.id, s_counselor: $.data.counselor_id }
          trigger:
            - call: "POST /screenings/${s_id}/score"
              payload: {}
              as: BenefitsCounselor
              as_user_id: "${s_counselor}"
              captures: { est: $.data.snap_estimate_cents, sc: $.data.score, band: $.data.result_band }
          assert:
            - "BenefitsScreening.${s_id}.snap_estimate_cents == 19205"
            - "derivation check: earned_ded=15555, adjusted=114647, excess_shelter=0, net=114647, ceil(114647*0.3)=34395, 53600-34395=19205 (round_half_up would give 34394 -> 19206; the pinned ceil rule is what makes 19205 correct)"
            - "BenefitsScreening.${s_id}.score == 54"
            - "BenefitsScreening.${s_id}.result_band == POSSIBLY_ELIGIBLE"

      - name: eligibility_band_tiered_table_with_homeless_override
        grounds:
          - calculations.eligibility_band
          - entities.IntakeAssessment.fields.eligibility_band
          - entities.IntakeAssessment.fields.income_ratio
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: the band is chosen from a
          household-keyed threshold table with tiered ratio cutoffs (1.30 / 2.00, inclusive)
          AND a conditional branch on housing_status==HOMELESS that overrides the ratio
          entirely — income 900000 with HOMELESS bands FULL while income 163200 with STABLE
          bands PARTIAL, and 163100 vs 163200 straddle the 1.30 boundary by one hundred cents.
        test_recipe:
          setup:
            - "IntakeCoordinator exists; three clients each hold a SUBMITTED assessment"
            - "A: hh=1 income 163100 STABLE -> ratio 1.2996 -> FULL (just inside 1.30)"
            - "B: hh=1 income 900000 HOMELESS -> ratio 7.1713 -> FULL via homeless override"
            - "C: hh=1 income 163200 STABLE -> ratio 1.3004 -> PARTIAL (just outside 1.30)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "aa", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { ca_id: $.data.id }
            - call: "POST /clients/${ca_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 163100, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 0, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { aa_id: $.data.id }
            - call: "POST /clients/${ca_id}/assessments/${aa_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients"
              payload: { alias_name: "bb", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { cb_id: $.data.id }
            - call: "POST /clients/${cb_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 900000, housing_status: "HOMELESS", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 6, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { ab_id: $.data.id }
            - call: "POST /clients/${cb_id}/assessments/${ab_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients"
              payload: { alias_name: "cc", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { cc_id: $.data.id }
            - call: "POST /clients/${cc_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 163200, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 0, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { ac_id: $.data.id }
            - call: "POST /clients/${cc_id}/assessments/${ac_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /assessments"
              payload: { client_id: "${ca_id}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { band_a: "$.data[0].eligibility_band", ratio_a: "$.data[0].income_ratio" }
            - call: "GET /assessments"
              payload: { client_id: "${cb_id}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { band_b: "$.data[0].eligibility_band", ratio_b: "$.data[0].income_ratio" }
            - call: "GET /assessments"
              payload: { client_id: "${cc_id}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { band_c: "$.data[0].eligibility_band", ratio_c: "$.data[0].income_ratio" }
          assert:
            - "Assessment.${aa_id}.income_ratio == 1.2996 and eligibility_band == FULL"
            - "Assessment.${ab_id}.income_ratio == 7.1713 and eligibility_band == FULL (HOMELESS override beats the ratio)"
            - "Assessment.${ac_id}.income_ratio == 1.3004 and eligibility_band == PARTIAL (100 cents of income flips the band)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: revision cycle on EmergencyGrantApplication
  # vs capacity-driven OPEN<->FULL cycle on OutreachEvent (different entities).
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: grant_info_request_resubmission_cycle
        grounds:
          - state_machines.EmergencyGrantApplication.UNDER_REVIEW_to_MORE_INFO_REQUESTED
          - state_machines.EmergencyGrantApplication.MORE_INFO_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          EmergencyGrantApplication runs a non-linear revision loop: UNDER_REVIEW ->
          MORE_INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW again; the resubmission clears
          reviewed_by so the re-entered application is reviewable fresh, and the loop
          preserves fund accounting (committed_cents untouched until approval).
        test_recipe:
          setup:
            - "Client ACTIVE with VERIFIED assessment; GrantFund 500000 OPEN; GrantReviewer exists"
            - "Application reached UNDER_REVIEW with reviewed_by = the reviewer"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "R Re", email: "rev@hub.test", staff_role: "GRANT_REVIEWER" }
              as: HubAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "wren", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 2, monthly_income_cents: 120000, housing_status: "UNSTABLE", dependents_under_18: 1, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 4, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /grant-funds"
              payload: { fund_name: "FY26", fiscal_year: 2026, allocated_cents: 500000 }
              as: HubAdmin
              captures: { f_id: $.data.id }
            - call: "POST /clients/${c_id}/grant-applications"
              payload: { fund_id: "${f_id}", category: "UTILITY", requested_cents: 80000, hardship_statement: "shutoff notice" }
              as: Client
              as_user_id: "${c_id}"
              captures: { g_id: $.data.id }
            - call: "POST /grant-applications/${g_id}/submit"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /grant-applications/${g_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /grant-applications/${g_id}/request-info"
              payload: { info_request_notes: "need current lease" }
              as: GrantReviewer
              as_user_id: "${rev_id}"
              captures: { st1: $.data.status }
            - call: "POST /grant-applications/${g_id}/submit"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { st2: $.data.status, rb2: $.data.reviewed_by }
            - call: "POST /grant-applications/${g_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "${rev_id}"
              captures: { st3: $.data.status, rb3: $.data.reviewed_by }
            - call: "GET /grant-funds/${f_id}"
              as: GrantReviewer
              as_user_id: "${rev_id}"
              captures: { committed: $.data.committed_cents }
          assert:
            - "after request-info: status == MORE_INFO_REQUESTED and info_request_notes == 'need current lease'"
            - "after resubmit: status == SUBMITTED and reviewed_by is null (cycle cleared the claim)"
            - "after second begin-review: status == UNDER_REVIEW and reviewed_by == ${rev_id}"
            - "fund untouched by the loop: GrantFund.${f_id}.committed_cents == 0"

      - name: event_open_full_open_capacity_cycle
        grounds:
          - state_machines.OutreachEvent.OPEN_to_FULL
          - state_machines.OutreachEvent.FULL_to_OPEN
          - state_machines.EventRegistration.CANCELLED_to_REGISTERED
        distinguishing_aspect: |
          OutreachEvent oscillates OPEN -> FULL -> OPEN -> FULL purely from registration/
          cancellation side effects (registered_count hitting or dropping below capacity=1);
          the FULL wall rejects a registration with ERR_EVENT_FULL mid-cycle, and the freed
          seat is re-claimable afterwards — a capacity-driven cycle, structurally distinct
          from the grant revision loop.
        test_recipe:
          setup:
            - "Two ACTIVE clients with VERIFIED assessments"
            - "OutreachEvent capacity=1, status OPEN, event_date in the future"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "oak", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /clients/${c1_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 60000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /clients/${c1_id}/assessments/${a1_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c1_id}/assessments/${a1_id}/verify"
              payload: { expected_client_version: "${c1_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients"
              payload: { alias_name: "elm", contact_channel: "NONE", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c2_id: $.data.id, c2_v: $.data.version }
            - call: "POST /clients/${c2_id}/assessments"
              payload: { household_size: 3, monthly_income_cents: 200000, housing_status: "COST_BURDENED", dependents_under_18: 2, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 2, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /clients/${c2_id}/assessments/${a2_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c2_id}/assessments/${a2_id}/verify"
              payload: { expected_client_version: "${c2_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /outreach-events"
              payload: { title: "Pantry 101", event_date: "2026-08-20T17:00:00Z", capacity: 1, stigma_theme: "NORMALIZATION" }
              as: HubAdmin
              captures: { e_id: $.data.id }
            - call: "POST /outreach-events/${e_id}/open"
              payload: {}
