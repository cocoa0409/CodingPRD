              payload: {}
              as: BureauAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /engagements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BureauAdmin
              captures: { e5: $.data.error_id }
