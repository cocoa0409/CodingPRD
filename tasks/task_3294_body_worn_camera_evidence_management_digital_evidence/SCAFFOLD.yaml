    path: "/agencies/{agencyId}/cases/{caseId}/evidence/{linkId}"
    description: "Unlink evidence (case must be OPEN and have no ACTIVE share grants)"
    roles: [Officer, Supervisor]
    code: 200
    input: []
    output: CaseEvidenceLink
    side_effects: ["link -> UNLINKED with unlinked_at; case rollups recomputed; recording legal_hold_count recomputed; CustodyEvent CASE_UNLINKED"]

  # --- RedactionJob ---
  - method: POST
    path: "/agencies/{agencyId}/recordings/{recordingId}/redaction-jobs"
    description: "Create a redaction job on an ACTIVE recording; estimated_minutes computed per redaction_effort_minutes"
    roles: [RecordsOfficer, RedactionTechnician]
    code: 201
    input: [request_reference, scope_face, scope_audio, passes]
    output: RedactionJob
    side_effects: ["status = QUEUED; estimated_minutes computed"]

  - method: POST
    path: "/agencies/{agencyId}/redaction-jobs/{jobId}/start"
    description: "QUEUED or RETURNED -> IN_PROGRESS (RETURNED restart clears actual_minutes)"
    roles: [RedactionTechnician]
    code: 200
    input: []
    output: RedactionJob
    side_effects: ["CustodyEvent REDACTION_STARTED (from QUEUED)"]

  - method: POST
    path: "/agencies/{agencyId}/redaction-jobs/{jobId}/submit"
    description: "IN_PROGRESS -> SUBMITTED with technician-reported actual_minutes"
    roles: [RedactionTechnician]
    code: 200
    input: [actual_minutes]
    output: RedactionJob
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/redaction-jobs/{jobId}/approve"
    description: "SUBMITTED -> APPROVED; approver must differ from submitting technician (segregation of duties)"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: RedactionJob
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/redaction-jobs/{jobId}/return"
    description: "SUBMITTED -> RETURNED (revision loop)"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: RedactionJob
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/redaction-jobs/{jobId}/release"
    description: "APPROVED -> RELEASED; recording must still be ACTIVE"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: RedactionJob
    side_effects: ["CustodyEvent REDACTION_RELEASED; AuditLogEntry REDACTION_RELEASED"]

  - method: POST
    path: "/agencies/{agencyId}/redaction-jobs/{jobId}/cancel"
    description: "QUEUED/IN_PROGRESS/RETURNED -> CANCELLED"
    roles: [RedactionTechnician, RecordsOfficer]
    code: 200
    input: []
    output: RedactionJob
    side_effects: []

