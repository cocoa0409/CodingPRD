            - "LucDetermination.${det1}.status == SUPERSEDED"
            - "LucDetermination.${det2}.status == ACTIVE"
            - "LucDetermination.${det2}.luc_cents == 7407"
            - "GET /political-ads/luc-determinations?election_id=${el}&status=ACTIVE returns total_count == 1"
            - "GET /political-ads/luc-determinations?election_id=${el} returns total_count == 2 in created_at ASC order"

