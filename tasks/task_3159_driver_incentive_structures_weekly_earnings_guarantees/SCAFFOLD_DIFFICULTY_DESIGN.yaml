            - call: "POST /incentive-programs/${zone}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${zone}/enrollments"
              payload: { driver_id: "${drv1}" }
              as: IncentiveOps
              captures: { enr1: $.data.id }
          trigger:
            - call: "POST /drivers/${drv1}/rate-events"
              payload: { events: [{type: "OFFER_ACCEPTED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}, {type: "OFFER_DECLINED"}] }
