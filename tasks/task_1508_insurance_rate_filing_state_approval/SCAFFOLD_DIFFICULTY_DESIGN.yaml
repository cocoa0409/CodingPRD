# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1508_insurance_rate_filing_state_approval
# 20 instances across the nine Difficulty Rules (§0.5).
# Canonical fixture timeline (unless an instance overrides):
#   clock default 2026-08-01T00:00:00Z; CA profile = PRIOR_APPROVAL lead 45 /
#   sla 30 / deemer 60 / max 0.25 / notice 30 / disapproval window 90.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: indication_incurred_credibility_vs_paid_pure
        grounds:
          - calculations.indicated_rate_change
          - entities.RateIndication.fields.indicated_change_pct
          - entities.RateIndication.fields.alternate_change_pct
        distinguishing_aspect: |
          Same experience data on RateIndication yields opposite-signed indications
          under the two variants: INCURRED_CREDIBILITY = +0.1239 (developed incurred
          losses, credibility-blended with trended countrywide) vs PAID_PURE = -0.0441
          (raw paid-loss ratio). Entity domain: RateIndication (actuarial).
        test_recipe:
          setup:
            - "Empty DB; clock at default 2026-08-01T00:00:00Z"
            - "Product PPA exists"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind1_id: $.data.id, ind1_indicated: $.data.indicated_change_pct, ind1_alternate: $.data.alternate_change_pct }
            - call: "GET /products/${prod_id}"
              as: ProductActuary
              captures: { prod_v2: $.data.version }
          trigger:
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "PAID_PURE", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v2}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind2_id: $.data.id, ind2_indicated: $.data.indicated_change_pct, ind2_alternate: $.data.alternate_change_pct }
          assert:
            - "RateIndication.${ind1_id}.indicated_change_pct == 0.1239"
            - "RateIndication.${ind1_id}.alternate_change_pct == -0.0441"
            - "RateIndication.${ind2_id}.indicated_change_pct == -0.0441"
            - "RateIndication.${ind2_id}.alternate_change_pct == 0.1239"
            - "The two variants diverge in sign for identical inputs (0.1239 vs -0.0441)"

      - name: effective_date_prior_approval_vs_file_and_use
        grounds:
          - calculations.effective_date_resolution
          - state_machines.RateFiling.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Same proposed_effective_date (2026-10-01) and same approval instant
          (2026-09-01) produce different actual_effective_date by filing method:
          PRIOR_APPROVAL pushes to 2026-10-16 (approval + 45d lead), FILE_AND_USE
          keeps 2026-10-01 exactly. Entity domain: RateFiling (regulatory dating) —
          distinct from the RateIndication domain of the sibling instance.
        test_recipe:
          setup:
            - "Product PPA; CA profile PRIOR_APPROVAL; NV profile FILE_AND_USE; one LOCKED indication; one READY filing per state, both proposed 2026-10-01, both SUBMITTED at 2026-08-01"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "NV", filing_method: "FILE_AND_USE", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 0, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_ca: $.data.id }
            - call: "POST /filings/${fil_ca}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_ca: $.data.id }
            - call: "POST /components/${comp_ca}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_ca}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_ca}/submit"
              as: ComplianceOfficer
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "NV", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_nv: $.data.id }
            - call: "POST /filings/${fil_nv}/components"
              payload: { component_type: "RATE", name: "NV Base Rates", content_ref: "s3://fil/nv-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_nv: $.data.id }
            - call: "POST /components/${comp_nv}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_nv}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_nv}/submit"
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /filings/${fil_ca}/approve"
              as: StateRegulator
              captures: { ca_eff: $.data.actual_effective_date }
            - call: "POST /filings/${fil_nv}/approve"
              as: StateRegulator
              captures: { nv_eff: $.data.actual_effective_date }
          assert:
            - "RateFiling.${fil_ca}.actual_effective_date == '2026-10-16' (approval 2026-09-01 + 45d lead pushes past proposal)"
            - "RateFiling.${fil_nv}.actual_effective_date == '2026-10-01' (proposal kept exactly)"
            - "RateFiling.${fil_ca}.status == APPROVED and RateFiling.${fil_nv}.status == APPROVED"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: renewal_re_rate_per_policy_rounding_order
        grounds:
          - calculations.renewal_re_rate
        distinguishing_aspect: |
          Mode (b) nested rounding: premiums are rounded to whole cents PER POLICY
          before any book aggregation (50001 * 1.10 = 55001.1 -> 55001 at the policy
          row); an aggregate-then-round implementation cannot reproduce the pinned
          per-policy integers.
        test_recipe:
          setup:
            - "CA filing EFFECTIVE at 2026-10-16 with approved_change_pct 0.10; wave [2026-11-16, 2026-12-15] cap_pct 0.15; three PENDING policies PA/PB/PC"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /filings/${fil_id}/approve"
              as: StateRegulator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /filings/${fil_id}/mark-effective"
              as: ComplianceOfficer
            - call: "POST /policies"
              payload: { product_id: "${prod_id}", state_code: "CA", policy_number: "CA-5001", current_premium_cents: 50001, class_rel_factor: 1.0, renewal_effective_date: "2026-11-20" }
              as: ImplementationLead
              captures: { pa_id: $.data.id }
            - call: "POST /policies"
              payload: { product_id: "${prod_id}", state_code: "CA", policy_number: "CA-5002", current_premium_cents: 50001, class_rel_factor: 2.0, renewal_effective_date: "2026-11-25" }
              as: ImplementationLead
              captures: { pb_id: $.data.id }
            - call: "POST /policies"
              payload: { product_id: "${prod_id}", state_code: "CA", policy_number: "CA-5003", current_premium_cents: 150000, class_rel_factor: 1.5, renewal_effective_date: "2026-11-30" }
              as: ImplementationLead
              captures: { pc_id: $.data.id }
            - call: "POST /waves"
              payload: { filing_id: "${fil_id}", wave_start_date: "2026-11-16", wave_end_date: "2026-12-15", cap_pct: 0.15 }
              as: ImplementationLead
              captures: { wave_id: $.data.id }
          trigger:
            - call: "POST /waves/${wave_id}/release"
              as: ImplementationLead
            - call: "GET /policies/${pa_id}"
              as: ImplementationLead
            - call: "GET /policies/${pb_id}"
              as: ImplementationLead
            - call: "GET /policies/${pc_id}"
              as: ImplementationLead
          assert:
            - "RenewalPolicy.${pa_id}.raw_change_pct == 0.1 and raw_new_premium_cents == 55001 (50001 x 1.10 = 55001.1 rounded per policy)"
            - "RenewalPolicy.${pb_id}.raw_change_pct == 0.2 and raw_new_premium_cents == 60001 (60001.2 -> 60001)"
            - "RenewalPolicy.${pc_id}.raw_change_pct == 0.15 and raw_new_premium_cents == 172500"
            - "All three policies have status == RATED and wave_id == ${wave_id}"

      - name: wave_balance_factor_pinned_evaluation_order
        grounds:
          - calculations.wave_balance_factor
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the balance factor needs the capped
          book total, which needs per-policy caps, which need the approved change —
          the pinned six-step order yields balance_factor 0.97058824 and finals
          106765 / 223235 with residual 0; any other evaluation order drifts.
        test_recipe:
          setup:
            - "CA filing EFFECTIVE at 2026-10-16, approved_change_pct 0.10; wave [2026-11-16, 2026-12-15] cap_pct 0.15; policies P1 (100000, rel 1.0) and P2 (200000, rel 2.0)"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /filings/${fil_id}/approve"
              as: StateRegulator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /filings/${fil_id}/mark-effective"
              as: ComplianceOfficer
            - call: "POST /policies"
              payload: { product_id: "${prod_id}", state_code: "CA", policy_number: "CA-1001", current_premium_cents: 100000, class_rel_factor: 1.0, renewal_effective_date: "2026-11-20" }
              as: ImplementationLead
              captures: { p1_id: $.data.id }
            - call: "POST /policies"
              payload: { product_id: "${prod_id}", state_code: "CA", policy_number: "CA-1002", current_premium_cents: 200000, class_rel_factor: 2.0, renewal_effective_date: "2026-11-25" }
              as: ImplementationLead
              captures: { p2_id: $.data.id }
            - call: "POST /waves"
              payload: { filing_id: "${fil_id}", wave_start_date: "2026-11-16", wave_end_date: "2026-12-15", cap_pct: 0.15 }
              as: ImplementationLead
              captures: { wave_id: $.data.id }
          trigger:
            - call: "POST /waves/${wave_id}/release"
              as: ImplementationLead
              captures: { w_bf: $.data.balance_factor, w_tgt: $.data.target_book_delta_cents, w_fin: $.data.final_book_delta_cents }
            - call: "GET /policies/${p1_id}"
              as: ImplementationLead
            - call: "GET /policies/${p2_id}"
              as: ImplementationLead
          assert:
            - "ImplementationWave.${wave_id}.balance_factor == 0.97058824 (8dp round_half_up of 330000/340000)"
            - "ImplementationWave.${wave_id}.target_book_delta_cents == 30000"
            - "RenewalPolicy.${p1_id}.final_premium_cents == 106765"
            - "RenewalPolicy.${p2_id}.was_capped == true and final_premium_cents == 223235"
            - "ImplementationWave.${wave_id}.final_book_delta_cents == 30000 (residual 0)"

      - name: indication_credibility_blend_min_sqrt_branch
        grounds:
          - calculations.indicated_rate_change
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: credibility_z =
          min(1, sqrt(exposure/1082)) branches on the min — exposure 500 gives a
          partial blend (0.1239) while exposure 2000 hits full credibility and the
          countrywide complement drops out entirely (0.1529).
        test_recipe:
          setup:
            - "Product PPA only; two indications created with identical loss data but different exposure_units"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_low: $.data.id, low_indicated: $.data.indicated_change_pct }
            - call: "GET /products/${prod_id}"
              as: ProductActuary
              captures: { prod_v2: $.data.version }
          trigger:
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 2000, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v2}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_high: $.data.id, high_indicated: $.data.indicated_change_pct }
          assert:
            - "RateIndication.${ind_low}.indicated_change_pct == 0.1239 (Z = 0.6798 partial blend)"
            - "RateIndication.${ind_high}.indicated_change_pct == 0.1529 (Z = 1 clamps; pure experience indication 0.15294... rounded)"
            - "RateIndication.${ind_high}.credibility_z == 1 and RateIndication.${ind_low}.credibility_z < 1"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: objection_reopen_revision_cycle
        grounds:
          - state_machines.Objection.RESPONSE_SUBMITTED_to_REOPENED
          - state_machines.Objection.REOPENED_to_RESPONSE_DRAFTED
          - state_machines.RateFiling.UNDER_OBJECTION_to_SUBMITTED
        distinguishing_aspect: |
          Objection is a cyclic machine: RAISED -> RESPONSE_DRAFTED ->
          RESPONSE_SUBMITTED -> REOPENED -> RESPONSE_DRAFTED -> RESPONSE_SUBMITTED
          -> RESOLVED, with the filing oscillating SUBMITTED <-> UNDER_OBJECTION on
          each lap (a straight pipeline cannot express the reopen loop).
        test_recipe:
          setup:
            - "CA filing SUBMITTED at 2026-08-01; objection raised 2026-08-10T12:00:00Z (due 2026-09-09T12:00:00Z)"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /objections"
              payload: { filing_id: "${fil_id}", question_text: "Justify the trend factor." }
              as: StateRegulator
              captures: { obj_id: $.data.id, obj_v: $.data.version, obj_due: $.data.due_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /objections/${obj_id}/responses"
              payload: { response_text: "Trend support attached.", expected_objection_version: "${obj_v}" }
              as: FilingAnalyst
              captures: { resp1_id: $.data.id }
            - call: "POST /responses/${resp1_id}/submit"
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /objections/${obj_id}/reopen"
              as: StateRegulator
              captures: { obj_reopened: $.data.status, obj_reopen_count: $.data.reopen_count, obj_due2: $.data.due_at }
            - call: "GET /filings/${fil_id}"
              as: StateRegulator
              captures: { fil_status_mid: $.data.status }
            - call: "GET /objections/${obj_id}"
              as: StateRegulator
              captures: { obj_v2: $.data.version }
            - call: "POST /objections/${obj_id}/responses"
              payload: { response_text: "Additional exhibits attached.", expected_objection_version: "${obj_v2}" }
              as: FilingAnalyst
              captures: { resp2_id: $.data.id }
            - call: "POST /responses/${resp2_id}/submit"
              as: ComplianceOfficer
            - call: "POST /objections/${obj_id}/resolve"
              as: StateRegulator
              captures: { obj_final: $.data.status }
            - call: "GET /filings/${fil_id}"
              as: StateRegulator
              captures: { fil_status_end: $.data.status }
          assert:
            - "Objection.${obj_id} after reopen: status == REOPENED, reopen_count == 1, due_at == '2026-09-19T00:00:00Z' (reopen restarts the 30-day SLA from 2026-08-20)"
            - "RateFiling.${fil_id} after reopen: status == UNDER_OBJECTION (reopen drags the filing back)"
            - "Objection.${obj_id} final status == RESOLVED"
            - "RateFiling.${fil_id} final status == SUBMITTED (bubble-up once no objection remains open)"

      - name: indication_review_return_revision_cycle
        grounds:
          - state_machines.RateIndication.IN_ACTUARIAL_REVIEW_to_DRAFT
          - state_machines.RateIndication.DRAFT_to_IN_ACTUARIAL_REVIEW
        distinguishing_aspect: |
          RateIndication cycles DRAFT -> IN_ACTUARIAL_REVIEW -> DRAFT -> ... before
          reaching LOCKED; review_round counts the laps (2 after one return). A
          different entity than the objection cycle of the sibling instance.
        test_recipe:
          setup:
            - "Product PPA; one DRAFT indication"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id, ind_rr0: $.data.review_round }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
          trigger:
            - call: "POST /rate-indications/${ind_id}/return"
              as: ProductActuary
              as_user_id: "act-2"
              captures: { ind_status1: $.data.status, ind_rr1: $.data.review_round }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
              captures: { ind_final: $.data.status }
          assert:
            - "RateIndication.${ind_id} after return: status == DRAFT and review_round == 2 (incremented from 1)"
            - "RateIndication.${ind_id} final status == LOCKED after re-review, approve, lock"
            - "RateIndication.${ind_id} initial review_round was 1"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: post_effective_disapproval_rescission_cascade
        grounds:
          - state_machines.RateFiling.EFFECTIVE_to_DISAPPROVED
          - state_machines.ImplementationWave.RELEASED_to_REVERSED
          - state_machines.RenewalPolicy.NOTICE_SENT_to_RESCINDED
          - state_machines.ComplianceCalendarEntry.PENDING_to_WAIVED
        distinguishing_aspect: |
          Depth-3 cascade from the disapprove transition: filing EFFECTIVE ->
          DISAPPROVED forces the RELEASED wave to REVERSED (hop 2), which rescinds
          the NOTICE_SENT policy and restores its premium (hop 3), which waives the
          wave's pending calendar entries (hop 4 observable on the entry). Trigger:
          POST /filings/{id}/disapprove.
        test_recipe:
          setup:
            - "NV FILE_AND_USE filing EFFECTIVE 2026-10-01; wave [2026-11-16,2026-12-15] RELEASED with policy NV-3001 NOTICE_SENT (final 110000); clock 2026-10-05"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "NV", filing_method: "FILE_AND_USE", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 0, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "NV", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "NV Base Rates", content_ref: "s3://fil/nv-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /filings/${fil_id}/approve"
              as: StateRegulator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /filings/${fil_id}/mark-effective"
              as: ComplianceOfficer
            - call: "POST /policies"
              payload: { product_id: "${prod_id}", state_code: "NV", policy_number: "NV-3001", current_premium_cents: 100000, class_rel_factor: 1.0, renewal_effective_date: "2026-11-20" }
              as: ImplementationLead
              captures: { p1_id: $.data.id }
            - call: "POST /waves"
              payload: { filing_id: "${fil_id}", wave_start_date: "2026-11-16", wave_end_date: "2026-12-15", cap_pct: 0.15 }
              as: ImplementationLead
              captures: { wave_id: $.data.id }
            - call: "POST /waves/${wave_id}/release"
              as: ImplementationLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /policies/${p1_id}/send-notice"
              as: ImplementationLead
          trigger:
            - call: "POST /filings/${fil_id}/disapprove"
              as: StateRegulator
              captures: { fil_status: $.data.status }
            - call: "GET /waves/${wave_id}"
              as: ImplementationLead
              captures: { wave_status: $.data.status, wave_rated: $.data.rated_policy_count }
            - call: "GET /policies/${p1_id}"
              as: ImplementationLead
              captures: { p1_status: $.data.status, p1_premium: $.data.current_premium_cents }
            - call: "GET /calendar-entries"
              payload: { wave_id: "${wave_id}", entry_type: "WAVE_WINDOW" }
              as: ImplementationLead
              captures: { wave_window_entry_status: "$.data[0].status" }
          assert:
            - "RateFiling.${fil_id}.status == DISAPPROVED (hop 1)"
            - "ImplementationWave.${wave_id}.status == REVERSED and rated_policy_count == 0 (hop 2)"
            - "RenewalPolicy.${p1_id}.status == RESCINDED and current_premium_cents == 100000 restored from baseline (hop 3)"
            - "WAVE_WINDOW calendar entry of wave ${wave_id} == WAIVED (hop 4)"

      - name: mark_effective_supersede_deviation_chain
        grounds:
          - state_machines.RateFiling.APPROVED_to_EFFECTIVE
          - state_machines.RateFiling.EFFECTIVE_to_SUPERSEDED
          - state_machines.Deviation.APPROVED_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (mark-effective): the successor
          filing going EFFECTIVE supersedes the incumbent filing (hop 2), whose own
          supersession then supercedes its APPROVED deviation (hop 3) — entity A's
          transition mutates B, and B's mutation mutates C.
        test_recipe:
          setup:
            - "Filing A (CA) EFFECTIVE at 2026-10-16 with one APPROVED deviation; filing B APPROVED with actual_effective_date 2026-12-01; clock 2026-12-01"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fila_id: $.data.id }
            - call: "POST /filings/${fila_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { compa_id: $.data.id }
            - call: "POST /components/${compa_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${fila_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${fila_id}/submit"
              as: ComplianceOfficer
            - call: "POST /deviations"
              payload: { filing_id: "${fila_id}", deviation_type: "RATE_FACTOR", base_reference: "CW-TERR-REL", deviation_factor: 1.05, justification: "Wildfire load for CA territories" }
              as: FilingAnalyst
              captures: { dev_id: $.data.id }
            - call: "POST /deviations/${dev_id}/approve"
              as: StateRegulator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /filings/${fila_id}/approve"
              as: StateRegulator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /filings/${fila_id}/mark-effective"
              as: ComplianceOfficer
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.05, proposed_effective_date: "2026-12-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { filb_id: $.data.id }
            - call: "POST /filings/${filb_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates v2", content_ref: "s3://fil/ca-rate-v2.pdf" }
              as: FilingAnalyst
              captures: { compb_id: $.data.id }
            - call: "POST /components/${compb_id}/finalize"
              as: FilingAnalyst
            - call: "POST /filings/${filb_id}/mark-ready"
              as: FilingAnalyst
            - call: "POST /filings/${filb_id}/submit"
              as: ComplianceOfficer
            - call: "POST /filings/${filb_id}/approve"
              as: StateRegulator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /filings/${filb_id}/mark-effective"
              as: ComplianceOfficer
              captures: { filb_status: $.data.status }
            - call: "GET /filings/${fila_id}"
              as: ComplianceOfficer
              captures: { fila_status: $.data.status, fila_sup_at: $.data.superseded_at_date }
            - call: "GET /deviations/${dev_id}"
              as: ComplianceOfficer
              captures: { dev_status: $.data.status }
            - call: "GET /components/${compa_id}"
              as: ComplianceOfficer
              captures: { compa_status: $.data.status }
          assert:
            - "RateFiling.${filb_id}.status == EFFECTIVE (hop 1)"
            - "RateFiling.${fila_id}.status == SUPERSEDED with superseded_at_date == '2026-12-01' (hop 2)"
            - "Deviation.${dev_id}.status == SUPERSEDED (hop 3 — the incumbent's supersession, not the API call, retires the deviation)"
            - "FilingComponent.${compa_id}.status == SUPERSEDED (the incumbent's FINAL components follow it into supersession)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair state(6) vs business_temporal(9): a DRAFT filing
          whose proposed_effective_date also violates the 45-day lead must fail
          with ERR_INVALID_STATE, not ERR_EFFECTIVE_LEAD_VIOLATION.
        test_recipe:
          setup:
            - "CA filing in DRAFT with proposed_effective_date 2026-08-10 (violates lead: 2026-08-01 + 45d = 2026-09-15)"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.10, proposed_effective_date: "2026-08-10", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
          trigger:
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 6 outranks temporal priority 9)"
            - "HTTP status == 409"
            - "RateFiling.${fil_id}.status remains DRAFT"

      - name: submit_referential_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_DEVIATION_NOT_USABLE]
        distinguishing_aspect: |
          Error-category pair business_referential(8) vs business_fiscal(11): a
          READY filing carrying a WITHDRAWN deviation AND an over-ceiling
          proposed_change_pct (0.30 > 0.25) must fail with
          ERR_DEVIATION_NOT_USABLE, not ERR_CHANGE_EXCEEDS_MAX. A different
          category pair than the sibling instance.
        test_recipe:
          setup:
            - "CA filing READY with proposed_change_pct 0.30 (over max 0.25) and one WITHDRAWN deviation"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
              as: ProductActuary
              as_user_id: "act-1"
            - call: "POST /rate-indications/${ind_id}/approve"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /rate-indications/${ind_id}/lock"
              as: ProductActuary
              as_user_id: "act-2"
            - call: "POST /filings"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_type: "RATE_CHANGE", proposed_change_pct: 0.30, proposed_effective_date: "2026-10-01", indication_id: "${ind_id}" }
              as: FilingAnalyst
              captures: { fil_id: $.data.id }
            - call: "POST /filings/${fil_id}/components"
              payload: { component_type: "RATE", name: "CA Base Rates", content_ref: "s3://fil/ca-rate.pdf" }
              as: FilingAnalyst
              captures: { comp_id: $.data.id }
            - call: "POST /components/${comp_id}/finalize"
              as: FilingAnalyst
            - call: "POST /deviations"
              payload: { filing_id: "${fil_id}", deviation_type: "RULE_TEXT", base_reference: "CW-RULE-9", deviation_factor: 1.0, justification: "State-mandated wording" }
              as: FilingAnalyst
              captures: { dev_id: $.data.id }
            - call: "POST /deviations/${dev_id}/withdraw"
              as: FilingAnalyst
            - call: "POST /filings/${fil_id}/mark-ready"
              as: FilingAnalyst
          trigger:
            - call: "POST /filings/${fil_id}/submit"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DEVIATION_NOT_USABLE (referential priority 8 outranks fiscal priority 11)"
            - "HTTP status == 409"
            - "RateFiling.${fil_id}.status remains READY"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: cap_boundary_raw_equals_cap_not_capped
        grounds:
          - calculations.renewal_re_rate
          - entities.RenewalPolicy.fields.was_capped
        distinguishing_aspect: |
          Metric: percentage threshold. raw_change_pct == cap_pct (0.1500 == 0.15)
          must NOT cap (strictly-greater rule): the boundary policy keeps
          was_capped == false and raw_new 115000, while the 0.1510 policy one tick
          above is capped to 115000. Endpoint: POST /waves/{waveId}/release.
        test_recipe:
          setup:
            - "CA filing EFFECTIVE 2026-10-16 (approved 0.10); wave [2026-11-16,2026-12-15] cap 0.15; P_at rel 1.5 (raw exactly 0.1500), P_over rel 1.51 (raw 0.1510)"
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "PPA", name: "Personal Auto" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /state-profiles"
              payload: { product_id: "${prod_id}", state_code: "CA", filing_method: "PRIOR_APPROVAL", min_effective_lead_days: 45, objection_response_sla_days: 30, deemer_days: 60, max_single_change_pct: 0.25, renewal_notice_days: 30, disapproval_window_days: 90 }
              as: ComplianceOfficer
            - call: "POST /rate-indications"
              payload: { product_id: "${prod_id}", variant: "INCURRED_CREDIBILITY", earned_premium_cents: 10000000, incurred_loss_cents: 7000000, paid_loss_cents: 6500000, exposure_units: 500, trend_factor: 0.04, countrywide_change_pct: 0.06, expected_product_version: "${prod_v}" }
              as: ProductActuary
              as_user_id: "act-1"
              captures: { ind_id: $.data.id }
            - call: "POST /rate-indications/${ind_id}/submit-review"
