          assert:
            - "error_id == ERR_PERSONNEL_ALREADY_ON_DUTY (att1 still ON_DUTY on ${ro1} from day1)"
            - "RosterEntry.${ro2}.status remains SCHEDULED"
            - "RosterEntry.${ro1}.status == ON_DUTY (unchanged)"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: corner_verify_twice_invalid
        claim_type: violation_to_error
        grounds: ["errors[ERR_VERIFICATION_INVALID_STATE]", state_machines.IsolationVerification.PENDING_to_VERIFIED]
        distinguishing_aspect: "Verifying an already-VERIFIED isolation fails with ERR_VERIFICATION_INVALID_STATE (409); the verification record is unchanged."
        test_recipe:
          setup: ["ISSUED permit with a VERIFIED VENTILATION verification"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Safe One", role_qualifications: ["SAFETY_OFFICER"] }, as: OperationsManager, captures: { so_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Twice Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-TV", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: true, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Twice job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/isolation-verifications", payload: { isolation_type: "VENTILATION", evidence_ref: "vent-2" }, as: SafetyOfficer, as_user_id: "${so_id}", captures: { iso: "$.data.id" } }
            - { call: "POST /rescue-ops/isolation-verifications/${iso}/verify", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}" }
          trigger:
            - { call: "POST /rescue-ops/isolation-verifications/${iso}/verify", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VERIFICATION_INVALID_STATE"
            - "IsolationVerification.${iso}.status remains VERIFIED and expires_at unchanged"

      - name: corner_plan_approve_twice_invalid
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_INVALID_STATE]", state_machines.RescuePlan.DRAFT_to_APPROVED]
        distinguishing_aspect: "Approving an already-APPROVED plan fails with ERR_PLAN_INVALID_STATE — the OCC version is fresh, so the failure is purely the state guard (state check after OCC passes)."
        test_recipe:
          setup: ["Space with an APPROVED plan"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Twice Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-TA", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
          trigger:
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v3}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PLAN_INVALID_STATE (plan already APPROVED; OCC passed with the fresh version)"
            - "RescuePlan.${plan}.status remains APPROVED"

      - name: corner_release_scheduled_assignment_invalid
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSIGNMENT_INVALID_STATE]", state_machines.StandbyAssignment.ON_STANDBY_to_RELEASED]
        distinguishing_aspect: "Releasing a SCHEDULED assignment (never checked in) fails with ERR_ASSIGNMENT_INVALID_STATE; release is defined only from ON_STANDBY or DEPLOYED."
        test_recipe:
          setup: ["ISSUED permit with APPROVED plan; one SCHEDULED standby assignment (future window)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Release Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-RS", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Release job", planned_start_at: "2026-08-03T06:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T10:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/standby-assignments/${sa}/release", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ASSIGNMENT_INVALID_STATE"
            - "StandbyAssignment.${sa}.status remains SCHEDULED with line_amount_cents null"

      - name: corner_void_open_statement_invalid
        claim_type: violation_to_error
        grounds: ["errors[ERR_STATEMENT_INVALID_STATE]", state_machines.BillingStatement.FINALIZED_to_VOID]
        distinguishing_aspect: "Voiding an OPEN statement fails with ERR_STATEMENT_INVALID_STATE; only FINALIZED or DISPUTED statements can be voided."
        test_recipe:
          setup: ["Account with an OPEN (empty) statement"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
