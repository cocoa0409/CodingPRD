              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
          trigger:
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
