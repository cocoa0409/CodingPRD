            - { call: "POST /youth-ministry/registrations/${reg1}/dismiss", payload: {sanction: "BARRED_FROM_FUTURE", reason: "curfew violation"}, as: ProgramDirector, as_user_id: "director-1", captures: {final_status: $.data.registration_status, sanction: $.data.dismiss_sanction} }
            - { call: "GET /youth-ministry/participants/${p1}", as: ProgramDirector, captures: {barred: $.data.barred_until} }
          assert:
