        distinguishing_aspect: "OCC on AdoptionAgreement.version: a PATCH carrying the version the client last observed succeeds and bumps version by 1; replaying the same observed version then fails ERR_STALE_VERSION (412); re-reading and PATCHing with the fresh version succeeds."
