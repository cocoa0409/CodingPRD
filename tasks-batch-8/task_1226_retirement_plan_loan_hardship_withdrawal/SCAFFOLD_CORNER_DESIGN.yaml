  # ===========================================================================
  - section: rbac
    instances:
      - name: participant_cannot_create_plan
        claim_type: role_denial
        grounds:
          - roles[0]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "The Participant role is excluded from POST /plans: role denial at priority 2 with ERR_UNAUTHORIZED_ROLE (403) even with a valid body."
        test_recipe:
          setup: ["a plan and participant exist so the role header is entity-backable"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan RBAC1" }, as: RecordkeeperAdmin, captures: { pl_rb: "$.data.id" } }
            - { call: "POST /plans/${pl_rb}/participants", payload: { full_name: "Rbac Rob", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_rb: "$.data.id" } }
          trigger:
            - { call: "POST /plans", payload: { name: "Sneaky Plan" }, as: Participant, as_user_id: "${p_rb}", captures: { rb_err: "$.data.error_id" } }
          assert:
            - "captured rb_err == ERR_UNAUTHORIZED_ROLE"
            - "HTTP status == 403"

      - name: same_operator_cannot_decide_two_steps
        claim_type: segregation_of_duties
        grounds:
          - roles
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.ApprovalTask.PENDING_to_APPROVED
        distinguishing_aspect: "Segregation of duties across roles: X-User-ID ops-7 decides step 1 as PlanSponsor, then the SAME X-User-ID ops-7 attempting step 2 as RecordkeeperAdmin is rejected ERR_SEGREGATION_OF_DUTIES even though the role matches the step."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan requested"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan SoD" }, as: RecordkeeperAdmin, captures: { pl_sd: "$.data.id" } }
            - { call: "POST /plans/${pl_sd}/participants", payload: { full_name: "Sod Sam", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_sd: "$.data.id" } }
            - { call: "POST /participants/${p_sd}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_sd}", captures: { loan_sd: "$.data.id" } }
            - { call: "GET /loans/${loan_sd}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { sd_t1: "$.data[0].id", sd_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${sd_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "ops-7" }
          trigger:
            - { call: "POST /approval-tasks/${sd_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "ops-7", captures: { sd_err: "$.data.error_id" } }
          assert:
            - "captured sd_err == ERR_SEGREGATION_OF_DUTIES"
            - "ApprovalTask.${sd_t2}.status remains PENDING and Loan.${loan_sd}.lifecycle_status remains REQUESTED"

      - name: payroll_provider_cannot_decide_approval_task
        claim_type: role_denial
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Peer-role isolation: PayrollProvider may post remittances but is not in the decide endpoint's role list at all — its decide attempt fails ERR_UNAUTHORIZED_ROLE before any task-state check."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan requested"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan PP" }, as: RecordkeeperAdmin, captures: { pl_pp: "$.data.id" } }
            - { call: "POST /plans/${pl_pp}/participants", payload: { full_name: "Pp Pete", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_pp: "$.data.id" } }
            - { call: "POST /participants/${p_pp}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_pp}", captures: { loan_pp: "$.data.id" } }
            - { call: "GET /loans/${loan_pp}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { pp_t1: "$.data[0].id" } }
          trigger:
            - { call: "POST /approval-tasks/${pp_t1}/decide", payload: { decision: "APPROVE" }, as: PayrollProvider, as_user_id: "payroll-1", captures: { pp_err: "$.data.error_id" } }
          assert:
            - "captured pp_err == ERR_UNAUTHORIZED_ROLE"

      - name: auditor_read_only_denied_mutation
        claim_type: role_denial
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Auditor can read plans, participants, loans and the audit trail, but its mutation attempt (plan freeze) is denied ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["one plan"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Aud" }, as: RecordkeeperAdmin, captures: { pl_ad: "$.data.id" } }
          trigger:
            - { call: "GET /plans/${pl_ad}", payload: {}, as: Auditor, captures: { ad_ok: "$.data.id" } }
            - { call: "POST /plans/${pl_ad}/freeze", payload: {}, as: Auditor, as_user_id: "auditor-1", captures: { ad_err: "$.data.error_id" } }
          assert:
            - "captured ad_ok == ${pl_ad} (read succeeds)"
            - "captured ad_err == ERR_UNAUTHORIZED_ROLE"

      - name: participant_cannot_touch_another_participants_resources
        claim_type: role_denial
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED_ROLE]
          - validations[priority=2]
        distinguishing_aspect: "Entity-backed ownership: Participant A's X-User-ID on Participant B's loan-request path fails the ownership check with ERR_UNAUTHORIZED_ROLE even though Participant is the correct role for the endpoint."
        test_recipe:
          setup: ["default plan with participants A and B, each vested 10,000,000c"]
          setup_api_calls:
