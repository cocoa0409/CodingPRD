              payload: { record_series_id: "${seriesA_id}", informational_value: 8, evidential_value: 7, brand_heritage_value: 6, uniqueness_factor: 5, provenance_verified: true, expected_series_version: "${seriesA_v}" }
              as: Archivist
              captures: { apprA_id: $.data.id }
