            - "${pool_v_after_reject} == ${pool_v1} and ${pool_hours_after_reject} == 0.00 — a rejected reservation neither bumps the pool version nor commits core hours, which is why the retry can reuse ${pool_v1}"
            - "${small_status} == RESERVED with ${small_est} == 7 (one frame at 7 cents per frame)"
