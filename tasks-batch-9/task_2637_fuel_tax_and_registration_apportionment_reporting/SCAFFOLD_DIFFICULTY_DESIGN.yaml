      - name: credential_distribution_blocked_when_driver_deactivated_by_revocation
        dependency: Credential.distribute depends on Driver.driver_status, which a Carrier revocation drives
        grounds:
          - validations.priority_29_ERR_DRIVER_CARRIER_MISMATCH
          - state_machines.Carrier.ifta_license_status.ACTIVE_to_REVOKED
          - state_machines.Carrier.irp_account_status.ACTIVE_to_SUSPENDED
          - state_machines.Driver.ACTIVE_to_INACTIVE
          - state_machines.Credential.ISSUED_to_VOIDED
        distinguishing_aspect: |
          A three-entity dependency in the credential-distribution domain rather than the
          filing domain: the operation targets a Credential, the blocking state sits on Driver,
          and the thing that moved the Driver was a Carrier revocation two hops away. Unlike the
          suspension instance, the revocation path does couple the dimensions — irp_account_status
          follows the licence into SUSPENDED and every ACTIVE driver becomes INACTIVE — so a
