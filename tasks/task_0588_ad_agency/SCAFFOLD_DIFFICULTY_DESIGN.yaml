  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: retainer_cash_conserved_across_issue_and_void
        grounds:
          - calculations.retainer_application
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Retainer.fields.funded_cents
          - entities.Retainer.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity #1 is CLIENT RETAINER CASH, pinned as
          Retainer.funded_cents == Retainer.balance_cents + SUM(Invoice.retainer_applied_cents WHERE
          approval_status == ISSUED). Issue draws 20600 down to a balance of 179400; the void puts
          exactly 20600 back and drops the invoice out of the ISSUED filter, so funded_cents 200000
          equals balance_cents 200000 plus 0 — zero drift.
        test_recipe:
          setup:
            - "Clock 2026-06-01; Acme; retainer funded_cents 200000, balance_cents 200000, ACTIVE."
            - "SOW countersigned; campaign IN_FLIGHT; one APPROVED TimeEntry of 60 min SENIOR (billable_amount_cents 20000)."
            - "A FINAL DRAFT invoice for 2026-06-01..2026-07-01 with total_cents 20600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Lee", grade: "SENIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 6000 }
              as: AgencyAdmin
              captures: { st_dana: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /retainers"
              payload: { client_id: "${cli}", initial_funding_cents: 200000, period_start: "2026-06-01", period_end: "2026-09-01" }
              as: AgencyAdmin
              captures: { ret: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /time-entries"
              payload: { campaign_id: "${camp}", staff_id: "${st_dana}", started_at: "2026-06-02T09:00:00Z", ended_at: "2026-06-02T10:00:00Z", billable: true }
              as: CreativeLead
              as_user_id: "${st_dana}"
              captures: { te: $.data.id }
            - call: "POST /time-entries/${te}/approve"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /invoices"
              payload: { client_id: "${cli}", campaign_id: "${camp}", retainer_id: "${ret}", billing_mode: "FINAL", period_start: "2026-06-01", period_end: "2026-07-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { inv: $.data.id }
            - call: "GET /retainers/${ret}"
              payload: {}
              as: AgencyAdmin
              captures: { ret_v: $.data.version }
          trigger:
            - call: "POST /invoices/${inv}/issue"
              payload: { expected_retainer_version: "${ret_v}" }
              as: AgencyAdmin
            - call: "POST /invoices/${inv}/void"
              payload: { reason: "Client disputed the scope" }
              as: AgencyAdmin
          assert:
            - "after the issue call: Retainer.${ret}.balance_cents == 179400 AND Invoice.${inv}.retainer_applied_cents == 20600 AND Retainer.${ret}.status == ACTIVE"
            - "after the void call: Invoice.${inv}.approval_status == VOID"
            - "after the void call: Retainer.${ret}.balance_cents == 200000"
            - "after the void call: Retainer.${ret}.funded_cents == 200000"
            - "invariant: Retainer.${ret}.funded_cents == Retainer.${ret}.balance_cents + 0 (no ISSUED invoice remains)"
            - "after the void call: TimeEntry.${te}.status == APPROVED (the FINAL invoice's BILLED flag was released)"

