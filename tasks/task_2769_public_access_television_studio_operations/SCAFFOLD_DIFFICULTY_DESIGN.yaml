          A different entity pair — CourseEnrollment depending on Producer — and a
          different gate: the applicant's own residency verification, not a
          reviewer's decision. The same enrollment body fails as APPLICANT and
          succeeds once the producer is ACTIVE, and the course's enrolled_count
          proves the rejected attempt left no trace.
