          - entities.MarkupTier.fields.lower_bound_cents
          - entities.PartLine.fields.extended_charge_cents
        distinguishing_aspect: |
          Numeric threshold metric: at cost exactly 5000 the inclusive lower bound
          puts FLAT_BRACKET in tier [5000,20000)@.40 -> 7000, whereas 4999 sits in
          [0,5000)@.50 -> 7499; reachable via POST /repair-orders/{id}/part-lines.
        test_recipe:
          setup:
            - "Markup matrix [0,5000)@0.50,[5000,20000)@0.40; RO ESTIMATE"
            - "Two FLAT_BRACKET part lines qty1: cost 4999 and cost 5000"
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 5000, markup_pct: 0.50 }
              as: PartsManager
            - call: "POST /markup-tiers"
              payload: { tier_index: 1, lower_bound_cents: 5000, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
