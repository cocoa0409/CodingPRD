              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr N", npi: "1000000014" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "o8b@x.com", full_name: "M O8b", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "VIRTUAL", starts_at: "2026-06-05T09:00:00Z", ends_at: "2026-06-05T10:00:00Z", virtual_capacity: 5 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slotA_id: $.data.id, slotA_v: $.data.version }
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "VIRTUAL", starts_at: "2026-06-05T09:30:00Z", ends_at: "2026-06-05T10:30:00Z", virtual_capacity: 5 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slotB_id: $.data.id, slotB_v: $.data.version }
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "VIRTUAL", starts_at: "2026-06-05T10:00:00Z", ends_at: "2026-06-05T11:00:00Z", virtual_capacity: 5 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slotC_id: $.data.id, slotC_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slotA_id}", visit_type: "VIRTUAL", expected_slot_version: "${slotA_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { vA_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slotB_id}", visit_type: "VIRTUAL", expected_slot_version: "${slotB_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { errB: $.data.error_id }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slotC_id}", visit_type: "VIRTUAL", expected_slot_version: "${slotC_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { vC_id: $.data.id }
          assert:
            - "errB == ERR_MEMBER_DOUBLE_BOOKED"
            - "Visit.${vC_id}.clinical_status == BOOKED"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_occupy_then_cancel_conserves_occupied_seat_count
        grounds:
          - state_machines.Member.ACTIVE_to_CANCELLED
          - entities.Employer.fields.occupied_seat_count
          - entities.EmployerSeat.fields.seat_status
        distinguishing_aspect: "Conserved quantity = Employer.occupied_seat_count, pinned as |{EmployerSeat where seat_status==OCCUPIED}|. Forward occupy raises it 0->1; compensating member cancel returns it to 0, leaving no drift (occupied_seat_count == count of OCCUPIED seats == 0 afterward)."
        test_recipe:
          setup:
            - "Employer with one seat occupied by ACTIVE member m (sponsorship_pct=1.0, member_share=0); occupied_seat_count==1 before cancel."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC Inv1", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr O", npi: "1000000015" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /employers"
              payload: { practice_id: "${pr_id}", company_name: "Acme", sponsored_seat_limit: 3, sponsorship_pct: 1.0 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "inv1@x.com", full_name: "M Inv1", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "POST /employers/${emp_id}/seats"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { seat_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { emp_v: $.data.version }
            - call: "POST /employers/${emp_id}/seats/${seat_id}/occupy"
              payload: { member_id: "${m_id}", expected_employer_version: "${emp_v}" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 0, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /members/${m_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Employer.${emp_id}.occupied_seat_count == 0"
            - "EmployerSeat.${seat_id}.seat_status == RELEASED"

      - name: activate_then_cancel_conserves_provider_panel_count
        grounds:
          - state_machines.Member.PENDING_PAYMENT_to_ACTIVE
          - state_machines.Member.ACTIVE_to_CANCELLED
          - entities.Provider.fields.active_panel_count
          - entities.Provider.fields.panel_load_bucket
        distinguishing_aspect: "Conserved quantity = Provider.active_panel_count, pinned as |{Member assigned to provider with membership_status IN {ACTIVE,PAST_DUE}}|. Forward activation raises it 0->1; compensating cancel returns it to 0 and panel_load_bucket back to UNDER_TARGET — a DIFFERENT conserved quantity (panel headcount) than the seat-count invariant."
        test_recipe:
          setup:
            - "Provider prov with empty panel (active_panel_count=0). Member m assigned to prov, activated (count->1), then cancelled."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC Inv2", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr P", npi: "1000000016" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "inv2@x.com", full_name: "M Inv2", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /members/${m_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /providers/${prov_id}"
              payload: {}
              as: PlatformAdmin
              captures: { panel: $.data.active_panel_count, bucket: $.data.panel_load_bucket }
          assert:
            - "Provider.${prov_id}.active_panel_count == 0"
            - "Provider.${prov_id}.panel_load_bucket == UNDER_TARGET"
