              captures: { grant_id: "$.data[0].id" }
          trigger:
            - call: "POST /digital-assets/${a1_id}/disposition-elections"
              payload: { election: "MEMORIALIZE", expected_asset_version: "${a1_ver1}", election_note: "memorial page requested by the family" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { el_id: $.data.id, el_status0: $.data.status }
            - call: "POST /disposition-elections/${el_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
