            - call: "POST /api/skus"
              payload: { sku_code: "PLATE-CLEAR", category: "TABLEWARE", unit_price_cents: 500 }
              as: StoreManager
              captures: { plate: $.data.id }
            - call: "POST /api/skus/${plate}/restock"
              payload: { delta: 20 }
              as: StoreManager
              captures: { plate_v: $.data.version }
            - call: "POST /api/skus/${plate}/clearance"
              payload: { pct: 0.5, expected_sku_version: "${plate_v}" }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${plate}", qty: 1 }] }
              as: StoreClerk
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /api/rental-contracts"
              payload: { order_id: "${ord}", sku_id: "${plate}", qty: 4, rental_start: "2026-06-20T00:00:00Z", rental_end: "2026-06-22T00:00:00Z" }
              as: StoreClerk
              captures: { dep: $.data.deposit_cents }
          assert:
            - "dep == 4000"

