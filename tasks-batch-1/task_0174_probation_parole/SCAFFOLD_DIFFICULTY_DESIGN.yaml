  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: appeal_restores_cumulative_violation_points
        grounds:
          - state_machines.Violation.FILED_to_SUSTAINED
          - state_machines.Violation.SUSTAINED_to_APPEALED
          - calculations.violation_points
          - entities.Supervisee.fields.cumulative_violation_points
        distinguishing_aspect: "Conserved quantity = Supervisee.cumulative_violation_points: sustaining a FELONY adds 6, appealing it subtracts the same 6, leaving cumulative_violation_points == sum of points over remaining SUSTAINED violations with zero drift (pinned: cumulative == sum(v.points for v SUSTAINED))."
        test_recipe:
          setup:
            - "An ACTIVE PROBATION Supervisee with one SUSTAINED FELONY (cumulative 6)."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Ci1", badge_number: "B-9001", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "S Ci1", docket_number: "DK-9001", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 36, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 5, education_employment: 4, financial: 4, family_marital: 4, accommodation: 4, leisure_recreation: 3, companions: 4, alcohol_drug: 4, emotional_personal: 4, attitudes_orientation: 4 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/violations"
              payload: { violation_class: "FELONY", filed_by_officer_id: "${off_id}" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { v_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/violations/${v_id}/sustain"
              payload: {}
              as: SupervisingJudge
              as_user_id: "judge-9"
          trigger:
            - call: "POST /supervisees/${sup_id}/violations/${v_id}/appeal"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { st: $.data.status }
          assert:
            - "Violation.${v_id}.status == APPEALED"
            - "Supervisee.${sup_id}.cumulative_violation_points == 0"
            - "the Sanction for Violation.${v_id} has status == VACATED"

      - name: payment_then_discharge_conserves_obligation_value
        grounds:
          - calculations.payment_waterfall
          - state_machines.FinancialObligation.OPEN_to_DISCHARGED
          - entities.Supervisee.fields.restitution_balance_cents
          - entities.FinancialObligation.fields.paid_cents
        distinguishing_aspect: "Conserved quantity = obligation value accounting (paid_cents + remaining_outstanding == principal_cents) on a DIFFERENT quantity than violation points: a 4000-cent payment against a 10000 RESTITUTION leaves outstanding 6000 (balance 6000), and discharging the obligation drives restitution_balance_cents to 0 while paid_cents stays 4000 — no value created or lost beyond the explicit waiver."
        test_recipe:
          setup:
            - "An ACTIVE PROBATION Supervisee with one OPEN RESTITUTION obligation principal 10000."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Ci2", badge_number: "B-9002", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "S Ci2", docket_number: "DK-9002", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/obligations"
              payload: { obligation_type: "RESTITUTION", principal_cents: 10000 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/payments"
              payload: { amount_cents: 4000, allocation_policy: "RESTITUTION_FIRST" }
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /supervisees/${sup_id}/obligations/${ob_id}/discharge"
              payload: {}
              as: SupervisingJudge
              as_user_id: "judge-9b"
              captures: { st: $.data.status }
          assert:
            - "FinancialObligation.${ob_id}.paid_cents == 4000"
            - "FinancialObligation.${ob_id}.status == DISCHARGED"
            - "Supervisee.${sup_id}.restitution_balance_cents == 0"
