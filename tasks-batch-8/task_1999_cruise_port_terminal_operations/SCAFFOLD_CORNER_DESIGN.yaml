            - { call: "POST /port-ops/port-calls/${pc2}/provisional-invoice", as: BillingClerk, captures: { d2: $.data.dockage_fee_cents } }
            - { call: "POST /port-ops/port-calls/${pc3}/provisional-invoice", as: BillingClerk, captures: { d3: $.data.dockage_fee_cents } }
            - { call: "POST /port-ops/port-calls/${pc4}/provisional-invoice", as: BillingClerk, captures: { d4: $.data.dockage_fee_cents } }
          assert:
            - "LOA 700: d1 == 798000 (700 x 95 x 12)"
            - "LOA 701: d2 == 1051500 (701 x 125 x 12) — tier edge inclusive: 700 is tier1, 701 tier2"
            - "LOA 1000: d3 == 1500000 (1000 x 125 x 12) — 1000 still tier2"
            - "LOA 1001: d4 == 1801800 (1001 x 150 x 12) — tier3"
      - name: dockage_minimum_billed_hours_floor
        claim_type: constants_applied
        grounds:
          - calculations.dockage_fee
        distinguishing_aspect: "An 8-hour turnaround bills max(8, 10) = 10 hours: 950 x 125 x 10 = 1187500."
        test_recipe:
          setup: ["Call 950ft vessel, scheduled 08:00 -> 16:00 (8h), CONFIRMED assignment"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T16:00:00Z", booked_embark_pax: 0, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T18:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/provisional-invoice", as: BillingClerk, captures: { dock: $.data.dockage_fee_cents } }
          assert:
            - "dock == 1187500 (10 billed hours despite an 8h schedule)"
      - name: provisional_service_fee_excludes_requested_orders
        claim_type: input_set_filtering
        grounds:
          - calculations.service_fee
        distinguishing_aspect: "PROVISIONAL fee input set is {APPROVED, IN_PROGRESS, COMPLETED}: the REQUESTED order contributes 0; the APPROVED one contributes 48000."
        test_recipe:
          setup: ["Call with CONFIRMED assignment; SO1 PROVISIONING 10u APPROVED; SO2 WASTE_OFFLOAD 4u still REQUESTED"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 0, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/service-orders", payload: { kind: "PROVISIONING", units: 10, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: VesselAgent, as_user_id: "${ves}", captures: { so1: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/service-orders", payload: { kind: "WASTE_OFFLOAD", units: 4, window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T15:00:00Z" }, as: VesselAgent, as_user_id: "${ves}", captures: { so2: $.data.id } }
            - { call: "POST /port-ops/service-orders/${so1}/approve", as: TerminalOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/provisional-invoice", as: BillingClerk, captures: { svc: $.data.service_fee_cents, gross: $.data.gross_cents } }
          assert:
            - "svc == 48000 (only the APPROVED order counts; REQUESTED WASTE_OFFLOAD excluded)"
            - "gross == 1425000 + 0 + 48000 == 1473000 (booked pax 0 -> head tax 0)"
      - name: final_head_tax_counts_held_debark_excludes_carried_away
        claim_type: input_set_filtering
        grounds:
          - calculations.passenger_head_tax
        distinguishing_aspect: "FINAL tax input set for DEBARK is {DISEMBARKED, HELD, CLEARED}: a HELD entry counts (1350), a CARRIED_AWAY entry does not."
