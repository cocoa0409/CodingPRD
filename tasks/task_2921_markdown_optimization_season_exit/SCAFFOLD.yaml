    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: []
    output: PriceZone
    side_effects: []
  - method: GET
    path: "/stores"
    description: "List stores; price_zone_id filters to the stores of one zone"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: ["price_zone_id?", "status?", "region_code?", "limit?", "offset?"]
    output: Store[]
    side_effects: []
  - method: GET
    path: "/stores/{store_id}"
    description: "Fetch one store with its committed and available clearance bay units"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: []
    output: Store
    side_effects: []

  # ---- Reads: items, history, elasticity -----------------------------------
  - method: GET
    path: "/items"
    description: "List items; season_id / cluster_code / lifecycle_stage / vendor_code narrow the set"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, VendorRep, Controller]
    code: 200
