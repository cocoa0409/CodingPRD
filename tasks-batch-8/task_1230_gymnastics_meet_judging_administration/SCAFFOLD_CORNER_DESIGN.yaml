scaffold_corner_design:
  # ==========================================================================
  # Section: entities — creation, retrieval, listing, defaults, computed fields
  # ==========================================================================
  - section: entities
    instances:
      - name: meet_creation_with_defaults
        claim_type: creation_with_defaults
        grounds:
          - entities.Meet.fields.tiebreak_policy
          - entities.Meet.fields.qualifying_score_rule
          - entities.Meet.fields.inquiry_window_minutes
          - entities.Meet.fields.max_athletes_per_squad
        distinguishing_aspect: "Omitting optional fields yields declared defaults: tiebreak_policy=USAG_CLASSIC, qualifying_score_rule=BOTH, inquiry_window_minutes=5, max_athletes_per_squad=12"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Defaults", sanction_year: 2026, sanction_number: "USAG-2028-0001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
          assert:
            - "Meet.${m_id}.tiebreak_policy == 'USAG_CLASSIC'"
            - "Meet.${m_id}.qualifying_score_rule == 'BOTH'"
            - "Meet.${m_id}.inquiry_window_minutes == 5"
            - "Meet.${m_id}.max_athletes_per_squad == 12"
            - "Meet.${m_id}.posture == 'DRAFT'"
            - "Meet.${m_id}.version == 1"

      - name: meet_not_found_404
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /meets/{non-existent-uuid} returns 404 with ERR_RESOURCE_NOT_FOUND"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MeetDirector
          assert:
            - "Response status == 404"
            - "error_id == ERR_RESOURCE_NOT_FOUND"

      - name: meet_list_pagination
        claim_type: listing_pagination
        grounds: ["response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /meets?limit=2&offset=0 returns exactly 2 items with total_count and has_more=true when 3 meets exist"
        test_recipe:
          setup: ["3 meets exist"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "M1", sanction_year: 2026, sanction_number: "USAG-2028-1001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "M2", sanction_year: 2026, sanction_number: "USAG-2028-1002", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "M3", sanction_year: 2026, sanction_number: "USAG-2028-1003", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: { limit: 2, offset: 0 }
              as: MeetDirector
          assert:
            - "response_type == 'array'"
            - "len(data) == 2"
            - "meta contains limit, offset, total_count, has_more"
            - "total_count == 3"
            - "has_more == true"

      - name: score_computed_provisional_total
        claim_type: computed_field
        grounds: ["entities.Score.fields.provisional_total", "calculations.provisional_score"]
        distinguishing_aspect: "POST publish computes provisional_total = D + E - ND, rounded to 3dp half-up; input-supplied provisional_total is ignored"
        test_recipe:
          setup: ["DRAFT Score with D=5.2, E=8.85, ND=0.1"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "Computed provisional_total == 13.950 (5.2 + 8.85 - 0.1)"
            - "Caller cannot override provisional_total via input"

      - name: gymnast_usag_number_format_constraint
        claim_type: type_constraint
        grounds: ["entities.Gymnast.fields.usag_member_number"]
        distinguishing_aspect: "usag_member_number must match ^A[0-9]{7}$; 'X1234567' is rejected"
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "X1234567", legal_name: "Bad", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
          assert:
            - "Response status == 400 or 422"
            - "error_id IN {ERR_INVALID_REQUEST, ERR_INVALID_STATE}"

  # ==========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, side effects
  # ==========================================================================
  - section: state_machines
    instances:
      - name: terminal_archived_meet_no_transitions
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Meet", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Meet in ARCHIVED terminal state rejects POST /publish, /close-scoring, /finalize, /archive"
        test_recipe:
          setup: ["Meet M fully walked DRAFT->SCHEDULED->...->ARCHIVED"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Term", sanction_year: 2026, sanction_number: "USAG-2029-0001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /api/v1/meets/${m_id}/publish"
              payload: {}
              as: MeetDirector
          assert:
            - "If Meet already ARCHIVED: response 409 ERR_ALREADY_TERMINAL or ERR_INVALID_STATE"
            - "Meet.posture remains ARCHIVED"

      - name: score_publish_idempotency_violation
        claim_type: invalid_transition
        grounds: ["state_machines.Score.DRAFT_to_PUBLISHED"]
        distinguishing_aspect: "Second POST /scores/{id}/publish on already-PUBLISHED score returns 409 ERR_INVALID_STATE (not idempotent)"
        test_recipe:
          setup: ["Score SC already PUBLISHED"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "Re-publish attempt returns 409 ERR_INVALID_STATE"

      - name: inquiry_invalid_from_published_direct_resolve
        claim_type: invalid_transition
        grounds: ["state_machines.Inquiry"]
        distinguishing_aspect: "POST /inquiries/{id}/resolve from FILED (not UNDER_REVIEW) is rejected; only UNDER_REVIEW -> UPHELD/DENIED allowed"
        test_recipe:
          setup: ["Inquiry INQ in FILED state"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "Resolve from FILED returns 409 ERR_INVALID_STATE"

      - name: coach_check_in_requires_floor_access_granted
        claim_type: precondition_enforcement
        grounds: ["state_machines.AthleteEntry.REGISTERED_to_CHECKED_IN", "entities.CoachMeetPass.fields.pass_state"]
        distinguishing_aspect: "Coach with pass_state=ISSUED (not FLOOR_ACCESS_GRANTED) cannot check in an athlete"
        test_recipe:
          setup: ["CoachMeetPass P ISSUED (not yet granted)"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Chk", sanction_year: 2026, sanction_number: "USAG-2029-1001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A9000001", legal_name: "G", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
              captures: { g_id: $.data.id }
            - call: "POST /api/v1/sessions/${s_id}/athlete-entries"
              payload: { gymnast_id: "${g_id}" }
              as: MeetDirector
              captures: { e_id: $.data.id }
            - call: "POST /api/v1/coaches"
              payload: { usag_coach_number: "C9000001", legal_name: "C", affiliated_gym: "Metro", background_check_expiry: "2027-01-01T00:00:00Z", safety_cert_expiry: "2027-01-01T00:00:00Z" }
              as: MeetDirector
              captures: { c_id: $.data.id }
            - call: "POST /api/v1/coaches/${c_id}/verify"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/meets/${m_id}/coach-meet-passes"
              payload: { coach_id: "${c_id}" }
              as: MeetDirector
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /api/v1/athlete-entries/${e_id}/check-in"
              payload: {}
              as: Coach
              as_user_id: "${c_id}"
          assert:
            - "Response status == 409 or 422"
            - "error_id IN {ERR_INVALID_STATE, ERR_COACH_CREDENTIAL_LAPSED}"

  # ==========================================================================
  # Section: calculations — correct results, input set filtering, precision
  # ==========================================================================
  - section: calculations
    instances:
      - name: all_around_total_with_void_apparatus_excluded
        claim_type: correct_result
        grounds: ["calculations.all_around_total"]
        distinguishing_aspect: "AA total sums only FINAL scores; VOID apparatus contributes 0.000 (athlete scratched FX: AA=13.5+13.4+13.9+0=40.800)"
        test_recipe:
          setup: ["AthleteEntry E with VT/UB/BB FINAL (13.5/13.4/13.9), FX VOID"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "AthleteEntry.all_around_total == 40.800"
            - "VOID FX does not contribute to AA sum"

      - name: provisional_score_floor_at_zero
        claim_type: boundary
        grounds: ["calculations.provisional_score"]
        distinguishing_aspect: "provisional_total clamps to 0.000 floor if raw formula yields negative (e.g., D=2.0, E=1.0, ND=5.0 -> raw=-2.0 -> clamped to 0.000)"
        test_recipe:
          setup: ["Score with D=2.0, E=1.0, ND=5.0 (raw = -2.0)"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "provisional_total == 0.000 (clamped, not negative)"

      - name: rotation_layout_changeover_gap_applied
        claim_type: correct_result
        grounds: ["calculations.rotation_temporal_layout"]
        distinguishing_aspect: "Generated rotations have 5-minute CHANGEOVER_GAP between end of one and start of next"
        test_recipe:
          setup: ["Session with 1 squad, 8 athletes"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Rot", sanction_year: 2026, sanction_number: "USAG-2030-0001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s_id: $.data.id }
            - call: "POST /api/v1/sessions/${s_id}/squads"
              payload: { squad_label: "A", starting_apparatus: "VAULT" }
              as: MeetDirector
          trigger:
            - call: "POST /api/v1/sessions/${s_id}/rotations/generate"
              payload: {}
              as: MeetDirector
              captures: { rots: $.data }
          assert:
            - "len(rots) == 4"
            - "Each successive rotation's scheduled_start == previous scheduled_end + 5 minutes"

      - name: judge_panel_required_count_per_apparatus
        claim_type: constants_applied
        grounds: ["entities.JudgePanel.fields.required_judge_count"]
        distinguishing_aspect: "BALANCE_BEAM and FLOOR_EXERCISE panels require 4 judges; VAULT and UNEVEN_BARS require 2"
        test_recipe:
          setup: ["One Session"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "JP", sanction_year: 2026, sanction_number: "USAG-2030-1001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /api/v1/sessions/${s_id}/judge-panels"
              payload: { meet_id: "${m_id}", apparatus: "BALANCE_BEAM" }
              as: MeetReferee
              captures: { jp_bb: $.data.id, req_bb: $.data.required_judge_count }
            - call: "POST /api/v1/sessions/${s_id}/judge-panels"
              payload: { meet_id: "${m_id}", apparatus: "VAULT" }
              as: MeetReferee
              captures: { jp_vt: $.data.id, req_vt: $.data.required_judge_count }
          assert:
            - "BALANCE_BEAM panel.required_judge_count == 4"
            - "VAULT panel.required_judge_count == 2"

  # ==========================================================================
  # Section: validations — priority, satisfaction vs violation, cross-entity
  # ==========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Any endpoint called without X-User-Role/X-User-ID returns 401 ERR_UNAUTHENTICATED before any other check"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "Without auth headers: 401 ERR_UNAUTHENTICATED"

      - name: score_field_range_violation_difficulty
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_SCORE_FIELD_RANGE]"]
        distinguishing_aspect: "POST scores with difficulty_score = 11.0 (> 10.000 max) returns 422 ERR_SCORE_FIELD_RANGE"
        test_recipe:
          setup: ["AthleteEntry in valid state"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "D > 10.000 -> 422 ERR_SCORE_FIELD_RANGE"

      - name: session_outside_meet_window
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_SESSION_OUTSIDE_MEET_WINDOW]"]
        distinguishing_aspect: "Session scheduled_end > Meet.end_date + 2h is rejected"
        test_recipe:
          setup: ["Meet with end_date = 2026-05-02T22:00:00Z"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Win", sanction_year: 2026, sanction_number: "USAG-2030-2001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "Late", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-03T02:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
          assert:
            - "Response status == 422"
            - "error_id == ERR_SESSION_OUTSIDE_MEET_WINDOW"

      - name: ticket_duplicate_email_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_TICKET_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Second ticket for same (session_id, holder_email) where first is not VOID returns 409 ERR_TICKET_DUPLICATE_EMAIL"
        test_recipe:
          setup: ["Meet+Session+ticket T1 for holder_email='a@x.com'"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Dup", sanction_year: 2026, sanction_number: "USAG-2030-3001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions/${s_id}/spectator-tickets"
              payload: { holder_name: "A", holder_email: "a@x.com", ticket_class: "GENERAL_ADMISSION", price_cents: 2500 }
              as: MeetDirector
          trigger:
            - call: "POST /api/v1/meets/${m_id}/sessions/${s_id}/spectator-tickets"
              payload: { holder_name: "A2", holder_email: "a@x.com", ticket_class: "GENERAL_ADMISSION", price_cents: 2500 }
              as: MeetDirector
          assert:
            - "Response status == 409"
            - "error_id == ERR_TICKET_DUPLICATE_EMAIL"

      - name: ticket_comp_price_must_be_zero
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_TICKET_PRICE_MISMATCH]"]
        distinguishing_aspect: "COMP ticket with price_cents=2500 returns 422; COMP with price_cents=0 succeeds"
        test_recipe:
          setup: ["Meet+Session"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "Cmp", sanction_year: 2026, sanction_number: "USAG-2030-3002", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /api/v1/meets/${m_id}/sessions/${s_id}/spectator-tickets"
              payload: { holder_name: "X", holder_email: "x@x.com", ticket_class: "COMP", price_cents: 2500 }
              as: MeetDirector
          assert:
            - "Response status == 422"
            - "error_id == ERR_TICKET_PRICE_MISMATCH"

      - name: gymnast_double_entry_in_same_meet
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_GYMNAST_DOUBLE_ENTERED]"]
        distinguishing_aspect: "Gymnast with non-SCRATCHED entry in Session A of Meet M cannot be entered into Session B of same Meet M"
        test_recipe:
          setup: ["Meet M with Sessions S1, S2; Gymnast G entered in S1 with entry_status=REGISTERED"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "DE", sanction_year: 2026, sanction_number: "USAG-2030-4001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s1_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S2", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s2_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A9010001", legal_name: "G", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
              captures: { g_id: $.data.id }
            - call: "POST /api/v1/sessions/${s1_id}/athlete-entries"
              payload: { gymnast_id: "${g_id}" }
              as: MeetDirector
          trigger:
            - call: "POST /api/v1/sessions/${s2_id}/athlete-entries"
              payload: { gymnast_id: "${g_id}" }
              as: MeetDirector
          assert:
            - "Response status == 409"
            - "error_id == ERR_GYMNAST_DOUBLE_ENTERED"

      - name: inquiry_resolution_consistency_upheld_requires_delta
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_INQUIRY_RESOLUTION_INCONSISTENT]"]
        distinguishing_aspect: "resolution=UPHELD with all deltas=0 returns 422 ERR_INQUIRY_RESOLUTION_INCONSISTENT"
        test_recipe:
          setup: ["Inquiry INQ UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "UPHELD + all-zero deltas -> 422 ERR_INQUIRY_RESOLUTION_INCONSISTENT"

  # ==========================================================================
  # Section: endpoints — CRUD, action endpoints, computed reads
  # ==========================================================================
  - section: endpoints
    instances:
      - name: live_scores_computed_read
        claim_type: computed_read
        grounds: ["endpoints[GET /api/v1/sessions/{session_id}/live-scores]"]
        distinguishing_aspect: "GET /sessions/{id}/live-scores returns PUBLISHED and FINAL scores only (DRAFT and VOID excluded)"
        test_recipe:
          setup: ["Session with 2 DRAFT, 3 PUBLISHED, 1 FINAL, 1 VOID scores"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/sessions/placeholder/live-scores"
              payload: {}
              as: Spectator
          assert:
            - "Response includes only scores with score_state IN {PUBLISHED, FINAL, UNDER_INQUIRY, INQUIRY_RESOLVED}"
            - "DRAFT and VOID excluded from public display"

      - name: score_amend_after_publish_rejected
        claim_type: action_endpoint_state_guard
        grounds: ["errors[ERR_SCORE_AMEND_AFTER_PUBLISH]"]
        distinguishing_aspect: "PUT /scores/{id} on PUBLISHED score returns 409 ERR_SCORE_AMEND_AFTER_PUBLISH; only DRAFT scores are amendable"
        test_recipe:
          setup: ["Score SC PUBLISHED"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "PUT on non-DRAFT -> 409 ERR_SCORE_AMEND_AFTER_PUBLISH"

  # ==========================================================================
  # Section: errors — every error code triggerable
  # ==========================================================================
  - section: errors
    instances:
      - name: error_inquiry_window_expired_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INQUIRY_WINDOW_EXPIRED]"]
        excluded_because:
          difficulty_instance: inquiry_window_exactly_at_deadline
          rationale: "Asserted as the failure path of the named §1.8 instance (boundary just past deadline)"

      - name: error_judge_conflict_of_interest_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_JUDGE_CONFLICT_OF_INTEREST]"]
        excluded_because:
          difficulty_instance: judge_safety_vs_temporal_availability_conflict
          rationale: "Asserted via judge_panel_selector eligibility filter in §1.8 priority-conflict instance"

      - name: error_stale_score_version_occ
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_SCORE_VERSION]", "concurrency_rules[score-publish-stale-score]"]
        distinguishing_aspect: "Publish with expected_score_version 1 less than current returns 412 ERR_STALE_SCORE_VERSION"
        test_recipe:
          setup: ["Score SC at version 2 (created then amended); publisher holds stale expected_score_version=1"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "OCC", sanction_year: 2026, sanction_number: "USAG-2031-0001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A9110001", legal_name: "G", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
              captures: { g_id: $.data.id }
            - call: "POST /api/v1/sessions/${s_id}/athlete-entries"
              payload: { gymnast_id: "${g_id}" }
              as: MeetDirector
              captures: { e_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/publish"
              payload: {}
              as: MeetDirector
            - call: "POST /api/v1/sessions/${s_id}/rotations/generate"
              payload: {}
              as: MeetDirector
              captures: { rot_id: "$.data[0].id" }
            - call: "POST /api/v1/judges"
              payload: { usag_judge_number: "J9110001", legal_name: "J", rating: "BREVET", affiliated_gym: "Neutral", availability_start: "2026-05-02T00:00:00Z", availability_end: "2026-05-03T00:00:00Z" }
              as: MeetReferee
              captures: { j_id: $.data.id }
            - call: "POST /api/v1/athlete-entries/${e_id}/scores"
              payload: { rotation_id: "${rot_id}", apparatus: "VAULT", difficulty_score: 5.0, execution_score: 8.0 }
              as: JudgePanelChief
              as_user_id: "${j_id}"
              captures: { sc_id: $.data.id, sc_v1: $.data.version }
            - call: "PUT /api/v1/scores/${sc_id}"
              payload: { execution_score: 8.5 }
              as: JudgePanelChief
              as_user_id: "${j_id}"
              captures: { sc_v2: $.data.version }
          trigger:
            - call: "POST /api/v1/scores/${sc_id}/publish"
              payload: { expected_score_version: "${sc_v1}" }
              as: JudgePanelChief
              as_user_id: "${j_id}"
          assert:
            - "Response status == 412"
            - "error_id == ERR_STALE_SCORE_VERSION"
            - "Score.${sc_id}.score_state remains DRAFT"

      - name: error_stale_session_version_occ
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_SESSION_VERSION]", "concurrency_rules[session-close-stale-session]"]
        distinguishing_aspect: "Session close with stale expected_session_version returns 412 ERR_STALE_SESSION_VERSION"
        test_recipe:
          setup: ["Session S at version N; director holds expected_session_version N-1"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "OCC2", sanction_year: 2026, sanction_number: "USAG-2031-0002", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s_id: $.data.id, s_v: $.data.version }
          trigger:
            - call: "POST /api/v1/sessions/${s_id}/close"
              payload: { expected_session_version: "${s_v} - 1" }
              as: MeetDirector
          assert:
            - "Response status == 412"
            - "error_id == ERR_STALE_SESSION_VERSION"

  # ==========================================================================
  # Section: rbac — exclusive ops, denial, segregation of duties
  # ==========================================================================
  - section: rbac
    instances:
      - name: coach_cannot_publish_meet
        claim_type: role_denial
        grounds: ["roles[MeetDirector]", "roles[Coach]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Coach role attempting POST /meets/{id}/publish (MeetDirector exclusive) returns 403 ERR_UNAUTHORIZED_ROLE"
        test_recipe:
          setup: ["Meet M in DRAFT"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "RBAC1", sanction_year: 2026, sanction_number: "USAG-2032-0001", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/coaches"
              payload: { usag_coach_number: "C9210001", legal_name: "C", affiliated_gym: "Metro", background_check_expiry: "2027-01-01T00:00:00Z", safety_cert_expiry: "2027-01-01T00:00:00Z" }
              as: MeetDirector
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /api/v1/meets/${m_id}/publish"
              payload: {}
              as: Coach
              as_user_id: "${c_id}"
          assert:
            - "Response status == 403"
            - "error_id == ERR_UNAUTHORIZED_ROLE"

      - name: segregation_of_duties_panel_chief_cannot_resolve_inquiry
        claim_type: segregation_of_duties
        grounds: ["roles[JudgePanelChief]", "roles[MeetReferee]"]
        distinguishing_aspect: "JudgePanelChief who published a score cannot resolve the inquiry on it (MeetReferee exclusive); role model = segregation_of_duties"
        test_recipe:
          setup: ["Judge J (as PanelChief) published Score SC; inquiry filed; J attempts to resolve"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "POST /inquiries/{id}/resolve with role=JudgePanelChief returns 403 ERR_UNAUTHORIZED_ROLE"
            - "Only MeetReferee role can resolve inquiries"

      - name: gate_attendant_cannot_void_ticket
        claim_type: role_denial
        grounds: ["roles[GateAttendant]", "roles[MeetDirector]"]
        distinguishing_aspect: "GateAttendant attempting POST /spectator-tickets/{id}/void (MeetDirector exclusive) returns 403"
        test_recipe:
          setup: ["Ticket T ISSUED"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: GateAttendant
          assert:
            - "Void attempt by GateAttendant returns 403 ERR_UNAUTHORIZED_ROLE"

      - name: spectator_read_get_live_scores
        claim_type: role_allows
        grounds: ["roles[Spectator]"]
        distinguishing_aspect: "Spectator role is permitted to GET /sessions/{id}/live-scores (read-only public surface)"
        test_recipe:
          setup: ["Meet M with Session S"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
            - call: "POST /api/v1/meets"
              payload: { meet_name: "RBAC4", sanction_year: 2026, sanction_number: "USAG-2032-0004", venue_name: "V", start_date: "2026-05-02T08:00:00Z", end_date: "2026-05-02T22:00:00Z" }
              as: MeetDirector
              captures: { m_id: $.data.id }
            - call: "POST /api/v1/meets/${m_id}/sessions"
              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /api/v1/sessions/${s_id}/live-scores"
              payload: {}
              as: Spectator
          assert:
            - "Response status == 200"
            - "response_type == 'array'"

  # ==========================================================================
  # Section: cross_cutting — OCC, cascades, dual variants, selector policy
  # ==========================================================================
  - section: cross_cutting
    instances:
      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[score-publish-stale-score]"]
        distinguishing_aspect: "Every mutation (create/amend/publish/void) increments Score.version by exactly 1"
        test_recipe:
          setup: ["Score created -> v=1"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "After PUT amend: version increments by 1"
            - "After publish: version increments by 1 again"

      - name: selector_policy_judge_panel_deterministic_tiebreak
        claim_type: selector_policy
        grounds: ["calculations.judge_panel_selector"]
        distinguishing_aspect: "When two judges have identical rating tier, usag_judge_number ASC is the deterministic tie-break (never id/UUID)"
        test_recipe:
          setup: ["Two BREVET judges J1 (J1111111), J2 (J2222222), both eligible; panel needs 1 more"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "Selector picks J1 (J1111111 < J2222222) deterministically"
            - "Decision uses usag_judge_number, never UUID id"

  # ==========================================================================
  # Section: consistency_model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_score_publish_visible
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "After POST /scores/{id}/publish returns 200, GET /scores/{id} immediately shows score_state=PUBLISHED and provisional_total computed (no eventual lag)"
        test_recipe:
          setup: ["Score SC in DRAFT"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: MeetDirector
          trigger:
            - call: "GET /api/v1/meets"
              payload: {}
              as: MeetDirector
          assert:
            - "Response to publish includes computed provisional_total"
            - "Subsequent GET returns the same provisional_total (no drift)"
