          Mode (c): circular-looking dependency — the penalty cap depends on
          total_contract_value_cents, which the same ChangeOrder that shifts
          the delivery date also increases. Pinned order: (1) contract value
          (all APPROVED COs) -> (2) cap -> (3) adjusted date (excusable events
          incl. the CO's own auto-event) -> (4) days -> (5) min. With CO
          +2,400,000 / +5 days and delivery 2026-09-10: value 14,745,673, cap
          1,474,567, committed 2026-09-06, 4 days -> 600,000. Evaluating days
