  - rule_id: boundary_precision_check
    instances:
      - name: notice_and_reporting_window_boundaries_are_half_open
        grounds:
          - validations[priority=62]
          - validations[priority=65]
          - state_machines.Claim.null_to_NOTICED
          - state_machines.CircumstanceReport.REPORTED_to_MATURED
          - calculations.reporting_deadline_derivation
          - entities.Claim.fields.notice_date
        distinguishing_aspect: |
          Three boundaries are probed one second apart on the same policy: the notice window's
          INCLUSIVE lower bound (period_start), its EXCLUSIVE upper bound (period_end), and the
          EXCLUSIVE reporting deadline period_end + erp_days. An implementation using <= on the
          upper bound admits the 2027-09-01T00:00:00Z notice, and one using < on the lower bound
          rejects the 2026-09-01T00:00:00Z notice; both mistakes are invisible unless the probes sit
          exactly on the instant.
        test_recipe:
          setup:
            - "One bound Policy of Vantiq Bio Inc, period 2026-09-01T00:00:00Z to 2027-09-01T00:00:00Z, erp_days 90, retroactive_date 2024-01-01, coverage_status INCEPTED (no ops run is ever invoked, so the policy never leaves an accepted state)."
            - "Two CircumstanceReports filed at 2026-09-01T00:00:00Z, so each carries notice_date 2026-09-01T00:00:00Z and reporting_deadline 2027-11-30T00:00:00Z (period_end + 90 days)."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
              captures: { sub_v: "$.data.version" }
            - call: "POST /dno/submissions/${sub_id}/quotes"
              payload: { expected_submission_version: "${sub_v}", offered_limit_usd: 10000000, offered_retention_usd: 250000, offered_side_c_sublimit_usd: 5000000, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
