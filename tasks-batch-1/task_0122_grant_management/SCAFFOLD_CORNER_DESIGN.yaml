            - "RestrictedFund.${c24_rf2_id}.allocated_cents == 0"

      - name: indirect_recovery_negotiated_vs_de_minimis_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.indirect_cost_recovery
        excluded_because:
          difficulty_instance: dual_variant_calc / indirect_recovery_negotiated_vs_de_minimis_on_financial_report
          rationale: "The NEGOTIATED-vs-DE_MINIMIS divergence on the same cost base is the depth instance for Rule 1."

  # ===========================================================================
  # SECTION 4 — Validations (violation->error / satisfaction->pass /
  # priority-ordering / pattern-specific)
  # ===========================================================================
  - section: validations
    instances:
      - name: allocation_plan_mismatch_returns_allocation_mismatch
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - calculations.drawdown_waterfall_allocation
          - errors[ERR_ALLOCATION_MISMATCH]
        distinguishing_aspect: |
          On disburse, an allocation_plan that does not match the server-derived waterfall line-for-line
          returns ERR_ALLOCATION_MISMATCH (422). With funds priority 1/2 budget 4000000/4000000 and a
          6000000 draw, the canonical waterfall is [4000000 to fund1, 2000000 to fund2]; a plan claiming
          [3000000, 3000000] mismatches.
        test_recipe:
          setup:
            - "ACTIVE Award; two funds priority 1/2 budget 4000000/4000000; a REQUESTED drawdown 6000000 with a deliberately wrong allocation_plan [3000000,3000000]."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C25", applicant_org_name: "Corner Org 25", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c25_app_id: $.data.id }
            - call: "POST /applications/${c25_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c25_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c25_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c25_award_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c25_award_id}", category: "PERSONNEL", budgeted_cents: 4000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { c25_rf1_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c25_award_id}", category: "TRAVEL", budgeted_cents: 4000000, priority_order: 2 }
              as: FinanceOfficer
              captures: { c25_rf2_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${c25_award_id}", amount_cents: 6000000, allocation_plan: [ { restricted_fund_id: "${c25_rf1_id}", amount_cents: 3000000 }, { restricted_fund_id: "${c25_rf2_id}", amount_cents: 3000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_c25"
              captures: { c25_dd_id: $.data.id }
          trigger:
            - call: "POST /drawdowns/${c25_dd_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_c25"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response error_id == ERR_ALLOCATION_MISMATCH"
            - "Drawdown.${c25_dd_id}.status == REQUESTED"
            - "RestrictedFund.${c25_rf1_id}.allocated_cents == 0"

      - name: invalid_period_end_not_after_start_returns_invalid_period
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - state_machines.NofoApplication.DRAFT_to_SUBMITTED
          - errors[ERR_INVALID_PERIOD]
        distinguishing_aspect: |
          On submit, period_end_date not strictly after period_start_date returns ERR_INVALID_PERIOD (422).
          An application with end == start (2026-01-01 == 2026-01-01) fails on submit; status stays DRAFT.
        test_recipe:
          setup:
            - "A DRAFT application whose period_end_date equals period_start_date."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C26", applicant_org_name: "Corner Org 26", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-01-01T00:00:00Z" }
              as: GrantWriter
              captures: { c26_app_id: $.data.id }
          trigger:
            - call: "POST /applications/${c26_app_id}/submit"
              payload: {}
              as: GrantWriter
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response error_id == ERR_INVALID_PERIOD"
            - "NofoApplication.${c26_app_id}.status == DRAFT"

      - name: duplicate_period_label_per_award_returns_duplicate
        claim_type: Aggregate validation
        grounds:
          - validations[priority=15]
          - entities.FinancialReport.fields.period_label
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: |
          Uniqueness: a second non-REJECTED FinancialReport with the same period_label on the same award
          returns ERR_DUPLICATE (409). Two reports both labeled "FY2026-Q1" on one award -> second create fails.
        test_recipe:
          setup:
            - "An ACTIVE Award with one DRAFT FinancialReport labeled FY2026-Q1 (non-REJECTED)."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C27", applicant_org_name: "Corner Org 27", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c27_app_id: $.data.id }
            - call: "POST /applications/${c27_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c27_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c27_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c27_award_id: $.data.id }
            - call: "POST /financial-reports"
              payload: { award_id: "${c27_award_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 1000000 } ] }
              as: FinanceOfficer
              captures: { c27_fr1_id: $.data.id }
          trigger:
            - call: "POST /financial-reports"
              payload: { award_id: "${c27_award_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "TRAVEL", amount_cents: 500000 } ] }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_DUPLICATE"

      - name: duplicate_restricted_fund_priority_order_returns_duplicate
        claim_type: Aggregate validation
        grounds:
          - validations[priority=15]
          - entities.RestrictedFund.fields.priority_order
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: |
          Uniqueness on a different field/endpoint than period_label: a second RestrictedFund with a
          priority_order already used on the same award returns ERR_DUPLICATE (409). Two funds both
          priority_order 1 on one award -> second create fails.
        test_recipe:
          setup:
            - "An ACTIVE Award with one RestrictedFund at priority_order 1."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C28", applicant_org_name: "Corner Org 28", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c28_app_id: $.data.id }
            - call: "POST /applications/${c28_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c28_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c28_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c28_award_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c28_award_id}", category: "PERSONNEL", budgeted_cents: 5000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { c28_rf1_id: $.data.id }
          trigger:
            - call: "POST /restricted-funds"
              payload: { award_id: "${c28_award_id}", category: "TRAVEL", budgeted_cents: 3000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_DUPLICATE"

      - name: missing_negotiated_rate_when_negotiated_returns_invalid_request
        claim_type: Conditional validation
        grounds:
          - validations[priority=14]
          - entities.IndirectCostRate.fields.negotiated_rate
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Conditional required field: POST /indirect-cost-rates with rate_type NEGOTIATED but no
          negotiated_rate returns ERR_INVALID_REQUEST (400). The same field is optional for DE_MINIMIS.
        test_recipe:
          setup:
            - "An ACTIVE Award."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C29", applicant_org_name: "Corner Org 29", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c29_app_id: $.data.id }
            - call: "POST /applications/${c29_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c29_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c29_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c29_award_id: $.data.id, c29_v0: $.data.version }
          trigger:
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${c29_award_id}", rate_type: "NEGOTIATED", base_type: "MTDC", expected_award_version: "${c29_v0}" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: existence_before_state_on_disburse_nonexistent_drawdown
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Existence (priority 3) wins over state (priority 4): disburse on a non-existent drawdown id
          returns ERR_NOT_FOUND (404), not a state error — the resource is resolved before any state check.
        test_recipe:
          setup:
            - "Empty DB (no drawdowns)."
          setup_api_calls: []
          trigger:
            - call: "POST /drawdowns/00000000-0000-4000-8000-000000000000/disburse"
              payload: {}
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: closeout_blocked_by_active_subaward_returns_closeout_preconditions
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=9]
          - state_machines.Award.PENDING_CLOSEOUT_to_CLOSED
          - errors[ERR_CLOSEOUT_PRECONDITIONS]
        distinguishing_aspect: |
          The closeout business_constraint (priority 9, no ACTIVE subaward) is enforced distinctly from the
          audit safety check: closing a PENDING_CLOSEOUT award that still has an ACTIVE subaward (and no
          audit obligations) returns ERR_CLOSEOUT_PRECONDITIONS (409); award stays PENDING_CLOSEOUT.
        test_recipe:
          setup:
            - "An award in PENDING_CLOSEOUT with one ACTIVE subaward and no required/unresolved audits."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C31", applicant_org_name: "Corner Org 31", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c31_app_id: $.data.id }
            - call: "POST /applications/${c31_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c31_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c31_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c31_award_id: $.data.id }
            - call: "POST /subawards"
              payload: { award_id: "${c31_award_id}", subrecipient_name: "Sub C31", subaward_amount_cents: 1000000, risk_tier: "LOW" }
              as: ProgramManager
              captures: { c31_sub_id: $.data.id }
            - call: "POST /subawards/${c31_sub_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /subawards/${c31_sub_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "GET /awards/${c31_award_id}"
              payload: {}
              as: AgencyOfficer
              captures: { c31_v_active: $.data.version }
            - call: "POST /awards/${c31_award_id}/initiate-closeout"
              payload: { expected_award_version: "${c31_v_active}" }
              as: AgencyOfficer
              captures: { c31_v_pc: $.data.version }
          trigger:
            - call: "POST /awards/${c31_award_id}/close"
              payload: { expected_award_version: "${c31_v_pc}" }
              as: AgencyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_CLOSEOUT_PRECONDITIONS"
            - "Award.${c31_award_id}.status == PENDING_CLOSEOUT"

  # ===========================================================================
  # SECTION 5 — Endpoints (action / computed-read / side-effect coverage)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: audit_finding_resolve_action_sets_status_resolved
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/audit-findings/{id}/resolve
          - entities.AuditFinding.fields.status
        distinguishing_aspect: |
          POST /audit-findings/{id}/resolve transitions an OPEN finding to RESOLVED; the finding's status
          is RESOLVED afterward. (This finding-level action is distinct from the audit-level resolve.)
        test_recipe:
          setup:
            - "An ACTIVE Award; a required SingleAudit with one OPEN MATERIAL_WEAKNESS finding."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C32", applicant_org_name: "Corner Org 32", requested_amount_cents: 100000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c32_app_id: $.data.id }
            - call: "POST /applications/${c32_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c32_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c32_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c32_award_id: $.data.id }
            - call: "POST /single-audits"
              payload: { award_id: "${c32_award_id}", fiscal_year: 2026, federal_expenditures_cents: 80000000 }
              as: Auditor
              captures: { c32_sa_id: $.data.id }
            - call: "POST /single-audits/${c32_sa_id}/findings"
              payload: { severity: "MATERIAL_WEAKNESS", questioned_cost_cents: 100000 }
              as: Auditor
              captures: { c32_f_id: $.data.id }
          trigger:
            - call: "POST /audit-findings/${c32_f_id}/resolve"
              payload: {}
              as: Auditor
          assert:
            - "AuditFinding.${c32_f_id}.status == RESOLVED"

      - name: get_financial_report_surfaces_computed_fields
        claim_type: Computed read
        grounds:
          - endpoints.GET_/financial-reports/{id}
          - entities.FinancialReport.fields.approved_direct_cents
          - entities.FinancialReport.fields.indirect_cost_cents
          - entities.FinancialReport.fields.reimbursable_cents
        distinguishing_aspect: |
          GET /financial-reports/{id} on an ACCEPTED INTERIM report surfaces the computed fields: with a
          single PERSONNEL line 10000000, a DE_MINIMIS 0.10 rate, and federal_share 0.80, approved_direct_cents
          == 10000000, indirect_cost_cents == 1000000, reimbursable_cents (provisional) == 8000000.
        test_recipe:
          setup:
            - "ACTIVE Award (federal_share 0.80); DE_MINIMIS rate; an INTERIM report PERSONNEL 10000000 accepted."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C33", applicant_org_name: "Corner Org 33", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c33_app_id: $.data.id }
            - call: "POST /applications/${c33_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c33_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c33_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c33_award_id: $.data.id, c33_v0: $.data.version }
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${c33_award_id}", rate_type: "DE_MINIMIS", base_type: "MTDC", expected_award_version: "${c33_v0}" }
              as: FinanceOfficer
            - call: "POST /financial-reports"
              payload: { award_id: "${c33_award_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 10000000 } ] }
              as: FinanceOfficer
              captures: { c33_fr_id: $.data.id }
            - call: "POST /financial-reports/${c33_fr_id}/certify"
              payload: {}
              as: FinanceOfficer
            - call: "POST /financial-reports/${c33_fr_id}/accept"
              payload: {}
              as: AgencyOfficer
          trigger:
            - call: "GET /financial-reports/${c33_fr_id}"
              payload: {}
              as: FinanceOfficer
              captures: { c33_reimb: $.data.reimbursable_cents }
          assert:
            - "FinancialReport.${c33_fr_id}.approved_direct_cents == 10000000"
            - "FinancialReport.${c33_fr_id}.indirect_cost_cents == 1000000"
            - "FinancialReport.${c33_fr_id}.reimbursable_cents == 8000000"

      - name: audit_findings_reverse_reachability_list_by_single_audit
        claim_type: Computed read
        grounds:
          - endpoints.GET_/single-audits/{id}/findings
          - entities.AuditFinding.fields.single_audit_id
        distinguishing_aspect: |
          GET /single-audits/{id}/findings is the reverse-reachability channel for AuditFinding.single_audit_id:
          two findings recorded under one audit are both returned (a cascade-free discovery path for findings).
        test_recipe:
          setup:
            - "An ACTIVE Award; a required SingleAudit with two findings recorded."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C34", applicant_org_name: "Corner Org 34", requested_amount_cents: 100000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c34_app_id: $.data.id }
