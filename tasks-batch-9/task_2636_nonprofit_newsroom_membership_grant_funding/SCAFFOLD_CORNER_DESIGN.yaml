          Dual control is enforced inside a single role: the DevelopmentOfficer who solicited the
          offer is refused at acceptance, while a second DevelopmentOfficer with the identical
          role completes the very same call.
        test_recipe:
          setup: "A CLEARED foundation and an UNDESIGNATED 400000-cent gift offer solicited by user-do-1 and cleared by user-ed-1."
          setup_api_calls:
            - call: "POST /fiscal-periods"
