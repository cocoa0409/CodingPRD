  - rule_id: boundary_precision_check
    instances:
      - name: strike_threshold_exact_value_restricts
        grounds:
          - calculations.no_show_strike_restriction
          - endpoints[POST /conf/bookings/{id}/attendance]
        distinguishing_aspect: |
