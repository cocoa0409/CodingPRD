        payload: {}
        as: Customer
        as_user_id: ${vm_cust}
      - call: POST /vehicle-hub/orders/${vm_ord1}/appointments
        payload:
          expected_order_version: ${orders_v1}
          market_code: ATL-A
          vending_site_code: ATL-VM-1
          start_at: '2026-09-02T14:00:00Z'
          end_at: '2026-09-02T15:00:00Z'
        as: Customer
