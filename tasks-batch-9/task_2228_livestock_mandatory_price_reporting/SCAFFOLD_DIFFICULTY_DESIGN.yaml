  - rule_id: transitive_cascade
    instances:

      - name: audit_material_finding_four_hop_chain
        grounds:
          - state_machines.AuditCase.FIELDWORK_to_DISCREPANCY
          - state_machines.Submission.ACCEPTED_to_UNDER_CORRECTION
          - state_machines.MarketReport.AGG_COMPUTED_to_AGG_STALE
          - state_machines.MarketReport.PUB_PUBLISHED_to_PUB_WITHDRAWN
          - state_machines.ReportingWindow.PUBLISHED_to_LOCKED
          - calculations.window_head_ledger
        distinguishing_aspect: |
          Triggering transition is AuditCase FIELDWORK -> DISCREPANCY, and the chain is
          four links deep, each link caused strictly by the previous one:
          (1) the material finding forces Submission ACCEPTED -> UNDER_CORRECTION;
          (2) because that submission left ACCEPTED, the window ledger is recomputed and
              the report goes AGG_COMPUTED -> AGG_STALE;
          (3) because aggregation went stale while published, PUB_PUBLISHED -> PUB_WITHDRAWN
              (and disclosure_state is forced back to UNREVIEWED);
          (4) because no PUBLISHED report is left on the window, ReportingWindow
              PUBLISHED -> LOCKED. A single audit verdict un-publishes a market report.
