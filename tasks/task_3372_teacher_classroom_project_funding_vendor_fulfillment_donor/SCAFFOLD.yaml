# =============================================================================
# SCAFFOLD.yaml — Teacher Classroom Project Funding, Vendor Fulfillment &
# Donor Attribution (DonorsChoose-style)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Teacher Classroom Project Funding, Vendor Fulfillment & Donor Attribution (DonorsChoose): teacher project creation with itemized requests drawn from approved vendor catalogs and screening for eligibility, project vetting for appropriateness, cost reasonableness and school verification of teacher employment, donation collection with partial funding, expiration deadlines and donor choice about reallocation, vendor purchase orders issued after full funding with direct shipment to the school, teacher thank-you and impact reporting requirements before further projects can be posted, corporate and foundation matching campaigns targeted to subject areas, schools or geographies, fraud detection on materials diverted from classrooms with account suspension, equity-focused funding programs prioritizing high-poverty schools

domain_name: teacher-classroom-funding
api_prefix: /giving

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code, uppercase" }
      - { name: district, type: string, source: input, description: "School district name" }
      - { name: poverty_pct, type: number, source: input, description: "Percentage of students in poverty, 0.0–100.0 inclusive, one decimal place", constraints: "0.0 <= poverty_pct <= 100.0" }
      - { name: ell_pct, type: number, source: input, description: "Percentage of English-language-learner students, 0.0–100.0 inclusive, one decimal place", constraints: "0.0 <= ell_pct <= 100.0" }
      - { name: equity_score_banded, type: integer, source: computed, description: "Step function of poverty_pct: >=90 → 100; >=75 → 80; >=50 → 50; else 10 (see school_equity_scores)" }
      - { name: equity_score_weighted, type: number, source: computed, description: "round(0.7*poverty_pct + 0.3*ell_pct, 1) — diverges from banded (see school_equity_scores)" }

  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; employing school" }
      - { name: full_name, type: string, source: input, description: "Teacher full name" }
      - { name: email, type: string, source: input, description: "Teacher email; unique across teachers", constraints: "unique" }
      - { name: subjects_taught, type: array, source: input, description: "Array of subject enum values the teacher teaches", default: [] }
      - { name: employment_status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | SUSPENDED" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor legal name" }
      - { name: ship_from_state, type: string, source: input, description: "Two-letter state code orders ship from" }
      - { name: contact_email, type: string, source: input, description: "Vendor contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; owning vendor" }
      - { name: sku, type: string, source: input, description: "Vendor-scoped SKU; unique per vendor", constraints: "unique within vendor_id" }
      - { name: name, type: string, source: input, description: "Item display name" }
      - { name: category, type: enum, source: input, description: "BOOKS | TECHNOLOGY | FURNITURE | SUPPLIES | LAB_EQUIPMENT | SPORTS" }
      - { name: subject_tags, type: array, source: input, description: "Array of subject enum values this item supports", default: [] }
      - { name: unit_price_cents, type: integer, source: input, description: "Current catalog unit price in cents; mutable via PATCH", constraints: ">= 1" }
      - { name: weight_oz, type: integer, source: input, description: "Shipping weight per unit in ounces", constraints: ">= 1" }
      - { name: shipping_zone, type: enum, source: input, description: "A | B | C — zone rate 120/180/260 cents per pound respectively" }
      - { name: fragile, type: boolean, source: input, description: "True if item requires fragile handling", default: false }
      - { name: max_quantity_per_project, type: integer, source: input, description: "Per-project quantity cap; null means 99", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: teacher_id, type: string, source: system, description: "FK -> Teacher.id; owning teacher, taken from X-User-ID at creation" }
      - { name: school_id, type: string, source: system, description: "FK -> School.id; denormalized from Teacher.school_id at creation, never changes" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: description, type: string, source: input, description: "Project description" }
      - { name: subject, type: enum, source: input, description: "MATH | SCIENCE | LITERACY | ARTS | SOCIAL_STUDIES | HEALTH_PE | OTHER" }
      - { name: grade_band, type: enum, source: input, description: "K_2 | G3_5 | G6_8 | G9_12" }
      - { name: funding_window_days, type: integer, source: input, description: "Days the project stays in FUNDING once vetted", constraints: "30 <= funding_window_days <= 180" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | VETTING | RETURNED | REJECTED | FUNDING | FUNDED | EXPIRED | CANCELLED | FULFILLED | CLOSED" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Draft-face quote: current catalog unit prices x qty + current per-vendor shipping quote; recomputed on every read while status IN {DRAFT, RETURNED}; null after submit" }
      - { name: pinned_items_total_cents, type: integer, source: computed, description: "Sum over ProjectItems of pinned_unit_price_cents*quantity, frozen at submit; null before submit" }
      - { name: pinned_shipping_total_cents, type: integer, source: computed, description: "Sum of per-vendor shipping quotes computed over pinned lines at submit; null before submit" }
      - { name: goal_cents, type: integer, source: computed, description: "pinned_items_total_cents + pinned_shipping_total_cents, frozen at submit; must satisfy 10000 <= goal_cents <= 200000" }
      - { name: funded_cents, type: integer, source: computed, description: "Sum of amount_cents + matched_cents over donations in {CAPTURED, CHOICE_PENDING} (see funding_progress)" }
      - { name: funding_started_at, type: datetime, source: system, description: "Logical-clock timestamp when project entered FUNDING; null until then" }
      - { name: funding_deadline, type: datetime, source: computed, description: "funding_started_at + funding_window_days; expires when logical clock >= deadline" }
      - { name: screened_by_id, type: string, source: system, description: "X-User-ID of the Reviewer who last approved SCREEN; null until first screen approval" }
      - { name: vetted_by_id, type: string, source: system, description: "X-User-ID of the Reviewer who approved VET; null until vet approval" }

  - name: ProjectItem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; requested catalog item" }
      - { name: quantity, type: integer, source: input, description: "Units requested", constraints: "1 <= quantity <= min(max_quantity_per_project, 99) with null cap treated as 99" }
      - { name: pinned_unit_price_cents, type: integer, source: system, description: "CatalogItem.unit_price_cents snapshot taken at project submit; null while project IN {DRAFT, RETURNED}" }

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Donor display name" }
      - { name: email, type: string, source: input, description: "Donor email; unique across donors", constraints: "unique" }
      - { name: lifetime_donated_cents, type: integer, source: computed, description: "Sum of amount_cents over ALL donations ever created by this donor (any status); never decreases" }
      - { name: lifetime_refunded_cents, type: integer, source: computed, description: "Sum of amount_cents over this donor's REFUNDED donations" }
      - { name: lifetime_reallocated_cents, type: integer, source: computed, description: "Sum of amount_cents over this donor's REALLOCATED donations" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; funded project" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; null when kind == EQUITY_GRANT" }
      - { name: kind, type: enum, source: system, description: "DONOR | EQUITY_GRANT" }
      - { name: amount_cents, type: integer, source: input, description: "Donation principal in cents (donor's own money, or equity allocation)", constraints: ">= 100" }
      - { name: match_campaign_id, type: string, source: input, description: "FK -> MatchCampaign.id; optional explicit match campaign", default: null }
      - { name: matched_cents, type: integer, source: computed, description: "Match funds applied to this donation (see match_allocation); 0 when unmatched" }
      - { name: equity_fund_id, type: string, source: system, description: "FK -> EquityFund.id; set on EQUITY_GRANT donations and on REALLOCATED donations (the receiving fund), else null" }
      - { name: status, type: enum, source: system, description: "CAPTURED | CHOICE_PENDING | REFUNDED | REALLOCATED" }
      - { name: choice_deadline, type: datetime, source: system, description: "Set when entering CHOICE_PENDING: sweep timestamp + 14 days; unchosen donations auto-refund once logical clock >= choice_deadline" }
      - { name: refund_reason, type: enum, source: system, description: "EXPIRED_CHOICE | EXPIRED_AUTO | FRAUD_CLAWBACK; null unless status == REFUNDED" }

  - name: MatchCampaign
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_name, type: string, source: input, description: "Corporate or foundation sponsor name" }
      - { name: match_ratio, type: number, source: input, description: "Match ratio, e.g. 0.5 or 1.0", constraints: "0 < match_ratio <= 2.0" }
      - { name: budget_cents, type: integer, source: input, description: "Total match budget", constraints: ">= 1" }
      - { name: matched_so_far_cents, type: integer, source: computed, description: "Sum of matched_cents currently outstanding against this campaign" }
      - { name: remaining_budget_cents, type: integer, source: computed, description: "budget_cents - matched_so_far_cents; restored by clawbacks" }
      - { name: min_donation_cents, type: integer, source: input, description: "Minimum donation amount_cents to qualify", default: 0 }
      - { name: target_type, type: enum, source: input, description: "SCHOOL | SUBJECT | STATE" }
      - { name: target_value, type: string, source: input, description: "School id when SCHOOL; subject enum when SUBJECT; state code when STATE" }
      - { name: starts_at, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Half-open window end (exclusive); active iff starts_at <= now < ends_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | CLOSED" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project being fulfilled" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; fulfilling vendor" }
      - { name: line_items, type: array, source: system, description: "Snapshot array of {catalog_item_id, sku, quantity, pinned_unit_price_cents} for this vendor, sorted by catalog_item created_at ASC" }
      - { name: line_total_cents, type: integer, source: computed, description: "Sum of pinned_unit_price_cents*quantity over line_items" }
      - { name: shipping_fee_cents, type: integer, source: computed, description: "po_shipping_quote over line_items at issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED | SHIPPED | DELIVERED | DIVERSION_REPORTED | CANCELLED" }
      - { name: tracking_number, type: string, source: input, description: "Carrier tracking number; required on SHIP" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance (project FUNDED transition)" }
      - { name: ship_by_due, type: datetime, source: computed, description: "issued_at + 10 days (VENDOR_SHIP_SLA_DAYS)" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock timestamp of SHIP; null until shipped" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of DELIVER; null until delivered" }

  - name: ThankYouPackage
    parent: null
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; exactly one package per funded project", constraints: "unique per project_id" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED" }
      - { name: thank_you_note, type: string, source: input, description: "Donor thank-you note; minimum 20 characters on submit" }
      - { name: impact_report, type: string, source: input, description: "Classroom impact report; minimum 40 characters on submit" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission; null while PENDING" }

  - name: FraudCase
    parent: null
    common_fields: true
    fields:
      - { name: teacher_id, type: string, source: system, description: "FK -> Teacher.id; accused teacher" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project whose materials were diverted" }
      - { name: purchase_order_id, type: string, source: system, description: "FK -> PurchaseOrder.id; diverted shipment" }
      - { name: reason, type: string, source: system, description: "Free-text reason copied from the diversion report" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | DISMISSED" }

  - name: EquityFund
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code this fund serves" }
      - { name: subject, type: enum, source: input, description: "Optional subject restriction; null means any subject", default: null }
      - { name: min_poverty_pct, type: number, source: input, description: "School poverty_pct must be >= this to qualify (boundary is inclusive)", constraints: "0.0 <= min_poverty_pct <= 100.0" }
      - { name: budget_cents, type: integer, source: input, description: "Total program budget", constraints: ">= 1" }
      - { name: remaining_cents, type: integer, source: computed, description: "budget_cents minus allocations granted; reallocated expired donations ADD to this balance" }
      - { name: window_start, type: datetime, source: input, description: "Closed-interval window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Closed-interval window end (inclusive); allocatable iff window_start <= now <= window_end" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | CLOSED" }

# =============================================================================
# §1.2 State Machine Table (8 machines)
# =============================================================================
state_machines:
  - entity: Teacher
    field: employment_status
    initial_state: PENDING_VERIFICATION
    terminal_states: []
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /giving/teachers/{teacher_id}/employment-review with action=VERIFY"
        actor: PlatformAdmin
        preconditions:
          - "Teacher must be PENDING_VERIFICATION (ERR_INVALID_STATE)"
        side_effects:
          - "Teacher may now create projects"
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /giving/teachers/{teacher_id}/employment-review with action=REINSTATE"
        actor: PlatformAdmin
        preconditions:
          - "Teacher must be SUSPENDED (ERR_INVALID_STATE)"
          - "No FraudCase for this teacher in OPEN status (ERR_FRAUD_CASE_ALREADY_OPEN)"
        side_effects:
          - "Teacher may create projects again (thank-you gate still applies)"
      - from: VERIFIED
        to: SUSPENDED
        trigger: "system (cascade from FraudCase CONFIRMED resolution)"
        actor: system
        preconditions: []
        side_effects:
          - "Teacher's projects in {DRAFT, IN_REVIEW, VETTING, RETURNED, FUNDING, FUNDED} cascade to CANCELLED"
          - "CAPTURED or CHOICE_PENDING donations on those projects cascade to REFUNDED with refund_reason=FRAUD_CLAWBACK"

  - entity: Project
    field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED, CANCELLED, CLOSED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /giving/projects/{project_id}/submit"
        actor: Teacher
        preconditions:
          - "Project must be DRAFT or RETURNED (ERR_INVALID_STATE)"
          - "expected_project_version must match current version (ERR_STALE_VERSION)"
          - "At least one ProjectItem exists (ERR_NO_ITEMS)"
          - "Computed goal_cents within [10000, 200000] (ERR_GOAL_OUT_OF_RANGE)"
          - "Teacher employment_status == VERIFIED (ERR_TEACHER_NOT_VERIFIED); not SUSPENDED (ERR_TEACHER_SUSPENDED)"
        side_effects:
          - "Each ProjectItem.pinned_unit_price_cents := CatalogItem.unit_price_cents (price pin)"
          - "pinned_items_total_cents, pinned_shipping_total_cents, goal_cents frozen"
          - "provisional_total_cents := null"
      - from: RETURNED
        to: IN_REVIEW
        trigger: "POST /giving/projects/{project_id}/submit"
        actor: Teacher
        preconditions:
          - "Same as DRAFT -> IN_REVIEW (revision loop: re-pin prices, re-check goal)"
        side_effects:
          - "Same as DRAFT -> IN_REVIEW; screened_by_id/vetted_by_id cleared"
      - from: IN_REVIEW
        to: VETTING
        trigger: "POST /giving/projects/{project_id}/review with stage=SCREEN, outcome=APPROVE"
        actor: Reviewer
        preconditions:
          - "Project must be IN_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "screened_by_id := acting Reviewer X-User-ID"
      - from: IN_REVIEW
        to: RETURNED
        trigger: "POST /giving/projects/{project_id}/review with stage=SCREEN, outcome=RETURN"
        actor: Reviewer
        preconditions:
          - "Project must be IN_REVIEW (ERR_INVALID_STATE)"
        side_effects: []
      - from: VETTING
        to: FUNDING
        trigger: "POST /giving/projects/{project_id}/review with stage=VET, outcome=APPROVE"
        actor: Reviewer
        preconditions:
          - "Project must be VETTING (ERR_INVALID_STATE)"
          - "Acting Reviewer X-User-ID != screened_by_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "vetted_by_id := acting Reviewer X-User-ID"
          - "funding_started_at := logical clock now; funding_deadline := now + funding_window_days"
      - from: VETTING
        to: RETURNED
        trigger: "POST /giving/projects/{project_id}/review with stage=VET, outcome=RETURN"
        actor: Reviewer
        preconditions:
          - "Project must be VETTING (ERR_INVALID_STATE)"
          - "Acting Reviewer X-User-ID != screened_by_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: VETTING
        to: REJECTED
        trigger: "POST /giving/projects/{project_id}/review with stage=VET, outcome=REJECT"
        actor: Reviewer
        preconditions:
          - "Project must be VETTING (ERR_INVALID_STATE)"
          - "Acting Reviewer X-User-ID != screened_by_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: FUNDING
        to: FUNDED
        trigger: "system (automatic when a donation or equity allocation makes funded_cents >= goal_cents; boundary is inclusive)"
        actor: system
        preconditions: []
        side_effects:
          - "One PurchaseOrder is auto-issued per distinct vendor among pinned ProjectItems (see po_issuance)"
          - "One ThankYouPackage is auto-created with status=PENDING for this project"
      - from: FUNDING
        to: EXPIRED
        trigger: "system (POST /_sweeps/expiration_run when logical clock >= funding_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "Each CAPTURED donation -> CHOICE_PENDING with choice_deadline := sweep time + 14 days"
          - "Each such donation's matched_cents clawed back to its MatchCampaign (matched_so_far_cents -= m, remaining_budget_cents += m); EXHAUSTED campaign flips back to ACTIVE if its window is still open"
      - from: FUNDED
        to: FULFILLED
        trigger: "system (automatic when every PurchaseOrder of the project reaches DELIVERED)"
        actor: system
        preconditions: []
        side_effects:
          - "Thank-you gate now applies to the teacher (FULFILLED project with PENDING package blocks POST /giving/projects)"
      - from: FULFILLED
        to: CLOSED
        trigger: "system (automatic when the project's ThankYouPackage reaches SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "system (cascade from FraudCase CONFIRMED on the teacher)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "system (cascade from FraudCase CONFIRMED on the teacher)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VETTING
        to: CANCELLED
        trigger: "system (cascade from FraudCase CONFIRMED on the teacher)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: CANCELLED
        trigger: "system (cascade from FraudCase CONFIRMED on the teacher)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FUNDING
        to: CANCELLED
        trigger: "system (cascade from FraudCase CONFIRMED on the teacher)"
        actor: system
        preconditions: []
        side_effects:
          - "CAPTURED/CHOICE_PENDING donations on this project -> REFUNDED (refund_reason=FRAUD_CLAWBACK); matched_cents clawed back to MatchCampaigns"
          - "This project's PurchaseOrders in {ISSUED, SHIPPED} -> CANCELLED"
      - from: FUNDED
        to: CANCELLED
        trigger: "system (cascade from FraudCase CONFIRMED on the teacher)"
        actor: system
        preconditions: []
        side_effects:
          - "CAPTURED/CHOICE_PENDING donations on this project -> REFUNDED (refund_reason=FRAUD_CLAWBACK); matched_cents clawed back to MatchCampaigns"
          - "This project's PurchaseOrders in {ISSUED, SHIPPED} -> CANCELLED; PurchaseOrders in {DELIVERED, DIVERSION_REPORTED} are left untouched as evidence"

  - entity: Donation
    field: status
    initial_state: CAPTURED
    terminal_states: [REFUNDED, REALLOCATED]
    transitions:
      - from: CAPTURED
        to: CHOICE_PENDING
        trigger: "system (cascade from project FUNDING -> EXPIRED sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "choice_deadline := sweep timestamp + 14 days"
          - "matched_cents clawed back to MatchCampaign (budget restored)"
      - from: CHOICE_PENDING
        to: REFUNDED
        trigger: "POST /giving/donations/{donation_id}/reallocation-choice with choice=REFUND"
        actor: Donor
        preconditions:
          - "Donation must be CHOICE_PENDING (ERR_INVALID_STATE)"
          - "expected_donation_version must match (ERR_STALE_VERSION)"
          - "Logical clock < choice_deadline (ERR_CHOICE_WINDOW_EXPIRED)"
          - "Acting donor must own the donation (ERR_FORBIDDEN)"
        side_effects:
          - "refund_reason := EXPIRED_CHOICE"
          - "project.funded_cents -= amount_cents + 0 (match already clawed at expiry)"
          - "donor.lifetime_refunded_cents += amount_cents"
      - from: CHOICE_PENDING
        to: REFUNDED
        trigger: "system (POST /_sweeps/expiration_run when logical clock >= choice_deadline and still CHOICE_PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "refund_reason := EXPIRED_AUTO"
          - "project.funded_cents -= amount_cents"
          - "donor.lifetime_refunded_cents += amount_cents"
      - from: CHOICE_PENDING
        to: REALLOCATED
        trigger: "POST /giving/donations/{donation_id}/reallocation-choice with choice=REALLOCATE"
        actor: Donor
        preconditions:
          - "Donation must be CHOICE_PENDING (ERR_INVALID_STATE)"
          - "expected_donation_version must match (ERR_STALE_VERSION)"
          - "Logical clock < choice_deadline (ERR_CHOICE_WINDOW_EXPIRED)"
          - "Acting donor must own the donation (ERR_FORBIDDEN)"
          - "equity_fund_id must reference an EquityFund with status==ACTIVE and window covering now (ERR_INVALID_REALLOCATION_TARGET)"
        side_effects:
          - "equity_fund.remaining_cents += amount_cents"
          - "donor.lifetime_reallocated_cents += amount_cents"
          - "project.funded_cents -= amount_cents"
      - from: CAPTURED
        to: REFUNDED
        trigger: "system (cascade from FraudCase CONFIRMED on the project's teacher)"
        actor: system
        preconditions: []
        side_effects:
          - "refund_reason := FRAUD_CLAWBACK"
          - "matched_cents clawed back to MatchCampaign (matched_so_far_cents -= m, remaining_budget_cents += m)"
          - "donor.lifetime_refunded_cents += amount_cents"
          - "project.funded_cents -= amount_cents + matched_cents"

  - entity: PurchaseOrder
    field: status
    initial_state: ISSUED
    terminal_states: [DELIVERED, DIVERSION_REPORTED, CANCELLED]
    transitions:
      - from: ISSUED
        to: SHIPPED
        trigger: "POST /giving/purchase-orders/{po_id}/advance with action=SHIP"
        actor: Vendor
        preconditions:
          - "PO must be ISSUED (ERR_INVALID_STATE)"
          - "Acting X-User-ID must equal po.vendor_id (ERR_FORBIDDEN)"
          - "Vendor.status == ACTIVE (ERR_INVALID_STATE)"
          - "tracking_number required (ERR_INVALID_REQUEST)"
        side_effects:
          - "shipped_at := logical clock now"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /giving/purchase-orders/{po_id}/advance with action=DELIVER"
        actor: Teacher
        preconditions:
          - "PO must be SHIPPED (ERR_INVALID_STATE)"
          - "Actor must be the project's owning teacher or PlatformAdmin (ERR_FORBIDDEN)"
        side_effects:
          - "delivered_at := logical clock now"
          - "If all of the project's POs are now DELIVERED: project FUNDED -> FULFILLED (bubble up)"
      - from: SHIPPED
        to: DIVERSION_REPORTED
        trigger: "POST /giving/purchase-orders/{po_id}/advance with action=REPORT_DIVERSION"
        actor: PlatformAdmin
        preconditions:
          - "PO must be SHIPPED (ERR_INVALID_STATE)"
          - "No OPEN FraudCase may already exist for this teacher (ERR_FRAUD_CASE_ALREADY_OPEN)"
        side_effects:
          - "A FraudCase is created: status=OPEN, teacher/project/PO linked, reason copied from request"

  - entity: MatchCampaign
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when remaining_budget_cents reaches 0 after a match)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (automatic when a clawback restores remaining_budget_cents > 0 while window still open)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "system (POST /_sweeps/expiration_run when logical clock >= ends_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: CLOSED
        trigger: "system (POST /_sweeps/expiration_run when logical clock >= ends_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FraudCase
    field: status
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /giving/fraud-cases/{case_id}/resolve with outcome=CONFIRMED"
        actor: PlatformAdmin
        preconditions:
          - "Case must be OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "Teacher -> SUSPENDED"
          - "Teacher's non-terminal pipeline projects -> CANCELLED; their donations refunded with match clawback; their open POs CANCELLED (full cascade, see fraud_clawback)"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /giving/fraud-cases/{case_id}/resolve with outcome=DISMISSED"
        actor: PlatformAdmin
        preconditions:
          - "Case must be OPEN (ERR_INVALID_STATE)"
        side_effects: []

  - entity: EquityFund
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (automatic when remaining_cents reaches 0 after an allocation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (automatic when a reallocated donation raises remaining_cents > 0 while window still covers now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "system (POST /_sweeps/expiration_run when logical clock > window_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: CLOSED
        trigger: "system (POST /_sweeps/expiration_run when logical clock > window_end)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ThankYouPackage
    field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /giving/projects/{project_id}/thank-you-package"
        actor: Teacher
        preconditions:
          - "Package must be PENDING (ERR_INVALID_STATE)"
          - "Actor must be the project's owning teacher (ERR_FORBIDDEN)"
          - "Project must be FULFILLED (ERR_INVALID_STATE)"
          - "thank_you_note >= 20 chars and impact_report >= 40 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "submitted_at := logical clock now"
          - "Project FULFILLED -> CLOSED (bubble up)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: project-edit-stale-version
    parent_entity: Project
    write_endpoint: "POST /giving/projects/{project_id}/items"
    occ_field: expected_project_version
    description: |
      Adding a ProjectItem to a DRAFT or RETURNED project whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another item add or a submit has legitimately changed the
      project's item set and totals, so the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: project-submit-stale-version
    parent_entity: Project
    write_endpoint: "POST /giving/projects/{project_id}/submit"
    occ_field: expected_project_version
    description: |
      Submitting a project against a version the client observed before the
      latest edit is rejected; the submit pins prices and freezes the goal, so
      it must be based on the current item set.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: donation-choice-stale-version
    parent_entity: Donation
    write_endpoint: "POST /giving/donations/{donation_id}/reallocation-choice"
    occ_field: expected_donation_version
    description: |
      Recording a reallocation choice against a donation whose version has
      advanced since the client last observed it (e.g. the sweep bumped it
      into CHOICE_PENDING with a fresh choice_deadline) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: project_cost_quote
    trigger: "read of a DRAFT/RETURNED project (provisional face); submit (pinned face)"
    algorithm: aggregation
    formula: |
      provisional_total_cents = sum(ProjectItem.quantity * CatalogItem.unit_price_cents
                                    over the project's items, at CURRENT catalog prices)
                                + sum(po_shipping_quote over each distinct vendor's current lines)
      pinned face at submit: same shape but every unit price is the value of
      CatalogItem.unit_price_cents at the submit instant, copied onto
      ProjectItem.pinned_unit_price_cents; goal_cents = pinned_items_total + pinned_shipping_total.
    input_set: "ProjectItems of the project; current CatalogItem rows (provisional) or pinned snapshots (pinned)"
    constants:
      GOAL_MIN_CENTS: 10000
      GOAL_MAX_CENTS: 200000
    precision: "integer cents; no rounding"
    variants:
      - name: provisional
        when: "project status IN {DRAFT, RETURNED}"
        difference: "reflects live catalog prices — a PATCH to CatalogItem.unit_price_cents moves it"
      - name: pinned
        when: "at submit and forever after"
        difference: "frozen at submit-time prices — later catalog PATCHes leave pinned totals and goal_cents unchanged"

  - name: school_equity_scores
    trigger: "School creation; read; equity eligibility and ranking"
    algorithm: weighted_scoring
    formula: |
      banded   = 100 if poverty_pct >= 90.0
                 80 if poverty_pct >= 75.0
                 50 if poverty_pct >= 50.0
                 else 10
      weighted = round(0.7 * poverty_pct + 0.3 * ell_pct, 1)   # round_half_up to 1 decimal
    input_set: "the School row itself"
    constants:
      POVERTY_WEIGHT: 0.7
      ELL_WEIGHT: 0.3
      BAND_HIGH: 90.0
      BAND_MID: 75.0
      BAND_LOW: 50.0
    precision: "weighted: 1 decimal place, round_half_up"
    variants:
      - name: banded
        when: "equity ELIGIBILITY checks and reporting"
        difference: "step function — plateaus: poverty 75.0 and 89.9 both score 80"
      - name: weighted
        when: "equity allocation RANKING"
        difference: "continuous blend with ell_pct — can rank a lower-poverty school above a higher-poverty one"

  - name: po_shipping_quote
    trigger: "PO auto-issuance at FUNDED; provisional quote while DRAFT/RETURNED"
    algorithm: tiered_pricing
    formula: |
      Given the vendor's lines (qty, weight_oz, shipping_zone, fragile):
        total_oz  = sum(quantity * weight_oz)
        tier_base = 299 if total_oz <= 32; 599 if total_oz <= 128; else 899
        zone_rate = max over lines of zone rate (A=120, B=180, C=260 cents per pound)
        pounds    = ceil(total_oz / 16)
        raw       = tier_base + pounds * zone_rate + (350 if any line fragile else 0)
        fee       = min(4999, max(199, raw))
    input_set: "the lines of ONE vendor within one project"
    constants:
      TIER1_MAX_OZ: 32
      TIER1_BASE_CENTS: 299
      TIER2_MAX_OZ: 128
      TIER2_BASE_CENTS: 599
      TIER3_BASE_CENTS: 899
      ZONE_A_RATE: 120
      ZONE_B_RATE: 180
      ZONE_C_RATE: 260
      FRAGILE_FLAT_CENTS: 350
      FEE_MIN_CENTS: 199
      FEE_CAP_CENTS: 4999
    precision: "integer cents; pounds via ceil; clamp via nested min/max"
    note: "Combinatorial mode (a): >=3 inputs (weight tiers, zone max, fragile flag) with nested min/max clamp and conditional branch"

  - name: match_allocation
    trigger: "donation creation with a match_campaign_id"
    algorithm: aggregation
    formula: |
      Per donation, at creation:
        raw_match = amount_cents * match_ratio
        matched_cents = min(round_half_up(raw_match), campaign.remaining_budget_cents)
      Then: campaign.matched_so_far_cents += matched_cents;
            campaign.remaining_budget_cents -= matched_cents.
      ROUNDING ORDER IS PINNED: round each donation's match FIRST (per-donation),
      then accumulate. Summing raw matches across donations and rounding once is
      FORBIDDEN — e.g. two 101-cent donations at ratio 0.5 yield 51 + 51 = 102,
      never round(202 * 0.5) = 101.
    input_set: "the new donation plus its named ACTIVE MatchCampaign"
    constants:
      MATCH_RATIO_MAX: 2.0
    precision: "integer cents, round_half_up per donation"
    note: "Combinatorial mode (b): nested rounding where per-donation-then-sum differs from sum-then-round; scaffold pins per-donation"

  - name: funding_progress
    trigger: "donation creation, equity allocation, refund, reallocation"
    algorithm: threshold
    formula: |
      funded_cents = sum(amount_cents + matched_cents) over the project's
                     donations with status IN {CAPTURED, CHOICE_PENDING}
      A project in FUNDING transitions to FUNDED iff funded_cents >= goal_cents
      after applying the change — the boundary is INCLUSIVE: exact equality funds.
      Donor principal may not exceed remaining need (goal_cents - funded_cents)
      at donation time; matched_cents may push funded_cents past goal_cents.
    input_set: "donations of the project in CAPTURED or CHOICE_PENDING status only"
    precision: "integer cents"
    variants:
      - name: principal_capped
        when: "donor-initiated donation"
        difference: "amount_cents <= remaining need, else ERR_DONATION_EXCEEDS_REMAINING"
      - name: uncapped_match_tip
        when: "the matched portion"
        difference: "matched_cents is not capped by remaining need and may overshoot the goal"

  - name: po_issuance
    trigger: "project FUNDING -> FUNDED"
    algorithm: aggregation
    formula: |
      Group the project's pinned ProjectItems by vendor. For each vendor with
      at least one item, create exactly one PurchaseOrder:
        line_items sorted by catalog_item created_at ASC (never by id)
        line_total_cents = sum(pinned_unit_price_cents * quantity)
        shipping_fee_cents = po_shipping_quote(lines)
        status = ISSUED, issued_at = now, ship_by_due = now + 10 days
    input_set: "the project's ProjectItems at the FUNDED transition"
    constants:
      VENDOR_SHIP_SLA_DAYS: 10
    precision: "integer cents"

  - name: thank_you_gate
    trigger: "POST /giving/projects (creation-time gate)"
    algorithm: aggregation
    formula: |
      debt = count of ThankYouPackage rows where package.project_id belongs to
             this teacher, package.status == PENDING, and the package's project
             status == FULFILLED
      If debt >= 1 -> reject creation with ERR_THANK_YOU_OUTSTANDING.
    input_set: "ThankYouPackages joined to the teacher's projects"
    precision: "integer count"

  - name: equity_allocation_selector
    trigger: "POST /giving/equity-funds/{fund_id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      Eligible candidate set:
        project.status == FUNDING AND logical clock < project.funding_deadline
        AND project.school.state_code == fund.state_code
        AND project.school.poverty_pct >= fund.min_poverty_pct   (inclusive boundary)
        AND (fund.subject IS NULL OR project.subject == fund.subject)
      Ranking: ORDER BY project.school.equity_score_weighted DESC,
               project.created_at ASC   (created_at is the only tie-break; id never used)
      Selector picks the single best project; empty set -> ERR_NO_ELIGIBLE_PROJECT.
      Allocation amount = min(project remaining need (goal_cents - funded_cents),
                              fund.remaining_cents)
      Recorded as a Donation: kind=EQUITY_GRANT, donor_id=null,
      equity_fund_id=fund.id, matched_cents=0, status=CAPTURED.
      fund.remaining_cents -= amount; if 0 -> DEPLETED.
      May tip the project to FUNDED (funding_progress), which fires po_issuance
      and creates the PENDING ThankYouPackage.
    input_set: "all FUNDING projects whose school is in the fund's state"
    precision: "integer cents"

  - name: expiration_sweep
    trigger: "POST /_sweeps/expiration_run"
    algorithm: chronological
    formula: |
      In one run, in this fixed order:
        1. FUNDING projects with funding_deadline <= now -> EXPIRED
           (process order: funding_started_at ASC, then created_at ASC);
           each CAPTURED donation -> CHOICE_PENDING, choice_deadline = now + 14d;
           each such donation's matched_cents clawed back to its campaign.
        2. CHOICE_PENDING donations with choice_deadline <= now -> REFUNDED
           (reason EXPIRED_AUTO; order: choice_deadline ASC, then created_at ASC).
        3. MatchCampaigns with ends_at <= now in {ACTIVE, EXHAUSTED} -> CLOSED.
        4. EquityFunds with window_end < now in {ACTIVE, DEPLETED} -> CLOSED.
      Boundary: a project whose deadline EQUALS now expires in this run; a
      donation whose choice_deadline EQUALS now auto-refunds in this run.
    input_set: "entities past their logical-clock deadlines"
    constants:
      CHOICE_WINDOW_DAYS: 14
    precision: "timestamps compared at second precision"

  - name: fraud_clawback
    trigger: "FraudCase OPEN -> CONFIRMED"
    algorithm: cascading
    formula: |
      1. Teacher -> SUSPENDED.
      2. Each of the teacher's projects in {DRAFT, IN_REVIEW, VETTING, RETURNED,
         FUNDING, FUNDED} -> CANCELLED (order: project created_at ASC).
      3. For each CANCELLED-from-FUNDING project, each CAPTURED or CHOICE_PENDING
         donation -> REFUNDED (reason FRAUD_CLAWBACK):
           donor.lifetime_refunded_cents += amount_cents
           project.funded_cents -= amount_cents + matched_cents
      4. Each refunded donation's matched_cents returns to its MatchCampaign:
           matched_so_far_cents -= matched_cents; remaining_budget_cents += matched_cents
           EXHAUSTED -> ACTIVE if window still open.
      5. Each PurchaseOrder of those projects in {ISSUED, SHIPPED} -> CANCELLED;
         DELIVERED and DIVERSION_REPORTED POs are untouched (evidence trail).
    input_set: "the confirmed teacher's full open pipeline"
    precision: "integer cents"

  - name: donor_conservation_invariant
    trigger: "any donation status change (assertion target, not a stored job)"
    algorithm: aggregation
    formula: |
      For every Donor at all times:
        lifetime_donated_cents
          == sum(amount_cents over donations in {CAPTURED, CHOICE_PENDING})
           + lifetime_refunded_cents
           + lifetime_reallocated_cents
      Capture is the forward action; REFUNDED and REALLOCATED are the two
      compensating actions; each moves amount_cents between the buckets without
      changing the total.
    input_set: "one donor's donations"
    precision: "integer cents"

  - name: campaign_budget_invariant
    trigger: "match application and every clawback"
    algorithm: aggregation
    formula: |
      For every MatchCampaign at all times:
        budget_cents == matched_so_far_cents + remaining_budget_cents
      Applying a match moves cents from remaining to matched_so_far; a clawback
      (expiry or fraud) moves exactly the same cents back. The sum is conserved.
    input_set: "one campaign"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules at once)
# =============================================================================
validations:
  - priority: 0
    category: request
    check: "Request body is well-formed: all required fields present, enum values valid, scalar ranges respected (funding_window_days in [30,180], quantity >= 1, amount_cents >= 1, match_ratio in (0, 2.0], poverty/ell pct in [0,100], thank_you_note >= 20 chars and impact_report >= 40 chars on submit)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except none"
  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's roles list; entity-backed ownership holds (teacher owns project, donor owns donation, vendor owns catalog item / PO)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path and body-referenced ids exist, validated left-to-right (project before item, fund before allocation)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version equals the parent row's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /giving/projects/{id}/items, POST /giving/projects/{id}/submit, POST /giving/donations/{id}/reallocation-choice"
  - priority: 5
    category: state
    check: "Target entity is in a state that permits the operation (project editable only in DRAFT/RETURNED; donation only into FUNDING; PO action only from the matching prior status; review only from the matching stage; thank-you only while FULFILLED; reallocation only from CHOICE_PENDING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "Teacher.employment_status is PENDING_VERIFICATION for project creation/submission (VERIFIED required; SUSPENDED is handled separately at priority 7)"
    error_id: ERR_TEACHER_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /giving/projects, POST /giving/projects/{id}/submit"
  - priority: 7
    category: business_safety
    check: "Teacher.employment_status != SUSPENDED for any teacher-initiated write"
    error_id: ERR_TEACHER_SUSPENDED
    http_status: 409
    applies_to: "POST /giving/projects, POST /giving/projects/{id}/items, POST /giving/projects/{id}/submit, POST /giving/projects/{id}/thank-you-package"
  - priority: 8
    category: business_temporal
    check: "Logical clock < project.funding_deadline for donations"
    error_id: ERR_FUNDING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /giving/projects/{id}/donations"
  - priority: 9
    category: business_temporal
    check: "Named match campaign window covers now (starts_at <= now < ends_at, half-open)"
    error_id: ERR_MATCH_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /giving/projects/{id}/donations with match_campaign_id"
  - priority: 10
    category: business_temporal
    check: "Logical clock < donation.choice_deadline for a donor reallocation choice"
    error_id: ERR_CHOICE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /giving/donations/{id}/reallocation-choice"
  - priority: 11
    category: business_temporal
    check: "Equity fund window covers now (window_start <= now <= window_end, closed interval) at allocation time"
    error_id: ERR_EQUITY_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /giving/equity-funds/{id}/allocate"
  - priority: 12
    category: business_temporal
    check: "New MatchCampaign window must not overlap (half-open: existing.starts_at < new.ends_at AND new.starts_at < existing.ends_at) any ACTIVE campaign with the same sponsor_name + target_type + target_value; touching endpoints are allowed"
    error_id: ERR_CAMPAIGN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /giving/match-campaigns"
  - priority: 13
    category: business_temporal
    check: "New EquityFund window must not overlap OR TOUCH (closed interval: existing.window_start <= new.window_end AND new.window_start <= existing.window_end) any ACTIVE fund with the same state_code; an adjacent window sharing a boundary day conflicts"
    error_id: ERR_EQUITY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /giving/equity-funds"
  - priority: 14
    category: business_constraint
    check: "Teacher has no other project in {DRAFT, IN_REVIEW, VETTING, RETURNED, FUNDING, FUNDED}"
    error_id: ERR_ACTIVE_PROJECT_EXISTS
    http_status: 409
    applies_to: "POST /giving/projects"
  - priority: 15
    category: business_constraint
    check: "Thank-you gate: no PENDING ThankYouPackage whose project is FULFILLED for this teacher"
    error_id: ERR_THANK_YOU_OUTSTANDING
    http_status: 409
    applies_to: "POST /giving/projects"
  - priority: 16
    category: business_constraint
    check: "Review segregation: the VET actor's X-User-ID must differ from project.screened_by_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /giving/projects/{id}/review with stage=VET"
  - priority: 17
    category: business_constraint
    check: "No duplicate catalog_item_id within one project"
    error_id: ERR_DUPLICATE_CATALOG_ITEM
    http_status: 409
    applies_to: "POST /giving/projects/{id}/items"
  - priority: 18
    category: business_constraint
    check: "At most one OPEN FraudCase per teacher"
    error_id: ERR_FRAUD_CASE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /giving/purchase-orders/{id}/advance with action=REPORT_DIVERSION, POST /giving/teachers/{id}/employment-review with action=REINSTATE"
  - priority: 19
    category: business_referential
    check: "CatalogItem exists under the vendor, has status==ACTIVE, and quantity <= min(max_quantity_per_project, 99) (null cap = 99)"
    error_id: ERR_CATALOG_ITEM_UNAVAILABLE
    http_status: 422
    applies_to: "POST /giving/projects/{id}/items"
  - priority: 20
    category: business_referential
    check: "Named match campaign's target matches the project (SCHOOL: school_id equal; SUBJECT: subject equal; STATE: school state_code equal)"
    error_id: ERR_MATCH_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /giving/projects/{id}/donations with match_campaign_id"
  - priority: 21
    category: business_referential
    check: "Reallocation target equity_fund_id references an ACTIVE EquityFund whose closed window covers now (covers both not-ACTIVE and out-of-window targets)"
    error_id: ERR_INVALID_REALLOCATION_TARGET
    http_status: 422
    applies_to: "POST /giving/donations/{id}/reallocation-choice with choice=REALLOCATE"
  - priority: 22
    category: business_fiscal
    check: "Project has at least one ProjectItem at submit (checked before the goal range so an empty project reports ERR_NO_ITEMS, never ERR_GOAL_OUT_OF_RANGE)"
    error_id: ERR_NO_ITEMS
    http_status: 422
    applies_to: "POST /giving/projects/{id}/submit"
  - priority: 23
    category: business_fiscal
    check: "Submit-time computed goal_cents within [10000, 200000]"
    error_id: ERR_GOAL_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /giving/projects/{id}/submit"
  - priority: 24
    category: business_fiscal
    check: "Donation amount_cents >= 100 and <= project remaining need (goal_cents - funded_cents)"
    error_id: ERR_DONATION_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /giving/projects/{id}/donations"
  - priority: 25
    category: business_fiscal
    check: "Donation amount_cents >= named campaign's min_donation_cents"
    error_id: ERR_DONATION_BELOW_MATCH_MIN
    http_status: 422
    applies_to: "POST /giving/projects/{id}/donations with match_campaign_id"
  - priority: 26
    category: business_fiscal
    check: "Equity allocation candidate set non-empty (else the selector has nothing to fund)"
    error_id: ERR_NO_ELIGIBLE_PROJECT
    http_status: 422
    applies_to: "POST /giving/equity-funds/{id}/allocate"

# =============================================================================
# §1.5 API Endpoint Table (39 endpoints)
# =============================================================================
endpoints:
  # --- test-driving (outside the business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no entity mutation, no automatic sweep"]
  - method: POST
    path: "/_sweeps/expiration_run"
    description: "Ops-run checkpoint: expires FUNDING projects past deadline, opens donor choice windows, auto-refunds expired choice windows, closes out-of-window match campaigns and equity funds (see expiration_sweep)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ expired_project_ids: array, choice_pending_donation_ids: array, auto_refunded_donation_ids: array, closed_match_campaign_ids: array, closed_equity_fund_ids: array }"
    side_effects: ["expiration_sweep calculation in its pinned 4-phase order"]

  # --- School ---
  - method: POST
    path: "/giving/schools"
    description: "Register a school"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, district, poverty_pct, ell_pct]
    output: School
    side_effects: ["equity_score_banded and equity_score_weighted computed"]
  - method: GET
    path: "/giving/schools/{school_id}"
    description: "Read a school including both equity score variants"
    roles: [PlatformAdmin, Reviewer, Teacher]
    code: 200
    input: []
    output: School
    side_effects: []

  # --- Teacher ---
  - method: POST
    path: "/giving/teachers"
    description: "Register a teacher (self-service); employment_status starts PENDING_VERIFICATION"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, school_id, "subjects_taught?"]
    output: Teacher
    side_effects: []
  - method: GET
    path: "/giving/teachers/{teacher_id}"
    description: "Read a teacher"
    roles: [PlatformAdmin, Reviewer, Teacher]
    code: 200
    input: []
    output: Teacher
    side_effects: []
  - method: GET
    path: "/giving/teachers"
    description: "List teachers with optional filters"
    roles: [PlatformAdmin, Reviewer]
    code: 200
    input: ["school_id?", "employment_status?", "limit?", "offset?"]
    output: "Teacher[]"
    side_effects: []
  - method: POST
    path: "/giving/teachers/{teacher_id}/employment-review"
    description: "Verify employment (PENDING_VERIFICATION->VERIFIED) or reinstate (SUSPENDED->VERIFIED, requires no OPEN fraud case)"
    roles: [PlatformAdmin]
    code: 200
    input: [action]
    output: Teacher
    side_effects: ["employment_status transition per action VERIFY|REINSTATE"]

  # --- Vendor & catalog ---
  - method: POST
    path: "/giving/vendors"
    description: "Register a vendor; status starts ACTIVE"
    roles: [PlatformAdmin]
    code: 201
    input: [name, ship_from_state, contact_email]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/giving/vendors/{vendor_id}"
    description: "Read a vendor"
    roles: [PlatformAdmin, Reviewer, Teacher, Vendor]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/giving/vendors/{vendor_id}/suspend"
    description: "Suspend a vendor (blocks new catalog items and SHIP actions; existing POs unaffected except SHIP)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/giving/vendors/{vendor_id}/catalog-items"
    description: "Add a catalog item (vendor as self, or admin)"
    roles: [PlatformAdmin, Vendor]
    code: 201
    input: [sku, name, category, subject_tags, unit_price_cents, weight_oz, shipping_zone, "fragile?", "max_quantity_per_project?"]
    output: CatalogItem
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/giving/vendors/{id}/catalog-items"
    description: "List a vendor's catalog items"
    roles: [PlatformAdmin, Reviewer, Teacher, Vendor, Donor]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: "CatalogItem[]"
    side_effects: []
  - method: PATCH
    path: "/giving/vendors/{vendor_id}/catalog-items/{item_id}"
    description: "Change a catalog item's current unit price and/or discontinue it; price moves provisional quotes of DRAFT/RETURNED projects, never pinned totals; status may only move ACTIVE -> DISCONTINUED"
    roles: [PlatformAdmin, Vendor]
    code: 200
    input: ["unit_price_cents?", "status?"]
    output: CatalogItem
    side_effects: ["provisional_total_cents of DRAFT/RETURNED projects referencing the item recomputes on next read", "status=DISCONTINUED blocks future project-item adds (ERR_CATALOG_ITEM_UNAVAILABLE)"]

  # --- Project ---
  - method: POST
    path: "/giving/projects"
    description: "Create a DRAFT project for the acting teacher (teacher_id from X-User-ID, school_id denormalized from teacher)"
    roles: [Teacher]
    code: 201
    input: [title, description, subject, grade_band, funding_window_days]
    output: Project
    side_effects: ["status=DRAFT, funded_cents=0, provisional totals null until items exist"]
  - method: GET
    path: "/giving/projects"
    description: "List/browse projects with filters"
    roles: [PlatformAdmin, Reviewer, Teacher, Donor, Vendor]
    code: 200
    input: ["teacher_id?", "school_id?", "status?", "subject?", "state_code?", "limit?", "offset?"]
    output: "Project[]"
    side_effects: []
  - method: GET
    path: "/giving/projects/{project_id}"
    description: "Read a project (DRAFT/RETURNED reads recompute provisional_total_cents at current catalog prices)"
    roles: [PlatformAdmin, Reviewer, Teacher, Donor, Vendor]
    code: 200
    input: []
    output: Project
    side_effects: ["provisional_total_cents recomputed on read while DRAFT or RETURNED"]
  - method: POST
    path: "/giving/projects/{project_id}/items"
    description: "Add a catalog item to a DRAFT/RETURNED project (OCC on project version)"
    roles: [Teacher]
    code: 201
    input: [catalog_item_id, quantity, expected_project_version]
    output: ProjectItem
    side_effects: ["increments Project.version by 1", "provisional totals recompute"]
  - method: GET
    path: "/giving/project-items/{item_id}"
    description: "Read one project item"
    roles: [PlatformAdmin, Reviewer, Teacher, Donor]
    code: 200
    input: []
    output: ProjectItem
    side_effects: []
  - method: GET
    path: "/giving/project-items"
    description: "List project items filtered by project and/or catalog item"
    roles: [PlatformAdmin, Reviewer, Teacher, Donor]
    code: 200
    input: ["project_id?", "catalog_item_id?", "limit?", "offset?"]
    output: "ProjectItem[]"
    side_effects: []
  - method: POST
    path: "/giving/projects/{project_id}/submit"
    description: "Submit for screening (DRAFT/RETURNED -> IN_REVIEW); pins unit prices, freezes goal (OCC on project version)"
    roles: [Teacher]
    code: 200
    input: [expected_project_version]
    output: Project
    side_effects: ["increments Project.version by 1", "price pin + goal freeze", "status -> IN_REVIEW"]
  - method: POST
    path: "/giving/projects/{project_id}/review"
    description: "Reviewer decision: stage=SCREEN on IN_REVIEW, stage=VET on VETTING; outcome APPROVE|RETURN (REJECT allowed only for VET). VET actor must differ from screened_by_id."
    roles: [Reviewer]
    code: 200
    input: [stage, outcome]
    output: Project
    side_effects: ["status transition per stage/outcome", "screened_by_id / vetted_by_id recorded", "VET APPROVE sets funding_started_at and funding_deadline"]

  # --- Donor & donations ---
  - method: POST
    path: "/giving/donors"
    description: "Register a donor (self-service)"
    roles: [Anonymous]
    code: 201
    input: [display_name, email]
    output: Donor
    side_effects: []
  - method: GET
    path: "/giving/donors/{donor_id}"
    description: "Read a donor including lifetime_donated/refunded/reallocated aggregates"
    roles: [PlatformAdmin, Donor]
    code: 200
    input: []
    output: Donor
    side_effects: []
  - method: POST
    path: "/giving/projects/{project_id}/donations"
    description: "Donate to a FUNDING project; optional match_campaign_id applies per-donation rounded match; tipping funded_cents >= goal_cents flips project to FUNDED and auto-issues POs"
    roles: [Donor]
    code: 201
    input: [amount_cents, "match_campaign_id?"]
    output: Donation
    side_effects: ["donor lifetime_donated_cents += amount_cents", "match_allocation if campaign named", "project.funded_cents += amount_cents + matched_cents", "on tip: FUNDED -> po_issuance + PENDING ThankYouPackage"]
  - method: GET
    path: "/giving/donations/{donation_id}"
    description: "Read a donation"
    roles: [PlatformAdmin, Donor, Teacher, Reviewer]
    code: 200
    input: []
    output: Donation
    side_effects: []
  - method: GET
    path: "/giving/donations"
    description: "List donations with filters"
    roles: [PlatformAdmin, Donor]
    code: 200
    input: ["donor_id?", "project_id?", "status?", "match_campaign_id?", "equity_fund_id?", "limit?", "offset?"]
    output: "Donation[]"
    side_effects: []
  - method: POST
    path: "/giving/donations/{donation_id}/reallocation-choice"
    description: "Donor choice on an expired project's CHOICE_PENDING donation: REFUND or REALLOCATE to an equity fund (OCC on donation version)"
    roles: [Donor]
    code: 200
    input: [choice, "equity_fund_id?", expected_donation_version]
    output: Donation
    side_effects: ["increments Donation.version by 1", "REFUND: donor.lifetime_refunded_cents += amount_cents", "REALLOCATE: equity fund remaining_cents += amount_cents, donor.lifetime_reallocated_cents += amount_cents", "project.funded_cents -= amount_cents"]

  # --- Match campaigns ---
  - method: POST
    path: "/giving/match-campaigns"
    description: "Create a targeted match campaign (half-open window; same sponsor+target windows may not overlap, adjacency allowed)"
    roles: [PlatformAdmin]
    code: 201
    input: [sponsor_name, match_ratio, budget_cents, target_type, target_value, starts_at, ends_at, "min_donation_cents?"]
    output: MatchCampaign
    side_effects: ["status=ACTIVE, matched_so_far_cents=0, remaining_budget_cents=budget_cents"]
  - method: GET
    path: "/giving/match-campaigns/{campaign_id}"
    description: "Read a match campaign including matched_so_far_cents and remaining_budget_cents"
    roles: [PlatformAdmin, Reviewer, Donor]
    code: 200
    input: []
    output: MatchCampaign
    side_effects: []

  # --- Purchase orders ---
  - method: GET
    path: "/giving/purchase-orders/{po_id}"
    description: "Read a purchase order"
    roles: [PlatformAdmin, Reviewer, Teacher, Vendor]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []
  - method: GET
    path: "/giving/purchase-orders"
    description: "List purchase orders with filters"
    roles: [PlatformAdmin, Reviewer, Teacher, Vendor]
    code: 200
    input: ["vendor_id?", "project_id?", "status?", "limit?", "offset?"]
    output: "PurchaseOrder[]"
    side_effects: []
  - method: POST
    path: "/giving/purchase-orders/{po_id}/advance"
    description: "Advance a PO: action=SHIP (Vendor, ISSUED->SHIPPED, tracking_number required), action=DELIVER (owning Teacher or PlatformAdmin, SHIPPED->DELIVERED), action=REPORT_DIVERSION (PlatformAdmin, SHIPPED->DIVERSION_REPORTED, opens FraudCase)"
    roles: [Vendor, Teacher, PlatformAdmin]
    code: 200
    input: [action, "tracking_number?", "reason?"]
    output: PurchaseOrder
    side_effects: ["per action: shipped_at/delivered_at stamps; DELIVER may bubble project to FULFILLED; REPORT_DIVERSION creates OPEN FraudCase"]

  # --- Thank-you package ---
  - method: POST
    path: "/giving/projects/{project_id}/thank-you-package"
    description: "Submit the thank-you note and impact report for a FULFILLED project's PENDING package"
    roles: [Teacher]
    code: 200
    input: [thank_you_note, impact_report]
    output: ThankYouPackage
    side_effects: ["status -> SUBMITTED, submitted_at set", "project FULFILLED -> CLOSED"]
  - method: GET
    path: "/giving/projects/{id}/thank-you-package"
    description: "Read the project's thank-you package (array of length 0 or 1)"
    roles: [PlatformAdmin, Reviewer, Teacher]
    code: 200
    input: []
    output: "ThankYouPackage[]"
    side_effects: []

  # --- Fraud ---
  - method: GET
    path: "/giving/fraud-cases/{case_id}"
    description: "Read a fraud case"
    roles: [PlatformAdmin, Reviewer]
    code: 200
    input: []
    output: FraudCase
    side_effects: []
  - method: GET
    path: "/giving/fraud-cases"
    description: "List fraud cases with filters"
    roles: [PlatformAdmin, Reviewer]
    code: 200
    input: ["teacher_id?", "project_id?", "purchase_order_id?", "status?", "limit?", "offset?"]
    output: "FraudCase[]"
    side_effects: []
  - method: POST
    path: "/giving/fraud-cases/{case_id}/resolve"
    description: "Resolve an OPEN case: CONFIRMED runs the fraud_clawback cascade (teacher suspended, pipeline projects cancelled, donations refunded, match clawed back, open POs cancelled); DISMISSED has no side effects"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "notes?"]
    output: FraudCase
    side_effects: ["outcome=CONFIRMED: full fraud_clawback cascade", "outcome=DISMISSED: none"]

  # --- Equity funds ---
  - method: POST
    path: "/giving/equity-funds"
    description: "Create an equity funding program (closed-interval window; same-state fund windows may not overlap or touch)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, min_poverty_pct, budget_cents, window_start, window_end, "subject?"]
    output: EquityFund
    side_effects: ["status=ACTIVE, remaining_cents=budget_cents"]
  - method: GET
    path: "/giving/equity-funds/{fund_id}"
    description: "Read an equity fund"
    roles: [PlatformAdmin, Reviewer, Donor]
    code: 200
    input: []
    output: EquityFund
    side_effects: []
  - method: POST
    path: "/giving/equity-funds/{fund_id}/allocate"
    description: "Select the best eligible FUNDING project (weighted equity score DESC, created_at ASC) and grant min(remaining need, fund remaining) as an EQUITY_GRANT donation"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Donation
    side_effects: ["equity_allocation_selector", "fund.remaining_cents -= amount (DEPLETED at 0)", "project.funded_cents += amount", "may tip project to FUNDED -> po_issuance + PENDING ThankYouPackage"]

# =============================================================================
# §1.6 Error Code Catalog (27 errors)
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, bad enum value, quantity/amount out of static range, note/report below minimum length, funding_window_days outside [30,180]" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on this endpoint, or entity-backed ownership violated (teacher does not own project, donor does not own donation, vendor does not own catalog item / PO)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent row's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is in a state that forbids the operation (project not editable/reviewable/fundable from current status; PO action from wrong status; donation not CHOICE_PENDING; teacher not in expected employment status; campaign/fund not ACTIVE; vendor SUSPENDED on SHIP)" }
  - { id: ERR_TEACHER_NOT_VERIFIED, http: 409, condition: "Teacher employment_status is PENDING_VERIFICATION when creating or submitting a project" }
  - { id: ERR_TEACHER_SUSPENDED, http: 409, condition: "Teacher employment_status is SUSPENDED on any teacher-initiated write" }
  - { id: ERR_FUNDING_WINDOW_CLOSED, http: 409, condition: "Logical clock >= project.funding_deadline at donation time (project still FUNDING because the sweep has not run yet)" }
  - { id: ERR_MATCH_WINDOW_CLOSED, http: 409, condition: "Named match campaign's half-open window does not cover now" }
  - { id: ERR_CHOICE_WINDOW_EXPIRED, http: 409, condition: "Logical clock >= donation.choice_deadline when a donor submits a reallocation choice" }
  - { id: ERR_EQUITY_WINDOW_CLOSED, http: 409, condition: "Equity fund's closed window does not cover now at allocate/reallocate time" }
  - { id: ERR_CAMPAIGN_WINDOW_OVERLAP, http: 409, condition: "New match campaign window overlaps (half-open arithmetic) an ACTIVE campaign with same sponsor_name + target_type + target_value" }
  - { id: ERR_EQUITY_WINDOW_OVERLAP, http: 409, condition: "New equity fund window overlaps OR touches (closed-interval arithmetic) an ACTIVE fund with the same state_code" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "VET actor's X-User-ID equals the project's screened_by_id" }
  - { id: ERR_ACTIVE_PROJECT_EXISTS, http: 409, condition: "Teacher already has a project in DRAFT/IN_REVIEW/VETTING/RETURNED/FUNDING/FUNDED" }
  - { id: ERR_THANK_YOU_OUTSTANDING, http: 409, condition: "Teacher has a PENDING ThankYouPackage on a FULFILLED project" }
  - { id: ERR_DUPLICATE_CATALOG_ITEM, http: 409, condition: "Project already contains the given catalog_item_id" }
  - { id: ERR_FRAUD_CASE_ALREADY_OPEN, http: 409, condition: "An OPEN FraudCase already exists for this teacher (blocks duplicate diversion reports and reinstatement)" }
  - { id: ERR_CATALOG_ITEM_UNAVAILABLE, http: 422, condition: "Catalog item DISCONTINUED, or quantity exceeds min(max_quantity_per_project, 99)" }
  - { id: ERR_MATCH_TARGET_MISMATCH, http: 422, condition: "Named campaign's target (school/subject/state) does not match the project" }
  - { id: ERR_INVALID_REALLOCATION_TARGET, http: 422, condition: "choice=REALLOCATE without equity_fund_id, or target fund not ACTIVE, or its window does not cover now" }
  - { id: ERR_NO_ITEMS, http: 422, condition: "Submit attempted with zero ProjectItems" }
  - { id: ERR_GOAL_OUT_OF_RANGE, http: 422, condition: "Submit-time computed goal_cents outside [10000, 200000]" }
  - { id: ERR_DONATION_EXCEEDS_REMAINING, http: 422, condition: "Donation amount_cents > project remaining need (goal_cents - funded_cents), or amount_cents < 100" }
  - { id: ERR_DONATION_BELOW_MATCH_MIN, http: 422, condition: "Donation amount_cents below the named campaign's min_donation_cents" }
  - { id: ERR_NO_ELIGIBLE_PROJECT, http: 422, condition: "Equity allocation selector found an empty candidate set" }

# =============================================================================
# §1.7 RBAC Matrix (6 roles)
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated self-service registrant (teacher or donor sign-up)"
    identity: opaque
    exclusive_operations:
      - "POST /giving/teachers"
      - "POST /giving/donors"
    shared_operations: []
  - name: Teacher
    description: "Classroom teacher; creates and edits own projects, confirms deliveries, submits thank-you packages"
    identity: "entity_backed:Teacher"
    exclusive_operations:
      - "POST /giving/projects"
      - "POST /giving/projects/{id}/items"
      - "POST /giving/projects/{id}/submit"
      - "POST /giving/projects/{id}/thank-you-package"
    shared_operations:
      - "GET reads of schools, teachers, projects, project-items, donations, catalog items, purchase orders, thank-you packages"
      - "POST /giving/purchase-orders/{id}/advance with action=DELIVER (own project only)"
  - name: Reviewer
    description: "Vetting reviewer; screens and vets projects (may not vet a project they screened)"
    identity: opaque
    exclusive_operations:
      - "POST /giving/projects/{id}/review"
    shared_operations:
      - "GET reads of schools, teachers, projects, project-items, donations, catalog items, purchase orders, thank-you packages, fraud cases, match campaigns, equity funds"
  - name: Donor
    description: "Individual donor; donates and makes reallocation choices on own donations"
    identity: "entity_backed:Donor"
    exclusive_operations:
      - "POST /giving/projects/{id}/donations"
      - "POST /giving/donations/{id}/reallocation-choice"
    shared_operations:
      - "GET reads of projects, project-items, donations, catalog items, match campaigns, equity funds"
  - name: Vendor
    description: "Approved catalog vendor; manages own catalog and ships own purchase orders"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /giving/purchase-orders/{id}/advance with action=SHIP (own POs only)"
    shared_operations:
      - "POST /giving/vendors/{id}/catalog-items and PATCH .../catalog-items/{id} (own vendor only)"
      - "GET reads of vendors, catalog items, projects, purchase orders"
  - name: PlatformAdmin
    description: "Platform operator; manages schools, vendors, employment verification, match campaigns, equity funds, sweeps, fraud resolution"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc and POST /_sweeps/expiration_run"
      - "POST /giving/schools, POST /giving/vendors, POST /giving/vendors/{id}/suspend"
      - "POST /giving/teachers/{id}/employment-review"
      - "POST /giving/match-campaigns, POST /giving/equity-funds, POST /giving/equity-funds/{id}/allocate"
      - "POST /giving/fraud-cases/{id}/resolve"
      - "POST /giving/purchase-orders/{id}/advance with action=REPORT_DIVERSION"
    shared_operations:
      - "All GET reads"
      - "POST /giving/purchase-orders/{id}/advance with action=DELIVER"
