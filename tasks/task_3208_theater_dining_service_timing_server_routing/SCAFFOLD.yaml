# =============================================================================
# PRD Benchmark Scaffold — In-Theater Dining Service Timing & Server Routing
# Task: task_3208_theater_dining_service_timing_server_routing
# Difficulty band: Expert (10 entities, 36 endpoints, 30 errors, 4 state machines)
# =============================================================================

scenario: |
  In-Theater Dining Service Timing & Server Routing (Alamo Drafthouse): pre-show
  ordering window with kitchen capacity planning against showtime clusters, seat-side
  order slips and silent service protocols during the film, server section assignment
  across auditoriums with staggered showtimes, kitchen ticket sequencing so entrees
  arrive before a defined point in the film, no-talking and no-texting policy
  enforcement with warning and ejection procedures, refund handling for ejected guests
  and service failures, special programming events with themed menus and pre-show
  content production, alcohol service with identification checks in a dark auditorium

domain_name: theater-dining-service
api_prefix: "/"   # flat topology: many peer top-level collections, no nesting in URL paths

# =============================================================================
# Step 0 — Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat          # peer entities joined by FK; no nesting in URL paths
  state_machine_shape: compound  # Auditorium posture derived from children; two cyclic machines
  consistency_model: immediate

  relationship_patterns:
    - one_to_many
    - many_to_many            # Server x Auditorium on SectionAssignment
    - cross_aggregate         # OrderSlip -> KitchenTicket -> CheckTab -> DisturbanceEvent
    - polymorphic             # DisturbanceEvent.subject identifies guest-side targets

  role_model: peer_roles      # each role owns a distinct resource type; no override power

# =============================================================================
# Table 1 — Entity-Relationship Table  (§1.1)
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Auditorium
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable auditorium name, e.g. 'Theater 3'"
        constraints: "non-empty"
      - name: seat_capacity
        type: integer
        source: input
        description: "Total seat count; upper bound for seat-number validation"
        constraints: ">= 1"
      - name: screen_lead_time_minutes
        type: integer
        source: input
        description: "Minutes of pre-show content before the feature starts"
        default: 20
        constraints: ">= PRE_SHOW_MIN_MINUTES (10) and <= PRE_SHOW_MAX_MINUTES (40)"
      - name: kitchen_point_rate
        type: integer
        source: input
        description: "Line-cook ENTREE tickets this auditorium's kitchen line can produce per minute"
        default: 1
        constraints: ">= 1"
      - name: alcove_point_rate
        type: integer
        source: input
        description: "Bartender beverage tickets this auditorium's service alcove can produce per minute"
        default: 3
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Service posture (compound field): LIVE | TURNOVER | DARK"
        constraints: "LIVE | TURNOVER | DARK; derived from member Showtime states, never client-supplied"
      - name: service_posture
        type: enum
        source: computed
        description: "Read-only mirror of status used to gate all child operations: LIVE | TURNOVER | DARK"
      - name: build_phase
        type: enum
        source: computed
        description: "Read-only: EMPTY | SETUP | NEARLY_READY | READY, folding the build phases of the next upcoming scheduled Showtime"
        constraints: "EMPTY | SETUP | NEARLY_READY | READY"
      - name: last_showtime_cluster_start_utc
        type: datetime
        source: computed
        description: "Read-only: start_at_utc of the earliest SCHEDULED Showtime currently in the DINING_OPEN or SERVICE mode"
      - name: version
        type: integer
        source: system
        description: "Optimistic-concurrency version; increments on every mutation including cascaded side effects"
        default: 1

  # ---------------------------------------------------------------------------
  - name: Showtime
    parent: Auditorium
    common_fields: true
    fields:
      - name: auditorium_id
        type: string
        source: system
        description: "FK -> Auditorium.id; owning auditorium"
      - name: title
        type: string
        source: input
        description: "Feature title"
      - name: start_at_utc
        type: datetime
        source: input
        description: "Projected feature start instant (after pre-show content), ISO 8601 UTC"
      - name: runtime_minutes
        type: integer
        source: input
        description: "Feature runtime in minutes"
        constraints: ">= 1"
      - name: content_type
        type: enum
        source: input
        description: "STANDARD | SPECIAL_EVENT; SPECIAL_EVENT requires a ProgrammingEvent"
        default: "STANDARD"
        constraints: "STANDARD | SPECIAL_EVENT"
      - name: pre_show_minutes
        type: integer
        source: system
        description: "Minutes of pre-show content; inherited from the parent Auditorium's screen_lead_time_minutes at creation"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED | DINING_OPEN | SERVICE | RUNNING | COMPLETED | CANCELLED"
        constraints: "SCHEDULED | DINING_OPEN | SERVICE | RUNNING | COMPLETED | CANCELLED"
      - name: dining_open_at_utc
        type: datetime
        source: computed
        description: "Read-only: start_at_utc minus pre_show_minutes. Seat-side ordering window opens here. Pre-show orders are accepted while mode == DINING_OPEN."
      - name: entree_ready_deadline_utc
        type: datetime
        source: computed
        description: "Read-only: start_at_utc + floor(runtime_minutes * ENTRÉE_DEADLINE_FRACTION). Entrees must be delivered at or before this instant."
      - name: dining_close_at_utc
        type: datetime
        source: computed
        description: "Read-only: entree_ready_deadline_utc minus IN_KITCHEN_LEAD_MINUTES; the last instant a cold cold_line order may be accepted"
      - name: service_mode
        type: enum
        source: computed
        description: "Parallel dimension on this row, derived from status and the logical clock: PRE_SHOW while now < start_at_utc - SERVICE_WINDOW_LEAD_MINUTES, DARK_PERIOD while now > entree_ready_deadline_utc, IN_KITCHEN otherwise. It is recomputed on every clock set and on every showtime mutation, so status and service_mode can disagree in between and the disagreement is itself observable."
        constraints: "PRE_SHOW | IN_KITCHEN | DARK_PERIOD"
      - name: mode
        type: enum
        source: system
        description: "The independently evolving second dimension on this row: DINING_OPEN while the seating window admits orders, DINING_CLOSED once the showtime leaves the dining phases. It moves on the same lifecycle edges as status but carries no time-of-day meaning, which is exactly what distinguishes it from service_mode."
        constraints: "DINING_OPEN | DINING_CLOSED"

  # ---------------------------------------------------------------------------
  - name: ProgrammingEvent
    parent: Auditorium
    common_fields: true
    fields:
      - name: auditorium_id
        type: string
        source: system
        description: "FK -> Auditorium.id; owning auditorium"
      - name: theme_name
        type: string
        source: input
        description: "Theme label, e.g. 'Quote-Along: The Princess Bride'"
      - name: requires_themed_menu
        type: boolean
        source: input
        description: "Whether a themed menu must be attached before this event's showtimes may open dining"
        default: true
      - name: pre_show_content_status
        type: enum
        source: system
        description: "PRE_SHOW_DRAFT | PRE_SHOW_IN_REVIEW | PRE_SHOW_APPROVED | PRE_SHOW_REJECTED"
        constraints: "PRE_SHOW_DRAFT | PRE_SHOW_IN_REVIEW | PRE_SHOW_APPROVED | PRE_SHOW_REJECTED"
      - name: status
        type: enum
        source: system
        description: "DRAFT | ACTIVATED | COMPLETED | CANCELLED"
        constraints: "DRAFT | ACTIVATED | COMPLETED | CANCELLED"
      - name: pre_show_content_version
        type: integer
        source: computed
        description: "Read-only: 1 on creation; increments each time pre-show content re-enters PRE_SHOW_IN_REVIEW (revision cyclic machine)"
        default: 1
      - name: themed_menu_count
        type: integer
        source: computed
        description: "Read-only: count of ThemedMenuItem rows linked to this event via ProgrammingEvent.id"
        default: 0

  # ---------------------------------------------------------------------------
  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - name: catalog_name
        type: string
        source: input
        description: "Item name as printed in the menu"
      - name: channel
        type: enum
        source: input
        description: "ENTREE (kitchen cold_line) | BEVERAGE (alcove hot_line)"
        constraints: "ENTREE | BEVERAGE"
      - name: price_cents
        type: integer
        source: input
        description: "Menu price in cents"
        constraints: ">= 0"
      - name: prep_minutes
        type: integer
        source: input
        description: "Minutes of kitchen/alcove point capacity one unit of this item consumes"
        default: 1
        constraints: ">= 1"
      - name: is_alcoholic
        type: boolean
        source: input
        description: "True for BEVERAGE items containing alcohol; triggers the ID-check gate"
        default: false
      - name: availability_state
        type: enum
        source: system
        description: "AVAILABLE | OUT_OF_STOCK"
        constraints: "AVAILABLE | OUT_OF_STOCK"

  # ---------------------------------------------------------------------------
  - name: ThemedMenuItem
    parent: ProgrammingEvent
    common_fields: false
    fields:
      - name: programming_event_id
        type: string
        source: system
        description: "FK -> ProgrammingEvent.id; owning themed menu"
      - name: menu_item_id
        type: string
        source: system
        description: "FK -> MenuItem.id; the item offered under this theme"
      - name: theme_price_cents
        type: integer
        source: input
        description: "Theme-specific price in cents, may differ from MenuItem.price_cents"
        constraints: ">= 0"
      - name: is_signature
        type: boolean
        source: input
        description: "Signature items absorb consumption before other themed items"
        default: false

  # ---------------------------------------------------------------------------
  - name: Server
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Server name as shown on the seating chart"
      - name: home_auditorium_id
        type: string
        source: input
        description: "FK -> Auditorium.id; auditorium this server was hired into"
      - name: ratings
        type: array
        source: input
        description: "Historic closed assignment ratings, each {assignment_id, rating_grade} with rating_grade in {'A','B','C'}"
      - name: lifetime_points
        type: integer
        source: computed
        description: "Read-only: sum(assignment_points) over CANCELLED or COMPLETED SectionAssignments older than the current rolling window"
        default: 0
      - name: in_rotation
        type: boolean
        source: system
        description: "False while the server is in a cooldown or lockout penalty window; excludes them from selector candidacy"
        default: true
      - name: shift_load_projected
        type: integer
        source: computed
        description: "Read-only: server_shift_load.projected_load — count of the server's non-CANCELLED SectionAssignments created on the current service day"
        default: 0
      - name: shift_load_final
        type: integer
        source: computed
        description: "Read-only: server_shift_load.final_load — count of the server's COMPLETED SectionAssignments created on the current service day"
        default: 0
      - name: rollup_provisional_cents
        type: integer
        source: computed
        description: "Read-only: sum of CheckTab.original_cents over every slip in this server's sections that is the slip of an approved ejection or whose check is OPEN or PARTIALLY_REFUNDED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE while the server is rostered for sections; PENALIZED while they sit in a lockout penalty window. A server is never removed from the roster, only locked out, so there is no third value."
        constraints: "ACTIVE | PENALIZED"

  # ---------------------------------------------------------------------------
  - name: SectionAssignment
    parent: Showtime
    common_fields: true
    fields:
      - name: showtime_id
        type: string
        source: system
        description: "FK -> Showtime.id; the showtime whose section is being served"
      - name: auditorium_id
        type: string
        source: system
        description: "FK -> Auditorium.id; denormalized from the showtime for section conflict checks"
      - name: server_id
        type: string
        source: system
        description: "FK -> Server.id; the assigned server"
      - name: section_label
        type: string
        source: input
        description: "Physical section label within the auditorium, e.g. 'LEFT' | 'CENTER' | 'RIGHT'"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | REASSIGNMENT_PENDING | COMPLETED | CANCELLED"
        constraints: "ACTIVE | REASSIGNMENT_PENDING | COMPLETED | CANCELLED"
      - name: version
        type: integer
        source: system
        description: "OCC version for section reassignment; bumps on every mutation and on cascade"
        default: 1
      - name: assignment_points
        type: integer
        source: computed
        description: "Read-only: multiplicative quality/severity points scored at close-out or cancellation"
        default: 0

  # ---------------------------------------------------------------------------
  - name: OrderSlip
    parent: Showtime
    common_fields: true
    fields:
      - name: showtime_id
        type: string
        source: system
        description: "FK -> Showtime.id; the showtime this order belongs to"
      - name: section_assignment_id
        type: string
        source: system
        description: "FK -> SectionAssignment.id; the section the guest sits in; sets the owning server"
      - name: seat_number
        type: integer
        source: input
        description: "Seat number within the auditorium"
        constraints: "1 <= seat_number <= Auditorium.seat_capacity"
      - name: status
        type: enum
        source: system
        description: "PLACED | ACCEPTED | PREPARING | READY | DELIVERED | CANCELLED | VOIDED"
        constraints: "PLACED | ACCEPTED | PREPARING | READY | DELIVERED | CANCELLED | VOIDED"
      - name: channel
        type: enum
        source: computed
        description: "Read-only: derived from the composition rule — ENTREE if any line is an ENTREE, else BEVERAGE"
        constraints: "ENTREE | BEVERAGE"
      - name: placement_mode
        type: enum
        source: system
        description: "PRE_SHOW when the slip was placed inside the accepted seating window; the server-set SILENT value never persists because a slip placed across the silent-service boundary is rejected before creation"
        constraints: "PRE_SHOW | SILENT"
      - name: placed_at_utc
        type: datetime
        source: computed
        description: "Read-only: logical clock instant at which the slip was accepted"
      - name: in_kitchen_at_utc
        type: datetime
        source: computed
        description: "Read-only: set when the slip enters PREPARING"
      - name: delivered_at_utc
        type: datetime
        source: computed
        description: "Read-only: set when the slip reaches DELIVERED"
      - name: lines
        type: array
        source: input
        description: "Ordered line objects, each { menu_item_id, quantity }; resolved into channel and price at acceptance"
        constraints: "1..12 elements; quantity >= 1"
      - name: resolved_lines
        type: array
        source: computed
        description: "Read-only: each input line expanded to { menu_item_id, quantity, applied_channel, unit_price_cents, line_total_cents }"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Read-only: per-line rounding applied then summed (see calculations.order_subtotal)"
        default: 0
      - name: id_check_required
        type: boolean
        source: computed
        description: "Read-only: true when any resolved line is an alcoholic BEVERAGE"
        default: false
      - name: id_check_status
        type: enum
        source: system
        description: "NOT_REQUIRED | PENDING | VERIFIED | REFUSED"
        constraints: "NOT_REQUIRED | PENDING | VERIFIED | REFUSED"

  # ---------------------------------------------------------------------------
  - name: KitchenTicket
    parent: Showtime
    common_fields: true
    fields:
      - name: showtime_id
        type: string
        source: system
        description: "FK -> Showtime.id; the showtime this ticket feeds"
      - name: order_slip_id
        type: string
        source: system
        description: "FK -> OrderSlip.id; 1:1 with the slip that produced it"
      - name: station
        type: enum
        source: computed
        description: "Read-only: cold_line for ENTREE slips, hot_line for BEVERAGE slips"
        constraints: "cold_line | hot_line"
      - name: point_cost
        type: integer
        source: computed
        description: "Read-only: sum(quantity * MenuItem.prep_minutes) over the slip's lines"
      - name: fire_at_utc
        type: datetime
        source: computed
        description: "Read-only: start_at_utc minus MINUTES_FROM_ENTREE_TO_START, the instant the ticket enters PREPARING"
      - name: projected_delivery_at_utc
        type: datetime
        source: computed
        description: "Read-only: fire_at_utc + ceil(point_cost / kitchen_point_rate) minutes"
      - name: status
        type: enum
        source: system
        description: "QUEUED | PREPARING | READY | DELIVERED | VOIDED"
        constraints: "QUEUED | PREPARING | READY | DELIVERED | VOIDED"
      - name: sequence_position
        type: integer
        source: computed
        description: "Read-only: 1-based position in the station's fire ordering (see calculations.ticket_sequence_position)"
        default: 0
      - name: overflow_reason
        type: string
        source: input
        description: "Free-text supervisor reason recorded when the ticket is created past entree_ready_deadline_utc"
        default: null
      - name: allergen_substitution
        type: boolean
        source: input
        description: "Set when the slip carries an allergen substitution; raises ticket_priority_score"
        default: false

  # ---------------------------------------------------------------------------
  - name: CheckTab
    parent: OrderSlip
    common_fields: true
    fields:
      - name: order_slip_id
        type: string
        source: system
        description: "FK -> OrderSlip.id; 1:1 with the slip being settled"
      - name: status
        type: enum
        source: system
        description: "OPEN | SETTLED | REFUNDED | PARTIALLY_REFUNDED"
        constraints: "OPEN | SETTLED | REFUNDED | PARTIALLY_REFUNDED"
      - name: original_cents
        type: integer
        source: computed
        description: "Read-only: OrderSlip.subtotal_cents at tab open"
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Read-only: cumulative auto refund (service failures) plus approved refund (ejection)"
        default: 0
      - name: reason_code
        type: enum
        source: input
        description: "Refund reason, set only when a refund lands on the tab: EJECTION_NO_TALKING | EJECTION_NO_TEXTING | SERVICE_COMP_FAILURE | SERVICE_DELAY | null. A voided ticket's OVERFLOW reason lives on KitchenTicket.void_reason, not here."
        constraints: "EJECTION_NO_TALKING | EJECTION_NO_TEXTING | SERVICE_COMP_FAILURE | SERVICE_DELAY | null"

  # ---------------------------------------------------------------------------
  - name: DisturbanceEvent
    parent: OrderSlip
    common_fields: false
    fields:
      - name: order_slip_id
        type: string
        source: system
        description: "FK -> OrderSlip.id; the slip whose guest/seat is the subject"
      - name: kind
        type: enum
        source: input
        description: "NO_TALKING | NO_TEXTING"
        constraints: "NO_TALKING | NO_TEXTING"
      - name: stage
        type: enum
        source: system
        description: "WARNING | FINAL_WARNING | EJECTION"
        constraints: "WARNING | FINAL_WARNING | EJECTION"
      - name: prior_stage
        type: enum
        source: input
        description: "Stage being amended; required by POST /disturbance-events/{id}/amend"
        default: null
        constraints: "WARNING | FINAL_WARNING | null"
      - name: stage_version
        type: integer
        source: computed
        description: "Read-only: 1 on creation; increments on each amendment (penalty cyclic machine) (a WARNING amendment → 2, a FINAL_WARNING amendment → 3)"
        default: 1
      - name: occurred_at_utc
        type: datetime
        source: computed
        description: "Read-only: logical clock instant of creation or amendment"
      - name: ejected_occupant_id
        type: string
        source: input
        description: "Opaque occupant identifier for the ejected party; taken from X-User-ID of the acting server's report"
        default: null

# =============================================================================
# Table 2 — State Machine Table  (§1.2)
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Auditorium.status — COMPOUND / posture-driven. Derived from member Showtime
  # states on every showtime mutation; gates all child write operations.
  # ---------------------------------------------------------------------------
  - entity: Auditorium
    initial_state: DARK
    terminal_states: []
    transitions:
      - from: DARK
        to: TURNOVER
        trigger: "system (derived — a member Showtime reaches SCHEDULED while no sibling Showtime is LIVE)"
        actor: system
        preconditions:
          - "At least one member Showtime has status SCHEDULED"
          - "No member Showtime has status DINING_OPEN, SERVICE, or RUNNING"
        side_effects:
          - "status → TURNOVER; service_posture → TURNOVER"
          - "Auditorium.build_phase recomputed"
          - "updated_at refreshed"
        note: "Build phase is build_phase EMPTY when the auditorium has zero SCHEDULED showtimes, build_phase SETUP when at least one scheduled showtime exists with dining_open_at_utc > now + READY_LEAD_MINUTES, build_phase NEARLY_READY when at least one scheduled showtime has now <= dining_open_at_utc < now + READY_LEAD_MINUTES, and build_phase READY when at least one scheduled showtime has dining_open_at_utc <= now."

      - from: TURNOVER
        to: LIVE
        trigger: "system (derived — a member Showtime enters DINING_OPEN)"
        actor: system
        preconditions:
          - "At least one member Showtime has status DINING_OPEN, SERVICE, or RUNNING"
        side_effects:
          - "status → LIVE; service_posture → LIVE"
          - "Auditorium.build_phase recomputed to READY"
          - "Auditorium.last_showtime_cluster_start_utc recomputed as the earliest server-stamped start_at_utc among member Showtimes whose mode == DINING_OPEN"
          - "updated_at refreshed"

      - from: LIVE
        to: TURNOVER
        trigger: "system (derived — the last member Showtime in a live state reaches COMPLETED or CANCELLED)"
        actor: system
        preconditions:
          - "No member Showtime has status DINING_OPEN, SERVICE, or RUNNING"
          - "At least one member Showtime has status SCHEDULED (a subsequent showing on the same auditorium)"
        side_effects:
          - "status → TURNOVER; service_posture → TURNOVER"
          - "Auditorium.build_phase recomputed"
          - "updated_at refreshed"

      - from: LIVE
        to: DARK
        trigger: "system (derived — the last member Showtime reaches COMPLETED or CANCELLED and none remain SCHEDULED)"
        actor: system
        preconditions:
          - "No member Showtime has status DINING_OPEN, SERVICE, or RUNNING"
          - "No member Showtime has status SCHEDULED"
        side_effects:
          - "status → DARK; service_posture → DARK"
          - "Auditorium.build_phase recomputed to EMPTY"
          - "updated_at refreshed"

      - from: TURNOVER
        to: DARK
        trigger: "system (derived — every member Showtime is COMPLETED or CANCELLED)"
        actor: system
        preconditions:
          - "No member Showtime has status SCHEDULED, DINING_OPEN, SERVICE, or RUNNING"
        side_effects:
          - "status → DARK; service_posture → DARK"
          - "Auditorium.build_phase recomputed to EMPTY"
          - "updated_at refreshed"

      - from: DARK
        to: LIVE
        trigger: "system (derived — a Showtime is created already inside its dining-open instant)"
        actor: system
        preconditions:
          - "A member Showtime is created with dining_open_at_utc <= now"
        side_effects:
          - "status → LIVE; service_posture → LIVE"
          - "Auditorium.build_phase recomputed to READY"
          - "updated_at refreshed"

  # ---------------------------------------------------------------------------
  # Showtime.status — LINE AR with two revert edges off COMPLETED.
  # Carries an independent parallel dimension (`mode`) and the derived
  # `service_mode` axis. Terminal: CANCELLED.
  # ---------------------------------------------------------------------------
  - entity: Showtime
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DINING_OPEN
        trigger: POST /showtimes/{id}/open-dining
        actor: KitchenLead
        preconditions:
          - "Showtime.status must be SCHEDULED (ERR_SHOWTIME_NOT_SCHEDULED)"
          - "Parent Auditorium.status must be LIVE or TURNOVER (ERR_AUDITORIUM_NOT_SERVING)"
          - "now >= showtime.dining_open_at_utc (ERR_DINING_WINDOW_NOT_OPEN)"
          - "When Showtime.content_type == SPECIAL_EVENT and the linked ProgrammingEvent.requires_themed_menu == true: ProgrammingEvent.themed_menu_count >= 1 (ERR_THEMED_MENU_REQUIRED), and ProgrammingEvent.status == ACTIVATED, and ProgrammingEvent.pre_show_content_status == PRE_SHOW_APPROVED (ERR_PRE_SHOW_NOT_APPROVED)"
        side_effects:
          - "status → DINING_OPEN, mode → DINING_OPEN, service_mode recomputed"
          - "Auditorium.status re-derived (TURNOVER → LIVE when this is the first live showtime)"
          - "compliance_score recomputed on the linked ProgrammingEvent when applicable"
          - "updated_at refreshed; Auditorium.version bumped by 1 when the auditorium's status changed"

      - from: DINING_OPEN
        to: SERVICE
        trigger: POST /showtimes/{id}/start-service
        actor: KitchenLead
        preconditions:
          - "Showtime.status must be DINING_OPEN (ERR_SHOWTIME_NOT_DINING_OPEN)"
          - "now >= showtime.start_at_utc - PRE_SHOW_MIN_MINUTES (ERR_NOT_IN_SERVICE_WINDOW)"
          - "Every SectionAssignment on this showtime with status ACTIVE must have at least one OrderSlip of its own (any non-null status) or a recorded ALCOHOL_REFUSED by a server (ERR_SECTION_UNCOVERED)"
        side_effects:
          - "status → SERVICE"
          - "Each OrderSlip on this showtime with status PLACED is accepted only while service_mode == PRE_SHOW; slips still PLACED at this transition are VOIDED (ERR_SILENT_ORDER_VIOLATION was already raised at placement)"
          - "For each OrderSlip on this showtime with channel == BEVERAGE and id_check_required == true: id_check_status → PENDING"
          - "Each such slip's KitchenTicket is created with station hot_line; KitchenTickets for ENTREE slips (station cold_line) are created now with fire_at_utc = ENTRÉE_FIRE_AT"
          - "KitchenTicket.sequence_position recomputed for both stations"
          - "Auditorium.last_showtime_cluster_start_utc recomputed"
          - "updated_at refreshed"

      - from: SERVICE
        to: RUNNING
        trigger: POST /showtimes/{id}/start-feature (system/timed action, exact boundary)
        actor: KitchenLead
        preconditions:
          - "Showtime.status must be SERVICE (ERR_SHOWTIME_NOT_IN_SERVICE)"
          - "now >= showtime.start_at_utc exactly (ERR_FEATURE_START_BOUNDARY)"
        side_effects:
          - "status → RUNNING; service_mode → IN_KITCHEN while now < entree_ready_deadline_utc, then DARK_PERIOD"
          - "Every BEVERAGE KitchenTicket whose id_check_status is PENDING: if not verified through POST /kitchen-tickets/{id}/verify-id at or before the start of the switch-side buffer, ticket → VOIDED and its OrderSlip → released without charge, id_check_status → REFUSED; this is the FIRST HOP of the unverified-alcohol cascade (KitchenTicket → OrderSlip → rollup/CheckTab → Server.rollup_provisional_cents)"
          - "the showtime's kitchen_load_rollup and every surviving ticket's ticket_sequence_position are recomputed for the post-void cohort"
          - "updated_at refreshed"

      - from: RUNNING
        to: COMPLETED
        trigger: POST /showtimes/{id}/complete (system/timed action)
        actor: KitchenLead
        preconditions:
          - "Showtime.status must be RUNNING (ERR_SHOWTIME_NOT_RUNNING)"
          - "Showtime.status must not already be terminal (ERR_ALREADY_TERMINAL): a repeat complete on a COMPLETED showtime is refused rather than re-running the close-out cascade"
          - "All KitchenTickets on this showtime must be DELIVERED or VOIDED (ERR_OPEN_KITCHEN_TICKETS)"
        side_effects:
          - "status → COMPLETED; mode → DINING_CLOSED"
          - "Every SectionAssignment on this showtime with status ACTIVE or REASSIGNMENT_PENDING → COMPLETED"
          - "For each such SectionAssignment: assignment_points computed, Server.lifetime_points incremented, Server.ratings appended when the showtime had zero ejection-linked refunds, then Server.in_rotation and Server.status recomputed"
          - "Auditorium.status re-derived"
          - "updated_at refreshed on Showtime, each Server, and the Auditorium"

      - from: COMPLETED
        to: SERVICE
        trigger: POST /showtimes/{id}/reopen-service
        actor: KitchenLead
        preconditions:
          - "Showtime.status must be COMPLETED (ERR_SHOWTIME_NOT_COMPLETED)"
          - "now < showtime.start_at_utc + showtime.runtime_minutes (ERR_REOPEN_WINDOW_CLOSED)"
          - "Parent Auditorium.status must be LIVE (ERR_AUDITORIUM_NOT_SERVING)"
        side_effects:
          - "status → SERVICE; mode → DINING_OPEN; service_mode → IN_KITCHEN"
          - "Auditorium.status re-derived (TURNOVER → LIVE)"
          - "Every SectionAssignment on this showtime that was auto-COMPLETED by the COMPLETED transition reverts to ACTIVE with assignment_points reset to 0"
          - "Server.lifetime_points decremented by the reverted assignment_points; Server.in_rotation and Server.status recomputed"
          - "updated_at refreshed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /showtimes/{id}/cancel
        actor: ProgrammingCoordinator
        preconditions:
          - "Showtime.status must be SCHEDULED (ERR_SHOWTIME_NOT_SCHEDULED)"
        side_effects:
          - "status → CANCELLED; mode → DINING_CLOSED"
          - "Auditorium.status re-derived"
          - "ProgrammingEvent.pre_show_content_version unchanged; ProgrammingEvent.status recomputed to COMPLETED when no SCHEDULED showtime remains and pre_show_content_status == PRE_SHOW_APPROVED"
          - "updated_at refreshed"

      - from: DINING_OPEN
        to: CANCELLED
        trigger: POST /showtimes/{id}/cancel
        actor: ProgrammingCoordinator
        preconditions:
          - "Showtime.status must be DINING_OPEN (ERR_SHOWTIME_NOT_DINING_OPEN)"
        side_effects:
          - "status → CANCELLED; mode → DINING_CLOSED"
          - "Every non-terminal OrderSlip → CANCELLED; its CheckTab.original_cents preserved at 0"
          - "Every SectionAssignment on this showtime with status DRAFT or ACTIVE → CANCELLED (REASSIGNMENT_PENDING → CANCELLED executed first by the server so no REASSIGNMENT_PENDING assignments remain)"
          - "For each cancelled server: assignment_points recomputed (0 for a pre-service cancel), Server.lifetime_points unchanged, Server.in_rotation and Server.status recomputed"
          - "Auditorium.status re-derived"
          - "updated_at refreshed"

      - from: SERVICE
        to: CANCELLED
        trigger: POST /showtimes/{id}/cancel
        actor: ProgrammingCoordinator
        preconditions:
          - "Showtime.status must be SERVICE (ERR_SHOWTIME_NOT_IN_SERVICE)"
        side_effects:
          - "status → CANCELLED; mode → DINING_CLOSED"
          - "Every non-terminal KitchenTicket → VOIDED; every non-terminal OrderSlip → CANCELLED"
          - "Every SectionAssignment on this showtime → CANCELLED; assignment_points recomputed with the cancel multiplier"
          - "Server.in_rotation and Server.status recomputed for each affected server"
          - "Auditorium.status re-derived"
          - "updated_at refreshed"

      - from: RUNNING
        to: CANCELLED
        trigger: POST /showtimes/{id}/cancel
        actor: ProgrammingCoordinator
        preconditions:
          - "Showtime.status must be RUNNING (ERR_SHOWTIME_NOT_RUNNING)"
        side_effects:
          - "Same cascade as SERVICE → CANCELLED"
          - "Every OPEN CheckTab on this showtime → REFUNDED with reason_code SERVICE_COMP_FAILURE and refunded_cents = original_cents"
          - "Any Server whose cancelled assignment carries SAFETY score points >= 5 → in_rotation = false and status = PENALIZED until POST /servers/{id}/clear-penalty"

  # ---------------------------------------------------------------------------
  # ProgrammingEvent — CYCLIC pre-show content review machine plus a guarded
  # activation edge, expressed here as a linear spine with a retry-back edge.
  # ---------------------------------------------------------------------------
  - entity: ProgrammingEvent
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PRE_SHOW_IN_REVIEW
        trigger: POST /programming-events/{id}/pre-show-content/submit
        actor: ProgrammingCoordinator
        preconditions:
          - "ProgrammingEvent.status must be DRAFT (ERR_PROGRAMMING_EVENT_NOT_DRAFT)"
          - "At least one ThemedMenuItem must exist on this event (ERR_THEMED_MENU_REQUIRED)"
        side_effects:
          - "pre_show_content_status → PRE_SHOW_IN_REVIEW"
          - "pre_show_content_version unchanged on the first submit (stays 1)"
          - "updated_at refreshed"

      - from: PRE_SHOW_IN_REVIEW
        to: PRE_SHOW_APPROVED
        trigger: POST /programming-events/{id}/pre-show-content/approve
        actor: PreShowProducer
        preconditions:
          - "pre_show_content_status must be PRE_SHOW_IN_REVIEW (ERR_PRE_SHOW_NOT_IN_REVIEW)"
          - "At least one ThemedMenuItem with is_signature == true must exist (ERR_SIGNATURE_ITEM_REQUIRED)"
        side_effects:
          - "pre_show_content_status → PRE_SHOW_APPROVED"
          - "ProgrammingEvent.status recomputed: DRAFT → DRAFT (activation still required)"
          - "updated_at refreshed"

      - from: PRE_SHOW_IN_REVIEW
        to: PRE_SHOW_REJECTED
        trigger: POST /programming-events/{id}/pre-show-content/reject
        actor: PreShowProducer
        preconditions:
          - "pre_show_content_status must be PRE_SHOW_IN_REVIEW (ERR_PRE_SHOW_NOT_IN_REVIEW)"
        side_effects:
          - "pre_show_content_status → PRE_SHOW_REJECTED"
          - "updated_at refreshed"

      - from: PRE_SHOW_REJECTED
        to: PRE_SHOW_IN_REVIEW
        trigger: POST /programming-events/{id}/pre-show-content/submit
        actor: ProgrammingCoordinator
        preconditions:
          - "pre_show_content_status must be PRE_SHOW_REJECTED or PRE_SHOW_DRAFT (ERR_PRE_SHOW_NOT_RESUBMITTABLE)"
          - "At least one ThemedMenuItem must exist on this event (ERR_THEMED_MENU_REQUIRED)"
        side_effects:
          - "pre_show_content_status → PRE_SHOW_IN_REVIEW"
          - "pre_show_content_version += 1"
          - "updated_at refreshed"
        note: "This is the cycle: PRE_SHOW_REJECTED → PRE_SHOW_IN_REVIEW → {APPROVED | REJECTED}. Each re-entry bumps pre_show_content_version."

      - from: PRE_SHOW_APPROVED
        to: PRE_SHOW_IN_REVIEW
        trigger: POST /programming-events/{id}/pre-show-content/submit
        actor: ProgrammingCoordinator
        preconditions:
          - "pre_show_content_status must be PRE_SHOW_APPROVED (ERR_PRE_SHOW_NOT_RESUBMITTABLE)"
        side_effects:
          - "pre_show_content_status → PRE_SHOW_IN_REVIEW"
          - "pre_show_content_version += 1"
          - "updated_at refreshed"
        note: "Re-opening an approved cut returns it to review and bumps the version — the second cycle path."

      - from: DRAFT
        to: ACTIVATED
        trigger: POST /programming-events/{id}/activate
        actor: ProgrammingCoordinator
        preconditions:
          - "ProgrammingEvent.status must be DRAFT (ERR_PROGRAMMING_EVENT_NOT_DRAFT)"
          - "pre_show_content_status == PRE_SHOW_APPROVED (ERR_PRE_SHOW_NOT_APPROVED)"
          - "At least one linked Showtime with content_type == SPECIAL_EVENT must exist (ERR_NO_LINKED_SHOWTIME)"
        side_effects:
          - "status → ACTIVATED"
          - "Every linked SPECIAL_EVENT Showtime with status SCHEDULED has its content_type confirmed and themed pricing enabled"
          - "increments ProgrammingEvent.version by 1"
          - "updated_at refreshed"

      - from: ACTIVATED
        to: COMPLETED
        trigger: "system (derived — every linked SPECIAL_EVENT Showtime reaches COMPLETED or CANCELLED)"
        actor: system
        preconditions:
          - "No linked Showtime has status SCHEDULED, DINING_OPEN, SERVICE, or RUNNING"
        side_effects:
          - "status → COMPLETED; themed pricing disabled for the linked showtimes"
          - "updated_at refreshed"

      - from: DRAFT
        to: CANCELLED
        trigger: POST /programming-events/{id}/cancel
        actor: ProgrammingCoordinator
        preconditions:
          - "ProgrammingEvent.status must be DRAFT or ACTIVATED (ERR_PROGRAMMING_EVENT_NOT_CANCELLABLE)"
        side_effects:
          - "status → CANCELLED"
          - "Every linked Showtime with status SCHEDULED → CANCELLED"
          - "updated_at refreshed"

      - from: ACTIVATED
        to: CANCELLED
        trigger: POST /programming-events/{id}/cancel
        actor: ProgrammingCoordinator
        preconditions:
          - "ProgrammingEvent.status must be DRAFT or ACTIVATED (ERR_PROGRAMMING_EVENT_NOT_CANCELLABLE)"
          - "No linked Showtime has status RUNNING (ERR_SHOWTIME_IN_PROGRESS)"
        side_effects:
          - "status → CANCELLED"
          - "Every linked Showtime with status SCHEDULED → CANCELLED"
          - "updated_at refreshed"

  # ---------------------------------------------------------------------------
  # OrderSlip — PARALLEL dimensions: `status` (ordering/fulfilment) and
  # `id_check_status` (alcohol verification) evolve independently.
  # ---------------------------------------------------------------------------
  - entity: OrderSlip
    initial_state: PLACED
    terminal_states: [DELIVERED, CANCELLED, VOIDED]
    transitions:
      - from: PLACED
        to: ACCEPTED
        trigger: "system (automatic — the seating-time gate is evaluated at placement; accepted slips are created directly in PLACED and immediately promoted here)"
        actor: system
        preconditions:
          - "Showtime.mode == DINING_OPEN (otherwise the placement is rejected with ERR_SILENT_ORDER_VIOLATION and no slip row is created)"
          - "now <= showtime.dining_close_at_utc for a channel == BEVERAGE slip (ERR_DINING_WINDOW_CLOSED)"
          - "now <= showtime.entree_ready_deadline_utc for a channel == ENTREE slip (ERR_ENTREE_DEADLINE_PASSED)"
          - "Every line's MenuItem.availability_state == AVAILABLE (ERR_MENU_ITEM_UNAVAILABLE)"
        side_effects:
          - "status → ACCEPTED; placement_mode → PRE_SHOW"
          - "resolved_lines, subtotal_cents, channel, id_check_required computed"
          - "id_check_status → PENDING when id_check_required, else NOT_REQUIRED"
          - "opens the slip's CheckTab with status OPEN and original_cents 0"
          - "in_kitchen_at_utc stays null until POST /order-slips/{id}/prepare"
          - "increments Showtime.version by 1"
          - "updated_at refreshed"

      - from: ACCEPTED
        to: PREPARING
        trigger: POST /order-slips/{id}/prepare
        actor: Server
        preconditions:
          - "OrderSlip.status must be ACCEPTED (ERR_ORDER_SLIP_NOT_ACCEPTED)"
          - "The acting Server must be the server_id on this slip's SectionAssignment (ERR_NOT_ASSIGNED_SERVER)"
          - "For a channel == ENTREE slip: the KitchenTicket must exist and now >= ticket.fire_at_utc (ERR_FIRE_WINDOW_NOT_OPEN)"
          - "For an ENTREE slip whose projected_delivery_at_utc > showtime.entree_ready_deadline_utc: the KitchenTicket must carry a non-empty overflow_reason (ERR_ENTREE_OVERFLOW_ACK_REQUIRED)"
          - "showtime.service_mode must be IN_KITCHEN or PRE_SHOW (ERR_DARK_PERIOD_FULFILMENT_BLOCKED)"
        side_effects:
          - "status → PREPARING; in_kitchen_at_utc stamped"
          - "KitchenTicket.status → PREPARING; sequence_position recomputed"
          - "the slip's CheckTab.original_cents is set to OrderSlip.subtotal_cents"
          - "updated_at refreshed"

      - from: PREPARING
        to: READY
        trigger: POST /order-slips/{id}/mark-ready
        actor: Server
        preconditions:
          - "OrderSlip.status must be PREPARING (ERR_ORDER_SLIP_NOT_PREPARING)"
          - "now >= KitchenTicket.projected_delivery_at_utc (ERR_TICKET_NOT_READY)"
        side_effects:
          - "status → READY; KitchenTicket.status → READY"
          - "updated_at refreshed"

      - from: READY
        to: DELIVERED
        trigger: POST /order-slips/{id}/deliver
        actor: Server
        preconditions:
          - "OrderSlip.status must be READY (ERR_ORDER_SLIP_NOT_READY)"
          - "The acting Server must be the server_id on this slip's SectionAssignment (ERR_NOT_ASSIGNED_SERVER)"
          - "When id_check_required == true: id_check_status must be VERIFIED (ERR_ID_CHECK_REQUIRED)"
          - "now <= showtime.entree_ready_deadline_utc for a channel == ENTREE slip (ERR_ENTREE_DEADLINE_PASSED) — a late entree is delivered as a service compensation instead"
        side_effects:
          - "status → DELIVERED; delivered_at_utc stamped; KitchenTicket.status → DELIVERED"
          - "updated_at refreshed"

      - from: PLACED
        to: SILENT
        trigger: POST /order-slips (blocked placement — no row is persisted; the rejection is reported on the response envelope)
        actor: Server
        preconditions:
          - "Showtime.mode == DINING_CLOSED (ERR_SILENT_ORDER_VIOLATION)"
        side_effects:
          - "no OrderSlip row is created; the response is an error envelope with data.error_id = ERR_SILENT_ORDER_VIOLATION"
          - "placement_mode is never persisted as SILENT, since the rejected placement writes no row"
        note: "Declared for completeness: this is the rejected-placement path, not a persisted state."

      - from: ACCEPTED
        to: VOIDED
        trigger: POST /showtimes/{id}/start-feature (cascade) or POST /showtimes/{id}/cancel
        actor: system
        preconditions:
          - "The slip's KitchenTicket was voided because its id_check_status was still PENDING at the feature-start boundary"
        side_effects:
          - "status → VOIDED; KitchenTicket.status → VOIDED"
          - "The seat is released; CheckTab.original_cents set to 0 and the tab closes unpaid"
          - "the slip leaves the showtime's rollup cohort, so kitchen_load_rollup and order_slip SKU totals recompute for the surviving cohort"
          - "Server.rollup_provisional_cents recomputed for the owning server, which changes the auditorium's shock_liability figure"
          - "updated_at refreshed"

      - from: PLACED
        to: CANCELLED
        trigger: POST /showtimes/{id}/cancel
        actor: system
        preconditions:
          - "Parent Showtime is cancelled"
        side_effects:
          - "status → CANCELLED; updated_at refreshed"

      - from: ACCEPTED
        to: CANCELLED
        trigger: POST /showtimes/{id}/cancel
        actor: system
        preconditions:
          - "Parent Showtime is cancelled"
        side_effects:
          - "status → CANCELLED; KitchenTicket.status → VOIDED; updated_at refreshed"

      - from: PREPARING
        to: CANCELLED
        trigger: POST /showtimes/{id}/cancel
        actor: system
        preconditions:
          - "Parent Showtime is cancelled"
        side_effects:
          - "status → CANCELLED; KitchenTicket.status → VOIDED; updated_at refreshed"

      - from: DELIVERED
        to: DELIVERED
        trigger: POST /showtimes/{id}/start-feature or POST /order-slips/{id}/deliver past entree_ready_deadline_utc (service compensation)
        actor: system
        preconditions:
          - "The slip was delivered after entree_ready_deadline_utc (late_delivery == true)"
        side_effects:
          - "increments OrderSlip.version by 1"
          - "the slip's CheckTab.refunded_cents increases by compensation_refund.auto_refund and CheckTab.status moves to REFUNDED or PARTIALLY_REFUNDED"

      - from: DELIVERED
        to: DELIVERED
        trigger: POST /disturbance-events/{id}/approve-ejection (ejection compensation)
        actor: KitchenLead
        preconditions:
          - "The slip's seat is the subject of an approved ejection and its CheckTab is not already REFUNDED"
        side_effects:
          - "increments OrderSlip.version by 1"
          - "the slip's CheckTab.refunded_cents is raised to original_cents, so original_cents - refunded_cents == 0"

      - from: PLACED
        to: PLACED
        trigger: POST /checks/{id}/close (settlement)
        actor: Server
        preconditions:
          - "The check is OPEN or PARTIALLY_REFUNDED"
        side_effects:
          - "increments OrderSlip.version by 1"
          - "the slip's CheckTab.status → SETTLED"

  # -------------------------------------------------------------------------
  # SectionAssignment — the section's own lifecycle.
  # -------------------------------------------------------------------------
  - entity: SectionAssignment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: REASSIGNMENT_PENDING
        trigger: POST /showtimes/{id}/cancel (pre-cascade flag) or PATCH /section-assignments/{id} against a version that has since advanced
        actor: KitchenLead
        preconditions:
          - "SectionAssignment.status must be ACTIVE (ERR_SECTION_ASSIGNMENT_NOT_ACTIVE)"
          - "The incoming server must pass the temporal overlap and aggregate hard-cap checks (ERR_SERVER_SECTION_OVERLAP, ERR_SERVER_HARD_CAP_EXCEEDED)"
        side_effects:
          - "status → REASSIGNMENT_PENDING; increments SectionAssignment.version by 1"
          - "the outgoing server's Server.status recomputed"

      - from: REASSIGNMENT_PENDING
        to: ACTIVE
        trigger: PATCH /section-assignments/{id}
        actor: KitchenLead
        preconditions:
          - "expected_section_assignment_version must match the current version (ERR_STALE_SECTION_ASSIGNMENT_VERSION)"
          - "The incoming server must pass the temporal overlap and aggregate hard-cap checks"
        side_effects:
          - "status → ACTIVE; server_id replaced; increments SectionAssignment.version by 1"
          - "server_shift_load.projected_load recomputed for both servers"

      - from: ACTIVE
        to: COMPLETED
        trigger: POST /section-assignments/{id}/close or POST /showtimes/{id}/complete (cascade)
        actor: KitchenLead
        preconditions:
          - "SectionAssignment.status must be ACTIVE or REASSIGNMENT_PENDING"
        side_effects:
          - "status → COMPLETED; computes assignment_points; Server.lifetime_points incremented by assignment_points; Server.status and Server.in_rotation recomputed"
          - "increments SectionAssignment.version by 1"
          - "increments Server.version by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: POST /section-assignments/{id}/cancel or POST /showtimes/{id}/cancel (cascade)
        actor: KitchenLead
        preconditions:
          - "SectionAssignment.status must be non-terminal (ERR_SECTION_ASSIGNMENT_NOT_ACTIVE)"
        side_effects:
          - "status → CANCELLED; computes assignment_points with the cancel multiplier; applies the a-priori revert described in §1.5"
          - "increments SectionAssignment.version by 1"

      - from: REASSIGNMENT_PENDING
        to: CANCELLED
        trigger: POST /showtimes/{id}/cancel (executed before the ACTIVE → CANCELLED cascade so no REASSIGNMENT_PENDING assignments remain)
        actor: system
        preconditions:
          - "Parent Showtime is cancelled"
        side_effects:
          - "status → CANCELLED; increments SectionAssignment.version by 1"

      - from: COMPLETED
        to: ACTIVE
        trigger: POST /showtimes/{id}/reopen-service
        actor: system
        preconditions:
          - "The parent showtime was reopened"
        side_effects:
          - "status → ACTIVE; assignment_points reset to 0; Server.lifetime_points decremented by the prior assignment_points; increments SectionAssignment.version by 1"

  # -------------------------------------------------------------------------
  # CheckTab — settlement and refund posture.
  # -------------------------------------------------------------------------
  - entity: CheckTab
    initial_state: OPEN
    terminal_states: [REFUNDED]
    transitions:
      - from: OPEN
        to: PARTIALLY_REFUNDED
        trigger: "system (automatic service compensation) or POST /checks/{id}/refund"
        actor: system
        preconditions:
          - "0 < refund amount and refunded_cents + amount < original_cents"
        side_effects:
          - "refunded_cents += refund amount; status → PARTIALLY_REFUNDED"
          - "updated_at refreshed"

      - from: OPEN
        to: REFUNDED
        trigger: "system (automatic full compensation) or POST /checks/{id}/refund"
        actor: system
        preconditions:
          - "refunded_cents + amount == original_cents"
        side_effects:
          - "refunded_cents = original_cents; status → REFUNDED"
          - "updated_at refreshed"

      - from: OPEN
        to: SETTLED
        trigger: POST /checks/{id}/close
        actor: Server
        preconditions:
          - "CheckTab.status must not be REFUNDED (ERR_CHECK_NOT_OPEN)"
          - "CheckTab.refunded_cents == 0"
        side_effects:
          - "status → SETTLED; increments OrderSlip.version by 1"

      - from: SETTLED
        to: SETTLED
        trigger: "POST /checks/{id}/refund against a check already settled by prior service compensation"
        actor: KitchenLead
        preconditions:
          - "CheckTab.status must be SETTLED with refunded_cents > 0 (a second refund on a compensated check)"
        side_effects:
          - "refunded_cents = original_cents; status → REFUNDED"
          - "updated_at refreshed"

      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: POST /disturbance-events/{id}/approve-ejection (compensating refund)
        actor: KitchenLead
        preconditions:
          - "The slip's seat is the subject of an approved ejection"
        side_effects:
          - "refunded_cents = original_cents; status → REFUNDED"
          - "original_cents - refunded_cents becomes exactly 0"

      - from: REFUNDED
        to: REFUNDED
        trigger: any further refund attempt
        actor: KitchenLead
        preconditions:
          - "CheckTab.status must not be REFUNDED"
        side_effects:
          - "rejected with ERR_REFUND_EXCEEDS_ORIGINAL"

# =============================================================================
# Table 2b — Concurrency Rules  (§1.2.1)
# =============================================================================
concurrency_rules:

  - rule_id: slip-create-stale-showtime
    parent_entity: Showtime
    write_endpoint: "POST /order-slips"
    occ_field: "expected_showtime_version"
    description: |
      Placing an OrderSlip against a Showtime whose version has advanced since
      the client last read it is rejected. The intervening writer may have
      opened the dining window, moved the showtime into SERVICE, or completed
      it — all of which legitimately change the seating rules the slip was
      composed against, so a stale view must be refused rather than silently
      honoured.
    error_id: ERR_STALE_SHOWTIME_VERSION
    http_status: 412

  - rule_id: reassign-stale-section-assignment
    parent_entity: SectionAssignment
    write_endpoint: "PATCH /section-assignments/{id}"
    occ_field: "expected_section_assignment_version"
    description: |
      Reassigning the server on a SectionAssignment whose version has advanced
      since the client last read it is rejected. A completed showtime cascade
      (§1.2 Showtime RUNNING → COMPLETED) legitimately closes the assignment
      and bumps its version, so a reassignment composed against the prior view
      must be refused.
    error_id: ERR_STALE_SECTION_ASSIGNMENT_VERSION
    http_status: 412

  - rule_id: activate-stale-programming-event
    parent_entity: ProgrammingEvent
    write_endpoint: "POST /programming-events/{id}/activate"
    occ_field: "expected_programming_event_version"
    description: |
      Activating a ProgrammingEvent whose version has advanced since the client
      last read it is rejected. A pre-show content approval legitimately bumps
      the event's version and can add signature items, so an activation
      composed against the earlier cut must be refused.
    error_id: ERR_STALE_PROGRAMMING_EVENT_VERSION
    http_status: 412

  - rule_id: checktab-close-stale-order-slip
    parent_entity: OrderSlip
    write_endpoint: "POST /checks/{id}/close"
    occ_field: "expected_order_slip_version"
    description: |
      Closing a CheckTab against an OrderSlip whose version has advanced since
      the client last read it is rejected. An automatic service-compensation
      refund (§1.3 compensation_refund) legitimately bumps the slip's version
      while the tab is open, so a close composed against the stale, un-refunded
      view must be refused.
    error_id: ERR_STALE_ORDER_SLIP_VERSION
    http_status: 412

# =============================================================================
# Table 3 — Calculation Rules Table  (§1.3)
# =============================================================================
calculations:

  # --- Rule 1 instance A (dual variant, subject = a single showtime's kitchen load)
  - name: kitchen_load_projection
    description: "Projected cold_line ENTREE point demand for one showtime, used both for the pre-show capacity gate and for fire sequencing."
    trigger: "OrderSlip acceptance; POST /showtimes/{id}/start-service; POST /kitchen-tickets/{id}/ack-overflow"
    algorithm: forward_looking
    formula: |
      inputs:
        S   = the target showtime, start_at_utc = T, kitchen_point_rate = R
        Ti  = entree_ready_deadline_utc = T + floor(runtime_minutes * 0.75)
        Cs  = T - 60 minutes   (cluster instant of S)
        CLUSTER(S) = { X : X.auditorium_id == S.auditorium_id,
                            X.status IN {SCHEDULED, DINING_OPEN, SERVICE, RUNNING},
                            |X.start_at_utc - Cs| <= CLUSTER_WINDOW_MINUTES }

      base variant (wave_projection — the one the pre-show capacity gate uses):
        COHORT(S) = { X in CLUSTER(S) : X.start_at_utc <= S.start_at_utc }
        demand_wave(X) = sum over OrderSlip O on X with channel == ENTREE
                                 and O.status IN {PLACED, ACCEPTED, PREPARING}
                         of O.subtotal_points      # point_cost helper, see order_subtotal
        kitchen_load_projection = sum of demand_wave(X) for X in COHORT(S)

      variant final_projection (item_count_projection — the one used once the
      showtime leaves the seating phases, i.e. status NOT IN {SCHEDULED, DINING_OPEN}):
        COHORT(S) = CLUSTER(S)
        demand_wave(X) = count of OrderSlip O on X with channel == ENTREE
                                 and O.status IN {PLACED, ACCEPTED, PREPARING}
        kitchen_load_projection = sum of demand_wave(X) for X in COHORT(S)

      Notice the two differences: the base counts only showtimes starting at or
      before S (earlier waves are drained by the time S's own kitchen slot opens),
      while the final variant counts every showtime in the cluster; and the base
      sums point costs while the final sums item counts.
    input_set: "Cold-line ENTREE demand only. Hot-line BEVERAGE slips are excluded. Slips in READY, DELIVERED, CANCELLED, or VOIDED are excluded."
    constants:
      CLUSTER_WINDOW_MINUTES: 120
      CLUSTER_ANCHOR_LEAD_MINUTES: 60
      ENTREE_DEADLINE_FRACTION: 0.75
    precision: "integer points (ceil when converted to minutes)"
    variants:
      - name: wave_projection
        when: "Pre-show capacity gate at OrderSlip acceptance, and the standing load shown on the showtime read model."
        difference: "COHORT restricted to showtimes with start_at_utc <= S.start_at_utc; demand measured in point cost (sum of quantity * prep_minutes)."
      - name: final_projection
        when: "After the dining window closes (Showtime → SERVICE), written to the projection snapshot."
        difference: "COHORT is the whole cluster; demand measured in item count (number of ENTREE slips)."

  # --- Rule 2 instance A (combinatorial mode (a): >=3 inputs, nested min/ceil, tiered rate selection)
  - name: dining_order_capacity_snapshot
    description: "The capacity verdict returned on the showtime read model and enforced at OrderSlip acceptance."
    trigger: "POST /order-slips (acceptance gate); GET /showtimes/{id}/dining-capacity (read model)"
    algorithm: threshold
    formula: |
      1. Entree gate (cold_line):
           load    = kitchen_load_projection(S)                      # base wave_projection variant
           minutes = ceil(load / R)
           entree_latest = Ti - minutes
           entree_band_slip = (now <= entree_latest) ? NORMAL
                            : (now <= Ti)           ? LATE
                            :                         BLOCKED
      2. Beverage gate (hot_line), evaluated only for a BEVERAGE slip:
           b_load    = sum of point_cost over OPEN hot_line KitchenTickets on S
           b_minutes = ceil(b_load / A)          where A = alcove_point_rate
           bev_latest = Ti - b_minutes
           bev_band_slip = (now <= bev_latest) ? NORMAL : (now <= Ti) ? LATE : BLOCKED
      3. candidate_band = min(entree_band_slip, bev_band_slip)  over the ordered
                          set [NORMAL < LATE < BLOCKED]
      4. load_pct = (load * 100) // max(1, R * (Ti - now))
         threshold_band = (load_pct > 100) ? BLOCKED : (load_pct >= 90) ? LATE : NORMAL
      5. capacity_band = min(candidate_band, threshold_band)      # the second min() layer
      6. admission:
           NORMAL  → accept, no acknowledgement required
           LATE    → accept only when the caller supplies capacity_ack: true;
                     without it the slip is rejected with ERR_KITCHEN_CAPACITY_BAND
           BLOCKED → reject with ERR_KITCHEN_CAPACITY_BAND regardless of the flag
         BOUNDARY, pinned: load_pct == 100 exactly is LATE, because the BLOCKED
         test is strictly greater than 100. Now exactly equal to entree_latest is
         NORMAL, because that test is at-or-before.
         S.entry_stage is a reported counter only — the count of OrderSlip rows
         already ACCEPTED on S. It gates nothing; capacity is decided by the two
         bands above.
    input_set: "Entree demand counts the cold_line cohort of kitchen_load_projection's base variant. Beverage demand counts OPEN hot_line KitchenTickets on S only."
    constants:
      SERVICE_WINDOW_LEAD_MINUTES: 10
      ENTRY_STAGE_LATE_AT: 2
      ENTRY_STAGE_BLOCKED_AT: 3
      LOAD_PCT_LATE: 90
      LOAD_PCT_BLOCKED: 100
      ENTREE_DEADLINE_FRACTION: 0.75
    precision: "integer percentages; floor division on load_pct"
    variants:
      - name: pre_show_snapshot
        when: "S.status IN {SCHEDULED, DINING_OPEN} — the seating window is still absorbing orders and the sliding ramp-in uses load_pct against the remaining minutes to Ti."
        difference: "threshold_band is computed from load_pct against (Ti - now)."
      - name: post_close_snapshot
        when: "S.status NOT IN {SCHEDULED, DINING_OPEN} — the dining window has closed and no further pre-show orders are admitted."
        difference: "candidate_band is forced to BLOCKED and threshold_band is not consulted; the read model reports the binding band as BLOCKED."

  # --- Rule 2 instance B (combinatorial mode (b): nested rounding, per-line-then-sum)
  - name: order_subtotal
    description: "Slip-level money total, with the rounding order pinned."
    trigger: "OrderSlip acceptance; theme-price application"
    algorithm: aggregation
    formula: |
      For each input line L (menu_item_id m, quantity q):
        unit = theme_price_cents when the parent Showtime belongs to an
               ACTIVATED ProgrammingEvent and m is offered on that event's themed
               menu; otherwise MenuItem(m).price_cents
        raw_line = unit * q
        theme_discount = round_half_up(raw_line * 0.05) when unit is a theme price
                         else 0
        line_total_cents = raw_line - theme_discount          # rounded PER LINE
      subtotal_cents = sum of line_total_cents across all lines   # then summed
      ROUNDING ORDER IS PINNED: per-line discount rounding, then sum. Summing
      raw lines first and rounding once produces a different cent total and is
      WRONG.
    input_set: "All lines on the slip, in input order (order does not affect the sum, but the per-line rounding does)."
    constants:
      THEME_DISCOUNT_PCT: 0.05
    precision: "integer cents; round_half_up applied once per line"
    variants:
      - name: standard_pricing
        when: "The parent showtime is not part of an ACTIVATED ProgrammingEvent."
        difference: "theme_discount is 0 for every line; subtotal_cents = sum(unit * q)."
      - name: themed_pricing
        when: "The parent showtime belongs to an ACTIVATED ProgrammingEvent."
        difference: "each line carries its own rounded 5% theme discount, so the total is strictly below the standard total."

  # --- Rule 3 precursor: ticket priority spine used by the sequence-position rule ---
  - name: ticket_priority_score
    description: "Compatibility priority used when two cold_line tickets would otherwise tie inside the same fire minute."
    trigger: "KitchenTicket creation and re-sequencing"
    algorithm: weighted_scoring
    formula: |
      allergy_flag      = 1 when any line on the slip marks an allergen substitution, else 0
      large_party_flag  = 1 when the slip has >= 4 total units across its lines, else 0
      priority = (allergy_flag * 3) + (large_party_flag * 2)
      Tickets are ordered by descending priority inside the same fire minute.
    input_set: "Cold_line KitchenTickets in QUEUED or PREPARING state."
    constants:
      ALLERGY_WEIGHT: 3
      LARGE_PARTY_WEIGHT: 2
      LARGE_PARTY_UNITS: 4
    precision: "integer"

  # --- Rule 2 instance B companion / Rule 9 instance B
  - name: ticket_sequence_position
    description: "1-based fire position of a cold_line KitchenTicket within its showtime's kitchen run."
    trigger: "POST /showtimes/{id}/start-service; POST /order-slips/{id}/prepare"
    algorithm: chronological
    formula: |
      COHORT = every KitchenTicket on the same showtime with station == cold_line
               and status in {QUEUED, PREPARING}
      SORT COHORT by:
        1. ticket_priority_score DESC        # see ticket_priority_score (allergy first)
        2. created_at ASC                    # first-placed wins the tie
      sequence_position = 1-based index of this ticket in the sorted list
      NOTE: fire_at_utc is an OUTPUT of this order, not an input. Sequencing is
      decided by priority then placement time; ticket_fire_reallocation then lays
      the fire instants out along that order.
      RULE: only tickets with status QUEUED or PREPARING occupy a position. A
      ticket that reaches READY, DELIVERED, or VOIDED leaves the cohort and does
      NOT keep its slot. Voiding ticket at position 2 of 4 therefore moves the
      ticket previously at position 3 into position 2 and leaves position 4
      occupied — i.e. the voided ticket's slot is renumbered over, so the ticket
      originally at 4 endures at position 3.
    input_set: "Cold_line tickets in QUEUED or PREPARING only. Hot_line tickets are never numbered."
    constants:
      FIRST_POSITION: 1
    precision: "integer"

  # --- Rule 9 instance B (compensating invariant, conserved quantity = kitchen work)
  - name: ticket_fire_reallocation
    description: "Re-derives fire_at_utc for the cold_line cohort after any membership change."
    trigger: "POST /order-slips/{id}/prepare; POST /kitchen-tickets/{id}/void; POST /showtimes/{id}/start-feature"
    algorithm: constraint_propagation
    formula: |
      ENTRÉE_FIRE_AT = start_at_utc - MINUTES_FROM_ENTREE_TO_START
      For the showtime's cold_line cohort (QUEUED or PREPARING, sorted by
      ticket_sequence_position):
        cursor = ENTRÉE_FIRE_AT
        for ticket in cohort order:
          ticket.fire_at_utc = cursor
          cursor = cursor + ceil(ticket.point_cost / kitchen_point_rate)
      INVARIANT (must hold after every recomputation):
        sum(ceil(point_cost / kitchen_point_rate) for the cohort) ==
        last_fire_at_utc - ENTRÉE_FIRE_AT
      where last_fire_at_utc is the completion instant of the final cohort member.
      Fire capacity may be neither created nor destroyed by voiding, re-adding, or
      re-sequencing a ticket.
    input_set: "Cold_line QUEUED/PREPARING tickets only."
    constants:
      MINUTES_FROM_ENTREE_TO_START: 30
    precision: "integer minutes; ceil per ticket"

  # --- Rule 1 instance B (dual variant, subject = the theatre-wide day)
  - name: server_shift_load
    description: "How much section serving a server carried on a given service day."
    trigger: "POST /servers/{id}/shift/start; POST /servers/{id}/shift/end"
    algorithm: chronological
    formula: |
      inputs: server X, service day D (local calendar date of the logical clock)

      base variant (projected_load):
        served_sections = count of SectionAssignment A where A.server_id == X,
                          A.created_at date == D, A.status != CANCELLED
        server_shift_load = served_sections
        Used at shift start and for the daily cap check.

      variant final_load:
        covered_sections = count of SectionAssignment A where A.server_id == X,
                           A.status == COMPLETED, A.created_at date == D
        server_shift_load = covered_sections
        Used at shift end for the payroll figure.
    input_set: "SectionAssignments created on service day D. Cancelled assignments are excluded from both variants."
    constants:
      DAILY_SECTION_CAP: 3
    precision: "integer"
    variants:
      - name: projected_load
        when: "Shift start; the cap check."
        difference: "Counts every non-CANCELLED assignment including DRAFT and pending ones."
      - name: final_load
        when: "Shift end; payroll."
        difference: "Counts COMPLETED assignments only, so a reassigned-away section drops out of the final figure but remains in the projected figure."

  # --- Rule 1 companion: server quality, consuming the dual-variant load ---
  - name: server_quality_index
    description: "Rolling quality index that decides section candidacy and drives the multiplicative penalty chain."
    trigger: "POST /section-assignments/{id}/score; POST /section-assignments/{id}/close; POST /servers/{id}/clear-penalty"
    algorithm: weighted_scoring
    formula: |
      GRADE_WEIGHT = {"A": 1.0, "B": 0.8, "C": 0.5}
      window = ratings whose assignment_id belongs to a SectionAssignment created
               within the trailing SERVER_QUALITY_WINDOW_DAYS days
      raw = sum(GRADE_WEIGHT[g] for g in window) / max(1, len(window))
      penalty_pct = 0.05 * count(SectionAssignment A where A.server_id == X
                                 and A.assignment_points >= 5
                                 and A.created_at within the window)
      server_quality_index = max(0.0, raw - penalty_pct)
    input_set: "Ratings on non-cancelled assignments inside the trailing window. Assignments outside the window are excluded."
    constants:
      SERVO_BUFFER_MINUTES: 15
      SERVER_QUALITY_WINDOW_DAYS: 30
      PENALTY_PCT_PER_LOW_ASSIGNMENT: 0.05
      QUALITY_INDEX_FLOOR: 0.0
    precision: "4 decimal places, round_half_up"

  # --- Rule 4 instance B hop 1 / Rule 6 instance B / Rule 9 instance A
  - name: order_slip_completion
    description: "Fulfilment outcome of a slip at the feature-start boundary; source of the auto-compensation rule."
    trigger: "POST /showtimes/{id}/start-feature"
    algorithm: chronological
    formula: |
      For each OrderSlip O on the showtime with status in {ACCEPTED, PREPARING}:
        if O.id_check_required == true and O.id_check_status == PENDING:
          O.status = VOIDED ; KitchenTicket.status = VOIDED
          O.compensation_tier = NONE ; O auto_refund_cents = 0
        else if now <= showtime.entree_ready_deadline_utc:
          O.status unchanged (remains in flight)
        else:
          O.status = DELIVERED (recorded as a late service delivery)
          O.late_delivery = true
          O auto_refund_cents = round_half_up(O.subtotal_cents * AUTO_COMP_REFUND_PCT)
          O.compensation_tier = AUTO
    input_set: "Slips in ACCEPTED or PREPARING at the boundary. Already DELIVERED, CANCELLED, or VOIDED slips are excluded."
    constants:
      AUTO_COMP_REFUND_PCT: 0.3
    precision: "integer cents"

  # --- Rule 9 instance A (compensating invariant, conserved quantity = the settled tab)
  - name: compensation_refund
    description: "Auto-compensation for a service failure, and the ejection refund; both must leave the settled total at zero."
    trigger: "POST /showtimes/{id}/start-feature; POST /disturbance-events/{id}/approve-ejection"
    algorithm: waterfall_allocation
    formula: |
      auto_refund (service failure):
        tab = CheckTab for the slip
        refund = round_half_up(slip.subtotal_cents * 0.3)
        tab.refunded_cents += refund
        tab.status = REFUNDED when tab.refunded_cents == tab.original_cents,
                     else PARTIALLY_REFUNDED
        tab.reason_code = SERVICE_DELAY when the slip was served past
                          entree_ready_deadline_utc, else SERVICE_COMP_FAILURE

      compensating refund (ejection):
        tab = CheckTab for the slip
        refund = tab.original_cents - tab.refunded_cents      # fill the remainder
        tab.refunded_cents = tab.original_cents
        tab.status = REFUNDED
        tab.reason_code = EJECTION_NO_TALKING when the DisturbanceEvent.kind
                          == NO_TALKING else EJECTION_NO_TEXTING

      INVARIANT: after either refund, tab.original_cents - tab.refunded_cents == 0.
      A tab carrying a 30% auto-compensation and then an ejection refund must
      settle at exactly zero, not at 30% of the original.
    input_set: "CheckTabs in OPEN, PARTIALLY_REFUNDED, or SETTLED state. A REFUNDED tab cannot be refunded again."
    constants:
      AUTO_COMP_REFUND_PCT: 0.3
      SETTLED_TOTAL: 0
    precision: "integer cents"

  # --- Rule 1 instance A companion (dual variant, subject = ejection accounting at a cluster instant)
  - name: ejection_cluster_refund_liability
    description: "Refund liability booked for the ejections an auditorium processed at an instant."
    trigger: "POST /disturbance-events/{id}/approve-ejection; GET /auditoriums/{id}/refund-liability"
    algorithm: aggregation
    formula: |
      base variant (fair_liability):
        for each approved ejection E on the auditorium with occurred_at_utc == I:
          refund_liability += the ejected slip's CheckTab.refunded_cents
        Used for the compensation reconciliation report.

      variant shock_liability:
        entries = distinct Server rows that own the SectionAssignments of the
                  ejected slips at instant I
        refund_liability = sum(entry.rollup_provisional_cents for entry in entries)
        Used for the charting/briefing report.
    input_set: "DisturbanceEvents with stage == EJECTION and ejected_occupant_id set, on the target auditorium, whose occurred_at_utc equals the queried instant."
    constants:
      INSTANT_EXACT_MATCH: true
    precision: "integer cents"
    variants:
      - name: fair_liability
        when: "Compensation reconciliation."
        difference: "Per-ejection refunded_cents, keyed on the ejected slip's own CheckTab."
      - name: shock_liability
        when: "Theatre charting report."
        difference: "Folds the original_cents of each ejected slip plus the original_cents of every other still-open slip charged to the same owning server, so it is strictly greater than fair_liability whenever an owning server also holds an unejected open slip at the same instant."

  # --- Rule 6 instance B (boundary on the empty-set / zero-count edge)
  - name: disturbance_escalation
    description: "Escalates a guest's accumulated disturbance strikes; the frozen preceding-day stage expires on a read."
    trigger: "POST /disturbance-events/{id}/amend; POST /disturbance-events; GET /auditoriums/{id}/posture"
    algorithm: threshold
    formula: |
      window = trailing STRIKE_WINDOW_DAYS service days, INCLUSIVE of the current
               instant's day. The window is an instant window, so it hugs every
               service instant; after a day rollover that constant-length window
               no longer reaches the preceding day, so an unrefreshed stage set
               expires on the next read.
      live = stages of NO_TALKING DisturbanceEvents on this occupant whose
             occurred_at_utc falls inside the window
      strike_count = count of distinct stages in live        # 0, 1, or 2
      proposed_stage = WARNING        when strike_count == 0   # STRICTLY below 1
                     = FINAL_WARNING  when strike_count == 1   # exactly one
                     = EJECTION       when strike_count >= 2
      The zero branch is reachable on a read: because WINDOW_MODE is INSTANT and
      the window length equals one day, after a day rollover the window no longer
      reaches the preceding day's event, so an occupant who carried
      FINAL_WARNING drops back to WARNING. An implementation that writes
      `strike_count >= 1 → EJECTION` ejects on the very first warning and is
      WRONG: the boundary sits at strike_count == 1 → FINAL_WARNING.
    input_set: "NO_TALKING DisturbanceEvents only; NO_TEXTING events are excluded from strike accumulation and handled by the separate texting ladder."
    constants:
      WARN_AT_STRIKES: 1
      EJECT_AT_STRIKES: 2
      STRIKE_WINDOW_DAYS: 1
    precision: "integer"

  # --- Rule 4 instance B hop 2 (penalty chain)
  - name: section_assignment_points
    description: "Multiplicative quality/severity points a section assignment scores."
    trigger: "POST /section-assignments/{id}/close; POST /section-assignments/{id}/cancel"
    algorithm: weighted_scoring
    formula: |
      base_points = { "A": 1, "B": 3, "C": 6 }[latest_rating_grade] or 2 when the
                    assignment carries no rating
      ejection_multiplier = 1.0 when the assignment's showtime had no
                            ejection-linked refund, else 2.0
      refund_multiplier   = 1.0 when the assignment caused no approved ejection or
                            service compensation, else 1.5
      assignment_points = round_half_up(base_points * ejection_multiplier
                                        * refund_multiplier)
      On the cancel path (§1.2 ACTIVE → CANCELLED) a further CANCEL_MULTIPLIER of
      0.5 is applied before rounding, so a cancelled B assignment scores
      round_half_up(3 * 1.0 * 1.0 * 0.5) == 2.
      Server.lifetime_points += assignment_points on close; -= assignment_points
      on the a-priori revert path described in §1.2.
    input_set: "Ratings and refunds recorded on the assignment's showtime within the same service day."
    constants:
      BASE_POINTS: { A: 1, B: 3, C: 6, UNRATED: 2 }
      EJECTION_MULTIPLIER: 2.0
      REFUND_MULTIPLIER: 1.5
      CANCEL_MULTIPLIER: 0.5
    precision: "integer points"

  # --- Rule 3 companion / consistency-model claim: self-healing on read
  - name: auditorium_posture_reconciliation
    description: "Re-derives the auditorium's posture axes; a stale computed value self-heals on the next read."
    trigger: "GET /auditoriums/{id}/posture; every child showtime mutation"
    algorithm: projection
    formula: |
      status = LIVE     when at least one member Showtime has mode == DINING_OPEN
                        and status IN {DINING_OPEN, SERVICE, RUNNING}
               TURNOVER when at least one member Showtime has mode == DINING_CLOSED
                        and status == SCHEDULED
               DARK     otherwise
      service_posture = same predicate as status (kept as a separate read-only
                        mirror so a stale row is detectable)
      build_phase     = READY          when any scheduled showtime has
                                        dining_open_at_utc <= now
                        NEARLY_READY   when any scheduled showtime has
                                        now <= dining_open_at_utc < now + READY_LEAD_MINUTES
                        SETUP          when any scheduled showtime has
                                        dining_open_at_utc > now + READY_LEAD_MINUTES
                        EMPTY          when no scheduled showtime exists
      A stored value that disagrees with this predicate is recomputed and
      persisted when read; reconciliation is not deferred to a batch job.
    input_set: "Member showtimes of the auditorium; the next upcoming SCHEDULED showtime for build_phase."
    constants:
      READY_LEAD_MINUTES: 30
      NEARLY_READY_LEAD_MINUTES: 30
    precision: "n/a"

  # --- Rule 4 instance A hop 1: nutrition rollup
  - name: kitchen_load_rollup
    description: "Cross-channel load rollup, re-derived whenever a slip membership changes."
    trigger: "POST /order-slips; POST /order-slips/{id}/cancel; POST /kitchen-tickets/{id}/void"
    algorithm: aggregation
    formula: |
      cohort = OrderSlip rows on the showtime whose channel == ENTREE and whose
               status IN {PLACED, ACCEPTED, PREPARING}
      rollup = sum over cohort of point_cost(slip)
      A cancelled or voided slip leaves the cohort and contributes 0; the rollup
      consequently DROPS on cancellation rather than being preserved.
    input_set: "Cold-line slips in PLACED, ACCEPTED, or PREPARING."
    constants:
      EMPTY_ROLLUP: 0
    precision: "integer points"

# =============================================================================
# Table 4 — Validation Rules Table (ordered by priority)  (§1.4)
# =============================================================================
validations:

  # --- 1. Authentication -----------------------------------------------------
  - priority: 1
    category: auth
    check: "Authentication then authorisation, evaluated in that order: X-User-ID and X-User-Role must be present and X-User-Role must be a declared role; the role must then appear on the endpoint's roles list. Authorisation is checked before any existence lookup, so an unauthorised caller never learns whether the path id exists."
    error_id: "ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (missing or undeclared header) | ERR_UNAUTHORIZED_ROLE (declared role not permitted on this endpoint)"
    http_status: 400
    applies_to: "all endpoints"

  # --- 2. Existence (left-to-right along the path) ---------------------------
  - priority: 2
    category: existence
    check: "Every id in the path resolves to an existing resource of the declared kind"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_AUDITORIUM_NOT_FOUND, ERR_SHOWTIME_NOT_FOUND, ERR_MENU_ITEM_NOT_FOUND, ERR_PROGRAMMING_EVENT_NOT_FOUND, ERR_THEMED_MENU_ITEM_NOT_FOUND, ERR_SERVER_NOT_FOUND, ERR_SECTION_ASSIGNMENT_NOT_FOUND, ERR_SHOWTIME_FOR_ASSIGNMENT_NOT_FOUND, ERR_LOCAL_SHIFTABLE_ASSIGNMENT_NOT_FOUND, ERR_LOCAL_SECTION_ASSIGNMENT_NOT_FOUND, ERR_ORDER_SLIP_NOT_FOUND, ERR_CHECK_NOT_FOUND, ERR_DISTURBANCE_EVENT_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints carrying a path id"

  # --- 3. State preconditions ------------------------------------------------
  - priority: 3
    category: state
    check: "Target resource must be in the state the operation requires (each transition's from-state)"
    error_id: "varies (ERR_AUDITORIUM_NOT_ACTIVE, ERR_AUDITORIUM_NOT_DARK, ERR_AUDITORIUM_NOT_SERVING, ERR_SHOWTIME_NOT_SCHEDULED, ERR_SHOWTIME_NOT_DINING_OPEN, ERR_SHOWTIME_NOT_IN_SERVICE, ERR_SHOWTIME_NOT_RUNNING, ERR_SHOWTIME_NOT_COMPLETED, ERR_PROGRAMMING_EVENT_NOT_DRAFT, ERR_PROGRAMMING_EVENT_NOT_CANCELLABLE, ERR_PRE_SHOW_NOT_IN_REVIEW, ERR_PRE_SHOW_NOT_RESUBMITTABLE, ERR_ORDER_SLIP_NOT_ACCEPTED, ERR_ORDER_SLIP_NOT_PREPARING, ERR_ORDER_SLIP_NOT_READY, ERR_ORDER_SLIP_NOT_CANCELLABLE, ERR_CHECK_NOT_OPEN, ERR_DISTURBANCE_NOT_AMENDABLE, ERR_SERVER_NOT_PENALIZED, ERR_SECTION_ASSIGNMENT_NOT_ACTIVE)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  # --- 4. OCC freshness (before business rules) ------------------------------
  - priority: 4
    category: business_constraint
    check: "expected_<parent>_version must equal the parent's current version (optimistic concurrency)"
    error_id: "ERR_STALE_SHOWTIME_VERSION | ERR_STALE_SECTION_ASSIGNMENT_VERSION | ERR_STALE_PROGRAMMING_EVENT_VERSION | ERR_STALE_ORDER_SLIP_VERSION"
    http_status: 412
    applies_to: "POST /order-slips, PATCH /section-assignments/{id}, POST /programming-events/{id}/activate, POST /checks/{id}/close"

  # --- 5. Business safety / compliance ---------------------------------------
  - priority: 5
    category: business_safety
    check: "Alcohol identification: an alcoholic BEVERAGE slip cannot be delivered unless its id_check_status is VERIFIED, and cannot survive the feature-start boundary while PENDING"
    error_id: ERR_ID_CHECK_REQUIRED
    http_status: 403
    applies_to: "POST /order-slips/{id}/deliver, POST /kitchen-tickets/{id}/verify-id"

  - priority: 6
    category: business_safety
    check: "Silent-service protocol: no order may be placed or accepted once the showtime's mode is DINING_CLOSED; guest contact during the dark period is a policy event, never a service channel"
    error_id: ERR_SILENT_ORDER_VIOLATION
    http_status: 409
    applies_to: "POST /order-slips"

  - priority: 7
    category: business_safety
    check: "Guest-subject coherence: a DisturbanceEvent's ejected occupant is derived from the acting server; the approved ejection must name an occupant actually present on this slip's seat"
    error_id: ERR_EJECTED_OCCUPANT_NOT_ON_SLIP
    http_status: 400
    applies_to: "POST /disturbance-events/{id}/approve-ejection"

  # --- 8. Business constraints (ordering, capacity, temporal) ----------------
  - priority: 8
    category: business_constraint
    check: "Silent-service window: the seating gate is evaluated on the ordered curtain instants dining_open_at_utc <= now <= dining_close_at_utc (evaluated before any capacity computation)"
    error_id: ERR_DINING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /order-slips"

  - priority: 9
    category: business_temporal
    check: "Entree deadline: an ENTREE slip cannot be accepted, prepared, or delivered after entree_ready_deadline_utc"
    error_id: ERR_ENTREE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /order-slips, POST /order-slips/{id}/prepare, POST /order-slips/{id}/deliver"

  - priority: 10
    category: business_constraint
    check: "Temporal overlap with a buffer — a server's on-floor interval is the CLOSED interval [showtime.dining_open_at_utc, showtime.start_at_utc], and two of the server's ACTIVE SectionAssignments (in any auditoriums) whose on-floor intervals are separated by less than SERVO_BUFFER_MINUTES are rejected. A separation of exactly SERVO_BUFFER_MINUTES is admitted."
    error_id: ERR_SERVER_SECTION_OVERLAP
    http_status: 409
    applies_to: "POST /section-assignments, PATCH /section-assignments/{id}"

  - priority: 11
    category: business_constraint
    check: "Aggregate capacity — a server may hold at most DAILY_SECTION_CAP non-terminal ACTIVE SectionAssignments created on the same service day, counted over the whole day rather than over any single instant. The 4th assignment of the day is rejected; the 3rd is admitted even when three overlap each other."
    error_id: ERR_SERVER_HARD_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /section-assignments"

  - priority: 12
    category: business_constraint
    check: "Showtime scheduling: runtime_minutes must be at least 1, and two Showtimes on one auditorium whose HALF-OPEN dining windows [dining_open_at_utc, dining_close_at_utc) overlap are rejected. The boundary is half-open, so a showtime whose dining_open_at_utc equals the earlier showtime's dining_close_at_utc is admitted, while one minute earlier is rejected."
    error_id: "ERR_OVERLAPPING_SHOWTIME_WINDOW | ERR_INVALID_SHOWTIME_RUNTIME"
    http_status: 409
    applies_to: "POST /showtimes"

  - priority: 13
    category: business_constraint
    check: "Themed-menu completeness: a SPECIAL_EVENT showtime whose ProgrammingEvent.requires_themed_menu is true cannot open dining until at least one ThemedMenuItem exists"
    error_id: ERR_THEMED_MENU_REQUIRED
    http_status: 409
    applies_to: "POST /showtimes/{id}/open-dining, POST /programming-events/{id}/pre-show-content/submit, POST /programming-events/{id}/activate"

  - priority: 14
    category: business_constraint
    check: "Pre-show approval: a SPECIAL_EVENT showtime cannot open dining unless its ProgrammingEvent.pre_show_content_status is PRE_SHOW_APPROVED"
    error_id: ERR_PRE_SHOW_NOT_APPROVED
    http_status: 409
    applies_to: "POST /showtimes/{id}/open-dining, POST /programming-events/{id}/activate"

  - priority: 15
    category: business_referential
    check: "Section ownership: the acting server must be the server_id on the slip's own SectionAssignment"
    error_id: ERR_NOT_ASSIGNED_SERVER
    http_status: 403
    applies_to: "POST /order-slips/{id}/prepare, POST /order-slips/{id}/deliver, POST /order-slips/{id}/mark-ready"

  - priority: 16
    category: business_referential
    check: "Ticket-backed endpoint: POST /order-slips/{id}/prepare requires a KitchenTicket row for the slip (a slip whose ticket was never created has no fire schedule)"
    error_id: ERR_KITCHEN_TICKET_NOT_FOUND
    http_status: 404
    applies_to: "POST /order-slips/{id}/prepare"

  # --- 17. Business constraint — the hoisted capacity band -------------------
  - priority: 17
    category: business_constraint
    check: "Kitchen capacity band: after the seating window and entree deadline, the dining order capacity snapshot bands the load; LATE requires a caller acknowledgement and BLOCKED always rejects"
    error_id: ERR_KITCHEN_CAPACITY_BAND
    http_status: 409
    applies_to: "POST /order-slips"

  # --- 18. Business fiscal (LAST) -------------------------------------------
  - priority: 18
    category: business_fiscal
    check: "Ejection refund liability: an ejection refund must leave original_cents - refunded_cents equal to zero and must not exceed the original tab"
    error_id: ERR_REFUND_EXCEEDS_ORIGINAL
    http_status: 422
    applies_to: "POST /disturbance-events/{id}/approve-ejection, POST /checks/{id}/close"

  # --- 19. Business constraint — occupancy -----------------------------------
  - priority: 19
    category: business_constraint
    check: "Occupancy conflict: a server may not hold two non-terminal SectionAssignments for the same seat-range run with the same section_label on the same auditorium"
    error_id: ERR_SECTION_OCCUPIED
    http_status: 409
    applies_to: "POST /section-assignments"

# =============================================================================
# Response Envelope  (§1.0 — fixed)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5 — API Endpoint Table  (§1.5)
# =============================================================================
endpoints:

  # --- Auditorium -----------------------------------------------------------
  - method: POST
    path: "/auditoriums"
    description: "Create an auditorium (theatre room) with its kitchen and alcove service rates"
    roles: [PlatformAdmin]
    code: 201
    input: [name, seat_capacity, "screen_lead_time_minutes?", "kitchen_point_rate?", "alcove_point_rate?"]
    output: Auditorium
    side_effects: ["status initialized to DARK; service_posture initialized to DARK; build_phase initialized to EMPTY; version initialized to 1"]

  - method: GET
    path: "/auditoriums"
    description: "List auditoriums"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["limit?", "offset?"]
    output: "Auditorium[]"
    side_effects: []

  - method: GET
    path: "/auditoriums/{id}"
    description: "Get one auditorium"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: []
    output: Auditorium
    side_effects: ["recomputes status / service_posture / build_phase on read when the stored value disagrees with the projection"]

  - method: GET
    path: "/auditoriums/{id}/posture"
    description: "Read the auditorium's derived posture axes and the band that currently binds its dining orders"
    roles: [PlatformAdmin, KitchenLead, Server]
    code: 200
    input: []
    output: "{ status: string, service_posture: string, build_phase: string, last_showtime_cluster_start_utc: datetime, next_scheduled_showtime_dining_open_at_utc: datetime, binding_band: string, active_ejection_stage: string }"
    side_effects: ["self-heals a stale stored posture from the member showtimes and the logical clock"]

  - method: POST
    path: "/auditoriums/{id}/activate"
    description: "Return an auditorium to service; requires it to have no scheduled showtime overlap"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Auditorium
    side_effects: ["status → TURNOVER when a SCHEDULED showtime exists; RECOMPUTES build_phase", "increments Auditorium.version by 1"]

  - method: POST
    path: "/auditoriums/{id}/close"
    description: "Take an auditorium out of service"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Auditorium
    side_effects: ["status → DARK", "increments Auditorium.version by 1"]

  - method: GET
    path: "/auditoriums/{id}/refund-liability"
    description: "Refund liability booked for ejections at the auditorium's last cluster instant, in both reporting variants"
    roles: [PlatformAdmin, KitchenLead]
    code: 200
    input: []
    output: "{ fair_liability_cents: integer, shock_liability_cents: integer, ejection_count: integer, cluster_instant_utc: datetime }"
    side_effects: []

  - method: GET
    path: "/auditoriums/{id}/showtimes"
    description: "List the showtimes belonging to an auditorium"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Showtime[]"
    side_effects: []

  - method: GET
    path: "/auditoriums/{id}/programming-events"
    description: "List the programming events belonging to an auditorium"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ProgrammingEvent[]"
    side_effects: []

  # --- Showtime ------------------------------------------------------------
  - method: POST
    path: "/showtimes"
    description: "Schedule a showtime on an auditorium"
    roles: [PlatformAdmin, ProgrammingCoordinator]
    code: 201
    input: [auditorium_id, title, start_at_utc, runtime_minutes, "content_type?"]
    output: Showtime
    side_effects: ["derives dining_open_at_utc, entree_ready_deadline_utc, dining_close_at_utc, pre_show_minutes, service_mode; status → SCHEDULED; mode → DINING_CLOSED", "re-derives Auditorium.status and Auditorium.build_phase and increments Auditorium.version by 1"]

  - method: GET
    path: "/showtimes"
    description: "List showtimes, optionally filtered by auditorium"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["auditorium_id?", "status?", "limit?", "offset?"]
    output: "Showtime[]"
    side_effects: []

  - method: GET
    path: "/showtimes/{id}"
    description: "Get one showtime including its derived window instants"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: []
    output: Showtime
    side_effects: ["recomputes service_mode from the logical clock on read"]

  - method: GET
    path: "/showtimes/{id}/dining-capacity"
    description: "The dining order capacity snapshot: which band binds, the entree and beverage loads, and the latest acceptable acceptance instants"
    roles: [PlatformAdmin, KitchenLead, Server]
    code: 200
    input: []
    output: "{ capacity_band: string, entree_load_points: integer, entree_latest_accept_at_utc: datetime, beverage_load_points: integer, beverage_latest_accept_at_utc: datetime, entry_stage: integer, load_pct: integer, projection_variant: string }"
    side_effects: []

  - method: GET
    path: "/showtimes/{id}/section-assignments"
    description: "List the server sections of a showtime"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SectionAssignment[]"
    side_effects: []

  - method: GET
    path: "/showtimes/{id}/kitchen-tickets"
    description: "List the kitchen tickets of a showtime in fire order"
    roles: [PlatformAdmin, KitchenLead, Server]
    code: 200
    input: ["station?", "status?", "limit?", "offset?"]
    output: "KitchenTicket[]"
    side_effects: []

  - method: GET
    path: "/showtimes/{id}/order-slips"
    description: "List the seat-side order slips of a showtime"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "OrderSlip[]"
    side_effects: []

  - method: POST
    path: "/showtimes/{id}/open-dining"
    description: "Open seat-side dining for a showtime"
    roles: [KitchenLead]
    code: 200
    input: []
    output: Showtime
    side_effects: ["status → DINING_OPEN; mode → DINING_OPEN", "re-derives Auditorium.status (TURNOVER → LIVE) and increments Auditorium.version by 1 when the status changed", "recomputes ProgrammingEvent.pre_show_content_status gate consumption"]

  - method: POST
    path: "/showtimes/{id}/start-service"
    description: "Move a showtime from dining into kitchen service; creates the kitchen tickets and the fire sequence"
    roles: [KitchenLead]
    code: 200
    input: []
    output: Showtime
    side_effects: ["status → SERVICE", "creates a KitchenTicket for every ACCEPTED order slip (cold_line for ENTREE, hot_line for BEVERAGE)", "computes ticket_sequence_position and fire_at_utc per station", "sets id_check_status → PENDING on every alcoholic BEVERAGE slip"]

  - method: POST
    path: "/showtimes/{id}/start-feature"
    description: "Cut over to the feature at its exact start instant; voids unverified alcohol and records late deliveries"
    roles: [KitchenLead, PlatformAdmin]
    code: 200
    input: []
    output: Showtime
    side_effects: ["status → SERVICE when now == start_at_utc; status → RUNNING when now > start_at_utc", "voids every BEVERAGE slip still PENDING on id verification and sets its OrderSlip → VOIDED", "records service compensation for slips past entree_ready_deadline_utc", "re-sequences the cold_line fire cohort"]

  - method: POST
    path: "/showtimes/{id}/complete"
    description: "Complete a showtime and close its sections"
    roles: [KitchenLead]
    code: 200
    input: []
    output: Showtime
    side_effects: ["status → COMPLETED; mode → DINING_CLOSED", "every ACTIVE or REASSIGNMENT_PENDING SectionAssignment → COMPLETED with assignment_points computed", "Server.lifetime_points incremented and Server.status recomputed", "re-derives Auditorium.status"]

  - method: POST
    path: "/showtimes/{id}/reopen-service"
    description: "Reopen a completed showtime for late service while its feature is still running"
    roles: [KitchenLead]
    code: 200
    input: []
    output: Showtime
    side_effects: ["status → SERVICE; mode → DINING_OPEN", "auto-completed SectionAssignments revert to ACTIVE and their points are removed from Server.lifetime_points"]

  - method: POST
    path: "/showtimes/{id}/cancel"
    description: "Cancel a showtime and cascade cancellation to its orders, sections, and tabs"
    roles: [ProgrammingCoordinator]
    code: 200
    input: []
    output: Showtime
    side_effects: ["status → CANCELLED; mode → DINING_CLOSED", "every non-terminal OrderSlip → CANCELLED and every non-terminal KitchenTicket → VOIDED", "every non-terminal SectionAssignment → CANCELLED and Server status recomputed", "OPEN CheckTabs → REFUNDED with reason_code SERVICE_COMP_FAILURE", "re-derives Auditorium.status"]

  # --- ProgrammingEvent ----------------------------------------------------
  - method: POST
    path: "/programming-events"
    description: "Create a special programming event with a themed menu"
    roles: [ProgrammingCoordinator]
    code: 201
    input: [auditorium_id, theme_name, "requires_themed_menu?"]
    output: ProgrammingEvent
    side_effects: ["status → DRAFT; pre_show_content_status → PRE_SHOW_DRAFT; pre_show_content_version → 1; themed_menu_count → 0"]

  - method: GET
    path: "/programming-events"
    description: "List programming events"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["auditorium_id?", "status?", "limit?", "offset?"]
    output: "ProgrammingEvent[]"
    side_effects: []

  - method: GET
    path: "/programming-events/{id}"
    description: "Get one programming event"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: []
    output: ProgrammingEvent
    side_effects: []

  - method: POST
    path: "/programming-events/{id}/pre-show-content/submit"
    description: "Submit pre-show content for review, or resubmit after a rejection or an approved re-cut"
    roles: [ProgrammingCoordinator, PreShowProducer]
    code: 200
    input: []
    output: ProgrammingEvent
    side_effects: ["pre_show_content_status → PRE_SHOW_IN_REVIEW", "increments pre_show_content_version by 1 when the content was already past PRE_SHOW_DRAFT"]

  - method: POST
    path: "/programming-events/{id}/pre-show-content/approve"
    description: "Approve the pre-show content cut"
    roles: [PreShowProducer]
    code: 200
    input: []
    output: ProgrammingEvent
    side_effects: ["pre_show_content_status → PRE_SHOW_APPROVED", "increments ProgrammingEvent.version by 1"]

  - method: POST
    path: "/programming-events/{id}/pre-show-content/reject"
    description: "Reject the pre-show content cut, sending it back for revision"
    roles: [PreShowProducer]
    code: 200
    input: ["notes?"]
    output: ProgrammingEvent
    side_effects: ["pre_show_content_status → PRE_SHOW_REJECTED", "increments ProgrammingEvent.version by 1"]

  - method: POST
    path: "/programming-events/{id}/activate"
    description: "Activate a programming event so its linked special showtimes may open dining"
    roles: [ProgrammingCoordinator]
    code: 200
    input: [expected_programming_event_version]
    output: ProgrammingEvent
    side_effects: ["status → ACTIVATED; enables themed pricing on the linked special showtimes", "increments ProgrammingEvent.version by 1"]

  - method: POST
    path: "/programming-events/{id}/cancel"
    description: "Cancel a programming event and its still-scheduled showtimes"
    roles: [ProgrammingCoordinator]
    code: 200
    input: []
    output: ProgrammingEvent
    side_effects: ["status → CANCELLED", "every linked SCHEDULED showtime → CANCELLED", "increments ProgrammingEvent.version by 1"]

  # --- ThemedMenuItem ------------------------------------------------------
  - method: POST
    path: "/programming-events/{id}/themed-menu-items"
    description: "Attach a menu item to a programming event's themed menu at a theme price"
    roles: [ProgrammingCoordinator, PreShowProducer]
    code: 201
    input: [menu_item_id, theme_price_cents, "is_signature?"]
    output: ThemedMenuItem
    side_effects: ["increments ProgrammingEvent.themed_menu_count by 1"]

  - method: GET
    path: "/programming-events/{id}/themed-menu-items"
    description: "List the themed menu items of a programming event"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["limit?", "offset?"]
    output: "ThemedMenuItem[]"
    side_effects: []

  - method: GET
    path: "/themed-menu-items"
    description: "List themed menu items, optionally filtered by programming event or menu item"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["programming_event_id?", "menu_item_id?", "limit?", "offset?"]
    output: "ThemedMenuItem[]"
    side_effects: []

  - method: GET
    path: "/themed-menu-items/{id}"
    description: "Get one themed menu item"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: []
    output: ThemedMenuItem
    side_effects: []

  # --- MenuItem ------------------------------------------------------------
  - method: POST
    path: "/menu-items"
    description: "Add an item to the master menu catalog"
    roles: [PlatformAdmin]
    code: 201
    input: [catalog_name, channel, price_cents, "prep_minutes?", "is_alcoholic?"]
    output: MenuItem
    side_effects: ["availability_state → AVAILABLE"]

  - method: GET
    path: "/menu-items"
    description: "List menu items"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["channel?", "limit?", "offset?"]
    output: "MenuItem[]"
    side_effects: []

  - method: GET
    path: "/menu-items/{id}"
    description: "Get one menu item"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: []
    output: MenuItem
    side_effects: []

  - method: POST
    path: "/menu-items/{id}/stock"
    description: "Set a menu item's kitchen availability"
    roles: [PlatformAdmin]
    code: 200
    input: [availability_state]
    output: MenuItem
    side_effects: ["availability_state → AVAILABLE or OUT_OF_STOCK"]

  # --- Server --------------------------------------------------------------
  - method: POST
    path: "/servers"
    description: "Create a server profile"
    roles: [PlatformAdmin, KitchenLead]
    code: 201
    input: [display_name, home_auditorium_id]
    output: Server
    side_effects: ["status → ACTIVE; in_rotation → true; lifetime_points → 0; ratings → []"]

  - method: GET
    path: "/servers"
    description: "List servers, optionally filtered by home auditorium"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["home_auditorium_id?", "status?", "limit?", "offset?"]
    output: "Server[]"
    side_effects: []

  - method: GET
    path: "/servers/{id}"
    description: "Get one server profile"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: []
    output: Server
    side_effects: []

  - method: POST
    path: "/servers/{id}/shift/start"
    description: "Start a server's shift for the current service day"
    roles: [KitchenLead]
    code: 200
    input: []
    output: Server
    side_effects: ["evaluates the daily section cap using server_shift_load.projected_load"]

  - method: POST
    path: "/servers/{id}/shift/end"
    description: "End a server's shift and freeze the day's covered-section count"
    roles: [KitchenLead]
    code: 200
    input: []
    output: Server
    side_effects: ["recomputes server_shift_load.final_load and server_quality_index"]

  - method: POST
    path: "/servers/{id}/rate"
    description: "Record a rating for one of this server's assignments"
    roles: [KitchenLead]
    code: 200
    input: [assignment_id, rating_grade]
    output: Server
    side_effects: ["appends to Server.ratings", "recomputes server_quality_index"]

  - method: POST
    path: "/servers/{id}/clear-penalty"
    description: "Clear a server's penalty lockout and return them to rotation"
    roles: [PlatformAdmin, KitchenLead]
    code: 200
    input: []
    output: Server
    side_effects: ["status → ACTIVE; in_rotation → true"]

  - method: GET
    path: "/servers/{id}/section-assignments"
    description: "List a server's section assignments"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SectionAssignment[]"
    side_effects: []

  # --- SectionAssignment ---------------------------------------------------
  - method: POST
    path: "/section-assignments"
    description: "Assign a server to a section of a showtime"
    roles: [KitchenLead]
    code: 201
    input: [showtime_id, server_id, section_label]
    output: SectionAssignment
    side_effects: ["status → ACTIVE; assignment_points → 0", "validates auditorium membership, server section overlap, aggregate hard cap, and occupancy"]

  - method: GET
    path: "/section-assignments"
    description: "List section assignments, optionally filtered by showtime, server, or auditorium"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["showtime_id?", "server_id?", "auditorium_id?", "status?", "limit?", "offset?"]
    output: "SectionAssignment[]"
    side_effects: []

  - method: GET
    path: "/section-assignments/{id}"
    description: "Get one section assignment"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: []
    output: SectionAssignment
    side_effects: []

  - method: PATCH
    path: "/section-assignments/{id}"
    description: "Reassign the server on a section assignment"
    roles: [KitchenLead]
    code: 200
    input: [server_id, expected_section_assignment_version]
    output: SectionAssignment
    side_effects: ["increments SectionAssignment.version by 1", "revalidates server overlap and hard cap against the incoming server"]

  - method: POST
    path: "/section-assignments/{id}/score"
    description: "Record a close-out rating grade on a section assignment"
    roles: [KitchenLead]
    code: 200
    input: [rating_grade]
    output: SectionAssignment
    side_effects: ["recomputes server_quality_index for the owning server"]

  - method: POST
    path: "/section-assignments/{id}/close"
    description: "Close a section assignment and score its points"
    roles: [KitchenLead]
    code: 200
    input: []
    output: SectionAssignment
    side_effects: ["status → COMPLETED", "computes assignment_points; increments Server.lifetime_points; recomputes Server.status and Server.in_rotation"]

  - method: POST
    path: "/section-assignments/{id}/cancel"
    description: "Cancel a section assignment before or during service"
    roles: [KitchenLead]
    code: 200
    input: []
    output: SectionAssignment
    side_effects: ["status → CANCELLED", "computes assignment_points with the cancel multiplier; applies the a-priori revert described in §1.2"]

  # --- OrderSlip -----------------------------------------------------------
  - method: POST
    path: "/order-slips"
    description: "Place a seat-side order slip for a guest seat"
    roles: [Server]
    code: 201
    input: [showtime_id, section_assignment_id, seat_number, lines, expected_showtime_version, "capacity_ack?"]
    output: OrderSlip
    side_effects: ["status → PLACED then ACCEPTED in the same request", "resolves lines, computes subtotal_cents (per-line rounding) and channel", "sets id_check_status → PENDING when any line is alcoholic", "invalidates entitlements on consumption", "increments Showtime.version by 1"]

  - method: GET
    path: "/order-slips"
    description: "List order slips, optionally filtered by showtime or section assignment"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: ["showtime_id?", "section_assignment_id?", "status?", "limit?", "offset?"]
    output: "OrderSlip[]"
    side_effects: []

  - method: GET
    path: "/order-slips/{id}"
    description: "Get one order slip with its resolved lines"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: []
    output: OrderSlip
    side_effects: []

  - method: POST
    path: "/order-slips/{id}/prepare"
    description: "Send the slip's ticket into the kitchen"
    roles: [Server]
    code: 200
    input: []
    output: OrderSlip
    side_effects: ["status → PREPARING; stamps in_kitchen_at_utc", "KitchenTicket → PREPARING and the cold_line cohort fire instants are re-derived"]

  - method: POST
    path: "/order-slips/{id}/mark-ready"
    description: "Mark a slip's ticket as plated and ready for the runner"
    roles: [Server]
    code: 200
    input: []
    output: OrderSlip
    side_effects: ["status → READY; KitchenTicket → READY"]

  - method: POST
    path: "/order-slips/{id}/deliver"
    description: "Deliver a ready slip to its seat"
    roles: [Server]
    code: 200
    input: []
    output: OrderSlip
    side_effects: ["status → DELIVERED; stamps delivered_at_utc; KitchenTicket → DELIVERED", "late deliveries past entree_ready_deadline_utc book a service compensation refund"]

  - method: POST
    path: "/order-slips/{id}/cancel"
    description: "Cancel an order slip before it reaches the kitchen"
    roles: [KitchenLead]
    code: 200
    input: ["reason_code?"]
    output: OrderSlip
    side_effects: ["status → CANCELLED", "kitchen_load_rollup recomputed and the slip's points removed from the load"]

  # --- KitchenTicket -------------------------------------------------------
  - method: GET
    path: "/kitchen-tickets"
    description: "List kitchen tickets, optionally filtered by showtime, slip, station, or status"
    roles: [PlatformAdmin, KitchenLead, Server]
    code: 200
    input: ["showtime_id?", "order_slip_id?", "station?", "status?", "limit?", "offset?"]
    output: "KitchenTicket[]"
    side_effects: []

  - method: GET
    path: "/kitchen-tickets/{id}"
    description: "Get one kitchen ticket"
    roles: [PlatformAdmin, KitchenLead, Server]
    code: 200
    input: []
    output: KitchenTicket
    side_effects: []

  - method: POST
    path: "/kitchen-tickets/{id}/ack-overflow"
    description: "Acknowledge that a ticket will be delivered past the entree deadline and record the reason"
    roles: [KitchenLead]
    code: 200
    input: [overflow_reason]
    output: KitchenTicket
    side_effects: ["recomputes kitchen_load_projection (base variant) and the ticket's projected_delivery_at_utc"]

  - method: POST
    path: "/kitchen-tickets/{id}/verify-id"
    description: "Record the result of an identification check for an alcoholic beverage ticket"
    roles: [Server]
    code: 200
    input: [id_result]
    output: KitchenTicket
    side_effects: ["OrderSlip.id_check_status → VERIFIED on a pass; → REFUSED and the slip released without charge on a fail"]

  - method: POST
    path: "/kitchen-tickets/{id}/refresh"
    description: "Re-derive a ticket's sequence position and fire instant from the current cohort state"
    roles: [KitchenLead]
    code: 200
    input: []
    output: KitchenTicket
    side_effects: ["recomputes ticket_sequence_position for the showtime's cold_line cohort", "re-derives fire_at_utc and projected_delivery_at_utc so sum(ceil(point_cost / kitchen_point_rate)) == last_fire_at_utc - ENTRÉE_FIRE_AT holds"]

  - method: POST
    path: "/kitchen-tickets/{id}/void"
    description: "Void a kitchen ticket and re-derive the fire sequence"
    roles: [KitchenLead]
    code: 200
    input: ["reason_code?"]
    output: KitchenTicket
    side_effects: ["KitchenTicket → VOIDED", "recomputes ticket_sequence_position and the fire cohort so the invariant sum(ceil(point_cost / rate)) == last_fire_at_utc - ENTRÉE_FIRE_AT holds"]

  # --- CheckTab ------------------------------------------------------------
  - method: GET
    path: "/checks"
    description: "List open and settled checks, optionally filtered by slip"
    roles: [PlatformAdmin, KitchenLead, Server]
    code: 200
    input: ["order_slip_id?", "status?", "limit?", "offset?"]
    output: "CheckTab[]"
    side_effects: []

  - method: GET
    path: "/checks/{id}"
    description: "Get one check"
    roles: [PlatformAdmin, KitchenLead, Server]
    code: 200
    input: []
    output: CheckTab
    side_effects: []

  - method: POST
    path: "/checks/{id}/close"
    description: "Settle a check for the untouched balance"
    roles: [Server, KitchenLead]
    code: 200
    input: [expected_order_slip_version]
    output: CheckTab
    side_effects: ["status → SETTLED", "refunded_cents preserved; the settled total equals original_cents - refunded_cents", "increments OrderSlip.version by 1"]

  - method: POST
    path: "/checks/{id}/refund"
    description: "Approve a partial or full refund against a check"
    roles: [KitchenLead]
    code: 200
    input: [refund_cents]
    output: CheckTab
    side_effects: ["refunded_cents += refund_cents", "status → REFUNDED or PARTIALLY_REFUNDED", "rejects any refund that would push refunded_cents above original_cents"]

  # --- DisturbanceEvent ----------------------------------------------------
  - method: POST
    path: "/disturbance-events"
    description: "Record a no-talking or no-texting disturbance observed at a seat"
    roles: [Server]
    code: 201
    input: [order_slip_id, kind]
    output: DisturbanceEvent
    side_effects: ["stage → WARNING; stage_version → 1", "recomputes the occupant's strike ladder"]

  - method: GET
    path: "/disturbance-events"
    description: "List disturbance events, optionally filtered by slip"
    roles: [PlatformAdmin, KitchenLead, Server]
    code: 200
    input: ["order_slip_id?", "kind?", "limit?", "offset?"]
    output: "DisturbanceEvent[]"
    side_effects: []

  - method: GET
    path: "/disturbance-events/{id}"
    description: "Get one disturbance event"
    roles: [PlatformAdmin, KitchenLead, Server]
    code: 200
    input: []
    output: DisturbanceEvent
    side_effects: []

  - method: POST
    path: "/disturbance-events/{id}/amend"
    description: "Amend a disturbance report's stage upward"
    roles: [Server, KitchenLead]
    code: 200
    input: [stage, "prior_stage?"]
    output: DisturbanceEvent
    side_effects: ["stage → the requested stage; increments stage_version by 1", "recomputes the occupant's strike ladder and any linked section assignment penalty"]

  - method: POST
    path: "/disturbance-events/{id}/approve-ejection"
    description: "Approve the ejection of a guest and issue the compensating refund"
    roles: [KitchenLead]
    code: 200
    input: []
    output: DisturbanceEvent
    side_effects: ["the disturbance stage → EJECTION and its stage_version increments by 1", "the ejected seat's slip leaves the kitchen queue and stops consuming capacity", "issues the compensating refund leaving original_cents - refunded_cents == 0 on the slip's check", "escalates the owning server's penalty chain"]

  # --- Test-driving --------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at the fixed default 2026-09-01T00:00:00Z before the first call and never follows real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["recomputes service_mode on every showtime, re-derives every auditorium posture, and expires any frozen disturbance stage whose window no longer reaches it"]

  - method: GET
    path: "/_clock/current_utc"
    description: "Read the server's logical clock"
    roles: [PlatformAdmin, KitchenLead, ProgrammingCoordinator, PreShowProducer, Server]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

# =============================================================================
# Table 6 — Error Code Catalog  (§1.6)
# =============================================================================
errors:

  # --- Auth & existence -----------------------------------------------------
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing, or X-User-Role is not a declared role"

  - id: ERR_AUDITORIUM_NOT_FOUND
    http: 404
    condition: "No auditorium exists for the given id"

  - id: ERR_SHOWTIME_NOT_FOUND
    http: 404
    condition: "No showtime exists for the given id"

  - id: ERR_MENU_ITEM_NOT_FOUND
    http: 404
    condition: "No menu item exists for the given id"

  - id: ERR_PROGRAMMING_EVENT_NOT_FOUND
    http: 404
    condition: "No programming event exists for the given id"

  - id: ERR_THEMED_MENU_ITEM_NOT_FOUND
    http: 404
    condition: "No themed menu item exists for the given id"

  - id: ERR_SERVER_NOT_FOUND
    http: 404
    condition: "No server exists for the given id"

  - id: ERR_SECTION_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No section assignment exists for the given id"

  - id: ERR_SHOWTIME_FOR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "The showtime named by a section assignment request does not exist on the referenced auditorium"

  - id: ERR_LOCAL_SHIFTABLE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "The section assignment named by an order slip does not exist"

  - id: ERR_LOCAL_SECTION_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "The section assignment named by an order slip belongs to a different showtime than the slip's showtime"

  - id: ERR_ORDER_SLIP_NOT_FOUND
    http: 404
    condition: "No order slip exists for the given id"

  - id: ERR_CHECK_NOT_FOUND
    http: 404
    condition: "No check exists for the given id"

  - id: ERR_DISTURBANCE_EVENT_NOT_FOUND
    http: 404
    condition: "No disturbance event exists for the given id"

  - id: ERR_KITCHEN_TICKET_NOT_FOUND
    http: 404
    condition: "No kitchen ticket exists for the given id, or the slip referenced by a prepare call has no ticket yet"

  # --- State ----------------------------------------------------------------
  - id: ERR_AUDITORIUM_NOT_ACTIVE
    http: 409
    condition: "The operation requires the auditorium to be in a serving state"

  - id: ERR_AUDITORIUM_NOT_DARK
    http: 409
    condition: "The operation requires the auditorium to be DARK"

  - id: ERR_AUDITORIUM_NOT_SERVING
    http: 409
    condition: "The operation requires the parent auditorium to be LIVE or TURNOVER"

  - id: ERR_SHOWTIME_NOT_SCHEDULED
    http: 409
    condition: "The operation requires the showtime to be SCHEDULED"

  - id: ERR_SHOWTIME_NOT_DINING_OPEN
    http: 409
    condition: "The operation requires the showtime to be DINING_OPEN"

  - id: ERR_SHOWTIME_NOT_IN_SERVICE
    http: 409
    condition: "The operation requires the showtime to be SERVICE"

  - id: ERR_SHOWTIME_NOT_RUNNING
    http: 409
    condition: "The operation requires the showtime to be RUNNING"

  - id: ERR_SHOWTIME_NOT_COMPLETED
    http: 409
    condition: "The operation requires the showtime to be COMPLETED"

  - id: ERR_PROGRAMMING_EVENT_NOT_DRAFT
    http: 409
    condition: "The operation requires the programming event to be DRAFT"

  - id: ERR_PROGRAMMING_EVENT_NOT_CANCELLABLE
    http: 409
    condition: "The operation requires the programming event to be DRAFT or ACTIVATED"

  - id: ERR_PRE_SHOW_NOT_IN_REVIEW
    http: 409
    condition: "The operation requires the pre-show content to be PRE_SHOW_IN_REVIEW"

  - id: ERR_PRE_SHOW_NOT_RESUBMITTABLE
    http: 409
    condition: "The pre-show content is not in a state from which it may be submitted for review"

  - id: ERR_ORDER_SLIP_NOT_ACCEPTED
    http: 409
    condition: "The operation requires the order slip to be ACCEPTED"

  - id: ERR_ORDER_SLIP_NOT_PREPARING
    http: 409
    condition: "The operation requires the order slip to be PREPARING"

  - id: ERR_ORDER_SLIP_NOT_READY
    http: 409
    condition: "The operation requires the order slip to be READY"

  - id: ERR_ORDER_SLIP_NOT_CANCELLABLE
    http: 409
    condition: "The operation requires the order slip to be non-terminal"

  - id: ERR_CHECK_NOT_OPEN
    http: 409
    condition: "The operation requires the check to be unsettled"

  - id: ERR_DISTURBANCE_NOT_AMENDABLE
    http: 409
    condition: "The disturbance event is already at the requested or a higher stage"

  - id: ERR_SERVER_NOT_PENALIZED
    http: 409
    condition: "The server is not currently in a penalty lockout"

  - id: ERR_SECTION_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "The operation requires the section assignment to be ACTIVE"

  # --- OCC ------------------------------------------------------------------
  - id: ERR_STALE_SHOWTIME_VERSION
    http: 412
    condition: "expected_showtime_version does not match the showtime's current version"

  - id: ERR_STALE_SECTION_ASSIGNMENT_VERSION
    http: 412
    condition: "expected_section_assignment_version does not match the section assignment's current version"

  - id: ERR_STALE_PROGRAMMING_EVENT_VERSION
    http: 412
    condition: "expected_programming_event_version does not match the programming event's current version"

  - id: ERR_STALE_ORDER_SLIP_VERSION
    http: 412
    condition: "expected_order_slip_version does not match the order slip's current version"

  # --- Business -------------------------------------------------------------
  - id: ERR_ID_CHECK_REQUIRED
    http: 403
    condition: "An alcoholic beverage slip cannot be delivered, or survive the feature-start boundary, without a completed identification check"

  - id: ERR_SILENT_ORDER_VIOLATION
    http: 409
    condition: "An order was placed against a showtime whose mode is DINING_CLOSED"

  - id: ERR_EJECTED_OCCUPANT_NOT_ON_SLIP
    http: 400
    condition: "The occupant named for ejection is not present on the disturbance event's slip"

  - id: ERR_DINING_WINDOW_CLOSED
    http: 409
    condition: "now is outside the ordered dining_open_at_utc .. dining_close_at_utc window"

  - id: ERR_DINING_WINDOW_NOT_OPEN
    http: 409
    condition: "now is before the showtime's dining_open_at_utc, so the seating window has not opened"

  - id: ERR_ENTREE_DEADLINE_PASSED
    http: 409
    condition: "An entree is ordered, prepared, or delivered after entree_ready_deadline_utc without a service compensation path"

  - id: ERR_ENTREE_OVERFLOW_ACK_REQUIRED
    http: 409
    condition: "An entree whose projected delivery lands past the deadline was sent to the kitchen without an overflow acknowledgement"

  - id: ERR_FIRE_WINDOW_NOT_OPEN
    http: 409
    condition: "A cold-line ticket cannot start preparing before its fire_at_utc"

  - id: ERR_TICKET_NOT_READY
    http: 409
    condition: "The ticket's projected_delivery_at_utc has not been reached"

  - id: ERR_DARK_PERIOD_FULFILMENT_BLOCKED
    http: 409
    condition: "Kitchen fulfilment was attempted while the showtime's service_mode is DARK_PERIOD"

  - id: ERR_SERVER_SECTION_OVERLAP
    http: 409
    condition: "The server already holds an ACTIVE section assignment whose service interval strictly overlaps the requested one"

  - id: ERR_SERVER_HARD_CAP_EXCEEDED
    http: 409
    condition: "Granting the assignment would leave more than SERVER_HARD_CAP sections overlapping the same instant"

  - id: ERR_OVERLAPPING_SHOWTIME_WINDOW
    http: 409
    condition: "Another showtime on the same auditorium has a dining window overlapping the requested one"

  - id: ERR_THEMED_MENU_REQUIRED
    http: 409
    condition: "A special-event showtime requires a themed menu that has not been attached"

  - id: ERR_PRE_SHOW_NOT_APPROVED
    http: 409
    condition: "Pre-show content has not been approved for a special-event showtime"

  - id: ERR_OPEN_KITCHEN_TICKETS
    http: 409
    condition: "The showtime still has kitchen tickets that are neither DELIVERED nor VOIDED"

  - id: ERR_NOT_ASSIGNED_SERVER
    http: 403
    condition: "The acting server is not the server assigned to the slip's section"

  - id: ERR_SECTION_UNCOVERED
    http: 409
    condition: "A section on the showtime has been served without a recorded delivery or an explicit alcohol refusal"

  - id: ERR_MENU_ITEM_UNAVAILABLE
    http: 409
    condition: "A line references a menu item whose availability_state is OUT_OF_STOCK"

  - id: ERR_FEATURE_START_BOUNDARY
    http: 409
    condition: "The feature start transition was requested before the showtime's exact start_at_utc"

  - id: ERR_REOPEN_WINDOW_CLOSED
    http: 409
    condition: "The feature has already finished, so the showtime cannot be reopened"

  - id: ERR_NO_LINKED_SHOWTIME
    http: 404
    condition: "A programming event has no linked special-event showtime"

  - id: ERR_SIGNATURE_ITEM_REQUIRED
    http: 409
    condition: "Pre-show content approval requires at least one signature themed menu item"

  - id: ERR_SHOWTIME_IN_PROGRESS
    http: 409
    condition: "The programming event has a showtime currently RUNNING and cannot be cancelled"

  - id: ERR_KITCHEN_CAPACITY_BAND
    http: 409
    condition: "The dining order capacity band evaluated to LATE without a caller acknowledgement, or to BLOCKED"

  - id: ERR_SECTION_OCCUPIED
    http: 409
    condition: "The server already holds a non-terminal assignment for the same auditorium and section label"

  - id: ERR_REFUND_EXCEEDS_ORIGINAL
    http: 422
    condition: "The requested refund would push refunded_cents above original_cents, breaking the zero-balance invariant"

  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "X-User-Role is a declared role but does not appear on the endpoint's permitted roles"

  - id: ERR_INVALID_SHOWTIME_RUNTIME
    http: 400
    condition: "runtime_minutes is below the declared floor of 1, so no window instants can be derived"

  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "A transition was requested on a resource already in one of its terminal states"

# =============================================================================
# Table 7 — RBAC Permission Matrix  (§1.7)
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Theatre platform operator: owns room setup, the master menu, the logical clock, and venue-level override powers"
    identity: "opaque"
    exclusive_operations:
      - "POST /auditoriums — Create auditorium"
      - "POST /auditoriums/{id}/activate — Activate auditorium"
      - "POST /auditoriums/{id}/close — Close auditorium"
      - "POST /menu-items — Create menu item"
      - "POST /_clock/set_current_utc — Set the logical clock"
    shared_operations:
      - "GET /auditoriums, GET /auditoriums/{id}, GET /auditoriums/{id}/posture, GET /auditoriums/{id}/showtimes, GET /auditoriums/{id}/programming-events"
      - "GET /showtimes, GET /showtimes/{id}, GET /showtimes/{id}/section-assignments, GET /showtimes/{id}/kitchen-tickets, GET /showtimes/{id}/order-slips, GET /showtimes/{id}/dining-capacity"
      - "GET /menu-items, GET /menu-items/{id}, GET /themed-menu-items, GET /themed-menu-items/{id}, GET /programming-events, GET /programming-events/{id}, GET /programming-events/{id}/themed-menu-items"
      - "GET /servers, GET /servers/{id}, GET /servers/{id}/section-assignments, GET /section-assignments, GET /section-assignments/{id}, GET /order-slips, GET /order-slips/{id}, GET /kitchen-tickets, GET /kitchen-tickets/{id}, GET /checks, GET /checks/{id}, GET /disturbance-events, GET /disturbance-events/{id}, GET /_clock/current_utc"
      - "POST /servers/{id}/clear-penalty — Clear server penalty"
      - "POST /showtimes/{id}/start-feature — Cut over to the feature"

  - name: KitchenLead
    description: "Kitchen and floor lead: runs the showtime service lifecycle, the kitchen fire sequence, section rostering, and refund approval"
    identity: "opaque"
    exclusive_operations:
      - "POST /showtimes/{id}/open-dining — Open dining"
      - "POST /showtimes/{id}/start-service — Start kitchen service"
      - "POST /showtimes/{id}/complete — Complete showtime"
      - "POST /showtimes/{id}/reopen-service — Reopen service"
      - "POST /servers — Create server profile"
      - "POST /servers/{id}/shift/start — Start shift"
      - "POST /servers/{id}/shift/end — End shift"
      - "POST /servers/{id}/rate — Record a rating"
      - "POST /section-assignments — Assign a section"
      - "PATCH /section-assignments/{id} — Reassign a section"
      - "POST /section-assignments/{id}/score — Score an assignment"
      - "POST /section-assignments/{id}/close — Close an assignment"
      - "POST /section-assignments/{id}/cancel — Cancel an assignment"
      - "POST /order-slips/{id}/cancel — Cancel an order slip"
      - "POST /kitchen-tickets/{id}/ack-overflow — Acknowledge an overflow"
      - "POST /kitchen-tickets/{id}/void — Void a ticket"
      - "POST /checks/{id}/refund — Approve a refund"
      - "POST /disturbance-events/{id}/approve-ejection — Approve an ejection"
    shared_operations:
      - "GET /showtimes/{id}/dining-capacity, GET /showtimes/{id}/kitchen-tickets, GET /checks, GET /checks/{id}"
      - "POST /checks/{id}/close — Settle a check"
      - "POST /disturbance-events/{id}/amend — Amend a disturbance report"
      - "POST /showtimes/{id}/start-feature — Cut over to the feature"

  - name: Server
    description: "Floor server: owns seat-side ordering, delivery, identification checks, and disturbance reporting in their own section"
    identity: "entity_backed:Server"
    exclusive_operations:
      - "POST /order-slips — Place a seat-side order slip (only for a section the acting server owns)"
      - "POST /order-slips/{id}/prepare — Send a ticket to the kitchen"
      - "POST /order-slips/{id}/mark-ready — Mark a ticket ready"
      - "POST /order-slips/{id}/deliver — Deliver a slip"
      - "POST /kitchen-tickets/{id}/verify-id — Record an identification check"
      - "POST /disturbance-events — Report a disturbance"
    shared_operations:
      - "POST /checks/{id}/close — Settle a check"
      - "POST /disturbance-events/{id}/amend — Amend a disturbance report"
      - "all GET endpoints except GET /auditoriums/{id}/refund-liability"

  - name: ProgrammingCoordinator
    description: "Programmer: schedules showtimes, owns special programming events and their activation, and can cancel programming"
    identity: "opaque"
    exclusive_operations:
      - "POST /showtimes — Schedule a showtime"
      - "POST /showtimes/{id}/cancel — Cancel a showtime"
      - "POST /programming-events — Create a programming event"
      - "POST /programming-events/{id}/activate — Activate a programming event"
      - "POST /programming-events/{id}/cancel — Cancel a programming event"
    shared_operations:
      - "POST /programming-events/{id}/pre-show-content/submit — Submit pre-show content"
      - "POST /programming-events/{id}/themed-menu-items — Attach a themed menu item"
      - "all GET endpoints"

  - name: Anonymous
    description: "Caller presenting no credentials; used only to assert that the authentication row rejects requests before any other evaluation"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []

  - name: PreShowProducer
