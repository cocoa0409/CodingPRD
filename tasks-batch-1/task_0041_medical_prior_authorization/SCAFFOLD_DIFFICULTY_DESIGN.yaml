scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_share_full_vs_partial_approval_on_request
        grounds:
          - calculations.member_cost_share
          - calculations.approved_units_resolution
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_APPROVED
          - entities.AuthorizationRequest.fields.member_cost_share_cents
        distinguishing_aspect: "On AuthorizationRequest (cost-accounting domain): a PARTIAL approval of 2 of 4 units yields member_cost_share_cents=4000 whereas a full APPROVE of all 4 units of the identical request yields 8000 — same inputs, two variants, divergent number."
        test_recipe:
          setup:
            - "Payer with coinsurance member 0.2, a reviewer, an UNDER_REVIEW request: requested_units=4, unit_cost_cents=10000, no evidence lines."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", standard_sla_hours: 168, expedited_sla_hours: 72 }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1", coinsurance_rate: 0.2 }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "DRUG", procedure_code: "NDC-001", requested_units: 4, unit_cost_cents: 10000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "LETTER_OF_MEDICAL_NECESSITY", line_item_cost_cents: 0, uri: "s3://lmn" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
          trigger:
            - call: "POST /review-decisions"
              payload: { request_id: "${req_id}", reviewer_id: "${reviewer_id}", outcome: "PARTIAL", approved_units: 2, rationale: "Half medically necessary" }
              as: Payer
              as_user_id: "${payer_id}"
          assert:
            - "AuthorizationRequest.${req_id}.approved_units == 2"
            - "AuthorizationRequest.${req_id}.member_cost_share_cents == 4000"
            - "A sibling identical request approved in full (APPROVE, approved_units=4) instead yields member_cost_share_cents == 8000"
      - name: appeal_deadline_standard_vs_expedited_window
        grounds:
          - calculations.appeal_deadline
          - entities.Appeal.fields.appeal_deadline_at
          - state_machines.Appeal.OPEN_to_UPHELD
        distinguishing_aspect: "On Appeal (compliance-timeline domain, distinct from cost accounting): a tier-3 standard appeal filed 2026-06-10T00:00:00Z gets appeal_deadline_at=2026-07-25T00:00:00Z (45 days), whereas the identical tier-3 appeal on an expedited request gets 2026-06-21T06:00:00Z (45*0.25=11.25 days)."
        test_recipe:
          setup:
            - "A DENIED expedited request and a DENIED standard request, each escalated through to a tier-3 OPEN appeal, clock at 2026-06-10T00:00:00Z when each tier-3 is filed."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", standard_sla_hours: 168, expedited_sla_hours: 72 }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1", coinsurance_rate: 0.2 }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-EXP", requested_units: 1, unit_cost_cents: 5000, is_expedited: true }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_exp: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_exp}", document_type: "CHART_NOTE", line_item_cost_cents: 0, uri: "s3://n1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_exp}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_exp}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /review-decisions"
              payload: { request_id: "${req_exp}", reviewer_id: "${reviewer_id}", outcome: "DENY", rationale: "Not indicated" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /appeals"
              payload: { request_id: "${req_exp}" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { appeal_exp_t1: $.data.id }
            - call: "POST /appeals/${appeal_exp_t1}/decide"
              payload: { decision: "UPHELD", decision_rationale: "Denial stands t1" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /appeals"
              payload: { request_id: "${req_exp}" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { appeal_exp_t2: $.data.id }
            - call: "POST /appeals/${appeal_exp_t2}/decide"
              payload: { decision: "UPHELD", decision_rationale: "Denial stands t2" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: Provider
            - call: "POST /appeals"
              payload: { request_id: "${req_exp}" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { appeal_exp_t3: $.data.id }
          trigger:
            - call: "GET /appeals/${appeal_exp_t3}"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
          assert:
            - "Appeal.${appeal_exp_t3}.tier == 3"
            - "Appeal.${appeal_exp_t3}.appeal_deadline_at == 2026-06-21T06:00:00.000Z"
            - "An equivalent tier-3 appeal on a standard (is_expedited=false) request filed at the same 2026-06-10T00:00:00Z instant has appeal_deadline_at == 2026-07-25T00:00:00.000Z"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sla_due_at_expedited_branch_with_inputs
        grounds:
          - calculations.sla_due_at
          - entities.AuthorizationRequest.fields.sla_due_at
          - entities.Payer.fields.expedited_sla_hours
          - state_machines.AuthorizationRequest.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: "Mode (a): sla_due_at takes >=3 inputs (is_expedited, payer.expedited_sla_hours, review_started_at, clock_paused_hours) with a conditional branch on is_expedited; review_started_at 2026-06-01T00:00:00Z + 72h expedited = 2026-06-04T00:00:00Z, distinct from the 168h standard branch (2026-06-08T00:00:00Z)."
        test_recipe:
          setup:
            - "Expedited request brought to UNDER_REVIEW with review_started_at = 2026-06-01T00:00:00Z, clock_paused_hours = 0."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", standard_sla_hours: 168, expedited_sla_hours: 72 }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1", coinsurance_rate: 0.2 }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-100", requested_units: 1, unit_cost_cents: 5000, is_expedited: true }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "CHART_NOTE", line_item_cost_cents: 0, uri: "s3://n1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
          trigger:
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
          assert:
            - "AuthorizationRequest.${req_id}.sla_due_at == 2026-06-04T00:00:00.000Z"
            - "An otherwise-identical standard (is_expedited=false) request reviewed at the same instant has sla_due_at == 2026-06-08T00:00:00.000Z"
      - name: cost_share_round_per_line_then_sum
        grounds:
          - calculations.member_cost_share
          - entities.ClinicalEvidence.fields.line_item_cost_cents
          - entities.AuthorizationRequest.fields.member_cost_share_cents
          - state_machines.AuthorizationRequest.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Mode (b): nested rounding where order matters. Two evidence lines of 1002 cents at coinsurance 0.2 round PER LINE to 200 each (sum 400); the forbidden sum-then-round path would give round(2004*0.2)=401. The scaffold pins round-per-line-then-sum, so the asserted total reflects 400 not 401."
        test_recipe:
          setup:
            - "A DRAFT request (requested_units=1, unit_cost_cents=0) with two ClinicalEvidence lines of 1002 cents each; member coinsurance 0.2; submitted to lock member_cost_share_cents."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1", coinsurance_rate: 0.2 }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "RADIOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Provider
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-X", requested_units: 1, unit_cost_cents: 0 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "IMAGING", line_item_cost_cents: 1002, uri: "s3://img1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "IMAGING", line_item_cost_cents: 1002, uri: "s3://img2" }
              as: Provider
              as_user_id: "${provider_id}"
          trigger:
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
          assert:
            - "AuthorizationRequest.${req_id}.member_cost_share_cents == 400"
            - "member_cost_share_cents != 401 (the sum-then-round result is explicitly NOT produced)"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: request_pended_to_under_review_revision_loop
        grounds:
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_PENDED
          - state_machines.AuthorizationRequest.PENDED_to_UNDER_REVIEW
          - entities.AuthorizationRequest.fields.status
        distinguishing_aspect: "On AuthorizationRequest: a cycle UNDER_REVIEW -> PENDED -> UNDER_REVIEW (PEND then resume-review after new evidence) returns the entity to a previously-visited state, which a linear pipeline cannot."
        test_recipe:
          setup:
            - "A request UNDER_REVIEW, then PENDED via a PEND decision, with one new evidence row added after the pend."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "NEUROLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "NEUROLOGY" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-N", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "CHART_NOTE", line_item_cost_cents: 0, uri: "s3://n1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /review-decisions"
              payload: { request_id: "${req_id}", reviewer_id: "${reviewer_id}", outcome: "PEND", pend_reason: "INSUFFICIENT_EVIDENCE" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "LAB_RESULT", line_item_cost_cents: 0, uri: "s3://lab1" }
              as: Provider
              as_user_id: "${provider_id}"
          trigger:
            - call: "POST /authorization-requests/${req_id}/resume-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
          assert:
            - "AuthorizationRequest.${req_id}.status == UNDER_REVIEW"
            - "The status sequence visited UNDER_REVIEW twice (before PEND and after resume), confirming a cycle"
      - name: appeal_uphold_escalate_cycle_across_tiers
        grounds:
          - state_machines.Appeal.OPEN_to_UPHELD
          - state_machines.Appeal.UPHELD_to_ESCALATED
          - entities.Appeal.fields.tier
        distinguishing_aspect: "On Appeal (different entity from AuthorizationRequest): the UPHELD -> ESCALATED transition spawns a fresh OPEN appeal at tier+1, a loop back to the OPEN state on a higher tier — a non-linear escalation cycle, not a one-way pipeline."
        test_recipe:
          setup:
            - "A DENIED request with a tier-1 appeal that has been UPHELD."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ORTHOPEDICS" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "ORTHOPEDICS" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-O", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "IMAGING", line_item_cost_cents: 0, uri: "s3://i1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /review-decisions"
              payload: { request_id: "${req_id}", reviewer_id: "${reviewer_id}", outcome: "DENY", rationale: "Not indicated" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /appeals"
              payload: { request_id: "${req_id}" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { appeal_t1: $.data.id }
            - call: "POST /appeals/${appeal_t1}/decide"
              payload: { decision: "UPHELD", decision_rationale: "Stands" }
              as: Payer
              as_user_id: "${payer_id}"
          trigger:
            - call: "POST /appeals"
              payload: { request_id: "${req_id}" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { appeal_t2: $.data.id }
          assert:
            - "Appeal.${appeal_t1}.status == ESCALATED"
            - "Appeal.${appeal_t2}.tier == 2"
            - "Appeal.${appeal_t2}.status == OPEN"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: overturn_cascades_request_then_member_counter_depth3
        grounds:
          - state_machines.Appeal.OPEN_to_OVERTURNED
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_APPROVED
          - entities.AuthorizationRequest.fields.approved_units
          - entities.Member.fields.active_authorization_count
        distinguishing_aspect: "Depth-3 chain from the appeal-decide trigger: Appeal OPEN->OVERTURNED (hop1) causes AuthorizationRequest DENIED->APPROVED setting approved_units (hop2), which itself causes Member.active_authorization_count +=1 (hop3). Each link is caused by the previous one, not by the trigger directly."
        test_recipe:
          setup:
            - "A DENIED request with member.active_authorization_count = 0, a tier-1 OPEN appeal, clock well before the appeal deadline."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "CARDIOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "CARDIOLOGY" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-C", requested_units: 3, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "CHART_NOTE", line_item_cost_cents: 0, uri: "s3://c1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /review-decisions"
              payload: { request_id: "${req_id}", reviewer_id: "${reviewer_id}", outcome: "DENY", rationale: "Not indicated" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /appeals"
              payload: { request_id: "${req_id}" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { decision: "OVERTURNED", decision_rationale: "Medically necessary on review" }
              as: Payer
              as_user_id: "${payer_id}"
          assert:
            - "Appeal.${appeal_id}.status == OVERTURNED"
            - "AuthorizationRequest.${req_id}.status == APPROVED"
            - "AuthorizationRequest.${req_id}.approved_units == 3"
            - "Member.${member_id}.active_authorization_count == 1"
      - name: expire_cascades_member_counter_depth2
        grounds:
          - state_machines.AuthorizationRequest.APPROVED_to_EXPIRED
          - entities.Member.fields.active_authorization_count
        distinguishing_aspect: "Depth-2 chain from a different trigger (expire, not appeal-decide): AuthorizationRequest APPROVED->EXPIRED (hop1) causes Member.active_authorization_count -=1 (hop2). Distinct propagation pattern and origin from the depth-3 overturn cascade."
        test_recipe:
          setup:
            - "An APPROVED request (member.active_authorization_count = 1) with authorization_expires_at = 2027-06-01T00:00:00Z; clock then advanced past expiry."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "PRIMARY_CARE" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "PRIMARY_CARE" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
