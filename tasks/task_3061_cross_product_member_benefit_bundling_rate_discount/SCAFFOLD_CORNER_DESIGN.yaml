# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3061_cross_product_member_benefit_bundling_rate_discount
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
#
# section: / claim_type: values are drawn verbatim from
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: member_create_returns_every_declared_field_and_starts_prospect
        claim_type: Creation
        grounds:
          - entities.Member
          - endpoints.POST_/benefits/members
        distinguishing_aspect: "A member registered with only member_number, full_name and email comes back 201 with member_status PROSPECT, version 1, and system-minted id / created_at / updated_at — status and tier are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &kc
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-001", full_name: "Sara Kim", email: "sara@x.com" }
              as: Anonymous
              captures: { c001_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Member.${c001_id}.member_status == PROSPECT and member_since_at is null"
            - "Member.${c001_id}.member_tier == NONE and benefit_entitlement_state == NONE"
            - "Member.${c001_id}.rewards_points_balance == 0 and churn_risk_score == 0"
            - "Member.${c001_id}.product_adoption_count == 0 and product_line_set == []"
            - "Member.${c001_id}.version == 1 and the response carries non-null created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: member_get_round_trips_every_stored_field_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Member
          - endpoints.GET_/benefits/members/{member_id}
        distinguishing_aspect: "Every Member field survives a GET unchanged, including the null member_since_at of a never-adopted member and the computed fields that the read recomputes rather than stores."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-C-002 registered."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-002", full_name: "Tom Vega", email: "tom@x.com" }
              as: Anonymous
              captures: { c002_id: $.data.id }
          trigger:
            - call: "GET /benefits/members/${c002_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is object"
            - "Member.${c002_id}.member_number == \"M-C-002\" and email == \"tom@x.com\""
            - "Member.${c002_id}.member_since_at is null"
            - "Member.${c002_id}.last_qualifying_deposit_at is null"

      - name: rewards_ledger_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/benefits/rewards-ledger-entries
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three posted entries, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-C-003 with three ADJUST entries."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-003", full_name: "Uma Roy", email: "uma@x.com" }
              as: Anonymous
              captures: { c003_id: $.data.id }
            - call: "POST /benefits/members/${c003_id}/rewards/adjust"
              payload: { points_delta: 100, source_event_code: "A" }
              as: BenefitsAdmin
            - call: "POST /benefits/members/${c003_id}/rewards/adjust"
              payload: { points_delta: 200, source_event_code: "B" }
              as: BenefitsAdmin
            - call: "POST /benefits/members/${c003_id}/rewards/adjust"
              payload: { points_delta: 300, source_event_code: "C" }
              as: BenefitsAdmin
          trigger:
            - call: "GET /benefits/rewards-ledger-entries"
              payload: { member_id: "${c003_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /benefits/rewards-ledger-entries?member_id=${c003_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /benefits/rewards-ledger-entries?member_id=${c003_id}&entry_type=EARN returns 0 rows"
            - "a request with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: member_get_with_an_unknown_id_returns_member_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/benefits/members/{member_id}
          - errors[ERR_MEMBER_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated member id produces the entity-specific 404 ERR_MEMBER_NOT_FOUND, not the generic ERR_RESOURCE_NOT_FOUND reserved for the other path ids."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No member has been created."
          setup_api_calls:
            - *kc
          trigger:
            - call: "GET /benefits/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_MEMBER_NOT_FOUND"
            - "error_id != ERR_RESOURCE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: holding_create_missing_product_line_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ProductHolding.fields.product_line
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "product_line is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check, not the 404 that an unresolvable member_id produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-C-005 exists."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-005", full_name: "Vic Lang", email: "vic@x.com" }
              as: Anonymous
              captures: { c005_id: $.data.id }
          trigger:
            - call: "POST /benefits/holdings"
              payload: { member_id: "${c005_id}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /benefits/holdings?member_id=${c005_id} returns 0 rows"

      - name: holding_create_omitting_balance_defaults_it_to_zero
        claim_type: Defaults
        grounds:
          - entities.ProductHolding.fields.balance_cents
          - calculations.product_adoption_count
        distinguishing_aspect: "balance_cents declares a default of 0, so omitting it stores 0 rather than null, and the member's qualifying deposit balance stays 0 even after the holding is adopted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-C-006 exists."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-006", full_name: "Wen Zhao", email: "wen@x.com" }
              as: Anonymous
              captures: { c006_id: $.data.id }
          trigger:
            - call: "POST /benefits/holdings"
              payload: { member_id: "${c006_id}", product_line: "BANKING" }
              as: PlatformAdmin
              captures: { c006_h_id: $.data.id }
          assert:
            - "the response status is 201 and ProductHolding.${c006_h_id}.balance_cents == 0"
            - "ProductHolding.${c006_h_id}.adoption_status == PENDING and adopted_at is null"
            - "Member.${c006_id}.qualifying_deposit_balance_cents == 0"

      - name: loan_account_effective_apr_is_computed_and_input_value_ignored
        claim_type: Computed Fields
        grounds:
          - entities.LoanAccount.fields.effective_apr_bps
          - calculations.loan_effective_apr_bps
        distinguishing_aspect: "effective_apr_bps and discount_stack_bps are computed, so a create that echoes back an effective_apr_bps is ignored and the stored value equals base_apr_bps until a discount is applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-C-007 holds an ADOPTED LENDING holding."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-007", full_name: "Xiu Park", email: "xiu@x.com" }
              as: Anonymous
              captures: { c007_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${c007_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { c007_h_id: $.data.id }
            - call: "POST /benefits/holdings/${c007_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${c007_id}"
          trigger:
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${c007_id}", holding_id: "${c007_h_id}", loan_type: "PERSONAL", principal_cents: 800000, base_apr_bps: 999 }
              as: Underwriter
              captures: { c007_la_id: $.data.id }
          assert:
            - "the response status is 201"
            - "LoanAccount.${c007_la_id}.effective_apr_bps == 999 and discount_stack_bps == 0"
            - "LoanAccount.${c007_la_id}.pricing_status == PROVISIONAL and autopay_status == NOT_ENROLLED"
            - "LoanAccount.${c007_la_id}.last_priced_at == 2026-09-01T00:00:00Z"

      - name: system_fields_are_server_minted_and_never_echo_client_values
        claim_type: System Fields
        grounds:
          - entities.Member.fields.member_status
          - state_machines.ProductHolding.PENDING_to_ADOPTED
        distinguishing_aspect: "id, created_at, updated_at and version are server-owned; adopted_at is stamped by the server on adoption rather than accepted from the caller, so the stored timestamp equals the logical clock."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-C-008 holds a PENDING LENDING holding created at the same instant."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-008", full_name: "Yuri Blum", email: "yuri@x.com" }
              as: Anonymous
              captures: { c008_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${c008_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { c008_h_id: $.data.id }
          trigger:
            - call: "POST /benefits/holdings/${c008_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${c008_id}"
          assert:
            - "ProductHolding.${c008_h_id}.adopted_at == 2026-09-01T00:00:00Z (server-stamped from the logical clock, not from the request)"
            - "ProductHolding.${c008_h_id}.version advanced from 1 to 2 on adoption"
            - "ProductHolding.${c008_h_id}.updated_at was refreshed and differs from created_at only if the clock moved"

      - name: entitlement_create_rejects_an_unknown_benefit_code
        claim_type: Type Constraints
        grounds:
          - entities.BenefitEntitlement.fields.benefit_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "benefit_code is a closed enum, so a value outside its five members is a 400 ERR_INVALID_REQUEST from the type check rather than the 422 that a bad source holding produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-C-009 holds an ADOPTED CAREER holding."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-009", full_name: "Zed Aoki", email: "zed@x.com" }
              as: Anonymous
              captures: { c009_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${c009_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { c009_h_id: $.data.id }
            - call: "POST /benefits/holdings/${c009_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${c009_id}"
          trigger:
            - call: "POST /benefits/members/${c009_id}/entitlements"
              payload: { source_holding_id: "${c009_h_id}", benefit_code: "FREE_MONEY", value_bps: 10 }
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_ENTITLEMENT_NO_SOURCE_HOLDING"
            - "GET /benefits/benefit-entitlements?member_id=${c009_id} returns 0 rows"

      - name: entitlement_create_with_a_holding_owned_by_another_member_is_refused
        claim_type: Parent Relationships
        grounds:
          - entities.BenefitEntitlement.fields.source_holding_id
          - errors[ERR_ENTITLEMENT_NO_SOURCE_HOLDING]
          - validations[priority=27]
        distinguishing_aspect: "source_holding_id must resolve to a holding of the same member, so a real holding id belonging to a different member is rejected with ERR_ENTITLEMENT_NO_SOURCE_HOLDING rather than accepted as a dangling reference."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Members M-C-010A and M-C-010B each hold one ADOPTED holding."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-010A", full_name: "Ana Sol", email: "ana.sol@x.com" }
              as: Anonymous
              captures: { c010a_id: $.data.id }
            - call: "POST /benefits/members"
              payload: { member_number: "M-C-010B", full_name: "Ben Sol", email: "ben.sol@x.com" }
              as: Anonymous
              captures: { c010b_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${c010a_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { c010a_h_id: $.data.id }
            - call: "POST /benefits/holdings/${c010a_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${c010a_id}"
          trigger:
            - call: "POST /benefits/members/${c010b_id}/entitlements"
              payload: { source_holding_id: "${c010a_h_id}", benefit_code: "CAREER_COACHING_CREDIT", value_bps: 5 }
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ENTITLEMENT_NO_SOURCE_HOLDING"
            - "GET /benefits/benefit-entitlements?member_id=${c010b_id} returns 0 rows"
            - "GET /benefits/benefit-entitlements?member_id=${c010a_id} returns 0 rows"

# ===========================================================================
  - section: state_machines
    instances:

      - name: holding_adopt_from_closed_returns_invalid_state_and_no_side_effects
        claim_type: invalid_transition
        grounds:
          - state_machines.ProductHolding.ADOPTED_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal for ProductHolding, so a re-adopt of a closed holding is refused with ERR_INVALID_STATE and leaves the member's tier, adoption count and entitlement set completely untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-S-001 holds one CLOSED CAREER holding."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-S-001", full_name: "Cara Nunez", email: "cara@x.com" }
              as: Anonymous
              captures: { s001_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${s001_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { s001_h_id: $.data.id }
            - call: "POST /benefits/holdings/${s001_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${s001_id}"
            - call: "POST /benefits/holdings/${s001_h_id}/close"
              payload: {}
              as: Member
              as_user_id: "${s001_id}"
          trigger:
            - call: "POST /benefits/holdings/${s001_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${s001_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "ProductHolding.${s001_h_id}.adoption_status stays CLOSED and adopted_at is unchanged"
            - "Member.${s001_id}.product_adoption_count stays 0 and member_tier stays NONE"
            - "no BenefitEntitlement row exists for ${s001_id}"

      - name: holding_adopt_by_a_different_member_is_forbidden
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProductHolding.PENDING_to_ADOPTED
          - roles.Member.identity
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The adoption precondition compares the acting X-User-ID to the holding's member_id, so a second member acting on the first member's holding is refused with ERR_FORBIDDEN_ROLE rather than succeeding as a shared operation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-S-002A owns a PENDING holding; member M-S-002B is unrelated."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-S-002A", full_name: "Dana Frost", email: "dana@x.com" }
              as: Anonymous
              captures: { s002a_id: $.data.id }
            - call: "POST /benefits/members"
              payload: { member_number: "M-S-002B", full_name: "Evan Frost", email: "evan@x.com" }
              as: Anonymous
              captures: { s002b_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${s002a_id}", product_line: "INVESTING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { s002a_h_id: $.data.id }
          trigger:
            - call: "POST /benefits/holdings/${s002a_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${s002b_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "ProductHolding.${s002a_h_id}.adoption_status stays PENDING"
            - "Member.${s002a_id}.member_status stays PROSPECT and Member.${s002b_id}.member_status stays PROSPECT"

      - name: holding_close_while_a_live_loan_exists_returns_holding_has_active_loan
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProductHolding.ADOPTED_to_CLOSED
          - validations[priority=26]
          - errors[ERR_HOLDING_HAS_ACTIVE_LOAN]
        distinguishing_aspect: "The close precondition is a cross-entity read: it refuses while any LoanAccount the holding carries sits in PROVISIONAL, FINAL or STEPPED_DOWN, and it is the business_referential check that fires rather than the state check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-S-003 holds an ADOPTED LENDING holding carrying a PROVISIONAL LoanAccount."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-S-003", full_name: "Fern Ito", email: "fern@x.com" }
              as: Anonymous
              captures: { s003_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${s003_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { s003_h_id: $.data.id }
            - call: "POST /benefits/holdings/${s003_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${s003_id}"
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${s003_id}", holding_id: "${s003_h_id}", loan_type: "AUTO", principal_cents: 300000, base_apr_bps: 1050 }
              as: Underwriter
              captures: { s003_la_id: $.data.id }
          trigger:
            - call: "POST /benefits/holdings/${s003_h_id}/close"
              payload: {}
              as: Member
              as_user_id: "${s003_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_HOLDING_HAS_ACTIVE_LOAN"
            - "error_id != ERR_INVALID_STATE, because the holding is perfectly adoptable; the blocker is the referential rule"
            - "ProductHolding.${s003_h_id}.adoption_status stays ADOPTED"

      - name: autopay_and_pricing_are_independent_dimensions_on_one_loan_row
        claim_type: parallel_dimensions
        grounds:
          - state_machines.LoanAccount.NOT_ENROLLED_to_ENROLLED
          - state_machines.LoanAccount.PROVISIONAL_to_FINAL
          - entities.LoanAccount.fields.autopay_status
          - entities.LoanAccount.fields.pricing_status
        distinguishing_aspect: "The two LoanAccount dimensions evolve without gating each other: autopay can be suspended while the loan stays FINAL, and the loan can be finalized while autopay is suspended, so all four combinations are reachable on one row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-S-004 holds an ADOPTED LENDING holding with a PROVISIONAL LoanAccount."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-S-004", full_name: "Gale Sutton", email: "gale@x.com" }
              as: Anonymous
              captures: { s004_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${s004_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { s004_h_id: $.data.id }
            - call: "POST /benefits/holdings/${s004_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${s004_id}"
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${s004_id}", holding_id: "${s004_h_id}", loan_type: "PERSONAL", principal_cents: 700000, base_apr_bps: 1100 }
              as: Underwriter
              captures: { s004_la_id: $.data.id }
            - call: "POST /benefits/loan-accounts/${s004_la_id}/autopay-enrollment"
              payload: {}
              as: Member
              as_user_id: "${s004_id}"
            - call: "POST /benefits/loan-accounts/${s004_la_id}/finalize-pricing"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /benefits/loan-accounts/${s004_la_id}/autopay-suspend"
              payload: {}
              as: PlatformAdmin
          assert:
            - "after suspension: LoanAccount.${s004_la_id}.autopay_status == SUSPENDED while pricing_status stays FINAL"
            - "the pricing dimension was never reset by the autopay change"
            - "re-enrolling autopay returns autopay_status to ENROLLED and leaves pricing_status FINAL, reaching the FINAL x ENROLLED combination a second time"
            - "all four (autopay x pricing) combinations are reachable: the first three are covered above and PROVISIONAL x NOT_ENROLLED is the loan's initial state"

      - name: grace_lapse_without_elapsed_deadline_returns_grace_period_not_elapsed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DirectDepositEnrollment.GRACE_to_LAPSED
