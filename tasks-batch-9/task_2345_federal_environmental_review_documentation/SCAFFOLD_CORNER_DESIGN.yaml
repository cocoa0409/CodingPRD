      - name: corner_error_agency_suspended_rejects_consultation_open
        claim_type: violation_to_error
        grounds: [errors.ERR_AGENCY_SUSPENDED, entities.Agency.fields.status]
        distinguishing_aspect: "Agency availability is checked before any interval or capacity arithmetic: a SUSPENDED agency with free capacity still yields ERR_AGENCY_SUSPENDED, and reactivation is not modelled, so the request must be routed to an ACTIVE agency instead."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action is CLASSIFIED as ENVIRONMENTAL_ASSESSMENT."
            - "Agency SHPO exists with status SUSPENDED and no consultations."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - call: "POST /agencies"
              payload: { agency_code: "SHPO", name: "State Historic Preservation Office", agency_role: "CONSULTING", max_concurrent_consultations: 1, handoff_buffer_days: 3, statutory_response_days: 30, status: "SUSPENDED" }
              as: PolicyAdmin
              captures: { shpo_id: $.data.id }
          trigger:
            - call: "POST /consultations"
              payload: { action_id: "${act_id}", agency_id: "${shpo_id}", consultation_type: "NHPA_SECTION_106", requested_start_at: "2026-08-05T00:00:00Z" }
              as: NepaCoordinator
          assert:
            - "HTTP status is 409 and data.error_id == ERR_AGENCY_SUSPENDED"
            - "Agency.${shpo_id}.active_consultation_count == 0"
            - "GET /consultations?action_id=${act_id} returns total_count == 0"

      - name: corner_error_alternative_not_feasible_rejects_screen_in
        claim_type: violation_to_error
