              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-14T00:00:00Z" }
              as: MethodologyStatistician
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtv1_id}", source_methodology: "INHOME_TUNER", start_iso: "2027-02-13T18:00:00Z", end_iso: "2027-02-13T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
              as: MethodologyStatistician
