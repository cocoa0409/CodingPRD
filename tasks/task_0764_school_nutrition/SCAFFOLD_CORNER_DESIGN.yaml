        distinguishing_aspect: "A claim read at version v is submitted with expected_claim_version=v after a late reimbursable meal for the same month recomputed the claim and advanced its version; the stale submit is rejected ERR_STALE_CLAIM_VERSION (412)."
        test_recipe:
