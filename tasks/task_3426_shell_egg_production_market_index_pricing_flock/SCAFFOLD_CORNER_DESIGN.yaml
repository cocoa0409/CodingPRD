        claim_type: ownership_scope
        grounds:
          - roles.Customer
          - validations[priority=3]
        distinguishing_aspect: "Customer identity is entity-backed: X-User-ID of customer B against a commitment owned by customer A fails ownership (priority 3) even though Customer is an allowed role for the endpoint."
        test_recipe:  
          setup: ["Customers A and B; A's commitment ACTIVE."]
          setup_api_calls:
            - *c_clock0901
            - call: "POST /api/customers"
