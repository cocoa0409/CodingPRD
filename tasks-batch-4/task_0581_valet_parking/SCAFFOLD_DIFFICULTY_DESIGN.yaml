        distinguishing_aspect: |
          Time metric on POST /valet/tickets/{id}/checkout: duration exactly 15 min (== free_grace_minutes)
          charges 0, while 16 min charges 1300 — the <= grace boundary, on a different metric and endpoint
          than the capacity count check.
