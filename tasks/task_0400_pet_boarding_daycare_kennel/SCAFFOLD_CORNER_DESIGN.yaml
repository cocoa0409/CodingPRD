      - name: addon_out_of_window_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=21]", "errors[ERR_ADDON_OUT_OF_WINDOW]"]
        distinguishing_aspect: "Adding a BATH with scheduled_date outside [start_date,end_date] -> ERR_ADDON_OUT_OF_WINDOW."
        test_recipe:
          setup: ["An OVERNIGHT reservation 2026-03-01..2026-03-04; add-on scheduled 2026-03-10 (outside)"]
          setup_api_calls:
            - call: "POST /facilities"
