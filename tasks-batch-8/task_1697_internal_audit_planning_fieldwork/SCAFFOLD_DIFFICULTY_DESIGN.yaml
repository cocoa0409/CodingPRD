  - rule_id: cross_entity_state_dependency
    instances:
      - name: workpaper_review_gated_by_engagement_fieldwork
        grounds:
          - state_machines.Workpaper.RETURNED_to_DRAFT
          - state_machines.Engagement.FIELDWORK_to_REPORTING
          - errors[ERR_ENGAGEMENT_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair Workpaper -> Engagement: a workpaper revision that was legal
