  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_version_on_application_patch_returns_412
        claim_type: Stale Version Conflict
        grounds:
          - concurrency_rules[application-patch-stale-version]
          - complexity_profile.complexity_layers[optimistic_concurrency]
        distinguishing_aspect: "PATCH carries expected_application_version: the first patch at version 1 succeeds (version advances to 2), and a second patch still carrying 1 is rejected 412 ERR_STALE_VERSION — a strictly sequential stale-write detection."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; independent applicant's DRAFT application at version 1."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Moorland", project_summary: "Moor ecology", proposed_duration_months: 10 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id, app_v1: $.data.version }
          trigger:
            - call: "PATCH /exchange/applications/${app}"
              payload: { project_title: "Moorland Revised", expected_application_version: "${app_v1}" }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app_v2: $.data.version }
            - call: "PATCH /exchange/applications/${app}"
              payload: { project_title: "Moorland Hijacked", expected_application_version: "${app_v1}" }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "first PATCH succeeds: version 1 -> 2 and project_title Moorland Revised"
            - "second PATCH with the same (now stale) version fails: status 412, error_id == ERR_STALE_VERSION"
            - "Application.${app}.project_title remains Moorland Revised and version remains 2"

      - name: occ_stale_version_on_placement_round_create_returns_412
        claim_type: Stale Version Conflict
        grounds:
          - concurrency_rules[placement-round-create-stale-application]
          - complexity_profile.complexity_layers[optimistic_concurrency]
        distinguishing_aspect: "Round creation is OCC-guarded on the application's version: after round 1 (created at the post-SELECT version) bumps the version, a second create replaying the stale version is 412 ERR_STALE_VERSION — OCC (priority 4) fires before the active-round constraint (priority 9) even though both hold."
        test_recipe:
          setup:
            - "Base pipeline to PLACEMENT: round 1 created against the version captured at SELECT (app version now advanced past it)."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - *c_round_std
          trigger:
            - call: "POST /exchange/applications/${app}/placement-rounds"
              payload: { institution_name: "Aachen Institute", institution_band: "HIGH", response_deadline: "2027-04-01T00:00:00Z", expected_application_version: "${app_v_sel}" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION (the version captured at SELECT went stale when round 1 was created)"
            - "the OCC rejection precedes ERR_ACTIVE_ROUND_EXISTS even though round 1 is still OFFERED"
            - "Application.${app}.placement_rounds_used remains 1"

      - name: alumni_follow_on_eligible_path_allows_follow_on_application
        claim_type: Conditional Validation
        grounds:
          - calculations.alumni_engagement_index
          - entities.AlumniProfile.fields.follow_on_eligible
          - entities.Application.fields.is_follow_on
        distinguishing_aspect: "Follow-on gating opens only when the latest profile qualifies: a grantee whose grant COMPLETED on time, whose visa was NOT subject to home residency (ledger NOT_REQUIRED), and who has zero strikes is ELIGIBLE, and their is_follow_on application in a later cycle is accepted."
        test_recipe:
          setup:
            - "Full pipeline to COMPLETED with subject_to_home_residency=false and an on-time FINAL report (no strikes). Then a second cycle (2028-2029) with a DE program, OPEN, at clock 2028-07-01."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - *c_round_std
            - *c_accept
            - *c_confirm
            - *c_clock_orient
            - &c_visa_false
              call: "POST /exchange/grants/${gr}/visa-sponsorships"
              payload: { subject_to_home_residency: false, orientation_completed_at: "2027-06-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { visa: $.data.id }
            - *c_clock_start
            - *c_activate
            - *c_clock_end
            - *c_finalontime
            - *c_complete
            - call: "GET /exchange/applicants/${apl}/alumni-profiles"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { prof: $.data.0.id, elig: $.data.0.follow_on_eligible }
            - call: "POST /exchange/cycles"
              payload: { academic_year: "2028-2029", application_deadline: "2028-12-01T23:59:59Z" }
              as: PlatformAdmin
              captures: { cyc2: $.data.id }
            - call: "POST /exchange/cycles/${cyc2}/country-programs"
              payload: { country_code: "DE", slot_quota: 1, min_duration_months: 6, max_duration_months: 12, monthly_stipend_standard_cents: 300000, monthly_stipend_high_cents: 360000, dependent_allowance_monthly_cents: 50000, travel_allowance_cents: 150000, health_benefit_monthly_cents: 20000, language_requirement: "NONE" }
              as: PlatformAdmin
              captures: { cp2: $.data.id }
            - call: "POST /exchange/cycles/${cyc2}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc2}", country_program_id: "${cp2}", project_title: "Return Stay", project_summary: "Follow-on research", proposed_duration_months: 6, is_follow_on: true }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app2: $.data.id, st2: $.data.status }
          assert:
            - "AlumniProfile.${prof}.follow_on_eligible == ELIGIBLE (COMPLETED grant, 0 strikes, residency NOT_REQUIRED)"
            - "AlumniProfile.${prof}.residency_status == NOT_REQUIRED (subject_to_home_residency false at issuance)"
            - "the follow-on application is created: status 201, Application.${app2}.status == DRAFT and is_follow_on == true"

      - name: follow_on_without_history_returns_follow_on_ineligible
        claim_type: Conditional Validation
        grounds:
          - validations[priority=9 business_constraint ERR_FOLLOW_ON_INELIGIBLE]
        distinguishing_aspect: "The gate's empty-set arm: an applicant with NO alumni profile at all is ineligible for a follow-on application — ERR_FOLLOW_ON_INELIGIBLE, not a 404."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; one fresh independent applicant with no grant history."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
          trigger:
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Follow On", project_summary: "Continuation", proposed_duration_months: 6, is_follow_on: true }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FOLLOW_ON_INELIGIBLE (no AlumniProfile exists to qualify)"
            - "no application is persisted"

      - name: alumni_with_two_strikes_is_follow_on_ineligible
        claim_type: Threshold Trigger
        grounds:
          - calculations.alumni_engagement_index
          - calculations.report_lateness
          - entities.AlumniProfile.fields.follow_on_eligible
        distinguishing_aspect: "The strike threshold MAX_COMPLIANCE_STRIKES 2 is inclusive at failure: exactly two late reports (late INTERIM + late FINAL) make an otherwise completed, residency-free grantee INELIGIBLE, and the provisional/certified indices diverge (30 vs 10) on the same data."
        test_recipe:
          setup:
            - "Full pipeline with subject_to_home_residency=false. INTERIM submitted late at 2028-01-15 (strike 1); FINAL submitted late at 2028-08-05 (due 2028-07-31; strike 2); grant COMPLETED (late FINAL still counts as SUBMITTED)."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - *c_round_std
            - *c_accept
            - *c_confirm
            - *c_clock_orient
            - *c_visa_false
            - *c_clock_start
            - *c_activate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exchange/grants/${gr}/reports"
              payload: { report_type: "INTERIM", content: "Late midterm" }
              as: Applicant
              as_user_id: "${apl}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-05T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exchange/grants/${gr}/reports"
              payload: { report_type: "FINAL", content: "Late final" }
              as: Applicant
              as_user_id: "${apl}"
            - *c_complete
          trigger:
            - call: "GET /exchange/applicants/${apl}/alumni-profiles"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { prof: $.data.0.id }
          assert:
            - "Grant.${gr}.compliance_strikes == 2 (both reports late; resubmission never re-strikes)"
            - "AlumniProfile.${prof}.follow_on_eligible == INELIGIBLE at exactly MAX_COMPLIANCE_STRIKES (boundary is strikes < 2)"
            - "AlumniProfile.${prof}.engagement_index_provisional == 30 (50 + 10*2 submitted-counted - 20*2)"
            - "AlumniProfile.${prof}.engagement_index_certified == 10 (50 + 0 accepted - 40)"
            - "a subsequent is_follow_on application by this applicant would be rejected ERR_FOLLOW_ON_INELIGIBLE"

