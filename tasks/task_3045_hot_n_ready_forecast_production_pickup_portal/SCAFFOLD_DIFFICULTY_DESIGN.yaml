scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two different entity domains: Daypart forecast
  # vs StoreDay waste)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_provisional_counts_scheduled_event_final_excludes_it
        grounds:
          - calculations.daypart_forecast
          - entities.Daypart.fields.forecast_units_provisional
          - entities.Daypart.fields.forecast_units_final
        distinguishing_aspect: |
          Same StoreDay + Daypart + DemandEvent rows: the provisional variant
          (status filter {SCHEDULED, ACTIVE}) counts an overlapping event that
          has not started yet, yielding 20, while the final variant computed at
          daypart close (filter {ACTIVE, ENDED}) excludes that same SCHEDULED
          event, yielding 10 — identical underlying data, two variant answers.
        test_recipe:
          setup:
            - "StoreDay 2026-09-10 opened; DINNER daypart 960-1020 (16:00Z-17:00Z), base_demand_units 10, rack_capacity 30"
            - "DemandEvent 'Game Night' window 16:30Z-19:00Z multiplier 2.0 — overlaps the daypart window (closed intersection at 16:30-17:00)"
            - "Clock moved to 16:05Z: daypart auto-activates (window reached), but the event remains SCHEDULED (16:05 < 16:30)"
            - "Daypart closed while the event is still SCHEDULED"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-10" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "DINNER", window_start_minute: 960, window_end_minute: 1020, rack_capacity: 30, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/demand-events"
              payload: { name: "Game Night", window_start_at: "2026-09-10T16:30:00Z", window_end_at: "2026-09-10T19:00:00Z", demand_multiplier: 2.0 }
              as: StoreManager
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T16:05:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /dayparts/${dp_id}/close"
              payload: {}
              as: ShiftLead
              captures: { dp_final: $.data.forecast_units_final }
          assert:
            - "Daypart.${dp_id}.status == CLOSED"
            - "Daypart.${dp_id}.forecast_units_provisional == 20 (SCHEDULED overlapping event counted: 10 x 2.0)"
            - "Daypart.${dp_id}.forecast_units_final == 10 (SCHEDULED event excluded at close: 10 x 1.0)"
            - "forecast_units_provisional != forecast_units_final"
      - name: waste_pct_standard_vs_net_diverge_on_donation
        grounds:
          - calculations.waste_pct
          - entities.StoreDay.fields.waste_pct_standard
          - entities.StoreDay.fields.waste_pct_net
        distinguishing_aspect: |
          StoreDay waste domain (distinct from the Daypart forecast domain):
          with produced_units 3, discarded_units 1, donated_units 1 the standard
          variant reports 33.33 while the net variant subtracts the donation and
          reports 0.0 — identical raw waste data, two valid algorithms, two
          different percentages.
        test_recipe:
          setup:
            - "StoreDay 2026-09-11 opened; LUNCH daypart 600-840 ACTIVE at 10:30Z, rack_capacity 20"
            - "Dough batch 10 units advanced to PROOFED (mix at 10:00Z, proofing from 10:05Z, proofed at 12:05Z+ -> use clock moves); cheese batch 10 units READY"
            - "Product P1 sku PEP list 600 no promo"
            - "Production run qty 3 racked at 10:30Z -> produced_units 3; three HOLDING units"
            - "One unit manually discarded with donated=true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T08:00:00Z" }
              as: StoreManager
            - call: "POST /store-days"
              payload: { business_date: "2026-09-11" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /store-days/${sd_id}/dough-batches"
              payload: { size_units: 10 }
              as: CrewMember
              captures: { db_id: $.data.id }
            - call: "POST /store-days/${sd_id}/cheese-batches"
              payload: { size_units: 10 }
              as: CrewMember
              captures: { cb_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p1_id: $.data.id }
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T10:05:00Z" }
              as: StoreManager
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T10:35:00Z" }
              as: StoreManager
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /dayparts/${dp_id}/production-runs"
              payload: { product_id: "${p1_id}", dough_batch_id: "${db_id}", cheese_batch_id: "${cb_id}", quantity: 3 }
              as: ShiftLead
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/start-baking"
              payload: {}
              as: CrewMember
            - call: "POST /production-runs/${run_id}/rack"
              payload: {}
              as: CrewMember
            - call: "GET /hold-units"
              payload: { production_run_id: "${run_id}", status: "HOLDING" }
              as: CrewMember
              captures: { hu1_id: "$.data[0].id" }
            - call: "POST /hold-units/${hu1_id}/discard"
              payload: { reason: "QUALITY", donated: true }
              as: ShiftLead
          trigger:
            - call: "GET /store-days/${sd_id}"
              payload: {}
              as: StoreManager
              captures: { sd_std: $.data.waste_pct_standard, sd_net: $.data.waste_pct_net }
          assert:
            - "StoreDay.${sd_id}.produced_units == 3"
            - "StoreDay.${sd_id}.discarded_units == 1"
            - "StoreDay.${sd_id}.donated_units == 1"
            - "StoreDay.${sd_id}.waste_pct_standard == 33.33"
            - "StoreDay.${sd_id}.waste_pct_net == 0.0"
            - "waste_pct_standard != waste_pct_net (donation divergence)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (mode (b) nested rounding on order_pricing;
  # mode (a) >=3-input non-linear formula on made_ahead_target)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.portal_fee_cents
          - entities.Order.fields.total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order rounds the 5% portal fee
          PER LINE then sums. Three lines of 555x1 give per-line fees
          round(27.75)=28 each, portal_fee_cents 84; the forbidden
          sum-then-round order on the same lines gives round(1665 x 0.05)=83 —
          one cent of divergence pinned by the scaffold to 84.
        test_recipe:
          setup:
            - "StoreDay 2026-09-12 opened; LUNCH daypart ACTIVE at 11:00Z"
            - "Product CHEESE list_price_cents 555, no promo, customization_allowed false"
            - "PORTAL_STANDARD order with three separate lines of CHEESE quantity 1 each"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-12" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T11:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "CHZ", name: "Cheese", list_price_cents: 555 }
              as: StoreManager
              captures: { p_chz: $.data.id }
          trigger:
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-1"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_chz}", quantity: 1, customized: false }
                  - { product_id: "${p_chz}", quantity: 1, customized: false }
                  - { product_id: "${p_chz}", quantity: 1, customized: false }
              as: Customer
              as_user_id: "cust-1"
              captures: { ord_id: $.data.id, ord_fee: $.data.portal_fee_cents, ord_total: $.data.total_cents }
          assert:
            - "Order.${ord_id}.subtotal_cents == 1665"
            - "Order.${ord_id}.portal_fee_cents == 84 (28 per line x 3, per-line rounding)"
            - "Order.${ord_id}.total_cents == 1749"
            - "portal_fee_cents != round_half_up(1665 * 0.05) == 83 (sum-then-round is forbidden)"
      - name: made_ahead_target_clamped_then_reservation_subtracted
        grounds:
          - calculations.made_ahead_target
          - entities.Daypart.fields.made_ahead_target
          - entities.Daypart.fields.preorder_reserved_units
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear interaction: made_ahead_target applies
          nested max(0, min(rack_capacity, round(forecast x 0.6)) - reserved).
          With forecast 20 -> raw 12 -> clamped by rack_capacity 10 -> then
          preorder reservation 3 subtracted AFTER the clamp -> target 7; an
          implementation that subtracts before clamping computes
          min(10, 12-3) = 9 and diverges.
        test_recipe:
          setup:
            - "StoreDay 2026-09-13 (PLANNED); DINNER daypart 960-1080, base_demand_units 20, rack_capacity 10, no events (forecast_units_provisional 20)"
            - "PORTAL_PREORDER order for 3 units of PEP, PAID while daypart still PLANNED -> preorder_reserved_units 3"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-13" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "DINNER", window_start_minute: 960, window_end_minute: 1080, rack_capacity: 10, base_demand_units: 20 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_pep: $.data.id }
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-2"
                kind: "PORTAL_PREORDER"
                lines:
                  - { product_id: "${p_pep}", quantity: 3, customized: false }
              as: Customer
              as_user_id: "cust-2"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-2"
          trigger:
            - call: "GET /dayparts/${dp_id}"
              payload: {}
              as: StoreManager
              captures: { dp_target: $.data.made_ahead_target }
          assert:
            - "Daypart.${dp_id}.forecast_units_provisional == 20"
            - "Daypart.${dp_id}.preorder_reserved_units == 3"
            - "Daypart.${dp_id}.made_ahead_target == 7 (min(10, 12) - 3, clamp-before-subtract)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (Order parallel dimensions; LockerSlot
  # cycle) — different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_payment_and_fulfillment_dimensions_evolve_independently
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent state axes on one row: payment_status
          (UNPAID->PAID) and fulfillment_status (PLACED->...). A COUNTER order
          may advance fulfillment to IN_PREPARATION while payment stays UNPAID
          — the dimensions evolve independently; a PORTAL order's fulfillment
          axis is gated BY the payment axis only at start-preparation.
        test_recipe:
          setup:
            - "StoreDay 2026-09-14 opened; LUNCH daypart ACTIVE; product PEP exists"
            - "COUNTER order placed by ShiftLead (walk-in) — no payment"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-14" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T11:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_pep: $.data.id }
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "walk-in-1"
                kind: "COUNTER"
                lines:
                  - { product_id: "${p_pep}", quantity: 1, customized: false }
              as: ShiftLead
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/start-preparation"
              payload: {}
              as: CrewMember
          assert:
            - "Order.${ord_id}.fulfillment_status == IN_PREPARATION"
            - "Order.${ord_id}.payment_status == UNPAID (COUNTER orders may prepare unpaid)"
            - "Order.${ord_id}.portal_fee_cents == 0 (COUNTER kind pays no portal fee)"
      - name: locker_slot_idle_occupied_cleaning_idle_cycle_reusable
        grounds:
          - state_machines.LockerSlot
          - entities.LockerSlot.fields.status
        distinguishing_aspect: |
          LockerSlot is a cyclic machine (IDLE->OCCUPIED->CLEANING->IDLE) on a
          different entity than Order: after a full pickup and the CLEAN_MINUTES
          sweep, the same slot returns to IDLE and can host a SECOND order —
          proving the loop closes and state is reusable.
        test_recipe:
          setup:
            - "StoreDay 2026-09-15 opened; LUNCH daypart ACTIVE at 11:00Z; one locker slot #1; product PEP"
            - "Portal order A paid, prepared, marked ready (slot OCCUPIED, code minted); customer claims (slot CLEANING)"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-15" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/locker-slots"
              payload: { slot_number: 1 }
              as: StoreManager
              captures: { slot_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T11:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_pep: $.data.id }
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-a"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_pep}", quantity: 1, customized: false }
              as: Customer
              as_user_id: "cust-a"
              captures: { ord_a: $.data.id }
            - call: "POST /orders/${ord_a}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-a"
            - call: "POST /orders/${ord_a}/start-preparation"
              payload: {}
              as: CrewMember
            - call: "POST /orders/${ord_a}/mark-ready"
              payload: {}
              as: CrewMember
              captures: { code_a: $.data.pickup_code }
            - call: "POST /orders/${ord_a}/claim"
              payload: { pickup_code: "${code_a}" }
              as: Customer
              as_user_id: "cust-a"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T11:30:00Z" }
              as: StoreManager
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-b"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_pep}", quantity: 1, customized: false }
              as: Customer
              as_user_id: "cust-b"
              captures: { ord_b: $.data.id }
            - call: "POST /orders/${ord_b}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-b"
            - call: "POST /orders/${ord_b}/start-preparation"
              payload: {}
              as: CrewMember
          trigger:
            - call: "POST /orders/${ord_b}/mark-ready"
              payload: {}
              as: CrewMember
              captures: { ord_b_slot: $.data.locker_slot_id }
          assert:
            - "LockerSlot.${slot_id}.status == OCCUPIED (cycle completed IDLE->OCCUPIED->CLEANING->IDLE->OCCUPIED)"
            - "Order.${ord_b}.locker_slot_id == ${slot_id} (same physical slot reused after the cycle)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depth >=3 and >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: preorder_pay_cascade_reservation_target_and_daypart_version
        grounds:
          - state_machines.Order.payment_UNPAID_to_payment_PAID
          - calculations.made_ahead_target
          - entities.Daypart.fields.preorder_reserved_units
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /orders/{id}/pay: pay mutates
          Order.payment_status -> the preorder-reservation side effect mutates
          Daypart.preorder_reserved_units (3 units) -> that mutation itself
          re-derives Daypart.made_ahead_target (12 -> 9). Each hop is caused by
          the previous hop, not by the pay call directly.
        test_recipe:
          setup:
            - "StoreDay 2026-09-16 (PLANNED); DINNER daypart 960-1080, base_demand_units 20, rack_capacity 20 (forecast 20 -> raw target round(20*0.6)=12)"
            - "PORTAL_PREORDER order of 3 units placed (daypart still PLANNED)"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-16" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "DINNER", window_start_minute: 960, window_end_minute: 1080, rack_capacity: 20, base_demand_units: 20 }
              as: StoreManager
              captures: { dp_id: $.data.id, dp_target_before: $.data.made_ahead_target }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_pep: $.data.id }
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-3"
                kind: "PORTAL_PREORDER"
                lines:
                  - { product_id: "${p_pep}", quantity: 3, customized: false }
              as: Customer
              as_user_id: "cust-3"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-3"
            - call: "GET /dayparts/${dp_id}"
              payload: {}
              as: StoreManager
              captures: { dp_reserved: $.data.preorder_reserved_units, dp_target: $.data.made_ahead_target }
          assert:
            - "Order.${ord_id}.payment_status == PAID (hop 1)"
            - "Daypart.${dp_id}.preorder_reserved_units == 3 (hop 2, caused by hop 1)"
            - "Daypart.${dp_id}.made_ahead_target == 9 (hop 3, caused by hop 2: 12 - 3)"
            - "made_ahead_target before pay was 12"
      - name: manual_discard_cascade_waste_breach_and_posture_recompute
        grounds:
          - state_machines.HoldUnit.HOLDING_to_DISCARDED
          - calculations.waste_pct
          - entities.Daypart.fields.posture
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (POST /hold-units/{id}/discard
          vs order pay): discard mutates HoldUnit.status -> that mutation bumps
          StoreDay.discarded_units and recomputes waste_pct_standard to exactly
          5.0 -> the waste recomputation itself flips every active Daypart's
          derived posture NORMAL -> RESTRICTED (inclusive >= boundary).
        test_recipe:
          setup:
            - "StoreDay 2026-09-17 opened; LUNCH daypart ACTIVE at 10:30Z, rack_capacity 30"
            - "Batches ready; production run of 20 units racked -> produced_units 20"
            - "produced 20 means one discard yields waste_pct_standard = 1/20 = 5.0 == WASTE_TARGET_PCT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T08:00:00Z" }
              as: StoreManager
            - call: "POST /store-days"
              payload: { business_date: "2026-09-17" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 30, base_demand_units: 25 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /store-days/${sd_id}/dough-batches"
              payload: { size_units: 25 }
              as: CrewMember
              captures: { db_id: $.data.id }
            - call: "POST /store-days/${sd_id}/cheese-batches"
              payload: { size_units: 25 }
              as: CrewMember
              captures: { cb_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_pep: $.data.id }
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T10:05:00Z" }
              as: StoreManager
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
