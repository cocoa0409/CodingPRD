  # ===========================================================================
  - section: validations
    instances:
      - name: missing_user_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority 1: a call with neither X-User-ID nor X-User-Role fails ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) even on a read endpoint — auth presence precedes role, existence, and state checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /stores"
          assert:
            - "HTTP 400 with error_id ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "response_type == error in the envelope"

      - name: wrong_role_forbidden_precedes_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=5]"]
        distinguishing_aspect: "Priority 2 < 5: LPAnalyst calling POST /stores/{nonexistent}/close gets ERR_FORBIDDEN_FOR_ROLE, not ERR_NOT_FOUND — authorization is evaluated before path existence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stores/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/close"
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (HTTP 403), not ERR_NOT_FOUND"

      - name: not_found_beats_state_on_adjudicate
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]"]
        distinguishing_aspect: "Priority 5 < 6: adjudicating a nonexistent case id returns ERR_NOT_FOUND rather than ERR_INVALID_STATE_TRANSITION — path existence precedes state-machine checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/adjudicate"
              payload: { decision: "SUBSTANTIATED", restitution_waived: true }
              as: LPManager
              as_user_id: mgr-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (HTTP 404)"

      - name: state_beats_occ_on_demand_create
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=8]", "concurrency_rules[demand-create-stale-case]"]
        distinguishing_aspect: "Priority 7 < 8: drafting a demand against an OPEN case (not INTERVIEWED|ADJUDICATING) with a stale expected_case_version fails ERR_INVALID_STATE_TRANSITION — the state gate fires before the OCC version check, so 409 not 412."
        test_recipe:
          setup: ["Store S1; EXTERNAL case CX OPEN (created, never assigned); version captured at creation"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S060", name: "Store 60", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 1000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cx: $.data.id, cx_v0: $.data.version }
            - call: "POST /cases/${cx}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
          trigger:
            - call: "POST /civil-demands"
              payload: { case_id: "${cx}", basis: "ACTUAL_LOSS", expected_case_version: "${cx_v0}" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (HTTP 409)  # not ERR_STALE_CASE_VERSION — case INVESTIGATING is not INTERVIEWED|ADJUDICATING and version staleness is not reached"

