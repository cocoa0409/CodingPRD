  # =========================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Fresh DB. One project (created with auth) whose id is read anonymously."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner AU", email: "oau@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "43 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /projects/${pid}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: client_cannot_create_line_item_returns_unauthorized
        claim_type: authorization
        grounds: ["validations[priority=2]", roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Client calling POST /line-items (a DesignConsultant-exclusive op) is rejected with ERR_UNAUTHORIZED (403); role check (priority 2) precedes existence and state."
        test_recipe:
          setup: ["Fresh DB. One project owned by the client and one product."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner UZ", email: "ouz@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-HOLLAND", name: "Holland Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0.10, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "44 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 100 }
              as: Client
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

