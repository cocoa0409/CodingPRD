            - "${item_bad_error} == ERR_ASSORTMENT_ITEM_NOT_FOUND with HTTP 404: the month now resolves, so resolution moves to the second FK and stops there even though vendor_id is also bogus"
            - "${vendor_bad_error} == ERR_VENDOR_NOT_FOUND with HTTP 404: only when the first two resolve does the third FK decide the response"
            - "the fourth call returns HTTP 201 with ${good_id} set, commit_status PROPOSED, fulfillment_status AWAITING_SHIP, origin BUYER, cost_cents == 1040000 and open_cost_cents == 1040000"
            - "GET /otb/receipt-commitments filtered to plan_month_id ${m1_id} returns total_count == 1: none of the three rejected bodies created a row"
            - "PlanMonth.${m1_id}.otb_open_cents is still 18200000 after all four calls - a PROPOSED commitment does not debit the month, only the accepted create bumps PlanMonth.version to ${m1_v} + 1"

