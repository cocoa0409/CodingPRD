        test_recipe:
          setup:
            - "A VACANT / CLEAR asset in CA-ALAMEDA on a SCHEDULED event; lot version 1 with reserve 20000000, opening 20000000."
            - "A VERIFIED bidder funded 1000000 is standing by."
          setup_api_calls:
