      - name: campaign_family_must_equal_the_lines_family
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=12]
          - errors[ERR_CAMPAIGN_FAMILY_MISMATCH]
          - entities.ProcessingCampaign.fields.chemistry_family
        distinguishing_aspect: "A campaign cannot re-declare a family its line is not plumbed for: IRON_PHOSPHATE on a NICKEL_RICH line returns ERR_CAMPAIGN_FAMILY_MISMATCH, and only after the line is replumbed does the identical body succeed."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus with one NICKEL_RICH hydromet line at 100.0 kg/h and no campaigns."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 100.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "IRON_PHOSPHATE", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-02T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
            - call: "POST /recycling/processing-lines/${line_id}/replumb"
              payload: { chemistry_family: "IRON_PHOSPHATE" }
              as: PlatformAdmin
              captures: { line_family: "$.data.chemistry_family", line_v: "$.data.version" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "IRON_PHOSPHATE", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-02T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id", camp_family: "$.data.chemistry_family" }
          assert:
            - "The first campaign call returns HTTP 422 with data.error_id == ERR_CAMPAIGN_FAMILY_MISMATCH and GET /recycling/campaigns?line_id=${line_id} reports total_count == 0"
            - "The replumb returns HTTP 200 with ${line_family} == IRON_PHOSPHATE and ${line_v} == 2"
            - "The identical campaign body now returns HTTP 201 with ${camp_family} == IRON_PHOSPHATE and status SCHEDULED"
            - "ProcessingCampaign.${camp_id}.line_id == ${line_id} and committed_input_kg == 0.0"

      - name: body_shape_error_precedes_path_and_fk_existence_checks
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The same request that names a non-existent resource AND carries an out-of-range enum returns ERR_INVALID_REQUEST (400), because body shape sits at priority 4 while path existence is 5 and body-FK existence is 6; fixing only the enum flips the answer to the 404."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus and one supplier exist; no intake exists."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/intakes/55555555-5555-4555-8555-555555555555/identify-chemistry"
              payload: { identified_chemistry: "LTO" }
              as: IntakeClerk
            - call: "POST /recycling/intakes/55555555-5555-4555-8555-555555555555/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "66666666-6666-4666-8666-666666666666", facility_id: "${fac_id}", declared_chemistry: "LTO", gross_mass_kg: 110.0, packaging_tare_kg: 10.0 }
              as: IntakeClerk
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "66666666-6666-4666-8666-666666666666", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0 }
              as: IntakeClerk
          assert:
            - "Call 1 returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST - the bad enum (priority 4) wins over the unknown path resource (priority 5)"
            - "Call 2, identical except for a legal enum, returns HTTP 404 with data.error_id == ERR_INTAKE_NOT_FOUND"
            - "Call 3 returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST - the bad enum (priority 4) wins over the unresolvable body FK (priority 6)"
            - "Call 4, identical except for a legal enum, returns HTTP 404 with data.error_id == ERR_SUPPLIER_NOT_FOUND"
            - "GET /recycling/intakes reports total_count == 0 and Supplier.${sup_id}.version == 1 after all four calls"

      - name: campaign_start_at_window_end_returns_campaign_window_closed
        claim_type: temporal_validation
        grounds:
          - state_machines.ProcessingCampaign.SCHEDULED_to_RUNNING
          - errors[ERR_CAMPAIGN_WINDOW_CLOSED]
          - validations[priority=10]
        distinguishing_aspect: "The start gate is clock_now < window_end, strictly: at 2026-08-01T23:59:59.999Z a campaign starts, and one millisecond later - exactly at window_end - an identical campaign on a second line is refused with ERR_CAMPAIGN_WINDOW_CLOSED, so the operation is legal now and illegal later without any data change."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus; two AVAILABLE NICKEL_RICH hydromet lines at 100.0 kg/h; one SCHEDULED campaign on each line over 2026-08-01T00:00:00.000Z..2026-08-02T00:00:00.000Z with planned_input_kg 1000.0."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 100.0 }
              as: PlatformAdmin
              captures: { line1_id: "$.data.id" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-2", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 100.0 }
              as: PlatformAdmin
              captures: { line2_id: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line1_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-02T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp1_id: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line2_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-02T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp2_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:59:59.999Z" }
              as: PlatformAdmin
            - call: "POST /recycling/campaigns/${camp1_id}/start"
              payload: {}
              as: PlantOperator
              captures: { st1: "$.data.status", v1: "$.data.version" }
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/campaigns/${camp2_id}/start"
              payload: {}
              as: PlantOperator
          assert:
            - "The first start returns HTTP 200 with ${st1} == RUNNING and ${v1} == 2 - one millisecond before window_end is still inside the window"
            - "The second start returns HTTP 422 with data.error_id == ERR_CAMPAIGN_WINDOW_CLOSED because clock_now == window_end fails the strict clock_now < window_end gate"
            - "ProcessingCampaign.${camp2_id}.status == SCHEDULED with version == 1 - the refused start left it untouched"
            - "ProcessingLine.${line2_id}.status == AVAILABLE, so the rejection is temporal and not ERR_LINE_NOT_AVAILABLE"

      - name: finalize_checks_output_existence_before_computing_the_mass_balance
        claim_type: cascading_validation
        grounds:
          - state_machines.RecoveryLot.CHARGED_to_FINALIZED
          - errors[ERR_NO_RECOVERY_OUTPUTS]
          - calculations.lot_mass_balance
          - validations[priority=11]
        distinguishing_aspect: "residue_mass_kg 97.0 on a 100.0 kg lot would satisfy the 97.00 mass-balance floor on its own, yet the finalize is still refused with ERR_NO_RECOVERY_OUTPUTS: the existence check must run before the balance is computed, and once a 30.000 kg nickel line exists the same floor is met with residue 67.0."
        test_recipe:
