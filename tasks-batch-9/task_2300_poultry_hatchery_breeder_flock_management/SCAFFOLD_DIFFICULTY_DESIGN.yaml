            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f2}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-25T00:00:00Z"}, as: Veterinarian, captures: {t2: "$.data.id"}}
            - {call: "POST /lab-tests/${t2}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f2}/start-lay", payload: {}, as: FlockManager}
          assert:
