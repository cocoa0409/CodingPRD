# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2706_professional_engineering_licensure_comity
# Every rule_id below is verbatim from SKILL.md §0.5; §0.5 is authoritative for
# each rule's full text, minimum instance count and differentiation clause.
# Logical clock default: 2026-08-01T00:00:00Z (see §1.5 POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: experience_credit_provisional_36_vs_verified_final_18
        grounds:
          - calculations.experience_credit_evaluation
          - entities.Application.fields.provisional_experience_months
          - entities.Application.fields.verified_experience_months
          - entities.ExperienceRecord.fields.credited_months
          - state_machines.Reference.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          The SAME ExperienceRecord row (PROGRESSIVE, post-degree, 2019-01..2022-12) yields
          provisional_experience_months 36 under variant provisional_self_reported (weight 1.00 for every
          record) and verified_experience_months 18 under variant verified_final (weight 0.50 because the
          single ACCEPTED reference has relationship PROJECT_MANAGER, not DIRECT_SUPERVISOR) — a delta of
          18 whole months produced purely by the variant's weighting rule, on the licensure-application
          time ledger.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default (never moved)."
            - "Engineer 'Ada Vela' (the applicant) and Engineer 'Rex Mora' (the project manager) exist; Rex holds an ACTIVE STANDARD licence."
            - "Ada has a STANDARD_EXAM application, EABET_ACCREDITED education, and exactly one ExperienceRecord: PROGRESSIVE, post_degree true, 2019-01..2022-12 (48 raw months)."
            - "The record's single Reference has relationship PROJECT_MANAGER and has been ACCEPTED by the board; the application is UNDER_REVIEW."
            - "Assessment is 25000 + 1*2500 = 27500 cents and has been paid in full."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Ada Vela", email: "ada.vela@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_ada: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Rex Mora", email: "rex.mora@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_rex: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_rex}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_rex: $.data.id }
            - call: "POST /applications"
              payload: { engineer_id: "${eng_ada}", pathway: "STANDARD_EXAM", exam_code: "PE_CIVIL", degree_level: "BS", expedite_requested: false }
              as: Applicant
              as_user_id: "${eng_ada}"
              captures: { app_ada: $.data.id }
            - call: "POST /applications/${app_ada}/education-evaluation"
              payload: { degree_level: "BS", accreditation_finding: "EABET_ACCREDITED" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_ada}/experience-records"
              payload: { employer_name: "Cascade Structures", position_title: "Project Engineer", period_start_month: "2019-01", period_end_month: "2022-12", responsibility_level: "PROGRESSIVE", post_degree: true }
              as: Applicant
              as_user_id: "${eng_ada}"
              captures: { er_ada: $.data.id }
            - call: "POST /experience-records/${er_ada}/references"
              payload: { referee_engineer_id: "${eng_rex}", relationship: "PROJECT_MANAGER" }
              as: Applicant
              as_user_id: "${eng_ada}"
              captures: { ref_ada: $.data.id }
            - call: "POST /applications/${app_ada}/payments"
              payload: { amount_cents: 27500 }
              as: Applicant
              as_user_id: "${eng_ada}"
            - call: "POST /applications/${app_ada}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${eng_ada}"
            - call: "POST /applications/${app_ada}/start-review"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /references/${ref_ada}/submit"
              payload: { evaluation_score: 4, months_confirmed: 48, responsibility_confirmed: true }
              as: SupervisingEngineer
              as_user_id: "${eng_rex}"
            - call: "POST /references/${ref_ada}/evaluate"
              payload: { decision: "ACCEPT" }
              as: BoardReviewer
              as_user_id: "REV-1"
          trigger:
            - call: "POST /applications/${app_ada}/credit-determination"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-1"
              captures: { app_ada_ver: $.data.version }
          assert:
            - "Application.${app_ada}.provisional_experience_months == 36"
            - "Application.${app_ada}.verified_experience_months == 18"
            - "ExperienceRecord.${er_ada}.raw_months == 48"
            - "ExperienceRecord.${er_ada}.credit_multiplier == 0.75"
            - "ExperienceRecord.${er_ada}.credited_months == 18"
            - "Application.${app_ada}.provisional_experience_months - Application.${app_ada}.verified_experience_months == 18"
            - "Application.${app_ada}.credit_determined_by_user_id == \"REV-1\""
            - "Application.${app_ada}.status == UNDER_REVIEW"

      - name: cpc_pdh_self_certified_30_vs_audit_verified_14
        grounds:
          - calculations.cpc_pdh_valuation
          - entities.CPCReport.fields.self_certified_total_pdh
          - entities.CPCReport.fields.audit_verified_total_pdh
          - entities.CPCReport.fields.shortfall_pdh
          - entities.PDHRecord.fields.documentation_status
          - state_machines.CPCReport.UNDER_AUDIT_to_AUDIT_DEFICIENT
          - concurrency_rules[cpc-report-create-stale-license]
        distinguishing_aspect: |
          Different entity domain from experience_credit_evaluation (continuing-competency hours, not the
          experience ledger) and a different divergence mechanism: variant self_certified admits
          documentation_status IN {NONE, ACCEPTED} and caps SELF_STUDY at 8, giving 30.0, while variant
          audit_verified admits only documentation_status == ACCEPTED and caps SELF_STUDY at 0, giving
          14.0 — and the ethics floor turns additive under audit because the ethics-flagged TEACHING hours
          leave the included set, so shortfall_pdh is 16 + 2 = 18.0, not 16.0.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Iris Kwan' holds an ACTIVE STANDARD licence issued 2026-01-15 with pdh_requirement 30, so its biennium ends 2028-01-15T00:00:00Z."
            - "One CPCReport for period 2026-01-15..2028-01-15 with self_certified_pdh 30 and four PDHRecords: COURSE 14.0, SELF_STUDY 8.0, SEMINAR 6.0, TEACHING 2.0 (ethics_flag true)."
            - "Only the COURSE record has documentation_status ACCEPTED; the other three remain NONE."
            - "The report has been ACCEPTED and then drawn into audit cycle 'CPC-2028-A' (sample_pct 0.10, pool_size 1, sampled_count 1) created by user AUD-1, so the report is UNDER_AUDIT."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Iris Kwan", email: "iris.kwan@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_iris: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_iris}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z", pdh_requirement: 30 }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_iris: $.data.id, lic_iris_ver: $.data.version }
            - call: "POST /cpc-reports"
              payload: { license_id: "${lic_iris}", period_start: "2026-01-15T00:00:00Z", period_end: "2028-01-15T00:00:00Z", self_certified_pdh: 30, carryover_pdh_claimed: 0, expected_license_version: "${lic_iris_ver}" }
              as: Licensee
              as_user_id: "${eng_iris}"
              captures: { rep_iris: $.data.id }
            - call: "POST /cpc-reports/${rep_iris}/pdh-records"
              payload: { activity_type: "COURSE", pdh_hours: 14.0, completed_on: "2026-02-10T00:00:00Z", ethics_flag: false }
              as: Licensee
              as_user_id: "${eng_iris}"
              captures: { pdh_course: $.data.id }
            - call: "POST /cpc-reports/${rep_iris}/pdh-records"
              payload: { activity_type: "SELF_STUDY", pdh_hours: 8.0, completed_on: "2026-03-15T00:00:00Z", ethics_flag: false }
              as: Licensee
              as_user_id: "${eng_iris}"
            - call: "POST /cpc-reports/${rep_iris}/pdh-records"
              payload: { activity_type: "SEMINAR", pdh_hours: 6.0, completed_on: "2026-04-20T00:00:00Z", ethics_flag: false }
              as: Licensee
              as_user_id: "${eng_iris}"
            - call: "POST /cpc-reports/${rep_iris}/pdh-records"
              payload: { activity_type: "TEACHING", pdh_hours: 2.0, completed_on: "2026-05-05T00:00:00Z", ethics_flag: true }
              as: Licensee
              as_user_id: "${eng_iris}"
            - call: "POST /pdh-records/${pdh_course}/documentation-review"
              payload: { decision: "ACCEPT" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /cpc-reports/${rep_iris}/accept"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /cpc-audits"
              payload: { audit_cycle_label: "CPC-2028-A", sample_pct: 0.10, as_of_period_end: "2028-01-15T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "AUD-1"
              captures: { audit_a: $.data.id }
          trigger:
            - call: "POST /cpc-reports/${rep_iris}/audit-decision"
              payload: { decision: "DEFICIENT" }
              as: BoardReviewer
              as_user_id: "REV-1"
          assert:
            - "CPCReport.${rep_iris}.self_certified_total_pdh == 30.0"
            - "CPCReport.${rep_iris}.audit_verified_total_pdh == 14.0"
            - "CPCReport.${rep_iris}.shortfall_pdh == 18.0"
            - "CPCReport.${rep_iris}.status == AUDIT_DEFICIENT"
            - "CPCReport.${rep_iris}.audit_id == ${audit_a}"
            - "CPCReport.${rep_iris}.audit_decided_by_user_id == \"REV-1\""
            - "CPCAudit.${audit_a}.pool_size == 1"
            - "CPCAudit.${audit_a}.sampled_count == 1"
            - "CPCAudit.${audit_a}.status == CLOSED"
            - "License.${lic_iris}.discipline_flag == true"

  - rule_id: combinatorial_formula
    instances:
      - name: civil_penalty_round_per_sheet_then_multiply_391062
        grounds:
          - calculations.civil_penalty_assessment
          - entities.Case.fields.penalty_factor
          - entities.Case.fields.assessed_penalty_cents
          - entities.PlanSubmission.fields.sheet_count
          - state_machines.Case.investigation_status.INVESTIGATING_to_PROBABLE_CAUSE
        distinguishing_aspect: |
          Order-of-operations mode: the per-sheet stamping component MUST round the per-sheet amount
          first and multiply afterwards — round_half_up(1725 * 0.85) = 1466 then 1466 * 7 = 10262 — where
          the multiply-then-round reading gives round_half_up(1725 * 0.85 * 7) = 10264. Two cents of
          divergence on the stamping component alone, and the statutory cap is applied only to the sum of
          the three independently rounded components.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Owen Sato' holds an ACTIVE STANDARD licence issued 2026-01-15."
            - "FirmRegistration 'Overlook Engineering PC' is ACTIVE with Owen's licence in responsible charge."
            - "PlanSubmission 'Bridge 14 Retrofit' has sheet_count 7, has been SEALED with Owen's licence and then FLAGGED by the investigator."
            - "A PLAN_STAMPING Case names Owen's licence as respondent and the flagged plan set as subject; it is INVESTIGATING."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Owen Sato", email: "owen.sato@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_owen: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_owen}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_owen: $.data.id }
            - call: "POST /firm-registrations"
              payload: { firm_name: "Overlook Engineering PC", state_code: "OR", responsible_charge_license_id: "${lic_owen}" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { firm_ov: $.data.id }
            - call: "POST /plan-submissions"
              payload: { firm_registration_id: "${firm_ov}", project_name: "Bridge 14 Retrofit", sheet_count: 7 }
              as: FirmAdmin
              as_user_id: "${firm_ov}"
              captures: { ps_bridge: $.data.id }
            - call: "POST /plan-submissions/${ps_bridge}/seal"
              payload: { sealing_license_id: "${lic_owen}", responsible_charge_attested: true }
              as: Licensee
              as_user_id: "${eng_owen}"
            - call: "POST /plan-submissions/${ps_bridge}/flag"
              payload: { reason: "Seal applied without responsible charge over sheets 3-7" }
              as: BoardInvestigator
              as_user_id: "INV-1"
            - call: "POST /cases"
              payload: { allegation_type: "PLAN_STAMPING", complainant_name: "City of Ashford", received_on: "2026-08-01T00:00:00Z", respondent_license_id: "${lic_owen}", subject_plan_submission_id: "${ps_bridge}" }
              as: BoardInvestigator
              as_user_id: "INV-1"
              captures: { case_ps: $.data.id }
            - call: "POST /cases/${case_ps}/open-investigation"
              payload: {}
              as: BoardInvestigator
              as_user_id: "INV-1"
          trigger:
            - call: "POST /cases/${case_ps}/finding"
              payload: { finding: "PROBABLE_CAUSE", aggravating_factor_count: 0, mitigating_factor_count: 1, violation_count: 2 }
              as: BoardInvestigator
              as_user_id: "INV-1"
          assert:
            - "Case.${case_ps}.penalty_factor == 0.85"
            - "Case.${case_ps}.assessed_penalty_cents == 391062"
            - "Case.${case_ps}.investigation_status == PROBABLE_CAUSE"
            - "Case.${case_ps}.sanction_status == NONE"
            - "Case.${case_ps}.assessed_penalty_cents != 391064"

      - name: comity_fee_tier_keyed_on_pre_credit_total_47642
        grounds:
          - calculations.application_fee_assessment
          - entities.Application.fields.fee_assessment_cents
          - entities.Application.fields.ncees_record_status
          - entities.Application.fields.expedite_requested
        distinguishing_aspect: |
          Evaluation-order mode on a different formula and a different entity than the penalty instance:
          the comity credit tier is selected from pre_credit_total_cents (56050 -> 0.15) even though the
          value the client ultimately pays is the post-credit total. Keying the tier off the subtotal
          before the expedite surcharge (47500 -> 0.10) yields 50445 instead of 47642, so the eight
          intermediate fields pin one and only one admissible order.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Nils Bergen' carries ncees_record_id NC-77120."
            - "Nils has a COMITY application for PE_MECHANICAL, degree_level MS, expedite_requested true."
            - "The national records program has posted a MATCHED packet (9 years licensed, exam passed, record expires 2027-06-30)."
            - "Exactly one ExperienceRecord is attached (2016-01..2021-12, RESPONSIBLE_CHARGE, post-degree)."
            - "So base 37500 + records 2500 + NCEES 7500 = subtotal 47500; expedite 8550; pre-credit 56050."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Nils Bergen", email: "nils.bergen@pe.test", home_jurisdiction: "WA", ncees_record_id: "NC-77120" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_nils: $.data.id }
            - call: "POST /applications"
              payload: { engineer_id: "${eng_nils}", pathway: "COMITY", exam_code: "PE_MECHANICAL", degree_level: "MS", expedite_requested: true }
              as: Applicant
              as_user_id: "${eng_nils}"
              captures: { app_nils: $.data.id }
            - call: "POST /applications/${app_nils}/education-evaluation"
              payload: { degree_level: "MS", accreditation_finding: "EABET_ACCREDITED" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_nils}/ncees-verification"
              payload: { ncees_record_id: "NC-77120", source_jurisdiction: "WA", verified_exam_pass: true, verified_years_licensed: 9, disciplinary_history_count: 0, record_expires_on: "2027-06-30T00:00:00Z" }
              as: TestingService
              as_user_id: "NCEES-1"
            - call: "POST /applications/${app_nils}/experience-records"
              payload: { employer_name: "Puget Mechanical", position_title: "Principal Engineer", period_start_month: "2016-01", period_end_month: "2021-12", responsibility_level: "RESPONSIBLE_CHARGE", post_degree: true }
              as: Applicant
              as_user_id: "${eng_nils}"
              captures: { er_nils: $.data.id }
          trigger:
            - call: "GET /applications/${app_nils}/fee-assessment"
              payload: {}
              as: Applicant
              as_user_id: "${eng_nils}"
              captures: { nils_total: $.data.assessment_total_cents }
          assert:
            - "response.data.base_fee_cents == 37500"
            - "response.data.records_verification_fee_cents == 2500"
            - "response.data.ncees_record_fee_cents == 7500"
            - "response.data.expedite_surcharge_cents == 8550"
            - "response.data.pre_credit_total_cents == 56050"
            - "response.data.comity_credit_tier_pct == 0.15"
            - "response.data.comity_credit_cents == 8408"
            - "response.data.assessment_total_cents == 47642"
            - "Application.${app_nils}.fee_assessment_cents == 47642"
            - "Application.${app_nils}.ncees_record_status == MATCHED"
            - "response.data.assessment_total_cents != 50445"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_deficiency_cycle_capped_at_three_fourth_rejected
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_DEFICIENT
          - state_machines.Application.DEFICIENT_to_UNDER_REVIEW
          - entities.Application.fields.deficiency_cycle_count
          - validations[priority=25]
          - errors[ERR_DEFICIENCY_LIMIT_REACHED]
        distinguishing_aspect: |
          Cyclic shape: the file re-enters UNDER_REVIEW three separate times through
          UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW, and the loop is bounded by a counter rather than by
          the state itself, so the FOURTH deficiency notice is refused with ERR_DEFICIENCY_LIMIT_REACHED
          while the application remains in the very state the transition departs from.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default, so every deficiency_due_at is 2026-08-31T00:00:00Z and every response lands inside the window."
            - "Engineer 'Dara Vos' has a STANDARD_EXAM application, EABET_ACCREDITED education, one ExperienceRecord, a fully paid 27500-cent assessment, and is UNDER_REVIEW."
            - "Three complete UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW cycles have already been run, leaving deficiency_cycle_count 3 and status UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dara Vos", email: "dara.vos@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_dara: $.data.id }
            - call: "POST /applications"
              payload: { engineer_id: "${eng_dara}", pathway: "STANDARD_EXAM", exam_code: "PE_ELECTRICAL", degree_level: "BS", expedite_requested: false }
              as: Applicant
              as_user_id: "${eng_dara}"
              captures: { app_dara: $.data.id }
            - call: "POST /applications/${app_dara}/education-evaluation"
              payload: { degree_level: "BS", accreditation_finding: "EABET_ACCREDITED" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_dara}/experience-records"
              payload: { employer_name: "Willamette Power", position_title: "Design Engineer", period_start_month: "2019-01", period_end_month: "2022-12", responsibility_level: "RESPONSIBLE_CHARGE", post_degree: true }
              as: Applicant
              as_user_id: "${eng_dara}"
            - call: "POST /applications/${app_dara}/payments"
              payload: { amount_cents: 27500 }
              as: Applicant
              as_user_id: "${eng_dara}"
            - call: "POST /applications/${app_dara}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${eng_dara}"
            - call: "POST /applications/${app_dara}/start-review"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_dara}/deficiency"
              payload: { deficiency_reason: "Transcript legend missing" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_dara}/respond-deficiency"
              payload: { response_note: "Legend attached" }
              as: Applicant
              as_user_id: "${eng_dara}"
            - call: "POST /applications/${app_dara}/deficiency"
              payload: { deficiency_reason: "Reference contact details unreadable" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_dara}/respond-deficiency"
              payload: { response_note: "Contact details retyped" }
              as: Applicant
              as_user_id: "${eng_dara}"
            - call: "POST /applications/${app_dara}/deficiency"
              payload: { deficiency_reason: "Employer letterhead not verifiable" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_dara}/respond-deficiency"
              payload: { response_note: "Notarised letterhead supplied" }
              as: Applicant
              as_user_id: "${eng_dara}"
          trigger:
            - call: "POST /applications/${app_dara}/deficiency"
              payload: { deficiency_reason: "Fourth attempt at a deficiency notice" }
              as: BoardReviewer
              as_user_id: "REV-1"
              captures: { def4_error: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == \"ERR_DEFICIENCY_LIMIT_REACHED\""
            - "response.success == false"
            - "Application.${app_dara}.status == UNDER_REVIEW"
            - "Application.${app_dara}.deficiency_cycle_count == 3"
            - "Application.${app_dara}.deficiency_reason == null"
            - "Application.${app_dara}.deficiency_due_at == null"

      - name: case_parallel_axes_sanction_moves_while_investigation_holds
        grounds:
          - state_machines.Case.investigation_status.INVESTIGATING_to_PROBABLE_CAUSE
          - state_machines.Case.investigation_status.PROBABLE_CAUSE_to_CLOSED
          - state_machines.Case.sanction_status.PROPOSED_to_HEARING_REFERRED
          - state_machines.ConsentOrder.PROPOSED_to_SUPERSEDED
          - entities.Case.fields.investigation_status
          - entities.Case.fields.sanction_status
          - validations[priority=42]
        distinguishing_aspect: |
          Parallel shape rather than cyclic: Case carries two independent state dimensions, and
          POST /cases/{case_id}/refer-hearing advances only the sanction axis
          (PROPOSED -> HEARING_REFERRED) while investigation_status stays PROBABLE_CAUSE; the combined
          state is what unlocks the close, so the join condition is a predicate over BOTH axes rather
          than a single current state.
        test_recipe:
          setup:
