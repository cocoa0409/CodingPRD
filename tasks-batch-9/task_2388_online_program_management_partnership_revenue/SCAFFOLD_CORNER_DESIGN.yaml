      - name: course_approval_with_partner_ownership_and_no_grant_back_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 28 ERR_FACULTY_IP_OWNERSHIP_VIOLATION]
          - state_machines.Course.FACULTY_REVIEW_to_APPROVED
        distinguishing_aspect: "Faculty ownership of academic content is enforced at APPROVE, not at creation: a PARTNER-owned course with ip_license_grant_back false reaches FACULTY_REVIEW and is then blocked, while the same course with grant-back true would pass."
        test_recipe:
          setup:
            - "DRAFT Program with course MBA-590 whose content_owner is PARTNER and ip_license_grant_back is false, already submitted for faculty review."
          setup_api_calls:
