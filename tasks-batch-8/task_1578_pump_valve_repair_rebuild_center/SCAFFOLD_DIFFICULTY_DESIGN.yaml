  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_order_test_fail_rework_cycle
        grounds:
          - state_machines.RepairOrder.IN_TEST_to_IN_REPAIR
          - state_machines.RepairOrder.IN_REPAIR_to_IN_TEST
          - entities.RepairOrder.fields.repair_round
          - entities.RepairOrder.fields.repair_outcome
        distinguishing_aspect: |
          RepairOrder is cyclic: IN_REPAIR -> IN_TEST -> (FAIL) -> IN_REPAIR ->
          IN_TEST -> (PASS) -> COMPLETE, with repair_round counting the loop and
          repair_outcome RE_REPAIR at close — a true cycle on a different entity
          than the Quote negotiation fork.
        test_recipe:
          setup:
            - "Customer, PUMP asset (API_610_PER_POINT), window capacity 1000"
            - "RO approved and in IN_TEST"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Gulf Coast Utilities", account_number: "GC-500", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-5001", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500, test_standard: "API_610_PER_POINT" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "CAVITATION", failure_description: "noise", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "impeller pitted", recommended_action: "REPAIR", estimated_labor_hours: 4, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 4, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /repair-orders/${ro}/start-repair", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro}/submit-for-test", payload: {}, as: Technician }
          trigger:
            - { call: "POST /repair-orders/${ro}/test-runs", payload: { test_type: "PERFORMANCE_CURVE", measured_points: [ { duty_pct: 100, measured_value: 110, reference_value: 100 } ] }, as: Technician, captures: { t1_verdict: $.data.verdict } }
            - { call: "POST /repair-orders/${ro}/submit-for-test", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro}/test-runs", payload: { test_type: "PERFORMANCE_CURVE", measured_points: [ { duty_pct: 100, measured_value: 105, reference_value: 100 } ] }, as: Technician, captures: { t2_verdict: $.data.verdict } }
            - { call: "POST /repair-orders/${ro}/close", payload: {}, as: IntakeCoordinator, captures: { ro_outcome: $.data.repair_outcome, ro_round: $.data.repair_round } }
          assert:
            - "first TestRun verdict == FAIL and RepairOrder.${ro} transitioned IN_TEST -> IN_REPAIR with repair_round == 1"
            - "second TestRun verdict == PASS (5.00 <= 5.0 inclusive) and RepairOrder.${ro}.status == COMPLETE"
            - "RepairOrder.${ro}.repair_round == 1 at close"
            - "RepairOrder.${ro}.repair_outcome == RE_REPAIR"
            - "RepairOrder.${ro}.status == CLOSED"

      - name: quote_negotiation_fork_divergent_side_effects
        grounds:
          - state_machines.Quote.ISSUED_to_REVISION_REQUESTED
          - state_machines.Quote.DRAFT_to_SUPERSEDED
          - state_machines.Quote.ISSUED_to_APPROVED
          - state_machines.Quote.ISSUED_to_DECLINED
        distinguishing_aspect: |
          Quote ISSUED forks: APPROVED cascades (RO AUTHORIZED, window reservation),
          DECLINED cascades (RO CANCELLED), REVISION_REQUESTED + new revision
          SUPERSEDES the old quote with no RO change — divergent side-effect sets
          per branch, on a different entity than the RepairOrder rework cycle.
        test_recipe:
          setup:
            - "Customer, two GENERAL_VALVE assets, window capacity 1000"
            - "RO1 has quote q1 ISSUED then REVISION_REQUESTED; q2 created (revision 2, supersedes q1), issued"
            - "RO2 has quote q3 ISSUED"
