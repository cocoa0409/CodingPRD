  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_depth3_cascade
        grounds:
          - state_machines.PackageOrder.any_build_status_NOT_IN_{COMMISSIONED,_CANCELLED}_to_build_status=CANCELLED
          - state_machines.PackageConfiguration.LOCKED_to_CANCELLED
          - state_machines.PermitCase.SUBMITTED_to_WITHDRAWN
          - state_machines.EmissionsCertificate.SUBMITTED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chain from POST /orders/{id}/cancel: order cancel CANCELS the
          LOCKED configuration (hop 1); that cancellation WITHDRAWS the
