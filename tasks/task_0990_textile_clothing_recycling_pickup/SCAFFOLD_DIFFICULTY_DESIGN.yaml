        distinguishing_aspect: |
          Trigger = POST /weight-tickets/{id}/void (different trigger from the
          adjudication cascade): operator void releases downstream state —
          ticket VOIDED (L1) voids the FINALIZED credit (L2) which releases the
          fund hold (L3); the source pickup stays WEIGHED (no bubble revert).
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; pickup collected, certified 12.5 kg RESALE (ticket T)"
            - "Fund F (100000); credit C on T is FINALIZED with hold 1650 (available 98350)"
          setup_api_calls:
