        grounds:
          - endpoints."POST /records/requests/{id}/denial-letters"
          - entities.DenialLetter.fields.statutory_citations
          - entities.DenialLetter.fields.appeal_authority
          - entities.DenialLetter.fields.withheld_record_count
          - state_machines.PublicRecordsRequest.processing_status.EXEMPTION_REVIEW_to_DENIED
        distinguishing_aspect: |
          Three SUSTAINED claims carrying two distinct citations produce a two-element
          citation array in ascending string order, so the letter proves the derivation
          deduplicates rather than simply listing every sustained claim.
        test_recipe:
          setup:
            - "Two ROUTINE recordings of INC-2026-0652 (60 and 30 minutes) are both ruled RESPONSIVE on one GENERAL_PUBLIC request."
            - "Counsel A asserts three claims and counsel B sustains all three: on record A a PERSONAL_PRIVACY PARTIAL_REDACT and an ONGOING_INVESTIGATION FULL_WITHHOLD, on record B an ONGOING_INVESTIGATION FULL_WITHHOLD."
            - "Both records therefore end WITHHELD_IN_FULL with release_posture BLOCKED, no claim remains ASSERTED and no RedactionTask was ever opened, so the request is still in EXEMPTION_REVIEW."
            - "The clock stays at 2026-08-01T00:00:00Z, so the appeal window closes 30 days later at 2026-08-31T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/staff", payload: { full_name: "Counsel A", role_type: "COUNSEL", redaction_certification_level: 3 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { counsel_a_id: $.data.id } }
