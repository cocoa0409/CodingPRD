  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: isp_create_with_stale_individual_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[isp-create-stale-individual]", "errors[ERR_STALE_VERSION]", entities.Individual.fields.version]
        distinguishing_aspect: "OCC on Individual.version: a second ISP create carrying the pre-first-create version (2 when the individual is now at 3) is rejected 412; the same create with the fresh version succeeds and SUPERSEDES the first DRAFT (create-with-supersede semantics)."
        test_recipe:
          setup: ["Individual ENROLLED (version 2 after enroll); ISP1 created with expected_individual_version 2 (individual now at version 3); clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id, ind_v0: $.data.version } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp1_id: $.data.id } }
            - { call: "GET /individuals/${ind_id}", payload: {}, as: Any, captures: { ind_v2: $.data.version } }
          trigger:
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-06-01", plan_year_end: "2027-05-31", goals_summary: "Rival draft plan from stale client", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { err: $.data.error_id } }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-06-01", plan_year_end: "2027-05-31", goals_summary: "Rival draft plan from fresh client", expected_individual_version: "${ind_v2}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp2_id: $.data.id } }
            - { call: "GET /isps/${isp1_id}", payload: {}, as: Any, captures: { isp1_st: $.data.status } }
          assert:
            - "stale create (expected version 2 against current 3) -> ERR_STALE_VERSION with http 412"
            - "fresh create (expected version 3) -> 201"
            - "ISP1 status == SUPERSEDED (the successful second draft superseded the first)"

      - name: isp_amend_with_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[isp-amend-stale-isp]", "errors[ERR_STALE_VERSION]", entities.ISP.fields.version]
        distinguishing_aspect: "OCC on ISP.version for the amend endpoint: an amend carrying the pre-activation version (3) against the current version (4) is rejected 412; the amend with the fresh version succeeds and increments amendment_count."
        test_recipe:
          setup: ["Individual ENROLLED; ISP fully ACTIVE (create v1, submit v2, approve v3 captured, activate v4); clock 2026-06-01"]
