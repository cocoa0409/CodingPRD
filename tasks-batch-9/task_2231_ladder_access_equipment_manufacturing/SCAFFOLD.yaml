      - "status PLANNED -> IN_PROGRESS; sets started_at = logical clock"
      - "the named BenchReservation moves HELD -> CONSUMED (TestBench.reserved_minutes_total is unchanged)"
    errors: [ERR_TEST_CAMPAIGN_NOT_FOUND, ERR_BENCH_RESERVATION_NOT_FOUND, ERR_CAMPAIGN_STATE_INVALID, ERR_RESERVATION_NOT_HELD, ERR_BENCH_CAPACITY_INSUFFICIENT]

  - method: POST
    path: /ladder-ops/test-campaigns/{id}/load-tests
