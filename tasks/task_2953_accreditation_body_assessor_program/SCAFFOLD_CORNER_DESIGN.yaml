              payload: { assessor_id: "${lead_id}", activity_type: "CALIBRATION", site_ref: "NORTHLIGHT-LAB-1", delivery_mode: "ON_SITE", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T16:00:00Z" }
              as: AssessmentManager
