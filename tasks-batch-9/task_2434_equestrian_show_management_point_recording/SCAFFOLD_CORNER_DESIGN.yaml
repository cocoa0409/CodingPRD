  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_ring_version_blocks_slot_booking
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.slot-create-stale-ring
          - endpoints.POST_/ring-slots
          - validations.priority_8
        distinguishing_aspect: |
          The declared OCC rule guards RingSlot creation with the PARENT Ring's version,
          so two ring masters working from the same read cannot both book: the first
          booking bumps Ring.version, and the second, replaying the version it read
          before, must get ERR_STALE_VERSION 412 even though its class, time and ring are
          all perfectly legal. Re-reading and retrying then succeeds. The version must
          advance on every accepted write and stay put on every rejected one.
        test_recipe:
          setup:
            - "APPROVED show with Ring A (turnover_buffer_minutes 10) and classes 101, 102 OPEN with zero entries -> every slot is 20 minutes long."
            - "Ring A is read once, and that single version value is used for both bookings, simulating two ring masters holding the same snapshot."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
