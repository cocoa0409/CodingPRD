scenario: |
  generate task hard than expert level! 1191. Grain Cooperative Patronage & Member Equity Revolvement (farmer-owned grain co-op): member share & patronage allocation by volume, qualified vs nonqualified written notice, equity revolvement schedule & board discretion, estate/retirement equity redemption request, per-unit retain accounting, member voting & delegate structure, unclaimed equity & escheat, tax reporting to patrons

domain_name: grain-cooperative-patronage
api_prefix: /coop

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - scheduled_actions
    - soft_delete

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (13 entities, Expert band)
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: patron_ref, type: string, source: input, description: "External patron reference number; unique per cooperative" }
      - { name: legal_name, type: string, source: input, description: "Member legal name (person or entity)" }
      - { name: member_class, type: enum, source: input, description: "INDIVIDUAL | PARTNERSHIP | CORPORATION | LLC | ESTATE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE | WITHDRAWN | DECEASED | EXPELLED — controls delivery acceptance and voting" }
      - { name: joined_at, type: datetime, source: input, description: "Membership commencement date" }
      - { name: delegate_district_id, type: string, source: input, description: "FK -> DelegateDistrict.id; member's voting district" }
      - { name: is_producer_member, type: boolean, source: input, description: "True for bona fide agricultural producers; only producer-members accrue patronage" }
      - { name: capital_share_balance_cents, type: integer, source: computed, description: "Outstanding common/preferred share capital (separate from patronage equity)" }
      - { name: qualified_equity_cents, type: integer, source: computed, description: "Sum of qualified equity certificates REDEEMABLE + ACTIVE (face minus redeemed)" }
      - { name: nonqualified_equity_cents, type: integer, source: computed, description: "Sum of nonqualified equity certificates REDEEMABLE + ACTIVE (face minus redeemed)" }
      - { name: per_unit_retains_cents, type: integer, source: computed, description: "Cumulative per-unit retains credited to member capital" }
      - { name: total_patronage_volume_bu, type: integer, source: computed, description: "Lifetime bushels delivered as patron-sourced" }

  - name: DelegateDistrict
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "District code, unique (e.g., DIST-01)" }
      - { name: name, type: string, source: input, description: "District display name" }
      - { name: max_delegates, type: integer, source: input, description: "Number of delegates the district elects to the board" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MERGED | RETIRED" }

  - name: Delegate
    parent: DelegateDistrict
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> DelegateDistrict.id; district the delegate represents" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; delegate must be ACTIVE producer-member" }
      - { name: term_start, type: datetime, source: input, description: "Delegate term start (inclusive)" }
      - { name: term_end, type: datetime, source: input, description: "Delegate term end (exclusive)" }
      - { name: is_seated, type: boolean, source: computed, description: "True iff delegate's term covers current clock and member is ACTIVE" }

  - name: FiscalYear
    parent: null
    common_fields: true
    fields:
      - { name: year_code, type: string, source: input, description: "Fiscal year label e.g. FY2026" }
      - { name: start_date, type: datetime, source: input, description: "Fiscal year start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Fiscal year end (exclusive)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_PROVISIONAL | UNDER_AUDIT | CLOSED_FINAL | REOPENED" }
      - { name: net_margin_cents, type: integer, source: input, description: "Co-op net margin for the year (audited)" }
      - { name: patronage_pool_cents, type: integer, source: computed, description: "Portion of net margin allocated to patrons; defaults to net_margin minus retained_reserve_pct" }
      - { name: retained_reserve_pct, type: number, source: input, description: "Board-set reserve ratio 0.0–0.5, applied at close" }
      - { name: qualified_payout_pct, type: number, source: input, description: "Cash portion of qualified allocation; remainder issued as qualified equity" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp of latest close event" }
      - { name: final_audit_locked, type: boolean, source: system, description: "True after CLOSED_FINAL; allocation recalcs forbidden unless REOPENED" }

  - name: GrainDelivery
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; delivering member" }
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id; year of delivery (must be OPEN at booking)" }
      - { name: commodity, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT | SORGHUM | SUNFLOWER" }
      - { name: gross_bushels, type: integer, source: input, description: "Delivered gross bushels (must be > 0)" }
      - { name: dockage_pct, type: number, source: input, description: "Foreign matter / shrink percentage 0.00–0.30" }
      - { name: net_bushels, type: integer, source: computed, description: "floor(gross_bushels * (1 - dockage_pct)) — integer bushels, floor rounding" }
      - { name: is_patron_sourced, type: boolean, source: input, description: "False for non-member business; excluded from patronage pool" }
      - { name: booked_at, type: datetime, source: system, description: "Booking timestamp (logical clock)" }
      - { name: status, type: enum, source: system, description: "BOOKED | SETTLED | CANCELLED" }
      - { name: per_unit_retain_cents, type: integer, source: computed, description: "Per-unit retain in cents: round(net_bushels * retain_rate_cents_per_bu) computed PER-DELIVERY (rounding order pinned)" }

  - name: PatronageAllocation
    parent: FiscalYear
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id; closed year being allocated" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; patron receiving allocation" }
      - { name: allocated_volume_bu, type: integer, source: computed, description: "Member's patron-sourced net_bushels in the year across SETTLED deliveries" }
      - { name: pool_share_ratio, type: number, source: computed, description: "allocated_volume_bu / total_patron_volume_bu (8 decimal places, half-even)" }
      - { name: qualified_allocation_cents, type: integer, source: computed, description: "Cash + qualified equity slice of the patronage pool" }
      - { name: nonqualified_allocation_cents, type: integer, source: computed, description: "Nonqualified slice (equity only, no cash)" }
      - { name: cash_paid_cents, type: integer, source: computed, description: "Cash distribution = round(qualified_allocation_cents * qualified_payout_pct)" }
      - { name: qualified_equity_issued_cents, type: integer, source: computed, description: "qualified_allocation_cents - cash_paid_cents (rounding residual goes to equity)" }
      - { name: tier_code, type: enum, source: computed, description: "T1 | T2 | T3 — volume tier at close; drives rate modifier" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | AMENDED | REVERSED" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL | FINAL — which calculation variant produced this row" }

  - name: EquityCertificate
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; holder of record" }
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id; year of issuance" }
      - { name: allocation_id, type: string, source: input, description: "FK -> PatronageAllocation.id; allocation that produced this certificate" }
      - { name: equity_class, type: enum, source: input, description: "QUALIFIED | NONQUALIFIED" }
      - { name: face_value_cents, type: integer, source: input, description: "Original certificate face value" }
      - { name: outstanding_cents, type: integer, source: computed, description: "face_value_cents - sum(redeemed portions); >= 0" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVE | PARTIALLY_REDEEMED | REDEEMED | REVOKED | ESCHEATED | FROZEN" }
      - { name: issued_at, type: datetime, source: system, description: "Issue timestamp" }
      - { name: redeemable_at, type: datetime, source: computed, description: "Earliest redemption date = issued_at + min_holding_years" }
      - { name: revolvement_cycle_id, type: string, source: computed, description: "FK -> RevolvementCycle.id; cycle this certificate is queued in" }
      - { name: replaces_certificate_id, type: string, source: input, description: "FK -> EquityCertificate.id; non-null when certificate reissued after amendment" }

  - name: RevolvementCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_code, type: string, source: input, description: "Cycle label (e.g., CYC-2030-Q)" }
      - { name: equity_class, type: enum, source: input, description: "QUALIFIED | NONQUALIFIED — which certificate pool this cycle revolves" }
      - { name: target_year_offset, type: integer, source: input, description: "Years-after-issuance this cycle retires (board-set)" }
      - { name: window_start, type: datetime, source: input, description: "Redemption window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Redemption window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | CLOSED | CANCELLED" }
      - { name: budget_cap_cents, type: integer, source: input, description: "Maximum total cents the board authorizes this cycle to redeem" }
      - { name: redeemed_cents, type: integer, source: computed, description: "Running total of redeemed cents in this cycle" }
      - { name: board_resolution_id, type: string, source: input, description: "FK -> BoardResolution.id; enabling resolution" }

  - name: BoardResolution
    parent: null
    common_fields: true
    fields:
      - { name: resolution_code, type: string, source: input, description: "Unique resolution identifier" }
      - { name: kind, type: enum, source: input, description: "OPEN_REVOLVEMENT | APPROVE_ESTATE | APPROVE_RETIREMENT | APPROVE_SPECIAL_REDEMPTION | AMEND_ALLOCATION | AUTHORIZE_ESCHEAT" }
      - { name: subject_ref_id, type: string, source: input, description: "ID of target entity (cycle, estate claim, redemption request, or allocation)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | VOTING | PASSED | REJECTED | TABLED" }
      - { name: votes_for, type: integer, source: system, description: "Seated delegates voting FOR" }
      - { name: votes_against, type: integer, source: system, description: "Seated delegates voting AGAINST" }
      - { name: quorum_required, type: integer, source: input, description: "Minimum seated delegates who must vote" }
      - { name: voting_opens_at, type: datetime, source: input, description: "Voting window start" }
      - { name: voting_closes_at, type: datetime, source: input, description: "Voting window end" }

  - name: RedemptionRequest
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; requesting member (or estate executor)" }
      - { name: kind, type: enum, source: input, description: "ESTATE | RETIREMENT | SPECIAL_HARDSHIP | CYCLE_REDEMPTION" }
      - { name: certificate_ids, type: array, source: input, description: "List of EquityCertificate.id to redeem; must belong to member" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Total cents requested; <= sum(outstanding_cents across listed certs)" }
      - { name: status, type: enum, source: system, description: "PENDING | UNDER_REVIEW | APPROVED | REJECTED | PAID | APPEALED | CANCELLED" }
      - { name: appointment_at, type: datetime, source: input, description: "Office appointment slot for notarized signature (must not double-book)" }
      - { name: appeal_of_request_id, type: string, source: input, description: "FK -> RedemptionRequest.id; non-null when this request is an appeal of a REJECTED one" }
      - { name: resolution_id, type: string, source: computed, description: "FK -> BoardResolution.id; resolution that decided this request" }
      - { name: decided_at, type: datetime, source: system, description: "When board decision recorded" }

  - name: EstateClaim
    parent: Member
    common_fields: true
    fields:
      - { name: deceased_member_id, type: string, source: input, description: "FK -> Member.id; deceased member (status must be DECEASED)" }
      - { name: executor_member_id, type: string, source: input, description: "FK -> Member.id; estate executor (must be ACTIVE member of class ESTATE)" }
      - { name: filed_at, type: datetime, source: system, description: "Claim filing timestamp" }
      - { name: probate_completed_at, type: datetime, source: input, description: "Date probate court closed estate" }
      - { name: claim_window_days, type: integer, source: system, description: "Filing window in days; default 90" }
      - { name: status, type: enum, source: system, description: "FILED | PROBATED | APPROVED | DENIED | DISTRIBUTED | LAPSED" }
      - { name: claim_amount_cents, type: integer, source: computed, description: "Total outstanding equity at time of FILED transition" }

  - name: UnclaimedEquityLot
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> EquityCertificate.id; certificate deemed unclaimed" }
      - { name: last_known_member_id, type: string, source: input, description: "FK -> Member.id; member of record at escheat detection" }
      - { name: dormancy_started_at, type: datetime, source: system, description: "Date member became unreachable" }
      - { name: escheat_eligible_at, type: datetime, source: computed, description: "dormancy_started_at + dormancy_years (state-specific)" }
      - { name: dormancy_years, type: integer, source: input, description: "State-mandated dormancy period, default 5" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code for escheat jurisdiction" }
      - { name: status, type: enum, source: system, description: "DORMANT | NOTIFIED | ESCHEAT_PENDING | ESCHEATED | RECOVERED" }

  - name: PatronTaxForm
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; recipient patron" }
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id; tax year" }
      - { name: form_type, type: enum, source: input, description: "FORM_1099_PATR | FORM_1099_DIV | CORRECTED_1099_PATR" }
      - { name: box_1_patronage_dividends_cents, type: integer, source: computed, description: "Qualified cash + qualified equity (1099-PATR Box 1)" }
      - { name: box_3_per_unit_retains_cents, type: integer, source: computed, description: "Per-unit retains paid (Box 3)" }
      - { name: box_4_federal_withheld_cents, type: integer, source: input, description: "Backup withholding if W-9 not on file" }
      - { name: box_5_redemption_cents, type: integer, source: computed, description: "Nonqualified equity redeemed during year (Box 5)" }
      - { name: is_corrected, type: boolean, source: system, description: "True when this form amends a previously issued form" }
      - { name: corrects_form_id, type: string, source: input, description: "FK -> PatronTaxForm.id; the form this one corrects" }
      - { name: issued_at, type: datetime, source: system, description: "Issue timestamp; null until ISSUED" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | CORRECTED | VOID" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, DECEASED, EXPELLED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /coop/members/{member_id}/deactivate"
        actor: CoopRegistrar
        preconditions:
          - "member.status == ACTIVE"
          - "No OPEN RedemptionRequest for this member"
        side_effects:
          - "member.status → INACTIVE"
          - "All ACTIVE EquityCertificates for member remain valid but cannot be newly issued"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /coop/members/{member_id}/reactivate"
        actor: CoopRegistrar
        preconditions:
          - "member.status == INACTIVE"
        side_effects:
          - "member.status → ACTIVE"
      - from: ACTIVE
        to: DECEASED
        trigger: "POST /coop/members/{member_id}/record_death"
        actor: CoopRegistrar
        preconditions:
          - "member.status == ACTIVE"
          - "date_of_death <= clock.now"
        side_effects:
          - "member.status → DECEASED"
          - "Spawn EstateClaim in FILED for the deceased member with executor_member_id"
          - "All ACTIVE certificates for member move to FROZEN pending probate"
          - "RedemptionRequest for member auto-CANCELLED with reason ESTATE_TRANSITION"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /coop/members/{member_id}/withdraw"
        actor: Member
        preconditions:
          - "member.status == ACTIVE"
          - "No OPEN RedemptionRequest and no OPEN EstateClaim references this member"
        side_effects:
          - "member.status → WITHDRAWN"
          - "All ISSUED/ACTIVE certificates move to FROZEN pending board resolution"
      - from: ACTIVE
        to: EXPELLED
        trigger: "POST /coop/members/{member_id}/expel"
        actor: BoardSecretary
        preconditions:
          - "member.status == ACTIVE"
          - "A PASSED BoardResolution of kind APPROVE_SPECIAL_REDEMPTION references this member"
        side_effects:
          - "member.status → EXPELLED"
          - "All certificates immediately redeemable at face value; cash payout queued"

  - entity: FiscalYear
    initial_state: OPEN
    terminal_states: [CLOSED_FINAL]
    transitions:
      - from: OPEN
        to: CLOSED_PROVISIONAL
        trigger: "POST /coop/fiscal_years/{fy_id}/close_provisional"
        actor: CoopAccountant
        preconditions:
          - "fiscal_year.status == OPEN"
          - "All GrainDelivery in this year have status SETTLED or CANCELLED (no BOOKED)"
          - "clock.now >= fiscal_year.end_date"
        side_effects:
          - "fiscal_year.status → CLOSED_PROVISIONAL"
          - "Compute patronage_pool_cents = round(net_margin_cents * (1 - retained_reserve_pct))"
          - "Spawn PatronageAllocation rows with variant=PROVISIONAL, status=PROVISIONAL for every member with allocated_volume_bu > 0"
          - "Issue EquityCertificate for nonqualified_allocation_cents and qualified_equity_issued_cents, status=ISSUED"
      - from: CLOSED_PROVISIONAL
        to: UNDER_AUDIT
        trigger: "POST /coop/fiscal_years/{fy_id}/begin_audit"
        actor: ExternalAuditor
        preconditions:
          - "fiscal_year.status == CLOSED_PROVISIONAL"
        side_effects:
          - "fiscal_year.status → UNDER_AUDIT"
      - from: UNDER_AUDIT
        to: CLOSED_FINAL
        trigger: "POST /coop/fiscal_years/{fy_id}/finalize_close"
        actor: CoopAccountant
        preconditions:
          - "fiscal_year.status == UNDER_AUDIT"
          - "All PatronageAllocation rows for this year reviewed (variant=FINAL exists or PROVISIONAL confirmed)"
        side_effects:
          - "fiscal_year.status → CLOSED_FINAL"
          - "fiscal_year.final_audit_locked = true"
          - "For each PatronageAllocation, transition status PROVISIONAL → FINALIZED (or AMENDED if FINAL variant differs)"
          - "Issue PatronTaxForm rows for all patrons with allocation > 0"
          - "EquityCertificate status ISSUED → ACTIVE"
      - from: CLOSED_FINAL
        to: REOPENED
        trigger: "POST /coop/fiscal_years/{fy_id}/reopen"
        actor: BoardSecretary
        preconditions:
          - "fiscal_year.status == CLOSED_FINAL"
          - "A PASSED BoardResolution of kind AMEND_ALLOCATION references this fiscal_year"
        side_effects:
          - "fiscal_year.status → REOPENED"
          - "fiscal_year.final_audit_locked = false"
          - "All FINALIZED allocations for year return to PROVISIONAL pending recalc"
          - "Affected PatronTaxForm rows → VOID; corrected versions pending reissue"
      - from: REOPENED
        to: CLOSED_FINAL
        trigger: "POST /coop/fiscal_years/{fy_id}/finalize_close"
        actor: CoopAccountant
        preconditions:
          - "fiscal_year.status == REOPENED"
          - "Recalculated allocations reviewed"
        side_effects:
          - "fiscal_year.status → CLOSED_FINAL"
          - "PatronTaxForm rows issued as CORRECTED_1099_PATR with corrects_form_id pointing to VOID row"

  - entity: GrainDelivery
    initial_state: BOOKED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: BOOKED
        to: SETTLED
        trigger: "POST /coop/deliveries/{delivery_id}/settle"
        actor: ElevatorOperator
        preconditions:
          - "delivery.status == BOOKED"
          - "delivery.fiscal_year.status == OPEN"
        side_effects:
          - "delivery.status → SETTLED"
          - "delivery.per_unit_retain_cents computed (per-delivery rounding)"
          - "member.per_unit_retains_cents += per_unit_retain_cents"
          - "member.total_patronage_volume_bu += net_bushels when is_patron_sourced"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /coop/deliveries/{delivery_id}/cancel"
        actor: ElevatorOperator
        preconditions:
          - "delivery.status == BOOKED"
        side_effects:
          - "delivery.status → CANCELLED"

  - entity: PatronageAllocation
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, REVERSED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "system (on FiscalYear finalize_close)"
        actor: system
        preconditions:
          - "parent FiscalYear status transitioned UNDER_AUDIT → CLOSED_FINAL"
        side_effects:
          - "allocation.status → FINALIZED"
      - from: PROVISIONAL
        to: AMENDED
        trigger: "system (on FINAL variant recomputation diverging from PROVISIONAL)"
        actor: system
        preconditions:
          - "parent FiscalYear is being finalized"
          - "FINAL variant allocation_cents != PROVISIONAL allocation_cents"
        side_effects:
          - "allocation.status → AMENDED"
          - "Original EquityCertificate(s) → REVOKED"
          - "New EquityCertificate issued with replaces_certificate_id pointing to revoked"
          - "PatronTaxForm reissued as CORRECTED_1099_PATR"
      - from: PROVISIONAL
        to: REVERSED
        trigger: "POST /coop/allocations/{alloc_id}/reverse"
        actor: CoopAccountant
        preconditions:
          - "allocation.status == PROVISIONAL"
          - "parent FiscalYear not in CLOSED_FINAL"
        side_effects:
          - "allocation.status → REVERSED"
          - "EquityCertificate(s) → REVOKED"
          - "Member equity balances recomputed"

  - entity: EquityCertificate
    initial_state: ISSUED
    terminal_states: [REDEEMED, REVOKED, ESCHEATED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "system (on parent FiscalYear finalize_close)"
        actor: system
        preconditions: []
        side_effects:
          - "certificate.status → ACTIVE"
          - "certificate.redeemable_at = issued_at + min_holding_years"
      - from: ACTIVE
        to: FROZEN
        trigger: "system (on Member status transition to DECEASED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "certificate.status → FROZEN"
      - from: FROZEN
        to: ACTIVE
        trigger: "system (on EstateClaim → APPROVED or Member reactivation)"
        actor: system
        preconditions: []
        side_effects:
          - "certificate.status → ACTIVE"
      - from: ACTIVE
        to: PARTIALLY_REDEEMED
        trigger: "POST /coop/redemption_requests/{id}/disburse (partial amount)"
        actor: CoopTreasurer
        preconditions:
          - "certificate.status == ACTIVE"
          - "clock.now >= certificate.redeemable_at"
          - "RedemptionRequest status == APPROVED"
          - "amount < certificate.outstanding_cents"
        side_effects:
          - "certificate.status → PARTIALLY_REDEEMED"
          - "certificate.outstanding_cents -= amount"
          - "Member.qualified_equity_cents or nonqualified_equity_cents reduced accordingly"
      - from: ACTIVE
        to: REDEEMED
        trigger: "POST /coop/redemption_requests/{id}/disburse (full amount)"
        actor: CoopTreasurer
        preconditions:
          - "certificate.status == ACTIVE"
          - "clock.now >= certificate.redeemable_at"
          - "RedemptionRequest status == APPROVED"
          - "amount == certificate.outstanding_cents"
        side_effects:
          - "certificate.status → REDEEMED"
          - "certificate.outstanding_cents = 0"
          - "Member equity balance reduced"
      - from: PARTIALLY_REDEEMED
        to: REDEEMED
        trigger: "POST /coop/redemption_requests/{id}/disburse"
        actor: CoopTreasurer
        preconditions:
          - "certificate.status == PARTIALLY_REDEEMED"
          - "Remaining outstanding_cents fully paid"
        side_effects:
          - "certificate.status → REDEEMED"
          - "certificate.outstanding_cents = 0"
      - from: ISSUED
        to: REVOKED
        trigger: "system (on parent PatronageAllocation → REVERSED or AMENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "certificate.status → REVOKED"
          - "outstanding_cents = 0"
      - from: ACTIVE
        to: ESCHEATED
        trigger: "system (on UnclaimedEquityLot ESCHEAT_PENDING → ESCHEATED)"
        actor: system
        preconditions: []
        side_effects:
          - "certificate.status → ESCHEATED"
          - "outstanding_cents remitted to state"

  - entity: RevolvementCycle
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /coop/revolvement_cycles/{id}/open"
        actor: BoardSecretary
        preconditions:
          - "cycle.status == PLANNED"
          - "PASSED BoardResolution of kind OPEN_REVOLVEMENT references this cycle"
          - "No other RevolvementCycle for same equity_class with status OPEN whose [window_start, window_end) overlaps"
          - "clock.now >= cycle.window_start"
        side_effects:
          - "cycle.status → OPEN"
          - "Cycle assigned as revolvement_cycle_id for eligible certificates"
      - from: OPEN
        to: CLOSED
        trigger: "POST /coop/revolvement_cycles/{id}/close"
        actor: BoardSecretary
        preconditions:
          - "cycle.status == OPEN"
          - "clock.now >= cycle.window_end OR cycle.redeemed_cents >= cycle.budget_cap_cents"
        side_effects:
          - "cycle.status → CLOSED"
          - "Outstanding certificates remain in pool for next cycle"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /coop/revolvement_cycles/{id}/cancel"
        actor: BoardSecretary
        preconditions:
          - "cycle.status == PLANNED"
        side_effects:
          - "cycle.status → CANCELLED"

  - entity: RedemptionRequest
    initial_state: PENDING
    terminal_states: [PAID, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: UNDER_REVIEW
        trigger: "POST /coop/redemption_requests/{id}/submit_for_review"
        actor: Member
        preconditions:
          - "request.status == PENDING"
          - "Member.status ∈ {ACTIVE, DECEASED (estate executor), INACTIVE}"
          - "All listed certificates are owned by member and in ACTIVE status"
          - "requested_amount_cents > 0"
        side_effects:
          - "request.status → UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /coop/redemption_requests/{id}/decide (decision=APPROVE)"
        actor: BoardSecretary
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "PASSED BoardResolution of kind matching request.kind references this request"
          - "For CYCLE_REDEMPTION: parent RevolvementCycle status == OPEN AND cycle.redeemed_cents + requested_amount_cents <= cycle.budget_cap_cents"
          - "For ESTATE: parent EstateClaim status ∈ {PROBATED, APPROVED} AND clock.now >= estate.filed_at + claim_window_days"
          - "parent FiscalYear for affected certificates status == CLOSED_FINAL"
        side_effects:
          - "request.status → APPROVED"
          - "request.resolution_id linked"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /coop/redemption_requests/{id}/decide (decision=REJECT)"
        actor: BoardSecretary
        preconditions:
          - "request.status == UNDER_REVIEW"
        side_effects:
          - "request.status → REJECTED"
      - from: REJECTED
        to: APPEALED
        trigger: "POST /coop/redemption_requests/{id}/appeal"
        actor: Member
        preconditions:
          - "request.status == REJECTED"
          - "clock.now <= request.decided_at + 30 days"
        side_effects:
          - "Spawn new RedemptionRequest with status=UNDER_REVIEW, appeal_of_request_id set"
      - from: APPROVED
        to: PAID
        trigger: "POST /coop/redemption_requests/{id}/disburse"
        actor: CoopTreasurer
        preconditions:
          - "request.status == APPROVED"
          - "Office appointment slot honoured (no other APPROVED request for same appointment_at within ±30 min at the same office)"
        side_effects:
          - "request.status → PAID"
          - "Each listed certificate PARTIALLY_REDEEMED or REDEEMED"
          - "Cycle.redeemed_cents incremented if kind == CYCLE_REDEMPTION"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /coop/redemption_requests/{id}/cancel"
        actor: Member
        preconditions:
          - "request.status == PENDING"
        side_effects:
          - "request.status → CANCELLED"

  - entity: EstateClaim
    initial_state: FILED
    terminal_states: [DISTRIBUTED, DENIED, LAPSED]
    transitions:
      - from: FILED
        to: PROBATED
        trigger: "POST /coop/estate_claims/{id}/record_probate"
        actor: CoopRegistrar
        preconditions:
          - "claim.status == FILED"
          - "probate_completed_at is set"
          - "clock.now >= claim.filed_at + claim_window_days"
        side_effects:
          - "claim.status → PROBATED"
      - from: PROBATED
        to: APPROVED
        trigger: "POST /coop/estate_claims/{id}/decide (decision=APPROVE)"
        actor: BoardSecretary
        preconditions:
          - "claim.status == PROBATED"
          - "PASSED BoardResolution of kind APPROVE_ESTATE references this claim"
        side_effects:
          - "claim.status → APPROVED"
          - "All FROZEN certificates for deceased_member_id → ACTIVE (transferable to executor)"
      - from: PROBATED
        to: DENIED
        trigger: "POST /coop/estate_claims/{id}/decide (decision=DENY)"
        actor: BoardSecretary
        preconditions:
          - "claim.status == PROBATED"
        side_effects:
          - "claim.status → DENIED"
      - from: APPROVED
        to: DISTRIBUTED
        trigger: "system (on all related RedemptionRequests reaching PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "claim.status → DISTRIBUTED"
      - from: FILED
        to: LAPSED
        trigger: "system (clock.now > filed_at + 365 days AND status still FILED)"
        actor: system
        preconditions: []
        side_effects:
          - "claim.status → LAPSED"
          - "Certificates remain FROZEN; board may escheat"

  - entity: UnclaimedEquityLot
    initial_state: DORMANT
    terminal_states: [ESCHEATED, RECOVERED]
    transitions:
      - from: DORMANT
        to: NOTIFIED
        trigger: "POST /coop/unclaimed_lots/{id}/notify"
        actor: CoopRegistrar
        preconditions:
          - "lot.status == DORMANT"
        side_effects:
          - "lot.status → NOTIFIED"
      - from: NOTIFIED
        to: ESCHEAT_PENDING
        trigger: "system (clock.now >= escheat_eligible_at)"
        actor: system
        preconditions:
          - "lot.status == NOTIFIED"
        side_effects:
          - "lot.status → ESCHEAT_PENDING"
      - from: ESCHEAT_PENDING
        to: ESCHEATED
        trigger: "POST /coop/unclaimed_lots/{id}/escheat"
        actor: CoopTreasurer
        preconditions:
          - "lot.status == ESCHEAT_PENDING"
          - "PASSED BoardResolution of kind AUTHORIZE_ESCHEAT references this lot"
        side_effects:
          - "lot.status → ESCHEATED"
          - "Linked EquityCertificate → ESCHEATED"
      - from: NOTIFIED
        to: RECOVERED
        trigger: "POST /coop/unclaimed_lots/{id}/recover"
        actor: Member
        preconditions:
          - "lot.status == NOTIFIED"
          - "acting member id == last_known_member_id"
        side_effects:
          - "lot.status → RECOVERED"

  - entity: BoardResolution
    initial_state: PROPOSED
    terminal_states: [PASSED, REJECTED, TABLED]
    transitions:
      - from: PROPOSED
        to: VOTING
        trigger: "POST /coop/board_resolutions/{id}/open_voting"
        actor: BoardSecretary
        preconditions:
          - "resolution.status == PROPOSED"
          - "clock.now >= resolution.voting_opens_at"
        side_effects:
          - "resolution.status → VOTING"
      - from: VOTING
        to: PASSED
        trigger: "POST /coop/board_resolutions/{id}/record_vote (final tally)"
        actor: BoardSecretary
        preconditions:
          - "resolution.status == VOTING"
          - "clock.now >= resolution.voting_closes_at OR all seated delegates have voted"
          - "votes_for + votes_against >= quorum_required"
          - "votes_for > votes_against"
        side_effects:
          - "resolution.status → PASSED"
      - from: VOTING
        to: REJECTED
        trigger: "POST /coop/board_resolutions/{id}/record_vote"
        actor: BoardSecretary
        preconditions:
          - "resolution.status == VOTING"
          - "quorum met but votes_for <= votes_against"
        side_effects:
          - "resolution.status → REJECTED"
      - from: PROPOSED
        to: TABLED
        trigger: "POST /coop/board_resolutions/{id}/table"
        actor: BoardSecretary
        preconditions:
          - "resolution.status == PROPOSED"
        side_effects:
          - "resolution.status → TABLED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: member-close-stale-version
    parent_entity: Member
    write_endpoint: "POST /coop/members/{member_id}/withdraw"
    occ_field: "expected_member_version"
    description: |
      Withdrawing a Member whose version has advanced since the client last
      observed it (e.g., a certificate redemption cascaded an equity balance
      update in the interim) is rejected. The client must re-read the member
      and re-issue with the fresh version.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

  - rule_id: fiscal-year-close-stale-version
    parent_entity: FiscalYear
    write_endpoint: "POST /coop/fiscal_years/{fy_id}/finalize_close"
    occ_field: "expected_fiscal_year_version"
    description: |
      Finalizing a FiscalYear whose version has advanced (e.g., a delivery
      settle or audit note bumped the row) since the accountant last observed
      it is rejected. Forces re-read before the destructive finalize.
    error_id: ERR_STALE_FISCAL_YEAR_VERSION
    http_status: 412

  - rule_id: certificate-disburse-stale-version
    parent_entity: EquityCertificate
    write_endpoint: "POST /coop/redemption_requests/{id}/disburse"
    occ_field: "expected_certificate_versions"
    description: |
      Disbursing a RedemptionRequest when any listed certificate's version has
      advanced (e.g., another disbursement already drew down outstanding_cents)
      is rejected. Prevents double-payment against the same certificate.
    error_id: ERR_STALE_CERTIFICATE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: patronage_allocation_provisional
    trigger: "FiscalYear.close_provisional"
    algorithm: waterfall_allocation
    formula: |
      patronage_pool_cents = round_half_up(net_margin_cents * (1 - retained_reserve_pct))
      total_patron_volume_bu = sum(net_bushels) over deliveries where is_patron_sourced AND status=SETTLED
      For each member m with volume v_m > 0:
        share_m = v_m / total_patron_volume_bu            # 8 dp, half-even
        gross_alloc_m = round_half_up(patronage_pool_cents * share_m)
        tier_m = tier_for(v_m)  # T1 < 1000, T2 1000..9999, T3 >= 10000 bushels
        rate_mod = TIER_RATE_MOD[tier_m]                  # 1.00, 1.05, 1.10
        qualified_slice_m = round_half_up(gross_alloc_m * rate_mod * QUALIFIED_FRACTION)
        nonqualified_slice_m = gross_alloc_m - qualified_slice_m   # remainder to nonqualified
        cash_m = round_half_up(qualified_slice_m * qualified_payout_pct)
        qual_equity_m = qualified_slice_m - cash_m
      # Reconcile rounding drift: any cents lost/gained across all members are
      # posted to the largest-volume member (ties broken by earliest joined_at)
    precision: "integer cents; intermediate share at 8 dp half-even"
    constants:
      QUALIFIED_FRACTION: 0.70
      TIER_T2_MIN_BU: 1000
      TIER_T3_MIN_BU: 10000
    input_set: "Members with at least one SETTLED, is_patron_sourced delivery in this FiscalYear"
    variants:
      - name: PROVISIONAL
        when: "Computed at close_provisional"
        difference: "Uses unaudited net_margin_cents and current delivery snapshot; tier thresholds applied per provisional volume"
      - name: FINAL
        when: "Recomputed at finalize_close after audit adjustments"
        difference: "Uses audited net_margin_cents, excludes deliveries cancelled after provisional close, and reconciles rounding remainder against the same largest-volume rule"

  - name: per_unit_retain_valuation
    trigger: "GrainDelivery.settle"
    algorithm: tiered_pricing
    formula: |
      retain_rate_cents_per_bu = RETAIN_RATE[commodity]   # e.g. CORN=8, SOYBEAN=10, WHEAT=6, SORGHUM=7, SUNFLOWER=9
      net_bushels = floor(gross_bushels * (1 - dockage_pct))
      # ROUNDING ORDER PINNED: per-delivery rounding, then aggregate to member.
      per_unit_retain_cents = round_half_up(net_bushels * retain_rate_cents_per_bu)
      # The variant below aggregates first, then rounds — produces DIFFERENT cents
      # when summed across many deliveries; the scaffold pins per-delivery.
    precision: "integer cents, round_half_up per delivery"
    constants:
      RETAIN_RATE_CORN_CENTS: 8
      RETAIN_RATE_SOYBEAN_CENTS: 10
      RETAIN_RATE_WHEAT_CENTS: 6
      RETAIN_RATE_SORGHUM_CENTS: 7
      RETAIN_RATE_SUNFLOWER_CENTS: 9
    input_set: "Single GrainDelivery being settled"
    variants:
      - name: per_delivery_round
        when: "DEFAULT — production path"
        difference: "Round each delivery's retain to integer cents, then sum across deliveries"
      - name: aggregate_then_round
        when: "Audit report only — never written to Member.per_unit_retains_cents"
        difference: "Sum (net_bushels * rate) across all deliveries for member-year as decimal, then round once at fiscal-year end. Routinely differs by ±(n-1)/2 cents where n = delivery count"

  - name: equity_redemption_pro_rata
    trigger: "RedemptionRequest.disburse"
    algorithm: waterfall_allocation
    formula: |
      # When requested_amount_cents < sum(outstanding over listed certs):
      # distribute pro-rata by outstanding_cents, with remainder (due to integer
      # rounding) allocated to the cert with the earliest issued_at (NOT by id).
      total_outstanding = sum(c.outstanding_cents for c in listed_certs)
      if requested_amount_cents >= total_outstanding:
        each cert gets its full outstanding_cents
      else:
        for each cert: partial_i = floor(outstanding_i * requested_amount_cents / total_outstanding)
        remainder = requested_amount_cents - sum(partial_i)
        # remainder distributed one cent at a time to certs sorted by issued_at ASC
        # (ties broken by created_at ASC — never by id)
    precision: "integer cents, floor for pro-rata, then deterministic remainder distribution"
    input_set: "Listed EquityCertificate rows on the request, in ACTIVE or PARTIALLY_REDEEMED status"
    variants: []

  - name: tier_rate_modifier
    trigger: "patronage_allocation_provisional and FINAL variant"
    algorithm: threshold
    formula: |
      # Boundary precision pinned: tier classification uses >= on the lower bound.
      if allocated_volume_bu >= TIER_T3_MIN_BU: return T3, rate_mod = 1.10
      elif allocated_volume_bu >= TIER_T2_MIN_BU: return T2, rate_mod = 1.05
      else: return T1, rate_mod = 1.00
    precision: "integer bushels; boundary at exactly 1000 → T2; exactly 10000 → T3"
    constants:
      TIER_T2_MIN_BU: 1000
      TIER_T3_MIN_BU: 10000
      TIER_T2_MOD: 1.05
      TIER_T3_MOD: 1.10
    input_set: "Single member's allocated_volume_bu for the fiscal year"
    variants: []

  - name: estate_claim_window_check
    trigger: "EstateClaim.record_probate and RedemptionRequest.decide (ESTATE kind)"
    algorithm: threshold
    formula: |
      # Boundary: a claim is board-decidable only when
      # clock.now >= claim.filed_at + claim_window_days  (inclusive).
      # Exact equality IS decidable (>=).
      claim_window_days = 90
      is_decidable = clock.now >= filed_at + claim_window_days * 86400 seconds
    precision: "UTC timestamps, inclusive lower bound"
    constants:
      ESTATE_CLAIM_WINDOW_DAYS: 90
    input_set: "Single EstateClaim"
    variants: []

  - name: escrow_unclaimed_dormancy
    trigger: "UnclaimedEquityLot NOTIFIED → ESCHEAT_PENDING"
    algorithm: chronological
    formula: |
      escheat_eligible_at = dormancy_started_at + dormancy_years * 365.2425 days
      # Uses Gregorian-average years, not calendar years — leap-year safe.
      # Boundary: dormancy exactly equal to threshold IS eligible (>=).
    precision: "UTC timestamps"
    constants:
      DEFAULT_DORMANCY_YEARS: 5
    input_set: "Lots in NOTIFIED status"
    variants: []

  - name: appointment_slot_overlap
    trigger: "RedemptionRequest.submit_for_review and disburse"
    algorithm: interval_merge
    formula: |
      # Office appointment slots use HALF-OPEN 30-min windows [t, t+30min).
      # Two requests at the same office conflict iff their windows overlap.
      # Adjacent appointments (one ends exactly when the other begins) do NOT conflict.
      window_a = [appointment_at, appointment_at + 1800 seconds)
      window_b = [other.appointment_at, other.appointment_at + 1800 seconds)
      conflict = (window_a.start < window_b.end) AND (window_b.start < window_a.end)
    precision: "UTC seconds; half-open intervals"
    constants:
      APPOINTMENT_SLOT_SECONDS: 1800
    input_set: "All RedemptionRequests with status in {UNDER_REVIEW, APPROVED} for the same office"
    variants: []

  - name: tax_form_1099_patron_box1
    trigger: "PatronTaxForm issuance on FiscalYear finalize_close"
    algorithm: aggregation
    formula: |
      box_1_patronage_dividends_cents = sum over FINALIZED+AMENDED allocations for member-year of (cash_paid_cents + qualified_equity_issued_cents)
      box_3_per_unit_retains_cents = sum of per_unit_retain_cents for member-year SETTLED deliveries
      box_5_redemption_cents = sum over redemption disbursements in year where certificate.equity_class == NONQUALIFIED
      # input set excludes allocations with status == REVERSED
    precision: "integer cents"
    input_set: "Per member per fiscal year"
    variants: []

  - name: patronage_pool_reconciliation_invariant
    trigger: "audit — checked at every finalize_close and on every allocation amendment"
    algorithm: constraint_propagation
    formula: |
      # COMPENSATING INVARIANT #1 (conserved quantity: patronage pool)
      # For each FiscalYear in CLOSED_FINAL:
      #   sum over non-REVERSED allocations of
      #     (cash_paid_cents + qualified_equity_issued_cents + nonqualified_allocation_cents)
      #   == fiscal_year.patronage_pool_cents
      # A reversal/amendment MUST re-balance so this holds with zero drift.
    precision: "integer cents; zero tolerance"
    input_set: "All PatronageAllocation rows for the year with status != REVERSED"
    variants: []

  - name: certificate_face_value_conservation
    trigger: "audit — checked at every disburse and amendment"
    algorithm: constraint_propagation
    formula: |
      # COMPENSATING INVARIANT #2 (conserved quantity: certificate face value)
      # For each EquityCertificate in any non-REVOKED status:
      #   outstanding_cents + sum(disbursements against this cert) == face_value_cents
      # Estate redemption + member residual balance on revocation must equal
      # the original face value (no value created or destroyed by reissue).
    precision: "integer cents; zero tolerance"
    input_set: "All EquityCertificate rows"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-ID header present; for entity_backed roles the ID must reference an existing entity of that role's backing type"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role authorized for this endpoint per §1.5"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path parameters reference existing resources (member, fiscal_year, delivery, allocation, certificate, cycle, request, claim, lot, resolution, form)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "OCC: expected_*_version matches current entity version on guarded endpoints"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /coop/members/{id}/withdraw, POST /coop/fiscal_years/{id}/finalize_close, POST /coop/redemption_requests/{id}/disburse"

  - priority: 6
    category: state
    check: "Resource in valid source state for the transition (e.g., request.status == UNDER_REVIEW before decide)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance gates: estate claim window elapsed; member not DECEASED when booking new deliveries; certificate not FROZEN at disburse"
    error_id: ERR_COMPLIANCE_GATE
    http_status: 422
    applies_to: "deliveries.create, redemption_requests.submit_for_review, redemption_requests.disburse, estate_claims.record_probate"

  - priority: 8
    category: business_temporal
    check: "Time-window constraints: fiscal year open at delivery booking; revolvement window open; appointment slot not in past; voting window active"
    error_id: ERR_TEMPORAL_WINDOW
    http_status: 422
    applies_to: "deliveries.create, revolvement_cycles.open, redemption_requests.submit_for_review, board_resolutions.open_voting"

  - priority: 9
    category: business_referential
    check: "Cross-entity referential integrity: certificate belongs to member; allocation year matches certificate year; resolution subject exists; appeal_of points to a REJECTED request by the same member"
    error_id: ERR_REFERENTIAL
    http_status: 422
    applies_to: "redemption_requests.create, equity_certificates.create, board_resolutions.create, redemption_requests.appeal"

  - priority: 10
    category: business_constraint
    check: "Aggregate constraints: cycle budget not exceeded; office appointment slot not double-booked; district not over delegate cap; no overlapping OPEN cycle for same equity_class"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 409
    applies_to: "revolvement_cycles.open, redemption_requests.submit_for_review, delegates.create, redemption_requests.disburse"

  - priority: 11
    category: business_fiscal
    check: "Fiscal checks: requested_amount <= sum outstanding; certificate redeemable_at reached; patronage_pool not over-allocated; per_unit_retain arithmetic consistent"
    error_id: ERR_FISCAL
    http_status: 422
    applies_to: "redemption_requests.create, redemption_requests.disburse, fiscal_years.finalize_close, deliveries.settle"

  - priority: 12
    category: business_fiscal
    check: "Boundary-condition fiscal: gross_bushels > 0; dockage_pct in [0, 0.30]; retained_reserve_pct in [0, 0.50]; qualified_payout_pct in [0, 1]"
    error_id: ERR_FISCAL_BOUNDARY
    http_status: 422
    applies_to: "deliveries.create, fiscal_years.create, fiscal_years.close_provisional"

# =============================================================================
# 1.5 API Endpoint Table (26 endpoints)
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/coop/_clock/set_current_utc"
    description: "Test-driving endpoint: set logical clock to an arbitrary UTC ISO8601 instant. Server default on boot is 2026-05-01T00:00:00Z (NOT wall-clock) — deterministic earliest time for all time-gated rules."
    roles: [CoopAdmin]
