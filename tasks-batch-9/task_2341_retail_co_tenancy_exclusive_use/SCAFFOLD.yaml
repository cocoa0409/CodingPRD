scenario: |
  2341. Retail Co-Tenancy & Exclusive Use Administration (shopping center leasing and administration): lease abstract of co-tenancy conditions with opening and ongoing occupancy thresholds, anchor closure triggering rent reduction, termination rights or remedies with cure periods, exclusive use clause inventory with prohibited-use screening on every new lease, radius restriction enforcement and violation remedies, use violation notice and cure workflow with tenant disputes, remeasurement of occupancy percentages when tenants dark or go into default, redevelopment and pad sale impacts on protected rights, tenant estoppel and lender requirements around these provisions

domain_name: retail-co-tenancy-exclusive-use
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert_plus
  notes: |
    Density, not volume, carries the difficulty. The same co-tenancy condition is
    evaluated by two different engines over the same lease population: a LIVE_STRICT
    evaluation fired by every lease/tenant status change, and a CERTIFIED_MEASUREMENT
    evaluation fired by measurement certification whose variant (SNAPSHOT_STRICT vs
    TRAILING_GRACE) may legitimately CURE a condition the live engine BREACHED.
    Rent abatement is deliberately rounded in two different orders in two different
    fields (per-election-then-sum for Lease.total_abated_cents, sum-then-round for
    Lease.effective_rent_monthly_cents) and both orders are pinned explicitly.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ShoppingCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the shopping center.
      - name: total_gla_sqft
        type: integer
        source: input
        description: Total gross leasable area of the center in square feet; denominator of every GLA occupancy percentage.
        constraints: "> 0; decremented by RedevelopmentPlan.removed_gla_sqft on plan RECORDED, restored on ABANDONED"
      - name: occupancy_grace_days
        type: integer
        source: input
        default: 90
        description: Grace window used ONLY by the TRAILING_GRACE measurement variant; a DARK lease is still counted open while days_between(dark_since, measured_at) < occupancy_grace_days.
        constraints: ">= 0"
      - name: occupied_gla_sqft
        type: integer
        source: computed
        description: "Sum of Lease.gla_sqft over leases of this center where premises_status == OPEN AND Tenant.status == ACTIVE (LIVE_STRICT counting). Recomputed on every lease premises_status change, tenant status change, and RedevelopmentPlan record/abandon."
      - name: open_occupancy_pct
        type: number
        source: computed
        description: "round_half_up(occupied_gla_sqft / total_gla_sqft * 100, 2)."
      - name: operating_store_count
        type: integer
        source: computed
        description: "Count of leases of this center counted open under LIVE_STRICT with is_anchor == false."
      - name: open_anchor_count
        type: integer
        source: computed
        description: "Count of leases of this center counted open under LIVE_STRICT with is_anchor == true."
      - name: protected_exclusive_count
        type: integer
        source: computed
        description: "Count of ExclusiveUseClause rows with status == ACTIVE whose benefited Lease.premises_status != TERMINATED, for leases of this center. Conserved quantity of invariant redevelopment_protected_rights_conservation."
      - name: aggregate_effective_rent_cents
        type: integer
        source: computed
        description: "Sum of Lease.effective_rent_monthly_cents over leases of this center with premises_status IN {OPEN, DARK}. Conserved quantity of invariant remedy_rent_conservation."
      - name: open_violation_count
        type: integer
        source: computed
        description: "Count of UseViolationNotice rows whose violating lease belongs to this center and whose status IN {ISSUED, DISPUTED, ESCALATED}."
      - name: compliance_posture
        type: enum
        source: computed
        default: COMPLIANT
        description: "Derived gate over the center; see calculations.center_posture_derivation. FROZEN blocks POST /leases/{id}/execute and POST /leases/{id}/open."
        constraints: "COMPLIANT | WATCH | BREACH | FROZEN"
      - name: redevelopment_status
        type: enum
        source: computed
        default: NONE
        description: "NONE until a RedevelopmentPlan for this center exists; PLANNED while any plan is in {PLANNED, CONSENT_PENDING}; RECORDED once any plan of this center reaches RECORDED; returns to NONE when every plan of this center is ABANDONED."
        constraints: "NONE | PLANNED | RECORDED"
      - name: last_sweep_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent POST /centers/{id}/compliance-sweep for this center; null before the first sweep.

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Tenant legal entity name.
      - name: notice_email
        type: string
        source: input
        description: Address of record for use-violation notices.
      - name: primary_use_code
        type: string
        source: input
        description: "Uppercase use code describing the tenant's principal merchandising category, e.g. GROCERY, BOOKS, JUICE_BAR."
      - name: is_national_chain
        type: boolean
        source: input
        default: false
        description: Abstracting flag; national chains are the usual holders of radius restrictions.
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Credit status maintained through PATCH /tenants/{id}. ACTIVE counts open under both measurement variants; DEFAULTED counts open ONLY under TRAILING_GRACE; BANKRUPT never counts open."
        constraints: "ACTIVE | DEFAULTED | BANKRUPT"

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> ShoppingCenter.id; the center whose GLA denominator and posture govern this lease."
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; also the ownership subject for role TenantRep (X-User-ID must equal this value)."
      - name: replacement_for_lease_id
        type: string
        source: input
        default: null
        description: "FK -> Lease.id; self-referential link set when this lease replaces a relocated or terminated lease during redevelopment. Null for original leases."
      - name: suite_code
        type: string
        source: input
        description: Suite identifier; unique per center across leases whose premises_status != TERMINATED.
      - name: gla_sqft
        type: integer
        source: input
        description: Demised area in square feet; numerator contribution to occupancy percentages.
        constraints: "> 0"
      - name: parcel_kind
        type: enum
        source: input
        description: Physical parcel classification used by exclusivity scope tests and anchor counting.
        constraints: "INLINE | ANCHOR_BOX | PAD"
      - name: is_anchor
        type: boolean
        source: computed
        description: "Equals (parcel_kind == ANCHOR_BOX). Input value, if supplied, is ignored."
      - name: primary_use_code
        type: string
        source: input
        description: Uppercase use code screened against every ACTIVE ExclusiveUseClause of the center.
      - name: incidental_use_codes
        type: array
        source: input
        default: []
        description: Uppercase use codes the tenant conducts only incidentally; a member of this array may qualify for a clause carve-out.
      - name: projected_incidental_sales_pct
        type: number
        source: input
        default: 0
        description: Projected share of gross sales attributable to incidental use codes; compared against ExclusiveUseClause.incidental_sales_pct_cap with <= semantics.
        constraints: ">= 0 and <= 100"
      - name: base_rent_monthly_cents
        type: integer
        source: input
        description: Contract monthly base rent in cents before any co-tenancy abatement.
        constraints: "> 0"
      - name: commencement_date
        type: string
        source: input
        description: "Lease term start, ISO date (YYYY-MM-DD)."
      - name: expiration_date
        type: string
        source: input
        description: "Lease term end, ISO date (YYYY-MM-DD); must be strictly after commencement_date."
      - name: premises_status
        type: enum
        source: computed
        default: DRAFT
        description: "Premises dimension of the parallel state machine; independent of remedy_status."
        constraints: "DRAFT | EXECUTED | OPEN | DARK | TERMINATED"
      - name: remedy_status
        type: enum
        source: computed
        default: NONE
        description: "Remedy dimension of the parallel state machine; advances on co-tenancy breach and remedy election, independent of premises_status."
        constraints: "NONE | ELIGIBLE | REMEDY_ACTIVE | TERMINATION_PENDING | TERMINATED_BY_REMEDY"
      - name: use_compliance_status
        type: enum
        source: computed
        default: CLEAR
        description: "CLEAR when no UseViolationNotice against this lease is in {ISSUED, DISPUTED, ESCALATED}; UNDER_NOTICE when at least one is in {ISSUED, DISPUTED}; IN_VIOLATION when at least one is ESCALATED."
        constraints: "CLEAR | UNDER_NOTICE | IN_VIOLATION"
      - name: opened_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent EXECUTED->OPEN or DARK->OPEN transition.
      - name: dark_since
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent OPEN->DARK transition; reset to null on DARK->OPEN.
      - name: remedy_eligible_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which remedy_status became ELIGIBLE; null while remedy_status == NONE.
      - name: effective_rent_monthly_cents
        type: integer
        source: computed
        description: "round_half_up(base_rent_monthly_cents * (100 - SUM(reduction_pct of RemedyElection rows on this lease with status == REDUCTION_ACTIVE whose half-open window covers the current logical clock date)) / 100) — SUM FIRST, ROUND ONCE."
      - name: total_abated_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative abatement granted to date; per-election amounts are rounded to whole cents FIRST and then summed (see calculations.abatement_ledger_rounding). Deliberately the opposite rounding order from effective_rent_monthly_cents."

  - name: CoTenancyCondition
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the benefited lease that may elect a remedy when this condition is breached."
      - name: condition_kind
        type: enum
        source: input
        description: "OPENING conditions gate POST /leases/{id}/open; ONGOING conditions are evaluated continuously once the lease is OPEN or DARK."
        constraints: "OPENING | ONGOING"
      - name: measurement_basis
        type: enum
        source: input
        description: Threshold basis; determines which required_* field is mandatory.
        constraints: "GLA_PCT | STORE_COUNT"
      - name: required_occupancy_pct
        type: number
        source: input
        default: null
        description: "Required occupied-GLA percentage; mandatory when measurement_basis == GLA_PCT, must be null otherwise. Satisfied when measured pct >= this value."
        constraints: "> 0 and <= 100"
      - name: required_open_store_count
        type: integer
        source: input
        default: null
        description: "Required count of open non-anchor stores; mandatory when measurement_basis == STORE_COUNT, must be null otherwise. Satisfied when measured count >= this value."
        constraints: "> 0"
      - name: required_anchor_count
        type: integer
        source: input
        default: 0
        description: Minimum count of open anchor boxes required in addition to the basis test.
        constraints: ">= 0"
      - name: grace_period_days
        type: integer
        source: input
        default: 30
        description: Breach must persist this many days before the benefited lease becomes remedy ELIGIBLE; 0 makes eligibility immediate at breach detection.
        constraints: ">= 0"
      - name: cure_period_days
        type: integer
        source: input
        default: 120
        description: Landlord cure window; a TERMINATION election requires consecutive_breach_days >= cure_period_days.
        constraints: ">= 0"
      - name: remedy_type
        type: enum
        source: input
        description: Remedy ladder permitted by the lease abstract; constrains RemedyElection.election_kind.
        constraints: "RENT_REDUCTION_ONLY | RENT_REDUCTION_THEN_TERMINATION | TERMINATION_ONLY"
      - name: max_reduction_pct
        type: number
        source: input
        default: 50
        description: Upper cap applied by calculations.cotenancy_rent_reduction.
        constraints: "> 0 and <= 100"
      - name: status
        type: enum
        source: computed
        default: SATISFIED
        description: "Evaluated at creation and on every LIVE_STRICT or CERTIFIED_MEASUREMENT evaluation; WAIVED is written only by RedevelopmentPlan record when the benefited lease is the pad parcel."
        constraints: "SATISFIED | BREACHED | CURED | WAIVED"
      - name: breach_detected_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the condition first flipped to BREACHED in the current breach episode; reset to null on CURED.
      - name: consecutive_breach_days
        type: integer
        source: computed
        default: 0
        description: "days_between(breach_detected_at, evaluation instant) at the latest evaluation; 0 while status != BREACHED."
      - name: last_evaluated_measurement_id
        type: string
        source: computed
        default: null
        description: "FK -> OccupancyMeasurement.id; set only by CERTIFIED_MEASUREMENT evaluations, left unchanged by LIVE_STRICT evaluations."

  - name: AnchorRequirement
    parent: null
    common_fields: false
    fields:
      - name: condition_id
        type: string
        source: input
        description: "FK -> CoTenancyCondition.id; the condition this named-anchor requirement belongs to."
      - name: anchor_lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the specific anchor lease that must be counted open, must have parcel_kind == ANCHOR_BOX and belong to the same center as the condition's lease."
      - name: substitution_allowed
        type: boolean
        source: input
        default: false
        description: When true, an open replacement anchor box may satisfy this requirement instead of the named lease.
      - name: min_substitute_gla_sqft
        type: integer
        source: input
        default: 0
        description: Minimum gla_sqft a substitute anchor box must have to satisfy this requirement.
        constraints: ">= 0"

  - name: ExclusiveUseClause
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the benefited (protected) lease."
      - name: protected_use_codes
        type: array
        source: input
        description: Non-empty array of uppercase use codes no other lease of the center may conduct within the clause scope.
        constraints: "length >= 1"
      - name: exclusivity_scope
        type: enum
        source: input
        description: "CENTER_WIDE binds every parcel; PAD_EXCLUDED binds all parcels except parcel_kind == PAD; RADIUS_INCLUSIVE binds every parcel and additionally survives pad sale."
        constraints: "CENTER_WIDE | PAD_EXCLUDED | RADIUS_INCLUSIVE"
      - name: gla_carve_out_sqft
        type: integer
        source: input
        default: 0
        description: A screened lease of at most this many square feet may qualify for the incidental carve-out (<= semantics).
        constraints: ">= 0"
      - name: incidental_sales_pct_cap
        type: number
        source: input
        default: 0
        description: A screened lease whose projected_incidental_sales_pct is at most this value may qualify for the carve-out (<= semantics).
        constraints: ">= 0 and <= 100"
      - name: effective_from_date
        type: string
        source: input
        description: "ISO date; clause applies while effective_from_date <= screening date <= effective_through_date (closed interval)."
      - name: effective_through_date
        type: string
        source: input
        description: "ISO date; must be strictly after effective_from_date."
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "ACTIVE at creation; SUSPENDED by RedevelopmentPlan record and restored to ACTIVE by abandon; EXPIRED when the benefited lease is TERMINATED; WAIVED when a dispute against a notice on this clause is UPHELD on grounds SCOPE_INAPPLICABLE."
        constraints: "ACTIVE | SUSPENDED | EXPIRED | WAIVED"
      - name: suspended_by_plan_id
        type: string
        source: computed
        default: null
        description: "FK -> RedevelopmentPlan.id; set when this clause is suspended by a recorded plan, cleared when that plan is abandoned."

  - name: RadiusRestriction
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease whose tenant is restricted from operating a competing store within the radius."
      - name: radius_miles
        type: number
        source: input
        description: Restricted radius in miles.
        constraints: "> 0"
      - name: measured_from
        type: enum
        source: input
        description: Geometric origin of the radius measurement.
        constraints: "CENTER_BOUNDARY | PREMISES_CENTROID"
      - name: recapture_basis
        type: enum
        source: input
        description: "Selects the recapture variant in calculations.radius_recapture_assessment: GROSS_SALES charges the whole reported offending volume, INCREMENTAL_SALES charges only the excess over protected_baseline_cents."
        constraints: "GROSS_SALES | INCREMENTAL_SALES"
      - name: recapture_pct
        type: number
        source: input
        description: Percentage of the chargeable sales base recaptured as additional rent.
        constraints: "> 0 and <= 100"
      - name: protected_baseline_cents
        type: integer
        source: input
        default: 0
        description: Sales volume exempt from recapture under the INCREMENTAL_SALES basis; ignored under GROSS_SALES.
        constraints: ">= 0"
      - name: window_from_date
        type: string
        source: input
        description: "ISO date; enforcement window start, CLOSED (inclusive)."
      - name: window_through_date
        type: string
        source: input
        description: "ISO date; enforcement window end, CLOSED (inclusive). Two ACTIVE restrictions on the same lease collide when from_a <= through_b AND from_b <= through_a, so touching endpoints DO collide."
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "ACTIVE at creation; EXPIRED when the lease is TERMINATED; WAIVED when a RADIUS notice dispute is UPHELD on grounds SCOPE_INAPPLICABLE."
        constraints: "ACTIVE | WAIVED | EXPIRED"

  - name: UseViolationNotice
    parent: null
    common_fields: true
    fields:
      - name: violating_lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease accused of the prohibited use or radius breach."
      - name: clause_id
        type: string
        source: input
        default: null
        description: "FK -> ExclusiveUseClause.id; mandatory when notice_kind == EXCLUSIVE_USE, must be null when notice_kind == RADIUS."
      - name: radius_restriction_id
        type: string
        source: computed
        default: null
        description: "FK -> RadiusRestriction.id; set only by POST /radius-restrictions/{id}/violation-report, null otherwise."
      - name: notice_kind
        type: enum
        source: input
        description: "EXCLUSIVE_USE cites a benefited clause; PROHIBITED_USE cites the center's prohibited-use list without a clause; RADIUS is minted only by the radius violation-report endpoint."
        constraints: "EXCLUSIVE_USE | PROHIBITED_USE | RADIUS"
      - name: narrative
        type: string
        source: input
        default: ""
        description: Free-text description of the observed violation.
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the issuer; the segregation-of-duties subject compared against the dispute adjudicator.
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock instant at issuance.
      - name: cure_period_days
        type: integer
        source: input
        default: 30
        description: Days the violating tenant has to cure before the notice may be escalated by a compliance sweep.
        constraints: ">= 0"
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "issued_at + cure_period_days days at issuance; re-armed to (adjudicated_at + (cure_period_days + UseViolationDispute.cure_extension_days) days) each time a dispute is DENIED."
      - name: cure_restart_count
        type: integer
        source: computed
        default: 0
        description: Number of times the cure clock has been re-armed by a DENIED dispute; counts the DISPUTED->ISSUED cycles.
      - name: reported_offending_sales_cents
        type: integer
        source: input
        default: 0
        description: Offending in-radius sales volume reported on a RADIUS notice; 0 for other notice kinds.
        constraints: ">= 0"
      - name: recapture_assessed_cents
        type: integer
        source: computed
        default: 0
        description: "Additional rent recaptured per calculations.radius_recapture_assessment; 0 for non-RADIUS notices."
      - name: status
        type: enum
        source: computed
        default: ISSUED
        description: "Cyclic machine: ISSUED -> DISPUTED -> ISSUED is reachable any number of times through DENIED disputes."
        constraints: "ISSUED | DISPUTED | CURED | ESCALATED | WITHDRAWN"
      - name: escalated_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the compliance sweep escalated this notice after the cure deadline lapsed.

  - name: UseViolationDispute
    parent: null
    common_fields: true
    fields:
      - name: notice_id
        type: string
        source: input
        description: "FK -> UseViolationNotice.id; the notice being disputed."
      - name: filed_by_tenant_id
        type: string
        source: system
        description: "FK -> Tenant.id; copied from the violating lease's tenant_id, which must equal the filer's X-User-ID."
      - name: grounds_code
        type: enum
        source: input
        description: Asserted legal grounds; SCOPE_INAPPLICABLE is the only grounds that waives the cited clause or restriction when UPHELD.
        constraints: "NO_PROHIBITED_USE | CARVE_OUT_APPLIES | CLAUSE_EXPIRED | SCOPE_INAPPLICABLE"
      - name: narrative
        type: string
        source: input
        description: Tenant's written grounds.
      - name: cure_extension_days
        type: integer
        source: input
        default: 0
        description: Additional days added to the re-armed cure deadline if this dispute is DENIED.
        constraints: ">= 0 and <= 90"
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: PENDING until adjudicated; UPHELD withdraws the notice, DENIED re-arms the notice cure clock.
        constraints: "PENDING | UPHELD | DENIED | WITHDRAWN"
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the adjudicator; must differ from the notice's issued_by_user_id.
      - name: adjudicated_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of adjudication.

  - name: RemedyElection
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the benefited lease electing the remedy."
      - name: condition_id
        type: string
        source: input
        default: null
        description: "FK -> CoTenancyCondition.id; the breached condition being remedied. Null only for self-help elections sourced from an escalated exclusive-use notice."
      - name: source_notice_id
        type: string
        source: input
        default: null
        description: "FK -> UseViolationNotice.id; the ESCALATED notice that made this lease remedy-eligible. Null for co-tenancy elections."
      - name: election_kind
        type: enum
        source: input
        description: Remedy chosen by the tenant; must be permitted by the condition's remedy_type.
        constraints: "RENT_REDUCTION | TERMINATION | SUBSTITUTE_RENT"
      - name: window_from_date
        type: string
        source: input
        description: "ISO date; abatement window start, INCLUSIVE (half-open [from, through) semantics)."
      - name: window_through_date
        type: string
        source: input
        description: "ISO date; abatement window end, EXCLUSIVE. Adjacent windows (through_a == from_b) do NOT overlap; overlap is permitted but the summed reduction_pct on any covered day must not exceed 100."
      - name: elected_at
        type: datetime
        source: computed
        description: Logical-clock instant of election.
      - name: shortfall_pct_at_election
        type: number
        source: computed
        description: "Occupancy shortfall pinned at election time per calculations.cotenancy_rent_reduction; a fixed SUBSTITUTE_RENT_SHORTFALL_PCT is used for elections sourced from an ESCALATED notice (see that calculation's SUBSTITUTE_RENT branch)."
      - name: anchor_bonus_applied
        type: boolean
        source: computed
        description: "true when calculations.cotenancy_rent_reduction added ANCHOR_DARK_BONUS_PCT because a named AnchorRequirement of the breached condition was unsatisfied at election time; false otherwise. Pinned at election time and never recomputed."
      - name: reduction_pct
        type: number
        source: computed
        description: Abatement percentage pinned at election time; never recomputed after creation.
      - name: reduced_rent_monthly_cents
        type: integer
        source: computed
        description: "round_half_up(Lease.base_rent_monthly_cents * (100 - reduction_pct) / 100) pinned at election time; informational snapshot, distinct from Lease.effective_rent_monthly_cents which sums all active reductions."
      - name: termination_effective_date
        type: string
        source: computed
        default: null
        description: "For TERMINATION elections, window_from_date + 90 days as an ISO date; null for other kinds."
      - name: abated_to_date_cents
        type: integer
        source: computed
        default: 0
        description: "Rounded-to-cents abatement attributable to this election alone per calculations.abatement_ledger_rounding."
      - name: status
        type: enum
        source: computed
        default: ELECTED
        description: "Branching machine: ELECTED forks to REDUCTION_ACTIVE or TERMINATION_SCHEDULED on approval with divergent side-effect sets; RESCINDED is the compensating terminal; CONSUMMATED is reached by sweep or by termination consummation."
        constraints: "ELECTED | REDUCTION_ACTIVE | TERMINATION_SCHEDULED | RESCINDED | CONSUMMATED"
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the AssetManager who approved the election.
      - name: approved_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of approval.

  - name: OccupancyMeasurement
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> ShoppingCenter.id; the measured center."
      - name: variant
        type: enum
        source: input
        description: "SNAPSHOT_STRICT counts only OPEN leases of ACTIVE tenants; TRAILING_GRACE additionally counts recently DARK premises and DEFAULTED tenants. Same lease population, two legitimate percentages."
        constraints: "SNAPSHOT_STRICT | TRAILING_GRACE"
      - name: window_from_date
        type: string
        source: input
        description: "ISO date; measurement period start, INCLUSIVE."
      - name: window_through_date
        type: string
        source: input
        description: "ISO date; measurement period end, EXCLUSIVE. Two non-SUPERSEDED measurements of the same center collide when from_a < through_b AND from_b < through_a, so touching endpoints do NOT collide."
      - name: measured_at
        type: datetime
        source: computed
        description: Logical-clock instant the measurement was taken.
      - name: total_gla_sqft
        type: integer
        source: computed
        description: "ShoppingCenter.total_gla_sqft frozen onto this measurement at measured_at (the denominator actually used); insulates the measurement from later redevelopment remeasurement."
      - name: occupied_gla_sqft
        type: integer
        source: computed
        description: "Sum of Lease.gla_sqft over the leases this variant counted (the numerator actually used); equals ShoppingCenter.occupied_gla_sqft only for the SNAPSHOT_STRICT variant taken with no defaulted tenants."
      - name: gla_occupancy_pct
        type: number
        source: computed
        description: "round_half_up(occupied_gla_sqft / total_gla_sqft * 100, 2) under this row's variant."
      - name: open_store_count
        type: integer
        source: computed
        description: Count of counted-open non-anchor leases under this row's variant.
      - name: open_anchor_count
        type: integer
        source: computed
        description: Count of counted-open anchor leases under this row's variant.
      - name: counted_lease_count
        type: integer
        source: computed
        description: Total counted-open leases under this row's variant.
      - name: excluded_lease_count
        type: integer
        source: computed
        description: "Count of leases of the center with premises_status IN {EXECUTED, OPEN, DARK} that this variant did NOT count."
      - name: breached_condition_count
        type: integer
        source: computed
        default: 0
        description: Count of CoTenancyCondition rows this measurement's certification left in status BREACHED; 0 while status != CERTIFIED.
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "DRAFT at creation; CERTIFIED by POST /occupancy-measurements/{id}/certify; SUPERSEDED when a newer measurement for the same center is created while this one is still DRAFT."
        constraints: "DRAFT | CERTIFIED | SUPERSEDED"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the preparer; the certifier's X-User-ID must differ from this value.
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the certifying ComplianceOfficer.
      - name: certified_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of certification.

  - name: EstoppelCertificate
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease being estopped."
      - name: measurement_id
        type: string
        source: input
        default: null
        description: "FK -> OccupancyMeasurement.id; optional pinned CERTIFIED measurement whose figures the certificate discloses. Null means the certificate discloses live center figures."
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the requesting LenderRep or AssetManager.
      - name: pinned_lease_version
        type: integer
        source: computed
        description: Lease.version observed at request time; any later lease mutation makes this certificate STALE.
      - name: expedite_requested
        type: boolean
        source: input
        default: false
        description: When true, an expedite surcharge tier is applied to the certificate fee.
      - name: disclosed_cotenancy_breach
        type: boolean
        source: computed
        description: True when at least one CoTenancyCondition of the estopped lease has status == BREACHED at request time.
      - name: disclosed_exclusive_count
        type: integer
        source: computed
        description: Count of ExclusiveUseClause rows with status == ACTIVE benefiting the estopped lease at request time.
      - name: disclosed_effective_rent_cents
        type: integer
        source: computed
        description: Lease.effective_rent_monthly_cents at request time.
      - name: base_fee_cents
        type: integer
        source: computed
        description: "Pre-surcharge subtotal per calculations.estoppel_fee_assessment; the surcharge tier is keyed on THIS value, never on total_fee_cents."
      - name: total_fee_cents
        type: integer
        source: computed
        description: base_fee_cents plus the expedite surcharge when expedite_requested is true.
      - name: lender_conditions_met
        type: boolean
        source: computed
        description: "True only when ALL FOUR hold, recomputed at request time, at signing and whenever the certificate goes STALE: (1) status == TENANT_SIGNED, (2) pinned_lease_version still equals Lease.version, (3) Lease.use_compliance_status == CLEAR, and (4) no CoTenancyCondition of the lease is BREACHED OR disclosed_cotenancy_breach == true. Clause (4) means a breach does NOT block acceptance once the certificate discloses it - only an UNDISCLOSED breach does."
      - name: status
        type: enum
        source: computed
        default: REQUESTED
        description: "REQUESTED -> TENANT_SIGNED -> LENDER_ACCEPTED; any lease mutation before acceptance drives the row to STALE; REJECTED is written when a lender declines a STALE certificate."
        constraints: "REQUESTED | TENANT_SIGNED | LENDER_ACCEPTED | STALE | REJECTED"
      - name: signed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the tenant signed.
      - name: accepted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the lender accepted.

  - name: RedevelopmentPlan
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> ShoppingCenter.id; the center being redeveloped."
      - name: pad_parcel_lease_id
        type: string
        source: input
        default: null
        description: "FK -> Lease.id; the pad lease sold or re-demised by this plan. Must have parcel_kind == PAD when supplied."
      - name: plan_kind
        type: enum
        source: input
        description: PAD_SALE conveys a pad parcel; REDEMISE re-splits existing GLA; EXPANSION adds GLA and never removes any.
        constraints: "PAD_SALE | REDEMISE | EXPANSION"
      - name: removed_gla_sqft
        type: integer
        source: input
        default: 0
        description: Square feet removed from the center's denominator when the plan is RECORDED; must be 0 when plan_kind == EXPANSION.
        constraints: ">= 0 and < ShoppingCenter.total_gla_sqft"
      - name: gla_after_sqft
        type: integer
        source: computed
        description: ShoppingCenter.total_gla_sqft minus removed_gla_sqft at plan creation.
      - name: impacted_clause_count
        type: integer
        source: computed
        description: Count of ExclusiveUseClause rows with status == ACTIVE and exclusivity_scope IN {CENTER_WIDE, RADIUS_INCLUSIVE} on non-TERMINATED leases of the center at plan creation.
      - name: impacted_condition_count
        type: integer
        source: computed
        description: Count of ONGOING GLA_PCT CoTenancyCondition rows with status IN {SATISFIED, CURED} that would fail against the post-plan denominator at plan creation.
      - name: consent_required
        type: boolean
        source: computed
        description: True when impacted_clause_count > 0 OR impacted_condition_count > 0.
      - name: status
        type: enum
        source: computed
        default: PLANNED
        description: "CONSENT_PENDING at creation when consent_required is true, otherwise PLANNED; RECORDED applies the plan; ABANDONED reverses it exactly."
        constraints: "PLANNED | CONSENT_PENDING | RECORDED | ABANDONED"
      - name: recorded_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the plan was recorded.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Lease
    dimension: premises_status
    note: "Parallel dimension 1 of 2 on Lease; evolves independently of remedy_status."
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /leases/{id}/execute"
        actor: LeaseAdministrator
        preconditions:
          - "ShoppingCenter(center_id).compliance_posture != FROZEN"
          - "no other Lease of this center with premises_status != TERMINATED has the same suite_code"
          - "calculations.exclusive_use_screening for this lease returns decision == CLEAR"
          - "expiration_date > commencement_date"
        side_effects:
          - "premises_status := EXECUTED; version += 1; updated_at refreshed"
          - "ShoppingCenter.compliance_posture recomputed per calculations.center_posture_derivation (occupancy figures unchanged because EXECUTED premises are not counted open)"
      - from: EXECUTED
        to: OPEN
        trigger: "POST /leases/{id}/open"
        actor: LeaseAdministrator | TenantRep
        preconditions:
          - "ShoppingCenter(center_id).compliance_posture != FROZEN"
          - "every CoTenancyCondition of this lease with condition_kind == OPENING evaluates satisfied per calculations.cotenancy_condition_evaluation against the controlling figures (latest CERTIFIED OccupancyMeasurement of the center ordered by measured_at DESC then created_at DESC; live LIVE_STRICT center figures when the center has no CERTIFIED measurement)"
        side_effects:
          - "premises_status := OPEN; opened_at := logical clock now; dark_since := null; version += 1"
          - "ShoppingCenter.occupied_gla_sqft, open_occupancy_pct, operating_store_count, open_anchor_count, aggregate_effective_rent_cents recomputed"
          - "every ONGOING CoTenancyCondition of this center re-evaluated LIVE_STRICT per calculations.cotenancy_condition_evaluation"
          - "ShoppingCenter.compliance_posture recomputed"
      - from: OPEN
        to: DARK
        trigger: "POST /leases/{id}/go-dark"
        actor: LeaseAdministrator | TenantRep
        preconditions:
          - "premises_status == OPEN"
        side_effects:
          - "HOP 1: premises_status := DARK; dark_since := logical clock now; version += 1"
          - "HOP 2 (caused by HOP 1: the lease is no longer counted open): ShoppingCenter.occupied_gla_sqft -= Lease.gla_sqft, open_occupancy_pct recomputed, operating_store_count/open_anchor_count decremented per is_anchor"
          - "HOP 3 (caused by HOP 2: the center's occupancy figures moved): every ONGOING CoTenancyCondition of this center is re-evaluated LIVE_STRICT; conditions that now fail flip SATISFIED|CURED -> BREACHED with breach_detected_at := now and consecutive_breach_days := 0"
          - "HOP 4 (caused by HOP 3: a condition flipped to BREACHED): the benefited Lease of each newly BREACHED condition moves remedy_status NONE -> ELIGIBLE with remedy_eligible_at := now when CoTenancyCondition.grace_period_days == 0, bumping that lease's version; ShoppingCenter.compliance_posture recomputed to BREACH or FROZEN"
          - "HOP 5 (caused by HOP 4: the benefited lease's version advanced): every EstoppelCertificate of that benefited lease with status IN {REQUESTED, TENANT_SIGNED} flips to STALE and its lender_conditions_met is recomputed to false"
      - from: DARK
        to: OPEN
        trigger: "POST /leases/{id}/reopen"
        actor: LeaseAdministrator | TenantRep
        note: "Cycle OPEN->DARK->OPEN; the compensating action of go-dark for invariant occupancy_gla_conservation."
        preconditions:
          - "premises_status == DARK"
          - "Tenant(tenant_id).status != BANKRUPT"
        side_effects:
          - "premises_status := OPEN; opened_at := now; dark_since := null; version += 1"
          - "ShoppingCenter.occupied_gla_sqft += Lease.gla_sqft, open_occupancy_pct, operating_store_count, open_anchor_count restored"
          - "every ONGOING CoTenancyCondition of this center re-evaluated LIVE_STRICT; conditions that now pass flip BREACHED -> CURED with breach_detected_at := null and consecutive_breach_days := 0"
          - "benefited leases whose only breach cured move remedy_status ELIGIBLE -> NONE (remedy_eligible_at := null); leases with a REDUCTION_ACTIVE election keep remedy_status REMEDY_ACTIVE"
          - "ShoppingCenter.compliance_posture recomputed"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: AssetManager
        preconditions:
          - "premises_status IN {EXECUTED, OPEN, DARK}"
        side_effects:
          - "premises_status := TERMINATED; version += 1"
          - "every ExclusiveUseClause of this lease with status IN {ACTIVE, SUSPENDED} := EXPIRED; every RadiusRestriction of this lease with status == ACTIVE := EXPIRED"
          - "ShoppingCenter.protected_exclusive_count recomputed"
      - from: OPEN
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: AssetManager
        preconditions:
          - "premises_status IN {EXECUTED, OPEN, DARK}"
        side_effects:
          - "premises_status := TERMINATED; dark_since := null; version += 1"
          - "every ExclusiveUseClause of this lease with status IN {ACTIVE, SUSPENDED} := EXPIRED; every RadiusRestriction with status == ACTIVE := EXPIRED"
          - "ShoppingCenter.occupied_gla_sqft, open_occupancy_pct, operating_store_count, open_anchor_count, aggregate_effective_rent_cents, protected_exclusive_count recomputed"
          - "every ONGOING CoTenancyCondition of this center re-evaluated LIVE_STRICT (conditions of THIS lease are skipped once the lease is TERMINATED)"
          - "ShoppingCenter.compliance_posture recomputed"
      - from: DARK
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: AssetManager
        preconditions:
          - "premises_status IN {EXECUTED, OPEN, DARK}"
        side_effects:
          - "premises_status := TERMINATED; dark_since := null; version += 1"
          - "clauses and radius restrictions of this lease EXPIRED; center derived fields and posture recomputed as in OPEN -> TERMINATED"

  - entity: Lease
    dimension: remedy_status
    note: "Parallel dimension 2 of 2 on Lease; a single row can be premises_status == DARK while remedy_status == REMEDY_ACTIVE."
    initial_state: NONE
    terminal_states: [TERMINATED_BY_REMEDY]
    transitions:
      - from: NONE
        to: ELIGIBLE
        trigger: "system event: CoTenancyCondition of this lease flips to BREACHED with grace_period_days == 0, or POST /centers/{id}/compliance-sweep observes consecutive_breach_days >= grace_period_days, or a UseViolationNotice citing a clause of this lease is ESCALATED by a sweep"
        actor: system
        preconditions:
          - "premises_status IN {EXECUTED, OPEN, DARK}"
          - "at least one CoTenancyCondition of this lease has status == BREACHED, or at least one ExclusiveUseClause of this lease is cited by an ESCALATED UseViolationNotice"
        side_effects:
          - "remedy_status := ELIGIBLE; remedy_eligible_at := logical clock now; version += 1"
          - "EstoppelCertificate rows of this lease with status IN {REQUESTED, TENANT_SIGNED} flip to STALE (pinned_lease_version < version)"
      - from: ELIGIBLE
        to: REMEDY_ACTIVE
        trigger: "POST /remedy-elections/{id}/approve where election_kind IN {RENT_REDUCTION, SUBSTITUTE_RENT}"
        actor: AssetManager
        preconditions:
          - "remedy_status == ELIGIBLE"
          - "RemedyElection.status == ELECTED"
        side_effects:
          - "remedy_status := REMEDY_ACTIVE; effective_rent_monthly_cents recomputed; total_abated_cents recomputed; version += 1"
          - "ShoppingCenter.aggregate_effective_rent_cents recomputed"
      - from: ELIGIBLE
        to: TERMINATION_PENDING
        trigger: "POST /remedy-elections/{id}/approve where election_kind == TERMINATION"
        actor: AssetManager
        preconditions:
          - "remedy_status == ELIGIBLE"
          - "CoTenancyCondition.consecutive_breach_days >= CoTenancyCondition.cure_period_days"
        side_effects:
          - "remedy_status := TERMINATION_PENDING; version += 1"
          - "effective_rent_monthly_cents unchanged (no abatement attaches to a termination election)"
      - from: REMEDY_ACTIVE
        to: ELIGIBLE
        trigger: "POST /remedy-elections/{id}/rescind, or POST /centers/{id}/compliance-sweep consummating the last REDUCTION_ACTIVE election while the condition is still BREACHED"
        actor: AssetManager | TenantRep | system
        preconditions:
          - "no RemedyElection of this lease remains in status REDUCTION_ACTIVE after this transition"
          - "at least one CoTenancyCondition of this lease still has status == BREACHED"
        side_effects:
          - "remedy_status := ELIGIBLE; effective_rent_monthly_cents recomputed; total_abated_cents recomputed; version += 1"
          - "ShoppingCenter.aggregate_effective_rent_cents recomputed"
      - from: REMEDY_ACTIVE
        to: NONE
        trigger: "system event: last BREACHED CoTenancyCondition of this lease flips to CURED and no RemedyElection of this lease remains REDUCTION_ACTIVE"
        actor: system
        preconditions:
          - "every CoTenancyCondition of this lease has status IN {SATISFIED, CURED, WAIVED}"
          - "no RemedyElection of this lease has status IN {ELECTED, REDUCTION_ACTIVE, TERMINATION_SCHEDULED}"
        side_effects:
          - "remedy_status := NONE; remedy_eligible_at := null; effective_rent_monthly_cents := base_rent_monthly_cents; version += 1"
          - "ShoppingCenter.aggregate_effective_rent_cents recomputed"
      - from: ELIGIBLE
        to: NONE
        trigger: "system event: every CoTenancyCondition of this lease is CURED/SATISFIED and no ESCALATED notice cites a clause of this lease"
        actor: system
        preconditions:
          - "no CoTenancyCondition of this lease has status == BREACHED"
          - "no RemedyElection of this lease has status IN {ELECTED, REDUCTION_ACTIVE, TERMINATION_SCHEDULED}"
        side_effects:
          - "remedy_status := NONE; remedy_eligible_at := null; version += 1"
      - from: TERMINATION_PENDING
        to: TERMINATED_BY_REMEDY
        trigger: "POST /centers/{id}/compliance-sweep on or after RemedyElection.termination_effective_date"
        actor: system
        preconditions:
          - "a RemedyElection of this lease has status == TERMINATION_SCHEDULED and termination_effective_date <= sweep as_of date"
        side_effects:
          - "remedy_status := TERMINATED_BY_REMEDY; premises_status := TERMINATED; version += 1"
          - "RemedyElection.status := CONSUMMATED"
          - "ExclusiveUseClause and RadiusRestriction rows of this lease EXPIRED; ShoppingCenter derived fields, protected_exclusive_count and compliance_posture recomputed"
      - from: TERMINATION_PENDING
        to: ELIGIBLE
        trigger: "POST /remedy-elections/{id}/rescind"
        actor: AssetManager | TenantRep
        preconditions:
          - "RemedyElection.status == TERMINATION_SCHEDULED"
        side_effects:
          - "remedy_status := ELIGIBLE; version += 1"
          - "RemedyElection.status := RESCINDED; termination_effective_date retained for audit"

  - entity: CoTenancyCondition
    dimension: status
    note: "Cyclic: BREACHED -> CURED -> BREACHED is reachable whenever occupancy oscillates."
    initial_state: SATISFIED
    terminal_states: [WAIVED]
    transitions:
      - from: SATISFIED
        to: BREACHED
        trigger: "system event: LIVE_STRICT evaluation on any lease/tenant status change, or CERTIFIED_MEASUREMENT evaluation on POST /occupancy-measurements/{id}/certify"
        actor: system
        preconditions:
          - "Lease(lease_id).premises_status != TERMINATED"
          - "condition_kind == ONGOING and Lease(lease_id).premises_status IN {OPEN, DARK}, or condition_kind == OPENING and Lease(lease_id).premises_status == EXECUTED"
          - "calculations.cotenancy_condition_evaluation returns satisfied == false"
        side_effects:
          - "status := BREACHED; breach_detected_at := evaluation instant; consecutive_breach_days := 0; version += 1"
          - "last_evaluated_measurement_id := the certifying measurement's id when the evaluation source is CERTIFIED_MEASUREMENT; unchanged when LIVE_STRICT"
          - "Lease(lease_id).remedy_status NONE -> ELIGIBLE when grace_period_days == 0"
          - "ShoppingCenter.compliance_posture recomputed"
      - from: BREACHED
        to: CURED
        trigger: "system event: LIVE_STRICT or CERTIFIED_MEASUREMENT evaluation returning satisfied == true"
        actor: system
        preconditions:
          - "calculations.cotenancy_condition_evaluation returns satisfied == true"
        side_effects:
          - "status := CURED; breach_detected_at := null; consecutive_breach_days := 0; version += 1"
          - "Lease(lease_id).remedy_status ELIGIBLE -> NONE when no other BREACHED condition and no live election; REMEDY_ACTIVE is retained until the election is rescinded or consummated"
          - "ShoppingCenter.compliance_posture recomputed"
      - from: CURED
        to: BREACHED
        trigger: "system event: a later LIVE_STRICT or CERTIFIED_MEASUREMENT evaluation returning satisfied == false"
        actor: system
        preconditions:
          - "calculations.cotenancy_condition_evaluation returns satisfied == false"
        side_effects:
          - "status := BREACHED; breach_detected_at := evaluation instant (a NEW breach episode); consecutive_breach_days := 0; version += 1"
          - "Lease(lease_id).remedy_status NONE -> ELIGIBLE when grace_period_days == 0"
      - from: BREACHED
        to: BREACHED
        trigger: "system event: a later evaluation while still failing, or POST /centers/{id}/compliance-sweep"
        actor: system
        preconditions:
          - "status == BREACHED and calculations.cotenancy_condition_evaluation still returns satisfied == false"
        side_effects:
          - "consecutive_breach_days := days_between(breach_detected_at, evaluation instant); breach_detected_at unchanged; version += 1"
          - "Lease(lease_id).remedy_status NONE -> ELIGIBLE when consecutive_breach_days >= grace_period_days"
      - from: SATISFIED
        to: WAIVED
        trigger: "POST /co-tenancy-conditions/{id}/waive, or POST /redevelopment-plans/{id}/record where pad_parcel_lease_id == this condition's lease_id"
        actor: AssetManager
        preconditions:
          - "status IN {SATISFIED, CURED, BREACHED}"
        side_effects:
          - "status := WAIVED; breach_detected_at := null; version += 1"
      - from: CURED
        to: WAIVED
        trigger: "POST /co-tenancy-conditions/{id}/waive, or POST /redevelopment-plans/{id}/record where pad_parcel_lease_id == this condition's lease_id"
        actor: AssetManager
        preconditions:
          - "status IN {SATISFIED, CURED, BREACHED}"
        side_effects:
          - "status := WAIVED; breach_detected_at := null; consecutive_breach_days := 0; version += 1"
      - from: BREACHED
        to: WAIVED
        trigger: "POST /co-tenancy-conditions/{id}/waive, or POST /redevelopment-plans/{id}/record where pad_parcel_lease_id == this condition's lease_id"
        actor: AssetManager
        preconditions:
          - "status IN {SATISFIED, CURED, BREACHED}"
        side_effects:
          - "status := WAIVED; breach_detected_at := null; consecutive_breach_days := 0; version += 1"
          - "Lease(lease_id).remedy_status ELIGIBLE -> NONE when this was the lease's only BREACHED condition"
          - "every RemedyElection naming this condition with status == ELECTED is RESCINDED and its reduction reversed"
          - "ShoppingCenter.compliance_posture recomputed: the condition leaves the breached population, so FROZEN can fall back to BREACH or COMPLIANT"

  - entity: UseViolationNotice
    dimension: status
    note: "Cyclic: ISSUED -> DISPUTED -> ISSUED each time a dispute is DENIED, re-arming the cure clock and incrementing cure_restart_count."
    initial_state: ISSUED
    terminal_states: [CURED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /use-violation-notices/{id}/disputes"
        actor: TenantRep
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == Lease(violating_lease_id).tenant_id"
          - "no UseViolationDispute of this notice has status == PENDING"
        side_effects:
          - "status := DISPUTED; version += 1"
          - "Lease(violating_lease_id).use_compliance_status recomputed to UNDER_NOTICE"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /use-violation-disputes/{id}/adjudicate with outcome DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "status == DISPUTED"
          - "UseViolationDispute.status == PENDING"
          - "X-User-ID != issued_by_user_id"
        side_effects:
          - "status := ISSUED; cure_restart_count += 1; cure_deadline_at := adjudicated_at + (cure_period_days + UseViolationDispute.cure_extension_days) days; version += 1"
      - from: DISPUTED
        to: WITHDRAWN
        trigger: "POST /use-violation-disputes/{id}/adjudicate with outcome UPHELD"
        actor: ComplianceOfficer
        preconditions:
          - "status == DISPUTED"
          - "UseViolationDispute.status == PENDING"
          - "X-User-ID != issued_by_user_id"
        side_effects:
          - "status := WITHDRAWN; version += 1"
          - "when grounds_code == SCOPE_INAPPLICABLE: the cited ExclusiveUseClause status ACTIVE -> WAIVED, or the cited RadiusRestriction status ACTIVE -> WAIVED; ShoppingCenter.protected_exclusive_count recomputed"
          - "Lease(violating_lease_id).use_compliance_status recomputed; ShoppingCenter.open_violation_count decremented; compliance_posture recomputed"
      - from: ISSUED
        to: CURED
        trigger: "POST /use-violation-notices/{id}/cure"
        actor: LeaseAdministrator | ComplianceOfficer
        preconditions:
          - "status IN {ISSUED, ESCALATED}"
          - "no UseViolationDispute of this notice has status == PENDING"
        side_effects:
          - "status := CURED; version += 1"
          - "Lease(violating_lease_id).use_compliance_status recomputed; ShoppingCenter.open_violation_count decremented; compliance_posture recomputed"
      - from: ESCALATED
        to: CURED
        trigger: "POST /use-violation-notices/{id}/cure"
        actor: LeaseAdministrator | ComplianceOfficer
        preconditions:
          - "status IN {ISSUED, ESCALATED}"
          - "no UseViolationDispute of this notice has status == PENDING"
        side_effects:
          - "status := CURED; version += 1"
          - "Lease(violating_lease_id).use_compliance_status recomputed to CLEAR when no other ISSUED/DISPUTED/ESCALATED notice remains"
          - "the benefited Lease of the cited clause keeps remedy_status ELIGIBLE until its elections are rescinded"
      - from: ISSUED
        to: ESCALATED
        trigger: "POST /use-violation-notices/{id}/escalate, or POST /centers/{id}/compliance-sweep where cure_deadline_at <= sweep as_of"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "cure_deadline_at <= sweep as_of instant"
          - "no UseViolationDispute of this notice has status == PENDING"
        side_effects:
          - "HOP 1: status := ESCALATED; escalated_at := sweep as_of; version += 1"
          - "HOP 2 (caused by HOP 1: an escalated notice exists against the premises): Lease(violating_lease_id).use_compliance_status := IN_VIOLATION and that lease's version += 1"
          - "HOP 3 (caused by HOP 2: the violating lease's version advanced past the pinned value): every EstoppelCertificate of the violating lease with status IN {REQUESTED, TENANT_SIGNED} flips to STALE"
          - "HOP 4 (caused by HOP 3: the certificate is no longer current): each STALE certificate's lender_conditions_met is recomputed to false"
          - "fan-out (not part of the hop chain): for an EXCLUSIVE_USE notice, the benefited Lease of clause_id moves remedy_status NONE -> ELIGIBLE with remedy_eligible_at := sweep as_of; ShoppingCenter.compliance_posture recomputed"
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /use-violation-notices/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {ISSUED, ESCALATED}"
        side_effects:
          - "status := WITHDRAWN; version += 1"
          - "Lease(violating_lease_id).use_compliance_status recomputed to CLEAR when no other ISSUED/DISPUTED/ESCALATED notice remains; ShoppingCenter.open_violation_count decremented; compliance_posture recomputed"
      - from: ESCALATED
        to: WITHDRAWN
        trigger: "POST /use-violation-notices/{id}/withdraw"
        actor: ComplianceOfficer
        note: "Compensating transition: reverses the full HOP 1-4 escalation chain."
        preconditions:
          - "status IN {ISSUED, ESCALATED}"
        side_effects:
          - "status := WITHDRAWN; escalated_at := null; version += 1"
          - "Lease(violating_lease_id).use_compliance_status IN_VIOLATION -> CLEAR (or UNDER_NOTICE when another ISSUED notice remains)"
          - "the benefited Lease of clause_id returns remedy_status ELIGIBLE -> NONE when this notice was its only escalation source and no CoTenancyCondition of that lease is BREACHED"
          - "ShoppingCenter.open_violation_count decremented; compliance_posture recomputed"

  - entity: UseViolationDispute
    dimension: status
    initial_state: PENDING
    terminal_states: [UPHELD, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: UPHELD
        trigger: "POST /use-violation-disputes/{id}/adjudicate with outcome UPHELD"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING"
          - "X-User-ID != UseViolationNotice.issued_by_user_id"
        side_effects:
          - "status := UPHELD; adjudicated_by_user_id := X-User-ID; adjudicated_at := now; version += 1"
          - "UseViolationNotice DISPUTED -> WITHDRAWN with its own side effects"
      - from: PENDING
        to: DENIED
        trigger: "POST /use-violation-disputes/{id}/adjudicate with outcome DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING"
          - "X-User-ID != UseViolationNotice.issued_by_user_id"
        side_effects:
          - "status := DENIED; adjudicated_by_user_id := X-User-ID; adjudicated_at := now; version += 1"
          - "UseViolationNotice DISPUTED -> ISSUED with cure clock re-armed"
      - from: PENDING
        to: WITHDRAWN
        trigger: "system event: POST /use-violation-notices/{id}/cure is impossible while a dispute is PENDING, so this transition fires only when the cited clause is EXPIRED by lease termination"
        actor: system
        preconditions:
          - "the cited ExclusiveUseClause.status == EXPIRED or the cited RadiusRestriction.status == EXPIRED"
        side_effects:
          - "status := WITHDRAWN; version += 1"
          - "UseViolationNotice status := WITHDRAWN"

  - entity: RemedyElection
    dimension: status
    note: "Branching fork-join: ELECTED forks into REDUCTION_ACTIVE or TERMINATION_SCHEDULED with disjoint side-effect sets, and both branches join at CONSUMMATED."
    initial_state: ELECTED
    terminal_states: [RESCINDED, CONSUMMATED]
    transitions:
      - from: ELECTED
        to: REDUCTION_ACTIVE
        trigger: "POST /remedy-elections/{id}/approve where election_kind IN {RENT_REDUCTION, SUBSTITUTE_RENT}"
        actor: AssetManager
        preconditions:
          - "status == ELECTED"
          - "Lease(lease_id).remedy_status IN {ELIGIBLE, REMEDY_ACTIVE}"
          - "window_from_date < window_through_date and the window lies within [Lease.commencement_date, Lease.expiration_date]"
          - "for every date covered by this election's half-open window, the sum of reduction_pct over REDUCTION_ACTIVE elections of this lease covering that date plus this election's reduction_pct is <= 100"
        side_effects:
          - "status := REDUCTION_ACTIVE; approved_by_user_id := X-User-ID; approved_at := now; version += 1"
          - "Lease.remedy_status := REMEDY_ACTIVE; Lease.effective_rent_monthly_cents recomputed (sum-then-round); Lease.total_abated_cents recomputed (round-then-sum); Lease.version += 1"
          - "ShoppingCenter.aggregate_effective_rent_cents recomputed"
      - from: ELECTED
        to: TERMINATION_SCHEDULED
        trigger: "POST /remedy-elections/{id}/approve where election_kind == TERMINATION"
        actor: AssetManager
        preconditions:
          - "status == ELECTED"
          - "Lease(lease_id).remedy_status IN {ELIGIBLE, REMEDY_ACTIVE}"
          - "CoTenancyCondition(condition_id).remedy_type IN {RENT_REDUCTION_THEN_TERMINATION, TERMINATION_ONLY}"
          - "CoTenancyCondition(condition_id).consecutive_breach_days >= CoTenancyCondition(condition_id).cure_period_days"
        side_effects:
          - "status := TERMINATION_SCHEDULED; approved_by_user_id := X-User-ID; approved_at := now; termination_effective_date := window_from_date + 90 days; version += 1"
          - "Lease.remedy_status := TERMINATION_PENDING; Lease.version += 1; Lease.effective_rent_monthly_cents unchanged"
          - "ShoppingCenter.aggregate_effective_rent_cents unchanged (no abatement attaches)"
      - from: ELECTED
        to: RESCINDED
        trigger: "POST /remedy-elections/{id}/rescind, or POST /leases/{id}/remedy-elections superseding a prior ELECTED election on the same lease"
        actor: AssetManager | TenantRep | system
        preconditions:
          - "status == ELECTED"
        side_effects:
          - "status := RESCINDED; version += 1"
          - "Lease.remedy_status unchanged (an unapproved election never moved it)"
      - from: REDUCTION_ACTIVE
        to: RESCINDED
        trigger: "POST /remedy-elections/{id}/rescind"
        actor: AssetManager | TenantRep
        note: "Compensating action of the ELECTED -> REDUCTION_ACTIVE branch; abatement is reversed retroactively and in full."
        preconditions:
          - "status == REDUCTION_ACTIVE"
        side_effects:
          - "status := RESCINDED; abated_to_date_cents := 0; version += 1"
          - "Lease.total_abated_cents recomputed excluding this election; Lease.effective_rent_monthly_cents recomputed; Lease.remedy_status REMEDY_ACTIVE -> ELIGIBLE when no REDUCTION_ACTIVE election remains and a BREACHED condition remains, or -> NONE when no BREACHED condition remains; Lease.version += 1"
          - "ShoppingCenter.aggregate_effective_rent_cents recomputed and restored to its pre-approval value"
      - from: TERMINATION_SCHEDULED
        to: RESCINDED
        trigger: "POST /remedy-elections/{id}/rescind"
        actor: AssetManager | TenantRep
        preconditions:
          - "status == TERMINATION_SCHEDULED"
        side_effects:
          - "status := RESCINDED; version += 1"
          - "Lease.remedy_status TERMINATION_PENDING -> ELIGIBLE; Lease.version += 1"
      - from: REDUCTION_ACTIVE
        to: CONSUMMATED
        trigger: "POST /remedy-elections/{id}/consummate, or POST /centers/{id}/compliance-sweep where window_through_date <= sweep as_of date"
        actor: system
        preconditions:
          - "status == REDUCTION_ACTIVE and window_through_date <= sweep as_of date"
        side_effects:
          - "status := CONSUMMATED; abated_to_date_cents frozen at its final value; version += 1"
          - "Lease.effective_rent_monthly_cents recomputed (the window no longer covers today); Lease.remedy_status REMEDY_ACTIVE -> ELIGIBLE when a BREACHED condition remains, else -> NONE; Lease.version += 1"
          - "ShoppingCenter.aggregate_effective_rent_cents recomputed"
      - from: TERMINATION_SCHEDULED
        to: CONSUMMATED
        trigger: "POST /remedy-elections/{id}/consummate, or POST /centers/{id}/compliance-sweep where termination_effective_date <= sweep as_of date"
        actor: AssetManager | system
        preconditions:
          - "status == TERMINATION_SCHEDULED and termination_effective_date <= the current logical clock date"
        side_effects:
          - "status := CONSUMMATED; version += 1"
          - "Lease.remedy_status := TERMINATED_BY_REMEDY; Lease.premises_status := TERMINATED; clauses/restrictions EXPIRED; center derived fields, protected_exclusive_count and compliance_posture recomputed"

  - entity: OccupancyMeasurement
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /occupancy-measurements/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "X-User-ID != created_by_user_id"
          - "no other CERTIFIED OccupancyMeasurement of the same center has a half-open window overlapping this row's [window_from_date, window_through_date)"
        side_effects:
          - "status := CERTIFIED; certified_by_user_id := X-User-ID; certified_at := now; version += 1"
          - "every CoTenancyCondition of the center is re-evaluated with evaluation source CERTIFIED_MEASUREMENT using THIS row's variant figures; each evaluated condition's last_evaluated_measurement_id := this row's id"
          - "breached_condition_count := count of conditions of the center left in status BREACHED after the evaluation"
          - "benefited leases move remedy_status per the CoTenancyCondition transitions; ShoppingCenter.compliance_posture recomputed"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /centers/{id}/occupancy-measurements creating a newer measurement for the same center"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "status := SUPERSEDED; version += 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /occupancy-measurements/{id}/supersede"
        actor: ComplianceOfficer
        note: "Compensating transition: releases every condition this measurement controlled back to the LIVE_STRICT engine, which can immediately re-BREACH a condition that the TRAILING_GRACE figures had cured."
        preconditions:
          - "status == CERTIFIED"
        side_effects:
          - "status := SUPERSEDED; version += 1"
          - "every CoTenancyCondition whose last_evaluated_measurement_id == this row's id has that field cleared to null and is re-evaluated with evaluation source LIVE_STRICT"
          - "ShoppingCenter.compliance_posture recomputed"

  - entity: EstoppelCertificate
    dimension: status
    initial_state: REQUESTED
    terminal_states: [LENDER_ACCEPTED, REJECTED]
    transitions:
      - from: REQUESTED
        to: TENANT_SIGNED
        trigger: "POST /estoppel-certificates/{id}/sign"
        actor: TenantRep
        preconditions:
          - "status == REQUESTED"
          - "pinned_lease_version == Lease(lease_id).version"
          - "X-User-ID == Lease(lease_id).tenant_id"
        side_effects:
          - "status := TENANT_SIGNED; signed_at := now; version += 1"
      - from: TENANT_SIGNED
        to: LENDER_ACCEPTED
        trigger: "POST /estoppel-certificates/{id}/accept"
        actor: LenderRep
        preconditions:
          - "status == TENANT_SIGNED"
          - "pinned_lease_version == Lease(lease_id).version"
          - "lender_conditions_met == true"
        side_effects:
          - "status := LENDER_ACCEPTED; accepted_at := now; version += 1"
      - from: REQUESTED
        to: STALE
        trigger: "system event: any mutation bumping Lease(lease_id).version above pinned_lease_version"
        actor: system
        preconditions:
          - "status IN {REQUESTED, TENANT_SIGNED}"
          - "pinned_lease_version < Lease(lease_id).version"
        side_effects:
          - "status := STALE; lender_conditions_met := false; version += 1"
      - from: TENANT_SIGNED
        to: STALE
        trigger: "system event: any mutation bumping Lease(lease_id).version above pinned_lease_version"
        actor: system
        preconditions:
          - "status IN {REQUESTED, TENANT_SIGNED}"
          - "pinned_lease_version < Lease(lease_id).version"
        side_effects:
          - "status := STALE; lender_conditions_met := false; version += 1"
      - from: STALE
        to: REJECTED
        trigger: "POST /estoppel-certificates/{id}/reject"
        actor: LenderRep | AssetManager
        preconditions:
          - "status IN {REQUESTED, TENANT_SIGNED, STALE}"
        side_effects:
          - "status := REJECTED; version += 1"
          - "total_fee_cents is NOT refunded or zeroed - the fee survives rejection"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /estoppel-certificates/{id}/reject"
        actor: LenderRep | AssetManager
        preconditions:
          - "status IN {REQUESTED, TENANT_SIGNED, STALE}"
        side_effects:
          - "status := REJECTED; version += 1"
      - from: TENANT_SIGNED
        to: REJECTED
        trigger: "POST /estoppel-certificates/{id}/reject"
        actor: LenderRep | AssetManager
        preconditions:
          - "status IN {REQUESTED, TENANT_SIGNED, STALE}"
        side_effects:
          - "status := REJECTED; version += 1"
        note: "Accepting a STALE certificate is rejected with ERR_CERTIFICATE_STALE (409) and mutates nothing; only an explicit reject moves a STALE row to REJECTED."

  - entity: RedevelopmentPlan
    dimension: status
    initial_state: PLANNED
    terminal_states: [ABANDONED]
    transitions:
      - from: PLANNED
        to: RECORDED
        trigger: "POST /redevelopment-plans/{id}/record"
        actor: AssetManager
        preconditions:
          - "status == PLANNED (consent_required == false)"
        side_effects:
          - "status := RECORDED; recorded_at := now; version += 1"
          - "ShoppingCenter.total_gla_sqft -= removed_gla_sqft; occupied_gla_sqft unchanged; open_occupancy_pct recomputed on the smaller denominator; redevelopment_status := RECORDED"
          - "every ONGOING CoTenancyCondition of the center re-evaluated LIVE_STRICT"
      - from: CONSENT_PENDING
        to: RECORDED
        trigger: "POST /redevelopment-plans/{id}/record with consent_confirmed == true"
        actor: AssetManager
        preconditions:
          - "status == CONSENT_PENDING"
          - "consent_confirmed == true in the request body"
        side_effects:
          - "status := RECORDED; recorded_at := now; version += 1"
          - "every ExclusiveUseClause of the center with status == ACTIVE and exclusivity_scope == CENTER_WIDE := SUSPENDED with suspended_by_plan_id := this plan's id (RADIUS_INCLUSIVE clauses survive the pad sale unchanged)"
          - "ShoppingCenter.protected_exclusive_count recomputed; total_gla_sqft -= removed_gla_sqft; open_occupancy_pct recomputed; redevelopment_status := RECORDED"
          - "when pad_parcel_lease_id is not null: every CoTenancyCondition of that pad lease := WAIVED"
          - "every ONGOING CoTenancyCondition of the center re-evaluated LIVE_STRICT on the smaller denominator"
      - from: RECORDED
        to: ABANDONED
        trigger: "POST /redevelopment-plans/{id}/abandon"
        actor: AssetManager
        note: "Compensating action of record; restores every conserved quantity exactly."
        preconditions:
          - "status == RECORDED"
        side_effects:
          - "status := ABANDONED; recorded_at retained for audit; version += 1"
          - "every ExclusiveUseClause with suspended_by_plan_id == this plan's id := ACTIVE with suspended_by_plan_id := null"
          - "ShoppingCenter.total_gla_sqft += removed_gla_sqft; open_occupancy_pct recomputed; protected_exclusive_count recomputed; redevelopment_status := NONE when no other plan of this center is RECORDED or PLANNED"
          - "every ONGOING CoTenancyCondition of the center re-evaluated LIVE_STRICT on the restored denominator"
      - from: PLANNED
        to: ABANDONED
        trigger: "POST /redevelopment-plans/{id}/abandon"
        actor: AssetManager
        preconditions:
          - "status IN {PLANNED, CONSENT_PENDING}"
        side_effects:
          - "status := ABANDONED; version += 1"
          - "ShoppingCenter.redevelopment_status := NONE when no other plan of this center is RECORDED or PLANNED"
      - from: CONSENT_PENDING
        to: ABANDONED
        trigger: "POST /redevelopment-plans/{id}/abandon"
        actor: AssetManager
        preconditions:
          - "status IN {PLANNED, CONSENT_PENDING}"
        side_effects:
          - "status := ABANDONED; version += 1"
          - "ShoppingCenter.redevelopment_status := NONE when no other plan of this center is RECORDED or PLANNED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: measurement-create-stale-center
    parent_entity: ShoppingCenter
    write_endpoint: "POST /centers/{id}/occupancy-measurements"
    occ_field: "expected_center_version"
    description: |
      Creating an OccupancyMeasurement against a ShoppingCenter whose version has
      advanced beyond the value the client last observed is rejected. Creation is a
      supersede operation — it moves every other DRAFT measurement of the center to
      SUPERSEDED — so a writer holding a stale view of the center would silently
      discard a measurement prepared from figures it never saw.
    error_id: ERR_STALE_CENTER_VERSION
    http_status: 412
  - rule_id: election-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /leases/{id}/remedy-elections"
    occ_field: "expected_lease_version"
    description: |
      Creating a RemedyElection against a Lease whose version has advanced beyond the
      value the client last observed is rejected. Creation legitimately supersedes any
      prior ELECTED (unapproved) election on the lease by moving it to RESCINDED, so a
      stale-view writer would discard an election elected against different occupancy
      figures.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: occupancy_measurement_snapshot
    trigger: "POST /centers/{id}/occupancy-measurements (all output fields), and the LIVE_STRICT recompute of ShoppingCenter.occupied_gla_sqft / open_occupancy_pct / operating_store_count / open_anchor_count on Lease EXECUTED->OPEN, OPEN->DARK, DARK->OPEN, *->TERMINATED, PATCH /tenants/{id}, and RedevelopmentPlan record/abandon"
    algorithm: aggregation
    formula: |
      # counted_open(lease, variant, at_instant) — the ONLY inclusion predicate
      counted_open(L, SNAPSHOT_STRICT, T):
          return L.premises_status == "OPEN" and Tenant(L.tenant_id).status == "ACTIVE"

      counted_open(L, TRAILING_GRACE, T):
          if Tenant(L.tenant_id).status == "BANKRUPT": return False
          if L.premises_status == "OPEN": return True          # ACTIVE or DEFAULTED tenant
          if L.premises_status == "DARK" and L.dark_since is not None:
              return days_between(L.dark_since, T) < ShoppingCenter.occupancy_grace_days
          return False

      # LIVE_STRICT center fields always use variant SNAPSHOT_STRICT at the current clock.
      population = [L for L in Lease if L.center_id == center.id
                                     and L.premises_status in {"EXECUTED","OPEN","DARK"}]
      counted   = [L for L in population if counted_open(L, variant, measured_at)]
      counted_gla_sqft      = sum(L.gla_sqft for L in counted)
      gla_occupancy_pct     = round_half_up(counted_gla_sqft / center.total_gla_sqft * 100, 2)
      open_store_count      = count(L for L in counted if L.is_anchor == False)
      open_anchor_count     = count(L for L in counted if L.is_anchor == True)
      counted_lease_count   = len(counted)
      excluded_lease_count  = len(population) - len(counted)
    input_set: "Leases of the measured center with premises_status IN {EXECUTED, OPEN, DARK}. DRAFT and TERMINATED leases are outside the population entirely and are NOT counted in excluded_lease_count."
    constants: {}
    precision: "gla_occupancy_pct: 2 decimal places, round_half_up. Counts are exact integers. days_between is a whole-day floor difference over UTC calendar dates."
    variants:
      - name: SNAPSHOT_STRICT
        when: "OccupancyMeasurement.variant == SNAPSHOT_STRICT, and every LIVE_STRICT recompute of ShoppingCenter derived fields"
        difference: "Counts a lease only when premises_status == OPEN and its tenant is ACTIVE. DARK premises and DEFAULTED tenants are excluded immediately."
      - name: TRAILING_GRACE
        when: "OccupancyMeasurement.variant == TRAILING_GRACE"
        difference: "Additionally counts (a) OPEN leases whose tenant is DEFAULTED and (b) DARK leases whose dark_since is strictly less than ShoppingCenter.occupancy_grace_days old at measured_at. Identical lease population, higher percentage; certifying a TRAILING_GRACE measurement can CURE a condition that the LIVE_STRICT engine had BREACHED."

  - name: cotenancy_condition_evaluation
    trigger: "system evaluation on Lease premises_status changes, PATCH /tenants/{id}, POST /leases/{id}/co-tenancy-conditions (initial evaluation), POST /occupancy-measurements/{id}/certify, POST /centers/{id}/compliance-sweep, RedevelopmentPlan record/abandon; also as the OPENING gate inside POST /leases/{id}/open. Writes CoTenancyCondition.status, breach_detected_at, consecutive_breach_days, last_evaluated_measurement_id."
    algorithm: threshold
    formula: |
      # figures — the evaluation source decides which numbers are used
      if source == "CERTIFIED_MEASUREMENT":
          pct, stores, anchors, variant, at = (M.gla_occupancy_pct, M.open_store_count,
                                               M.open_anchor_count, M.variant, M.measured_at)
      else:  # source == "LIVE_STRICT"
          pct, stores, anchors, variant, at = (C.open_occupancy_pct, C.operating_store_count,
                                               C.open_anchor_count, "SNAPSHOT_STRICT", clock_now)

      basis_ok = (pct >= cond.required_occupancy_pct) if cond.measurement_basis == "GLA_PCT" \
                 else (stores >= cond.required_open_store_count)

      anchor_count_ok = anchors >= cond.required_anchor_count

      named_ok = True
      for AR in AnchorRequirement where AR.condition_id == cond.id:      # order-insensitive AND
          A = Lease(AR.anchor_lease_id)
          if counted_open(A, variant, at):            continue
          if not AR.substitution_allowed:             named_ok = False; break
          subs = [L for L in Lease if L.center_id == C.id
                                   and L.parcel_kind == "ANCHOR_BOX"
                                   and L.id != A.id
                                   and L.id not in named_anchor_lease_ids(cond)
                                   and counted_open(L, variant, at)
                                   and L.gla_sqft >= AR.min_substitute_gla_sqft]
          if len(subs) == 0:                          named_ok = False; break

      satisfied = basis_ok and anchor_count_ok and named_ok
    input_set: "Conditions whose Lease.premises_status != TERMINATED and whose status != WAIVED; ONGOING conditions are evaluated only while the benefited lease is OPEN or DARK, OPENING conditions only while it is EXECUTED. Every threshold comparison is >= (a percentage exactly equal to required_occupancy_pct is SATISFIED)."
    constants: {}
    precision: "Percentages compared at 2 decimal places as produced by occupancy_measurement_snapshot; no re-rounding before comparison."
    note: "Same condition, two engines: a LIVE_STRICT evaluation and a CERTIFIED_MEASUREMENT evaluation of a TRAILING_GRACE measurement can disagree on the same lease population, and whichever fires last wins the stored status."

  - name: cotenancy_rent_reduction
    trigger: "POST /leases/{id}/remedy-elections — pins RemedyElection.shortfall_pct_at_election, reduction_pct, reduced_rent_monthly_cents at election time; never recomputed afterwards"
    algorithm: tiered_pricing
    formula: |
      # 1. shortfall (>= 3 inputs, branch on measurement_basis)
      if election.source_notice_id is not null and election.condition_id is null:   # SUBSTITUTE_RENT branch
          shortfall_pct = SUBSTITUTE_RENT_SHORTFALL_PCT
      elif cond.measurement_basis == "GLA_PCT":
          shortfall_pct = round_half_up(max(0, cond.required_occupancy_pct - pct), 2)
      else:
          shortfall_pct = round_half_up(max(0, (cond.required_open_store_count - stores)
                                        / cond.required_open_store_count * 100), 2)
      # `pct` / `stores` come from the condition's controlling figures: the
      # OccupancyMeasurement named by cond.last_evaluated_measurement_id when that
      # field is not null, otherwise the center's LIVE_STRICT figures.

      # 2. tiered multiplier (boundaries inclusive on the upper edge)
      multiplier = 1.0 if shortfall_pct <= 5.00 else (1.5 if shortfall_pct <= 15.00 else 2.0)

      # 3. anchor-closure adder — applied BEFORE the cap and AFTER the multiplier
      anchor_dark = any(AR for AR in AnchorRequirement where AR.condition_id == cond.id
                        such that Lease(AR.anchor_lease_id) is not counted_open under the
                        controlling figures and no qualifying substitute exists)
      raw_pct = round_half_up(shortfall_pct * multiplier, 2) + (ANCHOR_DARK_BONUS_PCT if anchor_dark else 0)

      # 4. floor then cap (nested max/min — order is pinned)
      reduction_pct = min(cond.max_reduction_pct, max(MIN_REDUCTION_PCT, raw_pct))

      # 5. informational snapshot of the reduced rent for THIS election alone
      reduced_rent_monthly_cents = round_half_up(lease.base_rent_monthly_cents
                                                 * (100 - reduction_pct) / 100)
    input_set: "The single breached CoTenancyCondition named by condition_id (or the SUBSTITUTE_RENT branch when the election is sourced from an ESCALATED notice), plus every AnchorRequirement of that condition."
    constants:
      MIN_REDUCTION_PCT: 5.0
      ANCHOR_DARK_BONUS_PCT: 10.0
      SUBSTITUTE_RENT_SHORTFALL_PCT: 20.0
      TIER_1_MAX_SHORTFALL_PCT: 5.0
      TIER_1_MULTIPLIER: 1.0
      TIER_2_MAX_SHORTFALL_PCT: 15.0
      TIER_2_MULTIPLIER: 1.5
      TIER_3_MULTIPLIER: 2.0
    precision: "shortfall_pct and reduction_pct: 2 decimal places, round_half_up, rounded once at step 3 before the adder. reduced_rent_monthly_cents: whole cents, round_half_up."

  - name: abatement_ledger_rounding
    trigger: "Recomputed on POST /remedy-elections/{id}/approve, POST /remedy-elections/{id}/rescind, POST /centers/{id}/compliance-sweep and POST /_clock/set_current_utc; writes RemedyElection.abated_to_date_cents and Lease.total_abated_cents"
    algorithm: aggregation
    formula: |
      # per-election accrual over a half-open window [window_from_date, window_through_date)
      def accrual(E):
          end_date   = min(clock_now_date, E.window_through_date)
          days       = max(0, days_between(E.window_from_date, end_date))
          months     = round_half_up(days / 30, 4)
          return round_half_up(Lease(E.lease_id).base_rent_monthly_cents
                               * E.reduction_pct / 100 * months)      # ROUNDED HERE, per election

      qualifying = [E for E in RemedyElection where E.lease_id == lease.id
                                              and E.status in {"REDUCTION_ACTIVE", "CONSUMMATED"}]
      for E in qualifying: E.abated_to_date_cents = accrual(E)
      lease.total_abated_cents = sum(E.abated_to_date_cents for E in qualifying)   # ROUND-THEN-SUM
    input_set: "RemedyElection rows of the lease with status IN {REDUCTION_ACTIVE, CONSUMMATED}. ELECTED and RESCINDED elections contribute 0 and their own abated_to_date_cents is 0."
    constants:
      DAYS_PER_ACCRUAL_MONTH: 30
    precision: |
      PINNED ORDER — ROUND-THEN-SUM: each election's accrual is rounded to whole cents
      (round_half_up) BEFORE the sum. The rejected alternative (sum the unrounded accruals
      and round once) yields a different total whenever the fractional parts of two or more
      accruals sum to at least one cent, and MUST NOT be used for Lease.total_abated_cents.
      `months` is itself rounded to 4 decimal places (round_half_up) before multiplication.
    note: "Deliberate asymmetry: Lease.effective_rent_monthly_cents uses the OPPOSITE order (sum the reduction percentages of all covering REDUCTION_ACTIVE elections first, then round once). The two fields are computed from the same elections and are expected to disagree with any single uniform rounding policy."

  - name: effective_rent_recompute
    trigger: "Recomputed on POST /remedy-elections/{id}/approve, POST /remedy-elections/{id}/rescind, POST /centers/{id}/compliance-sweep, POST /_clock/set_current_utc, and every Lease premises_status transition; writes Lease.effective_rent_monthly_cents and ShoppingCenter.aggregate_effective_rent_cents"
    algorithm: aggregation
    formula: |
      covering = [E for E in RemedyElection where E.lease_id == lease.id
                                             and E.status == "REDUCTION_ACTIVE"
                                             and E.window_from_date <= clock_now_date
                                             and clock_now_date < E.window_through_date]   # half-open
      total_pct = sum(E.reduction_pct for E in covering)          # SUM FIRST
      lease.effective_rent_monthly_cents = round_half_up(
          lease.base_rent_monthly_cents * (100 - total_pct) / 100)   # ROUND ONCE, at the end

      center.aggregate_effective_rent_cents = sum(L.effective_rent_monthly_cents
          for L in Lease where L.center_id == center.id
                           and L.premises_status in {"OPEN", "DARK"})
    input_set: "REDUCTION_ACTIVE elections of the lease whose half-open window covers the current logical clock date. TERMINATION_SCHEDULED, ELECTED, RESCINDED and CONSUMMATED elections never reduce effective rent."
    constants: {}
    precision: "PINNED ORDER — SUM-THEN-ROUND: percentages are summed first and the product is rounded once to whole cents, round_half_up. Never round per election here."

  - name: radius_recapture_assessment
    trigger: "POST /radius-restrictions/{id}/violation-report — writes UseViolationNotice.recapture_assessed_cents on the minted RADIUS notice"
    algorithm: threshold
    formula: |
      if R.recapture_basis == "GROSS_SALES":
          base_cents = notice.reported_offending_sales_cents
      else:  # INCREMENTAL_SALES
          base_cents = max(0, notice.reported_offending_sales_cents - R.protected_baseline_cents)
      recapture_assessed_cents = round_half_up(base_cents * R.recapture_pct / 100)
    input_set: "The single RadiusRestriction addressed by the path, which must have status == ACTIVE and whose closed enforcement window must contain the current logical clock date."
    constants: {}
    precision: "Whole cents, round_half_up. A reported volume exactly equal to protected_baseline_cents yields 0 under INCREMENTAL_SALES and a positive assessment under GROSS_SALES."
    variants:
      - name: GROSS_SALES
        when: "RadiusRestriction.recapture_basis == GROSS_SALES"
        difference: "Charges recapture_pct against the entire reported offending volume; protected_baseline_cents is ignored."
      - name: INCREMENTAL_SALES
        when: "RadiusRestriction.recapture_basis == INCREMENTAL_SALES"
        difference: "Charges recapture_pct only against the excess over protected_baseline_cents, flooring the base at 0. Same reported sales, materially different additional rent."

  - name: estoppel_fee_assessment
    trigger: "POST /leases/{id}/estoppel-certificates — writes base_fee_cents and total_fee_cents"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — subtotal (this is base_fee_cents)
      subtotal = BASE_ESTOPPEL_FEE_CENTS \
               + PER_DISCLOSURE_FEE_CENTS * disclosed_exclusive_count \
               + (BREACH_DISCLOSURE_FEE_CENTS if disclosed_cotenancy_breach else 0)
      base_fee_cents = subtotal

      # STEP 2 — tier is keyed on the SUBTOTAL, evaluated exactly once
      if   subtotal <= TIER_A_MAX_SUBTOTAL_CENTS: surcharge_pct = TIER_A_SURCHARGE_PCT
      elif subtotal <= TIER_B_MAX_SUBTOTAL_CENTS: surcharge_pct = TIER_B_SURCHARGE_PCT
      else:                                       surcharge_pct = TIER_C_SURCHARGE_PCT

      # STEP 3 — surcharge applied to the subtotal; the resulting total is NEVER re-tiered
      surcharge = round_half_up(subtotal * surcharge_pct / 100) if expedite_requested else 0
      total_fee_cents = subtotal + surcharge
    input_set: "The estopped lease's ACTIVE ExclusiveUseClause count and BREACHED CoTenancyCondition presence at request time."
    constants:
      BASE_ESTOPPEL_FEE_CENTS: 25000
      PER_DISCLOSURE_FEE_CENTS: 5000
      BREACH_DISCLOSURE_FEE_CENTS: 15000
      TIER_A_MAX_SUBTOTAL_CENTS: 40000
      TIER_A_SURCHARGE_PCT: 10.0
      TIER_B_MAX_SUBTOTAL_CENTS: 75000
      TIER_B_SURCHARGE_PCT: 15.0
      TIER_C_SURCHARGE_PCT: 20.0
    precision: |
      Whole cents, round_half_up on the surcharge only. Evaluation order is pinned because
      the dependency looks circular: the surcharge is a percentage of the fee and the tier is
      a function of the fee. The tier is selected on the PRE-SURCHARGE subtotal and the total
      is never re-tiered, so a subtotal of 40000 takes TIER_A (10%) even though the resulting
      total of 44000 sits in TIER_B's range.

  - name: exclusive_use_screening
    trigger: "POST /leases/{id}/screen-use (read-only decision) and as a hard precondition inside POST /leases/{id}/execute"
    algorithm: constraint_propagation
    formula: |
      candidate = Lease(path id)
      screen_date = clock_now_date
      eligible = [X for X in ExclusiveUseClause
                    where Lease(X.lease_id).center_id == candidate.center_id
                      and X.lease_id != candidate.id
                      and X.status == "ACTIVE"
                      and Lease(X.lease_id).premises_status in {"EXECUTED","OPEN","DARK"}
                      and X.effective_from_date <= screen_date <= X.effective_through_date
                      and candidate.primary_use_code in X.protected_use_codes
                      and scope_binds(X, candidate)]

      scope_binds(X, cand):
          CENTER_WIDE      -> True
          RADIUS_INCLUSIVE -> True
          PAD_EXCLUDED     -> cand.parcel_kind != "PAD"

      # carve-out suppression — ALL THREE must hold for the clause to be suppressed
      def suppressed(X, cand):
          return (candidate.primary_use_code in cand.incidental_use_codes
                  and cand.projected_incidental_sales_pct <= X.incidental_sales_pct_cap
                  and cand.gla_sqft <= X.gla_carve_out_sqft)

      conflicts = [X for X in eligible if not suppressed(X, candidate)]
      conflicting_clause_count = len(conflicts)
      carve_out_applied = len(eligible) > 0 and len(conflicts) == 0

      # controlling clause selector — ranking is over entity fields only
      SCOPE_SEVERITY = {"CENTER_WIDE": 3, "RADIUS_INCLUSIVE": 2, "PAD_EXCLUDED": 1}
      if conflicting_clause_count == 0:
          decision, controlling_clause_id = "CLEAR", null      # empty-pool fallback
      else:
          controlling = sort(conflicts, key=(-SCOPE_SEVERITY[X.exclusivity_scope],
                                             X.gla_carve_out_sqft,
                                             X.created_at))[0]
          decision, controlling_clause_id = "CONFLICT", controlling.id
    input_set: "ACTIVE clauses of the same center benefiting a lease other than the candidate whose closed effective window contains the screening date. SUSPENDED, EXPIRED and WAIVED clauses never conflict, and clauses of TERMINATED or DRAFT benefited leases never conflict."
    constants:
      SCOPE_SEVERITY_CENTER_WIDE: 3
      SCOPE_SEVERITY_RADIUS_INCLUSIVE: 2
      SCOPE_SEVERITY_PAD_EXCLUDED: 1
    precision: "Selector determinism: eligibility filter is the explicit predicate above; ranking key is scope severity DESC, then gla_carve_out_sqft ASC, then created_at ASC; empty candidate pool yields decision CLEAR with controlling_clause_id null. Entity `id` never participates in the ranking."

  - name: center_posture_derivation
    trigger: "Recomputed at the end of every mutation that changes a lease's premises_status or remedy_status, a condition's status, a notice's status, a clause's status, or the center's total_gla_sqft; writes ShoppingCenter.compliance_posture"
    algorithm: threshold
    formula: |
      breached = count(K for K in CoTenancyCondition
                         where Lease(K.lease_id).center_id == center.id
                           and Lease(K.lease_id).premises_status != "TERMINATED"
                           and K.status == "BREACHED")
      # A center with no lease in the occupancy population is not yet assessable:
      # the two occupancy rungs are skipped entirely so a brand-new center with
      # open_occupancy_pct == 0.00 is COMPLIANT, not FROZEN.
      assessable = exists(L in Lease where L.center_id == center.id
                                       and L.premises_status in {"EXECUTED","OPEN","DARK"})

      # first matching rung wins - evaluated top to bottom
      if breached >= FREEZE_BREACHED_CONDITION_COUNT \
         or (assessable and center.open_occupancy_pct < FREEZE_OCCUPANCY_PCT):
          posture = "FROZEN"
      elif breached >= 1:
          posture = "BREACH"
      elif center.open_violation_count >= 1 \
           or (assessable and center.open_occupancy_pct < WATCH_OCCUPANCY_PCT):
          posture = "WATCH"
      else:
          posture = "COMPLIANT"
    input_set: "All non-WAIVED CoTenancyCondition rows of non-TERMINATED leases of the center, plus the center's own open_violation_count and open_occupancy_pct."
    constants:
      FREEZE_BREACHED_CONDITION_COUNT: 2
      FREEZE_OCCUPANCY_PCT: 50.0
      WATCH_OCCUPANCY_PCT: 70.0
    precision: "Comparisons use the 2-decimal open_occupancy_pct as stored; strictly-less-than on both occupancy rungs, so exactly 50.00 is not FROZEN and exactly 70.00 is not WATCH. Both occupancy rungs are gated on `assessable`."

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; first violation wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    rule: "X-User-Role header must be present and name one of the five roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc"
  - priority: 2
    category: authz
    rule: "The caller's role must appear in the endpoint's declared roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: schema
    rule: "Request body must contain every required field with the declared type; enum fields must carry a declared member; percentages must be 0 <= v <= 100; *_cents must be integers >= 0; dates must be ISO-8601 calendar dates"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    rule: "Every path-parameter id must resolve to a stored entity"
    error_id: "ERR_CENTER_NOT_FOUND | ERR_TENANT_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_CONDITION_NOT_FOUND | ERR_CLAUSE_NOT_FOUND | ERR_RESTRICTION_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_MEASUREMENT_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    rule: "Every foreign key supplied in a request body must resolve to a stored entity (tenant_id, condition_id, source_notice_id, clause_id, radius_restriction_id, measurement_id, anchor_lease_id, replacement_for_lease_id, pad_parcel_lease_id)"
    error_id: "ERR_TENANT_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_CONDITION_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_CLAUSE_NOT_FOUND | ERR_RESTRICTION_NOT_FOUND | ERR_MEASUREMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys"
  - priority: 6
    category: authz
    rule: "A TenantRep caller may only address leases, notices, disputes, elections and certificates whose lease belongs to the Tenant whose id equals the caller's X-User-ID"
    error_id: ERR_TENANT_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "POST /leases/{id}/go-dark, POST /leases/{id}/reopen, POST /leases/{id}/open, POST /use-violation-notices/{id}/disputes, POST /leases/{id}/remedy-elections, POST /remedy-elections/{id}/rescind, POST /estoppel-certificates/{id}/sign"
  - priority: 7
    category: cross_entity
    rule: "Every entity referenced by one request must belong to the same ShoppingCenter: a condition's anchor_lease_id, an election's condition_id, a notice's clause_id and violating_lease_id, a certificate's measurement_id, and a plan's pad_parcel_lease_id must all resolve inside the addressed center"
    error_id: ERR_CENTER_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /co-tenancy-conditions/{id}/anchor-requirements, POST /use-violation-notices, POST /leases/{id}/remedy-elections, POST /leases/{id}/estoppel-certificates, POST /centers/{id}/redevelopment-plans"
  - priority: 8
    category: concurrency
    rule: "When the endpoint declares an OCC field (§1.2.1) the supplied expected_<parent>_version must equal the parent's current version"
    error_id: "ERR_STALE_CENTER_VERSION | ERR_STALE_LEASE_VERSION"
    http_status: 412
    applies_to: "POST /centers/{id}/occupancy-measurements, POST /leases/{id}/remedy-elections"
  - priority: 9
    category: state
    rule: "A center whose compliance_posture is FROZEN accepts no new lease executions, no new exclusive-use clauses, no new radius restrictions and no redevelopment recordings"
    error_id: ERR_CENTER_EXECUTION_FROZEN
    http_status: 409
    applies_to: "POST /leases/{id}/execute, POST /leases/{id}/exclusive-use-clauses, POST /leases/{id}/radius-restrictions, POST /redevelopment-plans/{id}/record"
    note: "PINNED CONFLICT A (outranks priority 14): on POST /leases/{id}/execute against a FROZEN center whose candidate use also collides with an ACTIVE exclusive-use clause, the response is ERR_CENTER_EXECUTION_FROZEN (409), never ERR_EXCLUSIVE_USE_CONFLICT (422)."
  - priority: 10
    category: state
    rule: "The addressed entity must sit in a state from which the requested transition is declared in §1.2. EXCEPTION: a UseViolationNotice whose status is DISPUTED is not reported by this row for cure/escalate/withdraw - that from-state carries the more specific ERR_DISPUTE_PENDING at priority 15."
    error_id: "ERR_LEASE_STATE_INVALID | ERR_CONDITION_STATE_INVALID | ERR_NOTICE_STATE_INVALID | ERR_DISPUTE_STATE_INVALID | ERR_ELECTION_STATE_INVALID | ERR_MEASUREMENT_STATE_INVALID | ERR_CERTIFICATE_STATE_INVALID | ERR_PLAN_STATE_INVALID"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 11
    category: state
    rule: "A remedy election may be created only while the benefited lease's remedy_status is ELIGIBLE or REMEDY_ACTIVE"
    error_id: ERR_REMEDY_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /leases/{id}/remedy-elections"
    note: "PINNED CONFLICT C (outranks priority 16): an election whose kind is not permitted by the condition AND whose lease is not yet ELIGIBLE returns ERR_REMEDY_NOT_ELIGIBLE (409), never ERR_REMEDY_KIND_NOT_PERMITTED (422)."
  - priority: 12
    category: business_safety
    rule: "Segregation of duties on dispute adjudication: X-User-ID must differ from UseViolationNotice.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /use-violation-disputes/{id}/adjudicate"
  - priority: 13
    category: business_safety
    rule: "Segregation of duties on measurement certification: X-User-ID must differ from OccupancyMeasurement.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /occupancy-measurements/{id}/certify"
  - priority: 14
    category: business_safety
    rule: "A lease may not be executed while exclusive_use_screening returns decision CONFLICT for its primary_use_code"
    error_id: ERR_EXCLUSIVE_USE_CONFLICT
    http_status: 422
    applies_to: "POST /leases/{id}/execute"
  - priority: 15
    category: state
    rule: "A UseViolationNotice whose status is DISPUTED may not be cured, escalated or withdrawn until its PENDING UseViolationDispute is adjudicated; this row supplies the specific error for that from-state in place of priority 10's generic ERR_NOTICE_STATE_INVALID"
    error_id: ERR_DISPUTE_PENDING
    http_status: 409
    applies_to: "POST /use-violation-notices/{id}/cure, POST /use-violation-notices/{id}/escalate, POST /use-violation-notices/{id}/withdraw, POST /centers/{id}/compliance-sweep (the sweep escalation step skips DISPUTED notices rather than failing)"
  - priority: 16
    category: business_constraint
    rule: "The requested election_kind must be permitted by CoTenancyCondition.remedy_type: RENT_REDUCTION_ONLY permits only RENT_REDUCTION, TERMINATION_ONLY permits only TERMINATION, RENT_REDUCTION_THEN_TERMINATION permits RENT_REDUCTION and TERMINATION, and SUBSTITUTE_RENT is permitted only for an election sourced from an ESCALATED UseViolationNotice"
    error_id: ERR_REMEDY_KIND_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /leases/{id}/remedy-elections"
  - priority: 17
    category: business_temporal
    rule: "A notice may only be escalated after its cure_deadline_at has passed on the logical clock"
    error_id: ERR_CURE_PERIOD_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /use-violation-notices/{id}/escalate (invoked through POST /centers/{id}/compliance-sweep)"
  - priority: 18
    category: business_temporal
    rule: "Radius restriction windows for the same lease are CLOSED-CLOSED: a new [window_from_date, window_through_date] may not share even a single day with an existing ACTIVE restriction of that lease, so touching endpoints collide"
    error_id: ERR_RADIUS_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /leases/{id}/radius-restrictions"
  - priority: 19
    category: business_temporal
    rule: "Occupancy measurement windows for the same center are HALF-OPEN [window_from_date, window_through_date): a new window may start exactly on an existing window's through-date, but any interior overlap is rejected"
    error_id: ERR_MEASUREMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /centers/{id}/occupancy-measurements"
  - priority: 20
    category: business_temporal
    rule: "A remedy election's abatement window must satisfy window_from_date < window_through_date and window_from_date must not precede the condition's breach_detected_at date"
    error_id: ERR_ABATEMENT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /leases/{id}/remedy-elections, POST /remedy-elections/{id}/approve"
    note: "PINNED CONFLICT B (outranks priority 21): on POST /remedy-elections/{id}/approve where the window predates breach_detected_at AND the aggregate reduction would exceed 100%, the response is ERR_ABATEMENT_WINDOW_INVALID (422), never ERR_ABATEMENT_STACK_EXCEEDED (422)."
  - priority: 21
    category: business_fiscal
    rule: "The sum of reduction_pct across all REDUCTION_ACTIVE elections of a lease whose half-open windows overlap the approved election's window may not exceed 100.00"
    error_id: ERR_ABATEMENT_STACK_EXCEEDED
    http_status: 422
    applies_to: "POST /remedy-elections/{id}/approve"
  - priority: 22
    category: business_constraint
    rule: "A lender may accept an estoppel certificate only when lender_conditions_met is true, meaning the certificate is TENANT_SIGNED, its pinned_lease_version still equals the lease's current version, and no CoTenancyCondition of that lease is BREACHED unless disclosed_cotenancy_breach is true"
    error_id: ERR_LENDER_CONDITIONS_NOT_MET
    http_status: 422
    applies_to: "POST /estoppel-certificates/{id}/accept"
  - priority: 23
    category: cross_entity
    rule: "A redevelopment plan whose consent_required is true may only be recorded with consent_confirmed true in the request body"
    error_id: ERR_PROTECTED_RIGHTS_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /redevelopment-plans/{id}/record"
  - priority: 24
    category: business_constraint
    rule: "A condition whose measurement_basis is GLA_PCT requires required_occupancy_pct and forbids required_open_store_count; a STORE_COUNT condition requires required_open_store_count with a value >= 1 and forbids required_occupancy_pct"
    error_id: ERR_MEASUREMENT_BASIS_MISMATCH
    http_status: 422
    applies_to: "POST /leases/{id}/co-tenancy-conditions"
  - priority: 25
    category: business_constraint
    rule: "A center may not hold two non-TERMINATED leases for the same suite_code"
    error_id: ERR_SUITE_ALREADY_LEASED
    http_status: 409
    applies_to: "POST /centers/{id}/leases, POST /leases/{id}/execute"
  - priority: 26
    category: state
    rule: "A use-violation notice may only cite an ExclusiveUseClause whose status is ACTIVE; a clause SUSPENDED by a recorded redevelopment plan cannot be enforced"
    error_id: ERR_CLAUSE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /use-violation-notices"
  - priority: 27
    category: business_temporal
    rule: "A radius violation may only be reported against a restriction whose status is ACTIVE and whose closed enforcement window contains the current logical clock date"
    error_id: ERR_RADIUS_WINDOW_INACTIVE
    http_status: 409
    applies_to: "POST /radius-restrictions/{id}/violation-report"
  - priority: 28
    category: business_constraint
    rule: "An OPENING co-tenancy condition may not be added to a lease that is already OPEN, and an ONGOING condition may not be added to a DRAFT lease"
    error_id: ERR_CONDITION_KIND_INVALID
    http_status: 422
    applies_to: "POST /leases/{id}/co-tenancy-conditions"
  - priority: 29
    category: business_constraint
    rule: "A terminating election may not schedule a termination_effective_date earlier than the condition's cure_period_days measured from breach_detected_at"
    error_id: ERR_CURE_PERIOD_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /remedy-elections/{id}/approve"

# =============================================================================
# 1.5 API Endpoints Table
# =============================================================================
endpoints:
  # --- ShoppingCenter -------------------------------------------------------
  - method: POST
    path: /centers
    purpose: "Register a shopping center"
    input: [name, total_gla_sqft, "occupancy_grace_days?"]
    output: ShoppingCenter
    roles: [AssetManager]
    side_effects: "occupied_gla_sqft=0, open_occupancy_pct=0.00, all counts 0, aggregate_effective_rent_cents=0, compliance_posture=COMPLIANT, redevelopment_status=NONE, version=1"
  - method: GET
    path: /centers/{id}
    purpose: "Read one center with all derived compliance fields"
    input: []
    output: ShoppingCenter
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /centers
    purpose: "List centers"
    input: ["compliance_posture?", "limit?", "offset?"]
    output: ShoppingCenter[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: POST
    path: /centers/{id}/compliance-sweep
    purpose: "Advance the logical compliance state of the whole center at the current clock: escalate every notice past its cure deadline that has no pending dispute, mark newly remedy-eligible leases, re-evaluate every condition under LIVE_STRICT, re-accrue abatements and re-derive posture"
    input: []
    output: "{ as_of: string, escalated_notice_count: integer, newly_eligible_lease_count: integer, cured_condition_count: integer, breached_condition_count: integer, compliance_posture: string }"
    roles: [ComplianceOfficer]
    side_effects: "UseViolationNotice ISSUED->ESCALATED for expired cure periods (skips notices with a PENDING dispute); Lease.remedy_status NONE->ELIGIBLE once consecutive_breach_days >= condition.cure_period_days; CoTenancyCondition status re-evaluated (BREACHED->CURED and CURED->BREACHED both possible); consecutive_breach_days incremented for still-breached conditions; abatement_ledger_rounding and effective_rent_recompute re-run for every lease; ShoppingCenter.last_sweep_at and compliance_posture updated; center.version incremented"
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Set the logical current UTC instant used by every temporal rule"
    input: [to_iso8601]
    output: "{ current_utc: string }"
    roles: [LeaseAdministrator, ComplianceOfficer, AssetManager]
    side_effects: "Re-runs abatement_ledger_rounding and effective_rent_recompute for every lease with a REDUCTION_ACTIVE election, and re-derives EstoppelCertificate staleness. Clock starts at 2026-08-01T00:00:00Z on a fresh instance. Moving the clock never escalates notices or changes condition status - that is the compliance sweep's job."

  # --- Tenant ---------------------------------------------------------------
  - method: POST
    path: /tenants
    purpose: "Register a tenant entity"
    input: [legal_name, notice_email, primary_use_code, "is_national_chain?", "status?"]
    output: Tenant
    roles: [LeaseAdministrator]
    side_effects: "status defaults to ACTIVE, version=1"
  - method: GET
    path: /tenants/{id}
    purpose: "Read one tenant"
    input: []
    output: Tenant
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: PATCH
    path: /tenants/{id}
    purpose: "Update a tenant's credit status (ACTIVE, DEFAULTED, BANKRUPT)"
    input: [status]
    output: Tenant
    roles: [LeaseAdministrator, ComplianceOfficer]
    side_effects: "Triggers a LIVE_STRICT recompute of every center that holds a lease of this tenant (occupancy_measurement_snapshot), re-evaluates every co-tenancy condition of those centers (cotenancy_condition_evaluation), and re-derives compliance_posture. A move to DEFAULTED or BANKRUPT can BREACH a condition without any lease going dark."
  - method: GET
    path: /tenants/{id}/use-violation-disputes
    purpose: "List every dispute this tenant has filed"
    input: ["status?", "limit?", "offset?"]
    output: UseViolationDispute[]
    roles: [ComplianceOfficer, LeaseAdministrator, TenantRep]
    side_effects: "none"

  # --- Lease ----------------------------------------------------------------
  - method: POST
    path: /centers/{id}/leases
    purpose: "Draft a lease for a suite in this center"
    input: [tenant_id, suite_code, gla_sqft, parcel_kind, primary_use_code, "incidental_use_codes?", "projected_incidental_sales_pct?", base_rent_monthly_cents, commencement_date, expiration_date, "replacement_for_lease_id?"]
    output: Lease
    roles: [LeaseAdministrator]
    side_effects: "premises_status=DRAFT, remedy_status=NONE, use_compliance_status=CLEAR, is_anchor derived as (parcel_kind == ANCHOR_BOX), effective_rent_monthly_cents = base_rent_monthly_cents, total_abated_cents=0, incidental_use_codes defaults to [], projected_incidental_sales_pct defaults to 0.00. A DRAFT lease is not in the occupancy population and does not move any center field."
  - method: GET
    path: /leases/{id}
    purpose: "Read one lease with both parallel status dimensions and both money fields"
    input: []
    output: Lease
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /leases
    purpose: "List leases, filterable by center, tenant, replaced predecessor and status"
    input: ["center_id?", "tenant_id?", "replacement_for_lease_id?", "premises_status?", "remedy_status?", "parcel_kind?", "limit?", "offset?"]
    output: Lease[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: POST
    path: /leases/{id}/screen-use
    purpose: "Run prohibited-use screening for this DRAFT lease's primary_use_code against every ACTIVE exclusive-use clause of the center, without mutating anything"
    input: []
    output: "{ decision: string, controlling_clause_id: string, conflicting_clause_count: integer, carve_out_applied: boolean, screened_use_code: string, eligible_clause_count: integer }"
    roles: [LeaseAdministrator, ComplianceOfficer]
    side_effects: "none - read-only. Applies exclusive_use_screening verbatim; decision is CLEAR or CONFLICT and controlling_clause_id is null whenever conflicting_clause_count is 0."
  - method: POST
    path: /leases/{id}/execute
    purpose: "Execute a DRAFT lease after prohibited-use screening clears"
    input: []
    output: Lease
    roles: [LeaseAdministrator]
    side_effects: "premises_status DRAFT->EXECUTED; runs exclusive_use_screening as a hard gate (priority 14) behind the FROZEN posture gate (priority 9); enters the occupancy population as an uncounted lease; every OPENING co-tenancy condition of the lease is evaluated for the first time; center.version incremented"
  - method: POST
    path: /leases/{id}/open
    purpose: "Open the store for business"
    input: []
    output: Lease
    roles: [LeaseAdministrator, TenantRep]
    side_effects: "premises_status EXECUTED->OPEN, opened_at stamped, dark_since cleared; center occupied_gla_sqft/open_occupancy_pct/operating_store_count/open_anchor_count/aggregate_effective_rent_cents recomputed under SNAPSHOT_STRICT; every condition of the center re-evaluated (an opening can CURE another tenant's breach); compliance_posture re-derived; center.version incremented"
  - method: POST
    path: /leases/{id}/go-dark
    purpose: "Record that the tenant has ceased operating (gone dark) while the lease survives"
    input: []
    output: Lease
    roles: [LeaseAdministrator, TenantRep]
    side_effects: "HOP 1 premises_status OPEN->DARK and dark_since stamped; HOP 2 center occupancy fields recomputed under SNAPSHOT_STRICT; HOP 3 every affected CoTenancyCondition re-evaluated and BREACHED with breach_detected_at stamped; HOP 4 each benefited Lease.remedy_status NONE->ELIGIBLE when cure_period_days is 0, otherwise it waits for the sweep; HOP 5 ShoppingCenter.compliance_posture re-derived and center.version incremented"
  - method: POST
    path: /leases/{id}/reopen
    purpose: "Reopen a dark store"
    input: []
    output: Lease
    roles: [LeaseAdministrator, TenantRep]
    side_effects: "Exact reversal of go-dark: premises_status DARK->OPEN, dark_since cleared, occupied_gla_sqft and open_occupancy_pct restored to their pre-dark values, conditions re-evaluated to CURED where satisfied, remedy_status returned to NONE for leases with no approved election, posture re-derived, center.version incremented"
  - method: POST
    path: /leases/{id}/terminate
    purpose: "Terminate a lease"
    input: [termination_reason_code]
    output: Lease
    roles: [AssetManager]
    side_effects: "premises_status ->TERMINATED (terminal); leaves the occupancy population entirely; every ExclusiveUseClause of the lease becomes EXPIRED and center.protected_exclusive_count drops; every RadiusRestriction becomes EXPIRED; every non-terminal CoTenancyCondition of the lease becomes WAIVED; every ELECTED or REDUCTION_ACTIVE RemedyElection of the lease becomes CONSUMMATED with its accrual frozen; center fields and posture recomputed; center.version incremented"

  # --- CoTenancyCondition ---------------------------------------------------
  - method: POST
    path: /leases/{id}/co-tenancy-conditions
    purpose: "Abstract a co-tenancy condition from the lease document"
    input: [condition_kind, measurement_basis, "required_occupancy_pct?", "required_open_store_count?", "required_anchor_count?", "grace_period_days?", "cure_period_days?", remedy_type, "max_reduction_pct?"]
    output: CoTenancyCondition
    roles: [LeaseAdministrator]
    side_effects: "Evaluated immediately under LIVE_STRICT (cotenancy_condition_evaluation): status becomes SATISFIED or BREACHED at creation, never PENDING. A BREACHED creation stamps breach_detected_at, sets consecutive_breach_days=0 and re-derives the center's compliance_posture, so abstracting a condition can freeze the center. center.version incremented"
  - method: GET
    path: /co-tenancy-conditions/{id}
    purpose: "Read one co-tenancy condition"
    input: []
    output: CoTenancyCondition
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /co-tenancy-conditions
    purpose: "List co-tenancy conditions, filterable by benefited lease, controlling measurement, kind and status"
    input: ["lease_id?", "last_evaluated_measurement_id?", "condition_kind?", "status?", "limit?", "offset?"]
    output: CoTenancyCondition[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: POST
    path: /co-tenancy-conditions/{id}/waive
    purpose: "Waive a co-tenancy condition (landlord buys out the protection)"
    input: [waiver_reason_code]
    output: CoTenancyCondition
    roles: [AssetManager]
    side_effects: "status ->WAIVED (terminal); the condition leaves the breached-condition population so compliance_posture can fall from FROZEN to BREACH or COMPLIANT; any ELECTED election naming it is RESCINDED with its reduction reversed; center.version incremented"

  # --- AnchorRequirement ----------------------------------------------------
  - method: POST
    path: /co-tenancy-conditions/{id}/anchor-requirements
    purpose: "Name a specific anchor whose continued operation the condition requires"
    input: [anchor_lease_id, substitution_allowed, min_substitute_gla_sqft]
    output: AnchorRequirement
    roles: [LeaseAdministrator]
    side_effects: "Immutable row (no version, no update endpoint). Re-evaluates the parent condition immediately: naming an already-dark anchor BREACHES the condition on the spot. center.version incremented"
  - method: GET
    path: /anchor-requirements/{id}
    purpose: "Read one anchor requirement"
    input: []
    output: AnchorRequirement
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /anchor-requirements
    purpose: "List anchor requirements, filterable by owning condition and by the named anchor lease"
    input: ["condition_id?", "anchor_lease_id?", "limit?", "offset?"]
    output: AnchorRequirement[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"

  # --- ExclusiveUseClause ---------------------------------------------------
  - method: POST
    path: /leases/{id}/exclusive-use-clauses
    purpose: "Record an exclusive-use clause benefiting this lease"
    input: [protected_use_codes, exclusivity_scope, "gla_carve_out_sqft?", "incidental_sales_pct_cap?", effective_from_date, effective_through_date]
    output: ExclusiveUseClause
    roles: [LeaseAdministrator]
    side_effects: "status=ACTIVE, suspended_by_plan_id=null; center.protected_exclusive_count incremented; center.version incremented. Adding a clause never retroactively invalidates an already-EXECUTED conflicting lease - screening runs only at execution time."
  - method: GET
    path: /exclusive-use-clauses/{id}
    purpose: "Read one exclusive-use clause"
    input: []
    output: ExclusiveUseClause
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /exclusive-use-clauses
    purpose: "Inventory exclusive-use clauses, filterable by benefited lease, suspending redevelopment plan and status"
    input: ["lease_id?", "suspended_by_plan_id?", "status?", "exclusivity_scope?", "limit?", "offset?"]
    output: ExclusiveUseClause[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"

  # --- RadiusRestriction ----------------------------------------------------
  - method: POST
    path: /leases/{id}/radius-restrictions
    purpose: "Record a radius restriction binding this tenant"
    input: [radius_miles, measured_from, recapture_basis, recapture_pct, "protected_baseline_cents?", window_from_date, window_through_date]
    output: RadiusRestriction
    roles: [LeaseAdministrator]
    side_effects: "status=ACTIVE. Windows for one lease are CLOSED-CLOSED and may not touch (priority 18)."
  - method: GET
    path: /radius-restrictions/{id}
    purpose: "Read one radius restriction"
    input: []
    output: RadiusRestriction
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /radius-restrictions
    purpose: "List radius restrictions, filterable by bound lease and status"
    input: ["lease_id?", "status?", "recapture_basis?", "limit?", "offset?"]
    output: RadiusRestriction[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: POST
    path: /radius-restrictions/{id}/violation-report
    purpose: "Report offending sales inside the protected radius and mint the resulting RADIUS violation notice with its recapture assessment"
    input: [reported_offending_sales_cents, "cure_period_days?", narrative]
    output: UseViolationNotice
    roles: [ComplianceOfficer]
    side_effects: "Mints a UseViolationNotice with notice_kind=RADIUS, radius_restriction_id set from the path, clause_id null, status=ISSUED, issued_by_user_id from X-User-ID, cure_deadline_at = issued_at + cure_period_days, and recapture_assessed_cents from radius_recapture_assessment; Lease.use_compliance_status CLEAR->UNDER_NOTICE; center.open_violation_count incremented and compliance_posture re-derived; center.version incremented"

  # --- UseViolationNotice ---------------------------------------------------
  - method: POST
    path: /use-violation-notices
    purpose: "Issue an exclusive-use violation notice against an operating tenant"
    input: [violating_lease_id, clause_id, notice_kind, "narrative?", "cure_period_days?"]
    output: UseViolationNotice
    roles: [ComplianceOfficer, LeaseAdministrator]
    side_effects: "status=ISSUED, issued_at stamped from the logical clock, cure_deadline_at = issued_at + cure_period_days, cure_restart_count=0, recapture_assessed_cents=0, radius_restriction_id=null; Lease.use_compliance_status CLEAR->UNDER_NOTICE; center.open_violation_count incremented; compliance_posture re-derived (a first notice moves COMPLIANT->WATCH); center.version incremented"
  - method: GET
    path: /use-violation-notices/{id}
    purpose: "Read one use-violation notice"
    input: []
    output: UseViolationNotice
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /use-violation-notices
    purpose: "List notices, filterable by violating lease, cited clause, cited radius restriction and status"
    input: ["violating_lease_id?", "clause_id?", "radius_restriction_id?", "notice_kind?", "status?", "limit?", "offset?"]
    output: UseViolationNotice[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: GET
    path: /use-violation-notices/{id}/disputes
    purpose: "List the disputes filed against one notice"
    input: ["status?", "limit?", "offset?"]
    output: UseViolationDispute[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, TenantRep]
    side_effects: "none"
  - method: POST
    path: /use-violation-notices/{id}/cure
    purpose: "Accept the tenant's cure of a noticed violation"
    input: [cure_evidence_code]
    output: UseViolationNotice
    roles: [LeaseAdministrator, ComplianceOfficer]
    side_effects: "status ISSUED->CURED (terminal); a DISPUTED notice is refused with ERR_DISPUTE_PENDING (priority 15) until its dispute is adjudicated; Lease.use_compliance_status returns to CLEAR when the lease has no other open notice; center.open_violation_count decremented and compliance_posture re-derived; center.version incremented"
  - method: POST
    path: /use-violation-notices/{id}/escalate
    purpose: "Escalate an uncured notice past its expired cure period"
    input: []
    output: UseViolationNotice
    roles: [ComplianceOfficer]
    side_effects: "HOP 1 status ISSUED->ESCALATED and escalated_at stamped; HOP 2 Lease.use_compliance_status UNDER_NOTICE->IN_VIOLATION; HOP 3 the benefited lease of the cited clause (or the same lease for a RADIUS notice) gets remedy_status NONE->ELIGIBLE with remedy_eligible_at stamped, opening a SUBSTITUTE_RENT election; HOP 4 compliance_posture re-derived and center.version incremented. Requires the cure deadline to have passed (priority 17) and no pending dispute (priority 15)."
  - method: POST
    path: /use-violation-notices/{id}/withdraw
    purpose: "Withdraw a notice the landlord no longer stands behind"
    input: [withdrawal_reason_code]
    output: UseViolationNotice
    roles: [ComplianceOfficer]
    side_effects: "status ISSUED->WITHDRAWN or ESCALATED->WITHDRAWN (terminal); reverses every escalation side effect - Lease.use_compliance_status returns to CLEAR, any remedy_status ELIGIBLE granted solely by this notice returns to NONE, center.open_violation_count decremented, posture re-derived; center.version incremented"

  # --- UseViolationDispute --------------------------------------------------
  - method: POST
    path: /use-violation-notices/{id}/disputes
    purpose: "Tenant disputes a use-violation notice"
    input: [grounds_code, narrative, "cure_extension_days?"]
    output: UseViolationDispute
    roles: [TenantRep]
    side_effects: "status=PENDING, filed_by_tenant_id := X-User-ID; parent notice ISSUED->DISPUTED; the cure clock is suspended (cure_deadline_at frozen) so escalation is blocked; center.version incremented"
  - method: GET
    path: /use-violation-disputes/{id}
    purpose: "Read one dispute"
    input: []
    output: UseViolationDispute
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, TenantRep]
    side_effects: "none"
  - method: GET
    path: /use-violation-disputes
    purpose: "List disputes, filterable by disputed notice and filing tenant"
    input: ["notice_id?", "filed_by_tenant_id?", "status?", "grounds_code?", "limit?", "offset?"]
    output: UseViolationDispute[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer]
    side_effects: "none"
  - method: POST
    path: /use-violation-disputes/{id}/adjudicate
    purpose: "Adjudicate a tenant dispute (UPHELD or DENIED)"
    input: [outcome]
    output: UseViolationDispute
    roles: [ComplianceOfficer]
    side_effects: "Requires X-User-ID != notice.issued_by_user_id (priority 12). outcome=UPHELD -> dispute PENDING->UPHELD and notice DISPUTED->WITHDRAWN with every notice side effect reversed. outcome=DENIED -> dispute PENDING->DENIED and notice DISPUTED->ISSUED with cure_deadline_at pushed out by cure_extension_days and cure_restart_count incremented (the cyclic re-notice). center.version incremented"

  # --- OccupancyMeasurement -------------------------------------------------
  - method: POST
    path: /centers/{id}/occupancy-measurements
    purpose: "Remeasure occupancy percentages for the center over a half-open window under one of the two counting variants"
    input: [variant, window_from_date, window_through_date, expected_center_version]
    output: OccupancyMeasurement
    roles: [ComplianceOfficer]
    side_effects: "status=DRAFT, created_by_user_id from X-User-ID, measured_at stamped from the logical clock; every figure computed by occupancy_measurement_snapshot under the requested variant; breached_condition_count computed by running cotenancy_condition_evaluation against the measurement's own figures WITHOUT persisting any condition status; requires expected_center_version == center.version (ERR_STALE_CENTER_VERSION 412); center.version incremented"
  - method: GET
    path: /occupancy-measurements/{id}
    purpose: "Read one occupancy measurement"
    input: []
    output: OccupancyMeasurement
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /occupancy-measurements
    purpose: "List occupancy measurements, filterable by center, variant and status"
    input: ["center_id?", "variant?", "status?", "limit?", "offset?"]
    output: OccupancyMeasurement[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: GET
    path: /centers/{id}/occupancy-measurements
    purpose: "List the remeasurement history of one center"
    input: ["variant?", "status?", "limit?", "offset?"]
    output: OccupancyMeasurement[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: POST
    path: /occupancy-measurements/{id}/certify
    purpose: "Certify a draft measurement so its figures become the controlling numbers for every co-tenancy condition of the center"
    input: []
    output: OccupancyMeasurement
    roles: [ComplianceOfficer]
    side_effects: "Requires X-User-ID != created_by_user_id (priority 13). status DRAFT->CERTIFIED, certified_by_user_id and certified_at stamped; every non-WAIVED CoTenancyCondition of the center is re-evaluated with evaluation_source=CERTIFIED_MEASUREMENT using THIS measurement's variant figures and its last_evaluated_measurement_id is pinned to this measurement; a TRAILING_GRACE certification can therefore flip a LIVE_STRICT BREACHED condition to CURED and unfreeze the center; compliance_posture re-derived; center.version incremented"
  - method: POST
    path: /occupancy-measurements/{id}/supersede
    purpose: "Supersede a certified measurement, releasing the conditions it controls back to LIVE_STRICT"
    input: [supersede_reason_code]
    output: OccupancyMeasurement
    roles: [ComplianceOfficer]
    side_effects: "status CERTIFIED->SUPERSEDED (terminal); every condition whose last_evaluated_measurement_id pointed here is cleared to null and re-evaluated under LIVE_STRICT, which can immediately re-BREACH it; compliance_posture re-derived; center.version incremented"

  # --- RemedyElection -------------------------------------------------------
  - method: POST
    path: /leases/{id}/remedy-elections
    purpose: "Tenant elects a remedy (rent reduction, termination or substitute rent) for a breached co-tenancy condition or an escalated use violation"
    input: [election_kind, "condition_id?", "source_notice_id?", window_from_date, window_through_date, expected_lease_version]
    output: RemedyElection
    roles: [TenantRep]
    side_effects: "status=ELECTED, elected_at stamped; cotenancy_rent_reduction pins shortfall_pct_at_election, reduction_pct and reduced_rent_monthly_cents at election time and they are never recomputed; a TERMINATION election also pins termination_effective_date = breach_detected_at + condition.cure_period_days; abated_to_date_cents=0 while ELECTED; requires expected_lease_version == lease.version (ERR_STALE_LEASE_VERSION 412) and remedy_status IN {ELIGIBLE, REMEDY_ACTIVE} (priority 11); an ELECTED election does NOT yet change effective rent"
  - method: GET
    path: /remedy-elections/{id}
    purpose: "Read one remedy election with its pinned figures and its accrual to date"
    input: []
    output: RemedyElection
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /remedy-elections
    purpose: "List remedy elections, filterable by lease, triggering condition and sourcing notice"
    input: ["lease_id?", "condition_id?", "source_notice_id?", "election_kind?", "status?", "limit?", "offset?"]
    output: RemedyElection[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: POST
    path: /remedy-elections/{id}/approve
    purpose: "Landlord approves the elected remedy, activating it"
    input: []
    output: RemedyElection
    roles: [AssetManager]
    side_effects: "BRANCHING FORK: election_kind RENT_REDUCTION or SUBSTITUTE_RENT -> status ELECTED->REDUCTION_ACTIVE, Lease.remedy_status ->REMEDY_ACTIVE, effective_rent_recompute (SUM-then-ROUND) lowers Lease.effective_rent_monthly_cents, abatement_ledger_rounding (ROUND-then-SUM) sets abated_to_date_cents and Lease.total_abated_cents, and ShoppingCenter.aggregate_effective_rent_cents drops by exactly the lease delta. election_kind TERMINATION -> status ELECTED->TERMINATION_SCHEDULED and Lease.remedy_status ->TERMINATION_PENDING with NO rent change at all. Enforces the abatement window (priority 20) ahead of the 100% stacking cap (priority 21). center.version incremented"
  - method: POST
    path: /remedy-elections/{id}/rescind
    purpose: "Rescind an elected or active remedy and reverse every fiscal side effect"
    input: [rescission_reason_code]
    output: RemedyElection
    roles: [AssetManager, TenantRep]
    side_effects: "COMPENSATING TRANSITION: status ELECTED|REDUCTION_ACTIVE|TERMINATION_SCHEDULED ->RESCINDED (terminal); abated_to_date_cents reset to 0; Lease.total_abated_cents recomputed from the remaining qualifying elections; Lease.effective_rent_monthly_cents restored by effective_rent_recompute; ShoppingCenter.aggregate_effective_rent_cents returns to exactly its pre-approval value with zero drift; Lease.remedy_status falls back to ELIGIBLE when the condition is still BREACHED, otherwise to NONE; center.version incremented"
  - method: POST
    path: /remedy-elections/{id}/consummate
    purpose: "Consummate a scheduled termination or close out an active reduction, freezing its accrual"
    input: []
    output: RemedyElection
    roles: [AssetManager]
    side_effects: "status REDUCTION_ACTIVE|TERMINATION_SCHEDULED ->CONSUMMATED (terminal); abated_to_date_cents frozen at its value on the consummation date and it keeps contributing to Lease.total_abated_cents; a consummated TERMINATION also drives Lease.premises_status ->TERMINATED and Lease.remedy_status ->TERMINATED_BY_REMEDY with the full termination cascade; a consummated reduction stops reducing effective rent immediately; center.version incremented"

  # --- EstoppelCertificate --------------------------------------------------
  - method: POST
    path: /leases/{id}/estoppel-certificates
    purpose: "Request a tenant estoppel certificate pinned to the lease's current version, disclosing co-tenancy and exclusive-use provisions for the lender"
    input: ["measurement_id?", "expedite_requested?"]
    output: EstoppelCertificate
    roles: [LenderRep, AssetManager]
    side_effects: "status=REQUESTED, requested_by_user_id from X-User-ID, pinned_lease_version = lease.version at request time, disclosed_exclusive_count = count of ACTIVE clauses of the lease, disclosed_cotenancy_breach = whether any condition of the lease is BREACHED, disclosed_effective_rent_cents = lease.effective_rent_monthly_cents; base_fee_cents and total_fee_cents from estoppel_fee_assessment (tier keyed on the pre-surcharge subtotal); expedite_requested defaults to false; lender_conditions_met=false"
  - method: GET
    path: /estoppel-certificates/{id}
    purpose: "Read one estoppel certificate with its pinned lease version and fee breakdown"
    input: []
    output: EstoppelCertificate
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /estoppel-certificates
    purpose: "List estoppel certificates, filterable by estopped lease and cited measurement"
    input: ["lease_id?", "measurement_id?", "status?", "limit?", "offset?"]
    output: EstoppelCertificate[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: POST
    path: /estoppel-certificates/{id}/sign
    purpose: "Tenant signs the estoppel certificate"
    input: []
    output: EstoppelCertificate
    roles: [TenantRep]
    side_effects: "status REQUESTED->TENANT_SIGNED and signed_at stamped; lender_conditions_met recomputed as (pinned_lease_version == lease.version AND (no BREACHED CoTenancyCondition of the lease OR disclosed_cotenancy_breach == true)). A certificate whose lease has since advanced is already in status STALE, so this call answers ERR_CERTIFICATE_STALE (409) and mutates nothing."
  - method: POST
    path: /estoppel-certificates/{id}/accept
    purpose: "Lender accepts the signed certificate"
    input: []
    output: EstoppelCertificate
    roles: [LenderRep]
    side_effects: "status TENANT_SIGNED->LENDER_ACCEPTED (terminal) and accepted_at stamped; requires lender_conditions_met true (priority 22)"
  - method: POST
    path: /estoppel-certificates/{id}/reject
    purpose: "Lender rejects the certificate, or the landlord marks it stale after the lease moved"
    input: [rejection_reason_code]
    output: EstoppelCertificate
    roles: [LenderRep, AssetManager]
    side_effects: "status REQUESTED|TENANT_SIGNED|STALE ->REJECTED (terminal); no fee is refunded and total_fee_cents is unchanged"

  # --- RedevelopmentPlan ----------------------------------------------------
  - method: POST
    path: /centers/{id}/redevelopment-plans
    purpose: "Plan a redevelopment or pad sale and compute its impact on protected rights"
    input: [plan_kind, "pad_parcel_lease_id?", "removed_gla_sqft?"]
    output: RedevelopmentPlan
    roles: [AssetManager]
    side_effects: "status = CONSENT_PENDING when consent_required is true, otherwise PLANNED; gla_after_sqft = center.total_gla_sqft - removed_gla_sqft; impacted_clause_count = ACTIVE clauses whose exclusivity_scope is CENTER_WIDE or RADIUS_INCLUSIVE (a PAD_EXCLUDED clause is not impacted by a pad sale); impacted_condition_count = non-WAIVED conditions whose required_occupancy_pct would no longer be met against gla_after_sqft; consent_required = (impacted_clause_count + impacted_condition_count) > 0; center.redevelopment_status ->PLANNED; center.version incremented"
  - method: GET
    path: /redevelopment-plans/{id}
    purpose: "Read one redevelopment plan with its impact counts"
    input: []
    output: RedevelopmentPlan
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep, TenantRep]
    side_effects: "none"
  - method: GET
    path: /redevelopment-plans
    purpose: "List redevelopment plans, filterable by center and by the pad lease being sold"
    input: ["center_id?", "pad_parcel_lease_id?", "plan_kind?", "status?", "limit?", "offset?"]
    output: RedevelopmentPlan[]
    roles: [AssetManager, LeaseAdministrator, ComplianceOfficer, LenderRep]
    side_effects: "none"
  - method: POST
    path: /redevelopment-plans/{id}/record
    purpose: "Record the redevelopment, shrinking the center and suspending the protected rights it impairs"
    input: ["consent_confirmed?"]
    output: RedevelopmentPlan
    roles: [AssetManager]
    side_effects: "Requires consent_confirmed true when consent_required is true (priority 23) and a non-FROZEN posture (priority 9). status PLANNED->RECORDED and recorded_at stamped; center.total_gla_sqft reduced to gla_after_sqft; every impacted ExclusiveUseClause becomes SUSPENDED with suspended_by_plan_id set, dropping center.protected_exclusive_count and letting a previously conflicting use screen CLEAR; open_occupancy_pct recomputed against the smaller denominator, which can CURE a GLA_PCT condition without a single tenant opening; every condition re-evaluated; posture re-derived; center.redevelopment_status ->RECORDED; center.version incremented"
  - method: POST
    path: /redevelopment-plans/{id}/abandon
    purpose: "Abandon a planned or recorded redevelopment, restoring every protected right"
    input: [abandon_reason_code]
    output: RedevelopmentPlan
    roles: [AssetManager]
    side_effects: "COMPENSATING TRANSITION: status PLANNED|RECORDED ->ABANDONED (terminal); center.total_gla_sqft restored to its pre-record value; every clause whose suspended_by_plan_id names this plan returns to ACTIVE with suspended_by_plan_id cleared, restoring center.protected_exclusive_count to exactly its pre-record cardinality; open_occupancy_pct recomputed against the restored denominator; conditions re-evaluated (a cured condition can re-BREACH); posture re-derived; center.redevelopment_status ->NONE; center.version incremented"

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-Role header absent or not one of the five declared roles"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    when: "Caller's role is not in the endpoint's roles list"
  - error_id: ERR_TENANT_SCOPE_FORBIDDEN
    http_status: 403
    when: "A TenantRep whose X-User-ID is one Tenant's id addresses a lease, notice, dispute, election or certificate belonging to a different Tenant"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: "Missing required field, wrong type, undeclared enum member, percentage outside 0..100, negative *_cents, or malformed date"
  - error_id: ERR_CENTER_NOT_FOUND
    http_status: 404
    when: "center id in a path or body does not resolve"
  - error_id: ERR_TENANT_NOT_FOUND
    http_status: 404
    when: "tenant id in a path or body does not resolve"
  - error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    when: "lease id in a path or body (including anchor_lease_id, replacement_for_lease_id, pad_parcel_lease_id) does not resolve"
  - error_id: ERR_CONDITION_NOT_FOUND
    http_status: 404
    when: "co-tenancy condition id in a path or body does not resolve"
  - error_id: ERR_REQUIREMENT_NOT_FOUND
    http_status: 404
    when: "anchor requirement id in a path does not resolve"
  - error_id: ERR_CLAUSE_NOT_FOUND
    http_status: 404
    when: "exclusive-use clause id in a path or body does not resolve"
  - error_id: ERR_RESTRICTION_NOT_FOUND
    http_status: 404
    when: "radius restriction id in a path does not resolve"
  - error_id: ERR_NOTICE_NOT_FOUND
    http_status: 404
    when: "use-violation notice id in a path or body does not resolve"
  - error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    when: "dispute id in a path does not resolve"
  - error_id: ERR_ELECTION_NOT_FOUND
    http_status: 404
    when: "remedy election id in a path does not resolve"
  - error_id: ERR_MEASUREMENT_NOT_FOUND
    http_status: 404
    when: "occupancy measurement id in a path or body does not resolve"
  - error_id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    when: "estoppel certificate id in a path does not resolve"
  - error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    when: "redevelopment plan id in a path does not resolve"
  - error_id: ERR_CENTER_SCOPE_MISMATCH
    http_status: 409
    when: "Two entities referenced by one request belong to different shopping centers"
  - error_id: ERR_STALE_CENTER_VERSION
    http_status: 412
    when: "expected_center_version != ShoppingCenter.version on POST /centers/{id}/occupancy-measurements"
  - error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    when: "expected_lease_version != Lease.version on POST /leases/{id}/remedy-elections"
  - error_id: ERR_CENTER_EXECUTION_FROZEN
    http_status: 409
    when: "The center's compliance_posture is FROZEN and the request would execute a lease, add an exclusive-use clause, add a radius restriction or record a redevelopment"
  - error_id: ERR_LEASE_STATE_INVALID
    http_status: 409
    when: "The requested lease transition is not declared from the lease's current premises_status"
  - error_id: ERR_CONDITION_STATE_INVALID
    http_status: 409
    when: "The requested condition transition is not declared from the condition's current status (for example waiving an already WAIVED condition)"
  - error_id: ERR_NOTICE_STATE_INVALID
    http_status: 409
    when: "The requested notice transition is not declared from the notice's current status (for example curing a CURED or WITHDRAWN notice)"
  - error_id: ERR_DISPUTE_STATE_INVALID
    http_status: 409
    when: "Adjudicating a dispute whose status is already UPHELD, DENIED or WITHDRAWN"
  - error_id: ERR_ELECTION_STATE_INVALID
    http_status: 409
    when: "The requested election transition is not declared from the election's current status (for example approving a RESCINDED election)"
  - error_id: ERR_MEASUREMENT_STATE_INVALID
    http_status: 409
    when: "Certifying a measurement that is not DRAFT, or superseding one that is not CERTIFIED"
  - error_id: ERR_CERTIFICATE_STATE_INVALID
    http_status: 409
    when: "Signing a certificate that is not REQUESTED, or accepting one that is not TENANT_SIGNED"
  - error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    when: "Recording a plan that is not PLANNED, or abandoning an already ABANDONED plan"
  - error_id: ERR_REMEDY_NOT_ELIGIBLE
    http_status: 409
    when: "A remedy election is created while the lease's remedy_status is neither ELIGIBLE nor REMEDY_ACTIVE"
  - error_id: ERR_REMEDY_KIND_NOT_PERMITTED
    http_status: 422
    when: "The requested election_kind is not in the condition's permitted remedy set implied by remedy_type"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    when: "X-User-ID equals the notice issuer on dispute adjudication, or the measurement creator on certification"
  - error_id: ERR_EXCLUSIVE_USE_CONFLICT
    http_status: 422
    when: "Executing a lease whose primary_use_code collides with at least one ACTIVE exclusive-use clause that no carve-out suppresses"
  - error_id: ERR_DISPUTE_PENDING
    http_status: 409
    when: "Curing, escalating or withdrawing a notice whose status is DISPUTED because a UseViolationDispute of that notice is still PENDING"
  - error_id: ERR_CURE_PERIOD_NOT_EXPIRED
    http_status: 409
    when: "Escalating a notice before cure_deadline_at, or approving a termination election whose termination_effective_date precedes breach_detected_at plus cure_period_days"
  - error_id: ERR_RADIUS_WINDOW_OVERLAP
    http_status: 409
    when: "A new radius restriction for the lease shares at least one day with an existing ACTIVE restriction (closed-closed windows, touching endpoints collide)"
  - error_id: ERR_RADIUS_WINDOW_INACTIVE
    http_status: 409
    when: "Reporting a radius violation against a restriction that is not ACTIVE or whose closed window does not contain the current logical clock date"
  - error_id: ERR_MEASUREMENT_WINDOW_OVERLAP
    http_status: 409
    when: "A new measurement window interior-overlaps an existing window of the same center (half-open windows, adjacency at the boundary is allowed)"
  - error_id: ERR_ABATEMENT_WINDOW_INVALID
    http_status: 422
    when: "window_from_date >= window_through_date, or window_from_date precedes the condition's breach_detected_at date"
  - error_id: ERR_ABATEMENT_STACK_EXCEEDED
    http_status: 422
    when: "Approving an election would push the summed reduction_pct of window-overlapping REDUCTION_ACTIVE elections above 100.00"
  - error_id: ERR_LENDER_CONDITIONS_NOT_MET
    http_status: 422
    when: "Accepting a certificate whose lender_conditions_met is false - typically a TENANT_SIGNED certificate whose lease sits at use_compliance_status UNDER_NOTICE or IN_VIOLATION, or whose lease has a BREACHED condition the certificate did not disclose"
  - error_id: ERR_CERTIFICATE_STALE
    http_status: 409
    when: "Signing a certificate whose status has already been driven to STALE by a lease version change"
  - error_id: ERR_PROTECTED_RIGHTS_CONSENT_REQUIRED
    http_status: 409
    when: "Recording a redevelopment plan whose consent_required is true without consent_confirmed true"
  - error_id: ERR_MEASUREMENT_BASIS_MISMATCH
    http_status: 422
    when: "A GLA_PCT condition omits required_occupancy_pct or supplies required_open_store_count, or a STORE_COUNT condition does the reverse"
  - error_id: ERR_CONDITION_KIND_INVALID
    http_status: 422
    when: "An OPENING condition is added to an already OPEN lease, or an ONGOING condition is added to a DRAFT lease"
  - error_id: ERR_CLAUSE_NOT_ACTIVE
    http_status: 422
    when: "A use-violation notice cites an exclusive-use clause whose status is not ACTIVE"
  - error_id: ERR_SUITE_ALREADY_LEASED
    http_status: 409
    when: "A second non-TERMINATED lease is drafted or executed for the same suite_code in the same center"

# =============================================================================
# 1.7 RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: LeaseAdministrator
    identity: opaque
    description: "Abstracts lease documents: drafts leases, records co-tenancy conditions, anchor requirements, exclusive-use clauses and radius restrictions, executes leases, and drives premises status."
    exclusive_operations:
      - "POST /tenants"
      - "POST /centers/{id}/leases"
      - "POST /leases/{id}/execute"
      - "POST /leases/{id}/co-tenancy-conditions"
      - "POST /co-tenancy-conditions/{id}/anchor-requirements"
      - "POST /leases/{id}/exclusive-use-clauses"
      - "POST /leases/{id}/radius-restrictions"
    shared_operations:
      - "PATCH /tenants/{id} (with ComplianceOfficer)"
      - "POST /leases/{id}/screen-use (with ComplianceOfficer)"
      - "POST /leases/{id}/open, /go-dark, /reopen (with TenantRep)"
      - "POST /use-violation-notices (with ComplianceOfficer)"
      - "POST /use-violation-notices/{id}/cure (with ComplianceOfficer)"
      - "POST /_clock/set_current_utc (with ComplianceOfficer, AssetManager)"
      - "all GET reads"
  - name: ComplianceOfficer
    identity: opaque
    description: "Polices use and radius compliance and owns remeasurement. Issues notices, adjudicates disputes, escalates and withdraws notices, and creates/certifies occupancy measurements. Segregation of duties applies twice: the officer who issued a notice cannot adjudicate its dispute, and the officer who created a measurement cannot certify it."
    exclusive_operations:
      - "POST /radius-restrictions/{id}/violation-report"
      - "POST /use-violation-notices/{id}/escalate"
      - "POST /use-violation-notices/{id}/withdraw"
      - "POST /use-violation-disputes/{id}/adjudicate"
      - "POST /centers/{id}/occupancy-measurements"
      - "POST /occupancy-measurements/{id}/certify"
      - "POST /occupancy-measurements/{id}/supersede"
      - "POST /centers/{id}/compliance-sweep"
    shared_operations:
      - "PATCH /tenants/{id} (with LeaseAdministrator)"
      - "POST /leases/{id}/screen-use (with LeaseAdministrator)"
      - "POST /use-violation-notices (with LeaseAdministrator)"
      - "POST /use-violation-notices/{id}/cure (with LeaseAdministrator)"
      - "POST /_clock/set_current_utc (with LeaseAdministrator, AssetManager)"
      - "all GET reads"
  - name: AssetManager
    identity: opaque
    description: "Owns the asset: registers centers, terminates leases, waives conditions, approves or rescinds remedy elections, consummates them, and plans/records/abandons redevelopment."
    exclusive_operations:
      - "POST /centers"
      - "POST /leases/{id}/terminate"
      - "POST /co-tenancy-conditions/{id}/waive"
      - "POST /remedy-elections/{id}/approve"
      - "POST /remedy-elections/{id}/consummate"
      - "POST /centers/{id}/redevelopment-plans"
      - "POST /redevelopment-plans/{id}/record"
      - "POST /redevelopment-plans/{id}/abandon"
    shared_operations:
      - "POST /remedy-elections/{id}/rescind (with TenantRep)"
      - "POST /leases/{id}/estoppel-certificates (with LenderRep)"
      - "POST /estoppel-certificates/{id}/reject (with LenderRep)"
      - "POST /_clock/set_current_utc (with LeaseAdministrator, ComplianceOfficer)"
      - "all GET reads except GET /tenants/{id}/use-violation-disputes"
  - name: TenantRep
    identity: "entity_backed:Tenant"
    description: "Acts for one tenant; for this role X-User-ID IS the acting Tenant's id. Elects remedies, disputes notices, signs estoppel certificates, and reports opening or going dark. Every write is scoped to that tenant's own leases (ERR_TENANT_SCOPE_FORBIDDEN)."
    exclusive_operations:
      - "POST /leases/{id}/remedy-elections"
      - "POST /use-violation-notices/{id}/disputes"
      - "POST /estoppel-certificates/{id}/sign"
    shared_operations:
      - "POST /leases/{id}/open, /go-dark, /reopen (with LeaseAdministrator)"
      - "POST /remedy-elections/{id}/rescind (with AssetManager)"
      - "GET /tenants/{id}/use-violation-disputes (with LeaseAdministrator, ComplianceOfficer)"
      - "single-entity GET reads"
  - name: LenderRep
    identity: opaque
    description: "Acts for the mortgage lender. Requests estoppel certificates, accepts or rejects them, and reads the co-tenancy and exclusive-use record. Holds no operational write authority over leases, notices or remedies."
    exclusive_operations:
      - "POST /estoppel-certificates/{id}/accept"
    shared_operations:
      - "POST /leases/{id}/estoppel-certificates (with AssetManager)"
      - "POST /estoppel-certificates/{id}/reject (with AssetManager)"
      - "all GET reads except GET /tenants/{id}/use-violation-disputes"
