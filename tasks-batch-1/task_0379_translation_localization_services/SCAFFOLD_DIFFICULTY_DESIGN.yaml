  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_quote_nested_tier_rush_cert_mode_a
        grounds:
          - calculations.quote_estimate
          - entities.Project.fields.quoted_total_cents
          - entities.Project.fields.rush_tier
        distinguishing_aspect: |
          MODE (a) non-linear ≥3-input interaction: per-band weighted subtotal feeds a tiered
          volume discount, then a rush multiplier branch, then a per-page cert add-on — output
          quoted_total_cents=39613 cannot be expressed as a single linear combination.
        test_recipe:
          setup:
            - "Project EXPRESS + CERTIFIED; one job {NO_MATCH 1200, FUZZY 600, REPS 400, CONTEXT 300}; weighted_words 1775 (tier 0%)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", rate_card_id: "${rc_id}", name: "P1", rush_tier: "EXPRESS", certification_mode: "CERTIFIED" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/jobs"
              payload: { filename: "a.docx", quoted_no_match_words: 1200, quoted_fuzzy_words: 600, quoted_reps_words: 400, quoted_context_words: 300 }
              as: ProjectManager
          trigger:
            - call: "POST /projects/${proj_id}/quote"
              payload: {}
              as: ProjectManager
              captures: { quoted_total: $.data.quoted_total_cents }
          assert:
            - "Project.${proj_id}.quoted_total_cents == 39613"

      - name: cf_quote_round_per_band_then_sum_order_pinned_mode_b
        grounds:
          - calculations.quote_estimate
          - entities.ProjectJob.fields.quoted_fuzzy_words
          - entities.Project.fields.quoted_total_cents
        distinguishing_aspect: |
          MODE (b) nested rounding order: with base_rate=15 and one job {FUZZY 2, REPS 2, CONTEXT 2,
          NO_MATCH 800}, round-per-band-then-sum gives translation subtotal 12036 (=12000+20+11+5)
          whereas sum-then-round gives 12035; the scaffold pins per-band rounding, so quoted_total_cents=12036.
        test_recipe:
          setup:
            - "Project STANDARD + NONE; one job {NO_MATCH 800, FUZZY 2, REPS 2, CONTEXT 2}; weighted_words 806 (tier 0%)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", rate_card_id: "${rc_id}", name: "P-round" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/jobs"
              payload: { filename: "r.docx", quoted_no_match_words: 800, quoted_fuzzy_words: 2, quoted_reps_words: 2, quoted_context_words: 2 }
              as: ProjectManager
          trigger:
            - call: "POST /projects/${proj_id}/quote"
              payload: {}
              as: ProjectManager
              captures: { quoted_total: $.data.quoted_total_cents }
          assert:
            - "Project.${proj_id}.quoted_total_cents == 12036"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_projectjob_qa_revision_cycle
        grounds:
          - state_machines.ProjectJob.IN_QA_to_REVISION
          - state_machines.ProjectJob.REVISION_to_IN_QA
          - entities.ProjectJob.fields.revision_rounds
        distinguishing_aspect: |
          Cycle on ProjectJob: IN_QA→REVISION (QA FAIL) → IN_QA (resubmit, revision_rounds+1) →
          REVISION again is reachable; a failed QA then a passed QA leaves revision_rounds=1, status QA_PASSED.
        test_recipe:
          setup:
            - "Job in IN_QA after first translation submit; first QA fails (score 88.5 < 90), second QA passes."
          setup_api_calls:
            - call: "POST /clients"
