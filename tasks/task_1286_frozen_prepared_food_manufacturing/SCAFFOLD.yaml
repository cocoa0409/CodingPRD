# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Lot releaser equals a CCP performer on the batch, or complaint resolver equals the complaint reporter" }
  - { id: ERR_CROSS_CUSTOMER_ACCESS, http: 403, condition: "CoPackCustomer accessing an order/lot/complaint outside their own customer scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, or out-of-range numeric" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version / expected_batch_version does not match the parent's current version" }
  - { id: ERR_RECIPE_STATE, http: 409, condition: "Recipe transition not allowed from current status (e.g. approve from RETIRED, component edit on non-DRAFT recipe)" }
  - { id: ERR_RECIPE_NOT_APPROVED, http: 409, condition: "Order creation or batch kitting references a recipe that is not APPROVED" }
  - { id: ERR_RECIPE_BUSY, http: 409, condition: "Revise/retire blocked: a batch of this recipe is in a non-terminal state" }
  - { id: ERR_RECIPE_NO_COMPONENTS, http: 409, condition: "Approve requires at least one BOM component" }
  - { id: ERR_RECIPE_COMPONENT_CYCLE, http: 409, condition: "Approve blocked: parent_component_id graph contains a cycle" }
  - { id: ERR_ORDER_NOT_OPEN, http: 409, condition: "Order is CANCELLED/COMPLETED for batch creation, or has non-CREATED batches for cancellation" }
  - { id: ERR_BATCH_STATE, http: 409, condition: "Batch transition or batch-dependent operation not allowed from current batch status (incl. cycle start before COOKED, run start before FROZEN, resume gate)" }
  - { id: ERR_CYCLE_STATE, http: 409, condition: "Cycle transition not allowed from current status (e.g. void an IN_PROGRESS cycle)" }
  - { id: ERR_RUN_STATE, http: 409, condition: "Line run transition not allowed from current status (e.g. start a CANCELLED run)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Freezer load_kg > cell.capacity_kg" }
  - { id: ERR_BELOW_MIN_LOAD, http: 409, condition: "Freezer load_kg < cell.min_load_kg" }
  - { id: ERR_CELL_WINDOW_CONFLICT, http: 409, condition: "Cycle window collides with another RESERVED/IN_PROGRESS cycle on the cell including the sanitation buffer" }
  - { id: ERR_NO_CELL_AVAILABLE, http: 409, condition: "cell_id omitted and no cell satisfies load and window constraints" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "Line run window collides with another SCHEDULED/IN_PROGRESS run including the customer/allergen changeover buffer" }
  - { id: ERR_LINE_FORMAT_MISMATCH, http: 409, condition: "pack_format requires TRAY (RETAIL) or POUCH (FOODSERVICE) line" }
  - { id: ERR_FILM_TYPE_MISMATCH, http: 409, condition: "Film lot film_type differs from line supported_film_type" }
  - { id: ERR_FILM_LOT_QUARANTINED, http: 409, condition: "Film lot is QUARANTINED at run creation or run start" }
  - { id: ERR_FILM_INSUFFICIENT, http: 409, condition: "meters_available < reserved_film_m required for the run" }
  - { id: ERR_CCP_NOT_CURRENT, http: 409, condition: "Lot release blocked: latest CCP check of each required type (METAL_DETECTOR, XRAY) missing or not PASS" }
  - { id: ERR_LOT_STATE, http: 409, condition: "Lot transition or lot-dependent operation not allowed from current release_status (incl. complaint on QA_PENDING/REJECTED/RECALLED lot, withdraw from non-RELEASED lot)" }
  - { id: ERR_LOT_EXPIRED, http: 409, condition: "Release or SHIPMENT withdrawal after final_expiry_date" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 409, condition: "Put-away would push slot.occupied_cases above capacity_cases" }
  - { id: ERR_TEMPERATURE_CLASS_MISMATCH, http: 409, condition: "Lot of a recipe with shelf_life_days > 545 put away into a STANDARD slot" }
  - { id: ERR_INSUFFICIENT_CASES, http: 409, condition: "Withdraw cases > lot.stored_cases" }
  - { id: ERR_COMPLAINT_STATE, http: 409, condition: "Complaint transition not allowed from current status (e.g. resolve from OPEN, resolve twice)" }
  - { id: ERR_COMPLAINT_UNITS_INVALID, http: 422, condition: "units_affected > lot.cases_produced" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant administration: recipes, BOM, customers, cells, lines, slots, film reception, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /plant/recipes + approve/revise/retire + component create/re-parent"
      - "POST /plant/copack-customers, /plant/freezer-cells, /plant/packaging-lines, /plant/storage-slots, /plant/film-lots"
      - "POST /plant/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: ProductionPlanner
    description: "Plans production: orders, batches, freezing cycles, line runs"
    identity: opaque
    exclusive_operations:
      - "POST /plant/production-orders (+cancel), /plant/production-orders/{id}/batches"
      - "POST /plant/production-batches/{id}/freezing-cycles, /plant/freezing-cycles/{id}/void, /plant/production-batches/{id}/cancel"
      - "POST /plant/packaging-lines/{id}/runs, /plant/line-runs/{id}/cancel"
    shared_operations: ["All GET endpoints"]
  - name: LineOperator
    description: "Executes production steps: kit, cook, freeze, pack"
    identity: opaque
    exclusive_operations:
      - "POST /plant/production-batches/{id}/kit|cook|complete"
      - "POST /plant/freezing-cycles/{id}/start|complete"
      - "POST /plant/line-runs/{id}/start|complete"
    shared_operations: ["All GET endpoints"]
  - name: QATechnician
    description: "Quality floor role: CCP checks, batch holds, film/lot quarantine, complaint intake and investigation"
    identity: opaque
    exclusive_operations:
      - "POST /plant/production-batches/{id}/ccp-checks, /hold, /resume"
      - "POST /plant/film-lots/{id}/quarantine, /plant/lots/{id}/quarantine"
      - "POST /plant/complaints/{id}/investigate"
    shared_operations: ["All GET endpoints", "POST /plant/complaints (shared with CoPackCustomer)"]
  - name: QAManager
    description: "Quality disposition authority: lot release/reject/rework/recall, complaint resolution, film de-quarantine. Segregated from CCP performers and complaint reporters."
    identity: opaque
    exclusive_operations:
      - "POST /plant/lots/{id}/release|reject|rework|recall"
      - "POST /plant/complaints/{id}/resolve"
      - "POST /plant/film-lots/{id}/release-quarantine"
      - "POST /plant/production-batches/{id}/rework"
    shared_operations: ["All GET endpoints"]
  - name: WarehouseLead
    description: "Cold storage movements: put-away and withdrawal"
    identity: opaque
    exclusive_operations:
      - "POST /plant/lots/{id}/put-away, /plant/lots/{id}/withdraw"
    shared_operations: ["All GET endpoints"]
  - name: CoPackCustomer
    description: "External co-pack customer portal role: reads own orders/lots/complaints, files complaints on own lots"
    identity: "entity_backed:CoPackCustomer"
    exclusive_operations: []
    shared_operations:
      - "GET /plant/production-orders(+/{id}), /plant/lots(+/{id}), /plant/complaints/{id}, /plant/lots/{id}/complaints, /plant/copack-customers/{id} (own scope only)"
      - "POST /plant/complaints (shared with QATechnician; own lots only)"
