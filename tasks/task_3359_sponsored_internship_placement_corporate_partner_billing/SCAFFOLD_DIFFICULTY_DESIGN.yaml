              as: ProgramStaff
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-07", period_end: "2026-09-20", hours_attended: 98, hours_expected: 140, behavior_incidents: 4 }
              as: ProgramStaff
              captures: { st1_id: "$.data.id" }
            - call: "POST /stipend-statements/${st1_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-21", period_end: "2026-10-04", hours_attended: 133, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st2_id: "$.data.id" }
            - call: "POST /stipend-statements/${st2_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-10-05", period_end: "2026-10-18", hours_attended: 140, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st3_id: "$.data.id" }
          trigger:
            - call: "POST /stipend-statements/${st3_id}/payments"
              payload: {}
              as: ProgramStaff
          assert:
            - "Cohort.${c_id}.awarded_points == 204"
            - "after only the second payment the award stood at 103 (level 1 over the raw total 8), so the tier boundary at 10 points is crossed by the third payment"
            - "Student.${s_id}.lifetime_contract_points == 13"

  - rule_id: non_linear_state_machine
    instances:
      - name: placement_interview_cycle_returns_to_matching_pool
        grounds:
          - state_machines.InternshipPlacement.INTERVIEW_SCHEDULED_to_MATCHED
          - state_machines.InternshipPlacement.INTERVIEWED_to_INTERVIEW_SCHEDULED
          - entities.InternshipPlacement.fields.max_interview_rounds
        distinguishing_aspect: "the InternshipPlacement machine is cyclic — a FAILED outcome on the final allowed round sends the placement back to MATCHED, the state it already occupied, and a FAILED outcome with rounds left re-opens INTERVIEWED to INTERVIEW_SCHEDULED — instead of a linear pipeline."
