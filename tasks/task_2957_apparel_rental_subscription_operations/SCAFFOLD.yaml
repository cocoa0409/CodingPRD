  # --- retirement & resale recovery -------------------------------------------
  - method: POST
    path: "/resale-listings"
    description: "List a retired unit on a resale channel; guarded by OCC on the unit's version"
    roles: [InventoryPlanner]
    code: 201
    input: [rental_unit_id, expected_rental_unit_version, channel, "supersedes_listing_id?"]
    output: ResaleListing
    side_effects: ["OCC guard on expected_rental_unit_version; increments RentalUnit.version by 1", "calculation resale_pricing sets base_price_cents, list_price_cents, channel_fee_cents, net_recovery_cents and floor_adjusted", "markdown_step inherited from the superseded listing plus 1, or 0 for a first listing", "state DRAFT -> LISTED in the same request, listed_at stamped"]
  - method: GET
    path: "/resale-listings/{listing_id}"
    description: "Read one resale listing"
    roles: [InventoryPlanner, PlatformAdmin]
    code: 200
    input: []
    output: ResaleListing
    side_effects: []
  - method: GET
    path: "/resale-listings"
    description: "List resale listings, optionally filtered by unit, superseded predecessor, channel or state"
    roles: [InventoryPlanner, PlatformAdmin]
    code: 200
    input: ["rental_unit_id?", "supersedes_listing_id?", "channel?", "state?", "limit?", "offset?"]
    output: ResaleListing[]
    side_effects: []
  - method: POST
    path: "/resale-listings/{listing_id}/expiration"
