  - section: state_machines
    instances:
      - name: initial_states_are_declared_across_all_lifecycles
        claim_type: Initial State
        grounds:
          - state_machines.ApiVersion.lifecycle_state
          - state_machines.SandboxLease.state
          - state_machines.ViolationCase.state
          - state_machines.SupportCase.state
          - state_machines.FeedbackItem.state
        distinguishing_aspect: >-
          Five independent machines must each open in their declared initial_state on creation
          — PREVIEW, ACTIVE, OPENED, OPEN, SUBMITTED — with the fields that only later
          transitions populate still null (sunset_at, released_at, appeal_deadline,
          resolved_at, priority_score), while the fields computed at creation time are already
          filled (lease expires_at, case penalty_points, first_response_due_minutes).
        test_recipe:
          setup:
            - "the clock is at 2026-08-01T00:00:00Z and one product plus one docs-acknowledged developer exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /api-products/${p1_id}/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /sandbox-leases"
              payload: { developer_id: "${d1_id}", api_product_id: "${p1_id}", starts_at: "2026-08-01T00:00:00Z", lease_days: 3, sample_app_slug: "quickstart-node" }
