            - "FindingAid.${aid_id}.revision_cycle_count == 0"

      - name: oral_history_consent_returns_from_restricted_to_signed_on_second_sign
        claim_type: valid_transition
        grounds:
          - state_machines.OralHistoryInterview#consent_status.RESTRICTED_to_SIGNED
          - complexity_profile.state_machine_shape
          - calculations.interview_release_state
        distinguishing_aspect: "The consent axis is cyclic: SIGN -> RESTRICT -> SIGN returns consent_status to SIGNED without incrementing withdrawal_count, and release_state stays WITHHELD because transcription_status is still NOT_STARTED."
        test_recipe:
          setup:
            - "One Accession with one OralHistoryInterview whose consent axis has been SIGNED and then RESTRICTED."
