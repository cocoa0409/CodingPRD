scenario: "2338. Identity Verification & Age Assurance Service (identity verification provider): verification method selection across document scanning, database checks, biometric comparison and knowledge-based methods by risk level, document authenticity assessment with tamper detection and security feature validation, liveness detection to prevent presentation attacks with false accept and false reject tuning, age assurance methods including estimation and verification with accuracy documentation by age band, accessibility and inclusion considerations for people without standard documentation with alternative pathways, biometric data retention limits with deletion after verification where required, bias testing across demographic groups with performance disparity remediation, client integration with step-up verification triggers and manual review escalation"
domain_name: "identity-verification-age-assurance"
api_prefix: "/idv"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    Flat topology: every entity is a peer collection under /idv with foreign-key
    references in bodies; no business entity is addressed through a nested
    parent id. Reverse navigation is provided by filtered lists and by
    read-only sub-resource collections.
    VerificationSession carries two independent state axes (identity_state x
    age_state) plus two cycles (AWAITING_EVIDENCE -> IN_PROGRESS step-up loop,
    MANUAL_REVIEW -> IN_PROGRESS return-for-step-up loop); BiasAudit carries a
    remediation cycle; AlternativePathway carries a fork-join on pathway_type.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "relying-party display name"
        constraints: "1..120 chars, required"
      - name: home_jurisdiction_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 code of the client's home jurisdiction"
        constraints: "exactly 2 uppercase letters, required"
      - name: integration_state
        type: enum
        source: system
        description: "integration posture gating all session traffic"
        default: SANDBOX
        constraints: "one of {SANDBOX, LIVE, SUSPENDED}; SANDBOX at creation, LIVE/SUSPENDED via PATCH /idv/clients/{id}"
      - name: biometric_retention_mode
        type: enum
        source: input
        description: "retention rule applied to BiometricTemplate rows when a session reaches a terminal identity_state"
        constraints: "one of {DELETE_ON_COMPLETE, RETAIN_90_DAYS, RETAIN_WITH_CONSENT}, required"
      - name: daily_session_quota
        type: integer
        source: input
        description: "maximum VerificationSession rows the client may create inside the rolling 24h window defined in calculations.client_rolling_window_usage"
        constraints: ">= 1, required"
      - name: granted_review_credits
        type: integer
        source: input
        description: "size of the manual-review concurrency pool granted to this client"
        constraints: ">= 0, required"
      - name: reserved_review_credits
        type: integer
        source: computed
        description: "credits currently held by ManualReviewCase rows with state == ASSIGNED"
        default: 0
        constraints: "0 <= reserved_review_credits <= granted_review_credits"
      - name: available_review_credits
        type: integer
        source: computed
        description: "granted_review_credits - reserved_review_credits; conserved invariant per calculations.review_credit_pool"
        default: "equal to granted_review_credits at creation, then re-derived per calculations.review_credit_pool"
        constraints: "reserved_review_credits + available_review_credits == granted_review_credits at all times"
      - name: stored_template_count
        type: integer
        source: computed
        description: "count of BiometricTemplate rows with state == STORED whose session_id belongs to this client"
        default: 0
        constraints: ">= 0"
      - name: pending_stepup_count
        type: integer
        source: computed
        description: "count of this client's VerificationSession rows with identity_state == AWAITING_EVIDENCE"
        default: 0
        constraints: ">= 0"
      - name: consumed_review_count
        type: integer
        source: computed
        description: "lifetime count of ManualReviewCase rows for this client that reached state == DECIDED"
        default: 0
        constraints: ">= 0"

  - name: MethodProfile
    parent: null
    common_fields: true
    fields:
      - name: method_code
        type: enum
        source: input
        description: "verification method this profile configures"
        constraints: "one of {DOCUMENT_SCAN, DATABASE_CHECK, BIOMETRIC_COMPARISON, KNOWLEDGE_BASED, VOUCHING_ATTESTATION, AGE_ESTIMATION}, required"
      - name: vendor_code
        type: string
        source: input
        description: "vendor identifier; (method_code, vendor_code) is unique across MethodProfile"
        constraints: "1..24 chars, required"
      - name: assurance_weight
        type: integer
        source: input
        description: "maximum assurance points this method can contribute to a session"
        constraints: "1..100, required"
      - name: acceptance_floor_bps
        type: integer
        source: input
        description: "minimum evidence_quality_bps for an attempt on this profile to be ACCEPTED at finalize"
        constraints: "0..10000, required"
      - name: far_bps
        type: integer
        source: input
        description: "documented false accept rate in basis points"
        constraints: "0..10000, required"
      - name: frr_bps
        type: integer
        source: input
        description: "documented false reject rate in basis points"
        constraints: "0..10000, required"
      - name: strong_evidence
        type: boolean
        source: input
        description: "true when the method is admissible for HIGH risk_level sessions"
        constraints: required
      - name: cost_cents
        type: integer
        source: input
        description: "per-attempt vendor cost; second sort key of the method selector"
        constraints: ">= 0, required"
      - name: estimation_mae_months
        type: integer
        source: input
        description: "documented mean absolute error of age estimation in months; 0 for non-estimation methods"
        default: 0
        constraints: ">= 0"
      - name: band_accuracy_bps
        type: object
        source: input
        description: "documented accuracy per age band, keys subset of {U13, B13_15, B16_17, B18_20, A21_PLUS}, values 0..10000"
        default: {}
        constraints: "required to contain the resolved band when this profile backs an AGE_ESTIMATION result"
      - name: bias_state
        type: enum
        source: system
        description: "bias posture derived from BiasAudit evaluations"
        default: CLEARED
        constraints: "one of {CLEARED, MONITORED, RESTRICTED}; written only by bias-audit evaluate/remediation transitions"
      - name: restricted_at
        type: datetime
        source: system
        description: "logical-clock instant at which bias_state last became RESTRICTED; null otherwise"
        default: null

  - name: VerificationPolicy
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; owning relying-party client"
        constraints: required
      - name: policy_version
        type: integer
        source: input
        description: "client-scoped policy version number; unique per (client_id, policy_version)"
        constraints: ">= 1, required"
      - name: state
        type: enum
        source: system
        description: "publication lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, RETIRED}"
      - name: allowed_method_codes
        type: array
        source: input
        description: "identity method ladder this policy admits"
        constraints: "non-empty array, values distinct and subset of {DOCUMENT_SCAN, DATABASE_CHECK, BIOMETRIC_COMPARISON, KNOWLEDGE_BASED}, required"
      - name: min_assurance_score
        type: integer
        source: input
        description: "minimum assurance_score_final for an unaided VERIFIED disposition"
        constraints: "1..100, required"
      - name: doc_authenticity_floor_bps
        type: integer
        source: input
        description: "authenticity_score_bps at or above which a DocumentCapture is assessed AUTHENTIC"
        default: 8000
        constraints: "5001..10000"
      - name: pad_threshold_bps
        type: integer
        source: input
        description: "baseline presentation-attack-detection threshold before risk, retry and modality adjustments"
        default: 7500
        constraints: "1000..9500"
      - name: required_min_age_years
        type: integer
        source: input
        description: "minimum subject age the policy gates on; 0 disables the age axis"
        default: 0
        constraints: "0..25"
      - name: age_buffer_multiplier_bps
        type: integer
        source: input
        description: "multiplier applied to a profile's estimation_mae_months to derive the age-estimation safety buffer"
        default: 15000
        constraints: "10000..30000"
      - name: step_up_max_rounds
        type: integer
        source: input
        description: "maximum number of step-up rounds a session may consume"
        default: 2
        constraints: "0..5"
      - name: alternative_pathway_enabled
        type: boolean
        source: input
        description: "whether subjects without standard documentation may request an AlternativePathway"
        default: true
      - name: published_at
        type: datetime
        source: system
        description: "logical-clock instant of the DRAFT -> PUBLISHED transition; null while DRAFT"
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: "logical-clock instant of the PUBLISHED -> RETIRED transition; null otherwise"
        default: null
      - name: degraded_flag
        type: boolean
        source: computed
        description: "true when at least one MethodProfile whose method_code is in allowed_method_codes has bias_state == RESTRICTED"
        default: false

  - name: VerificationSession
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the relying party that opened the session"
        constraints: required
      - name: policy_id
        type: string
        source: computed
        description: "FK -> VerificationPolicy.id; version-pinned at creation by calculations.policy_pinning_selector"
        constraints: "never supplied by the caller"
      - name: external_subject_ref
        type: string
        source: input
        description: "client-side pseudonymous subject reference; groups prior sessions for risk scoring"
        constraints: "1..64 chars, required"
      - name: requested_assurance_tier
        type: enum
        source: input
        description: "assurance tier the client asks for"
        constraints: "one of {BASIC, STANDARD, ENHANCED}, required"
      - name: declared_transaction_value_cents
        type: integer
        source: input
        description: "value of the transaction being protected; feeds the risk score"
        default: 0
        constraints: ">= 0"
      - name: subject_jurisdiction_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 code the subject presents"
        constraints: "exactly 2 uppercase letters, required"
      - name: biometric_consent
        type: boolean
        source: input
        description: "explicit subject consent to biometric processing"
        default: false
      - name: documentation_status
        type: enum
        source: input
        description: "whether the subject holds standard documentation"
        default: STANDARD_DOCS
        constraints: "one of {STANDARD_DOCS, NO_STANDARD_DOCS}"
      - name: risk_score
        type: integer
        source: computed
        description: "risk points from calculations.session_risk_assessment, frozen at creation"
        constraints: ">= 0"
      - name: risk_level
        type: enum
        source: computed
        description: "risk band derived from risk_score, frozen at creation"
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: identity_state
        type: enum
        source: system
        description: "identity axis of the session state machine"
        default: IN_PROGRESS
        constraints: "one of {IN_PROGRESS, AWAITING_EVIDENCE, MANUAL_REVIEW, VERIFIED, REJECTED, EXPIRED}"
      - name: age_state
        type: enum
        source: system
        description: "age-assurance axis of the session state machine, independent of identity_state"
        constraints: "one of {NOT_REQUIRED, PENDING, ASSURED, FAILED}; NOT_REQUIRED when policy.required_min_age_years == 0 else PENDING at creation"
      - name: assurance_score_provisional
        type: integer
        source: computed
        description: "running score per calculations.assurance_score variant PROVISIONAL"
        default: 0
        constraints: "0..100"
      - name: assurance_score_final
        type: integer
        source: computed
        description: "score per calculations.assurance_score variant FINAL, written once at the terminal disposition; null before that"
        default: null
        constraints: "0..100 or null"
      - name: assurance_ceiling
        type: integer
        source: computed
        description: "upper bound applied to assurance_score_final; lowered to 70 when an ATTESTATION AlternativePathway is APPROVED"
        default: 100
        constraints: "1..100"
      - name: resolved_age_band
        type: enum
        source: computed
        description: "band of the most recent AgeAssuranceResult for this session, regardless of that result's decision"
        default: null
        constraints: "one of {U13, B13_15, B16_17, B18_20, A21_PLUS} or null"
      - name: fraud_signal_count
        type: integer
        source: computed
        description: "count of this session's MethodAttempt rows with tamper_flag == true"
        default: 0
        constraints: ">= 0"
      - name: step_up_round
        type: integer
        source: computed
        description: "number of completed step-up rounds"
        default: 0
        constraints: ">= 0"
      - name: manual_override_flag
        type: boolean
        source: computed
        description: "true when the terminal disposition came from a ManualReviewCase decision"
        default: false
      - name: disposition_reason
        type: enum
        source: computed
        description: "reason recorded when identity_state becomes terminal"
        default: null
        constraints: "one of {SCORE_SATISFIED, MANUAL_OVERRIDE, AGE_GATE_FAILED, REVIEW_REJECTED, REVIEW_LAPSED, EXPIRED_TTL} or null"
      - name: expires_at
        type: datetime
        source: computed
        description: "created_at + SESSION_TTL_MINUTES on the logical clock"
      - name: completed_at
        type: datetime
        source: system
        description: "logical-clock instant at which identity_state became terminal; null otherwise"
        default: null

  - name: MethodAttempt
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> VerificationSession.id; owning session"
        constraints: required
      - name: method_profile_id
        type: string
        source: computed
        description: "FK -> MethodProfile.id; either the caller's requested profile or the winner of calculations.method_candidate_selection"
      - name: method_code
        type: enum
        source: system
        description: "copied from the resolved MethodProfile.method_code"
        constraints: "one of {DOCUMENT_SCAN, DATABASE_CHECK, BIOMETRIC_COMPARISON, KNOWLEDGE_BASED, VOUCHING_ATTESTATION}"
      - name: selection_mode
        type: enum
        source: system
        description: "how the profile was chosen"
        constraints: "one of {CLIENT_REQUESTED, SERVER_SELECTED, PATHWAY_GRANTED}"
      - name: retry_index
        type: integer
        source: computed
        description: "count of pre-existing attempts on the same session with the same method_code"
        default: 0
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        description: "attempt lifecycle state"
        default: AWAITING_EVIDENCE
        constraints: "one of {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE, ACCEPTED, REJECTED, EXPIRED}"
      - name: evidence_quality_bps
        type: integer
        source: computed
        description: "method-specific evidence quality per calculations.method_evidence_quality; null before evidence is submitted"
        default: null
        constraints: "0..10000 or null"
      - name: match_score_bps
        type: integer
        source: input
        description: "biometric comparison score supplied on POST /idv/method-attempts/{id}/liveness-checks and stored on the attempt; null for other methods and not accepted by any other endpoint"
        default: null
        constraints: "0..10000 or null"
      - name: contribution_points
        type: integer
        source: computed
        description: "floor(profile.assurance_weight * evidence_quality_bps / 10000); null before scoring"
        default: null
        constraints: ">= 0 or null"
      - name: tamper_flag
        type: boolean
        source: computed
        description: "true when this attempt was rejected because its DocumentCapture was assessed FORGED"
        default: false
      - name: rejection_reason
        type: enum
        source: computed
        description: "why the attempt was rejected"
        default: null
        constraints: "one of {DOCUMENT_FORGED, DOCUMENT_SUSPECT, LIVENESS_FAILED, DATA_MISMATCH, KBA_FAILED, METHOD_RESTRICTED, EXPIRED_WINDOW} or null; DOCUMENT_SCAN maps to DOCUMENT_FORGED when the capture assessment is FORGED and to DOCUMENT_SUSPECT otherwise, BIOMETRIC_COMPARISON to LIVENESS_FAILED, DATABASE_CHECK to DATA_MISMATCH, KNOWLEDGE_BASED to KBA_FAILED, a remediated restriction to METHOD_RESTRICTED and the sweep to EXPIRED_WINDOW"
      - name: finalized_at
        type: datetime
        source: system
        description: "logical-clock instant at which state became ACCEPTED or REJECTED; null otherwise"
        default: null

  - name: DocumentCapture
    parent: null
    common_fields: false
    fields:
      - name: attempt_id
        type: string
        source: input
        description: "FK -> MethodAttempt.id; the DOCUMENT_SCAN attempt this capture belongs to"
        constraints: required
      - name: document_type
        type: enum
        source: input
        description: "presented document class"
        constraints: "one of {PASSPORT, NATIONAL_ID, DRIVERS_LICENSE, RESIDENCE_PERMIT}, required"
      - name: required_feature_count
        type: integer
        source: input
        description: "number of security features the document class must expose"
        constraints: "1..40, required"
      - name: passed_feature_count
        type: integer
        source: input
        description: "number of security features that validated successfully"
        constraints: "0..required_feature_count, required"
      - name: tamper_signal_count
        type: integer
        source: input
        description: "number of distinct tamper signals raised by the forensic engine"
        constraints: "0..20, required"
      - name: mrz_checksum_valid
        type: boolean
        source: input
        description: "machine-readable-zone checksum verification outcome"
        constraints: required
      - name: base_score_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * passed_feature_count / required_feature_count)"
        constraints: "0..10000"
      - name: tamper_tier_multiplier_bps
        type: integer
        source: computed
        description: "tamper tier multiplier keyed on base_score_bps (pre-penalty band), per calculations.document_authenticity_assessment"
        constraints: "one of {10000, 15000, 20000}"
      - name: tamper_penalty_bps
        type: integer
        source: computed
        description: "floor(TAMPER_UNIT_BPS * tamper_signal_count * tamper_tier_multiplier_bps / 10000)"
        constraints: ">= 0"
      - name: authenticity_score_bps
        type: integer
        source: computed
        description: "final authenticity score after tamper penalty and MRZ cap"
        constraints: "0..10000"
      - name: assessment
        type: enum
        source: computed
        description: "authenticity verdict"
        constraints: "one of {AUTHENTIC, SUSPECT, FORGED}"

  - name: LivenessCheck
    parent: null
    common_fields: false
    fields:
      - name: attempt_id
        type: string
        source: input
        description: "FK -> MethodAttempt.id; the BIOMETRIC_COMPARISON attempt this check belongs to"
        constraints: required
      - name: capture_modality
        type: enum
        source: input
        description: "presentation-attack-detection capture mode"
        constraints: "one of {PASSIVE, ACTIVE}, required"
      - name: pad_score_bps
        type: integer
        source: input
        description: "presentation-attack-detection liveness score"
        constraints: "0..10000, required"
      - name: retry_index
        type: integer
        source: system
        description: "copied from the owning MethodAttempt.retry_index"
        constraints: ">= 0"
      - name: effective_threshold_bps
        type: integer
        source: computed
        description: "risk-, retry- and modality-adjusted threshold per calculations.liveness_pad_decision"
        constraints: "0..9500"
      - name: decision
        type: enum
        source: computed
        description: "liveness verdict driving the attempt's evidence quality"
        constraints: "one of {PASS, INCONCLUSIVE, FAIL}"

  - name: BiometricTemplate
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> VerificationSession.id; session whose biometric evidence produced this template"
        constraints: required
      - name: source_method_code
        type: enum
        source: system
        description: "method that produced the template"
        constraints: "always BIOMETRIC_COMPARISON"
      - name: state
        type: enum
        source: system
        description: "custody state of the stored biometric template"
        default: STORED
        constraints: "one of {STORED, PURGE_SCHEDULED, DELETED}"
      - name: retention_expires_at
        type: datetime
        source: computed
        description: "instant at or after which the retention sweep must delete the template; null while state == STORED and the session is non-terminal"
        default: null
      - name: deleted_at
        type: datetime
        source: system
        description: "logical-clock instant at which state became DELETED; null otherwise"
        default: null
      - name: deletion_reason
        type: enum
        source: computed
        description: "why the template was deleted"
        default: null
        constraints: "one of {POLICY_IMMEDIATE, MINOR_PROTECTION, CONSENT_ABSENT, RETENTION_EXPIRED} or null"

  - name: AgeAssuranceResult
    parent: null
    common_fields: false
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> VerificationSession.id; session the age decision belongs to"
        constraints: required
      - name: method
        type: enum
        source: input
        description: "age assurance method used"
        constraints: "one of {ESTIMATION, VERIFICATION}, required"
      - name: estimated_age_months
        type: integer
        source: input
        description: "model-estimated age in months; required when method == ESTIMATION, forbidden otherwise"
        default: null
        constraints: "0..1200 or null"
      - name: date_of_birth
        type: string
        source: input
        description: "verified date of birth (YYYY-MM-DD); required when method == VERIFICATION, forbidden otherwise"
        default: null
      - name: source_vendor_code
        type: string
        source: system
        description: "vendor_code snapshot of the AGE_ESTIMATION MethodProfile supplied in the request; null for VERIFICATION"
        default: null
      - name: mae_months_snapshot
        type: integer
        source: system
        description: "estimation_mae_months snapshot of that profile; null for VERIFICATION"
        default: null
      - name: buffer_months
        type: integer
        source: computed
        description: "ceil(mae_months_snapshot * policy.age_buffer_multiplier_bps / 10000); 0 for VERIFICATION"
        constraints: ">= 0"
      - name: effective_age_months
        type: integer
        source: computed
        description: "estimated_age_months - buffer_months for ESTIMATION; complete months since date_of_birth for VERIFICATION"
        constraints: ">= 0"
      - name: resolved_band
        type: enum
        source: computed
        description: "age band of effective_age_months per AGE_BAND_TABLE"
        constraints: "one of {U13, B13_15, B16_17, B18_20, A21_PLUS}"
      - name: documented_accuracy_bps
        type: integer
        source: system
        description: "band_accuracy_bps[resolved_band] snapshot of the estimation profile; null for VERIFICATION"
        default: null
        constraints: "0..10000 or null"
      - name: decision
        type: enum
        source: computed
        description: "whether the age gate is satisfied"
        constraints: "one of {ASSURED, FAILED}"

  - name: AlternativePathway
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> VerificationSession.id; session requesting an inclusion pathway"
        constraints: required
      - name: pathway_type
        type: enum
        source: input
        description: "inclusion route for subjects without standard documentation"
        constraints: "one of {VOUCHING, ATTESTATION}, required"
      - name: state
        type: enum
        source: system
        description: "pathway lifecycle state; forked at creation on pathway_type"
        constraints: "one of {VOUCH_PENDING, ATTESTATION_PENDING, APPROVED, DENIED, WITHDRAWN}; VOUCH_PENDING when pathway_type == VOUCHING, ATTESTATION_PENDING when pathway_type == ATTESTATION"
      - name: voucher_reference
        type: string
        source: input
        description: "reference of the accredited voucher; required when pathway_type == VOUCHING"
        default: null
      - name: attestation_document_ref
        type: string
        source: input
        description: "reference of the self-attestation package; required when pathway_type == ATTESTATION"
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the InclusionReviewer who decided the pathway; null while pending"
        default: null
      - name: granted_points
        type: integer
        source: computed
        description: "contribution_points of the PATHWAY_GRANTED MethodAttempt created on approval; null unless APPROVED"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "logical-clock instant of the APPROVED/DENIED transition; null otherwise"
        default: null

  - name: ManualReviewCase
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> VerificationSession.id; escalated session"
        constraints: required
      - name: trigger_reason
        type: enum
        source: system
        description: "why the session was escalated"
        constraints: "one of {FRAUD_SIGNAL, SCORE_SHORTFALL, AGE_INCONCLUSIVE, RESTRICTED_METHOD}"
      - name: state
        type: enum
        source: system
        description: "review case lifecycle state"
        default: QUEUED
        constraints: "one of {QUEUED, ASSIGNED, DECIDED, WITHDRAWN}"
      - name: assigned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ReviewManager who assigned the case; null while QUEUED"
        default: null
      - name: assigned_reviewer_user_id
        type: string
        source: input
        description: "X-User-ID of the ManualReviewer expected to decide the case; null while QUEUED"
        default: null
      - name: sla_due_at
        type: datetime
        source: computed
        description: "created_at + REVIEW_SLA_HOURS on the logical clock"
      - name: decision
        type: enum
        source: input
        description: "reviewer verdict"
        default: null
        constraints: "one of {APPROVE, REJECT, RETURN_FOR_STEP_UP} or null"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ManualReviewer who decided the case; null otherwise"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "logical-clock instant of the DECIDED/WITHDRAWN transition; null otherwise"
        default: null

  - name: BiasAudit
    parent: null
    common_fields: true
    fields:
      - name: method_profile_id
        type: string
        source: input
        description: "FK -> MethodProfile.id; profile under demographic performance test"
        constraints: required
      - name: window_start
        type: datetime
        source: input
        description: "inclusive start of the measurement window"
        constraints: required
      - name: window_end
        type: datetime
        source: input
        description: "exclusive end of the measurement window; must be strictly after window_start"
        constraints: required
      - name: state
        type: enum
        source: system
        description: "audit lifecycle state; cycles through COLLECTING on remediation"
        default: COLLECTING
        constraints: "one of {COLLECTING, EVALUATED, REMEDIATION_REQUIRED, REMEDIATED}"
      - name: remediation_round
        type: integer
        source: computed
        description: "number of completed remediation rounds"
        default: 0
        constraints: ">= 0"
      - name: included_cohort_count
        type: integer
        source: computed
        description: "count of this audit's CohortMetric rows with included_in_ratio == true at evaluation"
        default: 0
        constraints: ">= 0"
      - name: excluded_cohort_count
        type: integer
        source: computed
        description: "count of this audit's CohortMetric rows with included_in_ratio == false at evaluation"
        default: 0
        constraints: ">= 0"
      - name: insufficient_sample
        type: boolean
        source: computed
        description: "true when fewer than 2 cohorts were included, in which case both disparity ratios stay null"
        default: false
      - name: max_frr_bps
        type: integer
        source: computed
        description: "highest included cohort frr_bps"
        default: null
      - name: min_frr_bps
        type: integer
        source: computed
        description: "lowest included cohort frr_bps"
        default: null
      - name: pooled_frr_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * sum(false_reject_count) / sum(attempt_count)) over included cohorts"
        default: null
      - name: disparity_ratio_max_to_min_bps
        type: integer
        source: computed
        description: "documentation-only variant of calculations.cohort_disparity_evaluation"
        default: null
      - name: disparity_ratio_max_to_pooled_bps
        type: integer
        source: computed
        description: "gating variant of calculations.cohort_disparity_evaluation"
        default: null
      - name: worst_cohort_code
        type: enum
        source: computed
        description: "included cohort with the highest frr_bps; ties broken by cohort_code ascending"
        default: null
      - name: evaluated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who ran the most recent evaluation; null while COLLECTING with remediation_round == 0"
        default: null
      - name: remediated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who recorded the most recent remediation; null otherwise"
        default: null
      - name: remediated_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent REMEDIATION_REQUIRED -> COLLECTING transition; scopes the cohort input set of the next evaluation"
        default: null

  - name: CohortMetric
    parent: null
    common_fields: false
    fields:
      - name: bias_audit_id
        type: string
        source: input
        description: "FK -> BiasAudit.id; audit this cohort row belongs to"
        constraints: required
      - name: cohort_code
        type: enum
        source: input
        description: "demographic cohort label; unique per bias_audit_id"
        constraints: "one of {AGE_13_17, AGE_18_24, AGE_25_44, AGE_45_64, AGE_65_PLUS, SKIN_TONE_I_III, SKIN_TONE_IV_VI}, required"
      - name: attempt_count
        type: integer
        source: input
        description: "attempts observed for this cohort inside the audit window"
        constraints: ">= 0, required"
      - name: false_reject_count
        type: integer
        source: input
        description: "false rejects observed for this cohort"
        constraints: "0..attempt_count, required"
      - name: false_accept_count
        type: integer
        source: input
        description: "false accepts observed for this cohort"
        constraints: "0..attempt_count, required"
      - name: frr_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * false_reject_count / attempt_count); 0 when attempt_count == 0"
        constraints: "0..10000"
      - name: far_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * false_accept_count / attempt_count); 0 when attempt_count == 0"
        constraints: "0..10000"
      - name: included_in_ratio
        type: boolean
        source: computed
        description: "attempt_count >= MIN_COHORT_SAMPLE"

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> VerificationSession.id; session the event describes"
        constraints: required
      - name: event_type
        type: enum
        source: system
        description: "append-only audit event kind"
        constraints: "one of {SESSION_CREATED, ATTEMPT_FINALIZED, STEP_UP_TRIGGERED, ESCALATED_TO_REVIEW, REVIEW_DECIDED, PATHWAY_DECIDED, METHOD_RESTRICTION_APPLIED, TEMPLATE_DELETED, SESSION_TERMINAL}"
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role of the caller that caused the event, or 'system' for sweep-driven events"
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID of the caller that caused the event; null for sweep-driven events"
        default: null
      - name: payload_summary
        type: string
        source: system
        description: "human-readable summary naming the mutated fields"
      - name: occurred_at
        type: datetime
        source: system
        description: "logical-clock instant of the event"

state_machines:
  - entity: VerificationSession
    field: identity_state
    states: [IN_PROGRESS, AWAITING_EVIDENCE, MANUAL_REVIEW, VERIFIED, REJECTED, EXPIRED]
    initial_state: IN_PROGRESS
    terminal_states: [VERIFIED, REJECTED, EXPIRED]
    notes: "Identity axis. Runs independently of age_state (parallel shape) and contains two cycles: AWAITING_EVIDENCE -> IN_PROGRESS via step-up, and MANUAL_REVIEW -> AWAITING_EVIDENCE via a RETURN_FOR_STEP_UP review decision."
    transitions:
      - from: IN_PROGRESS
        to: AWAITING_EVIDENCE
        trigger: "POST /idv/method-attempts/{id}/finalize resulting in state REJECTED with tamper_flag == false, while step_up_round < policy.step_up_max_rounds"
        preconditions:
          - "session identity_state == IN_PROGRESS"
          - "clock <= session.expires_at"
        side_effects:
          - "recompute assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
          - "Client.pending_stepup_count += 1"
          - "append AuditEvent with event_type == ATTEMPT_FINALIZED"
      - from: IN_PROGRESS
        to: AWAITING_EVIDENCE
        trigger: "POST /idv/bias-audits/{id}/evaluate whose gating ratio reaches DISPARITY_RESTRICT_BPS for a MethodProfile used by a non-terminal attempt of this session"
        preconditions:
          - "session identity_state == IN_PROGRESS"
        side_effects:
          - "each MethodAttempt of the session on that profile in state {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE} -> REQUIRES_RESCORE"
          - "recompute assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
          - "Client.pending_stepup_count += 1"
          - "pinned VerificationPolicy.degraded_flag = true"
          - "append AuditEvent with event_type == METHOD_RESTRICTION_APPLIED"
      - from: AWAITING_EVIDENCE
        to: IN_PROGRESS
        trigger: "POST /idv/verification-sessions/{id}/step-up"
        preconditions:
          - "session identity_state == AWAITING_EVIDENCE"
          - "clock <= session.expires_at"
          - "session.step_up_round < policy.step_up_max_rounds, else ERR_STEP_UP_LIMIT_REACHED"
        side_effects:
          - "step_up_round += 1"
          - "Client.pending_stepup_count -= 1"
          - "append AuditEvent with event_type == STEP_UP_TRIGGERED"
      - from: IN_PROGRESS
        to: MANUAL_REVIEW
        trigger: "POST /idv/method-attempts/{id}/finalize resulting in state REJECTED with tamper_flag == true"
        preconditions:
          - "session identity_state == IN_PROGRESS"
        side_effects:
          - "fraud_signal_count += 1"
          - "create ManualReviewCase in state QUEUED with trigger_reason == FRAUD_SIGNAL and sla_due_at per calculations.review_sla_schedule"
          - "recompute assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
          - "append AuditEvent with event_type == ESCALATED_TO_REVIEW"
      - from: IN_PROGRESS
        to: MANUAL_REVIEW
        trigger: "POST /idv/verification-sessions/{id}/complete when age_state != FAILED and assurance_score_final < policy.min_assurance_score"
        preconditions:
          - "session identity_state == IN_PROGRESS"
          - "clock <= session.expires_at"
          - "no MethodAttempt of the session in state {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE}, else ERR_ATTEMPT_PENDING_FINALIZATION"
          - "no AlternativePathway of the session in state {VOUCH_PENDING, ATTESTATION_PENDING}, else ERR_PENDING_PATHWAY_BLOCKS_COMPLETION"
          - "policy.required_min_age_years == 0 or age_state != PENDING, else ERR_AGE_ASSURANCE_MISSING"
        side_effects:
          - "write assurance_score_final per calculations.assurance_score variant FINAL"
          - "create ManualReviewCase in state QUEUED with trigger_reason == SCORE_SHORTFALL and sla_due_at per calculations.review_sla_schedule"
          - "append AuditEvent with event_type == ESCALATED_TO_REVIEW"
      - from: IN_PROGRESS
        to: VERIFIED
        trigger: "POST /idv/verification-sessions/{id}/complete when age_state != FAILED and assurance_score_final >= policy.min_assurance_score"
        preconditions:
          - "session identity_state == IN_PROGRESS"
          - "clock <= session.expires_at"
          - "no MethodAttempt of the session in state {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE}, else ERR_ATTEMPT_PENDING_FINALIZATION"
          - "no AlternativePathway of the session in state {VOUCH_PENDING, ATTESTATION_PENDING}, else ERR_PENDING_PATHWAY_BLOCKS_COMPLETION"
          - "policy.required_min_age_years == 0 or age_state != PENDING, else ERR_AGE_ASSURANCE_MISSING"
        side_effects:
          - "write assurance_score_final per calculations.assurance_score variant FINAL"
          - "disposition_reason = SCORE_SATISFIED, completed_at = clock"
          - "apply calculations.retention_schedule to every BiometricTemplate of the session in state STORED"
          - "append AuditEvent with event_type == SESSION_TERMINAL"
      - from: IN_PROGRESS
        to: REJECTED
        trigger: "POST /idv/verification-sessions/{id}/complete when age_state == FAILED"
        preconditions:
          - "session identity_state == IN_PROGRESS"
          - "clock <= session.expires_at"
          - "no MethodAttempt of the session in state {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE}, else ERR_ATTEMPT_PENDING_FINALIZATION"
          - "no AlternativePathway of the session in state {VOUCH_PENDING, ATTESTATION_PENDING}, else ERR_PENDING_PATHWAY_BLOCKS_COMPLETION"
        side_effects:
          - "write assurance_score_final per calculations.assurance_score variant FINAL"
          - "disposition_reason = AGE_GATE_FAILED, completed_at = clock"
          - "apply calculations.retention_schedule to every BiometricTemplate of the session in state STORED"
          - "append AuditEvent with event_type == SESSION_TERMINAL"
      - from: MANUAL_REVIEW
        to: VERIFIED
        trigger: "POST /idv/manual-review-cases/{id}/decision with decision == APPROVE"
        preconditions:
          - "ManualReviewCase state == ASSIGNED"
          - "session identity_state == MANUAL_REVIEW"
        side_effects:
          - "manual_override_flag = true, disposition_reason = MANUAL_OVERRIDE, completed_at = clock"
          - "write assurance_score_final per calculations.assurance_score variant FINAL"
          - "apply calculations.retention_schedule to every BiometricTemplate of the session in state STORED"
          - "release one credit per calculations.review_credit_pool and Client.consumed_review_count += 1"
          - "append AuditEvent with event_type == REVIEW_DECIDED"
      - from: MANUAL_REVIEW
        to: REJECTED
        trigger: "POST /idv/manual-review-cases/{id}/decision with decision == REJECT"
        preconditions:
          - "ManualReviewCase state == ASSIGNED"
          - "session identity_state == MANUAL_REVIEW"
        side_effects:
          - "manual_override_flag = true, disposition_reason = REVIEW_REJECTED, completed_at = clock"
          - "write assurance_score_final per calculations.assurance_score variant FINAL"
          - "apply calculations.retention_schedule to every BiometricTemplate of the session in state STORED"
          - "release one credit per calculations.review_credit_pool and Client.consumed_review_count += 1"
          - "append AuditEvent with event_type == REVIEW_DECIDED"
      - from: MANUAL_REVIEW
        to: AWAITING_EVIDENCE
        trigger: "POST /idv/manual-review-cases/{id}/decision with decision == RETURN_FOR_STEP_UP"
        preconditions:
          - "ManualReviewCase state == ASSIGNED"
          - "session identity_state == MANUAL_REVIEW"
          - "clock <= session.expires_at"
        side_effects:
          - "Client.pending_stepup_count += 1"
          - "release one credit per calculations.review_credit_pool and Client.consumed_review_count += 1"
          - "append AuditEvent with event_type == REVIEW_DECIDED"
      - from: MANUAL_REVIEW
        to: REJECTED
        trigger: "POST /idv/retention-sweeps when clock >= ManualReviewCase.sla_due_at and that case is in state {QUEUED, ASSIGNED}"
        preconditions:
          - "session identity_state == MANUAL_REVIEW"
        side_effects:
          - "ManualReviewCase -> WITHDRAWN"
          - "disposition_reason = REVIEW_LAPSED, completed_at = clock"
          - "write assurance_score_final per calculations.assurance_score variant FINAL"
          - "apply calculations.retention_schedule to every BiometricTemplate of the session in state STORED"
          - "release one credit per calculations.review_credit_pool when the withdrawn case was ASSIGNED"
          - "append AuditEvent with event_type == SESSION_TERMINAL"
      - from: IN_PROGRESS
        to: EXPIRED
        trigger: "POST /idv/retention-sweeps when clock > session.expires_at"
        preconditions:
          - "session identity_state in {IN_PROGRESS, AWAITING_EVIDENCE}"
        side_effects:
          - "every MethodAttempt of the session in state {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE} -> EXPIRED with rejection_reason == EXPIRED_WINDOW"
          - "every AlternativePathway of the session in state {VOUCH_PENDING, ATTESTATION_PENDING} -> WITHDRAWN"
          - "disposition_reason = EXPIRED_TTL, completed_at = clock"
          - "apply calculations.retention_schedule to every BiometricTemplate of the session in state STORED"
          - "Client.pending_stepup_count -= 1 when the session was AWAITING_EVIDENCE"
          - "append AuditEvent with event_type == SESSION_TERMINAL"
      - from: AWAITING_EVIDENCE
        to: EXPIRED
        trigger: "POST /idv/retention-sweeps when clock > session.expires_at"
        preconditions:
          - "session identity_state == AWAITING_EVIDENCE"
        side_effects:
          - "same side effects as the IN_PROGRESS -> EXPIRED transition, including Client.pending_stepup_count -= 1"

  - entity: VerificationSession
    field: age_state
    states: [NOT_REQUIRED, PENDING, ASSURED, FAILED]
    initial_state: PENDING
    terminal_states: [NOT_REQUIRED, ASSURED]
    notes: "Age axis, independent of identity_state. Initialised to NOT_REQUIRED when the pinned policy has required_min_age_years == 0, otherwise PENDING. FAILED is re-enterable: a further AgeAssuranceResult may move FAILED -> ASSURED."
    transitions:
      - from: PENDING
        to: ASSURED
        trigger: "POST /idv/verification-sessions/{id}/age-assurance-results whose decision is ASSURED"
        preconditions:
          - "age_state in {PENDING, FAILED}"
          - "clock <= session.expires_at"
          - "policy.required_min_age_years > 0"
        side_effects:
          - "create AgeAssuranceResult per calculations.age_assurance_decision"
          - "resolved_age_band = AgeAssuranceResult.resolved_band"
      - from: PENDING
        to: FAILED
        trigger: "POST /idv/verification-sessions/{id}/age-assurance-results whose decision is FAILED"
        preconditions:
          - "age_state in {PENDING, FAILED}"
          - "clock <= session.expires_at"
          - "policy.required_min_age_years > 0"
        side_effects:
          - "create AgeAssuranceResult per calculations.age_assurance_decision"
          - "resolved_age_band = AgeAssuranceResult.resolved_band"
      - from: FAILED
        to: ASSURED
        trigger: "POST /idv/verification-sessions/{id}/age-assurance-results whose decision is ASSURED"
        preconditions:
          - "age_state == FAILED"
          - "clock <= session.expires_at"
        side_effects:
          - "create AgeAssuranceResult per calculations.age_assurance_decision"
          - "resolved_age_band = AgeAssuranceResult.resolved_band"

  - entity: MethodAttempt
    field: state
    states: [AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE, ACCEPTED, REJECTED, EXPIRED]
    initial_state: AWAITING_EVIDENCE
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: AWAITING_EVIDENCE
        to: SCORED
        trigger: "POST /idv/method-attempts/{id}/document-captures, .../liveness-checks or .../data-evidence matching the attempt's method_code"
        preconditions:
          - "attempt state == AWAITING_EVIDENCE"
          - "session identity_state == IN_PROGRESS"
          - "clock <= session.expires_at"
          - "no evidence row already exists for this attempt, else ERR_EVIDENCE_ALREADY_SUBMITTED"
        side_effects:
          - "write evidence_quality_bps and contribution_points per calculations.method_evidence_quality"
          - "for BIOMETRIC_COMPARISON with LivenessCheck.decision != FAIL, create BiometricTemplate in state STORED and Client.stored_template_count += 1"
          - "recompute VerificationSession.assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
      - from: SCORED
        to: ACCEPTED
        trigger: "POST /idv/method-attempts/{id}/finalize when evidence_quality_bps >= profile.acceptance_floor_bps"
        preconditions:
          - "attempt state == SCORED"
          - "session identity_state == IN_PROGRESS"
          - "clock <= session.expires_at"
        side_effects:
          - "finalized_at = clock"
          - "recompute VerificationSession.assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
          - "append AuditEvent with event_type == ATTEMPT_FINALIZED"
      - from: SCORED
        to: REJECTED
        trigger: "POST /idv/method-attempts/{id}/finalize when evidence_quality_bps < profile.acceptance_floor_bps"
        preconditions:
          - "attempt state == SCORED"
          - "session identity_state == IN_PROGRESS"
          - "clock <= session.expires_at"
        side_effects:
          - "rejection_reason set from the attempt's method_code and evidence row"
          - "tamper_flag = true when the attempt's DocumentCapture.assessment == FORGED, and rejection_reason = DOCUMENT_FORGED"
          - "finalized_at = clock"
          - "recompute VerificationSession.assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
          - "drive the session identity_state transition to MANUAL_REVIEW when tamper_flag is true, else to AWAITING_EVIDENCE when step-up budget remains"
          - "append AuditEvent with event_type == ATTEMPT_FINALIZED"
      - from: AWAITING_EVIDENCE
        to: REQUIRES_RESCORE
        trigger: "POST /idv/bias-audits/{id}/evaluate whose gating ratio reaches DISPARITY_RESTRICT_BPS for this attempt's MethodProfile"
        preconditions:
          - "attempt state in {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE}"
        side_effects:
          - "contribution_points = null"
          - "recompute VerificationSession.assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
      - from: SCORED
        to: REQUIRES_RESCORE
        trigger: "POST /idv/bias-audits/{id}/evaluate whose gating ratio reaches DISPARITY_RESTRICT_BPS for this attempt's MethodProfile"
        preconditions:
          - "attempt state in {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE}"
        side_effects:
          - "contribution_points = null"
          - "recompute VerificationSession.assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
      - from: REQUIRES_RESCORE
        to: REJECTED
        trigger: "POST /idv/bias-audits/{id}/remediation"
        preconditions:
          - "attempt state == REQUIRES_RESCORE"
          - "attempt's MethodProfile is the audited profile"
        side_effects:
          - "rejection_reason = METHOD_RESTRICTED, contribution_points = 0, finalized_at = clock"
          - "recompute VerificationSession.assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
      - from: AWAITING_EVIDENCE
        to: ACCEPTED
        trigger: "POST /idv/alternative-pathways/{id}/decision with action == APPROVE (the PATHWAY_GRANTED attempt is created and accepted inside the same request)"
        preconditions:
          - "AlternativePathway state in {VOUCH_PENDING, ATTESTATION_PENDING}"
        side_effects:
          - "evidence_quality_bps and contribution_points written per calculations.method_evidence_quality for VOUCHING_ATTESTATION"
          - "finalized_at = clock"
          - "recompute VerificationSession.assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
      - from: AWAITING_EVIDENCE
        to: EXPIRED
        trigger: "POST /idv/retention-sweeps when the owning session passes expires_at"
        preconditions:
          - "attempt state in {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE}"
        side_effects:
          - "rejection_reason = EXPIRED_WINDOW, finalized_at = clock"
      - from: SCORED
        to: EXPIRED
        trigger: "POST /idv/retention-sweeps when the owning session passes expires_at"
        preconditions:
          - "attempt state in {AWAITING_EVIDENCE, SCORED, REQUIRES_RESCORE}"
        side_effects:
          - "rejection_reason = EXPIRED_WINDOW, finalized_at = clock"

  - entity: AlternativePathway
    field: state
    states: [VOUCH_PENDING, ATTESTATION_PENDING, APPROVED, DENIED, WITHDRAWN]
    initial_state: VOUCH_PENDING
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    notes: "Branching (fork-join) shape: creation forks on pathway_type into VOUCH_PENDING or ATTESTATION_PENDING; the two branches join at APPROVED but carry different side effects (VOUCHING grants 9000 bps evidence and leaves assurance_ceiling at 100; ATTESTATION grants 7000 bps evidence and lowers assurance_ceiling to ATTESTATION_CEILING)."
    transitions:
      - from: VOUCH_PENDING
        to: APPROVED
        trigger: "POST /idv/alternative-pathways/{id}/decision with action == APPROVE"
        preconditions:
          - "pathway state == VOUCH_PENDING"
          - "session identity_state in {IN_PROGRESS, AWAITING_EVIDENCE}"
          - "clock <= session.expires_at"
          - "a MethodProfile with method_code == VOUCHING_ATTESTATION and bias_state != RESTRICTED exists, else ERR_NO_ELIGIBLE_METHOD"
        side_effects:
          - "reviewer_user_id = X-User-ID, decided_at = clock"
          - "create MethodAttempt with selection_mode == PATHWAY_GRANTED that is ACCEPTED in the same request; granted_points = that attempt's contribution_points"
          - "recompute VerificationSession.assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
          - "append AuditEvent with event_type == PATHWAY_DECIDED"
      - from: ATTESTATION_PENDING
        to: APPROVED
        trigger: "POST /idv/alternative-pathways/{id}/decision with action == APPROVE"
        preconditions:
          - "pathway state == ATTESTATION_PENDING"
          - "session identity_state in {IN_PROGRESS, AWAITING_EVIDENCE}"
          - "clock <= session.expires_at"
          - "a MethodProfile with method_code == VOUCHING_ATTESTATION and bias_state != RESTRICTED exists, else ERR_NO_ELIGIBLE_METHOD"
        side_effects:
          - "reviewer_user_id = X-User-ID, decided_at = clock"
          - "create MethodAttempt with selection_mode == PATHWAY_GRANTED that is ACCEPTED in the same request; granted_points = that attempt's contribution_points"
          - "VerificationSession.assurance_ceiling = ATTESTATION_CEILING"
          - "recompute VerificationSession.assurance_score_provisional per calculations.assurance_score variant PROVISIONAL"
          - "append AuditEvent with event_type == PATHWAY_DECIDED"
      - from: VOUCH_PENDING
        to: DENIED
        trigger: "POST /idv/alternative-pathways/{id}/decision with action == DENY"
        preconditions:
          - "pathway state in {VOUCH_PENDING, ATTESTATION_PENDING}"
        side_effects:
          - "reviewer_user_id = X-User-ID, decided_at = clock, granted_points stays null"
          - "no MethodAttempt is created and neither assurance_score_provisional nor assurance_ceiling changes"
          - "append AuditEvent with event_type == PATHWAY_DECIDED"
      - from: ATTESTATION_PENDING
        to: DENIED
        trigger: "POST /idv/alternative-pathways/{id}/decision with action == DENY"
        preconditions:
          - "pathway state in {VOUCH_PENDING, ATTESTATION_PENDING}"
        side_effects:
          - "reviewer_user_id = X-User-ID, decided_at = clock, granted_points stays null"
          - "no MethodAttempt is created and neither assurance_score_provisional nor assurance_ceiling changes"
          - "append AuditEvent with event_type == PATHWAY_DECIDED"
      - from: VOUCH_PENDING
        to: WITHDRAWN
        trigger: "POST /idv/retention-sweeps when the owning session passes expires_at"
        preconditions:
          - "pathway state in {VOUCH_PENDING, ATTESTATION_PENDING}"
        side_effects:
          - "decided_at = clock, reviewer_user_id stays null"

  - entity: ManualReviewCase
    field: state
    states: [QUEUED, ASSIGNED, DECIDED, WITHDRAWN]
    initial_state: QUEUED
    terminal_states: [DECIDED, WITHDRAWN]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /idv/manual-review-cases/{id}/assign"
        preconditions:
          - "case state == QUEUED"
          - "Client.available_review_credits >= 1, else ERR_REVIEW_CAPACITY_EXHAUSTED"
        side_effects:
          - "assigned_by_user_id = X-User-ID, assigned_reviewer_user_id from the body"
          - "reserve one credit per calculations.review_credit_pool"
      - from: ASSIGNED
        to: DECIDED
        trigger: "POST /idv/manual-review-cases/{id}/decision"
        preconditions:
          - "case state == ASSIGNED"
          - "X-User-ID == assigned_reviewer_user_id, else ERR_REVIEW_ASSIGNEE_MISMATCH"
          - "X-User-ID != assigned_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "decision, decided_by_user_id and decided_at written"
          - "release one credit per calculations.review_credit_pool and Client.consumed_review_count += 1"
          - "drive the session identity_state transition selected by decision"
      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /idv/retention-sweeps when clock >= sla_due_at"
        preconditions:
          - "case state in {QUEUED, ASSIGNED}"
        side_effects:
          - "decided_at = clock"
          - "drive the session MANUAL_REVIEW -> REJECTED transition with disposition_reason == REVIEW_LAPSED"
      - from: ASSIGNED
        to: WITHDRAWN
        trigger: "POST /idv/retention-sweeps when clock >= sla_due_at"
        preconditions:
          - "case state in {QUEUED, ASSIGNED}"
        side_effects:
          - "decided_at = clock"
          - "release one credit per calculations.review_credit_pool"
          - "drive the session MANUAL_REVIEW -> REJECTED transition with disposition_reason == REVIEW_LAPSED"

  - entity: BiasAudit
    field: state
    states: [COLLECTING, EVALUATED, REMEDIATION_REQUIRED, REMEDIATED]
    initial_state: COLLECTING
    terminal_states: [REMEDIATED]
    notes: "Cyclic shape: COLLECTING -> REMEDIATION_REQUIRED -> COLLECTING -> REMEDIATED. Each remediation round raises remediation_round and resets the cohort input set consulted by calculations.cohort_disparity_evaluation to rows created at or after remediated_at."
    transitions:
      - from: COLLECTING
        to: EVALUATED
        trigger: "POST /idv/bias-audits/{id}/evaluate when the gating ratio is below DISPARITY_RESTRICT_BPS"
        preconditions:
          - "audit state == COLLECTING"
          - "count of in-scope CohortMetric rows >= MIN_COHORT_COUNT, else ERR_INSUFFICIENT_COHORT_COVERAGE"
          - "audited MethodProfile.bias_state != RESTRICTED, else ERR_METHOD_RESTRICTED_BY_BIAS"
        side_effects:
          - "write all disparity fields per calculations.cohort_disparity_evaluation, both variants"
          - "MethodProfile.bias_state = MONITORED when the gating ratio >= DISPARITY_MONITOR_BPS, else CLEARED"
          - "evaluated_by_user_id = X-User-ID"
      - from: COLLECTING
        to: REMEDIATION_REQUIRED
        trigger: "POST /idv/bias-audits/{id}/evaluate when the gating ratio >= DISPARITY_RESTRICT_BPS"
        preconditions:
          - "audit state == COLLECTING"
          - "count of in-scope CohortMetric rows >= MIN_COHORT_COUNT, else ERR_INSUFFICIENT_COHORT_COVERAGE"
          - "audited MethodProfile.bias_state != RESTRICTED, else ERR_METHOD_RESTRICTED_BY_BIAS"
        side_effects:
          - "write all disparity fields per calculations.cohort_disparity_evaluation, both variants"
          - "MethodProfile.bias_state = RESTRICTED and restricted_at = clock"
          - "cascade every affected MethodAttempt to REQUIRES_RESCORE and every affected non-terminal VerificationSession to AWAITING_EVIDENCE"
          - "evaluated_by_user_id = X-User-ID"
      - from: COLLECTING
        to: REMEDIATED
        trigger: "POST /idv/bias-audits/{id}/evaluate when remediation_round >= 1 and the gating ratio is below DISPARITY_MONITOR_BPS"
        preconditions:
          - "audit state == COLLECTING and remediation_round >= 1"
          - "count of in-scope CohortMetric rows >= MIN_COHORT_COUNT, else ERR_INSUFFICIENT_COHORT_COVERAGE"
        side_effects:
          - "write all disparity fields per calculations.cohort_disparity_evaluation, both variants"
          - "MethodProfile.bias_state = CLEARED and restricted_at = null"
          - "evaluated_by_user_id = X-User-ID"
      - from: REMEDIATION_REQUIRED
        to: COLLECTING
        trigger: "POST /idv/bias-audits/{id}/remediation"
        preconditions:
          - "audit state == REMEDIATION_REQUIRED"
          - "expected_method_profile_version matches the audited MethodProfile.version, else ERR_STALE_METHOD_PROFILE_VERSION"
          - "X-User-ID != evaluated_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "remediation_round += 1, remediated_at = clock, remediated_by_user_id = X-User-ID"
          - "MethodProfile.bias_state = MONITORED, restricted_at = null; increments MethodProfile.version by 1"
          - "every MethodAttempt in state REQUIRES_RESCORE on that profile -> REJECTED with rejection_reason == METHOD_RESTRICTED"
          - "clear VerificationPolicy.degraded_flag on policies that no longer admit a RESTRICTED profile"

  - entity: BiometricTemplate
    field: state
    states: [STORED, PURGE_SCHEDULED, DELETED]
    initial_state: STORED
    terminal_states: [DELETED]
    transitions:
      - from: STORED
        to: DELETED
        trigger: "any transition that makes the owning session identity_state terminal, when calculations.retention_schedule resolves to immediate deletion"
        preconditions:
          - "template state == STORED"
        side_effects:
          - "deleted_at = clock, deletion_reason from calculations.retention_schedule"
          - "Client.stored_template_count -= 1"
          - "append AuditEvent with event_type == TEMPLATE_DELETED"
      - from: STORED
        to: PURGE_SCHEDULED
        trigger: "any transition that makes the owning session identity_state terminal, when calculations.retention_schedule resolves to deferred purge"
        preconditions:
          - "template state == STORED"
        side_effects:
          - "retention_expires_at = session.completed_at + RETENTION_DAYS"
          - "Client.stored_template_count -= 1"
      - from: PURGE_SCHEDULED
        to: DELETED
        trigger: "POST /idv/retention-sweeps when clock >= retention_expires_at"
        preconditions:
          - "template state == PURGE_SCHEDULED"
        side_effects:
          - "deleted_at = clock, deletion_reason = RETENTION_EXPIRED"
          - "append AuditEvent with event_type == TEMPLATE_DELETED"

  - entity: MethodProfile
    field: bias_state
    states: [CLEARED, MONITORED, RESTRICTED]
    initial_state: CLEARED
    terminal_states: []
    notes: "Cyclic: CLEARED -> MONITORED -> RESTRICTED -> MONITORED -> CLEARED. Written only by bias-audit evaluate and remediation transitions; never by a direct profile write."
    transitions:
      - from: CLEARED
        to: MONITORED
        trigger: "POST /idv/bias-audits/{id}/evaluate with gating ratio in [DISPARITY_MONITOR_BPS, DISPARITY_RESTRICT_BPS)"
        preconditions: ["audit state == COLLECTING"]
        side_effects: ["BiasAudit -> EVALUATED"]
      - from: CLEARED
        to: RESTRICTED
        trigger: "POST /idv/bias-audits/{id}/evaluate with gating ratio >= DISPARITY_RESTRICT_BPS"
        preconditions: ["audit state == COLLECTING"]
        side_effects: ["restricted_at = clock", "BiasAudit -> REMEDIATION_REQUIRED", "cascade to attempts, sessions and pinned policies"]
      - from: RESTRICTED
        to: MONITORED
        trigger: "POST /idv/bias-audits/{id}/remediation"
        preconditions: ["audit state == REMEDIATION_REQUIRED", "expected_method_profile_version matches MethodProfile.version"]
        side_effects: ["restricted_at = null", "increments MethodProfile.version by 1"]
      - from: MONITORED
        to: CLEARED
        trigger: "POST /idv/bias-audits/{id}/evaluate on a post-remediation cohort set with gating ratio below DISPARITY_MONITOR_BPS"
        preconditions: ["audit state == COLLECTING"]
        side_effects: ["BiasAudit -> REMEDIATED when remediation_round >= 1, else EVALUATED"]

  - entity: VerificationPolicy
    field: state
    states: [DRAFT, PUBLISHED, RETIRED]
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /idv/verification-policies/{id}/publish"
        preconditions:
          - "policy state == DRAFT"
          - "Client.integration_state != SUSPENDED, else ERR_CLIENT_NOT_LIVE"
          - "expected_client_version matches Client.version, else ERR_STALE_CLIENT_VERSION"
        side_effects:
          - "published_at = clock"
          - "the client's previously PUBLISHED policy -> RETIRED with retired_at = clock"
          - "increments Client.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /idv/verification-policies/{id}/publish on a newer DRAFT policy of the same client"
        preconditions:
          - "policy state == PUBLISHED"
        side_effects:
          - "retired_at = clock"
          - "sessions already pinned to this policy keep their pinned policy_id and their attempts observe ERR_PINNED_POLICY_RETIRED"

concurrency_rules:
  - rule_id: policy-publication-supersede
    parent_entity: Client
    occ_field: "expected_client_version"
    write_endpoint: "POST /idv/verification-policies/{id}/publish"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    description: |
      Publishing a DRAFT policy legitimately supersedes the client's current PUBLISHED policy and
      repoints every future session's pinned policy, so a second sequential publish of a different
      DRAFT would itself succeed under the natural product semantics. The caller must therefore
      present the Client.version it based the decision on; on success Client.version increments by
      1, so an operator working from an earlier read of the client is rejected with a stale-version
      error instead of silently replacing a policy it never saw.
  - rule_id: bias-remediation-record
    parent_entity: MethodProfile
    occ_field: "expected_method_profile_version"
    write_endpoint: "POST /idv/bias-audits/{id}/remediation"
    error_id: ERR_STALE_METHOD_PROFILE_VERSION
    http_status: 412
    description: |
      Recording remediation legitimately lifts a RESTRICTED profile back to MONITORED and rejects
      every REQUIRES_RESCORE attempt on it, and a second sequential remediation from another audit
      on the same profile would itself succeed under the natural product semantics. The caller must
      present the MethodProfile.version observed when the remediation evidence was gathered; on
      success MethodProfile.version increments by 1, so a caller working from an earlier read is
      rejected with a stale-version error.
calculations:
  - name: session_expiry_schedule
    trigger: "POST /idv/verification-sessions"
    algorithm_type: chronological
    inputs:
      - "logical clock value at creation (VerificationSession.created_at)"
    constants:
      SESSION_TTL_MINUTES: 60
    formula: |
      expires_at = created_at + SESSION_TTL_MINUTES minutes.
      A session is treated as lapsed by every mutating endpoint when clock > expires_at, even
      before POST /idv/retention-sweeps materialises identity_state == EXPIRED.
    rounding: "no rounding; whole-minute arithmetic on the logical clock"
    edge_cases:
      - "clock exactly equal to expires_at is still inside the window (comparison is clock > expires_at)"

  - name: review_sla_schedule
    trigger: "creation of a ManualReviewCase by any escalating transition"
    algorithm_type: chronological
    inputs:
      - "logical clock value at ManualReviewCase creation"
    constants:
      REVIEW_SLA_HOURS: 48
    formula: |
      sla_due_at = created_at + REVIEW_SLA_HOURS hours.
      POST /idv/retention-sweeps withdraws every ManualReviewCase in state {QUEUED, ASSIGNED}
      whose sla_due_at is at or before the clock (clock >= sla_due_at).
    rounding: "no rounding"
    edge_cases:
      - "clock exactly equal to sla_due_at withdraws the case (inclusive comparison)"

  - name: session_risk_assessment
    trigger: "POST /idv/verification-sessions"
    algorithm_type: threshold
    inputs:
      - "VerificationSession.requested_assurance_tier"
      - "VerificationSession.declared_transaction_value_cents"
      - "VerificationSession.subject_jurisdiction_code compared with Client.home_jurisdiction_code"
      - "VerificationSession.documentation_status"
      - "count of the same client's earlier sessions with the same external_subject_ref and identity_state == REJECTED"
    constants:
      TIER_BASE: { BASIC: 10, STANDARD: 30, ENHANCED: 60 }
      VALUE_BUMP_LOW_MAX_CENTS: 24999
      VALUE_BUMP_MID_MAX_CENTS: 999999
      VALUE_BUMP_MID: 10
      VALUE_BUMP_HIGH: 20
      JURISDICTION_MISMATCH_BUMP: 20
      NO_STANDARD_DOCS_BUMP: 10
      PRIOR_REJECT_BUMP: 15
      PRIOR_REJECT_BUMP_CAP: 30
      RISK_HIGH_MIN: 70
      RISK_MEDIUM_MIN: 40
    formula: |
      value_bump = 0 when declared_transaction_value_cents <= VALUE_BUMP_LOW_MAX_CENTS
                 = VALUE_BUMP_MID when VALUE_BUMP_LOW_MAX_CENTS < value <= VALUE_BUMP_MID_MAX_CENTS
                 = VALUE_BUMP_HIGH when value > VALUE_BUMP_MID_MAX_CENTS
      mismatch_bump = JURISDICTION_MISMATCH_BUMP when subject_jurisdiction_code != Client.home_jurisdiction_code else 0
      docs_bump = NO_STANDARD_DOCS_BUMP when documentation_status == NO_STANDARD_DOCS else 0
      history_bump = min(PRIOR_REJECT_BUMP_CAP, PRIOR_REJECT_BUMP * prior_rejected_session_count)
      risk_score = TIER_BASE[requested_assurance_tier] + value_bump + mismatch_bump + docs_bump + history_bump
      risk_level = HIGH   when risk_score >= RISK_HIGH_MIN
                 = MEDIUM when RISK_MEDIUM_MIN <= risk_score < RISK_HIGH_MIN
                 = LOW    otherwise
      Both fields are frozen at creation and are never recomputed.
    rounding: "integer arithmetic only"
    edge_cases:
      - "STANDARD with declared_transaction_value_cents == 25000 scores exactly 40 and lands on the MEDIUM boundary"
      - "prior rejected sessions are counted per (client_id, external_subject_ref) and the bump saturates at 30"

  - name: policy_pinning_selector
    trigger: "POST /idv/verification-sessions"
    algorithm_type: chronological
    inputs:
      - "VerificationPolicy rows with client_id == the requested client and state == PUBLISHED"
    constants: {}
    formula: |
      candidates = every VerificationPolicy of the client whose state == PUBLISHED.
      Rank candidates by policy_version DESC, then created_at ASC.
      The winner's id is written to VerificationSession.policy_id and stays pinned for the whole
      session lifetime, even after that policy is later RETIRED.
      Empty candidate set -> ERR_NO_PUBLISHED_POLICY.
      Entity id is never used as a ranking or tie-break key.
    rounding: "not applicable"
    edge_cases:
      - "a session pinned to a policy that is subsequently RETIRED keeps policy_id but can no longer add attempts (ERR_PINNED_POLICY_RETIRED)"

  - name: method_candidate_selection
    trigger: "POST /idv/verification-sessions/{id}/method-attempts and POST /idv/alternative-pathways/{id}/decision with action == APPROVE"
    algorithm_type: topological
    inputs:
      - "MethodProfile rows"
      - "pinned VerificationPolicy.allowed_method_codes"
      - "VerificationSession.risk_level"
      - "existing MethodAttempt rows of the session"
    constants: {}
    variants:
      - name: LADDER
        applies_when: "POST /idv/verification-sessions/{id}/method-attempts with no method_profile_id in the body"
        formula: |
          candidates = MethodProfile rows where
            method_code is in policy.allowed_method_codes
            AND bias_state != RESTRICTED
            AND (session.risk_level != HIGH OR strong_evidence == true)
            AND no MethodAttempt of this session with that method_code is in state ACCEPTED.
          Rank by assurance_weight DESC, then cost_cents ASC, then created_at ASC.
          Empty candidate set -> ERR_NO_ELIGIBLE_METHOD. selection_mode = SERVER_SELECTED.
      - name: PATHWAY_GRANT
        applies_when: "the APPROVE branch of an AlternativePathway decision"
        formula: |
          candidates = MethodProfile rows where method_code == VOUCHING_ATTESTATION AND bias_state != RESTRICTED.
          Rank by cost_cents ASC, then created_at ASC.
          Empty candidate set -> ERR_NO_ELIGIBLE_METHOD. selection_mode = PATHWAY_GRANTED.
    formula: |
      When the caller supplies method_profile_id explicitly, no selection runs: the named profile is
      used with selection_mode == CLIENT_REQUESTED after the ERR_METHOD_NOT_IN_POLICY,
      ERR_METHOD_NOT_DIRECTLY_ATTEMPTABLE and ERR_METHOD_RESTRICTED_BY_BIAS checks pass.
      Entity id is never used as a ranking or tie-break key; created_at ASC is the final tie-break.
    rounding: "not applicable"
    edge_cases:
      - "a HIGH risk session whose policy admits only profiles with strong_evidence == false has an empty candidate set"
      - "two candidates with equal assurance_weight are separated by cost_cents ASC, then by created_at ASC"

  - name: document_authenticity_assessment
    trigger: "POST /idv/method-attempts/{id}/document-captures"
    algorithm_type: tiered_pricing
    inputs:
      - "DocumentCapture.passed_feature_count and required_feature_count"
      - "DocumentCapture.tamper_signal_count"
      - "DocumentCapture.mrz_checksum_valid"
      - "pinned VerificationPolicy.doc_authenticity_floor_bps"
    constants:
      TAMPER_UNIT_BPS: 450
      TIER_CLEAN_MIN_BPS: 9000
      TIER_MID_MIN_BPS: 7000
      TIER_MULTIPLIER_CLEAN_BPS: 10000
      TIER_MULTIPLIER_MID_BPS: 15000
      TIER_MULTIPLIER_WEAK_BPS: 20000
      MRZ_INVALID_CAP_BPS: 4000
      SUSPECT_FLOOR_BPS: 5000
    formula: |
      Step 1: base_score_bps = round_half_up(10000 * passed_feature_count / required_feature_count)
      Step 2: tamper_tier_multiplier_bps is keyed on base_score_bps, i.e. on the PRE-penalty score:
                base_score_bps >= TIER_CLEAN_MIN_BPS            -> TIER_MULTIPLIER_CLEAN_BPS
                TIER_MID_MIN_BPS <= base_score_bps < 9000       -> TIER_MULTIPLIER_MID_BPS
                base_score_bps < TIER_MID_MIN_BPS               -> TIER_MULTIPLIER_WEAK_BPS
      Step 3: tamper_penalty_bps = floor(TAMPER_UNIT_BPS * tamper_signal_count * tamper_tier_multiplier_bps / 10000)
      Step 4: raw = max(0, base_score_bps - tamper_penalty_bps)
      Step 5: authenticity_score_bps = min(raw, MRZ_INVALID_CAP_BPS) when mrz_checksum_valid == false, else raw
      Step 6: assessment = AUTHENTIC when authenticity_score_bps >= policy.doc_authenticity_floor_bps
                         = SUSPECT   when SUSPECT_FLOOR_BPS <= authenticity_score_bps < floor
                         = FORGED    otherwise
      The step order is load-bearing: the tier must be read off the pre-penalty base score, and the
      MRZ cap must be applied after the tamper penalty, never before it.
    rounding: "step 1 rounds half up to whole basis points; step 3 truncates toward zero"
    edge_cases:
      - "passed_feature_count == required_feature_count with tamper_signal_count == 0 yields exactly 10000 bps"
      - "an authenticity score exactly equal to doc_authenticity_floor_bps is AUTHENTIC"
      - "a score exactly equal to SUSPECT_FLOOR_BPS is SUSPECT, one basis point lower is FORGED"

  - name: liveness_pad_decision
    trigger: "POST /idv/method-attempts/{id}/liveness-checks"
    algorithm_type: threshold
    inputs:
      - "LivenessCheck.pad_score_bps and capture_modality"
      - "MethodAttempt.retry_index"
      - "VerificationSession.risk_level"
      - "pinned VerificationPolicy.pad_threshold_bps"
    constants:
      RISK_PAD_BUMP: { LOW: 0, MEDIUM: 300, HIGH: 800 }
      PAD_RETRY_BUMP_BPS: 200
      ACTIVE_MODALITY_RELIEF_BPS: 250
      PAD_CEILING_BPS: 9500
      INCONCLUSIVE_BAND_BPS: 300
    formula: |
      relief = ACTIVE_MODALITY_RELIEF_BPS when capture_modality == ACTIVE else 0
      unclamped = policy.pad_threshold_bps + RISK_PAD_BUMP[session.risk_level]
                  + PAD_RETRY_BUMP_BPS * attempt.retry_index - relief
      effective_threshold_bps = min(PAD_CEILING_BPS, max(0, unclamped))
      decision = PASS         when pad_score_bps >= effective_threshold_bps
               = INCONCLUSIVE when effective_threshold_bps - INCONCLUSIVE_BAND_BPS <= pad_score_bps < effective_threshold_bps
               = FAIL         otherwise
      Raising false-reject tolerance is expressed by ACTIVE capture relief; tightening false-accept
      tolerance is expressed by the risk and retry bumps. The ceiling is applied last.
    rounding: "integer basis points; no rounding"
    edge_cases:
      - "pad_score_bps exactly equal to effective_threshold_bps is PASS"
      - "pad_score_bps exactly INCONCLUSIVE_BAND_BPS below the threshold is INCONCLUSIVE"
      - "the ceiling clamps the threshold before the comparison, so a very high retry_index cannot push it past 9500"

  - name: method_evidence_quality
    trigger: "POST /idv/method-attempts/{id}/document-captures, .../liveness-checks, .../data-evidence, and the APPROVE branch of POST /idv/alternative-pathways/{id}/decision"
    algorithm_type: weighted_scoring
    inputs:
      - "MethodAttempt.method_code and its resolved MethodProfile.assurance_weight"
      - "the evidence row submitted for the attempt"
    constants:
      BIO_MATCH_WEIGHT_BPS: 6000
      BIO_PAD_WEIGHT_BPS: 4000
      INCONCLUSIVE_HALVING_DIVISOR: 2
      VOUCHING_QUALITY_BPS: 9000
      ATTESTATION_QUALITY_BPS: 7000
    formula: |
      evidence_quality_bps by method_code:
        DOCUMENT_SCAN        -> DocumentCapture.authenticity_score_bps
        BIOMETRIC_COMPARISON -> blended = floor((BIO_MATCH_WEIGHT_BPS * match_score_bps
                                                 + BIO_PAD_WEIGHT_BPS * pad_score_bps) / 10000);
                                PASS -> blended; INCONCLUSIVE -> floor(blended / INCONCLUSIVE_HALVING_DIVISOR);
                                FAIL -> 0
        DATABASE_CHECK       -> floor(10000 * matched_field_count / total_field_count)
        KNOWLEDGE_BASED      -> floor(10000 * correct_answer_count / question_count)
        VOUCHING_ATTESTATION -> VOUCHING_QUALITY_BPS for a VOUCHING pathway, ATTESTATION_QUALITY_BPS for ATTESTATION
      contribution_points = floor(profile.assurance_weight * evidence_quality_bps / 10000)
      The per-attempt floor is applied here, before any session-level summation.
    rounding: "all divisions truncate toward zero"
    edge_cases:
      - "a FAIL liveness decision produces evidence_quality_bps == 0 and contribution_points == 0, and no BiometricTemplate is created"
      - "matched_field_count == total_field_count yields exactly 10000 bps"

  - name: assurance_score
    trigger: "every MethodAttempt scoring or finalisation, the APPROVE branch of an AlternativePathway decision, the bias restriction cascade, POST /idv/verification-sessions/{id}/complete and every ManualReviewCase decision"
    algorithm_type: aggregation
    inputs:
      - "MethodAttempt rows of the session with their contribution_points"
      - "the bias_state of each contributing attempt's MethodProfile"
      - "VerificationSession.assurance_ceiling"
    constants:
      SCORE_CAP: 100
      RESTRICTED_MULTIPLIER_BPS: 5000
      ATTESTATION_CEILING: 70
    variants:
      - name: PROVISIONAL
        applies_when: "written to assurance_score_provisional on every scoring, finalisation, pathway approval and restriction cascade"
        formula: |
          included = MethodAttempt rows of the session in state {SCORED, ACCEPTED}
          assurance_score_provisional = min(SCORE_CAP, sum(contribution_points of included))
          No bias haircut and no assurance_ceiling clamp is applied in this variant.
      - name: FINAL
        applies_when: "written once to assurance_score_final by the transition that gives the session a terminal identity_state or escalates it to MANUAL_REVIEW at completion"
        formula: |
          included = MethodAttempt rows of the session in state ACCEPTED only
          per_attempt = floor(contribution_points * RESTRICTED_MULTIPLIER_BPS / 10000)
                          when that attempt's MethodProfile.bias_state == RESTRICTED at the moment
                          the final score is written, else contribution_points
          assurance_score_final = min(assurance_ceiling, min(SCORE_CAP, sum(per_attempt)))
    formula: |
      Both variants sum per-attempt integers that were already floored by
      calculations.method_evidence_quality; the sum is never re-derived from raw basis points, so
      floor-then-sum is the only correct order.
    rounding: "truncation toward zero, applied per attempt before summation"
    edge_cases:
      - "an attempt in state REQUIRES_RESCORE, REJECTED or EXPIRED contributes nothing to either variant"
      - "an ATTESTATION pathway approval lowers assurance_ceiling to ATTESTATION_CEILING and therefore only affects the FINAL variant"
      - "a profile that becomes RESTRICTED after its attempt was ACCEPTED halves that attempt's contribution in the FINAL variant while the PROVISIONAL value stays unchanged"

  - name: age_assurance_decision
    trigger: "POST /idv/verification-sessions/{id}/age-assurance-results"
    algorithm_type: threshold
    inputs:
      - "AgeAssuranceResult.method with either estimated_age_months or date_of_birth"
      - "the AGE_ESTIMATION MethodProfile named in the request (estimation_mae_months and band_accuracy_bps)"
      - "pinned VerificationPolicy.age_buffer_multiplier_bps and required_min_age_years"
      - "logical clock date"
    constants:
      AGE_BAND_TABLE: { U13_MAX_MONTHS: 155, B13_15_MAX_MONTHS: 191, B16_17_MAX_MONTHS: 215, B18_20_MAX_MONTHS: 251 }
      MONTHS_PER_YEAR: 12
    variants:
      - name: ESTIMATION
        applies_when: "method == ESTIMATION"
        formula: |
          buffer_months = ceil(profile.estimation_mae_months * policy.age_buffer_multiplier_bps / 10000)
          effective_age_months = max(0, estimated_age_months - buffer_months)
          documented_accuracy_bps = profile.band_accuracy_bps[resolved_band]; a missing entry is
          rejected with ERR_AGE_ACCURACY_UNDOCUMENTED before the result is stored.
      - name: VERIFICATION
        applies_when: "method == VERIFICATION"
        formula: |
          buffer_months = 0
          effective_age_months = complete calendar months between date_of_birth and the clock date
          (a month counts only once the day-of-month has been reached)
          documented_accuracy_bps stays null and no MethodProfile is consulted.
    formula: |
      resolved_band = U13      when effective_age_months <= U13_MAX_MONTHS
                    = B13_15   when U13_MAX_MONTHS < effective_age_months <= B13_15_MAX_MONTHS
                    = B16_17   when B13_15_MAX_MONTHS < effective_age_months <= B16_17_MAX_MONTHS
                    = B18_20   when B16_17_MAX_MONTHS < effective_age_months <= B18_20_MAX_MONTHS
                    = A21_PLUS otherwise
      decision = ASSURED when effective_age_months >= policy.required_min_age_years * MONTHS_PER_YEAR else FAILED
    rounding: "buffer_months rounds up (ceiling); month counts are whole months"
    edge_cases:
      - "effective_age_months exactly equal to required_min_age_years * 12 is ASSURED"
      - "the estimation buffer is subtracted before banding, so a subject estimated above the gate can still band below it"
      - "a resolved_band of U13, B13_15 or B16_17 blocks further biometric capture and forces MINOR_PROTECTION template deletion"

  - name: cohort_disparity_evaluation
    trigger: "POST /idv/bias-audits/{id}/evaluate"
    algorithm_type: aggregation
    inputs:
      - "CohortMetric rows of the audit created at or after BiasAudit.remediated_at (all rows when remediated_at is null)"
    constants:
      MIN_COHORT_SAMPLE: 50
      MIN_COHORT_COUNT: 3
      DISPARITY_RESTRICT_BPS: 12500
      DISPARITY_MONITOR_BPS: 11000
    variants:
      - name: MAX_TO_MIN
        applies_when: "always computed and stored in disparity_ratio_max_to_min_bps for disclosure"
        formula: |
          disparity_ratio_max_to_min_bps = round_half_up(10000 * max_frr_bps / min_frr_bps)
          null when min_frr_bps == 0 or fewer than 2 cohorts are included.
          This variant never drives a state change.
      - name: MAX_TO_POOLED
        applies_when: "always computed and stored in disparity_ratio_max_to_pooled_bps; this is the gating ratio"
        formula: |
          disparity_ratio_max_to_pooled_bps = round_half_up(10000 * max_frr_bps / pooled_frr_bps)
          null when pooled_frr_bps == 0 or fewer than 2 cohorts are included.
          gate: >= DISPARITY_RESTRICT_BPS -> REMEDIATION_REQUIRED and MethodProfile RESTRICTED;
                >= DISPARITY_MONITOR_BPS  -> MONITORED;
                otherwise                 -> CLEARED.
    formula: |
      in_scope = CohortMetric rows of the audit created at or after remediated_at
      included = in_scope rows with included_in_ratio == true (attempt_count >= MIN_COHORT_SAMPLE)
      included_cohort_count = count(included); excluded_cohort_count = count(in_scope) - included_cohort_count
      insufficient_sample = included_cohort_count < 2; when true both ratios stay null, the audit
      still becomes EVALUATED and MethodProfile.bias_state is left untouched.
      max_frr_bps = max(frr_bps of included); min_frr_bps = min(frr_bps of included)
      pooled_frr_bps = round_half_up(10000 * sum(false_reject_count of included) / sum(attempt_count of included))
      worst_cohort_code = the included cohort with the highest frr_bps, ties broken by cohort_code ascending
      Entity id is never used as a tie-break key.
      Fewer than MIN_COHORT_COUNT in-scope rows is rejected with ERR_INSUFFICIENT_COHORT_COVERAGE
      before any of the above runs.
    rounding: "each ratio and each rate rounds half up to whole basis points; the pooled rate is computed from summed counts, never as a mean of per-cohort rates"
    edge_cases:
      - "a gating ratio exactly equal to DISPARITY_RESTRICT_BPS restricts the profile"
      - "the disclosure variant can sit above DISPARITY_RESTRICT_BPS while the gating variant only reaches MONITORED"
      - "three cohorts each below MIN_COHORT_SAMPLE leave both ratios null and the profile untouched"

  - name: retention_schedule
    trigger: "every transition that makes VerificationSession.identity_state terminal, and POST /idv/retention-sweeps"
    algorithm_type: decay_function
    inputs:
      - "Client.biometric_retention_mode"
      - "VerificationSession.biometric_consent and resolved_age_band"
      - "VerificationSession.completed_at"
      - "BiometricTemplate.state and retention_expires_at"
    constants:
      RETENTION_DAYS: 90
      MINOR_BANDS: [U13, B13_15, B16_17]
    formula: |
      For each BiometricTemplate of the session in state STORED, in this precedence order:
        1. resolved_age_band in MINOR_BANDS                        -> DELETED now, MINOR_PROTECTION
        2. biometric_retention_mode == DELETE_ON_COMPLETE          -> DELETED now, POLICY_IMMEDIATE
        3. biometric_retention_mode == RETAIN_WITH_CONSENT
           and biometric_consent == false                          -> DELETED now, CONSENT_ABSENT
        4. otherwise                                               -> PURGE_SCHEDULED with
           retention_expires_at = completed_at + RETENTION_DAYS days
      POST /idv/retention-sweeps then deletes every PURGE_SCHEDULED template whose
      retention_expires_at is at or before the clock (clock >= retention_expires_at) with
      deletion_reason == RETENTION_EXPIRED.
      Client.stored_template_count decrements exactly once per template, when it leaves STORED.
    rounding: "whole days on the logical clock; the time of day is preserved"
    edge_cases:
      - "a template whose retention_expires_at equals the clock is deleted by the sweep (inclusive comparison)"
      - "the minor-protection rule outranks a client's RETAIN_90_DAYS configuration"
      - "a session that never captured biometrics produces no template work and leaves stored_template_count unchanged"

  - name: review_credit_pool
    trigger: "POST /idv/manual-review-cases/{id}/assign, POST /idv/manual-review-cases/{id}/decision and the SLA withdrawal branch of POST /idv/retention-sweeps"
    algorithm_type: waterfall_allocation
    inputs:
      - "Client.granted_review_credits"
      - "ManualReviewCase rows of the client and their states"
    constants:
      CREDITS_PER_ASSIGNMENT: 1
    formula: |
      reserved_review_credits = CREDITS_PER_ASSIGNMENT * count(ManualReviewCase of the client in state ASSIGNED)
      available_review_credits = granted_review_credits - reserved_review_credits
      Assignment requires available_review_credits >= CREDITS_PER_ASSIGNMENT, else
      ERR_REVIEW_CAPACITY_EXHAUSTED. Reaching DECIDED or WITHDRAWN from ASSIGNED releases the credit.
      Invariant, checked after every credit-touching request:
        reserved_review_credits + available_review_credits == granted_review_credits
      Queued cases hold no credit, so escalation itself can never be blocked by capacity.
    rounding: "integer credits"
    edge_cases:
      - "a case withdrawn from QUEUED by the SLA sweep releases nothing because it never reserved"
      - "consumed_review_count only counts DECIDED cases and never decrements"

  - name: client_rolling_window_usage
    trigger: "POST /idv/verification-sessions"
    algorithm_type: aggregation
    inputs:
      - "VerificationSession rows of the client with their created_at"
      - "Client.daily_session_quota"
      - "logical clock"
    constants:
      QUOTA_WINDOW_HOURS: 24
    formula: |
      window = [clock - QUOTA_WINDOW_HOURS hours, clock], inclusive at both ends.
      used = count(VerificationSession of the client whose created_at falls inside window),
      counted regardless of identity_state, including EXPIRED and REJECTED sessions.
      used >= daily_session_quota -> ERR_CLIENT_DAILY_QUOTA_EXCEEDED; otherwise the session is created.
    rounding: "integer counts"
    edge_cases:
      - "a session created exactly QUOTA_WINDOW_HOURS before the clock is still inside the window"
      - "advancing the clock one further second drops that session out of the window and frees quota"

validations:
  - priority: 1
    category: auth
    rule: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint"
  - priority: 2
    category: authz
    rule: "the caller's X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "every endpoint"
  - priority: 3
    category: existence
    rule: "the Client named by the path exists"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "PATCH /idv/clients/{id}, GET /idv/clients/{id}"
  - priority: 4
    category: existence
    rule: "the MethodProfile named by the path exists"
    error_id: ERR_METHOD_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "GET /idv/method-profiles/{id}, GET /idv/method-profiles/{id}/bias-audits"
  - priority: 5
    category: existence
    rule: "the VerificationPolicy named by the path exists"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "POST /idv/verification-policies/{id}/publish, GET /idv/verification-policies/{id}"
  - priority: 6
    category: existence
    rule: "the VerificationSession named by the path exists"
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "every /idv/verification-sessions/{id}/... endpoint and GET /idv/verification-sessions/{id}"
  - priority: 7
    category: existence
    rule: "the MethodAttempt named by the path exists"
    error_id: ERR_ATTEMPT_NOT_FOUND
    http_status: 404
    applies_to: "every /idv/method-attempts/{id}/... endpoint and GET /idv/method-attempts/{id}"
  - priority: 8
    category: existence
    rule: "the AlternativePathway named by the path exists"
    error_id: ERR_PATHWAY_NOT_FOUND
    http_status: 404
    applies_to: "POST /idv/alternative-pathways/{id}/decision"
  - priority: 9
    category: existence
    rule: "the ManualReviewCase named by the path exists"
    error_id: ERR_REVIEW_CASE_NOT_FOUND
    http_status: 404
    applies_to: "POST /idv/manual-review-cases/{id}/assign, POST /idv/manual-review-cases/{id}/decision"
  - priority: 10
    category: existence
    rule: "the BiasAudit named by the path exists"
    error_id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "every /idv/bias-audits/{id}/... endpoint and GET /idv/bias-audits/{id}"
  - priority: 11
    category: ownership
    rule: "for a ClientIntegrator caller, the target resource resolves to the Client whose id equals the caller's X-User-ID"
    error_id: ERR_CLIENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles include ClientIntegrator"
  - priority: 12
    category: ownership
    rule: "the caller's X-User-ID equals ManualReviewCase.assigned_reviewer_user_id"
    error_id: ERR_REVIEW_ASSIGNEE_MISMATCH
    http_status: 403
    applies_to: "POST /idv/manual-review-cases/{id}/decision"
  - priority: 13
    category: schema
    rule: "body parses, contains no unknown keys, every required field is present, and every value satisfies its declared enum, range, length and conditional-presence constraints (including window_end strictly after window_start, passed_feature_count <= required_feature_count, false_reject_count <= attempt_count, ESTIMATION requiring estimated_age_months and estimation_profile_id while VERIFICATION requires date_of_birth, DATABASE_CHECK evidence requiring matched_field_count and total_field_count while KNOWLEDGE_BASED requires correct_answer_count and question_count, VOUCHING requiring voucher_reference and ATTESTATION requiring attestation_document_ref, and at least one mutable field on PATCH)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every endpoint that accepts a body"
  - priority: 14
    category: body_reference
    rule: "a Client referenced by a body field exists"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /idv/verification-policies, POST /idv/verification-sessions"
  - priority: 15
    category: body_reference
    rule: "a MethodProfile referenced by a body field exists"
    error_id: ERR_METHOD_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "POST /idv/bias-audits, POST /idv/verification-sessions/{id}/method-attempts, POST /idv/verification-sessions/{id}/age-assurance-results"
  - priority: 16
    category: state
    rule: "the VerificationSession is in a state the operation admits: IN_PROGRESS for evidence, finalisation and completion; AWAITING_EVIDENCE for step-up; IN_PROGRESS or AWAITING_EVIDENCE for pathway requests and decisions; MANUAL_REVIEW for review decisions; and, on the age axis, age_state in {PENDING, FAILED} for a new AgeAssuranceResult"
    error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
    applies_to: "every session-mutating endpoint"
  - priority: 17
    category: business_constraint
    rule: "the attempt has no evidence row yet; this check precedes the attempt-state check so that a second evidence submission on an already scored attempt reports the specific duplicate-evidence error rather than the generic state error"
    error_id: ERR_EVIDENCE_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /idv/method-attempts/{id}/document-captures, .../liveness-checks, .../data-evidence"
  - priority: 18
    category: state
    rule: "the VerificationPolicy is DRAFT"
    error_id: ERR_POLICY_STATE_INVALID
    http_status: 409
    applies_to: "POST /idv/verification-policies/{id}/publish"
  - priority: 19
    category: state
    rule: "the AlternativePathway is in state VOUCH_PENDING or ATTESTATION_PENDING"
    error_id: ERR_PATHWAY_STATE_INVALID
    http_status: 409
    applies_to: "POST /idv/alternative-pathways/{id}/decision"
  - priority: 20
    category: state
    rule: "the ManualReviewCase is QUEUED for assignment and ASSIGNED for a decision"
    error_id: ERR_REVIEW_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /idv/manual-review-cases/{id}/assign, POST /idv/manual-review-cases/{id}/decision"
  - priority: 21
    category: state
    rule: "the BiasAudit is COLLECTING for cohort submission and evaluation, and REMEDIATION_REQUIRED for remediation"
    error_id: ERR_AUDIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /idv/bias-audits/{id}/cohort-metrics, POST /idv/bias-audits/{id}/evaluate, POST /idv/bias-audits/{id}/remediation"
  - priority: 22
    category: concurrency
    rule: "expected_client_version equals the current Client.version"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /idv/verification-policies/{id}/publish"
  - priority: 23
    category: concurrency
    rule: "expected_method_profile_version equals the audited MethodProfile.version"
    error_id: ERR_STALE_METHOD_PROFILE_VERSION
    http_status: 412
    applies_to: "POST /idv/bias-audits/{id}/remediation"
  - priority: 24
    category: business_safety
    rule: "the Client integration posture admits the operation: integration_state == LIVE to open a session, and integration_state != SUSPENDED to publish a policy or add an attempt"
    error_id: ERR_CLIENT_NOT_LIVE
    http_status: 409
    applies_to: "POST /idv/verification-sessions, POST /idv/verification-policies/{id}/publish, POST /idv/verification-sessions/{id}/method-attempts"
  - priority: 25
    category: business_safety
    rule: "the session's pinned VerificationPolicy is still PUBLISHED"
    error_id: ERR_PINNED_POLICY_RETIRED
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/method-attempts"
  - priority: 26
    category: business_safety
    rule: "the MethodProfile involved does not have bias_state == RESTRICTED"
    error_id: ERR_METHOD_RESTRICTED_BY_BIAS
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/method-attempts, POST /idv/bias-audits/{id}/evaluate"
  - priority: 27
    category: business_safety
    rule: "the session's resolved_age_band is not one of the minor bands U13, B13_15 or B16_17 when biometric evidence is submitted"
    error_id: ERR_MINOR_BIOMETRIC_PROHIBITED
    http_status: 409
    applies_to: "POST /idv/method-attempts/{id}/liveness-checks"
  - priority: 28
    category: business_safety
    rule: "the session recorded biometric_consent == true"
    error_id: ERR_BIOMETRIC_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /idv/method-attempts/{id}/liveness-checks"
  - priority: 29
    category: business_safety
    rule: "the estimation MethodProfile documents an accuracy for the band the estimate resolves to"
    error_id: ERR_AGE_ACCURACY_UNDOCUMENTED
    http_status: 422
    applies_to: "POST /idv/verification-sessions/{id}/age-assurance-results"
  - priority: 30
    category: business_safety
    rule: "the acting user is not the same person as the user who performed the paired earlier step: a review decision may not be taken by the assigning ReviewManager, and a remediation may not be recorded by the ComplianceOfficer who ran the evaluation"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /idv/manual-review-cases/{id}/decision, POST /idv/bias-audits/{id}/remediation"
  - priority: 31
    category: business_referential
    rule: "the client has a PUBLISHED VerificationPolicy to pin"
    error_id: ERR_NO_PUBLISHED_POLICY
    http_status: 409
    applies_to: "POST /idv/verification-sessions"
  - priority: 32
    category: business_referential
    rule: "an explicitly requested MethodProfile has a method_code that clients may attempt directly, i.e. not VOUCHING_ATTESTATION or AGE_ESTIMATION; this check precedes the allowed_method_codes check because neither code can ever appear in a policy's allowed_method_codes"
    error_id: ERR_METHOD_NOT_DIRECTLY_ATTEMPTABLE
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/method-attempts"
  - priority: 33
    category: business_referential
    rule: "an explicitly requested MethodProfile has a method_code inside the pinned policy's allowed_method_codes"
    error_id: ERR_METHOD_NOT_IN_POLICY
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/method-attempts"
  - priority: 34
    category: business_referential
    rule: "the evidence kind matches the attempt's method_code"
    error_id: ERR_EVIDENCE_METHOD_MISMATCH
    http_status: 409
    applies_to: "POST /idv/method-attempts/{id}/document-captures, .../liveness-checks, .../data-evidence"
  - priority: 35
    category: business_constraint
    rule: "(method_code, vendor_code) is unique across MethodProfile"
    error_id: ERR_METHOD_PROFILE_DUPLICATE
    http_status: 409
    applies_to: "POST /idv/method-profiles"
  - priority: 36
    category: business_constraint
    rule: "(client_id, policy_version) is unique across VerificationPolicy"
    error_id: ERR_POLICY_VERSION_DUPLICATE
    http_status: 409
    applies_to: "POST /idv/verification-policies"
  - priority: 37
    category: business_constraint
    rule: "cohort_code is unique per bias_audit_id"
    error_id: ERR_COHORT_DUPLICATE
    http_status: 409
    applies_to: "POST /idv/bias-audits/{id}/cohort-metrics"
  - priority: 38
    category: business_temporal
    rule: "the session has not lapsed, i.e. clock <= expires_at"
    error_id: ERR_SESSION_EXPIRED
    http_status: 409
    applies_to: "every session-mutating endpoint and every attempt-mutating endpoint"
  - priority: 39
    category: business_temporal
    rule: "the requested measurement window does not overlap the window of another BiasAudit on the same MethodProfile in state COLLECTING, EVALUATED or REMEDIATION_REQUIRED; windows are half-open [window_start, window_end) so an audit starting exactly at another's window_end is admissible"
    error_id: ERR_AUDIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /idv/bias-audits"
  - priority: 40
    category: state
    rule: "the MethodAttempt is in a state the operation admits: AWAITING_EVIDENCE for evidence submission, SCORED for finalisation"
    error_id: ERR_ATTEMPT_STATE_INVALID
    http_status: 409
    applies_to: "POST /idv/method-attempts/{id}/document-captures, .../liveness-checks, .../data-evidence, .../finalize"
  - priority: 41
    category: business_constraint
    rule: "calculations.method_candidate_selection yields a non-empty candidate set"
    error_id: ERR_NO_ELIGIBLE_METHOD
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/method-attempts, POST /idv/alternative-pathways/{id}/decision"
  - priority: 42
    category: business_constraint
    rule: "step_up_round < policy.step_up_max_rounds"
    error_id: ERR_STEP_UP_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/step-up"
  - priority: 43
    category: business_constraint
    rule: "no MethodAttempt of the session is in state AWAITING_EVIDENCE, SCORED or REQUIRES_RESCORE"
    error_id: ERR_ATTEMPT_PENDING_FINALIZATION
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/complete"
  - priority: 44
    category: business_constraint
    rule: "no AlternativePathway of the session is in state VOUCH_PENDING or ATTESTATION_PENDING"
    error_id: ERR_PENDING_PATHWAY_BLOCKS_COMPLETION
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/complete"
  - priority: 45
    category: business_constraint
    rule: "the pinned policy has alternative_pathway_enabled == true"
    error_id: ERR_ALTERNATIVE_PATHWAY_DISABLED
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/alternative-pathways"
  - priority: 46
    category: business_constraint
    rule: "when the pinned policy sets required_min_age_years > 0, age_state is no longer PENDING"
    error_id: ERR_AGE_ASSURANCE_MISSING
    http_status: 409
    applies_to: "POST /idv/verification-sessions/{id}/complete"
  - priority: 47
    category: business_constraint
    rule: "the audit has at least MIN_COHORT_COUNT in-scope CohortMetric rows"
    error_id: ERR_INSUFFICIENT_COHORT_COVERAGE
    http_status: 409
    applies_to: "POST /idv/bias-audits/{id}/evaluate"
  - priority: 48
    category: business_fiscal
    rule: "Client.available_review_credits >= CREDITS_PER_ASSIGNMENT"
    error_id: ERR_REVIEW_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /idv/manual-review-cases/{id}/assign"
  - priority: 49
    category: business_fiscal
    rule: "calculations.client_rolling_window_usage reports used < daily_session_quota"
    error_id: ERR_CLIENT_DAILY_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /idv/verification-sessions"

endpoints:
  - method: POST
    path: /idv/clients
    description: "Register a relying-party client with its retention mode, quota and manual-review credit pool."
    roles: [PlatformAdmin]
    input: [name, home_jurisdiction_code, biometric_retention_mode, daily_session_quota, granted_review_credits]
    output: Client
    side_effects:
      - "integration_state defaults to SANDBOX; reserved_review_credits, stored_template_count, pending_stepup_count and consumed_review_count start at 0; available_review_credits starts equal to granted_review_credits"

  - method: PATCH
    path: /idv/clients/{id}
    description: "Adjust a client's integration posture, retention mode, quota or credit grant."
    roles: [PlatformAdmin]
    input: ["integration_state?", "biometric_retention_mode?", "daily_session_quota?", "granted_review_credits?"]
    output: Client
    side_effects:
      - "available_review_credits is re-derived per calculations.review_credit_pool so the pool invariant still holds after a grant change"
      - "increments Client.version by 1"

  - method: POST
    path: /idv/method-profiles
    description: "Register a vendor method profile with its assurance weight, acceptance floor and documented error rates."
    roles: [PlatformAdmin]
    input: ["method_code", "vendor_code", "assurance_weight", "acceptance_floor_bps", "far_bps", "frr_bps", "strong_evidence", "cost_cents", "estimation_mae_months?", "band_accuracy_bps?"]
    output: MethodProfile
    side_effects:
      - "bias_state starts CLEARED and restricted_at starts null"

  - method: POST
    path: /idv/verification-policies
    description: "Draft a client verification policy: method ladder, score floor, document and liveness thresholds, age gate, step-up budget and inclusion switch."
    roles: [ClientIntegrator, ComplianceOfficer]
    input: ["client_id", "policy_version", "allowed_method_codes", "min_assurance_score", "doc_authenticity_floor_bps?", "pad_threshold_bps?", "required_min_age_years?", "age_buffer_multiplier_bps?", "step_up_max_rounds?", "alternative_pathway_enabled?"]
    output: VerificationPolicy
    side_effects:
      - "state starts DRAFT with published_at, retired_at null and degraded_flag false"

  - method: POST
    path: /idv/verification-policies/{id}/publish
    description: "Publish a DRAFT policy, retiring the client's current PUBLISHED policy under optimistic concurrency on Client.version."
    roles: [ComplianceOfficer]
    input: [expected_client_version]
    output: VerificationPolicy
    side_effects:
      - "DRAFT -> PUBLISHED with published_at = clock"
      - "the client's previously PUBLISHED policy -> RETIRED with retired_at = clock"
      - "increments Client.version by 1"

  - method: POST
    path: /idv/verification-sessions
    description: "Open a verification session, pin the client's published policy, and freeze the risk assessment."
    roles: [ClientIntegrator]
    input: ["client_id", "external_subject_ref", "requested_assurance_tier", "subject_jurisdiction_code", "declared_transaction_value_cents?", "biometric_consent?", "documentation_status?"]
    output: VerificationSession
    side_effects:
      - "policy_id pinned per calculations.policy_pinning_selector"
      - "risk_score and risk_level frozen per calculations.session_risk_assessment"
      - "expires_at set per calculations.session_expiry_schedule"
      - "quota enforced per calculations.client_rolling_window_usage"
      - "identity_state = IN_PROGRESS; age_state = NOT_REQUIRED when the pinned policy sets required_min_age_years == 0, else PENDING"
      - "append AuditEvent with event_type == SESSION_CREATED"

  - method: POST
    path: /idv/verification-sessions/{id}/method-attempts
    description: "Start a verification attempt, either on an explicitly requested profile or on the winner of the risk-aware method selector."
    roles: [ClientIntegrator]
    input: ["method_profile_id?"]
    output: MethodAttempt
    side_effects:
      - "profile resolved per calculations.method_candidate_selection variant LADDER when method_profile_id is absent"
      - "method_code copied from the profile, retry_index derived from same-code attempts of the session, state = AWAITING_EVIDENCE"

  - method: POST
    path: /idv/method-attempts/{id}/document-captures
    description: "Submit a document capture for a DOCUMENT_SCAN attempt and assess authenticity with tamper detection and security-feature validation."
    roles: [ClientIntegrator]
    input: [document_type, required_feature_count, passed_feature_count, tamper_signal_count, mrz_checksum_valid]
    output: DocumentCapture
    side_effects:
      - "all authenticity fields written per calculations.document_authenticity_assessment"
      - "attempt evidence_quality_bps and contribution_points written per calculations.method_evidence_quality; attempt -> SCORED"
      - "session assurance_score_provisional recomputed per calculations.assurance_score variant PROVISIONAL"

  - method: POST
    path: /idv/method-attempts/{id}/liveness-checks
    description: "Submit liveness and comparison scores for a BIOMETRIC_COMPARISON attempt and apply the tuned presentation-attack threshold."
    roles: [ClientIntegrator]
    input: [capture_modality, pad_score_bps, match_score_bps]
    output: LivenessCheck
    side_effects:
      - "effective_threshold_bps and decision written per calculations.liveness_pad_decision"
      - "attempt evidence_quality_bps and contribution_points written per calculations.method_evidence_quality; attempt -> SCORED"
      - "a BiometricTemplate in state STORED is created and Client.stored_template_count += 1 unless the decision is FAIL"
      - "session assurance_score_provisional recomputed per calculations.assurance_score variant PROVISIONAL"

  - method: POST
    path: /idv/method-attempts/{id}/data-evidence
    description: "Submit database-check field matches or knowledge-based answer counts for the attempt."
    roles: [ClientIntegrator]
    input: ["matched_field_count?", "total_field_count?", "correct_answer_count?", "question_count?"]
    output: MethodAttempt
    side_effects:
      - "evidence_quality_bps and contribution_points written per calculations.method_evidence_quality; attempt -> SCORED"
      - "session assurance_score_provisional recomputed per calculations.assurance_score variant PROVISIONAL"

  - method: POST
    path: /idv/method-attempts/{id}/finalize
    description: "Finalise a SCORED attempt against its profile acceptance floor, driving step-up or fraud escalation on the session."
    roles: [ClientIntegrator]
    input: []
    output: MethodAttempt
    side_effects:
      - "SCORED -> ACCEPTED or REJECTED with rejection_reason and tamper_flag as applicable, finalized_at = clock"
      - "session assurance_score_provisional recomputed per calculations.assurance_score variant PROVISIONAL"
      - "session identity_state driven to MANUAL_REVIEW (creating a ManualReviewCase with sla_due_at per calculations.review_sla_schedule) on tamper, else to AWAITING_EVIDENCE when step-up budget remains"
      - "append AuditEvent with event_type == ATTEMPT_FINALIZED"

  - method: POST
    path: /idv/verification-sessions/{id}/age-assurance-results
    description: "Record an age estimation or age verification result with its documented accuracy and band."
    roles: [ClientIntegrator]
    input: ["method", "estimation_profile_id?", "estimated_age_months?", "date_of_birth?"]
    output: AgeAssuranceResult
    side_effects:
      - "buffer_months, effective_age_months, resolved_band and decision written per calculations.age_assurance_decision"
      - "source_vendor_code, mae_months_snapshot and documented_accuracy_bps snapshotted from the estimation profile"
      - "session age_state -> ASSURED or FAILED and resolved_age_band updated"

  - method: POST
    path: /idv/verification-sessions/{id}/step-up
    description: "Consume one step-up round and return an AWAITING_EVIDENCE session to IN_PROGRESS."
    roles: [ClientIntegrator]
    input: []
    output: VerificationSession
    side_effects:
      - "AWAITING_EVIDENCE -> IN_PROGRESS, step_up_round += 1, Client.pending_stepup_count -= 1"
      - "append AuditEvent with event_type == STEP_UP_TRIGGERED"

  - method: POST
    path: /idv/verification-sessions/{id}/complete
    description: "Close an IN_PROGRESS session: write the final assurance score and resolve the disposition, escalating to manual review when the score falls short."
    roles: [ClientIntegrator]
    input: []
    output: VerificationSession
    side_effects:
      - "assurance_score_final written per calculations.assurance_score variant FINAL"
      - "identity_state -> VERIFIED, REJECTED or MANUAL_REVIEW with disposition_reason and completed_at set on terminal outcomes"
      - "biometric templates handled per calculations.retention_schedule"
      - "append AuditEvent with event_type == SESSION_TERMINAL or ESCALATED_TO_REVIEW"

  - method: POST
    path: /idv/verification-sessions/{id}/alternative-pathways
    description: "Request an inclusion pathway for a subject without standard documentation; the request forks on pathway_type."
    roles: [ClientIntegrator]
    input: ["pathway_type", "voucher_reference?", "attestation_document_ref?"]
    output: AlternativePathway
    side_effects:
      - "state = VOUCH_PENDING for VOUCHING, ATTESTATION_PENDING for ATTESTATION"

  - method: POST
    path: /idv/alternative-pathways/{id}/decision
    description: "Approve or deny an inclusion pathway; approval grants a VOUCHING_ATTESTATION attempt and, for attestation, lowers the session assurance ceiling."
    roles: [InclusionReviewer]
    input: [action]
    output: AlternativePathway
    side_effects:
      - "on APPROVE a MethodAttempt is created and ACCEPTED per calculations.method_candidate_selection variant PATHWAY_GRANT and calculations.method_evidence_quality; granted_points recorded"
      - "on APPROVE of an ATTESTATION pathway, VerificationSession.assurance_ceiling = ATTESTATION_CEILING"
      - "session assurance_score_provisional recomputed per calculations.assurance_score variant PROVISIONAL"
      - "append AuditEvent with event_type == PATHWAY_DECIDED"

  - method: POST
    path: /idv/manual-review-cases/{id}/assign
    description: "Assign a queued escalation to a named reviewer, reserving one manual-review credit."
    roles: [ReviewManager]
    input: [assigned_reviewer_user_id]
    output: ManualReviewCase
    side_effects:
      - "QUEUED -> ASSIGNED, assigned_by_user_id = X-User-ID"
      - "one credit reserved per calculations.review_credit_pool"

  - method: POST
    path: /idv/manual-review-cases/{id}/decision
    description: "Record the reviewer verdict, releasing the reserved credit and driving the session out of MANUAL_REVIEW."
    roles: [ManualReviewer]
    input: [decision]
    output: ManualReviewCase
    side_effects:
      - "ASSIGNED -> DECIDED with decided_by_user_id and decided_at"
      - "one credit released per calculations.review_credit_pool and Client.consumed_review_count += 1"
      - "session identity_state -> VERIFIED, REJECTED or AWAITING_EVIDENCE per the decision, with assurance_score_final written per calculations.assurance_score variant FINAL on terminal outcomes and templates handled per calculations.retention_schedule"
      - "append AuditEvent with event_type == REVIEW_DECIDED"

  - method: POST
    path: /idv/bias-audits
    description: "Open a demographic performance audit over a measurement window for one method profile."
    roles: [ComplianceOfficer]
    input: [method_profile_id, window_start, window_end]
    output: BiasAudit
    side_effects:
      - "state starts COLLECTING with remediation_round 0 and every disparity field null"

  - method: POST
    path: /idv/bias-audits/{id}/cohort-metrics
    description: "Add one demographic cohort's attempt, false-reject and false-accept counts to a collecting audit."
    roles: [ComplianceOfficer]
    input: [cohort_code, attempt_count, false_reject_count, false_accept_count]
    output: CohortMetric
    side_effects:
      - "frr_bps, far_bps and included_in_ratio derived per calculations.cohort_disparity_evaluation"

  - method: POST
    path: /idv/bias-audits/{id}/evaluate
    description: "Evaluate cohort disparity, set the profile's bias posture and cascade any restriction into live sessions."
    roles: [ComplianceOfficer]
    input: []
    output: BiasAudit
    side_effects:
      - "every disparity field written per calculations.cohort_disparity_evaluation, both variants"
      - "MethodProfile.bias_state set to CLEARED, MONITORED or RESTRICTED"
      - "on RESTRICTED: affected MethodAttempt rows -> REQUIRES_RESCORE, affected non-terminal sessions -> AWAITING_EVIDENCE with Client.pending_stepup_count += 1, pinned policies degraded_flag = true, session assurance_score_provisional recomputed per calculations.assurance_score variant PROVISIONAL, AuditEvent with event_type == METHOD_RESTRICTION_APPLIED appended"

  - method: POST
    path: /idv/bias-audits/{id}/remediation
    description: "Record disparity remediation under optimistic concurrency on MethodProfile.version, lifting the restriction and clearing rescore-blocked attempts."
    roles: [ComplianceOfficer]
    input: [expected_method_profile_version, remediation_note]
    output: BiasAudit
    side_effects:
      - "REMEDIATION_REQUIRED -> COLLECTING, remediation_round += 1, remediated_at = clock"
      - "MethodProfile.bias_state RESTRICTED -> MONITORED, restricted_at = null; increments MethodProfile.version by 1"
      - "REQUIRES_RESCORE attempts on that profile -> REJECTED with rejection_reason == METHOD_RESTRICTED and session assurance_score_provisional recomputed per calculations.assurance_score variant PROVISIONAL"
      - "VerificationPolicy.degraded_flag cleared where no admitted profile is RESTRICTED any more"

  - method: POST
    path: /idv/retention-sweeps
    description: "Operations sweep that lapses overdue sessions, withdraws review cases past SLA and deletes biometric templates whose retention window has closed."
    roles: [PlatformAdmin]
    input: []
    output: { expired_session_count: integer, withdrawn_case_count: integer, deleted_template_count: integer, swept_at: string }
    side_effects:
      - "sessions past expires_at -> EXPIRED with attempts EXPIRED, pending pathways WITHDRAWN and templates handled per calculations.retention_schedule"
      - "ManualReviewCase rows at or past sla_due_at -> WITHDRAWN with credits released per calculations.review_credit_pool and their sessions REJECTED with disposition_reason == REVIEW_LAPSED"
      - "PURGE_SCHEDULED templates at or past retention_expires_at -> DELETED with deletion_reason == RETENTION_EXPIRED and an AuditEvent with event_type == TEMPLATE_DELETED"

  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint that sets the logical clock. The clock starts at the mandatory default 2026-08-01T00:00:00Z, so every temporal assertion in this scaffold is reproducible without wall-clock dependence. Reachability ladder note: session lapse, review SLA withdrawal and 90-day retention purge cannot be reached by composing business endpoints, so a clock-setting endpoint is the last-resort mechanism."
    roles: [PlatformAdmin]
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "no business entity is mutated; only the logical clock moves"

  - method: GET
    path: /idv/clients/{id}
    description: "Read one client with its live credit pool and custody counters."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator]
    input: []
    output: Client

  - method: GET
    path: /idv/method-profiles/{id}
    description: "Read one method profile with its bias posture and documented error rates."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator]
    input: []
    output: MethodProfile

  - method: GET
    path: /idv/method-profiles/{id}/bias-audits
    description: "List the bias audits recorded against one method profile."
    roles: [PlatformAdmin, ComplianceOfficer]
    input: ["state?", "limit?", "offset?"]
    output: BiasAudit[]

  - method: GET
    path: /idv/verification-policies/{id}
    description: "Read one verification policy."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator]
    input: []
    output: VerificationPolicy

  - method: GET
    path: /idv/verification-policies
    description: "List verification policies, filterable by client and publication state."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator]
    input: ["client_id?", "state?", "limit?", "offset?"]
    output: VerificationPolicy[]

  - method: GET
    path: /idv/verification-sessions/{id}
    description: "Read one verification session with both state axes, both scores and the disposition."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator, ReviewManager, ManualReviewer, InclusionReviewer]
    input: []
    output: VerificationSession

  - method: GET
    path: /idv/verification-sessions
    description: "List verification sessions, filterable by client, pinned policy, either state axis and subject reference."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator]
    input: ["client_id?", "policy_id?", "identity_state?", "age_state?", "external_subject_ref?", "limit?", "offset?"]
    output: VerificationSession[]

  - method: GET
    path: /idv/method-attempts/{id}
    description: "Read one method attempt with its evidence quality and contribution."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator, ManualReviewer]
    input: []
    output: MethodAttempt

  - method: GET
    path: /idv/method-attempts
    description: "List method attempts, filterable by session, profile and state."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator, ManualReviewer]
    input: ["session_id?", "method_profile_id?", "state?", "limit?", "offset?"]
    output: MethodAttempt[]

  - method: GET
    path: /idv/method-attempts/{id}/document-captures
    description: "List the document captures submitted for one attempt."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator, ManualReviewer]
    input: ["limit?", "offset?"]
    output: DocumentCapture[]

  - method: GET
    path: /idv/method-attempts/{id}/liveness-checks
    description: "List the liveness checks submitted for one attempt."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator, ManualReviewer]
    input: ["limit?", "offset?"]
    output: LivenessCheck[]

  - method: GET
    path: /idv/verification-sessions/{id}/biometric-templates
    description: "List the biometric templates held for one session with their custody state and retention deadline."
    roles: [PlatformAdmin, ComplianceOfficer]
    input: ["state?", "limit?", "offset?"]
    output: BiometricTemplate[]

  - method: GET
    path: /idv/verification-sessions/{id}/age-assurance-results
    description: "List the age assurance results recorded for one session, newest last by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator, ManualReviewer]
    input: ["limit?", "offset?"]
    output: AgeAssuranceResult[]

  - method: GET
    path: /idv/verification-sessions/{id}/alternative-pathways
    description: "List the inclusion pathways requested for one session."
    roles: [PlatformAdmin, ComplianceOfficer, ClientIntegrator, InclusionReviewer]
    input: ["state?", "limit?", "offset?"]
    output: AlternativePathway[]

  - method: GET
    path: /idv/verification-sessions/{id}/manual-review-cases
    description: "List the manual review cases raised for one session."
    roles: [PlatformAdmin, ComplianceOfficer, ReviewManager, ManualReviewer]
    input: ["state?", "limit?", "offset?"]
    output: ManualReviewCase[]

  - method: GET
    path: /idv/verification-sessions/{id}/audit-events
    description: "List the append-only audit trail of one session, ordered by occurred_at ASC then created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer]
    input: ["event_type?", "limit?", "offset?"]
    output: AuditEvent[]

  - method: GET
    path: /idv/bias-audits/{id}
    description: "Read one bias audit with both disparity ratios and the cohort coverage counters."
    roles: [PlatformAdmin, ComplianceOfficer]
    input: []
    output: BiasAudit

  - method: GET
    path: /idv/bias-audits/{id}/cohort-metrics
    description: "List the cohort rows attached to one bias audit."
    roles: [PlatformAdmin, ComplianceOfficer]
    input: ["limit?", "offset?"]
    output: CohortMetric[]

errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the six declared roles"
    message: "Authentication headers missing or unrecognised."
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "the caller's role is not listed on the endpoint"
    message: "Role is not permitted to perform this operation."
  - error_id: ERR_CLIENT_SCOPE_VIOLATION
    http_status: 403
    condition: "a ClientIntegrator addresses a resource belonging to a client other than its own X-User-ID"
    message: "Client integrator may only act on its own client resources."
  - error_id: ERR_REVIEW_ASSIGNEE_MISMATCH
    http_status: 403
    condition: "a ManualReviewer other than assigned_reviewer_user_id submits the decision"
    message: "Only the assigned reviewer may decide this case."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "the acting X-User-ID also performed the paired earlier step (assignment for a review decision, evaluation for a remediation)"
    message: "The same user may not perform both steps of this control."
  - error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    condition: "no Client matches the id given in the path or body"
    message: "Client not found."
  - error_id: ERR_METHOD_PROFILE_NOT_FOUND
    http_status: 404
    condition: "no MethodProfile matches the id given in the path or body"
    message: "Method profile not found."
  - error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    condition: "no VerificationPolicy matches the id in the path"
    message: "Verification policy not found."
  - error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    condition: "no VerificationSession matches the id in the path"
    message: "Verification session not found."
  - error_id: ERR_ATTEMPT_NOT_FOUND
    http_status: 404
    condition: "no MethodAttempt matches the id in the path"
    message: "Method attempt not found."
  - error_id: ERR_PATHWAY_NOT_FOUND
    http_status: 404
    condition: "no AlternativePathway matches the id in the path"
    message: "Alternative pathway not found."
  - error_id: ERR_REVIEW_CASE_NOT_FOUND
    http_status: 404
    condition: "no ManualReviewCase matches the id in the path"
    message: "Manual review case not found."
  - error_id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    condition: "no BiasAudit matches the id in the path"
    message: "Bias audit not found."
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    condition: "body is unparseable, carries an unknown key, omits a required field, violates an enum, range, length or conditional-presence constraint, or a PATCH carries no mutable field"
    message: "Request body failed schema validation."
  - error_id: ERR_AGE_ACCURACY_UNDOCUMENTED
    http_status: 422
    condition: "the estimation profile has no band_accuracy_bps entry for the band the estimate resolves to"
    message: "Age estimation accuracy is not documented for the resolved age band."
  - error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
    condition: "the session's identity_state, or on the age axis its age_state, does not admit the operation"
    message: "Verification session state does not allow this operation."
  - error_id: ERR_ATTEMPT_STATE_INVALID
    http_status: 409
    condition: "the attempt is not AWAITING_EVIDENCE for evidence submission or not SCORED for finalisation"
    message: "Method attempt state does not allow this operation."
  - error_id: ERR_POLICY_STATE_INVALID
    http_status: 409
    condition: "the policy is not DRAFT when publication is attempted"
    message: "Verification policy state does not allow this operation."
  - error_id: ERR_PATHWAY_STATE_INVALID
    http_status: 409
    condition: "the pathway is already APPROVED, DENIED or WITHDRAWN"
    message: "Alternative pathway state does not allow this operation."
  - error_id: ERR_REVIEW_CASE_STATE_INVALID
    http_status: 409
    condition: "the case is not QUEUED for assignment or not ASSIGNED for a decision"
    message: "Manual review case state does not allow this operation."
  - error_id: ERR_AUDIT_STATE_INVALID
    http_status: 409
    condition: "the audit is not COLLECTING for cohort submission or evaluation, or not REMEDIATION_REQUIRED for remediation"
    message: "Bias audit state does not allow this operation."
  - error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    condition: "expected_client_version does not match the current Client.version"
    message: "Client version is stale; re-read the client and retry."
  - error_id: ERR_STALE_METHOD_PROFILE_VERSION
    http_status: 412
    condition: "expected_method_profile_version does not match the audited MethodProfile.version"
    message: "Method profile version is stale; re-read the profile and retry."
  - error_id: ERR_CLIENT_NOT_LIVE
    http_status: 409
    condition: "the client is not LIVE when a session is opened, or is SUSPENDED when a policy is published or an attempt is added"
    message: "Client integration state does not allow this operation."
  - error_id: ERR_PINNED_POLICY_RETIRED
    http_status: 409
    condition: "the session's pinned policy has been RETIRED"
    message: "The policy pinned to this session has been retired."
  - error_id: ERR_METHOD_RESTRICTED_BY_BIAS
    http_status: 409
    condition: "the method profile involved has bias_state == RESTRICTED"
    message: "Method profile is restricted pending bias remediation."
  - error_id: ERR_MINOR_BIOMETRIC_PROHIBITED
    http_status: 409
    condition: "biometric evidence is submitted for a session whose resolved_age_band is U13, B13_15 or B16_17"
    message: "Biometric processing is prohibited for this age band."
  - error_id: ERR_BIOMETRIC_CONSENT_REQUIRED
    http_status: 409
    condition: "biometric evidence is submitted for a session with biometric_consent == false"
    message: "Explicit biometric consent is required."
  - error_id: ERR_NO_PUBLISHED_POLICY
    http_status: 409
    condition: "the client has no PUBLISHED VerificationPolicy when a session is opened"
    message: "Client has no published verification policy."
  - error_id: ERR_METHOD_NOT_IN_POLICY
    http_status: 409
    condition: "the requested profile's method_code is outside the pinned policy's allowed_method_codes"
    message: "Requested method is not admitted by the pinned policy."
  - error_id: ERR_METHOD_NOT_DIRECTLY_ATTEMPTABLE
    http_status: 409
    condition: "the requested profile's method_code is VOUCHING_ATTESTATION or AGE_ESTIMATION"
    message: "This method cannot be attempted directly."
  - error_id: ERR_EVIDENCE_METHOD_MISMATCH
    http_status: 409
    condition: "the evidence kind does not match the attempt's method_code"
    message: "Evidence kind does not match the attempt method."
  - error_id: ERR_EVIDENCE_ALREADY_SUBMITTED
    http_status: 409
    condition: "the attempt already carries an evidence row"
    message: "Evidence has already been submitted for this attempt."
  - error_id: ERR_METHOD_PROFILE_DUPLICATE
    http_status: 409
    condition: "another MethodProfile already has the same (method_code, vendor_code)"
    message: "Method profile already exists for this vendor and method."
  - error_id: ERR_POLICY_VERSION_DUPLICATE
    http_status: 409
    condition: "another VerificationPolicy of the client already uses this policy_version"
    message: "Policy version already exists for this client."
  - error_id: ERR_COHORT_DUPLICATE
    http_status: 409
    condition: "the audit already has a CohortMetric with this cohort_code"
    message: "Cohort has already been recorded for this audit."
  - error_id: ERR_SESSION_EXPIRED
    http_status: 409
    condition: "the logical clock is past the session's expires_at"
    message: "Verification session has lapsed."
  - error_id: ERR_AUDIT_WINDOW_OVERLAP
    http_status: 409
    condition: "the requested half-open window overlaps a live audit window on the same profile"
    message: "Audit window overlaps an existing audit for this method profile."
  - error_id: ERR_NO_ELIGIBLE_METHOD
    http_status: 409
    condition: "the method selector's candidate set is empty"
    message: "No eligible verification method is available."
  - error_id: ERR_STEP_UP_LIMIT_REACHED
    http_status: 409
    condition: "step_up_round has reached the pinned policy's step_up_max_rounds"
    message: "Step-up budget for this session is exhausted."
  - error_id: ERR_ATTEMPT_PENDING_FINALIZATION
    http_status: 409
    condition: "completion is attempted while an attempt is AWAITING_EVIDENCE, SCORED or REQUIRES_RESCORE"
    message: "All method attempts must be finalised before completion."
  - error_id: ERR_PENDING_PATHWAY_BLOCKS_COMPLETION
    http_status: 409
    condition: "completion is attempted while an inclusion pathway is still pending"
    message: "A pending alternative pathway blocks completion."
  - error_id: ERR_ALTERNATIVE_PATHWAY_DISABLED
    http_status: 409
    condition: "the pinned policy has alternative_pathway_enabled == false"
    message: "Alternative pathways are disabled by the pinned policy."
  - error_id: ERR_AGE_ASSURANCE_MISSING
    http_status: 409
    condition: "completion is attempted while the policy gates on age and age_state is still PENDING"
    message: "Age assurance is required before completion."
  - error_id: ERR_INSUFFICIENT_COHORT_COVERAGE
    http_status: 409
    condition: "the audit has fewer than MIN_COHORT_COUNT in-scope cohort rows at evaluation"
    message: "Not enough demographic cohorts to evaluate disparity."
  - error_id: ERR_REVIEW_CAPACITY_EXHAUSTED
    http_status: 409
    condition: "the client has no available manual-review credit to reserve"
    message: "Manual review capacity is exhausted for this client."
  - error_id: ERR_CLIENT_DAILY_QUOTA_EXCEEDED
    http_status: 409
    condition: "the client's rolling 24h session count has reached daily_session_quota"
    message: "Client session quota for the rolling window is exhausted."

rbac:
  roles:
    - name: PlatformAdmin
      identity: opaque
      description: "Operator of the identity-verification provider: onboards clients and vendor method profiles and runs the retention sweep."
      exclusive_operations:
        - "POST /idv/clients"
        - "PATCH /idv/clients/{id}"
        - "POST /idv/method-profiles"
        - "POST /idv/retention-sweeps"
        - "POST /_clock/set_current_utc"
      shared_operations:
        - "every GET endpoint"
    - name: ClientIntegrator
      identity: "entity_backed:Client — X-User-ID is the id of the Client the integrator acts for; every addressed resource must resolve to that client"
      description: "Relying-party integration acting on its own sessions: drafts policies, opens sessions, submits evidence, requests inclusion pathways and completes sessions."
      exclusive_operations:
        - "POST /idv/verification-sessions"
        - "POST /idv/verification-sessions/{id}/method-attempts"
        - "POST /idv/method-attempts/{id}/document-captures"
        - "POST /idv/method-attempts/{id}/liveness-checks"
        - "POST /idv/method-attempts/{id}/data-evidence"
        - "POST /idv/method-attempts/{id}/finalize"
        - "POST /idv/verification-sessions/{id}/age-assurance-results"
        - "POST /idv/verification-sessions/{id}/step-up"
        - "POST /idv/verification-sessions/{id}/complete"
        - "POST /idv/verification-sessions/{id}/alternative-pathways"
      shared_operations:
        - "POST /idv/verification-policies"
        - "GET endpoints scoped to its own client"
    - name: ComplianceOfficer
      identity: opaque
      description: "Owns publication of policies and the bias-testing programme; cannot open sessions or submit subject evidence."
      exclusive_operations:
        - "POST /idv/verification-policies/{id}/publish"
        - "POST /idv/bias-audits"
        - "POST /idv/bias-audits/{id}/cohort-metrics"
        - "POST /idv/bias-audits/{id}/evaluate"
        - "POST /idv/bias-audits/{id}/remediation"
      shared_operations:
        - "POST /idv/verification-policies"
        - "every GET endpoint"
    - name: ReviewManager
      identity: opaque
      description: "Triages the manual-review queue and assigns cases, reserving review credits; may never decide a case."
      exclusive_operations:
        - "POST /idv/manual-review-cases/{id}/assign"
      shared_operations:
        - "GET /idv/verification-sessions/{id}"
        - "GET /idv/verification-sessions/{id}/manual-review-cases"
    - name: ManualReviewer
      identity: opaque
      description: "Decides the case assigned to it; segregation of duties forbids deciding a case it assigned itself, and it may not decide another reviewer's case."
      exclusive_operations:
        - "POST /idv/manual-review-cases/{id}/decision"
      shared_operations:
        - "GET /idv/verification-sessions/{id}"
        - "GET /idv/verification-sessions/{id}/manual-review-cases"
        - "GET /idv/method-attempts and its sub-resource reads"
    - name: InclusionReviewer
      identity: opaque
      description: "Adjudicates accessibility pathways for subjects without standard documentation; touches nothing else."
      exclusive_operations:
        - "POST /idv/alternative-pathways/{id}/decision"
      shared_operations:
        - "GET /idv/verification-sessions/{id}"
        - "GET /idv/verification-sessions/{id}/alternative-pathways"
  segregation_of_duties:
    - control: "manual review"
      first_step: "POST /idv/manual-review-cases/{id}/assign as ReviewManager (assigned_by_user_id)"
      second_step: "POST /idv/manual-review-cases/{id}/decision as ManualReviewer (decided_by_user_id)"
      rule: "decided_by_user_id must differ from assigned_by_user_id and must equal assigned_reviewer_user_id"
      error_id: ERR_SEGREGATION_OF_DUTIES
    - control: "bias remediation"
      first_step: "POST /idv/bias-audits/{id}/evaluate as ComplianceOfficer (evaluated_by_user_id)"
      second_step: "POST /idv/bias-audits/{id}/remediation as ComplianceOfficer (remediated_by_user_id)"
      rule: "remediated_by_user_id must differ from evaluated_by_user_id"
      error_id: ERR_SEGREGATION_OF_DUTIES
