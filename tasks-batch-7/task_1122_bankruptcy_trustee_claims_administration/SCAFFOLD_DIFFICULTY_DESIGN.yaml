            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${case_id}/avoidance_actions"
              payload: { transferee_creditor_id: "${cred_p}", transfer_date: "2025-08-01T00:00:00Z", transfer_amount_cents: 250000, action_type: "PREFERENCE_547", demand_amount_cents: 250000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { act_id: $.data.id }
            - call: "POST /trustee/avoidance_actions/${act_id}/analyze"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/avoidance_actions/${act_id}/demand"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "GET /trustee/cases/${case_id}"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { cash_before: $.data.estate_cash_on_hand_cents }
          trigger:
            - call: "POST /trustee/avoidance_actions/${act_id}/enter_judgment"
              payload: {}
              as: Court
            - call: "GET /trustee/cases/${case_id}"
              payload: {}
