              as: BoardAdjudicator
            - call: "POST /stb/abandonment-applications/${ab2}/decide"
              payload: { outcome: "GRANTED", public_convenience_finding: "SERVED" }
              as: BoardAdjudicator
            - call: "POST /stb/abandonment-applications/${ab1}/issue-trail-use-notice"
              payload: {}
              as: BoardAdjudicator
            - call: "POST /stb/abandonment-applications/${ab2}/issue-trail-use-notice"
              payload: {}
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2027-02-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stb/abandonment-applications/${ab1}/convert-to-trail-use"
              payload: {}
              as: BoardAdjudicator
            - call: "POST /stb/abandonment-applications/${ab2}/consummate-abandonment"
              payload: {}
              as: BoardAdjudicator
              captures: { err1: $.data.error_id }
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stb/abandonment-applications/${ab2}/convert-to-trail-use"
