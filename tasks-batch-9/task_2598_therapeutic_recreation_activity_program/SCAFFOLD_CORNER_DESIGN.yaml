# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2598 — Therapeutic Recreation Activity Program
#
# Walks references/claim-extraction-guide.md section by section against SCAFFOLD.yaml §1.1–§1.7.
# `section:` values and `claim_type:` values are taken only from that guide; nothing is invented.
# Corners already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as `excluded_because:`
# stubs with no test_recipe.
#
# Clock convention: the logical clock starts at 2026-08-01T00:00:00Z and only moves forward.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: resident_creation_applies_status_default
        claim_type: defaults
        grounds:
          - entities.Resident.fields.status
          - entities.Resident.fields.enrollment_gate
          - endpoints.POST_/recreation/residents
        distinguishing_aspect: "A resident POSTed without `status` is stored ADMITTED with version 1, every computed clinical mirror at its declared default and enrollment_gate NONE."
        test_recipe:
          setup:
            - "empty database, logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Default Diane", room_number: "101A", admission_date: "2026-07-01" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /recreation/residents/${res_id}"
              as: ActivityDirector
          assert:
            - "the response status is 200"
            - "Resident.${res_id}.status == ADMITTED"
            - "Resident.${res_id}.version == 1"
            - "Resident.${res_id}.enrollment_gate == NONE"
            - "Resident.${res_id}.care_plan_review_due == false"
            - "Resident.${res_id}.engagement_index == 0.0"
            - "Resident.${res_id}.refusal_streak == 0"
            - "Resident.${res_id}.absence_count == 0"
            - "Resident.${res_id}.supervision_tier == null, because no ResidentAssessment governs the resident yet"
      - name: resident_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Resident.fields.status
          - endpoints.POST_/recreation/residents
        distinguishing_aspect: "`id`, `created_at`, `updated_at` and `version` are source: system on Resident; a POST body that also carries them is accepted with those keys ignored, never echoed back."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Anchor Resident", room_number: "199Z", admission_date: "2026-07-02" }
              as: ActivityDirector
              captures: { anchor_id: $.data.id }
          trigger:
            - call: "POST /recreation/residents"
              payload: { full_name: "Spoofed Sam", room_number: "102A", admission_date: "2026-07-02", id: "res-client-chosen-id", created_at: "2020-01-01T00:00:00Z", version: 99 }
              as: ActivityDirector
              captures: { res_id: $.data.id }
          assert:
            - "the response status is 201"
            - "${res_id} != \"res-client-chosen-id\": the server minted its own id"
            - "Resident.${res_id}.version == 1, not 99"
            - "Resident.${res_id}.created_at != \"2020-01-01T00:00:00Z\": created_at is stamped from the logical clock"
            - "Resident.${res_id}.full_name == \"Spoofed Sam\""
      - name: resident_not_found_on_unknown_id
        claim_type: not_found
        grounds:
          - errors.ERR_RESIDENT_NOT_FOUND
          - validations.priority_5_ERR_RESIDENT_NOT_FOUND
        distinguishing_aspect: "A GET on a well-formed but non-existent resident id returns 404 with data.error_id ERR_RESIDENT_NOT_FOUND, not an empty 200."
        test_recipe:
          setup:
            - "empty database, so no resident id exists"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Only Resident", room_number: "103A", admission_date: "2026-07-03" }
              as: ActivityDirector
              captures: { real_id: $.data.id }
          trigger:
            - call: "GET /recreation/residents/res-00000000-0000-0000-0000-000000000000"
              as: ActivityDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "${err_id} == \"ERR_RESIDENT_NOT_FOUND\""
            - "the existing resident ${real_id} is untouched"
      - name: resident_missing_required_admission_date_rejected
        claim_type: required_fields
        grounds:
          - entities.Resident.fields.admission_date
          - validations.priority_8_ERR_INVALID_REQUEST
        distinguishing_aspect: "`admission_date` is source: input with no default, so omitting it returns 400 ERR_INVALID_REQUEST and no Resident row is created."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Control Resident", room_number: "104B", admission_date: "2026-07-04" }
              as: ActivityDirector
              captures: { control_id: $.data.id }
          trigger:
            - call: "POST /recreation/residents"
              payload: { full_name: "No Admission Date", room_number: "105A" }
              as: ActivityDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400"
            - "${err_id} == \"ERR_INVALID_REQUEST\""
            - "GET /recreation/residents returns total_count 1, namely ${control_id}"
      - name: resident_invalid_status_enum_returns_4XX
        claim_type: type_constraints
        grounds:
          - entities.Resident.fields.status
          - validations.priority_8_ERR_INVALID_REQUEST
        distinguishing_aspect: "Resident.status is constrained to {ADMITTED, ON_LEAVE, DISCHARGED}; the out-of-set literal TRANSFERRED is rejected with 400 ERR_INVALID_REQUEST rather than silently coerced to the ADMITTED default."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Enum Control", room_number: "106A", admission_date: "2026-07-05" }
              as: ActivityDirector
              captures: { control_id: $.data.id }
          trigger:
            - call: "POST /recreation/residents"
              payload: { full_name: "Bad Enum", room_number: "106B", admission_date: "2026-07-05", status: "TRANSFERRED" }
              as: ActivityDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400"
            - "${err_id} == \"ERR_INVALID_REQUEST\""
            - "no resident named \"Bad Enum\" exists; GET /recreation/residents returns total_count 1"
      - name: assessment_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ResidentAssessment
          - endpoints.GET_/recreation/assessments/{assessment_id}
        distinguishing_aspect: "ResidentAssessment is declared common_fields: false, so it exposes id and created_at but NO version and NO updated_at, and §1.5 declares no PATCH for it — the clinical record is append-only."
        test_recipe:
          setup:
            - "one ADMITTED resident with one filed assessment"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Immutable Ivy", room_number: "107A", admission_date: "2026-07-06" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MILD_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["SOCIAL"], preferred_group_size: "SMALL", effective_date: "2026-07-06" }
              as: RecreationTherapist
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "GET /recreation/assessments/${asmt_id}"
              as: RecreationTherapist
          assert:
            - "the response status is 200"
            - "the response body has no `version` key and no `updated_at` key"
            - "ResidentAssessment.${asmt_id}.superseded == false"
            - "ResidentAssessment.${asmt_id}.resident_id == ${res_id}"
            - "§1.5 declares no PATCH or DELETE whose path is /recreation/assessments/{assessment_id}, so the record cannot be edited after filing"
      - name: assessment_under_unknown_resident_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ResidentAssessment.fields.resident_id
          - validations.priority_5_ERR_RESIDENT_NOT_FOUND
        distinguishing_aspect: "The assessment is a sub-resource of Resident; filing one under a non-existent resident id returns 404 ERR_RESIDENT_NOT_FOUND before any field validation runs."
        test_recipe:
          setup:
            - "one real resident exists, so the failure cannot be blamed on an empty table"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Real Parent", room_number: "108A", admission_date: "2026-07-07" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /recreation/residents/res-00000000-0000-0000-0000-0000000000ff/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "SMALL", effective_date: "2026-07-07" }
              as: RecreationTherapist
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "${err_id} == \"ERR_RESIDENT_NOT_FOUND\""
            - "GET /recreation/assessments returns total_count 0"
      - name: session_computed_counters_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ActivitySession.fields.enrolled_count
          - entities.ActivitySession.fields.required_staff_count
          - entities.ActivitySession.fields.effective_capacity
        distinguishing_aspect: "enrolled_count, weighted_supervision_load, required_staff_count and effective_capacity are source: computed; client-supplied values are ignored and effective_capacity is derived as min(program.max_group_size, room.capacity) = 6."
        test_recipe:
          setup:
            - "one program with max_group_size 6 and one room with capacity 12, so effective_capacity must resolve to 6 and not to 12"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Computed Counters", domain: "COGNITIVE", staffing_ratio_denominator: 4, max_group_size: 6, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Big Room", capacity: 12, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T11:00:00Z", assigned_staff_count: 2, enrolled_count: 7, required_staff_count: 9, effective_capacity: 99 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ActivitySession.${sess_id}.enrolled_count == 0, not 7"
            - "ActivitySession.${sess_id}.required_staff_count == 0, not 9"
            - "ActivitySession.${sess_id}.weighted_supervision_load == 0.0"
            - "ActivitySession.${sess_id}.effective_capacity == 6, the min of program.max_group_size 6 and room.capacity 12, not 99"
            - "ActivitySession.${sess_id}.status == SCHEDULED"
      - name: residents_listing_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints.GET_/recreation/residents
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /recreation/residents honours limit and offset and reports limit, offset, total_count 3 and has_more, with has_more true on the first page of two and false on the second."
        test_recipe:
          setup:
            - "exactly three residents exist, all ADMITTED"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Page One", room_number: "301C", admission_date: "2026-07-08" }
              as: ActivityDirector
              captures: { p1_id: $.data.id }
            - call: "POST /recreation/residents"
              payload: { full_name: "Page Two", room_number: "301D", admission_date: "2026-07-08" }
              as: ActivityDirector
              captures: { p2_id: $.data.id }
            - call: "POST /recreation/residents"
              payload: { full_name: "Page Three", room_number: "301E", admission_date: "2026-07-08" }
              as: ActivityDirector
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /recreation/residents"
              payload: { limit: 2, offset: 0 }
              as: ActivityDirector
            - call: "GET /recreation/residents"
              payload: { limit: 2, offset: 2 }
              as: ActivityDirector
          assert:
            - "the first call returns 200 with response_type \"array\", 2 rows, limit 2, offset 0, total_count 3 and has_more true"
            - "the second call returns 200 with 1 row, limit 2, offset 2, total_count 3 and has_more false"
            - "the union of the two pages is exactly {${p1_id}, ${p2_id}, ${p3_id}} with no duplicates"
      - name: participation_record_retrieval_matches_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/recreation/participation/{record_id}
          - entities.ParticipationRecord.fields.status
        distinguishing_aspect: "A freshly created enrollment read back by id returns the same resident_id, session_id, status PLANNED and null outcome that the create response reported."
        test_recipe:
          setup:
            - "one ADMITTED resident enrolled in one SCHEDULED session"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Readback Rita", room_number: "109A", admission_date: "2026-07-09" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "SMALL", effective_date: "2026-07-09" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Readback Social", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Readback Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-21T10:00:00Z", ends_at: "2026-08-21T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { rec_id: $.data.id }
          trigger:
            - call: "GET /recreation/participation/${rec_id}"
              as: ActivityAide
          assert:
            - "the response status is 200"
            - "ParticipationRecord.${rec_id}.resident_id == ${res_id}"
            - "ParticipationRecord.${rec_id}.session_id == ${sess_id}"
            - "ParticipationRecord.${rec_id}.status == PLANNED"
            - "ParticipationRecord.${rec_id}.outcome == null"
            - "ParticipationRecord.${rec_id}.documented_at == null"
            - "ParticipationRecord.${rec_id}.version == 1"
      - name: participation_junction_supports_many_to_many_graph
        claim_type: graph
        grounds:
          - entities.ParticipationRecord.fields.resident_id
          - entities.ParticipationRecord.fields.session_id
          - endpoints.GET_/recreation/participation
        distinguishing_aspect: "ParticipationRecord is a true Resident x ActivitySession junction: two residents on one session and one resident on two sessions coexist, and the filtered list reads the same rows from either side."
        test_recipe:
          setup:
            - "two ADMITTED residents and two SCHEDULED sessions in a buffer-0 room"
            - "resident A is enrolled in both sessions; resident B is enrolled in session 1 only"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Graph A", room_number: "310A", admission_date: "2026-07-10" }
              as: ActivityDirector
              captures: { ra_id: $.data.id }
            - call: "POST /recreation/residents/${ra_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "LARGE", effective_date: "2026-07-10" }
              as: RecreationTherapist
            - call: "POST /recreation/residents"
              payload: { full_name: "Graph B", room_number: "310B", admission_date: "2026-07-10" }
              as: ActivityDirector
              captures: { rb_id: $.data.id }
            - call: "POST /recreation/residents/${rb_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "LARGE", effective_date: "2026-07-10" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Graph Social", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Graph Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-22T10:00:00Z", ends_at: "2026-08-22T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { s1_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-22T12:00:00Z", ends_at: "2026-08-22T13:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { s2_id: $.data.id }
            - call: "POST /recreation/sessions/${s1_id}/enrollments"
              payload: { resident_id: "${ra_id}" }
              as: ActivityAide
            - call: "POST /recreation/sessions/${s1_id}/enrollments"
              payload: { resident_id: "${rb_id}" }
              as: ActivityAide
            - call: "POST /recreation/sessions/${s2_id}/enrollments"
              payload: { resident_id: "${ra_id}" }
              as: ActivityAide
          trigger:
            - call: "GET /recreation/participation"
              payload: { resident_id: "${ra_id}" }
              as: ActivityAide
            - call: "GET /recreation/participation"
              payload: { session_id: "${s1_id}" }
              as: ActivityAide
          assert:
            - "the resident_id-filtered call returns 200 with total_count 2, one row per session"
            - "the session_id-filtered call returns 200 with total_count 2, one row per resident"
            - "ActivitySession.${s1_id}.enrolled_count == 2"
            - "ActivitySession.${s2_id}.enrolled_count == 1"
      - name: council_request_unknown_program_reference_not_found
        claim_type: graph
        grounds:
          - entities.ResidentCouncilRequest.fields.requested_program_id
          - validations.priority_6_ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: "requested_program_id is an optional cross-aggregate FK into the catalog; supplying an id no ActivityProgram owns returns 404 ERR_PROGRAM_NOT_FOUND and creates no request row."
        test_recipe:
          setup:
            - "one ADMITTED resident acting as council representative"
            - "one real ActivityProgram exists so the failure is specific to the bad id"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Council Cal", room_number: "111A", admission_date: "2026-07-11" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/programs"
              payload: { name: "Real Program", domain: "CREATIVE", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /recreation/council-requests"
              payload: { resident_id: "${res_id}", requested_domain: "CREATIVE", requested_program_id: "prg-00000000-0000-0000-0000-0000000000aa", vote_count: 6, note: "More pottery please" }
              as: CouncilRepresentative
              as_user_id: "${res_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "${err_id} == \"ERR_PROGRAM_NOT_FOUND\""
            - "GET /recreation/council-requests returns total_count 0"
            - "ActivityProgram.${prog_id}.council_preference_weight == 0"
  - section: state_machines
    instances:
      - name: session_starts_in_scheduled_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.ActivitySession
          - entities.ActivitySession.fields.status
        distinguishing_aspect: "A newly created ActivitySession is SCHEDULED with documented_at and cancel_reason null, matching the declared initial_state; no client input can seed a different state because status is source: system."
        test_recipe:
          setup:
            - "one program and one room exist"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Initial State Program", domain: "PHYSICAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Initial State Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-23T10:00:00Z", ends_at: "2026-08-23T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ActivitySession.${sess_id}.status == SCHEDULED"
            - "ActivitySession.${sess_id}.documented_at == null"
            - "ActivitySession.${sess_id}.cancel_reason == null"
            - "ActivitySession.${sess_id}.version == 1"
      - name: session_close_documentation_from_scheduled_returns_4XX
        claim_type: invalid_transitions
        grounds:
          - state_machines.ActivitySession.IN_PROGRESS_to_DOCUMENTED
          - validations.priority_11_ERR_SESSION_INVALID_STATE
        distinguishing_aspect: "CLOSE_DOCUMENTATION is declared only from IN_PROGRESS; sending it to a SCHEDULED session returns 409 ERR_SESSION_INVALID_STATE and does not fire the finalize cascade on the child ParticipationRecord."
        test_recipe:
          setup:
            - "one SCHEDULED session with one enrolled resident, clock still at its 2026-08-01T00:00:00Z default so the session has not started"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Invalid Trigger Ida", room_number: "112B", admission_date: "2026-07-12" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "SMALL", effective_date: "2026-07-12" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Invalid Trigger Program", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Invalid Trigger Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-24T10:00:00Z", ends_at: "2026-08-24T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "CLOSE_DOCUMENTATION" }
              as: ActivityAide
              captures: { err_id: $.data.error_id }
          assert:
