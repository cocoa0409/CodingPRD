            - "RegistrySubmission.${sub2_id}.attempt_number == 2, late_days == 2, penalty_fee_cents == 525 (250 * 2 = 500, escalated by 1 + 0.05 * 1)"
            - "RegistrySubmission.${sub2_id}.submission_state == \"ACCEPTED\" and RegistrySubmission.${sub_id}.submission_state == \"REJECTED\" (the first row is not rewritten)"
            - "Certificate.${cert_id}.validity_state == \"ACTIVE\" and registry_state == \"ACCEPTED\""
            - "AlcoholServer.${srv_id}.work_eligibility == \"ELIGIBLE\" and restricted_since is null and active_certificate_id == \"${cert_id}\""
            - "ServerAssignment.${asg_id}.assignment_state == \"ACTIVE\" and restriction_reason == \"NONE\" and restricted_at is null"
            - "EmployerLocation.${loc_a_id}.restricted_server_count == 0, compliance_rate_strict_pct == 100.00, compliance_rate_grace_inclusive_pct == 100.00, compliance_posture == \"COMPLIANT\""
            - "EmployerAccount.${emp_id}.account_compliance_rate_pct == 100.00"
            - "NOT compensated: DramShopDocument.${doc_id}.document_state == \"VOIDED\" and void_reason == \"COMPLIANCE_RATE_FELL_BELOW_FLOOR\""
            - "NOT compensated: EmployerAccount.${emp_id}.dram_shop_discount_status == \"EXPIRED\" (it does not return to ELIGIBLE and no new document is auto-created)"
