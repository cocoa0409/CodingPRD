              as: Underwriter
              captures: { cc_id: $.data.id }
            - call: "POST /vessels"
              payload: { name: "MV Kite", imo_number: "9100001", year_built: 2015, classification_society: "LR", flag_code: "SG", vessel_accumulation_limit_amount: 8000000 }
              as: Underwriter
              captures: { vsl_id: $.data.id }
            - call: "POST /vessels/${vsl_id}/classification-review"
              payload: {}
              as: Underwriter
            - call: "POST /open-policies"
              payload: { policy_number: "OP-SWEEP", assured_name: "Kite Trading Pte", inception_at: "2026-01-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z", freight_basis: "PREPAID", per_certificate_limit_amount: 2000000, conveyance_limit_amount: 3000000, annual_aggregate_limit_amount: 10000000, premium_rate_per_mille: 3.500, war_rate_per_mille: 0.600, strikes_rate_per_mille: 0.255, warehouse_to_warehouse: true, markup_pct: 0.10, deductible_amount: 2500 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /open-policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /certificates"
              payload: { open_policy_id: "${pol_id}", commodity_class_id: "${cc_id}", vessel_id: "${vsl_id}", loading_port_id: "${port_load_id}", discharge_port_id: "${port_disch_id}", certificate_number: "CERT-EARLY", valuation_basis: "CIF_PLUS_MARKUP", packaging_code: "EXPORT_CRATE", package_count: 120, gross_weight_kg: 18000, sailing_date: "2026-08-10T00:00:00Z", discharge_date: "2026-08-20T00:00:00Z", invoice_value: 1000000, freight_amount: 45000, duty_amount: 5000, war_cover_requested: false, strikes_cover_requested: false }
              as: Assured
              as_user_id: "${pol_id}"
