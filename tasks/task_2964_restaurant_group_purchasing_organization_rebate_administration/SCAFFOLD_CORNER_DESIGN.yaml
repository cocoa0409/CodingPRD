          rationale: "That §1.8 instance already drives ERR_LOA_PERIOD_OVERLAP on a one-second overlap and contrasts it with the touching window (effective_from == the incumbent's effective_to) that must be accepted, which is strictly stronger than a plain duplicate-window rejection."

  - section: rbac
    instances:

      - name: every_role_can_run_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.GpoAdmin.exclusive_operations
          - roles.RebateAnalyst.exclusive_operations
          - roles.DisputeArbiter.exclusive_operations
          - roles.MemberOperator.exclusive_operations
          - roles.DistributorFeed.exclusive_operations
          - roles.ManufacturerRep.shared_operations
        distinguishing_aspect: |
          One end-to-end rebate lifecycle where every hop is executed by the ONLY
          role entitled to it: GpoAdmin builds the reference data and settles,
          DistributorFeed countersigns and feeds lines, RebateAnalyst normalizes,
          accrues, reconciles, validates and audits, ManufacturerRep claims,
          MemberOperator disputes and answers evidence, DisputeArbiter requests
          evidence and decides. Every call must be a 2xx, which is the positive
          half of the RBAC matrix and the only way to prove the roles lists are
          not simply "allow everything".
        test_recipe:
          setup:
            - "Clock 2026-08-01T09:00:00Z. GpoAdmin alone builds ProgramTier ELITE, Distributor METRO-01, Member Harbor Grill, deal PBC-2026, item PBC-PATTY-4OZ and an APPROVED PER_CASE card at 150 cents, then activates the deal."
            - "The letter for Harbor Grill / METRO-01 is submitted by GpoAdmin (a shared operation) and left SUBMITTED for the distributor to countersign."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: GpoAdmin
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", signatory_name: "Dana Reyes", scope: "PURCHASE_DATA_AND_PRICING" }
              as: GpoAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: GpoAdmin
              captures: { card_id: $.data.id }
            - call: "POST /rate-cards/${card_id}/approve"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
          trigger:
            - call: "POST /authorization-letters/${l1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l1_status: $.data.status }
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
              captures: { m1_status: $.data.enrollment_status }
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { b1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88213", vendor_item_description: "BEEF PATTY 4OZ 40CT", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l1_line_id: $.data.id }
            - call: "POST /purchase-batches/${b1_id}/normalize"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /purchase-batches/${b1_id}/accrue"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "GET /accruals"
              payload: { purchase_line_id: "${l1_line_id}" }
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /manufacturer-deals/${deal_id}"
              as: ManufacturerRep
              as_user_id: "rep-01"
              captures: { deal_v: $.data.version }
            - call: "POST /manufacturer-claims"
              payload: { deal_id: "${deal_id}", expected_deal_version: "${deal_v}", period_start: "2026-06-01", period_end: "2026-06-30", claimed_units: 30, claimed_amount_cents: 4500 }
              as: ManufacturerRep
              as_user_id: "rep-01"
              captures: { cl1_id: $.data.id }
            - call: "POST /manufacturer-claims/${cl1_id}/reconcile"
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { cl1_status: $.data.status }
            - call: "POST /accruals/${a1_id}/validate"
              payload: { claim_id: "${cl1_id}" }
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { a1_status: $.data.status }
            - call: "POST /disputes"
              payload: { accrual_id: "${a1_id}", claim_id: "${cl1_id}", reason_code: "RATE_MISMATCH", disputed_amount_cents: 3274 }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /disputes/${d1_id}/request-evidence"
              as: DisputeArbiter
              as_user_id: "arbiter-01"
            - call: "POST /disputes/${d1_id}/submit-evidence"
              payload: { evidence_note: "Attaching invoice 88213 and the signed rate sheet." }
              as: MemberOperator
              as_user_id: "${m1_id}"
            - call: "POST /disputes/${d1_id}/decide"
              payload: { decision: "REJECT", decision_note: "Card 150/case applied as contracted." }
              as: DisputeArbiter
              as_user_id: "arbiter-01"
            - call: "POST /purchase-batches/${b1_id}/audit-markup"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /purchase-batches/${b1_id}/request-recovery"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /purchase-batches/${b1_id}/settle-recovery"
              payload: { outcome: "RECOVERED", recovered_cents: 300 }
              as: GpoAdmin
            - call: "GET /members/${m1_id}/savings-report"
              payload: { period_start: "2026-06-01", period_end: "2026-06-30" }
              as: MemberOperator
              as_user_id: "${m1_id}"
            - call: "POST /manufacturer-deals/${deal_id}/close-period"
              payload: { period_start: "2026-06-01", period_end: "2026-06-30" }
              as: GpoAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: GpoAdmin
          assert:
            - "every trigger call returns 2xx: no role in this lifecycle is ever refused its own operation"
            - "call 1 (DistributorFeed, exclusive): letter ${l1_id} status == ACTIVE with countersigned_at == 2026-08-01T09:00:00.000Z"
            - "call 2 (GpoAdmin, exclusive): Member.${m1_id}.enrollment_status == ACTIVE"
            - "call 3 (RebateAnalyst on a SHARED operation): the batch is created even though DistributorFeed is the other holder of POST /purchase-batches"
            - "calls 5 and 6 (RebateAnalyst, exclusive): normalization_status ACCRUED, matched_cases == 30, and accrual ${a1_id} has gross_rebate_cents == 4500, admin_fee_cents == 135, member_share_cents == 3274, gpo_retention_cents == 1091"
            - "call 9 (ManufacturerRep on a SHARED create): claim ${cl1_id} is SUBMITTED; ManufacturerRep has no exclusive operations at all, so this shared create is its only write"
            - "call 10 (RebateAnalyst, exclusive): claim status == RECONCILED with accrued_amount_cents == 4500 and variance_bps == 0"
            - "call 11 (RebateAnalyst, exclusive): accrual ${a1_id} status == VALIDATED with validated_by_user_id == analyst-01"
            - "call 12 (MemberOperator, exclusive): dispute ${d1_id} is OPEN with accrual_status_before == VALIDATED, and the accrual is now DISPUTED"
            - "calls 13 and 15 (DisputeArbiter, exclusive) and call 14 (MemberOperator, exclusive): the dispute walks OPEN -> EVIDENCE_REQUESTED -> OPEN -> REJECTED with evidence_round_count == 1, and the accrual is restored to VALIDATED"
            - "calls 16 and 17 (RebateAnalyst, exclusive): audit_status AUDIT_OVERBILLED with overbilled_cents == 300, then RECOVERY_REQUESTED"
            - "call 18 (GpoAdmin, exclusive): audit_status == RECOVERED, Member.${m1_id}.recovery_credit_cents == 300 and Distributor.${dist_id}.overbilled_recovered_cents == 300"
            - "call 19 (MemberOperator on a shared read): the savings report is returned for its OWN member id"
            - "call 20 (GpoAdmin, exclusive): accrual ${a1_id} status == PAID with basis == BLENDED_PERIOD and final_adjustment_cents == 0, and Member.${m1_id}.ytd_net_snapshot_cents == 4365 == 3274 + 1091"
            - "call 21 (GpoAdmin, exclusive): the logical clock advances to 2026-08-02T09:00:00Z, which no other role may do"

      - name: roles_cannot_run_another_roles_exclusive_operations
        claim_type: unauthorized_role
        grounds:
          - validations[priority=3]
          - errors.ERR_FORBIDDEN_ROLE
          - roles.RebateAnalyst.description
        distinguishing_aspect: |
          The role check sits at priority 3, ahead of the 404 path checks, the
          body checks and every state gate, so a refused role must produce 403
          even when the request would ALSO have failed for a business reason: an
          analyst settling a recovery on a batch that never reached
          RECOVERY_REQUESTED gets ERR_FORBIDDEN_ROLE, not ERR_INVALID_STATE.
          The pairs chosen are the ones a naive implementation conflates — analyst
          vs admin on rate-card approval and recovery settlement, admin vs analyst
          on normalization.
        test_recipe:
          setup:
            - "Clock 2026-08-01T09:00:00Z; ProgramTier ELITE; Distributor METRO-01; Member Harbor Grill still PENDING."
            - "Deal PBC-2026 is DRAFT with item PBC-PATTY-4OZ and a PROPOSED (not yet approved) PER_CASE card."
            - "Batch METRO-2026-06 was opened by the analyst and is RECEIVED and empty."
