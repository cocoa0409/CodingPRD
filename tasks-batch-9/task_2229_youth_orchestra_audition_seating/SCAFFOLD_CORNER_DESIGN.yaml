              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "GET /section-quotas/00000000-0000-4000-8000-000000000999"
              as: RegistrarStaff
              captures: { e_quota: "$.data.error_id" }
            - call: "GET /panelists/00000000-0000-4000-8000-000000000999"
