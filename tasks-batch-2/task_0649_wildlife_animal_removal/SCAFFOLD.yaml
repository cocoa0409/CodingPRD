    roles: [ComplianceOfficer]
    code: 201
    input: [common_name, code, "is_regulated?", "relocation_min_miles?", "relocation_max_miles?", "humane_check_interval_hours?", base_trap_fee_cents, "risk_weight?"]
    output: SpeciesProfile
    side_effects: []
  - method: GET
    path: "/species-profiles/{id}"
    description: "Fetch a species profile."
    roles: [ComplianceOfficer, Dispatcher, FieldTechnician, PropertyOwner]
    code: 200
    input: []
    output: SpeciesProfile
    side_effects: []
  - method: GET
    path: "/species-profiles"
    description: "List species profiles (paginated)."
    roles: [ComplianceOfficer, Dispatcher, FieldTechnician, PropertyOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: SpeciesProfile[]
    side_effects: []

  # ---- Technician ----
