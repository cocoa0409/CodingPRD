            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Ridge Line", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000, for_sale: false }, as: Artist, as_user_id: "${a1_id}", captures: { aw_a_id: $.data.id } }
          trigger:
            - { call: "POST /artworks/${aw_a_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 1200, pixel_short_edge: 800, file_bytes: 8388608, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "e001" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /artworks/${aw_a_id}/images", payload: { role: "DETAIL", format: "JPEG", pixel_long_edge: 1199, pixel_short_edge: 800, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "e002" }, as: Artist, as_user_id: "${a1_id}" }
